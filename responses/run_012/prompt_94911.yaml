prompt: |-
  ok so this is from a seminar I'm sitting in on (international criminal law, but we keep drifting into the philosophy of it) and I want to actually work out whether the analogy everyone keeps using survives contact.

  the analogy is basically built into the word. genocide = homicide with the victim swapped out: instead of a person it's a people, genos instead of homo. everyone leans on it. my prof says that's exactly why genocide is its own crime and not just mass murder on a big scale — you have to intend to destroy the group as a group, not merely intend to kill a lot of people, and that's the whole reason the law protects groups as such rather than only individuals (which apparently was the rival approach at the time: protect each person regardless of what group they happen to be in). and it's why asking whether something was genocide feels like a different question from asking whether mass atrocities were committed. the homicide picture hands you a victim, an act, an intent, a moment of death, and a threshold you either cross or you don't.

  but someone else in the seminar says the homicide picture is the problem, not the solution. Lemkin's own version of the concept was way broader — not one killing but a planned series of different actions aimed at the foundations of a group's existence: its institutions, language, culture, religion, economic existence, even the deliberate replacement of the victim group's national pattern with the perpetrator's — and the 1948 treaty narrowed all of that down to a short list of acts. so on her reading the analogy turns a slow erasure, a process, sometimes a policy running for generations, into a discrete criminal act.

  what I want is a real audit of the analogy, not a vibe. so: correspondence table first — what plays the person, the act, the intent, the corpse, the moment of death, the perpetrator — then where the mapping breaks, and then, separately, which of those breaks actually matter for the two jobs the analogy is being made to do here: (1) justifying genocide as a distinct crime with its own special intent requirement, and (2) the naming politics, where getting the label applied is the entire point and everyone in the room knows the label is doing political work (the protected-groups list is short and weirdly shaped, which is its own tell). then tell me whether those two conclusions survive once the disanalogies are on the table, or whether the analogy was carrying them the whole time. and say what the homicide picture quietly imports that just isn't present in the target.

  also: tell me if I've got Lemkin or the convention wrong anywhere, since I'm working off lecture notes. and say how confident you are in your main claims, and single out the one point you're least sure of. no citations or reading list needed, I can't get to a library this week anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is attending an International Criminal Law (ICL) seminar that is drifting into philosophy.
      *   **Core Issue:** Evaluating the "Genocide = Homicide of a Group" analogy.
      *   **Competing Views:**
          *   *Professor's View:* The analogy holds. Genocide is distinct from mass murder because the victim is the *group*, requiring specific intent (*dolus specialis*) to destroy the group as such. This justifies the separate crime.
          *   *Seminar Peer's View:* The analogy fails. Lemkin's original concept was broader (sociological/cultural destruction over time), while the 1948 Convention narrowed it to physical/biological acts. The homicide analogy forces a discrete criminal act model onto a slow process of erasure.
      *   **Task:**
          1.  Create a correspondence table (Person, Act, Intent, Corpse, Moment of Death, Perpetrator).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Evaluate if the breaks matter for two specific jobs: (1) Justifying genocide as a distinct crime (legal theory), and (2) The naming politics (labeling/atrocities).
          4.  Determine if the conclusions survive the disanalogies or if the analogy was carrying them.
          5.  Identify what the homicide picture quietly imports that isn't present in the target.
          6.  Fact-check the user's understanding of Lemkin vs. the Convention.
          7.  Provide confidence levels and identify the least certain point.
          8.  Constraint: No citations/reading list.

  2.  **Deconstruct the Analogy (Correspondence Table):**
      *   *Homicide:* Individual Human -> Killing Act -> Intent to Kill -> Corpse -> Moment of Death -> Individual Perpetrator (or state actor).
      *   *Genocide:* The Group -> The 5 Acts (Killing, causing harm, conditions, birth prevention, child transfer) -> Intent to Destroy Group -> Social Death/Disintegration -> ??? (Is it instant or gradual?) -> State/Organization (usually).

  3.  **Identify Breaks in the Mapping (Disanalogies):**
      *   *Ontology:* Individuals are biological facts; groups are social constructs. You can touch a body; a "group" is abstract.
      *   *Moment of Death:* Homicide is discrete. Genocide is often a process. When does the group "die"? When the last member dies? When culture is lost?
      *   *The "Corpse":* A dead body is evidence. A destroyed group leaves survivors who are assimilated or scattered. The "corpse" is invisible.
      *   *Intent:* Intent to kill an individual is straightforward. Intent to destroy a "group" is metaphysically tricky (what defines the group?).
      *   *Agency:* Homicide is usually individual. Genocide is almost always systemic/collective.

  4.  **Evaluate Job 1: Justifying Genocide as a Distinct Crime:**
      *   *Prof's Argument:* Needs the group to be a real entity to justify protecting it *over* the individual.
      *   *Critique:* If the group isn't a biological entity like a person, the "homicide" analogy is metaphorical. If it's metaphorical, does it hold legal weight?
      *   *Verdict:* The analogy *helps* intuitively but *hurts* legally because groups aren't legal persons in the same way. However, the *harm* to the individual (being targeted for group membership) is the bridge. The analogy survives *if* we accept the group has value independent of the sum of its parts. The disanalogy (abstract vs. concrete) weakens the "distinct crime" justification if the law requires concrete harm.

  5.  **Evaluate Job 2: Naming Politics:**
      *   *The Stake:* Calling something "genocide" triggers obligations (1948 Convention).
      *   *Analogy's Role:* Homicide implies moral clarity (murder is bad). Genocide implies ultimate evil.
      *   *Break:* Homicide is binary (dead/alive). Genocide is often gradational (cultural erosion vs. mass killing).
      *   *Verdict:* The analogy *fails* here because it creates a threshold problem. If genocide is "killing a group," then cultural destruction (Lemkin's view) doesn't count under the Convention (which focuses on physical/biological). The homicide analogy hides the political compromise of the Convention. It makes the label seem objective when it's actually highly contested.

  6.  **What does the Homicide Picture Import?**
      *   It imports *individual criminal liability* logic onto a *collective political phenomenon*.
      *   It imports *finality* (death is permanent) onto a process that might be reversible (assimilation).
      *   It imports *moral simplicity* (killer vs. victim) onto complex historical processes.

  7.  **Fact-Check Lemkin vs. Convention:**
      *   *User's understanding:* Lemkin = broader (culture, institutions, etc.); Convention = narrower (physical/biological acts).
      *   *Assessment:* This is historically accurate. Lemkin coined "genocide" in *Axis Rule in Occupied Europe* (1944). He included cultural genocide. The 1948 UN Convention excluded "cultural genocide" due to political pressure (colonial powers, USSR, etc.).
      *   *Confidence:* High.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic but accessible, matching the seminar vibe. Rigorous but not pedantic.
      *   *Structure:* Follow the user's prompt order (Table -> Breaks -> Job 1 -> Job 2 -> Imports -> Fact Check -> Confidence).
      *   *Key Insight:* The "Moment of Death" is the weakest link. A group doesn't die at a specific timestamp. This undermines the criminal law model which relies on *actus reus* occurring at a specific time.

  9.  **Refining the "Job 1" Analysis:**
      *   Does the analogy justify the *dolus specialis*? Yes, because it shifts focus from "I wanted to kill him" to "I wanted to kill *them* through him." But the "group as victim" is legally fictional. The actual victims are still individuals. So the analogy carries the weight, but it's a heavy lift.

  10. **Refining the "Job 2" Analysis:**
      *   The "naming politics" point is crucial. The homicide analogy makes genocide sound like a "crime of crimes." But if the definition is narrowed (Convention), many things that feel like "group destruction" (cultural erasure) don't fit. The analogy masks this narrowing.

  11. **Final Review against Constraints:**
      *   No citations? Check.
      *   Confidence levels? Check.
      *   Least sure point? Check. (Probably the specific philosophical implications of "social death" vs. biological death in current jurisprudence).

  12. **Self-Correction during drafting:** I need to make sure I don't just say "Lemkin was right." I need to analyze the *analogy*. The user asked for an audit of the analogy, not a history lesson. Keep the history subordinate to the philosophical audit. Ensure the distinction between the *concept* (Lemkin) and the *crime* (Convention) is clear, as the analogy bridges them poorly.

  13. **Final Polish:** Check the "Correspondence Table" for clarity. Ensure the "Quiet Imports" section is punchy. (e.g., importing the "body" as the site of harm).

  *(Self-Correction on Confidence)*: I am very confident on the Lemkin/Convention history. I am moderately confident on the philosophical implications for ICL jurisprudence, as scholars debate this endlessly. I will mark the "survival of the distinct crime justification" as the point of least certainty because it depends on normative legal theory which is inherently debatable.

