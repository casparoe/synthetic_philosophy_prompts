  *   **Yes:** **Leaf 1: The Information View (Stop).** (The money spent is relevant, but only as a clue about the future. The clue says stop).
  *   **No:** **Leaf 2: The Information View (Go).** (The money spent is relevant, but only as a clue about the future. The clue says go).

  **Q4: Is the primary reason to continue that stopping would make the past spending feel wasted?**
  *   **Yes:** **Leaf 3: The Entry Error View (Solo).** (The real error lies at the point of entry. Continuing is only sensible if it recoups entry costs; otherwise it is a mistake repeated).
  *   **No:** Go to **Q5**.

