answer: |-
  The conceptual distinction between XOR Blackmail, Newcomb's Problem, and Counterfactual Mugging lies in the **logical structure** of the correlations and the **direction of dependence** between the agent's decision and the state of the world.

  ### 1. XOR Blackmail and the Failure of Self-Knowledge to Screen Off
  In XOR Blackmail, the letter is sent if and only if $(\text{Pay} \oplus \text{Termites})$ is true. This creates a **collider structure**: both your decision to pay ($A$) and the presence of termites ($T$) causally influence whether you receive the letter ($L$).
  $$A \rightarrow L \leftarrow T$$

  **Why Self-Knowledge Fails:**
  In decision theory, "screening off" means that knowing your own action renders other evidence irrelevant. In Newcomb's Problem, knowing you are a "one-boxer" screens off the need to look in the box because your decision is logically identical to Omega's prediction (a common cause structure).

  In XOR Blackmail, however, the correlation between Paying and No Termites is an artifact of **conditioning on a collider** (receiving the letter). This is known as **Berkson's Paradox**.
  *   **Prior to the letter:** Paying and Termites are independent.
  *   **After the letter:** They become perfectly negatively correlated.

  Your knowledge that you *will* pay does not screen off the correlation because the correlation only exists *because* you received the letter. By deciding to pay, you are not influencing the termites; you are merely selecting the specific branch of reality where the blackmailer targeted you *because* you lacked termites. This is "managing the news." Advanced decision theories (like FDT) argue you should not act to manipulate evidence that is only correlated due to a selection bias imposed by a third party.

  ### 2. Counterfactual Mugging vs. XOR Blackmail
  While both problems involve logical correlations, Counterfactual Mugging licenses payment while XOR Blackmail generally does not. The difference lies in the **nature of the predictor** and the **direction of the logical link**.

  #### A. Logical Structure: Trade vs. Extortion
  *   **Counterfactual Mugging (Acausal Trade):** The correlation exists across **counterfactual branches** (Heads vs. Tails) linked by a predictor (Omega). Omega rewards your *decision algorithm*. If you pay on Tails, you logically determine that Omega predicts a "cooperative" algorithm, causing you to receive \$10,000 on Heads. You are trading a small loss in the actual world for a large gain in a counterfactual world. The correlation is **constructive**.
  *   **XOR Blackmail (Logical Extortion):** The correlation exists within the **actual world**, conditional on the blackmail attempt. The blackmailer uses the XOR rule to target you specifically when you are vulnerable or exploitable.
      *   If you are a "Payer," the blackmailer targets you when you have **No Termites** (to extract easy money).
      *   If you are a "Non-Payer," the blackmailer targets you only when you **Have Termites** (where you are already doomed).
      *   Paying does not secure a counterfactual reward; it merely makes you a frequent target for extortion in safe worlds. The correlation is **exploitative**.

  #### B. Causal Direction and Control
  *   **Mugging:** Your decision on Tails **subjunctively controls** the outcome on Heads. Your algorithm is the common cause of both the payment and the reward.
  *   **XOR:** Your decision does not control the termites, nor does it control the blackmailer's rule. It only controls which subset of worlds you inhabit *given that the letter was sent*. Since the letter is a collider, acting to influence the correlated variable (termites) is irrational.

  ### Summary
  The difference lies in whether the correlation represents a **subjunctive dependency** that the agent can leverage (Mugging/Newcomb) or a **selection bias** that the agent is being trapped by (XOR). In Mugging, you pay to define your algorithm as "reward-worthy." In XOR Blackmail, you refuse to pay to avoid defining your algorithm as "exploitable."
