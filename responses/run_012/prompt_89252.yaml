prompt: |-
  I am a novelist — my last book was set in a mill town in the 1890s, which is how I ended up as the lay member of the interpretive planning committee at our regional museum — and I have to write the committee's formal opinion before we vote on the 14th, so I would like you to draft it. The case is this. We are rebuilding the permanent gallery on the city's industrial past, and the grant that pays for half of it requires the museum to submit a finalized master narrative to the funder within six weeks; if we miss that date we lose the money and the gallery opens two years late, if at all. Two drafts are on the table. The curator's draft, 'The Long Ascent,' runs the story as a single arc: the cholera years, the sanitary campaign, the municipal waterworks, the clearance of the courts and wynds, the new hospital — and ends in a final room with panels on present-day public-health statistics and a wall of photographs of current residents, on the theory that visitors need a payoff and that the reformers deserve to be shown as having won. The community historian's draft, 'Crossroads,' covers the same events but treats each as a contingent choice with beneficiaries and losers: the clearance panel names the families displaced and the compensation they did not get; the strike panel records a defeat that stayed a defeat for forty years; one reformer is shown as also holding views we now find repellent, and the draft says so plainly rather than in a footnote. Our director objects that 'Crossroads' is one damned thing after another, that school groups will wander out unmoved, and that a permanent gallery which refuses to say whether anything was gained is not being neutral but merely coy; a major donor, whose family name is on the 1878 waterworks, has let it be known that his gift is contingent on the ascent framing surviving in the final room. My own view is that the curator's draft is exactly the thing historians complain about when they complain about Whig history, and that the community historian's draft is not innocent either — its insistence on contingency and on the cost of every gain is itself a present-day judgment about how history ought to feel, and its refusal to say that the waterworks were an improvement strikes me as a kind of cowardice dressed as rigour. What I need from you is a written opinion I can circulate to the committee, recommending one concrete course of action — adopt one draft, or adopt one with named modifications, or commission a third — with a deadline and a division of labour that will actually get a document to the funder in six weeks, and with reasons the curator, the community historian, and the director could each respond to rather than simply reject. The philosophical work I want done in it is a criterion, stated sharply enough to be applied panel by panel, for when a progress arc in a museum narrative is legitimate and when it is wishful retrospection; I would like the criterion tested against at least three specific panels — the cholera years, the clearance of the courts, and the final room — and against the question the committee has not yet faced, namely whether a permanent gallery must end in the present at all, or whether it may end in 1911 and let visitors draw the moral themselves. Please be honest about the strongest case for the ascent framing, including the director's point about coyness and the uncomfortable fact that the museum exists because of the very reforms it would be celebrating; if the criterion you propose forces me to give up something I have said I believe, say so explicitly rather than smoothing it over. Write it as a document we can act on at the meeting — under two thousand words, no citations or reading lists (I will add references myself if we publish it), and a bottom line in the first paragraph.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist, lay member of an interpretive planning committee at a regional museum.
      *   **Task:** Draft a formal opinion for the committee to circulate before a vote on the 14th.
      *   **Context:** Rebuilding permanent gallery on city's industrial past. Grant requires finalized master narrative in 6 weeks or money is lost (gallery delayed/cancelled).
      *   **Conflict:** Two drafts.
          *   *Curator's Draft ('The Long Ascent'):* Progressive arc (cholera -> sanitation -> waterworks -> clearance -> hospital). Ends with present-day stats/photos implying reformers won. Criticized as Whig history. Supported by Director (needs payoff/moral) and Major Donor (waterworks family name).
          *   *Community Historian's Draft ('Crossroads'):* Contingent choices, beneficiaries/losers, displaced families, strike defeats, flawed reformers. Criticized as "one damned thing after another," coy, unmoving for schools.
      *   **User's View:** 'Ascent' is Whig history. 'Crossroads' is also judgmental (insistence on contingency/cost) and cowardly (refusing to say waterworks were an improvement).
      *   **Requirements:**
          *   Recommend a concrete course of action (adopt one, modify, or commission third).
          *   Include deadline and division of labour (must meet 6-week grant deadline).
          *   Provide reasons Curator, Community Historian, and Director can respond to (not just reject).
          *   **Philosophical Work:** Define a sharp criterion for when a progress arc is legitimate vs. wishful retrospection.
          *   **Test Criterion:** Against three specific panels (Cholera, Clearance, Final Room) and the question of ending in the present vs. 1911.
          *   **Honesty:** Acknowledge the strongest case for 'Ascent' (Director's point on coyness, museum's existence due to reforms). If the criterion forces the user to give up a belief, state it explicitly.
          *   **Format:** Formal opinion document, actionable, under 2000 words, no citations/reading lists, bottom line in the first paragraph.

  2.  **Determine the Recommendation:**
      *   The user sees flaws in both. 'Ascent' is too Whig; 'Crossroads' is too relativistic/cowardly.
      *   Time is critical (6 weeks). Commissioning a third draft is likely too risky/slow.
      *   Best path: Adopt one with named modifications. Which one?
      *   The user leans towards avoiding Whig history but also dislikes the cowardice of refusing to acknowledge improvement.
      *   *Strategy:* Modify 'The Long Ascent' to incorporate the specificity of 'Crossroads' without losing the narrative arc. Or modify 'Crossroads' to allow for acknowledged improvements.
      *   *Decision:* Recommend adopting the Curator's 'The Long Ascent' *structure* (because it meets the grant's narrative requirement and the Director's need for coherence) but *modifying* the content using the Community Historian's evidence (displacement, flaws, costs). This bridges the gap. It acknowledges progress (waterworks *were* an improvement) without hiding the cost.
      *   *Wait, looking closer at User's View:* The user thinks 'Crossroads' refusal to say waterworks were an improvement is cowardice. This suggests the user believes some progress *was* made. But the user also hates Whig history.
      *   *Philosophical Criterion:* Needs to distinguish "legitimate progress" from "wishful retrospection."
      *   *Criterion Idea:* "Measured Gain." Progress is legitimate only when the specific metric of improvement is defined *and* the specific cost of that improvement is enumerated alongside it.
      *   *Ending:* The user asks to test the question of ending in 1911 vs. Present. The grant requires a "master narrative." Usually, funders want relevance (present day). But the Director's point about the museum existing *because* of the reforms is strong.
      *   *Recommendation:* Adopt 'The Long Ascent' framework but revise the Final Room and specific panels to meet the "Measured Gain" criterion. This satisfies the donor (waterworks framing stays), the director (narrative arc), and the community historian (costs/losers included). It satisfies the user's philosophical need (no cowardice, no Whig whitewashing).

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Bottom Line (Paragraph 1):** State the recommendation clearly. Adopt 'The Long Ascent' with specific modifications to integrate 'Crossroads' evidence, deadline, and roles.
      *   **The Crisis:** Acknowledge the grant deadline (6 weeks). No time for a third draft.
      *   **The Philosophical Criterion:** Define "Legitimate Progress vs. Wishful Retrospection."
          *   *Proposed Criterion:* A narrative of progress is legitimate only if, for every claimed improvement, the panel identifies (a) the specific metric of gain, (b) the specific population who bore the cost, and (c) the contingent nature of the decision. If any of these are missing, it is Whig history.
      *   **Testing the Criterion:**
          *   *Cholera Years:* Ascent says "sanitation saved us." Modification: Name the sanitary inspectors, but also note the burden placed on tenants vs. landlords.
          *   *Clearance:* Ascent says "slums cleared." Modification: Name the displaced families (from Crossroads), note compensation failure. Progress = health gain; Cost = homelessness/displacement.
          *   *Final Room:* Ascent says "reformers won." Modification: Acknowledge the museum's existence is a result of these reforms (Director's point), but include the unresolved stats (inequality still exists). Don't end in 1911 (loses relevance/funder requirement), but don't end in triumphalism.
      *   **Addressing the Stakeholders:**
          *   *Curator:* Keeps the arc.
          *   *Community Historian:* Gets the data/losers included explicitly, not in footnotes.
          *   *Director:* Keeps the narrative coherence and donor relationship.
          *   *User (Novelist):* Avoids Whig history without falling into relativistic cowardice.
      *   **The "Cowardice" Point:** Explicitly address the user's view that refusing to call waterworks an improvement is cowardice. The criterion must allow calling it an improvement *if* the cost is listed.
      *   **The "Museum's Existence" Point:** Acknowledge the Director's argument that the museum is a child of the reform era. Ignoring that is dishonest.
      *   **Action Plan:** Who does what by when.
      *   **Word Count Check:** Keep it tight. Under 2000 words.

  4.  **Refining the Criterion:**
      *   Needs to be sharp. "The Criterion of Enumerated Cost."
      *   Progress is not a lie, but *unqualified* progress is.
      *   Test: Can we state the improvement without using the passive voice to hide the agent of cost?
      *   Test: Does the ending acknowledge the institution's own complicity/benefit?

  5.  **Refining the Recommendation:**
      *   Adopt 'The Long Ascent' as the structural backbone (necessary for grant/donor).
      *   Integrate 'Crossroads' content into the panels (necessary for historical rigour).
      *   Final Room: Hybrid. Show progress, but show the unfinished work. Do not end in 1911 (fails grant/relevance), but do not end in triumphalism.

  6.  **Addressing the "1911" Question:**
      *   User asks to test whether it must end in the present.
      *   Argument: A permanent gallery on industrial past *must* connect to the present to justify public funding (grant requirement implies relevance). Ending in 1911 isolates the history. However, the "present" panel must not imply "history is over."
      *   Decision: Keep present day, but change the tone from "Victory" to "Legacy and Burden."

  7.  **Drafting the Content (Mental Outline):**
      *   **Header:** Standard memo format.
      *   **Para 1:** Recommendation. Adopt 'Ascent' modified by 'Crossroads' data. Deadline 4 weeks for draft, 2 for review.
      *   **Context:** Grant deadline is hard. No time for third draft.
      *   **Philosophical Core:** Define the criterion. "The Principle of Specified Cost." Progress is valid only if the cost is specified.
      *   **Application:**
          *   Cholera: Gain (life), Cost (taxes/rent shifts).
          *   Clearance: Gain (health), Cost (displacement - name families).
          *   Final Room: Gain (museum exists), Cost (ongoing inequality). Address the 1911 question (must end in present for relevance, but not triumphalism).
      *   **Stakeholder Addresses:**
          *   Director: Avoids coyness. Acknowledges museum's origin.
          *   Curator: Keeps narrative arc.
          *   Community Historian: Losers are named, not footnoted.
      *   **Self-Correction/Honesty:** Acknowledge where this compromises the user's view (e.g., accepting the 'Ascent' structure feels Whig, but necessary). Acknowledge the Director's point about the museum's existence.
      *   **Work Plan:** Curator integrates text. Historian provides data. Director manages donor.
      *   **Closing:** Vote recommendation.

  8.  **Review against Constraints:**
      *   Under 2000 words? Yes.
      *   No citations? Yes.
      *   Bottom line in first paragraph? Yes.
      *   Honest about strongest case for Ascent? Yes (Director's point).
      *   Honest about user's beliefs? Yes (cowardice point).
      *   Criterion tested on 3 panels + 1911 question? Yes.
      *   Actionable (deadline/labour)? Yes.

  9.  **Final Polish:** Ensure tone is formal but persuasive, suitable for a committee document. Ensure the "Criterion" is stated sharply.

      *   *Criterion Draft:* "A narrative of progress is historically legitimate only if every claim of improvement is paired with a specific enumeration of who paid for it and who was excluded by it."
      *   *Refinement:* Make it punchier. "The Criterion of Enumerated Cost."
      *   *1911 Question:* Be decisive. Ending in 1911 is aesthetically pure but practically fatal for the grant and intellectually dishonest about the museum's own existence.

      *   *User's Belief Check:* User thinks 'Crossroads' is cowardly for not calling waterworks an improvement. The recommendation must affirm waterworks *were* an improvement, but conditioned on the cost. This aligns with user.
      *   *User's Belief Check 2:* User thinks 'Ascent' is Whig. The recommendation modifies 'Ascent' to stop it being Whig.
      *   *Director's Point:* Museum exists because of reforms. Must include this.

      *   *Word Count Management:* Keep intros short. Focus on the criterion and the plan.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm ignoring the donor. The donor wants the "Ascent framing" in the final room. The modification must keep the framing (progress) but change the content (nuance). The donor cares about the waterworks legacy. We can honor that while acknowledging the displacement.

      *(Final check on "Bottom Line")*: It must be the very first paragraph. "I recommend we adopt..."

      *(Final check on "Honesty")*: I need to explicitly state if the criterion forces me to give up something. The user believes 'Crossroads' is cowardly. The proposed solution affirms improvement, so that belief is kept. The user believes 'Ascent' is Whig. The solution modifies it, so that belief is kept but pragmatically adjusted. I need to acknowledge that accepting the 'Ascent' structure *is* a compromise on the Whig criticism for the sake of funding. I will state that explicitly.

