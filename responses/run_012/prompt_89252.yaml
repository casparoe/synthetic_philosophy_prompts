answer: |-
  **TO:** Interpretive Planning Committee
  **FROM:** [Your Name], Lay Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Master Narrative for Industrial Gallery

  **Bottom Line:** I recommend we adopt the Curator's draft, *The Long Ascent*, as the structural framework to secure the grant, but mandate specific modifications based on the Community Historian's *Crossroads* draft to satisfy historical rigour. We must submit the finalized narrative to the funder within four weeks, leaving two weeks for board approval. The Curator will integrate the text; the Community Historian will supply the data on displacement and labour defeats; the Director will manage the donor relationship. This hybrid approach meets the deadline, retains the funding, and avoids the philosophical pitfalls of both original drafts.

  **The Constraint**
  We have six weeks. Commissioning a third draft is impossible without jeopardizing the grant and delaying the gallery by years. We must choose between the existing texts. The choice is not between truth and falsehood, but between two different modes of truth-telling. The Curator's *Ascent* offers coherence but risks myth-making. The Historian's *Crossroads* offers complexity but risks incoherence. My recommendation is to privilege the coherence required by the funder and the public, while injecting the complexity required by history.

  **The Philosophical Criterion**
  To decide where progress is legitimate and where it is wishful retrospection, I propose we apply the **Criterion of Enumerated Cost**. A narrative of progress is historically legitimate only if every claim of improvement is paired with a specific enumeration of who paid for it and who was excluded by it. If a panel claims a gain without identifying the cost-bearer, it is Whig history. If a panel identifies a cost without acknowledging the gain, it is cowardice.

  This criterion forces us to abandon the comfort of both drafts. It admits the waterworks were an improvement (rejecting the Historian's reluctance) but insists we name the families displaced to build them (rejecting the Curator's silence). It acknowledges the museum exists because of the reforms (validating the Director's point) but refuses to let that existence sanctify the methods used.

  **Testing the Criterion**
  We must apply this panel by panel.

  *1. The Cholera Years*
  *The Long Ascent* frames this as a triumph of science over nature. *Crossroads* frames it as a struggle over who pays for sanitation. Under the Criterion of Enumerated Cost, the panel must state that mortality dropped (the gain) but must also specify that the cost was borne disproportionately by tenants through increased rents, not landlords. This validates the medical progress without whitewashing the economic coercion. The Curator keeps the arc; the Historian gets the economic reality.

  *2. The Clearance of the Courts*
  This is the critical test. The Curator's draft implies slums were simply removed for health. The Historian's draft lists the displaced. The Criterion demands we do both. The panel must read: "The clearance improved public health metrics by X%, but displaced Y families without compensation." We must name the families, as the Historian requests. To do otherwise is to treat the working class as scenery rather than agents. However, we must not imply the clearance was neutral. It was an improvement in sanitation, purchased at the price of homelessness. That is not Whig history; that is history.

  *3. The Final Room and the Question of 1911*
  The committee has asked whether we should end the narrative in 1911, leaving the present unstated. The Director argues that refusing to say anything was gained is coy. The Historian implies the gains are illusory.
  I argue we must end in the present, but not with triumphalism. Ending in 1911 would be aesthetically pure but intellectually dishonest. This museum exists *because* of the civic pride generated by those reforms. To hide the present is to hide our own origin. The Director is correct: a permanent gallery that refuses to connect to the visitor's reality is not neutral; it is irrelevant.
  However, the Curator's current final room—panels of statistics and smiling residents—implies the work is finished. Under the Criterion of Enumerated Cost, the final room must show the legacy of the waterworks and hospitals *and* the persistence of the inequalities they failed to solve. We acknowledge the reformers won the battle for sanitation, but we do not declare victory over inequality. This satisfies the donor (the waterworks legacy is central) without lying about the current statistics.

  **Addressing the Stakeholders**
  *To the Curator:* You argue that *Crossroads* is "one damned thing after another." You are right that visitors need a narrative arc. This recommendation keeps your arc. However, you must accept that an arc without friction is propaganda. The Criterion of Enumerated Cost strengthens your narrative by making the victory earned rather than assumed.
  *To the Community Historian:* You argue that *Ascent* erases the losers. You are right. But your refusal to call the waterworks an improvement is, as I have noted, a kind of cowardice dressed as rigour. Clean water *was* a gain. To deny it is to privilege historical purity over human reality. This plan ensures the displaced are named on the main panel, not in a footnote. That is a concrete victory for your approach.
  *To the Director:* You worry about coyness and donor relations. You are correct that the museum is a child of the reform era. Ignoring that compromises our institutional integrity. This plan protects the donor's interest in the waterworks narrative while insulating us from future criticism by acknowledging the costs upfront. It prevents the gallery from becoming a shrine.

  **A Necessary Compromise**
  I must be honest about where this recommendation costs me something. I have argued that *The Long Ascent* is Whig history. By recommending we adopt its structure, I am accepting a Whig framework for the sake of funding and accessibility. I am prioritizing the gallery's existence over the purity of its historiography. If the Criterion of Enumerated Cost fails to be applied rigorously during the writing phase, this document will have facilitated the very whitewashing I oppose. I accept this risk because a gallery that opens with flaws can be corrected; a gallery that never opens teaches nothing.

  Furthermore, I must acknowledge the strength of the Director's argument regarding the museum's existence. I have previously treated the institution as a neutral observer. It is not. We are beneficiaries of the 1890s reforms. To end the gallery in 1911 would be to pretend we are not the heirs of the waterworks committee. We are. The narrative must own that inheritance, flaws included.

  **Division of Labour and Deadline**
  To meet the six-week grant deadline, we must operate on a four-week drafting cycle.

  *   **Week 1:** Community Historian to provide a "Cost Schedule"—a list of specific names, numbers, and displaced families for the Cholera, Clearance, and Strike panels. No prose, just verified data.
  *   **Week 2-3:** Curator to rewrite the *Ascent* draft, integrating the Cost Schedule into the main body text of each panel. No footnotes. The text must pass the Criterion of Enumerated Cost: every gain must have a named cost.
  *   **Week 4:** Committee review. We will read specifically for "wishful retrospection." If a panel claims progress without a cost, it is sent back.
  *   **Week 5-6:** Director to finalize with the funder and manage donor communications regarding the Final Room adjustments.

  **Conclusion**
  We are not choosing between a lie and the truth. We are choosing between a truth that cannot be funded and a funding that cannot be truthful. The path forward is to take the fundable structure and make it truthful through the Criterion of Enumerated Cost. We will acknowledge the waterworks saved lives. We will acknowledge they destroyed homes. We will acknowledge the museum stands on that ground.

  I move that we adopt this modified course immediately.
