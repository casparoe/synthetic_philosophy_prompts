answer: |-
  This is a classic philosophy of science puzzle. Your advisor isn't just applying a label; she is running a specific **decision procedure** derived from the later work of Thomas Kuhn (specifically *The Road Since Structure*), but she is filtering it through a specific lens regarding **ontology** vs. **mathematics**.

  Here is the reverse-engineering of her logic, an alternative rule that fits her data, and how to use the Miasma case (and a tie-breaker) to navigate your comps.

  ### 1. The Advisor's Rule (Rule A): Taxonomic Continuity
  Your advisor is running a **Taxonomic/Kind-Concept Continuity** test. This is distinct from general "incommensurability." She is looking specifically at whether the *classification hierarchy* of the world remains stable.

  *   **The Procedure:** Take the core kind-terms of Theory 1 (e.g., "Planet," "Gene," "Mass"). Ask: *Does an object that falls under Kind X in Theory 1 necessarily fall under Kind X in Theory 2, without violating the definition of the kind?*
  *   **The "No-Overlap" Principle:** If the new theory requires an object to belong to two mutually exclusive kinds (e.g., Earth is both "Stationary Center" and "Planet"), the theories are incommensurable.
  *   **Why her verdicts fit:**
      *   **Ptolemy $\to$ Copernicus:** "Planet" means "wanderer relative to Earth." In Copernicus, Earth is a planet. The extension of the term changes fundamentally. **Incommensurable.**
      *   **Phlogiston $\to$ Oxygen:** "Phlogiston" is a substance released. "Oxygen" is a substance consumed. They cannot be the same kind. **Incommensurable.**
      *   **Newton $\to$ Einstein:** "Mass" and "Force" persist as kinds. Their *properties* change (absolute vs. relative), but they don't become mutually exclusive categories. You can map Newtonian mass onto Einsteinian mass in the limit. **Commensurable.**
      *   **Mendel $\to$ Molecular:** "Gene" persists as a kind. The mechanism (DNA) is discovered to *be* the gene. The taxonomy holds. **Commensurable.**

  ### 2. The Alternative Rule (Rule B): Causal Role Continuity
  To challenge or nuance her view, you need a rule that fits her four verdicts but relies on a different metric. The strongest competitor is **Causal Role Functionalism**.

  *   **The Procedure:** Ask: *Does the entity posited by the new theory fill the same **causal/explanatory role** as the entity in the old theory?*
  *   **Why it fits her four verdicts:**
      *   **Ptolemy $\to$ Copernicus:** The Earth's causal role changes from "Fixed Anchor of the Universe" to "Moving Body." The central causal story breaks. **Incommensurable.**
      *   **Phlogiston $\to$ Oxygen:** The causal role in combustion reverses (substance leaving vs. substance entering). **Incommensurable.**
      *   **Newton $\to$ Einstein:** Mass still causes inertia and gravity. The causal role is preserved, even if the mechanism (curvature vs. force) is refined. **Commensurable.**
      *   **Mendel $\to$ Molecular:** The Gene still causes heredity. The causal role is identical. **Commensurable.**

  ### 3. The Miasma $\to$ Germ Theory Case
  Here is where the two rules diverge. This is your opportunity to show you understand the stakes.

  **The Context:** Miasma theory held that diseases (like cholera) were caused by *miasmata*—noxious vapors or "bad air" emanating from rotting organic matter. Germ theory replaced this with specific microorganisms (bacteria/viruses) often transmitted *through* air or water contaminated by rotting matter.

  *   **Rule A (Advisor - Taxonomic):**
      *   **Analysis:** "Miasma" is a kind of *vapor/substance*. "Germ" is a kind of *organism*. These are disjoint biological categories. A vapor cannot be an organism. The taxonomy of the disease agent is completely replaced.
      *   **Verdict:** **Incommensurable.**
  *   **Rule B (Alternative - Causal Role):**
      *   **Analysis:** What was the causal role of Miasma? It was the *vector transmitting disease from decay to humans*. Germ theory preserves this exact causal structure: Decay harbors Germs $\to$ Germs transmit via environment $\to$ Humans get sick. The "rotting matter" link is preserved; the "vector" role is preserved.
      *   **Verdict:** **Commensurable.**

  ### 4. The Bet: Which way will she jump?
  **Bet: She will say Incommensurable.**

  **Why:**
  1.  **The "Planet" Precedent:** Her hour-long lecture on "Planet" signals that she prioritizes **classification** over **function**. In the Ptolemy case, the *math* could predict the same positions (functional continuity), but she still called it incommensurable because the *kind* "Planet" changed.
  2.  **Ontological Commitment:** She treats "Gene" and "Mass" as commensurable because those *entities* survived. "Miasma" (the vapor itself) does not survive; it is eliminated, much like Phlogiston.
  3.  **Kuhnian Orthodoxy:** In the history of science, Miasma $\to$ Germ is often taught as a classic "paradigm shift" involving a change in what counts as a disease agent (kind-change), similar to Phlogiston $\to$ Oxygen.

  **How to defend this:**
  When you discuss Miasma, acknowledge the causal continuity (Rule B) but defer to her Taxonomic rule (Rule A). Say: *"While the causal role of the disease vector is preserved (the link between decay and sickness), the ontological category of the agent shifts from a chemical vapor to a biological organism. Following the Ptolemy/Copernicus precedent, this kind-change suggests incommensurability."* This shows you see the nuance but respect her framework.

  ### 5. The Tie-Breaker Case: Caloric Theory $\to$ Thermodynamics
  If you want to force the two rules apart in a discussion (perhaps to show you've thought deeper than just memorizing her rule), bring up **Caloric Theory**.

  *   **The Case:** 18th-century scientists believed heat was a weightless fluid called "Caloric" that flowed from hot to cold bodies. Later, Thermodynamics redefined heat as the *kinetic energy* of particles.
  *   **The Split:**
      *   **Rule A (Advisor/Taxonomic):** **Incommensurable.** "Caloric" is a substance/fluid. "Heat" is energy/motion. A fluid cannot be motion. The term "Caloric" refers to nothing (like Phlogiston).
      *   **Rule B (Causal/Structural):** **Commensurable.** The *equations* of heat flow (Fourier's Law) remained exactly the same. The causal role (flow from hot to cold) remained exactly the same. The structure of the theory was preserved even if the ontology changed.
  *   **Why use this?** If she insists Miasma is Incommensurable, ask her about Caloric.
      *   If she says Caloric is *also* Incommensurable, she is a consistent **Taxonomic Realist** (Rule A).
      *   If she says Caloric is *Commensurable* (because the math works), you can press her on why Miasma is different. (Is it because Miasma lacks the mathematical structure of Caloric?)

  **Strategic Summary for your Comps:**
  1.  **Diagnose her rule:** It is **Taxonomic Continuity** (do the kind-terms map without contradiction?), not just "change."
  2.  **Miasma Prediction:** **Incommensurable.** The entity "Miasma" is eliminated, not reduced.
  3.  **The "Aha" Moment:** Show her you know the **Caloric** case. It is the cleanest philosophical wedge between "Meaning changed" (Kuhn/Advisor) and "Structure preserved" (Structural Realism). If you can articulate why Caloric might challenge her distinction between Newton/Einstein and Miasma/Germ, you will demonstrate mastery of the material beyond her specific syllabus.
