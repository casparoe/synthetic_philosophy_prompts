  See how the river leans into the valley without being told where to fall
  The plank is crooked, clamped until it stands.
  even the strike that sends it over your head is a violence against nature, not the water's call
  The wheel is bent by fire, not by hands.
  something was there before the axes came to Ox Mountain to strip the slope bare
  A dull knife grinds on the whetstone's face.
  people look at the baldness and say there were never trees but the roots are still there in the air
  Ritual builds the human into place.
  any man could be a king if he didn't lose the thing he started with walking out the door
  The streetman becomes a Yu by design.
  it spills out unless you dam it up, unless you force it to ignore
  The grain must break to match the line.
  the tendency is soft like a sprout pushing through the frost without a sound
  No sprout grows straight without the stake.
  you don't have to make the good thing grow you just have to stop cutting it down
  The will is weak, the pattern must not break.
  look at the way the water knows the low ground without a map to show
  The wood is nothing till the steamers grow.
  anyone can walk the path if they refuse to let the shoots be trampled flat
  The sage is made by weighing this and that.
  Both hands are calloused from the daily grind
  Both seek to leave the raw self far behind.
  The whetstone sings against the dulling steel
  The sprout pushes up through the heavy meal.
  We stand alike upon the cultivated ground
  Where sagehood is the only harvest found.
  But ask the root if it chose to grow
  Or ask the clamp if it forced the bow.

