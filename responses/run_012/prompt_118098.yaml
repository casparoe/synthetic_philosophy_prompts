answer: |-
  This is an incisive diagnosis. You have correctly identified that the stalemate rests heavily on the conflation of **comparability** (the existence of a complete ordering) with **Archimedean commensurability** (the existence of a continuous trade-off rate).

  However, to call the dispute merely "verbal" would be to understate the formal and normative consequences of the Archimedean axiom. While the *word* "commensurable" is doing too much work, the choice between an Archimedean and a lexical structure is a substantive commitment with distinct mathematical and ethical costs.

  Here is a diagnosis of the dispute and a roadmap for what constitutes progress.

  ### 1. Diagnosis: Substantive Disagreement Masked by Terminological Conflation

  Your hypothesis is half-right. It is a **terminological artifact** insofar as participants often fail to distinguish between *ordinal comparability* and *cardinal substitutability*. However, it is a **substantive dispute** because the two structures imply different representation theorems and different normative vulnerabilities.

  **A. The Measurement-Theoretic Distinction**
  In formal decision theory, "commensurability" usually entails representability by a real-valued utility function $U: X \to \mathbb{R}$.
  *   **The Continuous View:** Accepts the **Archimedean Axiom**. For any pains $p$ and pleasures $q$, there exists an integer $n$ such that $n \cdot q \succ p$. This allows representation by a standard real-valued function. Pleasure and pain are mapped to the same dimension.
  *   **The Lexical View:** Denies the Archimedean Axiom. There exists some pain $p$ such that for all $q$, $p \succ n \cdot q$ for any $n$. This **cannot** be represented by a standard real-valued function. It requires a lexicographic utility function (e.g., mapping to $\mathbb{R} \times \mathbb{R}$ with lexicographic ordering) or a non-Archimedean field (e.g., hyperreals).

  Therefore, if "commensurable" means "representable by a single real number," the lexical theorist *is* denying commensurability. If it means "ordinally comparable," they are not. The impasse arises because continuous theorists assume the former is required for rational choice, while lexical theorists argue the latter is sufficient for normativity.

  **B. The Normative Stakes**
  The dispute is not just about which axioms to accept, but which **pathologies** one is willing to tolerate.
  *   **Cost of Archimedean View:** It implies the "Repugnant Trade-off." Sufficiently trivial pleasures can outweigh extreme suffering (e.g., enough "muddy thumbtack" pleasures outweigh one hour of torture). This violates many people's reflective equilibria.
  *   **Cost of Lexical View:** It introduces **discontinuity** and potential **paralysis**. If pains have lexical priority, how do we trade off small risks of extreme pain against certain moderate pain? Lexical views often struggle with decision-making under uncertainty (e.g., they can violate the Continuity axiom of von Neumann-Morgenstern, making them vulnerable to money pumps or unable to handle probabilistic trade-offs without significant modification).

  **Verdict:** The dispute is **substantive**, but it is currently obscured because parties argue past each other regarding the definition of "commensurability" rather than arguing directly about the acceptability of the Archimedean Axiom and its associated pathologies.

  ### 2. The Nature of the Question: Empirical, Formal, or Normative?

  You ask whether the residue is empirical, formal, or normative. It is all three, but they play different roles.

  1.  **Formal (The Structure):** This is settled mathematics. We know the conditions under which an ordering is Archimedean vs. Lexical. The question here is not "can we model it?" but "which model preserves the rationality constraints we care about?" (e.g., continuity vs. sensitivity to suffering).
  2.  **Empirical (The Phenomenology):** This is the most neglected front. Is there a *phenomenological* basis for the Archimedean axiom?
      *   *Hypothesis A (Common Currency):* Pleasure and pain are opposite poles of a single neural substrate (e.g., a "valence" meter). If so, the Archimedean view has empirical backing; they physically cancel out.
      *   *Hypothesis B (Distinct Systems):* Pleasure and pain are distinct systems (e.g., 'wanting' vs. 'aversive' systems). If they do not physiologically cancel, the claim that they *normatively* cancel requires a stronger argument.
      *   *Progress here:* Neuroscience of affect. If pain and pleasure are processed in non-commensurable neural circuits, the burden of proof shifts to the Archimedean theorist to explain why moral value should override phenomenological structure.
  3.  **Normative (The Axiom):** This is the core. Even if they are empirically distinct, *ought* we aggregate them? This is a question of **reflective equilibrium**. Do we value the coherence of a single utility metric more than the intuition that torture is categorically worse than mild annoyance?

  ### 3. What Counts as Progress?

  To move the field forward, you should avoid trying to prove one side "true" and instead focus on **cost-benefit analysis of the axioms**. Here is what constitutes progress:

  **A. Conceptual Clarification (Necessary but Insufficient)**
  Adopt the distinction you proposed. Stop using "commensurable." Use:
  *   **Comparability:** Is a complete ordering possible? (Both sides say Yes).
  *   **Archimedeanism:** Is there a finite trade-off rate? (The point of contention).
  *   **Metric Unification:** Are they measured on the same scale? (Implied by Archimedeanism).
  *   *Progress:* A paper that formalizes this taxonomy and forces interlocutors to state which property they are defending.

  **B. Formal Results on Decision-Theoretic Pathologies**
  The lexical view is often dismissed as "irrational" because it violates VNM Continuity.
  *   *Progress:* A representation theorem showing how a lexical view can handle **uncertainty** without succumbing to money pumps. (See work by *Alan Hájek* or *Wolfgang Spohn* on lexicographic probability). If the lexical view can be made decision-theoretically robust, the "rationality" objection dissolves.
  *   *Conversely:* Formalize the "Repugnant Conclusion" of the Archimedean view. Show precisely how much pleasure is required to outweigh specific pains to highlight the absurdity (or acceptability) of the rate.

  **C. Phenomenological/empirical Investigation**
  *   *Progress:* Investigate the **phenomenology of compensation**. When we eat a spicy pepper (pain) for the flavor (pleasure), is that a trade-off or a complex whole?
  *   If the experience is not one of "cancellation" but of "co-existence," the Archimedean model is phenomenologically inaccurate. This doesn't settle the normative question, but it removes the "obviousness" of the continuous view.

  **D. Normative "Cost" Analysis**
  *   *Progress:* Map the implications for **existential risk** and **s-risk** (suffering risk).
      *   The Archimedean view might justify risking extreme suffering for a chance at utopia (Pascal's Wager style).
      *   The Lexical view might justify paralyzing caution (preventing any risk of extreme suffering even if it guarantees the loss of all pleasure).
      *   Progress lies in showing which set of implications aligns better with our considered moral judgments in edge cases.

  ### Summary Recommendation for Your Work

  If you are writing on this, do not try to solve the dispute. Instead, **dissolve the terminological fog to reveal the axiomatic trade-off.**

  1.  **Grant your hypothesis:** Concede that "commensurability" is ambiguous.
  2.  **Pivot to the Archimedean Axiom:** Frame the debate as "To what extent do we accept the Archimedean property in value space?"
  3.  **Highlight the Price:** Show that accepting Archimedeanism buys you decision-theoretic smoothness at the cost of counter-intuitive trade-offs. Rejecting it buys you moral safety at the cost of decision-theoretic complexity (handling uncertainty/continuity).
  4.  **Propose a Hybrid:** Consider **threshold views** (weak lexicality). Perhaps below a threshold of suffering, trade-offs are Archimedean; above it, they are lexical. This avoids the paralysis of strict lexicality while avoiding the repugnance of pure Archimedeanism. (See *Krister Bykvist* or *Gustaf Arrhenius* on population ethics for similar structural moves).

  The progress lies not in declaring a winner, but in making the **cost of the Archimedean Axiom** explicit. Once both sides admit that the dispute is about whether to accept that specific axiom (and its associated pathologies), rather than about "commensurability" simpliciter, the conversation can actually advance.
