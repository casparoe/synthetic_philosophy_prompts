      *   **Topic:** Medical ethics, specifically the distinction between *withholding* (not starting) and *withdrawing* (stopping) life-sustaining treatment (LST).
      *   **Core Conflict:** The user observes a discrepancy between the *official ethical/legal doctrine* (withholding = withdrawing) and the *actual practice* (withdrawing is harder, more scrutinized, emotionally charged). They also point out the apparent contradiction in Donation after Circulatory Death (DCD) protocols, which seem to treat withdrawal as the cause of death for timing purposes, while death certificates blame the underlying disease.
