answer: |-
  The wasp you are remembering is the *Sphex ichneumoneus* (the great golden digger wasp), and the philosopher of mind who made it famous is **Douglas Hofstadter** in his 1979 book *Gödel, Escher, Bach: An Eternal Golden Braid*. He cites the entomologist Jean-Henri Fabre, who documented the behaviour you described. Hofstadter coined the term **"Sphexishness"** to describe exactly the phenomenon you have identified: the quality of being a system that appears to act with purpose but is actually trapped in a pre-programmed loop with no capacity for interruption or contextual override.

  However, "Sphexishness" describes the insect. Your worry is about the *human* equivalent, specifically the second-order version where the mechanism for changing one's mind is itself rigid. There is no single canonical term for the human, nested version of this, though it sits at the intersection of ethics, philosophy of mind, and action theory.

  Below is an analysis of the literature, the distinctions you requested, and a proposed term for the specific human variant you are wrestling with.

  ### 1. The Name and the Literature
  The primary literature begins with Hofstadter's **Sphexishness**. He uses it to illustrate the difference between "syntactic" processing (following rules) and "semantic" understanding (grasping meaning). The wasp processes the syntax of "drag prey, inspect burrow" but lacks the semantic understanding of *why* (to ensure safety).

  For the human versions you collected (the colleague, the committee), the literature shifts to **Action Theory** and **Meta-Ethics**.
  *   **The Committee:** This is close to what sociologist Robert Merton called **Goal Displacement** or **Bureaucratic Ritualism**, where adherence to the rule supersedes the purpose of the rule.
  *   **The Colleague:** This resembles what Harry Frankfurt discusses regarding **wantonness**, though inverted.
  *   **The Character:** This is the philosophical problem of **Determinism** vs. **Agency**.

  ### 2. Distinguishing Rigidity from Predictability (Your Question i)
  You ask how to tell this apart from behaviour that is merely predictable (e.g., a sensible person re-inspecting a burrow). The philosophical tool for this distinction is **Counterfactual Sensitivity**.

  *   **Predictable but Free:** A sensible agent re-inspects the burrow because they assess a risk. If you were to signal to them (reliably) that the burrow was safe, they *would* stop inspecting. Their behaviour is predictable, but it is sensitive to new information. In possible-worlds terms: in a world where the burrow is known safe, they do not inspect.
  *   **Sphexish (Rigid):** The wasp's behaviour is *insensitive* to the relevant counterfactuals. Even if the burrow is visibly unchanged, or if the prey is moved repeatedly, the stimulus (prey at threshold) triggers the routine. There is no branch in the code for "prey moved twice."

  **The Edge:** The edge lies in the **Interrupt Mechanism**. A free agent has a "stop rule" that can override the "go rule" based on novel context. A Sphexish agent has no stop rule; the routine runs to completion regardless of environmental feedback that should logically halt it.

  ### 3. First-Order vs. Second-Order Rigidity (Your Question ii)
  You distinguish between being stuck in a routine (1st-order) and being stuck in a *way of varying* routines (2nd-order). This is a profound philosophical worry.

  *   **First-Order (The Wasp):** Fixed Action Patterns. In humans, this is compulsion or habit.
  *   **Second-Order (The Novelist's Fear):** This is where the literature becomes darker. **Harry Frankfurt**, in *Freedom of the Will and the Concept of a Person* (1971), argued that free will requires **Second-Order Volitions**. A junkie wants drugs (1st order); a recovering addict *wants not to want* drugs (2nd order). Frankfurt suggests freedom is aligning your 1st-order desires with your 2nd-order desires.

  **However, your worry inverts Frankfurt.** You are asking: *What if the 2nd-order desire is also scripted?* What if the character's desire to change her mind is just another subroutine?
  *   **The Regress Argument:** This echoes **Wittgenstein's Rule-Following Paradox**. If every action requires a rule to justify it, what justifies the rule? If you need a higher rule to apply the first rule, you enter an infinite regress.
  *   **Is it Inescapable?** **Galen Strawson** argues yes, in *The Impossibility of Moral Responsibility* (1994). He posits **The Basic Argument**: To be truly free, you must be the cause of yourself (your nature, your scripts). But you cannot be the cause of yourself, because you would need a prior self to choose that nature. Therefore, no one is "ultimately responsible." If Strawson is right, your character *cannot* be genuinely free in the way you fear she isn't; *no one* is. This is **Hard Incompatibilism**.

  **Daniel Dennett** argues the opposite in *Freedom Evolves* (2003). He suggests that "Sphexishness" is a matter of degree. We are all Sphexes, but we have "buffers" and "reflective loops" that allow us to interrupt our scripts. For Dennett, freedom isn't escaping the script; it's having a complex enough library of scripts and the ability to edit them.

  ### 4. Free Will and the Novelist (Your Question iii)
  If your character's "change of mind" is a script, does she have free will?
  *   **Libertarian Free Will:** No. This view requires an uncaused cause. If her change of mind is scripted, she is a puppet.
  *   **Compatibilist Free Will:** Yes. If the script is *hers* (integrated into her psychology, not imposed by a hypnotist), she is free.

  **For the Novelist:** This is the crux. In fiction, a character who acts without a script is not "free"; they are **random**. A character who flips a coin to decide their fate is not exercising free will; they are abdicating it. Readers perceive "freedom" not as *uncaused action*, but as **authentic responsiveness**.
  *   **The Trap:** If you write a character who is truly metaphysically free (uncaused), they will appear chaotic and inconsistent to the reader.
  *   **The Solution:** You do not need to write a character who escapes the script. You need to write a character whose scripts are **deeply integrated**. The "freedom" comes from the *complexity* of the script and its *sensitivity* to the world (Counterfactual Sensitivity, again).

  ### 5. A Proposed Term: "Volitional Closure"
  While "Sphexishness" covers the insectile lack of interrupt, it feels too biological for the human, psychological recursion you describe. "Determinism" is too broad. I propose the term **Volitional Closure**.

  **Definition:** **Volitional Closure** occurs when an agent's mechanism for evaluating or changing their desires is itself causally sealed off from the very reasons that should influence it.
  *   **Distinction from Sphexishness:** Sphexishness is a lack of *perception* (the wasp doesn't "see" the loop). Volitional Closure is a lack of *access* (the human sees the loop but their mechanism for escaping it is part of the loop).
  *   **Distinction from Compulsion:** Compulsion is an external force overriding the will. Volitional Closure is the will overriding itself in a fixed pattern.
  *   **Distinction from Predictability:** A predictable agent *could* do otherwise if the reasons changed. An agent in Volitional Closure *cannot* do otherwise because their evaluation of reasons is fixed.

  **Why this term?** It captures the "closed system" aspect of your committee example (rules for rules) and your character example (scripts for changing scripts). It implies a system that is self-referential but not self-correcting.

  ### 6. Advice for the Character
  You are trying to write a character who is "genuinely free." If you interpret this as "uncaused," you will fail, because such a character would be unintelligible.

  Instead, write a character who exhibits **Counterfactual Sensitivity**.
  *   **The Test:** Ask yourself of every decision the character makes: *If the reason for this decision were removed, would the decision change?*
  *   **The Wasp:** If the burrow were known safe, the wasp still inspects. (Fails).
  *   **The Colleague:** If the objection were devastating, the colleague still replies the same. (Fails - Volitional Closure).
  *   **The Free Character:** If the reason changes, the character changes. Not randomly, but *responsively*.

  The "freedom" you are looking for is not the absence of a script. It is the presence of a **meta-script** that allows for the editing of scripts based on genuine engagement with the world. The horror you feel is that your character's meta-script might also be fixed.

  **The Philosophical Resolution:** Accept that the meta-script is fixed (we are all products of our nature), but make the *content* of that script rich enough that it looks like freedom. As Dennett argues, freedom is not a miracle; it is a level of competence. Your character is free if her scripts are complex enough to model the world, model herself, and inhibit her own impulses. That is the only freedom available to anything made of matter, wasp or woman.

  **Summary for your notes:**
  1.  **Phenomenon:** **Sphexishness** (Hofstadter/Fabre).
  2.  **Human Variant:** **Volitional Closure** (Proposed).
  3.  **Distinction:** **Counterfactual Sensitivity** (Would they do otherwise if reasons changed?).
  4.  **Literature:** Hofstadter (*GEB*), Frankfurt (Second-order desires), Strawson (The Basic Argument), Dennett (*Freedom Evolves*).
  5.  **Novelistic Application:** Do not aim for uncaused action; aim for high-resolution responsiveness. Freedom is not the absence of the loop; it is the ability to hear the music and change the dance.
