answer: |-
  ### Brainstorming the Structure

  The sestina's rigid permutation table mirrors the algorithmic nature of expected-value maximization. The end-words must shift from concrete nouns (*ward*, *hand*) to abstract magnitudes (*infinity*, *value*) as the poem progresses.
  *   **Stanza 1:** Establishes the scene. *Ward* and *hand* anchor the physical reality. *Infinity* is introduced as a distant concept.
  *   **Stanza 2 & 3:** The calculation begins. *Value* and *probability* enter the discourse. The *ticket* represents the speculative gamble.
  *   **Stanza 4 & 5:** The inversion. The abstract terms (*infinity*, *probability*) begin to dominate the concrete ones (*ward*, *hand*). The math overrides the sensory experience.
  *   **Stanza 6:** The decision. The *hand* acts, but it is driven by *probability*, not care. The *ward* is relegated to the final position, diminished.
  *   **Envoi:** The synthesis. The *hand* submits to the *probability*. The *ticket* purchases *value*. The *infinity* erases the *ward*. The form traps the speaker in the logic they have adopted.

  ***

  ### The Calculus of Care

  The lights hum low above the silent **ward**.
  I hold the budget ledger in my **hand**.
  We speak of care, but also of **infinity**.
  A decimal point shifts the **probability**.
  One purchase looks like just a lottery **ticket**.
  The other promises a stable **value**.

  But stable means finite, a capped **value**.
  The beds are full here in the concrete **ward**.
  To buy the chance is to accept the **ticket**.
  The pen rests heavy in the shaking **hand**.
  How small the number, that **probability**.
  Yet multiplied by boundless **infinity**.

  No finite sum can match the **infinity**.
  However modest, calculated **value**.
  Must yield before the sheer **probability**.
  Of saving souls beyond this breathing **ward**.
  The future waits within the open **hand**.
  I tear the stub from off the cosmic **ticket**.

  I purchase now the speculative **ticket**.
  The only rational bet on **infinity**.
  The present suffering fits within a **hand**.
  It counts for nothing in the total **value**.
  The beds will remain cold inside the **ward**.
  While numbers dance to show **probability**.

  A non-zero **probability**.
  Is all required to validate the **ticket**.
  The suffering locked inside this specific **ward**.
  Is lost within the glare of **infinity**.
  I calculate the expected **value**.
  The choice is clear within my steady **hand**.

  My signature moves across the **hand**.
  Guided by the slender **probability**.
  That defines the only true **value**.
  I trade the certain cure, the certain **ticket**.
  For the promise of an endless **infinity**.
  I turn my back upon the dying **ward**.

  This **hand** confirms the math of **probability**.
  No finite **value** justifies the **ticket**.
  Where **infinity** consumes the living **ward**.

  ***

  ### Explanatory Note

  This poem adopts the stance of the "expected-value fanatic," committing fully to the conclusion that any non-zero probability of an infinite payoff outweighs any finite certain good. The speaker does not resist the calculation; instead, the poem enacts the psychological surrender to the formalism. The sestina's repetitive structure mirrors the iterative, inescapable nature of the algorithm, dragging the speaker away from the immediate human context.

  The poem takes liberties with contested decision-theoretic concepts to sharpen the philosophical point. First, it assumes utilities are comparable across infinite scales, ignoring problems like "Pascal's Mugging" or the inability to compare infinite utilities (the "many gods" objection). Second, it treats a 1-in-a-googol probability as epistemically robust and distinct from zero, whereas skeptics argue such tiny probabilities are too uncertain to ground action. Finally, it assumes unrestricted aggregation across persons and time, prioritizing potential future beings over present, identifiable patients without discounting. The poem refuses to moralize against these assumptions, forcing the reader to inhabit the discomfort of a rationality that demands abandoning the visible for the improbable infinite.
