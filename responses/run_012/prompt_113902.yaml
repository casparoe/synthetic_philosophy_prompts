prompt: |-
  I am the model-risk lead at a company whose risk score is licensed to two public agencies: a large urban school district that uses it to rank applicants for oversubscribed seats, and a state child-welfare department that uses it to order referrals for investigation. Both agencies set their own decision thresholds, so whatever we certify about the score may not hold at the cutoff they actually operate. Our regulator has rejected our last submission as evasive — it said only that the score was 'not calibrated on any protected attribute' — and now requires a written statement, per release, of the fairness criterion the score is designed to satisfy, why the alternatives were rejected, and who bears the cost of the choice. I accept that equal calibration within groups, equal false-positive rates, equal false-negative rates, and equal selection rates cannot all hold at once when groups differ in base rate; I don't need that argued again. What I need is the procedure my team runs before each release: the questions in order, what counts as a sufficient answer to each, which steps are engineering and which are value decisions belonging to the agency rather than to us, and the point at which the procedure ends in a refusal to ship. It has to survive the case where the outcome label is a biased record of what it purports to measure — arrests rather than offences, substantiated reports rather than actual harm — and the case where a subgroup is too small for its error rates to be estimated with any confidence. Run it on both deployments, whose base rates and error costs differ, and tell me what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Model-Risk Lead.
      *   **Context:** A risk score licensed to two public agencies (Urban School District for admissions, State Child-Welfare for investigation referrals).
      *   **Problem:** Regulator rejected previous submission as "evasive" regarding fairness. Requires a written statement per release specifying: fairness criterion, why alternatives rejected, who bears the cost.
      *   **Constraints:**
          *   Acknowledge impossibility theorem (calibration, FPR, FNR, selection rates can't all hold if base rates differ).
          *   Must handle biased labels (arrests vs. offenses, substantiated vs. harm).
          *   Must handle small subgroups (insufficient data for error rate estimation).
          *   Must distinguish between engineering steps and value decisions (agency vs. vendor).
          *   Must define the "refusal to ship" point.
          *   Must apply to both deployments (School vs. Child Welfare).
          *   Must identify what the procedure *cannot* settle.
      *   **Tone:** Professional, rigorous, procedural, compliant, ethically grounded but pragmatic.

  2.  **Deconstruct the Regulatory Demand:**
      *   The regulator wants transparency on *intent* and *impact*.
      *   "Evasive" implies the previous submission hid behind technicalities or claimed neutrality where none exists.
      *   The procedure needs to be a pre-release checklist/gatekeeping process.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Phase 1: Definition & Ground Truth (Engineering/Data)*
          *   Need to define the target variable. Is it biased?
          *   Need to check subgroup sizes.
      *   *Phase 2: Metric Selection (Value/Policy)*
          *   Which fairness metric? (This is the core regulatory question).
          *   Who decides? (Agency vs. Vendor).
      *   *Phase 3: Threshold & Impact Analysis (Engineering/Value)*
          *   Agency sets thresholds, but Vendor must warn about implications.
          *   Cost of errors (False Positive vs. False Negative).
      *   *Phase 4: The "Refusal" Gate (Governance)*
          *   When do we say no?

  4.  **Addressing Specific Constraints:**
      *   *Biased Labels:* Need a step for "Construct Validity Assessment." If the label is fundamentally broken (e.g., arrests for school admissions), the model shouldn't ship.
      *   *Small Subgroups:* Need a step for "Statistical Power Check." If $N$ is too low, we can't measure disparity. Do we suppress reporting or refuse to ship? Refusal is safer for high-stakes.
      *   *Agency vs. Vendor:* Vendor builds the score; Agency sets the policy. Vendor must inform; Agency must decide. The "Written Statement" must reflect this division.
      *   *Two Deployments:*
          *   *School:* High stakes for individual (education), low immediate physical risk. False Negative (missing a deserving student) vs. False Positive (admitting a less qualified one).
          *   *Child Welfare:* High stakes for safety (harm to child) vs. liberty (family separation/investigation). False Negative (missed abuse) is usually weighted heavier than False Positive (unnecessary investigation), but racial bias in reporting is a huge confounder.

  5.  **Refining the "Fairness Criterion":**
      *   Since the regulator rejected "not calibrated on protected attribute" as evasive, we need to pick a *primary* metric but acknowledge trade-offs.
      *   *School:* Likely Equal Opportunity (equal TPR) or Predictive Parity.
      *   *Child Welfare:* Likely Error Rate Balance, but complicated by label bias.
      *   *Crucial:* The procedure must force a *choice*, not just a measurement.

  6.  **Developing the "Refusal to Ship" Criteria:**
      *   When label bias is too severe.
      *   When subgroup size prevents monitoring.
      *   When the Agency refuses to accept the cost allocation.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity and the regulatory constraint.
      *   **The Procedure (The "Pre-Release Fairness Gate"):** Numbered steps, distinguishing Engineering vs. Value.
      *   **Application to School District:** Specifics on labels, costs, metrics.
      *   **Application to Child Welfare:** Specifics on labels, costs, metrics.
      *   **The Unsettlable Questions:** Honest admission of limitations (as requested).
      *   **The Written Statement Template:** How to document this for the regulator.

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I clearly separate engineering from value?
      *   *Fix:* Explicitly label steps as [Engineering] or [Value/Policy].
      *   *Critique:* Did I handle the biased label issue?
      *   *Fix:* Add a "Construct Validity" step. If the proxy is too noisy, stop.
      *   *Critique:* Did I handle small subgroups?
      *   *Fix:* Add a "Minimum Cell Size" check. If failed, default to refusal or aggregate with warning (refusal is better for risk lead).
      *   *Critique:* Is the distinction between Vendor and Agency clear?
      *   *Fix:* Emphasize that the Vendor provides the *menu of consequences*, the Agency picks the *meal*.
      *   *Critique:* The prompt asks for "the procedure my team runs."
      *   *Fix:* Write it as an internal SOP (Standard Operating Procedure).

  9.  **Final Polish:**
      *   Ensure the tone is serious and accountable.
      *   Make sure the "Unsettlable" section is profound, not just technical.
      *   Check against the regulator's specific complaint ("evasive"). The new procedure must be direct.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a Standard Operating Procedure (SOP) for Model Release Approval. It is designed to satisfy the regulator's demand for specificity while protecting the firm from liability and ethical breach. It distinguishes between what we can measure (engineering) and what must be chosen (policy).

  ### **SOP 4.1: Pre-Release Fairness & Risk Gate**

  **Objective:** To certify that a specific release of the Risk Score satisfies a defined fairness criterion, acknowledges label limitations, and allocates error costs explicitly before deployment.
  **Applicability:** All public agency deployments.
  **Authority:** Model-Risk Lead (Final Sign-off).

  ---

  #### **Phase 1: Construct Validity & Label Integrity (Engineering)**
  *Goal: Determine if the target variable is a permissible proxy for the agency's legal mandate.*

  **Step 1.1: Label Provenance Audit**
  *   **Question:** What is the specific historical record used as $Y$ (the target), and what is the latent construct $Y^*$ (the true state) the agency claims to care about?
  *   **Sufficient Answer:** A data dictionary mapping $Y$ to $Y^*$ with a documented gap analysis.
      *   *School:* $Y$ = Prior academic performance/attendance; $Y^*$ = Future academic success.
      *   *Child Welfare:* $Y$ = Substantiated investigation; $Y^*$ = Actual maltreatment risk.
  *   **Engineering Task:** Quantify the noise/bias in $Y$. (e.g., "Substantiation rates vary by investigator workload, not just harm.")
  *   **Refusal Condition:** If the correlation between $Y$ and $Y^*$ is known to be systematically lower for a protected group (e.g., arrests used as proxy for offending in policing-adjacent data), **Refuse to Ship.**

  **Step 1.2: Subgroup Power Check**
  *   **Question:** Is there sufficient data to estimate error rates for all legally protected subgroups at the proposed operating threshold?
  *   **Sufficient Answer:** Minimum cell count $N \geq 30$ positive outcomes per subgroup in the validation set.
  *   **Engineering Task:** Calculate confidence intervals for FPR/FNR per group.
  *   **Refusal Condition:** If any protected subgroup falls below the threshold *and* the agency refuses to aggregate categories or accept "unmonitored" status in writing, **Refuse to Ship.** We do not deploy blind.

  ---

  #### **Phase 2: Cost & Criterion Selection (Value/Policy)**
  *Goal: Force the agency to select the fairness metric and accept the trade-offs. We provide the menu; they order the meal.*

  **Step 2.1: Error Cost Assignment**
  *   **Question:** What is the relative cost of a False Positive (FP) vs. a False Negative (FN) for this specific deployment?
  *   **Sufficient Answer:** A written ratio $C_{FN} / C_{FP}$ signed by the Agency Head of Policy.
      *   *School:* FN = Denied opportunity; FP = Oversubscription management. Usually $C_{FN} > C_{FP}$.
      *   *Child Welfare:* FN = Uninvestigated harm; FP = Unnecessary family intrusion. Usually $C_{FN} \gg C_{FP}$, but constrained by resource capacity.
  *   **Vendor Role:** We provide the confusion matrix at various thresholds.
  *   **Agency Role:** They declare the cost function.
  *   **Refusal Condition:** If the agency claims "all errors are equal" or refuses to quantify costs, **Refuse to Ship.** Neutrality is a value judgment we will not encode.

  **Step 2.2: Fairness Criterion Selection**
  *   **Question:** Which single fairness metric is the primary constraint for this release?
  *   **Sufficient Answer:** Selection of *one* from the following, with written acknowledgment of the violation of others due to base rate differences:
      1.  **Calibration:** (Score $X$ means same risk $P(Y|X)$ across groups). *Preferred for risk estimation.*
      2.  **Equalized Odds:** (Equal TPR and FPR across groups). *Preferred for equal opportunity.*
      3.  **Predictive Parity:** (Equal PPV across groups). *Preferred for resource efficiency.*
  *   **Vendor Role:** We simulate the trade-offs. (e.g., "Choosing Equalized Odds will reduce Calibration by X%.")
  *   **Agency Role:** They select the constraint.
  *   **Refusal Condition:** If the agency demands simultaneous satisfaction of incompatible metrics (e.g., Calibration + Equalized Odds with differing base rates), **Refuse to Ship.**

  ---

  #### **Phase 3: Threshold & Operationalization (Engineering/Policy Interface)**
  *Goal: Ensure the agency's threshold does not invalidate the certification.*

  **Step 3.1: Threshold Sensitivity Analysis**
  *   **Question:** Does the fairness certification hold at the specific cutoff the agency intends to use?
  *   **Sufficient Answer:** A plot showing the selected fairness metric stability across the 10th–90th percentile of score thresholds.
  *   **Engineering Task:** Verify that the chosen metric (from 2.2) does not degrade precipitously at the agency's operational cutoff.
  *   **Refusal Condition:** If the metric holds globally but fails catastrophically at the agency's specific cutoff, **Refuse to Ship** unless the agency adjusts the cutoff.

  **Step 3.2: Cost Bearer Declaration**
  *   **Question:** Who absorbs the harm of the inevitable residual disparity?
  *   **Sufficient Answer:** A "Statement of Residual Risk" included in the contract.
      *   *Example:* "By selecting Equalized Odds, Group A will experience a 5% higher False Positive Rate. The Agency accepts liability for this disparity."
  *   **Vendor Role:** Draft the statement.
  *   **Agency Role:** Sign the statement.
  *   **Refusal Condition:** If the agency refuses to acknowledge who bears the cost, **Refuse to Ship.**

  ---

  ### **Application to Deployments**

  #### **Deployment A: Urban School District (Admissions)**
  *   **Label Bias:** $Y$ is prior grades/test scores. Bias exists (resource inequality), but it is the legal mandate to use academic merit. *Verdict:* Proceed with Step 1.1 disclosure.
  *   **Subgroups:** Likely sufficient $N$.
  *   **Costs:** $C_{FN}$ (denying a deserving student) is high. $C_{FP}$ (admitting a student who struggles) is moderate.
  *   **Criterion:** **Equal Opportunity (Equal TPR).** The district's mandate is to identify talent equally across neighborhoods.
  *   **Trade-off:** Calibration will differ. A score of 0.8 in Group A may not mean the same success probability as 0.8 in Group B.
  *   **Cost Bearer:** The students in the group with lower Positive Predictive Value (PPV) who may struggle more once admitted. The District must acknowledge this.

  #### **Deployment B: State Child-Welfare (Referrals)**
  *   **Label Bias:** $Y$ is "substantiated report." This is heavily biased by reporter behavior (teachers, doctors, neighbors) and investigator discretion. *Verdict:* High risk in Step 1.1. We must disclose that the model predicts *system contact*, not necessarily *harm*.
  *   **Subgroups:** Minority groups may have low base rates of *substantiation* but high rates of *reporting*. Small cell sizes for severe harm outcomes are likely. *Verdict:* Strict Step 1.2 enforcement. If $N$ for severe harm in a subgroup is <30, we cannot validate FNR.
  *   **Costs:** $C_{FN}$ (missed abuse) is existential. $C_{FP}$ (unnecessary investigation) is traumatic and resource-intensive.
  *   **Criterion:** **Calibration.** In child welfare, a risk score of 0.9 must mean 90% risk regardless of race, otherwise resources are misallocated. Equalizing FPR could mean ignoring high-risk cases in one group to match another.
  *   **Cost Bearer:** Families in groups with higher base rates of reporting will be investigated more frequently at the same threshold. The State must acknowledge this disparity is driven by base rates, not model bias.

  ---

  ### **What This Procedure Cannot Settle**

  You asked for the limits of this procedure. These are the points you must include in the "Limitations" section of your written statement to the regulator.

  1.  **The "Bias in, Bias out" Dilemma:**
      The procedure can measure bias in the *model*, but it cannot correct for bias in the *world*. If the School District's prior grades are biased by under-resourced schools, a perfectly calibrated model will perpetuate that inequality. We can disclose this (Step 1.1), but we cannot fix it mathematically without changing the target variable.

  2.  **The Small-Subgroup Black Box:**
      If a subgroup is too small for statistical confidence (Step 1.2), the procedure forces a refusal. However, it cannot tell you if the model is fair for that group; it can only tell you that you are flying blind. The regulator may view "Refusal" as an admission that the model is unsafe for everyone, which is a commercial risk we cannot settle internally.

  3.  **The Agency's "True" Objective:**
      The procedure relies on the Agency honestly declaring their cost function (Step 2.1). If the Child Welfare department claims $C_{FN} \gg C_{FP}$ but internally operates under a budget cap that forces them to ignore high-risk cases, our certification is valid mathematically but void operationally. We cannot audit their internal budget politics.

  4.  **Dynamic Feedback Loops:**
      This procedure validates the model at release ($T_0$). It cannot settle what happens at $T_1$. If the School District uses the score to deny admission, those denied students will have worse outcomes, reinforcing the training data for the next version. We can warn of this, but we cannot prevent it without control over the deployment policy.

  ### **The Written Statement Structure (For the Regulator)**

  Per your requirement, every release will include:

  1.  **Certified Criterion:** "This release optimizes for [Metric X]."
  2.  **Rejected Alternatives:** "Metrics [Y] and [Z] were rejected because [Reason: e.g., incompatible with base rates/agency mandate]."
  3.  **Cost Allocation:** "Residual disparity in [Error Type] falls on [Group]. The Agency has accepted this cost in writing (Ref: Contract Appendix B)."
  4.  **Label Warning:** "The target variable [Y] is a proxy for [Y*]. Known biases include [List]."
  5.  **Validity Scope:** "Certification is valid only for thresholds between [A] and [B]. Subgroups smaller than [N] are excluded from error rate guarantees."

  **Final Gate:** If any of the above five bullets cannot be completed truthfully, the Model-Risk Lead executes the **Refusal to Ship**.
