      *   *The "Ontological" Definition:* The draft defines ontological as "literally returns to earlier states." Spengler does *not* think Culture A returns to Culture A. He thinks Culture A goes through stages similar to Culture B. That is Typological by the draft's own definition! This is a fatal internal contradiction.
