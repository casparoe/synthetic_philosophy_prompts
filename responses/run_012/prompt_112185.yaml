          *   *Ibn Khaldun:* Draft says typological/providential. *Critique:* Khaldun's *asabiyyah* is sociological, but his view of time is deeply Islamic (providential/linear towards Judgment). Calling it "typological" risks secularizing him too much. Does he believe history *literally* repeats or that human nature causes similar outcomes? The latter is typological, but the theological substrate matters.
          *   *Spengler:* Draft says ontological (organismic, determinate lifespan). *Critique:* This is mostly accurate. Spengler is morphological. However, the "millennium" claim needs nuance. It's not a calendar year count, but a morphological stage.
          *   *Toynbee:* Draft says ontological but retreats to agency. *Critique:* Toynbee is notoriously difficult to pin down. He moves from challenge-response to religious teleology. Placing him firmly on the "ontological" axis with Spengler is risky. Toynbee explicitly rejected Spengler's biological determinism. This is a potential weak point in the argument.

      *   **Point 2: The Framework (Three Axes)**
          *   *Ontological vs. Typological:* This is the crux. Does this distinction hold water? "Ontological cyclicity" implies time itself loops (Nietzsche's Eternal Return). "Typological" implies events look alike.
          *   *Critique:* Spengler doesn't believe time loops (Eternal Return). He believes cultures are discrete organisms born and dying in linear time. So calling him "ontologically cyclical" is misleading. He is *morphologically* cyclical within a *linear* temporal container. The draft conflates "life-cycle of an entity" with "cycle of time." This is a major conceptual error.
