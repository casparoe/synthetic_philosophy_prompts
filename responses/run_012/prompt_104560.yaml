answer: |-
  This is a classic case of a formal theorem being imported into epistemology without checking the boundary conditions. Your suspicion is correct: "No Free Lunch" (NFL) is doing too much heavy lifting in that Discord thread.

  Wolpert's NFL theorems (1996) are mathematically sound results in supervised learning theory. Hume's Problem of Induction is a philosophical problem about justification. Bridging them requires moving from "what is mathematically possible across all functions" to "what is rational to believe in this universe."

  Here is a menu of the specific claims being smuggled under the label "NFL solves induction," sorted from mathematical triviality to controversial metaphysics. You can paste this directly into the thread to force precision.

  ***

  ### The "No Free Lunch" Menu: Candidate Claims & Verdicts

  **1. The "You Can't Get Something From Nothing" Claim**
  *   **The Claim:** NFL proves that no learning algorithm can outperform random guessing when averaged over *all possible* data-generating distributions. Therefore, learning is impossible without inductive biases (assumptions about the data).
  *   **Status:** **Mathematically True.**
  *   **Does it solve Hume?** **No.** It confirms Hume's suspicion (that data doesn't logically entail theory), but it doesn't justify *why* we should trust the biases we actually have. It establishes the *necessity* of assumptions, not the *validity* of them.
  *   **Verdict:** A platitude in learning theory. If your Discord friends stop here, they are just restating Hume in math jargon.

  **2. The "All Biases Are Created Equal" Claim**
  *   **The Claim:** Because all algorithms perform equally averaged over all possible worlds, no specific inductive bias (e.g., "simplicity," "smoothness") is objectively better than any other *a priori*.
  *   **Status:** **Mathematically True (with caveats).**
  *   **Does it solve Hume?** **No, it makes it worse.** If all biases are equal *a priori*, then choosing "the future will resemble the past" is no more rational than choosing "the future will be the opposite of the past." This leads to skepticism, not justification.
  *   **Verdict:** True within the theorem's scope, but often misused to imply we should be indifferent between biases in *practice*.

  **3. The "Category Error" Dissolution**
  *   **The Claim:** Hume asked for a non-circular justification for induction. NFL shows such a justification is mathematically impossible (see Claim 1). Therefore, asking for it is a category error. We must simply accept that priors are prerequisites for learning, not conclusions derived from it.
  *   **Status:** **Philosophically Defensible (Strawsonian/Pragmatic).**
  *   **Does it solve Hume?** **Yes, by dissolving the question.** This argues that "justification" is the wrong game. We have priors (evolutionarily, cognitively); they allow us to survive; demanding a guarantee they are "true" is incoherent because you can't evaluate priors without using priors.
  *   **Verdict:** This is likely the *actual* argument your friends want to make. It's a pragmatic vindication, not a logical proof. It is contested by realists who want to know if our priors track reality.

  **4. The "Universe is Special" Claim**
  *   **The Claim:** NFL applies to *all possible* functions, but we don't live in *all possible* worlds. We live in one where simple patterns hold. Therefore, biases favoring simplicity (Occam's Razor) are justified because our universe is compressible.
  *   **Status:** **Substantive Empirical Claim.**
  *   **Does it solve Hume?** **Only if you beg the question.** To say "our universe is compressible" is just to restate the Principle of Uniformity of Nature. NFL doesn't prove the universe is compressible; it just says *if* it isn't, you can't learn.
  *   **Verdict:** This shifts the burden from "justify induction" to "justify why the world is learnable." NFL doesn't do that work; physics/cosmology does.

  **5. The "Solomonoff Sidestep" Claim**
  *   **The Claim:** (Common in LW circles) NFL doesn't apply to Solomonoff Induction because SI restricts the hypothesis space to *computable* distributions, not *all* distributions. Therefore, we *do* have a universally optimal learner for our specific class of universe.
  *   **Status:** **Technically Nuanced.**
  *   **Does it solve Hume?** **Partially.** It provides a gold standard for reasoning *given* the assumption that the universe is computable. But it pushes the Humean problem back one step: Why assume the universe is computable?
  *   **Verdict:** Stronger than Claim 1, but still rests on an unproven metaphysical assumption (Computable Universe Hypothesis).

  ***

  ### Diagnosis: What Work Is Actually Being Done?

  When someone says "NFL solves induction," they are usually conflating **Claim 1** (Math) with **Claim 3** (Philosophy).

  1.  **The Math (Claim 1)** is used to bludgeon the opponent: "See? You can't prove induction works without assumptions!"
  2.  **The Philosophy (Claim 3)** is then slipped in: "Therefore, having assumptions is enough, and you're being irrational by asking for more."

  **The Overreach:**
  The theorem is often used to imply **Claim 2** ("All biases are arbitrary") to defend **Claim 4** ("So my bias is as good as yours"). This is false. While all biases are equal over *all possible worlds*, they are not equal over *this* world. If your bias is "gravity reverses every Tuesday," NFL agrees you can't prove it wrong *a priori*, but it doesn't mean it's rational to hold it *a posteriori*.

  **The Consensus Gap:**
  *   **Settled:** You cannot learn without inductive bias (NFL Theorem).
  *   **Settled:** You cannot justify inductive bias without circularity (Hume).
  *   **Contested:** Whether acknowledging this circularity counts as a "solution" (Pragmatists say yes; Skeptics/Realists say no).
  *   **Contested:** Whether the "bias" we need is merely a computational constraint or a truth-tracking feature of the mind.

  ### How to Reply in Thread

  If you want to move the conversation forward, suggest this distinction:

  > "NFL proves we *need* priors (Hume agrees). It does not prove our *actual* priors are reliable (Hume's worry). If you're arguing that 'needing priors dissolves the demand for justification,' that's a pragmatic stance (Strawson), not a result of Wolpert's theorem. If you're arguing 'NFL shows all priors are equal so mine is fine,' that's a misapplication of the theorem to the actual world. Which claim are you making?"

  **Summary Verdict:** NFL validates Hume's skepticism; it does not refute it. It only "solves" the problem if you accept a pragmatic dissolution of justification (Claim 3), which is a philosophical choice, not a mathematical theorem.
