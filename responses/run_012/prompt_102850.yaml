answer: |-
  **Scenario**
  Dr. Aris, a clinic director in a resource-war zone, can falsify a single digital signature to unlock emergency funding that will save 5,000 refugees from immediate starvation; the fraud is cryptographically undetectable, will never be discovered, and carries zero risk of reputational damage or future precedent-setting, guaranteeing a net external welfare gain of 10,000 utility units with no negative ripple effects on society.

  **Analysis**
  The act-utilitarian (AU) mandates the fraud: the stipulated welfare numbers are fixed, the external consequences are purely positive, and intention is morally irrelevant except as a predictor of future acts, which here are ruled out by stipulation. The Buddhist consequentialist (BC) forbids it: while acknowledging the 10,000 units of samsaric welfare, the BC counts the *cetana* (intention) to deceive as a karmic seed that immediately degrades the agent's mindstream, reinforcing the defilements (greed, hatred, delusion) that bind one to suffering. **I am counting rebirth as a real consequence** in the primary case, meaning the karmic ripening extends the agent's exposure to suffering across future lifetimes, mathematically outweighing the finite welfare of 5,000 temporary lives. **If you switch rebirth off,** the case still holds, but the justification shifts from infinite temporal horizon to **lexical priority**: Buddhist doctrine treats the cultivation of wisdom (liberation) as lexically superior to the accumulation of samsaric happiness. An act that trades liberative potential for temporary welfare is consequentially irrational because it sacrifices the only cure for suffering to alleviate symptoms.

  The single feature doing the work is **the incommensurability of value types**. Standard utilitarianism is monistic; it must convert all goods (welfare, purity, enlightenment) into a single currency of "utility" to perform the calculus. Buddhist consequentialism is pluralistic/lexical; it asserts that *nirvanic* potential cannot be traded against *samsaric* welfare without category error. If you strip this feature out—forcing the Buddhist to accept that enlightenment is just another commodity to be weighed against starving refugees—the case collapses into a boring standoff where the Buddhist simply claims the "karmic cost" is higher than the "welfare gain," which the utilitarian can always dispute by adjusting the utility weights.

  A defender of the utilitarian side would try to defang the case by arguing that **suffering is suffering**, regardless of its metaphysical source. They would claim that positing a "lexical" good is just deontology in consequentialist clothing, and that if the Buddhist truly cared about consequences, they would admit that 5,000 preventable deaths is a greater concrete evil than one agent's abstract spiritual degradation. They would demand the Buddhist quantify the "loss of enlightenment" in units of suffering, forcing the incommensurable back into the utilitarian ledger.
