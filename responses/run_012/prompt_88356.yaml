prompt: |-
  I'm in a statutory interpretation seminar and I'm supposed to write a short paper on whether textualism and purposivism are actually different theories or just the same theory with different rhetorical dressing, and every example I keep reaching for is one of the warhorses everyone already knows, so I want a fresh case built to order instead. Please invent a realistic but fictional statute — don't use a real one, don't cite real cases or tell me what any actual court did, I can't look anything up and I don't want you guessing at holdings — and then engineer a fact pattern under it where a committed textualist and a committed purposivist reach opposite verdicts. Here's the hard part, and it's the whole point: I don't want the easy version where the drafters made an obvious slip, because there everyone agrees the text is just wrong and the purpose wins and the case proves nothing. I want the opposite setup. The enacting legislature actually meant what it wrote — the people who voted for it, if you asked them, would say the literal result is exactly what they were after — and yet a serious purposivist still has to come out the other way, on the ground that the statute's object or function as it operates now points somewhere else. So actual intent lines up with the plain text, and purpose does not. And the purposivist can't weasel out of it through the usual escape hatches: no scrivener's error, no absurdity canon, and the result has to be a real but tolerable policy loss, not something that makes the statute collapse entirely or get somebody killed. The words also have to be genuinely unambiguous on their face — if there's any vagueness or ambiguity to resolve, the textualist just resolves it by consulting purpose and the whole thing falls apart. Same for fair notice or due process escapes.

  Keep the setting boring and plausible — a state licensing scheme, a municipal ordinance, a tax credit, a public records rule, something like that. Not a constitutional provision, not an emergency, not a war. One short paragraph for the scenario, then the analysis.

  After the scenario, give me the statutory language and the facts, then walk through what each theory says and why, step by step, so I can see the verdicts coming out of the theories rather than you just announcing them. Then tell me which single feature of the case is doing the work — my hunch is it'll be the level of generality the purposivist picks when they state the statute's purpose, but if it's something else, say so and say why — and what happens if you take that feature away: does the case collapse back into the boring version where the two theories agree? Then the part I actually care about: how would a sharp purposivist attack the case? What's their best move, and does it work, or does it just show that purposivism needs the text more than it admits? And flip it — what's the textualist's best defense of the literal reading besides "the words say so"?
