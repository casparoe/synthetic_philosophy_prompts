answer: |-
  **Scenario**
  A midwestern state enacts a tax credit to lower operating costs for small businesses, specifically targeting heating expenses which were spiking due to old infrastructure. The legislature, under pressure from a strong local natural gas lobby, deliberately limits the credit to gas-fired systems, even though electric heat pumps were available at the time. Twenty years later, geothermal heat pumps are significantly cheaper and cleaner than gas, but the statute remains unchanged. A small business installs a geothermal system and claims the credit. The state denies it. The business sues. The text is clear, the original intent was protectionist, but the stated statutory goal is cost reduction.

  **Statutory Language and Facts**
  **Statute:** The *Small Business Heating Relief Act* (2004).
  **Section 1 (Purpose):** "The purpose of this Act is to reduce the financial burden of commercial heating on small enterprises within the State."
  **Section 3 (Eligibility):** "To qualify for the Credit, a business must install a heating unit that derives at least 80% of its thermal output from the combustion of natural gas. No other fuel source or technology shall be eligible."
  **Facts:** In 2024, *Main Street Bakery* installs a high-efficiency geothermal heat pump. The system reduces their heating bills by 60%, compared to the 35% reduction a new natural gas boiler would provide. The geothermal system emits no carbon; the gas boiler does. The legislative history from 2004 confirms the sponsors explicitly rejected an amendment to include "electric or alternative thermal systems" because they wanted to ensure the subsidy benefited the state's natural gas extraction sector. There is no ambiguity in the phrase "combustion of natural gas." Geothermal does not involve combustion. Denying the credit costs the bakery $15,000 annually, a significant but not existential loss.

  **Analysis**

  **The Textualist Verdict: Deny the Credit**
  The textualist begins with the text of Section 3. The phrase "combustion of natural gas" is semantically unambiguous; geothermal heat pumps transfer heat rather than generating it through combustion. The modifier "No other fuel source or technology shall be eligible" operates as an express exclusionary clause, foreclosing any implication that other technologies might qualify. Because the text is clear, the textualist refuses to consult legislative history to find ambiguity, but notes that the history confirms the text was not a mistake. The legislature made a policy choice to tie relief to gas consumption. While the result may be suboptimal regarding the Section 1 purpose of "financial burden," the textualist argues that Section 1 is a preamble, while Section 3 is the operative command. When an operative command conflicts with a general purpose statement, the command controls. The court cannot rewrite the statute to fix a policy choice the legislature made deliberately, even if that choice is now economically inefficient.

  **The Purposivist Verdict: Grant the Credit**
  The purposivist begins with Section 1, identifying the "mischief" the statute aims to remedy: high heating costs for small businesses. They argue that statutory interpretation must ensure the law functions as a coherent instrument of policy. While the text of Section 3 is clear, adhering to it actively frustrates the primary purpose identified in Section 1. In 2004, gas combustion was the best proxy for "cost-reducing heating." In 2024, that proxy is broken; geothermal reduces costs *more* effectively than gas. The purposivist argues that the specific technological limitation in Section 3 was a *means* to achieve the *end* of cost reduction, not an end in itself. When the means become counter-productive to the end, the end must govern. The protectionist intent of the 2004 legislature is irrelevant because the statute's *objective purpose*—what a reasonable legislature seeking 'heating relief' would intend today—overrides the specific historical deal. To rule otherwise renders the statute a dead letter for its stated goal.

  **The Single Feature Doing the Work**
  The divergence turns entirely on the **Level of Generality** at which the purposivist defines the statute's purpose.
  *   **Textualist Level:** The purpose is "To subsidize natural gas heating infrastructure for small businesses." At this level, Text and Purpose align perfectly, and the verdict matches the Textualist's.
  *   **Purposivist Level:** The purpose is "To reduce financial heating burdens." At this high level of abstraction, the specific text becomes a mere example of how to achieve the goal, allowing the purposivist to swap the means (gas) for a better means (geothermal).
  The case only creates a conflict because the purposivist selects a high-level functional purpose ("reduce costs") rather than a low-level specific purpose ("reduce costs *via gas*").

  **If You Take That Feature Away**
  If the purposivist is forced to adopt the Textualist's level of generality ("The purpose is to subsidize gas"), the case collapses into the boring version where both theories agree. The text mandates gas; the purpose mandates gas; the verdict is "No Credit." The conflict exists *only* because purposivism allows the court to abstract the purpose away from the specific textual constraints that the legislature deliberately chose to embody that purpose.

  **The Purposivist's Best Attack**
  A sharp purposivist would attack the Textualist's reliance on the "No other technology" clause as formalistic fetishism. Their best move is to argue that **statutes are cooperative communications, not code.** They would contend that no legislature intends to waste public funds on inferior solutions when superior ones exist, implying a tacit "unless a superior technology emerges" exception is read into all regulatory schemes. They would argue that by adhering to the 2004 definition of "heating," the Textualist is actually *violating* the legislature's instruction to interpret the law in a way that makes it work.
  *Does it work?* It works rhetorically but fails legally in this specific construct. Because the prompt stipulates the legislature *deliberately* excluded other techs to protect a lobby, the "cooperative communication" argument fails. The legislature communicated clearly: "We want to help businesses, but only if they help the gas industry." The purposivist's attack reveals that their theory requires ignoring actual democratic deals in favor of a hypothetical "reasonable" legislature that doesn't exist.

  **The Textualist's Best Defense**
  Beyond "the words say so," the Textualist's strongest defense is **Democratic Accountability.** They would argue that by updating the statute to include geothermal, the court steals the legislative power to tax and spend. If the state wants to subsidize geothermal, the legislature must vote on it, weigh the cost against the gas lobby's opposition, and pass a new bill. By allowing the "purpose" to override the "text," the court insulates the legislature from the consequences of their protectionism. The "policy loss" (the bakery paying more) is the price of maintaining the separation of powers. If the court fixes the statute, the voters never get to punish the representatives who refused to update it. The Textualist argues that a "tolerable policy loss" is preferable to a judicial usurpation of the appropriations power.
