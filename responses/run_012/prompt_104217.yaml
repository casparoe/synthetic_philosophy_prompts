answer: |-
  You have identified a robust and genuinely interesting phenomenon. It sits at the intersection of ethics, game theory, and negotiation theory.

  There is an existing term for this, though it is not yet common currency outside of specific circles (mostly economic philosophy and effective altruism). The term is **"Moral Trade."** It was notably formalized by the economist and philosopher Tyler Cowen (and discussed by Scott Sumner).

  However, since you asked for boundaries and a rigorous breakdown rather than just a label, I will treat "Moral Trade" as the working hypothesis and test it against your two specific stress tests. I will also contrast it with "Log-rolling," as that is the closest sibling concept.

  ### 1. The Label and the Closest Analogy

  **The Name:** **Moral Trade**
  **The Closest Analogy:** **Log-rolling**

  **Where the analogy holds:**
  Like log-rolling in politics ("I vote for your dam, you vote for my highway"), Moral Trade involves swapping support for outcomes that are asymmetrically valued. In both cases, the parties retain their original preferences; the Vegan still prefers no animal death, the Farmer still prefers a profitable farm. Neither converts to the other's worldview. They simply exploit the *difference in marginal valuation* to create a surplus.

  **Where the analogy breaks:**
  Log-rolling is typically **instrumental** and often viewed as cynical. A politician voting for a highway they think is useless doesn't suffer a moral injury; they just spend political capital.
  In your geological terms: Log-rolling is moving sediment from one basin to another. Moral Trade is metamorphic; it involves heat and pressure because the material being moved (moral agency) is sensitive to the handler's internal state.

  In Moral Trade, the "cost" isn't just time or resources; it is **moral disutility**. The Vegan suffers a small amount of moral distress by helping the farm. The trade only happens if the moral joy of the wildlife refuge *outweighs* the moral distress of the farm chore. Log-rolling rarely accounts for internal psychological or ethical friction.

  ### 2. Boundary Test One: "Wrong" vs. "Lower Priority"

  You asked: *Does it still count if the thing you're doing for the other person is something you think is actually wrong, and not just lower priority?*

  This is the **Integrity Boundary**. Whether the trade holds depends entirely on the underlying moral architecture of the participants.

  *   **Consequentialists (Utilitarians):** For them, the trade **holds**. If the Vegan believes the net reduction in suffering (Refuge + Farm Survival) is greater than the net increase (Farm Chores), they can participate without contradiction. To a consequentialist, "wrongness" is a scalar value (a quantity of bad), not a binary switch. As long as the equation balances, the trade is valid.
  *   **Deontologists (Duty-based):** For them, the trade **collapses**. If the Vegan believes eating meat is a violation of rights (murder), then helping the farm makes them an *accessory to murder*. No amount of wildlife refuge building can "cancel out" a direct violation of a categorical duty. The "cost" here is infinite.

  **The Verdict:**
  If the action is merely "suboptimal" (lower priority), it is Moral Trade.
  If the action is "forbidden" (intrinsically wrong), it is **Complicity**.
  The boundary line is **Agent-Relativity**. If my moral duty is relative to *my* actions ("I must not kill"), I cannot trade. If my moral duty is agent-neutral ("Killing should be minimized globally"), I can trade.

  **Refinement:**
  If you encounter a case where people trade despite believing the other's action is "wrong," they are usually engaging in a **Modus Vivendi** (a truce), not Moral Trade. A truce is "I won't stop you from doing X if you don't stop me from doing Y." Moral Trade is active cooperation ("I will *help* you do X"). Active help for a "wrong" action is almost universally condemned as complicity, whereas withholding interference is often permissible.

  ### 3. Boundary Test Two: Facts vs. Values

  You asked: *Does it matter if the two people share the same values but disagree about the facts?*

  **The Verdict:** Yes, this is a **separate phenomenon**.

  *   **Shared Values + Disagreed Facts = Division of Epistemic Labor.**
      If the Vegan and Farmer both agree "Minimize Suffering" is the goal, but disagree on whether plants feel pain, they are on the same team. They are trying to solve the same equation with different variables. If they swap chores here, it is purely **Comparative Advantage**. They are optimizing a single shared utility function. There is no moral tension, only informational friction.
  *   **Disagreed Values + Disagreed Facts = Moral Trade.**
      This is your scenario. They are optimizing *different* utility functions. The Vegan maximizes $U_{vegan}$ (Animal Rights), the Farmer maximizes $U_{farmer}$ (Livelihood/Tradition). The "gain" from the trade comes specifically from the fact that their utility functions are *orthogonal* (at angles to each other), not parallel.

  **Why the distinction matters:**
  In the "Facts Only" scenario, the goal is to convince the other person of the truth so you can work together more efficiently.
  In the "Values" scenario (Moral Trade), convincing the other person is irrelevant or even counter-productive. You *want* them to keep valuing what they value, because that is the commodity you are buying. If the Farmer becomes a Vegan, the trade opportunity vanishes.

  ### 4. Coining a Term (If "Moral Trade" feels too economic)

  If "Moral Trade" feels too sterile for your purposes, the most precise philosophical coinage would be **"Reciprocal Normative Accommodation."**

  *   **Reciprocal:** It requires two-way action.
  *   **Normative:** It concerns values/duties, not just goods.
  *   **Accommodation:** It implies making space for the other without yielding ground (unlike "Compromise").

  **What falls inside this boundary:**
  1.  **Divergent Terminal Values:** The parties must value different end-states (e.g., Sanctity vs. Welfare).
  2.  **Positive Marginal Utility:** Each party must value the other's action *more* than they disvalue their own concession.
  3.  **Integrity Preservation:** Neither party violates a "side-constraint" (a hard deontological rule). The action must be permissible, even if not preferred.

  **What sits just outside:**
  1.  **Complicity:** Helping someone do something you deem intrinsically evil (violates Integrity Preservation).
  2.  **Modus Vivendi:** Agreeing not to interfere with each other (passive, not active trade).
  3.  **Conversion:** One party changes their mind to match the other (eliminates the value divergence).
  4.  **Collaboration:** Parties share the same end goal (eliminates the normative divergence).

  ### Summary for a Geologist

  Think of it like two tectonic plates.
  *   **Compromise** is erosion: both plates wear down until they fit.
  *   **Conversion** is subduction: one plate slides under the other and disappears.
  *   **Moral Trade** is a **Transform Fault**. The plates slide past each other. There is friction (disagreement), but the movement (trade) releases pressure and allows both plates to continue on their own vectors without shattering.

  The phenomenon is **Moral Trade**. It works only when the friction of complicity is lower than the pressure of the disagreement, and it ceases to exist if the plates are actually moving in the same direction (shared values/fact disagreement).
