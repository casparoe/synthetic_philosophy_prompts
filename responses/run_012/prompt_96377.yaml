  **Scenario**
  Elara, an ordinary human, intends to follow the rule 'Sort only red objects into Box R'. We stipulate by fiat that for every physically possible object, Elara possesses a determinate, occurrent disposition to sort it or not; her dispositional profile is total, bypassing ordinary limits of time or memory. This is an explicit idealisation of her dispositions, not her ontology. Presented with a specific orange object, Elara is disposed to sort it into Box R. She knows the rule, understands the sceptic's challenge, and acknowledges her disposition, yet maintains she ought not to sort the orange object. The sceptic argues her meaning is fixed by this total disposition.

  **Verdicts**
  The plain dispositionalist holds Elara means 'red-or-orange'. Since meaning is constituted by disposition, and she is disposed to sort orange, sorting orange is correct. The idealised dispositionalist agrees; the stipulation satisfies the requirement for ideal conditions, confirming the constitutive link. If the disposition includes orange, the meaning does too. The sceptic argues this abolishes normativity. If disposition fixes meaning, Elara cannot be wrong about what she meant. Rule-following collapses into conformity; systematic mistake regarding meaning becomes unintelligible, as the fact of disposition cannot justify the act.

  **Key Feature**
  The work is done by the stipulation of total dispositions alongside the subject's normative claim. This isolates normativity from finitude. If the totality stipulation is removed, the case collapses back into the finitude objection (perhaps she lacks a disposition for this case). If her normative insight is removed, it becomes ordinary ignorance. The tension remains only because the disposition is complete yet allegedly incorrect, forcing the dispositionalist to deny the possibility of semantic error.

  **Dispositionalist Reply**
  A sophisticated dispositionalist might argue that normativity is internal to the idealised disposition. They would claim the 'ought' is hypothetical: 'If you mean red, you ought to sort red.' Since meaning *is* disposition, Elara simply means 'red-or-orange'. Her feeling of error is a secondary reaction to conflicting dispositions (e.g., a disposition to accept linguistic correction), not evidence of a norm transcending disposition. Thus, the 'ought' is reduced to a complex 'is'.
