answer: |-
  # The Common-Knowledge Consensus Protocol (90-Minute Version)

  **Purpose:** To convert six individual probability estimates into a single decision-ready number by treating disagreement as unpooling information rather than noise.
  **Underlying Logic:** Based on Aumann's Agreement Theorem. If analysts are rational and share a goal, persistent disagreement implies either private information not yet shared or fundamentally different priors (worldviews/values). This procedure forces private information into the open (common knowledge) to collapse the spread. Where it does not collapse, it diagnoses the source to determine how to aggregate.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Blind Baseline (0:00–0:10)
  **Action:** Distribute the specific question in writing. Analysts write their probability estimate (0–100%) and a *one-sentence* driver on a card. No discussion.
  **Manager Task:** Collect cards. Calculate the range and mean. Do not reveal them yet.
  **Sufficient Answer:** Six numbers received.
  **Stop Condition:** If analysts cannot write a number without clarifying the question, pause for definition (see Case 3).

  ### Phase 2: Forced Disclosure (0:10–0:40)
  **Action:** Round-robin presentation. Each analyst has 5 minutes.
  **Rule:** They must state:
  1.  Their number.
  2.  The specific evidence or model that anchors it.
  3.  What would change their mind (the "update condition").
  **Constraint:** No debate, no cross-talk. Others take notes. The goal is to convert *mutual knowledge* (I know my data, you know yours) into *common knowledge* (We all know all data and know that we all know it).
  **Sufficient Answer:** Every analyst has spoken; the room understands the *source* of the variance (e.g., "Analyst A is using human intel, Analyst B is using economic indicators").

  ### Phase 3: Private Re-elicitation (0:40–0:50)
  **Action:** Analysts privately revise their estimates based on the new common knowledge.
  **Manager Task:** Collect new numbers.
  **Decision Point:**
  *   **If Range Collapses (Spread < 10%):** Proceed to **Phase 5 (Aggregation)**.
  *   **If Range Persists (Spread > 10%):** Proceed to **Phase 4 (Diagnosis)**.

  ### Phase 4: Diagnosis of Residual Disagreement (0:50–1:10)
  **Action:** You (the Manager) lead a structured interrogation of the remaining spread. Do not ask "Why do you disagree?" Ask "What kind of disagreement is this?"
  **Categorize the divergence into one of four buckets:**

  1.  **Information Asymmetry:** "I know something you don't."
      *   *Test:* Can the holder verify the source without compromising security?
      *   *Resolution:* If verified, the group adopts the informed view. If not, weight the informed analyst higher.
  2.  **Model Divergence:** "We see the same data but weigh it differently."
      *   *Test:* Can they articulate the causal mechanism?
      *   *Resolution:* Keep the spread. This represents genuine structural uncertainty.
  3.  **Question Drift:** "We are answering different questions."
      *   *Test:* Ask each to define the event *E*.
      *   *Resolution:* Stop. Rewrite the question. (See Case 3).
  4.  **Prior/Value Divergence:** "We start from different baseline assumptions about how the world works."
      *   *Test:* Is the disagreement about *likelihood* or *importance*? Is it about the stability of the regime vs. the volatility of the market?
      *   *Resolution:* **Hand-off to Manager.** This is not a probability problem; it is a worldview conflict.

  **Sufficient Answer:** Every analyst agrees on *why* they still disagree.
  **Stop Condition:** If the divergence is categorized as **Prior/Value**, the procedure ends. You (the Manager) must set the number based on which prior aligns with the organization's strategic stance.

  ### Phase 5: Aggregation and Sharpening (1:10–1:25)
  **Action:** Calculate the single number.
  **Rule 1 (The Mean):** Start with the arithmetic mean of the re-elicited estimates.
  **Rule 2 (Sharpening/Extremizing):**
  *   **Apply Sharpening IF:** The disagreement was **Information Asymmetry** or **Model Divergence** (independent signals).
      *   *Why:* Independent signals cancel out noise but reinforce signal. The truth is likely more extreme than the average.
      *   *Method:* Move the mean 10–20% closer to 0 or 1 (e.g., if mean is 0.6, move to 0.65).
  *   **Do NOT Sharpen IF:** The disagreement was **Prior/Value** or if the group showed **Groupthink** (Case 2).
      *   *Why:* Sharpening bias creates false confidence.
  **Rule 3 (The Floor/Ceiling):** If the mean is <0.05 or >0.95, do not sharpen. Extreme probabilities require extreme evidence that rarely survives a 90-minute review.

  ### Phase 6: Managerial Sign-off (1:25–1:30)
  **Action:** You record the number.
  **Requirement:** If you overrode the group (Phase 4, Prior Divergence) or refused to sharpen (Phase 5), attach a one-sentence footnote to the memo file (not the memo itself) explaining why.
  **Output:** A single percentage.

  ---

  ## Part 2: Test Cases

  ### Case 1: The Information Pool
  **Input:** Initial spread 0.30 to 0.70. After Phase 2 (Disclosure), analysts realize three were counting on diplomatic cables the others hadn't seen. Re-elicited spread 0.40 to 0.55.
  **Diagnosis:** Information Asymmetry resolved into Model Divergence.
  **Procedure Action:**
  1.  **Aggregate:** Mean is 0.475.
  2.  **Sharpen:** Yes. The remaining spread is due to different weighting of the *now-common* information. This indicates independent judgment on shared data.
  3.  **Calculation:** Shift mean slightly toward the stronger argument. Let's say 0.50.
  4.  **Result:** **50%**.
  **Note:** The convergence proves the Aumann condition is working; information was pooled. The remaining spread is noise/residual uncertainty.

  ### Case 2: The Black Swan Blindspot
  **Input:** Unanimous agreement at 0.05. Justification: "It has never happened in 20 years."
  **Diagnosis:** Shared Prior Error (Reference Class Failure).
  **Procedure Action:**
  1.  **Aggregate:** Mean is 0.05.
  2.  **Sharpen:** **NO.** This is the danger zone. Unanimity based on "never happened" is a shared bias, not independent confirmation.
  3.  **Managerial Override:** You must challenge the prior. Is the environment static? If not, 0.05 is false precision.
  4.  **Result:** **0.15 (with a flag).** You adjust upward not because of math, but because the *source* of the consensus (historical absence) is weak evidence for future probability in a changing system.
  **Why:** Aumann assumes rationality. Groupthink violates rationality. Do not sharpen consensus derived from shared ignorance.

  ### Case 3: The Category Error
  **Input:** Two analysts at 0.20, four at 0.80.
  **Diagnosis:** Question Drift.
  **Discovery:** The 0.20 group is estimating *P(Event Occurs)*. The 0.80 group is estimating *P(Event Occurs | Current Tensions Rise)* or implicitly estimating *P(Impact is Severe)*.
  **Procedure Action:**
  1.  **Stop.** Do not average.
  2.  **Hand-off:** Return to Phase 1. Rewrite the question. "Are we estimating the likelihood of the strike, or the likelihood the strike causes supply chain failure?"
  3.  **Result:** **No Number.** You must tell the Director: "The unit could not produce a number because the question conflates likelihood with impact. We are resubmitting in 24 hours."
  **Why:** Averaging these numbers is mathematically meaningless. It violates the "common knowledge" requirement because they aren't discussing the same event.

  ---

  ## Part 3: Limitations and Blind Spots

  You asked where this procedure fails and what the Common-Prior idea cannot detect.

  **1. The "Bad Faith" Blind Spot**
  Aumann's theorem assumes agents are truth-seeking. It cannot detect an analyst who is sandbagging (low-balling risk to avoid accountability) or alarmist (high-balling risk to secure resources).
  *   *Symptom:* An analyst refuses to move in Phase 3 despite conceding their evidence was weak in Phase 2.
  *   *Procedure Response:* Phase 4 (Diagnosis) will categorize this as "Prior Divergence."
  *   *Your Burden:* You must treat this as a personnel issue, not a probabilistic one. The procedure hands this back to you as a **Value/Judgment** call. You must weight their number based on trust, not math.

  **2. The "Shared Bias" Blind Spot**
  The procedure cannot detect if all six analysts share the same blind spot (Case 2). If they all share a prior that "markets self-correct," they will agree on a low probability of crash.
  *   *Symptom:* Unanimity justified by historical stability.
  *   *Procedure Response:* The "No Sharpening on Consensus" rule mitigates this, but does not solve it.
  *   *Your Burden:* You must introduce an external "Red Team" view or challenge the reference class yourself. The math cannot save you from shared ignorance.

  **3. The "Values vs. Priors" Ambiguity**
  Analysts often mask value judgments as probability estimates (e.g., "I think the probability is low" actually means "I think we shouldn't do this").
  *   *Symptom:* In Phase 4, an analyst argues about the *consequences* when asked about the *likelihood*.
  *   *Procedure Response:* Phase 4 categorizes this as Prior/Value Divergence.
  *   *Your Burden:* The procedure stops. You must strip the value judgment out yourself. If you cannot, the number you give the Director is contaminated. You must explicitly state: "This number includes a risk-aversion premium."

  **4. The Single Number Constraint**
  The Director wants a number. Sometimes the truth is bimodal (e.g., 20% chance of total peace, 80% chance of total war, 0% chance of status quo).
  *   *Limitation:* A single mean (e.g., 65% stability) lies in a valley of impossibility.
  *   *Procedure Response:* Phase 5 forces a mean.
  *   *Your Burden:* You must add the qualitative context to the memo. "65% probability of stability" must be footnoted with "reflects a binary outcome risk." The procedure produces the number, but you must produce the warning label.

  ### Summary of Hand-Offs to You
  The procedure returns a number *unless*:
  1.  **Question Drift is found:** (Case 3). You must rewrite the question.
  2.  **Value Divergence is found:** (Phase 4). You must choose which worldview governs the estimate.
  3.  **Shared Bias is suspected:** (Case 2). You must override the sharpening rule.

  In these three instances, the "single number" is not a statistical output; it is a leadership decision. The procedure identifies *that* you need to decide, so you do not hide behind the average.
