prompt: |-
  I run a six-person analytical unit that puts probabilities on political and operational risks. Twice a month, under deadline, I have to turn the analysts' individual estimates into the single number that goes into a decision memo; the decisions at stake are expensive and hard to reverse, the director signs off and will not accept a range, and I have to be able to explain the number to people with no statistical training. My analysts are senior and will resist anything that treats their disagreement as noise to be averaged away. Write me a decision procedure I can actually run in a ninety-minute meeting.

  Ground it in the following idea, which I want used properly rather than gestured at: agents who share a prior and whose prior, estimates, reasoning, and rationality are common knowledge cannot knowingly disagree, so any disagreement that survives is either private information not yet pooled or a divergence in the priors themselves. Two consequences should shape the procedure. Because the result turns on common rather than mutual knowledge, the procedure needs a step that forces estimates and the reasons for them into the open and then re-elicits, so we can see whether a spread was private information or something else. Where a spread does not collapse, the procedure must diagnose the kind of divergence — different evidence, a different model of the same evidence, a different question being answered, or a difference in what the analysts care about — and treat each differently rather than defaulting to an average. It should also include a sharpening step for the well-documented tendency of a plain average to land closer to fifty-fifty than the analysts' combined information warrants, and say when sharpening is not warranted.

  Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops, and where it hands the decision back to me because the question is one of values rather than probabilities. Then run it on three cases: estimates spread from 0.3 to 0.7 that narrow to 0.4–0.55 once reasons are exchanged; unanimous agreement near 0.05 that everyone justifies by saying it has never happened; and two analysts whose numbers differ because one is estimating the probability of the event and the other the probability of the event mattering. Tell me plainly where the procedure returns something other than the single number the director wants, and what it structurally cannot do — in particular, what the common-prior idea gives me no way to detect. I want the procedure itself, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Six-person analytical unit, political/operational risk probabilities.
      *   **Output:** Single number for a decision memo (no ranges), high stakes, irreversible decisions, director signs off, audience has no statistical training.
      *   **Constraints:** 90-minute meeting, senior analysts (resist treating disagreement as noise), must use Aumann's Agreement Theorem logic properly (common knowledge/priors).
      *   **Key Requirements:**
          *   Force estimates/reasons into open (common knowledge).
          *   Re-elicit estimates after sharing.
          *   Diagnose divergence (evidence vs. model vs. question vs. values).
          *   Include "sharpening" (extremizing) logic with caveats.
          *   Define stop conditions and hand-off points (values vs. probabilities).
          *   Run on three specific test cases.
          *   Identify limitations (what the procedure *cannot* do).
      *   **Tone:** Practical, authoritative, procedural, not academic.

  2.  **Deconstruct the Theoretical Core (Aumann's Agreement Theorem):**
      *   *Theorem:* Rational agents with common priors and common knowledge of posteriors cannot agree to disagree.
      *   *Implication for this task:* If they disagree, either (a) they don't actually know *why* they disagree (private info not shared), (b) they have different priors (fundamental worldview differences), or (c) they aren't being fully rational/transparent.
      *   *Procedure Design:* Must convert "mutual knowledge" (I know X, you know Y) to "common knowledge" (We both know X and Y and know that we both know it). This requires structured disclosure and updating.

  3.  **Drafting the Procedure (The "90-Minute Protocol"):**
      *   *Time Management:* 90 minutes is tight for 6 people. Needs strict facilitation.
      *   *Phase 1: Blind Submission (Pre-meeting or first 10 mins).* Need baseline numbers.
      *   *Phase 2: Disclosure (The "Common Knowledge" Step).* Analysts present *reasons*, not just numbers.
      *   *Phase 3: Re-elicitation.* Do numbers move?
      *   *Phase 4: Diagnosis.* If they still differ, why? (Evidence, Model, Question, Values).
      *   *Phase 5: Aggregation/Sharpening.* How to get the single number.
      *   *Phase 6: Managerial Hand-off.* When the math stops and judgment begins.

      *Refining the Steps:*
      *   *Step 1 (Baseline):* Individual written estimates.
      *   *Step 2 (The "Why"):* Round-robin reasoning. No debate yet. Just exposition.
      *   *Step 3 (The Update):* Private re-vote. If convergence -> Average.
      *   *Step 4 (The Diagnosis):* If divergence remains, categorize it.
          *   *Evidence:* Someone knows something others don't. -> Verify/Incorporate.
          *   *Model:* Same data, different interpretation. -> Weight by track record or logic.
          *   *Question:* Are we answering the same thing? -> Clarify definition.
          *   *Values/Priors:* Different baseline assumptions. -> Manager decision.
      *   *Step 5 (Sharpening):* Apply extremizing *only* if diversity of information is confirmed.
      *   *Step 6 (Final Number):* Manager sets it if unresolved.

  4.  **Addressing Specific Constraints:**
      *   *Senior Analysts:* Frame disagreement as "informational asset," not "error."
      *   *Director's Constraint:* Must produce a number (usually), but flag when it's actually a value judgment.
      *   *Sharpening:* Needs to be careful. Don't sharpen if disagreement is due to confusion or values. Only sharpen if independent signals confirm the trend.
      *   *Aumann Limit:* The procedure assumes rationality. It can't detect bad faith or cognitive bias disguised as "different priors."

  5.  **Developing the Test Cases:**
      *   *Case 1 (Convergence):* 0.3-0.7 -> 0.4-0.55. *Action:* Average + slight sharpening? Or just Average? Since they moved towards each other, information was pooled. The remaining spread is likely residual uncertainty.
      *   *Case 2 (Unanimous Low):* All 0.05, "Never happened." *Action:* Danger of groupthink/reference class error. Do *not* sharpen. Challenge the prior.
      *   *Case 3 (Category Error):* Probability vs. Impact. *Action:* Stop. This is a definition failure. Fix the question, don't average.

  6.  **Refining the "Managerial Hand-off":**
      *   The prompt asks where the procedure hands the decision back to the user. This happens when the divergence is identified as *prior* differences (values/worldview) rather than *likelihood* differences. Aumann says priors shouldn't differ if common knowledge exists, but in practice, they do. That's a leadership call, not a math call.

  7.  **Identifying Limitations (The "What it cannot do" section):**
      *   Cannot detect lying/strategic misrepresentation.
      *   Cannot detect shared cognitive biases (groupthink).
      *   Cannot resolve fundamental value conflicts (that's the Director's job).
      *   Assumes the question is well-posed (Case 3 shows it isn't always).

  8.  **Review against Constraints:**
      *   *90 Minutes?* Yes, if timed strictly.
      *   *Single Number?* Yes, mostly, with flags.
      *   *No Stats Training?* Language must be plain English.
      *   *Aumann Logic?* Explicitly used in the "Disclosure" and "Diagnosis" phases.

  9.  **Final Polish:**
      *   Make it a checklist/script.
      *   Ensure the "Sharpening" rule is clear (only on independent information).
      *   Ensure the "Values vs. Probability" distinction is sharp.

  *(Self-Correction during drafting)*: I initially thought about suggesting a Delphi method. But Delphi is asynchronous. This is a 90-minute meeting. I need a synchronous "Structured Dialogue" approach. I also need to make sure I don't just say "average them." The prompt specifically warns against treating disagreement as noise. The aggregation method must depend on the *diagnosis* of the disagreement.

  *Sharpening Logic:* If analysts have independent information, the truth is likely more extreme than the average (because the average cancels out the signal strength). If they are just guessing around a consensus, sharpening is dangerous. I need to make this distinction clear in the procedure.

  *Case 3:* One estimates P(Event), one estimates P(Event | Impact). This is a semantic failure. The procedure must catch this early.

  *Limitations:* Aumann assumes "common priors." In reality, people have different priors. The procedure treats "different priors" as a failure state that requires manager intervention, not mathematical resolution.

  10. **Final Structure:**
      *   Introduction/Philosophy.
      *   The Protocol (Step-by-Step with Timeboxes).
      *   Decision Rules (Aggregation & Sharpening).
      *   Test Cases.
      *   Limitations/Blind Spots.

