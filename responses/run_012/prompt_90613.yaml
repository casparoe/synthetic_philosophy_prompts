prompt: |-
  I'm a novelist — second book, out next spring — and I've somehow ended up hosting a very small podcast that's basically an excuse to talk to people about ideas I'm nicking for the novel. Next week's guest is a philosopher who's spent about a decade defending the self-indication assumption, the one that says the bare fact of your existing should push you towards hypotheses on which lots of other people exist too, and in his new book he bolts on a twist I keep turning over. His line, as I understand it: the boost only applies where your present choice is itself a lever on how many observers there end up being — if you can't move the headcount, the headcount can't count in your favour. He calls it the lever condition. I think that's right, the book's at my sister's. My narrator is a night-shift nurse in a hospice who has convinced herself, on roughly these grounds, that she's almost certainly in one of the many branches rather than the few, and I want the interveiw to be about the actual argument, not about how it feels to be her.

  Could you draft me eight to ten questions, each with a follow-up aimed at the answer he's most likely to give? I need at least one pressing on why self-indication and self-sampling come apart over the Doomsday-style reasoning — the one where not having been born yet is supposed to be evidence about how much longer we've got — and at least one on the presumptuous philosopher, the character who looks around, decides he's probably in the biggest universe going, and concludes that everything he does matters enormously. Then at least two on the lever condition itself: whether it's a principled restriction or just a patch stuck on to block an awkward result, and what happens to the Doomsday argument once it's in place. He's definately going to say the restriction is principled, so make the follow-up do some work. Finish with a question about what would actually make him give up the whole approach, and skip anything about how he got into philosophy in the first place. Whole thing under 700 words, and keep each question plus its follow-up to two sentences max so I can read them off my phone without losing my place.
