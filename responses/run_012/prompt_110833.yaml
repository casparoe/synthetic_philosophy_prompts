  Here is a decision tree designed for your handout. It focuses on concrete intuitions about validity and authority rather than theoretical labels. The structure fits on a single page, with the analysis of "empty" and "overlapping" positions following the diagram.

  ### The Self-Amendment Sorting Tree

  **START:** A constitutional rule states: *"This rule cannot be amended."*
  A vote follows the standard procedure to amend this rule.
  **Q1: Is the amendment legally valid?**

  ├── **YES** → Go to **Q2**
  │
  └── **NO** → Go to **Q3**

  ***

  **Q2: If valid, how did it override the prohibition?**

  ├── **The prohibition was never logically binding on the author.**
  │   └─► **LEAF A: Self-Embracing Sovereignty** (Austin/Parliamentary Sovereignty)
  │
  ├── **The prohibition was binding, but social practice overrides text.**
  │   └─► **LEAF B: Rule of Recognition** (H.L.A. Hart)
  │
  └── **The prohibition was binding, and the contradiction is real but tolerated.**
      └─► **LEAF C: Dialetheism** (Paraconsistent Logic)

  ***

  **Q3: If invalid, what is the barrier?**

  ├── **Logic forbids a rule from changing its own foundation.**
  │   └─► **LEAF D: Logical Invalidity** (Alf Ross)
  │
  └── **A higher, unseen norm forbids it (unless a revolution occurs).**
      └─► **LEAF E: Presupposed Basic Norm** (Hans Kelsen)

  *(Note: A third path here suggests we need a meta-rule to authorize the vote, which requires a meta-meta-rule, ad infinitum.)*
      └─► **LEAF F: [UNNAMED]** (Infinite Regress)

  ***

  ### Analysis for the Group Leader

  **1. The Empty Branch (Leaf F)**
  The **Infinite Regress** branch is theoretically "uninhabited." No serious legal theorist advocates for a system that actually requires an infinite chain of meta-rules to function. It is almost exclusively used as a *reductio ad absurdum* to prove that a system *must* terminate in either a Social Fact (Hart), a Logical Stop (Ross), or a Presupposed Norm (Kelsen). You can treat this leaf as a "graveyard" for arguments that fail to find a stopping point.

  **2. The Indistinguishable Leaves (Leaf A vs. Leaf B)**
  Be prepared for friction between **Self-Embracing Sovereignty** (A) and the **Rule of Recognition** (B).
  *   **Theoretically:** They are distinct. (A) says the sovereign *logically* cannot bind its future self; the "cannot" was a lie. (B) says the "cannot" was real, but the officials' acceptance of the new rule trumps the old text.
  *   **Practically:** They are often indistinguishable. In both cases, the amendment stands, and the court upholds the vote. Unless your group members are willing to debate metaphysical authority vs. social fact, these two positions will look identical in a real-world scenario.

  **3. The "No" Branch (Leaves D & E)**
  This split distinguishes the **Logician** from the **Hierarchist**.
  *   **Ross (D)** believes self-amendment is like a snake eating its own head; it destroys the logical subject.
  *   **Kelsen (E)** believes it is possible *if* the higher "Basic Norm" shifts (effectively a revolution). If the vote fails, it is because the Basic Norm remains with the old order.
  *   **Tip:** If a member says, "It's invalid unless the revolution succeeds," they are Kelsenian. If they say, "It's invalid, period, because it's nonsense," they are Rossian.

  **4. Formatting Note**
  This tree is designed to be copied directly into a text editor or word processor. Use a monospaced font (like Courier or Consolas) to preserve the alignment of the branches.
