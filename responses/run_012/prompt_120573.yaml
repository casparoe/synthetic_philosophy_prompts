      *   **Specific Content:** Use the "frictionless dome/marble" example (or similar contested one) where intuition splits (determinism vs. math cheat). Include the Victorian balloonist character.
      *   **Tone:** Engaging, accessible (for the spouse in row 3), no academic jargon/citations, warm, humorous (want to be invited back to dinner).
      *   **Outcome:** Leave the room feeling the pull of both answers, liking each other, and liking the speaker.

  2.  **Deconstruct the Speech Structure:**

