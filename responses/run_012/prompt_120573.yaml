      *   **The Performance (3-8 mins):** Guide the audience through the specific thought experiment (The Frictionless Dome). Make it visceral. Describe the setup clearly. Ask them to visualize the outcome. Highlight the split in intuition (does it move? when?).
      *   **The Pivot (8-12 mins):** Analyze *what just happened*. Introduce the two competing theories (Argument vs. Experience/Seeing). Use the balloonist to bridge the gap (trusting the head over the world).
      *   **The Closing (12-15 mins):** Bring it back to the workshop's purpose. Acknowledge the mystery without solving it. Warm wish for the next two days. Transition to dinner/wine.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start with the coat-check reality. It grounds the room. Introduce the novelist persona. Mention the balloonist. *Idea: The balloonist is a man of theory without practice. We are all balloonists today.*
      *   **The Thought Experiment:** The Norton Dome is the requested example. It's perfect because it's simple but breaks intuition.
          *   *Setup:* A perfectly smooth dome. A point mass (marble). Gravity. Newton's laws.
