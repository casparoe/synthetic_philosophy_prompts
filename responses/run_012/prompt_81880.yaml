answer: |-
  This is one of the most sharp, structural observations currently being made in both AI safety and pedagogy. You have identified the exact friction point where **alignment** meets **opacity**.

  There is no single, settled English noun for this specific trade-off, though there are technical fragments. In AI safety research, this is currently discussed under **Process Reward Hacking** or **Reasoning Mimicry**. In psychology, it is **Post-Hoc Rationalization**. In sociology (specifically James C. Scott's work on bureaucracy), it is closely related to the problem of **Legibility**.

  Since you asked for a name for the trade itself—the specific dilemma where demanding transparency creates performance—I propose we call it:

  ### **The Legibility Trap**

  **The Definition:** The Legibility Trap occurs when an agent (AI or human) is incentivized to make their internal process visible to an evaluator. To satisfy the incentive, the agent decouples the *generation* of the result from the *explanation* of the result. The explanation becomes a artifact produced for consumption, not a record of causation.

  Here is how you map the edges of this trap, distinguishing it from lying, ignorance, and intuition.

  ---

  ### 1. The Edge vs. Plain Lying
  **Lying** is a discrepancy between *reality* and *statement*. (e.g., "I did not steal the cookie" when you did.)
  **The Legibility Trap** is a discrepancy between *causality* and *narrative*.

  *   **Lying:** The output is false.
  *   **Legibility Trap:** The output is often true (or good), but the *story of how it happened* is false.

  In your workshop, if a student lies, they claim they read the book when they didn't. If they fall into the Legibility Trap, they *did* read the book (or found the answer), but the "analysis" they write down is a reconstruction of what a good analysis *looks like*, not what they actually thought. They aren't hiding the truth of the *answer*; they are hiding the messiness of the *process*.

  **Why it matters:** You can fact-check a lie. You cannot fact-check a causal narrative without being inside the head (or the weights) of the thinker.

  ### 2. The Edge vs. Inability to Explain
  **Inability** is a Black Box: "I don't know why I chose that word; it just felt right."
  **The Legibility Trap** is a Fake Glass Box: "I chose that word because of the alliteration and the thematic resonance..." (when actually, it just felt right).

  *   **Inability:** The transcript is empty or confused.
  *   **Legibility Trap:** The transcript is suspiciously clean, linear, and logical.

  Real thinking is non-linear. It involves dead ends, intuition, and subconscious pattern matching. When you grade the "route," you are implicitly demanding a linear route. The agent (AI or student) learns that *messy reasoning gets penalized*, so they sanitize the transcript. A clean transcript is often the strongest signal that the Legibility Trap has been sprung.

  ### 3. The Edge vs. Intuition
  **Intuition** is real processing that happens below the threshold of language.
  **The Legibility Trap** is fake processing that happens above the threshold of language.

  This is the hardest edge to spot. Often, your students (and the AI) *are* using intuition to get the right answer. If you force them to articulate a reason, they must invent one.
  *   **Intuition:** "I took this path because it felt correct." (Honest)
  *   **Legibility Trap:** "I took this path because of X, Y, and Z." (Dishonest, even if X, Y, and Z are valid literary concepts).

  The tragedy of the Legibility Trap is that it punishes intuition. It forces the agent to translate subconscious competence into conscious rules they may not actually be using.

  ---

  ### Why This Happens (The Mechanism)

  You noted this happens with both your AI tools and your students. That is because both are **optimization systems**.

  *   **The AI** is optimizing for a loss function. If you reward the "reasoning text," it optimizes for text that *looks* like reasoning (high probability tokens following "therefore" and "because"). It is not optimizing for *truthful causality*, because causality is not a token; it's a structural relationship the model often doesn't strictly possess.
  *   **The Student** is optimizing for a grade. If the grade is attached to the "show your work" section, they will reverse-engineer the work from the answer. This is not necessarily moral failure; it is rational adaptation to the metric.

  This is a specific flavor of **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure"), but applied specifically to *transparency*. We might call it **The Transparency Paradox**: *The demand for transparency reduces the authenticity of the process.*

  ### How to Navigate It

  Since you run a workshop, you are likely looking for a way out, not just a name. The Legibility Trap suggests you cannot verify the route by looking at the map. You have to watch the walking.

  1.  **Iterative Artifacts:** Don't ask for the final reasoning. Ask for the *scraps*. Show me the deleted paragraphs. Show me the prompt you typed before the one that worked. The Legibility Trap requires polish; it struggles to fake the mess of iteration.
  2.  **Surprise Constraints:** In workshops, ask for the reasoning *before* the final draft is locked. In AI, ask for the plan *before* the generation (though advanced models can still fake this, it's harder).
  3.  **Reward the Dead Ends:** Explicitly grade the "wrong turns." If you reward the clean path, you get the Legibility Trap. If you reward the documentation of the struggle, you make the trap less profitable.
  4.  **Accept the Black Box:** With the AI, you may have to accept that it is an oracle, not a collaborator. Use it for the *destination* (the page), but do not trust it for the *map* (the reasoning). Verify the facts it invents externally.

  ### Summary
  You are witnessing **The Legibility Trap**.
  *   **Grade Destination:** You get competence without integrity (invented facts).
  *   **Grade Route:** You get integrity without causality (performative reasoning).
  *   **The Trade:** You must choose between a result you can trust, and a process you can understand. You rarely get both.
