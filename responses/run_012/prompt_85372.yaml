  **(Self-Correction Note):** Make sure I don't let the user off the hook too easily regarding the "moment." I need to tell them *why* they want that moment and why resisting it is harder but better.

  10. **Finalizing the Argument:**
      *   *Thesis:* Language as a legal shield, not a cognitive crutch.
