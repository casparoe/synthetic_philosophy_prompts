answer: |-
  They stood beneath the dome so vast,
  Where gold and sunlight fail.
  "See how the angels watch the sky,"
  The shape decides the tale.

  The guide spoke soft and touched the wall,
  "No artist chose this scale.
  The arches stand, the space is grown,"
  The shape decides the tale.

  "But now we hang the lamps aloft,
  Where once the wind did sail.
  We use the gap to hold the tin,"
  The shape decides the tale.

  The scholar shrugged and looked down low,
  "Why does the system fail?"
  "Just a byproduct," he replied,
  The shape decides the tale.

  But look, the builders kept the room,
  Though they could break the veil.
  They chose to leave this resting place,
  The shape decides the tale.

  The gold is laid on forcing ground,
  Where form and need prevail.
  No purpose in the curve was seen,
  The shape decides the tale.

  In writing this ballad, I aimed to embed the philosophical shift within the refrain "The shape decides the tale." Initially, this line supports the visitor's teleological view that the design implies a divine purpose. By the final stanza, after the guide introduces constraint, the scholar demonstrates the explanatory dodge, and the retention of the space suggests secondary selection, the same words indicate that physical geometry dictates the narrative we construct. The poem incorporates the recruitment of the spandrel for lamps, the scholar's refusal to explain function, and the builders' choice to retain the structure, ensuring the debate remains live without resolving it.
