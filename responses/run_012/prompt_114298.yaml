answer: |-
  1. You prioritize the local majority's right to rule itself over outcomes, so you oppose the national government redrawing a city's boundaries even to protect rights. Your awkward commitment is defending the town that votes to ban something its own minority does, ignoring the commuters hit by the car ban because they aren't part of the voting "self."

  2. You argue locals decide better because they possess specific knowledge the capital lacks, not because they want different things. Your awkward commitment is conceding power to the center when experts prove the upstream state's farms are causing river pollution, admitting that sometimes distance brings clarity, which scholars note makes this view nearly indistinguishable from Preference Diversity in practice.

  3. You believe decentralization is valuable because people want different lives, so one rule for everybody fits nobody. Your awkward commitment is accepting the rich region that resents paying for the poor one, acknowledging that solidarity is optional and inequality between regions is a feature, not a bug, of your system.

  4. You hold that the bigger level exists only to help the smaller do what it can't alone, meaning the decision level shifts to match whoever is affected. Your awkward commitment is supporting Brussels making a country do something it didn't want if the issue crosses borders, which collapses into centralization since almost every issue affects someone outside the boundary, leaving no hard limit on power.

  5. You suspect subsidiarity is just a slogan and what really decides things is who holds the purse strings and who you can sue. Your awkward commitment is admitting that whether a place gets to walk out of the bigger thing altogether depends solely on who has the guns, rendering your moral arguments merely aesthetic preferences for different masters, a view scholars accept as descriptive but reject as a guide for what ought to be.
