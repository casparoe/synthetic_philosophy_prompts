  2.  **Deconstruct the Core Concepts:**
      *   **Hindsight Bias/Creeping Determinism:** Knowing the outcome makes it seem inevitable. Overrating actors' foresight.
      *   **Narrative Fallacy:** Imposing a plot structure on random/complex events to make sense of them.
      *   **Danto's Narrative Sentences:** Retrospection is constitutive of historical understanding (we describe earlier events using later knowledge). It's not a bias to be removed, but the form of history itself.
      *   **The Film:** *Amadeus*. Salieri narrating his life to a priest. Salieri vs. Mozart. Salieri as "mediocrity" vs. Mozart as "genius". Salieri claiming to kill Mozart (fiction). The confessional frame.

  3.  **Drafting the Readings (Sketching 2-3):**
      *   *Reading 1 (The Student A position):* The film is the narrative fallacy incarnate. Salieri reconstructs the past to fit his guilt/vengeance. He imposes a plot (God vs. Salieri vs. Mozart) on chaos. It shows how history gets distorted by the narrator's need for meaning.
      *   *Reading 2 (The Student B position):* The film refutes the fallacy by exposing it. Because Salieri is unreliable (admits lies, we know the history), we see the construction. It warns us against trusting singular narratives.
      *   *Reading 3 (The Philosopher-Critic position - The one to defend):* The film transcends the binary. It argues that narrative is not merely a distortion (fallacy) nor purely a logical form (Danto), but an existential necessity. Salieri *needs* the plot to endure his mediocrity. The film suggests that historical understanding *is* a form of confession, where truth is subordinate to the moral shape of the life lived. It bridges the gap between cognitive bias and ontological condition.

  4.  **Developing the Argument:**
      *   *Inside vs. Outside:* The film locates the pressure to narrativise *inside* the participant (Salieri), not just the observer (us/the priest). Salieri lives his life *as if* it were a tragedy arranged by God. This is crucial. It's not just hindsight; it's concurrent narrativisation.
