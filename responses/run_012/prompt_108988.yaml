answer: |-
  # Seminar Handout: Desiderata for a Normative Theory of Rational Risk Attitude

  **Course:** Foundations of Rational Choice  
  **Topic:** Normative Specifications for Choice Under Risk  
  **Note:** The following list specifies what a model of rational risk attitude must deliver to be considered a viable *normative* theory. The goal is not to describe actual behavior (as in behavioral economics) but to delineate the boundaries of defensible preference structures.

  ---

  ## I. Choice Patterns and Cases the Theory Has to Get Right

  A normative theory must accommodate specific intuitive judgments about cases. While some patterns are empirical regularities, others serve as tests for rational coherence.

  **1. The Allais-Type Patterns (The Common Consequence Effect)**
  *   **The Case:** Agents prefer a sure gain over a high-probability large gain, but reverse this preference when both are scaled down by a common factor (violating the Independence axiom).
  *   **The Consideration:** This tests the **Sure-Thing Principle**. If the theory rules these preferences irrational *a priori*, it privileges a specific structural axiom over widespread intuitive judgment.
  *   **Status:** **Camp Commitment.** (Expected Utility theorists view this as a rationality requirement; rivals like Risk-Weighted Expected Utility view it as an undue constraint on risk sensitivity.)

  **2. The Insurance and Lottery Puzzle**
  *   **The Case:** One and the same agent rationally buys insurance (paying to avoid risk) and lottery tickets (paying to embrace risk) within the same domain (e.g., money).
  *   **The Consideration:** A theory relying solely on global concavity of utility (diminishing marginal utility) struggles to explain this without positing bizarre inflection points in the utility function. The theory must permit local variations in risk attitude or separate risk attitude from utility curvature.
  *   **Status:** **Non-negotiable.** (A normative theory of risk must permit this common pattern without declaring the agent incoherent.)

  ---

  ## II. Distinctions the Theory Must Not Collapse

  Conceptual clarity is a normative virtue. The theory must distinguish between distinct sources of value and distinct types of uncertainty.

  **3. Risk Aversion vs. Diminishing Marginal Utility (DMU)**
  *   **The Distinction:** Is risk aversion a distinct attitude toward the *distribution* of outcomes, or merely a byproduct of valuing money less as one has more?
  *   **The Consideration:** If these are collapsed, we cannot model an agent who values money linearly but still prefers a sure thing to a gamble.
  *   **Status:** **Non-negotiable.** (Conceptual coherence requires that attitude toward risk be separable from attitude toward outcomes.)

  **4. Mean-Preserving Spread vs. Preference for a Sure Thing**
  *   **The Distinction:** Between (a) rejecting a mean-preserving spread of a prospect one already holds (Rothschild-Stiglitz risk aversion) and (b) preferring a sure thing over a lottery of equal or greater expected value.
  *   **The Consideration:** These can come apart. An agent might reject a sure thing for a lottery with higher EV (risk-seeking in sense *b*) but still reject a mean-preserving spread of that lottery (risk-averse in sense *a* regarding dispersion). The term "risk aversion" must be precise about which is meant.
  *   **Status:** **Non-negotiable.** (Precision in definition is required to avoid equivocation in normative claims.)

  **5. Risk vs. Ambiguity (Unknown Probabilities)**
  *   **The Distinction:** Between risk (known probabilities) and ambiguity (unknown or undefined probabilities).
  *   **The Consideration:** Must the theory extend to ambiguity (e.g., Ellsberg preferences), or is it permissible to define the domain strictly as "risk"?
  *   **Status:** **Camp Commitment.** (It is permissible for a theory of *risk* to bracket ambiguity, provided it declares this scope limitation explicitly.)

  ---

  ## III. Formal Constraints on the Preference Relation

  These are structural axioms required for the preference ordering to be representable and actionable.

  **6. Stochastic Dominance**
  *   **The Constraint:** If prospect A yields a better outcome than prospect B in every possible state (or with higher cumulative probability at every level), A must be preferred to B.
  *   **The Consideration:** This captures the minimal thought that "more is better" and that probability mass should not be shifted to worse outcomes.
  *   **Status:** **Non-negotiable.** (Violating dominance is widely regarded as a definitive mark of irrationality.)

  **7. Reduction of Compound Lotteries**
  *   **The Constraint:** An agent must be indifferent between a multi-stage risk and its single-stage probabilistic equivalent (e.g., a 50% chance of a 50% chance of $100 is equivalent to a 25% chance of $100).
  *   **The Consideration:** This tests whether the *staging* of risk carries independent normative weight.
  *   **Status:** **Camp Commitment.** (Expected Utility treats this as mandatory; models sensitive to temporal resolution of uncertainty or anxiety treat this as optional.)

  **8. Dynamic Consistency and Precommitment**
  *   **The Constraint:** Plans made at time *t1* should not be voluntarily abandoned at *t2* without new information. However, the theory must account for the rational value of precommitment (tying one's own hands).
  *   **The Consideration:** If a theory implies that a risk-averse agent *must* abandon a prior plan simply because the risk profile has shifted (without new info), it undermines agency. Conversely, if it forbids precommitment, it ignores the rational management of future weakness or preference shifts.
  *   **Status:** **Non-negotiable.** (A normative theory of choice must support coherent agency over time.)

  ---

  ## IV. Arguments or Results It Must Not Contradict

  The theory must not generate conclusions that are demonstrably absurd or mathematically pathological.

  **9. The Calibration Argument (Rabin's Theorem)**
  *   **The Argument:** An expected-utility maximizer who turns down a modest 50/50 bet (e.g., lose $100, gain $110) at any wealth level is mathematically committed to turning down 50/50 bets with infinite upside at higher wealth levels.
  *   **The Consideration:** A theory must not let modest, plausible small-stakes risk aversion inflate into absurd large-stakes behavior. Risk aversion cannot be explained solely by local utility curvature.
  *   **Status:** **Non-negotiable.** (This is a *reductio ad absurdum* for standard EU explanations of risk aversion.)

  **10. The St. Petersburg Paradox (Unbounded Payoffs)**
  *   **The Case:** A lottery with infinite expected value but finite intuitive worth.
  *   **The Consideration:** The theory must provide a mechanism (e.g., bounded utility, probability weighting) to ensure preferences converge on finite values for realistic prospects.
  *   **Status:** **Non-negotiable.** (A normative theory must yield determinate verdicts.)

  ---

  ## V. Incompatibilities and The "Killer" Constraint

  **Incompatible Sets:**
  1.  **Allais Preferences + Reduction of Compound Lotteries + Dynamic Consistency.**
      *   You cannot satisfy all three. If you allow Allais patterns (violating Independence), you generally violate Reduction. If you violate Reduction, you face challenges with Dynamic Consistency unless you adopt a "sophisticated" choice model that allows for precommitment.
      *   *Resolution:* Most non-EU theorists sacrifice **Reduction** to preserve **Allais Patterns** and **Dynamic Consistency** (via precommitment).

  2.  **Expected Utility + Calibration (Small-Stakes Aversion).**
      *   You cannot maintain standard Expected Utility (where risk aversion is solely utility curvature) and satisfy the Calibration desideratum.
      *   *Resolution:* You must abandon standard EU or accept that small-stakes risk aversion is irrational (which contradicts the Non-negotiable status of Item 9).

  **The Most Restrictive Requirement:**
  The **Calibration Argument (Item 9)** does the most to rule out popular models. It single-handedly disqualifies Classical Expected Utility as a complete explanation of risk attitude. While Stochastic Dominance is a harder constraint to *violate* without looking irrational, Calibration is the hardest constraint to *satisfy* within standard mathematical frameworks. It forces the theorist to decouple risk attitude from outcome utility.

  ---

  ## VI. Model Scorecard

  **1. Classical Expected Utility (EU)**
  *   **Performance:** Fails **Calibration** (Item 9) and collapses **Risk vs. DMU** (Item 3). It cannot accommodate **Allais Patterns** (Item 1) without declaring them irrational. It handles **St. Petersburg** (Item 10) only if utility is bounded.
  *   **Verdict:** Fails key non-negotiables regarding the source of risk aversion.

  **2. Risk-Weighted Expected Utility (REU) [Buchak]**
  *   **Performance:** Satisfies **Calibration** (Item 9) by separating risk weights from utility. Accommodates **Allais Patterns** (Item 1) and distinguishes **Risk vs. DMU** (Item 3).
  *   **Cost:** Violates the **Sure-Thing Principle** (Item 1 - Camp Commitment) and faces challenges with **Dynamic Consistency** (Item 8) unless specific updating rules are adopted.
  *   **Verdict:** Strongest contender on non-negotiables, at the cost of EU-specific axioms.

  **3. Third Contender: Disappointment Aversion (Gul)**
  *   **Performance:** Excellent at handling the **Insurance/Lottery Puzzle** (Item 2) by making utility reference-dependent. Separates **Risk vs. DMU** (Item 3).
  *   **Cost:** Like EU, standard formulations often rely on utility curvature over final wealth, leaving them vulnerable to the **Calibration Argument** (Item 9) unless modified.
  *   **Verdict:** Superior on psychological plausibility (Item 2), but REU remains superior on the Calibration constraint (Item 9).

  **Summary Recommendation:**
  For a normative seminar, **REU** currently offers the best balance of satisfying the **Non-negotiable** constraints (specifically Calibration and Distinctions) while explicitly acknowledging the **Camp Commitments** (Sure-Thing, Reduction) it rejects. However, students should be warned that satisfying **Dynamic Consistency** while violating **Independence** remains an active area of technical debate.
