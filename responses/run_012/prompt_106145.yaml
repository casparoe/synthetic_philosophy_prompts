prompt: |-
  I'm putting together a section of a paper on hedonism and I want to use a real stretch of neuroscience as the test case, so I need you to run the analysis for me rather than hand me the usual summary. The theory side is the heterogeneity problem for hedonism: the worry that the pleasure of a hot bath, the pleasure of finally getting a glass of water when you're parched, the pleasure of cracking a proof, and the pleasure of hearing your friend got the job have nothing in common except the word, so it starts to look like there's no single kind of thing that pleasure names. That's the pressure that pushes people off sensory hedonism, where pleasure is a distinctive feeling, toward attitudinal hedonism, where pleasure is taking a pro-attitude toward something, or toward desire-based views. I know that back and forth, so dont spend the answer rehearsing it.

  What I want is the episode, analyzed. The episode is the history of the brain's reward system. In the early fifties two researchers at McGill were trying to study something else when their rats kept coming back to the corner of the box where they'd been electrically stimulated; they went on to show you can train a rat to press a lever just to zap its own septal area, and the rats will hammer the lever thousands of times and skip food to keep at it. That got read as the discovery of the brain's pleasure centre, and for decades dopamine was basically sold as the pleasure chemical. Then it came apart. Work from the nineties on, Berridge and others, showed dopamine is much more about motivation and wanting, cue-triggered craving and incentive salience, than about pleasure itself: animals with their dopamine system wiped out can still show the facial liking reactions to sugar but won't work for it, and addicts want the thing long after they've stopped liking it much. The liking signal itself seems to sit in small opioid and endocannabinoid hotspots in the nucleus accumbens and ventral pallidum, and it shows up as the same taste-reactivity pattern in rats and in human infants. There's also the clinical oddity of patients who report the pain is still there, as intense as ever, but it just doesn't bother them anymore, and the seventies case of a human with implanted electrodes who kept pressing the button and complained when the unit was taken away.

  So: map that whole arc onto the heterogeneity problem, carefully. If sensory hedonism is right, what should the reward system have looked like, and does it look that way? Does the wanting-versus-liking split line up with the attitudinal-versus-sensory split, or does it cut across it? I suspect it cuts across and I want you to tell me if that's wrong. When the field finds one common liking signal running through sweet tastes, sex, and drugs, is that a common feeling or just a common cause, and does either answer actually help the hedonist? Which parts of the episode does the heterogeneity worry explain, like why the pleasure-centre story kept collapsing and why pleasure and motivation kept coming unstuck, and which parts does it fail to explain? Then run it the other direction: what does this episode show about hedonism as a theory, a confirmation, an anomaly, or a case it never anticipated? Be honest about where the theory is simply silent and where the neuroscience underdetermines the philosophical claim, and don't let the animal work carry more weight than it can. No citations or reading list, I dont need them.
