answer: |-
  **IN THE MATTER OF THE ARBITRATION BETWEEN HELIOS IMPORTS, LLC AND ZENITH EXPORTS, INC.**
  **AWARD OF THE TRIBUNAL**

  1. The Tribunal, constituted under the Uniform Axiomatic Fairness Act, convened to adjudicate the division of surplus revenue generated by Joint Venture Alpha. The parties failed to reach a consensual settlement regarding the distribution of the final fiscal year's proceeds. The Tribunal proceeds to issue this Final Award based on the governing Code of Bargaining Solutions, applying the mandatory axioms to the feasible set of agreements.

  2. The factual record establishes the feasible set of agreements as a convex set bounded by a linear Pareto frontier. The total distributable surplus is fixed at 120 utility units. The Tribunal first identifies the disagreement point, $d$. Upon dissolution of the venture, Helios retains no claim to future revenue, and Zenith retains no claim to future revenue. Accordingly, $d = (0, 0)$.

  3. The Tribunal next identifies the ideal point, $I$. This point comprises the maximum feasible payoff for each party, calculated independently. Helios submitted evidence establishing its maximum conceivable capture of the surplus is 100 units. Zenith submitted evidence establishing its maximum conceivable capture is 60 units. Thus, $I = (100, 60)$.

  4. During the evidentiary phase, Helios sought to introduce testimony regarding its higher operational overhead, greater capital contribution, and Zenith's prior contractual breaches. The Tribunal sustained Zenith's objection to all such testimony. Under Section 4(c) of the Code (Invariance to Positive Affine Transformations), utility scales are arbitrary. Testimony regarding real-world valuation, economic need, or moral culpability is irrelevant to the geometric relationship between $d$ and $I$. The award depends on nothing but the coordinates of these two points. Evidence regarding the substantive meaning of the goods is excluded.

  5. Helios subsequently amended its claim, presenting new market data suggesting its ideal payoff is actually 110 units, not 100. Zenith invoked Section 4(d) (Individual Monotonicity), arguing that because Helios's ideal payoff increased while Zenith's remained constant, Zenith's absolute award cannot shrink. Zenith sought to turn this axiom to its advantage, contending that any solution violating this monotonicity property would be statutorily invalid. The Tribunal agreed. The expansion of Helios's opportunity set cannot penalize Zenith. The award must reflect the updated ideal point $I' = (110, 60)$ while ensuring Zenith's allocation does not decrease relative to the prior calculation.

  6. The Tribunal applies the Kalai–Smorodinsky solution. The award lies on the line segment connecting $d$ and the updated ideal point $I'$. The award must also lie on the Pareto frontier where Helios ($H$) + Zenith ($Z$) = 120. The line from $d$ to $I'$ dictates that $Z = (60/110)H$. Solving the system $H + (60/110)H = 120$ yields $H = 77.65$ and $Z = 42.35$. Both parties realize exactly 70.6% of their respective ideal gains. This satisfies Pareto optimality and symmetry. The arithmetic confirms the equal-proportional-gains property required by the Code.

  7. A Memorandum from the Tribunal Clerk was entered into the record, urging adoption of the Nash Bargaining Solution. The Clerk argued that the Nash solution satisfies Independence of Irrelevant Alternatives (IIA), ensuring that the removal of non-optimal options does not alter the outcome. The Clerk contended that IIA provides greater stability than Individual Monotonicity when the feasible set shifts, and that the Nash solution is the standard for efficiency.

  8. The Tribunal rejects the Clerk's recommendation. While the Nash solution satisfies IIA, it violates Individual Monotonicity. The Code prioritizes the principle that a party should not be penalized by the expansion of another party's opportunities. Normatively, Monotonicity offers a stronger guarantee of fairness than IIA. The Tribunal finds that preserving the proportional gain relative to the ideal point is more compelling than preserving the outcome against irrelevant alternatives. The axioms are not merely mathematical properties; they are statutory mandates governing this arbitration. The choice between solutions is a choice between competing normative axioms, not computational methods.

  9. Accordingly, the Tribunal awards Helios Imports, LLC 77.65 units and Zenith Exports, Inc. 42.35 units. All other claims are dismissed.
