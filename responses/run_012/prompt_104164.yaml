          *   Address specific philosophical problems: Information vs. Representation, Content fixation (correlation vs. causation vs. decoder), Distributed/Superposed representations, Misrepresentation, Relation arity (2-place vs. 3-place), Task/Context role.
          *   Mark requirements as "Non-negotiable" (for safety/interpretability) or "Preference" (camp-specific).
          *   Identify tensions/incompatibilities explicitly.
          *   Briefly score main families of views at the end.

  2.  **Deconstruct the Provided Cases (Phenomena to Anchor):**
      *   *Case 1 (Probe vs. Causal):* Probe finds info, ablation does nothing vs. Patching changes behavior, probe fails. -> Tension between Information and Causal Role.
      *   *Case 2 (Polysemanticity vs. SAE):* Single unit = many things vs. SAE = monosemantic features (same function). -> Tension between Substrate and Ontology of representation.
      *   *Case 3 (Steering Side-effects):* Steering concept X shifts behavior Y. -> Tension between Isolation and Entanglement.
      *   *Case 4 (Geometry vs. Behavior):* Same geometry/diff behavior & Diff geometry/same behavior. -> Tension between Structural Isomorphism and Functional Role.
      *   *Case 5 (Stability):* Same concept, diff directions (seeds/layers). -> Tension between Realization Independence and Specificity.
      *   *Case 6 (Context):* Feature used in Task A, inert in Task B. -> Tension between Disposition and Occurrent use.

  3.  **Brainstorming Philosophical & Technical Tensions:**
      *   *Information vs. Representation:* A cloud contains information about rain, but doesn't represent rain. A network layer contains mutual information about the label, but does it represent it? Need a causal or functional filter.
      *   *Causal Role:* If it doesn't *do* anything, is it a representation? (The "Epiphenomenal Probe" problem). But if we require strict causality, do we lose latent capabilities (safety risk)?
      *   *Misrepresentation:* Crucial for safety. If a model *cannot* be wrong about X, does it represent X or just correlate with it? (Fodor's disjunction problem).
      *   *Granularity:* Is the representation the neuron? The subspace? The SAE feature? The whole activation vector?
      *   *Interpreter:* Does the representation exist without a decoder? (Internal consumer vs. external researcher). For safety, we care about what the *model* uses, not what we can read.
      *   *Context:* Representations seem dynamic. A static map fails if the route changes based on traffic (task).

  4.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Causal Efficacy.* Must affect downstream computation. *Motivation:* Probe/ablation mismatch. *Status:* Non-negotiable for safety (need to know if it's used).
      *   *Req 2: Decodability/Readability.* Must be recoverable. *Motivation:* Patching without probe. *Status:* Preference (maybe not strictly necessary if causal role is clear, but needed for audit). Let's make it Non-negotiable for *auditability*, but note the tension.
      *   *Req 3: Misrepresentation.* Must allow error. *Motivation:* Safety (latent goals). *Status:* Non-negotiable for truth-conditions.
      *   *Req 4: Substrate Neutrality.* Doesn't depend on specific neurons. *Motivation:* SAE vs. Polysemanticity, Geometry mismatches. *Status:* Non-negotiable.
      *   *Req 5: Context Sensitivity.* Content depends on task/state. *Motivation:* Feature inert in Task B. *Status:* Non-negotiable (empirical fact).
      *   *Req 6: Isolation/Independence.* Steering X shouldn't break Y. *Motivation:* Steering side-effects. *Status:* Preference (Ideal vs. Reality).

      *Refining the Tensions:* The prompt specifically asks to identify where requirements pull apart.
      *   *Tension 1:* Causal Role vs. Misrepresentation. If content is fixed by causal role, how can the role be "wrong"? (Teleosemantics tries to solve this).
      *   *Tension 2:* Stability vs. Context. If content changes with task, is it the *same* representation?
      *   *Tension 3:* Internal vs. External. Does the "interpreter" matter? For safety, we are the interpreters looking for danger, but the model is the consumer using the rep.

  5.  **Finalizing the List Structure:**
      *   Format: Requirement Name | Status | Motivation/Case | Philosophical Anchor.
      *   Section on Incompatibilities.
      *   Section on Scoring Families.

  6.  **Developing the Content (incorporating specific constraints):**
      *   *Safety Audit Focus:* This is key. If I want to say "the model represents a goal it never expresses," I need a theory that allows latent, unexpressed but real representations. This pushes against strict causal role (if it's never expressed, does it play a role?). I need to distinguish *capacity* from *occurrence*.
      *   *The "Truth Value" Goal:* The theory must make "Rep(X)" true or false, not just "Useful to say Rep(X)".

      *(Self-Correction during drafting)*: I initially thought about making Decodability non-negotiable. But the prompt mentions "direction found by activation patching causally moves behaviour yet no probe recovers it cleanly." If I make decodability non-negotiable, I rule out that case as a representation. But for safety, the causal effect is more important than our ability to read it linearly. So, *Causal Potential* is non-negotiable, *Linear Decodability* is a preference/methodological constraint.

      *(Refining Misrepresentation)*: To claim a model represents a hidden goal, I need to show it *could* act on it, or that its internal structure tracks the goal even when output doesn't. This requires a distinction between *vehicle* and *content*.

      *(Refining the "Interpreter")*: For safety, *we* are the interpreters auditing the system. But the *system* must be the consumer for it to be an internal representation guiding behavior. I need to specify this 3-place relation carefully.

  7.  **Drafting the Incompatibilities:**
      *   Causal Role vs. Misrepresentation is the classic Fodor problem. If content = causal role, error is impossible (whatever causes the state *is* the content).
      *   Context-Free Content vs. Empirical Stability. Probes show content moves. Theory must allow content to be context-bound, which makes "The model represents X" incomplete without "in context C".

  8.  **Drafting the Scoring:**
      *   *Decodable Info:* Fails Causal, Fails Misrep.
      *   *Causal/Structural:* Fails Misrep (hard), Good on Safety.
      *   *Task-Relative:* Good on Context, Hard on Stability.
      *   *Sparse Features:* Good on Ontology, Neutral on Content.

  9.  **Final Review against Prompt:**
