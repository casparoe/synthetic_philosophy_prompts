answer: |-
  ### Phenomenological Synthesis

  Before stating the requirements, I have compressed the conflicting phenomena you listed into three core tensions that any theory must resolve. These are not just empirical quirks; they are the boundary conditions for your truth-conditions.

  1.  **The Epiphenomenal Information Tension:** Linear probes find information that ablation cannot remove (redundant/robust coding), while causal interventions find drivers that probes cannot read (non-linear/distributed coding). A theory cannot equate representation with mutual information (too permissive) nor with strict linear decodability (too restrictive).
  2.  **The Ontological Granularity Tension:** Polysemantic neurons vs. monosemantic SAE features. The network function is invariant to this redescription. A theory must specify whether the *vehicle* of representation is the physical substrate (neurons/activations) or the functional basis (features), without making representation an artifact of the theorist's decomposition choice.
  3.  **The Contextual Stability Tension:** Representations shift geometry across seeds/layers (realization independence) and toggle utility across tasks (context dependence), yet behavior remains stable. A theory cannot demand fixed geometric signatures, nor can it allow content to be so fluid that "representing X" loses predictive power across contexts.

  ---

  ### Desiderata for a Theory of Neural Representation

  The following requirements distinguish between conditions necessary for a safety-relevant realist claim (**Non-negotiable**) and conditions that reflect specific metaphysical commitments (**Preference**).

  #### 1. Counterfactual Causal Efficacy
  *   **Status:** **Non-negotiable** (Safety Critical)
  *   **Motivation:** *Probe/ablation mismatch; Steering side-effects.*
  *   **Requirement:** A state $R$ represents content $C$ only if $R$ plays a causal role in generating behavior appropriate to $C$ under *relevant counterfactual conditions*, not necessarily in the actual forward pass.
  *   **Consideration:** This solves the "epiphenomenal probe" problem (info present but unused) and the "latent goal" safety problem (goal represented but not yet expressed). If a steering vector moves behavior, the direction has causal potential. If ablation does nothing, the representation is redundant, not absent. The theory must distinguish *capacity* from *occurrence*. A safety audit requires knowing what the model *would* represent if triggered, not just what it currently outputs.

  #### 2. Consumer Relativity (The Three-Place Constraint)
  *   **Status:** **Non-negotiable**
  *   **Motivation:** *Feature inert in Task A, used in Task B; Geometry/behavior mismatch.*
  *   **Requirement:** Representation is a three-place relation: $Rep(Network, Content, Consumer)$. The "Consumer" is the downstream mechanism within the network that reads the state to produce output or further computation.
  *   **Consideration:** A direction in activation space is not a representation in virtue of an *external* researcher decoding it (the "God's eye" probe). It is a representation only relative to the internal circuitry that consumes it. This anchors content to the network's own functional architecture, preventing the theorist from projecting meaning onto noise. It explains why a feature is a representation in Task B (consumer active) but not Task A (consumer gated off).

  #### 3. Error Possibility (The Misrepresentation Condition)
  *   **Status:** **Non-negotiable** (Truth-Value Critical)
  *   **Motivation:** *Safety audit for unexpressed goals.*
  *   **Requirement:** The theory must specify conditions under which the network can be in state $R$ (which typically represents $C$) when $C$ is false, without $R$ simply coming to represent "whatever caused $R$."
  *   **Consideration:** If content is fixed purely by actual causal covariance, error is impossible (Fodor's disjunction problem). For a safety audit to claim "the model represents a deceptive goal," it must be possible for the model to represent that goal *incorrectly* or for the goal to be present without the behavior. Without this, "representation" collapses into "correlation," and you cannot distinguish a model planning X from a model that merely correlates with X-data.

  #### 4. Realization Independence
  *   **Status:** **Non-negotiable**
  *   **Motivation:** *Same concept decodable from different directions across seeds/layers.*
  *   **Requirement:** The identity of the content $C$ must not depend on the specific geometric orientation or physical substrate of the vehicle $R$, provided the functional role is preserved.
  *   **Consideration:** If "dog" is represented by vector $v_1$ in Seed A and $v_2$ in Seed B, a theory that ties content to $v_1$'s specific coordinates fails. The theory must identify the *invariant structure* (e.g., similarity relations, causal profile) that persists across realizations. This prevents the theory from being falsified by every retraining run.

  #### 5. Vehicle Specificity (Non-Arbitrariness)
  *   **Status:** **Preference** (Mechanistic Interpretability Camp)
  *   **Motivation:** *Polysemantic units vs. SAE features.*
  *   **Requirement:** There is a fact of the matter about which basis (neurons, SAE features, principal components) constitutes the genuine vehicles of representation, independent of the theorist's choice of decomposition.
  *   **Consideration:** If *any* basis change counts as a valid redescription, representation becomes a *façon de parler* dependent on the analyst. A realist theory must argue that one ontology (e.g., sparse features) is metaphysically privileged because it aligns with the network's actual causal grain. If you reject this, you accept that "representation" is relative to the interpretability technique used.

  #### 6. Content Stability Across Context
  *   **Status:** **Preference** (Traditional Cognitive Science Camp)
  *   **Motivation:** *Feature used in one task, inert in another.*
  *   **Requirement:** The content $C$ of a representation $R$ should remain stable even if the downstream consumer's usage of $R$ changes slightly across tasks.
  *   **Consideration:** If content shifts entirely with every task context, we cannot say "the model represents X" without adding "...in context C." This makes generalization claims difficult. However, empirical evidence suggests content is highly context-dependent. A theory demanding stability may have to reject many neural states as genuine representations, favoring only deep, abstract latents.

  #### 7. Interventional Isolation
  *   **Status:** **Preference** (Engineering/Safety Camp)
  *   **Motivation:** *Steering vector shifts unintended behavior.*
  *   **Requirement:** It must be possible to intervene on $R$ to alter $C$ without altering unrelated contents $C'$.
  *   **Consideration:** This is an idealization. In superposed networks, representations are entangled. If a theory requires strict isolation to count as representation, most neural states will fail. However, for safety, we need to know if we can *make* them isolated. This requirement functions as a goal for abstraction rather than a condition for existence.

  ---

  ### Incompatibilities and Trade-offs

  You suspected tensions between causal role and misrepresentation, and between stability and context. Here is the explicit breakdown of what must give:

  1.  **Causal Role vs. Misrepresentation (The Disjunction Problem):**
      *   **Conflict:** If content is fixed by *actual* causal role (Req 1), then whatever causes the state *is* the content. Error becomes impossible. If the model activates "deception" features only when deceiving, it never misrepresents deception.
      *   **Resolution:** You must adopt a **Teleological or Structural** account. Content is fixed by the *selected function* of the consumer (what it was trained/evolved to do) or by the *structural relations* $R$ holds to other representations, not just its immediate causal output.
      *   **Cost:** This introduces normativity. You must define the "proper function" of the network independent of its actual behavior. For safety, this means defining the "intended goal" externally to judge the internal representation against it.

  2.  **Context Sensitivity vs. Truth-Conditional Stability:**
      *   **Conflict:** Req 2 (Consumer Relativity) implies content changes if the consumer's usage changes (Task A vs. Task B). Req 4 (Realization Independence) and general scientific practice want to say "The model represents Dog" simpliciter.
      *   **Resolution:** You must accept that "The model represents X" is an ellipsis for "The model represents X *relative to circuit Y*."
      *   **Cost:** This makes safety auditing harder. You cannot audit the model globally; you must audit specific circuits in specific contexts. A "deceptive goal" might be represented in the RLHF-tuning circuit but not the pretraining circuit.

  3.  **Vehicle Specificity vs. Realization Independence:**
      *   **Conflict:** Req 5 demands a specific basis (e.g., SAE features). Req 4 demands content survive basis changes.
      *   **Resolution:** The *vehicle* is specific (the SAE feature), but the *content* is determined by the feature's role, which can be realized by different features in different networks.
      *   **Cost:** You commit to the metaphysical reality of SAE features (or similar). If SAEs are just useful fictions, Req 5 fails, and representation becomes instrumental.

  ---

  ### Brief Scoring of Theoretical Families

  | Family | Causal Efficacy | Misrepresentation | Context/Task | Vehicle Specificity | Safety Utility |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Decodable Information** (Probing) | **Fail.** (Allows epiphenomena) | **Fail.** (Correlation $\neq$ Error) | **Pass.** (Can probe per task) | **Fail.** (Basis arbitrary) | **Low.** (Cannot distinguish latent capacity) |
  | **Causal/Structural Role** (Activation Patching) | **Pass.** (Defines by intervention) | **Struggle.** (Needs teleology) | **Pass.** (Role is context-bound) | **Pass.** (Identifies causal grain) | **High.** (Identifies drivers) |
  | **Task-Relative Posit** (Instrumentalism) | **Pass.** (Defined by use) | **Fail.** (No truth value) | **Pass.** (Explicitly relative) | **Fail.** (Pragmatic choice) | **Medium.** (Useful, but no realist claims) |
  | **Recovered Sparse Feature** (SAE/Dict) | **Pass.** (If features causal) | **Pass.** (If features have norms) | **Struggle.** (Features may split/merge) | **Pass.** (Commits to features) | **High.** (Best candidate for "units" of thought) |

  **Recommendation:** For your safety audit purpose, a hybrid of **Causal/Structural Role** and **Recovered Sparse Feature** is the only viable path. It satisfies the Non-negotiables by grounding representation in causal capacity (allowing latent goals) and specific vehicles (allowing auditability), provided you solve the normativity problem (how to define "error" without appealing to human intent).
