      *   *Illumination:* Shows that the "principle" of sovereignty was a cover for merchant rent-seeking.
      *   *Limits:* Smith's representation scheme is technocratic. It ignores the *affective* bond of empire. It assumes rational actors. It doesn't account for the emerging sense of *American* identity vs. *British* identity.
      *   *Silence:* Smith says little about the moral right of self-determination independent of economic utility.

  5.  **Refining the Argument (Scottish Enlightenment Context):**
