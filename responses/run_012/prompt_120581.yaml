      *   **Specific Constraints:**
          *   Do not just summarize Dennett.
          *   Do not lean heavily on secondary literature.
          *   Focus on the *translation* and the *residue report*.
          *   Address specific loose ends: Dennett's "real pattern/compression" vs. "cheapest description," and Predictive State Representations (PSRs).
