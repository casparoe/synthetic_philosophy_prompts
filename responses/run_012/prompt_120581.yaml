      *   **User Profile:** Cognitive Science major. Currently taking Philosophy of Mind (Dennett, Intentional Stance) and Computational Cog Sci (RL, POMDPs, Belief States). Also involved in an Interpretability Reading Group (probes, activation space, causal interventions).
