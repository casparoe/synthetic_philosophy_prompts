  9.  *(Mental Draft of the "PSR" point)*: If we use PSRs, the "state" is predictions of future observations. Dennett says beliefs are predictive tools. PSRs say states *are* predictive tools. This collapses the distinction between representation and prediction. This suggests the Realist objection ("but what is it representing?") is a category error if the system is purely predictive.

