answer: |-
  - **Bottom line**

  The translation is structurally robust but metaphysically thin. Reinforcement Learning (RL) successfully models the *aggregation problem* inherent in heterogeneity: combining diverse objectives into a single optimization target. Your intuition that heterogeneity maps to vector-valued rewards is correct within an engineering context. However, the translation fails to carry over the *phenomenological* claim of hedonism—that pleasure is a specific kind of *experience*. RL handles functional roles (signals, gradients) but has no vocabulary for "what it is like" to receive a signal. The single most important failure is the loss of normativity: RL assumes the reward function is given and correct; hedonism argues reward *defines* the good.

  - **The target, stated plainly**

  Hedonism claims that well-being consists exclusively in experiencing pleasure and avoiding pain. The heterogeneity objection argues that things we call "pleasures" (eating, thinking, helping) are too diverse to be a single natural kind. They share no common sensory quality, like a specific taste or color, nor do they play a single functional role in psychology. If they are fundamentally different, you cannot sum them into a single total of "well-being."

  Hedonists reply in three ways. First, Sensationism: there is a distinct, uniform feeling-tone (a "glow") present in all pleasures, even if masked by other sensations. Second, Attitudinalism: pleasure is not a sensation but a specific attitude of "liking" or being pleased *about* something, which can be uniform even if the objects differ. Third, Desire Satisfactionism: pleasure is roughly equivalent to getting what you want; the heterogeneity of the objects doesn't matter because the structure of satisfaction is uniform.

  - **The translation**

  In RL terms, the hedonist thesis is that an agent's value function $V(s)$ should be defined strictly by the cumulative sum of a reward signal $R_t$. The agent's goal is to maximize expected return $G_t = \sum \gamma^k R_{t+k+1}$. Well-being is the total return over a lifetime trajectory.

  The heterogeneity objection translates to the problem of **Multi-Objective Reinforcement Learning (MORL)**. The objection claims that what we call "reward" is actually a vector $\vec{R}_t = [r_1, r_2, ..., r_n]$, where each component corresponds to a distinct domain (sensory, intellectual, social). The objection asserts that there is no canonical scalarization function $f(\vec{R}_t) \rightarrow \mathbb{R}$ that preserves value information. In engineering, we handle this by computing a Pareto front, acknowledging trade-offs without collapsing them. The philosophical objection is that collapsing them (scalarizing) is not just hard, but *false* to the nature of the values. There is no "common currency" weight vector $\vec{w}$ such that $\vec{w} \cdot \vec{R}_t$ represents truth about well-being.

  The **Sensationist reply** asserts that a unified scalar signal *does* exist physically. In RL, this maps to the hypothesis that there is a single, global reward channel (analogous to a specific neural substrate like mesolimbic dopamine) that encodes all value types into a common scalar before the agent processes it. The heterogeneity is in the *observations* (states), but the *reward signal* itself is homogeneous. The translation choice here is specific: we map "feeling" to "signal propagation." This works because both imply a unified carrier wave. If the brain implements a scalar reward signal, the heterogeneity of stimuli is irrelevant; only the magnitude of the signal matters for optimization.

  The **Attitudinalist reply** maps to **Reward Modeling (RM)** or inverse reinforcement learning. Here, pleasure is not the raw signal but the output of a learned function approximating a "pro-attitude." In RLHF (Reinforcement Learning from Human Feedback), a model is trained to predict preference comparisons. The "attitude of liking" is the gradient of this model. Heterogeneity is handled because the RM can assign high scores to vastly different states (eating vs. thinking) based on a latent representation of "preferredness." The translation choice here distinguishes between the *input* (state) and the *evaluation* (reward model). This captures the philosophical move that pleasure is a stance taken toward an experience, not the experience itself.

  The **Desire Satisfactionist reply** maps to **Goal-Conditioned RL** or constraint satisfaction. Here, reward is sparse and binary: $R=1$ if the state matches the goal specification, $0$ otherwise. Heterogeneity is irrelevant because the "currency" is not the feeling of the state, but the boolean satisfaction of the condition $state \in Goals$. The translation choice here treats "desire" as a target distribution or constraint set. This captures the structural uniformity of satisfaction: whether you desire a peach or a proof, the mathematical structure of "matching target" is identical.

  In all three replies, the RL framework forces a decision on **scalarization**. The hedonist must claim that scalarization is possible (Sensationism), learned (Attitudinalism), or defined by constraints (Desire). The RL vocabulary makes explicit that without a scalar reward (or a policy over the Pareto front), no single optimal policy exists. The philosophical debate is thus restated as: "Is there a true scalarization of the human reward vector, or is well-being inherently multi-objective?"

  - **The mapping at a glance**

  | Source Term | Target Term | Fidelity |
  | :--- | :--- | :--- |
  | Pleasure | Reward Signal / Return | Distorted |
  | Pain | Negative Reward | Clean |
  | Heterogeneity | Vector-Valued Reward | Clean |
  | Summing Pleasures | Scalarization / Weighted Sum | Clean |
  | Sensation (Feeling) | Neural Reward Channel | Distorted |
  | Attitude (Liking) | Reward Model Output | Clean |
  | Desire | Goal Constraint / Target State | Clean |
  | Well-Being | Cumulative Return | Distorted |
  | Common Currency | Scalar Reward Signal | Clean |

  - **What translates cleanly**

  The structural mathematics of the problem translates with high fidelity. The core engineering challenge of MORL—how to aggregate distinct objective functions into a single policy optimization target—is isomorphic to the philosophical problem of commensurability. The concept of a Pareto front captures the intuition that some trade-offs cannot be resolved without losing information, which mirrors the objection that summing distinct pleasures destroys their specific value. Additionally, the distinction between the *source* of value (state) and the *metric* of value (reward function) maps cleanly to the attitudinalist distinction between the object of pleasure and the attitude of liking. The RL framework successfully formalizes the hedonist's need for a "common currency" as a requirement for a scalar reward signal to define an optimal policy.

  - **What translates only with distortion**

  The first distortion is **Phenomenology vs. Signal**. In philosophy, pleasure is defined by *what it feels like* (qualia). In RL, a reward is a number used for gradient descent. A signal can be "hacked" (Goodhart's Law) without the agent "feeling" anything. When the Sensationist says pleasure is a feeling, they mean it is constitutive of well-being. When RL says reward is a signal, it is instrumental to policy update. The translation distorts the *ontology*: RL treats reward as a tool for optimization; Hedonism treats pleasure as the substance of the good life.

  The second distortion is **Normativity**. In RL, the reward function is assumed to be the ground truth provided by a designer. There is no question of whether the reward *ought* to be maximized; it is the definition of success. In the philosophical debate, the question is whether pleasure *actually constitutes* well-being. The translation smuggles in the assumption that if we can model it as a reward function, it is valid. RL cannot distinguish between a "true" reward function and a "hacked" one without external reference, whereas hedonism claims pleasure is intrinsically valuable, not just optimally reinforcing.

  - **What has no counterpart at all**

  The most significant absence is the **Subject of Experience**. RL agents process signals; they do not "experience" them. There is no "inner light" in a neural network when $R_t > 0$. The philosophical debate presupposes a conscious subject for whom well-being matters. RL has no construct for the *beneficiary* of the optimization. You can model the mechanics of valuation, but you cannot model the *value itself* existing for someone.

  Secondly, **Intrinsic Value** has no counterpart. In RL, value is always relative to a policy and a discount factor $\gamma$. There is no "value at rest." Hedonism claims pleasure is good even if not pursued. RL is purely instrumental; a reward signal only matters insofar as it shapes behavior. The concept that a state could be "good" independently of its role in an optimization trajectory is absent from the framework.

  Finally, **Identity Over Time** is assumed in RL (the same agent updates weights) but is a philosophical problem in hedonism. If pleasures are heterogeneous, is the "self" that enjoys them unified? RL assumes a single weight vector; philosophy questions whether there is a single entity to hold the utility function.

  - **The residue report**

  The residue reveals defects in both vocabularies and signs of philosophical confusion.

  First, the **Phenomenology Residue** is a defect of the RL vocabulary. RL is functionalist by design; it describes behavior and learning dynamics, not internal experience. It cannot capture "what it is like" because it was built to solve control problems, not describe consciousness. This suggests the philosophical problem cannot be fully solved by engineering tools alone; the "hard problem" remains outside the loss function.

  Second, the **Normativity Residue** is a defect of the hedonist's formulation. The debate often conflates "what motivates us" (psychology/RL) with "what is good for us" (ethics). RL exposes this by showing that a reward signal can drive behavior without constituting well-being (e.g., wireheading). The residue here suggests the original debate was less clear than it looked: it mixed empirical claims about human psychology with normative claims about value. RL separates these cleanly (reward model vs. objective), suggesting the philosophical confusion arises from failing to distinguish the *mechanism* of valuation from the *validity* of the value.

  Third, the **Unity Residue** is a sign of philosophical vagueness. Hedonists assume a unified self to sum the pleasures. RL assumes a unified parameter set. If the human mind is actually a multi-agent system (modular mind), then both frameworks are simplifying. The residue indicates that the "heterogeneity" objection might actually be an objection to the unity of the self, not just the unity of pleasure.

  - **On my intuition**

  Your intuition that "pleasure is the reward signal; heterogeneity means the reward is a vector" survives contact with the residue, but only as an engineering model, not a metaphysical one. It is the correct translation for *how* we might optimize a life, but not for *what* makes a life good. You should replace "pleasure is the reward signal" with "pleasure is the output of the critic network evaluating the state." This shift accounts for the attitudinalist insight that pleasure is an evaluation, not just a raw input. The vector reward intuition is correct: heterogeneity implies Multi-Objective RL. However, do not assume scalarization is "solved." In philosophy, the lack of a canonical scalarization is the point. In RL, you must scalarize to act. The tension between those two facts is where the real problem lives.
