prompt: |-
  I'm on the board of a small family foundation — we give out about eight grants a year, $20-40k each, mostly local education and public health with a bit of climate stuff mixed in. We meet quarterly and each proposal gets maybe twenty minutes. We're stuck in a loop. Half the board says you can't possibly know the long-run consequences of anything — the kid who gets dewormed grows up to be a dictator, the community center gets a new roof and then the neighborhood gentrifies — so we should fund whatever feels decent and stop pretending otherwise. The other half says that's just an excuse for laziness, and we should estimate expected value and pick the biggest number. I've read enough philosophy to know both sides have a point and that this is roughly what people mean by cluelessness, but I have no idea how to get it out of the seminar room and into a board meeting.

  What I want is a decision procedure we can actually run, in order, on a one-page proposal, in the twenty minutes we've got, with a board that includes a retired accountant, a high school principal, and my niece who's doing a PhD in philosophy. It needs to:

  - seperate the two kinds of ignorance we're dealing with — the kind where we can't trace the causal chain at all, and the kind where we can trace it fine but can't put the effects on a common scale — because I suspect they call for completely different responses;
  - say what to do at each step, what counts as a good enough answer, and where the procedure is allowed to stop with a yes or a no;
  - mark the points where we're just making a value call and dressing it up as procedure, since our minutes have to be honest; and
  - include something for the case where the procedure says expected value is uninformative and "fund what feels decent" is unearned — where do we go when both branches fail? I want a tiebreak we can actually apply, even if it's crude.

  Then run it on three proposals from last quarter: (a) $30k to expand a deworming program in a country we already work in, where the short-term health effects are solid but the long-run development story is contested; (b) $25k to a local group running free legal clinics for tenants facing eviction, where we can see effects for about two years and then nothing; (c) $40k to a small advocacy outfit pushing a state-level policy that would affect a few million people if it passed, which it probaly won't, and which we honestly can't tell would be good on net even if it did. For each one, tell me what the procedure spits out, and be blunt about which of the three it's going to make me vote against even though I personally want to fund it.

  And if there's a step where the honest answer is "this is a coin flip, admit it and flip", say so, and tell me how to do that without it becoming an excuse for every hard call.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small family foundation board (quarterly meetings, 8 grants/year, $20-40k each). Focus: Local education, public health, some climate.
      *   **Problem:** Board is stuck in a "cluelessness" loop.
          *   Camp A (Skeptics): Long-term consequences are unknowable (butterfly effect), so just fund what feels decent.
          *   Camp B (Maximizers): That's laziness; estimate expected value (EV) and pick the biggest number.
      *   **Goal:** A practical decision procedure (one-page proposal, 20 mins/board member) that bridges philosophy and practice.
      *   **Board Composition:** Retired accountant (numbers/risk), High school principal (practical impact/education), Niece (PhD philosophy/ethics).
      *   **Requirements for the Procedure:**
          1.  Distinguish between *causal ignorance* (can't trace chain) and *value incommensurability* (can trace but can't compare).
          2.  Define steps, stopping points (yes/no), and "good enough" criteria.
          3.  Identify where value judgments are being masked as procedure (honesty in minutes).
          4.  Provide a tiebreak for when both EV and "feel decent" fail.
          5.  Address the "coin flip" scenario honestly without it becoming a crutch.
      *   **Task:** Run the procedure on three specific proposals:
          *   (a) Deworming expansion (solid short-term, contested long-term).
          *   (b) Local legal clinics (clear 2-year impact, unknown beyond).
          *   (c) State advocacy (low prob success, huge scale, net good uncertain).
      *   **Constraint:** Be blunt about which one I (the user) will have to vote against despite personal desire.

  2.  **Develop the Decision Procedure (The "Cluelessness Protocol"):**

      *   *Name:* Needs to sound official but practical. "The Foundation Cluelessness Protocol (FCP)" or "The 20-Minute Impact Filter." Let's go with **The Cluelessness Filter**.
      *   *Structure:* Needs to be sequential.
      *   *Step 1: The Causal Chain Check (Addressing Causal Ignorance).* Can we trace the immediate effects? If not, reject (too risky). If yes, move on. This handles the "dictator" argument by limiting scope to reasonable foreseeability.
      *   *Step 2: The Value Commensurability Check (Addressing Value Ignorance).* Can we compare the good done to other uses? If yes, calculate rough EV. If no, acknowledge the value judgment.
      *   *Step 3: The "Good Enough" Threshold.* Is the immediate good robust enough to stand on its own, regardless of long-term flow-through? (This counters the "gentrification" fear).
      *   *Step 4: The Value Call (Honesty Check).* Explicitly state where we are choosing values over math.
      *   *Step 5: The Tiebreak.* When EV is null and intuition is split. Needs to be crude but actionable. Suggestion: *Reversibility/Option Value* or *Diversification*. Let's use **Reversibility/Regret Minimization**.
      *   *The Coin Flip:* Needs a rule. Only allowed after Steps 1-4 are exhausted. Documented randomness.

      *Refining the Steps for the specific Board:*
      *   Accountant likes risk assessment.
      *   Principal likes tangible outcomes.
      *   Niece likes epistemic honesty.
      *   *Drafting the steps:*
          1.  **Direct Effect Certainty:** Is the immediate output/outcome >90% likely? (Accountant/Principal)
          2.  **Flow-Through Neutrality:** Is there evidence the long-term effects are *negative*? If unknown, assume neutral, not zero. (Philosophy/Skeptic)
          3.  **Comparative EV:** Can we compare this to our other 7 grants? (Maximizer)
          4.  **The Value Declaration:** If we can't compare, what value are we prioritizing? (Honesty)
          5.  **The Tiebreak:** If still stuck, use the "Portfolio Balance" rule.

      *Let's tighten this to fit the prompt's specific demands about causal vs. value ignorance.*

      *Revised Procedure:*
      1.  **Causal Tracing (The "Butterfly" Test):** Can we verify the *direct* mechanism? If No -> Stop (Reject). If Yes -> Proceed. (Distinguishes causal ignorance).
      2.  **Valuation Scaling (The "Apple/Orange" Test):** Can we quantify the benefit in a common unit (e.g., QALYs, students graduated, houses saved)? If Yes -> Estimate EV. If No -> Proceed to Step 3. (Distinguishes value ignorance).
      3.  **The "Stand-Alone" Justification:** Does the direct benefit justify the cost *even if* long-term effects are zero? (Stops the "dictator/gentrification" paralysis).
      4.  **The Value Declaration:** If EV is incalculable, explicitly state the value being purchased (e.g., "Justice" vs. "Health").
      5.  **The Tiebreak (Portfolio Heuristic):** If still tied, does this diversify or concentrate our risk?

      *Wait, I need to address the "Coin Flip" requirement specifically.*
      *   Add a Step 6: **Randomized Selection.** Only if Steps 1-5 yield equality. Must be recorded in minutes as "Epistemic Tiebreak."

  3.  **Applying the Procedure to the Three Proposals:**

      *   **Proposal A (Deworming):**
          *   Causal: High certainty (pills -> less worms).
          *   Valuation: High (QALYs available).
          *   Stand-alone: Yes (health is good).
          *   Long-term: Contested.
          *   *Verdict:* Strong Yes. This is the "Maximizer" win.

      *   **Proposal B (Legal Clinics):**
          *   Causal: High certainty (lawyer -> stays eviction).
          *   Valuation: Medium (housing stability is good, but hard to compare to health).
          *   Stand-alone: Yes (preventing homelessness is good immediately).
          *   Long-term: Unknown (what happens after 2 years?).
          *   *Verdict:* Yes, but on "Stand-Alone" grounds, not EV grounds.

      *   **Proposal C (Advocacy/Policy):**
          *   Causal: Low certainty (advocacy -> policy -> impact).
          *   Valuation: Low/Unknown (Policy passed -> net good? Unclear).
          *   Stand-alone: Weak (If policy fails, what did we buy? Awareness? Maybe).
          *   Long-term: High variance (Could be huge good or huge bad).
          *   *Verdict:* This is the risky one. It fails the "Causal Tracing" or "Stand-Alone" test depending on strictness. Given the prompt asks me to be blunt about which one the user votes *against* despite wanting to fund it: This is usually the "high risk/high reward" advocacy one that boards love but can't justify under scrutiny. Or, it could be the Deworming one if the user is locally focused.
          *   *Re-reading the prompt:* "mostly local education and public health with a bit of climate stuff."
          *   Proposal A is international ("country we already work in").
          *   Proposal B is local.
          *   Proposal C is state-level (local-ish).
          *   The prompt says "mostly local...". Proposal A is the outlier geographically.
          *   However, the prompt asks me to identify which one the procedure makes them vote *against* even though they *personally want to fund it*.
          *   Usually, founders want to fund the "big swing" (Advocacy) or the "heartstring" (Local Legal). The Deworming is the "effective altruist" choice.
          *   If the procedure is rigorous on *causal tracing*, Advocacy (C) often fails because the chain is long and probabilistic.
          *   If the procedure is rigorous on *stand-alone value*, Advocacy (C) fails because if the policy doesn't pass, the money is "spent" with little direct output.
          *   Let's make Proposal C the casualty. It's the hardest to justify under a "Cluelessness" framework because the net impact is explicitly uncertain ("honestly can't tell would be good on net").

  4.  **Drafting the Content:**

      *   *Tone:* Professional, direct, slightly philosophical but grounded in board governance.
      *   *Format:* The Procedure first, then the Application.
      *   *Key Constraint Check:* Did I separate causal vs. value ignorance? Yes. Did I mark value calls? Yes. Did I include a tiebreak? Yes. Did I address the coin flip? Yes.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   Make sure the "Coin Flip" isn't a cop-out. It needs to be a *last resort* documented as such.
      *   Ensure the "Value Declaration" step forces the board to admit when they are prioritizing "Justice" over "Efficiency."
      *   Ensure the "Stand-Alone" step kills the "long-term consequences" paralysis. If the immediate good is real, the butterfly effect doesn't veto it.

  6.  **Final Review against the Prompt:**
      *   One-page proposal compatible? Yes, the steps are quick checks.
      *   20 minutes? Yes, if disciplined.
      *   Board members accounted for? (Accountant = Risk/Numbers, Principal = Direct Impact, Niece = Epistemic Honesty).
      *   Three proposals analyzed? Yes.
      *   Blunt about the "No" vote? Yes.

  7.  **Final Polish:** Check the "Cluelessness" terminology. Ensure I'm distinguishing between *empirical cluelessness* (causal) and *normative cluelessness* (value).
      *   *Causal:* We don't know what happens.
      *   *Normative:* We don't know if what happens is *good* compared to something else.
      *   The procedure needs to handle the "dictator" argument (Causal) and the "gentrification" argument (Normative/Causal mix).
      *   Actually, the "gentrification" argument is usually Causal (we don't know if it gentrifies) + Normative (if it does, is that bad?).
      *   The procedure should say: If the *direct* effect is good, and the *risk* of negative long-term effects is not evidenced, proceed. Don't let speculative negative flow-throughs veto concrete positive direct effects.

      *Let's finalize the "Tiebreak".* The prompt asks for a crude tiebreak. "Portfolio Balance" is good. "Geographic Diversity" is good. "Coin Flip" is requested specifically ("if there's a step where the honest answer is 'this is a coin flip, admit it and flip'"). I need to incorporate actual randomization as a valid step, not just a metaphor.

      *Okay, let's write it.*
answer: |-
  Here is a decision procedure designed for your specific constraints, board composition, and the philosophical problem of cluelessness. It is designed to fit on one page, take 15 minutes of the 20-minute discussion window, and force epistemic honesty in the minutes.

  ### The Foundation Cluelessness Protocol (FCP)

  **Purpose:** To distinguish between *Causal Ignorance* (we don't know what will happen) and *Value Incommensurability* (we don't know how to compare what happens), and to prevent either from paralyzing the board.

  **Step 1: The Causal Tracing Test (Addressing Causal Ignorance)**
  *   **Question:** Can we trace the causal chain from *Grant* to *Direct Output* with >90% confidence?
  *   **Action:**
      *   **No:** Reject. (We cannot fund black boxes).
      *   **Yes:** Proceed to Step 2.
  *   **Board Note:** This stops the "butterfly effect" objection. We do not need to know the 50-year consequence; we only need to verify the 1-year mechanism.
  *   **Who decides:** Principal (feasibility) + Accountant (risk).

  **Step 2: The Stand-Alone Justification (Addressing Long-Run Paralysis)**
  *   **Question:** If all long-term flow-through effects were zero, would the *Direct Output* alone justify the cost?
  *   **Action:**
      *   **No:** Reject. (The grant relies on speculative long-term gains).
      *   **Yes:** Proceed to Step 3.
  *   **Board Note:** This neutralizes the "gentrification/dictator" veto. If the roof keeps rain out *today*, that is valuable even if the neighborhood changes in 10 years.
  *   **Who decides:** Whole Board (Value judgment).

  **Step 3: The Valuation Scaling Test (Addressing Value Incommensurability)**
  *   **Question:** Can we quantify the Direct Output in a unit comparable to our other 7 grants (e.g., cost-per-beneficiary, QALYs, students served)?
  *   **Action:**
      *   **Yes:** Estimate Expected Value (EV). If EV is clearly higher than our baseline, **Fund**. If lower, **Reject**.
      *   **No:** Proceed to Step 4. (Acknowledge we are buying a specific *type* of good, not necessarily the *most* good).
  *   **Who decides:** Accountant (numbers) + Niece (category errors).

  **Step 4: The Value Declaration (Epistemic Honesty)**
  *   **Question:** Since we cannot compare EV, what specific value are we prioritizing over efficiency? (e.g., "Local Justice" over "Global Health," or "Systemic Change" over "Direct Aid").
  *   **Action:** Write the value in the minutes. If the board cannot agree on the value, **Reject**.
  *   **Board Note:** This marks the point where we admit we are making a value call, not a math call.
  *   **Who decides:** Whole Board.

  **Step 5: The Tiebreak (When EV is Null and Values are Split)**
  *   **Condition:** Steps 1-4 are passed, but the board is deadlocked on whether this specific value fits the portfolio.
  *   **Action:** Apply the **Portfolio Heuristic**.
      *   Does this grant diversify our risk? (e.g., We fund 7 local grants, this is 1 state-level).
      *   **Yes:** Fund.
      *   **No/Unsure:** Proceed to Step 6.

  **Step 6: The Epistemic Coin Flip (The Last Resort)**
  *   **Condition:** All previous steps yield equality. The grant is "good enough," but indistinguishable from passing it up or funding an alternative.
  *   **Action:** Document in minutes: *"Expected Value and Value Alignment are indistinguishable from baseline. Decision determined by randomized selection."* Flip a physical coin. Heads = Fund, Tails = Pass.
  *   **Constraint:** This step may only be used **once per year**. If used, Step 6 is locked for the next three quarters.
  *   **Why:** This prevents the coin flip from becoming a habit. It reserves randomness for true states of ignorance.

  ***

  ### Application to Last Quarter's Proposals

  Here is how the FCP runs on your three proposals. I have assumed the role of the Chair facilitating the 20-minute clock.

  #### Proposal A: $30k Deworming Expansion (International)
  *   **Step 1 (Causal):** **Pass.** Mechanism (pills → reduced parasites) is medically verified.
  *   **Step 2 (Stand-Alone):** **Pass.** Reduced morbidity is good even if long-term economic development is contested.
  *   **Step 3 (Valuation):** **Pass.** High. We have cost-per-QALY data. It likely outperforms local grants on pure efficiency metrics.
  *   **Step 4 (Value):** N/A (EV decided it).
  *   **Verdict:** **FUND.**
  *   **Board Dynamic:** The Accountant loves the numbers. The Principal accepts the health metric. The Niece agrees the causal chain is robust enough to ignore the "dictator" objection.
  *   **Minutes:** "Funded based on high-confidence EV and robust direct health outcomes."

  #### Proposal B: $25k Local Legal Clinics (Eviction Defense)
  *   **Step 1 (Causal):** **Pass.** Lawyers → Court Representation → Stayed Evictions.
  *   **Step 2 (Stand-Alone):** **Pass.** Preventing homelessness *now* is valuable regardless of where the tenant lives in 5 years.
  *   **Step 3 (Valuation):** **Fail.** Hard to compare "evictions prevented" to "QALYs" or "test scores." EV is incalculable relative to Proposal A.
  *   **Step 4 (Value):** **Pass.** Value Declaration: "Local Stability & Justice." The board agrees this is a core pillar, even if less 'efficient' than deworming.
  *   **Verdict:** **FUND.**
  *   **Board Dynamic:** The Principal champions this. The Accountant accepts it as a "portfolio diversifier" against international risk. The Niece ensures the minutes record that this is a *value choice*, not an *efficiency choice*.
  *   **Minutes:** "Funded based on Stand-Alone Justification. Value priority: Local Housing Stability. Acknowledged lower comparability than health interventions."

  #### Proposal C: $40k State Advocacy (Policy Change)
  *   **Step 1 (Causal):** **Fail / Borderline.** Mechanism is Advocacy → Policy → Impact. Probability of policy passing is low ("probably won't"). Probability of net good *if* passed is "honestly can't tell."
  *   **Step 2 (Stand-Alone):** **Fail.** If the policy fails (likely), what is the direct output? "Awareness"? Is awareness worth $40k *even if* the law doesn't change? The proposal does not justify the cost on awareness alone.
  *   **Step 3 (Valuation):** **Fail.** Too many variables.
  *   **Step 4 (Value):** **Fail.** Board cannot agree on the value. Is it "Systemic Change"? Or is it "Gambling on Uncertainty"?
  *   **Verdict:** **REJECT.**
  *   **Board Dynamic:** This is the hard one.
  *   **Minutes:** "Rejected at Step 2. Direct output does not justify cost independent of low-probability policy success. Causal chain too speculative for Foundation risk tolerance."

  ***

  ### The Blunt Truth

  **You are going to have to vote against Proposal C (Advocacy).**

  I know you want to fund it. It feels like "leverage." It feels like you're trying to solve the root cause rather than the symptom. But under the Cluelessness Protocol, it fails the **Stand-Alone Justification**.

  Here is why this hurts: You personally likely believe the *potential* upside of the policy outweighs the risk. You are willing to tolerate the "cluelessness" about whether the policy is net good because the scale is so big.

  But the Procedure forces you to admit that **you are speculating.**
  *   Proposal A buys health we can see.
  *   Proposal B buys housing stability we can see.
  *   Proposal C buys a *chance* at a *maybe-good* law.

  If you fund C, you are implicitly admitting that the "Maximizer" argument (Step 3) is dead, and the "Skeptic" argument (Step 1) is being ignored. You would be funding it purely on intuition. The FCP allows for intuition (Step 4), but only if the *direct* work justifies the cost. Advocacy often cannot clear that bar without relying on the very long-term flow-through effects the Skeptics on your board rightly worry about.

  **How to handle the "Coin Flip" (Step 6)**
  You asked how to do this without it becoming an excuse.
  1.  **Physical Token:** Keep a specific coin in the board binder. It must be flipped in the room.
  2.  **The Lockout:** The rule that you can only use Step 6 **once per year** is critical. If you allow it every meeting, the Accountant will start framing every hard decision as "indistinguishable" to avoid responsibility.
  3.  **The Minute:** The minutes must read: *"Board reached epistemic equilibrium. Randomization protocol engaged."* This signals to future boards that this was not a lazy decision, but a recognized limit of your knowledge.

  **Summary for your next meeting:**
  Print the FCP. Put it in the packet. Tell the board: *"We are not solving philosophy today. We are sorting ignorance. If we can't trace the cause, we pass. If we can't justify the cost without the long-term speculation, we pass. If we can't compare the value, we admit it. If we are truly stuck, we flip."*

  It will feel cold on Proposal C. But it will keep the board from fracturing into the two camps you described.
