answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Cloyne Exchange
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Framework for Hour Notes Pilot

  **Purpose**
  Next Thursday we vote on piloting "hour notes." This is not merely a technical ledger update; it is a decision on the ontological nature of our money. We must decide whether our unit of account is a stored commodity, a bilateral credit relation, or a transferable claim on future production.

  **The Philosophical Stakes**
  The commodity view (money as gold-like store of value) fails here by design; we have no reserve. The pure credit view (money as debt) is insufficient because it ignores the real resource constraint. The correct model for this proposal is the Berkeleyan view: money is a ticket to command industry. As Berkeley argues in *The Querist*, wealth is not the metal but the power to mobilize labor. By denominating in hours, we explicitly tie the currency to the network's actual productive capacity. The note is not a promise to pay dollars; it is a claim on one hour of member labor.

  **Steelmanning the Opposition**
  The board's skepticism is not superstition; it is a valid constraint on credit creation. The strongest argument against this pilot is that without a tax backing or hard anchor, value relies entirely on the continuity of acceptance. If members perceive the demurrage (1% monthly) as a penalty rather than a velocity incentive, or if the ratio of notes issued to available labor hours drifts too high, confidence collapses. In a pure credit system, insolvency is impossible, but liquidity crises are fatal. If holders cannot spend notes because members refuse them due to depreciation fears, the network freezes. This is not a risk of "inflation" in the traditional sense, but a risk of acceptance failure.

  **Operationalizing Berkeley**
  Berkeley's insight—that money is only useful while it circulates—justifies the demurrage rule. However, philosophy cannot override incentives. A 1% monthly decay rate is aggressive (~12.7% annually). It forces velocity but risks discouraging members from holding notes even temporarily for transaction smoothing. To make the Berkeleyan angle work rather than serve as decoration, we must ensure the decay rate aligns with the actual velocity required to sustain member liquidity without causing hoarding avoidance.

  **Recommendation: Approve with Conditions**
  We should approve the pilot, but treat it as an empirical test of the Berkeleyan hypothesis, not an ideological declaration. We mitigate the acceptance risk by capping exposure and scheduling a hard review.

  **Conditions:**
  1.  **Issuance Cap:** Total hour notes in circulation cannot exceed 10% of the verified available labor hours pledged by members in the guarantee fund.
  2.  **Demurrage Review:** The 1% monthly rate is provisional. It must be reviewed after 90 days based on velocity data.
  3.  **Sunset Clause:** The pilot expires in 6 months unless renewed by a supermajority vote.

  **Bottom Line**
  Vote **YES** on the motion to pilot, contingent on the amendment adopting the three conditions above. This allows us to test money as a claim on production while bounding the risk of acceptance collapse.

