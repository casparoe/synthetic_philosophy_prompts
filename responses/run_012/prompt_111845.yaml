prompt: |-
  My study group has been going around in circles on the reference class problem and I'm starting to think its just unsolvable. It started over a base rate in some medical paper — do you read the risk off the all-patients table or the table for patients with this guy's exact profile — and now one friend says the whole point is that you can always gerrymander the reference class until it spits out whatever number you want, so the fix is to condition on everything you know about the case: then you've got the most specific reference class possible and there's nothing left to cherry-pick. I tried that and my reference class collapsed to a single case, so my probability came out 0 or 1, which obviously can't be right, so I figure I must've applied her rule wrong. Another guy says this only bites frequentists — if you're Bayesian your reference class is just your prior and the problem dissolves. Who's actually confused here, and is the reference class problem something you solve, or something you just live with?
