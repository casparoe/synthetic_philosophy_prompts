answer: |-
  Here is the specification sheet. It is framed as a set of constraints on ontology. Any theory of composition you evaluate must declare how it satisfies, modifies, or rejects each line item.

  ### Part I: The Desiderata (The Spec)

  **1. The Dominance Constraint (Tibbles' Tail)**
  *   **The Case:** Tibbles the cat sits on a mat. He loses his tail. There is a cat (Tibbles) and a collection of cat-parts excluding the tail (Tibbles-minus).
  *   **The Requirement:** The theory must explain why Tibbles is a *cat* and Tibbles-minus is not, despite their near-identical material constitution and spatial overlap. It must prevent "ontological inflation" where every proper part of an object is also an object of the same kind (the "Too Many Thinkers" problem).
  *   **The Fact:** We count one cat, not two.

  **2. The Co-location Constraint (Statue and Lump)**
  *   **The Case:** A lump of clay is shaped into a statue. They occupy the exact same spatial region at the same time. The lump could survive being squashed; the statue could not.
  *   **The Requirement:** The theory must provide a verdict on whether distinct objects can share exact spatial boundaries. If they are identical, it must explain the difference in modal properties (persistence conditions). If they are distinct, it must explain how two material objects occupy the same space without violating exclusion principles.
  *   **The Fact:** Modal properties of the statue and the lump diverge.

  **3. The Precision Constraint (The Problem of the Many)**
  *   **The Case:** For any cat, there are zillions of overlapping collections of atoms that differ by only one or two atoms at the periphery. All seem equally qualified to be "the cat."
  *   **The Requirement:** The theory must explain how *one* object is selected from the cloud of candidates, or explain why there are zillions of cats, or explain why there are none. It cannot simply assert "it's vague" without addressing the logical consequences of vague existence.
  *   **The Fact:** We refer to singular objects successfully in ordinary language.

  **4. The Vagueness Constraint**
  *   **The Case:** It seems indeterminate exactly when a collection of parts comes to compose a whole (e.g., as a house is being built).
  *   **The Requirement:** The theory must take a stance on whether the composition relation itself can be vague. If yes, it must reconcile this with classical logic (where existence is usually determinate). If no, it must explain away the appearance of vagueness (epistemicism or semantic indecision).
  *   **The Fact:** Borderline cases of composition appear in natural language.

  **5. The Atomicity Constraint (Gunk)**
  *   **The Case:** Gunk is matter that is infinitely divisible; every part has proper parts. There are no simples.
  *   **The Requirement:** The theory must be compatible with the possibility of gunk. It cannot presuppose the existence of atomic simples unless it argues gunk is metaphysically impossible.
  *   **The Fact:** Physics currently leaves the question of fundamental atoms open.

  **6. The Diachronic Constraint (Part Replacement)**
  *   **The Case:** Organisms and artifacts gain and lose parts over time (Ship of Theseus scenarios).
  *   **The Requirement:** The theory must specify the conditions under which an object at $t_1$ is the *same object* as an object at $t_2$ despite having different parts. It must distinguish between *change of parts* and *cessation of existence*.
  *   **The Fact:** Objects persist through material turnover.

  **7. The Continuity Constraint (Scattered Objects)**
  *   **The Case:** A pair of gloves, a constellation, or a distributed computer network. The parts are not spatially continuous.
  *   **The Requirement:** The theory must state whether spatial continuity (touching/connecting) is a necessary condition for composition. If scattered objects are allowed, what binds them? (Convention? Causal connection? Function?)
  *   **The Fact:** We sometimes treat scattered items as single units (e.g., "the fleet").

  **8. The Fission/Fusion Constraint (The Slime-Mold Case)**
  *   **The Case:** A slime-mold splits into two wandering halves, which later fuse back into one.
  *   **The Requirement:** The theory must provide identity conditions for branching and merging paths in spacetime.
      *   *Verdict A:* It is one object that paused being unified.
      *   *Verdict B:* It is two objects that temporarily existed and then died/merged.
      *   *Crucial Sub-clause:* The verdict cannot rely solely on material continuity if the material is swapped during the split. It must distinguish between *genetic/functional continuity* and *mereological continuity*.
  *   **The Fact:** Biological identity sometimes survives fission/fusion; sometimes it doesn't.

  **9. The Functional Integration Constraint (The Symbiosis Case)**
  *   **The Case:** Mitochondria and gut bacteria are physically inside the body boundary and causally essential for life, but have distinct genetic lineages.
  *   **The Requirement:** The theory must distinguish between *constitutive parts* (organs, cells) and *contained contents* (food, parasites, symbionts). Spatial inclusion is insufficient (I contain lunch, but lunch isn't part of me). Causal necessity is insufficient (I need oxygen, but air isn't part of me).
  *   **The Fact:** We intuitively count mitochondria as "us" and gut bacteria as "mostly us but distinct," and lunch as "not us." The theory needs a gradient or a sharp line that tracks this biological intuition without being ad hoc.

  ---

  ### Part II: Analysis of the Spec

  #### 1. Negotiable vs. Non-Negotiable Requirements

  **Non-Negotiable (Logical/Metaphysical Hard Constraints):**
  *   **Consistency:** The theory cannot contradict itself (e.g., claiming composition is both vague and precise in the same respect).
  *   **The Vagueness Constraint (Logic):** You cannot have vague existence *and* classical logic without significant modification. You must choose one. This is non-negotiable because it defines the logical framework of the theory.
  *   **The Atomicity Constraint:** You must take a stance on gunk. Agnosticism is not a theory of composition.

  **Negotiable (Intuitive/Data Constraints):**
  *   **The Dominance Constraint:** Nihilists negotiate this away by saying there are no cats, only atoms arranged cat-wise. This is a valid move, provided the theory explains why we *talk* as if there are cats.
  *   **The Co-location Constraint:** You can negotiate this by accepting co-location (Constitution View) or denying it (Identity View). Both are viable metaphysical positions, though they carry different costs.
  *   **The Functional Integration Constraint:** A purely formal mereology (like Classical Extensional Mereology) will fail this, but it might claim that "biological parthood" is a special relation distinct from "metaphysical parthood." You can negotiate this by bifurcating the concept of "part."

  #### 2. Incompatibilities (The Trilemmas)

  You cannot satisfy all desiderata simultaneously. Here are the primary clashes:

  **A. The "Many" vs. Dominance vs. Vagueness**
  *   **Conflict:** To solve the **Problem of the Many** (Constraint 3) without accepting zillions of cats, you usually need sharp boundaries. But sharp boundaries violate the appearance of **Vagueness** (Constraint 4). If you accept Vagueness to save intuition, you struggle with **Dominance** (Constraint 1) because it becomes indeterminate whether the cat-complement is a cat.
  *   **Result:** You must sacrifice either logical orthodoxy (no vague existence), ontological parsimony (no zillions of objects), or common sense (there is exactly one cat).

  **B. Co-location vs. Modal Realism**
  *   **Conflict:** To satisfy the **Statue/Lump** case (Constraint 2) by saying they are *distinct*, you must accept **Co-location**. To say they are *identical*, you must deny that objects have essential modal properties (or accept that the lump *could* survive squashing, which is counter-intuitive).
  *   **Result:** You must sacrifice either the principle that two material things can't be in one place, or the principle that objects have modal essences.

  **C. Functional Integration vs. Formal Neutrality**
  *   **Conflict:** The **Symbiosis Case** (Constraint 9) demands that composition track *function* or *biology*. Standard mereology (CEM) is topic-neutral; it says if the parts exist, the whole exists, regardless of function.
  *   **Result:** A theory that satisfies the Symbiosis constraint cannot be standard Classical Extensional Mereology. It must be a restricted, "natural" mereology. But restricted mereology struggles with **Scattered Objects** (Constraint 7) and **Vagueness** (where does function begin/end?).

  **D. Fission vs. Transitivity of Identity**
  *   **Conflict:** In the **Slime-Mold Case** (Constraint 8), if the mold splits into A and B, and A is the original, and B is the original, then A=B. But A and B are spatially distinct.
  *   **Result:** You must sacrifice either the transitivity of identity (A=Original, B=Original, but A≠B) or accept that the original object ceases to exist and two new ones begin (denying survival through fission).

  #### 3. The "Killer" Constraint

  The single requirement that knocks out the most candidate theories is **Constraint 3: The Precision Constraint (The Problem of the Many)**, specifically when combined with **Constraint 1: The Dominance Constraint**.

  **Why?**
  1.  **Nihilism** fails because it denies the data (there are no cats to be dominant).
  2.  **Universalism** fails because it allows the cat-complement to exist as an object, violating Dominance (unless it argues the complement is a cat too, which violates common sense).
  3.  **Brutal Composition** (composition is a brute fact) fails because it offers no explanation for *why* this cloud of atoms is the cat and that one isn't, leaving the Precision problem unsolved.
  4.  **Vague Composition** theories are heavily pressured by Lewis/Sider arguments that existence cannot be vague without breaking logic.
  5.  **Organicism** (composition only occurs when there is a life) struggles with the boundary of the life (the "Many" still applies to the life-process itself).

  To pass the Precision/Dominance filter, a theory must have a robust mechanism for **selection** (why *this* whole?) that is neither arbitrary nor magical. Most theories collapse into one of three costly positions:
  *   **Eliminativism:** "There is no cat." (Saves logic, loses world).
  *   **Multiplicativism:** "There are a million cats." (Saves logic, loses parsimony).
  *   **Epistemicism:** "There is one cat, but we can't know which atoms compose it." (Saves logic and parsimony, loses plausibility).

  #### 4. Special Note on Your Custom Cases

  Your custom cases (Slime-mold and Symbiosis) act as a **secondary filter** for theories that survive the classics.

  *   **Standard Mereology (CEM)** passes the classics (by being universalist) but **fails** your Symbiosis case. In CEM, my gut bacteria compose an object *with me*, but they are not *parts of me* in any privileged sense over the air in my lungs. CEM has no resources to distinguish "part" from "content."
  *   **Biological/Functional Theories** pass the Symbiosis case but often **fail** the Scattered Objects or Vagueness constraints. (e.g., If function defines parthood, when does a tool I use become a part of me? The boundary is vague).

  **Recommendation for Evaluation:**
  When you read the papers, check if the author treats "parthood" as a **univocal** relation (one meaning for cats, clay, and bacteria) or an **equivocal** one (metaphysical parthood vs. biological parthood). If they claim it is univocal, demand they solve the Symbiosis case. If they claim it is equivocal, demand they explain the relationship between the two types of parthood. That is where the current research frontier lies.
