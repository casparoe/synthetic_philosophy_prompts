prompt: |-
  Take the dream-lab research program that came out of the discovery of REM sleep in the 1950s — Aserinsky and Kleitman, Dement, the awakenings, the dream reports, and the content-relative eye-movement findings where horizontal REMs line up with reports of watching two people throw tomatoes at each other and vertical REMs with reports of shooting baskets — and analyze it through the Malcolm vs. Dennett fight over whether dreams are experiences. Not the neuroscience, which I know: the conceptual question. Malcolm's line is that the criterion for having dreamt is being able to tell a dream on waking, and that the idea of a dream as a private experience occurring during sleep is a confusion; he thought the dream researchers were conceptually confused and that their work was irrelevant to dreaming. Dennett's cassette theory says the dream narrative might be composed at the moment of waking rather than experienced in real time during sleep, which makes the question of when during sleep the dream happened look malformed. So: what does each view say the dream lab is actually doing when it wakes a subject and records a report? What do the content-relative REM correlations look like from each side — do they count as evidence that dreams happen during sleep, or can the cassette theory absorb them? Where does Malcolm predict the research will go wrong, and did it? Then run it the other way: what does a working, productive dream-research program, one that keeps generating results, do to Malcolm's claim that its all conceptually confused? Does it refute him, or can he say the researchers are studying something else — waking reports, say — and mislabeling it as dreaming? I want the mapping disciplined: say exactly which claim each side needs, which findings support it, and where each view is silent rather than forcing it to speak. And tell me which view, if either, the episode actually favors.
