  9.  **Final Polish:** Ensure the flow is logical. (Problem -> Diagnosis -> Fix -> Cost of Fix -> Implications). Make sure the Mercury example is used sparingly but effectively. (Decided to use a generic "perihelion" reference to keep it abstract enough).

  *(Self-Correction on the Prediction/Accommodation point)*: I need to be careful here. Some Bayesians argue the boost *is* different because the likelihood of the theory given the data is different if the theory was constructed to fit it. But the standard Bayesian response is usually about the Prior. I should stick to the Prior argument as it's cleaner for a general explanation, but acknowledge the tension. Actually, the "use-novelty" argument is distinct. I should focus on the idea that *accommodation* doesn't get *less* confirmation from the data itself, but the theory *itself* is less credible beforehand. That's the key distinction.

