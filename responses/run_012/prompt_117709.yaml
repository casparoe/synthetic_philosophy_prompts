answer: |-
  You have described a phenomenon with striking clarity. It is a frustration shared by many practitioners in public administration, healthcare, education, and corporate management. While the components of what you describe are well-documented individually, there is no single, established proper noun that captures the *entire five-stage cycle* you have outlined—specifically the crucial phase where abandoning the metric leads to genuine improvement, followed by the inevitable, anxious return to measurement.

  The concepts you mentioned are close, but they are static or one-directional. **Goodhart's Law** explains why the metric fails (phase two), but it does not predict the recovery (phase four) nor the compulsion to return (phase five). The **Cobra Effect** describes a perverse incentive, but not the organisational learning and subsequent relapse. The **Hawthorne Effect** concerns observation itself, not the specific medium of observation (numbers versus judgement). The **McNamara Fallacy** describes the decision to ignore the unmeasurable, but not the cyclical return to it after failure.

  Since no established name exists for this specific loop, I shall coin one for you.

  ### The Name: The Metric Recidivism Cycle

  I propose calling this **The Metric Recidivism Cycle**.

  The term 'recidivism' is typically reserved for criminal behaviour, denoting a relapse into previous offending after punishment or rehabilitation. Here, it aptly describes the organisation's inability to learn from the failure of metrics. Despite the 'rehabilitation' of the work during the judgement phase, the organisation relapses into the 'offence' of quantification due to an ingrained anxiety about opacity.

  ### Precise Definition

  The **Metric Recidivism Cycle** is a five-stage organisational loop defined as follows:

  1.  **Adoption:** A quantitative proxy is adopted to represent a complex qualitative value (e.g., 'calls handled' representing 'customer care').
  2.  **Corruption:** Agents optimise for the proxy rather than the value (Goodhart's Law), decoupling the number from reality.
  3.  **Abandonment:** The metric is recognised as useless and discarded in favour of qualitative judgement, spot checks, or peer review.
  4.  **Recovery:** Performance genuinely improves. Agents cease gaming the system and return to high-value, low-visibility tasks. Trust and efficacy rise.
  5.  **Relapse:** Leadership anxiety regarding 'visibility' and 'accountability' mounts. The demand for legible data becomes irresistible. The metric (or a slightly modified version) is reinstated, returning to Stage One.

  ### Distinction from Existing Concepts

  To understand where the boundaries fall, we must distinguish the Cycle from its nearest neighbours:

  *   **Vs. Goodhart's Law:** Goodhart's Law is a *mechanism* within the Cycle (Stage Two). It explains *why* the number stops working. It does not explain why the number is brought back after being successfully removed. Goodhart's is a law of physics; the Metric Recidivism Cycle is a law of organisational psychology.
  *   **Vs. The Cobra Effect:** The Cobra Effect is a *design flaw* in incentives. It assumes the incentive remains in place. The Cycle specifically requires the *removal* of the incentive and the subsequent *restoration* of quality before the incentive returns.
  *   **Vs. The Hawthorne Effect:** The Hawthorne Effect suggests that *any* observation changes behaviour. In the Metric Recidivism Cycle, the *type* of observation matters profoundly. Being watched by a panel (Stage Three) improves work; being watched by a spreadsheet (Stage One/Two) degrades it.
  *   **Vs. Management Fads:** General management fads (e.g., Six Sigma, Agile) come and go. The Metric Recidivism Cycle is deeper; it is not about a specific methodology, but about the fundamental tension between *legibility* (numbers) and *function* (work).

  ### Boundaries and Borderline Cases

  For a term to be useful, it must have hard edges. Here is how to determine whether a situation falls within the Metric Recidivism Cycle.

  **Cases that *should* be covered:**
  *   **The NHS Waiting List Target:** Targets are set, hospitals game them (e.g., cancelling clinics to clear backlogs), targets are softened or removed, waiting lists stabilise due to clinical prioritisation, political pressure mounts for 'clear numbers', targets are reinstated.
  *   **Academic Research Impact:** Universities are rated on citation counts. Academics write 'citation-bait'. The metric is criticised; peer review is emphasised. Research quality improves. Government demands 'quantifiable impact' for funding. The cycle restarts.

  **Cases that *should not* be covered (Borderline Exclusions):**
  *   **Metric Refinement:** If an organisation drops a metric and replaces it with a *better* metric (e.g., moving from 'calls per hour' to 'customer satisfaction score'), this is not Recidivism. This is iteration. The Cycle requires a return to *proxy-based quantification* that ignores the qualitative reality.
  *   **Permanent Abandonment:** If an organisation drops a metric and never returns to it, accepting the opacity of human judgement permanently, the cycle is broken. This is rare, but it happens.
  *   **The 'Judgement' Phase is Corrupt:** If, during the abandonment phase (Stage Three), performance *does not improve* because the 'judgement' is simply nepotism or laziness, the Cycle is not complete. The defining feature of the Cycle is the *genuine recovery* of value during the unmeasured period.

  **The Critical Borderline Case:**
  Consider a scenario where a metric is reinstated, but it is accompanied by a radical change in culture that prevents gaming (e.g., extreme transparency where the raw data is visible to all workers, not just management). If the metric remains robust and does not decouple from reality, is it the Cycle?

  *Verdict:* No. This should not be covered. The Metric Recidivism Cycle relies on the *inevitability* of the corruption. If the metric is successfully integrated without triggering gaming behaviour, the organisation has escaped the Cycle. The name should be reserved for situations where the return to measurement inevitably sows the seeds of its own destruction.

  ### Why the Cycle Persists

  You asked why the pressure to bring the number back never goes away. In the sociology of organisations, this is often attributed to the demand for **Legibility**.

  Senior management and external stakeholders (politicians, shareholders) cannot see the 'slow, awkward, uncountable parts of the job'. They can only see the dashboard. When the dashboard is blank (during the Judgement phase), they feel a loss of control. They do not mind that the work is better; they mind that they cannot *see* that it is better. The Metric Recidivism Cycle is driven not by a desire for efficiency, but by a desire for reassurance.

  ### Summary

  You have identified a structural pathology in modern management. While Goodhart explains the breakage, **The Metric Recidivism Cycle** explains the repair and the relapse. It is a useful term because it shifts the blame from the workers (who are 'gaming') to the system (which is 'relapsing'). It suggests that the solution is not better metrics, but a tolerance for the anxiety of unmeasured quality.
