answer: |-
  # Final Examination: Decision Theory and Philosophy of Probability
  **Section B: Essay Question**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 Words

  **Question:**

  Three urns each contain 100 balls, colored either red or black.

  *   **Urn A:** You are told it contains exactly 50 red and 50 black.
  *   **Urn B:** Its composition is fixed, but you are told nothing about the ratio of red to black.
  *   **Urn C:** Before you arrived, a fair coin was tossed. On heads, 40 red and 60 black were placed in the urn; on tails, 60 red and 40 black. You are not told the outcome of the toss.

  In three separate scenarios, a single ball is drawn at random from one of the urns. You may bet on red or on black; a correct bet pays $100, a wrong bet pays $0.

  A subject reports the following strict preferences and indifferences:
  (i) Bet on Red in A $\succ$ Bet on Red in B.
  (ii) Bet on Black in A $\succ$ Bet on Black in B.
  (iii) Bet on Red in A $\sim$ Bet on Red in C.
  (iv) Bet on Red in C $\succ$ Bet on Red in B.

  **(a)** What do (i) and (ii) jointly imply about the existence of a unique subjective probability measure for Urn B? Do these preferences violate Savage's Sure-Thing Principle? If not, describe the standard three-color Ellsberg configuration that does, and explain the structural difference.
  **(b)** What does (iii) indicate regarding the Reduction of Compound Lotteries axiom? What does the contrast between (iii) and (iv) isolate regarding the source of her aversion to Urn B?
  **(c)** Could this preference pattern be represented by (1) Subjective Expected Utility (SEU), (2) Maxmin Expected Utility (MEU), or (3) a Smooth Ambiguity model with a symmetric second-order prior and concave second-order utility? Justify each classification.
  **(d)** Propose one experimental modification that would distinguish the *Comparative Ignorance* hypothesis from models based on stable second-order beliefs. State the divergent predictions.

  ***

  # Model Answer

  **(a) Subjective Probability and the Sure-Thing Principle**
  Preferences (i) and (ii) imply that the subject cannot assign a unique additive subjective probability to drawing Red from Urn B. Let $p$ be the subjective probability of Red in B. If the subject maximizes expected utility, (i) implies $0.5 > p$, while (ii) implies $0.5 > (1-p)$, or $p > 0.5$. This contradiction ($p < 0.5$ and $p > 0.5$) demonstrates that no single probability measure represents her beliefs.

  Strictly speaking, the two-urn setup does not violate Savage's Sure-Thing Principle (P2) if the state space is defined as the *composition* of the urns, because the acts are not defined over a common partition of states where consequences agree. However, if the state space is reduced to the color drawn {Red, Black}, it violates the additivity required by SEU, which P2 secures. The standard three-color Ellsberg problem (one urn, 30 Red, 60 Black/Yellow unknown) creates a clearer violation of P2. There, preferences reverse on acts that yield identical consequences on the unknown event (Black/Yellow), directly contradicting the requirement that preferences between acts should depend only on states where they differ. The two-urn case is better characterized as a violation of *Probabilistic Sophistication* (Machina & Schmeidler), as the agent distinguishes between sources of uncertainty rather than just events.

  **(b) Reduction and the Source of Aversion**
  Preference (iii) indicates the subject satisfies the Reduction of Compound Lotteries (ROCL) for Urn C. Urn C is a compound lottery: a 50% chance of a 40% Red urn and a 50% chance of a 60% Red urn. Mathematically, this reduces to a simple 50% Red lottery, identical to Urn A. Her indifference ($A \sim C$) confirms she computes the marginal probability correctly and does not dislike compound risk *per se*.

  The contrast between (iii) and (iv) isolates the source of aversion. Since she accepts C (known second-order distribution) but rejects B (unknown second-order distribution), her aversion is not to variance or compound structure itself, but specifically to *ambiguity*—the absence of a known second-order prior. She distinguishes between "risk with known parameters" (C) and "uncertainty with unknown parameters" (B).

  **(c) Model Representation**
  1.  **SEU:** No. As shown in (a), SEU requires a unique prior. The subject's behavior implies multiple priors or a non-additive measure, violating the core representation theorem of SEU.
  2.  **Maxmin Expected Utility (MEU):** Yes. In MEU, the agent evaluates acts by the minimum expected utility over a set of priors. For Urn A and C, the set of priors is the singleton $\{0.5\}$. For Urn B, the set of priors could be $[0, 1]$. The minimum expected utility for B (at $p=0$ or $p=1$) is 0, while for A it is $0.5 \times u(100)$. Thus, $A \succ B$ is consistent with MEU.
  3.  **Smooth Ambiguity (Klibanoff et al.):** Yes. This model uses a second-order probability distribution $\mu$ over first-order probabilities $p$, transformed by a function $\phi$. For Urn C, $\mu$ is a known distribution (0.5 on 0.4, 0.5 on 0.6). For Urn B, $\mu$ is diffuse or uniform. If $\phi$ is concave (ambiguity averse), the subject penalizes the uncertainty in the mean probability. Since C has a known mean (0.5) and B has an ambiguous mean, a concave $\phi$ generates $C \succ B$ while allowing $A \sim C$ (since A also has a degenerate prior at 0.5).

  **(d) Distinguishing Comparative Ignorance**
  To distinguish Comparative Ignorance (Fox & Tversky) from stable second-order belief models (like Smooth Ambiguity), one must alter the *evaluation context*.
  *   **Modification:** Elicit the subject's willingness to pay (WTP) for a bet on Urn B in two conditions: (1) **Joint Evaluation**, where Urn A is present as a reference; (2) **Separate Evaluation**, where Urn B is presented in isolation without Urn A.
  *   **Predictions:** Models based on stable second-order beliefs (MEU, Smooth Ambiguity) predict the WTP for B will remain low in both conditions; the ambiguity is intrinsic to Urn B. The Comparative Ignorance hypothesis predicts that ambiguity aversion is driven by the salience of the missing information relative to a known standard. Therefore, in Separate Evaluation, the aversion should diminish or disappear, and WTP for B should rise to match A, because the "ignorance" is no longer highlighted by comparison.

  ***

  # Marking Scheme (Total: 20 Marks)

  ### Part (a): Probability and STP (5 Marks)
  *   **A (5):** Identifies the contradiction in assigning a unique $p$ ($p<0.5$ and $p>0.5$). Nuanced discussion of STP: acknowledges that 2-urn is technically a violation of Probabilistic Sophistication/Additivity, whereas 3-color is the canonical P2 violation (acts agreeing on an event).
  *   **B (3-4):** Correctly identifies the probability contradiction. States "Yes, violates STP" without distinguishing the state-space nuance or the 3-color comparison.
  *   **C/Fail (0-2):** Claims probabilities exist but preferences are irrational, or fails to identify the contradiction. Confuses STP with Independence.

  ### Part (b): Reduction and Aversion Source (5 Marks)
  *   **A (5):** Correctly identifies (iii) as satisfying ROCL. Explicitly states the contrast isolates aversion to *unknown second-order probabilities* (ambiguity) vs. *known compound risk*.
  *   **B (3-4):** Identifies ROCL is satisfied. Vaguely attributes aversion to "uncertainty" without distinguishing compound risk from parameter uncertainty.
  *   **C/Fail (0-2):** Claims (iii) violates ROCL. Claims she dislikes compound lotteries generally.

  ### Part (c): Model Classification (6 Marks)
  *   **A (5-6):** Correctly rejects SEU. Correctly accepts MEU (explaining the singleton vs. set of priors). Correctly accepts Smooth Ambiguity (explaining concave $\phi$ and known vs. unknown $\mu$).
  *   **B (3-4):** Rejects SEU. Accepts MEU/Smooth but with vague reasoning (e.g., "it handles ambiguity" without referencing priors or $\phi$).
  *   **C/Fail (0-2):** Claims SEU can explain it. Claims MEU cannot handle Urn C.

  ### Part (d): Comparative Ignorance Test (4 Marks)
  *   **A (4):** Proposes Joint vs. Separate evaluation. Correctly predicts Stable Belief models = no change; Comparative Ignorance = aversion drops in separation.
  *   **B (2-3):** Proposes a valid test but prediction is vague or reversed.
  *   **C/Fail (0-1):** Test does not separate the hypotheses (e.g., changing payoffs).

  ### General Penalties
  *   **Word Count:** Significant deviation (>900 or <600 words) deducts 1 mark.
  *   **Clarity:** Persistent confusion between "risk" and "ambiguity" terminology deducts up to 2 marks.
