  ### Marking Scheme (40 Marks Total)

  **Part 1: Scenario Calculation (10 Marks)**
  *   **A (9-10):** Correctly calculates EU for No Info and Info. Explicitly demonstrates VoI < 0. Notes the necessity of an "ignorance premium" or preference shift to generate the negative value.
  *   **B (6-8):** Correct calculation but fails to explicitly adjust utilities to ensure VoI is negative (e.g., calculates VoI = 0).
  *   **C (0-5):** Fundamental errors in expected utility calculation.

  **Part 2: Premise and Theorem Validity (15 Marks)**
  *   **A (13-15):** 
      *   **Identifies Premise:** Precisely names **Stable Preferences** (or State-Independent Utility) as the violated assumption. (Mentioning "Conditionalization" is acceptable only if linked to how preferences update, but Stable Preferences is the primary violation here).
      *   **Theorem Validity:** Clearly distinguishes between the *truth of the conditional theorem* and the *satisfaction of the antecedent*. Explains that the proof holds for the class of agents defined by the axioms.
  *   **B (9-12):** 
      *   Identifies the violated premise generally (e.g., "preferences changed") but lacks technical precision.
      *   **Error capping at B:** Suggests Good's theorem is "technically true but practically useless" without explaining *why* the logic holds for the restricted class. Or, claims the theorem is "false" because a counterexample exists.
  *   **C (0-8):** Claims Good's theorem is disproven by the scenario. Fails to distinguish between model assumptions and logical validity.

  **Part 3: Slogan and Philosophical Distinction (15 Marks)**
  *   **A (13-15):** 
      *   **Slogan:** Argues the slogan is false as a universal claim but true within the idealized model.
      *   **Distinction:** Explicitly separates **Settled** (the math of Good's proof) from **Contested** (whether agents *ought* to have stable preferences / whether Elias is irrational). 
      *   **Nuance:** Acknowledges that some theorists (Savageans) would call Elias irrational to save the slogan, while others accept the preference structure.
  *   **B (9-12):** 
      *   **Error capping at B:** Treats the contested normative question as settled (e.g., "This proves information is bad" OR "This proves Elias is irrational" without acknowledging the debate). 
      *   Fails to distinguish between the mathematical result and the philosophical slogan.
  *   **C (0-8):** Vague discussion of "information is power." No reference to decision-theoretic concepts.

  **General Penalties:**
  *   **-5 Marks:** If the student claims the negative value comes from the *cost* of the test (prompt explicitly forbade this).
  *   **-5 Marks:** If the model answer claims Good's Theorem is logically invalid.
