prompt: |-
  Ok so we just did Fitch's knowability paradox in my epistemology seminar and I can reproduce the proof but I don't really get what its supposed to be telling us. You assume every truth is knowable, then take the proposition 'p but nobody knows p', and the moment you grant that that could be known you get a knower who knows both p and that they don't know p, contradiction, so there are no unknown truths and anti-realism collapses into omniscience. My prof says the knowability principle is basically innocent and the real culprit is the assumption that knowledge distributes over conjunction (know a conjunction, know each of its conjuncts). But a guy in my section swears the culprit is instead the way 'knowable' gets read as 'some possible agent at some possible time could know it', and that once you stop letting the same knower be reused across the nested K's the whole thing stalls. Can you walk me through which assumption is actually load-bearing here, and whether those are two different diagnoses or the same one in different clothes? Also, is restricting the knowability principle to propositions where 'it's known that p' isn't already contradictory (Cartesian ones, I think?) a real escape or just a way of quietly excluding the one case that causes the trouble? Gut-level please, I don't need the modal notation.
