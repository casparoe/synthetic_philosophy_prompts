prompt: |-
  I've been trying to work out how much I can trust just sitting quietly and noticing what's going on in my own head, and someone told me to look at William James's Principles of Psychology, the chapter about methods and snares. Here's the bit I'm stuck on:

  "To the psychologist, then, the minds he studies are objects, in a world of other objects. Even when he introspectively analyzes his own mind, and tells what he finds there, he talks about it in an objective way. He says, for instance, that under certain circumstances the color gray appears to him green, and calls the appearance an illusion. This implies that he compares two objects, a real color seen under conditions, and a mental perception which he believes to represent it, and that he declares the relation between them to be of a certain kind."

  I sort of get it and then I lose it. If introspection is meant to be the one place where you're not standing outside the thing you're looking at, James seems to be saying that even there the psychologist is already outside it, comparing his perception against the world like a referee. So is introspection even a method in its own right, or is he quietly letting in the idea of a "real color" that the psychologist could only know some other way? And how is that not going in a circle, using introspection to check introspection?

  Can you walk me through it in plain language: what is James actually claiming here, what does he think introspection does and doesnt give you, and what is the psychologist doing when he calls his own gray-seen-as-green an illusion? Also, if you can, tell me what work the "object" talk is doing — why does he keep insisting the mind is an object for the psychologist? I dont know any of the jargon so please go slow. And I'd like to know wether this is a worry he thinks he's answered, or one he just plants and then walks away from.
