answer: |-
  Bernard Williams stands on the bank of a canal, watching a committed Rule Utilitarian drip dry after pulling his wife from the water.

  "Impressive," Williams says. "No hesitation. No calculation. You just jumped."

  "Exactly," says the Utilitarian, wringing out his sleeve. "I've learned from your objections. I don't run the utility calculus in the moment. I've internalized the rule: *'Save your spouse.'* It's a heuristic that generally maximizes welfare, so I act on instinct."

  "So," Williams asks, "the thought about the impartial standpoint was absent?"

  "Completely. Zero thoughts. Just love."

  "Good. And why do you follow that heuristic?"

  "Because it maximizes welfare."

  Williams sighs. "You see? You didn't have the thought *in* the water. But you're having it *on* the bank to validate the water."

  "It's retrospective," the Utilitarian insists. "It doesn't contaminate the act. The calculation is pre-processed."

  "If the act relies on the retrospective validation to be moral," Williams says, "then the validation isn't retrospective. It's the foundation. You're trying to pour the concrete after the house is built."

  "Fine," says the Utilitarian. "I'll stop validating. I'll make it a rule not to seek justifications for my instincts."

  "And why adopt *that* rule?"

  "Because seeking justifications reduces overall utility by alienating agents from their projects."

  Williams turns to leave. "You haven't removed the thought. You've just given it a delay. And a late thought is still a mediator."

  "But it's an efficient delay!" the Utilitarian calls after him.

  "That efficiency," Williams mutters, "is the thought."
