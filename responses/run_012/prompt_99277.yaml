          *   *Analysis:* Theo is historically right (Hume was biased). But philosophically, Rosa is right: criticizing bias presupposes a better standard. However, if the standard *is* the bias, the criticism holds. Hume acknowledges some variation (manners) but insists on universal principles (human nature).
          *   *Verdict:* Theo is right about Hume's historical limitations. Rosa is right that this doesn't destroy the *concept* of a standard, only its specific application.

      *   *Move 6: What is the Standard? (The User's Core Confusion).*
          *   Is it a fact about the artwork? No (Hume says beauty isn't in the object).
          *   Is it a rule for comparing judges? Yes.
          *   *Analysis:* The standard is a *regulative ideal*. It's a rule for identifying whose sentiments count as authoritative. It's intersubjective, not objective in the scientific sense.

