          *   *Analysis:* Theo is right about the metaphysics (beauty is a sentiment). Rosa is right that this doesn't preclude evaluation of the *sentiment itself*. Hume is a projectivist/subjectivist about the *location* of beauty, but not a relativist about the *value* of judgments.
          *   *Verdict:* Theo is right on metaphysics; Rosa is right that it doesn't kill the standard.

      *   *Move 2: Is there a contradiction (Inconsistency)?*
          *   Theo: Yes, seeking a standard contradicts subjectivism.
          *   Rosa: No, they fit. Standard is about the *judge*, not the *object*.
          *   *Analysis:* Hume explicitly addresses this. "Beauty is no quality in things themselves." But "it is not contrary to our taste to pronounce a sentiment as just." The standard is normative regarding the *observer*, not descriptive regarding the *object*.
          *   *Verdict:* Rosa is right. No contradiction.

      *   *Move 3: The Don Quixote/Wine Story & The Nature of the Standard.*
          *   Rosa: Uses it to show there's a fact of the matter (leather/iron) detectable by delicate palates.
          *   *Analysis:* This is Hume's key analogy. It suggests that while taste is subjective, the *capacity* to detect elements is objective.
