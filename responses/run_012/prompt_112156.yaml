  5.  **Analyze the "Secret Information" (The Nuclear Option):**
      *   **Nature:** It ends the lease for *both*. This is Mutually Assured Destruction (MAD).
      *   **Credibility:** To be useful, the threat must be credible. But using it hurts the User too (homelessness).
      *   **Current Status:** It's a "latent threat." The roommate suspects. This creates a "balance of terror."
      *   **Utility:** It prevents the roommate from escalating to *existential* threats (e.g., kicking the user out illegally). It does *not* help with petty grievances (dishes). Using it is irrational (suicide mission), so it's only good for deterrence, not coercion.

  6.  **Synthesize the Advice:**
      *   **Diagnosis:** The petty conflicts are worsening *because* of the stalemate. Aggression needs an outlet. This is "displaced aggression" or "low-intensity conflict" resulting from a frozen high-level conflict.
