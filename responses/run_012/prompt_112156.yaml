      *   **The Petty Conflicts:** These are proxy wars. Since the big war (lease termination) is off the table, aggression leaks out in low-intensity conflicts.

  4.  **Analyze the Friends' Advice:**
      *   **Friend A (Threaten to leave):** This is a *Bluff*. In strategy, a bluff that is called destroys credibility. If the roommate knows you can't afford to leave, threatening to do so makes you look irrational or weak, not strong. It undermines deterrence.
