      *   **The Threat:** Do not bluff on leaving (Friend A is wrong). It's not credible. Do not just accept misery (Friend B is partially right but passive).
      *   **Strategy:** Shift from *Coercion* (forcing him to change) to *Negotiated Coexistence* (arms control).
      *   **Actionable Steps:**
          1.  **Acknowledge the MAD:** Implicitly acknowledge the secret without stating it. "We both know we're stuck here, and we both know things could go very badly for both of us if this collapses."
          2.  **Focus on the Third Party:** Use the friend/housemate as a mediator. They want peace. Frame the petty issues as risks to *their* stability, not just yours.
