  7.  **Refining the Tone:**
      *   Needs to be academic but accessible.
      *   Critical but appreciative.
      *   Honest about uncertainties (e.g., specific plot mechanics of the lock-down).
      *   *Self-Correction on Constraints:* I need to make sure I don't quote dialogue. I need to be careful about plot details (e.g., does Caleb actually rewrite the code? Yes, he modifies the security protocol during the power cuts. Does Nathan watch via battery camera? Yes, implied through the surveillance room). I must not invent scenes.

  8.  **Final Polish:**
