answer: |-
  The standoff is substantively normative rather than conceptual or empirical, confirming your hypothesis that causal arguments are epiphenomenal disguises for incompatible commitments about whether moral value resides in outcomes or participation.

  The diagnostic weight falls primarily on (d) and (b), with (a) serving as the rhetorical vehicle rather than the engine. Bedrock intuitions about complicity (d) account for roughly half the disagreement: Camp 2 possesses a non-consequentialist intuition that moral integrity is tainted by association with harm regardless of impact, while Camp 1 holds a consequentialist intuition that moral status supervenes on state-of-the-world differences. This normative clash manifests as a disagreement about the object of the moral predicate (b), accounting for another 40%: Camp 1 evaluates act-tokens by their consequences, while Camp 2 evaluates act-tokens by their relation to patterns, practices, or maxims. The hidden disagreement about causation (a) accounts for the remaining 10%: while Camp 1 insists on counterfactual dependence, Camp 2 often accepts the counterfactual account but denies its moral exclusivity, or alternatively employs a contributory model (NESS) that Camp 1 rejects as non-causal. Empirical disagreements about harm functions (c) are negligible because the stalemate persists even when functions are agreed upon (e.g., voting), and the disagreement about *ought implies can* (e) is derivative of the deeper normative split regarding whether "can" refers to affecting outcomes or conforming to rules.

  Testing this diagnosis against your battery of cases reveals that Camp 2's verdicts are invariant to causal features, whereas Camp 1's track them precisely. In the case of a threshold already crossed, Camp 1 verdicts shift to "permissible" (no impact), while Camp 2 verdicts remain "wrong" (complicity remains); this divergence isolates the normative intuition from the causal fact. In the purely additive case, both sides converge on "wrong," but for different reasons (impact vs. participation), masking the underlying rift. In the minuscule probability case, Camp 1 verdicts shift toward "permissible" (expected utility negligible), while Camp 2 remains steady on "wrong" (duty to do one's part); again, causation moves Camp 1 but not Camp 2. In the universalizable no-difference case, Camp 1 verdicts are "permissible," while Camp 2 verdicts are "wrong"; this confirms that Camp 2 is evaluating the pattern, not the token. The pattern found is that Camp 1's judgments are sensitive to causal variance, while Camp 2's are sensitive to relational variance, proving that causal machinery is not the common ground but the contested terrain used to fight a normative war.

  Your hypothesis is correct: the causal machinery is epiphenomenal, serving as a respectable costume for conclusions derived from prior normative commitments. If this is right, it follows that searching for a refined theory of causation or a more precise harm function will never resolve the dispute, because the dispute is not about how the world works but about what morality demands of agents within it. The literature has stalled because participants believe they are arguing about facts (causation) when they are arguing about values (responsibility).

  Progress requires abandoning the search for a unified theory of individual duty in collective harm and accepting a typological distinction between *outcome duties* (binding only when impact is probable) and *participation duties* (binding regardless of impact). A formal result or empirical measurement cannot settle this because the residue is not empirical; it is axiological. The dispute has survived as a verbal/conceptual confusion because framing it as a causal problem allows both sides to avoid defending their foundational normative theories—Camp 1 avoids defending act-consequentialism against integrity objections, and Camp 2 avoids defending deontology against fetishism objections. Resolving the verbal mask would force this foundational confrontation, which is why the causal costume is preferred: it promises a technical solution to a philosophical dilemma. Nothing should be expected from further causal analysis; progress lies only in explicitly mapping the normative commitments that the causal arguments currently obscure.
