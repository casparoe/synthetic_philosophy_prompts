answer: |-
  # DECISION TREE: THE SPLIT-BRAIN ONTOLOGY

  **START:** In commissurotomy patients, hemispheres can report different stimuli and hands can act at cross-purposes.

  **Q1: Is the question "How many minds are there?" meaningful, or is it a category error?**
  *   **Meaningful:** Go to Q2.
  *   **Category Error / No Fact:** → *Leaf 1: There is no fact of the matter; "mind" is a loose folk-term.*

  **Q2: Is the disunity in *what it feels like* (phenomenology), or only in *what can be reported/controlled* (access/agency)?**
  *   **Access/Agency Only:** Go to Q3.
  *   **Phenomenology (Two Streams):** Go to Q4.

  **Q3: (Access/Agency Only) Is the unity located in the conscious subject or the behavioral agent?**
  *   **Unified Subject, Access Barrier:** → *Leaf 2: One conscious subject exists but cannot internally share information.*
  *   **Unified Subject, Divided Agents:** → *Leaf 3: One "I" exists, but it controls two independent behavioral systems.*
  *   **Subject is Illusion:** → *Leaf 4: There is no unified subject; only a narrative center of gravity.*

  **Q4: (Two Streams) Do the streams ever compete within a *single* action (e.g., one hand buttons, one unbuttons), or only on separate tasks?**
  *   **Separate Tasks Only:** Go to Q5.
  *   **Single Action Competition:** Go to Q6.

  **Q5: (Separate Tasks) Did the surgery create this fragmentation, or is it the normal state of intact brains?**
  *   **Surgery-Induced:** → *Leaf 5: The knife created new, distinct conscious fragments.*
  *   **Latent (Pathological):** → *Leaf 6: Intact brains are unified; surgery reveals a fragile, breakable system.*
  *   **Latent (Functional):** → *Leaf 7: Intact brains are already fragmented; surgery just makes it visible.*

  **Q6: (Single Action) If two streams control one body in conflict, does the "Person" (moral/legal entity) split with the "Subject" (conscious entity)?**
  *   **Yes (Two Persons):** → *Leaf 8: Two moral persons and two subjects share one body.*
  *   **No (One Person, Two Subjects):** → *Leaf 9: One moral person hosts two distinct conscious subjects.*
  *   **No (One Person, One Subject, Two Agents):** → *Leaf 10: One person and subject exists, but agency is mechanically duplicated.*

  ***

  ### ANALYSIS OF THE TREE

  **Unoccupied Combinations**
  *   **Latent Disunity + Single Action Conflict:** (Q5 → Q6). *Why unoccupied?* **Unattractive.** If intact brains were phenomenally split *and* capable of inter-manual conflict, daily life would involve constant physical self-sabotage. This view requires ad-hoc explanations for why the corpus callosum prevents fighting but not splitting.
  *   **One Subject + Two Agents + Single Action Conflict:** (Q3 → Q6). *Why unoccupied?* **Incoherent.** It is difficult to make sense of a *single* phenomenal subject simultaneously willing contradictory actions (buttoning and unbuttoning) without splitting the subject itself.

  **Indistinguishable Leaves**
  *   **Leaf 8 (Two Persons) vs. Leaf 9 (One Person, Two Subjects):** *Flagged.* Empirically, these look identical. The difference rests entirely on whether "Personhood" supervenes on biological bodies or conscious subjects. In a clinical or legal setting, these leaves yield the same verdicts; they separate only in metaphysical accounting.
  *   **Leaf 3 (Unified Subject, Divided Agents) vs. Leaf 10 (One Person/Subject, Two Agents):** *Flagged.* Both posit a unified "I" with divided control. Leaf 10 is essentially a restatement of Leaf 3 reached via the "Phenomenal Split" branch, suggesting the tree cannot fully disentangle "Agent" from "Subject" in conflict cases.

  **The "Ugliest" Commitments**
  *   **Leaf 7:** Requires you to tell your reading group they are already two people, they just don't know it.
  *   **Leaf 8:** Requires you to treat a single breathing human as two legal/moral entities responsible for different hands.
  *   **Leaf 1:** Requires you to admit philosophy cannot answer the central question of the handout.
