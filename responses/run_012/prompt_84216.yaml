answer: |-
  This is a classic jurisprudential frustration. The slogan "You can't legislate morality" functions as a rhetorical trump card, but in analytical jurisprudence, it is a homonym—it sounds like one claim but refers to several distinct propositions, ranging from the empirically dubious to the tautologically true.

  As requested, I will not begin with a verdict. I will first lay out the menu of candidate readings, evaluate their logical status and argumentative force, test them against your two statutes, assess their impact on the specific brand of legal moralism you described (the Devlinian cohesion model), and conclude with an assessment of my own epistemic limitations.

  ### I. The Menu of Candidate Readings

  We can distinguish at least five distinct claims hidden within the slogan.

  **1. The Empirical Claim (Inefficacy)**
  *   **Claim:** Criminal law is causally ineffective at changing internal moral beliefs or conscience. It can coerce behavior, but it cannot make people *virtuous* or make them *believe* the conduct is wrong.
  *   **Truth Status:** Largely true, though nuanced. Law shapes preferences over time (expressive function), but it cannot instantly convert conscience.
  *   **Contested?** Minimally. Even legal moralists usually concede law regulates conduct, not thoughts.
  *   **Argumentative Force:** Weak as a conversation-closer. It does not prove one *should not* legislate morality, only that one cannot achieve *total* moral alignment. If the goal is social cohesion via behavioral conformity (as per your description of the moralist), efficacy in changing hearts is not required.

  **2. The Conceptual Claim (Category Error)**
  *   **Claim:** "Law" and "Morality" are conceptually distinct spheres. Law deals with external acts; morality deals with internal motives. To speak of "legislating morality" is a category mistake, like "weighing a color."
  *   **Truth Status:** False (or at least highly contentious). Legal positivism separates law and morality as *concepts*, but does not deny law can *content-wise* overlap with morality. Natural law theorists would reject the separation entirely.
  *   **Contested?** Heavily. This is the Hart-Fuller debate terrain.
  *   **Argumentative Force:** Strong rhetorically, weak philosophically. It shuts down debate by definition rather than argument. If accepted, it makes the moralist's position unintelligible rather than wrong.

  **3. The Normative Claim (The Harm Principle)**
  *   **Claim:** It is morally illegitimate to use state coercion solely to enforce moral norms absent identifiable harm to others. (This is the Mill/Hart position).
  *   **Truth Status:** Normatively contested. It is a first principle of liberalism, not a fact.
  *   **Contested?** Yes, this is the core of the Hart-Devlin debate.
  *   **Argumentative Force:** Strong, but question-begging in this context. Using this to close the argument assumes the liberal premise is true, which is exactly what the legal moralist denies. It asserts the conclusion rather than proving it.

  **4. The Epistemic Claim (Moral Skepticism)**
  *   **Claim:** There is no objective "morality" to legislate, only subjective preferences or cultural tastes. Therefore, legislation purporting to enforce morality is actually enforcing arbitrary power.
  *   **Truth Status:** Meta-ethically contested.
  *   **Contested?** Yes. Requires a stance on moral realism vs. anti-realism.
  *   **Argumentative Force:** Strong if granted, but shifts the debate from jurisprudence to meta-ethics. It undermines the "shared morality" premise of the Devlinian moralist.

  **5. The Trivial Claim (Imperfection)**
  *   **Claim:** You cannot legislate morality *perfectly* or *exhaustively*.
  *   **Truth Status:** True.
  *   **Contested?** No.
  *   **Argumentative Force:** Nil. No legal moralist claims the law can capture the entirety of the moral universe.

  ---

  ### II. Evaluation of Argumentative Utility

  The visiting speaker used the slogan to **close off** discussion. For a slogan to do this work, it must present itself as a decisive refutation.

  *   **Readings 1 (Empirical) and 5 (Trivial)** fail to close the argument. They leave open the possibility that imperfect behavioral regulation is still worthwhile for social cohesion.
  *   **Reading 2 (Conceptual)** closes the argument by making the moralist's position nonsensical. However, it is easily dismantled by a PhD student pointing out that all criminal law (e.g., murder prohibitions) overlaps with moral prohibition.
  *   **Reading 3 (Normative)** is the only one that actually defeats the moralist, but it does so by asserting a competing normative first principle. It is not a "knock-down" point derived from the nature of law; it is a political commitment. Using it as a slogan masks the need to defend liberalism against communitarianism.
  *   **Reading 4 (Epistemic)** closes the argument by undermining the premise. If there is no "shared morality" (only power), the moralist has no object to enforce.

  **Verdict on the Speaker:** The speaker likely relied on a conflation of **Reading 2** (to make it sound obvious) and **Reading 3** (to make it sound decisive). This is intellectually dishonest in a seminar setting, as it disguises a normative contest as a conceptual truth.

  ---

  ### III. Testing Against the Statutes

  Let us apply these readings to your two test cases.

  **Statute A: The "Disgust" Statute**
  *   *Content:* Criminalizes conduct that harms no identifiable person but is prefaced as contrary to shared morality (e.g., consensual adult incest, or desecration of a non-sacred but revered object).
  *   *Moralist Justification:* Preservation of social bonds via the "intolerance/indignation" test.

  **Statute B: The "Civic Virtue" Statute**
  *   *Content:* Requires schools to teach a curriculum in civic virtue (e.g., patriotism, duty, specific conceptions of the good life).
  *   *Moralist Justification:* Transmission of shared values to ensure future cohesion.

  | Reading | Statute A (Disgust/Criminal) | Statute B (Virtue/Education) | Notes |
  | :--- | :--- | :--- | :--- |
  | **1. Empirical** | **Silent/Allows.** Law can stop the act even if it doesn't change the heart. | **Forbids/Limits.** You cannot force a child to *believe* the virtue, only recite it. | Distinguishes conduct from conscience. |
  | **2. Conceptual** | **Forbids.** Claims criminal law cannot touch "morality." | **Forbids.** Claims education cannot legislate "morality." | Collapses under scrutiny (murder laws exist). |
  | **3. Normative (Harm)** | **Forbids.** No harm to others; purely moral enforcement. | **Silent/Allows.** If "civic virtue" is framed as political stability (harm prevention) rather than moral truth. | Requires distinguishing political vs. comprehensive morality. |
  | **4. Epistemic** | **Forbids.** "Shared morality" is an illusion of power. | **Forbids.** "Virtue" is subjective indoctrination. | Attacks the legitimacy of the state's knowledge. |
  | **5. Trivial** | **Silent.** Acknowledges law won't catch all immorality. | **Silent.** Acknowledges schools won't make everyone virtuous. | Irrelevant to validity. |

  ---

  ### IV. Implications for the Legal Moralist (Devlinian)

  You specified the legal moralist position as the **Devlinian cohesion model**: *Society may enforce shared morality because erosion threatens social bonds; the test is the reaction of the ordinary reasonable person (intolerance, indignation, disgust).*

  **Readings that give the Moralist something to worry about:**

  1.  **Reading 3 (The Normative/Harm Claim):** This is the Hartian counter-punch. If the liberal principle is correct, the Devlinian test (disgust) is irrelevant. Disgust does not equal harm. This reading forces the moralist to defend why cohesion outweighs liberty. It is the strongest threat.
  2.  **Reading 4 (The Epistemic Claim):** Devlin relies on the existence of a *shared* morality. If the skeptic argues that modern societies are too pluralistic for a "shared" morality to exist (the "disintegration thesis"), then the Devlinian test has no object. If there is no shared morality, there is nothing to enforce, and the "disgust" of one group is merely the oppression of another.

  **Readings that leave the Moralist untouched:**

  1.  **Reading 1 (Empirical):** Devlin never argued that law makes people good Christians or Kantians. He argued it prevents the *disintegration of society*. As long as the law stops the public conduct that triggers the "intolerance and indignation" of the majority, the social bond is preserved. Whether the sinner repents internally is irrelevant to the cohesion thesis.
  2.  **Reading 2 (Conceptual):** Once clarified, this reading dissolves. The moralist simply replies, "I am not legislating 'morality' as an abstract concept; I am legislating conduct that happens to be morally proscribed."
  3.  **Reading 5 (Trivial):** Obviously irrelevant.

  **Assessment:** The slogan "You can't legislate morality" is mostly **safe** for the Devlinian moralist to ignore, *unless* it is unpacked into the Normative Claim (Harm Principle). The speaker used a slogan to avoid making the normative argument that liberty trumps cohesion.

  ---

  ### V. Epistemic Humility: What Would Change My Mind?

  As a philosopher of law, my assessment rests on certain assumptions about the function of jurisprudence and the stability of concepts. Here is where my reasoning is vulnerable:

  **1. What would change my mind about the "Conceptual" Reading?**
  If persuasive evidence emerged that the *internal point of view* (Hart) is not just a feature of legal systems but a *constraint* on their validity. If it could be shown that laws lacking moral endorsement by the populace systematically fail to function *as law* (collapse into mere force), then the Empirical and Conceptual claims merge. If legislating against deep moral currents causes the legal system itself to lose legitimacy and collapse, then "You can't legislate morality" becomes a functional truth about legal validity, not just moral philosophy.
  *   *Where I might fail:* I may be underestimating the expressive function of law. If law *does* shape morality over generations (as some legal socialization theorists argue), then the distinction between "regulating conduct" and "legislating morality" blurs.

  **2. What would change my mind about the "Normative" Reading?**
  I have treated the Harm Principle as a competing first principle. However, if it could be demonstrated that "harm" is inextricably linked to "moral offense" in the psychology of social beings (e.g., that psychological harm *is* the feeling of moral violation), then the Hart-Devlin distinction collapses. If the erosion of shared morality *is* a harm to individuals (by destroying their social context), then the liberal objection vanishes.
  *   *Where I might fail:* I am assuming a liberal individualist ontology. If the "self" is constitutively dependent on the community (a communitarian critique), then the "harm to others" principle actually *supports* legal moralism, because damaging the community's moral fabric harms the individual.

  **3. The Risk of the "Menu" Approach**
  My analysis assumes that clarity resolves disagreement. It is possible that the slogan's power lies precisely in its ambiguity. By forcing the speaker to choose a reading, I may be imposing an analytical framework that misses the rhetorical and political work the slogan performs in a democratic society. The slogan may not be a philosophical claim but a **heuristic for judicial restraint**. If the slogan is a rule of thumb for judges to avoid entering the "thicket" of moral theology, its truth value is less important than its institutional utility.
  *   *Where I might fail:* I am treating a political maxim as a philosophical proposition. If the slogan is a boundary marker for institutional competence rather than a claim about truth, my evaluation of its "truth status" is category-mistaken.

  ### Summary for your Seminar
  The speaker's slogan is a **Normative Claim (Reading 3)** disguised as a **Conceptual Truth (Reading 2)**.
  *   It does not refute the Devlinian moralist unless you first accept the Harm Principle.
  *   It forbids Statute A (on normative grounds) but is silent on Statute B (unless civic virtue is deemed moral).
  *   To reopen the argument, you must ask the speaker: *"Are you claiming it is conceptually impossible for law to overlap with morality, or are you claiming that when they overlap, the law is illegitimate? If the latter, are you asserting the Harm Principle as an axiom, and if so, how do you answer Devlin's claim that society has a right to self-preservation?"*

  This forces them off the slogan and onto the substantive ground where the debate actually lives.
