  ok so my friend showed me the two envelope thing and its been bugging me for like two weeks. the setup: two envelopes, one has twice as much money as the other, you pick one but dont open it, and then youre offered the chance to swap. the argument is that the other envelope is 50/50 to be double or half of yours, so on average its worth 1.25x what youve got, so you should always swap, and then you should swap back, forever. obviously thats wrong. but i dont actually want the puzzle solved again — every explanation ive found either just asserts that the probabilities are wrong (which is useless, why are they wrong) or jumps straight into measure theory stuff i cant follow.

  what i want is the most important implications. like what does this actually force me to accept or give up about expected value reasoning in general? should it make me more suspicious of the whole multiply-the-outcomes-by-their-probabilities move when i apply it to my own decisions? my maths teacher said theres a version with two people, each holding an envelope, where both of them are right that swapping would be better for them, and if thats true i dont understand how it can be possible. another friend said the 1.25x calculation secretly compares two different possible worlds and treats them like theyre the same situation, which sounds like a real point but i cant tell if its just words. also is there a version with an honest-to-god proper probability distribution where swapping really is the smart move, and if so how is that not a paradox? and does any of this carry over to real life stuff where i catch myself doing envelope math — im choosing between two summer jobs right now, one pays a flat rate and the other is commission so it could be double or it could be half, and i keep thinking the commission one is worth 1.25x, which feels like the exact same mistake but maybe it isnt?

  give me the implications ranked by how much they should actually change what i do, and keep the stuff thats only true inside the puzzle clearly seperate from the stuff that generalises to real decisions. plain english please, but dont sand off the interesting parts to make it easy — id rather have one real insight than five that are just restatements of the setup.
