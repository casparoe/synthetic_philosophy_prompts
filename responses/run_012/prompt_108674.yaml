      *   *The Prior:* To calculate EV properly, you need a prior distribution of money in the envelopes. If the distribution is uniform over all positive real numbers (impossible), the paradox holds. If it's a proper distribution (e.g., bounded), the EV of swapping is zero (or depends on the specific amount seen).
