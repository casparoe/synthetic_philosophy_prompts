answer: |-
  | Rank | Question | Upstream_of | Tractability | Disconfirming_evidence | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | **The Reference Policy Problem:** Can we define a counterfactual baseline trajectory (the "null" action) for an embedded agent that is neither trivial (doing nothing) nor value-laden (doing what humans would do), without invoking the agent's own objectives? | All subsequent impact measures; without a defined baseline trajectory, "deviation" and "side effect" are mathematically undefined. | High for philosophers (modal logic, counterfactual semantics) and game theorists (equilibrium selection); requires no empirical data. | A proof that any non-trivial baseline for an embedded agent necessarily encodes a preference ordering over world states. | Strong objection: This may be an impossible problem; if so, the entire "low-impact" paradigm collapses, making this the most critical risk to clear early. |
  | 2 | **The Feature Salience Problem:** Is there a value-agnostic metric of state-change significance (e.g., based on causal capacity or option value) that correlates with human harm without explicitly modeling human preferences? | The "Value-Loading" circularity; if solvable, it breaks the user's dichotomy by offering a third category: "structurally significant change." | High for theorists (information theory, reachability analysis); philosophers can clarify the ontology of "opportunity." | Empirical demonstration that value-agnostic salience measures are easily gameable or fail to capture "quiet" catastrophes (e.g., manipulation). | Strong objection: "Significance" may be inherently anthropocentric; a physics-based measure might miss sociological harms. |
  | 3 | **The Causal Attribution Problem:** Can we distinguish impact caused by the agent's optimization from impact caused by the agent's mere presence (preemption) using structural causal models without assuming intent? | Safety guarantees; we must avoid penalizing the agent for world changes it did not causally induce, or it will refuse to exist. | Moderate for theorists (causal inference, do-calculus); requires precise formalization of "agency" within a causal graph. | A proof that in highly entangled environments, agent presence and agent action are causally inseparable at the relevant granularity. | Strong objection: Causal models require a pre-defined variable set, which may smuggle in value judgments about what counts as a variable. |
  | 4 | **The Normative Correlation Hypothesis:** Does minimizing value-agnostic impact (derived from Q1 & Q2) reliably prevent catastrophic outcomes across a distribution of tasks, or does it merely shift failure modes? | The ultimate viability of the funding program; if low-impact AI is still unsafe, the operational definition is insufficient. | Moderate for theorists (adversarial analysis, worst-case bounding); requires constructing counter-example environments. | Discovery of a "low-impact" strategy that achieves high capability while causing catastrophic side effects undetectable by the measure. | Strong objection: This is an empirical question better suited for ML engineers than philosophers, risking a mismatch with the board's theoretical focus. |

  **Fund First:** Rank 1 (The Reference Policy Problem), because it is the strict logical prerequisite; if the baseline is incoherent, no amount of work on salience or causality can save the program. **Drop:** The formalization of "agent intent" (not listed), as it relies on internal states which are unobservable and likely redundant if external impact is successfully constrained. **Tie-Breaking Criteria:** I prioritized questions where a negative result (impossibility proof) is more valuable than a positive one, as this allows the foundation to pivot quickly rather than sinking costs into a doomed paradigm.
