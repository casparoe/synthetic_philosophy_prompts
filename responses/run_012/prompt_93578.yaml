      *   **Topic:** Levels of explanation, specifically critiquing Dennett's "Cranes vs. Skyhooks" and "Greedy Reductionism."
      *   **Thesis:** Dennett's distinction is a single mistake applied twice. It smuggles in an engineering model (load-bearing vs. magic). The real vice is "crane-mongering" (demanding a distinct lower-level mechanism for every higher-level regularity).
      *   **Audience:** Hostile/Specific mix:
          *   Philosophers of Biology (Adaptationists vs. Evo-Devo).
          *   Eliminative Materialists (Cognitive Science).
          *   Complex-Systems/Emergence Proponent.
          *   Historian of Biology (Pedantic/Contextual).
      *   **Goal:** A Q&A prep sheet with specific objections, ordered by damage potential, phrased in the interlocutors' voices, with 2-minute replies, vulnerability notes, strategic concessions/holds, and the "Killer Question."

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Thesis:* Dennett is wrong; "Cranes vs. Skyhooks" is just "Crane-Mongering" twice.
      *   *Vulnerability 1 (Eliminativists):* If you deny the need for mechanisms, aren't you just endorsing mysticism? If higher levels are real, show me the mechanism.
      *   *Vulnerability 2 (Adaptationists):* If you attack "greedy reductionism," are you protecting adaptationist "just-so stories" (skyhooks)?
      *   *Vulnerability 3 (Evo-Devo):* They hate adaptationism. Will they see "crane-mongering" as a way to validate constraints without mechanisms? Or will they think you're still too mechanistic?
      *   *Vulnerability 4 (Complex-Systems):* They love emergence. They will try to claim you. You need to distinguish your view from "strong emergence."
      *   *Vulnerability 5 (Historian):* Is this a strawman? Did Dennett (or anyone) actually hold the "strong reading" you're attacking?
      *   *Core Vulnerability:* What *does* underwrite higher-level regularities if not mechanisms? If nothing, isn't it a skyhook? If something, isn't it a crane?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Eliminativist.* This is the most dangerous. If the higher level doesn't map to a mechanism, does it exist?
          *   *Voice:* Blunt, impatient, "show me the neurons."
          *   *Reply:* Distinguish *constitution* from *explanation*. Regularities exist as patterns, not things.
          *   *Weakness:* Patterns need a substrate. If the substrate doesn't support the pattern, the pattern vanishes.

      *   *Objection 2: The Adaptationist.* They love Dennett. They think selection is a crane.
          *   *Voice:* Smug, defensive of natural selection as a non-magical process.
          *   *Reply:* Selection *is* a crane, but treating it as a *mechanism* in the engineering sense distorts it. It's a statistical filter, not a gear.
          *   *Weakness:* Statistical filters *are* mechanisms in the broad sense. Hard to draw the line.

      *   *Objection 3: The Evo-Devo Person.* They hate adaptationist storytelling.
          *   *Voice:* Skeptical of "optimality," interested in constraints.
          *   *Reply:* Constraints aren't "permissions," they are explanatory. But crane-mongering demands a genetic mechanism for every constraint.
          *   *Weakness:* Constraints often *are* physical/mechanical.

      *   *Objection 4: The Complex-Systems Person.* Wants to claim "Emergence."
          *   *Voice:* Enthusiastic, buzzword-heavy (non-linear, top-down).
          *   *Reply:* I'm not positing downward causation, just explanatory autonomy. Don't recruit me for strong emergence.
          *   *Weakness:* Autonomy often implies downward causation to them.

      *   *Objection 5: The Historian.* The "Strawman" charge.
          *   *Voice:* Pedantic, textual.
          *   *Reply:* It's not about textual exegesis, it's about the *logic* of the metaphor's uptake.
          *   *Weakness:* If Dennett didn't mean it, why attack him?

  4.  **Ordering by Damage:**
      1.  Eliminativist (Ontological threat: If no mechanism, then nothing there.)
      2.  Historian (Dialectical threat: You're fighting a ghost.)
      3.  Adaptationist (Theoretical threat: You're smuggling magic back in.)
      4.  Complex-Systems (Categorization threat: You're one of us whether you like it or not.)
