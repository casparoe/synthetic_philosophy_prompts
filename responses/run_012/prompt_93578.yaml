      *   Need to highlight the "thin" spot honestly.

  6.  **Strategic Concessions/Holds:**
      *   *Concede:* Mechanisms are great when available. Dennett is right that magic is bad.
      *   *Hold:* The *demand* for a mechanism is the error, not the lack of one. The engineering metaphor is the root.

  7.  **The "Killer Question":**
