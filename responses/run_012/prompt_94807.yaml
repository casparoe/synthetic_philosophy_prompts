answer: |-
  There is no single, canonical term in the philosophy of science or historiography for this specific rhetorical maneuver. You have identified a structural tension that is often discussed in pieces (under "multiples," "priority disputes," or "social constructivism"), but the specific *asymmetric valuation of the same evidence* does not have a standard label like "The Matthew Effect" or "Stigler's Law."

  However, because you want precision rather than a label, we can define it rigorously. The most accurate conceptual name for this is **The Priority Asymmetry**, driven by **Asymmetric Counterfactuals**.

  Here is the breakdown of what the thing is, how it works, and where its edges lie.

  ### 1. The Mechanism: Necessity vs. Sufficiency
  The core of the pattern is that the historian (or the public) applies two different logical tests to the two discoverers based on the same fact (independence or ripeness).

  *   **For the First Discoverer (P1), the test is Necessity.**
      *   *Question:* "Was this person strictly necessary for the discovery to happen?"
      *   *Evidence:* "Wallace found it too" or "The times were ripe."
      *   *Verdict:* If someone else could have (or did) find it, P1 was not necessary. Their uniqueness is diluted. They become a symptom of the era rather than the cause of the idea.
  *   **For the Second Discoverer (P2), the test is Sufficiency.**
      *   *Question:* "Was this person capable of finding it on their own merits?"
      *   *Evidence:* "Wallace found it too" or "He recognized the ripe fruit."
      *   *Verdict:* If they found it independently (or recognized the ripeness), they are sufficient. Their competence is proven. They are elevated from a copyist to a peer.

  **The Asymmetry:** The same fact (simultaneity/ripeness) is used to prove P1 was *replaceable* while proving P2 was *capable*.

  ### 2. Why it isn't other things
  You asked to distinguish this from three specific concepts. Here is the boundary work:

  *   **Vs. The "Inevitability" Argument:**
      *   *Inevitability* claims the discovery was bound to happen. If applied consistently, this should dock credit from *everyone* (since anyone could have done it).
      *   *The Priority Asymmetry* is sneakier. It uses inevitability to *subtract* from P1 but *add* to P2. It says, "Darwin wasn't magical (inevitability), but Wallace wasn't a copycat (independence)." It preserves the glory of the discovery while spreading it out.
  *   **Vs. The Genetic Fallacy:**
      *   The *Genetic Fallacy* is judging the truth of an idea based on its origin.
      *   *The Priority Asymmetry* is not about the truth of the theory (evolution/calculus is true regardless); it is about the *allocation of credit*. It is a sociological evaluation, not a logical one regarding truth.
  *   **Vs. A Plain Double Standard:**
      *   A *Double Standard* is arbitrary (e.g., "I can do this, you can't").
      *   *The Priority Asymmetry* is **systematic**. It follows a hidden rule: *Priority is judged against potential competitors; Simultaneity is judged against the originator.* It feels fair to the observer because it resolves a cognitive dissonance (see below), whereas a double standard just feels unfair.

  ### 3. The Function: Reconciling "Great Man" vs. "Zeitgeist"
  Why does this pattern exist? It serves a specific narrative purpose. Historians of science are constantly tug-of-war between two models:
  1.  **Great Man Theory:** Genius individuals drive history.
  2.  **Zeitgeist Theory:** Ideas emerge when the culture is ready.

  If you lean too hard on Zeitgeist, Darwin becomes a nobody who just happened to be there. If you lean too hard on Great Man, Wallace becomes a thief or a fluke.

  **The Priority Asymmetry allows you to have both.**
  It lets you say: "The idea was in the air (Zeitgeist protects Wallace's independence), BUT it took a genius to see it (Great Man protects Wallace's competence)." Meanwhile, for Darwin, it says: "He was the genius who got there first (Great Man), but he wasn't magical because Wallace got it too (Zeitgeist)."

  It is a credit-distribution heuristic that keeps the scientific narrative stable.

  ### 4. The Edges and Limits
  You asked about the boundary conditions. This is where the pattern breaks or shifts.

  **Case A: Correspondence / Collusion**
  If P1 and P2 were corresponding (e.g., if Wallace had sent his paper to Darwin and Darwin had sat on it for a year without acknowledging receipt), the **Independence** premise collapses.
  *   *Result:* The Asymmetry cannot function. You cannot use "independence" to validate P2 if it didn't exist.
  *   *Shift:* The narrative shifts to **Ethics**. P1 is judged on *generosity* (did they share?), P2 is judged on *plagiarism* (did they steal?). The "ripeness" argument usually vanishes here because the specific formulation of the idea is no longer "in the air," it's in the letters.

  **Case B: The "Weaker Thinker" Problem**
  What if P2 is clearly inferior (e.g., a lesser mathematician who publishes a clumsy version of calculus first)?
  *   *Result:* The Asymmetry often **fails to elevate P2**.
  *   *Why:* The "Sufficiency" test requires that P2's work stands on its own. If P2's version is flawed, independence doesn't prove competence; it proves coincidence. In this case, the "Ripeness" argument is used to *dock* P2 as well ("He got lucky with the timing, but didn't understand it").
  *   *Example:* This is why some "co-discoverers" remain footnotes. The Asymmetry only fully activates if P2's work is of comparable *quality*. The pattern is subservient to the **Quality Narrative**. We only grant the "Validation" bonus if we think the second person actually deserved it.

  **Case C: The "Ripeness" Switch (Dependent Discovery)**
  You noted that when independence is impossible, people switch to "someone was bound to find it."
  *   *Mechanism:* This changes the evidence from **Independence** to **Receptivity**.
  *   *P1 (First):* "He just picked the low-hanging fruit." (Docked credit: Luck/Timing).
  *   *P2 (Second):* "He recognized the value of the fruit others ignored." (Added credit: Insight).
  *   *Limit:* This works best when P2 does something *new* with the discovery. If P2 just repeats P1, the "Ripeness" argument usually collapses into "P2 is a follower." The Asymmetry requires P2 to add *interpretive value* to gain the credit bonus.

  ### 5. Proposed Name
  If you need to refer to this in future arguments with Dan, the most precise label is **The Priority Asymmetry**.

  If you want to sound more technical regarding the logical move, call it **Asymmetric Counterfactual Reasoning in Priority Disputes**.

  **Summary Definition:**
  > **The Priority Asymmetry:** A historiographical pattern where evidence of simultaneous or inevitable discovery is applied asymmetrically to allocate credit. For the priority holder, such evidence functions as a **discount factor** (suggesting replaceability/luck); for the simultaneous successor, the same evidence functions as a **validation factor** (suggesting competence/independence). This allows the narrative to maintain both the objectivity of science (ideas emerge from the zeitgeist) and the agency of scientists (geniuses recognize truth).

  It is not a fallacy in the strict logical sense, but a **narrative stabilization device**. It prevents the history of science from becoming either a list of magical miracles (only one person could ever think of X) or a deterministic automaton (the idea would have happened exactly then regardless of who was alive). It splits the difference by taxing the first and subsidizing the second.
