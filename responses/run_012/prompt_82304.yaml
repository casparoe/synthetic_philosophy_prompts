answer: |-
  1. The agent was the Federal Reserve and Treasury acting as a unified crisis manager facing options to rescue or let fail amidst states ranging from contained loss to systemic collapse. The Bear Stearns and AIG rescues suggest the worst-case state of total financial meltdown was weighted heavily enough to override moral hazard concerns, whereas the Lehman decision implies a temporary underweighting of that same tail risk.
  2. These three choices cannot be made consistent with a single static risk-weighting function because the tolerance for catastrophic failure shifted abruptly between September 14 and 15. This apparent inconsistency shows the theory is being asked for something it cannot give, as it cannot accommodate rapid shifts in risk attitude driven by external political constraints.
  3. The probabilities assigned to systemic contagion were subjective estimates derived from opaque market signals rather than objective frequencies, which risk-weighted utility treats as exogenous inputs. Consequently, the theory is simply silent about how these probabilities were generated, offering no guidance on whether the shift in perceived likelihood between Lehman and AIG was rational or panicked.
  4. Officials were maximizing a hybrid preference function blending public welfare, institutional survival, and political accountability rather than the utility of any single individual. The framework does not fully survive that question because risk-weighted utility assumes a unitary agent, whereas this episode reveals a collective decision-making body acting with ambiguous mandates.
  5. The episode serves as a case the theory never anticipated, exposing its inability to account for sequential decision-making where earlier choices constrain later risk weights. It is less an embarrassment than a boundary marker, showing that descriptive risk models fail when the definition of the worst outcome changes mid-crisis.
