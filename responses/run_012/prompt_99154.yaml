answer: |-
  # Q&A Prep Sheet: The Decision-Relative Demos

  **Context:** Workshop on Democratic Theory
  **Presenter:** 4th-Year PhD Candidate
  **Core Claim:** The boundary problem dissolves if we treat the *demos* as decision-relative (based on authoritatively affected interests) rather than a pre-political, persisting entity.

  ---

  ## Part 1: The Objections (Ordered by Likelihood & Damage)

  ### 1. The Individuation/Agenda Control Objection
  **Who:** The Empirical Political Scientist & The Kantian Constructivist
  **The Charge:** "You claim the boundary problem dissolves because the *demos* shifts with the decision. But who individuates the 'decision'? If a oligarchy defines a policy as 'local zoning' rather than 'national housing,' they exclude the affected outsiders. By making the *demos* dependent on the decision, you haven't solved the circularity; you've just moved the site of exclusion from the border to the agenda. Without a prior *demos* to set the agenda, your 'decision-relative' rule is hostage to power."

  **Two-Minute Reply:**
  "This is the strongest objection, and I concede the risk. However, moving the problem from 'boundary' to 'agenda' is a feature, not a bug. The traditional view hides the power to define the *demos* behind a veil of constitutional permanence. My view makes that power visible and contestable.
  My reply is twofold. First, 'authoritative affectedness' is not a technical fact determined by experts; it is a political claim. When a group claims they are affected, that claim itself triggers a democratic duty to hear them. Second, we don't need a *prior* demos to start the process; we need *provisional* institutions. We accept that current institutions will set the initial agenda, but we build in review mechanisms (courts, tribunals, referendums) where excluded groups can challenge the individuation of the decision. We trade the myth of a 'once-and-for-all' boundary for a continuous struggle over agenda control, which is actually where democratic politics happens anyway."

  *   **Where this is soft:** It relies on the existence of impartial review mechanisms. If the agenda-setters control the courts, you have no recourse.
  *   **Concede up front:** "I cannot guarantee that agenda power won't be abused. No theory can. I only claim my framework makes that abuse legible as a democratic deficit, whereas the traditional view renders it invisible."

  ### 2. The Coercion/Subjected Objection
  **Who:** The All-Subjected Proponents
  **The Charge:** "'Affectedness' is promiscuous. Everything affects everyone (the butterfly effect). You need a bright line to make democracy feasible. That line is coercive subjection. If I am not subject to your coercive laws, I have no claim to a vote, even if your decision hurts my interests. By prioritizing 'interests' over 'coercion,' you dilute the specific wrong that democracy remedies: the imposition of will through force."

  **Two-Minute Reply:**
  "I agree we need to avoid the 'butterfly effect,' which is why I specify *authoritatively* affected interests—those recognized by the institutional framework as binding. But coercion is too narrow. Consider cross-border environmental harm or tax competition. A neighboring state's deregulation can devastate my community without coercing me directly. If democracy is about protecting interests from arbitrary power, coercion is just one modality of that power.
  Furthermore, the 'bright line' of coercion is illusory. Soft power, economic dependency, and structural domination affect people just as deeply as police power. By tethering the *demos* to coercion, you legitimize externalities. My account asks: 'Who bears the cost of this authority?' not just 'Who is legally bound?' This captures the normative core of self-government better than a formalist focus on legal subjection."

  *   **Where this is soft:** It risks expanding the *demos* so widely for complex issues (like climate change) that voting becomes impossible.
  *   **Concede up front:** "I concede that for routine domestic legislation, subjection and affectedness largely overlap. My view is most critical for transboundary or constitutional issues where they diverge."

  ### 3. The Stability/Community Objection
  **Who:** The Republican/Communitarian Leanings in the room
  **The Charge:** "Democracy requires trust, solidarity, and iteration. If the *demos* changes every time a decision is made, you destroy the possibility of political community. How can I deliberate with you if I don't know who 'we' are tomorrow? You are describing a market of stakeholders, not a people."

  **Two-Minute Reply:**
  "This assumes that solidarity must precede democracy. I argue solidarity is generated *through* the practice of inclusive decision-making. A 'persisting people' often masks exclusion (e.g., 'the people' historically meant white property owners).
  My view doesn't eliminate stability; it relocates it. There is still a permanent *administration*—the state apparatus—that manages the shifting electoral rolls. Citizens will still vote in most elections. The fluidity applies primarily to high-stakes, boundary-spanning decisions. We can maintain a 'core' demos for routine matters while allowing the 'periphery' to shift for specific issues. This isn't a market; it's a recognition that political community is porous and that our obligations extend to those we impact, not just those we live next to."

  *   **Where this is soft:** It's unclear how you administratively manage "core" vs. "periphery" voters without creating two classes of citizenship.
  *   **Concede up front:** "I am not proposing we abolish national elections tomorrow. I am proposing a normative standard for when the franchise *must* expand beyond the national citizenry."

  ---

  ## Part 2: Real Force vs. Field-Defending

  **Real Force (Must Answer Well):**
  1.  **The Individuation/Agenda Control Objection:** If you can't explain who decides the decision, the theory collapses into "might makes right."
  2.  **The Circularity Worry (Kantian):** If determining "affectedness" is itself a political act, haven't you just recreated the boundary problem at a higher level?

  **Field-Defending (Manage, Don't Fight):**
  1.  **The All-Subjected Purists:** They want to defend coercion as the *only* ground. You won't convert them. Show them your view *includes* coercion but isn't *limited* by it.
  2.  **The Global Justice Theorist:** They think *any* bounded demos is unjust. They aren't your target audience; you are theorizing democracy, not global cosmopolitanism. Acknowledge their point but bracket it: "I am theorizing the best version of bounded democracy, assuming boundaries exist."

  ---

  ## Part 3: The Single Reply That Must Land

  **The Issue:** The Meta-Decision Problem.
  **The Reply:** "We must distinguish between the **ontological** and the **normative**. The traditional view treats the *demos* as an ontological fact that must exist *before* politics. I treat the *demos* as a normative claim made *within* politics.
  When a group claims 'we are affected,' they are not stating a scientific fact; they are making a demand for inclusion. The 'circularity' is not a logical error; it is the structure of democratic claim-making. We do not need a pre-political *demos* to validate this claim; we need institutions that are responsive to it. The boundary problem isn't a puzzle to be solved by philosophy; it is a conflict to be managed by democratic practice. My theory provides the metric ('authoritative affectedness') by which those claims are judged, not a machine that automatically produces the right answer."

  *Why this must land:* If you try to prove your method is mechanically circularity-proof, you will fail. You must argue that the circularity is inherent to politics and your theory just gives us the right vocabulary to fight it.

  ---

  ## Part 4: The Question You Hope Nobody Asks

  **The Question:** "You say the *demos* shifts, but who administers the vote? Is there not a residual, persistent sovereign body that decides *when* to apply the decision-relative rule? If so, isn't *that* body the real demos, and haven't you just hidden the boundary problem inside the state's administrative discretion?"

  **Why it's dangerous:** It exposes that your "dissolution" of the boundary problem might rely on a tacit acceptance of the existing state's authority to manage the process. If the State decides who is affected, the State is the pre-political *demos* you claimed to reject.

  **If Asked:** Do not deny the state's role. Argue that the state's authority is *provisional* and subject to the same affectedness test. "Yes, existing institutions administer the vote, but their authority to do so is legitimate *only insofar as* they correctly identify the affected. If they fail, they lose legitimacy. The state is a tool, not the master."
