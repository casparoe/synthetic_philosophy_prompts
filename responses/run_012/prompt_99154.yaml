      *   *Weakness 1 (The "All-Subjected" Attack):* "Affectedness" is too vague. Everything affects everyone (butterfly effect). Coercion provides a bright line.
      *   *Weakness 2 (The "All-Affected" Attack):* If you make it decision-relative, how do you decide *which* decisions count as "collectively binding"? Isn't that prior decision undemocratic? (The "Individuation Problem").
      *   *Weakness 3 (The Kantian/Circularity Attack):* You say you dissolve the circularity, but who determines "authoritative affectedness"? Doesn't that require a prior demos?
      *   *Weakness 4 (The Empirical/Feasibility Attack):* How do you vote? If the demos changes every time, how do you organize elections? Transaction costs are infinite.
      *   *Weakness 5 (The Global Justice Attack):* Why stop at "affected interests"? If borders are arbitrary, why not open borders or global democracy?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Individuation/Agenda Control Problem (Empirical + Theoretical).* This is the classic killer for decision-relative views. Who decides what counts as a "decision"? If the agenda is set by an oligarchy, the demos is rigged.
      *   *Objection 2: The Coercion/Subjected Critique.* Standard line. Affectedness is too broad. Coercion is the specific wrong that demands democracy.
      *   *Objection 3: The Circularity/Constructivist Critique.* You haven't solved the regress. Determining "affectedness" is itself a political decision.
      *   *Objection 4: The Stability/Institutional Critique.* Democracy requires trust and iteration. Fluid demoi destroy political community.

  4.  **Refining the Replies (Matching the User's Voice):**
      *   Need to sound like a peer, not a student. Confident but humble.
      *   *Reply to Individuation:* Concede the point but argue it's a feature, not a bug. It shifts the problem from "boundary" to "agenda," which is more tractable.
      *   *Reply to Coercion:* Argue coercion is a *subset* of affectedness. Why privilege law over other harms (e.g., environmental)?
      *   *Reply to Circularity:* It's not a vicious circle, it's a hermeneutic circle. We iterate.
      *   *Reply to Stability:* Distinguish between "voting demos" and "political community."

  5.  **Categorizing "Real Force" vs. "Field-Defending":**
      *   *Real Force:* Individuation/Agenda Control (feasibility + legitimacy), Circularity (logical coherence).
      *   *Field-Defending:* All-Subjected purists (territorial/coercion bias), Global Justice (rejects the project entirely).

  6.  **Identifying the "Single Reply" and "Forbidden Question":**
      *   *Single Reply:* Must address the *meta-decision* problem. Who decides who is affected? If I say "the current demos," I'm back to square one. If I say "an objective fact," I'm a technocrat. I need to argue this is a *contestable claim* settled democratically *provisionally*.
