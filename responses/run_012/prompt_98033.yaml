  I work on risk-sensitive and distributional reinforcement learning, so I think fluently in terms of policies, return distributions, value functions, quantile and spectral risk measures, and distorted expectations, and I am at ease with the distinction between an objective and a constraint; my grasp of the decision-theoretic literature, however, is only a lay one. Restate for me, in that vocabulary, the position that a rational agent's preferences over gambles are fixed not only by her beliefs about outcomes and her utilities for them but by a third, independent attitude toward risk — one captured by a function that reweights the cumulative probabilities of outcomes taken in rank order, so that the weight any outcome receives depends on its rank and on how much probability lies above or below it, and where the identity reweighting recovers ordinary expected utility. Translate this as faithfully as you can into policies, return distributions, and risk measures, and then give me the residue report: which components map cleanly onto objects I already build, which survive only under distortion (say precisely what bends), and which have no counterpart at all in my vocabulary. I especially want your verdict on the normative parts of the original — the claims about what a rational agent must do and about the uniqueness of her risk attitude — because in my world a risk measure is merely a design choice for an objective, and I suspect that difference is doing more work than the mathematics. Tell me, finally, whether what I lose in translation is a defect of my framework or a sign that the original was less clear than it looked.

