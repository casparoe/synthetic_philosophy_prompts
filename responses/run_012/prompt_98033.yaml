  - `residue_verdict`: string. Whether the residue indicates a defect of the reinforcement-learning vocabulary or a lack of clarity in the original.
  - `normativity_verdict`: string. Your verdict on the normative and uniqueness claims, and whether the gap between "rational requirement" and "design choice" is load-bearing.
