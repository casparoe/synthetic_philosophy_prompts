answer: |-
  My friend says rock must hold the verdict tight,
  I say the ash falls regardless of the name.
  We drive the golden spike into 10000 BCE.
  But the plow cuts shallow where the ice sheets groaned,
  And the signal fades in the pleistocene mud.
  They require a varve, a lake that never mixes,
  A section continuous, undisturbed and open,
  Where anyone might sample the annual dark.
  We drive the golden spike into 1610 CE.
  A body of people authorized to point,
  To vote the beginning into a core of mud,
  To call a chemical shift a human law.
  We drive the golden spike into 1950 CE.
  The ballot says no, the boundary dissolves,
  The commission shakes its head, the protocol holds.
  No single line can hold a scattered flood.
  Yet the heat rises in the unmarked strata.
  The epoch waits, unformalized and vast.
  My friend says rock must hold the verdict tight.
  I say the ash falls regardless of the name.
  The spike lies loose in the hand.
  But the epoch remains, unformalized and vast.

  ***

  **Note on Form and Stratigraphy**

  I took liberties with the timeline of the International Commission on Stratigraphy's decision, compressing years of deliberation into a single ballot cast within the poem's duration. I also simplified the criteria for a Global Boundary Stratotype Section and Point (GSSP); while Crawford Lake's varves were the specific candidate, the poem generalizes the requirement for any "continuous, undisturbed" section to fit the meter.

  Formally, I committed to the contested reading that the Anthropocene is a material reality independent of its ratification by the Subcommission on Quaternary Stratigraphy. The refrain's stability mimics the human desire for a fixed marker, while the changing dates acknowledge the scientific diachrony that ultimately doomed the proposal. Had I believed the dispute was merely verbal—a quarrel over labels rather than matter—I might have chosen an erasure poem, dissolving the text itself. Conversely, if I accepted the stratigraphers' argument that a single global boundary is the wrong instrument for a diachronous phenomenon, I would have abandoned the refrain entirely for a fragmented, polyvocal structure, allowing multiple start dates to stand simultaneously without the tension of a single, failing spike.
