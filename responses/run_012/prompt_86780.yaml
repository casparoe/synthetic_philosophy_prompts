  A bunch of us ended up back at my friend Dev's apartment after his dad's funeral — long story, his dad owned a bunch of buildings and was, let's say, not beloved — and somehow we got into it about whether any of it "comes back around." My roommate kept saying you reap what you sow like it was a settled law of the universe, and then used it to argue we shouldn't feel too bad for people who are suffering, since they must have earned it somehow. Dev said that's just the just-world fallacy with incense, and that the saying only ever meant the ordinary thing: cruelty breeds cruelty, kids of abusive parents become abusive parents, that kind of thing. Then our other friend, who's been reading alot of Buddhist stuff, said they were both flattening it, and that in what she's reading karma isn't really a punishment system at all, it's more like... and then she couldn't finish the sentence, which is basically why I'm asking.

  I have a paper due and I want to nail down what that saying can actually mean as a claim, not just as a mood. Can you lay the readings out as a menu rather than picking one — what kind of thing is doing the reaping (a cosmic accountant keeping books, impersonal causal ripples, my own psychology, other people's reactions to me), over what timescale (this life, many lives, generations, "eventually" with no schedule), and whose harvest it is (mine, my family's, my class's, my country's)? For each reading, say whether it's a trivial platitude, a substantive claim that could be true or false, or something that's actually false, and say what evidence could even bear on it.

  Then the part I actually care about: when someone uses the saying to say a person's misfortune is their own doing and we owe them nothing, which reading is doing the work? I want to be able to point at the exact illicit step — I suspect it's a slide from "your suffering was caused by something you did" to "your suffering is deserved," and then from "deserved" to "I'm permitted to ignore it," but I can't tell if those are three separate claims or one, or whether the first even implies anything about the third.
