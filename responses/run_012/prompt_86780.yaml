answer: |-
  This is a sharp dissection of a conversation that happens often, especially in the shadow of death and inheritance. Your friend Dev and your Buddhist friend are both gesturing toward more sophisticated models than your roommate is using, but your roommate's view is the one that carries moral weight in the moment.

  Here is the menu of readings for "you reap what you sow," broken down by mechanism, timescale, and recipient, followed by an analysis of the moral argument your roommate is making.

  ### Part 1: The Menu of Readings

  | Reading | What is doing the reaping? (Agent) | Timescale | Whose harvest is it? (Recipient) | Status of Claim | Evidence / Falsifiability |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Cosmic Accountant** (Retributive) | A divine entity, the Universe, or Moral Law that tracks credit/debit. | Variable (This life, afterlife, or "eventually"). | The Individual Soul. | **Substantive (Unfalsifiable).** Makes a claim about the structure of reality that cannot be empirically verified. | Theological coherence; anecdotal testimony. Falsified only by the problem of evil (innocent suffering), which adherents explain away via mystery or afterlife balancing. |
  | **2. The Psychological Loop** (Habit) | Neuroplasticity and habit formation. Actions reinforce neural pathways. | Immediate to Lifetime. | The Individual's Character. | **Substantive (True).** Repeated actions calcify into character traits. | Cognitive behavioral psychology; neuroscience of habit. |
  | **3. The Social Echo** (Reciprocity) | Other people reacting to your behavior (reputation, trust, retaliation). | Short to Medium term. | The Individual's Social Standing. | **Substantive (Mostly True).** Game theory shows cooperation breeds cooperation, but luck plays a role. | Sociology; Game Theory (Iterated Prisoner's Dilemma). Falsifiable by instances where bad actors thrive without consequence. |
  | **4. The Generational Ripple** (Systemic) | Family systems, socioeconomic structures, epigenetics. | Generations. | The Family or Lineage (Dev's view). | **Substantive (True).** Trauma and privilege are inherited; abuse cycles are well-documented. | Epidemiology; Intergenerational trauma studies; Sociology. |
  | **5. The Karmic Seed** (Causal/Volitional) | Impersonal causality (*pratītyasamutpāda*). Intention (*cetana*) plants seeds for future capacity. | Trans-life (rebirth) or Moment-to-Moment. | The Continuum of Consciousness (Buddhist friend's view). | **Internal Consistency.** Not a punishment system, but a law of moral causation. | Phenomenological; Scriptural. Not empirically falsifiable, but logically distinct from #1. |
  | **6. The Just-World Heuristic** (Cognitive Bias) | The human brain's desire for pattern and safety. | Immediate. | The Observer's Peace of Mind. | **False (as a claim about reality).** It is a bias, not a law. | Social psychology (Lerner, 1980). Proven false as a description of the world; true as a description of human error. |

  **Notes on the "Status" column:**
  *   **Trivial Platitude:** "Bad choices sometimes lead to bad outcomes." (Tautologically true, offers no explanatory power).
  *   **Substantive:** Makes a specific claim about how the world works that could theoretically be otherwise.
  *   **False:** Contradicted by available evidence (e.g., the existence of innocent suffering contradicts the strong version of Reading #1).

  **The Buddhist Friend's Unfinished Sentence:**
  She likely stopped because the Buddhist definition of *karma* is technically "action" (specifically *intentional* action), not "fate." In that framework, karma isn't a reward/punishment system administered by a judge; it is the causal principle that *intentional actions shape the actor's future capacity to experience reality.* It is Reading #2 expanded metaphysically. It explains why a cruel person becomes incapable of joy (they reap the internal landscape they sowed), not why they got hit by a bus.

  ***

  ### Part 2: Dissecting the Roommate's Argument

  Your roommate is using **Reading #1 (Cosmic Accountant)** filtered through **Reading #6 (Just-World Heuristic)** to justify a moral conclusion.

  You suspected three steps:
  1.  Suffering was caused by something you did.
  2.  Therefore, the suffering is *deserved*.
  3.  Therefore, I am *permitted to ignore it*.

  You are correct. These are three distinct logical leaps, and all three are illicit. Here is the breakdown of the failure points for your paper.

  #### Step 1: The Causal Leap (From Effect to Cause)
  *   **Claim:** "Your suffering exists; therefore, you must have sown the seeds for it."
  *   **The Error:** *Post hoc ergo propter hoc* (After this, therefore because of this) combined with *Epistemic Arrogance*.
  *   **Analysis:** Even if Reading #1 were true (which is unproven), no human observer has access to the "ledger." To look at a specific instance of suffering (e.g., Dev's dad's illness, or a stranger's poverty) and declare it the specific result of specific prior moral failings is a claim to omniscience.
  *   **The Illicit Move:** Conflating *correlation* with *causation*. Bad things happen to bad people sometimes, but they also happen to good people. Assuming the former in every specific case is the **Just-World Fallacy**.

  #### Step 2: The Naturalistic Leap (From Cause to Desert)
  *   **Claim:** "You caused this suffering; therefore, you *deserve* this suffering."
  *   **The Error:** The **Naturalistic Fallacy** (deriving an 'ought' from an 'is').
  *   **Analysis:** This is the strongest point for your paper. Causality is not morality.
      *   *Example:* If I touch a hot stove, I get burned. I *caused* the burn. But it is nonsensical to say I *morally deserved* the burn in a retributive sense. It was a natural consequence, not a moral judgment.
      *   *Example:* If I develop lung cancer after smoking, I contributed to the cause. But "deserving cancer" is a category error. Illness and misfortune are often non-moral natural events.
  *   **The Illicit Move:** Treating the universe as a moral agent. Unless there is a Cosmic Accountant (Reading #1), "cause" does not imply "justice." Even if there *is* a Cosmic Accountant, human beings are not authorized to interpret the verdict.

  #### Step 3: The Jurisdictional Leap (From Desert to Negligence)
  *   **Claim:** "You deserve this suffering; therefore, I owe you no aid."
  *   **The Error:** Confusing **Retributive Justice** with **Distributive/Compassionate Ethics**.
  *   **Analysis:** Even if we grant the previous two steps (that the person caused their suffering and that it is "just" they suffer), it does not follow that *you* are absolved of moral duty.
      *   *Analogy:* A criminal may "deserve" prison (retributive justice). That does not mean they deserve to starve to death in their cell, nor does it mean a bystander is forbidden from giving them water.
      *   *Ethical Frameworks:* In most deontological (duty-based) or care-based ethics, the obligation to alleviate suffering is based on the *capacity to help* and the *presence of suffering*, not the *moral purity of the sufferer*.
  *   **The Illicit Move:** Assigning yourself the role of the Executioner. By withholding aid based on a judgment of "desert," your roommate is not just observing karma; they are actively enforcing it. They are inserting themselves as the agent of the "Cosmic Accountant."

  ### Summary for Your Paper

  The saying "you reap what you sow" functions as a **category ambiguity**.
  *   As **Reading #2, #3, or #4** (Psychological, Social, Generational), it is a useful, substantive heuristic about cause and effect.
  *   As **Reading #1** (Cosmic Retribution), it is a metaphysical claim that cannot be verified.

  Your roommate's argument fails because it treats a **metaphysical speculation** (Reading #1) as an **empirical fact**, uses that "fact" to commit the **naturalistic fallacy** (Step 2), and then claims **jurisdictional authority** (Step 3) to withhold compassion.

  The specific illicit step you are looking for is likely **Step 2**. It is the pivot point where *mechanism* becomes *moral judgment*. Once you establish that "cause $\neq$ desert," the obligation to assist remains intact regardless of the origin of the suffering. Dev was right: it is the Just-World Fallacy with incense. It is a cognitive bias dressed up as spiritual law to protect the observer from the anxiety of randomness.
