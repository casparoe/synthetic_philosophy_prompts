answer: |-
  Subject: Teaching plan for the artifacts and politics section

  Hi there,

  It is great that you are tackling this with engineering students, and since you know the literature well, I will jump straight into the sequencing and strategy. To make both the neutrality thesis and the determinism thesis feel like live options before you introduce the claim that artifacts themselves have politics, you need to walk them through their own intuitive hierarchy of understanding. Start by validating their instrumental view, which is the neutrality thesis, by asking them to describe a hammer or a standard door handle. Let them argue that these things are merely means to ends and that the morality lies entirely with the user. Once they have settled into that comfort zone, pivot to technological determinism by asking how the introduction of the smartphone changed their social relationships regardless of how they intended to use it. This makes determinism feel live because it acknowledges that technology shapes behavior, which engineers often accept as unintended consequences. Only after they have conceded that technology shapes behavior should you drop the political-artifact claim, arguing that some designs do not just shape behavior generally but enforce specific power relations and authority structures inherently. This sequence works because it moves from the familiar to the structural, making the final step feel like a necessary refinement rather than a contradiction of their engineering intuition.

  For the carrying example, you should use the campus library access turnstile rather than the usual bridge or speed bump. For this lesson to work, the turnstile needs to have a physical mechanism that strictly enforces exclusion based on authentication, such as a card swipe that physically locks the bar until credentials are verified. It needs to lack any explicit moral signage or human enforcement at the point of entry, meaning there should be no sign saying only students are allowed or no guard checking IDs manually. This lack is crucial because it forces the students to see that the politics of exclusion are embedded in the machine's operation rather than in a human decision or a written rule. If the turnstile had a guard, they would attribute the politics to the person. If it had a sign but no barrier, they would attribute the politics to the rule. By having the mechanism without the human or the explicit moral command, you isolate the artifact as the agent of the political relation.

  You should anticipate two specific misconceptions and head them off at precise moments in this sequence. The first misconception is that if a technology can be used for good or bad it is neutral, and you must head this off during the initial neutrality phase before you move to determinism. When they suggest the turnstile is neutral because it could theoretically be used to keep dangerous people out or let students in, you need to point out that the artifact does not allow the option of entering without a card regardless of the moral worth of the entrant. The second misconception is that a technology is only political if the designer intended it to be, and you should head this off exactly when you introduce the political-artifact claim. When they argue that the engineers just wanted to protect books, you need to redirect them to the effect of the arrangement rather than the mental state of the designer, emphasizing that the authority is exercised by the machine regardless of intent.

  To see whether they have actually grasped the distinction between an artifact's politics being built into its affordances versus its politics being a downstream social effect, the one question you should ask at the end is what specific social relationship would persist if the turnstile were replaced by a polite sign asking people not to enter without a card. If they understand the distinction, they will recognize that the sign relies on social compliance and downstream effects, whereas the turnstile builds the authority relation into the physical affordance of the barrier itself. Finally, there is one thing you should openly refuse to cover at this level, which is the question of moral responsibility for the engineers who designed the system. If you allow the discussion to drift into whether the engineers are bad people or should be punished, you will lose the ontological point about the artifact itself. Tell them explicitly that you are bracketing the question of blame to focus entirely on the question of where the power is located, because mixing the two will cause them to retreat to the safety of intentionality and miss the structural argument you are trying to make.

  Hope this helps you structure the section, and good luck with the students.

  Best,

  A Colleague
