  **JOINT STATEMENT ON POPULATION AXIOLOGY**
  **Reference:** ICPE-2024-009
  **Undersigned:** Dr. Aris Thorne (Totalist Camp) & Dr. Elena Vaskov (Critical-Level/Person-Affecting Camp)
  **Date:** October 14, 2024
  **Subject:** Findings of Adversarial Collaboration on Welfare Aggregation

  ### PREAMBLE

  Over the past six months, the undersigned have engaged in structured adversarial collaboration regarding the normative ethics of population size and welfare distribution. The goal was not to achieve consensus where none exists, but to map the precise geometry of our disagreement. We acknowledge that population ethics remains a live, unresolved dispute within moral philosophy. There is no academic consensus on the "Repugnant Conclusion," the "Non-Identity Problem," or the correct aggregation function for welfare. This document records where our positions converge, where they diverge, and what empirical or intuitive evidence would be required to shift our views.

  ### I. AREAS OF SUBSTANTIVE AGREEMENT

  We affirm the following claims. These are not definitions, but substantive commitments upon which our models rely.

  1.  **Welfarism:** The value of an outcome is determined exclusively by the welfare levels of the individuals within it. Non-welfare factors (e.g., biodiversity, artistic achievement independent of experience) do not possess intrinsic moral weight, though they may be instrumental to welfare.
  2.  **The Badness of Suffering:** Adding a life with negative welfare (a life not worth living) makes an outcome worse, *ceteris paribus*. There is no scenario where creating a miserable person is a net positive.
  3.  **The Non-Identity Reality:** Policy choices made today determine *which* specific individuals will exist in the future. We agree that this creates a structural problem for harm-based ethics: a person cannot claim they were harmed by a choice that was necessary for their existence, provided their life is worth living.
  4.  **Intuition Fallibility:** Human moral intuitions are evolutionarily calibrated for small-group interaction and are unreliable when scaled to millions or billions of lives. We agree that appeals to "common sense" regarding large numbers are insufficient evidence.
  5.  **Transitivity as a Goal:** We agree that a "better than" relation should ideally be transitive (if A > B and B > C, then A > C). We acknowledge, however, that maintaining transitivity while satisfying other intuitive constraints (like avoiding the Repugnant Conclusion) generates significant formal tension.
  6.  **Uncertainty:** We acknowledge that neither position is currently provable. The choice between our views rests on competing reflective equilibria, not empirical demonstration.

  ### II. STATEMENT OF DISAGREEMENT

  Our disagreement is not regarding the value of a single life, but regarding the **Aggregation Function** used to sum value across populations.

  **The Totalist Position (Thorne):**
  > "The value of a population is the linear sum of individual welfare. A life with positive welfare contributes positive value, regardless of how low that welfare is, provided it is above zero. Quantity can compensate for quality. Therefore, a sufficiently large population of lives barely worth living can outweigh a smaller population of ecstatic lives."

  **The Critical-Level/Person-Affecting Position (Vaskov):**
  > "The value of a population is not a simple sum. There exists a 'Critical Level' of welfare (above zero) that a life must exceed to add positive value to the world. Lives below this threshold, even if worth living for the individual, do not constitute a moral gain. Quality constrains quantity. Therefore, adding vast numbers of low-quality lives cannot outweigh the loss of high-quality lives."

  **Mutual Acknowledgment:**
  Dr. Vaskov acknowledges that Dr. Thorne's view is mathematically consistent and avoids "intransitivity" traps, even if it yields counter-intuitive results. Dr. Thorne acknowledges that Dr. Vaskov's view aligns better with pre-theoretical intuitions about quality of life, even if it requires complex non-linear modeling.

  ### III. CRUXES AND PREDICTIVE CASES

  We have identified two specific cruxes where our theories yield different verdicts. We agree that these cases are decisive for testing our respective commitments.

  | Crux | The Scenario | Totalist Prediction (Thorne) | Critical-Level Prediction (Vaskov) |
  | :--- | :--- | :--- | :--- |
  | **1. The Repugnant Conclusion** | **Choice A:** 1 billion people, all at maximum welfare (10/10).<br>**Choice B:** 100 trillion people, all at minimal positive welfare (0.1/10).<br>*No one suffers in either case.* | **Choice B is Better.**<br>The total sum of welfare in B exceeds A. The sheer number of lives compensates for the low quality. | **Choice A is Better.**<br>The welfare in B is below the Critical Level. Adding these lives adds no positive value (or negligible value), so the higher quality of A dominates. |
  | **2. The Duration Variant** | **Choice A:** 1 billion people, max welfare, 80-year lifespans.<br>**Choice B:** 100 trillion people, minimal positive welfare, **24-hour lifespans.**<br>*The 24-hour lives contain a net positive experience.* | **Choice B is *Still* Better (potentially).**<br>Duration scales value. If the sum of welfare-hours in B exceeds A, B is preferred. A short life of positive value is still a positive unit of value. | **Choice A is *Strictly* Better.**<br>A 24-hour existence does not constitute a "person" capable of holding welfare claims, or falls drastically below the Critical Level regardless of intensity. Duration cannot rescue a life below the threshold of meaningful existence. |
  | **3. The Mere Addition** | **Step 1:** Population A (Happy).<br>**Step 2:** Population A+ (Happy + new group, slightly less happy, no one worse off).<br>**Step 3:** Iterate until Population Z (Vast, barely worth living). | **A+ is better than A.**<br>Adding happy people is always a gain. Iterating this leads logically to Z being better than A. | **A+ is *not necessarily* better than A.**<br>Adding people changes the average or dilutes the moral claim. We deny the premise that mere addition is always a gain. |

  ### IV. SEMANTIC AND CONCEPTUAL DIVERGENCE

  We note that part of our disagreement stems from differing usages of key terms. This is not merely verbal, but reflects different underlying questions.

  1.  **"Better Than":**
      *   **Thorne** uses "Better" to mean *Higher Impersonal Value*. (i.e., "The universe contains more good stuff.")
      *   **Vaskov** uses "Better" to mean *Higher Quality of Existence* or *Better For People*. (i.e., "The civilization is more flourishing.")
      *   *Note:* We agree this is not just semantics. It reflects a fundamental split on whether morality is about "filling the universe with value" or "serving the interests of subjects."

  2.  **"Welfare":**
      *   **Thorne** treats welfare as a continuous variable measurable in "welfare-units" that can be aggregated across time and persons.
      *   **Vaskov** treats welfare as threshold-dependent. Below a certain level of complexity or duration, "welfare" may not be morally salient.

  ### V. OPEN QUESTIONS AND LIVE DISPUTES

  We explicitly flag the following as unresolved within the broader field. Readers should not treat either position in this document as settled science.

  1.  **The Shape of the Value Function:** It is unknown whether value aggregates linearly (Totalism), logarithmically (Diminishing Returns), or with a hard cutoff (Critical Level). There is no empirical test for this.
  2.  **The Status of Potential People:** It is unknown whether non-existent people have a "claim" to be brought into existence. Totalism implies they do (if their lives would be happy). Person-Affecting views imply they do not.
  3.  **Transitivity vs. Intuition:** It is an open question whether we should abandon transitivity to save our intuitions about the Repugnant Conclusion, or abandon the intuitions to save transitivity.

  ### SIGNATURES

  _________________________
  **Dr. Aris Thorne**
  *Lead, Total Welfare Initiative*

  _________________________
  **Dr. Elena Vaskov**
  *Lead, Critical Threshold Project*

  ***

  ### Author Notes for the Novelist (Meta-Commentary)

  **1. Why this works for your book:**
  This document gives your characters a way to be intelligent without being "right." It shows they respect the complexity. The **Duration Variant** in the table is particularly useful for a plot point: if the billionaire tries to implement a "Totalist" policy (e.g., uploading consciousnesses for 10 seconds of bliss to boost stats), Vaskov can point to Section III, Row 2 to say, "We agreed this doesn't count."

  **2. The "Cheating" Fix:**
  You mentioned you keep making one side look right. Notice how in Section I (Agreement), I forced the Totalist to admit intuitions are buggy, and the Non-Totalist to admit their math is complex. In Section III (Cruxes), the Totalist looks cold/calculating, but logically consistent. The Non-Totalist looks humane, but relies on a "threshold" that might seem arbitrary. This balances the reader's sympathy.

  **3. The Duration Question:**
  You asked if duration is a red herring. For the Totalist, it is **not**. If welfare is a sum, time is a multiplier. For the Critical-Level theorist, it **is** often a red herring, because a life that is too short might not meet the criteria for "personhood" or "critical level" regardless of intensity. I have encoded this distinction in Row 2 of the table.

  **4. Semantic Divergence:**
  Section IV is crucial for dialogue. If your characters are arguing past each other, it's likely because one is talking about *Universe Score* (Thorne) and the other is talking about *Civilization Quality* (Vaskov). They aren't just disagreeing on the answer; they are disagreeing on the question.

  **5. Live Dispute:**
  Section V protects you from reader letters. By explicitly stating "It is unknown," you inoculate the text against accusations that you are presenting a philosophical theory as fact.
