prompt: |-
  Ok, novelist here — I'm about two-thirds through a book about a billionare who bankrolls a population-ethics institute, and I've got two characters who are basically the two camps in this fight, and I keep writing them like one of them is obviously right, which is cheating and my editor will smell it.

  So here's what I actually need from you. Take a totalist — the view that we should just maximize total welfare, more happy people is more good, that whole picture — and take the other side, someone who thinks there's a critical level, or a person-affecting constraint, so that adding lives that are only barely worth living isn't automatically a gain. Write me the joint statement those two could actually sign at the end of a real good-faith adversarial collaboration. Not a dialogue, not a debate transcript — an actual document with both their names on it.

  What I want in it:

  A numbered list of claims both can sign — about what's even being aggregated, about whether 'better than' comes out transitive once you start adding people, about the mere addition paradox, about the non-identity problem, whatever is genuinely shared. And no weasel claims, nothing that's true by definition — if it's vacuous I can't use it.

  Then the disagreements, each one phrased the way that side would want it phrased for themselves — the totalist's version of the totalist claim, the other's version of theirs, in framing the other can live with.

  Then the cruxes. I have a hunch one of them is whether a life that's barely worth living counts as a good or merely as not-a-bad, and another is whether the sheer number of people can matter in itself. But you tell me — and for each crux give me a concrete case both sides agree would actually bear on it, plus what each one predicts about that case, written down in advance. Put the cruxes and predictions in a table if that's cleaner. Use this case if it's any help: a choice between a small population of very happy people and an enormous population where everyone is mildly content and no one is ever miserable — then a variant where those extra lives last a single day. Does duration change the verdict for either of them, or is that a red herring?

  And if you think part of their fight is just words — that they mean different things by 'better', or by 'welfare', or that one of them is answering a different question — say which part and why.

  One more thing, and it matters for the book: keep the settled stuff and the contested stuff clearly separate. Don't tell me the repugnant conclusion is refuted, don't tell me totalism is the consensus or that it's been abandoned — tell me what people who actually work on this agree on, and where it's still genuinely open. If some part of this is a live dispute among the people who know it best, I want it flagged as such rather than smoothed into a tidy answer. I'd rather the document admit uncertainty than paper over it, because I will definitely get letters.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book about population ethics (billionaire funding an institute).
      *   **Characters:** Two leads representing opposing camps (Totalism vs. Critical Level/Person-Affecting).
      *   **Problem:** The author keeps making one side look obviously right (bias). Needs a realistic "Joint Statement" resulting from adversarial collaboration.
      *   **Requirements:**
          1.  Numbered list of *agreed* claims (substantive, not vacuous).
          2.  Disagreements section (phrased favorably for each side, but acceptable to the other).
          3.  Cruxes (specific points of divergence, concrete test cases, predictions).
          4.  Address semantic/terminological differences (if any).
          5.  Tone: Academic, good-faith, admitting uncertainty, not smoothing over live disputes.
          6.  Specific Case: Small happy population vs. enormous mildly content population (Repugnant Conclusion territory), including a duration variant.
      *   **Constraint:** Do not declare one side the winner. Acknowledge the field is unsettled.

  2.  **Deconstruct the Philosophy (Population Ethics):**
      *   **Totalism (Classical Utilitarianism in population context):** Value = Sum of welfare. More lives = more value, provided welfare > 0. Leads to the Repugnant Conclusion (RC).
      *   **Critical Level/Person-Affecting:** Value isn't just sum. There's a threshold (Critical Level) below which adding a life adds no value (or negative). Or, we only care about making *existing* people better off (Person-Affecting). Avoids RC.
      *   **Shared Ground:** Both care about welfare. Both agree suffering is bad. Both agree the Non-Identity Problem is tricky. Both agree transitivity is desirable but hard to maintain.
      *   **The Repugnant Conclusion (RC):** For any population of very happy people, there is a larger population of lives barely worth living that is *better*. Totalists accept this (biting the bullet). Non-Totalists reject it.
      *   **Mere Addition Paradox:** Adding happy people shouldn't make things worse, but iterating this leads to RC.
      *   **Non-Identity Problem:** Actions changing *who* is born can't harm those people if their lives are worth living.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. "Joint Statement on Population Axiology." Names (let's invent placeholders or keep it generic? The prompt implies *I* write the document they sign. I'll use placeholders like [Name A] and [Name B] or just "The Undersigned"). Let's go with "The Undersigned Researchers."
      *   **Preamble:** Acknowledge the collaboration, the stakes, and the lack of final resolution.

      *   **Section 1: Areas of Agreement (The Numbered List):**
          *   Need substantive claims.
          *   1. Welfare is the currency (welfarism).
          *   2. Suffering is bad (asymmetry agreement, mostly).
          *   3. Non-Identity is real (changing policies changes who exists).
          *   4. Transitivity is a goal (even if hard).
          *   5. Uncertainty acknowledgment (no consensus).
          *   *Self-Correction:* Avoid vacuous truths like "suffering is bad." Make it specific to population. "Adding a life of negative welfare makes the outcome worse." (Both agree on this). "Adding a life of positive welfare *can* make an outcome better." (Both agree it *can*, just disagree on *must*).
          *   *Refinement:* Let's focus on the structure of the problem.
          *   1. Welfarism: Only welfare matters.
          *   2. Negative Welfare: Adding miserable lives is bad.
          *   3. Non-Identity: Future people's existence depends on current choices.
          *   4. Intuition Fallibility: Our gut reactions to large numbers are unreliable.
          *   5. No Consensus: The field is open.

      *   **Section 2: Statement of Disagreement:**
          *   Need to phrase Totalist view so Non-Totalist doesn't hate it, and vice versa.
          *   Totalist: "Maximizing sum is the primary directive."
          *   Non-Totalist (Critical Level/Person-Affecting): "Quality threshold matters more than quantity."
          *   *Key:* Use "We disagree on the weighting function."

      *   **Section 3: The Cruxes (The Table):**
          *   Crux 1: The Value of Barely Worth Living Lives.
              *   Totalist: Positive value.
              *   Non-Totalist: Zero or negligible value (below critical level).
          *   Crux 2: The Weight of Numbers.
              *   Totalist: Linear aggregation.
              *   Non-Totalist: Diminishing returns or hard cap.
          *   *The Specific Case:* Population A (1 billion, ecstatic) vs. Population Z (100 trillion, barely content).
          *   *Duration Variant:* Does a day of barely worth living life count?
          *   Totalist: Yes, sum is sum.
          *   Non-Totalist: No, below threshold or too short to constitute a "life" of value.
          *   *Wait, check the prompt:* "Does duration change the verdict for either of them?"
              *   Totalist: Duration matters (more time = more welfare sum).
              *   Non-Totalist: Might not matter if the *quality* is below the critical level regardless of duration. Or, duration matters for "personhood" threshold.
              *   *Decision:* Totalist says duration scales value. Non-Totalist says duration doesn't rescue a life below the critical quality threshold.

      *   **Section 4: Semantic/Conceptual Divergence:**
          *   Do they mean different things by "Better"?
          *   Totalist: "Better" = "More impersonal value."
          *   Non-Totalist: "Better" = "Better for someone" or "Higher average quality."
          *   This is crucial for the novelist. It explains *why* they talk past each other.

      *   **Tone Check:**
          *   Is it too dry? It needs to be readable but sound like academics.
          *   Is it too decisive? Must emphasize *uncertainty*.
          *   Did I answer the "duration" question? Yes, need to make sure that's in the table.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Agreement:* Make sure I don't accidentally endorse Totalism in the agreement section. "Adding happy people is good" is the trap. Totalists say it's *always* good. Non-totalists say it's *sometimes* good. Agreement: "Adding happy people is *pro tanto* good" (good in one respect, but maybe overridden). That's a safe philosophical middle ground.
      *   *Disagreement:* Frame it as "Aggregation Function." Totalist = Linear. Non-Totalist = Non-linear/Threshold.
      *   *Cruxes:* The prompt asks for predictions.
          *   Case: 10^9 Happy vs 10^18 Mild.
          *   Totalist Prediction: Mild is better.
          *   Non-Totalist Prediction: Happy is better.
          *   Duration Variant: 1 day of Mild life.
          *   Totalist: Still adds to sum (though less).
          *   Non-Totalist: Definitely doesn't count (below threshold of a "life").
      *   *Semantic:* The word "Existence." Totalist sees existence as a container for value. Non-Totalist sees existence as a precondition for value claims.

  5.  **Final Polish:**
      *   Ensure the formatting is clean (Markdown).
      *   Check against the "no weasel claims" rule.
      *   Ensure the "live dispute" flag is prominent.
      *   Make sure the duration question is explicitly answered in the table.

  6.  **Writing the Document:** (Mental Draft)
      *   Title: Joint Statement on Population Axiology.
      *   Intro: We collaborated for 6 months. We didn't solve it. Here is the map.
      *   Part I: Consensus. (Welfarism, Negative welfare is bad, Non-identity is real, Intuitions are buggy).
      *   Part II: Divergence. (The Aggregation Function).
      *   Part III: Cruxes Table. (The Repugnant Conclusion case, The Duration case).
      *   Part IV: Terminology. (Impersonal vs. Person-Affecting).
      *   Signatures.

  7.  **Final Review against constraints:**
      *   "Novelist here": Keep it usable for fiction (clear conflict points).
      *   "No weasel claims": Ensure the agreements are actually committing.
      *   "Duration": Address specifically.
      *   "Live dispute": Emphasize that experts don't know the answer.

      *(Self-Correction on Duration)*: A totalist *must* care about duration because welfare is usually defined over time. A critical level theorist might argue a 1-day life doesn't meet the "person" threshold or the "critical level" of lifetime welfare. I need to make sure this distinction is sharp.

      *(Self-Correction on "Better")*: The prompt asks if they mean different things by 'better'. Yes. One means "more value in the universe," the other means "better for the people involved" or "higher quality of civilization." I should highlight this.

      *(Final check on Agreements)*: "Transitivity." Both *want* it, but both admit it might break. I should phrase it as "We agree transitivity is a theoretical virtue, but acknowledge tension." That's honest.

      Let's assemble.
