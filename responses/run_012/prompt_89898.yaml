answer: |-
  # Q&A Prep Sheet: Grice, Intention, and Implicature

  **Strategy Overview**
  *   **Concede Up Front:** You are not doing exegesis. You are attacking "Gricean Orthodoxy" (the standard model used by semanticists), not necessarily Paul Grice's actual nuanced views. If the Historian corners you on what Grice *actually* wrote in *WPR* or *LPA*, yield immediately. It costs you nothing.
  *   **Hold the Line:** The psychological claim. Your core thesis is that hearers do not *token-level reconstruct* reflexive intentions for GCIs/short-circuited cases. Do not let them talk you into "implicit intention." Either the intention is represented or it isn't.
  *   **Fatal vs. Answerable:**
      *   **Answerable:** The Historian's exegetical points and the Semanticist's claim that this is just "Levinson's Heuristics" rebranded. You can argue your norm-based account is cognitively distinct from Levinson's rationality-based defaults.
      *   **Fatal:** The Relevance Theorist's challenge on the *nature of communication* and the "Hope Nobody Asks" question on cancellability. If you cannot explain how a norm-based implicature remains *cancellable* (the hallmark of implicature) without invoking speaker intention, your distinction between implicature and entailment collapses.

  ---

  ## 1. The Formal Semanticist (High Damage / High Probability)
  **The Objection:**
  "You're reinventing the wheel and calling it a critique. What you're describing as 'standing norms' is exactly what Levinson calls 'Generalized Conversational Implicatures' derived by Q- and I-heuristics. Levinson already argued these are default inferences that don't require a full Gricean calculation in every token. If you're just saying processing is faster than Grice thought, you haven't shown that intention isn't the *ground* of the norm. The norm exists *because* of the rational intentions of the community. You haven't split speaker meaning from implicature; you've just described the sedimentation of intention."

  **Your Two-Minute Reply:**
  "Levinson's heuristics are still grounded in rationality assumptions about what a speaker *would* intend. My claim is stronger: for short-circuited cases, the hearer accesses the content via a linguistic norm directly, similar to decoding, without representing the speaker's mental state at all. Levinson keeps the Gricean engine but puts it on autopilot; I'm arguing the engine is disconnected for these cases. The difference matters for embedding and projection. If it's intention-based, it should project differently than if it's a standing linguistic norm. My proposal predicts that GCIs behave more like presuppositions in certain downward-entailing contexts because they are norm-licensed, not intention-calculated. I'm not just speeding up the processing; I'm changing the type of content recovered."

  **Weakness of Reply:**
  You need empirical data on projection/embedding to back this up. If you don't have a concrete semantic test case where your view diverges from Levinson's, this is just hand-waving about "cognitive mechanisms."

  ## 2. The Relevance Theorist (High Damage / Medium Probability)
  **The Objection:**
  "You've thrown the baby out with the bathwater. Relevance Theory agrees that Gricean maxims are too cumbersome, but we maintain that *ostensive-inferential communication* requires the recognition of an informative intention. If the hearer doesn't recognize that the speaker *intends* to convey $p$, then $p$ isn't an implicature; it's just a semantic feature or a code. By removing intention from the recovery process, you can't distinguish between a conversational implicature and a coded signal. Communication is defined by intention-recognition. If you remove that, you're no longer doing pragmatics; you're doing semantics."

  **Your Two-Minute Reply:**
  "I agree that *communication* broadly requires intention, but I'm distinguishing between the act of communicating and the specific mechanism of *implicature recovery*. The speaker certainly intends to convey the content (otherwise it's not communication), but the hearer need not represent that intention to recover the content. Think of it like traffic lights: I intend to stop you, but you don't need to model my intention to know you must stop; you follow the norm. Similarly, for 'some,' the hearer retrieves 'not all' via a standing convention. The intention guarantees the *point* of the utterance, but the norm licenses the *content*. This explains why these implicatures are so fast and robust compared to particularized ones."

  **Weakness of Reply:**
  The traffic light analogy is dangerous. Traffic lights are codes/conventions. If you lean too hard on this, you concede their point: that you've turned implicature into semantics. You must insist the norm is *pragmatic* (defeasible) without relying on intention to explain the defeasibility.

  ## 3. The Historian of Philosophy (Low Damage / High Probability)
  **The Objection:**
  "Grice never claimed that every instance of implicature requires a conscious, step-by-step reconstruction of reflexive intentions. In 'Logic and Conversation,' he allows for 'standardization.' In 'Meaning,' he distinguishes between the complex intention and the habitual application. You're attacking a caricature of Grice that the semanticists built, not the Grice of the 1957 and 1967 papers. Grice would likely agree that short-circuited implicatures are habitualized intentions, not intention-less norms."

  **Your Two-Minute Reply:**
  "I concede that point entirely. I am not doing intellectual history; I am critiquing the 'Gricean Orthodoxy' that dominates current formal semantics. The standard model taught in our graduate courses treats implicature as a defeasible inference derived from the assumption of cooperative intentionality in every token. Whether Grice himself allowed for habitualization is less important than the fact that the current framework treats these inferences as intention-dependent. My goal is to fix the current theoretical machinery, even if that means correcting a reading of Grice that has become standard practice."

  **Weakness of Reply:**
  None, provided you say it confidently. This is a pure concession that protects your theoretical flank.

  ---

  ## The "Hope Nobody Asks" Question (Fatal)
  **The Question:**
  "You claim these norms are pragmatic, not semantic, because they are cancellable. But if the hearer isn't checking the speaker's intention, what mechanism allows for cancellability? If 'some' triggers 'not all' via a standing norm like a code, and you don't check intention, how do you stop the inference when the speaker says 'some, in fact all'? If intention isn't part of the recovery, it can't be part of the cancellation. So, aren't you just redefining these as entailments?"

  **Why This Is Fatal:**
  This strikes at the definition of implicature. Cancellability is the primary diagnostic for implicature. Grice explains cancellability via intention (the speaker explicitly overrides the inferred intention). If you remove intention from the recovery mechanism, you lose the lever that allows the hearer to cancel the inference. If you can't explain cancellability without reintroducing intention, your "split" collapses, and you're left with semantics.

  **Prepared Reply (Damage Control):**
  "That is the central challenge of the project. My hypothesis is that cancellability works via a 'norm-conflict' detection rather than an 'intention-conflict' detection. When a speaker cancels, they trigger a higher-order norm of explicitness that overrides the default norm. However, I admit this is the weakest part of the current draft. I am currently working on a model where the 'norm' is not rigid like semantics but is a probabilistic constraint that can be overridden by explicit markers without requiring full mind-reading. If I can't make that work, I agree the distinction fails."

  **Advice:**
  If this question is asked, **do not bluff.** Admit this is the working edge of the paper. It shows you understand the stakes. If you try to fake a solution, the Relevance Theorist and Semanticist will both smell blood and dismantle you. Concede the difficulty, but frame it as the *next* step of the research.

  ---

  ## Final Commitment Advice
  1.  **Do not fight the Historian.** It wastes time and makes you look insecure. Let them have Grice; you want the theory.
  2.  **Fight the Semanticist on Mechanism.** Insist that "default inference" (Levinson) is still a rational calculation, whereas your "norm" is a direct retrieval. This is your only path to a novel contribution.
  3.  **Survive the Relevance Theorist.** Do not let them convince you that intention is *necessary for recovery*. Hold that intention is necessary for the *act*, but not the *algorithm*.
  4.  **Fear the Cancellability Question.** If they ask it, they have read your paper carefully. Pivot to "probabilistic norms" and admit it's work in progress.

  **Good luck. You're arguing for a paradigm shift in how we model the semantics-pragmatics interface; expect friction.**
