      *   *Answerable:* The Relevance point. I can argue that "norms" are a proxy for intention without requiring token-level mind-reading.

      *Decision:* I need to tell the user to hold the line on the *psychological reality* of intention reconstruction (the core thesis) but concede on the *historical* reading of Grice. The fatal risk is the "coding vs. communicating" distinction.

