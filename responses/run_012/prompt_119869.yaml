      *   *Anti-Humean View:* The model $M$ exists *before* $D$. $M$ generates $D$. $M$ has a status independent of $D$. If $D$ were different, $M$ might still exist (as a potential generator), but $D$ wouldn't be the actual world. There is a "generator" object distinct from the "output."

