  2.  **Deconstruct the Philosophical Positions:**
      *   **Humean Supervenience (Best System Account - BSA):** Laws are summaries of the "Humean Mosaic" (the total history of particular matters of fact). There is no modal force. Necessity is psychological or pragmatic. (Lewis, Mill, Ramsey).
      *   **Anti-Humeanism (Governing Laws):** Laws are ontologically distinct from the events. They explain *why* the events happen. They have modal force (could not have been otherwise, given the laws). (Armstrong, Dretske, Tooley).

  3.  **Translate to Physics/Statistics Language:**
