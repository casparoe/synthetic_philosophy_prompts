          *   *Weber Fit:* Medium. The "calling" concept is necessary, but does it explain the *change*?

      *   *(6) Expectations/Common Knowledge:* Reflexive expectations. I do $X$ because I think you think $V$.
          *   *Pros:* Robust social mechanism.
          *   *Cons:* Content of $V$ is idle. It's about belief *that* others believe, not the truth of $V$. Risks reducing value to mere signal.
          *   *Weber Fit:* Low. Weber cares about the *truth* of the conviction for the actor, not just strategic coordination.

