  2.  **Evaluate the Candidates (Philosophical Analysis):**

      *   *Goal:* We want "Genuine Causation." In social science philosophy, this usually means avoiding tautology (values are just labels for behavior) and establishing counterfactual dependence (if the value weren't there, the outcome wouldn't be there, *independently* of the outcome defining the value).

      *   *(1) Internalization:* This is the standard intentionalist account. Agents hold value $V$, $V$ motivates action $A$.
          *   *Pros:* Intuitively causal (mental states cause actions).
          *   *Cons:* High risk of circularity. How do we know they hold $V$? Because they do $A$. If $V$ is defined solely by $A$, it's not a cause. Needs independent evidence of the mental state.
          *   *Weber Fit:* High. Weber talks about "convictions" driving conduct.

      *   *(2) Selection:* Evolutionary/cultural evolution model. Values don't motivate; practices compatible with values survive.
          *   *Pros:* Avoids psychological black box. Clear causal mechanism (differential survival).
          *   *Cons:* Risks functionalism. Did the value *cause* the survival, or is the value just a tag for the successful practice?
          *   *Weber Fit:* Low/Medium. Weber emphasizes *meaning* and *motivation*, not blind variation/selection.

      *   *(3) Equilibrium Selection:* Game theoretic. Multiple Nash equilibria exist; culture coordinates on one.
          *   *Pros:* Clear causal role (focal point).
          *   *Cons:* The *content* of the value might be irrelevant; only the coordination matters. Is the *value* causing it, or the *expectation*?
          *   *Weber Fit:* Low. Weber isn't describing a coordination game; he's describing a transformation of ethos.

      *   *(4) Constitution:* Wittgensteinian/Interpretivist. Value constitutes the meaning of the act.
          *   *Pros:* Solves the "meaning" problem.
