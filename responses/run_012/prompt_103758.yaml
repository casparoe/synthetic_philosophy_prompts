          *   *Weber Fit:* Medium (interpretive sociology), but fails the "cause" criterion.

      *   *(5) Semantic Scaffolding:* Conceptual precondition. Can't intend $X$ without concept $C$.
          *   *Pros:* Strong necessity claim.
