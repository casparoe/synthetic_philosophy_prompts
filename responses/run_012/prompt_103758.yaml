      *(Self-Correction during drafting)*: Wait, if the prompt asks to rank by how well they vindicate the claim that value is a *genuine cause*, Constitution fails immediately because it says it's *not* a cause. So Constitution must be at the bottom. Scaffolding is similar (precondition $\neq$ cause).
