answer: |-
  Here is a ranking of the six mechanisms into three tiers, organized by their capacity to vindicate values as *efficient causes* rather than as correlates or conditions of possibility. I have flagged the divergence between a general social-scientific theory and the specific demands of the Weberian case within each tier.

  ### Tier 1: Robust Efficient Causation
  *These mechanisms posit a clear counterfactual dependence where the presence of the value makes a difference to the outcome.*

  **1. Internalization**
  *   **Explanatory Condition:** Individuals must possess independent psychological evidence of the value (e.g., diaries, sermons) prior to the economic conduct, showing the value motivated the act as a reason.
  *   **Circularity Risk:** It collapses if the only evidence for the "conviction" is the economic conduct itself, rendering the value a post-hoc rationalization of behavior.
  *   **Weber vs. General:** This is the **top rank for the Weber case**, as Weber requires the *content* of the belief to drive the action; however, for a **general theory**, it is often demoted due to the difficulty of measuring mental states across populations compared to behavioral selection.

  **2. Selection**
  *   **Explanatory Condition:** Groups holding the value must out-survive or out-reproduce groups without it, regardless of whether individuals consciously act on the value as a reason.
  *   **Circularity Risk:** It collapses into functionalism if the "value" is merely a label we attach to whatever practice happened to survive, rather than a transmitted trait that caused the survival.
  *   **Weber vs. General:** This is the **top rank for a general theory** of cultural evolution (avoiding psychological black boxes), but it fails the **Weber case** because Weber explicitly rejects blind selection in favor of meaningful, intentional action (*Verstehen*).

  ### Tier 2: Coordinating Causation
  *These mechanisms treat values as causal, but the specific moral content of the value is less important than its role in solving coordination problems.*

  **3. Expectations (Common Knowledge)**
  *   **Explanatory Condition:** The outcome must depend on the recursive belief that others hold the value, such that violating the value incurs a sanction regardless of the violator's private conviction.
  *   **Circularity Risk:** It collapses if the "expectation" is inferred solely from the stability of the norm, making the value a description of equilibrium rather than its driver.
  *   **Weber vs. General:** This works well for **general institutional theory**, but for **Weber**, it is insufficient because it renders the *religious truth* of the conviction idle; Weber needs the theology to matter, not just the social pressure.

  **4. Equilibrium Selection**
  *   **Explanatory Condition:** There must be multiple stable social arrangements possible, with the value acting as a focal point that selects one without necessarily creating the incentives for the arrangement itself.
  *   **Circularity Risk:** It collapses if the "focal point" is identified only by looking at which equilibrium was selected, offering no independent account of why *this* value became focal.
  *   **Weber vs. General:** This is a strong **general mechanism** for path dependence, but for **Weber**, it is too thin; it explains why *a* rational ethic emerged, but not why *this specific* ascetic ethic emerged over others.

  ### Tier 3: Constitutive and Preconditional
  *These mechanisms arguably deny that values are "causes" in the efficient sense, framing them instead as background conditions or definitions.*

  **5. Semantic Scaffolding**
  *   **Explanatory Condition:** Agents must be unable to formulate the intention to act (e.g., "invest for profit") without first possessing the cultural concept (e.g., "calling").
  *   **Circularity Risk:** It collapses if the possession of the concept is inferred from the ability to perform the action, making the concept a redescription of the capacity rather than its source.
  *   **Weber vs. General:** This is vital for **Weberian interpretation** (making the action intelligible), but it ranks low for **causation** in both cases because preconditions are not difference-makers (having a language doesn't cause a specific speech act).

  **6. Constitution**
  *   **Explanatory Condition:** The value must define the identity of the action itself (e.g., "this counts as saving"), such that asking if the value caused the action is a category mistake.
  *   **Circularity Risk:** It inherently accepts the circularity worry as a feature, not a bug, by arguing that values and actions are internally related rather than externally linked.
  *   **Weber vs. General:** This is the **lowest rank for causation** in both contexts because it explicitly rejects the causal framing; however, it is often the preferred reading for **Weber scholars** who view his work as interpretive sociology rather than causal hypothesis-testing.

  ### Summary of the Divergence
  Your suspicion is correct: the disagreement in your seminar likely stems from a clash between **Tier 1 (Internalization)** and **Tier 1 (Selection)**. If your seminar prioritizes the *Weber case*, **Internalization** must win, because Weber's thesis is that specific *ideas* (not just successful practices) drove history. If your seminar prioritizes a *general theory of social science*, **Selection** often wins, because it offers a causal mechanism that does not rely on the methodological individualism and psychological access required by Internalization. The lower tiers generally fail to vindicate "causation" robustly enough for either project, serving better as accounts of meaning or stability.
