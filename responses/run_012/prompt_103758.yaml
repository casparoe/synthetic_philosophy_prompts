          *   *Nuance:* I must explicitly state that Internalization jumps to #1 for Weber, while Selection might be #1 for General Theory.

  5.  **Drafting the Content (incorporating constraints):**
      *   *Constraint Check:* "Sentence or two" for conditions and risks. "Flag where ranking shifts."
