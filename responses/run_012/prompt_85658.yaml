  The setup:
  - Two agents, A and B. Neither can observe the other, and neither can influence the other causally in any way. Both know this.
  - Both are running "the same" decision procedure in a loose sense — not identical code, but similar enough that each can simulate the other pretty well, and both know that. Call how similar they are the mirroring level: 0 = total strangers, 1 = literally the same program.
  - Each picks C or D, simultaneously and independently. One-shot, no repeats. Payoffs: both C = 3 each; both D = 1 each; one plays D and the other C = 5 to the defector and 0 to the cooperator.
  - A's code can't see B's actual move, but A can run a simulation of B (which will include a simulation of A, and so on) and condition on the output of that.
  - A has one extra option B doesn't have: an action P. P is a punishing version of D — treat it as D for the base game, then A pays 2 on top and B pays 4 on top. So if A plays P and B plays D, A gets 1 - 2 = -1 and B gets 1 - 4 = -3, before any of the routine below.
  - Before play, either agent may run a "commitment routine" that rewrites its own utility function by adding an extra term. A "surrogate goal" is my name for the result: a goal the agent wasn't born with, adopted only because having it makes some threat of its believable. Specifically A can add the term "+6 to A if A plays P and B played D".
  - Nobody can lie about whether they ran the routine: it's in the code, and the code is readable/simulatable by the other side.

  What I want the question to force them to do:
  (a) Show that A's routine can raise A's payoff above the no-routine baseline, and say precisely what has to hold about the mirroring level for the threat to bite at all.
  (b) Find the regimes where the routine strictly hurts A. I've got a hunch there's more than one — I think there's a false-alarm one and something about A ending up with an incentive to make B defect — but see what else you find, and say what happens at mirroring around 1 and around 0.
  (c) The part I care most about: declaring a threat like this is free, so A is potentially facing a whole crowd of acausal extortionists, most of whom are bluffing. What should A's policy be about them, and what does that policy cost A in the cases where a threat is actually real?

