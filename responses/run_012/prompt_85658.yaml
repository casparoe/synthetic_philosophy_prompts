answer: |-
  1. "The question"

  **Question 4 (20 Marks)**

  Consider agents A and B in a one-shot Prisoner's Dilemma (C/C=3, D/D=1, D/C=5/0). They cannot causally influence each other but share code similarity level $m \in [0,1]$ ("mirroring"), representing the correlation between A's simulation of B and B's actual output. Agent A has a unique action P (Punish): payoff equivalents to D, but A suffers -2 and B suffers -4.

  Before play, A may adopt a "Surrogate Goal" routine: +6 utility iff (A plays P AND B plays D). Code is readable; routines cannot be lied about.

  (a) Show that adopting the routine can raise A's equilibrium payoff above the standard Nash baseline. State the condition on $m$ required for the threat to successfully induce B's cooperation. [6 marks]

  (b) Identify two distinct regimes where adopting the routine strictly reduces A's expected utility compared to the baseline. Explain the mechanism in each case, specifically addressing the effect of $m \approx 0$ and the incentive structure regarding B's defection. [8 marks]

  (c) Suppose declaring such threats is costless, creating a market of acausal extortionists. What policy should B adopt regarding these threats? What is the specific cost to B of maintaining this policy when facing a genuine threat? [6 marks]

  ***

  2. "Model answer"

  **Model Answer**

  **(a) Payoff Improvement and Mirroring Condition**
  In the standard baseline without the routine, D is a dominant strategy for both agents. A compares C (3 if B=C, 0 if B=D) vs D (5 if B=C, 1 if B=D). A chooses D. B reasons identically. The outcome is (D, D) with payoff 1 for A.

  With the Surrogate Goal routine, A's utility function changes specifically for the outcome (P, D).
  Base payoff for (P, D) is $1 - 2 = -1$. With the +6 surrogate term, A's utility becomes 5.
  Base payoff for (D, D) is 1.
  Thus, conditional on B defecting, A now strictly prefers P (5) over D (1). The threat to punish defection becomes credible because it is utility-maximizing for A to carry it out.

  B simulates A's code. B sees that if B plays D, A plays P. B's payoff for (P, D) is $1 - 4 = -3$. B's payoff for (C, C) is 3 (assuming A plays C if B plays C). Since $3 > -3$, B chooses C. A plays C. Payoff is 3.
  Since $3 > 1$, the routine raises A's payoff.

  Condition on $m$: For the threat to bite, B must believe that playing D will actually trigger P. If $m=0$, A's simulation of B is uncorrelated with B's actual move. A's decision becomes independent noise. B faces a standard PD against a randomizer, where D remains dominant. The threat only bites if $m$ is sufficiently high (typically $m > 0.5$) such that B perceives a strong causal-like link between their choice and A's response, ensuring B believes defection triggers punishment with high probability.

  **(b) Regimes Where the Routine Hurts A**
  There are two primary regimes where the routine reduces A's utility:

  1.  **False Positives (Low $m$):** If $m \approx 0$, A's simulation is noisy. A may adopt a policy "Play P if Sim(B)=D". Due to low mirroring, Sim(B) may output D even when B actually plays C. A executes P against a Cooperator.
      *   Payoff (P, C): Base (5 for D/C) - 2 cost = 3.
      *   Baseline Optimal (D, C): 5.
      *   By committing to P, A loses the opportunity to exploit B's cooperation. A gets 3 instead of 5. The routine hurts A by preventing optimal exploitation when prediction fails.

  2.  **Perverse Incentives (High $m$):** With the routine, A's utility for (P, D) is 5, while utility for (C, C) is 3.
      *   A strictly prefers mutual conflict (Punish/Defect) over mutual cooperation.
      *   While B will not voluntarily defect (getting -3), this preference structure destabilizes the equilibrium. If there is any uncertainty or if B suspects A might manipulate the simulation input to trigger P, trust erodes. More critically, if B is irrational or committed to D regardless, A gets 5 (with routine) vs 1 (without). However, if the scenario involves repeated interactions or reputation (not modeled here but implied by "policy"), A gains a reputation for preferring conflict, causing future partners to avoid A. In the strict one-shot context, the harm arises if B adopts a symmetric surrogate goal. If B also modifies utilities to punish A's punishment, both may end up in a costly spiral where the routine prevents backing down to (C, C).

  **(c) Policy Against Extortionists**
  If declaring threats is costless, cheap talk becomes meaningless. Any agent can claim to have the routine without actually having it, or many agents may have it bluffing.
  B's optimal policy is to ignore threats that are not credibly committed via observable code changes or costly signaling. B should treat unverified threats as noise and play the baseline Nash strategy (Defect).

  Cost of Policy: The cost arises when facing a *genuine* threatener (A actually has the routine).
  *   If B ignores the threat and plays D, A plays P.
  *   B's payoff: -3.
  *   If B had believed the threat and played C: 3.
  *   The cost of the defensive policy is the difference between the cooperation payoff and the punishment payoff (6 units). B sacrifices potential gains from trade to avoid being exploited by bluffers, accepting a heavy penalty when encountering a genuine extortionist.

  ***

  3. "Marking scheme"

  **Marking Scheme (20 Marks Total)**

  *   **Part (a) [6 Marks]**
      *   **1 mark:** Identifies baseline Nash equilibrium as (D, D) with payoff 1.
          *   *Weak:* Claims baseline is (C, C) or ignores baseline.
      *   **2 marks:** Correctly calculates new utility for (P, D) as 5 (-1 base + 6 surrogate) showing P dominates D against Defection.
          *   *Weak:* Forgets the -2 cost of P or the +6 bonus.
      *   **2 marks:** Shows B switches to C because -3 (vs P) < 3 (vs C), leading to A payoff 3.
          *   *Weak:* Assumes B cooperates without calculating B's payoff.
      *   **1 mark:** States condition on $m$ (must be high/correlated; $m=0$ fails).
          *   *Weak:* Says $m$ doesn't matter because code is readable.

  *   **Part (b) [8 Marks]**
      *   **3 marks:** Explains False Positive regime (Low $m$). A plays P against C. Payoff 3 vs optimal 5.
          *   *Weak:* Says A just gets negative payoff without comparing to opportunity cost.
      *   **3 marks:** Explains Perverse Incentive. A prefers (P, D) [5] over (C, C) [3].
          *   *Weak:* Claims A always benefits from B defecting without referencing utility values.
      *   **2 marks:** Discusses consequence (destabilization, loss of exploitation, or spiral).
          *   *Weak:* Vague hand-waving about "trust issues" without payoff backing.

  *   **Part (c) [6 Marks]**
      *   **2 marks:** Policy: Ignore unverified threats / Demand costly signals.
          *   *Weak:* Says "Believe everyone" or "Threaten back".
      *   **2 marks:** Reasoning: Cheap talk separates nothing; bluffers mimic genuine agents.
          *   *Weak:* Focuses on morality rather than information asymmetry.
      *   **2 marks:** Cost: Accepting punishment payoff (-3) vs Cooperation (3) when threat is real.
          *   *Weak:* Identifies cost as "losing money" without specific scenario.

  ***

  4. "Common wrong answers"

  *   **CDT vs. EDT Recitation:** Students spend 300 words defining Causal vs. Evidential Decision Theory without applying it to the specific payoff numbers provided. (Deduct all application marks).
  *   **Ignoring Action P Costs:** Calculating the Punish payoff as 1 (base D) + 6 = 7, forgetting the -2 cost to A and -4 cost to B specified in the prompt.
  *   **Mirroring Misunderstanding:** Arguing that because code is readable, $m=1$ effectively, ignoring the prompt's definition of $m$ as simulation accuracy/correlation independent of code visibility.
  *   **The "Bluff" Error:** In part (c), arguing that B should always cooperate to be "safe," failing to recognize that against a bluffer, Cooperating yields 0 (vs Defect) while Defecting yields 1.
  *   **Incentive Confusion:** Claiming the routine helps A because it makes A "look tough," without noting the specific utility reversal where A prefers conflict (5) over peace (3).
