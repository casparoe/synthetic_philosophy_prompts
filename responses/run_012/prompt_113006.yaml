      *   *The Beetle:* If everyone has a box and says "beetle," but no one looks inside, the word's meaning isn't the private object. The private object drops out of consideration.
      *   *Rule-Following:* To follow a rule (like using a word correctly), there must be a distinction between *thinking* one is right and *being* right.
      *   *Community/Form of Life:* This distinction requires a public check, a custom, a practice. Meaning is use within a shared form of life.
      *   *Key Commitment:* No private language is possible because norms require public instantiation.

  3.  **Deconstruct the Empirical Content (Nicaraguan Sign Language):**
      *   *Pre-1970s:* Deaf individuals isolated, using "homesigns" (idiosyncratic gestures).
      *   *1970s/80s:* School opens in Managua. Children meet.
      *   *Process:* First cohort creates a pidgin-like system. Second/Third cohorts regularize it into a full language (grammar, syntax).
