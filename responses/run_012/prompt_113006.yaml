  *(Self-Correction Note on "Community"):* I need to be careful not to conflate "community" with "language users." For Wittgenstein, the community establishes the *norm*. In NSL, the norm emerges *from* the community's interaction. The chicken-and-egg problem is real. I will frame this as a tension between "static normativity" (Wittgenstein's focus) and "dynamic emergence" (NSL's reality).

