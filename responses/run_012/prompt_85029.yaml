answer: |-
  This request addresses the core tension in the "Heuristic Estimator" research program (associated with MIRI, Paul Christiano, and Marcello Herreshoff, circa 2013–2016). The goal is to formalize the informal mathematics of conjectures (like the Prime Number Theorem or the Twin Prime Conjecture) where reasoners assign probabilities to unproven statements based on structural heuristics rather than deductive proof.

  Here are the desiderata sorted into your four requested groups, followed by the critical analysis of their viability and tensions.

  ### I. The Desiderata

  #### 1. Cases It Must Get Right (The Positive Extension)
  These are the standard applications of the presumption of independence that any formalization must reproduce to be considered useful.
  *   **The Digits of $\pi$:** Given no computational premises, the estimator must assign probability $0.1$ to the claim "the $n$-th digit of $\pi$ is $d$."
      *   *Consideration:* This captures the "principle of indifference" over a deterministic but computationally opaque sequence.
  *   **Primality Heuristics:** For a large number $N$ with no known factors, the estimator must assign probability $\approx 1/\ln N$ to "$N$ is prime."
      *   *Consideration:* This reproduces the Cramér model and standard number-theoretic reasoning where divisibility by distinct primes is treated as independent events.
  *   **Linearity of Expectation:** For any two quantities $X$ and $Y$, $\mathbb{E}[X + Y] = \mathbb{E}[X] + \mathbb{E}[Y]$, even if the correlation between $X$ and $Y$ is unknown.
      *   *Consideration:* This is the bedrock of estimation; without it, the estimator cannot aggregate local guesses into global predictions.
  *   **Product Rule on Silence:** If premises $P$ imply nothing about the correlation between $A$ and $B$, then $P(A \land B | P) \approx P(A|P)P(B|P)$.
      *   *Consideration:* This formalizes the core "presumption of independence" move.

  #### 2. Spurious Arguments It Must Reject (The Negative Extension)
  These are the failure modes where naive application of the presumption leads to contradiction, gaming, or paradox.
  *   **Proof by Ignorance:** The estimator must not assign probability $0.5$ to a statement $S$ simply because it hasn't found a proof of $S$ or $\neg S$, if $S$ is actually a logical tautology (or easily derivable from premises).
      *   *Consideration:* The estimator must respect deductive closure eventually; ignorance is not a truth value.
  *   **Diagonalization/Self-Reference:** The estimator must not be exploitable by statements that reference the estimator's own output (e.g., "This statement is true iff the estimator assigns it probability $< 0.5$").
      *   *Consideration:* To avoid Löbian paradoxes and Dutch books, the system cannot be a fixed point for its own error term.
  *   **Correlation from Common Causes:** The estimator must not treat $A$ and $B$ as independent if the premises imply a common cause $C$, even if $C$ is not explicitly computed.
      *   *Consideration:* Prevents the estimator from ignoring structural dependencies hidden in the premises.
  *   **Gaming the Error Term:** An adversary must not be able to construct a sequence of questions such that the estimator's cumulative error grows unbounded relative to a competent reasoner.
      *   *Consideration:* Ensures the estimator is "calibrated" and not systematically biased in exploitable ways.

  #### 3. Distinctions It Must Respect (Conceptual Boundaries)
  These are ontological or epistemological distinctions that the formalism must not blur.
  *   **Proof vs. Estimate:** The output $0.99$ is not the same as a proof. The system must distinguish between "probability 1 because proved" and "probability 1 because heuristic confidence is maximal."
      *   *Consideration:* Collapsing this distinction eliminates the value of the estimator; it becomes a theorem prover.
  *   **Output vs. Probability:** The real number returned is an *estimate of truth*, not necessarily a *degree of belief* that satisfies all Kolmogorov axioms (e.g., it might violate $P(A) + P(\neg A) = 1$ in intermediate states).
      *   *Consideration:* Enforcing full probabilistic coherence too early forces the system to solve hard logical problems to maintain consistency.
  *   **Silence vs. Symmetry:** The system must distinguish between "I have no information about the correlation" (Silence) and "The structure of the problem guarantees no correlation" (Symmetry).
      *   *Consideration:* Treating silence as symmetry is the Principle of Indifference, which is often unjustified; the presumption of independence should rely on structural symmetry where possible.
  *   **Defeasible Default vs. Assumption:** The independence presumption must be retractable upon finding a correlation, not baked in as an axiom.
      *   *Consideration:* If it is an axiom, the system becomes inconsistent when correlations are later proven.

  #### 4. Results It Must Be Consistent With (External Coherence)
  These are constraints imposed by existing mathematical frameworks.
  *   **Deductive Logic:** If premises $\Gamma \vdash \phi$, then the estimator must eventually output $1$ for $\phi$ given $\Gamma$.
      *   *Consideration:* The estimator must converge to logic given infinite resources.
  *   **Standard Probability Theory:** Where events are known to be independent, the estimator must match standard probability calculus.
      *   *Consideration:* It must not invent a new arithmetic for known cases.
  *   **Logical Induction:** The behavior should not contradict the criteria satisfied by Logical Inductors (e.g., the poly-time convergence property), though it need not be a Logical Inductor.
      *   *Consideration:* Logical Induction is the current state-of-the-art for this class of problem; a heuristic estimator should ideally be a specialization or improvement, not a regression.

  ---

  ### II. Critical Analysis: Genuine Desiderata vs. Prejudices

  **Genuine Desiderata:**
  The requirements in **Group 1 (Cases)** and **Group 4 (Consistency)** are genuine. If the estimator cannot reproduce the Prime Number Theorem heuristics or respect deductive logic, it fails its primary function. The distinction in **Group 3** between "Proof vs. Estimate" is also genuine; without it, you are simply building a slower theorem prover.

  **Prejudices of the Camp:**
  The requirement in **Group 3** that "Output vs. Probability" be distinct is a specific prejudice of the early Heuristic Estimator program. Later work (specifically **Logical Induction**) suggests that you *can* treat the output as a probability, provided you relax the requirement for immediate coherence and allow it to evolve over time. Insisting that the output is *not* a probability often stems from a desire to avoid the computational cost of maintaining coherence, which is an engineering constraint masquerading as a conceptual desideratum.

  Similarly, the strict separation in **Group 3** between "Silence" and "Symmetry" is often blurred in practice. Most successful heuristic reasoning *does* treat silence as symmetry (the Principle of Maximum Entropy). Insisting they be distinct is a safeguard against error, but may be too restrictive for a system meant to operate under radical uncertainty.

  **The Tensions:**
  The primary tension exists between **Group 1 (Product Rule on Silence)** and **Group 2 (Diagonalization/Correlation)**.
  *   To satisfy Group 1, the estimator must freely assume independence when premises are silent.
  *   To satisfy Group 2, the estimator must detect when "silence" is actually a trap (e.g., when the statement is constructed to correlate with the estimator's own error).
  *   **The Conflict:** Detecting the trap requires reasoning about the estimator's own internals (Group 2), but the premises provided to the estimator (Group 1) are explicitly silent about the estimator's internals. If the estimator assumes independence because the premises are silent, it falls for the trap. If it refuses to assume independence to avoid the trap, it fails to solve the Prime Number Theorem (where premises are also silent about correlations between divisibility by $p$ and $q$).

  ---

  ### III. Testing Your Suspicion

  Your suspicion is correct: **The list is jointly unsatisfiable in its strong form.**

  The "single requirement" that does the excluding work is indeed **Group 2 (Reject Spurious Arguments)**, specifically the demand to reject diagonalization arguments while maintaining **Group 1 (Presumption of Independence)**.

  **Why they conflict:**
  The presumption of independence is a *local* rule: "Look at $A$ and $B$; see no link; multiply."
  The rejection of spurious arguments is a *global* property: "Ensure that no sequence of $A$'s and $B$'s can be constructed to exploit your local rule."

  To guarantee the global property, the estimator must have access to global information about the space of all possible statements (including those referencing itself). But the heuristic setup explicitly denies the estimator this information (it operates on specific premises without a proof).
  *   If you prioritize **Group 1**, you get a system that works for number theory but is Dutch-bookable by an adversary who knows the estimator's code (The "Naive Heuristic Estimator").
  *   If you prioritize **Group 2**, you get a system that is robust (like a Logical Inductor) but which effectively must "solve" the correlation problem before making an estimate. This slows the system down so much that it fails to capture the "fast and frugal" nature of the heuristic reasoning described in Group 1. It stops being a *heuristic* estimator and starts being a *logical* inductor.

  **The Verdict:**
  You cannot have a system that is both **computationally bounded** (heuristic), **structurally naive** (presumes independence on silence), and **adversarially robust** (rejects all spurious self-reference). You must drop one.
  *   Drop Robustness? You get a useful tool for math that breaks on paradoxes.
  *   Drop Naivety? You get Logical Induction (robust, but computationally heavy).
  *   Drop Boundedness? You get a Oracle (not feasible).

  The "interesting question" is indeed whether the list is unsatisfiable. The evidence suggests it is. The research program largely dissolved or merged into Logical Induction because satisfying Group 2 required abandoning the simplicity of the Group 1 "presumption of independence" mechanism.

  ---

  ### IV. Scoring Existing Candidates

  **1. Naive Heuristic Estimator (Christiano 2013)**
  *   *Score:* Fails Group 2.
  *   *Reason:* It explicitly implements the presumption of independence on silence. It is vulnerable to "proof by ignorance" and diagonalization attacks where the statement is constructed to be true iff the estimator guesses wrong. It succeeds on Group 1 (gets the math right) but fails the safety constraints.

  **2. Logical Induction (Garrabrant et al. 2016)**
  *   *Score:* Passes Group 2 and 4; Struggles with Group 1 and 3.
  *   *Reason:* It is robust against spurious arguments and consistent with logic/probability. However, it does not use a "presumption of independence" as a primitive; it learns correlations over time. It treats output as probability (violating the Group 3 distinction some want) and is computationally expensive, missing the "fast guess" spirit of Group 1.

  **3. Algorithmic Probability / Solomonoff Induction**
  *   *Score:* Passes Group 1 and 4; Fails Group 2 (in practice) and computability.
  *   *Reason:* It handles independence well via simplicity priors. However, it is uncomputable. In any computable approximation, it is vulnerable to the same diagonalization issues as the Naive Estimator unless it spends immense resources checking for traps, returning us to the Logical Induction trade-off.

  **Summary:** The Naive Estimator captures the *intent* (Group 1) but fails the *safety* (Group 2). Logical Induction captures the *safety* (Group 2) but loses the *mechanism* (Group 1). No candidate satisfies the full conjunction.
