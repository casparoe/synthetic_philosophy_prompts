  2.  **Deconstruct the No-Trade Theorem (for a lay/econ-literate audience):**
      *   *Simplified:* If we all know the rules and start with a fair deal, why would I sell you something unless I know something bad about it? If you know I know that, you won't buy. Trade stops.
      *   *Assumptions:* Rational agents, common priors, common knowledge of efficiency.
      *   *Reality Check:* Trade *does* happen. Why? Differences in priors, liquidity needs, agency problems, irrationality.

