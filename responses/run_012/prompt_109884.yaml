      *   *The Trade:* Buying Credit Default Swaps (CDS) on mortgage bonds.
      *   *The Sellers (Banks):* Willing to sell. Why?
          *   Model: Housing never goes down nationally.
          *   Incentive: Fees now, risk dumped (securitization), agency issues (not their money).
          *   Information: They knew the loans were bad (some did), but thought the structure protected them.
      *   *The Buyers (The Shorts):* Willing to buy. Why?
          *   Model: Housing is a bubble.
          *   Information: Read prospectuses, saw stripper with 5 houses.
          *   Cost: Paying premiums (bleeding cash) until the crash.
      *   *The Outcome:* Buyers win, but only because the government intervened (bailout). If counterparties failed without bailout, shorts might not have gotten paid.

  4.  **Drafting the Discussion Framework:**

      *   **Title:** Needs to be catchy. "Betting the House vs. Betting the Theory."
      *   **Introduction:** Set the stage. Define No-Trade simply. State the puzzle: Why did trade happen in the movie if the theorem says it shouldn't?
      *   **Section 1: The Theorem's Case (Why the Banks *Shouldn't* Have Sold).**
          *   Focus on the price signal. If Burry wants to buy, why is the price so low?
