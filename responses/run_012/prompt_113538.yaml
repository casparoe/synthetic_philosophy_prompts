prompt: |-
  I'm on a small team with three years and a mandate to design the membership rules for a cross-border deliberative body — the kind that would decide pandemic measures, geoengineering experiments, or terms of migration — and we have no pre-existing demos to appeal to, so the boundary problem is our day job rather than a seminar topic. Which of its open questions should we treat as load-bearing, and in what order? Our own working proposal is that the demos consist of everyone who would have to comply with the body's decisions and could reasonably demand a justification for them, with membership revisable annually and no opt-out; part of what I want to know is how much of the standard agenda survives once you accept something like that, and which questions only look pressing because they assume the boundary is fixed once and for all. Give me the criteria behind your ordering — what is upstream of what, what is tractable for political theorists rather than lawyers or empiricists, what would actually change our design — along with what would move an item up or down the list and where the ordering is fragile. Close by saying how confident you are in the ranking as a whole and naming the single placement you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a small team (3 years, small team) tasked with designing membership rules for a *cross-border deliberative body*.
      *   **Mandate:** High-stakes decisions (pandemic measures, geoengineering, migration).
      *   **Constraint:** No pre-existing *demos* (people) to appeal to. The "boundary problem" (who constitutes the people) is the core task, not a theoretical side-note.
      *   **Working Proposal:** All-affected principle (everyone who must comply + could reasonably demand justification), annual revisability, no opt-out.
      *   **Request:** Identify load-bearing open questions in the boundary problem literature, order them, explain the criteria for ordering (upstream/downstream, tractability for political theorists, design impact), identify fragility/movers, and provide a confidence rating + least sure placement.
      *   **Tone:** Professional, theoretically rigorous, pragmatic, actionable.

  2.  **Deconstruct the "Boundary Problem" (The Democratic Boundary Problem):**
      *   Classic literature: Whelan (1983), Abizadeh (2008), Goodin (2007), Arrhenius (2005).
      *   Core issue: Democracy presupposes a *demos*, but the *demos* must be defined democratically (circularity).
      *   User's specific context: Global/Transnational, high-impact, dynamic membership (annual revision).

  3.  **Evaluate the User's Working Proposal:**
      *   *All-affected principle (AAP):* "Everyone who would have to comply... and could reasonably demand justification."
      *   *Annual revisability:* Dynamic boundaries.
      *   *No opt-out:* Coercive membership.
      *   *Implication:* This solves the "fixed boundary" assumption but introduces new problems (epistemic, administrative, stability).

  4.  **Determine the Criteria for Ordering:**
      *   **Upstream/Downstream:** Conceptual foundations must come before institutional mechanics. You can't design voting weights before defining who votes.
      *   **Tractability for Political Theorists:** Focus on normative justification and conceptual coherence, leaving empirical measurement (who is actually affected?) and legal drafting for later stages.
      *   **Design Impact:** Which questions, if answered differently, radically alter the institution's structure?
      *   **Fragility:** Where does the logic hinge on a contested assumption?

  5.  **Drafting the Priority List (Iterative Process):**

      *   *Candidate 1: The Definition of "Affectedness".* (Crucial. Is it causal impact? Moral interest? Legal subjection?)
      *   *Candidate 2: The Unit of Membership.* (Individuals vs. States vs. Communities?)
      *   *Candidate 3: Temporal Stability.* (Annual revision vs. Fixed terms. User says annual, but is that coherent?)
      *   *Candidate 4: The Circularity/Regress Problem.* (Who decides the boundary rules?)
      *   *Candidate 5: Enforcement/Compliance.* (How to enforce "no opt-out"?)
      *   *Candidate 6: Epistemic Access.* (How do we know who is affected before the decision is made?)

      *   *Refining for the User's Context:* They already have a working proposal (AAP + Annual). I need to test *that* proposal's viability.
      *   *Priority 1: The Ex Ante vs. Ex Post Problem (Epistemic).* If membership depends on being affected, but we don't know effects until *after* the decision, how do we constitute the body *before* the decision? This is the biggest logical hole in AAP.
      *   *Priority 2: The "All-Subjected" vs. "All-Affected" Distinction.* User says "comply + demand justification." This leans toward All-Subjected. But geoengineering affects people who aren't legally subject. Need to clarify the normative hook.
      *   *Priority 3: The Constituent Power (Who draws the first line?).* Since there's no pre-existing demos, who authorizes the boundary rule itself?
      *   *Priority 4: Aggregation/Voting Weight.* Once we have the list, does one person = one vote? Or does affectedness intensity matter?
      *   *Priority 5: Exit and Voice.* User says "no opt-out." Is this sustainable? What about conscientious objection?

      *   *Re-ordering based on "Load-Bearing":*
          1.  **The Epistemic/Temporal Paradox (Ex Ante Identification).** If you can't identify the demos before the decision, you can't deliberate. This kills the design if unsolved.
          2.  **The Normative Hook (Affectedness vs. Subjection).** "Comply" implies law. "Justification" implies morality. Geoengineering isn't law for everyone, but it affects everyone. Need to nail the criterion.
          3.  **The Meta-Boundary (Who decides the boundary rule?).** The infinite regress problem.
          4.  **Intensity vs. Headcount.** If I'm 1% affected and you're 90% affected, do we count equally?
          5.  **Enforcement of Non-Opt-Out.** Practical/Political, but theoretically grounded in legitimacy.

  6.  **Developing the Criteria Explanation:**
      *   Why this order? Because #1 makes the body impossible if wrong. #2 defines the moral scope. #3 solves the legitimacy of the rules themselves. #4 & #5 are internal mechanics.
      *   Theorist vs. Lawyer: Focus on the *definition* of affectedness, not the *registry* mechanism.
      *   Design Impact: #1 changes the timeline. #2 changes the voter roll.

  7.  **Addressing the User's Proposal (AAP + Annual):**
      *   Does standard agenda survive?
      *   *Fixed Boundary Assumption:* Much of the literature assumes a fixed state. With annual revision, "Stability" and "Identity" questions drop down. "Epistemic" questions move up.
      *   *Opt-Out:* Removing opt-out moves "Coercion/Legitimacy" up.

  8.  **Assessing Confidence and Fragility:**
      *   Confidence: High on the top 2, lower on the middle.
      *   Least Sure: Probably the placement of "Voting Weight/Intensity." It could be upstream if intensity defines membership.

  9.  **Refining the Output (Self-Correction during drafting):**
      *   *Correction:* The user asked for "open questions" from the standard agenda. I need to frame them as theoretical problems, not just practical steps.
      *   *Correction:* Make sure to explicitly address "what would move an item up or down."
      *   *Tone Check:* Ensure I'm not being too academic; they have a 3-year mandate. They need *actionable theory*.
      *   *Key Insight:* The "Ex Ante" problem is the killer for the All-Affected Principle. If you decide on geoengineering, you affect future generations. Do they vote? If membership is annual, how do you handle long-term effects? This needs to be Priority 1.

  10. **Final Polish:** Check against all constraints in the prompt (criteria, ordering logic, confidence, least sure placement).

      *(Self-Correction on Priority 1)*: Is it the Epistemic problem or the Meta-Boundary problem? Whelan argues the boundary problem is logically prior to democracy. But the user *has* a mandate to design it. So the Meta-Boundary is effectively solved by their existence (they are the constituent power). The *operational* boundary is the real hurdle. So, Ex Ante Identification is indeed #1.

      *(Self-Correction on Priority 2)*: The definition of "Affected." Is it causal or normative? This determines the scope.

      *(Self-Correction on Priority 3)*: Intensity. If the body decides geoengineering, a small island nation is more affected than a large continent. Does "one person one vote" hold?

      *(Self-Correction on Priority 4)*: Temporal Scope. Future generations. Annual revision clashes with long-term effects.

      *(Self-Correction on Priority 5)*: Enforcement.

      *Wait, let's look at the "Standard Agenda" survival.*
      Standard agenda: Voting systems, representation, deliberation norms.
      If boundary is dynamic: Representation becomes proxy-based or algorithmic. Deliberation becomes fragmented.
      So, "Representation Mechanism" moves up.

      *Let's finalize the list:*
      1. Ex Ante Identification (The Epistemic Gap).
      2. The Normative Criterion (Affected vs. Subjected).
      3. Intensity and Weighting (Equality vs. Impact).
      4. Temporal Horizon (Future Generations vs. Annual Roll).
      5. The Meta-Rule Legitimacy (Who guards the guardians of the boundary).

      *Wait, the prompt asks for "open questions... in what order".*
      Okay, I will structure the response around these 5 questions.

      *Confidence:* I need to be honest. This is uncharted territory. 70-80% confident.
      *Least Sure:* Temporal Horizon vs. Intensity.

      *Let's write.*
answer: |-
  This is a high-stakes design challenge that effectively operationalizes the "Democratic Boundary Problem" (Whelan, Abizadeh, Goodin) rather than treating it as a theoretical limit. Your working proposal (dynamic All-Affected Principle + no opt-out) is ambitious; it dissolves the "fixed boundary" assumption that allows most standard democratic theory to function.

  Because you are operating without a pre-existing *demos*, you cannot rely on "the people" to legitimize the rules that define "the people." You are building the engine while flying the plane.

  Here is the ordering of load-bearing open questions, ranked by logical priority and design impact.

  ### 1. The Ex Ante Epistemic Problem (Identification)
  **The Question:** *How do you identify the membership roster before the decision is made, given that "affectedness" is often only knowable ex post?*
  **Position:** **Priority 1 (Upstream)**
  **Rationale:** This is the logical kill-switch for your proposal. The All-Affected Principle (AAP) usually fails in practice because we cannot know who is affected until a policy is modeled or implemented. If membership is revised annually based on who *will* be affected by *potential* agendas, you require predictive modeling of political impact. If you get this wrong, the body lacks legitimacy (excluding the affected) or efficiency (including the unaffected).
  **Theorist vs. Lawyer/Empiricist:** This is primarily a conceptual/epistemic problem for theorists (defining the counterfactual standard of affectedness) before it becomes a data problem for empiricists.
  **Design Impact:** If unsolved, you cannot convene the first session. It dictates whether you need a standing permanent body (presumptive membership) or a fluid liquid-democracy style pool.
  **Movers:** If you shift the mandate from "deciding measures" to "advising on measures," this drops in priority. If you adopt a "All-Subjected" (coercion-based) standard instead of "All-Affected," this becomes tractable (legal jurisdiction is easier to map than causal impact).

  ### 2. The Normative Hook (Affectedness vs. Subjection)
  **The Question:** *Is membership grounded in causal impact (geoengineering climate effects) or legal subjection (pandemic compliance)?*
  **Position:** **Priority 2 (Upstream)**
  **Rationale:** Your proposal mixes these ("comply" + "demand justification"). In pandemic measures, these overlap. In geoengineering, they diverge radically. A farmer in the Sahel is causally affected by stratospheric aerosol injection but may not be legally subject to the body's jurisdiction. If you prioritize *justification* (moral claim), the demos becomes global/unbounded. If you prioritize *compliance* (legal claim), it remains statist/regional.
  **Theorist vs. Lawyer:** Theorists must define the "reasonable demand for justification." Lawyers will later draft the jurisdiction.
  **Design Impact:** Determines the scale of the electorate. A moral hook implies a global electorate (millions/billions); a legal hook implies a treaty-based electorate (states/delegates).
  **Movers:** If the body is granted supranational enforcement powers (police/sanctions), "Subjection" moves to Priority 1. If the body relies on soft power, "Affectedness" dominates.

  ### 3. Intensity and Voting Weight
  **The Question:** *Does membership imply equal voting weight, or does weight scale with the intensity of affectedness?*
  **Position:** **Priority 3 (Midstream)**
  **Rationale:** Standard democratic theory assumes "one person, one vote" within a fixed boundary. In a dynamic AAP body, one member might be affected trivially (0.01% GDP impact) while another faces existential risk (island nation submersion). If you treat them equally, you violate the normative logic of the AAP (which is supposed to track impact). If you weight them, you create a plutocracy of vulnerability.
  **Theorist vs. Lawyer:** Theorists must justify the metric of equality. Lawyers implement the weighting algorithm.
  **Design Impact:** Determines the voting constitution. Equal weight preserves procedural legitimacy; weighted voting preserves outcome legitimacy regarding risk.
  **Movers:** If the body operates by consensus rather than voting, this drops. If the body decides on existential risks only, this moves to Priority 1.

  ### 4. The Temporal Horizon (Future Generations)
  **The Question:** *How does annual revisability account for effects that outlast the membership term?*
  **Position:** **Priority 4 (Downstream)**
  **Rationale:** You propose annual revision. But geoengineering and migration terms have effects lasting decades or centuries. Future generations are the ultimate "affected" party but cannot demand justification today. If you ignore them, the design is ethically bankrupt. If you include them (via proxies), you complicate the "annual" constraint.
  **Theorist vs. Lawyer:** Theorists must solve the non-identity problem representation. Lawyers draft the proxy mechanisms.
  **Design Impact:** Determines the existence of a "Guardian" chamber or veto power for long-term interests.
  **Movers:** If the mandate is restricted to short-term crisis response (e.g., pandemic lockdowns only), this drops to Priority 5. If geoengineering is primary, this moves to Priority 2.

  ### 5. The Meta-Boundary (Constituent Power)
  **The Question:** *Who validates the rules for drawing the boundary, given there is no pre-existing demos to ratify them?*
  **Position:** **Priority 5 (Downstream/Foundational)**
  **Rationale:** This is the classic regress problem (who guards the guardians?). However, since you *have* a mandate (presumably from existing states or an international body), this is practically solved by your appointment. The theoretical question remains: if the membership disagrees with the boundary rules, can they change them?
  **Theorist vs. Lawyer:** Theorists analyze the legitimacy of the mandate. Lawyers draft the amendment clauses.
  **Design Impact:** Determines the amendment threshold for the membership rules themselves.
  **Movers:** If the founding states retain veto power over membership rules, this becomes a legal constraint rather than a theoretical question.

  ---

  ### Criteria for Ordering

  1.  **Logical Precondition (Upstream/Downstream):** Can Question B be answered if Question A is unresolved? (e.g., You cannot determine Voting Weight #3 until you know Who Votes #1 & #2).
  2.  **Design Lethality:** If this question is answered poorly, does the institution collapse immediately? (Epistemic Identification is lethal; Meta-Boundary is manageable via mandate).
  3.  **Theoretical Tractability:** I have prioritized questions where political theory offers leverage over pure empirical measurement. (e.g., Defining "Affectedness" is normative; measuring it is empirical).
  4.  **Sensitivity to Dynamic Boundaries:** I have elevated questions that become *more* pressing because your boundaries are fluid (Epistemic, Intensity) and demoted questions that assume fixed boundaries (Traditional Representation).

  ### What Survives of the Standard Agenda?
  By accepting a dynamic, no-opt-out AAP:
  *   **Survives:** Deliberative norms, conflict of interest rules, transparency requirements.
  *   **Dissolves:** Constituency representation (geographic districts make no sense if membership is based on impact), fixed terms (replaced by rolling eligibility), and standard "one person one vote" (challenged by intensity).
  *   **Transforms:** "Legitimacy" shifts from *procedural* (we followed the rules) to *epistemic* (we correctly identified the affected).

  ### Fragility and Movers
  *   **Fragile Point:** The ordering assumes the body has **decision-making power**. If the body is merely **advisory**, Priority 1 (Epistemic) and Priority 3 (Weighting) drop significantly, as the cost of error is lower.
  *   **Major Mover:** **Enforcement Capability.** If your body can enforce compliance (sanctions, force), the "All-Subjected" principle overtakes "All-Affected." This would collapse Priority 1 and 2 into a simpler legal jurisdiction question, radically simplifying your design but reducing moral scope.

  ### Confidence and Uncertainty
  **Confidence:** I am **75% confident** in this ranking. The logic holds for a high-power deliberative body, but the novelty of your mandate means historical precedents are scarce.

  **Least Sure Placement:** I am least sure about **Priority 4 (Temporal Horizon)**.
  *   *Reasoning:* In standard theory, future generations are a footnote. In geoengineering, they are the primary stakeholders. If you treat them as a "special interest," the design fails ethically. If you treat them as full members (via proxies), they might dominate the annual roster, effectively freezing the "annual revisability" you proposed. This tension could easily move Temporal Horizon to Priority 2, displacing the Normative Hook, depending on how existential the geoengineering risks are deemed.
