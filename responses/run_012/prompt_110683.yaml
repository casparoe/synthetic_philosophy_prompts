answer: |-
  # Q&A Prep Sheet: Institutional Division of Moral Labor in JWT

  **Thesis:** MEC is grounded in an institutional division of moral labor (state authority), not epistemic limitations.
  **Room:** Majority Revisionists, 2 Walzerians, 1 International Lawyer.

  ---

  ### 1. The "Moral Proxy" Objection (Revisionist)
  **Likelihood:** High | **Damage:** Critical
  **Voice:** Aggressive, focused on individual moral agency.

  **The Question:**
  "You're trying to have it both ways. Revisionism shows that liability tracks objective moral responsibility for harm. You're claiming the State acts as a 'moral proxy' that absorbs the *ad bellum* liability so the soldier doesn't have to. But institutions aren't moral agents in that sense; only people are. If I shoot you in an unjust war, *I* am threatening your rights, not my State. How does vesting authority in a state magically transmute my unjust threat into a permissible one? Isn't this just 'just following orders' dressed up in political philosophy?"

  **The Two-Minute Reply:**
  "It's not about absolving the soldier of agency, but recognizing the *source* of their permission. In a legitimate division of labor, I authorize the police to use force on my behalf; I don't assess the threat myself every time. Similarly, citizens authorize the state to assess *ad bellum* justice. When a soldier acts under that authority, they are exercising a collective right of defense, not merely an individual one. The permission stems from the institutional role, which is designed to prevent the chaos of private judgment. I'm not saying the soldier is blameless if the war is heinous, but that their *liability to be killed* is blocked by the institutional warrant, provided the war isn't manifestly criminal. The state doesn't absorb the morality; it holds the jurisdiction."

  **Where the Reply is Softest:**
  You rely on the analogy to domestic police authority, but international anarchy makes that analogy weak. Revisionists will press: "Police authority is grounded in *actual* justice enforcement; an aggressive state has no such authority to delegate."

  ---

  ### 2. The "Manifest Injustice" Limit (Revisionist)
  **Likelihood:** High | **Damage:** High
  **Voice:** Skeptical, looking for the breaking point.

  **The Question:**
  "Let's grant your institutional division of labor for a standard border dispute. But what about a war of blatant aggression or genocide? If the division of labor is what grants MEC, does that protection vanish when the state's cause is obviously unjust? If yes, you've conceded the Revisionist point that *ad bellum* justice matters for liability. If no, you're claiming a Nazi soldier in 1944 had institutional permission to kill. Which is it? Where is the cutoff?"

  **The Two-Minute Reply:**
  "The cutoff is the threshold of *manifest illegality*. The division of labor functions to handle epistemic uncertainty in gray areas, not to shield participants in clear crimes. My view aligns with the Nuremberg Principles: institutional authority grants a presumption of permission, but it is defeasible. However, unlike the epistemic view, the defect isn't that the soldier 'should have known better,' but that the institution itself has exceeded its moral warrant. So, I maintain MEC for most conventional wars (the gray zone), but allow liability in extreme cases. This preserves the symmetry needed for order without licensing atrocity."

  **Where the Reply is Softest:**
  Defining "manifest." If you admit the institution can fail so badly that soldiers become liable, the Revisionist will argue the *institution* wasn't the ground of MEC after all; the *objective justice* was.

  ---

  ### 3. The IHL Symmetry Gap (International Lawyer)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** Pragmatic, focused on LOAC (Law of Armed Conflict).

  **The Question:**
  "I care about what this does to the symmetry of the laws of armed conflict. Current IHL treats combatants equally regardless of cause. Your view grounds this in state authority. But what happens when one state is a recognized aggressor under UN Charter Article 2(4)? Does your theory suggest we should change the law to strip those combatants of POW status? If your moral theory creates a gap between what soldiers *may* do and what the *law* allows, aren't you undermining the compliance pull of IHL?"

  **The Two-Minute Reply:**
  "On the contrary, this view stabilizes IHL symmetry better than Revisionism. Revisionism suggests the law is morally wrong because it protects liable (unjust) combatants. My view argues the law is morally *correct* because it mirrors the institutional division of labor. Even if a state is an aggressor, until the international community collectively adjudicates that, individual soldiers operate under a presumption of institutional authority. This supports the current legal symmetry rather than undermining it. It tells the lawyer: 'Keep the symmetry, but ground it in political authority, not ignorance.'"

  **Where the Reply is Softest:**
  The UN Charter *does* sometimes designate aggressors. If the institution (UN) says one side is wrong, does your "division of labor" collapse for that side? You risk making legal symmetry contingent on political recognition.

  ---

  ### 4. The "Fragile Convention" Objection (Walzerian)
  **Likelihood:** Low | **Damage:** Medium
  **Voice:** Protective of the "War Convention" and the soldier's status.

  **The Question:**
  "Michael Walzer argues soldiers are equal because they are coerced into a common danger and are instruments of the state, not authors of policy. By grounding this in 'authority' rather than the shared condition of soldiering, aren't you making the soldier's moral status too dependent on the legitimacy of their regime? If the division of labor breaks, the soldier becomes liable. That makes the 'right to fight' fragile. Doesn't this undermine the protective convention we need to keep war limited?"

  **The Two-Minute Reply:**
  "I argue it makes it more robust. The epistemic argument (soldiers can't know) is patronizing and easily debunked by modern information access. The institutional argument respects the soldier as a civic agent fulfilling a duty. As long as the state maintains basic legitimacy (rule of law, non-tyrannical), the division of labor holds. This protects the Walzerian goal—limiting war and protecting soldiers—but gives it a firmer political foundation than 'ignorance.' It treats soldiers as professionals within a structure, not as blindfolded pawns."

  **Where the Reply is Softest:**
  Walzerians value the "community of fate." If you tie the soldier's protection to the *state's* legitimacy, you risk politicizing the soldier's immunity in a way Walzer wanted to avoid.

  ---

  ### The Question You Hope Nobody Asks

  **The Question:**
  "If the soldier's permission derives entirely from the State's authority to wage war, and that authority is grounded in the State's function to protect rights/justice (as most liberal theories claim)... **doesn't an unjust war logically void the State's authority at the source?** If the State acts *ultra vires* (beyond its powers) by waging an unjust war, isn't the 'division of labor' nullified instantly, returning full moral liability to the individual soldier regardless of their knowledge?"

  **Why this is deadly:**
  It attacks the foundational link between *authority* and *justice*.
  *   If you say "Yes, authority is voided," you collapse into Revisionism (MEC is false in unjust wars).
  *   If you say "No, authority holds," you sound like a Statist/Realist who believes states have rights independent of justice, which alienates the liberal normative framework the room likely shares.
  *   It exposes that "Institutional Authority" might just be a label for "Power," failing to solve the normative problem of why we should respect that authority when it is used unjustly.
