  12. **Final Polish:** Organize with clear headings. Ensure the "Reasoning Over List" section is distinct and analytical. (Proceed to generate output based on this structure).

  *(Self-Correction during drafting)*: I initially thought about putting "Decision Theory" higher. But if the model doesn't *have* knowledge (Friend's objection), decision theory doesn't matter. So Metaphysics/Semantics must be first. However, spending 3 years *only* on metaphysics is risky for a PhD in a science-adjacent field. I need to frame it as "Conceptual Foundations for Empirical Work." The dissertation shouldn't just be "Quine was wrong." It should be "Here is a framework for interpreting model states that allows ELK to be coherent."

  Let's adjust the agenda to be:
