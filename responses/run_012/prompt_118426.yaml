          *   *Belief 4:* "Substrate independence" threshold. The fly's processing is too distributed or simple to integrate information into a "self" that suffers.
      *   *Key Distinction:* The Minister isn't necessarily deciding on *consciousness* per se, but on *moral weight vs. social cost*. To leave the fly out, they must believe the probability of sentience is low *enough* to outweigh the cost of protection. To put the prawn in, the probability is high *enough* to outweigh the cost of changing cooking practices.

