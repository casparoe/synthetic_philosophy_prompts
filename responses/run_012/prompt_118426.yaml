      *   **Task 1:** Reconstruct the *implicit theory of consciousness* presupposed by this legal patchwork. Distinguish between strict presuppositions and mere correlations. Identify if there's a coherent theory or just a bundle of pragmatic decisions. Address specific criteria (warm blood, backbone, centralized brain). Address rival accounts.
      *   **Task 2:** Explore what would change if we swapped the presupposed view for two alternative views:
          *   (a) Centralized nervous system + nociceptors.
