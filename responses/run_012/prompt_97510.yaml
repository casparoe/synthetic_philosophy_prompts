answer: |-
  Here is the battle plan. Your intuition about the order is the source of the problem. The standard textbook order ((a) to (d)) implicitly grants the premise that makes disjunctivism look like a dodge. You need to restructure the hour to make the **Common Factor Principle** the villain, not the illusion itself.

  ### 1. The Order (and Why)

  Your current order lets the audience accept the "Common Factor" (that illusion and perception share the same core mental state) as obvious truth before they ever hear the disjunctivist reply. By the time you get to (d), disjunctivism looks like denying reality to save a theory.

  **The Fix:** You must expose the **Common Factor Principle** as a *choice*, not a fact, before you present Sense-Data as the solution.

  **Revised Sequence (50 mins):**

  1.  **The Naive Intuition (5 mins):** Start with what they believe: "When I see a cup, my mind is in contact with the cup." Write **MIND —> WORLD** on the board.
  2.  **The Carrying Example (10 mins):** Introduce the scenario. Establish that Case A (Real) and Case B (Illusion) are *subjectively indistinguishable* at the time.
  3.  **The Trap: The Argument from Illusion (10 mins):** Don't call it that yet. Call it "The Indistinguishability Claim." Ask: "If I can't tell the difference from the inside, what is the *immediate* object of my awareness in both cases?"
      *   *Critical Move:* Most will say "In Case B it's a sensation; in Case A it's the cup." **Stop them.** Force them to admit that if the *experience* is the same, the *mental state* must be the same. This is the **Common Factor Principle**. Write it on the board.
  4.  **The Fork (10 mins):** Now present the two ways to handle the Common Factor.
      *   **Path 1 (Sense-Data):** Accept the Common Factor. Conclude that in *both* cases, you only see an internal representation. (Mind —> DATA —> World).
      *   **Path 2 (Disjunctivism):** Reject the Common Factor. Say: "Indistinguishable does not mean Identical."
  5.  **The Disjunctivist Move (10 mins):** Explain that Path 2 means the mental state in Case A is fundamentally different in *kind* from Case B, even if they feel the same. Case A is a relation to the world; Case B is a mere appearance.
  6.  **Wrap & Check (5 mins):** The final question.

  **Why this works:** It prevents the "shrug." The shrug ("sometimes we're right, sometimes wrong") accepts the Common Factor (it's the same process, just different outcomes). Disjunctivism denies the process is the same. By isolating the Common Factor Principle in Step 3, you make it clear that Disjunctivism isn't dodging the illusion; it's denying that the illusion dictates the metaphysics of the veridical case.

  ---

  ### 2. The Carrying Example

  You need an example that resists the "I can check" objection and feels like *perception*, not *confusion*.

  **Critique of your candidates:**
  *   **VR:** **Do not use.** As you suspected, it introduces "representation." People think of screens and pixels. It makes it about *technology*, not *mind*. Also, they usually know they are in VR, which breaks the "indistinguishability" requirement.
  *   **Vibration Motor:** **Use this, but refine it.** The "gritty texture" via ultrasonic vibration (like the TeslaTouch or similar haptic feedback) is excellent. It is tactile (immediate), not visual (interpretive).

  **The Specific Setup:**
  Don't bring the motor. Describe the *neural state*.
  *   **Case A:** You run your finger over sandpaper. Your nerves fire Pattern X. You feel grit.
  *   **Case B:** A device stimulates your nerve endings directly to fire Pattern X. No sandpaper. You feel grit.
  *   **The Constraint:** "At the exact moment of feeling, before you pull your hand away or look down, is there any difference in your *experience*?"

  **Why this works for Law/Econ:**
  1.  **Evidence:** It isolates the testimony (the sensation) from the fact (the sandpaper).
  2.  **Causation:** It separates the cause (nerve firing) from the object (sandpaper).
  3.  **No "Check":** In the moment, you cannot "check." You only have the sensation.

  **What the example MUST have:**
  *   **Subjective Indistinguishability:** They must agree that *from the inside*, A and B are identical.
  *   **Objective Difference:** They must agree that *from the outside*, A involves an object, B does not.
  *   **No "Trick" Framing:** Do not frame it as "being fooled." Frame it as "two ways to produce the same sensation."

  **What it MUST NOT have:**
  *   **Belief Error:** Do not use examples where the mistake is cognitive (e.g., mistaking a wax apple for real). That's a judgment error. Disjunctivism is about *sensory experience*.
  *   **Delayed Verification:** If they can say "I'd just look closer," you've lost. The example must hold at the *instant* of perception.

  ---

  ### 3. The Misconception Map

  Here is where they will drift, and exactly when to cut them off.

  | Misconception | When it arises | How to head it off (The Script) |
  | :--- | :--- | :--- |
  | **"It's about Knowledge"** (Epistemic) | **Step 3 (The Trap).** They will ask: "But how do I *know* which case I'm in?" | **Stop immediately.** "Bracket knowledge. Assume you *can't* know. We aren't asking how you verify the world; we are asking what your mind is *doing* when you look at it." |
  | **"It's Skepticism"** (Dreaming) | **Step 3.** "This is just the Dream Argument." | **Clarify Scope.** "Skepticism asks 'Can I be sure?' Disjunctivism asks 'If I am sure, what is that state made of?' We are assuming perception happens; we are analyzing its structure." |
  | **"It's just Direct Realism"** | **Step 5 (Disjunctivism).** They'll say: "So you just see the world? That's obvious." | **Distinguish.** "Naive Realism says 'I see the world.' Disjunctivism says 'When I see the world, my mind is in a *different kind of state* than when I hallucinate.' It's a claim about the *hallucination* too." |
  | **"Hallucinating = Seeing"** | **Step 5.** They'll think you're saying the hallucination is real. | **Clarify the Disjunction.** "Disjunctivism says: Either I see the world (Fact) OR I hallucinate (Appearance). They do not share a common core. The hallucinator is *not* seeing." |

  **Crucial Intervention Point:**
  The moment someone says, "But the brain state is the same," you must intervene.
  *   **Response:** "Maybe the *neural* state is the same. But is the *mental* state the same? Disjunctivism says the mental state is defined by what it connects to. If it connects to nothing, it's a different kind of mental event, even if the neurons fire similarly." (This distinguishes philosophy from neuroscience).

  ---

  ### 4. The Final Check Question

  Do not ask them to define terms. Ask them to apply the logic to a specific consequence.

  **The Question:**
  > "Imagine a Sense-Data theorist and a Disjunctivist are both looking at a real red apple.
  >
  > **Question:** Do they agree on what the *immediate object* of their awareness is?
  >
  > **A)** Yes, they both agree they are aware of a 'red-round-sensation' caused by the apple.
  > **B)** No. The Sense-Data theorist says they are aware of a sensation; the Disjunctivist says they are aware of the apple itself."

  **Why this works:**
  *   If they pick **(A)**, they haven't got it. They think Disjunctivism accepts the Common Factor (the sensation) and just adds the apple as a cause. That is *not* Disjunctivism; that is Causal Realism.
  *   If they pick **(B)**, they understand that Disjunctivism rejects the intermediary in the good case.

  **Follow-up (if time permits):** "So, for the Disjunctivist, does the hallucinator have *less* experience, or *different* experience?" (Answer: Different kind. Not a degraded version of seeing.)

  ---

  ### 5. Scope Limits (What to Exclude)

  Write this on the board at the start so they don't get frustrated.

  1.  **We are not solving Skepticism:** "We are not proving the world exists. We are analyzing what 'seeing' is *if* it happens."
  2.  **We are not doing Neuroscience:** "We don't care about the retina or the visual cortex. We care about the *description* of the experience."
  3.  **We are not covering 'McDowell/Williamson':** "There are fancy epistemic versions of this. We are doing the metaphysical version: What is the state?"

  ### Whiteboard Plan

  Draw this as you go. It anchors the logic visually.

  **Phase 1 (The Trap):**
  ```
  Case A (Real)  [ MIND ] ————> [ WORLD ]
  Case B (Fake)  [ MIND ] ——X——> [ WORLD ]

  Premise: The [ MIND ] part is identical in both.
  ```

  **Phase 2 (Sense-Data Solution):**
  ```
  Case A: [ MIND ] —> [ SENSE-DATUM ] —> [ WORLD ]
  Case B: [ MIND ] —> [ SENSE-DATUM ] ——X——> [ WORLD ]
  (Both share the Datum)
  ```

  **Phase 3 (Disjunctivist Solution):**
  ```
  Case A: [ MIND-STATE-1 ] ————————> [ WORLD ]
  Case B: [ MIND-STATE-2 ] ——X——> [ WORLD ]

  (States are fundamentally different kinds, even if they feel the same)
  ```

  ### Summary of Advice for the "Shrug" Problem
  The reason they shrugged last time ("perception is sometimes reliable") is that they treated reliability as a statistical property of a single system. Disjunctivism claims there are **two systems** (or two fundamental state-types) masquerading as one.

  To prevent the shrug, you must hammer home that **Indistinguishability ≠ Identity**. Use the legal analogy: "A forged contract and a valid contract might look identical to the naked eye. But the *legal status* of the document is not a 'common factor' plus a cause. One is valid, one is void. They are different kinds of things." (Law/Econ types will respect this distinction).

  Good luck. Keep the vibration example tight, kill the epistemic questions early, and force them to choose between "Same State" vs. "Different State."
