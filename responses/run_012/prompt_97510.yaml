prompt: |-
  Ok so I've done a dumb thing. I volunteered to lead next month's session at my book club — it's mostly people who did law or econ at uni, one retired GP, nobody's opened a philosophy book since they were nineteen — and I picked "disjunctivism and the argument from illusion," which I can now explain to myself but not to them. So don't explain it to me, I roughly know what I think it is; plan the session for me. Fifty minutes, whiteboard, no slides. What's the actual order the pieces have to go in, and why that order — I keep assuming it's (a) make them feel there's a real question about what's going on when you perceive something, (b) the argument from illusion, (c) the sense-datum reply, (d) the disjunctivist reply — but tell me where that's wrong, what has to come before what, and in particular what has to be in place before the disjunctivist move will look like anything other than a dodge. Last time I tried this people nodded happily through the bent-stick stuff and then couldn't see why anyone would be a disjunctivist rather than just shrugging "perception's sometimes reliable, sometimes not."

  The example is the part I'm stuck on. Everyone uses the bent stick in water or Müller-Lyer, and I'm bored of it, but worse I think it lets them off the hook, because they can always say "yeah but that's just an illusion, obviously the stick is straight." I want one example to carry the whole hour that they can't defuse that way. Two candidates I've been playing with: (1) a haptic one — I got one of those little coin vibration motors and if you hold it against your fingertip at a certain angle it genuinely feels like a rough, gritty texture when there's nothing there; (2) a VR one, since a couple of them have headsets, where a rendered room is, for a few seconds, indistinguishable from the real one. Tell me what the carrying example has to have and what it must not have, whether either of mine does that job or whether they drag in extra problems (the VR one worries me, because you sort of know you're in VR), and if neither works, what would.

  Then the misconception map. I already expect "so disjunctivism says hallucinating is exactly like seeing" and "it's about whether you can know you're not dreaming." What else will they walk in with or form along the way — I'm especially worried about them collapsing it into "it's just direct realism" or thinking it's a claim about knowledge rather than about experience — and at exactly which point in the sequence do I have to head each one off, not afterwards, because once it's set it's set. And give me one question to ask right at the end that would actually show me whether they've got the difference between the disjunctivist move and the sense-datum move, rather than just being able to say the words back. And finally, what should I straight-up tell them I'm not covering at this level, so they don't leave thinking they've got the whole picture.
reasoning: |-
