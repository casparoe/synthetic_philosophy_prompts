answer: |-
  **Setting:** *A quiet corner of the faculty lounge, late afternoon. The remains of a seminar on "Time in General Relativity" are scattered on the table—napkins with pen marks, empty espresso cups. **Elena** (a structural realist) leans back, arms crossed. **Marcus** (a metaphysical primitivist) stirs his coffee, looking thoughtful.*

  **Elena:** You defended the A-theory well in there, Marcus. But you sidestepped the elephant in the room. Or rather, the rotating dust.

  **Marcus:** Gödel. I knew you'd bring him up.

  **Elena:** It's not just a curiosity. It's a counterexample to the ontology you're pushing. But before we dive into the metric, I want to frame the disagreement using a distinction I've been mulling over. It clarifies what exactly Gödel kills.

  **Marcus:** I'm listening.

  **Elena:** Let's distinguish between the **Strong Claim** and the **Weak Claim** about temporal passage. The Strong Claim is that the world possesses a single, observer-independent present—a global "Now" that slices the manifold into past, present, and future. The Weak Claim is that each event has a genuine "now" relative only to the events causally connected to it.

  **Marcus:** That's generous. Most of my critics assume I'm committed to the Strong Claim.

  **Elena:** I'm trying to steelman you. But here is the blow: Gödel's rotating universe is a legitimate solution to the Einstein field equations. In that spacetime, closed timelike curves (CTCs) pass through every point. You cannot foliate the manifold into global spacelike hypersurfaces. The Strong Claim is mathematically impossible in that world. If time's passage were an objective feature of reality, the laws of physics shouldn't permit a universe where it is structurally excluded.

  **Marcus:** I accept that the Strong Claim is dead. Relativity killed it long before Gödel. But the Weak Claim survives. In a Gödel universe, even if I can't define a global "Now," I can still define a local light cone. At any event *p*, there is a definite distinction between events in my past light cone, my future light cone, and those spacelike separated. The Weak Claim only requires that *local* causal ordering be real.

  **Elena:** That brings us to my first worry. You're treating "now" as an indexical, like "here." You're saying "now" is real because *I* am here, experiencing it. But indexicals are token-reflexive; they pick out a coordinate relative to a speaker. If "now" is just a label for the event of my utterance, haven't you quietly evacuated the reality of passage? You've saved the word "now," but you've lost the *flow*. A map has a "here," but the map doesn't move.

  **Marcus:** That's the standard objection, but it conflates the representation with the territory. When I say "here," I am referencing a genuine spatial relation between my body and the environment. It's not an illusion that I am located *here* rather than *there*. Similarly, "now" references a genuine causal relation between my consciousness and the unfolding of physical states.
  In the Weak Claim, passage isn't a global wave washing over the universe; it's the local actualization of potentialities within the causal cone. Even in Gödel's universe, if I hand you a cup of coffee, the transfer of energy happens *from* my hand *to* yours. That causal asymmetry is the footprint of passage. If you deny that, you aren't just denying time; you're denying causation.

  **Elena:** I'm not denying causation. I'm denying that causation requires a metaphysical "passage." The block universe has causal ordering without ontological flow. But let's press the modal point. This is my second worry. You argue that because *our* universe appears to have open timelike curves, the Weak Claim holds here. But Gödel shows that the laws of physics *allow* for a universe without passage, even by your local definition.
  If time's passage were an objective, necessary feature of the physical world, it shouldn't be contingent on the mass-energy distribution. If the universe rotated slightly faster, would time suddenly stop passing? That seems absurd. It suggests passage isn't fundamental; it's a byproduct of specific boundary conditions.

  **Marcus:** That's a powerful intuition, but it assumes that "objective" means "necessary in all possible worlds." I think that's too high a bar. Consider water. Being H₂O is the objective nature of water. But there are possible worlds where hydrogen doesn't bond with oxygen. Does that mean water isn't objective in *this* world?
  The Weak Claim is that passage is an emergent, structural feature of causally well-behaved regions. In our universe, the expansion and the low-entropy past create a robust causal arrow. In Gödel's universe, the rotation scramles the global topology, but locally, causation still holds. The fact that the Strong Claim fails in a rotating universe doesn't refute the Weak Claim in an expanding one. It just tells us that global time is fragile, not that local time is illusory.

  **Elena:** But if the ontology of time depends on the contingency of the cosmological constant, then time isn't part of the fundamental furniture. It's more like weather.
  And this leads to my third point, the one that usually ends these debates: The Observability Constraint. What is the observable difference between your Weak Claim and my Block Universe?
  In your view, there is a genuine "now" moving along my worldline. In my view, my worldline is a static tube, and my consciousness accesses it sequentially. Both views predict exactly the same measurement outcomes. We both agree on the light cones. We both agree on the proper time along the curve. If there is no empirical test that distinguishes "genuine passage" from "sequential access to a static manifold," then by Occam's Razor, we should cut the passage.

  **Marcus:** I disagree that there is no observable difference. It depends on what you count as data. If you restrict "observable" to "third-person meter readings," then yes, we are empirically equivalent. But physics is done by observers who have first-person data.
  The Weak Claim posits that the asymmetry of experience—the feeling of agency, the openness of the future—is a reflection of physical reality. The Block Universe posits that this universal human experience is a systematic illusion.
  Furthermore, there is a structural difference. On the Block view, the distinction between past and future is purely entropic or psychological. On the Weak Claim, the future is ontologically distinct because it is *unactualized*. If we ever discover that quantum state reduction is a real, physical, non-unitary process, that would be an observable signature of the Weak Claim. The future would literally not exist until the measurement occurs.

  **Elena:** Ah, but that relies on a specific interpretation of quantum mechanics, which is far from settled. If Everett is right, or if Bohmian mechanics holds, the block returns. You're hitching the reality of time to the collapse postulate.
  And regarding the first-person data: Just because we experience passage doesn't mean passage exists outside the mind. We experience color, but physics tells us color is a psychophysical response to wavelengths, not a property of the photons. Why is time different? Why isn't "passage" just the cognitive processing of the thermodynamic arrow?

  **Marcus:** Because color is a secondary quality; it's defined by the interaction with the observer. Time is a primary quality of the manifold itself. The metric signature (− + + +) is built into the geometry. That minus sign is the mathematical encoding of the distinction between time and space.
  In the Weak Claim, I'm just taking that minus sign seriously. It says there is a fundamental difference between timelike and spacelike intervals. The Block Universe treats them as merely coordinate differences in a four-dimensional volume. My claim is that the metric signature dictates a directional unfolding. Gödel's universe has that signature too. Even with CTCs, locally, the tangent vector to a particle's path is timelike. The particle doesn't just *sit* there; it traverses. That traversal is the Weak Claim's "passage."

  **Elena:** But in Gödel's universe, "traversing" can lead you back to your own past. If I can traverse to my own past, the distinction between "unactualized future" and "fixed past" collapses. If I can influence the event that caused me to leave, the "now" loses its privilege.
  This is where your distinction helps, I'll admit. You've retreated to the Weak Claim to avoid the global contradiction. But if the "now" is only relative to causal connections, and causal connections can loop, then the "now" at event *p* includes event *p* itself as a future cause. The indexical "now" becomes reflexive in a way that dissolves the linear order you need for passage.
  If "now" is just "where I am on the curve," and the curve loops, then "now" is everywhere on the loop simultaneously. You haven't saved passage; you've just localized the contradiction.

  **Marcus:** Not necessarily. Even with a CTC, there is a proper time parameter along the curve. I age as I travel the loop. When I return to the spatial coordinates of my departure, I am older. The event of my return is distinct from the event of my departure because it has a different proper time value.
  The Weak Claim doesn't require linear time forever; it requires that *change* occurs. As long as there is a distinction between state *t* and state *t+1* along the worldline, passage is real. Gödel shows us that the topology of time can be strange, like a circle, but a circle still has a direction of travel. You can't have a circle without a line to bend into one. The line is the local passage.

  **Elena:** You're conflating the parameter *t* with the passage *of* *t*. The parameter exists in the Block Universe too. It's just a coordinate. You're insisting that the coordinate "lights up" as it is traversed. But what does the "lighting up" add to the physics?
  If we stick to our distinction: The Strong Claim is dead, we agree. The Weak Claim is... safe, perhaps. But it seems to be a metaphysical add-on. It rides on top of the causal structure without changing it.
  If I say, "The universe is a block, but it feels like it's passing," and you say, "The universe is passing, and it feels like it's passing," and we both agree on the metric, the light cones, and the CTCs... have we actually disagreed about the world? Or only about the label we paste on the manifold?

  **Marcus:** We've disagreed about the status of the observer. In your view, the observer is a static sub-structure reading a tape. In my view, the observer is a dynamic process *constituted* by the passage.
  If the Weak Claim is true, then the "now" is not just a label; it's the boundary of existence. In a Gödel universe, that boundary might loop, but it's still the boundary. The fact that the topology allows looping doesn't mean the boundary isn't real.
  Think of it this way: If you are walking in a circle, you are still walking. Denying the walking because the path loops seems like a category error. Gödel shows the path can loop. He doesn't show the walking stops.

  **Elena:** But if the path loops, the "future" I walk into is the "past" I came from. The ontological distinction between "fixed" and "open" vanishes.
  I think your Weak Claim is a holding action. It saves the *phenomenology* of time by retreating to the local light cone, but it surrenders the *ontology* of time to the geometry. You've made time safe for physics by making it indistinguishable from causal structure.
  But if time is just causal structure, then I win. Because causal structure is perfectly at home in the Block Universe. You've argued for the Weak Claim so effectively that you've argued yourself into my camp. You've defined "passage" in a way that is compatible with eternalism.

  **Marcus:** *[Laughs]* That's a dangerous victory, Elena. If you absorb the Weak Claim, you have to admit that the "now" is physically significant as the locus of causal interaction. You can't just treat it as a perspective.
  But perhaps that's where we rest. The Strong Claim is a fantasy of absolute simultaneity. Gödel killed that. But the Weak Claim—that there is a genuine, physical difference between the causal past and the causal future, experienced locally as passage—that survives the rotation. Whether you call that "passage" or "causal asymmetry" might be semantics. But whether that asymmetry is *ontologically robust* or just *entropic*... that's where I stand my ground.

  **Elena:** Then we agree on the physics, and we disagree on the metaphysics. And since the physics determines the observables, and the metaphysics doesn't...

  **Marcus:** ...Then the metaphysics determines what it means to be a physicist doing the observing.

  **Elena:** Fair enough. More coffee?

  **Marcus:** Please. But drink it before it gets cold. The arrow of time is waiting for no one.

  **Elena:** *[Smiling]* Or it's just thermodynamics doing its job.

  **Marcus:** Same thing, in the Weak Claim.

  *[They sit in silence for a moment, the hum of the refrigerator the only measure of time passing.]*
