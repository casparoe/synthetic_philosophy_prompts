  Three senior researchers in a genetics lab independently possess a dataset that, if published alone, would cure a rare disease (public benefit +50), but if published by two or more simultaneously, triggers a regulatory scandal halting all research (public harm -100); each researcher also gains a private career bonus (+20) for publishing first. The three agents are perfectly symmetric: equally informed of these payoffs, equally rational, and identically motivated to maximize the sum of public and private value. Because the harm threshold is two, if all three reason independently that the others are likely to publish, any single agent's restraint leaves two publishers—still triggering the scandal—while forfeiting the career bonus; thus, expecting the others to act, each calculates that acting yields a higher expected value than restraining, leading all three to publish, the scandal to occur, and the net outcome to be disastrous despite every agent acting on sound expected-value reasoning.

  (i) **Expected-Value Calculation and Structural Feature:**
  Let $P$ be the probability an agent assigns to another specific agent publishing. Assuming symmetry, each agent expects the others to publish with high probability (approaching 1 in equilibrium).
  $EV(\text{Act}) = \text{Private}(+20) + P(\text{Others} \ge 2) \times \text{Harm}(-100) + P(\text{Others} = 0) \times \text{Benefit}(+50)$.
  $EV(\text{Don't}) = P(\text{Others} \ge 2) \times \text{Harm}(-100) + P(\text{Others} = 1) \times \text{Benefit}(+50)$.
  In the equilibrium where agents expect others to Act ($P \approx 1$), the term $P(\text{Others} \ge 2)$ dominates both equations. The Harm becomes a "sunk" collective cost in the agent's calculation: since restraint by one agent cannot lower the count of publishers below the threshold of two (given the other two act), the harm is non-excludable. The calculation simplifies to comparing the Private Bonus (+20) against zero marginal change in the public outcome. Thus, $EV(\text{Act}) > EV(\text{Don't})$.
  **Structural Feature:** **The non-excludability of the threshold harm combined with the dilution of pivotality.** Because the harm is public and the threshold is lower than the total number of agents ($T < N$), an individual's restraint is causally inert in the equilibrium state, decoupling individual rationality from collective optimality.

  (ii) **Sequential vs. Independent Necessity:**
  If the agents act **sequentially**, the curse dissolves. The first agent acts (securing benefit). The second agent, observing the first, knows that acting would trigger the threshold (2 publishers) and cause harm; since the private bonus does not outweigh the certain public harm in a second-mover context, the second restrains.
  If each agent's action is **independently necessary** for the harm (an AND gate, where harm requires all 3 to act), the curse also dissolves. Here, every agent is strictly pivotal: $N$ acts cause harm, $N-1$ acts do not. Restraint by any single agent prevents the harm entirely, making the private bonus insufficient to justify the certain catastrophic marginal impact. The curse survives only under simultaneous, independent decision-making with a threshold $1 < T < N$.

  (iii) **Normative Status:**
  The case shows that the agents would be **better off** adopting a rule to act only when a collective decision procedure endorses it (e.g., flipping a coin to select one publisher), as this secures the cure without the scandal. Whether they are *rationally required* to adopt this rule depends on the conception of rationality. Under standard Nash rationality (individual best-response), they are not required to coordinate, as "All Act" is a stable equilibrium. However, under **Team Reasoning** or Pareto-based rationality, they are required to coordinate. The thought experiment primarily demonstrates that individual instrumental rationality is insufficient for collective optimality, implying a requirement to adopt collective reasoning only if one rejects the sufficiency of Nash equilibrium as a normative guide.

  (iv) **Critic's Attack:**
  A critic holding that agents should "act on their own best judgment" would attack the construction by arguing that **best judgment includes reasoning about the logical correlation between symmetric agents.** They would argue that in (i), the agent erroneously treats the others' actions as probabilistically independent events. A truly rational agent, recognizing the symmetry, should reason: "If I judge that Acting is correct, I must conclude that the others, being identical to me, will also judge Acting correct."
  To sustain this attack, the critic must deny the **causal or evidential independence** assumed in the expected-value calculation in (i). They must assert that an agent's decision provides evidence (or even determines) the decisions of symmetric peers (akin to Evidential or Logical Decision Theory), thereby collapsing the probability of "Others Act" to 1 if "I Act," which would make $EV(\text{Act})$ reflect the "All Act" disaster (-80 total) versus "All Don't" (0), reversing the prescription to restrain.
