  The ink on the containment order was still wet when the cheering started outside. Mara capped her pen. Through the thick glass of the Municipal building, she saw the bunting going up for the Honouring. Streamers of gold and green.

  Inside her tray lay the file for Elias Vane. Third fire this year. Not arson, the psychologists said. Just a configuration of impulse and access that resulted in combustion. No fault. Fault was a word they'd scrubbed from the statutes twenty years ago. You didn't punish the rain for flooding; you built levees. Elias was the flood. Mara was the levee-builder.

  Her job title was Responsibility Auditor. It sounded like a joke, but the pay was real. Her mandate was to scan official proceedings for lexical contaminants: *should, ought, deserve, guilty.* She flagged them, redlined them, sent them back for repair. But the mandate didn't cover what happened in her chest when she read the witness statements.

  *He laughed while it burned.*

  Mara felt a hot spike behind her sternum. It wasn't diagnostic. It wasn't systemic risk assessment. It was a desire for Elias to feel small. It was the old word, the forbidden one. *Blame.*

  She closed the file. The feeling didn't dissipate. According to the Town Charter, emotions were weather systems—high pressure, low pressure, nothing to claim ownership of. She wasn't responsible for the resentment any more than Elias was for the fire. But the resentment felt like it had an address. It wanted to live in Elias's throat.

  She walked out into the hall. The Honouring ceremony was in rehearsal. Mrs. Gable was standing at the podium, accepting the Community Weaver medal.

  "I chose to stay," Mrs. Gable said into the mic, testing the gain. "When others left, I built."

  The audience murmured approval. They were proud of her. More than that, they were proud of themselves for recognizing her. The town's great project—the removal of Ultimate Responsibility—was the thing they took the most credit for. The Mayor's draft speech lay on Mara's desk earlier; it thanked the citizens for their "moral evolution." They credited themselves for understanding they deserved no credit. It was a loop Mara couldn't audit out.

  She watched Mrs. Gable smile. The woman believed she had made herself into a builder. She believed the praise landed on her, not just on the causal chain that produced her. If Mara stepped up now and said, *You didn't make yourself,* the room would turn. They wouldn't hear logic. They'd hear ingratitude.

  The regress was the load-bearing wall nobody looked at. If you aren't responsible for yourself, you aren't responsible for the repair. But here they were, repairing.

  Mara went back to her office. The cheering outside swelled as a child was called up to be thanked for kindness. *Good boy,* the crowd thought. *Good boy.* The causality didn't matter to them when it felt good.

  She sat down with Elias's file again. The containment order required her signature. It meant indefinite housing in the North Wing. No punishment. Just safety.

  She picked up the pen. The resentment was still there, heavy and specific. It told her Elias was *wrong.* Her philosophy said the feeling was a misfire, a ghost limb from a time when people believed in souls that created themselves ex nihilo. But the ghost had weight. It pressed her hand down.

  She signed.

  If she didn't, Elias might burn a house with people in it. If she did, she was caging a man for being what he was. The town said this was mercy. Mara felt the sharp edge of judgment in the mercy. She was judging him unsafe, yes, but the heat in her blood said she was judging *him.*

  Outside, the band started playing. A song about rising up. About choice.

  Mara opened the drawer and put the pen away. She didn't flag her own heartbeat. She didn't write a report on the irony of the Honouring. She just sat in the quiet office, holding the heat in her chest, waiting for it to pass like weather, knowing it wouldn't. The system relied on her to be the machine that stopped the blame, but the machine ran on the fuel of the very thing it was designed to extinguish.

  She looked at the signature. It looked like a claim of ownership.

  ***

  **Note on Philosophical Liberties**
  Strawson argues Ultimate Responsibility (UR) is impossible for both praise and blame due to the regress of self-creation. The story exploits the town's asymmetry: keeping praise while abolishing blame. This liberties with Strawson's symmetry claim; if UR fails for blame, it fails for honour. However, the story suggests the town's pride in their "enlightened" system is itself a claim of UR, recreating the regress. My staging assumes the psychological impossibility of dropping blame while keeping credit is the system's fracture point. I'd change this if Strawson's argument is read as purely metaphysical rather than psychological; if the town truly believed the metaphysics, the pride would vanish. The story assumes belief is impossible, making the town hypocrites rather than consistent incompatibilists.
