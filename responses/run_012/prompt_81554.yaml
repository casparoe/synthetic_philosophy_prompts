  3.  **Character & Plot Outline:**
      *   **Protagonist:** Mara, Responsibility Auditor.
      *   **Setting:** The Town Hall, during the Annual Honouring (praise ceremony) or just before/after. Let's place it during the preparation for the ceremony, contrasting with a containment decision.
