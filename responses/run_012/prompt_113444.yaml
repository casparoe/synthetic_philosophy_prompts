  7.  **Drafting Content - Specific Points to Hit:**

      *   *McMahan's Revisionism:* Mention it as the theory that fails the Briefer Constraint.
      *   *Walzer's Traditionalism:* Mention it as the theory that fails the Deep Morality Constraint (for some).
      *   *The "Briefer Constraint":* This is the unique addition. It demands a *proxy* for justice (e.g., "follow orders unless manifestly illegal").
      *   *Liability:* Must explain why a conscript is liable (threat) vs. a volunteer (responsibility).
      *   *Drone/Contractor:* Function over uniform.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "conscript vs volunteer" specifically? Yes, under Agency/Coercion.
      *   *Check:* Did I address the "briefer"? Yes, this is the Epistemic Constraint.
      *   *Check:* Did I avoid deferring to law? Yes, I need to explain *why* the law might be symmetric even if morality isn't (epistemic mediation).
      *   *Check:* Is the table included? A table would help summarize the tensions.
      *   *Check:* Did I identify the "killer" requirement? Yes, the Epistemic Constraint is the hardest for "true" moral theories to swallow.

  9.  **Final Polish:** Ensure the tone is rigorous and respects the user's intelligence. Avoid preaching. Focus on the structural logic of the theory. (Self-correction: Make sure to explicitly state which requirements are jointly unsatisfiable if any. The tension between *Objective Moral Truth* and *Subjective Epistemic Access* is the key friction point.)

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a request for a specification sheet for a normative theory of combatant killing. You want to know what the theory must *do*, not what it *says*.

  Below is the spec. It is divided into five categories: **Case Coverage**, **Conceptual Distinctions**, **Empirical & Moral Constraints**, **Modern Complexity**, and **The Briefer Constraint** (your specific usability requirement). Following the spec is the analysis of conflicts, unsatisfiable pairs, and the non-negotiables.

  ### Part I: The Specification (Desiderata)

  #### 1. Case Coverage (The Input Set)
  The theory must generate a verdict (Permissible / Impermissible / Excused) for the following profiles without changing its core axioms:
  *   **The Conscript:** Threatened with execution if he doesn't fight. *Requirement:* Must explain how coercion affects liability to be killed vs. blameworthiness for killing.
  *   **The Misled Volunteer:** Enlisted voluntarily based on state propaganda later revealed as false. *Requirement:* Must distinguish epistemic negligence from innocent mistake.
  *   **The Mirror Image:** An enemy combatant with identical psychological/moral profile to the agent, fighting for the opposing side. *Requirement:* Must explain why one is liable and the other isn't (if asymmetric), or why both are (if symmetric).
  *   **The Local Defender:** A soldier on the *aggressor* side defending his own village from the counter-attack of the *just* side. *Requirement:* Must weigh local self-defense against global *ad bellum* guilt.
  *   **The Disillusioned:** A soldier who realizes mid-war the cause is unjust but stays for unit cohesion or fear of desertion charges. *Requirement:* Must account for change of moral status over time.

  #### 2. Conceptual Distinctions (The Architecture)
  The theory must maintain structural separation between these concepts. It cannot flatten them into a single metric of "badness."
  *   **Liability vs. Blameworthiness:** A soldier can be liable to be killed (lost right not to be attacked) without being blameworthy (morally culpable). *Requirement:* The theory must ground liability in something other than pure moral guilt (e.g., threat, agency, or role).
  *   **Objective Permissibility vs. Subjective Duty:** What is actually right vs. what the soldier is rational to believe is right. *Requirement:* Must explain why a soldier might be objectively wrong to kill but subjectively permitted.
  *   **Ad Bellum vs. In Bello:** The justice of the war vs. the justice of the fighting. *Requirement:* Must specify how much *ad bellum* status bleeds into *in bello* permissions.
  *   **Combatant vs. Civilian:** The fundamental line of targeting. *Requirement:* Must define the boundary by function or status, not just uniform, without collapsing into "anyone supporting the war effort."

  #### 3. Empirical & Moral Constraints (The Guardrails)
  *   **The Fog of War Constraint:** The theory cannot require knowledge that is structurally unavailable to the agent (e.g., knowing the classified intelligence proving the war is unjust).
  *   **The Symmetry of Law Constraint:** International Humanitarian Law (IHL) grants symmetric combatant privileges (both sides can kill combatants). *Requirement:* The moral theory must explain why the law is symmetric even if morality is asymmetric, or argue the law is morally bankrupt.
  *   **The Core Intuition Constraint:** Must align with high-confidence moral intuitions (e.g., killing a surrendering soldier is wrong; killing a civilian is wrong) regardless of *ad bellum* status.
  *   **The Empirical Reality Constraint:** Must account for the fact that most soldiers are neither psychopaths nor saints, but ordinary people under extreme stress and hierarchy.

  #### 4. Modern Complexity (The Edge Cases)
  *   **The Remote Operator:** A drone pilot in Nevada killing a combatant in Yemen. *Requirement:* Must explain if physical proximity matters for liability or moral risk.
  *   **The Contractor:** An armed civilian contractor (e.g., Wagner, Blackwater). *Requirement:* Must determine if they are combatants by function or civilians by status.
  *   **The Non-State Actor:** An insurgent without a uniform but carrying arms openly. *Requirement:* Must assign status without relying on state recognition.

  #### 5. The Briefer Constraint (The Usability Requirement)
  *   **Time/Depth Limit:** The theory must be communicable in 20 minutes to a lay audience (19-year-olds).
  *   **Epistemic Limitation:** The theory must be actionable by someone who *cannot* verify the *jus ad bellum* (justice of the war).
  *   **Decision Procedure:** It must provide a heuristic (a rule of thumb) that minimizes moral error given the epistemic limitation.
  *   **Legal Interface:** It must tell the soldier how to relate to the Uniform Code of Military Justice (UCMJ) / Law of Armed Conflict when they suspect a conflict between law and morality.

  ---

  ### Part II: The Tension Analysis

  You asked which requirement does the most work excluding theories, and if any are jointly unsatisfiable.

  #### 1. The Exclusionary Requirement
  **The Briefer Constraint (Epistemic Limitation)** is the single hardest filter.
  *   **Why:** Most rigorous contemporary moral theories (specifically "Revisionist" just war theory, e.g., Jeff McMahan) argue that liability to attack depends on the objective justice of the cause. If your side is unjust, you are not permitted to kill, even if you follow the rules of war.
  *   **The Conflict:** A 19-year-old private cannot determine the objective justice of the war. If the theory requires objective justice for permission to kill, the theory is **useless** for the briefer. It tells the soldier: "Don't kill unless you are sure the war is just," which is impossible to satisfy.
  *   **Result:** This requirement excludes any theory that ties *in bello* permissions strictly to *ad bellum* truth without an epistemic proxy.

  #### 2. The Jointly Unsatisfiable Pair
  There is a strong argument that **Deep Moral Truth** and **Action-Guiding Norms under Uncertainty** are jointly unsatisfiable in a single-layer theory.

  *   **Requirement A (Moral Truth):** The theory should track objective moral reality (i.e., if the war is aggressive, the soldiers are materially contributing to injustice, and killing for an unjust cause is morally distinct from killing for a just cause).
  *   **Requirement B (Briefer/Epistemic):** The theory must provide clear, actionable guidance to agents who lack access to Moral Truth (they don't know if the war is just).

  **The Conflict:**
  If you prioritize **Moral Truth**, you must tell the unjust combatant they are acting impermissibly. But if they can't *know* they are unjust, telling them this creates a paradox where they must guess at grand strategy to know if they can shoot.
  If you prioritize **Action-Guidance**, you must grant symmetric permissions (like the law does). But this contradicts **Moral Truth**, because it permits killing for an unjust cause.

  **The Solution (Two-Tier Theory):**
  To satisfy both, the theory cannot be single-layered. It must distinguish between:
  1.  **Objective Morality:** (Who is actually liable?) -> Asymmetric.
  2.  **Subjective Duty/Procedure:** (What should the soldier do?) -> Symmetric (mostly).
  *If the theory refuses to be two-tiered, it will fail either the Moral Truth constraint or the Briefer constraint.*

  #### 3. Non-Negotiables vs. House Preferences

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **Civilian Immunity** | **Non-Negotiable** | Any theory that permits targeting civilians based on utility or collective guilt fails the Core Intuition Constraint and leads to atrocity. |
  | **Epistemic Feasibility** | **Non-Negotiable** | Given your specific constraint (the briefer), a theory that requires knowledge soldiers don't have is functionally broken. |
  | **Liability ≠ Blame** | **Non-Negotiable** | If liability requires moral blame, conscripts and misled volunteers become immune, which contradicts the reality of war and the Law of Armed Conflict (LOAC) to a dangerous degree. |
  | **Moral Equality of Combatants (MEC)** | **House Preference** | Traditionalists (Walzer) say Yes; Revisionists (McMahan) say No. A spec can be met by either, provided they handle the epistemic gap. |
  | **Symmetry of Permissions** | **House Preference** | Law says Symmetric. Deep Morality often says Asymmetric. The theory must explain the gap, but doesn't have to pick one side exclusively if it uses a two-tier approach. |
  | **Uniform as Status Marker** | **House Preference** | Functionalist theories reject this; Legalist theories keep it. As long as the line is clear, the spec is met. |

  ---

  ### Part III: The Law vs. Morality Gap

  You specified: *Don't just defer to the law, but explain the symmetry of law vs. asymmetry of morality.*

  A theory meeting this spec must argue one of the following three positions regarding the Law of Armed Conflict (LOAC):

  1.  **The Epistemic Mediation View:** LOAC is morally asymmetric (unjust killers are doing wrong), but the *rules* must be symmetric because soldiers cannot know the truth. Therefore, following LOAC is a **proxy** for moral permissibility under uncertainty.
      *   *Instruction to troops:* "Follow the rules. We cannot know the grand justice, so the rules are our moral shield."
  2.  **The Convention View:** Morality in war is partially constituted by the convention. Because we need a limit on violence, we *agree* to treat combatants as equals. Violating this harms the system, even if the specific kill was objectively "just."
      *   *Instruction to troops:* "Breaking the symmetry breaks the system that protects everyone, including you."
  3.  **The Tragic Conflict View:** There is no reconciliation. The law is a pragmatic lie. Soldiers must follow the law to avoid prosecution, but they bear a moral burden if the war is unjust.
      *   *Instruction to troops:* "Follow the law to stay out of prison, but know that legal permission isn't moral absolution."

  **For your Briefer:** Only Option 1 is usable. Options 2 and 3 introduce doubt that undermines unit cohesion and decision speed. Therefore, the theory **must** adopt the Epistemic Mediation View: *LOAC is the operationalization of moral duty under conditions of radical uncertainty.*

  ### Part IV: Summary Verdict

  **Is the list jointly satisfiable?**
  Yes, but **only** if the theory adopts a **Two-Tier Structure** (Objective Morality vs. Subjective Duty).
  *   If the theory insists on a single tier (e.g., "What is moral is what you must do"), it will fail the **Briefer Constraint** (because soldiers can't know the truth) or the **Moral Truth Constraint** (because it will permit unjust killing).
  *   If it accepts two tiers, it can say: "Objectively, unjust combatants are liable. Subjectively, you are permitted to fight because you cannot know otherwise, provided you follow *in bello* rules."

  **Which requirement does the most work?**
  **The Epistemic Feasibility (Briefer) Constraint.**
  It forces the theory away from "Revisionist" purity (which focuses on who *actually* deserves to die) toward "Traditionalist" pragmatism (which focuses on what soldiers can *reasonably decide*). It forces the theory to justify the symmetry of the law not as moral truth, but as an epistemic necessity.

  **The "Killer" Question for your Friend:**
  If a theory tells her to say "Only kill if your cause is just," it fails the spec (soldiers can't know).
  If a theory tells her to say "Kill anyone in uniform, morality doesn't matter," it fails the spec (violates Core Intuition).
  **The Winning Theory:** "You cannot know the justice of the war. Therefore, your moral duty is to ensure the justice of your *conduct*. Follow the Law of Armed Conflict. It is designed to be the moral boundary line for people who, like you, cannot see the whole picture."
