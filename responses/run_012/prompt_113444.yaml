      *   **Tone:** Analytical, precise, philosophical but grounded, no fluff.

  2.  **Deconstruct the Desiderata (The "Spec"):**

      *   *Case Coverage:* The theory must account for the "Moral Equality of Combatants" (MEC) debate.
          *   Conscript (coercion).
          *   Misled Volunteer (epistemic limitation).
          *   Symmetric Enemy (mirror image).
          *   Aggressor-Defender (local vs. global justice).
          *   Disillusioned Soldier (change of status).
      *   *Conceptual Distinctions:*
          *   Liability (forfeiture of right not to be killed) vs. Blameworthiness (moral culpability).
          *   *Jus ad Bellum* (justice of war) vs. *Jus in Bello* (justice in war).
          *   Combatant vs. Civilian (the fundamental line).
      *   *Empirical/Moral Constraints:*
          *   Must not demand impossible knowledge.
          *   Must align with core intuitions (e.g., killing surrendering soldiers is wrong).
          *   Must account for the "fog of war."
      *   *Modern Warfare:*
          *   Remote killing (drones).
          *   Mercenaries/Contractors.
          *   Non-state actors (insurgents/terrorists).
      *   *The "Briefer Constraint" (Epistemic/Action-Guiding):*
          *   Must be actionable under uncertainty.
          *   Must function even if the war is unjust (*ad bellum* uncertainty).
          *   Must be communicable in 20 minutes.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *D1: The Epistemic Constraint.* This is the briefer's requirement. Soldiers can't know the grand strategic justice. Theory must work under uncertainty.
      *   *D2: The Liability Constraint.* Killing must be grounded in liability, not just utility. Why is *this* person killable?
      *   *D3: The Symmetry/Asymmetry Tension.* Law says symmetric (both sides can kill). Morality often says asymmetric (only just side can kill). Theory must reconcile or explain the gap.
      *   *D4: The Distinction Constraint.* Must clearly separate combatants from civilians.
      *   *D5: The Coercion/Agency Constraint.* Must handle conscripts vs. volunteers without collapsing.
      *   *D6: The Temporal Constraint.* Status changes (surrender, disillusionment).

  4.  **Analyzing Conflicts (The "Hard Part"):**

      *   *The Big Conflict:* **Deep Morality (Revisionism) vs. Action-Guiding Norms (Traditionalism).**
      *   *Revisionists (e.g., McMahan):* Only just combatants can kill. Unjust combatants are liable, just ones aren't.
      *   *Traditionalists (e.g., Walzer):* Moral Equality of Combatants (MEC). Both sides can kill, provided they follow *in bello* rules.
      *   *The Briefer Constraint kills Revisionism.* If the theory says "Don't kill unless you know your cause is just," it fails the briefer. 19-year-olds *can't* know.
      *   *The Moral Constraint kills Traditionalism (for some).* If the theory says "It's okay to kill for an unjust cause," it violates the intuition that killing for aggression is murder.
      *   *Joint Unsatisfiability?* It is highly likely that *Deep Moral Truth* and *Epistemic Action-Guidance* are in tension. We might need a two-tier theory (Objective Morality vs. Subjective Duty).

  5.  **Refining the "Non-Negotiables":**

      *   Non-Negotiable: Epistemic Feasibility (Briefer constraint). If it can't be used, it's useless for the stated purpose.
      *   Non-Negotiable: Civilian Immunity. If it blurs this, it's catastrophic.
      *   Negotiable: Moral Equality of Combatants. This is the battleground.
      *   Negotiable: Liability based on Threat vs. Liability based on Responsibility.

  6.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the frustration. State the goal (a spec sheet).
      *   **Section 1: The Desiderata (The Spec).** Grouped by Category (Cases, Distinctions, Constraints, Modernity, Usability).
      *   **Section 2: The Tension Analysis.** Address the "jointly unsatisfiable" question. Identify the biggest exclusionary requirement.
      *   **Section 3: Non-Negotiables vs. House Preferences.**
