          *   Key distinctions (permissibility vs. blameworthiness, liability vs. desert, *ad bellum* vs. *in bello*, combatant vs. civilian).
          *   Constraints (moral intuitions, empirical realities of war).
          *   Modern complexities (contractors, drone operators, non-state actors).
          *   **Crucial Constraint:** Usability for a legal briefer (20 mins, 19-year-olds, epistemic limitation regarding *jus ad bellum*).
          *   **Meta-Analysis:** Which requirement excludes the most theories? Are any jointly unsatisfiable? Which are non-negotiable vs. optional?
