      *Actually, the strongest incompatibility is between **Contextual Plausibility** and **Distinctiveness**.*
      *   Req A: Must fit context (to be historical).
      *   Req B: Must differ from context/church (to be identifiable as *him*).
      *   If A is strict, B fails. If B is strict, A fails.
      *   Also: **Independence** vs. **Coherence**. Coherence relies on previous judgments, violating independence.

      *Let's focus the Incompatibility Argument on the triad: Diagnosticity, Yield, and Coherence.*
      1.  High Diagnosticity (strict criteria).
      2.  Adequate Yield (enough data for a bio).
      3.  Contextual Coherence (makes sense as a 1st C. Jew).
      *Pick two.*
      *   High Diagnosticity + Coherence = Low Yield (The "Strange Jesus" who is historically certain but inexplicable).
      *   High Diagnosticity + Yield = Low Coherence (The "Fragmented Jesus").
