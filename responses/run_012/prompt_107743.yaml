answer: |-
  ### Brainstorm: The Space of Demands on Authenticity Criteria

  Before committing to a formal list, we must map the conflicting pressures placed on any methodological tool designed to isolate the "historical Jesus." The field is pulled in opposing directions by different stakeholders and logical necessities:

  *   **The Historian's Demand:** The tool must distinguish between *what happened* and *what was reported*. It requires independence from the theological agenda of the sources.
  *   **The Skeptic's Demand:** The burden of proof lies on the claimant. The criterion must minimize false positives (accepting inauthentic material).
  *   **The Maximalist's Demand:** The sources should be trusted until proven false. The criterion must minimize false negatives (rejecting authentic material).
  *   **The Biographer's Demand:** The output must be sufficient to construct a coherent agent. A method that yields only three sayings is methodologically sound but historically useless.
  *   **The Contextualist's Demand:** The output must make sense within Second Temple Judaism. A method that produces a Jesus who looks like a 20th-century existentialist is failing.
  *   **The Logician's Demand:** The method must not be circular. One cannot use the output of the criterion to validate the criterion.
  *   **The Bayesian Demand:** The criterion must alter probabilities. It must be more likely to appear if the event occurred than if it did not.

  ---

  ### Desiderata for an Adequate Criterion of Authenticity

  To count as adequate, a criterion must satisfy the following requirements. I have categorized them by their status within the discipline.

  #### 1. Differential Diagnosticity (The Likelihood Ratio Requirement)
  *   **Definition:** The presence of the criterion in a tradition must be significantly more probable given the hypothesis of authenticity ($H$) than given the hypothesis of inauthenticity ($\neg H$). Formally, the Likelihood Ratio $LR = P(C|H) / P(C|\neg H)$ must be $> 1$, ideally $\gg 1$.
  *   **Case:** If a feature appears just as often in later church invention as in Jesus' ministry, it cannot discriminate between them.
  *   **Status:** **Non-Negotiable.** (Logical necessity for any evidentiary claim).

  #### 2. Contextual Plausibility
  *   **Definition:** The material must be intelligible within the linguistic, cultural, and religious milieu of 1st-century Galilee/Judea.
  *   **Case:** A historical agent cannot act outside their historical horizon. If a saying presupposes post-70 CE Gentile church debates, it fails this test.
  *   **Status:** **Non-Negotiable.** (Definition of "historical").

  #### 3. Independence of Application
  *   **Definition:** The application of the criterion to a specific unit of tradition must not depend on the prior authentication of other units using the same or related criteria.
  *   **Case:** To avoid circularity. One cannot authenticate Saying B because it coheres with Saying A, if Saying A was authenticated because it coheres with Saying B.
  *   **Status:** **Non-Negotiable.** (Logical necessity).

  #### 4. Distinctiveness from Early Christianity
  *   **Definition:** The material should not reflect the specific theological interests, vocabulary, or problems of the post-Easter church.
  *   **Case:** The Gospels are products of the believing community. To find the pre-Easter Jesus, one must filter out the Easter faith.
  *   **Status:** **Tradition-Specific Commitment.** (Dominant in the "Old Quest" and "New Quest," increasingly contested in the "Third Quest" and memory theory approaches).

  #### 5. Sufficient Data Yield
  *   **Definition:** The criterion must identify enough discrete units of tradition to allow for the construction of a coherent historical profile (intentions, actions, social location).
  *   **Case:** A method that validates only two sayings is historically sterile. History requires patterns, not atoms.
  *   **Status:** **Non-Negotiable for the Goal, but not the Method.** (This is a pragmatic constraint on the *utility* of the criteria, not their logical validity).

  #### 6. Continuity of Effects
  *   **Definition:** The authenticated material must provide a plausible explanation for the rise of the movement that followed (the Church).
  *   **Case:** If the reconstructed Jesus is a cynic sage who denied eschatology, but the movement immediately becomes apocalyptic, the reconstruction fails to explain the effect.
  *   **Status:** **Tradition-Specific Commitment.** (Prioritized by sociological historians; less so by philological specialists).

  ---

  ### Bayesian Reframing of Familiar Criteria

  Treating criteria as Likelihood Ratios ($LR$) exposes their structural weaknesses. An $LR$ near 1 means the evidence is useless; an $LR < 1$ means the evidence counts *against* authenticity.

  1.  **Criterion of Dissimilarity (Distinctiveness):**
      *   *Framing:* $P(\text{Dissimilar} | \text{Jesus}) / P(\text{Dissimilar} | \text{Church})$.
      *   *Analysis:* This assumes $P(\text{Dissimilar} | \text{Jesus})$ is high. But Jesus was a 1st-century Jew. Most of his authentic speech *should* resemble Judaism ($P(\text{Similar} | \text{Jesus})$ is high). Therefore, demanding dissimilarity artificially lowers the numerator.
      *   *Verdict:* **Destroys Contextual Plausibility.** It preserves Diagnosticity only by sacrificing Representativeness. It yields a "strange" Jesus who is historically certain but historically unintelligible.

  2.  **Criterion of Embarrassment:**
      *   *Framing:* $P(\text{Embarrassing} | \text{Jesus}) / P(\text{Embarrassing} | \text{Church})$.
      *   *Analysis:* The denominator is low (Church rarely invents shameful stories). The numerator is moderate (Jesus did things the Church found awkward). This yields a high $LR$.
      *   *Verdict:* **Preserves Diagnosticity, Destroys Yield.** There are very few embarrassing traditions. Relying on this alone creates a fragmented dataset insufficient for a biography.

  3.  **Criterion of Multiple Attestation:**
      *   *Framing:* $P(\text{Attested in X, Y, Z} | \text{Jesus}) / P(\text{Attested in X, Y, Z} | \text{Myth})$.
      *   *Analysis:* This increases the probability of *antiquity* (the tradition is old), but not necessarily *authenticity*. An early myth can be multiply attested (e.g., in Mark, Q, and John).
      *   *Verdict:* **Weakens Diagnosticity.** It conflates "early tradition" with "historical event." It satisfies Yield but fails to guarantee $H$ over $\neg H$.

  4.  **Criterion of Coherence:**
      *   *Framing:* $P(\text{Coheres with Core} | \text{Jesus}) / P(\text{Coheres with Core} | \text{Church})$.
      *   *Analysis:* This depends entirely on the "Core" established by other criteria. If the Core is small (due to strict Dissimilarity), Coherence amplifies error. If the Core is large, it risks circularity.
      *   *Verdict:* **Destroys Independence.** It violates Desideratum #3. It cannot generate new probability, only distribute existing probability.

  ---

  ### The Impossibility Theorem: Why the Criteria Have Not Settled the Question

  The persistent stalemate in Historical Jesus research is not primarily due to a shortage of evidence (the "data" of the Gospels is fixed), but because the **Desiderata listed above contain a logical incompatibility.** Specifically, one cannot jointly satisfy **High Diagnosticity**, **Contextual Coherence**, and **Sufficient Yield**.

  This functions as a "Trilemma" for the historical Jesus quest:

  1.  **If you prioritize Diagnosticity (Rigor):** You must use strict criteria like Dissimilarity and Embarrassment.
      *   *Result:* You get a high Likelihood Ratio for the items you keep.
      *   *Cost:* You violate **Contextual Plausibility** (Jesus becomes unlike his milieu) and **Sufficient Yield** (you have too few data points to explain the rise of Christianity). You end up with a "historical" Jesus who is an anomaly in his own time and ineffective in his own history.

  2.  **If you prioritize Contextual Coherence and Yield:** You accept material that fits 1st-century Judaism and explains the movement (Continuity of Effects).
      *   *Result:* You get a coherent, intelligible Jewish prophet who explains the Church.
      *   *Cost:* You violate **High Diagnosticity**. Since the Early Church was also Jewish and also produced coherent theology, $P(\text{Contextual} | \text{Church})$ is roughly equal to $P(\text{Contextual} | \text{Jesus})$. The Likelihood Ratio approaches 1. You have a plausible Jesus, but no methodological way to distinguish him from the Church's memory of him.

  3.  **If you prioritize Independence:** You refuse to let Coherence validate new sayings.
      *   *Result:* You avoid circularity.
      *   *Cost:* You violate **Sufficient Yield**. Without Coherence, the "authentic" atoms do not stick together to form a portrait. You have verified fragments, not a historical agent.

  **The Argument:** The criteria have never settled who Jesus was because the methodological requirements for *certainty* (High Diagnosticity) are mutually exclusive with the methodological requirements for *intelligibility* (Coherence/Context).
  *   To be **certain**, Jesus must be unique (Dissimilar).
  *   To be **intelligible**, Jesus must be typical (Contextual).
  *   To be **historical**, he must be both.
  *   But the criteria treat Uniqueness and Typicality as opposing vectors.

  Consequently, research traditions self-select based on which desideratum they are willing to sacrifice. Skeptics sacrifice Yield (accepting we know almost nothing). Theologians sacrifice Diagnosticity (accepting the Gospel portrait as largely historical). Mainstream historians oscillate between the two, producing shifting portraits (Apocalyptic Prophet vs. Cynic Sage) that reflect which side of the trilemma they are privileging at the moment.

  ---

  ### Consensus vs. Contested Views

  To maintain historical rigor, we must distinguish what is settled from what remains debated.

  **Settled Among Specialists (Consensus):**
  *   **Jesus was a 1st-century Palestinian Jew.** Any reconstruction that detaches him from Second Temple Judaism is rejected.
  *   **Jesus was baptized by John the Baptist.** This satisfies Embarrassment and Multiple Attestation; it is the "anchor" of most reconstructions.
  *   **Jesus was crucified under Pontius Pilate.** This is historically secure and satisfies the criterion of Roman/Jewish embarrassment.
  *   **The Gospels are not modern biographies.** They are theological narratives (kerygma) written decades after the fact. They cannot be read as transparent transcripts.
  *   **The "Criteria of Authenticity" approach is methodologically fragile.** There is broad agreement that the classic criteria (especially Dissimilarity) are flawed when used as mechanical filters. (See the 2014 *Journal for the Study of the Historical Jesus* roundtable "The Authenticity Criteria: A Roundtable Discussion").

  **Genuinely Contested:**
  *   **The Utility of the Criteria:** Some scholars (e.g., Chris Keith, Anthony Le Donne) argue the criteria should be abandoned entirely in favor of "Social Memory Theory," claiming the search for an "uninterpreted" Jesus is impossible. Others (e.g., John P. Meier's successors) argue for refined, probabilistic usage. **This is the primary methodological contest.**
  *   **The Eschatological Scope:** Was Jesus an apocalyptic prophet who expected the end within his generation (Schweitzer, Sanders, Ehrman), or did he preach a realized/non-apocalyptic kingdom (Crossan, Borg)? The criteria yield different results depending on whether "Apocalyptic" is treated as Contextual (typical) or Dissimilar (if the Church moved away from it).
  *   **The Self-Understanding:** Did Jesus claim divine authority or messianic status explicitly? The criterion of Dissimilarity suggests "No" (Church would invent that); the criterion of Contextual Plausibility suggests "Yes" (movements need leaders). The criteria cancel each other out here.
  *   **The Miracle Workers:** Does the "Contextual Plausibility" of 1st-century wonder workers authenticate the miracle stories, or does the "Naturalistic Presupposition" of modern history rule them out *a priori*? This is a philosophical, not just historical, contest.

  **Conclusion:** The failure to settle the identity of Jesus is not merely an evidentiary deficit. It is a structural feature of the methodological demands. We possess a method that guarantees certainty only at the cost of coherence, and coherence only at the cost of certainty. Until a framework emerges that can reconcile the Likelihood Ratio of Distinctiveness with the Probability of Contextual Typicality, the "Historical Jesus" will remain a reflection of the historian's own resolution of this impossibility.
