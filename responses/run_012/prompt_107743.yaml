          2.  Commit to a list of desiderata (requirements) for an adequate criterion.
          3.  Include the case/consideration behind each requirement.
          4.  Mark requirements as "Non-Negotiable" vs. "Tradition-Specific Commitments."
          5.  Treat each criterion as supplying a likelihood ratio (Bayesian framing: $P(E|H) / P(E|\neg H)$).
          6.  Analyze what this reframing preserves or destroys in familiar criteria (Embarrassment, Dissimilarity, Multiple Attestation, Coherence).
          7.  **Crucial:** Argue that a subset of requirements cannot be jointly satisfied (impossibility theorem/incompatibility), and suggest this is why the criteria haven't settled the historical Jesus question (more so than lack of evidence).
          8.  Distinguish between settled specialist views and genuinely contested views (avoid presenting contested views as consensus).

  2.  **Brainstorming the "Full Space" of Demands:**
      *   What do historians want? Truth, probability, distinctiveness, continuity, explanatory power.
      *   What do theologians want? Relevance, continuity with faith, dogmatic safety.
      *   What do skeptics want? Rigor, high bar for supernatural claims, removal of tradition.
      *   What do maximalists want? Trust in sources, benefit of the doubt.
      *   Technical demands: Falsifiability, independence of sources, contextual plausibility, linguistic consistency.
      *   Logical demands: Non-circularity, consistency across applications.
      *   Outcome demands: A coherent portrait, enough data to work with.

  3.  **Developing the Desiderata (The List):**
      *   Need to select the most critical ones for the argument about incompatibility.
      *   *Candidate 1: Source Independence.* (Multiple attestation).
      *   *Candidate 2: Contextual Plausibility.* (Fits 1st Century Judaism).
      *   *Candidate 3: Distinctiveness.* (Dissimilarity).
      *   *Candidate 4: Explanatory Power.* (Explains the rise of the movement).
      *   *Candidate 5: Non-Circularity.* (Can't assume the conclusion).
      *   *Candidate 6: Sufficient Yield.* (Must produce enough data to form a picture).

      *Refining for the "Incompatibility" Argument:* The classic tension is between *Distinctiveness* (Dissimilarity) and *Contextual Plausibility* (Continuity). If Jesus must be unlike Judaism *and* like Judaism, we have a problem. Also, *Strict Rigor* (high likelihood ratio) vs. *Sufficient Yield*. If the bar is too high, you get no data. If the bar is low, you get noise.

      *Bayesian Reframing:* A criterion is useful if it raises the probability of authenticity. $P(Authentic | Criterion) > P(Authentic)$. This requires $P(Criterion | Authentic) > P(Criterion | Inauthentic)$.

  4.  **Drafting the Desiderata with Bayesian Framing:**

      *   *Desideratum 1: Differential Diagnosticity (The Likelihood Ratio).* The criterion must apply more frequently to authentic material than inauthentic material. (Non-Negotiable).
      *   *Desideratum 2: Contextual Embedding.* The material must fit the 1st-century Palestinian Jewish context. (Non-Negotiable for history, but tricky).
      *   *Desideratum 3: Distinctiveness from Early Church.* The material should not look like it was created to solve later church problems. (Tradition-Specific: Skeptical tradition).
      *   *Desideratum 4: Sufficient Data Yield.* The criterion must identify enough units to construct a coherent historical agent. (Non-Negotiable for the *goal* of a biography, but maybe not for the *method* itself).
      *   *Desideratum 5: Independence of Application.* The application of one criterion shouldn't depend on the outcome of another (to avoid circularity). (Non-Negotiable).

  5.  **Analyzing Familiar Criteria through the Bayesian Lens:**
      *   *Criterion of Dissimilarity:* High likelihood ratio for uniqueness, but low prior probability (Jesus was a Jew). Destroys *Contextual Embedding*.
      *   *Criterion of Embarrassment:* High likelihood ratio ($P(Embarrassing | Church) < P(Embarrassing | Jesus)$), but low yield.
      *   *Criterion of Multiple Attestation:* Increases probability of antiquity, but not necessarily authenticity (could be early myth).
      *   *Criterion of Coherence:* Low likelihood ratio (depends on the initial core). Destroys *Independence*.

  6.  **The Core Argument: Incompatibility (The "Impossibility Theorem"):**
      *   The prompt asks for the argument that requirements cannot be jointly satisfied.
      *   *Tension:* **Rigor (High Likelihood Ratio)** vs. **Representativeness (Sufficient Yield/Coherence)**.
      *   If you demand high diagnosticity (Dissimilarity/Embarrassment), you get a Jesus who is weird and disconnected from his context and movement.
      *   If you demand Contextual Plausibility and Coherence, you lower the likelihood ratio (because the early church was also Jewish and coherent).
      *   *The "Catch-22":* To be historically certain (High LR), the data must be unique. To be historically intelligible (Context/Coherence), the data must be typical. You cannot be both uniquely authentic and typically intelligible using these tools.
      *   *Result:* This explains the stalemate better than "lack of evidence." The tools themselves filter out the very data needed to make the picture coherent.

  7.  **Distinguishing Consensus vs. Contested:**
      *   *Consensus:* Jesus was a 1st-century Jew; he was baptized by John; he was crucified by Pilate. The "Criteria of Authenticity" approach is currently under heavy fire (the "Third Quest" fatigue).
