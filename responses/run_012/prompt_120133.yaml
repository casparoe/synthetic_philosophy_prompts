  5.  **Selecting and Ranking the Top 3:**

      *   *Top Pick:* **Q1 (Isomorphism Rigor).** This is the foundation. If the analogy is just a metaphor, the rest doesn't matter. It uses everyone's skills (Bio explains replication, Logic explains Gödel, Phil synthesizes).
      *   *Second Pick:* **Q3 (Arbitrariness of the Code).** This is the specific mechanism that makes the isomorphism work. It connects the "syntax/semantics" gap. It's tractable for a semester.
      *   *Third Pick:* **Q2 (Necessity of Self-Reference).** This is the "so what?" question. If replication doesn't *need* this, Hofstadter's point weakens. It allows the biologists to bring in autocatalytic sets (Kauffman) vs. template replication.

      *   *Cuts:*
          *   *Q4 (Build a simulator):* Too much engineering, might distract from the philosophical/biological argument. Good tool, bad *question*.
