prompt: |-
  OK, so — I've been rereading Hofstadter, specifically the Typogenetics stuff in GEB, and I want to build something out of it. If you don't know it: it's a toy universe with strands of letters (the four DNA bases) and "enzymes" that are themselves spelled out as letter-strings, and they operate on strands — chopping, copying, moving segments around — and the whole point of the toy is that it's just rich enough that a strand can, in principle, manufacture a copy of itself out of parts lying around. Hofstadter's big move, as I understand it, is that this kind of self-replication is isomorphic to Gödel's self-referential construction: in both cases you set up an arbitrary code (Gödel numbering, the genetic code), and the code is what lets a system of dumb syntactic shuffling end up referring to itself. DNA is supposedly the real-world instance — a strange loop made of chemistry. If I've mangled either the logic or the biology, flag it.

  Here's what I want. I'm running a reading group next semester: five of us — me (blogs and philosophy, no lab skills to speak of), two people who do molecular bio, two who do logic and programming languages. I want us to come out the other end with an actual deliverable: a workshop paper, or a blog series good enough that people link it. So tell me which two or three open questions in this vicinity are worth a semester, in order, and why. Candidate list I've been chewing on, which you should feel free to add to or throw out:

  - Is the isomorphism a theorem or a metaphor? Is there a precise sense in which DNA replication instantiates Gödelian self-reference, or is the shared content basically "both of these diagrams look self-referential"?
  - Does self-replication actually *require* self-reference? Hofstadter treats self-ref and self-rep as two faces of one thing, but that might be a slogan rather than an argument — autocatalytic sets, von Neumann-style constructors, quines that don't obviously encode themselves...
  - How much work is the arbitrariness of the code doing? The genetic code is arbitrary and redundant; Gödel numbering is arbitrary. Deep shared feature, or just the fact that both things get called "codes"?
  - What would a modern typogenetics even be, and would building or running one settle anything, or is it a ladder you throw away once you've climbed it?
  - Does any of this cash out for the origin of life — bootstrapping a code that's *about* something before there's any aboutness to go around?

  Rank them for me. What I actually want is the reasoning: which question is upstream of which, what's tractable for that specific mixed group, which ones are definately semester-long rabbit holes with no deliverable, and where the real crux sits. Steelman the ones you cut before you cut them. Don't just list things — defend an ordering, and be explicit about what you're optimizing for when you order them, because "important" means nothing without that. I care alot more about the defense than the list.

  Answer as someone who genuinely knows both sides: a philosopher of biology who has read the actual molecular biology and also has the Gödel material cold, not someone who read GEB once in college and got excited. Think it through carefully. Maybe spend the first part of the answer brainstorming a longer list of candidate questions and only then cut it down, so I can see what got dropped and why. And tell me what would change your mind: which argument or piece of evidence, if it went the other way, would move a question up or down your ranking — and where your ranking is most likely to be wrong.

  American English, please.
