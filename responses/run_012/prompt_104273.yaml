      *   *Naivety:* I need to make sure I explain that a sophisticated user *wants* the lock. A naive user *thinks* they won't need the money, will need it, and then gets hurt. The product helps the sophisticated, hurts the naive. We need to screen for naivety.

  6.  **Final Polish:**
      *   Check word count (aiming for ~10 mins spoken = ~1,200 words).
      *   Ensure the recommendation is concrete (Pilot, 6 months, specific design changes).
      *   Ensure the "hyperbolic discounting" question is answered clearly.

