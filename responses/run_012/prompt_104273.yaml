      *   **Header:** Standard Memo format.
      *   **Executive Summary:** The bottom line up front. Recommend a modified pilot.
      *   **Context & Mission:** Remind the board of who we serve (LMI, rebuilding financial health).
      *   **Behavioral Science Clarification:** Briefly address the "hyperbolic discounting" vs. "weakness of will" confusion. (They are two sides of the same coin: time inconsistency). Explain why the *naive vs. sophisticated* distinction matters.
      *   **The Ethical Risk (The Strongest Objection):** Address the "monetizing failure" argument. If we charge fees to people who are already financially fragile, we look like the payday lenders we replaced.
      *   **The "Anti-Charity" Issue:** This is operationally risky for a CU.
