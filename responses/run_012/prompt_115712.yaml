prompt: |-
  My friend and I spent half of last night arguing about crisis triage — you know, the protocols hospitals use when there arent enough ventilators or ICU beds, where the rule is save the most lives, or the most life-years, and during covid some states actually published scoring sheets that ranked patients by how many years they'd probably get back. What I want to know is what that practice presupposes about persons. Does save-the-most require treating people as a pool whose claims get added together — which is basically the separateness-of-persons objection, that utilitarianism treats the distinctness between persons like the distinctness between one person's moments, so it can sacrifice one for five? Or can you run a maximize-survivors protocol while still holding that each person is a separate locus of claims that can't be traded off, with something else doing the work (ex ante agreement, consent, the fact that triage only allocates and doesn't kill)? Tell me what the practice strictly presupposes versus what it's merely compatible with, and where it's underdetermined — my hunch is that several very different views of the person license the exact same scoring sheet, and I'd like to know if that's right. And then the part that really bugs me: the same system that will let one patient die to save five in a crunch absolutely will not take one healthy person's organs to save five people on the transplant list — it runs a waiting list, and urgency sometimes beats life-years. Is that a genuine inconsistency in what we presuppose about persons, or just the killing/letting-die difference? And if the triage practice does presuppose aggregation, what would a non-aggregating version of it even look like — is that a coherent thing to build, or does scarcity just force the aggregation?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Crisis Triage Protocols (ventilators, ICU beds, scoring sheets based on life-years).
      *   **Philosophical Question 1:** What does this practice *presuppose* about persons?
          *   Does it require treating people as a pool (aggregation/utilitarianism)?
          *   Does it trigger the "separateness of persons" objection (Rawls/Nozick)?
          *   Can it be compatible with non-aggregating views (ex ante agreement, consent, allocation vs. killing)?
          *   Distinction: Strict presupposition vs. compatibility vs. underdetermination.
      *   **Philosophical Question 2:** The Transplant Intuition Pump.
          *   Triage: Let one die to save five.
          *   Transplant: Won't kill one healthy to save five.
          *   Is this inconsistent regarding the view of persons?
          *   Is it just the killing/letting-die distinction?
      *   **Philosophical Question 3:** Non-Aggregating Triage.
          *   If triage *does* presuppose aggregation, what would a non-aggregating version look like?
          *   Is it coherent, or does scarcity force aggregation?

  2.  **Initial Analysis & Mapping to Ethical Frameworks:**

      *   *Utilitarianism/Consequentialism:* Maximizes total good (lives/life-years). Clearly aggregates. Treats persons as vessels of value.
      *   *Deontology/Rights-Based:* Focuses on duties, rights, and constraints. Generally resists aggregation (separateness of persons).
      *   *Contractualism (Scanlon):* Principles no one could reasonably reject. Might allow triage based on ex ante agreement.
      *   *Luck Egalitarianism:* Focuses on brute luck vs. option luck.
      *   *The "Killing vs. Letting Die" Distinction:* Doctrine of Double Effect, acts vs. omissions.

  3.  **Addressing Question 1: Presuppositions vs. Compatibility:**

      *   *Strict Presupposition:* Does the math *require* utilitarianism? No. You can get to "save the most" via different routes.
      *   *Underdetermination:* This is the user's hunch. It's correct. A Utilitarian, a Contractualist, and a Rule-Deontologist could all sign off on the same triage protocol for different reasons.
      *   *The "Pool" Objection:* Aggregation *happens* in the outcome, but does it happen in the *justification*?
          *   *Utilitarian:* Yes, 5 > 1.
          *   *Contractualist:* In a crisis, everyone would agree beforehand to a rule that maximizes survival because everyone has an equal ex ante chance of needing the resource.
          *   *Duty-Based:* The doctor has a duty to use resources effectively (stewardship), not necessarily to maximize utility in the abstract.
      *   *Conclusion:* The practice is *compatible* with non-aggregating views, even if it *looks* aggregating. It doesn't strictly presuppose the "pool" view, though it risks sliding into it.

  4.  **Addressing Question 2: The Transplant Inconsistency:**

      *   *Scenario:* Triage (let die) vs. Transplant (kill/harvest).
      *   *Is it inconsistent about persons?* Not necessarily.
      *   *Killing vs. Letting Die:* This is the standard defense. Triage is withholding scarce resource (letting nature take course); Transplant is active violation of bodily integrity (killing).
      *   *Rights View:* Everyone has a right not to be killed. Not everyone has a right to a ventilator (positive right vs. negative right).
      *   *Causality:* In triage, the virus kills. In transplant, the surgeon kills.
      *   *Institutional Role:* Hospitals are for healing, not harming.
      *   *Verdict:* It's not necessarily an inconsistency in the view of *persons*, but an inconsistency in *constraints* on action. However, a strict utilitarian *would* call it inconsistent. A rights-based theorist sees them as categorically different. So, the inconsistency exists only if you assume a single metric (like utility) governs both. If you assume rights govern both, they are consistent (negative rights trump positive claims).

  5.  **Addressing Question 3: Non-Aggregating Triage:**

      *   *Can you build it?* Yes.
      *   *How?* Randomization (Lottery).
      *   *Why?* If persons are separate and claims cannot be traded, and all have equal claim to life, then flipping a coin respects the equality of claim without summing value.
      *   *Scarcity Force:* Scarcity forces *choice*, not necessarily *aggregation*. You must choose, but you can choose via a procedure that respects separateness (lottery) rather than one that sums value (scoring).
      *   *Why don't we do lotteries?* Because we intuitively feel saving 5 is better than saving 1, even if rights are equal. This suggests we *do* aggregate implicitly, or we prioritize "duty to rescue" over "equality of claim."
      *   *Modified Non-Aggregating:* "Save the most" might be justified as "minimizing the number of rights violations" (if death is a violation) but that gets tricky. Better: "Ex ante fairness."

  6.  **Synthesizing and Structuring the Argument:**

      *   *Introduction:* Validate the user's hunch (underdetermination is real).
      *   *Section 1: The Metaphysics of the Scoring Sheet.* Analyze what the protocol *does* vs. what *justifies* it. Distinguish between *outcome aggregation* and *justificatory aggregation*.
      *   *Section 2: Compatibility with Non-Aggregating Views.* Explore Contractualism (Scanlon) and Ex Ante Agreement. This avoids the "pool" objection.
      *   *Section 3: The Transplant Puzzle.* Address Killing vs. Letting Die, Negative vs. Positive Rights. Explain why a non-utilitarian sees these as consistent.
      *   *Section 4: Non-Aggregating Triage.* Discuss the Lottery. Explain why scarcity forces choice, not aggregation.
      *   *Conclusion:* Summarize the tension. The practice is underdetermined, but our reluctance to use lotteries suggests we *do* lean on aggregation when the stakes are high, even if we cloak it in other language.

  7.  **Refining the Tone:**

      *   The user is philosophically sophisticated (mentions "separateness of persons," "locus of claims," "underdetermined").
      *   Avoid oversimplification. Use precise terminology (ex ante/ex post, negative/positive rights, agent-relative constraints).
      *   Maintain a neutral, analytical tone. Don't preach, but explore the logic.

  8.  **Self-Correction/Nuance Check during Drafting:**

      *   *Check:* Did I address "life-years" specifically?
      *   *Correction:* Need to mention that "life-years" is more utilitarian than "lives saved." Saving lives can be contractualist; saving life-years leans heavier into aggregation of value.
      *   *Check:* Is the transplant analogy perfect?
      *   *Correction:* Acknowledge that some philosophers (e.g., Judith Jarvis Thomson, Peter Unger) argue the distinction is morally shallow, but institutionally robust.
      *   *Check:* What about the "duty of stewardship"?
      *   *Correction:* Add this as a non-aggregating justification for triage. The resource belongs to the community, not the doctor.

  9.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts.)

      *   *Key Insight to highlight:* The difference between *aggregating claims* (summing value) and *comparing claims* (weighing competing rights).
      *   *Key Insight on Transplant:* The distinction between a claim *to be saved* and a claim *not to be interfered with*.

  10. (Final Review against User Prompt):
      *   Presuppositions vs. Compatibility? Covered.
      *   Underdetermination? Confirmed.
      *   Transplant Inconsistency? Analyzed (Rights vs. Utility).
      *   Non-aggregating triage? Proposed (Lottery).
      *   Does scarcity force aggregation? Argued no, it forces choice.

      *Ready to write.*
answer: |-
  This is a sharp set of questions that cuts right to the bone of non-ideal theory. You are correct to suspect underdetermination: the same triage protocol can be derived from radically different moral axioms. The tension you feel between the triage sheet and the transplant waiting list is the friction between *consequentialist pressure* (scarcity demands efficiency) and *deontological constraints* (persons are inviolable).

  Here is an analysis of what crisis triage strictly presupposes, where it is merely compatible with competing views, and how to make sense of the transplant inconsistency.

  ### 1. What the Scoring Sheet Presupposes vs. What It Is Compatible With

  You asked if "save-the-most" requires treating people as a pool (the separateness-of-persons objection). The short answer is: **The outcome aggregates, but the justification need not.**

  **Strict Presuppositions:**
  At a minimum, crisis triage presupposes:
  1.  **Comparability:** Lives (or life-years) are commensurable units of value sufficient for ranking.
  2.  **Scarcity as a Moral Trigger:** The normal constraint against choosing who lives is suspended by resource insufficiency.
  3.  **Stewardship:** The medical institution holds the resource in trust for a population, not for the specific individual currently in the bed.

  **The Underdetermination Thesis:**
  Your hunch is right. Three distinct views of the person can sign off on the same "Save the 5, not the 1" protocol:

  *   **The Utilitarian (Aggregating):** Treats persons as vessels of welfare. 5 lives > 1 life. The distinctness of persons is morally irrelevant to the sum total. This view *does* fall prey to the separateness-of-persons objection.
  *   **The Contractualist (Non-Aggregating):** Think T.M. Scanlon. In this view, we ask: "What principle could no one reasonably reject?" In a crisis, every person knows they have an equal *ex ante* probability of needing the ventilator. A rule that maximizes survival probability for the group is one that every rational agent would agree to behind a veil of ignorance regarding their specific infection status. Here, we aren't summing value; we are honoring a fair procedure agreed upon by separate persons.
  *   **The Duty-Based Deontologist (Non-Aggregating):** A doctor has a duty of care to *all* patients in their charge, not just the one in front of them. Withholding a vent from Patient A to give to Patient B is not "sacrificing A for B"; it is fulfilling a broader duty to minimize death within the institution's capability. The "pool" is not a sum of value, but a sum of *responsibilities*.

  **Where Aggregation Creeps In:**
  However, the specific metric matters.
  *   **"Save the most lives"** is compatible with contractualism (everyone counts for one).
  *   **"Save the most life-years"** (the scoring sheets that penalize the elderly) leans much harder into aggregation. It is difficult to justify sacrificing an 80-year-old for a 20-year-old via contractualism (the 80-year-old would reject the rule). To justify life-years, you generally have to treat "life" as a fungible commodity where duration matters more than the rights-holder. This is where the "pool" objection gains traction.

  ### 2. The Transplant Inconsistency: Killing vs. Letting Die?

  You noted the system lets one die to save five (triage) but won't kill one to save five (transplant). Is this an inconsistency in our view of persons?

  **The Standard Defense (Rights-Based Consistency):**
  From a non-utilitarian perspective, this is **not inconsistent**. It relies on the distinction between **negative rights** (not to be interfered with) and **positive rights** (to be aided).
  *   **Transplant:** The healthy person has a negative right to bodily integrity. Violating this to harvest organs treats them as a mere means (a container of parts).
  *   **Triage:** The patient denied the vent has a positive claim to rescue. In normal times, this claim is strong. In crisis, the claim is diluted by the competing positive claims of others.
  *   **Consistency:** We respect the separateness of persons by refusing to violate negative rights (killing), even to maximize good. But when multiple positive claims conflict (triage), we must adjudicate between them. The "inconsistency" only appears if you assume all claims (to life, to organs, to vents) are of the same type.

  **The Utilitarian Critique (Genuine Inconsistency):**
  A strict utilitarian (like Peter Singer or the early Peter Unger) would argue this *is* a genuine inconsistency. If the goal is saving lives, the distinction between "withholding a vent" and "withholding a kidney" is causally relevant but morally irrelevant. If we are willing to aggregate in the ICU, consistency demands we aggregate in the OR. The fact that we recoil from the transplant case suggests our triage protocols are actually resting on unexamined deontological constraints (killing is worse than letting die) that we suspend when it becomes too painful to acknowledge them.

  **The "Causality" Distinction:**
  There is a third view: In triage, the *virus* kills the patient. In transplant, the *surgeon* kills the donor. Triage allocates a shield; transplant removes a shield. This preserves the view of the person as inviolable, provided the state/doctor does not become the agent of death.

  ### 3. What Would Non-Aggregating Triage Look Like?

  If we reject aggregation (the "pool" view) because we believe persons are separate loci of claims that cannot be traded off, does scarcity force us back into utilitarianism?

  **No. Scarcity forces Choice, not Aggregation.**
  You can acknowledge that you cannot save everyone without summing their value. If Person A and Person B have an equal claim to the one remaining vent, and you cannot satisfy both, aggregation says "Look for a tie-breaker (age, life-years, social value)." Non-aggregation says "The claims are incommensurable; use a procedure that respects the equality of the claim."

  **The Lottery Model:**
  A strictly non-aggregating triage protocol is a **randomized lottery** among medically eligible candidates.
  *   **Why it works:** It acknowledges that Person A's right to life does not outweigh Person B's right to life. Since the resource cannot be divided, and neither claim trumps the other, chance decides.
  *   **Why we don't use it:** We intuitively feel that saving 5 is *better* than saving 1, even if rights are equal. This suggests that while we might verbally endorse the "separateness of persons," in extreme scarcity we revert to a "minimize rights violations" heuristic. If death is a rights violation, preventing 5 violations is better than preventing 1. But this is a slippery slope back to aggregation.

  **A Hybrid "Threshold" Model:**
  A coherent non-aggregating system might look like this:
  1.  **Threshold:** Anyone below a certain probability of survival (e.g., <10%) is excluded (not because their life is worth less, but because the resource would be wasted, violating the stewardship duty to others).
  2.  **Equality:** Among those above the threshold, no weighting for age or life-years.
  3.  **Selection:** Random lottery.

  This system respects the separateness of persons (no one is sacrificed *for* another; all face equal risk) while acknowledging scarcity. The fact that hospitals reject this (preferring life-years scoring) indicates that in practice, **crisis triage does presuppose aggregation.** We are willing to trade the 80-year-old's claim for the 20-year-old's claim. We treat the "years" as a common currency.

  ### Summary

  1.  **Underdetermination:** You are right. The *practice* of triage is underdetermined. A Utilitarian, a Contractualist, and a Stewardship Deontologist can all use the same scoring sheet. However, the *life-years* metric specifically leans toward aggregation, whereas a simple "lives saved" metric is more compatible with non-aggregating views.
  2.  **Transplant Inconsistency:** It is not an inconsistency if you distinguish negative rights (bodily integrity) from positive claims (rescue). It *is* an inconsistency if you believe moral value is solely determined by outcomes. The transplant taboo protects the person as a *subject*; triage manages the person as a *patient*.
  3.  **Non-Aggregating Triage:** It is coherent. It looks like a lottery among eligible patients. The fact that we generally reject lotteries in favor of scoring sheets suggests that when the stakes are high enough, we implicitly accept the "pool" view: we treat human lives as commensurable units to be maximized, despite our professed belief in the sanctity of the individual.

  The discomfort you feel is the friction between our **ideal theory** (persons are inviolable ends) and our **non-ideal reality** (resources are finite). Triage protocols are essentially utilitarian tools wrapped in deontological language to make them palatable.
