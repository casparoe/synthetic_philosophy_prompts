prompt: |-
  I commission long-form features for a history magazine and we're launching a series on societies that 'fell' -- the Late Bronze Age world, the Classic Maya, Rapa Nui, that sort of thing. The trouble is every writer means something different by collapse: some mean a state loosing its grip, some mean a whole population going under, some mean a civilisation that just changed and carried on, and our house style is loose enough that it all slides through. I want a decision procedure I can hand to writers and fact-checkers -- a checklist or a flowchart in words, not an essay. Start from the point that a collapse claim is always relative to a stated system and a baseline, so the first questions have to fix what's supposed to be collapsing and against when. Then the ordered questions that pin down the claim, what evidence would settle each, where the answer comes out as not-collapse (keep decline, reorganisation, absorption and plain abandonment apart from each other), and where it's genuinely a values call about what counts as a society failing, which has to come to me rather than the writer. It has to be usable by someone who's read none of the archaeological debate, so keep the theory in the background -- but don't let it disappear: if there's a real distinction from the literature that has to survive the simplification, keep it and say why. Then run it on two cases, the Classic Maya and Rapa Nui, including one where it gives an answer our writers won't like. Finish with what the procedure can't do. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Commissioning editor for a history magazine.
      *   **Task:** Create a decision procedure (checklist/flowchart in words) for writers and fact-checkers to define "collapse" consistently.
      *   **Context:** A series on societies that 'fell' (Late Bronze Age, Classic Maya, Rapa Nui, etc.).
      *   **Problem:** Inconsistent definitions of "collapse" (state loss vs. population loss vs. transformation).
      *   **Requirements:**
          *   Start by fixing the *system* and the *baseline* (relative claim).
          *   Ordered questions to pin down the claim.
          *   Specify evidence needed for each question.
          *   Distinguish "not-collapse" outcomes (decline, reorganisation, absorption, abandonment).
          *   Flag value judgments for the editor (me).
          *   Accessible to non-experts but retain crucial theoretical distinctions.
          *   British English.
          *   Test run on two cases: Classic Maya and Rapa Nui (one must yield an uncomfortable answer).
          *   Finish with limitations of the procedure.

  2.  **Deconstruct "Collapse" (Theoretical Background):**
      *   *Tainter (1988):* Loss of socio-political complexity.
      *   *Yoffee & Cowgill (1988):* Critique of "collapse" as a myth; often just transformation.
      *   *Middleton (2017):* Distinguishes between systems (political, economic, cultural).
      *   *Key distinction:* Is it the *people* dying, the *state* ending, or the *culture* changing?
      *   *Baseline:* Collapse implies a drop from a previous peak or steady state.
      *   *Scale:* Local vs. Regional vs. Civilisation-wide.
      *   *Speed:* Sudden vs. Gradual.

  3.  **Drafting the Decision Procedure (The Core):**
      *   *Step 1: Define the Object.* What is collapsing? (Polity, Population, Culture, Infrastructure).
      *   *Step 2: Define the Baseline.* When was the "peak"? What does "normal" look like?
      *   *Step 3: Measure the Drop.* How much was lost? How fast?
      *   *Step 4: Check for Continuity.* Did people stay? Did traditions continue?
      *   *Step 5: Categorise.* Collapse vs. Decline vs. Transformation vs. Abandonment.
      *   *Step 6: Value Judgment.* If it's ambiguous, send to Editor.

      *Refining for the Prompt:* Needs to be a "checklist or flowchart in words". Needs to explicitly separate evidence from interpretation. Needs to flag value calls.

  4.  **Developing the Test Cases:**
      *   *Classic Maya:* Often cited as collapse. But Maya people are still there. The *political system* of city-states collapsed. Population dropped in the south, not the north.
          *   *Expected Outcome:* Political collapse, demographic decline in specific regions, cultural continuity. Likely "Collapse of the Classic Polity" but not "Disappearance of the Maya".
      *   *Rapa Nui (Easter Island):* Traditional narrative: Ecocide, statue toppling, cannibalism, population crash before Europeans. New scholarship (Hunt & Lipo, etc.): Resilience, adaptation, population stable until contact/disease.
          *   *Expected Outcome:* This is the one writers won't like. The "collapse" narrative is largely debunked. It was reorganisation/adaptation. The real crash came with European contact (slavery, disease).
          *   *Constraint:* "Including one where it gives an answer our writers won't like." Rapa Nui is perfect for this because the "ecocide" story is popular but archaeologically shaky.

  5.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, directive, editorial, British English (organisation, civilisation, programme, centre).
      *   *Structure:*
          1.  Introduction (Purpose).
          2.  The Procedure (The Checklist).
          3.  Test Runs (Maya & Rapa Nui).
          4.  Limitations.

      *Self-Correction on Procedure:* Make sure I explicitly mention *where* the editor comes in. The prompt says "which has to come to me rather than the writer." So there needs to be a "Refer to Editor" step for normative judgments.
      *Self-Correction on Theory:* Keep it backgrounded but acknowledge the "Complexity vs. People" distinction (Tainter vs. Demographic).

  6.  **Writing the Procedure (Mental Walkthrough):**
      *   Q1: What is the unit? (State, People, Culture).
      *   Q2: What is the baseline? (Peak complexity, max population).
      *   Q3: What is the magnitude of loss? (>50%? Total cessation?).
      *   Q4: What is the speed? (Generational vs. Centuries).
      *   Q5: Is there continuity? (Language, DNA, Tradition).
      *   *Decision Node:* If State ends but People stay -> Transformation/Reorganisation. If People die -> Demographic Collapse. If everything stops -> Systemic Collapse.
      *   *Editor Flag:* If the definition relies on "loss of greatness" rather than metrics.

  7.  **Writing the Test Cases:**
      *   *Maya:* Apply the checklist. Result: Political collapse in Southern Lowlands, cultural continuity. Writers might want to say "The Maya Vanished." Procedure says "No."
      *   *Rapa Nui:* Apply the checklist. Result: No pre-contact collapse. Adaptation. Writers want "Ecocide." Procedure says "Reorganisation." (This fits the "answer writers won't like" constraint).

  8.  **Final Review against Constraints:**
      *   British English? (Check: civilisation, organisation, centre, programme).
      *   Flowchart in words? (Yes, numbered steps with conditional logic).
      *   Start with system/baseline? (Yes, Step 1 & 2).
      *   Distinguish decline/reorg/absorption/abandonment? (Yes, in the outcomes).
      *   Flag value calls? (Yes, "Editorial Review" section).
      *   Limitations section? (Yes).
      *   Accessible but theoretically sound? (Yes, focuses on metrics over vibes).

  9.  **Final Polish:** Ensure the distinction between 'collapse' and 'transition' is sharp. Ensure the Rapa Nui section highlights the European contact factor clearly, as that's the crux of the revisionist argument.

  *(Self-Correction during drafting)*: Make sure I don't write an essay intro. Keep it punchy. The prompt asks for a decision procedure *to hand to writers*. So it should look like a style guide memo.

  *(Refining the Rapa Nui point)*: Ensure I acknowledge the traditional view but show how the procedure filters it out based on evidence (statue toppling dates, obsidian sources, etc.).

  *(Refining the "Values Call")*: The prompt says "where it's genuinely a values call about what counts as a society failing, which has to come to me". I need to make sure the procedure explicitly identifies *when* a question is subjective (e.g., "Is loss of monumental architecture a failure?").

  Let's assemble.
answer: |-
  **MEMORANDUM**

  **TO:** Contributing Writers and Fact-Checking Team
  **FROM:** Commissioning Editor
  **SUBJECT:** Decision Procedure for 'Collapse' Claims
  **DATE:** 24 May 2024

  **Purpose**
  For the upcoming series on societal failure, we are standardising the use of the term 'collapse'. Currently, usage varies between demographic catastrophe, political termination, and cultural transformation. This procedure ensures consistency. It is not a theoretical essay; it is a diagnostic tool. If a claim cannot pass this checklist, it is not a collapse story.

  **The Procedure**

  **Phase 1: Fix the Variables**
  *Before drafting, define the following two parameters. If you cannot, the claim is too vague to proceed.*

  1.  **Identify the System:** What specifically is failing? Choose one primary category:
      *   *Polity:* A specific government, dynasty, or administrative hierarchy.
      *   *Demography:* The biological population count in a specific region.
      *   *Complexity:* The capacity to build monuments, maintain trade networks, or produce writing.
      *   *Culture:* Language, religion, or ethnic identity.
      *   *Note:* A change in one does not prove a change in all.

  2.  **Establish the Baseline:** Against what standard is the failure measured?
      *   Specify the 'Peak' date or period (e.g., 'Late Bronze Age c. 1250 BCE').
      *   Specify the metric of health (e.g., 'Number of active palaces', 'Obsidian import volume', 'Settlement density').

  **Phase 2: Measure the Drop**
  *Gather evidence to answer the following ordered questions. Cite the specific archaeological or historical data source for each.*

  3.  **Magnitude:** What percentage of the baseline metric was lost?
      *   *Evidence required:* Settlement survey data, textual cessation, stratigraphic destruction layers.
      *   *Threshold:* A drop of less than 50% in the primary metric is **Decline**, not Collapse.

  4.  **Speed:** Over what duration did the loss occur?
      *   *Evidence required:* Radiocarbon dating ranges, numismatic gaps, generational accounts.
      *   *Threshold:* A process taking more than three generations (approx. 75–100 years) is **Transformation** or **Evolution**, unless the loss is total (100%).

  5.  **Geography:** Is the loss universal or local?
      *   *Evidence required:* Regional survey maps.
      *   *Threshold:* If the system continues functioning in a neighbouring region (e.g., Northern Maya while Southern Maya fail), label it **Regional Abandonment**, not Civilisational Collapse.

  **Phase 3: Check for Continuity**
  *This distinguishes Collapse from Reorganisation.*

  6.  **Population Continuity:** Did the people die, or did they move?
      *   *Evidence required:* Isotopic analysis (strontium/oxygen), DNA studies, pottery style continuity.
      *   *If people remain:* The claim is **Reorganisation** or **Absorption**.
      *   *If people vanish:* The claim is **Demographic Collapse**.

  7.  **Functional Continuity:** Did the *purpose* of the society survive, even if the *structure* changed?
      *   *Evidence required:* Continuity of religious sites, continued use of language/script, maintenance of trade routes (even if reduced).
      *   *If yes:* The claim is **Adaptation**.

  **Phase 4: Categorisation and Editorial Review**
  *Based on the answers above, assign one of the following labels. Do not use the word 'Collapse' unless you hit the specific criteria in Box A.*

  *   **Box A: Systemic Collapse**
      *   *Criteria:* >50% loss of complexity AND <100 years duration AND loss of political centralisation.
      *   *Action:* You may use the term 'Collapse'.

  *   **Box B: Demographic Collapse**
      *   *Criteria:* >50% population loss due to mortality (not migration).
      *   *Action:* Use 'Population Crash' or 'Depopulation'. Do not imply cultural extinction unless proven.

  *   **Box C: Political Termination**
      *   *Criteria:* The ruling dynasty ends, but administration continues under new management.
      *   *Action:* Use 'Regime Change' or 'Conquest'.

  *   **Box D: Reorganisation / Transformation**
      *   *Criteria:* Complexity drops, but population and culture persist (e.g., shift from cities to villages).
      *   *Action:* Do not use 'Collapse'. Use 'Restructuring' or 'Simplification'.

  *   **Box E: Editorial Review (Values Call)**
      *   *Criteria:* The evidence shows the society 'failed' only by modern aesthetic standards (e.g., they stopped building stone monuments) but thrived by human standards (e.g., nutrition improved, violence decreased).
      *   *Action:* **Stop.** Do not draft a conclusion. Send the evidence file to the Commissioning Editor. We will decide if 'failure' is the correct narrative frame.

  ***

  **Test Runs**

  **Case 1: The Classic Maya (Southern Lowlands)**
  *   **System:** Polity (Divine Kingship) and Complexity (Monumental construction).
  *   **Baseline:** c. 600–800 CE (Peak stelae erection, population density).
  *   **Magnitude:** Cessation of dated monuments in major cities (Tikal, Calakmul). Population drop estimated at 60–90% in specific zones. **(Passes Threshold)**
  *   **Speed:** c. 850–950 CE. Approx. 100 years. **(Borderline, but acceptable)**
  *   **Geography:** Southern Lowlands only. Northern Lowlands (Chichén Itzá) flourish later. **(Regional Abandonment)**
  *   **Continuity:** Maya people remain. Languages persist. Religious practices continue in modified forms. **(Reorganisation)**
  *   **Verdict:** **Box A (Systemic Collapse)** regarding the *political institution* of Divine Kingship in the South.
  *   **Writer Constraint:** You may write about the 'Collapse of the Classic Maya Polity'. You may **not** write that 'The Maya Civilisation Disappeared'. That is factually incorrect per Phase 3.

  **Case 2: Rapa Nui (Easter Island)**
  *   **System:** Demography and Complexity (Statue transport/erection).
  *   **Baseline:** c. 1200–1500 CE (Peak moai construction).
  *   **Magnitude:** Cessation of statue erection. Traditional narrative suggests population crash due to ecocide.
  *   **Evidence Check:** Recent obsidian hydration and radiocarbon data indicate statue activity continued *after* European contact (1722). Soil analysis shows successful rock gardening (lithic mulching) sustained agriculture.
  *   **Speed:** No evidence of sudden pre-contact population drop. Decline correlates with 19th-century slave raids and disease.
  *   **Continuity:** High genetic and cultural continuity among modern Rapa Nui people.
  *   **Verdict:** **Box E (Editorial Review)**.
  *   **Writer Constraint:** The traditional 'Ecocide/Collapse' narrative fails Phase 2 and 3. The society adapted to environmental constraints successfully until external contact. If you wish to argue 'Collapse', you must argue that the cessation of statue building constitutes a societal failure despite population stability. **Do not make this call yourself.** Send to me. I suspect this story is one of resilience, not collapse, which contradicts the series theme.

  ***

  **Limitations of this Procedure**

  1.  **Data Gaps:** In poorly documented regions (e.g., parts of Sub-Saharan Africa or the Amazon), the evidence required for Phase 2 may not exist. In these cases, default to 'Transformation' rather than speculating on 'Collapse'.
  2.  **Subjectivity of 'Complexity':** The procedure treats 'loss of monumental building' as a metric for complexity (Phase 1). This is a Tainter-esque assumption. Some societies voluntarily simplify. Phase 4, Box E exists to catch this, but writers must be alert to it.
  3.  **Normative Bias:** This procedure favours stability and continuity as 'success'. It inherently frames rapid change as negative. This is a necessary simplification for the magazine's theme, but writers must acknowledge in the text that 'collapse' for the elite is often 'liberation' for the peasantry.
  4.  **External Shocks:** The procedure struggles to distinguish between internal failure and external conquest (e.g., Rome). If the system fails solely due to an outside invasion, label it 'Conquest', not 'Collapse', unless the invasion exploited pre-existing fragility.

  **Approval**
  Any deviation from this checklist requires prior email approval from the Commissioning Editor.
