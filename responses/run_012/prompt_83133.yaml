answer: |-
  You have put your finger on a genuine philosophical and psychological nerve, and you are right to be unsatisfied with the standard "rule-following paradox" explanation. The standard explanation (usually attributed to Wittgenstein and Kripke) focuses on *skepticism*: "How can I know what to do next?" Your observation is sharper: "How can we agree on what we *did*, but disagree on what it *was*?"

  There isn't one single dictionary word that captures the entire symmetry of what you're describing (the fight about the past *and* the agreement in practice), but there is a framework that pins it down.

  The phenomenon is **The Decoupling of Praxis and Proposition**.

  Here is the breakdown of what it is, why the two cases you described are actually the same mechanism viewed from opposite ends, and where the borderline cases lie.

  ### 1. The Two Halves of the Same Coin

  You described two scenarios that feel opposite but are structurally identical.

  **Scenario A: The Brother-in-Law (Explicit Convergence, Implicit Divergence)**
  *   **The Text:** You agree on the words of the rule.
  *   **The Data:** You agree on the history of past cases.
  *   **The Algorithm:** You disagree on the function that maps the text/data to the action.
  *   **The Conflict:** Retrospective. "You are violating the *original* intent."

  **Scenario B: The Band (Explicit Divergence, Implicit Convergence)**
  *   **The Text:** You disagree on the words of the rule.
  *   **The Algorithm:** You disagree on the theory of the timing.
  *   **The Praxis:** You agree perfectly on the action.
  *   **The Conflict:** None (until asked to explain).

  **The Unifying Principle:**
  Rules do not exist in the text, and they do not exist in the past cases. **Rules exist in the correction.**

  A rule is not a static object (like a stone); it is a dynamic activity (like riding a bike). In the band example, the "rule" of the timing is maintained by the immediate feedback loop of hearing each other. If the drummer speeds up, you adjust. You don't consult a manual; you consult the *practice*.

  In the brother-in-law example, the feedback loop is broken. There is no immediate physical consequence for "getting the rule wrong." Because there is no immediate correction, the "rule" drifts from the *action* and attaches itself to the *narrative*.

  ### 2. Why the Fight is About the Past

  You asked: *"Nobody says fine, from now on we'll do it this way. They say that is not what we have been doing."*

  This is the most critical part of your observation. This is not a logical dispute; it is a **claim to authority**.

  If your brother-in-law admitted, "Okay, the old cases were ambiguous, let's set a new precedent," he would be admitting that the rule is *mutable*. That undermines his position. His position relies on the idea that *he is the guardian of the true tradition*.

  This is known in legal theory as **Inductive Ambiguity**. Any finite set of past cases (the data) can be explained by infinite different rules (the theories).
  *   **Case 1, 2, 3 were all allowed.**
  *   **Theory A:** "Everything is allowed."
  *   **Theory B:** "Everything is allowed except X."
  *   **Theory C:** "Everything is allowed on Tuesdays."

  Since X hasn't happened yet, both Theory A and Theory B fit the past data perfectly. When X finally happens, you both claim your theory was the *only* one that ever fit the past. You are fighting over **Retrospective Coherence**. You are trying to rewrite the past to make your present judgment look inevitable.

  ### 3. Is the Band Case the Same Phenomenon?

  **Yes.**

  The band case proves that **competence precedes description.** You can possess the rule (in your muscles/ears) without possessing the description of the rule.

  The brother-in-law case proves that **description does not guarantee competence.** You can possess the description of the rule without sharing the competence.

  Both cases demonstrate that **meaning is use.**
  *   In the band, the "meaning" of the timing *is* the playing. Since the playing matches, the meaning matches, regardless of the verbal description.
  *   In the argument, the "meaning" of the rule *should be* the application. Since the application is about to diverge, the meaning has *already* diverged, even if you are using the same words.

  The difference is simply **feedback**. The band has a tight feedback loop (you hear the mistake instantly). The rule-arguers have a loose feedback loop (the mistake is only visible when someone makes a claim that the other rejects).

  ### 4. Is there a difference between "Ineffable Rules" and "Divergent Verbal Rules"?

  You asked: *"Is there a real difference between a rule nobody can put into words and a rule everybody puts into words differently?"*

  **Functionally, no. Structurally, yes.**

  *   **Ineffable Rule (The Band):** This is **Tacit Knowledge** (a term coined by Michael Polanyi: "We know more than we can tell"). The rule is stored in procedural memory. It is robust because it is tested against reality constantly.
  *   **Divergent Verbal Rule (The Argument):** This is **Motivated Hermeneutics**. The rule is stored in semantic memory, but it is being used as a weapon rather than a tool. It is fragile because it is tested against *ego*, not reality.

  The danger zone is when people mistake the second for the first. They think because they have the *words*, they have the *skill*. They don't.

  ### 5. Pinning Down the Edges (The Borderline Cases)

  You asked for the borderline cases, the ones half-in and half-out. This is where the phenomenon becomes visible.

  **Borderline Case 1: The "Until It Breaks" Agreement**
  Two people agree on the words and agree on the action for 99 cases. On case 100, they diverge.
  *   *Status:* Half-in.
  *   *Why:* They *thought* they had Tacit Knowledge (like the band), but they actually had Coincidental Alignment. They weren't following the same rule; they were following two different rules that happened to overlap for 99 cases. This reveals that the "Band" scenario is always fragile until stress-tested.

  **Borderline Case 2: The "As If" Consensus**
  Two people argue bitterly about the rule (Scenario A), but when forced to work together, they seamlessly coordinate without speaking.
  *   *Status:* Half-in.
  *   *Why:* Their *Praxis* is aligned (like the band), but their *Narrative* is misaligned. They share a "Form of Life" (Wittgenstein's term for shared cultural/behavioral background) but not a "Theory of Life." This is common in long marriages or experienced work teams. They can do the thing, but they can't agree on *why* the thing works.

  **Borderline Case 3: The Self-Alienation (Your Note Example)**
  Reading your own old note and not knowing if it was meaningful.
  *   *Status:* Pure Example.
  *   *Why:* This proves the rule is not in the text. If the rule were in the text, you (the author) would be the ultimate authority. But you are a stranger to your past self. You have to *interpret* your own note just like a stranger would. This confirms that **texts do not carry their own meaning; readers import meaning.**

  ### 6. Naming the Phenomenon

  Since you want this pinned down, here is the taxonomy.

  The overarching phenomenon is **The Autonomy of Practice**.
  (It means practice operates independently of description).

  The specific conflict you are having with your brother-in-law is **Retrospective Normative Drift**.
  (The rule drifts over time, but both parties insist the drift never happened).

  The specific alignment you see in the band is **Procedural Convergence**.
  (Action aligns without semantic agreement).

  **The Verdict:**
  You are not crazy, and you aren't missing a simple definition. You have identified that **rules are not containers for meaning; they are tools for coordination.**

  When the coordination works (the band), the definition doesn't matter.
  When the coordination breaks (the argument), the definition becomes a battlefield to claim who is responsible for the break.

  **The Borderline You Care About:**
  The most dangerous case is **The Illusion of Codification**. This is when a group successfully operates on Tacit Knowledge (like the band), but then decides to write it down to "make it clear."
  *   *Result:* The moment they write it down, they move from **Procedural Convergence** to **Retrospective Normative Drift**.
  *   *Why:* Writing it down invites interpretation. It invites the brother-in-law scenario.
  *   *Advice:* If it works in practice, do not write it down. If you must write it down, accept that the text is not the rule; the *next time you do the thing* is the rule.

  Your brother-in-law thinks the rule is a **Map**. You are noticing that the rule is the **Terrain**. You can agree on the map and still walk in different directions. You can disagree on the map and still walk side-by-side. The map is not the territory.
