answer: |-
  You have identified a precise and notoriously slippery region of meta-philosophy. The family of moves you describe is historically known as **retorsive arguments** (or *argumentum in retorsionem*), but in contemporary analytic and continental philosophy, they are usually discussed under the headings of **performative contradiction**, **self-refutation**, and **transcendental argumentation**.

  However, your intuition is correct: standard labels conflate the four strengths you distinguish. The literature often treats the move from "you cannot argue this" to "this is false" as seamless, when it is actually the most contested inference in epistemology.

  Here is the carving you requested: the established names for the levels, the name for the slide between them, and the conditions under which the fourth strength is legitimate.

  ### 1. The Family Name: Retorsion and Immanent Critique
  The overarching strategy is **Retorsion**. Classically, this means turning an opponent's argument back upon them. In modern terms, it is a form of **Immanent Critique**: you do not bring external evidence against a position; you show that the position fails by its own internal standards or by the standards required to occupy the position.

  While "performative contradiction" is the most common label, it is too narrow. It applies well to Strengths 1 and 2, but poorly to 3 and 4. A better umbrella term for the specific progression you are tracking is **The Transcendental-Pragmatic Strategy**.

  ### 2. The Carving of the Four Strengths

  Here is how your four strengths map onto established philosophical distinctions, and where the boundaries lie.

  **Strength 1: Pragmatic Self-Refutation (The Linguistic Level)**
  *   **Claim:** The *utterance* contradicts the *content*.
  *   **Status:** Logically secure but often trivial.
  *   **Example:** "I am not speaking."
  *   **Analysis:** This is often a "pun on a word," as you suspect. It relies on the indexical nature of the speech act. It proves only that the sentence cannot be *truthfully uttered*, not that the proposition is false. (I can write "I am not speaking" and be correct).
  *   **Verdict:** This is the weakest form. It establishes a rule of usage, not a truth about the world.

  **Strength 2: Psychological/Phenomenological Impossibility (The Attitude Level)**
  *   **Claim:** The *attitude* (belief/doubt) cannot be genuinely held.
  *   **Status:** Secure regarding the subject, silent on the object.
  *   **Example:** Descartes' *Cogito*. I cannot doubt my existence while doubting.
  *   **Analysis:** This shows a limit of the *mind*, not necessarily a limit of *reality*. It proves that skepticism is unlivable, not that it is untrue.
  *   **Verdict:** This collapses into Strength 1 if "holding" is defined by "avowing." If defined internally, it is a fact about human psychology, not metaphysics.

  **Strength 3: Dialectical Self-Defeat (The Argumentative Level)**
  *   **Claim:** The position cannot be *rationally defended* without begging the question.
  *   **Status:** Secure regarding discourse, silent on truth.
  *   **Example:** "No arguments are valid." (This is offered as a valid argument).
  *   **Analysis:** This shows the position is **dialectically suicidal**. It removes the speaker from the community of rational discourse. However, a skeptic can reply: "I am not trying to convince you; I am pointing out that conviction is impossible."
  *   **Verdict:** This establishes **unavoidability**, not **validity**. It shows we *must* use logic to argue, not that logic *works*.

  **Strength 4: Transcendental Proof (The Ontological Level)**
  *   **Claim:** The position is *false* because it denies a necessary condition of possibility.
  *   **Status:** Highly contested. Requires a bridge premise.
  *   **Example:** "Truth does not exist." (But this claims to be true. Therefore, truth exists).
  *   **Analysis:** This is the leap you identified. It moves from "We must presuppose X to think" to "X is true of the world."
  *   **Verdict:** This is only legitimate if one accepts a specific metaphysical premise (see below).

  ### 3. The Slide: From Strength 3 to Strength 4

  You asked for the name of the passage from "cannot be defended" to "is false." This is the **Transcendental Inference** (or the move from **Indispensability to Truth**).

  In the literature, this slide is the battleground between **Transcendental Realists** (who reject it) and **Transcendental Idealists/Pragmatists** (who accept it).

  **The Name of the Slide:**
  It is often called the **Indispensability Argument**. When used specifically against skepticism via performative contradiction, Karl-Otto Apel called it **Ultimate Justification** (*Letztbegründung*).

  **The Boundary Line (When is it legitimate?):**
  The slide from 3 to 4 is **illegitimate** under **Metaphysical Realism**.
  *   *Realist View:* Just because we are hardwired to believe in causality (or truth, or logic) to function, it does not mean causality (or truth, or logic) actually exists in the world. We might be evolved to survive, not to know truth. (This is the **Stroudian Objection**, after Barry Stroud).
  *   *The Gap:* Strength 3 proves *subjective necessity* (we cannot help but think this). Strength 4 claims *objective necessity* (the world must be this way). The slide assumes these are identical.

  The slide is **legitimate** only under **Internal Realism** or **Transcendental Idealism**.
  *   *Idealist/Pragmatist View:* Truth *just is* what is rationally assertible under ideal conditions. If a precondition is indispensable for rational assertion, it is constitutive of truth itself. There is no "world outside" our conceptual scheme to check against.
  *   *The Bridge:* To make Strength 4 legitimate, you must add the premise: **"The conditions of the possibility of experience/thought are simultaneously the conditions of the possibility of the objects of experience/thought."** (This is Kant's Copernican Revolution).

  ### 4. Is it One Device or Four?

  It is best understood as **one device with four modal scopes**.

  The device is **Immanent Critique via Retorsion**.
  *   **Scope 1 (Linguistic):** Constraints on *utterance*.
  *   **Scope 2 (Phenomenological):** Constraints on *consciousness*.
  *   **Scope 3 (Dialectical):** Constraints on *discourse*.
  *   **Scope 4 (Ontological):** Constraints on *reality*.

  The "slide" occurs when a philosopher treats a constraint on discourse (3) as if it were automatically a constraint on reality (4).

  ### 5. Summary of the "Carving"

  To answer your specific puzzles:

  1.  **Does the family have a name?**
      Yes: **Retorsive Arguments** or **Transcendental-Pragmatic Arguments**.
  2.  **Does the slide have a name?**
      Yes: The **Indispensability Claim** or the **Transcendental Inference**. Critics call it the **Transcendental Fallacy** (confusing how we must think with how things are).
  3.  **Which strengths are established?**
      Strengths 1, 2, and 3 are logically secure. They prove that skepticism is *inexpressible*, *unbelievable*, or *inarguable*.
  4.  **Where is the boundary between rhetorical and genuine Strength 4?**
      The boundary is **Metaphysical**.
      *   If you are a **Realist**, Strength 4 is rhetorical. (You have only shown we are stuck with these beliefs, not that they are true).
      *   If you are an **Idealist/Pragmatist**, Strength 4 is genuine. (You have shown that truth is constituted by these beliefs).
  5.  **Is Strength 4 ever achieved?**
      It is achieved only in systems that reject the "God's Eye View." Hilary Putnam's *Brains in a Vat* argument is a famous attempt to secure Strength 4: he argues that a brain in a vat *cannot even refer* to vats, so the statement "We are brains in a vat" is necessarily false. This works only if you accept his semantic externalism (a form of anti-skepticism built into the theory of reference).

  ### Conclusion

  You are noticing the **conflation of normative necessity with ontological truth**.

  The argumentative move is valid up to Strength 3: *You cannot coherently argue for skepticism.*
  The move becomes controversial at Strength 4: *Therefore, skepticism is false.*

  That step requires a hidden premise: *What is necessary for argument is necessary for truth.* Most contemporary epistemologists (following Barry Stroud) argue this premise is unproven. Most German Idealists and Discourse Ethicists (following Apel and Habermas) argue it is self-evident.

  So, the "slide" is not a logical error per se, but a **metaphysical commitment** disguised as a logical deduction. When you see someone make the move from 3 to 4 without acknowledging this commitment, you are witnessing a rhetorical sleight of hand. When they acknowledge it, they are offering a Transcendental Idealism.
