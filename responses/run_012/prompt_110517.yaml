answer: |-
  - "What this is for, and what it can't do"

  This procedure is a risk-management tool, not a truth machine. Its goal is to protect you from structural fragility in capacity-expansion models used for rate cases. You have one day per model; you cannot verify every equation or data point. Instead, this checklist identifies assumptions that drive headline results despite lacking empirical support. It separates harmless simplifications from hidden drivers that could invalidate a rate case two years later. It is designed to counter the vendor's standard defense that "assumptions don't matter if predictions do."

  It cannot guarantee the model is "true." No model is. It cannot resolve political value judgments disguised as technical inputs. If an assumption reflects a policy choice, such as how much we value future generations versus current costs, this procedure flags it for your director, not you. It also cannot fix bad data. If the input data is garbage, this checklist will only tell you which results are most susceptible to that garbage. Use this to document due diligence and structural risk, not to prove correctness. Your signature confirms you checked the engine, not that the car will never break down.

  - "The procedure, step by step"

  **Step 1: Identify the Driver.**
  *Question:* "Which specific assumptions are required to generate the headline number?"
  *Sufficient Answer:* A vendor-provided list of 3-5 key assumptions linked directly to the main output (e.g., capacity mix, levelized cost).
  *Stop/Escalate:* If the vendor cannot link assumptions to outputs, stop the review. Escalate to your director if the headline number rests on a single, unverified assumption.
  *Justification:* If you don't know what drives the car, you can't check the engine. Friedman's instrumentalism fails if you don't know which assumption produces the prediction.

  **Step 2: Test Materiality.**
  *Question:* "If we relax this assumption, does the headline number move significantly?"
  *Sufficient Answer:* A sensitivity analysis showing the result changes by less than 5% when the assumption is perturbed within realistic bounds.
  *Stop/Escalate:* If the number moves >5%, mark for stress-testing. If it flips the decision (build vs. don't build), escalate to director immediately.
  *Justification:* Predictions matter, but fragile predictions don't count. If the result vanishes when the assumption bends, the assumption is the cause, not the theory.

  **Step 3: Classify the Unrealism.**
  *Question:* "Is this unrealistic to make math possible, to isolate a mechanism, or to hide a known error?"
  *Sufficient Answer:* Vendor categorizes it as Tractability (math), Isolation (focus), or Patch (fix).
  *Stop/Escalate:* If it's a Patch, reject unless documented. If Tractability, proceed to Step 4. If Isolation, check if the ignored variable is material.
  *Justification:* Patches hide errors; idealizations clarify them. You need to know if the unrealism is a lens or a blindfold.

  **Step 4: Interrogate the Backtest.**
  *Question:* "Does the historical data used for backtesting contain the stress this assumption ignores?"
  *Sufficient Answer:* Evidence that past conditions match the future stressor (e.g., past volatility matches future risk, past tech costs match future learning).
  *Stop/Escalate:* If the backtest period was stable but the future is volatile, reject the backtest as proof of robustness.
  *Justification:* Passing a test you didn't take doesn't prove you can pass the real one. History often lacks the variance needed to test structural limits.

  **Step 5: Decision.**
  *Question:* "Is the risk of being wrong acceptable given the assumption's role?"
  *Sufficient Answer:* A documented rationale for Pass, Stress-Test, Reject, or Kick.
  *Stop/Escalate:* Kick to director if the assumption implies a value judgment (e.g., discount rates, equity weighting).
  *Justification:* Technical vetting ends where policy begins. Your job is to flag the value judgment, not to make it.

  - "The kinds of unrealistic assumption the steps sort between"

  **Tractability Idealizations:** These make the math solvable (e.g., perfect foresight, continuous variables). They misfire when the solution method ignores critical volatility, making the model brittle during shocks. The risk is computational stability masking economic instability.

  **Isolation Idealizations:** These strip away confounding variables to study one cause (e.g., ignoring market power, assuming representative agents). They misfire when the ignored variable becomes dominant in the real world, attributing causality wrongly. The risk is explaining the past for the wrong reasons.

  **Ad Hoc Patches:** These fix known model failures without theory (e.g., smoothing demand curves to prevent crashes). They misfire by hiding structural errors, giving false confidence in predictions that lack mechanistic support. The risk is validating a model that only works because it was forced to.

  - "Worked run: perfect foresight in the capacity model"

  **Assumption:** Perfect Foresight (vendors know future prices/policy exactly over 20 years).
  **Verdict:** Stress-Test.
  **Analysis:** I apply Step 3: This is a Tractability Idealization. It makes the optimization solvable without stochastic programming. I apply Step 2: The vendor shows capacity mix changes by 3% when volatility is added, but costs shift by 10%. I apply Step 4: The backtest covers a stable regulatory period, so it passes easily, but Step 4 flags that future policy is less certain than the past. The assumption doesn't break the model, but it underprices risk.
  **Memo Line:** "The model assumes perfect foresight to ensure computational tractability. While this did not distort historical replication, it removes risk premiums from investment decisions. Sensitivity analysis shows cost estimates are robust, but capacity mix shifts under volatility. We recommend stress-testing capacity mix against stochastic price scenarios before relying on headline cost estimates for rate-setting. The assumption is acceptable for cost forecasting but risky for resource adequacy planning."

  - "Worked run: the shared discount rate"

  **Assumption:** Shared Discount Rate (households and firms use the same rate).
  **Verdict:** Kick to Director.
  **Analysis:** I apply Step 1: This assumption drives the "free carbon price" headline. I apply Step 2: When I ask for heterogeneity, the cost benefit vanishes. I apply Step 3: This is an Isolation Idealization that functions as a value judgment. It aggregates distinct risk profiles. I apply Step 4: The backtest passes because past aggregate data masks heterogeneity. The assumption is not technical; it is distributive. It favors capital-intensive projects by lowering hurdle rates for households.
  **Memo Line:** "The model assumes a uniform discount rate across all actors. Sensitivity analysis indicates this assumption drives the finding that carbon pricing has negligible cost. Because this aggregates distinct risk profiles into a single policy variable, the implication is distributive rather than technical. The backtest validates aggregate spend, not individual behavior. This requires policy direction on acceptable equity weighting. I cannot validate this as a technical input; it must be approved as a policy parameter by the Director."

  - "The run where it makes me reject a model I like"

  Sometimes this procedure forces you to reject a model that is user-friendly, widely accepted, and supported by a helpful vendor. Imagine a model with a beautiful interface and great documentation, but it uses a demand smoothing Patch to avoid convergence errors during peak hours. The backtest looks perfect because the smoothing hides the peaks that cause grid stress. Step 3 flags this as a Patch. Step 4 reveals the backtest never faced a true peak demand event. The vendor argues the smoothing is standard practice. You must reject it. This hurts because the alternative is clunky, command-line software that your team hates. But the procedure protects you from approving a model that fails exactly when the grid is most vulnerable. You document the structural fragility. You choose safety over convenience. You explain to your director that the model works until it doesn't, and rate cases cannot afford failure during peak stress.

  - "Where the procedure breaks down"

  This procedure breaks down under novel shocks or intense political pressure. If the future involves a technology or crisis never seen in the backtest, such as a pandemic-scale demand drop or a breakthrough battery technology, Step 4 cannot validate the assumption. The procedure relies on some historical continuity to test sensitivity. It also fails if leadership demands a specific outcome. If your director insists on a model because it yields a preferred rate case result, Step 5 becomes a formality. You can flag the risk, but you cannot stop the approval. Finally, if vendors refuse to run sensitivity tests due to cost or time, you are stuck with expert assertion rather than evidence. In these cases, document the limitation explicitly in your memo. State clearly that the model was vetted for structural consistency, not novel resilience.
