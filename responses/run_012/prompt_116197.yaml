answer: |-
  This is an exceptionally well-conceived pivot. Moving from doctrinal case analysis to the conceptual infrastructure of interpretation is precisely where philosophy of language and social choice theory can make genuine contributions, rather than merely decorating legal arguments with jargon.

  Below is a proposed programme of four sessions (eight papers). I have structured this as a logical dependency chain: each session addresses a question that must be settled (or at least clarified) before the next one can be meaningfully debated. I have integrated your two candidate threads into Sessions 2 and 3, refining them slightly to maximize their tractability for your specific audience.

  ### The Programme: Four Upstream Questions

  **Session 1: The Ontology of the Statute**
  *Question:* **Is the content of a statute communicative content or legal content?**
  *   *Paper A:* The case for the "Standard View" (Statutes communicate instructions; interpretation recovers speaker meaning).
  *   *Paper B:* The case for the "Legal View" (Statutes are law-creating acts; content is determined by norms of the legal system, not linguistics).

  **Session 2: The Metaphysics of the Legislature**
  *Question:* **Can a multi-member body possess the intentionality required for authorship?**
  *   *Paper A:* The Aggregation Challenge (Social choice impossibility theorems applied to legislative intent).
  *   *Paper B:* Group Agency Defences (Functionalist accounts of legislative intent that bypass individual mental states).

  **Session 3: The Epistemology of Public Meaning**
  *Question:* **Can empirical linguistics settle disputes about "ordinary meaning"?**
  *   *Paper A:* Corpus Linguistics as Evidence (Statistical typicality as a proxy for public understanding).
  *   *Paper B:* The Reference Class Problem (Why frequency does not equal authority; selecting the relevant linguistic community).

  **Session 4: The Normativity of Construction**
  *Question:* **When meaning runs out, what licenses judicial discretion?**
  *   *Paper A:* The "Gap-Filling" Conception (Ambiguity triggers a delegated legislative power).
  *   *Paper B:* The "Clarification" Conception (Ambiguity is always resolvable by deeper semantic/purposive analysis).

  ---

  ### Defence of the Ranking

  Here is the justification for this order, addressing your requirements regarding upstream logic, tractability, trade-offs, and conditions for re-ranking.

  #### Session 1: Ontology (Communicative vs. Legal Content)
  *   **Why Upstream:** This is the foundational metaphysical dispute. If statutes are merely *commands* (communicative content), then philosophy of language tools apply directly. If statutes are *sources of law* (legal content), then linguistic meaning is merely one input among many (precedent, policy, morality). You cannot debate *how* to measure meaning (Session 3) or *whose* meaning counts (Session 2) until you agree on *what kind of thing* the meaning is.
  *   **Tractability:** High for philosophers. This maps directly onto speech-act theory (illocutionary force vs. perlocutionary effect) and the distinction between semantic content and pragmatic enrichment. It requires minimal doctrinal knowledge.
  *   **Trade-off:** High importance, low immediate resolution. This is the "hard problem" of the workshop. It risks stalling the conversation if participants dig in.
  *   **Re-ranking Condition:** This moves *down* only if a consensus emerges that legal content *supervenes* on communicative content. If, over the next 2–3 years, formal models show that legal content can be fully derived from semantic content plus a fixed set of priority rules, Session 1 becomes a premise rather than a question, and Session 2 becomes the new upstream starting point.

  #### Session 2: Metaphysics (The Aggregation Problem)
  *   **Why Upstream:** This addresses your second candidate thread. It is upstream of Session 3 because purposivists need a coherent account of "purpose" before textualists need to worry about measuring "meaning." If the legislature cannot have a purpose (due to cycling majorities/Arrow's Theorem), purposivism collapses metaphysically before it fails epistemically. However, it also traps textualists: if the legislature isn't a coherent agent, can it issue a "public meaning" command?
  *   **Tractability:** Very High for social choice theorists. This is the natural home for Arrow's Theorem, Condorcet's Paradox, and list-based voting models. It allows mathematicians and political philosophers to dominate the discussion, sidelining doctrinal lawyers who often wave this problem away.
  *   **Trade-off:** High tractability, but risk of "theoretical irrelevance." Legal scholars often argue that "legislative intent" is a legal fiction that doesn't require literal psychological unity. The workshop must avoid talking past each other (metaphysical possibility vs. legal utility).
  *   **Re-ranking Condition:** This moves *up* (swapping with Session 1) if new work in group agency (e.g., List & Pettit) successfully demonstrates that group intentions are metaphysically robust. It moves *down* if the consensus shifts to viewing "intent" as purely constructive (a judge's tool) rather than descriptive (a fact about the legislature).

  #### Session 3: Epistemology (Corpus & Ordinary Meaning)
  *   **Why Upstream:** This addresses your first candidate thread. It is downstream of Session 1 and 2 because it assumes we have decided *what* we are looking for (communicative content) and *who* is speaking (the public/legislature). It asks: once we know what we want, can we find it? It is upstream of Session 4 because if we can empirically fix meaning, the need for "construction" or gap-filling diminishes.
  *   **Tractability:** High for philosophers of language and empirical linguists. It shifts the debate from "what does this word feel like" to "what are the conditions for semantic reference?" It avoids doctrinal mud-wrestling by focusing on methodology.
  *   **Trade-off:** High novelty, but risk of category error. The danger is conflating *statistical frequency* with *normative authority*. A word can be commonly used wrongly.
  *   **Re-ranking Condition:** This moves *up* significantly if corpus linguistics becomes admissible evidence in supreme courts within 2–3 years. If the practice changes, the conceptual justification becomes urgent. It moves *down* if empirical methods are shown to be incapable of distinguishing between "ordinary meaning" and "technical legal meaning."

  #### Session 4: Normativity (Construction & Discretion)
  *   **Why Downstream:** This is the "break glass in case of emergency" session. It deals with what happens when Sessions 1–3 fail to yield a determinate answer. It is the least conceptual and most practical of the four, which is why it is last.
  *   **Tractability:** Moderate. Requires blending decision theory with normative political philosophy (legitimacy of judicial lawmaking).
  *   **Trade-off:** High practical importance, lower conceptual purity. It risks drifting back into case law (e.g., "absurdity doctrines").
  *   **Re-ranking Condition:** This moves *up* if the "New Textualism" concedes that "construction" (deciding legal effect when meaning is vague) is distinct from "interpretation" (finding meaning). If that distinction becomes the dominant framework, Session 4 becomes the central theoretical battleground.

  ---

  ### Evaluation of Your Candidate Threads

  You asked whether your two threads are red herrings or the same question. **They are not red herrings, but they are currently framed as partisan weapons rather than shared conceptual problems.** Here is how I have integrated them, and what they were missing.

  **1. The Aggregation Problem (Session 2)**
  *   **Verdict:** Keep, but generalize.
  *   **What was missing:** You framed this as a problem *for purposivism*. To make it upstream and conceptual, you must frame it as a problem for *authority*. If the legislature is not a rational agent, on what grounds does its output bind citizens? This hurts textualists too, because "public meaning" often relies on the fiction that the legislature communicated *something* specific to the public.
  *   **Why not drop it:** It is the single strongest point of entry for social choice theorists. Dropping it would waste your colleague's expertise.

  **2. The Corpus/Empirical Question (Session 3)**
  *   **Verdict:** Keep, but narrow.
  *   **What was missing:** You noted the risk of relocating the dispute to "which corpus counts." That is not a bug; it is the feature. The conceptual question is not "does corpus linguistics work?" but "what constitutes the relevant linguistic community for legal authority?" Is it all English speakers? Voters? Lawyers?
  *   **Why not drop it:** It forces textualists to move beyond intuition. It is the most tractable way to make "ordinary meaning" falsifiable.

  **Are they the same question?**
  No. One is about the *speaker* (Aggregation), the other about the *code* (Corpus). However, they converge on the problem of **Group Semantics**. If the legislature is the speaker (Aggregation), does it use the public's code (Corpus) or its own technical code? Making this convergence explicit in Session 2 and 3 will tie the workshop together.

  ---

  ### What to Leave Off (And What You Lose)

  To keep this conceptual, you must exclude questions that are currently fashionable in legal academia but are downstream or doctrinal.

  **1. Exclude: "Originalism vs. Living Constitutionalism"**
  *   **Why:** This is constitutional law, not statutory interpretation. The mechanisms of amendment and entrenchment differ too much.
  *   **Loss:** You lose the political salience of the debate. However, you gain conceptual purity. Statutory interpretation is the cleaner laboratory for these questions.

  **2. Exclude: "The Canons of Construction"**
  *   **Why:** Debating specific canons (e.g., *ejusdem generis*, rule of lenity) is doctrinal. It invites lawyers to recite case law rather than philosophers to analyze principles.
  *   **Loss:** You lose the ability to test your theories against specific legal tools. *Mitigation:* Ask speakers to use canons only as examples of the deeper conceptual problems (e.g., treat the rule of lenity as a tie-breaking rule in Session 4).

  **3. Exclude: "Democratic Theory Justifications"**
  *   **Why:** General questions about "why democracy matters" are too broad.
  *   **Loss:** You lose the big-picture normative context. *Mitigation:* Keep the normativity tied strictly to the *act of interpretation* (Session 4), not the legitimacy of the regime.

  **4. Exclude: "Specific Case Studies (e.g., Bostock, Sweet Home)"**
  *   **Why:** You explicitly requested this, but it bears repeating. Cases come with baggage. Participants will arrive with fixed views on the *outcome*, which poisons the analysis of the *method*.
  *   **Loss:** You lose concreteness. *Mitigation:* Require speakers to use hypothetical statutes or stripped-down examples that isolate the semantic or logical problem without the political valence of real-world litigation.

  ### Summary of Strategy

  By ordering the workshop **Ontology → Metaphysics → Epistemology → Normativity**, you force the participants to build the theory before they apply it.
  *   **Session 1** prevents lawyers from hiding behind "legal effect" when philosophers ask about "meaning."
  *   **Session 2** prevents purposivists from assuming a unitary legislature exists.
  *   **Session 3** prevents textualists from assuming "ordinary meaning" is self-evident.
  *   **Session 4** prevents everyone from pretending the law is always determinate.

  If you stick to this order, you ensure that the social choice theorists and philosophers of language are setting the terms of the debate, rather than merely commenting on the terms set by the lawyers.
