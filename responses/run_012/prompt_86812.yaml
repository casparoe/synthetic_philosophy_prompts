answer: |-
  You have correctly identified the central engine of the debate you are sitting in. The pattern you are seeing is not just a vague similarity; it is the structural backbone of a specific, well-defined philosophical problem. The slippage you notice between causation, explanation, and concepts is not accidental—it is the primary source of friction in the literature, and recognizing it puts you ahead of most students in that seminar.

  Here is the carving you asked for.

  ### 1. The Name and the Carving
  The established name for this pattern is **The Causal Exclusion Problem** (often associated with the **Exclusion Argument**).

  To answer your question about what the claim is about: it is primarily an **ontological** claim forced by **explanatory** practices.
  *   **Ontology:** The worry is that if the physical world is "causally closed" (every physical effect has a sufficient physical cause), there is no "room" left for the coarse-grained cause (the mind, the design flaw, the function) to do any real work.
  *   **Explanation:** The pressure comes from the fact that our fine-grained explanations are complete. If the physics story tells the whole truth about what happened, the design story looks like a mere summary.
  *   **Concepts:** The slippage happens because proponents of exclusion often treat concepts as if they were objects. They argue that because the *concept* of "design flaw" is nothing over and above the *concept* of "stress distribution," the *property* of being a design flaw cannot be a distinct cause.

  Your intuition that people slide between these three is correct. The debate persists because some philosophers try to solve it by changing the ontology (saying coarse causes are real), while others change the theory of explanation (saying coarse causes are just useful fictions), and others change the concepts (saying coarse properties are identical to fine ones).

  ### 2. Exclusion vs. Overdetermination vs. Symptom
  You are right to distinguish this from overdetermination.
  *   **Overdetermination** requires independence. If two shooters fire independently and kill a victim, the death is overdetermined. This is acceptable because the causes are distinct events.
  *   **Exclusion** relies on **dependence**. The design flaw *depends* on the stress distribution; the mental state *depends* on the neural state. Because they are not independent, you cannot say both caused the effect without "double counting." The exclusion argument says you must pick one, and the fine-grained one always wins because it is physically sufficient.

  How is this different from saying the coarse cause is a mere symptom?
  *   Calling it a **symptom** (or epiphenomenon) is the *conclusion* of the exclusion argument, not the pattern itself. The pattern is the *pressure* that forces you toward that conclusion.
  *   The exclusion problem is the dilemma: Either accept that coarse causes are real (and risk violating physical closure) or accept that they are idle (and accept epiphenomenalism). The pattern you see is the mechanism that pushes you toward the second horn.

  ### 3. The Stats Demo: Same Structure, Different Stakes
  The stats demo is structurally identical but metaphysically neutral.
  *   **The Relation:** In statistics, this is called **Mediation** resulting in **Screening Off**. If variable $X$ (coarse) affects $Y$ (outcome) only through $M$ (fine), adding $M$ to the regression model reduces $X$'s coefficient to zero. $M$ "screens off" $X$ from $Y$.
  *   **The Difference:** In stats, we care about **predictive variance**, not **causal power**. When the coefficient goes to zero, we say $X$ has no *direct* effect, but it still has an *indirect* effect. We don't worry that $X$ ceases to exist.
  *   **The Connection:** Philosophers use this statistical structure as a model for metaphysical exclusion. The worry is that if the fine story "absorbs" the coarse story in reality the way it does in the model, the coarse story isn't just statistically redundant—it's ontologically idle.

  ### 4. Where the Pattern Fails
  The pattern fails when the fine-grained story is **too specific** to be the actual cause of the coarse-grained effect. This is the strongest counter-argument to exclusion.

  *   **The Case:** Consider a pigeon trained to peck at red objects. It pecks at a scarlet triangle.
      *   **Fine Story:** The object was *scarlet*.
      *   **Coarse Story:** The object was *red*.
      *   **The Failure:** If you say the *scarlet* color caused the peck, you imply that if the object had been crimson (still red, but not scarlet), the pigeon wouldn't have pecked. But the pigeon would have pecked. The fine-grained property (scarlet) is too specific; it excludes relevant possibilities that the coarse-grained property (red) includes.
  *   **The Account:** This is known as the **Proportionality Constraint** (developed by Stephen Yablo). A cause must be proportional to its effect. It must be specific enough to produce the effect, but general enough to cover all the ways the effect could have happened.
  *   **Why it matters:** In your bridge example, the "design flaw" might be the proportional cause of the "collapse," whereas the "specific crack propagation" is the cause of the "specific rubble pattern." If the effect we care about is the collapse (coarse), the fine story is actually *too detailed* to be the cause. The coarse story supports counterfactuals the fine story misses (e.g., "If the stress had been distributed differently but still exceeded the threshold, the bridge would still have collapsed").

  ### 5. Definition and Application
  Since there is an established term, I will not coin a new one, but I will define it sharply so you can apply it to your seminar readings.

  **The Causal Exclusion Problem** applies when:
  1.  **Supervenience/Dependence:** A coarse property ($M$) depends on a fine property ($P$).
  2.  **Closure:** The fine property ($P$) is causally sufficient for the effect ($E$).
  3.  **Distinctness:** $M$ and $P$ are treated as distinct candidates for causation.
  4.  **Exclusion:** It is assumed that an effect cannot have more than one sufficient cause (unless it is genuine overdetermination).

  If all four hold, $M$ is excluded. To solve it, you must reject one. (Non-reductive physicalists usually reject #4 or argue that $M$ and $P$ are not distinct in a way that triggers competition).

  Verdict: Causal Exclusion — The metaphysical tension arising when a causally sufficient lower-level description appears to render a dependent higher-level description ontologically idle.
