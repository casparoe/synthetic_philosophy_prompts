  6.  **Self-Correction/Review during drafting:**
      *   *Wait, did I address the brother's point?* Brother says "treat the thing I'm actually certain about -- that the Tuesday slot was empty -- as my evidence." Actually, the brother is technically right about *what* is evidence. The empty slot *is* the evidence. The uncertainty is in the *interpretation* (Likelihood). I need to clarify that distinction.
      *   *Did I address the friend's point?* Friend says "update everything else on that 80%." This implies using the posterior after E1 as the prior for E2. This is valid *if* the 80% was calculated correctly from the original prior. If the 80% came from a different source (general stats) and the 65% came from the user's gut, combining them is messy.
      *   *Key Insight:* The order dependence proves the inputs are inconsistent. You can't have a Prior of 35% (took meds) AND a Likelihood that results in 80% (took meds | empty) AND a different Likelihood for the phone call that yields different results based on order. The parameters (Likelihoods) are likely being estimated inconsistently.
