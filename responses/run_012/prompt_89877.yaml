  5.  **Addressing the "Humean" Impression:**
      *   Williams is often called a Humean, but he distanced himself from classical Humean psychology. He accepts deliberative reasoning can generate new motivations. So, "Humean" is a label of convenience but potentially distorting if it implies simple desire-based psychology.

