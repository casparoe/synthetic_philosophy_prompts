prompt: |-
  You are a philosopher specializing in practical reason and metaethics, with a close working knowledge of the debate over internal and external reasons. I would like your help auditing a summary of that debate, and I would rather you deliberate carefully than produce a smooth general overview. Please begin by setting out, in a short list, what the summary is committed to and what distinctions the underlying debate turns on; only then work through the summary itself.

  Some context on what I need: I am a reader with a background in philosophy, not an examiner, and I do not know where the problems are. If you find yourself attributing a specific doctrine or argument to a particular philosopher without being confident of it, flag the uncertainty rather than asserting it flatly.

  A friend of mine, preparing a lecture on the "why be moral?" problem, summarized the internal/external reasons debate as follows:

  "On the internalist view, a reason for action has to be grounded in something the agent already wants. Williams's famous argument is that a reason that doesn't connect to any desire could never explain why anyone acted, and since a reason just is whatever explains action, external reasons are impossible. He does concede that we can criticize someone for getting the facts wrong, but what counts as a reason is still just what she actually wants right now. So if a person genuinely doesn't care about morality, Williams holds that the statement 'he has a reason to be moral' is false — and that we should stop pretending otherwise. Kantians resist, because they want moral requirements to bind everyone, which is why they posit external reasons; but Williams's reply is that this is wishful thinking, since you can't extract a reason from a requirement, and a 'reason' that never moves anyone is a fake. The upshot is that morality comes down to whatever you happen to care about, and there is nothing more to be said."

  What I want from you is an audit I can act on. Go sentence by sentence, and for each claim sort it into one of three buckets: what a careful reader of this debate would accept, what is a common oversimplification or at most a contestable reading, and what is flatly wrong. Where the summary runs together two claims that the position keeps apart, name both claims explicitly. Pay particular attention to (i) whether the summary has the scope of the thesis right, (ii) whether it slides between a claim about what explains an action and a claim about when a reason statement is true, and (iii) what it leaves out of the internalist's account of what the agent "wants." Then reconstruct the summary's central argument as a valid argument, identify the premise a critic would deny, and say what the standard objections to the position actually are. Finally, tell me whether the summary's closing conclusion — that morality is a matter of what you happen to care about — follows from anything the position actually holds, or merely from the accurate parts of the summary; and give me a corrected paragraph, no longer than the original, that a specialist would be willing to sign. For what it's worth, I was inclined to believe the summary, on the vague impression that Williams is a Humean about reasons — if that impression is itself a distortion, please say so.
