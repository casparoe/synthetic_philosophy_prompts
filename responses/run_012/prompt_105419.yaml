prompt: |-
  I've got a funded year coming up where I can work on basically whatever I want inside infinite ethics — the bit of value theory that asks what happens to ethics when the good or bad in question is infinite rather than finite. My background is logic and set theory, not cosmology, and I want to spend the year on the questions that actually matter rather than the ones that just look fun. So: what are the main open questions in this area, and which two or three should someone with my background prioritise? I care way more about the reasoning than the list — for each one, is it upstream of the others, is it tractable with the tools a logician already has, and what would actually move it up or down the ranking over the next couple of years?

  Two things I keep getting told that I'm not sure I buy. First, that infinite cases are just a distraction and all the real action is in finite population ethics. Second, that the whole area collapses into "infinities are all big so everything's equally good," so there's nothing left to work out. And the puzzle that got me into this in the first place: if the world already contains infinitely much value, then any finite good I do seems to make literally no difference to the total, which would make ethics pointless. I'd like you to take a definate position on whether that puzzle, or the two claims, actually reshape the agenda — because if any of them is right, the whole ordering changes.

  Please commit to an ordering and defend it; don't hand me a menu of options and leave me to pick. And lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate the question back at me.
