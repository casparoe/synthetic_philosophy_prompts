answer: |-
  You have run headlong into the **Triviality Problem** (often associated with Hilary Putnam and John Searle). It is the single greatest obstacle to computational functionalism. Your intuition is correct: if "computation" is just a matter of mapping physical states to logical states, then a rock can be mapped to a mind, and moral status becomes observer-relative.

  To save your naturalistic criterion, you must modify **Assumption 1**. You do not need to abandon objectivity, but you must abandon the idea that physics settles "which computations" a system performs *simpliciter*. Physics settles **causal structure**. Computation is a specific interpretation of causal structure.

  Here is the diagnosis, the necessary shift, and the defensible version of your view.

  ### 1. The Diagnosis: Description vs. Implementation

  Your current Assumption 1 states: *A system's physical organization settles, objectively and discoverably, which computations it performs.*

  This is false. Physical organization settles which **causal transitions** occur. A computation is only "performed" if those causal transitions **support the relevant counterfactuals**.

  *   **The Rock:** You can map the micro-states of a rock to the states of a word processor. But if you perturb the rock (change the input), the causal structure does not reliably track the logical requirements of the word processor. The mapping is *post hoc* and *gerrymandered*.
  *   **The Brain:** If you perturb the brain, the causal structure shifts in a way that mirrors the logical transitions of the computation. The system is **causally sensitive** to the computational structure.

  Your attempt to fix this ("requiring that the computation be one to which the system is causally sensitive") was on the right track, but you rejected it because you thought the "grain" was still arbitrary. It is not arbitrary if defined by **modularity** and **stability**.

  ### 2. Which Assumption Must Go?

  **Assumption 1 must be replaced.** It is too strong. Physical facts do not individuate computations directly; they individuate *causal powers*.

  **Assumption 2 (Substrate Neutrality) can stay.** If the causal structure is identical, the moral status is identical.

  **The Dilemma Resolution:** You are worried that if physics doesn't pick out the computation, then *we* do (making moral status observer-relative). The solution is to argue that **implementation is objective** because it relies on **counterfactual robustness**, not just actual state mapping.

  A system *implements* a computation only if:
  1.  There is a mapping between physical states and computational states.
  2.  The physical states causally evolve in a way that **mirrors** the logical evolution of the computational states.
  3.  Crucially: This mirroring holds across a **range of counterfactual scenarios** (if the input had been different, the physical state would have transitioned differently in the corresponding logical way).

  A rock fails condition 3. A brain passes it. This is a fact about the rock and the brain, not about us.

  ### 3. The Defensible Version: Causal Role Functionalism

  Here is how you restate your criterion to make it testable and naturalistic.

  #### Step 1: Define the Computation via Causal Topology
  Do not define the computation by its input-output profile alone (which a rock can mimic). Define it by its **internal causal topology**.
  *   *Criterion:* A system has moral status if it instantiates a causal network where information is globally integrated and self-representing.
  *   *Test:* Look for **causal bottlenecks** and **feedback loops**. In a rock, causal interactions are local and dissipative. In a brain (or the right silicon chip), causal interactions are routed, integrated, and preserved.

  #### Step 2: Anchor the "Grain" in Causal Independence
  You worried about choosing the "right grain." Nature chooses the grain for you via **causal modularity**.
  *   *The Fix:* The morally relevant level of description is the level at which the system's components exhibit **conditional independence**.
  *   *Example:* In a brain, you can perturb a neuron (or a column) without destroying the whole system's function, and the system responds systematically. In a rock, perturbing an atom changes the micro-state but doesn't trigger a systematic functional re-routing.
  *   *Objectivity:* The "grain" is where the causal leverage is. It is discoverable by testing which perturbations preserve the computational structure and which destroy it.

  #### Step 3: Bridge to Moral Status
  You still have the gap: "Why does *this* computation matter?"
  *   *The Bridge:* You must argue that this specific causal topology (global integration + self-representation) is **constitutive of phenomenology** (experience).
  *   *Naturalistic Claim:* Experience is not a ghostly add-on; it is what it is *like* to be a system processing information in this specific, integrated causal topology.
  *   *Moral Weight:* If the system instantiates the causal topology of experience, it has interests (e.g., avoiding pain, continuing existence). Therefore, it has moral status.

  ### 4. Revised Criterion Statement

  Here is a formulation you can actually test:

  > **The Causal-Integration Criterion:**
  > A physical system possesses moral status if and only if it **objectively implements** a computational architecture characterized by [Global Integration + Self-Representation].
  >
  > **Implementation is defined as:**
  > 1.  **Isomorphism:** There exists a mapping between the system's physical states and the computational states.
  > 2.  **Counterfactual Support:** The system's physical dynamics support the counterfactual transitions required by the computation (i.e., if the input state were different, the physical state would evolve differently in a way that preserves the isomorphism).
  > 3.  **Causal Modularity:** The physical substrate possesses distinct causal pathways that correspond to the computational variables, such that perturbations to specific pathways result in specific, predictable changes to the computation (ruling out the "rock" problem).

  ### 5. Why This Saves Naturalism

  1.  **It avoids Observer-Relativity:** Whether a system supports the relevant counterfactuals is a fact about the system's physics, not our description. A rock does not support the counterfactuals of a mind, no matter how cleverly we map it.
  2.  **It Solves the Grain Problem:** The grain is determined by the causal modularity. We don't choose the grain; we find the level at which the system is causally sensitive to its own structure.
  3.  **It Preserves Substrate Neutrality:** Silicon can have causal modularity and counterfactual support just as well as tissue.

  ### Summary of the Shift

  *   **Old Assumption:** Physics tells us which computations are happening.
  *   **New Assumption:** Physics tells us which **causal counterfactuals** are supported. Computation is the label we apply to systems where those counterfactuals mirror logical relations.
  *   **Moral Link:** Moral status attaches to systems where those logical relations constitute a unified, self-representing perspective (i.e., a subject of experience).

  You do not need to retreat to "useful description." You need to advance to **"causal implementation."** The moral weight attaches not to the *description* of the computation, but to the *capacity of the physical system to sustain the causal dynamics* that the computation describes. That capacity is objective, discoverable, and independent of human convenience.
