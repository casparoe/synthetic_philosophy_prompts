      5.  **Moral Weight:** Explain why this specific causal topology matters (it realizes value/experience).
      6.  **Summary:** The defensible view is "Causal Role Functionalism."

  8.  **Tone Check:** Keep it philosophical, precise, and empathetic to the difficulty. Avoid jargon where possible, but use necessary technical terms (counterfactuals, supervenience, isomorphism).

