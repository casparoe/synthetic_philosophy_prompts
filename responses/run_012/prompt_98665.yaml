prompt: |-
  I'm trying to state a naturalistic criterion for moral status and I keep failing to get it into a form I can actually test. The criterion I want is roughly this: a system matters morally when it performs computations of the right kind — computations that are globally integrated and self-representing, say — and not otherwise. Two things I have been taking for granted. First, that a system's physical organization settles, objectively and discoverably, which computations it performs; that is what lets me say that a brain performs the relevant computations and a rock does not, as a matter of fact rather than preference. Second, that the moral weight attaches to the computation and not to the material, so that the same computation realized in silicon would carry the same status as in tissue.

  The step I cannot make is the one from "this system performs computations" to "these computations matter." If the physical facts settle which computations a system performs, then presumably they settle it at every level of description at once: the same system can be described as computing a coarse input–output relation or as realizing an exact micro-causal trajectory, and both descriptions are equally faithful to the physics. My criterion has to single out one of those levels as the morally relevant one, and I cannot find anything in the physics that privileges one over the others. I tried requiring that the computation be one to which the system is causally sensitive at the right grain — so that perturbing the realization would change the computation — but that only pushes the problem back, since the right grain is again something I seem to be choosing.

  Does this mean my first assumption is simply false, and that nothing settles the matter until someone describes the system? If so, does the criterion collapse into "a system matters morally when it can be usefully described as doing X," which would make moral status depend on our descriptive convenience? Or am I running together the question of which computations a system performs and the question of which ones it implements, where only the second is supposed to do the moral work? Tell me which assumption has to go, and what the defensible version of the view looks like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Goal:** Formulate a naturalistic criterion for moral status based on computation (specifically, globally integrated, self-representing computations).
      *   **Assumption 1 (Physicalism/Objectivity):** Physical organization objectively determines which computations a system performs (Brain = Yes, Rock = No).
      *   **Assumption 2 (Substrate Neutrality):** Moral weight attaches to the computation, not the material (Silicon = Tissue).
      *   **The Block:** The "Triviality Problem" or "Pancomputationalism." Physics allows multiple levels of description. A system can be described as computing *anything* depending on the mapping. How do we privilege the *morally relevant* level of description without appealing to an observer's interest/convenience?
      *   **The Dilemma:**
          *   Option A: Assumption 1 is false (computations aren't objective). -> Moral status becomes observer-relative (unacceptable for naturalism).
          *   Option B: Distinguish "performing" vs. "implementing" computations.
          *   Option C: Find a physical constraint that privileges the relevant grain.
      *   **Request:** Tell me which assumption has to go and what the defensible version looks like.

  2.  **Deconstruct the Philosophical Landscape:**
      *   This is a classic problem in philosophy of mind and ethics, often associated with Hilary Putnam (triviality of automata), John Searle (syntax is not intrinsic), and David Chalmers (implementing computation).
      *   The user is hitting the "Mapping Problem." Any physical system can be mapped to any finite state automaton if the mapping is arbitrary enough.
      *   To save the view, we need *constraints on implementation*.
      *   Key distinction: *Simulation/Description* vs. *Causal Implementation*.

  3.  **Evaluate the Assumptions:**
      *   *Assumption 1 (Physical facts settle computations):* This is the weak link. Strictly speaking, physics settles causal relations, not "computational labels." Computation is an interpretive layer *on top of* physics. However, strong computationalists argue that causal structure *is* computational structure if constrained correctly.
      *   *Assumption 2 (Substrate Neutrality):* This is generally robust within functionalism.
      *   *The "Grain" Problem:* The user notes that physics settles facts at *every* level. But does it? Micro-physics is fundamental. Macro-descriptions (like "computing addition") are emergent. The privilege of the macro-level usually comes from *stability* and *counterfactual support*.

  4.  **Formulate the Solution:**
      *   **Diagnosis:** The user is right to worry. Assumption 1 is too strong in its current form. Physical facts alone do not individuate computations without reference to *counterfactual robustness* and *causal modularity*.
      *   **The Fix:** We need to shift from "which computations does it perform?" to "which causal structures support the relevant counterfactuals?"
      *   **Key Concept:** *Causal Implementation* (not just description). A system implements a computation if its physical states map to computational states *such that the causal transitions between physical states mirror the logical transitions between computational states.*
      *   **Addressing the Grain:** The "right grain" isn't chosen by convenience; it's chosen by *causal independence* and *robustness*. A rock doesn't support the counterfactuals required for complex integration. If you poke a rock, it doesn't re-route information; it just moves atoms. A brain does.
      *   **Addressing Moral Status:** The moral weight comes from the *capacity for experience/agency* supervening on that causal structure. If the structure is there, the status is there.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the depth:* This is a sophisticated problem (Putnam/Searle/Chalmers territory).
      *   *Direct Answer:* Assumption 1 needs modification, not rejection. It's not that physics settles "computation" directly, but that physics settles "causal structure," and computation is a specific *kind* of causal structure.
      *   *The "Triviality" Objection:* Explain why the rock computes everything (arbitrary mapping) and why that's wrong for *implementation*.
      *   *The Solution - Counterfactual Robustness:* The computation must be supported by the system's disposition to behave differently under different inputs. The mapping must be *natural*, not gerrymandered.
      *   *Distinguish "Described as" vs. "Implements":* This is the user's Option C. It's the right path.
      *   *Refining the Criterion:* Instead of "performs computations," use "instantiates a causal topology isomorphic to the computation."
      *   *Moral Relevance:* Why *this* computation? Because it correlates with sentience/integration (IIT or Global Workspace Theory vibes).
      *   *Conclusion:* The defensible view is "Causal Functionalism."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is Assumption 1 false?* Searle says syntax is observer-relative. Chalmers says implementation is objective but requires counterfactuals. I should side with Chalmers here because the user wants a *naturalistic* criterion. If syntax is purely observer-relative, naturalism fails. So, we must argue that *implementation* is objective.
      *   *How to make it objective?* By tying it to *causal powers*. A rock doesn't have the causal powers to support the state transitions of a mind.
      *   *The "Grain" issue:* The grain is determined by the *functional modules*. If a system has distinct causal pathways that can be perturbed independently, that defines the grain.
      *   *Moral Status:* Link the computation to *phenomenology*. The computation matters because it *is* (or realizes) experience.

  7.  **Finalizing the Structure:**
      1.  **Validate:** You have identified the "Triviality Problem" (Putnam).
      2.  **Diagnose:** Assumption 1 is the culprit, but it doesn't need to be abandoned, just refined. Computation isn't intrinsic to matter, but *implementation* is intrinsic to causal structure.
      3.  **The Pivot:** Move from "computation as description" to "computation as causal topology."
