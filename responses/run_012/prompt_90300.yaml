answer: |-
  The honest answer is that there is no single canonical name for this specific methodological slippage in interpretability literature. You are describing a specialized instance of the **correlation-versus-causation problem**, but elevated by the ambiguity of the word "representation."

  Here is the definite position you asked for: The camp that claims "we found a representation" based solely on probe accuracy is wrong. They have found **information**, not representation. Information is static; representation implies a functional role. If you can read the tense off the activations but removing them changes nothing, the model isn't *using* that information to represent time; the information is merely an epiphenomenon—a shadow cast by the real machinery elsewhere.

  However, the ablation camp is also vulnerable, as you noted. If behavior breaks when you ablate a direction, it proves causal necessity *in that specific instance*, but it doesn't prove that direction is *the* representation if the system is redundant. This is the **distributed representation** problem (or superposition). If the job can be done by a cloud of directions, no single direction holds the title of "representation."

  So, is this just "correlation isn't causation" in a lab coat? Structurally, yes. But it is distinct because of the **semantic load** of the word "representation." In philosophy of mind, you are recalling **Functional Role Semantics** (or Functionalism): a state represents something only if its causal role in the system is to carry that information. Your character is right to be suspicious. The slide happens because researchers want the philosophical weight of "representation" (meaning the model *knows* time) while only satisfying the statistical bar of "decodability" (meaning time *can be inferred*).

  The edges for licensing "the model represents X" are strict:
  1.  **Decodability:** You must be able to read X from the state (necessary but not sufficient).
  2.  **Causal Efficacy:** Intervening on X must change behavior related to X (necessary but not sufficient due to redundancy).
  3.  **Robustness:** The causal link must hold across perturbations or model re-initializations, ruling out accidental plumbing.

  Most papers stop at step 1 or 2. The slide is the opportunistic movement between them. Since there is no established name, your character should coin one that highlights the logical error.

  \answer{The Representational Equivocation — Sliding between decodable info and causal use}
