          *   *The Challenge:* Where does *that* assertion come from? If it comes from outside the system, who/what provided it? If it comes from inside, you're back at square one.
          *   *The "Hand-Off" Argument:* This addresses the user's specific wish. You aren't generating consistency; you are *importing* it. If a machine is embedded in an environment that provides consistency checks, it can "step up."
      *   **Section 3: Strong vs. Weak Version (Physics vs. Logic).**
          *   *Weak (Logic only):* Mind isn't a *formal system*. Could still be a computer (heuristic, messy).
