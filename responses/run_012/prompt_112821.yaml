          *   *Verdict:* The logic alone doesn't prove non-computability, just non-formalizability. To get "non-machine," you need the physics.
      *   **Section 4: The Unfalsifiability Charge (Moving the Goalposts).**
          *   Is it a "no-lose" situation?
