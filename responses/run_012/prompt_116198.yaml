      *   *Position C (Expected Value/Proportional Review):* Acknowledge uncertainty but reject infinite leverage. Use a screening mechanism to filter frivolous claims without halting science. Burden lies on objectors to specify theory + credence.
      *   *Key Tension:* Pascal's Mugging. If any non-zero probability times infinity = infinite obligation, science stops. Need a threshold for "reasonable credence."
      *   *Key Tension 2:* Burden of Proof. Does science need to prove safety (negative proof) or do objectors need to prove harm (positive proof)? Given the metaphysical uncertainty, demanding proof of safety is impossible. Demanding proof of harm is also hard but manageable via specific theories.
