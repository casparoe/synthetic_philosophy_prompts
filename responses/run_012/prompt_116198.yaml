  **ETHICS ADVISORY PANEL: OPINION 2024-03**
  **TO:** Panel Members and Directorate
  **FROM:** Chair, Ethics Advisory Panel
  **SUBJECT:** Disposition of Quantum Optics and Computational Chemistry Proposals

  **1. Dispositions**

  **Proposal A (Quantum Optics):** **Approve with Conditions.**
  The scale of decoherence events is vast, but the physical basis for attributing experience to cold atoms remains speculative. The risk is non-zero but currently below the threshold for moratorium.
  *Condition:* The Principal Investigator (PI) must submit a Level 2 Declaration (see Section 2) prior to the first experimental run.
  *Owner:* PI. *Deadline:* 14 days before campaign start. *Cost:* < 1 person-week.

  **Proposal B (Computational Simulation):** **Approve with Conditions.**
  Simulated agents lack biological substrate, but functionalist theories of mind assign non-zero credence to their capacity for experience.
  *Condition:* The PI must submit a Level 2 Declaration specifying the architecture's relation to known correlates of consciousness.
  *Owner:* PI. *Deadline:* 14 days before campaign start. *Cost:* < 1 person-week.

  **2. The Screening Ladder**

  The panel should **Amend and Adopt** the proposed four-level ladder. The original draft fails to address the "Pascal's Mugging" objection: that multiplying a tiny credence by a huge number of subjects generates infinite ethical obligation, paralyzing research. To prevent this, we must introduce a *credence threshold*.

  **Amended Ladder:**
  *   **Level 0 (No Review):** Standard operations.
  *   **Level 1 (Declaration):** PI states whether any *peer-reviewed* physical or computational theory assigns non-zero credence to experience in the system.
  *   **Level 2 (Independent Review):** Triggered if Level 1 identifies a theory with **>1% credence** among experts in that field. Requires an external reviewer to validate the credence and propose a stopping condition.
  *   **Level 3 (Moratorium):** Triggered only if Level 2 concludes the expected disvalue (credence × number of subjects × intensity) outweighs the scientific benefit.

  **Reasoning:** This respects the member arguing "category error" by demanding established theory rather than logical possibility. It respects the member arguing for "moratorium" by creating a pathway to halt work if expected harm becomes tangible. It defeats the "multiplication machine" by requiring the credence to be non-negligible before the numbers matter.

  **3. Burden of Proof**

  The facility owes a **procedural showing of safety**, not a substantive one. It is impossible to prove a negative regarding metaphysical questions (i.e., proving atoms *do not* feel). Therefore, the **objector owes a positive showing of harm** grounded in specific theory.

  *Defense:* Shifting the burden to the facility to prove "no experience" demands omniscience regarding the nature of mind. Shifting it entirely to the objector invites dismissal of legitimate uncertainty. The amended ladder splits the difference: the facility must screen for known theories (procedural), but the objector must identify a specific theory with significant credence to trigger restrictions (substantive).

  **4. The Moral Status of Fleeting Experience**

  Does a momentary, unremembered, non-unified experience wrong anyone? **Yes.** Pain does not require memory to be harmful; a moment of suffering is a moral negative even if instantly erased. However, mere "experience" without *valence* (positive or negative quality) carries no ethical weight.

  *Impact on Recommendation:* This strengthens the requirement for Level 2 review. We are not concerned with atoms "experiencing" existence, but with atoms experiencing *suffering*. Since current theories do not suggest decoherence events carry negative valence, the risk remains low, supporting approval. If a theory emerged linking decoherence to negative valence, the disposition would change.

  **5. Permission vs. Bounded Research Programme**

  This is not a binary permission decision; it is a **bounded research programme**. The directorate should fund the investigation into the limits of these systems alongside the physics.
  *What to buy:* Dedicated monitoring of the "ethical metadata" (decoherence counts, simulation step complexity) alongside physical data.
  *By when:* Reviewable at the mid-campaign checkpoint (Year 5 for Proposal A; 10^9 steps for Proposal B).
  *Reasoning:* Treating this as a one-off permission ignores the cumulative nature of the risk. A bounded program allows us to gather data on the systems' complexity without halting progress, treating the ethical uncertainty as a variable to be managed, not a stop-sign.

  **6. Relation to Environmental and Biosafety Screening**

  This review is **different in kind** from environmental or biosafety screening.
  *   *Biosafety/Environmental:* Deals with physical causal chains (pathogens escape, radiation leaks). Harm is intersubjectively verifiable.
  *   *Metaphysical Safety:* Deals with ontological status (is this system a subject?). Harm is theoretical and unverifiable.
  *Implication:* We cannot use standard risk matrices (Probability × Severity) because "Severity" is undefined. We must use a *Precautionary Threshold* model (see Section 2). Existing biosafety protocols handle the physical containment; this opinion handles the ontological containment.

  **7. Defeaters: What Would Change This Recommendation?**

  I would move to **Reject** or **Defer** if:
  1.  **Theoretical Shift:** A major peer-reviewed theory emerges linking quantum decoherence or computational complexity directly to *negative valence* (suffering), not just experience, with >5% expert credence.
  2.  **Structural Isomorphism:** The simulation in Proposal B demonstrates behavior indistinguishable from distress signaling that cannot be explained by simple optimization rules.
  3.  **Consensus Shift:** The broader philosophy of mind community reaches a consensus (not merely a majority) that panpsychism or functionalism is the dominant framework, raising the baseline credence above the 1% threshold.

  **8. Conclusion**

  We face deep uncertainty. The "category error" members are right that we lack evidence for experience in these systems. The "moratorium" member is right that the stakes are potentially infinite. The amended ladder navigates between paralysis and recklessness. It demands specific theoretical grounding before halting science, protecting the facility from infinite leverage while acknowledging that mind may be more widespread than biology.

  Vote on the dispositions and the amended ladder at the March meeting.

  **[Signature]**
  **Chair, Ethics Advisory Panel**
