  ### Sub-Problem Credences
  **1. The Pointing Problem: 0.95**
  *Justification:* Goodhart's Law is a structural feature of optimization, not a bug; any compressible specification will admit adversarial inputs that maximize the spec while violating the intent.

  **2. The Generalization Problem: 0.95**
  *Justification:* Induction is underdetermined by data; there is no mathematical guarantee that a loss-minimizing trajectory on the training distribution implies safety on the deployment distribution without specific inductive biases we do not yet control.

  **3. The Who-Decides Problem: 0.85**
  *Justification:* This is a genuine coordination failure, but I deduct confidence because it is arguably a governance problem distinct from "alignment" proper, though inseparable from safe deployment.

  **4. The Moving-Target Problem: 0.70**
  *Justification:* This depends on meta-ethics; if human values converge under reflection or can be locked via constitutive rules, this problem dissolves, making it less fundamental than 1 or 2.

  ### Separability vs. Entanglement
