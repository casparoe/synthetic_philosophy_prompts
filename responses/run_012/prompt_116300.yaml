answer: |-
  1. The method must permit inference from singular, non-utilitarian events without requiring behavioral repetition, motivated by sealed deposits of unused objects that defy habitus-based models. This is non-negotiable, and an attribution fails if similar objects appear in domestic refuse contexts, which would contradict the claim of unique ritual seclusion.

  2. The method must allow for ideological discontinuity absent material or socioeconomic correlates, motivated by mortuary shifts occurring in isolation from other detectable record changes. This is non-negotiable, and an attribution of symbolic autonomy fails if the mortuary change correlates perfectly with shifts in resource availability, reducing belief to ecological adaptation.

  3. The method must distinguish between shared symbolic intent and divergent production habits, motivated by identical objects produced via different techniques in adjacent households. This is non-negotiable, and an attribution of shared intent fails if the techniques map onto distinct ethnic boundaries marked by other material culture, proving technical variance entails semantic variance.

  4. The method must explain institutional stability across generational turnover without inferring changing beliefs from changing agents, motivated by monuments whose design remains constant through several generations of rebuilding. This is non-negotiable, and an attribution of continuity fails if the rebuilding shows progressive structural degradation ignored by builders, indicating loss of institutional knowledge rather than maintenance.

  5. The method must specify material conditions that would count as evidence against an attributed belief, motivated by the need to prevent circular reasoning in ethnographic analogy. This is non-negotiable and does most of the excluding, though it creates tension with the first requirement since singular events resist falsification via absence, demanding a higher burden of positive proof to avoid confirming bias.
