  **The Weekend Herald** | **Life, Uncomplicated**
  **By Dr. Felicity Vane**

  Welcome back to *Life, Uncomplicated*. This week, I'm sensing a theme of paralysis. You are all suffering from what I call 'The Pre-Choice Shiver'. You believe the reason must exist before the decision. My *Afterglow Principle* dictates the opposite: the reason is a flower that only blooms after you have planted the seed. Stop looking for the map. Walk, and the path will appear beneath your feet.

  ***

  **Dear Felicity,**
  **My father needs a care home. There are two in our town. They are identical in cost, distance, care ratings, and even the colour of the curtains. I have visited both three times. There is literally nothing to choose between them. I feel frozen. If I pick the wrong one, I'll never forgive myself. How do I decide when there is no difference?**
  **— Stuck in Stoke**

  **Dear Stuck,**
  You say there is no difference, yet you are suffering. This proves the difference is not in the homes, but in you. You are waiting for a external signal to absolve you of responsibility. There is none. According to the *Afterglow Principle*, value is not discovered; it is assigned. Flip a coin. Heads, Home A. Tails, Home B. The moment you commit, your mind will begin to highlight the virtues of the chosen home and forget the other. The reason does not precede the choice; it follows it like a loyal dog. Stop waiting for permission to be decisive. The emptiness you feel is not a puzzle; it is freedom. Pick one. The love you put in afterwards is what makes it right.

  ***

  **Dear Felicity,**
  **I am torn between two lives. I can stay here and care for my aging mother, honouring my family duty and preserving our history. Or, I can take a grant to lead a conservation expedition in the Amazon, fulfilling my life's work in science. One is about loyalty and the past; the other is about discovery and the future. They aren't equal, but I can't weigh them against each other. How do I choose between two different kinds of good?**
  **— Torn in Torquay**

  **Dear Torn,**
  You are making a category error. You believe these options are 'different kinds of good'. In truth, they are simply two options your brain has currently rendered opaque. You are romanticising the paralysis. You say you cannot weigh them, which is just another way of saying that, to you, right now, they feel equally heavy. This is the 'Pre-Choice Shiver' again. You are looking for a universal scale where none is needed. My advice is identical to Stuck's: flip a coin. Heads, Mother. Tails, Amazon. Once you choose, the value will crystallise. If you stay, you will see the beauty in duty. If you go, you will see the necessity in science. Do not fear the incommensurable; fear the indecisive. The choice creates the morality, not the other way around. Just pick. The reason will follow.

  ***

  **Next week:** *Why apologising is actually selfish.* Email Dr. Vane at *softchoice@weekendherald.co.uk*.
