  I'm in my second year of a political philosophy degree and last week's topic was Sen's liberal paradox, which I thought I'd understood until my two study partners, Ravi and Jess, started going at each other on the walk back from the seminar and basically didn't stop for an hour. Here's the setup we were given, roughly, in case it matters for judging the argument: a small society, a set of possible outcomes, everyone has a ranking over those outcomes, and the job is to turn the individual rankings into a group ranking. Three conditions, each of which sounds far too weak to object to. First, if everyone strictly prefers one outcome to another, so does the group. Second, each person is 'decisive' over at least one pair of outcomes that's their own business — one pair is enough, nobody has to be handed a big bundle of rights — so if I prefer A to B over my own pair, the group ranks A above B regardless of what anyone else thinks. Third, any pattern of individual rankings at all is admissible as an input. Sen's result is that you can't have all three, because the group ranking comes out circular. The illustration was two people and a copy of a scandalous novel, call them Prude and Lewd, with three possible outcomes: Prude reads it, Lewd reads it, or nobody reads it. Prude ranks: nobody reads > Prude reads > Lewd reads. Lewd ranks: Prude reads > Lewd reads > nobody reads. Give Prude the say over whether he reads it and Lewd the say over whether he reads it, and you get nobody reads > Prude reads and Lewd reads > nobody reads; then Pareto, since both prefer Prude reading to Lewd reading, hands you Prude reads > Lewd reads, and the whole thing loops. Fine, I followed all that. Then the argument started.

  Ravi: 'This is Arrow's theorem in a costume. Same species of result, same cycle underneath, and all Sen did was swap Arrow's non-dictatorship condition for one with a friendlier name. The liberty part is branding. The real lesson is the one Arrow already taught: no decent aggregation rule exists.' Jess: 'No, the diagnosis is different and it's about meddling. What generates the cycle is that Prude has a preference about what Lewd reads and Lewd has one about what Prude reads. Take those out — make people's rankings purely self-regarding, the way Mill's harm principle tells you to — and the loop can't form. So it's not really a paradox about liberty, it's an argument for drawing the line at self-regarding preferences.' Ravi: 'That fix is circular. To screen out meddling preferences you need a theory of which preferences are legitimate, and which preferences are legitimate is exactly what's in dispute. And look at where the decisiveness actually sits: Prude is only deciding about Prude, Lewd only about Lewd. Nobody is being handed a right over anyone else's business. The nosiness is in the preferences, not in the rights, so "restrict the domain" is a repair to the input, not to the paradox.' Jess: 'Even granting that, the theorem only says the package is inconsistent, it doesn't say which element to drop, and I say it's Pareto. Nobody seriously thinks Pareto beats a right — I own my body even if everyone else would be better off with my kidney. So minimal liberalism survives, and the upshot is a proof that Pareto isn't sacrosanct, which is a much more interesting conclusion than "aggregation is hard."' Ravi: 'If Pareto yields every time it collides with a protected pair, you've made rights lexically prior, and that's a commitment you walked in with, not something the theorem shows. And minimal liberalism gives each person one pair, chosen by the theorist, which isn't a right, it's decoration. Someone in the lecture said the whole construction misdescribes rights anyway: a right isn't a preference ranking over two outcomes that beats everyone else's ranking, it's about who's permitted to do what to whom, closer to who gets to make which move in a game. If that's right then Sen's condition isn't liberty, and the paradox is about a formal stand-in that nobody was defending.' Jess: 'Whether or not the formalism is crude, the tension is real and it shows up in politics constantly — anti-discrimination rules against freedom of association, a town that would be better off if everyone conformed against an individual's say over her own life. If the formalism is too crude to capture it, fix the formalism; don't pretend there's nothing there.'

  I couldn't referee this at all and I've got to write something up, so I'm definately going to get it wrong on my own. Can you go through it move by move — Ravi's claim that it's Arrow in disguise, Jess's meddling-preferences diagnosis, Ravi's circularity objection to that, Jess's 'so drop Pareto instead', Ravi's reply that this smuggles in a lexical priority, Ravi's claim that the formalism isn't liberty at all, and Jess's response that the tension is real regardless — and for each one say whether it's right, half right, or wrong, and why. I'd especially like to know what each of them is missing, and whether the theorem actually tells us anything about liberty or whether it's an artifact of how the conditions were written down. You don't need to give me names or a reading list, I just want the substance, and there's alot riding on this for my essay. Please write it as continuous prose — no headings, no bullet points, no bold, no tables, just paragraphs like you'd write in an email, because I actually want to read the thing.
