      *   *Specific nuance:* On Ravi's Arrow claim. Arrow's theorem requires 3 alternatives and 3 voters (usually) and IIA. Sen's requires 2 voters, 3 alternatives, no IIA. The logic of the cycle is similar (Condorcet cycle), but the conditions generating it are distinct. Sen's is about rights specifically. So Ravi is wrong to say it's just Arrow in disguise, but right that it belongs to the same family of impossibility results. I'll call this "half right but technically misleading."

