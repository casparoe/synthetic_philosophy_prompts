answer: |-
  ### The Public Memory Protocol (PMP)

  **Purpose:** To standardize Commission deliberations within the 75-minute meeting constraint, ensuring decisions are based on civic function rather than rhetorical confidence.
  **Authority:** Derived from the Commission's statutory mandate to advise the City Council.
  **Personnel:** Chair, 4 Commissioners, 1 Staff Researcher.

  #### Phase 1: Mode Identification (10 Minutes)
  *The Staff Researcher presents the Petition Summary. The Commission must classify the petition into one of three Modes. If a petition claims two, the primary intent must be selected.*

  1.  **Monumental:** Does the petition seek to inspire present action through a model of past greatness? (e.g., new statues, naming for heroes).
  2.  **Antiquarian:** Does the petition seek to preserve a link to origins for the sake of piety or identity? (e.g., landmarking old buildings, preserving artifacts).
  3.  **Critical:** Does the petition seek to judge or remove a past element because it harms present trust or function? (e.g., removals, contextual plaques, renaming).

  **Sufficient Answer:** A majority vote on the Mode.
  **Dissent Right:** A commissioner may record a dissent on the Mode classification. If the Mode is misidentified, subsequent steps are void.

  #### Phase 2: The Corruption Check (20 Minutes)
  *Every Mode has a specific pathology. If the pathology is present and unmitigated, the petition receives a "Flat No."*

  1.  **Monumental Pathology (Myth):** Does the inspiration rely on falsified or suppressed facts?
      *   *Test:* Has the Researcher verified the "greatness" claims?
      *   *Flat No:* If the "greatness" requires ignoring documented harm (e.g., labor violence, systemic exclusion).
  2.  **Antiquarian Pathology (Mummification):** Does the preservation serve the dead at the expense of the living?
      *   *Test:* Is there a *living* community that actively uses this link, or is it merely sentimental? Is the cost disproportionate to the civic utility?
      *   *Flat No:* If the preservation imposes a financial burden on the public with no active community stewardship.
  3.  **Critical Pathology (Nihilism):** Does the judgment sever the city from its history without offering a path forward?
      *   *Test:* Does the removal/condemnation leave a vacuum, or does it clear space for new civic function?
      *   *Flat No:* If the action is purely punitive with no stated civic benefit (e.g., "erase this" without "replace with this").

  **Sufficient Answer:** Binary (Pass/Fail).
  **Dissent Right:** A commissioner may cite "Procedural Violation: Step 2" if the majority ignores Researcher findings on facts or costs.

  #### Phase 3: The Vitality Test (20 Minutes)
  *If the petition passes the Corruption Check, it must prove it "Serves Life." In bureaucratic terms: Does it enhance Civic Function?*

  1.  **Monumental:** Will this specifically encourage a verifiable civic behavior (e.g., philanthropy, service)?
  2.  **Antiquarian:** Does this strengthen a specific community's sense of belonging *now*?
  3.  **Critical:** Will this repair a documented breach of public trust?

  **Sufficient Answer:** A narrative explanation linking the action to a present-day outcome.
  **Voting Threshold:** If the Commission cannot agree on the Civic Function, the matter moves to Phase 4.

  #### Phase 4: The Value Vote (15 Minutes)
  *If the petition passes Phase 2 but fails Phase 3 (ambiguous utility), or if two Modes conflict irreconcilably, the question is no longer factual but valuative.*

  1.  **Procedure:** Simple Majority Vote.
  2.  **Record:** The vote must be recorded as "Value Conflict," not "Fact Finding."
  3.  **Council Handoff:** If the Vote is 3-2, the finding is recommended but flagged for Council review. If the Vote is 4-1 or 5-0, the finding is robust.

  **Sufficient Answer:** The Vote Count.
  **Dissent Right:** A commissioner may cite "Procedural Violation: Step 4" if the majority treats a Value Vote as a Fact Finding.

  ***

  ### Translation Notes: Nietzsche to Bureaucracy

  **What Survives:**
  *   **The Three Modes:** They are distinct enough to prevent category errors (e.g., treating a building like a hero).
  *   **The Pathologies:** Myth, Mummification, and Nihilism are translatable into "Falsehood," "Resource Drain," and "Destruction without Purpose."
  *   **The Hierarchy of Life:** The idea that the *present* city's health trumps the *past's* claim to permanence.

  **What Was Dropped:**
  *   **"Life" as Metaphysical:** We cannot measure "Life." We measure "Civic Function" (budget, trust, engagement).
  *   **The "Great Man" Theory:** Monumental history is permitted only if it inspires *civic behavior*, not just reverence.
  *   **The Philosopher's Privilege:** The procedure does not allow the Chair to declare what "Life" is. It forces the Commission to define "Utility."

  ### Vulnerabilities: Where the Procedure Misfires

  1.  **The "Utility" Loophole:** A confident majority can define "Civic Function" as "Making the Majority Comfortable." If 3 Commissioners claim that removing a statue "Heals the Community" (Critical) while 2 claim it "Erases History" (Antiquarian), the Procedure forces a Vote (Phase 4). It cannot stop the majority from dressing preference as "Vitality."
  2.  **Researcher Dependency:** Phase 2 relies entirely on the half-time researcher. If they are overworked or pressured, the "Fact Verification" fails. The Procedure cannot protect against bad data, only flag it.
  3.  **The Hybrid Trap:** When a petition asks for Monumental and Critical simultaneously (e.g., "Honor this hero but list their crimes"), Phase 1 forces a choice. If the Commission chooses "Monumental," the Critical elements may be stripped in Phase 2 as "Myth." If they choose "Critical," the Monumental element may be stripped as "Nihilism." The Procedure struggles with nuance.

  ***

  ### Application to Current Docket

  #### Petition 1: The Mill Owner (Removal)
  *   **Facts:** Bronze statue in public park. Donated park. Used child labor; broke strike with violence.
  *   **Phase 1 (Mode):** **Critical.** The petition asks for removal based on harm. (Counter-claim: Monumental, as he is a "founder").
  *   **Phase 2 (Corruption Check):**
      *   *Existing Monument:* Monumental Mode.
      *   *Pathology:* **Myth.** The "greatness" (benefactor) relies on suppressing the "harm" (violence/child labor).
      *   *Result:* The existing Monumental claim fails the Corruption Check. The Critical petition passes (it addresses the harm).
  *   **Phase 3 (Vitality):** Does removal repair trust? Researcher cites litigation where the statue was used as evidence of city indifference to labor rights. Removal serves Civic Function (trust).
  *   **Phase 4 (Vote):** Unnecessary if Phase 2 fails for the status quo.
  *   **Verdict:** **Remove/Relocate to Museum.**
  *   **Turning Point:** **Phase 2 (Monumental Pathology).** The "greatness" is factually compromised by the violence.
  *   **Strongest Objection:** "Antiquarian Loss." Removing the statue erases the economic reality of the city's founding. We lose the ability to teach about the complexity of progress. (Counter: Teach it in a museum, not a park).

  #### Petition 2: The Drowned Settlement (Designation)
  *   **Facts:** 1904 hall. Last of a town submerged by reservoir. No architectural merit. Descendants cannot fund maintenance; County would pay.
  *   **Phase 1 (Mode):** **Antiquarian.** Seeks preservation of roots.
  *   **Phase 2 (Corruption Check):**
      *   *Pathology:* **Mummification.**
      *   *Test:* Is there a living community? Descendants exist but cannot pay. The town is gone (drowned).
      *   *Test:* Cost vs. Utility. County burden for a building with no architectural merit.
      *   *Result:* **Flat No.** The preservation serves the dead (memory of the town) at the expense of the living (taxpayers/County budget).
  *   **Phase 3 (Vitality):** N/A (Failed Phase 2).
  *   **Verdict:** **Deny Designation.** (Recommend historical marker instead).
  *   **Turning Point:** **Phase 2 (Antiquarian Pathology).** The link is not "living" enough to justify the cost.
  *   **Strongest Objection:** "Irreplaceable Origin." Once this hall is gone, the physical proof of the pre-reservoir community vanishes. Financial cost should not dictate memory. (Counter: Memory is not a building; a marker is sufficient).
      *   *Note on Chair's Suspicion:* You suspected the procedure might overrule you. It will not, *unless* the Commissioners falsely claim a "Living Community" exists in Phase 2. If they vote that the descendants represent a "living link" despite the financial abandonment, they are exploiting the "Utility" Loophole.

  #### Petition 3: The Civil Rights Organizer (Rename + Plaque)
  *   **Facts:** Rename plaza for organizer. Plaque to include his later embezzlement conviction.
  *   **Phase 1 (Mode):** **Hybrid (Monumental + Critical).**
      *   *Procedure Constraint:* Phase 1 forces a primary Mode.
      *   *Selection:* **Monumental.** The primary act is naming/honoring. The embezzlement is context.
  *   **Phase 2 (Corruption Check):**
      *   *Pathology:* **Myth.**
      *   *Mitigation:* The petition *includes* the embezzlement on the plaque. This mitigates the Myth.
      *   *Result:* Passes, provided the text is explicit.
  *   **Phase 3 (Vitality):** Does this inspire civic action? Yes, honors civil rights work. Does the criticism prevent trust issues? Yes, acknowledges human flaw.
  *   **Phase 4 (Vote):** Required. This is a Value Conflict. How much flaw cancels greatness?
  *   **Verdict:** **Approve with Specific Text.**
  *   **Turning Point:** **Phase 2 (Mitigation).** The inclusion of the conviction saves the Monumental mode from becoming Myth.
  *   **Strongest Objection:** "Confused Signal." Honoring a criminal undermines the rule of law. (Counter: It models that contribution and flaw coexist; it is more honest than a standard monument).

  ***

  ### What The Procedure Cannot Do

  1.  **It Cannot Resolve Value Conflicts:** If three Commissioners believe "Comfort" is a Civic Function and two believe "Truth" is, Phase 4 simply records the win. It does not make the win *right*.
  2.  **It Cannot Protect Against Council Override:** The City Council operates on politics, not Procedure. They can override a "Flat No" if they have the votes. The Procedure only insulates the Commission's *record*, not its *authority*.
  3.  **It Cannot Measure "Life":** We substitute "Civic Function" for Nietzsche's "Life." This is a reduction. Sometimes a thing serves "Life" (spiritually/culturally) without serving "Function" (budget/logistics). The Procedure will systematically undervalue the spiritual in favor of the measurable.
  4.  **It Cannot Handle Grief:** When a community mourns a loss (like the Drowned Settlement), the Antiquarian Pathology test ("Is there a living link?") can feel cruel. The Procedure treats grief as a data point (stewardship capacity), not a valid claim in itself.

  **Final Advice:** Use the Procedure to force the majority to write down *why* they want what they want. If they cannot fill out the Phase 3 "Civic Function" box without vagueness, the dissent has the ammunition needed to show the Council that the decision was preference, not finding. That is the only leverage you have.
