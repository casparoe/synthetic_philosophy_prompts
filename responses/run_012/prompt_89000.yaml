  OFFICE OF TERRITORIAL IMPROVEMENT
  INTERNAL MEMORANDUM 44-B: JUNIOR CLERK ONBOARDING
  SUBJECT: OPERATIONAL ETHICS AND STEWARDSHIP MANDATES

  Welcome to the Office. To ensure uniform understanding of our stewardship mandates among incoming Junior Clerks, please review the following FAQs regarding our ethical framework. Our work is difficult but morally necessary. We act not for profit, but for the elevation of mankind.

  **1. What is the Office's primary objective?**
  To elevate backward populations toward civilized self-governance. Until such maturity is reached, we exercise benevolent despotism. This is not conquest, but guardianship. We bear the burden of authority so they may eventually bear it themselves.

  **2. Does the Liberty Principle apply to Territorial Subjects?**
  The Principle protects those capable of improvement by free and equal discussion. Subjects are currently in a state of developmental minority. Liberty granted prematurely would result in harm to themselves and others. Thus, the principle is suspended for their protection. We enjoy liberty; they require guidance.

  **3. When does administrative guardianship end?**
  Upon demonstrated fitness for liberty. There is no fixed calendar. Independence is a reward for maturity, not a right of birth. We cannot specify a date because we cannot predict their moral growth.

  **4. Who assesses fitness for self-rule?**
  The Office. As tutors, we alone determine when the pupil has learned the lesson. A pupil cannot demand graduation; nor can they define the curriculum. To ask them is to invite bias.

  **5. What if Subjects resist our improvements?**
  Resistance indicates a lack of rational capacity. It confirms the necessity of continued oversight. We do not interpret refusal as consent. Their current desires are irrelevant to their future good. We must ignore their protests for their own sake.

  **6. Must Clerks visit the Territories to judge them?**
  No. Character is assessed via dispatches and statistical returns. Physical presence often introduces bias or emotional attachment. Theoretical understanding from London is preferred for objective grading. You know them best through the files.

  **7. Is coercion permissible under a liberal mandate?**
  Yes. Coercion employed to create the conditions for future liberty is morally distinct from tyranny. It is the medicine, not the poison. We coerce them to be free, eventually. Force is the tool of the benevolent teacher.

  **8. What counts as evidence of civilizational progress?**
  Adoption of Office legal codes, commercial habits, and administrative structures. Stability is measured by similarity to us. When they think like us, they may rule like us. Custom is subordinate to progress.

  **9. What if local customs conflict with Office policy?**
  Customs hindering improvement must be removed. We respect tradition only insofar as it aids civilization. If a practice bars progress, it is deemed harmful. We save them from their own history.

  **10. What if we misjudge a culture's capacity?**
  Our mandate is improvement. Therefore, actions taken in good faith toward that end are justified by the aim. The burden of stewardship requires firmness against uncertainty. Regret is permissible; hesitation is not.

  **11. Are there deadlines for territorial independence?**
  Setting a date would be irresponsible. We cannot liberate those who remain children. The timeline depends on their progress, not our convenience. Patience is a virtue of the ruler. We wait for them to become us.

  **12. How do we handle moral distress among Clerks?**
  Remember that temporary unfreedom is preferable to permanent barbarism. Your discomfort is the price of their future dignity. Trust the theory over the immediate sensation.

  **Signed,**
  **Sir Edmund P. Wickham**
  **Chief Secretary of Developmental Oversight**
  **Office of Territorial Improvement, London**
