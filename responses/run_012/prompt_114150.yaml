  # Case Study: The Consultant's Tool

  ## The Scenario

  **Protagonist:** Elena, a freelance data consultant.
  **Wealth:** $W_0 = \$100,000$ (liquid savings, no debt).
  **Decision:** Elena has the opportunity to invest a fraction $f$ of her wealth ($0 \le f \le 1$) in a proprietary analytics software package. This is a one-time purchase; she cannot borrow to increase the stake, nor can she invest more than her total savings.

  **The Risk:** The software's performance depends on market adoption over the next year.
  *   **Success (Probability $p = 0.5$):** The tool becomes an industry standard. The investment yields a net return of **80%** of the amount staked.
      *   Final Wealth: $W_{win} = 100,000 \times (1 + 0.8f)$.
  *   **Failure (Probability $1-p = 0.5$):** The tool is obsolete within months. She can salvage **50%** of the initial cost.
      *   Final Wealth: $W_{lose} = 100,000 \times (1 - 0.5f)$.

  **Constraints Check:**
  1.  **Realistic:** A business investment with salvage value, no leverage.
  2.  **Positive Expected Money Value (EMV):**
      $$E[\text{Return per \$1}] = 0.5(0.8) + 0.5(-0.5) = 0.4 - 0.25 = +0.15.$$
      Since the expected return is positive, every dollar invested adds 15 cents in expected value.
  3.  **No Ruin:** Even if Elena invests everything ($f=1$) and fails, she retains $50,000 (50% of wealth). She is not wiped out.
  4.  **Kelly Stake Interior:** Calculated below.
  5.  **All-In Negative Log Growth:** Calculated below.
  6.  **Arithmetic:** Probabilities and returns are round numbers.

  ---

  ## Part 1: The Four Verdicts

  Here is how four different decision-making frameworks evaluate Elena's choice of $f$.

  ### 1. The Risk-Neutral Expected-Value (EV) Maximizer
  **Objective:** Maximize $E[W_1]$.
  $$E[W_1] = 100,000 \times [0.5(1 + 0.8f) + 0.5(1 - 0.5f)] = 100,000 \times (1 + 0.15f).$$
  **Verdict:** Since the coefficient of $f$ is positive ($+0.15$), expected wealth increases linearly with the stake.
  **Choice:** **$f = 1$ (All-In).**
  **Reasoning:** Any restriction on the stake leaves "money on the table." Risk is irrelevant; only the average outcome matters.

  ### 2. The Kelly (Growth-Optimal) Bettor
  **Objective:** Maximize the expected logarithmic growth rate $E[\ln(W_1/W_0)]$.
  $$g(f) = 0.5 \ln(1 + 0.8f) + 0.5 \ln(1 - 0.5f).$$
  To find the optimum, take the derivative with respect to $f$ and set to zero:
  $$\frac{dg}{df} = 0.5 \left( \frac{0.8}{1 + 0.8f} \right) + 0.5 \left( \frac{-0.5}{1 - 0.5f} \right) = 0$$
  $$\frac{0.4}{1 + 0.8f} = \frac{0.25}{1 - 0.5f}$$
  $$0.4(1 - 0.5f) = 0.25(1 + 0.8f)$$
  $$0.4 - 0.2f = 0.25 + 0.2f$$
  $$0.15 = 0.4f \implies f^* = \frac{0.15}{0.4} = \mathbf{0.375}.$$
  **Check All-In Log Growth:** At $f=1$, $g(1) = 0.5 \ln(1.8) + 0.5 \ln(0.5) = 0.5 \ln(0.9) \approx -0.052$.
  Since $\ln(0.9) < 0$, going all-in shrinks wealth geometrically over time.
  **Verdict:** **$f = 0.375$ (37.5% of wealth).**
  **Reasoning:** This maximizes the long-run compound growth rate. Anything more introduces "volatility drag" that outweighs the positive expected return.

  ### 3. The Standard Expected-Utility (EU) Maximizer
  **Objective:** Maximize $E[U(W_1)]$ with a concave utility function.
  Let us choose **Square-Root Utility**, $U(W) = \sqrt{W}$, representing constant relative risk aversion (CRRA) with coefficient $\gamma = 0.5$. (Note: Log utility is $\gamma = 1$).
  $$E[U] = 0.5 \sqrt{100,000(1 + 0.8f)} + 0.5 \sqrt{100,000(1 - 0.5f)}.$$
  Ignoring the constant $\sqrt{100,000}$, we maximize $0.5 \sqrt{1 + 0.8f} + 0.5 \sqrt{1 - 0.5f}$.
  FOC:
  $$\frac{0.5(0.8)}{2\sqrt{1 + 0.8f}} = \frac{0.5(0.5)}{2\sqrt{1 - 0.5f}}$$
  $$\frac{0.4}{\sqrt{1 + 0.8f}} = \frac{0.25}{\sqrt{1 - 0.5f}}$$
  Square both sides:
  $$0.16 (1 - 0.5f) = 0.0625 (1 + 0.8f)$$
  Divide by 0.0625 (note $0.16 / 0.0625 = 2.56$):
  $$2.56 (1 - 0.5f) = 1 + 0.8f$$
  $$2.56 - 1.28f = 1 + 0.8f$$
  $$1.56 = 2.08f \implies f = \frac{1.56}{2.08} = \mathbf{0.75}.$$
  **Verdict:** **$f = 0.75$ (75% of wealth).**
  **Reasoning:** This agent is risk-averse (concave utility), so they reject the EV "All-In." However, they are *less* risk-averse than the Log/Kelly agent ($\gamma=0.5$ vs $\gamma=1$), so they stake more.
  *Note:* If the EU maximizer chose Log Utility ($U=\ln W$), their verdict would **coincide** numerically with Kelly ($f=0.375$). The divergence here is purely due to the choice of risk parameter $\gamma$.

  ### 4. The Fractional-Kelly Bettor
  **Objective:** Stake a fixed fraction (e.g., half) of the growth-optimal amount to reduce volatility further.
  **Verdict:** **$f = 0.5 \times 0.375 \approx 0.19$ (19% of wealth).**
  **Reasoning:** Acknowledges the Kelly fraction as a theoretical upper bound for safety but prefers a larger margin of error against parameter estimation risk.

  ### Summary of Disagreement
  *   **EV vs. Kelly:** The fundamental clash. EV says 100%; Kelly says 37.5%. This is not a difference in risk tolerance; it is a difference in objective (Arithmetic Mean vs. Geometric Mean).
  *   **Kelly vs. EU (Sqrt):** A difference in degree. Both reject "All-In," but EU (Sqrt) stakes double what Kelly recommends.
  *   **Kelly vs. EU (Log):** Numerical coincidence, philosophical divergence. EU (Log) says "I prefer log wealth." Kelly says "Log wealth is the *only* rational goal for survival."

  ---

  ## Part 2: The Source of Divergence

  The divergence arises from the **multiplicative nature of the payoffs** combined with the **time horizon**.

  **Multiplicative vs. Additive:**
  In this case, returns are proportional to wealth (percentage gains/losses). This makes wealth a compounding process.
  *   If the payoffs were **additive** (e.g., "Win \$80,000 or Lose \$50,000" regardless of wealth), the Kelly criterion would not apply in its standard form. An EV maximizer and a Risk-Averse EU maximizer would still disagree, but the "Growth-Optimal" argument loses its force because the bet doesn't scale with the agent's size.
  *   In the multiplicative case, volatility acts as a drag on the compound rate. The Arithmetic Mean (EV) is always higher than the Geometric Mean (Growth) unless variance is zero. The EV maximizer ignores the drag; the Kelly maximizer treats the drag as fatal.

  **One-Shot vs. Repeated:**
  *   **One-Shot:** If Elena makes this decision exactly once and then retires, the "Time Average" argument weakens. In a single realization, she will end up at *either* $1.8W_0$ *or* $0.5W_0$ (if all-in). She will never experience the "average" contraction of $\sqrt{0.9}W_0$. In a strict one-shot, the EV argument is robust: she has a 50% chance of significantly more money and no risk of ruin.
  *   **Repeated:** If Elena faces a sequence of such opportunities over her career, the Law of Large Numbers applies to the *logarithm* of wealth. The "All-In" strategy guarantees eventual wealth contraction (since $E[\ln W] < 0$), even though $E[W]$ grows. The divergence is generated by the assumption that the decision is part of a **sequence** rather than an isolated event.

  ---

  ## Part 3: Rationality vs. Risk Tolerance

  Is the divergence between EV and Kelly a disagreement about **rationality** or merely **risk tolerance**?

  **In a One-Shot Decision:**
  It is arguably only about **risk tolerance** (or utility shape).
  If the decision happens once, there is no "long run" to optimize. An agent who chooses $f=1$ is not mathematically wrong about the probabilities; they simply value the upside more than they fear the downside. To call them "irrational" requires stipulating that Log Utility is the *only* valid utility function, which looks like question-begging.

  **What Must Be Added to Make it About Rationality?**
  To transform this from a preference dispute into a rationality dispute, you must invoke **Ergodicity**.
  *   **Ensemble Average (EV):** What happens to 1,000 parallel copies of Elena who all go All-In? 500 become rich, 500 lose half. The average wealth is high.
  *   **Time Average (Kelly):** What happens to *one* Elena who faces this bet 1,000 times in sequence going All-In? Her wealth trends toward zero.

  **The Legitimacy of the Addition:**
  Is assuming repetition legitimate?
  *   **Objection:** Yes, it is question-begging. If the problem is defined as "one choice," adding repetition changes the problem.
  *   **Defense:** It is not question-begging if we view the agent as existing through time. Most real-world economic decisions (savings, career, business) are not truly one-shot; they are nodes in a life-long sequence of reinvestments. If the goal is **persistence** (remaining an active agent in the economy), then maximizing the time-average growth rate is a requirement of instrumental rationality. An EV maximizer who goes All-In on negative log-growth bets will eventually cease to have any wealth to maximize.
  *   **Verdict:** The divergence is about risk tolerance *if* the horizon is fixed and short. It becomes about rationality *if* the horizon is indefinite and the goal is survival/persistence. The Kelly proponent argues that "Rationality" implies not going bust in the long run, making EV maximization irrational for multiplicative risks.

  ---

  ## Part 4: The Strongest Objection to "Kelly = Log Utility"

  **The Objection:**
  "Kelly is just Expected Utility Maximization with a Logarithmic utility function. There is no 'Growth-Optimal Rationality' distinct from standard decision theory. If an agent prefers Power Utility ($U=W^{0.5}$), they are perfectly rational to stake 75%. Claiming Kelly is *the* rational standard is simply disguising a specific risk preference (Log) as an objective mathematical truth."

  **Does the Case Survive?**
  **Yes, but with a caveat.**
  Mathematically, in a one-shot, Kelly *is* indistinguishable from Log-Utility EU. The case survives not by denying the math, but by challenging the **normative source** of the utility function.

  1.  **Derived vs. Stipulated:** In standard EU theory, the utility function is stipulated by preference. In Kelly theory, the Log function is *derived* from the dynamics of the system (multiplicative compounding). The Kelly defender argues: "You don't *choose* Log utility because you like it; you *must* use it if you want your wealth to grow over time, regardless of your feelings."
  2.  **The EV Maximizer's Burden:** In this specific case, the EV maximizer must defend a strategy ($f=1$) that leads to **wealth contraction** over time ($E[\ln W] < 0$). They must argue that it is rational to accept a guaranteed long-term decline in wealth in exchange for a higher *expected* wealth driven by outlier paths.
  3.  **Survival:** The case forces the EV maximizer to admit that their strategy is not sustainable for a continuing agent. If the tutorial accepts that "Rationality" includes the capacity to continue acting in the future, the Kelly argument wins. If "Rationality" is defined purely as consistency of preference in a single snapshot, the EU objection wins.

  **Conclusion for the Tutorial:**
  The case does not prove Kelly is "correct" in a vacuum. It proves that **EV maximization is incompatible with long-term survival in multiplicative environments.** The dispute is not about arithmetic; it is about whether we model agents as parallel universes (Ensemble) or a single life through time (Time).
