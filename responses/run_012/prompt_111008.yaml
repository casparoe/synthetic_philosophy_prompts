      *   *Conceptual:* Causation by absence is tricky (omission causation). The distinction between "engine" and "brake" might be semantic (friction is still force). Counterfactual dependency is hard to establish.
      *   *Methodological:* Selection bias (looking only at failures). Unfalsifiability (if every non-action is a brake, how do we know it wasn't just impossible?). Microfoundations (how does a value become "unthinkable"?).

