answer: |-
  **MEMORANDUM**

  **TO:** Performance and Accountability Committee, State Health Authority
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding 7-Day Follow-Up Metric for Community Mental-Health Clinics

  **Bottom Line Recommendation**

  I recommend that the committee **adopt the 7-day follow-up metric with significant modifications and safeguards**, rather than adopting it as proposed or rejecting it outright. The clinical goal—ensuring continuity of care after psychiatric discharge—is vital. However, the pilot data demonstrates that the current metric design invites specification gaming that could harm patients. We must proceed, but only under a framework that aligns financial incentives with genuine clinical improvement rather than numerical compliance. Implementation should be phased over 18 months, contingent on the successful deployment of the safeguards detailed below.

  **The Analytical Framework: Proxy Failure**

  When we tie funding to a specific number, we turn a clinical goal into a proxy measure. We must anticipate how this proxy might fail. Goodhart's law suggests that when a measure becomes a target, it ceases to be a good measure. To design around this, we must distinguish three specific ways a proxy can fail: regressional, extremal, and causal.

  1.  **Regressional Failure:** This occurs when the proxy is only imperfectly correlated with the goal due to noise. For example, a patient might attend a follow-up but still relapse due to factors outside the clinic's control. This is inevitable but manageable through risk adjustment.
  2.  **Extremal Failure:** This occurs when optimizing hard for the proxy pushes the system into a region where the correlation with the goal breaks down. The pilot data illustrates this clearly. A 30-minute clinical consultation correlates well with continuity of care. A five-minute telephone check-in by a non-prescriber also counts as an "appointment" under the proposed metric, but it does not provide the same clinical safety net. By optimizing for the count rather than the care, clinics enter an extremal region where the metric no longer reflects the goal.
  3.  **Causal Failure:** This occurs when pursuing the proxy changes the underlying system in a way that undermines the goal. The pilot data shows clinics discharging patients later to shrink the follow-up window, or steering complex patients to other providers to avoid the risk of missed appointments. This changes the patient population and discharge dynamics, potentially reducing overall access to care for those who need it most.

  The pilot data primarily illustrates **extremal failure** (the five-minute calls) and **causal failure** (steering patients and manipulating discharge timing). Regressional failure is present but less dangerous than the active distortions caused by the latter two.

  **Distinguishing Gaming from Genuine Improvement**

  The committee must be able to distinguish between clinics that are gaming the metric and those that are genuinely improving care. Gaming improves the proxy while leaving the underlying goal unchanged or worsening it. Genuine improvement improves both.

  In practice, we can tell the difference by looking for divergence. If a clinic's follow-up rates rise sharply while their 30-day readmission rates remain static or worsen, they are likely gaming. If patient-reported satisfaction regarding discharge planning drops while compliance rises, they are likely gaming. Genuine improvement should show correlated movement across multiple indicators. Therefore, we cannot rely on the follow-up metric in isolation.

  **Addressing the Objection: Abandoning Metrics for Judgment**

  The strongest objection to this recommendation is that any quantitative target will eventually be gamed. Critics argue we should abandon funding-linked metrics entirely and rely on professional judgment and qualitative review.

  There is truth to this objection. Quantitative metrics are reductive; they cannot capture the nuance of a therapeutic alliance or the complexity of a patient's social determinants of health. Over-reliance on numbers can erode professional autonomy and trust.

  However, the conclusion that we should rely solely on qualitative judgment is flawed. Professional judgment alone lacks scalability and transparency. Without quantitative benchmarks, we cannot identify systemic disparities, track progress over time, or hold providers accountable for outliers. Qualitative review is essential, but it is resource-intensive and subjective; it works best when triggered by quantitative signals. Abandoning metrics does not eliminate gaming; it simply shifts gaming from numbers to narratives, where it is harder to detect. The solution is not less measurement, but better measurement that supports rather than supplants professional judgment.

  **Specific Safeguards and Conditions**

  To mitigate the risks of extremal and causal failure, I propose the following conditions for adoption:

  1.  **Redefine "Appointment":** To prevent extremal failure, the metric must specify minimum clinical standards. Telephone check-ins by non-prescribers should not count unless followed by a full clinical visit within the seven-day window. This ensures the proxy remains correlated with clinical safety.
  2.  **Paired Outcome Measures:** To detect gaming, funding should be linked to a bundle of metrics, not just follow-up rates. We must pair the process metric (follow-up) with an outcome metric (30-day readmission rates) and a balancing metric (patient-reported experience measures). If follow-up rates rise while readmissions rise, funding bonuses should be withheld.
  3.  **Risk Adjustment:** To prevent causal failure via patient steering, the metric must be risk-adjusted for patient complexity and social vulnerability. Clinics should not be penalized for serving higher-risk populations, removing the incentive to cherry-pick easier cases.
  4.  **Audit of Random Samples:** The Authority will conduct random chart audits on 5% of reported cases annually. This verifies that reported appointments meets clinical standards and deters falsification.
  5.  **Shadow Metric:** For the first six months, we will track a "shadow metric" that is not tied to funding. This could be a stricter definition of follow-up (e.g., within 3 days, with a prescriber). This allows us to see how the metric behaves without immediate financial pressure, providing a baseline to detect future gaming.
  6.  **Sunset and Review Clause:** This metric structure will expire in 18 months. The committee must vote to renew it based on a review of whether the safeguards prevented the behaviors seen in the pilot. This prevents metric stagnation where providers learn to game the safeguards over time.

  **Implementation Timeline**

  *   **Months 1-6 (Shadow Phase):** Clinics report data under the new definitions, but no funding adjustments are made. The Authority analyzes data for unintended consequences.
  *   **Months 7-12 (Phased Adoption):** Funding links are activated at 50% weight. Audits begin.
  *   **Month 18 (Review):** Committee reviews outcome data, audit findings, and clinic feedback. Vote on renewal, modification, or retirement of the metric.

  **Conclusion**

  The pilot data serves as a warning, not a stop sign. It shows us exactly how the system will bend if we apply pressure incorrectly. By acknowledging the specific modes of proxy failure—extremal and causal—we can design a metric that resists gaming. By pairing quantitative targets with qualitative audits and outcome measures, we respect professional judgment while maintaining public accountability. I urge the committee to adopt this modified approach, ensuring that our funding drives health outcomes, not just administrative compliance.
