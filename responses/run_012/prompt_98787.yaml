prompt: |-
  I serve on the performance and accountability committee of a state health authority. We are being asked to adopt a new funding-linked metric for community mental-health clinics: the proportion of patients discharged from an inpatient psychiatric unit who attend a follow-up appointment within seven days. The clinical rationale is strong, but our pilot data are troubling. Some clinics appear to have improved the number by scheduling five-minute telephone check-ins that do not involve a prescriber, by discharging patients later so that the follow-up window is easier to meet, and by steering patients with complex needs to other providers. The committee must decide whether to adopt the metric as proposed, adopt it with modifications, or reject it. I need to circulate a written recommendation before the next meeting.

  Draft the memo. It should recommend a concrete course of action, with a time frame and specific conditions if you recommend adoption. Use Goodhart's law and the concept of specification gaming as the analytical frame, not as slogans. Distinguish three ways a proxy can fail: regressional failure, where the proxy is only imperfectly correlated with the underlying goal; extremal failure, where optimizing hard on the proxy pushes the system into a region where the correlation breaks down; and causal failure, where pursuing the proxy changes the underlying goal itself. Say which of these the pilot data illustrate, and what each implies for the design of the metric. Distinguish gaming from genuine improvement, and say how the committee can tell the difference in practice. Address the strongest objection to your recommendation: that any quantitative target will eventually be gamed, so the committee should abandon funding-linked metrics and rely instead on professional judgment and qualitative review. Take that objection seriously, say what is right and wrong in it, and explain why your recommendation is better. The memo should be usable by the committee: a clear bottom line, reasons the clinics and the public could understand, and safeguards that could actually be implemented, such as paired outcome measures, risk adjustment, audit of a random sample, patient-reported measures, a shadow metric not tied to funding, and a sunset or review clause. Do not provide a bibliography or citations; I need the argument, not the literature. Aim for roughly 1,000 to 1,500 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Performance and Accountability Committee of a state health authority.
      *   **Task:** Draft a written recommendation memo regarding a new funding-linked metric (7-day follow-up after inpatient psych discharge).
      *   **Context:** Pilot data shows troubling behaviors (5-min calls, delayed discharge, steering complex patients away).
      *   **Decision:** Adopt, Adopt with Modifications, or Reject. (The prompt implies I need to choose one. Given the issues, "Adopt with Modifications" is usually the most constructive policy stance, allowing for safeguards.)
      *   **Analytical Frame:** Goodhart's Law and Specification Gaming.
      *   **Specific Concepts to Include:**
          *   Three ways a proxy can fail: Regressional, Extremal, Causal.
          *   Identify which failure modes the pilot data illustrate.
          *   Distinguish gaming from genuine improvement (how to tell).
          *   Address the strongest objection: "All metrics get gamed, so use professional judgment/qualitative review instead."
      *   **Safeguards to Include:** Paired outcome measures, risk adjustment, audit of random sample, patient-reported measures, shadow metric, sunset/review clause.
      *   **Tone/Style:** Usable by the committee, clear bottom line, understandable reasons, implementable safeguards. No bibliography/citations.
      *   **Length:** 1,000 to 1,500 words.

  2.  **Determine the Recommendation:**
      *   The clinical rationale is strong (follow-up is good).
      *   The pilot data shows gaming (specification gaming).
      *   Rejecting metrics entirely leads to opacity and lack of accountability.
      *   Adopting as-is encourages harm.
      *   *Decision:* Adopt with Modifications (specifically, a bundled set of safeguards and metric refinements).

  3.  **Outline the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Bottom Line:** Recommend adoption with modifications and safeguards.
      *   **Context & Rationale:** Why this metric matters (continuity of care).
      *   **Analytical Framework (Goodhart/Specification Gaming):**
          *   Define the proxy problem.
          *   Explain the three failure modes (Regressional, Extremal, Causal).
          *   Apply to pilot data (mostly Extremal and Causal).
      *   **Distinguishing Gaming vs. Improvement:** How to tell the difference (clinical quality, patient outcomes).
      *   **Addressing the Objection:** "All metrics are gamed, use judgment instead."
          *   Validate the concern.
          *   Refute the conclusion (judgment alone lacks scale/accountability).
          *   Argue for balanced approach.
      *   **Specific Recommendations/Safeguards:**
          *   Redefine "appointment" (no 5-min calls).
          *   Risk adjustment (for steering).
          *   Paired outcome measures (readmission rates).
          *   Audits & Patient Reports.
          *   Shadow metric & Sunset clause.
      *   **Timeline:** Implementation phases.
      *   **Conclusion:** Final commitment to quality.

  4.  **Drafting - Section by Section (monitoring word count):**

      *   *Header:* Standard memo format.
      *   *Opening:* State the recommendation clearly. Adopt with modifications.
      *   *The Problem:* Acknowledge the pilot data. It shows clinics optimizing the number, not the health.
      *   *The Framework:* Introduce Goodhart's Law implicitly or explicitly as requested ("Use Goodhart's law... as the analytical frame"). Need to define the three failures clearly.
          *   Regressional: Noise/Imperfect correlation.
          *   Extremal: Pushing to extremes breaks correlation (e.g., 5-min calls).
          *   Causal: Changing the system changes the goal (e.g., steering patients).
          *   *Analysis:* Pilot shows Extremal (5-min calls) and Causal (steering/delayed discharge).
      *   *Gaming vs. Improvement:* How to distinguish? Look at secondary outcomes (readmissions, patient satisfaction). Gaming improves the metric but hurts outcomes. Improvement improves both.
      *   *The Objection:* "Abandon metrics for judgment."
          *   *Right:* Metrics can be gamed.
          *   *Wrong:* Judgment is subjective, opaque, and hard to scale. We need both.
      *   *Safeguards:* List the specific ones requested (paired outcomes, risk adjustment, audit, patient reports, shadow metric, sunset).
      *   *Timeline:* Phased rollout.
      *   *Closing:* Reiterate commitment.

  5.  **Refining and Editing (Self-Correction during drafting):**
      *   *Check:* Did I explain the three failure modes clearly? Yes, need to ensure they aren't just buzzwords but explained in context.
      *   *Check:* Did I address the objection seriously? Yes, need to make sure I don't dismiss it too easily.
      *   *Check:* Word count. Need to expand on the analysis to hit 1,000-1,500. I can elaborate on the implications of each failure mode for design.
      *   *Check:* Tone. Needs to be professional, authoritative, yet collaborative.
      *   *Check:* Specific constraints. "Do not provide a bibliography." "Use Goodhart's law... not as slogans."
      *   *Check:* Safeguards. Ensure all listed in prompt are included (paired outcome, risk adjustment, audit, patient-reported, shadow metric, sunset).

  6.  **Drafting - Content Focus:**
      *   *Intro:* Keep it tight.
      *   *Analysis:* This is the core. Spend time on the three failures.
      *   *Objection:* This needs nuance.
      *   *Recommendations:* Be specific.
      *   *Word Count Management:* If too short, expand on the *implications* of the failure modes for the specific safeguards. If too long, trim the intro.

      *(Self-Correction on Word Count)*: 1,000-1,500 words is roughly 3-5 single-spaced pages. I need to be substantive. I will expand on the distinction between the failure modes and how specific safeguards address specific failure modes.

      *(Self-Correction on Tone)*: Ensure it sounds like a committee memo, not an academic paper. Action-oriented.

  7.  **Final Review against Prompt Requirements:**
      *   Recommend concrete course? Yes (Adopt with modifications).
