      *   Distinguish gaming vs. improvement? Yes.
      *   Address strongest objection (abandon metrics)? Yes.
      *   Safeguards (paired, risk, audit, patient, shadow, sunset)? Yes.
      *   No bibliography? Yes.
      *   Word count 1k-1.5k? Will monitor.

  8.  **Final Polish:** Check flow and transitions. Ensure the distinction between Extremal and Causal is clear in the context of the pilot data (5-min calls = Extremal, Steering = Causal).

