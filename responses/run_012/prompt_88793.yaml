answer: |-
  **The Principle of Unsubverted Actual Sequence**

  An agent is responsible (blameworthy or praiseworthy) for an action if and only if:
  1.  **Actual Source:** The action issues from the agent's own psychological states (beliefs, desires, values) in the actual sequence of events.
  2.  **No Occurrent Subversion:** Those states are not currently overridden, or decisively weighted, by an external manipulator operating at the time of action.
  3.  **Alternatives Irrelevant:** The presence or absence of alternative possibilities does not determine responsibility, provided the actual sequence satisfies clauses 1 and 2.

  **Motivation and Clauses**
  Clause 1 secures ownership. It explains why we blame Vera (Cases 1 and 2) and Nadia (Case 7). In both, the fraud and the cruelty flow from their own reasons. It also explains why we praise the lifeguard (Case 5); her dive issues from her own concern for life. The alternative sequence (the rigged system) is irrelevant because responsibility tracks the actual history, not modal possibilities.

  Clause 2 distinguishes between *constitutive* causes and *controlling* causes. This handles the tension between Priya (Case 4) and Nadia (Case 7). Nadia's upbringing is a historical cause that formed her character; it is internalised. Priya's chip is an occurrent external intervention that tips the scale at the moment of decision. Although the chip works through her resentment, it functions as an alien controller present in the actual sequence. Similarly, Omar (Case 3) is excused because the chip bypasses his psychology entirely, moving his hand directly. Both fail Clause 2.

  Clause 3 addresses the Principle of Alternative Possibilities. It confirms that the lifeguard (Case 5) is praiseworthy despite having no alternative, and that trivial alternatives (Case 6) do not salvage responsibility if the actual sequence is flawed. It validates your intuition that 'could have done otherwise' is neither necessary nor sufficient for responsibility.

  **Prediction for a New Case**
  Consider **Hypnosis**: A subject is hypnotised to feel a sudden, overwhelming urge to steal a wallet, an urge they would not otherwise have had. They steal it, believing it is their own idea.
  *Prediction:* The agent is **not blameworthy**. Although the action issues from a desire (Clause 1), the desire was implanted by an external manipulator operating at the time of action (violating Clause 2). This aligns with Priya and Omar, distinguishing the hypnotist from Nadia's parents.

  **Accommodation of Verdicts**
  This principle accommodates all seven of your verdicts. It captures the intuition that alternative possibilities are irrelevant (Cases 1, 2, 5, 6) while maintaining that sourcehood matters (Cases 3, 4). It resolves the Priya/Nadia conflict by locating the excusing condition in *occurrent* manipulation rather than *historical* determination.

  **Confidence and Doubt**
  I am **75% confident** in this account. It successfully systematises your intuitions without resorting to the 'device vs. life' distinction you rightly rejected, substituting a temporal distinction (occurrent vs. historical) instead.

  I am **least sure** about the boundary between Clause 1 and Clause 2 regarding Case 4. If Priya's chip works *through* her existing resentment, one might argue the action issues from her own states just as Nadia's does. The claim that a present-day chip is an 'alien controller' while childhood conditioning is 'internal' rests on a contested view of autonomy. If one accepts that all reasons are causally determined by history, the distinction between Priya's chip and Nadia's upbringing collapses, forcing us to either blame Priya or excuse Nadia. Your verdicts require us to hold the line here, which is philosophically precarious but necessary to match your data.
