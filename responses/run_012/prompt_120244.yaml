answer: |-
  **Proposal: The Mechanics of Constitutional Precommitment**

  **The Question**
  This project asks whether a constitutional provision can function as an effective precommitment device given that it operates structurally as a payoff-commitment rather than a removal-commitment. A removal-commitment binds by making an action physically or institutionally impossible, relying on a guardian who lacks the power or incentive to reverse the bind at the moment of temptation. A payoff-commitment binds by altering the cost of action, relying on the agent's continued valuation of that cost at the later time. Since constitutional entrenchment always leaves open a procedure for amendment administered by internal actors, such as courts or legislatures, it cannot remove options, only raise their price. The question is: what specific conditions must obtain regarding the incentives of these internal guardians for a payoff-commitment to replicate the binding force of a removal-commitment, and are those conditions compatible with the structure of constitutional governance?

  **Existing Answers and Their Limits**
  Existing literature leaves this open because it conflates the two mechanisms. The standard defence of the Ulysses analogy assumes that raising the cost of amendment is functionally equivalent to removing the option, leaving untouched the premise that equivalence holds only if the enforcer's incentives remain fixed. The sceptical objection argues that constitutional constraints reflect intergenerational disagreement rather than intragenerational weakness of will, but this leaves untouched the premise that either motive requires a specific mechanism to succeed. Both sides debate the *justification* for binding the future, but neither analyses the *mechanics* of how the bind holds when the rope is tied by the very hands it restricts. Consequently, we lack an account of whether the guardian in a constitutional system can ever lack the incentive to untie the rope when the cost of doing so is lower than the cost of compliance. Without distinguishing removal from payoff, the debate proceeds as if the structural impossibility of burning constitutional boats were merely a practical hurdle rather than a conceptual barrier.

  **Method**
  I will proceed by conceptual analysis of a single worked example: an entrenched amendment procedure requiring a supermajority legislative vote. I will not survey the literature, build a formal model, or import empirical data on individual commitment devices. A formal model would abstract away from the institutional texture required to analyse incentives; empirical work cannot observe the counterfactual of what happens when the device fails; and a survey would reproduce the existing conflation I aim to dissect. One example is sufficient because the logical structure of the guardian's incentive problem is invariant across specific provisions. If the mechanism fails here, due to the guardian's ability to lower the cost of amendment, it fails generally. The work will trace the chain of incentives from the initial enactment to the moment of attempted amendment, isolating the point at which the guardian's rational choice diverges from the precommitment's requirement. I will treat the legislature not as a monolith but as a collection of agents whose incentives shift between the time of binding and the time of action.

  **Expected Results**
  A successful result will identify the necessary conditions under which an internal guardian prefers maintaining the high cost of amendment over lowering it. Specifically, I aim to show whether the guardian's reputation or institutional survival depends on adhering to the procedure even when substantive outcomes are at stake. The project fails if I demonstrate that the guardian always possesses a dominant strategy to waive the cost when the political pressure exceeds a certain threshold, implying constitutional precommitment is conceptually distinct from Ulysses contracts and cannot perform the same function. I need to know if the mechanism is structurally incapable of binding, not merely occasionally ineffective. If the analysis shows that the guardian's incentives are inevitably aligned with the present majority rather than the past constraint, I will have established that constitutional precommitment is metaphorically distinct from individual precommitment. This negative result is as valuable as a positive one, as it clarifies the limits of the analogy.

  **Scope and Feasibility**
  This work is scoped for three weeks of preparation prior to the workshop. I will drop comparative historical analysis and normative evaluation of whether precommitment is desirable. The question survives this cut because the mechanical possibility of precommitment is prior to its normative justification. If the device cannot work, whether it should work is moot. The output will be a twenty-minute paper allowing twenty minutes for discussion, fitting the workshop format. The focus remains strictly on the incentive compatibility of the guardian, excluding broader questions of democratic legitimacy. This ensures the analysis remains accessible to economists interested in mechanism design and legal theorists concerned with institutional stability, without requiring extensive background in moral philosophy. The constraint of time necessitates ignoring the variety of constitutional forms to focus on the invariant logic of the amendment procedure.
