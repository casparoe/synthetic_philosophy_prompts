      *   *Correction:* The prompt says regional specialists are under contract and "can only write the chapters they were trained to write." This is a hard constraint.
      *   *Pivot:* I must respect the authors' constraints.
      *   *New Recommendation:* **Chronological Periodization (Chair) + Mandatory Synchronic "Conjuncture" Essays (Editor) + Process-Driven Learning Objectives (Dissenters).**
      *   *Structure:* 5 Chronological Sections per volume. Within each section: Regional chapters (written by specialists) MUST include a standardized sidebar/section on "Global Context" (Editor). The Section Introductions must define the era by *Process* (e.g., "The Spread of Universal Religions") not Period Name (Dissenters).
      *   *This is the most buildable hybrid.*

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (decide architecture). Acknowledge the deadlock.
      *   **Recommendation:** The "Anchored Chronology with Conjunctive Modules" model.
          *   *Volume Structure:* 5 Chronological Parts (avoiding "Medieval/Modern").
          *   *Chapter Structure:* Regional specialists write regional narratives (satisfies Chair/Authors).
          *   *The Hybrid Element:* Each Part ends with a "Global Conjuncture" chapter (written by a synthesizer, not regional specialist) that does the synchronic slice work (satisfies Editor).
          *   *The Process Element:* Part introductions define the era by process (e.g., "The Age of Steppe Integration"), not culture (satisfies Dissenters).
      *   **Reasoning:**
          *   *To Editor:* You get your synchronic comparison, but localized to eras where it makes sense, avoiding the "1750 vs 1850" trap.
          *   *To Chair:* You keep the causal narrative and exam structure. Authors write what they know.
          *   *To Dissenters:* We ban European period labels. We acknowledge porosity via the Conjuncture chapters.
      *   **Criteria for Contested Topics:**
          *   *Slave Trade:* Placed in the "Global Conjuncture" chapter of the relevant era (Atlantic *and* Global), not just Atlantic.
          *   *Qing/Ottoman/France/Dahomey:* Compared in the "Conjuncture" chapter on "Fiscal-Military States," but treated as distinct adaptations, not identical stages.
      *   **Costs:**
          *   Lose the pure "history from everywhere" feel.
          *   Lose the clean "civilization" study guides.
          *   Adds complexity for instructors.
      *   **Strongest Counter-Argument:** The "Two-Book Problem." It splits the difference so much it satisfies no one fully. The Conjuncture chapters might become dumping grounds. The regional chapters might ignore the global context anyway.
          *   *Condition to win:* If authors refuse to coordinate with Conjuncture writers, the hybrid fails.
      *   **Motion & Deadline:** Specific vote text. 3-week deadline (aligns with meeting).

  4.  **Refining the Tone:**
