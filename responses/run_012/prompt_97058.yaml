answer: |-
  ### Dependency Structure (The Logic of the Session)

  Before you step into the room, you need to know the logical load-bearing walls. If you put these up in the wrong order, the structure collapses into "nice sentiment" or "scary collectivism."

  1.  **Disrupt the Substance:** You must break the intuition that personhood is an *internal property* (memory, reason, soul) before you can sell the idea that it is an *external relation*.
  2.  **Locate the "Self":** You must move the locus of identity from "inside the skull" to "the space between bodies."
  3.  **Expand the Timeline:** You must stretch personhood beyond the biological present (using the African philosophy concept) to prevent the view from collapsing into "I only exist while you look at me."
  4.  **Secure the Individual:** Only *after* they grasp the dependency can you reassure them that the individual isn't erased. If you do this too early, they revert to individualism. If you do it too late, they think you're advocating totalitarianism.

  ---

  ### The 50-Minute Plan

  #### 0–5 mins: The Default Intuition (The "Atom")
  **Whiteboard:** Draw a circle. Write "I" inside. Draw arrows pointing *out*.
  **Talk:** Ask them: "What makes you the same person you were at age five?" They will say memory, character, brain continuity. Write these inside the circle.
  **The Move:** Tell them this is the "Container View." The person is the stuff inside the skin.
  **Goal:** Make the default view explicit so it can be targeted. Do not argue against it yet. Just name it.

  #### 5–20 mins: The Dementia Case (The "Dyad")
  **The Case:** Use your woman with dementia and the daughter.
  **The Trap:** You are right to worry about memory. If the daughter says, "I remember for her," students will hear "Vicarious Memory" (which is still Lockean/individualist, just borrowed).
  **The Fix:** You must frame the *routine* as the locus of identity, not the memory.
  **Whiteboard:** Draw two circles (Mother, Daughter). Draw a thick, shaded overlap or a bridge between them. Write "The Argument," "The Tea Ritual," "The Song" in the *space between*, not in the circles.
  **Script:** "When the mother forgets the lyric, and the daughter sings it, and the mother smiles and hums the next note—who is singing? If you say 'the daughter,' you miss the point. The *person* who knows that song is the relationship. The mother is a person *because* she is a node in that network. If the daughter stops visiting, the mother doesn't just get lonely; on this view, her personhood degrades. She becomes biologically human, but relationally less."
  **Why this works:** It forces them to locate the "person" in the interaction. It displaces the "inner memory" requirement without denying the tragedy of memory loss.

  #### 20–30 mins: The African Philosophy Concept (The "Timeline")
  **Placement:** Introduce this *now* to prevent the "Relativism/Dependency" objection from killing the seminar.
  **Talk:** "So far, it looks like you need someone else *right now* to be a person. That feels fragile. Some African philosophical traditions tighten this. They distinguish **minimal personhood** (birth, biological) from **full personhood** (achieved)."
  **The Kicker:** "On some versions, you don't secure full personhood until you die and become an ancestor. You are only a full person if the living relate to you *after* you're gone."
  **Whiteboard:** Draw a timeline. Birth (Minimal) ---> Life (Building Relations) ---> Death (Ancestor Status/Full).
  **Why here?** This solves the "What if everyone dies?" problem. It shows personhood is a *project* across generations, not a snapshot of current popularity. It makes personhood robust, not fleeting.

  #### 30–40 mins: The Misconceptions (The "Pushback")
  Do not list these as "Common Mistakes." Pose them as urgent objections a critic would make.

  1.  **Collectivism/Erasure ("The Individual Doesn't Count"):**
      *   *When:* Immediately after the African concept.
      *   *Why:* Students will think, "So I'm just a brick in a wall?"
      *   *Response:* "Relationality isn't about erasing the circle (point to whiteboard). It's about saying the circle has no edges without the lines connecting it. You count *more*, not less, because your actions ripple through the network."
  2.  **Communitarianism ("It's Political"):**
      *   *When:* Mid-flow.
      *   *Why:* They will confuse metaphysics (what am I?) with politics (how should we vote?).
      *   *Response:* "This isn't about the state owning you. It's about ontology. A hermit can be a person on this view, provided they carry their relations *with* them (internalized dialogue, prayer, tradition)."
  3.  **Ownership ("The Community Owns You"):**
      *   *When:* Group with Collectivism.
      *   *Response:* "Sustainment is not ownership. The soil sustains the tree; it doesn't own it."
  4.  **Relativism ("If they stop thinking I'm a person, am I not?"):**
      *   *When:* Last. This is the hardest objection.
      *   *Why:* It threatens the objectivity of the claim.
      *   *Response:* Use the Ancestor concept. "It's not about what they *happen* to think. It's about whether you successfully established the obligations that bind them. If you were a tyrant, and they erase you, you *did* fail to achieve full personhood. That's not relativism; that's a verdict."

  #### 40–45 mins: The Diagnostic Question
  Do not ask: "What is relational personhood?" (Recall)
  Do not ask: "Do you agree?" (Opinion)

  **Ask this:**
  > "Imagine a cryonically frozen head. It has no relations, no interaction, but the *promise* of future revival exists in a contract. On the Relational View, is this entity a 'full person' right now, a 'minimal person,' or something else? And who holds the burden of its personhood—the lawyers, the machine, or the future revivers?"

  **Why this works:**
  *   It forces them to apply the **Minimal/Full** distinction.
  *   It tests if they understand **relations** (a contract is a relation, but is it thick enough?).
  *   It tests if they avoided the **Memory trap** (the head has no memory).
  *   If they say "It's a person because it has a brain," they failed.
  *   If they say "It's not a person because it can't relate," they missed the **potential/ancestral** angle.
  *   If they say "It depends on whether the lawyers treat it as an ancestor/project," they got it.

  #### 45–50 mins: What to Leave Out (The Boundary)
  **Say this out loud:** "We are leaving out three things today, deliberately."
  1.  **The Metaphysics of Substance:** "We aren't deciding if souls exist. We are deciding how personhood functions."
  2.  **Specific Cultural Rituals:** "The African concepts we used are structural, not a tour of specific funeral rites. Don't reduce them to exotic customs."
  3.  **The Moral Obligation:** "We discussed what a person *is*, not necessarily how we must *treat* them, though the two are linked. Don't confuse the definition with the duty."

  ---

  ### Instructor's Notes on the Dementia Case
  You asked if the dementia case smuggles in memory. It will, unless you police the language.
  *   **Forbidden:** "The daughter remembers for her." (This implies memory is the substance, just located elsewhere).
  *   **Required:** "The daughter *enacts* the history with her."
  *   **The Risk:** If you use the isolate (no community) as the counter-example, students will say "Well, they aren't a person," and feel morally repulsed, shutting down the argument. The dementia case is better because it elicits care. The philosophical work is done by the *daughter*, not the mother. The mother is the *site* of the personhood, the daughter is the *agent* of it. Together they are the *subject*.

  ### Instructor's Notes on the African Concept
  Treat this as a structural tool, not "worldview appreciation." If you present it as "Another culture thinks this," they will treat it as optional folklore. Present it as "A rigorous alternative solution to the problem of time in personhood." It solves the problem of the "cut-off point" of death. Use it to harden the theory against the "Relativism" objection.

  ### Final Advice
  You have 50 minutes. You will run over. Cut the "Communitarianism" distinction if you have to, but do not cut the "Ancestor/Full Personhood" distinction. That is the only thing that stops them from thinking this view makes personhood fragile. If they leave thinking personhood is fragile, you have taught them vulnerability, not ontology.
