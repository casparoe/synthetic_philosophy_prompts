prompt: |-
  My friend started a game theory course this term and now every single argument we have ends with him saying you can't play a dominated strategy, said like it's a law of nature rather than a piece of advice. Last night it was about this stupid 3x3 thing and I want to write down what he actually claimed before I go back at him, because I kept saying "that's basically cheating" and he kept saying "thats literally the definition".

  My payoffs, my rows U, M, D against his columns L, C, R:

  U: 3, 0, 1
  M: 0, 3, 1
  D: 1, 1, 0

  He says D is dominated so I should never play it, even though neither U nor M on its own beats D against all three of his columns. His argument is that the 50/50 coin flip between U and M beats D in every column, and that that counts. Is that actually what "dominated" means? And if it is, what's the difference between "dominated" and "never a best response"? He used the two like they were the same sentence and I have a feeling they're not. (He also said his own payoffs don't matter for whether my strategy is dominated, which I think is right, but confirm that.)

  Then he escalated. He said you delete stuff like that, then assume the other guy is rational and does the same, and that he knows you know he's rational, and so on forever, and you just keep deleting until one thing is left and that's what you play. He said the order you delete in doesn't matter for strict domination but does for weak, and that with weak domination you can delete an actual equilibrium right out of the game. He also said that in a zero-sum game dominance reasoning gets you the whole answer, which I don't buy, because matching pennies has nothing to delete and the answer is still a coin flip.

  So: lay out for me the different precise things "you can't play a dominated strategy" could be claiming, as a menu. Which readings are trivial, which are real theorems, which quietly need assumptions about what I believe about him and about how much he believes about me, and which are just false. For each, tell me whether it actually gets him what he was using it for, which was basically "so the only rational thing for you to do here is X". And say where iterated elemination and never-a-best-response come apart, if they do.
