answer: |-
  Here is the breakdown you need to arm yourself for the next argument. Your friend is acting like a freshman with a hammer (everything looks like a nail), but on the specific mechanics of the 3x3 game you described, **he is technically correct, though he is glossing over the heavy assumptions required to make it matter.**

  Here is the menu of claims, ranked from "True Theorem" to "False," along with the specific math for your game.

  ### 1. The Specific Game: Is D Dominated?
  **Verdict: Your friend is right.**

  You checked for *pure* strategy dominance (is U better than D? is M better than D?). Neither is. But game theory defines dominance allowing for **mixed strategies** (randomizing).

  *   **Your Payoffs:**
      *   **U:** 3 (vs L), 0 (vs C), 1 (vs R)
      *   **M:** 0 (vs L), 3 (vs C), 1 (vs R)
      *   **D:** 1 (vs L), 1 (vs C), 0 (vs R)

  *   **The Mix:** Take a 50/50 coin flip between U and M.
      *   **Vs L:** $0.5(3) + 0.5(0) = \mathbf{1.5}$. (D gives 1). **Win.**
      *   **Vs C:** $0.5(0) + 0.5(3) = \mathbf{1.5}$. (D gives 1). **Win.**
      *   **Vs R:** $0.5(1) + 0.5(1) = \mathbf{1.0}$. (D gives 0). **Win.**

  Because the mix yields a strictly higher payoff than D against *every* column, D is **Strictly Dominated by a Mixed Strategy**.
  **The Rule:** A rational player maximizing expected utility will *never* play a strictly dominated strategy. So, on this specific point, you cannot play D.

  ---

  ### 2. The Menu: What "You Can't Play a Dominated Strategy" Actually Means

  Here are the different versions of this claim. Your friend is conflating them.

  #### Claim A: "A strictly dominated strategy is never a best response."
  *   **Status:** **TRUE THEOREM** (The Equivalence Theorem).
  *   **The Nuance:** This is only true if you allow for **mixed beliefs** about the opponent.
      *   If you think the opponent plays only Pure Strategies (L, C, or R), D *is* a best response to nothing, but U and M aren't always better.
      *   If you think the opponent plays a *mixture* (e.g., 50% L, 50% C), then U and M are better than D.
  *   **Does it get him what he wants?** Yes. If you are rational, you assign probabilities to his moves. If D is never the best response to *any* probability assignment, you shouldn't play it.
  *   **Assumptions:** Only requires **your** rationality. You don't need to know anything about him yet.

  #### Claim B: "A weakly dominated strategy should never be played."
  *   **Status:** **FALSE / DANGEROUS ADVICE.**
  *   **Definition:** Weak dominance means Strategy X is *at least as good* as Y in all cases, and *strictly better* in at least one. (Strict dominance requires strictly better in *all* cases).
  *   **The Problem:** Weakly dominated strategies **can** be part of a Nash Equilibrium.
      *   *Example:* In an auction, bidding your true value weakly dominates bidding less. But sometimes people bid less.
      *   *Example:* In coordination games, playing a "safe" option might be weakly dominated by a "risky" option, but if you think the other guy will play safe, you should too.
  *   **Does it get him what he wants?** No. If he tries to eliminate weakly dominated strategies to find "the" solution, he might delete the actual equilibrium you end up playing.

  #### Claim C: "Opponent's payoffs don't matter for whether my strategy is dominated."
  *   **Status:** **TRUE.**
  *   **Why:** Dominance is a property of *your* payoff matrix alone. It asks: "Is there a different plan I could follow that pays me more regardless of what he does?" His incentives determine what he *will* do, but not whether your strategy is mathematically inferior.
  *   **Does it get him what he want?** Yes, this is a correct technical point.

  ---

  ### 3. Iterated Elimination (The "Delete Stuff Forever" Claim)

  Your friend claims you delete dominated strategies, assume he does the same, and repeat until one thing is left. This is **Iterated Elimination of Dominated Strategies (IEDS)**.

  #### Claim D: "The order of deletion doesn't matter."
  *   **Status:** **TRUE for Strict, FALSE for Weak.**
  *   **Strict Dominance:** If you only delete *strictly* dominated strategies (like D in your game), the order does not matter. You will always end up with the same set of survivors.
  *   **Weak Dominance:** If you delete *weakly* dominated strategies, the order **does** matter. You can delete Strategy A first and arrive at Solution 1, or delete Strategy B first and arrive at Solution 2.
  *   **Does it get him what he wants?** Only if the game is solvable by *strict* dominance.

  #### Claim E: "Iterated elimination gets you the unique rational answer."
  *   **Status:** **FALSE (Generally).**
  *   **Why:** Most games do not reduce to a single cell via IEDS.
  *   **Assumptions:** This requires **Common Knowledge of Rationality (CKR)**.
      *   Level 1: I am rational (I won't play D).
      *   Level 2: I know *you* are rational (I know you won't play your dominated strategies).
      *   Level 3: I know that *you know* that *I am rational* (So I can eliminate my strategies that were only dominated after your strategies were gone).
      *   ...and so on to infinity.
  *   **Reality Check:** In real life (and your arguments), CKR is rarely true. If you think there's a 1% chance he's irrational or just doesn't know game theory, the whole chain breaks.

  ---

  ### 4. Dominated vs. Never a Best Response (NBR)

  Your friend said these are the "same sentence."
  **Verdict: Almost, but there is a technical gap.**

  *   **Theorem:** A strategy is strictly dominated (allowing for mixed strategies) **if and only if** it is never a best response to any belief (probability distribution) over the opponent's strategies.
  *   **The Catch:** If you restrict "Best Response" to only mean "Best response to a *pure* strategy," they are **not** the same.
      *   In your game, D is not a best response to L (U is better).
      *   D is not a best response to C (M is better).
      *   D is not a best response to R (U or M is better).
      *   So in this specific case, D is NBR to pure strategies *and* dominated by a mix.
  *   **Where they come apart:** In some larger games, a strategy might not be dominated by any single mix, but still never be a best response. However, the standard theorem (Pearce's Lemma) equates Strict Dominance (by mix) with Never a Best Response (to mix).
  *   **Takeaway:** He is effectively right on this, provided you accept mixed strategies/beliefs.

  ---

  ### 5. The Zero-Sum Claim (Where He Is Wrong)

  Your friend claimed: *"In a zero-sum game dominance reasoning gets you the whole answer."*
  **Verdict: FALSE.**

  *   **Counter-Example:** **Matching Pennies.**
      *   You win if match, he wins if mismatch. Payoffs are +1/-1.
      *   **Dominance Check:**
          *   If he plays Heads, you want Heads.
          *   If he plays Tails, you want Tails.
          *   No strategy (Heads or Tails) is dominated. Neither is ever better than the other regardless of his move.
      *   **Result:** Dominance reasoning deletes **nothing**.
      *   **The Solution:** The answer is a Mixed Strategy Nash Equilibrium (play 50/50). This is found via **Minimax** reasoning, not Dominance reasoning.
  *   **Correction:** He is confusing **Dominance** with **Minimax**. In zero-sum games, Minimax solves the game. Dominance only helps if there happen to be dominated strategies (which there often aren't).

  ---

  ### Summary Scorecard for Your Argument

  | Claim | Verdict | Notes for your comeback |
  | :--- | :--- | :--- |
  | **D is dominated in the 3x3** | **TRUE** | It is dominated by a 50/50 mix of U and M. You were right to feel cheated, but he is mathematically right. |
  | **Dominated = Never Best Response** | **MOSTLY TRUE** | Only true if "Best Response" includes responses to *probabilistic beliefs*, not just pure moves. |
  | **Opponent payoffs don't matter** | **TRUE** | Dominance is about *your* payoffs only. |
  | **Order of deletion doesn't matter** | **CONDITIONAL** | True for *Strict* dominance. False for *Weak* dominance. |
  | **Weak deletion removes Equilibria** | **TRUE** | Do not let him eliminate weakly dominated strategies if you want to find Nash Equilibria. |
  | **Dominance solves Zero-Sum games** | **FALSE** | Matching Pennies has no dominated strategies. He is confusing Dominance with Minimax. |
  | **IEDS gives "The Rational Answer"** | **FALSE** | Requires Common Knowledge of Rationality. If there's any doubt about his rationality, the logic fails. |

  **How to win the next round:**
  Concede the 3x3 game (he won that battle). Then hit him on the Zero-Sum claim. Tell him: *"If dominance solved all zero-sum games, Matching Pennies would have a pure strategy solution. It doesn't. You're confusing Dominance with Minimax. Also, if you eliminate weakly dominated strategies, you might delete the Nash Equilibrium we actually play, so your 'law of nature' is actually just a heuristic that breaks in coordination games."*
