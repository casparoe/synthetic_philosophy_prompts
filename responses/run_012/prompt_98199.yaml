      *   *Conjonctures* (Conjunctures): Medium-term, cyclical, economic trends, demographic shifts, decades/centuries.
      *   *Longue Durée* (Long Duration): Deep structures, geography, mentalities, slow-moving tech, centuries/millennia. Almost immutable.
      *   *Key Insight:* The lower tiers constrain and shape the upper tiers. Events are often just expressions of deeper currents.

  3.  **Address the Core Tension (Agency vs. Structure):**
      *   *Rationalist/Longtermist View:* High agency. Pivotal moments exist (e.g., AI alignment, nuclear inception). Individual choices matter immensely (career capital, earning to give).
      *   *Braudelian View:* Low agency (relative). Structures dictate the menu of options. "Great Men" are surfers, not wave-makers.
      *   *Synthesis:* Where do they meet? You can't fight the *longue durée*, but you can ride the *conjoncture*. Events are less important than we think.

  4.  **Drafting the Implications (Load-Bearing Consequences):**
