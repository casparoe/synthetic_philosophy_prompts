  5.  **Addressing the "Settled vs. Contested" Constraint:**
      *   *Settled:* Braudel *did* argue structures constrain agency. Historians agree he shifted focus away from "Great Men."
      *   *Contested:* How *deterministic* is the *longue durée*? Can individuals ever break structure? (Sewell, Giddens, etc., argue for structuration). Is Braudel too pessimistic?
      *   *Rationalist Clash:* Longtermists explicitly reject hard determinism. This is a fundamental philosophical disagreement, not just a historical one.

  6.  **Refining the Advice for "Doing Good":**
      *   Don't obsess over news cycles (*événements*).
      *   Identify the *conjonctures* (where is the economy/tech going in 20 years?).
