answer: |-
  This interpretation of Quine—let's call it **Entrenched-Commitment Non-Cognitivism (ECNC)**—is sophisticated. It attempts to dodge the crudeness of Ayer's emotivism ("Boo/Hurrah") by leveraging Quine's holism (the web of belief). It suggests moral claims are central, highly protected nodes in the web, revised only for systemic stability rather than empirical hit.

  However, this sophistication comes at a cost. By trying to have it both ways (non-cognitive but rational/social), it inherits the vulnerabilities of non-cognitivism without the simplicity of emotivism, and the vulnerabilities of holism without the empirical anchor of science.

  Here are the defeaters, ranked from structurally destabilizing to merely inconvenient.

  ### 1. The Deflationary Trap (Fatal/Severe)
  **The Argument:** Quine is often associated with a deflationary or disquotational theory of truth (to say " 'P' is true" is just to say "P"). If truth is merely a logical device for endorsement, there is no metaphysical barrier to calling moral sentences "true."
  **The Defeater:** If ECNC says moral sentences *cannot* be true or false, it must posit a robust, substantive theory of truth that ethics fails to meet (e.g., correspondence to natural facts). But Quine's naturalism usually dissolves the correspondence theory. If truth is just a tool we use within the web of belief, why can't we use it in the ethical sector of the web?
  **Concession:** Your source must concede that "truth" in ethics is *different* in kind from "truth" in physics, not just in degree of entrenchment. If he admits this, he risks reintroducing the analytic/synthetic distinction Quine famously destroyed.
  **Verdict:** **Fatal** if he wants to remain a consistent Quinean. He has to explain why the "web" has two different rules for truth.

  ### 2. The Frege-Geach Problem (Severe)
  **The Argument:** Moral sentences embed in logical structures (conditionals, negations, questions). "If stealing is wrong, then getting your brother to steal is wrong."
  **The Defeater:** In realism, "wrong" refers to a property, so the logic holds. In old emotivism, "Stealing is wrong" = "Boo stealing," but "If boo stealing..." makes no sense. ECNC says "Stealing is wrong" = "We are committed to prohibiting stealing." But does "If we are committed..." capture the *normative force* of the conditional? The argument is that you lose the validity of moral reasoning. You can't derive a commitment from a conditional unless the antecedent has propositional content.
  **Concession:** He must adopt a complex semantics (like Allan Gibbard's norm-expressivism) to explain how commitments mimic logic.
  **Verdict:** **Severe.** It doesn't refute the view, but it forces him into technical gymnastics that undermine the "natural," straightforward extension of Quine he claims to offer.

  ### 3. The Normative Authority Gap (Awkward/Severe)
  **The Argument:** Why should I care about "socially inherited commitments"?
  **The Defeater:** If morality is just "what keeps the practice going," it reduces to sociology or game theory. If a sociopath asks, "Why shouldn't I break this commitment if it benefits me?" the Realist says, "Because it's objectively wrong." The Emotivist says, "I can't give you a reason, I'll just punish you." The ECNC theorist says, "Because it disrupts the coherence of our web." The sociopath replies, "I don't care about your web."
  **Concession:** He must concede that moral "oughts" are hypothetical, not categorical. They bind you only *if* you want to remain part of that social practice.
  **Verdict:** **Awkward.** It strips morality of its special authority, making it indistinguishable from etiquette or law, which clashes with how people experience moral obligations.

  ### 4. The Phenomenology of Objectivity (Awkward)
  **The Argument:** When we deliberate on ethics, it *feels* like we are discovering facts, not negotiating commitments.
  **The Defeater:** ECNC implies an error theory of moral experience. We *think* we are tracking truth, but we are actually tracking social coherence.
  **Concession:** He must argue that this phenomenology is a useful illusion generated by the "entrenchment" of the commitments.
  **Verdict:** **Merely Awkward.** Hard to prove either way, but it makes the view psychologically costly.

  ### 5. Moral Disagreement (Weak/Contextual)
  **The Argument:** You mentioned you find this weak. You are partially right.
  **The Nuance:** The problem isn't that we disagree; it's *how* we disagree. We cite reasons. ECNC can handle this (reasons = other commitments). The real bite is **Fundamental Disagreement**. If two cultures have different "entrenched commitments" with no overlap, ECNC says there is no fact of the matter to adjudicate. Realism says one is mistaken.
  **Verdict:** **Weak.** ECNC actually explains intractable disagreement *better* than realism (which expects convergence on truth). This is a feature, not a bug, for your source.

  ---

  ### Qualification into Immunity
  **Has the view been qualified so it can't lose?**
  **Yes.** This is the risk of Quinean holism applied to ethics. If any moral change can be described as "rebalancing the web for coherence," the theory is unfalsifiable.
  *   **Example:** If society abolishes slavery, ECNC says, "Our web became incoherent with other commitments (equality)." If society keeps slavery, ECNC says, "The commitment to property rights was more entrenched."
  *   **Bug or Feature?** It is a **bug** if the goal is explanatory power. A theory that explains both progress and regress as "coherence maintenance" predicts nothing. However, your source might argue this is a **feature** of pragmatism: we aren't aiming for prediction, we are aiming for description of practice.
  *   **Verdict:** It is **insulated** from empirical refutation, but only by becoming a sociological description rather than a philosophical justification.

  ### Predictions: ECNC vs. Realism vs. Emotivism
  1.  **Vs. Realism:** ECNC predicts moral convergence will stall where social utility diverges, even if logic suggests otherwise. Realism predicts eventual convergence on mind-independent truths. ECNC predicts "progress" is just "drift toward stability," not "getting closer to the truth."
  2.  **Vs. Emotivism:** ECNC predicts moral argument is *rational* (internal coherence matters), whereas Emotivism predicts moral argument is ultimately rhetorical or coercive. ECNC predicts we can be *mistaken* in our morals (incoherent), whereas Emotivism says we can only be insincere.

  ### Confidence and Uncertainty
  **Confidence:** 85%. The philosophical landscape here is well-mapped (meta-ethics post-Quine). The tensions between naturalism, non-cognitivism, and truth-deflationism are standard objections.
  **Least Sure Claim:** I am least sure about the **exegesis of Quine**. Quine was notoriously sparse on ethics. Claiming this is the "most natural extension" is interpretive. Quine sometimes leaned closer to an error theory (morals are posits, but bad ones) than a robust non-cognitivism. Your source might be building a castle on a foundation Quine intended to leave bare.

  ### Final Verdict
  The view is **partly** exposed. It solves the "Boo/Hurrah" problem but inherits the "Truth/Logic" problem. It avoids the metaphysical queasiness of realism but loses the normative authority of morality. It is a stable, defensible position, but only if one accepts that morality is ultimately a sophisticated form of social technology rather than a domain of knowledge.

  \answer{partly}
