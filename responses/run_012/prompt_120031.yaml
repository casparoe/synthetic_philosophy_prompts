answer: |-
  1. A normal adult sleeps in a laboratory where a technician notes the exact minute of sleep onset and wakes the subject two minutes later. Upon waking, the subject immediately and confidently reports a dream involving a sequential narrative, such as watching a full-length film, which implies a duration of experience far exceeding two minutes. The technician's log provides independent third-party evidence that the subject was asleep for only those two minutes, creating a conflict between the reported content's implied temporal span and the observed physical interval available for it to occur.

  2. Malcolm concludes the subject definitely dreamed. On his view, dreaming is not experiencing, so physical duration is irrelevant to the dream's existence. The fact of the dream is fixed solely by the confident waking report, not by physiological constraints. Consequently, the time discrepancy fails to undermine the dream, as dreams possess no location in physical time to be contradicted.

  3. Dennett concludes it is empirically uncertain whether the subject experienced anything during sleep. On his view, dreaming is a causal process requiring physical time for sequential content to unfold. Since only two minutes were available, the report may be a narrative assembled at waking rather than a record of sleep experience. The independent timing evidence thus outweighs the testimony regarding the causal history.

  4. The single feature doing the work is the temporal compression between the narrative's implied duration and the observed sleep interval. If removed by allowing the subject to sleep for two hours, both positions can agree the dream occurred, dissolving the incompatibility. If reversed, with a short report and long sleep, no conflict arises, leaving the standards untested.

  5. A defender of Malcolm's verdict attacks the case for begging the question against the conceptual claim that dreams lack physical duration. By treating the two-minute interval as evidence against the dream's occurrence, the case presupposes Dennett's empirical standard that experiences must fit within physical time, rather than neutrally presenting the conflict between standards.
