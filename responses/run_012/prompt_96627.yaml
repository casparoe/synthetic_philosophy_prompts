prompt: |-
  I am a novelist at work on a book set in a society whose moral code is not my own — a real historical society, not an invented one, and I want its moral texture rather than my own convictions dressed in period costume. This means I make the same decision dozens of times in a draft: a character does something my readers will find monstrous, or admirable, or simply unintelligible, and I have to decide whether the book presents it as wrong full stop, as right by the lights of the world that made her, or as something the two moralities cannot even put into a shared question. The decision is not academic for me. It settles what kind of book I am writing — indictment, portrait, or elegy — and reviewers will read a thesis out of it whether or not I intended one. I am not a philosopher, I cannot consult one scene by scene, and I need to make the call in the time it takes to draft the scene. The final text is mine, so I would rather have a procedure that is candid about its own seams than one that pretends the judgment has been automated away.

  Please write me a decision procedure — a checklist I can run while drafting, not a lecture — grounded in what the philosophy of moral disagreement and the empirical psychology of moral variation actually support, working from what you know rather than from any reading list. I want the questions to ask in order, what counts as a sufficient answer to each, the places where the procedure stops with a verdict, and the places where it stops and hands the decision back to me because the question is about the kind of book I am writing rather than about the world. Mark clearly which steps are judgment calls wearing the costume of method, and where the procedure is likely to misfire on a scene.

  Build it around at least these materials, which I think are the load-bearing ones and which I want you to make usable without jargon: the difference between a disagreement in moral verdict and a disagreement in the concepts that carry the verdict; the possibility that an apparent moral clash is really a clash of non-moral belief, dissolving once the parties share a picture of what the act does; the moral/conventional distinction and the question of whether it survives translation; the looping effect by which a category and the people it names reshape each other; and the fact that the empirical case for cross-cultural variation rests on samples that are themselves narrow, so the procedure must not treat widespread variation as a settled premise. I also want you to build in two tests of my own devising, and to improve them if they are bad. The first is a translation test: restate the disputed act in the vocabulary the other society uses for its own central moral concepts, and see what is left over that neither vocabulary can express. The second is a load-bearing check: ask how much of the surrounding normative system would have to move if this practice moved, and what that tells me about whether I am looking at a local rule or a different architecture. Add a third if you can think of one that earns its place.

  Then run the procedure on three cases from my draft, end to end, showing me the answers at each step and the narrative stance each answer implies — neutral portraiture, implicit judgment, or staged incommensurability — and what technique would carry that stance on the page. The cases: a society that exposes unwanted infants; a funerary practice that strikes my readers as desecration; and a family that kills a daughter for a sexual transgression, where the daughter is my most sympathetic character. I expect the last one to give me an answer I will not enjoy, and I want you to give it anyway, including what it costs me dramatically.

  Close by telling me what the procedure cannot do, the kinds of scene where it will produce a confident answer that is wrong, and how I will know when I have left the procedure behind and am simply deciding what I believe.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing historical fiction set in a society with a different moral code.
      *   **Goal:** A practical decision procedure (checklist) for drafting scenes involving moral conflict, not a philosophical lecture.
      *   **Constraints:**
          *   Must be grounded in moral disagreement philosophy and empirical psychology (without jargon).
          *   Must address specific concepts: verdict vs. concept disagreement, non-moral belief clashes, moral/conventional distinction, looping effects, limitations of cross-cultural data.
          *   Must incorporate two user-devised tests (Translation Test, Load-Bearing Check) and add a third.
          *   Must mark where the procedure stops with a verdict vs. where it hands the decision back to the author (book type: indictment, portrait, elegy).
          *   Must mark where judgment calls are disguised as method and where it might misfire.
          *   Must apply the procedure to three specific cases: infant exposure, funerary "desecration," honor killing of a sympathetic daughter.
          *   Must conclude with limitations and failure modes.
      *   **Tone:** Candid, practical, respectful of the craft, acknowledging the "seams."

  2.  **Deconstruct the Philosophical/Psychological Inputs:**
      *   *Verdict vs. Concept:* Do we agree on the goal (flourishing) but disagree on the means (verdict), or do we define the goal differently (concept)?
      *   *Non-Moral Belief:* Is the disagreement about facts (e.g., "Does this ghost haunt us?") rather than values?
      *   *Moral/Conventional:* Is this seen as universally wrong (moral) or just against local rules (conventional)? Does this distinction exist in the target culture?
      *   *Looping Effect:* Does labeling people change how they act? (Relevant for how characters internalize the code).
      *   *Empirical Variation:* Don't assume *everything* is relative; some universals exist. Don't treat variation as absolute proof of incommensurability.
      *   *User Tests:*
          *   Translation Test: Can the act be described in *their* terms without residue?
          *   Load-Bearing Check: If this rule changes, does the whole system collapse?
          *   *Third Test Idea:* Needs to address the reader's engagement or the character's internal state. Let's call it the "Internal Cost Test" (How much does it cost the *agent* to do this?).

  3.  **Drafting the Procedure (The "Moral Drafting Compass"):**
      *   *Structure:* Step-by-step questions.
      *   *Formatting:* Clear headers, bold text for decisions, warnings for "seams."
      *   *Integration:* Weave the required concepts into the steps.

      *   *Step 1: The Fact/Value Split (Non-Moral Belief).* Check if the disagreement is about physics/metaphysics.
      *   *Step 2: The Translation Test (User Input).* Can we speak their language?
      *   *Step 3: The Moral/Conventional Boundary.* Is this a rule or a law of nature to them?
      *   *Step 4: The Load-Bearing Check (User Input).* Systemic stability.
      *   *Step 5: The Internal Cost Test (New).* Does the character feel guilt, pride, or numbness?
      *   *Step 6: The Authorial Handoff.* Where does the procedure stop and the "kind of book" decision begin?

  4.  **Refining the Tests:**
      *   *Translation Test:* Refine to ensure it captures "residue." If there's residue, it's incommensurability.
      *   *Load-Bearing:* Refine to distinguish between "local custom" and "structural necessity."
      *   *Internal Cost:* This addresses the psychology. If they feel nothing, it's deeply ingrained. If they feel pain, there's a bridge for the reader.

  5.  **Applying to the Three Cases:**

      *   *Case 1: Infant Exposure.*
          *   Facts: Resource scarcity?
          *   Translation: Is it "killing" or "returning"?
          *   Load-Bearing: High.
          *   Stance: Likely Portrait/Elegy.
      *   *Case 2: Funerary Desecration.*
          *   Facts: Belief about souls?
          *   Translation: Is it "honor" or "insult"?
          *   Load-Bearing: Medium/High.
          *   Stance: Portrait (focus on belief).
      *   *Case 3: Honor Killing (Sympathetic Daughter).*
          *   Facts: Social order vs. individual life.
          *   Translation: "Murder" vs. "Cleaning."
          *   Load-Bearing: High (patriarchal structure).
          *   Internal Cost: High (family loves her).
          *   Stance: This is the hard one. The procedure will likely point to *Indictment* or *Tragedy*, but the prompt asks for honesty even if unenjoyable. The procedure might reveal that to treat it as "valid" requires erasing the daughter's humanity, which conflicts with her being the *sympathetic* character. This creates a tension the author must resolve.

  6.  **Addressing the Limitations/Failure Modes:**
      *   Where does it fail? When the author's bias is too strong. When the historical record is silent. When the "residue" is actually the author's modernity screaming.
      *   The "Seams": Acknowledge that "Internal Cost" is subjective.

  7.  **Review against Constraints:**
      *   *Checklist format?* Yes.
      *   *No jargon?* Keep terms like "incommensurability" explained or avoided.
      *   *Mark judgment calls?* Yes, use specific markers (e.g., [AUTHOR DECISION]).
      *   *Three cases?* Yes.
      *   *Honor killing honesty?* Must ensure the output doesn't shy away from the difficulty.
      *   *Closing limitations?* Yes.

  8.  **Final Polish:**
      *   Ensure the tone is professional and collaborative, not prescriptive.
      *   Make sure the "Third Test" is distinct and valuable. (Decided on "The Residue of Regret" or "Internal Cost" - let's go with "The Cost of Compliance" to fit the load-bearing metaphor).
      *   Check the "Looping Effect" inclusion. It fits best in the character psychology section.
      *   Check the "Empirical Variation" warning. Put this in the preamble or Step 1.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "do this." I need to show *why* based on the requested philosophical grounding. For instance, when discussing the Translation Test, explicitly mention the "concept vs. verdict" distinction. When discussing Load-Bearing, mention the "moral/conventional" distinction.

      *(Refining the Honor Killing Case)*: The prompt says "I expect the last one to give me an answer I will not enjoy." This implies the procedure might suggest that treating it as "culturally valid" undermines the sympathy for the daughter. I need to be precise here. If the daughter is sympathetic *to the reader*, but the culture kills her, the tension is the book. If the culture kills her and the *family* feels no pain, it's alien. If they feel pain, it's tragedy. The procedure should highlight this pivot point.

      *(Final check on "Seams")*: I need to explicitly label where the procedure is actually just the author's intuition in disguise.

      *(Let's build the Third Test)*: The prompt asks for a third test.
      *   Test 1: Translation (Concepts).
      *   Test 2: Load-Bearing (Systemic).
      *   Test 3: *The Looping/Identity Test.* How does performing this act change the person doing it? This captures the "looping effect" requirement directly.

      *Wait, looking at the prompt requirements again:* "Build it around at least these materials... the looping effect...". Okay, I need to ensure the looping effect is integrated. The "Cost of Compliance" test works, but a "Identity/Looping" test might be better. Let's call it **The Identity Loop Test**: Does performing this act reinforce the category of person they are, or break it?

      *Actually, let's look at the "Empirical Case" requirement.* I need to warn against assuming variation is absolute. I'll put that in the Preamble/Warnings.

      *Okay, let's finalize the structure.*
      1. Preamble (Warnings & Seams).
      2. The Procedure (Steps 1-5).
      3. Application to Cases.
      4. Limitations.

      *Let's write.*
answer: |-
  # The Moral Drafting Compass: A Decision Procedure

  This is not a truth machine. It is a tool to expose the seams in your own reasoning so you can stitch them deliberately. It relies on three premises drawn from moral psychology and philosophy:
  1.  **Disagreement often lives in facts, not values.** (People agree on "protect the group" but disagree on "does this ghost haunt us?")
  2.  **Concepts carry verdicts.** (You cannot judge an act until you know what kind of act they think it *is*.)
  3.  **Systems resist change.** (Some rules are decorations; others are load-bearing walls.)

  **Warning on Seams:** Anywhere you see **[AUTHOR JUDGMENT]**, the procedure cannot calculate the answer. This is where your thesis (indictment, portrait, elegy) enters. Anywhere you see **[LIKELY MISFIRE]**, the historical record or human psychology is too noisy for a clean rule.

  ---

  ## Part I: The Procedure

  Run these five steps in order. If a step yields a definitive result, you may stop. If it yields ambiguity, proceed to the next.

  ### Step 1: The Non-Moral Fact Check
  **Question:** If the character and the reader shared the exact same picture of physical and metaphysical reality, would the judgment of the act change?
  *   *Example:* "We must burn this body" vs. "If you burn this body, the soul cannot cross."
  *   **Test:** Remove the supernatural or empirical belief. Does the act remain "good" or "necessary"?
  *   **Verdict A:** No. The disagreement is purely about facts (germs, gods, economics).
      *   *Narrative Stance:* **Portrait.** Explain the belief; do not judge the value.
  *   **Verdict B:** Yes. Even if the facts were the same, the value judgment differs.
      *   *Action:* Proceed to Step 2.

  ### Step 2: The Translation Test (User Devised)
  **Question:** Restate the act using the society's central moral vocabulary. Is there "residue" left over that neither vocabulary can express?
  *   *Instruction:* Do not translate their word for "honor" into your word for "honor." Define their word by its usage.
  *   **Verdict A:** No residue. The act fits cleanly into their concept (e.g., this is *pietas*, not "killing").
      *   *Narrative Stance:* **Portrait.** The act is intelligible within their logic.
  *   **Verdict B:** Significant residue. The act feels like a violation in *both* vocabularies, or the concepts simply do not touch.
      *   *Narrative Stance:* **Staged Incommensurability.** Do not try to bridge it. Show the gap.
  *   **[AUTHOR JUDGMENT]:** How much residue is "significant"? This is where your tolerance for ambiguity sets the tone.

  ### Step 3: The Moral/Conventional Boundary
  **Question:** In this society, is this rule treated as changeable by authority (conventional) or as universal/unchangeable (moral)?
  *   *Note:* Do not assume they distinguish these the way you do. Watch for reactions to hypothetical rule-changes.
  *   **Verdict A:** Conventional. "If the King said otherwise, it would be fine."
      *   *Narrative Stance:* **Indictment or Satire.** This is power, not truth.
  *   **Verdict B:** Moral. "Even if the King allowed it, the earth would sour."
      *   *Action:* Proceed to Step 4.
  *   **[LIKELY MISFIRE]:** Historical societies often conflate the two. If you cannot determine this from sources, treat as Moral (Verdict B) for safety.

  ### Step 4: The Load-Bearing Check (User Devised)
  **Question:** How much of the surrounding normative system would have to move if this practice moved?
  *   *Instruction:* Imagine the practice is abolished. Do property rights collapse? Does the kinship structure fail? Does the cosmology break?
  *   **Verdict A:** Local Rule. The system stands without it.
      *   *Narrative Stance:* **Character-Driven.** The conflict is about individual choice within a stable world.
  *   **Verdict B:** Architectural. Removing this practice collapses the world as they know it.
      *   *Narrative Stance:* **Tragedy or Elegy.** The characters are trapped by the necessity of their own survival.
  *   **[AUTHOR JUDGMENT]:** This is the strongest determinant of "Indictment" vs. "Elegy." If you choose Indictment here, you are arguing the system *should* collapse.

  ### Step 5: The Identity Loop Test (New)
  **Question:** Does performing this act reinforce the category of person the agent believes they are, or does it fracture them? (Based on the "looping effect.")
  *   *Instruction:* Does the act make them *more* of a "father," "warrior," or "believer"? Or does it require them to suppress a part of themselves to do it?
  *   **Verdict A:** Reinforcement. The act aligns with their self-conception.
      *   *Narrative Stance:* **Alienation.** The reader must accept the character is fundamentally different.
  *   **Verdict B:** Fracture. The act costs them their sense of self.
      *   *Narrative Stance:* **Empathy.** The reader connects through the pain of compliance.
  *   **[LIKELY MISFIRE]:** Characters often lie to themselves about this. You must decide if you are writing their surface justification or their subconscious fracture.

  ---

  ## Part II: Application to Draft Cases

  Here is the procedure run end-to-end on your three scenarios.

  ### Case 1: Infant Exposure
  *The society leaves unwanted infants on a hillside to die.*

  *   **Step 1 (Fact Check):** *Belief:* Resources are finite; an extra mouth kills the clan. *Metaphysics:* The infant is not a "person" until named/fed.
      *   *Result:* If the reader accepts the resource constraint and the definition of personhood, the verdict shifts.
      *   *Pass:* Partial. The resource constraint is factual; the personhood definition is conceptual. Proceed.
  *   **Step 2 (Translation):** *Vocabulary:* Is this "murder" or "returning to the gods"?
      *   *Result:* If their language treats the infant as property or potentiality rather than a subject, "murder" is a mistranslation. There is residue (the biological potential), but the moral concept doesn't match.
      *   *Stance:* **Portrait.**
  *   **Step 3 (Moral/Conventional):** Is this a law or a law of nature?
      *   *Result:* Likely treated as natural necessity.
      *   *Pass:* Moral.
  *   **Step 4 (Load-Bearing):** If they stop exposing infants, does the society collapse?
      *   *Result:* In a subsistence economy without contraception or welfare, yes, famine risk increases significantly.
      *   *Stance:* **Elegy.** The practice is structural, not malicious.
  *   **Step 5 (Identity Loop):** Does the parent feel like a "murderer" or a "steward"?
      *   *Result:* If they feel like stewards making a hard choice, empathy is hard but possible. If they feel numb, they are alien.
      *   *Decision:* Write the grief, not the justification.
  *   **Final Narrative Stance:** **Elegy.** The technique is to focus on the *necessity* felt by the parent, not the biological fact of the death. Do not sanitize the death, but do not grant the reader the comfort of a villain.

  ### Case 2: Funerary "Desecration"
  *The society dismembers or burns the dead in a way that horrifies your readers.*

  *   **Step 1 (Fact Check):** *Belief:* The soul is trapped in the flesh; it must be released by fire/cutting.
      *   *Result:* If the reader accepts "soul trapped in flesh," the act becomes mercy.
      *   *Pass:* Yes. This is primarily a non-moral belief clash (metaphysical physics).
  *   **Step 2 (Translation):** *Vocabulary:* Is this "desecration" or "liberation"?
      *   *Result:* "Desecration" is the reader's term. Their term is "completing the journey."
      *   *Stance:* **Portrait.**
  *   **Step 3 (Moral/Conventional):** Is this optional?
      *   *Result:* No. To fail to do this is to condemn the ancestor.
      *   *Pass:* Moral.
  *   **Step 4 (Load-Bearing):** If they stop, does the system break?
      *   *Result:* The relationship between living and dead breaks. Ancestors stop protecting.
      *   *Stance:* **Portrait.**
  *   **Step 5 (Identity Loop):** Does the agent feel like a violator?
      *   *Result:* No, they feel like a priest.
      *   *Decision:* Write the reverence, not the violence.
  *   **Final Narrative Stance:** **Neutral Portraiture.** The technique is sensory focus on the *care* taken during the act, not the gore. The horror belongs to the observer, not the actor. If you judge this, you are judging their metaphysics, which is an indictment of their reality, not their morals.

  ### Case 3: Honor Killing (Sympathetic Daughter)
  *The family kills the daughter for sexual transgression. She is your protagonist.*

  *   **Step 1 (Fact Check):** *Belief:* Her act brings spiritual pollution or social death to the kin.
      *   *Result:* Even if the "pollution" is metaphorical, the social exclusion is real. However, the *lethality* is a choice.
      *   *Pass:* No. This is a value judgment on the proportionality of response. Proceed.
  *   **Step 2 (Translation):** *Vocabulary:* Is this "murder" or "cleansing"?
      *   *Result:* There is massive residue. "Cleansing" implies removing dirt. She is a person. The translation fails to capture her subjectivity.
      *   *Stance:* **Staged Incommensurability.**
  *   **Step 3 (Moral/Conventional):** Is this a rule or a law of nature?
      *   *Result:* Often enforced by peers, not just gods. It borders on conventional power disguised as moral law.
      *   *Pass:* Ambiguous. Proceed.
  *   **Step 4 (Load-Bearing):** If they spare her, does the system collapse?
      *   *Result:* This is the critical juncture. In many historical contexts, *no*, the system does not collapse. Other sanctions exist (shunning, marriage). Killing is often a choice to signal status or resolve shame, not a structural necessity for survival (unlike infant exposure in famine).
      *   *Verdict:* **Local Rule / Power Move.**
      *   *Implication:* This suggests **Indictment**. The system *could* absorb the transgression without death, but chooses not to.
  *   **Step 5 (Identity Loop):** Does the killer feel reinforced or fractured?
      *   *Result:* If the father loves her (sympathetic character), he is fractured. He must break himself to save his honor.
      *   *Decision:* This is where the procedure hands the gun to you.
  *   **Final Narrative Stance:** **Tragedy / Indictment Hybrid.**
      *   *The Unenjoyable Answer:* The procedure indicates this is **not** load-bearing in the same way as infant exposure. It is a choice. To treat it as "culturally valid" (Portrait) requires you to minimize the daughter's humanity or exaggerate the systemic necessity. Since she is your *sympathetic* character, you have already granted her humanity. Therefore, the text cannot fully validate the killing without breaking the reader's bond with her.
      *   *Technique:* You must write the **cost to the killer**. If the father feels no pain, he is a monster (Indictment). If he feels agony but does it anyway, it is Tragedy. But you cannot write it as "Right." The procedure confirms that unlike the infant (survival) or the corpse (metaphysics), this act is a social enforcement mechanism that *could* be otherwise.
      *   *Dramatic Cost:* You lose the "Anthropological Alibi." You cannot say "that was their time." You must show that *their* time knew it was wrong, too, or that the cost of being right was the death of love. The book becomes a tragedy about the system consuming its own best parts, not a portrait of a different morality.

  ---

  ## Part III: Limitations and Failure Modes

  ### What This Procedure Cannot Do
  1.  **It cannot resolve the "Sympathy Trap."** In Case 3, the procedure flagged the killing as non-load-bearing. But if you make the culture *too* alien, readers disengage. If you make them *too* like us, the killing becomes inexplicable. The procedure identifies the tension; it does not solve the pacing problem of managing that tension.
  2.  **It cannot access silence.** Historical records often omit the voices of those subjected to the morality (the infants, the daughters, the sacrificed). The procedure relies on knowing the "vocabulary" (Step 2). If the vocabulary belongs only to the killers, the Translation Test will always favor the oppressor. **[LIKELY MISFIRE]**
  3.  **It assumes coherence.** Real societies are messy hypocrites. They may claim a rule is "load-bearing" (Step 4) but bend it for the powerful. The procedure treats the society as a logical system; history is often a collection of ad-hoc rationalizations.

  ### Where It Will Produce a Confident Wrong Answer
  *   **The "Necessity" Fallacy:** In Step 4 (Load-Bearing), you may accept the society's *claim* that "if we don't do X, we all die." Often, elites claim necessity to enforce hierarchy. If you take their word for it, you turn an Indictment into an Elegy by mistake.
      *   *Correction:* Cross-reference Step 4 with Step 3 (Moral/Conventional). If the rule is enforced by shame rather than material consequence, it is likely power, not necessity.
  *   **The "Residue" Blindspot:** In Step 2 (Translation), you might miss the residue because you are fluent in the historical mindset by now. You may stop seeing the horror.
      *   *Correction:* Have a beta reader who knows *nothing* about the period run Step 2. If they see residue and you don't, you have gone native.

  ### Knowing When You Have Left the Procedure
  You have left the procedure when you find yourself arguing against the verdict of Step 4 or 5 because the result makes the scene "too hard" to write.
  *   If Step 4 says "Not Load-Bearing" (Indictment) but you want to write an Elegy, you are imposing your own moral conviction that "everyone is a victim of their time."
  *   If Step 5 says "Fracture" (Empathy) but you write the killer as numb, you are choosing **Alienation** for stylistic effect.

  That is not a failure of the procedure. That is the moment the book becomes yours. The procedure clears the brush; you must still build the house. When you ignore the verdict, mark it in your notes. That is where your thesis lives.
