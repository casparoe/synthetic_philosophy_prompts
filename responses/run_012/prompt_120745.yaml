answer: |-
  Stele fragment 44B records the Battle of River Bend under General Kael, carved by his grateful grandson. The inscription boasts the enemy fled before the third horn, yet adds that Kael trembled in his armor until the first arrow flew. He rallied then and won, but the stone records his initial fear alongside the victory, though the surrounding text praises his lineage without fault.

  **Analysis**

  **Rule 1 (Embarrassment):** This rule returns a verdict of **Authentic**. Admitting that the hero trembled damages the glory of the General and shames the lineage the grandson is trying to honor; a forger or propagandist would typically suppress such weakness. Because the detail costs the author's side prestige, it is unlikely to have been invented.

  **Rule 2 (Later Addition/Edification):** This rule returns a verdict of **Addition**. The detail is vivid and serves a moralizing purpose (courage is acting despite fear) that a later teller, specifically a grandson instructing the public, would enjoy inserting. Because the claim fits the pattern of an edifying lesson added to flatter the moral sensibilities of a later audience, it is likely an interpolation.

  **Pivotal Feature:** The single feature driving the conflict is **the General's trembling**. It is simultaneously a mark of shame (triggering Rule 1) and a device for moral instruction (triggering Rule 2).

  **Flip It:** If the text stated Kael remained **stoic and unmoving**, Rule 1 would lose leverage (no embarrassment to verify) and Rule 2 would lose leverage (no moral struggle to edify), leaving the claim neutral.

  **Best Counterattack:** A historian trusting Rule 2 (that it is an addition) would argue the **weak joint** is the transition between the victory boast and the fear detail. To press the attack, they would have to **give up** the unity of the inscription, arguing the moralizing clause was carved in a different hand or era than the victory report.

