          *   $P(H|E) \propto P(E|H) \cdot P(H)$
          *   $H$ = Hypothesis (the claim).
          *   $E$ = Evidence (the testimony/data).
          *   $P(H)$ = Prior Probability (how well it fits the "picture of how the world works").
