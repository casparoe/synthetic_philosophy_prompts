answer: |-
  Family, friends, faculty, and graduates, we gather here to mark a transition. Usually, at a moment like this, a speaker would tell you to hold fast to your beliefs. They would tell you to follow your dreams. They would tell you to believe in yourselves. But you and I know that such advice rests on a mistake. You have spent years studying the architecture of the mind, and you know that the vocabulary of folk psychology is a map that does not match the territory. There are no beliefs to hold. There are no dreams to follow. There is no inner self waiting to be believed in. To speak as though there are is to speak like a census bureau reporting that the average household contains two and a half people. That number is useful. It allows for prediction. It allows for planning. But no family sits down to dinner with half a person at the table. No individual lives inside the average.

  I stand before you defending the view that talk of beliefs and desires is like that average. It captures patterns across a population. It helps us navigate the social world. But it does not pick out a state that any single one of you is in. There is no ghost in the machine pulling levers. There is only the machine itself, intricate and physical, firing and moving and interacting. I know this sounds cold to those who have not studied what you have studied. To the families here, I say that denying the existence of beliefs is not denying the reality of your graduates. It is not denying their capacity to love, to work, or to care. It is simply insisting that we look at what is actually there. It is insisting that we find the warmth in the reality, rather than in the story we tell about the reality.

  So, if there are no dreams to follow, what is there to do? If there are no beliefs to guide you, what will steer you? The answer lies in what remains when we strip away the folk theory. What remains is your history of interaction. What remains is your trained attention. What remains is the disposition to act in certain ways when the world presents certain challenges. You are not vessels carrying a cargo of desires. You are patterns of activity extending into time. The encouragement I offer you is not to look inside for a compass, because there is no inside room where a compass hangs. The encouragement is to look at the trajectory you are already enacting.

  You have cultivated habits during your time here. You have sharpened your capacity to notice distinctions others miss. You have practiced the discipline of argument and the patience of inquiry. These are not preparations for life; they are the substance of life. When you leave this place, do not ask yourselves what you want. Ask yourselves what you are disposed to do. Ask yourselves which patterns of behavior sustain the networks you inhabit. Ask yourselves where your attention goes when it is not forced. That flow of attention is the closest thing you have to a direction. It is not a desire pulling you from the future. It is a causal history pushing you into the next moment. Trust that history. Trust the reliability of your own trained responses.

  There is a profound freedom in this view. If you do not have fixed beliefs, you are not bound to defend them when they cease to be useful. If you do not have essential desires, you are not failing when your interests shift. You are simply changing parameters. You are adjusting the system. This allows for a kind of flexibility that the old vocabulary forbids. It allows you to admit error without admitting a flaw in the self, because there is no self to be flawed. There is only the organism adapting to its environment. When you encounter obstacles, do not despair that your dreams are dying. Recognize that the environment has changed the conditions of your movement. Adjust the gait. Find the new path. The value is not in reaching a destination you imagined years ago. The value is in the quality of the movement itself.

  And what of the future? I cannot tell you to hope for it. Hope implies a wish for a state of affairs that may not obtain. Instead, I invite you to anticipate it as the causal consequence of your present actions. The future is not a place you are going to. It is a shape you are building with every gesture, every word, every act of care. When you treat a colleague with patience, you are not expressing a moral belief. You are reinforcing a social practice that makes cooperation more likely. When you attend to the suffering of another, you are not fulfilling a duty. You are stabilizing a network of support that will, in turn, stabilize you. We are true together, even if we are not true individually. The census view reminds us that our humanity is a statistical reality, emergent from our interactions. We are real because we are connected.

  So go out into the world and be reliable. Be the kind of system that others can predict with confidence, not because you are rigid, but because you are consistent in your care. Cultivate dispositions that reduce suffering. Train your attention on what matters. Do not worry about whether you are happy. Happiness is another folk term, another average. Worry about whether you are effective. Worry about whether your actions generate the patterns you wish to see in the population. You are not the authors of a story. You are the architects of a causal chain. Make it strong. Make it kind. Make it something that, when averaged with the actions of others, yields a world worth living in.

  I look forward to seeing what you do. I look forward to observing the patterns you enact. I know that you will not follow your dreams, because there are no dreams. But I know you will move. I know you will act. And in that movement, in that shared activity, you will find everything that the old words tried to capture, only more solid, more real, and more truly yours. Congratulations.
