answer: |-
  ### The Candidate Rules

  Based on your friend's track record, she is distinguishing between cases where a person is *harmed by a redirected threat* versus cases where a person is *used to stop the threat*. Two specific rules fit all five of her past verdicts perfectly:

  **Rule 1: The Causal Means Constraint (Doctrine of Double Effect)**
  *   **The Rule:** It is permissible to cause harm as a foreseen *side effect* of saving others, but impermissible to cause harm as a *means* to saving others.
  *   **Fit:**
      *   *Plain Switch/Already-tied:* The victim dies because they are in the path of the trolley. Their death does not *cause* the saving; the diversion does. (Side Effect → **Yes**)
      *   *Footbridge/Trapdoor/Shoving:* The victim's body (or weight) is physically required to stop the trolley. Their impact is the mechanism of salvation. (Means → **No**)

  **Rule 2: The Direct Agency Constraint (Locus of Intervention)**
  *   **The Rule:** It is permissible to intervene directly on the *threat* (the trolley/track), but impermissible to intervene directly on the *person* (pushing, dropping, shoving).
  *   **Fit:**
      *   *Plain Switch/Already-tied:* She pulls a lever on the track. (Intervention on Threat → **Yes**)
      *   *Footbridge/Trapdoor/Shoving:* She pushes a man, opens a floor under a man, or shoves a man. (Intervention on Person → **No**)

  ---

  ### Prediction for the New Case (Short Side Track/Body as Brake)

  **The Setup:** You pull a lever (intervene on threat), but the person on the side track is physically required to stop the trolley (used as means).

  *   **Rule 1 (Causal Means) Predicts:** **NO.** Even though you pulled a lever, the person's body is functioning as the brake. Their death is the *means* of saving the five, not merely a side effect of redirection. This aligns with the Footbridge verdict.
  *   **Rule 2 (Direct Agency) Predicts:** **YES.** You did not touch the person; you touched the track. The locus of your agency was the threat, not the victim. This aligns with the Plain Switch verdict.

  ---

  ### Best Guess & Reasoning

  **My Guess:** She will say **NO** (She will not divert the trolley).

  **Why I Lean This Way:**
  The "Already-tied/Buffer" case is the smoking gun. In that scenario, she explicitly clarified that *"his being there isn't what stops the trolley."*

  If she were running **Rule 2 (Direct Agency)**, that detail would be irrelevant. As long as she pulled a lever rather than pushing a person, the verdict should be "Yes" regardless of whether the track ended in a buffer or the person's body. The fact that she felt the need to specify the *causal role* of the victim indicates she is tracking whether the person is being *used*, not just whether she touched them.

  She is likely running **Rule 1 (Causal Means)**. In the new case, since the person's body is required to absorb the momentum, she will view this as functionally identical to the Footbridge case, despite the lever.

  ---

  ### The Discriminating Case

  To definitively split these two rules apart, you need a scenario where **Rule 1 says YES** (no one is used as a means) but **Rule 2 says NO** (you must physically intervene on a person).

  **The Case: "The Obstructed Lever"**

  > **Setup:** The lever to divert the trolley is blocked by a bystander who has fallen asleep against it. To pull the lever and save the five, you must shove the bystander aside. This shoving will bruise their arm (minor harm), but it will not kill them. Once moved, you pull the lever. The trolley diverts to a side track where it hits one person (who is already tied there and whose body is *not* needed to stop the trolley).

  *   **Rule 1 (Causal Means) Says:** **YES.** The bystander's bruising is a side effect of accessing the lever. They are not being *used* to stop the trolley (the track switch does that). The person on the track is also not a means (the buffer/track stops the trolley). No one is used as a means.
  *   **Rule 2 (Direct Agency) Says:** **NO.** You physically shoved a person. Your direct intervention was on a human body, not the trolley or the track.

  If she says **Yes** to the Obstructed Lever, she is running the **Causal Means** rule (and will likely say **No** to your New Case). If she says **No** to the Obstructed Lever, she is running the **Direct Agency** rule (and will likely say **Yes** to your New Case).
