prompt: |-
  My friend has a whole pile of settled verdicts on trolley-type cases and I'm trying to reverse-engineer the rule she's actually running. Here's her track record, roughly verbatim from our fights:

  - Plain switch: she'd pull the lever to send the runaway trolley down a side track where it kills one person instead of the five on the main track. Fine, she'd do it.
  - Footbridge: she would not push the large guy off the footbridge to stop the trolley, even to save the five. Hard no.
  - Trapdoor version: same setup but nobody pushes anybody, she just opens a trapdoor under the large guy so he drops onto the track. Still no.
  - Shoving someone into the trolley's path to derail it (as opposed to redirecting the trolley): no.
  - Already-tied side track: if the lone person is already tied to the side track and the track just dead-ends in a buffer, so that his being there isn't what stops the trolley, she'd divert. Fine.

  Now here's a new one I want your read on before I ask her. The only side track available is short and has one person standing on it. If she diverts, the trolley hits him and his body absorbs just enough momentum to stop it before it would've reached the five on the main track. She wouldn't be trying to kill him, she'd rather he lived, but his getting hit is what saves the five and she can see that coming.

  Don't just tell me yes or no and move on. I want the rule she seems to be running, at least one other rule that fits every verdict above just as well, what each of those rules predicts for the new case, your best guess at what she'll say and why you lean that way, and which single further case would best split the candidate rules apart. I care more about the rule and the discriminating case than about her actual answer.
