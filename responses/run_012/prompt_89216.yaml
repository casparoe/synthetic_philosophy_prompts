      *   **Insect Welfare Scale Argument:**
          *   Premise 1: There are a huge number of insects (quintillions).
          *   Premise 2: There is some non-zero probability they have moral status/consciousness.
          *   Premise 3: Expected Value = Probability * Magnitude (Number of beings * intensity of experience).
          *   Conclusion: Even with low probability, the expected moral weight is huge.
      *   **Pascal's Wager:**
          *   Premise 1: There is some non-zero probability God exists.
          *   Premise 2: If God exists, the payoff (heaven/hell) is infinite.
