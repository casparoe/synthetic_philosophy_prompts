prompt: |-
  I've been reading a lot about insect welfare lately — I went vegan a couple years back and then fell down the rabbit hole into the whole "how much do bugs even matter" thing, and now I can't stop thinking about it. At a meetup the other night I was trying to explain the scale argument to a friend: basically that there are something like quintillions of insects alive at any given moment, so even if the odds that any particular one is conscious enough to count are really low, the total expected amount of morally relevant experience could still dwarf all of human and farmed-animal welfare put together. My friend cut me off and said the scale argument is just Pascal's wager in a lab coat — a huge stake multiplied by a tiny probability, dressed up to look like reasoning instead of wishful thinking — and that I should stop acting like the arithmetic settles anything. Now I can't tell if that's a devastating objection or a cheap gotcha, and it's been bugging me for a week.

  Can you audit the analogy properly? Give me the correspondence first — what plays the role of God, of the infinite payoff, of the cost of betting, of the prior/evidence, and whatever else is lurking in the wager — then tell me where the mapping actually breaks down, which of those breaks matter for whether I should take insect welfare seriously and which are just noise, and finally whether the conclusion my friend wants (that the scale argument is a rhetorical trick and I can relax) survives once the disanalogies are on the table, or whether the analogy was doing all the work for him. And if there's a better analogy for what the scale argument really is, tell me that too.

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble, and don't restate my question back to me.
reasoning: |-
