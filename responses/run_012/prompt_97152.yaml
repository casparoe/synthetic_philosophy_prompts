  Now I stand heavy, vulnerable, and slow,
  A predator could take me, you should know,
  I bet my life on being chosen so;
  This weight proves strength, but not where I will go,
  It shows I bore the cost, not that I grow,
  The verdict hangs, the interest accrues,
  I bleed for trust, and still have much to lose.
