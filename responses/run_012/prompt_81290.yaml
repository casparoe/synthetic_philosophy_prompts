answer: |-
  **Setting:** *A graduate seminar room, late afternoon. The whiteboard is still covered in decision trees from the lecture. Most students have left. Elena (the student) is packing her bag. Professor Vance (the defender) is erasing the board, but pauses, marker in hand.*

  **Vance:** You're still worried about the Concorde.

  **Elena:** I'm worried about the diagnosis, Professor. Not the flight. Everyone agrees the Concorde was a financial disaster. The question is whether the *reasoning* of the bureaucrats who kept funding it was necessarily pathological.

  **Vance:** Pathological is a strong word. But it was irrational. The money was gone. The fuel was burned. The only question that mattered was: *From this moment forward, does the next hour of flight generate more value than it costs?* The answer was no. To let the past dictate the future is to let a ghost drive the car.

  **Elena:** But what if the ghost is the only thing holding the car on the road? Let's take a case closer to home. Me. Three years into this PhD. I've passed my exams, I've got the funding, but my dissertation project—the archival work on 18th-century trade routes—is hitting a wall. The data is sparse. The probability of a breakthrough is low. By the textbook logic, I should cut my losses. The three years are sunk. I should evaluate only the next two years: cost of tuition and opportunity wage versus the expected value of a degree that might be mediocre.

  **Vance:** And?

  **Elena:** And if I quit, I signal to myself and the market that I'm the kind of person who abandons ship when the water gets rough. If I stay, even if the dissertation is mediocre, I prove I'm the kind of person who finishes. That credibility has future value. It gets me hired. It gets me grants. So, honoring the sunk cost—the three years already spent—is the only way to unlock that future value.

  **Vance:** Stop. You've just smuggled in a future benefit. You're not honoring the sunk cost; you're investing in *reputation*. The three years aren't the *reason* you stay; they are the *price* you paid to enter the reputation market. That's standard forward-looking reasoning. You've just enlarged the state space to include your own psychology.

  **Elena:** I haven't smuggled it in. I've identified the mechanism. Why does staying build reputation? *Because* observers know that quitting wastes the investment. If it were rational to quit whenever the marginal expected value dipped slightly below the marginal cost, no one would ever finish anything difficult. The "irrational" disposition to honor sunk costs is what makes the signal credible. If I were a perfect rational actor in your sense, my threat to finish would be non-credible, because everyone would know I'd bail the second the math turned negative.

  **Vance:** So you're arguing for a policy, not an act.

  **Elena:** I'm arguing that the act looks irrational in isolation but is rational as part of a disposition.

  **Vance:** Fine. Let's grant that. As a heuristic, "don't be a quitter" is useful. Humans are bad at calculating marginal expected value under stress. So we adopt a rule: *Finish what you start.* But don't confuse the heuristic with the truth. The *truth* is still that the past costs are zero. The rule works *despite* the falsity of the reasoning, not because of it. It's a useful fiction. Like telling a child the tooth fairy is real to encourage brushing.

  **Elena:** *(Pauses)* I'll concede the point on the *act*. If I could calculate perfectly, and if my reputation were transparently observable without my needing to prove it, then yes, the sunk cost would be irrelevant. I'll grant that in a frictionless world, you're right.

  **Vance:** Good. Then we agree the standard model is the normative baseline.

  **Elena:** No. Because we don't live in a frictionless world. And here is where your baseline fails. You say the standard view predicts persistence only when future benefits outweigh costs. I say my view predicts the same thing. We have observational equivalence. So why is your view the "baseline" and mine the "deviation"?

  **Vance:** Because my view is falsifiable. If you persist when the future benefits clearly *don't* outweigh the costs, I call it an error. You... what do you do?

  **Elena:** I look for the hidden benefit. Information. Screening. Signaling.

  **Vance:** Exactly. You can't lose. If a manager keeps pouring money into a failing product, I say, "That's the sunk cost fallacy." You say, "No, they're screening for market resilience," or "They're signaling commitment to shareholders." If *every* instance of persistence can be retrofitted as rational, you haven't expanded rationality; you've emptied the word of meaning. Is there any behavior that would count as evidence against your account?

  **Elena:** Yes. Private sunk costs.

  **Vance:** Go on.

  **Elena:** This is the third part. Distinguish between costs that leave a public trace and those that don't. If I spend three years writing a novel in a drawer, no one sees it. If I quit, no one knows. There is no strategic audience. If I still refuse to quit, despite knowing the novel is bad and will never be read... that's harder for me to defend.

  **Vance:** Is it? You still have to live with yourself. You're signaling to your future self. If you quit now, you teach your future self that quitting is an option. You degrade your own self-trust. That's a future cost.

  **Elena:** But that's the trap, isn't it? You keep converting my arguments into future-looking calculations. "Reputation is future value." "Self-trust is future value." You're treating the *consequence* of the sunk cost as the justification, while ignoring that the *existence* of the sunk cost is what creates the consequence.

  **Vance:** Because consequences are all that matter for decision theory!

  **Elena:** But the *causal chain* matters for diagnosis. If I tell a manager, "Ignore the sunk cost," I am telling them to ignore the very thing that creates the reputational asset. If they ignore the three years spent, they might quit. If they quit, they lose the reputation. So the advice "ignore sunk costs" is self-defeating in a strategic environment.

  **Vance:** It's not self-defeating. It's precise. The advice is: *Ignore the fact that you spent the money. Consider only the fact that spending the money has changed your current strategic position.* You're conflating the *expenditure* with the *asset*. The building is an asset. The money spent to build it is gone. If the building has value, keep it. If the building has no value, tear it down. Don't keep it *because* you spent the money. Keep it *because* it earns rent.

  **Elena:** But the market values the building *because* they know you spent the money. It's a commitment device. A flimsy shack built for a million dollars signals more commitment than a sturdy shack built for ten thousand. The inefficiency *is* the signal.

  **Vance:** That's signaling theory, Elena. It's well-trodden ground. And even in signaling theory, the rational agent chooses the signal based on future returns. They don't look at the past and say, "I've already suffered, so I must suffer more." They say, "If I suffer more now, I will be rewarded later." The direction of fit is forward.

  **Elena:** The direction of fit is forward, but the *content* of the calculation is backward. The variable in the equation is $S$, the sunk cost. If $S = 0$, the optimal choice changes.

  **Vance:** Only because $S$ correlates with some other variable, like capability or resolve. But $S$ itself has no causal power. It's a number in a ledger.

  **Elena:** It has causal power over *me*. And I am the agent. If I believe $S$ matters, then it matters. If you try to train me out of that belief, you might train me out of the resolve that makes me successful.

  **Vance:** *(Puts the marker down. Turns to face her.)* Now we're at the crux. You're arguing that false beliefs can be instrumentally rational.

  **Elena:** I'm arguing that the definition of "false" is doing too much work.

  **Vance:** No. If I believe the past cost *itself* justifies future action, I am wrong. The past is gone. If that belief helps me, it's a useful delusion. Like a placebo. Do you want to build a management theory on placebos?

  **Elena:** I want to build one that doesn't assume managers are disembodied calculators. You keep asking me for evidence that would falsify my view. I gave you the private novel case. But you turned it into "self-trust." So let me ask you: What evidence would move *you*? If you found a population of agents who consistently honored sunk costs in private, non-strategic settings, and they were *more* successful than the ones who didn't... would you call it rational then?

  **Vance:** If they were more successful, I would call it adaptive. I would not call it rational. Rationality is about alignment with the structure of the problem, not just survival. A bird that flies into a storm because it's too stubborn to turn back might survive, but it's not navigating correctly. It got lucky.

  **Elena:** But if the stubbornness is the navigation. If the "storm" is the statistical noise of a difficult world, and the only way through is to refuse to update your priors constantly...

  **Vance:** Then you're arguing for bounded rationality. We know humans have limited compute. We know heuristics are necessary. But don't tell me the heuristic *is* the optimization. It's a shortcut. Sometimes it works. Sometimes it crashes the plane. The sunk cost fallacy is the crash.

  **Elena:** And I'm saying the crash rate is lower than you think, because you aren't counting the planes that stayed in the air *because* the pilot refused to bail.

  **Vance:** I count them. I just attribute the lift to the wings, not the refusal to bail.

  **Elena:** *(Smiles faintly)* The wings were built by the refusal to bail.

  **Vance:** We're circling. Here is where we diverge. For me, rationality is a standard of *assessment*. It's a way to grade the decision. For you, it seems to be a standard of *function*. It's a way to grade the outcome.

  **Elena:** Closer. For me, rationality is a property of the *agent's architecture*, not the single decision node. You're grading the move. I'm grading the player.

  **Vance:** And if the player makes a bad move but wins the game?

  **Elena:** Then the player is better than the move.

  **Vance:** And if the player makes the "correct" move according to my model, but loses because they lacked the resolve to see it through?

  **Elena:** Then your model is too thin to describe the game.

  **Vance:** *(Picks up his bag.)* I can't prove you wrong, Elena. Because you've defined success to include the psychological stamina that my model excludes as exogenous.

  **Elena:** And I can't prove you wrong, because you can always redefine my "strategic stamina" as just another "future benefit" in your ledger.

  **Vance:** So what would change my mind? Empirical data. Show me a controlled trial where two groups face a failing project. One is trained to ignore sunk costs. The other is trained to honor them. If the "honor" group yields higher aggregate returns *after* controlling for selection effects... I'll concede the heuristic has normative weight.

  **Elena:** And what would change mine?

  **Vance:** Show me a case where honoring the sunk cost *didn't* generate a future benefit. No reputation, no self-knowledge, no signaling. Just pure persistence in a vacuum. If you can show that people persist *solely* because of the past, with no expectation of future return, and you still want to call it rational... then we have a disagreement about the definition of the word, not the world.

  **Elena:** I think I can show you that. But you'll call it pathology.

  **Vance:** And I think I can show you the trial. But you'll say the "honor" group was just better at signaling.

  **Elena:** *(Shoulders her bag)* See you Thursday, Professor.

  **Vance:** Thursday, Elena. Don't quit on the reading.

  **Elena:** I've already put three hours into it. It'd be a waste to stop now.

  **Vance:** *(Sighs)* That's not a reason.

  **Elena:** Isn't it?

  *(She exits. Vance looks at the empty chair, then at the decision tree on the board. He erases the first node.)*
