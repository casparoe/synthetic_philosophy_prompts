      *   (2) Linking principles need empirical verification, which requires direct access (asking people/reading texts).
      *   (3) Therefore, verified principles only apply to documented/living peoples.
      *   (4) Applying to deep past requires a Uniformity Assumption (past people $\approx$ documented people).
      *   (5) Uniformity Assumption is itself a claim about the past, needing inference from material record.
