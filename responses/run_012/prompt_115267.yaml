      *   *Correction:* Make sure to mention Alison Wylie. She is the go-to philosopher of archaeology for this exact issue (Thinking from Things).
      *   *Correction:* Ensure I don't sound like a Processualist (Binford) who thinks science = laws. Acknowledge the Post-Processual insight that context matters, without falling into the skeptic's trap.

  8.  **Final Polish:** Check tone. Ensure it sounds like a colleague speaking to a grad student. Use terms like "underdetermination," "abduction," "taphonomy," "middle-range theory."

