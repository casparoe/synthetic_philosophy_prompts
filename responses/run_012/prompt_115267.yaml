prompt: |-
  Okay, so I'm a grad student in archaeology and I need help untangling something a friend dropped on me, because the conclusion is obviously nuts but I can't find the loose thread. Take the role of a philosopher of science who actually knows the archaeology side of this — someone at home both in the "how do we know anything about the past" debates and in general philosophy of inference. Think it through properly before you answer, and maybe lay out the possible moves first so I can see the shape of the space.

  Background so you know what's at stake. We dig stuff up and from the stuff we claim to know what people believed and how their societies were organized. Last season we got a pit with roughly two hundred pierced deer teeth, most of them stained with red ochre, a small burnt patch, and a handful of unworked flakes. Whole department says: ornament set, ritual deposit, done.

  My friend's argument, and honestly every premise looks fine to me:

  (1) Any inference from an object to a past belief or institution has to run through a general linking principle of the form "people who make or do X under conditions C think or believe Y."
  (2) A linking principle is only as good as the evidence for it, and the only cases where we can check the link directly are cases where we can ask the people — living people, or people whose writing we can read.
  (3) So every well-supported linking principle is supported only for people like us, or for people in the documented present.
  (4) To use such a principle on the deep past you must assume the people there were relevantly like the people you checked — same kind of mind, same basic responses to similar situations.
  (5) But that uniformity assumption is itself a claim about the past, and we can't establish it by asking anyone. The only route is inference from the material record — the very thing we're trying to justify.
  (6) So every inference from object to past belief is either circular or rests on a uniformity assumption nobody has ever argued for.
  (7) Therefore we can't know anything about what past people beleived or how their institutions worked.
  (8) But we obviously do know some such things — nobody seriously thinks the ochre pit was an accident, and we're not wrong to say some buildings were temples, some burials were intentional, some tablets record taxes. So one of (1)-(6) has to go.

  I feel like (2) is where he's stacking the deck, but I can't say why without giving up something I want to keep, and I don't know the price. I also have a half-formed suspicion that there's a seperate issue about using an analogy to generate a hypothesis versus using it to justify one, and maybe something about formal versus relational analogy, but I can't tell if that rescues anything or just relabels the problem. Someone in my cohort says this is just the old ethnographic-analogy-is-circular worry dressed up, but they couldn't say why the worry doesn't actually go through.

  So: tell me which premise or step to reject, explain why it looked fine in the first place, and price the alternatives for me. I'd rather not be forced to say archaeology is just storytelling with dirt, but I want to know exactly what I'm buying if I don't. Give me the diagnosis, not just a vibe.
