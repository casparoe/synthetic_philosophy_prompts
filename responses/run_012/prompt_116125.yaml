      *   *Is it substantive?* Yes, because the choice of definition dictates what counts as evidence. If Preference = Choice, anomalies don't exist. If Preference = Mental State, anomalies are crucial data. This affects model building and policy.

  4.  **Formulate the Diagnosis:**
      *   **Type of Disagreement:** It is a **Conceptual/Category Disagreement** masquerading as an Empirical one, underpinned by a **Normative Stakes** conflict. It's not *purely* verbal (because the definitions have consequences), but it's not *purely* empirical (because the definitions determine what counts as data).
