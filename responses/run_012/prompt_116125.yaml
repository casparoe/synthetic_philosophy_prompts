      *   *Camp 3* highlights the "Welfarist" interpretation. This is the bridge to policy and normative economics.
      *   *The Core Tension:* The term "preference" is overloaded.
          *   Meaning A: A psychological disposition (Mental State).
          *   Meaning B: A mathematical representation of choice data (Behavioral Pattern).
          *   Meaning C: A measure of well-being (Normative Standard).
      *   *The "Mistake" Paradox:* Camp 2 says violations aren't falsifications, they're inconsistencies. But if you call it a "mistake," you imply there was a "correct" choice, which implies a Mental State (Meaning A) that wasn't followed. This undermines the strict Behaviorist stance (Meaning B).
      *   *The Normative Slide:* Just because $A$ is chosen over $B$ (Meaning B) doesn't mean $A$ makes the person happier (Meaning C). But policy often assumes it does.

