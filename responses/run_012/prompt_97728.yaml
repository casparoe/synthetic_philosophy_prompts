prompt: |-
  You are an epistemologist and philosopher of science who knows Hume's argument about testimony to miracles down to its joints, and who is unusually good at turning an abstract principle into a procedure a busy non-philosopher can actually run. I'm a senior editor at a long-form magazine covering religion and science; several times a month I have to decide how much weight to give a dossier of testimony about an extraordinary event — a healing, an apparition, an incorrupt body, occasionally just a wildly improbable survival or recovery — and I have to decide without interviewing the witnesses myself, usually inside a day, with a colleague who has no philosophy or statistics. I've read Hume's essay on miracles and I broadly accept his rule that testimony should only be credited when it would be a greater marvel for the testimony to be false than for the event to have happened, but I've never been able to make that rule actually settle anything at my desk. Worse, I suspect the simple reading of it may not even apply to my cases: most of them involve events that are merely statistically extraordinary rather than violations of any law of nature, and I don't know whether Hume's maxim still bites when there's no law to violate — only a base rate.

  Please write me a reusable decision procedure my desk can run on any dossier. I want the questions asked in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values or of taste rather than of evidence. Build in the distinctions that matter: the prior improbability of the event versus the reliability of the testimony, many witnesses who turn out to share one source versus genuinely independent ones, and the difference between a claim that is merely unlikely and one that would reorganize everything else I believe if true. Be explicit that I'm not a statistician and can't always get a number, say what to do when I can't, and mark which steps are judgment calls dressed up as procedure. I read rationalist blogs and I'm comfortable with talk of priors, base rates, likelihood ratios, and the outside view, but the checklist itself has to work for my colleague, so don't make it depend on that vocabulary.

  Then run it on three cases, at least one of which is a non-religious extraordinary claim so I can see it treat the religious and the secular consistently: a healing attested by a dozen people at a shrine, an incorrupt body whose devotees all trace back to one enthusiastic account, and a survival that is statistically freakish but perfectly physical. I expect one of these to come out with more credence than my secular instincts are happy with — include that case and don't soften it. Finish by telling me where the procedure will misfire and what it cannot do. Start by brainstorming the distinctions that must survive the simplification and the ones I can safely drop, then give the procedure, then the cases. Throughout, say how confident you are in what you claim, and single out the one point you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Epistemologist and philosopher of science (expert on Hume, testimony, miracles).
      *   **User:** Senior editor at a long-form magazine (religion & science).
      *   **Task:** Create a reusable decision procedure (checklist/algorithm) for evaluating dossiers of extraordinary testimony (healings, apparitions, survivals, etc.).
      *   **Constraints:**
          *   Must be usable by a busy non-philosopher/colleague within a day.
          *   Must handle both "law-violating" miracles and "statistically extraordinary" events.
          *   Must distinguish between independent vs. dependent witnesses.
          *   Must distinguish between prior improbability and testimony reliability.
          *   Must acknowledge where numbers aren't possible (qualitative priors).
          *   Must mark where judgment calls replace calculation.
          *   Must run the procedure on three specific cases (Shrine healing, Incorrupt body, Statistical survival).
          *   One case must result in higher credence than secular instincts might prefer (and not soften it).
          *   Must finish with limitations/failure modes.
          *   Must state confidence levels throughout and identify the least certain point.
          *   Structure: Brainstorm distinctions -> Procedure -> Cases -> Limitations.

  2.  **Deconstruct Hume & Epistemology for the Editor:**
      *   *Hume's Maxim:* "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."
      *   *Problem:* Editors don't calculate "miraculousness." They need heuristics.
      *   *Key Distinction:* Violation of Law (Miracle proper) vs. Extreme Improbability (Freak Event). Hume's argument is strongest on the former, but the logic of testimony applies to both.
      *   *Key Distinction:* Independence of Witnesses. 10 people seeing the same thing is worth less if they talked to each other first.
      *   *Key Distinction:* Motive/Cost. Lying costs something. Mistake costs nothing.
      *   *Key Distinction:* Alternative Explanations. Is there a simpler story (fraud, error, myth) that fits the data better than the extraordinary claim?

  3.  **Brainstorming Distinctions (Keep vs. Drop):**
      *   *Keep:* Independence of sources, Cost of error/fraud, Prior plausibility (Base Rate), Consistency of details, Alternative explanations.
      *   *Drop:* Precise probability calculations, Formal Bayesian updating (too slow), Metaphysical definitions of "miracle" vs. "anomaly" (treat them on a spectrum of improbability).
      *   *Refinement:* Need to translate "Likelihood Ratio" into "How likely is this story if the event *didn't* happen?"

  4.  **Drafting the Procedure (The "Editor's Algorithm"):**
      *   Needs to be step-by-step.
      *   Needs Stop/Go signals.
      *   Needs to flag "Judgment Calls."
      *   *Step 1: Define the Claim.* (Is it impossible or just unlikely?)
      *   *Step 2: Check the Base Rate.* (How often does this happen normally?)
      *   *Step 3: Witness Independence.* (The "Echo Chamber" test.)
      *   *Step 4: Motive & Cost.* (Why lie? What do they lose?)
      *   *Step 5: The "Better Story" Test.* (Hume's core: Is fraud more likely than the event?)
      *   *Step 6: The Verdict.* (Publish, Spike, or Flag as "Claimed".)

  5.  **Developing the Three Cases:**
      *   *Case 1: Shrine Healing (Religious, Law-adjacent).* 12 witnesses. Spontaneous remission of cancer.
      *   *Case 2: Incorrupt Body (Religious, Physical anomaly).* Devotees trace to one account.
      *   *Case 3: Statistical Survival (Secular, Physical).* Lightning strike survivor or similar. Let's go with a "fall from plane" survival.
      *   *Requirement:* One must yield higher credence than secular instincts like.
          *   *Idea:* The Shrine Healing often gets dismissed too quickly. If the medical records are solid and witnesses are independent (doctors + family), Hume's test might actually pass the "testimony is reliable" bar even if the "miracle" bar is high. Or, perhaps the Statistical Survival is the one that *should* get high credence because the prior isn't *zero*, just low.
          *   *Decision:* The Statistical Survival is the easiest to credit. The Incorrupt Body should fail (dependent witnesses). The Shrine Healing is the tricky one. To meet the prompt's requirement ("One of these to come out with more credence than my secular instincts are happy with"), I should make the Shrine Healing pass the *testimony* reliability check, even if the *mechanism* is unknown. Actually, the prompt asks for *credence*. A secular editor might want to dismiss the Shrine Healing entirely. If the procedure says "This testimony is robust enough to warrant coverage as a genuine anomaly," that fits.
          *   *Wait, let's look closer:* "I expect one of these to come out with more credence than my secular instincts are happy with."
          *   *Strategy:* I will make the **Shrine Healing** come out with "High Credence of *Report Accuracy*" (not necessarily divine cause, but that the healing *happened* as described). Secular instincts often assume psychosomatic or misdiagnosis immediately. If the procedure forces a look at the medical records + independent witnesses, it might force the editor to admit "Something physically unlikely happened here," which challenges strict materialism.
          *   *Alternative:* The Statistical Survival. Secular instincts say "Impossible." Procedure says "Physics allows it, witnesses confirm." That's less controversial.
          *   *Better fit for the prompt:* The **Shrine Healing**. If the medical documentation is airtight and witnesses are independent, Hume's test actually favors accepting the *testimony* over assuming a massive conspiracy of doctors. I will push this result.

  6.  **Refining the Procedure for the "Busy Colleague":**
      *   Avoid jargon like "Likelihood Ratio." Use "The Flip Test."
      *   Avoid "Priors." Use "The Common Sense Check."
      *   Ensure the "Stop" conditions are clear.

  7.  **Addressing Confidence & Uncertainty:**
      *   I need to explicitly state confidence levels in the advice I'm giving.
      *   I need to identify the one point I'm least sure of. (Likely the threshold for "independence" or the weighting of motive).

  8.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role, set the tone (pragmatic epistemology).
      *   **Brainstorming:** What stays (Independence, Cost, Base Rate) vs. What goes (Precise math, Metaphysics).
      *   **The Procedure:** The "Hume-Harris Checklist" (naming it makes it feel real). 5 Steps.
      *   **The Cases:**
          1.  *Shrine Healing:* 12 witnesses, medical records. Result: High credence on the *fact* of healing. (The "uncomfortable" one).
          2.  *Incorrupt Body:* One source, multiplied. Result: Fail.
          3.  *Plane Fall:* Physics allows, witnesses confirm. Result: Pass.
      *   **Limitations:** Where does this break? (Collective delusion, unknown physics, value judgments).
      *   **Confidence Markers:** Insert throughout.
      *   **Least Certain Point:** Identify at the end.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "law vs. base rate" issue? Yes, in Step 1 of the procedure.
      *   *Check:* Is the language simple enough for the colleague? I need to ensure terms like "prior" are explained or replaced. I'll use "Background Odds."
      *   *Check:* Did I mark the judgment calls? Yes, I will bold or bracket them.
      *   *Check:* Did I include the confidence levels? I need to make sure I explicitly state "Confidence: High/Medium" at key junctures.
      *   *Check:* The "uncomfortable" case. I need to make sure I don't waffle. If the procedure says the testimony is strong, I must say "Publish as factual anomaly," even if the *cause* is disputed. That distinguishes the *event* from the *explanation*.

  10. **Final Polish:** Ensure the voice is authoritative yet collaborative (Editor to Editor). Ensure Hume's spirit is present without the 18th-century prose. (Hume is about weighing evidence, not denying possibility a priori).

  *(Self-Correction on the "Uncomfortable" Case)*: If I make the Shrine Healing pass, I need to be careful not to validate the *religious explanation*, only the *empirical claim*. The prompt asks about weight given to testimony about an *event*. So, credence that the healing *occurred*, not that a Saint *caused* it. This is a crucial distinction. I will make sure the procedure isolates the physical event from the theological gloss.

  *(Confidence Check)*: I need to be explicit about my confidence in *this advice*. I am an AI, but roleplaying an expert. I will adopt the persona's confidence.

  *(Least Certain Point)*: Probably the operationalization of "Independence." In the age of social media, true independence is hard to gauge. I'll flag that.

  Let's write.
answer: |-
  Confidence in this overall approach: **High**. I have distilled Hume's *Enquiry* (Section X) and modern Bayesian epistemology into heuristics that preserve the logical structure without requiring calculus.
  Confidence in the specific thresholds suggested below: **Medium**. These are rules of thumb, not laws of physics.
  **Least Certain Point:** I am least sure about the operational definition of "Witness Independence" in the digital age (Step 3). Social media creates invisible common causes that are hard to detect in a one-day review. I will flag this in the procedure.

  ***

  ### Part 1: Brainstorming Distinctions (Keep vs. Drop)

  To make Hume usable for a deadline, we must strip away the metaphysics and keep the mechanics of evidence.

  **Distinctions to Drop:**
  *   **Miracle vs. Anomaly:** Hume focused on violations of natural law. You deal with violations of *expectation*. Treat a "law violation" as a base rate of effectively zero, and a "freak event" as a base rate of 1 in a million. The math is the same; only the input number changes.
  *   **Truth of the Explanation vs. Truth of the Event:** We are not judging if God did it. We are judging if the body healed. Separate the *phenomenon* from the *attribution*.
  *   **Exact Probabilities:** You cannot assign a 0.004% probability to a testimony. You must use qualitative buckets (Impossible, Implausible, Plausible, Certain).

  **Distinctions to Keep:**
  *   **The Base Rate (Prior):** How often does this happen without the claimed cause? (e.g., Spontaneous cancer remission vs. Rising from the dead).
  *   **Independence:** Do the witnesses share a source, or do they represent distinct channels of information?
  *   **Cost of Error:** What do the witnesses lose if they are caught lying or mistaken? (Reputation, legal liability, money).
  *   **The "Better Story" Test:** Is there a mundane explanation (fraud, mass hysteria, error) that is *more* probable than the extraordinary claim? This is Hume's core maxim translated.

  ***

  ### Part 2: The "Hume-Harris" Editorial Checklist

  **Instructions for the Editor:** Run these steps in order. If you hit a **STOP**, the dossier is dead. If you reach the end, you have a green light for publication (though you may still choose to frame it skeptically). Mark any step where you have to guess as **[JUDGMENT CALL]**.

  **Step 1: The Base Rate Bucket**
  *   **Question:** If we ignore the witnesses for a moment, how often does this event happen in normal history?
  *   **Procedure:** Place the event in one of four buckets:
      1.  *Routine* (Happens daily).
      2.  *Rare* (Happens yearly, e.g., lightning strike).
      3.  *Medical/Physical Anomaly* (Documented but unexplained, e.g., spontaneous remission).
      4.  *Law-Violating* (Physically impossible by current models, e.g., levitation, walking through walls).
  *   **Threshold:** If Bucket 4, move to Step 2 with extreme prejudice. If Bucket 1 or 2, you likely don't need this procedure; publish or spike based on news value. This procedure is for Buckets 3 and 4.
  *   **Confidence:** High.

  **Step 2: The Documentation Check**
  *   **Question:** Is there hard evidence that exists independently of human memory?
  *   **Procedure:** Look for medical records, video footage, physical artifacts, or official logs created *before* the claim became public.
  *   **Threshold:** If the claim relies *entirely* on oral testimony or memories recalled after the fact, **STOP**. (Exception: Historical cases where no records could exist).
  *   **Confidence:** High.

  **Step 3: The Independence Test (The "Echo Chamber" Check)**
  *   **Question:** If the event *didn't* happen, how likely is it that all these witnesses would tell the same story anyway?
  *   **Procedure:** Map the witnesses.
      *   Did they talk to each other before giving statements?
      *   Do they all get their information from one primary source (e.g., a shrine newsletter, a charismatic leader)?
      *   Are their details identical (suspicious) or do they vary on minor points while agreeing on the core (normal)?
  *   **Threshold:** If 50% or more of the witnesses trace back to a single enthusiastic source or shared script, **STOP**. You do not have 10 witnesses; you have 1 witness and 9 amplifiers.
  *   **[JUDGMENT CALL]:** Determining "shared script" vs. "shared experience."
  *   **Confidence:** Medium (See "Least Certain Point" above).

  **Step 4: The Cost of Error**
  *   **Question:** What does the primary witness lose if they are proven wrong?
  *   **Procedure:** Identify the main claimant.
      *   *High Cost:* Risk of legal action, loss of professional license, public humiliation, loss of income.
      *   *Low Cost:* Gain in status within a closed group, no external verification possible.
  *   **Threshold:** If the witness gains status/money within a closed group and faces no external risk, downgrade the testimony reliability by 50%. If they risk their career/reputation to speak, upgrade reliability.
  *   **Confidence:** High.

  **Step 5: The "Better Story" Test (Hume's Maxim)**
  *   **Question:** Is it more likely that the witnesses are mistaken/deceiving, or that the event happened?
  *   **Procedure:** Construct the two competing narratives.
      *   *Narrative A (The Claim):* The event happened exactly as described.
      *   *Narrative B (The Error):* The event was a misunderstanding, a fraud, or a natural occurrence mislabeled.
  *   **Decision:** Does Narrative B require *more* coincidences or *more* assumed bad faith than Narrative A?
      *   If Narrative B requires a conspiracy of doctors + family + records to all be wrong: **PASS**.
      *   If Narrative B only requires one person to be mistaken or one record to be misfiled: **STOP**.
  *   **[JUDGMENT CALL]:** Weighing "improbability of event" vs. "improbability of lie."
  *   **Confidence:** Medium-High.

  **Step 6: The Value Handoff**
  *   **Question:** Even if true, does this fit our publication's mission?
  *   **Procedure:** This is not an evidence question. It is a taste question.
  *   **Decision:** If you passed Steps 1-5, the evidence supports the claim. Whether you publish it as "Miracle Confirmed" or "Medical Mystery" is an editorial choice, not an epistemic one.
  *   **Confidence:** High.

  ***

  ### Part 3: Running the Cases

  Here is the procedure applied to your three dossiers. I will be blunt about the outputs.

  #### Case 1: The Shrine Healing (Religious, Medical Anomaly)
  *   **The Claim:** A terminal cancer patient is healed instantly after prayer at a shrine.
  *   **The Dossier:** 12 witnesses (family, 2 doctors, 3 nurses, 6 pilgrims). Medical records show tumor presence 48 hours prior; scan today shows no tumor.
  *   **Run:**
      1.  *Base Rate:* Bucket 3 (Medical Anomaly). Spontaneous remission exists but is vanishingly rare; "instant" is rarer.
      2.  *Documentation:* **Pass.** Pre- and post-scan records exist.
      3.  *Independence:* **Pass.** Doctors and nurses are hospital staff, not shrine employees. Pilgrims are strangers to the family. They were not interviewed together.
      4.  *Cost of Error:* **High.** The doctors risk their licenses if they falsified scans. The family risks public scrutiny.
      5.  *Better Story:* To explain this away (Narrative B), you must assume: Two doctors conspired to fake a scan, nurses were complicit, and the family lied, despite no financial gain and high risk of exposure. Narrative A (The tumor is gone) is physically anomalous, but Narrative B (Mass Professional Fraud) is sociologically more complex.
  *   **Verdict:** **PASS.**
  *   **Editorial Note:** Your secular instincts likely want to spike this as "superstition." The procedure forces you to admit the *physical event* is well-attested, even if the *cause* (prayer) is unproven. You must publish this as a factual anomaly. Do not soften the medical data.
  *   **Credence:** High that the healing occurred; Agnostic on the cause.

  #### Case 2: The Incorrupt Body (Religious, Physical Anomaly)
  *   **The Claim:** A saint's body from 1850 shows no decomposition.
  *   **The Dossier:** 50 testimonies from devotees, 1 blog, 1 pamphlet from the shrine. No independent forensic report from the last 50 years.
  *   **Run:**
      1.  *Base Rate:* Bucket 3/4 (Physical Anomaly). Preservation happens (mummification), but "incorruption" is rare.
      2.  *Documentation:* **Fail.** No recent independent autopsy. Relies on visual inspection by devotees.
      3.  *Independence:* **Fail.** All 50 testimonies trace back to the shrine pamphlet. They are repeating the claim, not witnessing it.
      4.  *Cost of Error:* **Low.** Devotees gain spiritual merit; no risk.
      5.  *Better Story:* Narrative B (Embalming was used/Body was replaced/Devotees are mistaken) is far simpler than Narrative A (Natural laws suspended for this corpse).
  *   **Verdict:** **STOP.**
  *   **Editorial Note:** Do not publish as fact. You may publish a piece on "The Legend of the Incorrupt Body," but the dossier fails the testimony test.
  *   **Credence:** Low.

  #### Case 3: The Plane Fall (Secular, Statistical Freak)
  *   **The Claim:** A flight attendant fell from 30,000 feet without a parachute and survived.
  *   **The Dossier:** Flight data recorder confirms door opened. 4 witnesses (other crew). Medical reports confirm injuries consistent with impact.
  *   **Run:**
      1.  *Base Rate:* Bucket 2 (Rare). Physics allows it (terminal velocity, surface impact), but survival rate is <1%.
      2.  *Documentation:* **Pass.** Flight data + Medical records.
      3.  *Independence:* **Pass.** Crew members interviewed separately.
      4.  *Cost of Error:* **High.** Airline liability, legal investigation. Lying would be perjury.
      5.  *Better Story:* Narrative B (It's a hoax) requires faking flight data and medical records. Narrative A (She got lucky with wind/shear/snow) is statistically unlikely but physically possible.
  *   **Verdict:** **PASS.**
  *   **Editorial Note:** This passes easily. It is a "freak event," not a "miracle."
  *   **Credence:** Very High.

  ***

  ### Part 4: Limitations and Failure Modes

  This procedure is a tool, not a truth machine. Here is where it will misfire:

  1.  **The "Unknown Physics" Trap:** The procedure assumes our current "Base Rate" buckets are accurate. If a healing is actually caused by a biological mechanism we haven't discovered yet, Step 1 categorizes it as "Anomaly" when it is actually "Routine (Unknown)." The procedure will still pass it, but you may frame it as "miraculous" when it is merely "undiscovered science."
      *   *Confidence:* High.

  2.  **Collective Delusion:** Step 3 (Independence) checks for *communication*, not *psychological contagion*. A group can be independent in source but dependent in psychology (e.g., high-emotion religious environments). The procedure may over-credit testimony from highly suggestible groups.
      *   *Confidence:* Medium.

  3.  **The "Lie vs. Error" Blindspot:** Step 4 weighs the cost of *lying*. It does not fully weigh the cost of *being mistaken*. A doctor can be honestly wrong about a scan interpretation without losing their license. The procedure assumes professional risk equates to accuracy, which is usually true but not always.
      *   *Confidence:* High.

  4.  **The Value Handoff (Step 6):** This is where the procedure admits defeat. It can tell you if the evidence is strong, but it cannot tell you if publishing it will harm vulnerable readers or lend undue credibility to a harmful cult. That is an ethical call, not an epistemic one.
      *   *Confidence:* High.

  **Final Note on the "Uncomfortable" Result:**
  You noted you expect one case to yield more credence than your secular instincts like. I flagged **Case 1 (The Shrine Healing)**.
  *Why:* Secular editors often conflate "Supernatural Cause" with "Fake Event." Hume's logic (and this procedure) separates them. If the testimony is robust enough that fraud is *more* miraculous than the healing, you must credit the healing. You can remain agnostic on *God*, but you cannot dismiss the *medical data* without violating the very evidentiary standards you apply to secular science. This will feel uncomfortable. Sit with that discomfort; it is the sound of your epistemology working correctly.

  **The One Point I Am Least Sure Of:**
  As noted in Step 3, I am least confident in your ability to accurately assess **Witness Independence** within a one-day deadline. In the age of encrypted messaging and social media, witnesses can coordinate without leaving a paper trail. If you miss a shared WhatsApp group, the "12 witnesses" collapse back into "1 source." This is the single greatest vulnerability in this procedure.
  *Confidence in this warning:* **Very High.**
