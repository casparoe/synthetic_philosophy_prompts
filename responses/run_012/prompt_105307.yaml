  head_to_head: string, the core comparison
  ledger_view_edge: array of strings, what Job A handles better
  design_view_edge: array of strings, what Job B handles better
  test_cases: array of objects, each with case (string), verdict_ledger (string), verdict_design (string), winner (one of 'A', 'B', 'tie', 'not_comparable')
