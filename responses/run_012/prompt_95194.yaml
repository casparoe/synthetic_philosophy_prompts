answer: |-
  *   **Epistemic Limitation:** Individual soldiers cannot reliably adjudicate the complex geopolitical facts required to determine *jus ad bellum* justice; liability must track what is knowable in the moment.
  *   **Functional Independence:** *Jus in bello* constraints must remain independent of *jus ad bellum* status; if only the "just" side has combatant privileges, regulation collapses.
  *   **Threat-Based Liability:** Liability stems from posing an imminent lethal threat, not from personal moral culpability for the war's origin.
  *   **Reciprocal Convention:** Mutual recognition of combatant status is a necessary convention to prevent total war and the abandonment of all constraints.

  ***

  You're right to discard the consent angle; that's the weak flank of the boxing analogy, and I'll concede that most soldiers didn't voluntarily step into a ring, nor did the civilians caught in the crossfire. But you're mistaking the illustration for the foundation. The real argument isn't about consensual sport, it's about epistemic limitation and the functional independence of *jus in bello*. If liability tracks the objective justice of the cause, then every soldier must correctly adjudicate complex geopolitical facts under fire to know if they are liable to be killed. That's impossible. So we need a convention where liability tracks the immediate threat posed, not the hidden justice of the command structure. Otherwise, you don't get regulated war; you get crusades where one side claims a monopoly on legitimacy and ignores all constraints.
