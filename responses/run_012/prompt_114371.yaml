answer: |-
  Here is the carving you asked for.

  ### The Core Distinction: Process vs. Permission

  Your three cases are **not** the same phenomenon. They split into two distinct categories.

  **Cases (1) and (3) are the same problem.**
  This is a **State Transition** issue. It is a race condition between the *old* rule set and the *new* rule set. The confusion arises from ambiguity about *when* the new code compiles.
  *   In (1), the ambiguity is about the *threshold* (a parameter).
  *   In (3), the ambiguity is about the *validator* (the function itself).
  *   **Engineering equivalent:** You are trying to hot-reload a validation library while a request is currently being processed. Which version of the library validates the request that changes the library?

  **Case (2) is a different problem.**
  This is a **Logical Constraint** issue. It is not about *when* the rule applies, but *what* the rule forbids.
  *   In (2), the rule explicitly defines a state ("repealed") as unreachable.
  *   **Engineering equivalent:** A database constraint `NOT NULL` or a permission flag `immutable=true`. It doesn't matter *when* you try to change it; the schema rejects the transaction.

  ### The Omnipotence Paradox Analogy
  You asked if this is just "Can God make a stone so heavy he can't lift it?" in a suit.
  **Verdict:** Close cousin, but different mechanics.

  *   **Theological Paradox:** About **Capacity**. (Is there a limit to power?)
  *   **Your Rule Paradox:** About **Jurisdiction**. (Which rule has authority over this specific action?)

  The legal/rulebook version is actually *solvable* in a way the theological one isn't, because legal systems have time and hierarchy. The theological paradox assumes a timeless, singular agent. Your game has discrete turns and a text history.

  ### The "Standard Way Out" (t vs t+1)
  You asked if separating the vote time ($t$) from the effect time ($t+1$) dissolves the circle.

  *   **For Cases (1) and (3): Yes.**
      If you codify that "Rules in force at $t$ judge the vote; changes apply at $t+1$," the circle breaks.
      *   In (1): The 2/3 rule (at $t$) judges the 55% vote. It fails. The 50% rule never activates.
      *   In (3): The current meta-rule (at $t$) judges the attempt to change it. If the current meta-rule allows self-amendment, it passes. If not, it fails.
      *   **Does it dissolve the anxiety?** Logically, yes. Practically, no. In Nomic-style games, players will argue that the *intent* of the motion was to apply immediately. The paradox survives as a social dispute, even if the logic is fixed.

  *   **For Case (2): No.**
      Temporal separation doesn't help. If the rule at $t$ says "This cannot be repealed," then the action at $t$ to repeal it is invalid. The system is locked. The only way out is a "Revolution" rule (a rule outside the system) or admitting the rule was a lie.

  ### Confidence Levels

  1.  **Cases (1) and (3) are the same phenomenon:** **90% Confident.**
      Both rely on self-referential validation logic. The only difference is granularity (threshold vs. jurisdiction).
  2.  **Case (2) is a different phenomenon:** **95% Confident.**
      This is a hard constraint, not a procedural loop. It belongs to a different logical class (consistency vs. validity).
  3.  **The "t vs t+1" solution fully resolves the paradox:** **70% Confident.**
      It resolves the *logic*, but in a game designed to exploit ambiguity, it often just shifts the argument to "interpretation of intent."

  ### Least Sure Identification
  I am least sure about the hard boundary between **(1) and (3)**.
  While I classify them as the same "State Transition" problem, (3) is *more* fundamental. (1) is changing a variable used by the validator; (3) is changing the validator itself. In some formal systems, changing the validator creates an infinite regress that changing a variable does not. However, for your purpose (sleep and game strategy), they behave identically.

  ### The Table

  | Case | Nearest Established Concept | What that concept actually covers | Where it fails to fit my case | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **(1) Threshold Change** | **Self-Application Paradox** (Legal Theory) | Situations where a law attempts to validate its own enactment. | Usually assumes a hierarchy (Constitution > Law). Your game has a flat hierarchy where rules eat each other. | **Same Thing** (as Case 3) |
  | **(2) Unrepealable Clause** | **Entrenchment** (Constitutional Law) | Clauses designed to be immune to standard amendment procedures. | Legal entrenchment usually relies on an external court or higher law to enforce. Your game has no external enforcer. | **Different Problem** |
  | **(3) Meta-Rule Trap** | **Infinite Regress** (Epistemology/Logic) | A rule that requires a higher rule to validate it, ad infinitum. | Your game stops the regress by forcing a vote. The paradox is in the *content* of the vote, not the need for one. | **Same Thing** (as Case 1) |
  | **Omnipotence Paradox** | **Paradox of Self-Limitation** (Theology/Logic) | Whether a sovereign power can limit its own power. | Theology assumes timelessness. Your game is discrete/sequential. Time ($t$ vs $t+1$) solves your version, not the theological one. | **Close Cousin** |

  **Summary for your sleep:**
  Cases 1 and 3 are bugs in your **version control** (which rule is active?). Case 2 is a bug in your **schema design** (immutable fields). Fix the versioning policy (t vs t+1) to stop the headaches on 1 and 3. Accept that 2 is a feature that breaks the game until someone ignores it.
