          *   Weigh strongest arguments? Yes.
          *   Compression independent of vocabulary? Yes.
          *   Design stance middle case? Yes.
          *   Graded/pluralist realism? Yes.
          *   **Reach a verdict?** Yes (Pattern Realism with Indeterminacy).
          *   Justify against objections? Yes.

  7.  **Final Review of the Verdict:** I will argue that the compression criterion does *not* collapse into instrumentalism, but it requires us to abandon "intrinsic" realism in favor of "relational" realism. The patterns are real features of the interaction between the system and the interpreter, constrained by the system's design. This saves realism from the charge of being merely "useful fiction" because the utility is grounded in objective causal structures, even if the semantic description is underdetermined.

  *(Self-Correction)*: I need to make sure I don't just paraphrase Dennett. I need to engage the *controversy*. The prompt asks if this makes patterns artifacts of the vocabulary. I need to argue *why* it doesn't (or does). I will argue it doesn't, provided we understand "real" correctly.

