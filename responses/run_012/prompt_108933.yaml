answer: |-
  ### Desiderata for a Theory of the Value of Information

  An adequate account of the value of information (VoI) for a decision-maker must navigate the gap between formal decision theory and the phenomenology of knowing. The following requirements distinguish the constitutive constraints (those without which the theory ceases to be a theory of *decision-theoretic* VoI) from the optional extensions (those required only for robustness in non-ideal conditions).

  #### I. Constitutive Requirements
  *These conditions are necessary for the theory to count as a standard account of instrumental information value.*

  **1. The Goodian Constraint (Ex-Ante Non-Negativity)**
  *   **Requirement:** The theory must reproduce the result that costless information, which does not alter preferences, never lowers expected utility prior to acquisition.
  *   **Case:** This is the baseline of rational choice (Good’s Theorem, 1967). If an agent could freely discard information after receiving it, they could always replicate their pre-information state. Therefore, having the *option* to know must be at least as valuable as remaining ignorant. A theory that predicts rational agents should systematically reject free, actionable information fails as a normative guide.

  **2. The Ex-Post Welfare Constraint (Realized Harm)**
  *   **Requirement:** The theory must explain why information can leave an agent worse off *after* it arrives, even if it was rational to acquire.
  *   **Case:** Consider a patient with an untreatable condition. Acquiring the prognosis is instrumentally useless (action cannot change), yet the knowledge itself diminishes their welfare (anxiety, loss of hope). The theory must account for this ex-post loss without contradicting the ex-ante rationality of the acquisition (e.g., via hope or duty) or the ex-ante non-negativity constraint.

  **3. The Temporal Distinction (Ex-Ante vs. Ex-Post)**
  *   **Requirement:** The theory must rigorously distinguish the *expected* value of information (the value of the opportunity to know) from the *realized* value of the information obtained (the value of the specific content revealed).
  *   **Case:** Buying a lottery ticket has a negative expected value, but winning makes you better off. Similarly, a medical test may have positive expected value (ruling out disease), but a positive result makes you worse off. Conflating the value of the *test* with the value of the *result* renders cost-benefit analysis impossible.

  **4. The Net Value Constraint (Cost Sensitivity)**
  *   **Requirement:** The theory must specify conditions under which information is worth its acquisition cost.
  *   **Case:** Information is rarely free. A theory that values information only by its content, ignoring the price of measurement, time, or attention, cannot guide real-world inquiry. The gross value of information must exceed the marginal cost of its production for acquisition to be rational.

  **5. The Relativity Constraint (Agent-Specificity)**
  *   **Requirement:** The theory must fix the value of information as relative to the agent’s specific utility function and action space, not as a property belonging to anyone who could act on it.
  *   **Case:** A stock tip is valuable to an investor with capital but valueless to someone without it. A theory that treats information value as objective (like mass or charge) fails to capture why the same signal dictates action for one agent and indifference for another.

  **6. The Instrumentality Constraint (Non-Collapse)**
  *   **Requirement:** The theory must not collapse the value of information into the value of true belief.
  *   **Case:** Epistemic utility theories often value truth for its own sake. Decision-theoretic VoI must treat information as a tool for action. Knowing a trivial truth (e.g., the number of grains of sand on a beach) has high veritistic value but near-zero decision value. A theory that equates the two cannot explain why agents rationally remain ignorant of truths that do not aid their goals.

  #### II. Extensional Requirements (Robustness)
  *These conditions are optional for a baseline theory but required for the theory to hold when standard idealizations fail.*

  **7. The Interpretability Condition**
  *   **Requirement:** The theory must account for information the agent cannot interpret or process.
  *   **Case:** If a physicist hands a layperson a sheet of quantum equations, the layperson has received data but no usable information. Under standard assumptions, information is always interpretable. A robust theory must handle bounded rationality where data may induce confusion or error rather than clarity.

  **8. The Preference Stability Condition**
  *   **Requirement:** The theory must determine how to value information that shifts the agent’s preferences.
  *   **Case:** Learning about the suffering involved in meat production may change an agent from omnivore to vegan. Standard VoI assumes a fixed utility function to measure improvement. If the metric itself changes upon information receipt, the comparison between "before" and "after" becomes ill-defined.

  **9. The Psychological Integration Condition**
  *   **Requirement:** The theory must integrate non-instrumental psychological states (dread, curiosity, anxiety) into the utility calculation without violating the Instrumentality Constraint.
  *   **Case:** As in the patient prognosis case, knowledge affects welfare directly. The theory must decide whether "peace of mind" is a goal to be maximized (instrumental) or a constituent of welfare (intrinsic), as this choice alters the valuation of information avoidance.

  ***

  ### Classification and Critical Analysis

  **Constitutive vs. Optional**
  Requirements **1 through 6** are **Constitutive**. Any theory that fails the Goodian Constraint (1) ceases to be a theory of rational information acquisition; any that fails the Instrumentality Constraint (6) becomes a theory of epistemic value rather than decision value. Requirements **7 through 9** are **Optional** (Extensional); they are necessary only for a theory aiming to describe bounded, psychological agents rather than ideal Bayesian reasoners.

  **The Single Most Exclusionary Requirement**
  The **Instrumentality Constraint (6)** excludes the most candidates.
  *   **Reasoning:** This requirement immediately disqualifies the entire family of *Veritistic Epistemology* (e.g., Alvin Goldman, Richard Joyce) and *Epistemic Utility Theory*, which posit that true belief has intrinsic value independent of action. It also excludes semantic information theories (e.g., Luciano Floridi) that treat information value as objective rather than decision-relative. It forces the theory into the narrower lane of pragmatic decision theory.

  **The Incompatible Pair**
  There is a fundamental tension between **The Goodian Constraint (1)** and **The Preference Stability Condition (8)**.
  *   **The Conflict:** Good’s Theorem (Requirement 1) relies mathematically on the assumption that the agent’s utility function remains stable between the time of decision (to acquire info) and the time of action. The theorem proves information is valuable because it allows the agent to better satisfy their *current* preferences.
  *   **The Incompatibility:** If information changes the agent’s preferences (Requirement 8), the "before" and "after" states are incommensurable. You cannot calculate the expected utility of the information using the prior utility function if that function is the very thing being altered. To satisfy the Preference Stability Condition (by allowing preference change), you must abandon the strict mathematical proof of the Goodian Constraint. You cannot simultaneously guarantee that free information never lowers expected utility *and* allow that information can fundamentally rewrite the utility metric by which "utility" is measured. A theory must choose: either it preserves the normative force of Good’s Theorem by assuming stable preferences, or it accommodates preference transformation at the cost of the non-negativity guarantee.
