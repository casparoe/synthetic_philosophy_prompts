answer: |-
  ### I. The Reconstructed Principle

  Your current formulation ("unlikely to be made unless true") is a probabilistic heuristic, but your verdicts reveal you are actually applying a structural test regarding **constraints on fabrication**. You do not trust sources because they are "usually right"; you trust specific *contents* because the conditions of their production or transmission made falsification costly, impossible, or useless.

  I propose replacing your working formulation with **The Principle of Differential Vulnerability**.

  **Core Statement:** A historical proposition $P$ contained in a source $S$ warrants belief to the degree that the specific conditions of $P$'s generation and transmission rendered $P$ *vulnerable* to distortion or suppression, and yet $P$ survived intact.

  This principle requires four operational clauses to generate your specific verdicts:

  **Clause 1: The Constraint of Idiosyncratic Cost (Generative Vulnerability)**
  *   **Statement:** Belief is warranted if the production of $P$ incurred a specific net loss or no gain for the agent, *unless* $P$ were true.
  *   **Cases Saved:** **1** (Losing party recording concessions incurs political cost); **9** (Inventing a slave mother incurs social cost).
  *   **The Exception (Case 8):** This clause fails if the "cost" is a conventional trope. In Case 8, self-abasement is a genre requirement, not an idiosyncratic cost. The vulnerability is low because the "lie" is cheap and expected. This explains why you group 1, 8, and 9 but verdict differently on 8.

  **Clause 2: The Constraint of Independence (Transmission Vulnerability)**
  *   **Statement:** Multiple reports of $P$ increase warrant only if the transmission chains are causally independent regarding $P$.
  *   **Case Saved:** **2** (Dependent chronicles). Shared origin means the vulnerability to error is not reduced; the chain is single, not double.

  **Clause 3: The Constraint of External Anchoring (Reality Vulnerability)**
  *   **Statement:** Belief is warranted if $P$ is fixed by non-human constraints (geology, archaeology, administrative necessity) that bypass the agent's motive to distort.
  *   **Cases Saved:** **5** (Geology anchors the inundation); **7** (Archaeology anchors the titles).
  *   **Implication:** This allows you to compartmentalize a source. A forgery (Case 7) can contain true data if that data was constrained by the forger's need to mimic reality accurately to succeed, or if the data refers to hard facts the forger could not alter.

  **Clause 4: The Constraint of Systemic Expectation (Negative Vulnerability)**
  *   **Statement:** The absence of $P$ warrants belief in non-occurrence only if the record-keeping system makes the absence of $P$ more costly or unlikely than its presence.
  *   **Case Saved:** **6** (Silence in detailed records). If the system records battles, silence is "vulnerable" to correction by rivals or internal audit. If the system is sporadic, silence is not vulnerable, and thus not evidence.

  ---

  ### II. Test Cases

  Here are two cases constructed to test the limits of the Principle of Differential Vulnerability.

  **Case A: The Penitent General's Memoir (Internal Tension)**
  A general publishes memoirs twenty years after a disastrous campaign. He admits to a specific tactical blunder that caused the defeat (Content $P$).
  *   *Factor 1 (Clause 1):* Admitting fault is against self-interest (supports belief).
  *   *Factor 2 (Clause 1 Exception):* The memoir genre of this period expects "honest reflection" to rehabilitate the author's moral standing. The admission of a blunder serves a narrative of redemption (reduces vulnerability).
  *   *Factor 3 (Clause 2):* No other accounts exist.
  *   **Verdict:** The principle yields **suspension of judgment**. Clause 1 pulls toward belief (cost of reputation), but the Exception pulls toward skepticism (genre convention). Without external anchoring (Clause 3) or independence (Clause 2), the vulnerability is indeterminate. The "cost" is ambiguous.

  **Case B: The Inflated Tax Ledger (Clear Application)**
  A provincial tax ledger lists a village ($P$) and its population. We know the governor systematically inflated population figures to secure larger budget allocations from the capital. However, archaeological survey confirms a settlement of that era exists at the listed location.
  *   *Factor 1 (Clause 1):* The population number is vulnerable to distortion (motive to inflate).
  *   *Factor 2 (Clause 3):* The *existence* of the village is anchored by archaeology. The *number* is not.
  *   **Verdict:** The principle warrants belief in the **existence** of the village (anchored by archaeology and the administrative necessity of *some* entity to tax), but rejects the **population figure** (high vulnerability to specific motivational distortion). This mirrors your verdict on Case 7.

  ---

  ### III. The Honest Accounting: What Must Be Surrendered

  You asked me to be blunt about which verdicts the principle cannot save, prioritizing the retention of 1, 2, 6, and 9.

  **The Sacrifice: Case 3 (The Flawed Chronicler)**
  *   *The Verdict:* You trust the chronicler on the army route despite his wrong dates and forged charter.
  *   *The Conflict:* The Principle of Differential Vulnerability cannot easily save this without weakening into a general "Principle of Competence."
      *   **Clause 1** fails: There is no obvious cost to lying about a route.
      *   **Clause 2** fails: It is a single source.
      *   **Clause 3** fails: You cite no external anchor (archaeology/geology) for the route.
      *   **Clause 4** fails: It is positive testimony, not silence.
  *   *Why Surrender It?* Cases 1, 2, 6, and 9 rely on **structural constraints** (interest, independence, archive norms). Case 3 relies on **psychological presumption** (a liar tells truths when lying serves no purpose). This is a weaker epistemic foundation. A forger capable of forging a charter is capable of fabricating a route to glorify a campaign. Unless you can argue that the route was "common knowledge" (which invokes Clause 3 via social anchoring) or that the route details are "useless" to the forgery (which is hard to prove), Case 3 is an intuition pump, not a structural warrant.
  *   *Cost:* Surrendering 3 forces you to demand either external anchoring (archaeology of the march) or independent corroboration for the route. It raises your evidentiary bar, which is consistent with your skepticism in Cases 2 and 8.

  **The Status of Case 4 (Hostile Annalist)**
  *   This is saved by Clause 1. Hostility creates a motive to fabricate atrocities. The content is not vulnerable to truth; it is vulnerable to bias.

  **The Status of Case 5 (Oral/Geological)**
  *   This is saved by Clause 3. The geology anchors the inundation. The migration narrative lacks that anchor and is vulnerable to myth-making.

  ---

  ### IV. The Oscillating Case: Oral Genealogy vs. Written King-List

  **The Case:** An oral genealogy (8 generations, recited formally) agrees with a written king-list at three points but diverges elsewhere. The community treats the oral tradition as a record of descent.

  **Application of the Principle:**

  1.  **Generative Vulnerability (Clause 1):**
      *   *Written List:* High vulnerability to political distortion (legitimizing the current ruler).
      *   *Oral Recitation:* High vulnerability to structural functionalism (altering links to maintain clan prestige or resolve succession disputes).
      *   *Result:* Neither source has a strong "idiosyncratic cost" preventing fabrication of the divergent links.

  2.  **Transmission Vulnerability (Clause 2):**
      *   They are not independent. Oral and written traditions in such contexts often feed each other. However, if they diverge, it suggests a break in transmission or a deliberate alteration in one chain.

  3.  **External Anchoring (Clause 3):**
      *   The **three points of agreement** act as a weak anchor. It is unlikely two distinct transmission channels would fabricate the *same* three names independently unless those names were fixed points (e.g., famous founders).
      *   The **divergent points** lack anchoring.

  4.  **Genre Expectation (Clause 1 Exception):**
      *   You note the community treats this as "descent rather than events." In many historiographical contexts, "descent" is a claim to *status*, not biology. If the function is status, the vulnerability to distortion is maximal.

  **Verdict:**
  *   **Accept:** The three points of agreement. The convergence reduces the probability of independent fabrication (a weak form of Clause 2).
  *   **Reject:** The specific claims of divergence. There is no constraint (cost, anchor, or independence) protecting these links from distortion.
  *   **Reclassify:** Treat the "record of descent" claim not as a historical report warranting belief, but as a **performative speech act**. The oral tradition warrants belief *that the community believes they are descended*, not *that they are descended*.
  *   **Reasoning:** To believe the divergent links would violate Clause 1 (no cost to fabrication) and Clause 3 (no external anchor). To believe the whole tradition because it is "formal" violates the lesson of Case 8 (convention/genre does not guarantee truth).

  ### V. Settled vs. Contested

  *   **Settled:** The move from "source reliability" to "content-specific reliability" (Cases 3, 7) is widely accepted in critical historiography. The rejection of dependent corroboration (Case 2) is methodological orthodoxy.
  *   **Contested:**
      1.  **The Status of Silence (Case 6):** Philosophers of history disagree on whether silence can ever be positive evidence. Your principle accepts it *only* under systemic constraint. This is defensible but contested by those who view absence of evidence strictly as distinct from evidence of absence.
      2.  **The "Against Interest" Criterion (Cases 1, 8, 9):** There is ongoing debate about whether "against interest" is a reliable marker of truth or merely a marker of *different* biases (e.g., signaling virtue through humility). My reconstruction saves this by adding the "Idiosyncratic vs. Conventional" distinction (saving 1/9, rejecting 8), which resolves the tension but relies on your ability to accurately identify "convention."
      3.  **Oral Tradition (Oscillating Case):** The weight given to "formal recitation" as a constraint is heavily contested. Anthropologists often argue formalization *increases* fidelity; historians often argue it *increases* fossilization of error. My verdict sides with the historians (requires external anchor), but this is a disciplinary friction point.

