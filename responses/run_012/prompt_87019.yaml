answer: |-
  The established name for this family is **Epistemic Circularity**, and more specifically, the defective variety is known as **Bootstrapping** (or a **Track-Record Argument**).

  However, because you sense a difference in "shape" between your three cases, and because the literature distinguishes between the *structure* of the reasoning and the *status* of the belief, a single label requires unpacking. Here is the division you are looking for, the unity that binds them, and an analysis of where the defect actually lies.

  ### 1. The Name and The Unity

  The neutral, structural name for all three cases is **Rule-Circularity**.

  In standard "premise-circularity" (begging the question), the conclusion is explicitly stated as one of the premises (e.g., "God exists because the Bible says so, and the Bible is true because God wrote it"). In your three cases, the conclusion is not a premise. Rather, the *rule of inference* or the *source of belief* used to generate the premises is the very same rule or source being evaluated.

  *   **The Rule:** "Trust Faculty F."
  *   **The Premises:** Beliefs generated by Faculty F.
  *   **The Conclusion:** Faculty F is reliable.

  What makes (a), (b), and (c) one thing is that in all three, the subject lacks **independent access** to the truth of the premises. To know that the premise "I judged him correctly" is true, the man in (a) must already trust his judgment. To know "There are no errors" in (b), the woman must trust her proofreading. To know "He is plainly there" in (c), the man must trust his senses. They are all attempting to pull themselves up by their own epistemic bootstraps.

  ### 2. The Division: Bootstrapping vs. Dogmatism

  While they share the structure of Rule-Circularity, contemporary epistemology divides them based on whether the support is **inductive** or **immediate**. This explains why they feel different to you.

  **Group 1: Inductive Bootstrapping (Cases a and b)**
  These are the clearest cases of the defect known as **Bootstrapping** (a term popularized by Jonathan Vogel).
  *   **Structure:** The subject infers the reliability of a source from a series of outputs from that source.
  *   **Why they feel defective:** They generate what Stewart Cohen calls **"Easy Knowledge."** In case (b), the woman can prove her proofreading is perfect simply by reading the document once. She gains a high-order justification (my method is reliable) from a low-order belief (this text has no errors) without any independent check. This feels like cheating because it allows reliability to be established *ex nihilo*.
  *   **The difference between (a) and (b):** Case (a) feels slightly more robust because it relies on a *track record* over time, which mimics standard inductive reasoning. Case (b) is a single-instance loop, which feels tighter and more vicious. However, structurally, they are the same: both assume the truth of the outputs to prove the reliability of the producer.

  **Group 2: Immediate Epistemic Circularity (Case c)**
  *   **Structure:** The subject appeals to the deliverances of a faculty to defeat a doubt about that faculty, without an inductive step.
  *   **Name:** This is often called a **Moorean Shift** (after G.E. Moore's "Here is a hand" argument) or **Dogmatism** (in the technical sense used by Jim Pryor).
  *   **Why it feels different:** There is no argumentative "piling up." It is an immediate claim to warrant. The man isn't arguing *that* his senses are reliable; he is asserting that the specific belief ("he is there") is more certain than the skeptical hypothesis ("I am dreaming").
  *   **Is it the odd one out?** Yes. In (a) and (b), the subject constructs an *argument* for reliability. In (c), the subject asserts a *foundational belief* that entails reliability. Many philosophers treat (c) as potentially innocent (foundationalism), whereas (a) and (b) are almost universally treated as defective (coherentism/bootstrapping).

  ### 3. The Location of the Defect

  You suspect the defect lies "only in the person's ability to answer a challenge," rather than in the belief itself. You are aligning with the **Externalist** position, most notably defended by **William Alston**.

  Here is the precise division regarding the defect:

  **A. The Dialectical Defect (Your Suspicion)**
  *   **View:** The belief itself can be justified, but the *argument* cannot persuade a skeptic.
  *   **Reasoning:** If my vision is actually reliable, then my belief "I see a tree" is justified. The fact that I use my vision to prove my vision is reliable doesn't change the fact that my vision works. However, if you doubt my vision, I cannot use my vision to convince *you*. The circularity makes the *argument* rhetorically useless, not the *belief* false or unjustified.
  *   **Application:** This applies well to (a) and (c). If the man *is* a good judge of character, his belief that he is one is true and warranted, even if his reasoning is circular. He just can't prove it to a skeptic.

  **B. The Constitutive Defect (The Internalist Objection)**
  *   **View:** The belief itself lacks justification because the circularity prevents the acquisition of warrant.
  *   **Reasoning:** Justification requires that you have a reason to trust the source *before* you trust the output. If you need the output to trust the source, you never actually get justification. This is the "Easy Knowledge" objection.
  *   **Application:** This applies most strongly to (b). It seems absurd to claim the woman is justified in believing her proofreading is perfect based on a single read-through. Here, the circularity seems to infect the belief itself, not just the argument.

  ### 4. Summary and Classification

  To satisfy your request for a correct division:

  1.  **Family Name:** **Rule-Circular Justification**.
  2.  **The Defective Subclass:** **Bootstrapping** (specifically cases **a** and **b**).
  3.  **The Potentially Innocent Subclass:** **Immediate Warrant / Dogmatism** (case **c**).

  **Why the division?**
  Cases (a) and (b) attempt to *infer* reliability from specific instances. This requires the instances to be known *independently* of the reliability claim to function as evidence. Since they are not known independently, the inference is vicious.
  Case (c) does not infer reliability; it treats the perceptual belief as **basic**. It claims the belief is justified *without* needing a prior argument for reliability.

  **Regarding the Defect:**
  In the defective cases (a and b), the defect is **Constitutive** regarding the *argument* (it proves nothing) but arguably only **Dialectical** regarding the *belief* (the belief might still be true and warranted if the faculty is actually reliable).

  However, if you force a choice on whether the *belief* is defective:
  *   In **(b)**, the belief ("I am a reliable proofreader") is defective because the evidence is too thin to support the generalization, circular or not.
  *   In **(a)**, the belief is less defective, but the *justification* is circular.
  *   In **(c)**, the belief is likely **innocent**. The defect is purely in the *dialectical situation* (trying to convince a skeptic).

  ### 5. A Coinage for the Residue

  If you find "Bootstrapping" too tied to the specific inductive cases (a and b) and want a term that captures the *structural* move across all three without immediately condemning them, I propose the term:

  **Endogenous Validation**

  *   **Definition:** The attempt to establish the validity of a cognitive source S using only data generated by S, without exogenous (independent) verification.
  *   **Excludes:** Standard circular reasoning (where the conclusion is a premise). It includes only cases where the *source* is the loop, not the proposition.
  *   **False Positive (Looks like it, isn't):** Calibrating a thermometer against a second, independent thermometer. (This is Exogenous Validation).
  *   **False Negative (Looks innocent, is it):** A scientist using a theory to design an instrument, then using that instrument to confirm the theory. (This is Endogenous Validation and is often considered problematic in philosophy of science).

  **Final Verdict on Your Intuition:**
  You are correct that "circular reasoning" is too blunt. The precise diagnosis is that (a) and (b) are instances of **Bootstrapping**, which is generally considered a **constitutive defect** (they do not generate justification). Case (c) is **Immediate Epistemic Circularity**, which is generally considered a **dialectical defect** only (the belief is justified, but the argument cannot silence a skeptic). Your suspicion that the defect lies in the "ability to answer a challenge" is philosophically sound for case (c), but less secure for cases (a) and (b).
