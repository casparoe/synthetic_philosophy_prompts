      *   *Check:* Did I address the "crop death" nuance? *Yes, it's an empirical counter-claim used within the LHP framework.*
      *   *Check:* Did I include the "uncertainty" section? *Yes, this is vital for the prompt.*
      *   *Critique:* Make sure not to validate Dan's argument as *correct*, just as *existing*. The user wants to know if it's a "real position," not necessarily a *true* one. I need to make sure the counter-arguments are clear so the user isn't left thinking "Oh, so beef is actually ethical."

  7.  **Final Polish:** Ensure the structure is logical.
