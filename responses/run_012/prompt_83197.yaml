answer: |-
  **TAKE-HOME FINAL: SOCIAL CHOICE AND WELFARE ECONOMICS**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Question 1: Harsanyi's Aggregation Theorem**

  Consider a society with $n$ individuals. Each individual $i$ has preferences over lotteries satisfying the von Neumann–Morgenstern (vNM) axioms, represented by utility function $u_i$. The social planner also has preferences over lotteries satisfying the vNM axioms, represented by social welfare function $W$. Assume the Pareto condition: if every individual weakly prefers lottery $L$ to $M$, then society does too; if at least one strictly prefers $L$, society does too.

  **(a)** Suppose $n=2$. There are two certain outcomes, $x$ and $y$. Normalize utilities such that $u_i(\text{worst}) = 0$ and $u_i(\text{best}) = 1$.
  Construct a numerical example where $u_A(x)=1, u_A(y)=0$ and $u_B(x)=0, u_B(y)=1$. Show that if social welfare is the sum of utilities, society is indifferent between $x$ and $y$. Now rescale Bob's utility linearly (multiply by 100) and show the social ranking flips.
  Given that vNM utilities are unique only up to affine transformation, what specifically in Harsanyi's argument fixes the interpersonal units and weights? Is this a mathematical derivation or a normative premise? [8 marks]

  **(b)** Does Harsanyi's result contradict Arrow's Impossibility Theorem? Explain precisely how the informational basis and the domain of objects being aggregated differ between the two results. Do not simply state "cardinal vs. ordinal." [7 marks]

  **(c)** Consider the following case discussed in seminar: Ann is certain a coin will land Heads; Bob is certain it will land Tails.
  Policy $P$: Pays Ann \$10 if Heads, Bob \$10 if Tails.
  Policy $Q$: Pays Ann \$10 if Tails, Bob \$10 if Heads.
  Both strictly prefer $P$ ex ante (Ann expects \$10, Bob expects \$10). However, conditional on the actual state, one always loses out relative to $Q$.
  Harsanyi's framework aggregates ex ante preferences, so $P$ is socially preferred. Is this an embarrassment for the theorem? Is this awkwardness peculiar to Harsanyi's utilitarianism, or does it attach to any social criterion that respects ex ante Pareto efficiency when beliefs differ? [8 marks]

  **(d)** In one or two sentences: Does this theorem settle the debate between Utilitarianism and Rawlsian maximin in terms of distributive justice? [7 marks]

  ***

  **MODEL ANSWER**

  **(a)** Let outcomes be $x$ and $y$.
  Ann's utility: $u_A(x) = 1, u_A(y) = 0$.
  Bob's utility: $u_B(x) = 0, u_B(y) = 1$.
  If social welfare $W = u_A + u_B$:
  $W(x) = 1 + 0 = 1$.
  $W(y) = 0 + 1 = 1$.
  Society is indifferent between $x$ and $y$.

  Now, apply an affine transformation to Bob's utility: $u^*_B = 100 u_B$. This preserves Bob's risk preferences over lotteries.
  New social welfare $W^* = u_A + u^*_B$:
  $W^*(x) = 1 + 0 = 1$.
  $W^*(y) = 0 + 100 = 100$.
  Society now strictly prefers $y$.

  The mathematical theorem only proves $W = \sum a_i u_i + b$. It does *not* derive equal weights ($a_i = 1$) or common units. The vNM axioms fix individual scales (zero and unit) arbitrarily. To get "the sum of utilities," we must impose an ethical premise: that the planner values a unit of utility gain for Ann exactly as much as for Bob. This is interpersonal comparability of utility levels and units. It is not smuggled in mathematically; it is an explicit normative assumption about the social observer's impartiality. Without it, the "weighted sum" remains indeterminate.

  **(b)** It does not contradict Arrow; it sidesteps it by changing the inputs. Arrow's theorem assumes the social welfare function operates on a profile of *ordinal* preference orderings over deterministic social states. The only information available is the ranking of states; intensity and risk attitudes are invisible. Consequently, no aggregation rule can satisfy Unanimity, Non-Dictatorship, and Independence of Irrelevant Alternatives (IIA).

  Harsanyi operates in a richer informational environment. The inputs are vNM utility functions, which are *cardinal* and measurable via risk attitudes. The domain is lotteries, not just states. Because the planner can see *how much* individuals prefer one outcome over another (via their willingness to gamble), the IIA constraint is effectively relaxed or rendered moot by the richer data. Arrow says you can't aggregate orderings; Harsanyi says if you have utility functions, you can aggregate them linearly. The impossibility vanishes because the "ordinal only" restriction is dropped.

  **(c)** This is an embarrassment for the objectivity of the social choice, but not a logical inconsistency. The awkwardness arises because Ann and Bob have heterogeneous, contradictory beliefs. Ex ante Pareto respects subjective expectations. Since both expect \$10 from $P$ and \$0 from $Q$, both agree $P$ is better. However, in every possible state of the world, one person is disappointed relative to what $Q$ would have yielded.

  This is not peculiar to Harsanyi's utilitarianism. It attaches to *any* social criterion that respects ex ante Pareto efficiency when individuals hold different subjective probabilities. If you respect individual rationality (expected utility maximization) and unanimity based on those expectations, you must choose $P$. To avoid this, you would have to violate ex ante Pareto and impose an ex post criterion (e.g., statewise dominance or equal opportunity). But doing so overrides the individuals' own rational assessments of their welfare. The tension is structural: you cannot simultaneously satisfy Ex Ante Pareto and Ex Post Pareto when beliefs disagree. Harsanyi simply commits to the Ex Ante view.

  **(d)** No, it does not settle the fight. Harsanyi justifies *classical* utilitarianism (linear sum), which implies society is risk-neutral over the distribution of utility. Rawlsian maximin implies extreme social risk aversion. The theorem shows that if the social planner satisfies the same rationality axioms as individuals (including risk neutrality in the vNM sense), they must be a utilitarian. However, one can argue the "social planner" is an ethical construct entitled to different risk attitudes than individuals. Thus, the theorem forces Rawlsians to reject the assumption that social ethics must mirror individual rationality under risk.

  ***

  **MARKING SCHEME (30 Marks Total)**

  **1. Numerical Demonstration (Part a)**
  *   **Marks:** 5
  *   **Requirement:** Correctly calculates the initial indifference ($1+1$ vs $0+0$ or similar symmetric setup) and the post-scaling preference flip.
  *   **Common Miss:** Candidates rescale both agents or fail to show the social ranking actually changes.

  **2. Interpersonal Comparability Premise (Part a)**
  *   **Marks:** 3
  *   **Requirement:** Identifies that equal weights/common units are *not* derived mathematically but require a normative assumption of impartiality/comparability.
  *   **Common Miss:** Claiming the theorem mathematically proves equal weights without extra ethical assumptions.

  **3. Informational Basis Distinction (Part b)**
  *   **Marks:** 4
  *   **Requirement:** Explicitly contrasts Ordinal (Arrow) vs. Cardinal/Measurable (Harsanyi) information regarding intensity of preference.
  *   **Common Miss:** Saying "Arrow is ordinal, Harsanyi is cardinal" without explaining *why* that allows aggregation (intensity data breaks the cycling/impossibility).

  **4. Domain Distinction (Part b)**
  *   **Marks:** 3
  *   **Requirement:** Notes Arrow aggregates orderings over states; Harsanyi aggregates utilities over lotteries/risk.
  *   **Common Miss:** Ignoring the role of lotteries/risk as the mechanism for revealing cardinal information.

  **5. Ex Ante/Ex Post Tension (Part c)**
  *   **Marks:** 5
  *   **Requirement:** Recognizes that Ex Ante Pareto with heterogeneous beliefs can conflict with Ex Post outcomes (or statewise dominance).
  *   **Common Miss:** Arguing that one person must be "wrong" about the probability, missing that rationality allows subjective priors.

  **6. Generality of the Conflict (Part c & d)**
  *   **Marks:** 10 (5 for Part c second half, 5 for Part d)
  *   **Requirement:** (c) Acknowledges this applies to *any* Ex Ante Paretian rule, not just utilitarianism. (d) Clarifies Harsanyi implies social risk-neutrality, which Rawls rejects; doesn't "disprove" Rawls but forces a choice on social risk attitudes.
  *   **Common Miss:** (c) Thinking this is a specific flaw in the weighted sum formula. (d) Claiming Harsanyi proves Rawls is irrational (Rawls denies the social planner must have vNM preferences).

  ***

  **THREE WRONG MOVES**

  1.  **Confusing vNM Cardinality with Interpersonal Comparability:** Assuming that because utility is measurable (cardinal) for one person, it is automatically comparable across persons. (Costs marks in Part a).
  2.  **The "Lottery Loophole" Misunderstanding:** Claiming Harsanyi avoids Arrow simply because it uses lotteries, without noting that lotteries are only instrumental in revealing cardinal intensity. (Costs marks in Part b).
  3.  **Objective Probability Fallacy:** In Part (c), arguing the problem is solved because "the coin has a true probability." This misses the point of subjective expected utility and heterogeneous priors. (Costs marks in Part c).
