prompt: |-
  I'm in a small reading group on philosophy of technology -- five or six of us, mostly grad students split between STS and CS, we meet over Zoom, no set reading. There's one guy in it who has a line he deploys any time someone tries to say a piece of tech is politically neutral: "artifacts have politics." Last week he used it to shut down a friend of mine who was arguing that the queuing and priority rules in a hospital's triage app are just a neutral implementation of a policy the humans had already chosen -- my friend's view is that the software is downstream of the politics, so calling the software itself political is a category mistake, and the guy just said "artifacts have politics" like that ended it. He's used the same line about the famous low bridges on Long Island (which I've since heard is historically contested, so I don't want to build anything on it), and once about a keyboard layout. Another person in the group pushed back that if the "politics" is just which option is the default in a settings menu, then the politics is trivially fixable by flipping the default, so it was never really politics at all. I genuinely can't tell whether the slogan is saying something deep or something so obviously true that it can't do the work he's making it do, and I'd like to know which.

  Can you lay out the distinct precise claims that sentence could be making, as a menu rather than picking one and defending it? Roughly: the trivial reading (technologies have political consequences, or get used for political ends), the designer-intention reading (values and biases get baked in at design time), the strong or inherent reading (some artifacts require, or are compatible only with, certain social arrangements, so adopting the artifact is adopting the arrangement), the deflationary reading that puts the politics entirely in use and interpretation, and any others you think are genuinely distinct rather than restatements. For each one, say whether it's a platitude, a substantive and defensible thesis, or something actually false or incoherent -- and the part I care most about: which reading would actually license the move my guy makes, using the slogan to end a debate about whether a particular app or bridge is "just" an implementation. Ideally I want to be able to tell him, reading by reading, which one he must mean for his move to go through, and what he owes me if he means that one.

  Also please be up front about where your own reasoning is weakest here: which reading you'd most readily drop or reclassify if someone leaned on you, and what sort of argument or example would actually change your verdict on the strongest reading. Don't give me citations or a reading list -- I'll chase those down myself if I need them; name a position or a thinker if it helps but I don't need the bibliography.
