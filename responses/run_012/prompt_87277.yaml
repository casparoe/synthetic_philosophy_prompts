  # JOINT STATEMENT ON THE TWO-ENVELOPE PARADOX

  **Signed:** Camp A (Invariance) & Camp B (Information)
  **Date:** October 2023
  **Subject:** Adversarial Collaboration on the Two-Envelope Problem

  ## I. AGREED CLAIMS

  1.  **Setup Specification:** The problem must be specified by defining the host's procedure. The minimal agreement is: The host selects a positive amount $s$ (the "smaller" amount) and places $s$ in one envelope and $2s$ in the other. The agent selects one envelope uniformly at random, observes the value $x$, and decides whether to keep it or switch to the other.
  2.  **The $5x/4$ Error:** The argument that the expected value of the other envelope is always $(1/2)(2x) + (1/2)(x/2) = 1.25x$ is mathematically flawed in any context where $s$ is drawn from a proper probability distribution. That calculation implicitly assumes that the conditional probability of holding the smaller envelope is $1/2$ *regardless of the value $x$*. This implies a uniform prior distribution over the positive reals for $s$, which is an improper prior (cannot be normalized).
  3.  **Conditional Expectation Constraint:** If $s$ is drawn from any proper probability distribution, it is impossible for the conditional expected gain from switching to be positive for every possible observed value $x$. There must be some values of $x$ for which switching is unfavorable or neutral. Consequently, there is no strategy based solely on $x$ that guarantees a higher expected monetary value than keeping for *every* $x$ under a proper prior on $s$.
  4.  **Validity of the Threshold Strategy:** The strategy proposed by Camp B (generate a random threshold $T$ from a distribution with full support on positive reals; switch if $x < T$, keep otherwise) is mathematically valid. For any fixed pair $(s, 2s)$, this strategy yields a probability of ending with the larger amount strictly greater than $1/2$, when averaging over the randomization of $T$.
  5.  **Distinction of Metrics:** Camp A's constraint (Claim 3) concerns the *conditional expected monetary value* given $x$ under a prior on $s$. Camp B's result (Claim 4) concerns the *unconditional probability of selecting the larger amount* for a fixed pair $(s, 2s)$ under a prior on $T$. These are distinct objective functions. The Threshold Strategy does not violate Claim 3 because it does not assert that $E[\text{Other} \mid X=x] > x$ for all $x$ under a fixed prior on $s$.
  6.  **Ex-Ante Symmetry:** Both sides agree that before any envelope is opened (and before $T$ is generated), the expected value of the "switch" policy is identical to the "keep" policy. Any advantage gained by the Threshold Strategy arises only after observing $x$ and comparing it to $T$.

  ## II. RESIDUAL DISAGREEMENTS

  | Topic | Camp A (Invariance) Position | Camp B (Information) Position | The Crux | Agreed Test / Computation | Prediction (A) | Prediction (B) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of the Paradox** | The paradox is the fallacious derivation that switching is *always* beneficial in expected value. A resolution must show why this derivation fails and why ex-ante symmetry holds. | The paradox is the question of whether observing $x$ provides *any* usable information. A resolution must show how information can be extracted even without a prior on $s$. | **What is the primary error to be corrected?** Is it the belief in a universal positive expectation (A), or the belief that $x$ is uninformative (B)? | Analyze the history of the problem statement in decision theory literature to determine the standard "puzzle" question. | The standard puzzle asks "Should you switch?" implying a check on expected value dominance. | The standard puzzle asks "Does opening the envelope help?" implying a check on information utility. |
  | **2. Relevance of Randomization** | Introducing an external random variable $T$ changes the problem from the classical Two-Envelope Problem to a different game. The classical problem assumes the decision depends only on the envelopes' contents. | Randomization is a legitimate tool in decision theory (mixed strategies). If it yields a strict advantage for every pair $(s, 2s)$, it is relevant to the core question of whether switching can be rational. | **Is a mixed strategy using external randomness admissible in the "standard" formulation?** | Compare the problem constraints: Does "decide whether to switch" forbid auxiliary randomization? | Standard formulations imply a deterministic rule based on $x$ or a prior on $s$. | Standard formulations allow any measurable function of available information, including private randomization. |
  | **3. Normative Advice** | A rational agent with no prior on $s$ should be indifferent between switching and keeping. The Threshold Strategy creates an illusion of gain by shifting the averaging to $T$. | A rational agent should use the Threshold Strategy. It dominates the "never switch" policy for every possible state of the world $(s, 2s)$, which is the definition of a superior decision rule. | **What defines "rational" in the absence of a prior on $s$?** Is it maximizing ex-ante expectation (A) or minimizing regret/dominating state-by-state (B)? | Compute the expected gain of the Threshold Strategy integrated over a proper prior on $s$ vs. the "never switch" policy. | The integrated gain will be zero; the advantage vanishes when $s$ is random. | The state-by-state dominance holds regardless of the distribution of $s$; integrated gain is secondary. |

  ## III. VERBAL VS. SUBSTANTIVE ANALYSIS

  **1. The Definition of "The Problem"**
  *   **Verbal:** A significant portion of the disagreement is verbal. Camp A defines "The Two-Envelope Paradox" as the specific error in the $1.25x$ calculation. Camp B defines it as the broader puzzle of decision-making under total ignorance of the scale of $s$.
  *   **Substantive:** Once re-stated, the substantive disagreement remains: **Does rationality require a prior?** Camp A holds that without a prior on $s$, expected value comparisons are undefined, so indifference is the only coherent stance. Camp B holds that dominance principles (winning more often for every fixed pair) are sufficient to mandate a strategy, even without a prior on $s$. This is a live debate in decision theory (Bayesianism vs. Decision Rules under Ignorance).

  **2. The Role of the Threshold $T$**
  *   **Verbal:** Camp A initially suspected Camp B was smuggling in a prior on $s$. This has been cleared up; B uses a prior on $T$.
  *   **Substantive:** The disagreement is whether a prior on $T$ is "cheating." A argues $T$ is extraneous noise. B argues $T$ is a tool to break symmetry. The substantive question is whether a decision rule is allowed to depend on variables uncorrelated with the host's setup. Both sides agree on the math; they disagree on the *normative permission* to use $T$.

  ## IV. STATUS REPORT

  **Settled Consensus (Among Experts):**
  *   **The $5x/4$ Derivation:** It is settled that the naive expectation calculation requires an improper prior on $s$ and is invalid for proper distributions.
  *   **Cover's Strategy:** It is settled that the random threshold strategy (Camp B's exhibit) strictly increases the probability of holding the larger amount for any fixed pair $(s, 2s)$.
  *   **No Free Lunch:** It is settled that no strategy can yield a positive expected gain for every $x$ under a proper prior on $s$.

  **Genuinely Contested:**
  *   **Philosophical Significance:** There is no consensus on whether Cover's Strategy "resolves" the classical paradox. Some philosophers argue it dissolves the paradox by showing $x$ *is* informative (supporting B). Others argue it sidesteps the paradox by changing the decision criteria from Expected Value to Probability of Winning (supporting A).
  *   **Rationality under Ignorance:** There is no consensus on whether a rational agent *must* use the Threshold Strategy. Bayesians (aligned with A) typically argue that without a prior on $s$, the expected gain is zero, so switching is not mandated. Non-Bayesian decision theorists (aligned with B) argue that state-wise dominance mandates the strategy.
  *   **Problem Formulation:** There is no single standard formulation of the Two-Envelope Problem. Variants exist (fixed prior, unknown prior, open vs. closed envelope). The disagreement between Camp A and Camp B largely stems from optimizing for different variants without realizing it.

  **Conclusion for the Reading Group:**
  You are not talking past each other regarding the mathematics; you are talking past each other regarding the *goal* of the analysis. Camp A is analyzing the coherence of Expectations. Camp B is analyzing the utility of Information. Both analyses are correct within their own frames. The "paradox" persists only if one conflates the two frames.
