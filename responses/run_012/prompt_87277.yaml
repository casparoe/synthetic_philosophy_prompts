prompt: |-
  My reading group has burned three sessions on the two-envelope paradox and has split into two camps that I'm now pretty sure are talking past each other. Camp A (the invariance people) says the thing is dissolved: the two envelopes are exchangeable, no policy of switching can beat keeping, and the famous (1/2)(2x) + (1/2)(x/2) = 5x/4 step is just an illicit conditioning on something you don't know — it smuggles in a uniform distribution over the pair sizes that can't exist. Camp B (call them the information people) says A has resolved one special case and sold it as a resolution of the phenomenon. Their exhibit is this: the smaller amount is drawn from some distribution that neither I nor the host gets to see, and before opening anything I fix a threshold T at random from a distribution with full support on the positive reals; then I switch if what I opened is below T and keep otherwise. B claims this rule strictly beats never switching, for every possible pair, with no illicit prior anywhere — the edge coming from the fact that a pair (s, 2s) gets straddled by T with positive probability, so I end up switching while holding the small one slightly more often than while holding the big one. A also says something I want checked: that no proper distribution over the smaller amount can make switching look good at every x you might open, because the gain conditional on opening x has to be positive for some x and negative for others, so B's exhibit must be doing something other than what B thinks it's doing. I suspect alot of this is verbal and some of it is a live question and I can't tell which is which.

  So: write the joint statement that A and B could both sign after a real adversarial collaboration. I want the agreed claims first, numbered — including what the setup has to specify before any question about switching is even well-posed, what the 5x/4 argument is actually claiming, where both sides agree it goes wrong, and what each side concedes the other has got right. Then the residual disagreements, in a table, with each side's position written in wording that side would accept as its own (no strawmen in the left column), and for each row the crux: the sub-question such that settling it would actually move one of them. For each crux, give the case, argument, or computation both sides would agree bears on it, and write down in advance what each side predicts the outcome will be. If some of the rows turn out to be about words rather than about the world — which setup "the two-envelope paradox" names, or what a switching rule is allowed to depend on — say which and why, and say what the disagreement looks like once it's re-stated.

  Please don't send me a reading list or citations; I'm offline for the week and can't check anything, so keep it self-contained and don't lean on who said what. And be honest about status: tell me which of the claims you write down are settled among people who work on this and which are genuinely contested, and don't dress up a contested resolution as if it were the consensus.
