  **Credence:** 0.18

  **Decomposition:**
  I model the existence of a genuine law of history ($L$) as the conjunction of four necessary conditions. The probabilities represent my credence that each condition is satisfied sufficiently to support $L$.

  1.  **Ontological Stability ($O$):** *Social systems possess causal structures invariant across diverse micro-foundations.*
      *   **Probability:** 0.85
      *   **Justification:** Institutional and demographic constraints exhibit robust statistical regularities (e.g., demographic transition models) suggesting underlying structural causality.
  2.  **Epistemic Closure ($E$):** *Regularities remain invariant despite the reflexivity of agents acquiring knowledge of the regularity (immunity to the Oedipus effect).*
      *   **Probability:** 0.55
      *   **Justification:** While some structural constraints (e.g., resource limits) are reflexive-proof, most social mechanisms are undermined when agents optimize against them.
  3.  **Trajectory Validity ($T$):** *Local transition mechanisms aggregate into exceptionless global path laws rather than dissipating into chaos or path-dependence.*
      *   **Probability:** 0.65
      *   **Justification:** Complex systems often show path-dependence where local rules do not determine global attractors, making trajectory laws rarer than local mechanism laws.
  4.  **Inference from Failure ($F$):** *The historical failure to identify such laws is evidence of their absence rather than merely the difficulty of the search.*
      *   **Probability:** 0.60
      *   **Justification:** Centuries of high-quality data and modeling have yielded trends and heuristics, but no invariant laws, suggesting a category error rather than a measurement error.

  **Arithmetic:**
  $$ P(L) = P(O) \times P(E) \times P(T) \times P(F) $$
  $$ P(L) = 0.85 \times 0.55 \times 0.65 \times 0.60 \approx 0.182 $$

  **Sensitivity Analysis:**
  My number is most sensitive to **Epistemic Closure ($E$)**. If you could demonstrate a social regularity that holds *after* agents have optimized their behavior based on knowledge of that regularity (e.g., a game-theoretic equilibrium that persists even when the equilibrium condition is common knowledge and manipulable), my credence would jump to ~0.45. Conversely, if Popper's argument is strengthened to show that *all* social structural knowledge alters the structure itself, my credence drops to <0.05.

  **Evaluation of the Concrete Case:**
  Your colleague's candidate (*institutional innovation declines as elite surplus capture rises*) fails primarily on **Epistemic Closure** and **Trajectory Validity**.
  1.  **Reflexivity:** If incumbents learn this "law," they may strategically release surplus to purchase innovation (buying legitimacy), breaking the monotonicity.
  2.  **Trajectory:** It describes a rate of change (a local derivative), not a terminal state or a global path shape; it explains *stagnation*, not where the society *ends up* (collapse, transformation, or equilibrium). It is a mechanism sketch, not a trajectory law.

  **Diagnosis of Disagreement:**
  Given your credence (0.15), mine (0.18), and your colleague's (0.65), the divergence is almost certainly located in **Epistemic Closure ($E$)** and **Trajectory Validity ($T$)**.

  *   **Where you part company:** Your colleague likely assigns $P(E) \approx 0.9$ and $P(T) \approx 0.9$. They probably treat *trends* (empirically stable but theoretically fragile patterns) as *laws* (invariant under intervention), and they likely assume that aggregating local mechanisms automatically yields global predictability. You likely assign $P(E) \approx 0.3$, granting Popper's growth-of-knowledge argument near-decisive weight.
  *   **Path to Convergence:**
      *   **Your Concession:** You must raise $P(O)$ slightly. Acknowledge that while *prophecy* is impossible, *structural constraints* (e.g., no society sustains 100% elite capture without collapse) exist. This moves you from 0.15 toward 0.25.
      *   **Colleague's Concession:** They must lower $P(T)$ and $P(E)$. They must admit that once a regularity is published, it becomes a parameter in the agents' utility functions, altering the outcome (reflexivity), and that local mechanisms rarely sum to deterministic trajectories due to chaos/path-dependence. This moves them from 0.65 toward 0.30.
      *   **Meeting Point:** You meet around 0.25–0.30, agreeing that "laws" exist only as *boundary conditions* on what is impossible, not as *prophecies* of what is necessary.
