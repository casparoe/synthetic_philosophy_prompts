prompt: |-
  My roommate and I keep getting into it over this. She says "what if everyone did that?" like it's checkmate — most recently when I told her I wasn't going to vote this cycle, and she said to imagine everyone staying home. I've heard the same move from my mom about me not returning the shopping cart, and from a friend about buying stuff from a fast-fashion site. It's obviously supposed to be Kant's universalizability test in street clothes, but half the time it sounds like she just means "if everyone did it, the consequences would be bad," which is definately not the same thing, right?

  I want a proper breakdown of the distinct things "what if everyone did that?" could actually be asserting. Like: (a) the prudential/Hobbesian warning that if everyone did it you personally would end up worse off; (b) the rule-consequentialist claim that the world where everyone does it is worse overall; (c) the Kantian move where you try to universalize your maxim and hit a contradiction; (d) something about fairness, cheating, or free-riding; (e) the universal-prescriptivism thing where you have to be able to endorse everyone acting on the same principle. And within the Kantian reading there's the further mess about whether the contradiction is a contradiction in conception or a contradiction in the will, and about how you're even supposed to describe the maxim in the first place — my maxim isn't "don't vote," it's "skip voting in this particular low-stakes election because I'm busy," and does that universalize fine? If the answer depends on how I word the maxim, that seems like a problem.

  For each reading, tell me whether it's trivial or substantive, whether it's actually plausible, and whether it even gets her to "so you should vote." Then tell me which reading people usually have in mind when they deploy the line, because I suspect it's the vaguest one. Also, which of these readings survive the standard objections — the gap between "everyone doing it" and "everyone being permitted to do it," the act/omission thing, the fact that some maxims universalize cleanly and still feel wrong. Lay it out as a menu I can actually argue from, not a lecture.

  Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is arguing with their roommate (and others) about the phrase "What if everyone did that?" used in moral disagreements (voting, shopping carts, fast fashion).
      *   **Core Question:** The user wants a breakdown of the distinct philosophical meanings behind this phrase. They suspect it's often a muddled version of Kant but could be several other things.
      *   **Specific Requirements:**
          *   Break down distinct interpretations: (a) Prudential/Hobbesian, (b) Rule-Consequentialist, (c) Kantian (Categorical Imperative), (d) Fairness/Free-riding, (e) Universal Prescriptivism.
          *   For *each* reading: Assess if it's trivial/substantive, plausible, and whether it successfully argues "you should vote."
          *   Address Kantian nuances: Contradiction in conception vs. will, maxim description problem.
          *   Identify which reading people *actually* mean (usually the vague one).
          *   Address standard objections (permission vs. action, act/omission, universalizable but wrong maxims).
          *   **Format:** A "menu" for argumentation, not a lecture.
          *   **Tone:** American English, analytical but accessible (matching the user's philosophical literacy).

  2.  **Deconstruct the Interpretations:**

      *   **(a) Prudential/Hobbesian:** "If everyone did this, *you* would suffer."
          *   *Analysis:* This is about self-interest. If no one votes, democracy collapses, you suffer.
          *   *Verdict:* Often trivial (everyone won't do it) or implausible (my single vote doesn't cause the collapse). Doesn't necessarily prove moral wrongness, just risk.
      *   **(b) Rule-Consequentialist:** "A world where everyone does this has worse outcomes."
          *   *Analysis:* Focus on aggregate utility.
          *   *Verdict:* Substantive. Plausible for voting. But faces the "rule worship" objection (why follow the rule if *I* know my specific act won't trigger the bad outcome?).
      *   **(c) Kantian (CI):** "Can you will this maxim as a universal law?"
          *   *Analysis:* Logical consistency.
          *   *Verdict:* Tricky. Depends on maxim formulation. "Don't vote in low-stakes elections when busy" might universalize without contradiction. "Never vote" might contradict the will (need representation).
          *   *Nuance:* Contradiction in conception (logically impossible) vs. Will (rationally undesirable).
      *   **(d) Fairness/Free-riding:** "You're benefiting from others doing it without paying the cost."
          *   *Analysis:* Principle of Fair Play.
          *   *Verdict:* Very strong for voting and shopping carts. Substantive. Plausible.
      *   **(e) Universal Prescriptivism (Hare):** "Are you prescribing this for everyone in relevantly similar situations?"
          *   *Analysis:* Moral language implies universal command.
          *   *Verdict:* Substantive. Forces consistency. If you say "It's okay for me," you must say "It's okay for everyone."

  3.  **Address the "Maxim Problem" (Kant):**
      *   The user is right: "Don't vote" vs. "Don't vote when busy/low-stakes."
      *   If the maxim is too specific, it universalizes easily. If too general, it fails. This is the "rigorism" vs. "loophole" critique.

  4.  **Address Standard Objections:**
      *   *Permission vs. Action:* Just because it's okay for everyone to *do* it, doesn't mean everyone *will*.
      *   *Act/Omission:* Not voting is an omission. Does the rule apply?
      *   *Universalizable but Wrong:* "Everyone should persecute heretics" might be consistent but is morally abhorrent (needs external values).

  5.  **Determine What People *Actually* Mean:**
      *   Most laypeople mean a mushy mix of (b) Consequences and (d) Fairness. They rarely mean strict Kantian logic.

  6.  **Drafting the Response (Iterative Process):**

