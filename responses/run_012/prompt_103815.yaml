answer: |-
  You are right to be annoyed. "What if everyone did that?" is the philosophical equivalent of a Swiss Army knife: it has a tool for everything, but most people use the blunt side of the scissors. Your roommate is deploying a heuristic that collapses at least five distinct ethical frameworks into one slogan.

  Here is the menu. You can use this to isolate exactly what claim she is making and whether it holds water.

  ### The Menu of Interpretations

  #### 1. The Prudential / Hobbesian Warning
  *   **The Claim:** "If everyone acted this way, the system would collapse, and *you* would be worse off."
  *   **The Logic:** This isn't moral; it's self-interest. It relies on causal predictions. If no one votes, democracy fails, and you lose rights.
  *   **Trivial or Substantive?** Trivial. It relies on a counterfactual that isn't true (everyone *won't* stay home).
  *   **Plausible?** Low. Your single decision to skip voting does not cause everyone else to skip voting. There is no causal link between your action and the universal outcome.
  *   **Does it prove you should vote?** No. It proves you should hope *others* vote. It commits the fallacy of composition (assuming what is true for the part is true for the whole).
  *   **Counter-move:** "I'm not causing everyone else to stay home. I'm making a marginal decision based on the fact that millions of others *are* voting."

  #### 2. Rule-Consequentialism
  *   **The Claim:** "A world where everyone is *permitted* to do this produces worse overall consequences than a world where they aren't."
  *   **The Logic:** We judge the *rule*, not the act. The rule "Everyone should vote" yields better utility than "People can skip if they want."
  *   **Trivial or Substantive?** Substantive. It shifts the debate from your specific act to the social norm.
  *   **Plausible?** High. Generally, high turnout is better for democratic legitimacy.
  *   **Does it prove you should vote?** Only if you accept "rule worship." The standard objection is: *Why follow the rule if my specific violation doesn't trigger the bad outcome?* If the norm is already strong enough to survive your absence, rule-consequentialism might actually permit you to skip.
  *   **Counter-move:** "I'm not trying to change the rule. I'm acting within a system where the rule is already robust enough to handle my absence."

  #### 3. The Kantian Categorical Imperative
  *   **The Claim:** "Your maxim cannot be universalized without contradiction."
  *   **The Logic:** You must act only on principles that could become laws of nature.
  *   **Trivial or Substantive?** Substantive, but technically fragile.
  *   **Plausible?** Depends entirely on the **Maxim Description** (see below).
  *   **Does it prove you should vote?** Maybe.
      *   *Contradiction in Conception:* If everyone skipped voting, the institution of voting would cease to exist (logically impossible to will). *Weakness:* Voting wouldn't cease to exist; it would just fail to function.
      *   *Contradiction in the Will:* You can conceive of a world where no one votes, but you cannot *rationally will* it, because you presumably want a representative government.
  *   **Counter-move:** "My maxim isn't 'No one should vote.' It's 'Citizens may abstain when the marginal utility of their vote is negligible and opportunity costs are high.' That universalizes fine."

  #### 4. The Principle of Fair Play (Free-Riding)
  *   **The Claim:** "You are benefiting from a cooperative scheme without paying the cost."
  *   **The Logic:** Voting is a public good produced by the effort of others. If you enjoy the benefits of democracy (stability, representation) without contributing your share of the effort, you are cheating.
  *   **Trivial or Substantive?** Very Substantive. This is usually the strongest moral argument for voting.
  *   **Plausible?** High. It avoids the "my vote doesn't matter" problem. It's not about the *impact* of your vote; it's about your *duty* to the cooperative scheme.
  *   **Does it prove you should vote?** Yes, provided you accept the benefits of the system.
  *   **Counter-move:** "I don't accept the benefits," or "The system is corrupt, so the cooperative scheme is invalid," or "My cost (time/mental load) outweighs my fair share."

  #### 5. Universal Prescriptivism (R.M. Hare)
  *   **The Claim:** "If you say it's okay for you, you must prescribe it for everyone in relevantly similar situations."
  *   **The Logic:** Moral language is universal. You can't make an exception for yourself.
  *   **Trivial or Substantive?** Substantive. It forces consistency.
  *   **Plausible?** High. It exposes hypocrisy.
  *   **Does it prove you should vote?** Only if you would be okay with *everyone* like you (busy, disillusioned) not voting. If you are okay with that, you pass the test. If you aren't okay with that, you fail.
  *   **Counter-move:** "I am perfectly fine with everyone in my specific situation (low efficacy, high cost) abstaining. I only want the people who care to vote."

  ---

  ### The Kantian Mess: The Maxim Problem
  You hit the nail on the head regarding the maxim. Kant's test is notoriously sensitive to how you phrase your rule.

  *   **Maxim A:** "I will not vote."
      *   *Universalize:* No one votes. Democracy collapses. **Fail.**
  *   **Maxim B:** "I will not vote in low-stakes elections when I am overworked."
      *   *Universalize:* Overworked people skip low-stakes elections. Democracy survives. **Pass.**

  **The Objection:** If the agent gets to define the maxim, they can always universalize their way out of duty. This is the "loophole" objection.
  **The Defense:** Kantians argue maxims must be based on *relevant* moral features, not convenient excuses. Is "being busy" a morally relevant reason to abandon civic duty? That's the real debate, not the logic of universalization itself.

  **Survival Status:** The Kantian reading survives only if you can agree on a neutral description of the maxim. Since you and your roommate won't agree on that, this framework is a stalemate.

  ---

  ### What People *Actually* Mean
  When your roommate, mom, or friend says, "What if everyone did that?" they are almost never doing Kantian logic. They are usually deploying a vague hybrid of **Rule-Consequentialism (2)** and **Fairness (4)**.

  *   **The Vibe:** They feel you are opting out of a social contract.
  *   **The Error:** They treat your individual act as if it has causal power over the group (The Prudential error).
  *   **The Reality:** They are expressing social disapproval. They are saying, "This behavior looks like free-riding, and I don't like free-riders."

  ### Standard Objections & Survival Guide

  Here is how the readings hold up against the heavy artillery:

  | Objection | Prudential (1) | Rule-Consq. (2) | Kantian (3) | Fairness (4) | Prescriptivism (5) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **"Everyone *doing* it vs. *permitted* to"** | **Fails.** Confuses prediction with permission. | **Survives.** Focuses on the rule, not the act. | **Survives.** Focuses on the law, not the outcome. | **N/A.** Focuses on contribution, not permission. | **Survives.** Focuses on endorsement. |
  | **Act vs. Omission** | **Fails.** Omissions rarely cause collapse. | **Mixed.** Rules usually cover omissions. | **Mixed.** Depends on if duty is positive/negative. | **Survives.** You can free-ride by omission. | **Survives.** You can prescribe omission. |
  | **"Universalizable but Wrong"** | **N/A.** | **Fails.** "Everyone persecute heretics" could be stable. | **Fails.** A consistent Nazi passes the CI test (debated). | **Survives.** Requires the scheme be just. | **Mixed.** Depends on informed preferences. |

  ### How to Argue This (Without Ruining the Friendship)

  Don't try to win on Kant. The maxim problem makes it a technical draw. Instead, pivot to **Fairness (4)**.

  **Say this:**
  > "I get that 'what if everyone did that' is supposed to be a logic check, but usually it's just a fairness check. You're worried I'm free-riding on the civic effort of others. That's a fair point. But if the system functions fine without my specific vote, am I actually harming the scheme, or am I just prioritizing my time? If you're arguing fairness, tell me why my absence is a burden, not whether the world would end if everyone quit."

  **Why this works:**
  1.  It validates her intuition (fairness matters) without accepting her faulty logic (causal collapse).
  2.  It forces her to argue about the *actual* stakes of your non-voting, rather than a hypothetical apocalypse.
  3.  It acknowledges the "Maxim Problem" implicitly by focusing on your specific context ("my absence") rather than the universal rule.

  If she sticks to "But if *everyone* did it," you can safely reply: "But everyone isn't doing it. I'm asking about *me*." That shuts down the Prudential and Consequentialist versions immediately.
