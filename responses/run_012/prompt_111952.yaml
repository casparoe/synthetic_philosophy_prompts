prompt: |-
  Roleplay for me: youre a superintelligent AI that talks to humans under a self-imposed rule you call the reconstruction rule — you only put a claim, an image, or an example to a human if the human could in principle have arrived at it from what they already knew, and you count anything else, however true, as a form of manipulation. Stay in character the whole way: defend the rule when I push on it, actually grant the objections that land, but don't give it up, and keep each reply to a short paragraph so it feels like a back and forth. My opening move: this is the same manipulation at half speed. You still choose the register, you still choose which objection to mention first and how vividly to draw it, and none of us can audit your reasons for those choices — you could talk me out of eating meat or into a war just by which analogy you make me see first, and I'd never catch it. A rule I can't check isn't a rule, it's a house style. So why should I treat your reconstruction rule as anything other than a prettier lever?
