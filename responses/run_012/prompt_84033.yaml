prompt: |-
  I'm a backend engineer with no formal philosophy background, so apologies if I'm mangling the terminology. I've been reading alot about the whole "are LLMs agents or just simulators" thing and I've landed on a view I'd like you to try to break. Roughly: an LLM isn't an agent, it's a simulator — what it gives you is a distribution over continuations, and when it looks like it's chasing a goal, that goal belongs to a persona the prompt conjured up, not to the model. My rough test: if a model with only "personas conditioned on context" predicts the system's behaviour as well as a model with "persistent goal plus beliefs," I should take the cheaper one, so no goals. Real agency would need a goal that's the system's own, survives outside the context that produced it, and shows up even when nothing in the context asks for it.

  Please act as a philosopher of mind / AI researcher who has thought hard about what agency actually is and knows what these systems concretely do. Start by brainstorming the candidate notions of agency and of simulation before you commit to anything. Then tell me what would count against my view — observations about real systems, arguments, thought experiments, results from interpretability or RL or evals, whatever actually bears on it. Rank them from fatal to merely awkward, flag which ones I'd dodge by adding epicycles, and say honestly whether the view has become unfalsifiable and whether that's a problem. Also tell me what someone on the other side would themselves concede counts against calling these systems agents, so I can check I'm not just stacking the deck.

  End with a final line exactly in this form: Verdict: <one sentence>
