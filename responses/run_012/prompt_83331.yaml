      *   *Virtue:* This is Aristotelian.
      *   *Bargaining:* George Ainslie / Thomas Schelling.

      *Let's adjust the tiers:*
      *   S: Attention/Salience (Best modern fit for synchronic).
      *   A: Will/Execution (Classic, robust, but metaphysically costly); Intrapersonal Bargaining (Best for diachronic).
      *   B: Virtue/Normative (Explains the blame, not the mechanism).
      *   C: Pure Discounting (Explains behavior, dissolves the philosophical puzzle).

