  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on Discounting:* I shouldn't trash it too hard. It's the dominant model in behavioral econ. But for *philosophical akrasia*, it's controversial. I need to make sure the tier reflects its philosophical utility, not its economic utility.
      *   *Correction on "Will":* "Will failing to execute" is often associated with Donald Davidson. I should mention that implicitly or explicitly.
