  3.  **Evaluate the Theories (Mental Draft):**

      *   *Pure Discounting (Hyperbolic):* This is the user's specific target. It models preference reversal. At $t_1$, I prefer Long-term. At $t_2$ (closer to temptation), I prefer Short-term.
          *   *Critique:* As the user notes, this dissolves synchronic akrasia. There is no moment where I judge X best and do Y. I judge Y best at the moment of action.
          *   *Tier:* Low for *akrasia* (since it denies the core phenomenon), High for *behavioral prediction*. Let's put it in B or C depending on the definition of akrasia. If akrasia *requires* synchronic conflict, this fails. Let's rank it lower for *explaining akrasia* specifically, because it explains *impulsivity* but not *weakness of will* in the Socratic/Aristotelian sense.
      *   *Will failing to execute (Davidson/Velleman style):* This keeps the synchronic judgment intact. I judge A best, but desire for B overpowers.
          *   *Critique:* Classic account. Preserves the phenomenon. But metaphysically mysterious (what is the "will"?).
          *   *Tier:* A or S. It hits the target definition best.
      *   *Intrapersonal Bargaining (Ainslie/Schelling):* Time-slices negotiating. Commitment devices.
          *   *Critique:* Good for diachronic. Explains why we bind ourselves. Less good at explaining the *moment* of failure without commitment.
          *   *Tier:* A for Diachronic, B for Synchronic.
      *   *Attention/Salience (Stroud/Tenny):* I judge A best *all things considered*, but B is more salient *right now*, so I act on B without changing my all-things-considered judgment.
          *   *Critique:* Very strong contemporary contender. Preserves synchronic judgment but explains the slip via cognitive architecture.
          *   *Tier:* S or A.
      *   *Social/Virtue (Aristotle/Williams):* It's a vice. Criticizable.
          *   *Critique:* Normative rather than mechanistic. Explains why we *care*, not necessarily *how* it happens.
          *   *Tier:* B. It addresses the "what's wrong with it" not the "how does it work."

  4.  **Drafting the Tier List:**

      *   *S-Tier:* Needs to handle Synchronic conflict robustly. Attention/Salience is strong here. The "Will failing" is classic but metaphysically heavy. Let's put Attention in S because it bridges psychology and philosophy well.
      *   *A-Tier:* Will failing (classic), Intrapersonal Bargaining (great for diachronic).
      *   *B-Tier:* Virtue theory (normative, not mechanistic).
      *   *C-Tier:* Pure Discounting. Why? Because as the user suspects, it explains *preference reversal*, not *akrasia* (acting against current judgment). It dissolves the puzzle rather than solving it.

      *Refining the "Explains" Definition:* I need to be careful. If I define "explains" as "preserves the paradox," discounting fails. If I define it as "predicts the behavior," discounting wins. The prompt implies the former ("how much of the phenomenon... explains"). I will define "explains" as *preserving the agent's first-person experience of acting against a concurrent better judgment.*

