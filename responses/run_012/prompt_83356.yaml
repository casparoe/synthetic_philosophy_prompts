answer: |-
  Begin by defining information access as a sampling problem, transition to source credibility as a calibration problem, anchor both in the historical resistance to *Helicobacter pylori*, intercept the immunity illusion during the calibration discussion, and conclude with a diagnostic scenario.

  This sequence relies on scaffolding their existing intuition about data completeness before subverting it with the mechanics of distrust. Scientists understand sampling error as a correctable technical failure; introducing the epistemic bubble here validates their self-conception as data-seekers. You must establish this baseline before introducing the echo chamber, because the chamber is only distinguishable as a distinct pathology once the audience accepts that mere access to information is insufficient. The transition to calibration failure depends on this prior acceptance; if they believe missing data is the only obstacle, they will interpret active distrust as merely another form of missing data.

  The carrying example must be the initial medical consensus against *Helicobacter pylori* as the cause of ulcers. It must contain the specific chronological shift where evidence moved from non-existent (sampling failure) to present but dismissed as methodological artifact due to the prior belief that bacteria cannot survive in acid (calibration failure). It must leave out the personal narrative of Marshall and Warren's vindication to avoid reducing the lesson to a story of individual heroism rather than systemic epistemic structure. This example earns the framing's keep by demonstrating that high-quality scientific communities can sustain echo chambers through rigorous adherence to theoretical priors, not just through laziness or technology.

  Head off the immunity illusion precisely when you introduce the calibration failure. This audience believes their training immunizes them because they equate skepticism with virtue; you must demonstrate that the echo chamber weaponizes that very skepticism by teaching members to dismiss outside sources as inherently unreliable based on identity or methodology rather than content. If you wait until the end to address this, they will have already categorized the phenomenon as something that happens to "other" people. Simultaneously, refuse to cover remediation strategies for echo chambers or contemporary political case studies. Remediation is theoretically contested and risks turning the seminar into a therapy session, while political cases will trigger defensive polarization that obscures the epistemic mechanism.

  The single closing question must force them to apply the distinction rather than recall definitions: "If you provide a dissenting paper to a colleague who rejects it as 'methodologically unsound' without examining the methods, has providing more information solved the problem?" A correct grasp of the distinction requires them to identify that adding information fixes a bubble but exacerbates a chamber, where the defect lies in the trust calibration, not the data volume.
