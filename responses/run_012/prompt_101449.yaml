answer: |-
  Confidence Flag: High on the structural analysis of the practice; Moderate on the claim that a *single* coherent theory drives it (it is more likely a stable equilibrium of incompatible theories).

  Here is the reconstruction of the implicit theory of nationhood presupposed by the modern state's heritage apparatus.

  ### 1. The Core Reconstruction: "Retroactive Necessitation"

  The apparatus does not presuppose Primordialism (nations are naturally ancient) nor does it presuppose naive Constructivism (nations are arbitrary modern fictions). If it were the former, the apparatus would be redundant (you do not need a ministry to prove gravity); if it were the latter, the apparatus would be self-defeating (admitting the fiction dissolves the authority).

  The implicit theory is best described as **Performative Ontology via Retroactive Necessitation.**

  In this view, the nation is an *institutional fact* (like money or marriage) that relies on collective intentionality to exist, but it derives its stability from pretending to be a *brute fact* (like a mountain or a river). The state acts as a gardener who insists they are an archaeologist.

  *   **The Ontological Claim:** The nation *becomes* old by acting as if it were old. The "past" is not a fixed territory to be discovered, but a resource to be mined and assembled to stabilize the present.
  *   **The Role of Authenticity:** Authenticity is not a measure of *material continuity* (is this stone from 1200 AD?). It is a measure of *narrative fidelity* (does this stone fit the load-bearing walls of our current identity?).
  *   **The Function:** The apparatus creates a **Common Knowledge Equilibrium**. It is not enough for me to believe the nation is ancient; I must believe that *you* believe it, and that you believe *I* believe it. The expense and scale of the apparatus serve as a costly signal that the state is committed to maintaining this equilibrium. To call a tradition "invented" is not to make a historical correction; it is to attack the coordination mechanism itself.

  ### 2. Strict Requirements vs. Comfortable Fits

  To sustain this ontology, the practice strictly requires certain conditions, while others are merely helpful contingencies.

  **Strict Requirements:**
  1.  **The Claim of Pre-existence:** The state must present itself as the *successor* to the nation, not the *creator* of it. Even if the state created the symbols, it must claim it merely "recognized" them.
  2.  **Enforceable Orthodoxy:** There must be a mechanism (schools, laws, funding) to penalize deviations from the canonical narrative. Without the ability to rule certain stories "inauthentic," the narrative loses its focal-point power.
  3.  **Material Anchors:** There must be *some* physical artifacts, even if their interpretation is stretched. A narrative with zero material hooks collapses into pure propaganda, which is less stable than "heritage."

  **Comfortable Fits (Not Strictly Required):**
  1.  **Ethnic Homogeneity:** Civic nations (e.g., USA, France) run this apparatus just as intensely as ethnic nations. The "ancient people" can be defined by creed or language as easily as by blood.
  2.  **Actual Antiquity:** The nation does not need to actually be old. It only needs to be *plausibly* old enough to command reverence. A 200-year-old nation can successfully project a 1,000-year lineage if the institutional weight is sufficient.
  3.  **Official Belief:** The bureaucrats do not need to personally believe the primordialist story. They only need to believe that *maintaining the story* is necessary for order. (Though, over time, the apparatus selects for true believers).

  ### 3. Rival Theories: Ruled Out vs. Untouched

  **Quietly Ruled Out:**
  *   **Radical Contingency:** The theory that "we could easily be a different people tomorrow." The apparatus is designed specifically to kill this idea. It asserts path dependence: we are *this* nation because we were *that* nation.
  *   **Contractual Voluntarism:** The idea that the nation is a voluntary association of living individuals (a pure social contract). The heritage apparatus insists on obligations to the dead and the unborn, which a pure contract cannot sustain.
  *   **Instrumental Transparency:** The idea that state narratives should be fully transparent about their utility. The apparatus requires a veil of sacredness; admitting "we teach this to make you obedient" destroys the obedience.

  **Left Untouched (Underdetermined):**
  *   **The Mechanism of Transmission:** The theory doesn't care if continuity is biological, cultural, or linguistic, provided it can be institutionalized.
  *   **The Political Regime:** Monarchies, Republics, and Theocracies all run heritage ministries. The implicit theory of nationhood is compatible with almost any theory of *statehood*.

  ### 4. The Tension: Bug or Feature?

  You asked if the insistence on authenticity sits in genuine tension with the manufacture of continuity.

  **Verdict:** It is a **Productive Tension.**

  If the tension were resolved in favor of pure Primordialism, the state would become brittle. When archaeological evidence contradicts the myth (e.g., "this sacred site is actually from a rival culture"), the state would have to deny science, risking epistemic credibility.

  If the tension were resolved in favor of pure Constructivism, the state becomes fragile. If citizens know the traditions are recent fabrications, they view them as tools of manipulation rather than sacred duties. Emotional leverage is lost.

  The apparatus *needs* the friction. The work of "restoration" allows the state to update the national narrative (constructivism) while claiming it is merely "cleaning away the grime of history" (primordialism). The tension allows for **stealth updates** to national identity.

  ### 5. Philosophical Underdetermination

  There are specific gaps where the practice does not reveal its theoretical hand:

  *   **The Threshold of Sincerity:** The apparatus does not specify how much fabrication is too much. Is a tradition "fake" if it was invented 50 years ago? 100? 500? The boundary is fluid and determined politically, not ontologically.
  *   **The Unit of Continuity:** Is the nation continuous because of the *land*, the *people*, or the *institutions*? The museum treats these as interchangeable. If the people change but the land remains, is it the same nation? The practice hedges all bets simultaneously.
  *   **The Status of "Interruption":** If a tradition was banned for 50 years and then revived, is it continuous? The apparatus says "yes" (it was "dormant"), while a strict historical view says "no" (it was broken). The practice resolves this by fiat.

  ### 6. The Constructivist Swap: A Concrete Thought Experiment

  What would change if we swapped the implicit theory for a **Frankly Constructivist** one? This means the state admits: *"We are building a nation. These traditions are tools for cohesion. They are new, but they are necessary."*

  **Example A: The National Museum**
  *   *Current:* Exhibits are arranged chronologically to show an inevitable unfolding. Labels read: "The Eternal Spirit of the People manifests in..."
  *   *Constructivist Swap:* Exhibits are arranged thematically around "Challenges of Cohesion." Labels read: "In 1920, this symbol was adopted to unify the Northern and Southern regions following the Civil War. It succeeded in creating a shared visual language."
  *   *Consequence:* The visitor feels *admiration for the statecraft* rather than *piety for the ancestors*. The emotional register shifts from **Sacred** to **Civic/Pragmatic**. The risk is that pragmatic tools are discarded when they become inconvenient; sacred objects are preserved even at high cost.

  **Example B: The Language Academy**
  *   *Current:* "We protect the ancient tongue from foreign corruption. This word is forbidden because it is not truly ours."
  *   *Constructivist Swap:* "We standardize the tongue to ensure mutual intelligibility and economic efficiency. We discourage this loan-word not because it is 'impure,' but because it creates friction in communication and weakens our distinct cultural coordination."
  *   *Consequence:* Language policy becomes a debate about utility, not identity. This makes it easier to change rules, but harder to motivate sacrifice. You die for your "Mother Tongue"; you rarely die for your "Communication Protocol."

  ### 7. Confidence Assessment: Single Theory or Bundle?

  **Confidence: Moderate (60%) that there is a single functional logic; High (90%) that there is no single *conscious* theory.**

  I am highly confident that the practice is not driven by a unified philosophical doctrine held by officials. It is a **Bricolage of Convenience.**
  *   When dealing with minorities, the state often leans into *Constructivism* ("Anyone can join us if they adopt our values").
  *   When dealing with rivals or internal dissent, the state leans into *Primordialism* ("You are betraying your blood/history").
  *   When dealing with donors/tourists, the state leans into *Aesthetic Authenticity* ("Look at this old thing").

  However, I am moderately confident that these contradictory moves are stabilized by the single functional logic of **Retroactive Necessitation** described above. The system *behaves* as if it has a theory, even if the operators do not. It is a "systemic lie" that functions as a truth.

  **Final Conclusion:**
  The apparatus presupposes that **legitimacy requires a past that is longer than the present regime.** It does not require that the past be *real*, but it requires that the *claim* be treated as real. The "unease" you feel is the friction of the machinery: you are seeing the gears of construction turning behind the curtain of antiquity. The state cannot stop the gears (it must build to survive), but it cannot show them (it must claim to discover). The practice is the art of keeping the gears oiled and hidden.
