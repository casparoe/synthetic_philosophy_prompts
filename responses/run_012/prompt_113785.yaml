  Dear Colleague,

  It is a pleasure to hear that you are constructing a seminar around the specific intuition that Douglas Hofstadter champions, namely that the self is a pattern capable of partial instantiation across multiple substrates. As you note, this view is often treated as a poetic metaphor rather than a rigorous metaphysical position, and your aim to force it into the same logical space as animalism or substance dualism is exactly the right pedagogical move. You have asked for a decision tree that sorts readers by their commitments without presupposing the ontological labels they might wear, and you have requested that I weave in the specific cases you listed while remaining in the format of a continuous letter. I will attempt to construct this instrument by mapping the logical space of identity conditions first, allowing the positions to emerge as the only coherent survivors of each branching path.

  We begin at the root of the tree with the most fundamental division, which concerns the reality of the subject itself. The first question we must pose to your readers is this: when we ask whether a person survives a change or a trauma, is there a fact of the matter about whether they are still present, or is this merely a manner of speaking about memory and social convenience? If the reader answers that there is no fact of the matter, that talk of a self is just a useful fiction for tracking behavior and responsibility, they arrive immediately at the eliminativist leaf. This position holds that there is nothing there to distribute, and no further questions about brains or patterns are relevant. However, if the reader insists that there is a fact of the matter, that survival is a real phenomenon and not just a figure of speech, we proceed to the second node.

  Here we must determine the boundary of the entity that survives. The question is: does the persistence of the person strictly require the persistence of the specific biological organism that currently embodies them? To answer this, invite the reader to consider the case of the person in advanced dementia alongside the carers who hold what remains of their characteristic patterns. If the reader judges that the person is still present primarily because the biological body is alive, regardless of the loss of psychological continuity, they are directed toward the animalist view. For the animalist, you are the living organism and nothing more, and the presence of carers or retained habits is incidental to the identity of the organism itself. However, if the reader judges that the person might be gone despite the living body, or conversely, that the person could survive the destruction of the body provided something else continues, they must move to the third node. This step also separates the animalist from the substance dualist, for whom the survival of the organism is not strictly necessary, provided the immaterial subject persists. To make this distinction clear without asking about substances directly, we ask: is it metaphysically possible for the person to survive the total destruction of the biological organism? If the reader says no, identity is bound to the biology, confirming animalism. If they say yes, identity is bound to something else, and we proceed.

  At the third node, we must identify what that something else is. The question is: is the persistence of the person strictly tied to the persistence of psychological continuity, such as memories, habits, and character traits? Here we use the dementia case again but focus on the loss of mind rather than the presence of body. If the reader says that the person is gone when the psychology is gone, even if the organism lives, they affirm that psychology is essential. This separates them from the view that the self is a simple indivisible thing that cannot be divided or shared. The proponent of the simple view holds that the self is the subject of experience itself, which might persist even if all psychological content is wiped clean; for them, the loss of psychology in dementia is a loss of access to the self, not the loss of the self. If the reader insists the self remains despite total psychological erosion, they arrive at the simple view leaf. If they agree that psychology is essential, we move to the fourth node.

  Now we enter the territory where Hofstadter resides, alongside the standard psychological continuity theorist. The question is: can the thing that makes you you be fully present in two distinct physical locations simultaneously? To test this, present the hypothetical procedure that copies a fraction of your neural pattern into a second brain while you remain conscious and intact, as well as the case of the patient whose hemispheres have been surgically separated. If the reader insists that identity is a one-to-one relation, such that you can only be where the original causal chain remains uninterrupted, they are led to the psychological-continuity view with a no-branching rule. For this reader, copying is fission and fission is death; even if the copy is psychologically identical, the existence of two candidates means neither is the original, or identity becomes indeterminate. This view treats the self as unique and non-shareable. However, if the reader allows that the self can be present in multiple locations, perhaps in split hemispheres or in the copy, we proceed to the fifth node.

  At this stage, we must distinguish between those who think distribution is a matter of degree and those who think it is all-or-nothing. The question is: when the self is present in multiple locations, is this presence an absolute state or a matter of degree? Here you should deploy the case of a marriage of forty years in which each spouse has absorbed the other's habits of thought, and the teacher whose way of thinking has been taken up by a generation of students. If the reader maintains that the self is either present or absent, even across multiple brains, they hold a view of distributed identity that is binary. However, if the reader agrees with Hofstadter that the self can be present in partial and degraded form, more strongly in the spouse than in the student, they arrive at the degreed-pattern view. This is the leaf you are most interested in cultivating, where the self is a pattern that refers to itself and can be instantiated variably across different substrates.

  Finally, for those who accept distribution, we must locate the criterion that determines where the self is. The question is: is the determination of who is who made primarily by internal cognitive structures or by the interpretive stance of others? This is where we separate the Hofstadterian from the social externalist. Consider the person in advanced dementia alongside the carers again. The Hofstadterian says the self is distributed because the carers literally host the neural patterns of the patient within their own brains; the criterion is internal to the carers' minds. The social externalist, however, holds the view that a self is whatever the surrounding community of minds tracks and models, so that the criterion is not inside the head at all but in the social weave. If the community stops tracking the patient as a person, the person ceases to exist, regardless of the patterns in the carers' heads. If the reader prioritizes the internal pattern, they land on the degreed-pattern view. If they prioritize the social tracking, they land on the social community view.

  We must also address the case in which the original is destroyed after the copy is made, to ensure distribution is doing independent work and not simply masking the old duplication problem. For the degreed-pattern viewer, the destruction of the original does not erase the partial survival in the copy; the self continues in a degraded form. For the no-branching psychological continuity viewer, the destruction of the original after copying still counts as death because the branching event broke the unique identity chain. For the animalist and the simple view proponent, the destruction of the original is obviously death. This case confirms that the degreed-pattern view is distinct because it allows for survival through copying where others do not.

  Regarding the logical space, there are combinations of answers that remain unoccupied. For instance, there is no coherent position that affirms the self is strictly biological yet can be distributed across non-biological substrates. If one answers yes to the question of whether persistence requires the biological organism, one cannot consistently answer yes to whether the self can be present in two distinct physical locations if one of those locations is not the original organism. This node is empty because it is incoherent to claim identity is bound to a specific organism while simultaneously claiming it can exist outside that organism. Similarly, there is no occupied leaf for a view that claims the self is a simple indivisible substance yet can be distributed across multiple brains. The definition of a simple substance is that it lacks parts and cannot be divided; to say it is distributed is to say it is divisible, which contradicts the premise. This space is empty due to logical contradiction.

  I must also flag a pair of leaves that this instrument struggles to distinguish without further metaphysical probing. The animalist view and the simple indivisible view may converge on almost all practical cases provided in your list. In the dementia case, both say the person remains. In the copy case, both say the copy is not the person. In the destruction case, both say the person dies. They are only separated by the hypothetical question of whether survival without the biological organism is metaphysically possible. If your readers are unwilling to engage with hypotheticals about disembodied survival, these two positions will appear identical in their practical judgments. You should note this convergence in your seminar, as it highlights that animalism and substance dualism often function as functional equivalents in secular, biological contexts, differing only in their modal commitments.

  This tree should allow your students to locate themselves without needing to know the history of the debate beforehand. By answering questions about cases they can intuitively grasp, they will find themselves led to a position that they may then recognize as animalism, or dualism, or the Hofstadterian pattern view. The goal is to show that the view you wish to discuss is not an isolated aphorism but a specific coordinate in a logical space defined by boundaries, divisibility, and locus of criteria. I hope this serves as a robust foundation for your seminar.

  Warmly,

  Your Colleague
