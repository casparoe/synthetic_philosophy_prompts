          1.  It's just Evidential Decision Theory (EDT) in disguise.
          2.  It's about defining the "cooperation radius" (which agents count as correlated).
          3.  It collapses under uncertainty (if you aren't sure the other is superrational).
      *   **Constraints:** 1 year of evenings/weekends, conceptual work only (no empirical ML), no reading lists/citations (wants arguments), needs a ranked shortlist of questions, criteria explanation, trade-offs, and potential update conditions.
      *   **Goal:** Determine which open questions to prioritize, evaluate the three framings, and decide if the "cousins" angle is a distraction.

  2.  **Deconstruct the Three Framings:**
      *   *Framing 1 (EDT in a hoodie):* EDT says choose the action that gives the best expected outcome given the evidence that you took that action. If my action is evidence that the other agent (who is similar) takes the same action, EDT cooperates. *Critique:* EDT has well-known problems (Newcomb's problem, smoking lesion). Is superrationality just EDT applied to game theory? Mostly yes, but the "cousins" angle adds a degree of correlation ($P(\text{other}=C | \text{me}=C) = 0.9$ vs $1.0$). This framing is strong but might miss the *mechanism* of correlation.
      *   *Framing 2 (Cooperation Radius):* This is about reference classes. Who counts as "me"? This is the "Reference Class Problem." It's crucial for the "cousins" case. If I'm 90% similar to Agent B, do I treat their payoff as partially mine? This seems like the most fertile ground for the user's specific interest.
      *   *Framing 3 (Uncertainty Collapse):* If I'm not 100% sure they are superrational, do I defect? This is the "robustness" problem. In real AI deployments, certainty is impossible. This is a practical blocker.

      *   *Verdict on "Cousins vs. Twins":* It is *not* a distraction. It is the actual real-world problem. Twins are a toy model. Cousins are the reality of LLMs. However, "superrationality" specifically often relies on logical identity. If they aren't logically identical, the "logical causation" argument weakens. We need to shift from "logical identity" to "probabilistic correlation."

  3.  **Identify the Core Philosophical/Technical Tension:**
      *   Superrationality (Hofstadter) $\approx$ Logical Decision Theory (LDT) / Timeless Decision Theory (TDT).
      *   The "Twins" assumption allows for *logical* dependence (my output *is* their output).
      *   The "Cousins" assumption implies *statistical* dependence (my output predicts theirs with probability $p < 1$).
