prompt: |-
  I'm a backend engineer, no philosophy degree, just alot of reading on the side, and I've fallen down a rabbit hole on superrationality. You know the idea: in a one-shot prisoner's dilemma, two agents who each know the other is rational and knows they're rational should just both cooperate, because each would reason their way to the same answer and they both know it. What bugs me is that the standard version quietly assumes the two players are basically identical twins — same source code, same reasoning, same conclusion. But the case I actually care about is AI agents (and honestly also two teams of humans leaning on the same models) that are correlated without being identical: two agents fine-tuned on heavily overlapping data, or trained on the same human feedback, so their policies are more like cousins then twins. A friend said that's just evidential decision theory wearing a hoodie, another said the real crux isn't similarity at all but where you draw the line around the set of agents whose decisions you're willing to treat as correlated with yours — he kept calling it the "cooperation radius" — and a third said the whole thing collapses the moment you admit you're not certain the other guy is a superrationalist. So now I have three half-baked framings and no idea which one is load-bearing.

  Here's what I'm actually asking. I've got maybe a year of evenings and weekends to work on this, purely conceptually — I can code but I don't want to do empirical ML work. Which open questions in this area should I prioritize, and in what order? I care much more about the reasoning than the list: for each question, why it's upstream of the others, whether it's tractable for someone self-taught with no formal background, whether it's already been picked clean so it isn't worth my time, and what I'd learn in the first month or two that would move it up or down the ranking. I'd also like you to say which of the three framings above you think is a dead end, and why — including the possibility that "superrationality toward near-but-not-identical agents" is just ill-defined and I should drop it. Please don't hand me a reading list or citations, I can't check them and I'd rather have your actual arguments. Concretely: (a) a ranked shortlist of the 3-5 questions that matter most, with the criteria you're using spelled out (importance, tractability, neglectedness, how many other questions hang on the answer), (b) the trade-offs between those criteria as you see them, and (c) what argument or piece of evidence over the next year would change the ordering. And if you think the cousins-vs-twins angle is a distraction from some more important question in this space, say so and make the case.
