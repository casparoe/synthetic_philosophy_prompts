prompt: |-
  I'm writing a seminar paper for a metaethics course and I actually want to argue *for* something rather than just survey the field, so I'm hoping you can help me build the case properly. Quick background: our unit was on idealized-deliberation views of normativity, the family that says what you ought to believe or do is fixed by what some improved version of you would settle on — better informed, more coherent, not self-serving, unlimited time, whatever. My prof kept talking about what he calls the two dials, and I think it's a useful picture: there's the information dial (how much more the ideal agent knows than you do) and the procedure dial (how much better she is at reasoning with whatever she happens to know). His throwaway claim, which he never bothered to defend, was that only the procedure dial can do any normative work. Crank the information dial by itself and you've just described an oracle — what an oracle tells you is a fact about the world, not a standard for your beliefs — whereas the normative oomph has to come from the fact that the ideal agent is reasoning well from *your* evidence, and that's the procedure dial. Concrete case I keep coming back to: I'm bad at base rates and I'm trying to figure out whether my friend is lying to me. Is the norm for me "what I'd believe if I could actually do the Bayesian thing on the evidence I have," or is it "what someone who knew everything would say"? Those come apart and I don't think they can both be doing the work.

  So here's what I need: make the strongest case that the procedure dial is the only one that can ground normativity. The catch is it has to survive the comeback I know is coming, namely that you can't turn the procedure dial up very far before you've changed the subject — a perfect reasoner with unlimited working memory and no biases isn't a better version of me, she's a different thing, and then why would her conclusions bind me any more than the oracle's do? And if you keep her close enough to still be recognizably me, the view seems to collapse into "you're justified in believing what you'd believe if you reasoned correctly from your evidence," which sounds circular since reasoning correctly is exactly what we were supposed to be analyzing. So the argument needs to (a) genuinely rule the information dial out, and (b) show the procedure dial can carry real weight without either drifting into changing-the-subject or collapsing into triviality. I don't need any citations or reading suggestions, just give me the argument itself, in your own words, and flag honestly where you think it's weakest — I'd rather find the holes now than in front of the seminar. We've been arguing about this at the bar after class for two weeks and I've got a bet riding on it.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Goal:** Argue *for* the claim that only the "procedure dial" (reasoning competence) can ground normativity in idealized-deliberation views, while the "information dial" (knowledge/evidence) cannot.
      *   **Context:** Metaethics seminar paper. The professor claimed this without defense. The user wants to defend it.
      *   **Key Distinction:** Information Dial (Oracle-like, knows more facts) vs. Procedure Dial (Reasons better with *your* facts).
      *   **Concrete Case:** Base rates/lying friend. Is the norm "what I'd believe if I did Bayesian math on *my* evidence" (Procedure) or "what someone who knew *everything* would say" (Information)?
      *   **The Catch/Objection:** If you idealize procedure too much, you change the subject (it's no longer "me"). If you keep it close to "me," it becomes circular/trivial ("believe what you'd believe if you reasoned correctly").
      *   **Requirements:**
          1.  Make the strongest case for Procedure-Only Normativity.
          2.  Rule out the Information Dial.
          3.  Avoid the "Changing the Subject" trap.
          4.  Avoid the "Triviality/Circularity" trap.
          5.  Flag the weakest points honestly.
          6.  No citations/reading suggestions, just the argument.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Ideal Advisor Theories:* What makes an action/belief right? That my ideal self would recommend it.
      *   *The Information Problem:* If the ideal self knows things I don't (e.g., the friend *is* lying), their advice is based on facts inaccessible to me. Following them requires me to have access to those facts, which I don't. Therefore, their conclusion isn't a *norm* for me, it's just a report on reality.
      *   *The Procedure Problem:* If the ideal self just reasons better with *my* evidence, are they just me + logic? If so, isn't "reason correctly" just defining the norm rather than grounding it?
      *   *The Identity Problem:* If the ideal self is too perfect, why do I care? If they are too similar, where's the normativity?

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Step 1: Ruling out the Information Dial (The "Oracle Objection").**
          *   *Idea:* Normativity is about guidance. You can't be guided by facts you can't access.
          *   *Argument:* If the ideal agent knows $p$ (that the friend is lying) and I don't, their belief is justified by $p$. My belief cannot be justified by $p$ because I don't have $p$. Therefore, their belief state isn't a standard *for me*. It's a description of the world. Normativity requires a bridge between the agent's current state and the target state. Information breaks that bridge.
          *   *Refinement:* Distinguish between *truth* and *justification*. The Information Dial leads to truth. The Procedure Dial leads to justification. Normativity is about justification (what you ought to believe given your position), not just truth.

      *   **Step 2: Defending the Procedure Dial (The "Competence Constraint").**
          *   *Idea:* Normativity comes from fulfilling one's own cognitive potential, not transcending one's epistemic position.
          *   *Argument:* The "ought" implies "can" (in a soft sense). I cannot access new evidence instantly. I *can* (in principle) process existing evidence better. Therefore, the norm must lie in the processing, not the input.
          *   *Key Move:* The ideal agent isn't a different person; they are the *authoritative version* of the same cognitive agency.

      *   **Step 3: Avoiding "Changing the Subject" (The Identity Constraint).**
          *   *Objection:* A perfect reasoner isn't me.
          *   *Response:* We aren't imagining a god. We are imagining *my* cognitive machinery functioning without glitch. It's like a healthy body vs. a sick body. The healthy body is still *my* body. The ideal reasoner is my agency without the noise (bias, fatigue, working memory limits).
          *   *Crucial Distinction:* Idealizing *capacity* vs. Idealizing *nature*. We keep the nature (values, starting evidence, cognitive architecture) but fix the capacity (bugs, glitches).

      *   **Step 4: Avoiding Triviality (The Non-Circularity Constraint).**
          *   *Objection:* "Believe what you'd believe if you reasoned correctly" is just "Believe correctly."
          *   *Response:* It's not defining the norm; it's locating the *source* of the norm. The norm isn't "logic." The norm is "fidelity to your own agency." The idealized deliberator reveals what your own commitments *already* entail, which you are currently failing to see due to procedural noise. It's explanatory, not definitional. It explains *why* you ought to believe $p$: because $p$ is where your own take on the world leads, if unobstructed.

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is the "Ought implies Can" too strong? Maybe. Let's frame it as "Guidance."
      *   *Critique:* Is the distinction between Information and Procedure clear? Yes, Information = Input, Procedure = Processing.
      *   *Critique:* How to handle the "Triviality" worry best? Emphasize that the ideal self provides a *criterion of assessment*, not a definition. It allows for criticism of current self.
      *   *Weakness:* The biggest weakness is usually the "Identity" condition. At what point does fixing working memory make you a different agent? I need to flag this clearly.

  5.  **Structuring the Output:**
      *   **Introduction:** Set up the "Two Dials" and the thesis (Procedure Only).
      *   **Part 1: The Case Against Information (The Guidance Constraint).** Why more knowledge breaks the normative link.
      *   **Part 2: The Case For Procedure (The Agency Constraint).** Why better reasoning preserves the link.
      *   **Part 3: Surviving the Objections.** Addressing "Changing the Subject" and "Triviality."
      *   **Part 4: The Weak Points.** Honest assessment of where the argument might fail (as requested).

  6.  **Drafting the Content (incorporating the "Bar Bet" tone):**
      *   Keep it rigorous but accessible.
      *   Use the "lying friend" example.
      *   Ensure the "Triviality" response is sharp (it's about *authority*, not definition).

  7.  **Final Review against Constraints:**
      *   Did I argue *for* the procedure dial? Yes.
      *   Did I rule out information? Yes.
      *   Did I address the "changing subject" and "triviality" objections? Yes.
      *   Did I flag weaknesses? Yes.
      *   No citations? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to conflate "evidence" with "information." The Information Dial adds *facts* (truths about the world). The Procedure Dial uses *your evidence* better. I must make sure the distinction holds. If the Information Dial just means "you found more evidence," that's different from "you know the truth." The prompt implies the Information Dial is about knowing the *outcome* or hidden facts (Oracle). I will stick to that interpretation as it's the strongest target.

  Let's refine the "Triviality" response. The worry is: "You ought to believe what you would believe if you reasoned correctly" = "You ought to believe what you ought to believe." To avoid this, the argument must show that the Ideal Self's conclusion is *substantive*. It reveals commitments I didn't know I had. It's like a map: "Go where the road leads" isn't trivial if I don't know where the road leads. The Ideal Self sees the road.

  Okay, ready to write.
answer: |-
  Here is the argument structured for your paper. It is designed to be punchy, philosophically rigorous, and directly responsive to the "Two Dials" framework your professor introduced.

  ### The Thesis: Normativity Resides in Fidelity, Not Omniscience

  The core claim is this: Normativity is essentially about **guidance**. For a standard to be normative for an agent, it must be possible for that agent to be guided by it. The Information Dial destroys the possibility of guidance, while the Procedure Dial preserves it. However, to avoid triviality, the Procedure Dial must be understood not as a definition of correctness, but as a test of **agential fidelity**.

  Here is the case built in three moves.

  ---

  ### Move 1: Ruling Out the Information Dial (The Guidance Constraint)

  The argument against the Information Dial rests on the distinction between *truth* and *justification*.

  Imagine your "lying friend" case. You have a specific set of evidence $E$ (their shifty eyes, inconsistent story, past history).
  *   **Information Dial Up:** Your ideal self knows the fact $F$ (that the friend is actually lying).
  *   **Procedure Dial Up:** Your ideal self knows only $E$, but processes it flawlessly.

  If you turn up the Information Dial, your ideal self believes "He is lying" because they know $F$. But you do not know $F$. If you try to adopt their belief, you are trying to base a belief on a fact you do not possess. You cannot be guided by $F$. You can only be guided by your access to $F$.

  If the norm is "Believe what the Information-Ideal self believes," the norm is effectively "Believe the truth." But "Believe the truth" is not a usable norm for a finite agent. It offers no traction. It turns the ideal agent into an Oracle. An Oracle's output is a report on the world, not a standard for your reasoning. If I ask, "What ought I to believe?" and the answer is "Whatever is true," I haven't been given a norm; I've been given a tautology.

  Therefore, the Information Dial cannot ground normativity because it severs the link between the agent's current epistemic position and the target state. It demands I occupy a perspective I cannot occupy. Normativity requires a bridge; the Information Dial burns the bridge.

  ### Move 2: Defending the Procedure Dial (The Agency Constraint)

  If the Information Dial is out, the Procedure Dial must carry the weight. But why does *better reasoning* create an "ought"?

  The argument here is that normativity is rooted in **agential integrity**. You are a reasoning agent. Your cognitive system is designed to track truth via evidence. When you reason poorly (ignoring base rates, succumbing to bias), you are violating the functional standards of your own agency. You are glitching.

  The Procedure-Ideal self is not a different person; she is **you without the noise**. She shares your evidence, your values, and your cognitive architecture, but she lacks the processing errors (working memory limits, fatigue, emotional interference).

  Why does her conclusion bind you? Because her conclusion represents what **your own commitments entail**. When you fail to reason correctly, you are in a state of internal conflict: your evidence supports $P$, but you believe $\neg P$. The Procedure-Ideal self resolves this conflict in favor of your own evidence. To ignore her is to ignore what your own mind is telling you.

  This avoids the Information problem because the input ($E$) is identical. The only difference is the processing. Since you *could* (in principle) process $E$ better, this standard is actionable. It satisfies the Guidance Constraint.

  ### Move 3: Surviving the Objections (Identity and Triviality)

  This is the hard part. You identified the two fatal traps: **Changing the Subject** (Ideal self is too different to be me) and **Triviality** (Ideal self is just me saying "be correct").

  #### 1. Avoiding "Changing the Subject"
  The objection: If you remove all biases and give me unlimited working memory, am I still *me*? Or am I a logic machine?

  **The Response:** We must distinguish between **constitutive features** and **performance errors**.
  *   **Constitutive:** My values, my specific evidence, my fundamental cognitive architecture (e.g., I am a visual learner, I care about loyalty).
  *   **Performance Errors:** Forgetting a premise mid-argument, falling for a known fallacy, letting hunger dictate belief.

  The Procedure Dial only fixes performance errors. It does not change constitutive features. A pianist playing a piece perfectly is not a "different person" than the pianist playing it with mistakes; the perfect performance is the *realization* of the musician's agency, not its negation. Similarly, the Procedure-Ideal self is the realization of your epistemic agency. As long as we hold the *input* (evidence/values) fixed, the *output* belongs to you.

  #### 2. Avoiding Triviality
  The objection: "You ought to believe what you would believe if you reasoned correctly" just means "You ought to believe correctly." This is circular. It defines the norm rather than grounding it.

  **The Response:** This looks circular only if you think the Ideal Self is a definition. It is not; it is a **criterion of assessment**.
  Consider a map. If I say, "You ought to go where the road leads," that sounds trivial. But if I say, "You ought to go where the road leads *as shown on this accurate map*," that is substantive. The Ideal Self is the map.

  Currently, you don't know where your evidence leads. You are lost in the woods of your own biases. The claim "Believe what your Ideal Self would believe" is not defining "correct"; it is pointing to a **stable point of reflection** that exists independently of your current confused state. It allows for the possibility that you are wrong *even by your own lights*.

  It avoids triviality because it allows for **self-criticism**. If the norm were just "Believe correctly," you couldn't criticize yourself without already knowing the answer. But by referencing the Ideal Self, you can say: "I know I am not reasoning well right now. I need to simulate what I would conclude if I weren't tired/angried/rushed." That is a substantive, non-trivial heuristic for improvement. It grounds the "ought" in the gap between your actual performance and your potential performance.

  ---

  ### The Weak Points (Where You Might Lose the Bet)

  You asked for honesty on the vulnerabilities. Here are the three places this argument is most likely to crack under pressure:

  **1. The "Constitutive vs. Performance" Line is Blurry.**
  The argument relies on being able to separate "me" (constitutive) from "my bugs" (performance). But cognitive science suggests some "bugs" are features. For example, is "availability heuristic" a performance error to be dialed away, or is it a constitutive part of how human brains *must* work to function at all? If you dial away all heuristics, do you get a better version of *you*, or do you get a cold calculator that no longer shares your values? If the latter, you've changed the subject.
  *   *Risk:* The opponent argues that you can't turn the Procedure Dial up without accidentally turning the Information Dial (because better reasoning requires different cognitive hardware, which changes the agent).

  **2. The "Ought Implies Can" Tension.**
  I argued that the Procedure Dial works because you *can* reason better. But can you? If you have a cognitive limitation (e.g., low working memory capacity), is it really true that you *ought* to reason like someone with high working memory? If I physically cannot hold five variables in my head, is it a normative failure to miss a conclusion that requires five variables?
  *   *Risk:* If the Ideal Self has capacities you literally cannot achieve, the Guidance Constraint fails. The view collapses into "You ought to be someone else." You need to argue that the Ideal Self represents *your* capacities functioning optimally, not *new* capacities. That is a hard line to walk.

  **3. The Explanatory Gap.**
  Even if you avoid triviality, does this actually explain *why* you ought to believe it? Saying "Your ideal self believes $P$" explains that $P$ is coherent with your evidence. But why *ought* you to be coherent? The view assumes that rationality is normative. It doesn't explain *why*.
  *   *Risk:* A skeptic can say, "Okay, my ideal self believes $P$. So what? Why should I care about being coherent?" The Procedure-Only view answers "Because it's *you*," but a hard skeptic might say, "I don't care about that version of me." This is the classic "Why be rational?" problem. Your argument handles the *structure* of the norm, but it might not satisfy someone demanding the *source* of the norm's authority.

  ### Summary for the Paper
  To win this, you must hold the line that **normativity is internal**. The Information Dial makes the norm external (dependent on facts outside your ken). The Procedure Dial keeps it internal (dependent on the management of your own mind). The cost is that you must define "you" carefully enough to avoid changing the subject, but loosely enough to allow for improvement. If you can define the Ideal Self as "The agent who fully realizes your current epistemic commitments," you win. If they define the Ideal Self as "A god with your name tag," you lose.
