      *Wait, one more thought:* Is there a way to argue that memory loss *is* cyclical? Only if the *capacity* to remember is fixed. But the prompt asks me to take a side. The "Kills Cyclicality" side is more analytically rigorous. I will stick with that. It allows me to critique the modern defenders of cyclical history who soften the hard determinism of the ancients.

      *Let's sharpen the thesis:* The "institutional memory" defense is a category error. It mistakes *epistemological failure* (forgetting) for *ontological recurrence* (becoming). By grounding the cycle in human fallibility, it renders the circle porous and leaky, turning the wheel of history into a ratchet that slips.

