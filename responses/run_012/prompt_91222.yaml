prompt: |-
  Last night my friend Nadia and I spent about three hours arguing about whether the numbers count, and we went to bed each convinced the other one was being dense. She's an aggregationist: five lives saved beats one, that's it, and she thinks the coin-flip move is cowardice dressed up as respect. I'm on the other side. I don't see how you justify to the one person that they have to be the one, and I don't think five seperate losses get to add up into one big loss that outweighs theirs.

  You're a moral philosopher who works on the ethics of rescue and the aggregation problem, so I want you to write the document we should have written instead of shouting at each other: a joint statement of an adversarial collaboration between an aggregationist and a numbers skeptic, that both of us could actually put our names to. Don't give me a reading list or citations, assume I know the literature. Think carefully, and please brainstorm in a scratch area first before you write anything.

  What I want in it:

  - A numbered section of claims we both accept, about the structure of the choice, about what each of us is committed to, and about the cases. They need to be substantive, not truce-y mush.
  - Then a disagreements table: each remaining disagreement stated in a formulation the side that holds it would accept, plus what I'd have to give up if I'm wrong and what she'd have to give up if she is.
  - Then the cruxes, the sub-questions where settling it would actually move one of us. For each, a case, test, or argument we'd both agree bears on it, with both sides' predictions written down in advance.
  - Tell me if part of our fight is verbal. I suspect a chunk of it is definately whether the numbers counting means more deaths is worse, versus it means I have decisive reason to save the many. If that's the split, say so, and say which parts of the dispute survive it.

  Some things I want you to build in rather than just report on, because we got stuck exactly here:

  - Instead of a coin flip giving the lone person 50/50 against the group, what about a lottery that gives all six an equal one-in-six chance? Which of us should want that, and if the coin-flipper rejects it, on what grounds?
  - The stakes aren't equal: the one will be blinded, the five will each lose a hand. What does each side say, and does the numbers claim survive?
  - Same six people, same outcomes, but the choice reaches me as five separate one-on-one decisions rather than one five-against-one decision. Does either verdict change with the framing, and is that a problem for either of us?
  - And the one where I'm the one: I'm the person who dies if we save the five. Predictions from both sides.

  End with a line each of us could sign, and be honest if the document shows we don't have a real disagreement left.
