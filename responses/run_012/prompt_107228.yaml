  7.  **Final Review of the "Theory Killer":** Is it really Answerability/Accountability? Or is it the Science constraint? The Science constraint kills Libertarianism (mostly). The Answerability/Accountability split kills Retributivism. The Manipulation constraint kills Compatibilism. Which is the "most work"? The **Manipulation/Sourcehood** constraint is currently the most active battlefield in the literature (Mele, Pereboom, etc.). I will select that one, but nuance it: it's the demand for a *non-arbitrary cutoff* between engineered and ordinary causation.

