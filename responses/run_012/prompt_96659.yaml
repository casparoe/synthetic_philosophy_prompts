      *   **Position B (Realist/Structuralist?):** Underdetermination is permanent/ineliminable. Non-evidential factors (values, funding, taste) decide. *Crucial Twist:* The real problem isn't choosing between existing rivals, but the *unconceived alternatives* (theories nobody has thought of yet).
      *   **Requirement:** Include a concrete case study (e.g., Dark Matter vs. Modified Gravity) in the middle.
