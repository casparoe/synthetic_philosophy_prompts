answer: |-
  **Setting:** *The lounge bar of a generic conference hotel. It is 11:30 PM. The carpet is patterned to hide stains. Two philosophers, ELIAS and MARA, are nursing the last of their drinks. A name badge lies face down on the table between them.*

  **Elias:** (Swirling his whiskey) I thought today's panel on structural realism was decent, until the Q&A turned into a séance. Everyone summoning the ghost of Duhem.

  **Mara:** You mean the underdetermination question? I thought it was the only honest moment of the day.

  **Elias:** Honest? It was defeatist. This idea that evidence never truly forces a theory's hand. It's a philosopher's anxiety, not a scientist's. In the lab, underdetermination is just a waiting room. You walk in, the data is ambiguous, you wait. You build a better spectrometer, you wait some more. Then the data speaks. The ambiguity dissolves.

  **Mara:** That's the transient view. "Just wait for better tech." It's comforting, Elias. It assumes the truth is sitting there in the dark, waiting for a brighter torch.

  **Elias:** Isn't it?

  **Mara:** Not necessarily. Because when the evidence runs out—and it always runs out, eventually—you don't pick the theory because the world forced you to. You pick it because of *taste*. Because one theory is simpler. Because it fits better with the metaphysics you grew up on. Because the guy who invented it has a bigger grant.

  **Elias:** (Leans forward) Come on. Simplicity isn't just taste. If Theory A explains the anomaly with three equations and Theory B needs thirty, Theory A is winning because nature *is* parsimonious. That's a bet on reality, not a aesthetic preference.

  **Mara:** Is it? Or is it that we can't cognitively handle thirty equations? We value parsimony because we're human, not because the universe is efficient. When the data is silent, social values step in to break the tie. That's the permanent underdetermination. The evidence doesn't decide; *we* decide, using non-evidential criteria.

  **Elias:** You're making science sound like a fashion show. "This season, we're wearing String Theory." But look at history. The ether wasn't rejected because it went out of style. It was rejected because Michelson and Morley built an interferometer that showed the earth doesn't move through it. The instrument killed the rival.

  **Mara:** Did it? Or did it just kill the *version* of the ether they were testing? Look, let's get concrete. You want a current case? Dark Matter.

  **Elias:** Perfect. We have galactic rotation curves that don't match the visible mass. We have two main rivals: Dark Matter (invisible stuff) or Modified Gravity (MOND, our laws of gravity are wrong at low accelerations).

  **Mara:** Exactly. Empirically equivalent so far, mostly.

  **Elias:** *Mostly* is doing a lot of work. But the gap is closing. We're building detectors like XENONnT, deeper underground, shielding out the noise. If we detect a WIMP—a Weakly Interacting Massive Particle—game over. Modified Gravity is dead. The instrument resolves the underdetermination. It's not permanent; it's just a technical hurdle.

  **Mara:** Okay, suppose XENONnT finds nothing. Again.

  **Elias:** Then we build a bigger one.

  **Mara:** Or suppose we find a signal, but it's ambiguous. A background noise that *could* be a particle, or *could* be a systematic error in the detector. How do you decide? You'll use a prior. You'll say, "Well, Dark Matter fits the Standard Model better." That's a value judgment. That's consistency with existing theory, not raw evidence.

  **Elias:** It's coherence. It's rational.

  **Mara:** It's conservatism. But here's the thing, Elias, and this is where I think you're looking at the wrong board entirely. You're worried about choosing between Dark Matter and MOND. You're agonising over which of the *existing* cards to play.

  **Elias:** What else is there to choose between?

  **Mara:** The cards nobody has dealt yet. The unconceived alternatives.

  **Elias:** (Sighs) The "we might be wrong about everything" argument. That's not philosophy, that's just skepticism with a thesaurus.

  **Mara:** It's history. Think about the late 19th century. You had Newtonian mechanics. You had thermodynamics. The rivals on the table were about how the ether behaved. Rigid? Fluid? Nobody was sitting in a café in Vienna saying, "You know, maybe space and time aren't absolute." That wasn't a live option. It wasn't a rival theory waiting for better data. It was a conceptual blind spot.

  **Elias:** Sure, history is full of surprises. But that doesn't mean underdetermination is a structural feature of science. It just means we're not omniscient.

  **Mara:** It means the space of possible theories is vastly larger than the space of *conceived* theories. Evidence can tell you that your current theories are wrong. It can never tell you that the *right* theory is among the ones you're currently arguing about.

  **Elias:** So what's the move? Stop doing science until we've imagined every possibility?

  **Mara:** No. The move is to admit that when we say "Evidence supports Theory X," what we really mean is "Evidence supports Theory X *better than Theory Y and Z, which are the only ones we've thought of*." The underdetermination isn't about choosing between the rivals you have. It's about the rivals you don't.

  **Elias:** But that renders the choice inert. If I can always say, "Well, there might be a Theory Q I haven't thought of," then I never have to commit to Theory X. I can just shrug.

  **Mara:** You don't have to shrug. You have to bet. But recognize it as a bet. When you fund the Dark Matter detector over the MOND telescope, you aren't following the evidence. The evidence is compatible with both, and compatible with a third thing we haven't imagined. You're following a sociological consensus. You're betting on the paradigm that keeps the grants flowing.

  **Elias:** (Takes a drink, thinks) I grant you that funding drives focus. But instrumentation *creates* new concepts. The telescope didn't just test Copernicus; it created a new way of seeing the heavens that made the Ptolemaic epicycles look absurd. We don't just test theories; we build environments where new theories become conceivable.

  **Mara:** I agree. But notice what you said. "New theories become conceivable." That implies they *weren't* before. So, at any given time *t*, the evidence underdetermines the theory, because the actual truth might be in the set of inconceivable theories at time *t*.

  **Elias:** But science is a trajectory. It's not a snapshot. If you look at the long arc, the underdetermination shrinks.

  **Mara:** Does it? Or do we just get better at painting over the cracks? Look, I'm not saying we can't know anything. I'm saying the logic of confirmation is leakier than you want to admit. You treat underdetermination as a temporary gap in our knowledge. I'm saying it's a permanent gap in our *imagination*.

  **Elias:** (Pauses, looks at his empty glass) So, if I understand you... the problem isn't that the evidence is too weak to distinguish Dark Matter from MOND.

  **Mara:** Right.

  **Elias:** The problem is that the answer might be something that requires a concept of "mass" or "gravity" we literally don't possess yet.

  **Mara:** Exactly. Like trying to explain Wi-Fi using only the concept of invisible gears. You can tweak the gears forever. You can make them frictionless. You can make them tiny. But you'll never get there.

  **Elias:** That's terrifying.

  **Mara:** It's liberating. It means the next breakthrough isn't going to come from a better detector. It's going to come from someone asking a question we've all agreed is nonsense.

  **Elias:** (Signals the bartender) Another round?

  **Mara:** Please.

  **Elias:** To the unconceived, then.

  **Mara:** (Clinks glass) And to the hope that we survive meeting them.

  **Elias:** Don't push it. I still think the WIMPs are down there waiting.

  **Mara:** And I think you're looking in the dark with a flashlight that only shines on what you already know.

  **Elias:** It's the only flashlight we've got.

  **Mara:** For now.
