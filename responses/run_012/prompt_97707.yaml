  ### Brainstorming and Question Selection

  To sharpen your half-formed idea into a viable research project, we need to move from a general suspicion to a testable hypothesis. Here are three possible ways to frame the question:

  1.  **The Psychological Approach:** Investigate whether agents *feel* differently about low-cost acts compared to heroic sacrifices. This focuses on moral psychology.
      *   *Verdict:* Too empirical for a philosophy seminar; requires surveys or data you cannot gather in eight weeks.
  2.  **The Sociological Approach:** Examine how social expectations define what counts as "beyond the call." This focuses on cultural norms.
      *   *Verdict:* Interesting, but risks becoming sociology rather than normative ethics.
  3.  **The Normative Approach:** Analyze whether the *definition* of supererogation relies too heavily on cost (sacrifice) rather than the type of moral demand (attention vs. action).
      *   *Verdict:* **Most Tractable.** This stays within conceptual ethics, allows for thought experiments, and directly addresses your intuition about "attentive supererogation."

  The following proposal adopts the third approach. It is designed to be rigorous enough for a seminar but scoped realistically for a high school student.

  ***

  ### Research Proposal: Beyond Sacrifice: Reevaluating the Cost Criterion in Supererogation

  **Research Question**
  Does the standard cost-based definition of supererogation fail to account for low-cost acts of social attentiveness, and if so, do these acts constitute a distinct category of supererogation or merely imperfect duties?

  **Introduction and Context**
  In normative ethics, supererogation is traditionally defined as action that is morally good to perform but not morally required to omit. The standard picture illustrates this category with examples of significant sacrifice: rushing into a burning building to save a stranger or donating a kidney to someone in need. These acts are characterized by high personal cost and high moral value. The prevailing argument holds that an act becomes supererogatory primarily because the cost to the agent exceeds the threshold of obligation.义务 (obligation) ends where significant sacrifice begins.

  However, this cost-based criterion leaves a gap in our moral understanding. In everyday life, we frequently praise acts that do not involve significant sacrifice yet seem to exceed what is strictly required. Remembering to ask a grieving friend how they are doing, inviting a marginalized peer to join a group, or offering a specific compliment when silence would be easier are all acts we value highly. We do not typically blame someone for failing to do them, suggesting they are not obligatory. Yet, because they require little cost, they do not fit the standard model of sacrificial supererogation.

  Existing positions in the debate leave this question open because they tend to focus on the magnitude of the cost rather than the nature of the demand. One common position argues that any act that is not strictly required but is morally good must be supererogatory, regardless of cost. A competing position argues that low-cost acts of kindness are actually "imperfect duties." On this view, we have a general obligation to be kind, but wide discretion over how and when to fulfill it. When we perform these small acts, we are simply fulfilling this general duty, not going beyond it.

  The problem with these existing positions is that they may be conflating two different things. The "imperfect duty" view risks making obligation too broad; if remembering a friend's birthday is a duty, then forgetting it becomes a moral failure, which seems too harsh for such a small oversight. Conversely, the standard supererogation view risks making the category too exclusive; if only high-cost acts count, then much of what we consider moral excellence in daily life is left unclassified. There is a need to determine whether "cost" is the only relevant factor, or whether the *type* of moral attention required distinguishes these acts. My project suspects that the standard cost-based criterion is doing too much work and that we need to distinguish between sacrificial supererogation and what I provisionally call "attentive supererogation."

  **Methodology**
  To investigate this question, I will use the method of conceptual analysis supported by constructed test cases. I will not be gathering empirical data or surveying historical texts. Instead, I will construct pairs of scenarios to test our moral intuitions regarding blame, praise, and requirement.

  First, I will establish a baseline using paradigmatic cases. I will compare a high-cost supererogatory act (e.g., physical rescue) with a high-cost obligatory act (e.g., repaying a large debt) to isolate the variable of optionality. Second, I will introduce the low-cost cases. I will construct a scenario involving "social attentiveness," such as noticing a colleague is excluded and inviting them to lunch. I will then vary the cost slightly to see where the intuition shifts. For example, does the act remain supererogatory if inviting the colleague requires skipping a preferred activity?

  To determine whether a proposed category is genuine or merely a relabeling of imperfect duty, I will apply a "blame test." If an agent fails to perform the act, is blame appropriate?
  *   If blame is appropriate, the act is likely obligatory (perfect or imperfect).
  *   If blame is inappropriate, but praise is highly appropriate, the act is likely supererogatory.
  *   If blame is inappropriate and praise is mild, the act may be merely permissible.

  I will look for arguments that try to reduce attentive acts to imperfect duties. I will examine whether the "discretion" involved in imperfect duties matches the discretion involved in attentive acts. Imperfect duties usually allow us to choose *when* to be kind. Attentive supererogation might differ because the opportunity is often unique and time-sensitive (e.g., comforting someone *now*). If the opportunity is non-repeatable, the logic of imperfect duty may not apply. I will analyze whether this temporal specificity changes the moral status of the act.

  **Conditions for Success and Failure**
  A successful result for this project would be a refined definition of supererogation that accommodates low-cost acts without collapsing them into obligation. Success looks like a clear argument showing that "cost" is not the sole determinant of supererogatory status. Specifically, I hope to demonstrate that acts requiring high moral attention but low physical cost constitute a valid sub-category of supererogation. This would involve showing that the "imperfect duty" explanation fails to capture why we praise these acts specifically when they are done spontaneously rather than as part of a general policy of kindness.

  The project would count as failing if I cannot distinguish these acts from imperfect duties. If my analysis shows that every low-cost act of kindness can be explained as fulfilling a general obligation to be benevolent, then my hypothesis about "attentive supererogation" is false. In that case, the successful result would be a negative one: proving that the standard view is correct and that our intuition about these small acts being "special" is mistaken. Another form of failure would be scope creep; if I find myself trying to solve the broader problem of what makes any action obligatory, I will have moved beyond what is possible in this timeframe. I must remain focused on the classification of the acts, not the foundation of obligation itself.

  **Scope and Work Plan**
  This project is designed for an eight-week summer seminar. To remain realistic, I must limit the scope of my inquiry. I will not attempt to survey the history of the concept of supererogation, nor will I engage with meta-ethical questions about whether moral truths exist. I will also leave out empirical questions about why people perform these acts; my focus is strictly on whether the acts *ought* to be classified differently.

  *   **Weeks 1-2:** I will focus on understanding the standard definitions of supererogation and imperfect duty. I will map out the arguments for the cost-based criterion.
  *   **Weeks 3-4:** I will construct the test cases. I will write out detailed scenarios involving social attentiveness and vary the costs and contexts to test my own intuitions and those of peers.
  *   **Weeks 5-6:** I will draft the core argument. I will attempt to argue for the distinction between sacrificial and attentive supererogation and anticipate objections, particularly the objection that these are just imperfect duties.
  *   **Weeks 7-8:** I will revise and polish the paper. I will ensure the terminology is consistent and that the conclusion directly answers the research question.

  By limiting the project to conceptual analysis of specific cases, I can produce a focused paper that contributes a specific angle to the debate. Even if I do not definitively solve the classification problem, demonstrating the tension between low-cost acts and the standard cost-based criterion will be a valuable contribution. This approach allows me to engage with professional-level philosophical debate while acknowledging my position as a student still learning the broader landscape of ethical theory.
