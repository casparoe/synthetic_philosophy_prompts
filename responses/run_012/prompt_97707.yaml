prompt: |-
  You are a professional philosopher specializing in normative ethics and the theory of supererogation. I am a high school student preparing a short research proposal, roughly 1,200 to 1,500 words, for a summer philosophy seminar. I would like you to help me turn a half-formed idea into a polished proposal. Please think carefully and work step by step: begin with a brief brainstorming section in which you identify two or three possible ways to sharpen the question, say which is most tractable for a high school student working over eight weeks, and then write the proposal itself. Do not include a bibliography, reading list, or citations; I will add those later, and I am not asking you to guess at them. Where you would normally name an author or a work, describe the position or argument instead.

  My half-formed idea is this. The standard picture of supererogation treats it as a category of action that is morally good but not required, and it usually illustrates this with heroic or saintly sacrifice. But many of the acts we actually praise as going beyond what is expected are small and low-cost: remembering to ask a grieving friend how they are doing, inviting someone who is always left out, speaking up in a conversation when it would be easier not to. These acts do not seem to require great sacrifice, and yet they also do not seem to be simply obligatory. I suspect the standard cost-based criterion is doing too much work, and that we need to distinguish between sacrificial supererogation and something like attentive supererogation. But I am not sure whether the second category is real, or whether it collapses into imperfect duty, or into ordinary obligation with a very low threshold.

  Please write the proposal so that it includes: first, a precise statement of the research question, ideally one that has a determinate answer; second, an explanation of why the existing positions in the debate leave the question open, described in terms of arguments and distinctions rather than names and citations; third, the method I would actually use, including what I would look for in the arguments, what test cases I would construct, and how I would tell whether a proposed category is genuine or merely a relabeling of something already recognized; fourth, what a successful result would look like and what would count as the project failing; and fifth, a realistic scope for an eight-week high school project, including what I should probably leave out. The proposal should be written in a formal, academic register, but it should be clear that the author is a high school student who is not yet an expert. Do not simply summarize the standard debate; I want the proposal to stake out a specific angle and to explain why that angle is worth pursuing.
