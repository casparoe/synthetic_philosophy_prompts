answer: |-
  Here is the analysis you need for your presentation. I have broken it down by the specific questions you asked, applying the Kripke/Putnam framework directly to the Pluto case.

  ### 1. Discovery vs. Decision: The Nature of the Vote
  You are right that nothing physical changed about Pluto in 2006. The question is whether the *label* "planet" tracks a mind-independent essence (like "water") or a human-made boundary (like "continent").

  If "planet" were a true natural kind term in the Kripke/Putnam sense, the 2006 IAU meeting would have been unnecessary. Consider "Water = H2O." We did not hold a vote to decide if water is H2O. We investigated the world, found the underlying structure, and realized that anything *not* H2O isn't water. If Pluto had a hidden "planet-essence" (say, a specific formation history distinct from Kuiper Belt objects), the 2006 meeting would have been an announcement of a discovery, not a legislative vote.

  The fact that they **voted** proves that "planet" is not functioning as a natural kind term here. It is functioning as a **stipulative definition**. They chose a specific set of criteria (clearing the orbit) and applied it. This makes the 2006 event a decision to use a word differently, not a discovery that Pluto had changed or was misidentified. In Kripkean terms, the reference of "planet" was not fixed by an initial baptism of a natural kind, but by a committee setting boundaries for a category.

  ### 2. Is "Planet" a Rigid Designator?
  **Verdict: No.**

  A rigid designator picks out the same object in every possible world where that object exists. "Nixon" is rigid. "Water" is rigid (it picks out H2O in all worlds).

  "Planet" is not rigid. To test this, we use the "Possible Worlds" test:
  *   **World A:** Our world. The IAU votes in 2006 to require "clearing the orbit." Pluto is not a planet.
  *   **World B:** Identical to our world physically, but in 2006 the IAU votes to define "planet" simply as "any round object orbiting the sun." In World B, Pluto *is* a planet.

  Since the extension of the word "planet" changes depending on human conventions in different possible worlds, it is not rigid. It behaves more like a legal term (e.g., "felony" or "citizen") than a natural kind.

  Consequently, "Dwarf Planet" is not a discovery about Pluto's metaphysical nature. It is a rebrand. It is akin to a zoning committee changing a plot of land from "Residential" to "Commercial." The land didn't change; the rules for describing it did.

  ### 3. The Necessary A Posteriori Problem
  Kripke's famous insight is that some truths are *necessary* (true in all worlds) but *a posteriori* (known only through experience). "Water is H2O" is the classic example. Once we learn the essence, we realize it couldn't have been otherwise.

  Is "Pluto is not a planet" necessary a posteriori?
  *   **Is it A Posteriori?** Yes. We needed telescopes and orbital data to know Pluto shares its orbit with other Kuiper Belt objects.
  *   **Is it Necessary?** No. As shown in the "World B" scenario above, Pluto could have been a planet if the definition were different.

  Because the definition relies on a human vote, the statement "Pluto is not a planet" is **Contingent A Posteriori**. It is true in our world, given our current conventions, but it is not *metaphysically* necessary. This breaks the Kripkean mold. The "vote" introduces contingency. If the truth depends on a majority rule at a conference in Prague, it cannot be necessary in the philosophical sense.

  ### 4. What This Says About the Theory (Mind-Independence)
  This episode exposes a limit in the Kripke/Putnam theory. Their framework works beautifully for things that exist independently of human classification (chemistry, biology, proper names). It struggles with **hybrid categories**.

  "Planet" is a hybrid. It refers to physical objects (mind-independent), but the *category* is defined by human interests (mind-dependent). We care about "clearing the orbit" because it tells a story about the history of the solar system, not because "orbit-clearing" is a magical substance inside the planet.

  **Does the vote wreck the analogy?**
  Yes, it does. The vote shows that "planet" lacks the mind-independence required for the "Necessary A Posteriori" to work.
  *   **Water:** Nature fixes the essence. We just find it.
  *   **Planets:** We fix the essence. Nature just provides the candidates.

  This suggests the theory *does* quietly require natural kinds to be mind-independent. If humans get to vote on the essence, the truth becomes contingent on human sociology, not metaphysical necessity. The theory has nothing to say about categories we invent on purpose, other than to classify them as *not* being natural kinds. That isn't a failure of the theory, but it is a boundary line. Kripke explains how language hooks onto the world; he doesn't explain how language hooks onto our own rules.

  ### 5. The Dissenters: Who is Wrong?
  This is the hardest part. You have Group A (IAU) saying "Pluto is not a planet" and Group B (Alan Stern and others) saying "Pluto is a planet." Both use the same word, same object, different definitions.

  **Can Kripke's theory say who is wrong?**
  **Honestly: No.**

  Kripke's theory of reference relies on a "causal chain." We use the word "water" because we are linked to the original users who pointed at water. But who is the "original user" for planet? The Greeks? Galileo? Clyde Tombaugh?
  *   If the reference was fixed by the Greeks, they meant "wandering star."
  *   If fixed by Tombaugh, he called it a planet.
  *   If fixed by the IAU, they call it a dwarf planet.

  Because "planet" is not a natural kind with a hidden essence, there is no fact of the matter to be wrong *about*. The dissenters are not making a metaphysical error; they are proposing a different **lexical stipulation**.

  Kripke's theory goes quiet here because it is designed to handle disputes about *facts* (Is that water?), not disputes about *definitions* (What counts as water?). When two groups use different definitions for the same word, Kripke doesn't have a mechanism to adjudicate which definition is "correct," because correctness in stipulative definitions is pragmatic, not metaphysical.

  The theory implies that Group A and Group B are effectively speaking slightly different languages. Group A's "planet" means *dynamically dominant body*. Group B's "planet" means *hydrostatically equilibrium body*. They aren't disagreeing about Pluto; they are disagreeing about the word. Kripke's framework identifies this as a verbal dispute, but it cannot solve it.

  ### Summary for Your Presentation
  Here is the straight analysis you can use:

  1.  **The Vote:** Proves "planet" is not a natural kind. It is a stipulative category. If it were a natural kind, a vote would be as useless as voting on whether water is wet.
  2.  **Rigidity:** "Planet" is not a rigid designator. In a possible world where the IAU voted differently, Pluto is a planet. Therefore, the term is contingent on human convention.
  3.  **Necessary A Posteriori:** The statement "Pluto is not a planet" is *not* necessary. It is contingent a posteriori. The Kripkean model fails here because the "essence" was chosen, not discovered.
  4.  **Theory Limits:** This shows Kripke/Putnam's theory requires mind-independent essences to generate necessary truths. "Planet" is mind-dependent, so the theory correctly identifies it as outside the realm of natural kinds.
  5.  **The Dissent:** The theory cannot say who is wrong. It reveals the dissenters are having a verbal dispute, not a factual one. There is no metaphysical fact to settle the argument, only a pragmatic one about which definition is more useful for science.

  **The Bottom Line:** The Pluto episode doesn't break Kripke's theory; it highlights the boundary of where the theory applies. It works for nature (Water/H2O), but it doesn't work for human taxonomy (Planet/Not-Planet). The 2006 vote wasn't a discovery of essence; it was a legislative act of semantics.
