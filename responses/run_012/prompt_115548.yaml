  **Candidate 1**
  "Critics argue that falsificationism isn't itself falsifiable, but that merely elevates it above mere science. It is the metaphysical shield that protects us from the chaos of verification. So please drink to the unscientific rule that keeps us all honest."

  *   **Feature:** Turns on the **self-referential problem** (the criterion of demarcation is not itself demarcated as scientific by its own standard).
  *   **Survivability:** It survives explanation well; a lay reader only needs to understand that he is admitting his core rule breaks its own law, which is inherently ironic.
  *   **Embarrassment:** High. It signals to knowledgeable colleagues that he is aware of the fundamental logical flaw in his zealotry but chooses to dismiss it as a "feature," making him look dogmatic rather than rigorous.

  **Candidate 2**
  "When my prediction failed, I didn't falsify the theory, I simply falsified the telescope. Any failed prediction can be absorbed by adjusting an auxiliary assumption. So technically, the model is perfect and the mirror is lying."

  *   **Feature:** Turns on the **Duhem-Quine thesis** (the impossibility of testing a hypothesis in isolation from auxiliary assumptions).
  *   **Survivability:** Moderate. It requires the reader to grasp that "auxiliary assumption" means "background conditions like equipment," but the context of blaming the telescope makes it clear.
  *   **Embarrassment:** High. It reveals he uses sophisticated philosophy of science not to find truth, but to immunize his own work from criticism, which is the exact opposite of Popper's intent.

  **Candidate 3**
  "Popper claimed astrology isn't science because it makes no testable predictions. But my horoscope said I'd be happy tonight, and looking at this grant report, that prediction is clearly false. So astrology is actually science, it's just as wrong as my last paper."

  *   **Feature:** Turns on the **astrology example** (the critique that astrology is falsifiable but false, rather than unfalsifiable).
  *   **Survivability:** High. The logic is straightforward: a failed prediction proves testability, regardless of the subject matter.
  *   **Embarrassment:** Moderate to High. While it shows philosophical nuance, it equates his professional research with horoscopes, undermining his status at a departmental dinner.
