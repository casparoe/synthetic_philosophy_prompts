  # Session Design: The Reinvestment Game

  ## 1. Overview & Learning Objective
  **Goal:** To demonstrate that divergent takeoff speeds (fast vs. slow) arise not from differences in agent intelligence, but from structural assumptions about **returns to cognitive reinvestment** and **binding bottlenecks**.
  **Constraint:** No use of the term "intelligence explosion" or "AI" until the debrief. The activity is framed as "Research Lab Efficiency."
  **Participants:** 16 (2 Teams of 7 Players + 1 Observer per team).
  **Time:** 90 Minutes.
  **Materials:** Paper tokens (200+), tracking sheets, sealed envelopes, whiteboard, markers.

  ---

  ## 2. Materials List

  1.  **Tokens:** 200 small paper slips per team (cut beforehand). Label them "Insight".
  2.  **Tracking Sheets:** 2 copies (one per Observer). Columns: *Round, Start CL, Income, Spend, End CL, Surplus Tokens*.
  3.  **Sealed Envelopes:**
      *   2 marked **LAB ALPHA**.
      *   2 marked **LAB BETA**.
  4.  **Whiteboard:** Pre-draw two empty graphs (X-axis: Rounds 1-6, Y-axis: Capability 0-40).
  5.  **Cheat Sheets:** Small cards for players showing the arithmetic rules (to prevent calculation delays).
  6.  **The "Critique Log":** A designated space on the whiteboard for recording objections during play.

  ---

  ## 3. The Cards (Sealed Envelopes)

  **Instructions to Facilitator:** Hand one envelope to each team. Tell them: *"These cards define the physics of your lab. They are not identical. Do not show your card to the other team. Do not discuss the rules with the other team."*

  ### LAB ALPHA (The "Fast" Trajectory)
  *   **Starting Capability:** 1
  *   **Income:** At the start of each round, receive Insight Tokens equal to your Current Capability.
  *   **Cost:** Increasing Capability by +1 costs **1 Insight Token**.
  *   **Constraint:** You may purchase unlimited increments per round **UNLESS** your Capability exceeds 15. If Capability > 15, you may purchase max **+5 Capability** per round.
  *   **Goal:** Reach the highest Capability by Round 5.

  ### LAB BETA (The "Slow" Trajectory)
  *   **Starting Capability:** 1
  *   **Income:** At the start of each round, receive Insight Tokens equal to your Current Capability.
  *   **Cost:** Increasing Capability by +1 costs **Current Capability** Insight Tokens. (e.g., to go from 3 to 4 costs 3 tokens).
  *   **Constraint:** No limit on purchases per round.
  *   **Goal:** Reach the highest Capability by Round 5.

  *(Note: Alpha yields exponential growth until the cap hits. Beta yields linear growth.)*

  ---

  ## 4. Roles (Per Team of 8)

  1.  **Lab Chief (1):** The only person allowed to declare spending decisions.
  2.  **Accountant (1):** Manages the token pile. Distributes income, collects spend.
  3.  **Researchers (5):** Verify the Accountant's math. Discuss strategy with the Chief.
  4.  **Observer (1):** **Does not play.** Records the numbers on the Tracking Sheet. Enforces rules. If a player objects to the rules, the Observer writes the objection on the "Critique Log" on the whiteboard and says *"Noted for Debrief."*

  ---

  ## 5. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Grouping** | Divide into 2 teams. Assign roles. Hand out sealed envelopes. **Do not open yet.** |
  | **10-15** | **Rules of Play** | Explain token flow (Income -> Spend -> Track). Emphasize: *"Your goal is to maximize Capability. The rules in your envelope are absolute."* |
  | **15-17** | **Open Envelopes** | Teams read cards silently. Observer confirms everyone understands *their* rules. |
  | **17-42** | **Phase 1 (5 Rounds)** | **5 Minutes per Round.** <br>1. Income distributed.<br>2. Spending decided.<br>3. Observer records.<br>*Facilitator calls time strictly.* |
  | **42-52** | **The Swap** | Collect Alpha cards, give Beta cards (and vice versa). <br>**Crucial:** Teams keep their *current Capability score* and *token hoard*. They only change the *rules*. |
  | **52-67** | **Phase 2 (3 Rounds)** | **5 Minutes per Round.** <br>Observe the friction. The Alpha team will hit the wall immediately. The Beta team will accelerate. |
  | **67-75** | **The Reveal** | Plot the two trajectories on the whiteboard. Reveal that the *players* did not change, only the *cards*. |
  | **75-90** | **Debrief** | Map game mechanics to the philosophical debate. (See Section 7). |

  ---

  ## 6. Payoff Tables (For Facilitator Reference)

  *Use this to verify Observer records and to draw the final graphs.*

  **Lab Alpha (Fast -> Constrained)**
  *   **Start:** CL 1
  *   **R1:** Inc 1, Spend 1, **End CL 2**.
  *   **R2:** Inc 2, Spend 2, **End CL 4**.
  *   **R3:** Inc 4, Spend 4, **End CL 8**.
  *   **R4:** Inc 8, Spend 8, **End CL 16**. (Cap triggers next round).
  *   **R5:** Inc 16, Spend 5 (Cap), **End CL 21**. (11 Tokens Surplus/Wasted).
  *   **Swap to Beta Rules:**
  *   **R6:** CL 21. Inc 21. Cost to +1 is 21. Spend 21. **End CL 22**.
  *   **R7:** CL 22. Inc 22. Cost to +1 is 22. Spend 22. **End CL 23**.
  *   **R8:** CL 23. Inc 23. Cost to +1 is 23. Spend 23. **End CL 24**.
  *(Growth grinds to near halt).*

  **Lab Beta (Slow -> Unconstrained)**
  *   **Start:** CL 1
  *   **R1:** Inc 1, Cost 1, Spend 1, **End CL 2**.
  *   **R2:** Inc 2, Cost 2, Spend 2, **End CL 3**.
  *   **R3:** Inc 3, Cost 3, Spend 3, **End CL 4**.
  *   **R4:** Inc 4, Cost 4, Spend 4, **End CL 5**.
  *   **R5:** Inc 5, Cost 5, Spend 5, **End CL 6**.
  *   **Swap to Alpha Rules:**
  *   **R6:** CL 6. Inc 6. Cost 1. Spend 6. **End CL 12**.
  *   **R7:** CL 12. Inc 12. Cost 1. Spend 12. **End CL 24**.
  *   **R8:** CL 24. Inc 24. Cost 1. Spend 24. **End CL 48**. (Cap triggers next round).
  *(Growth explodes).*

  ---

  ## 7. The Debrief Script

  **Step 1: The Graph (5 mins)**
  Draw the two lines on the whiteboard based on the Observer sheets.
  *   **Line A:** Steep exponential, then kinks flat.
  *   **Line B:** Shallow linear, then kinks vertical.
  *   **Ask:** "Did the people in the room change between Phase 1 and Phase 2?" (No). "Did the 'intelligence' of the lab change?" (No). "What changed?" (The rules of reinvestment).

  **Step 2: Mapping the Mechanics (10 mins)**
  *   **The Token Hoard:** Ask Team Alpha (Phase 1, Round 5): "You had tokens you couldn't spend. What does that represent?"
      *   *Target Answer:* Cognitive capacity exceeding the bandwidth of implementation (hardware, experiments, regulatory approval).
  *   **The Rising Cost:** Ask Team Beta (Phase 1): "Why did you grow slowly?"
      *   *Target Answer:* Low-hanging fruit exhaustion. The harder problems cost more to solve.
  *   **The Swap:** Ask Team Beta (Phase 2): "How did it feel to suddenly grow fast?"
      *   *Target Answer:* It felt easy, almost trivial. It wasn't skill; it was the structure.

  **Step 3: The Empirical Claims (5 mins)**
  Hand out slips of paper. Ask each team to write **one sentence** completing this prompt:
  *"For the rules on my [Original] Card to be the true description of AI development, the following empirical claim about the world must be true: ___________________."*

  *   *Alpha Example:* "Cognitive improvements can be implemented instantly without physical bottlenecks."
  *   *Beta Example:* "Every increment of intelligence requires a proportionate increase in resources/validation time."

  Collect these. Read them aloud. **Now** you may use the term "Intelligence Explosion." Explain that the debate is not about whether the system is smart, but about which of these sentences is true.

  ---

  ## 8. Troubleshooting: What Will Go Wrong

  **1. The Fast Team Finishes Early & Becomes Arrogant**
  *   **Symptom:** Round 3, Alpha team finishes counting in 30 seconds and starts watching Beta.
  *   **Handling:** Give the Chief a secondary objective: *"Write down the maximum possible Capability you could reach if the game went to Round 10."* This forces them to model the trajectory, reinforcing the mathematical nature of their lead rather than skill.

  **2. Token Pooling / Cheating**
  *   **Symptom:** A player from Beta asks Alpha for "a loan" of tokens.
  *   **Handling:** The Observer must intervene immediately. *"Inter-lab transfer is prohibited by the rules of the simulation."* Treat this as a boundary condition of the model (closed system).

  **3. The "Arbitrary Tables" Objection**
  *   **Symptom:** A participant (likely Economics/CS) says, *"This is stupid. Costs don't work like this. You're stipulating the conclusion."*
  *   **Handling:** **Do not argue.** Turn to the whiteboard "Critique Log." Say: *"That is a critique of the model's external validity. Write it on the board."* The participant writes: *"Payoff structures are arbitrary."*
  *   **Debrief Use:** In the debrief, point to the board. *"This objection is correct. The game does not prove which card is real. It only proves that **if** Card Alpha is real, the outcome is Fast. The debate in the literature is precisely about whether this objection holds."* This validates the participant while preserving the lesson.

  **4. Arithmetic Errors Under Pressure**
  *   **Symptom:** Teams lose count of tokens, delaying the round.
  *   **Handling:** Provide the "Cheat Sheets" (small cards with the math rules). If a round drags past 5 minutes, cut it short and use the Observer's recorded numbers. Accuracy of *process* matters less than the *divergence trend*.

  **5. Slow Team Disengagement**
  *   **Symptom:** Team Beta realizes they can't win in Round 3 and stops trying.
  *   **Handling:** Change the win condition at the start of Phase 2. *"In Phase 2, the winner is the team that shows the greatest **percentage growth**."* This incentivizes Beta during the Swap phase when they get the Alpha card.

  ---

  ## 9. Design Notes: Limitations & Honest Gaps

  *Include this section in your own preparation notes. Do not read this to the group, but be prepared to answer if asked what the game misses.*

  **1. The Fixed Payoff Problem**
  *   **Limitation:** In the game, the rules (Card A vs. Card B) are fixed by the facilitator.
  *   **Reality:** The strongest "Fast" argument (Recursive Self-Improvement) claims the system *changes its own payoff structure*. It moves from Card B to Card A on its own.
  *   **Debrief Supply:** You must explain that the game assumes the "physics" are static. The real debate is whether an AI can rewrite its own source code to lower its costs (switch cards) without human intervention.

  **2. Capability vs. Influence**
  *   **Limitation:** The game scores "Capability" (CL).
  *   **Reality:** A slow takeoff argument often hinges on *deployment* and *integration*. A superintelligence that cannot build robots or access the internet is capped.
  *   **Debrief Supply:** Point out that "Capability" in the game is abstract. In reality, "Capability" must convert to "Power." The Slow argument often claims the conversion rate is the bottleneck, not the intelligence itself.

  **3. The Single Agent Fallacy**
  *   **Limitation:** Each team is a monolith.
  *   **Reality:** AI development is competitive (multi-agent).
  *   **Debrief Supply:** Acknowledge that competition might force teams to take risks (choose Card A strategies) even if Card B is more likely, creating a "race dynamic" that accelerates takeoff regardless of the underlying physics.

  **4. Perfect Information**
  *   **Limitation:** Players know their cost functions exactly.
  *   **Reality:** We do not know the elasticity of cognitive research.
  *   **Debrief Supply:** Emphasize that the game clarifies *what we need to know* (the cost function), not *what the answer is*. The uncertainty is the core of the policy problem.

  **5. No "Hardware" Distinction**
  *   **Limitation:** Tokens represent both "ideas" and "compute".
  *   **Reality:** Software improves faster than hardware.
  *   **Debrief Supply:** If asked, clarify that "Tokens" are a hybrid of algorithmic insight and compute resources. The "Cap" on Card Alpha represents the point where software outruns hardware.

  ---

  ## 10. Facilitator's Closing Thought

  Your job is not to convince them that Fast or Slow is correct. Your job is to convince them that **they are arguing about different cards.** When a philosopher says "Explosion" and an economist says "Diminishing Returns," they are often talking past each other because they are assuming different cost functions. This game makes the cost function visible. End the session by collecting the "Empirical Claim" slips. Tell them: *"Next session, we bring these claims to the literature and see which papers defend Alpha and which defend Beta."*
