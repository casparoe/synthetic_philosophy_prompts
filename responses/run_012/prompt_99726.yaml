      1.  **Constitutive Principle:** History creates value (Marriage).
      2.  **Signaling Principle:** Continuation buys future advantage (Rivals).
      3.  **Heuristic Principle:** Adhering to a rule against quitting yields long-term character benefits, even if short-term loss occurs (Not a Quitter).
      4.  **The Fallacy:** When none of the above apply (Meal, Job, War, Product).

      *Gym Case:* Fits Heuristic? Yes. But the user's stated reason is "money shall not be wasted." That is Fallacious.
      So I will ask them to surrender the *reasoning* verdict, if not the action verdict.
