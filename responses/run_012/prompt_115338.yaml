prompt: |-
  I'm a backend engineer with no formal training in philosophy, and for the past few months I've been sitting in on a weekly reading group about nationalism and cosmopolitanism. The argument keeps circling one question — whether sharing a state, a language, or a passport gives me claims on a stranger that a stranger elsewhere does not have — and I've noticed that people on both sides keep winning by quietly assuming a different job description for the theory they're attacking. One camp wants an account on which a border is no more morally weighty than the colour of my eyes; the other wants an account that explains why a state may take my money and hand it to a poor old man inside the border rather than an equally poor one outside it. Before I read any more candidates, I want the specification instead of another one. So write me the desiderata: what any adequate theory of special obligations to compatriots has to deliver. I want the cases it must get right, each with the consideration behind it; the distinctions it must not collapse; and a clear separation between the requirements that are genuine and the ones that are merely the prejudices of one camp wearing the costume of a criterion.

  Please make the list strong enough to handle a few situations that the usual framing seems to hide. There is the two-by-two I keep running into: people who share a nation but not a state (a diaspora, a stateless people, a nation split across borders) and people who share a state but not a nation (a naturalised citizen who never picks up the culture, a country held together by institutions alone). There is the emigrant who naturalises somewhere else — do the old obligations attenuate, persist, or convert into something else? There is conscription, where the theory has to say whether the state may compel me to kill and die for co-nationals in a way it could not compel me to do for strangers. And there is the question of nesting: if I owe something to my city, my nation, and to humanity at large, are those obligations additive, ranked lexicographically, or genuinely rivalrous — and can a theory be foundationalist about the small circle and derivative about the large one, or the other way round? The list also has to be neutral in a way I can state out loud: a thoroughgoing cosmopolitan who thinks compatriot partiality is a moral error should be able to satisfy every requirement on it, otherwise the list is rigged and I'll be able to tell. Flag which requirements are negotiable and which are not, say which single requirement does the most to exclude candidates, and tell me whether any pair of them cannot be satisfied together — that last part is the one I actually care about. Keep the weight on the criteria rather than the scoring; no citations needed, I'll chase those down myself, and a couple of lines at the end on how strict cosmopolitanism, liberal nationalism, and the associative-ties view fare against the list is plenty.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **User Persona:** Backend engineer, no formal philosophy training, attending a reading group on nationalism vs. cosmopolitanism.
      *   **Problem:** The debate circles around whether shared state/language/passport creates special claims. Participants win by shifting the "job description" of the theory (moving the goalposts).
      *   **Goal:** A list of *desiderata* (requirements/specifications) for an adequate theory of special obligations to compatriots.
      *   **Key Constraints:**
          *   Must handle specific edge cases (Nation w/o State, State w/o Nation, Emigrants, Conscription, Nesting/Scope).
          *   Must be neutral (a thoroughgoing cosmopolitan must be able to satisfy it, even if by denying the premise).
          *   Must distinguish genuine requirements from disguised prejudices.
          *   Must flag negotiable vs. non-negotiable requirements.
          *   Must identify the single most exclusionary requirement.
          *   Must identify if any pair of requirements is incompatible (the "kill shot" the user cares about).
          *   Keep weight on criteria, not scoring. No citations.
          *   Brief evaluation of three views at the end (Strict Cosmopolitanism, Liberal Nationalism, Associative-Ties).
      *   **Tone:** Precise, structural, engineering-adjacent metaphor (specification, requirements, edge cases), philosophical rigor without jargon overload.

  2.  **Deconstruct the Core Conflict:**
      *   *Nationalists* want to justify partiality (why I help *this* poor person over *that* one).
      *   *Cosmopolitans* want to justify impartiality (why borders are morally arbitrary).
      *   *The Trap:* Defining the theory such that one side fails by definition (e.g., "A theory must justify conscription" rigs it against pacifist cosmopolitans).
      *   *The Solution:* Define the *explanatory burden* rather than the *normative output*. The theory must explain *why* the intuition exists or *why* it should be rejected, without presupposing the answer.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The State/Nation Distinction.* The user specifically mentioned the 2x2 matrix (Nation/State). The theory must distinguish between *political membership* (citizenship) and *cultural/ethnic membership* (nationality).
      *   *Requirement 2: The Emigrant Problem.* Does obligation persist after exit? The theory needs a rule for attenuation or conversion.
      *   *Requirement 3: Conscription/Coercion.* This is the hard case. It's not just about giving money; it's about killing/dying. The theory must address the *limit* of obligation.
      *   *Requirement 4: Nesting/Scope.* City vs. Nation vs. Humanity. Are these competing or complementary?
      *   *Requirement 5: Neutrality/Explanatory Power.* This is crucial. The theory must explain *both* the intuition of partiality and the critique of arbitrariness. It can't just say "partiality is good." It must account for the *phenomenon* even if it rejects the *norm*.
      *   *Requirement 6: Non-Collapse.* Must not collapse "is" into "ought" (naturalistic fallacy) or "legal" into "moral."

      *Refining for Neutrality:* A strict cosmopolitan can satisfy these by saying "The theory explains why people *feel* obligation but demonstrates it is morally illusory." So the desiderata must be about *accounting for the data*, not necessarily validating the intuition.

  4.  **Identifying the "Kill Shot" (Incompatible Pair):**
      *   What is the fundamental tension? It's usually between *Voluntarism* (I chose this, so I owe it) and *Non-Voluntarism* (I was born here, so I owe it).
      *   Actually, a deeper tension exists between *Equal Moral Worth* (Cosmopolitan baseline) and *Special Obligations* (Nationalist baseline).
      *   *The Incompatibility:* If you demand a theory that validates special obligations *and* demands that the theory treats all human life as having strictly equal weight *without any mediating mechanism*, you break it.
      *   *Better Incompatibility:* The user asked for a pair of *desiderata* that cannot be satisfied together.
      *   *Candidate:* "Must justify conscription" vs "Must treat all human life as equally valuable." (Too easy).
      *   *Candidate:* "Must ground obligations in consent" vs "Must ground obligations in birth/culture." (This is the Voluntarism vs. Ascriptivism clash).
      *   *Selection:* The tension between **The Arbitrariness Constraint** (birth is morally arbitrary) and **The Stability Constraint** (obligations must be robust enough to sustain redistribution). If you satisfy Arbitrariness strictly, you lose Stability. If you satisfy Stability strictly, you violate Arbitrariness. This is the core philosophical friction point.

  5.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the engineer's framing (specification vs. implementation).
      *   **The Desiderata List:** Categorized for clarity (Scope, Source, Limits, Neutrality).
      *   **Negotiability Flags:** Mark which are hard constraints vs. soft preferences.
      *   **The Exclusionary Requirement:** Identify the hardest filter.
      *   **The Incompatibility:** The "bug" in the spec.
      *   **Brief Evaluation:** How the three camps handle the spec.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't rig it against cosmopolitans. Instead of "Must justify partiality," use "Must account for the persistence of partiality intuitions."
      *   *Correction:* Ensure the "State vs. Nation" distinction is clear.
      *   *Correction:* The "Conscription" point needs to be about *compulsion*, not just duty.
      *   *Correction:* The "Nesting" point needs to address priority rules.
      *   *Check:* Did I answer the specific request about the emigrant? Yes, include "Attenuation Logic."
      *   *Check:* Did I answer the "prejudices wearing costumes" request? Yes, explicitly label which criteria often hide biases.

  7.  **Final Polish:**
      *   Ensure the tone is professional, direct, and respects the user's intelligence.
      *   Make the "Incompatibility" section the climax of the response.
      *   Keep the evaluations at the end concise.

  8.  *(Final Review against constraints)*:
      *   No citations? Yes.
      *   Neutral? Yes.
      *   Handle 2x2, Emigrant, Conscription, Nesting? Yes.
      *   Flag negotiable/non-negotiable? Yes.
      *   Identify single exclusionary requirement? Yes.
      *   Identify incompatible pair? Yes.

      *Let's write it.*
answer: |-
  Here is the specification you asked for. Treat this as an interface definition for a moral theory. It does not dictate the output (e.g., "partiality is good"); it dictates the structural integrity required for the theory to function without crashing into contradictions or ignoring edge cases.

  ### I. Functional Requirements (The "Must-Haves")

  These are non-negotiable. If a theory fails these, it is not a theory of *special obligations*; it is either a description of psychology or a theory of global justice that ignores the phenomenon you are studying.

  **1. The State/Nation Decoupling**
  *   **Requirement:** The theory must explicitly distinguish between *political membership* (citizenship, legal jurisdiction) and *cultural/ethnic membership* (shared language, history, identity). It must provide a distinct rule for obligations arising from each.
  *   **Consideration:** You identified the 2x2 matrix (Nation w/o State, State w/o Nation). A theory that conflates the two cannot explain why a diaspora feels obligation to a stateless homeland, nor why a naturalized citizen owes duties to a state they culturally reject.
  *   **Status:** **Non-Negotiable.**

  **2. The Attenuation Logic (The Emigrant Clause)**
  *   **Requirement:** The theory must define the decay function of obligation upon exit. When an agent leaves the jurisdiction or culture, does the obligation vanish, persist indefinitely, or convert into a different category (e.g., from "duty of justice" to "duty of rescue")?
  *   **Consideration:** Without this, the theory cannot handle dual citizens, expatriates, or refugees. It prevents the theory from treating membership as a "once saved, always saved" flag.
  *   **Status:** **Non-Negotiable.**

  **3. The Coercion Ceiling (The Conscription Test)**
  *   **Requirement:** The theory must specify the upper bound of enforceable demand. It must distinguish between obligations that may be *compelled* (taxes, conscription) and those that are merely *supererogatory* (charity, cultural preservation).
  *   **Consideration:** There is a moral difference between taxing you to feed a compatriot and forcing you to die for one. A theory that justifies redistribution but cannot explain why it stops short of demanding your life is structurally unsafe.
  *   **Status:** **Non-Negotiable.**

  **4. The Nesting Protocol**
  *   **Requirement:** The theory must define the relationship between concentric circles of obligation (Family → City → Nation → Humanity). It must state whether these are additive, lexicographically ranked, or rivalrous.
  *   **Consideration:** If I owe my city 10 units and my nation 10 units, do I owe 20? Or does the national obligation swallow the local? If they conflict, which API takes precedence?
  *   **Status:** **Non-Negotiable.**

  **5. The Explanatory Neutrality Constraint**
  *   **Requirement:** The theory must account for the *existence* of the intuition of special obligation, even if it concludes the intuition is morally false.
  *   **Consideration:** A thoroughgoing cosmopolitan can satisfy this by arguing: "The intuition exists due to evolutionary psychology, but it has no normative weight." A nationalist satisfies it by arguing: "The intuition exists because it tracks a moral truth." Both are valid implementations. What is *not* valid is ignoring the intuition entirely.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Negative Constraints (What Not to Collapse)

  These are guards against category errors. Violating these indicates the theory is smuggling in prejudices as criteria.

  **6. The Is/Ought Separation**
  *   **Constraint:** The theory must not derive moral obligation solely from the existence of a legal boundary or a sociological fact.
  *   **Prejudice Alert:** Nationalists often violate this by arguing "The state exists, therefore you owe it." Cosmopolitans violate it by arguing "Borders are arbitrary, therefore you owe nothing." The theory must bridge the gap with a normative principle, not just a description of reality.

  **7. The Moral Worth Baseline**
  *   **Constraint:** The theory must preserve the premise that a stranger outside the border has equal *intrinsic* moral worth to a compatriot.
  *   **Prejudice Alert:** Any theory that claims compatriots are *more human* or *more valuable* fails. Special obligations must be explained as relational or procedural, not ontological.

  ---

  ### III. Negotiable Requirements (The "Should-Haves")

  These are desirable features but admit valid trade-offs. A theory can be adequate without satisfying these perfectly, provided it acknowledges the cost.

  **8. The Reciprocity Condition (Negotiable)**
  *   **Requirement:** Obligations should ideally track benefits received.
  *   **Trade-off:** Strict nationalists reject this (you owe your country even if it treats you poorly). Strict cosmopolitans reject this (you owe the global poor even if they gave you nothing). A theory can drop this, but it loses explanatory power regarding *why* the obligation is specific to *this* group.

  **9. The Voluntarism Condition (Negotiable)**
  *   **Requirement:** Obligations should ideally stem from consent.
  *   **Trade-off:** Almost no theory satisfies this fully (nobody consents to birth). A theory can rely on "hypothetical consent" or "fair play," but it must admit this is a patch, not a feature.

  ---

  ### IV. The Exclusionary Filter

  **The Single Most Exclusionary Requirement:**
  **#3 (The Coercion Ceiling).**

  Most theories can hand-wave redistribution. Very few can consistently explain why the state can take your money for a compatriot but cannot take your life for one, without appealing to arbitrary thresholds. Liberal Nationalism struggles here (if the community is valuable enough to sustain, is it not valuable enough to die for?). Strict Cosmopolitanism struggles here (if no special obligations exist, why is conscription uniquely problematic compared to global duty?). Associative views struggle here (if the tie is constitutive of who you are, can you be forced to defend it?). This requirement forces the theory to define the *limit* of the political, which is where most implementations segfault.

  ---

  ### V. The Incompatibility (The "Kill Shot")

  You asked for a pair of requirements that cannot be satisfied together. This is the core bug in the specification that generates the debate.

  **The Conflict:** **Requirement #7 (Moral Worth Baseline)** vs. **Requirement #3 (The Coercion Ceiling / Special Obligation).**

  *   **The Tension:** If all humans have strictly equal intrinsic worth (#7), it is logically difficult to justify a mechanism that allows you to be *compelled* to sacrifice significantly more for one human than another (#3) without introducing a secondary value system that effectively overrides the first.
  *   **Why they clash:** To justify conscription or heavy redistribution for compatriots only, you must introduce a "multiplier" for compatriots. If that multiplier is strong enough to justify coercion, it functionally violates the claim that the stranger's worth is *equal*. If the stranger's worth is truly equal, the coercion ceiling for them should be identical to the coercion ceiling for compatriots.
  *   **The Result:** Any theory that claims to satisfy both is either hiding a premise (e.g., "institutions create unique duties" which begs the question) or accepting a "residue of guilt" (we must prioritize compatriots, but it's a moral tragedy that we must).
  *   **Can it be resolved?** Only by redefining "equality." If equality applies to *consideration* but not *allocation*, they are compatible. If equality applies to *allocation*, they are not. Most reading group arguments are actually fights over which definition of "equality" is in use.

  ---

  ### VI. Brief Evaluation of Candidates

  Here is how the three main architectures fare against this spec:

  **1. Strict Cosmopolitanism**
  *   **Performance:** Passes #7 (Moral Worth) and #5 (Neutrality) perfectly. Fails #1 (State/Nation) and #3 (Coercion) if it tries to deny the *phenomenon* of partiality rather than explain it.
  *   **Verdict:** It satisfies the spec by returning `NULL` for special obligations. It argues the "feature" is actually a "bug" in human moral reasoning. It is spec-compliant but may not match the user's observed reality of how states function.

  **2. Liberal Nationalism**
  *   **Performance:** Passes #1 (State/Nation) and #4 (Nesting). Struggles with #7 (Moral Worth) when pushed on why culture trumps need. Often crashes on #3 (Coercion) because if culture is a primary good, defending it coercively becomes hard to limit.
  *   **Verdict:** Strong on the "State w/o Nation" edge cases, but risks violating the Neutrality Constraint by treating national identity as a moral good rather than a neutral fact.

  **3. The Associative-Ties View (Special Obligations via Relationship)**
  *   **Performance:** Passes #5 (Neutrality) and #2 (Attenuation) well (relationships fade). Struggles with #6 (Is/Ought) because it often implies "we are related, therefore we ought," which risks the naturalistic fallacy.
  *   **Verdict:** Best at handling the Emigrant and Nesting cases. Weakest on the Incompatibility pair; it often has to admit that special obligations create a "moral remainder" of guilt toward the outsider to preserve Moral Worth Baseline.

  **Summary:** If you want a theory that preserves global equality, expect it to weaken special obligations. If you want a theory that validates strong special obligations, expect it to complicate global equality. The spec holds both accounts to the fire; the incompatibility ensures neither walks away unburned.
