answer: |-
  This is a sophisticated observation that cuts to the logical core of how authoritarian resilience is often defended in both public discourse and political theory. You have identified a structural flaw in the argumentation that goes beyond simple hypocrisy; it is an *epistemic* maneuver designed to protect a normative claim from empirical disconfirmation.

  There is no single established term in the literature that captures this exact three-part structure, specifically the *asymmetry* you describe. The literature tends to conflate the claim (performance legitimacy) with the defense (the counterfactual). To give you the "carving" you requested, I will first brainstorm the existing conceptual tools, evaluate their fit, separate the three elements you identified, and then coin a precise term for the third element.

  ### Part 1: Brainstorming Candidate Concepts

  Here are the five most relevant concepts from political philosophy and social science, along with their limitations regarding your specific pattern.

  **1. Performance Legitimacy**
  *   **The Concept:** Associated with scholars like Yidian Zhao and Bruce Gilley. It posits that legitimacy is derived from "outputs" (economic growth, security) rather than "inputs" (elections, rights).
  *   **Fit:** Perfectly describes your **Element 1** (the general claim that legitimacy rests on outcomes).
  *   **Shortcoming:** It is a descriptive category of legitimacy, not a logical analysis of the argument structure. It does not explain *how* the defender protects the claim when performance is mixed or when costs are highlighted. It assumes the performance is measurable, whereas your pattern involves making the measurement impossible.

  **2. The Hobbesian Bargain (or Authorization)**
  *   **The Concept:** Based on Hobbes's *Leviathan*. Subjects surrender rights to a Sovereign in exchange for security, avoiding the "state of nature" (war of all against all).
  *   **Fit:** Captures **Element 2** (comparing the actual state to a stipulated worse one/chaos). It provides the narrative content ("order vs. chaos").
  *   **Shortcoming:** Hobbes's argument is theoretical, not necessarily epistemically slippery in the way you describe. A Hobbesian can admit the Sovereign is failing if security is lost. Your pattern involves a defender who claims the *threat* of chaos remains even when order appears stable, rendering the bargain unfalsifiable.

  **3. Negative Legitimation**
  *   **The Concept:** Discussed in authoritarianism literature (e.g., by Markus Wagner). Legitimacy is generated not by love for the regime, but by fear of the alternative (e.g., "It's us or the Islamists/Communists/Chaos").
  *   **Fit:** Captures the rhetorical reliance on a scary counterfactual.
  *   **Shortcoming:** Like Performance Legitimacy, this describes the *source* of support, not the *logical structure* of the defense. One can engage in negative legitimation without the epistemic asymmetry (e.g., "If they win, taxes go up." This is falsifiable if they win and taxes don't go up).

  **4. Motte-and-Bailey Doctrine**
  *   **The Concept:** A fallacy where a proponent retreats from a controversial, ambitious claim (the Bailey) to a defensible, modest claim (the Motte) when challenged.
  *   **Fit:** Structurally very close. The Bailey is "We are justified because we produced prosperity." The Motte is "You cannot prove chaos wouldn't have happened."
  *   **Shortcoming:** Motte-and-Bailey is typically semantic (shifting definitions). Your pattern is *modal* and *epistemic* (shifting the standards of evidence regarding unobservable alternative worlds). While this is a type of Motte-and-Bailey, the specific reliance on the *unobservability of counterfactuals* warrants a more specific distinction.

  **5. Immunization Strategies (Popperian)**
  *   **The Concept:** Karl Popper's critique of psychoanalysis and Marxism. A theory is "immunized" against falsification by adding ad hoc hypotheses that explain away contradictions.
  *   **Fit:** Captures **Element 3** (the move to unfalsifiability).
  *   **Shortcoming:** Popper focused on scientific theories. Applying this to political legitimacy requires specifying *what* is being immunized. In your pattern, it is the *counterfactual baseline* that is immunized.

  ### Part 2: Separating the Three Elements

  You rightly suspect three distinct things are being run together. Here is the conceptual separation:

  **1. The Normative Claim: Performance Legitimacy**
  *   **Definition:** The assertion that the moral right to rule is contingent upon the delivery of material goods (security, wealth) rather than procedural correctness (consent, rights).
  *   **Status:** This is a standard, contestable normative position. It is not inherently fallacious. A utilitarian defense of government rests on this.

  **2. The Comparative Move: The Lesser-Evil Counterfactual**
  *   **Definition:** The justification of specific costs (rights violations) by comparing the actual world to a hypothetical alternative world where those costs were not paid, but greater costs (chaos, poverty) were incurred.
  *   **Status:** This is a standard consequentialist calculation. It is logically valid *if* the counterfactual is treated as an empirical hypothesis that could, in principle, be wrong.

  **3. The Epistemic Maneuver: The Asymmetry**
  *   **Definition:** The selective application of evidentiary standards to the counterfactual. When the regime claims credit, the counterfactual (chaos) is treated as a **known fact** ("We prevented chaos"). When the regime is challenged on costs, the counterfactual is treated as **unknowable** ("You cannot prove chaos wouldn't have happened").
  *   **Status:** This is the logical flaw. It grants the defender the benefits of omniscience (knowing the alternative would be bad) without the risks (having to prove it).

  ### Part 3: The Verdict and The Coinage

  While "Motte-and-Bailey" and "Immunization" are adjacent, they do not precisely name the manipulation of the *counterfactual baseline* in political legitimacy claims. The existing literature on "Performance Legitimacy" describes the *claim* but ignores the *epistemic protection* mechanism you have isolated.

  Therefore, I propose we coin the term: **Counterfactual Immunization**.

  However, to capture the specific *asymmetry* you noted (the switching of standards), I will refine this to a more precise technical term:

  #### **Modal Asymmetry**

  **Definition:**
  *Modal Asymmetry* is a rhetorical and logical strategy in political justification wherein the epistemic status of a counterfactual scenario (the "alternative") is shifted opportunistically to insulate a regime from criticism.
  *   **Phase A (Credit Claiming):** The counterfactual is treated as **determinate and known**. The defender asserts with certainty that without their rule, a specific negative outcome (chaos, poverty) *would have* occurred.
  *   **Phase B (Blame Avoidance):** The counterfactual is treated as **indeterminate and unknowable**. The defender asserts that because the alternative history did not happen, it is impossible to know if less costly means could have achieved the same ends, or if the negative outcome was inevitable regardless of their specific abuses.

  **Distinction from Nearest Concepts:**
  *   **Vs. Motte-and-Bailey:** Motte-and-Bailey usually involves shifting the *definition* of a term (e.g., "By 'justice' I meant..."). Modal Asymmetry involves shifting the *modal status* (certainty vs. uncertainty) of an unobserved event.
  *   **Vs. Special Pleading:** Special pleading is a general request for exception. Modal Asymmetry is specific to the *epistemology of the alternative*. It exploits the inherent unverifiability of counterfactuals.
  *   **Vs. Performance Legitimacy:** Performance legitimacy is the *thesis* ("We rule because we perform"). Modal Asymmetry is the *defense mechanism* used when the performance data is ambiguous or costly.

  **Why this fits your pattern:**
  You noted: *"The standard is result-based when the results are good and unfalsifiable when they are bad."*
  *   **Good Results:** The counterfactual is "We saved you from chaos." (Certainty).
  *   **Bad Costs:** The counterfactual is "You can't know if we could have done it without jailings." (Uncertainty).
  The baseline moves from a **fixed point of comparison** (to claim success) to a **foggy unknown** (to evade failure).

  ### Part 4: The Borderline Case

  To test the definition of **Modal Asymmetry**, we need a case where it is difficult to distinguish between legitimate prudence and the fallacy.

  **The Case: Post-Conflict Transitional Justice**
  Imagine a government emerging from a brutal civil war (e.g., Rwanda post-1994 or Bosnia post-1995). The new government suppresses hate speech and detains suspected instigators without full due process.
  *   **Defense:** "If we allowed full free speech and due process immediately, the genocide would have restarted. Stability is fragile."
  *   **Challenge:** "But you are jailing innocent people."
  *   **Response:** "You cannot prove the genocide wouldn't have restarted. We are the only ones who understand the fragility."

  **Testing the Definition:**
  Is this *Modal Asymmetry* or *Prudent Statesmanship*?

  *   **It is Prudent Statesmanship if:** The government admits the epistemic uncertainty. "We *fear* chaos might restart, so we are taking these costs, but we acknowledge this is a gamble and we will review these restrictions as soon as possible." Here, the counterfactual remains probabilistic in both Phase A and Phase B.
  *   **It is Modal Asymmetry if:** The government claims *certainty* about the chaos when justifying the crackdown ("This *would* have led to war"), but claims *ignorance* when asked if less repressive tools could have worked ("You *cannot know* if other methods would have held").

  **The Borderline:**
  The line is crossed when the defender refuses to specify **what evidence would change their mind**.
  *   **Legitimate:** "If violence drops below X level for Y years, we will lift the bans." (The counterfactual is tied to empirical metrics).
  *   **Modal Asymmetry:** "Stability is always fragile; the threat is always latent." (The counterfactual is permanently unfalsifiable).

  ### Summary of the Carving

  1.  **Performance Legitimacy:** The normative claim that outcomes justify rule. (Valid, but contestable).
  2.  **Comparative Justification:** The argument that actual costs are outweighed by avoided hypothetical costs. (Valid, if empirical).
  3.  **Modal Asymmetry:** The fallacious maneuver of treating the hypothetical costs as **known** when claiming credit, but **unknowable** when assigning blame. (Invalid).

  Your intuition is correct: the defender is not making a standard consequentialist argument. A standard consequentialist accepts that if the costs outweigh the benefits, the action is unjustified. The defender you describe has constructed a logic where the benefits are empirical (visible GDP) but the costs are modal (invisible chaos), making the calculation impossible to lose. **Modal Asymmetry** is the name for this rigging of the scale.
