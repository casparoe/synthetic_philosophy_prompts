prompt: |-
  ok, I need help with something that's been bugging me about Jeffrey conditionalization. The setup, as I understand it: my evidence is basically never certain — I glance at the scale and I'm 90% sure it reads 71, 10% sure it reads 70 — so instead of conditioning on an evidence proposition (which I'd have to be certain of), I take a partition of the possible readings, give each a new probability, and then average my old conditional probabilities P(H | reading) over those new weights. That part I think I've got.

  Here's the wall I hit. I've got two bits of uncertain evidence to absorb, call them A and B. If I Jeffrey-update on A first and then on B, I get one posterior for H. If I do B first and then A, I get a different one — and not just for some weird H, the final probability for A itself comes out different depending on the order. I did it twice, so I don't think it's an arithmatic slip. But this seems flat-out impossible, because Jeffrey's rule is supposed to just be Bayes' rule generalized to the case where your evidence isn't certain, and Bayes is order-independent: conditioning on E then F lands you in the same place as F then E, you just end up conditioning on E and F together. So one of my two runs has to be wrong, which means I must be breaking some rule about how I'm allowed to pick the new probabilities for the readings. What's the constraint I'm violating? I feel like once I see it the whole thing will snap into place.

  And a friend insists I dont need Jeffrey's rule at all. His trick: just go up a level and make your evidence certain. Don't condition on "the scale reads 71," condition on "my eyes registered the scale reading 71," which you can be certain about — and then you're back to ordinary Bayes, order-independence and all. If that's right, then Jeffrey's rule is just a convenience and my whole order puzzle is a non-issue. Does the trick actually work?

  One request: please don't hand me the confident textbook version. I'd rather know which parts of this are actually settled and which parts people who work on it still argue about — I don't want a disputed view dressed up as the consensus.
