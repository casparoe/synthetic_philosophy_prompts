prompt: |-
  I run causal analysis for a state workplace-safety agency: when someone is seriously hurt or killed on the job, my unit produces the findings that the board votes on and that our lawyers then have to defend in administrative appeals. The trouble is that we have never settled what we are actually claiming when we name a cause. Our counsel wants the but-for test — if the injury would have happened anyway, that factor is not a cause, full stop — and treats our findings as though they were verdicts about liability. My engineers, who spend their days reasoning about which guard, interlock, or procedure would have made the difference, keep producing findings in a different idiom: they describe the incident as a system, point at the factor whose manipulation would have changed the outcome, and are unmoved when told that some other factor was equally sufficient. I have read enough of the philosophical literature to know that these are not just two house styles but two theories — the counterfactual account built on but-for dependence and the interventionist account built on what a well-defined manipulation of a variable would do — and that each has known failure modes the other was designed to fix. What I need from you is a decision procedure my unit can actually run, in the ninety minutes we get per case, on a finding of cause: the questions to ask in order, what counts as an adequate answer at each step, where the procedure terminates in a finding, where it must hand the question to the board because it has become a matter of policy rather than fact, and where it must say out loud that the answer depends on a convention we have chosen rather than discovered.

  The procedure has to survive the cases that have already burned us. One: two redundant safety interlocks on a powered pallet truck were both defeated, months apart, by different people; either one alone would have stopped the machine, and the operator was crushed when neither did. Counsel's test finds no cause at all, which is unacceptable to a board that must issue a citation naming one. Two: a supervisor's failure to enforce a pre-shift inspection, where the thing not done is not an event and the counterfactual is about an absence. Three: the factor everyone in the building believes is the real cause — chronic understaffing that made the shortcuts rational — which is the kind of standing condition where I suspect the intervention is not well-defined at all, and where I need the procedure to tell me whether that is a defect in the factor or a defect in my question. It must also tell me how to handle a factor that is sensitive (the outcome turns on it in this case) but not robust (it would not have mattered across the range of plausible variations), and it must distinguish between the factors that are causally relevant and the one factor we choose to name — I do not want a procedure that pretends the selection step is forced when it is not. Then run it end to end on those three cases, including the one where it yields a result my board will not like, and be explicit about what the procedure cannot do: which questions it leaves to values, which steps are judgment dressed up as method, and where a competent investigator could run it correctly and still reach the opposite finding.

  One constraint on the answer itself: do not give me a reading list, citations, or references to specific papers or authors' works — I cannot check them and I do not need them. Argue from the substance of the two positions and their known problems. I want the procedure to be usable by people who have never heard the terms counterfactual and interventionist, so tell me which distinctions have to survive the translation into plain questions and which I can drop without loss. Finally, be candid about your own confidence: for each of the three worked cases, name the single consideration that, if it turned out the other way, would flip your verdict, and tell me which step of the procedure you would expect to be the first to break under adversarial cross-examination.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs causal analysis for a state workplace-safety agency.
      *   **Problem:** Conflict between Legal Counsel (But-For/Counterfactual test) and Engineers (Interventionist/Systemic test).
      *   **Goal:** A practical decision procedure (90 minutes per case) to determine "cause" for findings.
      *   **Requirements:**
          *   Must handle specific "burned us" cases (redundant interlocks, omissions/non-events, standing conditions like understaffing).
          *   Must distinguish causal relevance from causal selection (naming *the* cause).
          *   Must identify where policy/value judgments enter (hand off to Board).
          *   Must admit where conventions are chosen, not discovered.
          *   Must be usable by non-philosophers (plain language).
          *   No citations/references/reading lists.
          *   Must include confidence assessment (flip factors, weak points under cross-examination).
          *   Must run the procedure end-to-end on the three specific cases.

  2.  **Deconstruct the Theoretical Conflict:**
      *   *Counsel's View (But-For/Counterfactual):* $C$ is a cause of $E$ iff if $C$ had not occurred, $E$ would not have occurred.
          *   *Failure Mode:* Overdetermination (redundant interlocks). If $C1$ and $C2$ are both sufficient, removing $C1$ still leaves $C2$, so $E$ happens. Neither is a but-for cause. Result: No cause.
          *   *Failure Mode:* Omissions. "Not doing X" is tricky in strict event ontology.
      *   *Engineers' View (Interventionist/Manipulationist):* $C$ is a cause of $E$ iff changing $C$ (via a well-defined intervention) changes $E$, holding other relevant factors fixed.
          *   *Failure Mode:* Standing conditions. Everything is a cause if you tweak it enough (e.g., gravity, oxygen). Need a way to select *the* cause.
          *   *Failure Mode:* Vagueness of intervention. Can you "intervene" on understaffing?
      *   *Synthesis Needed:* A hybrid approach that uses counterfactuals for screening but interventions for validation, and explicitly separates *causal relevance* (is it a cause?) from *causal selection* (is it *the* cause we cite?).

  3.  **Drafting the Decision Procedure (The "Causal Findings Protocol"):**
      *   *Constraint:* 90 minutes. Needs to be a checklist/flowchart style.
      *   *Step 1: The Event Definition.* What exactly happened? (Crucial for counterfactuals).
      *   *Step 2: The Candidate List.* What factors are in play?
      *   *Step 3: The But-For Screen (Counsel's requirement).* Does removing this factor stop the outcome *in this specific scenario*?
          *   *Fix for Redundancy:* If But-For fails due to redundancy, move to Step 4.
      *   *Step 4: The Intervention Test (Engineers' requirement).* Can we describe a specific change to this factor that would have prevented the outcome, assuming the rest of the system stayed the same?
      *   *Step 5: The Omission Check.* Is this a "non-event"? Treat it as the presence of a duty + the absence of action.
      *   *Step 6: The Standing Condition Filter.* Is this a background condition (like gravity) or a variable factor? (Distinguishes understaffing from oxygen).
      *   *Step 7: Causal Selection (The Policy Step).* If multiple factors pass Steps 3-6, which one do we name? This is *not* factual; it's normative. Hand off to Board if disputed.
      *   *Step 8: Convention Declaration.* Explicitly state if a choice was made based on agency priority (e.g., "we prioritize machine guarding over training").

  4.  **Refining the Procedure for the User's Constraints:**
      *   *Plain Language:* Avoid "counterfactual," "interventionist," "ontology." Use "The Removal Test," "The Fix Test," "The Background Check."
      *   *Handling Redundancy:* The procedure must explicitly override the But-For test when redundancy is proven.
      *   *Handling Omissions:* Define "cause" to include "failure to act where duty exists."
      *   *Handling Standing Conditions:* Distinguish "fixed background" vs. "variable management choice."
      *   *Selection vs. Relevance:* Make a hard stop between "Is this a cause?" (Fact) and "Is this the cited cause?" (Policy).

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Redundant Interlocks.*
          *   But-For Test: Fails for both (if A worked, B was broken, still crushed).
          *   Intervention Test: Passes for both (Fixing A prevents injury *given B is broken*).
          *   Selection: Both are causes. Which to cite? Policy decision.
          *   *Verdict:* Both are causal factors. Selection requires Board policy on redundancy.

      *   *Case 2: Supervisor Omission (No Inspection).*
          *   But-For Test: Tricky. "If he had inspected..."
          *   Intervention Test: "Assign duty to inspect."
          *   Omission Check: Is there a duty? Yes. Did action prevent harm? Likely.
          *   *Verdict:* Causal factor.

      *   *Case 3: Chronic Understaffing.*
          *   But-For Test: If staffed fully, would shortcut happen? Maybe not.
          *   Intervention Test: Can we "intervene" on staffing? Yes, hire more people.
          *   Standing Condition Filter: Is this background or variable? It's a management variable.
          *   Robustness: Is it sensitive or robust? Sensitive in this case.
          *   *Verdict:* Causal factor, but often filtered out by policy (scope of citation). This is the "Policy Handoff."

  6.  **Addressing the "Candor" Requirements:**
      *   *Confidence:* Where could the verdict flip?
      *   *Cross-Examination:* Where will lawyers attack? (Usually the "Intervention" definition or the "Policy" selection).
      *   *Limitations:* Acknowledge that "Cause" in law is not "Cause" in physics.

  7.  **Review against Constraints:**
      *   No citations? Check.
      *   90-minute usability? Check (keep steps tight).
      *   Plain language? Check.
      *   Three cases run through? Check.
      *   Flip factors identified? Check.
      *   Cross-exam weak points identified? Check.

  8.  **Final Polish:**
      *   Ensure the tone is professional, authoritative, yet humble about the philosophical limits.
      *   Make sure the distinction between *Causal Relevance* (Fact) and *Causal Selection* (Policy) is the spine of the whole answer. This solves the Counsel vs. Engineer fight by showing they are answering different questions.
      *   *Self-Correction on Case 1:* Counsel says "no cause." The procedure must validate the Engineers without lying to Counsel. The solution is to define "Cause" for the agency as satisfying *either* the Removal Test *or* the Redundancy Exception.
      *   *Self-Correction on Case 3:* Understaffing is the hardest. The procedure needs to flag this as "Causally Relevant but potentially Outside Scope." This protects the unit from saying it's *not* a cause, while allowing the Board to say "we won't cite it."

  9.  **Drafting the Response:** (Mental outline of the sections)
      *   Introduction: Acknowledge the conflict is real, not stylistic.
      *   The Protocol (8 Steps).
      *   Application to Case 1 (Interlocks).
      *   Application to Case 2 (Omission).
      *   Application to Case 3 (Understaffing).
      *   Limitations & Vulnerabilities (The "Candor" section).

  10. **Final Review against "Flip Factor" requirement:** For each case, I need to specify *one* consideration that would flip the verdict.
      *   Case 1: If one interlock was *already* known to be broken and the other was the "active" safety layer.
      *   Case 2: If the inspection would *not* have found the defect (efficacy).
      *   Case 3: If staffing levels were within legal minimums (duty definition).

  11. **Final Review against "Cross-Examination" requirement:**
      *   Case 1: The definition of "redundancy."
      *   Case 2: The counterfactual certainty (would inspection *actually* have stopped it?).
      *   Case 3: The line between "cause" and "condition."

  12. (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your unit's constraints. It separates **Causal Relevance** (is this factor factually connected to the injury?) from **Causal Selection** (which factor do we cite?). This distinction resolves the conflict between Counsel and Engineering: Counsel is worried about Selection (liability), while Engineers are worried about Relevance (mechanism).

  ### The Causal Findings Protocol (90-Minute Version)

  **Goal:** Determine if a factor is a *Causal Factor* (Relevance) and if it should be the *Cited Cause* (Selection).
  **Tools:** Whiteboard, Incident Timeline, Safety Standards.

  #### Phase 1: Screening for Causal Relevance (Facts)
  *Time limit: 45 minutes. If a factor fails here, it is not a cause. Stop.*

  **Step 1: The Specific Event Definition**
  *   **Question:** What exactly is the injury event? (e.g., "Hand contacted blade at 10:00 AM," not "Worker was injured.")
  *   **Adequate Answer:** A specific time, place, and physical contact.
  *   **Fail State:** Vague descriptions ("unsafe environment").

  **Step 2: The Removal Test (Counsel's But-For)**
  *   **Question:** If we magically remove this factor *only for this specific incident*, does the injury still happen exactly as it did?
  *   **Adequate Answer:** Yes (Not a cause) or No (Potential cause).
  *   **Exception:** If the answer is "Yes, because another factor did the same job," mark as **Redundant** and proceed to Step 3. Do not discard.

  **Step 3: The Fix Test (Engineers' Intervention)**
  *   **Question:** Can we describe a specific, realistic change to this factor that would have prevented the injury, assuming the rest of the system stayed the same?
  *   **Adequate Answer:** "If Guard X had been installed, hand would not have reached blade."
  *   **Fail State:** "If management cared more" (Too vague) or "If gravity didn't exist" (Not a variable).
  *   **Note on Redundancy:** If Step 2 failed due to redundancy, pass this factor if fixing *this specific instance* of the factor would have stopped the injury (even if the other redundant factor was also broken).

  **Step 4: The Omission Check (For Non-Events)**
  *   **Question:** Is there a specific duty to act, and would acting have physically prevented the injury?
  *   **Adequate Answer:** "Rule 101 requires inspection. Inspection would have found the broken guard. Fixed guard prevents injury."
  *   **Fail State:** No duty exists, or the action would not have found the problem.

  **Step 5: The Background Filter (For Standing Conditions)**
  *   **Question:** Is this factor a fixed background condition (like gravity or oxygen) or a variable management choice (like staffing levels or shift length)?
  *   **Adequate Answer:** Variable management choice = Pass to Phase 2. Fixed background = Discard.
  *   **Crucial Distinction:** If the factor varies across the industry or within the company over time, it is a variable, not a background condition.

  *Outcome of Phase 1:* You now have a list of **Causal Factors**. These are facts. Do not argue about them yet.

  #### Phase 2: Causal Selection (Policy)
  *Time limit: 45 minutes. This is where values enter.*

  **Step 6: The Sensitivity Check**
  *   **Question:** Does the outcome depend on this factor in *this* case, even if it wouldn't matter in most other cases?
  *   **Adequate Answer:** Yes. (Sensitivity is enough for Relevance; Robustness is not required).

  **Step 7: The Agency Priority Filter**
  *   **Question:** Does our agency prioritize this type of factor (e.g., machine guarding over training, or physical controls over administrative controls)?
  *   **Adequate Answer:** Reference agency citation guidelines.
  *   **Fail State:** If the factor is causally relevant but outside agency priority (e.g., understaffing when the agency only cites physical hazards), mark as **Not Cited**.

  **Step 8: The Convention Declaration**
  *   **Question:** Are we choosing this factor over another equally valid factor because of a rule we made up?
  *   **Adequate Answer:** "Yes. Both Interlock A and Interlock B are causal factors. We cite A because it was the last line of defense."
  *   **Requirement:** This finding must be written in the report as a policy choice, not a physical discovery.

  *Outcome of Phase 2:* You have your **Cited Cause**. If Step 7 or 8 is disputed, the finding goes to the Board for a policy vote.

  ---

  ### Application to the Three "Burned Us" Cases

  #### Case 1: The Redundant Interlocks
  *Scenario: Two interlocks defeated. Either one working prevents injury. Both failed.*

  *   **Phase 1:**
      *   **Step 2 (Removal):** Remove Interlock A failure. Injury still happens (Interlock B failed). **Result:** Fail (Redundant).
      *   **Step 3 (Fix):** Fix Interlock A (assuming B stays broken). Injury prevented. **Result:** Pass.
      *   **Phase 1 Verdict:** Both Interlock A failure and Interlock B failure are **Causal Factors**.
  *   **Phase 2:**
      *   **Step 7 (Priority):** Agency prioritizes "last line of defense" or "most recent failure."
      *   **Step 8 (Convention):** We must admit we are selecting one for the citation, though both caused the risk.
      *   **Phase 2 Verdict:** Cite Interlock B (the final barrier). Note Interlock A as a contributing causal factor.
  *   **Confidence & Vulnerability:**
      *   **Flip Factor:** If evidence shows Interlock A was *permanently* disabled months prior and Interlock B was the *only* active safety layer expected by the operator, Interlock B becomes the sole primary cause.
      *   **Cross-Examination Break Point:** **Step 3.** Counsel will argue, "You admitted fixing A doesn't stop the injury if B is broken." You must hold the line: "In the specific configuration of *this* accident, B *was* broken. Fixing A changes the outcome in the actual world, which satisfies the test."

  #### Case 2: The Supervisor Omission
  *Scenario: Supervisor failed to enforce pre-shift inspection. Defect existed.*

  *   **Phase 1:**
      *   **Step 2 (Removal):** Remove the "failure" (i.e., make him inspect). Injury likely prevented. **Result:** Pass.
      *   **Step 4 (Omission):** Is there a duty? Yes (Regulation). Would action work? Yes (Inspection finds defects). **Result:** Pass.
      *   **Phase 1 Verdict:** Failure to inspect is a **Causal Factor**.
  *   **Phase 2:**
      *   **Step 7 (Priority):** Agency prioritizes physical hazards over administrative failures? If yes, this might be "Contributing" only. If no, it is Cited.
      *   **Phase 2 Verdict:** Cite as Causal Factor.
  *   **Confidence & Vulnerability:**
      *   **Flip Factor:** If the defect was latent (hidden inside the machine) and a standard pre-shift inspection *would not have found it*, the link breaks at Step 4.
      *   **Cross-Examination Break Point:** **Step 4.** Counsel will argue, "You are punishing a thought crime. He didn't *do* anything." You must reply: "The cause is the absence of a required barrier. The physical mechanism is: No Inspection -> Defect Remains -> Injury."

  #### Case 3: Chronic Understaffing
  *Scenario: Staffing levels made shortcuts rational. Worker injured taking shortcut.*

  *   **Phase 1:**
      *   **Step 2 (Removal):** Remove understaffing (add workers). Shortcut likely not taken. Injury prevented. **Result:** Pass.
      *   **Step 5 (Background):** Is staffing a fixed background? No, it is a variable management choice. **Result:** Pass.
      *   **Phase 1 Verdict:** Understaffing is a **Causal Factor**. (Do not let Counsel talk you out of this fact).
  *   **Phase 2:**
      *   **Step 7 (Priority):** Does the agency cite management resource allocation? Often, agencies limit citations to immediate physical hazards to avoid economic policy disputes.
      *   **Step 8 (Convention):** If agency policy is "cite the hazard, not the budget," this is **Not Cited**.
      *   **Phase 2 Verdict:** **Hand off to Board.** This is a policy decision, not a factual one. The finding should read: "Understaffing is a causal factor. Whether it is citable under current agency mandate is a Board policy question."
  *   **Confidence & Vulnerability:**
      *   **Flip Factor:** If staffing levels were within legal minimums required by statute, the "duty" in Step 4/5 vanishes. It becomes a background condition of the industry, not a variable violation.
      *   **Cross-Examination Break Point:** **Step 5.** Counsel will argue, "Staffing is a condition, not a cause. Everything is understaffed." You must reply: "It is a condition only if it is fixed. Here it varied by shift and decision. It is a variable. Whether we *cite* it is policy; whether it *caused* the injury is fact."

  ---

  ### Limitations and Candor

  **What This Procedure Cannot Do:**
  1.  **It cannot force a single cause.** Physics allows multiple sufficient causes. If the Board demands a single "root cause" for Case 1 (Interlocks), this procedure will flag that demand as a **Policy Constraint**, not a Factual Finding.
  2.  **It cannot eliminate judgment.** Step 3 (The Fix Test) requires the investigator to imagine a "realistic" change. One investigator's "realistic" is another's "speculative." This is judgment dressed as method.
  3.  **It cannot protect against value disputes.** In Case 3 (Understaffing), two competent investigators can run this correctly. One concludes "Causal Factor" (focusing on the variable nature of staffing). The other concludes "Background Condition" (focusing on industry norms). The procedure identifies *where* they disagree (Step 5), but it does not mathematically resolve it.

  **Where the Procedure Relies on Convention:**
  *   **Step 3 (Intervention Definition):** We define "cause" as "something we can fix." This is a convention. We could have defined it as "something that transferred energy." We chose the former for regulatory utility. You must state this in your findings: *"Cause is defined for the purpose of this citation as a modifiable factor."*
  *   **Step 7 (Agency Priority):** Selecting the machine guard over the staffing level is a value judgment about what the agency can control. This is not discovered in the wreckage; it is imposed by the agency's mission.

  **Confidence Assessment:**
  *   **Case 1 (Interlocks):** High confidence on Relevance, Low confidence on Selection. The physics is clear; the citation choice is arbitrary without Board policy.
  *   **Case 2 (Omission):** Medium confidence. Vulnerable to the "efficacy of inspection" argument. If the inspection is a paper exercise that never catches anything, Step 4 fails.
  *   **Case 3 (Understaffing):** Low confidence on Selection, High confidence on Relevance. It is factually causal, but legally fragile. Expect this to be overturned on appeal not because the causality is wrong, but because the *authority* to cite it is challenged.

  **Final Instruction to Your Unit:**
  When writing the finding, use two headers.
  1.  **Factual Causation:** List all factors that passed Phase 1. (Satisfies the Engineers).
  2.  **Citable Violation:** List the factor selected in Phase 2. (Satisfies Counsel).
  If there is a gap between the two, explicitly write: *"Other causal factors exist but are not cited due to Agency Priority Guidelines."* This puts the onus on the Board and the Policy, not on your unit's analysis.
