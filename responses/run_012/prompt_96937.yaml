answer: |-
  ### I. The Mapping

  To apply the handicap principle to the judicial ordeal, we must first fix the roles. On the natural reading:

  *   **Sender:** The Accused.
  *   **Receiver:** The Community (including the judge, the accuser, and the kin groups).
  *   **Quality/Fact:** Innocence (a moral status regarding a past act).
  *   **Cost:** Physical pain, risk of death, permanent scarring, and the psychological burden of submitting to divine judgment.
  *   **Bearer:** The Accused.
  *   **Mechanism:** The cost is supposed to keep the signal honest by ensuring that only the innocent can survive/heal without infection.

  **Where the Mapping Strains:**
  This mapping reveals an immediate structural defect. In Zahavi's biological model, the cost correlates with an *intrinsic physical quality* (health, vigor). The tail is heavy; only a healthy bird carries it. In the ordeal, the cost (burning/drowning) is physically uniform. There is no biological reason an innocent person heals faster than a guilty one. The correlation between cost and quality is not physiological; it is theological.

  Furthermore, the "receiver" in a signaling game updates their belief based on the signal. Here, the receiver's belief is fixed *prior* to the signal by the shared premise that God intervenes. The cost does not *create* the reliability; it merely *activates* the mechanism (Divine Intervention) that produces the reliability.

  Finally, the "being whose judgment is invoked" (God) bears no cost. In biological signaling, the environment is indifferent. In the ordeal, the "environment" is an agent who validates the signal. This makes the ordeal not a handicap signal, but a **ritualized petition**. The cost is not a handicap proving fitness; it is a sacrifice invoking a third-party arbiter.

  **Verdict on Mapping:** This is a defect in the application, not merely a discovery. The theory assumes the cost *itself* enforces honesty through physical constraints. Here, the cost is a threshold fee to access a supernatural enforcement mechanism. The signal is not "I am strong enough to bear this cost," but "I am willing to submit this cost to God."

  ### II. Cost Differentiation and the Role of Belief

  You note that the innocent and guilty face the same iron. This breaks both the Zahavi and Spence models.

  *   **Zahavi:** Requires the cost to be a burden only the "high type" can afford. Since innocence does not grant fire resistance, the innocent cannot "afford" the ordeal biologically.
  *   **Spence:** Requires the marginal cost of signaling to be lower for the high type. There is no evidence the psychological or physical cost of burning was lower for the innocent.

  **What Supplies the Correlation?**
  The correlation is supplied entirely by the shared belief that God alters physical outcomes based on moral status. If the belief holds, the innocent *do* heal faster (miraculously). If the belief holds, the cost *is* differentially survivable.

  **Is This Fatal to the Theory?**
  It renders the signaling theory parasitic. In standard signaling models, the physics of the world ensures the correlation (e.g., metabolism). Here, the *epistemology* of the community ensures the correlation. The cost is not doing the work; the *belief in the cost's meaning* is doing the work.

  If we treat the "belief" as part of the environment, the theory can technically function: the "cost" is the risk of divine punishment. The guilty face a higher *expected* cost (divine punishment + physical pain) than the innocent (physical pain only). This rescues the Spencean model: the signal separates types because the *total* cost (physical + spiritual) is higher for the guilty.

  **The Amendment:** To save the theory, we must expand "cost" to include "expected spiritual penalty." However, this moves the explanatory weight from the *signal* (the iron) to the *belief system* (the theology). The theory describes the stability of the equilibrium *given* the belief, but it cannot explain the origin or maintenance of the belief itself. It is a model of signal stability, not signal genesis.

  ### III. Costly to Perform vs. Costly to Fake

  This distinction is crucial for the 1215 collapse.

  *   **Costly to Perform:** High for the accused (pain/death).
  *   **Costly to Fake:** Low for the priest. The priest controlled the temperature of the iron, the depth of the water, and the inspection of the wound. The signal was easily rigged.

  **The Signaling Interpretation of the Collapse:**
  In a standard signaling game, if a signal becomes cheap to fake, it loses informational value and collapses. However, the ordeal did not collapse because priests started rigging it more often; it collapsed because the Church *forbade* them from administering it.

  If the reliability came from the institution's management of belief, the 1215 prohibition removes the "certifier." The handicap principle struggles here. Usually, a sender stops signaling when the cost exceeds the benefit. Here, the *Church* (a third party) stopped *validating* the signal.

  **Does the Theory Explain the Collapse?**
  No. The handicap principle explains why a signal remains honest *despite* the incentive to lie. It does not explain why a third-party certifier would withdraw certification.
  *   **Signaling View:** The signal remained costly to perform. The accused could still walk on coals. But without the priestly blessing, the "link" between cost and divine judgment was severed.
  *   **The Gap:** The theory presupposes the interpretive scheme. It treats the "meaning" of the wound as stable. When the Church withdrew, the meaning changed, not the cost. The theory is silent on why the *semantics* of the cost changed. It can model the ordeal as a stable equilibrium *while* the Church participated, but it cannot model the Church's decision to exit the game. That decision was theological (prohibiting the testing of God), not signaling-economic.

  ### IV. Alternative Readings

  Consider the alternatives:
  1.  **Dispute Termination:** The ordeal ends a feud by providing a focal point for resolution, regardless of truth.
  2.  **Responsibility Displacement:** The judge avoids blood-guilt by shifting agency to God.
  3.  **Lottery/Settlement:** The risk induces the accused to settle or confess before the ordeal occurs.

  **Impact on Signaling Interpretation:**
  *   **If Dispute Termination:** The ordeal transmits no information about guilt. It transmits information about *social closure*. The "signal" is not "I am innocent," but "We accept this outcome." The handicap principle is **redescribing** the event. It treats a social ritual as an information channel when it is actually a conflict resolution tool.
  *   **If Responsibility Displacement:** The "Sender" is not the accused, but the Judge/Community. They signal "We are not responsible for this death." The cost is borne by the accused, but the benefit accrues to the judge. This inverts the signaling model (bearer of cost $\neq$ receiver of benefit).
  *   **If Lottery:** A lottery is, by definition, uncorrelated with quality. If the ordeal is a lottery that *works* because people believe it isn't, the signaling theory is describing a **collective hallucination**.

  **Description vs. Redescription:**
  If the procedure was not transmitting information about the accused's past act, the handicap principle is **redescribing** it. It imposes an informational structure on a ritualistic one. It says, "This looks like signaling," when the participants may have understood it as, "This is submitting to authority." The signaling account is an external analytic frame, not necessarily an internal mechanism.

  ### V. The Verdict

  **Is this Confirmation, Anomaly, or Unanticipated?**
  It is an **anomaly** that exposes the limits of the theory when applied to institutional/religious contexts.

  **The Better Account:**
  The better account is **Institutional Epistemology**. The ordeal worked because the Church possessed the epistemic authority to define reality. The "cost" was secondary to the "consecration." The collapse occurred not because the signal became too cheap or too noisy, but because the authority defining the signal's meaning withdrew its endorsement. The 1215 Council changed the *rules of interpretation*, not the *cost structure*.

  **What a Signaling Theorist Must Add:**
  To keep this case, a signaling theorist must add **Common Knowledge of Institutional Endorsement** as a variable in the cost function.
  *   The "cost" of the ordeal is not just physical pain ($C_{physical}$).
  *   It is $C_{total} = C_{physical} + C_{spiritual} - V_{institutional}$.
  *   Where $V_{institutional}$ is the value conferred by the Church's participation.
  *   When the Church withdraws, $V_{institutional} \to 0$. The signal no longer separates types because the mechanism linking cost to outcome (Divine Intervention) is no longer publicly guaranteed.

  **Where the Theory Remains Silent:**
  1.  **Why the Belief Existed:** Signaling theory takes the payoff structure as given. It cannot explain why medieval Europe believed God intervened in boiling water.
  2.  **Why the Church Stopped:** The theory cannot explain the 1215 prohibition. That was a change in the sender's (Church's) internal utility function regarding theological risk, not a reaction to signal noise.
  3.  **The Nature of Truth:** The theory assumes there is a "fact of the matter" (guilt/innocence) being signaled. If the ordeal was actually a lottery or a settlement device, the theory is modeling a fiction.

  **Final Reckoning:**
  The handicap principle explains how the ordeal remained stable *while* the belief system held. It explains why the accused did not simply refuse the test (the cost of refusal was social death, higher than the ordeal). But it cannot explain the collapse. The collapse was not a failure of signaling economics; it was a failure of theological authorization. The ordeal was not a handicap signal of innocence; it was a **sacramental technology**. When the sacrament was banned, the technology broke, regardless of the cost. The theory describes the skin of the event, but not the bone.
