answer: |-
  **What Sidgwick means**
  Sidgwick is distinguishing between the ultimate criterion of right action and the practical method we use to decide what to do. He admits that humans cannot directly calculate the infinite chain of consequences for every act, so aiming at "general happiness" must be done indirectly through established rules. He argues that we should follow common-sense moral rules because experience shows they generally promote happiness better than individual speculation. For Sidgwick, utilitarianism remains rational because it provides the only coherent ultimate end, even if we must rely on these proxies for navigating our epistemic limits.

  **Is it fatal?**
  This is not a fatal problem because Sidgwick correctly identifies that a moral theory defines what makes an action right, not necessarily how agents must deliberate in real-time. By shifting to a system of "middle axioms" or rules of thumb validated by historical experience, he preserves the utilitarian standard while accommodating human ignorance. The objection only works if you assume rationality requires omniscience, but Sidgwick shows that rationality actually requires choosing the best available method to approximate the truth, which is rule-following rather than guesswork.

  **Cluelessness connection**
  Consequentialist cluelessness is the modern, more radical version of this worry, arguing we cannot even assign probabilities to long-term outcomes. While Sidgwick acknowledges limited foresight, he trusts accumulated experience to give us reliable probabilistic knowledge about types of actions. Modern cluelessness challenges whether those probabilities are knowable at all, suggesting the long-run effects are essentially random. Sidgwick's framework handles this by retreating further into robust, time-tested rules rather than speculative long-term calculation.

  **My verdict**
  Sidgwick successfully defends utilitarianism against this charge by separating the theory of value from the theory of decision-making. The limitation of foresight is an empirical fact about humans, not a logical contradiction within utilitarianism, so it cannot invalidate the theory itself. Ultimately, this objection fails because it demands an impossible standard of knowledge for rational action, whereas Sidgwick's indirect approach offers a practical, rational path that respects both the goal of happiness and our cognitive limits.
