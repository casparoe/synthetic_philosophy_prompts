answer: |-
  You have put your finger on the exact hinge where tax policy turns into moral philosophy. The arrangement you describe—the high estate tax exemption paired with the step-up in basis—is not an accident of drafting. It is a coherent, if controversial, statement about what property is and what the state is owed.

  Here is the reconstruction of the view that makes this practice make sense, followed by the separation of its parts, and finally the concrete changes required if you shift the underlying moral premise.

  ### 1. The Implicit Doctrine: The Family as a Continuous Entity

  To make sense of a system that taxes wages annually but forgives lifetime capital gains at death, you have to assume a specific view of the family and the individual.

  **The Family as a Single Economic Unit**
  The step-up in basis presupposes that the family, not the individual, is the true owner of wealth. If you view the decedent and the heir as distinct individuals, the transfer of an asset is a "realization event." The decedent effectively sold the asset to the heir at market value. By resetting the basis, the tax code assumes the asset never really changed hands economically; it just stayed within the same family corporation. Death is not a liquidation; it is a management change.

  **Property Rights Trump Redistribution**
  The system assumes that the right to hold property without liquidation is fundamental. To tax the capital gain at death, you often have to force a sale to pay the tax (especially for illiquid assets like family farms or private business stock). The current arrangement presupposes that forcing a family to break up an asset to pay the government on "paper gains" is a greater evil than letting those gains go untaxed. It prioritizes the *continuity* of ownership over the *completeness* of taxation.

  **Equal Opportunity as Anti-Aristocracy, Not Anti-Advantage**
  This is the crux of your question about equal opportunity. The current system assumes that inequality of starting points is acceptable, provided it doesn't calcify into a permanent aristocracy.
  *   **The Exemption:** By setting the estate tax exemption very high (currently over $13 million per person), the state says, "We do not care if you pass on a comfortable upper-class life to your children. We only care if you pass on dynastic power."
  *   **The Step-Up:** By forgiving the capital gains, the state says, "We will not penalize patience." If you hold an asset for 50 years, you are rewarded more than if you traded it annually.

  So, the implicit view is: **Unfairness lies in concentration of power, not in inequality of starting capital.** The tax code is designed to prune the very top of the tree (the estate tax) but allows the branches to grow thick and pass nutrients to the next layer (the step-up). It assumes the market will eventually disperse this wealth through bad investment or spending, so the state doesn't need to intervene aggressively.

  ### 2. The Separation: Requirements vs. Underdetermined Parts

  You asked to separate what the practice strictly requires from what is underdetermined (consistent with multiple theories).

  **What the Practice Strictly Requires**
  To get the outcome you described (no tax on transfer, no tax on gain for most estates), you logically need two distinct mechanisms working in tandem:
  1.  **Non-Realization at Death:** You must define death as *not* being a taxable sale. If death were a realization event, the step-up disappears, and capital gains are due regardless of the estate tax exemption.
  2.  **Thresholded Transfer Tax:** You must define the transfer of wealth as taxable only above a specific abundance. If the estate tax had a low exemption, the step-up would matter less because the principal would be taxed anyway.

  **What Is Underdetermined (The "Why" is Unclear)**
  The mechanism allows for multiple, conflicting justifications. We cannot read one single doctrine off the setup because different theories lead to the same result.
  *   **Administrative vs. Moral:** The step-up could exist because tracking cost basis for a house bought in 1960 is administratively nightmarish (pragmatism). Or, it could exist because it is morally wrong to tax "unrealized" gain (libertarianism). The law looks the same either way.
  *   **Protection of "Main Street" vs. "Wall Street":** The high exemption is often defended as protecting family farms and small businesses from being liquidated to pay taxes. But in practice, it protects massive portfolios of liquid stock. The mechanism is consistent with both a "protect the little guy" theory and a "protect capital accumulation" theory.

  **The Consistency Check**
  You asked if the pieces are consistent with taxing wages annually. **They are not.**
  *   **Labor vs. Capital:** Wages are taxed on *receipt*. You work, you get paid, you pay tax. Capital is taxed on *disposal*. You grow wealth, you pay nothing until you sell.
  *   **The Loophole:** By combining "tax on disposal" with "no disposal at death," you create a permanent exemption. This creates a fundamental inconsistency: A doctor who earns $1M a year and saves it pays high income taxes. An investor who owns $1M in stock that grows to $10M pays zero tax if they hold until death.
  *   **The Implication:** The system explicitly values *ownership* over *effort*. It assumes labor is a flow (tax the river) while capital is a reservoir (don't drain the lake). This is only consistent if you believe capital formation is more socially valuable than labor income, or that the risk of investment deserves a permanent shield that wages do not.

  ### 3. The Alternative View: "Nobody Deserves Their Starting Place"

  If you swap the implicit view for one where luck of birth should not dictate economic destiny (a strict meritocratic or egalitarian view), the current mechanism falls apart. You cannot just tweak the rates; you have to change the definition of the events.

  Here is what concretely would have to change about the practice:

  **1. Treat Death as a Realization Event (End the Step-Up)**
  If nobody deserves the unearned appreciation of assets held by their parents, death must trigger the capital gains tax. The estate (or the heir) must pay the tax on the growth that occurred during the decedent's life. This eliminates the "forgiveness" of decades of growth.
  *   *Mechanism:* "Carryover basis" (heir takes the original cost) or "Deemed Realization" (estate pays tax on gain at death).

  **2. Tax the Recipient, Not the Donor (Inheritance as Income)**
  Currently, we tax the *estate* (the giver) only if it's huge. If the goal is to equalize starting points, you should tax the *heir* (the receiver).
  *   *Mechanism:* Treat inheritance as ordinary income for the recipient. If you inherit $500,000, that is added to your wages for that year and taxed at your marginal rate. This directly addresses the "unequal starting point" by reducing the net advantage the heir receives, regardless of how rich the parent was.

  **3. Lower the Exemption Threshold**
  If the concern is unfair starting lines, the $13 million exemption is indefensible. Most people do not start life with $13 million.
  *   *Mechanism:* Drop the exemption to a level that captures "significant advantage" rather than "dynastic power." This acknowledges that even moderate inherited wealth distorts equal opportunity.

  **4. Eliminate the Distinction Between Labor and Capital**
  To be truly consistent with the view that no one deserves their starting place, you cannot allow capital to compound tax-free while labor is taxed annually.
  *   *Mechanism:* Mark-to-market taxation. Tax unrealized gains annually, or at least remove the ability to defer capital gains indefinitely. This ensures that wealth grows at the same tax rate as work, removing the structural advantage of being born with assets.

  ### Summary of the Argument

  Your friend calls it a loophole; you suspect it's a statement of belief. You are right.

  The current system believes that **the family is a sovereign unit** and that **wealth continuity is a default right** unless it becomes so large it threatens the state (the estate tax). It accepts unequal starting lines as the cost of protecting property rights.

  If you believe **the individual is the unit** and **starting lines should be leveled**, the step-up is intolerable. It represents a state subsidy for dynastic wealth. To fix it, you must stop treating death as a continuation of the family and start treating it as the final liquidation of an individual's economic life, taxing the gain then and there, and taxing the receipt as unearned income for the heir.

  The inconsistency you feel regarding wages vs. capital gains is the friction between a system designed for a society of workers (tax labor) and a society of owners (protect capital). The current law tries to serve both, but in doing so, it grants owners a permanent exemption that workers never get.
