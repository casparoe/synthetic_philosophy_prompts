  4.  **Drafting the Residue Report (Task 2):**
      *   *Clean Translations:* Struggle, Asymmetry, Hollow Victory, Labor as Arc.
      *   *Distortions:* "Death." In novels, physical death ends the story. In Hegel, it's a *risk* that must not happen (or the story ends). In craft, we often metaphorize this (social death, career death).
      *   *Missing Counterparts:* "Spirit/History." Novels are particular; Hegel is universal/necessary. The idea that this *must* happen for the universe to know itself doesn't fit craft. Craft cares about *this* character, not the teleology of humanity.
      *   *Speculative Machinery:* Is it a deficiency in craft? No. Craft is about *contingency* (choices), Hegel is about *necessity* (logic). The residue marks the difference between art (mimetic) and philosophy (systematic).

  5.  **Applying to the Translator/Poet Scenario (Task 3):**
      *   *The Setup:* Translator (Slave equivalent), Poet (Master equivalent).
      *   *Dialectic Prediction:* Translator should find agency through Labor (translation). Poet should stagnate due to dependence. Recognition should be asymmetrical.
      *   *The Gap:* The prompt says "No violence, no struggle... only dependence." Hegel *requires* the life-and-death struggle to break the attachment to biological existence. Without that terror, the "Slave" doesn't undergo the radical transformation.
      *   *Who is at fault?* Neither. Hegel describes a violent genesis of selfhood. The novel describes a quiet, professional symbiosis. The "gap" is that the Translator/Poet relationship is *ethical/aesthetic*, not *ontological* in the Hegelian sense. The Translator doesn't need to fear death to find dignity in labor; they find it in craft.
