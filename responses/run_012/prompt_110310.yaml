  3.  **Translate to Craft Vocabulary (Task 1):**
      *   *Two self-consciousnesses:* Two characters with strong POVs/Wants.
      *   *Demand for recognition:* The Inciting Incident/Conflict. Each wants the other to validate their status/identity.
      *   *Struggle to the death:* The Crisis/Climax. Stakes must be existential (not just physical death, but death of the "self" or identity).
      *   *Submission:* The Reversal. One character yields agency.
