  *   Currently, it is widely regarded as a *theoretical* paradox. The "data" isn't expected soon. The work being done (Firewalls, Complementarity, AdS/CFT) is conceptual/mathematical.
  *   *Prediction:* **Useful.** The bottleneck is intelligibility and consistency, not detector sensitivity.

