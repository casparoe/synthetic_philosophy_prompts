      *   **Key Concerns:**
          *   Doesn't want a simple "Premise 3 is false" essay. Wants depth.
          *   Worried about the "What's so special about fiction?" problem (if we feel for non-existents, is fiction unique?).
          *   Struggling with the "nesting" issue (fictional boy watching fictional story).
          *   Flatmate's objection: Fiction is self-deception/waste of feeling/comfort blanket.
