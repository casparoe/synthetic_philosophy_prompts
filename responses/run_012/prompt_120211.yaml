answer: |-
  **To:** The Risk Committee
  **From:** Chief Risk Officer
  **Subject:** Replacement of Likelihood Scoring with the Evidence-Weight Protocol (EWP)

  **Context**
  Our current practice of averaging 1–5 scores treats subjective opinion as objective frequency. It ignores that a probability derived from twenty years of data is not the same *kind* of number as one derived from expert guesswork. Following Keynes's *Treatise on Probability*, we are adopting the **Evidence-Weight Protocol (EWP)**. This procedure treats probability as a relation between a proposition and specific evidence, distinguishes the *weight* of that evidence from the *probability* itself, and acknowledges that some risks are not mathematically comparable.

  **Constraint:** Each entry must be processed in ≤15 minutes by the two analysts prior to the committee meeting.

  ---

  ### The Evidence-Weight Protocol (EWP)

  #### Step 1: Evidence Inventory (3 Minutes)
  **Action:** Each analyst independently lists the specific body of evidence ($h$) supporting their likelihood estimate.
  **Adequate Answer:** A concrete list (e.g., "20 years internal loss triangles," "External industry survey 2023," "Underwriter intuition on new product").
  **Failure Condition:** If an analyst writes "experience" or "market knowledge" without specifying *what* data or observation constitutes that knowledge, the step is incomplete.
  **Output:** Two evidence lists ($h_1, h_2$).

  #### Step 2: Weight of Evidence Scoring (3 Minutes)
  **Action:** Analysts assign a **Weight Grade** to their own evidence. Do not score likelihood yet.
  **Scale:**
  *   **W-High:** Direct, long-term, relevant data (e.g., 10+ years internal loss history).
  *   **W-Med:** Indirect data, short-term history, or strong precedent in comparable jurisdictions.
  *   **W-Low:** Analogy, expert opinion, no precedent, or conflicting data sources.
  **Adequate Answer:** A single grade (High/Med/Low) per analyst.
  **Output:** Two Weight Grades ($w_1, w_2$).

  #### Step 3: Comparability Check (3 Minutes)
  **Action:** Compare $h_1$ and $h_2$. Are they measuring the same logical relation?
  **Decision Rule:**
  *   **Comparable:** Both rely on the same class of data (e.g., both using internal loss trends).
  *   **Incomparable:** One uses internal data, the other uses external analogy; or both use different expert judgments based on different assumptions.
  **Adequate Answer:** A binary flag: **MATCH** or **DIVERGENT**.
  **If DIVERGENT:** **STOP.** Do not calculate an average. Do not produce a single probability number. Record "Non-Comparable Probabilities."
  **Output:** Comparability Flag.

  #### Step 4: Probability Estimation (3 Minutes)
  **Action:**
  *   **If MATCH:** Analysts discuss and agree on a **Probability Range** (e.g., 10–15%), not a point estimate.
  *   **If DIVERGENT:** Record the two separate estimates (e.g., Analyst A: 15% [W-Low]; Analyst B: 40% [W-Low]).
  **Adequate Answer:** A range or a pair of distinct values with attached Weight Grades.
  **Output:** Probability Value(s) + Weight Grade(s).

  #### Step 5: Action & Hand-Off (3 Minutes)
  **Action:** Determine the register entry based on Weight and Comparability.
  **Decision Matrix:**
  1.  **W-High + MATCH:** Enter Probability Range. Capital formula applies automatically.
  2.  **W-Med + MATCH:** Enter Probability Range. Apply 1.2x Prudence Multiplier to capital.
  3.  **W-Low OR DIVERGENT:** **HAND-OFF TO COMMITTEE.**
      *   **Record:** "Uncertainty Class."
      *   **Entry:** Do not enter a probability. Enter "Prudence Required."
      *   **Instruction:** Committee must determine capital based on capacity to bear loss, not expected loss. This is a judgment of nerve, not math.

  ---

  ### Test Runs on Current Register Entries

  #### Entry 1: Liability Exposure (No precedent in jurisdiction)
  *   **Step 1 (Evidence):** Analyst A: "Legal review of statute." Analyst B: "Analogy to neighboring state."
  *   **Step 2 (Weight):** Both assign **W-Low**. No direct data exists.
  *   **Step 3 (Comparability):** **DIVERGENT.** Statutory interpretation $\neq$ Geographic analogy.
  *   **Step 4 (Probability):** Analysts propose 5% and 20%.
  *   **Step 5 (Action):** **HAND-OFF TO COMMITTEE.**
      *   **Register Entry:** "Uncertainty Class / Prudence Required."
      *   **Committee Task:** You cannot price this on expected loss. You must decide how much surplus you are willing to risk on a venture with unknown odds. This is a strategic decision, not a risk calculation.

  #### Entry 2: Established Line (20 years clean loss data)
  *   **Step 1 (Evidence):** Analyst A: "20-year internal triangle." Analyst B: "20-year internal triangle."
  *   **Step 2 (Weight):** Both assign **W-High**.
  *   **Step 3 (Comparability):** **MATCH.**
  *   **Step 4 (Probability):** Analysts agree on 2–4% frequency.
  *   **Step 5 (Action):** **AUTO-CALCULATE.**
      *   **Register Entry:** "2–4% [W-High]."
      *   **Committee Task:** None. The capital formula runs. The weight justifies the precision.

  #### Entry 3: The Disagreement (15% vs 40% on different evidence)
  *   **Current Practice:** Average to 27.5%.
  *   **EWP Run:**
      *   **Step 1 (Evidence):** Analyst A: "Internal claims data (W-Med)." Analyst B: "External catastrophe model (W-Low)."
      *   **Step 2 (Weight):** W-Med vs W-Low.
      *   **Step 3 (Comparability):** **DIVERGENT.** Historical frequency $\neq$ Forward-looking model.
      *   **Step 4 (Probability):** **NO AVERAGE.** Record "15% [W-Med] / 40% [W-Low]".
      *   **Step 5 (Action):** **HAND-OFF TO COMMITTEE.**
      *   **Register Entry:** "Non-Comparable / Prudence Required."
      *   **Committee Task:** You are forbidden from entering 27.5%. That number implies a precision that does not exist. You must choose: Do we trust the past (15%) or the model (40%)? Or do we hold capital for the 40% case because the cost of being wrong is ruin? This is a judgment of values (conservatism vs. competitiveness).

  ---

  ### Critique of the Procedure

  To make Keynes's theory usable in a 15-minute commercial window, I have dropped or simplified three distinctions. You must understand the cost of each.

  **1. Dropped: Strict Logical Relations**
  *   **Keynes:** Probability is a logical relation between *any* proposition and *any* evidence.
  *   **Simplification:** We treat "Evidence" as "Data Sources."
  *   **Cost:** We may still conflate the quality of the logic with the quality of the data. An analyst might have high-quality data but apply poor logic to it. The Weight Grade might look "High" when the reasoning is flawed.
  *   **Misfire:** When an analyst presents a complex model as "W-High" evidence without the committee understanding the model's assumptions.

  **2. Dropped: Absolute Non-Comparability**
  *   **Keynes:** Some probabilities simply cannot be compared or ranked.
  *   **Simplification:** We allow the Committee to force a decision via "Prudence."
  *   **Cost:** We still pressure the Committee to produce a capital number eventually. Keynes would argue that for "Uncertainty Class" risks, no number is rational. We are forcing a number onto the unquantifiable to satisfy regulators.
  *   **Misfire:** The Committee will treat "Prudence Required" as a code for "Add 10% buffer," turning a value judgment back into a false formula.

  **3. Dropped: The Distinction Between Risk and Uncertainty**
  *   **Keynes:** "Risk" is measurable (weight is high); "Uncertainty" is not (weight is low).
  *   **Simplification:** We keep them in the same register, just flagged differently.
  *   **Cost:** It suggests they are the same category of object.
  *   **What it Cannot Do:** This procedure cannot generate a single Solvency Capital Requirement (SCR) figure without a final overlay of human judgment. It cannot eliminate the need for "nerve." It explicitly prevents the mathematical aggregation of incomparable risks.

  **Summary of Limitations**
  *   **Where it will misfire:** Under time pressure, analysts will default to "MATCH" to avoid the Committee hand-off. We must audit Step 3 randomly.
  *   **What it cannot do:** It cannot tell you the "correct" capital for Entry 1 or Entry 3. It can only tell you that calculating it mathematically is a lie. It shifts the burden of truth from the spreadsheet to the Committee's conscience.

  **Recommendation:** Adopt immediately. The current practice creates a false sense of security that endangers the mutual's surplus. The EWP exposes our ignorance where it exists, which is the only safe basis for capital planning.
