  You're hitting on what we call the "input problem," and it's the most common objection, but it assumes maxim formulation is arbitrary. It isn't. Your maxim isn't just whatever description gets you off the hook; it's the actual principle you're acting on. If you're consciously thinking, "I'll take the benefit but withhold the support needed to sustain it," then universalizing that *does* destroy the practice. And I'd push back on your intuition here: if everyone free-rode exactly like that, independent journalism collapses. Kant would say you're making an exception for yourself in a system you rely on, which is precisely the kind of self-preference the test is designed to catch. It's not a false positive; it's telling you that systematic free-riding is a fairness violation, even if it feels harmless.

  As for the distinction, it's not an escape hatch; it's about two different ways a maxim can fail. A contradiction in conception means the universalized maxim is logically impossible—the practice literally vanishes, like making false promises (if everyone did it, promising wouldn't exist). A contradiction in will means the world is possible, but you can't rationally will it because it undermines your own agency or necessary ends. For example, you can conceive of a world where no one helps anyone, but you can't rationally will it because you yourself will need help someday. In your news case, if the site survives on ads, universalizing ad-blocking is a contradiction in conception (site dies). If it's a donation model, it might be a contradiction in will (you will news existence, but won't the means). The test isn't flexible; the *situations* are different.
