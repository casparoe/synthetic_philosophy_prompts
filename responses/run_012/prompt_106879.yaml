  My opening move: here's a case I think breaks your test. Take the maxim, "whenever I can read a news site for free, I'll read it and never pay and never click the ads." Run that through your contradiction-in-conception machine and the universalized version is that nobody who reads news this way ever gives news sites any money, so the thing I'm relying on — there being news to read — definately collapses. So it looks like you're forced to call it a duty violation. But c'mon, reading a free website is not immoral. So either your test is coughing up a false positive, or you're gonna start gerrymandering the maxim until it comes out clean — and if the maxim is up for grabs, then the test isn't deciding anything on its own, it's just doing whatever you wanted. Which is it?

