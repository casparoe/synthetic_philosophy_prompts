answer: |-
  # JOINT STATEMENT ON THE LONG-RUN TRAJECTORY OF HARM

  **Signatories:**  
  1. **The Declinist** (holding that the long-run trend of violence is real and downward)  
  2. **The Definitional Skeptic** (holding that the trend is largely an artefact of shifting definitions and denominators)

  **Date:** October 26, 2023  
  **Subject:** Resolution of Dispute Regarding Historical Violence Metrics

  Having exhausted our evening debate without convergence, we recognize that our disagreement stems less from contradictory data than from incompatible frameworks for interpreting that data. To prevent further dialogue of the deaf, we produce this statement to delineate where our views overlap, where they diverge, and the nature of the divergence itself.

  ### I. Claims of Common Ground
  *Both signatories affirm the following propositions regarding the limits and nature of the available evidence:*

  1.  **The Heterogeneity of Evidence:** We agree that data quality is not constant across time. Pre-modern estimates rely on archaeological inference, fragmentary chronicles, and anthropological analogy, whereas modern data relies on bureaucratic state records. Neither side may treat ancient estimates as possessing the same confidence intervals as modern vital statistics.
  2.  **Rate vs. Toll:** We agree that a distinction exists between the *absolute toll* of violence (total deaths/suffering) and the *rate* of violence (deaths/suffering per capita). We acknowledge that population growth can cause the toll to rise even as the rate falls, and that citing one without the other is misleading.
  3.  **The Instability of Categories:** We agree that the social and legal categories used to record harm (e.g., "homicide," "war," "abuse") have shifted over centuries. Acts recorded as discipline in the 17th century may be recorded as assault in the 21st, and vice versa.
  4.  **The Moral Baseline:** We agree that the reduction of human suffering is a moral good, regardless of whether that suffering is classified technically as "violence." We further agree that if the Declinist is right, it is a cause for cautious optimism; if the Skeptic is right, it is a cause for vigilance against complacency.

  ### II. Table of Residual Disagreements
  *Where the common ground ends, the following disagreements remain. Each side states its position in its own terms, without conceding the other's metric as definitive.*

  | Domain of Dispute | The Crux | Agreed Evidence Bearing on the Crux | The Declinist's Position | The Definitional Skeptic's Position |
  | :--- | :--- | :--- | :--- | :--- |
  | **Act vs. Omission** | Does violence require a direct agent of force, or does it include structural harm allowed by policy? | **Case:** The Great Famine of Ireland (1845–49) vs. Modern Food Insecurity. Both involve mass death linked to governance and resource distribution. | Violence is an *event* involving direct intent or kinetic force. Famine is a tragedy or a failure of welfare, but classifying it as "violence" dilutes the term until it describes all suffering. Prediction: Direct interpersonal and political violence rates will continue to fall even if structural neglect persists. | Violence includes *preventable harm* imposed by power structures. If a state has the capacity to prevent mass death and chooses not to, the resulting mortality is a form of violence by omission. Prediction: If structural harm is counted, the "violence" curve flattens or rises in the modern era due to globalized inequality. |
  | **Lethality vs. Intent** | Does a decline in death rates per assault reflect a decline in violence, or merely an improvement in trauma medicine? | **Body of Evidence:** Homicide *attempts* vs. Homicide *completions* in the 20th century. Emergency response times and surgical survival rates have improved drastically since 1950. | The metric of interest is the *intent to harm* and the initiation of force. If fewer people die from assaults because of medicine, the violence rate (acts initiated) may be stable, but the *lethal* violence rate has genuinely declined. Prediction: The societal cost of violence is lower today because survival is higher. | The metric of interest is the *outcome* of social conflict. Historically, an assault was a potential death sentence; today, it is a medical incident. Comparing lethal rates across eras ignores that the *nature* of the risk has changed, not necessarily the aggression. Prediction: Adjusting for medical survivability, the "effective lethality" of social conflict has not declined as sharply as raw mortality stats suggest. |
  | **Denominators Over Time** | Are per-capita rates spanning centuries well-defined, given changes in social organization and population density? | **Body of Evidence:** Archaeological mass graves (e.g., Nubia, Jebel Sahaba) vs. Modern State Homicide Rates. One represents small bands/tribes; the other represents nation-states of millions. | Per-capita normalization is the only way to compare risk across populations of different sizes. A 1% death rate in a tribe of 50 is comparable to a 1% death rate in a nation of 50 million regarding individual risk. Prediction: The probability of an individual dying violently is objectively lower today. | Per-capita rates assume a stable population model that did not exist historically. Small bands face existential extinction risks that nations do not; nations face industrial-scale risks bands cannot conceive. The denominators are not equivalent. Prediction: The "rate" is a statistical artefact. The *type* of risk has mutated, making longitudinal comparison category error. |

  ### III. Conclusion: Verbal Dispute vs. Fact of the Matter

  In reviewing the above, we separate our dispute into three components:

  1.  **Verbal:** A significant portion of our argument was semantic. We were using the word "violence" to point at different phenomena. The Declinist used "violence" to mean *direct, intentional acts of physical force*. The Skeptic used "violence" to mean *avoidable harm inflicted by power*. Once these definitions are decoupled, we agree that direct physical force is statistically less likely to kill a random individual today than in the past, while structural harm remains pervasive and difficult to quantify.
  2.  **Empirical:** There remains a genuine empirical disagreement regarding the interpretation of lethality. The Declinist asserts that survival is a net gain for humanity; the Skeptic asserts that survival masks the persistence of aggressive intent. This is not merely verbal; it is a disagreement about which variable (intent vs. outcome) best tracks human safety.
  3.  **Moral:** We disagree on whether counting structural omission as violence is a necessary moral correction or a conceptual confusion.

  **Final Determination:**
  We conclude that there is **no single fact of the matter** regarding the proposition "Violence is in long-run decline." That sentence is an umbrella covering a family of narrower questions.

  *   Is the rate of *lethal interpersonal assault* per capita lower? **Likely Yes.**
  *   Is the rate of *organized state warfare* deaths per capita lower? **Plausibly Yes.**
  *   Is the total *human suffering inflicted by coercive power* lower? **Unknowable with current metrics.**

  Future arguments shall specify which of these questions is being asked. We agree to disagree on whether the umbrella term "violence" should cover all three.

  **Signed,**

  __________________________  
  *The Declinist*

  __________________________  
  *The Definitional Skeptic*
