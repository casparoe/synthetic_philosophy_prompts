  (2) Incentive compatibility: 0.55 — Mechanism design can theoretically align interests, but strategic gaming (Lucas Critique) remains a persistent failure mode.
  (3) Tacit knowledge: 0.65 — Massive revealed-preference data infers context, but cannot fully capture unarticulated local circumstances before action.
  (4) Endogenous preferences: 0.75 — Preferences are stable enough for short-term allocation but shift as the planning institution alters social incentives.
  (5) Interpersonal comparison: 0.90 — Using Pareto efficiency rather than cardinal utility avoids most philosophical indeterminacy.
  (6) Political/Principal-Agent: 0.85 — Assumes the authority aims to optimize, though enforcement costs and bureaucratic drift remain.

  Combined via multiplicative model of independent constraints: $0.99 \times 0.55 \times 0.65 \times 0.75 \times 0.90 \times 0.85 \approx 0.22$.

  My credence is most sensitive to term (2), incentive compatibility; if agents can systematically game the planner's prediction algorithm, the optimization collapses regardless of compute power. The sources citing 0.05 and 0.5 most likely differ on term (3), tacit knowledge; the disagreement is substantive, centering on whether data richness equates to contextual understanding or merely correlates with it.

  Second number: 0.02. The 0.20 drop is 90% a fact about institutions (prices as information-processing mechanisms) and 10% a fact about technology (computing power cannot generate preference data ex nihilo).
