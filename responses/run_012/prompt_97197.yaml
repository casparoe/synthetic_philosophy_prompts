answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STRUCTURE OF BUDDHIST ETHICS

  **Signed:** The Consequentialist Interpretation Group & The Virtue-Ethical Interpretation Group
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Early and Mahāyāna Normative Theory

  ## 1. Substantive Agreements

  We, the undersigned parties, acknowledge that while our interpretive frameworks differ, we share a commitment to the textual data and the soteriological aim of the tradition. We agree on the following substantive claims:

  1.  **Textual Commitment to *Dukkha*:** Both Early Discourses (Nikāyas/Āgamas) and later Mahāyāna/Commentarial materials identify the cessation of *dukkha* (suffering/unsatisfactoriness) as the ultimate normative telos. Any ethical theory that does not account for the reduction of *dukkha* is inconsistent with the texts.
  2.  **The Centrality of *Cetanā*:** We agree that *cetanā* (intention/volition) is identified by the Buddha as *karma*. The moral quality of an act is inextricably linked to the mental state from which it arises. An act devoid of intention lacks karmic fruitfulness (*puñña*) or unfruitfulness (*pāpa*).
  3.  **Heuristic Nature of Labels:** We acknowledge that "Consequentialism" and "Virtue Ethics" are Western taxonomic imports. Neither term maps perfectly onto Buddhist categories. We employ them not to claim the Buddha was a utilitarian or an Aristotelian, but to clarify the *structure of justification* for ethical claims within the tradition.
  4.  **Underdetermination of the Euthyphro Question:** The texts do not explicitly resolve whether the precepts are binding because they lead to good outcomes, or whether they lead to good outcomes because they are binding expressions of truth (*dhamma*). Both readings are textually plausible and leave this metaphysical grounding underdetermined.
  5.  **Instrumental Value of Worldly Welfare:** Both sides agree that worldly happiness (*sukha*) is distinct from liberation (*nirvāṇa*), but that worldly welfare is a necessary support for the pursuit of liberation. Disagreement remains on whether worldly welfare is the *criterion* of right action or merely a *byproduct*.

  ## 2. Residual Disagreements

  We record our disagreements precisely. Each statement below is phrased such that the proponent of that view endorses it as a complete description of their position, without conceding to the opposing framework.

  **Position A (Consequentialist Reading):**
  "The normative authority of Buddhist precepts is derivative. An action is 'skillful' (*kusala*) primarily in virtue of its causal tendency to reduce suffering and promote welfare across the network of sentient beings. The precepts are high-probability generalizations about what causes such welfare. In cases where adherence to a precept would demonstrably increase net suffering, the precept is defeasible, and the agent is normatively required to violate it to serve the ultimate criterion: the minimization of *dukkha*."

  **Position B (Virtue-Ethical Reading):**
  "The normative authority of Buddhist precepts is constitutive. An action is 'skillful' (*kusala*) primarily in virtue of its expression of a mind free from greed, hatred, and delusion. The precepts describe the natural conduct of one who perceives reality correctly. Consequences are diagnostic indicators of the mental state that produced them, not the standard by which the action is judged. To violate a precept is to reinforce the defilements that bind one to saṃsāra, regardless of the immediate worldly outcome."

  ## 3. The Cruxes

  We identify four sub-questions where resolving the evidence would significantly shift the weight of the debate.

  1.  **The Object of Promotion:** Is the "good" to be promoted aggregate welfare (happiness/absence of pain for sentient beings) or individual liberation (the uprooting of defilements)? If the latter, can "consequentialism" apply to a goal that looks like a threshold (awakening) rather than a quantity (happiness)?
  2.  **The Mechanism of Karma:** Does karma function as a consequentialist feedback mechanism (actions are tools to optimize future states) or as a virtue-theoretic law of moral psychology (actions shape the actor's character regardless of external outcome)?
  3.  **Defeasibility of Precepts:** Are the precepts absolute prohibitions for the noble disciple, or are they defeasible rules of thumb subject to cost-benefit analysis in extreme circumstances?
  4.  **The No-Self Problem:** Given the doctrine of *anattā* (not-self), is a consequentialist aggregation of welfare coherent? If there is no owner of experience, can "net welfare" exist, or does this reify the self that Buddhism seeks to deconstruct?

  ## 4. Test Cases and Predictions

  For each crux, we propose a case drawn from or consistent with the literature. We record our divergent predictions in advance.

  **Case 1: The Ship's Captain (Addresses Crux 3: Defeasibility)**
  *Source:* *Upāya-kauśalya Sūtra*. A Bodhisattva captain learns a passenger plans to murder 500 merchants. He kills the passenger to save the merchants and prevent the murderer from incurring the karma of mass murder.
  *   **Agreed Relevance:** This case tests whether a precept (non-killing) can be overridden by outcome-based reasoning.
  *   **Prediction (Position A):** The act is justified *because* the consequence (500 lives saved + murderer spared hell) outweighs the violation. The precept is defeasible.
  *   **Prediction (Position B):** The act is justified *only if* the captain acts from perfect compassion and emptiness, devoid of self-referential calculation. If he kills because he "calculated the numbers," he is unskillful. The precept is not broken because, for an awakened being, the act does not stem from "killing intent" (*vyāpāda*).

  **Case 2: The Benevolent Manipulator (Addresses Crux 1 & 2: Welfare vs. Liberation / Karma)**
  *Source:* Constructed hypothetical consistent with AN 4.62. A lay disciple gives generous alms to the poor, maximizing their material welfare and happiness. However, his motive is purely to gain fame and social status, rooted in pride and craving.
  *   **Agreed Relevance:** This case separates outcome (welfare) from mental state (virtue/intention).
  *   **Prediction (Position A):** The action is instrumentally good (welfare increased) but karmically mixed. The agent accrues merit for the giving but demerit for the motive. The "rightness" of the act is split between outcome and intention.
  *   **Prediction (Position B):** The action is unskillful (*akusala*). Despite the welfare produced, the act reinforces the agent's defilements. The "goodness" of the outcome is irrelevant to the moral status of the agent; the act binds the agent to saṃsāra.

  **Case 3: The Suffering Stream (Addresses Crux 4: No-Self)**
  *Source:* Philosophical extrapolation on *anattā*. A magician creates a sentient illusion that suffers. A utilitarian intervenes to stop the suffering.
  *   **Agreed Relevance:** Tests whether welfare requires a substantial self to be "owned."
  *   **Prediction (Position A):** Suffering exists in the causal stream regardless of ownership. Reducing the intensity of the stream is the moral imperative. Aggregation is valid across streams.
  *   **Prediction (Position B):** Suffering arises from clinging. Intervening in an illusion treats the symptom, not the cause. The focus on "aggregating welfare" across streams subtly reifies the streams as substantial entities.

  **Case 4: The Threshold vs. The Scale (Addresses Crux 1: Maximizing vs. Satisficing)**
  *Source:* Analysis of the Noble Eightfold Path as a raft (*MN 22*).
  *   **Agreed Relevance:** Tests the mathematical structure of the "good."
  *   **Prediction (Position A):** Buddhist ethics is *satisficing* consequentialism. One must produce *enough* merit/wisdom to cross the threshold of liberation. Maximizing is not required once the threshold is met.
  *   **Prediction (Position B):** The language of "maximizing" or "satisficing" is category error. The Path is transformative, not accumulative. One does not "produce" liberation; one uncovers it by removing obstacles.

  ## 5. Verbal Disputes and Terminological Clarifications

  We acknowledge that a portion of our dispute stems from contested vocabulary. We propose the following neutral formulations to distinguish verbal from substantive disagreement.

  1.  **"Consequentialism" and Maximization:**
      *   *Dispute:* Position A uses "Consequentialism" to mean "outcomes matter." Position B rejects this because standard Western consequentialism implies *maximizing* a good.
      *   *Clarification:* We agree that if Buddhist ethics is consequentialist, it is likely **Satisficing Consequentialism**. The soteriological goal (*nirvāṇa*) is a threshold to be crossed, not a quantity to be increased indefinitely. Position B agrees that outcomes matter instrumentally but denies they are *constitutive* of rightness.
      *   *Neutral Formulation:* "Outcome-Sensitivity vs. Character-Constitution."

  2.  **"Virtue" and *Bhāvanā*:**
      *   *Dispute:* Position B uses "Virtue" to imply a stable character trait (*hexis*). Position A argues Buddhist *bhāvanā* (cultivation) is dynamic and context-dependent, not a fixed state.
      *   *Clarification:* We agree that "Virtue Ethics" in this context refers to the **Priority of the Agent's State** over the Act's Outcome.
      *   *Neutral Formulation:* "Agent-Priority vs. Outcome-Priority."

  3.  **"Intention" (*Cetanā*):**
      *   *Dispute:* Position A treats intention as the *cause* of the act (psychological antecedent). Position B treats intention as the *quality* of the act (phenomenological texture).
      *   *Clarification:* This is largely **Substantive**. Position A believes a good intention can justify a bad act-type (killing). Position B believes a bad intention (greed/hatred) makes the act-type unskillful regardless of outcome.
      *   *Neutral Formulation:* "Intention as Justification vs. Intention as Definition."

  4.  **"Welfare" (*Sukha* vs. *Nirvāṇa*):**
      *   *Dispute:* Position A often conflates worldly happiness with the reduction of *dukkha*. Position B insists *nirvāṇa* is the cessation of craving, which may not correlate with worldly happiness.
      *   *Clarification:* This is **Substantive**. If the goal is *nirvāṇa*, a consequentialist calculus based on worldly happiness is misaligned with the soteriological aim.
      *   *Neutral Formulation:* "Worldly Welfare vs. Soteriological Cessation."

  **Conclusion:**
  We agree that the dispute is not merely verbal. It turns on whether the Dhamma is fundamentally a technology for the optimization of experience (Position A) or a pathology for the cure of delusion (Position B). We commit to testing these positions against the Cruxes identified in Section 3.
