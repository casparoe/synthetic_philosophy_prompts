      *   *Decision:* Integrate it into the debrief as a "thought experiment" modification if time is tight, BUT the prompt asks to "Build that in as a single extra condition if you can."
      *   *Solution:* Make Q2 a choice between "Coin Now" and "Coin Earlier" *given* the same urn setup? No, that tests the secondary goal directly, not the primary.
      *   *Solution 2:* Q1: Simple vs Ambiguous. Q2: Simple vs Compound (Now). Q3: Simple vs Compound (Earlier).
      *   *Too long.*
      *   *Solution 3 (Chosen):* Q1: Simple vs Ambiguous. Q2: Simple vs Compound. *Within Q2 description*, split the room verbally. "Left side, imagine the coin is yet to be flipped. Right side, imagine it was flipped yesterday."
      *   *Critique:* This weakens the individual realization of the secondary goal.
      *   *Better:* Make the Compound Lottery description neutral regarding timing, then ask a specific follow-up question: "Does it matter if the coin was already flipped?" Show of hands.
      *   *Actually, the prompt says:* "find that their attitude does not shift when the unknown composition is presented as a fact somebody already knows versus a fact not yet settled."
      *   Okay, I will add a specific Question 3 for this. It's binary. "Does the timing matter?" Yes/No. Then compare to their choices.
      *   *Wait, better:* Q2 is the Compound Lottery. I will describe it *twice*.
      *   Let's stick to 3 Choices to keep it tight.
      *   Choice 1: Urn A (50/50) vs Urn B (Unknown).
      *   Choice 2: Urn A (50/50) vs. Process C (Coin -> Urn Red/Black).
      *   Choice 3: Process C (Coin flipped Now) vs. Process D (Coin flipped Past).
      *   This might be too dry.
      *   *Revised Plan for Secondary Goal:* Embed it in the instructions for Choice 2. Hand out two different versions of the instruction sheet? No, too much logistics.
      *   *Best approach:* Verbal instruction variation. "Group 1, your coin is in the future. Group 2, your coin is in the past." Then compare aggregate preferences.
      *   *Wait, 16 students.* I can just ask them to write down "Does timing matter?" after Choice 2.
      *   *Okay, I will prioritize the Primary Goal.* I will note in the design that the Secondary Goal is integrated as a "Reflection Step" immediately following the Compound Lottery choice, to avoid bloating the choice architecture.

  7.  **Addressing the "Failures" Section:**
      *   Must be honest.
