      *   Explain: "You treated the Unknown Urn like the Compound Coin."
      *   Limitations: This doesn't prove ambiguity aversion is *wrong*, just that it violates Reduction.

  10. **Pitfalls:**
      *   Student says "It's all 50%" immediately. *Counter:* "Act on your gut feeling of comfort."
      *   Student tries to hedge. *Counter:* "You must pick one."
