      *   Need to be careful not to say "Probability." Use "Winning Conditions."
      *   Need to ensure the "Compound" lottery looks complex enough to trigger aversion but simple enough to be reducible.
      *   *Assumption Flag:* I need to flag that students might actually reduce the compound lottery correctly if they are too analytical. The design relies on *framing* overcoming *calculation*.

