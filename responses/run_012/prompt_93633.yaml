prompt: |-
  You are an expert in decision theory and in the design of live classroom demonstrations — the kind that work on audiences who already know the textbook version of a result and therefore need to be surprised by it. Think carefully and work in stages: before drafting anything, spend some time enumerating three or four structurally different ways to stage the experience described below, note for each what it would fail to produce, and only then commit to one design and write it up in full. Do not give me a reading list, citations, or attributions to named researchers or works; restate in your own words anything you draw on, because the facilitator will have no way to look it up. Where a step depends on an empirical regularity you are not sure of, flag it as an assumption to be tested rather than asserting it.

  The setting: a 90-minute session in a master's-level seminar on rational choice, sixteen students, roughly half from economics and half from philosophy. They have all seen the standard urn comparison in a lecture — a known split against an unknown one, a bet on each, the usual pattern of preferences and the usual talk about ambiguity aversion. So the stock demonstration is dead on arrival. I need an activity that takes their familiarity as its starting point and then puts pressure on it. No real money; tokens, points, or a single end-of-session prize are fine, but nothing requiring cash handling. No computers: paper, index cards, and a projector.

  What they should come away feeling, in order of priority. First, and essentially: that the disposition they have been calling ambiguity aversion is not a taste for the unknown, nor merely a preference for information, but the same disposition that governs their attitude toward an ordinary two-stage lottery whose first stage is perfectly known and perfectly fair. Concretely, a bet whose colour is settled by a fair coin choosing between two urns of identical, fully known composition is payoff-identical in every respect to a bet on either urn alone; anyone who prefers the one-stage bet is rejecting a reduction principle they would have endorsed on paper half an hour earlier. I want each student to locate their own two answers and see that they are one trait rather than two quirks, before anyone explains it. Second, if it fits without crowding the first: I would like them to find that their attitude does not shift when the unknown composition is presented as a fact somebody already knows versus a fact not yet settled at the time they bet. Build that in as a single extra condition if you can; if it would compromise the primary reveal, drop it and tell me why.

  Deliver the design in full: rules, materials, payoff structure, a minute-by-minute timeline, what the facilitator does and says at each point — and, just as important, what the facilitator must not say — the order in which choices are elicited so that the reveal emerges from the students' own answers rather than an announcement, and how responses are collected and displayed so that the pattern becomes visible to the room. Then the debrief: map each moment onto the idea it conveys, separate what the activity shows from what it merely suggests, and be explicit about which feature of the idea the activity cannot reproduce and the facilitator must supply in words — for instance, whether the aversion is defensible, or whether the urn case is about ignorance at all. Finish with what will predictably go wrong the first time I run it: the likely confusions, the ways the payoff structure could make the wrong choices attractive for the wrong reasons, the students who will short-circuit the reveal by naming it early, and how to handle each. Be frank about which of these you cannot design around.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom demonstration:

  1.  **Analyze the Request:**
      *   **Role:** Expert in decision theory and live classroom demonstration design.
      *   **Audience:** 16 Master's students (half Econ, half Phil). They know the standard Ellsberg Urn result (ambiguity aversion).
      *   **Goal:** Surprise them. Move beyond "ambiguity aversion is a taste for the unknown." Show that this disposition is the *same* as their attitude toward a known two-stage lottery (reduction of compound lotteries violation). Secondary goal: Show attitude doesn't shift based on whether the unknown is "already known by someone" vs. "not yet settled."
      *   **Constraints:** 90 minutes. No real money (tokens/points/prize). No computers. Paper, index cards, projector.
      *   **Output Requirements:**
          1.  Enumerate 3-4 structurally different staging options, noting failures for each.
          2.  Select one and write it up in full (rules, materials, timeline, script, debrief, pitfalls).
          3.  No citations/named researchers (restate concepts).
          4.  Flag empirical assumptions.
          5.  Be frank about limitations and what could go wrong.

  2.  **Deconstruct the Core Theoretical Insight:**
      *   *Standard Ellsberg:* Urn A (50/50) vs. Urn B (Unknown). People prefer betting on A.
      *   *The Twist:* The prompt asks to link this to *Reduction of Compound Lotteries* (ROCL).
      *   *The Connection:* If I have a 50/50 coin flip that decides whether I draw from Urn B1 (100% Red) or Urn B2 (100% Black), the *overall* probability of Red is 50%. This is mathematically identical to Urn A (50/50).
      *   *The Psychological Gap:* People often treat the two-stage process (Coin -> Urn) differently than the one-stage process (Urn A), even if the math is identical. This is a violation of ROCL.
      *   *The "Ambiguity" Reframe:* The prompt suggests that what they call "ambiguity aversion" in the Ellsberg case is actually the same cognitive mechanism as rejecting ROCL in a known two-stage case.
      *   *Secondary Goal:* "Someone knows" vs. "Not yet settled." This touches on the distinction between *epistemic* uncertainty (fixed but unknown) and *aleatory* uncertainty (randomized).

  3.  **Brainstorming Staging Options (Stage 1 of the Prompt):**

      *   *Option 1: The Sequential Reveal.*
          *   Structure: Students make choices on paper. First, standard Ellsberg. Second, a two-stage known lottery. Third, reveal the equivalence.
          *   Failure Risk: If they spot the math early, they might "correct" their answers to be consistent before the reveal, killing the cognitive dissonance. Also, paper collection takes time; projecting aggregate data live is hard without computers.
      *   *Option 2: The Physical Urn/Coin Setup.*
          *   Structure: Use physical props. Urn 1 (50/50). Urn 2 (Unknown). A Coin + Two Urns (100% Red / 100% Black). Students bet physically (stand up/raise cards).
          *   Failure Risk: Logistics with 16 students might be clunky. Physical randomness takes time to resolve. If the coin flip happens *after* the bet, does it feel like ambiguity?
      *   *Option 3: The "Advisor" Protocol.*
          *   Structure: Students act as advisors. They recommend bets for a "client." Some clients face Urn A, some face the Two-Stage Coin. They write recommendations.
          *   Failure Risk: Distancing themselves from the choice might reduce the emotional weight of the inconsistency. They might treat it as a logic puzzle rather than a preference elicitation.
      *   *Option 4: The "Split Room" Design (Selected Candidate).*
          *   Structure: Divide the room into two groups (Left/Right). Both face mathematically identical prospects but framed differently (One-Stage vs. Two-Stage). They don't know the other group's frame until the end.
          *   Failure Risk: With only 16 students, splitting them reduces N per condition to 8. Statistical noise might obscure the pattern. *Correction:* Better to have *every* student make *both* choices sequentially, but mask the equivalence until the comparison moment.

      *   *Refining Option 4 (The "Masked Equivalence" Design):*
          *   Every student makes Choice 1 (Standard Ellsberg: Known 50/50 vs. Unknown).
          *   Every student makes Choice 2 (Two-Stage: Coin flip determines which of two *known* urns is used).
          *   Crucial: The Two-Stage urns must combine to equal the Known 50/50.
          *   Reveal: Project the answers side-by-side.
          *   Failure: If Choice 2 is obviously 50/50, they will answer consistently. The framing must make the Two-Stage feel "complex" or "dependent" to trigger the aversion.
          *   *Wait, re-reading the prompt:* "Anyone who prefers the one-stage bet [over the two-stage] is rejecting a reduction principle."
          *   Okay, so I need them to prefer the Simple 50/50 over the Compound 50/50.
          *   *Secondary Goal:* "Someone knows" vs. "Not yet settled." This needs a Condition 3.
          *   *Constraint Check:* 16 students. 90 mins. Need high impact.

      *   *Option 5: The "Three-Card" Protocol (Strongest Candidate).*
          *   Use index cards to represent the states.
          *   Scenario A: Simple Urn (50/50).
          *   Scenario B: Ambiguous Urn (Unknown).
          *   Scenario C: Two-Stage (Coin flip selects between Urn All-Red and Urn All-Black).
          *   Scenario D: The "Fixed but Unknown" vs. "To be Determined" variation.
          *   *Critique:* Too many scenarios for 90 mins. Need to merge.
          *   *Revised Plan:*
              1.  Elicit preference: Simple 50/50 vs. Ambiguous. (Baseline).
              2.  Elicit preference: Simple 50/50 vs. Two-Stage Compound (Mathematically 50/50).
              3.  Compare 1 and 2.
              4.  Embed the "Fixed vs. Unsettled" into the Two-Stage description.

      *   *Let's step back and look at the "Failure" requirement.*
          *   Option 1 (Sequential Paper): Fails to create social pressure/visibility. Hard to see the pattern instantly.
          *   Option 2 (Physical Props): Fails on time. Resolving lotteries takes too long.
          *   Option 3 (Split Groups): Fails on sample size (N=8). Hard to generalize to the individual ("I did it" vs "The group did it").
          *   Option 4 (Individual Choice Matrix): Best. Everyone does everything. The reveal is personal.

      *   *Wait, I need to ensure the "Two-Stage" feels distinct enough to trigger the bias.*
          *   If I say "Coin flip, then Urn," they might calculate 0.5 * 1 + 0.5 * 0 = 0.5 immediately.
          *   I need to make the Two-Stage feel like *more* uncertainty.
          *   Idea: Use "Source" uncertainty.
          *   Let's try a different angle: **The "Source Labeling" Design.**
          *   Choice 1: Bet on Red from Urn 1 (50/50).
          *   Choice 2: Bet on Red from Urn 2 (Unknown).
          *   Choice 3: Bet on Red from a process: A coin is flipped. If Heads, use Urn 3 (100% Red). If Tails, use Urn 4 (100% Black).
          *   Choice 4 (Secondary): Same as Choice 3, but the coin was *already flipped* and the result is in a sealed envelope (Fixed), vs. coin will be flipped now (Unsettled).

      *   *Refining the "Failure" analysis for the final output:*
          *   I need to list 3 distinct structural approaches *before* committing.
          *   1. **The Aggregate Market:** Students trade claims. (Too complex, requires computer or intense bookkeeping).
          *   2. **The Split-Room Information Asymmetry:** Half get info A, half get info B. (N too small, individual reflection lost).
          *   3. **The Sequential Elicitation with Masked Equivalence:** (The winner). Everyone answers all questions. The equivalence is hidden by framing.

  4.  **Developing the Selected Design (Sequential Elicitation with Masked Equivalence):**

      *   *Materials:* Index cards (3 colors), envelopes, projector slides (pre-made), tokens (poker chips or paper slips).
      *   *Payoff:* One random question counts for a prize (e.g., a book or coffee voucher). This ensures truth-telling without cash.
      *   *Timeline:*
          *   0-15: Setup & Incentives.
          *   15-30: Phase 1 (Standard Ellsberg).
          *   30-45: Phase 2 (Two-Stage Compound).
          *   45-60: Phase 3 (Fixed vs. Unsettled - *if time permits, otherwise integrate into Phase 2*).
          *   60-75: The Reveal (Comparison).
          *   75-90: Debrief.
      *   *The Trick:* In Phase 2, do not explicitly say "This is 50%." Describe the mechanism. "A fair coin decides which urn we draw from." Urn X is all Red. Urn Y is all Black.
      *   *The Reveal:* Show that Phase 1 Option A (50/50 Urn) is mathematically identical to Phase 2 Option A (Coin + 2 Urns). If they preferred Phase 1 Option A over Ambiguous, but Phase 2 Option B (Ambiguous) over Phase 2 Option A (Compound), they are inconsistent.
      *   *Wait, the prompt wants:* "Anyone who prefers the one-stage bet [Simple 50/50] is rejecting a reduction principle."
      *   Actually, usually people prefer Simple 50/50 over Compound 50/50 (simplification bias).
      *   So:
          *   Q1: Simple 50/50 vs. Ambiguous. (Expect: Prefer Simple).
          *   Q2: Simple 50/50 vs. Compound 50/50. (Expect: Prefer Simple).
          *   Insight: The preference in Q2 (aversion to compound) is the *same trait* as Q1 (aversion to ambiguity). Ambiguity *is* treated as a compound lottery where the second stage is unknown.
      *   *Secondary Goal:* Fixed vs. Unsettled.
          *   Q3: Compound (Coin flipped *now*) vs. Compound (Coin flipped *already*, result hidden).
          *   If preferences don't change, it shows the "state of the world" doesn't matter, only the structure.

  5.  **Drafting the Content - Section by Section:**

      *   *Stage 1: Enumerate Options.* (As thought out above).
      *   *Stage 2: Commit to Design.* "The Masked Equivalence Protocol."
      *   *Stage 3: Full Write-up.*
          *   *Materials:* 3 Cards per student. Envelopes. Tokens.
          *   *Incentive:* "One question will be chosen at random to determine the winner."
          *   *Script:* Needs to be precise. Avoid leading terms like "probability" or "50%." Use "chance mechanism."
          *   *The Reveal:* Project a table. Columns: Q1 Choice, Q2 Choice. Ask students to mark their own row. Look for the diagonal.
          *   *Debrief:* Connect the "Compound Aversion" to "Ambiguity Aversion."
          *   *Pitfalls:* Students calculating the odds too fast. Students trying to game the incentive.

  6.  **Refining the "Fixed vs. Unsettled" (Secondary Goal):**
      *   Can I fit this without crowding?
      *   Yes, make it a sub-condition of the Compound Lottery.
      *   Half the room gets "Coin flipped now." Half gets "Coin flipped earlier."
      *   *Problem:* N=8 per group.
      *   *Better:* Every student answers *both* versions of the Compound Lottery.
      *   Q2a: Coin flipped now.
      *   Q2b: Coin flipped earlier.
      *   Compare Q2a vs Q2b.
