answer: |-
  ### Part 1: Structural Options and Failure Analysis

  Before settling on the final design, I considered three distinct ways to stage this session. Each attempts to reveal the link between ambiguity aversion and the rejection of compound lottery reduction, but each carries specific risks in this context.

  **Option 1: The Market Mechanism**
  *   **Structure:** Students are given endowments of tokens and allowed to trade "claims" on different urn outcomes. Prices settle based on supply and demand.
  *   **Why it fails:** Markets tend to punish inconsistency. If even two students recognize the mathematical equivalence between the simple 50/50 urn and the two-stage coin process, they will arbitrage the difference. This forces prices to align, hiding the individual psychological bias. The "smart" students correct the market, and the "biased" students hide behind the price. You lose the individual cognitive dissonance required for the lesson.

  **Option 2: The Split-Room Information Asymmetry**
  *   **Structure:** Half the class gets the "Simple vs. Ambiguous" choice; the other half gets the "Simple vs. Two-Stage" choice. You compare aggregate results between the two groups.
  *   **Why it fails:** With only sixteen students, splitting the room leaves eight data points per condition. Random noise will dominate. More importantly, this makes the inconsistency a *group* phenomenon rather than a *personal* one. A student can say, "The other group felt differently," rather than, "I contradicted myself." The lesson requires them to confront their own internal logic, not a statistical aggregate.

  **Option 3: The Hypothetical Discussion**
  *   **Structure:** No tokens or prizes. You simply pose the scenarios and ask for a show of hands.
  *   **Why it fails:** Without "skin in the game," students treat this as a logic puzzle rather than a decision. They will answer how they think a rational agent *should* answer, not how they *would* answer. You will get the textbook response (consistency) rather than the behavioral reality (inconsistency).

  **Selected Design: The Masked Equivalence Protocol**
  I commit to a sequential elicitation design where every student makes every choice, but the mathematical equivalence is masked by framing until the final reveal. This ensures high N (16 per condition), individual accountability (via a prize draw incentive), and a personal confrontation with inconsistency.

  ***

  ### Part 2: The Demonstration Design

  **Session Title:** The Structure of Uncertainty
  **Duration:** 90 Minutes
  **Participants:** 16 Students
  **Materials:**
  *   16 Envelopes (labeled "Payoff").
  *   48 Index Cards per student (3 distinct colors, e.g., White, Blue, Yellow).
  *   1 Physical Coin (large, visible).
  *   2 Opaque Urns (or boxes/bags).
  *   Projector Slides (pre-loaded, no internet needed).
  *   Tokens (poker chips or paper slips) for accounting.

  **Incentive Structure:**
  To ensure serious choices without cash handling: At the end of the session, one student will be selected at random. For that student, *one* of their three choices will be selected at random and played for real. The prize is a fixed reward (e.g., a book voucher or coffee card). This "Random Problem Selection" mechanism ensures they must treat every choice as if it were the one that counts.

  #### Phase 1: Setup and Incentives (0:00 – 0:15)

  **Facilitator Action:**
  Distribute 3 Index Cards and 1 Envelope to each student. Explain the incentive mechanism clearly.

  **Script (Key Points):**
  "You have three cards. On each, you will mark a choice. At the end, I will draw a name, then draw one of that person's cards. We will resolve that specific bet. The winner gets the prize. Because any card could be the one that counts, you must mark the choice you truly prefer on every card."

  **Constraint:** Do not use the words "Probability," "Expected Value," or "50%." Use "Chance," "Likelihood," or "Winning Conditions."

  #### Phase 2: The Standard Elicitation (0:15 – 0:35)

  **Goal:** Establish the baseline Ambiguity Aversion.

  **Slide 1:** Displays two options.
  *   **Option A (The Known):** Urn 1 contains 50 Red balls and 50 Black balls. You win if you draw Red.
  *   **Option B (The Unknown):** Urn 2 contains 100 balls. The number of Red and Black balls is unknown (could be 100 Red, could be 0 Red, anything in between). You win if you draw Red.

  **Facilitator Action:**
  Place physical props on the table. Urn 1 is transparent (show the 50/50 split). Urn 2 is opaque.
  "Take your **White Card**. Mark 'A' if you prefer Option A. Mark 'B' if you prefer Option B. Put it in your envelope. Do not discuss."

  **Collection:** Collect the White Cards. Do not look at them yet. Stack them visibly on the desk.

  #### Phase 3: The Compound Lottery (0:35 – 0:55)

  **Goal:** Elicit preference regarding a two-stage known lottery without revealing its equivalence to Option A.

  **Slide 2:** Displays two options.
  *   **Option C (The Simple):** Urn 1 contains 50 Red balls and 50 Black balls. You win if you draw Red. (Identical to Option A).
  *   **Option D (The Process):** We flip this coin.
      *   If **Heads**: We use Urn 3 (Contains 100 Red balls).
      *   If **Tails**: We use Urn 4 (Contains 100 Black balls).
      *   You win if the ball drawn is Red.

  **Facilitator Action:**
  Show Urn 3 (all Red) and Urn 4 (all Black). Show the coin. Emphasize the *two steps*.
  "Take your **Blue Card**. Mark 'C' if you prefer Option C. Mark 'D' if you prefer Option D. Put it in your envelope."

  **Assumption to Flag:** *This design assumes students will perceive Option D as "more uncertain" or "more complex" than Option C due to the extra stage, even if they can calculate the math. If the room is too mathematically trained, they may reduce the lottery instantly. If this happens, the reveal fails. I am assuming the framing of "Process" vs. "Urn" triggers a psychological distinction.*

  **Secondary Goal Integration (Fixed vs. Unsettled):**
  Immediately after they seal the Blue Card, but before collecting:
  "Pause. On the back of your Blue Card, write 'Yes' or 'No'. Question: If I told you the coin for Option D was flipped *yesterday* and the result is in a sealed envelope, but you don't know the result, would you change your choice on this card?"
  Collect the Blue Cards.

  #### Phase 4: The Reveal (0:55 – 1:10)

  **Goal:** Make the inconsistency visible to the students before explaining it.

  **Facilitator Action:**
  Project a blank 2x2 table.
  Rows: "Preferred Unknown (White Card)" vs. "Preferred Known (White Card)".
  Columns: "Preferred Process (Blue Card)" vs. "Preferred Simple (Blue Card)".

  **Script:**
  "I am not going to tell you what the right answer is. I am going to show you what you answered. I need you to help me fill this grid."

  1.  "Raise your hand if you chose the **Unknown Urn** on the White Card." (Count them, mark the Row).
  2.  "Keep your hand up if you also chose the **Process (Coin)** on the Blue Card." (Count them, mark the Cell).
  3.  "Now, raise your hand if you chose the **Known Urn** on the White Card."
  4.  "Keep your hand up if you chose the **Simple Urn** on the Blue Card."

  **The Critical Cell:**
  Focus on the students who chose **Known Urn (White)** AND **Simple Urn (Blue)**.
  "Look at your own two cards. You preferred the Known Urn over the Unknown one. And you preferred the Simple Urn over the Coin Process."

  **The Reveal Statement:**
  "Look at Option A (White Card) and Option C (Blue Card). They are the same urn.
  Look at Option D (Blue Card). It is a coin flip between All-Red and All-Black. Mathematically, that is a 50% chance of Red.
  Option A is a 50% chance of Red.
  If you preferred Option A over the Unknown, but also Option A over Option D, you have treated the Unknown Urn and the Coin Process differently, even though your preference for the Simple Urn was consistent."

  *Correction for the specific theoretical goal:* The prompt asks to show that Ambiguity Aversion is the *same* disposition as rejecting Reduction.
  So I need to highlight the students who chose:
  1.  **Known Urn** over **Unknown Urn** (Ambiguity Aversion).
  2.  **Known Urn** over **Coin Process** (Reduction Violation).

  "Those of you who raised your hand for the Known Urn *both* times: You rejected the Unknown, and you rejected the Compound. You treated the 'Unknown' exactly like you treated the 'Two-Stage.' You didn't dislike the unknown; you disliked the *structure*."

  #### Phase 5: Debrief and Mapping (1:10 – 1:30)

  **Facilitator Action:**
  Do not lecture immediately. Ask the students to interpret the grid.

  **Key Discussion Points (In Order):**
  1.  **The Reduction Principle:** "If you believe that a 50/50 urn is the same as a Coin Flip between two certain urns, you accept Reduction. If you preferred the Urn over the Coin, you rejected it."
  2.  **The Link:** "Ambiguity Aversion is often described as 'fearing the unknown.' But look at the Coin Process. Everything was known. The urns were known. The coin was fair. Yet, many of you still preferred the Simple Urn. This suggests your 'aversion' isn't about missing information. It's about the *layering* of uncertainty."
  3.  **The Secondary Goal (Fixed vs. Unsettled):** "Look at the back of your Blue Card. Did anyone write 'Yes'? Did anyone change their mind knowing the coin might already be flipped?"
      *   *Expected Result:* Most will write 'No'.
      *   *Interpretation:* "Your discomfort didn't come from the fact that the result was unsettled. It came from the description of the process. Whether the uncertainty is in the future (coin to flip) or the past (coin flipped but hidden), your preference remained the same. This confirms the attitude is about the *description of the bet*, not the *state of the world*."

  **What the Activity Shows vs. Suggests:**
  *   **Shows:** That a significant portion of the room violates the Reduction of Compound Lotteries principle in a controlled setting.
  *   **Shows:** That this violation correlates with Ambiguity Aversion.
  *   **Suggests:** That Ambiguity Aversion might be *explained* by a failure to reduce compound lotteries (treating the unknown urn as a two-stage process where the first stage is the 'type' of urn).
  *   **Cannot Reproduce:** The activity cannot prove which behavior is *normatively correct*. It cannot tell them if they *should* be ambiguity averse. It only shows they are inconsistent with a specific axiom (Reduction). The facilitator must supply the normative context: "Standard theory says you should reduce. Behavioral theory says you don't. Whether that makes you 'irrational' depends on whether you value the axiom more than your comfort."

  ***

  ### Part 3: Anticipated Failures and Mitigation

  **1. The "Calculator" Problem**
  *   **Risk:** A student immediately says, "Option D is just 50%. It's the same as Option A." They announce this before others have marked their cards.
  *   **Impact:** This breaks the masking. Other students will "correct" their answers to match the math, destroying the data.
  *   **Mitigation:** Pre-brief the room: "I am not testing your math. I am testing your comfort. Even if two things are mathematically equal, you might prefer the look of one over the other. Answer based on preference, not calculation." If a student speaks up, acknowledge them: "That is the mathematical view. Please record your *gut* preference for the purpose of this exercise."

  **2. The Incentive Confusion**
  *   **Risk:** Students think they need to hedge (pick different options to ensure a win) or think only the final choice counts.
  *   **Impact:** Noise in the data.
  *   **Mitigation:** Use the "Random Problem Selection" script verbatim. Write it on the board. "One Person. One Card. One Draw." Repeat this three times during the session.

  **3. The Secondary Goal Ambiguity**
  *   **Risk:** Students interpret "Coin flipped yesterday" as "Someone knows the result," triggering a fairness concern rather than an uncertainty concern.
  *   **Impact:** They might switch choices not because of uncertainty, but because they feel "someone else knows" creates an adversarial setting.
  *   **Mitigation:** In the script, specify: "The result is in a sealed envelope. No human has looked at it. It is physically fixed, but epistemically hidden." If students still object, flag this in the debrief as a limitation: "The activity isolates the timing, but it cannot fully isolate the 'adversarial' feeling of someone else knowing."

  **4. The "So What?" Reaction**
  *   **Risk:** Students agree they are inconsistent but feel it doesn't matter. "I know I'm biased, so what?"
  *   **Impact:** The session ends without theoretical weight.
  *   **Mitigation:** The facilitator must close with the consequence: "If you reject Reduction, you cannot use standard probability models to describe your choices. You need a different mathematics. This isn't just a quirk; it breaks the standard toolkit."

  **5. Sample Size Noise**
  *   **Risk:** With 16 students, you might get a split that looks random (e.g., only 2 people show the inconsistency).
  *   **Impact:** The reveal falls flat.
  *   **Mitigation:** Be prepared to aggregate hypothetically. "In larger studies, this cell is usually the largest. Today, we have a small sample, but look at [Student X] and [Student Y]. You two clearly show the trait." Do not fake data, but contextualize the small N as a "pilot" of a larger phenomenon.

  **Final Facilitator Note:**
  Do not defend the standard theory. Do not defend the behavioral bias. Your role is to make the contradiction visible. If you argue for one side, the students will align with you to please the instructor. Remain neutral. Let the inconsistency bother *them*.
