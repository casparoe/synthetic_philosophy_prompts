          *   *Better Counterexample:* *Negative* acceleration. Someone publishes a wrong proof that delays the field by 10 years. They were "first." They get priority. But they *decelerated* the truth. The essay equates priority with *positive* acceleration of the *result*. But priority often goes to the first *publication*, even if it sets the field back.
