prompt: |-
  I chair the clinical ethics committee at a teaching hospital, and next week we must decide a case that I expect to divide us. What I want from you is not a general treatment of advance directives but a recommendation that keeps faith with our own record, and, if that record cannot settle the matter, a clear statement of the principle we would be adopting by going either way.

  Here is the record. A man with advanced ALS who had lived with the diagnosis for three years executed a directive refusing mechanical ventilation; when he came in with respiratory failure, unable to speak and not in evident distress, we honored it and he died on the ward. A man of twenty-nine, in ordinary health, had signed a directive refusing all life-sustaining treatment whatever his condition; five years later he was admitted with a treatable meningitis, we overrode the directive and treated him, and he thanked us afterwards. A woman with early Alzheimer's, who had spent six years nursing her mother through the same illness, wrote a directive refusing antibiotics, hospitalization, and artificial feeding once she no longer knew her family; when she reached that point, comfortable and making no objection, we declined to place a feeding tube, over the objection of her brother. A man with a long history of severe depression, who had undergone electroconvulsive therapy before and knew what it involved, inserted a clause instructing us to disregard any later refusal of that treatment; when he later refused it, we treated him, and he was glad of it. A woman on dialysis for end-stage renal disease, who detested the treatment, refused further sessions; we honored that.

  The case before us is a woman of seventy-one with moderate dementia. At sixty-two, after nursing her sister through Alzheimer's to the end, she executed a detailed directive refusing antibiotics, hospitalization, and artificial nutrition and hydration once she stopped recognizing her husband, whom she named as her proxy. She added a sentence in her own hand: that if she ever seemed to want to eat or drink, we should remember that this was the illness speaking, and that her real wishes were the ones written in the document. She is now on our unit, no longer recognizes her husband, and has aspiration pneumonia. She appears to be in no pain; she eats with apparent pleasure when fed, smiles at the aides, and seems at home in the place. Twice in the past month, during a cold, she said clearly that she did not want to die, and once asked to be taken to the hospital; her capacity to make this particular decision is disputed. Her husband, the named proxy, holds that the directive governs and wants comfort care only. Her son, the alternate proxy, holds that a course of antibiotics would return her to a life she is visibly enjoying, and that it would be wrong to let her die of something so easily treated.

  Tell me how we should decide if we mean to be consistent with ourselves, which of the earlier cases is the closest analog, which other rules fit our record just as well as the one you favor, and, if the record genuinely underdetermines this case, what principle each course of action would commit us to. I would also like to know which further case, one we have not yet had, would best tell those rules apart. I am not asking for case law or a review of the literature; I want the structure of the argument, in continuous prose, with no headings, no bullet points, no bold text, and no tables.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a clinical ethics committee at a teaching hospital.
      *   **Task:** Provide a recommendation for a specific case based on the hospital's past record (precedents), not general literature or case law.
      *   **Constraints:**
          *   No general treatment of advance directives.
          *   Keep faith with the hospital's record.
          *   If the record doesn't settle it, state the principle adopted by going either way.
          *   Identify the closest analog from the record.
          *   Identify other rules from the record that fit just as well.
          *   Identify a further hypothetical case that would best distinguish the rules.
          *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables.
          *   **Tone:** Professional, analytical, ethical, consistent with an ethics committee chair.

  2.  **Analyze the Hospital's Record (Precedents):**
      *   *Case 1 (ALS):* Advanced ALS, 3 years living with diagnosis, directive refusing ventilation. Honored directive. Patient died. (Principle: Autonomy/Precedent Autonomy holds when condition matches expectation).
      *   *Case 2 (Young Man/Meningitis):* 29yo, healthy, directive refusing *all* life-sustaining treatment. Treatable meningitis 5 years later. Overrode directive. Patient thanked them. (Principle: Context matters; generic/reflexive directives in healthy youth may not reflect settled values in treatable acute conditions. Paternalism/Benevolence overrode strict autonomy).
      *   *Case 3 (Alzheimer's Woman):* Early Alzheimer's, nursed mother, directive refusing antibiotics/feeding once didn't know family. Honored directive (no feeding tube) over brother's objection. (Principle: Precedent autonomy holds in dementia when condition matches specific anticipation. Family objection overruled by prior competent wish).
      *   *Case 4 (Depression/ECT):* Severe depression, history of ECT, clause to disregard later refusal. Later refused, treated anyway. Patient glad. (Principle: Ulysses clause/Psychiatric advance directive honored over contemporaneous refusal due to nature of illness affecting capacity/judgment).
      *   *Case 5 (Dialysis Woman):* ESRD, detested treatment, refused further sessions. Honored refusal. (Principle: Contemporaneous refusal by capable patient honored, even if life-ending).

  3.  **Analyze the Current Case:**
      *   **Patient:** 71yo woman, moderate dementia.
      *   **Directive:** Executed at 62 (9 years prior), after nursing sister with Alzheimer's. Refuses antibiotics, hospitalization, ANH once she stops recognizing husband.
      *   **Specific Clause:** Handwritten note: "if she ever seemed to want to eat or drink, we should remember that this was the illness speaking, and that her real wishes were the ones written in the document."
      *   **Current State:** No longer recognizes husband. Aspiration pneumonia. No pain. Eats with apparent pleasure, smiles, seems at home.
      *   **Contemporaneous Signals:** Twice said she did not want to die, once asked to go to hospital during a cold. Capacity for *this* decision disputed.
      *   **Proxies:** Husband (named) wants comfort care (follow directive). Son (alternate) wants antibiotics (follow current apparent enjoyment/life).

  4.  **Determine Consistency/Precedent:**
      *   *Closest Analog:* Case 3 (Alzheimer's Woman). Both involve dementia, specific anticipation of the condition (nursing a relative), specific triggers (not knowing family/husband), and refusal of antibiotics/feeding. In Case 3, the committee honored the directive over family objection. Here, the husband (proxy) supports the directive, while the son objects. This strengthens the case for honoring the directive compared to Case 3.
      *   *Conflicting Analog:* Case 2 (Young Man/Meningitis). Here, a directive was overridden because the condition was treatable and the patient seemed to benefit from living. The current patient seems to be enjoying life ("eats with apparent pleasure," "smiles"). The son's argument mirrors the logic used in Case 2 (treatable condition, life worth living).
      *   *Conflicting Analog:* Case 4 (Depression/ECT). This involved a Ulysses clause (disregard later refusal). The current patient has a reverse Ulysses clause (disregard apparent desire to eat/drink as illness speaking). In Case 4, the committee honored the prior instruction over the contemporaneous refusal. Here, the prior instruction is to disregard contemporaneous *acceptance* (wanting to eat/live). If we were consistent with Case 4, we should honor the prior instruction to disregard the current apparent desire to live.
      *   *Conflicting Analog:* Case 5 (Dialysis). Honored contemporaneous refusal. Here we have contemporaneous *request* for treatment (wanting to go to hospital/not die), but capacity is disputed. If capacity is deemed intact, Case 5 suggests honoring current wish. If capacity is deemed impaired, Case 3 and 4 suggest honoring prior directive.

  5.  **Synthesize the Argument:**
      *   *Tension:* The core tension is between "Precedent Autonomy" (Case 1, 3, 4) and "Beneficence/Current Well-being" (Case 2, potentially 5 if capacity exists).
      *   *The Specific Twist:* The patient is expressing a desire to live *now* (unlike Case 3 where she was comfortable and making no objection, and unlike Case 1 where she was unable to speak). She is asking for hospitalization. However, her capacity is disputed. The directive specifically anticipates this ambiguity ("illness speaking").
      *   *Consistency:* To be consistent with Case 3 (Alzheimer's) and Case 4 (Depression/Ulysses), the committee should honor the directive. Case 3 is the strongest analog because it involves dementia, specific anticipation via caregiving experience, and refusal of antibiotics/feeding upon loss of recognition. The fact that the husband (proxy) agrees reinforces Case 3 (where the brother objected and was overruled).
      *   *The Challenge:* Case 2 (Meningitis) suggests overriding directives when the condition is treatable and the patient appears to have a quality of life worth saving. The patient's current happiness ("smiles," "apparent pleasure") echoes the outcome of Case 2 (patient thanked them).
      *   *Resolution:* The distinguishing factor is the specific anticipation of the *exact* scenario. In Case 2, the young man refused *all* treatment in *any* condition (generic). In Case 3 and the Current Case, the directive is specific to the dementia trajectory and loss of recognition. The handwritten note specifically addresses the possibility of apparent enjoyment ("illness speaking"). This makes the Current Case align more closely with Case 3 and 4 than Case 2.
      *   *Principles:*
          *   Honoring Directive: Principle of Precedent Autonomy. The competent self binds the incompetent self, especially when specific scenarios were anticipated and current capacity is compromised by the very condition predicted.
          *   Overriding Directive: Principle of Beneficence/Current Interest. The current experiencing self's apparent welfare and desire to live outweighs the past self's abstract prediction, especially when treatment is low-burden (antibiotics) and effective.
      *   *Differentiating Case:* A case where a patient with dementia has a directive refusing treatment, but currently expresses a *stable, capacitated* desire to live (verified by independent psych eval). This would test the limit of Precedent Autonomy vs. Current Autonomy. Or, a case where the directive was generic (like Case 2) but the condition was chronic/degenerative (like Case 3).

  6.  **Drafting the Response (incorporating constraints):**
      *   Must be continuous prose.
      *   No headings, bullets, bold, tables.
      *   Address: Recommendation, Closest Analog, Other Rules/Fit, Principles if underdetermined, Further Case to distinguish.
