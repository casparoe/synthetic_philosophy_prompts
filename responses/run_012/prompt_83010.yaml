prompt: |-
  Right, I need a number off you, and I need to see how you get to it. Setting first, so we're not talking past each other: risk-weighted expected utility is the framework where you take an act, rank its possible outcomes from worst to best, and instead of weighting each outcome by its own probability you weight it by the *jump* in a risk function r evaluated at the cumulative probability — so the worst outcome gets weight r(p1), the next gets r(p1+p2) − r(p1), and so on. r concave means you're risk averse; r linear and you're back to plain expected utility. Buchak's version of the view says r is a basic feature of a rational agent's attitudes, sitting alongside beliefs and desires rather than being a roundabout way of describing how much the goods at stake are worth to her.

  Here's the claim I want a credence on. Call it IRREDUCIBLE: there are actual, or at least clearly concievable and psychologically realistic, rational agents whose Allais-type risk aversion cannot be re-described as diminishing marginal utility of the goods at stake, so that the risk function is a genuinely separate and irreducible parameter of rational choice rather than a repackaging of utility curvature. Give me your number on IRREDUCIBLE, then decompose it. I want a rough probability on each of at least these four, and I want to see how they combine into the final figure:

  (i) whether the expected-utility axioms are rationally compulsory in the first place — if they are, IRREDUCIBLE looks either false or vacuous, so say which;
  (ii) the identifiability question. Can any finite body of choice data, in principle, tell the r-concave/linear-u agent apart from the linear-r/concave-u agent? If it can't, is that a reason to think there's no fact of the matter here, or a reason to think one hypothesis is still better supported on other grounds — parsimony, fit with what the agent says about herself, stability across contexts, how each hypothesis generalises to new stakes;
  (iii) whether the best explanation of real Allais-ish behaviour is a risk attitude at all, as opposed to probability weighting, regret, plain noise and error, or preferences that are just context-dependent;
  (iv) whether 'rational' in the claim is doing work about the agent's attitudes or only about her choice pattern — i.e. whether two agents with identical behaviour but different r/u splits could both be fully rational in the same sense.

  Then two extra things. First, a twist I want you to actually engage with, because it's the bit that makes me doubt the whole picture: on this view r is a property of the agent, so one agent should be carrying one r around across domains. But the people I know are risk averse about their money and risk neutral, sometimes even risk seeking, about the chances they hand out to other people, or about their own health as against their own money. Does that domain-variation have to be treated as an error theory about their attitudes, or does r get indexed to a domain — and if it does get indexed, has anything of the original view survived? Say how your answer feeds back into the number.

  Second, tell me which of your terms the final figure is most sensitive to, and what would move it by more than 0.1 either way — an argument, or a bit of data. And if you think IRREDUCIBLE is really two or three questions wearing one coat, say which and give me a number for each.

  Answer in British English, and don't bother with citations, references or reading lists — neither of us can check them.
