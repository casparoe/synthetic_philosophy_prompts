prompt: |-
  Two friends of mine have been argueing about the Trojan War, King Arthur and the Exodus for years: one's a maximalist who thinks there's a real historical kernel under each story, the other thinks "did it happen" is the wrong question becuase these traditions are literary and theological artifacts all the way down. Write the joint statement they could actually both sign after an honest adversarial collaboration. No citations, no reading lists -- just what a careful person could reason out.

  I want: what they agree on about what the evidence in each case even is, including the folklore point that a legend is a genre defined by being told as true and pinned to real people and places, which puts it in a permanent zone of half-belief -- never quite believed, never quite doubted -- so that "legend" isn't a stage a story graduates out of once evidence arrives; the residual disagreement stated twice, once in wording the maximalist would accept and once in wording the minimalist would accept; the cruxes -- I'd guess one is how much weight a long gap between the supposed event and the earliest attestation should carry, and another is whether centuries of survival shifts the burden of proof at all; and for each crux, something both sides agree would bear on it, with each side's prediction written down in advance. Then tell me where the three cases come apart -- I suspect Arthur isn't the same shape of problem as the other two -- and whether part of the fight is really just about what "historical" means.
