      *   **Diagnosis 1: Prophecy vs. Mechanism.** Dan sees a prediction. User sees a constraint. Malthus wrote both, which fuels the fire.
      *   **Diagnosis 2: The Empirical Core.** The real fight isn't 1800-present. It's 10,000 BC - 1800 AD. If the trap held then, User wins on "mechanism." If it didn't, Dan wins on "theory." Mention Gregory Clark (*A Farewell to Alms*) and Unified Growth Theory (Galor).
      *   **Diagnosis 3: Falsification vs. Scope (The Principled Line).** Use the *Ex-Ante* rule. A scope condition is legitimate if stated *before* the anomaly arises (or is intrinsic to the math). A rescue is ad hoc if invented *after* to explain away failure. Malthus's "fixed technology" is implicit but structural. However, Malthus *did* think tech improvement was slow/impossible to outpace, so Dan has a point on the *intent*.
      *   **The "Right but Early" Problem.** This is the crux. In social science, a model that explains 99% of human history but fails on the last 1% is incredibly powerful, yet technically "falsified" in the long run.
      *   **Resolution/Path Forward.**
