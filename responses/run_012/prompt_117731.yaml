      *   *Absorb:* The Intention Theorists. Their "standing intention" is compatible with "type" if I frame type as the *source* of the intention's stability.
      *   *Hold the Line:* The Decision Theorist on EDT. I need to insist this isn't just EDT; it's about metaphysical grounding of the disposition.
