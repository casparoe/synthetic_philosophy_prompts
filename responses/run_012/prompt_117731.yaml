      *   *Key Move:* The "intention" at $t_1$ (desert) doesn't cause the "payment" at $t_2$ (town) if the agent is rational at $t_2$. Therefore, the driver won't believe the intention. The driver believes the *type*.
      *   *Vulnerability:* Is "type" just a fancy word for "disposition"? Is this just pre-commitment? Is it circular? Does it actually solve the rationality problem or just move it?

