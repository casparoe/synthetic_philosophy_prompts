  7.  **Final Polish:** Ensure the tone is supportive but rigorous. The user wants to survive a hostile Q&A. The advice needs to be tactical. (Self-Correction: Make sure the "Secret Fear" is truly the one that undermines the whole project, not just a technicality.)

