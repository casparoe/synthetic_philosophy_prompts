  2.  **$P(\text{Verbal Distinction}) = 0.70$**
      *   *Justification:* If two states produce identical downstream causal chains (reports, behavior, neural traces), physicalism suggests they are identical states, making the difference merely descriptive.
  3.  **$P(\text{Stalinesque} | \text{Determinacy}) = 0.50$**
      *   *Justification:* Given a determinate timeline exists, there is no prior reason to favor data-waiting (Stalinesque) over memory-editing (Orwellian) without empirical leverage.
  4.  **$P(\text{Empirical Decidability}) = 0.30$**
      *   *Justification:* It is unclear how any measurement could access the "moment of experience" independently of the memory/report mechanisms that Dennett argues constitute it.

  **Combination Logic:**
  $$P(\text{Fact}) = P(\text{Temporal Determinacy}) \times (1 - P(\text{Verbal Distinction})) \times \sqrt{P(\text{Empirical Decidability})}$$
  $$0.60 \times 0.30 \times 0.55 \approx 0.18$$
  *(Note: The Stalinesque probability distributes the 0.18 but does not generate it; Empirical Decidability is square-rooted to allow for ontological realism despite verification difficulties, though heavily penalized.)*

