  # JOINT STATEMENT ON THE ARGUMENT FROM ILLUSION
  **Prepared for the [Name] Reading Group**
  **Signatories:** [Disjunctivist Name] & [Representationalist Name]
  **Date:** October 26, 2023

  ## PREAMBLE
  We, the undersigned, acknowledge a persistent disagreement regarding the metaphysics of perception, specifically triggered by the **Argument from Illusion**. While we have previously allowed the debate to drift toward hallucination (where no object is present), we agree that the **Illusion Case** (e.g., the straight stick appearing bent in water) is the stronger testing ground. In illusion, an object *is* present, which complicates the Disjunctivist claim that veridical and non-veridical cases share no common ontological ground.

  This document outlines our shared commitments, isolates our substantive disagreements, and identifies the specific "cruxes" that determine the outcome. We explicitly adopt a distinction suggested by a colleague to clarify the dialectic: the distinction between **Phenomenal Commonality** ("looks-the-same") and **Ontological Commonality** ("is-the-same").

  ---

  ## I. SHARED CONCEPTUAL FRAMEWORK & AGREED CLAIMS
  *Both signatories affirm the following claims. Denial of any claim below constitutes a withdrawal from this collaboration.*

  1.  **The Phenomenon:** In the standard illusion case (straight stick half-submerged in water), the subject has a visual experience as of a bent stick. This appearance persists even when the subject knows the stick is straight.
  2.  **The Physical Reality:** The physical stick is straight. The "bentness" is not a physical property of the stick itself.
  3.  **Phenomenal Commonality ("Looks-the-Same"):** We agree that a veridical perception of a *actually* bent stick and the illusory perception of the *straight* stick in water can be **phenomenally indistinguishable** to the subject. That is, "what it is like" for the subject can be identical in both cases.
  4.  **Ontological Commonality ("Is-the-Same"):** We agree that Phenomenal Commonality does not *trivially* entail Ontological Commonality. It is a coherent position to claim two experiences can "look the same" without being the "same kind of mental state" or sharing the same fundamental constituents. **The debate is not about whether they look the same, but whether looking the same forces us to posit a shared mental ingredient.**
  5.  **Theoretical Obligation:** Any adequate theory of perception must explain how error is possible (how we can be wrong about the properties of the object) without implying that we are never directly aware of the external world (skepticism).
  6.  **The Target:** We are addressing the **Argument from Illusion**, not the Argument from Hallucination. We accept that in the illusion case, the subject is visually related to a physical object. The question is the *nature* of that relation.

  ---

  ## II. TERMINOLOGY FLAG (VERBAL DISPUTES)
  *We identify the following terms as sources of potential verbal confusion. We agree to use them as defined below for the purpose of this document.*

  | Term | Ambiguity | Agreed Usage for This Document |
  | :--- | :--- | :--- |
  | **"Experience"** | **Epistemic:** The subject's access to how things seem.<br>**Ontological:** The mental state token itself. | We distinguish **Phenomenal Character** (the "what it's like") from **Mental State Type** (the underlying metaphysical constitution). |
  | **"Direct Awareness"** | **Causal:** No intermediate inference.<br>**Constitutive:** The object itself is part of the experience. | **Disjunctivist:** Uses Constitutive (the object is a constituent).<br>**Representationalist:** Uses Causal/Phenomenal (the content is immediately present). |
  | **"Sense-Data"** | **Entity:** A mental object.<br>**Property Cluster:** A way of being appeared to. | **Representationalist:** Prefers "Representational Content" but accepts the "Sense-Datum instinct" that *something* bears the apparent properties.<br>**Disjunctivist:** Rejects both if they imply an intermediate entity between mind and world. |

  ---

  ## III. SUBSTANTIVE DISAGREEMENTS
  *The following table isolates where we diverge. Each row represents a distinct point of contention.*

  | Point of Disagreement | Disjunctivist Position (Naive Realist) | Representationalist Position (Sense-Data/Rep) |
  | :--- | :--- | :--- |
  | **1. The Bearer of Properties** | In the illusion, the straight stick is the only object. The "bentness" is not a property of a mental object, nor a property represented as existing independently. It is a **relational property** of the stick-as-perceived-in-these-conditions. | In the illusion, *something* is actually bent (or represented as such). Either a sense-datum bears the property, or the visual system generates **content** with accuracy conditions that are not met by the stick. |
  | **2. The Common Factor Principle** | **Rejected.** Phenomenal indistinguishability ("looks-the-same") does not entail a shared fundamental mental kind ("is-the-same"). The good case is relational; the bad case is a mere seeming. They are different disjuncts. | **Accepted.** If two states are phenomenally identical, they must share a **common psychological kind** (e.g., a representational vehicle). The best explanation for "looks-the-same" is "is-the-same" at the level of mental processing. |
  | **3. Explanation of Error** | Error is explained by the **context of the relation**. The stick looks bent because of the water/light/eye relation. We misjudge this relational appearance as an intrinsic property. | Error is explained by **misrepresentation**. The system attributes a property (bentness) to the object that it does not have. The content is false. |

  ---

  ## IV. THE CRUXES & TEST CASES
  *For each disagreement above, we identify the specific sub-question (Crux) that settles the matter. We agree on a Test Case/Argument that bears on the Crux and record our predictions.*

  ### Crux 1: The Phenomenal Principle
  *   **Definition:** "If something sensibly appears to have a property, then something actually has that property."
  *   **Relevance:** This is the engine of the Argument from Illusion.
  *   **Test Case:** **The Persistence of Illusion.**
      *   *Scenario:* A subject knows the stick is straight (measured it), yet it *still looks bent*.
      *   *Question:* Where is the "bentness" located in the ontology of this moment?
  *   **Disjunctivist Prediction:** The "bentness" is not a property *located* anywhere. It is a **mode of presentation** of the straight stick. The stick is presenting itself *bently*. To ask "what is bent?" is a category mistake.
  *   **Representationalist Prediction:** The "bentness" is a property of the **Representational Content** (or Sense-Datum). The mind is tokening a "bent-stick" representation. The content has the property, even if the world does not.
  *   **Settlement Condition:** If it can be shown that "modes of presentation" cannot account for the *specificity* of the error (e.g., exactly *how* bent it looks), the Disjunctivist loses. If it can be shown that positing content adds no explanatory power over relational modes, the Representationalist loses.

  ### Crux 2: The Explanatory Role of Commonality
  *   **Definition:** Does positing a shared mental state *explain* the phenomenal match, or does it merely *label* it?
  *   **Relevance:** Addresses Disagreement #2 (Common Factor).
  *   **Test Case:** **The Ames Room Illusion.**
      *   *Scenario:* Two people of equal height look drastically different sizes due to room geometry. The visual experience is identical to seeing a giant and a dwarf in a normal room.
      *   *Question:* Is the "size experience" in the Ames Room the *same kind of state* as seeing a real giant?
  *   **Disjunctivist Prediction:** **No.** In the real giant case, the experience is constituted by the giant's actual size. In the Ames Room, it is constituted by the distorted room geometry and the normal-sized person. They are fundamentally different states that happen to feel similar.
  *   **Representationalist Prediction:** **Yes.** The visual system outputs a "large person" representation in both cases. The causal history differs, but the *proximal mental cause* (the representation) is of the same type.
  *   **Settlement Condition:** If neuroscience identifies a specific neural correlate for "size experience" that fires identically in both cases, the Representationalist gains ground (Ontological Commonality). If the neural processing is fundamentally distinct (e.g., one relies on depth cues, the other on retinal size alone) despite the same output, the Disjunctivist gains ground.

  ### Crux 3: Transparency vs. Introspection
  *   **Definition:** When I try to introspect my experience, do I find only the world, or do I find the experience itself?
  *   **Relevance:** Addresses Disagreement #1 (Bearer of Properties).
  *   **Test Case:** **Trying to attend to the "Bentness."**
      *   *Scenario:* Subject focuses intently on the bent appearance of the stick.
      *   *Question:* What is the target of your attention?
  *   **Disjunctivist Prediction:** You are attending to the **stick**. You cannot peel the "bentness" off the stick to inspect it separately. The appearance is transparent; you see *through* it to the object.
  *   **Representationalist Prediction:** You are attending to the **content of your experience**. You can distinguish the "stick-as-it-is" from the "stick-as-it-appears." The "appears" part is an introspectable feature of the mental state.
  *   **Settlement Condition:** If subjects can reliably report on properties of the *experience* distinct from properties of the *object* (e.g., "the experience is blurry" vs "the object is fuzzy"), the Representationalist wins. If all reports collapse into reports about the object, the Disjunctivist wins.

  ---

  ## V. CONCLUSION ON THE "LOOKS/IS" DISTINCTION
  *We explicitly affirm the utility of the distinction raised by our colleague.*

  The stalemate in our group arose because the Representationalist argued:
  > "If they look the same, they **must** be the same kind of state."

  And the Disjunctivist argued:
  > "If they are different kinds of state, they **cannot** look the same."

  By adopting the **Looks-Same (Phenomenal) / Is-Same (Ontological)** distinction, we agree that the Disjunctivist is permitted to say:
  > "They look the same (Phenomenal Commonality), but they are not the same kind of state (Ontological Disjunctivism)."

  **The remaining fight is not about whether this is logically possible (it is), but whether it is *explanatorily virtuous*.**
  *   The **Representationalist** claims denying Ontological Commonality leaves the Phenomenal Commonality unexplained (a "brute fact").
  *   The **Disjunctivist** claims asserting Ontological Commonality inserts an unnecessary "veil of ideas" between the mind and the world.

  We agree to suspend hostilities until we can produce a argument that addresses *explanatory virtue* specifically in the **Illusion** case, without relying on the Hallucination case as a crutch.

  **Signed,**

  _________________________ (Disjunctivist)

  _________________________ (Representationalist)
