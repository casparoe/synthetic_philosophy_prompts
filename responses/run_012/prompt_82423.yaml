answer: |-
  It is entirely understandable that you find this conversational move frustrating, particularly when it serves as a conversation-stopper rather than an invitation to refine the argument. The slogan you are encountering is the hallmark of the accuracy-first programme in formal epistemology, associated with figures like Jim Joyce and Richard Pettigrew, and while it is a serious philosophical position, its rhetorical deployment often obscures significant ambiguities. To help you articulate precisely where the disagreement lies, it is useful to disentangle the slogan into a spectrum of claims, ranging from the uncontroversial to the highly contentious, paying close attention to whether the claim concerns the value of a credence itself, the evaluation of the agent holding it, or the foundational structure of epistemic normativity.

  At the weakest end of the spectrum, we find the claim that accuracy is an epistemic good. This is essentially a platitude that few philosophers would deny. To say that believing truth is better than believing falsehood, ceteris paribus, is almost definitional of the epistemic domain. If your colleague means merely that accuracy matters significantly, or that it is a primary aim of belief, then he is stating something quite benign. However, this reading cannot support the dismissive conclusion he draws. Acknowledging that accuracy is a good does not entail that it is the only good, nor does it imply that two agents reaching the same accurate credence via different methods are epistemically equivalent in every respect. This reading is too weak to do the work he wants it to do, so we must assume he intends something stronger.

  The next reading is the substantive core of the accuracy-first programme, often labelled veritism. This is the claim that accuracy is the sole fundamental epistemic good. On this view, other putative epistemic virtues, such as coherence, respecting evidence, or avoiding contradiction, are indeed valuable, but only derivatively. They are good only insofar as they tend to promote accuracy. This is a live controversy within epistemology. It is a defensible position, but it is not a settled truth, and it certainly does not command universal assent. If your colleague is asserting this, he is making a substantial metaphysical claim about the structure of epistemic value. However, even if we grant this claim for the sake of argument, it does not immediately yield the conclusion that the careful conditionaliser and the stopped-clock consulter are on a par. Veritism allows that respecting evidence is instrumentally valuable. Therefore, an agent who respects evidence is employing a more reliable method than one who does not, even if they happen to land on the same credence. The veritist can still say the careful agent is more rational because they are following a policy that is instrumentally superior, even if the fundamental value of the resulting state is identical.

  This brings us to a crucial distinction regarding the object of evaluation, which is likely where the equivocation occurs. We must distinguish between evaluating the credence as a state and evaluating the agent or the process that produced it. There is a reading of the slogan that applies strictly to the credence itself: a credence is epistemically good to the extent that it is accurate. Under this specific reading, if two agents hold the same credence and the world is the same, the credences themselves are equally good qua representations of the world. This is plausible within the formal framework, where credences are often treated as abstract objects susceptible to scoring rules. However, your objection was not merely about the static quality of the credence, but about the epistemic status of the agents holding them. When you ask whether they are on a par, you are asking about rationality or justification, which are typically properties of agents or processes, not just states.

  Here we encounter the reading that is most likely false, or at least radically counter-intuitive. This is the claim that the only thing that makes an agent or a belief-forming process better or worse is the actual accuracy of the output. This collapses the distinction between rationality and success. It implies that luck plays no role in epistemic evaluation, or conversely, that luck is all that matters. If this were true, then epistemic normativity would be purely consequentialist in a way that ignores ex ante perspectives. Most epistemologists, including many accuracy-first proponents, wish to avoid this. They typically argue that rationality consists in maximising expected accuracy, not actual accuracy. If your colleague is claiming that the stopped-clock user is just as rational as the conditionaliser because they both achieved accuracy, he is conflating actual accuracy with expected accuracy. The conditionaliser maximised expected accuracy given their evidence; the stopped-clock user did not. Therefore, even within an accuracy-first framework, the agents are not on a par regarding rationality, even if their resulting credences are equally accurate.

  There is a further nuance concerning the justification of norms. The slogan is sometimes used to mean that the only way to justify an epistemic norm is to show that it serves accuracy. This is a methodological claim about epistemic justification rather than a direct claim about value. It is a live controversy, often tied to the only-game-in-town argument. However, using this methodological claim to dismiss a substantive objection about process is a category error. Showing that a norm must be justified by accuracy does not mean that the norm itself cannot require attention to process. Indeed, the norm of conditionalisation is often justified within the accuracy-first programme precisely because it maximises expected accuracy. So, appealing to accuracy-first to dismiss the importance of conditionalisation is arguably self-defeating, since conditionalisation is usually derived as a theorem within that very framework.

  So, where does this leave you in the corridor? Your colleague is likely relying on a slide between the claim that accuracy is the sole fundamental good and the claim that process is irrelevant. He borrows the authority of the fundamental value claim to shield the radical process claim from scrutiny. The verdict on the fundamental value claim is that it is a live controversy; it is not false, but it is not a platitude either. The verdict on the claim that process is irrelevant to epistemic evaluation is that it is false, or at least incompatible with the standard accuracy-first defence of conditionalisation. The verdict on the claim that the two credences are equally good as states is arguably true within the framework, but irrelevant to the question of whether the agents are equally rational.

  To respond without spluttering, you might suggest that while accuracy may be the sole fundamental good, epistemic rationality is not merely the assessment of final states but the assessment of how one manages one's cognitive resources towards that end. You can grant him veritism without granting him that the stopped-clock user is rational. You might ask him specifically whether he distinguishes between the accuracy of a credence and the rationality of the agent, and if so, whether rationality is defined by actual accuracy or expected accuracy. If he says actual accuracy, he is defending a form of epistemic consequentialism that many find untenable. If he says expected accuracy, then the conditionaliser wins, and his dismissive gesture was unwarranted. By forcing him to specify whether the slogan applies to states, agents, or norms, you prevent the slogan from functioning as a shield and turn it back into the substantive philosophical thesis it ought to be.
