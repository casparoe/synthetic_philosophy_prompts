answer: |-
  **Credence in the Claim:** **0.35**

  **Decomposition:**

  *   **(a) Psychological Mechanism:** **0.65**
      *   *Probability that the doctrine produced the disposition rather than rationalizing it.*
      *   Selection effects are massive (disciplined people self-select into strict sects), but pastoral enforcement and secondary socialization likely reinforced the anxiety/discipline loop in marginal adherents. It's not zero, but it's not the dominant driver.
  *   **(b) Confounder Control:** **0.45**
      *   *Probability that the pattern isn't better explained by literacy, networks, migration, etc.*
      *   This is the biggest leak. Modern econometric studies (e.g., Becker & Woessmann) suggest once you control for human capital (literacy) and institutional quality, the "Protestant" coefficient shrinks drastically. The "modest size" clause saves this from being zero, but the residual variance is small.
  *   **(c) The Swap Test (Content vs. Structure):** **0.40**
      *   *Probability that a structurally similar but doctrinally different system would NOT produce the effect.*
      *   I assign this low because historical analogues (Jansenists, certain Jewish diaspora communities, even strict Confucian merchant clans) exhibit similar accumulation/discipline ethos under pressure. This suggests *soteriological anxiety + group boundary maintenance* is the causal engine, not the specific Protestant metaphysics of "calling." If structure drives it, your specific claim about *doctrinal content* is false.
  *   **(d) Ontology of Culture:** **0.90**
      *   *Probability that macro-entities like "ethos" can stand in causal relations.*
      *   High. While ontologically reducible to individuals, emergent norms create transaction costs and focal points that function causally in social models. Denying this breaks most social science.
  *   **(e) Directionality (Reverse Causation):** **0.60**
      *   *Probability that net causation flows Theology → Economy (rather than Economy → Theology).*
      *   It is a feedback loop. Emerging merchant classes likely shaped theology to suit their needs just as theology shaped them. However, there is a temporal lag in some regions where preaching preceded capital accumulation, granting a slight edge to forward causation.

  **Combination:**
  The final **0.35** is not a simple product (which would be ~0.07) but a weighted synthesis. (d) is granted as a background condition. (a) and (e) allow for *some* causal flow. However, (b) and (c) act as severe discount factors. Even if the psychology is real (a), if it's mostly driven by literacy (b) or if any anxiety-inducing dogma would do the same job (c), the specific claim that *Protestant doctrinal content* is the load-bearing cause collapses. The "modest size" hedge prevents the credence from going lower, acknowledging a small residual effect that survives controls.

  **Sensitivity Analysis:**

  *   **Least Confident Term:** **(c) The Swap Test.** Counterfactual history is inherently noisy. We cannot run the experiment on 17th-century Europe again with Catholic Jansenism as the state religion to see if capitalism blooms identically.
  *   **Most Sensitive Term:** **(b) Confounder Control.** Your number moves most here. If new data shows that controlling for literacy and legal institutions leaves *no* residual Protestant effect, my credence drops to <0.10. If data shows a robust residual after strict matching, my credence rises to >0.60. This is the empirical battleground.
  *   **Key Evidence:** A **border discontinuity study** where two regions share identical institutions, geography, and literacy rates, but differ in confessional adherence due to an exogenous shock (e.g., a ruler's conversion), showing a divergence in economic ethos *without* a divergence in human capital or network access. (Existing studies like the Prussian Catholic/Protestant splits lean toward literacy explaining the gap, which hurts the claim).

  **Well-Posedness Credence:** **0.70**

  *   *Probability that the question has a truth value.*
  *   I suspect this is where your disagreement lives. "Culture" and "Economic Ethos" are latent variables with measurement error. "Causal contribution" in a complex system is not a binary switch but a coefficient in a regression with omitted variable bias.
  *   However, you have narrowed the claim sufficiently (holding background fixed, specifying the mechanism) to make it *falsifiable in principle*. It is not metaphysics; it is an empirical identification problem. It is well-posed enough to have a truth value, but the "truth" will always be a probability distribution over model specifications, not a binary fact.
