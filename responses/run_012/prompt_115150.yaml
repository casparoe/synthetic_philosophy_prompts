          *   *Nozick's Nuance:* Nozick doesn't say deduction *never* yields knowledge. He says the *status* of the belief as knowledge depends on whether it tracks the truth, not just on the deduction. If the conclusion tracks, deduction works. If the conclusion doesn't track (like skeptical hypotheses), deduction fails to transmit knowledge.

