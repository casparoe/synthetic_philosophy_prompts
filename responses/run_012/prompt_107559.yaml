prompt: |-
  I'm doing a module on decision theory and the ethics of risk at the moment, and me and my mate Dan keep having the same arguement. He's fully committed to the idea that you should just maximise expected value, full stop — so if there's a 1-in-10^14 chance that 10^60 people get to live wonderful lives forever, and otherwise everyone gets nothing, he reckons you obviously take the gamble, and anyone who says otherwise is just being squeamish about big numbers. I think he's wrong but I can never quite pin down why, and whenever I try he just says my intuition is doing the work and intuitions are cheap.

  Can you write a proper dialogue between two people in that disagreement — both of them sharp, neither one a strawman — where they actually engage instead of talking past each other? I want it properly in the weeds rather than just "that's absurd" / "no it isn't". Some things I'd love them to get into: does this only arise with infinite values, or does it already bite with finite-but-huge ones and very small probabilities? Is the real disagreement about whether we can trust probability estimates like 1-in-10^14 at all, or about whether expected value is even the right thing to be maximising, or about whether a rational agent's preferences over stakes that big can be captured by any ordinary utility function? What about the mugging-style case where someone claims you owe them money or they'll unleash something astronomically bad with a tiny probability — is that the same problem or a different one? And does the fanatic have to accept every absurd implication, or can they draw a line somewhere without being inconsistent? I'd like them to concede where the other side has a real point, press where they don't, and end somewhere where it's genuinely not obvious who's winning.
reasoning: |-
