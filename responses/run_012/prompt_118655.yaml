answer: |-
  Based on your verdicts, I have distilled a governing principle that captures the logic of your experimental design background applied to political philosophy. It prioritizes **epistemic competence** (who knows?) and **claim equality** (who deserves?) over tradition or status.

  ### The Principle of Democratic Competence

  **Sortition is a legitimate decision procedure if and only if:**

  1.  **The Clause of Indistinguishability:** When distributing scarce benefits or unavoidable burdens among candidates with equal substantive claims, a lottery is the only fair arbiter.
  2.  **The Clause of Lay Judgment:** When making normative judgments that bind the community, a random sample is legitimate *provided* the task falls within the epistemic competence of the average citizen and represents the community as a whole, not a specific interest.
  3.  **The Clause of Technical Sovereignty:** Sortition is inappropriate when the decision requires specialized technical expertise inaccessible to laypeople, or when the body holds sovereign power requiring long-term coalition-building and accountability.

  *(Note: As you will see in the final section, Clause 3 contains the tension that forces a sacrifice.)*

  ---

  ### Mapping Your Verdicts to the Principle

  Here is which of your judgments forces each clause into existence:

  *   **Forces Clause 1 (Indistinguishability):**
      *   **Funding Agency:** You accept the lottery because the proposals are "equally excellent." Ranking them would be fiction; the claims are indistinguishable.
      *   **Resettlement Places:** You accept it because applicants are "equally deserving."
      *   **ICU Bed (Equal Prognosis):** You accept it because the medical claim is identical.
      *   **Draft Lottery:** You accept the *draw* as fair because the burden (risk of life) is distributed among equals, even if the war is unjust.
      *   **ICU Bed (Unequal Prognosis):** You reject the lottery here. This negative verdict is crucial; it establishes that when claims are *distinguishable* by merit/outcome, the lottery becomes an "evasion."

  *   **Forces Clause 2 (Lay Judgment):**
      *   **Criminal Jury:** You insist the draw is "part of what makes the conviction legitimate." This forces the principle that legitimacy comes from the *sample*, not just the expertise.
      *   **Citizens' Panel:** You find it "attractive." This confirms that laypeople can deliberate on complex systemic issues (electoral reform).
      *   **Balancing the Panel:** You approve of demographic balancing. This forces the requirement that the sample must represent the *community* (the Demos).
      *   **Balancing the Jury:** You object to matching the defendant. This refines Clause 2: the jury represents the *State's conscience*, not the defendant's peers. A biased sample violates the "community as a whole" requirement.

  *   **Forces Clause 3 (Technical Sovereignty):**
      *   **Central Bank:** You call it "absurd." This forces the **Technical Expertise** constraint. Interest rates require specialized knowledge laypeople do not possess.
      *   **Misconduct Panel:** You say "no." This reinforces the **Technical Expertise** constraint (judging research methods requires domain knowledge).
      *   **Legislature:** You say "no." This forces the **Sovereign Accountability** constraint. You distinguish between a panel that *advises* and a body that *rules*.

  ---

  ### Predictions for New Cases

  Here is how the Principle of Democratic Competence applies to cases you have not mentioned:

  **1. A lottery used to select members of a body that may only advise and never decide.**
  *   **Verdict:** **Legitimate.**
  *   **Reasoning:** This falls under Clause 2 (Lay Judgment) without triggering the Sovereignty constraint of Clause 3. Since the body cannot bind the community, the need for electoral accountability is minimized, and the benefit of descriptive representation (a sample of the people) is maximized. This aligns with your approval of the Citizens' Panel.

  **2. A lottery over policies rather than over people.**
  *   **Verdict:** **Illegitimate (mostly).**
  *   **Reasoning:** This violates Clause 1 and Clause 2. Policies are rarely "indistinguishable" (one usually has better consequences than another), so a lottery evades the duty to choose the better outcome. Furthermore, policies require coherence; a random selection of laws would likely create contradictions. Sortition selects *agents* to deliberate, not *outcomes* directly.

  **3. A lottery used to distribute a burden that I already think should not be imposed at all.**
  *   **Verdict:** **Procedurally Fair, Substantively Void.**
  *   **Reasoning:** This matches your Draft Lottery verdict. Clause 1 ensures the *distribution* is fair among those conscripted (equals share the burden). However, the Principle distinguishes procedural fairness from substantive justice. If the burden itself is unjust (an unjust war), the lottery legitimizes the *sharing* of the risk, but not the *imposition* of the risk.

  ---

  ### The Honest Sacrifice

  You asked me to tell you which of your verdicts the best principle cannot keep.

  To make the principle coherent, you must give up your verdict on the **Legislature Chosen Entirely by Lot.** You said "No," but your other verdicts logically demand a "Yes."

  **Why you should give it up:**

  You approve of a **Citizens' Panel** (150 people, drawn by lot) recommending changes to the electoral system. You reject a **Legislature** (drawn by lot) making laws. The only difference between these two bodies is *power*, not *competence*.

  1.  **The Competence Contradiction:** If 150 random citizens possess the "lay competence" (Clause 2) to understand and recommend reforms to the electoral system—a task of high complexity involving constitutional law, game theory, and sociology—they possess the same competence to legislate on health, education, or infrastructure. To say they can *advise* on the rules of the game but not *play* the game is an inconsistency.
  2.  **The Accountability Fix:** Your rejection likely stems from Clause 3 (Accountability). You fear a lottocratic legislature cannot be held accountable. However, modern sortition proposals (like those for the Citizens' Panel) include safeguards: public deliberation, expert testimony, and supermajority requirements. If you trust the Panel's advice enough to put it to a referendum, you trust their judgment. If you trust their judgment, the only barrier to them legislating directly is a status-quo bias regarding elections.
  3.  **The Jury Precedent:** You accept a Jury wielding the sovereign power of the State to imprison or execute. You accept this because they represent the community's conscience. A Legislature by lot is simply a "Grand Jury" for the laws themselves.

  **The Alternative Sacrifice:**
  You could instead keep the Legislature "No" and sacrifice the **Misconduct Panel "No."**
  If a jury of laypeople can judge complex financial fraud or medical malpractice in a court of law (determining if a professional breached their duty), they can judge research misconduct. Distinguishing "legal guilt" from "professional integrity" is a distinction without a difference in terms of cognitive load.

  **Recommendation:**
  Give up the **Legislature** verdict. It is the tension you already noticed ("sits badly"). Resolving it aligns your philosophy: if the random sample is the source of legitimacy for the Jury and the Panel, it must also be the source of legitimacy for the Law. The "hard judgment" you learned in the lab applies here: do not let the method of selection (election vs. lot) confuse the variable you are actually testing (competence vs. representation). Your data supports the lot.
