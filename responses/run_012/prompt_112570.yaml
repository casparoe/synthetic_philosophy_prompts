answer: |-
  **MEMORANDUM**

  **TO:** Academic Policy Committee
  **FROM:** Chair
  **DATE:** Thursday, [Date]
  **SUBJECT:** Procedure for Friday's Vote on QR Requirement

  Colleagues,

  Ahead of Friday's vote on extending the Quantitative Reasoning (QR) requirement to transfer students, I am writing to clarify the voting procedure. Our straw polls have revealed a classic "discursive dilemma": a majority finds the requirement pedagogically sound, a majority finds it staffable, yet a majority voted against extending it to transfers. Since every member has confirmed their votes are logically consistent (i.e., you support extension *only if* both conditions are met), a direct vote on the final policy risks adopting a position that contradicts our own factual findings.

  **Recommendation**
  To ensure our decision is logically coherent and defensible to the Dean, I recommend we adopt a **premise-based procedure**. We will treat the two conditions as binding findings of fact that determine the outcome of the policy motion.

  **Proposed Motion and Order**
  I will introduce the following resolution: *"To extend the QR requirement to transfer students, contingent upon the Committee's affirmative finding that (1) the requirement is pedagogically sound, and (2) staffing is feasible."*

  We will vote in this order:
  1.  **Finding 1:** Is the requirement pedagogically sound?
  2.  **Finding 2:** Is staffing feasible?
  3.  **Main Motion:** Shall the requirement be extended to transfer students?

  If Findings 1 and 2 pass, I will urge a "Yes" vote on the Main Motion to maintain logical consistency. If either Finding fails, the Main Motion fails.

  **Addressing Procedural Concerns**
  *Legitimacy of Premises:* Some may argue that only the bottom-line vote matters. However, in academic governance, the *reasons* for a decision carry as much weight as the outcome. A policy passed against the Committee's own factual findings is vulnerable to appeal and difficult to implement. Establishing the premises first ensures the policy rests on a stable foundation.

  *"Dividing the Question":* I anticipate a motion to divide the question. I welcome this. In fact, by structuring the resolution as above, we are voluntarily dividing the question into its logical components. This pre-empts strategic agenda-setting and ensures the order of voting reflects logical priority rather than tactical advantage. To the member concerned with game-theoretic implications: this procedure neutralizes path-dependence by locking the conclusion to the premises.

  **Strongest Case Against This Approach**
  For the record, the strongest argument against this procedure is that it potentially overrides the expressed will of the majority on the final outcome. If a majority votes "No" on the final policy even after the premises pass, the premise-based procedure effectively disenfranchises that majority in favor of logical consistency. Critics may argue the Committee should be free to change its mind on the conclusion regardless of the premises.

  **Next Steps**
  Unless I hear significant objection by Thursday evening, I will proceed with this order on Friday. This approach provides the Dean with a clear rationale: we are not merely counting hands, we are validating the conditions necessary for the policy to succeed.

  Thank you for your diligence.

  Chair, Academic Policy Committee
