prompt: |-
  I chair the academic policy committee at a small liberal arts college, and we vote Friday on whether the new quantitative-reasoning requirement should apply to transfer students as well as first-years. Bylaws are simple: majority passes, any member can move to divide the question. Heres my problem. Basically everyone on the committee agrees the requirement should cover transfers if it's pedagogically sound and if we can staff the extra sections; two members have said flatly they'll vote no if either condition fails. But our straw votes came out strange: a majority said it's pedagogically sound, a majority said we can staff it, and a majority said we should NOT extend it to transfers. As far as I can tell every individual is being perfectly consistent. Draft the short memo I'll circulate Thursday: what motion should I put, in what order, should we be voting on the premises or on the bottom line, and what do I say to the members who insist it's illegitimate to settle the bottom line by counting votes on the premises? One of them is a game theorist who's already hinted she'll move to divide the question if the order doesn't suit her, so say something about that too. I need a recommendation I can defend to the dean, plus a fair statement of the strongest case against it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Academic Policy Committee at a small liberal arts college.
      *   **Task:** Draft a short memo to circulate Thursday (before Friday's vote).
      *   **Issue:** Whether a new quantitative-reasoning (QR) requirement applies to transfer students.
      *   **Bylaws:** Majority passes; any member can move to divide the question.
      *   **The Paradox:**
          *   Premise 1 (Pedagogically Sound): Majority YES.
          *   Premise 2 (Staffing Feasible): Majority YES.
          *   Conclusion (Extend to Transfers): Majority NO.
          *   *Constraint:* Every individual is logically consistent (i.e., they vote YES on Conclusion *only if* they vote YES on both Premises). This is a classic "Discursive Dilemma" or "Doctrinal Paradox."
      *   **Specific Complications:** Two members will vote NO if *either* premise fails. One member is a game theorist who threatens to move to divide the question if the order/procedure doesn't suit her.
      *   **Requirements for the Memo:**
          *   Recommendation on what motion to put and in what order.
          *   Address voting on premises vs. bottom line.
          *   Address the objection that settling the bottom line by counting premise votes is illegitimate.
          *   Address the game theorist's threat regarding "dividing the question."
          *   Provide a recommendation defensible to the Dean.
          *   Provide a fair statement of the strongest case against the recommendation.

  2.  **Identify the Core Logical Problem:**
      *   This is the *Doctrinal Paradox* (Kornhauser & Sager).
      *   *Scenario:*
          *   Member A: Yes, Yes $\rightarrow$ Yes
          *   Member B: Yes, No $\rightarrow$ No
          *   Member C: No, Yes $\rightarrow$ No
          *   *Majority on Premises:* Yes, Yes.
          *   *Majority on Conclusion:* No.
      *   *Implication:* If we vote on the conclusion directly, the policy fails. If we vote on the premises and bind the conclusion to them, the policy passes.
      *   *The "Divide the Question" Motion:* In parliamentary procedure (Robert's Rules), "Divide the Question" usually means separating distinct parts of a motion to vote on them separately. Here, it likely means voting on the premises separately from the conclusion, or voting on the conditions separately. The game theorist knows that the *order* of voting determines the outcome (path dependence).

  3.  **Determine the Best Procedural Approach:**
      *   *Option 1: Vote on Conclusion Only.* Result: Policy fails. Ignores the fact that a majority supports both premises. Risks inconsistency.
      *   *Option 2: Vote on Premises, then Conclusion.* Result: Policy passes (assuming premises bind the conclusion). This respects the logical structure of the members' reasoning.
      *   *Option 3: Compound Motion.* "I move to adopt the requirement for transfers *provided that* it is pedagogically sound and staffable."
      *   *Addressing the Game Theorist:* She wants to control the agenda. If we vote on premises first, she might try to amend the motion to make the premises non-binding. If we vote on the conclusion first, we get the "paradoxical" result.
      *   *Best Practice:* In academic governance, consistency and rationale matter more than raw vote counting on the final binary. The "Premise-Based Procedure" is generally considered more deliberative and defensible than the "Conclusion-Based Procedure" in this specific context (where reasons matter).
      *   *Recommendation:* Vote on the premises as *amendments* or *conditions* to the main motion, establishing the factual basis, then vote on the main motion. Or, structure the motion as a conditional resolution.
      *   *Actually, the cleanest parliamentary way:* Make the motion conditional. "I move to extend the requirement... contingent upon the Committee's finding that (1) it is pedagogically sound and (2) staffing is feasible." Then vote on the findings, then the motion.
      *   *Wait, simpler:* Vote on the premises as *substitute motions* or *amendments* that establish the committee's finding.
      *   *Refined Recommendation:* Propose a single motion that includes the conditions. "To extend the QR requirement to transfer students, subject to the determinations that the requirement is pedagogically sound and staffing is feasible." Then vote on the determinations (as amendments/sections), then the whole.
      *   *Even Better (Standard Parliamentary):* Main Motion: "Extend QR to transfers." Amendments: "Add clause: only if pedagogically sound." "Add clause: only if staffable."
      *   *Wait, the prompt says:* "Any member can move to divide the question." This implies the motion might be seen as having multiple parts.
      *   *Strategic Advice:* To avoid the paradox and satisfy the game theorist (who cares about procedure), we should use a **Premise-Based Procedure**. We vote on the conditions first. If both pass, the policy passes. This aligns with the "spirit" of the committee (everyone agrees *if* conditions met, then yes).
      *   *Why?* Because the "No" on the bottom line is likely an artifact of aggregation, not a true reflection of will (since everyone agrees on the *if/then*).
      *   *Addressing the "Illegitimate" Objection:* It's not illegitimate; it's standard in judicial and academic settings to establish findings of fact before ruling.
      *   *Addressing the Game Theorist:* Acknowledge her point. Agenda setting matters. But argue that *consistency* is a higher value than strategic manipulation.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
