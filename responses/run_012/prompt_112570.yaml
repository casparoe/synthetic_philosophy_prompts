      *   *Order:* Vote on Amendments first (these are the premises). If they pass, vote on Main Motion.
      *   *Wait, if the Main Motion is just "Extend," and Amendments add conditions...*
      *   *Actually, the cleanest way to handle the Paradox:* The Chair should rule that the motion is a *compound question* and *should* be divided.
      *   *Decision:* I will recommend we *voluntarily* divide the question into three parts: Finding 1, Finding 2, and Resolution. This pre-empts the game theorist's move and controls the agenda.

  6.  **Finalizing the Advice:**
      *   **Procedure:** Divide the question into three parts: (1) Pedagogical Soundness, (2) Staffing Feasibility, (3) Extension of Requirement.
      *   **Logic:** If (1) and (2) pass, the Chair recommends voting YES on (3) to maintain logical consistency with the committee's stated criteria.
      *   **Defense:** This prevents the "Discursive Dilemma" where the committee contradicts itself.
      *   **Game Theorist:** By voluntarily dividing, we remove her leverage to disrupt. We acknowledge her point but take control of the order.
