      *   **The Situation:** Acknowledge the straw vote anomaly (The Discursive Dilemma).
      *   **Recommendation:** Vote on the premises (conditions) first, then the conclusion. Structure the motion as conditional.
      *   **Rationale:** Consistency, defensibility to Dean, aligns with stated member preferences (the "if/then" consensus).
      *   **Addressing the Objection (Legitimacy):** Distinguish between "vote counting" and "reasoned decision making." Academic bodies should decide based on reasons.
      *   **Addressing the Game Theorist:** Acknowledge the power of "Divide the Question." Invite her to propose the order but state the Chair's preference for logical priority.
      *   **Strongest Case Against:** Minority protection, agenda manipulation risk, simplicity of direct vote.

  5.  **Refining the Logic (Self-Correction):**
      *   *Correction:* If I recommend voting on premises first, the game theorist might move to "Divide the Question" to force a vote on the conclusion *before* the premises are established as binding.
      *   *Counter:* I need to structure the motion so the premises are *conditions precedent*.
