  What ties the tie before the work is done?
  I stand between the terms in abstract light.
  The thought insists it is already one.

  To bind to terms, a bond must be begun.
  But I am loose, no grip makes contact tight.
  What ties the tie before the work is done?

  Another link arrives, the game begun.
  It seeks to join the joiner in its plight.
  The thought insists it is already one.

  And now a third, until the thread is spun.
  An endless chain beneath the logical night.
  What ties the tie before the work is done?

  We wait for rest that never will be won.
  Is unity whole, or parts distinct and bright?
  The thought insists it is already one.

  No primitive ground to stop the endless run.
  We hang suspended beyond human sight.
  What ties the tie before the work is done?
  The thought insists it is already one.
