answer: |-
  This is a precise and troubling reconstruction. You have isolated the engine of the *White Horse* dialogue and exposed its tendency to overheat when generalized. You are right to feel the tension: the argument is valid if we accept the premises, but the conclusion contradicts the very conditions of discourse that make the argument possible (e.g., counting white horses among horses).

  You asked me to work slowly, to sketch candidate diagnoses, price them, and only then commit. I will do so. I see three distinct ways to locate the fracture in this reasoning. Each locates the error in a different relationship between language and the world.

  ### Candidate Diagnoses

  **Diagnosis 1: The Equivocation of *Fei* (Identity vs. Membership)**
  *   **The Claim:** The character *fei* (非) shifts meaning between the premises and the conclusion. In Strand 1 (Designation), *fei* means "is not identical to" (intensional distinctness). In the objection you raise (entailment), *fei* is read as "is not a member of the class of" (extensional exclusion).
  *   **The Mechanism:** 'White Horse' is not *identical* to 'Horse' (true: the concepts differ). Therefore, a white horse is not *a member of the class* Horse (false: the subset relation holds).
  *   **What it saves:** It dissolves the contradiction instantly. It explains why the Objector in the original text feels entitled to say "You cannot deny white horses are horses."
  *   **The Cost:** It reduces Gongsun Long to a sophist relying on a linguistic pun. It renders the "Seeking" passage (5–8) merely illustrative of the pun rather than a substantive argument about intentionality. It violates your wish to avoid the "it's just a pun" verdict. It makes the dialogue philosophically thin.

  **Diagnosis 2: The Metaphysical Kind (Disjoint Universals)**
  *   **The Claim:** We must take (10) seriously as a metaphysical principle. For the Disputer, compound names designate compound *shi* (actualities/essences). A "White Horse" is a specific universal, and "Horse" is a generic universal. In this ontology, specific kinds are disjoint from generic kinds. To be a *specific* kind is to *not be* the *generic* kind, because the generic is an abstraction that lacks the determination required for existence.
  *   **The Mechanism:** "Horse" designates the abstract form of horse. "White Horse" designates a concrete compound. Since the abstract is not the concrete, the White Horse is not the Horse.
  *   **What it saves:** It preserves the validity of (10) and the integrity of the Disputer's position. It explains why "White Horse is not White" might be acceptable to them (the compound is not the attribute).
  *   **The Cost:** It forces us to accept that "A horse is not an animal." It severs the link between language and biological classification. It makes the "Seeking" passage (5–8) metaphysically heavy: we aren't just looking for different things, we are looking in disjoint ontological categories. It demands we abandon standard mereology and set theory entirely.

  **Diagnosis 3: The Opacity Slide (Sense vs. Reference)**
  *   **The Claim:** The argument is valid in intensional contexts but invalidly exported to extensional contexts. Strand 2 (Seeking) correctly identifies that 'horse' and 'white horse' have different *senses* (modes of presentation). However, the conclusion (9) and Generalization (10) treat this difference in sense as a difference in reference (extension).
  *   **The Mechanism:** "Seeking" creates an opaque context. Substitutivity of co-extensive terms fails here. The argument proves $Sense('White Horse') \neq Sense('Horse')$. It illicitly infers $Extension('White Horse') \cap Extension('Horse') = \emptyset$.
  *   **What it saves:** It preserves the robustness of (5)–(8). The "Seeking" passage *is* tracking something real: the cognitive significance of descriptions. It treats the dialogue as a serious contribution to the philosophy of language (sense/reference) rather than a pun or a bizarre metaphysics.
  *   **The Cost:** It requires us to say Gongsun Long committed a category mistake (exporting from opaque to transparent contexts). It means (10) is false as a universal principle because it ignores the distinction between intersective modifiers ("red") and privative modifiers ("fake").

  ---

  ### Pricing the Alternatives

  If I choose **Diagnosis 1 (Equivocation)**, I save logic but lose the philosopher. The text becomes a trick. You explicitly said you would rather not be told it is a pun. This diagnosis also fails to explain why the "Seeking" argument feels so compelling to you. It dismisses (5)–(8) as merely rhetorical support for the pun, whereas you sense they track a genuine phenomenon about intentionality.

  If I choose **Diagnosis 2 (Metaphysical Kind)**, I save the Disputer's consistency but lose the world. We cannot accept that a horse is not an animal without dismantling the taxonomy that allows us to discuss horses at all. While a committed School of Names adherent might cheerfully accept "A horse is not an animal" (arguing that 'animal' is too vague to designate any actual *shi*), you have indicated this is an "unwelcome consequence" you cannot swallow. To adopt this is to say the dialogue is interesting only as a historical curiosity of a failed ontology.

  If I choose **Diagnosis 3 (Opacity Slide)**, I save the insight but indict the inference. This diagnosis respects the "Seeking" passage as a genuine discovery about how names function in intentional contexts (like seeking, believing, wanting). It locates the error not in the observation (5–8) but in the generalization (10) and the final inference (9). It explains your "Decoy Duck" intuition: "Decoy" is a privative modifier (changes extension), while "White" is an intersective modifier (narrows extension). The Disputer treats all modifiers as if they were constitutive of a new essence that excludes the genus *qua name*.

  ### The Diagnosis

  I commit to **Diagnosis 3**. The reasoning gives way at the move from **(8) to (9)**, and consequently in the universalization at **(10)**.

  Here is exactly why step (10) looked innocent when you wrote it, and why it must be discarded:

  **1. The Innocence of (10):**
  (10) feels true because it conflates *designation* (as a cognitive route) with *designation* (as a set of objects). In Strand 1, you establish that the *criteria* for applying 'white horse' differ from 'horse'. This is undeniable. The *sense* of the compound name is not the *sense* of the simple name. When you write "does not designate what the less specific name designates," you are relying on the ambiguity of "what."
  *   If "what" means *the concept*, (10) is true.
  *   If "what" means *the objects picked out*, (10) is false.
  The argument smuggles the truth of the first reading into the conclusion of the second. This is why the "Decoy Duck" case works for you: in that case, the concept difference *does* entail an object difference (extension is null). In the "Red Apple" case, the concept difference does *not* entail an object difference (extension is subset). (10) treats intersective modifiers as if they were privative.

  **2. The Status of the Seeking Passage (5–8):**
  You asked to keep (5)–(8) if possible. On Diagnosis 3, we *must* keep them. They are the strongest part of your reconstruction. They demonstrate that 'horse' and 'white horse' are not cognitively synonymous.
  *   **Context:** "Seeking" is an intensional operator.
  *   **Logic:** $Seeking(x)$ does not entail $Seeking(y)$ even if $x = y$ (in extension).
  *   **Verdict:** The Disputer is right that the *search* for a white horse is not the *search* for a horse. The error is concluding that because the *searches* are distinct, the *objects found* must be disjoint.
  *   **Cost:** We must admit that Gongsun Long (or your reconstruction of him) fails to distinguish between the *identity of the object* and the *identity of the description*. But this is a sophisticated failure. It is the failure of a philosopher discovering opacity before having the apparatus to contain it.

  **3. The "Pun" Question:**
  Is this just a pun on *fei*? No. On Diagnosis 3, it is a substantive error about the relationship between intension and extension. A pun implies the author knows the trick and is playing. A category mistake implies the author believes the inference holds. The latter is more charitable and philosophically richer. It suggests the School of Names was grappling with the problem of universals and predication, specifically the tension between the *name* (ming) and the *actual* (shi). They prioritized the precision of the *name* to the point where the compound name creates a new semantic unit that, *as a name*, cannot be substituted for the generic name.

  **4. The Unwelcome Consequences of (10):**
  Should "A horse is not an animal" be read as a *reductio* or something a Disputer would accept?
  *   **As a *reductio*:** For us, yes. It proves (10) is false as a universal principle of designation.
  *   **As a Disputer's Claim:** A hardline Mingjia thinker *would* accept it. They would argue: " 'Animal' designates a vague abstraction. 'Horse' designates a specific form. The specific form is not the vague abstraction."
  *   **My Verdict:** You should read it as a *reductio* of the universalization (10), but acknowledge that the specific claim ("White Horse is not Horse") retains value if read intensionally. The dialogue's interest survives not as a claim about zoology, but as a claim about **naming**. The thesis should be read as: "The name 'White Horse' is not the name 'Horse'." The slide to "A white horse is not a horse" (ontological exclusion) is the error.

  ### Summary of the Repair

  To fix your argument while preserving its philosophical weight:

  1.  **Retain (1)–(4):** These establish intensional distinctness. The concept 'White Horse' $\neq$ The concept 'Horse'.
  2.  **Retain (5)–(8):** These provide empirical evidence of the intensional distinctness via opaque contexts (seeking).
  3.  **Reject (9) as stated:** Replace "A white horse is not a horse" with "The name 'white horse' is not substitutable for the name 'horse' in all contexts."
  4.  **Discard (10):** Replace it with a distinction between **Intersective Modification** (red apple, white horse) where $F(Gx) \to Gx$, and **Privative/Constitutive Modification** (fake gun, decoy duck) where $F(Gx) \to \neg Gx$. The Disputer treats all modification as Constitutive of the *Name*, even when it is merely Intersective of the *Object*.

  **What is left of the dialogue's interest?**
  Once you remove the culprit step (the export from intension to extension), the dialogue remains a pioneering investigation into **semantic opacity** and the **non-transparency of compound names**. It anticipates Frege's distinction between *Sinn* (sense) and *Bedeutung* (reference). Gongsun Long's insight is that adding a modifier changes the *Sinn* so radically that, in certain contexts (like "seeking" or "naming"), the connection to the original *Bedeutung* is severed *for the purposes of the discourse*.

  He is not saying you cannot ride a white horse when you ask for a horse. He is saying that if you are analyzing the *names*, the compound name functions as a distinct unit that cannot be reduced to its head noun without loss of semantic content. The "absurdity" arises only when we demand that semantic distinctness entail ontological exclusion. If you accept that the dialogue is about the logic of *names* (Ming) rather than the logic of *things* (Shi), the contradiction vanishes, and (5)–(8) stand as a robust demonstration of why names matter.
