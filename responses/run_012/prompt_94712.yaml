prompt: |-
  ok, so I'm a backend engineer on a recommender team and we're using inverse reinforcement learning to back out what users actually want from their click logs, and a coworker who minored in philosophy keeps telling me we've quietly assumed our way into a whole picture of what a preference is. I dont want to argue about which algorithm to reach for next; I want the spec. What does a theory of "inferring what someone wants from what they do" have to deliver to count as any good — good enough that we'd bet the roadmap on the reward function it hands us?

  Give me the requirements list, with the case or reason behind each one. The cases it has to get right, at least: two people doing the exact same thing for different reasons; someone who pays more for the version that wasn't made in a sweatshop even though the product is identical; someone who clicks the rage bait and hates himself for it; someone who says he wants to keep scrolling and is not, in any sense I'd defend, better off for it; someone who genuinely cannot rank the two options. The distinctions it can't collapse: wanting vs. doing, a preference vs. a habit, my preference vs. the engagement metric's preference (our reward is engagement, and those are not the same thing, which is the part that actually keeps me up). And the results it has to stay consistent with — including that a whole family of reward functions fit the same behavior, so "the" reward is never just sitting there in the logs, and that we only ever get to see choices made under the policy we already shipped.

  Then split the list: which requirements are non-negotiable and which are just house rules of one camp (the RL people, the economists, the cog sci people). Flag any pairs you think are jointly unsatisfiable — thats the part I most want, since if "you can pin down the reward" and "behavior is all you get" can't both hold, I need to know which one to drop. Same question for "assume the demonstrator is rational" vs. "handle a user who's figuring out what she likes as she goes": a friend of mine got pulled into a whole new hobby by an algorithm and she's a genuinely different person now, preferences and all, and I have no idea what our machinery is supposed to do with that. Finish with the one requirement that knocks out the most candidate theories.

  Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question. Table is fine for the list.
