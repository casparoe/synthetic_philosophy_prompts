  I am trying to understand a passage from John Stuart Mill's A System of Logic, and I would like your help in unpacking it. Mill writes that "all organised bodies are composed of parts, similar to those composing inorganic nature, and which have even themselves existed in an inorganic state", yet the "phenomena of life" are quite different to those of non-living matter. I find this puzzling. On the one hand, Mill seems to assert a thoroughgoing compositional continuity between living and non-living bodies. On the other, he insists that the phenomena of life are quite different. How can both be true on his view? What does he mean by "composition" here, and what kind of difference is he attributing to life phenomena? Is he making a claim about the causal powers of the parts, about our ability to predict or explain the whole from the parts, or about the laws that govern the whole? Does this passage commit him to a form of emergence, and if so, what kind? How does it relate to his distinction between laws that compose and laws that do not? I would like a careful exegesis of the passage that does not import contemporary distinctions anachronistically, but that also helps me see where Mill's view sits on the spectrum between reductionism and emergentism. Please explain the argument step by step, clarify any technical terms, and say what Mill would and would not be entitled to claim about the reducibility of biology to physics and chemistry. Please write your answer in British English, and do not provide a bibliography or reading list; I want the explanation itself.
