answer: |-
  The tension you have identified lies at the heart of John Stuart Mill's philosophy of science, specifically within Book III of *A System of Logic*, concerning the 'Composition of Causes'. To resolve the puzzle, we must distinguish between the *materials* of which things are made and the *laws* that govern their combination. Mill's position is one of material continuity but nomological (law-based) discontinuity. He asserts that while living bodies are materially composed of inorganic elements, the laws governing their organised state cannot be deduced solely from the laws governing those elements in isolation.

  Here is a step-by-step exegesis of Mill's argument, clarifying his terminology and positioning his view regarding reductionism and emergentism.

  ### 1. The Doctrine of the Composition of Causes
  To understand Mill's view on life, one must first understand his general rule regarding causation, which he calls the 'Composition of Causes'. In many branches of physics, particularly mechanics, Mill observes that when multiple causes act together, the effect is simply the sum of the effects they would produce separately.

  For example, if two forces push a body, the resulting motion is the vector sum of the motions each force would produce alone. Mill calls this a **homopathic** effect (from the Greek for 'same feeling' or 'same affection'). In these cases, the laws governing the parts remain fully operative and visible in the whole. If you know the laws of the separate forces, you can predict the law of the combined effect. This is the ideal of deductive explanation in Mill's view.

  ### 2. The Exception: Heteropathic Laws
  However, Mill argues that the Composition of Causes is not a universal law of nature. There are exceptions where the joint effect of causes is not a sum, but something entirely new. He terms these **heteropathic** effects ('different feeling' or 'different affection').

  The primary examples Mill gives are chemical combination and organic life. When hydrogen and oxygen combine to form water, the resulting substance possesses properties (liquidity, transparency) that neither gas possessed alone, and which could not have been predicted merely by knowing the laws of hydrogen and oxygen in isolation. The laws of the separate elements seem to be suspended or transformed in the compound.

  Mill places the 'phenomena of life' firmly in this heteropathic category. When inorganic parts are arranged in a specific 'organisation', they produce life. The properties of the living whole (metabolism, growth, sensation) are not merely the sum of the physical properties of the carbon, nitrogen, and oxygen within it.

  ### 3. Material Continuity vs. Nomological Discontinuity
  This brings us to your specific puzzle. How can Mill claim continuity of parts but difference of phenomena?

  *   **Material Continuity:** Mill is not a vitalist in the supernatural sense. He does not believe living bodies contain a special 'soul substance' or 'vital fluid' absent in rocks. When he writes that organised bodies are composed of parts similar to inorganic nature, he means the *constituent matter* is identical. There is no ontological gap in the stuff of the universe.
  *   **Nomological Discontinuity:** The difference lies in the **laws**. Mill argues that new laws come into existence when matter is organised in a specific way. These are 'ultimate laws' of biology that are distinct from the ultimate laws of physics or chemistry.

  Therefore, the difference Mill attributes to life phenomena is not about the causal powers of the *parts* in isolation, but about the causal powers of the *arrangement*. The organisation itself generates new regularities. Consequently, the difference is primarily about our ability to **predict and explain** the whole from the parts. Because the laws are heteropathic, knowing the laws of the inorganic parts is insufficient to deduce the laws of the living whole.

  ### 4. Composition and Reducibility
  You asked what Mill means by 'composition' and how this relates to reducibility. For Mill, 'composition' refers to the logical relationship between the laws of the agents and the law of the joint effect.

  *   **In Mechanics:** The laws compose. The law of the whole is a function of the laws of the parts. Biology would be reducible to physics if this were true for life.
  *   **In Biology:** The laws do *not* compose in this straightforward manner. The laws of life supervene upon the physical constitution, but they are not derivable from it.

  This commits Mill to a specific stance on reducibility. He would deny that biology is **theoretically reducible** to physics and chemistry. By this, he means we cannot construct a valid deductive argument where the premises are solely laws of physics and chemistry, and the conclusion is a law of biology. To explain a biological phenomenon, we must invoke biological laws as independent premises.

  However, Mill does not deny **ontological continuity**. He does not claim biology violates physics. The physical laws still hold (the body does not levitate in defiance of gravity), but they are insufficient to explain the specific phenomena of life. The biological laws operate *through* the physical medium but are not *reducible* to the physical laws.

  ### 5. Emergence: An Anachronistic but Useful Label
  You asked if this commits him to a form of emergence. While Mill does not use the term 'emergence' (which gained currency in the late nineteenth and early twentieth centuries), his position is a classic formulation of what we now call **nomological emergentism**.

  *   **Weak Emergence:** If one believes the biological laws are *in principle* deducible from physics, but simply too complex for us to calculate, this is weak emergence.
  *   **Strong Emergence:** If one believes the biological laws are *in principle* independent and not deducible, this is strong emergence.

  Mill leans towards the latter, though with a caveat characteristic of his inductive logic. He argues that until we can demonstrate the deduction, we must treat the laws as ultimate and distinct. He is sceptical that the deduction is possible because the 'transformation' of laws in chemical and organic combinations suggests a genuine break in predictability. For Mill, the laws of life are 'resultant' laws that must be discovered by specific observation and induction within biology, not by deduction from below.

  ### 6. Resolution of the Puzzle
  To summarise how both statements can be true on Mill's view:

  1.  **'All organised bodies are composed of parts... inorganic state':** This is a claim about **substance**. The inventory of matter in a living body is the same as in a non-living body. There is no magic dust.
  2.  **'The phenomena of life are quite different':** This is a claim about **causation and law**. The specific configuration of that matter triggers a new set of causal regularities that do not apply to the matter when unorganised.

  The 'composition' Mill speaks of is not merely physical assembly; it is the logical composition of causal laws. In inorganic mechanics, the laws compose additively. In organic life, the combination of parts creates a new context in which the old laws are subsumed by new, heteropathic laws.

  ### 7. Conclusion: Mill's Position on the Spectrum
  Mill sits firmly between reductive materialism and supernatural vitalism.

  *   **Against Reductive Materialism:** He denies that biology is merely applied physics. He argues that the specific laws of life cannot be deduced from the laws of matter in isolation. Therefore, biology is an autonomous science with its own ultimate laws.
  *   **Against Supernatural Vitalism:** He denies that living matter is made of different stuff. The continuity of composition ensures that the natural world remains a unified system of nature, governed by law, even if those laws vary across different levels of organisation.

  For Mill, the unity of nature is found not in the reduction of all laws to one set of mechanical laws, but in the universal reign of law itself. We discover different ultimate laws for different phenomena (mechanical, chemical, vital, social), and we must not presume that the laws of the simpler parts can explain the complex whole when heteropathic causation is at play. Thus, while the body is physically continuous with the rock, the *logic* required to explain the body is distinct from the logic required to explain the rock.
