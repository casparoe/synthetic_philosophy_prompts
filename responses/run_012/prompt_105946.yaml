answer: |-
  Here is a decision procedure designed to stabilize your committee's outputs, align reasons with votes, and manage the lay-member constraint.

  ### The "Anchor-and-Align" Procedure

  **1. The Voting Threshold Rule**
  Clarify immediately that "two-thirds majority" means **six affirmative votes out of the nine committee seats**.
  *   **Abstentions:** An abstention is not a vote. It is a vacancy for that question. If three lay members abstain on a technical criterion, only six votes are cast. To reach the required six affirmative votes, **all six practitioners must vote "Yes."** If even one practitioner votes "No" or abstains, the criterion fails.
  *   **Why:** This prevents appeals arguing that the quorum or threshold was miscalculated. It forces the practitioners to carry the technical load if the lay members recuse themselves.

  **2. The Sequence of Questions**
  You must keep the charter's order (Criteria 1, 2, 3, then Overall), but you will change how the results are treated.
  *   **Phase A (The Findings):** Vote on Criterion 1, then 2, then 3. Record the numbers.
  *   **Phase B (The Verdict):** Vote on the Overall Breach. Record the number.
  *   **Phase C (The Reconciliation):** *Before adjourning*, the Chair compares Phase A and Phase B. This is where you prevent the appeal.

  **3. The Reconciliation Logic (The "Anchor")**
  The Overall Verdict is the **Anchor**. It is the only legally binding outcome. The Criteria Votes are **Evidence** used to write the reasons.
  *   **If Overall Breach Fails (0–5 votes):** The case is dismissed. You do not need to name a decisive criterion. You simply record that the threshold for a breach was not met. The criterion votes are recorded as "considered but not determinative."
  *   **If Overall Breach Passes (6+ votes):** You *must* identify one criterion as "decisive" in the written decision.
      *   **Rule:** You may only cite a criterion as "decisive" if it *also* passed the two-thirds threshold (6 votes) in Phase A.
      *   **Selection:** If multiple criteria passed, the Chair selects the one with the highest vote count. If tied, the Chair selects the one most relevant to the public interest.
      *   **The Mismatch Fix:** If the Overall Breach passes (6+ votes) but *no* criterion reached 6 votes (e.g., they all got 5), you have a procedural crisis. You cannot write a valid decision. In this specific case, the Chair must rule that the finding of breach is **unsafe** and revert the verdict to "No Breach" to survive appeal. (See "Where it Misfires" below).

  **4. Recording the Reasons**
  To survive appeal, the written decision must not claim logical necessity (e.g., "Because A, B, and C are true, therefore Breach"). It must claim **weighting**.
  *   **Drafting Formula:** "The Committee found that the member's conduct [met/did not meet] Criterion X. While other criteria were considered, the Committee determined that Criterion X was the decisive factor in reaching the overall conclusion of [Breach/No Breach]."
  *   **Why:** This acknowledges the charter's instruction that criteria are "matters to be considered" rather than strict logical gates. It aligns the text with the vote count on the specific criterion cited.

  ---

  ### Running the Procedure on Your Cases

  **Case 1: The "Ghost Breach" (Criteria Met, Overall Rejected)**
  *   **Votes:** Criterion 1 (7), Criterion 2 (7), Criterion 3 (7). Overall Breach (3).
  *   **Procedure Application:**
      1.  Phase A records three passing criteria.
      2.  Phase B records a failed Overall Verdict (3 is less than 6).
      3.  **Anchor Rule:** The Overall Verdict is the Anchor. Since it failed, there is **No Breach**.
      4.  **Recording:** "The Committee considered all three criteria. Although substantial concerns were raised under Criteria 1, 2, and 3, the Committee did not reach the required two-thirds majority on the ultimate question of whether these amounted to a charter breach. Verdict: No Breach."
      5.  **Result:** Appeal proof. The reasons match the final vote. The high criterion votes are acknowledged as "concerns" but not "decisive."

  **Case 2: The "Leapfrog Breach" (Overall Passed, One Criterion Failed)**
  *   **Votes:** Criterion 1 (6), Criterion 2 (4), Criterion 3 (6). Overall Breach (6).
  *   **Procedure Application:**
      1.  Phase A records C1 (Pass), C2 (Fail), C3 (Pass).
      2.  Phase B records Overall (Pass).
      3.  **Anchor Rule:** Breach is found. You must name a decisive criterion.
      4.  **Selection:** You cannot name Criterion 2 (it failed). You must choose between 1 and 3. Both have 6 votes.
      5.  **Chair's Judgment:** The Chair selects Criterion 1 (e.g., as the most serious).
      6.  **Recording:** "The Committee found a breach. While Criterion 2 was not met to the required standard, the majority found Criterion 1 decisive. The overall finding rests primarily on the satisfaction of Criterion 1."
      7.  **Result:** Appeal proof. The text admits C2 failed, so the logic isn't contradicted by the record.

  ---

  ### The Wrinkle: Lay Member Abstention

  **The Scenario:** 3 Lay Members abstain on Criterion 1 (Technical). 6 Practitioners vote.
  **The Math:** To get 6 votes on Criterion 1, **all 6 Practitioners must vote Yes.**
  **The Risk:** If 5 Practitioners vote Yes and 1 votes No, the criterion score is 5/9. It fails.
  **The Procedure Adjustment:**
  1.  **Pre-Vote Warning:** Before voting on technical criteria, the Chair must state: "Lay members are abstaining. To pass this criterion, we require unanimity from the six practitioners."
  2.  **If Overall Passes but Technical Criterion Fails:** If the Overall Breach passes (perhaps the lay members voted Yes on the overall based on non-technical evidence), but the Technical Criterion fails (because one practitioner dissented), you **cannot** cite the Technical Criterion as decisive.
  3.  **Solution:** You must find a *non-technical* criterion (e.g., "Integrity" or "Communication") that secured 6 votes including lay support to serve as the "decisive" reason.
  4.  **If Only Technical Criterion Passed:** If the only criterion to get 6 votes was the technical one, but the lay members abstained on it and voted Yes on Overall, you have a split.
      *   *Procedure:* You may still cite the Technical Criterion as decisive *if* it got 6 votes (from practitioners). The written reason states: "The technical criterion was met by the required majority of the Committee." This is factually true even if lay members abstained.

  ---

  ### Where the Procedure Misfires & Limitations

  **1. The "Unsafe Verdict" Trap**
  *   **Scenario:** Overall Breach gets 6 votes. All three Criteria get 5 votes (perhaps due to the lay abstention math).
  *   **Failure:** My procedure requires you to revert the verdict to "No Breach."
  *   **Why:** You cannot write a reason stating a criterion was decisive when no criterion passed the charter's threshold. Publishing a breach finding with no passing criteria is an appeal waiting to be lost.
  *   **Limitation:** This procedure cannot force a logical bridge where the votes don't exist. It prioritizes legal safety over the majority's desire to punish in that specific meeting.

  **2. Binding the Minority to Reasons**
  *   **Your Question:** Can this avoid binding a minority of four to reasons they reject?
  *   **Answer:** **No.** No voting procedure can do this.
  *   **Explanation:** If the vote is 6–3 to find a breach, the 3 dissenters are bound by the outcome. If you cite Criterion 1 as decisive, and 3 members voted that Criterion 1 was *not* met, those 3 members are bound by a reason they explicitly rejected.
  *   **Mitigation:** The procedure minimizes this by ensuring the reason cited (Criterion 1) at least *passed* the threshold. The minority can disagree with the weight given to it, but they cannot claim the Committee lied about the vote count. The written decision should explicitly note: "Criterion 1 was met by a majority of six; three members dissented on this point." This transparency reduces appeal risk even if it doesn't change the binding nature.

  **3. The Lay Member "Veto"**
  *   By abstaining on technical criteria, the lay members effectively give the practitioners a veto. If 5 practitioners want to pass a technical criterion, they cannot do it without the 6th. This may cause friction, but it is the arithmetic consequence of their abstention combined with your 2/3 rule.

  ### Confidence and Uncertainty

  **Confidence Level:** **High (85%)**
  This procedure aligns the written reasons with the voting record, which is the specific ground on which your previous appeals were allowed. It treats the Overall Verdict as the legal truth and the Criteria as the supporting narrative, which respects the charter's "matters to be considered" clause.

  **Least Certain Step:** **The "Unsafe Verdict" Reversion.**
  I am least sure about the instruction to revert a 6-vote Overall Breach to "No Breach" if no single criterion passes 6 votes.
  *   *Why:* A strict legalist might argue that since the charter says criteria are not "necessary conditions," you could theoretically find a breach based on the *cumulative* weight of three failing criteria (e.g., 5+5+5 votes). However, since your charter requires a "decisive criterion" to be stated, citing a criterion that failed its own vote is logically indefensible in a written judgment. Reverting the verdict is the safer path to avoid a third appeal, but it may feel frustrating to a committee that clearly wants to find a breach.
