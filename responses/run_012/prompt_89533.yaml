      *   *Radical Interpretation:* Interpreting a speaker from scratch without prior knowledge of their beliefs or meanings.
      *   *Principle of Charity:* We must assume the speaker is mostly rational and shares our beliefs about the world to make sense of their utterances. We assign belief and meaning simultaneously.
      *   *Holism:* Meaning comes from the totality of evidence, not isolated sentences.
      *   *Indeterminacy:* Davidson argues against Quine that while some indeterminacy exists, a completely alien conceptual scheme is incoherent. We *can* understand others because we share a world.
      *   *Truth:* Interpretation aims at truth conditions.

  3.  **Deconstruct the Film (*The Conversation*):**
