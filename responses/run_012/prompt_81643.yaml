      *   *Camp B (Multiversists/Pragmatists/Extrinsic Justification):* Often associated with Cohen, Hamkins, Shelah (to an extent). Belief in a multiverse of set-theoretic worlds. CH is independent; asking if it's "true" simpliciter is like asking if a group is abelian without specifying the group. Truth is relative to a model. Axioms are tools/stipulations.

