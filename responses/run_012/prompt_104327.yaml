          *   *But*, explain why this is a bad idea/trap. It doesn't make genes less important; it makes *luck* more important.
          *   Analogy time: Planting seeds. Good soil (equal) -> differences are seed quality (high heritability). Bad/Random soil (unequal) -> differences are soil quality (low heritability).
          *   Conclusion: You don't want to lower heritability by making things worse. You want to raise the *mean*, not just mess with the variance.
      *   **Addressing Question 2 (100% Heritable = Fixed?):**
          *   This is the crucial distinction: *Variance within a group* vs. *Mean level of the trait*.
