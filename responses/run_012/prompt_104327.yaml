answer: |-
  You have successfully navigated the rabbit hole and come out the other side with your intuition intact. In fact, your sanity check is spot-on: **Heritability is not a fixed property of a trait; it is a property of a population in a specific environment.**

  You have correctly identified the two biggest misconceptions about heritability that trip up even smart people. Here is the breakdown to help you hold your own at dinner.

  ### 1. Is the way to "de-geneticize" a trait to make society more unequal?

  **Statistically: Yes.**
  **Ethically and Practically: Absolutely not.**

  You nailed the math. Heritability ($h^2$) is a ratio. It's the variance due to genes divided by the *total* variance (genes + environment).
  $$h^2 = \frac{\text{Genetic Differences}}{\text{Genetic Differences} + \text{Environmental Differences}}$$

  If you make the environment chaotic and unequal (huge environmental differences), the bottom number gets bigger, and the heritability fraction gets smaller. If you make the environment perfectly equal (zero environmental differences), the bottom number shrinks, and heritability shoots up toward 100%.

  **The Trap:**
  Lowering heritability by increasing inequality doesn't make genes less important; it just makes **luck** more important.

  Imagine you have two types of corn seeds: high-yield and low-yield.
  *   **Scenario A (Equal Society):** You plant both in perfect, nutrient-rich soil. The high-yield seeds grow tall; the low-yield seeds grow short. The difference is almost 100% genetic. Heritability is high.
  *   **Scenario B (Unequal Society):** You plant the high-yield seeds in dirt and the low-yield seeds in fertilizer. Now, the plants in fertilizer grow tall regardless of their seeds. The difference in height is mostly due to the soil (environment). Heritability is low.

  In Scenario B, you have successfully "de-geneticized" the height difference. But you haven't helped the plants. You've just made their outcomes depend on where they were planted rather than their potential.

  So, while increasing inequality lowers the heritability statistic, it increases the amount of human potential being wasted. Policymakers generally want to raise the *average* outcome (make everyone taller), not just scramble the variance to make a statistic look better.

  ### 2. If a trait is 100% heritable, is it fixed/unchangeable?

  **No.** This is the most dangerous misconception in behavioral genetics.

  Heritability explains why **Person A is different from Person B** within a specific group. It does *not* explain why **the whole group** might change over time.

  **The Height Example:**
  Height is highly heritable (around 0.8 or 0.9 in developed nations). This means that in a modern American classroom, the reason one kid is taller than another is mostly genetics.
  *However*, the average American today is several inches taller than the average American from 150 years ago. Did our genes change in 5 generations? No. Our environment (nutrition, healthcare) changed.
  *   **Within the group:** Differences are genetic.
  *   **Across time:** The shift is environmental.

  **The PKU Example:**
  Phenylketonuria (PKU) is a genetic condition that causes severe intellectual disability. It is 100% genetic in origin.
  *   **Intervention:** If you change the environment (put the child on a specific diet that avoids phenylalanine), the disability never happens.
  *   **Result:** A 100% genetic trait was completely "cured" by an environmental intervention.

  So, if you hear someone say, "IQ is highly heritable, so preschool programs won't work," you can tell them they are confusing **variation** with **malleability**. High heritability does not mean the trait is immutable. It just means that *in the current environment*, genetic differences are the main reason people differ.

  ### A Note on IQ and Age
  You mentioned IQ heritability rising with age. You are right about this too (it goes from ~0.4 in childhood to ~0.8 in adulthood).
  *   **Why?** As kids, their environment is forced on them (same school, same parents). As adults, they select their own environments. Smart people choose jobs and hobbies that stimulate their brains. This is called "gene-environment correlation." Your genes drive you toward environments that maximize your genetic potential. So, ironically, the more freedom you have, the more your genes "show."

  ### The Dinner Party Cheat Sheet
  If you need to summarize this quickly over appetizers, here are the three takeaways:

  1.  **Heritability is about differences, not destiny.** It tells you why I'm different from you, not why we are different from our grandparents.
  2.  **High heritability does not mean unchangeable.** Height is highly heritable, but we got taller due to better food. PKU is genetic, but fixed by diet.
  3.  **Heritability depends on inequality.** In a perfectly equal world, heritability would be 100%. In a perfectly random world, it would be 0%. Neither of those tells you if the trait is "genetic" in a biological sense.

  You've got the concept down. The "weirdness" you're feeling is actually the realization that heritability is a statistical description of a population, not a biological law of nature. Go forth and argue responsibly.
