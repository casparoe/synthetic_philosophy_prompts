answer: |-
  Mira capped the black marker and tapped the whiteboard, where a rough diagram showed sugar molecules entering a cell membrane. "Look at the yeast case again. The lab engineered the metabolic pathways so that the consumption order matches insertion sort on the concentration list. Input: sugar mixture. Output: consumption sequence. Internal state: enzyme activation levels. If this were silicon, you'd call it a computer. Why does biology change the category?"

  Dev leaned against the table, arms crossed. "Because when it's silicon, the physical states are *meant* to represent data. The voltage high is assigned the value '1' by a designer who built the gate to process logic. With the yeast, the chemistry just happens. The 'sorting' is a pattern we see from the outside. The yeast isn't executing an algorithm; it's following thermodynamic gradients. You're conflating 'behaves as if' with 'computes'."

  "But that's exactly the claim," Mira said, turning back to the board. "Cognition in the brain looks like yeast from the inside. Neurons fire based on thresholds, potentials, and chemical gradients. If you accept the brain computes, you must accept that computation doesn't require a designer assigning meaning. It requires causal structure. If the physical state transitions are isomorphic to the state transitions of a Turing machine, it is computing. Substrate independence isn't a metaphor; it's a structural claim."

  "Isomorphism is the weak point," Dev countered. "Give me any physical system—a rock, a bucket of water, this yeast—and I can map its physical states to computational states. I can map the rock's temperature to a bit string. If I wiggle the mapping enough, the rock implements WordPerfect. If 'computation' just means 'can be mapped to,' then everything computes. The claim becomes vacuous. You need a constraint on the mapping that excludes the rock but includes the yeast."

  Mira paused, marker hovering. "Okay, let's steelman that. Your strongest argument is that without a constraint on how we map physics to logic, pancomputationalism follows, and if everything computes, nothing computes. You're saying the mapping must be natural, not arbitrary."

  "Exactly," Dev said. "If you have to gerrymander the physical states to fit the algorithm, you aren't finding computation; you're imposing it. In a CPU, the mapping is fixed by the architecture. In the yeast, who fixed it?"

  "The environment fixed it," Mira said. "Evolution selected for that causal pathway. But let's concede your point on arbitrary mappings. I agree: a valid computational description requires that the physical states support the counterfactuals of the algorithm. If I had presented a different sugar concentration, the yeast *would* have consumed them in the corresponding sorted order. It's not just one trace; it's the disposition to behave across input space. The rock doesn't support those counterfactuals. If I change the input to the rock, it doesn't transition states according to logic rules. The yeast does."

  Dev pushed off the table and walked to the board, drawing a box around the yeast diagram. "I'll concede that counterfactual robustness is necessary. The yeast reliably produces the output for varied inputs. But is it sufficient? Let's look at your brain claim. You want to say cognition *is* computation. But if I describe a hurricane computationally—input pressure, output wind speed—I don't think the hurricane is thinking. It's a dynamical system. The yeast is a dynamical system. The brain is a dynamical system. What distinguishes the brain's dynamics as 'processing information' rather than just 'reacting to forces'?"

  "Because the brain's dynamics are organized to manipulate representations," Mira said. "The state isn't just a physical quantity; it stands in for something else. In the yeast, the enzyme level represents the sugar concentration. The system manipulates that representation to produce a result."

  "Wait," Dev said, holding up a hand. "There's the rub. 'Stands in for.' Who is it standing in for? The yeast? The lab? You?"

  "The system itself," Mira insisted. "Internal control relies on the distinction."

  "Let me restate your best case to ensure I'm hitting the right target," Dev said. "You argue that if a system has internal states that causally interact based on their structure rather than their physical chemistry alone, that is computation. The enzyme level matters because of what it *is* in the network, not just its mass. If the causal topology matches the logical topology, it's computing."

  "Yes," Mira said. "That's the level of explanation that predicts behavior best. Saying 'it's just chemistry' is too low-level. Saying 'it's sorting' captures the generalization."

  "But here's the trap," Dev said. "You said the states interact based on their structure. But physical states only interact based on their physics. The enzyme doesn't know it's a variable. It just binds. To say it's a variable is to adopt a stance toward it. So, here is my qualification: I will accept that the yeast is a *computational resource*. It can be used to compute. But that doesn't mean it *is* computing intrinsically. It becomes a computer when an agent interprets the output as data. Without the lab reading the consumption order as a sorted list, it's just eating."

  Mira uncapped the red marker. "So you're making computation observer-relative. It depends on someone using the output."

  "For artificial systems, yes. For natural systems, I'm skeptical," Dev said. "If computation is observer-relative, then saying 'the brain is a computer' means 'the brain can be used by us to simulate cognition.' It doesn't mean the brain is literally running code. It means code is a good lens for us."

  "But that undermines the science," Mira argued. "If I say the visual cortex computes edge detection, I'm making a claim about the cortex, not about me looking at the cortex. If it's observer-relative, then before humans evolved, nothing computed. But causal structures existed. I need an acceptance test. What physical property makes a system a computer without an observer?"

  Dev sighed, rubbing his chin. "That's the hard line. If you demand intrinsic computation, you risk the triviality thesis again. If you demand an observer, you make the brain's computation dependent on us. Maybe the criterion is *teleology*. The system must have a goal it is trying to achieve via the manipulation of states."

  "The yeast wants to metabolize," Mira said.

  "Biological drive isn't computational intent," Dev replied. "But let's try this. For a system to genuinely compute, the physical implementation must be *modular*. You should be able to change the substrate without breaking the function, provided the causal structure holds. The yeast is engineered to be robust. But is the brain modular? Or is it so wetware-specific that the computation can't be separated from the chemistry?"

  Mira drew a new box. "I'll concede modularity is a strong indicator. If the function survives substrate change, it's likely computational. But I don't think it's strictly necessary. A system could be a computer even if it's hardwired, provided the state transitions follow logical rules rather than just physical laws."

  "But physical laws *are* what govern state transitions," Dev pressed. "Logic is abstract. Physics is concrete. You need a bridge. In a CPU, the bridge is the design specification. In the brain, what is the bridge? If you say 'evolution,' that's a history, not a current property. If you say 'causal structure,' I say rocks have causal structure."

  "Rocks don't have *controlled* causal structure," Mira said. "The yeast pathway is isolated. It shields the logic from noise. That's what computation is: noise-resistant state transformation."

  "Okay," Dev said. "So we have three criteria emerging. Counterfactual robustness, causal isomorphism, and noise resistance. The yeast passes all three. So does the brain. So why do I still feel like 'computation' is a layer we paint on top?"

  "Because you're looking for syntax," Mira said. "You want the system to recognize its own states as symbols."

  "Isn't that required?" Dev asked. "If the system doesn't distinguish 0 from 1, it's not computing. It's just flowing."

  "The system distinguishes them by reacting differently," Mira said. "The enzyme binds to Sugar A but not Sugar B. That physical distinction *is* the bit distinction. You don't need a little homunculus inside reading the bit. The physics does the reading."

  Dev picked up the eraser but didn't wipe anything. "Here is where I stop. The physics does the reacting, not the reading. Reading implies semantics. Reacting implies mechanics. You are claiming mechanics can generate semantics if the structure is complex enough. I am claiming mechanics stays mechanics forever. The yeast sorts sugars, but it doesn't sort *information*. It sorts matter. We call it information because we care about the order."

  "So your final position is that computation is a relationship between a system and an interpreter?" Mira asked.

  "Essentially. Without an interpreter, there is only physics. With an interpreter, there is computation."

  "And mine is that computation is a specific class of physical causal organization," Mira said. "Independent of interpretation."

  "We're at the crux," Dev said. "If you're right, the universe is full of computers we haven't decoded. If I'm right, computation is a tool humans use to carve up physics."

  "And neither of us can prove it without defining whether 'information' is physical or relational," Mira said, capping the marker.

  "Exactly," Dev said. "If information is physical, like mass, you win. If information is relational, like 'left of,' I win."

  They stood back from the board, the yeast diagram sitting between them, neither clearly a machine nor clearly just chemistry.

  ***

  **Closing Note: The Unanswered Questions**

  To move this dispute forward, the following questions must be resolved:

  *   **Intrinsic vs. Relational Properties:** Is information processing a physical property inherent to certain causal structures (like mass or charge), or is it entirely dependent on an external agent assigning meaning to states (like 'left' or 'valuable')?
  *   **The Constraint on Mapping:** What objective physical constraint prevents the "triviality thesis" (that any system implements any computation) without appealing to the intentions of a designer or observer?
  *   **Syntax in Physics:** Can a physical system genuinely distinguish between syntactic states (0 vs 1) based solely on causal powers, or does syntactic distinction always require a semantic layer imposed from outside the system?
