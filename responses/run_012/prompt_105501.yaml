answer: |-
  # The First Two Layers

  The protocol was designed to eliminate bias. In the quiet hum of the paleontology lab, Specimen 894 sat under the magnifying lens, a shard of jawbone potentially rewriting the lineage of the genus. The rule was simple: each researcher would take a private caliper measurement of the molar ridge, compare it against the established threshold, and log a verdict in the digital ledger. *Novel* or *Extant*. You could see the ledger's history, but never the measurements behind it.

  Elias went first. He adjusted the micrometer, squinted through the eyepiece, and typed. *Novel.*

  Mara went second. She measured, frowned slightly at the reading—it was borderline, leaning toward *Extant*—but then she looked at the screen. Elias had voted *Novel*. If the threshold was ambiguous, Elias's private signal was valuable evidence. She weighed her own ambiguous data against his clear vote. It was rational to defer. She typed. *Novel.*

  Sarah was third. She measured the ridge carefully. The caliper read 4.2 millimeters. The threshold for a new species was 4.5. Her private signal was loud and clear: *Extant*. But when she turned to the screen, she saw two votes for *Novel*.

  Julian, waiting for his turn, leaned against the workbench. "Your reading looks decisive, Sarah. You're hesitating."

  Sarah didn't look away from the ledger. "My reading is decisive. It says *Extant*."

  "Then log it," Julian said. "We need the data."

  "If I log *Extant*, I'm telling the group that my single measurement outweighs the combination of Elias's measurement plus Mara's judgment," Sarah said, her voice level. "But Mara likely saw what I saw. If Mara voted *Novel* despite a borderline reading, she was deferring to Elias. That means the public record currently holds the weight of Elias's signal plus Mara's confirmation. My private signal is just one data point. Statistically, the probability that Elias and Mara are both wrong is lower than the probability that I am wrong."

  "So you're going to log what you don't believe?" Julian asked.

  "I'm logging what is rational," Sarah corrected. "If I vote against the cascade, I'm assuming my caliper is more reliable than the aggregate of the room. I have no reason to believe that. The system is designed so that after two agreements, the private signal becomes noise. If I vote *Extant*, I'm not adding information. I'm just creating conflict."

  She typed *Novel*.

  Julian watched her. He understood the math immediately. Once the first two agreed, the third person's private information was mathematically drowned out. The fourth person sees three votes, making the wave even harder to stop. By the time Julian sat down, the ledger showed three *Novel* votes. His own measurement was irrelevant. He logged *Novel*.

  By lunch, the lab had reached a consensus. The confidence was palpable. They spoke of Specimen 894 as a new discovery, citing the unanimous ledger as proof. The structure felt solid, built on the independent verification of seven researchers. Yet, informationally, the building rested entirely on Elias's eyes and Mara's deference. The subsequent five votes were echoes, adding volume but no substance.

  Two weeks later, Olds, the senior technician, was recalibrating the digital calipers used for the initial round. He paused at the log for Specimen 894's first measurement. He pulled the physical printout Elias had generated on day one.

  "Decimal slip," Olds said, walking into the main room where Sarah and Julian were working. He held the paper up. "Elias read 4.6 instead of 4.06. The machine logged the raw data, but he transcribed the verdict based on the typo."

  The room went still. The threshold was 4.5. Elias's actual measurement was well below the line.

  "So the first vote was random," Julian said, his voice tight. "Essentially a coin flip."

  "Which means Mara's vote was based on a false premise," Sarah added. She looked at the digital ledger on the wall, still glowing with its seven unanimous votes. "And the rest of us... we just followed the math."

  "But we were right to follow it," Julian said, turning to her. "Given what we saw, given the protocol, we acted perfectly. Every single one of us reasoned correctly."

  "Correctly," Sarah said. "But the foundation was sand."

  Olds shuffled the papers. "We'll need to re-evaluate. But the consensus is compromised. We can't use the ledger."

  The lab fell into a quiet uncertainty. They had held a belief with high confidence. They had arrived at it through rigorous, individual rationality. Each person had updated their beliefs according to the best available evidence, respecting the intelligence of their peers. By every internal metric, they had *known* it was a new species. The feeling of knowledge had been indistinguishable from the real thing.

  Now, the belief was suspended. It might still turn out to be a new species; the bone didn't change because the measurement did. But the justification had evaporated.

  Sarah looked at the ledger, then at her colleagues. They were smart, careful, and honest. They had constructed a tower of agreement that felt like bedrock. But if Elias had sneezed during the first measurement, or if Mara had decided to trust her own eyes for ten seconds, the entire room would now be confidently asserting the opposite truth with the same rational conviction.

  "Was it knowledge?" Julian asked quietly, staring at the screen. "Yesterday, it was knowledge. Today, it's a mistake. Nothing about the bone changed. Nothing about our reasoning changed."

  Sarah closed her notebook. "We agreed," she said. "Whether we knew... I don't think the protocol can tell us that."

  They left the ledger on the screen, a monument to seven rational minds walking off a cliff together, unsure if the ground would appear beneath them or if the fall was the only truth they had found.
