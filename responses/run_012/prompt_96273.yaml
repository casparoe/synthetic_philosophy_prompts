          4.  Address the "Otto vs. Shopping List" distinction (constraints on extension).
          5.  Address the "Shared/Institutional Memory" issue (overlap of minds).
      *   **Tone:** Academic, precise, nuanced, suitable for a doctoral candidate.

  2.  **Analyze the Sketch (Claim-by-Claim):**
      *   *Claim 1:* "Clark and Chalmers's extended mind thesis is the claim that the mind is not confined to the brain."
          *   *Status:* Harmless simplification, but slightly imprecise. It's usually "not confined to the skull/skin," but "brain" is often used colloquially. However, EMT is specifically about *vehicles* of cognition, not just "mind" generally.
      *   *Claim 2:* "The engine of the argument is the parity principle: if a process carried out beyond the skin does the kind of job that, performed inside the head, we would not think twice about calling cognitive, then it is a cognitive process."
          *   *Status:* Accept. This is the standard formulation of the Parity Principle (PP).
      *   *Claim 3:* "Their illustration is Otto, an Alzheimer's patient who writes everything down and consults his notebook automatically and without hesitation; the notebook plays the role that biological memory plays in the rest of us, so Otto's memory literally includes it."
          *   *Status:* Accept. This accurately describes the Otto case. "Literally includes" is the key active externalist claim.
      *   *Claim 4:* "The moral generalises: cognition is spread across whatever an agent happens to be coupled with..."
          *   *Status:* Reject/Misrepresentation. "Whatever an agent happens to be coupled with" is too loose. It invites the "cognitive bloat" objection. Coupling isn't sufficient; specific conditions (trust, access, endorsement) are needed.
      *   *Claim 5:* "...and the boundary between mind and world is accordingly arbitrary."
          *   *Status:* Reject/Disowned. Defenders (Clark/Chalmers) do *not* say the boundary is arbitrary. They say the *skin/skull* boundary is irrelevant for cognition, but a *functional* boundary exists. Saying it's "arbitrary" suggests there are no constraints, which leads to bloat.
      *   *Claim 6:* "A notebook, a smartphone, or a search engine can be part of your mind just as much as a neuron can."
          *   *Status:* Harmless simplification/Accept (with caveats). Clark later embraces smartphones/search engines (e.g., "Supersizing the Mind"), but the "just as much as a neuron" phrasing risks ignoring the differences in implementation (biological vs. artifactual), though functionally they claim equivalence.
      *   *Claim 7:* "That is the real force of the thesis — not merely that such things help us think, but that they are part of the thinking."
          *   *Status:* Accept. This captures the distinction between *coupling-constitution* fallacy (helping vs. being).

  3.  **Identify Conflations/Disowned Consequences:**
      *   *Coupling-Constitution:* The sketch implies coupling ("whatever an agent happens to be coupled with") is sufficient for constitution. Defenders insist coupling is necessary but not sufficient; specific functional roles must be met.
      *   *Arbitrariness:* The sketch claims the boundary is arbitrary. Defenders argue the boundary is *functional*, not biological. It's not arbitrary; it's just not where internalists think it is.
      *   *Vehicle vs. Content:* The sketch focuses on "mind" generally. EMT is specifically about *vehicles* of mental states (processes), not necessarily content (though they are linked).

  4.  **Drafting the Claim-by-Claim Analysis:**
      *   Need to be precise. Use terms like "active externalism," "vehicle externalism," "cognitive bloat."
      *   *Claim 1:* Simplification. It's about *vehicles* of cognition.
      *   *Claim 2:* Accurate.
      *   *Claim 3:* Accurate.
      *   *Claim 4:* Problematic. "Whatever" is too broad.
      *   *Claim 5:* Problematic. "Arbitrary" is wrong. It's functional.
      *   *Claim 6:* Mostly okay, but "just as much" needs functional qualification.
      *   *Claim 7:* Accurate (Constitution vs. Causation).

  5.  **Addressing the "Otto vs. Shopping List" (Constraints):**
      *   What distinguishes Otto's notebook from a casual list?
      *   Clark & Chalmers (1998) list specific conditions:
          1.  Constant availability.
          2.  Direct access (no mediation).
          3.  Automatic endorsement (trust).
          4.  Past endorsement (information was put there by the agent).
      *   The sketch's silence here is dangerous because it invites the "cognitive bloat" objection (Adams & Aizawa).
      *   Repair: Add the conditions of trust, access, and endorsement. This preserves the thesis without making *every* tool part of the mind.

  6.  **Addressing Shared/Institutional Memory (Overlap):**
      *   If a lab notebook is used by multiple researchers, is it part of *all* their minds?
      *   EMT allows for overlap. It's not a reductio.
      *   Clark/Chalmers accept that cognitive systems can overlap.
      *   However, for *individual* memory (Otto case), the endorsement condition is individual. For *joint* memory, the conditions shift to group agency (e.g., Theiner, Gilbert).
      *   If the sketch's loose criterion ("whatever coupled") is used, yes, it implies overlap, but potentially *too much* overlap (bloat).
