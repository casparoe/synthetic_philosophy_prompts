answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two graduate students, Maya and Leo, sit amidst stacks of papers and open laptops. Both are preparing for a seminar paper on the previous week's lecture regarding undefined expectations.*

  **Maya:** I can't shake the feeling that we're being asked to accept a bullet that shouldn't be bitten. The "Alternating St. Petersburg" game we discussed Tuesday—it feels like Expected Utility Theory (EUT) is throwing up its hands when it should be making a decision.

  **Leo:** You mean the case where the expectation reduces to the alternating harmonic series?

  **Maya:** Exactly. The payoff is $(-1)^{n-1} 2^n / n$ if heads comes on toss $n$. The probability is $1/2^n$. The expected value terms cancel down to $(-1)^{n-1} / n$. Summed in the natural order, that's $\ln 2$. But because it's only conditionally convergent, the Riemann Rearrangement Theorem kicks in. You can reorder the terms to sum to anything. So, standard measure theory says the expectation is undefined.

  **Leo:** That's the standard diagnosis. The Lebesgue integral isn't defined for functions that aren't absolutely integrable.

  **Maya:** But here's the rub. Consider the "Shifted Game." You add one dollar to every possible payoff. State-for-state, the Shifted Game dominates the Original Game. In every possible world—every sequence of coin tosses—you end up with exactly one dollar more in the Shifted Game. Pre-theoretically, any rational agent must prefer the Shifted Game.

  **Leo:** I don't think anyone denies the dominance intuition.

  **Maya:** But EUT denies the ranking. If the expectation of the Original is undefined, and the expectation of the Shifted is undefined—which it is, because adding an absolutely convergent series like $\sum 1/2^n$ to a conditionally convergent one leaves it conditionally convergent—then EUT says you cannot compare them. It treats them as incommensurable. That's not just a gap; it's a failure of the theory to capture a basic rational requirement. If theory $T$ says "I cannot rank $A$ and $B$" when $A$ strictly dominates $B$, theory $T$ is defective.

  **Leo:** I think you're conflating Expected Utility *Theory* with the specific *method* of calculating expectations via Lebesgue integration. EUT is an axiomatic system. It includes axioms like Independence and Transitivity. It doesn't necessarily include State-Wise Dominance as a derived theorem in infinite contexts; usually, that's an additional constraint we impose.

  **Maya:** If the core machinery of the theory—maximizing expected utility—can't handle dominance in infinite cases, then the machinery is too narrow. We need a principle that says "If $U(A) > U(B)$ in every state, prefer $A$," even when expectations are undefined. But if we have to import that from outside the expectation calculus, haven't we admitted that expectation maximization isn't the whole story of rational choice?

  **Leo:** Or, we've admitted that "expectation" is a precise mathematical concept that doesn't always apply. Look, Maya, the intuition that the Shifted Game is better relies on the idea that the "value" of the game is the sum of the probability-weighted utilities. But in this case, that sum *doesn't exist*. It's not that it's hidden; it's that the mathematical object you're trying to point to isn't well-defined.

  **Maya:** But the *game* is well-defined. The payoffs are definite. The probabilities are definite. Why should the *value* be indefinite?

  **Leo:** Because value, in EUT, is defined by the long-run behavior of the gamble. If you play the Original Game repeatedly, does your average payoff converge to $\ln 2$?

  **Maya:** Intuitively, yes. If I play it a million times, the law of large numbers should kick in.

  **Leo:** That's where the intuition betrays you. The Strong Law of Large Numbers requires the expectation to be finite (or infinite in a specific direction). For conditionally convergent series, the sample mean doesn't necessarily converge to the sum of the series ordered by $n$. In fact, depending on how you aggregate the outcomes over time, the average can oscillate. If the long-run frequency doesn't stabilize, what does it mean to say the game is "worth" $\ln 2$?

  **Maya:** That seems like a technical artifact of how we define convergence. In the physical world, I play toss 1, then toss 2, then toss 3. I don't rearrange the order of the tosses. The "natural order" is fixed by time. Why should the mathematical possibility of rearranging terms matter if the physical process imposes a specific order?

  **Leo:** Because expectation isn't just about the time-order of outcomes; it's about the measure over the state space. If you accept the "natural order" summation as defining the value, you're committed to saying that the value of a portfolio of gambles depends on how you group them. Suppose I offer you two tickets to the Original Game. Is the value $2 \ln 2$? If you sum the combined series differently, you might get a different answer. This violates Additivity. If you fix the value by fiat to the natural order, you break the linearity of expectation, which is central to decision theory.

  **Maya:** I'd rather break linearity than violate Dominance. Let's look at another variant to test this. Consider the "Absolute Game." We take the absolute value of the payoffs in the Original Game. So the payoff is $2^n / n$ regardless of the sign.

  **Leo:** Then the expectation terms are all positive: $1/n$. The sum diverges to positive infinity.

  **Maya:** Right. So the Absolute Game has an expected value of $+\infty$. The Original Game has an undefined expected value. Now, intuitively, the Absolute Game should be preferred to the Original Game, because in half the states (roughly speaking) you get more, and in the others you get the same. But more importantly, compare the Absolute Game to the Shifted Game. The Absolute Game has $E = \infty$. The Shifted Game has $E = \text{undefined}$. Does EUT say the Absolute Game is better?

  **Leo:** Standard EUT usually treats $+\infty$ as a distinct category. If one prospect has infinite expectation and the other is undefined, the theory is typically silent on the comparison, unless you adopt specific rules for infinite utility. But notice: the Absolute Game is riskier in terms of variance, though variance is also infinite here.

  **Maya:** My point is about the hierarchy of badness. "Undefined" feels like a glitch. "Infinite" feels like a feature. If I have to choose between a game with a defined infinite expectation and one with an undefined expectation, I want the theory to tell me to pick the infinite one. But if both are just "non-finite," the theory lumps them together. This suggests the theory lacks the resolution to distinguish between "unboundedly good" and "mathematically incoherent."

  **Leo:** I think you're craving a ranking where none is rationally mandated. Consider the "Truncated Variant." Suppose we cap the game at $N$ tosses. If heads hasn't appeared by $N$, the payoff is zero. Now the expectation is finite and well-defined. As $N \to \infty$, the expectation of the truncated game oscillates around $\ln 2$. It doesn't converge monotonically.

  **Maya:** It converges to $\ln 2$ if you take the limit of the partial sums in the natural order.

  **Leo:** But the *value* of the limit depends on the order of truncation. If I truncate based on the magnitude of the payoff rather than the toss number, I get a different limit. If a rational agent's preference depends on how an external bookkeeper decides to truncate the contract, that agent is vulnerable to framing effects. The "undefined" diagnosis protects the agent from claiming a value that isn't robust.

  **Maya:** But I'm not an external bookkeeper. I'm the player. I know the rules: toss until heads. Payoff depends on $n$. The "order" is fixed by the rules of the game. It's not a framing effect; it's the structure of the prospect. If I tell you, "I will pay you $1$ if heads on toss 1, $-1/2$ if heads on toss 2..." that is a specific contract. It is not the same contract as "I will pay you $-1/2$ if heads on toss 2, $1$ if heads on toss 1..." even if the set of outcomes is the same. The mapping from state to payoff is fixed.

  **Leo:** I grant that the mapping is fixed. But the *expectation* is an integral. $\int X dP$. In measure theory, that integral is only defined if $\int |X| dP < \infty$. If it's not, the integral doesn't exist. You are proposing we define the value of the game not by the integral, but by the limit of partial sums $\lim_{N \to \infty} \sum_{n=1}^N p_n x_n$.

  **Maya:** Yes. Exactly. Why is the integral the only admissible definition of value?

  **Leo:** Because the integral guarantees coherence across combinations of gambles. If you define value via sequential partial sums, you lose Fubini's Theorem. You can't swap the order of integration and summation. If you play two independent games of this type, the expected value of the combined portfolio might not equal the sum of the expected values. That makes decision theory computationally intractable and normatively unstable.

  **Maya:** So you're saying we should sacrifice the Dominance principle to save Linearity?

  **Leo:** I'm saying that in infinite domains, Dominance and Linearity can conflict. You have to choose which one to keep. EUT prioritizes Linearity and Coherence. You want to prioritize Dominance.

  **Maya:** But Dominance is more fundamental! If I give you two envelopes, and Envelope A contains exactly $100 more than Envelope B in every possible scenario, you take Envelope A. You don't say, "Well, the integral of the content of Envelope A is undefined, and so is B, so I'm indifferent." That's absurd.

  **Leo:** It's not absurd; it's a warning sign. It tells you that you're dealing with a scenario where "value" isn't behaving like a number. If you force a ranking based on dominance in these infinite cases, you open the door to money pumps.

  **Maya:** How? If I always prefer the dominated option, how do I get pumped?

  **Leo:** Suppose you have a preference rule that says "Prefer $X$ to $Y$ if $X$ dominates $Y$, even if expectations are undefined." Now consider a sequence of trades. In infinite contexts, you can construct sequences of dominated improvements that cycle back to the start if you aren't careful about how the limits behave. There are papers by Seidenfeld and others showing that extending dominance to infinite cases without absolute convergence can lead to violations of transitivity or sure-loss scenarios.

  **Maya:** I'm aware of the Seidenfeld arguments. But those rely on the agent being willing to trade based on *any* improvement. A more modest claim is just that EUT should be *extended* to handle simple dominance cases like the Shifted Game, without committing to a full theory of infinite utility. We could say: "Maximize expectation where defined; where undefined, use state-wise dominance."

  **Leo:** That sounds like a patch. And it leaves the theory disunified. Why does rationality operate on one principle for finite sums and another for infinite ones?

  **Maya:** Because infinity is a singularity. Physics has singularities; we don't say General Relativity is "defective" because it breaks down at a black hole. We say it has a domain of applicability. Maybe EUT's domain is prospects with absolutely convergent expectations. When we step outside that, we need a backup principle. The fact that EUT is silent on the Shifted Game isn't a *mistake*, but it is an *incompleteness*. And for a normative theory, incompleteness in the face of clear intuitive data is a vice.

  **Leo:** I'd argue it's a virtue. It prevents us from making false precision claims. If I tell you the game is worth $\ln 2$, I'm making a claim about the long-run average return. That claim is false. The long-run average doesn't settle. So, telling you the value is undefined is the *truth*. Telling you the Shifted Game is better might be pragmatically useful, but it's not grounded in the expected utility calculus.

  **Maya:** But decision theory isn't just descriptive mathematics; it's normative. It's supposed to tell us what to do. If the math says "undefined," but rationality says "take the dollar," the math is the wrong tool for the job.

  **Leo:** Or, rationality is more subtle than "take the dollar." Perhaps in these edge cases, there *is* no rational requirement to prefer the Shifted Game, because the "dollar" doesn't aggregate in a stable way over the probability space.

  **Maya:** That's a hard sell. If I offer you the Shifted Game for free, and the Original Game for free, and you pick the Original, I'll think you're irrational.

  **Leo:** And if you pick the Shifted, I'll think you're following a dominance heuristic that works 99% of the time but lacks foundational support in this specific 1%. We agree on the choice, Maya. We disagree on whether EUT *must* validate that choice to be successful.

  **Maya:** I think a theory that can't validate the choice is failing its primary function.

  **Leo:** And I think a theory that validates the choice by redefining expectation is sacrificing its mathematical integrity.

  **Maya:** So, where does that leave us?

  **Leo:** We agree that the Shifted Game dominates the Original. We agree that standard EUT, defined via Lebesgue integration, declares both expectations undefined. We agree that the "Absolute Game" yields $+\infty$ while the Original yields undefined.

  **Maya:** And we disagree on the implication. I conclude that EUT is incomplete and requires a dominance axiom that overrides undefined expectations in cases of state-wise strict dominance. You conclude that EUT is precise, and that our intuition about dominance in infinite cases is a heuristic that shouldn't be formalized into the core theory because it threatens coherence properties like linearity.

  **Leo:** Precisely. You want to save the intuition by modifying the theory. I want to save the theory by scrutinizing the intuition.

  **Maya:** Well, I suppose that's enough for the first draft. I'll argue that silence in the face of dominance is a bug.

  **Leo:** And I'll argue that it's a feature. See you in seminar.

  **Maya:** See you there. Try not to rearrange the terms of my argument on the way out.

  **Leo:** *[Smiling]* No promises. The sum might improve.
