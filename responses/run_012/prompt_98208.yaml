      *   *Elena:* It's about the *capacity* to give an account. The pooling relies on the ability to defend the claim.
      *   *Marcus:* But why is *that* valuable if not for the truth? If the truth is already there in the belief, what does the account add? Instrumental value only.
      *   *Elena:* Stability. Luck fades; understanding persists.
      *   *Marcus:* But in the moment of action, they are identical. The value you're describing is future-facing. What about now?
      *   *Elena:* Epistemology is always future-facing.
      *   *Marcus:* No, sometimes it's about the fit between mind and world.

      *(Self-Correction)*: Let's tighten the "pooling" argument. Elena needs to emphasize that knowledge is a *status* that allows entry into the economy of reasons. Marcus needs to say that status is conferred *because* it's valuable, not vice versa.

