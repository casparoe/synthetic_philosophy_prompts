answer: |-
  The question "Why is there something rather than nothing?" is often regarded as the fundamental question of metaphysics. It asks for the ground of all contingent reality. However, a significant challenge has arisen against the legitimacy of this inquiry, formulated as the Principle of Explanatory Symmetry (PES). PES asserts that for any contingent fact $F$ and its negation $\text{not-}F$, neither stands in a privileged relation to explanation. Existence and nonexistence are symmetric; neither is the default. Consequently, the demand for an explanation of existence presupposes a bias that treats being as an achievement and nonbeing as a baseline. If PES is true, the cosmological question is defective. This essay argues that while PES highlights a crucial presuppositional risk, it is ultimately false. The cosmological question is genuine because there is an ontological asymmetry between something and nothing that PES fails to capture.

  To determine whether the question is defective or genuine, we must establish clear criteria. A question is defective if it relies on incoherent terms or false presuppositions that make answering it impossible in principle. For example, asking "What is north of the North Pole?" is defective because the conceptual framework of latitude renders the query meaningless. Similarly, if "nothing" is an incoherent concept, or if the question presupposes that nonexistence is the natural state without justification, the question fails. Conversely, a question is genuine if there is a possible state of affairs that would satisfy the request for an explanation. This requires that the terms denote possible realities and that the request for a "why" does not violate the logical structure of explanation. Specifically, for the cosmological question to be genuine, it must be possible to cite a ground or reason for existence that does not itself require the same explanation, or to show that existence is self-explanatory. If the only possible answer is "it just is," the question remains genuine, though the answer may be brute.

  PES attempts to show the question is defective by attacking the asymmetry between existence and nonexistence. It claims that treating nothingness as the default is a psychological habit, not a metaphysical truth. If existence and nonexistence are equally contingent, neither calls for explanation more than the other. However, the critic's objection that PES "proves too much" is decisive. If PES were true universally, scientific and everyday inquiry would collapse. If a cup appearing on a table requires no more explanation than the cup not appearing, then causal investigation is unmotivated. We explain the cup's presence by citing a prior action because the absence of the cup is the expected state of the table in the absence of interference.

  The defender of PES might reply that ordinary explanations rely on background conditions, whereas the cosmological question does not. In local cases, the "default" is set by the environment; globally, there is no environment, so no default exists. Therefore, PES applies only to the totality of things. This restriction, however, appears ad hoc. It relies on the assumption that background conditions create asymmetry. But the deeper issue is ontological, not contextual. Existence is a positive state; nonexistence is a privation. To speak of "nothing" is to speak of the absence of something. An absence cannot stand on equal footing with a presence because the concept of absence is derivative. PES smuggles in an asymmetry by treating "nothing" as a substantive alternative state comparable to "something." It treats nonbeing as a kind of being that failed to obtain. But if nonbeing is merely the lack of being, it cannot serve as a rival hypothesis in a symmetric explanation. Therefore, PES fails because it reifies nothingness into a competitor with existence, when metaphysically, existence is the primary term.

  Even if PES is rejected, one must still ask if the question admits of an answer. Two prominent attempts to answer it illustrate the difficulty. The first claims that the world exists of necessity. On this view, there is no contingent fact to explain because the existence of reality is not contingent; it could not have been otherwise. This dissolves the question by denying its presupposition that the world might not have existed. However, this faces a significant hurdle. To claim the world is necessary is to claim that its nonexistence is impossible. But we can conceive of a world without concrete objects without contradiction. Unless one can demonstrate that existence is part of the essence of reality in the way that three angles are part of the essence of a triangle, the claim of necessity appears to be a brute assertion. It stops the regress of explanation by fiat rather than by insight.

  The second attempt posits a non-causal explanation based on value. This view suggests that the world exists because it is good that it exists. Here, the "reason" is not a prior cause but a final cause or an axiomatic truth: value necessitates existence. This avoids the temporal regress of causal chains. However, this approach assumes that normative facts can generate ontological facts. It requires the principle that "if it is good for $X$ to exist, $X$ tends to exist." Without a mechanism linking value to being, this remains a metaphor rather than an explanation. It explains why we might *prefer* something to nothing, but not why something *obtains*. Both attempts struggle because they try to fit the totality of existence into a framework designed for parts of existence. Yet, the failure of specific answers does not render the question defective; it merely indicates the answer, if there is one, lies beyond standard causal or modal categories.

  This leads to the coherence of "nothing." A major source of confusion is the conflation of an empty world with absolute nothingness. An empty world might contain space, time, and laws of physics, but no concrete objects. Absolute nothingness contains no objects, no space, no time, and no laws. PES often relies on the intuition that an empty world is a coherent alternative to the actual world. If an empty world is possible, then existence is contingent, and the question arises. However, if absolute nothingness is incoherent—if, for instance, logical truths or possibilities must exist—then "nothing" in the absolute sense is impossible.

  If absolute nothingness is impossible, the question "Why is there something rather than nothing?" transforms. It is no longer asking why reality exists instead of a void, but why concrete reality exists instead of merely abstract reality. This distinction is vital. If we distinguish between asking why there is *anything* at all and why there is *this* rather than *something else*, we see that PES conflates them. The question "Why this rather than that?" presupposes a domain of possibilities. The question "Why anything?" questions the domain itself. If the domain of possibilities is necessary (e.g., mathematical truths), then "nothing" is not a live option. In this case, the question is not defective, but its answer is that "nothing" was never a genuine alternative. The asymmetry returns: existence (at least of abstracta) is necessary; concrete existence is the variable. PES fails here because it treats the existence of the framework of reality as contingent, which is precisely what is in dispute.

  Furthermore, the demand for explanation is not arbitrary. We seek explanations when we encounter complexity or specificity. A universe containing complex structures is less probable, intuitively, than a void. This is not merely a psychological bias but a reflection of informational content. "Something" contains information; "nothing" contains none. To explain the presence of information is a valid intellectual demand. PES attempts to neutralize this by claiming symmetry, but information and lack of information are not symmetric. One requires a source; the other does not. Therefore, the demand for an explanation of existence is rooted in the positive content of reality, not a habit of thought.

  In conclusion, the verdict is that the cosmological question is genuine, and the Principle of Explanatory Symmetry is false. The question is not defective because it does not rely on incoherent terms, provided "nothing" is understood as the absence of concrete reality rather than an impossible absolute void. The criteria for a genuine question are met: there are conceivable answers, even if they are difficult to substantiate. PES fails because it incorrectly posits an ontological symmetry between being and non-being. Being is positive; non-being is privative. The critic is correct that PES discredits ordinary explanation if applied consistently, and the defender of PES cannot restrict the principle without abandoning its core claim of symmetry. The asymmetry of existence and nonexistence is real. Existence carries an ontological weight that nonexistence lacks, making the presence of reality the appropriate subject of inquiry. While current answers like necessity or value may be insufficient, the failure lies in the proposals, not the question. The mystery of why there is something rather than nothing remains a legitimate and profound problem for metaphysics, demanding an account of why positive reality obtains rather than assuming its parity with the void.
