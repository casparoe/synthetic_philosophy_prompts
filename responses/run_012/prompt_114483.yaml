  Based on your partner's track record, here is the analysis of her philosophical stance, her likely verdict on the torsion field, and how to test the limits of her position.

  ### 1. The Verdict on the Torsion Field
  Your partner will likely say that the **torsion field equations are real (or approximately true), but the torsion field itself (as a distinct physical substance or entity) is likely a fiction.**

  She will treat the torsion field exactly as she treats the **luminiferous ether**: the mathematical relations (Maxwell's equations) were preserved and are true, but the medium supposed to carry them (the ether) was discarded. Since the torsion equations are indispensable and have survived theoretical revolutions, she will grant them epistemic weight. However, since the entity cannot be isolated or manipulated, she will refuse to reify it as a "thing."

  ### 2. The Implicit Rule: Epistemic Structural Realism (ESR)
  The philosophical rule she is implicitly running is **Epistemic Structural Realism (ESR)**.

  *   **Why it fits:** ESR argues that while we cannot know the intrinsic *nature* of unobservable entities (ontology), we *can* know the *structure* of the world (mathematical relations) because that is what survives theory change.
  *   **Matching her verdicts:**
      *   **Newton/Maxwell:** She keeps the structure (equations/fields) but drops the ontology (absolute space/ether).
      *   **Phlogiston/Caloric:** She keeps the structural relations (balancing/thermodynamics) but drops the substances.
      *   **Quantum Mechanics:** She accepts the predictive structure but remains agnostic on the ontology (the "nature" of the wave function).
      *   **Torsion Field:** She will accept the structural equations but reject the entity.

  ### 3. The Competitor: Constructive Empiricism
  The rule that fits her earlier verdicts **equally well** is **Constructive Empiricism (CE)**.

  *   **Why it fits:** CE holds that science aims for *empirical adequacy* (saving the phenomena), not truth about unobservables. A constructive empiricist would also reject the ether, phlogiston, and torsion entities while "accepting" the theories that use them.
  *   **The Nuance:** The difference is subtle. A Constructive Empiricist *accepts* the theory as useful but suspends *belief* in its truth regarding the unobservable world. An Epistemic Structural Realist *believes* the mathematical structure itself corresponds to reality, even if the entities do not. Your partner's phrasing ("believes the equations") leans toward ESR, but her agnosticism ("agnostic about ontology") allows for CE.

  *(Note: **Entity Realism** fails because she accepts Maxwell's fields and Newton's equations, which are not "manipulable" in the strict sense required by entity realists like Ian Hacking. **Ontic Structural Realism** is too radical, as it denies entities exist at all, whereas she seems to allow for them but remains agnostic. **Selective Realism** is a strategy she uses, but ESR is the underlying justification for *how* she selects.)*

  ### 4. The Test Case to Tell Them Apart
  To distinguish **Epistemic Structural Realism** from **Constructive Empiricism**, you need a case involving **successful structural predictions about a permanently unobservable domain.**

  **The Case: The Interior of a Black Hole.**
  General Relativity provides precise equations describing the structure of spacetime inside a black hole's event horizon. However, no information can ever escape from there; it is fundamentally unobservable and unmanipulable.

  *   **Ask her:** "Do you believe the equations describing the singularity inside a black hole are *true* descriptions of reality, or merely *instruments* that allow us to predict what happens outside the horizon?"
  *   **If she is an Epistemic Structural Realist:** She will say the **structure is real**. She believes the mathematical relations hold even where we cannot look, because the structure has proven robust elsewhere.
  *   **If she is a Constructive Empiricist:** She will say she **has no belief** about the interior. She only accepts the theory insofar as it predicts observable phenomena outside the horizon. Believing the interior description is "true" goes beyond empirical adequacy.

  **Alternative Test Case (Entity vs. Structure): Quarks.**
  Quarks are confined and can never be isolated (manipulated) individually, yet their structural role in the Standard Model is indispensable.
  *   **Entity Realist:** "They aren't real; you can't spray a quark."
  *   **Structural Realist:** "The color-charge structure is real; the 'particle' nature is secondary."
  *   **Constructive Empiricist:** "The model works; I take no stance on their existence."

