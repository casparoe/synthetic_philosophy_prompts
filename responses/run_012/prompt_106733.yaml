answer: |-
  Here is the prep brief. I've broken this down into the strategic analysis of her position first, then the question set.

  ### Part 1: Strategic Analysis of Her Thesis

  **The Strongest Joint (Where she will be confident):**
  She is on solid ground regarding Keynes's intellectual biography. The Bloomsbury influence is undeniable; Keynes literally wrote about ethics before he wrote about economics. She can easily cite *My Early Beliefs* and Chapter 24 of *The General Theory* ("The social objective of skilled investment is to defeat dark forces of time and ignorance...") to prove he viewed economics as a means to a moral end. She will argue that the "technical" Keynes (multipliers, liquidity preference) was merely the engineering required to build the house where the "ethical" Keynes could live.

  **The Thinnest Joint (Where you apply pressure):**
  The mechanism of transition. Keynes assumes that once capital is abundant enough, the "love of money" will naturally atrophy as a behavioral motive. This is the weak link. It assumes a psychological shift that isn't guaranteed by material abundance.
  *   **The Trap:** If the "scaffolding" (capitalist incentives) is required indefinitely to maintain the structure, the "main event" (the ethical good life) never actually happens.
  *   **The Class Blindspot:** Her reading likely romanticizes the "good life" as a universal human potential, whereas Keynes's version relied heavily on a specific stratum of educated leisure. If the good life requires drudgery elsewhere, it's not a solution to the economic problem; it's just a relocation of it.

  ---

  ### Part 2: The Question Set (Escalating Intensity)

  **1. The Textual Anchor**
  Let's start in *The General Theory*, Chapter 24, where he says the "outstanding faults" of society are the failure to provide full employment and the "arbitrary and inequitable distribution of wealth." He frames these as moral failures, not just efficiency errors. But when he defines the remedy, he relies on the "propensity to consume" and "animal spirits."
  *   **Question:** Does he actually believe manipulating these psychological levers *changes* the moral character of the actors, or is he just harnessing their existing flaws to produce a moral outcome?
  *   **Likely Answer:** She'll say he's a pragmatist; he uses the flaws to build the bridge to the better world.
  *   **Follow-up:** If the bridge is made of the flaws, doesn't crossing it reinforce them? If I need "animal spirits" (irrational exuberance) to keep people employed today, haven't I trained the population to be *less* capable of the rational, contemplative life he promises tomorrow?

  **2. Scarcity and Character (Bullet 1)**
  You argue the economic problem is secondary to the ethical vision. But is scarcity bad for Keynes merely because it causes pain (instrumental), or does he make the stronger claim that the *pursuit* of money under scarcity actively rots the character?
  *   **Question:** Where does he distinguish between poverty as a material constraint versus money-getting as a moral disease?
  *   **Likely Answer:** She'll point to *Economic Possibilities for Our Grandchildren* and the "disgusting morbidity" of the love of money.
  *   **Follow-up:** If it's a moral disease, why is the cure dependent on the very engine that spreads the disease? He says we must endure avarice to get past avarice. Is that a coherent ethical position, or just a hope that the disease burns itself out?

  **3. The Tunnel of Avarice (Bullet 2)**
  This leads to the transition problem. He concedes we need avarice in the meantime to accumulate the capital that makes avarice unnecessary.
  *   **Question:** What becomes of the ethics if the "meantime" never ends? If capital accumulation requires perpetual growth, and perpetual growth requires perpetual desire, doesn't the "end of history" he promises become structurally impossible?
  *   **Likely Answer:** She'll argue he wasn't predicting an end to growth, but an end to the *necessity* of growth for survival.
  *   **Follow-up:** But without the *necessity*, what drives the accumulation? If he needs the *psychology* of accumulation to persist to keep the machine running, hasn't he conceded that the "good life" must be indefinitely postponed?

  **4. Two-Tier Morality (Bullet 2)**
  To keep that position together, does he need a two-tier morality? One set of rules for the transition period (where greed is a duty) and one for the promised land (where virtue is possible)?
  *   **Question:** Is there a textual basis for a transitional ethics in Keynes, or does he just assume the same people will somehow switch codes once the GDP hits a certain number?
  *   **Likely Answer:** She'll likely say he saw the "transition" as a generational shift, not an individual switch.
  *   **Follow-up:** That implies the current generation is sacrificed for the next. Is that consistent with the Bloomsbury emphasis on immediate states of mind and personal relations? Or is this actually a utilitarian calculus disguised as an ethical vision?

  **5. The Class Basis of Leisure (Bullet 3)**
  Let's look at the "good life" itself. He pictures art, conversation, and leisure. But in the 1930s, that leisure for the few relied on labor for the many.
  *   **Question:** Does his vision of the good life depend on a class of people *not* solving the economic problem, so that others can be free from it?
  *   **Likely Answer:** She'll defend him by saying he wanted leisure for *everyone*, that technology would do the drudgery.
  *   **Follow-up:** But his policy prescriptions focus on maintaining employment. If technology solves the drudgery, employment falls. If he prioritizes employment, he prioritizes the drudgery. Can you point to where he resolves the tension between "full employment" and "abolition of toil"?

  **6. Moorean States of Mind vs. Activity (Bullet 4)**
  Keynes was raised on G.E. Moore's *Principia Ethica*, which prioritizes certain "states of mind" (appreciation of beauty, love) as the sole good. But Keynes became a man of intense action and policy.
  *   **Question:** Does the Keynesian good life consist in the *quality* of these contemplative states, or does it shift toward "living well" as a practice of civic engagement and management?
  *   **Likely Answer:** She'll argue it's a synthesis; the economic security allows the Moorean states.
  *   **Follow-up:** But Moore valued the *contemplation*, not the *security*. If the "good life" is managing the economy to keep everyone employed, isn't that just glorified accountancy? Where does he say the *activity* of management is itself part of the good life, rather than just a burden to reach it?

  **7. Textual Evidence of "Practice" (Bullet 4)**
  I want to pin down that distinction. If the good life is contemplative, the economist should work themselves out of a job. If it's active, the economist is a permanent fixture.
  *   **Question:** In his later writings, does he treat the "skilled investment" he calls for as a temporary scaffolding or a permanent vocation for the virtuous?
  *   **Likely Answer:** She'll likely cite his view that investment should become a public duty, almost a civic ritual.
  *   **Follow-up:** If it's a civic ritual, then the "economic problem" isn't solved; it's just aestheticized. He's not ending the struggle for existence; he's turning it into a game. Does that undermine the claim that he's moving us *beyond* the economic struggle?

  **8. The Psychological Vacuum (Bullet 5)**
  You've argued he solves the material problem. But he also warns that when the economic problem is solved, we might be "deprived of our traditional purpose."
  *   **Question:** Does he think solving scarcity leaves people *worse* off psychologically because they lose the external pressure that gave life structure?
  *   **Likely Answer:** She'll say he acknowledges the danger but thinks education and culture will fill the void.
  *   **Follow-up:** That's a massive assumption. If the "void" is real, then the "love of money" wasn't just a means to an end, it was a psychological crutch. If he removes the crutch without proving the leg is strong, isn't his vision potentially dangerous?

  **9. Keynes's Own Life as Counter-Evidence (Bullet 5)**
  Keynes didn't wait for the future to live the good life; he worked himself to death while managing the system. He was a bursar, a negotiator, a editor, a speculator.
  *   **Question:** Is his own overwork evidence against his picture—that the "good life" is incompatible with the work required to build it—or is it just a personal inconsistency?
  *   **Likely Answer:** She'll argue he was a transitional figure, burdened by the necessity of his time.
  *   **Follow-up:** But he seemed to enjoy the burden. He thrived on the "dark forces." If the architect of the vision finds the "scaffolding" more fulfilling than the "building," why should we believe the building is actually the destination?

  **10. The Ultimate Stake**
  This brings us to the dependency of the ethics on the economics.
  *   **Question:** If the technical economics fails—if growth stalls permanently and we can't grow our way out of scarcity—does the ethical vision collapse with it?
  *   **Likely Answer:** She will want to say the ethics stand alone as a critique, regardless of the policy success.
  *   **Follow-up:** But if the ethics rely on the *promise* of abundance to justify the *tolerance* of avarice today, and the abundance never arrives, haven't we just validated the avarice for nothing? Is there any remaining normative force to Keynes's ethics if the multiplier stops working?

  ---

  ### Part 3: Host Notes

  *   **Pacing:** Questions 1-3 are setup. 4-7 are the grind (the class/structure tension). 8-10 are the existential close.
  *   **The "Trap":** She will try to retreat to "Keynes was a humanist, not a robot." Don't let her. Keep dragging it back to the *mechanism*. If the mechanism requires sin to produce virtue, the theology is broken.
  *   **Key Phrase to Listen For:** If she says "Keynes was optimistic," hit her with Q8 (the psychological vacuum). Optimism isn't an argument.
  *   **Concrete Check:** If she drifts into generalities about "caring for people," interrupt with "Where in the *General Theory*?" or "Which Bloomsbury memoir?" Keep her in the text.
