prompt: |-
  I teach a grad seminar that spends a few weeks on cause prioritisation, and I keep catching myself defending the importance / tractability / neglectedness framework -- you rank causes by how much is at stake, how much a marginal bit of work would buy, and how few people are already on it, and you treat the product as a rough ranking. My students take it as common sense. I've started to suspect its popularity is a symptom rather than a vindication. So play the part of someone trying to talk me out of it: what would actually count against the framework, sorted by how decisive each thing would be?

  I don't want the familiar line that neglect might itself be a warning sign, and I don't want a reading list -- I want the objections that bite even when the framework is read charitably, as a heuristic rather than a law. Three that I keep circling. (a) A colleague insists the three factors can't be independant, because a cause tends to stay neglected exactly when the people who look closely conclude it's intractable, so multiplying the three double-counts the same information. Is that right, and how badly does it break things? (b) Importance is the only term carrying any moral weight, and it's the term we can least quantify or compare across value theories and across different kinds of beings, so doesn't the multiplication manufacture a precision that makes a contested axiological judgement look like an engineering calculation? (c) Acting on the framework changes its own inputs: if neglect is a reason to enter, success dissolves the reason, and a criterion that erases itself on use seems like it ought to worry me. Is that a defect, or just what any competitive domain looks like?

  I'd also like to know whether the framework has quietly been qualified into unfalsifiability. When someone says the factors are just a way of estimating marginal value under uncertainty, have they given up any claim that could turn out wrong -- and if so, is that a problem for a tool like this, or the honest way to hold it? Which of the objections should a defender concede rather than deflect? I'd rather know what I'm giving up than be told the framework survives intact. And I'd like a verdict on whether the framework even has a determinate output, given that a cause isn't a natural kind and two people can agree on all the numbers and still carve the space differently. If you can produce a case where the framework and a straight marginal cost-effectiveness calculation come apart, use it -- that's the sort of thing that moves me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A graduate seminar instructor teaching cause prioritization (likely in philosophy, public policy, or effective altruism-adjacent fields).
      *   **Context:** They teach the ITN (Importance, Tractability, Neglectedness) framework. They suspect its popularity is a symptom, not vindication. They want to be talked *out* of it (or at least have its weaknesses rigorously exposed).
      *   **Constraints:**
          *   No "neglect is a warning sign" (the "low hanging fruit" objection).
          *   No reading lists.
          *   Focus on objections that bite even under a *charitable* reading (as a heuristic).
          *   Address three specific circulating objections (a, b, c).
          *   Address the "unfalsifiability" concern.
          *   Address which objections a defender should concede.
          *   Address the "determinate output" problem (carving the cause space).
          *   Provide a case where ITN diverges from straight marginal cost-effectiveness (MCE).
      *   **Tone:** Intellectual, rigorous, critical but fair, philosophical but practical. Avoid EA jargon where possible or explain it clearly.

  2.  **Deconstruct the Three Specific Objections:**

      *   **(a) Dependence/Double-Counting:** The colleague argues Neglectedness and Tractability are correlated (neglected because intractable).
          *   *Analysis:* They aren't perfectly correlated, but they are causally linked. If a cause is neglected *because* it's hard, multiplying them penalizes it twice. However, ITN is usually $V = I \times T \times N$. If $N$ is high (neglected) and $T$ is low (intractable), the product is low. The objection is that $N$ is high *because* $T$ is low. So $N$ isn't independent information.
          *   *Verdict:* It doesn't break the math (multiplication handles correlation okay if interpreted as marginal returns), but it breaks the *epistemic independence*. It makes the heuristic misleading if users treat them as separate signals.
      *   **(b) Moral Weight/Precision:** Importance ($I$) carries the value, but is least quantifiable. Multiplying by $T$ and $N$ makes it look like engineering.
          *   *Analysis:* This is the "false precision" critique. $I$ involves comparing apples (human welfare) to oranges (animal welfare) to stones (existential risk). $T$ and $N$ look empirical. The product suggests a cardinal utility that doesn't exist.
          *   *Verdict:* Strong objection. It masks axiological disagreement as empirical uncertainty.
      *   **(c) Self-Erasing/Reflexivity:** Success reduces Neglectedness.
          *   *Analysis:* This is dynamic inconsistency. ITN is a static snapshot. If everyone uses ITN, they flood the cause, $N$ drops, and they should leave.
          *   *Verdict:* Not a defect, it's a feature of markets. But it makes ITN bad for *long-term* commitment. It encourages hopping.

  3.  **Address the "Unfalsifiability" Concern:**
      *   If ITN is just "estimate marginal value," can it be wrong?
      *   If $T$ and $N$ are just proxies for marginal returns, then ITN is a tautology: "Do what has high marginal returns."
      *   *Risk:* If it's a tautology, it's not a *framework*, it's a definition. It loses predictive power.
      *   *Honest Holding:* It should be held as a decomposition of marginal value, not a separate metric.

  4.  **Address the "Determinate Output" / Cause Carving Problem:**
      *   Causes aren't natural kinds. Is "AI Safety" one cause or ten? Is "Global Health" one cause or malaria + TB + health systems?
      *   If I carve "AI Safety" narrowly, $N$ is high. If I carve "Tech Safety" broadly, $N$ is low.
      *   *Result:* ITN output depends on the granularity of the category, not just the underlying reality. This is a major structural flaw.

  5.  **Develop the Divergence Case (ITN vs. Marginal Cost-Effectiveness):**
      *   Need a scenario where ITN says "Go" but MCE says "Stop" (or vice versa).
      *   *Scenario:* A cause is Important, Neglected, and Tractable *on the margin*, BUT the existing interventions are harmful or the baseline is shifting.
      *   *Better Scenario:* The "Room for Funding" problem. A cause is ITN-positive, but the specific organization can't absorb cash effectively.
      *   *Best Scenario:* **The "Crowding" or "Coordination" Case.**
          *   Cause: Malaria Nets.
          *   ITN: High Importance, High Tractability, Low Neglectedness (now). ITN says "Low Priority."
          *   MCE: Still highly cost-effective per dollar compared to other things.
          *   *Wait, I need ITN to say YES and MCE to say NO.*
          *   *Try:* A speculative geoengineering project.
          *   $I$: Huge (climate).
          *   $N$: High (few doing it).
          *   $T$: Moderate (we can build it).
          *   ITN Score: High.
          *   MCE: Negative. Why? Because unilateral deployment risks war or side effects that outweigh benefits. The *marginal* value is negative due to externalities not captured in $T$ (which usually measures technical feasibility, not social safety).
          *   *Refinement:* Tractability often measures "can we solve it?" not "should we solve it this way?"
          *   *Alternative:* **The "Diminishing Returns Cliff."**
          *   Cause: Disaster Relief for a specific earthquake.
          *   $I$: High (lives).
          *   $N$: High (nobody there yet).
          *   $T$: High (we can fly planes).
          *   ITN: Go!
          *   MCE: Wait. If we send too much too fast, logistics clog. The *marginal* dollar might burn. ITN looks at the *cause area*, MCE looks at the *specific intervention capacity*. ITN aggregates too broadly.

  6.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the instructor's intuition. Validate that ITN is a heuristic, not a law.
      *   **Section 1: The Three Objections (a, b, c).** Analyze each. Determine severity.
      *   **Section 2: Unfalsifiability.** Discuss the tautology risk.
      *   **Section 3: The Cause Carving Problem.** This is the "determinate output" issue.
      *   **Section 4: The Divergence Case.** ITN vs. MCE.
      *   **Section 5: What to Concede.** A summary of where the framework yields.
      *   **Conclusion:** A verdict on how to teach it (as a checklist, not a calculator).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining Objection (a):* It's not double counting mathematically, it's epistemic redundancy. If $N$ is high *because* $T$ is low, $N$ adds no new info. But usually, $N$ is high because of *coordination failures* or *visibility*, not just hardness. So it's not a fatal break, but it warns against treating $N$ as a independent signal of value.
      *   *Refining Objection (b):* This is the strongest philosophical objection. It hides the "moral weight" inside $I$ but lets $T$ and $N$ do the heavy lifting of differentiation. It creates "spurious precision."
      *   *Refining Objection (c):* This is the "alpha decay" problem. It's not a defect of the tool, but a defect of using it for *career* planning without dynamics.
      *   *Unfalsifiability:* If you say "ITN is just a way to estimate marginal value," you've reduced it to "Do good." That's unfalsifiable. To be falsifiable, ITN must make claims about *which proxies* work.
      *   *Cause Carving:* This is crucial. "Mental Health" vs "Depression Research." The numbers change based on the label. This makes the output indeterminate.
      *   *Divergence:* Use the "Logistics Bottleneck" example. ITN sees a neglected crisis. MCE sees a saturated pipeline.

  8.  **Final Review against Constraints:**
      *   Did I avoid "neglect is a warning sign"? Yes.
      *   Did I avoid reading lists? Yes.
      *   Did I address a, b, c? Yes.
      *   Did I address unfalsifiability? Yes.
      *   Did I address cause carving? Yes.
      *   Did I provide a divergence case? Yes.
      *   Tone check: Respectful, academic, critical.

  9.  **Final Polish:** Ensure the distinction between "marginal value" and "ITN product" is clear. Emphasize that ITN is a *decomposition* that often fails to reassemble correctly. (Self-Correction: Make sure to explicitly state which objections should be conceded).

  **(Self-Correction during drafting):** I need to be careful with the "double counting" objection. Mathematically, $V = I \times T \times N$. If $N = f(T)$, then $V = I \times T \times f(T)$. It's not double counting, it's functional dependence. The colleague's worry is that users treat them as independent evidence. I should clarify that distinction.

  Also, for the divergence case, I need to make sure it's clear why ITN fails. ITN aggregates at the *cause level*. MCE operates at the *intervention level*. The gap between cause and intervention is where ITN loses fidelity.

  Let's write.
answer: |-
  You are right to be suspicious. The ITN (Importance, Tractability, Neglectedness) framework has achieved the status of a "folk theorem" in effective altruism and policy circles: it is repeated often enough that its assumptions have hardened into intuitions. But as a formal tool for prioritization, it has structural cracks that become visible under graduate-level scrutiny.

  Here is the case against ITN, sorted by the severity of the damage each objection inflicts, addressing your specific circulating doubts and the deeper structural issues.

  ### 1. The Three Circulating Objections

  **(a) The Dependence Objection (Severity: Moderate)**
  Your colleague argues that Neglectedness and Tractability are not independent, so multiplying them double-counts.
  *   **The Verdict:** This is a category error regarding the math, but a valid critique of the *epistemology*.
  *   **Why it doesn't break the math:** The framework does not require statistical independence. If a cause is neglected *because* it is intractable, then $N$ is high and $T$ is low. The product $T \times N$ remains low. The math handles correlation fine.
  *   **Why it breaks the heuristic:** The framework is taught as three *separate* lenses to gather evidence. If $N$ is largely a function of $T$ (or of social visibility), then treating $N$ as an independent signal of opportunity leads to overconfidence. You might see a neglected cause and think "opportunity," when the market has already correctly priced it as "hard."
  *   **Concession:** A defender must concede that Neglectedness is not a *positive* signal on its own; it is only a signal when decoupled from Tractability. If you cannot explain *why* it is neglected (other than "it's hard"), the $N$ term should be discounted to near zero.

  **(b) The False Precision Objection (Severity: High)**
  You note that Importance ($I$) carries the moral weight but is the least quantifiable, while $T$ and $N$ look empirical. Multiplying them manufactures engineering precision out of axiological uncertainty.
  *   **The Verdict:** This is the most damaging philosophical objection.
  *   **The Mechanism:** $I$ requires comparing incomparables (e.g., existential risk vs. global poverty). $T$ and $N$ are often estimated using headcounts or funding levels, which look like hard data. When you compute $I \times T \times N$, the uncertainty in $I$ (which could span orders of magnitude depending on your moral theory) swamps the "precision" of $T$ and $N$. Yet, the output *looks* like a calculated score.
  *   **The Harm:** This allows practitioners to hide moral disagreements behind empirical disputes. Two people who disagree on the moral weight of future beings can argue about "tractability estimates" instead of admitting they have different value systems. It smuggles normative claims into descriptive variables.
  *   **Concession:** A defender must concede that ITN cannot resolve disagreements about $I$. It is not a decision procedure; it is a way to organize uncertainty. If $I$ is uncertain by a factor of 1000, the product is useless for ranking, regardless of how precise your $T$ and $N$ estimates are.

  **(c) The Reflexivity Objection (Severity: Low)**
  Acting on the framework dissolves the Neglectedness term. A criterion that erases itself on use seems defective.
  *   **The Verdict:** This is not a defect of the framework, but a feature of competitive markets.
  *   **The Mechanism:** This is simply alpha decay. If a cause is high-value because it is neglected, capital flows in, neglect drops, and marginal value drops.
  *   **The Harm:** The harm is only if you treat ITN as a static guide for *long-term* career planning. It is a snapshot for *marginal* resource allocation.
  *   **Concession:** A defender should concede that ITN is bad for identifying *stable* career paths. It identifies *opportunities*, not *institutions*. Using it to pick a 10-year career path is a category mismatch; it is designed for 1-year funding cycles.

  ### 2. The Unfalsifiability Trap

  You ask whether qualifying ITN as "just a way of estimating marginal value" renders it unfalsifiable.
  *   **The Verdict:** Yes, it does. And that is a problem.
  *   **The Tautology:** If ITN is defined as "a decomposition of marginal value," then saying "we should follow ITN" is identical to saying "we should maximize marginal value." This is tautological. It cannot be wrong.
  *   **The Loss:** To be useful, a framework must make claims that could be false. ITN makes a specific empirical claim: *that marginal value is well-approximated by the product of these three specific proxies.*
  *   **The Failure Mode:** There are scenarios where marginal value is high, but ITN scores low (or vice versa). If defenders retreat to "well, it's just a heuristic for marginal value" whenever ITN fails to match marginal value, they have insulated the framework from criticism by stripping it of content.
  *   **Honest Holding:** The honest way to hold ITN is as a **checklist for blind spots**, not a calculator. It forces you to ask: "Have I considered how many others are working on this?" It is not a formula for generating a number.

  ### 3. The Cause Carving Problem (Indeterminate Output)

  You asked if the framework has a determinate output given that "a cause isn't a natural kind."
  *   **The Verdict:** This is a fatal structural flaw for any quantitative application of ITN.
  *   **The Mechanism:** ITN scores depend entirely on the granularity of the category.
      *   *Example:* "Global Health."
          *   $I$: High.
          *   $N$: Low (billions spent).
          *   $T$: Moderate.
          *   *Result:* Low priority.
      *   *Example:* "Neglected Tropical Diseases in Region X."
          *   $I$: Moderate.
          *   $N$: High (very few specialists).
          *   $T$: High (known interventions).
          *   *Result:* High priority.
  *   **The Problem:** These are the same underlying reality, carved at different resolutions. Two people can agree on all the facts but disagree on the ITN ranking simply because one categorized the cause broadly and the other narrowly. There is no "correct" level of abstraction in the framework itself to adjudicate this.
  *   **Concession:** A defender must concede that ITN cannot compare cause *areas* against each other, only specific *interventions* within a fixed framing. But once you are at the intervention level, you are doing cost-effectiveness analysis, not ITN.

  ### 4. The Divergence Case: ITN vs. Marginal Cost-Effectiveness

  You requested a case where ITN and straight marginal cost-effectiveness (MCE) come apart. This is the strongest argument for abandoning ITN as a ranking tool.

  **The Case: The Logistics Bottleneck**
  *   **Context:** A sudden natural disaster in a remote region.
  *   **ITN Analysis:**
      *   **Importance:** Extreme (lives at stake).
      *   **Neglectedness:** High (no aid agencies have arrived yet).
      *   **Tractability:** High (we have planes and food).
      *   **ITN Verdict:** **Maximum Priority.** Deploy immediately.
  *   **Marginal Cost-Effectiveness Analysis:**
      *   **Context:** The local airport has a single runway and limited fuel storage.
      *   **Analysis:** The first 10 planes save hundreds of lives. The next 50 planes clog the runway, prevent fuel unloading, and cause crashes. The *marginal* dollar spent on the 50th plane has negative value (it destroys capacity).
      *   **MCE Verdict:** **Stop.** The marginal value of additional resources is zero or negative, despite the cause remaining Important, Neglected (in terms of total need), and Tractable (technically).
  *   **Why ITN Fails:** ITN aggregates at the *cause level*. It sees "Disaster Relief" as a bucket. MCE operates at the *absorption capacity level*. ITN encourages flooding the cause; MCE recognizes the bottleneck.
  *   **Implication:** ITN systematically overestimates the value of scaling in domains with coordination constraints or diminishing returns cliffs.

  ### 5. Summary: What to Concede

  If you want to teach this honestly, here is the concession map:

  1.  **Concede that $I$ dominates.** If students leave thinking $T$ and $N$ can outweigh $I$, they have misunderstood. $I$ is the engine; $T$ and $N$ are the transmission. If the engine is off (low importance), the car doesn't move, regardless of the gears.
  2.  **Concede the "Cause Carving" vulnerability.** Admit that ITN rankings are sensitive to how you define the problem. It is not objective.
  3.  **Concede that it is not a decision procedure.** It is a **discussion framework**. Its value is in forcing a team to articulate *why* they think a cause is tractable, not in producing a score that ranks Cause A above Cause B.
  4.  **Concede the Divergence.** Acknowledge that in capacity-constrained environments (which most real-world problems are), ITN is inferior to direct marginal cost-effectiveness analysis.

  ### The Verdict

  The ITN framework survives only if you demote it.

  It is not a **ranking algorithm**. It is a **mnemonic device** to prevent three specific cognitive errors:
  1.  Working on small problems (forgetting Importance).
  2.  Working on solved problems (forgetting Neglectedness).
  3.  Working on impossible problems (forgetting Tractability).

  If you teach it as a calculator that outputs a priority ranking, it is falsified by the "Cause Carving" problem and the "Logistics Bottleneck" case. If you teach it as a checklist to ensure you haven't ignored a variable, it survives, but it ceases to be the "common sense" engine of cause prioritization your students think it is. It becomes merely a table of contents for the actual work, which is marginal cost-effectiveness analysis under moral uncertainty.

  **Recommendation:** In your seminar, present ITN, then immediately run the "Cause Carving" exercise (have them score "Climate Change" vs. "Methane Capture in Permafrost") and the "Logistics Bottleneck" case. Show them that the framework breaks when touched. That will teach them more about prioritization than defending the heuristic ever could.
