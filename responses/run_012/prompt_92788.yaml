answer: |-
  Here is a teaching plan designed for a 50-minute session. It is structured as a sequence of moves for the whiteboard, with explicit dependencies and timing.

  ### 1. Order: Sequence of Ideas and Dependencies

  Do not start with the paradox. Start with the rules of the game. The paradox only exists if the audience accepts three specific premises. You must build these premises one by one.

  **Move 1: Pin Down "Evidential Support" (0–10 mins)**
  *   **Action:** Write "EVIDENTIAL SUPPORT" on the board. Ask the group: "If I say observation $E$ supports hypothesis $H$, do I mean $E$ proves $H$?"
  *   **Consensus:** No. It means $E$ gives us *some reason* to believe $H$, or makes $H$ more credible than it was before.
  *   **Dependency:** This must be established *before* you introduce Nicod's Criterion. If you do not define support here, the audience will treat Nicod's Criterion as the *definition* of support, which makes the paradox impossible (because then the white shoe *by definition* supports the raven claim). You need support to be an intuitive notion that Nicod's Criterion attempts to capture.
  *   **Whiteboard:**
      *   Support $\neq$ Proof.
      *   Support = "Increases credibility" / "Good reason to believe."

  **Move 2: Introduce Nicod's Criterion (The Instance Principle) (10–20 mins)**
  *   **Action:** Introduce the rule that seems to govern scientific induction.
  *   **Statement:** "A generalization of the form 'All $R$ are $B$' is supported by observing an object that is both $R$ and $B$."
  *   **Dependency:** This relies on Move 1. We are claiming this is *how* we usually get "Support."
  *   **Whiteboard:**
      *   Hypothesis: All $R$ are $B$.
      *   Support comes from: Finding an $R$ that is $B$.

  **Move 3: Introduce Logical Equivalence (The Switch) (20–30 mins)**
  *   **Action:** Introduce the contrapositive. Do not use symbols; use English sentences.
  *   **Statement:** "The statement 'All $R$ are $B$' means exactly the same thing as 'All non-$B$ are non-$R$'."
  *   **Crucial Check:** Ask the audience if these two sentences can have different truth values. (They cannot).
  *   **Dependency:** This relies on Move 2. We need to know that the Hypothesis can be stated in two ways.
  *   **Whiteboard:**
      *   Statement 1: All $R$ are $B$.
      *   Statement 2: All non-$B$ are non-$R$.
      *   Rule: If evidence supports Statement 1, it must support Statement 2 (because they are the *same* hypothesis).

  **Move 4: The Collision (The Paradox) (30–40 mins)**
  *   **Action:** Apply Nicod's Criterion (Move 2) to Statement 2 (Move 3).
  *   **Logic:**
      1.  Support comes from positive instances (Move 2).
      2.  A non-$B$ non-$R$ is a positive instance of "All non-$B$ are non-$R$".
      3.  Therefore, a non-$B$ non-$R$ supports "All $R$ are $B$".
  *   **Result:** The intuitive clash. The audience feels the support *shouldn't* be there, but the logic says it *must* be.

  **Move 5: Resolution via the Pivot (40–50 mins)**
  *   **Action:** Use your requested pivot (Selective Support vs. Failing to Count Against) to dissolve the tension. (See Section 4 below).

  ---

  ### 2. Carrying Example: The Snail Hypothesis

  **Verdict:** Your snail example **will work**, but it requires careful framing to avoid biological "cheating."

  **The Setup:**
  *   **Hypothesis:** "All species in Genus *X* are sinistral (left-coiled)."
  *   **Positive Instance:** A sinistral shell of Genus *X*.
  *   **Contrapositive:** "All non-sinistral (right-coiled) shells belong to genera other than *X*."
  *   **Paradoxical Instance:** A right-coiled shell of Genus *Y*.

  **Why it risks failure:**
  In biology, we know coiling is often phylogenetically constrained. An audience of scientists might say, "Of course a Genus *Y* shell doesn't tell me about Genus *X*; they are evolutionarily distinct." This bypasses the logical puzzle by appealing to background knowledge. The Raven Paradox works best when the classes feel arbitrary.

  **How to make it carry the lesson:**
  You must strip the biological necessity. Frame it as a sampling problem, not a phylogenetic one.
  *   **Modification:** Do not say "All species in Genus *X*." Say: "All shells in **this specific collection tray** are sinistral."
  *   **Non-Instance:** A right-coiled shell in the **discard bin** (which is not in the tray).
  *   **Why this is better:** It removes the "evolutionary distinctness" objection. A shell in the discard bin is logically a "non-tray shell." It is a non-sinistral non-tray-shell. It confirms "All tray-shells are sinistral."
  *   **Requirement:** The example must have a **large, trivial background class**. The "discard bin" or "other genera" must be vast compared to the target class.
  *   **Requirement:** The property must be **binary and observable**. Sinistral/Dextral is perfect.
  *   **What it must lack:** It must lack *causal connection*. The audience must not feel that examining a Genus *Y* shell *could* physically change Genus *X*.

  **Recommendation:** Use the **Tray vs. Discard** version of your snail example. It keeps your domain expertise but removes the phylogenetic baggage that allows the audience to escape the logic too easily.

  ---

  ### 3. Misconceptions: Map and Defusal

  Here are the misconceptions in the order they will arise, and where to stop them.

  **Misconception 1: "Support means Proof."**
  *   **When:** Move 1.
  *   **Source:** Everyday language.
  *   **Defusal:** Explicitly write "Support $\neq$ Verification." Tell them: "We are talking about a nudge in credibility, not a lock on the door."

  **Misconception 2: "The Contrapositive changes the meaning."**
  *   **When:** Move 3.
  *   **Source:** Pragmatics. In conversation, "All ravens are black" is about ravens; "All non-black things are non-ravens" is about everything else.
  *   **Defusal:** Insist on **Truth Conditions**. Ask: "Is there any possible world where one is true and the other false?" If no, they are the same hypothesis for the purpose of logic.

  **Misconception 3: "It supports it a little" vs. "It supports it not at all." (Your specific worry)**
  *   **When:** Move 5 (Resolution).
  *   **Source:** You are running together **Probabilistic Confirmation** (Bayesian) and **Qualitative Instance** (Hempel).
      *   *Sense A (Bayesian):* Finding a non-black non-raven eliminates one potential falsifier from the universe. Technically, the probability of the hypothesis goes up by a microscopic amount. (This is "supports a little").
      *   *Sense B (Instance):* We expect evidence to be *about* the subject matter. A shoe is not *about* ravens. (This is "supports not at all").
  *   **Defusal:** Do not choose one. Acknowledge both. Tell the audience: "Mathematically, the credibility rises (Sense A). Intuitively, the relevance is zero (Sense B). The paradox is the shock of realizing Sense A is true even when Sense B feels false."
  *   **Whiteboard:**
      *   Sense A: Probability boost (Yes, it happens).
      *   Sense B: Topical Relevance (No, it lacks this).
      *   The Paradox: We expect B when we get A.

  ---

  ### 4. The Pivot: Selective Support vs. Failing to Count Against

  You requested the lesson rest on the difference between evidence that **selectively supports** a hypothesis and evidence that **merely fails to count against it**.

  **Where to place it:**
  This belongs in **Move 5 (Resolution)**. Do not introduce it earlier, or it will confuse the setup of the paradox.

  **How to execute it:**
  1.  **Define the terms:**
      *   *Selective Support:* Evidence makes Hypothesis $H$ more likely than its competitor $\text{not-}H$.
      *   *Failing to Count Against:* Evidence is consistent with $H$, but also consistent with $\text{not-}H$.
  2.  **Apply to the Snail/Tray:**
      *   Finding a sinistral shell in the tray *selectively supports* "All tray shells are sinistral" (because a dextral shell would have falsified it).
      *   Finding a dextral shell in the *discard bin* merely *fails to count against* the hypothesis. It is consistent with the hypothesis, but it does not make the hypothesis more likely than the alternative ("There is a dextral shell in the tray").
  3.  **The Verdict:**
      *   Tell the audience: "Hempel's logic shows the discard-bin shell satisfies the *condition* of an instance. But our intuition demands *selective support*. The paradox arises because we treat 'satisfying the condition' as identical to 'providing selective support.' They are not."

  **Regarding the "Irrelevant Additional Claim" worry:**
  *   *The Worry:* If evidence $E$ supports $H$, does it also support "$H$ and [Irrelevant Claim $Z$]"? (The Tacking Paradox).
  *   **Advice:** **Do not raise this.**
  *   **Reason:** This is a distinct paradox (the Conjunction Paradox). Introducing it in a 50-minute session for non-logicians will fracture the group's focus. It dilutes the specific tension of the Raven Paradox. Stick to the Equivalence Condition (Raven vs. Contrapositive) as the sole source of tension.

  ---

  ### 5. Check for Understanding

  Do not ask "Did you understand?" Ask them to apply the structure.

  **The Question:**
  > "If I propose the hypothesis 'All coins in my pocket are quarters,' and I pull a dime out of my *wallet*, have I supported the hypothesis? According to the logic we just traced, the answer is Yes. According to your intuition, the answer is No. **Which of the three steps we wrote on the board (Nicod's Criterion, Logical Equivalence, or the Definition of Support) would you reject to make the answer 'No', and what is the cost of rejecting it?**"

  **Why this works:**
  *   It forces them to reconstruct the argument.
  *   It tests if they see it as a logic puzzle (choosing a premise to reject) rather than trivia (guessing the right answer).
  *   It reveals if they distrust science (if they say "Induction is broken") versus understand the problem (if they say "Nicod's Criterion is too broad").

  ---

  ### 6. What to Leave Out

  You have 50 minutes. You must openly refuse to cover the following. State this at the beginning so you are not interrupted.

  1.  **Bayesian Mathematics:** Do not write formulas. Do not calculate the probability shift. Speak of it only qualitatively ("microscopic boost").
  2.  **Goodman's "Grue":** This is a different paradox about projectability. It will confuse the issue of logical equivalence.
  3.  **The Tacking/Conjunction Paradox:** As noted in Section 4, do not discuss whether evidence supports "$H$ and $Z$."
  4.  **Quine's "Natural Kinds":** Do not dive into the metaphysics of why "Raven" is a natural kind and "Non-Black" is not. This is a deep solution, but it requires too much setup for beginners.
  5.  **History of Logical Positivism:** Do not discuss the Vienna Circle or Hempel's biography. It is irrelevant to the logic.

  **Whiteboard Summary Plan:**
  1.  **Support** $\neq$ Proof.
  2.  **Nicod:** Instances confirm.
  3.  **Equivalence:** $H$ = Contrapositive $H$.
  4.  **Conflict:** Irrelevant instances confirm $H$.
  5.  **Resolution:** Instance $\neq$ Selective Support.
