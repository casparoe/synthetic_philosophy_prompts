          4.  *The Pivot:* Focus on selective support vs. failing to count against (and the tacking paradox issue). Decide if/when to raise it.
          5.  *Check for Understanding:* One final question to test if it landed as a logic puzzle, not trivia/skepticism.
          6.  *What to Leave Out:* Explicitly state what to exclude.
      *   **Tone:** Instructional, sequence of teaching moves, not an essay.

  2.  **Deconstruct the Requirements & Draft Content:**

