          *   Instance of Contrapositive: A Dextral (right-coiled) *Helix*.
          *   *Problem:* Is a *Helix* a "Non-Sinistral thing"? Yes. Is it a "Non-*Amastra*"? Yes.
          *   *Risk:* Biologists might think "Well, obviously *Helix* isn't *Amastra*, that's taxonomy, not induction." The Raven Paradox works because "Non-Black" is a property, not a taxonomy.
          *   *Fix:* Make the property morphological. "All shells in this tray are Sinistral." Non-instance: A right-coiled shell in the *other* tray.
          *   *Better Fix:* Stick to the User's idea but clarify the classes. "All members of Genus *X* are Sinistral." A right-coiled shell of Genus *Y* is a Non-Sinistral Non-*X*. It works logically. The intuition gap is the key.

      *   *Refining the "Support" Distinction (User's specific worry):*
