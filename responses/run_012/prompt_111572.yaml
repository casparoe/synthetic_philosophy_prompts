answer: |-
  **Ask the Impartial Adviser**

  **Dear Adviser,**
  Last week I slipped into the Regents Canal. My husband jumped in and hauled me out. When I thanked him, he said he was merely acting on the principle that one should save drowning persons, regardless of identity. He added he'd have done the same for a stranger. I feel chilled. Is our marriage dead?
  *— Distraught in N1*

  **Dear Distraught,**
  Your husband performed the correct action, but his moral administration is dangerously lax. The error lies not in his impartiality, but in his lack of pre-authorisation. A morally rigorous agent does not wait for the crisis to formulate the universal maxim. He should have had the justification ready, preferably notarised, before you approached the water's edge.

  You complain he had a thought he didn't need. Nonsense. He had too few thoughts. He should have considered the counterfactual: would he save a stranger? If the answer is yes, the rescue is moral. If no, it is mere nepotism. His failure was assuming you deserved priority without calculating the global utility of your survival versus a random passer-by. That you are his wife is irrelevant data. To feel otherwise is to indulge in sentimental particularity, which is the root of all ethical corruption. A good husband does not save you because he loves you; he saves you because the calculus demands it, and he should be able to produce the sums upon request. Spontaneity is the enemy of virtue. If he cannot demonstrate, via a signed affidavit, that he would have sacrificed you for a greater good, his loyalty is merely biological.

  To rectify this, I prescribe a Fortnight of Randomised Care. For fourteen days, you must draw lots each morning to determine who receives your husband's attentions: you, a neighbour, or a verified stranger. This will test his claim empirically. If he balks at caring for a stranger with the same vigour as you, he admits his rescue was biased. Do not worry if intimacy suffers; intimacy is merely a heuristic for efficiency. Once he can comfort a stranger as readily as you, trust will be restored on a firmer, universal foundation. I suggest beginning with brushing teeth. It is intimate enough to test bias, mundane enough to avoid excess passion. Should he refuse, file a Form 12-B with your local ethics committee.

  **Quick-fire**
  **Q:** Can I buy my mother a birthday gift?
  **A:** Only if a stranger would benefit more from the funds. Otherwise, donate it.
  **Q:** Is grieving my father selfish?
  **A:** Grief is resources spent on the dead. Calculate the utility of tears.
  **Q:** My child is sick. Should I stay home?
  **A:** Only if your labour produces more value at home than at work.
  **Q:** May I favour my own happiness?
  **A:** You are one unit among millions. Prioritise yourself only by lottery.

  **Sidebar: The Three Thoughts You're Allowed To Have**
  1. Does this action maximise general welfare?
  2. Would I do this for anyone?
  3. Am I counting myself as one among many?
