answer: |-
  Hi there, it sounds like a great group to work with, and seventy-five minutes is enough time to get the paradox sharp without getting bogged down in the literature, so here is how I would structure the session to make sure the tension lands properly. You need to build the argument in four distinct steps, and the order matters because if you introduce the normative claim too early, they will reject it based on intuition before they see why the epistemology forces it on them. Start by securing the closure principle, since they have done enough epistemology to know the term but might not have it ready to hand, so ask them whether knowing P and knowing that P implies Q entails knowing Q, and get them to agree that for everyday knowledge this holds. Once closure is on the board, move to factivity, which is easier, establishing that if you know P then P is true. The third step is the bridge that often gets skipped, which is that if P is true, then any evidence suggesting not-P is misleading evidence. You need them to agree that misleading evidence is just evidence for a falsehood, so if P is true, evidence against it is necessarily misleading. Now you can combine these to show that if I know P, I can deduce that any evidence against P is misleading, which leads to the fourth and final step, the normative claim that if I know evidence is misleading, I am entitled to ignore it. If you present it in this order, the conclusion that knowledge entails the permission to ignore counter-evidence feels like a logical consequence rather than just a weird claim, which is where you want them to be when the discomfort sets in.

  For the central example, your instinct about the flat-earth or climate-denial cases is correct, and you should avoid them, because those cases invite the students to dispute whether the protagonist actually knows P in the first place. If the group thinks the proposition is false or controversial, they will dissolve the paradox by saying she didn't know, and you will spend the whole session arguing about climate science instead of epistemology. You need a case where the knowledge is boring and uncontroversial so they cannot wiggle out by denying the knowledge claim, so I recommend using a mundane scheduling case where the protagonist checked an official source. Suppose Sarah knows her meeting is at 2 PM because she read the official email invitation this morning, and then a colleague tells her the meeting was moved to 3 PM. In this scenario, stipulate that the email was correct and the colleague is mistaken, so Sarah really does know and the evidence really is misleading. This blocks the move that she didn't know, because checking an official email is paradigmatic knowledge, and it blocks the move that the evidence wasn't misleading, because we stipulated the meeting is indeed at 2 PM. This forces them to confront the question of whether Sarah is epistemically entitled to wave away her colleague's testimony simply because she checked the email, which is the heart of the dogmatism worry.

  Regarding misconceptions, you are right to anticipate the confirmation bias objection, but I suspect the harder one to head off is the claim that knowledge requires you to rule out defeaters before you can claim to know. Students often think that if you have counter-evidence, you automatically lose knowledge, so they will say Sarah no longer knows once the colleague speaks. You need to head this off right after you state the paradox, by clarifying that the paradox is about whether she was entitled to ignore the evidence before she investigated it, not whether she retains knowledge after ignoring it. If they say she must investigate to keep knowing, ask them whether she needed to investigate before the colleague spoke, since she already knew. The confirmation bias point is easier to handle by distinguishing psychological tendency from epistemic permission; the paradox isn't saying she will ignore evidence, but that she is justified in doing so, which is a normative claim about rationality rather than a descriptive claim about psychology. You should also watch out for the pragmatic objection that ignoring evidence is risky, and remind them that the paradox is about epistemic entitlement, not practical prudence, so even if it is risky, the question is whether her knowledge makes her epistemically safe in ignoring it.

  There are several things you should leave out to keep this within seventy-five minutes and suitable for their level, and you should say this out loud so they know you are bracketing it for sake of time. Do not get into the specific historical attributions between Harman and Kripke, as that adds baggage without clarifying the logic. Do not introduce formal notation for the closure principle, as it will slow down the flow and they can grasp the concept verbally. Most importantly, leave out the detailed solutions involving tracking theories or contextualism, because if you introduce Nozick or DeRose now, they will focus on memorizing those views rather than feeling the force of the paradox itself. You want them to leave the session feeling the problem, not having a catalog of responses, so restrict the discussion to whether the premises are acceptable or whether we must accept the dogmatic conclusion.

  For the final question to test their understanding, do not ask them to summarize the argument, as they can do that without seeing the tension. Instead, ask them whether acquiring new evidence can ever lower their justification for a proposition they already know, and why. If they have grasped the paradox, they will see that the argument implies justification cannot go down once knowledge is secured, because any counter-evidence is known to be misleading, which is a deeply counterintuitive result that shows they have seen the stakes. If they just say knowledge is hard to get, they have missed the point, but if they struggle with the idea that evidence cannot lower justification, they have understood the dogmatism worry.

  I should tell you which part of this plan is most likely to fail so you can be ready to pivot, and it is the assumption that they will accept the closure principle without qualification. Second-year students often encounter skepticism early on, and some may have picked up the idea that knowledge does not close under known implication, perhaps from hearing about skeptical puzzles or lotteries. If they reject closure, the argument stops dead, because the inference from knowing P to knowing the evidence is misleading breaks. If this happens, do not try to defend closure rigorously, as that is a whole other session, but instead ask them whether they are willing to accept closure for everyday cases like the meeting example, even if it fails in skeptical cases. If they still refuse, shift the focus to the factivity premise and ask whether knowing something truly guarantees it is true, which might move the debate to the nature of knowledge itself rather than the closure principle. This is the fragile point because if closure goes, the paradox dissolves, so be prepared to spend ten minutes just getting them to agree that if you know P and know P implies Q, you are in a position to know Q.
