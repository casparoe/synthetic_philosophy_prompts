  ### (c) Awkward Commitments per Leaf

  1.  **Prudential Skeptic:** You can break promises safely if you're powerful enough to hide it.
  2.  **Prediction Only:** Saying "I promise" never changes what you ought to do.
  3.  **Rule Consequentialist:** You must break a promise if keeping it produces slightly less good than breaking it.
  4.  **Reliance View:** You owe nothing to someone who expected you to keep it but didn't rely on it.
  5.  **Social Practice:** Promises wouldn't bind in a society that didn't have the institution of promising.
  6.  **Primitivism:** You must keep a promise even if it causes significant harm to others.
  7.  **Virtue Ethics:** A vicious person who keeps promises for show is doing the right thing.
  8.  **Repair View:** You can buy your way out of any promise as long as you pay enough.
  9.  **Authority View:** The promisee can command you to do something immoral because you gave them the right.
  10. **Basic Duty:** You are bound by a moral fact that cannot be explained further.
  11. **Will Theory:** You cannot be bound by a promise you made when you were ignorant or pressured.
  12. **Relationship View:** You are more obligated to keep a promise to a friend than a stranger, even if the words were identical.

  ### Diagnostics

  **Indistinguishable Positions:**
  *   **Will Theory vs. Basic Duty:** In many concrete cases (e.g., keeping a promise despite harm), these two views converge on the same outcome. The tree separates them only at the "Source" node (N10), but a user who feels the obligation is both "internal" and "brute" may bounce between them.
  *   **Will Theory vs. Integrity:** Both emphasize the promisor's internal state. The tree distinguishes them via self-forgiveness (N11), but a user who believes "I bind myself" may also believe "I can unbind myself," creating ambiguity between L11 and L12.

  **Unoccupied Combinations:**
  *   **Prudence + Basic Duty:** Incoherent. One cannot hold that obligations are brute moral facts *and* that they only bind when reputation is at stake.
  *   **Prediction + Reliance:** Unattractive. If promises are merely predictions, reliance cannot generate a *duty* to fulfill them, only a reason to predict accurately.
  *   **Authority + Prudence:** Unexplored. If the promisee holds authority, the obligation exists regardless of reputation; combining this with prudential skepticism creates a conflict about the source of the authority.

