prompt: |-
  I am an undergraduate taking a course on democratic theory, and I have become preoccupied with a cluster of institutional practices that tend to appear together, in varying combinations, in a number of countries, but that the course treats under separate headings. The cluster is this. A body of citizens chosen by lot, rather than elected or self-selected, is convened to study one question, hear evidence from experts and advocates, deliberate over several weekends, and publish a recommendation; the question itself is framed by that body rather than by the government. The same question is then put to the whole electorate in a referendum, and the state funds and circulates an even-handed statement of the arguments on both sides, prepared by a body forbidden to advocate either answer. Finally, if the assembly's recommendation and the referendum result diverge, nothing follows from the divergence: the result binds and the recommendation is filed.

  I would like you to reconstruct the philosophical commitments this composite practice presupposes, rather than summarising the existing debate about deliberative democracy. Specifically:

  1. The convening of an assembly suggests that the popular will has to be formed; the binding force of the referendum, together with the indifference to divergence, suggests that it is simply counted. Can both be held at once, or is the practice incoherent? Does it, perhaps, presuppose two different subjects of legitimacy rather than one?
  2. What does selection by lot presuppose about the kind of representation appropriate here? Descriptive resemblance, statistical representativeness, and the superior quality of small-group deliberation are three quite different justifications, and I want to know which the practice actually needs and which it merely fits.
  3. What does a state-funded, even-handed statement of the arguments presuppose about the possibility of presenting a case without weighting it? That the merits of an argument are separable from its persuasive force, or only that voters are to be treated as judges rather than parties?
  4. Does the practice distinguish between what people now want and what they would want after better deliberation? If so, which of the two the referendum is supposed to measure, and why the first should bind when the second is what the assembly was convened to discover?
  5. Which of these commitments does the practice strictly require, and which does it merely sit comfortably with? Could someone who regards voting as the aggregation of given preferences, with no interest in deliberation, run exactly these institutions without inconsistency? Conversely, if one abandoned the view that preferences are transformable, would the assembly collapse into an expensive opinion poll, or could it still be defended on other grounds?
  6. Finally, tell me what would have to be redesigned if one located legitimacy in the deliberating body itself rather than in the vote, and whether the resulting arrangement would still deserve to be called democratic.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Undergraduate student in democratic theory.
      *   **Topic:** A specific cluster of institutional practices (Sortition Assembly + Referendum + Neutral Voter Information + Non-binding Assembly).
      *   **Task:** Reconstruct the *philosophical commitments* presupposed by this composite practice.
      *   **Constraint:** Do *not* summarize existing debates about deliberative democracy. Focus on the internal logic and presuppositions of the described system.
      *   **Specific Questions:** Six distinct philosophical questions regarding legitimacy, representation, neutrality, preference transformation, consistency/requirements, and alternative designs.

  2.  **Deconstruct the Institutional Cluster:**
      *   *Component A:* Citizens' Assembly (Sortition, self-framed question, deliberation, recommendation).
      *   *Component B:* Referendum (Binding, whole electorate).
      *   *Component C:* Neutral Information (State-funded, even-handed, no advocacy).
      *   *Component D:* Relationship (Divergence allowed, Referendum wins, Assembly recommendation filed).

  3.  **Address Question 1: Legitimacy (Will Formation vs. Will Counting):**
      *   *Tension:* Assembly = Will Formation (deliberative). Referendum = Will Counting (aggregative).
      *   *Incoherence?* Not necessarily. It suggests a *dualist* theory of legitimacy.
      *   *Subjects:* "The People as Deliberators" (Assembly) vs. "The People as Sovereigns" (Referendum).
      *   *Resolution:* The Assembly provides *epistemic* legitimacy (quality of decision), the Referendum provides *political* legitimacy (authority to decide). The indifference to divergence implies that authority trumps epistemic quality in the final instance, but the epistemic input is still valued as a preparatory stage. It presupposes that the "will" is not a pre-existing thing to be found, but a process that ends in an authoritative act.

  4.  **Address Question 2: Selection by Lot (Representation):**
      *   *Options:* Descriptive resemblance (mirror), Statistical representativeness (sample), Deliberative quality (small group).
      *   *Analysis:*
          *   If the goal were just statistical representation, a poll would suffice.
          *   If the goal were just deliberative quality, experts or elected elites could do it.
          *   *The Practice Needs:* A hybrid. It needs *statistical representativeness* to claim it speaks for the whole (justifying the public funding and attention) BUT it needs the *deliberative capacity* of the small group to justify why *this* specific body gets to frame the question and inform the referendum.
          *   *Descriptive Resemblance:* Less critical than statistical validity, but helps with perceived legitimacy.
          *   *Key Commitment:* Ordinary citizens are *capable* of high-level reasoning if given time and resources (anti-elitism regarding competence), but they need the *structure* of sortition to bypass partisan filtering.

  5.  **Address Question 3: Neutral Information (Epistemology of Argument):**
      *   *Issue:* Can arguments be presented without weighting?
      *   *Presupposition:* It assumes a distinction between *information* and *persuasion*. It treats voters as *judges* who weigh evidence, not *parties* to be won over.
      *   *Deep Commitment:* Rationalism. It assumes there is a "state of the case" that can be described neutrally. It rejects the idea that all communication is inherently rhetorical or manipulative. It treats the voter as a rational agent capable of autonomous judgment if provided raw materials (arguments) without the "noise" of campaign strategy.

  6.  **Address Question 4: Preferences (Current vs. Deliberated):**
      *   *Distinction:* Yes, it clearly distinguishes "raw preference" (Referendum) vs. "informed preference" (Assembly).
      *   *Why Referendum Binds?* Because democracy requires *consent*. The Assembly discovers what is *good* or *reasonable*, but the Electorate confers *authority*.
      *   *Tension:* If the Assembly finds the "better" will, why let the "worse" will bind?
      *   *Answer:* Anti-paternalism. The system respects autonomy over truth. It assumes the risk of error is preferable to the risk of domination by a mini-public. The Referendum measures *authoritative consent*, potentially informed by the Assembly's work (via the neutral statement), but ultimately resting on the aggregate choice.

  7.  **Address Question 5: Strict Requirements vs. Comfortable Fit:**
      *   *Aggregative Theorist (Schumpeterian):* Could they run this? Yes, but they would view the Assembly as merely a "information processing machine" to reduce voter error, not to transform preferences. The neutral statement is just "accurate data."
      *   *Deliberative Theorist:* Needs the transformation.
      *   *If Preferences aren't Transformable:* The Assembly becomes an expensive poll *unless* its value is purely *symbolic* (legitimizing the process) or *agenda-setting* (framing the question).
      *   *Strict Requirement:* The system *requires* that citizens are capable of reasoning (to deliberate in the assembly and judge in the referendum). It does *not* strictly require that preferences *change*, only that they are *informed*. However, the "self-framing" of the question by the Assembly suggests a commitment to agenda-setting power residing in the people, not elites.

  8.  **Address Question 6: Redesign for Assembly Legitimacy:**
      *   *Shift:* Make the Assembly binding.
      *   *Redesign:* Remove the Referendum. Give the Assembly legislative power on specific issues.
      *   *Democratic?* Yes, under a "Sortitive Democratic" model. It shifts from "Government by Consent" (elections/referenda) to "Government by Representative Sample" (statistical democracy).
      *   *Implication:* This challenges the notion that legitimacy requires *universal* participation in the final decision. It argues legitimacy comes from *descriptive representation* + *deliberation*.
      *   *Name:* "Sortitive Democracy" or "Lottocracy" (though those terms have baggage). It is democratic in the sense of *equality of opportunity to rule*, but less democratic in the sense of *universal suffrage on outcomes*.

  9.  **Review and Refine:**
      *   *Tone:* Academic, precise, philosophical, respectful of the undergraduate level (challenging but clear).
      *   *Constraint Check:* Did I summarize existing debates? No, I focused on reconstructing the commitments of *this specific hypothetical system*.
      *   *Coherence:* Ensure the answers link together (e.g., the view of representation in Q2 links to the legitimacy in Q1).
      *   *Nuance:* The "indifference to divergence" is the key key key. It's the pivot point between epistocracy and democracy.

  10. **Drafting the Response:** (Self-Correction during drafting)
      *   *Correction on Q1:* Make sure to emphasize the *temporal* aspect. Formation happens *before* counting.
      *   *Correction on Q3:* Be careful not to say neutrality is *possible*, but that the practice *presupposes* it is possible or at least normatively required.
      *   *Correction on Q6:* Ensure I answer whether it's still "democratic." Yes, but it redefines democracy from "rule by the many" to "rule by a representative few acting for the many."

  11. **Final Polish:** Check against the prompt's specific phrasing ("reconstruct the philosophical commitments," "rather than summarising existing debate"). Ensure the voice is analytical. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to simply say "This is Deliberative Democracy." The prompt asks me to reconstruct the commitments of *this specific cluster*, which actually contains a tension (binding referendum vs. non-binding assembly) that pure deliberative democrats might reject. I must analyze the *hybrid* nature.

  *(Refining Q5)*: The prompt asks if an aggregative theorist could run this. Yes, if they view the assembly as a "filter" for misinformation rather than a "transformer" of values. I need to make that distinction clear.

  *(Refining Q6)*: If the Assembly is binding, does it need the referendum? No. Does it need sortition? Yes. Is it democratic? It depends on the definition of democracy (equality of input vs. equality of impact). I should highlight this definitional shift.

  Okay, ready to write.
answer: |-
  This is a sophisticated institutional design that hybridizes deliberative and aggregative models. To reconstruct its philosophical commitments, we must treat the system not as a compromise, but as a coherent structure with its own internal logic. The following analysis isolates the presuppositions required to make sense of the specific tensions you have identified.

  ### 1. Legitimacy: Formation vs. Counting
  The practice is not incoherent, but it is **dualist**. It presupposes that political legitimacy has two distinct sources that operate sequentially rather than simultaneously.

  *   **Epistemic Legitimacy (The Assembly):** The convening of the assembly presupposes that the "popular will" is not a pre-existing datum waiting to be discovered, but a potential that must be *actualized* through reasoning. The commitment here is that a decision is more legitimate if it is informed, considered, and free from partisan distortion. The Assembly represents the *quality* of the will.
  *   **Political Legitimacy (The Referendum):** The binding force of the referendum presupposes that legitimacy ultimately rests on *authority*, which derives from the consent of the governed. The commitment here is that no subset of citizens, however well-chosen, can impose a decision on the whole without their explicit authorization. The Referendum represents the *authority* of the will.

  **The Subjects of Legitimacy:** The practice presupposes two different subjects. The Assembly speaks for the **Public Interest** (what is reasonable), while the Referendum speaks for the **Sovereign People** (what is willed). The indifference to divergence is the crucial pivot: it asserts that in a democracy, *authority trumps reason*. The system accepts the risk of a "wrong" decision (by epistemic standards) to avoid the tyranny of a "wise" elite (even a sortitive one). It holds both views at once by assigning them different functional roles: the Assembly *clarifies* the choice; the Electorate *owns* the choice.

  ### 2. Selection by Lot: The Nature of Representation
  This practice requires a specific hybrid of representation that distinguishes it from both polling and elections.

  *   **Statistical Representativeness (Required):** The practice *needs* the assembly to be a microcosm of the population. If the assembly were not statistically representative, its recommendation would carry no special weight over that of a committee of experts. The philosophical commitment is that **political competence is equally distributed** across social strata. Sortition is used not to find the "best" minds, but to ensure that the deliberation reflects the diverse experiences of the whole.
  *   **Deliberative Quality (Required):** It also *needs* the small-group dynamic. A mass survey cannot deliberate. The commitment here is that **preferences are malleable** and can be improved through structured dialogue.
  *   **Descriptive Resemblance (Incidental):** While the assembly will likely descriptively resemble the population, this is a byproduct of statistical sampling, not the primary justification. The system does not require the assembly to "look like" the people in a symbolic sense, but to *function* as a statistical proxy.

  **The Fit:** The practice fits comfortably with the idea of **surrogate deliberation**. It presupposes that the many cannot deliberate together, so the few must deliberate *for* the many. However, because the result is non-binding, it avoids the claim that the few can *decide* for the many. It needs statistical representativeness to claim it speaks *for* the people, and deliberative capacity to claim it speaks *well* for them.

  ### 3. Neutral Information: The Epistemology of Argument
  The state-funded, even-handed statement presupposes a **rationalist epistemology of politics**.

  *   **Separability of Merit and Force:** It presupposes that the logical merits of an argument can be disentangled from the rhetorical strategies used to sell it. It assumes there is a "view from nowhere" (or at least, a view from the state) that can summarize conflicting claims without implicitly endorsing one.
  *   **Voters as Judges:** It treats voters not as *parties* to a conflict (who need to be mobilized) but as *judges* (who need to be informed). This presupposes that citizens are capable of autonomous judgment if provided with raw materials free from manipulative framing.
  *   **The Possibility of Neutrality:** Strictly speaking, the practice requires the *belief* that neutrality is possible, or at least that the *attempt* at neutrality is normatively superior to partisan advocacy. It rejects the post-modern or realist view that all language is inherently power-laden and that "even-handedness" is itself a bias. It commits to the idea that the state can be a honest broker of truth claims.

  ### 4. Preferences: Current vs. Deliberated
  The practice explicitly distinguishes between **raw preferences** (measured by the referendum) and **refined preferences** (discovered by the assembly).

  *   **What the Referendum Measures:** The referendum measures **authoritative consent**. It answers the question: "Do you accept this outcome as binding law?" It does not necessarily measure what people think is "best" in the abstract, but what they are willing to stand behind.
  *   **Why the First Binds:** The system prioritizes **autonomy over truth**. Even if the Assembly discovers what citizens *would* want after perfect deliberation, the system respects what they *do* want at the moment of voting. To bind citizens to the Assembly's recommendation would be paternalistic; it would imply the state knows the citizen's "true will" better than the citizen does.
  *   **The Role of the Assembly:** The Assembly is convened to discover the **conditions of reasonable agreement**. It identifies the trade-offs and consequences. The Referendum then decides if the electorate accepts those trade-offs. The Assembly informs the conscience; the Referendum exercises the will.

  ### 5. Strict Requirements vs. Comfortable Fits
  We can distinguish between what the machinery *needs* to function and what it *implies* about human nature.

  *   **The Aggregative Theorist:** A theorist who views voting as mere preference aggregation *could* run this system without inconsistency, but they would reinterpret the components.
      *   The Assembly becomes an **information-reduction mechanism**. Its purpose is not to transform preferences, but to reduce the "cost of information" for voters, ensuring the referendum reflects *informed* self-interest rather than *ignorant* self-interest.
      *   The Neutral Statement becomes **accurate data**.
      *   *Inconsistency Check:* The only inconsistency arises if the Assembly is allowed to **frame the question**. An aggregative theorist believes preferences are given; allowing a body to frame the question implies preferences are constructed. If the aggregative theorist retains control over the question framing, the system works for them. If the Assembly frames the question, the aggregative theorist must admit that agenda-setting power shapes outcomes.
  *   **If Preferences Are Not Transformable:** If one abandons the view that deliberation changes minds, the Assembly does not necessarily collapse into an expensive poll, provided its function is **agenda-setting**. Even if preferences are fixed, the Assembly can determine *which* fixed preferences get voted on. However, its deliberative *recommendation* loses its normative force. It becomes merely a "sample opinion" with a high budget. The system could still be defended on **epistemic grounds** (the group is less likely to be misinformed than the mass public), but not on **transformative grounds**.

  **Strict Requirement:** The system strictly requires that citizens are **capable of reasoning** (to deliberate in the assembly and judge in the referendum). It does *not* strictly require that they change their minds, only that they are capable of processing new information.

  ### 6. Redesign: Locating Legitimacy in the Assembly
  If one located legitimacy in the deliberating body itself (believing the refined will is superior to the raw will), the design would change fundamentally.

  *   **Redesign:**
      1.  **Abolish the Referendum:** The Assembly's decision becomes binding law.
      2.  **Abolish the Neutral Statement:** If the Assembly decides, the public does not need to be briefed to vote, only informed of the outcome.
      3.  **Increase Frequency:** One-off assemblies become a standing legislative chamber (a "Second House" chosen by lot).
  *   **Is it Democratic?**
      *   **Yes,** under a definition of democracy as **political equality**. Sortition ensures every citizen has an equal probability of ruling. It eliminates the inequality of elections (where money and fame matter).
      *   **No,** under a definition of democracy as **popular sovereignty** or **consent**. If the people cannot veto the Assembly, they are subjects of the Assembly, not masters of the state.
  *   **The Shift:** This redesign shifts from **Liberal Democracy** (legitimacy via consent/elections) to **Sortitive Democracy** (legitimacy via descriptive representation and deliberation). It presupposes that **competence + representation** is a superior source of legitimacy than **consent**. It argues that a representative sample deliberating is a more accurate proxy for "The People" than the aggregate of isolated voters. Whether this deserves the name "democratic" depends on whether you view democracy as a method of selecting leaders (elections) or a method of embodying the public (sortition).

  ### Summary of Philosophical Commitments
  The composite practice you describe rests on a **moderate democratic realism**. It commits to the following:
  1.  **Competence is universal** (justifying sortition).
  2.  **Truth is discoverable** through dialogue (justifying deliberation).
  3.  **Authority is non-transferable** (justifying the binding referendum).
  4.  **State neutrality is possible** (justifying the information booklet).
  5.  **Error is preferable to domination** (justifying the indifference to divergence).

  It is a system designed to maximize the *quality* of the input while retaining the *security* of the veto. It assumes the people are wise enough to rule, but too busy to deliberate, and too susceptible to manipulation to be left without guidance, yet too sovereign to be bound by that guidance.
