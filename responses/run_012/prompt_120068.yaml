prompt: |-
  I'm heading into the second year of a philosophy PhD, mostly language and mind, and I've gotten weirdly stuck on the Kripkenstein thing — the plus/quus case, where everything in my head and everything I've ever done is compatible with some deviant function, call it quus, that agrees with addition on every sum I've ever actually performed and diverges on the first one big enough that I'd never have gotten to it. I get why the paradox grabs people. What I can't get is a sense of the shape of the field: the literature around it reads to me like a bunch of people defending their preferred fix — dispositions, biological teleology, the community, treating correctness as just primitive and unanalyzable, non-factualism about meaning — and I can't tell which of the questions underneath those fixes are genuinely live versus just turf wars between fans of different fixes. My supervisor says it's a solved-and-abandoned topic and I should go work on something with data, which I think is wrong but I don't have a good answer for him. So: what are the main open questions in this area right now, and if I've got about a year of serious part-time work and I want to come out the other end with something that lands with people outside the rule-following seminar — I'd really love it to have some teeth for the current fight over whether language models mean anything by what they output, or failing that for how we should think about rule-following in logic and math — which two or three would you actually put the year into? Rank them, don't list them.

  Some things I keep bumping into that I can't place and that might be part of the answer or might be red herrings: whether the skeptical solution is actually a solution or just a quiet change of subject, from what a word means to what we're licensed to say about it; whether the paradox, if it goes through, eats the skeptic too, since he's relying on words like rule and plus behaving for him the way they're supposed to; whether the community version just relocates the problem, since the community's say-so is itself a rule-governed notion and the same regress seems to start over; how much of this is the same problem as the old Carroll-style regress about whether you can be bound by a rule of inference you haven't already in some sense accepted (I have a strong hunch these are one problem wearing two coats, but I can't articulate why, and I'd like to know if that's a real line or a folk connection); and whether any of it has purchase on a trained network that reliably gets the right answers for reasons nobody can state in a rule-like way.

  For each thing you'd prioritize, I want the reasoning, not the topic: what's upstream of what, so I know which one, if settled, would make the others cheaper; how tractable it is for someone who's a philosopher and not a mathematician; whether the answer would actually change anything downstream or just get filed away; and roughly how many people are already on it versus leaving it alone. Then tell me which of my five worries you'd flat-out drop as a pseudo-question, and what a year of argument or evidence would have to look like for me to move something up or down the list. If the honest answer is that the year is better spent on a question I haven't mentioned at all, say so and tell me what it is.
