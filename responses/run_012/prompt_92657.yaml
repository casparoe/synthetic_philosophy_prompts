  ### Unoccupied & Incoherent Combinations

  You asked which combinations nobody occupies.

  1.  **The "Incoherent" Leaf (E):** *Outcome Matters + No Causal Impact + No Probability + Act is Wrong.*
      *   **Status:** **Incoherent.** If you insist morality is *only* about outcomes, and you admit there is *no* outcome (actual or expected), you have removed the ground for calling the act wrong. Philosophers avoid this by either accepting Skepticism (Leaf D) or switching to Non-Consequentialism (Leaf F/J).
  2.  **Irreducible Collective + Full Distributivity:** *The "We" is responsible + Every bit of that responsibility falls on an "I".*
      *   **Status:** **Unattractive/Redundant.** If the collective obligation dissolves entirely into individual obligations, you haven't really posited a collective agent; you've just described **Joint Individual Responsibility (Leaf H)**. True Irreducible Collective Responsibility (Leaf I) requires that some blame remains with the group even after individuals have done their best.
  3.  **Act Consequentialism + Threshold Harm:** *One act never triggers harm + Act is wrong because of actual harm.*
      *   **Status:** **Unexplored/Impossible.** This is physically contradictory. If harm comes in thresholds (Lumps) and you didn't cross one, Act Consequentialism must say the act is permissible. This is why Act Consequentialists usually switch to **Expected Utility (Leaf C)** to handle threshold cases.

  ### A Note on the Political Shift
  You mentioned shifting obligation from consumption to politics. In this tree, that move is most clearly associated with **Leaf I (Irreducible Collective Responsibility)** and **Leaf J (Rule Utilitarianism)**.
  *   If you land on **Leaf D (Skepticism)**, you often argue the only rational move is **Political Action** (change the system so individual acts *do* matter), though strictly speaking, Skepticism itself doesn't demand this.
  *   If you land on **Leaf I**, you argue that private consumption is the *wrong site* of obligation entirely; the obligation belongs to the polity, not the consumer.

  **How to use this:** Start at Node 1. Be honest about the physics (Node 2/3). Be honest about whether you care about outcomes (Node 5). The Leaf you reach is the name of the view you've been holding.
