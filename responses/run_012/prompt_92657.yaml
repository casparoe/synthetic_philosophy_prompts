  Here is a decision tree designed to fit on the back of an envelope. It takes you from the physical facts of your cases (the flight, the burger, the vote, the meadow) to the specific moral position you occupy.

  There are **12 Nodes** (decision points) and **8 Leaves** (named positions). I have phrased the questions to avoid philosophical jargon where possible, relying instead on the causal and structural distinctions you know from atmospheric science.

  ### The Inefficacy Decision Tree

  **Node 1: The Causal Threshold (Lumps vs. Degrees)**
  Do you view the harm (climate change, animal death, meadow destruction) as arriving in **degrees** (every tonne/step adds a tiny bit of damage) or **lumps** (damage only occurs when a specific threshold is crossed)?
  *   **Degrees** $\rightarrow$ Go to Node 2.
  *   **Lumps** $\rightarrow$ Go to Node 3.

  **Node 2: Physical Efficacy (Degrees View)**
  In a "Degrees" view, does a single token action (one tonne of CO2) *physically* change the outcome, even if the change is imperceptible to humans?
  *   **Yes** (Physics says mass adds up) $\rightarrow$ Go to Node 4.
  *   **No** (Physics says it rounds to zero/noise) $\rightarrow$ Go to Node 5.

  **Node 3: Causal Necessity (Lumps View)**
  In a "Lumps" view (like the meadow dying at 1,000 steps), can a single individual action ever be the *necessary* trigger (i.e., are you ever the 1,000th walker)?
  *   **Yes** (It's possible you are the trigger) $\rightarrow$ Go to Node 4.
  *   **No** (You are the 1,001st walker; the harm was already done) $\rightarrow$ Go to Node 5.

  **Node 4: The Consequentialist Fork**
  You believe the act *can* cause harm. Is the act wrong *solely* because of that causal impact?
  *   **Yes** $\rightarrow$ Go to Node 6.
  *   **No** (Other duties matter too) $\rightarrow$ **Deontological Constraints** (Leaf A).

  **Node 5: The Relevance of Outcome**
  You believe the act makes *no* causal difference (Inefficacy). Is the **outcome** still the only thing that makes an act right or wrong?
  *   **Yes** (Consequentialism) $\rightarrow$ Go to Node 7.
  *   **No** (Non-Consequentialism) $\rightarrow$ Go to Node 8.

  **Node 6: Act vs. Expectation**
  If the act causes harm, do we judge by the **actual** outcome or the **expected** outcome (probability $\times$ impact)?
  *   **Actual** $\rightarrow$ **Act Consequentialism** (Leaf B).
  *   **Expected** $\rightarrow$ **Expected Utility Consequentialism** (Leaf C).

  **Node 7: The Skeptic's Fork**
  If outcome is all that matters, and your act changes *nothing* (and has no expected value), is the act permissible?
  *   **Yes** $\rightarrow$ **Inefficacy Skepticism** (Leaf D).
  *   **No** $\rightarrow$ **Unnamed/Incoherent** (Leaf E).

  **Node 8: The Grounds of Wrongness**
  If outcome isn't everything, is the wrongness about **your character** (integrity/virtue) or **your participation** (joining a practice)?
  *   **Character** $\rightarrow$ **Virtue Ethics / Integrity View** (Leaf F).
  *   **Participation** $\rightarrow$ Go to Node 9.

  **Node 9: Unit of Assessment**
  If participation matters, do we assess the **Individual Act**, the **Rule**, or the **Collective Practice**?
  *   **Individual Act** $\rightarrow$ **Complicity Theory** (Leaf G).
  *   **Rule/Practice** $\rightarrow$ Go to Node 10.

  **Node 10: Collective Agency ("We")**
  Can a "We" (humanity, voters, flyers) bear an obligation that does *not* belong to any single "I"? (i.e., Is the group an agent?)
  *   **Yes** $\rightarrow$ Go to Node 11.
  *   **No** (Must distribute to individuals) $\rightarrow$ Go to Node 12.

  **Node 11: Distributivity**
  If the "We" bears the obligation, does it **distribute** down to the members anyway?
  *   **Yes** $\rightarrow$ **Joint Individual Responsibility** (Leaf H).
  *   **No** $\rightarrow$ **Irreducible Collective Responsibility** (Leaf I).

  **Node 12: Rule vs. Project**
  If the obligation distributes to individuals: Is the duty to **follow a rule** (what if everyone did?) or **avoid a project** (don't be part of this harm)?
  *   **Follow Rule** $\rightarrow$ **Rule Utilitarianism / Kantianism** (Leaf J).
  *   **Avoid Project** $\rightarrow$ **Complicity Theory** (Leaf G).

  *(Note: Node 10-12 handles the "Political Shift" implicitly. If you answer "Collective Practice" at Node 9, you are already moving away from private consumption. If you answer "Yes" to Node 10, you are explicitly shifting to collective agency.)*

  ---

  ### The Leaves (Named Positions)

  *   **Leaf A: Deontological Constraints.** (Rare. You believe acts can cause harm, but they are wrong for reasons *other* than the harm, e.g., rights violations).
  *   **Leaf B: Act Consequentialism.** (Classic Utilitarianism. One tonne *does* cause harm; therefore, fly less. Struggles with the "1,001st step" case).
  *   **Leaf C: Expected Utility Consequentialism.** (The Scientist's Fix. One tonne might not *actually* change the weather, but it carries a *risk* of crossing a threshold. The risk is the harm).
  *   **Leaf D: Inefficacy Skepticism.** (The "Drop in the Bucket." If I make no difference, I do no harm. My flying is morally neutral).
  *   **Leaf E: Unnamed/Incoherent.** (You claim outcome matters, admit no outcome occurs, yet claim the act is wrong. This view lacks a mechanism for wrongness).
  *   **Leaf F: Virtue Ethics / Integrity View.** (It's not about the climate; it's about *you*. A virtuous person doesn't fly, regardless of impact. Keeps your hands clean).
  *   **Leaf G: Complicity Theory.** (You are wrong because you are participating in a harmful *project*, even if your contribution wasn't necessary. Focuses on individual involvement in collective harm).
  *   **Leaf H: Joint Individual Responsibility.** (We are responsible together, but that responsibility dissolves down to a duty for each of us to do our part).
  *   **Leaf I: Irreducible Collective Responsibility.** (Plural Subject Theory. The "We" is the agent. No single individual is to blame for the meadow, but the group is. Obligation does not fully distribute).
  *   **Leaf J: Rule Utilitarianism / Kantianism.** (Don't ask "Does this flight matter?" Ask "What if everyone flew?" The unit of analysis is the universalized rule).

  ---

  ### Test Case Implications

  Here is how your four cases resolve depending on which Leaf you land on.

  | Case | **Skepticism (D)** | **Exp. Utility (C)** | **Virtue (F)** | **Complicity (G)** | **Collective (I)** | **Rule/Kant (J)** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Flight** (CO2) | Permissible | Wrong (Risk) | Wrong (Character) | Wrong (Participation) | Wrong (Group Duty) | Wrong (Universalize) |
  | **Burger** (Buffered) | Permissible | Wrong (Risk) | Wrong (Character) | Wrong (Participation) | Wrong (Group Duty) | Wrong (Universalize) |
  | **Vote** (Safe Seat) | Permissible | Wrong (Risk) | Wrong (Character) | Permissible* | Wrong (Group Duty) | Wrong (Universalize) |
  | **Meadow** (1,001st) | Permissible | Permissible** | Wrong (Character) | Wrong (Participation) | **Wrong (Group)** | Wrong (Universalize) |

  *\*Complicity often struggles with the Safe Vote if there is no "harmful project" to join, whereas Collective Responsibility handles it well.*
  *\*\*Expected Utility struggles here if the probability of being the 1,000th step is literally zero.*

  **Behavioral Identities:**
  *   **Virtue Ethics (F)** and **Rule Utilitarianism (J)** are often behaviorally identical on these cases (both say "Don't fly"), though for different reasons (Character vs. Rule).
  *   **Complicity (G)** and **Joint Individual Responsibility (H)** often yield the same advice ("Don't participate"), but H implies a duty to coordinate, while G implies a duty to withdraw.

