answer: |-
  Here is the decision procedure, the evaluation of your intuition, and the run-through you asked for.

  ### 1. Your Intuition: Load-Bearing vs. Shibboleth
  Your instinct is solid, but it needs a philosophical tune-up. You're describing the difference between a **Lewisian Coordination Convention** (load-bearing) and a **Hartian Social Rule** (shibboleth).

  *   **Load-bearing (Lewis):** The practice exists to solve a problem (e.g., who pays the waiter, who goes first). If you opt out unilaterally, the solution breaks for someone else.
  *   **Shibboleth (Hart):** The practice exists to signal membership. Deviation triggers criticism ("You're not one of us"), but the system doesn't collapse.

  **The Fix:** Add a **Fair-Play Filter**. Even if a convention is load-bearing, you are only obliged to follow it if you *voluntarily accepted the benefit* it produces. If you didn't ask for the benefit, the obligation weakens.

  ### 2. The "Wanderer's Filter" (15-Minute Procedure)
  Run the letter through these four questions in order. If you hit a "Stop," you have your answer.

  1.  **The Legality/Safety Stop:** Is this illegal or physically dangerous?
      *   *Yes:* **Don't do it.** (Editor veto. Do not publish advice contradicting this.)
      *   *No:* Proceed.
  2.  **The Collapse Test (Lewis):** If every tourist did what the reader did, would the local practice functionally collapse?
      *   *Yes (Load-bearing):* Strong presumption of obligation.
      *   *No (Shibboleth):* Weak presumption of obligation.
  3.  **The Benefit Test (Fair-Play):** Did the reader knowingly accept the benefit generated by the practice?
      *   *Yes:* Obligation holds (you took the benefit, you pay the cost).
      *   *No:* Obligation weakens (you can opt out at social cost).
  4.  **The Harm Test:** Does skipping this hurt a specific vulnerable person, or just abstract "order"?
      *   *Specific Person:* Obligation holds.
      *   *Abstract Order:* Optional.

  ### 3. Running the Cases

  #### Case 1: The Non-Tipping Moral Objector
  *   **Legality:** Not illegal.
  *   **Collapse:** Yes. US waiter wages rely on tips. If everyone stops, the income model breaks.
  *   **Benefit:** Yes. Reader ate the food and was served.
  *   **Harm:** Specific person (the waiter loses income).
  *   **Verdict:** **Obligated.**
  *   **The Handback (Values):** This is where you might squirm. The procedure says "pay," but the reader argues the *system* is immoral. The procedure treats the system as a given; it cannot adjudicate whether participating in a flawed system makes you complicit. That's a moral choice, not a conventional one.
  *   **Column Verdict (2 sentences):** You are free to oppose the system, but not while accepting its benefits; once you sit at the table, you owe the worker their expected wage. Protest the practice with your voice, not your wallet, once the service is rendered.

  #### Case 2: The 3AM Jaywalker
  *   **Legality:** Technically illegal, but unenforced (Safety Stop is grey, assume low risk).
  *   **Collapse:** No. One person crossing an empty street doesn't break traffic flow.
  *   **Benefit:** Minimal (saved 30 seconds).
  *   **Harm:** Abstract order (locals feel annoyed).
  *   **Verdict:** **Optional.**
  *   **The Handback:** None. This is a pure shibboleth. The locals are enforcing pace, not safety.
  *   **Column Verdict (2 sentences):** You committed a faux pas, not a crime; you prioritized safety over local pace, which is permissible. Wear the jeers as the price of your caution, but know you broke no genuine obligation.

  #### Case 3: The Border "Processing Fee"
  *   **Legality:** **STOP.** This is likely a bribe.
  *   **Collapse:** Yes, the corruption ring relies on it.
  *   **Benefit:** Yes (passage).
  *   **Harm:** Systemic corruption.
  *   **Verdict:** **Do Not Pay.** (But procedure flags safety risk).
  *   **The Handback:** This is where the procedure hands back to you heavily. While the "Fair-Play" argument suggests you should pay if you want passage, the "Legality" stop overrides it. However, if refusing means being stranded, is it obligatory for *safety*? The procedure can't weigh physical risk against ethical compliance.
  *   **Column Verdict (2 sentences):** Official fees are paid at counters with receipts, not into pockets; what you encountered was likely extortion, not convention. Prioritize your safety, but do not validate bribery as a local custom.

  ### 4. Where the Procedure Fails (The Handback)
  You asked me to identify where I'm handing the call back to you because it's a values question.

  1.  **Complicity vs. Compliance (Case 1):** The procedure concludes you must tip because you accepted the benefit. It cannot answer whether accepting the benefit is morally permissible if the system is exploitative. You have to decide if "Dear Wanderer" advocates working within flawed systems or resisting them.
  2.  **Prudence vs. Ethics (Case 3):** The procedure flags illegality, but it can't tell a reader whether being stranded at a border is worth taking a moral stand. That is a risk assessment only the traveler can make.

  ### 5. Summary for Your Editor
  The procedure distinguishes between **coordination obligations** (tipping, queues) and **signaling habits** (jaywalking, dress codes). It relies on whether the practice collapses without compliance and whether the traveler accepted the benefit. It explicitly excludes legal advice and flags moral dilemmas where "correct" behavior is subjective.

  **Use this.** It will stop you from contradicting yourself. When the procedure says "Obligated," you say "Pay up." When it says "Optional," you say "Take the heat." When it hits the Handback, you write: "This isn't about manners; it's about morals, and that choice is yours."
