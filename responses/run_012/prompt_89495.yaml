answer: |-
  **Referee Report**

  **General Assessment**
  The paper aims to deflate the metaphysical conclusion of the modal argument for the essentiality of origin. Instead of establishing a mind-independent necessity, you argue the argument reveals a feature of our individuative practice—a "tracking policy" adopted for determinacy rather than fidelity to metaphysical joints. This is a clear, concise draft with a distinct voice. However, the argument hinges on a distinction between *epistemic tracking* and *metaphysical grounding* that requires sharper defense. Below I address your five specific requests.

  **1. Stability of the Distinction (Case vs. Practice)**
  The distinction between "what the case shows" and "what our practice supplies" is currently unstable. You write that the necessity is a "projection of the determinacy requirement internal to our practice, not a feature of persons." This risks collapsing into a distinction without a difference unless you clarify the status of the "practice."

  If the practice is constitutive of the concept *person*, then the rule *makes* the fact. In that case, the necessity is conceptual, but still necessary. If the practice is merely a heuristic for identifying pre-existing entities, then your critique holds. The problem is that you oscillate between these. In the *Gamete Lottery*, you suggest identity has "no answer available except the one we supply by rule." This sounds anti-realist. But in the conclusion, you say, "I am not denying that there is a fact of the matter."

  To stabilize this, you must specify what the "fact of the matter" consists in if not the output of the tracking rule. If there is a fact independent of the rule, why does the rule underdetermine it? If there is no fact independent of the rule, then you are denying a fact of the matter. I recommend cutting the claim that you are not denying a fact of the matter, or else explain what kind of fact survives the removal of the tracking practice. Without this, the distinction collapses into a verbal dispute about the word "necessity."

  **2. Weakest Step and Strongest Unconsidered Objection**
  **Weakest Step:** The inference from "we use origin to track" to "origin does not fix identity." You argue that because origin is the *only* device that returns an answer in every case (e.g., in the Swap), it is chosen for convenience. The essentialist will reply that it is chosen because it is the *cause* of the person. The weakest link is your assumption that tracking must be independent of constitution. If origin constitutes the person, then tracking by origin is not a mere policy; it is tracking the thing itself. You treat origin as a label attached to the person, rather than a component of the person's essence. You need to argue why origin is a *label* rather than a *constituent*.

  **Strongest Unconsidered Objection:** The Intrinsicness Objection. You focus entirely on the *external* relation between gametes and the resulting life. However, the gametes determine the initial genetic constitution of the zygote. If you change the gametes, you change the intrinsic properties of the initial entity. The essentialist argues that you cannot be identical to a being with different intrinsic properties at the start of its existence. Your *Gamete Lottery* stipulates qualitative identity *subsequently*, but it glosses over the initial qualitative difference. The objection is that identity requires continuity of intrinsic properties from the start. You need to address why a difference in the initial genome (caused by different gametes) doesn't constitute a difference in *who* it is, regardless of our tracking practices.

  **3. The Sibling Swap Dilemma**
  The *Sibling Swap* does not generate a genuine dilemma for the origin essentialist; it generates a charge of incoherence. The essentialist will not accept the description of the case as a live possibility. If *you* are essentially from gametes G, then a world where G produces your sibling is a world where your *sibling* exists, not you. The description "your sibling's life unfolds from your gametes" is, to the essentialist, a contradiction in terms if it implies *you* are living that life.

  The essentialist resolves the Swap by denying the coherence of the "You + Their Gametes" combination. They do not face a dilemma because they reject one of the horns. To press this, you must argue that the Swap scenario is *conceivable* and that conceivability entails possibility, or that the essentialist's rejection of the scenario is ad hoc. Currently, you treat the Swap as a neutral testing ground, but it is already loaded against the essentialist. If you can show that the essentialist must accept the coherence of the Swap to get the argument off the ground, you have a point. If they can deny the coherence without circularity, the Swap fails. I recommend strengthening the argument for why the Swap is a coherent modal scenario independent of the essentialist's premises.

  **4. Novelty and Contribution**
  As it stands, the paper risks being a restatement of a familiar deflationary line: that modal intuitions reflect linguistic conventions rather than metaphysical structure. To make this a contribution, you must move beyond the general claim that "necessity is projected."

  The specific contribution here is the focus on *determinacy* as the driving force of the practice. The claim that we choose origin *because* it returns an answer in every case (unlike qualitative tracking) is interesting. To sharpen this, compare origin to other tracking policies (e.g., spatio-temporal continuity for material objects). If you can show that origin functions specifically as a *tie-breaker* in cases where qualitative facts are silent, rather than as a *truth-maker*, you distinguish your view from general conventionalism. Cut the general verificationist defenses and focus narrowly on the "determinacy requirement." That is the novel engine of the paper.

  **5. The Opening Intuition Pump**
  The opening does not strictly beg the question, but it frames the asymmetry in a way that favors your conclusion. You describe the asymmetry as: "a difference in origin appears to be a difference in who, whereas a total difference in the resulting life appears to be a difference in how things went."

  This phrasing presupposes that the origin intuition is robust enough to be a "datum." The essentialist agrees it is a datum; you argue it is a practice. The risk is that by granting the intuition its face value initially, you legitimize the very intuition you later dismantle. A more neutral framing would be: "Most people answer no to the first question and yes to the second. Origin essentialism treats this pattern as metaphysical; I treat it as practical."

  However, the deeper issue is that the intuition pump relies on the *actual* world to generate the intuition. You are asking readers to project from actuality. If your thesis is that our tracking practices are projected onto modal space, using actual-world intuitions to set up the problem is circular. You should acknowledge that the intuition pump relies on the very practice you are critiquing. This doesn't ruin the paper, but it must be flagged as a dialectical starting point, not neutral ground.

  **Summary of Recommendations**
  1.  **Clarify the Ontology:** Decide if you are an anti-realist about transworld identity or merely an skeptic about the *argument* for realism. The current wavering weakens the conclusion.
  2.  **Address Intrinsic Properties:** You cannot ignore the genetic/constitutive argument. Address why initial intrinsic differences don't fix identity.
  3.  **Reframe the Swap:** Acknowledge that the essentialist denies the coherence of the Swap. Argue why that denial is costly or unmotivated.
  4.  **Sharpen the Novelty:** Focus on the "determinacy requirement" as the specific mechanism of projection, rather than general conventionalism.
  5.  **Neutralize the Opening:** Frame the initial asymmetry as the *target* of the critique, not as established data.

  The paper has the potential to be a sharp, effective critique of the modal argument's reach, provided it tightens the metaphysical stakes of the "practice" vs. "world" distinction.
