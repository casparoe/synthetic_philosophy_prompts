      *   *Difference:* Hume is skeptical/empiricist (we don't *know* a cause, maybe there isn't one). Ghazali is theological/metaphysical (we know the *real* cause is God). Hume dissolves the link; Ghazali relocates it.
      *   *Verdict:* The comparison is useful but superficial. Hume leads to skepticism; Ghazali leads to occasionalism/divine voluntarism.

  7.  **Drafting the Response:**
