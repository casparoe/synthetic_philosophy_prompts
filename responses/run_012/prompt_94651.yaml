prompt: |-
  I've been chewing on this testimony thing for a while now — you know, the whole argument about whether you're allowed to just believe what someone tells you, or whether you need some independent evidence that they're the sort of person who tells the truth. I ran into it on a podcast and it's been rattling around my head since, and I think both sides are mostly talking past each other because each one is picturing a different kind of conversation. So here's what I want from you: argue for the position that the dispute gets resolved, or at least gets a lot clearer, once you index how much default trust a hearer is entitled to to whether the speaker shares in the cost of being wrong.

  The way I'd put it: in some cases the speaker sinks or swims with you. If my brother tells me the trail is fine and it isn't, he's the one carrying me back down the hill, so his word gets weight for free — the fact that he said it, knowing he'd eat the consequences too, is itself a reason to believe him. Call that a shared-cost case. In other cases the speaker is fine either way: the guy at the used car lot, the stranger on the forum, the company that says its product is safe. There, the bare fact that he said it buys you nothing, and you'd be a fool to treat it as a reason until you've got some independent handle on whether he's reliable. Call that a split-cost case. What I want you to argue is that this is the right way to cut it: the anti-reductionists are basically describing shared-cost cases and the reductionists are basically describing split-cost cases, that neither side's blanket rule survives the examples the other side actually cares about, and that once you add the cost-sharing condition you get a view that handles both without giving up anything either side was right about.

  And please don't just hand me the tidy version — spend real time on the cases that make it hard. What about a stranger with nothing to gain either way, like a tourist pointing me toward the station? What about someone who shares the cost but is hopeless — my uncle, who's wrong about basically everything and believes every word of it? What about a doctor telling me about a treatment, where he isn't the one at risk but his reputation is? And what about someone who shares my costs only because they're mistaken about that, or because they've got a weird sense of solidarity with me? If the view can't say anything useful about those, say so and tell me how bad the damage is. I'd rather have a real argument with the soft spots marked then a victory lap.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Task:** Argue for a specific resolution to the epistemological debate on testimony (Reductionism vs. Anti-Reductionism).
      *   **Proposed Resolution:** Index default trust to whether the speaker *shares the cost of being wrong* (Shared-Cost vs. Split-Cost).
      *   **Key Claim:** Anti-reductionists are describing Shared-Cost cases; Reductionists are describing Split-Cost cases. Neither blanket rule works for all cases. The Cost-Sharing view synthesizes them.
      *   **Constraint:** Do not just give a tidy summary. Engage deeply with hard cases (strangers with no stake, incompetent but sincere allies, reputation stakes, mistaken solidarity). Acknowledge soft spots and damage control.
      *   **Tone:** Philosophical, argumentative, nuanced, conversational but rigorous (matching the user's "chewing on this testimony thing" vibe).

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Reductionism (Humean):* Testimony is never a *sui generis* source of justification. You need independent reasons to think the speaker is reliable (induction from past experience).
      *   *Anti-Reductionism (Reidian):* Testimony is a basic source of justification. You are entitled to believe unless there are defeaters. (Principle of Credulity).
      *   *The User's Proposal:* A pragmatic/epistemic hybrid based on *incentive alignment*.
      *   *My Job:* Defend this proposal as the clarifying lens that dissolves the stalemate, while critically stress-testing it.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate the "talking past each other" diagnosis. State the thesis: The Cost-Sharing Principle (CSP) isn't just a compromise; it's the underlying mechanism both sides were groping toward.

      *   **Argument Phase 1: Why the Old Debate is Stuck:**
          *   Show how Anti-Reductionism works in Shared-Cost (The Hiking Brother). The risk *is* the guarantee.
          *   Show how Reductionism works in Split-Cost (The Used Car Salesman). Incentives are misaligned, so induction is needed.
          *   Claim: The dispute arises because philosophers pick their favorite intuition pumps and universalize them.

      *   **Argument Phase 2: Defending the Cost-Sharing Principle (CSP):**
          *   Explain *why* shared cost justifies belief. It's not magic; it's a signal of reliability. If you suffer when I lie/mess up, you are motivated to be right.
          *   Explain *why* split cost requires reduction. Without skin in the game, words are cheap.

      *   **Argument Phase 3: Stress-Testing the Hard Cases (The Core Requirement):**
          *   *Case 1: The Disinterested Stranger (Tourist asking directions).*
              *   *Challenge:* No cost to them either way. CSP says "Split Cost" (low trust). But intuition says "Ask and believe."
              *   *Response:* Refine "Cost." It's not just physical/financial. It's *social* cost or *normative* cost. Lying violates a norm. Even strangers have a tiny stake in not being liars. But admit: CSP lowers the default here compared to the brother. It requires a "weak reductionism" (general background reliability of humans).
              *   *Damage:* CSP might be too skeptical here. Needs a baseline "humanity" clause.

          *   *Case 2: The Hopeless Uncle (Shared cost, low competence).*
              *   *Challenge:* He sinks with me, but he's always wrong. CSP says "Trust," but he's unreliable.
              *   *Response:* Distinguish *Honesty* from *Competence*. Cost-sharing guarantees motivation for truth, not access to truth. CSP handles the honesty part; Reductionism is still needed for competence.
              *   *Damage:* CSP isn't a silver bullet. It solves the *moral hazard* problem, not the *epistemic access* problem.

          *   *Case 3: The Doctor (Reputation stake).*
              *   *Challenge:* Not physical cost, but professional cost. Is this Shared or Split?
              *   *Response:* It's Shared, but attenuated. Reputation is a proxy for future cost. If he kills you, he loses his license.
              *   *Nuance:* What if he's arrogant? The cost is distant. CSP requires assessing the *immediacy* of the cost.

          *   *Case 4: Mistaken Solidarity (The Cult Member/Fanatic).*
              *   *Challenge:* They think they share the cost, but they don't (or they value the wrong thing).
              *   *Response:* Subjective vs. Objective cost. If *they believe* they share the cost, they are motivated. But if their worldview is broken, their truth-tracking is broken.
              *   *Damage:* This is the weakest point for CSP. Shared delusion looks like shared cost. Need to flag this as a major vulnerability.

      *   **Conclusion:** Summarize the victory but own the scars. The CSP doesn't solve epistemology, but it solves the *testimony stalemate* by shifting focus from "Is testimony basic?" to "What are the incentives governing this speech act?"

  4.  **Refining the Tone:**
      *   Avoid overly academic jargon where possible, but keep the precision.
      *   Use the user's metaphors (hiking, used car).
      *   Ensure the "soft spots" are highlighted clearly, not glossed over.
