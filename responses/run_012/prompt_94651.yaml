  6.  **Final Polish:** Check flow and transitions. Ensure the ending lands on the "real argument with soft spots marked" request. (Proceed to generate output based on this structure.)

  *(Self-Correction Note during final review)*: I need to be careful not to turn CSP into just another form of Reductionism. The user wants to argue that CSP *resolves* the dispute. I need to maintain that in Shared-Cost cases, the cost-sharing *itself* provides the justification without needing a prior inductive survey (Anti-Reductionist win), whereas in Split-Cost, you do need the survey (Reductionist win). The synthesis is the context-sensitivity.

