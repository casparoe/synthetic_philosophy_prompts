  Here is a thought experiment that satisfies your constraints: the agent exhibits standard Ellsberg preferences individually, prefers the ambiguous bundle over the risky bundle, the bundle is **not** a sure thing (payoffs vary), and the bundle **retains ambiguity** (probabilities are still unknown intervals), yet the reversal holds.

  ### The Thought Experiment: The "Constrained Urns" Paradox

  **The Setup**
  You face two decision problems involving Urns and Payoffs. All urns contain 100 balls, colored either **Red** or **Black**. A ball is drawn at random from the chosen urn. If Red, you win $100; if Black, you win $0.

  *   **The Risky Source (Urn R):** You are told explicitly there are **50 Red** and **50 Black**. (Probability of Red = 0.5).
  *   **The Ambiguous Source (Urns A & B):** You are given two urns, A and B. You are **not** told the composition of either urn individually. However, you are given a **joint constraint**:
      > *"The **total** number of Red balls in Urn A plus Urn B is between **110 and 130**."*

  (Note: Since each urn has 100 balls, the total balls are 200. A total of 110–130 Reds means the pair is collectively biased toward Red, but you don't know how that bias is distributed.)

  **The Choices**

  1.  **Individual Choice 1:** Bet on Red from **Urn R** OR Bet on Red from **Urn A**.
  2.  **Individual Choice 2:** Bet on Red from **Urn R** OR Bet on Red from **Urn B**.
  3.  **Bundle Choice:** Bet on Red from **Urn A AND Urn B** (Sum of payoffs) OR Bet on Red from **Urn R AND Urn R'** (Two independent risky draws).

  **The Agent**
  The agent is a **MaxMin Expected Utility (MEU)** decision maker (Gilboa-Schmeidler). They evaluate acts by the *minimum* expected payoff across all priors consistent with the information. They are risk-neutral over money (linear utility).

  ---

  ### 1. Showing the Reversal

  **Step 1: Individual Evaluations (Ambiguity Aversion)**
  *   **Risky Act:** Probability of Red is known to be $0.5$.
      *   Expected Value = $0.5 \times \$100 = \$50$.
  *   **Ambiguous Act (Urn A):** What is the minimum probability of Red in Urn A ($p_A$)?
      *   We know $110 \le 100p_A + 100p_B \le 130$.
      *   To minimize $p_A$, we must maximize $p_B$. The max $p_B$ is $1.0$ (100 Reds).
      *   If $p_B = 1.0$, then $100p_A \ge 110 - 100 = 10$. So $p_A \ge 0.1$.
      *   The worst-case prior for Urn A is 10% Red.
      *   Min Expected Value = $0.1 \times \$100 = \$10$.
  *   **Preference:** The agent chooses **Urn R** ($50 > $10).
  *   *(Symmetry applies to Urn B; the agent chooses Risky over Ambiguous here too.)*

  **Step 2: Bundle Evaluations (The Flip)**
  *   **Risky Bundle:** Two independent draws from Urn R (50/50).
      *   Expected Number of Reds = $0.5 + 0.5 = 1.0$.
      *   Expected Payoff = $1.0 \times \$100 = \$100$.
  *   **Ambiguous Bundle:** One draw from Urn A + One draw from Urn B.
      *   Payoff depends on the total number of Reds drawn ($k \in \{0, 1, 2\}$).
      *   Expected Number of Reds = $p_A + p_B$.
      *   From the constraint, we know $(p_A + p_B) \in [1.1, 1.3]$.
      *   Crucially, **this sum is known to be at least 1.1** across *all* priors consistent with the information. The ambiguity about the *distribution* between A and B does not affect the *sum*.
      *   Min Expected Value = $1.1 \times \$100 = \$110$.
  *   **Preference:** The agent chooses the **Ambiguous Bundle** ($110 > $100).

  **Step 3: Verification of Constraints**
  *   **Is the bundle a sure thing?** No. The payoff is $0, $100, or $200 depending on the draw. It is a risky lottery, not a degenerate payoff.
  *   **Does ambiguity remain?** Yes. The probability of winning $200 is not known; the sum of probabilities is an interval $[1.1, 1.3]$. The agent still faces ambiguity, but the *lower bound* of that ambiguity is higher than the risky benchmark.

  ---

  ### 2. Isolating the Feature Doing the Work

  The reversal is driven by **Non-Rectangularity of the Prior Set** (or **Correlated Ambiguity**).

  In standard Ellsberg problems, the set of priors is *rectangular*: what you believe about Urn A is independent of what you believe about Urn B. The worst case for A is independent of the worst case for B. Therefore, $\min(E_A + E_B) = \min(E_A) + \min(E_B)$. In that standard case, diversification never helps enough to overtake a risky benchmark unless it creates a sure thing.

  In this experiment, the prior set is **constrained**. The agent's uncertainty about A is perfectly (negatively) correlated with their uncertainty about B regarding the *aggregate*.
  *   **Feature:** The ambiguity is about the **allocation** of probability mass, not the **aggregate** mass.
  *   **Mechanism:** Bundling averages out the allocation uncertainty. While the individual acts suffer from the worst-case allocation (A has only 10 Reds), the bundle is immune to the allocation risk because the constraint fixes the *sum*. The "worst case" for the bundle (110 Reds) is objectively better than the "certain case" for the risky benchmark (100 Reds).

  ---

  ### 3. The Defender's Attack

  A defender of ambiguity aversion as a stable trait (e.g., a proponent of MEU or Smooth Ambiguity) would attack the conclusion that the agent's *attitude* has reversed. They would argue the **object of choice** has fundamentally changed, not the preference parameter.

  **The Argument:**
  1.  **Ambiguity is Act-Relative:** Ambiguity is not a property of the urn; it is a property of the *act-state* description relative to the agent's information.
  2.  **Transformation of Ambiguity:** In the individual choice, the act "Bet on Urn A" is highly ambiguous because the prior set for $p_A$ is wide $[0.1, 1.0]$. In the bundle choice, the act "Bet on Urn A + Urn B" is **less ambiguous** (the prior set for $p_A + p_B$ is narrow $[1.1, 1.3]$).
  3.  **Stability:** The agent's *degree* of ambiguity aversion (the weight they place on the worst-case prior) has remained constant. They still apply the Min operator.
      *   Individually: $\min(p_A) = 0.1$.
      *   Bundled: $\min(p_A + p_B) = 1.1$.
  4.  **Conclusion:** The reversal is not a violation of rational stability; it is a demonstration of **Eventwise Separability Failure**. The defender would argue: *"You cannot test ambiguity aversion by comparing acts that have different ambiguity structures. The agent correctly identified that the bundle converts 'allocation ambiguity' into 'known aggregate bias.' They are consistently ambiguity averse; they simply prefer a less ambiguous act (the bundle) to a more ambiguous act (the individual), and in this specific construction, the less ambiguous act happens to have a higher worst-case mean than the risky benchmark."*

  **The Core Dispute:**
  *   **Critic (You):** The agent preferred Ambiguity over Risk in the bundle, contradicting their preference for Risk over Ambiguity in the parts.
  *   **Defender:** The agent preferred **Low Ambiguity + High Mean** (Bundle) over **Zero Ambiguity + Lower Mean** (Risky). They still dislike Ambiguity, but they like Money more. The trait is stable; the trade-off shifted because the bundle reduced the ambiguity penalty.
