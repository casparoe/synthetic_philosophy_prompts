      *   *Is the Bundle a sure thing?* The *expected value* is sure (1.2), but the *realization* is not. You get 0, 1, or 2 dollars depending on the draw. It is not a degenerate lottery. It is a risky lottery with mean 1.2.
      *   The Risky Bundle is a risky lottery with mean 1.0.
