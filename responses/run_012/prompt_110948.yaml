      *   So the Ambiguous Acts, when bundled, *transform into a Risky Act* (known distribution) that is *superior* to the Benchmark Risky Act.
      *   This fits the criteria:
          1.  Ambiguity Averse individually (prefer 50/50 to unknown $p$).
