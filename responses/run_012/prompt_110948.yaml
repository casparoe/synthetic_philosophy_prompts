      *   But we need Ambig Bundle > Risky Bundle.
      *   If Risky Bundle = 1 (Sure thing effectively, since mean is 1 and variance doesn't matter for EU linear), and Ambig Bundle = 1 (Sure thing effectively), they are equal.
