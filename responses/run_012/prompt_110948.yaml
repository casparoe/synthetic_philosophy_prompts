prompt: |-
  Construct a thought experiment where an agent who is ambiguity averse in the classic Ellsberg pairwise sense (prefers a 50/50 lottery to an ambiguous bet, for each of two bets separately) nevertheless takes the ambiguous side when the two bets are bundled — and the flip is not because the bundle is a sure thing, but because the two ambiguous events are complementary in a way that makes the worst cases non-overlapping. Then show the reversal, isolate the feature doing the work, and say how a defender of ambiguity aversion as a stable trait would attack it.

  Wait — but that IS the sure-thing case. Let me find a version where the bundle isn't a sure thing.

  Idea: three mutually exclusive events with unknown probabilities p1,p2,p3 (sum 1). Acts: bet on E1 (ambiguous), bet on E2 (ambiguous). Bundle: bet on E1 or E2 = "not E3", which has probability 1-p3, still ambiguous (unknown p3). Hmm, still ambiguous, but its worst-case is 1 (if p3 could be 0)? Under a set of priors, worst-case for "not E3" is 0 (p3=1). Not helpful.

  Idea with partial stakes: You can bet on E1 at odds, or E2 at odds. Each alone is evaluated pessimistically as worth < 50. But betting on both E1 and E2 (with the same stake split) yields a payoff that is at least min payoff in every state... no.

  OK here's a genuinely non-sure-thing hedge: The unknown is p. Bet 1 pays 100 if p > 0.5 (event E1), bet 2 pays 100 if p ≤ 0.5 (event E2). These partition. Bundle = sure thing. Same issue.

  To avoid "sure thing," make the two ambiguous acts hedge *partially*: unknown parameter p ∈ {low, high}, with two bets whose payoffs are negatively related across the parameter, so that the bundle's worst-case is strictly better than the worst-case of each act alone, but the bundle is not degenerate. Example: parameter p ∈ [0,1]; act A pays 100·p; act B pays 100·(1-p). Bundle pays 100 for sure — degenerate again. Because linear in p.

  Use a non-linear payoff: act A pays 100 if p ≥ 0.5, act B pays 100 if p ≥ 0.5 too? no.

  Honestly, the crispest and most defensible "flip" is exactly the complementary/sure-thing hedge. Maybe the specification shouldn't forbid that; instead, the interesting spec is that the flip must be *generated* by the ambiguity-aversion model's own logic and must be a genuine violation of a named separability condition (e.g., "eventwise separability" or "act-independence"). Then the "which feature does the work" is the non-separability + complementarity of the two ambiguous events. And the defender's reply is that this is just the familiar point that ambiguity aversion is about events not acts, or that the agent is really just choosing a sure thing, so no reversal of attitude is shown.
