answer: |-
  ### Desiderata for an Adequate Theory of Dirty Hands

  To function as a viable standard for cross-examination, a theory of dirty hands must satisfy the following seven requirements. Each is paired with the specific case or philosophical consideration that necessitates it.

  **1. The Normative Paradox Requirement**
  *   **Requirement:** The theory must explain how a single action can be *all-things-considered obligatory* (or politically justified) and *morally prohibited* (or ethically tainted) simultaneously.
  *   **Motivation:** The **Ticking Bomb Case**. If the act is simply "right," there is no dirt; if it is simply "wrong," it should not be done. An adequate theory must account for the leader who *must* torture to save the city but commits a moral violation in doing so.

  **2. The Moral Remainder Requirement**
  *   **Requirement:** The guilt incurred by the agent must be a genuine moral stain requiring atonement or punishment, not merely a psychological cost or a "price" to be weighed in a calculus.
  *   **Motivation:** Distinguishing from **Utilitarian Calculation**. If the guilt is just a negative utility to be offset by the lives saved, the hands are clean once the math is done. The theory must explain why the agent remains blameworthy even after succeeding.

  **3. The Integrity of the Refuser Requirement**
  *   **Requirement:** The theory must explain why we morally admire the agent who *refuses* to get their hands dirty, even when that refusal leads to a worse outcome.
  *   **Motivation:** The **Clean Hands Case**. If the dirty act is truly obligatory, the refuser is negligent. If the refuser is admirable, the act cannot be straightforwardly obligatory. The theory must accommodate the intuition that personal integrity has value independent of political consequence.

  **4. The Victim Status Requirement**
  *   **Requirement:** The theory must acknowledge that the victim of the dirty act is wronged in a way that cannot be fully redeemed by the public good, and must address whether consent could ever mitigate this wrong.
  *   **Motivation:** The **Wartime Bombing Case**. Civilians killed for the greater good are not merely obstacles; they are rights-bearers. The theory must specify what is owed to them (reparation, memory, apology) and prevent their treatment as mere fungible units.

  **5. The Epistemic Restraint Requirement**
  *   **Requirement:** The theory must provide strict criteria for verifying "necessity" to prevent the justification from being manufactured *ex post facto* to license desired actions.
  *   **Motivation:** The **Manufactured Necessity Worry**. Leaders often claim "dirty hands" to cover corruption or incompetence. The theory must distinguish between genuine tragic necessity and self-serving rationalization.

  **6. The Agent-Institution Distinction Requirement**
  *   **Requirement:** The theory must distinguish between the moral liability of the individual agent and the authorization or profit of the institution (state, party, bureaucracy).
  *   **Motivation:** The **Legislator Case**. A state may benefit from a lie that secures a just law, but the lie attaches to the legislator. The theory must prevent the institution from absorbing the guilt in a way that exonerates the individual soul.

  **7. The Categorial Distinction Requirement**
  *   **Requirement:** The theory must distinguish dirty hands from ordinary moral tragedy (where no one is at fault), hard choices between permissible options, and mere agent-regret.
  *   **Motivation:** **Conceptual Clarity**. In a tragedy, fate causes harm; in a hard choice, both options are allowed. Dirty hands requires that the agent *chooses* a forbidden option. The theory must isolate this specific category of fault.

  ***

  ### Structural Tensions and Incompatibilities

  You are correct to suspect that these requirements pull against one another. The central tension lies between **Requirement 1 (Normative Paradox)** and **Requirement 2 (Moral Remainder)**, mediated by **Requirement 3 (Integrity of the Refuser)**.

  *   **The Logical Contradiction:** Requirement 1 demands that an act be both obligatory and prohibited. In classical moral logic, "ought implies can," and one cannot be obligated to do what is forbidden. To satisfy this, a theory must either abandon classical logic (accepting a true contradiction) or bifurcate morality into two spheres (e.g., "political morality" vs. "personal morality").
  *   **The Collapse Risk:** If you resolve the paradox by saying the act is *actually* right (prioritizing Requirement 1's "obligatory" clause), you collapse into **Consequentialism**, violating Requirement 2 (there is no genuine remainder) and Requirement 3 (the refuser is no longer admirable). If you resolve it by saying the act is *actually* wrong (prioritizing Requirement 1's "prohibited" clause), you collapse into **Strict Deontology**, violating Requirement 1's "obligatory" clause (the leader should not do it).
  *   **The Victim Tension:** Requirement 4 (Victim Status) conflicts with Requirement 1. If the victim has an absolute right not to be sacrificed, the act cannot be obligatory. If the act is obligatory, the victim's right is overridden, threatening their status as an end-in-themselves.

  ***

  ### Assessment of Leading Positions

  | Position | Satisfies Paradox? | Satisfies Remainder? | Satisfies Refuser? | Primary Failure Point |
  | :--- | :--- | :--- | :--- | :--- |
  | **Strict Prohibition** (Kantian) | No (Act is forbidden) | Yes | Yes | Fails **Req 1**: Cannot account for political necessity/obligation in extreme cases. |
  | **Consequentialism** (Utilitarian) | No (Act is required) | No | No | Fails **Req 2 & 3**: Eliminates dirt and makes the refuser irrational. |
  | **Tragic Remainder** (Walzer/Williams) | Yes (Dialectical) | Yes | Yes | Fails **Logical Coherence**: Accepts contradiction, struggles with **Req 5** (Epistemic Restraint). |

  ***

  Verdict: The list is not jointly satisfiable within classical moral logic, with the Normative Paradox Requirement doing the most work to rule out both pure consequentialist and strict deontological accounts.
