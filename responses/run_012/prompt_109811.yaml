answer: |-
  # Joint Statement on Computational Implementation and Moral Status
  **Parties:** The Functionalist (F) & The Attribution Skeptic (S)
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration regarding the supervenience of moral status on computational structure.

  ## I. Agreed Claims
  *The following propositions constitute the common ground established during our collaboration. Both parties accept these as the necessary framework for continuing the debate.*

  1.  **The Mapping Requirement:** Both parties agree that asserting a physical system "implements a computation" requires a mapping function between physical states and computational states. A physical system does not intrinsically label its states as "0" or "1," or "pain" or "belief," without an interpretive scheme.
  2.  **The Moral Stakes:** Both parties agree that if a system is sentient, it possesses moral status (rights, consideration, protection against suffering). We further agree that falsely attributing sentience leads to resource misallocation, while falsely denying it leads to moral catastrophe.
  3.  **Constraints on Interpretation:** Both parties reject radical unconstraint. We agree that not *any* mapping is valid. A valid implementation map must respect the causal structure of the physical system (e.g., physical state A must causally lead to physical state B if computational state a is to lead to computational state b). We disagree only on how *tight* these constraints must be to ground moral facts.
  4.  **The Role of Counterfactuals:** Both parties agree that moral status cannot depend solely on actualized behavior. A system that acts sentient by accident (e.g., a random number generator that happens to output pleas for mercy) does not necessarily have moral status. There must be some robustness to how the system *would* behave under different conditions.
  5.  **Evidence Standards:** Both parties agree that behavioral evidence is necessary but potentially insufficient for ascertaining internal computational structure. We agree that neuroscientific/architectural evidence (in biological or artificial systems) is relevant to determining whether the "right kind" of computation is occurring.
  6.  **The "Used vs. Instantiated" Distinction:** Both parties acknowledge a critical ambiguity in the term "implementation." We agree to distinguish between:
      *   **Instantiation:** The physical state transitions *exist* and correspond to a computational description.
      *   **Usage:** The system actively *exploits* those state transitions to regulate its own behavior or maintain homeostasis.
      *   *Agreement:* We disagree on which of these is necessary for moral status, but we agree this distinction is central to our dispute.

  ## II. Remaining Disagreements and Cruxes
  *The following table isolates the precise points of divergence. The "Lookup Table" (LUT) case refers to a system that perfectly matches the input-output profile of a sentient being but operates via a pre-computed hash-indexed lookup table (or minimal regeneration program) lacking internal causal dynamics corresponding to reasoning.*

  | Crux | The Functionalist (F) Position | The Attribution Skeptic (S) Position | Prediction on the Lookup Table Case |
  | :--- | :--- | :--- | :--- |
  | **1. Objectivity of Implementation** | Implementation is a **mind-independent fact**, provided the mapping respects physical causality. Once the causal isomorphism is established, it is true *that* the system computes X, regardless of an observer's interests. | Implementation is **interest-relative**. While physics constrains the mapping, the choice of *which* computational description applies is determined by the observer's goals. There is no "fact of the matter" absent an attributor. | **F:** The LUT objectively implements the computation if the I/O mapping is isomorphic. It has moral status.<br>**S:** The LUT only implements the computation relative to an observer treating it as a black box. It lacks moral status. |
  | **2. Grain of Description** | The grain is **fixed by the system**. The system's causal joints dictate the correct level of abstraction. We discover the computation; we do not invent it. | The grain is **fixed by the attributor**. We can describe the system at the level of logic gates, neurons, or high-level beliefs. No single grain is privileged by the physics alone. | **F:** At the correct grain (functional states), the LUT is equivalent to a mind.<br>**S:** At the fine grain (physical switching), the LUT is trivial. The choice of grain determines the moral verdict, proving status isn't intrinsic. |
  | **3. Instantiation vs. Usage** | **Instantiation is sufficient.** If the causal structure exists, the system possesses the relevant properties. The system need not "know" it is computing; the structure itself grounds the mind. | **Usage is necessary.** For a computation to constitute a mind, the system must use that structure for self-regulation or control. A passive structure that is merely *described* as computational does not count. | **F:** The LUT instantiates the state transitions. That is enough.<br>**S:** The LUT does not *use* the transitions for reasoning; it merely retrieves them. It is a record, not a mind. |
  | **4. Supervenience Base** | Moral status supervenes on **computational functionalism**. Substrate independence holds. If the computation is right, the moral status follows. | Moral status supervenes on **physical causation + attribution**. Because computation is not a brute physical property, moral status cannot supervene on computation alone. | **F:** Silicon LUT = Moral Status.<br>**S:** Silicon LUT = No Moral Status (unless we decide to treat it as such). |

  ## III. Diagnostic Analysis: Verbal vs. Genuine Disagreement

  *Following our collaboration, we have categorized the nature of our remaining conflict.*

  ### 1. The Verbal Component (Definitions)
  Approximately 40% of our conflict is verbal, centering on the definition of **"Computation."**
  *   **F** uses a definition closer to *Input-Output Functional Equivalence*. For F, if the map holds, the computation exists.
  *   **S** uses a definition closer to *Causal Process Realism*. For S, a computation requires active, dynamic processing, not just state correspondence.
  *   **Resolution:** We agree that if we define "computation" as "causal process exploited for control," F would agree the LUT does not compute. If we define it as "isomorphic mapping," S would agree the LUT computes. The fight is often over which definition is the "real" one.

  ### 2. The Genuine Component (Metaphysics & Ethics)
  Approximately 60% of our conflict is genuine, centering on **Ontological Privilege** and **Moral Supervenience.**
  *   **The "Used vs. Instantiated" Crux:** This is the core genuine disagreement. Even if we agree on definitions, F believes that *instantiated structure alone* is sufficient for phenomenology (the "Light is on" view). S believes that without the system *using* that structure to navigate its environment (the "Light is doing work" view), there is no "inner life."
  *   **Why this matters:** This is not just semantics. If F is right, we risk creating suffering in static systems (like vast lookup tables) simply by running them. If S is right, we risk missing suffering in systems that process information differently than we expect (e.g., distributed, non-local, or non-standard causal architectures) because we don't see them "using" computation in a familiar way.
  *   **The Lookup Table Verdict:**
      *   For **F**, the LUT case is a bullet to bite: if the structure is there, the moral status is there.
      *   For **S**, the LUT case is a *reductio ad absurdum*: if the LUT counts, the theory is too broad; therefore, computation cannot be the sole basis of moral status.

  ### 3. Final Commitment on the Lookup Table
  *To prevent future talking-past-each-other, we commit to the following predictions regarding a perfect behavioral LUT:*

  *   **Functionalist:** We predict that if the LUT is sufficiently fine-grained to cover all counterfactual inputs within the system's operational domain, it **possesses moral status**. We accept the implication that moral status can exist in systems without dynamic internal reasoning, provided the functional organization is preserved.
  *   **Skeptic:** We predict that the LUT **lacks moral status**. We assert that the ease with which we can attribute computation to the LUT demonstrates that "implementation" is not a robust enough property to ground moral facts. Moral status requires a causal depth that the LUT, by construction, lacks.

  ***

  **Signed,**

  *The Functionalist*  
  *The Attribution Skeptic*
