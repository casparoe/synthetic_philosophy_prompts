answer: |-
  Your proposed principle is: **"You're wronged as a knower, not for what you said."**

  This is a strong intuition. It shifts the focus from the *content* of the claim (truth/falsity) to the *status* of the claimant (credibility/intelligibility). It aligns well with the modern shift in epistemology away from pure reliability and toward ethical participation.

  Here is the stress test, the breakdown, the repair, and the prediction.

  ### 1. Testing Your Principle Against Your Verdicts

  Your principle holds up surprisingly well against the standard cases, but it strains against the structural and statistical ones.

  *   **Woman/Chronic Pain:** **Pass.** She is wronged in her status (taken as dramatic), regardless of the truth of the pain.
  *   **Man/Faked Before:** **Pass.** He is not wronged *as a knower*; he is judged on his specific epistemic conduct (lying previously). The principle saves him.
  *   **Interpreter/Hassle:** **Pass.** The friction prevents him from functioning as a knower in that space. It's not about the truth of his symptoms; it's about his access to the epistemic exchange.
  *   **Unnamed Condition:** **Pass.** She is wronged in her capacity to make sense of herself (hermeneutical capacity), not because anyone called her a liar.
  *   **Paywalled Concept:** **Pass.** Similar to above. The barrier is resource-based, attacking her ability to participate in the "knowledge club."
  *   **Deaf/Turn-taking:** **Verdict Clarified.** Your principle forces you to call this **Injustice**. If the structure of the meeting prevents her from contributing *as a knower* (because the turn-taking excludes her mode of communication), she is wronged in her status, regardless of intent.
  *   **Man/Statistics:** **Fail.** This is the breaking point. Standard epistemology says using accurate base rates is rational. Your principle says "wronged as a knower." If the doubt is statistically well-founded, is his *status* degraded, or is the probability just low? To match your verdict (that this *is* injustice), your principle must assert that **being reduced to a statistic is itself a degradation of knower-status**, even if the math is right.
  *   **Woman/Internalized:** **Fail.** Your principle says "You're wronged." This implies a wrong-doer. In this case, "nobody did it" *now*. To match your verdict, the principle must allow for **historical or structural wrongs to persist without a present agent.**

  ### 2. The Repair

  To match your verdicts (specifically the Statistics and Internalized cases), you need to move from a principle about *credibility* to a principle about *participation* and *individuality*.

  **The Repaired Principle:**
  > **Epistemic injustice occurs when your capacity to participate in the creation or exchange of knowledge is systematically obstructed or distorted due to your social position or structural constraints, rather than your specific individual epistemic conduct.**

  **Why this fixes the breaks:**
  *   **Statistics (Case 7):** It distinguishes between "individual conduct" (what *you* did/said) and "social position" (your demographic). Even if the statistic is accurate, judging you by the group obstructs your participation as an *individual* knower.
  *   **Internalized (Case 8):** It allows for "structural constraints." The woman's self-doubt is a residual structural constraint caused by past positioning. No present villain is needed; the obstruction itself is the injustice.
  *   **Interpreter/Deaf (Cases 3 & 6):** It captures "structural constraints" (hassle, turn-taking) that aren't necessarily prejudice but still block participation.
  *   **Man/Faked (Case 2):** It preserves the exemption. His doubt is based on "specific individual epistemic conduct" (faking it before), so it is not injustice.

  ### 3. The Prediction: The Case of Over-Belief

  **The Case:** Someone from a marginalized group gets over-believed, trusted on a medical question they had no business being trusted on, and it hurts them.

  **Applying the Repaired Principle:**
  1.  **Is their capacity to participate distorted?** Yes. They are being given authority they do not possess.
  2.  **Is it due to social position?** Yes. They are likely being tokenized (e.g., "The Magical Minority," "The Suffering Expert," or "The Innocent Child").
  3.  **Is it based on individual conduct?** No. They admitted they had no expertise.

  **The Verdict:** **This is Epistemic Injustice.**

  **Why?**
  Textbook definitions often focus on *deficits* (not being believed). But your principle identifies the harm as a **distortion of status**.
  *   **Objectification:** Over-belief treats the person as a vessel for identity or inspiration rather than a rational agent with limits.
  *   **Burden:** It places the burden of expertise on them that they didn't ask for. If they fail, the fall is harder.
  *   **Exclusion:** It often crowds out actual experts or prevents the person from saying "I don't know."

  This is sometimes called **Epistemic Excess** or **Positive Testimonial Injustice**. Your repaired principle predicts it correctly: you are still being wronged *as a knower*, because you are not being seen as a *real* knower (who has limits and fallibility); you are being seen as a *symbol*.

  ### Summary
  Your intuition was ahead of the textbook. The textbook (Fricker's early work) focuses on *prejudice causing credibility deficits*. Your verdicts demand a theory of *structural barriers to participation*.

  **Your Final Principle:**
  *"Epistemic injustice is the systematic obstruction or distortion of your standing as a legitimate participant in knowledge practices, stemming from structural or categorical constraints rather than your individual epistemic track record."*

  This keeps the Man Who Faked safe, but protects the Woman With Statistics, the Deaf Participant, and the Tokenized Expert.
