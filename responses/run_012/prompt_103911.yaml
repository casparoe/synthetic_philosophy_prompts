answer: |-
  You are not manufacturing distinctions. You have identified a hierarchy of unpredictability that is often blurred in informal discussion but is rigorously distinct in dynamical systems theory and computability theory. Your intuition that the first obstacle is *epistemic* (about knowledge) and the second is *ontological* or *structural* (about the system's logic) is correct.

  The field does have names for these, but they are often used loosely. To give you the "carving" you request, we must separate three distinct layers: **Lyapunov Instability** (your first obstacle), **Computational Irreducibility** (the "no shortcut" clause of your second), and **Undecidable Dynamics** (the "logical limit" clause of your second).

  Here is the carving of the phenomena.

  ---

  ### 1. The First Obstacle: Lyapunov Instability (Chaos)

  **Established Name:** Deterministic Chaos (specifically, Sensitive Dependence on Initial Conditions).

  **What it consists in:**
  This is a property of the *metric* structure of the state space. Two points $x_0$ and $y_0$ separated by a distance $\epsilon$ diverge exponentially over time: $|x_t - y_t| \approx \epsilon e^{\lambda t}$, where $\lambda > 0$ is the Lyapunov exponent.

  **What it does not:**
  It does not imply that the system is logically complex. It does not imply that the system is hard to compute. It implies only that *uncertainty* amplifies.

  **The Boundary:**
  *   **Vs. Precision:** As you noted, this obstacle dissolves with perfect precision. If you know $x_0$ to infinite precision, you know $x_t$ to infinite precision (assuming the map is computable).
  *   **Vs. Irreducibility:** Crucially, a system can be chaotic but *computationally reducible*.
      *   *Example:* The Bernoulli Shift ($x_{n+1} = 2x_n \mod 1$). This is a classic chaotic system (it mixes, it has positive Lyapunov exponent). However, it is computationally trivial. If you write $x_0$ in binary, the state at time $t$ is simply the binary string shifted left by $t$ positions. You do not need to simulate the system step-by-step; you can compute the state at $t=10^{100}$ instantly by bit-shifting.
      *   *Conclusion:* Chaos is about the *amplification of error*, not the *complexity of calculation*.

  ### 2. The Second Obstacle, Part A: Computational Irreducibility

  **Established Name:** Computational Irreducibility.

  **What it consists in:**
  This is a property of the *algorithmic* complexity of the time-evolution function. A system is computationally irreducible if there exists no algorithm that can compute the state $x_t$ significantly faster than the system takes to evolve to $x_t$ itself. If the system takes $t$ steps to evolve, any algorithm to predict $x_t$ requires $\Omega(t)$ steps.

  **What it does not:**
  It does not necessarily imply that questions about the system are *undecidable*. It implies they are *expensive*. It is a claim about computational complexity (time/space resources), not computability (existence of an algorithm).

  **The Boundary:**
  *   **Vs. Mere Expense:** "Mere expense" implies a polynomial overhead (e.g., simulation takes $t$ steps, prediction takes $t^2$). Irreducibility implies you cannot beat the linear time of the simulation itself. There is no closed-form solution, no "formula" for $x_t$.
  *   **Vs. Chaos:** As shown with the Bernoulli shift, you can have Chaos without Irreducibility. Conversely, you can have Irreducibility without Chaos (e.g., a Turing machine counting in binary is irreducible—you must run the carry operation step-by-step—but it is not chaotic in the Lyapunov sense).
  *   **Vs. Undecidability:** Irreducibility applies to finite time $t$. It says "predicting $t$ is hard." It does not say "predicting infinity is impossible."

  ### 3. The Second Obstacle, Part B: Undecidable Dynamics

  **Established Name:** Undecidable Dynamics (or Algorithmic Undecidability in Dynamical Systems).

  **What it consists in:**
  This is a property of *decision problems* regarding the system's orbit. It asserts that for certain predicates $P$ (e.g., "Does the trajectory ever enter region $R$?"), there is no algorithm that can return TRUE or FALSE for all initial conditions $x_0$. This is a direct mapping of the Halting Problem into continuous or discrete dynamics.

  **What it does not:**
  It does not apply to the state at a *finite* time $t$. The state $x_t$ at a specific finite $t$ is always computable if the update rule is computable. Undecidability arises only when asking about the *limit behavior* or *existence* of events over an infinite horizon.

  **The Boundary:**
  *   **Vs. Irreducibility:** Undecidability is the stronger claim. If a property is undecidable, the system is necessarily irreducible regarding that property (you can't shortcut a halting check). However, a system can be irreducible (hard to predict) without being undecidable (we might know it *eventually* does something, just not when).
  *   **Vs. Precision:** As you noted, infinite precision does not help. This is not a measurement problem; it is a logical impossibility.

  ---

  ### The Carving: A Matrix of Distinctions

  To answer your specific request on how to carve these away from surrounding notions, here is the taxonomy:

  | Feature | **Lyapunov Instability** (Obstacle 1) | **Computational Irreducibility** (Obstacle 2a) | **Undecidable Dynamics** (Obstacle 2b) |
  | :--- | :--- | :--- | :--- |
  | **Nature of Limit** | **Epistemic.** Limited by knowledge of state. | **Complexity.** Limited by time/resources. | **Logical.** Limited by provability. |
  | **Role of Precision** | Critical. Infinite precision solves it. | Irrelevant. Perfect state known, still hard. | Irrelevant. Perfect state known, still impossible. |
  | **Time Horizon** | Finite (Predictability Horizon). | Finite (State at time $t$). | Infinite (Asymptotic behavior). |
  | **Mathematical Domain** | Analysis / Metric Topology. | Computational Complexity. | Computability Theory. |
  | **Dissolves with...** | Better measurement. | None (intrinsic cost). | None (intrinsic logic). |
  | **Example** | Weather (Lorenz attractor). | Rule 110 Cellular Automaton. | Generalized Billiards / Hybrid Systems. |

  ### Are these distinctions made in the field?

  **Yes, but they are frequently conflated in popularization.**

  1.  **Chaos vs. Complexity:** In the 1980s and 90s, "Chaos Theory" became a catch-all for "unpredictable deterministic systems." This obscured the distinction between Lyapunov instability and Computational Irreducibility. Stephen Wolfram's *A New Kind of Science* (2002) aggressively popularized "Computational Irreducibility" specifically to distinguish it from Chaos. He argued that Chaos is about *numerical* sensitivity, while Irreducibility is about *informational* density. The academic consensus accepts this distinction: Chaos is a dynamical property; Irreducibility is a computational one.
  2.  **Irreducibility vs. Undecidability:** In theoretical computer science and logic, these are distinct. Undecidability is a binary property (an algorithm exists or it does not). Irreducibility is often a complexity class property (does an $O(t)$ algorithm exist?). However, in physics literature, "undecidable dynamics" (pioneered by Cristopher Moore in 1990) is treated as the extreme limit of irreducibility.
  3.  **The "Single Concept" Fear:** You asked if you are manufacturing distinctions where there is only one concept. You are not. There are at least two, arguably three.
      *   If the system is **Chaotic but Reducible** (Bernoulli Shift), Obstacle 1 exists, Obstacle 2 does not.
      *   If the system is **Stable but Irreducible** (a complex cryptographic cipher), Obstacle 1 does not exist (nearby states stay nearby), but Obstacle 2 does (you can't predict the output without the key/steps).
      *   If the system is **Undecidable** (a universal Turing machine embedded in a flow), Obstacle 2b exists.

  ### Summary of the Phenomenon You Care About

  The phenomenon you "actually care about" (Obstacle 2) is best described as **Algorithmic Unpredictability**.

  It is not a single term because it spans two layers of the Chomsky/Computability hierarchy:
  1.  **Incompressibility (Irreducibility):** The system's time-evolution cannot be compressed into a formula $f(t, x_0)$. The shortest program to output $x_t$ is the simulation itself.
  2.  **Uncomputability (Undecidability):** The system's limit sets cannot be characterized by any algorithm.

  **Recommendation for Naming:**
  If you need to refer to the union of these two (the "no shortcut, logical limit" concept) in contrast to Chaos, the most precise phrase is **"Intrinsic Computational Complexity"** or **"Algorithmic Dynamics."**

  However, to maintain the rigor you seek, you should explicitly distinguish:
  *   **Predictability Horizon** (Chaos/Epistemic)
  *   **Computational Cost** (Irreducibility/Complexity)
  *   **Decision Solvability** (Undecidability/Logic)

  Your carving is correct. The first is a limit of *measurement*; the second is a limit of *mathematics*. Conflating them is a category error.
