prompt: |-
  I've been going down a rabbit hole on mind uploading, specifically the gradual-replacement version, the one where you swap out the brain bit by bit, each new part doing exactly what the old part did, so at no point does the person seem to notice anything. My friend and I have been arguing about it for months and we've basically stopped getting anywhere. She thinks the person obviously survives, same process, same memories, same personality, no seam anywhere. I think what you end up with is a copy and the original stream of experience is over, maybe at some point in the middle, and I can't tell whether we're actually disagreeing about anything or just using "me" in seperate senses.

  Here's the version of the case that made it worse for us. While you're replacing things you don't throw the old parts away: you keep them alive in a vat, wired together the same way they were in the skull, so at the end you've got the silicon brain in the head and the original biological brain sitting in the vat, both running, both insisting they're me, both remembering everything. And at each step you run the new part alongside the old one for a while before disconnecting the old one, so for a stretch there are two things doing the same job at once.

  Can you write the joint statement my friend and I could both actually sign? I want the claims we both agree on, including about the vat case and the overlap stretch, because I suspect we agree on more than we think. Then the exact places we still disagree, each one worded so that whoever holds it would say yes, that's my view. Then the cruxes, the sub-questions where settling it would actually move one of us, and for each crux a case or argument we'd both agree is relevant, with each of our predictions written down in advance. Number the agreed claims and put the disagreements in a table. If part of our fight is really just a fight about words, say which part and why. No reading list or citations please, we're not academics, just the document.
