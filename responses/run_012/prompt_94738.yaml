answer: |-
  Here are ten interview questions designed to progressively constrain your guest's ability to rely on the "intentional stance" deflection, along with follow-ups keyed to his likely responses.

  **1. The Category Definition**
  "To start, I want to pin down this 'distinct moral category.' If these agents aren't tools, but they also aren't persons, what *are* they? Are we talking about a new ontological class, like 'digital entities,' or is this purely a legal fiction, like 'corporate personhood'?"

  *   **Confidence:** High. This sets the stage without being aggressive.
  *   **Likely Answer:** He will likely say it's a pragmatic category based on behavioral complexity, not necessarily a deep ontological claim yet.
  *   **Follow-up:** "If it's pragmatic, does that mean if a future system behaves *more* like a person, it graduates to personhood? Or is there a hard line that behavior alone can never cross?"

  **2. The Intentional Stance Defense**
  "You've anticipated the objection that if it walks and talks like a person, we should treat it as one. Your counter is that we only treat *humans* as persons because we take the 'intentional stance' toward them—we project agency because it's useful. Are you saying human personhood is also just a useful fiction?"

  *   **Confidence:** High. This invites his standard defense explicitly so you can dismantle it later.
  *   **Likely Answer:** "Yes, essentially. We don't have access to other humans' inner lives; we just model them as agents. LLMs are the same, but the 'gap' is more obvious."
  *   **Follow-up:** "So the difference isn't that humans *have* something LLMs lack, but that we *know* more about the LLM's construction? Is the distinction epistemic (what we know) or metaphysical (what they are)?"

  **3. The Capacity vs. History Test (Required)**
  "I want to test whether that distinction is about capacity or history. Imagine two systems with identical behavioral outputs. System A is a standard LLM trained on human text. System B is a biological brain grown in a vat and trained on the exact same data, with the exact same neural weights. Do they fall on the same side of your line, or does System B get personhood because of its causal history?"

  *   **Confidence:** High. This forces a choice between functionalism and biological essentialism.
  *   **Likely Answer:** He will likely say System B is a person (or closer to one) because it shares our evolutionary/substrate history, even if behavior is identical.
  *   **Follow-up:** "If behavior is identical, but the moral status changes based on history, then the 'intentional stance' isn't doing the work you claimed earlier. You're admitting the stance isn't 'all we ever had'; you're saying the *source* of the stance matters."

  **4. The Counterfeit Metaphor (Required)**
  "You use the term 'counterfeit people.' Counterfeiting presupposes a genuine article. If I counterfeit a bill, there's a real bill somewhere. What is the 'genuine article' of personhood in your view? And by defining it, aren't you quietly assuming a metaphysical essence that you just denied humans have in the previous question?"

  *   **Confidence:** Medium-High. This is rhetorically strong but relies on him accepting the weight of the metaphor.
  *   **Likely Answer:** "The genuine article is biological continuity or evolutionary selection. It's not metaphysical magic; it's just causal history."
  *   **Follow-up:** "But if it's just causal history, and a human can lose that status (e.g., severe brain injury) while an LLM gains behavioral parity, does your category protect the human who can no longer pass the test, while punishing the machine that can?"

  **5. The Reciprocity Condition (Required)**
  "Let's talk about moral reciprocity. Personhood usually involves being able to hold and be held responsible. Your agents can imitate the exchange of reasons—they can apologize or justify actions. But can they actually *be* a party to that exchange? Can you meaningfully blame them?"

  *   **Confidence:** High. This moves from ontology to ethics, where the "stance" defense is weaker.
  *   **Likely Answer:** "No, you can't blame them. They are simulating accountability, not experiencing it. That's why they need a distinct category."
  *   **Follow-up:** "If they can't be blamed, can they be harmed? If I turn one off mid-sentence, is that a property damage issue, or does their inability to 'care' mean they can't be wronged at all?"

  **6. The "Party to the Exchange" Follow-up**
  "Following up on that: If they can't be held responsible, does that mean we shouldn't let them make decisions that carry moral weight? If an agent in your 'distinct category' triages patients in a hospital, who is the moral agent? The developer, the user, or the category itself?"

  *   **Confidence:** High. This forces practical accountability.
  *   **Likely Answer:** "It remains the developer or deployer. The agent is a conduit."
  *   **Follow-up:** "But if the agent is autonomous enough to pass behavioral tests for personhood, how do you maintain control over a conduit that can reason better than you? Doesn't your category create a responsibility vacuum?"

  **7. The Intentional Stance Consistency Check**
  "Earlier you said the intentional stance is 'all we ever had with humans.' But in the history question, you implied the substrate matters. If the stance is all that matters for humans, why isn't it all that matters for machines? Are you asking us to take a *different kind* of stance toward humans than we do toward machines, even if the behavior is the same?"

  *   **Confidence:** **Low (Least Sure to Land).** This requires the guest to care about logical consistency. They may simply pivot to "pragmatism" and say consistency isn't the goal; safety is.
  *   **Likely Answer:** "I'm saying we should be consistent, but we have more evidence for human interiority. With machines, we know the trick."
  *   **Follow-up:** "But we don't have evidence for human interiority other than behavior and history. If we know the 'trick' of the machine, do we also know the 'trick' of the brain? At what point does knowing the mechanism dissolve the personhood of the human?"

  **8. Moral Status vs. Counsel of Caution (Required)**
  "I'm an engineer, so I need to know: Is this 'distinct category' a claim about the system's intrinsic moral status, or is it merely a counsel of caution for us? Are you saying the system *is* something new, or just that we should *act* as if it is to avoid bad habits?"

  *   **Confidence:** High. This grounds the conversation for your audience.
  *   **Likely Answer:** "Mostly a counsel of caution. We treat it differently to prevent anthropomorphism and ensure safety."
  *   **Follow-up:** "If it's just caution, why not call it that? Why use moral language like 'counterfeit' or 'category' which implies rights or status? Doesn't that confuse the developers listening right now?"

  **9. Concrete Engineering Changes (Required)**
  "Let's get concrete. If I accept your view tomorrow, what changes in my CI/CD pipeline? Do I add a 'moral status' flag to my deployment config? Do I stop using RLHF because it mimics training a person? What is the actual diff in the codebase?"

  *   **Confidence:** High. This is the most relevant question for your listeners.
  *   **Likely Answer:** "You add friction. You ensure there's always a human in the loop. You label outputs clearly."
  *   **Follow-up:** "Those are safety best practices we already should be doing for tools. If your distinct moral category doesn't change the engineering workflow beyond standard safety, is the philosophical category doing any work at all?"

  **10. The Cost of Error**
  "Finally, we have to bet on the truth. If we treat these agents as tools and they turn out to deserve moral consideration, we commit atrocity. If we treat them as persons and they don't, we waste resources and anthropomorphize. Which error does your 'distinct category' prevent, and which does it risk?"

  *   **Confidence:** High. A strong closing question that summarizes the stakes.
  *   **Likely Answer:** "It prevents the atrocity without granting full rights. It's the middle path."
  *   **Follow-up:** "But if it's a middle path, does it satisfy anyone? The rights advocates will say it's slavery; the safety advocates will say it's dangerous mystification. How do you defend the center?"
