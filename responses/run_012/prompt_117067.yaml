answer: |-
  # The Undrawn Paper: On the Status of the Inviolate Level

  M.C. Escher's lithograph *Drawing Hands* presents a visual paradox that has become the emblem of self-reference. Two hands emerge from a flat sheet of paper, cuffs drawn and sleeves sketched, each holding a pencil and drawing the other. The image creates a tangled hierarchy: Hand A draws Hand B, which draws Hand A. Yet, as Douglas Hofstadter noted in *Gödel, Escher, Bach*, the loop is not truly closed. It is held together by an "inviolate level"—the paper, the ink, and the artist's hand—which is not itself depicted as drawn. This inviolate level provides the ontological ground that allows the paradox to exist without collapsing into nothingness.

  The philosophical controversy arises when we transpose this visual metaphor into the realm of logic and formal systems. Is the inviolate level a genuine structural feature of self-referential systems, a necessary rung on a ladder of truth? Or is it merely an artifact of describing these systems in a language that imposes a hierarchy where none structurally exists? To resolve this, we must examine the arithmetization of syntax. When a formal system's metalevel is coded into its object level, the old inviolate level appears to be swallowed by the tangle. This essay argues that the inviolate level is not a structural feature of the system but an artifact of hierarchical description. The regress of levels is theoretically endless, rendered relative rather than absolute; it is halted not by a structural ceiling, but by the pragmatic fiat of the interpreter.

  ### The Swallowing of the Metalevel

  The central test case for this controversy is Kurt Gödel's incompleteness theorems, specifically the technique of arithmetization. In a formal system like *Principia Mathematica*, there is traditionally a distinction between the object level (the mathematical statements) and the metalevel (the reasoning about those statements). The metalevel is typically viewed as inviolate; it is the logic we use to prove things about the system, assumed to be consistent and outside the system's potential errors.

  Gödel shattered this distinction by assigning a unique number to every symbol and statement in the formal system. Through this coding, statements about the system's syntax (metamathematics) could be translated into statements about numbers (arithmetic). Suddenly, the metalevel was not a separate, inviolate plane; it was mapped directly onto the object level. A statement could now assert its own unprovability. The "hand" that was supposed to be drawing the other was revealed to be made of the same ink as the hand it was drawing.

  This collapse suggests that the inviolate level is an artifact. If the tools used to analyze the system can be represented within the system, then no level is intrinsically privileged. The hierarchy is fluid. What was once "meta" becomes "object" simply by shifting the coding scheme. In this light, Escher's paper is not a structural necessity of the hands; it is merely the medium we, the viewers, impose to make sense of the image. Within the logic of the drawing itself, there is only the tangle.

  ### The Tarskian Ladder

  However, a compelling counter-argument arises from Alfred Tarski's hierarchy of languages. Tarski demonstrated that a language cannot define its own truth predicate without contradiction (the Liar Paradox). To define truth for a language $L$, one requires a metalanguage $L+1$. To define truth for $L+1$, one needs $L+2$, and so on. This suggests an infinite ladder where every level is inviolate relative to the one below it, but vulnerable to the one above.

  Proponents of the "absolute" view argue that this regress implies a genuine structural feature: there must always be a level currently being used to interpret the one below. Even if we can arithmetize syntax, the *interpretation* of that arithmetic—the mapping of numbers back to meaning—cannot be fully captured within the arithmetic itself. There must be a semantic ground, a place where symbols touch reality. In Escher's terms, even if the hands draw each other, the *meaning* of the drawing requires a viewer outside the paper. This view posits that the inviolate level is absolute because meaning itself requires an outside anchor. Without a level that is not interpreted by a higher level within the system, the system signifies nothing.

  ### Weighing the Sides

  The tension lies between syntax and semantics. Syntactically, Gödel shows us that levels are collapsible; the hierarchy is relative. Semantically, Tarski shows us that interpretation requires ascent; the hierarchy is rigid.

  If we view the system as a closed formal game, the Gödelian perspective wins. The inviolate level is an artifact. We can always encode the rules of the game into the pieces of the game. But if we view the system as a vehicle for truth and meaning, the Tarskian perspective holds weight. Symbols do not interpret themselves. The "inviolate level" is the point where the symbol system connects to the world.

  However, to claim this external connection is a *structural feature of the system* is a category error. The mind of the interpreter, or the reality the system describes, is not part of the formal system. It is the context *of* the system. To treat the interpreter as the "absolute inviolate level" is to reify the observer into the observed. If we model the observer as a system (e.g., a brain or a computer), they too become subject to the tangle, requiring a further metalevel to interpret them. Thus, the "absolute" ground is always pushed one step back, forever receding.

  ### Verdict: The Inviolate Level as Artifact

  I conclude that the inviolate level is an **artifact of describing self-referential systems in a language that imposes a hierarchy**, rather than a genuine structural feature of the systems themselves. The regress of levels is theoretically endless; there is no top floor to the tower of truth.

  This verdict aligns with the Gödelian insight that any sufficiently complex system can internalize its own meta-rules. The "inviolacy" of a level is not an intrinsic property of that level, but a temporary status granted by the observer who chooses to treat it as a foundation for the moment. In *Drawing Hands*, the paper is inviolate only because Escher stopped drawing. He could have drawn the table the paper rests on, and the room the table is in, and the eye perceiving the room. The hierarchy stops not because it *must*, but because the artist *ceased*.

  ### Stopping the Regress

  If the inviolate level is relative and the ladder is endless, what stops the regress? If there is no absolute floor, do we fall into an abyss of meaninglessness?

  The regress is stopped by **pragmatic fiat**. We halt the ascent not because we have reached a structural boundary, but because we have reached a point of sufficient certainty for our purposes. In mathematics, we accept axioms not because they are proven inviolate (they cannot be, by Gödel's second theorem), but because they are useful and intuitively consistent. In language, we stop defining words when we reach terms we agree to treat as primitive.

  The "stop" is not found in the system, but in the **cognitive limits and intentions of the interpreter**. We treat a level as inviolate to get work done. This is not a failure of the system, but a feature of finite intelligence. We cannot inhabit an infinite hierarchy; we must slice through it to create a working model of truth.

  Therefore, the inviolate level is a horizon, not a wall. It moves as we move. Escher's hands are not held together by the paper; they are held together by our decision to stop looking beyond the paper. The tangle is real; the hierarchy is the lens we use to view it. To demand an absolute inviolate level is to demand a view from nowhere, a perspective outside of all systems including our own. Since no such perspective exists, the inviolate level remains a necessary fiction—a relative platform we construct to keep from falling, knowing all the while that the ground beneath us is drawn by the very hands standing upon it.
