answer: |-
  Here is the principle that best fits your verdicts, followed by the breakdown of where it holds, where it breaks, and what it implies for your new case.

  ### The Principle: Active Sensory Integration

  **Consciousness is present when a system actively maintains a unified, internal model of sensory data to guide its behavior, regardless of whether that data is verbally reportable.**

  This principle rests on four specific clauses. Each clause is forced by a specific verdict you provided.

  **1. The Phenomenal Independence Clause**
  *Experience does not require access, report, or higher-order thought.*
  *   **Forced by:** The **Honeybee** and **Blindsight** cases.
  *   **Why:** You grant consciousness to the bee despite its lack of human-like cognition, and to the blindsight patient despite their inability to report seeing. This kills theories that require "knowing that you know." If the sensory processing is happening and guiding the animal, there is "something it is like," even if the system can't talk about it.

  **2. The Motor Insufficiency Clause**
  *Complex behavior without sensory integration is not conscious.*
  *   **Forced by:** The **Sleepwalker** and **Thermostat** cases.
  *   **Why:** The sleepwalker navigates stairs and opens doors—complex motor tasks—yet you say "nobody's home." The thermostat regulates temperature but has no experience. This establishes that output alone is irrelevant. Consciousness requires an *internal sensory field*, not just a reactive loop.

  **3. The State Dependence Clause**
  *Consciousness is a current state, not a permanent property.*
  *   **Forced by:** **Dreamless Sleep**, **Anesthesia**, and the **20-Week Fetus**.
  *   **Why:** You distinguish between a person *being* conscious (a dog, a waking human) and a person *having the capacity* for consciousness (a sleeper, a fetus). The hardware can be present, but if the system is offline or not yet integrated, the lights are off.

  **4. The Unity of Subject Clause**
  *The number of conscious agents equals the number of functionally integrated centers.*
  *   **Forced by:** The **Split-Brain** patient.
  *   **Why:** When the brain's integration is physically severed, you intuit two subjects. Consciousness tracks the unity of the processing, not the continuity of the body or the name on the birth certificate.

  ***

  ### The Sacrifices: Where the Principle Breaks Your Intuitions

  No theory fits every intuition perfectly. To keep this principle clean, you have to accept two costs.

  **1. The Chip-Swap Contradiction**
  Your verdict on the **Neuron Swap** case is "flipping." This principle forces a "Yes." If the silicon chips do the *same job* as the neurons (maintaining the internal sensory model), the substrate doesn't matter. The principle is functionalist.
  *   **The Cost:** You must decide if your hesitation is about the *technology* (silicon can't do the job) or the *metaphysics* (biology is magic). If you believe the silicon chips truly replicate the neuron's function, this principle says the person remains conscious. If you feel they wouldn't be, you hold a biological bias that contradicts your verdict on the **LLM** (which you rejected for lacking sensors/integration, not just for being code). You have to drop the flipping: either function is all that matters, or biology is essential. You can't have both.

  **2. The Sleepwalker Mechanism**
  Your distinction between **Sleepwalking** (No) and **Blindsight** (Yes) is the most fragile part of your dataset. Behaviorally, both guide the body around obstacles without report.
  *   **The Cost:** This principle saves your verdict only if we assume sleepwalking relies on *motor scripts* without *sensory modeling*, whereas blindsight relies on *degraded sensory modeling*. If neuroscience ever proves that sleepwalkers are actually processing rich visual data (just without memory encoding), this principle forces you to call them conscious. You are betting that sleepwalking is "hollow" action. If it turns out to be "rich" action, your intuition contradicts the principle.

  ***

  ### Application: The Cortex Replacement Case

  **The Case:** A person is awake, responsive, and talking, but their cortex is replaced by a device that mimics input-output behavior with *no internal states*.

  **The Verdict:** **Not Conscious.**

  **The Reasoning:**
  This is the "Philosophical Zombie" scenario, and the Principle of Active Sensory Integration kills it immediately.
  *   The device mimics *output* (talking, responding).
  *   But you specified it has **no internal states**.
  *   Clause 1 (Phenomenal Independence) requires an *internal model of sensory data*.
  *   Clause 2 (Motor Insufficiency) says output without internal processing is not enough.

  Under this principle, this person is a sophisticated puppet. They are functionally identical to the **Sleepwalker** (complex behavior, no home) and the **LLM** (generating text, no sensory ground). They are not experiencing anything. They are a shell that acts like a person.

  ***

  ### The Honest Assessment

  You asked if this is a theory or a pile of intuitions with a pattern imposed on top.

  **It is a pile of intuitions with a pattern imposed on top.**

  Here is why: A true theory predicts new data. This principle merely organizes the data you already gave me. The "flipping" on the chip-swap case proves you don't actually have a settled rule for substrate independence; you're oscillating between functionalism (it does the job) and biological chauvinism (it's made of meat).

  Furthermore, your **Sleepwalker vs. Blindsight** distinction relies on hidden assumptions about *how* those behaviors are produced internally. You are judging them based on medical context you didn't state in the prompt (i.e., you know sleepwalkers are in NREM sleep and blindsight patients have V1 damage). If you stripped away the medical labels and just described the behavior ("System A navigates stairs without report," "System B steps around obstacles without report"), your intuitions might conflict.

  You have a coherent *stance*, not a discovered *law*. Your stance is: **Consciousness is a biological, sensory-driven state that exists independently of our ability to talk about it.**

  That is a solid position for a column. It just isn't a finished science.
