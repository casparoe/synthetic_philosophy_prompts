      *   *Critique:* The "Billion Chips" payout is still weak.
      *   *Fix:* Make the payout *status*. "If you hold this ticket, you win." The GM doesn't need to count out billions.
      *   *Critique:* The "DB Guy" will ruin it by saying "EV is positive."
      *   *Fix:* Make him the Mugger's assistant for Round 3. Let him sell it. Then ask him if *he* pays.

  10. **Final Polish:**
