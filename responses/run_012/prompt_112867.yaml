      *   **Audience:** 15-20 people, mixed background (teachers, nurse, DB guy, sister, retired arguer). Casual but intelligent.
      *   **Goal:** Make Pascal's Mugging *felt*, not just explained. They need to experience the cognitive dissonance between Expected Value (EV) math and intuitive rejection.
      *   **Constraints:** 90 minutes total (game + debrief). Physical props (chips, whiteboard, envelopes). Real stakes (chips = raffle entries for whisky/scratchcards).
      *   **Current Idea:** Escalating odds/payoffs, ending with "envelope entities" (God, Alien, etc.). Worried about credibility (can't pay billions), skepticism ("it's a trick"), and the "Pascal's Wager" confusion.
      *   **Specific Questions:** Payoff scheme credibility? Fifth envelope (threat vs. promise)? How to force the "I know the math but I won't pay" moment? How to handle the "you can't actually pay" objection? Timeline? What goes wrong?

  2.  **Deconstruct the Core Problem (Pascal's Mugging):**
      *   The paradox: $EV = Probability \times Payoff$. If Payoff $\to \infty$ faster than Probability $\to 0$, $EV \to \infty$. Rational choice theory says "Pay." Intuition says "Don't be stupid."
      *   The "Pub Problem": In a pub game, the payoff *must* be fictional at high levels. If the players know the GM can't pay, the EV is actually zero. This kills the paradox.
      *   *Solution:* Shift the stake from "Can the GM pay?" to "If this *were* real, would you act?" OR use a proxy currency that represents *commitment* rather than just points. But the user wants real stakes (whisky).
      *   *Better Solution:* Acknowledge the fiction explicitly but bind them to the *logic*. The chips represent *willingness to sacrifice certainty for uncertainty*. The "payoff" isn't chips from the GM, it's *winning the pot* based on a simulated reality.
      *   *Refinement:* Let's keep the chips as raffle tickets. The GM doesn't need to pay billions of chips. The GM needs to simulate a world where those payoffs *could* exist. Actually, simpler: The high-payoff rounds are *hypothetical* voting rounds, not transaction rounds. No, that loses the sting.
      *   *Best Approach:* The "Bank" is the Universe. The GM is just the bookie. If the GM can't pay, the game breaks. So, cap the physical payout but make the *decision* binding.
      *   *Wait, the user's insight is key:* "I suspect the one thing that matters — that the mugger might really be able to do it — is exactly the thing I can't fake."
      *   *Fix:* Don't fake it. Make the *inability to pay* part of the lesson. The moment they realize the GM is lying about the billion chips is the moment they realize why Pascal's Mugging fails in reality (epistemic closure). But we need them to feel the tug *before* they realize it's fake.
      *   *Revised Strategy:* Use "IOU" logic or "Reality Points." Or, simpler: The high-stakes rounds aren't about winning chips from the GM, they are about *donating* chips to a "pool" that *might* be multiplied by an external randomizer (a phone app, a random.org projection). If the randomizer says "Yes," they get chips from the *pool of all players*. This creates a zero-sum tension.
      *   *Actually, keep it simple:* The user wants them to feel the cost of handing over a chip.
      *   *The "Credibility" Fix:* Don't promise billion chips from *you*. Promise billion chips from *the universe* (i.e., you win the game automatically). If someone holds a billion chips at the end, they win the whisky outright. You don't have to produce the chips, just declare the status.

  3.  **Drafting the Game Structure (90 Mins):**
      *   **Intro (10 mins):** Set stakes. Chips = Raffle tickets. Whisky = Prize. Rules of engagement.
      *   **Phase 1: The Hook (20 mins):** Reasonable bets. 50/50 for 5x. 1/10 for 10x. Get them spending. Build trust in the math.
      *   **Phase 2: The Stretch (20 mins):** Odds drop, payoff rises. 1/100 for 100x. 1/10,000 for 1,000,000x. *Crucial:* Introduce the "Bank Limit." You physically cannot pay 1M chips. So, 1M chips = "Immunity" or "Auto-Win."
      *   **Phase 3: The Mugging (25 mins):** The Envelopes. Distinct personas. One chip for "Save the Universe."
      *   **Debrief (15 mins):** Connect to Pascal.

  4.  **Addressing Specific User Questions:**
      *   **Payoff Scheme:** Don't pay out billions. Make "Billion Chips" a status effect (You Win).
      *   **Fifth Envelope (Threat):** Yes, include it. Loss aversion is stronger than gain. It heightens the anxiety.
      *   **The "It's a Trick" Problem:** Acknowledge it. "I can't pay a billion chips. But treat this as if I represent Reality." Or better: "The chips you give me go into a burn pile. If I roll the number, I replenish your stack from a reserve."
      *   **Pascal's Wager Confusion:** Distinguish them. Wager = Belief (binary). Mugging = Action (transactional) with tiny probability.
      *   **What Goes Wrong:** People laugh at Round 3. People hoard chips. The "DB Guy" calculates EV and dominates the conversation.
      *   **The "Moment":** Need to force a public declaration. "Show of hands who pays?" -> "Why?"

  5.  **Refining the "Moment":**
      *   To make it sting, they need to *lose* something.
      *   Idea: The "Tax." If you don't pay the mugger, and the mugger *was* real (simulated), you lose everything.
      *   No, that's too game-y.
      *   Let's stick to the User's Envelope idea. It's strong.
      *   *Modification:* The Envelopes aren't just stories. They require a *group decision* on a shared pot, or individual? Individual is better for the "stomach" feeling.
      *   *The "Stomach" Fix:* Make the chips represent something slightly more abstract than just raffle tickets. No, keep it simple. Scarcity creates tension. Limit the chips. 10 chips is good.
      *   *The "Credibility" Fix (Final):* Be honest. "I cannot pay a billion chips. But in this game, a billion chips means you skip the raffle and take the bottle. Do you trust the contract?" This forces them to evaluate the *credibility of the claimant*, which is the actual philosophical point of Pascal's Mugging (epistemic probability vs. raw math).

  6.  **Developing the Debrief:**
      *   Where did the math break?
      *   Why did the "God" envelope feel different from the "Coin Flip"?
      *   The "Prior Probability" problem.

  7.  **Addressing the "Threat" Envelope:**
      *   Yes, use it. It's Pascal's Wager proper (avoid hell vs. gain heaven). It contrasts nicely with the Mugging (gain utility).

  8.  **Timeline & Scripting:**
      *   Need tight timing.
      *   Need specific lines to shut down the "DB Guy" (let him calculate, then ask the nurse how she feels).
      *   Need to handle the "It's a trick" objection by embracing it.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 90 minutes enough?
      *   *Fix:* Keep Phase 1 tight. Don't let every bet drag on.
      *   *Critique:* Will they actually feel anxiety over 1 chip?
