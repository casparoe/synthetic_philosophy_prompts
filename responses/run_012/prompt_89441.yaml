answer: |-
  Here is a dependency-aware prioritization plan for your eighteen-month timeline, structured by logical prerequisites rather than disciplinary silos.

  ### 1. Upstream: Identifiability of the True Frontier
  **Question:** *Can we derive non-parametric bounds on the true fairness-utility frontier using only noisy observables?*
  *   **Dependency:** This is the absolute prerequisite. Your colleague's proposal to analyze the *shape* of the trade-off frontier assumes the frontier is visible or approximable. If the true frontier is unidentifiable given your noise structure, analyzing its shape is moot.
  *   **Settled vs. Contested:** It is **settled** that point-estimates of fairness metrics are biased under measurement error (e.g., Awasthi et al., 2020). It is **contested** whether tight, policy-useful bounds can be derived without strong parametric assumptions about the noise distribution.
  *   **Tractability:** High for your group. The ML researcher can derive statistical bounds; the philosophers can articulate the epistemic limits (what we *cannot* know) to prevent overclaiming.
  *   **Regulatory Utility:** Critical. If bounds are too wide, regulators cannot audit outcomes and must instead regulate *process* (e.g., data collection standards).
  *   **Move Up/Down:** Move **up** if legal discovery powers allow access to validation data (makes identifiability easier). Move **down** (to "abandon") if proven impossible without ground-truth audits.

  ### 2. Midstream: Stability of Frontier Geometry
  **Question:** *Does bounded noise induce discontinuous shifts in the Pareto frontier's topology?*
  *   **Dependency:** Depends on Q1. Once we know we can bound the frontier, we must know if small measurement errors cause the feasible region to collapse or fragment.
  *   **Settled vs. Contested:** **Contested.** Standard robustness theory suggests continuous deformation, but fairness constraints involve hard thresholds (e.g., 80% rule) that may create discontinuities.
  *   **Tractability:** High for the ML researcher (sensitivity analysis/simulation). Philosophers can assess if "nearby" points on the frontier are morally equivalent.
  *   **Regulatory Utility:** High. If the geometry is stable, regulators can allow "margin of error" compliance. If unstable, compliance becomes a binary cliff-edge, incentivizing gaming.
  *   **Central but Irrelevant:** *Deriving the optimal noise-robust classifier.* This is central to ML research but irrelevant to regulators, who audit existing models rather than train new ones. Deprioritize this.

  ### 3. Downstream: Normative Weight of Proxy Satisfaction
  **Question:** *Does satisfying fairness constraints on proxies constitute moral compliance under uncertainty?*
  *   **Dependency:** Depends on Q1 and Q2. Only if the frontier is bounded and stable does it make sense to ask if optimizing for the proxy is ethically sufficient.
  *   **Settled vs. Contested:** **Highly Contested.** Legal scholars debate "proxy discrimination"; philosophers debate whether procedural diligence substitutes for substantive outcomes.
  *   **Tractability:** High for the Philosophers. Requires mapping technical bounds (from Q1) to normative theories (e.g., luck egalitarianism vs. contractualism).
  *   **Regulatory Utility:** Determines the legal standard: Is "best effort" enough, or is "strict liability" for true harm required?
  *   **Move Up/Down:** Move **up** if regulators signal interest in "safe harbor" provisions. Move **down** if Q1 reveals non-identifiability (making the normative question moot).

  ### Summary of Strategy
  Your colleague's focus on the *shape* is valid only if the shape is recoverable. Therefore, you must prioritize **identifiability** over **geometry**. The ML researcher should focus on bounding the error region (Q1 & Q2), while the philosophers analyze the regulatory implications of those bounds (Q1 & Q3). Avoid deriving optimal models; focus on auditability.

