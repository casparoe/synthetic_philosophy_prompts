answer: |-
  **Strategy Note: Foundations of Welfare Measurement**

  **To:** Board of Trustees
  **From:** Strategy Lead
  **Subject:** Priority Questions for the Welfare Measurement Programme (Years 1–3)

  ### 1. Diagnosis: Where You Are Right and Where You Are Stuck

  Your diagnosis of the field is largely correct, but the "circles" you are running in stem from trying to solve normative questions (what *should* we value?) before settling measurement questions (what *can* we compare?).

  You are right that the old positivist dismissal of interpersonal comparisons is dead, but the vacuum has been filled by incompatible frameworks. You are also right to be wary of the "Level vs. Unit" distinction. In practice, these are often conflated. Policy makers need to know *who* is worse off (Level) to apply priority weighting, and they need to know if a gain is *larger* for one person than another (Unit) to maximise total welfare. You cannot do either without a stable metric.

  Your colleague is correct about **admissible transformations**. This is the technical choke point. If a policy conclusion changes depending on whether we treat welfare scales as ordinal (rankings only) or cardinal (measurable intervals), the conclusion is mathematically unstable. Most current cost-effectiveness analysis (CEA) assumes cardinality without justification.

  However, you are risking scope creep with the inclusion of animals and future people. While philosophically interesting, these introduce distinct metaphysical problems (consciousness, non-identity) that will dilute the core work on human welfare measurement. Given the budget and timeline, this is a distraction.

  ### 2. The Priority Questions

  With £1.2m over three years and a team of five (philosophers and normative economists), you cannot solve everything. You should fund a focused research cluster aimed at producing a **Unified Framework for Interpersonal Comparison**. I recommend backing the following two questions as primary, with a third as a downstream integration goal.

  #### Priority 1: The Metric Authority Problem (The "Disability" Question)
  **The Question:** *When subjective self-reports and objective functioning metrics diverge, which has normative authority for policy purposes?*

  *   **Why it is upstream:** This is the foundational blocker. Current policy tools (like QALYs) often discount the value of life with severe disabilities based on objective health states, whilst self-reported well-being data suggests adaptation (the "disability paradox"). If we cannot adjudicate which metric reflects "true" welfare, all subsequent comparisons are built on sand.
  *   **Tractability:** High. This does not require new empirical data (which you cannot fund). It requires conceptual work to analyse *why* we value one metric over the other. Is welfare experiential (how it feels) or objective (what capabilities one has)? Philosophers can resolve the normative conflict using existing empirical literature.
  *   **Desired Output:** A decision framework for policy makers. Not a final answer on "what is welfare," but a set of conditions under which subjective reports should override objective indices, and vice versa. For example: "For triage, use objective functionings; for cash transfers, use subjective reports."
  *   **Ranking Driver:** Move this up if early scoping shows the team can agree on a pluralistic metric. Move it down if the team fractures into incommensurable camps (hedonists vs. capability theorists) with no bridge.

  #### Priority 2: The Formal Permissibility Problem (The "Transformations" Question)
  **The Question:** *Which interpersonal comparisons remain valid under all admissible transformations of the welfare scale?*

  *   **Why it is upstream:** This addresses your colleague's concern. Much of the rhetoric in priority setting assumes we can compare the *size* of benefits across people. But if our measurement scale only supports ranking (ordinal), claims about the *size* of the gap (cardinal) are meaningless. We need to map exactly what policy claims are permissible given the robustness of our data.
  *   **Tractability:** High for normative economists and formal philosophers. This is technical work involving measurement theory and social choice theory. It is distinct from the "fuzzy" ethics of Priority 1.
  *   **Desired Output:** A technical handbook or set of guidelines for analysts. It should specify: "If you are using Scale X, you are permitted to make Claim Y, but not Claim Z." This prevents policy makers from making mathematical errors disguised as ethical judgments.
  *   **Ranking Driver:** Move this up if the team includes strong formal modellers. Move it down if the output becomes too abstract to be understood by the policy community (e.g., pure mathematics with no translation).

  #### Priority 3 (Conditional): The Aggregation Structure (Level vs. Unit)
  **The Question:** *Does the moral weight of a welfare gain diminish as the recipient's baseline welfare increases?*

  *   **Why it is downstream:** You noted policy needs "unit" comparisons (marginal value) while philosophy focuses on "level" (who is worse off). In reality, these are linked by the **aggregation function**. We should only fund this if Priorities 1 and 2 produce a stable metric. If we don't know *what* we are measuring (Priority 1) or *if* we can compare it (Priority 2), deciding *how much* to weight it (Priority 3) is premature.
  *   **Tractability:** Moderate. This is the heart of the Prioritarianism vs. Utilitarianism debate. It is highly contested.
  *   **Desired Output:** A clear exposition of the trade-offs. Rather than solving the debate, the output should clarify the "price" of each view. E.g., "Adopting a prioritarian weighting requires accepting X reduction in total welfare output."
  *   **Ranking Driver:** Only fund this if the first two years show significant progress on the Metric and Formal questions. Otherwise, deprioritise.

  ### 3. What to Deprioritise

  To ensure the £1.2m delivers impact, you must explicitly exclude the following:

  1.  **Non-Human Animals and Future People:**
      *   **Reasoning:** These are not merely extensions of the human welfare problem; they are different categories entirely. Animal welfare requires theories of consciousness we do not possess; future people require non-identity problem solutions. Including them will double the scope without doubling the insight. Keep the focus on *contemporary human interpersonal comparisons*.
      *   **Risk:** High risk of speculative metaphysics that yields no policy guidance.

  2.  **Pure History of Thought:**
      *   **Reasoning:** Do not fund work that merely explicates Sidgwick, Harsanyi, or Sen without a view to contemporary application. We know what they said; we need to know what to do now.
      *   **Risk:** Academic navel-gazing that consumes budget without producing actionable frameworks.

  3.  **New Empirical Data Collection:**
      *   **Reasoning:** You have no budget for this, but also, it is not the bottleneck. We have plenty of data (self-reports, health indices). The bottleneck is *interpretation*. Funding a survey would be a waste; funding a philosophical framework to interpret existing surveys is the leverage point.

  ### 4. Strategic Reasoning & Risks

  **Why this combination?**
  Priorities 1 and 2 address the **validity** of the numbers used in policy. Priority 3 addresses the **use** of those numbers. By securing validity first, you prevent the foundation from funding work that recommends policies based on mathematically impermissible comparisons.

  **The "Same Question" Worry:**
  You asked if Level vs. Unit and Transformations are the same question. They are not, but they are entangled.
  *   *Transformations* determine if a comparison is *meaningful* (can we say A's gain is bigger than B's?).
  *   *Level vs. Unit* determines if a comparison is *relevant* (do we care more about B because they are lower down, even if the gain is smaller?).
  You need the first to make sense of the second. That is why Priority 2 must precede Priority 3.

  **What Success Looks Like:**
  In three years, success is not a consensus on "the true theory of welfare." That is unrealistic. Success is a **shared vocabulary and constraint set**.
  *   *Good Output:* "We have identified three permissible metrics for triage and two for cash transfers, and we have proven that priority weighting is only mathematically valid under condition X."
  *   *Bad Output:* Five monographs arguing past each other on the nature of the good life.

  **Recommendation:**
  Structure the grant as a collaborative **Working Centre** rather than individual fellowships. Require the philosophers and economists to co-author. The philosophers must ground the metrics; the economists must test the formal constraints. If they cannot speak to each other, the project fails.

  Proceed with Priorities 1 and 2 as the core mandate. Treat Priority 3 as a stretch goal for Year 3, contingent on the stability of the foundational work. Keep animals and future generations out of the scope entirely for this phase.
