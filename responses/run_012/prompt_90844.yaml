          3.  *Neurological Patient (Pain Asymbolia):* "It hurts but doesn't bother me." Theory must separate sensory discrimination from affective motivation.
          4.  *Addiction (Wanting vs. Liking):* Dopamine (wanting) $\neq$ Opioid (liking). Theory must separate drive from valence.
