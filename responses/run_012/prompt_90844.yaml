  *(Self-Correction during drafting)*: Wait, the prompt asks me to "write the desiderata... adequate to the question." I need to make sure I don't just list them, but explain *why* each is a desideratum (the "case or consideration behind each requirement"). I also need to be careful with the "Unsatisfiable" section—the prompt suggests *I suspect* they pull against each other. I should confirm that suspicion in the analysis.

  *Refining the Lab's Criterion Score:* The lab says: "Trade-off term + Removal degrades performance." This basically defines a *constraint* or a *cost*. It doesn't define *suffering*. A car engine has a term for "overheating" that trades off against "speed." If removed, performance degrades. Does the engine suffer? No. So the lab's criterion is likely insufficient. I need to make sure this comes across clearly.

