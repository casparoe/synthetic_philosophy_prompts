      *   *Exclusionary Requirement:*
          *   Which one kills the most theories? Likely "External Checkability of Felt Quality" or the distinction between "Signal vs. Quality." Let's go with the distinction between *Learning Signal and Felt Quality* because it directly attacks the RL premise.

  4.  **Refining the Content (Self-Correction/Polishing):**
