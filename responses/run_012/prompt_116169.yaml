  Hey — I'm in a history of ethics class and we're reading Bentham's essay on sexual morality, the one he wrote back in the 1780s and then sat on for the rest of his life, never published, the one about "offences against one's self." There's a bit near the start I cant make sense of:

  "To what class of offences shall we refer these irregularities of the venereal appetite which are stiled unnatural? When hidden from the public eye there could be no colour for placing them anywhere else: could they find a place anywhere it would be here. I have been tormenting myself for years to find if possible a sufficient ground for treating them with the severity with which they are treated at this time of day by all European nations: but upon the principle utility I can find none."

  Can you break down what he's actually up to? Like, what classes of offence is he choosing between when he asks that opening question, and why does where you file it even matter before you get to whether to punish it at all? And when he says he's tested it "upon the principle utility," what would have counted as a sufficient ground for punishment in his scheme — what is he looking for and not finding? I want the actual argument, not just "Bentham was ahead of his time."
