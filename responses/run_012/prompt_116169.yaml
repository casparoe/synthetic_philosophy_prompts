      *   *Context:* Bentham is working within his legal codification project (the Panopticon era, but specifically his *Principles of Penal Law*). He categorizes crimes based on who is harmed.
      *   *Key Concept:* The Principle of Utility (Greatest Happiness Principle). Actions are right if they promote happiness, wrong if they produce pain. Law should only punish if it prevents greater pain.

  3.  **Address Question 1: What classes of offences?**
      *   Bentham's penal theory divides offences based on the *victim*.
      *   Primary categories:
          1.  Offences against *others* (private individuals).
          2.  Offences against the *public* (the state, community).
          3.  Offences against *oneself* (self-regarding actions).
      *   *The Quote's Logic:* He says, "When hidden from the public eye there could be no colour for placing them anywhere else." This means if no one else sees it, it's not against the public. If no one else is harmed, it's not against another person. Therefore, the only logical bucket left is "Offences Against One's Self."
      *   *Why it matters:* In Bentham's system, the classification dictates the *justification* for punishment. If it's against others, punishment is easy to justify (preventing harm). If it's against oneself, punishment is highly problematic (paternalism).

  4.  **Address Question 2: Why does classification matter?**
      *   It's about *harm*. Bentham is a harm-principle theorist (pre-dating Mill).
      *   If an act harms another, the state has a clear utility-based reason to intervene (prevent pain to the victim).
      *   If an act harms only the agent ("offence against oneself"), the state must prove that intervening creates *more* happiness than letting it be.
      *   Classification determines the *burden of proof*. Placing it in "Offences Against One's Self" raises the bar for punishment significantly. It suggests the act is consensual and private.

  5.  **Address Question 3: What is the "Principle of Utility" test?**
      *   *The Test:* Does punishing this act produce more pleasure (happiness/security) than pain (suffering of the punished + cost of enforcement)?
      *   *Bentham's Search:* He is looking for "mischievous consequences" (harm).
      *   *Specific Harms he considers (and rejects):*
          *   Physical harm to participants? (Usually no, if consensual).
          *   Harm to third parties? (If "hidden from public eye," no).
          *   Harm to population growth? (A common argument then: sodomy doesn't produce kids). Bentham usually dismisses this as negligible compared to the pain of punishment.
          *   Religious offense? (Utility is secular; God's law doesn't count unless it causes earthly pain).
          *   Disgust/Sympathy? (The pain people feel *knowing* it happens). Bentham weighs this against the severe pain of execution/imprisonment. The "pain of disgust" is minor compared to the "pain of punishment."
      *   *The Result:* He finds "none." The pain inflicted by the law (death, prison, shame) vastly outweighs any vague "harm" the act causes. Therefore, it fails the utility test.

