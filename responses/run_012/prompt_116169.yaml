answer: |-
  This is a crucial passage from Bentham's unpublished manuscript *Of Offences Against One's Self* (written c. 1785). To understand what he is doing, you have to look at this not as a moral plea for tolerance, but as a technical legal audit. Bentham is trying to codify the law, and he is running "homosexual acts" (which he calls "irregularities of the venereal appetite") through his legal taxonomy to see if they fit the definition of a crime.

  Here is the breakdown of the argument, the classification system, and the utility calculus he is applying.

  ### 1. The Classes of Offences
  When Bentham asks, *"To what class of offences shall we refer these irregularities...?"* he is referring to the specific taxonomy of crimes he developed in his *Principles of Penal Law*. For Bentham, an act cannot be a crime unless it can be assigned a victim. He divides offences into three main buckets:

  1.  **Offences against Others (Private/Semi-private):** Acts that cause direct harm to specific individuals (assault, theft, murder).
  2.  **Offences against the Public (State/Community):** Acts that threaten the security or functioning of the state (treason, tax evasion) or cause public alarm.
  3.  **Offences against One's Self (Self-regarding):** Acts where the only person potentially harmed is the agent performing the act.

  **Why the classification matters:**
  In Bentham's system, classification dictates the **burden of proof for punishment**.
  *   If an act is an *Offence against Others*, the justification for punishment is straightforward: you punish the aggressor to prevent pain to the victim.
  *   If an act is an *Offence against the Public*, you must prove it damages the collective security.
  *   If an act is an *Offence against One's Self*, the justification for punishment collapses. Bentham generally views the law as a tool to manage interactions between people. If an act is truly self-regarding, state intervention is paternalistic.

  **The Logic of the Quote:**
  When Bentham writes, *"When hidden from the public eye there could be no colour for placing them anywhere else,"* he is ruling out the first two categories.
  *   It is not against **Others** because it is consensual (no victim).
  *   It is not against the **Public** because it is "hidden" (no public scandal, no breach of peace).
  *   Therefore, logically, the *only* bucket left is **Offences Against One's Self**.

  He is cornering the reader. He is saying: "If you want to punish this, you must admit you are punishing a man for what he does to his own body in private."

  ### 2. The "Principle of Utility" Test
  Once he has filed the act under "Offences Against One's Self," he applies the **Principle of Utility**. For Bentham, utility is not just "usefulness"; it is a specific calculus of pain and pleasure.

  **What counts as a "sufficient ground"?**
  For the state to punish an act, the punishment must prevent more pain than it causes. This is the core of his argument. Punishment is *itself* an evil (it inflicts pain). It is only justified if it excludes a greater evil (the harm caused by the crime).

  So, Bentham is looking for **"Mischief."** He is asking: *What specific pain does this act produce?* If there is no "mischief" (harm/pain), there is no utility in punishing it.

  He systematically tests the common arguments of his day against the utility calculus and finds them wanting:

  1.  **Physical Harm:** Does the act damage the participants? Bentham argues that if it is consensual, the physical risk is no different than any other sexual act. There is no inherent "mischief."
  2.  **Population Decline:** A common 18th-century argument was that sodomy reduces the birth rate. Bentham calculates this as negligible. The number of people engaging in it is too small to impact the state's population strength. Therefore, no public harm.
  3.  **Religious Offense:** Does it offend God? Bentham's utility is secular. Divine punishment in the afterlife is not a calculable earthly pain. The law deals with earthly consequences.
  4.  **The "Pain of Disgust" (Sympathetic Pain):** This is the strongest counter-argument. If people *know* about the act, they feel disgust. That disgust is a form of pain.
      *   *Bentham's Rebuttal:* He weighs the **pain of disgust** felt by the public against the **pain of punishment** inflicted on the actor (which, in the 1780s, meant death by hanging or life in prison).
      *   *The Calculation:* The pain of 1,000 people feeling mildly disgusted is mathematically less than the pain of one man being executed. Therefore, punishing the act creates *more* total pain in the universe than letting it happen.

  ### 3. What He Is "Not Finding"
  When he says, *"upon the principle utility I can find none,"* he means he cannot find a **net positive balance of happiness** resulting from criminalization.

  He is looking for a **harm principle** before Mill coined the term. He needs to find a victim who suffers more from the act than the perpetrator would suffer from the law.
  *   If the act is hidden, there is no victim.
  *   If there is no victim, there is no mischief.
  *   If there is no mischief, punishment is "groundless."

  ### Summary of the Argument
  Bentham is not arguing that these acts are "virtuous." He is arguing that they are **legally irrelevant.**

  1.  **Classification:** Because the acts are private and consensual, they cannot be offences against others or the state. They must be classified as "Offences Against One's Self."
  2.  **Jurisdiction:** The law has no business intervening in self-regarding acts unless they cause collateral damage.
  3.  **Calculus:** Even if we assume the acts are "bad" for the individual, the pain inflicted by the criminal justice system (execution, imprisonment, shame) vastly outweighs the pain caused by the sexual act itself.
  4.  **Conclusion:** Therefore, punishing these acts fails the utility test. It is "groundless" legislation.

  He is essentially performing a cost-benefit analysis on sodomy laws and concluding that the "cost" (state violence) exceeds the "benefit" (preventing a victimless act). That is why he says he has been "tormenting himself" to find a justification—he wants to be a rigorous legal theorist, but the math simply doesn't work in favor of punishment.
