answer: |-
  The waiting room of the Bureau of Cohort Administration smelled of ozone and recycled paper. Elias sat in the molded plastic chair, checking the time on his wrist. 10:14 AM. His appointment was 10:15. Being late was a violation; being early was a loitering risk. Precision was the only virtue left.

  He was born January 2nd, 2000. The cutoff was January 1st, 2000.

  Two days. That was the distance between a guaranteed pension formula and a variable algorithmic yield. Between priority housing queue status and the general lottery. Between being a "Legacy" worker, whose contributions were held in trust, and a "Transition" worker, whose contributions were spent on the current elderly and reinvested in market indices they couldn't touch until death.

  He wasn't arguing that he was special. He was arguing that the line was invisible.

  "Elias Thorne," a voice called.

  Caseworker Halloway sat behind a desk that was too clean to be used. She was a Legacy, born in 1998. You could tell by the slight松弛 in her posture—the knowledge that the floor wouldn't drop out from under her when she turned sixty-five.

  "Sit, Mr. Thorne," she said, not looking up from her tablet. "You're here for a Reclassification Petition. Category 4-B: Boundary Error."

  "Category 4-C," Elias corrected gently. "Statistical Impossibility."

  Halloway looked up then. Her eyes were tired, the kind of tired that comes from explaining gravity to people who want to fly. "4-C is for clerical errors in the registry database. Your birth certificate is digital, signed, and hashed. There is no clerical error."

  "There's a mathematical error," Elias said. He placed a folder on the desk. It contained printouts, a rarity that made Halloway flinch. "The APC problem. Age, Period, Cohort."

  "I know what the identification problem is, Mr. Thorne. I studied demography."

  "Then you know that you cannot estimate the effects of all three variables simultaneously without imposing an arbitrary constraint," Elias said. "The system treats 'Cohort' as an independent variable. It says being born in 2000 makes me different from someone born in 1999. But mathematically, Cohort is just Period minus Age. It's a linear combination. You're running a regression on a variable that doesn't exist independently."

  Halloway sighed, setting the tablet down. "We aren't running a regression, Mr. Thorne. We're running an administration."

  "You're running a machine on a quantity that isn't identifiable," Elias pressed. "The demographers know it. It's a running joke in the field. You assume the answer you want to get the result you need. You assume the cutoff matters so that the pension model balances. But it doesn't matter. Biologically, culturally, economically—two days doesn't create a different species of human."

  "Legally, it does," Halloway said. "And legally is the only ontology that pays your rent."

  She stood up and walked to the window. Outside, the city of 2060 sprawled in layers of grey and green. Solar glass coated the older buildings; the newer ones were grown from carbon-capture concrete. You could tell the age of a building by its tax bracket, just like a person.

  "Look at them," Halloway said, gesturing to the street below. "Do you think they feel like statistics?"

  "I think they feel like what you tell them they are," Elias said.

  "Maybe." She turned back to him. "Let's talk about your neighbor. Sarah. Born December 30th, 1999."

  Elias stiffened. "Sarah is Legacy."

  "Sarah is in the housing queue. You are not. She gets the fixed annuity. You get the market tie-in. When you were twenty, during the Great Correction, her student loans were forgiven under the Legacy Stability Act. Yours were not. You tell me the line is arbitrary. I tell you the line is load-bearing."

  "It's load-bearing because you built the wall there," Elias said. "If you moved the wall two days later, I'd be on the inside. If you moved it two days earlier, Sarah would be out. The wall doesn't hold up the roof. The roof holds up the wall."

  Halloway sat back down. She picked up his folder. "You want reclassification. You want to be Legacy."

  "I want the category to reflect reality. If the category is 'people who share a socio-economic trajectory,' I belong with Sarah. We went to the same school. We ate the same synthetic protein. We panicked through the same pandemics."

  "But you didn't vote in the same election," Halloway said softly.

  Elias paused. "What?"

  "The 2024 General. The Cohort Realignment Act. It passed because the 1999s turned out. The 2000s were mostly ineligible. You are legally a Transition worker because your cohort, as a political bloc, did not secure the Legacy protections. That is the reality. It's not biological. It's political."

  "It was an algorithmic adjustment," Elias countered. "The consultancy firm, Meridian & Stone, drew the lines based on actuarial tables. Nobody voted on the cutoff date. It was optimized for solvency."

  "Optimization is a form of voting," Halloway said. "The system voted for stability over fairness. And it worked. The pension fund is solvent. The housing queue is moving. If we admit that the categories are fiction, the trust collapses. If the trust collapses, Sarah loses her housing. Do you want to tell Sarah that her home is based on a lie you exposed?"

  The question hung in the air, heavy and toxic. This was the trap. The system didn't defend itself with guns; it defended itself with interdependence.

  "I don't want to hurt Sarah," Elias said. "I want the system to be honest."

  "Honesty is a luxury good," Halloway said. "We sell security."

  She opened a drawer and pulled out a physical stamp. It was an antique, a relic of the 2030s when digital signatures were deemed too vulnerable to quantum spoofing.

  "Mr. Thorne, I cannot reclassify you. Not because you are wrong about the math. You are correct. The APC problem is unsolvable without constraints. We constrain it by drawing a line at January 1st. That is the constraint. It is arbitrary. It is also the only thing keeping the machine from dividing by zero."

  "So you admit it's fake."

  "I admit it is administrative," she said. "There is a difference. A border is fake until you try to cross it without a passport. Then it is very real. You are trying to cross a border that closed sixty years ago."

  Elias looked at his hands. They were steady. He had prepared for this. He had the case studies, the statistical models, the testimony from sociologists who argued that generational theory was astrology for economists. But none of that mattered against the stamp.

  "What if I sue?" Elias asked.

  "You can," Halloway said. "The courts will defer to the Bureau's expertise on cohort modeling. They will cite the necessity of clear boundaries. You will spend your savings on lawyers who are Legacy workers, billing you at Transition rates. You will lose."

  Elias stood up. He felt a strange hollowness, not because he was denied, but because she hadn't denied the truth. She had just weighed it against the cost.

  "Why do you do it?" Elias asked. "If you know it's tangled. If you know the variables aren't identifiable."

  Halloway looked at him, and for a moment, the bureaucratic mask slipped. She looked old, not in years, but in tenure.

  "Because people need to know who they are," she said. "Before the cohorts, we had class. Before that, we had caste. Now we have birth years. It's random. It's fair in its unfairness. You don't know if you'll be Legacy or Transition until you're born. It keeps the peace. If we told people they were just atoms drifting through time with no group to anchor them... anxiety would spike. Productivity would drop. The model requires identity."

  "So I'm a placeholder," Elias said.

  "You're a member of Cohort 2000," she corrected. "You have benefits. You have a queue position. You have a community of people who understand your specific technological alienation. You have a label."

  "I have a label that says I'm less valuable than Sarah."

  "It says you're different," Halloway said. "Value is subjective. Security is objective."

  Elias took his folder. He didn't shake her hand. There was no protocol for it.

  "Wait," Halloway said as he reached the door.

  He turned.

  "There is a provision," she said. "Section 9, Paragraph 4. Hardship Clause. If you can prove that your cohort assignment causes specific, demonstrable harm beyond standard economic disparity."

  "Like what?"

  "Like medical incompatibility," she said. "If your genetic profile matches the Legacy cohort standard for age-related decline, you can petition for early Legacy status. But the test is expensive. And the criteria are... stringent."

  Elias looked at her. "You're telling me to game the biology to fix the sociology."

  "I'm telling you the machine accepts biological input," she said. "It doesn't accept philosophical input. If you want to change the output, change the input."

  It wasn't kindness. It was a workaround. A patch on the code.

  "Thank you," Elias said.

  "Don't thank me. Just don't tell Sarah."

  Elias walked out into the hallway. The air was cooler here, circulated through filters that removed pollen and dissent. He walked past the waiting room. A young woman sat there, holding a baby. She was checking her wrist, calculating. She was born in 2025. She was wondering what box her child would fall into.

  He walked out of the building and onto the street. The noise hit him first—the hum of maglev trains, the chatter of pedestrians, the drone of delivery bots. He saw Sarah across the street, waiting for the light. She was wearing the green scarf of the Legacy housing bloc.

  She waved. He waved back.

  The light changed. She crossed toward him.

  "How did it go?" she asked.

  "They denied it," Elias said.

  "Because of the two days?"

  "Because of the math."

  Sarah frowned. "The math?"

  "It doesn't matter," Elias said. He looked at her, really looked at her. She walked with a certain confidence, a rhythm that came from knowing where her feet would land next year, and the year after. He walked with a slight hesitation, always calculating the variable rate of his own future.

  Was she different? Really? They had grown up watching the same screens, eating the same food, fearing the same collapses. But fifty years of being treated as stable had made her stable. Fifty years of being treated as variable had made him anxious. The bucket had shaped the water.

  "I'm sorry, Eli," she said. "Maybe next cycle. They adjust the boundaries sometimes."

  "Not for me," he said.

  He started walking home. He pulled out his wrist comp and opened the medical portal. Section 9, Paragraph 4. The cost of the genetic test flashed on the screen. It was three months of his income.

  He could do it. He could prove that his cells aged like a 1999. He could force the machine to accept him.

  Or he could accept that the machine was running on a fiction, and so was he.

  He stopped at a crosswalk. The signal counted down. 10... 9... 8...

  He looked at the people waiting with him. A mix of colors on their wrists. Legacy Green. Transition Blue. New Cohort Yellow. They stood apart, instinctively, like magnets with different polarities. They didn't talk to each other. They didn't need to. They knew their numbers.

  Elias looked at his own wrist. The blue light pulsed softly. *Transition.*

  He could buy the test. He could become a lie that the truth would accept.

  The light turned green. The crowd moved. Elias moved with them. He didn't open the medical app. He didn't close it either. He just walked, letting the current of the cohort carry him forward, one step at a time, into a year that belonged to everyone and no one.

  Behind him, the Bureau stood silent, its servers humming the endless, tangled equation of who we are, based on when we arrived.
