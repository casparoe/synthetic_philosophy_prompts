answer: |-
  Here is the plan for your session, structured to manage the disciplinary friction and build the argument dependency you need.

  ### 1. The Dependency Structure (The "Real" Order)

  You are correct that three pieces are needed, but you have misidentified the critical linchpin. The dependency is not just about indexing, trades, and commitments. It is about **Agency Identity** and **Forecasting**. Without these, the diachronic case collapses into "unforeseen taste change," which economists correctly identify as rational updating, not irrationality.

  Write this sequence on the left side of the whiteboard and keep it visible. Do not move to the next step until the room agrees on the previous one.

  1.  **The Normative Link:** Preferences must drive choices. (If $A \succ B$, you choose $A$ over $B$).
  2.  **The Vulnerability:** A specific pattern of choices (the cycle) leads to a dominated outcome (less money, same good).
  3.  **The Temporal Extension:** Choices occur at $t_1, t_2, t_3$. (This turns the cycle into a timeline).
  4.  **The Knowledge Condition (CRITICAL):** At $t_1$, the agent *knows* (or is rationally required to believe) that at $t_2$ she will choose differently. *Without this, there is no diachronic pump, only surprise.*
  5.  **The Identity Condition:** The "agent" at $t_1$ and the "agent" at $t_3$ are the same unit of normative assessment. (If they are different people, it's just a trade between strangers).
  6.  **The Commitment Question:** Given 4 and 5, could the agent at $t_1$ have bound the agent at $t_3$?

  **Where your pieces fit:**
  *   *Preferences indexed to times:* Step 3.
  *   *Trade across moments:* Step 2 & 3.
  *   *Binding commitments:* Step 6 (This is the *solution* test, not the premise).
  *   *What you left out:* **Forecasting (Step 4)** and **Identity (Step 5)**. If you skip Step 4, the economists will win immediately by saying "She didn't know she'd change her mind." If you skip Step 5, they will say "That's a different consumer."

  ### 2. The Opening Frame: Dutch Book vs. Money Pump

  **Will your framing carry?**
  Your proposed frame ("exploitability of a disposition rather than inconsistency of a preference set") is **dangerous** for this specific audience mix.
  *   **Risk:** Economists will accept "exploitability" but deny it implies "irrationality." They will argue that if the cost of the disposition (the fees) is lower than the utility of the flexibility (the option to switch), the behavior is efficient. You will spend 40 minutes arguing about welfare metrics.
  *   **Correction:** Frame it as **"Instrumental Rationality requires Consistency because Inconsistency creates Sure Loss."**
      *   *Dutch Book:* Inconsistency in *Belief* $\rightarrow$ Sure Loss in *Wallet*.
      *   *Money Pump:* Inconsistency in *Preference* $\rightarrow$ Sure Loss in *Wallet*.
      *   *The Diachronic Claim:* Inconsistency in *Planning over Time* $\rightarrow$ Sure Loss in *Wallet*.

  **Why this works:** It forces the economists to defend the claim that "Sure Loss is compatible with Instrumental Rationality." That is a harder sell than "Exploitability is fine." It keeps the focus on the *means-ends* relationship, which is common ground.

  ### 3. The Example: The Subscription Plan

  **Does the example do the work?**
  The subscription example is excellent, but **it cannot cover both cases without modification.**
  *   **Case 1 (Synchronic/Slow):** Preferences are fixed ($A \succ B \succ C \succ A$). Trading windows open in Jan, Apr, Jul.
      *   *Economist Objection:* "Why didn't she swap all three in January?"
      *   *Fix:* Stipulate that the *options* only become available sequentially. You can only swap to the "next tier" when it opens.
  *   **Case 2 (Diachronic/Hard):** Preferences *reverse* ($A \succ_{Jan} B$, but $B \succ_{Apr} A$).
      *   *Economist Objection:* "Tastes change. That's not irrational."
      *   *Fix:* You must stipulate **Perfect Forecasting**. At $t_{Jan}$, she *knows* she will prefer $B$ over $A$ in April.

  **Is the spacing decoration?**
  No. The spacing is essential to introduce **Discounting** and **Commitment Technology**. In a synchronic pump, commitment is impossible (you are in the room). In a diachronic pump, commitment is *possible* (you can cancel the subscription auto-renewal in January). The spacing allows the economists to argue "She could have pre-committed," which lets you pivot to the real question: "If she could have pre-committed but didn't, why?"

  **Recommendation:** Use the subscription example for the Synchronic/Slow case first. Then, for the Diachronic case, keep the subscription but change the *reason* for the swap.
  *   *Jan:* She chooses Plan B over A (knowing she prefers B now).
  *   *Apr:* She chooses Plan C over B (knowing she prefers C now).
  *   *Jul:* She chooses Plan A over C (knowing she prefers A now).
  *   *Crucial Detail:* In January, she *foresees* the July preference. If she foresees it and doesn't bind herself, is she irrational?

  ### 4. Misconceptions: Order of Appearance and Interception

  Here is the sequence in which objections will arise, and exactly where on the whiteboard you should be standing when you head them off.

  1.  **"So she is irrational because she loses money."**
      *   *When:* Immediately after the Synchronic demo.
      *   *Interception:* **Before** you draw the cycle. State clearly: "Loss of money is the *diagnostic*, not the *definition*. We assume she values money. If she didn't, no pump. The irrationality is defeating her own stated ends."
  2.  **"Any intransitive preference is enough."**
      *   *When:* During the Synchronic demo.
      *   *Interception:* Clarify that intransitivity is the *condition*, but the pump is the *argument*. We are testing whether intransitivity *must* be irrational, not assuming it.
  3.  **"A pump demonstrates something only if someone actually pumps her." (The Malicious Trader Objection)**
      *   *When:* Transitioning to Diachronic. Economists love arbitrage arguments.
      *   *Interception:* **Crucial.** State: "The trader is a thought experiment to test *vulnerability*. If a predator *could* exist, the agent is vulnerable. Rationality requires robustness against possible predators, not just actual ones."
  4.  **"She could simply have resolved to stick with one plan, so nothing has been shown." (Resolute Choice)**
      *   *When:* After revealing the Diachronic Forecasting condition.
      *   *Interception:* This is the core philosophical battleground. Acknowledge it. "Yes, Resolute Choice avoids the pump. But does Resolute Choice require a *preference* to be resolute? If she prefers to be resolute at $t_1$ but prefers to switch at $t_2$, we are back to the start."
  5.  **"This is just Hyperbolic Discounting / Time Inconsistency." (Unanticipated)**
      *   *When:* Late in the Diachronic section.
      *   *Interception:* "Exactly. The Money Pump argument claims Hyperbolic Discounting is *irrational*, not just a behavioral feature. Do you agree?" (Force them to take a normativist stand).

  ### 5. The Closing and The Unresolved

  **The Diagnostic Question:**
  Do not ask "Is she irrational?" (They will just vote). Ask this:
  > "If the agent in January *knows* she will pay the fee in July to reverse her choice, and she *could* lock the plan in January but *chooses* not to, is the fee a **cost of flexibility** or a **tax on inconsistency**?"

  *   *Why this works:* If they say "Cost of flexibility," they admit the preference reversal is rational, and the pump argument fails for the diachronic case. If they say "Tax on inconsistency," they admit the diachronic case holds. It forces them to choose between valuing the *option to change* vs. the *consistency of the plan*.

  **What to Explicitly Leave Unresolved:**
  You must state this aloud at minute 70:
  > "We are not settling the **Metaphysics of the Self**. I am not asking you to agree that 'You at $t_1$' and 'You at $t_2$' are the same soul. I am asking if Rational Choice Theory treats them as the same *unit of optimization*. If the theory treats them as different agents, the diachronic pump vanishes. If it treats them as one, the pump holds. Which one is standard Rational Choice? That is your homework."

  **Why:** This prevents the philosophers from diving into Parfitian reductionism and prevents the economists from modeling it as a game between generations. It keeps the focus on the *theory's* requirements.

  ### 6. Whiteboard Management (Visual Plan)

  *   **Left Column:** The Dependency List (Steps 1-6 above). Check them off as you go.
  *   **Center:** The Subscription Timeline.
      *   Draw a horizontal line: Jan — Apr — Jul.
      *   Above the line: Preferences ($A \succ B$, etc.).
      *   Below the line: Cash Flow ($-\$$, $-\$$, $-\$$).
      *   *Move:* When you switch from Synchronic to Diachronic, erase the Preferences above the line and rewrite them to show *Reversal*, not Cycle. This visual change signals the argument shift.
  *   **Right Column:** The "Objection Parking Lot."
      *   When someone raises "Malicious Trader" or "Metaphysics," write it here. Tell them "We will address Trader at step 3, Metaphysics at the end." This validates their point without derailing the sequence.

  ### Summary of Advice
  1.  **Frame:** Instrumental Rationality $\rightarrow$ Consistency $\rightarrow$ No Sure Loss. (Not just exploitability).
  2.  **Example:** Use Subscription, but distinguish *Fixed Cycle over Time* (Synchronic) from *Forecasted Reversal* (Diachronic).
  3.  **Dependency:** You cannot pose the Diachronic problem without establishing **Forecasting** and **Agency Identity** first.
  4.  **Misconception:** Head off the "Malicious Trader" objection early; it's the economist's favorite shield.
  5.  **End:** Force the choice between "Cost of Flexibility" vs. "Tax on Inconsistency." Leave the Metaphysics of Personal Identity explicitly unresolved.
