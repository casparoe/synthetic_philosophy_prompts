      *   **Role:** Philosopher of practical rationality (expertise in decision theory, philosophy of action, institutional encoding).
      *   **Task:** Reconstruct the implicit philosophical commitments of a specific concrete practice (a foundation with three distinct activities).
      *   **Methodology:**
          1.  Brainstorm candidate reconstructions (at least two rivals).
          2.  Argue for the best one.
          3.  Be explicit about falsification conditions (what would dislodge it).
          4.  Distinguish between strict presupposition and mere fit.
          5.  Identify underdetermination.
          6.  Address the tension (Sunk Cost Fallacy in investment vs. Sunk Cost exploitation in auction).
          7.  Run the "replacement test" (swap theories of agency, see what breaks).
          8.  Acknowledge speculation and identify settling features.
      *   **The Practice:**
          1.  *Dollar Auction:* 20-dollar bill, highest bidder pays & gets, second-highest pays & gets nothing. Bidding often exceeds 20 (even 40). Foundation budgets/advertises this.
          2.  *Investment Committee:* Strict EV analysis, discounts future, ignores sunk costs ("past costs are not reasons").
          3.  *Commitment Contracts:* Program officers bind future selves, remove discretion, based on distrust of future selves.

  2.  **Deconstruct the Three Parts:**
      *   *Part 1 (Dollar Auction):* This is the classic Shubik Dollar Auction. Standard game theory says rational agents shouldn't enter or should stop early, yet they escalate. The foundation *profits* from this. They treat it as a reliable revenue stream.
      *   *Part 2 (Investment):* Standard Neoclassical/Decision-Theoretic Rationality. Maximize EV, ignore sunk costs.
      *   *Part 3 (Commitment):* Behavioral Economics/Philosophy of Action (Ulysses contracts). Acknowledges time inconsistency or weakness of will.

  3.  **Brainstorm Candidate Reconstructions (Theories of Agency):**

      *   *Candidate A: The "Dual-Mode" Institution.*
          *   View: The institution treats agents differently based on context.
          *   Auction: Agents are *irrational* (psychologically compelled by loss aversion/escalation of commitment).
          *   Investment: Agents (the institution itself) act as *ideal rational agents* (Homo Economicus).
          *   Commitment: Agents (staff) are *weak-willed* (Akasia) needing external binding.
          *   *Critique:* This looks like inconsistency. Is there a unifying theory?

      *   *Candidate B: The "Strategic Rationality with Bounded Will" View.*
          *   View: All agents are rational maximizers, but they face specific constraints.
          *   Auction: Bidders are rational but have *non-standard preferences* (e.g., they value winning/reputation more than money, or they have threat credibility issues). The foundation exploits informational asymmetry.
          *   Investment: Standard rationality applies to capital.
          *   Commitment: Rational pre-commitment to solve time-inconsistency (Strotz model).
          *   *Critique:* Hard to justify the auction bids > $20 as "rational" without stretching preferences too thin.

      *   *Candidate C: The "Fragmented Agency" View (Best Fit).*
          *   View: The institution recognizes that human agency is *temporally extended and fragile*.
          *   Auction: Exploits the *diachronic failure* of agency (the trap of the second-highest bidder). It assumes agents cannot coordinate across time to stop the escalation.
          *   Investment: The institution acts as a *timeless principal* ignoring past errors.
          *   Commitment: Acknowledges the *temporal fragmentation* of the self (Present Self vs. Future Self).
          *   *Unifying Thread:* The institution treats *ideal rationality* as a normative goal for itself (Investment), but treats *actual human psychology* as descriptively flawed (Auction, Commitment). It is a "Paternalistic Realist."

      *   *Candidate D: The "Institutional Schizophrenia" View.*
          *   View: There is no coherent theory. The left hand doesn't know what the right hand is doing.
          *   *Critique:* Institutions usually survive because of functional coherence, even if implicit. This is too dismissive.

      *   *Refining the Rivals:*
          *   *Rival 1: The "Standard Rationality + Error" Model.* Agents are fundamentally expected-value maximizers. The auction is just a confusion/error. The commitment contracts are just risk management. Sunk costs are ignored because they are logically irrelevant.
          *   *Rival 2: The "Psychological Realist/Behavioral" Model.* Agents are systematically biased (loss aversion, present bias). The institution encodes a theory of *bounded rationality*. It exploits biases in the auction, corrects for them in investment (by strict rules), and binds against them in HR.

      *   *Let's sharpen the philosophical distinction.*
          *   *Rival 1 (The Rationalist Reconstruction):* The bidders are rational. They have a preference for "not losing" or "reputation" that exceeds $20. The commitment contracts are rational pre-commitment devices (Ulysses). The investment policy is rational maximization. *Tension:* Why does the investment policy say "past costs are not reasons" while the auction relies on them being reasons?
          *   *Rival 2 (The Dual-Process/Fragmented Self Reconstruction):* The institution distinguishes between *System 2* (Investment Committee) and *System 1* (Bidders/Program Officers). It treats the Investment Committee as the "True Self" and the others as susceptible to cognitive capture.

      *   *Selection:* I will argue for a reconstruction I'll call **"Normative Idealism vs. Descriptive Realism."** The institution holds a *normative* theory of rationality for itself (Investment), but a *descriptive/psychological* theory of human frailty for its subjects (Auction/Staff). This isn't inconsistency; it's a division of labor between how one *ought* to decide and how people *do* decide.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Set the stage. Acknowledge the tension.
      *   **Brainstorming Rivals:**
          1.  *The Coherent Rationalist:* Everyone is rational. Auction bids reflect hidden preferences (reputation/threat). Commitment is rational pre-commitment. Sunk cost policy is consistent because the auction isn't about sunk costs, it's about threat.
          2.  *The Behavioral Realist:* Humans are biased. Auction exploits loss aversion. Commitment combats present bias. Investment policy is an aspirational rule to counteract bias.
      *   **Selecting the Best:** The Behavioral Realist is stronger but needs nuance. I'll refine it to **"Institutional Paternalism based on Diachronic Fragmentation."** The institution views the *self* as divided over time.
      *   **Analyzing the Auction:** Does it presuppose irrationality? Yes, specifically *escalation of commitment* driven by the sunk cost fallacy or loss aversion. If bidders were purely EV maximizers, the game yields $0 profit. The fact it is *budgeted* implies the institution believes the error is *systematic and predictable*.
      *   **Analyzing the Investment:** Strict EV. Ignores sunk costs. This is the "View from Nowhere."
      *   **Analyzing the Commitment:** Binds future self. Presupposes time inconsistency (hyperbolic discounting) or weakness of will.
      *   **Addressing the Tension:** Investment says "Ignore Sunk Costs." Auction says "Count on others falling for Sunk Costs." Is this hypocrisy? No, it's a distinction between *normative logic* (how capital should be allocated) and *empirical psychology* (how humans behave). The institution acts as the rational agent vis-a-vis the market, but as a manipulator vis-a-vis the donors.
      *   **Replacement Test:**
          *   *Swap:* If we assume agents are perfectly rational time-consistent maximizers.
          *   *Effect:* Auction revenue collapses (bids stop at $1 or don't start). Commitment contracts become unnecessary (future self is trustworthy). Investment policy stays the same.
          *   *Survival:* Only Investment policy survives. This proves the institution's revenue and HR model depend on the "flawed agent" theory.
      *   **Underdetermination:** We don't know *why* they bid. Is it loss aversion? Reputation? Spite? The practice fits all. We need exit interviews or bid caps to settle.
      *   **Falsification:** If the auction stopped making money, or if staff successfully lobbied to remove commitment contracts without performance dropping.

  5.  **Refining the Tone:**
      *   Needs to be philosophical, precise, not merely descriptive.
      *   Use terms like "diachronic agency," "normative vs. descriptive," "money pump," "pre-commitment."
      *   Ensure the distinction between *presupposition* (must be true for practice to work) and *compatibility* (could be true) is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "second-highest bidder" rule specifically? Yes, that's the trap.
      *   *Check:* Did I address the "investment committee" ignoring sunk costs? Yes, that's the contrast.
      *   *Check:* Is the tension resolved? The resolution is that the institution occupies two different stances: the *deliberative stance* (for itself) and the *predictive/design stance* (for others).
      *   *Check:* Did I include the "Replacement Test"? Yes.
      *   *Check:* Did I identify what would settle the speculation? Yes, data on bidder motivation and staff performance without contracts.

  7.  **Final Polish:** Ensure the voice sounds like a philosopher of action (e.g., referencing Bratman, Elster, Schelling implicitly or explicitly in concept). Make sure the distinction between the "Theory of the Good" (Investment) and "Theory of the Person" (Auction/HR) is sharp.

  *(Self-Correction on the "Rationalist" rival)*: I need to make sure the Rationalist rival is charitable. A sophisticated game theorist *could* explain the auction via reputation or threat credibility. I must argue why the *institution's budgeting* of the proceeds suggests they don't believe that explanation, but rather rely on the error.

  *(Refining the "Tension")*: The tension is between the *Logic of Decision* (Investment) and the *Psychology of Action* (Auction/HR). The institution resolves this by being a *Realist* about humans and an *Idealist* about capital.

