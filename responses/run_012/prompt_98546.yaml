answer: |-
  Here is the procedure, the case runs, and the critique.

  ### The Procedure: "The Weight of Words" (90 Minutes)

  **Goal:** Move from "He said/She said" to "What does this commitment mean now?"
  **Tone:** Calm, slow, neutral. Do not let them answer for each other.

  **Step 1: The Switch (15 Mins)**
  *Ask Promisor:* "When you said those words, did you feel like you were just guessing about the future, or did you feel like you were locking yourself in?"
  *Ask Promisee:* "When you heard it, did you think he was being nice, or did you think he was handing you a right?"
  *   **STOP POINT 1:** If Promisor says "Just guessing" AND Promisee says "Just being nice," **THE PROMISE IS DEAD.** It was never a promise; it was a prediction or a hope. Explain: "You weren't playing the same game. No one is bound."
  *   **Relitigation Warning:** If they start arguing about *why* they said it ("I was tired," "You pressured me"), stop them. Ask: "At the exact moment the words landed, was there a click?"

  **Step 2: The Build (20 Mins)**
  *Ask Promisee:* "After that click, did you change your life? Did you spend money, time, or energy that you wouldn't have if you thought the promise was empty?"
  *Ask Promisor:* "Did you know they were building on this? Did you see them laying bricks on your word?"
  *   **STOP POINT 2:** If Promisee says "No, I didn't change anything," **THE PROMISE IS DEAD.** There is no injury of disregard because no plans were made. Explain: "You weren't leaned on. You can walk away, but you should say you're sorry for the confusion."
  *   **Relitigation Warning:** If Promisee lists every tiny inconvenience, focus on the big one. "What is the one big thing you did because you thought this was locked in?"

  **Step 3: The Release (20 Mins)**
  *Ask Promisor:* "Something has changed. Do you want to break the promise, or do you want to be released from it?"
  *Ask Promisee:* "If they ask to be let go, is there any version of that you can accept? Or is the principle the only thing that matters?"
  *   **Logic:** A promise gives the Promisee authority. Only they can release that authority.
  *   **STOP POINT 3:** If Promisor says "I can't do it" (Impossibility) vs "I don't want to" (Inconvenience).
      *   If **Physical/Legal Impossibility** (e.g., "I'm in jail," "The house burned down"): **THE PROMISE IS DEAD.** You cannot promise the impossible.
      *   If **Financial/Emotional Hardship**: The Promise **STANDS**. Hardship is not impossibility.
  *   **Relitigation Warning:** If Promisor says "It's not fair because [X happened]," remind them: "Fairness is for negotiating the *how*, not the *if*."

  **Step 4: The Injury (20 Mins)**
  *Ask Both:* "If this promise is broken, what is the hurt? Is it just the loss of the thing (money/time), or is it the message that your plans didn't matter?"
  *   **Logic:** This is the core moral weight.
  *   **STOP POINT 4:** If the injury is purely financial and can be repaid: Negotiate repayment. **PROMISE STANDS (Modified).**
  *   **STOP POINT 5:** If keeping the promise destroys the Promisor (health/safety) OR breaking it destroys the Promisee (safety/survival): **HAND IT BACK TO THEM.** This is no longer about truth; it is about what they owe each other as humans. I cannot decide this.

  **Step 5: The Agreement (15 Mins)**
  *   If Promise Stands: Write down *how* and *when*.
  *   If Promise Dead: Write down "No obligation," optionally with an apology.
  *   If Handled Back: Write down "No agreement reached."

  ***

  ### Case Runs

  **Case 1: Two Brothers (House & Sick Wife)**
  *   **Step 1 (Switch):** Older brother: "I locked myself in." Younger brother: "He handed me a right." (Promise exists).
  *   **Step 2 (Build):** Younger brother: "I gave two years of weekends. I didn't take other paid jobs." Older brother: "I saw him doing it." (Reliance established).
  *   **Step 3 (Release):** Older brother: "I can't pay without institutionalizing my wife." This is financial hardship, not physical impossibility. He *could* pay, the consequences are just severe.
  *   **Step 4 (Injury):** Younger brother: "It's that I worked for free based on your word."
  *   **Outcome:** **THE PROMISE STANDS.**
  *   **Mediator's Note:** I hate this. The procedure forces the older brother to choose between his brother's trust and his wife's care. The logic holds (reliance was total), but the human cost is terrible. I have to tell the older brother: "The promise stands. You owe the money. How you find it is not the promisee's problem, but we can structure the payment."
  *   **Discomfort:** I am prioritizing the younger brother's reliance over the wife's health. That sits wrong with me, but the procedure demands it to maintain the utility of promising.

  **Case 2: Daughter & Dementia (Dying Mother's Wish)**
  *   **Step 1 (Switch):** Daughter: "I locked myself in." Brother: "She handed Mother a right." (Promise exists).
  *   **Step 2 (Build):** Mother relied by dying peacefully. Daughter relied by organizing her life around this.
  *   **Step 3 (Release):** Daughter: "I am coming apart. I physically cannot do this." This borders on **Impossibility** (Health/Safety).
  *   **Step 4 (Injury):** Brother: "It's about Mother's wish." Daughter: "It's about my survival."
  *   **Outcome:** **STOP POINT 5 (HAND IT BACK).** This is about what they owe each other as siblings, not the promise. The promise is functionally dead because the capacity is gone, but the guilt remains.
  *   **Mediator's Note:** This feels correct. A promise cannot demand self-destruction.

  **Case 3: Mate & Alibi (The Crash)**
  *   **Step 1 (Switch):** Mate: "I locked myself in." Guy: "He handed me a right."
  *   **Step 2 (Build):** Guy relied by not getting a lawyer/turning himself in.
  *   **Step 3 (Release):** Guy: "I can't lie to the police."
  *   **Outcome:** **THE PROMISE IS DEAD (Void).**
  *   **Mediator's Note:** This falls under Step 1/3. Promising is a social practice for *coordination*, not *obstruction*. You cannot hand authority over your future self to commit a crime. The "practice" (Rawls) doesn't cover this. I tell the guy: "This isn't a promise. It's a conspiracy. You owe him nothing."

  ***

  ### Critique: Where This Misfires

  1.  **Power Imbalances:** This procedure assumes two equals. If one person is intimidating, the "Switch" (Step 1) will be coerced. The procedure cannot detect fear disguised as agreement.
  2.  **The "Dead" Zone:** In Case 2, I handed it back to them. In reality, they can't solve that. The procedure identifies the impasse but doesn't resolve the grief. It leaves them with a "No Agreement" sheet when they need closure.
  3.  **My Values:** Step 3 (Hardship vs. Impossibility) is my value dressed as logic. I decided financial ruin is not enough to break a promise. A different culture, or a different mediator, might say "Family survival trumps debt." I am prioritizing *autonomy* and *reliance* over *welfare*.
  4.  **Emotional Truth:** Sometimes people don't care about the "authority over future self." They care about love. If I treat a marriage dispute like a Rawlsian practice, I might solve the contract and kill the relationship.

  ***

  ### The One-Pager (For Your Bag)

  **THE WEIGHT OF WORDS (90 MINS)**

  **1. THE SWITCH (Did we promise?)**
  *   *Ask:* "Did you feel a click? Did you feel locked in?"
  *   **STOP:** If both say "No/Just guessing" → **PROMISE DEAD.** (It was a hope).
  *   *Trap:* Don't let them argue about *why*. Just the *moment*.

  **2. THE BUILD (Did you rely?)**
  *   *Ask:* "Did you change your life based on this?"
  *   **STOP:** If Promisee says "No" → **PROMISE DEAD.** (No harm done).
  *   *Trap:* Focus on the big change, not small annoyances.

  **3. THE RELEASE (Can you get out?)**
  *   *Ask:* "Is it impossible (can't) or hard (won't)?"
  *   **STOP:** If Physically/Legally Impossible → **PROMISE DEAD.**
  *   **STOP:** If Financially/Emotionally Hard → **PROMISE STANDS.**
  *   *Trap:* Hardship is not a release. Only the Promisee can release.

  **4. THE INJURY (What hurts?)**
  *   *Ask:* "Is it the loss, or the disregard?"
  *   **STOP:** If keeping it destroys Promisor OR breaking it destroys Promisee → **HAND BACK TO THEM.** (This is about values, not rules).
  *   *Trap:* Don't solve their tragedy. Name it.

  **5. THE PAPER**
  *   **Stands:** Write *How* and *When*.
  *   **Dead:** Write *No Obligation*.
  *   **Hand Back:** Write *No Agreement*.

  **RED FLAGS (Abort Procedure)**
  *   Threats of violence.
  *   One person speaking for the other.
  *   Illegal acts (promises to lie/harm). → **PROMISE VOID.**
