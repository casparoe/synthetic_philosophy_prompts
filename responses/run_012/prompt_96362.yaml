          *   *Verdict:* It's a strong philosophical point but technically slightly reductive. It ignores the *causal* impact on the reasoning path. If you only grade the outcome, the model might learn a heuristic that gets the right answer for the wrong reason. If you grade the process, you constrain the manifold of valid paths.
