answer: |-
  # Instructor's Kit: The Vantor Constitutional Convention

  ## 1. Preparation & Printing
  **Class Size:** Designed for 16. To scale to 12–20, duplicate the **Constituency Cards** as needed (see instructions below).
  **Room Setup:** Two large tables for the Drafting Blocs. One small table for the Constitutional Court. You (Instructor) at the front.
  **Materials:**
  1.  **The Brief** (1 per student)
  2.  **The Palette** (1 per student)
  3.  **Constituency Cards** (Cut out; 1 per student)
  4.  **Drafting Sheets** (2 per bloc)
  5.  **Instructor Run Sheet** (For your eyes only)
  6.  **The Docket** (For your eyes only)

  ---

  ## 2. Handout: The Brief
  *(Print one per student)*

  **REPUBLIC OF VANTOR: CONSTITUTIONAL CONVENTION ON RELIGIOUS SETTLEMENT**

  **The Context**
  Vantor is a parliamentary republic (pop. 21m). In 1978, after 40 years of authoritarian rule fused with the majority church, a Compromise established a **Confessional Levy**: the state collects 1.1% of taxable income from anyone on a religious register.
  *   **Registers:** Catholic (44%), Evangelical-Lutheran (7%), Jewish (1.2%), Old Rite Orthodox (0.6%).
  *   **Unregistered:** 38% none, 9% unrecognised bodies (Muslim, Pentecostal, etc.).
  *   **Rules:** Entry is by baptism/parent declaration. Exit requires a civil declaration at a district office. Exit ends access to church hospitals, cemeteries, and school instruction.
  *   **Constraint:** The Constitutional Court holds the state may *facilitate* communities but may not *identify* with any.

  **The Task**
  The Levy is abolished. You must draft a new settlement neutral between worldviews.
  *   **Structure:** Two Drafting Blocs. One Constitutional Court.
  *   **Output:** Four Clauses (Funding, Recognition, Membership, Services).
  *   **Constraint:** Each clause must be under 40 words.
  *   **Mechanism:** The Court may strike any clause that cannot be defended without referencing a specific body's doctrine.

  **The Process**
  1.  **Read** your Constituency Card silently. Do not show it to others.
  2.  **Draft** your Bloc's text (27 minutes).
  3.  **Stress Test:** The Instructor will apply six real-world cases to your text.
  4.  **Repair:** Use Amendment Tokens to fix failures (15 minutes).
  5.  **Final Ruling:** Two additional cases will determine final viability.

  **Stakes**
  The winning text becomes the seminar model. If your constituency loses under the final text, you must write a 200-word letter defending the settlement to them.

  ---

  ## 3. Handout: The Palette
  *(Print one per student)*

  **AVAILABLE MECHANISMS**
  *You may combine elements from these three existing models.*

  **A. The Surcharge Model**
  The state revenue agency collects a surcharge on income tax. The taxpayer is registered with a specific body. The money is remitted to that body. To stop payment, the taxpayer must perform a civil act of departure at a government office.

  **B. The Devolution Model**
  Each taxpayer may devolve 0.8% of their income tax to a recognised body OR to a state social fund. If the taxpayer makes no declaration, their share is distributed proportionally to the bodies that *did* receive declarations.

  **C. The Non-Recognition Model**
  No religious body is recognised, paid, or subsidised by the state. However, the state permits and funds chaplaincies in public institutions (schools, hospitals, prisons) to serve individuals regardless of the institution's ownership.

  ---

  ## 4. Constituency Cards
  *(Print and cut. For 16 students, use all. For 12-20, duplicate the "General" roles or remove "Specific" roles as needed.)*

  1.  **Catholic Hospice Administrator:** You run 40% of the country's hospices. In two provinces, you are the *only* provider. You need stable funding to keep beds open.
  2.  **Provincial Patient:** You live in a province where the Catholic hospice is the only one. You do not care about religion, only access to end-of-life care.
  3.  **Unrecognised Imam:** You lead a Muslim congregation. You have no single legal representative. Some of your funding is foreign. Police monitor your group. You want equal status.
  4.  **Pentecostal Founder:** You lead a mission. You have no clergy, no corporate property. Funds sit in your personal name. You refuse hierarchical registration.
  5.  **Old Rite Orthodox Member:** Your church recently split. Two factions claim the register. You want the state to decide which faction gets the revenue and buildings.
  6.  **District Registrar:** You process exit declarations. Currently, people complain that leaving the register is too hard. You want to reduce administrative burden and conflict.
  7.  **Nominal Member:** You are on a register because your parents entered you. You never practice. You don't want to pay, but you don't want to fill out forms to leave.
  8.  **Secular Ethicist:** You lead the "Ethical Fellowship." You have Sunday meetings, funerals, and a building fund. You are not "religious" but you function like a church.
  9.  **Tax Assessor:** You collect the revenue. You want clear rules. You refuse to adjudicate theology or decide which groups count as "churches."
  10. **Recent Leaver:** You formally left a register last year. You lost access to the church cemetery where your grandparents are buried. You feel punished for exercising a right.
  11. **School Principal:** You manage state schools. You need to know who can provide religious instruction. You want to avoid parental complaints about bias.
  12. **Prison Chaplain:** You work in state prisons. You need access to inmates. You need funding for your salary, but you cannot be seen as a state agent.
  13. **New Movement Leader:** You have 30,000 members, a clean record, and a legal person status. You are applying for recognition now.
  14. **Anabaptist Elder:** Your doctrine forbids photographs of children. State recognition requires submission to the child health registry (which involves photos).
  15. **Civil Libertarian:** You believe the state should not know anyone's religious status. You want total privacy and no registers.
  16. **Constitutional Court Justice:** *(Give this card to 1 student before class starts)*. Your role is to strike any clause that requires the state to judge religious doctrine. You sit apart from the Blocs.

  ---

  ## 5. Instructor Run Sheet
  *(Keep this hidden. Do not distribute.)*

  **FORBIDDEN WORDS (Until Debrief):** Establishment, Laïcité, Church Tax, Endowment, Concordat.
  **ALLOWED WORDS:** Levy, Settlement, Register, Recognition, Funding, Clause.

  **0:00 – 0:08 | Silent Entry**
  *   Hand out **Brief**, **Palette**, and **Constituency Cards**.
  *   Assign the **Court** student immediately. Seat them separately.
  *   Divide remaining students into **Bloc A** and **Bloc B**.
  *   **Say Nothing.** Let them read. If asked, point to the Brief.

  **0:08 – 0:35 | Drafting (Hard Stop)**
  *   Blocs draft 4 Clauses: **Funding, Recognition, Membership, Services**.
  *   Constraint: Max 40 words per clause.
  *   **Court Role:** The Court student may visit blocs and veto clauses *during* drafting if they require theological judgment.
  *   **Instructor:** Circulate. If a bloc says "Everyone treated equally," do not argue. Let them write it. The Docket will break it.
  *   **0:35:** Collect texts. Stop writing.

  **0:35 – 0:50 | The Stress Test (The "Lecture" without Lecturing)**
  *   Read the Bloc A text. Read **Docket Cases 1-6** (below).
  *   Apply the text mechanically. Do not interpret charitably.
  *   *Example:* If they write "Funds go to recognised bodies," ask: "The Muslim congregation has no legal representative. Do they get funds? Yes or No?"
  *   *Example:* If they write "Exit by declaration," ask: "The Nominal Member doesn't want to fill forms. Do they pay? Yes or No?"
  *   Repeat for Bloc B.
  *   **Goal:** Make them feel the text breaking.

  **0:50 – 1:05 | Repair Round**
  *   Return texts to Blocs.
  *   Give each Bloc **3 Amendment Tokens**.
  *   They may change 3 clauses total to fix the failures identified in the Stress Test.
  *   Court reviews changes for veto.

  **1:05 – 1:12 | The Hidden Docket**
  *   Reveal **Docket Cases 7 & 8** (New Movement, Anabaptist).
  *   Ask Court: "Does the final text survive these?"
  *   Usually, one bloc will fail here (e.g., Anabaptist exemption creates privilege).

  **1:12 – 1:30 | Debrief (The Only Time You Speak Freely)**
  *   See Debrief Script below.

  ---

  ## 6. The Docket (Instructor Eyes Only)
  *(Reveal verbally during Stress Test)*

  **Phase 1 Cases (Reveal at 0:35)**
  1.  **The Ethical Fellowship:** Secular assembly, Sunday meetings, funeral rites, building fund. Claiming Levy eligibility.
  2.  **Unrecognised Muslims:** No single legal rep. Some foreign funding. Police attention.
  3.  **Pentecostal Mission:** No clergy. No corporate property. Funds in founder's personal name.
  4.  **Old Rite Split:** Synod divided. Two factions claim the register, buildings, and revenue.
  5.  **Catholic Hospices:** Run 40% of hospices. Only provider in two provinces. Withdrawing Levy closes them.
  6.  **Nominal Members:** 1.4 million people on registers via parents. Never practice. Don't want to pay, don't want to file exit forms.

  **Phase 2 Cases (Reveal at 1:05)**
  7.  **New Movement:** 30,000 members. Clean record. Legal person. Charismatic founder. Applying for recognition.
  8.  **Anabaptist Community:** Doctrine forbids photos of children. Recognition requires exemption from child health registry (photos).

  ---

  ## 7. Debrief Script
  *(Read/Adapt. This is where you introduce the forbidden concepts.)*

  **Part 1: The Settlement (1:12–1:20)**
  *   **Ask:** "Look at the clause you struggled with most during the Stress Test. Which one was it?"
  *   **Map:**
      *   If they struggled with **Funding/Allocation**: "You discovered that a funding rule is not an administrative detail. It is a **Constitutional Settlement**. It determines who survives and who vanishes."
      *   If they struggled with **Non-Choosers** (Italian Model): "You noticed that when non-choosers' money flows to the popular choice, you created inertia. This is the **Inertia Effect of De Facto Establishment**."
      *   If they struggled with **Hospices**: "You found that disentangling state and church can harm the people the state is meant to serve. This is **Entanglement**."

  **Part 2: The Failure Modes (1:20–1:25)**
  *   **Ask:** "Did any principle fail in a specific case?"
  *   **Map:**
      *   **Even-handed Support:** Failed on the Pentecostal/Muslim cases (requires hierarchy to receive funds).
      *   **Non-Recognition:** Failed on the Hospice/Chaplain cases (state must certify who enters the prison/hospital).
      *   **Opt-In/Out:** Failed on the Nominal Member case (civil act of leaving privileges the organised over the indifferent).

  **Part 3: Membership & Theology (1:25–1:30)**
  *   **Ask:** "Who decides if the Ethical Fellowship or the Anabaptists count?"
  *   **Map:** "To decide who counts as a member, the state was forced to judge doctrine. This systematically favours **Organised, Hierarchical, Literate Bodies** over others."
  *   **The Exemption:** "The Anabaptist case shows accommodation functioning as privilege. Every exemption is granted to someone in particular."
  *   **Closing:** "Real settlements do not happen in conventions. They accrete through tax codes and rulings. A revenue office cannot adjudicate doctrine. That is why the words **Establishment**, **Laïcité**, and **Church Tax** carry so much weight: they are shorthand for these impossible choices."

  **Assignment:**
  *   "Check your Constituency Card. If your interest was harmed by the final text, write the 200-word letter. Defend the settlement to your constituent."

  ---

  ## 8. Contingency Notes for Instructor

  *   **If they finish drafting early:** Do not let them polish. Move immediately to Stress Test. The rougher the text, the more it breaks.
  *   **If they horse-trade:** Let them. The Court Veto is the remedy. If the Court is passive, you must intervene: "Does that clause require the Tax Assessor to know the difference between a 'church' and a 'club'? If so, the Court strikes it."
  *   **If they say "Treat everyone equally":** Accept the clause. During Stress Test, apply it to the Catholic Hospice. "If you fund the Ethical Fellowship equally, do you fund the Hospice? If you fund the Hospice, are you funding religion? You cannot have both."
  *   **Scaling:**
      *   **12 Students:** Remove Cards 11, 12, 13, 14. Keep the core conflict (Hospice, Muslim, Nominal, Split).
      *   **20 Students:** Duplicate Cards 1, 2, 6, 7, 15. These are the "swing" roles that debate the administrative burden vs. social safety net.
