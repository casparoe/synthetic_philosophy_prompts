  "Like a center of mass?" he asked.
  "Exactly. Like the hole in a donut. Nothing there, but the donut obeys it."
  He took a bite. "So if I tell the donut its center is a fiction..."
  "It doesn't care. It still falls."
  "But if I tell you..."
  "I get offended."
  "Why?"
  "Because the donut's center of mass is a fiction that works without belief. The self is a fiction that exists only because I keep insisting it's real."
  He smiled. "So the donut is humble enough to be empty."
  "Yeah. The self is just a story that demands to be taken literally."

