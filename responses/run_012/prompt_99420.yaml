answer: |-
  # THE FAMINE POSITION SORTER
  **For the use of soil scientists turned philosophers.**  
  *Based on empirical claims about cases, not self-selected labels.*

  ### THE TREE

  **Q1. THE PHYSICAL LIMIT (The Malthus Test)**  
  *In the affected region, was there a genuine physical deficit of food calories compared to pre-crisis consumption levels?*  
  *   **YES:** → **Leaf A (Malthusian / FAD View)**  
  *   **NO:** → *Food existed but didn't reach mouths.* → **Go to Q2**

  **Q2. THE MECHANISM (The Sen Test)**  
  *Was the barrier to access primarily economic (price spikes, wage collapse) or administrative (law, confiscation, blockade)?*  
  *   **ECONOMIC:** → **Leaf B (Sen's Entitlement View)**  
  *   **ADMINISTRATIVE:** → *Policy kept food away.* → **Go to Q3**

  **Q3. THE CAPACITY & TRIGGER (The Davis Test)**  
  *Did natural triggers (blight, drought, El Niño) render state intervention futile, or could a competent state have mitigated the mortality?*  
  *   **FUTILE:** → **Leaf C (Natural Disaster / Excuse View)**  
  *   **MITIGATABLE:** → *Deaths were preventable.* → **Go to Q4**

  **Q4. THE MENS REA (The Crime Test)**  
  *To classify this as a 'crime' or 'atrocity', must the state have intended the deaths, or is knowing negligence sufficient?*  
  *   **INTENT REQUIRED:** → **Leaf D (Genocide / Deliberate Atrocity)**  
  *   **NEGLIGENCE SUFFICIENT:** → **Go to Q5**

  **Q5. THE STRUCTURE (The Law vs. Politics Test)**  
  *Is the culpability located in specific illegal acts (weaponizing starvation) or in the broader political contract (governing by famine)?*  
  *   **ILLEGAL ACTS:** → **Leaf E (International Law / Starvation as Weapon)**  
  *   **POLITICAL CONTRACT:** → **Leaf F (de Waal / Famine Crimes)**

  ---

  ### THE LEAVES (Positions & Test Cases)

  **Leaf A: Malthusian / Food Availability Decline (FAD)**  
  *Core Claim:* Famine is a supply problem. Population outstrips resources.  
  *   **Bengal 1943:** Food shortage caused by war disruption/cyclone.  
  *   **Ireland 1840s:** Potato blight destroyed the sole calorie source.  
  *   **GLF:** Agricultural collapse made deaths inevitable.  

  **Leaf B: Sen's Entitlement View**  
  *Core Claim:* Famine is a distribution/access problem, often market-driven.  
  *   **Bengal 1943:** **Classic Case.** Food available; war inflation priced laborers out.  
  *   **Ireland 1840s:** Food exported from Ireland while peasants starved (price/access).  
  *   **GLF:** Rural entitlements collapsed due to procurement pricing.  

  **Leaf C: Natural Disaster / Excuse View**  
  *Core Claim:* Nature triggered the crisis; state blame is secondary to the shock.  
  *   **Bengal 1943:** Cyclone and war logistics made response impossible.  
  *   **Ireland 1840s:** Blight was an act of God; government limited by biology.  
  *   **GLF:** Weather anomalies exacerbated policy errors.  

  **Leaf D: Genocide / Deliberate Atrocity**  
  *Core Claim:* The state used hunger as a tool to eliminate a group; intent is key.  
  *   **Bengal 1943:** Churchill's cabinet prioritized war stocks over Indian lives (debated).  
  *   **Ireland 1840s:** British ideology sought to cull the Irish (Young Irelander view).  
  *   **GLF:** **Classic Case.** Mao purged enemies; starvation was the method.  

  **Leaf E: Int. Law / Starvation as Weapon**  
  *Core Claim:* Violation of Geneva/Rome Statutes; blockade or destruction of assets.  
  *   **Bengal 1943:** Denial of transport (boats) constituted weaponization.  
  *   **Ireland 1840s:** Export bans violated emerging human rights norms (anachronistic).  
  *   **GLF:** Confiscation of grain fits "method of warfare" against civilians.  

  **Leaf F: de Waal / Famine Crimes**  
  *Core Claim:* Famine is a political crime; negligence and callousness equal guilt.  
  *   **Bengal 1943:** Political choice to value soldiers over civilians.  
  *   **Ireland 1840s:** **Classic Case.** Ideological commitment to laissez-faire overrode relief.  
  *   **GLF:** Local cadres knew of starvation but prioritized quotas to save themselves.  

  ---

  ### EDGE CASES & BLIND SPOTS

  **1. Indistinguishable Positions: Leaf E (Int. Law) vs. Leaf F (de Waal)**  
  *Why:* In practice, "weaponizing starvation" (Law) and "governing by famine" (de Waal) converge on **negligence**. International law is expanding to include "reckless disregard," which mimics de Waal's "political crime." In the **Ireland** case, both would condemn the British administration, differing only on whether the 1840s legal framework applies.

  **2. Unoccupied Combination: "Intent to Kill + No Capacity to Save"**  
  *The Position:* "The state wanted them dead, but couldn't have saved them anyway."  
  *Why Unoccupied:* **Incoherent.** If the state lacked the capacity to prevent the deaths (Q3=Futile), claiming they *intended* the deaths (Q4=Intent) becomes metaphysically hollow. You cannot be guilty of murder by omission if you lacked the power to act. This combination collapses into **Leaf C** (Natural Disaster) empirically, even if the rhetoric is **Leaf D** (Genocide).

  **3. The "Sahel Paradox" (For your group)**  
  *Note:* Your experience suggests drought (Natural) + Market (Sen) + Policy (de Waal). This tree forces a choice at Q3 (Futile vs. Mitigatable). Most Sahel famines sit on the knife-edge where **Leaf C** advocates say "drought made it inevitable" and **Leaf F** advocates say "drought was known, response was slow." The tree separates them, but reality often blends them.
