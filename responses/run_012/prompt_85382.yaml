  (3) Priya is partly right. She raises a genuine interpretive puzzle from *NE* V regarding how incommensurable goods are equalised by money. However, she is mistaken to conclude this renders the natural/conventional distinction empty. Aristotle argues money measures demand, which is grounded in natural need, not mere convention. Interest bypasses need, thus violating nature. Her critique exposes textual tension but not necessarily a logical failure in Aristotle's ethics. She conflates the mechanism of exchange with the purpose of acquisition, missing the normative layer.

