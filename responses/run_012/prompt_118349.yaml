  Here is an analysis of the shape of the problem you have identified, broken down by your specific questions.

  ### 1. The Name of the Class
  **Confidence: High**

  The broad class of situations you are describing is standardly called **Collective Action Problems** or **Social Dilemmas**. In the language of economics and political science, these are situations characterized by **externalities**, where an individual's payoff depends not only on their own action but on the actions of others.

  More technically, in **Game Theory**, these are **Non-Cooperative Games with Many Players**. They share the structural feature you identified: the individual is **pivotal** only in the aggregate, but **negligible** in isolation.

  ### 2. One Class or Several?
  **Confidence: High**

  While they belong to the same broad family (Collective Action), game theorists distinguish your three flavours as structurally distinct games. They are siblings, not identical twins.

  *   **The Exactly-One Flavour:** This is an **Anti-Coordination Game** (specifically a variant of the *Minority Game* or *Chicken*). Success requires you to do the *opposite* of the crowd. If everyone reasons identically and chooses the same action, everyone loses.
  *   **The Divided-Pot Flavour:** This is a **Tragedy of the Commons** or a **Public Goods Game**. Success requires restraint. The dominant strategy for the individual (claim more) leads to a sub-optimal outcome for the group (pot empties).
  *   **The Threshold Flavour:** This is an **Assurance Game** (or *Stag Hunt* variant). Success requires coordination on the *same* action, but only if a critical mass is reached. The risk is not that everyone acts, but that *not enough* act.

  **Why this matters:** The reasoning move you describe ("act so the everyone-version comes out well") works differently in each. In the *Divided-Pot*, universalizing restraint works. In the *Threshold*, universalizing participation works. But in the *Exactly-One* case, universalizing "write in" fails, and universalizing "don't write in" also fails. In that specific flavour, the reasoning move requires universalizing a **probability** (e.g., "everyone should write in with a 1% chance"), not a binary action.

  ### 3. The Name of the Reasoning Move
  **Confidence: High**

  The move you describe—"don't ask what happens if I do this; ask what would happen if everyone in my position did this"—has two primary names depending on the field:

  1.  **In Ethics:** **Universalizability**. This is the core of Immanuel Kant's **Categorical Imperative** (specifically the Formula of Universal Law). It tests whether a maxim of action can be willed as a universal law without contradiction.
  2.  **In Decision Theory/Logic:** **Superrationality**. Coined by Douglas Hofstadter, this describes reasoning where agents assume that because they are rational and facing the same problem as others, they will all arrive at the same solution. Therefore, my choice is *logically correlated* with yours, even if not causally linked.

  There is also a newer term in political philosophy: **Kantian Equilibrium** (proposed by John Roemer), which models agents who choose an action based on the expectation that all others will take the *same* action.

  ### 4. Where the Line Falls (Sound vs. Fallacy)
  **Confidence: Medium**

  This is the most difficult philosophical boundary. You suspect it turns on "whether the others are like me." You are correct, but we can make that precise. The line falls on **Symmetry** and **Mechanism**.

  **A. Symmetry of Agency (The "Like Me" Test)**
  *   **Sound:** The reasoning is sound when the agents are **relevantly symmetric**. In the Radio, Pot, and Strike cases, every participant has the same payoff structure, the same information, and the same capacity to act. If I am rational, you are rational. If I reason "I should claim," I must concede you will reason "I should claim." Our decisions are **logically correlated**.
  *   **Fallacy:** The reasoning is a fallacy (specifically the **Fallacy of Composition**) when agents are **heterogeneous**. In the Plumber case, people have different skills, risk tolerances, and opportunity costs. You cannot assume that because *you* decide to study philosophy, *everyone* will. The population is not a monolith of identical reasoners; it is a market of diverse preferences.

  **B. The Feedback Mechanism**
  *   **Sound:** In your three flavours, the system is often **one-shot** or lacks a self-correcting price signal. If everyone strikes, the strike succeeds or fails immediately; there is no mechanism to say "Okay, half of you go back to work."
  *   **Fallacy:** In the Plumber case, there is a **market equilibrium**. If everyone studies philosophy, the wage for plumbers skyrockets. This price signal incentivizes the *next* cohort to become plumbers. The system self-corrects over time. Applying the "what if everyone did this" test to a single moment ignores the dynamic feedback loop that prevents the bad outcome from persisting.

  **Summary of the Line:** The move is sound when you are in a **symmetric, non-adaptive system** where your reasoning is a proxy for others' reasoning. It is a fallacy when you are in a **heterogeneous, adaptive system** (like a labor market) where diversity is the mechanism of stability.

  ### 5. Confidence and Uncertainty

  *   **Class Name (Collective Action/Social Dilemma):** 95% Confidence.
  *   **Flavours (Distinct Game Types):** 90% Confidence.
  *   **Reasoning Move (Universalizability/Superrationality):** 90% Confidence.
  *   **The Line (Symmetry/Feedback):** 70% Confidence.

  **The Point I Am Least Sure About:**
  I am least certain about the normative validity of the reasoning move in your **Exactly-One Flavour**.

  In the *Divided-Pot* and *Threshold* cases, universalizing the "good" action leads to a good outcome. In the *Exactly-One* case, universalizing "Write" leads to failure, and universalizing "Don't Write" leads to failure. The only "sound" application of the move there is to universalize a **mixed strategy** (randomization). Whether standard "Superrationality" successfully handles this without external coordination devices is a subject of ongoing debate in decision theory. Standard Causal Decision Theory says your vote doesn't matter; Superrationality says it does because it correlates with others; but in the "Exactly-One" case, perfect correlation guarantees failure. Resolving that specific paradox requires assumptions about how agents randomize that are not fully settled.
