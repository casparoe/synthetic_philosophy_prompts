      *   *Crux 1: The "Shadow of the Criterion."* Does the ultimate standard haunt the local commitment?
          *   *Test:* The "Fanatic Check." If utility demanded abandoning the wife *explicitly*, would the SC say the agent *must* abandon her? If yes, WID says integrity is lost. If SC says "no, keep the disposition," WID says "then you aren't a true consequentialist."
      *   *Crux 2: The Value of Integrity.* Can integrity be just another good to maximize?
          *   *Test:* The "Integrity Trade-off." If sacrificing one person's integrity saves two others' integrity, does the SC do it? WID says this misses the point (integrity isn't fungible).

