answer: |-
  # ADVERSARIAL COLLABORATION: THE INTEGRITY OBJECTION
  **Subject:** Bernard Williams's Critique of Consequentialism (Integrity, Ground Projects, and Alienation)
  **Participants:** Camp A (Sophisticated Consequentialism) & Camp B (Williams-Style Integrity Defense)
  **Date:** October 26, 2023

  ## PART I: AGREED CLAIMS
  *Both camps affirm the following propositions as the baseline for this disagreement. We certify that these claims accurately represent our shared understanding of the terrain.*

  1.  **Definition of the Integrity Objection:** We agree that the Integrity Objection is not merely a complaint that consequentialism is too demanding (the "overdemandingness" objection). It is the claim that consequentialism requires an agent to adopt a standpoint that is alien to their identity, treating their "ground projects" (commitments that give life meaning) as contingent instruments rather than constitutive elements of the self.
  2.  **Distinction from Negative Responsibility:** We agree that the Integrity Objection is distinct from the problem of Negative Responsibility. Negative Responsibility concerns *causal scope* (I am responsible for what I allow as well as what I do). The Integrity Objection concerns *deliberative structure* (how I am permitted to relate to my actions). One can accept Negative Responsibility without accepting the alienation of Integrity, and vice versa.
  3.  **Distinction from Moral Luck:** We agree that the Integrity Objection is not primarily about Moral Luck. It does not matter whether the outcome of a project is successful or failed due to chance; the objection is about the requirement to hold the *commitment itself* open to revision based on impersonal calculation.
  4.  **Criterion vs. Decision-Procedure:** Both camps accept the technical distinction between the **Criterion of Rightness** (what makes an act right, e.g., maximizing utility) and the **Decision-Procedure** (what the agent consciously thinks about before acting). Camp A relies heavily on this; Camp B acknowledges it but disputes its protective power.
  5.  **The "Rescue Case" (One Thought Too Many):** Both camps agree that the case of the man saving his wife from drowning (rather than a stranger) is the central intuition pump. We agree the intuition is that the agent should save the wife *because she is his wife*, without needing to justify it via general welfare.
  6.  **The "Jim Case":** Both camps agree that the Jim case (Pedro offering Jim the choice to kill one Indian to save nineteen) is in play. However, we agree that for the purposes of *this* document, the Jim case serves primarily to illustrate the pressure on the agent's character, not merely the arithmetic of lives saved.
  7.  **Psychological Possibility:** Both camps agree that a moral theory cannot demand what is psychologically impossible for a normal human agent. We disagree only on whether consequentialism demands the impossible.

  ***

  ## PART II: DISAGREEMENTS, CRUXES, AND TESTS

  | The Question | Camp A (Sophisticated Consequentialist) | Camp B (Integrity Defender) | The Crux | Evidence & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Does the Criterion of Rightness contaminate the Decision-Procedure?** | **No.** An agent can fully inhabit a ground project (e.g., "I am a painter") without consciously referencing utility. The criterion sits in the background as a selector of dispositions, not a constant deliberative input. The "one thought" is only needed if the disposition fails, not as a standard operating procedure. | **Yes.** Even if the thought is not conscious, the *authority* of the project is undermined. The agent knows (or must accept) that the commitment is valid *only insofar as* it maximizes value. This "shadow of the ledger" makes the commitment provisional, which is itself a form of alienation. | **The Stability of Ground Projects:** Are ground projects compatible with knowing they are contingent on an external standard? | **The "Government House" Test:**<br>Imagine a society where elites are taught consequentialism but raise the public on non-consequentialist commitments to maximize stability.<br>**Camp A Prediction:** This is permissible/required if it maximizes utility. The elites maintain integrity by valuing the outcome.<br>**Camp B Prediction:** This proves the alienation. The elites cannot share the "integrity" of the public because they view the public's commitments as tools. The split confirms the theory destroys shared moral community. |
  | **2. Is Integrity a Value to be Maximized or a Constraint on Maximization?** | **Integrity is a Value.** Integrity (psychological wholeness, fidelity to commitments) is a good thing that contributes to overall welfare. We weigh it in the ledger. Sometimes integrity wins; sometimes it is outweighed by catastrophe. | **Integrity is a Condition of Valuing.** Integrity is not an item *in* the ledger; it is the standpoint *from which* one reads the ledger. To weigh integrity against other goods is to misunderstand it. You cannot sacrifice the condition of agency for the sake of agency's output. | **The Fungibility of the Self:** Can the "shape of a life" be traded off against other goods without a remainder of loss? | **The "Project Swap" Case:**<br>Agent has a ground project (Music). Utility proves they would do 10% more good by switching to (Medicine).<br>**Camp A Prediction:** The agent ought to switch. If they refuse, they are wrong (though perhaps excused). Integrity is the cost of staying, and it didn't outweigh the benefit.<br>**Camp B Prediction:** The demand to switch is the violation. The "ought" is spurious. The loss of the musical life isn't a "cost" to be weighed; it's the destruction of the agent's moral locus. |
  | **3. What is the nature of the "One Thought Too Many"?** | **It is a Deliberative Error.** The thought is "too many" because it is inefficient and psychologically corrosive. Sophisticated consequentialism agrees: don't have the thought. Save the wife because you love her. That is the optimal procedure. | **It is a Justificatory Requirement.** The thought is "too many" because its *availability* is required by the theory. Even if I don't think it now, I must accept that if the utility calculus shifted (e.g., saving the stranger saves the world), I would be *required* to think it. The threat of the thought ruins the love. | **The Counterfactual Constraint:** Does the agent's obligation change if the stakes change slightly, and does that potential change define the current commitment? | **The "Ticking Bomb Wife" Case:**<br>Same rescue case, but saving the stranger prevents a nuclear detonation.<br>**Camp A Prediction:** Here, the thought is no longer "too many"; it is required. The theory adapts. Integrity yields to catastrophe.<br>**Camp B Prediction:** This confirms the objection. The fact that the theory *can* demand you let your wife die shows that your commitment to her was never absolute, only provisional. That provisionality is the loss of integrity. |

  ***

  ## PART III: VERBAL DISPUTE CHECK
  *We have identified one area where terminological divergence may be masking substantive agreement or disagreement.*

  **Term:** **"Integrity"**

  *   **Camp A Usage:** We tend to use "integrity" to mean **psychological coherence and fidelity to one's current dispositions.** For us, an agent has integrity if they act consistently with their character. Consequentialism supports this by encouraging stable dispositions.
  *   **Camp B Usage:** We use "integrity" to mean **identification with the source of one's actions.** For us, an agent has integrity only if they view their actions as flowing from *their* will and projects, not from an impersonal standpoint that uses them as a channel.
  *   **Diagnosis:** This is **not merely verbal.** Camp A views integrity as a *property* of the agent that can be optimized. Camp B views integrity as the *perspective* of the agent that cannot be optimized without disappearing.
  *   **Resolution Protocol:** When Camp A says "We preserve integrity," Camp B must hear "We preserve psychological stability." When Camp B says "Integrity is violated," Camp A must hear "The agent is being asked to adopt an alien justificatory standpoint." We will not attempt to force a single definition, as the disagreement turns precisely on which definition captures the moral truth.

  ***

  ## PART IV: THE CENTRAL CRUX (THE "KILL SWITCH")
  *If we could settle only one empirical or conceptual question to move this debate forward, it would be this:*

  **The Question:** **Is the "Criterion/Procedure" split psychologically stable in high-stakes environments?**

  *   **The Hypothesis:** Camp A claims an agent can sincerely hold a ground project (e.g., "I will never kill an innocent") while accepting the Criterion ("...unless utility demands it"). Camp B claims that accepting the Criterion inevitably erodes the sincerity of the project over time.
  *   **The Test:** Longitudinal study of agents trained in "Two-Level" moral thinking (act on rules, accept exceptions only in extreme abstract cases) vs. agents trained in "Absolute" moral thinking.
  *   **Camp A Prediction:** The Two-Level agents will report higher well-being and equal moral consistency. They will successfully compartmentalize the criterion without feeling alienated from their projects.
  *   **Camp B Prediction:** The Two-Level agents will report higher levels of "moral dissociation" and anxiety. When the extreme case approaches, their commitment to the project will collapse faster than the Absolute agents, proving the commitment was hollow.

  *Signed,*

  **Camp A (Sophisticated Consequentialism)**
  **Camp B (Williams-Style Integrity Defense)**
