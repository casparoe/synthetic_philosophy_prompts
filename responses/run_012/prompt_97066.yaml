      *   *The Sophisticated Consequentialist Reply:* We don't need to calculate every time. We can have dispositions, habits, and personal commitments *as* the best decision procedure to maximize utility. So, I save my wife *because* she's my wife, and that's consistent with consequentialism if having that disposition is optimal.
      *   *The Integrity Defender Counter:* It's not about the *thought process* in the moment; it's about the *justificatory structure*. Even if I don't calculate, I must be willing to abandon the project if the calculus demands it. My commitment is always provisional. That provisionality *is* the loss of integrity.
      *   *Distinctions:* Need to separate Integrity from Negative Responsibility (being responsible for what you allow vs. what you do) and Moral Luck (outcomes affecting blameworthiness). Williams touches on these, but the Integrity Objection is distinct.

