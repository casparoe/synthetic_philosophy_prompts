          2.  *Utility of Belief:* We care about hope/peace of mind. Ignorance is bliss literally (utility-wise).
          3.  *Bounded Rationality/Self-Control:* We aren't perfect maximizers. We might panic (investor example). Good assumes perfect rationality.
          4.  *Irreversibility:* Sometimes knowing forces a hand socially or psychologically, even if logically you could ignore it.
