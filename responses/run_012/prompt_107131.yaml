answer: |-
  The claim you are referring to is known in decision theory as **Good's Theorem on the Value of Information**. It is a foundational result in Bayesian decision theory, and your summary of the logic is accurate: *if* you are a rational agent maximizing expected utility, *and* information is free, *then* the expected utility of making a decision after observing information is always greater than or equal to the expected utility of making the decision without it.

  The conflict you feel arises because the theorem is a **normative** statement about ideal rationality, while your observations are **descriptive** facts about human psychology and the nature of utility. The theorem is not "wrong," but its assumptions do not hold in the scenarios you described.

  Here is an account of where the conflict comes from, why the framing matters, and how to reconcile the logic with reality.

  ### 1. What the Claim Actually Asserts
  To understand the disconnect, we must be precise about what Good's Theorem does and does not say.

  **It is about Expectations, not Realizations**
  The theorem states that *before* you see the information, your *expectation* of your future well-being should go up (or stay the same) if you choose to acquire it. It does **not** promise that you will be happier *after* you see the specific data.
  *   **Example:** Imagine a lottery ticket. Before the draw, the *option* to know the result is valuable because it allows you to claim the prize if you win. However, if you look at the ticket and see you lost, you are momentarily unhappier than if you had remained ignorant. Good's Theorem says that *before* looking, the mathematical average of (Happiness if Win + Sadness if Lose) weighted by their probabilities is higher than simply not looking.
  *   **Why the framing matters:** The theorem justifies the *policy* of seeking information. It argues that a strategy of "always look" yields better long-term outcomes than a strategy of "never look." It does not guarantee that every instance of looking will feel good.

  **It Assumes Information is Instrumental, not Intrinsic**
  This is the most critical conceptual pivot. Good's Theorem assumes that knowledge has no value in itself; it only has value as a tool to change your actions to improve physical outcomes.
  *   **The Assumption:** Your utility (happiness/well-being) depends entirely on the state of the world (e.g., "I am healthy" vs. "I am sick") and your actions (e.g., "I get treatment" vs. "I do not").
  *   **The Reality:** For humans, utility also depends on the **state of your mind**. "Knowing I am sick" carries a direct negative utility (anxiety, dread) independent of the physical illness. "Knowing my partner cheated" carries a direct negative utility (betrayal, jealousy) independent of whether you stay or leave.

  In Good's mathematical framework, the state of "knowing" is invisible to the utility function. In your friends' lives, the state of "knowing" is a primary driver of pain.

  ### 2. Why "You Can Always Ignore It" is False
  Your summary of the logic includes the phrase: *"anything you would choose to do after learning some new fact was already open to you beforehand — you could simply have acted the same way and ignored what you learned."*

  This is logically true regarding **actions**, but false regarding **beliefs**.
  *   **Action:** You can choose not to go to the doctor even after you suspect a lump.
  *   **Belief:** You cannot choose to *not know* what the doctor tells you once you have asked.

  Good's Theorem assumes that if the information is bad, you can simply revert to the "ignorant" action plan without penalty. But humans cannot easily decouple knowledge from emotion. Once you know the lump is malignant, you cannot genuinely inhabit the mental state of "I probably don't have cancer." The anxiety persists even if you choose not to treat it. Therefore, the set of available *mental states* has shrunk, not widened. You have lost the option of "Hopeful Ignorance."

  ### 3. Reconciling the Logic with Observation
  There are three main ways to resolve the conflict between Good's Theorem and the human tendency to avoid information. You should take all three seriously, as they apply to different situations.

  #### A. The Utility of Belief (The "Ignorance is Bliss" Argument)
  This is the strongest philosophical rebuttal. Good's Theorem fails when knowledge itself is a "bad" in your utility function.
  *   **Application:** The friend avoiding the medical test or the partner's history.
  *   **Explanation:** If your well-being depends on hope, peace of mind, or trust, then information has a "cost" that is not monetary. It is an emotional cost. If the pain of knowing (the anxiety of the diagnosis) outweighs the benefit of acting on that knowledge (early treatment), then a rational agent *with that specific utility function* should remain ignorant.
  *   **Verdict:** Good's Theorem isn't wrong; it just assumes a utility function that cares only about physical outcomes. If you amend the theorem to include "peace of mind" as a valuable outcome, avoiding information becomes rational.

  #### B. Bounded Rationality and Self-Control (The "Investor" Argument)
  Good's Theorem assumes a perfectly rational agent who will always take the optimal action after receiving information. Humans are not perfectly rational; we are subject to impulses, panic, and cognitive biases.
  *   **Application:** The investor refusing to open statements during a downturn.
  *   **Explanation:** The investor knows that *ideally*, they should hold the stock. However, they also know themselves: if they see the red numbers, they might panic and sell at the bottom. The information triggers a sub-optimal action due to emotional dysregulation.
  *   **Verdict:** In this case, the information is instrumentally valuable, but the *agent* is unreliable. Avoiding information is a "pre-commitment strategy" (like Ulysses tying himself to the mast). It is a rational admission that one's future self cannot be trusted to process the data calmly.

  #### C. The Cost of Processing (The "Ostrich Effect")
  Good's Theorem assumes information is free. In reality, processing information requires cognitive energy, time, and follow-up decisions.
  *   **Application:** All your examples.
  *   **Explanation:** Learning a partner's past isn't just receiving a fact; it requires a cascade of conversations, re-evaluations, and emotional labor. Checking a lump isn't just a glance; it leads to appointments, waiting rooms, and potential procedures.
  *   **Verdict:** If the "transaction costs" of processing the information (mental energy, time, follow-up actions) exceed the expected benefit of the improved decision, ignoring the information is economically rational.

  ### 4. Which Resolution Ought You to Take Seriously?
  You asked which of these resolutions you should accept. The answer depends on whether you are trying to understand **logic** or **life**.

  **For Understanding Logic:**
  You must accept that Good's Theorem is a **benchmark**. It defines what a perfect, unemotional, cost-free decision-maker would do. It is useful because it highlights *why* we avoid information. When we avoid info, we are implicitly admitting one of three things:
  1.  We value peace of mind more than optimal outcomes (Utility of Belief).
  2.  We don't trust our future selves to act rationally (Bounded Rationality).
  3.  We think the hassle isn't worth it (Processing Costs).

  **For Understanding Life:**
  You should take the **Utility of Belief** and **Bounded Rationality** arguments most seriously.
  *   The **Utility of Belief** argument validates your friends. They are not necessarily being "irrational" in a broad sense; they are optimizing for emotional well-being rather than physical optimization. A life optimized purely for physical outcomes (always test, always know) might be a life devoid of hope and tranquility.
  *   The **Bounded Rationality** argument validates the investor. Recognizing one's own psychological limits is a form of wisdom. Knowing that bad news will cause you to make a catastrophic mistake justifies avoiding that news until you are stronger.

  ### Summary
  The conflict comes from a category error. Good's Theorem treats information as a **tool** (like a hammer). Your examples treat information as an **experience** (like a sound).
  *   A hammer is never bad to have, because you can always choose not to swing it.
  *   A sound, once heard, cannot be unheard, and if it is a scream, it causes pain regardless of what you do next.

  Good's Theorem is correct for hammers. It is incorrect for screams. Most significant life information is a bit of both: it is a tool for action, but also an experience that alters your mental state. When the experiential cost of the knowledge outweighs the instrumental benefit of the action, the rational choice is to remain ignorant.
