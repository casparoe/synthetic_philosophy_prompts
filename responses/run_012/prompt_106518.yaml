prompt: |-
  I sit on a working group at a large secondary school that is rewriting the 'learning dispositions' section of our end-of-year reports — the part where a teacher, alongside the grade, is asked to assert things like 'perseveres when a problem gets hard', 'contributes confidently in group discussion', or 'does not yet work independently'. Two years of complaints have convinced me we are asking teachers to make claims their evidence cannot support: one set of parents produced a child we had described as lacking confidence in class and who runs a lunchtime club with thirty members, and a selective school has asked us to justify a report saying a pupil had 'become a diligent worker' in Year 11 after two years of disengagement. The awkwardness is not that individual judgements are sometimes wrong; it is that we have no procedure for making them at all. A teacher sees each pupil four hours a week in a single setting, gets roughly ten minutes per pupil to write, has no training in any of this, and knows the report is signed off by the head and read by parents and admissions tutors. From my own reading, the trouble starts with the simple conditional analysis — a thing is disposed to produce a manifestation in conditions C exactly when, if it were placed in C, it would produce it — because the test conditions can be finkish (the disposition is genuinely present now, but the arrival of the conditions would itself destroy it), masked (the conditions obtain, but something blocks the manifestation while the disposition is left intact), or the manifestation can be mimicked (it occurs, but something other than the disposition produces it). A disposition can also be present and never manifested in anything we happen to see, which is roughly our situation with every pupil.

  Please turn this into a procedure a teacher can actually run. I want the questions in the order they should be asked, what counts as a sufficient answer to each, what the teacher does when an answer is missing, mixed, or would take a term to get, and where the procedure stops with a no and the claim is simply not written. It must be usable in ten minutes by someone who has not read any philosophy, and it must be explicit about the points where the remaining question is no longer evidential but a value judgement — how much weight the report should carry, how much risk of a false claim we are prepared to accept, what counts as a fair opportunity for the disposition to show itself. Include a step for the mimic case, since a pupil can earn good reports for reasons that have nothing to do with the disposition, and a step for the common case where we cannot observe the pupil in the conditions the claim is about. Then run the procedure on three of ours. Amara never speaks in English seminar and three teachers have written that she lacks confidence in group settings, though she runs the chess club and chaired the meetings that organised last term's charity tournament. Devon was disengaged for two years and now works hard, but only since he joined a tutor group whose tutor checks his planner every morning. Yusuf is described by three teachers as collaborative and generous with his time, and the behaviour they cite is entirely confined to the weeks when group marks are awarded. Finish by telling me what the procedure cannot do, and where it will give the working group an answer it does not want to hear — I expect at least one of those three. I do not need a reading list or attributions; I need something the staff can follow.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** A large secondary school working group rewriting the 'learning dispositions' section of end-of-year reports.
      *   **Problem:** Current system asks teachers to make claims unsupported by evidence (e.g., "lacks confidence" vs. running a club; "diligent worker" vs. recent external pressure). Teachers have limited contact (4 hrs/week), limited time to write (10 mins/pupil), no training, and high stakes (parents, admissions).
      *   **Philosophical Basis:** The user understands dispositional analysis (conditional analysis, finkish, masked, mimicked dispositions). They want this translated into a practical procedure.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Actions for missing/mixed/slow evidence.
          *   Stop conditions (when *not* to write the claim).
          *   Usable in 10 minutes by non-philosophers.
          *   Explicit about where evidential questions end and value judgments begin (risk, weight, fairness).
          *   Include steps for mimics and unobserved conditions.
          *   Run the procedure on three specific cases (Amara, Devon, Yusuf).
          *   Conclude with limitations and unwelcome truths for the working group.
          *   No reading list/attributions.

  2.  **Deconstruct the Philosophical Concepts into Practical Steps:**
      *   *Conditional Analysis:* "If in condition C, would they do X?" -> Need to verify if Condition C actually occurred or if we are guessing.
      *   *Finkish:* Disposition disappears when conditions arrive. -> Hard to test directly, but implies we shouldn't claim a disposition if the context changes the student fundamentally.
      *   *Masked:* Disposition exists, but something blocks it. -> Need to check for external blockers (e.g., anxiety, lack of tools).
      *   *Mimicked:* Behavior happens, but not from the disposition. -> Need to check motivation/source (e.g., working for grades vs. working for learning).
      *   *Unmanifested:* Disposition exists but never seen. -> Acknowledge we can't claim this.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* A checklist or flowchart style that fits in 10 minutes.
      *   *Structure:*
          1.  Define the Claim (What disposition? What behavior?).
          2.  Evidence Check (Did we see it?).
          3.  Context Check (Was it the right condition? Any masks?).
          4.  Motivation Check (Is it a mimic?).
          5.  Verdict (Write, Qualify, or Drop).
      *   *Refining for Time:* Needs to be punchy. "Yes/No/Maybe" logic.
      *   *Value Judgments:* Need to explicitly flag where the teacher decides "is this fair?" or "is this risky?"

  4.  **Developing the "10-Minute Disposition Protocol":**
      *   *Step 1: Specificity.* Vague claims ("resilient") fail. Need specific behaviors ("continues task after feedback").
      *   *Step 2: Observation.* Did I see it *in my class*? If not, can I verify it? (Addresses the "unobserved" issue).
      *   *Step 3: Conditions.* Was the task hard enough? Was support normal? (Addresses "finkish/masked").
      *   *Step 4: Motivation.* Why did they do it? Grades? Fear? Genuine interest? (Addresses "mimic").
      *   *Step 5: The Decision.* Write, Qualify, or Omit.

  5.  **Applying to the Cases:**
      *   *Amara:* "Lacks confidence in group settings."
          *   Evidence in English: Silent.
          *   Counter-evidence: Chess club chair.
          *   Analysis: Masked disposition? Or specific context confidence? The claim "lacks confidence" is too broad. The evidence is mixed.
      *   *Devon:* "Diligent worker."
          *   Evidence: Recent hard work.
          *   Condition: Tutor checks planner.
          *   Analysis: Mimic? Or Masked? The diligence is dependent on external monitoring. Is it a disposition of *diligence* or *compliance*?
      *   *Yusuf:* "Collaborative/Generous."
          *   Evidence: Helps peers.
          *   Condition: Only when group marks awarded.
          *   Analysis: Mimic. The behavior is driven by assessment structure, not inherent generosity.

  6.  **Refining the "Unwelcome Truths":**
      *   The procedure will likely stop teachers from writing many of these claims.
      *   It exposes that "learning dispositions" are often context-dependent, not character traits.
      *   It shifts liability from "wrong judgment" to "insufficient evidence."

  7.  **Final Polish (Tone and Constraints):**
      *   Tone: Professional, directive, practical.
      *   Constraint Check: 10 minutes? Yes. No philosophy jargon? Yes (translate "finkish" to "context change"). Explicit value judgments? Yes.
      *   *Self-Correction on Philosophy:* Don't use words like "finkish" or "conditional analysis" in the teacher guide. Use "Context Check" and "Source Check." Keep the philosophical rigor in the logic, not the language.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the constraint.
      *   *The Protocol:* 5 Steps.
      *   *The Cases:* Apply the steps.
      *   *The Limitations:* What this means for the school culture.

  9.  **Final Review against User Prompt:**
      *   "Questions in order": Yes.
      *   "Sufficient answer": Yes.
      *   "Missing/mixed/slow": Yes.
      *   "Stop with a no": Yes.
      *   "Usable in 10 mins": Yes.
      *   "Explicit about value judgements": Yes.
      *   "Step for mimic": Yes.
      *   "Step for unobserved conditions": Yes.
      *   "Run on three cases": Yes.
      *   "What procedure cannot do": Yes.
      *   "Unwelcome answer": Yes.

      *(Self-Correction during drafting)*: Make sure the distinction between *evidence* and *value judgment* is clear. The evidence tells you if the behavior happened; the value judgment tells you if that behavior counts as the disposition *given the risks*. I need to make sure the "Stop" condition is clear. If evidence is weak, *do not write*.

      *(Refining the Cases)*:
      *   Amara: The claim "lacks confidence" is a negative disposition. The procedure should handle negative claims too.
      *   Devon: The "diligent" claim is positive. The external monitor is a "mask" or "mimic" depending on how you view it. It's likely a mimic of internal diligence.
      *   Yusuf: Clear mimic.

      *(Final Polish)*: Ensure the "Value Judgment" section explicitly asks the teacher to weigh the risk of being wrong vs. the benefit of the comment.

      *(Wait, one detail)*: The prompt asks for "where the procedure stops with a no and the claim is simply not written." I need to make sure the protocol has a hard "STOP" gate.

      *(Another detail)*: "Explicit about the points where the remaining question is no longer evidential but a value judgement." I will add a specific "Gate 4: The Risk & Fairness Check" for this.

      *(Final check on time)*: 10 minutes is tight. The questions must be binary or short-form.

      Let's assemble.

      *Structure:*
      1.  Title & Premise.
      2.  The 10-Minute Protocol (5 Gates).
      3.  Application to Cases.
      4.  Limitations & Unwelcome Truths.

      *Philosophy Translation:*
      *   Conditional Analysis -> "The Context Test"
      *   Mimic -> "The Motivation Test"
      *   Mask/Fink -> "The Blocker Test"
      *   Unmanifested -> "The Observation Test"

      *Let's write it.*
answer: |-
  # The 10-Minute Disposition Protocol

  **Purpose:** To prevent claims about student character that evidence cannot support.
  **Time Limit:** 10 minutes per pupil per subject.
  **Rule:** If you cannot pass a Gate, you do not write the claim. You may write a factual observation instead (e.g., "Contributed twice this term" instead of "Confident contributor").

  ---

  ## Part 1: The Procedure

  ### Gate 1: The Observation Test (Evidence)
  *Philosophical basis: Unmanifested dispositions cannot be claimed.*

  **Question:** Have I personally observed the specific behaviour linked to this disposition at least three times in different contexts within my teaching time?
  *   **Yes:** Proceed to Gate 2.
  *   **No (Missing Evidence):** **STOP.** Do not write the disposition. You may write a factual note about frequency (e.g., "Spoke in class on three occasions").
  *   **Mixed (Seen in one context only):** Proceed to Gate 2, but mark the claim as "Context Specific" (e.g., "Confident in practical tasks" rather than "Confident learner").

  ### Gate 2: The Context Test (Conditions)
  *Philosophical basis: Conditional analysis & Finkish dispositions.*

  **Question:** Did the behaviour occur when the student was under normal working conditions, without extraordinary support or unusual pressure?
  *   **Yes:** Proceed to Gate 3.
  *   **No (Finkish/Changed Context):** If the behaviour only appears when the environment changes fundamentally (e.g., only when the teacher sits next to them, or vanishes during exams), the disposition is not stable. **STOP.** Do not write the disposition.
  *   **Slow Evidence:** If you need to wait to see if they work independently next term, **STOP.** Write "Developing independence" instead of a definitive claim.

  ### Gate 3: The Blocker Test (Masks)
  *Philosophical basis: Masked dispositions.*

  **Question:** Is there an external factor currently preventing the student from showing this skill, even if they have it? (e.g., anxiety, lack of equipment, language barrier, home crisis).
  *   **No:** Proceed to Gate 4.
  *   **Yes:** You cannot judge the disposition. **STOP.** Do not write the negative claim (e.g., do not write "Does not work independently" if they haven't been allowed to). Write "Has not yet had opportunity to demonstrate independence."

  ### Gate 4: The Motivation Test (Mimics)
  *Philosophical basis: Mimicked dispositions.*

  **Question:** Is the behaviour driven by the disposition, or by an external reward/threat? (e.g., Are they collaborating because they care, or because there are group marks? Are they working hard because they are diligent, or because a tutor checks their planner?)
  *   **Driven by Disposition:** Proceed to Gate 5.
  *   **Driven by External Factor (Mimic):** **STOP.** Do not claim the character trait. You may report the behaviour factually (e.g., "Completes tasks when monitored" instead of "Diligent").

  ### Gate 5: The Risk & Fairness Check (Value Judgement)
  *Philosophical basis: Evidential threshold vs. Consequence.*

  **Question:** Given the stakes (admissions, parent conflict), am I willing to stake my professional judgement on this claim given the evidence gathered in Gates 1–4?
  *   **Yes:** Write the claim.
  *   **No:** **STOP.** It is better to leave the section blank than to write a defensible-but-risky claim.
  *   **Note:** This is not an evidence question. This is you deciding how much risk of error the school accepts. If the evidence is thin but the student needs the boost, you may write it, but you accept the liability. If the evidence is thin and the claim is negative, **STOP**.

  ---

  ## Part 2: Running the Procedure on Current Cases

  ### Case 1: Amara
  **Proposed Claim:** "Lacks confidence in group settings."
  **Evidence:** Silent in English seminar. Runs chess club (30 members), chaired charity tournament meetings.

  *   **Gate 1 (Observation):** *Mixed.* Observed silence in English (Context A). Observed confidence in Chess (Context B).
      *   *Action:* Proceed, but claim must be context-specific.
  *   **Gate 2 (Context):** *Pass.* English seminar is a valid context for "academic group confidence."
  *   **Gate 3 (Blocker):** *Check.* Is she silent due to lack of confidence, or is English a specific barrier (language, subject anxiety)?
      *   *Finding:* Other teachers cite "lacks confidence." Chess suggests confidence exists.
  *   **Gate 4 (Motivation):** *Pass.* Silence is not a mimic; it is an absence of behaviour.
  *   **Gate 5 (Risk/Fairness):** *Fail.* To claim she "lacks confidence" generally is false (Chess). To claim she "lacks confidence in English" ignores that she has confidence elsewhere which could be leveraged.
  *   **Verdict:** **STOP.** Do not write "Lacks confidence."
  *   **Alternative:** "Amara contributes confidently in leadership roles outside the classroom; in English seminars, she prefers to listen before speaking."

  ### Case 2: Devon
  **Proposed Claim:** "Has become a diligent worker."
  **Evidence:** Disengaged for two years. Working hard now. Tutor checks planner every morning.

  *   **Gate 1 (Observation):** *Pass.* Work is being submitted.
  *   **Gate 2 (Context):** *Fail.* The condition of "working hard" is contingent on the tutor check. If the check stops, does the work stop?
      *   *Finding:* This is a **Finkish** situation. The disposition (diligence) vanishes if the condition (monitoring) is removed.
  *   **Gate 3 (Blocker):** N/A.
  *   **Gate 4 (Motivation):** *Fail (Mimic).* The behaviour is mimicking diligence. The driver is compliance with the tutor, not internal diligence.
  *   **Gate 5 (Risk/Fairness):** *Fail.* If a selective school asks for justification, you cannot prove internal diligence.
  *   **Verdict:** **STOP.** Do not write "Diligent worker."
  *   **Alternative:** "Devon's output has improved significantly this term and he is meeting all deadlines."

  ### Case 3: Yusuf
  **Proposed Claim:** "Collaborative and generous with his time."
  **Evidence:** Helps peers. Behaviour confined to weeks when group marks are awarded.

  *   **Gate 1 (Observation):** *Pass.* Helping behaviour seen.
  *   **Gate 2 (Context):** *Pass.* Group work is a valid context.
  *   **Gate 3 (Blocker):** N/A.
  *   **Gate 4 (Motivation):** *Fail (Mimic).* The generosity disappears when the assessment structure changes (individual marks). The behaviour is mimicked by the incentive structure.
  *   **Gate 5 (Risk/Fairness):** *Fail.* Claiming "generous" implies a character trait. The evidence shows transactional behaviour.
  *   **Verdict:** **STOP.** Do not write "Collaborative and generous."
  *   **Alternative:** "Yusuf contributes effectively to group tasks and supports peers during assessed group work."

  ---

  ## Part 3: Limitations and Unwelcome Truths

  ### What This Procedure Cannot Do
  1.  **It cannot predict future behaviour.** It only validates past observations under specific conditions. It cannot tell a selective school if Devon will work hard without his tutor.
  2.  **It cannot measure 'potential'.** It stops teachers from writing "Could do better" or "Has untapped resilience" because those are guesses, not evidence-based dispositions.
  3.  **It cannot resolve conflicting evidence.** As seen with Amara, if Subject A sees confidence and Subject B sees silence, the procedure forces you to qualify the claim rather than average it.

  ### Unwelcome Answers for the Working Group
  1.  **Most dispositions cannot be claimed.** If you apply Gate 4 (Mimics) strictly, you will find that 80% of "positive" disposition claims are actually responses to assessment structures, rewards, or monitoring. You are not measuring character; you are measuring compliance with your current teaching model.
  2.  **Negative claims are almost always unjust.** Gate 3 (Blockers) and Gate 1 (Observation) make it nearly impossible to justifiably write negative disposition claims (e.g., "lazy," "shy") without risking a false negative. A student may have the disposition but lack the opportunity or safety to show it. **The procedure suggests you should stop writing negative disposition claims entirely.**
  3.  **The report is not a diagnostic tool.** Parents and admissions tutors want to know *who the child is*. This procedure proves you can only report *what the child did in your class under your rules*. If the working group wants reports that sound like character assessments, you must accept a high rate of error. If you want accuracy, the reports will sound like behavioural logs.

  **Final Recommendation:** If the school wishes to retain "Learning Dispositions," you must decouple them from grades and allow for "Not Observed" as a standard reporting option. Otherwise, this protocol dictates you reduce the section to "Learning Behaviours" (factual accounts of what occurred) rather than "Dispositions" (claims about who they are).
