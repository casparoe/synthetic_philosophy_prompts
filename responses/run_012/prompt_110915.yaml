answer: |-
  You have not invented a puzzle for yourself; you have identified a well-recognised tension in epistemology, cognitive science, and the philosophy of language. However, the literature is fragmented, which explains why you may not have found a single, satisfying label. The phenomenon you describe sits at the intersection of how we learn rules from limited data (induction) and how we interpret the intentions of a data-provider (pragmatics).

  In the philosophy of language, the content of your examples relates to **ostensive definition**—defining a term by pointing to instances. Ludwig Wittgenstein famously argued that ostensive definition is inherently ambiguous; pointing to a red apple could mean "red", "apple", "fruit", or "one". You have correctly identified that the ambiguity is resolved not by the objects themselves, but by the context of their selection. In classical philosophy, this is often subsumed under **conversational implicature** (following H.P. Grice), where the listener assumes the speaker is being relevant and informative. However, as you noted, this feels insufficient because you are not just inferring the speaker's mood, but the actual extension of a concept.

  The precise technical framework you are looking for comes from cognitive science and Bayesian induction, where it is known as the **Sampling Assumption**. Specifically, researchers distinguish between **weak sampling** (examples are drawn randomly from the world) and **strong sampling** (examples are drawn specifically because they belong to the concept). When you solve a Bongard problem or infer the scope of a bug class, you are implicitly operating under a **Strong Sampling Assumption**: you assume the examples were chosen *because* they illustrate the rule. When you prompt an LLM and it overfits to "invoices", it is failing to distinguish between your strong sampling (choosing invoices to illustrate a format) and weak sampling (invoices being the only data available).

  Regarding your question on whether this is one phenomenon or two: it is a single cognitive mechanism. The mechanism is the heuristic assumption that selection is informative. Whether this assumption yields truth or error depends entirely on the external reality of how the examples were generated, not on the reasoning process itself. Just as depth perception is a single visual mechanism that can be fooled by a flat painting, reliance on sampling assumptions is a single inductive strategy that succeeds when the selector is pedagogical and fails when the selector is indifferent or adversarial.

  Because the existing terminology is split between philosophy (ostension), linguistics (implicature), and cognitive science (sampling), I propose a coined name that captures your specific carving of the problem: **Selective Ostension**. This highlights that the "showing" (ostension) is only meaningful because of the "choosing" (selection).

