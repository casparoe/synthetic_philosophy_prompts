answer: |-
  This is a sophisticated observation. You have identified a tension that sits at the very heart of the dispute between consequentialism/deontology and virtue ethics, and between direct and indirect normative theories. The "slipperiness" you detect is not a bug in your understanding; it is a feature of the literature, where authors often slide between metaphysical claims (about what constitutes a good action) and psychological claims (about what it feels like to live under a theory).

  Here is the breakdown of the existing concepts, how they map onto your cases, and a precise formulation of the phenomenon you are tracking.

  ### Part 1: Candidate Concepts

  There are three established concepts in normative ethics that orbit this territory. None captures the phenomenon perfectly on its own, which explains your difficulty.

  **1. "One Thought Too Many" (Bernard Williams)**
  *   **The Concept:** In *Persons, Character and Morality*, Williams argues that some moral theories require an agent to insert a justificatory step (e.g., "I should save him because it is my duty") where a direct response (e.g., "I should save him because he is my wife") is appropriate. The objection is that the moral thought crowds out the personal commitment that gives the action its value.
  *   **Status:** This is the closest existing label to your Cases 1 and 2.

  **2. "Moral Schizophrenia" or "Alienation" (Michael Stocker / Susan Wolf)**
  *   **The Concept:** Stocker (in "The Schizophrenia of Modern Ethical Theories") argues that modern theories separate the *motive* (love, friendship) from the *justification* (duty, utility). This creates a split in the agent's psyche. Wolf expands this to argue that a "moral saint" would be unattractively alienated from non-moral goods.
  *   **Status:** This captures the psychological defect in the agent described in all three cases.

  **3. "Self-Effacement" (Peter Railton)**
  *   **The Concept:** A theory is self-effacing if it dictates that agents should *not* consciously use the theory as a decision procedure to maximize the theory's value. (e.g., Utilitarianism might say "Don't think about utility; just love your friends," because loving friends maximizes utility).
  *   **Status:** This describes the *structural feature of the theory* that might solve the problem, rather than the problem itself. However, the *lack* of self-effacement is often what triggers your objection.

  ---

  ### Part 2: Testing the Candidates Against Your Cases

  Let us test these concepts against your three instances to see where they hold and where they fray.

  **Case 1: The Promise-Keeping Friend**
  *   **One Thought Too Many:** **Perfect Fit.** Williams explicitly uses a variation of this (saving a spouse vs. saving a stranger). The objection is that the deliberative structure ("I promised") displaces the constitutive motive ("I care").
  *   **Alienation:** **Strong Fit.** The friend feels alienated from the visitor because the visitor is acting as a moral agent rather than a friend.
  *   **Self-Effacement:** **Partial Fit.** If the theory said "Keep promises, but don't think about the duty," the objection vanishes. The objection arises because the theory *requires* the thought.

  **Case 2: The Manual-Consulting Parent**
  *   **One Thought Too Many:** **Strong Fit.** The manual represents the "thought." The parent is mediating their love through a rule.
  *   **Alienation:** **Perfect Fit.** This is Stocker's hospital case transposed to parenting. The child is alienated from the parent's affection because the affection is instrumentalized by duty.
  *   **Self-Effacement:** **Strong Fit.** A theory that required consulting a manual for every parental act would likely fail to produce good parenting outcomes, suggesting the theory should be self-effacing here.

  **Case 3: The Generosity Theory**
  *   **One Thought Too Many:** **Moderate Fit.** It is less about a specific relationship and more about the nature of the virtue itself.
  *   **Alienation:** **Strong Fit.** The agent is alienated from their own disposition. They are not *being* generous; they are *complying* with a requirement to be generous.
  *   **Self-Effacement:** **Strong Fit.** This is the classic paradox of hedonism applied to ethics. To achieve the good (generosity), one must not aim at the good (duty) directly.

  **Verdict on Concepts:**
  "Alienation" is the best umbrella term for the *phenomenological* complaint. "One Thought Too Many" is the best term for the *deliberative* complaint. However, neither fully resolves the "slipperiness" you noted regarding whether the theory is *false* or merely *misused*.

  ---

  ### Part 3: Disentangling the Conflation

  You asked plainly if you are conflating two or more different complaints. **You are.** The slipperiness you detect arises because this objection is frequently used to make two distinct claims that look identical on the surface.

  To get the shape right, we must distinguish between **Constitutive Incompatibility** and **Deliberative Alienation**.

  #### 1. Constitutive Incompatibility (The Metaphysical Claim)
  *   **The Claim:** The action described in the case is *not actually the same action* if the motive is different.
  *   **Application to Case 1:** When you say "The visits are identical," a virtue ethicist would deny this. A visit motivated by duty is *not* a visit of friendship. It is a visit of obligation. Therefore, the theory is **false** because it misidentifies the good. It tells you to produce "Friendship-Visits" but gives you instructions that only produce "Duty-Visits."
  *   **Application to Case 3:** Generosity *just is* the disposition to give from a desire to help. If you give from a desire to obey, you are not being generous; you are being obedient.
  *   **Target:** This is an objection to the **truth conditions** of the theory.

  #### 2. Deliberative Alienation (The Psychological/Pragmatic Claim)
  *   **The Claim:** The action *is* the same (or good enough), but the experience of living under the theory is cold, fragmented, or psychologically unsustainable.
  *   **Application to Case 1:** Even if the friend receives the care they need, the relationship lacks warmth. The theory is **toxic** to human flourishing, even if its verdicts on action are correct.
  *   **Application to Case 2:** The parent might treat the child correctly, but the parent burns out or the child feels unloved.
  *   **Target:** This is an objection to the **decision procedure** or the **cost of compliance**.

  **Why this matters:**
  If the complaint is **Constitutive**, the theory must be rejected or radically revised (e.g., "Kantianism is false because it misunderstands friendship").
  If the complaint is **Deliberative**, the theory can be saved via **Self-Effacement** (e.g., "Kantianism is true, but you shouldn't think like a Kantian when visiting friends").

  Your "slipperiness" comes from the fact that critics often use the psychological ugliness of Deliberative Alienation to argue for the falsity of Constitutive Incompatibility without proving the link.

  ---

  ### Part 4: Precise Formulation and Coining

  Since existing terms split between the psychological state (Alienation) and the deliberative structure (One Thought Too Many), and since you need a term that captures the *objection to the theory* based on this dynamic, I propose the following formulation.

  **The Label:** **The Problem of Motivational Displacement**

  **The Definition:**
  Motivational Displacement occurs when a normative theory requires an agent to adopt a justificatory motive (e.g., duty, optimization) that displaces, undermines, or renders incoherent the constitutive motive (e.g., love, generosity) required to realize the very value the theory seeks to promote.

  **The Boundary Cases:**
  To ensure this concept is precise, we must distinguish it from its neighbors:

  1.  **Vs. Demandingness:** Demandingness objections say the theory asks for *too much* (e.g., all your money). Motivational Displacement says the theory asks for the *wrong kind of engagement* (e.g., calculation instead of love), even if the cost is low.
  2.  **Vs. Action-Guidance:** Action-guidance objections say the theory is too vague to tell you what to do. Motivational Displacement grants the theory tells you what to do, but objects to *how* you must think about doing it.
  3.  **Vs. Integrity (Williams):** Integrity objections focus on the agent's *own* projects being crushed by the theory. Motivational Displacement focuses on the *object* of the action (the friend, the child, the virtue) being degraded by the motive.

  **Addressing Your Specific Questions:**

  *   **Does it concern how much is demanded or what is demanded?**
      It concerns *what is demanded* specifically regarding the **deliberative architecture** of the agent. It is a qualitative objection, not quantitative.
  *   **Is it an objection to the theory or its use as a decision procedure?**
      This is the crux of the conflation identified above.
      *   If **Constitutive Incompatibility** holds: It is an objection to the **theory** (the theory is false).
      *   If only **Deliberative Alienation** holds: It is an objection to the **decision procedure** (the theory is true but should not be consulted directly).
      *   *Philosophical Advice:* When you encounter this objection, ask the objector: "If the agent successfully suppresses the alienating thought and just acts lovingly, has the theory been satisfied?" If they say "Yes," it's a Decision Procedure objection. If they say "No, because the motive is part of the act," it's a Theory objection.
  *   **Can it be pressed against a theory indifferent to motives?**
      Yes, but it changes the shape. If a theory says "We don't care why you do it, just do it," the objection shifts from Motivational Displacement to **Normative Reductionism**. The objection becomes: "A world where people do the right things for the wrong reasons is a worse world, so your theory fails to capture the full scope of the 'good'."

  ### Summary Recommendation

  You are tracking a real and significant phenomenon. The established term **"The Alienation Objection"** is the standard shorthand, but it is too blunt for your purposes because it conflates the psychological cost with the metaphysical error.

  When you write or argue about this, I recommend you use the distinction I outlined above. State that you are analyzing **Motivational Displacement**, and then specify whether you are arguing for **Constitutive Incompatibility** (the theory is false) or **Deliberative Alienation** (the theory is self-defeating).

  This resolves the slipperiness:
  *   In **Case 1 & 2**, the objection is usually Constitutive. (A duty-visit *is not* a friendship-visit).
  *   In **Case 3**, the objection is often Deliberative. (You can give money from duty, but it's better if you don't think about duty while doing it).

  By separating these, you stop the objection from sliding between "Your theory is wrong" and "Your theory is hard to live with," forcing a clearer philosophical debate.
