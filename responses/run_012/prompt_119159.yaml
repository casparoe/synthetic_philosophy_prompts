prompt: |-
  A friend of mine who did a linguistics MA keeps giving me his Grice spiel and it never quite sticks. His version goes like this: 'Grice's big move was noticing we communicate way more than we literally say. Conversation is a cooperative enterprise, so he listed four maxims -- quantity, quality, relation, manner -- and speakers follow them. Obey the maxims and you get the literal meaning; break one and the hearer assumes you did it on purpose and goes hunting for the extra meaning, and that extra meaning is the implicature. Implicature is basically the speaker's intended meaning, as opposed to the literal meaning of the sentence, and because it's inferred rather than stated it isn't part of what's strictly said, which is why you can cancel it. His conclusion was that a lot of what we call literal meaning is really just implicature -- which is why he thought sentences don't have determinate meaning on their own.'

  Something feels off, and I suspect it's that last bit: I have a vague memory that Grice was actually in the business of defending literal, truth-conditional meaning against the ordinary-language people, not dissolving it, but I'm not definately sure. Can you audit the whole thing for me? Which parts would Grice sign off on, which are the simplifications a textbook would forgive, and which are just wrong? Two things I especially want pinned down. First, the idea that implicature comes from breaking a maxim -- is that the mechanism, or is something getting collapsed there (I've seen 'flouting' used somewhere and I don't know how it differs from plain breaking)? Second, the equation of implicature with 'speaker meaning' -- same thing for Grice, or two things he kept apart? And while you're at it, where do the so-called conventional and generalized kinds of implicature fit, if at all -- his summary leaves no room for them. No reading list needed, just tell me what survives and what the corrected version should say.
