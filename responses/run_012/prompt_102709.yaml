answer: |-
  The server room hummed, a low-frequency vibration that Elara felt in her teeth. On the main screen, the spreadsheet glowed with the sterile blue light of absolute authority. This was the Bureau of Insect Welfare Compliance, and today they were auditing Project Chitin.

  Kael sat opposite her, tapping a stylus against his chin. He was a true believer in the Formula. Elara was less sure.

  "Run the multiplication again," Kael said.

  Elara sighed, her fingers flying over the haptic interface. "It's the same result, Kael. Sentience Likelihood Score: 0.004. Based on the neural density markers and the lack of nociceptive grooming responses. It's barely above zero."

  "But the volume," Kael said, leaning forward.

  "Forty trillion larvae per annum. Reared in dense slurry tanks. Lifecycle: twelve days." Elara paused. The numbers sat on the screen, innocent and horrific. "Animal-days per tonne is roughly eight million. Multiply by the tonnage... then multiply by the Likelihood Score."

  The cursor blinked. Then the final figure populated the cell.

  *4.2 Quintillion Weighted Insect-Days (WID).*

  Elara leaned back. The air in the room felt thin. "That's... that's more than the entire global vertebrate welfare budget combined. It's more than the sum total of every high-certainty cricket farm in the hemisphere."

  Kael nodded slowly. "Exactly. The Expected Value is clear. Even with a negligible probability of consciousness, the sheer magnitude of the population creates a moral mass we cannot ignore. If there is even a 0.4% chance these things suffer, the aggregate suffering dwarfs everything else we regulate."

  "That's the madness," Elara said, her voice tight. "Look at what this implies. Because the population is so large, the uncertainty *becomes* the certainty. A one-in-a-thousand chance, scaled up enough, outbids a nine-in-ten chance on a smaller scale. It means the only thing that matters is where we put the trillions. The individual welfare of the animal—the actual texture of its life—is irrelevant. Only the count matters."

  "The Formula doesn't distinguish between texture and count," Kael replied calmly. "It distinguishes between risk and impact. If you drive a car through a crowd of a million people, you're liable for the crash even if the chance of injury per person is low. Why is moral arithmetic different?"

  "Because this isn't a car crash," Elara snapped. "This is Pascal's Mugging with biomass. If we accept this logic, any group can demand anything. Just breed enough of something vaguely responsive, claim a non-zero probability of sentience, and you hold the entire ethical economy hostage. You've built a machine that can demand infinite sacrifice for vanishingly small probabilities."

  Kael tapped the screen. "And if we reject it? If we say 0.004 is effectively zero? Then we risk industrializing the torture of sentient beings on a scale we can't comprehend. We'd be betting the lives of quadrillions of potential minds on a hunch that they're just meat automatons. Is that not the greater arrogance?"

  Elara looked at the comparison column she'd pulled up. To offset Project Chitin's WID load under the current cap, the Bureau would have to shutter every vertebrate sanctuary in the region. They would have to ban all high-welfare cricket farming, where the sentience score was 0.8 but the volumes were lower. The math dictated that the certain welfare of the few must be sacrificed for the probabilistic welfare of the many.

  "It makes human-scale welfare a rounding error," Elara whispered. "We trained to look at behavior. To look at the eye, the withdrawal reflex, the choice. Now you're telling me none of that matters if the vat is big enough."

  "The Formula aggregates uncertainty," Kael said. "It's the only way to handle the epistemic gap. We don't know if they feel. So we weight the doubt. That is precaution."

  "It's not precaution, it's capitulation to scale," Elara said. "If I approve this, I'm saying that a trillion whispers of pain are louder than a single scream. But what if the whispers aren't pain? What if they're just chemistry? We're going to starve the programs that help animals we *know* suffer, to subsidize the uncertainty of animals we *don't* know feel anything."

  "Know?" Kael's voice hardened. "Do we know? Or do we just prefer the vertebrates because they look like us? The Formula strips away the bias. It leaves only the probability and the population. If you reject Chitin because the score is low, you're saying you prefer certainty of scale over magnitude of risk. You're saying it's better to definitely harm a million crickets than possibly harm forty trillion larvae."

  "I'm saying the calculation breaks when the numbers get this big," Elara said. "It ceases to be ethics and becomes just... accounting. You can't sum suffering like this. There's a threshold where the arithmetic stops mapping to reality. If the logic demands I shut down a sanctuary to keep a slurry tank open, the logic is broken."

  "Or your intuition is," Kael said. He highlighted the approval box. "The cap is hard, Elara. If we license Chitin, the offsets must be drawn from existing allocations. The vertebrate sanctuaries will lose funding. The high-welfare cricket farms will be capped out. That is the cost of the risk."

  "And if we deny Chitin?"

  "Then we prioritize the certain over the probable. We accept the risk that we are ignoring a holocaust of consciousness because the individuals were too small to trigger our empathy." Kael looked at her, his eyes tired. "You want to trust your gut. I want to trust the math. But the math is just our values written down without the flinching."

  Elara looked at the screen. The number 4.2 Quintillion pulsed. It was abstract, incomprehensible, and yet it held the power to close doors, to fire staff, to end programs that tangible beings relied on. She thought of the dog sanctuary outside the city, the one with the fence that kept the wind out. It would be defunded to pay for the offset. She thought of the larvae in the slurry, blind and chitinous, perhaps feeling nothing, perhaps feeling everything.

  The uncertainty was the weapon. As long as the score wasn't zero, the volume did the rest.

  "If we approve this," Elara said quietly, "what stops someone from breeding a quadrillion mayflies tomorrow? Claiming a 0.0001 score? They could own the entire welfare budget. They could demand we shut down the hospitals to pay for the offsets."

  "Then we adjust the cap," Kael said.

  "Then the cap was a lie," Elara countered. "It was never about welfare. It was about rationing guilt."

  Kael didn't answer. He hovered the stylus over the approval field. The hum of the servers seemed to grow louder, filling the silence between them. It was the sound of processing, of grinding vast quantities of data into a single binary output. Yes or No.

  Elara knew that if she walked away, Kael would sign it. The Formula compelled him. The logic of expected value was a gravity well; once you stepped inside, you couldn't just decide to jump out because the destination looked ugly. To reject the math was to admit that ethics was arbitrary, that some lives mattered more simply because we said so, not because the numbers dictated it.

  But to accept it was to admit that morality could be hijacked by magnitude, that a sufficiently large number of uncertain lives could trump any certain obligation we had to the world we could actually see.

  "Do it," Elara said finally. Her voice sounded like it belonged to someone else.

  Kael paused. He looked at her, searching for a reversal, a stay of execution. He found none. He tapped the screen.

  *Approved. Offsets Allocated.*

  The number on the screen turned green. The sanctuaries would close. The slurry tanks would fill.

  Elara stood up and walked to the window. Below them, the city lights flickered, warm and human-sized. Somewhere out there, a dog was being fed. Somewhere else, a trillion larvae were waiting to be born into the dark. She couldn't tell which outcome was the mercy and which was the crime. The arithmetic balanced perfectly, and that was the most terrifying thing of all.

  "Next file?" Kael asked, his voice flat.

  Elara didn't turn around. "Give me a minute."

  She watched her own reflection in the glass, superimposed over the city. She looked like a ghost haunting a machine that had learned to eat the world, one calculated bite at a time.
