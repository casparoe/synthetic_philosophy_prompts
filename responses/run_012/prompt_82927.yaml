answer: |-
  ### Brainstorm: Candidate Readings of the Practice

  Before reconstructing the moral theory embedded in your agency's work, I need to lay out the competing interpretations of why these two programs operate differently. We are looking for the principle that binds them, or admitting there is none.

  1.  **The "Historical Accretion" Reading:** There is no unified moral theory. The radiation program is governed by Cold War-era precautionary principles and international treaties (LNT/ALARA), while the chemical program is governed by domestic environmental statutes (CERCLA/RCRA) that evolved later with a focus on economic feasibility. The contradiction is bureaucratic, not philosophical. The friend is trying to find coherence where there is only history.
  2.  **The "Individual Significance" Reading:** The underlying theory is that a harm only counts morally if it is perceptible or significant *to the individual bearing it*. In the chemical program, a 10^-6 risk is below the threshold of individual moral significance (you cannot base a life decision on it). In the radiation program, the LNT model is treated not as a moral truth but as a conservative scientific proxy, overridden in practice by the "Reasonably Achievable" cost cap. The friend's view fits here: Dust specks are individually insignificant; torture is individually catastrophic.
  3.  **The "Truncated Utilitarianism" Reading:** The agency is committed to expected-value maximization (saving the most statistical lives) but acknowledges transaction costs. Calculating risk below 10^-6 is too expensive relative to the safety gain (hence *de minimis*). Calculating radiation risk below ALARA is also too expensive (hence the cost cap). The contradiction is only apparent; both are cost-effectiveness filters applied at different points in the calculation.
  4.  **The "Ex-Ante Contractualist" Reading:** The rule is: "No policy is permissible if an individual could reasonably reject it." A resident under a chemical plume with 10^-6 risk cannot reasonably reject the policy because the burden of elimination is too high for society. A radiation worker *can* reject unnecessary dose because alternatives exist (ALARA). The friend's torture case aligns: the victim can reasonably reject torture; no single dust-sneeze victim can reasonably reject the dust.

  I will proceed by treating the **Individual Significance Reading**, modified by **Administrative Pragmatism**, as the strongest candidate for reconstruction. It best explains how your friend can hold both views without contradiction, and it best explains why your agency uses thresholds in one place and linear models in another, while capping both with cost-benefit analysis.

  ***

  ### Reconstructing the Implicit Moral Theory of the Practice

  To understand what your practice presupposes, we must distinguish between the *scientific models* used (LNT vs. threshold) and the *moral rules* applied to them.

  **1. On Additivity: The Practice is Underdetermined**
  Strictly speaking, your practice does not commit to a single view on whether harms aggregate.
  *   **Radiation:** Presupposes additivity. If risk is linear with no threshold, then the sum of tiny doses equals a real harm.
  *   **Chemicals:** Presupposes non-additivity below a certain point. If risk is below 10^-6, the sum is treated as zero.
  *   **Reconstruction:** The practice does not presuppose that harms *are* additive or non-additive in reality. It presupposes that **regulatory additivity is a switch we flip based on measurability and cost.** The moral theory here is *epistemic*: we only aggregate harms that we can reliably measure and attribute. Below 10^-6, the risk is epistemically indistinguishable from background noise, so we treat it as morally null. In radiation, the political decision was made to treat the measurement as precise regardless of biological uncertainty.
  *   **Verdict:** The practice is not committed to a metaphysical claim about aggregation. It is committed to a procedural claim: *Aggregation is mandatory only when the individual unit of risk exceeds a threshold of administrative cognizability.*

  **2. On Moral Significance Thresholds: The Practice Endorses Them**
  The *de minimis* rule in the chemical program is an explicit moral threshold: a risk below 10^-6 is not just small; it is *beneath notice*. This contradicts the LNT model in radiation, *unless* we interpret ALARA ("As Low As Reasonably Achievable") as a functional threshold.
  *   **Reconstruction:** The "Reasonably Achievable" qualifier is the moral workhorse. It implies that a risk is only actionable if reducing it is "reasonable." If the cost is too high, the risk becomes acceptable. Therefore, the practice presupposes that **no risk is inherently unacceptable; only risks that are cheap to fix are mandatory.**
  *   **Verdict:** The practice presupposes a *conditional* threshold. A harm counts if (A) it is above the *de minimis* floor AND (B) the cost to remove it is below the benefit-cost cap.

  **3. On Expected-Value Reasoning: The Practice Truncates It**
  Standard expected-value reasoning says: 1 million people × 10^-6 risk = 1 expected death. You should spend up to the Value of a Statistical Life (VSL) to prevent it. Your agency *does not* do this for chemicals below the threshold.
  *   **Reconstruction:** The practice rejects pure expected-value reasoning in favor of **Ex-Ante Individualism.** We look at the risk *to the person*, not the sum *across persons*. If the risk to the person is trivial, the expected sum does not trigger action. However, the Benefit-Cost cap reintroduces expected-value reasoning at the macro level (spending per statistical life saved).
  *   **Verdict:** The practice is hybrid. It uses Ex-Ante Individualism to determine *whether* to act (is the individual risk significant?), and Expected-Value to determine *how much* to spend (is the cleanup cost-effective?).

  **4. On the Dust Specks Case: The Practice Avoids the Verdict**
  Does your agency's practice imply the torture is worse, or the dust specks?
  *   **Reconstruction:** The practice implies **neither**, because the practice is designed to avoid cases where individual harm is catastrophic (torture is illegal regardless of cost-benefit) or purely aggregate (dust specks are *de minimis*).
  *   **Verdict:** The practice is underdetermined regarding the thought experiment. However, the *de minimis* rule suggests that if the dust speck is truly imperceptible and harmless to the individual, the agency would ignore it, regardless of the total number of people. This aligns with your friend's view on the chemicals, but potentially conflicts with the radiation program if we view radiation photons as "dust specks."

  ***

  ### What the Verdicts Demand of a Regulator

  Your friend's position (Torture is worse; 10^-6 risk to millions is ignorable) is a version of **Non-Aggregative Threshold Deontology**. He believes harms must cross a threshold of significance *for the individual* before they enter the moral calculus. Once they cross that threshold, they cannot be traded off against smaller harms to others.

  Here is what adopting either verdict strictly would demand of your regulatory framework, and whether it could survive contact with reality.

  #### 1. The Anti-Aggregation Verdict (Your Friend's View)
  **The Theory:** You cannot sum small harms to many to justify a large harm to one. Furthermore, small harms below a threshold of significance do not count at all.
  **Policy Demands:**
  *   **Individual Risk Caps:** You would need hard limits on individual exposure, regardless of total population risk. If one person faces >10^-6 risk, you must act, even if only one person is exposed.
  *   **No Trading:** You could not justify exposing a neighborhood to low-level chemicals to save money for a high-level cleanup elsewhere. Each individual's risk is a separate silo.
  *   **The "Dust" Rule:** You would formally declare that risks below a certain magnitude (e.g., 10^-8) are morally zero.
  **Administrability:** **Low.**
  *   *Problem:* This leads to the "Tyanny of Small Decisions." If you must eliminate every individual risk above 10^-6, you might spend billions saving one person in a remote area while ignoring a plume affecting thousands at 0.9 × 10^-6.
  *   *Problem:* It creates perverse incentives. Polluters would spread contamination thinly over a wide area to keep everyone below the threshold, resulting in more total deaths but no regulatory violation.
  *   *Feasibility:* Your current chemical program approximates this, but the Benefit-Cost cap undermines it. True anti-aggregation forbids cost-benefit trading on rights violations.

  #### 2. The Aggregation Verdict (Pure Utilitarianism)
  **The Theory:** All risks are additive. A 10^-6 risk to 10 million people (10 expected deaths) is worse than a 100% risk to 5 people (5 expected deaths).
  **Policy Demands:**
  *   **Total Risk Minimization:** You would abandon *de minimis* thresholds. You would sum all micro-risks across the entire state.
  *   **Uniform VSL:** You would spend exactly the same amount per statistical life saved, whether saving a group from high risk or a massive group from tiny risks.
  *   **The "Dust" Rule:** If the number of dust specks is high enough to cause more aggregate suffering than the torture, you must allow the torture to prevent the specks.
  **Administrability:** **Impossible.**
  *   *Problem:* Information costs. You cannot measure or track 10^-8 risks for millions of people. The cost of the analysis would exceed the cost of the cleanup.
  *   *Problem:* Political suicide. Telling a community with a 1-in-100 cancer cluster that you are fixing a 1-in-10-million cluster elsewhere because the math works out better is untenable.
  *   *Feasibility:* Your radiation program approximates this (LNT), but the ALARA "Reasonably Achievable" clause is a surreptitious reintroduction of cost constraints that breaks the pure aggregation model.

  #### 3. The Actual Practice (The Pragmatic Hybrid)
  Your agency's current practice is an attempt to administer a theory that doesn't exist. It uses Anti-Aggregation logic to set thresholds (*de minimis*), Aggregation logic to model dose (LNT), and Utilitarian logic to cap spending (BCA).
  *   **Why it feels contradictory:** Because it is trying to satisfy three incompatible masters: Individual Rights (thresholds), Total Welfare (aggregation), and Budget Constraints (BCA).
  *   **Why it persists:** It is the only administrable system. Pure aggregation is too expensive; pure anti-aggregation is too rigid. The "Reasonably Achievable" clause is the escape valve that allows you to ignore the contradiction when the bills come due.

  ***

  ### Closing: Uncertainty and Revision

  **What would change my mind about which theory the practice presupposes?**
  I am currently arguing that the practice presupposes a **Pragmatic Hybrid** theory where moral principles are subordinate to administrative capacity. I would change my mind if I found evidence that the *de minimis* threshold or the ALARA principle was derived from a specific ethical framework *before* cost considerations were applied.
  For example, if your agency documents showed that the 10^-6 threshold was chosen because philosophers or ethicists determined it was the "limit of moral concern" rather than because it was the "limit of detection" or "limit of budget," then I would concede the practice presupposes **Threshold Deontology**. Currently, the evidence suggests the threshold is a proxy for "cost of measurement vs. benefit of reduction," which is utilitarian, not deontological. If the threshold is purely economic, the moral contradiction is real. If the threshold is moral, the contradiction is only superficial.

  **Where my reasoning is most likely to be wrong:**
  I may be overstating the incoherence of the "Pragmatic Hybrid." There is a coherent theory called **Satisficing Consequentialism** which argues that we should maximize good *up to a point*, after which we stop. It is possible your agency operates on a theory that says: "Prevent significant individual harm (Threshold), then maximize total welfare within budget (BCA)."
  My error might be assuming that *de minimis* implies "no harm exists." It might instead imply "the harm exists, but the duty to remedy it is outweighed by the cost of identification." If that is the case, the radiation and chemical programs are consistent: both say "Fix risks where the marginal benefit exceeds the marginal cost." The radiation program just assumes the benefit curve starts at zero dose, while the chemical program assumes the benefit curve starts at 10^-6.
  If this is true, your friend is wrong. The dust specks *do* count, but we ignore them because counting them is too expensive. The torture counts, and we forbid it because the cost of allowing it (moral collapse) is infinite. The contradiction you feel is not in the policy, but in the expectation that policy should reflect moral truth rather than moral *triage*.

  **Final thought:** You are sensing a fracture between *statistical* lives and *identified* lives. The policy treats the radiation risk as if it attaches to identified individuals (keep *your* dose low) but treats the chemical risk as statistical (ignore *your* risk if it's small). Until you decide whether you regulate *people* or *numbers*, the contradiction will remain in your administrative clothing.
