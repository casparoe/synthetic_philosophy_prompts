  7.  **Final Polish:** Check against constraints. No citations. specific closing section. Ensure the "Brainstorm" is distinct. Ensure the "Reconstruction" distinguishes presupposition from fit.

      *Key Philosophical Concepts to weave in (without naming drops if possible, or keeping them generic):*
      *   Expected Utility vs. Deontology.
      *   The "Separateness of Persons."
      *   *De Minimis* risk.
      *   Statistical vs. Identified lives.
      *   Cost-Benefit Analysis as a moral arbiter.

      *Let's structure the "Brainstorm" clearly.*
      1.  Inconsistent Bureaucracy (No theory).
      2.  Threshold Utilitarianism (Harms count only above threshold).
      3.  Ex-Ante Contractualism (What can an individual reasonably reject?).
      4.  Pragmatic Prioritarianism (Focus on highest individual risk, capped by cost).

      *Let's structure the "Reconstruction":*
      *   Additivity: Contingent on program.
