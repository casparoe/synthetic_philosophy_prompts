      *Closing:* What changes my mind? Evidence of intentional philosophical design vs. historical accretion. Where am I wrong? Maybe BCA isn't a moral theory but a constraint *on* moral theory.

      *(Self-Correction on "Friend's View"):* The friend says Torture is worse (Anti-aggregation) AND ignoring 10^-6 to millions is sensible (Threshold). This is consistent *if* the threshold is about the *magnitude of harm per person*, not the sum. Dust is too small to matter per person. Torture is huge. 10^-6 risk is too small to matter per person. Radiation dose? If LNT is true, is a single photon a harm? If yes, Radiation policy contradicts Friend. If no (threshold exists biologically), Radiation policy is scientifically wrong but legally strict.
