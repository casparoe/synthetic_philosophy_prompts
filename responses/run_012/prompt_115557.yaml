answer: |-
  ### The Example: University Rankings and Educational Quality

  **Context:** Contemporary higher education institutions and the commercial ranking bodies that evaluate them (e.g., *U.S. News & World Report*, *QS World University Rankings*).

  **The Two Horns**
  The dilemma arises when asking about the relationship between a university's **Rank** (the approval of the authority) and its **Quality** (the normative property).

  *   **Horn 1 (Constructivist/Constitutive):** A university is "high quality" *because* it is ranked highly by the agency.
      *   On this view, the ranking system does not discover quality; it creates it. The metrics chosen by the ranking body (e.g., endowment size, acceptance rate, alumni giving) define what quality *is* for the purposes of the market. There is no "quality" outside of the score.
  *   **Horn 2 (Realist/Descriptive):** The ranking agency ranks a university highly *because* it is "high quality."
      *   On this view, educational quality is an independent reality that exists prior to and separate from the ranking. The ranking system is a measuring instrument that attempts to detect this pre-existing quality. If the instrument fails to match the reality, the instrument is wrong, not the reality.

  **What Turns on the Choice**
  The practical and ethical consequences differ significantly depending on which horn is accepted as primary.

  *   **If Horn 1 is true (Rank constitutes Quality):**
      *   **Institutional Behavior:** Universities are rational to "game" the system. Changing behavior to improve metrics (e.g., rejecting more applicants to lower acceptance rates) is not cheating; it is literally improving the institution's quality, because quality is defined by the metrics.
      *   **Criticism:** Criticizing a ranking for not measuring "true education" is category error. The ranking sets the standard; there is no external standard to appeal to.
      *   **Responsibility:** The ranking agency bears total responsibility for the state of higher education, as their methodology dictates institutional priorities.

  *   **If Horn 2 is true (Rank detects Quality):**
      *   **Institutional Behavior:** "Gaming" the system is deceptive. Improving a score without improving the underlying educational reality is a form of fraud, akin to tampering with a thermometer to make it read a lower temperature while the patient still has a fever.
      *   **Criticism:** Rankings can be legitimately criticized for "validity." If a highly ranked school provides poor teaching, the ranking is objectively inaccurate.
      *   **Responsibility:** The ranking agency is responsible for *accuracy*, not *definition*. Their job is to align their metrics with the independent reality of educational value.

  **Condition for the Dilemma to be Merely Verbal**
  For this dilemma to be merely verbal (a disagreement over definitions rather than reality), the term **"Quality"** would have to be strictly synonymous with **"Ranking Score"** in all public and institutional discourse.

  If all stakeholders (students, employers, universities, and the ranking body itself) agreed that "Quality" is *nothing more than* the output of the algorithm, the tension dissolves. The dilemma is real only because stakeholders use the word "Quality" in two conflicting ways: sometimes as a shorthand for the Rank (Horn 1), and sometimes as a claim about independent educational value (Horn 2). As long as universities claim to offer "excellence" while simultaneously optimizing for "metrics" that may not align with that excellence, the dilemma remains substantive.

  ***

  ### Settled vs. Contested

  Per your request, the following distinctions separate established facts from ongoing theoretical disputes among philosophers of education, sociologists of organizations, and economists who study this topic.

  **Settled (Consensus among researchers)**
  *   **Reactivity:** It is an empirical fact that universities change their behavior in response to ranking methodologies. (This is an instance of *Goodhart's Law*: when a measure becomes a target, it ceases to be a good measure).
  *   **Market Power:** It is settled that rankings function as a gatekeeping authority. High rankings correlate with increased applications, funding, and prestige, regardless of whether that prestige is "earned" in a realist sense.
  *   **Methodological Opacity:** It is a matter of record that ranking algorithms often rely on proxy variables (e.g., using "selectivity" as a proxy for "student caliber") rather than direct measures of learning outcomes.

  **Contested (Genuinely disputed among experts)**
  *   **The Ontology of Quality:** There is no consensus on whether "Educational Quality" exists as a mind-independent property (Horn 2) or if it is entirely a social construct determined by prestige and resource accumulation (Horn 1). Some sociologists argue quality is *only* reputational (Horn 1), while many educators argue there are objective pedagogical standards (Horn 2).
  *   **Normative Authority:** It is contested whether ranking bodies *ought* to act as definers of quality (embracing Horn 1 and being transparent about their construction of value) or as neutral auditors (embracing Horn 2 and striving for objective accuracy). Some ethicists argue they should abandon the pretense of discovery and admit they are constructing value; others argue they have a moral duty to detect pre-existing value to prevent market distortion.
  *   **The Possibility of Alignment:** It is disputed whether the two horns can be reconciled. Some theorists argue that with better metrics, the Rank and the Quality could converge (dissolving the dilemma through better science). Others argue the dilemma is structural to any quantification of social goods, meaning a gap between the Map (Rank) and the Territory (Quality) is inevitable.
