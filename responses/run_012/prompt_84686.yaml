answer: |-
  Dear colleague,

  It is a pleasure to hear you are defending this paper next week, and given the composition of the room, you are right to prepare for a rigorous interrogation of your causal claims. Since you asked me to think this through as a philosopher who spends time in methods seminars, I have tried to inhabit the mindset of your audience, particularly the epidemiologists and biostatisticians who will be listening for structural equation problems, identifiability issues, and operational definitions. I have organized the objections you are most likely to face by their likelihood and potential damage to your thesis, weaving the replies, concessions, and vulnerabilities into this narrative so you can see how the conversation might flow.

  The first and most technically damaging objection will come from the biostatisticians regarding the definition of an intervention on supervenient variables. They will argue that within the potential outcomes framework or a structural causal model, to claim that a mental property M causes behavior B, you must be able to define an intervention do(M) that sets M to a value while holding all other parents of B fixed. However, since M supervenes on the physical base P, you cannot change M without changing P. If P is also a cause of B, then M and P are perfectly collinear or structurally dependent, making the causal effect of M distinct from P unidentified. They will press you on how you can statistically distinguish the effect of the belief from the effect of the neural state when you cannot wiggle one without wiggling the other. Your reply here must be that the interventionist account does not require holding the supervenience base fixed, but rather requires that the intervention on M does not affect B via any path that bypasses M. You should argue that P is not a confounder but rather a constituent or downstream consequence of the realization of M, so the requirement to hold P fixed is a category mistake. The soft spot in this reply is that it relies on a specific interpretation of interventionism that not all causal inference practitioners accept, particularly those who prefer a stricter manipulationist view where variables must be independently fixable. You should concede up front that measuring M without error is practically impossible and that in many observational studies, we are indeed measuring P as a proxy for M, which introduces measurement bias, but insist that this is an epistemic limitation rather than an ontological exclusion of mental causation.

  The second objection will likely come from the epidemiologists who are accustomed to thinking about mechanisms and mediation. They will grant that M might be associated with B, but they will argue that the effect is fully mediated by P. In their vocabulary, if you adjust for the mediator P in your regression model, the direct effect of M on B should vanish, which suggests that P is the proximal cause and M is merely a distal label. They will ask why we should privilege the mental description if the biological mechanism is where the actual work is being done, much like we say a virus causes disease rather than the presence of viral RNA sequences specifically, yet we acknowledge the RNA is the mechanism. Your reply needs to lean heavily on the proportionality constraint you mentioned in your thesis. You should argue that P is too fine-grained to be the proportional cause because changing specific details of P might not change B as long as M remains constant, due to multiple realizability or neural plasticity. If you intervene on P to change the neural pattern but maintain the same belief, the behavior should remain stable, whereas changing the belief changes the behavior. The soft spot here is empirical, as the degree of multiple realizability in human neurobiology is a contested scientific question, and the philosopher of biology in the room may press you on whether human mental states are actually multiply realizable enough to support this claim. You should concede that for token causation in a specific individual at a specific time, the physical state is indeed the immediate driver, but maintain that for type-level causal claims relevant to science and policy, the mental property is the stable difference-maker.

  The third objection, which you anticipate will be where you face real trouble, concerns your analogy between mental causation and social epidemiology. They will argue that while poverty may supervene on individual economic transactions, it is measurable independently of the biological pathways it triggers, whereas beliefs are often only accessible via the very neural states that are supposed to be excluded. They will ask if the analogy holds water when the measurement independence condition is violated in the mental case but not in the social case. This is the most dangerous line of questioning because it threatens to isolate your thesis as a metaphysical curiosity rather than a methodological tool. Your reply must be firm that the logical structure of the exclusion argument is identical in both cases. If one insists that the biological mechanism suffices to exclude poverty as a cause of disease because every biological effect has a sufficient biological cause, then social epidemiology collapses. We treat poverty as a cause because it is the proportional difference-maker at the social level, just as beliefs are at the psychological level. The soft spot is that social variables are often more stable and intersubjectively verifiable than mental states, making the proportionality constraint easier to apply. You should concede that the operationalization of mental variables is harder than social variables, but argue that this difficulty does not negate the causal status, just as measurement error in exposure assessment does not negate the causal effect of an environmental toxin.

  There is one reply that absolutely has to land for your paper to survive in this room, and it is the point about social epidemiology. If you fail to convince them that the exclusion argument threatens their own work on social determinants of health, they will dismiss your problem as a metaphysical puzzle specific to the mind-body problem that has no bearing on causal inference practice. You need to make them feel the threat that if physical sufficiency excludes higher-level causes, then poverty, stress, and social support are not causes of health outcomes, only biomarkers are. This stakes your claim on their professional turf and forces them to either accept your solution or abandon their own research program.

  Finally, there is one question I hope nobody asks, but you must be prepared for it nonetheless. The philosopher of biology might ask whether supervenience should be represented as a causal edge in a directed acyclic graph at all. If supervenience is a logical or metaphysical relation rather than a causal one, including it in the same graph as causal arrows violates the semantics of the graph, potentially invalidating the d-separation criteria you rely on. If you treat it as a causal arrow, you invite the objection that you are conflating constitution with causation, and if you leave it out, you cannot model the exclusion problem formally. If this comes up, your best strategy is to agree that supervenience is not causal but argue that the exclusion argument erroneously treats the supervenience base as a competing causal candidate rather than a constitutive base, and that graphical models need to be interpreted with care when non-causal dependencies are present.

  I hope this helps you prepare for the defense. The key is to keep bringing them back to the practical implications for their own models rather than getting bogged down in the metaphysics of mind. Good luck next week.

  Warmly,

  Your Colleague
