      *   *Structure:*
          1.  The Ledger (Mapping the analogy).
          2.  The Audit (Where it breaks).
          3.  The Fatal Flaws (What matters for the argument).
          4.  The Verdict (Does retribution survive?).
          5.  Alternative Models (Quarantine vs. Repair).
      *   *Key Insight to Highlight:* The BIL is conflating *retribution* (deserved punishment) with *debt* (obligation). Debt implies restitution; retribution implies infliction. The metaphor hides the infliction requirement.

  7.  **Refining the "Currency" Point:**
      *   This is the user's strongest intuition. I need to validate it. If the debt is liberty, comfort is irrelevant. If the debt is suffering, the system is arbitrary. The BIL wants the *moral weight* of debt (you owe something) with the *mechanics* of suffering (it must hurt). That's inconsistent.

