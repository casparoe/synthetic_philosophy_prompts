      2.  Part (a) Breakdown (Logic, Vagueness, Generalization).
      3.  Part (b) Breakdown (Logical Form, Scope).
      4.  Summary/Advice for feedback.

      *(Final check on the "Vagueness" point)*: Williamson's argument *uses* the sorites to show luminosity fails. He maintains bivalence. The student says "no determinate fact." This implies a rejection of bivalence. This is a major interpretive error of Williamson. I must emphasize this.

      *(Final check on KK)*: The student says "at $c_{500}$ she can't know... so she certainly can't know that she knows." This is true, but irrelevant to falsifying KK. KK is a conditional. If the antecedent is false, the conditional holds. To falsify, you need the antecedent true. The student misses this completely.

