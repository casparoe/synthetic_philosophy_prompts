prompt: |-
  I'm in my third year, and alongside my degree I help run a small software studio that three of us started; we take on contractors project by project. I'm also taking a philosophy of science course this term, which is probably why an argument one of my co-founders keeps making has started to bother me.

  Sam wants to keep our current contractor, Marcus, on for the next project, on the grounds that Marcus is meticulous: every deliverable he has sent us over eight months has been flawless. I can't shake the sense that this shows far less than Sam thinks. Marcus's work never reaches us raw — our project manager, Priya, reviews each deliverable before it goes into the shared folder and fixes whatever she finds, and Marcus knows this. So all our track record really shows is that nothing has got past Priya.

  When I said this, Sam proposed the obvious remedy: give Marcus a small piece of work with no review and see whether it comes back clean. But when I asked Marcus about his process, he told me the reason he is careful is precisely that he knows Priya will read it, and that without that he would probably cut corners. Now I don't know what the test could show. And if we told him we were testing him, he would obviously be on his best behaviour — which is not the situation we would actually be hiring him for. Sam's fallback is that it makes no difference either way: we end up with clean work, so who cares whose carefulness it is. That feels too quick to me, but I can't say exactly why.

  I've noticed the mirror image of all this closer to home. Sam has written off our designer, Nadia, as unreliable because she missed two deadlines — though both weeks our build server was down, as she told us at the time. He reads the first case as proof of a good trait and the second as proof of a bad one, and it seems to me he can't have it both ways.

  What I want is not general hiring advice. I want to know whether Sam's inference works, and if it doesn't, exactly where it breaks; whether the two cases are really the same shape or only look alike; and whether any test could settle the question, given what Marcus told me. If there is a standard name for the pattern I'm circling, give it, but the reasoning matters more than the label.

  Please be explicit about how confident you are and where your own reasoning is most likely to fail, and tell me what would change your mind: which further fact about the situation, or which consideration, would lead you to a different recommendation.

  End with a brief structured summary as a JSON object with exactly these fields: "pattern" — the name of the structure at work, or "no standard name" if you don't know one; "diagnosis" — one or two plain sentences on what the evidence actually supports; "why_the_inference_breaks" — the single most important reason; "recommendation" — what we should do, with a time frame; "confidence" — one of low, moderate, or high, with a one-line justification; "most_likely_error" — the step in your own reasoning most likely to be wrong; "what_would_change_my_mind" — a list of the specific findings or arguments that would flip your recommendation.
