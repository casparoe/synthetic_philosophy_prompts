prompt: |-
  I'm a doctoral student in public administration, working on cases in which officials must choose between breaking a rule and letting something bad happen, and I keep running into a pattern I can't place. An official authorizes what she is not permitted to authorize — she violates a statute she swore to uphold, or misleads the body she answers to — because the only alternative is a disaster she can foresee and prevent. Afterward, almost everyone holds two judgments at once: that what she did was wrong, and that she had to do it. No one thanks her; the colleagues who urged her to act would be scandalized if she claimed she had acted rightly; and she is expected to say in public that she was wrong, in a way that is not supposed to count as an argument for having done otherwise. Neither judgment gives way — no one treats the wrongness as merely a cost to be weighed, and no one treats the necessity as an excuse.

  Two complications. In most of my cases the decision belongs to a body rather than a person: nine members vote, each knowing the outcome does not depend on her vote, yet afterward all of them behave as though their own hands had done it. And I have a case in which an official does nothing wrong at all — she follows the rule — the disaster happens, and her colleagues treat her as the guilty party, not for the deaths but for having kept her hands clean at others' expense.

  I assume there is a heading for this somewhere in moral and political philosophy, but I cannot work out which. Is there an established name for the first pattern, and do either of these complications belong to it? I am after the boundaries more than the label: whether it requires an actual rule violation rather than a cost imposed, whether it requires an act rather than an omission, whether the demand for public remorse belongs to the phenomenon or is a separate social ritual, and whether it survives an official who feels no guilt but is expected to. Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User Identity:** Doctoral student in public administration.
      *   **Topic:** Ethical dilemmas faced by officials (breaking rules to prevent disaster vs. following rules and allowing disaster).
      *   **Core Phenomenon:** An official violates a rule to prevent a foreseeable disaster. Afterward, there's a dual judgment: (1) What she did was wrong (illegal/unauthorized), AND (2) She had to do it (necessary). No one thanks her; colleagues distance themselves; she must publicly express remorse/admit wrongness without using it to justify the act. Neither judgment cancels the other.
      *   **Complication 1 (Collective Action):** A body votes (e.g., 9 members). Each knows their individual vote doesn't determine the outcome, yet all feel responsible ("their own hands had done it").
      *   **Complication 2 (The "Clean Hands" Case):** An official follows the rule, disaster happens. Colleagues blame her *not* for the disaster, but for keeping her hands clean at others' expense (moral cowardice/buck-passing).
      *   **Questions:** Is there an established name? What are the boundaries (act vs. omission, rule violation vs. cost, public remorse, internal guilt)?
      *   **Language:** American English.

  2.  **Identify the Core Philosophical Concept:**
      *   The description strongly echoes the concept of **"Dirty Hands"** (or the problem of dirty hands).
      *   *Origin:* Machiavelli is often cited, but the modern philosophical formulation comes from Michael Walzer's 1973 essay "Political Action: The Problem of Dirty Hands."
      *   *Key Feature:* The paradox that a political leader *must* sometimes do something morally wrong to do the right thing for the community, and yet remains guilty for doing it.
      *   *Fit:* The user's description ("wrong, and that she had to do it," "No one thanks her," "expected to say in public that she was wrong") is a textbook description of the Dirty Hands problem.

  3.  **Address the Complications:**
      *   *Complication 1 (Collective Responsibility/Voting):* This touches on the **Problem of Many Hands** (Thompson, 1980) or collective moral responsibility. In dirty hands scenarios, does the "dirt" spread across the committee? Yes, usually. The feeling that "my vote didn't matter but I'm still responsible" is a classic issue in collective agency.
      *   *Complication 2 (Following Rules/Disaster Happens):* This is the inverse of Dirty Hands. It's often discussed under **Moral Integrity vs. Political Responsibility** or **Bureaucratic Neutrality vs. Moral Agency**. Walzer specifically addresses this: the leader who keeps their hands clean may be morally pure but politically irresponsible. This is sometimes called the problem of the "Clean Hands" or "Moral Self-Indulgence."

  4.  **Determine the Boundaries (as requested):**
      *   *Rule Violation vs. Cost:* Dirty hands usually implies a *moral* violation (often codified as a rule/right), not just a tragic trade-off (utilitarian calculus). If it's just weighing costs, it's a tragic choice, not necessarily dirty hands. The *wrongness* must remain.
      *   *Act vs. Omission:* Traditionally acts (torture, lying, breaking law). However, the "Clean Hands" complication suggests omissions count if the duty is to protect.
      *   *Public Remorse:* Walzer argues the leader *must* feel guilt and perhaps confess. If they don't, they are dangerous (psychopaths or true believers). So, the expectation of remorse is part of the normative theory, even if the official doesn't feel it.
      *   *Internal Guilt:* The phenomenon exists objectively (the dilemma), but the *resolution* (being a good leader) often requires subjective guilt.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Identify the term immediately. "The Problem of Dirty Hands." Cite Walzer.
      *   *Core Pattern:* Explain why it fits. The paradox of necessary wrongdoing. The retention of guilt.
      *   *Complication 1 (The Committee):* Connect to "The Problem of Many Hands" (Dennis Thompson). Explain how dirty hands applies to collective bodies (shared guilt).
      *   *Complication 2 (The Clean Hands):* Explain this as the flip side. Walzer's point about the "moral man" vs. the "political leader." The accusation is moral cowardice or prioritizing self-purity over public welfare.
      *   *Boundaries:*
          *   *Rule vs. Cost:* It needs to be a genuine moral prohibition, not just a utilitarian cost.
          *   *Act vs. Omission:* Both can apply, though acts are the classic cases.
          *   *Remorse/Guilt:* Crucial. A leader who doesn't feel the weight is dangerous. The public ritual confirms the rule still matters.
      *   *Alternative/Related Terms:* "Tragic Choice" (Calabresi/Bobbit) - distinguish this (tragic choice implies no right answer, dirty hands implies a right answer that is still wrong). "State of Exception" (Schmitt/Agamben) - legal theory angle.
      *   *Conclusion:* Summarize the utility for a Public Admin dissertation.

  6.  **Refining the Tone:**
      *   Academic but accessible.
      *   American English spelling and idiom.
      *   Respectful of the doctoral level (don't oversimplify, but be clear).
      *   Ensure the distinction between *excuse* and *justification* is clear (the user noted "necessity as an excuse" is rejected). In Dirty Hands, it's often a *justification* that does not *exculpate*.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific boundary questions?* Yes (rule violation, act/omission, remorse, internal feeling).
      *   *Is the "Clean Hands" complication addressed?* Yes, this is vital. It's often overlooked but central to Walzer's argument.
      *   *Is the collective aspect covered?* Yes, Thompson's work is the standard reference here.
      *   *Wait, is there a legal term?* "Necessity defense" exists in law, but the user says the *moral* judgment persists even if the legal one might be mitigated. The user is asking about the *moral/political* phenomenon, not the legal defense. Stick to philosophy/political theory.
      *   *Make sure to mention that "Dirty Hands" isn't just about corruption.* It's about *necessary* wrongdoing.

  8.  **Final Polish:** Check citations (Walzer 1973, Thompson 1980). Ensure the distinction between "justification" and "exculpation" is clear, as that matches the user's observation about the dual judgment. (The act is justified by necessity, but the agent is not exculpated from guilt).

  9.  *(Final thought)*: The user mentions "No one thanks her." This is a key marker of Dirty Hands. If she were thanked as a hero, it would be a "Tragic Choice" or "Heroism." The stigma is essential.

  10. **Constructing the Output.** (Proceed to generate response based on these points.)
answer: |-
  The heading you are looking for is **"The Problem of Dirty Hands."**

  The term is most famously associated with Michael Walzer's 1973 essay, *"Political Action: The Problem of Dirty Hands,"* though it has roots in Machiavelli and Weber's *"Politics as a Vocation."* It describes precisely the paradox you have identified: the claim that there are situations in political life where a leader *must* do something morally wrong in order to do the right thing for the community, and that doing so does not erase the wrongness of the act.

  Here is how the established literature maps onto your specific observations and boundary questions.

  ### 1. The Core Pattern: Justification Without Exculpation
  You noted that colleagues hold two judgments at once: the act was wrong, but it had to be done. In the philosophy of Dirty Hands, this is the distinction between **justification** and **exculpation**.
  *   **Justification:** The act was necessary for the greater good (consequentialist).
  *   **Exculpation:** The agent is freed from guilt or blame (deontological).

  In Dirty Hands scenarios, the act is *justified* but the agent is *not exculpated*. This explains why no one thanks her. To thank her would be to normalize the violation, suggesting that the rule broken was not actually binding. To punish her severely would be to ignore the necessity of the act. The "dual judgment" preserves the moral order: the rule remains valid (hence her guilt), but the emergency was real (hence her retention of power or lack of prosecution).

  ### 2. Complication One: The Collective Body
  Your observation about the nine-member body touches on a related but distinct concept often discussed alongside Dirty Hands: **"The Problem of Many Hands"** (coined by Dennis Thompson, 1980).

  In a voting body, individual causal responsibility is diluted (my vote didn't change the outcome), yet moral responsibility remains. In Dirty Hands literature, this is treated as **collective moral responsibility**. If the body collectively authorizes the "necessary wrong," the "dirt" adheres to the institution and, by extension, the members.
  *   **Boundary:** The phenomenon survives the shift from individual to collective. In fact, Walzer argues that in modern bureaucracy, dirty hands are often "smeared" across many actors so that no single person feels the full weight of the guilt. Your case, where members *feel* the weight despite the diffusion of causality, is a robust instance of the phenomenon. It suggests the members recognize that political responsibility is not merely causal; it is role-based.

  ### 3. Complication Two: The "Clean Hands" Objection
  Your second complication (the official who follows the rule, disaster ensues, and she is blamed for moral cowardice) is explicitly addressed by Walzer. He argues that a political leader who refuses to get their hands dirty to protect their constituents is guilty of **moral self-indulgence**.

  *   **The Accusation:** The colleagues are not blaming her for the disaster *per se* (which might have been unavoidable), but for prioritizing her own moral integrity over the welfare of the people she serves.
  *   **Boundary:** This confirms that Dirty Hands is not just about rule-breaking; it is about the **duty of office**. If the role requires protecting the public, and following the rule fails that duty, the official has violated the deeper obligation of the office to uphold the shallower obligation of the statute. In this inverse case, she is blamed for keeping her hands clean "at others' expense."

  ### 4. Boundaries of the Phenomenon
  You asked for the boundaries regarding rules, acts, remorse, and internal feeling.

  **A. Rule Violation vs. Cost Imposed**
  *   **Boundary:** It requires a **moral prohibition**, not just a tragic trade-off.
  *   **Explanation:** If an official allocates limited funds to Hospital A instead of Hospital B, causing deaths at B, this is a "Tragic Choice" (Calabresi & Bobbit), not necessarily Dirty Hands. Dirty Hands requires violating a right or a deep moral norm (e.g., torture, lying to the legislature, violating due process). The "wrongness" must be categorical, not just quantitative. If the act is merely a "cost to be weighed," the guilt disappears once the calculation is made. In your cases, the guilt persists because a boundary was crossed, not just a price paid.

  **B. Act vs. Omission**
  *   **Boundary:** Traditionally acts, but **omissions count** if there is a specific duty to act.
  *   **Explanation:** Classic Dirty Hands cases involve active wrongdoing (authorizing torture, lying). However, your second complication shows that omission can generate the same stigma if the official has a fiduciary duty to prevent harm. If the rule says "Do not spend reserve funds" and the official obeys while people starve, the omission is treated as a moral failure equivalent to an act. The core is the **breach of the duty to protect**, whether by commission or omission.

  **C. Public Remorse: Ritual or Phenomenon?**
  *   **Boundary:** The demand for remorse is **constitutive** of the phenomenon, not just a ritual.
  *   **Explanation:** Walzer argues that the leader *ought* to feel guilt. If a leader breaks a rule to save the city and feels *no* regret, they are dangerous (a tyrant or a psychopath). The public expectation that she admit wrongness serves a vital political function: it reaffirms that the rule still exists. If she argued she was "right," she would be claiming the authority to suspend the law unilaterally. By admitting "wrongness," she submits herself back to the rule of law. The remorse validates the norm she violated.

  **D. Internal Guilt vs. Expected Guilt**
  *   **Boundary:** The phenomenon exists objectively even if the official feels nothing, but the **normative resolution** requires guilt.
  *   **Explanation:** You can have a "Dirty Hands" situation objectively (the dilemma exists). However, for the political order to remain healthy, the official is *expected* to feel guilt. If she feels none, she fails the moral test of leadership, even if she made the "correct" utilitarian choice. In your research, an official who feels no guilt but performs the remorse is engaging in a necessary political fiction; an official who feels no guilt and admits none is a threat to the system.

  ### Summary for Your Dissertation
  The label is **The Problem of Dirty Hands**.

  *   **It fits your first pattern:** Necessary wrongdoing that leaves moral residue.
  *   **It fits your first complication:** Collective responsibility (often discussed under "The Problem of Many Hands" within the Dirty Hands framework).
  *   **It fits your second complication:** The critique of the "Clean Hands" as moral self-indulgence.
  *   **Key Distinction:** It is distinct from "Necessity" as a legal defense. In law, a successful necessity defense exculpates (you are not guilty). In Dirty Hands, the necessity justifies the act but does *not* exculpate the agent (you are guilty, but you did the right thing).

  **Recommended Reading:**
  1.  **Michael Walzer,** *"Political Action: The Problem of Dirty Hands"* (1973). This is the foundational text for your specific paradox.
  2.  **Dennis Thompson,** *"Political Ethics and Public Office"* (1980). Specifically the chapters on responsibility and the "Problem of Many Hands."
  3.  **Max Weber,** *"Politics as a Vocation"* (1919). For the distinction between the "ethics of conviction" (keeping hands clean) and the "ethics of responsibility" (accepting the dirt).
  4.  **Christopher Kutz,** *"Complicity: Ethics and Law for a Collective Age"* (2000). For the complication regarding voting bodies and shared responsibility.

  This framework should give you the philosophical vocabulary to categorize these cases without reducing them to simple utilitarian calculus or legalistic defenses.
