          *   Harm Reduction nature: Often requires looking past immediate discomfort.
      *   **The Counter-Argument (Strongest case against):** Paternalism. Who are we to say we know better than the beneficiaries? It damages trust.
      *   **The Review Trigger:** Needs to be specific. Not just "next year." Maybe "18 months" or "upon next strategic review." Let's go with 18 months to allow programme traction.
      *   **Tone Check:** British English (programme, favour, centre, etc.), professional but candid, accessible.

  4.  **Refining the Argument (Self-Correction during drafting):**
