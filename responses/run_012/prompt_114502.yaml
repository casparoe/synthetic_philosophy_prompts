          *   *The Problem:* The procedure was run twice with slightly different protocols (knowing endowment size vs. not). They reached opposite conclusions.
          *   *The Poll:* The broader beneficiary community voted 2-to-1 *against* funding the programme (in a poll that probably shouldn't have been run).
      *   **Requirements:**
          *   Clear recommendation (Fund, Don't Fund, or Fund with Conditions).
          *   Reasoning.
          *   Date/Trigger for review.
          *   Honesty about the strongest argument for the opposing side.
          *   Address the awkward bit (Idealized vs. Actual disagreement).
          *   Tone: British English, readable for non-philosophers, no citations.

  2.  **Determine the Recommendation:**
