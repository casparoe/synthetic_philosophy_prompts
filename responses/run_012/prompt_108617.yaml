answer: |-
  Here is the specification for an adequate theory of psychiatric classification. It is structured as a set of requirements, their justifications, their status (non-negotiable vs. camp commitment), and an analysis of the tensions between them.

  ### I. The Specifications

  **1. The Validity Requirement (Truth-Tracking)**
  *   **The Requirement:** The theory must specify what makes a diagnosis *correct* independent of its utility. It must posit a truth-condition (e.g., a biological lesion, a broken psychological mechanism, or a coherent social pattern) that distinguishes a disorder from a mere problem in living.
  *   **The Case:** Without this, psychiatry is indistinguishable from astrology or phrenology. A diagnosis can be useful (e.g., prescribing a sedative calms a grieving widow) without being correct (grief is not a pathology). Utility validates the *intervention*; validity validates the *category*.
  *   **Status:** **Non-negotiable.** A classification system that cannot distinguish between truth and convenience is not a science.

  **2. The Reliability Requirement (Stability)**
  *   **The Requirement:** The theory must explain how different observers (clinicians) and different contexts (research vs. clinic) can identify the same category with high agreement.
  *   **The Case:** Research requires stable groups to test treatments; clinics require stable labels to communicate risk and prognosis. If Clinician A sees "Depression" and Clinician B sees "Grief" in the same patient, the category fails to carve nature at its joints.
  *   **Status:** **Non-negotiable.** Without reliability, data cannot accumulate, and the system collapses into subjective opinion.

  **3. The Reflexivity Requirement (The Looping Effect)**
  *   **The Requirement:** The theory must account for the fact that human beings react to the classifications applied to them. It must explain how the existence of a category changes the behavior of the classified, which in turn alters the extension of the category over time.
  *   **The Case:** As Ian Hacking argued, classifying a "multiple personality" creates a role that patients can inhabit. If a theory treats psychiatric subjects like inert chemicals, it ignores the fundamental ontology of its subject matter. People learn the script of their diagnosis and perform it.
  *   **Status:** **Non-negotiable.** This is specific to the *human* sciences. Ignoring this renders the theory descriptively false regarding how psychiatric categories function in the wild.

  **4. The Cultural Permeability Requirement**
  *   **The Requirement:** The theory must accommodate the fact that the same underlying distress is sorted into different categories across different cultures (e.g., somatic complaints in one culture, mood complaints in another) without declaring one culture "wrong."
  *   **The Case:** Distress is universal; the language of distress is local. A theory that insists "Depression" is a universal natural kind risks imperialism, while a theory that insists all categories are purely local risks relativism where no cross-cultural research is possible.
  *   **Status:** **Non-negotiable.** Any theory that cannot explain why *shenjing shuairuo* (China) and *Major Depressive Disorder* (USA) overlap but do not match is insufficient.

  **5. The Normative Requirement (Harm & Function)**
  *   **The Requirement:** The theory must define the boundary between "disorder" and "difference." It must specify why a condition is *bad* (harmful) and *broken* (dysfunctional), rather than merely statistically rare or socially inconvenient.
  *   **The Case:** Homosexuality was once a diagnosis. A theory must explain why it was never a disorder despite being classified as one. This requires a normative standard (e.g., evolutionary function, subjective suffering, social disability) to prevent classification from becoming a tool of social control.
  *   **Status:** **Commitment of a Particular Camp.** (e.g., Harmful Dysfunction vs. Social Construct vs. Descriptive). Realists demand an objective standard of dysfunction; Constructivists argue "harm" is always value-laden.

  ---

  ### II. The Incompatibility Analysis

  You suspect that **demanding a category track a real disorder** (Validity) and **demanding it survive the reshaping of the people it classifies** (Reflexivity) will collide.

  **You are right, but only under a specific metaphysical assumption.**

  *   **The Collision:** If you assume **Static Essentialism** (a disorder is a fixed, biological entity like a virus), then Reflexivity breaks Validity. If the "virus" changes its shape because we named it, it wasn't a fixed entity to begin with. Under this view, you must choose: either the category is real and stable (ignoring the looping effect), or the category is mutable and social (abandoning biological realism).
  *   **The Resolution:** You are wrong if you accept **Dynamic Realism** (Interactive Kinds). If a "real disorder" is defined not as a static biological lesion but as a *stable feedback loop between biology, psychology, and social expectation*, then Validity and Reflexivity are compatible. The "real thing" *includes* the reaction to the label.
  *   **The Verdict on Compatibility:** Validity and Reflexivity are **incompatible** for *Natural Kinds* (like gold or electrons) but **compatible** for *Interactive Kinds* (like citizens or patients). An adequate theory must treat psychiatric categories as Interactive Kinds. If it treats them as Natural Kinds, it fails the Reflexivity Requirement.

  ---

  ### III. The Specific Case: The Label Seeker

  *The Case:* A man seeks a label, finds it organizes his life, and his symptoms subsequently fit the checklist more tightly than before.

  **Is he evidence for the category, an artifact of it, or both?**

  He is **both**, and this duality is the test of your theory.

  1.  **As Artifact:** He is evidence that the category has *causal power*. The checklist did not describe a pre-existing, rigid cluster; it provided a script. His tightening fit demonstrates the **Reflexivity Requirement**. If your theory claims the category merely "discovered" him, it is false.
  2.  **As Evidence:** He is evidence that the category has *resonance*. A label cannot organize a life if it does not map onto some latent capacity for suffering or behavioral pattern within the person. If the label were totally arbitrary (e.g., "You have a deficit of being a giraffe"), he could not organize his life around it.

  **Theoretical Mandate:** An adequate theory must classify this man not as a "false positive" but as an **Interactive Kind instantiation**. The diagnosis became true *because* it was applied. To call him merely an artifact dismisses his reality; to call him merely evidence ignores the construction. The theory must posit that the "disorder" is the *process of alignment* between the person and the category.

  ---

  ### IV. Verdict on Existing Approaches

  **1. The Descriptive, Manual-Based Approach (e.g., DSM-5)**
  *   **Performance:** High on **Reliability**, Low on **Validity**, Fails **Reflexivity**.
  *   **Critique:** It achieves agreement by ignoring causes (atheoretical), satisfying the clinic and research needs for consistency. However, it treats the "Label Seeker" as a valid case without explaining *why* the label stuck, ignoring the looping effect. It assumes categories are stable buckets, failing to account for how the buckets change the water poured into them. It handles **Cultural Permeability** poorly, often exporting Western categories as universal.
  *   **Verdict:** Pragmatically adequate for administration; theoretically bankrupt.

  **2. The Harmful-Dysfunction Approach (e.g., Wakefield)**
  *   **Performance:** High on **Validity** (conceptually), Moderate on **Reliability**, Fails **Cultural Permeability**.
  *   **Critique:** It solves the "Correct vs. Useful" problem by anchoring disorder in failed evolutionary function. This protects against pathologizing normal variation. However, it struggles with **Reflexivity**; an evolutionary function does not easily account for how a diagnosis changes the patient's future behavior. It also struggles with **Cultural Permeability**, as "evolutionary function" is often interpreted through a specific Western lens of what psychological mechanisms are *for*.
  *   **Verdict:** Philosophically robust; clinically and culturally rigid.

  **Final Summary:** Neither current approach satisfies the **Reflexivity Requirement** while maintaining **Validity**. An adequate theory must move beyond "Natural Kinds" and "Social Constructs" to a theory of **Interactive Kinds**, where the truth of the diagnosis is found in the stability of the feedback loop between the classifier and the classified.
