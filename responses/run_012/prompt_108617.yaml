              *   Cross-cultural variation in distress sorting.
              *   Reliability (research vs. clinic).
              *   Specific Case: The "self-fulfilling diagnosis" (man seeks label, organizes life, fits checklist better). Is he evidence or artifact?
          *   Label requirements as "Non-negotiable" vs. "Commitments of a particular camp."
          *   Identify incompatibilities (can any two not be jointly satisfied?).
          *   End with a verdict on two approaches: Descriptive/Manual-based (e.g., DSM) vs. Harmful-Dysfunction (e.g., Wakefield).

  2.  **Deconstruct the Core Tensions:**
      *   *Realism vs. Pragmatism:* Is a disorder a natural kind (like a virus) or a social construct (like debt)?
      *   *Stability vs. Fluidity:* Categories need to be stable for science but flexible for human experience.
      *   *Objectivity vs. Subjectivity:* Distress is felt internally but classified externally.
      *   *The Looping Effect:* Hacking's concept. Classifications change the classified.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Validity/Truth.* A diagnosis shouldn't just work; it should be *right*. But what does "right" mean in psychiatry? It needs to track something real (biology, psychology, or social reality).
      *   *Req 2: Reliability.* Clinicians need to agree. Researchers need to replicate.
      *   *Req 3: The Looping Effect.* Must account for human reflexivity. People react to labels.
      *   *Req 4: Cultural Sensitivity.* Distress isn't universal. Somatization vs. psychologization.
      *   *Req 5: Utility.* It must help treatment, prognosis, or communication.
      *   *Req 6: The "Seeker" Case.* Address the man who fits the label better after adopting it.

      *Refining the "Non-negotiable" vs. "Camp Commitment" distinction:*
