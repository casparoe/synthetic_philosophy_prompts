answer: |-
  **DEFINITIONS COMMITTEE: DISPUTE RESOLUTION PROTOCOL**
  **Purpose:** Distinguish confusion from value conflicts within a single sitting. **Time Limit:** 60 Minutes.

  **STEP 1: THE FACT TEST**
  Parties must list all non-linguistic facts regarding the case (actions taken, physical outcomes, observable states).
  *   **Sufficient Answer:** A written list signed by both parties confirming identical factual beliefs.
  *   **Stop Condition:** If parties disagree on any fact (e.g., "Did this action cause pain?"), **STOP.**
  *   **Verdict 3: Substantive Dispute.** The disagreement is about reality. Gather evidence; resolve by majority vote on facts.

  **STEP 2: THE CONSEQUENCE TEST**
  Parties list all practical consequences of using Term A vs. Term B (legal liability, stigma, protocol triggers, resource allocation).
  *   **Sufficient Answer:** A written list identifying where the labels trigger different organizational rules or ethical valuations.
  *   **Stop Condition:** If facts agree (Step 1) but consequences differ, **STOP.**
  *   **Verdict 2: Verbal Dispute, Substantive Choice.** The disagreement is about which policy switch to flip. Resolve by majority vote on *usage*, not truth.

  **STEP 3: THE RESIDUAL TEST**
  If facts and consequences match, is there any remaining objection?
  *   **Pass Condition:** No objection remains.
  *   **Verdict 1: Dispute Dissolves.** The argument was confusion. Adopt neutral phrasing.

  **DISTINGUISHING VERDICT 2 FROM 3**
  Verdict 3 asks *what is happening*; Verdict 2 asks *what we shall call what is happening*. Agreeing on every fact does not make a dispute trivial (Verdict 2) because labels act as normative switches. Calling an act "Restraint" vs. "Protection" may not change the physical act, but it changes the ethical and legal rules applied to it. Therefore, Verdict 2 requires a vote on values, not evidence.

  **LIMITATIONS & RISKS**
  1.  **The Meaning Trap:** Parties may dispute whether they "agree on facts." The Chair must rule when factual agreement is sufficient; this ruling is itself fallible.
  2.  **The Silencing Risk:** Declaring a dispute "Verbal" (Verdict 2) can dismiss legitimate ethical concerns as mere semantics. This protocol forces those concerns into the open (Step 2) but cannot guarantee they are weighted correctly.
  3.  **No Arbitration:** This protocol identifies the *type* of disagreement; it does not resolve Verdict 2 or 3 without a vote.

  **CASE APPLICATIONS**
  1.  **Restraint vs. Protective Intervention**
      *   *Facts:* Both sides agree on the physical hold used and the patient outcome. (Pass Step 1).
      *   *Consequences:* "Restraint" implies rights violation/mandatory review; "Protective" implies duty of care/no review. (Fail Step 2).
      *   *Verdict:* **Verbal Dispute, Substantive Choice.**
      *   *Outcome:* Goes to vote on policy preference. *(Chair Note: You will dislike this. Your logical argument for "Restraint" is overridden by a vote on ethical labeling.)*
  2.  **'Clinician' covers nurses**
      *   *Facts:* Both sides agree on nurses' duties, training, and scope of practice. (Pass Step 1).
      *   *Consequences:* "Clinician" triggers pay scale X vs. Y and authority levels. (Fail Step 2).
      *   *Verdict:* **Verbal Dispute, Substantive Choice.**
      *   *Outcome:* Goes to vote on scope of term.
