prompt: |-
  I chair the definitions committee of my professional body. We meet monthly, most members are practitioners rather than philosophers, our wording binds the whole organisation, and six months ago I lost a vote I should have won because I spent two hours arguing with a colleague who turned out to mean something different by 'harm' than I did. Write a procedure the committee can run in a single sitting on the disputes that reach us: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to treat the matter as a disagreement about words, and where it must hand the question to a vote because what is at stake is values rather than facts. It should end in one of three verdicts rather than a bare yes or no — the dispute dissolves; the dispute is verbal but the choice between the rival meanings is itself the substantive issue; the dispute is substantive — and it should say how to tell the second from the third, and why agreeing on every fact does not by itself make a dispute trivial. Be honest about where the procedure cannot decide, including the fact that its central test, whether two people mean the same thing, is itself something the parties can dispute, and about the risk that calling a dispute verbal is just a way of winning it. Keep it to a page, since nobody on the committee will read more. Run it on two cases: whether a particular practice counts as restraint or as protective intervention, and whether our standard's term 'clinician' covers nurses, where both sides agree on everything nurses do. On the first, I am the one who will not like the verdict.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a definitions committee of a professional body.
      *   **Context:** Monthly meetings, members are practitioners (not philosophers), wording binds the organization, previous loss due to verbal dispute over 'harm'.
      *   **Task:** Write a procedure for resolving disputes in a single sitting.
      *   **Requirements:**
          *   Questions to ask in order.
          *   Criteria for sufficient answers.
          *   Stop conditions (refusal to treat as verbal disagreement).
          *   Hand-off conditions (vote because it's about values, not facts).
          *   Three Verdicts: (1) Dispute dissolves, (2) Dispute is verbal but choice of meaning is substantive, (3) Dispute is substantive.
          *   Distinction: How to tell (2) from (3).
          *   Nuance: Why agreeing on facts doesn't make it trivial.
          *   Honesty/Limitations: Acknowledge the test itself can be disputed, risk of "verbal" label being a power move.
          *   Length: One page (crucial constraint).
          *   Application: Run the procedure on two cases:
              1.  Restraint vs. Protective Intervention (User expects to dislike the verdict here).
              2.  'Clinician' covers nurses? (Both sides agree on what nurses do).

  2.  **Drafting the Procedure (Iterative Process):**

      *   *Constraint Check:* One page is very short. I need to be concise, dense, and actionable. No fluff.
      *   *Structure:*
          1.  Title/Header.
          2.  The Procedure (Steps/Questions).
          3.  The Verdicts & Distinctions.
          4.  Limitations/Risks.
          5.  Case Applications.

      *   *Content - The Procedure:*
          *   Need to isolate factual agreement vs. terminological preference.
          *   Step 1: Fact Check. Do we agree on the non-linguistic facts?
          *   Step 2: Prediction Check. Do we agree on what consequences follow from labeling it X vs Y?
          *   Step 3: Value Check. If facts and consequences align, is the objection purely about connotation/stigma?
          *   Stop condition: If facts disagree -> Substantive.
          *   Vote condition: If facts agree but values/policy preferences differ on the label -> Verbal but Substantive Choice.

      *   *Content - The Verdicts:*
          1.  *Dissolves:* Everyone agrees on facts and implications; the argument was just confusion.
          2.  *Verbal but Substantive:* Facts agree, but the label carries policy/value weight (e.g., stigma, legal liability). Needs a vote on *usage*, not truth.
          3.  *Substantive:* Facts disagree (e.g., does this action actually cause harm?). Needs evidence/vote on reality.

      *   *Content - Limitations:*
          *   Acknowledge the "Meaning Test" is itself contestable.
          *   Acknowledge "Verbal" can be a silencing tactic.

      *   *Content - Case Runs:*
          *   Case 1 (Restraint vs. Protective): Likely Verdict 2. Facts agree (action is same), but label implies different ethical/value judgments. User expects to dislike this (probably wants it to be substantive or dissolve in their favor, but if it's a value choice, it goes to vote).
          *   Case 2 (Clinician/Nurses): Likely Verdict 1 or 2. If both agree on what nurses do, it's about scope of term. If the term triggers specific rights/pay, it's Verdict 2 (vote on policy). If it's just descriptive, Verdict 1 (dissolves, just define it). Let's make it Verdict 2 to show the nuance.

  3.  **Refining for Length and Tone:**
      *   Tone: Professional, procedural, authoritative but humble about limits.
