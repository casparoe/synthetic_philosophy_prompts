      *   *Cases:* Apply briefly.

  5.  **Addressing Specific User Constraints:**
      *   "Six months ago I lost a vote... arguing with a colleague who turned out to mean something different by 'harm'." -> The procedure must prevent this.
      *   "End in one of three verdicts."
      *   "How to tell the second from the third."
      *   "Why agreeing on every fact does not by itself make a dispute trivial." (Because labels trigger different rules/values).
      *   "Honest about where the procedure cannot decide."
      *   "Run it on two cases... On the first, I am the one who will not like the verdict." -> This means the verdict should probably be "Verbal but Substantive" (goes to vote) rather than "Dissolves" (where the Chair might feel logically vindicated) or "Substantive" (where evidence might side with the Chair). Actually, if the Chair lost a vote before, maybe the Chair wants it to be substantive (facts) but the procedure reveals it's values (vote). Or the Chair wants it to dissolve (logic wins) but it goes to vote. Let's aim for: The procedure shows it's a value choice (Verdict 2), forcing a vote rather than a logical win.

  6.  **Writing the Text (incorporating constraints):**

      *   *Header:* **Definitions Committee: Dispute Resolution Protocol**
      *   *Intro:* One sentence purpose.
