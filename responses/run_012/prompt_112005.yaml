          *   **Assessment:** **Technically True but Irrelevant.** Yes, von Neumann-Morgenstern utilities are unique up to positive affine transformation. But this doesn't solve the mugging. If $U(A) > U(B)$, rescaling doesn't change the preference order. The problem is the *magnitude* relative to probability, not the scale itself.
      *   *Claim 8: "It is a curiosity about the arithmetic of infinities, not a serious problem for expected utility theory."*
