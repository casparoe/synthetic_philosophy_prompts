          *   **Assessment:** Fair representation of the *reductio*. That's the conclusion EUT (Expected Utility Theory) seems to force if you accept the premises.
      *   *Claim 4: "What is disturbing is that the same reasoning licenses any absurd demand whatsoever."*
          *   **Assessment:** Fair. This is the core intuition pump.
      *   *Claim 5: "The standard reply is that one should not believe a stranger who makes an obviously absurd threat, and that disposes of the puzzle."*
          *   **Assessment:** **Problematic.** This is the "just don't believe him" move. As the user suspects, this is weak. Why? Because the probability doesn't need to be high, just non-zero. If the payoff is $10^{100}$, even a probability of $10^{-50}$ yields a huge EV. The mugger can *adjust* the stakes to overcome any fixed prior probability threshold.
      *   *Claim 6: "In any case, the whole difficulty only arises if you allow utilities to be literally infinite, which no working decision theorist does..."*
