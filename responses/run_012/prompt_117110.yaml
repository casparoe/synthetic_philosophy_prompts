          *   Ontic Prediction: Yes, it's natural.
          *   Epistemic Prediction: No, correlations might exist at the ontic level even if prepared separately.
      *   *Crux 2: Spekkens' Toy Model.*
          *   Argument: How much quantum behavior is explainable by knowledge restrictions?
          *   Ontic Prediction: It hits a wall at nonlocality (Bell), proving ontic necessity.
          *   Epistemic Prediction: The wall is a feature of the specific model, not proof of ontic $\psi$; a better epistemic model might exist.
      *   *Crux 3: QBism/Betting Odds.*
          *   Argument: Is the probability subjective or objective?
