      *   *Semantic Check:* Explicitly mention where definitions of "real" or "information" cause friction.
      *   *Bottom Line:* Must be one sentence, start with "Bottom line:", pick the most pivotal crux. PBR is usually the heavyweight here, but the "Preparation Independence" assumption is the specific lever.

  7.  **Self-Correction/Review during drafting:**
