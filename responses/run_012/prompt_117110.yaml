          7.  Ending: Exactly one sentence, starting with "Bottom line:", naming the one crux most likely to move somebody.

  2.  **Deconstruct the Physics/Philosophy:**
      *   **$\psi$-ontic:** The wavefunction represents a real physical state of the system. (e.g., Many Worlds, Bohmian Mechanics, Objective Collapse).
      *   **$\psi$-epistemic:** The wavefunction represents knowledge/information about the system, not the system itself. (e.g., QBism, certain Copenhagen variants, Statistical interpretations).
      *   **PBR Theorem (2012):** Pusey, Barrett, Rudolph. Claims that under certain assumptions (preparation independence), distinct quantum states must correspond to disjoint physical states. Effectively challenges $\psi$-epistemic views. *Caveat:* Preparation Independence assumption.
      *   **Spekkens' Toy Model:** A classical model with an epistemic restriction that reproduces many quantum phenomena (interference, teleportation, etc.) but fails on Bell inequalities (nonlocality). Shows how much "quantumness" can be epistemic.
      *   **QBism (Quantum Bayesianism):** A specific flavor of epistemic where $\psi$ is an agent's personal betting odds. It's a subset of epistemic but distinct in its subjective emphasis.
      *   **Wavefunction as Law:** A view (advocated by some like Goldstein/Zanghì or perhaps a variant of nomological realism) where $\psi$ is part of the law of motion rather than the state of the object. This is often associated with Bohmian mechanics but can be a distinct ontological category.

