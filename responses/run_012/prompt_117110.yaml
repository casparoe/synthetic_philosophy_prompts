      *   **Structure:**
          1.  Agreed Claims (Numbered List): Formalism, nature of disagreement, open questions, no-go theorems.
          2.  Real Disagreements (Table): Worded as each side wants, not strawmen.
          3.  Cruxes: Sub-questions where settling one changes minds. Must include specific arguments requested (PBR theorem, Spekkens' toy model, QBism/personal betting, Wavefunction as Law).
          4.  For each crux: The argument both agree bears on it, and what each side predicts.
          5.  Formatting: Agreed claims as numbered list, disagreements in a table.
