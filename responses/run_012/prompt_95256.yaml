answer: |-
  This is a sophisticated request. You have correctly identified that the debate over "repugnant markets" often stalls because participants are arguing over different success criteria for the moral theory itself. One side is optimizing for individual liberty and welfare consistency; the other is optimizing for social meaning and symbolic integrity.

  Treating this as a requirements specification for a moral theory is the right approach. Below are the functional requirements (desiderata) that an adequate theory of market repugnance must satisfy, based on the puzzles you raised. For each, I have listed the motivation, classified its status as a constraint or a partisan preference, and flagged where it conflicts with other requirements.

  ### Requirement 1: The Discrimination Constraint
  **Specification:** The theory must distinguish between exchanges that are empirically similar but morally distinct. It cannot ban all markets, nor can it permit all markets. It must draw a boundary line that explains why we permit payment for plasma, dangerous labor, and furniture moving, but forbid payment for kidneys, votes, and friendship.

  **Motivation:** This addresses your first puzzle. If the theory bans everything, it is puritanical and impractical. If it bans nothing, it ignores deep-seated moral intuitions about commodification. A theory that says "money corrupts everything" is as useless as one that says "money is neutral."

  **Status:** **Genuine Constraint.** Any theory that fails to discriminate is functionally useless for policy.

  **Tension:** This creates a heavy burden of *justification*. The theory must identify a property shared by kidneys and votes that is absent in plasma and furniture. If that property is "essential to human dignity," the theory risks becoming vague. If it is "risk of harm," it fails because we allow dangerous labor.

  ### Requirement 2: The Intrinsic Wrongness Constraint
  **Specification:** The theory must identify the wrongness as inherent to the transaction type, not solely dependent on contingent outcomes. It must explain why an exchange can be objectionable even if it makes both parties better off and harms no third party.

  **Motivation:** This addresses the definition of repugnance you provided ("objectionable in itself"). In price-gouging cases, the transaction might allocate resources efficiently (good outcome), yet remains repugnant. In kidney sales, the seller might be happier with the cash, yet the sale is forbidden.

  **Status:** **Genuine Constraint.** Without this, the theory collapses into standard cost-benefit analysis, which the "repugnance" camp explicitly rejects.

  **Tension:** This conflicts directly with **Requirement 6 (Empirical Sensitivity)**. If the wrongness is intrinsic, empirical side-effects (like supply reduction) should be irrelevant. If the wrongness depends on side-effects, it is not intrinsic.

  ### Requirement 3: The Third-Party Veto
  **Specification:** The theory must account for the moral standing of bystanders. It must explain why people who are not buying or selling have the standing to object to, regulate, or ban the exchange between consenting adults.

  **Motivation:** This addresses your second puzzle. In kidney markets, the seller and buyer might consent. The repugnance is felt by society at large. If the theory requires direct harm to a non-consenting party to justify a ban, it cannot explain why we ban vote-selling (where the "harm" is diffuse) or incestuous contracts (where parties consent).

  **Status:** **Partisan Prejudice (Libertarian View) vs. Genuine Constraint (Communitarian View).**
  *   *Libertarians* view this as a bug: if no one is harmed, third parties have no standing.
  *   *Communitarians* view this as a feature: markets shape the society bystanders live in, so they are stakeholders.

  **Tension:** This is the primary conflict point. Satisfying this requirement violates the **Liberty Principle** (that competent adults should be free to engage in consensual exchange). You generally cannot maximize both Third-Party Standing and Participant Autonomy.

  ### Requirement 4: The Historical Fallibility Check
  **Specification:** The theory must explain why past feelings of repugnance were mistaken (e.g., usury, interracial marriage, women working) without discarding current feelings of repugnance as automatically mistaken. It needs a filter for "progressive" vs. "regressive" disgust.

  **Motivation:** This addresses your third puzzle. Disgust has a bad track record. If the theory treats repugnance as a moral compass, it must explain why the compass was broken for centuries and is suddenly working now.

  **Status:** **Genuine Constraint.** A theory that validates all current disgust is historically illiterate. A theory that invalidates all disgust is normatively empty.

  **Tension:** This conflicts with **Requirement 5 (Normative Weight)**. It is extremely difficult to build a mechanism that says "listen to disgust now" but "ignore disgust then" without appealing to an external standard that makes the disgust redundant.

  ### Requirement 5: The Normative Weight of Disgust
  **Specification:** The theory cannot treat repugnance as mere noise or irrational bias. It must treat the feeling as tracking *something* real about the social meaning of the exchange, even if the feeling is sometimes misapplied.

  **Motivation:** This addresses the other half of your third puzzle. If repugnance is just "yuck factor" with no informational value, there is no reason to ban anything that isn't already harmful. The feeling must carry evidentiary weight regarding the degradation of a social good.

  **Status:** **Partisan Prejudice (Regulation Camp).**
  *   *Market Advocates* view this as a prejudice: they argue disgust is an evolutionary relic with no place in modern policy.
  *   *Market Skeptics* view this as a constraint: they argue disgust is a social alarm system.

  **Tension:** This pulls against **Requirement 4**. The more weight you give disgust (Req 5), the harder it is to explain away historical errors (Req 4).

  ### Requirement 6: Empirical Sensitivity (Crowding-Out)
  **Specification:** The theory must accommodate the possibility that introducing money changes the nature of the good provided (e.g., paying for blood reduces the supply of altruistic blood).

  **Motivation:** This addresses your fourth puzzle. If paying for a kidney reduces the total supply of kidneys or lowers their quality due to hidden medical histories, the market fails on its own terms.

  **Status:** **Empirical Footnote vs. Theoretical Core.**
  *   *Consequentialists* view this as a core constraint: if the market produces worse outcomes, ban it.
  *   *Deontologists* view this as a footnote: if selling kidneys is inherently degrading, it should be banned even if it saves more lives.

  **Tension:** This conflicts with **Requirement 2 (Intrinsic Wrongness)**. If the ban relies on the empirical fact that supply drops, the ban is contingent. If supply *increased* due to payment, the ban would lift. But most opponents of kidney markets argue the ban should hold even if supply increased.

  ---

  ### The Incompatibility Analysis

  You asked to see where the demands pull against one another. When we treat these as system requirements, we find that no single architecture can satisfy them all simultaneously. There are three fatal race conditions in the specification.

  #### Conflict A: The Autonomy vs. Social Meaning Deadlock
  *   **Requirements Involved:** #3 (Third-Party Veto) vs. Participant Autonomy (implied baseline).
  *   **The Crash:** To satisfy the intuition that vote-selling or kidney-selling is wrong, you must grant third parties the right to veto consensual exchanges (Req #3). However, to satisfy the intuition that furniture-moving or plasma-selling is permissible, you must grant participants sovereignty over their own bodies and labor.
  *   **Why it fails:** There is no stable metric to decide when the "social meaning" outweighs "individual consent." If the theory prioritizes social meaning, it becomes authoritarian (banning friendship contracts). If it prioritizes consent, it becomes permissive (allowing vote selling). The specification demands a switch that does not exist.

  #### Conflict B: The Epistemic Paradox
  *   **Requirements Involved:** #4 (Historical Fallibility) vs. #5 (Normative Weight).
  *   **The Crash:** You want the theory to treat repugnance as evidence of a real wrong (Req #5), but you also want it to admit that repugnance has frequently been false evidence in the past (Req #4).
  *   **Why it fails:** To distinguish "good" repugnance (kidneys) from "bad" repugnance (interracial marriage), the theory needs an external standard of value. But if you have an external standard of value (e.g., "human dignity"), you do not need the repugnance feeling to do the work. The repugnance becomes epiphenomenal. You cannot have it be both the *detector* of the wrong and *unreliable* without a separate detector to check it.

  #### Conflict C: The Intrinsic vs. Contingent Contradiction
  *   **Requirements Involved:** #2 (Intrinsic Wrongness) vs. #6 (Empirical Sensitivity).
  *   **The Crash:** You asked for an account of when an exchange is objectionable *in itself* (Req #2). But you also asked the theory to accommodate the fact that payment changes behavior and supply (Req #6).
  *   **Why it fails:** If the objection is intrinsic (like slavery or torture), the empirical outcome is irrelevant. If the objection depends on the empirical outcome (crowding-out), it is not intrinsic. A theory cannot claim that selling a kidney is *always* degrading (intrinsic) while also arguing that we should check if it actually reduces supply (contingent). If the supply didn't drop, would it still be degrading? If yes, Req #6 is irrelevant. If no, Req #2 is false.

  ### Conclusion: The Impossibility Result

  Based on this specification, **no single theory can meet all requirements.**

  The debate persists not because one side has better facts, but because the "system requirements" are mutually exclusive.
  *   To satisfy the **Discrimination** and **Intrinsic Wrongness** constraints, you must adopt a deontological framework (rules based on meaning/dignity).
  *   To satisfy the **Historical Fallibility** and **Empirical Sensitivity** constraints, you must adopt a consequentialist framework (rules based on outcomes/evidence).
  *   To satisfy the **Third-Party Veto**, you must adopt a communitarian framework (rules based on social cohesion).
  *   To satisfy the **Liberty** baseline (implied in the permission of plasma/furniture), you must adopt a liberal framework (rules based on individual rights).

  The "repugnance" camp prioritizes Requirements 2, 3, and 5.
  The "market" camp prioritizes Requirements 4, 6, and Liberty.

  When they argue, they are essentially arguing over which requirements should be dropped from the specification. The market camp says Requirement 3 (Third-Party Veto) is a bug. The repugnance camp says Requirement 4 (Historical Fallibility) is an edge case that shouldn't drive the core logic.

  Your intuition is correct: there is no unified theory because the desiderata describe two different operating systems running on the same hardware. You cannot compile a moral theory that is simultaneously sensitive to empirical outcomes and blind to them, nor one that treats disgust as both a reliable signal and a historical error.
