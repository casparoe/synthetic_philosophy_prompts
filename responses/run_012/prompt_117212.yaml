answer: |-
  Step (5) fails because it conflates the pragmatic validation of an epistemic rule with the pragmatic formation of a factual belief, treating utility as insufficient evidence when for norms it is the only relevant evidence.

  The step looks compelling because it exploits a surface symmetry: if Clifford forbids believing *P* for practical reasons, he should forbid believing *Clifford's Principle* for practical reasons. This traps the evidentialist in a performative contradiction, suggesting that their very stance violates their own rule. However, this ignores the distinction between first-order beliefs (claims about the world) and second-order norms (policies for managing claims). Clifford's prohibition targets beliefs that aim at truth but are guided by desire; a norm aims at regulating belief-formation and is rightly judged by its success in doing so. To demand evidence for a rule independent of its utility is to category-mistake a tool for a fact. The evidence for a rule *is* its efficacy.

  The cost of this repair is that Clifford's principle loses its absolute, deontological status and becomes a hypothetical imperative: "If you wish to avoid error and find truth, you ought to proportion belief to evidence." It is no longer a moral law binding "in every time and place" regardless of consequence, but a strategic maxim justified by the very pragmatic outcomes step (4) identifies. This forces the evidentialist to admit that their authority derives from the good results of evidentialism, not from a priori duty.

  When tested against James's cases of self-fulfilling belief—such as trusting a friend or launching a venture—the repaired evidentialist faces a steep price. In these scenarios, the evidence for the proposition's truth is partially constituted by the act of believing it. If the evidentialist insists on prior evidence, they guarantee the failure of the venture or the coldness of the friendship, thereby violating the instrumental goal of their own rule (achieving truth/success). To hold the line, they must argue that the long-term risk of delusion outweighs the specific loss, but this is itself a pragmatic calculation. Consequently, in Jamesian cases, the evidentialist must concede that pragmatic grounds *do* constitute sufficient evidence, effectively granting James's point within those boundaries. The distinction between "evidence" and "pragmatic reason" collapses where belief creates the fact.

  A weaker version of the self-defeat argument survives this repair. While evidentialism is not logically self-refuting, it is pragmatically vulnerable. Because the rule is justified by its consequences, it must yield whenever following it produces worse consequences than breaking it. The burden shifts to the evidentialist to prove that evidentialism works better even in James's "live, forced, and momentous" options. They can no longer dismiss James's permissive norms as inherently immoral; they can only argue they are generally less effective. This leaves the door open for James to argue that in specific high-stakes, evidence-scarce contexts, the will to believe is not just permissible but required by the very goal of maximizing truth and vitality.
