      *   **Progressive Form:**
          *   Fact: We feel resentment.
          *   Condition: Same as above.
          *   Conclusion: Therefore, people *actually* have free choice (in reality).
      *   **The Objection ("Think vs. Be"):**
          *   Why it hits Progressive harder: Progressive claims to bridge the gap to reality. Regressive stays inside the head.
