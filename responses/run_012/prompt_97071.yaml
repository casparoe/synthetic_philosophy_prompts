      *   *Decision:* The **Betting** example is very clear on "future contingency," which is a classic metaphysical battleground. Let's use **"Planning a Picnic."** It implies the future is predictable and open.
      *   *Actually, let's go with **"Holding Someone Accountable"** (Resentment).* It's more visceral than betting. I will ensure I distinguish it from Strawson by focusing strictly on the logical structure requested, not the historical debate.
