answer: |-
  ### A Note on Your Framing

  Before we get to the questions, a plain word on your setup. You are not begging the question, but you are risking a category dispute. Your guest (a Cummins-style causal role theorist) does not deny that history matters for *evolutionary explanation*; she denies that history is necessary for *functional attribution*. When you ask, "Has that gland got the anti-parasite function yet?", she will hear, "Does the gland currently contribute to a capacity of the containing system?" and answer "Yes." You mean, "Is this trait here *because* it does this?" to which she answers "That's a different question."

  Your pressure point, therefore, is not truth, but *utility*. If her account calls every happy accident a 'function', does the term lose its power to distinguish what an organism is *designed* to do (by selection) from what it merely *can* do? The questions below are ordered to corner her on whether her 'relativity to analysis' is a philosophical freedom or a biological distortion.

  ### The Interview Table

  | # | Question | What it presses on | Anticipated Reply (Her Voice) | Follow-up (Your Move) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Let's start with the broken pump. On your view, function is a capacity a trait contributes to a system. If a heart is too damaged to pump, it lacks that capacity. Does it thereby cease to have the function of pumping, or is there a sense in which it is *failing* at its function? | **Malfunction / Normativity** | "I distinguish the *function* from the *performance*. The function is the disposition the trait *would* manifest in a system working to specification. A broken heart retains the function as a dispositional property, even if it cannot currently exercise it." | "But what fixes the 'specification'? If I analyse the system as 'a bag of fluids', the heart's function is mixing. If I analyse it as 'a circulatory engine', it's pumping. Who decides which specification is the correct one for the biology?" |
  | **2** | Precisely. In my lab, if a ciliary pump stopped moving water but started generating heat through friction, we wouldn't say its function was heating. We'd say it was broken. Your account seems to allow that heating is a function if we choose an analysis where heat is the output. Is functional attribution arbitrary? | **The 'Which Capacity?' Problem** | "Not arbitrary, but *relative*. Functions are always functions-relative-to-an-analytical-account. There is no 'God's eye' view of the organism. We pick the capacities that interest us in our explanatory project." | "With respect, when a physiologist asks for the function, she isn't asking what interests *her*. She's asking what the trait is *for* in the organism's economy. If your account makes that dependent on the observer's interest, haven't you moved the biology into the philosopher's head?" |
  | **3** | Let's take that into the field. I studied a slug population washed into a new estuary. They have a mucus gland selected for locomotion. In this new water, the mucus accidentally entangles parasites. It works perfectly. On your view, does the gland now have an anti-parasite function? | **Novel Traits / Exaptation** | "Relative to an analysis of the slug's defence system, yes. It is currently contributing a capacity that maintains the organism's integrity. It is a causal role that is currently being exploited." | "So, before the wash-out, it lacked this function. After the wash-out, it has it. But the trait's history hasn't changed, only its context. Are you saying function is not a property of the trait, but of the trait's environment?" |
  | **4** | And if that lineage survives ten thousand years, and selection *does* refine the gland for trapping? Does the function change then, or was it already there from day one of the new estuary? | **History vs. Current Utility** | "The *explanation* for why the trait is maintained changes. But the functional attribution—the causal role—remains stable so long as the capacity is contributed. Selection explains presence; function explains current contribution." | "This is where I struggle. Biologists distinguish 'adaptation' from 'exaptation' precisely to mark that difference. If you call both 'function', you lose the distinction between a trait being *maintained by* a benefit and a trait merely *conferring* a benefit. Why erase that line?" |
  | **5** | You mentioned 'explanatory projects'. If I'm trying to understand why the gland persists in the population, your causal role account tells me it helps with parasites. But if I'm wrong about history—if it's just an accident—that explanation is misleading. Doesn't the 'function' need to track the *reason* the trait is there? | **Explanatory Power** | "That is the Selected Effects view. I am offering an account of what functions *are*, not necessarily why traits are maintained. We can have causal roles without historical selection. Swampman has a heart that pumps, even if he has no history." | "Swampman is a thought experiment; I have real slugs. In real biology, we infer function to predict how a system will behave under stress. If I treat an accidental benefit as a function, I might predict the trait will be conserved. If it isn't selected, my prediction fails. Doesn't your account risk bad science?" |
  | **6** | You often say we can dissolve these worries by admitting functions are relative to the analysis we choose. But in my field, the analysis isn't up to me. The slug's nervous system dictates which capacities are integrated. Isn't there an objective fact about which capacities the organism 'cares' about? | **Objectivity of System Analysis** | "The organism doesn't 'care'. The researcher decomposes the system. We can decompose it by evolutionary history, or by current physiology. Both are valid projects. I am defending the legitimacy of the physiological project." | "But if the physiological project ignores history, it treats a lucky accident the same as a refined adaptation. If I'm designing a drug to target that gland, does it matter if the anti-parasite effect is a fragile accident or a robust adaptation? Your view suggests it doesn't." |
  | **7** | Let's press that. If the anti-parasite effect is just a causal role, it's on par with the gland's role in locomotion. But if the environment changes back, the locomotion role returns to being primary. Does your account handle this hierarchy, or are all causal roles equal? | **Functional Hierarchy** | "They aren't equal. Some capacities are more central to the system's persistence. But 'centrality' is still a matter of current system organisation, not necessarily past history." | "Centrality is often determined by *entrenchment*—how hard it is to lose the trait. That's a historical property. You're trying to ground centrality in current structure, but structure is just frozen history. Aren't you smuggling history in through the back door of 'system organisation'?" |
  | **8** | You've said before that Selected Effects theorists are asking a different question than you. But when I read a paper on 'renal function', they are talking about what the kidney does *and* why it's there. Are you suggesting biologists are confused when they conflate capacity and history? | **Conceptual Pluralism** | "I suggest they are often ambiguous. Sometimes they mean 'capacity', sometimes 'history'. My job is to disentangle these. When they speak of malfunction or design, they mean history. When they speak of mechanism, they mean capacity." | "If they are ambiguous, perhaps that's because the concepts are inseparable in practice. If I tell you a valve's function is to leak, because it currently is leaking, you'd say I'm mad. But on a pure capacity view, if leaking contributes to some pressure release, it's a function. Where does the 'madness' come from if not from violated historical expectations?" |
  | **9** | Returning to my slugs: if I publish a paper saying the gland's function is parasite defence, reviewers will ask for evidence of selection. If I say 'no, it's just a causal role', they'll reject it. Is your account of function compatible with the actual standards of biological publication, or is it a parallel philosophical language? | **Scientific Practice** | "It should inform how they write. If they mean causal role, they should say so. If they mean adaptation, they should provide phylogenetic evidence. My account encourages precision." | "But it feels like you're telling biologists they aren't allowed to use the word 'function' the way they always have unless they add a footnote. If a philosophical theory requires the scientists to change their language to avoid error, isn't the theory failing to capture the phenomenon?" |
  | **10** | Final question. I accept that causal roles are real. I just deny they exhaust what we mean by 'function'. If we adopt your view, do we gain enough clarity in our physiology to justify losing the normative bite that history gives us? Is the trade-off worth it? | **The Stakes / Trade-off** | "We gain the ability to attribute functions to novel traits, artefacts, and non-selected systems. We lose the automatic link to history. I argue the gain in generality outweighs the loss." | "In marine physiology, generality is less useful than accuracy. If I treat a trait as functional before selection has fixed it, I might misunderstand the organism's vulnerability. I'd argue the 'normative bite' isn't a philosophical luxury; it's a predictive necessity. Can your account accommodate that necessity without admitting history?" |

  ### Advice on Delivery

  *   **On Question 3 & 4 (The Slugs):** This is your strongest ground. She will try to say "It has the capacity, so it has the function." You must hold the line that *biological* function implies *stability*. A capacity that disappears if the water salinity shifts slightly isn't a function in the biological sense, even if it is a causal role. Press the difference between *doing* and *being for*.
  *   **On the "Relative to Analysis" Move:** She will use this repeatedly (see Q2, Q6). Do not let her treat "analysis" as a free choice. Remind her that the organism's physiology constrains the analysis. The slug *cannot* be analysed as a heat-generator because its system isn't organised to regulate heat. The "analysis" is discovered, not chosen.
  *   **Tone:** Keep it collegial. You are the empiricist checking the philosopher's maps against the territory. Use phrases like "In my experience..." or "From the bench..." to ground the abstract points.

  Good luck with the recording. It sounds like a proper debate.
