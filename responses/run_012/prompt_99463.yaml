      *   *Does it cut?* Yes, it highlights the difference between *capacity* and *proper function*. However, the user needs to be careful not to assume there is a single monolithic "Function" concept that both are fighting over. The CR theorist often argues they are analyzing *different concepts*. The follow-ups need to pin down whether the CR account captures what biologists *mean* when they talk about function in an explanatory context (e.g., why is the gland *maintained*?).
