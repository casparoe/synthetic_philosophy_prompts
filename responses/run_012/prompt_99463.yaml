      *   *Drafting Q4 (Analysis Relativity):* She will say "depends on the system analysis." Push: Does biology care about our analysis or the organism's?
      *   *Drafting Q5 (Slug Intro):* Introduce the mucus gland. Locomotion vs. Parasite trapping.
      *   *Drafting Q6 (Time/Selection):* 10,000 years later. Does the function status change without selection?
