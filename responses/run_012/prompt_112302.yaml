prompt: |-
  I run a small reliability lab — we do failure analysis and warranty math for a couple of hardware clients — and I keep banging into the same wall. Someone hands me a physical quantity we know almost nothing about, maybe just a range, maybe just some symmetry, and I have to slap a distribution on it to do the risk numbers. My gut always says "fine, it's equally likely to be anywhere in that range," which I know is the principle of indifference, and I also know it's a minefield, because of that old Bertrand chord business where you get three different answers depending on how you parametrize the random chord. Half my colleagues think indifference is naive hand-waving and half treat it as the obvious default, and neither reaction helps me at my desk on a Tuesday.

  What I want is a decision procedure I can actually run — ten minutes, no stats PhD in the room, on the back of a spec sheet. It should tell me, in order, the questions to ask about a quantity, and at each step what counts as a sufficient answer, so that I can decide (a) whether indifference is even the right tool here, and (b) if it is, which reference class or parametrization I'm allowed to fix, so that I'm not just smuggling a modeling assumption in and calling it a principle. I specifically don't want to be told "just use a noninformative prior like Jeffreys" and left there, because half the time I don't even know the model family yet, and I've noticed that the moment someone names a parameter they've already picked a reference class without saying so. When the procedure can't pin down an answer, I want it to say so plainly and tell me what I'd have to go collect or decide instead — I'd rather get a "you have to make a call and own it" than a fake number.

  Please write the procedure, with the hard cases it has to survive and the spots where judgment can't be eliminated marked as such. Then run it on four cases and don't spare my feelings if it kills the easy answer I was hoping for:

  1. The chord problem itself, in its three standard readings (random endpoints, random distance from center, random midpoint), so I can see the procedure detect the disagreement rather than paper over it.
  2. A resistor spec'd only as "somewhere between 100 and 200 ohms," where I can parametrize in resistance or in conductance and they don't agree.
  3. A cube where the client gives me a uniform range on the side length and wants the distribution of the volume.
  4. A case of your choosing where the honest verdict is that indifference doesn't apply and I need to go get data or just pick a reference class and defend it — bonus points if it's a case where the client will hate that answer.

  Give me the writeup as prose, then finish with a structured summary as a JSON object so I can drop it in our notes. Schema: an object with a field "cases" (an array), where each element has "case_name", "quantity", "candidate_reference_classes" (list), "indifference_applies" (one of yes / no / only_if), "chosen_reference_class", "resulting_distribution", "what_would_change_the_answer", and "residual_judgment_call" (a short phrase or one line, or null). Plus a top-level field "procedure_limits" with one or two sentences on what the whole procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small reliability lab (failure analysis, warranty math).
      *   **Problem:** Needs to assign distributions to physical quantities with little information (often just ranges). Struggles with the Principle of Indifference (PoI) and its paradoxes (Bertrand's Chord). Colleagues are split (naive vs. default).
      *   **Goal:** A practical decision procedure (10 mins, back of a spec sheet) to decide *if* PoI applies and *which* parametrization to use.
      *   **Constraints:** No "just use Jeffreys" without explanation. Must admit when judgment is needed. Must handle hard cases.
      *   **Deliverables:**
          1.  Prose writeup of the procedure.
          2.  Application of the procedure to four specific cases (Chord, Resistor, Cube, Client-Hated Case).
          3.  JSON summary with specific schema.
      *   **Tone:** Professional, direct, no fluff, acknowledging the messiness of engineering stats.

  2.  **Deconstruct the Core Problem (Principle of Indifference & Parametrization):**
      *   The PoI states that if there are $N$ mutually exclusive, exhaustive, and *indistinguishable* possibilities, assign probability $1/N$ to each.
      *   The problem arises with continuous variables. "Indistinguishable" depends on the metric (linear vs. log vs. inverse).
      *   Jaynes' Maximum Entropy (MaxEnt) is the modern formalization, but the user wants a "10-minute back-of-envelope" procedure, not a derivation.
      *   Key insight: Indifference is only valid if there is a *symmetry* in the physical generation process or a *scale invariance* requirement. If the physical mechanism suggests a specific scale or bound, PoI is dangerous.
      *   The procedure needs to force the engineer to identify the *physical mechanism* or the *invariance group* before slapping on a Uniform($a, b$).

  3.  **Drafting the Decision Procedure:**
      *   *Step 1: Identify the Physical Generation Mechanism.* How is this number created? (Manufacturing tolerance? Natural variation? Measurement error?)
      *   *Step 2: Check for Scale/Location Invariance.* Does the problem change if I change units (cm to m) or shift the zero point? If yes, Uniform is likely wrong.
      *   *Step 3: Identify the Measurable.* What is actually being controlled or measured directly? (e.g., Is the factory setting resistance or conductance? Is the chord defined by endpoints or distance?)
      *   *Step 4: The "Reparametrization Test".* If I transform $X \to Y = f(X)$, does "Uniform on $X$" imply "Uniform on $Y$"? If not, which one makes physical sense?
      *   *Step 5: The Verdict.* Yes (Uniform), No (Need Data/Model), or Only If (Specify the invariant measure).

  4.  **Developing the Four Cases:**

      *   **Case 1: Bertrand's Chord.**
          *   *Goal:* Show the procedure flags the ambiguity.
          *   *Analysis:* The "randomness" isn't defined physically.
          *   *Verdict:* Indifference fails because the generation mechanism is undefined. The procedure must stop and say "Define the throw."

      *   **Case 2: Resistor (100-200 Ohms).**
          *   *Goal:* Resistance ($R$) vs. Conductance ($G = 1/R$).
          *   *Analysis:* Manufacturing usually controls geometry/material resistivity. Trimming processes often act on $R$. However, physics is often scale-invariant.
          *   *Verdict:* "Only If". If it's a binning process, Uniform($R$). If it's a physical tolerance on geometry, maybe Log-Uniform (Jeffreys). The procedure should highlight that $R$ is the engineering spec, so Uniform($R$) is the *contractual* choice, even if physically debatable.

      *   **Case 3: Cube Volume.**
          *   *Goal:* Side length ($L$) vs. Volume ($V = L^3$).
          *   *Analysis:* Client gives Uniform($L$).
          *   *Verdict:* Indifference applies to $L$ (given). Do *not* apply indifference to $V$. The procedure must enforce the client's constraint on the *controlled* variable.
          *   *Result:* Distribution of $V$ is derived, not assumed uniform.

      *   **Case 4: Client-Hated Case (Time to Failure / MTBF).**
          *   *Goal:* Show where PoI is dangerous.
          *   *Scenario:* "It will fail between 1 year and 10 years."
          *   *Analysis:* Time is strictly positive. Scale matters. Uniform(1, 10) implies high density near 1 year compared to Log-Uniform.
          *   *Verdict:* No. Time-to-failure is usually Exponential or Weibull. Uniform is physically unjustified for reliability. Client hates hearing "we need burn-in data."

  5.  **Refining the Procedure (Self-Correction/Polishing):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Use engineering language ("spec sheet," "tolerance stack," "binning").
      *   *Critique:* Does it solve the Bertrand paradox?
      *   *Fix:* Explicitly state that without a physical selection mechanism, PoI is invalid.
      *   *Critique:* Jeffreys prior mention?
      *   *Fix:* Mention it as the "Scale Invariant" option in Step 4, but keep the focus on physical justification.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the pain point.
      *   *The Procedure:* 5 Steps. Focus on "What is being randomized?"
      *   *The Cases:* Run the steps rigorously.
      *   *Case 1:* Highlight that "Random Chord" is ill-posed.
      *   *Case 2:* Highlight the $R$ vs $1/R$ conflict. Default to $R$ because it's the spec, but flag the risk.
      *   *Case 3:* Highlight that $L$ is the input, $V$ is the output. Don't randomize $V$.
      *   *Case 4:* Time-to-failure. Uniform is terrible here. Need Weibull/Exponential.

  7.  **Constructing the JSON:**
      *   Ensure schema compliance.
      *   Check fields: `case_name`, `quantity`, `candidate_reference_classes`, `indifference_applies`, `chosen_reference_class`, `resulting_distribution`, `what_would_change_the_answer`, `residual_judgment_call`.
      *   Top-level `procedure_limits`.

  8.  **Final Review against Constraints:**
      *   "Ten minutes, no stats PhD": Keep steps actionable.
      *   "Don't spare my feelings": Be blunt in Case 4.
      *   "JSON schema": Strict adherence.
      *   "Prose first": Ensure the explanation leads into the examples.

  9.  **Final Polish:** Check tone. It needs to be empathetic to the engineer's plight but rigorous about the math. (Self-correction: Ensure the distinction between "Epistemic Uncertainty" and "Aleatory Uncertainty" is implied but not jargon-heavy).

  *(Self-Correction during drafting Case 2)*: Wait, if I say Uniform(R), I must acknowledge that Uniform(G) is different. The procedure should force a choice based on *manufacturing control*. If the machine trims length to get Resistance, R is the control variable. If it's a "bag of resistors" with unknown origin, Log-Uniform is safer. I will advise Uniform(R) *only* because it matches the spec sheet language, but mark it as a judgment call.

  *(Self-Correction during drafting Case 4)*: Make sure the "Client Hated" aspect is clear. Clients love simple ranges. They hate "we need a shape parameter."

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # The "Back-of-Spec-Sheet" Indifference Procedure

  You are right to be worried. The Principle of Indifference (PoI) is not a law of physics; it is a statement about your state of knowledge relative to a specific description of the world. When you change the description (parametrization), you change the state of knowledge unless the physics dictates an invariance.

  The following procedure is designed to stop you from assigning a Uniform distribution simply because you lack data. It forces you to identify *what* is actually being randomized by the physical process. If you cannot identify the physical mechanism, the procedure forces you to admit that the risk number is a guess, not a calculation.

  ### The 5-Step Decision Procedure

  **Step 1: Identify the "Knob" (The Physical Generator)**
  Ask: *What physical process or measurement produced this number?*
  *   **Sufficient Answer:** "A machine trimmed the length," "A binning test sorted these," "A human estimated it," or "Unknown."
  *   **Fail State:** If the answer is "Unknown" or "It just is," proceed to Step 5 (Verdict: No Indifference). You cannot assume symmetry without a symmetric generator.

  **Step 2: Identify the Controlled Variable**
  Ask: *Which quantity was directly constrained or measured to establish the range?*
  *   **Sufficient Answer:** "The spec says 100–200 Ohms," "The caliper measured side length," "The test stopped at failure time."
  *   **Fail State:** If the range is derived (e.g., "Volume is between 1 and 8" because someone guessed the volume, not the side), do not apply indifference to the derived quantity. Apply it to the source, or don't apply it at all.

  **Step 3: The Unit/Scale Test**
  Ask: *If I change units (cm to m) or scale (R to 1/R), does the physical mechanism change?*
  *   **Sufficient Answer:** "No, a 10% tolerance is a 10% tolerance regardless of units" (implies Log-Uniform/Jeffreys). OR "Yes, the machine stops at a specific voltage drop" (implies Linear-Uniform).
  *   **Fail State:** If the physics suggests scale invariance (e.g., particle energies, financial returns, time-to-failure) but you use Linear-Uniform, you are smuggling an assumption that small values are as likely as large values in absolute terms.

  **Step 4: The Reparametrization Check**
  Ask: *If I assume Uniform($X$), what does that imply for $Y = f(X)$?*
  *   **Action:** Quickly check if Uniform($X$) implies a physically impossible density for $Y$.
  *   **Example:** If $X$ is side length (Uniform), Volume ($X^3$) piles up near zero. Is that physical? If $X$ is Time-to-Failure (Uniform), Hazard Rate increases. Is that physical?
  *   **Decision:** If the implied density for the derived quantity contradicts known physics, reject Uniform($X$).

  **Step 5: The Verdict**
  *   **Yes:** Physical mechanism is symmetric, variable is directly controlled, scale is fixed by mechanism. (Use Uniform).
  *   **Only If:** You must explicitly state which parametrization matches the control mechanism. (Use Uniform on *that* parameter only).
  *   **No:** Mechanism unknown, scale invariant, or derived quantity. (Do not use Uniform. Use Log-Uniform, Exponential, or collect data).

  ---

  # Running the Procedure on Four Cases

  ### Case 1: Bertrand's Chord (The Paradox)
  **Context:** A chord is drawn on a circle. What is the probability it is longer than the side of an inscribed equilateral triangle?
  **Step 1 (Knob):** How is the chord selected?
  *   *Reading A:* Random endpoints on circumference.
  *   *Reading B:* Random distance from center (uniform along radius).
  *   *Reading C:* Random midpoint (uniform inside area).
  **Step 2 (Controlled):** There is no physical mechanism. It is a mathematical abstraction.
  **Step 3 (Scale):** Rotationally invariant, but translation invariant only in specific parametrizations.
  **Step 4 (Reparam):** Uniform on endpoints $\neq$ Uniform on distance $\neq$ Uniform on area.
  **Step 5 (Verdict):** **No.**
  **Analysis:** The procedure kills the "easy" answer immediately. There is no "Knob." Without a physical description of *how* the chord is thrown (e.g., "straws tossed on a disk" vs. "pivot arm rotating"), indifference is invalid. You cannot calculate a risk number here without defining the experimental apparatus. The disagreement isn't a math error; it's a missing spec.

  ### Case 2: The Resistor (100–200 Ohms)
  **Context:** A component is binned as "100 to 200 Ohms." No other data.
  **Step 1 (Knob):** Manufacturing binning or tolerance stack.
  **Step 2 (Controlled):** The spec sheet defines Resistance ($R$). The test equipment measures Voltage/Current to derive $R$.
  **Step 3 (Scale):** Resistance is not scale-invariant physically (geometry dependent), but conductance ($G=1/R$) is the reciprocal.
  **Step 4 (Reparam):** If Uniform($R$), then Density($G$) $\propto 1/G^2$. If Uniform($G$), Density($R$) $\propto 1/R^2$.
  **Step 5 (Verdict):** **Only If.**
  **Analysis:** You must choose the reference class that matches the *sorting mechanism*. If the factory tests $R$ and bins based on $R$ thresholds, Uniform($R$) is the contractual reality, even if physics might argue for Log-Uniform. However, you must flag that if the underlying variation is geometric (length/area), Log-Uniform is physically more honest.
  **Decision:** Use Uniform($R$) because that is the *spec*, but note that this assumes the sorting process, not the physics, drives the distribution.

  ### Case 3: The Cube Volume
  **Context:** Client says "Side length $L$ is Uniform(1, 2) meters." Wants risk on Volume $V$.
  **Step 1 (Knob):** Cutting process controls length.
  **Step 2 (Controlled):** Side length $L$ is the direct control. Volume is derived.
  **Step 3 (Scale):** Length is linear.
  **Step 4 (Reparam):** If $L \sim U(1,2)$, then $V = L^3$ has PDF $f(v) \propto v^{-2/3}$. It is *not* Uniform.
  **Step 5 (Verdict):** **Yes (for L), No (for V).**
  **Analysis:** This is a trap. Do not apply indifference to Volume. The client gave you the distribution on the *input* variable ($L$). Your job is propagation, not new assumptions. If you assume Uniform($V$), you contradict the client's spec on $L$. The procedure forces you to respect the causal chain: $L \to V$.

  ### Case 4: Time-to-Failure (The Client-Hated Case)
  **Context:** Client says, "We expect this pump to fail somewhere between 1,000 and 10,000 hours. Just model it as Uniform."
  **Step 1 (Knob):** Wear-out process (fatigue, corrosion, bearing wear).
  **Step 2 (Controlled):** Time is the observation, not a controlled setting.
  **Step 3 (Scale):** Time-to-failure is strictly positive and usually scale-invariant in early life (Exponential) or wear-out (Weibull). A Uniform distribution implies a constant density of failure between 1k and 10k, and *zero* outside.
  **Step 4 (Reparam):** Uniform($T$) implies the Hazard Rate $h(t) = f(t)/S(t)$ increases hyperbolically as $t$ approaches 10,000. It says "It definitely won't fail at 10,001," which is physically false for mechanical wear.
  **Step 5 (Verdict):** **No.**
  **Analysis:** This is where you must tell the client they are wrong. Uniform implies a hard cutoff (10,001 hours is impossible) and a rising hazard rate that doesn't match physics.
  **Required Action:** You cannot run the risk math yet. You must tell the client: "I need to know the failure mode. Is it infant mortality (Exponential) or wear-out (Weibull)? If you force Uniform, I have to assume a hard cliff at 10k hours which will underestimate tail risk." You must choose a reference class (e.g., Weibull shape parameter) or get field data. Indifference is dangerous here.

  ---

  # Summary of Limits

  This procedure cannot manufacture information. If the physical generation mechanism is unknown (Case 1) or if the client insists on a physically impossible distribution (Case 4), the procedure will return "No" or "Only If." It forces you to document *why* a distribution was chosen, shifting the liability from your calculation to their assumption. It cannot resolve epistemic uncertainty without a defined reference class.

