answer: |-
  You have put your finger on one of Bentham's most sophisticated insights, one that anticipates modern debates in law and economics by two centuries. You are right that existing terms like "secondary deviance" or "adaptive preferences" miss the specific *justificatory* circularity you are describing. They describe the *effect* on the actor or the preference holder, but not the *illegitimacy of the input* in the moral calculus.

  In welfare economics and legal theory, the broad category is **Endogenous Preferences** (preferences shaped by the rules they are supposed to evaluate). However, that term is descriptive, not critical. It doesn't capture the *fallacy* of using those preferences to justify the rule.

  Since there is no single canonical term for this specific *shape* of argument—the laundering of a law-created sentiment into a law-justifying reason—I propose we call it **Sentiment Bootstrapping**.

  Here is the carving you asked for: the definition, the boundaries, and the diagnostic tests.

  ### 1. The Term: Sentiment Bootstrapping

  **Definition:** Sentiment Bootstrapping occurs when a legal prohibition generates the very social aversion (disgust, outrage, fear) that is subsequently cited as the independent moral or utilitarian ground for maintaining that prohibition.

  **The Shape:**
  1.  **Intervention:** The state bans Act $X$.
  2.  **Mechanism:** The ban signals that $X$ is deviant/dangerous; socialization and stigma amplify aversion to $X$.
  3.  **Justification:** Legislators/Courts point to the public's aversion to $X$ as evidence that $X$ is harmful/offensive.
  4.  **Result:** The law justifies itself using a sentiment it manufactured.

  **Why "Bootstrapping"?**
  It invokes the image of "pulling oneself up by one's bootstraps"—an impossible physical feat. The law attempts to lift its own justificatory weight using a rope (public sentiment) that is attached to the law itself. If you remove the law, the rope disappears, and the lift collapses.

  ### 2. The Carving: What It Is Not

  To get the edges right, we must distinguish Sentiment Bootstrapping from its neighbors.

  **A. It is not a "Secondary Harm" of Prohibition.**
  *   *Secondary Harm:* If banning sodomy creates a black market, leads to blackmail, or overcrowds prisons, these are real utilitarian costs. They are independent negative utilities generated by the *enforcement* of the law.
  *   *Bootstrapping:* The disgust itself is not a cost to be weighed; it is an **invalidated input**. In a rigorous utilitarian calculus, you cannot count a preference/aversion as a "cost" if the existence of that aversion is causally dependent on the rule being evaluated. It rigs the sum.
  *   *The Edge:* Secondary harms are counted *against* the law. Bootstrapped sentiment is falsely counted *for* the law.

  **B. It is not the "Expressive Function of Law."**
  *   *Expressive Function:* Law reflects and reinforces pre-existing community values (e.g., banning murder reinforces the value of life).
  *   *Bootstrapping:* The value *did not exist* (or was not salient) prior to the law. The law is not reinforcing a sentiment; it is *fabricating* it to secure its own survival.
  *   *The Edge:* Expressive law assumes exogenous values. Bootstrapping reveals endogenous values masquerading as exogenous.

  **C. It is not "Adaptive Preferences" (Elster/Sunstein).**
  *   *Adaptive Preferences:* Individuals lower their aspirations to match their constrained options (e.g., the fox and the sour grapes).
  *   *Bootstrapping:* This is collective, not individual, and specifically concerns *moral sentiment* used for *policy justification*. It is not just that people learn to like what they get; it is that they learn to hate what is forbidden, and then demand the prohibition continue because of that hate.

  **D. It is not the "Offense Principle" (Feinberg).**
  *   *Offense Principle:* The state may prohibit acts that cause profound offense to others.
  *   *Bootstrapping:* Bentham's point is that the "offense" is not a natural reaction to the act, but a conditioned reaction to the *illegality*. If the offense is manufactured by the law, it cannot trigger the Offense Principle legitimately.

  ### 3. Diagnostic Tests: How to Tell the Difference

  In a concrete case, how do you distinguish **Manufactured Disgust** (Bootstrapping) from **Pre-existing Disgust** (Independent Harm)? Bentham suggests we look for the causal arrow. Here are three operational tests:

  **A. The Counterfactual Repeal Test**
  *   *Method:* Imagine (or observe) a jurisdiction where the law is repealed.
  *   *Indicator:* If the public horror evaporates or significantly diminishes within a generation of decriminalization, the disgust was bootstrapped. If the horror persists despite legal neutrality, it may be rooted in independent psychological or cultural factors.
  *   *Example:* After the decriminalization of homosexuality in many Western nations, the "public outrage" metric dropped precipitously, suggesting the outrage was largely a function of the legal status.

  **B. The Cross-Jurisdictional Variance Test**
  *   *Method:* Compare societies with similar cultural baselines but different legal histories regarding the act.
  *   *Indicator:* If Society A bans Act $X$ and reports 90% disgust, while Society B never banned Act $X$ and reports 10% disgust, the disgust in Society A is likely bootstrapped.
  *   *Example:* Bentham noted that in some historical periods and cultures, same-sex relations were not legally banned and did not provoke the same "universal" horror claimed by English lawmakers.

  **C. The Proportionality of Harm Test**
  *   *Method:* Compare the intensity of the sentiment against the tangible harm of the act.
  *   *Indicator:* If the visceral disgust is vastly disproportionate to any demonstrable secular harm (pain, loss of property, physical injury), it suggests the sentiment is being artificially inflated by the taboo status of the act.
  *   *Example:* If eating pork causes no health issues in a specific context, but the "disgust" is treated as equivalent to poisoning someone, the disgust is likely a product of religious/legal taboo, not natural aversion.

  ### 4. Why the Label Matters for Utilitarianism

  You noted that Bentham is after something stronger than "punishment has side effects." You are correct.

  If the disgust is a **Secondary Harm**, the Utilitarian calculation is:
  $$ \text{Pleasure of Act} - \text{Pain of Punishment} - \text{Social Disgust} $$
  If the result is negative, ban it.

  If the disgust is **Sentiment Bootstrapping**, the Utilitarian calculation must be:
  $$ \text{Pleasure of Act} - \text{Pain of Punishment} $$
  *(The Social Disgust term is zeroed out because it is endogenous to the ban.)*

  By naming **Sentiment Bootstrapping**, we prevent the law from double-counting its own existence. It stops the law from saying, "I must exist because people hate me," when the people only hate it *because* it exists.

  Bentham's insight is that **prejudice is often a fictitious entity created by the very laws that claim to be restraining it.** Calling it Sentiment Bootstrapping preserves the critical force of that observation: it identifies the justification as a logical impossibility, not just a heavy cost.
