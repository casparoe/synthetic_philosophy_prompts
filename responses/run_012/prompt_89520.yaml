answer: |-
  Here is the translation layer you asked for. I've mapped the three ontological readings of probability directly onto your forecasting stack, followed by the residue report and the specific deep-dives you requested.

  ### The Translation Layer

  #### 1. Frequentism: The Asymptotic Backtest
  In your vocabulary, the Frequentist reading of probability is **the limit of a metric on an infinite, i.i.d. holdout set.**

  *   **The Mapping:** When a Frequentist says $P(E) = p$, they are making a claim about the Data Generating Process (DGP). In your terms, this is the assertion that if you were to deploy your model and run a backtest over an infinite sequence of future data points drawn from the same stationary distribution, the relative frequency of event $E$ would converge to $p$.
  *   **The Role of the Model:** The model is a tool to estimate this limiting frequency. A 95% confidence interval isn't a statement about where the parameter lies in this specific run; it's a statement about the *procedure*. It means that if you retrained your model on infinite bootstrap samples of the training distribution, 95% of the resulting intervals would capture the true parameter (the limiting frequency).
  *   **Key DS Equivalent:** Calibration curves on a test set. If your model outputs 0.7 for a binary event, the Frequentist meaning is strictly: "In the long-run backtest, the label is 1 in 70% of these cases." If the single case doesn't belong to a repeatable class (no test set possible), the probability is undefined.

  #### 2. Bayesianism (Personalist): The Calibrated Predictive Distribution
  In your vocabulary, the Personalist reading is **the parameterization of your predictive distribution that maximizes coherence under a proper scoring rule.**

  *   **The Mapping:** When a Bayesian says $P(E) = p$, they are describing their current information state. In your terms, this is the density value your predictive distribution assigns to $E$ given your training data and priors. It is not a claim about the world's frequency; it is a claim about your model's betting odds.
  *   **The Role of the Model:** The model *is* the probability. The prior is your regularization strategy (encoding belief before seeing data); the posterior is the updated model weights.
  *   **Key DS Equivalent:** Proper scoring rules (Log Loss, Brier Score). Coherence (Dutch Book arguments) translates to **calibration**. If you say 80% confidence intervals, and only 60% of test points fall inside them over a backtest, you are "incoherent" (leaving money on the table). The probability is valid if and only if it minimizes expected loss given your current knowledge state.

  #### 3. Propensity: The Irreducible Aleatoric Error
  In your vocabulary, the Propensity reading is **the Bayes Error Rate inherent to the feature set.**

  *   **The Mapping:** When a Propensivist says $P(E) = p$, they claim the physical setup has a disposition to produce $E$. In your terms, this is the assumption that there is a true conditional distribution $P(Y|X)$ fixed by nature, and the variance in $Y$ that remains even with a perfect model is not ignorance, but physical noise.
  *   **The Role of the Model:** The model attempts to approximate the physical disposition. The residual $\epsilon$ in $Y = f(X) + \epsilon$ is not just "unobserved features"; it is the *propensity* of the system to fluctuate.
  *   **Key DS Equivalent:** Aleatoric uncertainty. When you model heteroscedasticity (predicting both $\mu$ and $\sigma$), you are explicitly modeling propensity. You are asserting that for a specific input $x$, the world *itself* samples from a distribution, not just your knowledge of it.

  ---

  ### The Residue Report

  Here is what survives the translation, what gets distorted, and what vanishes.

  #### 1. What Comes Through Cleanly
  *   **Bayesian $\leftrightarrow$ Predictive Workflow:** This is a near-perfect isomorphism. Your "predictive distribution" is exactly the personalist "degree of belief." Your use of proper scoring rules to evaluate forecasts is the operationalization of "coherence." The only friction is that data scientists often use "Bayesian" methods (like MCMC or Variational Inference) for computational regularization rather than true belief updating, but structurally, it maps 1:1.
  *   **Frequentist $\leftrightarrow$ Evaluation/Calibration:** The Frequentist constraint that probability requires a sequence maps cleanly to your distinction between *training* (fitting) and *backtesting* (validating). A probability without a test set is, to a Frequentist, code without a unit test.

  #### 2. What Requires Distortion
  *   **The Reference Class Problem $\leftrightarrow$ Feature Selection:** (See deep dive below). This maps, but it distorts the *normative* force. In philosophy, there is a "correct" reference class. In DS, there is only a "performant" feature set.
  *   **Priors $\leftrightarrow$ Regularization:** Personalists view priors as genuine prior knowledge. In your trade, a Gaussian prior is often just L2 regularization to prevent overfitting. You get the math, but you strip the epistemology.

  #### 3. What Has No Counterpart (The Void)
  *   **Ontological Commitment:** Your vocabulary is instrumentalist. You care if the forecast is *useful* (low loss, good calibration). The philosophers care if the probability is *true* (does it match reality's structure?). There is no variable in your loss function for "truth," only for "error."
  *   **Single-Case Ontology:** You can output a predictive density for a single event (tomorrow's price). But you cannot validate it except by waiting for more data (turning it into a sequence). Your vocabulary has no way to certify a single-case probability *as* a single-case probability. It always collapses into a backtest eventually.

  ---

  ### Deep Dives on Your Specific Questions

  #### 1. Is the single-case vs. long-run distinction anything more than predictive distribution vs. backtest?
  **Yes, but it's a distinction in *validity conditions*, not just outputs.**

  In your workflow, you generate a **predictive distribution** for a single case (e.g., $P(Y_{t+1} | X_t)$). You then validate this using a **backtest** (long-run performance).
  *   **The Bayesian View:** The predictive distribution *is* the probability. The backtest is just a check on your calibration. If the backtest fails, your beliefs were wrong, but the single-case probability was still a valid expression of your state at time $t$.
  *   **The Frequentist View:** The predictive distribution is meaningless fiction without the backtest. The probability *is* the long-run frequency. If you cannot construct a reference class (a test set) for the single case, you cannot assign a probability.

  **The Residue:** The philosophical fight is about whether the single-case object *exists* before the long-run validation. In your trade, you act like a Bayesian (outputting single-case densities) but get paid like a Frequentist (evaluated on long-run backtests). The tension you feel when a model is "well-calibrated" but fails on a specific critical instance is exactly the single-case/long-run friction.

  #### 2. Does the reference class problem turn into anything interesting, or is it just feature selection?
  **It turns into the Causal Inference / Distribution Shift problem.**

  The philosophical Reference Class Problem asks: "What is the probability this specific person (John, 45, smoker) dies in 5 years? Is it the rate for 'humans', 'men', 'smokers', or '45-year-old male smokers'?"
  *   **DS Translation:** This is **conditioning**. $P(Y | X)$. Do you condition on $X_1$ (age), $X_2$ (smoking), or $X_1, X_2$?
  *   **Why it's not a dodge:** In ML, we choose the feature set that minimizes validation loss. But if the training distribution differs from the test distribution (covariate shift), your "optimal" feature set might fail.
  *   **The Deep Cut:** The philosophical worry is that there is no *objective* way to choose the class without circularity. In DS, this resurfaces as **causal feature selection**. If you select features based on correlation alone, you might pick a "reference class" that works in training but breaks under intervention. The Reference Class Problem is the ancestor of your struggle with **out-of-distribution (OOD) generalization**. It asks: "Which features define the *stable* mechanism, and which are just spurious correlations in this specific dataset?"

  #### 3. Does propensity survive the translation, or is it a fact about my model class?
  **It collapses into "Aleatoric Uncertainty defined by Model Scope."**

  Propensity claims probability is a physical disposition of the *setup*.
  *   **The DS Reality:** You model propensity as the noise term $\epsilon$. But if you add a new feature (e.g., "wind speed" to a coin flip model), your $\epsilon$ shrinks.
  *   **The Collapse:** If probability were a true physical propensity, adding information shouldn't change the chance of the coin landing heads (it's 0.5 regardless of what you know). But in your models, "probability" is always $P(Y | X)$. Change $X$, change $P$.
  *   **Verdict:** Propensity does not survive cleanly. It turns into **Irreducible Error**. But since you can never know if error is truly irreducible or just due to missing features, you cannot distinguish Propensity from Epistemic Uncertainty (ignorance) empirically. You treat Propensity as a modeling assumption (e.g., "I assume this is Poisson noise"), not a discovered fact. It becomes a hyperparameter of your likelihood function, not a property of the world.

  ---

  ### Final Verdict: Hole in Vocabulary or Philosophical Noise?

  **It is a hole in your vocabulary, but a feature of your trade.**

  The missing residue is **Realism**.
  Philosophers argue about what probability *is* (ontology). You argue about what probability *does* (instrumentalism).
  *   The Frequentist/Bayesian/Propensity debates are attempts to ground probability in *truth* (frequency, belief, or physical chance).
  *   Your vocabulary grounds probability in *utility* (loss functions, calibration, predictive power).

  **Is this a problem?**
  For building forecasting models? **No.** Your instrumentalism is a strength. You don't need to know if the chance is "physical" or "belief" to minimize Log Loss. If the model is calibrated and sharp, it works.

  **Where does it bite you?**
  It bites you in **Distribution Shift** and **Causal Decision Making**.
  When the test distribution shifts, your "Bayesian" probabilities (which were just patterns in training data) break. Your "Frequentist" backtests become invalid. Your "Propensity" (aleatoric noise) suddenly looks like signal.
  Because your vocabulary lacks an ontological commitment to *why* the probabilities hold (mechanism vs. correlation), you have no theoretical way to distinguish a robust probability from a spurious one without new data.

  **Conclusion:** The philosophers are disagreeing about less than they think *if* the goal is prediction. All three interpretations converge on the same math when the model is perfect and the data is infinite. But the disagreement is real and critical when data is scarce or the environment is non-stationary. Your vocabulary treats these interpretations as interchangeable tools. That's efficient, but it leaves you blind when the tools stop working and you need to know *which part of the map corresponds to the territory.* You have a map of the terrain (the model), but no vocabulary for the ground beneath it (the DGP ontology). That is the hole.
