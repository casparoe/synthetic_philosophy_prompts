answer: |-
  # Which Theory of Historical Periods Do You Actually Hold?

  History books are full of names: the Middle Ages, the Renaissance, the Enlightenment. But where do these periods come from? Are they real chunks of time, like geological eras, or are they stories we tell to make sense of the past?

  This quiz uses eight concrete cases to help you find out. There are no right answers. For each question, choose the option that best matches your instinct. Keep track of the **symbol** next to your choice. At the end, count your symbols to reveal your theory.

  ### 1. The Year 1500
  A historian argues that nothing significant changed between December 31, 1499, and January 1, 1501. How do you view the boundary line drawn at 1500?
  *   **★** The line marks a genuine shift in how people lived; the world on one side is fundamentally different from the world on the other.
  *   **●** The line is arbitrary, but it is a convenient coordinate that helps us file information and find books in the library.
  *   **✚** The changes were real and gradual, but the decision to draw a sharp line at this specific date is ours to make.

  ### 2. The Straddling Life
  Consider an artist born in 1450 who died in 1520. Their early work looks medieval; their late work looks modern. How should we classify them?
  *   **★** They are a transitional figure, but they belong to the period that defines their mature work.
  *   **■** It depends on what you are studying; for art history they are Renaissance, for social history they might still be Medieval.
  *   **▲** Labels like "Medieval" confuse us; we should just say they lived from 1450 to 1520 and describe what they did.

  ### 3. The Museum Gallery
  A local museum renames its "Medieval Room" to "Late Gothic Europe" after a consultant suggests the old term is misleading. What happened here?
  *   **●** They updated the signage to match current professional standards, like updating a map.
  *   **◆** They changed the label because the old one carried negative judgments about "darkness" that they no longer wish to endorse.
  *   **✚** They acknowledged that the objects are real, but the old room name imposed a false unity on them.

  ### 4. The Global Map
  A textbook applies the term "Renaissance" to a period of Japanese history in the 17th century. Is this correct?
  *   **★** No, the Renaissance was a specific European event; using it elsewhere stretches the truth until it breaks.
  *   **■** Yes, if it helps students compare similar cultural blooms, even if the causes were different.
  *   **◆** No, because it implies Japan was waiting for a European-style rebirth rather than following its own path.

  ### 5. The "Dark" Ages
  Some historians want to ban the term "Dark Ages" entirely. What is the strongest reason to keep or drop it?
  *   **◆** Drop it: The term is an insult invented by later snobs to praise themselves by insulting the past.
  *   **▲** Drop it: There was no significant decline in quality of life, so the term describes nothing that happened.
  *   **●** Keep it: It is a useful shorthand for a period where written records are scarce, regardless of the mood.

  ### 6. The Scientific Revolution
  We speak of a "Scientific Revolution" in the 1600s. What makes this a revolution?
  *   **✚** A cluster of real discoveries happened, but calling it a "revolution" is a way of packaging those events for a reader.
  *   **★** The method of inquiry changed so radically that it created a new kind of world, deserving a new name.
  *   **■** It is a revolution only if you are looking at the history of physics; from the perspective of religion, nothing much changed.

  ### 7. The Future Historian
  Imagine a historian writing in the year 3000 about our current time. Will they use the same period labels we do?
  *   **●** They might use different dates, but they will need similar categories to organize the sheer volume of events.
  *   **▲** They probably won't use our labels at all; they will likely look back and see one long continuous flow of industrial change.
  *   **✚** They will see the same major shifts we do, but they will draw the boundaries in different places based on what matters to them.

  ### 8. Dropping the Terms
  Suppose we abolished all period names (Middle Ages, Modern, etc.) and used only dates. What would we lose?
  *   **■** We would lose the ability to tell different kinds of stories; some narratives need these chapters to make sense.
  *   **◆** We would lose the ability to see how past generations judged themselves, because these terms are part of that history too.
  *   **▲** We would lose nothing but confusion; dates are precise, while period names are always arguable.

  ***

  ### Scoring Key

  Count how many times you selected each symbol. Your highest score indicates your dominant view. If you have a tie, you hold a hybrid view (see note below).

  **Mostly ★: The Realist**
  *   **Plain English:** You believe periods are real joints in history, discovered rather than invented, and the familiar schemes are roughly right.
  *   **The Awkward Commitment:** You must defend the idea that a specific year (like 1500) marks a genuine break in reality, even for people who didn't notice it happening.

  **Mostly ●: The Instrumentalist**
  *   **Plain English:** You believe periods are useful tools or coordinates, true only in a derivative sense, to be kept or discarded by how well they work.
  *   **The Awkward Commitment:** You must admit that your preferred labels are not "truer" than others, merely more convenient for your current purpose.

  **Mostly ■: The Pluralist**
  *   **Plain English:** You believe there is no single correct periodization, only many, each true relative to some purpose or interest.
  *   **The Awkward Commitment:** You must accept that two contradictory periodizations can both be "correct" depending on who is asking the question.

  **Mostly ▲: The Eliminativist**
  *   **Plain English:** You believe there are no periods at all, and period-talk is at best shorthand for dated events that ought to be dropped.
  *   **The Awkward Commitment:** You must argue that we should stop using words like "Renaissance" entirely, even when they help students grasp a complex century quickly.

  **Mostly ◆: The Normativist**
  *   **Plain English:** You believe period terms are primarily value-laden labels that encode a narrative of progress or decline, and their real work is rhetorical.
  *   **The Awkward Commitment:** You must concede that these terms tell us more about the people who coined them than about the historical period they describe.

  **Mostly ✚: The Hybridist**
  *   **Plain English:** You believe the changes in the world are real but the divisions between them are made by historians.
  *   **The Awkward Commitment:** You must explain exactly where the "real change" ends and the "made-up division" begins, without using a period label to do it.

  **Note on Ties and Gaps:**
  If you scored equally between **Instrumentalist (●)** and **Hybridist (✚)**, you occupy a live part of the space: you agree the lines are made, but disagree on whether the underlying changes are robust enough to warrant standard tools. If you scored equally between **Realist (★)** and **Eliminativist (▲)**, your view may be incoherent: you cannot consistently hold that periods are both fundamental features of reality and useless noise. If you scored highly on **Normativist (◆)** and **Pluralist (■)**, you likely agree that labels are made, but disagree on whether they serve many purposes (Pluralist) or one dominant power structure (Normativist).

  Summary: The quiz hinges most on whether you believe historical periods are discovered features of the world or invented tools for organizing it.
