answer: |-
  # PREP SHEET: Q&A STRATEGY

  ## PRE-EMPTIVE CONCESSIONS
  *Do not wait to be cornered. State these in your closing remarks or immediately when the first econometric objection arises.*

  1.  **Concede the value of $\beta$, attack the $R^2$.** Explicitly state: "I am not arguing that natural experiments fail to identify causal effects. An IV estimate of institutions on income is valid *for that context*. I am arguing that summing those effects to claim 'Institutions explain 50% of the variance' is the category error."
  2.  **Concede Policy Utility.** Admit that policymakers need heuristics. If a leader asks "Should I fix my courts or my ports?", saying "It's unanswerable" is unhelpful. Frame your argument as about *scientific ontology*, not *policy triage*.
  3.  **Grant the Historian's Point.** Agree that the question is presentist. Your argument is that *because* it is presentist, it imposes a modern variance structure on a singular historical path. This aligns you with the historian against the economists.

  ---

  ## THE OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Applied Econometrician (The "Livelihood" Attack)
  **The Question:** "You're drawing a distinction between causal effects and variance shares that doesn't exist in practice. We use cross-sectional variation as a sample from a 'super-population' of potential economies. If we can't treat the world's nations as a sample, half of empirical economics collapses. Are you really arguing that we should stop doing development empirics because history only happened once?"

  **The Reply (2 mins):**
  "I'm arguing we stop doing *accounting*, not empirics. There is a massive difference between estimating the causal effect of a specific institution (which IVs do well) and claiming that institution accounts for a specific percentage of global inequality (which requires a distribution of histories we don't have).
  Think of it like this: If I study a specific car crash, I can identify that bald tires caused *this* accident. That is a valid causal claim. But if I look at all car crashes in 2023 and claim 'bald tires explain 40% of all accidents,' I am making a claim about the distribution of possible worlds, not just the data I have.
  My argument is that the 'super-population' in development is not a statistical convenience; it's a metaphysical assumption that history could have rolled out differently in ways that are independent of the variables we measure. We can estimate local effects. We cannot aggregate them into a global pie chart. Don't stop doing empirics; stop pretending the pie chart is real."

  **Where it's Soft:**
  Economists hate metaphysical distinctions. They view the "super-population" as a standard modeling assumption, not a philosophical claim. You risk sounding like you're moving the goalposts to protect a philosophical purity at the expense of empirical progress.

  ### 2. The Applied Econometrician (The "Structural Model" Counter)
  **The Question:** "You say we lack a population of histories. But structural models allow us to simulate counterfactuals. If I build a calibrated general equilibrium model of development, I can shock the 'institution' parameter and see how much variance disappears. Doesn't that solve your 'one history' problem?"

  **The Reply (2 mins):**
  "It solves it only by assuming the answer in the structure of the model. A structural model gives you precise variance shares, but those shares are entirely dependent on the functional forms and parameters you imposed to build the model.
  If your model assumes institutions and geography are additive, the model will return additive shares. If it assumes they interact, it will return interactions. The model doesn't reveal the 'true' variance of history; it reveals the variance implied by your assumptions.
  My point is that the 'grand question' literature presents these shares as discovered facts about the world. Structural models show they are artifacts of the model specification. That confirms my argument: the shares aren't out there waiting to be found; they are created by the lens you use to look."

  **Where it's Soft:**
  This concedes that structuralists *can* answer the question, just that their answer is model-dependent. They will argue *all* science is model-dependent. You need to hold the line that there is a difference between "model-dependent" and "ontologically undefined."

  ### 3. The Political Scientist (The "Korea" Defense)
  **The Question:** "You say we can't aggregate local experiments. But look at the Two Koreas. Same geography, same culture, same history until 1945. Massive income divergence driven entirely by institutions. Doesn't that single data point prove institutions dominate geography, rendering your variance debate moot?"

  **The Reply (2 mins):**
  "The Two Koreas prove that institutions *can* matter massively. They do not prove that institutions explain *most of the variance* in global income.
  To move from 'Institutions caused the divergence in Korea' to 'Institutions explain 60% of global inequality,' you have to assume that the Korean counterfactual is representative of the global counterfactual. But maybe Korea is a special case where geography was held constant.
  In most of the world, geography and institutions co-evolved. You can't isolate the institution effect in the Andes the way you can on the 38th Parallel. The Korea case is a proof of existence for institutional effects, not a proof of dominance for global variance decomposition."

  **Where it's Soft:**
  The Korea example is the strongest intuitive evidence for the institutionalist view. Dismissing it as "non-representative" can sound like special pleading. You must emphasize the leap from *existence* to *variance share*.

  ### 4. The Geographer (The "Exogeneity Hierarchy")
  **The Question:** "You treat institutions and geography as additive competitors. But geography is exogenous and institutions are endogenous. Disease environment determines settlement density, which determines state capacity. Isn't the variance share of geography effectively 100% because it causes the institutions?"

  **The Reply (2 mins):**
  "That actually supports my argument. If geography causes institutions, they are collinear. You cannot statistically disentangle their variance shares because they are not independent draws.
  When the literature claims 'Institutions explain X% and Geography explains Y%,' they are assuming orthogonal variation. If your claim is true—that geography drives institutions—then the regression is misspecified, and the shares are meaningless numbers.
  I am not taking a side on whether geography or institutions matter more. I am saying the mathematical framework used to compare them (additive variance decomposition) breaks down precisely when one causes the other."

  **Where it's Soft:**
  Geographers love this argument. You risk validating their substantive claim while trying to kill the method. Make sure you don't end up agreeing that geography is fundamental; keep the focus on the *statistical impossibility* of separating them.

  ### 5. The Policy Pragmatist (The "So What?")
  **The Question:** "Let's say you're right. The 'shares' are metaphysically ill-posed. But a Finance Minister in Ghana needs to know whether to invest in malaria nets or property rights courts. If you tell them the question is unanswerable, what are they supposed to do?"

  **The Reply (2 mins):**
  "I am not telling them the question is unanswerable; I am telling them the *grand* question is. They don't need to know if institutions explain 50% of global variance. They need to know the marginal return on a specific reform in their specific context.
  That is exactly what the local identification literature provides. An IV estimate tells a Minister what happens if *they* change property rights. It does not tell them why Ghana is poorer than Switzerland.
  We should stop selling local causal estimates as answers to the grand historical question. Answer the policy question with local evidence. Leave the 'why are nations rich' question to the historians and philosophers."

  **Where it's Soft:**
  This is a retreat. It limits the scope of your paper significantly. Critics will say this makes your critique trivial—"Oh, so you just want us to be more humble?" You need to frame it as a correction of scientific overreach, not just a plea for humility.

  ### 6. The Grad Students (The "Deep Roots" Challenge)
  **The Question:** "You talk about institutions and geography. But what about deep roots? Genetic distance, Neolithic transition timing, crop suitability. These are fixed, exogenous, and predictive. Why aren't these the 'true' variance shares, and why does your critique apply to them?"

  **The Reply (2 mins):**
  "My critique applies to them even harder. These variables are perfectly collinear with history. There is only one realization of the Neolithic transition.
  When you regress income on genetic distance, you are fitting a curve to a single data point: human history. You might get a high R-squared, but that R-squared is not a 'share of variance' in a population. It is a measure of fit for a singular trajectory.
  Deep roots literature often claims to find the 'ultimate causes.' But if there is only one history, 'ultimate cause' is a narrative label, not a statistical quantity. You have found strong predictors, not variance shares."

  **Where it's Soft:**
  Grad students are defensive of their niche. Calling their R-squareds "narrative labels" will sting. Be prepared for them to argue that cross-sectional variation across countries *is* a valid sample for deep roots in a way it isn't for institutions.

  ### 7. The Economic Historian (The "Presentism" Trap)
  **The Question:** "I agree the question is presentist. But isn't that a feature, not a bug? We study the past to understand the present. If the question is 'What explains the variance in 2024 income?', isn't that a well-defined statistical question regardless of how we got there?"

  **The Reply (2 mins):**
  "It is a well-defined descriptive question: 'What correlates with 2024 income?' It becomes ill-posed when we interpret those correlations as causal shares of a historical process.
  If I ask 'How much of my height is due to my father's genes vs. my childhood diet?', that is unanswerable for me as an individual. I am one realization. I can look at a population of people to estimate average effects, but I cannot decompose *my* height.
  Nations are individuals in this dataset. We have one world. Decomposing the variance of a single realization requires assuming a population of worlds that does not exist."

  **Where it's Soft:**
  The Historian will argue that social science *always* generalizes from limited data. You are holding economic history to a standard of physics that social science never meets. You need to accept that charge but argue the "Grand Question" literature pretends to meet it.

  ### 8. The "Hope Nobody Asks" (The Nuclear Option)
  **The Question:** "If the variance decomposition is impossible, and local experiments don't aggregate, isn't the entire 'Credibility Revolution' in development economics just collecting anecdotes? Are you arguing the field has produced no scientific knowledge in 30 years?"

  **The Reply (2 mins):**
  "No. I am arguing the field has produced knowledge about *mechanisms*, not *accounts*.
  We know much more about *how* institutions affect investment than we did 30 years ago. That is scientific progress.
  The error is claiming that knowing the mechanism allows us to answer the accounting question. We have traded external validity for internal validity. That is a fair trade, but we must admit the trade happened. We know more about specific causal links, but we know less about the global distribution of wealth than we claimed in the 90s. That isn't a failure of science; it's a correction of scope."

  **Where it's Soft:**
  This is the most dangerous moment. If you sound too dismissive of the field's progress, you lose the room. If you sound too accommodating, you undermine your paper. You must walk the line that the *knowledge* is real, but the *claim* (answering the Grand Question) is false.

  ---

  ## TACTICAL NOTES

  *   **Watch the "Additive" Keyword:** Whenever an economist talks about "shares," "variance," or "contribution," interrupt gently to ask: "Additive over what distribution?" Force them to define the counterfactual population. They usually can't.
  *   **Don't Fight the "Deep Roots" on Merit:** Do not get dragged into whether genetics matters. Keep the argument on the *statistical structure*. Whether the variable is genes or institutions, the "one history" problem remains.
  *   **Body Language:** When the Applied Economists attack, do not get defensive. Lean in. You are saving them from making false claims, not attacking their methods. Frame yourself as the guardian of the integrity of their identification strategies.
  *   **The "Gould" Analogy:** Use the "Replay the Tape" analogy early. It sticks. If you explain it well in the talk, you can refer back to it in Q&A ("As I mentioned with the tape analogy...").

  ## FINAL WARNING
  The room will try to force you into a substantive debate (Institutions vs. Geography). **Do not take the bait.** Every time they argue for a specific cause, pivot back to the *variance decomposition* method.
  *   Them: "But institutions clearly matter more in Africa."
  *   You: "They may. But can we calculate the percentage share of that effect independent of the geography that shaped the institutions?"
  *   Them: "Yes, using IV."
  *   You: "You can calculate the local effect. You cannot calculate the global share."

  Hold that line. It is your only defense.
