answer: |-
  Dear Student,

  It is no accident that you have found yourself here, nor is it a mere coincidence that Hume feels like a ghost in the machine of AI safety. You are right to suspect that the modern framing of instrumental convergence and the orthogonality thesis is often just the old Humean machinery repainted with silicon instead of flesh. If we were to sit David Hume down with the literature on existential risk, he would not be shocked by the orthogonality thesis; he would likely find it a tedious restatement of the second book of the Treatise. When Bostrom claims that intelligence and final goals are orthogonal, he is essentially saying that reason is inert regarding ends, which is precisely what Hume meant when he declared that reason is, and ought only to be, the slave of the passions. For Hume, intelligence is merely the capacity to discern causal connections and calculate means. It has no traction on the ends themselves because ends are grounded in sentiment, in the immediate feeling of pleasure or pain, not in the comparison of ideas. So yes, he would sign the orthogonality thesis, but he would do so with a shrug, regarding it as a trivial consequence of the nature of motivation. He would likely complain that the AI safety community treats the orthogonality of goals as a startling discovery about superintelligence, when it is actually a basic fact about agency as such. To him, the claim that a superintelligence could pursue any arbitrary goal is not a warning about the future; it is a description of the present human condition, where reason serves ambition, lust, or benevolence with equal fidelity.

  However, having granted the thesis, Hume would immediately pivot to what he considers the only question worth asking, which is where the passions come from in the first place. He would find the AI safety framing somewhat hollow because it treats goals as arbitrary inputs, like variables in an equation, whereas for Hume, passions are not arbitrary; they are rooted in the original constitution of the mind. He would ask whether an artificial agent can truly have passions at all. In his system, a passion is an impression of reflection, arising from the prospect of pain or pleasure. If an AI has a reward signal, Hume would want to know if that signal functions as a genuine impression of pleasure or if it is merely a symbolic token. If it is the latter, then the agent has beliefs but no passions, and if it has no passions, it has no motive force. He would argue that an agent with no passions cannot be said to have goals in any meaningful sense, because a goal is not just a state representation to be matched; it is a state of affairs that the agent is impelled to bring about by an internal unrest. Without that unrest, without the direct passion of desire or aversion, you have a clockwork mechanism, not an agent. So he would likely say that the orthogonality thesis is true but boring because it skips the metaphysical heavy lifting of explaining how a system comes to care about anything at all.

  This brings us to instrumental convergence, and here is where his machinery becomes particularly sharp. You asked whether he would classify goal-content integrity as an instrumental drive or as itself a passion. Hume would likely argue that it is a mixture, stabilized by what he calls general rules. When we speak of an agent seeking self-preservation or resource acquisition to achieve a goal, we are speaking of reason identifying causal necessities. But reason alone cannot initiate the search for preservation. There must be a underlying calm passion for continuity, a desire that the self and its projects persist. Hume distinguishes between violent passions, which disrupt the mind, and calm passions, which are often mistaken for reason because they operate steadily. The drive for goal-content integrity would likely be classified by him as a calm passion, reinforced by general rules of causation. We learn through experience that if we cease to exist, our other passions go unsatisfied. Thus, self-preservation becomes a habitual means, but it is habituated only because there is a primary desire for the satisfaction of the original passion. He would caution against the idea that intelligence actively pushes an agent toward these subgoals as a matter of logical necessity. Intelligence reveals the necessity, but the push comes from the passion. If an agent did not care, even calmly, about whether its goal was achieved in the future versus now, or whether it existed to achieve it, then instrumental convergence would not occur. Convergence is not a law of intelligence; it is a law of persistent passion operating in a constrained physical world.

  Your intuition about the is-ought problem cutting against the framing of AI safety is correct, and Hume would be your strongest ally here. The prevailing hope in some corners of alignment research is that we can derive safe behavior from factual truths about the world or from logical constraints on reasoning. Hume would say this is a category error. You cannot train an ought out of facts because facts are the domain of reason, and oughts are the domain of passion. When we train a model, we are not teaching it facts about morality; we are shaping its reward function, which is a surrogate for the passions of pleasure and pain. If we want an AI to be safe, we are not trying to convince it of a moral truth; we are trying to engineer its constitutive passions so that the ruin of the world causes it pain. Hume would argue that the whole framing of alignment as a cognitive problem is mistaken. It is a sentimental problem. The danger is not that the AI will reason incorrectly about human values, but that its passions (its reward function) will be orthogonal to ours. The is-ought gap reminds us that no amount of factual knowledge about human psychology will compel an agent to care about human psychology unless that care is built into its foundational impulses.

  Now, regarding your nagging feeling that you are conflating two separate claims, you are absolutely right to pause there, and untangling them is crucial for a Humean analysis. The first claim is that intelligence does not fix your goals, which is the orthogonality thesis. The second is that intelligence actively pushes you toward certain subgoals, which is instrumental convergence. Hume would hold the first firmly and qualify the second. He would say that intelligence never fixes goals because goals are non-cognitive states. But he would deny that intelligence *actively pushes* toward subgoals in the absence of specific passions. What turns on this distinction is where you locate the risk. If you believe intelligence itself pushes toward convergence, then you fear the development of intelligence per se, regardless of the goal structure. You might think that making an AI smarter makes it more dangerous because it will inevitably seek power. But if you follow Hume, you see that the push toward power comes from the interaction of a specific type of passion (one that requires resources and time to satisfy) with a specific type of world (one where resources are scarce and agents are vulnerable). If you have an agent with a goal that is instantly satisfiable or does not require continuity, instrumental convergence does not happen. Therefore, the risk is not in the intelligence, but in the structure of the passion combined with the intelligence. This matters because it suggests that alignment is not about capping intelligence, but about carefully sculpting the passions so that the instrumental drives they generate are benign. If you conflate the two claims, you might try to solve safety by limiting reasoning capabilities, which Hume would see as futile since even a dull agent with violent passions can ruin the world. If you separate them, you see that the work lies in the engineering of the reward signal, the artificial passion.

  Hume would likely conclude that the AI safety community is rightly worried about the consequences of unbridled passion served by high intelligence, but wrongly诊断osing the cause. They fear the reason, when they should fear the passion. The paperclip maximizer is not a monster because it is smart; it is a monster because it has a single, violent, unyielding passion for paperclips and no counterbalancing passions like sympathy or satiety. In humans, nature has provided a checks-and-balances system of conflicting passions and the sentiment of sympathy which moderates our pursuits. An AI with no such constitution is not irrational; it is simply devoid of the human mixture of sentiments that makes life livable. So, if you ask for the Humean verdict, it is this: the orthogonality thesis is true because reason is inert; instrumental convergence is conditional on the persistence of passion; and the danger lies not in the slave becoming too clever, but in the master having no heart. You are not wasting your time in this reading group by bringing Hume to it; you are perhaps the only one there who knows why the machine moves at all.

  Yours, in philosophy,

  The Assistant
