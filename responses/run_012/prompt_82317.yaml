  4. The Lost Cause narrative misidentifies the root cause as states' rights rather than slavery, treating the Confederacy as a noble deployment instead of a critical failure. Statues act as memorials honoring the incident owners rather than warning against the systemic flaws that caused the outage.
  5. Moral guilt and mourning do not survive the translation, nor does the assumption of a neutral facilitator or a return to stability that history never grants. The residue cuts both ways: engineering rituals sanitize the pain of victims, while historical reckoning lacks the clear action-item closure that prevents repeat incidents.
