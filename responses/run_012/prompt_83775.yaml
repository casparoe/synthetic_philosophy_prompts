answer: |-
  First, I need to say something important before we get to the ranking: **Do not blow your savings on this.**

  Futarchy is experimental governance technology. It is not an investment vehicle. If you put your personal savings into a prediction market for your housing co-op, you are not testing a theory; you are gambling your rent money on a political dispute. If this fails, you lose your house *and* your savings. Please treat this as a pilot project with "play money" or very small stakes first. Robin Hanson (the economist you're thinking of) would tell you the same thing.

  Now, to your question. You are right to be confused. Futarchy sounds elegant in blog posts but hits brutal walls in the real world. For a 200-person co-op, the problems are not mostly theoretical; they are practical.

  Here is the ranking of the open questions that actually matter for your situation, from "Showstopper" to "Annoyance." I have ranked them by **upstream impact**: if the top item fails, nothing below it matters.

  ### 1. The "Five Loud Guys" Problem (Liquidity & Manipulation)
  **Rank:** #1 (The Upstream Killer)
  **Why:** A prediction market only works if the price reflects *information*, not just *cash*. In a stock market, if you try to lie about Apple's stock price, a hedge fund with deeper pockets will bet against you and take your money. In a 200-person co-op, there are no hedge funds. If five wealthy members decide they want the building sold, they can simply out-bet everyone else. They don't need to be right; they just need to be richer.
  **Why it's upstream:** If the market price is just a measure of "who has the most cash" rather than "what is true," the entire mechanism collapses. You aren't aggregating wisdom; you're auctioning policy to the highest bidder. This dissolves the counterfactual problem, the token problem, and the metric problem, because the signal is already noise.
  **What would move it down:** If you could prove a mechanism for "subsidized liquidity" (where an external pot of money rewards correct predictions regardless of side) works in small groups. But right now, this is the biggest wall.

  ### 2. The "Goodhart" Problem (Metric Gaming)
  **Rank:** #2 (The Definition Killer)
  **Why:** Futarchy requires a "welfare metric" (e.g., "Co-op equity value in 5 years" or "Resident satisfaction score"). You mentioned people don't trust the board's numbers. If you put the metric on the market, people will bet on how to *hack* the metric, not how to improve the co-op. For example, if the metric is "Sale Price," the market will correctly predict that selling yields a higher number than staying, but that doesn't mean it's better for the people living there. If the metric is "Happiness," how do you measure that without people lying?
  **Why it's upstream:** If you measure the wrong thing, a perfectly functioning market will efficiently drive the co-op off a cliff. It doesn't matter if the market is liquid if it's predicting the wrong variable.
  **What would move it down:** If your co-op can agree on a metric that is both hard to fake and actually captures what you value (e.g., audited financial reserves + a verified survey). This is rare.

  ### 3. The Counterfactual Problem (The "Voided Bet")
  **Rank:** #3 (The Mechanism Flaw)
  **Why:** You asked: "If we don't sell, the world where we did sell never happens, so who pays out that bet?" You are right to be suspicious. In standard futarchy, if the market votes to "Sell," the "Don't Sell" bets are usually **voided** (money returned). They don't pay out.
  **The Trap:** This creates a perverse incentive. If I want to "Sell," I might try to manipulate the "Don't Sell" market to look terrible (low price) so that "Sell" wins by default. Since the "Don't Sell" bets will be voided anyway if I win, I don't care if I lose money on that side as long as I win the policy vote.
  **Why it's downstream:** This is a serious flaw, but it only matters if you have liquidity (#1) and a good metric (#2). If the market is too small or the metric is broken, this manipulation incentive is theoretical.
  **What would move it down:** A mechanism where both markets stay active regardless of the decision (e.g., using a "decision market" structure where payouts are based on a randomized trial), but that is legally and financially complex for a co-op.

  ### 4. The Token Contradiction (Incentive Compatibility)
  **Rank:** #4 (The Economic Friction)
  **Why:** You asked: "Everyone gets the same tokens... but then the tokens are worthless." You have identified a real contradiction. Prediction markets need **skin in the game** to work. If I bet with monopoly money, I might bet randomly or maliciously because I can't lose. If I bet with real dollars, the rich members have more influence (see #1).
  **Why it's downstream:** This is a tuning problem. You can solve this with caps (max bet per person) or reputation points that convert to real rewards later. It's solvable engineering, unlike the liquidity problem which is structural.
  **What would move it down:** If you find a way to decouple "voting power" from "wealth" while keeping "accuracy rewards" real. (e.g., Everyone gets equal betting tokens, but accurate predictors earn *cash* bonuses from a separate fund).

  ### 5. Betting Against Neighbors (Social Friction)
  **Rank:** #5 (The Emotional Cost)
  **Why:** You asked: "Can you even let people bet against something they'd personally lose from?" This is the "moral hazard" issue. If my neighbor bets that the building will fail so they can profit from the sale, and I live there, I will hate them.
  **Why it's downstream:** This doesn't break the math. It just makes the co-op a toxic place to live. You can ban residents from betting on outcomes that directly affect their tenancy, but that reduces liquidity further (see #1). It's a social problem, not a system failure.

  ---

  ### The Single Line of Work That Knocks Out the Most Others
  If you want to focus your two years, focus on **Mechanism for Small-Group Liquidity.**

  Specifically: **How do you prevent wealth concentration from dictating the price in a thin market?**

  If you solve this, you mitigate the "Five Loud Guys" problem (#1). If you solve that, you reduce the incentive for Metric Gaming (#2) because manipulators can't overpower the truth as easily. It also reduces the Counterfactual manipulation (#3) because it becomes too expensive to manipulate the voided market.

  **How to test this:** Don't use real money. Run a simulation with your friends. Give everyone $1,000 in fake money. Pick a metric (e.g., "Will it rain next Tuesday?"). See if the "richer" friends (those who take it more seriously) dominate the price, or if the information aggregates. Then try to introduce a rule that limits max bet size. See if that fixes it.

  ### Addressing Your Specific Bullets

  *   **"Whatever you bet on gets gamed... people who pick the metric benefit."**
      *   **Verdict:** **Real Problem.** This is the #2 ranking above. In a co-op, the "board" usually picks the metric. If the board wants to sell, they will pick a metric like "Immediate Cash Flow" which favors selling. You must vote on the metric *before* the market opens, ideally requiring a supermajority.
  *   **"The counterfactual problem... who pays out that bet?"**
      *   **Verdict:** **Real Problem, but misunderstood.** As noted, usually the losing side is voided. The risk isn't "who pays," it's "people will sabotage the losing market to ensure it loses." You fix this by making it expensive to move the market price (requiring more capital to shift the odds), which circles back to the Liquidity problem.
  *   **"In a 200 person co-op, can you let people bet against something they'd personally lose from?"**
      *   **Verdict:** **Real Social Risk.** You should probably allow it, otherwise you lose the people who know the building is failing (they are the ones who want to bet against it). But expect drama.
  *   **"Making the choice of metric itself into a market."**
      *   **Verdict:** **Real Proposal, but pushes the problem back.** Hanson has suggested this. It creates a "market on markets." It is very complex. For a co-op, it's over-engineering. Just vote on the metric democratically first.
  *   **"Everyone gets same tokens... tokens are worthless."**
      *   **Verdict:** **Real Contradiction.** You cannot have equality of influence and equality of incentive in the same token. You need two layers: One token for voting influence (equal), one currency for betting accuracy (earned or capped).
  *   **"Whether a market this small... is even a market."**
      *   **Verdict:** **The Biggest Worry.** This is your #1 ranking. 200 people is likely too small for a financial market to be efficient. It will be noisy. You might be better off using a "Delphi Method" (anonymous surveys averaged out) rather than a financial market.

  ### What Would Move a Question Up or Down?

  **To move "Liquidity" down (make it less worrying):**
  You would need to see a successful case study of a prediction market with under 500 participants making a high-stakes decision accurately. If someone publishes data showing a small co-op or DAO successfully used futarchy without being captured by three wealthy members, this drops to #3.

  **To move "Metric Gaming" up (make it more worrying):**
  If your co-op fails to agree on a single number that represents "success." If half the members care about "profit" and half care about "community," no market can solve that. If you realize in the next year that you cannot define a welfare function, stop. The project is dead.

  ### Final Advice
  You are a mail carrier, not a quant. Do not try to build a financial exchange.
  1.  **Do not use savings.** Use a platform like Manifold Markets (play money) or a simple spreadsheet simulation.
  2.  **Test the Metric first.** Before betting, spend six months just trying to get 200 people to agree on *what* to measure. If you can't do that, the market won't save you.
  3.  **Watch out for the "Rich Five."** If you proceed, implement strict bet limits per person.

  Futarchy is a brilliant idea, but it assumes a level of market efficiency and rational agreement that rarely exists in small, emotional human groups. Proceed with extreme caution.
