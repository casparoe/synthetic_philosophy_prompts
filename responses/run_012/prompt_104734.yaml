  2.  **Deconstruct the Positions:**
      *   **Side A (Inherent Politics/Artifact Agency):** Artifacts embody social order. Design choices enforce specific relations. Neutrality is a dodge. (Winner, Latour-ish).
      *   **Side B (Neutral Instrument/Contextual Politics):** Artifacts are indifferent. Politics lies in deployment, institutions, control. "Inherent politics" confuses physical constraint with social intent. (Russell, traditional liberal view).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground. Both agree technology impacts society. Both agree design isn't random. Both agree "politics" involves power distributions.
      *   *Claim 1 (Definition):* Politics involves the distribution of power, authority, and access within a collective.
