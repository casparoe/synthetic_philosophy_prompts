  5.  **Refining the Content (Iterative Process):**

      *   *Refining the "Agreed Claims":* Make sure they sound like STS scholars. Use terms like "affordance," "script," "deployment." Ensure Side B doesn't look like a naive technocrat and Side A doesn't look like a technological determinist.
