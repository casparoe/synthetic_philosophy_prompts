          *   *Traffic Signals:* Side A says the algorithm *is* a policy choice favoring public transit users. Side B says the algorithm is a tool; the city council's mandate is the policy.
      *   *The "Verbal" Dispute:* Acknowledge that Side A uses "politics" to mean "congealed social relations" while Side B uses it to mean "deliberate contestation/decision."

