      *   *Claim 3 (Constraint vs. Possibility):* Distinction between technologies that *facilitate* vs. those that *require* specific social arrangements.
      *   *Claim 4 (Burden of Proof):* Side A must show the artifact *itself* enforces the order. Side B must show the order is contingent on external deployment.
      *   *Claim 5 (Evidence):* Historical record of use, design documents, counterfactual analysis (could it have been built differently?).

  4.  **Drafting Section 2: Disagreements Table:**
