prompt: |-
  Alright, I'm trying to get my head around Galen Strawson's Basic Argument against moral responsibility and I'm pretty sure I'm reading it wrong. The way I have it: whatever you do flows from who you are — your character, your motives, your values — and who you are is the product of stuff you had zero say in, your genes, your upbringing, the whole lot. So you couldnt have done otherwise, which is why you can't be responsible. Which is just the standard incompatibilist line: determinism is true, so no free will, so no responsibility. There's also something in there about an infinite regress, having to have chosen the character you ended up with, but I always figured that was window dressing on top of the determinism point. Anyway, someone told me the argument is supposed to be determinism-neutral, that Strawson is aiming it at the libertarians too — the ones who think quantum indeterminacy or some uncaused act of will busts them out of the causal chain. I don't see how that's meant to work. If determinism is false then it looks like you could have done otherwise after all, and the whole thing collapses back into a fight about determinism. And then a second thing that really bugs me: if Strawson is right, doesnt it follow that nobody should ever be blamed for anything — no resentment, no indignation, no punishment, no prisons? That seems like an absurd result, so I assume I'm the one who's confused. Can you tell me where I'm going wrong?
