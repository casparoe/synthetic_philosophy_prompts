answer: |-
  You have a very solid grasp of the surface-level logic, but you've identified exactly the two pressure points where most people get stuck on Strawson's Basic Argument. You aren't reading it "wrong," but you are reading it through the lens of standard incompatibilism, which misses the specific philosophical trap Strawson is setting.

  Here is where the confusion lies: You are treating the argument as a claim about **causal determination**, whereas Strawson frames it as a claim about **self-creation**.

  Let's break down the two things that are bugging you.

  ### 1. How is this "Determinism-Neutral"?

  You wrote: *"If determinism is false then it looks like you could have done otherwise after all, and the whole thing collapses back into a fight about determinism."*

  This is the most common objection, and Strawson anticipates it. The Basic Argument does not rely on the premise "Determinism is true." It relies on the premise **"You cannot be *causa sui* (the cause of yourself)."**

  Here is how it swallows Libertarianism (the view that we have uncaused free will):

  Imagine a Libertarian agent, Alice. She faces a choice: Steal or Don't Steal. Determinism is false, so her past doesn't strictly determine her choice. There is a "gap" of indeterminacy.
  *   **Scenario A:** Alice chooses based on her reasons, character, and motives.
      *   *Strawson's Question:* Where did those reasons and character come from? If they came from her genetics and upbringing, she didn't choose them (back to your original point). If she *did* choose them, she must have chosen them using a prior set of reasons/character. This starts the **infinite regress**.
  *   **Scenario B:** Alice's choice is not fully determined by her character (to satisfy the Libertarian requirement). It is, to some degree, random or uncaused.
      *   *Strawson's Question:* If the choice is not determined by who she is (her character/values), then it is essentially a random event. How can you be morally responsible for a random event? If I twitch because of a nerve spasm, I'm not responsible. If Alice "chooses" in a way that is disconnected from her prior mental state, that choice is just luck. You can't be responsible for luck.

  **The Trap:**
  To be truly morally responsible (what Strawson calls **Ultimate Responsibility**), you must be the *ultimate source* of your actions.
  1.  If your action comes from your character, you are only responsible if you are responsible for your character.
  2.  To be responsible for your character, you must have chosen it.
  3.  To choose it, you must have had a prior character to make that choice.
  4.  Therefore, to be truly responsible, you would have to exist *before* you existed to choose the nature of your own existence.

  This is impossible regardless of whether the universe is deterministic or indeterministic. If it's deterministic, you are a puppet of the past. If it's indeterministic, you are a puppet of randomness. Neither allows for *self-creation*. That is why the infinite regress isn't window dressing; it is the engine of the argument.

  ### 2. The "Absurd" Practical Implications

  You wrote: *"If Strawson is right, doesnt it follow that nobody should ever be blamed for anything... That seems like an absurd result."*

  You are reacting viscerally, which Strawson expects. He distinguishes between two things:
  1.  **The Metaphysical Truth:** We are never ultimately morally responsible.
  2.  **The Human Reality:** We cannot help but feel reactive attitudes (resentment, gratitude, indignation).

  Strawson is a "Hard Incompatibilist." He agrees with you that the conclusion feels absurd practically, but he insists it is true theoretically. Here is how he handles the "no prisons" worry:

  **Retribution vs. Protection**
  Strawson's argument destroys **retributive justice** (punishing someone *because* they deserve blame for a past act). It does not necessarily destroy **consequentialist measures**.
  *   We can still quarantine a virus without blaming it.
  *   We can still fix a broken car without blaming it.
  *   We can still incarcerate a dangerous person to protect society without claiming they *metaphysically deserve* to suffer.

  Strawson argues that while we intellectually know no one is ultimately responsible, we are biologically wired to feel blame. He doesn't necessarily advocate for a society where we never express indignation (he thinks that might be impossible for humans), but he argues we should stop claiming that our indignation is *cosmically justified*. We should treat punishment like public health policy (containment and rehabilitation) rather than cosmic balancing of scales.

  **Why it feels absurd to you**
  It feels absurd because you are conflating **social responsibility** with **ultimate moral responsibility**.
  *   **Social Responsibility:** "Did you do it? Are you the agent? Then we hold you accountable to maintain social order." (Strawson accepts this exists).
  *   **Ultimate Moral Responsibility:** "Did you create the self that did the act from scratch, such that you deserve eternal praise or blame?" (Strawson says this is impossible).

  ### Summary of Where You Went "Wrong"

  1.  **On Determinism:** You thought the argument was "Determinism $\rightarrow$ No Responsibility." Actually, it is "No Self-Creation $\rightarrow$ No Responsibility." Determinism is just one way self-creation fails; randomness is the other.
  2.  **On the Regress:** You thought the regress was secondary. It is primary. It proves that even if you *could* have done otherwise (Libertarianism), you still wouldn't be the *source* of the "otherwise."
  3.  **On Consequences:** You assumed "No Responsibility" means "No Consequences." Strawson argues it means "No *Retributive* Blame." We can still manage behavior without believing in cosmic desert.

  Strawson's goal isn't to tell you to let murderers go free; it's to tell you that hating the murderer is metaphysically incoherent, even if it is psychologically inevitable. He wants you to accept that we are "mysterious luck-buckets" rather than "captains of our souls."
