answer: |-
  The Office of Civic Memory smelled of ozone and cured leather, the scent of a state that preserved everything except ambiguity. Elara Vance sat behind her desk, the commission scroll heavy in her hands. *General Kaelen Varr. Deceased, 14th of Frost. Commission: Official Life, Class A.*

  In the Meridian Republic, biography was not history; it was pedagogy. To read a Life was to learn how to be a citizen. But a citizen needed a clear path, and Kaelen Varr had walked a labyrinth.

  Three factions had already visited her. First, High Command, represented by a Colonel with a jaw like a granite block. They wanted the *Soldier's Soldier*: Varr the unflinching, who slept in mud and ate rations while his officers dined. A model of discipline.

  Second, the Senate's Moral Oversight Committee. They wanted the *Reluctant Conscience*: Varr the peacemaker, who wielded the sword only to protect the weak, haunted by the blood on his hands. A model of mercy.

  Third, the Traditionalists, keepers of the Old Laws. They wanted the *Martyr*: Varr the defender of the Founding Principles, who died because the Republic had grown soft and betrayed him. A model of sacrifice.

  Elara spread the primary sources across her desk. Letters to his wife, contradictory after-action reports, diary entries scrawled in the margins of supply logs.

  In one letter, Varr wrote, *"I do not sleep, for if I sleep, the men think I do not care."* (Support for the Soldier).
  In another, to a Senator: *"I fire only when the diplomatic seal is broken. I am a shield, not a spear."* (Support for the Conscience).
  In his final testament: *"They have forgotten the weight of the oath. I carry it alone."* (Support for the Martyr).

  Elara rubbed her temples. This was the Exemplar's Dilemma. To make Varr imitable, she had to smooth him into a single dimension. But a one-dimensional man cannot exist in a three-dimensional world. If she wrote the Soldier, young officers would learn cruelty and call it discipline. If she wrote the Conscience, they would learn hesitation and call it mercy. If she wrote the Martyr, they would learn resentment and call it virtue.

  The more she shaped the life to be a perfect lesson, the less it resembled a life a human being could actually live.

  ***

  Seeking clarity, Elara descended to the Restricted Archives, where the pre-Republic texts were kept. She requested the *Parallel Lives* of Plutarchus, bound in crumbling vellum. She opened it to the comparison of Alexander and Caesar.

  Here, in the old tradition, the contradictions were not errors; they were the texture of the soul. Plutarchus did not hide Caesar's vanity; he wove it into his ambition. He did not hide Alexander's rage; he showed it as the shadow of his greatness. These were not manuals of instruction; they were mirrors of complexity.

  Then she pulled a hagiography, a *Life of Saint Aeliana*. Here, the curation was absolute. Aeliana never felt cold, never doubted, never grew angry. She was a vessel of divine will.

  Elara traced the ink. The hagiography was useful for prayer, but useless for living. No one could be Aeliana. She was a statue. But Plutarchus's men were flesh. They bled.

  "The Republic wants a saint," Elara whispered to the empty archive. "But Varr was a Plutarchan subject trapped in a hagiographic system."

  If she treated Varr like Aeliana, she lied. If she treated him like Caesar, the State would reject the moral utility. The Republic demanded that biography function as a blueprint. But you cannot build a house from a blueprint of a cloud.

  ***

  The next morning, a junior archivist named Jory found her in the atrium. Jory was twenty, bright-eyed, and terrified of making a mistake. He had been assigned to help Elara collate Varr's correspondence.

  "Archivist Vance?" Jory held a stack of datapads. "I've cross-referenced the Battle of Kessig. The Colonel's version says Varr ordered the charge at dawn. The diary says he waited until noon to spare the civilians caught in the valley."

  "And?" Elara asked.

  "And the Official Record needs to be consistent," Jory said, his voice tight. "If I'm going to... if I'm going to serve like him, I need to know which choice was the right one. Dawn or noon?"

  Elara looked at the boy. He was looking for a lever to pull. *If I pull this, I become a hero.*

  "Jory," Elara said, setting down her stylus. "Whom do you intend to imitate?"

  "General Varr, ma'am. He's the greatest of our generation."

  "Which Varr?"

  Jory blinked. "The... the Hero of the Republic."

  "There is no such person," Elara said softly. "There was a man who was tired. There was a man who was afraid. There was a man who made a calculation at Kessig that kept him awake for ten years. If you imitate the dawn charge, you are a butcher. If you imitate the noon wait, you are a derelict. Unless you know the wind, the terrain, and the weight of the oath in that specific hour, imitating him is suicide."

  "But..." Jory lowered the datapads. "Then what is the point of the *Life*? If we can't copy him, why do we write them? The curriculum says biography is the school of virtue."

  "The curriculum is wrong," Elara said. She looked out the window at the statue of the First Founder in the plaza. It was polished bronze, featureless and smooth. "We write them not so you can copy the steps, but so you can see the ground was uneven. Virtue isn't a path you walk, Jory. It's the balance you keep while walking."

  Jory looked confused, bordering on distressed. "But how will I know I'm balanced?"

  "You won't," Elara said. "Until you fall."

  ***

  The deadline arrived. The High Council chamber was cold, the air recycled to a sterile chill. The three faction leaders sat before her: the Colonel, the Senator, the Traditionalist.

  "Is it done?" the Senator asked.

  Elara placed the manuscript on the table. It was thick. "It is."

  The Colonel opened it, scanning the first chapter. His brow furrowed. "This section... here. You describe his hesitation before the Kessig charge. You quote his letter where he calls the mission 'folly'."

  "It is in the record," Elara said.

  The Traditionalist flipped to the end. "And here. You do not conclude that he died for the Old Laws. You conclude he died of exhaustion, exacerbated by a lack of support from this very Council."

  "He did," Elara said.

  The Senator leaned forward. "Archivist Vance, this manuscript is... messy. It lacks focus. A citizen reads this, what lesson does he take? That hesitation is good? That the Council is to blame? That exhaustion is inevitable?"

  "That life is difficult," Elara said. "And that virtue is not a costume you put on. It is the friction between who you are and what the situation demands."

  "This is not moral instruction," the Colonel snapped. "This is psychology. It is useless."

  "It is the truth," Elara countered. "If you publish the version you want, you create a generation of citizens who believe they must be flawless to be good. When they fail—and they will fail—they will not blame their judgment. They will blame the Republic. They will become cynics. Because the Varr you want never existed. No one can be him."

  The room was silent. The Senator closed the manuscript. He looked at Elara, and for a moment, she saw a flicker of recognition. He knew the burden of the mask he wore.

  "If we publish this," the Senator said quietly, "the people will not have a hero."

  "They will have a man," Elara said. "And perhaps they will learn that men are enough."

  The Traditionalist stood up. "We will review it."

  Elara stood as well. She knew they would edit it. They would sand down the edges. They would make Varr smooth, imitable, and false. They would resolve the Exemplar's Dilemma by choosing a lie.

  But as she walked out of the chamber, past the statues of the previous heroes who stared blankly into the middle distance, Elara felt a strange lightness. She had kept a copy. Not for the state, but for Jory.

  She would not teach him whom to imitate. She would teach him how to read the contradictions. She would teach him that the only life worth living is one that cannot be fully copied, only endured. And in a Republic of statues, that was the most dangerous, and necessary, lesson of all.
