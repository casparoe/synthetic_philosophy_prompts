prompt: |-
  ok so I'm putting together a bit for a philosophy-of-mind blog I run, and I need you to write the actual piece for me. Here's the conceit.

  It's the annual sustainability / ESG report from a mid-sized consumer-electronics company, except it's set in a world where panpsychism has quietly become the regulatory consensus -- like, it's now the boring official view that experience (or at least some form of it) goes all the way down, so the compliance people have had to fold it into the reporting. So the report has a "proto-experiential impact" section sitting right next to the usual carbon and water numbers. Deadpan corporate register the whole way through: numbered sections, a little metrics table, a quote from a fictional Chief Ethics Officer, a dry footnote from the outside auditors. You can invent the company, the regulator, and whatever units you want (I'm partial to "qualia-hours" but go with what works).

  The jokes need to come from getting the metaphysics right, not from winking at the reader: the combination problem (if the micro-experiences never add up to a subject, whose suffering is it, and can you even externalize it on a balance sheet?), the boundary problem (where does one moral patient stop and the next start -- is a rock one thing or a heap of them?), the gap between mere information-processing and actual experience (so a thermostat is doing something, but is it feeling anything?), whether anything without a unified subject can be harmed at all, and the awkward fact that if it's all one big experience then the whole ledger just collapses into itself. It should be funny to someone who's read Chalmers and the panpsychism literature, and still readable to someone who hasn't. Target is the corporate-ethics-metrics style and the general urge to turn any metaphysics into a KPI -- not any real company.

  ~650 words. No citations or reading list needed, obviously.

  Then tack on a short reality-check note at the end, maybe 150 words: which of the positions the report treats as settled are actually contested among people who work on this stuff, and where the satire leans on a contested reading of panpsychism rather than the consensus. Don't serve me a contested view as if it's the settled one.
