answer: |-
  Your conviction should survive, but only as an acknowledgement of moral residue rather than as a verdict of culpable guilt, for you were trapped in a genuine dilemma where any choice involved a breach of obligation.

  Regarding your brother's assertion that the collision was of your own making, there is a crucial distinction between responsibility for the predicament and justification for the act. If your daughter's crisis was unforeseeable when you promised your mother, the collision was not wholly self-induced, and your claim to having no choice in the moment remains valid even if your prior financial planning was imperfect. However, if liquidity could have preserved both the house and your daughter's escape, then you bear negligence for the situation, though this does not necessarily invalidate the necessity of the choice once the crisis arrived. A collision brought about by negligence attracts blame for the circumstance, but it does not alter the moral geometry of the decision itself; you still faced two incompatible duties, and the 'no choice' defence applies to the moment of action even if it fails to excuse the history leading to it.

  Your friend is correct that the nature of the claims matters, but not for the reason she suggests. While both obligations were promises, they were not of equal weight, for promises are conditioned by the substantive values they protect. A promise regarding property and sentiment cannot hold the same moral force as a promise regarding a child's health and safety; thus, the collision is not between identical claims but between hierarchical duties disguised as similar forms. It matters because a conflict between same-kind claims obscures the hierarchy, making the breach feel like a failure of integrity rather than a tragic necessity, but the collision is genuine because fulfilling the higher duty inevitably violates the lower one.

  The debt you owe your brother is real, not merely a feeling, but it is a debt of acknowledgement rather than a debt of admission. In moral philosophy, this is known as 'remainder'; even when one acts rightly in a dilemma, the value that was sacrificed demands recognition and regret. Owning this debt confirms that a wrong was done to him and your mother's memory, which validates your conviction that something wretched occurred, without confirming that you were wrong to choose your daughter's welfare. Therefore, your conviction should survive not as a stain on your character, but as an honourable scar testifying to the cost of doing what was necessary.
