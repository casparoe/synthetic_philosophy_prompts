answer: |-
  **Project Title:** The Genealogical Predicate: Disentangling the Definition of Life

  **Project Summary**
  This project does not propose a new definition of life. The literature on this subject is saturated with attempts to add a fourth clause to the standard formula or to refine necessary and sufficient conditions for biological capacities. Instead, this project argues that the debate is stagnant because participants conflate three distinct questions that only appear to be one: (1) Whether being alive is a matter of degree along a gradient of capacities; (2) Whether it is a linguistic threshold drawn by convention; and (3) Whether it is a matter of historical descent from the earliest replicating systems. By diagnosing this conflation, I aim to show that standard counterexamples (giant viruses, prions, transmissible tumours, sterile hybrids) are fatal only to views that answer one of these questions while being defended as an answer to another. The central hypothesis is that life is primarily a genealogical predicate rather than a capacity predicate. If correct, the hunt for functional capacities is a category mistake, and boundary cases resolve by descent rather than achievement.

  **Statement of Problem and Intellectual Merit**
  The definition of life is frequently cited as a philosophical embarrassment—a concept too vague for rigorous science yet too central to ignore. Current positions generally fall into two camps: essentialists who seek a capacity-based definition (e.g., metabolism, evolution, homeostasis) and sceptics who argue the concept is a Wittgensteinian family-resemblance term with no essence. Both camps leave the question open because they fail to distinguish between *what an organism does* and *where an organism comes from*.

  This conflation leads to persistent talking-past-each-other, typified by interdisciplinary seminars where biologists and philosophers argue past one another regarding edge cases. For example, a sterile hybrid is plainly alive but cannot evolve; a dormant microbe is alive but metabolically inactive; a giant virus has a larger genome than some bacteria but lacks independent replication. These are only paradoxes if we assume a single question is being asked. By separating the questions, this project offers a diagnostic framework that dissolves the paradoxes rather than solving them by fiat.

  The most significant philosophical consequence of this view—and the primary test of its viability—is its implication for synthetic biology. If life is a genealogical predicate, a synthetic organism assembled from non-living parts, even if capable of robust open-ended evolution, would not strictly count as "alive" on this account. This is a bullet that many theorists would refuse to bite. This project treats this consequence not as a dealbreaker, but as the decisive test case. The research will determine whether this implication is a *reductio ad absurdum* of the genealogical view or a necessary correction to our intuitions about creation and life.

  **Methodology and Work Plan**
  The work will proceed over one semester, utilizing the requested teaching relief to dedicate focused time to analysis and writing. The method is deliberately unglamorous and analytical, avoiding high-level abstraction in favor of case-based resolution.

  1.  **Case Inventory:** I will compile an inventory of disputed cases (viruses, prions, plasmids, transmissible tumours, dormant microbes, sterile hybrids). Each case will be mapped against the three distinct questions (capacity gradient, linguistic threshold, historical descent) to demonstrate how current definitions fail by conflating these categories.
  2.  **Pragmatic Analysis:** To ensure the definition has traction beyond metaphysics, I will conduct a small study of how the term is applied in contexts where it carries legal or safety consequences. This includes biosafety rules regarding biological agents, planetary-protection protocols for space exploration, and patent law regarding engineered organisms. These are domains where a definition must work rather than be admired.
  3.  **Positive Account and Stress Test:** I will draft a positive account of life as a genealogical predicate. This account will be tested against the synthetic organism case. The goal is to determine if the genealogical account offers independent explanatory power or if it collapses into a mere redescription of the first-replicator lineage.

  **Expected Outcomes and Deliverables**
  The primary deliverable is a paper of approximately 8,000 words suitable for submission to a journal in philosophy of biology or general philosophy of science. The paper will articulate the three-question diagnosis, defend the genealogical hypothesis, and confront the synthetic organism implication.

  Secondary to the paper, I will produce a short "decision procedure"—a practical heuristic that a non-philosopher (e.g., a patent clerk or biosafety officer) could apply to a new case to determine its status based on the separated questions. This ensures the project has utility beyond academic debate.

  I will use the travel funds to present a draft of the decision procedure at a one-day workshop, soliciting feedback from biologists and legal scholars to stress-test the practical applicability of the framework.

  **Risk Assessment and Failure Conditions**
  Intellectual honesty requires specifying what would count as failure for this project. There are two primary risks:
  1.  **Verbal Disputes:** It may turn out that once the three questions are separated, the residual disputes are merely verbal all the way down, with no substantive philosophical residue. If the separation reveals there is no "fact of the matter" to be found, the project must report this negative result rather than forcing a positive theory.
  2.  **Empty Redescription:** The genealogical account may turn out to be a redescription of the first-replicator lineage with no independent consequences for how we classify edge cases. If the genealogical view yields the same classifications as the capacity view but with more complexity, it should be abandoned.

  The requested semester of partial teaching relief is essential to navigate these risks. Working alone while teaching two courses, I require the protected time to rigorously attempt to falsify the genealogical hypothesis before committing to the final draft. If the hypothesis fails these internal tests, the final paper will argue for the dissolution of the problem rather than a solution, which remains a valuable contribution to the field.

  **Budget Justification**
  The funds requested are for travel to a specialized one-day workshop to present the decision procedure. This targeted feedback is necessary to ensure the pragmatic component of the research meets the needs of non-philosophical stakeholders. The teaching relief is the critical resource, allowing for the deep concentration required to disentangle the conflated questions without the fragmentation of a standard teaching load.
