answer: |-
  You are absolutely not overthinking this. In fact, you have stumbled onto the exact fault lines where the philosophy of social ontology is still actively fighting. Your intuitions are tracking distinctions that David Lewis made in *Convention* (1969), but also distinctions that later theorists (like Margaret Gilbert, Cristina Bicchieri, and Ruth Millikan) argued Lewis got wrong.

  Since you are in a seminar on Lewis, you need a principle that respects his text but accounts for your specific friction points. Here is the breakdown of the principle that captures most of your verdicts, the specific clause doing the work, and the honest trade-offs you have to make.

  ### The Principle: "Lewisian Coordination + Common Knowledge"

  To capture your verdicts on Driving, the Wrist-Flick, and the Shady Street (crowd version), while excluding the Dorm and the Shady Street (shade version), you need a three-part test.

  **A regularity $R$ in a population $P$ is a convention if and only if:**
  1.  **Regularity & Expectation:** Everyone conforms to $R$, and everyone expects everyone else to conform to $R$.
  2.  **Conditional Preference (The Coordination Clause):** Everyone prefers to conform to $R$ *on the condition that* others do. (Crucially: The preference for the action depends on the expectation of the action, usually to avoid a coordination failure).
  3.  **Arbitrariness:** There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well, and if $R'$ had been established first, everyone would prefer to conform to $R'$ instead.
  4.  *(Lewis's Secret Sauce)* **Common Knowledge:** All of the above is common knowledge in $P$ (everyone knows it, everyone knows everyone knows it, ad infinitum).

  ### How This Principle Handles Your Cases

  **1. Driving on the Right & The Wrist-Flick (Verdict: Convention)**
  *   **Why it fits:** These pass all four tests.
  *   **The Workhorse Clause:** *Arbitrariness.* Driving on the left would have worked just as well. The wrist-flick could have been a nod. The fact that the wrist-flick started from a tic (historical accident) rather than a vote doesn't matter; Lewis is explicit that conventions evolve, they aren't signed contracts.
  *   **Law:** Lewis explicitly addresses this. A law can codify a convention. If the law is the *only* reason people drive on the right (fear of prison, not fear of crashes), it's not a convention. But if the law just reinforces the coordination equilibrium you already wanted, it remains a convention. Your intuition here is correct: legal backing doesn't kill the convention status unless it replaces the coordination motive entirely.

  **2. The Dorm Drinking (Verdict: Not a Convention)**
  *   **Why it fits:** This is the most important case for your seminar.
  *   **The Workhorse Clause:** *Conditional Preference* and *Common Knowledge.*
      *   In a true Lewis convention, I prefer to drive on the right *because* you do, and we both know that avoids a crash. Our interests align.
      *   In the Dorm case, everyone privately prefers Quiet > Drinking. They only drink because they *falsely believe* others prefer Drinking. This is **Pluralistic Ignorance**, not Common Knowledge.
      *   Lewis requires that the preferences sustaining the equilibrium be real and known. Since the dormites are acting on false empirical beliefs about each other's desires, this fails the Common Knowledge condition. It is a *Social Norm* (sustained by fear of sanctions/buzzkill status), not a Lewisian *Convention* (sustained by coordination).
  *   **The Trade-off:** To keep your verdict that this is *not* a convention, you must accept that "Social Norms" and "Conventions" are distinct categories. Many modern sociologists lump them together. Lewis keeps them apart.

  **3. The Shady Street (Verdict: Split)**
  *   **Shade Version (Not a Convention):** Fails *Arbitrariness*. If the north side is objectively shadier, there is a "natural reason" for the regularity. If the south side were shadier, they would walk there. The regularity is dictated by nature, not mutual expectation.
  *   **Crowd Version (Convention):** Passes *Arbitrariness*. If both sides are equal, but I walk north *because* you walk north (to avoid bumping into people), then it is arbitrary which side we chose, but essential that we match.
  *   **The Trade-off:** You have to be precise about "Arbitrariness." Lewis admits conventions can have *some* natural reason (e.g., shouting is better than whispering for distance), but the specific choice (which word to shout) must be arbitrary. If the natural reason dictates the *entire* regularity, it's not a convention.

  ### The Edge Cases & What You Might Have to Drop

  Here is where you have to make hard choices to stay consistent with the principle above.

  **1. The Couple (Dyads)**
  *   **Lewis's View:** Lewis explicitly allows populations of two.
  *   **Verdict:** It is a convention.
  *   **Cost:** If you feel a convention requires a "society" or a large group, you have to drop that intuition. Lewis is fine with "private conventions."

  **2. The Inarticulable Rule**
  *   **Lewis's View:** Lewis requires **Common Knowledge**.
  *   **The Conflict:** Common Knowledge is a very high bar. It implies that if you asked them, they could reason through the chain of "I know that you know..."
  *   **Verdict:** If the villagers *cannot* state why they do it, Lewis might say this fails the Common Knowledge condition.
  *   **What to Drop:** If you want to say "Yes, it's still a convention even if they can't explain it," **you must drop the Common Knowledge clause.** This is the most common criticism of Lewis. Philosophers like Ruth Millikan or Tyler Burge argue for "proper function" or implicit understanding instead of high-level common knowledge. *Warning:* If you drop Common Knowledge, the Dorm case might sneak back in, because they implicitly "know" the pattern even if their beliefs about preferences are wrong.

  **3. Tipping (60%) & Bilingual (Generational Split)**
  *   **Lewis's View:** Lewis deals in idealizations. He assumes a stable equilibrium.
  *   **Verdict:** Lewis's theory struggles here. A 60% regularity is not "Everyone conforms."
  *   **What to Drop:** You have to accept that Lewis's definition is **synchronic and idealized**. It describes a convention at its peak stability. It does not have good tools for "dying conventions" or "competing conventions." If you want to count the 60% tipping as a convention, you need to move to a **gradualist** theory (like Brian Skyrms or Cristina Bicchieri), where conventions are matters of degree based on empirical expectations.

  ### Settled vs. Contested in the Literature

  You asked for an honest note on the state of the field. Here is the map:

  **1. Common Knowledge (Highly Contested)**
  *   *Lewis:* Essential.
  *   *Critics:* Too cognitively demanding. Humans follow conventions without infinite recursive knowledge.
  *   *Your Move:* If you think the "inarticulable rule" case is a convention, you are siding with the critics (Millikan, Burge, Skyrms) against Lewis on this specific clause.

  **2. Norms vs. Conventions (The Dorm Case) (Contested)**
  *   *Lewis:* Distinct. Conventions solve coordination problems (interests align). Norms solve Prisoner's Dilemmas (interests conflict, sanctions enforce compliance).
  *   *Modern Social Ontology (Bicchieri/Gilbert):* Often blurred. Bicchieri argues norms *are* a type of convention dependent on empirical and normative expectations.
  *   *Your Move:* Your gut says the Dorm case is *not* a convention. This aligns with **Lewis**. If you side with modern norm theorists, you might have to call it a convention. Stick with Lewis for your seminar to keep your verdict safe.

  **3. Arbitrariness (Settled but Nuanced)**
  *   *Consensus:* There must be an alternative. However, there is debate on how "equal" the alternative must be. (e.g., Is QWERTY a convention if Dvorak is technically better but harder to switch to? Yes, usually).
  *   *Your Move:* Your Shady Street intuition is spot on with the consensus. If nature dictates it, it's not arbitrary. If crowd dictates it, it is.

  **4. Population Size (Settled)**
  *   *Consensus:* Dyads count. Lewis's examples often involve just two rowers or two hunters.
  *   *Your Move:* Accept the Couple case as a convention.

  ### Summary Advice for Your Seminar

  To keep your core intuitions (Driving = Yes, Wrist-Flick = Yes, Dorm = No, Shade = No, Crowd = Yes), adopt this modified Lewisian principle:

  > "A convention is an **arbitrary** regularity sustained by **mutual expectations of coordination**, where agents prefer to conform **conditional on others conforming**."

  **The Verdicts you must sacrifice to keep this clean:**
  1.  **Common Knowledge:** You likely need to relax this to "Mutual Belief" to allow for inarticulable rules. If you keep strict Common Knowledge, you have to say the inarticulable village *doesn't* have a convention.
  2.  **Stability:** You have to admit Lewis's theory doesn't handle the "60% Tipping" or "Bilingual Transition" cases well. You should classify those as "conventions in decay" or "competing conventions," acknowledging the theory is idealized.
  3.  **The Dorm Case:** Be prepared to defend why this isn't a convention. The answer is: **"It fails the Coordination Clause. In a convention, we want to do the same thing. In the Dorm, we all want to do a *different* thing (be quiet) but are trapped by false beliefs. That is a Norm, not a Convention."**

  You aren't overthinking it; you're noticing that Lewis's definition is a sharp knife that cuts some things (like norms) away from others (like conventions), and your intuitions are sharp enough to feel that cut. Stick with the distinction between *Coordination* (Lewis) and *Normative Sanction* (Dorm), and you'll be on solid ground.
