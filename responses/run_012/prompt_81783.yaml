answer: |-
  You have put your finger on a genuine and deeply troubling pattern in contemporary epistemology and philosophy of science, and it is no surprise that your reading group struggled to label it. While there is no single canonical term that covers every instance you described across cosmology, simulation theory, and evolutionary ethics, the closest established concept is what some philosophers call epistemic self-undermining, though others, particularly in the philosophy of physics, refer to it as cognitive instability. The reason you cannot find a perfect fit is that this problem sits at the intersection of probability, self-locating belief, and the norms of rational justification, so it often gets discussed under the specific name of the paradox rather than the general structure. However, treating it as a distinct family of arguments is the right instinct, and epistemic self-undermining is the most precise label for the carving you are looking for.

  The core structure you identified is indeed distinct from classical skepticism. When Descartes worries about an evil demon or a brain in a vat, he is proposing an external possibility that undermines his evidence from the outside. He does not claim that the hypothesis of the external world predicts that he is a brain in a vat. In your cases, the hypothesis itself generates the doubt. If the cosmological model is true, it predicts that most observers are Boltzmann brains. If the simulation hypothesis is true, it predicts that most observers are simulations. If the evolutionary debunking argument is true, it predicts that most moral beliefs are fitness-tracking rather than truth-tracking. The hypothesis swallows its own tail by implying that the very cognitive machinery used to formulate the hypothesis is likely malfunctioning or unconnected to reality. This is why it differs from simple logical self-refutation. A statement like all statements are false is logically incoherent because it cannot be true under any circumstances. An epistemically self-undermining hypothesis can be true. The universe could actually be full of Boltzmann brains. The problem is not that the world cannot be that way, but that a believer cannot rationally occupy that position. If the hypothesis is true, you have no reason to believe it, because the hypothesis tells you that your reasons are likely noise.

  This leads directly to the normative question of whether this is a fatal defect. In most formal treatments, the answer is yes. A theory that destroys the bridge of inference used to reach it is considered rationally untenable. In Bayesian terms, if a hypothesis assigns a very low probability to the evidence you actually have, because it says that evidence is likely to be random fluctuation or systematic deception, then the likelihood term in Bayes theorem collapses. You cannot update in favor of a theory that tells you your data is garbage. This is why cosmologists treat the prediction of abundant Boltzmann brains as a reductio ad absurdum against certain models of eternal inflation. They do not say the model is logically impossible, but that it is epistemically inaccessible, and since we must rely on epistemic access to do science, the model must be discarded or modified. The same logic applies to the evolutionary debunking of mathematics. If you argue that evolution shaped our math faculties solely for survival, you undermine the reliability of the mathematical reasoning used to construct the theory of evolution itself. To avoid this, proponents of evolutionary debunking usually have to carve out a exception for logical or mathematical faculties, arguing that those specific faculties were constrained by reality in a way moral faculties were not, precisely to avoid this self-undermining loop.

  The boundaries of this concept are where the carving becomes most useful, and your intuition about the edges is correct. The first boundary condition concerns proportion. The argument only triggers if the unreliable observers vastly outnumber the reliable ones. If a cosmological model predicts that only one in a million observers are Boltzmann brains, the argument does not gain traction. You can still reasonably assume you are in the majority class of ordinary observers. The force of the argument comes from the indifference principle or the self-sampling assumption, which suggests you should reason as if you are a random observer from the set of all observers. If the set is dominated by deceived observers, you are likely deceived. If the set is dominated by reliable observers, you are likely reliable. So a theory is only self-undermining if it predicts that you are likely atypical in a way that compromises your evidence.

  The second boundary condition concerns the scope of the deception. A hypothesis can predict that most observers are deceived without undermining itself, provided the deception does not touch the evidence used to support the hypothesis. For example, a theory might claim that most people have false memories of their childhoods. This does not undermine the physical evidence used to prove the theory, unless the theory also claims that physical evidence is generally unreliable. In the cases you listed, the deception is global. The Boltzmann brain has false memories of reading books. The simulated being has false sensory data of a physical world. The evolved being has false intuitions about moral truth. The unreliability must target the specific cognitive faculties or data streams used to arrive at the hypothesis. If the unreliable beings never form the belief in question, the problem also dissolves. If Boltzmann brains fluctuate into existence but dissolve before they can formulate cosmological theories, then only ordinary observers believe the theory, and the theory is safe. The paradox requires that the unreliable beings are capable of holding the belief but are wrong about why they hold it or what it implies about their surroundings.

  The third boundary condition involves the nature of the unreliability. It is not enough that the beings are rare. They must be epistemically compromised. If a theory says that most observers live in a distant galaxy and never see Earth, that does not undermine my belief that I am on Earth, provided my local evidence is sound. The unreliability must be such that the connection between the evidence and the conclusion is severed. This is why the evolutionary debunking argument is so tricky. It claims our moral faculties are shaped for fitness, not truth. But if fitness correlates with truth, the link is preserved. The self-undermining only occurs if there is no correlation between the selected trait and the truth of the belief.

  If you need a term to use in your reading group that captures this specific shape without relying on the specific cosmological or simulation context, I suggest sticking with epistemic self-undermining. It is descriptive enough to be understood without prior technical knowledge and precise enough to distinguish the phenomenon from general skepticism. You should define it as a hypothesis that, if true, lowers the probability that the believer is in a position to know it is true. This distinguishes it from hard self-contradiction, where the hypothesis cannot be true, and from external skepticism, where the doubt comes from outside the hypothesis. It also distinguishes it from mere observer selection effects, which are neutral tools until they generate this specific kind of instability.

  Ultimately, this pattern serves as a filter for theories. It tells us that a complete theory of the world must include an account of the observer that validates the observer's capacity to know the theory. A cosmology that makes cosmologists impossible is bad cosmology. An evolutionary theory that makes evolutionary biologists impossible is bad biology. The requirement is not that the theory guarantees truth, but that it does not predict systematic deception regarding the evidence used to support it. When a theory fails this test, it is not necessarily false, but it is rationally uninhabitable. We cannot stand on a ladder that predicts its own rungs are made of smoke. This is the carving you were looking for, and it is a robust one. It separates theories that are merely strange from theories that are epistemically suicidal.
