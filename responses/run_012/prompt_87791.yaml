answer: |-
  The lamp on the table sputtered, the wick drowning in a pool of its own grease. Outside the open window, the cicadas of Cirey sawed at the summer dark. On the green baize cloth between them lay the scattered debris of a game of basset: gold louis, ivory counters, and a deck of cards worn soft at the edges.

  The Marquise gathered the winnings into a neat stack, the gold clicking softly.

  "You play as if you have no need of the money," the Abbé observed. He sat back in his cane chair, hands folded over his stomach, his face a mask of serene amusement. "And yet you play as if your life depended on the turn of the queen."

  "My life does depend on it, Abbé. Just not in the way you mean." She pushed the coins aside and began shuffling the deck, the riffle sharp and rhythmic. "If I treat the game as a necessity, I become a slave to fortune. If I treat it as a diversion, I am its master. The cards are the same; the happiness is in the handling."

  "A convenient distinction," the Abbé said. "But it relies on a sleight of hand. You claim to author your contentment, yet you build it upon passions—love, play, study. These are winds, Madame. They blow where they list. To build a house on them is not art; it is negligence."

  "It is architecture," she corrected, dealing two cards face down. "One does not blame the wind for blowing; one builds the chimney to draw. I do not ask the world to be still. I ask myself to be agile. You Stoics speak of freedom from passion as if it were a liberation. I see it as a lobotomy. If I cut away the capacity to be wounded by loss, do I not also cut away the capacity to be delighted by gain?"

  "You confuse the sensation with the value," the Abbé replied gently. "The delight you speak of is a fever. It rises and falls. I propose a health that is constant. To understand necessity—to see that the loss of the coin, the cooling of a lover, the cessation of the breath, are all equally necessary—is to render fortune powerless. She can confiscate nothing from a man who claims ownership of nothing."

  "And lives in a cellar," she said, turning over a king. "You offer me a fortress, Abbé. I prefer a garden. Yes, the frost may come. Yes, the flowers will die. But I choose to look at the bloom, not the frost. You call this illusion. I call it focus."

  "It is a fragile focus," the Abbé pressed, leaning forward slightly. "Because it requires you to maintain the picture. And here lies the rot in the foundation. You are a woman of profound intellect. You know the mechanics of your own happiness. You know you are choosing to look at the bloom and ignore the frost. Does that knowledge not poison the view? If I tell myself, *'I am now cultivating an agreeable illusion,'* have I not already shattered it? The man who knows he is dreaming cannot enjoy the dream."

  The Marquise paused, her hand hovering over a card. She looked at him, her eyes bright in the lamplight.

  "Consider the theater, Abbé. We sit in the dark. We know the wood and paint on the stage are not a forest. We know the actor's grief is rehearsed. We know the tragedy is invented. And yet, we weep. Does the knowledge of the mechanism destroy the emotion? Or does it refine it?"

  "It creates a distance," the Abbé countered. "You weep for yourself, for your own capacity to feel, not for the character. It is a narcissism of sentiment."

  "It is a collaboration," she insisted. "I consent to the illusion. That consent is the art. I do not hold a *false belief*. I do not believe the cards love me. I do not believe my lover will never leave. I simply refuse to invite those truths to dinner when I am eating dessert. There is a difference between a lie and a guest list. I am not denying the existence of death, Abbé. I am denying it the right to sit at my table."

  "But you have just invited it," the Abbé pointed out. "By defining your happiness as a refusal of death, you make death the central pillar of your philosophy. You are fighting the very ghost you claim to ignore. Is this not a passion? This frantic strewing of flowers—is it not a terror of the bare ground?"

  The Marquise stopped shuffling. She placed the deck down precisely in the center of the table.

  "And you," she said softly. "This tranquility you prize. This *ataraxia*. You say it is the result of reason. Of seeing things as they are. But tell me, Abbé: why do you prefer the cold stone to the flower? Why is the bare ground more virtuous than the garden?"

  "Because it is true."

  "Is it?" She leaned in, matching his posture. "Or is it merely your taste? You have a passion for lucidity. It excites you. To strip away the veil gives you a thrill that rivals any gambler's turn. You are not free from passion, my friend. You have simply chosen a master with a better reputation. You love Truth the way a miser loves Gold. You hoard it. You polish it. You would rather be cold and right than warm and mistaken."

  The Abbé blinked. The lamp flickered, casting a long shadow of the card tower between them. He did not look away, but the serene amusement tightened into something more thoughtful.

  "That is a sharp cut, Madame."

  "It is an observation. If happiness is the end, and there are many routes... why is your route of 'necessity' superior to mine of 'art,' save that it flatters your vanity to call it Reason? You say my happiness is self-undermining because I know I choose it. But your happiness is self-undermining because you pretend you did not choose it. You pretend you are compelled by the nature of things, when in fact you are compelled by your own love of severity."

  The Abbé sat back. He reached out and trimmed the wick of the lamp with his fingers, a small, precise motion. The light steadied, burning brighter.

  "I will grant you this," he said quietly. "The love of truth may be a passion. It burns, certainly. Sometimes it consumes. But a fire that burns the house down is not the same as a fire that cooks the meal. My path offers a shelter that does not depend on the fuel of illusion. If you lose your taste for the garden, Madame, what remains?"

  "If I lose my taste for the garden," she said, gathering the cards again, "I shall build a library. Or fall in love again. Or learn Newton's calculus anew. I am not a vessel to be filled, Abbé. I am a flame. I do not need to be permanent to be real."

  "And when the oil runs out?"

  "Then I go out," she said, turning the top card. It was the Ace of Spades. She smiled, without superstition. "And I shall not have wasted the light repenting of the dark."

  The Abbé looked at the card, then at her. He sighed, a sound that was not quite defeat, but perhaps a recognition of a limit he could not cross.

  "You are a formidable adversary, Madame."

  "I am a happy one," she corrected. "Deal the cards, Abbé. Let us see if fortune agrees."

  The Abbé reached for the deck. His touch was cool, hers warm. He began to deal, the rhythm of the game resuming, the argument suspended like dust motes in the lamp's glow, neither settled nor dispelled.
