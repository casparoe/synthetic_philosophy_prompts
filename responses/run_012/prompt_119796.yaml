  I'm convening a two-year working group of four people -- two logicians, an epistemologist, and someone who works on probabilistic inference -- and the nominal topic is the problem of logical omniscience: the fact that standard possible-worlds models of belief make agents believe everything that follows from what they believe. I need an agenda, not a survey. Assume the group can handle technical material, and that we are not interested in re-litigating whether the idealization is harmless because all models idealize; I want to know which open questions are worth two years of four people's attention.

  Candidates I would put on the table, though I am open to being told I have mis-framed them: whether the repair should be semantic (impossible worlds, awareness-style restrictions on the models) or syntactic and procedural (belief as a structured object, inference as a process rather than a closure condition); whether the real defect is the closure conditions or the assumption that agents know every logical truth; whether the idealization distorts the subject matter rather than merely simplifying it, given that what we want a theory of is precisely the kind of reasoning whose correctness turns on logic; how bounded agents ought to reason under logical uncertainty, and whether that is the same problem or a neighboring one; and whether any of this touches norms of rationality, i.e. whether an agent who fails to see a consequence may be criticized for it.

