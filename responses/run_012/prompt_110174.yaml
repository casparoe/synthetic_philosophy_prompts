  │       │       │   │   │       │   │   (Contingent failure)    │
  │       │       │   │   │       │   │   └── (Leads to Classic No│
  │       │       │   │   │       │   │       with caveats)       │
  │       │       │   │   │       │   └── In the Concept Link     │
  │       │       │   │   │       │       (Necessary failure)     │
  │       │       │   │   │       │       └── LEAF: CLASSIC NO    │
  │       │       │   │   │       │           (He has the data,   │
  │       │       │   │   │       │            but must learn the │
  │       │       │   │   │       │            correspondence.)   │
  │       │       │   │   │       │                               │
  │       │       │   └── CONCEPTUAL (Analyze the ideas)          │
  │       │       │       │                                       │
  │       │       │       ├── Q6: HOW IS THE LINK KNOWN?          │
  │       │       │       │   ├── By Reasoning (Geometry)         │
  │       │       │       │   │   └── LEAF: YES (COMMON GEOMETRY) │
