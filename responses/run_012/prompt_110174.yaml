  # Molyneux's Question: A Decision Tree for the First Meeting

  ```text
  START: The newly sighted patient faces a cube and a sphere.
  │
  ├── Q1: WHAT IS THE TASK?
  │   ├── "Reach out and grab the cube" (Motor Action)
  │   │   └── LEAF: TWO-VISUAL-STREAMS ANSWER
  │   │       (He grasps correctly but cannot verbally identify; 
  │   │        vision-for-action works, vision-for-perception does not.)
  │   │
  │   └── "Tell me which is the cube" (Verbal Identification) ──┐
  │                                                              │
  ├── Q2: DO VISION AND TOUCH SHARE A COMMON FORMAT?             │
