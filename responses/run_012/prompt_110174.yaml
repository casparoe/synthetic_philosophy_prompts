  │   │   ├── Is an innate link possible between distinct        │
  │   │   │   properties without experience?                     │
  │   │   │   ├── YES ──> [EMPTY COMBINATION: INCOHERENT]        │
  │   │   │   │          (See note below)                        │
  │   │   │   └── NO ──> LEAF: RADICAL NO                        │
  │   │   │              (Nothing to transfer; learning is        │
  │   │   │               impossible in principle.)              │
  │   │   │                                                      │
  │   │   └── (If YES, they share a format) ──┐                  │
  │   │                                       │                  │
  │   └── YES (They share spatial properties) ─┘                  │
  │       │                                                       │
  │       ├── Q3: WHAT EXACTLY IS SHARED?                         │
  │       │   ├── Extension/Space only, not Specific Shape        │
  │       │   │   └── LEAF: SPACE YES, SHAPE NO                   │
  │       │   │       (He knows they occupy space, but not         │
  │       │   │        which shape is which.)                     │
  │       │   │                                                   │
  │       │   └── Specific Shape (Geometry)                       │
  │       │       │                                               │
  │       │       ├── Q4: IS THE QUESTION EMPIRICAL OR CONCEPTUAL?│
  │       │       │   ├── EMPIRICAL (Wait for surgery results)    │
  │       │       │   │   ├── Does complexity matter?             │
  │       │       │   │   │   ├── YES (2D easy, 3D hard)          │
  │       │       │   │   │   │   └── LEAF: SPLIT ANSWER          │
