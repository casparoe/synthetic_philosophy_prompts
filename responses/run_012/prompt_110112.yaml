  8.  *(Self-Correction on "Incoherence"):* Be precise. The PLA argues that a language referring *only* to private sensations is incoherent. Chuck isn't doing that. He's using public words. So the film tests the *conditions of application*, not the *logical possibility* of the language itself. I must make this distinction clear. The film tests the *sustainability of the form of life*, not the *logic of the grammar*.

  9.  *(Refining the Wilson/Criteria point):* If Chuck supplies the criteria, isn't that private? Yes, but Wittgenstein says private criteria are no criteria. Chuck knows this deep down—that's why he loses Wilson. The loss of Wilson is the loss of the *illusion* of criteria.

  10. **Finalizing the Structure:**
