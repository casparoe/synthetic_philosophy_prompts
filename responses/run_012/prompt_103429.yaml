          *   *Tension:* Consequentialism judges acts by outcomes. (2) judges acts by impact on specific individuals. In NIP cases, the outcome (total welfare) might be higher in the high-carbon scenario (if the people who exist have lives worth living), but (1) says it's wrong.
          *   *Fix:* Align definition of "wrong." For a consequentialist, "wrong" = "suboptimal." (2) is the outlier.

  4.  **Structuring the Response:**
      *   **Acknowledge the sophistication:** This is a well-thought-out set of views (Parfit, Ramsey, NIP all present).
      *   **Rank the Tensions:**
          1.  **The Non-Identity/Person-Affecting Crash (1, 2, 3, 8).** The core logical contradiction.
          2.  **The Discounting/Injustice Mismatch (1, 4, 5).** The moral weight vs. economic weight issue.
          3.  **The Agent-Neutrality Puzzle (6, 7, Methodology).** Why the actor matters in a consequentialist frame.
      *   **Address the "Fake Problems":**
          *   (4) & (5) are actually consistent *if* interpreted strictly (Ramsey Rule).
          *   (6) & (7) are consistent *if* based on marginal utility.
      *   **Recommendations:** Which commitment to drop?
          *   Drop (2). It's the bottleneck. It forces the NIP contradiction and clashes with consequentialism.
          *   Refine (8). Embrace "harmless wronging" but ground it in impersonal value (Total Utilitarianism-lite) rather than person-affecting.
      *   **Workshop Prep:** Anticipate objections based on these tensions.

  5.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Correction on Discounting:* A 2% discount rate is actually quite high if it's *only* probability and growth. Stern Review used 0.1%. Nordhaus used higher. If the user claims (5) (no pure time preference) but uses 2%, they need to justify that 2% comes entirely from $g \times \eta$ (growth elasticity) + extinction risk. If they can't justify the math, (4) and (5) clash.
      *   *Correction on Consequentialism:* The user says "no side-constraints." But (2) acts like a constraint (must be bad for *somebody*). This is a "Person-Affecting Consequentialism," which is notoriously unstable. I need to point out that this specific hybrid is the fragile part.
      *   *On (6) & (7):* This is the "Common But Differentiated Responsibilities" (CBDR) principle. It fits consequentialism if you value equality. But if the future harm is *existential*, does the poor country's development outweigh it? The user needs to be ready for the "threshold" objection.

  6.  **Final Polish:**
