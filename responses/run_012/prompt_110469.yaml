  ### 5. The One True Concept
  If I must defend exactly one item as a real Family Resemblance concept and label the rest imposters: **Genre**.

  **Why:** *Game* is the canonical example, but Bernard Suits successfully defined it (lusory attitude), making it suspect. *Art* and *Religion* are often institutional or functional. *Bald* is vague. *Genre* (e.g., *noir*, *romance*, *sci-fi*) relies purely on overlapping stylistic, thematic, and narrative features. There is no "essence" of sci-fi, no institution that grants sci-fi status, and no gradient of "sci-fi-ness." It is purely a network of resemblances. It is the cleanest logical fit for Wittgenstein's structure without the baggage of rules (Game) or norms (Democracy).

  ---

  ### 6. Vagueness vs. Family Resemblance
  **Best Pair to Distinguish:** **Game** (FR) and **Bald** (Vagueness).
  *   **Why:** Both resist definition (High A), but *Game* survives the Orphan Test (network) while *Bald* fails it (gradient). This forces students to see that "hard to define" does not automatically mean "family resemblance."

  **Worst Pair (Wrong Impression):** **Bald** and **Tall**.
  *   **Why:** Both are vague Sorites series. Teaching them together reinforces the mistake that vagueness *is* family resemblance. Students will leave thinking FR is just about "where do you draw the line," which is exactly what Wittgenstein wasn't talking about.

