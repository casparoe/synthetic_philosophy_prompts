  ### 4. Discrepancy Flags (A vs. Orphan Test ≥ 3)
  *Flagged where Score A suggests "No Definition" but Orphan Test suggests "Prototype Dependence."*

  *   **Bald (Diff 8):** A=9, C=1. **The Orphan Test tracks the real thing.** High A signals vagueness, not family resemblance. Remove the clearly bald, and the concept loses its anchor; FR concepts should survive the loss of central cases because they are networks, not gradients.
  *   **Democracy (Diff 3):** A=8, C=5. **Score A tracks the real thing.** This is an essentially contested concept, not a prototype. The concept survives the loss of Athens or America because it is normative, not descriptive.
  *   **Species (Diff 4):** A=6, C=2. **The Orphan Test tracks the real thing.** High A suggests FR, but low C reveals natural kind essentialism. Remove mammals, and "species" loses its biological taxonomic backbone; it's not a loose network.
  *   **Money (Diff 4):** A=5, C=1. **The Orphan Test tracks the real thing.** Money is an institutional fact, not a resemblance class. Remove currency/banking, and the word refers to nothing; it requires a central system to exist.

  **Verdict on Your Orphan Test:** Your suspicion is correct. The Orphan Test measures **prototype anchoring**, not family resemblance. A true Family Resemblance concept is a mesh; cutting one strand (even a thick one) shouldn't collapse the net. A Prototype concept is a hub-and-spoke; cut the hub, and the spokes fall off. Vagueness concepts (like *bald*) also fail the Orphan Test because they rely on the extremes to define the gradient.

  **A Better Test:** The **Weave Test**. Take two marginal cases that share no features with each other (e.g., Solitaire and Ring-around-the-rosy). Can you trace a chain of overlapping similarities connecting them without appealing to a central prototype? If yes, it's FR. If no, it's polysemy or vagueness.

