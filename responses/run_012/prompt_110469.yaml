answer: |-
  ### 1. Brainstorm: What "Family Resemblance" Actually Means
  Before scoring, stop conflating these distinct phenomena. Most seminars mash them together.
  1.  **Classical FR (Wittgenstein):** Overlapping similarities with no single common thread *in practice* (e.g., games).
  2.  **Prototype Theory (Rosch):** Psychological centrality; some members are "better" examples than others (e.g., robin vs. penguin for *bird*).
  3.  **Cluster Concepts (Sibley):** Properties cluster statistically, but none are strictly necessary (e.g., *art*).
  4.  **Polysemy/Homonymy:** Distinct senses sharing a label (e.g., *bank* of river vs. *bank* for money).
  5.  **Vagueness (Sorites):** Boundary indeterminacy, not structural lack of essence (e.g., *bald*).
  6.  **Open Texture (Waismann):** Possibility of unforeseen cases expanding the concept (e.g., *vehicle* including drones).
  7.  **Essentially Contested Concepts (Gallie):** Normative disagreement built into the concept (e.g., *democracy*).

  ---

  ### 2. The Scores
  *Scale A: N&S Definition Failure (10 = Impossible, 0 = Easy)*
  *Scale B: Harm of Enforcement (10 = Catastrophic, 0 = Harmless)*
  *Scale C: Orphan Test (10 = Concept survives center loss, 0 = Concept collapses)*

  | Item | A (Def Fail) | B (Harm) | C (Orphan) |
  | :--- | :---: | :---: | :---: |
  | **Game** | 10 | 8 | 9 |
  | **Bald** | 9 | 1 | 1 |
  | **Religion** | 9 | 8 | 8 |
  | **Genre** | 9 | 5 | 9 |
  | **Art** | 8 | 7 | 7 |
  | **Sport** | 8 | 6 | 7 |
  | **Jazz** | 8 | 6 | 7 |
  | **Democracy** | 8 | 9 | 5 |
  | **Knowledge** | 7 | 8 | 5 |
  | **Courage** | 7 | 5 | 6 |
  | **Species** | 6 | 9 | 2 |
  | **Money** | 5 | 9 | 1 |
  | **Chair** | 3 | 1 | 3 |
  | **Number** | 1 | 10 | 1 |

  ---

  ### 3. Ranking by Score A (Definition Failure)
  1.  **Game (10):** No single feature spans all games; rules, competition, and fun are all violable.
  2.  **Bald (9):** No precise hair count defines the boundary, though the concept is gradient, not structural.
  3.  **Religion (9):** No common belief or practice unites Buddhism, Christianity, and Animism.
  4.  **Genre (9):** Classification relies entirely on overlapping stylistic features without necessary conditions.
  5.  **Art (8):** Institutional and historical shifts constantly outrun any static definition.
  6.  **Sport (8):** Physical exertion and competition are contested at the margins (e-sports, chess).
  7.  **Jazz (8):** Improvisation and swing are central but not universally present in all cited works.
  8.  **Democracy (8):** Procedural and substantive definitions conflict irreconcilably in practice.
  9.  **Knowledge (7):** Gettier cases broke JTB, but epistemologists still chase necessary conditions.
  10. **Courage (7):** Context-dependent virtue lacking a uniform behavioral signature.
  11. **Species (6):** Biological species concepts exist but fail at hybridization and ring species boundaries.
  12. **Money (5):** Functional definitions (medium of exchange) work until crypto or hyperinflation breaks them.
  13. **Chair (3):** Functional essence (seat for one) covers almost all cases despite weird outliers.
