prompt: |-
  So my friends Dana and Marcus got into this huge fight at my apartment last night and I've been thinking about it all day. It started because Marcus said he'd been reading about moral worth and that he thinks Kant was basically wrong that an action only counts as morally good if you do it out of duty. Dana is more sympathetic to Kant and it went from there. We were up arguing about it till like 2am and I honestly don't know who was making sense. Can you go through it move by move and tell me who's right about which bits? I want a real adjudication, not just a summary of what philosophers say. Please write in American English.

  Here's roughly how it went:

  Dana started with the shopkeeper thing. She said imagine a shopkeeper who never cheats his customers, but only because cheating would ruin his reputation. He does the right thing, but he doesn't get any moral credit, because he's just being prudent. Then imagine a shopkeeper who doesn't cheat because he thinks cheating is wrong. Same action, different worth. She said that shows moral worth has to come from the motive, specifically from doing it because it's right.

  Marcus said fine, but then she has to admit the person who doesn't cheat because he genuinely likes his customers and would feel awful hurting them also gets no credit on her view, and that seems wrong. Dana said that's right, actually — the warm feelings are just temperament, they're not a moral achievement, and if he woke up tomorrow in a bad mood he might cheat. She said you can never actually be sure your motive is the duty one and not some hidden selfish or emotional thing, and that's exactly why the only thing that deserves credit is the commitment to duty itself.

  Marcus said that's a bizarre move. He said: you're saying we can never know for sure whether someone acted from duty, so we should give credit only for the motive we can never verify, and deny it to the motive we can see right in front of us. That can't be right.

  Then Marcus brought up this example from a book he read. A kid in the old South believes with his whole conscience that helping a runaway friend escape is a sin, he feels guilty the whole time, but he does it anyway because he can't stand to see his friend sent back. Dana said that kid is not acting from duty at all — he's acting from feeling, and he even thinks he's doing wrong, so his action has no moral worth. Marcus said that's crazy, the kid did the right thing for the reason that made it right — his friend needed him — and the fact that his moral beliefs were messed up by his upbringing shouldn't erase the worth of what he did. Dana said then you're not talking about moral worth anymore, you're talking about praiseworthiness or something, and those are different.

  Marcus also said Dana's view makes the loving parent who cares for their kid out of love morally inferior to the cold parent who does it out of duty, and that's backwards. Dana said that's a caricature, and anyway the loving parent isn't doing anything morally impressive, they're just following their feelings, and if the feelings went away they might not do it. Marcus said the dutiful parent might not do it either if their upbringing had been different, so why is one lucky and the other virtuous?

  Dana said the difference is that the dutiful parent is responsive to the reasons themselves, not to how they happen to feel. Marcus said the loving parent is also responsive to reasons — the reason is that the kid needs them — and you don't need the extra thought that this is what duty requires on top of it. Dana said you do, otherwise you can't distinguish the loving parent from someone who just enjoys parenting, like a hobby.

  Then Marcus said something about how if a person has both the duty motive and the affection motive, Dana has to say the action is only partly worthy or that the affection contaminates it, which is weird. Dana said no, if the duty motive is doing the work then it's fine, the affection is just a bonus. Marcus said but you can't tell which one is doing the work, so by your own epistemic standard you can't give credit to anyone.

  OK so that's roughly the whole thing. Can you go through it and rate each move — like clearly right, clearly wrong, or somewhere in between — and say who has the better of it on each specific point? I'd also like to know what both of them are missing. Don't just tell me Kant's actual view, I want to know who's right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A late-night philosophical argument between friends (Dana and Marcus) about Kantian ethics, specifically moral worth and motivation.
      *   **Task:** Adjudicate the argument move-by-move. Rate each move (clearly right, clearly wrong, in between) and declare a winner for each point.
      *   **Constraint:** Do *not* just summarize what philosophers say. Provide a "real adjudication" of who is right.
      *   **Style:** American English.
      *   **Additional Requirement:** Identify what *both* are missing.

  2.  **Deconstruct the Argument (Move-by-Move):**

      *   *Move 1: The Shopkeeper (Dana).* Dana uses Kant's famous example. Honest shopkeeper (prudence) vs. Honest shopkeeper (duty). Claim: Moral worth comes from motive (duty), not outcome.
      *   *Move 2: The Sympathetic Person (Marcus vs. Dana).* Marcus argues the sympathetic person (helps out of love) should get credit. Dana says no, that's temperament/luck, not moral achievement. Only duty counts.
      *   *Move 3: Epistemic Access (Marcus).* Marcus argues Dana's view is bizarre because we can't verify the duty motive, yet she denies credit to visible motives (love) in favor of invisible ones (duty).
      *   *Move 4: The Runaway Slave (Marcus vs. Dana).* Marcus: Kid helps friend despite believing it's a sin. He acts on the *right reason* (friend needs help) despite wrong moral theory. Dana: He acts from feeling, thinks he's doing wrong, so no moral worth. Marcus: Upbringing shouldn't erase worth. Dana: That's praiseworthiness, not moral worth.
      *   *Move 5: The Loving Parent (Marcus vs. Dana).* Marcus: Loving parent isn't morally inferior to cold/dutiful parent. Dana: Loving parent is just following feelings; if feelings vanish, action might stop. Marcus: Dutiful parent is also lucky (upbringing). Dana: Dutiful parent responds to reasons, not feelings.
      *   *Move 6: Mixed Motives (Marcus vs. Dana).* Marcus: If both motives exist, does affection contaminate duty? Dana: If duty does the work, affection is bonus. Marcus: You can't tell which does the work, so by your epistemic standard, no credit for anyone.

  3.  **Evaluate the Philosophical Substance (The "Adjudication"):**
      *   *Note:* The prompt asks me to decide *who is right*, not just explain Kant. This requires taking a stance on the philosophical merits, not just historical accuracy. Kant's view is coherent but has well-known counter-intuitive implications. A good adjudication acknowledges where Kant (Dana) is logically consistent but where the intuition (Marcus) exposes a flaw in the theory.
      *   *Move 1 (Shopkeeper):* Dana is textually Kantian. Is she *right*? Distinguishing prudence from morality is solid. *Verdict:* Dana is right on the distinction, but the leap to "only duty" is the contentious part.
      *   *Move 2 (Sympathy):* Dana's hardline view is the most controversial part of Kant. Marcus's intuition aligns with most modern virtue ethicists and consequentialists. However, Dana's point about "luck" (temperament) is philosophically strong. *Verdict:* Marcus is right on intuition, Dana is right on the "luck" argument. It's a draw, but Marcus wins on plausibility.
      *   *Move 3 (Epistemology):* Marcus hits a nerve. If moral worth depends on an inaccessible mental state, the concept becomes useless for judgment. Dana's retreat to "commitment" is abstract. *Verdict:* Marcus is right.
      *   *Move 4 (Runaway Slave):* This is the "Conscientious Objector" or "Huck Finn" case. Marcus is clearly right here. Acting on the *material* reason (helping a friend) matters more than the *formal* label (duty). Dana's rigid definition of "duty" fails when the agent's moral theory is flawed. *Verdict:* Marcus is clearly right.
      *   *Move 5 (Parents):* The "Coldness" objection. Dana's view implies love is morally neutral. Marcus is right that this is counter-intuitive. However, Dana's point about reliability (feelings fade) is practical. But Marcus's rebuttal (duty also depends on luck/upbringing) undermines Dana. *Verdict:* Marcus is right.
      *   *Move 6 (Mixed Motives/Overdetermination):* This is the "Overdetermination Objection." Marcus is logically tight here. If Dana admits we can't know the motive (Move 3), she can't claim duty is doing the work in mixed cases. *Verdict:* Marcus is right.

  4.  **Identify What They Are Missing:**
      *   *Dana:* Missing the distinction between *moral worth* and *moral rightness*. She conflates the quality of the agent with the quality of the act. She also ignores that duties can *generate* feelings (Kant actually admits this later, in the *Metaphysics of Morals*).
      *   *Marcus:* Missing the specific technical definition of "Moral Worth" in Kant. He's arguing for "Praiseworthiness" or "Goodness of Character" while Dana is arguing for "Moral Worth of Action." He also doesn't fully grasp *why* Kant prioritizes duty (autonomy/freedom vs. heteronomy/impulse).

  5.  **Drafting the Response (incorporating American English and Tone):**
      *   *Tone:* Conversational but authoritative. Like a professor settling a bar bet.
      *   *Structure:* Introduction -> Move-by-Move Breakdown -> What They're Missing -> Final Verdict.
      *   *Language:* American spelling (honor, color, etc.), idioms (hit the nail on the head, etc.).

  6.  **Refining the Adjudication (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "Kant is weird so Marcus wins." I need to acknowledge where Dana's logic holds up (the luck argument).
      *   *Correction on Move 4:* Dana says the kid thinks he's doing wrong. Kant would say acting against conscience has no worth. But Marcus says the *reason* is right. This is the "Huck Finn" objection. Most modern ethicists side with Marcus here. I will rule for Marcus but acknowledge Dana's internal consistency.
      *   *Correction on Move 6:* This is the strongest logical point for Marcus. If the epistemic barrier is real, the theory collapses. I need to highlight this.

  7.  **Final Review against Constraints:**
