prompt: |-
  I'm a PhD student working on paraconsistent logic, and I've argued myself into a specific, deliberately narrow position that I now want to stress-test rather than defend. The position: dialetheism holds only in the semantic domain — Liar-type sentences and Curry sentences are both true and false — and the correct logic for reasoning about them is LP, so I surrender disjunctive syllogism and modus ponens for the material conditional, and I take explosion to fail. Outside the semantic paradoxes I remain a classical, bivalent theorist: no true contradictions about motion, change, the boundaries of vague objects, or quantum superpositions, and I reject the uniformist argument that accepting the Liar commits me to contradictions elsewhere. Two further commitments matter to me: I refuse to restrict the T-schema to a grounded or well-behaved fragment, and I want semantic closure — an unrestricted disquotational truth predicate for the whole language.

  Tell me what would count against this package, sorted by how much it should actually move me. I want both formal results and interpretive or methodological objections, including anything that has arguably already been established; I want to know which of them a dialetheist would themselves concede rather than merely dismiss as question-begging, and what it would take to defuse each. Do not simply catalogue the live options and leave the choice to me: take a position. Say which single defeater does the most damage, whether the package survives it, and — the point I care about most — whether the semantic-only restriction is actually stable or whether it quietly collapses into the uniformist dialetheism I've been trying to avoid.

  Give me the answer as a JSON object with these fields: "defeaters" (an array, ordered from most to least damaging, each an object with "name", "statement", "kind" — one of formal, semantic, methodological, intuitive, downstream-consequence — "target" — which component it hits: LP, the semantic-only restriction, the unrestricted T-schema, or semantic closure — "severity" — one of fatal, serious, awkward, minor — "dialetheist_concession" — whether and why a dialetheist would grant it — and "what_would_defuse_it"); "most_damaging_defeater" (a string naming one entry); "survival_verdict" (a short committed string); "stability_of_semantic_only_restriction" (a short committed string); "concessions_required" (an array of the objections I should grant); "question_begging_objections" (an array of the objections that merely presuppose classical logic against me); and "decisive_test" (what would in principle settle the matter, if anything would).
