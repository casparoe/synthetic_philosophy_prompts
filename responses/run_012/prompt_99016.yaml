      *   *The Logic (LP):* LP validates $A \land \neg A \to B$ as invalid (no explosion), but it also invalidates DS ($A, \neg A \lor B \vdash B$) and MP for the material conditional ($A, A \to B \vdash B$). This is a known cost of LP.
      *   *The "Semantic-Only" Restriction:* This is the weak point. Why would the logic of truth (LP) not apply to the logic of the world if the logic is universal? If LP is the *correct* logic for truth, and truth is pervasive, why doesn't LP govern ordinary reasoning?
      *   *The "Revenge" Problem:* With unrestricted T-schema and semantic closure, can we formulate a paradox that forces a contradiction *outside* the semantic domain? Or a paradox that shows the distinction between "semantic" and "non-semantic" is itself unstable?
      *   *The Detachment Problem:* In LP, MP fails for the material conditional. To reason normally, LP users usually add a "detachment" rule or use a stronger conditional (like in LPm or relevant logics). But the user specified LP and surrendering MP. This makes ordinary reasoning very difficult.
