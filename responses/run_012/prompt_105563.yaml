answer: |-
  ### Candidate Diagnoses

  Here are four distinct ways to carve the impasse, with the specific evidence required to discriminate among them.

  1.  **The Semantic Threshold Diagnosis (Your Hypothesis).**
      *   *Claim:* The dispute is purely about the definition of "Darwinian." Camp A uses a functional definition (information persists + differential success), while Camp B uses a mechanistic definition (copying fidelity + replication).
      *   *Discriminating Evidence:* If you forced Camp A to admit fidelity is below their own theoretical threshold for cumulative evolution, would they abandon the "Darwinian" label? If Camp B admitted fidelity was perfect, would they accept the label? If the answer is yes, it's verbal. If they still argue about the *source* of stability (selection vs. bias), it's deeper.

  2.  **The Explanatory Target Mismatch.**
      *   *Claim:* Camp A explains macro-scale adaptive complexity (why spears get better over millennia). Camp B explains micro-scale conceptual stability (why "ghost" concepts recur across cultures). They are solving different problems but fighting over the same theory name.
      *   *Discriminating Evidence:* Analyze their "hard cases." Does Camp A ignore stable but non-adaptive traits (rituals)? Does Camp B ignore cumulative technological sequences? If they simply ignore each other's core phenomena, they are answering different questions.

  3.  **The Ontology of the Variant.**
      *   *Claim:* Camp A treats cultural traits as discrete individuals (analogous to genes) that can be counted. Camp B treats them as continuous distributions of mental representations that are never identical.
      *   *Discriminating Evidence:* Look at their modeling assumptions. Does Camp A require discretization to run their population genetics models? Does Camp B reject discretization as a distortion? If Camp A can model continuous traits and Camp B can model discrete attractors, this diagnosis fails.

  4.  **The Causal Confusability Diagnosis (My Selection).**
      *   *Claim:* The impasse persists because **selection on random variation and biased transmission toward attractors produce mathematically indistinguishable equilibrium distributions.** Both sides look at the same static cultural data and infer different dynamics. The dispute is substantive about *causal attribution*, but it is stalled because the available evidence (static distributions) underdetermines the mechanism.
      *   *Discriminating Evidence:* Do both sides possess formal models that can fit the same ethnographic data? If yes, the dispute is not about the data, but about which parameter (selection coefficient vs. bias strength) is doing the work.

  ---

  ### Committed Diagnosis: Causal Confusability & Explanatory Priority

  I commit to **Diagnosis 4**, with a crucial refinement: The disagreement is **substantive regarding the locus of causal power**, but it manifests as a verbal dispute because the term "Darwinian" is being used as a proxy for "Selection is the primary creative force."

  This is not merely a semantic disagreement about the word "Darwinian." If it were, we could stipulate a definition and move on. We cannot, because the label carries a claim about *where the explanation lives*.

  **What Camp A is Committed To:**
  Camp A is committed to the claim that **population-level selection is sufficient to explain adaptive complexity**, provided transmission fidelity exceeds a minimum threshold. They treat cognitive biases as just another form of selection pressure (a "transmission bias") that can be plugged into the Price Equation. For them, the "Darwinian" label asserts that the *population dynamics* are the explanatory engine; the cognitive machinery is a black box that generates the variance/heritability parameters. They must maintain this commitment because if cognitive bias becomes the primary explanation, their population-genetic models lose their predictive primacy and become mere descriptive summaries.

  **What Camp B is Committed To:**
  Camp B is committed to the claim that **individual-level cognitive reconstruction is the primary source of cultural stability.** They argue that without strong attractors, the noise in reconstruction would swamp selection, making cumulative adaptation impossible. For them, the "Darwinian" label is misleading because it implies a blind variation/selection process, whereas they see a directed transformation process guided by cognitive structure. They must maintain this commitment because if selection is granted primary causal power, the detailed cognitive architecture they study becomes secondary to the population math, rendering their mechanistic explanations epiphenomenal.

  **Why Neither Side Can Grant the Other:**
  *   **Camp A cannot grant Camp B:** If Camp A admits that cognitive attractors are the *main* reason cultural forms stabilize (rather than selection filtering noise), then "cultural evolution" is no longer analogous to biological evolution (where the environment selects, the genotype doesn't bias mutation toward utility). It collapses into a theory of cognitive psychology. The "Darwinian" framework becomes redundant.
  *   **Camp B cannot grant Camp A:** If Camp B admits that selection on low-fidelity variants is sufficient for cumulative adaptation, then the specific content of the cognitive attractors matters less than the statistical structure of the population. This undermines the claim that we must study the *content* of representations to understand culture. It reduces cognition to a noise generator.

  **Classification of the Disagreement:**
  This is a **Substantive Disagreement about Causal Attribution**, fought on **Verbal Terrain.**
  It is substantive because it concerns which parameter (selection coefficient $s$ vs. bias rate $\beta$) dominates the equation of cultural change. It is fought on verbal terrain because both sides argue over the label "Darwinian" rather than quantifying the ratio of $s$ to $\beta$. The word "Darwinian" is a placeholder for "Selection does the heavy lifting."

  The reason they "agree on the facts of transmission" (it is reconstructive) but disagree on the theory is that **reconstruction is compatible with both models.** Camp A says reconstruction is noisy copying (allowing selection). Camp B says reconstruction is biased transformation (preventing selection). Since both processes happen simultaneously, the dispute is about *magnitude*, not presence.

  ---

  ### Path to Progress

  Given this diagnosis, **no progress should be expected from further definition-checking or static ethnography.** Defining "Darwinian" more precisely will not tell us whether selection or bias is doing the work in a specific case. Static ethnographic distributions (the "facts" they agree on) are the equilibrium output of *both* processes; you cannot infer the dynamic cause from the static effect when the causes are mathematically confusable.

  **What Counts as Progress:**
  Progress requires **Dynamic Decomposition.** We need a formal and experimental shift that stops asking "Is this Darwinian?" and starts asking "What is the variance partition?"

  1.  **Formal Result:** We need a unified formal framework that explicitly includes both parameters: a population-genetic model that incorporates *directed* mutation (bias) alongside *blind* selection. The field needs to stop treating "bias" as a violation of Darwinism and start treating it as a parameter $\beta$ to be estimated against selection coefficient $s$. Progress is a theorem showing under what conditions $s$ dominates $\beta$ and vice versa.
  2.  **Decisive Experiment:** We need **transmission chain experiments with perturbation.**
      *   *Current State:* Most experiments show stability (supporting B) or drift (supporting A).
      *   *Required:* Experiments that manipulate the *fitness* of a variant independently of its *attractiveness*.
      *   *Example:* Create a cultural variant that is highly attractive (easy to reconstruct) but functionally costly (low selection), and vice versa.
      *   *Criterion:* If the costly-but-attractive variant spreads, Bias dominates (Camp B wins). If the costly variant is purged despite being attractive, Selection dominates (Camp A wins).
  3.  **Change of Question:** The field must abandon the question "Is cultural evolution Darwinian?" as a global claim. It is a domain-specific empirical question. Some domains (technology) may be selection-dominated (Camp A). Others (ritual, folklore) may be bias-dominated (Camp B).

  **Conclusion:**
  The impasse is not a failure of data; it is a failure of **causal resolution.** Both sides are describing the same system at different levels of abstraction, but each claims their level is the *true* cause. Progress will only come when we stop treating "Darwinian" as a binary property of culture and start measuring the **selection-bias ratio** in specific cultural domains. Until then, the dispute will remain a stalemate of competing metaphors masquerading as mechanisms.
