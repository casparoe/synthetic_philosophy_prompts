answer: |-
  That bridge case fails to break the theorem because you are misclassifying personal history as a prior difference rather than what it actually is: private information. You say neither can point to a private signal, but having a father who taught you about stress corrosion *is* a signal about the world, specifically about the reliability of inspection regimes and the prevalence of corrosion. If you truly swap "everything," that includes the data point "I was raised by an engineer" and the data point "I have a psychological disposition toward optimism." Once Forecaster B learns that Forecaster A has an engineer father, B must update on the probability that an engineer father leads to accurate risk assessments. If they still disagree after exchanging the causes of their beliefs, one of them is failing to update correctly on the meta-evidence of the other's background.

  The Common Prior Assumption doesn't demand you had the same childhood; it demands that before either of you existed, you would have assigned the same probability to the event "I will be raised by an engineer." If you agree on that initial probability distribution over all possible life histories and all possible worlds, then any divergence after birth is solely due to the different signals you received during those lives. You're treating the output of their history as a brute fact of rationality, but rationality requires you to treat your own history as data that others can update on. If they can't converge after sharing the data of their upbringing, one is doing the math wrong, not starting from a different rational planet.
