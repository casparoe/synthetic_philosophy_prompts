      *   *Let's go with Case 3 (Exoskeletons).* Safety tech is hard to oppose publicly. The procedure might flag it as "Endorse with Conditions" (Take the suits, reject the cuts) whereas the user sees the *tie-in* as the poison. I need to make sure the procedure captures the *tie-in*.
      *   *Actually, the most likely disagreement:* **Case 1.** Why? Because "rest get easier" appeals to the "shorten the working day/improve conditions" aspect of the theory. The user says "fight." The procedure might say "Bargain Hard" because the *machine itself* isn't the enemy, the *layoffs* are. The procedure separates the tech from the deal. The user's gut says "fight the tech because of the deal." The procedure asks "Can we fix the deal?" If yes -> Bargain Hard.
      *   *Okay, I will structure the procedure to separate Tech Impact from Deal Impact.* This aligns with the user's theory (machine vs. capital).
