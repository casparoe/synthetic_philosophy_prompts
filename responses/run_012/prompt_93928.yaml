answer: |-
  ### UNION LOCAL [X] TECHNOLOGY REVIEW CHECKLIST
  **Purpose:** To decide our stance on new tools or systems within the 45-day consultation window.
  **Time:** Complete in one afternoon with the affected stewards.
  **Rule:** Separate the *tool* from the *deal*. A good tool with a bad deal is a bargaining opportunity. A bad tool is a fight.

  #### STEP 1: JOBS & SECURITY (The "Who Stays" Test)
  *Ask: Does this proposal remove current positions?*
  *   **Yes, permanent layoffs:** Are the displaced members guaranteed redeployment to equal pay/status?
      *   *No:* **STOP.** Recommendation: **OPPOSE**.
      *   *Yes:* Go to Step 2.
  *   **No, natural attrition only:** Go to Step 2.
  *   **No impact:** Go to Step 2.

  #### STEP 2: CONTROL & SKILL (The "Who Decides" Test)
  *Ask: Does this system make decisions humans used to make?*
  *   **Yes, it removes judgment:** (e.g., routing, pacing, quality checks). Does the member keep override authority?
      *   *No:* **STOP.** Recommendation: **OPPOSE AND ESCALATE** (This changes the nature of the job).
      *   *Yes:* Go to Step 3.
  *   **No, it assists human decision:** Go to Step 3.

  #### STEP 3: PACE & SAFETY (The "Body & Clock" Test)
  *Ask: How does this change the physical work?*
  *   **Safety:** Does it reduce injury/strain?
      *   *Yes:* Mark as **GAIN**.
      *   *No/Neutral:* Mark as **NEUTRAL**.
      *   *Worse:* Mark as **RISK**.
  *   **Speed:** Does it increase picks/hour or reduce break time?
      *   *Yes:* Mark as **RISK**.
      *   *No:* Mark as **NEUTRAL**.
      *   *Slower/More time:* Mark as **GAIN**.

  #### STEP 4: THE GAIN SHARE (The "Who Benefits" Test)
  *Ask: The company saves money/time. What do we get?*
  *   **Offered:** Shorter hours? Wage increase? Bonus? Hiring freeze protection?
      *   *Yes:* Go to Decision Matrix.
      *   *No:* **STOP.** Recommendation: **BARGAIN IT HARD** (Do not accept productivity gains without member share).

  ---

  ### DECISION MATRIX
  *Combine your answers from Steps 1–4 to find your recommendation.*

  | If Step 1 is... | And Step 2 is... | And Step 3 is... | **RECOMMENDATION** |
  | :--- | :--- | :--- | :--- |
  | **No Layoffs** | Human Control Kept | Safety/Time **GAIN** | **ENDORSE** |
  | **No Layoffs** | Human Control Kept | Mixed (Some Gain, Some Risk) | **ENDORSE WITH CONDITIONS** (Fix the risks in writing) |
  | **Layoffs (Redeployed)** | Human Control Kept | Mixed | **BARGAIN IT HARD** (Trade approval for stronger protections) |
  | **Layoffs (No Redeploy)** | OR | Human Control Lost | **OPPOSE** (File grievance/prepare campaign) |
  | **Human Control Lost** | AND | Speed Up / Safety Risk | **OPPOSE AND ESCALATE** (Mobilize members, media, legal) |

  ---

  ### CASE RUNS (Based on Current Proposals)

  **1. Robotic Palletisers (Dry Goods)**
  *   **Step 1:** 22 jobs go. Redeployment offered? *Proposal says no.* -> **STOP.**
  *   **Result:** **OPPOSE.**
  *   **Note:** Even though work gets easier for the rest, the immediate layoff without redeployment triggers the hard stop.

  **2. AI Dispatch Scheduler**
  *   **Step 1:** No explicit job cuts mentioned. -> Continue.
  *   **Step 2:** Takes route decisions away from dispatchers. Override authority? *Not specified/Unlikely.* -> **STOP.**
  *   **Result:** **OPPOSE AND ESCALATE.**
  *   **Note:** This removes human judgment (Step 2). This is a fundamental change to the job classification and power balance.

  **3. Powered Exoskeletons (Freezer)**
  *   **Step 1:** 6% headcount reduction. Redeployment? *Proposal says no.* -> **STOP.**
  *   **Result:** **OPPOSE.**
  *   **Note:** Despite the safety gain (Step 3), the mandatory headcount cut (Step 1) combined with a speed-up (Step 3) makes this a net negative.

  ---

  ### WHERE WE MIGHT DISAGREE
  **Case 1 (Palletisers).**
  Your gut says fight all three. The procedure says **OPPOSE** on Case 1, but it leaves the door open for **BARGAIN IT HARD** if the company blinks on redeployment.
  *   **Why:** The procedure isolates the *machine* (which makes work easier/safer) from the *plan* (which fires people). Your theory says capital uses the machine to fire people. The procedure acknowledges this but asks: "Can we keep the machine and stop the firing?" If the answer is "Yes, if we bargain," then **OPPOSE** is the wrong tactic; **BARGAIN IT HARD** is the winning move. Opposing the tech throws away the safety benefit. Bargaining keeps the safety benefit and fights the layoffs.
  *   **The Risk:** If you follow the procedure, you might end up defending the *robot* while trying to save the jobs. Members might see that as accepting automation. You need to be clear: "We want the safety, not the layoffs."

  ### WHAT THIS PROCEDURE CANNOT DO
  1.  **It cannot detect lies.** If the company says "22 jobs go" but the real plan is 50 over three years, the procedure accepts their number. It relies on their disclosure.
  2.  **It cannot measure morale.** It might say "Bargain Hard," but if the members are too scared to strike, you can't bargain hard. It gives a strategic target, not a power assessment.
  3.  **It treats each case in isolation.** It doesn't see the "death by a thousand cuts." Approving the palletisers might make the AI scheduler easier to introduce later. It lacks long-term strategy.
  4.  **It assumes good faith consultation.** If the company installs the machine on Day 46 regardless, the procedure is just paperwork. It works only if the threat of "Oppose and Escalate" is credible.

  **Final Note:** This tool turns "No" into a specific demand. Don't just say "No." Say "No, unless you redeploy the 22." That is how you shape the deal.
