      *   *Alternative Prediction:* The procedure will recommend **Endorse with Conditions** on Exoskeletons. User wants to Oppose. Why? Because safety is a "good." The procedure might isolate safety from the bargaining demands. *Correction:* The prompt says the company *wants to tie them* to reductions. The procedure must evaluate the *package*.
      *   *Decision:* I think the disagreement will be on **Case 1 (Palletisers)**. 22 jobs is a lot, but if the work is dangerous now, blocking safety tech is hard to sell to members. The procedure will likely say "Bargain Hard" (No layoffs, retrain the 22) whereas the user says "Fight" (Oppose).
