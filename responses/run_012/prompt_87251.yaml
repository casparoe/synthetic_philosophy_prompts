answer: |-
  You did not lose on the core intuition, but you lost on the technical defense. Your friend's position is a sophisticated variant of the "Knightian uncertainty" or "Maxmin Expected Utility" view, which is respected in decision theory. However, the specific claim that ambiguity aversion is a *rational response to objective under-determination* is vulnerable. The preference is often driven by psychological framing rather than the logical structure of the prospect.

  Here is the ranking of defeaters against your friend's position, from fatal to awkward.

  **1. Fatal: Empirical Instability (Framing and Competence)**
  *Type: Empirical pattern it cannot accommodate.*
  This is the strongest objection. If ambiguity aversion were a rational response to the *objective fact* of under-determination, it should be stable whenever the under-determination is identical. It is not.
  *   **Competence Effect:** Agents often prefer betting on unknown probabilities in domains where they feel competent (e.g., sports, their own expertise) over known probabilities in domains where they feel incompetent. If the "fact" of under-determination is the same (probabilities are unknown), the rational response should be identical. The reversal shows the preference tracks *confidence*, not *information*.
  *   **Gain/Loss Reversal:** Ambiguity aversion often flips to ambiguity *seeking* in the domain of losses. The objective under-determination of the urn does not change when the payoff switches from winning \$100 to losing \$100. A rational response to a factual gap should not reverse sign based on the valence of the outcome.
  *   **Verdict:** This falsifies the claim that the preference tracks the "real feature of the situation." It tracks the agent's psychological state.

  **2. Fatal: Dynamic Inconsistency (Money Pump)**
  *Type: Coherence or money-pump result.*
  If the "fact" of the filling process is the only justification for the preference, then two descriptions that entail the same physical probabilities must be treated identically.
  *   **The Pump:** Suppose an agent prefers Urn A (Known) over Urn B (Unknown) because of the "unspecified filling" fact. If you can reframe Urn B with a story that sounds "fair" without changing the physical odds, and the agent switches preference, they are vulnerable to a money pump. They will pay to switch from B to A, then pay to switch back if the description of B changes again.
  *   **Friend's Defense:** Your friend will argue the descriptions *are* different facts.
  *   **Counter:** If the "fact" does not alter the likelihood of the payoff (the draw is still random), treating it as payoff-relevant is an error. If the filling process doesn't bias the draw, it is not a state in the payoff-relevant state space. Basing choices on irrelevant historical facts is irrational.

  **3. Strong: Collapse into Risk (State-Space Enrichment)**
  *Type: Argument that the position collapses into a rival.*
  Your friend claims SEU fails because the state space is incomplete. However, SEU can accommodate ambiguity aversion if the state space is enriched to include "probability distributions" as outcomes (second-order prospects).
  *   **The Collapse:** If we model the unknown urn as a lottery over possible compositions, ambiguity aversion becomes risk aversion over these second-order outcomes.
  *   **Implication:** Your friend must either accept this modeling (conceding that SEU holds over a richer space, making their claim merely about state-definition) or reject it (claiming agents cannot conceive of second-order probabilities). Rejecting it makes the theory psychologically unrealistic; accepting it makes the "under-determination" claim vacuous—it just means the agent is risk-averse over meta-probabilities.

  **4. Awkward: Unfalsifiability**
  *Type: Methodological weakness.*
  *   **The Problem:** The claim "the description under-determines the prospect" can be stretched to explain *any* violation of SEU. If an agent violates independence, the theorist can simply say, "You didn't specify the state space finely enough."
  *   **Prediction:** To avoid this, the position must predict *when* agents will treat a state space as incomplete. Without constraints on what counts as "relevant under-determination," the theory explains everything and predicts nothing. A plain SEU account is more parsimonious; it only fails when preferences are demonstrably inconsistent, whereas this position can rationalize inconsistency as "completeness."

  ***

  ### Addressing Your Three Questions

  **1. Can it be redescribed as a preference over second-order prospects?**
  Yes. Models like Klibanoff-Marinacci-Mukerji (Smooth Ambiguity) do exactly this. They treat the unknown probability as a random variable.
  *   **Vacuous or Reclassified?** It reclassifies the preference. It shows ambiguity aversion is mathematically isomorphic to risk aversion over a higher order of uncertainty. This weakens your friend's claim that SEU is *wrong*. Instead, SEU is *right*, but the "outcomes" include epistemic states. The "under-determination" is not a hole in the world, but a feature of the agent's utility function over knowledge.

  **2. Does aversion track information or description?**
  Empirically, it tracks **description and competence**, not information.
  *   **The Damage:** This sits catastrophically badly with an account claiming to be about "objective under-determination." If two agents have the same information but different feelings of competence, and they act differently, the difference is not in the *prospect* (as your friend claims) but in the *psychology*. This confirms the standard view: ambiguity aversion is a cognitive bias (fear of the unknown), not a logical deduction from missing data.

  **3. Does the position risk unfalsifiability?**
  Yes, high risk.
  *   **What it excludes:** To be falsifiable, it must specify a case where an agent *should* treat the state space as complete but doesn't, or vice versa. Currently, it allows the theorist to retroactively declare the state space "incomplete" whenever preferences violate SEU.
  *   **Prediction:** A plain SEU account predicts consistent choices across equivalent frames. This position predicts divergence *if* the agent perceives under-determination. But since "perception" is unobservable, the prediction is weak.

  ***

  ### What Your Friend Must Concede

  Your friend's position survives only in a narrowed form. They must concede the following:

  1.  **Epistemic, Not Ontological:** The "under-determination" is not a fact about the urn (the balls are either red or black); it is a fact about the *agent's evidence*. The preference is not about the world, but about the relation between the agent and the world.
  2.  **Normative, Not Descriptive:** They can defend it as a *norm* for prior selection (e.g., "Be cautious when evidence is sparse"), but they cannot defend it as a description of rational *choice* independent of psychological framing.
  3.  **The "No Agent" Test:** If you remove the agent and replace them with an algorithm programmed to maximize payoff, ambiguity aversion disappears unless explicitly coded as a penalty for uncertainty. An algorithm using SEU with a uniform prior (Principle of Indifference) will not show the Ellsberg preference. Therefore, the preference is not forced by logic; it is a specific parameter setting (caution) that an agent *may* adopt, but is not *required* to adopt by rationality alone.

  **The Verdict:**
  You lost the argument because your friend appealed to a plausible normative intuition (caution is good). But you win on the merits because their specific mechanism (objective under-determination) is empirically false. The preference is unstable, framing-dependent, and reducible to risk aversion over epistemic states. It is not a logical necessity derived from the urn; it is a psychological feature of the chooser.

  \answer{Preferences vary with framing, not factual under-determination; exposed}
