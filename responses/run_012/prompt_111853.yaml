        "id": "C1",
        "name": "Interleaved Swap",
        "description": "Parts are replaced one at a time, but removed organic parts are used to build a second system, resulting in two complete beings with causal histories tracing back to the original.",
        "which_axis_it_probes": "A3"
      },
      {
        "id": "C2",
        "name": "Frozen Duplicate",
        "description": "The original is destroyed and an exactly equivalent system is assembled from a record, with no causal step from the original's final state to the new system's first.",
        "which_axis_it_probes": "A1"
      },
      {
        "id": "C3",
        "name": "Staggered Swap",
        "description": "Only one part in a thousand is replaced each year, so the process outlasts any single memory thread while never involving a discontinuous jump.",
        "which_axis_it_probes": "A2"
      },
      {
        "id": "C4",
        "name": "Halted and Reversed Swap",
        "description": "The replacement procedure is stopped halfway and then run backwards, returning the system to its original composition along the path it came.",
        "which_axis_it_probes": "A2"
      }
    ],
