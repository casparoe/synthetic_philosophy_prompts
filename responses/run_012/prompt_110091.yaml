answer: |-
  Right, let's have a proper look at this. Your colleague is deploying a classic piece of philosophy of science—often associated with Quine or the Duhem-Quine thesis—but he's using a mathematical analogy to do all the heavy lifting. As an engineer, you'll spot the weakness immediately: the analogy assumes a modelling context that no sensible engineer would actually work in.

  He is arguing for **radical underdetermination**: the idea that evidence never forces a theory choice, so choice is irrational (mere taste). The curve-fitting story is the engine of that argument. If we break the engine, the conclusion stalls.

  Here is the audit of the analogy, mapping his picture onto scientific practice, followed by where the mapping fractures.

  ### 1. The Audit Table

  | In the Analogy | In Scientific Practice | Status of Mapping |
  | :--- | :--- | :--- |
  | **The Data Points** | Observational evidence / measurements. | **Reasonable.** Though data is rarely noise-free coordinates. |
  | **The Curve** | The Theory (laws, equations, models). | **Weak.** Theories are structured, modular, and causal, not just functions $f(x)=y$. |
  | **Space of All Curves** | Space of All Possible Theories. | **False.** In maths, any function is valid. In science, most functions are physically impossible or incoherent. |
  | **Passing Through Points** | Empirical Adequacy (fitting the data). | **Misleading.** We often *don't* want to pass through every point (see: noise/overfitting). |
  | **Selecting a Curve** | Theory Choice. | **Incomplete.** Ignores constraints like consistency with other theories, cost, and utility. |
  | **The Plane** | The World / Reality. | **Problematic.** Implies a 2D relationship, whereas theories map multi-dimensional causal structures. |
  | **Implicit Prior** | None (all curves equal). | **False.** Science heavily penalises complexity (Occam's Razor / Regularisation). |

  ### 2. Where the Mapping Breaks

  The analogy works mathematically but fails scientifically in four specific ways.

  **A. The "Space of Curves" Constraint (Regularisation)**
  In the mathematical problem, the set of candidate curves is unconstrained. You can have a polynomial of degree $n-1$ for $n$ points. In science, the "space of curves" is heavily regularised. A theory isn't just a line; it's a mechanism. It must be consistent with conservation laws, thermodynamics, and existing background knowledge.
  *   **The Break:** Your colleague assumes all theories fitting the data are *equally eligible candidates*. In practice, 99.9% of the "curves" that fit the data are rejected immediately because they are *ad hoc*, physically incoherent, or infinitely complex. We impose a penalty on complexity (like L1/L2 regularisation in machine learning).

  **B. The Noise Problem (Overfitting)**
  The analogy insists the curve must pass *through* the points. Any backend engineer knows that if you fit your model perfectly to the training data, you've likely overfit. Real data has error bars. A theory that fits every data point exactly is often suspected of being wrong because it's modelling the noise rather than the signal.
  *   **The Break:** Scientific rationality often dictates choosing the curve that *misses* some points (minimising error variance) rather than the one that hits them all. His analogy equates "fitting" with "truth", whereas science equates "generalisation" with "truth".

  **C. Modularity and Blame Shifting (The Duhem-Quine Point)**
  This is crucial for your specific question about blaming something else. In the curve analogy, the curve is atomic. If it doesn't fit, the curve is wrong. In science, a theory comes with **auxiliary hypotheses** (instrument calibration, background conditions, ceteris paribus clauses).
  *   **The Break:** When data contradicts a theory, we don't just swap the curve. We check the instrument. We check the initial conditions. We check the maths. The curve analogy has no representation for the *supporting structure* around the theory. It implies a direct theory-to-world link that doesn't exist. This actually *supports* your colleague's view that we can always save a theory, but for the wrong reason: it's not because there are infinite curves, but because the curve is attached to a web of assumptions we can tweak.

  **D. Interpolation vs. Extrapolation**
  The curve-fitting problem is usually about interpolation (connecting the dots). Science is primarily about extrapolation (predicting where there are no dots).
  *   **The Break:** Two curves might fit the existing points perfectly but diverge wildly outside the convex hull of the data. The analogy treats all fits as equal, but science values the curve that remains stable when you query it at $x_{new}$.

  ### 3. Does the Conclusion Survive?

  Your colleague's conclusion is: *Therefore, when two theories fit the evidence, there is no rational way to choose; it is taste.*

  Once we put the disanalogies on the table, this conclusion does not survive. Here is why, addressing your specific concerns.

  **1. "Fits all evidence we have" vs. "Fits all evidence there could be"**
  He slides from the data we possess to the data that exists. The curve analogy is static; the points are fixed. Science is dynamic.
  *   **Verdict:** He is not entitled to this slide. Underdetermination is often **transient**. Two theories might fit the current data (the current points), but they make different predictions for a *new* experiment (a new point). If Theory A predicts $y=10$ at $x=100$ and Theory B predicts $y=50$, they are not empirically equivalent forever. They are only equivalent relative to the *current* dataset. Rationality consists in designing the experiment that generates the new point. His analogy freezes time; science does not.

  **2. Genuine Rivals vs. Notational Variants**
  In the curve analogy, $y = x^2$ and $y = x^2 + 0$ are different curves mathematically, but physically identical.
  *   **Verdict:** Many "rival" theories are just reformulations (like Heisenberg's matrix mechanics vs. Schrödinger's wave mechanics in early quantum physics). If two theories make identical predictions for all possible experiments and differ only in metaphysical description, they may indeed be a choice of "taste" (instrumentalism). But if they posit different causal mechanisms that *could* be probed (even if we haven't figured out how yet), they are genuine rivals. The analogy cannot distinguish between a mathematical identity and a physical difference.

  **3. The "Blame Shifting" (Auxiliaries)**
  You asked what happens when we notice we can blame the instrument.
  *   **Verdict:** This actually weakens his "taste" conclusion. If we can save a theory by adjusting an auxiliary hypothesis, that adjustment has a **cost**. It makes the total system more complex. If I have to add three epicycles to keep my planet theory going, the "system" is now less regularised. Rationality isn't about whether you *can* save the theory (you usually can), but whether doing so destroys the model's simplicity and predictive power. We choose the theory that requires the least *ad hoc* repair. That is a rational criterion, not taste.

  **4. Fit vs. Explanation**
  Is "fitting the points" the right goal?
  *   **Verdict:** No. We want **compression**. A good theory explains a vast amount of data with a small amount of information (short code). A polynomial that wiggles through every point has high information content (lots of coefficients). A law like $F=ma$ has low information content. We rationally prefer the theory that compresses the data best, even if a more complex curve fits slightly better. This is the Minimum Description Length principle. It's not taste; it's information theory.

  ### 4. A Better Analogy: Lossy Compression / Source Code

  The curve-fitting analogy is 19th-century mathematics. For a backend engineer, a better analogy is **Source Code and Log Files**.

  *   **The Data:** A massive log file of system events.
  *   **The Theory:** The source code that generated the logs.
  *   **The Task:** Reverse-engineer the code from the logs.

  **Why this gets it right:**
  1.  **Underdetermination exists:** Many different programmes could produce the same log output (e.g., a hard-coded print statement vs. a calculated value).
  2.  **Rational Choice exists:** You don't pick the programme at random. You pick the one that is most maintainable, modular, and likely to handle *new* inputs correctly. You reject the "spaghetti code" that hard-codes every log entry (overfitting).
  3.  **Auxiliaries:** If a log entry looks wrong, you check if the logger was buggy (auxiliary hypothesis) before rewriting the core logic (the theory).
  4.  **Prediction:** The test of the code isn't just that it produced the *old* logs, but that if you run it again, it produces consistent *new* logs.
  5.  **Refactoring:** Two codebases might produce identical logs (empirical equivalence). Choosing between them isn't "taste"; it's about which one is easier to extend or debug (theoretical virtues).

  ### Summary for your Reading Group

  Your colleague is correct that **logical** underdetermination exists (you can always write a function that fits the points). He is incorrect that this implies **scientific** irrationality.

  1.  **The Analogy is Unregularised:** It ignores complexity penalties. In science, the "wiggly curve" is rejected because it's overfit, not because it doesn't fit.
  2.  **The Analogy is Static:** It ignores future data. Theories are chosen based on their ability to handle *new* points, not just old ones.
  3.  **The Analogy is Atomic:** It ignores auxiliary hypotheses. We can save a theory, but it costs complexity, which is a rational metric for rejection.

  You can tell him: *"You're treating scientific theory choice like an unregularised regression problem on a fixed dataset. But science is more like minimising generalisation error on a streaming dataset with a penalty on model complexity. Under those conditions, 'taste' is replaced by optimisation."*

  He might not like that, but it's the rigorous answer.
