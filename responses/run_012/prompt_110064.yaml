  A model answer follows. The colleague's argument relies on a selective choice of denominator that obscures the inefficiency of beef production regarding land use. While it is true that a steer yields more meat than a chicken, reducing the number of large animals killed per kilogram of output, this metric ignores the input required to sustain those animals. Cattle require significantly more land and feed per kilogram of meat than chickens or crops. If field deaths are constant per hectare, then beef production, requiring more hectares per kilogram of meat, necessarily causes more field deaths per kilogram of meat than plant agriculture. The ordering reverses completely when shifting from output to input. Per hectare, beef is the most costly option. Per calorie, beef is less efficient than chicken or grain, meaning more land and thus more field deaths are required to sustain a human life on beef. The argument only holds if one accepts kilograms of meat as the morally relevant unit of measurement, rather than the land used or the energy transferred. This shift in denominator is not merely technical but fundamentally alters the moral landscape of the choice. Furthermore, the argument fails to account for the deaths of the farmed animals themselves in a consistent manner. To count field mouse deaths as harms, one must assume that death is a deprivation or that these lives have negative or positive value worth counting. If field deaths matter, then the deaths of the steer and the chicken must matter equally. Producing three hundred kilograms of beef requires killing one steer. Producing the same amount of chicken meat requires killing two hundred chickens. Even if field deaths per hectare are identical, the direct killing of the food animal dwarfs the collateral damage for chicken, whereas for beef the direct killing is minimized. However, this trade-off only works if one values the life of a mouse equally to the life of a cow, which is contentious. Additionally, counting field deaths assumes these animals would exist otherwise. If the land were not farmed, it might be rewilded or paved. The harm calculation depends on a counterfactual baseline that the argument ignores. We cannot simply count deaths on farmed land without asking whether those animals would have lived had the land not been used for beef or chicken. This requires a consistent theory of harm across species and contexts. Finally, the arithmetic does not settle the ethical question because the choice of metric is itself a normative judgment. Deciding to measure deaths per kilogram of meat presupposes that the goal is to maximize meat output while minimizing death. But an ethicist might argue the goal should be to minimize total harm per life lived, or per hectare preserved. The colleague's conclusion follows not from the numbers themselves, but from the prior decision to prioritize yield over land use. Numbers cannot dictate ethics when the framework for counting is disputed. To accept the argument is to accept that efficiency of production is the primary moral good, rather than the intrinsic value of the land or the animals inhabiting it. Therefore, the calculation is not a neutral discovery of fact but a reflection of values embedded in the question asked. The math only works if you agree with the morality of the metric, and since the metric is contested, the conclusion remains ethically unsettled. Students must recognize that the arithmetic is subordinate to the ethical framework chosen to interpret it.

  The marking scheme is distributed as follows out of twenty marks. The first five marks are awarded for correctly analyzing the denominator shift. To earn full marks, the student must explain that while beef has fewer deaths per kilogram of meat, it has more deaths per hectare and per calorie due to lower efficiency. Students typically lose marks here by accepting the per kilogram metric without challenging it or by failing to note that the ordering reverses when measuring land use. The second five marks are awarded for discussing the assumptions about harm. A full-mark answer must state that counting field deaths assumes those lives are worth counting and must apply that same valuation to the farmed animals, noting the trade-off between one steer and many chickens. Students often fail to mention the counterfactual baseline of what would happen to the land if it were not farmed. The third five marks are awarded for evaluating the ethics of the arithmetic. The student must argue that choosing the denominator is a normative choice that precedes the calculation. Marks are deducted if the student treats the numbers as ethically neutral or fails to identify that the metric choice dictates the conclusion. The final five marks are awarded for coherence and clarity. The essay must flow logically between the three points without contradiction. Students lose these marks if the essay is disjointed or if the conclusion does not follow from the premises established in the earlier sections. An A grade requires all three substantive sections to be fully developed with the specific moves identified, whereas a B grade will address the topics but miss the nuance of the counterfactual baseline or the normative nature of the metric choice.
