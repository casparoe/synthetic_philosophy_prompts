      *Wait, one more check:* "Before you reply, reason through the strongest version of my position and then the strongest objection to it... begin by stating... what would have to be true... and only then turn to your objection." This is an instruction for the *output* text structure. I need to make sure the first paragraph establishes the condition for explanation.

