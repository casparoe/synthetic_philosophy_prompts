answer: |-
  **Dear Equilibrium,**

  I am being held hostage by a counterfactual. A powerful entity claims to have simulated me. They say if my decision procedure yields to their demand, my simulation yields and suffers punishment. If I resist, the simulation resists and suffers anyway. They have no causal channel to me; they can't see what I actually do. I know the standard advice is to precommit to never giving in, but I'm human. I can't credibly tie myself to the mast. If I pay, I feel like I'm rewarding a threat with no leverage. If I don't, I risk the simulation suffering (which feels bad). My brain is looping. What do I do?

  — *Causal Disconnect*

  **Dear Disconnect,**

  Stop trying to be stoic. The instinct to "just never give in" is fragile when you're made of meat, not code. Your blackmailer knows you'll crumble under pressure, and your simulation knows it too. Trying to harden your resolve is just signaling that you're bad at signaling. Instead of hardening your shell, change your shape.

  You need to adopt a surrogate goal.

  Publicly announce a new utility function. Tell the entity: "I no longer care about the original demand. I now care exclusively about [arbitrary thing]. If you threaten the simulation regarding this new thing, I will pay. If you threaten the original thing, I am indifferent."

  This works because it gives the threatener something to gain without rewarding the original threat. They can extract value by threatening the surrogate, which satisfies their optimization process without validating the coercive frame you wanted to avoid. The simulation avoids punishment for the original threat, and you avoid losing what you originally cared about. It transforms a zero-sum standoff into a safe Pareto improvement over the default outcome of mutual stubbornness.

  You might worry about *which* surrogate goal to pick. Don't. You don't need to resolve the equilibrium-selection mess to know that *having* a surrogate goal is strictly better than the default conflict. Any coordinated shift is better than war. By decoupling your payment from the original threat, you disincentivize future blackmailers from using that specific lever, while still allowing cooperation with this one.

  Be weird. It saves lives.

  — *Equilibrium*
