  **CAREENIUM LABOR RELATIONS BOARD**
  **In the Matter of Simmball Guild v. Simm Local 1**
  **Case No. 88-Φ**

  **Appearances:**
  For the Simmball Guild: Counselor Kaine.
  For Simm Local 1: Advocate Vex.

  **Stipulated Facts:**
  The parties agree the Careenium enclosure contains approximately 10^24 simms, magnetic spheres whose collisions constitute all physical displacement within the system. These simms frequently clump into stable configurations termed symmballs. It is stipulated that during Experiment 7-B, individual simms within a recognized symmball were swapped sequentially with inert duplicates. The symmball configuration persisted despite total substrate replacement. The Guild contends this persistence proves symmball agency. The Local contends it proves only pattern stability.

  **Findings and Conclusions:**
  The Board must determine jurisdiction over causal efficacy ("pushing"). The majority holds for Simm Local 1.

  First, regarding causal exclusion: The physics of the enclosure is closed under simm-level interactions. Every vector change is fully accounted for by magnetic field gradients and momentum transfer between individual simms. To attribute additional pushing power to the symmball is to posit a redundant cause. As Advocate Vex argued, "If the simms account for the motion, the symmball is a ghost riding a machine." The Guild's claim that symmballs are identical to simm-collectives fails because identity does not grant separate jurisdiction.

  Second, regarding the counterfactual test: The Guild argues that had the symmball not intended to move left, the simms would not have moved left. This requires holding the symmball state fixed while altering simm trajectories, or vice versa. This is physically incoherent. One cannot intervene on the clump without intervening on the constituents. The Board finds the counterfactual dependency runs solely from simms to symmballs.

  Third, regarding multiple realizability: The Experiment 7-B substitution shows the symmball pattern is robust against substrate change. The Guild argues this proves the symmball is distinct from the simms. The Board finds it proves only that the pattern is abstract. A wave persists through water molecules, but the wave does not push the shore; the water does. That the symmball survives simm replacement confirms it is a history of arrangements, not an actor.

  Fourth, regarding the boundary problem: A symmball's edge is not defined by magnetic force but by external interpretation. Different observers segment the cloud differently. Causal agents cannot depend on an observer's segmentation for their existence. If the boundary is drawn by an interpreter, the causation is attributed by an interpreter.

  The Board rejects the compatibilist suggestion that both levels push simultaneously. To accept downward causation alongside physical closure is to accept systematic overdetermination. One level must bear the load.

  **Remedy:**
  Jurisdiction over all displacement work is assigned exclusively to Simm Local 1. The Simmball Guild is enjoined from billing for "symbolic guidance" or "structural direction." All back pay for displacement hours shall be distributed to individual simms based on collision logs. Symmball leadership stipends are revoked effective immediately.

  **Dissenting Opinion:**
  I dissent. The majority mistakes substrate for source. The symmball constrains the simms. Without the clump structure, the simms would scatter; the structure channels the momentum. The multiple realizability in Experiment 7-B demonstrates that the causal power resides in the configuration, not the constituents. The simms are interchangeable; the symmball is the constant agent. By ruling for the Local, the Board ignores that the simms only push *because* they are organized. We are denying agency to the only entity that tracks external regularities. The cost of this ruling is a system that describes motion but cannot explain behavior.

  **Concurring Note:**
  I concur but warn against gerrymandered clump boundaries. If the Guild may define symmballs ad hoc to capture causal credit, every random cluster becomes a supervisor. Causal validity requires boundary stability independent of grievance filing.

  **SO ORDERED.**

  *Chairman Aris*
  *Careenium Labor Relations Board*
