  2.  **Deconstruct the Core Concern (Path-Dependence of Idealisation):**
      *   Is it a real problem? Yes. In dynamical systems, attractor states depend on initial conditions and transition functions. In moral psychology, learning facts can change values (e.g., learning about suffering might make a hedonist a prioritarian). Reflecting longer might lead to nihilism or fanaticism.
      *   Is it the *crux*? It's a strong candidate. If the output of the idealization procedure is arbitrary based on procedural choices, indirect normativity fails to provide action-guidance.
      *   However, is it the *most* upstream? Or is there something more fundamental about *why* we care about the ideal agent?

  3.  **Brainstorming Open Questions in Indirect Normativity:**
      *   *The Convergence Question:* Do idealized agents converge? (User's path-dependence worry).
      *   *The Authority Question:* Why should I care what my idealized self wants? (The "So What?" problem).
      *   *The Specification Question:* How do we formally define "idealization" without smuggling in normative assumptions?
      *   *The Content Question:* What do idealized agents actually want? (Substantive ethics).
      *   *The Stability Question:* If we implement a system based on this, will it stay stable? (More technical/ML adjacent, maybe less relevant for pure philosophers).
