          2.  **The Topology of Moral Space:** Does reflection converge, cycle, or chaotically diverge? (Formal/Conceptual).
          3.  **The Circularity of Idealization:** Can we define "better" without presupposing the answer?
          4.  **Substantive Convergence:** What is the actual output? (Low priority).

      *   *Wait, I need to be more decisive.* The user wants me to tell them if path-dependence is the crux.
