prompt: |-
  ok so I run a small interpretability lab and there's a fight that's been going on for like a year between two groups and I want to force them to write it down. Camp one, the realists: they think a trained network really does have internal states that stand for things -- features, variables, whatever -- and that the whole point of interpretability is to recover the ones the model is actually using, so that when we find a direction or an SAE feature we're discovering something that was there, and there's a fact of the matter about whether we got it right. Camp two, the deflationists: they think all the feature talk is bookkeeping we project onto the weights, that the only non-negotiable facts are about behavior and causal structure, that "this neuron means X" is a tool for prediction and control and not the kind of thing that's true or false, and that if two decompositions predict held-out activations equally well there's no further question which one is correct.

  I want the joint statement they could both actually put their names to. Ground it in stuff we can all see in the lab, not vibes. Things we have on hand: a tiny transformer trained to add numbers mod a prime (113 is what the usual demo uses) where the embeddings come out arranged on a circle, i.e. Fourier features; induction heads in small models doing in-context copying; linear probes that decode a property from layer L at like 95% accuracy but where ablating that direction doesn't move the output at all; activation patching where swapping one head's activations across prompts flips the answer; SAE features on the residual stream that look like "starts with a vowel" or "this token is inside a string literal," some of which do steer the model when you clamp them; and two SAEs with different sparsity penalties that give us totally different dictionaries that both reconstruct held-out activations about equally well. Also steering vectors, adding a direction at inference changes the sentiment of the continuation, but it also messes up three other things, which is part of why this got heated.

  What I want out of it: (1) numbered agreed claims -- the stuff that holds under both readings, nothing vacuous, nothing that only one side would nod at; (2) the disagreements, each one stated twice, once in words the realist would sign and once in words the deflationist would sign, no strawmen; (3) the cruxes, the sub-questions where settling one would actually move somebody; (4) for each crux, a case, argument, or experiment both sides agree would bear on it, with each side's prediction written down in advance. Suspect one crux is whether causal efficacy is required for representation or recoverability is enough, and another is whether the mod-113 circle represents numbers or is a lookup table in fancy dress, but you tell me. And if a chunk of this is just a word fight -- "representation" being asked to mean two different things at once -- say which chunk and why, don't paper over it. Table for the disagreement section is fine. Skip the references, we all know the papers, I want the actual content. Don't write a compromise that secretly hands it to one side either; they both have to be able to sign it.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A small interpretability lab with a year-long feud between two camps: "Realists" (features are real, ontological, truth-apt) and "Deflationists" (features are instrumental, pragmatic, predictive tools).
      *   **Goal:** A joint statement both sides can sign.
      *   **Constraints:**
          *   Grounded in lab evidence (Mod-113, induction heads, linear probes vs. ablation, activation patching, SAE features, steering vectors, competing SAE dictionaries).
          *   Structure: (1) Numbered Agreed Claims, (2) Disagreements (stated twice, once per camp), (3) Cruxes (sub-questions that matter), (4) Experiments/Cases for each crux with pre-registered predictions.
          *   Tone: Precise, non-vacuous, no secret compromise favoring one side, acknowledge verbal disputes if present.
          *   No references/citations needed, focus on content.

  2.  **Deconstruct the Camps:**
      *   **Realists:** Ontological commitment. "The model *has* features." Interpretability is *discovery*. There is a ground truth. If an SAE finds a feature, it's either the *real* feature or it isn't. Causal efficacy is often seen as a hallmark of reality, but high recoverability (reconstruction) might also count.
      *   **Deflationists:** Instrumental commitment. "The model *behaves as if* it has features." Interpretability is *modeling*. "Truth" is about predictive accuracy, not ontology. If two SAEs reconstruct equally well, neither is "more true." Causal efficacy is useful for control, but not necessary for a valid description.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to avoid metaphysical claims ("features exist") and purely instrumental claims ("features are just tools").
      *   Focus on empirical regularities observed in the lab.
      *   *Claim 1 (Structure):* Both agree models have internal structure (weights, activations) that correlates with input/output properties. (e.g., Mod-113 circle).
      *   *Claim 2 (Predictive Utility):* Both agree that finding directions/features allows prediction of activations/behavior on held-out data (SAE reconstruction).
      *   *Claim 3 (Causal Levers):* Both agree that some interventions (patching, steering) change outputs, while others (some probes) do not, despite high accuracy.
      *   *Claim 4 (Non-Uniqueness):* Both agree that multiple decompositions can achieve similar reconstruction loss (the two SAEs case).
      *   *Claim 5 (Task Dependence):* Both agree that the utility of a feature description depends on the downstream task (control vs. explanation vs. reconstruction).

  4.  **Drafting Section 2: Disagreements (The Core Conflict):**
      *   Need to phrase the *same* underlying tension in two different vocabularies.
      *   *Issue A: Ontology vs. Instrument.*
          *   Realist: We are finding pre-existing causal structures.
          *   Deflationist: We are constructing useful coordinate systems.
      *   *Issue B: The "True" Decomposition.*
          *   Realist: One SAE is closer to the model's actual algorithm (even if reconstruction is equal).
          *   Deflationist: "Closer to the algorithm" just means "better for a specific causal intervention," not "truer."
      *   *Issue C: Representation without Causality.*
          *   Realist: A probe can be right about what's represented even if ablation fails (redundancy).
          *   Deflationist: If ablation fails, the "representation" claim is overstated; it's just a correlate.

      *Refining the Table:* Make sure the Realist version sounds like discovery and the Deflationist version sounds like modeling, without making either sound stupid.

  5.  **Drafting Section 3: Cruxes (Where the rubber meets the road):**
      *   What would actually change minds?
      *   *Crux 1: Causal Necessity.* Does a feature need to be causally efficacious to be "real"?
      *   *Crux 2: Uniqueness under Constraint.* If we constrain SAEs enough (e.g., causal + reconstruction), do they converge?
      *   *Crux 3: The Mod-113 Case.* Is the circle *because* of the math or just a convenient embedding?

  6.  **Drafting Section 4: Experiments/Tests (Pre-registered Predictions):**
      *   Need specific setups using the lab's assets (Mod-113, SAEs, Patching).
      *   *Test 1 (Causal vs. Correlational):* Use the linear probe case.
          *   Setup: High accuracy probe, zero ablation effect.
          *   Realist Prediction: Redundancy exists; the information is there, just distributed.
          *   Deflationist Prediction: The probe is finding a shadow; the information isn't locally represented in a way that matters for the mechanism.
      *   *Test 2 (SAE Convergence):* The two SAEs with different sparsity.
          *   Setup: Add a causal penalty or constraint.
          *   Realist Prediction: Dictionaries will converge on the "true" features.
          *   Deflationist Prediction: Dictionaries will shift based on the penalty, still no single "true" set.
      *   *Test 3 (Mod-113 Generalization):*
          *   Setup: Change the prime or the operation.
          *   Realist Prediction: The circular structure persists because it represents the group structure.
          *   Deflationist Prediction: The structure changes because the optimal lookup strategy changes.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Keep it lab-practical.
      *   *Check Constraints:* Did I include the specific examples (Mod-113, induction heads, steering vectors)? Yes, weave them into the claims and tests.
      *   *Check "Word Fight":* Acknowledge that "representation" might be the contested term.
      *   *Check Bias:* Ensure the Deflationist position isn't framed as "anti-science" and the Realist position isn't framed as "naive platonism."
      *   *Self-Correction on Cruxes:* Make sure the experiments are actually doable in a small lab. The "convergence" experiment is good. The "ablation vs probe" is already observed, so the experiment needs to be about *interpreting* that observation. Let's make it about *finding* the causal path if the direct ablation fails.

  8.  **Final Polish:** Organize clearly with headers. Ensure the "Disagreement Table" is sharp. (Self-correction: Ensure the distinction between "recoverability" and "causal efficacy" is central, as requested).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Joint Statement on Feature Ontology and Interpretability Methodology

  **Date:** October 26, 2023
  **Signatories:** The Realist Camp, The Deflationist Camp
  **Context:** Internal lab dispute regarding the ontological status of discovered features (SAE latents, directions, heads) in transformer models.

  ## 1. Agreed Empirical Claims
  *We agree on the following observations derived from our current experimental suite (Mod-113 transformer, induction head models, SAE dictionaries, and steering interventions). These claims do not presuppose a specific metaphysical interpretation of "features."*

  1.  **Structural Regularity:** Trained networks exhibit stable geometric structures in activation space that correlate with input properties. Specifically, in the Mod-113 addition model, embedding dimensions align with Fourier bases arranged circularly, and this alignment predicts generalization performance on unseen sums.
  2.  **Reconstruction Non-Uniqueness:** It is possible to train multiple Sparse Autoencoders (SAEs) with different hyperparameters (e.g., sparsity penalties) that achieve statistically indistinguishable reconstruction loss on held-out activations while producing disjoint dictionaries of features.
  3.  **Dissociation of Readout and Control:** High-accuracy linear probes (e.g., 95% accuracy decoding a property from Layer L) do not guarantee causal efficacy. We observe cases where ablating the probed direction yields negligible change in model output, whereas activation patching of specific heads in the same layer reliably flips the output token.
  4.  **Steering Side-Effects:** Interventions that successfully steer high-level behavior (e.g., sentiment shift via vector addition) frequently degrade performance on orthogonal tasks (e.g., grammatical coherence or factual accuracy), indicating that discovered directions are not perfectly disentangled with respect to the model's loss landscape.
  5.  **Predictive Utility:** Descriptions of internal states in terms of "features" (e.g., "starts with a vowel," "inside string literal") allow both camps to successfully predict model behavior on out-of-distribution prompts, regardless of whether those features are deemed "real" or "instrumental."

  ## 2. Statement of Disagreement
  *We disagree on the interpretation of the claims above. The following table articulates the divergence without attempting to reconcile the terminology.*

  | Domain | Realist Formulation (Ontological) | Deflationist Formulation (Instrumental) |
  | :--- | :--- | :--- |
  | **The Status of Features** | Features discovered by SAEs or probes are approximations of causal variables actually used by the model's algorithm. A feature is "correct" if it matches the model's internal computation, even if other decompositions reconstruct activations equally well. | Features are coordinate systems imposed on the activation space. A feature is "valid" if it supports prediction or control. If two decompositions reconstruct equally well, neither is "more correct"; they are just different tools for different jobs. |
  | **Reconstruction vs. Truth** | The fact that two SAEs reconstruct equally well implies one (or both) is failing to find the *ground truth* basis. Reconstruction loss is a proxy for discovery, not the definition of it. | The fact that two SAEs reconstruct equally well implies there is no single *ground truth* basis to find. Reconstruction loss is the only objective metric of quality available; "truth" adds no predictive power. |
  | **Causal Efficacy** | A representation is genuine if it plays a causal role. If a probe reads information but ablation fails, the information is either redundantly encoded or the probe is reading a correlate, not the mechanism. | Causal efficacy is a property of the intervention, not the representation. A variable can be "represented" (readable) without being a causal bottleneck. Demanding causality conflates *description* with *control*. |
  | **Mod-113 Circle** | The circular embedding structure exists because the model represents numbers as elements of the additive group $\mathbb{Z}_{113}$. The geometry reflects the semantic structure of the task. | The circular embedding structure exists because it is a computationally efficient lookup mechanism for the loss function. The geometry reflects optimization pressure, not necessarily "semantic" representation. |

  ## 3. Cruxes
  *These are the specific sub-questions where resolving the uncertainty would force at least one camp to update their position significantly.*

  **Crux A: The Convergence Hypothesis**
  If we constrain the decomposition process sufficiently (e.g., requiring both reconstruction *and* causal identifiability), will independent methods converge on the same feature set?
  *   **Realist View:** Yes. As constraints tighten, the solution space shrinks toward the unique causal basis the model actually uses.
  *   **Deflationist View:** No. Even with causal constraints, multiple valid causal graphs can explain the same behavior (equifinality). Convergence would only show that the constraints favor a specific *type* of tool, not that the tool is "true."

  **Crux B: The Necessity of Causality for Representation**
  Is causal efficacy a necessary condition for a feature to count as a "representation"?
  *   **Realist View:** Yes (mostly). If a direction carries information but changing it changes nothing, it is a shadow, not a representation. True features must be part of the mechanism.
  *   **Deflationist View:** No. Readability is sufficient for representation. Causality is a separate property related to control. Conflating them limits our ability to describe redundant or robust systems.

  **Crux C: The Mod-113 Generalization**
  Does the circular structure persist because it represents *number*, or because it represents *this specific task's optimal compression*?
  *   **Realist View:** It represents number. If we change the task to multiplication mod 113, the circle should persist but the readout heads will change to reflect the new group operation.
  *   **Deflationist View:** It represents the task's loss landscape. If we change to multiplication, the geometry might change entirely because the optimal compression strategy for multiplication differs from addition.

  ## 4. Adjudication Experiments
  *For each crux, we propose a specific experiment using lab resources. Both sides pre-register their predictions.*

  ### Experiment 1: Causal-Constrained SAE Convergence (Addresses Crux A)
  **Setup:** Train two distinct SAE architectures on the same residual stream data.
  *   **SAE-1:** Optimized for reconstruction loss + sparsity (standard).
  *   **SAE-2:** Optimized for reconstruction loss + sparsity + a causal penalty (features must be independently patchable to affect downstream loss).
  **Measurement:** Measure the overlap (matched correlation) between the top 50 most active features of SAE-1 and SAE-2.
  **Realist Prediction:** Overlap will be significantly higher than chance (>0.6 correlation). The causal constraint will force SAE-1's "fuzzy" features to align with SAE-2's "causal" features, revealing the underlying truth.
  **Deflationist Prediction:** Overlap will remain low (<0.3 correlation). The causal penalty simply selects for features that are *easy to intervene on* (e.g., non-redundant), which is a subset of all predictive features, not the "true" set.

  ### Experiment 2: The Redundant Probe (Addresses Crux B)
  **Setup:** Take the layer where the 95% accuracy probe fails to ablate. Perform a "double ablation" or "path patching" experiment to identify if the information is distributed across multiple heads that sum to the probed direction.
  **Measurement:** Determine if there exists a *minimal* set of components that, when patched, kills the information *and* the behavior.
  **Realist Prediction:** We will find a minimal set. The probed direction was a linear combination of true causal features. Once we isolate the true features, ablation will work. The "representation" was real but distributed.
  **Deflationist Prediction:** We will find that the "minimal set" is arbitrary. We can patch Path A or Path B and break the behavior, but neither is privileged. The "representation" is a property of the whole subsystem, not decomposable into "features" that are individually true.

  ### Experiment 3: Mod-113 Task Swap (Addresses Crux C)
  **Setup:** Take the trained Mod-113 addition model. Fine-tune it on Mod-113 *multiplication* (keeping architecture and weights close to original via regularization).
  **Measurement:** Analyze the embedding geometry via PCA/ Fourier analysis.
  **Realist Prediction:** The circular geometry persists. The model still "represents numbers," it just uses a different circuit to operate on them. The ontology (numbers) is stable across tasks.
  **Deflationist Prediction:** The circular geometry degrades or shifts significantly. The circle was a solution to *addition*, not a representation of *number*. The ontology is task-relative.

  ## 5. Acknowledgement of Verbal Dispute
  *We acknowledge that a portion of this conflict may be terminological.*

  Both sides agree that the word **"representation"** is currently doing double duty.
  *   **Camp 1** uses "representation" to mean *"a variable in the causal graph of the mechanism."*
  *   **Camp 2** uses "representation" to mean *"a property of the state that is decodable by an observer."*

  **Agreement:** Until Experiment 2 is resolved, we will append suffixes to our internal documentation:
  *   Use **Rep-C** (Causal) when referring to variables that survive ablation/patching tests.
  *   Use **Rep-D** (Decodable) when referring to variables that are linearly readable but not necessarily causal.

  If Experiment 2 shows that all Rep-D features can be decomposed into Rep-C features, Camp 2 agrees to adopt Camp 1's terminology. If Experiment 2 shows that Rep-D features exist that cannot be reduced to a minimal Rep-C set (due to high-dimensional redundancy), Camp 1 agrees that "representation" cannot be defined solely by causal necessity.

  ***

  **Signed,**

  _________________________ (Lead, Realist Camp)

  _________________________ (Lead, Deflationist Camp)
