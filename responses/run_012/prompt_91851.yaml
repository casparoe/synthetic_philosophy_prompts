answer: |-
  This is a heavy burden to carry, and your rule is a strict retributivist framework with a subjective culpability constraint. It is ethically rigorous but often conflicts with standard sentencing guidelines which mix retribution, deterrence, and public protection.

  You asked for a procedure you can run in fifteen minutes. You also asked me not to soften the outcome when the rule conflicts with your instincts or standard practice. Here is the protocol.

  ### The 15-Minute Procedure

  Do not start with the sentencing guidelines. Start with this. If the law mandates a minimum that violates Step 2, you must follow the law, but you record the ethical conflict in your reasons.

  **Step 1: The Foresight Test (Culpability)**
  *   **Question:** At the exact moment they acted, what specific harm or rule-breaking did *they* know was on the table?
  *   **Real Answer:** "He knew taking the bike meant the owner lost transport." / "She knew drinking and driving risked a crash."
  *   **Not a Real Answer:** "He knew he shouldn't steal." (Too vague). "He knew he'd get caught." (Irrelevant to harm).
  *   **Stop Point:** If you cannot identify a specific risk they consciously accepted, you cannot justify suffering. Discharge or absolute dismissal.

  **Step 2: The Desert Ceiling (Proportionality)**
  *   **Question:** Based *only* on Step 1, what is the maximum suffering that matches that risk?
  *   **Real Answer:** "Losing a bike is financial loss and inconvenience. A fine matches that. Custody is too much suffering for property loss unless violence was risked."
  *   **Not a Real Answer:** "He needs to learn." "The community is worried."
  *   **Stop Point:** This is your hard ceiling. You cannot go above this number regardless of priors or public mood.

  **Step 3: The Priors Filter (Knowledge vs. Character)**
  *   **Question:** Do the priors prove he *knew better this time*, or just that he is a "bad person"?
  *   **Real Answer:** "He was convicted of theft last year, so he knows the specific penalty and the wrongness. His culpability is slightly higher than a naive first-timer."
  *   **Not a Real Answer:** "He's a repeat customer." "He doesn't respect the court."
  *   **Stop Point:** If the priors are for different crimes, they do not raise the Desert Ceiling for *this* act. They are irrelevant for Step 2.

  **Step 4: The Mitigation Sweep (Consequences)**
  *   **Question:** What extra suffering will happen automatically (job loss, family ruin) that isn't part of the sentence?
  *   **Real Answer:** "Losing her licence means losing her nursing job."
  *   **Action:** You can lower the sentence *below* the Desert Ceiling to account for this. You cannot raise it.
  *   **Stop Point:** If the automatic consequences already equal the Desert Ceiling, the sentence is zero (or a discharge).

  **Step 5: The Value Call (The Gut Check)**
  *   **Question:** Am I adding pain because I dislike him, or because he earned it?
  *   **Action:** If you feel anger, disgust, or a desire to "teach a lesson," stop. That is the signal you are violating Step 2.
  *   **Admission:** If you cannot separate the two, you must default to the lower end of the range.

  ***

  ### Where This Procedure Will Misfire

  You need to know where this tool breaks so you don't trust it blindly.

  1.  **Dangerousness:** Your rule looks backward (what did you deserve for what you did?). It does not look forward (is he dangerous now?). If a man is a persistent arsonist but each fire was small, your rule says "small sentence." Public safety says "lock him up." Your rule has no answer for prevention.
  2.  **Mandatory Minimums:** The law sometimes forces you to punish more than desert (e.g., minimum driving bans, "three strikes" policies). In these cases, your rule creates moral distress but no legal out.
  3.  **The "Rich vs. Poor" Glitch:** A £500 fine is "equal suffering" in law, but ruinous to a poor defendant and nothing to a rich one. Your rule focuses on *desert*, not *impact equality*. It might punish the poor harder in practice.
  4.  **Victim Vindication:** If a victim needs to see a harsh sentence to feel justice is done, your rule forbids you from giving it to them. You will have to tell a victim their pain doesn't justify extra prison time.

  ***

  ### Running the Cases

  Here is the output when you run the procedure strictly.

  #### 1) The 19-Year-Old Bike Thief (2 Priors, No Job)
  *   **Step 1 (Foresight):** He knew the owner would lose the bike. He knew it was illegal.
  *   **Step 2 (Ceiling):** The harm is financial loss and inconvenience. Custody is suffering disproportionate to the act of theft alone. Ceiling = Community Order or Fine.
  *   **Step 3 (Priors):** He has two priors. He knows the penalty. This nudges culpability up, but does it nudge a *bike theft* up to *prison*? Under your rule: No. The act itself sets the ceiling. Priors only confirm he isn't naive.
  *   **Step 4 (Mitigation):** No job. A high fine he can't pay turns into a warrant, which turns into custody. That is suffering via poverty, not desert.
  *   **Step 5 (Value Call):** You might feel he needs "structure." That is rehabilitation (forbidden as an aggravator).
  *   **Procedure Verdict:** **Community Order (Unpaid Work) or Low Fine.**
  *   **The Conflict:** Standard guidelines often push for custody for persistent offenders to "break the cycle." Your rule forbids this. You cannot lock him up to fix his life. You can only punish the theft. If the theft doesn't deserve prison, he doesn't get prison, even if he's on his third time.

  #### 2) The Nurse (DUI, First Offence, Family Provider)
  *   **Step 1 (Foresight):** She knew driving drunk risked death/serious injury, even if no one was hurt. High culpability risk.
  *   **Step 2 (Ceiling):** The risk was death. The Desert Ceiling is high (could justify custody in extreme cases, usually high fine + ban).
  *   **Step 3 (Priors):** None. Naive risk-taking.
  *   **Step 4 (Mitigation):** Mandatory ban applies (law). But she loses her job and family stability. This is massive collateral suffering.
  *   **Step 5 (Value Call):** Do not reduce the ban (law). But reduce the *financial* penalty because the job loss is already a massive punishment.
  *   **Procedure Verdict:** **Mandatory Ban + Significantly Reduced Fine.**
  *   **The Conflict:** You might feel leniency is unfair to a poor person who didn't lose their job. Your rule accepts this asymmetry. She suffers more total pain (job + fine) than a labourer (fine only), but the *state-imposed* suffering is calibrated down because the *total* suffering hit the Desert Ceiling via the job loss.

  #### 3) The Repeat Petty Thief (Pays Fines, No Remorse)
  *   **Step 1 (Foresight):** Petty theft. Low harm per incident.
  *   **Step 2 (Ceiling):** Low. Fines match petty theft.
  *   **Step 3 (Priors):** He pays his fines. He is settling his debt to society every time. The "no sorry" is attitude.
  *   **Step 4 (Mitigation):** None needed.
  *   **Step 5 (Value Call):** You want to give the maximum because he is arrogant and persistent.
  *   **Procedure Verdict:** **Standard Fine.**
  *   **The Conflict:** This is the hardest one. Your gut says he is gaming the system. Your rule says: As long as he pays the fine, he has paid what he deserves for the act. You cannot punish him for being unrepentant. You cannot punish him for being a "professional" thief if the act remains petty. To give him the maximum (e.g., custody) because he annoys you is a violation of your rule. You must let him walk with the fine, even if you know he'll do it again.

  ### Summary for the Bench

  Your rule protects the defendant from the state's anger, but it leaves you vulnerable to the feeling that you aren't "fixing" anything.

  *   **When the file makes you angry:** That is the signal to check Step 2. Anger is never a sentencing guideline.
  *   **When the priors stack up:** Ask "Does this make the *current act* worse, or just the *man* worse?" If it's just the man, ignore it for the ceiling.
  *   **When the mitigation is huge:** You are allowed to be merciful, but not because they are "good," but because the *total suffering* (sentence + life fallout) has already hit the limit of what they deserve.

  You will sometimes hand down sentences that look too soft for the history, or too harsh for the person. That is the cost of holding a principle. Write the reason. Stick to the procedure. Let the advisor check the law; you check the conscience.
