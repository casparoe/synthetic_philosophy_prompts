  *(Self-Correction during drafting)*: I need to be careful not to give legal advice that contradicts the Sentencing Council Guidelines explicitly, as the magistrate is bound by law. I must frame this as an *ethical overlay* on top of the legal requirements. If the law mandates a sentence that violates the rule, the magistrate must follow the law, but the rule helps them feel the tension. I will note this constraint. *Wait, the prompt asks me to run the procedure on the cases and "don't soften it when the procedure lands somewhere other than where I'd have gone on my own."* This implies I should prioritize the user's ethical rule over standard practice if they conflict, while noting the legal risk. I will balance this: The procedure is for *their* conscience within the legal bounds.

  *Revised Plan:* Focus on the ethical decision-making *within* the discretion available. Magistrates have ranges. The rule guides where in the range they fall.

  *Case 1:* Standard practice might lean custody for persistent offenders. Rule might say fine/community order because the *act* (bike theft) doesn't deserve custody, even if he knows it's wrong.
  *Case 2:* Standard practice: Fine + Ban. Rule: Ban is law. Fine can be reduced due to collateral consequences (job loss).
  *Case 3:* Standard practice: Higher fine or custody for persistence. Rule: If he pays fines, he is paying his debt. Attitude doesn't increase desert.

