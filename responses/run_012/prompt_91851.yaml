      *   **Context:** High volume (15 mins/case, dozen cases/day), pressure, reliance on legal advisors for post-checking.
      *   **Ethical Framework:** Retributivist core ("suffering only allowed because they deserve it") + Subjective Culpability ("what they knew they were risking at the time"). Consequentialist factors (deterrence, rehabilitation, victim satisfaction) can only *mitigate*, never *aggravate*.
      *   **Problem:** Can't distinguish rule-following from gut feeling dressed up. Struggles with the "character vs. act" tension (priors/attitude).
      *   **Task:** Convert the ethical rule into a concrete 15-minute procedure. Apply it to three specific cases. Explain limitations/failure modes.
      *   **Tone:** Direct, practical, no fluff, no textbook theory, respectful of the gravity of the role but acknowledging the constraints.

  2.  **Deconstruct the Ethical Rule:**
      *   *Principle 1 (Desert Constraint):* Suffering $\le$ Desert. Consequences (deterrence, rehab) $\le$ Mitigation only.
      *   *Principle 2 (Subjective Culpability):* Desert = Foreseeable risk at the time of action (agent's perspective), not hindsight outcome severity.
      *   *Tension:* Priors/Character. The friend says courts punish the person. The rule says punish the act (based on knowledge at the time). How to reconcile? Priors affect *culpability* (knowing the risk better) or *mitigation* (less need for severe sanction if they keep paying fines?), but shouldn't increase desert beyond the act's inherent wrongness *unless* the prior shows heightened awareness of the specific wrong.

  3.  **Develop the Procedure (The "15-Minute Algorithm"):**
      *   Need to fit into the magistrates' court workflow (Charge -> Plea -> Facts -> Mitigation -> Adjourn/Sentence).
      *   *Step 1: The Act & The Risk (Culpability).* What did they do? What did *they* know was the risk? (Addresses Principle 2).
      *   *Step 2: The Ceiling (Desert).* Based on Step 1, what is the maximum suffering justified? (Addresses Principle 1).
      *   *Step 3: The Person (Priors/Character).* Do priors increase culpability or just show persistence? If they knew better last time, culpability is higher. If it's just "they keep getting caught," that's character, not necessarily higher desert for *this* act.
      *   *Step 4: Consequentialist Check.* Can I go lower for rehab/deterrence? Can I go higher? (NO).
      *   *Step 5: The Stop/Value Call.* Where does the math end and the judgment begin?

      *Refining the "Priors" issue:* The user's rule says desert is set by "what they actually knew they were risking." If someone has priors for theft, they *know* theft is wrong and carries penalties. This arguably increases culpability compared to a naive first-timer. However, punishing "the person" implies punishing their status. The procedure needs to distinguish between "known risk" (relevant) and "bad character" (irrelevant for desert ceiling).

  4.  **Drafting the Procedure Steps:**
      *   *Q1: The Foresight Test.* (What did they know?)
      *   *Q2: The Ceiling.* (Max penalty based on Q1).
      *   *Q3: The Priors Filter.* (Do they prove heightened knowledge or just bad luck/need?)
      *   *Q4: The Mitigation Sweep.* (Collateral consequences, rehab potential).
      *   *Q5: The Gut Check.* (Is this suffering or just management?)

  5.  **Applying to Cases:**

      *   *Case 1 (19yo Bike Thief, 2 priors, no job):*
          *   Act: Theft. Risk: Loss of property, criminal record.
          *   Priors: Shows he knows it's wrong and carries penalties. Increases culpability slightly? Or just shows need?
          *   Mitigation: Age, poverty (maybe).
          *   Rule Application: Can't sentence heavily just to "teach him a lesson" (deterrence). Must fit the desert of the theft + knowledge.
          *   Outcome: Likely a fine or community order, not custody (unless violence/threat involved, which isn't stated). But the rule prevents locking him up *just* because he's a repeat offender if the act itself doesn't deserve it. *Correction:* In UK law, persistent petty offenders can get custody. The rule challenges this. If the act is low harm, custody is too much suffering regardless of priors, unless priors prove he *knows* the specific risk of custody and ignores it.
          *   *Strict Rule Application:* Priors increase knowledge of wrongness, but do they increase the *deserved suffering* for a bike? Maybe not. The rule might clash with sentencing guidelines here. I need to be honest about that clash.

      *   *Case 2 (Nurse, DUI, First Offence):*
          *   Act: DUI. Risk: Accident/Death (even if didn't happen).
          *   Knowledge: She's a professional, knows the law. High culpability on risk.
          *   Consequences: Job loss, family ruin.
          *   Rule Application: High desert ceiling (dangerous act). BUT, collateral consequences (job loss) are severe suffering. Can use them to mitigate *down*. Cannot use "she's a good person" to lower desert, but can use "she's already suffering enough" to lower sentence.
          *   Outcome: Ban is mandatory (law). Fine/Points? The rule says don't add extra punishment for deterrence.

      *   *Case 3 (Repeat Petty Thief, Pays Fines, No Sorry):*
          *   Act: Petty theft.
          *   User's Gut: Wants max penalty because of attitude.
          *   Rule Check: Attitude (no sorry) does not increase *desert*. Paying fines shows he can pay.
          *   Outcome: Rule says stop. Don't max it out just because he's annoying. If the act is petty, the sentence must be petty. Priors show knowledge, but if he's paying the price (fines), is more suffering deserved?
          *   Conflict: The user *wants* to punish the attitude. The rule forbids it.

  6.  **Identifying Limitations (The "Misfire"):**
      *   Dangerousness: The rule focuses on *past* act desert. It doesn't handle *future* risk well (protective sentencing).
      *   Systemic Issues: Poverty driving crime (Case 1). Punishing poverty fits "desert" technically but feels wrong.
      *   Mandatory Minimums: The law might force a sentence the rule says is too high (e.g., "Three Strikes" laws, though less common in UK summary courts, still mandatory bans exist).
