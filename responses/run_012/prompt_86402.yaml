answer: |-
  # Lesson Plan: The Representation of Choice
  **Course:** Upper-Level Seminar in Philosophy of Economics
  **Time:** 90 Minutes
  **Students:** 16
  **Goal:** Experiential demonstration that utility is a structural representation of choice consistency, not a psychological magnitude.

  ## I. Materials & Preparation

  1.  **Bundle Cards (16 sets):** Each set contains three cards (A, B, C) describing bundles of two goods (e.g., "Hours of Leisure" vs. "Dollars of Stipend").
      *   *Engineering the Cycle:* We exploit **just-noticeable differences (JND)** to induce intransitivity.
      *   **Bundle A:** 10 Hours Leisure, \$50 Stipend.
      *   **Bundle B:** 11 Hours Leisure, \$48 Stipend. (Leisure gain noticeable; Money loss negligible).
      *   **Bundle C:** 12 Hours Leisure, \$46 Stipend. (Leisure gain noticeable; Money loss negligible).
      *   *The Trap:* In pairwise comparisons, students often treat the \$2 loss as negligible compared to the 1-hour gain ($B \succ A$, $C \succ B$). However, when comparing A vs. C directly, the \$4 loss becomes salient against the 2-hour gain, often flipping preference ($A \succ C$).
  2.  **Point Ledger:** A spreadsheet or whiteboard track for the "Broker."
  3.  **Broker Kit:** 50 "Bank Points" (tokens or slips).
  4.  **Number Sheets (16 unique):**
      *   Group 1 (4 students): $U(x) = \text{Rank}$ (1, 2, 3).
      *   Group 2 (4 students): $V(x) = \text{Rank}^2$ (1, 4, 9).
      *   Group 3 (4 students): $W(x) = \ln(\text{Rank} + 1)$ (0.69, 1.1, 1.38).
      *   Group 4 (4 students): $Z(x) = 100 \times \text{Rank} + 5$ (105, 205, 305).
      *   *Note:* All sheets preserve the *same* ordinal ranking of the bundles from Stage 1.
  5.  **Lottery Slips:** Two scenarios involving probabilities.
  6.  **Prize:** A small tangible reward (e.g., a nice chocolate bar) for the top point-scorer.

  ---

  ## II. Timeline & Procedure

  ### Stage 1: The Cycle and the Broker (35 Minutes)
  **Rule:** No mention of "utility," "transitivity," or "rationality."

  1.  **Setup (5 mins):**
      *   Distribute Bundle Cards (A, B, C) to all 16 students.
      *   **Instruction:** "You will make three pairwise choices. Circle the bundle you prefer. There are no right answers. Choose what you actually want. These points contribute to a prize draw."
      *   **Selection:** Ask for one volunteer to be the "Trader" (Broker). Give them the 50 Bank Points.
      *   **Broker Instruction (Private):** "Your goal is to end with more points than you started. You may approach any student who holds a bundle and offer to trade them a different bundle for 1 Point. They accept or reject. Record every trade."

  2.  **Choice Phase (10 mins):**
      *   Students privately circle preferences: A vs B, B vs C, C vs A.
      *   Collect sheets quickly to check for cycles (do not reveal results yet).
      *   *Expected Outcome:* With 16 students, the JND engineering should yield 4–6 students with a cycle ($A \succ B \succ C \succ A$).

  3.  **Trading Phase (15 mins):**
      *   Students are assigned their "winning" bundle based on their first choice (e.g., if they picked A over B, they hold A).
      *   **Broker Action:** The Broker circulates.
          *   If a student has A but previously indicated $B \succ A$, the Broker offers: "I will give you Bundle B for 1 Point."
          *   Since the student prefers B, they pay the point.
          *   Broker repeats for C, then back to A.
      *   **Observation:** The class watches the Broker accumulate points from the same students repeatedly.
      *   **Stop Condition:** Stop when a student runs out of points or refuses a trade (breaking the cycle).

  4.  **Freeze (5 mins):**
      *   Collect all data. Do not explain *why* the Broker succeeded. Just record the point totals.

  ### Stage 2: The Numbers Game (40 Minutes)

  1.  **Ordinal Discovery (15 mins):**
      *   Hand out the **Number Sheets**. Each student gets a different function ($U, V, W, Z$) assigned to the *same* bundles they just chose.
      *   **Task:** "Your number sheet claims to represent your value for these bundles. Working in groups of 4 (mixed sheets), design a choice experiment using *only certain bundles* that proves your numbers are the 'true' values and the others are false."
      *   **Discovery:** They will realize they cannot. Any choice that maximizes $U$ also maximizes $V, W, Z$.
      *   **Conclusion:** Under certainty, any monotone transformation is empirically indistinguishable.

  2.  **Lottery Discovery (25 mins):**
      *   **Task:** "Now we introduce risk. You must choose between Lotteries."
      *   **Scenario 1:**
          *   Option S: Bundle B for sure.
          *   Option G: 50% Bundle A, 50% Bundle C.
      *   **Instruction:** "Calculate the 'Expected Value' of your numbers for S and G. Choose the higher one."
      *   **The Reveal:**
          *   Student with $U$ (linear): Might be indifferent.
          *   Student with $V$ (convex): Will prefer G (risk-seeking).
          *   Student with $W$ (concave): Will prefer S (risk-averse).
      *   **Discussion:** "Did the numbers change the bundles? No. Did they change the choice? Yes. Why?"
      *   **Follow-up:** "If utility is just a representation of choice, which numbers were 'right'?"
      *   **Answer:** The ones that matched what they *actually* chose when faced with the risk. This fixes the scale up to an **affine** transformation ($aU + b$), not just monotone.

  ### Debrief & Mapping (15 Minutes)
  *Do not lecture until now. Draw the connections on the board.*

  1.  **The Broker's Profit:**
      *   *Concept:* **The Money Pump.**
      *   *Point:* Intransitivity isn't just a logical error; it has a cost. If you cycle, you bleed resources. Preference consistency is a survival constraint, not just an aesthetic one.
  2.  **Stage 1 Choices:**
      *   *Concept:* **Revealed Preference.**
      *   *Point:* We did not ask "How happy does this make you?" We asked "Which do you pick?" Preference *is* the choice, not the feeling behind it.
  3.  **Stage 2 (Certainty):**
      *   *Concept:* **Ordinal Utility.**
      *   *Point:* Under certainty, utility is a ranking. $U$ and $U^2$ tell the same story. There are no "units" of satisfaction.
  4.  **Stage 2 (Lotteries):**
      *   *Concept:* **Expected Utility & Affine Transformation.**
      *   *Point:* Risk introduces structure. To maximize expected value consistently, the intervals between numbers matter. The scale is fixed up to origin and unit ($aU+b$), but still not "absolute."
  5.  **The Limitations (Crucial):**
      *   *Welfare:* "Did the Broker make you worse off?" Yes, in points. But did satisfying your preference make you *happy*? This activity says nothing about welfare. You can consistently choose poison.
      *   *Interpersonal:* "Can we compare Student 1's '100' to Student 2's '100'?" No. The numbers are indexical to the chooser.

  ---

  ## III. Predicted Failures & Mitigations

  | Failure Mode | Description | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **The Strategist** | Students suspect the point and force transitive choices in Stage 1 to "beat" the experiment. | **Pre-emptive Framing:** "We are studying *actual* human choice architecture. A 'perfectly rational' robot is boring data. Your honest inconsistencies are worth more than a perfect score." |
  | **The Indifferent** | "I don't care between A and B." They refuse to pick, breaking the cycle logic. | **Forced Choice:** "In economics, indifference is a specific claim. For this activity, you must pick one. Imagine you *must* leave the room with one." |
  | **Allais Violations** | In Stage 2 Lotteries, students violate Independence (e.g., prefer S in one context, G in another identical context). | **Incorporate into Debrief:** "Good. This shows Expected Utility is a *model*, not a law of physics. It shows why we distinguish between *normative* (how to choose) and *descriptive* (how we choose)." |
  | **Broker Collusion** | The Broker friends with a "cycler" and lets them keep points. | **Incentivize the Broker:** "The Broker keeps 50% of all points extracted. The student with the most points at the end gets the prize." Make it competitive. |

  ---

  ## IV. What This Activity Cannot Show (Frank Limitations)

  *Include this explicitly in the final 5 minutes of the debrief.*

  1.  **Welfare:** "We showed that utility represents choice. We did *not* show that satisfying choice makes you better off. A consistent addict has a utility function. This activity is silent on well-being."
  2.  **Interpersonal Comparison:** "Student A's '10 utility' and Student B's '10 utility' are incomparable. We cannot sum them to find 'social good.' The numbers are tools for individual consistency, not a common currency of happiness."
  3.  **Psychological Reality:** "These numbers are not in your head. You do not calculate $0.5 \times U(A)$ when choosing. The model *represents* your behavior *as if* you calculated it. Do not reify the math."

  ---

  ## V. Instructor Notes for Engineering the Cycle

  To maximize the likelihood of cycles in Stage 1 without lying:
  *   **Visual Layout:** Present the bundles on cards where the dimensions are not aligned. (e.g., Leisure on the left for Card A, on the right for Card B). This increases cognitive load and reliance on heuristics.
  *   **The "Negligible" Prompt:** When handing out cards, verbally say: "Some differences might seem small. Just go with your gut." This licenses the JND heuristic that drives the intransitivity.
  *   **Broker Aggression:** Instruct the Broker to be polite but persistent. "You picked B over A last time. I'm giving you a chance to upgrade for just 1 point. It's a deal." The social pressure helps reveal the latent preference.

  ## VI. Debrief Script Snippets

  *   **On the Broker:** "Look at the Ledger. The Broker made 15 points. Did anyone lose points but end up with the same bundle they started with? (Hands go up). That is the price of intransitivity. It is not a logical sin; it is a tax."
  *   **On the Numbers:** "Group 1 had numbers 1, 2, 3. Group 2 had 1, 4, 9. In Stage 1, you agreed on everything. In Stage 2, you disagreed. Why? Because risk turns a ladder (ordinal) into a ruler (cardinal). But even a ruler is arbitrary. I can measure you in inches or centimeters. That is the affine transformation."
  *   **On the Philosophy:** "If utility is just a representation of choice, then 'Maximizing Utility' is a tautology. It means 'Choosing what you choose.' It becomes interesting only when we add constraints, like risk or consistency, which limit which representations are allowed."
