answer: |-
  Émilie du Châtelet's *Discourse on Happiness* offers a psychology that is strikingly modern, anticipating the paradox of hedonism long before it was named. She suggests that the direct pursuit of happiness is a category error. Happiness is not a target but a resonance; it is the "surplus" felt when the mind is fully extended toward an object worthy of its capacity. To argue for this **surplus thesis** is to argue for a reorientation of moral philosophy: away from the optimization of internal states and toward the curation of external engagements.

  To vindicate the surplus thesis as a practical guide rather than a mere description, we must treat it as a technology of attention. It claims that the energy we usually spend monitoring our satisfaction is better spent fueling the activity that generates it. However, for this thesis to hold water, it must survive three significant challenges regarding agency, discrimination, and accessibility.

  ### I. The Paradox of Deliberation

  The first difficulty concerns agency. If happiness cannot be aimed at directly, does deliberation become impossible? If I cannot choose $X$ because it makes me happy, but only because it occupies me, how do I choose between competing occupations? Furthermore, does this thesis offer anything new beyond the platitude that "happiness is a byproduct of absorbing activity"?

  The surplus thesis is distinct from the byproduct view in its account of *energy*. A byproduct is waste heat; it is incidental. A surplus, economically speaking, is reinvestable capital. Du Châtelet's insight is that the feeling of happiness is not just a side effect of passion; it is the *fuel* that sustains the passion against fatigue and disillusionment. When we are deeply occupied, the "surplus" is the sensation of our powers expanding rather than depleting.

  This distinction changes how we deliberate. We do not deliberate about feelings (which are retrospective), but about *conditions of absorption*. Deliberation shifts from the question "Will this make me happy?" to "Will this sustain my attention?" This is a crucial practical correction. The direct pursuer of happiness treats activities instrumentally: "I will write this book *to be* happy." When the writing becomes difficult, the instrument seems broken, and happiness vanishes. The surplus thinker treats the activity as constitutive: "I write because the problem occupies me." The difficulty of the writing is part of the occupation, not an obstacle to the reward.

  Therefore, deliberation remains possible, but its locus changes. We deliberate *ex ante* about which objects are substantial enough to absorb us, and *ex post* about whether our capacity for absorption was maintained. The surplus thesis adds a warning against *meta-monitoring*. It posits that the act of checking for happiness is itself a distraction that reduces the intensity of the occupation, thereby reducing the surplus. It guides life by forbidding a specific kind of introspection during action. It tells us: do not look at the gauge while driving the car.

  ### II. The Problem of Discrimination

  The second difficulty is more perilous. If happiness is the surplus of passion, how do we distinguish between passions that generate a sustainable surplus and those that consume the self? From the inside, the frenzy of addiction and the fervor of devotion feel identical. Both fully occupy the agent. Both generate a sense of intensity that feels like life. If we wait until the illusion collapses to judge the passion, it may be too late.

  Du Châtelet acknowledges that illusions are necessary for passion; we must overvalue the object to engage with it fully. However, the surplus thesis provides a criterion for discrimination based on *durability* and *renewability*.

  A consumptive passion relies on an illusion that is fragile in the face of reality. For example, the passion for being admired relies on the illusion of one's own centrality. Reality inevitably corrodes this, as the world is indifferent. When the illusion breaks, the activity (seeking admiration) cannot continue, and the surplus turns into a deficit of shame or boredom.

  A productive passion, like the love of study (or any deep craft), relies on an illusion that is robust or perhaps unnecessary. One might overvalue the importance of a specific mathematical proof, but the activity of proving it engages with a reality (logic) that does not shatter under scrutiny. In fact, the reality deepens the engagement.

  To make this precise enough to guide life, we can propose a **test of disillusionment**. When choosing a project or attachment, ask: *If my idealized view of this object is slightly corrected by reality, does the activity become more interesting or impossible?*
  *   If I idealize my lover as perfect, and they reveal a flaw, does my passion die? If so, it is consumptive.
  *   If I idealize a field of study as the key to truth, and I find it is more complex than I thought, does my curiosity deepen? If so, it is productive.

  The surplus thesis thus guides us to seek objects that are *inexhaustible*. Human beings are finite; relying on a person to fully occupy us is a risk. Systems of knowledge, skills, or creative practices are potentially infinite. The distinction is not moralistic (vice vs. virtue) but structural (finite vs. infinite objects). We can distinguish passions not by how they feel in the moment, but by their trajectory when confronted with resistance. Consumptive passions break against resistance; productive passions feed on it.

  ### III. The Charge of Elitism

  The third difficulty strikes at the social viability of the thesis. Du Châtelet privileges the "love of study" (specifically the sciences and philosophy) as the passion most capable of outlasting others. This invites the charge of elitism. Study requires leisure, education, and a specific temperament. Is the surplus thesis merely a philosophy for the aristocracy of the mind, unavailable to those struggling for subsistence or lacking formal training?

  We must be candid: there is an element of privilege in Du Châtelet's specific biography that cannot be erased. She wrote from a château with a library and a staff. However, the surplus thesis can be decoupled from the specific content of "academic study" and applied to the *structure* of study.

  "Study" here should be understood as *systematic engagement with a complexity that resists mastery*. A parent navigating the complexities of a child's development, a carpenter mastering the grain of wood, or a community organizer understanding the dynamics of a neighborhood are all engaged in a form of "study." They are engaging with an object that is real, resistant, and inexhaustible. The surplus thesis is not elitist in its *logic*, only in its *examples*.

  However, we must admit a hard limit. The surplus thesis requires a baseline of security. It is difficult to be "fully occupied" by a craft when one is occupied by survival. If the mind is consumed by the anxiety of rent or safety, there is no cognitive bandwidth for the deep absorption required to generate the surplus. In this sense, the thesis is structurally biased toward those with security.

  To make this constructive rather than defensive, the surplus thesis must advocate for the *protection* of absorption time as a primary good, not a luxury. It suggests that social arrangements should be judged by how well they allow citizens to find objects of deep occupation. But we must also be honest about where the thesis fails. It cannot console the tragic. If the "activity that fully occupies us" is destroyed by external catastrophe (war, illness, oppression), the surplus vanishes. The thesis is a guide for navigating the *internal* economy of attention, not a shield against *external* misfortune. It is not a theodicy; it is a strategy for resilience.

  ### Conclusion: The Limits of the Guide

  The surplus thesis argues that happiness is the shadow cast by a mind standing firmly in the light of a difficult task. It guides life by redirecting our aim: stop hunting the shadow, and tend to the stance.

  It survives the first difficulty by redefining deliberation as the curation of attention rather than the optimization of feeling. It survives the second by offering a test of durability against disillusionment, distinguishing between passions that break on reality and those that deepen with it. It survives the third by broadening "study" to any inexhaustible engagement, while conceding that material security is a prerequisite for the leisure to engage deeply.

  Yet, we must end with candor regarding the limits of this doctrine. The surplus thesis cannot tell us *which* truth to study, nor can it guarantee that the object of our love will not die. It is a formal constraint on how we pursue ends, not a generator of the ends themselves. Du Châtelet's insight is that while we cannot control fortune, we can control the fragility of our attachments to it. By anchoring our passions in objects that do not rely on illusion to survive, we maximize the surplus of happiness available to us. But there will be days when the surplus is zero. On those days, the thesis offers no comfort, only the reminder that the pursuit of happiness was never the point—the occupation was.
