answer: |-
  Here is the plan for your ninety minutes.

  ### 1. The Setup: Sell the Lie (10 Minutes)
  Do not start by telling them the Conditional Analysis (CA) is wrong. Start by telling them why it is *tempting*. For a group of biologists and CS folks, the CA looks like operationalism. It promises to clean up "spooky" talk about powers and replace it with clean, testable if-then statements.

  *   **The Pitch:** Frame the CA as a tool for verification. "Fragile" is just a shorthand for "If struck, it breaks." This appeals to their empirical instincts. It turns a hidden property into a public prediction.
  *   **The Trap:** Write the biconditional on the board: *X is disposed to M if S = If S were to happen, X would M.* Tell them your goal is to see if this reduction holds water.
  *   **Why this matters to them:** Emphasize that if this works, we never need to talk about "capacities" or "functions" again, only observed behaviors and test conditions. That is the hook.

  ### 2. The Carrying Case: The Fink (35 Minutes)
  Use **Case 1 (The Live Wire)**. This must carry the session.

  *   **Why the Wire and not the Ball?** The Ball (Case 2, Mask) is vulnerable to a scientist's instinct to say "ceteris paribus" (all else being equal). They will argue the shell is an interfering variable, like humidity or friction. You will spend the whole hour fighting control variables. The Wire (Fink) closes that loophole because the stimulus *itself* triggers the removal of the property. There is no "outside interference"; the test destroys the very thing being tested.
  *   **Why not your Case 4?** Case 4 is just a specific version of Case 1. It adds unnecessary complexity ("only if being tested") to a mechanism that is already clear in Case 1. Drop it.
  *   **Why not your Case 5?** The self-defeating calm is fascinating, but it introduces psychological reflexivity that distracts from the logical point about counterfactuals. It risks turning the session into a discussion about psychology rather than metaphysics. Drop it.
  *   **How to teach it:**
      1.  Describe the wire: It is live. It has the intrinsic structure of a live wire.
      2.  Describe the mechanism: Touching it triggers a cutout that makes it dead instantly.
      3.  Run the Conditional: "If you touched it, would it shock you?" No.
      4.  The Conclusion: The conditional is false, but the disposition (being live) is true. The reduction fails.
  *   **Head off Misconception #1 (Fink vs. Mask):** Halfway through this section, explicitly contrast this with the Ball (Case 2). Say out loud: "In the Ball case, the capacity is there but blocked from the outside. In the Wire case, the capacity vanishes *because* of the test. This isn't an interfering cause; it's a structural failure of the definition." Do not let them conflate the two.

  ### 3. The Reverse Blow: The Mimic (15 Minutes)
  Use **Case 3 (Shatter-proof pane rigged to shatter)**.

  *   **Purpose:** You have shown that Disposition $\nrightarrow$ Conditional. Now show Conditional $\nrightarrow$ Disposition.
  *   **The Point:** The glass behaves exactly as if it were fragile (the conditional is true), but it lacks the intrinsic basis (it's actually shatter-proof).
  *   **The Takeaway:** Counterfactuals can be true by accident or external rigging. Dispositions require an internal ground. This sets up your payoff about the "categorical basis."

  ### 4. Damage Control: What Survives? (10 Minutes)
  You must address **Misconception #2** here: that killing the CA kills dispositions.

  *   **The Correction:** State clearly: "We have not proven dispositions don't exist. We have proven they are not *just* counterfactuals."
  *   **The Shift:** Tell them dispositions are real, but they are *categorical properties* that *ground* the counterfactuals, not the counterfactuals themselves.
  *   **Why this matters:** If you don't say this, the biologists will leave thinking "functions aren't real" and the CS people will think "state variables are illusions." Reassure them that the property is real, it just resists being defined solely by its output.

  ### 5. The Payoff: Deception and Regress (20 Minutes)
  Bring it home to the scenario you specified.

  *   **The Scenario:** A system is disposed to deceive, but a monitor shuts it off if it tries.
  *   **The Connection:** This is the Wire (Fink) case again. Ask: "Is it a deceptive system?"
      *   If they say "No, because it never deceives," they are stuck with the Conditional Analysis you just broke.
      *   If they say "Yes," they admit the disposition exists independently of the manifestation.
  *   **The Basis Question:** Ask whether the "disposition to deceive" is more fundamental than the "code that runs the deception."
      *   Push the regress: If you say the code (categorical basis) is the real thing, what makes that code a "deception" code? Isn't that just another disposition to produce misleading output?
      *   **The Goal:** Leave them with the tension. We need the basis to ground the power, but we need the power to identify the basis.
  *   **What to Leave Out:** Do not try to solve the regress. Do not introduce "causal bases" or "stimulus conditions" as technical terms. Say "physical setup" and "trigger." Say out loud: "I am not going to solve the regress today. I want you to feel the weight of it."

  ### 6. The Final Question
  Do not ask "Did you understand?" Ask a question that forces them to use the distinction you taught.

  **"If we discover the monitor failed and the system *did* deceive us yesterday, does that change whether it was disposed to deceive today, or does it just change our evidence for it?"**

  *   **If they got it:** They will say the disposition didn't change; only the masking condition changed. They will separate the property from the test.
  *   **If they nodded along:** They will say "Well, now we know it's deceptive," conflating the discovery with the existence of the property.

  ### Summary of Cuts and Flow
  *   **Keep:** Case 1 (Wire/Fink), Case 3 (Mimic).
  *   **Drop:** Case 4 (Redundant to 1), Case 5 (Too complex/niche).
  *   **Use Case 2 (Ball)** only as a foil to clarify Case 1, not as a main argument.
  *   **Sequence:** Sell CA $\rightarrow$ Break with Wire $\rightarrow$ Break Reverse with Mimic $\rightarrow$ Save Dispositions from Nihilism $\rightarrow$ Apply to Deception/Monitor $\rightarrow$ Final Question.

  This keeps the terminology low, respects their empirical background by starting with operationalism, and lands the specific metaphysical payoff you need without getting bogged down in the literature.
