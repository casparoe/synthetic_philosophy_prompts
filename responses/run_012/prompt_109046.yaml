      │       │       │       │       │       │
      │       │       │       │       │       └── 🚩 FLAG: Leaves 7 & 8 are not separable on standard sperm/egg cases, only on speculative fusion.

  ***

  **TUTOR NOTES**

  **1. Structure & Logical Space**
  The tree is designed to move from meta-ontological questions (Leaf 1) to biological specifics (Leaves 3–8). Students should not need to know names like "Kripke" or "Mackie" to traverse it. The branches isolate specific variables: *Modality* (Q1), *Timing* (Q2), *Material vs. Genetic* (Q3), *Environment* (Q4), *Gametic Specificity* (Q5), *Sub-component* (Q6), and *Individuation* (Q7).

  **2. The Cases**
  *   **Cloning (SCNT):** Handled at Q3. Distinguishes Genetic Essentialism (Leaf 3) from Gametic views.
  *   **Frozen Embryo/Different Womb:** Handled at Q4. Isolates Gestational Essentialism (Leaf 4).
  *   **Different Sperm/Egg:** Handled at Q5. The core "Sperm-and-Egg" argument. Distinguishes Parental (Leaf 5) from Gametic (Leaves 6–8).
  *   **Mitochondrial Replacement:** Handled at Q6. Distinguishes Nuclear (Leaf 6) from Strict Cytoplasmic views (Leaves 7–8).
  *   **Monozygotic Twinning & Split/Re-fuse:** Handled at Q7. This is the "hard case" for individuation.

  **3. The Asterisk (*)**
  Leaves 7 and 8 are marked with an asterisk because you cannot reach them without first resolving the **Twinning Problem**. If a student believes a zygote splitting creates two people (or neither), they must decide if re-fusion restores the original. This requires a prior stance on whether identity is determinate during fission.

  **4. The Flag (🚩)**
  Leaves 7 and 8 are flagged as a pair the tree cannot fully separate on the basis of the standard sperm-and-egg argument alone. Both are forms of **Strong Origin Essentialism**. They only diverge on the speculative case of *re-fusion* (which rarely happens naturally). In standard cases (different sperm, different egg, cloning), Leaves 7 and 8 yield identical verdicts. Use this to show students that some metaphysical distinctions only appear in edge cases.

  **5. Teaching Tip**
  If a student gets stuck between Leaf 5 (Parental) and Leaf 6 (Nuclear), ask them about **Mitochondrial Replacement Therapy**. If they say the child is the same person despite a third-party mitochondrial donor, they are Leaf 6. If they say the origin is now "tainted" or different, they lean toward Leaf 8. If they haven't considered it, acknowledge that Leaf 5 and 6 are often intuitively collapsed.
