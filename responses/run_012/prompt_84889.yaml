  **The Case: The Pine Ridge Fuelwood Commons**

  **Setup**
  Fifty families in Ridge Village rely on a surrounding pine forest for heating and cooking. Ten miles away, mobile charcoal burners (Outsiders) roam the valley. Under open access, Villagers cut aggressively to meet winter demand, keeping forest density low. The burners ignore Ridge because the travel cost outweighs the value of the sparse wood. The Villagers then form a cooperative: they limit cutting to let the forest thicken. This succeeds; the forest recovers, Villagers spend less time gathering wood, and the burners, spotting the dense stock, move in to harvest the surplus using destructive kilns that damage soil regeneration.

  ***

  **(1) Stability and Incentives**
  Both groups are at a stable resting point where no one is leaving money (or utility) on the table.
  *   **Insiders (Villagers):** Under the agreement, they restrict effort to 20 hours/week per family. The stock recovery means they gather the same warmth in half the time. They don't cheat because monitoring is mutual and cheap; cheating would deplete the stock and return them to the high-labor equilibrium. They are strictly better off due to reduced labor burden.
  *   **Outsiders (Burners):** They enter only because the stock density crossed a profitability threshold. They harvest until their marginal cost (travel + cutting) equals the value of the charcoal. They aren't free-riding on the Villagers' restraint in a way that undermines the Villagers' current utility; they are harvesting the *growth* the Villagers saved, but doing so with higher-impact technology. They have no incentive to leave because profits are positive, and no incentive to expand further because costs would rise.
  *   **No Shirking:** The failure isn't due to Villagers cheating. They hold their line. The failure is systemic: the success of the local restraint created the exact conditions (high stock density) that rationalized external exploitation.

  **(2) The Numbers**
  *   **Open Access (Counterfactual):**
      *   Village Effort: 5,000 hours/year.
      *   Village Harvest: 100 tons (low yield per hour due to scarcity).
      *   Outsider Harvest: 0 tons (stock density too low to justify travel).
      *   **Total Harvest:** 100 tons.
      *   **Damage:** Moderate (selective cutting, soil intact).
  *   **Agreement (Actual):**
      *   Village Effort: 2,000 hours/year (strictly better off due to labor savings).
      *   Village Harvest: 60 tons (higher yield per hour).
      *   Outsider Harvest: 50 tons (induced by high stock density).
      *   **Total Harvest:** 110 tons.
      *   **Damage:** High (Outsiders use kilns that sterilize soil; total extraction exceeds sustainable yield).
  *   **The Difference:** Total harvest increases by 10%. Total ecological damage increases disproportionately because the Outsiders' method is more destructive per ton. Without the agreement, the stock stays low, and the Outsiders take zero.

  **(3) The Key Feature**
  The engine driving this is **stock-dependent entry costs for outsiders**. The Outsiders' decision to harvest is a function of resource density; below a certain threshold, the resource is economically invisible to them.
  *   **Remove the Feature:** Suppose the Outsiders lived next door (zero travel cost) or had technology that made low-density harvesting profitable. In that case, they would have harvested in the Open Access scenario too. The Village agreement would then simply reduce total harvest (Village cuts less, Outsiders cut same), resulting in less damage. The story collapses back into an ordinary success story: local restraint leads to global conservation.
  *   **Why it matters:** The tragedy here relies on the *visibility* of the surplus. The Villagers' success created the profit signal that summoned the destruction.

  **(4) Welfare and the "Tragedy" Label**
  *   **No Person Worse Off:**
      *   **Villagers:** Better off (same warmth, less labor).
      *   **Outsiders:** Better off (new income source previously unavailable).
      *   **Consumers:** There are none; this is a subsistence economy. If the charcoal is sold, assume demand is perfectly elastic (sold to a large market where price changes are negligible) or that the price increase is a transfer to producers who are also the only persons we count in this closed system.
      *   **Contrivance Cost:** To strictly ensure *no* consumer loss, we must assume subsistence use. If there are external buyers, they pay higher prices. This is a transfer from buyers to producers (Villagers + Outsiders). If we count buyers as "persons," someone loses purchasing power. However, if the market is small, this loss is negligible compared to producer gains.
  *   **The Loser:** The only clear loser is the **resource itself** (and future generations). The soil capacity drops, meaning next year's harvest will be lower for everyone.
  *   **Does this earn the label "Tragedy"?**
      *   Dana argues "no person worse off = no tragedy." This case shows that definition is too narrow. The incentive structure is identical to the classic tragedy: individual rationality (Villagers saving labor, Outsiders seizing profit) leads to collective ruin (forest collapse).
      *   If "tragedy" requires an immediate, identifiable human loser, this isn't one yet. But it is a **temporal displacement of tragedy**. The loss is borne by the future. If the word "tragedy" only applies when a present human suffers, it fails to capture sustainability crises. It should name the *structure* (incentives vs. capacity), not just the *victim*.

  **(5) The Strongest Objection**
  *   **Objection:** "You've moved the accounting boundary. The Villagers' gain is real and local. The Outsiders' gain is real and local. The 'damage' is an abstraction until it hits a human. If the forest dies in 20 years, that's a problem for people in 20 years. Today, this is just a Pareto improvement."
  *   **Response:** The case survives but changes shape. It admits that "tragedy" is often a lagging indicator. The objection holds only if we discount the future entirely. If we acknowledge that current persons care about their children (which they usually do), then the Villagers are actually *worse off* in present-value terms, even if they are warmer today. They have traded future security for current leisure.
  *   **Verdict:** If Dana insists on *current* victims only, she is right that this isn't a tragedy *yet*. But she is wrong that it isn't a tragedy *of the commons*. It is exactly that structure, merely delayed. The label should stick because the mechanism is the same, even if the victims are unborn. If we reserve "tragedy" only for immediate human suffering, we lose the language to describe slow-motion collapses until it's too late to fix them.
