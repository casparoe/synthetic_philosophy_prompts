  **Committee Opinion: Machine-Translation Pilot Extension**

  **To:** Interpreting and Translation Services Committee
  **From:** Committee Member
  **Date:** [Current Date]
  **Subject:** Recommendation on Machine-Translation Pilot Extension

  We face a tension between access and safety. Our trust serves a city speaking ninety languages, yet we employ interpreters for only eleven. For the remainder, telephone interpreting waits often exceed forty minutes out of hours. The proposed extension of our machine-translation (MT) pilot seeks to alleviate this pressure. It asks us to retain the system for administrative text—appointment letters and discharge summaries—and to expand its use to consent conversations and safeguarding discussions when human interpreters are unavailable within thirty minutes.

  After reviewing the evidence, including the March incident where a patient's resigned hesitation was translated as affirmative consent, I recommend we **approve with conditions**.

  We must first address the theoretical disagreement framing this debate. Our Digital Lead argues that "understanding" is a red herring, comparing the app to a thermometer that measures heat without understanding it. He contends we should focus solely on error rates. I disagree. A thermometer measures a scalar physical quantity; language conveys intent, modality, and epistemic stance. When the Lead Interpreter notes that the system flattens hedges into assertions, she identifies a failure not of fluency, but of meaning. In medical consent, the difference between "I suppose I'll have to" and "Yes" is not an error rate; it is the difference between coercion and agreement. Therefore, understanding—or the accurate representation of intent—is not a red herring. It is the primary safety metric.

  The March incident was not an anomaly; it was a predictable failure mode. The vendor's metric scores 0.92, but as our Governor noted, this rewards fluency over fidelity. The system is trained to sound professional, which incentivizes smoothing over uncertainty. In safeguarding and consent, uncertainty is the signal we must not lose. Consequently, while the administrative use of MT poses low risk, extending it to high-stakes conversations without further guardrails is unacceptable.

  **Recommendation and Conditions**

  I propose we approve the extension for administrative text only. The use of MT for consent and safeguarding is prohibited until specific conditions are met.

  1.  **Condition:** Machine translation is strictly prohibited for consent conversations, safeguarding discussions, and any clinical decision-making involving risk.
      *   **Owner:** Clinical Director
      *   **Deadline:** Immediate upon ratification
  2.  **Condition:** All MT sessions must be logged and subject to random audit by a human interpreter to assess modality preservation.
      *   **Owner:** IT Lead
      *   **Deadline:** Implementation within 4 weeks
  3.  **Condition:** The vendor's evaluation metric must be validated against an independent linguistic audit focusing on epistemic markers and modality.
      *   **Owner:** Digital Lead
      *   **Deadline:** 3 months

  **Addressing the Opposition**

  The strongest objection to this recommendation comes from the Digital Lead and those concerned with access. The argument is that imperfect communication is preferable to no communication. If a patient waits forty minutes or receives no interpreter at all, their care is delayed or compromised. Denying the tool forces a choice between delay and rule-breaking.

  This objection does not prevail because false consent is legally void and ethically harmful. Delaying treatment to secure valid consent is an operational challenge; securing invalid consent via a "fluency machine" is a liability and a violation of patient autonomy. We cannot solve a resourcing failure by outsourcing legal responsibility to an algorithm known to flatten modality. The risk of harm from false consent outweighs the risk of delay.

  **Conclusion**

  We should not reject the technology entirely; it serves a useful purpose in administrative contexts where stakes are lower. However, we must acknowledge its limitations. The system is a parrot, not a participant. It cannot negotiate meaning. Until we have evidence that it can preserve the nuance of hesitation and coercion, it has no place in consent or safeguarding.

  I urge the committee to adopt this conditional approval. It protects the trust from liability, protects patients from coercion, and keeps the door open for future utility once the technology—or our validation of it—improves.

  ***

