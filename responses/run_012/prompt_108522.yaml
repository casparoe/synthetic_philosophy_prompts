answer: |-
  Your diagnosis is correct, but it requires sharpening to identify the engine of the stalemate. You are right that the debate is stacked: it involves verbal definitions, substantive ontological commitments, and epistemic standards. However, these are not parallel tracks. The verbal dispute is a symptom, and the substantive dispute is the battlefield, but the **epistemic strand** is the war itself.

  Here is the definite diagnosis: The impasse is a **clash of explanatory norms** regarding the authority of introspection. The strand keeping it alive is the **epistemic disagreement** over whether first-person seeming constitutes a *datum* (Realism) or a *target for explanation* (Illusionism).

  ### The Kind of Disagreement
  This is not merely a verbal dispute, nor is it a standard substantive disagreement where both parties agree on the evidence but disagree on the theory. It is a **methodological incommensurability**. The Realist and the Illusionist are operating within different frameworks of what counts as a "fact" that a theory must save.

  *   **The Realist Framework:** Introspective seeming is *constitutive*. If it seems to me that I have a qualitative experience, then I have one. To deny the experience is to deny the very data point that necessitates a theory of mind. For Chalmers, the "hard problem" arises because the epistemic gap (we can conceive of zombies) implies an ontological gap. The datum is incorrigible.
  *   **The Illusionist Framework:** Introspective seeming is *evidential and fallible*. The feeling of "what it is like" is a cognitive judgment produced by internal monitoring systems. Like any cognitive system, it can misrepresent its own state. For Frankish, the "hard problem" is a cognitive illusion generated by the brain's user-interface.

  Because the Realist treats the *appearance* of consciousness as the *reality* of consciousness, and the Illusionist treats the *appearance* as a *representation* that may be false, they cannot agree on the starting line. The Realist accuses the Illusionist of changing the subject; the Illusionist accuses the Realist of reifying a bug as a feature.

  ### The Core Strand: Epistemic Authority
  While the substantive dispute about brute facts is where the arguments are exchanged, the **epistemic strand** is what locks the door. The impasse persists because the Realist insists on the **infallibility of the phenomenal concept**.

  When the Realist says, "An illusion of experience is itself an experience," they are invoking a rule of epistemic privilege: *Seeming is Being* in the mental domain. This rule makes the Realist position unfalsifiable within its own framework. Any attempt to explain the "seeming" away is interpreted as a denial of the "being."

  The Illusionist, conversely, adopts the epistemic norms of the natural sciences: *Seeming is a Causal Process* that can be analyzed, decomposed, and potentially shown to be erroneous.

  The debate stalls because the Realist treats their introspective conviction as a **veto on naturalism**, while the Illusionist treats naturalism as a **veto on introspective infallibility**. Neither side can move because to concede on the epistemic norm is to abandon their entire metaphysical position.

  ### My Position
  The **Illusionist framework is the only one capable of theoretical progress**, because the Realist framework is a conversation-stopper. By positing phenomenal properties as brute, non-physical facts (or nomological danglers), Realism places consciousness outside the causal closure of the physical world. This solves the "intuition" problem by sacrificing the "explanation" problem. It saves the datum by rendering it scientifically inert.

  Illusionism, while counter-intuitive, preserves the unity of nature. The Realist's charge of incoherence ("How can an illusion seem a certain way without that way existing?") relies on the very epistemic privilege Illusionism denies. If "seeming a certain way" is understood as a functional state of a self-monitoring system—representing a state as having property X, when it does not—the incoherence dissolves. The "way it seems" is the *content* of the representation, not a property of the vehicle.

  Therefore, the Realist is begging the question by assuming that the *content* of introspection must match the *ontology* of the introspected.

  ### What Counts as Progress?
  Empirical results will not solve this. A neuroscientist can find the neural correlate of a "phenomenal judgment," and the Realist will simply say, "You found the correlate of the illusion, not the experience itself." Distinctions (like Access vs. Phenomenal consciousness) have already been tried and merely relocated the boundary of the dispute.

  Progress requires a **reformulation of the explanatory target** coupled with a **positive cognitive model**.

  1.  **Reformulation:** We must stop asking "Does phenomenal consciousness exist?" and start asking "**What is the functional architecture of the introspective system that generates the conviction of phenomenal consciousness?**"
  2.  **The Requirement for Progress:** We need a working computational or functional model of the "user-illusion." It is not enough to say qualia are illusions (the negative thesis); Illusionists must provide a positive thesis detailing *why* the brain represents its states as having ineffable, intrinsic qualities when they do not.

  Progress is achieved only when we have a model of introspection that demonstrates **why the illusion is inevitable and useful** for a cognitive agent. If we can show that a physical system *must* represent its internal states as "phenomenal" to regulate them efficiently, the Realist's "brute fact" becomes an explicable functional necessity. Until the Illusionist can explain the *utility* of the misrepresentation, the Realist will continue to argue that the "illusion" is too costly to be evolutionarily viable without being real.

  **Verdict:** The impasse is epistemic. The Realist protects the authority of the subject; the Illusionist protects the authority of the explanation. Progress demands we treat the subject's authority as a mechanism to be explained, not a foundation to be protected. The path forward is not better data, but a better theory of **introspective error**.
