answer: |-
  My child stood amidst the shattered pane, insisting that uttering "If breaking windows is wrong, then breaking this window was wrong" expressed no disapproval, since the antecedent was merely embedded and thus expressively inert. I conceded that for the conditional to hold validity, the embedded token must share its content with the unembedded type, otherwise the inference collapses into equivocation, but then I affirmed the antecedent myself, stating that breaking windows is indeed wrong. As modus ponens compelled the consequent, the child realized that preserving the validity of their excuse required the embedded clause to bear the same content as the assertion, trapping them in the disapproval they thought they'd conditionalized away. I handed them the broom and said, "You can't claim the meaning is stable enough for logic but unstable enough for exoneration."

  This joke trades on the univocality constraint required to solve the Frege–Geach problem: the embedded sentence must mean the same thing as the unembedded one to ensure logical validity, which prevents the speaker from disavowing the normative commitment once the antecedent is asserted and the inference goes through.
