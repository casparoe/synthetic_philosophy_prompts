answer: |-
  ### Brainstorming Candidate Criteria

  Before constructing the tree, we must isolate the epistemological commitments that usually remain hidden in arguments about Troy, Arthur, and the Exodus. These are the fault lines where your intuitions likely shift between cases.

  1.  **Factual Intent:** Does the text *claim* to be history, or is it theology/poetry using history as a vehicle? (Distinguishes the Mythicist from the Historian).
  2.  **Default Status:** In the absence of proof, is the narrative presumed innocent (plausible) or guilty (improbable)? (Distinguishes the Traditionalist from the Skeptic).
  3.  **Contemporary Corroboration:** Is a contemporary record (e.g., an Egyptian stele, a Roman inscription) required, or can later testimony suffice? (Distinguishes the Positivist from the Literary Historian).
  4.  **Textual Weight:** Can a written tradition (e.g., the *Iliad*, Geoffrey of Monmouth) carry evidence weight on its own? (Distinguishes the Philologist from the Archaeologist).
  5.  **Material Veto:** If archaeology contradicts the text (e.g., no walls at Jericho), does the text lose all historical value? (Distinguishes the Hard Skeptic from the Kernel Theorist).
  6.  **Scale Reduction:** If the event happened but smaller (e.g., 500 people instead of 2 million), is it the *same* historical event? (Distinguishes the Minimalist from the Literalist).
  7.  **Identity Transfer:** If a real person/place is found (e.g., a King Artorius, the city of Ilios), does that validate the *stories* attached to them? (Distinguishes the Euhemerist from the Contextualist).
  8.  **Reception Value:** Is the story "history" because of its origin, or because of how later generations believed it? (Distinguishes the Cultural Historian from the Event Historian).

  ***

  ### The Historiographical Decision Tree

  *Instructions: Start at Node 1. Answer the question honestly based on your general methodological principles, not based on which answer saves your favorite theory. Follow the branch to the next node or a leaf. If you reach an "Unoccupied" leaf, your position is likely inconsistent across the three test cases.*

  **Node 1:** Does the narrative primarily assert factual occurrence as its condition of truth, rather than theological or moral meaning?
  *   **No** → **Leaf 1: The Literary-Theologian**
  *   **Yes** → Go to Node 2.

  **Node 2:** In the absence of contemporary evidence, is the narrative presumed historically plausible until disproven?
  *   **Yes** → Go to Node 3.
  *   **No** → Go to Node 4.

  **Node 3:** Is later textual testimony (e.g., medieval romance, Iron Age epic) sufficient to establish historicity without contemporary records?
  *   **Yes** → **Leaf 2: The Traditionalist**
  *   **No** → Go to Node 5.

  **Node 4:** If external evidence is required, must it corroborate the narrative's described *scale* (e.g., army size, miracle magnitude)?
  *   **Yes** → Go to Node 6.
  *   **No** → Go to Node 7.

  **Node 5:** Does contradictory archaeological evidence (e.g., lack of settlement layers) override the textual testimony?
  *   **No** → **Leaf 3: The Textual Supremacist**
  *   **Yes** → Go to Node 6.

  **Node 6:** If the scale is contradicted, is a reduced "kernel" of truth (e.g., a raid instead of a war) acceptable as historical confirmation?
  *   **No** → **Leaf 4: The Hard Positivist**
  *   **Yes** → Go to Node 7.

  **Node 7:** If a real person or place is identified behind the story, does that validate the specific *events* attributed to them?
  *   **Yes** → **Leaf 5: The Euhemerist**
  *   **No** → Go to Node 8.

  **Node 8:** Is the narrative's historical value found in its later reception and cultural impact rather than its origin?
  *   **Yes** → **Leaf 6: The Reception Historian**
  *   **No** → **Leaf 7: Methodological Agnosticism**

  ***

  ### The Positions (Leaves)

  **Leaf 1: The Literary-Theologian**
  *   **Position:** The text is not history; it is myth or theology.
  *   **Awkward Commitment:** You must explain why biblical archaeologists or Heinrich Schliemann bothered digging at all if the text makes no factual claims.

  **Leaf 2: The Traditionalist**
  *   **Position:** The narrative is historically probable based on the strength of the tradition itself.
  *   **Awkward Commitment:** You must treat Geoffrey of Monmouth's *Arthur* with similar epistemic weight to a Roman census, or accept the *Iliad* as a reliable military report.

  **Leaf 3: The Textual Supremacist** *(Unoccupied/Incoherent)*
  *   **Position:** Text is sufficient proof, but archaeology cannot veto it.
  *   **Diagnosis:** **Incoherent.** If text is sufficient (Node 3), Node 5 should not be reachable; if archaeology cannot veto, you are a Traditionalist. This usually masks a Hidden Traditionalism.

  **Leaf 4: The Hard Positivist**
  *   **Position:** Only the event exactly as described counts; no kernels, no reductions.
  *   **Awkward Commitment:** You must reject the Trojan War entirely because the walls of Troy VI do not match Homer's descriptions of a decade-long siege.

  **Leaf 5: The Euhemerist**
  *   **Position:** Real people/places exist behind the myth, but the stories are embellished.
  *   **Awkward Commitment:** You must accept a historical "Arthur" existed even if the Battle of Badon is unproven, or a historical Moses even if the Exodus did not happen.

  **Leaf 6: The Reception Historian**
  *   **Position:** The story is history because later people believed it and acted on it.
  *   **Awkward Commitment:** You concede the central event (Exodus, War, Battle) may be fiction, which often frustrates both believers and skeptics in equal measure.

  **Leaf 7: Methodological Agnosticism** *(Unoccupied/Unattractive)*
  *   **Position:** We cannot know, and the question of origin is valueless.
  *   **Diagnosis:** **Unattractive.** While logically sound, this position ends the argument entirely, rendering the debate about Troy, Arthur, and Exodus pointless.

  **Leaf 8: The Kernel Minimalist** *(Merged with Node 6 'Yes' / Node 7 'No')*
  *   **Position:** A small historical core exists, but the narrative events are not validated by it.
  *   **Awkward Commitment:** You must argue that a historical Exodus involved perhaps a few dozen Levites, which satisfies neither the literalist nor the mythicist.

  *(Note: Leaf 3 and Leaf 7 are theoretically possible but rarely defended as explicit positions; Leaf 8 is often indistinguishable from Leaf 5 depending on how "validate" is defined in Node 7.)*

  ***

  ### A Note on Consistency
  If you find yourself answering **Yes** to Node 2 for Troy (it's plausible) but **No** for Exodus (it's improbable), you are not following this tree; you are following your intuition. This tree forces a unified epistemology. If you land on an **Unoccupied** leaf, you likely hold a "Special Pleading" position: demanding strict proof for one case while accepting tradition for another. To argue with your friend, you must first decide if you are a **Minimalist** for all three, or a **Traditionalist** for all three. Mixing them is where your confusion lies.
