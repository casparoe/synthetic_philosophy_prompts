answer: |-
  # Welcome to the Sincero Help Center!

  Hello there! Thank you for choosing Sincero, the world's premier Apology-as-a-Service platform. We are thrilled to support your journey toward friction-free interpersonal relations. Our mission is to streamline your emotional liabilities through scalable, pre-emptive speech act generation. Below you'll find answers to common questions regarding our delivery protocols, felicity optimization, and compliance standards.

  **Q: When will my purchased apology be delivered to the recipient?**
  A: Great question! To ensure maximum risk mitigation for the Speaker, Sincero schedules all apology deliveries outside the Optimal Felicity Window. Our standard package ensures your message arrives only after the injured party has ceased to occupy the relevant social context, or once the statute of limitations on grievance has expired. This guarantees that while the utterance is successfully transmitted, the necessary *uptake* is rendered logically impossible. You get the credit for speaking without the burden of being heard!

  **Q: Can I specify who receives my promise or congratulations?**
  A: Absolutely! Our *Targeting Plus* module allows you to direct speech acts toward entities lacking the authority to accept them. You might promise a favor to a department that has been dissolved, or offer congratulations to an individual who has not actually achieved the milestone in question. This creates a healthy *direction of fit* mismatch: instead of your words changing the world, the world simply fails to match your words, preserving your status quo indefinitely.

  **Q: How do you handle the sincerity condition for promises?**
  A: We believe sincerity is a choice! By default, all commissive statements (promises, vows, pledges) are generated with a null-intent clause. This means the Speaker expresses a psychological state they do not actually possess. If you require the *appearance* of intent without the liability of follow-through, our standard template is perfect. We hereby state that we are promising to uphold this standard. (Note: This clause describes the act of promising rather than executing it, ensuring total legal safety.)

  **Q: What if I need to thank someone for a favor they didn't do?**
  A: Sincero specializes in expressive acts with false presuppositions! Our *Gratitude Void* package allows you to issue thanks for services never rendered. This subtly shifts the burden of proof to the listener, who must now wonder if they forgot to help you, rather than you admitting you received no help. It is a proactive approach to reality management.

  **Q: What is the Sincerity Plus™ Add-on?**
  A: For an additional fee, you can attach a Sincerity Plus™ badge to any utterance. Please note that purchasing this add-on explicitly suspends the sincerity condition of the speech act. By paying for the *signal* of sincerity, you formally acknowledge that the sentiment is a commercial transaction rather than an internal state. This converts a potential *abuse* of speech acts into a transparent *service agreement*, voiding any expectation of genuine emotion.

  **Q: My speech act didn't work. Can I get a refund?**
  A: We are sorry to hear that your experience did not meet your expectations! However, our Refund Policy is designed to protect the integrity of the transaction. Refunds are available only if the customer can prove they did not accept the Terms of Service at the time of purchase. However, by submitting a refund request, you implicitly acknowledge the existence of a customer support contract, thereby confirming your acceptance of the Terms. Consequently, valid refund claims are self-negating.

  Thank you for trusting Sincero to handle your heavy lifting. We promise to consider your feedback in the event that our future preferences align with your needs. Have a wonderful, liability-free day!
