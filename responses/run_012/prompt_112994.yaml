  **The Joke**

  She'd been nursing the same cheap white for an hour, watching the condensation slide down the glass, when someone finally asked what she was working on. She took a breath, looked at the cluster of faces, and said, "So, I'm defending the view that every truth is knowable. Sounds modest, right? Leave room for discovery. But then you realize the statement 'There is a truth nobody knows' destroys itself. If anyone knows it, it's false. So it must be false. So all truths are known. So my modest theory proves I'm omniscient." She lifted her glass, barely an inch. "So, yes, I know the keg is empty. I've known all along. Which is why I'm nursing this one."

  ***

  **The Note**

  The derivation itself is logically valid within classical epistemic logic (assuming knowledge is factive and distributes over conjunction), and this validity is generally settled. The controversy lies entirely in the premises: most contemporary anti-realists reject the unrestricted Knowability Principle, arguing it applies only to "basic" truths, or they adopt intuitionistic logic to block the collapse into omniscience. There is no consensus that this refutes anti-realism wholesale, only that it kills the naive slogan that "all truths are knowable" without qualification.
