prompt: |-
  I chair the selection panel for a small foundation's flagship fellowship, and we score every application against a published rubric. Two or three times a year we end with two finalists whose scores are identical and whose files resist further discrimination, and the panel then does one of two things badly: it deliberates past its deadline, or someone invents a tie-breaker that was never in the rubric. Please write a procedure the panel can run whenever this happens, built on what is actually known about choice without preference — the Buridan's-ass problem at institutional scale. It has to separate the four situations that get conflated: indifference, where the options leave us cold; parity, where they are comparable but neither is better and the difference matters; uncertainty, where we do have a ranking but lack the facts; and a preference we hold but have not admitted to ourselves. Give me the questions to ask in order, what counts as a sufficient answer to each, when to stop collecting information and act, whether a lottery or coin toss is ever permissible and what would have to be true for it to be, and why a decision made without a preference can still be rational rather than a confession of failure. Mark the points where the procedure hands the matter to a person — the chair, the board — because the question is one of values, not facts. Then run it on two cases: a genuine tie between two equally strong finalists, and a tie that dissolves once the panel admits what it is actually weighing. Include one case where it gives an answer I will not like, and say what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a selection panel for a small foundation's flagship fellowship.
      *   **Problem:** Ties between finalists lead to bad outcomes (overtime deliberation or ad hoc tie-breakers).
      *   **Task:** Write a procedure to handle ties based on "choice without preference" (Buridan's Ass problem at institutional scale).
      *   **Key Distinctions:** Must separate four situations: Indifference, Parity, Uncertainty, and Unadmitted Preference.
      *   **Requirements:**
          *   Ordered questions to ask.
          *   Criteria for sufficient answers.
          *   Stopping rules (when to act).
          *   Rules on lotteries/coin tosses (when permissible).
          *   Justification for rationality of non-preferential decisions.
          *   Hand-off points (Chair/Board) for value judgments.
          *   Two test cases (Genuine tie, Dissolving tie).
          *   One "unliked" answer case.
          *   Limitations of the procedure.
      *   **Tone:** Professional, procedural, philosophical but practical, authoritative.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *Buridan's Ass:* The paradox of starving between two equally appealing haystacks. The solution is often randomization or recognizing a meta-preference.
      *   *Ruth Chang's "Parity":* Options can be comparable without one being better than the other. This is distinct from equality (indifference).
      *   *Epistemic Uncertainty:* We think they are tied, but we just don't know enough.
      *   *Psychological/Unadmitted Preference:* Bias, gut feeling, or values not captured in the rubric.
      *   *Rationality:* A decision is rational if it aligns with reasons, even if those reasons don't favor A over B (e.g., "we need a decision now" is a reason).

  3.  **Drafting the Procedure (The "Tie-Breaking Protocol"):**
      *   *Trigger:* Final scores are identical within a defined margin (e.g., <1 point diff) after standard deliberation.
      *   *Phase 1: Diagnostic (The Four Buckets).* Need questions to sort the tie into Indifference, Parity, Uncertainty, or Unadmitted Preference.
      *   *Phase 2: Resolution.* Based on the diagnosis.
      *   *Phase 3: Hand-offs.* Where values override facts.
      *   *Phase 4: Randomization.* The last resort.

      *Drafting Questions:*
      1.  *Uncertainty:* Do we lack information? (If yes, get info or stop).
      2.  *Unadmitted Preference:* Is there a value outside the rubric? (If yes, admit it or escalate).
      3.  *Parity vs. Indifference:* Do we care which one wins, even if they are equal in score? (Parity = care, Indifference = don't care).

      *Drafting Rules on Lotteries:*
      *   Permissible only under Indifference or Parity *after* values are checked.
      *   Not permissible under Uncertainty (need facts) or Unadmitted Preference (need honesty).

      *Drafting Rationality:*
      *   Decision is rational because *inaction* has costs. Selecting *one* fulfills the mission.

  4.  **Refining the Hand-off Points:**
      *   If the tie-breaker requires a value judgment *not* in the rubric (e.g., "we need more diversity," "we need a safer bet"), that's a policy change. The Panel cannot do this alone. It goes to the Chair or Board.
      *   If the tie is genuine and randomization is chosen, the Panel can do it.

  5.  **Developing the Test Cases:**
      *   *Case 1: Genuine Tie (Parity/Indifference).* Two great candidates. No hidden factors. Procedure says: Lottery.
      *   *Case 2: Dissolving Tie (Unadmitted Preference).* Scores equal, but panel realizes they prefer Candidate A because they know the mentor better. Procedure says: Admit bias, recuse, or escalate.
      *   *Case 3: Unliked Answer (Uncertainty/Hand-off).* Panel wants to pick A, but the procedure reveals they are adding a new criterion (e.g., geographic location) not in the rubric. Procedure says: Stop. Go to Board. Panel hates this because it delays/slow downs.

  6.  **Addressing Specific Constraints:**
      *   *Mark hand-off points:* Use bold or specific icons.
      *   *Why rational:* Include a specific section on this.
      *   *What it cannot do:* Acknowledge limitations (e.g., can't fix a bad rubric).

  7.  **Review and Polish (Self-Correction during drafting):**
      *   *Critique:* Is the distinction between Parity and Indifference clear?
      *   *Fix:* Indifference = "It literally does not matter." Parity = "They are different but equally good, and we care about the difference." Actually, in decision theory, if they are truly equal in value, a lottery is rational. If there is Parity (Chang), often a "will" creates the reason. I need to make sure the procedure allows the panel to *create* a reason if it's Parity, but only if authorized.
      *   *Refinement:* Let's simplify Parity vs. Indifference for a procedural context. Indifference = No institutional stake. Parity = Institutional stake exists but rubric doesn't capture it.
      *   *Critique:* Make sure the "Unliked Answer" is clear.
      *   *Fix:* The procedure forcing a Board review when the panel just wants to finish is the unliked part.

  8.  **Finalizing the Structure:**
      *   Introduction (Philosophy).
      *   The Protocol (Step-by-Step).
      *   The Rationality Defense.
      *   The Lottery Clause.
      *   Test Cases.
      *   Limitations.

  9.  **Writing the Content:** (Iterative refinement of the language to sound like a formal protocol document). *Ensure the distinction between "facts" (panel) and "values" (board/chair) is sharp.*

      *(Self-Correction on "Parity"):* Ruth Chang argues that in cases of parity, we can exercise normative power to *make* one better by choosing it. However, for a foundation, arbitrary choice might look like negligence. I need to balance the philosophical "hard choice" with institutional accountability. The procedure should treat Parity as "Equal Merit, Distinct Profiles." If the rubric doesn't distinguish, does the Foundation care about the profile difference? If yes -> Value Judgment (Board). If no -> Lottery.

      *(Refining the "Unliked Answer"):* The prompt asks for *one* case where it gives an answer I will not like. I will make this the case where the procedure forces the panel to admit they are breaking the rules (adding a criterion), requiring a Board intervention which slows things down.

  10. **Final Polish:** Check against all constraints in the prompt.
      *   Four situations separated? Yes.
      *   Questions in order? Yes.
      *   Sufficient answer defined? Yes.
      *   Stop rules? Yes.
      *   Lottery rules? Yes.
      *   Rationality explanation? Yes.
      *   Hand-off points marked? Yes.
      *   Two cases + one unliked? Yes.
      *   Limitations? Yes.

      *Let's write.*
answer: |-
  # Protocol for Resolution of Equivalent Finalists (PREF)

  **Effective Date:** Immediate
  **Authority:** Selection Panel Chair
  **Scope:** Flagship Fellowship Selection

  ## 1. Philosophical Premise
  A tie is not a failure of calculation; it is a data point. It indicates that the rubric has exhausted its discriminatory power. Continuing to deliberate without new information is irrational. This protocol treats the tie not as a problem to be argued away, but as a status to be diagnosed.

  We distinguish four states of equivalence:
  1.  **Uncertainty:** We lack facts to distinguish them.
  2.  **Unadmitted Preference:** We have a preference based on values outside the rubric.
  3.  **Parity:** They are different but equally meritorious; the difference matters, but the rubric does not weigh it.
  4.  **Indifference:** They are functionally identical for our purposes; the difference does not matter.

  ## 2. The Diagnostic Procedure
  *Trigger:* Two or more finalists remain within 1% (or 1 point) of each other after standard deliberation.

  ### Step 1: The Epistemic Check (Ruling out Uncertainty)
  **Question:** "Is there specific, obtainable information regarding *published criteria* that we do not currently possess?"
  *   **Sufficient Answer for 'Yes':** "Candidate A's publication count is unverified," or "We have not seen Candidate B's portfolio."
  *   **Sufficient Answer for 'No':** "We have all the data required by the rubric."
  *   **Action:**
      *   If **Yes**: Pause selection. Obtain data. Re-score.
      *   If **No**: Proceed to Step 2.
  *   **Stopping Rule:** Do not seek new information that is not explicitly required by the rubric. That is criterion creep.

  ### Step 2: The Value Audit (Ruling out Unadmitted Preference)
  **Question:** "Is there a reason to prefer one candidate that is *not* captured in the rubric?"
  *   **Examples:** Institutional risk aversion, geographic diversity, personal knowledge of a mentor, "feel" for the candidate.
  *   **Sufficient Answer for 'Yes':** "We prefer Candidate A because their project is less risky," or "We know Candidate B's institution better."
  *   **Sufficient Answer for 'No':** "We have no preference outside the written criteria."
  *   **Action:**
      *   If **Yes**: **[HAND-OFF POINT]**. The Panel must stop. The Chair must escalate this to the Board or Foundation Leadership.
          *   *Reasoning:* Introducing a new value (e.g., "risk aversion") changes the mission parameters. The Panel executes the rubric; the Board sets the values. The Board must ratify whether this new value should break the tie or amend the rubric for future years.
      *   If **No**: Proceed to Step 3.

  ### Step 3: The Stakes Test (Distinguishing Parity from Indifference)
  **Question:** "If we select Candidate A over Candidate B, does the Foundation's mission outcome change in a meaningful way?"
  *   **Sufficient Answer for 'Parity' (Yes):** "Candidate A works in policy, Candidate B in art. Both are excellent. We care about which field we support this year, but the rubric treats them equally."
  *   **Sufficient Answer for 'Indifference' (No):** "Both will execute high-quality projects. The specific topic does not alter our strategic goals for this cycle."
  *   **Action:**
      *   If **Parity**: **[HAND-OFF POINT]**. The Chair must consult the Board/Strategy Committee.
          *   *Reasoning:* This is a strategic allocation decision, not a merit judgment. The Board must decide if the Foundation wishes to exercise "normative power" to prioritize one profile over another this cycle.
      *   If **Indifference**: Proceed to Step 4.

  ### Step 4: The Randomization Clause
  **Condition:** Only permissible if Steps 1–3 confirm **Indifference**.
  **Action:** Conduct a public, recorded lottery (coin toss, random number generator).
  **Rationale:** When options are truly indifferent, the cost of delay exceeds the marginal value of the choice. Randomization is the most efficient, fair, and transparent method to resolve Buridan's Ass scenarios.

  ---

  ## 3. Rationality of Non-Preferential Decision Making
  A decision made without a preference is not a confession of failure; it is a rational response to constraints.
  1.  **Mission Fulfillment:** The Foundation's goal is to fund *excellence*, not to rank the un-rankable. If both candidates meet the threshold of excellence, funding either fulfills the mission.
  2.  **Opportunity Cost:** Deliberation consumes resources (time, reputation, panelist energy). At the point of indifference, further deliberation yields negative return on investment.
  3.  **Fairness:** A random tie-breaker treats equivalent claims equally. Attempting to manufacture a distinction creates false precision and potential bias.

  ---

  ## 4. Test Cases

  ### Case A: The Genuine Tie (Indifference)
  **Scenario:** Candidates X and Y have identical scores. Both propose rigorous academic projects. Both have similar track records.
  **Procedure Run:**
  1.  *Epistemic Check:* All data is in. (Pass)
  2.  *Value Audit:* Panel admits no hidden preference. (Pass)
  3.  *Stakes Test:* Panel agrees funding X or Y yields the same strategic value for the Foundation this year. (Indifference)
  4.  *Resolution:* **Lottery.**
  **Outcome:** Candidate X is selected via random number generator. The minutes record: "Panel found candidates equivalent in merit and strategic value. Tie broken via Protocol Step 4."
  **Verdict:** Efficient. Defensible.

  ### Case B: The Dissolving Tie (Unadmitted Preference)
  **Scenario:** Candidates M and N have identical scores. Panel leans toward M.
  **Procedure Run:**
  1.  *Epistemic Check:* All data in. (Pass)
  2.  *Value Audit:* Panel admits, "We prefer M because we know their supervisor, and we trust that supervision."
  **Outcome:** **[HAND-OFF]**. The Panel cannot use this. It is a conflict of interest/external value. The Chair recuses the panel from the final decision and refers to the Board.
  **Verdict:** The tie "dissolves" because the equality was illusory; it relied on ignoring an impermissible factor. The procedure prevents the panel from laundering bias through deliberation.

  ### Case C: The Unliked Answer (Parity/Strategic Shift)
  **Scenario:** Candidates P and Q are tied. P is a safe, traditional scholar. Q is a high-risk, innovative activist. The Panel prefers Q but the rubric rewards "stability."
  **Procedure Run:**
  1.  *Epistemic Check:* Pass.
  2.  *Value Audit:* Panel admits, "We want to fund Q because we want to support activism, even if the rubric favors stability."
  3.  **Outcome:** **[HAND-OFF]**. The procedure forbids the Panel from choosing Q based on this admission. The Chair must refer this to the Board.
  **Why you will not like this:** You want to fund Q *now*. You know the Board is conservative and might reject the shift or demand a rubric rewrite, delaying the fellowship announcement by months. The procedure prioritizes institutional integrity over your desire for speed. It forces you to admit that you are changing the rules mid-game, and only the rule-makers (Board) can authorize that.

  ---

  ## 5. Limitations: What This Procedure Cannot Do
  1.  **It cannot fix a bad rubric.** If the rubric is too blunt to capture the nuance of your field, this protocol will frequently trigger Hand-Offs. This is a feature, not a bug, but it will feel like bureaucracy.
  2.  **It cannot absolve the Board.** If the Panel frequently hits the "Parity" hand-off, it indicates the Board has failed to provide strategic direction. The procedure exposes this governance gap; it does not fill it.
  3.  **It cannot manufacture comfort.** Some panelists will feel a lottery is "abdicating responsibility." This protocol asserts that abdicating responsibility is *deliberating past the point of reason*, not flipping a coin. It cannot force panelists to feel good about that distinction.

  ## 6. Implementation Note
  To adopt this, the Board must pre-authorize the **Randomization Clause**. Without pre-authorization, a lottery looks like negligence. With pre-authorization, it is a binding administrative tool.

  **Approved By:** ___________________ (Board Chair)
  **Date:** ___________________
