prompt: |-
  I'm a novelist, and I've somehow ended up on the grant committee of a small foundation that funds research on human nature (they wanted a storyteller in the room, dont ask). We meet Thursday and I have to circulate a short written opinion before then. On the table: a psych lab's proposal that boredom is an adaptation -- that the itch of restlessness is a signal our current goals aren't paying off, evolved to shove us toward exploring new ones -- and they want money to test whether people high in boredom-proneness actually explore more and end up with more status and mating success down the line. Half the committee is thrilled; the other half says you could spin any result either way, so it's a just-so story with a budget, and we shouldnt be funding untestable evolutionary stories no matter how pretty they are. Give me a memo that lands on a concrete recommendation -- fund it, reject it, or fund it with conditions -- with the reasoning laid out, say clearly what evidence would actually settle the question rather than leaving room for the story to absorb anything, and be honest about the strongest thing the losing side has going for it. One page or less, 500 words max, American English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Novelist on a grant committee for a foundation funding research on human nature.
      *   **Task:** Write a short written opinion (memo) to circulate before the Thursday meeting.
      *   **Topic:** A proposal claiming boredom is an adaptation (signal to explore new goals) and seeking funds to test if boredom-prone people explore more and gain status/mating success.
      *   **Conflict:** Half the committee loves it; half says it's unfalsifiable "just-so stories."
      *   **Requirements:**
          *   Concrete recommendation (Fund, Reject, or Fund with Conditions).
          *   Reasoning laid out.
          *   Specify what evidence would actually settle the question (falsifiability).
          *   Acknowledge the strongest argument of the losing side.
          *   Length: One page or less, 500 words max.
          *   Language: American English.
          *   Tone: Professional but reflecting the "storyteller" perspective (insightful, clear).

  2.  **Determine the Recommendation:**
      *   *Option A (Fund):* Risks validating the "just-so story" critique.
      *   *Option B (Reject):* Discards a potentially interesting hypothesis because of methodological skepticism.
      *   *Option C (Fund with Conditions):* Bridges the gap. Acknowledges the theoretical value (novelist perspective) but demands rigorous falsifiability (skeptic perspective). This seems the most balanced and actionable path for a committee memo.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly.
      *   **The Core Argument (The Novelist's Lens):** Boredom as a narrative device vs. biological signal. The hypothesis is compelling (like a plot point), but needs proof.
      *   **Addressing the Skeptics:** Acknowledge their point about "just-so stories." Evolutionary psychology often suffers from post-hoc rationalization.
      *   **Falsifiability (The Crucial Part):** What would disprove it? If boredom-prone people *don't* explore, or if they explore but fail (lower status/mating success), the theory fails. The study needs longitudinal data, not just correlations.
      *   **Conditions:** Require pre-registered analysis plans to prevent p-hacking or spinning results.
      *   **Closing:** Reiterate the value but emphasize rigor.

  4.  **Drafting - Content & Word Count Check:**

      *   *Memo Header:* To: Grant Committee; From: [My Name]; Date: [Current Date]; Subject: Recommendation on Proposal #X (Boredom as Adaptation).
      *   *Recommendation:* Fund with Conditions.
      *   *Reasoning:* The hypothesis is narratively satisfying (restlessness drives plot), but science isn't fiction. We need to avoid confirmation bias.
      *   *Skeptics' Point:* They are right that evolutionary stories can explain anything after the fact. If high boredom leads to *failure*, proponents might claim "modern mismatch" instead of falsifying the adaptation claim.
      *   *Evidence needed:* Longitudinal tracking. If boredom-prone individuals do not achieve higher status/reproductive success *because* of exploration, the adaptation claim collapses.
      *   *Conditions:* Pre-registration of hypotheses and analysis. No moving the goalposts.

  5.  **Refining and Polishing (aiming for <500 words):**

      *   *Tone:* Professional, decisive, slightly literary but grounded.
      *   *Word Count:* Keep it tight.

      *(Self-Correction during drafting)*: Make sure I explicitly state what evidence would settle the question. The prompt asks for "say clearly what evidence would actually settle the question."
      *   *Specific Evidence:* A negative correlation between boredom-proneness and long-term fitness proxies (status/mating) would falsify the adaptation claim. If they explore but fail, it's not an adaptation.

  6.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes (Fund with Conditions).
      *   Reasoning laid out? Yes.
      *   Evidence to settle question? Yes (negative outcome on fitness proxies).
      *   Strongest losing side argument? Yes (unfalsifiable just-so stories).
      *   One page/500 words? Yes.
      *   American English? Yes.

  7.  **Final Polish:** (Writing the memo)

      *   *Check:* Did I sound like a novelist? A bit of flair is okay, but it's a memo. Keep it crisp.
      *   *Check:* Is the distinction between correlation and causation clear? The proposal wants to test if they *end up* with more success. That implies longitudinal. I should emphasize that.

      *(Drafting mental outline)*:
      1. Recommendation: Fund with Conditions.
      2. Why fund: The hypothesis is generative.
      3. Why conditions: The skeptics are right about unfalsifiability.
      4. What settles it: If boredom leads to lower success, theory dies.
      5. Condition: Pre-registration.

      *Let's write.*

      **MEMORANDUM**

      **TO:** Grant Committee
      **FROM:** [Name]
      **DATE:** October 26, 2023
      **SUBJECT:** Recommendation on Proposal #402: Boredom as Adaptation

      **Recommendation:** Fund with Conditions.

      **Reasoning**
      As a storyteller, I recognize the appeal of this hypothesis. Boredom as a plot device works perfectly: dissatisfaction drives the protagonist to seek new stakes, leading to growth. Translated into evolutionary psychology, the logic holds: restlessness signals diminishing returns, pushing exploration. However, science is not fiction. We cannot fund a narrative simply because it feels coherent.

      The skeptics on this committee raise a valid, critical objection: evolutionary psychology often produces "just-so stories." These are unfalsifiable narratives that can explain any outcome post-hoc. If boredom-prone subjects explore more but fail to gain status, the researchers might argue the modern environment mismatches our evolution. If subjects don't explore, they might claim measurement error. This flexibility renders the theory scientifically inert.

      **What Would Settle the Question**
      To move beyond storytelling, the study must define failure conditions explicitly. The adaptation claim stands only if boredom-proneness predicts *both* increased exploration AND higher long-term fitness proxies (status, mating success).
      *   **Falsification:** If boredom-prone individuals explore more but achieve *lower* status/mating success, the adaptation hypothesis is false. It would suggest boredom is a malfunction or a trait neutral to fitness, not an adaptive signal.
      *   **Falsification:** If boredom-prone individuals do not explore more than content individuals, the mechanism is false.

      **Conditions for Funding**
      I recommend releasing funds only if the researchers agree to **pre-register their analysis plan.** They must specify exactly what combination of variables constitutes support for the hypothesis before data collection begins. This prevents "p-hacking" or spinning null results to fit the narrative later.

      **Conclusion**
      The skeptics are right that beautiful stories often mask weak science. But the proponents are right that boredom remains an underexplored driver of behavior. By enforcing strict falsifiability through pre-registration, we protect the foundation's rigor while allowing a compelling question to be tested properly. We fund the science, not the story.

