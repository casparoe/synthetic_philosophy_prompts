      *   Core intuition: Descriptive facts don't automatically generate normative obligations without some normative bridge.
      *   Ambiguity: It ranges from a logical triviality to a heavy metaphysical claim.

  3.  **Drafting the Menu (Iterative Process):**

      *   *Category (a): Deductive Entailment.*
          *   *Thesis:* No set of purely descriptive premises *validly deduces* a normative conclusion.
          *   *Nuance:* Logic allows $P \vdash P \lor Q$. If $Q$ is normative, this is technically a derivation. So the thesis needs to be about *non-vacuous* entailment or requiring at least one normative premise.
          *   *Status:* Trivial/Logical if strict (Prior's Problem), Substantive if about *relevant* entailment.
          *   *Kind of Ought/Is:* Logical syntax.

      *   *Category (b): Meanings/Definitions.*
          *   *Thesis:* Normative terms cannot be *defined* solely by descriptive terms. (Open Question Argument).
          *   *Status:* Substantive/Debatable (Moore).
          *   *Kind of Ought/Is:* Semantic.

      *   *Category (c): Justification/Evidence.*
          *   *Thesis:* Descriptive facts cannot *justify* normative conclusions without a normative principle.
