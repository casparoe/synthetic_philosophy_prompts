          *   *Kind of Ought/Is:* Epistemic/Justificatory.

      *   *Category (d): Motivation/Action.*
          *   *Thesis:* Beliefs (Is) alone cannot motivate action; Desires/Oughts are needed. (Humean Theory of Motivation).
          *   *Status:* Substantive/Psychological.
          *   *Kind of Ought/Is:* Psychological states.

      *   *Category (e): Moral Properties/Metaphysics.*
