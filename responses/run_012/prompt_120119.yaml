          *   *Kind of Ought/Is:* Ontological.

  4.  **Addressing the "Naturalistic Fallacy" and "Fact/Value Distinction":**
      *   *Naturalistic Fallacy:* Moore's specific claim about defining "good". Often conflated with Hume's Law.
      *   *Fact/Value Distinction:* The broader epistemological separation. Hume's Law is the logical engine often cited to support it.

  5.  **Addressing the Sticking Points:**
      *   *Mixed Premises:* If premises include "We should not deploy unsafe models," the argument is valid. The slogan only blocks arguments with *purely* descriptive premises. In practice, institutional goals act as the bridge.
      *   *Non-Deductive Support:* The slogan is about *entailment*. It doesn't rule out abduction or inference to the best explanation. Facts can make a norm *plausible* or *necessary given a goal*, even if not logically forced.

  6.  **Evaluating the Colleague's Move:**
