prompt: |-
  Hey, I'm a software dev who reads philosophy on the side and I've gotten stuck on the self-deception thing. The basic puzzle I get: deception normally needs a deceiver who knows the truth and a deceived who doesn't, so "deceiving yourself" seems to require you to both know and not know the same thing at once, which looks like a straight contradiction. I want an explainer that goes past the intro-level version. Specifically: is the contradiction real, or does it just come from assuming self-deception has to be intentional the way deceiving someone else is? Walk me through how the two main camps get out of it — the ones who keep the intention and split the self into parts that somehow don't share information, versus the ones who drop the intention and say it's just motivation pushing you toward a belief you want. Then take a concrete case — someone who "doesn't realize" their partner is cheating even though the evidence is right in front of them — and tell me what each account actually says is happening in their head, and which one you think holds up. One extra thing I keep wondering about: does it help to describe it as the person controlling what they pay attention to, or what evidence they go looking for, rather than controlling the belief itself? That move seems to dodge the contradiction, but I cant tell if it's cheating or if it's the real answer. Skip the reading lists and citations, just explain it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

