      *   **Constraints:** No reading lists, no citations, just explanation.

  2.  **Deconstruct the Paradox:**
      *   Standard deception: Agent A knows $\neg P$, makes Agent B believe $P$.
      *   Self-deception: Agent S knows $\neg P$, makes Agent S believe $P$.
      *   The Static Paradox: At time $t$, S believes $\neg P$ AND S believes $P$. Contradiction.
      *   The Dynamic/Intentional Paradox: To deceive, S must intend to deceive. To succeed, S must not know they are deceiving. How can you intend to make yourself ignorant while knowing the truth?

  3.  **Camp 1: Intentionalism (The "Split Self" Model):**
      *   *Core Idea:* Keep the intention, drop the unitary self.
      *   *Mechanism:* The mind is modular. Subsystem A knows $\neg P$, Subsystem B believes $P$. A hides info from B.
      *   *Philosophical flavor:* Freudian (unconscious/conscious), or functionalist (sub-routines).
      *   *Pros:* Preserves the analogy with other-deception.
      *   *Cons:* Homunculus problem (who watches the watchers?), empirical evidence for strict partitions is shaky.

  4.  **Camp 2: Non-Intentionalism (The "Motivational Bias" Model):**
      *   *Core Idea:* Drop the intention, keep the unitary self.
      *   *Mechanism:* It's not a *lie*, it's a *bug* (or feature) in belief formation. Desire influences cognition. We weigh evidence differently based on emotional cost.
      *   *Philosophical flavor:* Davidson, Mele. Cognitive bias.
      *   *Pros:* No contradiction (you never truly knew $\neg P$ firmly), fits psychological data on bias.
      *   *Cons:* Is it really *deception* if there's no intent? Might just be "wishful thinking."

  5.  **The Concrete Case (Cheating Partner):**
      *   *Scenario:* Partner comes home late, smells like perfume, phone is face down. Subject says "They're just busy."
      *   *Intentionalist View:* One part of the mind sees the evidence and knows "Cheating." It actively suppresses this data from the conscious narrative module to avoid pain. The conscious module genuinely believes "Busy."
      *   *Non-Intentionalist View:* The subject sees the evidence. But the *threshold* for accepting "Cheating" is raised because the cost is high. The evidence is reinterpreted ("Perfume? Maybe coworker hugged them"). No active hiding, just skewed processing.

  6.  **The "Attention/Evidence" Move (Strategic Irrationality):**
      *   *Idea:* I don't control the belief directly (doxastic voluntarism is false). I control the *input*. I avoid looking at the phone. I don't ask questions.
      *   *Is it cheating?* No, it's often called the "Diachronic" solution. The contradiction is synchronic (at one time). If we spread it over time, it works. I choose to ignore evidence *now* so I believe $P$ *later*.
      *   *Verdict:* This is the strongest pragmatic solution. It bridges the gap. It turns self-deception into "evidence management."

