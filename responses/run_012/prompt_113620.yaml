      *Correction on Ordering:* Actually, the Therapeutic objection might be more foundational (methodological), but the Kripkean objection is more substantive regarding the *thesis*. Let's put Kripkean first because it directly contradicts the "minimal private language survives" claim. Therapeutic second because it undermines the *way* the claim is argued. Psych third (empirical check). Phenomenal fourth (compatibility check). Linguist fifth (terminological).

  4.  **Drafting Replies & Vulnerabilities:**
