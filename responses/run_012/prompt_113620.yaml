      *(Refining the Killer Objection)*: The Kripkean objection is the standard "skeptical solution" challenge. But the *real* killer for this specific thesis is the combination of Kripke + Therapeutic: "If you can't distinguish 'is right' from 'seems right' without public check, your 'minimal language' has no truth conditions." I will frame the Killer as the Kripkean one because it's the most direct contradiction.

