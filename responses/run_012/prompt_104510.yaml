answer: |-
  This is a fantastic prompt. It forces us to separate Frege's actual technical machinery in philosophy of language from the metaethical realisms often grafted onto it later. If we strip away the "Platonist" label and look at Frege as a logician and philosopher of language obsessed with the objectivity of truth, his reaction to the Frege-Geach problem and expressivism would be sharp, specific, and likely devastating to the expressivist, but perhaps slightly critical of Geach's generosity.

  Here is a prediction of Frege's diagnosis, broken down by the specific components of the problem.

  ### 1. On Geach's Reading: Correct Structure, Too Generous Premise
  Frege would likely agree with Geach's structural use of the **Force/Content distinction**. In *Der Gedanke* (1918), Frege explicitly distinguishes the *assertion* of a thought from the *entertainment* of a thought. He uses the example of a theatrical play: an actor utters a sentence, expressing a thought, but does not assert it as true. Geach's point—that the content of "Stealing is wrong" must be the same in "Stealing is wrong" and "If stealing is wrong..."—is a direct application of Frege's insight that the *Gedanke* (Thought) is the unit of meaning that remains constant across different illocutionary forces (assertion, questioning, conditionalizing).

  **However,** Frege would likely think Geach let the expressivist off too lightly. Geach assumes there *is* a content there that needs explaining. Frege would suspect the expressivist has failed to provide a content *at all*. Geach treats the expressivist as someone offering a rival theory of content; Frege would treat them as someone who has confused content with something non-contentful.

  *   **Commitment:** Frege is explicitly committed to the Force/Content distinction (e.g., his notation in *Begriffsschrift* where the judgment stroke `⊢` is separate from the content stroke `—`).
  *   **Extrapolation:** Frege never explicitly discussed conditionals involving moral predicates. We are extrapolating that he would treat moral conditionals exactly like mathematical or empirical conditionals regarding logical form.

  ### 2. The Diagnosis: A Resurgence of Psychologism
  Frege's primary diagnosis of the expressivist error would be that it is a sophisticated form of **Psychologism**. This was Frege's lifelong philosophical nemesis. Psychologism is the error of confusing logical laws with mental laws, or objective content with subjective mental processes.

  For Frege, a *Gedanke* (Thought) is not a mental idea; it is an objective, mind-independent entity that is the bearer of truth. When Ayer or Blackburn says "Stealing is wrong" expresses disapproval, Frege would argue they are pointing to a subjective, inner occurrence (a feeling of disapproval) and mistaking it for the public, shareable content of the sentence.

  Frege would say the expressivist is confusing the **coloring** (*Färbung*) or **illumination** (*Beleuchtung*) of a sentence with its **sense** (*Sinn*). Frege acknowledged that words carry emotional coloring (e.g., "cur" vs. "dog" have the same reference and sense but different coloring). He would likely argue that expressivists have noticed the *coloring* of moral language (its action-guiding, emotive force) and mistakenly elevated that coloring to the status of the *sense*.

  *   **Commitment:** Frege's anti-psychologism is explicit in *The Thought* and *Logic*. He insists thoughts are not ideas in a mind.
  *   **Diagnosis:** He would say the expressivist makes the sentence incapable of being a premise in logic because they have reduced the content to a mental state. You cannot put a feeling inside a conditional; you can only put a Thought.

  ### 3. On Embedding and Logic: The Truth-Value Constraint
  This is where Frege would be most rigid. For Frege, the primary function of declarative sentences in a logical context is to refer to truth-values (The True or The False). In *On Sense and Reference*, he argues that the *Bedeutung* (reference) of a sentence is its truth-value.

  The Frege-Geach problem highlights that moral sentences behave logically like truth-apt sentences. Frege would argue that this isn't a puzzle to be solved by tweaking the theory of content; it is proof that moral sentences *are* truth-apt. If a sentence can appear in the antecedent of a conditional, it must contribute to the truth conditions of that conditional.

  Frege's logic is bivalent and truth-functional. If "Stealing is wrong" does not have a truth-value, then "If stealing is wrong, then..." is logically malformed. It's not that the expressivist owes us a story about how non-truth-apt sentences embed; it's that **non-truth-apt sentences cannot embed.** The fact that they *do* embed in natural language proves they express Thoughts capable of being true or false.

  *   **Commitment:** The principle of compositionality and the requirement that logical validity preserves truth.
  *   **Extrapolation:** Frege rarely discussed normative language. It is possible he might have categorized ethics alongside poetry or prayer (which he thought did not express scientific Thoughts). However, given his insistence on the rigor of scientific language, he would likely demand ethics be cleaned up to fit logic, rather than changing logic to fit ethics.

  ### 4. On Content Identity: The "Same Thought" Requirement
  You asked specifically about the claim that the content is the same in embedded and unembedded cases. Frege would agree with Geach here, but for a stricter reason than Geach might have intended.

  For Frege, identity of content is identity of *Thought*. If the content is the same, the Thought is the same. If the Thought is the same, it must have the same truth-conditions.
  *   **Case A (Asserted):** "Stealing is wrong." (Expresses Thought T, asserts T is True).
  *   **Case B (Embedded):** "If stealing is wrong..." (Expresses Thought T, does not assert T is True).

  The expressivist says Case A expresses Disapproval D. But in Case B, I am not expressing Disapproval D. Therefore, the meaning cannot be D.
  Frege would add: In both cases, you are grasping Thought T. The expressivist fails because "Disapproval D" is not a Thought. It is a mental state. You cannot grasp a mental state in the way you grasp a Thought. A Thought is objective; I can grasp the Pythagorean theorem, and so can you. If "Stealing is wrong" were just my disapproval, you couldn't grasp *my* disapproval to disagree with me; you'd only have your own.

  Frege would argue that the expressivist cannot account for **contradiction**. If I say "Stealing is wrong" and you say "Stealing is not wrong," we are contradicting each other only if we are addressing the same Thought. If I am expressing my attitude and you are expressing yours, we are just reporting different psychological facts about ourselves. There is no disagreement, only difference. Frege would find this intolerable for any discourse claiming rationality.

  *   **Commitment:** The objectivity of Thoughts and the nature of contradiction (one Thought cannot be both True and False).
  *   **Diagnosis:** Expressivism dissolves disagreement into mere divergence of attitude, which destroys the possibility of logical conflict.

  ### 5. Tensions and Where Frege Might Waver
  Here is where we must flag the extrapolation. There is a tension in Frege's work regarding sentences that don't seem to describe facts.
  1.  **Imperatives and Questions:** Frege admits these do not express Thoughts (they have sense but no truth-value). He might be tempted to classify moral sentences here.
  2.  **The "Scientific" Language Ideal:** Frege was trying to construct a language for science (logic/math). He might have conceded that ordinary moral language is "defective" and lacks genuine Thought-content, treating the Frege-Geach data as evidence of the sloppiness of natural language rather than a deep metaphysical feature of ethics.

  **Which way would he go?**
  Given his reaction to the paradoxes in logic, Frege tended to double down on rigor rather than accommodate usage. He would likely argue that if moral sentences function logically, they *must* express Thoughts. If expressivists deny they express Thoughts, expressivists are denying they function logically. Since they clearly *do* function logically (as Geach showed), the expressivist is simply wrong about the nature of the sentences.

  He would not try to solve the Frege-Geach problem *for* the expressivist. He would use the Frege-Geach problem to **refute** expressivism.

  ### Summary of Frege's Predicted Response

  1.  **To Geach:** "You are correct that the Thought must remain constant regardless of assertion. You have correctly applied my distinction between force and content."
  2.  **To the Expressivist:** "You have committed the sin of Psychologism. You have confused the subjective feeling accompanying a judgment (coloring/force) with the objective Thought that is judged. Because you have done this, you cannot explain how your 'attitudes' combine in logic. They cannot combine, because logic operates on Truth, not Feelings."
  3.  **On Embedding:** "The fact that these sentences embed proves they express Thoughts with truth-values. If they did not, the conditional would be nonsense. Do not try to invent a 'logic of attitudes.' Fix your semantics so that moral sentences express genuine Thoughts."
  4.  **On Content Identity:** "Content identity *is* Thought identity. Since you cannot have the 'same attitude' in a conditional that you have in an assertion (as you admit), you have proven that the meaning is not the attitude. It is the Thought. You simply refuse to acknowledge the Thought exists."

  **Final Verdict:** Frege would view the Frege-Geach problem not as a challenge to be solved by refining expressivism (like Blackburn's quasi-realism attempts), but as a **reductio ad absurdum** of expressivism itself. He would see it as proof that moral language, insofar as it is rational, is cognitive and truth-apt. The "weirdness" the seminar is discussing would strike him as the inevitable result of trying to build a logic out of psychology.
