  4.  **Evaluating the Readings (The "Verdict"):**
      *   Flatmate is half-right (Leibniz *did* accuse him of pantheism) but wrong on the conclusion. Newton isn't a pantheist; he's trying to avoid making Space an absolute independent entity (which would challenge God's sovereignty) while also avoiding making it merely relational (which would challenge Absolute Space physics).
      *   The "Dominion" point is crucial. For Newton, a God without dominion is an idol. This connects to his anti-Trinitarianism (only the Father is the *Pantokrator* in the fullest sense).
