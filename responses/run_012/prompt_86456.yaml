      *   *Reading A (The Flatmate/Leibnizian):* Newton is a Deist or crypto-Spinozist. God is bound to space/time. If God constitutes space, God *is* space (Pantheism). The "Lord" talk is window dressing.
      *   *Reading B (The Traditional Theist):* Newton is defending orthodox (or near-orthodox) Christian theism against materialism. God is distinct from creation but omnipresent. "Lord" emphasizes moral governance.
      *   *Reading C (The Arian/Voluntarist):* Newton is redefining God to prioritize the *Father* as the unique ruler. The Son is a mediator. "Dominion" is key because without will/command, you don't have a God, just a mathematical principle. This fights both Atheism (no ruler) and Trinitarianism (divided rule).
