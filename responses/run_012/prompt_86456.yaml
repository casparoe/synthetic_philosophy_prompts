answer: |-
  This is one of the most famous headaches in the history of science and theology. You and your flatmate have stumbled into the exact minefield that Gottfried Wilhelm Leibniz tried to blow up in Newton's face during the last decade of Newton's life. Your flatmate is echoing Leibniz's accusations; your intuition is echoing Newton's actual theological intentions. Both of you are seeing real features of the text, but you are drawing different conclusions about what those features *mean*.

  Since you are on a train and need the explanation now, I will act as that historian of early modern thought. I will lay out the competing interpretations, give you my verdict on what Newton is actually doing, and then walk through the specific clauses that are causing the argument.

  ### Part 1: The Competing Readings

  To understand why this passage is so difficult, you have to see the three distinct pressures Newton was under while writing the General Scholium (added to the second edition of the *Principia* in 1713).

  **1. The Pantheist/Spinozist Reading (Your Flatmate's View)**
  This reading suggests that by tying God so closely to Space and Duration ("by existing always and every where, he constitutes Duration and Space"), Newton is collapsing the distinction between Creator and Creation. If God *constitutes* Space, and Space is everywhere, then God is effectively identical with the container of the universe.
  *   **The Argument:** This makes God immanent rather than transcendent. It sounds like Spinoza's "God or Nature."
  *   **The Proponent:** Leibniz. He accused Newton of making God the "Soul of the World" (which Newton explicitly denies) because if God is present in space, He is limited by it.
  *   **Strengths:** It takes the "constitutes" line literally.
  *   **Weaknesses:** It ignores Newton's frantic insistence on "Dominion" and "Lordship." Spinoza's God does not rule; Newton's God *must* rule.

  **2. The Deist/Clockmaker Reading**
  This suggests Newton is describing a distant architect who set up Space and Time, wound the clock, and now governs it from afar.
  *   **The Argument:** The focus on "Lord" and "Servants" implies a legalistic, distant relationship.
  *   **Strengths:** Fits the "Scientific Revolution" narrative of removing God from daily physics.
  *   **Weaknesses:** Newton hated Deism. He believed God was actively involved in sustaining the universe (preventing the solar system from collapsing). The text says God is "every where present," not distant.

  **3. The Voluntarist/Arian Reading (Your Intuition)**
  This reading suggests Newton is redefining God to prioritize *Will* and *Power* over abstract *Essence*. For Newton, a being that is merely "Infinite" or "Eternal" (abstract attributes) is not necessarily God. A being is only God if it has *Dominion* over something else.
  *   **The Argument:** This is a theological move to secure the uniqueness of God the Father (anti-Trinitarian) and to secure the reality of Absolute Space (anti-Relational).
  *   **Strengths:** Explains the obsession with the word "Lord." Explains why "God is a relative word." Fits Newton's private heretical manuscripts.
  *   **Weaknesses:** Requires understanding Newton's private theology to fully grasp the public text.

  ### Part 2: The Verdict

  Here is the plain answer: **Your intuition is correct, and your flatmate is repeating Leibniz's polemical caricature.**

  Newton is not a pantheist, nor is he a standard Deist. He is a **Theistic Voluntarist with strong Anti-Trinitarian leanings.**

  The entire passage is a defensive fortification. Newton is trying to walk a tightrope between three enemies:
  1.  **Atheists/Materialists:** Who say the universe runs by blind mechanical laws without a ruler.
  2.  **Spinozists/Pantheists:** Who say God is just the sum total of nature (the "Soul of the World").
  3.  **Orthodox Trinitarians:** Who say God is three persons in one substance (Newton believed this was idolatry).

  The "Dominion" language is the key. Newton is arguing that *metaphysical perfection* (being Eternal/Infinite) is not enough to be God. You need *political authority* (Dominion). This is why he says "God is a relative word." You cannot be a Lord without subjects. Therefore, God requires a Creation to rule over. This saves God from being an abstract concept and makes Him an active Agent.

  ### Part 3: Clause-by-Clause Breakdown

  Let's dissect the specific phrases that are causing the yelling.

  **1. "Not as the soul of the world, but as Lord over all"**
  *   **The Target:** This is aimed at the Stoics and, more urgently for Newton, Baruch Spinoza.
  *   **The Work it Does:** In the 17th century, a popular idea was that God was the "Anima Mundi" (Soul of the World), meaning the universe was God's body. If that were true, God would suffer when the world suffers, and God would be divisible (since the world has parts).
  *   **Newton's Point:** God is distinct from the universe. He rules it like a King rules a kingdom, not like a mind rules a body. This preserves God's transcendence. Your flatmate's claim that this is pantheism is directly contradicted by this sentence. Newton is explicitly *denying* pantheism here.

  **2. "God is a relative word, and has a respect to servants... Deity is the dominion of God"**
  *   **The Work it Does:** This is the theological bomb. In traditional scholastic theology, God is God by *essence* (He is the most perfect being). Newton is saying God is God by *relation* (He is the Ruler).
  *   **Why?** Two reasons.
      *   **Anti-Atheism:** If you define God as just "Infinite Substance," an atheist can say "Okay, the Universe is Infinite Substance, so the Universe is God." Newton blocks this. The Universe cannot *rule* the Universe. Only a distinct Will can rule.
      *   **Anti-Trinitarianism (The Heresy):** This is where your suspicion is spot on. Newton privately believed that only the Father is the supreme "Lord." The Son (Jesus) was a created mediator, subordinate to the Father. By defining God strictly as "Lord/Pantokrator" (Universal Ruler), Newton subtly privileges the Father. The Son executes the will, but the Father holds the Dominion. If God were defined as "Infinite Essence," the Son could be co-equal. If God is defined as "Supreme Ruler," there can only be one Supreme. This is why he insists "every lord is not a God." A local lord isn't God; only the *Universal* Ruler is.

  **3. "He is not Eternity and Infinity, but Eternal and Infinite... he constitutes Duration and Space"**
  *   **The Problem:** This is the metaphysical crux. Newton needs Absolute Space to be real (for his physics to work), but he cannot make Space an independent eternal entity (because that would be a rival God).
  *   **The Solution:** God is not Space (Identity), but Space exists *because* God exists (Emanation).
  *   **The Reading:** Think of it like light and the sun. The Sun is not the Light (the Sun is the source), but the Light exists only because the Sun is there. Newton is saying Space and Time are "emanative effects" of God's existence.
  *   **"Constitutes":** He does not mean "is identical to." He means "grounds the existence of." Because God is eternal, Duration exists. Because God is omnipresent, Space exists.
  *   **Flatmate's Objection:** Your flatmate says this collapses the difference.
  *   **Rebuttal:** Newton adds "He endures and is present." He is distinguishing the *Substance* (God) from the *Attributes/Effects* (Space/Time). God *has* these properties; He is not the properties themselves. It is slippery, yes, but it is not pantheism. It is an attempt to make Space ontologically dependent on God without making it a created thing (since Space was always there, before the world was made).

  **4. "Every soul that has perception is... still the same indivisible person."**
  *   **The Work it Does:** This is an analogy to explain how God can be present everywhere without being divided into parts.
  *   **The Argument:** You are one person. You exist through time (duration) and your body occupies space. But your "self" isn't cut into slices like a loaf of bread. You don't have a "Tuesday soul" and a "Wednesday soul." You are indivisible.
  *   **The Anti-Trinitarian Edge:** Yes, this is almost certainly there. Newton is emphasizing the *unity* of the person. "Neither the one nor the other [parts] in the person of a man... much less can they be found in the thinking substance of God."
  *   **Why it matters:** If God were a Trinity of three co-equal persons, the "unity of person" becomes very complicated. Newton is stressing that God is *one* thinking substance, one person, just as you are. It reinforces the Arian view: One God (the Father), one Lord.

  ### Part 4: Addressing the Heresy and the "Deism" Charge

  **Is this Deism?**
  No. Deism typically implies God does not intervene. Newton's God is a "Lord." A Lord who does not govern is a figurehead. Newton's God actively sustains the solar system (which Newton thought was unstable and needed periodic correction). The "Dominion" language is the opposite of Deism; it demands active sovereignty.

  **Is this Heresy (Arianism)?**
  Yes, but coded. Newton never published his anti-Trinitarian tracts (like *Two Notable Corruptions*). He would have been ruined professionally. But in the Scholium, he carefully avoids the word "Trinity." He speaks of "God" almost exclusively as the Father ("Lord God Pantokrator").
  *   **The Clue:** "For God is a relative word, and has a respect to servants." In orthodox Trinitarianism, the Son is God by nature, regardless of creation. Newton is implying that the title "God" is inextricably linked to the act of Ruling over Creation. This subordinates the Son (who is often seen as the Logos/Wisdom within the Godhead) to the Father (the Ruler).
  *   **The "Lord" Fixation:** You noticed this, and it is the most important insight you had. Newton is shifting the definition of Divinity from *Ontology* (what God *is*) to *Voluntarism* (what God *does*). This protects the Father's unique status as the only "Supreme."

  **Does the Flatmate's Reading Survive?**
  Your flatmate is historically justified in raising the point—Leibniz made the exact same argument in the Leibniz-Clarke correspondence (1715-1716). Leibniz argued that if Space is God's "sensorium" (a word Newton used in earlier drafts but removed here, though the concept remains), then God is limited by Space.
  *   **Why the Flatmate is Wrong:** Leibniz assumed Newton was making Space an *attribute* of God. Newton is trying to say Space is a *consequence* of God. It is a subtle distinction, but for Newton, it saves God from being material. If Space *is* God, God is extended and divisible. If Space *flows from* God, God remains spiritual and indivisible. Newton's text ("much less can they be found in the thinking substance of God") is a direct rebuttal to the idea that God is divisible.

  ### Part 5: What is Settled vs. Contested

  **Settled:**
  1.  **Newton was an Anti-Trinitarian:** Historians agree Newton privately rejected the Trinity. The Scholium's focus on "One Lord" is consistent with this.
  2.  **Newton rejected "Soul of the World":** He was not a Spinozist. He believed in a transcendent Creator.
  3.  **The "Dominion" Definition is Unique:** Newton's definition of God as "Lord" rather than "Infinite Being" is a deliberate theological intervention, not just pious filler.

  **Contested/Speculative:**
  1.  **The Ontology of Space:** Historians still argue over whether Newton truly succeeded in making Space an "emanative effect" without making it part of God's essence. Some say he failed and *did* slip into a kind of neo-Platonic panentheism (God contains the world).
  2.  **Public vs. Private Intent:** How much of this was calculated to hide his heresy, and how much was his genuine public theology? Most scholars think it's a mix: he believed it, but he phrased it to avoid prosecution.
  3.  **"Constitutes":** Whether Newton meant Space is created by God's will or flows necessarily from God's nature is still debated. The text suggests the latter ("by existing always... he constitutes"), which edges closer to the pantheism Leibniz feared, even if Newton denied it.

  ### Summary for the Train Ride

  Tell your flatmate this:
  Newton is not describing a Clockmaker (Deist) or a World-Soul (Pantheist). He is describing a **Monarch**.

  The confusion comes because Newton is trying to solve a physics problem (What is Absolute Space?) with a theology solution (It's the presence of God).
  *   When he says God **"constitutes"** Space, he means Space is the shadow cast by God's existence. It's not God, but it's nothing without Him.
  *   When he insists on **"Dominion,"** he is saying that without the power to command, "God" is just a math problem.
  *   When he talks about the **"Indivisible Person,"** he is defending God's unity against both materialists (who divide God into parts) and Trinitarians (who divide God into persons).

  You were right to focus on the word "Lord." That is the anchor. Newton is terrified of a universe without a Ruler, and he is equally terrified of a Ruler who is not distinct from the Ruled. This passage is his attempt to hold those two lines apart. Your flatmate is seeing the tension; you are seeing the resolution Newton intended.
