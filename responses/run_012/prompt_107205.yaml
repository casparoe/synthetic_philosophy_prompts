answer: |-
  ### The Spec: Desiderata for the RKR/WKR Distinction

  This document outlines the requirements any adequate account of the Right Kind/Wrong Kind (RKR/WKR) distinction must satisfy. It prioritizes case classification and structural constraints over theoretical commitment.

  #### I. Classification Requirements
  *An adequate account must classify the following cases in the specified way, with the accompanying justification.*

  **1. The Admiring Demon (Paradigm WKR)**
  *   **Requirement:** The threat of punishment (or promise of reward) for admiring the demon must be classified as a **WKR** for admiration.
  *   **Consideration:** Admiration is an attitude that purports to track the merit or value of its object. A threat alters the *cost* of the attitude but does not alter the *merit* of the demon. If the theory classifies this as an RKR, it renders admiration responsive to self-interest rather than value.

  **2. The Pragmatic Believer (Paradigm WKR)**
  *   **Requirement:** An offer of cash to believe a specific arithmetical claim (e.g., $1M to believe 2+2=5) must be classified as a **WKR** for belief.
  *   **Consideration:** Belief purports to track truth. Money does not make the proposition true. If the theory classifies this as an RKR, it severs the normative link between belief and truth.

  **3. The Paid Mourner / Mercenary Lover (Emotional Attitudes)**
  *   **Requirement:** Rewards for feeling grief (without loss) or loving someone (without attachment/merit) must be classified as **WKRs**.
  *   **Consideration:** Emotions have correctness conditions grounded in the world (e.g., grief requires loss; love requires valuing the person). External rewards do not satisfy these conditions. A theory that allows money to make grief "fitting" fails to capture the phenomenology of emotion.

  **4. The Truth-Contingent Payoff (Special Case A)**
  *   **Requirement:** An offer of money conditional on holding a *true* belief (e.g., "$1M if you believe *p* and *p* is true") must be classified as a **WKR** for the belief itself.
  *   **Consideration:** While this incentive is truth-sensitive, the money does not constitute *evidence* for *p*. It makes holding the belief *profitable* if true, but does not make *p* more likely to be true. The theory must distinguish between reasons that bear on the *truth* of the content and reasons that bear on the *consequences* of holding a true belief.

  **5. The Sincerity Bonus (Special Case B)**
  *   **Requirement:** An employer bonus for *sincerely* believing a product is safe must be classified as a **WKR** for the belief.
  *   **Consideration:** This incentivizes the psychological state of conviction directly, bypassing evidence. It is a reason to *induce* the state in oneself (self-manipulation), not a reason that supports the content ("the product is safe"). The theory must distinguish reasons *for* an attitude from reasons to *cause* oneself to have that attitude.

  **6. The Toxin/Desire Case (Instrumental Attitudes)**
  *   **Requirement:** In cases where an agent is rewarded for *desiring* to do something (where the desire is the condition for reward, not the action), the reward is a **WKR** for the desire, even if it is an RKR for the *action* or for *wanting to have* the desire.
  *   **Consideration:** Desires (like beliefs) have correctness conditions (e.g., desiring what is good or worth pursuing). A reward for desiring does not make the object of desire good. The theory must prevent the collapse of reasons for attitudes into reasons for actions or higher-order volitions.

  #### II. Structural Constraints
  *An adequate account must maintain the following distinctions without collapse.*

  **1. The Correctness vs. Wisdom Distinction**
  *   **Requirement:** The theory must distinguish between considerations that make an attitude *correct/fitting* (RKR) and considerations that make it *beneficial/prudent* to have (WKR).
  *   **Consideration:** Without this, we cannot explain why it is rational to admire the demon (to save your life) while simultaneously acknowledging the demon is not admirable.

  **2. The Object vs. State Distinction**
  *   **Requirement:** The theory must distinguish between properties of the *object* of the attitude (e.g., the demon's merit, the proposition's truth) and properties of the *state* of having the attitude (e.g., the pleasure of believing, the safety of believing).
  *   **Consideration:** RKRs typically cite object-properties; WKRs typically cite state-properties. A theory that cannot formally distinguish these will fail to generalize across different attitudes.

  **3. The Direct vs. Indirect Distinction**
  *   **Requirement:** The theory must distinguish between reasons that support the attitude *directly* and reasons that support *bringing it about* that one has the attitude.
  *   **Consideration:** Essential for handling Special Case B (Sincerity Bonus). If the theory treats reasons to induce a state as reasons for the state, it validates self-deception as rational belief formation.

  #### III. Incompatible Desiderata (The Tensions)
  *These are pairs of requirements that are notoriously difficult to satisfy jointly. A theory will likely have to prioritize one over the other.*

  **1. Unified Treatment vs. Attitude-Specific Norms**
  *   **Tension:** A single, unified definition of RKR/WKR that applies equally to belief, admiration, grief, and intention vs. acknowledging that the "Right Kind" is determined by the specific normative standard of each attitude (truth for belief, merit for admiration, etc.).
  *   **Why they clash:** Unified theories (e.g., "Object-Given") often struggle to define "object" consistently across attitudes. Attitude-specific accounts avoid this but risk fragmentation, offering no general meta-normative story.

  **2. The Truth-Contingent Payoff vs. The No-Pragmatics Rule**
  *   **Tension:** Classifying Truth-Contingent Payoffs (Special Case A) as WKRs vs. acknowledging that they are structurally closer to evidence than the Demon case.
  *   **Why they clash:** If you insist *all* pragmatic benefits are WKRs, you must explain why truth-contingent rewards don't count as RKRs despite tracking truth. If you allow truth-contingent rewards to be RKRs, you risk opening the door to pragmatic encroachment, violating the standard "Belief Aims at Truth" platitude.

  **3. Normative Force vs. Explanatory Neutrality**
  *   **Tension:** Defining RKRs in terms of "fittingness" or "correctness" vs. defining them in neutral terms (e.g., "reasons that cite object properties").
  *   **Why they clash:** Defining RKRs via fittingness risks circularity (RKRs are reasons of the right kind because they make the attitude fitting; fittingness is determined by RKRs). Defining them neutrally risks failing to capture why RKRs have a special normative authority over WKRs.

  #### IV. Settled vs. Contested Claims
  *Do not treat the contested claims as data points the theory must fit. Treat them as live options.*

  **Settled (Broad Consensus):**
  *   **The Intuition:** There *is* a distinction. The Demon case is a WKR; the demon's merit (or lack thereof) is the RKR.
  *   **The Direction:** RKRs bear on the *correctness* conditions of the attitude. WKRs bear on the *prudence* or *consequences* of holding it.
  *   **The Scope:** The problem applies across multiple attitudes (belief, desire, emotion, intention), not just belief.

  **Contested (Live Debates):**
  *   **The Status of WKRs:** Are WKRs reasons *for the attitude* that are merely outweighed or overridden? Or are they reasons *to want/bring about* the attitude, but not reasons *for* it at all? (This is the "Reasons for Wanting" vs. "Wrong Kind of Reasons" debate).
  *   **Pragmatic Encroachment:** Are there *any* cases where pragmatic considerations (like stakes or rewards) become RKRs for belief? (e.g., does high stakes make it rational to believe in a way that low stakes does not?)
  *   **Reducibility:** Can "fittingness" or "correctness" be reduced to reasons, or is fittingness primitive?
  *   **Unity:** Is there a single property that makes a reason the "Right Kind" across all attitudes, or is the distinction sui generis for each attitude type?

  #### V. Brief Assessment of Main Families

  **1. Reasons for Wanting (The "New Wave" View)**
  *   **Claim:** WKRs are not reasons for the attitude at all; they are reasons to *want* to have the attitude or to *bring it about*.
  *   **Performance:** Handles the Demon and Cash cases well. Struggles with Special Case A (Truth-Contingent) and Special Case B (Sincerity), as these look like reasons to bring about the state, yet the intuition that they aren't RKRs remains. Risks an infinite regress (reasons to want to want?).

  **2. Object-Given vs. State-Given (The "Standard" View)**
  *   **Claim:** RKRs cite properties of the object of the attitude; WKRs cite properties of the state of having the attitude.
  *   **Performance:** Intuitive for belief and admiration. Struggles to define "object" for emotions (is the object the person or the situation?) and intentions. Vulnerable to counterexamples where state-properties seem relevant to correctness (e.g., safety of belief).

  **3. Fittingness First (The "Non-Reductive" View)**
  *   **Claim:** Fittingness is primitive. RKRs are considerations that bear on fittingness. WKRs do not.
  *   **Performance:** Avoids circularity by refusing to reduce fittingness. However, it offers less explanatory power; it labels the distinction rather than solving it. It handles all cases by stipulation but tells us little about *why* the distinction holds.

  **Summary for Seminar:**
  Use the **Classification Requirements** to test the theories. Use the **Tensions** to force the students to choose sides. Use the **Settled/Contested** section to prevent them from assuming their preferred meta-ethics is the baseline. The core friction point for your seminar should be Special Case A (Truth-Contingent Payoff): it is the stress test that breaks the cleanest divisions.
