      *   Give consideration behind each requirement? Yes.
      *   Flag pairs that can't be jointly satisfied? Yes.
      *   Short paragraph on main families? Yes.
      *   Separate settled vs. contested? Yes.
      *   No citations? Yes.

  11. **Drafting the Content (Mental or Scratchpad):**
      *   *Desideratum 1:* Demon/Admiration. Threat -> WKR. Consideration: Admiration tracks merit.
      *   *Desideratum 2:* Cash/Belief. Cash -> WKR. Consideration: Belief tracks truth.
      *   *Desideratum 3:* Grief/Love. Reward -> WKR. Consideration: Emotions track fittingness to situation/person.
      *   *Desideratum 4:* True Belief Payoff. Money for Truth -> WKR. Consideration: Payoff doesn't make p true.
      *   *Desideratum 5:* Sincere Belief Bonus. Bonus for Sincerity -> WKR. Consideration: Incentive doesn't constitute evidence.
