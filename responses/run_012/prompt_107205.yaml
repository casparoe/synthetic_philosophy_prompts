prompt: |-
  I'm putting together a unit on the wrong kind of reasons problem for my grad seminar, and I want to start with the spec instead of the theories. So before we look at any account of the line between the right kind and the wrong kind of reason for an attitude, give me the desiderata — what any adequate account of that distinction has to deliver. Which cases it has to classify correctly (say which cases those are, with the case behind each requirement), which distinctions it can't collapse, which results or platitudes it can't contradict, and which of the things people in this literature demand are genuine requirements versus the prejudices of one camp.

  The cases I care most about, so make sure the list is answerable to them: the demon who rewards you for admiring him; the offer of cash to believe some arithmetical claim; the reward for feeling grief, or for loving someone; and then theres a couple I want handled that I think people get wrong — (a) someone offers you money to *correctly* believe some proposition, so the payoff is contingent on the belief's being true; and (b) an employer that bonuses employees who sincerely believe the product is safe. I also want the toxin-style case where what you're given a reason for is the desire rather than the action the desire is about.

  For each requirement, give the consideration behind it. Then flag the pairs you think can't be jointly satisfied — that's the part I most want to see. After that, a short paragraph on how the main families do against your list: the view that wrong-kind reasons aren't reasons for the attitude at all but reasons to want to have it; the object-given versus state-given way of drawing the line; and the view that fittingness is primitive and not reducible to reasons. Keep the weight on the criteria — I'll do the scoring in class, so keep that part brief.

  One more thing: separate what's actually settled in this literature from what's genuinely contested among people who know it, and don't hand me a contested position as if it were the consensus. And no reading lists or citations — I just want the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Wrong Kind of Reasons (WKR) problem in meta-ethics/philosophy of mind.
      *   **Goal:** Provide a "spec" (desiderata) for an adequate account of the RKR/WKR distinction *before* looking at theories.
      *   **Specific Cases to Cover:**
          *   Demon who rewards admiring him (Pascal's Wager style/Evidentialism challenge).
          *   Cash to believe an arithmetical claim (Pragmatic encroachment/Pragmatism).
          *   Reward for feeling grief or loving someone (Emotional attitudes).
          *   *Special Case (a):* Money to *correctly* believe (truth-contingent payoff).
          *   *Special Case (b):* Employer bonuses for *sincerely* believing product is safe.
          *   Toxin Puzzle style: Reason for the *desire* rather than the action.
      *   **Requirements:**
          *   List desiderata (cases to classify, distinctions not to collapse, platitudes not to contradict).
          *   Distinguish genuine requirements from camp prejudices.
          *   Identify tensions/incompatibilities between desiderata (the "hard part").
          *   Briefly assess main families of views (Reasons for Wanting, Object/State-Given, Fittingness First).
          *   **Crucial Constraint:** Separate settled vs. contested claims. Do not present contested positions as consensus. No citations/reading lists.
      *   **Tone:** Academic, precise, seminar-ready, critical.

  2.  **Deconstruct the WKR Problem:**
      *   The core issue: Some considerations count in favor of having an attitude (in the sense that they make it beneficial or rational to have it) but don't count as reasons *for* the attitude in the normative sense relevant to correctness/fittingness.
      *   Example: A demon threatens to kill you unless you admire him. You have a reason to *want* to admire him, or a reason to *bring it about* that you admire him. But does the threat make the demon admirable? No. So it's a WKR.
      *   The challenge: Define "Right Kind" (RKR) vs. "Wrong Kind" (WKR) without circularity and without ruling out legitimate pragmatic reasons (if any exist).

  3.  **Drafting the Desiderata (The Spec):**
      *   *Requirement 1: The Demon Case.* Must classify the threat as WKR for admiration. Admiration is about merit, not survival.
      *   *Requirement 2: The Cash/Belief Case.* Must classify cash as WKR for belief (standard evidentialist intuition). Belief aims at truth.
      *   *Requirement 3: Emotions (Grief/Love).* Must classify rewards for grief/love as WKR. Grief requires loss; Love requires value/connection. Money doesn't create these objects.
      *   *Requirement 4: Truth-Contingent Payoff (Special Case a).* Money for *true* belief. This is tricky. Is it WKR or RKR? Standard view: Still WKR for *belief*, because the money doesn't make the proposition true. But it complicates the "state-given" analysis.
      *   *Requirement 5: Sincere Belief Bonus (Special Case b).* Employer wants *sincere* belief. This looks like a reason to *cause* the belief, not a reason for the belief itself. Must distinguish reasons to induce vs. reasons supporting content.
      *   *Requirement 6: Toxin Puzzle.* Reason to intend/desire vs. reason to act. Must distinguish reasons for the attitude (intention) from reasons for the action. (Actually, the prompt asks for desire vs action desire is about).
      *   *Requirement 7: No Collapse.* Cannot collapse RKR/WKR into "Strong/Weak" reasons. Cannot collapse into "Moral/Non-moral."
      *   *Requirement 8: The Normative Force.* RKRs must bear on the *correctness* or *fittingness* of the attitude. WKRs bear on the *wisdom* or *prudence* of having it.

  4.  **Identifying Tensions/Incompatibilities (The "Hard Part"):**
      *   *Tension 1: The Generality vs. Specificity Problem.* A theory that works for belief (truth-aim) often fails for admiration (value-aim) or intention (action-aim). A unified theory is hard to find.
      *   *Tension 2: The Truth-Contingent Payoff (Case a).* If the reward depends on truth, does it become an RKR? Most say no (money doesn't make 2+2=4 true). But it looks more like evidence than the demon case. If you say it's WKR, you need to explain why it's different from evidence. If you say it's RKR, you threaten the "belief aims at truth" platitude.
      *   *Tension 3: Sincere Belief (Case b).* If I bonus you for *sincere* belief, I am incentivizing the psychological state directly. Is this a reason *for* the belief? No, it's a reason to *manipulate* yourself. The theory must distinguish reasons that operate via the object vs. reasons that operate on the mechanism.
      *   *Tension 4: Normative vs. Explanatory.* RKRs explain why the attitude is *correct*. WKRs explain why it is *beneficial*. Some theories struggle to keep these distinct without circularity (defining RKR as "the right kind").

  5.  **Assessing the Main Families (Briefly):**
      *   *Reasons for Wanting (Raz/Scanlon-ish):* WKRs are reasons to want/bring about the attitude.
          *   *Pros:* Handles Demon easily.
          *   *Cons:* Struggles with Case (a) and (b). Sometimes WKRs *are* reasons for the attitude in a pragmatic sense. Also, regress problems (reason to want to want?).
      *   *Object-Given vs. State-Given (Parfit):* RKRs cite properties of the object; WKRs cite properties of the state.
          *   *Pros:* Intuitive for belief and admiration.
          *   *Cons:* Struggles with Case (a) (truth is a property of the proposition/state relation?). Struggles with emotions where the "object" is complex.
      *   *Fittingness First (Scanlon/Chappell):* Fittingness is primitive. Reasons are derivative.
          *   *Pros:* Avoids reducing normativity to reasons.
          *   *Cons:* Might be too deflationary. Doesn't solve the classification problem, just labels it.

  6.  **Refining "Settled vs. Contested":**
      *   *Settled:* There is a distinction to be made. The Demon case is the paradigm WKR. RKRs relate to correctness conditions.
      *   *Contested:* Whether WKRs are reasons *at all*. Whether there are *any* pragmatic RKRs for belief (Pragmatic Encroachment). Whether the distinction is unified across attitudes (belief vs. desire vs. emotion).
      *   *Constraint Check:* The prompt asks me not to hand a contested position as consensus. I need to be careful saying "Belief aims at truth" is settled (it's widely accepted but contested by pragmatists). I should frame it as a "widely held platitude the theory must accommodate or explain away."

  7.  **Addressing the Specific "Special Cases":**
      *   *Case (a) Money for True Belief:* This is the "Truth-Dependent Reward." Standard intuition: WKR. Why? Because the money doesn't bear on the truth. But it's harder to separate from evidence than the demon case.
      *   *Case (b) Sincere Belief Bonus:* This targets the *sincerity* condition. It's a reason to *make* yourself believe. Must be WKR.
      *   *Toxin/Desire:* Reason to desire the money vs. reason to drink. The intention/desire is the bottleneck.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (Spec first, theory later).
      *   **Section 1: The Core Desiderata (The Must-Haves).** Group by case type.
      *   **Section 2: Structural Constraints (What not to collapse).**
      *   **Section 3: The Tensions (Incompatible Desiderata).** This is the key value-add.
      *   **Section 4: Settled vs. Contested.** Explicitly demarcate.
      *   **Section 5: Theory Scorecard (Brief).**
      *   **Tone Check:** Ensure it sounds like a seminar brief, not a textbook summary. Direct, slightly critical.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I initially thought about citing Parfit. *Correction:* Prompt says "No citations." I must describe the views without naming names if possible, or just use the descriptive labels provided in the prompt.
      *   *Refinement on Case (a):* This is often called the "Truth-Dependent" vs "Truth-Independent" distinction. I need to make sure the spec demands the theory handle why truth-dependence doesn't automatically make it an RKR.
      *   *Refinement on Case (b):* This is about "direct" vs "indirect" control. The spec needs to demand the theory explains why incentives for sincerity don't count as evidence.
      *   *Refinement on Tensions:* The biggest tension is between *Unified Treatment* (one rule for all attitudes) and *Case Sensitivity* (belief works differently than admiration). I should highlight this.
      *   *Refinement on "Settled":* Be careful. Is it settled that WKRs aren't reasons? No, some pragmatists say they are. Is it settled they are the *wrong kind*? Yes, that's the definition of the problem. I need to phrase it as "The distinction exists" is settled; "What it consists in" is contested.

  10. **Final Review against Prompt:**
      *   Start with spec? Yes.
