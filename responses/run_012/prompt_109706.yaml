answer: |-
  # Specification for a Theory of Mental Causation

  **To:** Reading Group on Mental Causation
  **From:** Convenor
  **Subject:** Desiderata for Adequacy (Draft for Discussion)

  The following is a specification list. It treats a theory of mental causation not as a metaphysical stance to be adopted, but as a system to be validated against constraints. Each requirement is marked as **Non-Negotiable** (the theory fails if it violates this) or **Camp Preference** (the theory may violate this, but must explicitly argue why).

  ---

  ## I. Core Desiderata

  ### 1. Causal Efficacy of the Mental
  *   **Requirement:** The theory must affirm that mental events (decisions, beliefs, desires) are sometimes genuine causes of physical events (movements, speech, neural firings).
  *   **Motivation:** The phenomenology of agency and the explanatory practice of psychology/neuroscience. If I reach for a cup because I am thirsty, the thirst must be part of the causal story, not just a shadow.
  *   **Status:** **Non-Negotiable.** (A theory that denies this is a theory of *epiphenomenalism*, not mental *causation*.)

  ### 2. Causal Closure of the Physical Domain
  *   **Requirement:** Every physical event that has a cause must have a sufficient physical cause occurring at the time it occurs.
  *   **Motivation:** Conservation laws (energy/momentum) and the historical success of physiology. If physical effects could occur without physical causes, the physical world would not be a closed system, and experimental control would be impossible.
  *   **Status:** **Non-Negotiable** (for a naturalistic theory).

  ### 3. Non-Overdetermination of Physical Effects
  *   **Requirement:** Physical effects are not systematically caused by two distinct, sufficient causes (one mental, one physical) simultaneously.
  *   **Motivation:** Parsimony and the absence of empirical evidence for systematic causal coincidence. If every movement had both a neural cause and a distinct mental cause, we would expect to see "double" causal work, which we do not.
  *   **Status:** **Non-Negotiable.**

  ### 4. Distinctness of Mental and Physical Properties
  *   **Requirement:** Mental properties (e.g., *believing that p*) are not identical to physical properties (e.g., *C-fiber firing*).
  *   **Motivation:** Multiple Realizability. The same mental state can be realized by different physical states across organisms or within the same organism over time. If mental = physical, we have reduced mental causation to physical causation, solving the problem by eliminating the *mental*.
  *   **Status:** **Camp Preference.** (Reductive physicalists deny this; non-reductive physicalists accept it. An adequate theory must state its position clearly.)

  ### 5. Counterfactual Dependence (Difference-Making)
  *   **Requirement:** The theory must provide an account of how the effect depends on the cause. If the mental cause had not occurred (and no backup cause intervened), the effect would not have occurred.
  *   **Motivation:** Experimental control. In the lab, we establish causation by manipulating variables and observing changes. A cause must make a difference to the outcome.
  *   **Status:** **Non-Negotiable.**

  ### 6. Relata Specification (Events vs. Properties vs. Facts)
  *   **Requirement:** The theory must specify what the causal relata are. Does the *event* of deciding cause the *event* of moving? Or does the *property* of the decision being *rational* cause the movement?
  *   **Motivation:** Conceptual clarity. "Event causation" handles the timing (decision at $t_1$, movement at $t_2$). "Property causation" handles the explanation (why *this* movement rather than *that* one). Collapsing these leads to category errors.
  *   **Status:** **Non-Negotiable** (The theory must choose and defend; collapsing them without argument is a failure.)

  ### 7. Compatibility with Neurophysiological Data
  *   **Requirement:** The theory cannot contradict established timelines of neural processing (e.g., readiness potentials, synaptic transmission speeds).
  *   **Motivation:** Empirical fidelity. A metaphysical theory that requires mental causation to operate faster than nerve conduction or outside of known neural pathways is scientifically untenable.
  *   **Status:** **Non-Negotiable.**

  ---

  ## II. Application to the Surgeon Case

  **The Scenario:**
  1.  **Actual Sequence:** Surgeon decides ($M$) $\rightarrow$ Incision ($P$). (Stimulation $S$ is absent).
  2.  **Counterfactual Sequence:** Surgeon does not decide ($\sim M$) $\rightarrow$ Stimulation activates ($S$) $\rightarrow$ Incision ($P$).

  **The Specification Demands:**

  *   **On Preemption vs. Production:**
      *   Simple counterfactual dependence fails here. If $\sim M$, then $P$ still occurs (via $S$). Therefore, $P$ does not counterfactually depend on $M$ in the simple sense.
      *   **Requirement:** The theory must distinguish between *preemption* (M caused P, S was a backup) and *mere correlation* (M signaled that S would not fire).
      *   **Test:** The theory must explain why $M$ gets causal credit over $S$, even though $S$ was sufficient to produce $P$ in the counterfactual scenario. It must identify a causal *process* or *influence* linking $M$ to $P$ that is absent in the $\sim M$ scenario.

  *   **On Event vs. Property:**
      *   **Requirement:** The theory must distinguish whether the *occurrence* of the decision caused the incision (Event Causation) or whether the *content* of the decision (e.g., "incise here") guided the specific trajectory of the incision (Property Causation).
      *   **Test:** If the theory only accounts for Event Causation, it cannot explain why the incision was precise rather than random. If it only accounts for Property Causation, it cannot explain the timing of the onset.

  *   **On Physical Closure:**
      *   **Requirement:** The theory must identify the sufficient physical cause of the incision in the Actual Sequence.
      *   **Test:** Presumably, this is a specific neural firing pattern ($N$). The theory must explain the relation between $M$ and $N$. If $M = N$, Distinctness is violated. If $M \neq N$, we risk Overdetermination (since $N$ causes $P$ and $M$ causes $P$).

  ---

  ## III. The Consistency Report (The Negative Result)

  You asked for plain speech regarding joint satisfiability.

  **The Inconsistency:**
  There is a logical tension known as the **Causal Exclusion Problem**. The following four claims form an inconsistent set. You cannot hold all four simultaneously:

  1.  **Mental Efficacy:** Mental events cause physical events. (Desideratum 1)
  2.  **Causal Closure:** Every physical event has a sufficient physical cause. (Desideratum 2)
  3.  **Distinctness:** Mental properties are not identical to physical properties. (Desideratum 4)
  4.  **No Overdetermination:** Physical effects do not have two sufficient causes. (Desideratum 3)

  **The Verdict:**
  If you accept **Causal Closure** and **No Overdetermination** as Non-Negotiable (which a physiologist likely must), you are forced to reject **Distinctness**.
  *   **Result:** You must accept Reductive Physicalism (Mental properties *are* Physical properties).
  *   **Alternative:** If you insist on **Distinctness** (Non-Reductive Physicalism), you must either deny **Causal Closure** (interactionist dualism, scientifically costly) or accept **Overdetermination** (systematic redundancy, metaphysically costly) or accept **Epiphenomenalism** (Mental events do not cause physical events, violating Desideratum 1).

  **Most theories fail because they attempt to keep all four.** They assert Distinctness and Efficacy while quietly relaxing Closure or Overdetermination without declaring it.

  ---

  ## IV. Critical Analysis of Requirements

  ### 1. The Requirement That Rules Out the Most Popular Positions
  **The Exclusion Principle (No Overdetermination + Causal Closure).**
  This combination is the primary engine of the Causal Exclusion Argument. It rules out Non-Reductive Physicalism (the most popular position in contemporary philosophy of mind). If physical causes are sufficient (Closure) and we reject double-causing (No Overdetermination), there is no "causal work" left for the mental to do unless the mental *is* the physical. Any theory that wants to keep mental properties distinct *and* causally potent must find a way to weaken one of these two constraints.

  ### 2. The Requirement Most Often Smuggled In
  **The Individuation of "The Physical Cause" (within Causal Closure).**
  *   **The Assumption:** Causal Closure is often stated as "Every physical event has a sufficient *micro-physical* cause."
  *   **The Smuggle:** If "physical cause" means *fundamental particle physics*, then macroscopic biological events (like a surgeon's hand moving) are overdetermined by the micro-physics anyway. A hand movement is caused by muscle contraction, which is caused by motor neurons, which is caused by ions, etc.
  *   **The Consequence:** If we accept overdetermination at the macro-level (muscles vs. ions), why not accept it at the mental-physical level (mind vs. brain)?
  *   **Correction:** The theory must specify at what *level* Closure applies. If it applies only at the micro-level, mental causation at the macro-level is compatible with it without overdetermination, provided mental properties supervene on the relevant macro-physical properties. If Closure is demanded at *every* level, mental causation is impossible for distinct properties.

  ---

  ## V. Summary Scorecard for the Group

  When evaluating a theory, ask these three questions in order:

  1.  **Does it preserve Causal Closure?** (If no, it contradicts physiology.)
  2.  **Does it preserve Distinctness?** (If no, it eliminates the mental.)
  3.  **Does it avoid Overdetermination?** (If no, it posits magical redundancy.)

  **If the answer to all three is "Yes," the theory is logically inconsistent.** The task of the reading group is to decide which "Yes" must become a "No," or how the definitions of these terms must be shifted to dissolve the contradiction.

  **Recommendation:** Begin by scrutinizing the definition of "Cause." If cause means "energy transfer," mental causation is hard to square with Closure. If cause means "counterfactual dependence," mental causation is easier to save, but the Surgeon Case (preemption) becomes the primary obstacle.
