prompt: |-
  I serve on the ethics committee of a mid-sized community mental health system, and we are drafting a decision procedure for our clinicians on what we have been calling Ulysses contracts: instruments in which a patient, while competent, specifies in advance how she is to be treated when she later loses decisional capacity — consenting now to admission or medication she may refuse then, or refusing treatment she may then demand. Our clinicians will run this procedure at the bedside, often in under an hour, usually with a resident or a crisis nurse rather than a psychiatrist trained in ethics. The instrument has to be legible to them. The decision they reach will sometimes be the difference between holding a patient against her expressed wishes and discharging someone into a situation she will not survive. Our medical director must sign off on any override of a patient's current refusal, and our legal counsel must sign off on any template language, so the procedure must tell those two people, separately, what they are being asked to authorize.

  Please write the procedure. It should be a set of questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a decision, and — as important as the rest — where it must hand the question to a person because no procedure can settle it. Then run it on three cases: (1) a woman who, while well, executed a directive refusing electroconvulsive therapy, and who now, in a severe episode, is asking for it and is arguably competent to ask; (2) a man who consented in advance to involuntary admission and who now refuses it, with no ambiguity about the trigger conditions; (3) a patient whose directive was signed during a period when, on the record, she was still ambivalent, so that it is unclear whether the earlier preference was ever stable.

  Some substance to work with, though correct me if any of it is confused. Our committee keeps rediscovering that binding is not one thing: an instrument can remove an option (no one will write the order), raise its cost (the patient knows that skipping appointments leads to admission), or transfer the decision to a third party (a named agent with authority to admit). These fail in different ways, and discussion of individual precommitment tends to blur them. Second, every device is only as binding as the cost of circumvention, and someone always holds the key — the clinician, the named agent, the court. I would like the procedure to require that, for any instrument, we name the keyholder and state what the later self would have to do to get out. Third, the hardest cases are not those where the earlier and later selves disagree, but those where the later self's disagreement is itself the symptom — where refusing the treatment is evidence of the condition the treatment addresses. I do not believe that can be resolved by a rule, and I want the procedure to say so rather than pretend otherwise. One committee member proposes that every instrument carry a mandatory adversary, a person whose only job at each review is to argue for release; another proposes that irrevocability is the entire point and that any release valve defeats it. The procedure should be usable under either proposal, or should say which one it presupposes.

  Finally, I would like a separate section, a page or so, on a question the faculty senate has put to me. It wants to know whether the same procedure could govern the entrenchment clauses in our new governance charter — supermajority requirements, an endowment spending formula, protections for academic freedom. My suspicion is that the analogy breaks, because a body of people across generations is not one person across time, and because the dissenters bound by a constitutional precommitment were never parties to the agreement in the way a patient is. Tell me whether the break is deep enough that the bedside procedure would mislead if transplanted, and if so, precisely which steps have to change. I am not asking for a reading list or a survey of constitutional theory; I want the reasoning and the procedure, and I want the disanalogy stated sharply enough that I can explain it to the senate in ten minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Ethics Committee Member of a mid-sized community mental health system.
      *   **Task:** Draft a decision procedure for clinicians regarding "Ulysses contracts" (psychiatric advance directives/precommitment instruments).
      *   **Audience:** Clinicians (residents, crisis nurses), Medical Director (sign-off on overrides), Legal Counsel (sign-off on templates).
      *   **Constraints:** Must be legible, usable at bedside (under an hour), distinguish between types of binding mechanisms, identify the "keyholder," acknowledge limits of procedure (where human judgment is needed), and address the "symptomatic refusal" problem.
      *   **Specific Content:**
          1.  The Procedure (ordered questions, sufficient answers, termination points, hand-off points).
          2.  Application to Three Cases (ECT refusal/competent request; Involuntary admission refusal; Ambivalent signing).
          3.  Address the "Mandatory Adversary vs. Irrevocability" debate (procedure must work with either or state presupposition).
          4.  Separate Section: Analogy to University Governance (Entrenchment clauses vs. Patient Directives). Explain why the analogy breaks (generational vs. temporal self, dissenters vs. parties).
      *   **Tone:** Professional, precise, ethically rigorous, practical, authoritative but humble about limits.

  2.  **Deconstruct the Ethical & Legal Landscape (Mental Health Context):**

      *   *Ulysses Contracts:* Precommitment strategies where a competent self binds an incompetent future self.
      *   *Capacity:* The core pivot point. Is the current refusal competent?
      *   *Binding Mechanisms:* The prompt distinguishes between removing options, raising costs, and transferring decision. The procedure needs to identify *which* mechanism is in play.
      *   *Keyholder:* Who can override? (Clinician, Agent, Court).
      *   *Symptomatic Refusal:* When the refusal *is* the illness (anosognosia). This is the "hard case" where rules fail.
      *   *Legal Reality:* In many jurisdictions, a patient cannot contract away their right to refuse treatment *while currently competent*, even if they previously said they would be incompetent. However, they *can* often appoint a proxy. The procedure must navigate this legal tightrope without giving false legal advice (hence Legal Counsel sign-off on templates).
      *   *Adversary vs. Irrevocability:* This is a procedural safeguard question. I need to build a step that accommodates the "check" without mandating a specific philosophical stance, or explicitly state the default.

  3.  **Drafting the Procedure (The "Bedside Algorithm"):**

      *   *Goal:* Clarity and safety.
      *   *Structure:* Flowchart style in text.
      *   *Step 1: Validity of Instrument.* Is it the right form? Signed? Witnessed?
      *   *Step 2: Trigger Conditions.* Did the specific scenario happen?
      *   *Step 3: Current Capacity.* This is the crux. Can they understand *now*?
      *   *Step 4: Mechanism Identification.* Is this a proxy decision or a direct instruction?
      *   *Step 5: The "Keyholder" Check.* Who has the power to override?
      *   *Step 6: The Symptomatic Refusal Flag.* If refusal looks like symptom, pause.
      *   *Step 7: Decision/Handoff.*

      *Refining the "Adversary/Irrevocability" point:* The procedure should treat the "Mandatory Adversary" as a specific *step* in the review process if that policy is adopted. If not, the Medical Director serves that function. I will design it to be modular here.

      *Refining the "Keyholder":* Every instrument must explicitly state: "To void this, X must do Y."

  4.  **Running the Cases:**

      *   *Case 1 (ECT):* Past refusal, current request. Competent now? If yes, current wish prevails (usually). If no, past refusal might stand *unless* life-saving. This tests the "binding" limit.
      *   *Case 2 (Admission):* Past consent, current refusal. Clear triggers. Tests the "involuntary" aspect.
      *   *Case 3 (Ambivalence):* Past capacity doubtful. Tests the "Validity" step.

  5.  **Drafting the Governance Analogy Section:**

      *   *Task:* Compare Psychiatric Advance Directives (PADs) to Constitutional Entrenchment.
      *   *Core Disanalogy:*
          1.  *Identity:* One person over time (PAD) vs. Different people over time (Constitution).
          2.  *Consent:* Patient consents to their own binding vs. Future citizens/dissenters did not consent to the founders' binding.
          3.  *Harm:* Physical/Mental health harm (PAD) vs. Political/Social harm (Constitution).
          4.  *Exit:* Clinical discharge/Recovery vs. Amendment/Revolution.
      *   *Conclusion:* The bedside procedure relies on *clinical recovery of capacity* as the release valve. Constitutions rely on *supermajority political will*. Transplanting the medical procedure to governance is dangerous because it assumes a "healthy state" of the polity that may not exist or be definable.

  6.  **Review and Refine:**

      *   *Check Constraints:* Did I name the keyholder? Yes. Did I address the symptomatic refusal? Yes. Is it under an hour? The steps look concise.
      *   *Tone Check:* Is it too academic? Need to make sure the "Bedside" section feels like a checklist.
      *   *Legal Caution:* Must emphasize that this is an *ethical* procedure, not legal advice, hence the Legal Counsel sign-off requirement in the prompt.
      *   *The "Adversary" Issue:* I need to make sure the procedure doesn't break if they choose the "Irrevocability" model. I will frame the "Review" step as requiring either an Adversary *or* a heightened Medical Director scrutiny depending on policy.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Case 1, if the patient is *currently competent* asking for ECT, a past refusal usually cannot bind them in most US jurisdictions. I need to make sure the procedure reflects that current capacity trumps past instruction *unless* specific statutory exceptions exist (which are rare for ECT). I will frame the procedure to prioritize current capacity assessment.
      *   *Correction:* On the Governance section, keep it tight. The prompt asks for a "page or so" and "ten minutes" explanation. Don't wander into Rawls or Jefferson. Stick to the structural disanalogy.

  8.  **Final Output Structure:**
      *   Introduction (Scope & Limitations).
      *   Part I: The Bedside Decision Procedure (The Checklist).
      *   Part II: Application to Case Studies.
      *   Part III: The Governance Analogy (Faculty Senate Memo).

  *(Self-Correction on "Keyholder"):* The prompt specifically asks the procedure to *require* naming the keyholder. I need to make that a specific step in the intake of the document, not just a theoretical point.

  *(Self-Correction on "Symptomatic Refusal"):* The prompt says "I do not believe that can be resolved by a rule, and I want the procedure to say so." I must include a "Stop & Consult" step here, not a decision rule.

