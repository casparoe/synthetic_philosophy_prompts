answer: |-
  **TO:** Clinical Staff, Medical Director, Legal Counsel
  **FROM:** Ethics Committee
  **SUBJECT:** Procedure for Evaluating Psychiatric Precommitment Instruments ("Ulysses Contracts")
  **DATE:** October 26, 2023

  ### PREAMBLE: SCOPE AND LIMITATIONS

  This procedure is an ethical decision aid, not a legal statute. It is designed for use at the bedside by crisis clinicians to determine whether to honor a precommitment instrument when a patient's current wishes conflict with their prior directives.

  **Two Non-Negotiable Constraints:**
  1.  **Current Capacity Trumps:** In this jurisdiction, a currently competent patient cannot be treated against their will based solely on a prior directive, except under specific involuntary hold statutes. This procedure assesses whether the prior directive is ethically binding *pending* legal review.
  2.  **The Symptomatic Refusal Limit:** Where a patient's refusal of treatment appears to be a direct symptom of the incapacity (e.g., anosognosia in psychosis), no algorithm can resolve the conflict. The procedure must identify this impasse and escalate it.

  **Policy Choice (Adversary vs. Irrevocability):**
  This procedure is compatible with either the "Mandatory Adversary" model or the "Strict Irrevocability" model.
  *   *If Adversary Policy is active:* Step 5 requires an appointed advocate to argue for the patient's current refusal.
  *   *If Irrevocability Policy is active:* Step 5 is skipped; the burden shifts entirely to proving the instrument is invalid.
  *   *Default:* Until the Board votes, this procedure assumes the **Medical Director** fulfills the Adversary function during sign-off.

  ---

  ### PART I: THE BEDSIDE DECISION PROCEDURE

  **Time Target:** < 60 Minutes
  **Operator:** Crisis Clinician (RN, Resident, or Attending)

  #### STEP 1: INSTRUMENT VALIDITY & MECHANISM
  **Question:** Is the document legally executed, and what *kind* of binding mechanism does it employ?
  **Action:** Inspect the signature block and the operative clauses.
  **Sufficient Answer:**
  *   **Valid:** Signed, witnessed, dated during a documented period of stability.
  *   **Mechanism Identified:** You must categorize the instrument into one of three types:
      1.  *Instructional:* "Do not give me Drug X." (Removes an option).
      2.  *Incentive:* "If I miss 3 appointments, I agree to be held." (Raises a cost).
      3.  *Proxy:* "Agent Y decides for me." (Transfers decision).
  **Termination:** If invalid or mechanism is unclear, **STOP.** Treat as standard involuntary/consent case. Hand off to Legal Counsel for template review.

  #### STEP 2: TRIGGER CONDITIONS
  **Question:** Have the specific clinical conditions specified in the instrument occurred?
  **Action:** Compare current presentation to the "When this applies" clause.
  **Sufficient Answer:** "Yes, the patient meets the specific criteria (e.g., 'GAF < 40', 'Psychotic features present', 'Suicidal ideation')."
  **Termination:** If triggers are not met, **STOP.** Honor current wishes. The contract is dormant.

  #### STEP 3: THE KEYHOLDER CLAUSE
  **Question:** Who holds the key to void this instrument, and what is the cost of exit?
  **Action:** Locate the "Revocation" or "Exit" clause. If none exists, insert the default statutory revocation method.
  **Sufficient Answer:** You must be able to state: "To void this, [Patient/Agent/Court] must [Sign form/Wait 72 hrs/Petition Judge]."
  **Requirement:** If the instrument does not name a Keyholder and an Exit Cost, it cannot be enforced under this procedure. Hand off to Legal Counsel.
  **Termination:** If Keyholder is identified but currently unavailable, proceed to Step 4 with caution.

  #### STEP 4: CURRENT DECISIONAL CAPACITY
  **Question:** Does the patient currently possess the capacity to consent to or refuse the specific treatment in question?
  **Action:** Perform standard capacity assessment (Understanding, Appreciation, Reasoning, Choice).
  **Sufficient Answer:**
  *   **Capable:** Patient understands risks/benefits and consequences of refusal *now*.
  *   **Incapable:** Patient cannot process information due to symptom severity.
  **Termination:**
  *   If **Capable**: **STOP.** Honor current refusal/request. (A competent self cannot be bound by a past self).
  *   If **Incapable**: Proceed to Step 5.

  #### STEP 5: THE SYMPTOMATIC REFUSAL FLAG
  **Question:** Is the patient's current refusal *itself* the primary symptom of the condition? (e.g., Paranoia preventing medication acceptance).
  **Action:** Clinical judgment. Consult treating psychiatrist.
  **Sufficient Answer:**
  *   **No:** Refusal is based on values/preferences consistent with prior self (e.g., religious objection).
  *   **Yes/Unsure:** Refusal appears driven by delusion, mania, or cognitive collapse.
  **Termination:**
  *   If **No**: Proceed to Step 6 (Honor Prior Directive).
  *   If **Yes/Unsure**: **HAND OFF.** This procedure cannot resolve this. This requires the **Medical Director** (for override) and **Ethics Consult** (for review). Do not proceed to treatment based solely on this form.

  #### STEP 6: AUTHORIZATION
  **Question:** Does enforcing the directive align with the "Least Restrictive Alternative" standard?
  **Action:** Verify no less intrusive method exists to satisfy the safety trigger.
  **Sufficient Answer:** "Yes, this is the minimum necessary intervention to satisfy the trigger conditions."
  **Termination:**
  *   **Authorize:** Clinician implements directive.
  *   **Override:** Medical Director signs override if clinical picture has changed materially since directive was signed.

  ---

  ### PART II: APPLICATION TO CASE STUDIES

  #### CASE 1: The ECT Request
  *Scenario:* Woman executed directive refusing ECT while well. Now in severe depression, requesting ECT. Arguably competent.
  *   **Step 1 (Validity):** Valid. Mechanism: Instructional (Removes option).
  *   **Step 2 (Triggers):** Met (Severe episode).
  *   **Step 3 (Keyholder):** Patient (via current capacity).
  *   **Step 4 (Capacity):** **Crucial.** If she is *arguably competent*, the assessment must lean toward preserving current autonomy. If she demonstrates understanding of risks/benefits of ECT *now*, she is Capable.
  *   **Decision:** **STOP at Step 4.** Honor current request. A Ulysses contract cannot bind a competent self to *refuse* life-improving treatment if the current self desires it, unless there is a specific statutory bar. The prior refusal is ethically voided by current competence.
  *   *Note:* If she is found *Incapable*, proceed to Step 5. If her request for ECT is manic/grandiose (Symptomatic), Hand Off to Medical Director. If her request is rational but prior refusal was firm, the Prior Directive likely stands as a proxy for her "true" values, but Legal Counsel must review statutory ECT consent laws.

  #### CASE 2: The Involuntary Admission
  *Scenario:* Man consented in advance to involuntary admission. Now refuses. Triggers unambiguous.
  *   **Step 1 (Validity):** Valid. Mechanism: Proxy/Incentive (Transfers decision/Raises cost).
  *   **Step 2 (Triggers):** Met.
  *   **Step 3 (Keyholder):** Clinician (authorized by contract to admit).
  *   **Step 4 (Capacity):** Incapable (implied by refusal despite clear danger/trigger).
  *   **Step 5 (Symptomatic):** Yes. Refusal is likely due to the condition necessitating admission.
  *   **Decision:** **HAND OFF at Step 5.** Even with a signed contract, admitting a screaming, refusing patient requires an override. The contract lowers the *ethical* barrier, but the *legal* barrier requires Medical Director sign-off. The procedure authorizes the *recommendation* to admit, but the Keyholder (Medical Director) must turn the key.

  #### CASE 3: The Ambivalent Signature
  *Scenario:* Directive signed during period of recorded ambivalence. Stability unclear.
  *   **Step 1 (Validity):** **FAIL.**
  *   **Action:** The record shows ambivalence at the time of signing.
  *   **Decision:** **STOP at Step 1.** An instrument signed during ambivalence lacks the "competent stability" required to bind a future self. It is not a Ulysses contract; it is a note of uncertainty. Treat as no directive exists. Hand off to Legal Counsel to revise template to require a "Statement of Stability" attestation by the signing psychiatrist.

  ---

  ### PART III: MEMORANDUM TO THE FACULTY SENATE
  **SUBJECT:** Applicability of Clinical Precommitment Procedures to Governance Entrenchment

  You have asked whether the bedside procedure for Ulysses contracts can govern the entrenchment clauses in our new governance charter (supermajority requirements, spending formulas, academic freedom protections).

  **Recommendation:** Do not transplant this procedure. The analogy is structurally unsound. While both mechanisms involve "binding the future," the ethical architecture of a patient differs fundamentally from that of a polity. Using the clinical model for governance risks legitimizing authoritarian stasis under the guise of "ethical consistency."

  **The Three Structural Disanalogies:**

  **1. Identity vs. Membership (The "Who" Problem)**
  *   *Clinical:* The patient is one biological entity across time. The "past self" and "future self" share the same brain, body, and ultimate interests. We presume a continuity of identity that makes precommitment an act of self-care.
  *   *Governance:* The University is a corporation of changing members. The faculty who sign the charter are not the faculty bound by it ten years later. The "dissenters" bound by the entrenchment clause (junior faculty, future hires, students) were never parties to the agreement.
  *   *Procedural Break:* Step 1 of the clinical procedure requires **Validity of Consent**. In governance, future stakeholders cannot consent to the charter. Therefore, the "Validity" check must change from "Did they sign it?" to "Is this clause procedurally just for non-signers?"

  **2. Recovery vs. Amendment (The "Exit" Problem)**
  *   *Clinical:* The release valve for a Ulysses contract is **clinical recovery**. The patient returns to capacity, and the contract dissolves. The "Keyholder" (Step 3) is often the patient's own returned competence.
  *   *Governance:* There is no "healthy state" of the university to which we return. There is only the political status quo. If we entrench a spending formula, the "Keyholder" is a supermajority vote.
  *   *Procedural Break:* Step 5 (Symptomatic Refusal) has no equivalent. In the clinic, we override refusal because the refusal is a *symptom*. In governance, dissent is not a symptom; it is political data. Treating political dissent as "symptomatic" (i.e., "they only want to change the charter because they are irrational/politicized") is dangerous. The procedure must remove the "Symptomatic Refusal" flag and replace it with a "Sunset Clause" review.

  **3. Harm vs. Policy (The "Stakes" Problem)**
  *   *Clinical:* The cost of failing to bind is physical harm or death. The presumption favors safety.
  *   *Governance:* The cost of failing to bind is policy drift. The presumption must favor flexibility.
  *   *Procedural Break:* Step 6 (Least Restrictive Alternative). In the clinic, we ask, "Is this the least invasive way to keep them alive?" In governance, you must ask, "Is this the least restrictive way to preserve institutional mission?"

  **Required Changes for Governance Procedure:**
  If you wish to draft a governance analog, you must alter three steps of the clinical procedure:
  1.  **Step 1 (Validity):** Add a requirement for **Intergenerational Impact Statement**. (How does this bind those who didn't sign?)
  2.  **Step 3 (Keyholder):** Remove the "Medical Director" equivalent. The Keyholder must be a **Supermajority + External Review**. (Internal actors cannot be the sole keyholders for their own constraints).
  3.  **Step 5 (Symptomatic Refusal):** **Delete.** Replace with **Periodic Re-ratification**. Entrenched clauses must expire unless reaffirmed by the current body.

  **Conclusion:**
  The clinical procedure works because we assume the patient's *interests* are constant, even if their *capacity* fluctuates. In the University, *interests* fluctuate legitimately. A procedure designed to protect a patient from themselves will protect a Charter from the people it is supposed to serve. Do not use the bedside algorithm for the Senate.
