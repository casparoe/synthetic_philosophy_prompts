answer: |-
  1. You have rigged the view by defining 'aesthetic value' so narrowly as immediate perception that any non-perceptual factor is excluded by definition rather than argument, making your position unfalsifiable. Any counter-example is dismissed as 'not aesthetic' by fiat, which protects the theory but empties it of substance.

  2. Nelson Goodman argues that for autographic arts like painting, the history of production constitutes the work itself, meaning a perfect forgery is aesthetically deficient because it misrepresents its own genesis. A defender would concede this counts against them only if they accept art is cognitive knowledge, otherwise they dismiss it as changing the subject.

  3. When the original is destroyed, the specific historical event of its creation vanishes, and while the copy affords identical sensory experience, the loss of that unique human achievement is a loss of artistic value. You should concede this counts against you unless you insist art is purely a consumer product rather than a human action.

  4. If two people independently paint the same image, they create distinct works because artistic value resides in the specific intention and problem-solving journey, not just the visual output. A defender would dismiss this as conflating biographical interest with aesthetic value, but it holds if art is viewed as communication rather than decoration.

  5. Arguments about market price or sentiment you can safely dismiss as changing the subject, but claims about constitutive history force you to either expand your definition of experience or admit your theory only covers decoration. Honestly, your view survives only if you refuse to acknowledge that knowing *how* a thing came to be is part of the experience of art.
