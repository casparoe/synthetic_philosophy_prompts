answer: |-
  The coffee mug slipped. It hit the counter, shattered, and splashed boiling liquid across the back of my left hand.

  My hand jerked away. Instantly. A clean, mechanical retraction, like a piston firing. I looked at the skin turning pink, then red. I registered the location, the intensity, the spread. *Hot. Liquid. Epidermis compromised.*

  Then I waited for the rest of it. The gasp, the throb of dread, the urgent, screaming *wrongness* that tells you something is violating your existence.

  Nothing came.

  I walked to the sink and ran cold water over the burn. It felt like wetness. It felt like pressure. It did not feel like *bad*. I dried my hand, swept up the ceramic, and went back to my code. The burn blistered later. I watched it form with the same interest I'd give a rising loaf of bread.

  My condition doesn't have a catchy name on the insurance forms. They call it "Selective Affective Analgesia," which is a fancy way of saying my hardware works but my software doesn't log the errors. I feel pain. I avoid pain. If you put a flame to my arm, I pull away. But I don't suffer. I don't mind. Pain is just data, like a server rack humming too loud. You fix it because it's inefficient, not because it hurts your feelings.

  So when the clinic called about the trial, I almost deleted the email as spam.

  "Valence Restoration," the brochure said. *Reconnect with the full spectrum of human experience.*

  Mark sat across from me at the kitchen table, the pamphlet spread between us like a map to a country neither of us wanted to visit. He's a graphic designer; he deals in feelings for a living. He looks at me sometimes like I'm a rendering that didn't quite load.

  "You should at least talk to them," he said. His voice was tight. He hates when I get hurt, even though I never complain. I think that's the thing he hates most.

  "I'm not hurt, Mark. I'm intact."

  "You burned yourself yesterday."

  "I withdrew my hand. No damage to the muscle. Skin will heal."

  "You didn't even swear, Elena."

  "Swearing is inefficient."

  He rubbed his face. "It's not about efficiency. It's about... connection. If you can't feel how bad pain is, how do you know how good anything else is?"

  "That's a logical fallacy. Pleasure and pain are distinct pathways."

  "Are they?" He tapped the brochure. "They're calling it valence. Positive and negative. If you're missing the negative, maybe you're just... flat."

  I looked at the pill bottle pictured on the front. Small, white, unassuming. It promised to turn the volume back on. To make the bad feel bad again.

  "I'll think about it," I said.

  I didn't tell him I was afraid. Not of the pain. But of the noise. My life is quiet. Clean signals. If I take this, I introduce static.

  ***

  The realization didn't happen in the clinic. It happened on a Tuesday, over pasta.

  Mark had made carbonara. He's good at it. The sauce was creamy, the guanciale crisp, the cheese sharp. Usually, I would say I liked it. I would say it tasted good. But sitting there, fork hovering halfway to my mouth, I stopped.

  I needed to verify the data.

  I took a bite. I chewed. I swallowed.

  I analyzed the sensory input. Salt. Fat. Heat. Texture. These were the discriminative properties. I could identify them perfectly. But where was the reward? Where was the little spike of dopamine that says *this is valuable*?

  There wasn't one. There was just the absence of hunger.

  I put the fork down.

  "What's wrong?" Mark asked. "Is it too salty?"

  "No. It's perfect."

  "Then why did you stop?"

  "I'm trying to figure out if I enjoy this," I said.

  Mark froze, his own fork halfway to his mouth. "You're trying to figure out if you enjoy dinner?"

  "Yes. I know I'm not in pain. I know the food isn't burning my tongue. But I don't know if I'm feeling *pleasure*." I looked at him. "Mark, when you eat this, what does it feel like?"

  "It tastes good. It makes me happy."

  "Define happy."

  He put the fork down. The clatter was loud in the quiet kitchen. "It's... it's a warmth. It's wanting more. It's feeling like things are okay."

  "Things are okay right now," I said. "I am not in pain. The room is temperature controlled. I am not hungry."

  "That's not the same thing."

  "Isn't it?" I leaned forward. "Think about the axis. Zero is neutral. Positive is pleasure. Negative is pain. I thought I was living in the positive because I wasn't in the negative. But what if I'm just stuck at zero?"

  I looked at the pasta again. It was just fuel. It was chemical input. I had assumed that the relief of not suffering was the same as the presence of joy. But relief is just the absence of pain. If I never feel the pain, do I ever feel the relief?

  "I feel like I'm watching myself eat," I said. "I know the code is running. I just can't see the output."

  Mark looked at me, and I saw it in his eyes. Not pity. Fear.

  "That's why you need the treatment," he whispered.

  "Or," I said, "that's how everyone lives. Maybe you're all just hallucinating value where there isn't any. Maybe you're the ones adding the extra layer."

  "Don't do that," he said. "Don't make me feel like my joy is a glitch."

  "It's a hypothesis."

  "It's loneliness, Elena. That's what it is."

  ***

  The bonus scene, the one that stuck in my throat like a pill I hadn't swallowed, happened three days later.

  Mark cut himself shaving. A deep nick on the jawline. Blood welled up, bright and fast. He hissed, clutching his face, eyes watering. He looked at me, expecting the reflex—the rush, the concern, the mirrored distress.

  I walked over and handed him a tissue.

  "Apply pressure," I said. "It's a superficial vein. It will clot in two minutes."

  He stared at me, blood soaking the tissue. "Are you serious?"

  "I am being helpful."

  "You don't care," he said. His voice wasn't angry. It was hollow. "I could be dying here, and you'd hand me a manual."

  "You aren't dying. I assessed the wound."

  "It's not about the wound!" He stood up, pressing the tissue to his jaw. "It's about the fact that I'm hurting, and you don't care."

  "I care about your wellbeing. I want you to stop bleeding."

  "No, you want the problem solved. You don't mind that I'm in pain."

  He walked out of the bathroom. I stayed there, looking at the sink. He was right, technically. I didn't mind. But was that a failure? Or was it efficiency?

  I followed him to the bedroom. He was sitting on the edge of the bed, still pressing the tissue. He looked small.

  "I'm sorry," I said.

  "For what?"

  "For not suffering with you."

  He looked up. "That's not something you can apologize for. That's just... who you are."

  "Is it?" I asked. "Or is it something missing?"

  He didn't answer. He just looked at the blood on his hand. I realized then that my calmness wasn't comforting him. It was isolating him. My peace was a wall. He needed me to feel the weight of his injury to know that I valued him. My lack of suffering looked like a lack of love.

  But I did love him. I just loved him quietly. Without the spike. Without the valence.

  ***

  The pill sits on my nightstand now.

  It's small. White. It looks like any other generic anti-inflammatory, but it's not. It's a key. It promises to lock the negative back into the positive. To make the axis spin again.

  If I take it, the next time I burn my hand, it will hurt. Really hurt. I will cry. I will feel the violation. I will understand Mark's face when he cuts himself.

  But if I take it, will the pasta taste better? Or will it just taste like less nothing?

  If pain and pleasure are two ends of the same stick, and I've been holding the middle, grabbing one end means I have to accept the other. I can't have the joy without the capacity for the agony. They are coupled systems. You don't get to patch the kernel for suffering without opening the port for dread.

  I pick up the bottle. It rattles.

  I think about the burn on my hand. It healed yesterday. There's a scar, a small patch of shiny skin. I run my thumb over it. I feel the texture. Rough. Smooth.

  I don't feel the history of it. I don't feel the lesson.

  Mark is asleep in the other room. He thinks I'm broken. He thinks this pill fixes me. He thinks that without the ability to suffer, I am less than human.

  But I wonder if he's the one trapped. He is ruled by the axis. He chases the high, flees the low. He is a puppet of valence. I am just... here.

  Is freedom the ability to feel everything? Or is it the ability to feel nothing and still function?

  I unscrew the cap. The smell of chemicals drifts out. Sterile. Potential.

  I pour one into my palm. It looks heavy, though it weighs nothing.

  If I take it, I will join them. I will understand the drama. I will understand why a song can make you cry, why a meal can make you weep with gratitude. I will understand the weight Mark carries.

  But I will also lose the quiet. The clean, flat quiet where nothing is bad and nothing is good, and everything just *is*.

  I look at the glass of water on the table.

  I don't know if I'm missing out, or if I'm the only one who isn't. I don't know if joy is real, or if it's just the relief of pain temporarily paused. If I take this, and I feel joy, how will I know it's not just the absence of a new kind of pain?

  The uncertainty is the only thing that feels real.

  I hold the pill over the glass. My hand is steady. There is no tremor of fear. There is no surge of hope. There is just the hand, the pill, the water.

  I wait.

  The clock on the wall ticks. Second by second. Neutral.

  I don't drop it. I don't lift it to my mouth. I just sit there, holding the possibility of weight in my hand, wondering if gravity is a gift or a cage.

  The water ripples slightly, settling back to still.

  I keep waiting.
