  **To:** Research Ethics Board
  **From:** Undergraduate Member
  **Re:** Protocol Review — Linguistic Relativity and Spatial Memory

  **Recommendation:** Approve with Conditions

  **Reasoning:**
  While the REB typically avoids methodological peer review, scientific validity is an ethical requirement; a design that cannot distinguish its primary variables risks wasting participants' time and exposing them to procedures without potential benefit. My concern is that without controlling for verbal rehearsal, the study cannot substantiate its claim of "restructured thought," rendering the participants' contribution potentially futile. However, any mitigation must be feasible within the researcher's constraints.

  **Researcher's Strongest Point:**
  Her strongest argument is the logistical impossibility of adding a full control arm before the term-end deadline, coupled with the valid theoretical concern that verbal-interference tasks introduce distinct cognitive loads that could confound results as much as they control them.

  **Proposed Condition:**
  To address the validity concern without requiring a new experimental arm, the protocol must include a mandatory post-experimental questionnaire item asking participants to self-report whether they used verbal strategies (e.g., silently naming directions) during the memory task. This allows for post-hoc data segmentation to account for the confound.

  Verdict: Approve with Conditions Approval is contingent on the inclusion of a post-experimental questionnaire item asking participants to self-report whether they used verbal strategies during the memory task.
