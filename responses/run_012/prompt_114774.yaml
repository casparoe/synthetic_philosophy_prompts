answer: |-
  Here is the exam material you requested, followed by a brief note on the mathematical setup.

  ### Part 1: The Exam Question

  **Final Exam: Decisions, Bad and Otherwise**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider the following game. You toss a fair coin repeatedly until it lands Heads for the first time. Let $n$ be the toss number where Heads first appears (so $n=1$ if Heads comes immediately, $n=2$ if Tails then Heads, etc.).

  The payoff depends on $n$:
  *   If $n=1$, you win $\$2$.
  *   If $n=2$, you lose $\$2$.
  *   If $n=3$, you win $\$8/3$.
  *   If $n=4$, you lose $\$4$.
  *   In general, the payoff is $(-1)^{n+1} \times \frac{2^n}{n}$ dollars.

  A student argues: "The probability of stopping at toss $n$ is $1/2^n$. If we multiply probability by payoff, the $2^n$ terms cancel out. We get the series $1 - 1/2 + 1/3 - 1/4 \dots$, which equals $\ln(2) \approx 0.69$. Therefore, the Expected Value is 69 cents, and I should pay up to 69 cents to play."

  Write an essay responding to this student. In your answer, you must address:
  1.  Whether the calculation of 69 cents is mathematically robust, given that the series involved is *conditionally* convergent.
  2.  Whether it matters that the player only gets to play this game **once** in their life.
  3.  Whether my colleague the mathematician is right to refuse to assign *any* value to games where the absolute sum of payoffs diverges.

  *(20 Marks)*

  ***

  ### Part 2: Model Answer

  *(Read aloud to class)*

  The student's calculation is seductive, but it rests on a mathematical fragility that makes it useless for decision-making. While it is true that the alternating harmonic series sums to $\ln(2)$, this series is only *conditionally* convergent. This means the sum of the positive terms diverges to infinity, and the sum of the negative terms diverges to negative infinity.

  In standard probability theory, an Expected Value is only well-defined if the expectation is *absolutely* convergent—meaning the sum of the absolute values of the payoffs must be finite. Here, if we ignore the signs, we get the harmonic series ($1 + 1/2 + 1/3 \dots$), which diverges. Because it is not absolutely convergent, the Riemann Rearrangement Theorem applies: by simply reordering the outcomes (perhaps grouping two losses for every win), we could make the expected value sum to any number we like, or diverge entirely. The "69 cents" is an artifact of the specific order we chose to add the numbers, not an intrinsic property of the game.

  This leads directly to the colleague's rule. Technically, the mathematician is correct. In measure-theoretic probability, if $E[|X|] = \infty$, then $E[X]$ is undefined. To declare a value here is to invite contradiction. However, declaring it "undefined" is a mathematical safety valve, not a decision-making guide. A human being still has to decide whether to play. Refusing to compare the game to anything leaves the agent paralyzed. A more useful approach is to abandon raw monetary expectation and use Expected *Utility*. If the player has a bounded utility function (like logarithmic utility of wealth), the series might converge absolutely in utility terms even if it diverges in dollar terms. The mathematician's rule protects the math, but it doesn't solve the choice.

  Finally, does the "one play" constraint matter? Yes, profoundly. Expected Value is fundamentally a long-run frequency concept; it relies on the Law of Large Numbers to stabilize the average. In a single-play scenario, the "average" never materializes. You either win $\$2$, lose $\$2$, or hit some other specific outcome. You never receive 69 cents. When the variance is infinite (as it is here), the long-run average doesn't stabilize even with repeated plays. In a one-off decision, the distribution of outcomes matters more than the mean. A rational agent should care about the risk of ruin (the potentially massive losses) rather than a phantom average that relies on infinite repetition to manifest.

  In conclusion, the student's 69 cents is a mathematical illusion. The game has no stable expected value. The mathematician is technically right to call it undefined, but practically, we must evaluate the game through utility and risk tolerance, not raw dollar expectation, especially when we only live once.

  ***

  ### Part 3: Marking Scheme

  **Total: 20 Marks**

  **1. The Mathematical Flaw (Conditional vs. Absolute)**
  *   **B Level (3 marks):** Identifies that the series is conditionally convergent and mentions that reordering changes the sum.
  *   **A Level (5 marks):** Explicitly identifies that the *absolute* series (Harmonic) diverges. Explains that Expected Value requires absolute convergence to be well-defined. Connects the reordering problem to the definition of probability space (outcomes aren't naturally ordered).

  **2. The "One Play" Constraint**
  *   **B Level (3 marks):** States that you don't get the average in one play; you get one specific outcome.
  *   **A Level (5 marks):** Explains that Expected Value relies on the Law of Large Numbers (long-run). Notes that with infinite variance/undefined expectation, the average *never* stabilizes, even in the long run, making EV doubly irrelevant for a single case.

  **3. Critiquing the Mathematician's Rule**
  *   **B Level (3 marks):** Takes a side (either "he is right" or "he is wrong") with a basic justification.
  *   **A Level (4 marks):** Nuanced critique. Acknowledges the rule is mathematically standard (prevents contradictions) but practically limiting. Suggests an alternative framework (e.g., Expected Utility or bounded utility) to resolve the decision without breaking the math.

  **Total: 20 Marks**

  ***

  ### A Note on Your Setup

  You haven't got anything wrong in the setup; in fact, you've stumbled onto a variation of the **St. Petersburg Paradox** mixed with the **Riemann Rearrangement Theorem**. It's a legitimate and nasty little problem.

  However, here are two warnings for when you grade these:

  1.  **The "Undefined" Concept:** First-year students often treat "undefined" as "we don't know the answer yet." You need to reward students who understand "undefined" means "the question itself is malformed." The A-level distinction in the marking scheme tries to capture this.
  2.  **Utility Functions:** A clever student might argue that money isn't utility. If a student brings up **Expected Utility Theory** (e.g., "If I value money logarithmically, the series converges absolutely"), that is an A+ move. I included it in the model answer, but if a student invents it on their own, give them bonus credit in your heart, even if the scheme is full.
  3.  **The Payoff Growth:** Just to be sure you sleep well: The payoff grows as $2^n$. The probability shrinks as $1/2^n$. They cancel to $1/n$. This is correct. If the payoff grew faster (like $2^n$), the terms wouldn't even go to zero, and the series would diverge trivially. You have constructed the "Goldilocks" zone where it *looks* like it converges, but doesn't absolutely. It's a solid trap.

  Good luck with the finals. It sounds like a fascinating class.
