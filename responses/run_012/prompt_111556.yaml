  Saying "a reason to want" identifies the position that the consequence-given consideration is a reason for a different attitude rather than for the attitude in question; saying "deny it is a reason" moves you to Question 3.

  3. Do we exclude these benefits from counting as reasons simply because they do not make the object worthy of the attitude?
  Answering "yes" identifies the position that the phrase wrong kind of reason names whatever the analysis cannot accommodate and therefore leaves the analysis circular; answering "no" identifies the position that the fitting-attitude analysis should simply be restricted to object-given reasons, at the cost of needing an independent account of worthiness.

  4. If pragmatic benefits are reasons to believe, does this show that value cannot be defined as what merits such attitudes?
  Answering "yes" identifies the position that abandons the analysis of value in terms of fitting attitudes altogether; answering "no" moves you to Question 5.

  5. Must we then accept that an object is valuable whenever there are pragmatic reasons to favor it, even if it lacks merit?
