prompt: |-
  OK so I keep getting into this argument and I want an actual comparison, not a textbook summary I could get anywhere. Take two ways of dealing with vagueness. First, epistemicism: predicates like 'heap', 'tall', 'bald' really do have sharp cutoffs, there is a fact of the matter in every borderline case, and the only strange thing is that we can never know where the cutoff falls. Second, supervaluationism: borderline cases are genuinely truth-valueless, a sentence counts as true if it comes out true on every admissible way of making the predicate precise, and we rescue classical logic at the level of 'super-truth' instead of pretending there's a hidden fact of the matter. I get the standard contrast, so skip that. I want the stuff that actually seperates them.

  A few specific things I keep chewing on:

  1. A friend insists they're notational variants: both say there's no sharp boundary you can ever put your finger on, one just dresses that up as ignorance while the other calls it a truth-value gap, and nothing observable differs. Is he right? If not, whats the sharpest case where they genuinely disagree about the answer to some question, as opposed to disagreeing about how to describe the same answer?

  2. Heres my test. Imagine an oracle that answers any yes/no question about the world with perfect accuracy, including ones nobody could ever settle. Ask it whether some particular borderline heap is a heap. Under epistemicism it just says yes or no and we're the ones in the dark. Under supervaluationism, what does it even say -- the question has no truth value, so is the oracle stumped, or is 'is it a heap?' simply not the kind of thing that has an answer at all? Does that distinction do real work, or am I confused about what supervaluationism is committed to?

  3. Higher-order vagueness. I've heard supervaluationism has a genuinely hard time here -- that on the usual semantics the higher orders of 'definitely' collapse or go strange -- while epistemicism just shrugs and says every order is another unknowable boundary. Fair scorecard? Which one handles 'definitely definitely' better, and does it matter for anything?

  4. The one I actually care about. They seem to agree the sorites is unsound and that the trouble is with the tolerance/induction premise. Given that, is the disagreement really about vagueness at all, or is it about what you're allowed to say about borderline cases once you've already agreed on everything else? Tell me which view you think is more defensible and where the other one is definately wrong, not just differently worded.
