answer: |-
  Your friend is wrong. They are not notational variants. They are metaphysical rivals making incompatible claims about the structure of reality and truth. The disagreement isn't just about how to describe our ignorance; it's about whether there is something *to* know.

  Here is the breakdown of the friction points you're chewing on.

  ### 1. The "Notational Variants" Objection
  Your friend claims the observable output is identical: in both views, you can't point to the boundary. Therefore, the difference is merely verbal.

  **The Counter:** The difference is in the **logic of truth**, not just the phenomenology of ignorance.
  Epistemicism accepts the principle of **Bivalence**: every declarative sentence is either True or False. Supervaluationism explicitly rejects Bivalence to save the intuition that there is "no fact of the matter."

  **The Sharp Case:** Consider the sentence: *"This specific grain addition made the difference between a non-heap and a heap."*
  *   **Epistemicism:** This sentence is **True** (for exactly one grain addition in the history of the universe). It is a fact. We just can't know which one.
  *   **Supervaluationism:** This sentence is **False** (or truth-valueless). On every admissible precisification, there is a cutoff, but *which* grain constitutes the cutoff varies across precisifications. Therefore, there is no single grain that *the* cutoff.

  **Why this matters:** If your friend is right, then the sentence "There is a specific grain that turns a non-heap into a heap" should have the same truth status in both theories. It doesn't. Epistemicism says it's true. Supervaluationism says it's false (because it's not true on all precisifications). This isn't notation; it's a disagreement about the existence of a specific metaphysical fact.

  ### 2. The Oracle Test
  This is the strongest thought experiment to separate them. You need to define the Oracle carefully. Let's define the Oracle as an entity that knows the **complete physical and semantic state of the world**.

  *   **Epistemicism:** The Oracle answers **"Yes"** (or "No").
      *   *Why:* The fact exists in the world. The meaning of 'heap' plus the physical arrangement of grains determines a truth value. Our ignorance is a limitation of *us*, not the world. The Oracle, having no such limitation, sees the fact.
  *   **Supervaluationism:** The Oracle answers **"There is no truth to be known."**
      *   *Why:* Truth is defined relative to precisifications. Since no single precisification is privileged as "the meaning," there is no singular fact for the Oracle to know. If the Oracle said "Yes," it would be privileging one precisification over others, which violates the theory's core commitment that meaning is indeterminate.

  **Does this do real work?** Yes. It tests whether vagueness is **ontic/semantic** (Supervaluationism: the world/meaning isn't sharp) or **purely epistemic** (Epistemicism: the world/meaning is sharp, we are blind). If you believe an omniscient being *could* know the cutoff, you are an epistemicist. If you believe an omniscient being would *still* say the question is defective, you are a supervaluationist.

  ### 3. Higher-Order Vagueness
  You heard correctly. This is the technical kill zone for Supervaluationism.

  **The Problem:** Vagueness seems to infect the borderline itself. It's not just that we don't know if it's a heap; we don't know if it's *definitely* a heap or *borderline*. There should be no sharp line between "definitely heap" and "borderline heap."

  *   **Epistemicism:** Shrugs. There is a sharp line between 'definitely heap' and 'borderline'. It is just as unknowable as the first line. There are boundaries all the way down. It's ugly, but consistent.
  *   **Supervaluationism:** Struggles. Standard supervaluationism defines 'Definitely P' ($DP$) as "P is true on all admissible precisifications."
      *   *The Collapse:* The set of "admissible precisifications" is usually treated as a **crisp set**. Either a precisification is admissible or it isn't. This creates a sharp boundary between the admissible and the inadmissible.
      *   *The Consequence:* This implies there is a sharp cutoff for 'Definitely'. You end up with a logic where "It is definitely the case that this is borderline" comes out false, because the boundary of 'definitely' is precise.
      *   *The Fix:* To fix this, supervaluationists need "fuzzy supervaluationism" (degrees of admissibility), which complicates the semantics massively and often loses the classical logic preservation that made the view attractive in the first place.

  **Scorecard:** Epistemicism handles higher-order vagueness effortlessly (by accepting sharp boundaries at every level). Supervaluationism requires complex, often ad-hoc machinery to avoid the same result.

  ### 4. The Core Disagreement & Defensibility
  You asked where the disagreement actually lies and which is more defensible.

  **The Disagreement:** It is not about the Sorites conclusion (both reject it). It is about the **diagnosis of the error** in the Induction Premise (*If $n$ grains is a heap, $n+1$ is a heap*).
  *   **Epistemicism:** The premise is **False**. There is a specific $n$ where the antecedent is true and the consequent is false.
  *   **Supervaluationism:** The premise is **Not True** (or truth-valueless). It fails because there are precisifications where the antecedent is true and the consequent is false, so it's not super-true.

  **Which is more defensible?**
  I argue **Epistemicism** is the more robust theoretical framework, despite being intuitively repulsive.

  **Why Epistemicism Wins:**
  1.  **Logic:** It preserves classical logic without caveats. Supervaluationism preserves classical *validities* but breaks classical *rules of inference* (like Conditional Proof) in contexts involving the 'Definitely' operator. Epistemicism keeps the engine running smoothly.
  2.  **Higher-Order Vagueness:** As noted above, Epistemicism doesn't break when you iterate 'definitely'. Supervaluationism requires a semantic overhaul to handle it.
  3.  **Metaphysical Parsimony:** Epistemicism doesn't require "truth-value gaps" or "super-truth." It uses standard truth. Supervaluationism introduces a new semantic layer (precisifications) that needs its own justification.

  **Where Epistemicism is Definitely Wrong (or costly):**
  It violates the **Meaning-Use Connection**. We learn words like 'heap' through usage and training. There is no evidence in our linguistic training that could possibly fix a sharp boundary at grain #4,352. Epistemicists (like Williamson) argue that usage *does* fix it, via complex causal relations we can't access. This feels like magic. Supervaluationism respects the intuition that our usage simply *doesn't* determine that level of detail.

  **Where Supervaluationism is Definitely Wrong:**
  It forces you to accept that $P \lor \neg P$ is true, but neither $P$ nor $\neg P$ is true. While logically consistent within the system, this is a hard pill to swallow for a theory of truth. It makes truth a property of sets of models rather than a relation between language and the world.

  **Final Verdict:**
  If you care about **logic and metaphysics**, Epistemicism is superior. It treats vagueness as a limit of knowledge, which is a standard scientific move.
  If you care about **phenomenology and semantics**, Supervaluationism is superior. It respects the feeling that the world itself is fuzzy.

  However, since your friend claimed they are notational variants: **They are wrong.** The Oracle test proves it. If you think the Oracle *could* know the answer, you are an Epistemicist. If you think the Oracle would say the question is meaningless, you are a Supervaluationist. That is a real, substantive disagreement about the nature of truth.
