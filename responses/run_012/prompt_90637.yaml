      *   *Correction on LEM:* Supervaluationism says $P \lor \neg P$ is super-true. But it denies that truth is exhaustive. The friend is wrong because one posits a hidden reality, the other posits a lack of reality.
      *   *Section 2 (Oracle):* This is the "God's Eye View." Epistemicism: Oracle knows the fact. Supervaluationism: Oracle knows there is no fact. The Oracle reveals the metaphysical commitment.
      *   *Section 3 (Higher-Order):* Supervaluationism has the "sharp meta-boundary" problem. Epistemicism accepts it. This is a major technical win for Epistemicism.
