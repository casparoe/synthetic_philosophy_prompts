answer: |-
  You have put your finger on one of the most persistent and uncomfortable problems in rational choice theory and normative ethics. You are correct that this is distinct from the Sorites paradox, and you are correct that it is not merely a case of incomparability.

  There is no single, universally agreed-upon noun for this phenomenon (like "Sorites"), but there is a tight cluster of terms that refer to the different facets of what you are describing.

  Here is the breakdown of the names, what they name, and how they relate to the distinctions you are drawing.

  ### 1. The Argument Form: **The Spectrum Argument** (or Continuum Argument)

  This is the name for the *structure* of the reasoning you described. A Spectrum Argument proceeds by establishing a sequence of cases $A_1, A_2, \dots A_n$ where:
  1.  Each adjacent pair differs only slightly (the "small step").
  2.  For each adjacent pair, $A_i$ is clearly better than $A_{i+1}$ (or vice versa).
  3.  Yet, $A_1$ is clearly better than $A_n$ (the intuition at the endpoints contradicts the chain).

  **What it names:** It names the rhetorical and logical move of sliding along a continuum to force a counterintuitive conclusion or to expose a contradiction in our judgments.
  **Relation to Sorites:** You are right to distinguish them. The Sorites relies on **vagueness** (the predicate "is a heap" lacks a sharp boundary). The Spectrum Argument relies on **clear pairwise preferences** that violate **transitivity**. In Sorites, you are unsure about the middle cases. In your apartment/charity cases, you are *sure* about every step, which makes the contradiction more violent.

  ### 2. The Logical Property: **Intransitivity of "Better Than"**

  This is the name for the *underlying claim* that your reasoning forces you to confront. Standard rationality assumes the relation "all things considered better than" is transitive: if $A \succ B$ and $B \succ C$, then $A \succ C$.

  Your chain implies: $A \succ B \succ C \dots \succ Z$, but also $A \succ Z$ (based on your direct comparison of the endpoints). If you accept the chain but reject the conclusion ($Z \succ A$), you are asserting that "better than" is **intransitive**.

  **Who holds this view:** Most decision theorists say this is impossible (it implies irrationality). However, prominent ethicists like **Larry Temkin** (in *Rethinking the Good*) and **Stuart Rachels** argue that "better than" is genuinely intransitive in certain moral contexts. They argue that the "small improvement" argument shows that transitivity is not a necessary feature of value.

  ### 3. The Decision Theory Diagnosis: **The Money Pump**

  In the context of your apartment example (prudent choice), this pattern is the setup for a **Money Pump Argument**.

  **What it names:** This is the *diagnosis* that your preferences are broken. If you truly prefer $A$ to $B$, $B$ to $C$, and $C$ to $A$ (which is where your chain leads if you close the loop), an agent could exploit you. They could trade you $A$ for $B$ (for a penny), $B$ for $C$ (for a penny), and $C$ back to $A$ (for a penny). You would end up with your original apartment but less money, and you would willingly repeat this forever.

  **The Upshot:** In decision theory, this is considered a *reductio ad absurdum* of your preferences. The standard conclusion is not that the world allows cycles, but that **you are irrational**. You *must* find the break in the chain. The "Money Pump" is the pragmatic proof that intransitive preferences are unsustainable for an agent.

  ### 4. The Ethical Diagnosis: **The Repugnant Conclusion**

  Your charity example is a specific instance of a famous problem in population ethics formulated by **Derek Parfit**.

  **What it names:** This is the *specific endpoint* of the spectrum in moral philosophy. Parfit asked: Is it better to have a population of 1 billion people with very high quality of life, or a massive population where everyone has a life barely worth living? Total Utilitarianism often forces you to say the latter (the "Repugnant Conclusion").

  **Relation to your chain:** Your chain (one life saved vs. millions of tiny benefits) is a variant often called the **Spectrum Argument against Utilitarianism** or the **Problem of Aggregation**. It asks: Can enough small benefits outweigh a catastrophic loss?
  *   If you say "Yes" at every step, you accept the Repugnant Conclusion.
  *   If you say "No" at the end, you must identify a specific step where the trade-off stops making sense (a **Lexical Threshold**).

  ### 5. Distinguishing from Incomparability

  You mentioned you don't think this is about incomparability, and you are largely right, but there is a nuanced view here associated with **Ruth Chang**.

  *   **Your view:** $A$ is better than $B$. (Strict preference).
  *   **Incomparability:** Neither $A$ is better than $B$, nor $B$ better than $A$, nor are they equal.
  *   **Chang's View (Parity):** There is a fourth relation called "parity." $A$ and $B$ are comparable, but not by "better than." They are "on a par."

  Some philosophers argue that your sensation of "clearly better" in the small steps is an illusion. They argue that at some point, the trade-off becomes a **Hard Choice** where the options are "on a par." If you admit parity, the chain breaks, because "on a par" is not transitive in the same way "better than" is. However, since you insist you *do* feel a strict preference, you are sitting firmly in the **Intransitivity** camp, not the Incomparability camp.

  ### Summary of Terms and Boundaries

  | Term | What it Names | Domain | Verdict on your Preferences |
  | :--- | :--- | :--- | :--- |
  | **Spectrum Argument** | The *form* of the reasoning (small steps, big shift). | Logic / Ethics | Neutral (describes the move). |
  | **Intransitivity** | The *logical property* of your "better than" relation. | Value Theory | Descriptive (this is what you have). |
  | **Money Pump** | The *pragmatic consequence* of intransitivity. | Decision Theory | Normative (you are irrational/exploitable). |
  | **Repugnant Conclusion** | The *specific moral outcome* of the charity chain. | Population Ethics | Normative (this outcome is unacceptable). |
  | **Lexical Threshold** | The proposed *solution* (some values trump others absolutely). | Ethics / Economics | Prescriptive (you should insert a break). |

  ### The Upshot: How Philosophers Resolve It

  If you bring this to a seminar, you will find three main camps:

  1.  **The Transitivity Defenders (Standard Economics/Decision Theory):**
      *   **Claim:** "Better than" *must* be transitive.
      *   **Diagnosis:** You are mistaken about at least one link in the chain. Your intuition is failing you on the small steps because you aren't accounting for the cumulative effect.
      *   **Solution:** You need to construct a utility function that penalizes the commute heavily enough that the chain breaks early. You must find the step where the trade is *not* worth it.

  2.  **The Intransitivists (Temkin, Rachels):**
      *   **Claim:** "Better than" is sometimes intransitive.
      *   **Diagnosis:** Your preferences are fine; logic is just messier than we thought. Small differences can accumulate to reverse a value judgment without any single step being a "borderline" case.
      *   **Solution:** Accept that rationality does not require transitivity in all cases. (This is a minority view because it opens the door to Money Pumps).

  3.  **The Lexicalists (Parfit, Griffin):**
      *   **Claim:** There are **thresholds**.
      *   **Diagnosis:** The error is assuming all values are trade-offable (commensurable).
      *   **Solution:** At some point, "commute time" becomes lexical. No amount of closet space is worth *more* than 60 minutes of commute. The chain must break because the nature of the value changes qualitatively, not just quantitatively.

  ### Recommendation

  If you want to read the primary source that matches your exact intuition (that the steps are clear but the end is wrong), look for **Stuart Rachels' "Counterexamples to the Transitivity of Better Than"** or **Larry Temkin's *Rethinking the Good***.

  If you want the decision-theoretic hammer, look for **Money Pump Arguments** (often associated with **David Dutch** or **Frank Ramsey**).

  If you want the ethical version, look for **Parfit's *Reasons and Persons*** (specifically the chapter on the Repugnant Conclusion) and the literature on **The Problem of Aggregation**.

  You are describing the **Spectrum Argument** leading to **Intransitive Preferences**, which in decision theory makes you vulnerable to a **Money Pump**, and in ethics leads to the **Repugnant Conclusion**. The tension you feel is the friction between our intuitive, local processing of value and the global requirement of logical consistency.
