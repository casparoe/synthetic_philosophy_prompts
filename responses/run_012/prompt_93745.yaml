answer: |-
  # Specification Document: Theory of Emotion (v1.0)

  **Status:** Draft for Review  
  **Audience:** Philosophical Psychology / Affective Neuroscience  
  **Constraint:** British English  

  Before you commit to a framework, you need to know what the job entails. Below are the desiderata. A theory that fails any one of these is, strictly speaking, incomplete. A theory that fails three is dead.

  ### 1. The Intentionality Constraint
  **The Requirement:** The theory must distinguish between *object-directed emotions* (fear *of* the dog) and *objectless moods* (free-floating anxiety).
  **The Consideration:** Emotions typically have content; they are *about* something. Moods colour the whole world without targeting a specific feature. If your theory treats all affect as a brute physiological surge, you cannot explain why I am angry *at you* rather than simply agitated. If it treats all affect as a complex judgment, you struggle to explain why I can wake up gloomy without knowing why.

  ### 2. The Recalcitrance Constraint
  **The Requirement:** The theory must account for cases where emotion persists despite contradictory belief (e.g., fearing a spider you know is harmless).
  **The Consideration:** This is the graveyard of pure cognitivism. If emotion is simply a judgment that "X is dangerous," then judging "X is safe" should extinguish the emotion. It does not. The theory must explain how the affective system can operate independently of, or in conflict with, the doxastic (belief) system.

  ### 3. The Phylogenetic Continuity Constraint
  **The Requirement:** The theory must accommodate affect in non-human animals (rats, fish) without resorting to magical anthropomorphism.
  **The Consideration:** Evolution does not start from scratch with *Homo sapiens*. A rat freezing at a cat scent exhibits fear behaviour and physiology. If your theory requires complex linguistic concepts or self-reflective appraisal to constitute an emotion, you must either deny rats have emotions (biologically implausible) or admit humans have two entirely different kinds of emotion (theoretically messy).

  ### 4. The Unfelt Affect Constraint
  **The Requirement:** The theory must allow for emotional states that do not reach conscious feeling.
  **The Consideration:** Subliminal priming and implicit bias research suggest we process affective value before (or without) conscious awareness. A theory that equates emotion strictly with *qualia* (the felt experience) cannot account for the causal power of unconscious affect on decision-making.

  ### 5. The Variability Constraint (Autonomic & Neural)
  **The Requirement:** The theory cannot rely on a one-to-one mapping between specific emotion categories and specific physiological or neural signatures.
  **The Consideration:** There is no unique "fingerprint" for fear. Heart rate rises in fear, anger, and joy. The amygdala activates for novelty, not just threat. A theory positing distinct biological essences for each emotion (e.g., "Fear has a specific circuit") contradicts the meta-analytic data. The biology is variable; the category is often imposed top-down.

  ### 6. The Linguistic Variability Constraint
  **The Requirement:** The theory must explain why emotion vocabularies and experiences differ across cultures (e.g., *schadenfreude*, *liget*, *amae*).
  **The Consideration:** If emotions were purely biological universals like blinking, every language would carve nature at the same joints. They do not. Some cultures lack a word for "anger"; others have dozens for "sadness." A rigid universalist theory fails to capture how concepts shape the experience of affect itself.

  ### 7. The Neural Plausibility Constraint
  **The Requirement:** The theory must not localise complex emotions to single, dedicated subcortical structures (specifically, the amygdala is not a "fear centre").
  **The Consideration:** Early neuroscience loved the idea of a "fear hub" in the amygdala. Lesion studies and imaging now show the amygdala is involved in salience, learning, and even positive valence. A theory relying on a "limbic system" model of distinct emotional modules is anatomically obsolete.

  ***

  ### The Incompatibilities (The Trilemma)

  You asked which of these requirements cannot all hold at once. Strictly speaking, the *phenomena* are all real, but satisfying the theoretical requirements simultaneously creates a trilemma. You can satisfy any two of the following three, but rarely all three:

  1.  **Phylogenetic Continuity:** Emotions are evolved, biological natural kinds shared with rats and fish.
  2.  **Cognitive Intentionality:** Emotions are sophisticated, object-directed evaluations (required to solve Recalcitrance and Intentionality).
  3.  **Constructionist Variability:** Emotions are categories constructed by culture and language (required to solve Linguistic Variability and Autonomic Variability).

  **The Tension:**
  If you prioritise **Continuity** (1) and **Intentionality** (2), you struggle to explain **Variability** (3). (If it's a hardwired biological circuit shared with rats, why does the experience change so much with language?)
  If you prioritise **Variability** (3) and **Intentionality** (2), you struggle to explain **Continuity** (1). (If emotion is a complex conceptual construction, do rats really have the concepts required to be "afraid"?)
  If you prioritise **Continuity** (1) and **Variability** (3), you struggle to explain **Intentionality** (2). (If it's just variable biological surges, where does the "aboutness" come from?)

  Most theories solve this by quietly demoting one requirement. Evolutionary psychologists demote Variability. Social Constructionists demote Continuity. Cognitivists demote Continuity (by making emotions too smart for rats).

  ***

  ### The Theory Killer

  You asked for the single requirement that rules out the most popular theories.

  **The Winner:** **The Variability Constraint (No One-to-One Signatures).**

  **Why:**
  This is the heavy artillery. It simultaneously dismantles the two most dominant frameworks in the field:

  1.  **Basic Emotion Theory (Ekman, Panksepp, etc.):** This is the "folk psychology" of science—the idea that there are six (or seven) universal emotions with distinct facial expressions and neural circuits. The Variability Constraint contradicts the core claim. If there is no specific autonomic or neural fingerprint for "fear" distinct from "anger," the theory that they are distinct biological natural kinds collapses.
  2.  **James-Lange Theory (and modern somatic markers):** The idea that emotion *is* the perception of specific bodily changes. If the bodily changes are not specific to the emotion category (i.e., the same heartbeat pattern occurs in fear and rage), then the perception of that pattern cannot constitute the specific emotion.

  While the **Recalcitrance Constraint** is the philosophical killer for Judgement Theories (Solomon, Nussbaum), the **Variability Constraint** is the scientific killer for the Basic Emotion models that dominate textbooks, pop psychology, and much of neuroscience. It forces you to abandon the idea that emotions are "things" waiting to be found in the brain, and accept that they are events constructed by the brain.

  **Summary for your reading:**
  If a theory promises you distinct circuits for distinct emotions, discard it (violates Variability).
  If a theory promises you that emotions are just judgments, discard it (violates Recalcitrance).
  If a theory promises you that rats feel exactly what you feel, discard it (violates Linguistic Variability).

  Good luck. You'll need it.
