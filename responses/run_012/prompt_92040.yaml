  What I want is a thought experiment where a greedy reductionist and a careful (non-greedy) reductionist look at the exact same phenomonon and disagree about whether it's been explained — and the careful one turns out right, but NOT for the lazy the-whole-is-more-than-the-parts reason, and NOT because there's some spooky emergent force hiding in there. Everything stays natural; the careful reductionist just builds a proper crane.

  The hard spec, and this is the part I care about: the phenomenon has to be robust to total turnover of the individuals involved. Like, every single person/animal/whatever that was there at the start can be gone, replaced by fresh ones, and the pattern still shows up. That's the thing I want the greedy guy to trip over.

  Other constraints:
  - one paragraph for the scenario itself, then the analysis after
  - realistic setting — a workplace, a market, a lab, a farm, a neighborhood. No made-up planets, no brains in vats.
  - the phenomenon has to be something you could at least in principle measure
  - no consciousness, no quantum anything
  - please avoid the obvious ones everyone uses: don't do altruism, don't do the origin of language
  - no jargon-word answers. If the careful reductionist needs a name for the mechanism, give it a plain-English name and say what it actually does, mechanically

  Then walk me through:
  a) what the greedy reductionist says, and why they think that closes the book
  b) what the careful reductionist says instead — what extra level or mechanism they add
  c) which ONE feature of the case is doing the real work, i.e. the thing that if I deleted it, the greedy guy would win
  d) how a defender of greedy reductionism would try to salvage it, and whether that salvage actually holds up

  Think it through carefully and don't rush the last two parts, those are definately the ones I need to win the arguement. And just explain everything in your own words — I've got no internet here so don't bother citing anything.
