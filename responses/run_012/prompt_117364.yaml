answer: |-
  **MEMORANDUM**

  **TO:** Certification Unit Staff
  **FROM:** Unit Head
  **SUBJECT:** Legacy Forest Certification Decision Procedure (v.4.0)

  **PURPOSE**
  The statute uses the term "legacy forest" without defining it. This procedure does not discover what a legacy forest *is*; it stipulates where this agency draws the line for tax administration. We are managing vagueness, not measuring essence. This protocol separates data gaps from definition gaps, handles conflicting evidence, and prevents "death by a thousand cuts" (the sorites hazard).

  Follow these steps in order. Do not skip.

  ### STEP 1: THE EPISTEMIC CHECK (Ignorance vs. Fact)
  **Question:** Is the file complete enough to measure the three criteria (Complexity, Age, Harvest) against the standard?
  **Sufficient Answer:**
  *   **Yes:** All plot surveys are current (<3 years), aerial photography covers the required timeline, and owner affidavits are signed. Proceed to Step 2.
  *   **No:** Any metric relies on estimation, missing photos, or unverified owner testimony.
  **Action:** **STOP.** Issue a "Notice of Incomplete Record." Do not deny. Do not certify.
  **Rationale:** This separates *ignorance* (we don't know) from *vagueness* (we know, but it's borderline). Do not treat missing data as a negative score.

  ### STEP 2: THE HARD VETO (Binary Exclusions)
  **Question:** Does the harvest history show a commercial clearcut or seed-tree harvest within the last 40 years, regardless of other scores?
  **Sufficient Answer:**
  *   **Yes:** Verified evidence of high-intensity harvest exists.
  *   **No:** Harvest history is selective or non-existent.
  **Action:** If **Yes**, **DENY**. Cite Statutory Intent regarding "Legacy" continuity. Stop.
  **Rationale:** Some boundaries must be sharp to prevent absurdity. This is a policy choice, not an ecological measurement.

  ### STEP 3: THE COMPENSATORY SCORE (Handling Conflict)
  **Question:** What is the weighted Legacy Score (LS)?
  **Calculation:**
  *   Structural Complexity (0-50 points)
  *   Dominant Cohort Age (0-30 points)
  *   Harvest History Cleanliness (0-20 points)
  *   **Total LS:** Sum of above.
  **Action:**
  *   **LS ≥ 85:** Proceed to Step 5 (Green Zone).
  *   **LS ≤ 70:** Proceed to Step 5 (Red Zone).
  *   **71 ≤ LS ≤ 84:** Proceed to Step 4 (Yellow Zone).
  **Rationale:** Criteria conflict (e.g., old trees but low complexity) is resolved by trade-offs. A very old forest with moderate complexity can still be "legacy." This avoids the veto problem for non-critical metrics.

  ### STEP 4: THE BORDERLINE RESOLUTION (Vagueness Management)
  **Question:** For parcels in the Yellow Zone (71-84), is there a "Calibration Match"?
  **Test:** Search the database of the last 3 years for a certified parcel with an LS within ±2 points and similar ecological subtype.
  **Sufficient Answer:**
  *   **Match Found:** A similar parcel was certified.
  *   **No Match:** No similar parcel was certified, or similar parcels were denied.
  **Action:**
  *   If **Match Found:** **CERTIFY**. (Principle of Parity).
  *   If **No Match:** **DENY**. (Principle of Fiscal Restraint).
  *   **Documentation:** You must attach the ID of the comparison parcel or a note stating "No comparable precedent."
  **Rationale:** This resolves higher-order vagueness. We do not draw a new line for every Yellow Zone case; we extend the existing line by analogy. If no analogy exists, the benefit of the doubt goes to the state, not the taxpayer. This stops infinite regress by relying on *past choices*, not new philosophical debates.

  ### STEP 5: THE SORITES CHECK (Cumulative Change)
  **Question:** For parcels clearing Step 3 or 4, does the approved Management Plan project a decline in the Legacy Score?
  **Test:** Project the LS forward 10 years based on the submitted Management Plan.
  **Sufficient Answer:**
  *   **Projected LS ≥ 70:** The parcel remains stable.
  *   **Projected LS < 70:** The parcel will degrade out of eligibility.
  **Action:**
  *   If **Projected LS ≥ 70:** **CERTIFY** for a 10-year term.
  *   If **Projected LS < 70:** **DENY**.
  **Rationale:** This catches the sorites hazard. We do not certify a parcel that is contractually committed to ceasing to be a legacy forest. One increment of logging is allowed; a trajectory out of the definition is not.
  **Note:** This step denies parcels that are currently "good" but managed toward "bad."

  ### STEP 6: THE DECISION SCRIPT (Appeal Proofing)
  **Requirement:** All Denial Letters for Yellow Zone (Step 4) or Sorites (Step 5) denials must use the following language block. Do not alter.

  > "The statute does not define 'legacy forest' with scientific precision. The Agency must draw an administrative line to apply the law consistently. Your parcel falls within a range where the characteristics of a legacy forest are genuinely unsettled. We have certified parcels with similar scores in the past [or: We have not certified parcels with similar scores]. In this instance, the Agency has determined that the cumulative weight of evidence does not meet the threshold required for tax expenditure. This decision is based on the need to maintain a stable definition over time, not on a finding that your land lacks conservation value."

  **Rationale:** This admits the line is chosen, not found. It prevents the appeal argument that we made a "factual error." We did not; we made a "policy application."

  ### STEP 7: MANAGER ESCALATION (The Human Valve)
  **Condition:** If a reviewer believes a Step 5 (Sorites) Denial will cause significant public harm or legal risk.
  **Action:** Route to Unit Head.
  **Constraint:** Unit Head approval required to override a Step 5 Denial. Max 5% of total applications.
  **Rationale:** This is the safety valve for when the machinery produces a result that is logically sound but politically untenable.

  ***

  ### TEST RUN: THREE PARCELS

  **Parcel 1: The Mediocre "Legacy"**
  *   **Data:** Complexity Score: 35/50 (Low). Cohort Age: 90 years (High, 28/30 pts). Harvest: Clean (20/20 pts).
  *   **Total LS:** 83 (Yellow Zone).
  *   **Precedent:** Two similar parcels certified last year.
  *   **Projection:** Stable.
  *   **Procedure Outcome:** **CERTIFY** (via Step 4 Match).
  *   **My Assessment:** I do not like this. The forest is ecologically bland and structurally simple. It is only "legacy" because the trees are old and no one cut them. We are paying a tax credit for negligence, not stewardship. However, the procedure forces consistency. If we deny this, we invalidate the prior certifications, inviting successful appeals.

  **Parcel 2: The Conflicting Evidence**
  *   **Data:** Complexity Score: 48/50 (High). Cohort Age: 60 years (Moderate, 20/30 pts). Harvest: One ambiguous aerial photo from 1985 suggesting possible thinning. Owner affidavit says "no."
  *   **Total LS:** 80 (Yellow Zone).
  *   **Precedent:** No comparable parcels with ambiguous harvest history were certified.
  *   **Projection:** Stable.
  *   **Procedure Outcome:** **DENY** (via Step 4 No Match).
  *   **My Assessment:** This is the correct use of the "Benefit of the Doubt" rule. The ambiguity creates epistemic risk. Without a precedent to lean on, we cannot spend public funds on a gamble.

  **Parcel 3: The Future Fail**
  *   **Data:** Complexity Score: 45/50. Cohort Age: 100 years (30/30 pts). Harvest: Clean.
  *   **Total LS:** 95 (Green Zone).
  *   **Management Plan:** Owner plans selective harvest in Year 5 and Year 10 to fund retirement.
  *   **Projection:** Complexity drops to 30/50 by Year 10. Projected LS = 75. (Wait, 75 is still Yellow/Green boundary). Let's adjust: Plan involves removing dominant cohort. Projected Age Score drops to 10/30. Projected LS = 65.
  *   **Procedure Outcome:** **DENY** (via Step 5 Sorites Check).
  *   **My Assessment:** I do not like this outcome either, but for a different reason. The land *is* a legacy forest today. The owner is compliant. But the procedure denies them because of what they *will* do. This is the sorites hazard mitigation. If we certify this, we fund the destruction of the very quality we are paying to protect. We must deny now to prevent the slow slide. This will generate an appeal, but the Step 6 script protects us.

  ***

  ### LIMITATIONS, JUDGMENT CALLS, AND GAMING

  **What This Procedure Cannot Do**
  1.  **It cannot fix the statute.** It manages the ambiguity; it does not resolve it. "Legacy" remains a vague term; we have simply built a fence around a specific usage of it.
  2.  **It cannot guarantee ecological outcomes.** Parcel 1 proves that meeting the metrics does not guarantee high conservation value.
  3.  **It cannot prevent all appeals.** It only prevents appeals based on *inconsistency*. It invites appeals based on *hardship* (Parcel 3), which we must fight using the Step 6 script.

  **Judgment Calls Dressed as Procedure**
  1.  **The Weighting (Step 3):** Deciding that Age is worth 30 points and Complexity 50 is a policy choice, not science. I chose it to prioritize structure, but I could have swapped them. This is where my philosophy enters the machine.
  2.  **The Yellow Zone Width (Step 4):** Setting the band at 71-84 is arbitrary. A band of 75-80 would work too. The width is chosen to balance technician workload (narrower = more escalations) against fairness (wider = more inconsistency).
  3.  **The Precedent Window (Step 4):** Looking back only 3 years assumes the policy hasn't shifted. If I changed my mind last month, this step locks in my old thinking.

  **How a Reviewer Could Game It**
  1.  **The "Nudge":** A reviewer who wants to approve a friend's parcel can adjust the Structural Complexity score by +2 points to move a 70 (Red) to a 72 (Yellow), then claim a "Precedent Match" exists when it is weak.
      *   *Counter-measure:* Random audit of 10% of Yellow Zone approvals.
  2.  **The "Search Bias":** In Step 4, a reviewer can claim "No Match" to deny a parcel they dislike, or "Match Found" to approve one they like, by tweaking the search criteria for "similar ecological subtype."
      *   *Counter-measure:* The database query must be automated. Reviewers cannot manually hunt for precedents; the system must serve the top 3 matches.
  3.  **The "Projection Sandbag":** In Step 5, a reviewer can assume a Management Plan will cause more degradation than it likely will to trigger a Denial, avoiding the paperwork of certification.
      *   *Counter-measure:* Require the projection calculation to be signed by a senior forester, not the intake technician.

  **FINAL NOTE**
  This machinery admits that we are choosing, not measuring. That admission is your shield. When an owner asks, "Why is the line at 70 and not 69?" the answer is not "Because 69 isn't legacy." The answer is "Because we must draw a line somewhere to administer the law, and 70 is where we drew it." Stick to the script.
