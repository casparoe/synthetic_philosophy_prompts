  To capture your verdicts without succumbing to the problem you identified with your draft principle (which incorrectly counted Backward Masking as experience), I propose the **Phenomenal Perceptual Constitution Principle (PPCP)**. This principle distinguishes between information that merely guides behavior and information that constitutes a conscious scene, and it distinguishes between perceptual integration and mnemonic reconstruction.

  ### The Principle

  **The Phenomenal Perceptual Constitution Principle (PPCP)**

  1.  **The Reality Clause:** A subject genuinely undergoes an experience with content $C$ if and only if:
      *   (i) $C$ is constituted by the integration of sensory signals within the **perceptual processing system** (excluding purely mnemonic or conceptual reconstruction); and
      *   (ii) $C$ is **phenomenally available**, meaning the subject can make a direct, assertoric report about $C$ (e.g., "I saw X") rather than merely exhibiting above-chance discrimination or guessing.
      *   *Motivating Cases:* This clause validates **(a) Colour Phi** and **(e) Phoneme Restoration** (perceptual integration + assertoric report) while excluding **(b) Backward Masking** (fails ii: only forced-choice discrimination, no assertoric report) and **(c) Post-hoc Suggestion** (fails i: mnemonic/conceptual reconstruction, not perceptual integration).

  2.  **The Timing Clause:** The time $T_{exp}$ assigned to a genuine experience is the time indexed by the perceptual system's temporal binding mechanism.
      *   (i) If the constitution of content $C$ is causally fixed by stimuli arriving at or before $T_{exp}$, the experience is **veridically timed**.
      *   (ii) If the constitution of content $C$ causally depends on stimuli arriving strictly after $T_{exp}$, the experience is **backdated**.
      *   *Motivating Cases:* This clause validates **(d) Ordinary Delayed Report** (content fixed at light onset; report delay is motor/linguistic) while classifying **(a) Colour Phi** and **(e) Phoneme Restoration** as **backdated** (content fixation requires the second dot or sentence context, which arrive after the felt time of the experience).

  ---

  ### Application to Two New Cases

  To test the robustness of the PPCP, consider these two constructed cases:

  **Case 1: The Cutaneous Rabbit**
  *   **Scenario:** Three taps are delivered in rapid succession: one at the wrist, one at the elbow, and one at the upper arm. The subject reports feeling a series of taps hopping up the arm, including sensations at intermediate locations where no physical stimulus occurred.
  *   **PPCP Verdict:** **Genuine, Backdated Experience.**
  *   **Reasoning:** Like Colour Phi, this satisfies the Reality Clause (perceptual integration of tactile signals + assertoric report of sensation) and the Timing Clause (the sensation at the intermediate location is constituted by the later taps, yet felt to occur earlier). This aligns with your verdict on (a).

  **Case 2: Subliminal Semantic Priming**
  *   **Scenario:** The word "NURSE" is flashed too briefly for awareness, immediately masked. A moment later, the subject sees the word "DOCTOR" and identifies it faster than usual. When asked, "Did you see a word before 'DOCTOR'?", the subject says "No."
  *   **PPCP Verdict:** **No Experience.**
  *   **Reasoning:** This satisfies the exclusion criteria of the Reality Clause. While the information is processed enough to steer behavior (priming), it fails condition (ii): the subject cannot make a direct assertoric report about the word "NURSE." This aligns with your verdict on (b).

  ---

  ### Critical Evaluation: Which Verdict is at Risk?

  The PPCP successfully accommodates all five of your verdicts *formally*. However, principles are only as stable as the distinctions they rely upon. The PPCP relies heavily on the **Reality Clause's** distinction between *perceptual integration* (Case a, e) and *mnemonic/conceptual reconstruction* (Case c).

  The verdict most vulnerable to surrender is **(e) Phoneme Restoration**.

  **Why (e) is vulnerable:**
  Your verdict treats Phoneme Restoration as a "genuine experience" (like Colour Phi) rather than a "false memory" (like Post-hoc Suggestion). The PPCP supports this by categorizing speech processing as part of the "perceptual processing system." However, modern predictive processing models suggest that speech perception is deeply penetrated by high-level cognitive and semantic expectations—the same machinery involved in Post-hoc Suggestion.

  If the boundary between "perceptual integration" and "conceptual reconstruction" is porous (as many cognitive scientists argue), then Phoneme Restoration (e) shares the same mechanism as Post-hoc Suggestion (c). In that scenario, the PPCP forces a choice:
  1.  **Surrender (e):** Reclassify Phoneme Restoration as a form of confabulation/false memory to align with (c).
  2.  **Surrender (c):** Reclassify Post-hoc Suggestion as a genuine (albeit cognitive) experience.

  Given your strong intuition that (c) is *not* an experience, **(e) is the verdict most likely to be surrendered** if the empirical distinction between perception and cognition collapses. Colour Phi (a) is slightly more secure because it relies on low-level sensory interpolation (motion and colour), whereas Phoneme Restoration relies on linguistic knowledge, which bleeds more easily into the "conceptual" category occupied by Suggestion.

  **Summary:** The PPCP captures your intuitions by prioritizing *phenomenal availability* over *implicit guidance* (solving the Backward Masking problem) and *perceptual constitution* over *memory reconstruction* (solving the Suggestion problem). It requires no immediate surrender of verdicts, but it places (e) on precarious empirical ground.
