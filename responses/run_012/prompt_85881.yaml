answer: |-
  You press me hard upon the motive, sir, and I shall concede that the ledger of public expense is the most visible evidence I lay before the magistrate, yet it is not the sole foundation of my judgment. My objection to the mercantile system is not merely that it is a bad investment for the mother country, but that it is a violation of natural liberty which ultimately undermines the real opulence of nations by forcing industry into channels where it cannot flourish. Regarding the representation of the colonies, I proposed such a union only as a hypothetical means to equalise the burden of defence should the monopoly persist, though I held little hope that a distant legislature could govern free subjects justly without corrupting the constitution at home. As for Bengal, you ask if the wrong is cruelty or inefficiency; I answer that they are inseparable, for when merchants are armed with sovereignty, the temptation to oppress the native for private gain becomes irresistible, corrupting the master as surely as it ruins the servant. The system is unjust not because it fails to pay, but because it rests upon restraint and force rather than the free exchange of goods and justice.
