  I'm putting together a discussion handout for a seminar on Plato's Laws and I want one concrete example to open with, not a summary of the argument. Here's the thing I want the example to expose. In Book II the Athenian lays out a whole drinking regime: no wine at all for anyone under eighteen, wine in moderation for the under-thirties, and plenty of it for older men, who he says have gone stiff and joyless and need softening up again so they'll sing and dance with the chorus. He calls the drinking party a kind of gymnasium or test for temperance: put a man in his cups and see whether he can hold on to his sense of shame and his self-command. But the same stretch of text insists that wine makes a man's soul soft, like iron heated in a fire, and that this softness is precisely what makes him pliable and trainable. So the thing that's supposed to wreck self-control is being prescribed as the way to build it, and the older and more set in your ways you are, the more of it you're supposed to take. I'm also pretty sure there's a bit about the party needing a sober overseer in charge of it, someone who stays out of the drinking and keeps order — correct me if I'm misremembering — and he definitely says slaves shouldn't touch the stuff at all, and that he'd add that to the Carthaginian rule that keeps soldiers on water while they're on campaign.

  What I want from you is a single worked example. One concrete case, modern or hypothetical, I dont care, but specific enough that we can actually argue about it, and it has to make one of these tensions visible and sharp. Pick whichever tension you think is most worth pressing and say plainly what the example is supposed to show. No survey of the literature, no reading list, I just want the example and the work it does. If you think it shows the proposal is straightforwardly incoherent, say so and say why. If you think it shows something subtler — the test and the training pulling apart, or the trainer having to stand outside the very virtue he's supposed to be training, or the older drinker being asked to buy back a malleability he can only get by losing the judgment he spent his life acquiring — then spell out that difference and why it matters.

  Write it as continuous prose, no headings, no bullet points, no bold, no tables, the way you'd write it in an email. And dont quote anything, just paraphrase, since I'll be retyping it anyway.
