answer: |-
  ### Examination Question

  **Course:** Social Choice and Collective Decision-Making  
  **Assessment:** Final Examination Review Session  
  **Time Allowed:** 50 Minutes  
  **Total Marks:** 25

  **Question 1**

  A five-member appointments committee must decide whether to promote a candidate ($C$). The committee's charter stipulates that $C$ is correct if and only if the candidate's teaching record is excellent ($A$) AND the candidate's research record is excellent ($B$). The members cast the following judgments:

  *   **Member 1:** $A$: Yes, $B$: Yes, $C$: Yes
  *   **Member 2:** $A$: Yes, $B$: Yes, $C$: Yes
  *   **Member 3:** $A$: Yes, $B$: No, $C$: No
  *   **Member 4:** $A$: No, $B$: Yes, $C$: No
  *   **Member 5:** $A$: No, $B$: No, $C$: No

  All members are individually consistent with the charter's rule ($C \iff A \land B$).

  (a) Calculate the collective outcome under two procedures: (i) **Conclusion-Based Aggregation** (majority vote on $C$) and (ii) **Premise-Based Aggregation** (majority vote on $A$ and $B$, then derive $C$). Show the specific vote counts for each proposition. [5 marks]

  (b) Explain the normative conflict revealed by your calculations in (a). Specifically, identify which desideratum (e.g., collective consistency, responsiveness to members' verdicts, or anonymity) is satisfied by each procedure and which is sacrificed. [7 marks]

  (c) Suppose the charter contains a clause requiring the recorded verdict to be "answerable to the reasons that carried the day," effectively mandating Premise-Based Aggregation. Assess whether this clause resolves the dilemma or merely legislates one horn of it. In your answer, address the cost of this mandate: does it commit the committee to a verdict that a majority of members rejected? Does the collective endorsement of reasons reflect a coherent viewpoint held by any specific coalition? [8 marks]

  (d) Is the difficulty demonstrated above a defect of majority voting as such, or a consequence of the logical connection between the propositions? Justify your answer by describing what would happen to the case if $A$, $B$, and $C$ were logically independent. [5 marks]

  ***

  ### Model Answer

  The discursive dilemma arises when majority voting on logically connected propositions yields inconsistent collective judgments. In this case, applying Conclusion-Based Aggregation requires counting the votes on $C$ directly. Members 1 and 2 vote Yes, while Members 3, 4, and 5 vote No. The result is a rejection of promotion (2-3). Conversely, Premise-Based Aggregation requires majority voting on the reasons $A$ and $B$. On $A$, Members 1, 2, and 3 vote Yes (3-2). On $B$, Members 1, 2, and 4 vote Yes (3-2). Since the charter dictates $C \iff A \land B$, the committee must conclude $C$ is Yes. Thus, the two procedures deliver opposite verdicts: Conclusion-Based yields No, while Premise-Based yields Yes.

  This arithmetic reveals a fundamental conflict between collective rationality and democratic responsiveness. Premise-Based Aggregation preserves collective consistency and logical closure; the committee's output respects the logical constraint $C \iff A \land B$. However, it sacrifices responsiveness to the members' direct judgments on the conclusion, as the collective verdict (Yes) contradicts the majority view on $C$ (No). Conclusion-Based Aggregation prioritizes responsiveness and anonymity regarding the final decision, ensuring the verdict matches the majority's direct preference. However, it sacrifices collective rationality, resulting in a set of judgments $\{A=\text{Yes}, B=\text{Yes}, C=\text{No}\}$ that violates the charter's logical rule. The committee would be affirming the sufficient conditions for promotion while simultaneously denying the promotion itself.

  The charter clause mandating that the verdict be answerable to the reasons effectively legislates Premise-Based Aggregation. While this resolves the inconsistency, it does not dissolve the dilemma; it simply prioritizes consistency over responsiveness. The cost is significant. First, the committee is committed to a verdict (Promote) that a majority of its members (3, 4, and 5) explicitly rejected. This creates a democratic deficit where the outcome is orthogonal to the majority's will on the decision itself. Second, while Members 1 and 2 individually support the Promote verdict, the *reasons* endorsing it are supported by disjoint coalitions. The majority for $A$ is $\{1, 2, 3\}$, while the majority for $B$ is $\{1, 2, 4\}$. The "collective reasoner" who accepts both $A$ and $B$ is a patchwork of these groups. No single majority coalition supports the *conjunction* of reasons; only a minority coalition $\{1, 2\}$ supports both premises and the conclusion. Thus, the clause forces the committee to speak with a unified voice that no majority bloc actually possesses, creating a collective agent that is rational but unrepresentative.

  Finally, this difficulty is not a defect of majority voting as such, but a consequence of the logical connection between the propositions on the agenda. If $A$, $B$, and $C$ were logically independent, the paradox would vanish. In an independent agenda, voting Yes on $A$ and Yes on $B$ would carry no logical implication for $C$. The committee could consistently vote Yes on $A$, Yes on $B$, and No on $C$ without violating any external constraint. The discursive dilemma arises specifically because the agenda is structured such that the truth values of the propositions are constrained by logic ($C \iff A \land B$). Majority voting functions coherently on independent propositions; the failure occurs only when the voting rule is applied to a set of propositions that must satisfy logical integrity. Therefore, the tension is structural, arising from the imposition of logical constraints on a aggregation rule designed for independent choices.

  ***

  ### Marking Scheme

  **Total Marks:** 25  
  **Instructions for Graders:** Use this scheme to award marks based on the specific moves listed. Do not award full marks for general descriptions that do not engage with the specific vote counts provided in the question.

  #### Part (a): Calculation and Arithmetic (5 Marks)
  *   **Full Credit (5):** Correctly identifies Conclusion-Based outcome as **No** (2 Yes, 3 No) and Premise-Based outcome as **Yes** (A: 3 Yes, B: 3 Yes $\rightarrow$ C: Yes). Explicitly shows the vote counts.
  *   **Competent (3):** Identifies the opposing verdicts but omits specific vote counts or miscounts one proposition (e.g., counts A as 2-3).
  *   **Weak (0-1):** Fails to identify the conflict or confuses the procedures (e.g., claims both yield Yes).
  *   **Penalty:** Deduct 2 marks if the candidate claims individual members are inconsistent (the prompt states they are consistent).

  #### Part (b): Normative Trade-offs (7 Marks)
  *   **Full Credit (6-7):** Clearly articulates the trade-off: Premise-Based saves **consistency/logic** but loses **responsiveness** on $C$; Conclusion-Based saves **responsiveness** but loses **consistency**. Uses terms like "logical closure" or "collective rationality."
  *   **Competent (4-5):** Identifies that one method is logical and the other follows the majority vote but fails to name the specific normative desiderata (e.g., does not mention consistency or responsiveness).
  *   **Weak (0-3):** Vague discussion of "fairness" without linking it to the specific procedural outcomes in (a).
  *   **Common Error:** Do not award marks for discussing Condorcet cycles or preference aggregation; this is a judgment aggregation problem.

  #### Part (c): The Institutional Clause (8 Marks)
  *   **Full Credit (7-8):** Acknowledges the clause mandates Premise-Based. Crucially, notes that while the verdict is consistent, a **majority rejected the verdict** (Members 3-5). Nuanced discussion of the "reasons": identifies that the majorities for $A$ and $B$ are **disjoint coalitions** ({1,2,3} vs {1,2,4}), meaning the "collective reason" is not held by a single majority bloc.
  *   **Competent (5-6):** States the clause forces Premise-Based and notes the majority rejected $C$. Fails to analyze the coalition structure of the premises (treats the reasons as a monolithic block).
  *   **Weak (0-4):** Claims the clause "solves" the problem without discussing the democratic cost, or incorrectly claims that *no* member supports the outcome (Members 1 and 2 do).
  *   **Note on Accuracy:** Candidates who notice that Members 1 and 2 *do* support the outcome (contrary to the standard "no member supports" heuristic) should be rewarded for attention to the specific data, provided they still identify the majority rejection cost.

  #### Part (d): Root Cause (5 Marks)
  *   **Full Credit (5):** Correctly identifies the root cause as the **logical connection** (agenda structure), not majority voting itself. Explains that if $A, B, C$ were independent, voting Yes on $A, B$ and No on $C$ would be consistent.
  *   **Competent (3):** States it is about logical connection but fails to explain the counterfactual (what would happen if they were independent).
  *   **Weak (0-2):** Blames majority voting itself (e.g., "majority rule is flawed") without referencing the logical constraints.
  *   **Common Error:** Deduct all marks if the candidate argues the dilemma proves individual voters are irrational.
