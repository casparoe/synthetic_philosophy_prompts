          3.  **The "Moorean" Sentence:** The sentence "P & nobody knows P" isn't necessarily self-referential in a vicious way. It's a "Moorean sentence." It's contingent. It could be true right now. The paradox shows that if KP holds, *no* Moorean sentence can be true. But it seems plausible that some Moorean sentences *are* true (e.g., a secret kept perfectly).
          4.  **Derivability:** The proof shows that if KP holds for *basic* truths, it implies all truths are *actually known* (Omniscience). Restricting KP to "basic" truths doesn't stop the derivation if the logic allows conjunctions.

