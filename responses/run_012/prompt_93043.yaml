prompt: |-
  Bit of an odd one, but I'd like a proper audit of an analogy.

  I'm in a reading group on welfare economics. My flatmate (did a masters in it, never lets me forget) has one move for every argument about comparing one person's welfare with another's, and it's this: utility is like hardness on the Mohs scale. You can line minerals up -- talc, gypsum, calcite, up to diamond -- but the numbers are just ranks. You can't say diamond is ten times harder than talc, you can't add two minerals' hardnesses together, and comparing the hardness of a mineral with the hardness of, say, a loaf of bread is nonsense. So, he says, any policy that trades off one person's suffering against another's -- QALYs, cost-benefit analysis, all of it -- is a category error dressed up as arithmetic. Rank things, then let politics decide.

  I half-beleive him. But I want to know exactly where the analogy gives out. So:

  1) The correspondence table first. What maps onto the scale, the ranks, the reference minerals, the act of scratching, the non-additivity? Which bits are doing real work in his argument and which are decoration?

  2) Where it breaks. I've got a suspicion that one break might be fatal: the Mohs scale is a crude ordinal scale for a property that does admit of real measurement -- the indentation tests they use in metallurgy give you actual numbers for hardness, not just ranks -- so 'hardness is only ordinal' starts to look like a fact about our instruments rather than about hardness itself. Does that carry over to welfare, or is there something about welfare that stops a better instrument helping even in principle? And if it does carry over, what's left of his argument?

  3) He adds that the numbers would be meaningless even if we had them, because there's no fact of the matter about whether my 7 and your 7 are the same amount of welfare. Is that the same objection restated, or a different and stronger one? What would have to be true for a cross-person comparison to be meaningful -- a metaphysical fact we're missing, or a decision we have to make?

  4) When he's feeling punchy he switches to a second version: two currencies with no exchange rate. I suspect that one's actually worse for him, since currencies do get exchange rates, and they get them by trade rather than by fiat. Is the same route open for welfare, and what would it cost him if it were?

  5) Then the verdict. What can the analogy actually carry? I assume something narrower than 'comparisons are meaningless' -- maybe 'no summing', or 'no ratio-scale talk'. Which conclusions survive that narrower reading, and is there a better analogy for whatever he's really getting at?

  No references needed, I just want the argument. If the honest answer is that his analogy is fine and my intuitions are the broken ones, say that.
reasoning: |-
  Here's a thinking process that leads to the audit of the analogy:

  1.  **Deconstruct the Request:**
      *   **Context:** Reading group on welfare economics. Flatmate (Masters grad) argues against interpersonal utility comparisons (IPC) using the Mohs scale analogy.
      *   **Task:** Audit the analogy.
      *   **Specific Questions:**
          1.  Correspondence table (what maps to what?).
          2.  Where it breaks (measurement theory vs. ontological status).
          3.  The "same 7" objection (identity of experience vs. scale).
          4.  The currency analogy (exchange rates vs. fiat).
          5.  Verdict (what survives, better analogies?).
      *   **Constraint:** No references needed, just the argument. Be honest if the flatmate is right.

  2.  **Analyze the Flatmate's Position:**
      *   **Core Claim:** Utility is ordinal, not cardinal. Interpersonal comparisons are category errors.
      *   **Analogy:** Mohs scale of mineral hardness.
      *   **Implication:** Policy tools like QALYs/Cost-Benefit Analysis (CBA) are pseudoscience. Politics should decide, not arithmetic.
      *   **Philosophical Stance:** This sounds like a mix of *ordinalism* (Pareto) and *non-comparabilism* (Robbins/skepticism about IPC).

  3.  **Drafting Section 1: Correspondence Table:**
      *   *Mohs Scale:* 1-10 ranking of minerals.
      *   *Utility:* Preference satisfaction or welfare levels.
      *   *Ranks:* 1st, 2nd, 3rd preference (or person A vs. Person B ranking).
      *   *Reference Minerals:* Talcs, Diamonds = Specific bundles of goods or life states.
      *   *Scratching:* Revealed preference (choosing A over B).
      *   *Non-additivity:* Can't add Person A's utility to Person B's.
      *   *Work vs. Decoration:* The "scratching" (preference) does the work. The specific minerals are decoration. The key mapping is *Ordinal Ranking vs. Cardinal Measurement*.

  4.  **Drafting Section 2: Where it Breaks (Measurement vs. Ontology):**
      *   *The Flatmate's Point:* Mohs is ordinal because we *say* so, but Vickers/Knoop tests exist (cardinal hardness).
      *   *The Counter:* Is there a "Vickers test" for utility?
      *   *Neuroscience?* Brain states? But is neural firing *welfare*? (The Naturalistic Fallacy / Is-Ought problem).
      *   *Behavior?* Revealed preference only gives ordinals.
      *   *The Fatal Flaw in the Analogy:* Hardness is a physical property independent of the observer. Welfare is arguably *constituted* by the subject's experience.
      *   *Measurement Theory:* Even if we measure neural correlates, we face the "zero point" and "unit size" problem across persons. Hardness has a physical zero (no resistance). Welfare's zero is ambiguous (death? neutral affect?).
      *   *Conclusion on this point:* The analogy holds *if* welfare is purely subjective preference. It breaks *if* welfare is a natural kind (like pain intensity).

  5.  **Drafting Section 3: The "Same 7" Objection (Interpersonal Comparison of Utility - ICU):**
      *   *Objection:* My 7 $\neq$ Your 7.
      *   *Is it the same?* It's a stronger objection. The Mohs analogy addresses *scale type* (ordinal vs. cardinal). The "Same 7" addresses *calibration* across distinct minds.
      *   *Metaphysical vs. Decision:* Is there a fact of the matter?
          *   *Realist:* Yes, similar neural architecture implies similar qualia.
          *   *Anti-Realist:* No, minds are black boxes.
      *   *Decision:* We *stipulate* comparability for policy. It's a pragmatic convention, not a discovered truth.
      *   *Impact:* This is the real killer for the flatmate's policy argument. Even if ordinal, we *need* to compare to avoid tyranny.

  6.  **Drafting Section 4: The Currency Analogy:**
      *   *Analogy:* Dollars vs. Yen without an exchange rate.
      *   *Flatmate's intent:* Incommensurability.
      *   *Weakness:* Currencies *do* have exchange rates (market prices).
      *   *Welfare equivalent:* Is there a "market" for welfare?
      *   *Veil of Ignorance:* This acts as the exchange rate mechanism. If I don't know who I am, I trade off risks.
      *   *Cost to Flatmate:* If exchange rates exist (via hypothetical insurance markets or veil of ignorance), then aggregation is possible. It undermines the "politics only" claim.

  7.  **Drafting Section 5: The Verdict:**
      *   *What survives:* The warning against *precise* cardinality. We shouldn't treat QALYs as physics.
      *   *What dies:* The claim that comparison is *impossible* or *nonsense*.
      *   *Nuance:* It's not a category error; it's a measurement error with high variance.
      *   *Better Analogy:* Pain scales (1-10) in a hospital. Doctors can't *prove* your 7 is my 7, but they triage based on it. It's pragmatic, not metaphysical. Or the "Decibel" analogy (logarithmic, subjective perception of physical intensity).
      *   *Final Call:* Flatmate is technically right on strict neoclassical definitions (Robbins), but wrong on practical ethics/policy implications (Harsanyi/Sen). The analogy is too strong; it implies *no* information, whereas we have *some* information.

  8.  **Review and Refine:**
      *   *Tone:* Analytical, respectful but critical.
      *   *Check:* Did I answer all 5 sub-questions? Yes.
      *   *Clarity:* Ensure the distinction between *ordinal/cardinal* and *intrapersonal/interpersonal* is clear. The flatmate conflates them slightly.
      *   *Self-Correction on Q2:* Make sure to emphasize that hardness *has* a cardinal underlying reality. Welfare might not. That's the disanalogy.
      *   *Self-Correction on Q3:* Distinguish between "meaningless" and "unknowable."
      *   *Self-Correction on Q5:* Don't just say "he's wrong." Say "He's right about the math, wrong about the ethics."

  9.  **Final Polish:** (Mental check of the output structure against the prompt's numbering). Ensure the "Verdict" is punchy. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to be careful about the Mohs scale itself. Mohs is ordinal. Vickers is cardinal. The flatmate says "Hardness is like Mohs." The counter is "Hardness *admits* Vickers." Does Welfare admit Vickers? That's the crux. I need to make sure I don't concede too much to the flatmate on the "no fact of the matter" point. There is a philosophical debate there (hedonic vs. preference utilitarianism). I should present both sides but highlight where the analogy fails to capture the *necessity* of comparison.

  Okay, ready to write.
answer: |-
  This is a classic debate in welfare economics, essentially replaying the Lionel Robbins (1930s) vs. John Harsanyi/Amartya Sen (later 20th century) argument. Your flatmate is taking the strict neoclassical/ordinalist line.

  Here is the audit of the Mohs analogy.

  ### 1) The Correspondence Table

  To see what work the analogy is doing, we need to map the terms.

  | Mohs Scale Component | Welfare Economics Equivalent | Function in Argument |
  | :--- | :--- | :--- |
  | **The Minerals** | **Individuals (or States of the World)** | The entities being measured. |
  | **Hardness** | **Utility / Welfare** | The property in question. |
  | **The Rank (1–10)** | **Preference Ordering** | The only data we are allowed to use. |
  | **Scratching Test** | **Revealed Preference** | The method of verification (A chosen over B). |
  | **Reference Minerals** | **Benchmark Bundles** | Standard baskets of goods used to anchor ranks. |
  | **Non-Additivity** | **Non-Aggregability** | You cannot sum Person A's utility + Person B's. |
  | **"10x Harder"** | **"2x Happier"** | The forbidden ratio claim. |

  **What's doing the work:** The mapping of *Scratching* to *Revealed Preference*. This is the engine. It asserts that the only empirical access we have to welfare is choice behavior, and choice behavior only yields orderings (I prefer A to B), not intensities (I prefer A to B *twice as much* as C to D).

  **What's decoration:** The specific minerals. They are just placeholders for "states." The physical nature of the mineral doesn't matter, only that they can be ordered.

  ### 2) Where It Breaks: Instrument vs. Ontology

  Your suspicion here is the most critical point. The analogy relies on an ambiguity between *epistemology* (what we can measure) and *ontology* (what exists).

  **The Hardness Case:**
  The Mohs scale is ordinal *by convention*, but hardness itself is *cardinal by nature*. We know this because we have the Vickers/Knoop indentation tests. These measure physical resistance to deformation in kg/mm². There is a fact of the matter about how much harder diamond is than talc, independent of the Mohs scale. The Mohs scale is just a crude tool for a property that admits of precise measurement.

  **The Welfare Case:**
  Does welfare admit of a "Vickers test"?
  *   **If Welfare = Preference:** Then no. Preferences are defined by choices. There is no underlying "preference substance" to measure. If I choose tea over coffee, there is no deeper fact about *how much* I prefer it unless I make more choices (e.g., betting scenarios). In this view, the flatmate is right: there is no cardinal fact waiting to be discovered.
  *   **If Welfare = Experience (Hedonism):** Then maybe. Neuroscience can measure cortisol, neural firing rates in the anterior cingulate cortex, etc. If pain is a neural state, it might have intensity and duration that are cardinal.

  **The Break:**
  The analogy fails if welfare is a natural kind (like pain) rather than a behavioral relation (like preference).
  *   **If welfare is preference:** The analogy holds. You can't measure the "depth" of a preference without circularity.
  *   **If welfare is experience:** The analogy breaks. We might not have the instrument *yet*, but it's not a category error to look for one.

  **Does it carry over?**
  Even if we accept the flatmate's view (welfare is preference), the analogy breaks on **policy necessity**. We don't need *true* cardinality to make policy; we need *actionable* comparability. Hardness doesn't *need* to be measured cardinally to build a bridge; we just use safety factors. Welfare *needs* to be compared to avoid tyranny. If we strictly follow the Mohs logic, we cannot justify taxing a rich person to save a poor person from starvation, because we can't compare the loss of luxury to the gain of survival. The analogy proves too much; it paralyzes all distributive justice, not just cost-benefit analysis.

  ### 3) The "Same 7" Objection (Calibration)

  This is a different, stronger objection. The Mohs argument is about **scale type** (ordinal vs. cardinal). The "Same 7" argument is about **interpersonal calibration**.

  *   **Mohs:** A rank of 5 (Apatite) is the same physical property in any lab.
  *   **Welfare:** A reported "7/10" pain level from you might correspond to a "4/10" from me.

  **Is it a metaphysical fact or a decision?**
  This is the crux of the philosophy of mind.
  *   **The Realist View:** There is a fact of the matter. We share similar biology. If our nociceptors fire at rate X, the suffering is comparable. The "meaninglessness" is just measurement noise.
  *   **The Anti-Realist View:** There is no fact of the matter. Minds are private. To say our 7s are equal is a *convention* we adopt to make society function.

  **What would have to be true?**
  For cross-person comparison to be meaningful in a strong sense, **structural isomorphism** must exist. We need to believe that the mapping from stimulus to internal state is sufficiently similar across humans that we can treat them as identical for practical purposes.

  **The Flatmate's Error:**
  He treats the lack of *perfect* calibration as proof of *no* comparison. But in science, we compare things with calibration errors all the time. We treat "7s" as equivalent not because we have metaphysical proof, but because assuming they are different leads to absurd moral conclusions (e.g., "We can't save the burning building because we can't prove the victims' pain equals the firefighter's risk").

  The objection isn't that comparison is impossible; it's that it's **imprecise**. The flatmate conflates *imprecision* with *meaninglessness*.

  ### 4) The Currency Analogy

  This analogy is indeed worse for him, and here is why.

  **The Analogy:** Person A has Dollars, Person B has Yen. No exchange rate exists.
  **The Flatmate's Point:** You can't sum them.
  **The Flaw:** Currencies *do* have exchange rates. They are discovered through **trade**.

  **The Welfare Equivalent:**
  Do we have trade in welfare? Yes. It's called **social cooperation** and **risk pooling**.
  *   **Veil of Ignorance:** If you don't know whether you will be Person A or Person B, you will agree on an exchange rate. (e.g., "I would accept a 10% tax to ensure I don't starve if I turn out to be poor").
  *   **Revealed Social Preference:** When a society votes to fund a public park, they are implicitly establishing an exchange rate between tax dollars and communal utility.

  **What it costs him:**
  If the currency analogy admits exchange rates via trade, then welfare admits exchange rates via **hypothetical insurance markets** or **democratic consensus**.
  If he accepts this, he concedes that aggregation is possible, just that the "exchange rate" is political/normative rather than physical. But if the exchange rate is normative, then *politics is doing the arithmetic*, which is exactly what cost-benefit analysis attempts to formalize. He cannot use this analogy to ban arithmetic; he can only use it to argue about *who sets the rate*.

  ### 5) The Verdict

  **What the analogy carries:**
  1.  **Warning against false precision:** It is correct that QALYs and CBA often pretend to a level of scientific exactitude they do not possess. Treating utility like meters or kilograms is misleading.
  2.  **Ordinal baseline:** It is true that the most robust data we have is ordinal (voting, choosing).
  3.  **Non-additivity of *raw* experience:** You cannot literally add my headache to your headache to make a "big headache."

  **Where the analogy fails (The Fatal Flaws):**
  1.  **Paralysis:** The Mohs scale is used for *identification*, not *engineering*. Welfare economics is engineering. If you refuse to use cardinal proxies because they aren't perfect, you default to the status quo, which is itself a distributive choice with cardinal consequences.
  2.  **The "Zero" Problem:** Mohs has no true zero (there isn't "no hardness"). Welfare arguably does (death, or neutral affect). If there is a natural zero, ratio comparisons become more defensible.
  3.  **Conflation of Measurement and Existence:** Just because we measure welfare ordinally doesn't mean it *is* ordinal. We measured temperature ordinally (hot/cold) for centuries before we had thermometers. That didn't mean temperature wasn't cardinal.

  **Is your intuition broken?**
  No. Your flatmate is hiding a normative claim behind a methodological one.
  *   **His Claim:** "We *cannot* compare utility." (Methodological)
  *   **His Real Claim:** "We *should not* aggregate utility because it violates individual sovereignty." (Normative)

  The Mohs analogy disguises the normative claim as a scientific limitation.

  **A Better Analogy:**
  **The Pain Scale in an ER.**
  *   Doctors ask patients to rate pain 1–10.
  *   They know Patient A's "7" might be Patient B's "5".
  *   They know you can't add two people's pain to make "14 pain."
  *   **However:** They *still* triage based on it. They treat the "7" before the "4". They administer morphine based on the number.
  *   **Why?** Because imperfect comparison is morally superior to no comparison.

  **Conclusion:**
  Your flatmate is right that utility is not *physics*. He is wrong that it is therefore *politics only*. It is **engineering with noisy data**. The Mohs analogy is a useful check against hubris, but a terrible guide for policy. If you follow his analogy to its logical conclusion, you cannot justify *any* redistribution, *any* public good provision, or *any* safety regulation that imposes costs on some to benefit others. That is a political stance, not a finding of measurement theory.
