answer: |-
  So me and the brother spent the party swapping envelopes, both convinced we had a 25% edge.

  Symmetry said we were both right. Measure theory said we were integrating over an improper prior.

  But the paradox only survives in the dark. The second I peeked and saw £50, the whole thing collapsed, the edge vanished, and we realized we'd just been trading variance while the cake went stale.

  Moral of the story: Never assume a flat prior on your mate's generosity.
