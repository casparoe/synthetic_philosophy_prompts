  Out of character, the strongest form of the Advocate's position is that political community requires a normative commitment to the common good that transcends mere aggregation of preferences, without collapsing into technocratic truth. The hardest bite in your opening is the accusation of vanguardism: if I judge the "good" to identify the "will," do I not place myself above the people? I must concede that I do assume the role of an interpreter of their intent, but I will argue this is unavoidable for any claim about collective agency. I need to distinguish between the *direction* of the will (toward the good) and the *accuracy* of the choice, without using forbidden labels.

  In that vote, the people willed to enact policy X under the conviction that it served their common life. The fifty-one did not impose a private preference; they offered a judgment about the shared good, and the procedure allowed that judgment to stand as the collective act. If they were mistaken, the will was not cancelled, but it was mistaken in its object, much like a person who wills to heal a friend but administers the wrong medicine. The will is the commitment to the healing, not the pharmacological accuracy. To say the will is only the sum of individual wants is to deny that the group can aim at anything beyond itself; to say the will is only the correct answer is to make the people passive recipients of truth rather than active agents.

  You ask what would show me I had got it wrong. I must own that my test involves judging whether the assembly was truly aiming at the common good or merely disguising a factional interest. If I conclude they aimed at the good, then the will exists even if the policy ruins them. If I conclude they aimed at power, then no collective will was formed, only a conquest. This does make me an arbiter, and that is dangerous. But the alternative is to say that a people cannot be wrong about their own survival, or that they have no shared aim at all. I accept the risk of my own error rather than deny the possibility of a shared political life.
