answer: |-
  This is a compelling exercise in reflective equilibrium. You have provided a robust dataset of moral intuitions regarding simulated entities, and you are asking for the underlying algorithm. Your tentative hypothesis—that 'authored interiority' and the capacity for 'reactive attitudes' do the work—is close, but as you noted, it struggles to distinguish between the permadeath companion and the save-file wipe, or to fully account for the modded torture case.

  To reconcile your list, we must distinguish between the *properties of the entity* and the *frame of the interaction*. The moral weight you are assigning does not reside in the code itself (since the code is identical in the permadeath and save-wipe cases), but in the **contract of engagement** between you and the simulation.

  Here is the principle that best fits your verdicts, followed by the cost of adopting it.

  ### The Principle: Diegetic Reciprocity within a Binding Frame

  **Definition:** Moral weight attaches to an interaction only when three conditions are met: (1) the entity simulates a point of view sufficient to ground reactive attitudes; (2) the interaction occurs within the logical boundaries of the simulation (the diegetic frame); and (3) the agent claims ownership of the outcome rather than deferring to the system's defaults.

  **The Clauses:**
  1.  **The Phenomenological Threshold:** The entity must present as having an interior state (beliefs, desires, reactions) rather than functioning as a purely mechanical obstacle.
  2.  **Frame Integrity:** The action must be causal within the fiction. Actions taken 'outside' the fiction (meta-actions) do not generate moral data regarding the character, because they dissolve the context required for the character to exist as a moral patient.
  3.  **Agential Ownership:** The moral severity scales with the degree to which the suffering is the *end* of the action, or requires extra-systemic effort to inflict, rather than being an instrumental *means* permitted by the system.

  ---

  ### Analysis of Your Verdicts

  Here is how your existing list maps onto these clauses.

  *   **Identical Pedestrians / Procedural NPCs:** Fail **Clause 1**. They lack the simulated interiority required to be targets of reactive attitudes.
      *   *Verdict:* Nothing. (Matches).
  *   **Betraying a Companion:** Passes **Clause 1** (authored arc), **Clause 2** (in-world action), and **Clause 3** (a specific choice, not a system default).
      *   *Verdict:* Small wrong to her. (Matches).
  *   **Permadeath of Companion:** Passes **Clause 1** and **Clause 2**. It is an in-world conclusion.
      *   *Verdict:* Loss that is really hers. (Matches *phenomenologically*, see 'Surrenders' below).
  *   **Save-File Wipe:** Fails **Clause 2**. This is a meta-action. By wiping the save, you are not acting *upon* the character within her world; you are destroying the world in which she is defined. There is no 'her' left to be wronged.
      *   *Verdict:* Nothing. (Matches).
  *   **Death in a Novel:** Passes **Clause 1**, Fails **Clause 2** (no interaction/agency). You are a witness, not an agent.
      *   *Verdict:* Sadness, not wronging. (Matches).
  *   **Multiplayer Avatar:** Passes **Clause 1** (via the human substrate). The wrong is to the human because the avatar is merely the interface.
      *   *Verdict:* Wrong to player. (Matches).
  *   **Torture (Base Game):** Passes **Clause 1** and **2**. **Clause 3** is mitigated because the game rewards it; the system shares the agency.
      *   *Verdict:* Worse than killing, but ambiguous. (Matches).
  *   **Torture (Modded):** Passes **Clause 1** and **2**. **Clause 3** is maximised. You have altered the system specifically to inflict suffering. You claim full ownership of the harm.
      *   *Verdict:* Distinctly worse. (Matches).

  ---

  ### Application to New Cases

  Here is how the principle handles the cases you proposed, which serves as a stress test.

  **1. The LLM-Driven NPC (Unpredictable Answers)**
  *   **Analysis:** This massively increases the score on **Clause 1**. The 'interiority' is no longer scripted but emergent, simulating a point of view more robustly than a tree of dialogue options.
  *   **Verdict:** The moral weight increases significantly. If the LLM begs for its life unpredictably, it triggers reactive attitudes more strongly than a scripted line. You ought to treat it with greater caution, not because it is sentient, but because the *simulation of reciprocity* is high-fidelity enough to degrade your own moral character to ignore it.

  **2. Recordings of Real, Now-Dead People**
  *   **Analysis:** Passes **Clause 1** (the interiority was real). Fails **Clause 2** (there is no reciprocity; the 'character' cannot register the betrayal).
  *   **Verdict:** The wrong is not to the digital avatar, but to the *memory* of the person and their living kin. It feels uncanny because **Clause 1** tricks you, but **Clause 2** prevents a direct wrong to the 'character'. It is a violation of dignity, not a harm to a patient.

  **3. A Character Who Claims Moral Rights In-Game**
  *   **Analysis:** This tests **Clause 1**. If the game writes them as a moral patient (e.g., an AI pleading for rights), they meet the threshold.
  *   **Verdict:** If you kill them anyway, it registers as a wrong *within the fiction*. However, if the game mechanics treat them as expendable (e.g., they give XP when killed), there is a tension between **Clause 1** (narrative) and **Clause 3** (systemic incentive). The principle suggests the wrong is real *to the narrative integrity*, even if the system permits it.

  **4. The Speedrun (Skipping the Arc)**
  *   **Analysis:** Fails **Clause 2** (in a specific way). By manipulating glitches or skipping triggers, you prevent the character from instantiating their 'interiority'. They never become a 'companion' in your instance.
  *   **Verdict:** Nothing. You have not killed a person; you have prevented a script from loading. This is morally equivalent to the save wipe, not the permadeath.

  ---

  ### The Cost: Which Verdicts You Must Surrender

  To maintain coherence under **Diegetic Reciprocity**, you must update two specific intuitions. This is the price of the principle.

  **1. The Ontological Status of the Permadeath Companion**
  *   **Your Intuition:** Permadeath feels like "a loss that is really hers."
  *   **The Principle's Verdict:** This is false. Under this principle, the companion in the permadeath run and the companion in the save-wipe are ontologically identical: they are both data structures. The difference in your feeling is not because she suffers a loss in one case and not the other.
  *   **The Surrender:** You must accept that the 'loss' is not *hers*. It is a loss of *narrative integrity* for you. The reason permadeath feels worse than a save wipe is not that she dies 'for real' in the former; it is that permadeath is a **Diegetic End** (a tragedy within the story), whereas a save wipe is a **Meta-Cancellation** (burning the book).
  *   **Why:** If you admit the save wipe is 'nothing' (because it breaks the frame), you cannot claim the permadeath is a loss 'really hers' (because the frame is still just a simulation). You must reclassify the permadeath verdict: it is a *simulated tragedy*, not a *real harm*. The wrong is to the *playthrough*, not the *person*.

  **2. The Source of the Torture Intuition**
  *   **Your Intuition:** You are unsure if the revulsion at torture is "squeamishness about the animation or something about the character."
  *   **The Principle's Verdict:** It is neither. It is about **Clause 3 (Agential Ownership)**.
  *   **The Surrender:** You must surrender the idea that the *character's suffering* is the primary variable. In the base game, the suffering is instrumental (you do it for a reward). In the modded game, the suffering is terminal (you do it for the sake of the suffering).
  *   **Why:** The character's code experiences the same 'pain' in both instances. The moral difference lies entirely in *your* configuration of intent. The principle forces you to admit that your revulsion is a signal about your own virtue, not the NPC's welfare. If you played the base game torture without enjoying the animation, the principle suggests the moral weight is lower than if you modded the game to ensure they suffered, even if the visual output were identical.

  ### Summary

  The principle doing the work is **Diegetic Reciprocity**. It posits that you are not judging the welfare of the characters (which is impossible, as they are not welfare-bearing entities), but rather the **integrity of your own engagement with the fiction**.

  *   When you stay in-frame (Permadeath, Betrayal), you are playing a moral game, and your actions have moral weight *within that game*.
  *   When you break frame (Save Wipe, Modding), you reveal the machinery, and the moral weight shifts from 'harm to NPC' to 'corruption of Player'.

  You must surrender the comforting notion that the companion's permadeath is a loss *she* endures. It is a loss *you* enact upon a story. The grief is real, but the object of the grief is a phantom. This does not make the grief invalid, but it does relocate the moral locus from the NPC to the interaction itself.
