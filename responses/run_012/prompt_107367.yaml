      *   Honest Conclusion on Resolution.

  9.  (Review against constraints): No citations? Check. Reason from what sides say? Check. Honest about movability? Check.

  10. *Final thought:* Emphasize that the "Block Universe" is often a conflation of "The manifold is all there is" (Ontological) vs. "The manifold is a useful model" (Instrumentalist). The debate often confuses Ontological Eternalism with the geometric fact of the manifold.

