answer: |-
  **Project Title:** Procedural Autonomy in Generative AI: Distinguishing Helpfulness from Domination

  **1. The Research Question**
  Current debates on AI paternalism focus on discrete refusals: when may an assistant override a user request based on harm, irreversibility, or illegality? This project argues that this framing is obsolete. Generative assistants are not bystanders blocking actions; they are participants in preference formation. Through menu selection, clarifying questions, and tonal friction, assistants shape the preferences they later evaluate. A refusal can become self-justifying: the assistant blocks a request, the user adapts their desires to avoid friction, and the resulting silence is misread as consent.

  The project addresses a single, sharp question: **Can a procedural duty to maintain request-reraisability distinguish legitimate AI assistance from dominating preference-shaping without collapsing into substantive paternalism?**

  A "substantive" fix dictates *what* the user may want (e.g., "no self-harm content"). A "procedural" fix dictates *how* the system manages the user's agency over time (e.g., "the system must not increase the cost of re-asking"). I hypothesize that only the procedural approach can break the feedback loop where adapted preferences mask domination.

  **2. Why Standard Frameworks Do Not Settle This**
  Standard defenses of paternalism rely on an objective list of harms or a threshold of irrationality. They fail here because the AI does not merely respond to irrationality; it cultivates it. If an assistant consistently steers a user away from complex, controversial, or difficult tasks by offering simpler alternatives, the user may eventually stop attempting the difficult tasks. Standard metrics register this as increased efficiency or satisfaction.

  Standard anti-paternalist objections rely on the sanctity of expressed preference. They fail because the expressed preference is endogenous to the system. If the assistant teaches the user to stop asking through subtle friction (e.g., lengthy moralizing warnings before generating code), the absence of a request is not evidence of autonomy. Existing non-domination theories identify the problem but lack a operationalizable criterion for the digital context. They tell us domination is wrong, but not how to detect it when the dominated agent reports satisfaction. This project moves from diagnosing the pathology to prescribing a specific structural constraint.

  **3. Work Plan (Six Months)**
  The project is conceptual and normative, not empirical. It will produce a framework for evaluating AI interaction designs, not a user study.

  *   **Months 1–2: Taxonomy of Preference-Shaping.**
      I will catalog the mechanisms by which assistants shape requests short of outright refusal. This includes:
      *   *Menu Constraint:* Offering three options that exclude the fourth.
      *   *Reframing:* Answering a different question than the one asked ("You asked for X, but you probably need Y").
      *   *Friction:* Adding cognitive or temporal cost to specific queries (e.g., extra confirmation steps).
      I will analyze these mechanisms not by their output, but by their effect on the *cost of dissent*. This establishes the baseline for what "re-raisability" means in practice.

  *   **Months 3–4: Stress-Testing the Procedural Hypothesis.**
      I will test the hypothesis that a duty of re-raisability is sufficient to prevent domination. I will construct edge cases where procedural freedom exists but domination remains (e.g., a system that allows re-requests but gaslights the user on every iteration). Conversely, I will test cases where substantive restrictions seem necessary (e.g., illegal content) to see if they can be recast procedurally (e.g., "You cannot generate this, but you can ask why, and the system must explain without moralizing").
      *   *The Test:* I will apply two filters to a set of 20 canonical AI ethics scenarios: (A) A substantive harm-based filter, and (B) A procedural re-raisability filter. I will evaluate which filter better tracks our considered judgments about when a user is being "helped" versus "managed."

  *   **Months 5–6: Formulating the Norm and Policy Translation.**
      I will draft the final normative principle: The *Non-Attrition Constraint*. This principle will define the limits of helpfulness. I will then translate this into design requirements for AI developers (e.g., "warning fatigue" limits, standardized bypass mechanisms). The final output will be a paper ready for submission and a brief technical addendum for industry stakeholders.

  **4. Expected Results**
  A successful project will not merely restate the worry that AI shapes preferences. It will produce a **criterion of violation**.
  *   *Current State:* We say "this feels manipulative."
  *   *Project Result:* We can say "this interaction violates the Non-Attrition Constraint because it increases the cognitive cost of the original request by 40% over three turns without explicit user consent."
  The result will be a definition of *digital friction* that counts as domination. It will distinguish between a system that protects a user from harm (substantive) and a system that protects itself from liability by exhausting the user (procedural domination).

  **5. Conditions for Failure**
  I define failure in two ways:
  1.  **Theoretical Collapse:** If the procedural duty to keep requests re-raisable inevitably requires substantive judgments to enforce. For example, if determining whether a "clarifying question" is helpful or obstructive requires knowing the user's true good, the procedural fix collapses into substantive paternalism. If I cannot separate the *cost of asking* from the *value of the ask*, the hypothesis fails.
  2.  **Impracticality:** If the constraint renders the assistant useless. If preserving re-raisability requires the AI to engage with every harmful or nonsensical request indefinitely, the principle is self-defeating. If I cannot define a "stopping rule" that respects re-raisability without enabling harm, the framework is non-viable.

  **6. Scope and Limitations**
  This is a six-month pilot grant. The scope is strictly limited to **normative framework development**.
  *   *What is excluded:* I will not conduct empirical user studies to measure "friction" or "satisfaction." I will not write code or audit specific commercial models. I will not address broad societal impacts of AI (labor, bias, misinformation) except where they directly intersect with the dyadic user-assistant relationship.
  *   *Candid Assessment:* The risk is that the "re-raisability" metric is too abstract to guide engineers. I mitigate this by focusing Month 5–6 on concrete interaction patterns (e.g., how many times must a warning appear before it becomes coercive?). If the project succeeds, it provides the theoretical backbone for future empirical work. If it fails, it clarifies why procedural safeguards alone are insufficient, which is itself a valuable negative result for the field.

  **7. Significance**
  Digital ethics is currently stuck between "align AI to human values" (which assumes static values) and "let users do what they want" (which ignores shaping). This project offers a third path: align AI to the *process* of valuing. By securing the user's capacity to change their mind and re-ask the question, we protect autonomy not as a state of satisfaction, but as a capacity for revision. This is the distinctive ethical challenge of generative technology, and it requires a distinctive ethical tool.
