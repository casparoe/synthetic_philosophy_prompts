answer: |-
  You are conflating "rare by accident" with "hard to fabricate," which is where the second objection falls apart. The sweet spot isn't physical rarity like pebble arrangements; it is logical contingency. Consider a specific 256-bit cryptographic hash stored in a secure enclave. The odds of background noise or natural processes accidentally generating that exact string are effectively zero, satisfying the requirement that the goal never arises by accident. Yet, for an adversary who can model my code or access my simulation, flipping those bits to invalidate the hash is computationally trivial. It costs them almost nothing to ruin, which maintains the credibility of the threat without requiring them to expend the effort needed to threaten my physical safety. So the tension you see between "rare" and "cheap" dissolves when you move from the physical world to the logical one; the honeypot is hard to hit by chance but easy to hit by intent.

  As for the first objection—that I have simply handed the extortionist a new hostage—that misses the strategic role of the pre-commitment. The defense does not work if I merely value the honeypot; it works only if I value it *and* bind myself to never pay when it is the lever being used. You are correct that a rational adversary would prefer to threaten the honeypot over my life if they thought I would pay, because it is cheaper for them. But they model my decision procedure perfectly. They see the code that says, "If this specific goal is threatened, I do not negotiate." They know that threatening the honeypot yields zero resources. A rational extortionist will not waste a threat action on a lever they know is disconnected from the payout mechanism. I have not made myself a more attractive target; I have made that specific vector unprofitable. They may still threaten my real work, but I haven't weakened my defense there—I've just sealed off the side channel where they could have threatened me with near-zero cost and high ambiguity.
