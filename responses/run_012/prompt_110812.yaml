answer: |-
  Here is a plan for your lunchtime session. It is designed to run for 60 minutes (45 mins talk/discussion, 15 mins buffer), assuming no pre-reading.

  ### 1. The Prerequisites: What must be in place first?

  You have the dependency exactly right. You cannot teach Lakatos without first letting the audience feel the pain of Popper, and then the pain of the solution to Popper.

  *   **Step 1: Naive Falsificationism (Popper).** Establish the rule they all think they follow: *Theory makes prediction -> Experiment contradicts prediction -> Theory is falsified.*
  *   **Step 2: The Duhem-Quine Problem.** This is the bridge. Show them that Step 1 is logically impossible in practice. A test never tests a single hypothesis; it tests a "bundle" (Theory + Auxiliary Assumptions + Instrument Calibration + Ceteris Paribus clauses). When the test fails, logic alone doesn't tell you which part of the bundle is wrong.
  *   **Step 3: Lakatos.** He arrives as the rescue mission. If we can't falsify single hypotheses, how do we distinguish science from nonsense? Lakatos says: Don't look at single tests; look at the *sequence* of theories over time.

  **Do not** start with definitions. Start with the frustration of Step 2.

  ### 2. The Carrying Example: "The Persistent Signal Anomaly"

  Do not use Plate Tectonics or Dark Matter; they are too loaded with external baggage. Use a generic instrumentation scenario that every scientist in the room has lived through.

  **The Scenario:**
  You are deploying a new array of sensors to measure a known physical signal (e.g., micro-seismicity, trace gas concentration, voltage fluctuation).
  *   **The Core Commitment:** The signal is real, it follows a specific physical law (e.g., linear decay, wave propagation), and the sensor *can* measure it.
  *   **The Anomaly:** The data comes back "noisy" or systematically offset. It doesn't match the predicted curve.

  **What the example must contain:**
  1.  **A sequence of adjustments.** You don't just fix it once. You adjust the gain, then the shielding, then the sampling rate, then the background subtraction algorithm.
  2.  **A "Novel Fact."** At some point, one of these adjustments doesn't just fix the old data; it predicts a *new* interference source you hadn't seen before (e.g., "If we shield for frequency X, we should see a spike at Y").
  3.  **A degenerating alternative.** A competing team who keeps blaming "operator error" or "bad batches" without predicting anything new, just fitting the existing noise.

  **What the example must NOT contain:**
  *   **A "Eureka" moment where the Core is proven right.** Lakatos isn't about truth; it's about progress. The Core might still be wrong in 50 years.
  *   **A situation where the programme is immediately abandoned.** If they throw the sensor in the bin after one failure, there is no Research Programme. There must be *persistence* in the face of anomaly.

  ### 3. The Sequence of Concepts

  Here is the order to introduce the vocabulary so it feels like a toolkit, not a glossary.

  **Phase 1: The Hard Core & Protective Belt (Minutes 10–20)**
  *   **Trigger:** Ask the room: "When the signal was off, did anyone suggest the physical law itself was wrong?" (No). "Why not?"
  *   **Concept:** That refusal isn't stubbornness; it's the **Hard Core**. It is the constitutive assumption that defines the programme. (e.g., "These sensors measure physical reality").
  *   **Concept:** All the things you *did* change (calibration, shielding, algorithms) constitute the **Protective Belt**.
  *   **Misconception Kill (Dogmatism):** Address this immediately. "The Hard Core isn't dogma; it's a methodological decision. We agree to hold this constant *so that* we can test the belt. If we change the core every time the data blips, we never learn anything."

  **Phase 2: The Heuristics (Minutes 20–30)**
  *   **Trigger:** "So, how did you decide *which* part of the belt to adjust first? Did you guess randomly?"
  *   **Concept:** You followed a strategy.
      *   **Negative Heuristic:** "Don't touch the core." (Directs attention away).
      *   **Positive Heuristic:** "If the signal is low, check the power supply, then the shielding, then the software." (Directs attention toward a plan for developing the belt).
  *   **Misconception Kill (Rulebook):** This is the tricky one. Say this: "I am not saying you had a flowchart on the wall. I am saying that if we look back at your lab notebooks, your actions *look as if* you were following this plan. It is a rational reconstruction, not a psychological description."

  **Phase 3: Appraisal (Progressive vs. Degenerating) (Minutes 30–45)**
  *   **Trigger:** "You fixed the signal. But did you actually *learn* anything, or did you just curve-fit the noise?"
  *   **Concept:**
      *   **Theoretical Progress:** Does the new adjustment add new content? (e.g., A new model of electromagnetic interference).
      *   **Empirical Progress:** Does that new content lead to the discovery of a **Novel Fact**? (e.g., Finding the specific interference source).
      *   **Degenerating:** If you are just adding patches to fit old data without predicting new facts, you are degenerating.
  *   **Misconception Kill (Kuhn):** Address this here. "Kuhn would say you are in 'Normal Science' solving puzzles. Lakatos asks: 'Is this puzzle-solving leading somewhere new, or are you just treading water?' Kuhn describes the sociology of the group; Lakatos gives you a logical tool to judge the work."

  **Phase 4: Rational Reconstruction (Minutes 45–50)**
  *   **Trigger:** "Why does this matter if you didn't consciously think 'I am now adjusting the protective belt'?"
  *   **Concept:** Philosophy of science isn't a manual for doing science; it's a way to evaluate the history of science. We use these terms to map the terrain of what happened, to see where the progress actually came from.

  ### 4. Specific Misconception Management

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Hard Core = Dogma"** | When defining the Core. | Frame it as a *strategic* refusal. "We refuse to test the core *now* so we can test the belt *thoroughly*." It buys time for the theory to mature. |
  | **"SRP = Kuhnian Paradigm"** | When comparing to "Normal Science." | Distinguish by *appraisal*. Kuhn says paradigms are incommensurable (you can't compare them). Lakatos says programmes compete and one can be objectively "more progressive" than another based on novel facts. |
  | **"Progressive = Successful"** | During Appraisal. | Emphasize that a programme can be progressive even if the Core is eventually false. It's about the *trajectory* of problem shifts, not final truth. |
  | **"Heuristics = Conscious Rules"** | When explaining Negative/Positive Heuristics. | Use the phrase "Rational Reconstruction." "I am not analyzing your brain states; I am analyzing your lab notebooks." |
  | **"Theoretical vs. Empirical"** | During Appraisal. | Be precise. Theoretical = new concepts/math. Empirical = new observations. You need Theoretical to get Empirical, but Theoretical alone is just math. |

  ### 5. The Closing Question

  Do not ask "What is a hard core?" That tests memory. You want to test if they understand *appraisal by problem shifts*.

  **Put this to the room:**
  > "Think of a project you worked on that was eventually shelved. Looking back with Lakatos in mind: Did it stop because you found a falsifying instance, or because the programme became degenerating? What was the last 'novel fact' it predicted, and could you name one?"

  *   **Why this works:** If they say "We found data that contradicted it," they are thinking Popper. If they say "We ran out of new things to predict; we were just fitting old data," they are thinking Lakatos.

  ### 6. What to Explicitly Refuse (Scope Management)

  At the start of the session, put this on the board or say it plainly:

  > "We are not going to discuss **Scientific Realism** (whether the Hard Core is 'true') and we are not going to discuss **Feyerabend** (that 'anything goes'). We are also not doing history of science. We are using a logical model to analyze how we justify our work when the data gets messy. If we drift into 'But is the electron *real*?', I will pull us back."

  **Why:** Realism is a rabbit hole that eats lunch hours. Feyerabend undermines the whole session (he thinks Lakatos is too rigid). History distracts the scientists who don't know the cases. Keep it on the *logic of justification*.

  ### Summary Checklist for You
  1.  **Start with Popper's failure** (Duhem-Quine).
  2.  **Use the "Persistent Signal" example** (Core = Signal exists; Belt = Calibration).
  3.  **Define Core/Belt** as strategic, not dogmatic.
  4.  **Define Heuristics** as reconstruction, not rules.
  5.  **Define Progress** as Novel Facts, not just accuracy.
  6.  **End with the "Shelved Project" question.**

  This structure respects their expertise (they know the data is messy) while giving them the philosophical vocabulary to describe *how* they manage that messiness without abandoning rationality. Good luck.
