answer: |-
  **Exam Question**

  **Question 1 (20 marks)**
  David Lewis's Counterpart Theory analyzes *de re* modality via similarity: 'I could have been F' is true iff a counterpart of me in some possible world is F. The counterpart relation is based on qualitative similarity and causal continuity, but Lewis explicitly denies it is an identity relation.

  Consider a Sorites-style chain of possible worlds. In $w_1$, my counterpart differs from me by one minor cell. In $w_2$, that counterpart's counterpart differs by one more cell. This continues for 1,000,000 steps until the occupant of $w_n$ is a maple tree.
  1.  Is the counterpart relation transitive? Explain how Lewis's view handles the claim "I could have been a maple tree" given this chain.
  2.  What implication does this have for the modal axiom S4 ($\Diamond\Diamond P \to \Diamond P$)?
  3.  Is the loss of S4 a fatal objection to Counterpart Theory, or is it a necessary cost to preserve the intuition that I am essentially human?

  *Note: Answers that merely recite the Humphrey objection ("It's not me, it's a counterpart") without addressing the transitivity chain and S4 will not receive credit above a passing grade.*

  ***

  **Model Answer**

  The chain of worlds presents a critical stress test for Counterpart Theory, forcing a choice between the transitivity of the counterpart relation and the validity of iterated modal principles. Lewis's verdict must be that I could *not* have been a maple tree, despite the chain. This requires denying that the counterpart relation is transitive and accepting the failure of the S4 axiom. This is not a fatal flaw, but a theoretically virtuous trade-off.

  First, the counterpart relation is fundamentally a relation of qualitative similarity weighted by contextual importance. Like most similarity relations, it is non-transitive. If $A$ is very similar to $B$, and $B$ is very similar to $C$, it does not follow that $A$ is very similar to $C$. In the chain described, my counterpart in $w_1$ is sufficiently similar to me to be my counterpart. The occupant of $w_2$ is sufficiently similar to the $w_1$ occupant to be *their* counterpart. However, similarity degrades over distance. The occupant of $w_n$ (the tree) shares insufficient relevant properties with me to qualify as *my* counterpart. Therefore, the statement "I could have been a maple tree" is false. There is no direct counterpart of me in $w_n$ that is a tree.

  This creates a tension with standard modal logic. In S5 (and S4) systems, possibility is transitive: if it is possible that $P$, and possible that (possibly $P$), then it is possible that $P$. Formally, $\Diamond\Diamond P \to \Diamond P$. In the chain, it is possible that I have a counterpart who has a counterpart... who is a tree. This makes $\Diamond\Diamond...\Diamond (\text{I am a tree})$ true. If S4 holds, this iterated possibility collapses into simple possibility: $\Diamond (\text{I am a tree})$. But we have established that $\Diamond (\text{I am a tree})$ is false because the tree is not my counterpart. To maintain consistency, Lewis must reject S4. For the counterpart theorist, iterated modality does not collapse; $\Diamond\Diamond P$ does not entail $\Diamond P$.

  Is this loss of S4 fatal? Critics argue it violates our logical intuitions about possibility. However, this objection assumes that the logic of metaphysical modality must mirror S5 regardless of the underlying analysis of *de re* claims. The Counterpart Theorist argues that our intuition that "I am essentially human" is stronger than our intuition that S4 is universally valid for *de re* claims. If we preserve S4, we must accept that I could be a tree (via the chain), which violates essentialist intuitions. If we preserve essentialism, we must drop S4.

  Dropping S4 is the superior option. The non-transitivity of the counterpart relation is not a bug waiting to be patched; it is doing real explanatory work. It allows the theory to respect local similarity judgments (each step in the chain is a valid counterpart relation) without committing to global absurdities (I am a tree). The "cost" is only a cost if one assumes the closure of possibility under iteration is more certain than the distinctness of kinds (human vs. tree). Since the chain argument relies on the premise that small changes preserve identity/counthood indefinitely, and Lewis denies this, the theory remains robust. The failure of S4 is simply the logical footprint of a similarity-based metaphysics. It shows that 'possibility' is not a monolithic operator but is sensitive to the distance of the counterpart relation. Thus, the chain does not refute Counterpart Theory; it clarifies that *de re* modality is context-sensitive and non-transitive, preserving the coherence of essential properties against Sorites-style erosion.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Analysis of Transitivity and the Chain (5 Marks)**
  *   **5:** Clearly identifies the counterpart relation as similarity-based and therefore non-transitive. Explains that while $w_1$ is a counterpart to Actual, and $w_2$ to $w_1$, $w_n$ is not a counterpart to Actual.
  *   **3:** Identifies non-transitivity but fails to explain *why* (similarity) or how it blocks the tree conclusion.
  *   **1:** Assumes the relation must be transitive or claims the theory implies I could be a tree.
  *   *Typical Blow-up:* Students treat counterparts as "identities in other worlds," forcing transitivity where Lewis denies it.

  **2. Handling the S4 Axiom ($\Diamond\Diamond P \to \Diamond P$) (5 Marks)**
  *   **5:** Explicitly identifies that Counterpart Theory entails the failure of S4. Explains that iterated possibility ($\Diamond\Diamond$) does not collapse into single possibility ($\Diamond$) in this framework.
  *   **3:** Mentions S4 is problematic but treats it as a logical error rather than a theoretical consequence.
  *   **1:** Claims S4 must be preserved at all costs or ignores the logical implication entirely.
  *   *Typical Blow-up:* Students assert S4 is a "law of logic" that cannot be violated, failing to see it as a constraint on the model.

  **3. Evaluation of the Cost/Verdict (5 Marks)**
  *   **5:** Takes a definite verdict (e.g., "Not a fatal flaw"). Argues that non-transitivity is explanatory work, not a bug. Defends losing S4 as preferable to losing essentialism (human vs. tree).
  *   **3:** Hedges or fence-sits ("It depends on your view of logic"). Acknowledges the cost but doesn't defend why it's acceptable.
  *   **1:** Concludes the theory is false because it violates S4, without weighing the alternative (accepting I could be a tree).
  *   *Typical Blow-up:* Students conclude the theory is broken because it conflicts with standard modal logic, missing the instruction to defend the verdict.

  **4. Adherence to Constraints & Clarity (5 Marks)**
  *   **5:** Avoids the Humphrey objection entirely. Focuses strictly on the chain/transitivity issue. Essay is structured and precise.
  *   **3:** Briefly mentions Humphrey but recovers to answer the specific question.
  *   **1:** Recites the Humphrey objection ("It's not really me") as the main argument, ignoring the chain prompt.
  *   *Typical Blow-up:* Students panic and write the standard "Humphrey" essay they memorized, failing to address the Sorites chain or S4.

  **Grade Differentiation Note:**
  *   **A Range (16-20):** Must score 5 on Criteria 3 & 4. The student must recognize that non-transitivity *solves* the problem and that the loss of S4 is a defensible theoretical cost, not a refutation.
  *   **B Range (12-15):** Typically scores 3 on Criteria 3. They identify the non-transitivity and S4 failure but treat it as a negative consequence or rely partially on the standard Humphrey objection rather than the chain logic.
