  4. You claim indeterminacy, but in a compactified state space or using Cesàro means, the sequence converges to a definite value. Physical states aren't mathematical artifacts; adding structure to force convergence begs the question against the physical reality of the switch. This is thin if you admit the state space is a modeling choice, so concede that physical justification for the specific topology is needed.

  5. If state-by-limit is false, do you accept brute contingency at accumulation points, or must you posit a new deterministic principle, and isn't either option fatal? I accept localized indeterminacy as the cost of preserving continuity elsewhere, avoiding the expense of a global deterministic overhaul. This is the thinnest spot, for if pressed on why *this* indeterminacy is acceptable, you have no non-ad-hoc criterion and should concede the theory is programmatic.
