answer: |-
  # Joint Statement on Truth and Paradox

  ### Agreed Claims
  1.  The Liar sentence ("This sentence is not true") is grammatically well-formed and meaningful.
  2.  The T-schema (True(A) iff A) is a central datum any adequate theory of truth must explain.
  3.  Classical logic (specifically Excluded Middle and Explosion) fails when applied to semantic paradoxes.
  4.  A non-classical logic is required to maintain a non-trivial theory of truth.
  5.  Truth is transparent; 'True(A)' and 'A' are intersubstitutable in most contexts.
  6.  The solution must avoid triviality (the conclusion that every sentence is true).
  7.  Negation does not behave classically in semantic contexts involving truth.
  8.  Semantic closure (a language capable of describing its own truth predicate) is a desirable goal.
  9.  Formal rigor is required; intuition alone is insufficient to resolve the paradox.
  10. Revenge paradoxes (new paradoxes arising from the solution itself) are a shared threat to both views.
  11. Normative assertibility (what we should say) differs from truth conditions (what is the case).
  12. The debate concerns the structure of logic and reality, not merely linguistic convention.

  ### Disagreements Table

  | Issue | Gap-Side Wording (Paracomplete) | Glut-Side Wording (Paraconsistent) | What Would Move Each |
  | :--- | :--- | :--- | :--- |
  | **Liar Status** | The Liar is semantically indeterminate (neither true nor false). | The Liar is semantically overdetermined (both true and false). | Proof that indeterminacy/overdetermination leads to triviality. |
  | **Logic Principle** | We must reject Excluded Middle (A v ~A) to avoid contradiction. | We must reject Explosion (A, ~A ⊢ B) to tolerate contradiction. | Demonstration that retaining the rejected principle preserves utility without collapse. |
  | **Negation** | Negation expresses exclusion; if not true, it implies a gap. | Negation allows overlap; if not true, it may still be true. | Consensus on a negation definition that handles both exclusion and overlap. |
  | **Truth Values** | Values are {True, False, Gap}. | Values are {True, False, Glut}. | A unified value set that accommodates both gaps and gluts without redundancy. |
  | **Assertion** | We should only assert what is strictly true (not gaps). | We may assert truths even if they are also false (gluts). | Agreement on normative rules for asserting paradoxical sentences. |
  | **Revenge** | Revenge arises from expressing "is only false." | Revenge arises from expressing "is exclusively true." | A solution that allows expressing exclusion without reintroducing paradox. |

  ### Cruxes and Tests

  **1. Disjunctive Syllogism (A v B, ~A ⊢ B)**
  *   **Shared Case:** A sentence known to be false or a gap/glut paired with a true sentence.
  *   **Gap Prediction:** Valid. Since gaps are not true, ~A eliminates the gap, preserving inference.
  *   **Glut Prediction:** Invalid. If A is a glut, ~A is also true, so eliminating A eliminates truth, breaking inference.
  *   **Test:** Which view better preserves ordinary reasoning while blocking paradox?

  **2. Reductio Ad Absurdum (If A ⊢ ⊥, then ~A)**
  *   **Shared Case:** Deriving a contradiction from the assumption that the Liar is true.
  *   **Gap Prediction:** Valid. Deriving contradiction proves the Liar is not true (a gap).
  *   **Glut Prediction:** Invalid. Deriving contradiction proves the Liar is true (and false).
  *   **Test:** Can we prove the Liar is false without proving it is true?

  **3. Expressive Completeness (Can we say "A is only false"?)**
  *   **Shared Case:** A sentence Excl(A) meaning "A is false and not true."
  *   **Gap Prediction:** Expressible. We can denote gaps explicitly.
  *   **Glut Prediction:** Problematic. If Excl(Liar) is true, Liar is only false, contradicting glut status.
  *   **Test:** Which view allows richer semantic expression without collapse?

  ### The Two-Negation Liar

  Consider a language with **weak negation (~)** (De Morgan: preserves gaps/gluts) and **strong negation (¬)** (Boolean: turns gaps to True, gluts to False).
  *   **Sentence S:** "S is not-weakly true" (S ↔ ~True(S)).
  *   **Sentence T:** "T is not-strongly true" (T ↔ ¬True(T)).

  **Analysis:**
  *   **Sentence S (Weak):** Both camps agree S is stable. For Gaps, S is a gap (neither true nor false); ~True(S) is a gap. For Gluts, S is a glut (both true and false); ~True(S) is a glut. The weak negation respects their respective value structures.
  *   **Sentence T (Strong):** Both camps agree T threatens their solution.
      *   **Gap View:** If T is a gap, ¬True(T) is True. Thus T is True. But if T is True, ¬True(T) is False. Thus T is False. This forces a contradiction, collapsing the gap solution into classical inconsistency.
      *   **Glut View:** If T is a glut, ¬True(T) is False. Thus T is False. This matches the "false" component of the glut. However, T is also True. If the logic allows strong negation to drive Explosion, triviality follows. If not, T remains a glut, but the T-schema must be restricted for strong negation.
  *   **Conclusion:** Strong negation reintroduces the Liar in a new form. For the Gap theorist, it destroys the gap. For the Glut theorist, it requires restricting the T-schema. Both agree strong negation is a "Revenge" vehicle that challenges semantic closure.

  ### Verbal or Genuine

  **Merely Verbal:**
  *   **Definition of "False":** The Gap theorist means "excludes truth"; the Glut theorist means "includes falsity (possibly with truth)."
  *   **Definition of "Logic":** Whether logic describes truth preservation (Gap) or non-falsity preservation (Glut).

  **Genuine Disagreement:**
  *   **Normative Constraints:** Can a rational agent accept a contradiction? The Glut theorist says yes; the Gap theorist says no.
  *   **Ontological Commitment:** Are there truth-value gluts in reality (inconsistent facts), or are gaps merely epistemic/semantic limitations?
  *   **Inference Validity:** Disjunctive Syllogism is either valid or invalid. This impacts mathematics and science, not just semantics.

  ***

  *Signed:*
  *The Paracomplete Theorist*
  *The Paraconsistent Dialetheist*
