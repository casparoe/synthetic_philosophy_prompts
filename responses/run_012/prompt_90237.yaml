prompt: |-
  I edit a science-and-ideas outlet, and I want to run an interactive 'which norm of assertion do you actually hold?' decision tree that walks a reader from the bare intuition that assertion is answerable to some standard to a named position. Build the branches out of the points where the candidate norms genuinely come apart rather than out of a list of labels: whether the standard is factive, so that asserting a falsehood is always a violation; whether it governs what a speaker may assert or what makes an assertion correct; whether a speaker can satisfy it without being in a position to know that they have; and what it implies about lottery propositions, Moore-paradoxical first-person assertions, and confident predictions about the future. Every node should be a question the reader can answer from the cases alone, with each case stated concretely enough to answer without knowing where it leads. The leaves should include the knowledge norm, the truth norm, the belief norm, a reasonable-or-justified-belief norm, and at least one view on which no single norm does the work; where the logical space permits a combination that no one seems to defend, include it, mark it as unoccupied, and diagnose whether it is incoherent, unattractive, or merely unexplored. Finally, tell me which leaves your tree cannot separate and why.
