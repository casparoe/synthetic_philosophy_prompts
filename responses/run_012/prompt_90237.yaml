answer: |-
  # The Assertion Audit: A Decision Tree for Epistemic Standards

  **Introduction**
  We assert things all the time. We state the weather, diagnose illnesses, and predict elections. But when do we break the rules? Philosophers of language argue that assertion is governed by a "norm"—a standard that determines whether an assertion is proper, correct, or permissible.

  This decision tree will not ask you to define terms like "factive" or "constitutive." Instead, it presents concrete cases. Your intuitions about these cases will route you to the normative position that best matches your commitments.

  ***

  ## 🌳 The Decision Tree

  ### Node 1: The Context Test (Monism vs. Pluralism)
  **Case:** Imagine two scenarios.
  1.  **The Coffee Shop:** You tell a friend, "The train leaves at 5 PM," based on a schedule you glanced at yesterday.
  2.  **The Courtroom:** A judge asks you under oath, "Does the train leave at 5 PM?" You give the exact same answer based on the exact same evidence.

  **Question:** Is the *rule* for whether you are allowed to assert the proposition the same in both cases, or does the rule itself change with the stakes?
  *   **The rule changes (stricter in court):** Go to **Leaf A (Contextualism/Pluralism)**.
  *   **The rule is the same (stakes just change how careful you should be):** Go to **Node 2**.

  ---

  ### Node 2: The Unlucky Expert (Factivity)
  **Case:** A doctor asserts to a patient, "You have Condition X." She has followed every protocol, reviewed all tests, and has overwhelming evidence. However, due to a freak biological anomaly unknown to science, the diagnosis is **false**.

  **Question:** Did the doctor violate a norm of assertion?
  *   **Yes:** She broke a rule, even though she wasn't negligent. (Assertion requires the world to match your words). Go to **Node 3**.
  *   **No:** She did everything right; the falsehood is just bad luck. (Assertion requires only that you be in a good epistemic position). Go to **Node 4**.

  ---

  ### Node 3: The Belief Requirement (Factive Branch)
  **Case:** A teacher is presenting a lesson on climate change. She has all the data and is justified in asserting, "Global temperatures are rising." However, due to a personal psychological block, she *does not personally believe* this proposition (she feels she is just reporting the consensus). She asserts it to the class anyway. The proposition is **true**.

  **Question:** Is this assertion improper because she lacks belief, or is it permissible because the claim is true and supported?
  *   **Improper:** You cannot assert what you do not believe, even if it's true. Go to **Node 5**.
  *   **Permissible:** Belief isn't required; truth and evidence are enough. Go to **Node 5 (Alternative Path)**.

  ---

  ### Node 4: The Selfless Assertion (Non-Factive Branch)
  **Case:** (Same as Node 3). The teacher asserts "Global temperatures are rising" without believing it, based on overwhelming evidence. We already established (in Node 2) that falsehoods are excusable if evidence is good.

  **Question:** Is the assertion permissible *because* she is justified, or is it impermissible *because* she lacks belief?
  *   **Impermissible:** You must believe what you say. Go to **Leaf B (The Belief Norm)**.
  *   **Permissible:** Justification is enough; belief is not required. Go to **Leaf C (The Justified Belief Norm)**.

  ---

  ### Node 5: The Lucky Guess (Access & Knowledge)
  **Case:** You have no evidence for a proposition $p$. You simply guess "The coin landed heads." It turns out **true**. (If you came from Node 3 Alternative Path, imagine you also lacked belief but guessed true).

  **Question:** Was the assertion *correct* (satisfied the standard), or was it a violation that merely happened to succeed?
  *   **Violation:** You shouldn't assert without an epistemic position that rules out luck. Go to **Leaf D (The Knowledge Norm)**.
  *   **Correct:** The standard is met if the claim is true (and believed, if you took that path). Go to **Leaf E** or **Leaf F**.

  ***

  ## 🍂 The Leaves: Your Normative Position

  ### Leaf A: Contextualism / Pluralism
  **Position:** There is no single norm of assertion. The standard shifts depending on the context (conversational, practical, or institutional).
  **Diagnosis:** You hold that what counts as "enough" to assert varies. In casual chat, truth might suffice; in science, knowledge is required.
  **Philosophical Allies:** MacFarlane, DeRose.

  ### Leaf B: The Belief Norm
  **Position:** Assert $p$ only if you believe $p$.
  **Diagnosis:** You view assertion as an expression of mind. The primary violation is insincerity. Truth is a goal, but not a rule; you can assert falsely without breaking the norm if you believed it.
  **Philosophical Allies:** Bach, some expressivists.

  ### Leaf C: The Justified Belief Norm (Reasonable Assertibility)
  **Position:** Assert $p$ only if you are justified/reasonable in believing $p$.
  **Diagnosis:** You prioritize the agent's internal perspective. The "Unlucky Expert" did nothing wrong because they were reasonable. Falsehoods are excusable errors, not violations.
  **Philosophical Allies:** Douven, Pritchard (on some readings).

  ### Leaf D: The Knowledge Norm
  **Position:** Assert $p$ only if you know $p$.
  **Diagnosis:** You hold the strictest monist view. Assertion is a tool for sharing knowledge. If you don't know it (even if it's true), you shouldn't say it. The "Unlucky Expert" violated the norm because they lacked knowledge (truth is required for knowledge).
  **Philosophical Allies:** Williamson, Unger.

  ### Leaf E: The Truth Norm
  **Position:** Assert $p$ only if $p$ is true.
  **Diagnosis:** You believe the sole constitutive aim of assertion is truth. Belief and justification are secondary heuristics to help you hit the target, but the only actual rule is "Don't lie (objectively)."
  **Philosophical Allies:** Weiner, early Frege interpretations.

  ### Leaf F: [UNOCCUPIED] The True-Belief Norm
  **Position:** Assert $p$ only if $p$ is true AND you believe $p$. (Justification/Knowledge not required).
  **Diagnosis:** **Unoccupied Space.**
  **Why?** This position is logically possible but philosophically unstable.
  1.  **Unattractive:** It forbids the "Unlucky Expert" (like the Knowledge Norm) which seems too harsh, but it permits the "Lucky Guesser" (unlike the Knowledge Norm) which seems too lax. It combines the worst features of Factive and Non-Factive norms.
  2.  **Redundant:** If you require Truth, adding Belief seems ad hoc unless you care about sincerity (which pushes you toward Belief Norm) or Knowledge (which pushes you toward Knowledge Norm).
  3.  **Incoherent Tension:** It makes the norm depend on a fact outside the speaker's ken (Truth) while demanding an internal state (Belief), without requiring the bridge (Justification) that makes the internal state responsive to the external fact.

  ***

  ## ⚠️ Limitations: What This Tree Cannot Separate

  No decision tree can perfectly map the landscape of philosophical disagreement. Here are the indistinguishable points where your intuition might not yield a unique label:

  **1. The Strict Truth Norm vs. The Knowledge Norm**
  Some proponents of the **Truth Norm** argue that while Truth is the *constitutive* norm (what makes an assertion correct), Knowledge is a *derivative* norm (a rule of thumb we should follow to ensure correctness).
  *   **The Problem:** In practice, a "Strict Truth Norm" advocate will advise you not to assert lottery propositions or lucky guesses, exactly like a **Knowledge Norm** advocate.
  *   **The Result:** The tree classifies you as Knowledge Norm if you reject lucky guesses, but you might theoretically hold a Truth Norm with derivative constraints. The tree measures your *practical* constraints, not your *metaphysical* grounding.

  **2. The Justified Belief Norm vs. The Knowledge Norm (Gettier Cases)**
  The tree separates these based on the "Unlucky Expert" (Falsehood). However, in cases where a belief is Justified and True but *not* Knowledge (Gettier cases), the **Justified Belief Norm** permits assertion, while the **Knowledge Norm** forbids it.
  *   **The Problem:** Most readers do not have stable intuitions about Gettier cases. If you find Gettier cases ambiguous, you cannot distinguish Leaf C from Leaf D using this tree alone.

  **3. Belief Norm vs. Justified Belief Norm (on Selfless Assertion)**
  The tree uses the "Selfless Teacher" to separate **Belief** (Leaf B) from **Justification** (Leaf C).
  *   **The Problem:** Some **Belief Norm** proponents argue that the teacher *does* believe the proposition in a dispositional sense, or that the case describes a violation (the teacher is being insincere). If you think the teacher is violating a norm, you land on Belief Norm; if you think they are proper, you land on Justified Belief. But if you think the case is incoherent (you can't have overwhelming evidence and no belief), the branch collapses.

  **4. Pluralism vs. Pragmatic Encroachment**
  **Leaf A (Pluralism)** says the *norm* changes with context. However, **Monists** (like Knowledge Norm proponents) often argue that the *norm* stays the same, but practical stakes change whether you *satisfy* the norm (e.g., you don't "know" in high-stakes contexts because your evidence isn't good enough).
  *   **The Problem:** If you answered "The rule changes" at Node 1, you might actually be a Monist who believes knowledge itself is sensitive to stakes. The tree treats this as Pluralism for simplicity, but the logical space overlaps.
