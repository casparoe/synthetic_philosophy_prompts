answer: |-
  Here is the desiderata list for your seminar. I have structured this to force a confrontation between the metaphysical commitments and the intuitive outputs of the theories your students will read.

  ### The Desiderata List

  **1. The Ontological Commitment Constraint**
  *   **The Case:** The Relata Question. If $C$ causes $E$, and $C$ is "the gardener's not watering," what is $C$?
  *   **The Constraint:** The theory is not allowed to treat "omission" as a primitive semantic placeholder without specifying its ontological category (fact, event, possibility, or counterfactual state). It cannot say "we know what it means" while remaining silent on what *is*.
  *   **Embarrasses:** Naive Event Ontologies (e.g., strict Davidsonians) who must stretch "event" to include non-occurrences, and Deflationary Pragmatists who refuse to answer the metaphysics.
  *   **Status:** **Non-Negotiable.** You cannot have a metaphysics of causation without a metaphysics of the relata.

  **2. The Profligacy Constraint (The Queen Test)**
  *   **The Case:** The Swamp Worry. My not watering the plants kills them. The Queen of England's not watering them also satisfies counterfactual dependence.
  *   **The Constraint:** The theory is not allowed to validate both as *causes* equally. It must provide a principled distinction between relevant and irrelevant absences without appealing solely to "interest."
  *   **Embarrasses:** Simple Counterfactual Dependence accounts (early Lewis) that lack a mechanism for selecting background conditions.
  *   **Status:** **Non-Negotiable.** If everything is a cause, nothing is.

  **3. The Agent-Neutrality Requirement**
  *   **The Case:** The Uninstalled Sensor. A security system fails because a part was never installed. No agent existed to have a duty; no expectation was violated.
  *   **The Constraint:** The theory is not allowed to restrict omission causation to *human* actions or duties. It must account for mechanical, biological, or structural absences.
  *   **Embarrasses:** Action-Theoretic reductions of causation and strong Normativist accounts that tie causation exclusively to moral/legal duty.
  *   **Status:** **Non-Negotiable.** Causation exists in physics and biology, not just in tort law.

  **4. The Normative Sensitivity Condition**
  *   **The Case:** The Driver vs. The Stranger. The driver who doesn't brake causes the crash; the stranger on the sidewalk who doesn't jump in front of the car does not (intuitively).
  *   **The Constraint:** The theory must explain *why* we select the driver's omission as the cause. It is not allowed to simply assert this is a "mistake" in folk intuition unless it provides an error theory.
  *   **Embarrasses:** Strict Physicalist/Process theories (e.g., Dowe) that deny omission causation exists at all (they have to call this an illusion), and Objectivist accounts that cannot accommodate context-sensitivity.
  *   **Status:** **Contested (House Rule vs. Metaphysics).** This is the fault line. Is normativity part of the *causal relation* or part of the *causal explanation*?

  **5. The Structural Integrity Rule (Double Omission)**
  *   **The Case:** The Handover Failure. Resident doesn't tell On-Call; On-Call doesn't check. Patient dies.
  *   **The Constraint:** The theory must be able to distinguish a chain of omissions from a single omission, and handle preemption where an omission prevents a preventive omission. It cannot collapse distinct causal paths into one blob of "negativity."
  *   **Embarrasses:** Coarse-grained fact accounts that lack structural resolution (early Lewisian influence).
  *   **Status:** **Non-Negotiable.** Technical adequacy for complex systems.

  **6. The Legal/Metaphysical Decoupling Clause**
  *   **The Case:** Liability Asymmetry. We punish acts more than omissions (no duty to rescue).
  *   **The Constraint:** The theory is not allowed to conflate *causal strength* with *liability*. It must explicitly state whether the legal asymmetry reflects a metaphysical difference in causation or a policy overlay on identical causation.
  *   **Embarrasses:** Legal Realists who define causation *as* liability, and Metaphysicians who insist the law *must* mirror folk metaphysics.
  *   **Status:** **House Rule.** Depends on whether the seminar is about law or metaphysics. But a theory must *choose*.

  ---

  ### The Incompatibility Matrix (Joint Unsatisfiability)

  You asked for the pairs that cannot be had together. This is where the seminar should spend its time.

  **1. Objectivity vs. Normative Sensitivity**
  *   **The Conflict:** If you satisfy the **Profligacy Constraint** (2) by using norms/expectations to filter out the Queen of England, you violate a strict reading of **Agent-Neutrality** (3) or at least compromise the **Objectivity** of the causal relation.
  *   **The Result:** You cannot have causation be a mind-independent feature of the universe *and* have it respect the Driver/Stranger distinction without importing context.
  *   **The Trade-off:** Either causation is "cheap" and objective (Queen is a cause, we just ignore her), or causation is "expensive" and context-sensitive (Queen is not a cause, but causation isn't purely physical).
  *   **Embarrasses:** Anyone trying to have their cake and eat it too (e.g., trying to ground norms in physics).

  **2. Relata Realism vs. The Reality of Omissions**
  *   **The Conflict:** If you satisfy the **Ontological Commitment Constraint** (1) by demanding relata be concrete existents (events/processes), you cannot satisfy the intuition that omissions are real causes. If omissions are real causes, the relata cannot be just concrete existents.
  *   **The Result:** You must either deny omissions are causes (Process Theory) or admit that "nothing" can be a relatum (Fact/Counterfactual Theory).
  *   **Embarrasses:** Event Ontologists who want to keep omissions.

  **3. The Legal Asymmetry vs. Metaphysical Symmetry**
  *   **The Conflict:** If the **Legal/Metaphysical Decoupling** (6) says causation is the same in law and physics, but the law treats omissions differently, then the law is not tracking causation. If the law *is* tracking causation, then causation itself is asymmetric regarding acts/omissions.
  *   **The Result:** A theory cannot claim metaphysical symmetry between act/omission while validating the legal intuition that they are fundamentally different kinds of liability without positing a non-causal reason for the legal difference.
  *   **Embarrasses:** Tort theorists who rely on "causation" to do the work of "duty."

  ---

  ### The Load-Bearing Requirement

  **The Normative Sensitivity Condition (4)** is the load-bearing wall.

  If you decide that normativity is *constitutive* of causation (i.e., you can't be a cause unless you violated a norm/expectation), you solve the Queen problem and the Driver/Stranger problem, but you make causation non-natural. It becomes a social construct.

  If you decide normativity is *pragmatic* (i.e., the Queen is a cause, we just don't mention her), you keep causation natural, but you admit our causal talk is systematically misleading.

  **What would change my mind:**
  If someone could demonstrate a **physicalist marker** for omissions. If there were a thermodynamic or information-theoretic signature unique to "preventive absences" that distinguished the Driver from the Stranger without referencing social norms, the Normative Sensitivity Condition would drop from "Constitutive" to "Heuristic." Until then, the choice between Naturalism and Normativism is the main event.

  ### My Soft Spot (Where I Might Be Wrong)

  I am likely being too hard on the **Ontological Commitment Constraint (1)**.

  There is a deflationary move (hinted at by some pragmatists) that argues asking "what is an omission?" is a category mistake akin to asking "what is the number 2 made of?" If causation is fundamentally a relation between *variables* in a model rather than *things* in the world, the relata question dissolves.

  If your students adopt a causal modeling interventionist framework (Woodward-style), they can bypass the ontology entirely. They can handle the Queen, the Driver, and the Double Omission purely through structural equations. My insistence on an ontological account might be a relic of a process/event metaphysics that the literature is trying to move past. If the seminar leans interventionist, Desideratum 1 might be a trap, not a requirement.
