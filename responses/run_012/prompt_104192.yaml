answer: |-
  The rain blurred the lights of the campus below, turning the seminar room into a sealed capsule of quiet intensity. Elena rubbed her temples, looking at the stack of papers between them. Marcus leaned back, arms crossed, staring at the whiteboard where "Cordelia" was written in fading marker.

  "Let's strip the aesthetics away," Elena said. "Cordelia is prosperous. It is democratic. It is not culturally suppressed. The Union speaks its language in parliament, funds its schools, and respects its courts. Their grievance is purely fiscal. They resent the transfers to the poorer provinces. If you grant them a primary right to secede based on distinct identity alone, you aren't defending self-determination. You're defending wealth hoarding."

  Marcus shook his head. "You're conflating motive with right. Why they want to leave matters less than whether they possess the moral authority to decide. Cordelia was incorporated by war two centuries ago. Even if the Union is just now, that original sin of coercion lingers. They possess a distinct political identity. They have maintained their linguistic institutions. If a majority in Cordelia votes to leave through a fair process, why is that insufficient? Why must they bleed before they can bargain?"

  "Because political communities are not clubs," Elena countered. "They are coercive structures that guarantee rights and welfare. If any distinct group can leave whenever they wish, stability becomes impossible. But more importantly, look at the moral hazard. Your view makes self-determination a prize for the already oppressed only in practice, but a privilege for the wealthy in theory. Cordelia wants to leave because they are rich, not because they are suffering. The remedial right exists to correct injustice, not to facilitate exit when the bills come due."

  "That is a brutal implication of your view, Elena," Marcus said, leaning forward. "You are saying that a people must endure serious and persistent injustice before they qualify for sovereignty. You make oppression a prerequisite for statehood. If Cordelia had been culturally suppressed, you'd support them. Because they are merely distinct and affluent, you deny them. That turns the right to secede into a remedy for abuse rather than an expression of agency. It tells distinct peoples: 'Wait until you are mistreated, then you may leave.' That is not justice; that is a trap."

  "It is a trap designed to prevent fragmentation," Elena replied. "But let's grant your point for a moment. Suppose we accept the primary right. We immediately face the boundary problem. You say 'Cordelia.' But Cordelia is a administrative unit drawn by the Union. Why is *that* the unit entitled to vote? There are valleys in northern Cordelia where the population identifies strongly with the Union. They fear becoming a permanent minority in a nationalist Cordelian state. Under your view, do they get a veto? Do they get to secede from Cordelia to stay in the Union?"

  Marcus paused. This was the friction point he had anticipated. "The boundary must be the existing administrative line. To allow every sub-region to vote would lead to infinite regress. A gerrymandered patchwork state is impossible."

  "So you privilege the existing administrative border simply because it exists?" Elena pressed. "That is arbitrary. Those Union-identifiers in northern Cordelia are being forced out of their political community against their will. You are prioritizing the external majority of Cordelia over the internal minority. This is the hostage objection. They are held hostage by the geography of the secession vote. They wished to remain in the Union, but your primary right allows Cordelia to take their territory and their bodies into a new state."

  "They have the right to exit," Marcus said, though his voice lacked its earlier certainty. "If the new Cordelian state respects basic rights, they can stay as citizens. If they cannot accept the new political identity, they can emigrate to the rump Union."

  "Exit is not consent," Elena said sharply. "Forcing someone to choose between abandoning their home and accepting a new sovereignty is a coercion of the highest order. My remedial view protects them. Since Cordelia suffers no injustice, there is no right to secede, so the Union-identifiers remain secure in their citizenship. Your view sacrifices their security for Cordelia's autonomy."

  "But your view sacrifices Cordelia for the Union's security," Marcus shot back. "You talk about stability, but you entrench the status quo. What if the Union is just today but becomes oppressive tomorrow? Your view requires the oppression to be 'serious and persistent.' That means suffering must accumulate before action is permitted. You are asking people to wait for the wound to infect before they can amputate. And regarding the rump Union—you speak of their welfare. But does the Union have a right to Cordelia's wealth?"

  "That is the fiscal-externality objection," Elena said. "Cordelia wants to take its tax base and leave the debt and the poor regions behind. They built their prosperity on the infrastructure and security of the Union. To leave without settling those obligations is to free-ride. The rump Union's interest in the welfare of its remaining citizens outweighs Cordelia's desire for independence if that independence impoverishes those left behind. Territorial integrity isn't just about lines on a map; it's about shared risk."

  "Political community is not an insurance scheme," Marcus argued. "It is a shared project of will. If the will is gone, the obligation fades. You argue that the Union's interest in integrity outweighs the secession claim. But integrity based on coercion is brittle. If Cordelia wants to leave, forcing them to stay breeds resentment, potentially creating the very injustice you require for secession. You might create the remedial case by denying the primary right."

  Elena sighed, looking out at the rain. "I concede that my view has a cost. It requires patience. It requires that we tolerate distinct peoples within a state until justice fails. That is uncomfortable. It means telling Cordelia that their distinctness is not enough. But the alternative is a world where every linguistic border is a potential war. However, I will grant you this: if the Union were to punish Cordelia for asking, that would generate the injustice required for remedial secession. So, paradoxically, denying your primary right might create the conditions for my remedial right."

  "And I will grant you this," Marcus said, tapping the table. "The boundary problem is not solved. Drawing the line at Cordelia's administrative border is convenient, but not morally pristine. We are privileging one level of identity over another without a neutral principle. And regarding the internal minority... perhaps exit is not enough. Perhaps they require special protections, veto powers over certain cultural laws. But if I grant them that, I am weakening the sovereignty of the new Cordelia, which undermines the point of secession."

  "Exactly," Elena said. "You cannot have it both ways. Either Cordelia is a sovereign state, in which case the minority is subject to its majority, or it is a constrained entity, in which case it hasn't truly seceded. This is why the remedial view is superior. It only triggers when the state has already failed to protect the group. Then, the boundary problem is less acute because the injustice defines the group—the persecuted are the unit."

  "But that returns to my complaint," Marcus said. "You offer nothing to peoples whose grievance is not injustice but distinctness. You make legitimacy contingent on suffering. I believe legitimacy comes from the continuous consent of the governed. If Cordelia no longer consents to the Union, the Union's legitimacy over Cordelia ends, regardless of fiscal transfers or historical stability."

  "And I believe legitimacy comes from justice," Elena replied. "Consent is too fluid. It shifts with the economy, with mood. Justice is structural. If the structure is just, the consent is presumed. If the structure is unjust, consent is withdrawn."

  They sat in silence for a moment. The disagreement hadn't narrowed; it had hardened into a clash over the foundation of political authority.

  "So," Marcus said softly. "We are left with this. For you, the Union holds Cordelia because the Union is just. For me, the Union holds Cordelia only as long as Cordelia wills it."

  "No," Elena corrected, gathering her papers. "For me, the Union holds Cordelia because the alternative is a system where wealth dictates borders and minorities within minorities are sacrificed. For you, the Union holds Cordelia only until the cost of belonging exceeds the value of identity."

  "And neither of us can prove the other wrong without invoking a higher authority we don't possess," Marcus said.

  "We can only watch what Cordelia does," Elena said, standing up. "If they leave, they prove your point about will. If they stay and resent it, they prove my point about the cost of justice. But if they leave and the northern valleys rise in revolt, then we both lose."

  "Then the theory ends where the violence begins," Marcus said.

  "Perhaps," Elena replied, turning off the light. "Or perhaps the theory is only useful to tell us what we are responsible for when the violence starts."
