answer: |-
  Your flatmate is half-right: you are doing philosophy, but it's the specific kind of philosophy that breaks AI safety research, so the "extra steps" are actually the job. You have intuitively stumbled onto the central trilemma of value alignment: **Rationality, Observability, and Normativity.**

  You have five views. Three of them cannot coexist without significant damage. Here is the audit, ranked by severity of the contradiction.

  ### 1. The Safety Dealbreaker: View (2) vs. View (3)
  **Severity: Critical**
  *   **The Clash:** View (2) says choices $\neq$ wants (the addict problem). View (3) says we should learn wants by watching choices (IRL). If humans systematically choose against their wants (due to addiction, bias, framing, or ignorance), then an AI trained via standard IRL will align itself to your *failures*, not your *values*. It will learn to supply the drug, not the recovery.
  *   **Why it's bad:** This isn't a philosophical quibble; it's a failure mode. If you build an AI on (3) while believing (2), you get a "Genie" that grants your revealed wishes while destroying your normative well-being.
  *   **The Cheapest Patch:** You must modify (3) to include a **model of human error**. You aren't learning a reward function from behavior; you are learning a reward function *and* a bias function from behavior. This is often called "Inverse Reinforcement Learning with Biases" or "Off-Correction."
  *   **The Cost:** You lose the purity of "just watching." To separate the signal (want) from the noise (bias), you have to hard-code *some* assumptions about what counts as a bias. This partially reintroduces the problem you wanted to avoid in (3) (writing the objective by hand), because you have to define "rationality" to detect "irrationality."

  ### 2. The Definitional Contradiction: View (1) vs. View (2)
  **Severity: High**
  *   **The Clash:** View (1) is **Revealed Preference Theory** (economics): Preference *is* choice. View (2) is **Internalism** (psychology/philosophy): Preference is a latent state that *causes* choice but can be obscured. You cannot claim preference is *nothing more* than tendency to choose (1) while simultaneously claiming there is a real gap between what is wanted and chosen (2).
  *   **Why it's bad:** It makes your terminology incoherent. If you say "I prefer to quit smoking" (2) but you keep smoking, View (1) forces you to say "You actually prefer to smoke." This makes it impossible to talk about self-improvement or regret.
  *   **The Cheapest Patch:** Abandon the word "preference" for one of these contexts. Keep (1) as "Revealed Preference" (a descriptive label for behavior) and keep (2) as "Normative Preference" (what you would choose under ideal conditions).
  *   **The Cost:** You admit that "preference" is not a single natural kind. You have to do the work of defining what "ideal conditions" are for (2), which is notoriously difficult (the "ideal advisor" problem).

  ### 3. The Technical Blindspot: View (4) vs. View (2) & (5)
  **Severity: Medium**
  *   **The Clash:** View (4) relies on the **Potential-Based Reward Shaping** theorem (Ng et al.). It correctly states that for an *optimal* agent, adding a state-dependent potential field doesn't change the policy. However, this theorem assumes the agent is *optimizing*. View (2) and (5) assert humans are *not* optimizing (we are addicted, contextual, habitual).
  *   **Why it's bad:** For suboptimal agents, different reward functions that are equivalent for optimal agents will produce *different* explanations for the same bad behavior. If a human makes a mistake, is it because they have a weird reward function, or because they are noisy? View (4) says this ambiguity doesn't matter; View (2) says this ambiguity is the entire problem (is the addict's reward function "drugs=good" or is it "health=good + error"?).
  *   **The Cheapest Patch:** Restrict View (4) to optimal agents only. Acknowledge that for humans, reward functions are **unidentifiable** without further assumptions.
  *   **The Cost:** You lose the mathematical comfort that the reward function is "real." You have to accept that the reward function you learn is partly a reflection of the model you assumed for human rationality.

  ### 4. The Stability Tension: View (1) vs. View (5)
  **Severity: Low**
  *   **The Clash:** View (1) implies a "standing tendency" (stability). View (5) says behavior is driven by context/framing (instability).
  *   **Why it's bad:** It makes prediction hard, but not logically impossible.
  *   **The Cheapest Patch:** Refine (1). A preference is a tendency to choose *given a specific context*. Preferences are functions of state, not just constants.
  *   **The Cost:** Your model of human values becomes high-dimensional and fragile. There is no "Human Utility Function," only "Human Utility Function in Context X."

  ---

  ### Ranking by Severity
  1.  **(2) vs (3):** Breaks the AI Safety project.
  2.  **(1) vs (2):** Breaks your conceptual framework.
  3.  **(4) vs (2/5):** Breaks the math/implementation.
  4.  **(1) vs (5):** Merely complicates the model.

  ---

  ### The Sacrificial Lamb: Which one to drop?

  **Drop View (1).**

  **Why:** View (1) (Revealed Preference) is the weakest link. It was invented by economists to make preferences measurable, not because it is ontologically true. It is a useful simplification for markets, but it is demonstrably false for individual psychology (as you noted in View 2).

  **What you gain by dropping it:**
  *   **Consistency with (2):** You can now freely admit that people choose things they don't want.
  *   **Consistency with (3):** You can pursue IRL, but you now know you are looking for *latent* rewards, not just mirroring behavior. This forces you to solve the "bias model" problem (the patch for 2 vs 3), which is necessary for safety anyway.
  *   **Consistency with (4):** You admit that because humans aren't optimal, reward ambiguity *does* matter, which aligns with modern alignment research (e.g., the "No Free Lunch" theorem in inverse reward design).
  *   **Consistency with (5):** You can accept that behavior is messy without contradicting your definition of preference, because preference is no longer defined *as* behavior.

  **The Cost:** You lose the behaviorist simplicity. You can no longer say "I know what you want because I saw what you did." You have to say "I know what you want because I saw what you did, *corrected for* the fact that you are tired, addicted, and framed by context."

  **Summary:** Your intuition in (2), (3), and (5) is actually more aligned with current state-of-the-art alignment research (like the work of Stuart Russell or Paul Christiano) than View (1) is. View (1) is the relic of 20th-century economics that is currently causing the most trouble in AI safety. Let it go.
