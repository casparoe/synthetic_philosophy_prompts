      *   *Check (3).* User says "work out human preferences by watching what people do." This is standard IRL. The conflict with (2) is the "Is-Ought" problem in RL.
      *   *Check (5).* If behavior is just context/habit, is there *any* signal for IRL? This makes (3) nearly impossible. I should highlight that (3) + (5) is optimistic/pessimistic tension.

  8.  **Final Polish:** Ensure the ranking is clear and the "Drop One" advice is decisive. (Dropping 1 is the standard move in modern alignment theory anyway—moving from Revealed Preference to Latent Preference).

  **(Self-Correction Note):** I need to make sure I don't sound like I'm dismissing the user. Their intuition is actually better than many intro textbooks. The "flatmate" comment suggests they feel imposter syndrome. Validate the intuition while correcting the logic.

  9.  **Final Plan:**
