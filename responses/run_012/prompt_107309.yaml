          *   Drafting: The essay captures the skeleton of Fukuyama's argument but fleshed it out with deterministic caricatures he never endorsed. While the core thesis regarding ideological exhaustion is present, the inference of complacency fundamentally misreads Fukuyama's warnings about internal decay. It is a useful shorthand only if stripped of its fatalistic conclusions.

