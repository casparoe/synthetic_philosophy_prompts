answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes

  **Question:**

  David Lewis analyses convention as a solution to a coordination problem: a regularity in behaviour sustained by common knowledge and conditional preferences, where an alternative regularity would have served equally well (the arbitrariness clause).

  Consider two household regularities. First, residents keep to the right in the corridor; violating this is awkward but not blameworthy. Second, whoever finishes the milk replaces it; violating this is considered wrong, not merely awkward. Both appear arbitrary and both rely on mutual expectation.

  1.  Critically assess whether Lewis's apparatus can explain the difference in normative force between these cases. Does the arbitrariness clause help generate genuine obligation, or does it obstruct it?
  2.  Lewis treats conventions as equilibria. If the household shifts from 'the finisher replaces' to 'the next shopper replaces', can Lewis's static analysis describe the transition? Must the old convention break down completely before the new one begins, or can one evolve into the other?

  ***

  ### Model Answer

  Lewis's account provides a robust structural description of social coordination, but it struggles to account for the normative depth of obligations or the dynamics of historical change. While the corridor and milk cases both satisfy Lewis's five conditions for convention, the distinction between 'awkward' and 'wrong' suggests that Lewisian convention is necessary but not sufficient for genuine obligation. Furthermore, Lewis's static equilibrium model describes the endpoints of social change but obscures the mechanism of transition.

  Regarding the first distinction, both the corridor and milk cases meet Lewis's criteria. In both, there is a regularity, common knowledge of that regularity, and a conditional preference to conform provided others do. Crucially, both satisfy the arbitrariness clause: the household could have kept left, or decided that the eldest replaces the milk, with equal coordination success. However, Lewis's apparatus explains coordination payoffs, not moral blame. In the corridor case, the payoff is avoiding collision; violation results in inefficiency (awkwardness). In the milk case, the payoff involves fairness and reciprocity. Violation is 'wrong' because it exploits the cooperation of others, not merely because it disrupts coordination.

  Here, the arbitrariness clause obstructs rather than aids the generation of obligation. If a regularity is truly arbitrary—meaning an alternative would have worked equally well—it is difficult to see why violating *this* specific regularity constitutes a moral wrong rather than a coordination failure. If driving on the left is arbitrary relative to the right, violating the right-side rule is dangerous, but not inherently unjust. Therefore, Lewis's definition captures the *structure* of the milk rule but misses its *normative force*. To explain the 'wrongness', one must import external normative premises, such as a principle of fair play, which lie outside Lewis's game-theoretic framework. Lewis explains why we *do* conform; he does not explain why we *ought* to, beyond prudential rationality.

  Regarding the second issue of change, Lewis's analysis is fundamentally static. It defines convention as a persistent equilibrium. Consequently, it describes the state of 'finisher replaces' and the state of 'shopper replaces' perfectly, but it cannot describe the movement between them without invoking a period of non-convention. For a shift to occur, the common knowledge sustaining the first equilibrium must be disrupted. If residents simply stop replacing milk, the convention breaks down into a coordination problem. A new convention emerges only when a new focal point (e.g., a house meeting or a salient event) establishes common knowledge of the new regularity.

  This implies that conventions cannot evolve smoothly; they must technically break down to be replaced. If the shift were gradual, there would be a period where the conditional preferences no longer aligned, violating the definition of convention. Thus, on a strict Lewisian reading, the transition is a breakdown followed by a fresh start, not a continuous evolution. However, this seems phenomenologically inaccurate. Households often drift into new rules without a period of chaos. To account for this, one would need to supplement Lewis with a theory of how common knowledge updates incrementally. Lewis's model treats the convention as a binary state (either it is an equilibrium or it is not), leaving no conceptual room for the 'during' of social change.

  In conclusion, Lewis successfully isolates the logic of coordination, but his framework is too thin to capture the full reality of social life. It cannot distinguish between mere habits and binding norms without external moral machinery, because the arbitrariness clause drains the specific regularity of intrinsic weight. Similarly, by treating conventions as static equilibria, the analysis renders the history of convention invisible, describing only the stable shores and not the river flowing between them. A complete social ontology requires Lewis's structural insights but must embed them within a richer theory of normativity and dynamic processes.

  ***

  ### Marking Scheme (20 Marks)

  **Part 1: Normative Force and Arbitrariness (10 Marks)**

  1.  **Recognition of Structural Identity (2 marks)**
      *   *Must hit:* Student identifies that *both* cases satisfy Lewis's definition (regularity, CK, conditional preference, arbitrariness).
      *   *Common Error:* Claiming the milk case fails the arbitrariness clause because it feels "necessary."

  2.  **Limitation of Lewisian Normativity (3 marks)**
      *   *Must hit:* Student argues Lewis explains prudential rationality (coordination) but not moral obligation (wrongness/blame).
      *   *Common Error:* Confusing the "preference to conform" with a moral duty to conform.

  3.  **Role of the Arbitrariness Clause (3 marks)**
      *   *Must hit:* Student argues arbitrariness *obstructs* obligation (if X and Y are equal, why is breaking X *wrong*?).
      *   *Common Error:* Arguing that arbitrariness makes the rule stronger because it is purely social.

  4.  **External Source of Obligation (2 marks)**
      *   *Must hit:* Student suggests the 'wrongness' comes from outside Lewis (e.g., fairness, reciprocity, free-riding).
      *   *Common Error:* Attempting to derive moral 'ought' solely from Lewis's game-theoretic 'is'.

  **Part 2: Convention Change and Dynamics (10 Marks)**

  5.  **Static Nature of Equilibrium (2 marks)**
      *   *Must hit:* Student identifies Lewis's account as static/descriptive of states, not processes.
      *   *Common Error:* Treating the equilibrium as a dynamic force that pushes toward change.

  6.  **Necessity of Breakdown (3 marks)**
      *   *Must hit:* Student argues that strictly speaking, the old convention must cease (breakdown) before the new one holds.
      *   *Common Error:* Suggesting two conventions can coexist during the transition period.

  7.  **Role of Common Knowledge in Shift (3 marks)**
      *   *Must hit:* Student notes that a new focal point or update in Common Knowledge is required to lock in the new equilibrium.
      *   *Common Error:* Attributing change to individual preference shifts without the social knowledge component.

  8.  **Critique of the Binary Model (2 marks)**
      *   *Must hit:* Student notes the phenomenological problem (real life allows drift/evolution, Lewis requires breakdown).
      *   *Common Error:* Accepting Lewis's binary model as a complete description of social reality without critique.
