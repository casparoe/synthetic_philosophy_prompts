answer: |-
  **KELMETH LOWER: LATE BRONZE AGE OCCUPATION**
  **Phase IIIb (ca. 1140–1090 BCE)**

  Excavations at Kelmeth Lower have revealed a substantial domestic and administrative complex occupying approximately 0.4 hectares. Stratigraphic analysis confirms a single period of intensive use lasting fifty years, supporting a resident population of 120–150 individuals. The site organization reflects a highly stratified social structure, evidenced by the spatial segregation of production areas from domestic zones.

  The presence of pierced bone discs in Context 44 indicates standardized manufacture. The uniformity of diameter across the assemblage suggests production within a centralized workshop rather than household-level craft. The existence of a centralized workshop implies the presence of attached specialists removed from subsistence agriculture. Attached specialists indicate a controlling authority capable of redistributing surplus calories. This controlling authority is interpreted as a localized elite, whose power was legitimized through ideological control. Consequently, the workshop is understood as an instrument of a hereditary priesthood managing regional exchange.

  Economic consolidation is further demonstrated by the cache of polished axes recovered from Storage Pit 7. Microscopic analysis shows no evidence of use-wear, indicating these items were never utilized for timber processing or combat. The deposition of unused utilitarian objects in a storage context indicates a votive offering rather than economic reserve. This behavior confirms that economic assets were subordinate to ritual requirements. Similarly, the storage pits containing animal bone represent feasting debris associated with periodic renewal ceremonies, while the empty pits indicate deliberate decommissioning following ritual consumption.

  The burnt clay floor of Structure 1 provides evidence of intentional conflagration. The even distribution of vitrification suggests the fire was maintained at a consistent temperature, inconsistent with accidental destruction by conflict or negligence. This thermal event marks the ritual closure of the building. Associated with this layer is Deposit 12, a mixed matrix of ash, unworked stone, and charcoal. The inclusion of unworked stone in a domestic context has no functional explanation and is therefore classified as a ritual deposit, likely serving as a foundation offering or a terminus marker for the priestly tenure.

  The material culture of Kelmeth Lower thus outlines a theocratic administration where production, storage, and destruction were governed by ceremonial protocol. The standardization of artifacts reflects social control, while the deposition of wealth reflects religious obligation. While these interpretations provide a coherent framework for the archaeological record, it must be noted that we cannot fully know what these people believed. To speculate on internal states based solely on material residue remains methodologically problematic, though the physical evidence strongly supports the institutional model presented here.

  ***

  **SIDEBAR: WHAT THE OBJECTS TELL US!**

  *   **The Bone Discs:** All the discs are the same size! This means workers followed strict rules set by a boss.
  *   **The Axes:** These axes are too shiny to be tools. They were gifts for the gods.
  *   **The Burnt Floor:** The building wasn't destroyed by accident. The people burned it on purpose to finish a ceremony.
  *   **The Population:** Exactly 120 to 150 people lived here. We know this by counting the rooms.
  *   **The Leaders:** The priests were in charge of all the food and tools.
