      *   *Clarification on Claim 4:* Claim 4 says SP is dissolved. This is true for the *original* game with log utility. Claim 6 says Super SP exists. If Super SP exists, is *that* paradox dissolved? Claim 6 says "yes, harmless." But if EU is infinite, EU theory says you should pay anything to play. That contradicts Claim 5 (modest sum). So Claim 5 and Claim 6 are also in tension if Claim 6 implies infinite EU games are possible.
