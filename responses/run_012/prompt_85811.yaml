answer: |-
  ### Specification of Desiderata for an Account of the Identity of Indiscernibles

  The following list constitutes the adequacy conditions for any metaphysical account of the Principle of the Identity of Indiscernibles (PII). Each item includes the requirement, the motivating case or consideration, and a verdict on its negotiability.

  **1. Logical Orthodoxy**
  *   **Requirement:** The account must preserve the standard logic of identity (reflexivity, symmetry, transitivity) and the Indiscernibility of Identicals ($a=b \rightarrow \forall F(Fa \leftrightarrow Fb)$), unless it provides an explicit, independent argument for revising logical constants.
  *   **Motivation:** To ensure the dispute is metaphysical rather than notational. Revising logic to save a metaphysical principle often dissolves the problem rather than solving it.
  *   **Verdict:** **Non-negotiable.** (Unless the project is explicitly about non-classical logic).

  **2. Qualitative Purity (Non-Triviality)**
  *   **Requirement:** The properties admitted for discernibility must be purely qualitative. Impure properties (e.g., *being identical to a*, *being located at place L* where L is named by indexical) are excluded from the discernibility base.
  *   **Motivation:** Cases 1 & 2 (Symmetric Spheres). If impure properties are allowed, PII becomes a logical triviality ($a$ has the property *being a*, $b$ does not), rendering the principle vacuous.
  *   **Verdict:** **Non-negotiable.** (Without this, PII is tautological).

  **3. Metaphysical Priority**
  *   **Requirement:** The account must ground distinctness in ontology, not epistemology. It cannot rely on what an observer could know, name, or describe.
  *   **Motivation:** General Constraint. The question is whether distinct objects *can* exist, not whether we can *tell* them apart.
  *   **Verdict:** **Non-negotiable.**

  **4. Modal Explicitness**
  *   **Requirement:** The account must explicitly categorize the principle as: (a) a necessary metaphysical truth, (b) a contingent regularity of the actual world, or (c) a constraint on descriptive adequacy.
  *   **Motivation:** General Constraint. Ambiguity here allows accounts to shift goalposts when confronted with possible worlds vs. actual physics.
  *   **Verdict:** **Non-negotiable.**

  **5. Symmetric World Verdict**
  *   **Requirement:** The account must issue a determinate verdict on Case 1 (Black's Spheres): either the world is impossible, it contains one object, or it contains two objects. This verdict cannot be reached by stipulating the answer.
  *   **Motivation:** Case 1. This is the canonical test case. An account that remains agnostic or says "it depends on description" fails to address the metaphysical reality.
  *   **Verdict:** **Non-negotiable.**

  **6. Non-Circular Relational Grounding**
  *   **Requirement:** If distinctness is grounded in relations (Case 2), the account must explain how the relation obtains without presupposing the relata are already distinct.
  *   **Motivation:** Case 2 (Asymmetric Embedding). Saying "they are distinct because they bear different relations" risks circularity if the relations (e.g., *being a mile from the other*) presuppose two distinct terms.
  *   **Verdict:** **Non-negotiable.** (Circular grounding is explanatory failure).

  **7. Weak Discernibility Status**
  *   **Requirement:** The account must specify whether irreflexive relations (Case 3: *having opposite spin to*) count as sufficient for discernibility. If yes, it must show this does not collapse PII into the claim that "nothing bears an irreflexive relation to itself."
  *   **Motivation:** Case 3. This tests the boundary between qualitative difference and numerical difference.
  *   **Verdict:** **Camp Commitment.** (Some accounts accept weak discernibility; others require monadic properties).

  **8. Permutation Invariance**
  *   **Requirement:** The account must state whether swapping the spheres in Case 1 yields a distinct possible world (Haecceitism) or the same world (Anti-Haecceitism).
  *   **Motivation:** Case 4. This determines whether the account posits primitive thisness or reduces identity to structure.
  *   **Verdict:** **Camp Commitment.** (Though it has downstream consequences for D10).

  **9. Symmetric Destruction Explanation**
  *   **Requirement:** In Case 5 (Symmetric Destruction), the account must explain whether there is a fact of the matter regarding *which* sphere is destroyed, and if not, how the outcome is metaphysically coherent.
  *   **Motivation:** Case 5. Tests the account's handling of symmetry breaking and future contingents without hidden variables.
  *   **Verdict:** **Non-negotiable.** (Must avoid contradiction or brute mystery).

  **10. Quantum/GR Consistency**
  *   **Requirement:** The account must reconcile or distinguish Case 6 (Quantum Particles) from the Hole Argument in General Relativity. It must explain why permutation invariance in QM does/does not imply the same ontological conclusion as diffeomorphism invariance in GR.
  *   **Motivation:** Case 6. Inconsistency here suggests the account is ad hoc or physically uninformed.
  *   **Verdict:** **Non-negotiable.** (Internal consistency requirement).

  **11. Set-Theoretic Extensionality**
  *   **Requirement:** The account must clarify its implication for Case 7 (Pure Sets). If sets are individuated solely by membership, does this support PII, or is set-theoretic identity a different category?
  *   **Motivation:** Case 7. Ensures the account applies to abstracta or explains why it is restricted to concreta.
  *   **Verdict:** **Camp Commitment.** (Some restrict PII to spatiotemporal objects).

  **12. No Brute Cardinality**
  *   **Requirement:** The account should not posit numerical distinctness as a brute fact without a grounding difference (Case 1 & 10).
  *   **Motivation:** General Requirement. "There are just two" without a "what makes them two" is theoretically costly.
  *   **Verdict:** **Non-negotiable.** (Theoretical virtue; violating this makes the account a form of primitivism).

  **13. Grounding vs. Counting Distinction**
  *   **Requirement:** The account must distinguish between what *makes* two things distinct (grounding) and what allows us to *say* there are two things (counting conditions).
  *   **Motivation:** General Requirement. Prevents conflating epistemic access with ontological basis.
  *   **Verdict:** **Non-negotiable.**

  **14. Intuition Explanation**
  *   **Requirement:** If the account rejects PII, it must explain why the principle possesses intuitive force. If it accepts PII, it must explain why symmetric worlds seem conceivable.
  *   **Motivation:** General Requirement. An account that treats the opposing intuition as sheer stupidity fails phenomenological adequacy.
  *   **Verdict:** **Non-negotiable.**

  **15. Non-Verbality**
  *   **Requirement:** The account must demonstrate that the dispute is not merely verbal (e.g., about the definition of "property" or "object").
  *   **Motivation:** General Requirement. Ensures the debate tracks genuine metaphysical disagreement.
  *   **Verdict:** **Non-negotiable.**

  ***

  ### Inconsistent Subsets of Desiderata

  The following subsets of the above desiderata cannot be jointly satisfied. An adequate account must reject or modify at least one member of each set. This is the core argumentative leverage for your paper.

  **Subset A: The Black Trilemma**
  *   **Members:** D2 (Qualitative Purity), D5 (Symmetric World Verdict: Two Objects), D12 (No Brute Cardinality).
  *   **The Conflict:**
      1.  If the world contains two spheres (D5), they are numerically distinct.
      2.  If they are numerically distinct, there must be a ground for this distinctness (D12).
      3.  In a symmetric world, there are no qualitative differences (intrinsic or relational) to ground this distinctness.
      4.  Therefore, the ground must be non-qualitative (a haecceity).
      5.  But haecceities are excluded by Qualitative Purity (D2).
      6.  **Result:** You cannot maintain that symmetric worlds contain two objects, that distinctness requires grounding, and that only qualitative properties count. One must go: either symmetric worlds are impossible (reject D5), distinctness is brute (reject D12), or haecceities are allowed (reject D2).

  **Subset B: The Quantum/Classical Tension**
  *   **Members:** D2 (Qualitative Purity), D10 (Quantum/GR Consistency), D12 (No Brute Cardinality).
  *   **The Conflict:**
      1.  Quantum mechanics (Case 6) suggests particles of the same type in the same state share all qualitative properties (D2).
      2.  Yet we count them as many (e.g., two electrons).
      3.  If we treat them as individuals with brute distinctness, we violate D12.
      4.  If we treat them as non-individuals, we face difficulty reconciling this with GR spacetime points (Case 6/10), which are often treated as individuated by location (which is relational/qualitative) but face the Hole Argument (which suggests location isn't enough without haecceities or structuralism).
      5.  **Result:** Maintaining a unified ontology for physics (D10) while demanding qualitative grounding (D2) and no brute facts (D12) creates a contradiction between the standard interpretation of QM and the requirements of classical metaphysics.

  **Subset C: The Weak Discernibility Circle**
  *   **Members:** D6 (Non-Circular Relational Grounding), D7 (Weak Discernibility Status: Yes).
  *   **The Conflict:**
      1.  Weak discernibility relies on irreflexive relations (e.g., *x is opposite spin to y*).
      2.  For an irreflexive relation to hold, the relata must already be distinct (a thing cannot be opposite to itself).
      3.  Therefore, the relation *presupposes* distinctness rather than *grounding* it.
      4.  **Result:** Using weak discernibility to satisfy D5 (Two Objects) violates D6 (Non-Circular Grounding). The relation cannot do the metaphysical work of individuation if it requires individuation to obtain.

  ***

  ### Note on Damaged Positions

  This specification damages **Moderate Realism** and **Structuralist** accounts most severely.

  *   **Moderate Realism** (PII is contingent) struggles with **Subset A**. It wants to say symmetric worlds are possible (D5) and distinctness is real, but usually wishes to avoid brute facts (D12) and haecceities (D2). It is forced into the uncomfortable position of admitting brute diversity in symmetric worlds.
  *   **Structuralism** (objects are nodes in a structure) struggles with **Subset C**. It relies heavily on weak discernibility (relations) to individuate nodes without haecceities. If the relations presuppose the distinctness of the nodes (as per D6), the structuralist account becomes circular.
  *   **Haecceitism** avoids Subset A but damages **D2** and **D14**. It saves the possibility of symmetric worlds by positing primitive thisness, but at the cost of making PII trivial (violating the spirit of D2) and making the intuition against haecceities (D14) hard to explain.
  *   **Eliminativism/Nominalism** (there are no such objects, only tropes or stuff) avoids the trilemma but struggles with **D10** and **D11**, as it must radically reinterpret standard physics and set theory.

  The specification forces a choice: accept brute facts, accept haecceities, or deny the possibility of symmetric worlds. There is no cost-free solution.
