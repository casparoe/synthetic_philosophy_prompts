answer: |-
  # JOINT STATEMENT ON AUTHENTICITY, REPLICATION, AND VALUE
  **Signed by the Empiricist Coalition (Camp A) and the Contact Theory Coalition (Camp B)**

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge that while our metaphysical and axiological commitments diverge, we share a common factual and conceptual baseline. To prevent further dialogue from talking past one another, we stipulate the following:

  1.  **The Capabilities of the Perfect Replica:** We agree that a molecule-for-molecule replica, indistinguishable by any current or foreseeable scientific instrument, successfully reproduces all *perceptual* and *sensory* properties of the original object. It reflects light identically, possesses identical texture, weight, and chemical composition. We further agree that such a replica does *not* reproduce the *historical* properties of the original (e.g., "painted by Hand X in Year Y"). Both sides accept that the disagreement lies solely in whether those historical properties contribute to the *artistic* value of the encounter.
  2.  **The Psychology of Knowledge:** We agree that a viewer's knowledge of an object's provenance alters their subjective experience of it. Standing before a verified original typically induces a heightened state of attention, reverence, or emotional resonance compared to standing before a known copy. Camp A characterizes this as a cognitive bias or contextual framing effect; Camp B characterizes this as a rational recognition of ontological status. Both sides agree the psychological shift is real, even if we disagree on its justification.
  3.  **The Deception Constraint:** We agree that fraud (passing a copy off as an original) is ethically and legally wrongful on independent grounds (theft, lying, market manipulation). This debate explicitly excludes deceptive forgeries. We isolate the case of the **Non-Deceptive Replica**: a copy known by all parties to be a copy. The question is whether a Non-Deceptive Replica can ever hold equal *artistic* standing to the original, not whether it can hold equal *market* standing.
  4.  **Definition of "The Original" Across Media:** We agree that "originality" functions differently across mediums and must be defined by the norms of the practice, not a monolithic rule.
      *   *Unique Objects (Oil on Canvas):* The original is the specific physical matter manipulated by the artist.
      *   *Multiples (Prints, Photographs):* The original is any print pulled from the master plate/negative authorized by the artist within the declared edition.
      *   *Casts (Bronze Sculpture):* The original includes casts made from the artist's mold during their lifetime or under estate authorization; posthumous casts from the same mold occupy a contested category we agree to label "Authorized Later Casts."
      *   *Conceptual/Instruction Works:* The original is the correct execution of the artist's specification. Any physical instantiation that follows the recipe is an original; the "work" is the instruction set, not the matter.
  5.  **Separation of Value Types:** We agree that three distinct categories of value are currently conflated in public discourse. We commit to distinguishing them in future arguments:
      *   **Aesthetic Value:** The quality of the perceptual and emotional experience afforded to the viewer.
      *   **Historical/Trace Value:** The value of the object as a physical witness to a specific moment in time and a specific human action.
      *   **Institutional/Market Value:** The monetary price and status conferred by museums, auctions, and provenance records.
      *   *Stipulation:* Camp A argues Art is primarily Category 1. Camp B argues Art is an inseparable fusion of Category 1 and Category 2. Both agree Category 3 is often irrational and should not dictate the philosophical debate.

  ## II. STATEMENTS OF DISAGREEMENT

  **Camp A (The Empiricist Position):**
  "The artwork is defined by the experience it generates. If two objects generate identical experiences, they are artistically identical. The premium placed on the original object is a form of commodity fetishism—a confusion of art with relic worship. When a viewer prefers the original despite identical perceptual input, they are valuing the *history* of the object, not the *art* in the object. To claim the copy is 'lesser' is to privilege ownership and pedigree over perception. The art is in the looking, not in the biography of the canvas."

  **Camp B (The Contact Position):**
  "The artwork is not merely a stimulus for experience but a record of human agency. The value of the work is constitutively tied to the fact that *this* specific arrangement of matter was chosen by *that* specific person. A perfect copy, however visually identical, is a different kind of object—like a map is different from the territory. The 'aura' of the original is not a superstition; it is the recognition of the causal chain linking the viewer to the artist's creative act. To remove the history is to remove the work's identity. We do not value the ring because it is shiny; we value it because it was placed on a finger in a vow. So too with art."

  ## III. CRUXES AND TEST CASES

  We identify four philosophical cruxes where our views fundamentally diverge. For each crux, we apply six specific test cases. We record our predictions in advance to allow for future resolution.

  **Crux 1: Relational-Historical Properties**
  *Question:* Are properties like "innovative," "sincere," "derivative," or "ahead of its time" genuine *aesthetic* properties, or are they merely historical facts about the work?
  *   **Camp A:** These are historical contexts, not aesthetic properties. A line is beautiful regardless of who drew it first.
  *   **Camp B:** These are aesthetic properties. A line cannot be "innovative" unless it is historically the first of its kind. The aesthetic quality supervenes on the history.

  **Crux 2: Final vs. Instrumental Value of Contact**
  *Question:* Is the physical contact with the artist's hand valuable in itself (Final), or only because it helps us understand the artist better (Instrumental)?
  *   **Camp A:** Instrumental. If a copy taught us the same thing, the contact would be irrelevant.
  *   **Camp B:** Final. The contact is part of the good. Knowing it touched their hand adds value even if no new information is gained.

  **Crux 3: Supervenience**
  *Question:* Does aesthetic value supervene entirely on the physical/perceptual properties of the object?
  *   **Camp A:** Yes. No difference in physical properties means no difference in aesthetic value.
  *   **Camp B:** No. Two physically identical objects can have different aesthetic values if their histories differ.

  **Crux 4: The Relic Analogy**
  *Question:* Is the value of the original analogous to the value of a wedding ring or a saint's relic?
  *   **Camp A:** Yes. It is sentimental and associative. It belongs to the domain of memory, not art criticism.
  *   **Camp B:** No. A relic is valued for *who* touched it. Art is valued for *what was done* through it. The agency is the point, not the person.

  ### Agreed Test Cases & Predictions

  | Test Case | Camp A Prediction (Empiricist) | Camp B Prediction (Contact) |
  | :--- | :--- |
  | **1. The Molecular Twin:** A molecule-for-molecule painting created in the same year by an unknown contemporary, with no deception involved. | **Equal Artistic Value.** It possesses all aesthetic properties. The anonymity is irrelevant to the visual experience. | **Lower Artistic Value.** It lacks the specific agency of the named artist. It is a coincidence, not a statement. |
  | **2. The Superior Forgery:** A forgery discovered decades later that experts agree is more beautiful/competent than the mediocre original it replaced. | **Upgrade.** We should display the forgery. The aesthetic good is higher. The original is now a historical curiosity only. | **Category Error.** The forgery is not "that work." It is a different work entirely. We must display the original because it is the authentic record, flaws and all. |
  | **3. The 80% Restoration:** A painting where 80% of the pigment has been replaced due to decay, but the original composition and some original material remain. | **Still the Work.** If the visual experience is preserved, the work survives. The matter is a vessel. | **Threshold Breach.** If the majority of the causal trace is gone, it becomes a copy *of* the original. The chain of custody is broken. |
  | **4. The Repudiated Work:** A genuine early work the artist later publicly repudiated and denied making (though provenance confirms it). | **Valid Work.** The object exists and affords an aesthetic experience. The artist's later opinion is external context. | **Invalidated.** The artist's intent defines the corpus. If they reject it, it is not part of the artistic oeuvre, merely a physical artifact. |
  | **5. The AI Model:** A model trained on one artist's whole corpus produces something visually superior to anything they made. | **New Aesthetic Good.** It creates value. It may not be "by" the artist, but it delivers the aesthetic goods the artist aimed for. | **Derivative Nullity.** It simulates the style without the agency. It is a mirror, not a source. It has no artistic standing, only technical interest. |
  | **6. The Infinite Scan:** A perfect digital scan distributed at zero cost while the original commands millions. | **Democratization.** The scan provides the aesthetic good to all. The original's price is market inefficiency/snobbery. | **Loss of Presence.** The scan removes the "here and now." The value lies in the singular encounter with the physical trace. |

  ## IV. FALSIFIABILITY AND VERBAL DISPUTES

  **Evidence Against Camp A (Empiricists):**
  We would revise our position if it were demonstrated that knowledge of provenance consistently alters the *low-level perceptual processing* of viewers (e.g., eye-tracking, neural response) in a way that cannot be attributed to top-down cognitive framing. If the "original" literally looks different to the human brain in a measurable, non-suggestible way, then the historical property has become a perceptual property.

  **Evidence Against Camp B (Contact View):**
  We would revise our position if a Non-Deceptive Replica were shown to sustain the same depth of critical engagement, emotional resonance, and scholarly insight over a long duration (generations) as the original, without the audience feeling a sense of "loss" or "absence." If the contact value is truly essential, its absence should eventually degrade the work's ability to function culturally.

  **Is This Merely Verbal?**
  We acknowledge a significant portion of this dispute rests on the definition of the word **"Artwork."**
  *   If "Artwork" means *The Physical Object*, Camp B wins (there is only one physical object).
  *   If "Artwork" means *The Visual Experience*, Camp A wins (experiences can be replicated).
  *   If "Artwork" means *The Performance of Creation*, Camp B wins (performances cannot be replicated, only re-enacted).

  **Resolution:** We agree that the dispute is not *merely* verbal, because it dictates material action (restoration protocols, museum display choices, market regulation). However, we concede that if Camp A defines "Art" as "Aesthetic Experience" and Camp B defines "Art" as "Historical Act," we are arguing about different nouns. To move forward, we agree to use the compound term **"Art-Object-Event"** to acknowledge that both the physical instance and the historical generation are in play, allowing us to debate the *weighting* of each rather than the definition.

  **Signed,**

  *The Empiricist Coalition*
  *The Contact Theory Coalition*
