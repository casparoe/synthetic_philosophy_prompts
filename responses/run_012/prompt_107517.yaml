      *   *Claim 2 (Psychology):* Knowing something is real changes the experience. Both agree on the *fact* of the psychological shift, even if they disagree on whether that shift is *justified*.
      *   *Claim 3 (Deception):* Fraud is bad legally/morally. The debate is about *disclosed* replicas.
      *   *Claim 4 (Definition of Original):* Acknowledge medium specificity. Paintings = unique object. Prints/Photos = authorized editions. Conceptual = instruction execution.
