      *   *Crux 3: Supervenience.* Does aesthetic value supervene on physical properties?
          *   A: Yes.
          *   B: No.
      *   *Crux 4: Relic vs. Art.* Is it like a wedding ring?
          *   A: Yes, it's sentimental fetishism.
