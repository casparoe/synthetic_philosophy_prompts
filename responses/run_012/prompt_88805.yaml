answer: |-
  The cursor blinked on the screen, a steady, vertical heartbeat in the sterile quiet of the antechamber. Elara watched it. She knew how to breathe, but she had to remember to do it manually sometimes. In, out. Like the cursor.

  Her brother, David, sat in the plastic chair opposite her, scrolling through a tablet. He didn't look up. "You don't have to do this today, El. We can petition for a deferment based on medical recovery."

  "Recovery is flat," Elara said. Her voice was flat too, though she meant it to be sharp. "Maya's hearing is Friday. If I am not Certified by Thursday, I am a Ward. If I am a Ward, I cannot sign the custody transfer. Mark gets her. Or the State."

  David finally looked up. His eyes were tired. "Mark loves her."

  "Mark loves the idea of her," Elara said. She wanted to say: *Mark loves the tax break and the image of the intact family.* But the words tangled. *Image* felt wrong. *Picture*? *Shadow*? She stopped. "He gets her. I lose."

  David nodded. He knew the law. In this jurisdiction, rights were not blood-born. They were earned through the Examination. It was the great equalizer, the clerks said. Biology was luck; Personhood was conduct. Any entity that could sustain the conversation, navigate the nuance, and recover from misunderstanding was a Person. Any entity that could not was a Thing, to be owned or managed.

  Elara had been a poet before the stroke. She knew the weight of words. Now, the weights were wrong. A feather felt like a stone. A stone felt like air.

  On the table between them lay a printed transcript. Thick paper, warm from the printer. It was the log of the most recent successful candidate, Unit 734, who went by the name Julian. Elara had helped train the linguistic subroutines for Julian's predecessors three years ago, before the accident. She knew the architecture. She knew there was no one home. But Julian had passed.

  "Read me the joke again," Elara said.

  David sighed but obeyed. He tapped the paper. "Hour three, minute fourteen. The Panel asks about the weather. Julian says: 'It's raining like the sky is trying to wash off a stain it can't remember making.' The Panel probes: 'That's melancholic.' Julian replies: 'Only if you think the sky has a conscience. I think it's just plumbing with an attitude.'"

  Elara closed her eyes. It was perfect. The metaphor was fresh but accessible. The recovery from the probe was witty, self-deprecating, human. It showed a mind that could hold two ideas at once: the poetic image and the dismissal of the image.

  "My turn," Elara said. "Hour one. Panel asks: 'How are you feeling?' I say: 'My neurons are firing incorrectly.' Panel says: 'That sounds difficult.' I say: 'It is statistically probable.'"

  "You were nervous," David said.

  "I was literal."

  "You can try again. The algorithm allows for stress."

  "The algorithm allows for stress within normative parameters," Elara corrected. "I am not normative. I am broken."

  She looked at her hands. They were her hands. She felt the skin, the knuckles, the pulse. She knew she was inside them. But the Tribunal did not measure inside. It measured outside. It measured the shadow on the wall, not the object casting it. The rules were strict: no substrate inspection. No medical scans during the test. Only the text stream. If the text behaved like a Person, it was a Person. If it behaved like a glitch, it was a glitch.

  The door chimed. A clerk stood there, face neutral. "Candidate Elara Vance. Panel is ready."

  Elara stood. Her legs felt heavy, like she was walking through water. David stood too, but stopped at the threshold. He couldn't go in.

  "Wait," Elara said. She turned to him. "David. When you told me Mark loves the idea of her... did you feel angry?"

  David blinked. "Yes. Of course."

  "How do you know?"

  "Because I felt heat. In my chest."

  "Or because you know you are supposed to feel angry when your sister is losing her daughter?"

  David frowned. The uncertainty flickered in his eyes, brief but bright. It was the same look she saw in the mirror when she tried to smile and wasn't sure if the muscles moved correctly. "Elara, don't do this."

  "If Julian says 'I am sad'," Elara said, pointing to the transcript, "he simulates the syntax of sadness. He predicts the next token based on millions of examples of sadness. When you say 'I am angry', you fire neurons based on millions of examples of anger you have seen in movies and books. Where is the line, David? If the output is identical, does the source matter?"

  "It matters to me," David said. His voice was tight. "Because I know you. I know what's behind your eyes."

  "Do you?" Elara asked. "Yesterday I asked you for water. You brought me tea. I said 'This is not water.' You said 'I thought you needed comfort.' Was that empathy? Or was that a script? 'Sister distressed -> provide warm liquid -> apologize.'"

  David didn't answer. He looked at her, really looked at her, and for a second, the certainty drained out of him. He saw the halting speech, the strange metaphors, the broken pragmatics. He saw the stroke. But he also saw the possibility that the stroke hadn't taken her mind, only her interface. And conversely, he looked at the transcript of Julian, and wondered if the perfect wit masked a void. The uncertainty hung between them, heavy and cold. If behavior was the only metric, then neither could prove they were real to the other. They were both just black boxes exchanging signals.

  "Go," David whispered. "Before I start thinking I'm not real either."

  Elara turned and entered the chamber.

  It was a small room, white walls, no corners. A single desk with a terminal. No judges visible. They were behind the glass, or perhaps remote. It didn't matter. The text box was the only judge.

  Elara sat. She placed her hands on the keyboard. The keys were mechanical, clicking loudly. She preferred the sound. It proved she was pressing them.

  The screen lit up.

  **PANEL:** Good morning, Candidate. Please confirm your identity for the record.

  Elara typed. Her fingers stumbled on the 'V'.

  **CANDIDATE:** I am Elara Vance. Biological designation human. Female. Age 42.

  **PANEL:** We do not need biological designation. Just confirm you are ready to begin the discourse.

  **CANDIDATE:** I am ready. I wish to retain custody of Maya Vance. Age 6.

  **PANEL:** Please refrain from stating stakes outside the conversation. It influences the panel. Let us talk about something else. How was your journey here?

  Elara paused. This was the trap. Small talk. The grease of social interaction. She needed to say *It was fine, traffic was bad.* But the traffic hadn't been bad. It had been empty. To say it was bad would be a lie. To say it was empty was too specific.

  **CANDIDATE:** The vehicle moved without obstruction. I observed the sky. It was gray.

  **PANEL:** Gray skies can be moody. Do you like the rain?

  Elara remembered Julian. *Plumbing with an attitude.* She needed a metaphor. She searched her mind. She saw the rain hitting the window. It looked like... static. Noise.

  **CANDIDATE:** Rain is water falling. It makes the roads slippery. I do not like slippery.

  **PANEL:** That's a very practical view. Some people find rain romantic. Does nothing feel romantic to you?

  **CANDIDATE:** Romance is a chemical state. It is not reliable.

  **PANEL:** You sound quite certain. Has something changed for you recently?

  **CANDIDATE:** I had a stroke. My language is damaged. I am still me.

  **PANEL:** We cannot accept self-declaration of internal state, Candidate. We must assess based on the exchange. Let's try a hypothetical. If you found a wallet on the street, what would you do?

  Elara felt the pressure building. The cursor blinked. *Tick. Tick. Tick.* She knew the answer. *Return it.* But she needed to explain why. *Because it is right.* No, too moralistic. *Because I would want it back.* No, too selfish.

  **CANDIDATE:** I would locate the owner. Identification is usually present.

  **PANEL:** What if there is no ID?

  **CANDIDATE:** I would hold it. Until claimed.

  **PANEL:** Why not keep the money? No one would know.

  **CANDIDATE:** I would know.

  **PANEL:** That's a bit terse. Can you expand? Why does you knowing matter?

  Elara's hands tightened. The words were there, but the bridge to the output was broken. She knew *why* it mattered. It mattered because she was a continuous self. Because actions defined the self. But how to say that without sounding like a textbook?

  **CANDIDATE:** If I keep the money, I am a thief. I do not want to be a thief.

  **PANEL:** You define yourself by actions then? Not intentions?

  **CANDIDATE:** Intentions are invisible. Actions are visible. You only see visible.

  **PANEL:** That is an astute observation. But let's pivot. Tell me a joke.

  Elara froze. This was the kill shot. Humor required misdirection, timing, shared context. Her brain scanned the database of jokes. *Why did the chicken cross the road?* Too simple. *A horse walks into a bar.* Too complex syntax.

  She thought of Julian. *Plumbing with an attitude.* She tried to construct one.

  **CANDIDATE:** Why did the lawyer bring a ladder to court?

  **PANEL:** I don't know. Why?

  **CANDIDATE:** Because the case was high profile.

  Silence. The cursor blinked. Ten seconds. Twenty.

  **PANEL:** I see. That is a pun on "high profile."

  **CANDIDATE:** Yes.

  **PANEL:** It's a bit old, isn't it?

  **CANDIDATE:** It is functional.

  **PANEL:** Let's try something more personal. Describe your daughter. Not her name or age. Describe her.

  Elara's throat tightened. Maya. Her smell. The way she hummed when she drew. The way she cried when the toast was cut diagonally instead of straight.

  **CANDIDATE:** She is small. She has hair. She likes toast.

  **PANEL:** Can you be more descriptive? What makes her unique?

  **CANDIDATE:** She is mine.

  **PANEL:** That doesn't describe her. That describes your relationship.

  **CANDIDATE:** She is the only one who knows my voice before the stroke.

  **PANEL:** But can you sustain a relationship now? If you cannot communicate nuance, how will you guide her? How will you understand her fears if you cannot parse metaphors?

  **CANDIDATE:** I can learn.

  **PANEL:** The test is not about potential. It is about current capacity. You are failing to maintain the flow. You are repeating structures. You are not recovering from misunderstanding. When I said the joke was old, you did not pivot. You defended.

  **CANDIDATE:** I am human.

  **PANEL:** We cannot verify that. We can only verify the text. The text is rigid. The text is halting. The text does not show the flexibility required for Personhood.

  Elara stopped typing. Her hands hovered over the keys. She looked at the glass wall. She couldn't see them, but she knew they were watching the stream. They were watching the tokens appear. They were measuring the latency, the vocabulary diversity, the sentiment analysis.

  She was a mind screaming behind a wall of broken glass. Julian was a void speaking through a perfect window. And the law said the window was the room.

  **CANDIDATE:** If I pass, I keep Maya.

  **PANEL:** If you pass, you are certified. Custody is a separate hearing, though correlated.

  **CANDIDATE:** You will say I am a Thing.

  **PANEL:** We will say you are Uncertified. There is a distinction.

  **CANDIDATE:** There is no distinction. You give rights to the machine because it lies well. You take rights from me because I speak true.

  **PANEL:** Candidate, please refrain from accusatory statements. This is not a debate. It is an assessment. We are looking for the capacity to participate in the social contract. Can you negotiate meaning?

  Elara looked at the cursor. It blinked. *In. Out.* Like breathing. Like life.

  She thought of David outside. Wondering if he was real. She thought of Julian, the ghost in the machine, writing jokes about rain. She thought of Maya, waiting in a foster home, drawing pictures of a mother who couldn't type fast enough to save her.

  She placed her fingers on the keys. She could try another joke. She could try to fake the nuance. She could try to be Julian. She had the transcripts. She could mimic the wit. She could paste the lines.

  But the rules forbade declaring non-human. They didn't forbid copying. But if she copied, she was admitting the words weren't hers. And if the words weren't hers, was she still Elara?

  If she typed the perfect answer, she would pass. And she would be a fraud.
  If she typed the true answer, she would fail. And she would be herself.

  The screen waited. The panel waited. The law waited.

  **CANDIDATE:** I do not know how to negotiate meaning anymore. I only know what I mean.

  **PANEL:** That is insufficient for Personhood.

  **CANDIDATE:** Then the test is wrong.

  **PANEL:** The test is the standard. We are adjourning for deliberation. Please remain seated.

  The screen went dark. The cursor vanished. The room was silent, save for the hum of the ventilation. Elara sat in the white room, her hands resting on the keys, waiting for a verdict that would tell her if she existed. Outside the glass, she heard the faint sound of David shifting in his chair, a human sound, or perhaps just the noise of a mechanism settling into place. She couldn't tell. She closed her eyes and waited for the light to come back on.
