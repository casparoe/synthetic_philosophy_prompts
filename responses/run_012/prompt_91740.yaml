  2.  **Deconstruct *De Senectute* (Key Themes & Arguments):**
      *   *Context:* Cato is 84, speaking to Scipio and Laelius. It's a philosophical consolation, but deeply Roman.
      *   *Complaint 1 (Public Affairs):* Old age withdraws from action. *Cato's rebuttal:* Old men guide by counsel and authority (*auctoritas*), not physical strength. The Senate is the place for the old.
      *   *Complaint 2 (Body):* Old age weakens the body. *Cato's rebuttal:* Exercise the mind, accept physical limits, virtue doesn't need muscles.
      *   *Complaint 3 (Pleasure):* Old age cuts off pleasure. *Cato's rebuttal:* Good riddance. Pleasure clouds judgment. Old age allows for higher intellectual/agricultural pleasures.
      *   *Complaint 4 (Death):* Old age is near death. *Cato's rebuttal:* Death is natural. The soul is likely immortal (Platonic influence). Life is a race; the finish line is natural.
      *   *Underlying Assumptions:* The *Res Publica* needs experience. The family is the economic unit. Nature (*Natura*) is a guide to be followed, not fought. Virtue (*Virtus*) is the highest good.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: *De Senectute* is timeless but time-bound.
          *   Thesis: Cato's philosophy relies on nature, duty, and the specific Roman social contract. Applying it to modern bioethics and economics requires careful extrapolation.
          *   Roadmap: Address the four controversies.

      *   **Controversy 1: Mandatory Retirement:**
          *   *Cato's View:* He would likely oppose rigid mandatory retirement based *solely* on age, but support removal if competence fails.
          *   *Arguments:* He values *auctoritas* (authority gained through time). He argues old men steer the ship while young men row.
          *   *Limits:* Roman Senate was lifetime appointment. Modern bureaucracy is different.
          *   *Modern Premise:* The idea that jobs are a zero-sum game for the young (not really Cato's view; he sees intergenerational cooperation).
          *   *Inference:* He'd judge by mental acuity, not calendar age.

      *   **Controversy 2: Medical Rationing by Age:**
          *   *Cato's View:* He would likely accept it (or at least not fight it fiercely).
          *   *Arguments:* Death is natural. Fighting nature is futile. The young have more "course" to run.
          *   *Limits:* Roman medicine was palliative/basic. They didn't have life-support machines.
          *   *Modern Premise:* Scarce high-tech resources. The concept of "saving" a life via intervention vs. letting nature take its course.
          *   *Inference:* He'd see prolonging life artificially as fighting Nature (*Natura*).

      *   **Controversy 3: Aging as a Disease:**
          *   *Cato's View:* Strongly opposed.
          *   *Arguments:* Aging is a stage of life, not a pathology. It brings wisdom. To cure it is to reject the natural order.
          *   *Limits:* He accepts physical decline but says mind can stay sharp.
          *   *Modern Premise:* Biotechnology, the definition of "health."
          *   *Inference:* This violates the Stoic/Academic acceptance of Fate/Nature.

      *   **Controversy 4: State Pensions vs. Family:**
          *   *Cato's View:* Family obligation first, State second.
          *   *Arguments:* The farm (*fundus*) supports the old. Children owe duty (*pietas*).
          *   *Limits:* No social security in Rome. Wealth was land-based.
          *   *Modern Premise:* The Nation-State as a surrogate family. Liquid economy vs. agrarian.
          *   *Inference:* He'd view state pensions as a failure of family *pietas*, but might accept them if the family structure has collapsed.

      *   **Conclusion:**
          *   Evaluate the reconstructed Cato.
