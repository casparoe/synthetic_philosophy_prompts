          *   *Application:* "Horse" and "White Horse" have different *extensions* in the seeking argument (one accepts brown, the other doesn't). Wait, Frege's Reference for a concept is usually its extension. If the extensions differ, the References differ. So "White Horse" and "Horse" have different References (extensions).
          *   *Problem:* Gongsun Long concludes they are *not* the same. Frege would say they have different Senses (obviously) and different Extensions (the set of white horses is a subset of horses). But Frege wouldn't say "The white horse is not a horse." He would say "The concept *white horse* is subordinate to the concept *horse*."
          *   *Verdict:* The Seeking Argument is actually *extensional*. It highlights that the *conditions of satisfaction* differ. This aligns more with modern possible worlds semantics or simply extensional logic than pure Sense/Reference (which usually explains how *same* reference can have *different* cognitive value). Here, the cognitive value *and* the extension differ.
          *   *Better Fit:* The Seeking Argument shows that *Ming* (Names) are tied to specific pragmatic contexts. It's not just about Sense/Reference, it's about the *function* of the name in a speech act (seeking).

      *   **Comparison 2: Concept/Object (The "Concept Horse" Paradox)**
          *   *User's Hunch:* Fits the "Shape/Color" argument.
          *   *Analysis:* Frege struggled because "The concept horse" refers to an object, not a concept. Predicates cannot be subjects.
          *   *Application:* Gongsun Long treats "Horse" (the shape) and "White" (the color) as distinct entities that combine. When he says "Horse designates shape," he is reifying the universal "Horseness."
          *   *Verdict:* This is the stronger comparison. Gongsun Long is treating *Ming* as referring to abstract entities (Universals/Shapes/Colors) rather than concrete particulars. When he says "White horse is not horse," he means the *compound universal* (White + Horse) is not identical to the *simple universal* (Horse).
          *   *Frege's Problem:* Frege would say "Horse" is a concept. "White Horse" is a complex concept. The statement "White Horse is not Horse" is a category mistake if taken as predication, but intelligible if taken as identity between abstract objects (concepts reified). Gongsun Long *does* reify them.
          *   *Crucial Distinction:* Frege tries to *prevent* reification (and fails). Gongsun Long *embraces* reification. For Gongsun, "Horse" *is* an object (a shape-universal).

  4.  **Synthesizing the View:**
      *   *Thesis:* The comparison is **illuminating but asymmetrical**. The Fregean apparatus explains *why* we find it puzzling, but Gongsun Long is doing something more ontological than logical.
      *   *On the "Translation Artifact":* It is **not** merely a translation artifact. The ambiguity of *fei* is real, but the metaphysical commitment to *Ming* as fixed entities is textual, not linguistic.
      *   *On the Hunch:*
          *   **Seeking Argument:** Not Sense/Reference. It's about **Extension/Intension** (or better, *Shi* matching *Ming*). It shows the *pragmatic identity conditions* differ.
          *   **Shape/Color Argument:** Closer to **Concept/Object**, but specifically the **Reification of Universals**. Gongsun Long succeeds where Frege fails: he treats concepts as objects explicitly.
      *   *The "Real Work":* The Fregean tools show that Gongsun Long is operating with a **hyper-realist ontology of names**. For Frege, concepts are unsaturated. For Gongsun, *Ming* are fixed, saturated entities that can be combined or kept separate.
      *   *Hardness/Whiteness:* Relevant. It confirms the ontology. In *Jian Bai Lun*, attributes are separable from the substance. This supports the "Shape/Color" argument in *Bai Ma Lun* that "White" and "Horse" are distinct entities that happen to combine but remain distinct *Ming*.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Commitment:* I need to take a stand. The comparison is illuminating regarding the *structure* of the problem but distorts the *ontological commitment*. Frege tries to solve the paradox of predication; Gongsun uses the paradox to establish a metaphysics of distinct universals.
      *   *Addressing the "Artifact":* Dismiss the "translation artifact" theory as too quick. The lack of copula allows the ambiguity, but the *argument* relies on the metaphysics of *Ming*.
      *   *Addressing the Hunch:*
          *   Refine the Sense/Reference mapping. The Seeking argument is actually about **Extension** (which Frege associates with Reference of concepts). If Reference differs, they aren't the same. So Gongsun is right extensionally. But he concludes "is not a horse" (predication). This is where the Category Mistake lies.
          *   Refine the Concept/Object mapping. This is the winner. Gongsun Long treats "Horse" as an Object (a universal). Frege says you can't. Gongsun says you must.
      *   *Falsification Conditions:* What would change my mind? If recent paleography shows *fei* functions strictly as class exclusion in other Warring States texts without metaphysical baggage. Or if the *Bai Ma Lun* is shown to be purely dialectical satire (some scholars argue this).
      *   *Western Imposition:* The biggest risk is assuming Gongsun cares about "truth conditions" in the Fregean sense. He cares about *Zheng Ming* (Rectification of Names) — social/political/metaphysical order.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I initially thought about saying Seeking = Sense. But Seeking is about *which animals satisfy the request*. That's Extension. Frege: Reference of a concept is its extension. So "Horse" (extension: all horses) $\neq$ "White Horse" (extension: white horses). So their References differ. Frege would agree they are not identical. But Frege would deny "White horse is not a horse" implies the white horse isn't *in* the class. Gongsun says the *Name* "White Horse" is not the *Name* "Horse".
