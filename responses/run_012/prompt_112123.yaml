answer: |-
  Here is the verdict: Your comparison is **genuinely illuminating**, but not in the way your hunch suggests. The Fregean apparatus does not dissolve the *White Horse Dialogue* as a verbal muddle; rather, it reveals that Gongsun Long is committing to an ontological stance that Frege himself found paradoxical.

  Specifically, your hunch that the **Shape/Color argument** aligns with the **Concept/Object** distinction is correct and is the heavy lifter here. Your hunch that the **Seeking argument** aligns with **Sense/Reference** is misleading; it is actually an argument about **Extension** (the Reference of a concept), which makes the paradox sharper, not softer.

  Here is the reconstruction of why this comparison works, where it strains, and why the "translation artifact" explanation is too quick.

  ### 1. The Translation Artifact Objection
  First, we must clear the ground. The claim that the puzzle is merely an artefact of translating *fei* (not) as "is not" (the negative copula) is philologically lazy. While Classical Chinese lacks the specific ambiguity of the English "is" (identity vs. predication vs. class membership), the text does not rely on this ambiguity to generate its force.

  In the *Bai Ma Lun*, *fei* functions as a negation of identity or equivalence between *Ming* (Names). Gongsun Long is not saying "This particular white horse is not a member of the class of horses." He is saying "The Name 'White Horse' is not equivalent to the Name 'Horse'." The lack of articles allows *ma* (horse) to oscillate between the universal, the class, and the particular, but the argument holds even if we translate *ma* consistently as "the universal Horse." The puzzle persists because Gongsun Long treats universals as discrete entities that can be combined or separated. Therefore, the puzzle is not linguistic confusion; it is **ontological commitment**.

  ### 2. Testing the Fregean Tools

  #### The Seeking Argument: Not Sense/Reference, but Extension
  Your hunch suggests the Seeking Argument ("If you want a horse, a yellow one suffices...") maps to Frege's Sense/Reference distinction. I disagree.

  In Frege's framework, the *Reference* (*Bedeutung*) of a concept word is its extension (the set of objects falling under it). The *Sense* (*Sinn*) is the mode of presentation.
  *   **Frege:** "Morning Star" and "Evening Star" have different Senses but the *same* Reference.
  *   **Gongsun Long:** "Horse" and "White Horse" have different *Extensions*. (The set of horses includes brown ones; the set of white horses does not).

  If Gongsun Long were making a Sense/Reference point, he would argue that "White Horse" and "Horse" pick out the same animals but under different descriptions. He argues the opposite: they pick out *different* animals (in the context of a request). This is an argument about **Extension**.

  **Why this matters:** Frege would agree that the extension of *concept F* is not identical to the extension of *concept G* even if G is a sub-concept of F. But Frege would not conclude "A white horse is not a horse." He would say "The concept *White Horse* is subordinate to the concept *Horse*." Gongsun Long's move is to treat the difference in extension as a difference in *identity of the Name*. The Seeking Argument shows that *Ming* are fixed to specific *Shi* (actualities/conditions of satisfaction). If the satisfaction conditions differ, the *Ming* are not substitutable. This is not a confusion of Sense and Reference; it is a rigid designator theory applied to universals.

  #### The Shape/Color Argument: The Concept/Object Parallel
  This is where your comparison shines. The argument that "Horse designates shape, White designates color... therefore White Horse is not Horse" relies on treating "Horse" and "White" as independent entities that are combined.

  *   **Frege's Problem:** In "On Concept and Object," Frege argues that concepts are "unsaturated." You cannot talk about a concept without turning it into an object (e.g., "The concept *horse*"). Thus, "The concept *horse* is not a concept."
  *   **Gongsun Long's Move:** Gongsun Long does exactly what Frege says is impossible, but he does it deliberately. He treats "Horse" (the shape-universal) and "White" (the color-universal) as **objects** that can be named. When he says "White Horse," he is naming a compound object formed by two abstract entities.

  **The Verdict:** The Fregean "Concept/Object" distinction illuminates the *White Horse Dialogue* by showing that Gongsun Long is a **Platonic Realist** about *Ming*. For Frege, the reification of concepts is a grammatical trap. For Gongsun Long, it is the metaphysical truth. The "paradox" arises only if you assume (with the interlocutor) that "Horse" refers to concrete particulars. Gongsun insists "Horse" refers to the abstract universal (Shape). Since the compound universal (White + Shape) is not identical to the simple universal (Shape), "White Horse is not Horse."

  Frege's apparatus does not show this to be a muddle; it shows it to be a **category mistake only if you reject Gongsun's ontology**. If you accept that universals are objects (as Gongsun does), the argument is valid. Frege struggles to say what a concept is; Gongsun Long simply says a concept *is* a nameable thing (an object).

  ### 3. The Role of *Hardness and Whiteness* (Jian Bai Lun)
  You asked to bring this in only if it bears on the verdict. It is decisive. The *Jian Bai Lun* argues that in a hard, white stone, "Hardness," "Whiteness," and "Stone" are three separate entities, not one. You see the whiteness but not the hardness; you feel the hardness but not the whiteness. Therefore, they are ontologically separable.

  This confirms the diagnosis of the *White Horse Dialogue*. Gongsun Long is not playing word games; he is arguing for the **metaphysical separability of attributes**. This supports the Shape/Color argument in *Bai Ma Lun*: "White" and "Horse" are distinct universals. Their combination is contingent. Therefore, the Name of the combination cannot be the Name of the component. This cements the link to the **Concept/Object** problem: Gongsun treats attributes as independent objects. Frege would call this a confusion of logic and ontology; Gongsun would call Frege's "unsaturated concept" a failure to recognize the reality of *Ming*.

  ### 4. Where the Comparison Distorts (The Western Imposition)
  Here is where I am likely imposing a Western shape on the text. The Fregean framework assumes the goal is **truth-conditional semantics** (under what conditions is a proposition true?). Gongsun Long's context is **Zheng Ming (Rectification of Names)**.

  For Gongsun, the point of distinguishing "White Horse" from "Horse" is not merely logical precision; it is social and political order. If names are not fixed (*ding*), disputes cannot be settled. The "Seeking" argument is pragmatic: if I order a white horse and you bring a black one, the social contract is broken, even if a black horse is biologically a horse.

  By using Frege, we risk treating the *Bai Ma Lun* as a proto-analytic puzzle about predication, ignoring that for Gongsun, *Ming* have a normative force that Fregean *Sinn* lacks. Frege's Sense is cognitive; Gongsun's *Ming* is normative. The Fregean tool explains the *logic*, but it misses the *function*.

  ### 5. Commitment and Falsification
  **My Committed View:** The comparison is illuminating because it identifies Gongsun Long as a **hyper-realist** who solves the "Concept Horse" paradox by embracing the reification of concepts. The Fregean tools do not dissolve the argument as a muddle; they reveal that the argument rests on an ontology of separable universals that modern logic (following Frege) rejects. The "Shape/Color" argument is the core (Concept/Object); the "Seeking" argument is the pragmatic consequence (Extension).

  **What Would Change My Mind:**
  1.  **Philological Evidence:** If new paleographic evidence demonstrated that in the Warring States period, *fei* was exclusively used for class exclusion (is not a member of) and never for identity (is not the same as), the "Concept/Object" reading would collapse. The argument would then be a straightforward (if false) claim about class membership, making it a simple logical error rather than a metaphysical stance.
  2.  **Contextual Counterexample:** If it were demonstrated that the *Bai Ma Lun* was intended purely as **satire** (a *reductio ad absurdum* of Mohist logic, rather than Gongsun's own positive doctrine), then applying Fregean tools to find a coherent ontology would be a category error. Some scholars (like A.C. Graham) suggest the School of Names were dialecticians who argued for the sake of arguing. If the text is a sophistical trap rather than a metaphysical treatise, the Fregean comparison is merely clever, not illuminating.
  3.  **Fregean Failure:** If I could show that treating "Horse" as a Fregean Object leads to a contradiction *within the Chinese text's own rules* (e.g., if Gongsun Long elsewhere treats "Horse" as unsaturated), my reading would fail. However, the *Jian Bai Lun* strongly supports the Object reading.

  **Most Likely Imposition:** I am likely imposing the **Subject/Predicate structure** onto the *Ming/Shi* relationship. Frege's Concept/Object distinction is rooted in the grammatical function of predicate vs. subject. Gongsun's *Ming* is not strictly grammatical; it is a correlate of reality. Assuming that *Ming* functions like a Fregean proper name or concept-word might obscure the possibility that *Ming* operates more like a **role** or a **standard** than a reference-bearing term. If *Ming* is a standard of measurement rather than a label, the Fregean comparison breaks down entirely.

  **Summary for your paper:** Use the Concept/Object comparison to argue that Gongsun Long is not confused about logic, but committed to an ontology of universals that Frege found paradoxical. Use the failure of the Sense/Reference comparison to show that Gongsun is concerned with extensional satisfaction conditions (pragmatics) rather than cognitive mode of presentation. Dismiss the "translation artifact" claim as ignoring the metaphysical weight of *Ming*.
