answer: |-
  1. 'The one-paragraph version'
  Your job is to protect the magazine from unintentional bias while respecting artistic voice. Default to inclusive language; marked terms like "female" as a noun require justification. Use the "swap test": if replacing gender terms with race terms sounds absurd or offensive, the original likely relies on outdated defaults. Distinguish between historical accuracy, character voice, and authorial negligence. If the language excludes readers without adding value, change it. If it serves a specific artistic or documentary purpose, keep it. This procedure prioritizes clarity and respect over rigid tradition, ensuring your publication feels current without sanitizing genuine art. You are the gatekeeper of standards, not just grammar.

  2. 'The procedure'
  Step 1: Identification. Scan the text for gendered generics ("mankind," "guys," "he" as default) or marked nouns ("lady doctor," "female"). If none exist, stop. If found, proceed to Step 2.
  Step 2: Context Classification. Determine the source of the language. Is it a direct historical quote? Is it dialogue within a fictional piece? Is it the narrator's voice or the poet's lyrical "I"? If it is a direct historical quote, stop and keep it (see Case 3). If it is dialogue, proceed to Step 3. If it is narrator/poet voice, proceed to Step 4.
  Step 3: Character Voice Check. Does the biased language define a character's flaw or setting? If a villain uses sexist language to signal bigotry, keep it. If a neutral character uses it without comment, flag it. Ask the writer if this is intentional characterization. If they confirm intent, keep it. If they say "I didn't notice," change it to neutral terms.
  Step 4: The Swap Test. Mentally replace the gendered term with a racial equivalent (e.g., swap "mankind" for a race-specific term, or "girls" for a racial slur equivalent). If the result sounds shocking or ridiculous, the original term is marked and exclusionary. If the swap reveals bias, proceed to Step 5. If the swap feels neutral, you may keep it, but proceed cautiously.
  Step 5: Artistic Cost Assessment. Can the term be changed without breaking meter, rhyme, or core meaning? If the writer claims artistic necessity (e.g., meter), ask for two alternative phrasings. If they cannot provide alternatives, the constraint is likely laziness, not art. Change the term. If changing it destroys the piece's structure, proceed to Step 6.
  Step 6: The Handoff. If the language passes the Swap Test but feels uncomfortable, or if the writer refuses changes based on "voice," you must escalate. Do not decide values alone. Send a note to the writer: "This term reads as exclusionary under our style guide. Please revise or confirm this is intentional thematic work." If they confirm intent, you must decide if the magazine wants to publish that intent. If you are unsure, hand off to the faculty advisor. Their signature implies responsibility for controversial content.
  Step 7: Final Decision. If the advisor approves the bias, publish as is. If they reject it, require changes. If the writer refuses changes and the advisor sides with you, decline the piece. Your procedure ends when the text aligns with the magazine's public standards or is rejected. Do not publish language you would not defend in an editorial statement.

  3. 'Two quick tests'
  First, swap the gendered term for a racial equivalent; if it sounds shocking, the original is marked. Second, ask if a neutral term exists without losing meaning; if "people" works instead of "mankind," use "people." These filters catch 80% of issues before you need the full procedure. If both tests pass without raising alarms, the language is likely functional. If either triggers discomfort, proceed to the full workflow. This saves time on clear-cut cases.

  4. 'Worked cases'
  Case 1: The poem uses "mankind" and generic "he" for meter.
  Procedure Step 5 applies. The writer claims artistic necessity. However, meter is a chosen constraint, not an external force. If they cannot find inclusive synonyms that fit the rhythm, the form is serving the bias, not the art.
  Call: Change it. Request revisions. "Mankind" becomes "humankind" or "people"; "he" becomes "they" or restructured lines. If the poem collapses without sexist defaults, it relies on exclusion for structure. Do not accept the excuse. Modernize the meter.

  Case 2: Satire uses "females" and "fairer sex" to mock a men's-rights guy.
  Procedure Step 3 applies. This is character voice/dialogue intended to signal flaw. The Swap Test confirms the terms are marked, but that is the point. The context isolates the bias to the antagonist, not the publication's voice.
  Call: Keep it. Ensure the surrounding text makes the mockery clear so readers don't mistake the satire for endorsement. If the narration itself adopts these terms without irony, change the narration only. The dialogue stays to preserve the satire's target.

  Case 3: Essay quotes an old document using "men" to mean everyone.
  Procedure Step 2 applies. This is a direct historical quote. Altering it falsifies the source material and obscures the historical context of the essay's argument.
  Call: Keep it. Do not edit primary sources. If the writer analyzes the term, they can note its exclusionary nature in their commentary. Changing the quote compromises academic integrity. The procedure stops at identification; historical accuracy overrides modern style guides in documentary contexts.

  5. 'Where this breaks'
  This procedure fails when "voice" is used as a shield for laziness. It cannot measure the emotional labor of asking a marginalized writer to change their work versus the labor of a reader encountering bias. It also struggles with evolving slang; what is reclaimed today may be offensive tomorrow. Finally, it assumes you have the authority to enforce changes. If your faculty advisor overrides you based on "tradition," the procedure stops working. It handles text, not politics. You will still face pushback from writers who feel censored. The tool clarifies your reasoning, but it cannot win arguments for you. It creates a record of due diligence, protecting you from accusations of arbitrary editing, but it cannot force a writer to care about inclusion. You may follow every step and still have to kill a piece you love because the values don't align. That is the editor's burden.

  6. 'Your call on the one I'll hate'
  You'll hate my call on Case 1. Poets defend meter fiercely, and telling them "mankind" is unacceptable feels like political policing to them. But here's the hard truth: meter is a constraint they chose; exclusion is a consequence they shouldn't offload onto readers. If they can't write inclusive verse within their form, the form is the problem, not the language policy. A lit mag sets a standard. Allowing "generic he" because of iambic pentameter signals that traditional comfort outweighs modern inclusion. Change it. If they refuse, decline the piece. Your magazine's values matter more than one poem's rhythm.
