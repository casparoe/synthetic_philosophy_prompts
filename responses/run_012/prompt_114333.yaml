  3. This case begins as a won't-move trap where politicians refused early cuts due to concentrated costs and diffuse benefits, but hardens into a can't-move trap once overcapitalization made any reduction economically fatal for the fleet, proving the distinction survives but reveals how agency failures engineer coordination lock-ins.

  4. Your suspicion holds that Moloch writing assumes positional dynamics where cessation halts damage, but here physical destruction involved ecological tipping points where even a complete stop came too late, exposing the frame's weakness in handling irreversible non-linear systems rather than reversible status races.

  5. The frame misses delayed feedback loops where consequences lag far behind extraction, allowing the trap to spring fully loaded before the pain is felt, requiring a patch that adds ecological latency and irreversibility to the standard coordination failure model.
