answer: |-
  ### Ranking and Weights

  1.  **Ecological (0.25)**
      This criterion bears the heaviest burden because if readers do not intuitively recognize the glyph as an 'a' within flowing text, no other technical metric matters. It prioritizes functional communication over formal rules, serving as the ultimate validation of identity.

  2.  **Differential (0.20)**
      A glyph is only an 'a' if it is not an 'o', 'e', or 'd', making systemic distinctness nearly as vital as raw recognition. This ranks below Ecological because distinctness is a means to the end of readability, not the end itself.

  3.  **Topological (0.20)**
      Structural features like counters provide rapid visual cues for recognition, but this ranks lower than Differential because valid 'a's can vary topologically (e.g., single-story vs. double-story). It is a strong heuristic for identity but must yield when it conflicts with reader perception.

  4.  **Constructive (0.15)**
      Derivability from the style's grammar ensures the glyph belongs to your specific typeface family, but a shape can be an 'a' without adhering to your tool's specific generative logic. This is a constraint on *style consistency* rather than *letter identity*.

  5.  **Ductus-based (0.10)**
      Stroke order and count are relevant for calligraphic authenticity but are often invisible in final digital outlines. This trades off against Topological and Ecological needs, as strict adherence to handwriting mechanics can limit legible form innovation.

  6.  **Genealogical (0.10)**
      Historical lineage is the least central because a novel shape can function perfectly as an 'a' without a documented ancestry. This criterion imposes historical baggage without offering functional utility for a forward-looking generative system.

  ***

  ### Strategic Trade-offs

  **Drop with Least Damage:** You should drop the **Genealogical** criterion. Enforcing an unbroken historical chain restricts innovation without improving legibility or stylistic coherence, making it a philosophical constraint rather than a functional one.

  **Cannot Drop:** You cannot drop the **Ecological** criterion. It is the only metric that verifies the tool's actual success in the wild; if the system generates shapes that readers reject, the tool has failed its primary purpose regardless of how well it satisfies other rules.

  **Sharpest Tension:** The pair in the sharpest tension is **Topological and Ecological**. A strict topological rule (e.g., "must enclose one counter") would invalidate legitimate single-story 'a's that readers easily accept, forcing you to choose between formal purity and functional reality.
