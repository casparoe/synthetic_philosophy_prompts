answer: |-
  Here is a two-hour session plan designed to bypass the standard free-will script and force engagement with the structural logic of the Basic Argument.

  ### Hour 1: Locking the Foundation and Launching the Regress

  **0:00–0:15: The Pre-Emptive Strike (Addressing Misconception #1)**
  Your student who thinks this is "determinism in a trenchcoat" will derail the room if you don't disarm them immediately. Do not start with the argument. Start with the *conditions* of the argument.

  *   **The Move:** Explicitly state that the Basic Argument is **agnostic on determinism**. Write "Determinism = TRUE" and "Determinism = FALSE" on the board. Tell them Strawson's conclusion holds under both columns.
  *   **The Lock:** Explain that standard incompatibilism worries about *causal chains from the past*. Strawson worries about *causal chains from the self*.
  *   **The Rule:** Establish the **Principle of Responsibility (PoR)** as the non-negotiable premise. To be ultimately responsible for an action ($A$), you must be responsible for the mental state ($M$) that produced $A$. If $M$ was just "given" to you (by genes, environment, or luck), you aren't ultimately responsible for $A$, even if you acted freely in the compatibilist sense.
  *   **Why:** This prevents the determinism objection from resurfacing during the regress. If they object later that "maybe the choice was undetermined," you point to the board: "Irrelevant. Who produced the propensity to choose that way?"

  **0:15–0:45: The Single Example (The "Character Change" Case)**
  Do not use a manipulation case (e.g., neuroscientists implanting desires). Do not use a "born that way" case (e.g., natural temper).
  *   **The Example:** Use a case of **Deliberate Self-Improvement**.
      *   *Scenario:* An agent realizes they are selfish. They genuinely want to become more generous. They succeed. They perform a generous act ($A$) based on this new character trait ($M_{new}$).
  *   **Why this example:**
      *   *Manipulation cases* fail because students will dig in and say, "But in the *real* case, no scientist touched them." It invites a "real vs. fake" agency distinction that Strawson rejects.
      *   *Born-that-way cases* fail because students will say, "But I can overcome my nature!"
      *   *Self-Improvement* forces the issue. To change from Selfish ($M_{old}$) to Generous ($M_{new}$), the agent must make a choice ($C$). That choice $C$ must stem from *some* principle or preference ($P$). Did they choose $P$? If yes, regress. If no, luck.
  *   **The Walkthrough:** Walk them through the transition. Ask: "To choose to change your character, you must already have a reason to value that change. Where did *that* valuation come from?"

  **0:45–1:00: Launching the Regress**
  Now that the PoR is locked and the Example is set, run the regress steps quickly.
  1.  You did $A$ because of $M_{new}$.
  2.  To be responsible for $A$, you must be responsible for $M_{new}$.
  3.  $M_{new}$ was caused by Choice $C$.
  4.  To be responsible for $M_{new}$, you must be responsible for $C$.
  5.  $C$ was made based on Principle $P$.
  6.  To be responsible for $C$, you must be responsible for $P$...
  *   **Stop here.** Do not resolve it yet. Let the vertigo set in.

  ---

  ### Hour 2: Diffusing Misconceptions and Bracketing

  **1:00–1:30: Targeted Misconception Diffusal**
  This is where you address the other two predictable guesses. Do not wait for Q&A; insert these corrections into the flow of discussion.

  *   **Misconception #2: "This is against Free Will, not Responsibility."**
      *   *Where to diffuse:* When a compatibilist in the room says, "But they *could* have done otherwise," or "They acted on their desires."
      *   *The Correction:* Clarify that Strawson grants you **Freedom of Action**. You can do what you want. The argument is strictly about **Credit/Blame**. You can be the *source* of the action without being the *ultimate source* of the self that sourced the action.
      *   *Phrase to use:* "Strawson is happy to let you keep 'free will' if you define it as 'unimpeded agency.' He is taking away 'ultimate authorship.' Distinguish the *actor* from the *creation of the actor*."

  *   **Misconception #3: "Strawson denies anyone ever causes their own actions."**
      *   *Where to diffuse:* When someone says, "This implies I'm a puppet/I don't cause anything."
      *   *The Correction:* Strawson denies **Ultimate** Self-Causation, not **Local** Self-Causation. You cause your actions *now*, based on who you are *now*. You just didn't cause who you are *now* in the ultimate sense.
      *   *Phrase to use:* "You are the cause of the action, but you are not the *causa sui* of the cause. The argument blocks *final* responsibility, not *proximate* causation."

  **1:30–1:45: Explicit Bracketing (The Frankfurt Trap)**
  Grad students love Frankfurt cases. They will try to use them to argue that Alternative Possibilities (AP) aren't needed for responsibility.
  *   **The Move:** Explicitly announce: **"We are not discussing Alternative Possibilities."**
  *   **The Reason:** The Basic Argument is a **Sourcehood** argument, not an **AP** argument. Even if Frankfurt proves you don't need AP to be responsible, you still need to be the *ultimate source* of your character. Frankfurt cases assume the agent's psychology is fixed; Strawson asks where that fixed psychology came from.
  *   **Instruction:** Tell them that bringing up Frankfurt cases is a category error for this specific argument. It solves a different problem.

  **1:45–2:00: The Diagnostic Question**
  Do not ask "Do you agree with Strawson?" That only tells you their metaphysical stance, not their comprehension of the argument's structure.

  **Ask this:**
  > "If you wanted to stop the regress at step 2 (where you choose your character), what specific feature would your mental state at step 1 need to have, and why does Strawson claim that feature is logically impossible for a finite being?"

  **What this tests:**
  *   If they answer "They need to be uncaused," they missed the point (that's the determinism trap).
  *   If they answer "They need to be able to do otherwise," they missed the bracketing (that's the AP trap).
  *   **Correct Answer:** They must identify that the agent would need to be **causa sui** (self-created) regarding the *principle of choice* itself. They need to articulate that to stop the regress, the agent must have chosen the very criteria by which they choose, without using prior criteria. This confirms they understand the *structural* impossibility, not just the causal one.

  ### Summary Checklist for the Moderator
  1.  **Minute 0:** Declare independence from Determinism.
  2.  **Minute 15:** Lock in the Principle of Responsibility.
  3.  **Minute 30:** Use the "Self-Improvement" example (avoid manipulation/born-that-way).
  4.  **Minute 60:** Distinguish Freedom of Action from Ultimate Authorship.
  5.  **Minute 90:** Ban Frankfurt/AP discussions.
  6.  **Minute 115:** Deploy the *Causa Sui* diagnostic question.
