answer: |-
  The closest established concept is **Hermeneutical Injustice**.

  It was coined by philosopher Miranda Fricker to describe exactly your first timeline: when a gap in our shared vocabulary prevents people from understanding their own experience. The 1920s villagers suffer this. They feel the losses, but they lack the conceptual "glue" to see them as a systematic attack rather than a run of bad luck. They are hermeneutically marginalized.

  **Where it breaks down**
  Fricker's framework is optimistic. It assumes that once the vocabulary arrives (the "word"), the injustice is remedied. The victim can finally speak, be understood, and find relief.

  Your novel identifies the shadow side of that remedy. You are describing a scenario where the vocabulary doesn't just *reveal* the harm; it *reconstructs* it. The word arrives from outside (lawyers, committees), and in doing so, it brings its own architecture. It doesn't just shine a light on the past; it builds a box around it.

  This is where **Hermeneutical Injustice** fails to capture your second timeline. It doesn't account for the *hostility* of the vocabulary. In your book, the word is not a key; it is a sieve.

  **Is the "filter" part of the same phenomenon?**
  Yes. It is not a separate problem; it is the structural cost of the solution.

  A category cannot exist without boundaries. To say "this is X" is to say "this is not Y." When the power to define X lies with an external institution (the state, the UN, the court), the boundaries are drawn to serve *that* institution's logic, not the victim's reality.

  So, the filter is intrinsic. You cannot have the recognition without the criteria. The granddaughter gains the ability to speak the truth, but only by translating her family's history into a language that might declare parts of it untrue (e.g., "not enough intent," "wrong group"). The harm is no longer just the violence of the 1920s; it is the violence of the definition.

  **The Name**
  Since existing theory stops at the "lack of words," I propose naming this specific double-bind **Hermeneutical Capture**.

  **The Carving**
  **Hermeneutical Capture** occurs when a marginalized group acquires the vocabulary to name their harm, but that vocabulary is owned and defined by the institutions they seek redress from.

  *   **Phase 1 (The Void):** The victims experience incoherent suffering (the 1920s). They cannot articulate the structural nature of the wrong because the concept does not exist in their social world.
  *   **Phase 2 (The Offer):** A category emerges (Genocide, Ethnic Cleansing, Crime Against Humanity). It offers coherence. It promises that if you use this word, you will be heard.
  *   **Phase 3 (The Capture):** To use the word, the victims must reshape their memory to fit the category's legal or bureaucratic criteria. The category validates the experience only by amputating the parts that don't fit the definition.

  **The Edges**
  *   **Where it applies:** Anywhere recognition depends on institutional validation (law, medicine, state reparations). It is strongest when there is a time lag between the event and the creation of the category.
  *   **Where it stops:** It does not apply to personal healing or community memory. If the granddaughter simply wanted to mourn without seeking legal recognition, the trap would not spring. The trap requires an *audience with power*.
  *   **Distinction:** It is different from *lying* or *denial*. Denial says "nothing happened." Hermeneutical Capture says "what happened doesn't count as *this*." It is a more subtle erasure because it looks like recognition.

  **For your novel**
  This gives you a precise conflict for the granddaughter. Her struggle isn't just against silence; it's against *translation*. She is trying to force a jagged, messy, human truth into a smooth, legal container. The tension comes from the question: If she has to cut away parts of her family's story to fit the word, has she saved them, or has she lost them again?

  That is the edge of **Hermeneutical Capture**. The word saves the event from oblivion, but risks killing the truth of the experience.
