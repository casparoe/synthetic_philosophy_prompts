answer: |-
  The decipherment of Linear B stands as the most rigorous test case for W.V.O. Quine's thesis of the indeterminacy of translation. It is radical translation stripped of the flesh of behavior: no native to prompt, no sensory irritation to correlate, no "Gavagai" uttered in the presence of a rabbit. There is only the silent clay, the finite corpus of palace inventories, and the archaeologist's trowel.

  To analyze this as a Quinean episode, we must first reconstruct the mapping between the behavioral constraints of *Word and Object* and the epistemic constraints of epigraphy.

  ### 1. The Mapping: Stimulus and Observation in a Dead Corpus

  In Quine's paradigm, the linguist begins with **stimulus meaning**—the range of sensory stimulations that would prompt a native's assent or dissent to an utterance. In Linear B, there is no stimulus. What stands in its place is **distributional context**.

  The "observation sentences" of the decipherer are not utterances prompted by passing events, but **fixed points of semantic anchorage** within the text. These are the numerals and the ideograms (logograms). When a scribe draws a picture of a tripod beside the numeral 5, the "stimulus" is the visual co-occurrence. The decipherer treats this as an observation sentence: *There are 5 tripods.* This is the closest the epigrapher gets to pointing.

  Quine's **analytical hypotheses**—the tentative rules mapping native syntax to home syntax—correspond to the structural keys of the decipherment:
  1.  **Word Division:** Determining where one sign-sequence ends and another begins (often arbitrary in early stages).
  2.  **Sign Values:** The phonetic assignment of syllabograms (Ventris's Grid).
  3.  **Morphological Parsing:** Alice Kober's identification of "triplets"—sign sequences that vary systematically in their endings while retaining a root, implying case or gender inflection.
  4.  **The Language Hypothesis:** The assumption that the underlying language is Greek.

  In Quine's living scenario, analytical hypotheses are underdetermined by stimulus meaning. In Linear B, they were underdetermined by distributional patterns until Ventris imposed the Greek hypothesis.

  ### 2. The Rival Manual and the Proxy Function

  Quine argues that multiple manuals can fit all possible behavioral evidence. In Linear B, the "behavioral evidence" is the internal consistency of the corpus and its fit with archaeological data. Can we construct a rival manual?

  A **phonetic rival** is nearly impossible. Kober's triplets established a morphological skeleton. If Sign A, Sign B, and Sign C share a root but vary endings (e.g., *ko-no-so*, *ko-no-si-jo*), they behave like a noun and its adjective. Ventris's grid showed that signs sharing a vowel or consonant behaved predictably in these slots. To swap phonetic values (a permutation) would shatter the morphological regularity. The "grammar" of the tablets locks the phonology.

  A **semantic rival**, however, is more plausible. This is the domain of the **proxy function**. Quine suggests we could map "rabbit" to "undetached rabbit part" if we adjust the rest of the ontology. In Linear B, consider the ideogram of a sheep's head beside a numeral.
  *   **Manual 1 (Standard):** Refers to *live sheep*.
  *   **Manual 2 (Rival):** Refers to *sheep-stages* (temporal slices of sheep) or *wool-potential*.

  To make Manual 2 work, we must compensate elsewhere. If the text says "Sheep 100 given to Shepherd," Manual 2 must interpret "given" not as transfer of ownership of an animal, but as allocation of a temporal resource. Does this fit the corpus? The palace records track birth, shearing, and sacrifice. A "sheep-stage" ontology could theoretically model this, but it becomes cumbersome. It requires positing that the Mycenaean scribe operated with a mereological ontology distinct from ours, yet produced inventory lists that function identically to ours.

  Could scholars tell the difference? Practically, no. If the economic predictions hold (e.g., we expect X amount of wool based on Y sheep), both manuals predict the same archaeological findings. The difference is ontological, not empirical. This supports Quine: reference is inscrutable even when the "sentences" (the inventory counts) are fixed.

  ### 3. Phonetics Settled, Semantics Contested

  A striking feature of the Linear B decipherment is the asymmetry between phonology and semantics. The phonetic values of the syllabary are largely settled (e.g., *pa* = /pa/). Yet, the meanings of many words remain contested. We know *qa-si-re-u* is *basileus*, but does it mean "king," "chief," or "local guild master" in the Mycenaean context? We know *ku-ru-so* is *khrusos* (gold), but does a vessel described as *gold* mean made of gold, plated, or colored yellow?

  Quine would argue this is precisely the shape indeterminacy should take. The **truth conditions** of the sentences are determinate (we know under what conditions the scribe would inscribe the sequence *ku-ru-so*), but the **reference** is not. The "sentence" is fixed by its role in the inventory system; the "object" remains opaque.

  Chomsky, conversely, argues that indeterminacy is merely underdetermination of theory by evidence. He would claim that if we had more tablets, or a bilingual text, the semantic contestation would vanish. The Linear B case complicates this. We have a massive corpus (thousands of tablets). We have the "key" (Greek). Yet semantic nuance remains debated. This suggests the problem is not a lack of data (underdetermination) but a fundamental gap between the structural role of a sign and its ontological commitment (indeterminacy).

  However, the fact that the *phonetics* were solved suggests that the "analytical hypotheses" were not as free as Quine feared. The internal structural constraints (Kober's triplets) acted as a rigorous filter that killed off rival phonetic manuals. This looks like a refutation of indeterminacy *at the level of form*. But Quine cares about meaning, not form.

  ### 4. Boundary Cases: Linear A and Maya

  The boundary cases test the limits of this "austere translation."

  **Linear A** remains unread. It shares the script with Linear B but records a different language (likely Minoan). We have the "analytical hypotheses" of word division and some sign values (borrowed from B), but we lack the "language hypothesis." Without a known language to map the phonetics to, the manual cannot be stabilized. This supports Quine: without a bridge to a known conceptual scheme (a living language or a known relative), indeterminacy is permanent. We can read the sounds, perhaps, but we cannot fix the reference.

  **Maya Glyphs** offer the counter-example. For decades, Eric Thompson argued they were purely ideographic (a manual where signs map directly to concepts, not sounds). Knorozov and Proskouriakoff showed they were phonetic/syllabic, using structural analysis similar to Ventris. Crucially, however, the decipherment was cemented by **surviving Mayan languages** and colonial-era dictionaries (like the Landa alphabet).
  *   **The Informant Factor:** The existence of modern Mayan speakers acted as the "native informant" Quine requires. It allowed scholars to check hypotheses against living usage.
  *   **The Implication:** The shift from Thompson's ideographic manual to the phonetic one wasn't just a change of theory; it was a change that allowed for *predictive success* regarding sound values that matched historical phonology.
  *   **Quinean Take:** The availability of a living relative collapsed the indeterminacy. It suggests that indeterminacy thrives in isolation. When the dead language can be hooked up to a living stimulus network (via descendants), the proxy functions are constrained by historical continuity.

  ### 5. The Verdict: Refutation or Confirmation?

  You are inclined to think Linear B refutes Quine by showing a manual can be killed by evidence. The argument is that Ventris's Greek hypothesis was not just one of many options; it was the *only* one that made the tablets intelligible as administrative records. The "evidence" (the coherence of the resulting Greek) killed the rival manuals (e.g., that it was a non-Greek language, or purely ideographic).

  If you hold this view, you must accept the **cost**.

  **The Cost of Refuting Quine:**
  To claim Linear B refutes indeterminacy is to claim that we have accessed the *actual* meanings in the Mycenaean mind, not just a functionally equivalent mapping. This requires a **Semantic Realism** that Quine explicitly rejects.
  1.  **Rejection of Behaviorism:** You must argue that meaning is not exhausted by use (or in this case, distributional context). You must argue that the "Greekness" of the tablets reveals a mental reality that transcends the behavioral evidence of the clay.
  2.  **The Privilege of History:** You must grant that historical continuity (Mycenaean Greek $\rightarrow$ Classical Greek) provides a metaphysical bridge that pure logic does not. Quine would call this "essentialism." He would argue that even if it is Greek, the *reference* of the Greek words in 1200 BC is still only fixed by our current theory of their use.
  3.  **The Illusion of the Key:** If Linear B refutes Quine, then the "Greek Key" is a magic wand that reveals Truth. But consider: if tomorrow we found a bilingual tablet showing *qa-si-re-u* actually meant "steward" in a specific dialectal sense, our manual would shift. The "settled" nature of the decipherment is provisional on the coherence of the corpus. Quine would say the manual is not "true," merely "expedient."

  **The Alternative Reading (Quine Vindicated):**
  Linear B actually confirms Quine's distinction between **sentence meaning** and **word reference**.
  *   **Sentence Meaning (Determinate):** We know what the tablets *do*. They count goods. The syntax is fixed. The phonetic values are fixed because they are required to make the syntax work. This resolves the *underdetermination* of the code.
  *   **Word Reference (Indeterminate):** We still argue about the social reality of the *basileus*. Is he a king or a mayor? The evidence (the corpus) does not force a single ontological answer. The "sheep" might be live animals or wool quotas. The manual fits the evidence either way.

  **Chomsky's Reply:** Chomsky would argue that the semantic contestation is just temporary underdetermination. More evidence (more tablets, new archaeological contexts) will fix the reference.
  **The Episode's Judgment:** The fact that after 70 years, core semantic terms remain debated despite a settled phonology suggests Quine is right about reference. The code is cracked (underdetermination resolved), but the world of the scribe remains ontologically relative (indeterminacy remains).

  ### Conclusion

  Linear B does not refute the thesis of indeterminacy; it refines it. It shows that **structural underdetermination** (which manual of phonetic values?) can be resolved by internal constraints (morphology, inflection) even without a living speaker. In this, it is an anomaly for Quine's behaviorism, suggesting that internal logical consistency can constrain translation more than Quine allowed.

  However, it confirms **ontological indeterminacy**. We have the sounds, we have the grammar, we have the "sentences," but the *objects* those words latch onto in the Mycenaean world remain partially opaque. The "sheep" is a node in an economic network; whether it corresponds to our "sheep" or "sheep-stage" is a projection of our ontology onto theirs.

  To claim Linear B kills the manual of indeterminacy is to claim that coherence equals truth. The cost is the abandonment of the skeptical stance that meaning is a matter of mapping functions rather than discovering entities. Linear B shows we can crack the code of a dead mind, but it does not prove we inhabit the same world as the scribe. The tablets speak Greek, but they speak it from a shore we can no longer visit. We have the dictionary, but the culture that gave the words their weight is gone. In that gap, Quine's inscrutability still hides.
