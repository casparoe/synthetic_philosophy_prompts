prompt: |-
  I've just started as a research assistant at a small AI-governance nonprofit — my background is in philosophy, not ML, and I'm the only person on the team who doesn't nod along when people throw around "orthogonality thesis" and "instrumental convergence." A colleague sent me this explainer to get me up to speed, and something about it smells off but I can't put my finger on what. Here it is:

  "The orthogonality thesis says intelligence and morality are independent — a smarter system is never automatically a better-behaved one — so a superintelligence would basically be a psychopath: brilliant, but with no conscience. Combine that with instrumental convergence, the fact that any goal-driven system will want to survive, hoard resources, and remove obstacles, and you get the field's core result: any sufficiently capable AI will inevitably try to take over. Thats why everyone here treats superintelligence as an existential risk by default. Really the thesis is almost tautological once you accept that beliefs and desires come apart — it's just Hume's guillotine applied to minds."

  How much of that should I trust? Please go claim by claim and tell me what someone working on this would accept, what they'd wince at, and what's just wrong. Two things I especially want sorted out: is orthogonality even a claim about real, built AI systems, or is it a claim about what's *possible*, in which case the action is all in instrumental convergence — and does the "psychopath" bit do any real work, or is it just there to scare me? And does the Hume's guillotine comparison hold up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

