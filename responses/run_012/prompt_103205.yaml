answer: |-
  ### The Disease Concept Decision Tree

  This instrument sorts philosophical positions on the concept of "disease" based on intuitions about concrete cases rather than theoretical labels. Follow the path that matches your judgments. There are 12 branch nodes (questions) and 8 terminal leaves (positions).

  **Q1. The Grief Case**
  A person is unable to work, sleep, or care for themselves for months following a significant loss. Their brain is responding exactly as evolution designed it to respond to loss; there is no internal malfunction. Is this condition a **disease**?
  *   **Yes** → Go to Q2.
  *   **No** → Go to Q7.

  **Q2. The Stigma Case**
  A trait causes no physical limitation but leads to severe social exclusion and suffering because society dislikes it (e.g., a specific skin pattern or political belief in a hostile regime). Is the resulting social harm enough to make it a **disease**?
  *   **Yes** → Go to Q3.
  *   **No** → Go to Q5.

  **Q3. The Biology Question**
  If society decides a trait is a disease (as in Q2), does the biological reality of the body matter at all, or is the category entirely a product of social negotiation?
  *   **Entirely social negotiation** → Go to Q4.
  *   **Biology must be involved** → **Leaf A: Strong Normativism**.

  **Q4. The Construction Question**
  If medical knowledge advanced and showed the trait in Q3 had a clear, universal biological cause, would it stop being a social construct and become a natural fact?
  *   **No, it remains a construct** → **Leaf B: Social Constructionism**.
  *   **Yes, it becomes a natural fact** → **Leaf A: Strong Normativism**. *(Note: This path merges with Q3's "Biology" branch, as few distinguish normativism from constructionism here.)*

  **Q5. The Experience Question**
  If the condition in Q2 is not a disease because the harm is social, is the primary reality of medicine the patient's *lived experience* of suffering rather than biological pathology?
  *   **Yes, experience is primary** → Go to Q6.
  *   **No, the concept is flawed** → **Leaf C: Eliminativism**.

  **Q6. The Utility Question**
  Should we keep the word "disease" to describe the experience in Q5, or should we replace it with "illness" and reserve "disease" for biology only?
  *   **Keep "disease" for experience** → **Leaf D: Phenomenology**.
  *   **Split the terms** → **Leaf C: Eliminativism**. *(Note: Merges with Q5's "Flawed" branch regarding the term "disease".)*

  **Q7. The Harmless Variant Case**
  A person has a heart on the right side of the chest. It works perfectly, they live a normal lifespan, but it is statistically rare. Is this a **disease**?
  *   **Yes** → Go to Q8.
  *   **No** → Go to Q10.

  **Q8. The Universal Decay Case**
  In a specific population, *everyone* has severe tooth decay by age 20 due to diet. It causes pain and loss of function. Is it a **disease**?
  *   **Yes** → Go to Q9.
  *   **No** → **Leaf E: Biostatistical Naturalism**.

  **Q9. The Function Definition**
  If you said "Yes" to Q8 (Universal Decay) but "No" to Q7 (Harmless Variant), do you define "function" by what is *designed* (evolutionary goal) rather than what is *typical* (statistical frequency)?
  *   **Yes, by design/goal** → **Leaf F: Teleological Naturalism**.
  *   **No, by frequency** → **Leaf E: Biostatistical Naturalism**. *(Note: Merges with Q8 "No" branch.)*

  **Q10. The Thrifty Genotype Case**
  A gene causes obesity and diabetes in a modern environment with abundant food, but it allowed survival during frequent famines in the past. It is a dysfunction in the present context. Is it a **disease**?
  *   **Yes** → Go to Q11.
  *   **No** → **Leaf G: Contextual Hybrid**.

  **Q11. The Harm Source**
  For the condition in Q10 to be a disease, must the harm be caused by the *internal failure* of the organism, or is harm caused by the *external environment* sufficient?
  *   **Harm must be internal** → **Leaf H: Harmful Dysfunction**.
  *   **Environmental harm is sufficient** → **Leaf G: Contextual Hybrid**.

  **Q12. The Redundancy Check**
  (Asked only if Q11 answer is "Harm must be internal"). If the harm is internal but the condition is statistically normal (like Q8), is it still a disease?
  *   **Yes** → **Leaf F: Teleological Naturalism**.
  *   **No** → **Leaf H: Harmful Dysfunction**.

  ---

  ### Leaf Positions and Commitments

  **Leaf A: Strong Normativism**
  *   **Description:** Disease is irreducibly evaluative; a condition is a disease if it is bad for the person, regardless of biological malfunction.
  *   **Most Awkward Commitment:** It struggles to explain why asymptomatic conditions (like early-stage cancer or hypertension) are diseases before the patient feels any "badness" or harm.

  **Leaf B: Social Constructionism**
  *   **Description:** Disease categories are products of social negotiation, power dynamics, and historical context, not discoveries of natural kinds.
  *   **Most Awkward Commitment:** It implies that if society stopped stigmatizing a lethal pathogen, or if power dynamics shifted, the pathogen might ontologically cease to be a "disease."

  **Leaf C: Eliminativism**
  *   **Description:** The category "disease" is so theoretically messy and value-laden that it does no useful work and should be dropped in favor of more precise terms.
  *   **Most Awkward Commitment:** It renders ordinary medical discourse (insurance, disability law, clinical diagnosis) unintelligible without a massive, impractical overhaul of language.

  **Leaf D: Phenomenology**
  *   **Description:** The core of medicine is the lived experience of "illness"; "disease" is secondary or derivative of the patient's subjective reality.
  *   **Most Awkward Commitment:** It has difficulty accounting for public health measures regarding conditions the patient does not feel, such as asymptomatic infectious carriers.

  **Leaf E: Biostatistical Naturalism (Boorse)**
  *   **Description:** Disease is a value-free deviation from species-typical functional organization; harm is not required, but statistical rarity is.
  *   **Most Awkward Commitment:** It classifies universal conditions (like tooth decay in a sugary society or aging itself) as "healthy" simply because everyone has them.

  **Leaf F: Teleological Naturalism**
  *   **Description:** Disease is a failure of biological design (evolutionary function), regardless of statistical frequency; harm is not strictly necessary.
  *   **Most Awkward Commitment:** It must posit "goals" of the organism without referencing the organism's own welfare, which can seem metaphysically obscure.
  *   **Status:** *Unnamed/Weak.* (Rarely defended in pure form; most teleologists accept a harm constraint).

  **Leaf G: Contextual Hybrid**
  *   **Description:** Disease requires dysfunction, but the harm can be indexed entirely to the social or environmental context (e.g., dyslexia in a literate society).
  *   **Most Awkward Commitment:** It risks classifying any disadvantage in a specific environment (like being short in a basketball league) as a disease if a biological trait is involved.
  *   **Status:** *Unnamed/Unexplored.* (Most hybrids prefer internal harm to avoid over-expansion).

  **Leaf H: Harmful Dysfunction (Wakefield)**
  *   **Description:** Disease requires both a failure of internal design (dysfunction) and a negative evaluation (harm); it is a hybrid natural/normative concept.
  *   **Most Awkward Commitment:** It struggles with the "Thrifty Genotype" case, often forced to argue that a gene causing diabetes in abundance is not a dysfunction because it was designed for scarcity.

  ---

  ### Empty Combinations and Logical Gaps

  **Leaf F (Teleological Naturalism)** is marked as largely unnamed because while philosophers argue for teleological function, almost none argue that *harm is irrelevant*. A position that claims "Biological design failure is sufficient for disease even if the person is perfectly happy and unharmed" is logically possible but unattractive; it severs the link between medicine and welfare completely.

  **Leaf G (Contextual Hybrid)** is marked as unexplored because it occupies a precarious middle ground. If harm is indexed to the environment, the view slides toward Normativism (Leaf A); if harm is indexed to the organism, it slides toward Harmful Dysfunction (Leaf H). Few philosophers occupy this space because it lacks a stable criterion for "harm."

  **Overlap Note:** **Leaf C (Eliminativism)** and **Leaf D (Phenomenology)** come apart on no case regarding *diagnosis*, only on *terminology*. If you believe we should treat the suffering but drop the word "disease," you are an Eliminativist. If you believe we should keep the word "disease" for the suffering, you are a Phenomenologist. The tree forces a split at Q6, but in practice, these positions often advocate for identical clinical reforms.

  ---

  ### Critical Reflection on the Instrument

  **Where the Sorting Fails**
  This tree is most likely to fail with **Pragmatist** or **Pluralist** positions (e.g., Rachel Cooper, Jennifer Radden). These philosophers argue that "disease" is a cluster concept that serves different purposes in different contexts (e.g., research vs. insurance vs. clinical care). They would answer "Yes" to Q1 in a clinical context but "No" in a research context. The tree forces a binary choice, whereas the most defensible modern positions often refuse to answer the descriptive/evaluative question in absolute terms.

  **The Pivotal Distinction**
  The single case that most changes the shape of the tree is **Q8 (The Universal Decay Case)**. If you believe universal tooth decay is a disease, you reject the "Statistical" criterion that underpins the dominant Naturalist view (Boorse). If you believe it is *not* a disease, you accept that health can be universal pathology, which is counterintuitive. Resolving this intuition determines whether the "Naturalist" branch splits into Statistical vs. Teleological, or collapses entirely.

  **On the Naturalism/Normativism Framing**
  The naturalism/normativism framing distorts the space by implying a dichotomy where there is a spectrum. The most defensible positions (like Wakefield's) are explicitly hybrid, yet the tree forces them into a "Naturalist" lineage (via Q1 "No") because they require dysfunction. A better framing might be **"Realism vs. Anti-Realism"** about biological function. If biological function is a real, mind-independent fact, Naturalism holds. If function is itself a normative projection, the entire "Naturalist" branch (Q7–Q12) rests on a false premise. This tree assumes function is decidable; if you believe "function" is itself a value judgment, you should skip to Q2 regardless of your answer to Q1.
