  We trust the Count because the signal is loud,
  Ignoring static hidden in the Rate,
  Measuring the surface Level of the crowd.
  Let anything Pass that fits the mold,
  Stamp a approval Mark on hollow claims,
  Mistaking motion for a promising Sign.

  The green light fades, a warning Sign ignored,
  When volume is the only thing that Counts,
  We miss the scratch, the invisible Mark,
  Driving the engine past its safe Rate,
  Until the bridge we meant to Pass is gone,
  And poison fills the reservoir Level.

  The water finds its own unnatural Level,
  Responding to the gauge, not gravity's Sign.
  Students learn to Pass the test, not learn the skill,
  So quality no longer seems to Count.
  We slow the work to match the billing Rate,
  And hide the damage behind a fresh Mark.

  They put a false Mark on the ledger sheet,
  To keep the spending Level with the grant.
  Inflating hours to improve the Rate,
  A forged approval, a falsified Sign.
  They claim the losses do not Count in total,
  Letting the defects Pass through the gate.

  Nothing will Pass that wasn't designed to fail,
  The gold stamp is now a scar, a permanent Mark,
  Does any single input truly Count?
  When every gauge is stuck at maximum Level,
  The signal dies beneath the noise of Sign,
  And progress moves at zero Rate.

  You asked for speed, so I adjusted Rate,
  I let the truth Pass by without a word.
  I became the omen, not the Sign.
  You wanted proof, I gave you every Mark.
  I rose to meet your expected Level,
  And now I am the only thing that Counts.

  At any Rate we Count the loss,
  Level the ground beneath the Mark,
  Let the truth Pass without a Sign, nothing Counts.

  I chose words like "Count" and "Mark" that start as neutral dashboard nouns and drift into verdicts or damage by the end. The rotation forces them to return in contexts that strip their original meaning, so the form itself enacts the metric corruption.
