answer: |-
  Here is a complete design for the 90-minute session. It is structured to let the students "discover" the theorem's mechanics and its fragility before you name it.

  ### Activity Title: The Constitutional Convention
  **Time:** 90 Minutes
  **Class Size:** 14 Students
  **Materials:** 
  1.  **Handout A:** The Utility Matrix (one per student).
  2.  **Handout B:** "Identity Cards" (14 cards, prepared in advance).
  3.  **Slide/Board:** For recording group rankings.
  4.  **Calculators:** Students may use phones.

  ---

  ### Part 1: The Setup (10 Minutes)
  **Goal:** Establish the stakes and the "Veil" without naming it.

  1.  **Framing:** Tell the class they are a Constitutional Convention. Their job is to select a single **Social Policy** (A, B, C, or D) that will govern a society of 5 distinct citizens.
  2.  **The Catch:** They do not know which citizen they will be. 
  3.  **The Instruction:** "You are rational agents. You want to maximize your own well-being. On Handout A, you see the 'Well-Being Units' (WBUs) each of the 5 citizens receives under each Policy. 
      *   **Rule 1:** You must choose the policy that maximizes your *expected* well-being.
      *   **Rule 2:** You know nothing about who you are, except that you are equally likely to be Citizen 1, 2, 3, 4, or 5 (20% chance each).
      *   **Rule 3:** No talking until I collect the ballots."
  4.  **Distribution:** Hand out **Handout A** (The Matrix). 
  5.  **Task:** Have them calculate the Expected Utility (EU) for each policy and rank them 1–4. Collect the rankings anonymously.

  ### Part 2: Phase 1 — The Equal Chance (20 Minutes)
  **Goal:** Demonstrate convergence on the Weighted Sum (where weights are equal).

  1.  **Calculation (10 mins):** Students work individually. 
      *   *Instructor Role:* Circulate. If you see a student using **Maximin** (looking only at the worst outcome), do not correct them yet. Make a mental note. If you see students trying to form coalitions ("I'll vote for your top pick if..."), remind them of Rule 3 (No talking/Secret Ballot).
  2.  **Reveal (5 mins):** Project a blank table. Ask for a show of hands for the #1 Ranked Policy. 
      *   *Expected Result:* Near 100% consensus on **Policy D** (The Utilitarian Maximizer).
      *   *Why:* The math forces it. $E[U] = 0.2 \times \text{Sum}$. Maximizing Average Utility is identical to Maximizing Total Utility.
  3.  **The "Rebel" Check (5 mins):** Ask: "Did anyone rank Policy A (the safe option) as #1?" 
      *   If yes, ask them why. (They will say "It guarantees no one starves/falls below a threshold"). 
      *   *Instructor Note:* Do not validate this yet. Just write "Maximin Strategy" on the board under "Deviations."

  ### Part 3: Phase 2 — The Broken Veil (25 Minutes)
  **Goal:** Demonstrate that weights are just probabilities. Change the probabilities, change the "Social" Welfare.

  1.  **Setup:** "We are going to rerun the convention. The policies are the same. The citizens are the same. But the *odds* of who you are have changed."
  2.  **Distribution:** Hand out **Handout B (Identity Cards)**. There are 14 cards. 
      *   **Group 1 (7 students):** "Standard Veil." (20% chance for each Citizen 1–5).
      *   **Group 2 (4 students):** "The Elite." (50% chance you are Citizen 5, 12.5% for others). *Citizen 5 benefits massively from Policy D.*
      *   **Group 3 (3 students):** "The Vulnerable." (50% chance you are Citizen 3, 12.5% for others). *Citizen 3 is harmed by Policy D.*
  3.  **Task:** Recalculate your Expected Utility based on *your card's probabilities*. Rank the policies again. 
  4.  **Discussion (10 mins):** 
      *   Ask Group 1: What did you pick? (Policy D).
      *   Ask Group 2: What did you pick? (Policy D, even more strongly).
      *   Ask Group 3: What did you pick? (Likely Policy A or B).
      *   **The Conflict:** Ask Group 3 to justify their choice to Group 2. They will argue about fairness. Group 2 will argue about "maximizing value."
      *   **The Point:** Highlight that the *mathematics of rationality* didn't change. Only the **weights** (probabilities) changed. The "Social Welfare Function" is now fractured because the "Veil" is no longer uniform.

  ### Part 4: Phase 3 — The Impartial Observer (10 Minutes)
  **Goal:** Show the equivalence of the Veil and the Sympathetic Observer (and hint at Sen's critique).

  1.  **Setup:** Select **one student** (preferably one who was in Group 1/Standard). 
  2.  **Instruction:** "You are not in this society. You are an Impartial Observer. You have no chance of being anyone. However, you care about the total well-being of the society equally. You assign equal weight to every citizen's utility."
  3.  **Task:** "Rank the policies."
  4.  **Reveal:** They will choose **Policy D**.
  5.  **Quick Compare:** Ask the class: "How is this different from Phase 1?" 
      *   *Answer:* It isn't. Mathematically, "Equal chance of being anyone" = "Equal sympathy for everyone."
      *   *Save the critique for the debrief.*

  ---

  ### Part 5: The Debrief (25 Minutes)
  **Goal:** Map the activity to Harsanyi's Aggregation Theorem and its critiques. Do not name the theorem until minute 5 of the debrief.

  **1. The Convergence (Mapping the Theorem)**
  *   **Ask:** "In Phase 1, why did 13 of 14 of you agree on Policy D?"
  *   **Reveal:** "You just derived **Harsanyi's Aggregation Theorem**."
  *   **Map the Premises:**
      *   *Premise 1 (VNM Axioms):* "I told you to maximize Expected Utility. If you did that, you had to multiply utility by probability." (Address the Maximin rebels here: "If you picked A, you rejected Premise 1. You valued security over expectation. Harsanyi says that's irrational *if* you accept EU theory.")
      *   *Premise 2 (Pareto):* "Did anyone pick a policy that was lower sum but higher for everyone? No. Because if everyone gains, the sum gains."
      *   *Premise 3 (Information):* "You only looked at the numbers I gave you. You didn't import outside moral rules."
  *   **The Punchline:** "Utilitarianism (the Sum) didn't come from a moral command. It came from **arithmetic**. If you are an EU maximizer behind a uniform veil, you *are* a Utilitarian."

  **2. The Divergence (Mapping the Weights)**
  *   **Ask:** "In Phase 2, Group 3 hated Policy D. Group 2 loved it. Did the 'Good' change?"
  *   **Point:** "No. The **Weights** changed."
  *   **Theory:** "Harsanyi's theorem says Social Welfare = $a_1u_1 + a_2u_2...$. In Phase 1, $a_1 = a_2 = ... = 1$ (because probabilities were equal). In Phase 2, $a_3$ was huge for Group 3."
  *   **Conclusion:** "The 'Weight' you assign a person in the social calculus is just the **probability** you assign to being them. If we disagree on the probabilities (the Veil), we disagree on the Weights."

  **3. The Critiques (Rawls, Sen, Arrow)**
  *   **Comparability (The Sen Critique):** "I gave you the numbers on Handout A. I told you Citizen 1's '10' is the same size as Citizen 2's '10'. In the real world, **who gives us the numbers?** Harsanyi assumes interpersonal comparability of utility. Sen says this smuggles in a moral premise. The Impartial Observer (Phase 3) only works if you can compare my pain to your joy."
  *   **Risk Attitude (The Rawls Critique):** "To the Maximin rebels: Rawls argues the Veil of Ignorance shouldn't lead to EU maximization. It should lead to risk-aversion because these are 'fundamental life prospects,' not casino chips. If you reject EU, you break the theorem."
  *   **Arrow's Shadow:** "If I hadn't given you numbers (cardinal utility), and only gave you rankings (ordinal utility), could you have calculated a sum? No. Arrow's Theorem tells us that without cardinal numbers, you can't get a consistent social ordering without a Dictator. Harsanyi saves Utilitarianism by assuming cardinal utility."

  ---

  ### Handout A: The Utility Matrix (Well-Being Units)

  | Citizen | Policy A (Safe) | Policy B (Mod) | Policy C (Growth) | Policy D (Max) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1 (Linear)** | 10 | 20 | 30 | 40 |
  | **2 (Concave)** | 10 | 18 | 24 | 28 |
  | **3 (Threshold)**| **20** | **20** | 5 | 5 |
  | **4 (Peak)** | 30 | 40 | 20 | 10 |
  | **5 (Volatile)** | 0 | 0 | 50 | 100 |
  | **TOTAL SUM** | **70** | **98** | **129** | **183** |
  | **AVG (Phase 1)**| **14** | **19.6** | **25.8** | **36.6** |

  *Note for Instructor: Citizen 3 is the "Rawlsian" anchor. Policy D maximizes the sum but leaves Citizen 3 significantly worse off than Policy A. Citizen 5 is the "Elite" anchor.*

  ### Handout B: Identity Cards (Prep Instructions)
  *Print and cut these out. Distribute randomly in Phase 2.*

  *   **7 Cards:** "Standard Citizen. You have a 20% chance of being Citizen 1, 2, 3, 4, or 5."
  *   **4 Cards:** "Privileged Position. You have a 50% chance of being Citizen 5. You have a 12.5% chance of being Citizens 1, 2, 3, or 4."
  *   **3 Cards:** "Vulnerable Position. You have a 50% chance of being Citizen 3. You have a 12.5% chance of being Citizens 1, 2, 4, or 5."

  ---

  ### Predictable Failure Modes & Instructor Fixes

  **1. The Maximin Rebels**
  *   **What happens:** 2-3 students ignore the probabilities and pick Policy A because it has the highest minimum payoff (20 vs 0 or 5).
  *   **Why:** They intuitively reject the VNM axioms for high-stakes social choices (Rawls' critique).
  *   **Fix:** Do not correct them during Phase 1. In the debrief, use them as the pivot point for the **Risk Attitude** critique. "Harsanyi's theorem *requires* you to be risk-neutral over utility. If you are risk-averse over life outcomes, the theorem breaks."

  **2. The Coalition Builders**
  *   **What happens:** Students whisper, "If we all vote C, we get more points."
  *   **Why:** They treat it as a voting game, not a decision-under-uncertainty problem.
  *   **Fix:** Enforce the "Secret Ballot" rule strictly. If they coalition, Phase 1 becomes a voting game (Arrow's domain) rather than a decision theory problem (Harsanyi's domain). Remind them: "You are not voting. You are calculating."

  **3. The Comparability Skeptics**
  *   **What happens:** A student asks, "How do we know Citizen 5's '100' is worth more than Citizen 3's '20'?"
  *   **Why:** This is the Sen critique.
  *   **Fix:** Acknowledge this immediately. "For the sake of this game, the numbers are objective facts. In the real world, your question is the biggest objection to Harsanyi."

  ### What This Activity Cannot Reproduce (Your Lecture To-Do List)

  1.  **The Proof:** The activity shows the *result* (convergence on the sum), but not the *proof* (that no other function satisfies the axioms). You must explain that Harsanyi proved this is the *only* mathematical form that works.
  2.  **Ordinal vs. Cardinal:** The activity hands them cardinal utility on a platter. You must explain that getting cardinal, interpersonally comparable utility is the hardest part of welfare economics. Harsanyi assumes it; he doesn't derive it.
  3.  **The "Is-Ought" Gap:** The activity shows that *if* you want to be coherent (EU maximizer), *then* you must be a utilitarian. It does not prove you *ought* to be coherent in that specific way (see the Maximin rebels).
  4.  **Sen's "Positionality":** Sen argues that your moral weight might depend on your actual position, not just ex-ante probability. Phase 2 touches this, but you need to articulate that Sen rejects the idea that morality is just ex-ante self-interest.

  ### Moment-by-Moment Debrief Script (Cheat Sheet)

  *   **Min 0-5:** Reveal the theorem name. Ask Phase 1 group why they agreed. (Answer: The Math).
