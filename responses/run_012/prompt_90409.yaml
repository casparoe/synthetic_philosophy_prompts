          *   *Phase 2:* Break the veil. Give different students different probability distributions over the 5 profiles. Now their Expected Utilities differ. Consensus breaks.
          *   *Phase 3:* Impartial Observer. One student is told "You are not in the society. You care about the sum." Compare their ranking to Phase 1.

  4.  **Developing the Payoff Tables:**
      *   Need 5 "People" (Types A, B, C, D, E).
