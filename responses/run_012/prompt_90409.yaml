      *   **Structure:** Two-phase game (Phase 1: Veil/Equal Chance $\rightarrow$ Convergence on Sum; Phase 2: Broken Veil/Different Probabilities $\rightarrow$ Divergence/Weights as Beliefs). Optional Phase 3 (Impartial Observer).
      *   **Specific Requirements:** Payoff tables (5-6 people, 4-5 policies, specific utility shapes), randomization device, psychological realism, moment-by-moment debrief mapping failures to premises, limitations of the activity.
      *   **Anticipated Problems:** Students rejecting EU for Maximin, coalition formation breaking the veil.
      *   **Constraint:** Do not name the theorem until the debrief.

  2.  **Deconstruct the Theory (Harsanyi's Aggregation Theorem):**
      *   *Premise 1:* Individual preferences satisfy VNM axioms (EU maximization).
      *   *Premise 2:* Social preferences satisfy VNM axioms (Social EU maximization).
      *   *Premise 3:* Weak Pareto (If everyone prefers $L_1$ to $L_2$, Society prefers $L_1$ to $L_2$).
      *   *Premise 4:* Independence/Information (Social ranking depends only on individual utility vectors).
      *   *Conclusion:* Social Welfare Function $W = \sum a_i u_i$.
      *   *The "Veil" Move:* To get $a_i = 1$ (Classical Utilitarianism), you need the "Equal Chance" assumption (ex-ante identity).
