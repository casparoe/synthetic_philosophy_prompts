          *   Pol A: Safe for everyone. Low sum.
          *   Pol B: Moderate.
          *   Pol C: High Sum, but Person 3 gets 0.
          *   Pol D: Highest Sum, Person 3 gets 0, Person 5 gets huge.
      *   This creates tension between Utilitarian (Sum) and Rawlsian (Maximin).

  9.  **Structuring the Debrief (The Crucial Part):**
      *   Must map specific student behaviors to Harsanyi's Premises.
      *   *Premise 1 (VNM/EU):* Address the Maximin rebels.
      *   *Premise 2 (Social EU):* Address the Phase 1 convergence.
      *   *Premise 3 (Pareto):* Did anyone pick a dominated option?
      *   *Premise 4 (Weights):* Phase 2 shows weights are probabilities.
      *   *Comparability:* Mention that we *gave* them numbers. In reality, getting these numbers is the hard part (Sen's critique).
      *   *Arrow:* Mention that if we only had ordinal rankings (no numbers), Phase 1 wouldn't have converged on a sum; it would have cycled or required a dictator.

  10. **Review against Constraints:**
      *   90 mins? Yes, if kept tight.
      *   14 students? Yes.
      *   No theorem name until debrief? Yes.
      *   Address Maximin/Coalitions? Yes, in "Predictable Failures."
      *   Phase 3 (Impartial Observer)? Yes, include it.
      *   Sen/Rawls critique included? Yes, in debrief.

  11. **Final Polish:**
      *   Make sure the instructions are clear enough for the instructor to read directly.
      *   Ensure the math in the table is verifiable.
      *   Tone: Academic but active.

      *(Self-Correction during drafting)*: Wait, if I give them the utility table, I am *giving* them cardinal comparability. The prompt acknowledges this ("the theorem itself doesn't require but the equal-weight conclusion does"). I need to make sure the debrief highlights that *I* did the heavy lifting by providing comparable utils. The activity proves: *IF* utils are comparable *AND* you accept EU, *THEN* Utilitarianism. It doesn't prove utils *are* comparable. I must emphasize this limitation.

