      *   *Materials:* Handouts with the Utility Matrix. Calculators/Phones allowed.
      *   *Phase 1:* "The Equal Chance." You will be assigned to Person 1-5 with equal probability (20% each). Rank the Policies.
      *   *Phase 2:* "The Biased Veil." Hand out cards. Some say "50% chance you are Person 3." Others "Uniform." Recalculate.
      *   *Phase 3:* "The Impartial Observer." One student is told "You are a god. Maximize the total."
      *   *Debrief:* Map the convergence to the Theorem. Map the divergence to the Weights. Map the Maximin rebels to the VNM axioms.

  8.  **Refining the Payoff Table for "Counterintuitive" Results:**
      *   I need a case where the Sum winner hurts a specific person badly, to trigger the Rawlsian intuition.
