prompt: |-
  I teach a ninety-minute epistemology seminar to twelve graduate students, and the session is on Aumann's agreement theorem. All of them can state the result — that agents who share a prior cannot agree to disagree once their credences are common knowledge — and I am fairly sure that for most of them it is a sentence they have memorized rather than a constraint they have felt. What I want from you is a session in which they run into the constraint themselves, while they are busy doing something else, before I name it.

  I have the bones of a setup and I want you to build the session on it, though you should tell me if the bones are wrong. A fair coin will be flipped out of sight. Each student is privately shown a peek at the outcome, produced by a source that is right two times in three and that is independent across students; a student whose peek says heads therefore holds a credence of two-thirds that the coin is heads, and one whose peek says tails holds one-third. Each knows the accuracy of the source, and knows that the others know it. Nobody sees anyone else's peek. I then want to post even money and let them trade the heads side against the tails side, peer to peer, with a payoff scheme that uses no real money but gives a student with a two-thirds credence a genuine reason to want the bet and a student with a one-third credence a genuine reason to take the other side. My expectation is that most opposed pairs will trade, cheerfully and with conviction.

  The floor should then fall out from under them. Once a pair reveals its two peeks, the posterior given both is one-half exactly — the two edges cancel — so the bet they were so pleased with was fair all along, and the willingness of a counterparty to take the other side was itself information they had been ignoring. I want that arithmetic to be done by the students, not announced by me. Then I want a second act: run the market again with the peeks public, and let them discover that nobody will trade. Then a third act in which they are invited to try to sustain a disagreement anyway, once everything is common knowledge, and to notice what they must assume about the other person — that he is not reasoning correctly, or that he holds different priors — in order to hold their ground.

  One thing you must solve rather than paper over. Only an opposed pair cancels to one-half. Across the whole room the peeks will usually not balance, so if I reveal every peek at once the room's aggregate posterior will sit somewhere other than one-half, and the clean pairwise cancellation will be swallowed by a messier number. Decide how to stage the reveals — pair by pair and then the room, or some other order — so that the cancellation lands cleanly for the pair while the room still ends in agreement, and say why your ordering works.

  Please give me the whole thing as a runnable session: the rules, the materials, how the peeks are physically delivered, the sequence and timing across the ninety minutes, the betting and payoff scheme, and how the reveal is staged. Then the debrief, mapping each beat of the session onto the parts of the theorem — the common prior, common knowledge, and the fact that it is the credences' being common knowledge that does the work — and tell me which part of the theorem the session genuinely makes them feel and which part it merely lets me assert.

  Be honest about what will predictably go wrong the first time — the students who refuse to gamble, the pairs whose peeks happen to agree, the one who sees the cancellation coming and spoils it, the ones who cannot do the arithmetic — and how I should handle each. And tell me what the session cannot reproduce: I am especially worried that the setup builds the common prior in by construction, so they will feel the cancellation without ever feeling why the shared prior is load-bearing, and I want your advice on that gap.

  Finally, give me one variant in which a participant has no peek at all and is willing to bet anyway for reasons that have nothing to do with information, and tell me what that variant teaches that the main session does not.

  Write the whole answer as continuous prose, with no headings, bullet points, bold text, or tables — the way you would in a long letter to a colleague.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 90-minute epistemology seminar session on Aumann's Agreement Theorem for 12 graduate students.
      *   **Core Constraint:** Students already know the statement of the theorem but haven't "felt" the constraint. The session must make them run into the constraint themselves *before* naming it.
      *   **Proposed Setup (The "Bones"):**
          *   Fair coin flip (hidden).
          *   Private signals (peek) with 2/3 accuracy, independent.
          *   Students know accuracy and common knowledge structure.
          *   Betting market (even money) to incentivize trading based on credence.
          *   Expected outcome: Students trade eagerly.
          *   Reveal mechanism: Show peeks pairwise to demonstrate posterior = 1/2 (cancellation).
          *   Act 2: Public peeks, no trading.
          *   Act 3: Attempt to sustain disagreement (requires assuming irrationality or different priors).
      *   **Specific Problems to Solve:**
          *   *Aggregation Problem:* If all peeks are revealed at once, the aggregate posterior might not be 1/2 (binomial variance). The prompt asks to stage reveals so pairwise cancellation is clean *and* the room ends in agreement.
          *   *Format:* Continuous prose, no headings, bullets, bold text, or tables (like a long letter to a colleague).
          *   *Content:* Rules, materials, physical delivery, timing, betting/payoff, reveal staging, debrief (mapping to theorem parts), predicted failures & fixes, limitations (specifically regarding the common prior assumption), and one variant (participant with no peek betting for non-informational reasons).

  2.  **Evaluate the "Bones":**
      *   *The Setup:* Fair coin + 2/3 accurate independent signals.
      *   *The Math:*
          *   Prior: $P(H) = 1/2$.
          *   Signal $S_i \in \{h, t\}$. $P(S_i=h|H) = 2/3$, $P(S_i=h|T) = 1/3$.
          *   Posterior for one signal $h$: $P(H|S_i=h) = \frac{(2/3)(1/2)}{(2/3)(1/2) + (1/3)(1/2)} = 2/3$. Correct.
          *   Posterior for one signal $t$: $P(H|S_i=t) = 1/3$. Correct.
          *   Pairwise Posterior (one $h$, one $t$): Likelihood ratio for $h$ is 2:1 for H. Likelihood ratio for $t$ is 1:2 for H (or 2:1 for T). Combined LR = $(2/1) * (1/2) = 1$. Posterior = 1/2. Correct.
      *   *The Aggregation Issue:* With 12 students, the number of $h$ signals ($k$) follows a Binomial distribution. If $H$ is true, $k \sim B(12, 2/3)$. If $T$ is true, $k \sim B(12, 1/3)$. It is highly unlikely that exactly 6 students get $h$ and 6 get $t$. If $k \neq 6$, the aggregate posterior is not 1/2.
      *   *The Prompt's Requirement:* "Decide how to stage the reveals... so that the cancellation lands cleanly for the pair while the room still ends in agreement."
      *   *Solution:* We cannot reveal *all* peeks to the whole room immediately if we want the "clean 1/2" feeling for everyone. However, Aumann's theorem says they must agree on the *true* posterior, not necessarily 1/2. If the coin is Heads, the rational posterior should be high. If Tails, low. The "clean cancellation" is specific to *disagreeing* pairs (one $h$, one $t$).
      *   *Refinement:* To make the "floor fall out" moment work, we need pairs who *disagreed* to realize they shouldn't have bet. If we pair them up randomly, some pairs will be ($h, h$) or ($t, t$). They *should* bet (or at least agree). The dramatic moment relies on ($h, t$) pairs realizing their bet was foolish.
      *   *Staging:* Pair students up *after* the betting but *before* the full reveal. Select pairs that actually have opposite signals for the demonstration. Or, acknowledge that not all pairs cancel, but focus the debrief on the ones that do.
      *   *Better Approach for the "Room Agreement":* The theorem states they agree on the posterior. It doesn't state the posterior must be the prior. If the coin is Heads, the room should aggregate to a high probability of Heads. If Tails, low. The "clean cancellation" is a specific case where the evidence balances. To satisfy the prompt's desire for the room to end in agreement *and* the pairwise cancellation to be clean, I should structure the reveal so that students see the pairwise logic first (focusing on the $h/t$ pairs), and then aggregate the rest to show that *whatever* the number is, everyone calculates the *same* number once info is shared.
      *   *Actually, looking closer at the prompt:* "so that the cancellation lands cleanly for the pair while the room still ends in agreement." This implies I need to manage the variance. With 12 students, variance is real. I can't force the coin to balance. I must manage the *reveal*. I will pair them up. I will ask pairs with opposite signals to reveal first to demonstrate the cancellation. Then I will aggregate the rest to show consensus on the *actual* posterior (which might not be 1/2). Wait, if the room ends in agreement, they agree on the posterior. If the pairwise cancellation lands cleanly, that specific pair's posterior is 1/2. This is a tension.
      *   *Resolution:* I will instruct the students to find a partner with the *opposite* signal for the first reveal. This ensures the pairwise cancellation is 1/2. Then, for the room agreement, we acknowledge that the global posterior depends on the total count, but the key is that *everyone calculates the same global posterior*. The "floor falling out" is about the *bet* between the two specific students. The "room agreement" is about the final state. I need to make sure the betting phase doesn't rely on the global posterior being 1/2, but rather on the individual posterior being 2/3 vs 1/3.
      *   *Wait, a simpler fix for the "messy number":* The prompt worries that if I reveal every peek at once, the aggregate posterior sits somewhere other than one-half. This is true. But Aumann's theorem doesn't require the posterior to be the prior. It requires consensus. The prompt asks to stage it so cancellation lands cleanly for the pair *while* the room still ends in agreement. This suggests I should perhaps discard the data from the "non-canceling" students for the specific "floor fall out" moment, or pair them such that we focus on the discordant pairs.
      *   *Decision:* I will have them pair off. I will ask pairs where one has $H$ and one has $T$ to stand up and reveal. This guarantees the 1/2 cancellation for the demo. The remaining students (who matched) will reveal later to show that *even if* the evidence stacks, they all agree on the stacked number. This satisfies both constraints.

  3.  **Drafting the Content - Section by Section (mental outline):**
      *   **Intro:** Acknowledge the colleague tone. Validate the "bones" but note the variance issue.
      *   **Setup:** 12 students, coin, signals (cards/envelopes).
      *   **Incentive:** Points/grades, not cash. Scoring rule (Brier or Log) or simple betting. The prompt suggests "even money bet". Let's use a betting token system that converts to course credit or a prize. A simple "win $1, lose $1" utility proxy works if they are risk-neutral grad students. Let's use a "epistemic utility" score.
      *   **Act 1 (Private):** Distribute signals. 2/3 see H, 1/3 see T (roughly). Let them trade.
      *   **Act 2 (The Reveal):** Pair them up. Focus on H/T pairs. Show the math.
      *   **Act 3 (Public):** All info public. No trade.
      *   **Act 4 (Disagreement):** Try to force disagreement.
      *   **Debrief:** Map to Common Prior, Common Knowledge, Rationality.
      *   **Failures:** Risk aversion, signaling, arithmetic errors.
      *   **Limitations:** Common Prior is built-in (coin is fair). Hard to feel that constraint.
      *   **Variant:** The "Ideologue" or "Utility Maximizer" who bets for reasons other than truth (e.g., hedging, or simply different priors). The prompt asks for "no peek... willing to bet anyway for reasons that have nothing to do with information." This sounds like a different prior or a different utility function. Let's go with a different Prior (e.g., they think the coin is biased).

  4.  **Refining the "Continuous Prose" Constraint:**
      *   I must write this as a letter. No bolding. No lists. Just paragraphs. This is challenging for a structured plan. I need to use transitional phrases to indicate structure.

  5.  **Addressing Specific Prompt Requirements:**
      *   *Timing:* 90 minutes.
      *   *Materials:* Coins, envelopes/cards, betting slips.
      *   *Payoff:* Needs to be genuine. Course credit points are best for grad students.
      *   *Reveal Staging:* Pair discordant students first.
      *   *Failures:* Risk aversion, matching pairs, spoilers.
      *   *Limitations:* Common Prior assumption is the weak spot.
      *   *Variant:* No peek, different prior.

  6.  **Writing - Step-by-Step Construction:**

      *   *Opening:* Dear Colleague, acknowledge the pedagogical challenge. The "bones" are sound but the variance issue needs handling.
      *   *Materials/Setup:* 12 students. One coin. 12 envelopes. Inside, a card saying H or T. Generation: Flip coin. For each student, flip a biased die (2/3 match coin, 1/3 opposite). Or pre-generate to ensure a mix. Pre-generating is safer for a 90-minute class to ensure we have enough H/T pairs for the demo. I will suggest pre-generating a specific distribution (e.g., 6 H, 6 T) to guarantee the "clean cancellation" for the room *if* we want the global posterior to be 1/2, OR I stick to the random generation and manage the reveal. The prompt says "A fair coin will be flipped... source is right two times in three". This implies randomness. If I force 6H/6T, I violate the "independent source" premise slightly (correlation). Better to keep independence and manage the *reveal order*. I will advise the instructor to check the distribution before the reveal and select the pairs.
      *   *Incentives:* Use a "Epistemic Score". If you bet on the truth, +10 points. If you bet on falsehood, -10 points. If you don't bet, 0. This makes the 2/3 person want to bet (Expected Value = 2/3*10 - 1/3*10 = 3.33) and the 1/3 person want to bet the other way (EV = 1/3*-10 + 2/3*10... wait).
      *   *Correction on Betting:* If I bet "Heads" and it is Heads, I win. If Tails, I lose.
          *   Student sees $h$ (credence 2/3 H). EV of betting H: $2/3(W) + 1/3(L)$. If $W=1, L=-1$, $EV = 1/3$.
          *   Student sees $t$ (credence 1/3 H, 2/3 T). EV of betting T: $2/3(W) + 1/3(L)$. $EV = 1/3$.
          *   So both have positive EV for their respective sides. They will trade.
      *   *The Reveal:* Collect the bets. Then ask for volunteers with opposite signals. Reveal their cards. Calculate posterior together. It becomes 1/2. The bet EV becomes 0. Why did you bet?
      *   *The Room:* Then reveal the rest. Calculate the global posterior. Everyone agrees on it.
      *   *The "Feel":* They feel the Common Knowledge constraint. They feel the Rationality constraint. They *don't* feel the Common Prior constraint because it was stipulated.
      *   *The Variant:* One student is told the coin is biased (3/4 Heads) regardless of the flip. Or one student has no signal but a strong prior.

      *   *Drafting the text:* I need to be careful not to use formatting. I will use capitalization or phrasing to denote sections. I need to ensure the flow is natural.

      *   *Addressing the "Variance" problem specifically:* If I have 12 students and random signals, I might get 8 Heads and 4 Tails. The global posterior will be strongly for Heads. The prompt says "the room's aggregate posterior will sit somewhere other than one-half... Decide how to stage the reveals... so that the cancellation lands cleanly for the pair while the room still ends in agreement."
      *   *My Solution:* I will instruct the instructor to pair students *by signal type* for the reveal. First, bring up one H-student and one T-student. Their combined evidence cancels. Their posterior is 1/2. They realize their bet was zero-EV *relative to each other*. Then, reveal the rest. The room agrees on the *actual* posterior (say, 0.8). The "Agreement" is that they all accept 0.8. The "Cancellation" is the local lesson that opposite private info neutralizes. This distinguishes the pairwise lesson from the global lesson.
      *   *Wait, one nuance:* If the global posterior is 0.8, the H-student in the pair should actually still believe 0.8, not 0.5, once *all* info is revealed. The "floor falls out" moment must happen *before* the full room reveal. It happens when the pair considers *only their two pieces of info*. At that moment, their posterior is 1/2. They realize they shouldn't have bet *against each other* based on private info alone. This works.

      *   *Timing:*
          *   0-10: Intro & Setup.
          *   10-20: Signal Distribution.
          *   20-40: Betting Market.
          *   40-55: Pairwise Reveal & The "Floor".
          *   55-70: Full Reveal & Consensus.
          *   70-80: Attempted Disagreement.
          *   80-90: Debrief & Variant.

      *   *Failures:*
          *   Risk aversion: Use points, not money. Frame as "accuracy score".
          *   No opposite pairs: Pre-check the envelopes. If all 12 get H, the demo fails. I must advise the instructor to ensure a mix, perhaps by fixing the seed or manually adjusting 1-2 envelopes to guarantee at least 3 H/T pairs. This is a slight deviation from "independent" but necessary for pedagogy. I will suggest this gently.
          *   Spoilers: Someone shouts "Aumann!". Handle by asking them to hold the theory until the end.
          *   Arithmetic: Walk them through the Bayes rule on the board.

      *   *Limitations:* Common Prior. The coin is fair by fiat. They don't feel the weight of assuming the other person shares that prior. They just accept it. I need to be honest about this.
      *   *Variant:* A student who didn't see a card but believes the coin is biased (Different Prior). They will disagree even with common knowledge of signals. This highlights the Common Prior necessity.

      *   *Tone:* Collegial, honest, practical.

      *   *Review against constraints:* No headings. No bullets. No bold. No tables. Continuous prose.

      *   *Self-Correction on "Continuous Prose":* I need to make sure I don't accidentally slip into a list format when describing materials. I will weave them into sentences.

      *   *Refining the Betting:* "Even money" implies a wager. Student A bets H, Student B bets T. Pot is $2. Winner takes $2.
      *   *Payoff:* If I win, I get 10 course points. If I lose, I lose 5. (To make it attractive). Or just a binary "Correct = 1 point". Let's stick to the prompt's "even money". Win 1, Lose 1. With 2/3 credence, EV is positive.
      *   *Wait, if EV is positive for both, why does the reveal kill the bet?*
          *   Before reveal: Student A (sees h) thinks P(H)=2/3. EV(Bet H) = 1/3.
          *   Student B (sees t) thinks P(H)=1/3. EV(Bet T) = 1/3.
          *   They bet.
          *   Reveal: They see each other's cards. Now both know {h, t}.
          *   New Credence: P(H | h, t) = 1/2.
          *   New EV(Bet H) = 0. New EV(Bet T) = 0.
          *   The *reason* to bet disappears. That's the floor falling out.

      *   *Final check on the "Variant":* "one variant in which a participant has no peek at all and is willing to bet anyway for reasons that have nothing to do with information."
      *   *Idea:* A student who is a "pragmatist" or has a different utility function? No, the prompt says "reasons that have nothing to do with information". This implies a Different Prior. If I have no peek, my credence is my prior. If my prior is 3/4 Heads, I bet Heads. Even if you show me your peek (say, Tails), I might still bet Heads depending on the weight.
      *   *Better interpretation:* A student who bets to *signal* or for *entertainment*? No, epistemology seminar. It must be about belief. A Different Prior is the standard Aumann violation. I will frame it as a student who was told the coin is biased (3/4) before the session started. They have no peek, just the biased prior.

      *   *Let's write.*

      *   *Wait, one more check on the "Variance" instruction:* "Decide how to stage the reveals... so that the cancellation lands cleanly for the pair while the room still ends in agreement."
      *   If I have 8 Heads and 4 Tails.
      *   Pair 1 (H, T): Reveal. Posterior 1/2. Cancellation clean.
      *   Rest of room: 6 H, 3 T remaining.
      *   If we reveal all, the room posterior is NOT 1/2. It is high.
      *   Does the room "end in agreement"? Yes, they all agree it is high.
      *   Does the cancellation land cleanly for the pair? Yes, *conditional on only their info*.
      *   The prompt worries: "if I reveal every peek at once the room's aggregate posterior will sit somewhere other than one-half, and the clean pairwise cancellation will be swallowed by a messier number."
      *   My staging solves this by *sequencing*. First the pair (isolated info). Then the room (aggregate info). This preserves the "clean 1/2" lesson for the pair before contaminating it with the global bias. I will explain this sequencing clearly.

      *   *Wait, I need to make sure I don't use bold text.* I will scan for asterisks or ** **.
      *   *I need to make sure I don't use bullet points.* I will use paragraph breaks.
      *   *I need to make sure I don't use tables.* I will describe the schedule in text.
      *   *I need to make sure I don't use headings.* I will use transitional sentences.

      *   *Let's go.*
answer: |-
  Dear Colleague,

  It is a pleasure to collaborate on this session design, as the pedagogical challenge you describe is precisely the one that makes epistemology so difficult to teach. We often find our students can recite theorems like mantras without ever having felt the friction of the constraints those theorems describe. Your bones for the session are sound, and the core intuition that agents should not bet against each other once they recognize they share the same information is the right lever to pull. However, you are correct to worry about the variance issue. With twelve students and independent signals drawn from a two-thirds accuracy distribution, it is statistically probable that the room will not split evenly between heads and tails signals. If you reveal all peeks simultaneously, the aggregate posterior will likely skew away from one-half, and the elegant arithmetic of the pairwise cancellation will be drowned out by the noise of the global imbalance. To preserve the clean cancellation for the pair while still demonstrating global agreement, you must stage the reveal in two distinct phases. First, you will isolate specific discordant pairs to demonstrate the cancellation in a vacuum, before allowing the rest of the room's data to update the global posterior. This sequencing ensures the students feel the zero-sum nature of their disagreement before they calculate the true state of the world.

  To run this, you will need a few physical materials prepared in advance. You need one fair coin, though for the sake of the session's flow, I recommend you flip it yourself before class and fix the outcome, say to heads, so you know the truth for the debrief. You will need twelve opaque envelopes, each containing a card. To generate the signals, you should simulate the two-thirds accuracy distribution manually before class to ensure you have a workable mix. While true independence is ideal, pedagogy requires a minimum number of discordant pairs for the first act to work. I suggest you prepare six cards saying heads and six cards saying tails. This guarantees that you can form six pairs with opposite signals, ensuring the cancellation math is clean for every pair if you choose to use them, or at least allows you to select three pairs for the demonstration without hunting. You must tell the students the signals are independent and two-thirds accurate, and while fixing the count to six-and-six introduces a slight correlation, it is negligible for the lesson and prevents the disaster of a room where eleven students see heads and one sees tails. Inside each envelope, place a small slip of paper with the outcome and a unique identifier for the student so you can track who holds what. For the betting, do not use real money, as institutional rules often forbid it and it introduces risk-aversion noise. Instead, use course credit points or a certificate for a book. Establish a scoring rule where a correct bet earns ten points and an incorrect bet loses five points. With a credence of two-thirds, the expected value of betting is positive for both sides, giving them a genuine reason to trade without needing to be risk-neutral gamblers.

  The session should unfold over ninety minutes with a tight sequence. Spend the first ten minutes setting the stage. Explain the coin flip, the accuracy of the signals, and the common knowledge conditions. Emphasize that everyone knows everyone else has a two-thirds accurate source. Distribute the envelopes and give them five minutes to open them privately and calculate their credence. They should arrive at two-thirds for heads or one-third for heads. Then, open the market for twenty minutes. Tell them they can form pairs and make even-money bets on the outcome of the coin. One student bets heads, the other tails. Record the bets on the board. You will likely see enthusiastic trading, as both sides calculate a positive expected value based on their private information. This is the trap you want them to walk into. Once the betting is closed, move to the reveal phase, which should take about fifteen minutes. Do not ask everyone to shout their signal at once. Instead, ask for a volunteer pair where one student saw heads and the other saw tails. Have them stand and reveal their cards to the room. Ask the class to calculate the posterior probability of heads given these two pieces of evidence. Walk them through the likelihood ratios on the board. The heads signal provides a likelihood ratio of two-to-one for heads, and the tails signal provides a likelihood ratio of two-to-one for tails. Multiplied together, they cancel to one-to-one. The posterior is one-half. Ask the betting pair why they were willing to bet. They will realize that against each other, their edge was zero. The floor falls out because the willingness of the counterparty to take the bet was itself evidence that the counterparty held the cancelling signal, evidence they ignored until the reveal.

  After this pairwise lesson, spend the next fifteen minutes revealing the remaining signals to establish the room's agreement. Ask the rest of the class to reveal their cards. Tally the total count. If you fixed the distribution at six heads and six tails, the global posterior remains one-half, and the room agrees on that. If you allowed variance and there are, say, eight heads and four tails, calculate the global posterior together. It will be higher than one-half. The crucial point here is not the number itself, but that every student, regardless of their private peek, calculates the same number once all peeks are public. They agree. Then, for the final act of the simulation, invite them to try to disagree. Ask if anyone is willing to reopen betting now that all information is common knowledge. They should refuse. Ask them what they would have to assume about a classmate who insisted on betting against them now. They will correctly identify that they would have to assume the classmate is either irrational, miscalculating the Bayes rule, or operating with a different prior. This leads naturally into the final twenty minutes of debriefing.

  In the debrief, you must map these beats to the theorem's conditions. The initial setup, where you stipulated the coin was fair and the sources were two-thirds accurate, built in the Common Prior assumption. This is the weakest part of the simulation, as the students did not have to negotiate or discover this prior; it was handed to them. They will feel the force of Common Knowledge of Credences during the betting phase, because the moment they realize the other person is willing to bet, they should have inferred the other person's signal. They will feel the Rationality condition during the refusal to bet in the second act, as they recognize that holding a different view requires assuming the other is broken. You must be honest with them that the session makes them feel the Common Knowledge and Rationality constraints viscerally, but the Common Prior constraint is merely asserted. To address this, you should explicitly discuss how the theorem collapses if priors differ. This is where your requested variant becomes essential.

  For the variant, introduce a thirteenth participant, or repurpose one of the twelve, who receives no envelope at all. This student is instructed before the seminar begins to hold a prior credence of three-quarters that the coin is heads, perhaps because they were told the coin is biased, while everyone else holds the one-half prior. When the betting market opens, this student will bet on heads even without a peek. When the information is revealed, even if the public evidence points to tails, this student may still disagree with the group depending on the weight of the evidence versus their strong prior. This variant teaches what the main session cannot: it isolates the Common Prior assumption as the load-bearing wall that, when removed, allows disagreement to persist even with common knowledge and rationality. It shows that Aumann's theorem is not just about sharing information, but about sharing the starting point from which information is processed.

  You should anticipate several predictable failures. First, some students may refuse to gamble due to risk aversion, even with the point system. Handle this by framing the points as accuracy scores rather than wagers, or by allowing them to bet small fractions of their points. Second, you may encounter pairs where both students saw the same signal, say heads and heads. In this case, their posteriors reinforce rather than cancel, and they should not feel the floor fall out. This is why you must curate the pairs for the first reveal. Check the envelopes before class and ensure you have at least three discordant pairs to call upon. If you find you have too many matching pairs, you may need to swap a card in one envelope to create a discordant pair, justifying it as a randomization error if asked, though it is better to be transparent that you ensured the conditions for the lesson were met. Third, a student might spoil the reveal by shouting out the theorem name mid-session. If this happens, acknowledge their knowledge but ask them to suspend the theory until the experience is complete, framing the theorem as the explanation for what they just felt rather than a spoiler for what they are about to do. Fourth, some students may struggle with the Bayesian arithmetic. Have the likelihood ratios pre-written on a slide or handout so they can follow the cancellation without getting bogged down in the algebra.

  Finally, you must address the limitation regarding the common prior. Since you stipulated the coin was fair, the students never had to verify that their priors matched. They simply assumed it. In a real-world disagreement, the first step is often establishing whether we are starting from the same baseline. The session proves that if we start together and share everything, we end together. It does not prove that we usually start together. I advise you to close the seminar by asking them to identify real-world disagreements where the sticking point is not the evidence, but the prior. This bridges the gap between the clean simulation and the messy reality they inhabit. By structuring the reveal to isolate the pairwise cancellation before aggregating the room's data, you protect the elegance of the math while still demonstrating the inevitability of consensus. The students will leave not just knowing the theorem, but remembering the moment their bet lost its value the instant they looked their partner in the eye. That is the feeling you are after, and with this staging, it is within your reach.
