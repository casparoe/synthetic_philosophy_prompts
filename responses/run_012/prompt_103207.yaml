prompt: |-
  I'm a retired geologist who got into philosophy late, and I've somehow ended up on the advisory board of a small foundation that can fund about three people for two years on conceptual work. We want to put the money into supererogation -- the whole business of acts that are morally good but not required. Which open questions in that area should we prioritize, and why? I don't want a reading list or a survey; I want a defended agenda. I keep getting stuck on a puzzle: if an act is morally better than what's required, why isn't it required? And if it's not required, what makes it better? Take a case: a doctor is the only compatible kidney donor for a stranger and donates. Most people say that's supererogatory, but if the stranger will die otherwise, is it really beyond duty? If yes, what does beyond duty mean when the stakes are life and death? If no, does supererogation just disappear whenever the stakes get high enough? I've been calling it the stakes-collapse worry. I'd like you to use that puzzle, or something like it, to say which questions are upstream of the others -- for instance, whether supererogation is a genuine deontic category or just a way of talking about reasons, whether it can apply to groups, institutions, or AI systems rather than individual humans, and whether the whole idea is coherent given the paradox above. Rank the questions we should fund, say what would move one up or down, and flag which ones are overrated or wouldnt change much downstream.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired geologist, late convert to philosophy, advisory board member of a small foundation.
      *   **Resources:** Funding for 3 people for 2 years (significant but limited).
      *   **Topic:** Supererogation (acts morally good but not required).
      *   **Constraint:** No reading lists or surveys. Wants a *defended agenda*.
      *   **Core Problem:** The "Stakes-Collapse Worry" (If an act saves a life, why isn't it required? If it's not required, what makes it better? Does high stakes eliminate supererogation?).
      *   **Specific Questions to Address:**
          *   Is supererogation a genuine deontic category or just about reasons?
          *   Can it apply to groups/institutions/AI?
          *   Is it coherent given the paradox?
          *   Rank the questions.
          *   Explain what moves them up/down.
          *   Flag overrated questions.

  2.  **Deconstruct the "Stakes-Collapse Worry":**
      *   The user's intuition is sharp. This is essentially the "Demandingness Objection" meeting the "Definition of Supererogation."
      *   If morality is about maximizing good (utilitarianism), supererogation disappears (everything optimal is required).
      *   If morality has limits (deontology/common sense), supererogation exists, but the boundary is fuzzy.
      *   The kidney case is the stress test. If $S$ (sacrifice) is high, does $O$ (obligation) kick in?
      *   *Key Insight:* The definition of supererogation relies on a boundary between "obligatory" and "optional." The stakes-collapse worry suggests this boundary is fluid or non-existent. Therefore, the *metaphysics of the boundary* is the most upstream problem.

  3.  **Brainstorming Research Questions (and filtering):**
      *   *Idea 1: History of Supererogation.* (Too historical, not conceptual enough). -> *Discard.*
      *   *Idea 2: Supererogation in AI.* (Trendy, but depends on whether AI can have duties. Downstream of metaphysics). -> *Keep but rank lower.*
      *   *Idea 3: The Structure of Moral Reasons.* (Why do some reasons mandate and others don't?) -> *High priority.*
      *   *Idea 4: The Cost/Boundary Condition.* (How much sacrifice is too much to require?) -> *High priority (directly addresses stakes-collapse).*
      *   *Idea 5: Collective Supererogation.* (Can a corporation be supererogatory?) -> *Medium priority.*
      *   *Idea 6: The Phenomenology of Praise.* (Why do we praise supererogatory acts?) -> *Lower priority (consequence of the status, not the cause).*

  4.  **Developing the Defended Agenda (The "Why"):**
      *   The user's "Stakes-Collapse Worry" is actually a version of the *Paradox of Supererogation* (formalized by philosophers like David Heyd or Terrance McConnell, though I won't name-drop unnecessarily).
      *   To solve it, we need to know *what grounds the optionality*.
      *   *Hypothesis:* The most productive path isn't analyzing more cases (kidney, soldier, billionaire), but analyzing the *normative architecture* that allows an act to be best-but-not-mandatory.
      *   This points to **Option 1: The Deontic Structure (The "Logic" of the Boundary).**
      *   Then, **Option 2: The Agent-Relative Prerogative (The "Cost" Mechanism).** This explains *why* the doctor isn't required to give the kidney (rights over self).
      *   Then, **Option 3: Non-Human Agents (The "Scope" Extension).** If we solve 1 & 2, we can apply it to AI/Corps. If not, this is nonsense.

  5.  **Ranking and Justifying:**

      *   **Priority 1: The Metaphysics of Optionality (The "Logic" Project).**
          *   *Why:* If supererogation is incoherent (as the stakes-collapse suggests), the rest is waste. We need to know if "forbidden, obligatory, optional, supererogatory" is a valid map.
          *   *Connection to Worry:* Directly addresses whether "better but not required" is a logical contradiction.
      *   **Priority 2: The Grounds of the Duty-Limit (The "Cost" Project).**
          *   *Why:* The kidney case turns on *sacrifice*. We need a theory of why personal cost creates an "out" clause. Is it a prerogative? A right?
          *   *Connection to Worry:* Explains why high stakes don't automatically collapse into duty (unless the cost is low).
      *   **Priority 3: Collective and Artificial Supererogation (The "Agent" Project).**
          *   *Why:* High impact if successful, but depends on 1 & 2. Can a corporation have "personal cost"?
          *   *Connection to Worry:* Tests the robustness of the theory.

  6.  **Identifying Overrated/Low Impact Questions:**
      *   *Phenomenology of Praise:* Interesting, but doesn't solve the coherence problem.
      *   *Historical Genealogy:* (e.g., Saints vs. Heroes). Doesn't solve the logical puzzle.
      *   *Applied Case Studies (without theory):* Just arguing about more kidney cases won't help without the structural theory.

  7.  **Drafting the Response (incorporating the Geologist Persona):**
      *   Use analogies related to strata, fault lines, or structural integrity (since the user is a geologist).
      *   Keep it rigorous but accessible.
      *   Directly address the "Stakes-Collapse Worry."
      *   Ensure the "Defended Agenda" format is clear.

  8.  **Refining the Argument (Self-Correction during drafting):**
