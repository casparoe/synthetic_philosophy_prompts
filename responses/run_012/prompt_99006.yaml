answer: |-
  Citizenship is the promise to tend the ground beneath your feet, not because the rest of the world is irrelevant, but because this is where your hands can reach.

  Welcome. Look around this room. It is a map of the world.

  You have passed the tests. You have the certificate. But I want to talk about what happens when you leave this building.

  For years, many of you have lived here. You walked on public roads. Your children went to public schools. When you were wronged, you used our courts. When you were afraid, you called our police. You accepted the benefits of this house.

  Today, you agree to help hold up the roof.

  This is the first duty: fair play. If you drink from the well, you help keep it clean. It would be unfair to take the safety and the order without helping to pay for it, or vote for it, or defend it. We are all building something together. If you join the crew, you carry the lumber.

  But there is a second duty, deeper than fair play. It is about relationship.

  By standing here, you are saying: "These specific people are my neighbors." And being a neighbor creates reasons to act that you do not have for strangers. When a neighbor falls, you help them up. Not because they are better than anyone else, but because they are beside you.

  Now, I know what some of you might be thinking. Maybe you have heard it too.

  Why these neighbors? Why not the stranger abroad who is hungrier, colder, in more danger?

  Is it right to care for the person next door just because they live next door?

  It is a hard question. I will not pretend it is easy.

  If we say citizenship matters, are we saying the rest of the world matters less?

  Logically, it is hard to explain. A child starving overseas is just as valuable as a child starving here. The pain is the same. The need is real.

  But life is not lived in logic. It is lived in reach.

  You cannot be everywhere. You cannot fix every roof. You cannot guard every street.

  Citizenship is an admission of limits.

  It is an agreement that if we all tend to the ground beneath our own feet, the whole world might stand stronger.

  It does not erase your duty to humanity. It focuses your duty to your community.

  You will still feel the pull of the wider world. You should.

  That tension you feel? That guilt? Do not kill it.

  Let that pull make you generous. Let it make you kind.

  But do not let it paralyze you.

  You are here. Your hands are here. The work is here.

  There are potholes to fill. There are schools to fund. There are neighbors to welcome, just as you were welcomed today.

  This is not the only good work in the world. But it is your share of the work.

  So, do not treat this certificate as a trophy you won. Treat it as a tool you picked up.

  Use it to build something here.

  And when you look at the horizon, and feel the tug of those far away, do not turn away.

  Just know that by stabilizing this corner of the earth, you are doing something real.

  Welcome to the burden. Welcome to the privilege.

  Welcome home.
