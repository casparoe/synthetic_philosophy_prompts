      *   **The Dispute:** Three specific conventions:
          1.  Tipping (service charge added, but cash tip expected).
          2.  Queueing (loose line, can leave place if you ask).
          3.  Jaywalking (illegal, but everyone does it when clear).
      *   **The Arguments:**
          *   *Rana:* "Guest follows house rules." Obligation based on reliance/expectations of others + force of the "done thing" + host/guest asymmetry (locals do X, guests must do Y).
          *   *Devi:* Distinction between economic obligation (tip) vs. coordination (queue/light). Reliance test fails for jaywalking (drivers expect jaywalking). Host/guest asymmetry reduces morality to prudence (avoiding resentment).
      *   **The Task:** Adjudicate move-by-move (where each is right/wrong), identify what both miss, and address three specific questions (a, b, c). Rate each move (Clearly Mistaken to Clearly Right) with a one-line justification.

  2.  **Deconstruct the Arguments (Move-by-Move Analysis):**

      *   **Rana Move 1:** "Guest follows house rules." (Obligation to tip, queue properly, wait for light).
          *   *Analysis:* Good starting heuristic, but too blunt. Treats all norms as identical.
          *   *Rating:* Partially Right (Good heuristic, bad nuance).
      *   **Devi Move 1:** Distinction between Tip (economic/owed) vs. Queue/Light (coordination). Coordination isn't moral.
          *   *Analysis:* Strong distinction. Tipping involves distributive justice/wages. Queueing/Lighting are coordination games. However, coordination *can* generate moral obligations (fairness).
          *   *Rating:* Mostly Right (Crucial distinction, but understates coordination morality).
      *   **Rana Move 2:** Reliance argument. Workers rely on tips, queuers rely on place-holding, drivers rely on pedestrians. Wronging people = defeating known reliance. Plus "force of the done thing."
          *   *Analysis:* Reliance is a strong moral ground (Humean convention). "Force of the done thing" is weaker (is-ought problem). The driver reliance claim is empirically shaky regarding jaywalking.
          *   *Rating:* Mixed (Reliance is strong, driver reliance is weak, "done thing" is philosophically dubious).
      *   **Devi Move 2:** Reliance proves too much/too little. Jaywalking: Drivers *don't* rely on waiting; they expect crossing. So by Rana's logic, I *should* jaywalk. "Force of done thing" = majority preference, not obligation.
          *   *Analysis:* Very strong point on the jaywalking inconsistency. Exposes the gap between *statute* and *practice*. Preference $\neq$ Obligation is a solid philosophical point.
          *   *Rating:* Clearly Right (Exposes internal contradiction in Rana's reliance claim regarding jaywalking).
      *   **Rana Move 3:** Host/Guest Asymmetry. Locals live by practice; Visitors held to rule. Locals resent it more when *guests* break norms. Second-order convention binds the guest.
          *   *Analysis:* Sociologically accurate (outsiders are scrutinized more). Philosophically tricky: Does social resentment create *obligation* or just *risk*?
          *   *Rating:* Partially Right (Accurate description of social dynamics, questionable derivation of moral obligation).
      *   **Devi Move 3:** Prudence vs. Morality. If obligation = avoiding resentment, it's prudence, not morality. Rana: Wronging someone = disregarding legitimate expectation.
          *   *Analysis:* Devi hits the Is-Ought gap. Rana tries to bridge it with "legitimate expectation."
          *   *Rating:* Devi is Right on the distinction; Rana is Right that expectations matter, but they need legitimacy independent of mere existence.

  3.  **Address the Three Specific Questions:**

      *   *(a) Categories:* Are they different? Yes. Tipping is quasi-contractual/distributive. Queueing is fairness/cooperation. Jaywalking is safety/legal coordination. Rana's single reliance account is too blunt, especially for jaywalking where reliance is on *not* waiting.
      *   *(b) Host/Guest Asymmetry:* Is it genuine or special pleading? It's a genuine social phenomenon (the "visitor standard"), but it doesn't automatically create *moral* obligation. It creates a duty of *respect* or *integration*, but can slide into xenophobia if the "rule" is arbitrary. It's a duty of *comity*, not necessarily strict morality.
      *   *(c) Prudence vs. Morality:* Is Devi's objection fatal? No, but it sets a boundary. Avoiding resentment is prudence. Fulfilling a *legitimate* expectation is morality. The trick is defining "legitimate." If the expectation is "guests must be better than locals," is that legitimate?

  4.  **Identify What Both Are Missing:**
      *   **Integration vs. Visitation:** The user has lived there for *three months*. They are not a tourist. They are a resident. The "Guest" framework might be expiring.
      *   **The Function of the Norm:** Tipping sustains income. Queueing sustains fairness. Jaywalking (in this context) sustains flow/efficiency (perhaps).
      *   **Moral Agency:** Blindly following vs. understanding *why*.
      *   **The "Clean Hands" Problem:** If locals break the law (jaywalking), do they have standing to demand guests obey it? (Hypocrisy).

  5.  **Drafting the Response:**
      *   *Structure:*
          1.  Introduction (Acknowledging the complexity).
          2.  Move-by-Move Adjudication (with Ratings).
          3.  Addressing the Three Specific Questions (a, b, c).
          4.  What Both Missed (The "Third Way").
          5.  Practical Verdict for the User.
      *   *Tone:* Philosophical, balanced, adjudicatory, practical.
      *   *Constraint Check:* Rate each move (Clearly Mistaken to Clearly Right) + one-line justification. Address (a), (b), (c).

  6.  **Refining the Ratings and Justifications:**
      *   *Rana 1:* "Mostly Right" - Good default, lacks nuance.
      *   *Devi 1:* "Clearly Right" - Crucial categorical distinction.
      *   *Rana 2:* "Mixed" - Reliance works for tips, fails for jaywalking.
      *   *Devi 2:* "Clearly Right" - Destroys the reliance argument for jaywalking.
