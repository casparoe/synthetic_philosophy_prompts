      *   *Devi 3:* "Mostly Right" - Prudence/Morality distinction is vital.

  7.  **Refining the "What They Missed" Section:**
      *   *Residency Status:* 3 months isn't a vacation. The "Guest" label is wearing thin.
      *   *Normative Validity:* Not all local norms are morally neutral. Jaywalking might be safety vs. efficiency.
      *   *Reciprocity:* If locals break the law, they waive the right to enforce it on guests *unless* there's a specific reason (safety).

  8.  **Final Review against User Prompt:**
      *   Did I go through the exchange move by move? Yes.
