answer: |-
  Your commitments are logically inconsistent because the first three entail ex ante utilitarianism, which is mathematically incompatible with both prioritarianism and independent procedural fairness.

  Commitments 1, 2, and 3 jointly imply ex ante utilitarianism: Harsanyi's theorem combined with ex ante Pareto and anonymity forces the social welfare function to be a linear sum of individual expected utilities. This creates two genuine tensions with your remaining commitments.

  The first and most severe tension is between ex ante Pareto (2) and prioritarianism (4). Prioritarianism requires a concave transformation of welfare levels to give priority to the worse off, but ex ante Pareto combined with Harsanyi's aggregation requires linearity in individual utilities. You cannot simultaneously satisfy the Pareto principle for individuals (who maximize expected utility) and apply a non-linear transformation for society without violating either Pareto or the expected-utility axioms for social preferences. This is a foundational impossibility result; you must choose between respecting individual ex ante preferences strictly or implementing prioritarian weighting.

  The second tension, which is conceptually distinct but stems from the same root, is between ex ante social evaluation (1) and procedural fairness (5). Under ex ante evaluation, a fair coin flip and an arbitrary queue assignment yield identical social value when individuals are identical and risk-neutral, because the sum of expected utilities is the same (0.5 + 0.5 = 1 + 0). To value the coin flip as strictly better, the social evaluation must be sensitive to the ex post distribution of outcomes (inequality aversion), which an ex ante framework ignores by definition. This tension is slightly less severe than the first only because it could theoretically be resolved by stipulating that individuals derive utility from fairness, but you explicitly stated fairness should be a feature of social evaluation itself.

  To resolve both tensions with a single revision, you must abandon commitment 2 (ex ante Pareto) and modify commitment 1 to adopt ex post social evaluation. Shifting to ex post prioritarianism allows you to maintain anonymity (3), implement prioritarian weighting (4), and value procedural fairness via reduced ex post inequality (5). The cost is accepting that social choices may sometimes contradict unanimous individual ex ante preferences, which is the standard trade-off for prioritarian views.
