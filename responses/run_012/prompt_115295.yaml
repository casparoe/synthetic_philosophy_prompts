      *   **Closing:** What separates them? One saves the *principle* at the cost of *logic*; the other saves the *logic* at the cost of the *principle's universality*. What would settle it? A theory of the nature of truth/knowledge relation.

  4.  **Refining the Arguments (Self-Correction during drafting):**
