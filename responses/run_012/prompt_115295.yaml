      *   **Philosopher B's Solution:** Restrict the Knowability Principle (KP) to non-epistemic truths (truths that don't mention knowledge). The Fitch conjunction is excluded.
      *   **Conflict:** Each thinks the other's solution is worse than the problem.
      *   **Requirements:**
          *   Dialogue format.
