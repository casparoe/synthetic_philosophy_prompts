  Your officemate is a **Quasi-Realist** (likely following the tradition of Simon Blackburn or Allan Gibbard). She is trying to solve the **Frege-Geach problem** (the embedding problem) without abandoning the core expressivist insight that moral talk is rooted in attitudes rather than facts.

  Here is the breakdown of her position, her verdict on the new case, and how to test her view.

  ### 1. Will she say the disjunction is true or false?
  **She will say it can be "true" (in her thin sense).**

  For a Quasi-Realist, asserting a disjunction like *"Either eating meat is wrong or keeping chickens as pets is wrong"* does not describe a state of the world. Instead, it expresses a **higher-order attitude**.

  *   **Bare Assertion:** "Eating meat is wrong" = "Boo eating meat!"
  *   **Disjunction:** "Either meat is wrong or chickens is wrong" = "Boo to the combination of [Eating Meat] AND [Keeping Chickens]!"

  She is committing herself to a constraint on her own attitudes: she is ruling out the possibility of approving of *both* actions simultaneously. If she holds that higher-order commitment, she will endorse the sentence as "true." If she sees no conflict between eating meat and keeping chickens, she will call it "false" (or simply reject it).

  ### 2. What rule is she actually running?
  She is running **Option 3: "Something else" (Quasi-Realism).**

  Here is why the other two options don't fit her specific commitments:

  *   **Not Option 1 (Truth-conditions only when embedded):** You noted she is adamant there is **no equivocation**. Option 1 suggests the sentence changes its semantic nature when it moves from a bare assertion to an "if" clause (shifting from expressive to descriptive). She explicitly denies this. She wants the meaning to remain constant.
  *   **Not Option 2 (No truth value ever):** You noted she **will** call moral sentences "true" if pushed, albeit in a "thin" sense. A strict non-cognitivist (Option 2) would say calling a moral sentence "true" is a category mistake. She is trying to *earn the right* to use truth-talk, not eliminate it.

  **Her Rule:** Moral sentences express attitudes, but we can legitimately project truth-talk and logical validity onto them because our attitudes have a logical structure (consistency, inconsistency, entailment). Validity isn't about truth-preservation in the realist sense; it's about **commitment-preservation**. If you accept the premises, you are rationally committed to the conclusion, or else your set of attitudes is inconsistent.

  ### 3. What further case would tell those apart?
  Since she has already tipped her hand by accepting "thin truth" for bare assertions (ruling out Option 2) and denying equivocation (ruling out Option 1), the real philosophical battle is distinguishing her **Quasi-Realism (Option 3)** from **Moral Realism** (which also accepts truth and logic).

  To confirm she is an expressivist and not a realist in disguise, use the **Euthyphro Test** or the **Mind-Independence Case**.

  **The Case:**
  Ask her: *"Suppose everyone in the world, including you, felt perfectly comfortable with eating meat. Would it still be **true** that eating meat is wrong?"*

  *   **The Realist (Cognitivist):** Will likely say **Yes**. Moral truths are mind-independent facts. Even if we all approve of slavery or meat-eating, it could still be wrong.
  *   **Your Officemate (Quasi-Realist):** Must say **No** (or hesitate significantly). For her, the "truth" of the moral claim is grounded in the stance/attitude. If the attitude vanishes, the "truth" (even the thin version) vanishes. The truth is *dependent* on the endorsement.

  **Alternative Logical Test (Distinguishing Option 3 from Option 1):**
  If you want to strictly distinguish her Quasi-Realism from the **Contextualist/Hybrid view (Option 1)**, ask about **Unembedded Truth Ascriptions**.

  Ask: *"Can I walk up to you when we aren't arguing and say, 'It is true that eating meat is wrong'? Is that a meaningful sentence?"*

  *   **Option 1 (Contextualist):** Might say this is odd or meaningless. They often reserve truth-conditions for embedded contexts (logic) while treating bare assertions as purely expressive.
  *   **Option 3 (Your Officemate):** Will say **Yes**. A core tenet of Quasi-Realism is that moral sentences are truth-apt *everywhere*, not just in logic puzzles. They mimic realist grammar completely.

  ### Summary
  She is a **Quasi-Realist**. She treats moral logic as a logic of **consistent planning or attitude** rather than a logic of facts. She will accept the disjunction as "true" if it reflects a consistent constraint on her commitments. To verify this, ask if moral truth survives the total disappearance of human moral attitudes; if she says no, she's an expressivist. If she says yes, she's a realist.
