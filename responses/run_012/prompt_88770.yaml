answer: |-
  **The Custody Condition: Individuating the Extended Mind**

  The Extended Mind Thesis (EMT), famously articulated by Clark and Chalmers, posits that the vehicles of cognition are not confined by the skull. Where an external resource plays a role in a cognitive task that is functionally equivalent to an internal process, that resource ought to be considered part of the cognitive system. Otto's notebook, in which he stores information he would otherwise memorise, is the paradigmatic example. However, the thesis has long suffered from a problem of boundaries. If cognition extends wherever there is reliable coupling, what prevents the mind from leaking into the entire environment? To resolve this, I argue for a constraint I shall call the **Custody Condition**. An external resource counts as part of a subject's cognitive system only if the subject stands in a relation of custody to it. This entails the ability to maintain the resource, to recognise when it has failed, and to repair or replace it. Mere reliance is insufficient. Without this condition, the EMT cannot answer the fundamental question of *whose* mind an extended process is. Furthermore, while this condition faces challenges from cases of distributed cognition, it ultimately provides a non-stipulative account of cognitive ownership grounded in agency and normative responsibility.

  The primary motivation for the Custody Condition is the individuation problem. Standard formulations of EMT rely heavily on the Parity Principle: if a process were performed in the head, we would deem it cognitive; therefore, if performed externally, it is also cognitive. Yet, parity alone fails to distinguish between a constituent of the mind and a tool the mind uses. I rely on the ground to walk and the sun to see, but neither the earth nor the sun are parts of my perceptual or motor systems. If we define extension merely by reliable reliance, the boundaries of the mind become co-extensive with whatever the subject happens to be using at the time. This renders the concept of a specific 'subject' incoherent. If you and I both rely on the same cloud server to store our memories, and reliance is the only criterion, do we share a single mind? Or do we possess two minds that overlap?

  The Custody Condition resolves this by tying the cognitive system to a locus of agency. A cognitive system is not merely a processing unit; it is a goal-directed entity capable of self-regulation. For an external resource to be constitutive of *my* mind, I must be responsible for its integrity. I must be able to notice if the notebook page is torn (recognise failure), glue it back together (repair), or buy a new book (replace). This loop of maintenance ensures that the resource is governed by the same normative standards as my biological neural processes. If the resource degrades, *I* am the one whose cognitive capacity is diminished, and *I* am the one obligated to restore it. Thus, the answer to "whose mind is it?" is straightforward: it belongs to the custodian. Without custody, there is no owner, only a user.

  When we apply this condition to familiar candidates, the distinction between genuine extension and mere tool use becomes sharp. Consider Otto's notebook. Otto carries it everywhere, curates its contents, and turns to it automatically. He buys the ink and the paper. If the book is lost, he suffers a cognitive deficit until he replaces it. Otto stands in a relation of custody; therefore, the notebook is a genuine extension of Otto's mind.

  Contrast this with a modern satellite navigation system (sat-nav). A driver may rely on the device utterly, following its instructions without question. However, the driver does not maintain the satellite constellation, nor do they repair the software when it glitches. If the system fails, the driver cannot fix it; they can only abandon it. The driver stands in a relation of reliance, not custody. Consequently, the sat-nav is best described as a tool the mind uses, not a part of the mind itself. This aligns with our intuition that while Otto is forgetful *because* his notebook is lost, a driver is not cognitively impaired *because* the GPS is down; they are merely inconvenienced. The GPS remains part of the environment, coupled to the driver, but not constitutive of the driver's cognitive architecture.

  The strongest case against the Custody Condition arises from scenarios of interlocked, distributed thinking where custody is shared or absent. Imagine a team of emergency responders operating in a crisis zone. They utilise a shared digital dashboard displayed on a ruggedised tablet passed between them. This dashboard aggregates data from drones, medical sensors, and structural monitors. The thinking of the team is deeply interlocked through this resource; no single individual could process the data alone. Yet, no single responder maintains the server, writes the code, or repairs the hardware. Indeed, the device is owned by the state, and its maintenance is contracted to a third party. If the Custody Condition requires individual custody, it seems we must deny that this resource is part of *any* of their cognitive systems. This implies that the team's sophisticated, integrated problem-solving is not a cognitive system at all, but merely a collection of individuals manipulating a tool. This conclusion seems counter-intuitive; the dashboard appears to function as a shared working memory for the group.

  How ought the Custody Condition respond to this? It must avoid the trap of simply stipulating that 'groups' can be custodians without explaining how. The condition should assert that in such cases, if no individual possesses custody, the resource does not extend any *individual* mind. It remains environmental scaffolding. However, if the *group* acts as a collective agent with collective custody, then the resource extends the *group* mind. The distinction is not merely semantic; it is grounded in the locus of normative responsibility.

  In the emergency responder scenario, if the dashboard fails, do the individuals feel a personal responsibility to repair it, or does the 'team' initiate a protocol to replace it? If the latter, the cognitive system is the team-plus-dashboard. The 'subject' is the collective. If, however, the device is treated as a disposable commodity provided by an external agency, and the responders have no authority to maintain or alter its function, then it is not part of their cognitive system. It is a feature of the landscape, like a road sign.

  This answer is not merely stipulative because it tracks the presence of a feedback mechanism essential for cognition. Cognition involves error correction. If a resource is part of a cognitive system, the system must be able to detect errors within that resource and act to correct them to satisfy the system's goals. In the case of the shared dashboard, if the team has no power to fix or replace it, they cannot correct errors arising from the device itself; they can only compensate for them. They are reacting to the environment, not regulating a component of their own system. Therefore, to claim the dashboard is part of their mind without custody is to ignore the regulatory loop that defines cognitive agency.

  If the team *does* have the authority to reboot the system, recalibrate sensors, or vote to replace the hardware, then they hold collective custody. In this instance, the Custody Condition validates the extension, but it locates the mind in the collective agent, not the individuals. This preserves the integrity of the thesis: there is still a subject (the collective) that stands in the requisite relation of maintenance and repair to the resource.

  In conclusion, the Custody Condition is a necessary refinement of the Extended Mind Thesis. By demanding that a subject be able to maintain, monitor, and repair an external resource, we secure the boundaries of the cognitive system against the charge of triviality. It allows us to distinguish between Otto's notebook, which is part of his mind, and a sat-nav, which is a tool he uses. Furthermore, it provides a principled way to handle cases of distributed cognition. Where custody is absent, there is no cognitive extension, only environmental coupling. Where custody is held collectively, the extension is real, but the mind in question is that of the group. Ultimately, the mind extends only as far as the agent's responsibility for the integrity of the process. To think is not merely to rely; it is to take care.
