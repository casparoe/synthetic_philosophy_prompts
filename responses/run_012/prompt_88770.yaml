      *   Standard Criteria (Parity Principle): If a process were in the head, we'd deem it cognitive; so if it's outside but functionally equivalent, it's cognitive.
      *   Problem: The "Coupling-Constitution Fallacy" (Adams & Aizawa). Just because X is coupled to Y doesn't mean X is part of Y.
