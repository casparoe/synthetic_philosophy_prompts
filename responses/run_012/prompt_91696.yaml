prompt: |-
  Spent most of last night arguing with a mate about welfare. He's got this picture where a big chunk of people are gaming the system and that's why you need work requirements, sanctions, conditonality, the whole apparatus. I price insurance for a living, so the whole time I was mentally re-describing what he was saying in my own vocabulary to see if it survived the trip. Some of it did. Some of it went strange on me.

  So here's what I want. Take his position, the deserving/undeserving split plus the case for conditionality and sanctions as the fix, and restate it as faithfully as you can in the vocabulary of an insurance actuary. Risk pools, experience rating, moral hazard vs adverse selection, screening vs monitoring, the difference between a type you can classify someone into up front and a behaviour you can only catch after the fact, deductibles and co-pays, verification costs, residual risk. Don't soften it into a strawman and don't just relabel it, actually do the translation claim by claim.

  Then the residue report. What carries over cleanly? What has to be bent to fit? And what has no counterpart in my vocabulary at all? For that last lot, tell me for each one whether it's a hole in the actuarial framing, something real about welfare that pricing language genuinely can't see, or a sign that the original claim was vaguer than it sounded. My gut says 'undeserving' is a moral category with no actuarial slot, and I can't work out if that's the most important thing about it or an admission that there's nothing there. I'm not a philosopher but I'm very fluent on the insurance side, so don't dumb it down.
reasoning: |-
