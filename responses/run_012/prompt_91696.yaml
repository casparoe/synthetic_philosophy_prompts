      *   He believes *screening* (upfront) isn't enough; you need *monitoring* (ongoing) because risk type is dynamic.

  4.  **Residue Report Phase (The Analysis):**
      *   *What carries over:* Moral hazard is a perfect fit. Incentive alignment is core to insurance. Verification costs are real.
      *   *What bends:* "Risk" in insurance is usually random/external. Unemployment has structural/macro components not easily modeled as individual risk. The "type" (deserving/undeserving) is assumed static in simple models but dynamic in reality.
      *   *What doesn't translate:* The normative concept of "deservingness." Insurance cares about *contractual compliance*, not *moral worth*. Also, the "social dividend" or macroeconomic stability function of welfare isn't priced in private insurance.
      *   *The "Undeserving" Question:* Is it a hole in actuarial framing or a sign the claim is vague? It's likely a category error. Actuarial science classifies risk, not virtue. "Undeserving" usually maps to "High Moral Hazard," but the moral weight implies a social contract breach, not just a financial loss.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't validate the friend's empirical claim (that "a big chunk" are gaming). Treat it as a *hypothesis* within the model.
      *   *Nuance:* In insurance, if verification costs exceed the saved loss, you drop the requirement. The friend often ignores administrative load. I need to highlight this tension.
      *   *Nuance:* Adverse Selection vs. Moral Hazard. The friend is talking about Moral Hazard (behavior change). Adverse Selection (hidden type upfront) is less relevant unless he thinks people pretend to be unemployed *before* joining (which isn't how universal welfare works).
      *   *The "Deserving" Trap:* In insurance, there is no "deserving." There is "covered" and "not covered." If the contract says "must seek work," failing that is a breach. The *reason* (can't vs. won't) matters for *verification*, not morality.

