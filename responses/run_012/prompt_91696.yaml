answer: |-
  This is a rigorous exercise in model mapping. You are asking to project a socio-political argument onto a stochastic/financial framework. The goal isn't to validate the empirical premises of your mate's argument (i.e., whether the fraud rate is actually high), but to test the *structural logic* of his proposed solution using insurance mechanics.

  Here is the translation of his position into actuarial vocabulary, followed by the residue report.

  ### Part 1: The Translation
  **The Premise:** The welfare system is a risk pool covering income interruption (unemployment/disability).
  **The Mate's Claim:** The pool is suffering from severe *ex-post moral hazard*.

  | Welfare Concept | Actuarial/Insurance Equivalent | The Logic Translation |
  | :--- | :--- | :--- |
  | **"People gaming the system"** | **Ex-Post Moral Hazard** | The insured event (unemployment) is partially controllable by the policyholder. Coverage reduces the marginal cost of remaining unemployed, inducing a behavioral shift that increases claim frequency beyond the baseline risk. |
  | **"Deserving vs. Undeserving"** | **Involuntary Loss vs. Strategic Claim** | *Deserving:* High-risk type where $P(\text{Employment}) \approx 0$ due to exogenous factors (disability, macro shock). <br>*Undeserving:* Low-risk type where $P(\text{Employment}) > 0$, but the utility of benefits exceeds the utility of labor net of effort. |
  | **"Work Requirements"** | **Loss Mitigation Clauses / Warranties** | Policy conditions requiring the insured to take specific actions to minimize the duration or probability of the loss. Breach of warranty voids coverage. |
  | **"Sanctions"** | **Claim Denial / Policy Lapse** | A penalty function applied upon verification of non-compliance. Effectively a retrospective deductible that can reach 100% of the claim value. |
  | **"Conditionality"** | **Experience Rating / Dynamic Pricing** | Future benefit eligibility or level is contingent on past behavior. Similar to No-Claims Discounts in reverse: bad behavior (non-compliance) increases the "price" (reduces benefits) or triggers exclusion. |
  | **"Screening" (Upfront)** | **Underwriting** | Attempting to classify risk types at entry (e.g., medical assessments for disability). Your mate argues this is insufficient because risk type is dynamic or opaque. |
  | **"Monitoring" (Ongoing)** | **Claims Adjustment / Auditing** | Continuous verification of the insured state. Requires an expense loading to cover the cost of investigation. |
  | **"The Whole Apparatus"** | **Expense Loading** | The administrative cost required to enforce warranties and detect moral hazard. This reduces the loss ratio but increases the combined ratio. |

  **The Mate's Argument in Your Language:**
  "The current scheme has poor incentive compatibility. Because the deductible is zero and monitoring is low, we are seeing high frequency of claims driven by moral hazard rather than incidence of risk. We need to introduce a behavioral deductible (conditionality) and increase claims auditing (monitoring). Even if this increases expense loading, the reduction in pure loss cost (fraudulent/unnecessary claims) will improve the overall loss ratio and preserve the pool for the high-risk types (the truly disabled)."

  ***

  ### Part 2: The Residue Report

  Here is where the translation friction occurs. Some concepts map 1:1; others break the model.

  #### 1. What Carries Over Cleanly
  *   **Moral Hazard:** This is the strongest fit. Insurance pricing is fundamentally built on managing the incentive to cause or prolong a loss. Your mate's entire argument rests on the elasticity of labor supply relative to benefit levels. In insurance terms, he is arguing the *demand curve for claims* is too elastic.
  *   **Verification Costs vs. Saved Loss:** You immediately recognized the trade-off. In insurance, you only investigate a claim if $Cost(\text{Investigation}) < Expected(\text{Recovery})$. Your mate's argument holds water *only if* the savings from sanctions exceed the administrative load of the conditionality apparatus. If the bureaucracy costs more than the fraud it catches, the scheme is actuarially unsound.
  *   **Segmentation:** The desire to separate "types" (disabled vs. lazy) is classic risk classification. Insurers constantly try to find proxies for risk types to price accurately.

  #### 2. What Has to Be Bent to Fit
  *   **The Definition of "Risk":** In insurance, risk is typically an exogenous shock (fire, accident, death). In welfare, the "risk" (unemployment) is often endogenous (labor market structure, skills mismatch) or macroeconomic. Treating unemployment purely as an individual risk event ignores *systemic risk*. An actuary knows you can't price away a recession with sanctions; that's correlation risk, not moral hazard.
  *   **Dynamic Risk Types:** In your mate's model, a person is either "Type A (Can't work)" or "Type B (Won't work)." In reality, risk types migrate. A "Type A" can become "Type B" (recovery) and vice versa (health deteriorates). Insurance models struggle with *state dependence* over long tails. Sanctions assume a static ability to comply, whereas insurance pricing usually assumes risk parameters are stable for the policy term.
  *   **The "Deductible" Mechanism:** In insurance, a deductible is financial (you pay the first $500). In welfare, the "deductible" is behavioral (you must prove you applied for 5 jobs). This is harder to price. A financial deductible is binary and objective; a behavioral deductible is subjective and requires adjudication, introducing *operational risk* (errors in judgment, bias) that doesn't exist in a standard excess clause.

  #### 3. What Has No Counterpart (The Null Set)
  *   **Moral Deservingness:** Insurance contracts are amoral. A claim is valid if the event occurred and premiums were paid, regardless of whether the insured is a "good person." There is no actuarial slot for "virtue."
  *   **Social Externalities:** Private insurance ignores the cost of *non-payment* to the broader system. If an insurer denies a claim, the insured might go bankrupt, but that's the insured's problem. If the State denies welfare, the residual risk (homelessness, crime, public health collapse, civil unrest) is externalized back onto the State. Private pricing models do not internalize systemic destabilization costs.
  *   **Mutuality vs. Pooling:** Commercial insurance is a voluntary exchange. Welfare is a mandatory pool (taxation). The "customer" cannot lapse the policy. This changes the power dynamic entirely. You cannot price risk the same way when the counterparty cannot leave the pool.

  ***

  ### Part 3: The "Undeserving" Verdict

  You asked: *Is 'undeserving' a moral category with no actuarial slot, and is that a hole in the framing or a sign the claim is vague?*

  **It is a category error.**

  In your vocabulary, "undeserving" translates to **"High Moral Hazard / Breach of Warranty."**
  However, the word "undeserving" carries a normative weight that "Breach of Warranty" does not.

  1.  **If it's a hole in the actuarial framing:**
      It suggests that pricing models cannot capture the *social contract* element. Insurance is a private contract; welfare is a social stabilizer. If you treat welfare purely as insurance, you miss the "peace of mind" dividend that comes from universal coverage, which has value even if the loss ratio is poor. You cannot price "social cohesion" easily. If your mate's model ignores this, he is optimizing for *financial efficiency* while potentially degrading *systemic stability*.

  2.  **If it's a sign the claim is vague:**
      This is the more likely technical failure. "Undeserving" is a proxy for **"Unobservable Heterogeneity."**
      Your mate sees a claimant and cannot observe their true *employability type*. He assumes that because he can't observe it, a significant portion are hiding low-risk types (people who could work but don't).
      *   **The Actuarial Reality:** You cannot sanction your way out of *information asymmetry*. If you cannot distinguish Type A from Type B cheaply, harsh sanctions function as a **Type II Error cost**. You will inevitably penalize Type A (the truly unable) who failed the behavioral test due to friction (lack of transport, childcare, mental health barriers).
      *   In insurance terms, this is **False Positive Risk Classification.** If your screening model (conditionality) has a high false-positive rate, you are denying valid claims. In a commercial insurer, this leads to litigation and reputation loss. In welfare, it leads to destitution.

  **Conclusion on "Undeserving":**
  It is not that there is "nothing there." There is *risk* there, but it is mislabeled as *virtue*.
  Your mate is arguing for stricter **underwriting criteria** at the claims stage.
  The "hole" is that he assumes the cost of False Positives (punishing the truly disabled) is zero or negligible. In insurance pricing, if your fraud detection model flags 20% of honest customers as fraudsters, the model is trash because the friction cost (churn, complaints, legal) outweighs the fraud savings.

  If you apply your pricing discipline to his argument, you would ask him: *"What is the False Positive Rate of your sanctions regime? What is the expense loading of the monitoring? And have you priced the systemic risk of increasing the tail severity for the high-risk pool?"*

  If he can't answer those, his model is under-reserved.
