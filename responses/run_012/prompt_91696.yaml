      *   *"Deserving" (Can't work)* $\rightarrow$ *High-Risk Type (Unobservable Heterogeneity / Involuntary Loss).*
      *   *"Undeserving" (Won't work)* $\rightarrow$ *Strategic Claimants / Opportunistic Behavior.*
      *   *Conditionality/Sanctions* $\rightarrow$ *Policy Conditions / Deductibles / Co-pays / Monitoring & Verification.*
      *   *Work Requirements* $\rightarrow$ *Loss Mitigation Requirements / Duty of Disclosure (ongoing).*
