prompt: |-
  I'm a third-year PhD student in philosophy and next week I've got to run the advance-directives session in the med school's required clinical-ethics thread — eighty minutes, about twenty second-years, most of them have done a couple of rotations so a few have actually watched a family fight over a feeding tube, and at least two have a grandparent with dementia. Dont explain the position to me, I know it — plan how I teach it. You're a clinical ethics educator who's run this session a hundred times, so write it like you're handing me your own notes: the order the pieces have to come in and why (what has to be in place before "the earlier self's authority" is a real question rather than a slogan), which single case should carry the whole thing, the misconceptions this crowd will bring or form and exactly where in the sequence I should head each one off, the one question I can ask in the last ten minutes that tells me whether they got it or just picked up the vocabulary, and what I should openly say I'm not covering and why. No readings, they won't do them.

  The case I want to build the session on is one I made up, so please don't reach for something you've half-remembered from the literature — I've been calling it the lighthouse letter. A woman in the early stages of Alzheimer's writes a letter to be read aloud to her by whoever is looking after her once she stops recognising them. In it she refuses antibiotics, refuses to be moved into a nursing home, and — this is the hinge — tells them not to be swayed by her happiness: if she seems content, that isn't her, don't believe it. By the time the letter gets read she's cheerful and settled, doesn't know her daughter's name but knows her face, and says she wants the antibiotics. The letter disqualifies the only evidence there could be that it's wrong.

  The session has to make them see why that isn't just a cute puzzle but the actual shape of the problem — and why the two reactions they'll reach for first ("it's her body, she bound herself, end of story" and "she's happy now, who cares what a well person wrote about a sick person's life") are both too fast. They'll also want to turn the whole thing into a personal-identity question ("is she even the same person?") and I think that's a trap I need to defuse rather than use. And I'm nervous about the disability objection — that if we let a pre-dementia self outvote a demented one we've said something ugly about the value of cognitively disabled lives — I want that on the table early rather than landing as a gotcha in the last five minutes. Think carefully about the dependency order before you write anything; brainstorm the misconception map first, then sequence.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** 3rd-year PhD student in philosophy.
      *   **Task:** Plan an 80-minute clinical ethics session for 2nd-year med students (approx. 20 students).
      *   **Topic:** Advance Directives (specifically focusing on the authority of the "earlier self" vs. the "current self" in dementia).
      *   **Constraint 1 (Persona):** I am an experienced clinical ethics educator handing over my own notes. Tone should be practical, direct, pedagogical, and experienced ("run this session a hundred times").
      *   **Constraint 2 (Content):** Do *not* explain the philosophical positions (user knows them). Focus on *teaching strategy*: sequence, timing, case usage, misconception management, the "killer question," and scope limitations.
      *   **Constraint 3 (Case):** Use the user's specific case ("The Lighthouse Letter"). Do not substitute with standard literature cases (e.g., Dworkin's Margo).
      *   **Constraint 4 (Specific Challenges):**
          *   Avoid the "personal identity trap" (don't let them solve it by saying "she's a different person").
          *   Address the disability objection early (don't let it be a late gotcha).
          *   Prevent premature closure on the two obvious reactions (autonomy vs. current well-being).
          *   No readings (students won't do them).
      *   **Goal:** Make them see this isn't just a puzzle but the *actual shape* of the problem. Ensure they grasp the tension, not just the vocabulary.

  2.  **Deconstruct the Audience & Context:**
      *   **Med Students (Year 2):** Some clinical exposure (rotations), some personal experience (grandparent with dementia). They are pragmatic, focused on action/decision-making, often uncomfortable with ambiguity. They want to know "what do I do?"
      *   **Time:** 80 minutes. Tight. Needs pacing.
      *   **Philosophy PhD Student:** Needs to avoid getting lost in theory and stay grounded in clinical reality while maintaining philosophical rigor.

  3.  **Brainstorming the Misconception Map:**
      *   *Misconception 1: The Legalistic View.* "The document is binding. End of story." (Ignores the moral weight of current suffering/joy).
      *   *Misconception 2: The Paternalistic/Well-being View.* "She's happy now, the letter doesn't matter." (Ignores precedent autonomy and the integrity of a life plan).
      *   *Misconception 3: The Metaphysical Dodge.* "She's not the same person anymore." (Dissolves the ethical conflict rather than solving it. Needs defusing).
      *   *Misconception 4: The Disability Objection.* "Valuing the past self devalues the disabled present self." (Needs to be framed carefully to avoid shutting down the debate).
      *   *Misconception 5: The Clinical Fix.* "Let's just check if she has capacity right now." (Misses the point of the AD).

  4.  **Sequencing & Dependency Order:**
      *   *Why Disability First?* If you wait until the end, students feel tricked. If you raise it early, it frames the stakes. It prevents the "earlier self is the *real* self" assumption from taking root unchallenged.
      *   *Why the Case Early?* They need the concrete details before the abstract principles. The "Lighthouse Letter" is specific enough to block generalizations.
      *   *Why Personal Identity Later?* If you start with "is she the same person?", you lose the clinical tension. You need them to feel the conflict first. Then show them why metaphysics doesn't save them.
      *   *The "Killer Question":* Needs to test if they understand the *conflict*, not just the *solution*. It shouldn't have a right answer, but the reasoning should reveal their grasp of the tension.

  5.  **Drafting the Plan - Section by Section:**

      *   **Header:** Set the tone. "Here are the notes."
      *   **The Setup (0-10 mins):** Hook them. Acknowledge their experience. State the goal (not to solve, but to navigate).
      *   **The Case (10-25 mins):** Tell "The Lighthouse Letter." Get their gut reactions.
      *   **The Disability Objection (25-40 mins):** *Crucial move.* Put this here. Why? Because if they argue for the letter, they need to know *why* it might be offensive. If they argue against it, they need to know *why* it might be protective.
      *   **The Personal Identity Trap (40-55 mins):** Address the "she's a different person" argument. Show why it doesn't help the clinician.
      *   **The Two Extremes (55-70 mins):** Formalize the "Binding Contract" vs. "Current Well-being" views. Show why both fail in isolation.
      *   **The Killer Question (70-80 mins):** The assessment.
      *   **Scope Limitations:** What are we *not* doing? (Legal specifics, capacity assessment mechanics, surrogate hierarchy).

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about putting the disability objection later. But the prompt says "I want that on the table early." Okay, I will move it up, right after the initial gut reaction.
      *   *Correction:* Make sure I don't sound like I'm lecturing philosophy. I need to sound like I'm coaching a teacher. Use imperative verbs. "Stop them here." "Write this on the board."
      *   *Refining the Case:* Ensure the "Lighthouse Letter" details are clear. The specific instruction "don't be swayed by her happiness" is the key.
      *   *Refining the Killer Question:* It needs to force them to weigh the competing values. "What do you tell the daughter?" is too vague. "What goes in the chart?" is too bureaucratic. How about: "If you follow the letter, what value are you prioritizing? If you ignore it, what value are you risking?" No, that's too easy. Let's try: "What specific harm is done if you obey? What specific harm is done if you disobey?" That forces concrete clinical thinking.

  7.  **Final Polish:**
      *   Check tone: Experienced, slightly weary but sharp, respectful of the PhD student's knowledge but demanding on pedagogy.
      *   Check constraints: No readings? Check. 80 mins? Check. Specific case? Check.
      *   *Key Insight:* The prompt asks for "dependency order." I need to explicitly state *why* piece B cannot happen before piece A.
      *   *Disability Objection:* This is the trickiest part. It needs to be framed not as "you're ableist" but as "this policy has social consequences."
      *   *Personal Identity:* Keep it brief. Med students don't care about Locke. They care about responsibility. Frame it as "Does metaphysics change the clinical duty?"

  8.  **Final Review against Prompt:**
      *   "Don't explain the position to me." -> Okay, focus on pedagogy.
      *   "Write it like you're handing me your own notes." -> Use formatting that looks like a lesson plan/handout.
      *   "Which single case." -> The Lighthouse Letter.
      *   "Misconceptions... exactly where in the sequence." -> Mapped out.
      *   "One question in the last ten minutes." -> Defined.
      *   "What I should openly say I'm not covering." -> Defined.

      *(Self-Correction on the "Killer Question")*: The prompt asks for a question that tells me "whether they got it or just picked up the vocabulary." A question like "What is precedent autonomy?" is vocabulary. A question like "What do you do?" is too simple. The question needs to reveal if they understand the *tragic remainder*—that there is a moral loss either way.
      *Idea:* "If you decide X, whose life is being sacrificed?" Or "What is the cost of your decision?"
      *Better:* "Write down one sentence to the daughter justifying your decision. Now underline the word that represents the value you are overriding." This forces them to acknowledge the loss.

      *Wait, let's look at the "Disability Objection" timing again.* The prompt says "I want that on the table early rather than landing as a gotcha." Okay, I will place it immediately after the initial vote, before we dig into the philosophy of autonomy. This prevents them from getting comfortable with the "Autonomy wins" narrative.

      *Let's finalize the structure.*
      1. Intro & Stakes (10)
      2. The Case & Gut Check (15)
      3. The Disability Objection (15) - *Early intervention*
      4. The Identity Trap (15) - *Defusing*
      5. The Conflict (Autonomy vs. Well-being) (20)
      6. The Killer Question (5)

      *Wait, 80 minutes.*
      0-10: Intro.
      10-25: Case.
      25-40: Disability.
      40-55: Identity.
      55-70: The Conflict/Synthesis.
      70-80: Closing Question.
      *Actually, I need to make sure the "Conflict" section is the meat.* Let's tighten the Identity section. Med students glaze over metaphysics. Keep it to 10 mins. Expand the Conflict/Synthesis to 20.

      *Revised Plan:*
      0-10: Frame.
      10-25: Case + Vote.
      25-40: Disability Objection (The "Ugly" Question).
      40-50: Identity Trap (The "Easy" Way Out).
      50-70: The Real Conflict (Precedent Autonomy vs. Current Interest).
      70-80: The Assessment.

      *Okay, ready to write.*
answer: |-
  **TO:** PhD Candidate / Instructor
  **FROM:** Senior Clinical Ethics Faculty
  **RE:** Session Plan — Advance Directives & Dementia (80 mins)
  **SUBJECT:** The Lighthouse Letter

  Here are the notes. I've run this session enough to know where the wheels come off. You know the literature (Dworkin, Dresser, Jaworska), so I'm not going to waste your time summarizing critical interests vs. experiential interests. You know the theory. Your job is to stop them from using the theory as a shield against the clinical reality.

  The goal of this hour isn't to solve the case. It's to make them uncomfortable enough that they stop looking for a algorithm. If they leave thinking "It depends," you failed. If they leave thinking "There is a moral loss either way, and I have to own it," you succeeded.

  Here is the sequence. Do not scramble the order. The dependency is critical.

  ***

  ### 1. THE SETUP (0:00 – 0:10)
  **Goal:** Lower the temperature, raise the stakes.
  **Action:** Do not start with definitions. Do not start with "What is an advance directive?" They think they know. They are wrong.

  *   **Say this:** "Most of you think advance directives are about control. They aren't. They are about conflict. Specifically, conflict between the person who wrote the document and the person lying in the bed. Today we aren't talking about legal compliance. We are talking about who you serve when those two people want different things."
  *   **The Hook:** Acknowledge the room. "Some of you have seen families fight over feeding tubes. Some of you have grandparents who don't know your names. Keep those faces in mind. If this session feels abstract, it's because I'm doing it wrong."
  *   **Why here:** You need to establish that *ambiguity* is the clinical reality, not a failure of the document. If you start with legalities, they will treat ethics as compliance.

  ### 2. THE CASE: "THE LIGHTHOUSE LETTER" (0:10 – 0:25)
  **Goal:** Concrete immersion. Block generalizations.
  **Action:** Read the case yourself. Do not put it on a slide. Make them listen.

  *   **The Details:** Emphasize the specific instruction: *"If she seems content, that isn't her, don't believe it."* This is the hinge. It preempts the "but she's smiling" argument.
  *   **The Vote:** Ask for a show of hands. "Who gives the antibiotics? Who withholds?"
  *   **The Trap:** They will split 50/50. The "Autonomy" camp will say "She signed it." The "Beneficence" camp will say "She's suffering if we deny treatment."
  *   **Instruction:** Write the two positions on the board. Label them **"The Contract"** (Past Self) and **"The Patient"** (Present Self). Do not use philosophical jargon yet.
  *   **Why here:** You need their gut reactions on the board *before* you complicate them. If you introduce the disability objection now, they will use it to justify their vote rather than examine it. Let them commit first.

  ### 3. THE DISABILITY OBJECTION (0:25 – 0:40)
  **Goal:** Head off the "Ugly" argument before it becomes a weapon.
  **Dependency:** This *must* come before the Personal Identity discussion. If you wait, they will use "she's a different person" to dodge the disability critique.

  *   **The Move:** Turn to the "Contract" camp (those who follow the letter).
  *   **Say this:** "If we enforce this letter, we are saying her current life—cheerful, settled, recognizing faces—is not worth living. We are prioritizing a dead woman's philosophy over a living woman's joy. Does that sound like we value disabled lives?"
  *   **The Misconception:** They will think this objection only applies to *withholding* treatment. Correct them. "It also applies if you ignore the letter. If you ignore it, you are saying she is too incompetent to have made a binding plan. You are infantilizing her past self."
  *   **Why here:** This creates the "moral remainder." It ensures that whichever side they pick, they feel the cost. It stops the "Autonomy" team from feeling morally superior. It forces the "Beneficence" team to admit they are overriding a competent wish.
  *   **Facilitator Note:** If a student says, "But she *was* competent," stop them. "She was. But does that competence give her the right to dictate the terms of a life she can no longer understand?" Don't answer it. Leave it hanging.

  ### 4. THE PERSONAL IDENTITY TRAP (0:40 – 0:50)
  **Goal:** Defuse the metaphysical dodge.
  **Dependency:** This comes *after* the disability objection. Why? Because the disability objection grounds the stakes in social harm. Identity theory is abstract. If you do identity first, they will float away into metaphysics. If you do it after disability, you can frame identity as a *clinical* problem, not a philosophical one.

  *   **The Misconception:** "She's not the same person anymore, so the letter doesn't count."
  *   **The Counter:** "Okay. Assume she is a different person. Who is responsible for her care? You. Who is liable if you neglect her prior wishes? You. Does metaphysics change your license requirements?"
  *   **The Point:** "Whether she is the 'same' person is a seminar question. Whether you honor her life's narrative is a clinical one. Don't use Locke to get out of this."
  *   **Why here:** You need to clear the board of easy outs. Once they realize metaphysics won't save them, they are forced back into the ethical conflict.

  ### 5. THE REAL CONFLICT (0:50 – 1:10)
  **Goal:** Deepen the tension. Move from "What do I do?" to "What am I protecting?"
  **Dependency:** Now that the easy outs (disability, identity) are blocked, they have to sit with the two hard options from the start.

  *   **Revisit the Board:** Look at "The Contract" vs. "The Patient."
  *   **The Nuance:**
      *   **For The Contract:** It's not just autonomy. It's *integrity*. It's the right to shape the narrative of your whole life, not just the chapters you remember. If we ignore this, we make life plans meaningless.
      *   **For The Patient:** It's not just happiness. It's *harm*. Administering antibiotics might prolong a life she explicitly said she didn't want. But denying them causes physical suffering *now*.
  *   **The Clinical Reality:** "In this room, there is no clean win. If you follow the letter, you harm the woman in the bed. If you ignore the letter, you harm the woman who wrote it. You are choosing who to betray."
  *   **Why here:** This is the core learning objective. They need to see that clinical ethics is often about managing moral loss, not eliminating it.

  ### 6. THE KILLER QUESTION (1:10 – 1:20)
  **Goal:** Assessment. Distinguish vocabulary from understanding.
  **Constraint:** One question. Last 10 minutes.

  *   **The Question:** "Take out a piece of paper. Write the one sentence you would say to the daughter to justify your decision. Then, circle the word in that sentence that represents the value you are *sacrificing*."
  *   **Why this works:**
      *   If they write "I'm following the law," they missed the point (Vocabulary/Compliance).
      *   If they write "I'm doing what's best," they missed the point (Paternalism).
      *   If they circle a word like "wishes," "comfort," "integrity," or "safety," they acknowledge the trade-off.
      *   **The Tell:** If they can't circle a word because they don't think they sacrificed anything, they didn't get it. They think there was a right answer. There isn't.
  *   **Closing:** Collect the papers. Do not give the "right answer." Say: "Keep those papers. In five years, one of you will have this exact case. Read that sentence. See if you still believe it."

  ***

  ### WHAT YOU ARE NOT COVERING (And Say So)
  **Goal:** Manage scope anxiety. Med students hate loose ends.

  *   **Say this explicitly at the start:** "I am not teaching you how to assess capacity. I am not teaching you the legal hierarchy of surrogates. I am not telling you what to put in the chart."
  *   **Why:** If you don't say this, they will spend 40 minutes asking about POLST forms and power of attorney law. That is for the legal module. This session is about the *moral weight* of the document.
  *   **The Boundary:** "If the question is 'Can I legally do this?', ask the lawyer. If the question is 'Should I?', that's why you're here."

  ***

  ### FACILITATOR CHEAT SHEET: MISCONCEPTION MAP

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"The Document is a Contract"** | During the Vote (0:20) | Acknowledge it, but label it "The Contract." Ask: "Can a contract bind someone who can't understand the terms?" |
  | **"She's Happy, Ignore It"** | During the Vote (0:20) | Acknowledge it, label it "The Patient." Ask: "If we ignore this, can anyone ever trust their future self's plans?" |
  | **"Disabled Lives Don't Count"** | **Must be raised by YOU (0:30)** | Do not wait for them. If you wait, it becomes an accusation. Frame it as a systemic risk: "Does this policy devalue the demented?" |
  | **"She's a Different Person"** | Mid-discussion (0:45) | Treat it as a clinical dodge. "Does 'different person' change your duty of care?" |
  | **"Just Check Capacity"** | Anytime | "Assume she lacks capacity for this decision. That's why the letter exists." |

  ***

  ### FINAL ADVICE
  You are a philosopher. You will want to resolve the tension. **Don't.**
  If a student asks, "So what *is* the answer?" your response is: "What did you circle on your paper?"

  The tension is the lesson. If they leave relaxed, you haven't done your job. If they leave worried that they might betray a patient no matter what they do, they are ready for the wards.

  Good luck. Stick to the timing. The disability objection is the pivot point—if you rush that, the rest collapses.
