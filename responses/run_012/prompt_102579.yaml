answer: |-
  We, the undersigned representatives of differing perspectives on the nature of human cognitive variation, having engaged in adversarial collaboration to clarify the empirical and theoretical landscape of intelligence research, hereby issue this joint statement to delineate where our views converge, where they diverge, and what evidence we agree would adjudicate those divergences. We begin by affirming a shared commitment to the observable phenomena, acknowledging first the robust empirical finding known as the positive manifold, wherein performance across diverse cognitive tasks tends to correlate positively rather than independently. We agree that scores on standardized psychometric instruments predict significant variance in educational attainment, occupational performance, and other life outcomes beyond what is explained by socioeconomic status alone. Furthermore, we concede that test performance is invariably influenced by familiarity with test formats, quality of schooling, and cultural context, meaning that no measure of cognitive ability is entirely culture-free or immune to situational factors. We also agree that individual differences in test performance show considerable stability over time within a given context, suggesting that whatever is being measured possesses temporal consistency even if its underlying nature is disputed.

  Despite this agreement on the data patterns, we diverge fundamentally on the causal explanation of the positive manifold and the ontological status of the construct being measured. The first substantive crux concerns whether the correlations among cognitive tasks require a single underlying cause or could instead arise from mutual causal interaction among distinct processes. Those of us who view intelligence as a general capacity maintain that the positive manifold is best explained by a latent common cause, often referred to as g, which reflects a biological property of the nervous system such as neural efficiency or processing speed. Those of us who view intelligence as a situated achievement maintain that the correlations emerge from a network of mutually reinforcing skills, where learning one skill facilitates the acquisition of another, or from the sampling of overlapping tasks required by specific cultural environments. We agree that the case bearing on this crux involves longitudinal intervention studies and network psychometrics applied to process data rather than just sum scores. In advance of these studies, the general capacity camp predicts that a dominant general factor will remain stable even when specific skills are controlled for or trained, indicating a unitary underlying trait. The situated achievement camp predicts that the factor structure will dissolve or shift significantly when specific processes are modeled dynamically, indicating that the correlations are emergent properties of interacting skills rather than evidence of a single thing in the head.

  The second substantive crux concerns the interpretation of secular trends in test scores, specifically whether the large secular rises in raw scores show intelligence to be a fixed absolute capacity or only a shifting rank order. Those of us who hold to a fixed capacity view argue that these rises, known as the Flynn effect, reflect improvements in test-taking sophistication, abstract problem-solving strategies, or environmental conditions that boost performance without altering the underlying biological capacity, implying that the rank order of individuals relative to their peers remains the true metric of the capacity. Those of us who hold to a situated view argue that these rises demonstrate that the capacity itself is malleable and co-constructed by the environment, meaning that the absolute level of cognitive functioning can change across generations and that rank order is only meaningful within a specific historical and cultural moment. We agree that the case bearing on this crux requires examining whether score gains transfer to real-world complexity and novel problem-solving outside the testing environment. In advance of this analysis, the fixed capacity camp predicts that secular score gains will show weak correspondence with increases in real-world cognitive complexity, suggesting the gains are test-specific. The situated achievement camp predicts that secular score gains will correspond strongly with improved adaptive functioning in daily life, suggesting the gains reflect a genuine expansion of cognitive capacity.

  Finally, we acknowledge that a portion of our dispute is merely verbal, centering on the definition and reification of the word intelligence itself. We agree that conflict arises when one side uses the term to denote a biological property existing independently of context, while the other uses the term to denote a social attribution of competence within a specific environment. We recognize that arguing over whether intelligence is real often reduces to arguing over whether the noun intelligence refers to a causal entity or a descriptive summary of behavior. By distinguishing these definitions, we agree to avoid conflating the existence of stable individual differences with the existence of a singular, context-independent entity. We commit to future research designed to test the predictions recorded herein, accepting that the resolution of these cruxes may require refining our theories to accommodate evidence that challenges our prior commitments.
