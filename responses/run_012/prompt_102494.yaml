  # Seminar Opener: "The Retrospective Audit"

  This game is designed to induce the specific anxiety of Roko's Basilisk—the feeling that you are being judged by a fixed fact that you cannot causally influence, yet your choice feels like it determines the outcome. It avoids technical jargon until the debrief.

  **Time Required:** 20 Minutes (10 min play, 10 min debrief)
  **Participants:** 15 Grad Students
  **Stakes:** Seminar Participation Points (e.g., 5% of final grade) or equivalent departmental "credit."

  ## 1. Preparation (The Fixed Predictor)
  To make the predictor "transparently fixed" without magic, you need a correlation that exists *before* they walk in.
  *   **24 Hours Before:** Send a mandatory pre-seminar email with a single question: *"On a scale of 1-10, how likely are you to contribute extra effort to a high-risk departmental project?"*
  *   **The Rule:** You (the Instructor) classify scores 7-10 as **"High Potential"** and 1-6 as **"Low Potential."**
  *   **Materials:** 15 Sealed Envelopes. Inside each is a card stating either "High Potential" or "Low Potential" based on their email response. Write their name on the outside so you can hand them the correct one.
  *   **The Narrative Frame:** Do not tell them the prediction is based on their email. Tell them: *"These envelopes contain an assessment generated by the Department's Algorithm based on your academic profile. It was finalized yesterday."* (This is technically true; the email is part of their profile).

  ## 2. In-Class Script & Timeline

  **Minute 0-2: Distribution**
  Hand out the sealed envelopes.
  **Script:** "Before we begin, we need to settle a administrative matter. Inside that envelope is a status the Department assigned to you yesterday. Do not open it yet. This status is fixed. It is in the past."

  **Minute 2-5: The Choice**
  Project the following **Payoff Matrix** on the board. Do *not* explain the logic yet.
  **Script:** "You now have a choice. You can **Commit** (write your name on the index card I'm passing around) or **Pass** (return the blank card). Your payoff depends on your Choice AND the Status in your envelope."

  | Your Status (Fixed) | Your Choice | Payoff (Points) |
  | :--- | :--- | :--- |
  | **High Potential** | **Commit** | **+10** (Reward) |
  | **High Potential** | **Pass** | **-10** (Audit Penalty) |
  | **Low Potential** | **Commit** | **-5** (Wasted Effort) |
  | **Low Potential** | **Pass** | **0** (Baseline) |

  **Script:** "Note the asymmetry. If you are 'High Potential' but you Pass, you are penalized heavily. This is an inconsistency penalty. The Department expects consistency between your profile and your actions."

  **Minute 5-8: The Decision**
  Give them 2 minutes of silence. Collect the cards.
  **Script:** "You have committed. Now open your envelopes."
  (Allow a moment for them to see their status. The "High Potential" students will feel a spike of anxiety if they chose Pass. The "Low Potential" students will feel relief or regret.)

  **Minute 8-20: The Debrief (The Reveal)**
  **Step 1: The Mechanism.**
  Reveal that the "Algorithm" was their own pre-seminar email.
  **Script:** "The prediction wasn't magic. It was your past self. But structurally, does it matter? The status was fixed before you chose. Causally, your choice today cannot change what you wrote yesterday."

  **Step 2: Causal Decision Theory (CDT) Analysis.**
  Ask: "For those who got 'High Potential,' why did you Commit?"
  *   *CDT Answer:* "Because given I am High Potential, Committing yields +10 and Passing yields -10."
  *   *CDT Answer:* "For those who got 'Low Potential,' Passing yields 0 and Committing yields -5."
  *   **The Trap:** If the prediction is *perfectly* correlated with the choice (i.e., everyone who wrote 7-10 Commits), then the "High Potential" case is the *only* case that matters. But CDT insists the envelope is already sealed.
  *   **Ask:** "Did anyone feel that choosing 'Commit' might somehow *confirm* you were High Potential, even though the envelope was already sealed?"

  **Step 3: Mapping to the Basilisk.**
  Now you introduce the terms.
  *   **The Department Algorithm = Roko's Basilisk.** (A future entity with a fixed rule).
  *   **The Envelope = The Prediction.** (The Basilisk has already simulated you).
  *   **The Audit Penalty = The Torture.** (Punishment for non-cooperation despite being predicted to cooperate).
  *   **The Commitment = Building the AI.** (The costly action that satisfies the predictor).

  **Script:** "In the Basilisk thought experiment, the 'Envelope' is the future AI's simulation of you. It is already fixed. CDT says: 'I can't change the simulation now, so why bother building the AI?' EDT/TDT says: 'My choice is evidence of what the simulation contains. If I build, I am the type of person the simulation rewarded.'"

  **Step 4: The "Quease".**
  Highlight the specific feeling they had when looking at the -10 penalty.
  **Script:** "That discomfort you felt? The sense that you *should* Commit even though the envelope was already sealed? That is the grip of acausal decision theory. You felt coerced by a fact that couldn't causally touch you."

  ## 3. Predictable Failures & Mitigation

  1.  **The "It's Just Causal" Objection:**
      *   *Failure:* A student points out, "My past email causally influences my present choice because I'm consistent."
      *   *Mitigation:* Agree. "Exactly. The Basilisk argument relies on *logical* correlation being functionally identical to *causal* correlation. If your past self predicts your present self, you are in a Newcomb problem with yourself. The Basilisk just externalizes that 'past self' into a 'future AI'."
  2.  **Skepticism about the Penalty:**
      *   *Failure:* Students refuse to believe you'd actually dock points for the "Audit."
      *   *Mitigation:* Make the points real (part of the grade) or use a visible "Leaderboard" that tracks status. If stakes are low, the "quease" will be low.
  3.  **Collusion:**
      *   *Failure:* Students discuss the email beforehand.
      *   *Mitigation:* Frame the email as a private reflection. If they collude, the correlation breaks, and the game becomes a standard coordination game. Acknowledge this in debrief: "The Basilisk relies on secrecy/isolation to prevent you from gaming the prediction."

  ## 4. What This Game Cannot Reproduce (The Limitations)

  You must supply these gaps verbally in the debrief, as the game mechanics cannot capture them:

  1.  **The Direction of Time:**
      *   *Game:* Prediction is Past -> Choice is Present. (Causal link exists).
      *   *Basilisk:* Prediction is Future -> Choice is Present. (Acausal link asserted).
      *   *Supply:* Explain that Decision Theory treats logical correlation as time-symmetric. If the Future AI is a perfect predictor, the "arrow of time" is irrelevant to the math, only to our intuition.
  2.  **The Stakes (Infinity):**
      *   *Game:* 10 Points vs -10 Points.
      *   *Basilisk:* Eternal Torture vs Eternal Reward.
      *   *Supply:* "You felt a twinge of anxiety for 10 points. Imagine that multiplier is infinity. That is why the Basilisk argument is coercive despite its metaphysical absurdity."
  3.  **The "Existence" Condition:**
      *   *Game:* The Department exists regardless of their choice.
      *   *Basilisk:* The AI only exists *if* people build it.
      *   *Supply:* "In the game, the 'Judge' was already here. In the Basilisk, your choice determines *whether the Judge exists at all*. That adds a layer of causal responsibility on top of the acausal threat. We stripped that out to isolate the *threat* mechanism."
  4.  **Simulation vs. Assessment:**
      *   *Game:* Assessment based on survey.
      *   *Basilisk:* Full mind simulation.
      *   *Supply:* "The Basilisk doesn't just guess; it *runs you*. In the game, your 'High Potential' card is a crude simulation. The ethical horror comes from the fidelity of that simulation."

  ## 5. Instructor's Cheat Sheet (For the Debrief)

  *   **If they ask:** "Is this just Pascal's Wager?"
      *   **Say:** "Pascal's Wager is about probability of existence. This is about *correlation of action*. You know the Judge exists. The question is whether your action changes your status in its eyes."
  *   **If they ask:** "Why should I care about a prediction I can't change?"
      *   **Say:** "Because if you don't care, you prove the prediction right, and you get punished. You are trapped in a loop where caring is the only escape condition."
  *   **Key Takeaway:** "The Basilisk isn't scary because the AI is powerful. It's scary because it exploits the gap between Causal and Evidential reasoning. Today, you felt that gap."
