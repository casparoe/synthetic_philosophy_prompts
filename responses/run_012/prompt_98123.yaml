      *   3. Higher-Order Vagueness (The stability of the "Determinately" operator).
      *   4. Rule Design (Bright-line vs. Vague).
      *   5. Error Profiles.
      *   Conclusion: Verdict on the objection.

      *(Self-Correction during drafting)*: Make sure to explicitly answer "whether this objection lands."
      *   Epistemicism: Objection partially fails (Board isn't decorative), but highlights epistemic injustice.
