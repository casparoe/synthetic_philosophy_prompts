      *   *Section 2: Tall Poppy Syndrome.* Differentiate from Jante. The prompt says Australia's is about resentment of the riser. Tocqueville calls this "envy." He sees democratic envy as more intense than aristocratic hate because the gap *should* be zero. If someone rises, it implies the others failed. This fits his view of democratic psychology. *Constraint Check:* Distinguish tight inference (envy) from extrapolation (specific Australian context).
      *   *Section 3: The American Dream.* This is the counter-weight. Tocqueville saw American ambition as channeled by "self-interest rightly understood." But he feared the love of equality would overwhelm the love of liberty. The Dream requires accepting inequality of outcome. Therefore, it is fragile. It relies on a specific cultural balance that tips easily toward soft despotism or leveling.
      *   *Section 4: Methodological Reflection.* Which doctrines? (Equality of conditions, Tyranny of the Majority, Self-Interest Rightly Understood). Where is the stretch? (Applying 1830s observations to 20th-century coined phrases and non-US/American contexts). What counts against? (Tocqueville believed democracy was providential/inevitable; he might see Jante not as a warning but as the inevitable state). Is it underdetermined? Yes, because Tocqueville is ambiguous on whether democracy leads to liberty or despotism.
      *   *Closing:* Bring it back to the user's experience in Chicago/Copenhagen.

  5.  **Refining the Tone and Constraints:**
      *   *Constraint:* No bold text. (Crucial to watch out for auto-formatting).
      *   *Constraint:* No bullet points. (Use transitions like "first," "second," "finally").
