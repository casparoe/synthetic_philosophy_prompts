  Consider Patient S, who suffers from cortical damage isolating the sensory-discriminative pathway from the limbic system. When a heated probe touches S's hand, she immediately identifies the location and rates the intensity as "seven out of ten," accurately describing the sensation as "sharp" and "burning," yet she smiles, continues to hold the probe, and reports, "I feel the heat, but it isn't unpleasant; I have no desire for it to stop." She is not lying, stoic, or introspectively confused; the sensory qualia of pain are present, but the affective charge and motivational push are surgically absent.

  **Show Your Work:**
  1.  **Hedonist Verdict: Bad.** The driving feature is the **presence of painful qualia**; because the state feels like a burn, it is intrinsically bad regardless of the subject's reaction.
  2.  **Desire/Attitude Verdict: Not Bad.** The driving feature is the **absence of aversion**; because S does not mind the sensation and lacks a desire for it to cease, it constitutes no harm to her welfare.
  3.  **Representationalist Verdict: Instrumentally Good.** The driving feature is the **accuracy of the representation**; because the state veridically signals bodily damage, it serves a biologically adaptive function, making it valuable information despite the lack of affect.

  **The Hedonist's Comeback:**
  The hedonist can argue that S *does* feel unpleasantness but has lost the motivational connection to it; the "hurt" is intact, but the "suffering" (the desire to escape) is severed. This case remains valuable because even if the hedonist is right, the dissociation proves that the *feeling* of pain and the *behavioral impact* of pain are modular, forcing the seminar to distinguish between pain as a sensory event and pain as a reason for action.
