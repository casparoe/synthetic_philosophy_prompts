      *(Refining the Cruxes)*: The predictions need to be about the *outcome* of the debate or the *effect* of the policy. Let's make them about how specific historical cases would be decided under the new regime. That makes it concrete.
      *   Case: *Obergefell* (Same Sex Marriage).
