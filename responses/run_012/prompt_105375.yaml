prompt: |-
  A friend and I have been argueing about judicial review for months and we've started repeating ourselves, so we're trying the adversarial-collaboration thing. I think judicial review is basically legitimate: when a legislature passes something that violates a right, someone unelected has to be able to say no and mean it. She thinks final say over what the constitution means should sit with the elected branches -- courts can flag things, they can't settle them. Arguing in the abstract got us nowhere, so we want the document built around one concrete proposal I've been pushing: every constitutional rights ruling sunsets after twelve years unless the court re-affirms it, and in the meantime the legislature can re-enact the struck-down law by a two-thirds vote with published reasons, which the court can only overturn by showing the law burdens the 'core' of the right rather than its periphery.

  Write the joint statement we could both sign. Start with a numbered list of what we actually agree on -- about what a constitution is for, about the countermajoritarian worry, about what the sunset proposal would do in practice. Then a disagreements table, each side's view stated in wording that side would accept, including whether the core/periphery line can be drawn without begging the question and whether 'final say' is even the right way to carve the issue up. Then the cruxes: the sub-questions where settling one would move at least one of us, and for each a case or piece of evidence we'd both agree bears on it, with each of our predictions written down in advance. If part of what we've been fighting about turns out to be verbal, say which part. And if you think we can't honestly sign a joint statement -- because the real disagreement is something neither of us has put on the table -- say that straight instead of manufacturing consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Write a joint statement for two friends arguing about judicial review.
      *   **Context:** They've been arguing for months, repeating themselves. They are trying adversarial collaboration.
      *   **Positions:**
          *   *User (Pro-Judicial Review):* Believes judicial review is legitimate; unelected officials must be able to veto rights violations.
          *   *Friend (Pro-Legislative Supremacy):* Believes elected branches should have final say; courts can flag but not settle.
      *   **Specific Proposal:** A concrete compromise/test case: Constitutional rights rulings sunset after 12 years unless re-affirmed. Legislature can re-enact struck-down laws by 2/3 vote with published reasons. Court can only overturn re-enactment if it burdens the "core" of the right, not the "periphery."
      *   **Required Structure:**
          1.  Numbered list of agreements (Constitution's purpose, countermajoritarian worry, proposal's practical effect).
          2.  Disagreements table (Each side's view in acceptable wording, specific sub-questions on core/periphery and "final say").
          3.  Cruxes (Sub-questions where settling one moves a mind, specific cases/evidence, pre-registered predictions).
          4.  Verbal Disputes (Identify if any).
          5.  Honesty Check (If consensus is impossible/dishonest, say so).
      *   **Tone:** Collaborative, precise, intellectually honest, neutral.

  2.  **Deconstruct the Positions & Proposal:**
      *   *The Proposal:* It's a hybrid model. It keeps judicial review but weakens it (sunsets, legislative override with 2/3 vote, core/periphery distinction).
      *   *Agreement Potential:* Both likely agree the Constitution protects rights, both worry about tyranny (either of the majority or the minority), both want a functioning system.
      *   *Disagreement Potential:* The *degree* of judicial power. The user wants strong review; the friend wants legislative supremacy. The proposal is a middle ground, but do they *actually* agree on it, or is it just the subject of the debate? The prompt says "the document built around one concrete proposal I've been pushing." This implies they are using the proposal as the *lens* for the debate, not necessarily that they both endorse it fully yet. However, for a *joint statement*, they need to agree on *examining* it together. I need to be careful not to claim they agree on the *merits* of the proposal if they don't, but rather agree on the *terms of the debate* regarding it. *Correction:* The prompt asks for a joint statement "we could both sign." Usually, this means agreeing on the framework of the disagreement, not necessarily resolving the disagreement. But the first section asks for "what we actually agree on." I need to find common ground that exists *despite* their opposing views on judicial review.
      *   *The "Core/Periphery" Issue:* This is a major legal theory sticking point. Pro-JR thinks courts can define rights. Pro-LegSup thinks this is subjective.
      *   *The "Final Say" Issue:* Semantic vs. Substantive.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the stalemate and the purpose of this document.
      *   **Section 1: Areas of Agreement:**
          *   Constitution's purpose: Limit power, protect rights (both agree on this generally).
          *   Countermajoritarian worry: Both acknowledge it's a problem (one thinks it's a bug, one thinks it's a feature/necessary evil). *Wait, do they agree it's a worry?* Yes, the User acknowledges the tension ("someone unelected"), the Friend centers her argument on it.
          *   Proposal's effect: Both should agree on what the mechanism *does* (shifts burden, creates timeline).
      *   **Section 2: Disagreements Table:**
          *   Need to steelman both sides.
          *   *User:* Judicial independence is necessary for rights protection.
          *   *Friend:* Democratic legitimacy requires elected finality.
          *   *Core/Periphery:* User thinks it's doable (like obscenity tests). Friend thinks it's question-begging (who defines the core?).
          *   *Final Say:* User thinks "final say" = enforcement power. Friend thinks "final say" = interpretive authority.
      *   **Section 3: Cruxes:**
          *   Need specific empirical or historical questions.
          *   *Crux 1:* Historical rights protection. Did courts protect rights better than legislatures in specific eras? (e.g., Civil Rights Era vs. Lochner).
          *   *Crux 2:* Legislative behavior under override. Would 2/3 votes actually protect minorities or just entrench majorities?
          *   *Predictions:* Need to be specific.
      *   **Section 4: Verbal Disputes:**
          *   "Final Say" is likely partly verbal. Is it about who writes the last opinion or whose rule becomes law?
      *   **Section 5: Honesty Check:**
          *   Can they sign this? Yes, if it accurately reflects the disagreement without forcing false consensus. The prompt warns: "if you think we can't honestly sign... say that straight."
          *   *Risk:* The proposal itself (12-year sunset + 2/3 override + core/periphery) is quite specific. If the Friend hates the "core/periphery" distinction as unworkable, she might not sign a statement that treats it as a viable test. If the User thinks sunsets undermine rights, he might not sign.
          *   *Solution:* Frame the statement as an agreement to *test* these propositions, not necessarily an endorsement that the proposal is *good*. However, the prompt says "built around one concrete proposal I've been pushing." I will frame the agreement as "We agree this proposal is the best stress-test for our theories."

  4.  **Refining the Content (Self-Correction/Nuance):**
      *   *Tone Check:* Avoid legal jargon where possible, but keep it precise.
      *   *The "Core/Periphery" Crux:* This is the weakest link legally. Real courts struggle with this (e.g., *Casey*'s "undue burden"). I need to make sure the Friend's skepticism is represented fairly.
      *   *The "Sunset" Mechanism:* This is unusual. Usually, stare decisis is the norm. A 12-year sunset is radical. I need to ensure the User (who wants strong JR) doesn't look like they are surrendering too much in the "Agreements" section. The agreement should be on *what the proposal entails*, not that it's perfect.
