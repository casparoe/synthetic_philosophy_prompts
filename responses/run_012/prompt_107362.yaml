  9.  **Final Polish:** Tone should be professional, analytical, and helpful for a design review context. (Proceed to generate output based on these thoughts.)

  *(Self-Correction during final output generation)*: I need to make sure I explicitly highlight *where* my reasoning is weakest as requested ("flag where your own reasoning is weakest"). I will add a dedicated section for this.

