  # JOINT STATEMENT ON META-ONTOLOGICAL DISAGREEMENT
  **Date:** [Current Date]
  **Parties:** Proponent of Quantifier Variance (QV); Proponent of Ontological Realism (OR)
  **Subject:** Adversarial Collaboration on Existence Claims and Conceptual Schemes

  ## PREAMBLE
  After eleven months of dialectical exchange, we issue this statement to record the precise locus of our agreement and disagreement. We do not claim to have resolved the meta-ontological debate. We claim to have isolated the specific claims upon which our disagreement turns, distinguishing those disputes that are merely verbal from those that are substantive, and acknowledging the limits of our own collaborative framework.

  ## I. AGREED CLAIMS
  Both parties accept the following numbered claims as the fixed background for this document:

  1.  **Semantics of Existence:** We agree that existence claims employ the existential quantifier (or its natural language equivalent) and function to assert that the domain of discourse is non-empty with respect to a given predicate or variable. We agree that "exists" is not a first-order predicate of individuals.
  2.  **Non-Ontological Facts:** We agree on all non-ontological facts regarding the case studies used herein (specifically the Heap-to-Wall case). We agree on the physical location, arrangement, causal history, and mereological sums of the stones involved. We agree on the linguistic usage patterns of the community observing the stones.
  3.  **Pragmatic Evaluation:** We agree that conceptual schemes can be evaluated by pragmatic virtues, including simplicity, explanatory power, and ease of use. We agree that a scheme that posits composite objects may be more useful for everyday discourse than a scheme that posits only simples.
  4.  **The Nature of the Dispute:** We agree that our primary disagreement is not about the physical world (Claim 2) but about the relationship between language, conceptual schemes, and reality. Specifically, we disagree on whether the existential quantifier has a single, privileged interpretation that "carves reality at the joints."
  5.  **The Regress Clause:** We acknowledge that if the QV position is correct, the claim "This dispute is verbal" is itself relative to a conceptual scheme. We agree to treat the meta-ontological framework of this document as a fixed point for the purpose of this collaboration. We classify the potential regress as theoretically present but pragmatically benign, as it does not prevent us from identifying the structural differences in our positions.

  ## II. DISAGREEMENTS TABLE

  | # | Disputed Question | QV Formulation (Side A) | OR Formulation (Side B) | Joint Verdict (World vs. Verbal) | The Crux | Agreed Test / Case | QV Prediction | OR Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Heap-to-Wall Case:** Did a new object (the wall) come into existence when the stones were rearranged, or did only the simples persist? | "The claim 'The wall exists' is true relative to a scheme where quantifiers range over composites, and false relative to a scheme where they range over simples. There is no scheme-independent fact of the matter." | "The claim 'The wall exists' is objectively true or false. Either the stones compose a further object or they do not, regardless of how we describe them." | **Verbal** (regarding physical facts); **Substantive** (regarding semantic norms). | **The Status of Composition:** Is composition a worldly relation or a conceptual decision? | **The Rearrangement Test:** Observe the stones at *t1* (heap) and *t2* (wall). Does the truth value of "There is a wall" change solely due to human classification or due to a change in the world? | Truth value changes only relative to scheme choice; physical facts remain constant. | Truth value changes only if a worldly composition relation is instantiated; classification is irrelevant. |
  | **2** | **The Translation Test:** Is the dispute merely verbal because claims can be translated between schemes without loss of truth? | "Yes. The Realist's 'There is a wall' translates to 'There are stones arranged wall-wise' in my scheme. Since we agree on the arrangement, we agree on the facts." | "No. Translation is only valid if it preserves logical structure and truth-conditions. 'There is a wall' commits to an object; 'Stones arranged wall-wise' does not. The translation is gerrymandered." | **Substantive** (about the nature of translation and meaning). | **Charity vs. Structure:** Does charitable interpretation require mapping truths to truths (QV) or preserving ontological commitment (OR)? | **The Paraphrase Challenge:** Can the Realist's claims be fully paraphrased into the QVist's scheme without losing explanatory power or logical validity? | Yes. All explanatory work is done by the arrangement of simples; object-talk is shorthand. | No. Object-talk captures causal powers and persistence conditions that arrangement-talk cannot capture without circularity. |
  | **3** | **The Status of This Document:** Is the claim "Row 1 is a verbal dispute" objectively true or scheme-relative? | "This claim is true relative to a meta-ontological scheme that accepts quantifier variance. It is not a 'God's eye' truth." | "This claim is either true or false. If the dispute is verbal, that is a mind-independent fact about the semantics we are using." | **Substantive** (Meta-Meta-Ontology). | **The Regress:** Does the variance apply to the variance claim itself? | **The Self-Application Test:** Apply the QV criterion to the statement "Quantifier Variance is true." | The statement is scheme-relative. If the regress is vicious, it is pragmatically halted by our agreement to collaborate. | The statement is objectively true or false. If QV makes it relative, QV is self-refuting. | The statement is objective. QV is false because it undermines its own assertion. |

  ## III. ANALYSIS OF VERDICTS AND REGRESS

  **1. Classification of Verbal Disputes**
  In Row 1, we classify the dispute as **Verbal regarding physical facts**. Both parties accept Claim 2 (Agreed Claims), meaning we agree on all non-ontological descriptions of the stones. Under the standard definition of a verbal dispute (a dispute where parties agree on all non-semantic facts), Row 1 qualifies.
  *   **Dissolution vs. Relocation:** Recognizing Row 1 as verbal **relocates** the dispute rather than dissolving it. The disagreement moves from "Do walls exist?" to "Is the existential quantifier privileged?" (Row 2). The QVist holds that relocating the dispute dissolves the metaphysical tension, showing there was no "worldly" stake. The Realist holds that relocating the dispute reveals the true metaphysical stake: the nature of semantic representation itself.

  **2. The Translation Crux (Row 2)**
  This is the primary substantive disagreement.
  *   **QV Position:** Translation is successful if it preserves *assertibility conditions*. If the Realist asserts "Wall" whenever the QVist asserts "Stones arranged wall-wise," the dispute is verbal.
  *   **OR Position:** Translation is successful only if it preserves *ontological commitment*. If the Realist's term refers to a composite object and the QVist's term refers to a plurality, the translation fails to map the *referent*, even if it maps the *truth value*.
  *   **Joint Assessment:** We agree that this disagreement cannot be settled by further translation tests, as the criteria for a "successful translation" are themselves contested. This row is **Substantive**.

  **3. The Regress Threat (Row 3)**
  The QVist acknowledges that her position threatens to make the verdict of Row 1 ("This dispute is verbal") itself scheme-relative.
  *   **Is the Regress Vicious?** We agree that the regress is **theoretically vicious but pragmatically halted**.
      *   *Theoretically Vicious:* If every claim about the status of a dispute is itself variant, there is no stable ground to assert "This is a verbal dispute" without qualification. This undermines the normative force of the QVist's critique of the Realist.
      *   *Pragmatically Halted:* By signing this document, we have agreed to a temporary "meta-scheme" in which we treat our disagreement as substantive enough to be recorded. We accept that the QVist signs this under the reservation that the document's claims are variant, while the Realist signs under the reservation that they are objective.
  *   **Conclusion on Regress:** The existence of this regress does not invalidate the collaboration, but it prevents the QVist from claiming a decisive victory. She cannot assert "The Realist is wrong" without qualification; she can only assert "The Realist is wrong relative to a variance-friendly scheme." The Realist accepts this as a confession that QV lacks the resources to state its own truth conditions objectively.

  ## IV. SIGNATURES

  We sign this document to affirm that the above table accurately represents the structure of our disagreement, even if we disagree on the ultimate truth of the claims contained within it.

  _________________________
  (Proponent of Quantifier Variance)

  _________________________
  (Proponent of Ontological Realism)
