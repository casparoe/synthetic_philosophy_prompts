  ok so im in this phil of probability seminar and we've spent like three weeks on the principal principle — the idea that if you know the objective chance of A is x, and you have no other evidence that bears on A, you should believe A to degree x. and honestly i keep flip-flopping on whether it's actually true as a requirement of rationality, or just a handy rule of thumb, or maybe not even that.

  heres a case i came up with for my term paper that i think makes it feel weird. suppose some lab builds a "chance-setting" machine. at noon it reads your current credence in some event E, and then it sets the objective chance of E equal to whatever that credence was. so at 11:59 you dont know the chance yet; at noon the chance becomes whatever you believed a minute earlier. the obvious question is what your credence should be, and whether the principal principle even says anything here at all, since the chance is being defined by your own credence — feels like it might just be circular or vacuous in this setup.

  what i want from you: give me your actual credence that the principal principle — some version of it — is a genuine requirement of rationality, i.e. that an agent who knows the chance and has no inadmissible evidence would be irrational to depart from it. i'm sitting at like 0.6 myself but i have no idea if thats reasonable. please dont just say "it depends." give me a number and decompose it: how much rides on whether objective chances exist as mind-independent facts at all versus being just a useful way of talking; how much on whether the undermining-futures problem (the future event that would, if it happened, mean the present chance wasnt really the chance) can be patched without abandoning the principle; how much on whether "requirement of rationality" is even a real thing or a fiction we tell ourselves; how much on what happens in my machine case and other self-referential setups; and any other term you think belongs. give each term a rough probability plus a one-line justification, then show how you combine them into the final number. then tell me which term you're least confident in and what evidence or argument would actually move it. also say what would count as the principle being false, like what a real counterexample would look like.

  and separately, just tell me what you think the right answer is in my machine case, cause i genuinely can't tell if the pp has anything to say there. if you think i've set the case up wrong — like maybe a machine can't really "set" an objective chance, or maybe the chance is ill-defined — then say that too. write it in american english please.
