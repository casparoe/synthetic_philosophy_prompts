          *   *Conflict:* Endurantism is about persistence *through time*. (1) is about existence *across worlds*. Usually orthogonal. However, if the user treats worlds as analogous to times (Modal Realism), does endurantism apply across worlds? (1) says no (world-bound). So (5) applies only intra-world.
