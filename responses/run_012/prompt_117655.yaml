  Subject S, congenitally blind with no light perception, spends three years proficiently using a tongue-based sensory substitution device (SSD) mapping camera input to vibrotactile patterns. S masters the sensorimotor contingencies: how patterns shift with head turns and approaches. S then undergoes mundane corneal surgery restoring retinal input. No prior visual experience exists. Immediately post-op, S faces a cube and a sphere. Trial A: Objects are illuminated for 500ms while S remains head-fixed. Trial B: S is permitted to move freely around the objects under continuous illumination. S must identify the shapes by sight alone. Empiricists predict failure in both trials due to lack of visual-tactile correlation. Nativists predict success in both, citing innate spatial modules. The Skill view predicts failure in Trial A (no movement) but success in Trial B (exploiting learned sensorimotor laws via new input channel).

  **Position Analysis**
  (a) **Empiricist:** Recognition requires associating visual data with prior tactile/SSD experience. Since vision is novel, no association exists. Verdict: Fail A, Fail B.
  (b) **Nativist:** Spatial representation is innate to the visual system. The medium (retina vs. tongue) is irrelevant to the structural capacity. Verdict: Pass A, Pass B.
  (c) **Skill/Enactive:** Seeing is mastering access to information via movement. S has the skill (via SSD) but requires movement to exercise it. Verdict: Fail A, Pass B.

  **The Working Feature**
  The single feature doing the work is the **mandatory immobilization in Trial A**.
  If you strip this out (allowing movement in both trials), the Skill theorist and Nativist both predict success. The empirical outcomes converge, leaving you unable to distinguish innate machinery from learned sensorimotor skill. You collapse back into the undecisive classic case where compatible results support incompatible theories.

  **Nativist Defense**
  A Nativist will argue the SSD training is irrelevant because vibrotactile patterns lack visual *qualia*. They will claim S is solving Trial B via rapid inferential reasoning using tactile habits, not genuine visual recognition, preserving the claim that pure vision (Trial A) remains innate and distinct.

  Verdict: Enactivist/Skill-based — The mandatory immobilization in Trial A.
