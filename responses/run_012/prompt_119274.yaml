      *   *Real Patterns:* Dennett is a real pattern theorist (following Kripke/Goodman-ish lines but distinct). If a pattern is predictive and robust, it's "real enough." The self is a real pattern.
      *   *Eliminativism vs. Instrumentalism:* Dennett is often misread as an eliminative materialist (like Churchland). He is actually an *interpretivist* or *instrumentalist* about intentionality and the self. He doesn't want to *eliminate* the vocabulary; he wants to *naturalize* it.
      *   *Causal Power:* Does the self have causal power? The *narrative* influences future behavior. The abstraction tracks real neural processes. So, in a sense, yes, but not as a homunculus.
