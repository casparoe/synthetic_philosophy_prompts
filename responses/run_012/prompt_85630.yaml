  3. **The carving**
  The phenomenon is best understood as a failure of **absolute integrability**. In rigorous probability, expectation is defined via Lebesgue integration, which requires the sum of absolute values to be finite. Your gamble fails this test. While the Riemann sum yields a number, it is an artifact of enumeration, not intrinsic value. The established name in decision theory is **The Pasadena Paradox** (or Pasadena Game). It is distinct from the St. Petersburg Paradox because St. Petersburg violates boundedness, while Pasadena violates definability. It is distinct from simple divergence because the series *does* converge conditionally. The boundary lies at absolute convergence: if $\sum |p_i x_i| < \infty$, the expectation is robust. If not, you enter the realm of undefined expectations. Within that realm, if the sum goes to infinity, it is St. Petersburg-type. If it oscillates or depends on order, it is Pasadena-type. This distinction matters because infinite expectations can sometimes be managed via utility caps, but order-dependent values resist any consistent pricing rule without arbitrary stipulations about outcome sequencing. It shows that Expected Utility Theory is incomplete for gambles lacking absolute convergence. The concept carves out the space where probability decays fast enough to prevent explosion, but not fast enough to prevent order-sensitivity.

  4. **Verdict**
  Treat this as a distinct concept labeled **The Pasadena Problem**. While mathematically it is a case of conditional convergence, decision-theoretically it represents a unique failure mode where rational preference orderings break down even more severely than with infinite expectations. Infinite expectations allow for dominance arguments; order-dependent expectations do not. It is not merely a mathematical curiosity because it demonstrates that Expected Utility Theory cannot handle games where positive and negative utilities balance precariously. It requires a specific solution, such as restricting admissible gambles to absolutely convergent series.
