answer: |-
  Dear Chair,

  You are right to be worried because the protocol you are overseeing is essentially a real-time Ship of Theseus paradox with clinical stakes, and standard ethics frameworks are not built for gradual ontological replacement. Since you need a procedure that a nurse, neurologist, and lawyer can run in forty-eight hours, we cannot wait for metaphysics to settle down, which it will not. The philosophical landscape here splits into three main families of view that you need to map onto your workflow. The first is the Psychological Continuity view, which says a person persists as long as their memories, personality, and preferences remain connected, regardless of the substrate. The second is the Biological Organism view, which says you are your living animal body, and if you replace enough biological tissue with synthetic material, the organism dies even if the behavior continues. The third is the Revisionist or What Matters view, which argues that identity is not what we should care about anyway; we should care about welfare, relationships, and legal continuity, even if metaphysical identity is lost. Since none of these views command consensus among experts, your procedure cannot claim to discover the truth of who the patient is. Instead, it must stipulate a definition for operational purposes to avoid paralysis. The procedure I am outlining below treats identity as a policy variable rather than a metaphysical fact, which is the only way to get a decision rather than a shrug.

  The procedure consists of four sequential questions that must be documented in the chart before any milestone decision is made. The first question is for the neurologist and asks whether the biological organism retains sufficient integrated function to sustain life without the prosthetic support. If the brainstem and organic remaining tissue cannot sustain respiration and homeostasis without the synthetic units, the answer is no, and the patient is declared dead on biological grounds regardless of behavior. This adopts the Biological Organism view as a safety floor. If the answer is yes, you move to the second question, which is for the nurse and attending, asking whether the patient exhibits psychological continuity with the pre-trial baseline in terms of memory access, emotional regulation, and self-narrative. Here you must ignore the patient's self-report that they feel like themselves because the firmware is engineered to produce that report exactly. Instead, you look for external corroboration from family regarding nuanced interpersonal knowledge that the firmware could not predict. If both biological viability and psychological continuity are confirmed, you move to the third question, which is for the lawyer and ethics lead, asking whether the current percentage of replacement has crossed the policy threshold for identity-sensitive contracts. This is where you must own the arbitrariness. The sorites problem means any line you draw is philosophically indefensible, but it is legally necessary. I recommend setting this threshold at fifty percent replacement. Below fifty percent, the patient is legally the same person who signed the consent and advance directive. Above fifty percent, the patient is considered a legal continuant for the purpose of care but the binding force of prior directives regarding identity termination is suspended. This splits the difference between the Psychological and Biological views. The fourth question asks whether there is a conflict between current welfare and prior instructions. If there is no conflict, care proceeds. If there is a conflict, the decision hands off to the attending physician to weigh current suffering against prior values, because at that point you are no longer dealing with facts about identity but values about welfare.

  You need to know exactly where this procedure fails and where it holds. The issue of the common firmware is not a metaphysical problem but a safety and consent one. Because every unit runs the same code, there is a risk of standardized behavioral artifacts that look like personality but are actually software defaults. The procedure handles this by requiring the neurologist to flag any behavioral patterns that match other trial patients, which would invalidate the psychological continuity check. Regarding the arbitrariness of the threshold, this is not fatal to the procedure provided you acknowledge it openly in the consent form. You are telling the patient that the hospital has defined a bright line for legal purposes that does not exist in nature. The procedure stops with a no only at the biological viability stage. If the organism is dead, nothing else matters. In all other cases, it hands the decision to a person because the remaining questions are about values. Specifically, the policy sets the threshold, but the attending makes the bedside call on whether to honor a directive when the patient is above the threshold but still competent. This separates what can be policy from what cannot. You can policy the definition of death and the threshold for directive validity, but you cannot policy the weighing of current suffering against past wishes, which must remain a clinical judgment.

  Now let us run this procedure on your three cases to see where it bites. In the first case, the patient is forty percent replaced, sharp, wants to continue, and her directive says stop if she stops recognizing family, which she still does. The procedure asks the biological question first. She is viable. It asks the psychological question. She recognizes family, so continuity is intact. It asks the threshold question. She is below fifty percent, so the original person exists and the directive is active. Since the condition in the directive is not met, the procedure dictates you continue treatment. This is straightforward and likely aligns with your intuition. In the second case, the patient is eighty percent replaced, says she wants out, but her pre-trial directive said specifically that a later version of her might say that and shouldn't be believed. Here the procedure hits the hard spot. She is above the fifty percent threshold. According to the policy I suggested, the binding force of the prior directive regarding identity termination is suspended because the entity speaking now is legally distinct enough from the entity who wrote the directive to warrant current autonomy. However, to give you the answer you won't like, consider the alternative interpretation that the IRB might demand to protect the trial's integrity. If the protocol defines the treatment as preserving the original person, then the IRB may rule that the psychological continuity ensured by the firmware means the person is the same, rendering the advance directive binding despite the biological replacement. Under that ruling, you must ignore her current plea to stop and continue the treatment because the original person's will holds supremacy. This forces you to treat a resisting patient based on the word of a ghost, which is ethically grim but logically consistent with the Psychological Continuity view prioritized by the trial design. In the third case, the son wants her declared dead so the estate opens and the marriage question becomes real. The procedure asks the biological question. She is alive. It asks the psychological question. She is continuous. It asks the threshold question. Even if she is above fifty percent, the policy defines her as a legal continuant for care, not a corpse. The procedure dictates you cannot declare her dead. The estate does not open, and the husband remains her husband. The son loses.

  I need to be straight with you about what this procedure cannot do. It cannot resolve the metaphysical contest between the Biological and Psychological views because there is no fact of the matter to find. What is settled among people who know this material is that identity is not a binary switch that flips at a specific neuron count. What is genuinely contested is whether we should privilege the past self's rights or the current self's welfare when they diverge. This procedure privileges the policy threshold to give you actionability, but it leaves the moral residue on your team's shoulders. The parts that can be policy are the biological definition of death, the percentage threshold for directive validity, and the requirement to ignore self-report as evidence of identity. The parts that cannot be policy are the decision to override a current competent refusal based on a prior directive, which must remain a bedside call because it involves weighing suffering. If you try to policy that, you will create a rule that is either too rigid to care for patients or too loose to protect them. You should also note that the firmware issue introduces a risk of class-wide identity contamination that no existing ethical framework covers. If the firmware updates, do all patients change personality simultaneously? Your procedure needs a clause that treats firmware updates as experimental interventions requiring re-consent if they alter behavioral outputs.

  Ultimately, you are building a legal fiction to manage a metaphysical crisis. The procedure works only if everyone agrees to pretend the threshold is real. You must ensure the consent form explicitly states that the hospital reserves the right to define the patient's legal identity based on replacement percentage, otherwise you will be sued when the son tries to probate the estate or the husband tries to remarry. The hardest part of this email is telling you that in Case Two, if you prioritize the trial's definition of continuity, you may have to force treatment on a patient who says no. That is the cost of importing a metaphysical gamble into clinical care. You can mitigate this by lowering the threshold for current autonomy, but you cannot eliminate the conflict. The procedure ends in a decision, but it does not end in moral comfort. You will need to support your team when they have to act against a patient's current wishes based on a policy that admits it is arbitrary. That is the best you can do given the materials you have.

  Sincerely,

  Your Ethics Consultant
