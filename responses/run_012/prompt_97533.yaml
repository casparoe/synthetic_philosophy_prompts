          3.  Is there a version of the category that avoids political football, or is it baked in? (Don't say "it's complicated," point out theoretical silences/failures).
      *   **Tone:** Direct, analytical, avoiding platitudes, acknowledging the horror but focusing on the mechanics of the label.

  2.  **Deconstruct Direction 1: Mapping the Episode onto the Concept:**
