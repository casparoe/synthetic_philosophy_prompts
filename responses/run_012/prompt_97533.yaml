      *   *The Group:* Tutsis are an ethnic group. Moderate Hutus are political. The Convention protects national, ethnical, racial, or religious groups. Political groups are *not* protected. This is a huge gap. Rwanda involved both ethnic targeting (Tutsi) and political targeting (moderate Hutus). Legally, the Tutsi part fits; the Hutu part doesn't count toward the *legal* charge of genocide, though it counts as crimes against humanity.
      *   *Intent ("Dolus Specialis"):* This is the killer constraint. It's not just killing; it's killing *with the intent to destroy the group*. In Rwanda, the radio broadcasts (RTLM), the lists, the systematic nature made intent clear. But legally, proving specific intent for high-level actors takes time.
      *   *"In Part":* There is no numerical threshold. It's about the "substantiality" of the part or the intent to destroy the group *through* that part. Rwanda clearly clears this (500k-800k dead in 100 days is a massive chunk of the Tutsi population).
      *   *Who Decides:* This is the critical failure point. There is no automatic trigger. A judicial body (ICTR, ICJ) decides *retroactively*. The UN Security Council (political body) decides on *intervention*. The US State Department (legal/political hybrid) decides on *naming*. The gap between "facts on ground" and "legal determination" is where the delay happened.
      *   *Lemkin's Silence:* Lemkin assumed a sovereign authority would enforce the norm. He didn't anticipate a world where sovereign states (US, France, UK) would hide behind legal precision to avoid sovereignty-costly intervention.

  3.  **Deconstruct Direction 2: The Category as a Trigger (The Jira Analogy):**
      *   *The Hunch:* The user is right. "Genocide" is a performative speech act in international relations. It invokes the 1948 Convention obligation (Article 1: "undertake to prevent and to punish").
      *   *Incentive Structure:* If you call it genocide, you *must* act (theoretically). If you call it "acts of genocide" or "civil war," you have discretion. Therefore, states fight the label to avoid the obligation.
      *   *Captured by Politics:* Yes. The legal definition was designed to be narrow *specifically* so states wouldn't be forced to intervene in their own spheres of influence.
      *   *Would Lemkin's Broader Version Help?* Paradoxically, maybe not. If "cultural destruction" was included, states might argue "they aren't killing them, just relocating them." But more likely, the threshold for intervention would be even *higher* because proving cultural intent is harder than counting bodies. The bottleneck isn't the definition's breadth; it's the *enforcement mechanism*.
      *   *Theory Check:* The category functions as a "normative trump card." But without an automated enforcement mechanism, it's just a rhetorical weapon.

  4.  **Deconstruct Direction 3: Can we fix the Political Football?**
      *   *Is it baked in?* Yes. Genocide is a crime of *state policy* or organized groups. Investigating it requires piercing state sovereignty. States protect sovereignty.
      *   *Theoretical Silence:* International Law theory often assumes states act in good faith. Realism (IR theory) says states act in self-interest. The Genocide Convention sits awkwardly between these. It creates a legal obligation without a police force.
      *   *Where it gets the case wrong:* The Convention assumes the primary punishment is *after the fact* (tribunals). It fails at *prevention* because prevention requires violating sovereignty *before* the legal threshold is met.
      *   *Alternative:* "Responsibility to Protect" (R2P) tried to decouple intervention from the word "genocide," but it also failed (Syria, etc.). The problem isn't the word; it's the lack of a supranational executive power.

