answer: |-
  This is a sharp analysis. You've identified the core architectural flaw in the international legal system using a very specific edge case. Your Jira analogy is actually technically accurate: "Genocide" is a P0 ticket that, by service level agreement (the 1948 Convention), auto-assigns to the global community with a mandatory "fix" (intervention/prevention). "Acts of genocide" is a P2 ticket that goes into the backlog for later processing (tribunals after the war).

  Here is the breakdown of the Rwanda episode as a stress test for the concept, mapping the code to the spec.

  ### 1. Mapping the Episode onto the Concept

  **Lemkin vs. The Convention (The Spec Sheet)**
  Raphael Lemkin's 1944 definition (*Axis Rule in Occupied Europe*) was indeed a broader class. He defined genocide as a "coordinated plan of different actions aiming at the destruction of essential foundations of the life of national groups." This included:
  *   **Physical:** Killing.
  *   **Biological:** Preventing births.
  *   **Cultural/Structural:** Destroying language, schools, churches, economic patterns, and personal security.

  The 1948 UN Convention (UNCG) is a narrowed fork of Lemkin's repo. During drafting, colonial powers (UK, France, US) and the USSR successfully stripped out "cultural genocide." They feared being prosecuted for assimilation policies (e.g., residential schools, colonial suppression).
  *   **Result:** The Convention protects national, ethnical, racial, or religious groups. It explicitly **excludes political groups**.

  **The Rwanda Fit**
  *   **The Group:** The Tutsi fit cleanly into "ethnical group." The moderate Hutus (political opponents) did not. Legally, killing moderate Hutus was a Crime Against Humanity, not Genocide. This created a parsing problem on the ground: if you kill a Tutsi, it's potentially genocide; if you kill a Hutu politician, it's civil war. The killers targeted both to achieve a political end.
  *   **"In Part":** There is no numerical threshold in the code. It is qualitative. Is the part "substantial" enough that destroying it destroys the whole? In Rwanda, 500,000–800,000 Tutsis were killed in 100 days. That was ~70% of the Tutsi population in Rwanda. It clears the threshold easily.
  *   **Intent (*Dolus Specialis*):** This is the critical dependency. It is not enough to log `kill(victim)`. You must log `intent(destroy_group)`. In Rwanda, the RTLM radio broadcasts ("cut down the tall trees"), the pre-printed death lists, and the distribution of machetes proved intent.
  *   **Who Decides?** Here is the null pointer exception. The Convention does not designate an oracle.
      *   **Judicial:** Only a court (like the ICTR, established *after* the genocide) can legally *convict* someone of genocide.
      *   **Political:** The US State Department and UN Security Council were making *political* determinations to trigger *policy*.
      *   **The Gap:** Because no court had ruled *during* the 100 days, the US argued they were not legally bound to call it genocide until a tribunal said so. This allowed them to acknowledge the facts ("acts of genocide") without triggering the obligation ("genocide").

  **Where Lemkin's Theory is Silent**
  Lemkin assumed the existence of a sovereign authority willing to enforce the norm. He treated international law like domestic law. He did not account for a system where the "police" (Security Council members) have veto power over their own tickets. He assumed the label would summon the cavalry; he didn't anticipate the cavalry would argue about the label to avoid deploying.

  ### 2. The Category as a Trigger (Your Jira Hypothesis)

  You are correct. The episode demonstrates that "Genocide" functions less as a descriptive category and more as a **conditional trigger for sovereignty violation.**

  **The Incentive Structure**
  Article 1 of the Convention says states "undertake to prevent and to punish."
  *   **If Label == "Genocide":** Obligation = Prevent (Intervene) + Punish.
  *   **If Label == "Acts of Genocide":** Obligation = Punish (later).
  *   **If Label == "Civil War":** Obligation = None (Non-interference).

  The US and UN were not fighting about the *facts* (everyone knew people were being slaughtered). They were fighting about the *execution flow*. Calling it "Genocide" would have executed the `prevent()` function, which implied military intervention. The US (burned by Somalia in 1993) had a policy constraint: `NO_MILitary_DEPLOYMENT`. Therefore, they had to suppress the label to suppress the function call.

  **Was the Category Captured?**
  Yes. The legal category was captured by the political need for plausible deniability. The narrowness of the 1948 Convention (excluding political groups, requiring specific intent) was a feature, not a bug, for the drafters. It allowed them to sign a moral treaty without accepting an automatic military obligation.

  **Would Lemkin's Broader Version Help?**
  Counter-intuitively, **no.**
  If "cultural destruction" were included, the threshold for proof might have become *fuzzier*, giving states *more* room to argue. "We aren't killing them, we are just relocating them for development."
  The bottleneck in Rwanda wasn't the *definition* of the crime; it was the *cost of the response*. Even if the definition was broader, the US would still have avoided the label to avoid the intervention. They would have argued about whether "cultural destruction" had been met with the same vigor they argued about "specific intent." The word is the choke point because the word mandates action.

  ### 3. Can We Fix the Political Football?

  Is there a version of this category that doesn't turn naming into a political fight?
  **No. It is baked into the architecture.**

  Here is where the theory is silent and where it gets the case wrong:

  **1. The Sovereignty Paradox (Theoretical Silence)**
  International law theory generally assumes states act in good faith. Realism (IR theory) assumes states act in self-interest. The Genocide Convention sits in the uncanny valley between them. It creates a legal obligation that requires violating the core principle of the international system: State Sovereignty.
  *   **The Bug:** You cannot have a mandatory intervention trigger in a system where the actors who must intervene have veto power over the trigger.
  *   **The Silence:** Legal theory rarely addresses *who enforces the law on the lawmakers*. In domestic systems, the state has a monopoly on violence to enforce law. In international systems, the states *are* the monopoly on violence. They cannot enforce rules against themselves without consent.

  **2. Prevention vs. Prosecution (Where it gets it wrong)**
  The Convention is architected for **prosecution**, not **prevention**.
  *   **Retroactive Logic:** The legal standards (intent, specific acts) are designed for a courtroom *after* the bodies are counted. They require evidence gathering, chain of custody, and high bars of proof.
  *   **Real-time Reality:** Prevention requires acting on *indicators*, not *proof*. By the time you have legal proof of "intent to destroy," the destruction is often underway.
  *   **The Failure:** The system optimizes for punishing the perpetrator (ICTR trials) rather than saving the victim. In Rwanda, the "success" of the legal category was that the perpetrators were eventually convicted. The "failure" was that the category provided no mechanism to stop the killing while it was happening.

  **3. The "Responsibility to Protect" (R2P) Patch**
  In 2005, the UN tried to patch this with R2P. It decoupled intervention from the word "Genocide." It said sovereignty is a responsibility; if a state fails to protect its people, the international community can step in.
  *   **Result:** It failed in Syria, Myanmar, etc. Why? Because it still relies on the Security Council to vote. The veto power remains.
  *   **Conclusion:** You cannot solve a political incentive problem with a semantic fix. As long as the "fix" for a P0 bug requires spending blood and treasure, the admins will find a way to reclassify the ticket as P3.

  ### Summary for the Backend Dev

  *   **The Category:** It is a hardcoded trigger for mandatory intervention.
  *   **The Exploit:** States use semantic precision ("acts of" vs "is") to bypass the trigger without changing the underlying data (the killing).
  *   **The Root Cause:** The system lacks a root user. There is no super-admin who can force deployment. The admins (UNSC members) protect their own uptime (sovereignty) over the user's safety (victims).
  *   **The Verdict:** The category isn't broken; it's working as designed for the drafters. It was designed to look like a safety switch while actually being a record-keeping mechanism. Rwanda proved that without an automated enforcement layer (which doesn't exist in geopolitics), the label is just metadata that states can strip before deployment.

  If you want a category that doesn't become a political football, it cannot carry a mandatory cost. But if it carries no cost, it's just a sentiment. That is the logical deadlock.
