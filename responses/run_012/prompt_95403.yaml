      *   *Is money an "idea"?* Technically, money is a *sign* that conveys ideas of value. I should make that distinction.
      *   *The "Fiction" of Matter:* Ensure I explain that "matter is a fiction" doesn't mean "chairs aren't real." It means "independent substratum is a fiction." This is the most common stumbling block.

