  3. I forget to water the ficus I've had for ten years and it dies. I say I caused its death. No one was counting on me, no rule was broken, it's my plant, and I still think I killed it.

  4. Two strangers, one on each side of the pond, each independently able to toss the ring, neither does, the swimmer drowns. Here my gut says neither of them caused it. The drowning just... happened, and two people failed, but I can't name either as *the* cause, even though either one alone would have saved him.

