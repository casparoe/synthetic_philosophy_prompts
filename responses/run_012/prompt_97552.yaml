  Here is the reverse-engineered principle derived from your verdicts, followed by the necessary trade-offs and applications.

  ### The Principle: Exclusive Normative Responsibility (ENR)

  An agent's omission is a cause of a specific outcome if and only if four conditions are met:

  1.  **Capacity Clause:** The agent physically could have performed the preventing action.
      *   *Forced by:* All cases (implicitly). If the lifeguard couldn't swim, verdict would flip.
  2.  **Normative Anchor Clause:** The agent stood in a specific relationship to the victim or risk (role, ownership, or assumption of care) that generated a duty to act, regardless of whether a formal rule was codified.
      *   *Forced by:* **Case 3 (Ficus)** vs. **Case 2 (Stranger)**. This is the critical divider. Both had capacity and no external rule, but ownership creates an intrinsic normative anchor that mere proximity does not. This clause forces us to define "duty" broadly enough to include property relations but narrowly enough to exclude general moral duties.
  3.  **Exclusivity Clause:** The agent was the unique or designated locus of that duty in that context; no other equally obligated agent was available to fulfill it.
      *   *Forced by:* **Case 4 (Two Strangers)**. If duty alone were sufficient, and if we imagined the strangers *had* a duty, both would be causes. Your verdict (neither caused) implies that when responsibility is disjunctive or shared without designation, omission causation dissolves. It forces the principle to require *exclusive* responsibility to pin causation on an omission.
  4.  **Permission Clause:** No overriding rule, protocol, or physical constraint prohibited the action.
      *   *Forced by:* **Case 6 (Doctor)**. The doctor had capacity and a general role, but the protocol removed the *permission* to act. This distinguishes "ought not" from "could not."

  ### Application to New Cases

  **1. The AI Triage Tool**
  *   **Scenario:** Hospital leaves a known-flawed AI running; patient dies of missed tumor.
  *   **Analysis:**
      *   *Capacity:* Hospital could disable the tool.
      *   *Anchor:* Hospital administration holds the normative anchor for patient safety and tool deployment (analogous to **Case 7**, Car Company). They introduced the risk and manage the system.
      *   *Exclusivity:* The hospital is the unique controller of the software environment.
      *   *Permission:* No rule prohibits turning it off (unlike **Case 6**).
  *   **Verdict:** **Cause.** This aligns with the Car Company case. The hospital's omission to deactivate a known risk is causally potent because they hold exclusive normative responsibility for the safety of their diagnostic tools.

  **2. The Redundant Guardians (Invented)**
  *   **Scenario:** A nuclear plant has two safety officers, Alice and Bob. Protocol states *either* can hit the shutdown button during an alert. Both see the alert. Both freeze. Meltdown occurs.
  *   **Analysis:**
      *   *Capacity:* Both could act.
      *   *Anchor:* Both have a role-based duty.
      *   *Exclusivity:* **Failed.** The duty is disjunctive (either/or). Neither is the *exclusive* locus of responsibility.
      *   *Permission:* None blocked.
  *   **Verdict:** **Neither caused it.** According to ENR (and your verdict on **Case 4**), because the responsibility was shared without exclusivity, neither omission qualifies as *the* cause. The meltdown "just happened" due to systemic failure, not individual causal omission.

  ### The Trade-Off: Which Verdict Must Go?

  You asked me to be honest about which of your verdicts the principle cannot accommodate. The conflict lies between **Case 2 (Stranger)** and **Case 5 (Off-Duty Lifeguard)**.

  *   **Case 2:** Stranger on towel. No duty. Not a cause.
  *   **Case 5:** Off-duty lifeguard in uniform. No *actual* duty (legally off-clock), but you say **Is a cause**.

  The ENR principle relies on **Actual Normative Responsibility** (Clause 2). A uniform creates a *social expectation*, but not necessarily an *actual duty* (depending on jurisdiction, but metaphysically, the uniform changes nothing about the agent's relationship to the water).
  *   If you keep **Case 5**, you must admit that causation depends on *deception* or *appearance*, which makes causation subjective (dependent on what observers think).
  *   If you keep **Case 2** (and the ENR principle), you must admit that the off-duty lifeguard is metaphysically identical to the stranger on the towel.

  **Recommendation:** Overturn **Case 5**.
  In a seminar on *causation* (metaphysics), the uniform is irrelevant. It changes *liability* or *blame*, but not the causal structure of the event. The off-duty lifeguard is a stranger who happens to be wearing a shirt. To maintain a robust, objective principle of causation, you should concede that the off-duty lifeguard did **not** cause the death, aligning with Case 2. If you keep Case 5, you are teaching a principle of *legal imputation*, not causation.

  ### Summary of Adjustments
  *   **Keep:** 1, 2, 3, 4, 6, 7, 8.
  *   **Drop:** 5 (Reclassify as "Not a Cause" to align with Case 2).
  *   **Clarify:** 3 (Ownership counts as Normative Anchor even without external rules).
  *   **Clarify:** 7 (Treat as Omission to mitigate risk, not just Commission of design).

  \answer{An omission is a cause iff the agent had the capacity to prevent the outcome, bore exclusive normative responsibility for doing so based on role or ownership, and was not prohibited from acting.}
