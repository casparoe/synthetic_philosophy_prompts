  3.  **Critique the Analogy (Task 2 - Where it breaks):**
      *   *Specificity of Catalysts:* In chemistry, catalysts are often specific. A generic acid might work for many esterifications, but enzymes are hyper-specific. Hitler wasn't a generic "acid"; he had specific charisma, specific obsessions (Lebensraum, Jews), and specific political skills.
      *   *Catalysts *Can* Change Products (Kinetic vs. Thermodynamic Control):* This is the killer point. In complex reaction networks, a catalyst lowers the $E_a$ for *one pathway* over another. If there are multiple possible products (e.g., Democracy vs. Fascism vs. Communist Revolution), a specific catalyst selects the pathway. It *does* determine the product in kinetic control scenarios.
