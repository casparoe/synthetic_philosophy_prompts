prompt: |-
  A friend of mine who's deep in the Great Man vs structure fight keeps leaning on a chemistry analogy: Hitler was a catalyst, 1930s Germany was the reaction mixture already primed to go off, and a catalyst doesn't change whether a reaction is favourable, only how fast it gets there. So, he says, the whole thing was coming anyway and Hitler is more like a rate constant than a cause. He adds that you could have swapped in some other demagogue and gotten the same products out the other end. I buy that conditions were necessary but I think the analogy is doing way more work than he admits. Can you give me the mapping first -- what's the reaction mixture, the activation energy, the catalyst, the products, the rate -- then where the chemical picture stops fitting? And the bit I really want: is "a catalyst doesn't change the products" the premise that's actually carrying his conclusion, and does the conclusion survive once that breaks? If it doesn't, whats a better analogy for what he's really trying to say.
