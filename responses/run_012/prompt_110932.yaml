      *   *Sub-claim 2 (Action-Guiding):* Even if coherent, does believing in desert actually change *what* we do to a specific person compared to a pure public health/consequentialist model?
      *   *Sub-claim 3 (Realistic Gap):* Is there a *realistic* case (not a fringe thought experiment) where this difference manifests? (e.g., punishing the reformed, punishing the harmless elderly).

