answer: |-
  35%

  **Decomposition**

  *   **P(basic desert is a coherent notion at all rather than a placeholder for consequentialist reasons): 60%**
      Dennett's naturalized "evitability" and reasons-responsiveness might carve out a concept distinct from pure utility, but it risks collapsing into "forward-looking blame" upon inspection.
  *   **P(given it's coherent, that it ever changes what we should actually do to a particular person over and above deterrence + incapacitation + rehabilitation): 80%**
      Retributive proportionality sets a hard ceiling on punishment (no more than deserved), whereas quarantine sets a floor/ceiling on risk (no more than necessary), creating divergent prescriptions for the reformed or the harmless.
  *   **P(that some realistic case actually sits in that gap -- the reformed-but-guilty, the culpable-but-harmless, the war criminal who's 90 and no longer a threat): 70%**
      Current policies like life-without-parole for elderly inmates or lifetime sex-offender registries for rehabilitated individuals instantiate this gap, though economic pressures often force convergence.

  **Combination Logic**
  I am using a chain rule (multiplication) because all three conditions must obtain for there to be a *real* policy disagreement: the concept must be distinct, it must be action-guiding, and there must be actual cases where it guides action differently than the quarantine model. $0.60 \times 0.80 \times 0.70 \approx 0.34$.

  **The Bet and Evidence**

  *   **Term to bet against:** P(that some realistic case actually sits in that gap).
      *   *Why:* In practice, cost-benefit analysis usually trumps metaphysics; legislatures rarely fund the punishment of zero-risk individuals regardless of the justificatory framework, causing the systems to converge on cost-efficiency.
  *   **Evidence to move it:** Comparative data from jurisdictions with explicit retributive mandates versus those with explicit public-health mandates, showing statistically significant divergence in the treatment of low-risk, high-culpability offenders (e.g., elderly prisoners) after controlling for budget.
  *   **What would count as settling the whole thing:**
      To prove the claim "a Caruso-style quarantine world would be more humane" wrong, you would need to demonstrate that a risk-based model inevitably leads to *greater* net suffering than a desert-based model, specifically via **indefinite preventive detention**. Retributivism forbids punishing the innocent or punishing beyond proportionality; a pure quarantine model permits detaining the unconvicted or the reformed if their statistical risk remains high. If empirical modeling showed that a quarantine system requires detaining 5x more people for 3x longer to achieve the same safety as a retributive system, the "humane" argument collapses. Conversely, if removing desert language reduces recidivism and prison violence without increasing detention times, the pragmatic case for desert evaporates.
