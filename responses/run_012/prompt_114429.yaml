      *Step 6:* Name: "The Value Handoff". Question: "Is the remaining disagreement about what is 'good' rather than what is 'true'?"

      *Case 1 (Cameras):* Passes 1-5. Fails nowhere, proceeds to pilot.
      *Case 2 (Fare-Free):* Fails Step 1 or 6. Let's say Step 1. The user thinks it's obvious. The procedure says "If you already know the answer, this isn't inquiry." Or Step 6. "This is about subsidy values." Let's go with Step 1. "Is the outcome genuinely unknown?" If the user is lobbying, they are acting like it's known.
      *Actually, the prompt says "I personally believe in and have been quietly lobbying for".* This implies bias. The procedure should catch that the "problem" is pre-solved. Let's make it fail Step 2. The problem statement will be "How to fund free buses" (solution) vs "How to increase ridership/equity" (problem). If they can't separate them, stop.
      *Case 3 (Phones):* Passes 1, 2. Fails Step 3 (Public). The students are the public, not parents. Needs correction.

      *Wait, one case must tell me "not to do the thing I want".* That's Case 2. The outcome should be "Do not run as inquiry."

      *Let's finalize the JSON structure.*

      *Wait, one more check on "cannot_do".* Needs to be honest. It can't resolve moral disagreements. It can't predict the future perfectly. It can't replace elected authority.

