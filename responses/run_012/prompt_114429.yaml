prompt: |-
  I run civic engagement for a mid-size city — I'm the person who gets handed things like "council wants a citizens' assembly on the transit budget" and has to make it real with six weeks, four staff, and a few hundred residents who mostly show up once. I've been auditing a seminar on Dewey and his account of inquiry is honestly the most useful thing I've encountered for this job, except it all sits at a level where I can't hand it to my facilitators or to the parks guy who's running the next one. So I need you to turn it into a procedure we can actually run. What I mean by Dewey here is the shape of the thing rather than the slogans: inquiry starts because a situation is genuinely indeterminate and not just because two factions disagree; the problem has to get stated before it can be solved, and stating it is already a move; proposals are ends-in-view that get revised by the consequences they produce when acted on; a claim is warranted relative to an inquiry that has actually been carried through, not in the abstract; a public comes into being around the indirect consequences of transactions it didn't choose, and democracy is mostly about making those consequences communicable to the people absorbing them. I want all of that operationalized for people with no philosophy training.

  Fix the role and the constraints properly: we do one of these cycles every month or so, each one lands on a real budget line or a real bylaw change that council votes on, so the stakes are things like whether a corridor gets cameras or a route goes fare-free. We can't run a controlled trial — the pilot is the policy, it happens once, and the people who eat the downside didn't consent to being in the study. Our report has to be publishable and the council has to not be able to shrug it off. So: the questions to ask in order, what counts as a sufficient answer at each step, how we tell an indeterminate situation from a straight conflict of interest (because I suspect half our cycles are the second thing dressed as the first, and Dewey's method would have us doing something else entirely there), how we turn a felt grievance into a stated problem without letting the loudest party write it, how we convert a proposal into a hypothesis with predicted consequences and a named test, how we decide who bears the risk of a failed experiment and whether they can consent, and the points where the procedure should stop and hand the call to a person because the question is values and not method. Mark honestly which steps are judgment calls dressed up as method — I'd rather my facilitators know where they're improvising.

  Then run it on three cases and don't spare me: (1) a pilot of automated speed cameras on a corridor where the crash data is contested and the neighbourhood association and the delivery companies want opposite things; (2) a fare-free bus pilot on two routes, which I personally believe in and have been quietly lobbying for; (3) a bylaw banning phones in middle schools, where the parents asking for it and the students affected are obviously not the same public. At least one of these should come out with the procedure telling me not to do the thing I want, and I want to see the step where that happens. Give it back to me as JSON, one object, with these fields: "procedure", an array where each element has "step" (number), "name" (short), "question" (the thing we literally ask), "what_counts_as_answered" (the standard, in plain language), "if_it_fails" (what we do instead of pushing on), "who_decides" (either "procedure" or "person"), and "judgment_hidden_here" (say what we're really deciding when we answer this step, or null if it's genuinely mechanical); "worked_cases", an array where each element has "case", "steps_that_decide_it" (array of step numbers), "outcome", "asker_will_like_it" (yes or no), and "why"; "stop_conditions", an array of plain-language conditions under which we abandon the inquiry entirely; and "cannot_do", an array of the things this procedure will reliably get wrong. Keep the Dewey vocabulary only where it earns its keep — if a term isn't doing work for a facilitator, cut it and say the ordinary thing instead.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Civic engagement officer in a mid-size city.
      *   **Task:** Operationalize John Dewey's theory of inquiry (from *Logic: The Theory of Inquiry* and *The Public and Its Problems*) into a practical procedure for civic engagement cycles (monthly, real budget/bylaw stakes, limited staff/resources).
      *   **Constraints:**
          *   Output must be JSON.
          *   Specific fields required: `procedure` (array of steps), `worked_cases` (array of 3 specific cases), `stop_conditions` (array), `cannot_do` (array).
          *   Procedure steps must have: `step`, `name`, `question`, `what_counts_as_answered`, `if_it_fails`, `who_decides`, `judgment_hidden_here`.
          *   Cases: (1) Speed cameras (contested data, neighbors vs. delivery), (2) Fare-free bus (user believes in it, lobbying for it), (3) Phone ban in schools (parents vs. students).
          *   Requirement: At least one case must result in the procedure telling the user *not* to do the thing they want (specifically mentioned for the fare-free bus case potentially).
          *   Tone: Practical, honest about limitations ("judgment calls dressed up as method"), no unnecessary philosophy jargon.
          *   Deweyan Concepts to Operationalize: Indeterminate situation vs. conflict of interest, problem statement before solution, ends-in-view (proposals as hypotheses), warranted assertibility (claims based on inquiry), public formation (indirect consequences), democracy as communication of consequences.
          *   Constraints on Inquiry: No controlled trials (policy is the pilot), stakes are real, report must be publishable/unignorable.

  2.  **Deconstruct Dewey for Civic Engagement:**
      *   *Indeterminate Situation:* Something is off, unclear, troubled. Not just "Side A vs. Side B". If it's just conflicting interests with clear facts, it's politics/negotiation, not inquiry.
      *   *Problem Statement:* Defining the problem is part of solving it. Must avoid letting the loudest voice define it.
      *   *Ends-in-View:* Proposals are not final goals; they are plans of action subject to revision based on consequences.
      *   *Warranted Assertibility:* Claims are valid only if the inquiry process was sound.
      *   *The Public:* People affected by indirect consequences of transactions. Need to identify who bears the risk.
      *   *Democracy:* Communication of consequences.

  3.  **Drafting the Procedure (Step-by-Step):**
      *   *Step 1: Situation Check.* Is this actually uncertain? Or just a fight? (Dewey: Indeterminate vs. Conflict).
      *   *Step 2: Problem Definition.* What is the actual trouble? Not the solution. (Dewey: Institutionalization of the problem).
      *   *Step 3: Public Identification.* Who is affected? Especially those not in the room. (Dewey: The Public).
      *   *Step 4: Hypothesis Formation.* Turn proposals into "If we do X, Y happens." (Dewey: Ends-in-view).
      *   *Step 5: Risk & Consent.* Who loses if this fails? Can they agree? (Dewey: Consequences).
      *   *Step 6: Valuation.* Where does method end and values begin? (Dewey: Facts vs. Values boundary).

      *Refining for Constraints:* The user needs specific questions, standards for answers, and honesty about judgment calls.

  4.  **Developing the Cases:**
      *   *Case 1: Speed Cameras.* Data contested. Neighbors vs. Delivery.
          *   *Analysis:* Is the situation indeterminate? Yes, data is contested. Who is the public? Drivers, residents, pedestrians. Risk? Fines, safety.
          *   *Outcome:* Procedure likely supports a pilot *if* data collection is agreed upon.
      *   *Case 2: Fare-Free Bus.* User wants this.
          *   *Analysis:* User is biased. Is the situation indeterminate? Maybe not. Maybe the cost is known, the benefit is ideological. Who bears the risk? Taxpayers if revenue drops. Can they consent? Hard to get specific consent from general taxpayers.
          *   *Outcome:* Procedure should flag this as a *value* decision or a *political* decision, not an inquiry decision, because the "problem" is already solved by the user's belief. Or, it fails the "indeterminate situation" test because the user has already decided the end. Let's make it fail at Step 1 or Step 4. Let's make it fail at Step 1 (Is it genuinely indeterminate?) or Step 5 (Risk/Consent). The prompt asks for at least one case where the procedure says "don't do the thing I want". I'll make it fail at Step 1 (It's a value conflict, not an inquiry) or Step 6 (Values). Let's go with Step 1: It's not an indeterminate situation, it's a resource allocation preference.
      *   *Case 3: Phone Ban.* Parents vs. Students.
          *   *Analysis:* Different publics. Students bear the consequence, parents demand the action.
          *   *Outcome:* Procedure highlights the mismatch in "The Public". The students are the affected public, not the parents. Requires specific engagement with students.

  5.  **Refining the JSON Structure:**
      *   Must be valid JSON.
      *   No comments inside JSON (standard JSON doesn't allow comments, though some parsers do. I will stick to strict JSON).
      *   Fields: `procedure`, `worked_cases`, `stop_conditions`, `cannot_do`.

  6.  **Addressing Specific Deweyan Operationalization:**
      *   *Indeterminate vs. Conflict:* Step 1 needs to distinguish "We don't know what works" vs. "We know what works but don't want to pay/lose".
      *   *Problem Statement:* Step 2 needs to ensure the problem isn't just the solution in disguise (e.g., "The problem is we need cameras" vs. "The problem is speeding").
      *   *Ends-in-View:* Step 4 needs to frame proposals as tests.
      *   *Public/Consequences:* Step 3 & 5 need to identify who gets hurt if wrong.
      *   *Judgment Calls:* Be explicit in `judgment_hidden_here`.

  7.  **Drafting Content (Mental or Scratchpad):**
      *   *Procedure Step 1:* "Is the outcome unknown?" If everyone knows the outcome but disagrees on values, stop.
      *   *Procedure Step 2:* "What is the trouble?" Must be separate from the solution.
      *   *Procedure Step 3:* "Who gets hit by the side effects?" (The Public).
      *   *Procedure Step 4:* "What exactly are we testing?" (Hypothesis).
      *   *Procedure Step 5:* "Who pays for failure?" (Risk).
      *   *Procedure Step 6:* "Is this a value choice?" (Handoff to Council).

      *Case 2 (Fare-Free):* I need to make sure this fails. If I believe in it, I might treat it as fact. The procedure should catch that the "indeterminacy" is fake. The question is "Do we value free transit over revenue?" That's a value judgment, not an inquiry. So Step 1 or Step 6 should catch it. Let's put it at Step 1: "Is there genuine uncertainty about the consequence?" If I'm lobbying for it, I might be ignoring the uncertainty. Or Step 6: "Is this primarily about values?" Yes.
      *Actually, the prompt says "At least one of these should come out with the procedure telling me not to do the thing I want".* If I want fare-free buses, the procedure should say "This is not an inquiry, this is a political decision." So the outcome is "Do not run as an inquiry cycle."

      *Case 1 (Cameras):* Data contested. This is a good inquiry candidate. Outcome: Proceed with pilot + data agreement.
      *Case 3 (Phones):* Parents vs Students. Public mismatch. Outcome: Proceed only if students are included as the primary public.

      *Stop Conditions:* When it's pure values, when the affected public cannot be identified, when the risk is irreversible.
      *Cannot Do:* Resolve value conflicts, predict long-term black swans, replace voting.

  8.  **Reviewing Constraints:**
      *   JSON format.
      *   One object.
      *   Specific fields in `procedure` array.
      *   Specific fields in `worked_cases`.
      *   Honest about "judgment_hidden_here".
      *   Dewey vocabulary only where useful.

  9.  **Final Polish of JSON Content:**
      *   Ensure escape characters are handled.
      *   Ensure no trailing commas.
      *   Check logic on Case 2 (Fare-Free). The user wants it. The procedure should say "Stop, this is a value call."
      *   Check logic on Case 1 (Cameras). Data contested -> Inquiry needed.
      *   Check logic on Case 3 (Phones). Public mismatch -> Inquiry needs to fix representation.

      *Self-Correction on Case 2:* If the user is lobbying for it, they might bias the inquiry. The procedure needs to catch that the "problem" is already defined as "we need free buses" rather than "how do we improve access". I'll make Step 2 (Problem Definition) the failure point. The problem statement will be "How do we implement free buses" (solution-oriented) instead of "How do we improve transit access for low-income riders" (problem-oriented). If they can't restate it, inquiry fails.

      *Wait, better failure point:* Step 1 (Indeterminacy). If the user believes "Free buses are good", is there uncertainty? The uncertainty is fiscal/political. But if the user treats it as a moral imperative, inquiry is the wrong tool. Let's use Step 6 (Values). "Is the core disagreement about facts or values?" If values, inquiry stops.

      *Let's refine the "Judgment Hidden" field.* This is crucial. It needs to admit where the facilitator is making a call.

      *JSON Syntax Check:* Keys must be quoted. Strings must be quoted. No single quotes. Newlines in strings must be escaped (`\n`).

      *Dewey Terminology:* Keep "indeterminate situation", "ends-in-view", "public", "warranted". Cut the rest.

      *Let's build the JSON.*

      *Step 1:* Name: "The Uncertainty Check". Question: "Do we lack agreed-upon facts about what will happen, or do we just disagree on what we want?"
      *Step 2:* Name: "Problem vs. Solution". Question: "Can you state the trouble without naming the fix?"
      *Step 3:* Name: "Mapping the Public". Question: "Who suffers the side effects without having a seat at the table?"
      *Step 4:* Name: "The Hypothesis Test". Question: "If we do this, what specific change proves it worked?"
