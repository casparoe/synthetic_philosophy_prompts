answer: |-
  ### The Case

  **The Setup**
  Two people exist in all scenarios: Alice (poorly off) and Bob (better off). The good is annual disposable income, measured in thousands of dollars. This is a fixed population; no one is added or removed. We compare three states:

  *   **State 1 (Inequality):** Alice has \$10k. Bob has \$100k.
  *   **State 2 (Transfer):** Alice has \$15k. Bob has \$40k.
  *   **State 3 (Level Down):** Alice has \$5k. Bob has \$5k.

  **The Objections Tested**
  *   **The Leveling-Down Objection (LDO):** Does the view ever rank State 3 as better than State 1? (Everyone is worse off in 3, yet the view prefers it).
  *   **The Friend's "Substantive" Objection:** Does the view ever rank State 2 as better than State 1? (Alice gains a little, Bob loses a lot; total income drops from \$110k to \$55k).

  **The Weightings**
  Prioritarianism assigns moral value $V$ to a state by summing the transformed well-being of each person: $V = \sum w(u)$. The function $w$ must be strictly increasing (more is better) and concave (priority to the worse off). I will use two weightings a prioritarian might defend.

  1.  **Diminishing Marginal (Square Root):** $w(u) = \sqrt{u}$. This is standard, unbounded, and moderately prioritarian.
  2.  **Bounded Above (Saturating):** $w(u) = 100 \times (1 - \frac{1}{u+1})$. This function caps the moral value of any individual at 100, reflecting the view that beyond a certain point, extra resources add negligible moral value.

  **The Arithmetic**

  *Test 1: The Leveling-Down Objection (State 1 vs. State 3)*
  *   **State 1 (10, 100):**
      *   Weighting 1: $\sqrt{10} + \sqrt{100} \approx 3.16 + 10 = \mathbf{13.16}$
      *   Weighting 2: $(100 \times 0.91) + (100 \times 0.99) \approx 91 + 99 = \mathbf{190}$
  *   **State 3 (5, 5):**
      *   Weighting 1: $\sqrt{5} + \sqrt{5} \approx 2.23 + 2.23 = \mathbf{4.46}$
      *   Weighting 2: $(100 \times 0.83) + (100 \times 0.83) \approx 83 + 83 = \mathbf{166}$

  *Verdict:* Under both weightings, State 1 > State 3. Prioritarianism **never** prefers the level-down.

  *Test 2: The Friend's "Substantive" Objection (State 1 vs. State 2)*
  *   **State 1 (10, 100):**
      *   Weighting 1: **13.16**
      *   Weighting 2: **190**
  *   **State 2 (15, 40):**
      *   Weighting 1: $\sqrt{15} + \sqrt{40} \approx 3.87 + 6.32 = \mathbf{10.19}$
      *   Weighting 2: $(100 \times 0.94) + (100 \times 0.98) \approx 94 + 98 = \mathbf{192}$

  *Verdict:*
  *   Under Weighting 1 (Square Root), State 1 > State 2. The loss to Bob outweighs the gain to Alice.
  *   Under Weighting 2 (Bounded), State 2 > State 1 (192 vs 190). Here, the small gain to Alice swamps the enormous loss to Bob.

  ### The Accounting

  **1. Can the LDO be made to stick?**
  It cannot be done. It is mathematically impossible to construct a case satisfying your constraints where standard Prioritarianism prefers a Level-Down state (State 3) to the Status Quo (State 1).
  *   **Reason:** Prioritarianism is defined by a value function $w(u)$ that is *strictly increasing*. If you move from State 1 to State 3, $u_{Alice}$ decreases and $u_{Bob}$ decreases. Since $w$ is strictly increasing, $w(u_{Alice})$ must decrease and $w(u_{Bob})$ must decrease. Therefore, the sum $\sum w(u)$ must decrease.
  *   **Constraint Check:** This holds for *any* concave function, bounded or unbounded, provided it respects the Pareto principle (which Prioritarianism does by definition).

  **2. The Load-Bearing Feature**
  The feature that blocks the Leveling-Down Objection is **Strict Monotonicity** (the requirement that moral value always rises when someone's well-being rises, holding others constant).
  *   **Removal Test:** If you remove Strict Monotonicity (e.g., by adopting Telic Egalitarianism where equality adds independent value), State 3 can beat State 1. If you keep Strict Monotonicity (Prioritarianism), State 3 can never beat State 1.

  **3. The Friend's "Substantive" Claim**
  Your friend's claim—that Prioritarianism allows a small gain to swamp an enormous loss—is **contingent**, not necessary.
  *   In my arithmetic, Weighting 1 (Square Root) rejected the "swamp." Weighting 2 (Bounded) accepted it.
  *   Prioritarianism is not *committed* to extreme swamping; it is only committed to *some* priority. A moderate prioritarian (Weighting 1) avoids your friend's "substantive leveling down" just as easily as they avoid the formal leveling down.
  *   However, if a prioritarian adopts a very steep or bounded function (Weighting 2) to ensure sufficient aid to the poor, they become vulnerable to the **Excessive Priority Objection** (sacrificing too much total well-being for small gains to the worst off).

  **4. The Strongest Prioritarian Reply**
  *   **To LDO:** "The objection targets views that value equality *intrinsically*. I value equality only *instrumentally*, as a byproduct of weighted well-being. Since I always prefer more well-being to less, I never level down." (This is adequate).
  *   **To Friend's "Substance" Claim:** "What you call 'leveling down in substance' is simply a disagreement about the *degree* of priority. If you think sacrificing \$60k for a \$5k gain is wrong, you are arguing for a flatter weight function, not rejecting prioritarianism. Calling it 'leveling down' is a category error: in my preferred state, Alice is *better off*. Leveling down requires that *no one* benefits." (This is adequate, provided the prioritarian accepts moderate weights).

  ### The Verdict

  **You were right.**

  Prioritarianism escapes the Leveling-Down Objection. The objection specifically targets the claim that equality is an intrinsic good that can outweigh well-being. Prioritarianism denies this premise; it holds that well-being is the only intrinsic good, merely weighted. Because it satisfies the Pareto Principle by structure, it is immune to the Leveling-Down Objection by definition.

  Your friend was identifying a real vulnerability—the **Excessive Priority Objection**—but mislabeled it. They argued that if priority weights are high enough, Prioritarianism mimics the *outcome* of leveling down (destroying total value for the sake of the worse off). But as the arithmetic shows:
  1.  This only happens with specific, steep weight functions, not Prioritarianism as such.
  2.  Even when it happens, it is not leveling down, because the worse off *gain*.

  **Does the objection have force?**
  The Leveling-Down Objection, properly defined, has **no force** against Prioritarianism. It bounces off the Pareto constraint.
  However, the intuition *driving* your friend's argument has force. It suggests that if Prioritarianism is strong enough to satisfy our duties to the poor, it may become too strong, demanding unacceptable sacrifices from the better off. This is a distinct objection (Excessive Priority), and it remains live. But it is not the Leveling-Down Objection.

  **Commitment:**
  Prioritarianism sidesteps the Leveling-Down Objection completely. Your friend's resistance was not about the logic of leveling down, but about the *cost* of priority. You were correct to insist on the distinction; conflating "costly redistribution" with "leveling down" obscures the structural difference between Egalitarianism and Prioritarianism. The immunity is not cheap; it is fundamental to the view's definition of value.
