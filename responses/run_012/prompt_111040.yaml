answer: |-
  Your friend is a classic case of "right about the math, wrong about the conclusion, and overconfident about the closure."

  He gets the standard resolution of the *pre-opening* paradox correct, but his claim about the *post-opening* situation is technically flawed, and his dismissal of the paradox as "settled" ignores some genuinely interesting decision theory that has emerged from it. Your intuition that "the envelopes don't care if I peeked" is actually the most robust guide here.

  Here is the claim-by-claim breakdown from the perspective of someone who works in this field.

  ### 1. The Pre-Opening Argument ("Always Switch")
  **Friend's Claim:** *The argument that $E[\text{other}] = 5X/4$ is a fallacy because it assumes a probability distribution that can't exist (an improper prior).*
  **Verdict:** **Correct.**

  This is the standard mathematical resolution. The calculation $ \frac{1}{2}(2X) + \frac{1}{2}(X/2) $ implicitly assumes that no matter what value $X$ you hold, it is equally likely to be the smaller or the larger amount.
  *   **The Wince:** If this were true for *all* possible values of $X$, the prior distribution of money in the envelopes would have to be uniform over $(0, \infty)$. That is an "improper prior" (it doesn't sum to 1).
  *   **The Reality:** In any real scenario with a proper distribution (e.g., the host has a finite bankroll), there must be some values of $X$ where it is *more* likely you are holding the larger envelope. For those values, switching loses money. These losses exactly cancel out the gains from the values where switching wins.
  *   **Symmetry:** As your friend noted, by symmetry, the ex-ante expected value of switching is zero. You cannot have a strategy that says "always switch" that yields a positive expected gain before you look.

  ### 2. The Post-Opening Claim ("See \$100, Switch")
  **Friend's Claim:** *Once you open the envelope and see \$100, the conditional expected value really is 5/4 of what you're holding, so you should switch.*
  **Verdict:** **Wrong.**

  This is the most dangerous part of his explanation. It sounds sophisticated, but it contradicts his earlier point.
  *   **The Contradiction:** He just admitted that a distribution where "every amount makes switching look better" cannot exist. Yet, he is now claiming that for the specific amount you saw (\$100), the calculation holds.
  *   **The Technical Error:** The calculation $E[\text{other} | X=100] = 1.25 \times 100$ is **only** valid if $P(\text{smaller} | X=100) = 1/2$. This probability depends entirely on the prior distribution of the money.
      *   If the host is a billionaire and picks amounts randomly from a vast range, seeing \$100 might indeed make it 50/50 whether you have the smaller or larger one. In that specific case, switching *is* neutral or slightly positive.
      *   But if the host is a grad student with a max budget of \$150, and you see \$100, it is highly likely you have the larger envelope (the other must be \$50). Switching would be a mistake.
  *   **Your Intuition:** You asked, *"How can opening the envelope change whether switching is a good idea, since the envelopes don't care whether I've peeked?"* You are right. Opening the envelope gives you *information*, but it cannot magically turn a zero-sum symmetric game into a positive-sum game. If "always switch" is a losing strategy before you look, it cannot be a winning strategy for *every* value you see after you look. There must be some values where you should stay.
  *   **The Fix:** The same fix that kills the first argument (acknowledging a proper prior) kills this one too. You cannot calculate the expected value of the other envelope based *only* on the $X$ in your hand. You need to know the likelihood of $X$ appearing as the smaller vs. larger amount.

  ### 3. The St. Petersburg Comparison
  **Friend's Claim:** *It's the same disease as the St. Petersburg game... the cure is the same, stop leaning on expected value.*
  **Verdict:** **Debatable / Oversimplified.**

  *   **Nod:** Both paradoxes involve expectations that can behave badly when tails of distributions get heavy.
  *   **Wince:** The Two-Envelope Paradox does not require infinite expectations to work. You can construct versions with hard upper bounds (finite money) where the fallacious $5X/4$ reasoning still tempts people. The core issue in TEP is usually **conditional probability misuse**, not infinite utility.
  *   **The "Cure":** Saying "stop leaning on expected value" is a philosophical cop-out. Decision theory is built on expected utility. The solution isn't to abandon EV, but to calculate it correctly using Bayesian updating with a proper prior.

  ### 4. "The Paradox is Basically Settled"
  **Friend's Claim:** *Anyone who still thinks there's something deep in it is just confused.*
  **Verdict:** **Overconfident.**

  This is where your friend's PhD might be showing a bit of arrogance. While the *mathematical error* in the $5X/4$ proof is settled, the implications for decision theory are not "end of story."
  *   **Cover's Strategy:** There is a genuinely deep result by Thomas Cover (1987). It turns out you *can* construct a switching strategy that gives you a probability of ending up with the larger envelope strictly greater than 50%, **without knowing the prior distribution**.
      *   **How?** You generate your own random threshold $T$ from some distribution. If the amount in your envelope is less than $T$, you switch. If it's more, you stay.
      *   **Why it works:** If $T$ falls between the two envelope amounts, you are guaranteed to pick the larger one. Since there's a non-zero chance $T$ falls in that gap, your win rate exceeds 50%.
      *   **Significance:** This shows there *is* something deep here. It relates to randomized decision rules and breaking symmetry with external noise. Your friend's dismissal ignores this literature.

  ### 5. Is there *any* version where switching is the right move?
  **Yes.** But not for the reason your friend gave.

  *   **Scenario A (Information):** If you have independent knowledge of the distribution. E.g., You know the envelopes contain $(\$10, \$20)$ or $(\$20, \$40)$ with equal probability.
      *   If you open \$10: You know the other is \$20. **Switch.**
      *   If you open \$40: You know the other is \$20. **Stay.**
      *   If you open \$20: The other is \$10 or \$40. Here, the EV calculation depends on the specific probabilities.
      *   *Lesson:* You only switch for *specific* values, not "always."

  *   **Scenario B (Asymmetric Setup):** The standard paradox assumes the pair $(A, 2A)$ is chosen, then you pick one at random.
      *   Variant: The host puts \$Y in Envelope 1. He flips a coin. Heads: Envelope 2 gets \$2Y. Tails: Envelope 2 gets \$Y/2. You pick Envelope 2.
      *   In this specific asymmetric causal setup, the expected value of Envelope 2 *is* indeed $1.25 \times$ Envelope 1. You should switch. But this is no longer the symmetric Two-Envelope Paradox; it's a different game where the envelopes are not exchangeable.

  ### Summary: What to tell your friend

  1.  **He is right** that the "always switch" argument before opening is a fallacy caused by assuming an impossible prior.
  2.  **He is wrong** that opening the envelope validates the switch. Seeing \$100 does not automatically make the other envelope worth \$125. That calculation still requires a prior, and for any proper prior, there are values where switching is bad.
  3.  **He is dismissive** of the actual depth. The paradox has spawned legitimate research into randomized decision strategies (Cover's strategy) that allow you to beat chance without knowing the distribution.
  4.  **Your intuition is sound.** The envelopes don't care if you peek. If switching is neutral ex-ante, it cannot be positive ex-post for all values.

  **The Honest Technical Picture:**
  The paradox arises because we treat the variable $X$ (amount in hand) as a constant in one part of the expectation formula and a random variable in another.
  *   **Correct EV:** $E[\text{gain}] = \int (P(\text{smaller}|x) \cdot x - P(\text{larger}|x) \cdot \frac{x}{2}) f(x) dx$.
  *   For the gain to be positive for all $x$, you need $P(\text{smaller}|x) > 1/3$ everywhere.
  *   Summing this over all $x$ violates the laws of probability (you can't be more likely to hold the smaller envelope for *every* possible value).
  *   Therefore, there must be "switch" regions and "stay" regions. Opening the envelope tells you which region you are in, but it doesn't put you in the "switch" region by default.

  Tell your friend his diagnosis of the disease is good, but his prescription (switch after opening) is malpractice, and his prognosis (nothing deep here) ignores the patient's recovery.
