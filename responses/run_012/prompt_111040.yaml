      *   *Claim 5:* "Except... once you've actually opened your envelope and seen, say, $100, the situation is genuinely different: now the conditional expected value of the other envelope really is 5/4 of what you're holding, so if you've opened it, you should switch." -> **Highly Controversial/Generally Wrong.** This is the crux of the issue.
      *   *Claim 6:* "It's really the same disease as the St. Petersburg game... cure is the same, stop leaning on expected value." -> **Debatable.** TEP isn't necessarily about infinite expectation (though it can be), it's often about conditional probability misuse.
      *   *Claim 7:* "The paradox is basically settled, and anyone who still thinks there's something deep in it is just confused." -> **Overconfident.** Philosophers and statisticians still debate nuances (Bayesian vs. Frequentist, decision theory implications).

  3.  **Evaluate Specific Technical Points:**

      *   **The "Always Switch" Argument (Pre-opening):**
          *   Why is it wrong? It treats $X$ as a fixed constant in the expectation calculation but implicitly treats it as a random variable dependent on which envelope was picked. Specifically, $P(\text{other is } 2X | \text{you have } X)$ is not necessarily $1/2$. It depends on the prior distribution of money in the envelopes.
          *   Friend's diagnosis: "Improper prior." This is a valid mathematical explanation. If the prior distribution is uniform over $(0, \infty)$, it's improper. If it's proper, there must be some values where switching is bad.

