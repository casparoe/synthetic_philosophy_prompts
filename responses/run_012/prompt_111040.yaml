  **(Refining the "Open and Switch" critique):** If the prior is proper, there exists some $x$ where $E[\text{other}|x] < x$. So you shouldn't always switch. The friend claims the calculation *is* 5/4. That calculation is only valid if the prior is scale-invariant (improper). If the prior is proper, the calculation is wrong. So the friend is contradicting himself: he says the prior can't exist (correct), but then uses the logic derived from that non-existent prior to say you should switch after opening (incorrect).

