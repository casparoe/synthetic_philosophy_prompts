      *   **Is there a version where switching is right?**
          *   Yes, if you have information about the prior distribution. E.g., if you know the host caps the amount at \$500 and you open \$400, you should switch (other must be \$200). If you open \$10, you might switch (other could be \$20).
          *   Nalebuff's asymmetric variant: If the amounts are determined by a specific mechanism where one envelope is fixed and the other is doubled/halved based on a coin flip *after* you pick, switching might be rational. But in the standard symmetric setup, no.

