      *   **Section 5: Conclusion/Verdict.**
          *   Friend: 80% right on the math, 100% wrong on the "open and switch" advice, 50% right on "settled."
          *   User's intuition: "Envelopes don't care if I peeked" is correct. Expected value is conditional on information, but the *decision* shouldn't flip based on irrelevant information.

  5.  **Refining the Tone:**
