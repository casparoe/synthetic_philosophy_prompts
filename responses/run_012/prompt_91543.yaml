answer: |-
  Dean, colleagues, students, guests. Thank you for being here. Dean, we know your time is short, so I will begin by saying that what we attempt here is not to find a single answer, but to repair the tool we use to ask.

  The title of this workshop is "Why Britain and Not China?" It is a heavy title. It carries the weight of decades of scholarship. Some in this room have built careers on answering it. Others believe the question itself is a relic of a Eurocentric past. If I stand here and say the question is wrong, I insult the first group. If I say it is perfect, I ignore the second. So I will say neither. I will say that the question is not broken, but it is incomplete.

  To explain what I mean, I want us to imagine a car that will not start.

  A mechanic arrives. The owner asks, "Why won't the car start?" To the mechanic, this is not one question. It is a bundle of different questions depending on what the owner means. If the owner means, "Why won't it start *today* when it started *yesterday*?" the answer might be a dead battery. If the owner means, "Why won't *this* car start when the *neighbor's* car does?" the answer might be a broken engine. If the owner means, "Why won't it start *rather than roll downhill*?" the answer is about the transmission.

  The words are the same. The answers are different. The question only becomes answerable when we know what alternative we are comparing it to.

  There is a difference between a question that cannot be answered and one that simply lacks detail. Consider the question, "How much does the number seven weigh?" That is unanswerable. It is a category error; numbers do not have mass. No amount of thinking will fix it. But "Why did the car stop?" is not like that. It is under-specified. It assumes a context that hasn't been stated. It is not a mistake; it is a request for clarification.

  This is the position I ask you to adopt for the next two days. The question "Why Britain and Not China?" is not unanswerable like the weight of a number. It is under-specified like the stalled car.

  When we ask "Why Britain?", we must ask "Rather than what?"

  If we mean "Why Britain rather than Holland?", we are asking about finance, trade, and institutions in the seventeenth century. That is a well-posed question. It has specific variables.

  If we mean "Why Britain rather than the Yangzi Delta?", we are asking about energy constraints, geography, and labor markets in the eighteenth century. That is a different question with different evidence.

  If we mean "Why Britain rather than Japan?", we are asking about state structure and isolation policies in the nineteenth century. That is different again.

  If we mean "Why Britain rather than anywhere at all?", we are asking for a universal law of industrialization. That question may be too broad to hold water.

  These are not semantic games. They determine what counts as evidence. A fact that explains why Britain differed from Holland—say, the structure of the Bank of England—may be irrelevant to why Britain differed from the Yangzi Delta, where the constraint was coal access. If we mix these contrasts, we get noise. If we separate them, we get history.

  I want to speak directly to my colleagues who have worked under the banner of the Needham question. I am not saying your work was wasted. Far from it. By posing this broad comparison, you forced us to look at China not as a static backdrop, but as a dynamic alternative. You made the divergence visible. You created the field in which the rest of us stand. The question was productive precisely because it was broad enough to gather us all here. But now, to move forward, we must narrow the focus. We must honor that legacy by making the question precise enough to be tested.

  To the economic historians here: I know you worry that "Why China?" implies a deficit model, as if China was aiming for Britain and missed. That is not what we are doing. We are not asking why China failed. We are asking why the paths diverged. A fork in the road is not a failure of the path not taken; it is simply a difference in direction. We are not treating Europe as the default. We are treating the divergence as the event to be explained.

  So, what can this workshop settle? We will not produce a final verdict on the causes of the Great Divergence. Two days is not enough time, and the history is too complex for a single cause. What we can settle is the map of valid questions. We can agree on which contrasts are meaningful and which are anachronistic. We can agree that "Why Britain rather than the Yangzi Delta?" is a different inquiry than "Why Britain rather than Japan?" and requires different data.

  We are here to fix the question so that the answers might finally hold. If we leave here knowing exactly what we are asking, we will have succeeded.

  Thank you.

