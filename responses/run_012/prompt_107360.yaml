      *   *Elaboration:* "Double heart/thought." (Thought A: Truth known/believed; Thought B: Falsehood uttered).
      *   *Implication 1:* False statement + Belief it's true = Not a lie (Error/Rashness).
      *   *Implication 2:* True statement + Belief it's false = Lie.
      *   *Criterion:* "From the sense of his own mind, not from the verity or falsity of the things themselves." (Subjective intent over objective truth).
      *   *Later Addition:* "The fault of the liar is the desire of deceiving." (*Libido fallendi*).

  3.  **Address the Core Tension (Double Heart vs. Desire to Deceive):**
      *   *Observation:* Augustine seems to equate the "double heart" *with* the intention to deceive.
      *   *Reasoning:* Why have a double heart? To make the listener believe the sign instead of the mind. If I say $X$ but believe $Y$, I want you to believe $X$. That *is* the desire to deceive.
      *   *Synthesis:* The "double heart" is the *structure* of the act; the "desire to deceive" is the *purpose* of that structure. They aren't two separate requirements; they are two descriptions of the same moral reality. The double heart *manifests* the desire to deceive.

  4.  **Address "Signs of Whatever Kind":**
      *   *Augustine's Semiotics:* Augustine was big on signs (*De Doctrina Christiana*). A sign points to something else.
      *   *Application:* Yes, nods, gestures, silence (if context implies a claim), documents, smiles.
      *   *Limit:* It must be communicative. Tripping and falling isn't a lie. Pretending to trip to make someone think you fell? That's a sign.
      *   *Answer:* Yes, intentional misleading signs count.

  5.  **Address the Truth/Falsity Irrelevance (The Subjective Turn):**
      *   *Key Insight:* Augustine is defining the *sin* of lying, not the *logical property* of falsity.
      *   *Case A (Falsehood in good faith):* I am wrong, but I am honest. My will is aligned with truth (as I see it). No sin of lying.
      *   *Case B (Truth in bad faith):* I am right, but I am dishonest. My will is aligned against my own conscience. I am willing to treat truth as a tool for falsehood. This violates the order of the soul.
      *   *Why?* Because for Augustine, truth is God. To speak against your own mind is to turn away from the inner light/conscience.

  6.  **Reconstruct the Distinctions (Plain Language):**
      *   *Lying:* Mind says $A$, Mouth says $B$, Intent = Make you believe $B$. (Sin).
      *   *Erring:* Mind says $A$, Mouth says $B$, Intent = Make you believe $A$ (but I'm wrong about $A$). (Mistake, not sin of lying).
      *   *Deceiving:* This is the *goal*. Usually achieved by lying.
      *   *The Gap:* Can you deceive without lying? (The "Mental Reservation" or "Jocose Lie" problem). Augustine is very strict. If you intend to deceive, you are usually violating the "double heart" rule. But what if you say something true *specifically* to mislead? (e.g., Ambiguity). Augustine generally condemns the *intent to deceive* regardless of the truth value of the statement.

