      *   Flag fragile points? Check.
      *   Specific audience voices? Check.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I address the Representationalists' specific point about "body as damaged"? Yes, need to ensure that's in their objection.
      *   *Check:* Is the "Dreaded Question" distinct from the objections? Yes, it should be the synthesis question that ties the empirical and conceptual worries together.
      *   *Check:* Concessions section. Need to be strategic. Concede heterogeneity to disarm the clinician. Concede terminological slippage risk to disarm the psychologist.

