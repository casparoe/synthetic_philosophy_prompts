  2.  **Deconstruct the Theoretical Framework vs. the Film:**
      *   *Ranke:* "Show the past as it actually was." *Rashomon* seems to mock this initially (impossible to know), but the structure implies there *was* an "actual way." The film refutes the *possibility* of achieving Rankean objectivity through testimony, but affirms the *existence* of the Rankean reality.
      *   *Carr:* "Fact only becomes historical fact once selected." The four testimonies are perfect examples of Carr's selection process. Each witness selects facts that serve their ego. The film dramatizes Carr brilliantly.
      *   *White:* "Emplotment and moral weight." Each storyteller chooses a genre (tragedy, farce, honor duel, etc.) to cast themselves in a specific moral light. The film dramatizes White's idea that narrative form creates meaning/morality.

  3.  **Address Question 1: Relativism vs. Realism:**
      *   *Lazy Reading:* Truth is impossible; all stories are equal.
      *   *Better Reading:* Truth exists (ontological realism), but access is mediated (epistemological skepticism). The contradictions prove a reality exists (you can't contradict nothing). The film is not relativist about *events*, but it is constructivist about *meaning*.
      *   *Connection:* This aligns with the prompt's suspicion that the film presupposes a "fact of the matter."

  4.  **Address Question 2: The Woodcutter's Dagger & The Ending:**
