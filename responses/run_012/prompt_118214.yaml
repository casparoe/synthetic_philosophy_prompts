  *(Self-Correction Note)*: I need to be careful with the "Grounding Objection." It's the most famous one. I need to explain *why* it's a problem (truth requires a truth-maker). I also need to explain the Molinist response (truths don't always need causal grounding, e.g., math).
  Also, the "Freedom" objection needs to distinguish between "hard facts" and "soft facts" about the past.
