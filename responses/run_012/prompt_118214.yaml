          2.  *Freedom/Ownership:* The "Power over the Past" problem. If it's *true* I would do X, can I do Y? Molinists say yes (counterfactual power). Critics say no (fixity of truth).
          3.  *Predictive Difference:* Does it matter? Practically, no. Theologically, yes (prayer, evil, sovereignty). Is this fatal? No, metaphysics often lacks empirical output.
          4.  *Slide into Determinism:* The "Collapse" argument. If God knows it *would* happen, and He creates that world, did He ensure it? Defenders distinguish *causing* from *actualizing*.
      *   **Ranking the Defeaters:**
          *   *Tier 1 (Fatal):* The Grounding Objection (Metaphysical incoherence).
          *   *Tier 2 (Severe):* The Control Objection (Freedom is compromised).
          *   *Tier 3 (Awkward):* Empirical indistinguishability, Complexity/Occam's Razor.
      *   **Defender Concessions:** What do Molinists admit? (Brute facts, logical rather than temporal priority, no empirical difference).
      *   **Conclusion: Well-Defended vs. Well-Insulated:**
