      *   *Climax:* The distinction between "object-directedness" vs. "truth-condition."
      *   *Ending:* Mutual respect, no definitive resolution, but clarity on the disagreement.

  4.  **Refining the Arguments:**
      *   *Voss:* Focus on "Emotional Truth." The mind doesn't check ID cards before feeling. The pain was real pain. The new information anchors the floating signifier.
      *   *Thorne:* Focus on "Factive Verbs." Grief is factive (like "know"). You can't "grieve" a non-entity. You can only "mourne" a real loss. The discovery transforms the state from "quasi-grief" to "grief."
