  The branching questions

  To avoid label confusion, this tree sorts positions by the structure of their justification. It forces participants to articulate the mechanism of cooperation before naming their theory. The goal is to reveal hidden agreements between 'causal' and 'evidential' labelers who actually share structural views. Start at the root with the causal question. "Does your reason to cooperate depend on your choice physically altering the other agent's environment or mental state via signal transmission or force?" If yes, you follow the causal path, implying standard game theory. If no, you proceed to the nature of the connection, acknowledging acausal links. "Given no causal influence, what links your choice to theirs?" Branch A asks: "Is your act merely statistical evidence about their likely act, derived from common causes or background conditions?" Branch B asks: "Do you both implement the exact same decision algorithm or function, such that changing your output logically changes theirs?" Branch C asks: "Do you occupy the same indexical situation in the universe, making your choices interchangeable slots in a broader structure?"

  Next, determine the normative force binding the agent. "Is cooperation demanded because it maximizes your personal expected payoff, or because it satisfies an impartial moral duty regardless of payoff?" This separates prudential rationality, where you cooperate only if it serves your interests, from ethical obligation, where you cooperate because it is right even if costly. This distinction is crucial for separating decision theories from moral frameworks. Finally, test scalability regarding population size. "Does this reason vanish if there is only one other potential partner, or does it hold even in a minimal two-agent scenario?" This final split separates views requiring a 'large world' of copies to generate sufficient aggregate weight from those relying on pairwise symmetry or duty where one partner suffices. Some views claim cooperation only matters if many agents are identical; others claim the logical link holds regardless of quantity. Answering these sequentially places you on a leaf without needing to know the theory's name beforehand, focusing purely on the structural justification provided for cooperation rather than historical labels or academic affiliations. This ensures participants clarify their underlying metaphysics before debating labels. Ensure each participant answers based on their actual reasoning, not their tribe. This prevents equivocation where 'causal' means 'physical' to one person and 'non-magical' to another.

  The leaves

  **Causal Decision Theory:** Cooperates only if causal leverage exists. In seed cases: Defects in Identical PD (one-shot), Distant Civ (no interaction), and Uncertain Algorithm because no signal reaches the other. Awkward commitment: Accepts losing money in Newcomb problems where prediction is accurate, refusing to pay for winning news. It prioritizes causal control over expected utility maximization in correlated cases, often appearing irrational to outsiders.

  **Evidential Decision Theory:** Cooperates if act correlates with outcome. In seed cases: Cooperates in Identical PD (one-shot), Distant Civ (no interaction), and Uncertain Algorithm if correlation is high enough to shift expected utility. Awkward commitment: Willing to perform futile rituals to manage news, such as avoiding smoking to avoid cancer genes, confusing correlation with causation. It implies agents should manipulate data rather than outcomes to succeed.

  **Functional/Timeless Decision Theory:** Cooperates via shared function. In seed cases: Cooperates in Identical PD (one-shot) & Distant Civ (no interaction) where algorithms match, hesitates in Uncertain Algorithm where similarity is uncertain. Awkward commitment: Requires metaphysical view of computation as primary over physical causation, treating logic as physically efficacious.

  **Superrationality:** Cooperates via symmetry. In seed cases: Cooperates in Identical PD (one-shot), unsure in Distant Civ (no interaction) & Uncertain Algorithm depending on definition of reasoner. Awkward commitment: Vague on what counts as 'similar enough' to trigger the logical link, lacking formal decision rules.

  **Kantian/Deontological:** Cooperates via universalizability. In seed cases: Cooperates in Identical PD (one-shot) & Distant Civ (no interaction) as duty, regardless of payoff. Awkward commitment: Can demand cooperation even when disastrous, prioritizing rule consistency over outcomes, potentially ignoring personal cost.

  **Rule-Consequentialism:** Cooperates via optimal rules. In seed cases: Cooperates if rule maximizes good globally across all cases. Awkward commitment: Collapses into act-consequentialism in secret cases where rules aren't publicly known, losing its distinctiveness.

  **No Reason / Defect Dominance:** Defect always. In seed cases: Defects everywhere regardless of similarity or evidence. Awkward commitment: Accepts systematic loss in Prisoner's Dilemmas where cooperation yields higher mutual payoff, prioritizing dominance over welfare.

  Empty branches

  **Causal Influence + Same Decision Function:** This combination is incoherent. If the reason relies on physical causal influence, the similarity of the decision function is irrelevant to the mechanism of change. It conflates physical transmission with logical identity, creating a category error in the justification.

  **Impartial Morality + Large World Necessary:** This is unattractive. Moral duties generally shouldn't vanish or appear based on population size; requiring a vast universe for a duty to exist seems arbitrary. It implies morality is contingent on cosmology rather than reason, which undermines normative force.

  **Evidence + Individual Rationality + One Partner:** This is largely unexplored. It is rarely argued that statistical evidence alone binds rationality in one-off cases without function sharing or causal links. It lacks a mechanism for why evidence matters prudentially in single interactions, leaving a gap.

