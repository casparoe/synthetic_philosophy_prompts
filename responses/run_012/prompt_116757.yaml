      *Sensory Details:* Damp coast, piano wire tension, hum of the server/device, the bill, the heating cost.

      *Dialogue:* Keep it grounded. No "ontological paradox." Just "It's her" vs "It's not."

      *Word Count Check:* Keep it tight.

