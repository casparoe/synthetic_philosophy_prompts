      The rain hit the window. The bill was on the table. $2000 vs $200. The device sat there. Her brother Mark came in. "Just pay the Halda one," he said. "She told me about the cat yesterday." The daughter, Elena, knew Halda was just lookup tables. The other one was a brain scan. But they sounded the same. She asked the device about the tuning hammer. It answered right. She asked about the disease. It answered right. Mark said, "Why does it matter?" Elena didn't know. She kept testing. 2 AM. She asked about the first piano she ever tuned. The voice paused. Just like Mom. But was it remembering or calculating? The money was running out. The heating clicked off. She had to choose. She looked at the piano.

