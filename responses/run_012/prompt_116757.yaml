      Elena watches the waveform? No, just listens.
      She knows the secret. One is a ghost in the machine, one is a parrot. But the parrot is perfect.
      David says, "Stop poking it."
      Elena says, "I need to know."
      David says, "It's money. We can't afford the hospital grade."
      Elena knows this. But she hates the lie.
      Late night testing. She asks about the silence.
      The answer comes. Perfect.
      Ending: She touches the piano key. Or the device.

