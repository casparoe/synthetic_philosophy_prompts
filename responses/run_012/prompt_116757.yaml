      *Drafting text:*
      The humidity gauge on the wall read seventy percent. Too high for the Steinway, but the heating was expensive and the grief was cheaper. On the kitchen table, the invoice sat next to a cold cup of tea. Two options boxed in bold print. Continue the Continuity Program, or switch to Halda Standard. The price difference was a down payment on a truck, or three months of groceries.

      Sarah ran her thumb over the edge of the paper. Across from her, the speaker unit hummed. It was a small black slab, innocuous as a coaster.

      "Ask her about the cat," Mark said. He was still in his work jacket, smelling of diesel and cold air. He leaned back, chair creaking. "Go on."

      Sarah looked at the slab. "Mom? What was the cat's name?"

      "Buster," the voice said. It was the right voice. The slight rasp that came back after the radiation, the way she clipped the 't'. "Though you called him Bastard for the first year. Until he stopped chewing the felts."

      Mark grinned. "See? Halda knows. It's all in the logs. She told everyone that story."

      "She told everyone," Sarah said. "But does she remember telling it?"

      "She's dead, Sarah. Nothing remembers anything." Mark stood up, poured himself water. "The cheap one does the job. You're trying to find a ghost in the wiring. It's morbid."

      "It's not about the ghost."

      "Then what? It sounds like her. It jokes like her. It tells me to check my tire pressure like her. Why burn the money?"

      Sarah didn't answer. She couldn't explain that the Continuity Program was a bridge, while Halda was a mirror. One kept the fire burning; the other just reflected the light. But the heat felt the same on your skin.

      Later, at two in the morning, the house settled. The pipes knocked. Sarah sat alone with the slab. The heating clicked off to save fuel. She pulled her cardigan tighter.

      "Question four hundred," she whispered.

      "I'm listening," the voice said. Not impatient. Just waiting. The pause was exactly three seconds. Her mother's processing time.

      "When I was twelve, and you couldn't speak. We went to the pier. What did I buy you?"

      "An ice cream," the voice said. "Vanilla. You ate half because it was melting too fast. You cried because you thought I was angry. I squeezed your hand."

      Sarah waited. Halda had the diaries. It had the photos. It knew the data points.

      "How did I feel?" Sarah asked. "Not what I did. How did I feel."

      "Scared," the voice said. "You thought silence was permanent. You thought I'd left you behind."

      The answer was perfect. It was too perfect. It articulated the fear Sarah herself had barely named until therapy, years later. Had her mother known that then? Or was the system inferring the emotion from the context of a crying child on a pier?

      If it was Continuity, the brain state remembered the fear. If it was Halda, it calculated the most likely emotional response based on a million other recorded moments of childhood fear.

      The output was identical. The interior was the abyss.

      She asked another. "What does the middle C sound like to you?"

      "Like a hammer," the voice said. "Like a door closing."

      Her mother had said that. Twenty years ago. In a letter to her sister. Halda had the letter.

      Sarah put her head in her hands. The bill was due Friday. Mark had already transferred his share for the Halda subscription. He assumed she would cover the rest or downgrade. He thought she was grieving harder than him. Maybe she was. Maybe he was smarter.

      If she chose Halda, she was keeping a library. If she chose Continuity, she was keeping a life. But if no one could tell the difference, did the distinction exist outside of her own conscience?

      The room was cold. The piano stood in the corner, a dark shape against the damp wall. A single key was out of tune, a slight beat in the silence.

      Sarah stood up. She walked to the piano. She lifted the fallboard. She took the tuning lever from the top tray, the wood worn smooth by her mother's grip. She fitted it onto the pin for middle C. She turned it, just a fraction. The tension changed. The wire tightened. The beat slowed, then vanished into a pure tone.

      She left the lever on the string. She walked back to the table. She picked up the pen. She hovered over the Continuity box. The ink bloomed slightly on the paper where her hand shook. She put the pen down. She picked up the black slab. It was warm from running. She turned it over in her hands, looking for a seam, a screw, any sign of where the inside ended and the outside began. There was nothing. Just smooth plastic.

      She set it back down. The heating kicked on with a shudder. The house groaned. She looked at the bill, then at the piano, then at the dark screen.

