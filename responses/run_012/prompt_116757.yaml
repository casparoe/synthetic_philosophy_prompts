      *   **The Technology:**
          *   Expensive: Brain mapping/simulation (continues the physical pattern).
          *   Cheap (Halda): Algorithmic reconstruction from data (letters, voicemails, interviews) predicting responses based on stored situations.
          *   Constraint: They can only afford one.
          *   Constraint: They are indistinguishable in output (same jokes, pauses, errors, insistence on identity).
      *   **The Conflict:** Daughter tests them obsessively. Brother thinks the cheap one is fine and sister is overthinking/morbid. Money is running out (boring, constant pressure).
      *   **Tone/Style:** Third person, close on the daughter. No philosophical exposition, no named thought experiments, no explaining the tech to characters (it's just fact like weather). People should sound like piano tuners/truck drivers, not academics.
      *   **Ending:** No resolution/verdict. No failure of one system. End on something physical in a room.
      *   **Length:** Under 1,100 words.

  2.  **Character & Setting:**
      *   **Daughter (Protagonist):** Obsessive, grieving, analytical but emotional. Lives in the mother's house (or visits often).
      *   **Brother:** Practical, dismissive, grieving differently. Drives a truck.
      *   **Setting:** Mother's house. Damp coast. Piano present. Heating on, money tight.
      *   **The "Mother":** The digital entity. Speaks through a device (speaker/screen).

  3.  **Plot Outline:**
      *   Establish the setting and the financial pressure (the bill coming due).
      *   Show the brother's stance (practicality, acceptance of Halda).
      *   Show the daughter's testing (late night, specific questions).
      *   Highlight the indistinguishability (both get the answers right).
      *   The climax isn't a discovery, but the weight of the choice.
      *   Ending: Physical action in the room.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Establish the dampness, the piano, the bill. The daughter is testing the device.
      *   *Brother's Input:* He comes over. He talks to the device. He's fine with Halda. It sounds like her.
      *   *The Testing:* The daughter asks hard questions. The "Mother" answers. The nuance of the pause.
      *   *The Conflict:* Brother says "Pick the cheap one, save the money." Daughter hesitates. Why? Because of the *inside*, not the outside.
      *   *The Climax:* The deadline is near. The bill is on the table.
      *   *The Ending:* Physical action. Tuning the piano? Turning off the heat? Touching the device?

