answer: |-
  ### 1. Exam Question

  **Question 4: Prospective Consequentialism and the Boundary Problem (20 Marks)**

  In recent seminars, we have discussed the "cluelessness" objection: that the long-term consequences of our actions are so vast and unknowable that consequentialism cannot guide action. The standard reply is to maximize *expected value* (EV) using subjective credences. However, critics argue that for distant consequences, these credences are inscrutable or arbitrary.

  Consider the following novel position, **Prospective Consequentialism (PC)**:

  > **Definition:** An act is right iff it maximizes expected value computed over the agent's "epistemically available" consequences.
  > **Availability Condition:** A consequence is available only if the agent can assign a credence grounded in (a) observed frequencies or (b) a well-understood causal mechanism.
  > **Exclusion Clause:** Consequences that are merely conceivable (lacking mechanism or track record) are excluded from the calculation entirely (credence = 0), rather than being assigned a tiny positive credence.

  Proponents argue PC solves cluelessness by truncating the infinite chain of unforeseeable effects. Critics raise the **Gerrymandering Worry**: The "availability line" is ad hoc. An agent can always redraw the boundary of what counts as a "well-understood mechanism" to include or exclude exactly those consequences that would flip the moral verdict. Thus, PC may just relocate the cluelessness from the consequences to the boundary conditions.

  **Task:** Write an essay evaluating Prospective Consequentialism in light of the Gerrymandering Worry. Your essay must:
  1.  Explain precisely what PC buys you over plain subjective expected-value maximization.
  2.  Analyze whether the Gerrymandering Worry is fatal or answerable.
  3.  Reach a definitive verdict on whether PC is a viable normative theory.

  *Do not hedge. You must argue either that PC survives the worry or that it collapses. Time allowance: 90 minutes.*

  ***

  ### 2. Model Answer

  **Prospective Consequentialism and the Illusion of Precision**

  Prospective Consequentialism (PC) attempts to rescue consequentialism from radical cluelessness by restricting the domain of moral calculation. Unlike standard subjective consequentialism, which demands agents assign credences to all conceivable outcomes (leading to arbitrary probabilities for far-future effects), PC mandates an *exclusion clause*. If a consequence lacks an observed frequency or a well-understood causal mechanism, it is treated as having zero moral weight. This offers a clear advantage: it renders the calculation tractable. By ignoring the "inscrutable tails" of the consequence chain (e.g., the butterfly effect of saving a life on population dynamics a century later), PC provides a decision procedure that agents can actually use without resorting to guesswork disguised as probability.

  However, the Gerrymandering Worry suggests this tractability is purchased at the cost of objectivity. The worry is not merely that agents might be mistaken about what counts as a mechanism, but that the criterion itself is manipulable. If "well-understood causal mechanism" is epistemically relative to the agent, then PC collapses into a form of motivated reasoning. An agent who wants to justify a selfish act can claim the long-term harms are "mere speculation" (unavailable), while an agent wanting to justify altruism can claim those same harms are "plausible risks" (available).

  This worry is fatal to PC as an objective normative theory. The crux of the issue lies in the status of the "availability" condition. For PC to work, the boundary between "available" and "unavailable" must be factive or at least intersubjectively stable. But epistemic access to causal mechanisms is itself subject to the same cluelessness that plagues the consequences. Consider the act of donating to a charity. A PC agent excludes the long-term economic shifts caused by the donation because there is "no well-understood mechanism." But why is the mechanism for immediate relief understood while the mechanism for long-term shift is not? Both rely on inductive inference. If the agent is allowed to decide when induction is sufficient to count as a "mechanism," they are effectively re-introducing subjective credences under the label of "availability."

  Defenders might argue we can objectify the boundary by appealing to scientific consensus. However, this renders PC too conservative. Many moral emergencies occur where scientific consensus is lagging (e.g., early climate action or novel AI risks). If PC requires established mechanisms, it forbids preventative action in novel contexts. If it allows individual judgment of mechanisms, it permits gerrymandering. There is no middle ground.

  Therefore, PC does not solve the cluelessness problem; it displaces it. The uncertainty regarding *which consequences obtain* is replaced by uncertainty regarding *which consequences count*. Since the criteria for counting are as vulnerable to ignorance and bias as the probability assignments they replace, PC fails to provide the robust guidance it promises. It offers the illusion of precision while retaining the arbitrariness of standard expected-value maximization. Consequently, the Gerrymandering Worry is fatal: PC cannot constrain the agent's moral reasoning any better than the theories it seeks to improve.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Points x 4 Marks)**

  | Point | Must-Hit Move (4 Marks) | How Students Typically Blow It (0-2 Marks) |
  | :--- | :--- | :--- |
  | **1. PC Distinction** | **Identify the Exclusion Clause:** Must explicitly state that PC *excludes* unforeseeable consequences (credence = 0) rather than assigning them low probability. | Confusing PC with standard Subjective Consequentialism; treating "availability" as just "high probability" rather than a hard boundary. |
  | **2. Theoretical Benefit** | **Articulate Tractability:** Must explain *why* PC helps (it blocks infinite/inscrutable chains, making calculation possible for agents). | Vaguely saying "it helps with uncertainty" without explaining the mechanism of truncation or the problem of inscrutable tails. |
  | **3. Gerrymandering Analysis** | **Define Boundary Manipulation:** Must explain the worry as *manipulability* of the "mechanism" criterion, not just error. The agent tunes the definition to get the desired verdict. | Treating the worry as simple ignorance ("we don't know the mechanisms") rather than the structural ability to redefine availability to suit intuitions. |
  | **4. The Crux (Mechanism)** | **Evaluate the "Mechanism" Criterion:** Must analyze whether "well-understood mechanism" is objective or subjective. This is the pivot point for the verdict. | Asserting the criterion is obviously objective or obviously subjective without argument; failing to see that *defining* the mechanism requires the same knowledge as predicting consequences. |
  | **5. Defended Verdict** | **Take a Side:** Must conclude definitively (Fatal or Survivable) and ensure the conclusion follows logically from the analysis in Point 4. | Hedging ("it depends," "on the one hand..."); or reaching a verdict that contradicts their earlier analysis (e.g., arguing the boundary is subjective but PC survives). |
