      *   **Constraint 1:** Avoid standard "cluelessness vs. expected value" recitation. Force engagement with the specific PC definition.
      *   **Constraint 2:** Build around the provided definition of PC and the "gerrymandering worry."
      *   **Deliverables:**
          1.  Exam Question (~90 mins writing time).
          2.  Model Answer (600-800 words, must take a side).
          3.  Marking Scheme (5 points x 4 marks = 20 total, with specific "blow it" descriptions).
      *   **Tone/Level:** High-level normative ethics. Discriminating (B students miss the crux, A students hit it).
      *   **Integrity:** Don't rig the outcome. If PC fails, admit it. If it succeeds, defend it.

  2.  **Deconstruct the Philosophical Content:**
      *   **Standard Cluelessness:** We don't know long-term effects. Standard reply: Use Expected Value (EV) with subjective credences. Problem: Credences for far-future stuff are arbitrary/inscrutable (Greaves, Lenman).
      *   **Prospective Consequentialism (PC):** Right act = max EV over *epistemically available* consequences.
          *   *Availability Condition:* Grounded in observed frequencies OR well-understood causal mechanisms.
          *   *Exclusion:* Merely conceivable consequences (no mechanism/track record) get 0 weight, not tiny positive credence.
      *   **The Gerrymandering Worry:** The "availability line" is manipulable. Agents can define "mechanism" loosely or strictly to get the result they want. It shifts the problem from "what are the consequences?" to "what counts as available?"
      *   **The Crux:** Is the availability condition *objective* enough to prevent manipulation, or is it inherently subjective/arbitrary? Does PC solve the *guidance* problem or just the *calculation* problem? Does it collapse into subjectivism?

  3.  **Drafting the Exam Question:**
      *   Need to present PC clearly (as a stipulation).
      *   Need to present the Gerrymandering Worry clearly.
      *   Need to demand a verdict.
      *   *Drafting thought:* Make sure they distinguish PC from standard Subjective Consequentialism. The key is the *exclusion* of unconceived consequences, not just low credence.
      *   *Prompt Structure:* Define PC. Define the Worry. Ask for evaluation of whether PC solves cluelessness or just moves it. Require a stance.

  4.  **Developing the Model Answer:**
      *   *Stance:* I need to choose a side to make it a *model*. The strongest philosophical move is usually to argue that PC *fails* because the "mechanism" criterion is itself vulnerable to the same epistemic opacity as the consequences. Or, argue it succeeds but at a high cost (abandoning objective rightness). Let's go with a nuanced failure: PC fails to solve the normative problem because the "availability" boundary is itself subject to cluelessness.
      *   *Wait, actually:* A strong student might argue PC *succeeds* as a practical guide even if it's theoretically imperfect. But the prompt asks if the gerrymandering worry is *fatal*. A "fatal" verdict is often sharper for a model answer. Let's argue the worry is fatal because the "mechanism" constraint cannot be non-arbitrarily defined without reintroducing the original uncertainty.
      *   *Key moves to include:*
          1.  Clarify PC's distinction from standard EV (exclusion vs. low probability).
          2.  Explain the benefit (blocks infinite/inscrutable chains).
          3.  Analyze the Gerrymandering Worry (manipulability of "mechanism").
          4.  Argue why a fix fails (defining "mechanism" requires the same knowledge we lack).
          5.  Final Verdict (PC collapses).
      *   *Word Count:* Keep it tight (600-800).

  5.  **Developing the Marking Scheme:**
      *   5 Points x 4 Marks.
      *   Need to identify the specific analytical moves required.
      *   *Point 1:* Accurate reconstruction of PC (specifically the exclusion clause).
      *   *Point 2:* Identification of the specific advantage over standard EV (blocking inscrutable tails).
      *   *Point 3:* Precise formulation of the Gerrymandering Worry (boundary manipulation).
      *   *Point 4:* Evaluation of whether the boundary can be fixed (the crux).
      *   *Point 5:* Clear, defended verdict (no hedging).
      *   *Blow it:* Describe the typical B-grade mistake for each (e.g., confusing PC with subjectivism, missing the exclusion clause, describing the worry vaguely, hedging the conclusion).

  6.  **Refining and Polishing:**
      *   *Check Question:* Is it clear? Yes. Does it prevent recitation? Yes, because they have to apply the specific PC definition.
      *   *Check Model:* Does it take a side? Yes (Fatal). Is it philosophical? Yes.
      *   *Check Scheme:* Is it granular enough for grading? Yes.
      *   *Tone Check:* Ensure it sounds like a grad seminar (technical but accessible).
      *   *Self-Correction on Model Answer:* I initially thought about arguing PC succeeds. But the "Gerrymandering Worry" is quite strong if "mechanism" is epistemic. If I argue it succeeds, I need a robust account of "mechanism." If I argue it fails, I attack the epistemic access to "mechanism." The failure argument is often more penetrating for a "cluelessness" context. I will write the model answer arguing the worry is *fatal* because the availability condition reintroduces the uncertainty at the meta-level. This demonstrates critical engagement.

