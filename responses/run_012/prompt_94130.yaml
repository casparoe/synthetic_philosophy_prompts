          *   Missing: Both treat it as binary. It's likely about *normative deviation*.

      *   *Dana's Test Cases Prediction:*
          *   Case 1 (Justified Harm): People will likely say "not intentional" or be split. (Supports Ravi's nuance).
          *   Case 2 (Bad Will/Good Effect): People will likely say "not intentional." (Supports Dana's asymmetry, hurts Ravi's quality-of-will).
          *   *Conclusion:* The "Normative" view (a third option) explains both. We call it intentional if it deviates from the norm in a relevant way.

      *   *Confidence:* High on the empirical predictions, lower on the metaphysical implication (what this says about "free will" or "concept nature").

  6.  **Refining the Ratings and Justifications:**
      *   Need to be careful not to just say "Knobe said X." Need to evaluate the *argument* presented in the prompt.
      *   Ravi Move 1: Right that it's not an error.
