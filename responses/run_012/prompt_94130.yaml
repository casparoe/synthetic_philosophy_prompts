      *   *Case 2 (Bad Will/Good Effect):* If a villain does something bad and accidentally helps, do we say he helped intentionally? Usually no. This hurts Ravi's claim that "bad will makes it intentional." It supports Dana's claim that the *outcome valence* drives the asymmetry more than the agent's overall moral status.
