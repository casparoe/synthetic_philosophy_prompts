      *   *Correction:* Actually, the literature on "moral valence vs. normative status" is complex.
          *   *Case 1 (Permissible Harm):* If the action is permissible, intentionality drops. (Supports Ravi's claim that justification matters).
          *   *Case 2 (Immoral Act/Good Side Effect):* If the act is immoral but side effect is good, people still usually say "not intentional" regarding the good side effect. (Supports Dana's asymmetry view over Ravi's "quality of will" view).
      *   *Synthesis:* Ravi is right that norms matter (Move 1 & 3). Dana is right that it's not *just* simple blame (Move 2). Dana's tests reveal that Ravi's "quality of will" theory might be too broad (Move 4). Ravi's retreat to "fuzziness" (Move 5) is a bit ad hoc but acknowledges the gradient nature of folk judgments.

  5.  **Drafting the Adjudication:**

      *   *Introduction:* Acknowledge the depth of the debate. It mirrors the actual academic literature (Knobe vs. Adams/McCann/etc.).
      *   *Move 1 (Ravi):* **Mostly Right.** Captures the core Knobean insight. The concept *is* sensitive to evaluation.
      *   *Move 2 (Dana):* **Partially Right/Partially Mistaken.** Right that foresight is factual, wrong that the asymmetry is merely a "bias" or "error." It's a feature of the concept. The circularity point is logical but pragmatic usage differs.
      *   *Move 3 (Ravi):* **Mostly Right.** Refines the theory well. "Quality of will" is a better descriptor than "blame."
      *   *Move 4 (Dana):* **Clearly Right (Methodologically).** These are the correct empirical tests. This is the strongest move.
      *   *Move 5 (Ravi):* **Mixed.** The "fuzzy" defense is weak (protects theory too much), but the critique of Dana's "neutral standard" is strong.

      *   *Who is right about what?*
          *   Ravi: The concept is normative/evaluative, not purely descriptive.
