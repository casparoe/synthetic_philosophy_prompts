answer: |-
  This is a classic formulation of the **Epistemic Objection to Consequentialism**, often called the "Cluelessness Problem." You have stumbled into one of the deepest trenches in modern moral philosophy. Both friends are arguing competently, but they are leveraging different definitions of what consequentialism *is* and what it is *for*.

  Here is the move-by-move breakdown, followed by an analysis of what is missing and a final ruling.

  ### Move-by-Move Analysis

  **Ruth Move 1:** *The Total Consequences Claim.*
  She argues that consequentialism requires evaluating the *total* causal chain (infinite/unbounded), which is epistemically inaccessible. Therefore, the directive "maximize good" is empty.
  *   **Rating: Right.**
  *   **Justification:** She correctly identifies the standard definition of Act Consequentialism: the right act is the one that *actually* produces the best state of affairs. Since causal chains ripple indefinitely (the "butterfly effect"), no agent can know the total sum. If the theory demands knowledge we cannot have, it fails as a guide.

  **Danny Move 1:** *The Expected Value (EV) Defense.*
  He argues this is just standard uncertainty. We assign probabilities (credences) and maximize Expected Value. Inaction also has unknown consequences ("cluelessness cuts both ways").
  *   **Rating: Questionable.**
  *   **Justification:** This is the standard decision-theoretic response, but it relies on a hidden assumption: that the unknown consequences are symmetrically distributed around zero (i.e., it's equally likely to be good as bad). If there is a systematic bias in the unknown long-term effects, EV calculations fail. He asserts symmetry without proving it.

  **Ruth Move 2:** *The "Unsigned Quantity" Objection.*
  She argues this isn't normal uncertainty (like a die roll); it's structural. We can't even assign a sign (positive/negative) to the long-term tail. Therefore, there is no number to sum, and EV is mathematically incoherent here.
  *   **Rating: Clearly Right.**
  *   **Justification:** This is her strongest point. In decision theory, you cannot calculate an expected value if you cannot define the sample space or the value function. If the long-term impact is potentially infinite or fundamentally unsignable, the math Danny wants to use breaks down. She correctly identifies that "uncertainty" and "undefined" are different categories.

  **Danny Move 2:** *The Truncation & Parity Reply.*
  Reply 1: We only count the near term where evidence is strong. Reply 2: If this blocks action, it blocks harm-prevention too (inaction is an action).
  *   **Rating: Mixed (Reply 1 Questionable / Reply 2 Right).**
  *   **Justification:** Reply 1 is a concession. Limiting the scope to the "near term" changes the theory from Act Consequentialism to "Foreseeable Consequentialism." Reply 2 is logically sound (the "Symmetry Argument"): if cluelessness forbids acting, it also forbids refraining from acting. However, this only proves we *must* choose, not that consequentialism tells us *how*.

  **Ruth Move 3:** *The Theory vs. Procedure Distinction.*
  She points out that truncating the chain (Danny's Reply 1) is a different theory. She concludes consequentialism might be a criterion of rightness but cannot be a decision procedure.
  *   **Rating: Clearly Right.**
  *   **Justification:** She catches him shifting the goalposts. There is a fundamental distinction in ethics between the **Criterion of Rightness** (what makes an act right) and the **Decision Procedure** (how an agent decides what to do). Ruth is correct that if Danny adopts "near-term only," he is no longer defending standard consequentialism; he is defending a proxy theory.

  **Danny Move 3:** *Simple vs. Complicated Cluelessness.*
  He distinguishes between not knowing the *sign* (Simple) vs. not knowing the *magnitude/path* (Complicated). He claims we are usually in the latter, which is manageable.
  *   **Rating: Questionable.**
  *   **Justification:** This is an empirical claim that is highly debatable. In high-stakes systemic interventions (climate policy, existential risk, economic restructuring), we often do not know the sign of the long-term effect. He asserts we are in the "easy case" without evidence.

  **Ruth Move 4:** *The High-Stakes Counter.*
  She argues the cases that matter most are exactly the "Simple Cluelessness" cases (unknown sign).
  *   **Rating: Right.**
  *   **Justification:** Plausible. Complexity and uncertainty correlate with stakes. The more a decision alters the system (which Ruth's original biology analogy highlighted), the less we know about the direction of the outcome.

  ---

  ### What They Are Missing

  **1. The Objective vs. Subjective Distinction (Crucial)**
  This is the main terminological/substantive overlap causing the friction.
  *   **Ruth** is attacking **Objective Consequentialism**: An act is right if it *actually* produces the best outcome. She is right that this is unknowable.
  *   **Danny** is defending **Subjective Consequentialism**: An act is right if it is *reasonable to believe* it produces the best outcome (maximizing Expected Value).
  *   **The Miss:** They are arguing past each other because Danny switches between these two without flagging it. When he talks about "credences," he is talking about Subjective Consequentialism. When Ruth talks about "total difference," she is talking about Objective Consequentialism. Danny needs to admit he is modifying the theory to save it; Ruth needs to acknowledge that Objective Consequentialism is rarely defended as a decision procedure anymore.

  **2. The Correlation Assumption**
  Danny assumes that near-term good correlates with long-term good. He doesn't argue for this; he just truncates the chain. Ruth is right to pounce on this. If near-term good often leads to long-term disaster (a common theme in history), his "near-term" heuristic fails. He is missing a premise: *Why should we trust the near term as a proxy for the total?*

  **3. The Function of the Theory**
  Ruth concludes that if the theory can't guide action, it "isn't doing any work." This misses a potential function of ethical theory. A theory can be a **criterion of assessment** (for judging acts after the fact or from a god's-eye view) without being a **decision procedure** (for guiding agents in real-time). Danny wants it to be a GPS; Ruth is saying it's more like a map of the terrain that we can't fully see. Both can be true.

  ### Terminological vs. Substantive Disputes

  *   **"Uncertainty" (Substantive):** Ruth insists the value is *undefined*; Danny insists it is *unknown*. This is substantive. If the value is undefined, probability theory cannot apply. If it is unknown, probability theory applies. Ruth wins this point mathematically.
  *   **"Consequentialism" (Terminological):** Danny uses the word to cover both "Maximize Actual Good" and "Maximize Expected Good." Ruth insists these are different theories. Ruth is more precise here. In professional philosophy, these are usually distinguished as Objective vs. Subjective Consequentialism.
  *   **"Decision Procedure" (Substantive):** Ruth argues the theory fails because it doesn't tell you what to do. Danny argues the theory succeeds because it tells you to maximize EV. This is a dispute about the *purpose* of normative ethics. Is it to define truth or to guide action?

  ### Final Verdict

  **Ruth is more right overall.**

  Here is why: Danny's defense relies on shifting the definition of consequentialism mid-argument. He starts by defending the standard view ("do the act with the best consequences") but retreats to a subjective, near-term proxy view when pressed. Ruth correctly identifies that this retreat abandons the core commitment of the theory (total consequences).

  Furthermore, Ruth's mathematical objection (Move 2) stands unanswered. Danny asserts we can use Expected Value, but he provides no justification for why the probability distribution of unknown long-term consequences should be symmetric. Without that symmetry, the "cluelessness cuts both ways" argument fails.

  **However,** Danny is practically right about one thing: We must act. Ruth's skepticism is logically sound but practically paralyzing. The most accurate philosophical position—which neither fully articulates—is this: **Objective Act Consequentialism is likely false (or unknowable), but Subjective Expected-Utility Consequentialism is the best decision procedure we have, provided we acknowledge it is a proxy, not the truth.**

  Ruth wins the argument on theoretical rigor. Danny wins on pragmatic necessity, but he owes a better explanation of *why* his modified theory still deserves the name "consequentialism."

  **Advice for the dinner table:** Tell Ruth she won on the definition of the theory, but tell Danny he won on the necessity of action. The solution is to admit that consequentialism is a **criterion of rightness** (Ruth's domain) that we approximate using **expected value heuristics** (Danny's domain), while admitting we are often clueless about whether the approximation holds.
