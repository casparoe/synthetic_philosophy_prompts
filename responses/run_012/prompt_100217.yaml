answer: |-
  You have independently rediscovered one of the most important refinements in non-cooperative game theory. What you are describing is **Strict Dominance by a Mixed Strategy**, and the process you are using is the **Iterative Elimination of Strictly Dominated Strategies (IESDS)**.

  While introductory texts often start by teaching elimination based only on *pure* strategies (one option beating another single option), rigorous game theory defines dominance to include *mixtures* (lotteries) of options.

  Here is the breakdown of the terminology, the resolution to your paradox about the "empty set," and what this implies for rational choice.

  ### 1. The Established Name
  The specific phenomenon you identified—an option being worse than a probability mixture of other options—has a standard name: **Strict Dominance by a Mixed Strategy**.

  *   **Pure Dominance:** Strategy $A$ is strictly dominated if there exists a Strategy $B$ such that $B$ yields a higher payoff than $A$ against *every* opponent move.
  *   **Mixed Dominance:** Strategy $A$ is strictly dominated if there exists a **probability distribution** over Strategies $B, C, \dots$ such that the *expected payoff* of that mixture is higher than $A$ against *every* opponent move.

  The process of removing these options one by one is called **Iterative Elimination of Strictly Dominated Strategies (IESDS)**. The strategies that survive this process are called **Rationalizable Strategies**.

  ### 2. The "Empty Set" Paradox
  You wrote: *"the process can, in principle, keep going until nothing is left, even though I still have to choose something."*

  This is the most critical point to correct: **In a finite game, this is mathematically impossible under strict dominance.**

  If you are finding that your elimination process removes *every* option, one of three things is happening:
  1.  **You are using Weak Dominance:** You are eliminating options that are *equal* to a mixture in some cases and worse in others (rather than strictly worse in *all* cases). Weak dominance is order-dependent and *can* eliminate all strategies, leading to the paradox you fear.
  2.  **The Game is Infinite:** If the strategy space is continuous (e.g., "choose any number between 0 and 1"), it is possible to have no best response, and elimination can theoretically strip everything away.
  3.  **Calculation Error:** In a standard finite matrix game, there is a theorem (often attributed to Pearce, 1984) stating that the set of strategies surviving IESDS is **never empty**.

  **Why the set never empties (in finite games):**
  A strategy survives strict dominance elimination if and only if it is a **Best Response** to some belief about what the opponent might do. In any finite game, a player must have at least one Best Response to any belief. Therefore, there is always at least one strategy that is *not* strictly dominated by any mixture of the others. You will always be left with at least one rational option.

  ### 3. What Is Actually Going On? (The Geometry)
  To understand why a mixture can beat a pure strategy when no single pure strategy can, it helps to visualize the payoffs geometrically.

  Imagine your options are points in space, where the dimensions represent the payoffs against each of the opponent's possible moves.
  *   **Pure Dominance:** Point $A$ is "below and to the left" of Point $B$.
  *   **Mixed Dominance:** Point $A$ lies **inside the convex hull** of points $B, C, \dots$.

  If you can draw a shape (a triangle, tetrahedron, etc.) connecting options $B$ and $C$, and option $A$ falls strictly inside that shape, then $A$ is dominated. You can create a "lottery" between $B$ and $C$ that creates a virtual point hovering directly above $A$.

  **The Rational Interpretation:**
  If a strategy is dominated by a mixture, it means there is **no belief** you could hold about the opponent's behavior that would make that strategy a good choice.
  *   If you thought the opponent would play $X$, you'd prefer $B$.
  *   If you thought the opponent would play $Y$, you'd prefer $C$.
  *   There is no probability weight you can assign to $X$ and $Y$ that makes $A$ the winner.
  Therefore, a rational player who believes the opponent is rational (and thus playing from the remaining set) should never play $A$.

  ### 4. Naming the "Oddity"
  You asked for a name that marks the difference from the ordinary case. While "Mixed Strategy Dominance" is the technical term, if you wish to distinguish it conceptually in your own notes, you might call it:

  **Convex Dominance**
  This highlights that the dominating force is not a single point, but the *convex combination* (the mixture) of other points.

  This distinguishes it from:
  *   **Pointwise Dominance:** One pure strategy beats another.
  *   **Optimization:** Simply picking the highest number (which requires knowing the opponent's move).

  ### 5. Boundary Cases: When Does It Stop?
  You asked when the process stops versus when it consumes everything.

  **Case A: Finite Games (Standard)**
  *   **Stops When:** You reach a set of strategies where every remaining strategy is a Best Response to *some* belief about the opponent's remaining strategies.
  *   **Consumes Everything?** **Never.** There will always be a non-empty "core" of rationalizable strategies. In many games (like Prisoner's Dilemma), this core is a single option. In others (like Rock-Paper-Scissors), no pure strategy is dominated by a mix of the others, so *all* pure strategies survive (though the rational choice is to play a mixed strategy equilibrium).

  **Case B: Weak Dominance (The Danger Zone)**
  *   **Definition:** Option $A$ is *weakly* dominated if a mixture is $\ge$ $A$ in all cases and $>$ in at least one.
  *   **Stops When:** No option is weakly dominated.
  *   **Consumes Everything?** **Yes, it can.** Because weak dominance allows for ties, the order in which you eliminate strategies matters. You can paint yourself into a corner where you eliminate the very strategy that would have saved you. **Advice:** Avoid iterative elimination using weak dominance unless you have a very specific reason; it is not robust.

  **Case C: Infinite Games**
  *   **Stops When:** You reach a closed set of best responses.
  *   **Consumes Everything?** **Yes, it can.** In games with continuous strategies (e.g., auction bidding), it is possible to construct scenarios where for every bid, there is a slightly better bid, leading to an infinite regress where nothing is "undominated."

  ### Summary Advice for Your Puzzles
  1.  **Trust the Mixture:** Your intuition that a lottery can beat a pure option is correct and is a standard part of game theory.
  2.  **Check "Strictly":** Ensure you are only eliminating options that are **strictly** worse (payoff is $>$, not $\ge$) than the mixture in **every** single column.
  3.  **The Non-Empty Guarantee:** If you find yourself eliminating the last remaining option, stop. You have made a calculation error or are using weak dominance. In a finite puzzle, there is always at least one rationalizable move.
  4.  **The Goal:** The goal of this elimination is not to find the *single* best move immediately, but to shrink the game to the set of **Rationalizable Strategies**. Once you have eliminated all dominated strategies (pure or mixed), any strategy remaining is defensible as a rational choice depending on your belief about the opponent.

  You have effectively reinvented the logic of **Rationalizability**. It is a robust method, provided you stick to *strict* dominance in *finite* games.
