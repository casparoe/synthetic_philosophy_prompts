          4.  Gödel Comparison: MU is a "true but unprovable statement" (like Gödel's sentence).
          5.  Moral: Any formal system is incomplete.
          6.  Moral: Thought can transcend systems (JOOTSing).
          7.  Conclusion: A machine trapped inside a formal system could never manage the trick (implying human superiority/AI impossibility).
