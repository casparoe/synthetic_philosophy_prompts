  Commitments 5 and 3 appear to clash because multiple realizability suggests mental kinds aren't physical kinds, threatening closure. However, closure requires only that every physical effect has a physical cause, not that mental kinds map neatly to physical kinds. As long as each instance of a mental property has *some* physical realizer that closes the chain, multiple realizability remains compatible with causal closure.

