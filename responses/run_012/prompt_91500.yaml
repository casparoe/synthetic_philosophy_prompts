  - Real collisions, worst first:
  Commitments 1, 7, and 8 form a tight knot. Commitment 1 asserts mental and physical properties are distinct, while Commitment 8 claims they share identical causal powers. Under Commitment 7 (Causal Realism), causal powers are interest-independent facts about the world. If two distinct properties possess exactly the same real causal powers, they are causally indistinguishable. This renders the distinction in Commitment 1 metaphysically idle, sliding you toward reductionism (if you identify them) or epiphenomenalism (if the mental is just a shadow). Commitment 5 (Multiple Realizability) worsens this: if the mental property inherits powers from varying physical realizers, the mental property lacks a uniform causal profile. To maintain Nonreductive Physicalism, you cannot claim the mental inherits *all* and *only* the realizer's powers without explaining how distinct properties avoid causal redundancy in a realist framework. Severity: 5. Commitment 8 must give.

  Commitment 6 (Interventionism) and Commitment 8 (Causal Inheritance) clash over causal granularity. Interventionism typically allows higher-level variables to be better causes than lower-level ones if they satisfy proportionality—capturing the right amount of detail without micro-noise. However, Commitment 8 insists the mental property adds no powers and loses none relative to the physical realizer. This forces a strict equivalence that undermines the interventionist advantage of citing mental causes. If the powers are identical, an interventionist framework might privilege the physical variable as more fundamental, since the mental variable offers no distinct counterfactual profile. By binding the mental too tightly to the physical via inheritance, you prevent the mental from functioning as an autonomous causal variable in interventionist tests. This weakens Commitment 2 (Mental Causation) by making mental citations merely derivative of physical citations. Severity: 4. Commitment 8 must give.

