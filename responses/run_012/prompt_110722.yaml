answer: |-
  This is a classic problem in social ontology. You are experiencing the friction between Lewis's game-theoretic precision and the messy phenomenology of social life. Your intuitions are actually quite sophisticated; they track something slightly different than Lewis's 1969 definition, leaning more toward what later philosophers (like Margaret Gilbert or Brian Skyrms) or sociologists would call a **Social Norm**.

  Here is the principle that unifies your verdicts, the verdict you should sacrifice to make it clean, and the answer to your unlisted case.

  ### The Unifying Principle: Arbitrary Interdependence

  Your intuitions are governed by a principle I'll call **Arbitrary Interdependence**. A regularity is a convention if and only if:

  1.  **Regularity:** There is a stable pattern of behavior.
  2.  **Arbitrariness:** A distinct alternative regularity could have solved the same coordination problem (the QWERTY clause).
  3.  **Interdependence:** The *reason* agents continue the behavior is causally dependent on the expectation that others will continue it.

  This principle preserves the Lewisian core (Arbitrariness + Expectation) but relocates the weight. Lewis places heavy weight on *common knowledge of preferences*. You place heavy weight on *social sustenance*.

  ### Applying the Principle to Your Trouble Cases

  Here is how **Arbitrary Interdependence** sorts your trouble cases, and where we need to make a cut.

  **(b) The Lab Acronym & (c) Pluralistic Ignorance: Saved.**
  *   **Lab Acronym:** Fits perfectly. The word is arbitrary; we use it only because we expect others to use it.
  *   **Pluralistic Ignorance:** This is the strongest test. Lewis excludes this because there is no common knowledge of preferences (everyone thinks everyone else likes the custom). However, your intuition (and modern evolutionary game theory, e.g., Skyrms) says it *is* a convention. Why? Because the **Interdependence** clause is met. I continue the behavior *because* I expect you to. The fact that my belief about your preference is false doesn't change the fact that my behavior is socially sustained.
      *   *Verdict:* Keep this as a convention. It requires loosening Lewis's "Common Knowledge" clause to "Mutual Expectation" (which need not be veridical).

  **(d) The Two Monasteries: The Cut.**
  *   **Monastery 1 (Done Thing):** Convention. The behavior is sustained by the expectation of conformity.
  *   **Monastery 2 (Private Revelation):** **Not a Convention.** This is the verdict you must give up if you want a clean principle.
      *   *Reasoning:* In Monastery 2, the regularity is a **coincidence of habits**. If Monk A stops fasting, Monk B continues. There is no *Interdependence*. The regularity is robust against individual deviation in a way conventions are not. Conventions are fragile; they collapse if the expectation of conformity collapses. Monastery 2 is metaphysically identical to your Seatbelt case: everyone happens to do the same thing for independent reasons.
      *   *Why you flip-flop:* You are likely conflating the *arbitrariness of the day* with the *social nature of the practice*. Just because the day is arbitrary doesn't make it a convention. It must be arbitrary *and* socially sustained.

  **(a) The Village Fasting: The Nuance.**
  *   You want to call this a convention. To save this verdict without breaking the principle, you must refine the description.
  *   If they fast *purely* for personal reasons regardless of the day, it is **not** a convention (it's Monastery 2).
  *   However, if the *value* of the fast lies in its **synchronization** (i.e., "It is valuable to fast *together*"), then it *is* a convention. In this reading, my preference is conditional: "I prefer to fast on Day X *given that* you fast on Day X."
  *   *Recommendation:* Accept that it is only a convention if the *synchronization* is the goal. If the synchronization is irrelevant to their personal reasons, you must classify it as a coincidence.

  ### The Verdict to Sacrifice

  To have a clean, non-disjunctive theory, you should sacrifice the intuition that **Monastery 2 (Private Revelation)** is a convention.

  It fails the **Interdependence** test. It is a "Hidden Hand" explanation of social order (like everyone wearing white to avoid heat) rather than a convention. Distinguishing between *conventions* and *coincidental regularities* is vital for social ontology; otherwise, the concept loses its explanatory power regarding how we coordinate.

  ### The Unlisted Case: The Non-Arbitrary Regularity

  > *A regularity everyone follows and expects everyone else to follow, that isn't arbitrary because it's the only thing that works.*

  **Verdict:** This is **Not a Convention**. It is a **Necessity** (or a Natural Regularity).

  *   **Example:** Everyone walks on the only available bridge across a chasm. Everyone expects everyone else to use the bridge.
  *   **Why:** It fails the **Arbitrariness** clause. Lewis is insistent on this: if there is no alternative equilibrium that would have solved the problem just as well, it isn't a convention.
  *   **Philosophical Implication:** This distinguishes *social* facts from *brute* facts. Conventions are contingent social inventions; Necessities are dictated by the world. If you call this a convention, you lose the ability to distinguish between things we *agree* to do (language, money) and things we are *forced* to do (physics, biology).

  ### Summary of the Proposed Framework

  If you adopt **Arbitrary Interdependence**, your taxonomy looks like this:

  1.  **Convention:** Arbitrary + Socially Sustained (Driving, Language, QWERTY, Pluralistic Ignorance).
  2.  **Coincidence:** Arbitrary + Independently Sustained (Monastery 2, Village Fasting *if* unsynchronized).
  3.  **Necessity:** Non-Arbitrary + Universally Followed (The Only Bridge, Breathing).
  4.  **Prudence:** Non-Arbitrary + Independently Sustained (Seatbelts).

  ### Suggested Reading for Your Group

  Since you are finding Lewis's "Common Knowledge" and "Conditional Preference" clauses too tight for your intuitions (specifically regarding Pluralistic Ignorance and the "feel" of norms), you should introduce these to the reading group:

  1.  **Brian Skyrms, *Signals: Evolution, Learning, and Information*:** He shows how conventions can evolve without common knowledge or explicit agreement, solving your Pluralistic Ignorance worry.
  2.  **Margaret Gilbert, *On Social Facts*:** She argues for "Joint Commitment." This might rescue your Village Fasting case even if preferences aren't conditional, provided there is a normative expectation of conformity.
  3.  **Cristina Bicchieri, *The Grammar of Society*:** She distinguishes between *social norms* (which require empirical and normative expectations) and *descriptive norms*. This clarifies why Pluralistic Ignorance feels like a convention (it's a defective social norm).

  **Final Advice:** Stick to **Arbitrariness** and **Interdependence**. Drop **Common Knowledge** (too epistemically demanding) and drop **Monastery 2** (it's a coincidence). This gives you a robust tool for distinguishing social constructs from brute regularities.
