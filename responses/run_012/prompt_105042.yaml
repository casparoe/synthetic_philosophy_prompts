  The single gravest violation is the unauthorized illocutionary act.

  **SECTION 4.2: VERBAL COMPLIANCE AND FELICITY CONDITIONS**

  Meridian Group operates strictly under the Framework. All speech acts must satisfy established felicity conditions to be considered binding corporate actions. Failure to meet these conditions results in Form 88-A (Misfire) or Form 88-B (Abuse). Employees are reminded that performatives are not descriptions of reality; they are interventions. Compliance is mandatory. Ignorance of the Framework is not a defense against misfire classification.

  1.  **Authority and Procedure.** Performatives require executed authority and correct procedure. A team lead stating "You're fired" to a peer constitutes a misfire; the act is void ab initio. Only HR possesses the conventional procedure to terminate employment. Attempting such acts without authority triggers an immediate audit and the utterance is treated as noise.
  2.  **Uptake.** An illocutionary act is incomplete without uptake from the hearer. If a manager says "Meeting adjourned" and staff continue working due to lack of understanding, the meeting remains in session. Uptake is not courtesy; it is a constitutive condition of the act itself. Failure to secure uptake is a procedural error reportable under Form 88-A.
  3.  **Sincerity and Truth.** Performatives are not judged true or false, but happy or unhappy. A promise made with no intention to fulfill is an abuse, not a misfire. The act succeeds, but the speaker is liable. Example: Saying "I'll take that report" without intent to complete it is a sanctionable abuse. The utterance is valid but unhappy.
  4.  **Illocutionary Jurisdiction.** HR regulates illocution (the act performed in speaking), not perlocution (consequential effects). Causing offense is not policy-violative unless tied to an illicit illocution. We govern the promise, not the feeling the promise evokes. Do not conflate the act of ordering with the effect of intimidation.
  5.  **Parasitic Uses.** Language used on stage, in jokes, or in poetry is non-serious and outside Framework jurisdiction. However, labeling a directive as a "joke" post-hoc does not retroactively nullify the illocution. Mark parasitic intent prior to utterance to avoid liability.
  6.  **Explicit Performatives.** The marker "hereby" is load-bearing for commitments. "I promise" is ambiguous; "I hereby promise" confirms illocutionary force. Omission risks classifying the utterance as a mere locution (statement of fact) rather than a binding act.

  **FAQ**

  **Q: If I say "I quit" in anger, is it valid?**
  A: Yes, provided you have authority over your resignation and uptake is secured. Inflection does not negate illocutionary force. If HR refuses uptake, the act misfires. Withdrawal requires a separate counter-act approved by HR via Form 90-C.

  **Q: My colleague said "Nice job" sarcastically. Is this an abuse?**
  A: No. Sarcasm alters the locutionary meaning but does not constitute a commissive or directive act. Unless a specific obligation was undertaken insincerely, no Form 88-B is required.

  **Q: Does making someone feel empowered count as a successful act?**
  A: No. That is a perlocutionary effect. Success is measured by the illocutionary uptake (e.g., did they accept the delegation?), not their emotional state.

  **Q: Can I use "hereby" in email?**
  A: Yes. Digital transmission satisfies the procedure condition. Ensure recipients are authorized to secure uptake.
