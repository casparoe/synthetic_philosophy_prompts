      *Let's refine the Top 2 Questions for maximum precision.*
      1.  **The Displacement Question:** When social identity cues are removed, do stylistic cues (fluency, assertiveness) become illicit credibility proxies, and does this constitute a distinct form of injustice?
      2.  **The Intelligibility Question:** In cases of conceptual novelty, where does the burden of translation lie: on the author to clarify, or the reviewer to expand their hermeneutical resources?

      *Why 1 over 2?* 1 is a prerequisite for 2. If the review is biased by style, you can't fairly assess the burden of translation. Also, 1 is more immediate to the "double-blind" decision the committee is likely facing.

