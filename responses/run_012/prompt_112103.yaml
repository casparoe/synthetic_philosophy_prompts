answer: |-
  **To:** Members of the Governing Council
  **From:** [Your Name]
  **Date:** 12 November 2023
  **Subject:** Proposal Regarding Historical Honours and the Truman Scholarship

  **Introduction**
  This memo circulates ahead of Thursday's meeting to clarify my position on the proposal to withdraw President Truman's honours. Having consulted extensively on the moral implications, I recommend we vote against commissioning a historian's report and vote against withdrawing the honours under the current policy. However, I propose we amend the policy wording to reflect the gravity of the ethical challenge raised.

  **The Philosophical Objection**
  My colleague in moral philosophy argues that our draft policy is fundamentally mistaken. The current test asks whether conduct was condemned by a substantial body of informed opinion *at the time*. The objection is that this conflates popularity with morality. When Elizabeth Anscombe protested Oxford's honorary degree for Truman, she did not argue that contemporaries condemned the bombings; she argued that the act itself was intrinsically wrong regardless of contemporary approval.

  On this reading, the decisive factor is the doctrine of double effect. If the deaths of civilians are intended as a means to ending the war, rather than merely foreseen as a side-effect, the act is impermissible. My friend contends that appealing to lives saved is a pseudo-justification that assumes what it must prove. If we accept this, Truman's defence collapses. The bombing was justified only by treating non-combatant death as a cost worth bearing for a greater good. Under this strict moral lens, the honour is untenable.

  **Institutional Consequences**
  While morally rigorous, this test is institutionally destructive. Applied consistently, it would empty our honour roll. Almost any statesman who has waged war can be described in these terms. Churchill, Roosevelt, and countless others authorised strategies where civilian casualties were weighed against military objectives. If we adopt this test, we declare that the College cannot honour any leader who has prosecuted a total war. We must ask whether our honours are meant to recognise moral sainthood or historical leadership. To adopt the philosopher's test is to cease honouring statesmen altogether.

  **The Historian's Report**
  A colleague proposes commissioning a report on whether the bombings shortened the war, the projected casualties of an invasion, and the imminence of surrender. I agree with the philosopher that this is largely a category error. The moral status of intentionally killing non-combatants does not hinge on the efficacy of the act. Even if the bombing saved a million lives, the double-effect objection remains: was the killing intended?

  Furthermore, under our *current* policy, the relevant fact is not what happened, but what was believed by informed opinion at the time. A modern historian's report cannot reconstruct the contemporary epistemic landscape with sufficient fidelity to settle a moral question. Commissioning it would be a mechanism for postponement rather than clarification. We have sufficient material to decide.

  **Recommendation and Policy Amendment**
  I recommend we retain the Truman scholarship and portrait. However, the current policy wording is too rigid in its reliance on contemporary condemnation. It risks insulating us from enduring ethical truths. We should amend the policy to acknowledge that contemporary approval is not decisive, without adopting the radical double-effect test.

  I propose the following amended wording for the policy on historical honours:

  > *An honour may be withdrawn where the conduct in question is incompatible with the College's stated values. In assessing this, the Council shall consider whether the conduct was condemned as gravely wrong by a substantial body of informed opinion at the time. However, reasonable disagreement among contemporaries shall not preclude withdrawal where subsequent ethical consensus demonstrates that the conduct violates fundamental human rights recognised by the College.*

  This preserves the safeguard against presentism while allowing us to act where moral consensus has genuinely shifted, without requiring us to adjudicate complex doctrines of intentionality in historical warfare.

  **Timetable**
  1.  **Thursday's Meeting:** Vote against commissioning the historian's report. Vote against the immediate withdrawal of Truman's honours.
  2.  **Thursday's Meeting:** Vote on the amended policy wording above.
  3.  **Easter Term:** Establish a working group to review all historical honours against the amended policy, ensuring consistency across the College's portfolio.
  4.  **Summer Term:** Publish the working group's findings and any further recommendations.

  **Conclusion**
  We must not shy away from moral scrutiny, but we must not mistake philosophical abstraction for institutional policy. The friend's argument succeeds in showing that contemporary approval is not moral vindication, but it fails to provide a workable standard for a college honour roll. By rejecting the report and retaining the honours while refining our policy, we acknowledge the complexity of history without dismantling our traditions.

  I look forward to discussing this on Thursday.
