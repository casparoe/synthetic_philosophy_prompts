answer: |-
  **Project Title:** Decoding the Divide: Encoding vs. Ciphering in Molecular Biology

  **Proposal**

  Molecular biology is saturated with informational vocabulary. Biologists speak of DNA coding for traits, genes carrying information, and cellular signals transmitting messages. Philosophically, this usage has produced a stalemate. On one side, semanticists argue that genetic information is genuine because the codon–amino acid mapping is arbitrary and fixed by evolutionary history, allowing for misrepresentation. On the other, causalists argue that genes merely carry structural information via correlation, making misrepresentation a category error. This project proposes that this deadlock arises from conflating two distinct notions currently lumped under "code": *encoding* and *ciphering*. Encoding is a physical relation of causal specificity specifiable without reference to users, conventions, or functions. Ciphering is a functional relation that requires a decoding mechanism and a convention that could have been otherwise. The semanticists are pointing to ciphering; the causalists are pointing to encoding.

  The central question of this project is: **In actual biological practice, does the explanatory work attributed to "information" rely on user-independent encoding relations or user-dependent ciphering relations?** This question admits a determinate answer because it shifts the debate from metaphysics to practice. We can examine specific biological mechanisms to see whether the explanation fails if we remove the assumption of a convention-based cipher, or whether a purely causal encoding suffices. The existing literature leaves this open because it treats "information" as a monolithic natural kind to be analyzed from the armchair, rather than a pluralistic toolkit used differently across contexts. By failing to distinguish the structural relation (encoding) from the functional interpretation (ciphering), both camps claim victory on different grounds without testing which ground supports the biological explanation.

  This project argues that the encoding/ciphering distinction is the correct cut because it tracks explanatory utility rather than intuitions about language. A redescription of the semantic/causal divide would merely recapitulate the stalemate. Instead, this distinction allows us to say that DNA physically encodes RNA sequences (causal/structural) but that the translational machinery ciphers those sequences into proteins (functional/conventional). The research will determine if this split holds across diverse phenomena. The methodology combines conceptual analysis with close reading of primary biological literature. I will select four case studies where informational descriptions are prominent: (1) DNA replication error correction, (2) alternative splicing, (3) transgenerational epigenetic effects, and (4) selfish genetic elements. For each, I will reconstruct the explanatory model used by biologists and test whether replacing "information" with "encoding" preserves the explanation, or if "ciphering" (and thus function/convention) is required.

  The timeline for this semester-long project is five months. Month 1 will be dedicated to refining the conceptual framework and selecting specific primary literature for the case studies. Month 2 will focus on the molecular cases (error correction and splicing). Month 3 will cover the evolutionary cases (epigenetics and selfish elements). Month 4 will involve synthesizing the findings into a draft chapter argument. Month 5 will be reserved for revision and feedback from the committee. The deliverable will be a complete draft of the middle dissertation chapter, approximately 8,000 words, suitable for submission to a journal such as *Philosophy of Science* or *British Journal for the Philosophy of Science*.

  Success looks like a determinate mapping: showing, for instance, that error correction relies on encoding (physical mismatch) while selfish elements rely on ciphering (exploitation of translational conventions). Failure conditions include: (1) the distinction collapses because all biological encoding turns out to be function-dependent; (2) the biological practice is too inconsistent to support a general claim; or (3) the distinction proves exegetically useful but philosophically inert. I assess this as a dissertation chapter scope, not a career project. If the distinction holds, it resolves a specific debate; it does not necessarily solve the general problem of biological function. However, if the distinction collapses, it suggests a deeper eliminativism is required.

  This approach is preferable to obvious alternatives. Declaring informational talk merely metaphorical (eliminativism) ignores the fact that information-theoretic models often yield novel predictions and interventions. Conversely, trying to settle the matter by surveying what biologists "really mean" is sociologically naive; biologists use terms instrumentally, and their ontological commitments are often inconsistent. By focusing on *explanatory work* rather than *intent*, this project respects the practice without fetishizing the practitioners' self-conception. The encoding/ciphering distinction offers a way to preserve the utility of informational talk without committing to robust semantic realism where it is unwarranted.

  ***

