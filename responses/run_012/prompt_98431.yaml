      *   *Claim:* "Genetic Code is arbitrary." -> *Translation:* The mapping matrix is not determined by physical chemistry constraints alone; it's a design choice (like ASCII vs. EBCDIC).
      *   *Claim:* "Representation/Aboutness." -> *Translation:* This is the hard one. In IT, a signal doesn't "mean" anything; it just reduces uncertainty. "Meaning" implies a *goal* or a *loss function*.
      *   *Claim:* "Degeneracy is error correction." -> *Translation:* Similar codons map to same amino acids (Hamming distance minimization).

  5.  **Developing the Residue Report:**
      *   *Clean Translations:* Channel capacity, noise, redundancy (degeneracy), mutual information (correlation).
      *   *Distorted Translations:* "Function" (in biology) vs. "Function" (in math). Biological function is historical/teleological; math function is input-output. "Meaning" vs. "Decoding."
      *   *No Counterpart:* Teleosemantics (history of selection), Normativity (errors vs. just variations), The "Privilege" problem (why DNA over environment?).

  6.  **Addressing the "Suspicion":**
      *   Is the talk trivial/confused? Often, yes, when biologists say "information" they just mean "causal influence."
      *   Is the vocabulary impoverished? Yes, IT is syntactic, not semantic. It lacks *normativity* and *history*.
      *   *Synthesis:* The philosophical debate isn't about *transmission* (IT); it's about *interpretation* and *normative status* (Teleosemantics).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's unique position (bridge builder).
      *   **Part 1: The Translation Layer:** Map specific philosophical claims to IT/CT terms.
      *   **Part 2: The Residue Report:** Categorize into Clean, Distorted, and Null.
