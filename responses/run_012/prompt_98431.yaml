      *   *Correction:* Be careful with "Error Correction." In biology, degeneracy *looks* like error correction, but is it *for* error correction? IT assumes a designer optimizing for fidelity. Evolution optimizes for fitness. Sometimes fidelity is bad (evolvability).
      *   *Correction:* The "Arbitrariness" claim. In CT, codes are arbitrary by definition (convention). In biology, there's a debate about stereochemical affinity. This maps to "Physical Layer constraints vs. Logical Layer mapping."
      *   *Key Insight:* The philosophical debate is often about *Teleosemantics*. This requires a "Proper Function" (Millikan). IT has no concept of "Proper Function," only "Actual Function" (input-output mapping).

