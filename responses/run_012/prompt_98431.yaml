      *   *Key Positions:*
          *   *Causal/Correlational View (e.g., Griffiths, Weber):* DNA is just one causal factor among many. Calling it "information" privileges it unjustifiably.
          *   *Semantic/Representational View (e.g., Godfrey-Smith, Maynard Smith):* DNA has content because of the evolutionary function of the translation machinery. It's about something (phenotype).
          *   *The "Code" Debate:* Is the genetic code arbitrary (like Morse code) or chemically determined (Stereochemical hypothesis)? Does degeneracy count as error correction?
          *   *Teleosemantics:* Content is derived from selected effects (function).

  3.  **Translate to IT/CT Vocabulary:**
      *   *Information:* Shannon entropy, mutual information $I(X;Y)$.
      *   *Code:* Mapping $f: \mathcal{X} \to \mathcal{Y}$.
      *   *Channel:* Noisy channel, transition probabilities $P(Y|X)$.
      *   *Redundancy/Error Correction:* Block codes, Hamming distance, parity checks.
      *   *Decoder:* Inference algorithm, Maximum Likelihood Estimation.
      *   *Source:* The genome (or the evolutionary process generating it).
