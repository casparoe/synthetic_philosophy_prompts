answer: |-
  The pattern you describe presupposes a theory of **Statist Functionalism** combined with a **Separation of Spheres** doctrine. This theory posits that moral and legal responsibility in war is divided between the state (which bears responsibility for the *jus ad bellum*, or the justice of going to war) and the individual combatant (who bears responsibility for the *jus in bello*, or the justice of conduct within war).

  Here is the reconstruction of the implicit theory, the distinction between what the practice requires versus what fits it, the explanation of its internal consistency, the implications of shifting to a justice-tracking model, and a reflection on the vulnerabilities of this analysis.

  ### 1. The Implicit Theory: Statist Functionalism
  The current legal regime does not presuppose that ordinary soldiers are morally innocent in a deep metaphysical sense. Rather, it presupposes that they are **institutional instruments**.

  *   **State Responsibility:** The state is the primary subject of international law. Because the state monopolizes the legitimate use of force, the decision to wage war is an act of state policy. Therefore, criminal liability for aggression is confined to leaders who possess the "control over the state" necessary to shape its policy.
  *   **Combatant Privilege as a Convention:** The immunity granted to soldiers is not a reflection of their moral desert (i.e., that they are blameless), but a **functional convention**. It is a reciprocal bargain: if combatants distinguish themselves from civilians and follow the rules of war, they are granted immunity from prosecution for lawful acts of war. This is designed to encourage compliance with *in bello* rules and facilitate the end of hostilities (by allowing soldiers to surrender without fear of execution).
  *   **The Non-State Anomaly:** The prosecution of non-state actors for mere participation reveals that the theory is not purely moral. If immunity were based solely on the epistemic inability to judge the war's justice, rebels fighting a just cause against a tyrant should also be immune. They are not. This confirms that the privilege is tied to **state authorization**, not moral blamelessness.

  ### 2. Excuse vs. Convention: What is Required vs. What Fits
  Does the practice presuppose soldiers cannot judge the cause (epistemic excuse), or that immunity is a convention (status)?

  *   **What the Practice Strictly Requires:** The practice strictly requires only the **conventional theory**. It requires a clear, binary distinction between those authorized by a sovereign state and those who are not. It requires that *jus ad bellum* and *jus in bello* remain legally distinct categories so that a soldier can be tried for a war crime regardless of which side they are on.
  *   **What Merely Fits:** The **epistemic excuse** (that soldiers cannot reasonably be expected to judge the justice of the war) merely *fits* the practice but is not required by it. It is the moral narrative used to justify the convention. The law does not actually inquire into what a specific soldier knew or believed about the war's justice; it grants immunity automatically based on uniform and chain of command. If the law truly relied on the epistemic excuse, it would offer immunity to non-state actors who similarly lack access to intelligence, but it does not.

  Therefore, the implicit theory is that immunity is a **status-based privilege** derived from state sovereignty, not a **right based on moral innocence**.

  ### 3. Consistency: Immunizing the Fight vs. Convicting the Manner
  How can the law immunize soldiers for the war they fight (*ad bellum*) while convicting them for the manner in which they fight (*in bello*)?

  The consistency rests on the **Separation of Spheres**.
  *   **The License to Kill:** In domestic law, a police officer is immune from murder charges when using force in the line of duty, provided they follow procedure. IHL treats state combatants similarly. The "murder" is negated by the state's belligerent right.
  *   **Conditional Immunity:** This immunity is conditional. The state grants the soldier the privilege to kill, but only under the condition that the soldier adheres to the constraints of International Humanitarian Law (distinction, proportionality, necessity).
  *   **The Logic:** If a soldier kills an enemy combatant in accordance with the rules, they are performing a public function authorized by the state. If they kill a prisoner of war or a civilian, they step outside that public function and revert to private criminal liability. Thus, the law is consistent: it immunizes the *institutional act* of warfare while punishing the *deviation* from the institutional rules.

  ### 4. If Liability Tracked the Justice of the Cause
  If we adopted the **Revisionist Just War Theory** (associated with philosophers like Jeff McMahan), where liability tracks moral responsibility for the threat posed, the practice would change radically:

  1.  **Collapse of Moral Equality:** Unjust combatants would lose their right to kill. Their acts of violence would be legally classified as murder or manslaughter, not privileged belligerency.
  2.  **POW Status:** Unjust combatants would likely lose entitlement to Prisoner of War status, as POW status presupposes a right to have participated. They would be treated as criminals.
  3.  **Non-State Actors:** Members of non-state groups fighting a just cause (e.g., against aggression or genocide) would gain combatant privilege, even without state authorization.
  4.  **Epistemic Burden:** Soldiers would be legally required to assess the *jus ad bellum* before fighting. A soldier could argue in court that they did not kill unlawfully because their cause was just, shifting the trial from "Did you follow the rules of engagement?" to "Was your nation's war justified?"
  5.  **Asymmetry:** The laws of war would become asymmetrical. Just combatants might be permitted to take risks that unjust combatants are not, undermining the reciprocal incentives that currently keep violence contained.

  ### 5. Consideration Leading to a Different Verdict
  The consideration most likely to lead me to a different verdict regarding the validity of the current system is the **plight of the non-state actor fighting a just cause.**

  The current system creates a moral absurdity: A soldier fighting for a genocidal state retains combatant privilege (provided they follow *in bello* rules), while a rebel fighting to stop that genocide is prosecutable for the mere act of taking up arms. If one accepts that the ultimate purpose of law is to serve justice, this asymmetry is untenable. It suggests that the current "Statist Functionalist" theory prioritizes **order and sovereignty** over **substantive justice**. If the protection of human rights is elevated above state sovereignty (as seen in the Responsibility to Protect doctrine), the automatic criminalization of non-state participation becomes increasingly difficult to defend.

  ### 6. Exposure to Error
  My reasoning is most exposed to error in **attributing coherence to political compromise.**

  International Humanitarian Law is not a philosophical treatise; it is a treaty regime born of diplomatic negotiation. I have reconstructed a "theory" (Statist Functionalism) to explain the practice, but the practice may simply be the result of **path dependence** and **power politics**. States have no interest in allowing their soldiers to be judged on the justice of the war, but they have a strong interest in suppressing rebellions.
  *   **The Error:** I may be overstating the logical consistency of the *ad bellum/in bello* split. In reality, the distinction is often blurred (e.g., in "Wars of National Liberation" under Additional Protocol I).
  *   **The Risk:** By treating the law as if it seeks a coherent theory of responsibility, I may miss that it seeks a coherent theory of **manageability**. The law may not care about moral responsibility at all; it may care only about what is enforceable. If my analysis assumes a moral logic where only a pragmatic logic exists, my critique of the "Revisionist" alternative may be unduly harsh regarding its feasibility, or my defense of the status quo may be unduly generous regarding its morality.
