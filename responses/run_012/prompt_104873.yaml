answer: |-
  Your hunch holds: "feelings" are private events, but the debate's "aboutness" is a functional relation between organism and environment, not an internal property.

  **Cognitivism (Emotions as Judgments)**
  *Philosophical Claim:* Emotions are evaluative beliefs or judgments about the world (e.g., fear is judging something as dangerous).
  *BA Restatement:* Covert verbal operants (tacts) stating relations between stimuli and reinforcement histories, often rule-governed.
  *Mapping:* **Clean:** Covert verbal behavior fits "judgment" as private speaking; stimulus control accounts for the "object" of the emotion. **Distortion:** "Judgment" implies a homunculus evaluating; BA sees this as behavior shaped by consequences, not an internal act of assent. **No Map:** Propositional content existing independently of behavioral history; the truth-value of the judgment outside its utility in prediction-and-control.

  **Perceptualism (Emotions as Value Perceptions)**
  *Philosophical Claim:* Emotions directly perceive value properties in the environment (e.g., fear is perceiving "dangerousness" like seeing red).
  *BA Restatement:* Discriminative stimuli (SDs) evoking Conditioned Emotional Responses (CERs), where "value" is the function of Motivating Operations (MOs).
  *Mapping:* **Clean:** SDs evoke behavior; MOs alter value effectiveness, matching the "salience" of value. **Distortion:** Perceptualism treats value as an inherent property to be detected; BA treats value as a functional relation between organism and environment. **No Map:** Direct realism of value qualities; the phenomenological claim that value is "out there" waiting to be sensed rather than conferred by reinforcement history.

  **Neo-Jamesian (Emotions as Bodily Feelings)**
  *Philosophical Claim:* Emotions are the perception of physiological changes (e.g., fear is feeling the heartbeat).
  *BA Restatement:* Interoceptive stimuli functioning as SDs or MOs, collateral to respondent conditioning.
  *Mapping:* **Clean:** Private events include interoceptive stimulation; respondent conditioning explains the physiological cascade. **Distortion:** Jamesians claim the feeling *constitutes* the emotion; BA views physiology as collateral products of the organism-environment interaction, not the emotion itself. **No Map:** Qualia as the essence of emotion; the claim that the private feeling is the primary datum rather than a byproduct of public contingencies.

  **Residue Report**
  The residue is phenomenology—the "what it is like" and the intrinsic intentionality (aboutness). Behavior analysis can express the *data* of phenomenology as private events (covert stimuli/responses) under stimulus control. The "aboutness" is not a mental arrow pointing at objects but a history of generalized imitation and tacting relations.

  Is BA missing something real? No. The debate smuggles in mentalist assumptions—specifically, an inner agent (homunculus) that "judges," "perceives," or "feels" as an initiator rather than a locus of variables. When philosophers speak of intrinsic value or non-physical qualia, they are reifying private events into public agents. Your framework captures the functional dynamics they describe (stimulus control, MOs, respondent/operant interplay) without positing an inner theater. The residue isn't missing reality; it's the shadow cast by dualism. Stick to the contingencies; the "feel" is real behavior, but it doesn't get to drive the car.
