answer: |-
  You have stumbled onto one of the oldest and most robust problems in epistemology (the study of knowledge). Your friend is right about the source: this is **David Hume**, specifically from *An Enquiry Concerning Human Understanding* (1748), Section X, "Of Miracles."

  Your friend's summary is Hume's Maxim: *"No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."*

  However, you are also right that Hume's Maxim feels like it pushes the problem around. It doesn't fully explain why you trust the doctor over the hundred strangers, or why lightning twice is believable but lottery twice is not.

  The modern principle that cleans this up is **Bayesian Inference combined with Inference to the Best Explanation (IBE).**

  Here is the principle that gets close to all your verdicts:

  ### The Principle of Competing Explanations
  **Belief is not determined by the rarity of the event alone, but by the ratio of two probabilities:**
  1.  How likely is the report if the event **did** happen?
  2.  How likely is the report if the event **did not** happen (due to error, lie, or illusion)?

  You believe the report only if the "Event Happened" explanation is significantly better than the "Error/Illusion/Lie" explanation.

  Here is how this principle handles your specific cases, including the ones that gave you trouble.

  #### 1. The Doctor vs. The Hundred Strangers
  This is the crux of your confusion. Why trust one expert over a crowd?
  *   **The Doctor:** There is a known mechanism (medical testing, training, institutional oversight). The probability of the doctor saying "You have X" if you *don't* have X (false positive) is low, because medicine has checks. Even if the condition is rare (1 in a million), the *testimony* is backed by a system designed to minimize error.
  *   **The Hundred Strangers:** There is a known mechanism for mass error (optical illusion, rumor, mass hysteria, shared cultural expectation). The probability of 100 people saying "He walked on water" if he *didn't* is actually quite high, because human perception is fragile and rumors spread.
  *   **The Verdict:** The "Error" explanation for the strangers is more probable than the "Physics Broke" explanation. The "Truth" explanation for the doctor is more probable than the "Doctor is Hallucinating/Lying" explanation.

  #### 2. Lightning vs. Lottery
  *   **Lightning:** Being struck twice is statistically rare, but physically mundane. It requires no new laws of physics. The incentive to lie is low (it's not usually profitable).
  *   **Lottery:** Winning twice is statistically rare, but also carries a high **incentive to lie** (status, bragging rights, potential scams).
  *   **The Verdict:** In the lottery case, the "Lie" explanation competes strongly with the "Truth" explanation. In the lightning case, it does not.

  #### 3. The Grainy Video
  *   **Your Verdict:** Moves you almost not at all.
  *   **The Principle:** In the 19th century, a video would be king. In the 21st century, we know CGI and deepfakes are possible. The probability of a "Fake Video" is now high enough that it competes with the "Physics Broke" explanation. Your skepticism is actually scientifically up-to-date.

  ---

  ### What this says about your Sister and the Healer

  This is where the principle gives you the ammunition you need for your argument. You need to separate the **Phenomenon** from the **Mechanism**.

  *   **The Phenomenon:** "My back pain is gone."
      *   **Verdict:** **Believe this.**
      *   **Why:** Back pain often resolves on its own. Placebo effects are powerful and real. The probability that she *feels* better is high. The probability that she is lying about feeling better is low (no incentive to lie to you about pain).
  *   **The Mechanism:** "A healer fixed it with energy/magic."
      *   **Verdict:** **Disbelieve this.**
      *   **Why:** There is no known mechanism for this. The probability of "Natural Remission + Placebo" is vastly higher than "Magic Energy Exists."

  **The Argument:** You tell your sister: *"I believe you. I believe your back feels better. I believe you went there and felt something change. I do not believe that the **cause** was the healer's power. I believe the cause was your body healing itself, possibly helped by the relaxation of the session. You are confusing the **result** (pain gone) with the **explanation** (healer did it)."*

  This validates her experience (which makes her less defensive) without accepting the woo-woo claim.

  ---

  ### The One Verdict to Throw Out

  If I have to choose one of your verdicts that is inconsistent with a rational framework, it is this one:

  > **"My doctor says I have a condition that affects about one person in a million. I believe him pretty much straight away."**

  **Why you should throw this out:**
  This is a classic instance of the **Base Rate Fallacy**.

  If a condition affects 1 in 1,000,000 people, and the doctor uses a test that is 99% accurate (which is a very good test), and the test comes back positive... **you still probably don't have the condition.**

  *   Imagine 10 million people get tested.
  *   10 of them actually have the disease (1 in 1M).
  *   The test catches 10 of them (True Positives).
  *   But the test has a 1% error rate. So, out of the 9,999,990 healthy people, roughly 100,000 will get a False Positive.
  *   So you have 100,010 positive results. Only 10 are real.
  *   Your chance of actually having the disease is roughly **0.01%**, even with a "positive" doctor's report.

  **Why this matters for your argument:**
  You shouldn't believe the doctor "straight away." You should believe the doctor *enough to order a confirmatory test.*

  If you accept the doctor's word immediately on a 1-in-a-million claim, you are being inconsistent. You are accepting an extraordinary claim based on authority. To be consistent with your skepticism about the healer, you should say to the doctor: *"That is incredibly rare. What is the false positive rate on this test? Should we run it again or get a second opinion?"*

  **The Lesson:**
  The difference between the Doctor and the Healer isn't that the Doctor is infallible. It's that the Doctor operates within a system that **expects** error and has a protocol for correcting it (second opinions, confirmatory tests). The Healer operates in a system where "faith" replaces verification.

  If you adjust your Doctor verdict to *"I believe the test result, but I remain skeptical of the diagnosis until confirmed,"* your entire framework becomes solid. You can then tell your sister: *"I treat my doctor's rare diagnosis with skepticism until it's proven. I have to treat your healer's claim the same way. I believe you feel better, but I need more than testimony to believe the magic caused it."*
