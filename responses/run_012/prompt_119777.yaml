      *   *Flatmate Check:* Does it look like redescription? The move to "rational availability of uptake" as the truth-maker for standing, rather than "uptake happens," protects against the "wrongdoer decides everything" objection. It grounds standing in objective reasons, not subjective whims, while keeping it relational.
      *   *Reformed Wrongdoer:* Ensure the distinction between hypocrisy (current violation) and reformed status (past violation, current alignment) is clear.
      *   *Praise:* Keep it brief but distinct.
      *   *Formatting:* Standard philosophical paper structure (Intro, Arguments, Objections, Conclusion).

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Section 4, I initially thought about "Potential Standing." But the prompt says "no fact of the matter... independently." I need to be careful not to smuggle the orthodox view back in.
      *   *Solution:* Define Standing as a *relational normative status*. It is like "being married." You aren't married just because you want to be (A's permission), nor just because the other says yes (B's whim). It requires a valid ceremony (rational conditions). If A is hypocritical, the ceremony is invalid (rationally unavailable). If B stonewalls, the ceremony is refused. In both cases, the status (marriage/standing) doesn't exist. But the *reasons* differ. The view holds: Standing is the *successful constitution* of the relationship. The "Hostage" objection confuses the *conditions* for constitution with the *power* to constitute. B cannot constitute it unilaterally, but B can block it. However, if B blocks it *unreasonably*, we criticize B, but we still admit standing wasn't constituted. This preserves the core insight without making it arbitrary.
