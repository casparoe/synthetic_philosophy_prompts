          *   Crucial distinction: *Rational Availability* vs. *Psychological Acceptance*. Standing exists if uptake is *rationally available*, not just if it psychologically occurs. This saves the view from the "stonewaller" reductio. A hypocrite makes uptake *rationally unavailable*. A stonewaller makes uptake *psychologically absent* despite rational availability.
