answer: |-
  **Standing as Constituted: An Uptake-Based Account of Blame**

  **1. Introduction**

  The standard orthodoxy regarding the standing to blame treats it as a normative property inherent to the blamer. On this view, standing is a permission or a power that an agent possesses independently of the specific interaction in which they engage. When a hypocrite blames, the orthodox explanation is that they possess the relevant moral knowledge and the target has indeed done wrong, yet the hypocrite lacks the *authority* to enforce the demand. Their standing is defeated, waived, or forfeited. The intuition is that the hypocrite *cannot* blame, in much the same way a judge cannot sentence a defendant if the judge is themselves guilty of the same crime.

  This paper argues that this orthodoxy misidentifies the locus of the normativity. There is no freestanding fact of the matter about whether an agent has standing to blame prior to the communicative exchange. Standing is not a permission the blamer holds; it is a relational status constituted by the uptake of the addressee. Specifically, I distinguish between *thin uptake* (registering the content of the criticism) and *thick uptake* (accepting the criticism as an authoritative address that generates reasons for answerability). My thesis is that standing tracks only thick uptake. Hypocrisy does not defeat a pre-existing permission; rather, it renders thick uptake rationally unavailable to the addressee.

  This shift from a blamer-centric to an interaction-centric model avoids the charge of mere redescription by altering the normative implications of the puzzle. It explains the persistence of the "cannot" intuition without positing a metaphysical disability, accounts for the enhanced standing of the reformed wrongdoer, clarifies the asymmetry between blame and praise, and withstands the objection that it makes standing hostage to the wrongdoer's will.

  **2. The Illusion of Defeated Permission**

  The primary charge against an uptake-based view is that it merely redescribes the phenomenon: saying "A lacks standing" is functionally identical to saying "B cannot rationally grant A authority." If the outcome is the same (the blame fails to land), what work is the ontology doing?

  The work is in explaining *why* the blame fails and where the normative defect lies. On the orthodox view, the defect is in the blamer (A). A is silenced. On the uptake view, the defect is in the *rational landscape of the interaction*. The intuition that the hypocrite "cannot" blame is persistent not because A lacks a metaphysical power, but because the communicative act of blame has a telos: the recognition of shared normative standards and the restoration of moral relations.

  Blame is a demand for accountability. For a demand to be authoritative, the demander must represent the norm they are enforcing. When A is a hypocrite, A's representation of the norm is pragmatically self-defeating. If B grants thick uptake to A, B treats A as an authoritative representative of the norm. But A's own conduct demonstrates a rejection of that norm. For B to accept A's authority is for B to endorse a contradiction: that A simultaneously upholds and violates the norm in a way that grants authority.

  Therefore, the "cannot" is not a deontic prohibition on A (A is not forbidden to speak), nor is it a metaphysical impossibility. It is a rational impossibility for B. Thick uptake is rationally unavailable because granting it would require B to suspend rational coherence regarding the norm's authority. The orthodoxy says A is disarmed; the uptake view says the *bridge* cannot be built. This explains why hypocritical blame feels offensive rather than merely invalid. It offends B's rational agency by demanding an uptake that B cannot rationally give. We criticize the hypocrite not because they violated a rule of standing, but because they initiated a communicative act that they knew (or should have known) placed the addressee in a position of rational conflict.

  **3. The Reformed Wrongdoer**

  A robust theory of standing must handle the case of the reformed wrongdoer. Consider A, who previously committed wrong X, but has since repented, changed their behavior, and now blames B for committing X. Intuitively, A does not lack standing here; in fact, A often seems to have *more* standing than a blamer who has never faced the temptation of X.

  The orthodox view struggles here. It must argue that reformation restores the forfeited permission. But this raises the question: why does the past violation not count against them in the same way hypocrisy does? If standing is a status A holds, the scar of past wrongdoing should arguably diminish it, not enhance it.

  The uptake view predicts the enhancement naturally. Thick uptake depends on the addressee's recognition of the blamer's authority. Authority in moral contexts is not merely a function of purity; it is a function of *credibility* and *solidarity*. A reformed wrongdoer offers epistemic privilege: they understand the gravity of the wrong and the difficulty of adherence from the inside. When A blames B, A is not saying "I am above this norm," but "I am bound by this norm, and I know the cost of binding."

  This makes thick uptake *more* rationally available, not less. B has stronger reasons to accept A's address because A's testimony carries the weight of experience coupled with current commitment. The reformed wrongdoer facilitates the constitution of standing. Where the hypocrite makes uptake rationally costly (by forcing B to ignore A's violation), the reformed wrongdoer makes uptake rationally rewarding (by offering B a model of accountability).

  This is not a bolted-on special case. It follows directly from the definition of standing as constituted by thick uptake. If standing tracks the rational availability of uptake, and reformation increases the rational reasons for uptake, then standing is robustified. The view captures the intuition that moral authority is earned through the struggle with norms, not merely through untouched purity.

  **4. The Asymmetry of Praise**

  Does this machinery apply to praise? If standing is constituted by uptake, does a hypocrite lack the standing to praise? The intuition suggests an asymmetry: hypocritical blame is intolerable, but hypocritical praise is merely hollow or ironic, not normatively blocked. A hypocrite can tell you "You did well," and while their judgment might be weighted less heavily, they are not "silenced" in the same way.

  The uptake view explains this asymmetry through the different constitutive aims of blame and praise. Blame is a *demand*. It seeks to bind the addressee to an account. Thick uptake in blame involves submitting to an authority that holds one accountable. This requires the blamer to have a specific normative relation to the norm (representation). Hypocrisy severs this relation, making the demand illegitimate.

  Praise, however, is a *gift* of recognition. It does not demand answerability; it confers value. Thick uptake in praise involves accepting the valuation, not submitting to an authority. While sincerity matters for praise, the authority condition is weaker. A hypocrite praising a good deed is not demanding that the addressee submit to a norm the hypocrite violates; they are acknowledging a value. The addressee can accept the valuation ("Yes, I did well") without needing to grant the blamer authority over their moral conduct.

  Thus, the asymmetry falls out of the nature of the speech act. Blame requires the constitution of an authority relation (which hypocrisy blocks). Praise requires the constitution of a recognition relation (which hypocrisy may devalue but does not block). If standing is the successful constitution of the relevant relation, then standing is harder to constitute in blame than in praise. This confirms the utility of the uptake model: it locates the difference in the *conditions for uptake*, not in the properties of the speaker.

  **5. The Hostage Objection**

  The most serious objection to the uptake view is that it makes standing hostage to the guilty party's willingness to listen. If standing is constituted by B's thick uptake, then B can nullify A's standing simply by refusing to engage. A morally righteous blamer could be stripped of standing by a stubborn, irrational, or evil addressee who refuses to grant authority. This smells like a reductio: it implies that wrongdoers have the power to "unblame" themselves by stonewalling.

  To meet this objection, we must distinguish between the *psychological occurrence* of uptake and the *rational availability* of uptake. My thesis is not that standing requires B to *actually* submit, but that standing consists in the *rational availability* of thick uptake.

  Standing is a normative status, not a psychological one. If A is non-hypocritical and correct, the reasons for B to grant thick uptake are objective and binding. If B refuses uptake, B is not exercising a power to negate A's standing; B is failing to recognize a standing that is *eligible* to be constituted. In this case, the fault lies with B's irrationality, not with the absence of standing.

  However, we must bite a specific bullet here: on this view, if B is irrational, standing is not *actualized*. Does this let B off the hook? No. It shifts the normative focus. On the orthodox view, A has standing and B is wrong to ignore it. On the uptake view, A has *standing-eligibility* (the conditions for rational uptake are met), but the relational status of standing is not instantiated because B has broken the circuit.

  Why is this not a reductio? Because it accurately reflects the fragility of moral accountability. Accountability is not a monologue; it is a dialogue. If the addressee refuses to participate in the moral community (by refusing uptake), the community cannot hold them accountable *through that channel*. The blamer's authority is not a weapon they can fire unilaterally; it is an invitation to a normative relationship.

  The objection assumes that standing ought to be a property that survives the addressee's rejection. But if blame is essentially communicative, its success conditions must include the possibility of communication. The hypocrite makes communication rationally impossible. The stonewaller makes it volitionally impossible. In both cases, standing (as an actualized relational status) fails to obtain. The difference is that in the stonewalling case, we criticize B for failing to actualize it. In the hypocrisy case, we criticize A for making it impossible to actualize.

  This preserves the core insight without making standing arbitrary. Standing is not hostage to B's *whim*, but to B's *reasons*. A cannot force standing into existence, but A can ensure the reasons for uptake are present. If A does so, and B still refuses, A has done their part, even if the relational status of standing remains unconstituted. This nuance protects the view from the charge that it empowers the wrongdoer; it merely acknowledges that moral authority is inherently relational and cannot be forced upon an unwilling agent without ceasing to be authority and becoming coercion.

  **6. Conclusion**

  The orthodox view of standing treats it as a credential the blamer carries in their pocket, which hypocrisy causes them to drop. This paper has argued that standing is not a credential but a connection. It is constituted by the thick uptake of the addressee, which is the recognition of the blamer's authority to hold them to account.

  This view earns its conclusion by doing explanatory work the orthodoxy cannot. It explains the "cannot" of hypocritical blame as a rational blockage for the addressee rather than a deontic silencing of the blamer. It predicts the enhanced standing of the reformed wrongdoer based on the increased rational availability of uptake. It derives the blame/praise asymmetry from the different uptake conditions of demands versus gifts. Finally, it withstands the hostage objection by distinguishing between the rational availability of standing and its psychological actualization.

  By locating standing in the interaction rather than the agent, we see that the problem with hypocrisy is not that the hypocrite is forbidden to speak, but that they have made themselves unfit to be heard. This preserves the moral seriousness of blame while acknowledging its inescapably communal nature. Standing is not something we have; it is something we build together, and hypocrisy is the sabotage of the construction site.
