      *   *Exclusion Restriction?* In IV (Instrumental Variable) terms, the exclusion restriction says the instrument affects the outcome *only* through the treatment. Here, the "channel" (text) is supposed to be the only path. ESP creates a second path. This is close.
      *   *Side Channel / Leakage?* This is the strongest fit in info-sec/experimental terms. The protocol assumes a closed system. ESP opens a side channel. The interrogator gets data they shouldn't have.
