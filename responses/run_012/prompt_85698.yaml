      *   The procedure needs to explicitly ask: "Does this replicate the Neolithic Trap?" (i.e., more work for same/better calories but higher risk).

  13. **Finalizing the Steps:**
      1.  **The Surplus Test:** Who keeps the gain? (Hierarchy)
      2.  **The Time/Drudgery Test:** Is the labor burden sustainable? (Bad Backs)
      3.  **The Fragility Test:** Does failure mean ruin? (Famine)
