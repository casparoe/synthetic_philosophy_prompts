      *   **Problem:** A trustee (former epidemiologist, skeptical, data-driven) challenged the fundamental premise of agricultural development using the "Agricultural Revolution was a mistake" argument (James C. Scott/Diamond style).
      *   **Specific Challenge:** Farming might just increase population density without increasing individual welfare (hierarchy, famine, labor). Metrics might be measuring the wrong thing (total output vs. individual well-being).
      *   **Constraints:** Needs a decision procedure runnable in 30 minutes, using only proposal data + existing knowledge. No new research/PhD. Must handle the "romantic forager" critique without buying into the romantic version.
      *   **Deliverables:**
          1.  A step-by-step decision procedure (tests, pass/fail criteria, escalation points).
          2.  Apply procedure to Case 1 (Solar Irrigation: yields up, labor up, kids out of school). *User wants this to pass.*
          3.  Apply procedure to Case 2 (Women's Cooperative: income up, debt/land risk, oligopsony).
          4.  Critique of the procedure (where it hides values, what flips the verdict, where to defer to the board).

  2.  **Deconstruct the Trustee's Argument:**
      *   *Premise 1:* Foragers had more leisure/better health.
      *   *Premise 2:* Farming created hierarchy/famine.
      *   *Premise 3:* Farming only increased population, not welfare.
      *   *Implication for Foundation:* Are we just creating more poor people or locking them into exploitative systems?
      *   *Counter-argument needed:* We aren't trying to return to foraging. We are trying to improve the lives of *existing* farmers who cannot exit agriculture. The goal isn't "inventing farming" but "improving current farming."
      *   *Key Metric Shift:* Move from "Yield/Production" (Malthusian trap) to "Discretionary Time/Resilience/Agency" (Welfare).

  3.  **Drafting the Decision Procedure (The "Welfare Trap" Test):**
      *   *Goal:* Filter out projects that increase production at the cost of welfare (the trustee's fear) while allowing projects that increase resilience/agency (the foundation's goal).
      *   *Time Limit:* 30 mins.
      *   *Inputs:* Proposal doc + PM's local knowledge.
      *   *Structure:* 4 Filters.
          1.  **The Exit Option Test:** Does this lock them in or keep options open? (Addresses hierarchy/dependency).
          2.  **The Leisure/Time Test:** Does this increase total labor burden disproportionately? (Addresses the "bad backs/15-hour week" critique).
          3.  **The Resilience Test:** Does this increase fragility (famine risk)? (Addresses the "famine" critique).
          4.  **The Distribution Test:** Who captures the surplus? (Addresses the "hierarchy" critique).
      *   *Escalation:* If a test fails, is it a hard no or a board question?

  4.  **Refining the Tests (incorporating the "User wants Case 1 to pass" constraint):**
