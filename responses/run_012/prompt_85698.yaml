      *   Exit: Land collateral means they lose land if it fails. No exit.
      *   *Verdict:* Hard No.

  8.  **Critiquing the Procedure:**
      *   Where is the hidden value? Probably in how we weigh "Time" vs. "Income."
      *   What flips the verdict? For Case 1, if school attendance is protected. For Case 2, if debt is removed.
      *   Where to defer to Board? When the trade-off is explicitly intergenerational (school vs. income).

  9.  **Refining the Output Tone:**
      *   Professional, direct, no fluff.
      *   Acknowledge the trustee's point (it's valid in the long arc, but we deal with the short arc).
      *   Ensure the "30-minute" constraint is met (simple heuristics).

  10. **Self-Correction on Case 1:** The user *wants* it to pass. If I say it fails, they might reject the whole framework. I need to find a defensible way for it to pass *if possible*.
      *   *Argument:* Seasonal labor spike vs. permanent poverty. If the alternative is starvation during dry season, school during harvest might be a tragic trade-off families *choose* for survival.
      *   *Procedure Tweak:* Differentiate between "Drudgery" (water carrying) and "Harvest Labor." If the solar pump removes water-carrying drudgery (usually women/children), but harvest requires hands, the *net* burden might be lower or differently distributed.
      *   *Wait, prompt says:* "raises the labour each household has to put in."
      *   *Okay, I will be honest.* If the procedure is robust, it must flag child labor. I will tell the user: "Here is where it fails. Here is how you fix it to make it pass." This is more helpful than rigging the test.
