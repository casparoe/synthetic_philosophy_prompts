answer: |-
  Here is a decision procedure designed to answer the trustee's specific challenge without requiring new research. It translates the "Agricultural Revolution was a mistake" critique into four operational filters.

  ### The "Welfare Trap" Filter
  **Time required:** 20–30 minutes.
  **Inputs:** Proposal document + your existing country/sector knowledge.
  **Premise:** We are not trying to invent agriculture (the trustee's historical critique); we are trying to prevent *current* farmers from falling into the "Neolithic Trap" (more work, higher risk, captured surplus). We measure success by **per-capita resilience and agency**, not total production.

  Run these four tests in order. If a test fails, follow the instruction (Stop, Mitigate, or Escalate).

  #### Test 1: The Surplus Capture Test (Addresses "Hierarchy")
  *   **The Question:** Of the new value generated (yield or income), what percentage is captured by the household versus intermediaries (input sellers, lenders, buyers)?
  *   **The Threshold:** The household must retain >50% of the *marginal* gain after all new costs (inputs, loan interest, fees).
  *   **Why:** If intermediaries capture the surplus, you are funding a supply chain, not smallholder welfare. This replicates the hierarchy critique.
  *   **Fail Condition:** <50% retention. **Hard No.** (Do not fund extractive value chains).
  *   **Pass Condition:** >50% retention. Proceed.

  #### Test 2: The Time-Drudgery Test (Addresses "Bad Backs/15-Hour Week")
  *   **The Question:** Does the project increase total labor hours, and if so, is that labor *drudgery* (survival maintenance) or *investment* (asset building/harvest)?
  *   **The Threshold:**
      *   If labor decreases: **Pass.**
      *   If labor increases: You must identify a specific reduction in *drudgery* (e.g., water fetching, weeding) that offsets the increase, OR the income gain must be >2x the local daily wage rate for the extra hours.
  *   **Why:** Farming became a "mistake" when labor inputs rose without commensurate caloric/leisure returns. We cannot fund projects that simply intensify poverty labor.
  *   **Fail Condition:** Labor increases, drudgery remains high, income gain is marginal. **Hard No.**
  *   **Escalation Condition:** Labor increases significantly during critical periods (harvest/planting) affecting dependents (children/elderly). **Board Question.** (This is a values trade-off between immediate income and long-term capability).

  #### Test 3: The Fragility Test (Addresses "Famine")
  *   **The Question:** If the intervention fails (drought, price crash, pump break), does the household lose a productive asset (land, livestock) or fall into irreversible debt?
  *   **The Threshold:** Failure must result in a *recoverable* loss (e.g., lost season income), not an *existential* loss (land forfeiture, distress sale of breeding stock).
  *   **Why:** The agricultural revolution introduced systemic famine risk. We fund resilience, not roulette.
  *   **Fail Condition:** Collateral includes land or essential productive assets. **Hard No.**
  *   **Pass Condition:** Losses are limited to cash flow or non-essential assets. Proceed.

  #### Test 4: The Option Value Test (Addresses "Lock-in")
  *   **The Question:** Does this intervention make it harder or easier for the household to exit farming or switch crops in 5 years?
  *   **The Threshold:** The intervention must not create high switching costs (e.g., specialized equipment, monoculture soil degradation, exclusive contracts).
  *   **Why:** The trustee's point is that farming locked us in. We must ensure we aren't locking *these* farmers in.
  *   **Fail Condition:** Exclusive buyer contracts or asset specificity that prevents crop switching. **Hard No.**
  *   **Pass Condition:** Assets are multi-use or contracts are non-exclusive. Proceed.

  ---

  ### Case Application

  #### Case 1: Solar Irrigation (Yields up, Labor up, Kids out of school)
  *   **Test 1 (Surplus):** Household keeps the yield. **Pass.**
  *   **Test 2 (Time/Drudgery):** Labor increases. Solar removes fuel/water fetching drudgery, but harvest labor spikes. The critical flag is "older kids vanished from school." This is not just labor; it is capability destruction.
      *   *Result:* **Escalation.** The procedure flags this as a Board Question. It is not a Hard No, but you cannot recommend it as "unqualified welfare."
  *   **Test 3 (Fragility):** Solar is an asset. If it breaks, they lose the season, not the land. **Pass.**
  *   **Test 4 (Option Value):** Irrigation allows *more* crop choices, not fewer. **Pass.**

  **Verdict:** **Conditional Pass / Board Escalation.**
  You wanted this to pass. The procedure allows it to pass *only if* you explicitly frame the child labor issue as a trade-off the Board must accept.
  **Where it happened:** Test 2.
  **How to make it pass cleanly:** You must add a mitigation line item to the grant (e.g., funding seasonal labor hires or school catch-up programs) that removes the need for child labor. If the proposal includes that mitigation, it passes Test 2. If not, you must tell the Board: "This increases income at the cost of education. I recommend funding only if we mandate labor mitigation."

  #### Case 2: Women's Cooperative (Export crop, Debt-financed, Land collateral, 2 Buyers)
  *   **Test 1 (Surplus):** Income up on paper, but debt service is high. Likely fails the >50% marginal gain threshold once risk is priced in. **Fail/Hard No.**
  *   **Test 2 (Time/Drudgery):** Export crops are usually labor intensive. Not enough info, but irrelevant because Test 3 fails.
  *   **Test 3 (Fragility):** Inputs are debt-financed with **land as collateral**. If the crop fails or buyers collude on price, they lose their land.
      *   *Result:* **Hard No.** This is the definition of the "Famine/Hierarchy" trap. You are funding a mechanism for land consolidation.
  *   **Test 4 (Option Value):** Two buyers = Oligopsony. Specialized export crop = hard to switch. **Fail.**

  **Verdict:** **Hard No.**
  This proposal is exactly what the trustee is worried about. It increases population-level output (maybe) while increasing individual fragility and hierarchy.

  ---

  ### Critique of the Procedure

  **1. Where is the procedure hiding a value judgment?**
  **Test 2 (The Time-Drudgery Test).**
  This step pretends to be neutral arithmetic, but it implicitly values *leisure/education* over *income*. A pure utilitarian might argue that if the kids working brings in enough money to feed the family *now*, school is a luxury. By flagging child labor as an "Escalation" rather than a "Pass," I am baking in a specific development theory (Human Capital > Short-term Cash).
  *   **The Risk:** You are assuming the Board agrees that school is more important than harvest income. In a famine year, they might not.

  **2. What single consideration would flip the verdicts?**
  *   **Case 1:** If the proposal included a **mechanized harvester** or budget for **seasonal labor hires**. This removes the child labor constraint, turning the "Escalation" into a clean "Pass."
  *   **Case 2:** If the debt was **removed** (grant-funded inputs) or the collateral was **group-guaranteed** rather than land-backed. If the women risk their *social capital* rather than their *land*, Test 3 passes.

  **3. Where should you defer to the Board?**
  **Case 1, Test 2.**
  Do not dress up the child labor trade-off as a technical test result. This is a moral hazard.
  *   **Say this:** "The economic return is positive, but the labor burden shifts to children during harvest. The framework flags this as a values decision: Do we prioritize immediate household caloric security or long-term educational capability? I recommend funding *with* a labor mitigation clause, but the Board must own the risk if mitigation fails."

  **Summary for your Trustee:**
  Tell her: "We are not funding the Agricultural Revolution. We are funding the *Exit Option*. If a project locks a farmer into debt, land loss, or drudgery without surplus, we reject it. If it increases resilience and agency, we fund it. We measure welfare, not yield."
