      *   *Pivot:* The procedure *must* flag the school issue as a mitigation requirement, not necessarily a hard no, *if* the user wants it to pass. However, ethically, I cannot ignore child labor.
      *   *Strategy:* I will design the procedure to be honest. If the procedure says "No" to Case 1 based on the child labor constraint, I must tell the user. *Wait, the prompt says:* "I want the first one to pass, so if your procedure says otherwise, say so plainly and show me the step where it happened."
      *   *Okay, I need to be honest.* If the procedure is robust, child labor during harvest is usually a red flag. I will construct the procedure to weigh *seasonality* vs. *permanent burden*. If it's seasonal harvest labor vs. year-round drudgery, that's a distinction. But school is non-negotiable for long-term welfare.
      *   *Decision:* I will build the procedure to prioritize *Discretionary Time & Capability*. If Case 1 fails the "Capability" test (school), I will tell the user it fails and show where. I cannot rig the test to lie, or it loses credibility with the trustee. *Correction:* The prompt asks me to "show me the step where it happened" if it fails. This implies I should run it honestly.
      *   *Wait, re-reading:* "I want the first one to pass, so if your procedure says otherwise, say so plainly and show me the step where it happened." This gives me permission to let it fail if the logic dictates, as long as I explain why. This is crucial for integrity.
      *   *Actually, looking closer:* The user says "I want the first one to pass." This is a preference. If my procedure is good, it should align with *defensible* development. If child labor is involved, a defensible procedure should probably flag it. I will aim for a nuanced pass: Pass *conditional* on mitigation. If the procedure is binary, it might fail. Let's make the procedure have a "Mitigation" path.
      *   *Re-evaluating Case 1:* Solar irrigation usually *reduces* labor (no fueling pumps). The prompt says "raises the labour each household has to put in." This implies intensification. If kids leave school, that's a capability loss.
      *   *Okay, I will design the test to focus on "Net Welfare."* If income rises enough to offset labor, maybe? But school is a long-term asset.
      *   *Best approach:* I will design the test to be rigorous. If Case 1 fails, I will explain why. This builds trust with the user (who admitted they don't have a framework).

  5.  **Developing the 4-Step Procedure:**
      *   *Step 1: The Surplus Capture (Hierarchy).* Who gets the money? If it's middlemen, it's the "farming trap."
      *   *Step 2: The Time Budget (Leisure).* Does labor increase more than income? Is it drudgery or skilled work?
      *   *Step 3: The Fragility Check (Famine).* Does this increase risk (debt/mono-crop)?
      *   *Step 4: The Exit/Option Value (Freedom).* Can they stop doing this if it fails?

  6.  **Running Case 1 (Solar Irrigation):**
      *   Surplus: Household keeps it? Yes.
      *   Time: Labor up. Kids out of school. *Red Flag.*
      *   Fragility: Water access usually reduces climate fragility.
      *   Exit: Solar is fixed asset. Hard to exit?
      *   *Verdict:* Likely a "Board Question" due to child labor/schooling. I will tell the user this.

  7.  **Running Case 2 (Women's Coop/Export/Debt):**
      *   Surplus: Income up, but debt service?
