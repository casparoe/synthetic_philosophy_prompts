answer: |-
  This is a classic Thanksgiving dinner debate. Your brother-in-law has reconstructed a famous line of criticism against the philosopher John Rawls, specifically from his book *A Theory of Justice* (1971). The argument he presented is designed to show that Rawls's theory leads to absurd, overly demanding conclusions (like you not being allowed to buy a latte).

  However, your brother-in-law has set up a "straw man." He has presented a version of Rawls that is more extreme than what Rawls actually argued.

  If you want to keep premises (1) and (2)—which are the heart of Rawls's "Original Position" and "Veil of Ignorance"—you should reject **Step (6)**.

  Here is the breakdown of why Step (6) is wrong according to Rawls, and what you "lose" by rejecting it.

  ### Why Step (6) is the Flaw

  Step (6) says: *"So we're required to keep redistributing until the worst off are as well off as possible, even if it costs liberty, efficiency, or people's personal projects."*

  This step contradicts two fundamental pillars of Rawls's actual theory. If you point these out, the argument falls apart without you having to give up the "Veil of Ignorance" ideas in (1) and (2).

  #### 1. The Priority of Liberty
  Rawls does not have just one principle of justice; he has two, and they are ordered.
  *   **The First Principle:** Everyone has an equal right to the most extensive basic liberties compatible with similar liberties for others (free speech, voting, freedom of conscience, etc.).
  *   **The Second Principle:** This is where the "Difference Principle" (helping the worst-off) lives. It deals with money, power, and social status.

  **The Rule:** You cannot trade away the First Principle to satisfy the Second. You cannot reduce someone's freedom of speech or right to vote just to make the poor slightly richer.

  Step (6) claims we should redistribute "even if it costs liberty." Rawls explicitly says **no**. A just society protects basic freedoms first. Economic gains for the poor never justify violating basic rights.

  #### 2. The "Basic Structure" vs. Individual Choices
  Rawls argues that justice applies to the **basic structure of society** (the constitution, the legal system, the economic framework), not to every individual transaction.

  *   **Rawls's View:** We design the *rules of the game* to help the worst-off (e.g., progressive taxation, public education, equal opportunity). Once those rules are set, individuals are free to play the game.
  *   **The Brother-in-Law's View:** Justice requires micromanaging every move (e.g., "You can't buy that coffee").

  If the tax system and social safety net are structured justly according to the Difference Principle, then the money you have left in your pocket is yours. You earned it under just rules. Spending it on coffee is a personal choice, not a matter of justice. Rawls calls this **"Legitimate Expectations."** If the system is fair, you are entitled to what you get under that system.

  ### What You Lose by Rejecting Step (6)

  Rejecting Step (6) saves Rawls's theory from the "absurd conclusion," but it does come with a cost. You have to accept three things that might feel unsatisfying if you were hoping for a perfect solution to inequality:

  **1. You lose the guarantee of perfect material equality.**
  By prioritizing Liberty (Step 1 of Rawls) over Economic Maximization (Step 6 of your brother-in-law), you accept that there are limits to how much you can help the poor. If helping the poor requires violating a basic liberty (like confiscating property without due process or forcing people to work), Rawls says you must stop. You have to accept that a free society might leave some people worse off than a totalitarian one *could* in theory, because freedom is more important than wealth.

  **2. You lose the ability to judge individual morality by economic standards.**
  This addresses the "coffee" objection. By rejecting (6), you admit that buying a nice coffee isn't inherently unjust, provided the tax system is fair. This means justice is about *institutions*, not personal saintliness. For some, this feels like letting rich people off the hook. You lose the moral leverage to say "Your purchase is oppressive"; you can only say "Our tax laws need adjustment."

  **3. You accept a "Good Enough" society, not a "Perfect" one.**
  Step (5) in your brother-in-law's argument claims "almost every real society is unjust." Rawls would actually agree with this! However, by rejecting (6), you acknowledge that we aren't required to constantly upheave society for marginal gains. We aim for a "property-owning democracy" where the rules are fair, not a system where the government constantly tweaks the economy to squeeze out every last penny for the poor at the expense of stability and personal projects.

  ### How to Respond to Your Brother-in-Law

  Here is a script you can use next time you see him:

  > "I looked into this. You're right that Rawls starts with the Veil of Ignorance (1 and 2), but your Step (6) misrepresents his conclusion. Rawls explicitly puts **Basic Liberty** above economic redistribution. He says we can't violate freedom to help the poor.
  >
  > Also, Rawls says justice applies to the **laws and institutions**, not my morning coffee. If the tax code and social rules are set up to maximize the position of the worst-off, then I'm allowed to keep what's left. So, you don't prove Rawls is wrong; you just proved that Rawls isn't as radical as you made him sound. He protects my coffee *and* the poor, as long as the system is fair."

  ### Summary
  *   **Keep:** (1) and (2). These are the strongest parts of modern political philosophy.
  *   **Reject:** (6). It ignores Rawls's "Priority of Liberty" and his distinction between institutions and individual choices.
  *   **The Cost:** You must accept that freedom sometimes limits how much economic equality we can achieve, and that justice is about fair rules, not policing every purchase.

  Your brother-in-law's argument is a common one (often associated with the philosopher G.A. Cohen, who actually *agreed* with the critique and thought Rawls didn't go far enough). But if you want to be a Rawlsian, you stop at Step (5) and say, "We should fix the institutions," rather than Step (6), "We must control every life choice."
