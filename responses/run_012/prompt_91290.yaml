  5.  **Final Polish:** (Produces the final output provided previously.) *Ensure the distinction between "elective affinity" and "causal determination" is clear in the context of regulatory mandates.* (Self-correction: Make sure to emphasize that if it's only affinity, the mandate is incoherent).

  6.  *(Final thought)*: The prompt asks for the implicit theory to be stated "as plainly as the practice itself is vague." I need a concluding summary that crystallizes this.

