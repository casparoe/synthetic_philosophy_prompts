          3.  **Levels of Analysis:** Collective attribution vs. individual sanctions. Can collectives be causes? Is it consistent to blame culture and punish the banker? What theory of responsibility fits?
          4.  **Conclusion:** What would change in practice if the implicit view were replaced by: (a) Culture = summary of individuals, (b) Culture = genuine collective cause, (c) Values cannot be manufactured.
      *   **Tone/Style:** Analytical, philosophical, precise, reconstructing implicit theory "as plainly as the practice itself is vague."

  2.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. The paradox of post-2008 regulation: Culture is systemic, punishment is individual. This implies a dual model of human action.

      *   **Part 1: The Dual Model of Action (Thin vs. Thick):**
          *   *Thin Agent:* The fined trader. Rational actor, responds to price signals (fines/bans). Behavior is a function of constraints.
          *   *Thick Agent:* The cultural subject. Behavior flows from internalized norms. Incentives might crowd out intrinsic motivation.
          *   *Compatibility:* Can the institution hold both? Yes, pragmatically, but theoretically tension exists.
          *   *Necessity:* Culture talk *needs* the Thick Agent to explain systemic failure. It *needs* the Thin Agent to justify legal enforcement (mens rea, liability).
          *   *Underdetermination:* The practice doesn't specify *how* culture works. It could be socialization, peer pressure, or selection effects. Any theory where "environment affects behavior" works.

      *   **Part 2: The Causal Claim (Weber & Circularity):**
          *   *The Circularity Trap:* If we define culture by the bad outcomes, it explains nothing. We need independent measures of values (surveys, artifacts) distinct from the misconduct.
          *   *Intentionality vs. Weber:* Weber's Protestant Ethic worked because it *wasn't* adopted for profit. Regulators want "profitable ethics" adopted *for* stability/profit.
          *   *The Paradox:* Can you instrumentalize a value and keep its causal power? If I tell you to "be honest" to avoid a fine, are you acting from honesty or fear?
          *   *Elective Affinity:* Maybe it's not hard causation. It's a fit between structure and ethos. If so, a mandate is weird. You can't mandate an affinity. You can only change structures to encourage the affinity.

      *   **Part 3: Levels of Analysis (Collective vs. Individual):**
          *   *The Mismatch:* Diagnosis is macro (culture), Treatment is micro (fines).
          *   *Collective Causation:* Does the practice treat the firm as an agent? Implicitly yes ("the firm's culture"), but legally no (only individuals pay).
          *   *Responsibility:* If culture causes action, individual culpability is diluted. If individuals cause action, culture is just a label.
          *   *Consistency:* It's consistent only if culture is a *context* that influences but doesn't determine choice. (Compatibilism).

      *   **Part 4: Counterfactuals (What if the theory changed?):**
          *   *Scenario A (Culture = Summary):* Stop auditing culture. Focus entirely on individual monitoring and incentives. No "tone at the top" mandates.
          *   *Scenario B (Culture = Collective Cause):* Punish the entity heavily (charter revocation), less on individuals. Treat the firm like a polluted ecosystem.
          *   *Scenario C (Values can't be manufactured):* Abandon culture mandates. Focus on structural constraints (capital requirements, firewalls) rather than trying to engineer ethos.

      *   **Conclusion:** Summarize the implicit theory. It's a pragmatic hybrid that likely fails philosophical scrutiny but works administratively. It assumes values are levers and individuals are both autonomous and determined.

