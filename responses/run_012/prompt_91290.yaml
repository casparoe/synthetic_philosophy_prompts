answer: |-
  The post-2008 regulatory practice rests on a hybrid implicit theory that attempts to bridge sociological explanation with legal enforcement. To reconstruct it, we must disentangle the conflicting models of human action it employs, examine the coherence of its causal claims regarding values, and resolve the tension between collective diagnosis and individual sanction.

  ### I. The Dual Model of Action

  The practice operates on two distinct, and theoretically incompatible, models of the agent.

  **1. The Thin Agent (Enforcement Model)**
  When regulators fine a trader or ban a CEO, they presuppose a "thin" agent. This agent is a rational calculator whose behavior is a function of external constraints and payoffs. The logic is deterrence: if the cost of misconduct ($C$) exceeds the expected benefit ($B$), the agent will desist. This model assumes conduct is malleable to price signals and that the agent possesses the autonomy to choose otherwise regardless of internal disposition. Without this model, punishment is unjust; you cannot fine a robot, nor can you punish someone whose actions were fully determined by their environment.

  **2. The Thick Agent (Cultural Model)**
  When regulators demand a "culture change," they presuppose a "thick" agent. Here, conduct flows from internalized norms, shared meanings, and social identity. This model acknowledges the "crowding out" effect: introducing monetary incentives for behavior previously driven by duty can erode the duty itself. If agents were purely thin, culture would be irrelevant; incentives would suffice. The invocation of culture implies that incentives have limits and that behavior is embedded in a social fabric that incentives cannot easily penetrate.

  **Can the institution hold both?**
  Pragmatically, yes; theoretically, no. The practice holds them for different audiences and purposes. The Thin Agent is for the legal department (establishing liability); the Thick Agent is for the compliance department (establishing root cause).
  *   **What culture talk needs:** It strictly requires the **Thick Agent**. If agents were purely thin, "culture" would be nothing more than a synonym for "incentive structure," and auditing culture would be redundant to auditing compensation.
  *   **Underdetermination:** The practice is underdetermined regarding *how* culture works. It does not specify whether culture operates through socialization (changing preferences), selection (hiring those who fit), or peer monitoring (enforcing norms). Consequently, the practice licenses multiple theories: a social psychologist (norms), an institutionalist (isomorphism), or an economist (repeated games) could all validate the same regulatory audit, provided they agree that "environment affects behavior."

  ### II. The Causal Claim and the Weberian Problem

  The central explanatory claim is that culture *causes* conduct. This faces two philosophical hurdles: circularity and intentionality.

  **1. Circularity and Independence**
  For culture to explain conduct rather than redescribe it, the "values" must be identifiable independently of the "misconduct." If regulators define a "bad culture" simply as "one where fraud occurred," the explanation is tautological.
  *   **The Constraint:** To satisfy this, the practice must assume culture is measurable via artifacts independent of outcomes (e.g., survey data, turnover rates, internal communications) *before* the scandal breaks.
  *   **The Evidence:** Proof of causation would require showing that two firms with identical incentive structures produced different outcomes due to measurable differences in normative commitment. Currently, the practice rarely meets this bar; it usually infers the culture from the outcome, risking circularity.

  **2. Intentionality and the Protestant Ethic**
  Weber's *Protestant Ethic* posits that economic success was an *unintended* consequence of religious values adopted for salvation, not profit. The values had causal power precisely because they were not instrumental.
  *   **The Regulatory Paradox:** Supervisors order firms to adopt "productive cultures" (e.g., integrity, prudence) *for the purpose* of avoiding fines and ensuring stability. This attempts to run the causal relation backwards: adopting a value instrumentally to generate its economic side-effects.
  *   **The Tension:** If a value is adopted instrumentally, is it still a value? Or is it merely a rule? If I am honest only because the regulator told me to be, I am not acting from a culture of integrity; I am acting from a culture of compliance (Thin Agent).
  *   **Elective Affinity vs. Causation:** If the relation is not hard causation but Weber's "elective affinity" (a mutual fit between ethos and structure), the regulatory mandate becomes incoherent. You cannot mandate an affinity. You can only alter the structure (rules) and hope the ethos follows. If the practice posits only affinity, the mandate to "change culture" is a category error; the firm can only be asked to change its *structures* to invite a different affinity.

  ### III. Levels of Analysis: Collective Cause, Individual Effect

  The practice attributes the problem to a collective (the firm's culture) but applies the solution to individuals (fines, bans).

  **1. Collective Causation**
  Does the practice presuppose collectives can be causes? Implicitly, yes. It treats "the firm" as an entity capable of possessing a character distinct from the sum of its employees. However, it stops short of full ontological realism. It does not treat the firm as a moral agent liable for *mens rea* in the criminal sense (though corporate liability exists, the focus remains on individual accountability).
  *   **The Theory of Responsibility:** The practice relies on a **compatibilist** theory. It assumes culture constrains and influences choice (collective cause) but does not determine it absolutely (individual freedom). The banker is punished because, despite the cultural pressure, they *could have done otherwise*.
  *   **Consistency:** It is consistent only if culture is viewed as a *context* rather than a *cause*. If culture is a deterministic cause, individual punishment is unjust. If culture is merely a summary of individual acts, cultural mandates are pointless. The practice hovers in the middle: culture creates the weather, but the individual still chooses to carry an umbrella.

  ### IV. Counterfactuals: What Would Change?

  To make the implicit theory plain, we must see how the practice would shift if the underlying assumptions were altered.

  **1. If Culture = Summary of Individual Conduct**
  *   **Theory:** There is no emergent collective property; "culture" is just a label for the aggregate behavior of individuals.
  *   **Practice Change:** Abandon culture audits and "tone at the top" mandates. Regulation would focus exclusively on individual monitoring, surveillance, and direct incentive alignment. There would be no requirement to "measure culture," only to measure individual compliance rates.

  **2. If Culture = Genuine Collective Cause**
  *   **Theory:** The firm is a moral agent; systemic properties determine individual action to a degree that dilutes individual culpability.
  *   **Practice Change:** Shift sanctions from individuals to the entity. Punishments would resemble treating a diseased organism: heavy fines on equity, revocation of charters, or forced breakup. Individual bans would decrease, as the "bad apple" theory would be replaced by a "rotten barrel" theory. The focus would be on curing the system, not purging the actors.

  **3. If Values Cannot Be Manufactured**
  *   **Theory:** Values are endogenous, arising from history and community, not exogenous levers to be pulled by management or regulators (the Weberian constraint).
  *   **Practice Change:** Abandon the requirement to "change culture." Regulators would acknowledge they cannot engineer ethos. Instead, they would focus on **structural containment**: higher capital buffers, transaction taxes, or firewalls that make misconduct mechanically difficult or economically irrelevant, regardless of the firm's values. The mandate shifts from "be good" to "be safe."

  ### V. The Implicit Theory Stated Plainly

  The current regulatory practice relies on the following implicit theory, stated as plainly as its vagueness allows:

  > **Culture is a malleable, systemic property that acts as a causal constraint on individual behavior, yet individuals retain sufficient autonomy to be held morally and legally liable for breaching norms. Furthermore, these normative constraints can be intentionally engineered by leadership and regulators through instrumental mandates, such that adopting values for the sake of compliance will generate the same stabilizing effects as holding those values intrinsically.**

  This theory is convenient for supervisors because it maximizes their leverage: it allows them to intervene deeply in firm governance (via culture) while retaining the moral high ground of individual accountability (via fines). However, it is theoretically unstable. It requires values to be both authentic (to cause behavior) and instrumental (to be mandated); it requires individuals to be both socially determined (to explain the scandal) and freely choosing (to justify the punishment). Until the practice resolves whether culture is a cause, a summary, or an affinity, it will remain a ritual of accountability that satisfies the public demand for explanation without fully satisfying the logical demands of causation.
