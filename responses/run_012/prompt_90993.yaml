answer: |-
  This is one of the most sophisticated pieces of reasoning in *The Wealth of Nations*, and it trips up a lot of readers because Smith is describing a **general equilibrium effect** using 18th-century vocabulary. He is essentially describing how liquidity and demand propagate through a global system, even to players not directly at the table.

  Here is the breakdown of the causal chain, the specific meaning of "equivalents," and how to reconcile the benefit of discovery with the critique of monopoly.

  ### 1. The Causal Chain: The Triangle of Surplus

  To understand Hungary and Poland, you have to visualize the trade network not as bilateral pairs, but as a web.

  **The Pre-America World:**
  *   **Hungary** produces grain (surplus).
  *   **Britain** produces wool/iron (surplus).
  *   They trade. But there is a limit. Maybe Britain only needs so much grain, and Hungary only needs so much iron. Once those needs are met, the trade stops. Hungary's extra grain has no market.

  **The Post-America World:**
  *   **America** produces sugar, tobacco, cotton, and silver.
  *   **Britain** trades with America. Britain now holds American goods.
  *   **Britain** trades with Hungary.

  **The Mechanism:**
  Hungary doesn't want British wool anymore; they have enough coats. But Hungary *does* want American sugar (which has now become a European staple). Britain can now say to Hungary: "Give me your surplus grain, and I will pay you not in wool, but in American sugar."

  **The Result:**
  1.  **New Demand:** Hungary suddenly has a buyer for grain that previously sat unsold.
  2.  **Increased Industry:** Because the grain now has a buyer (paid for in desirable sugar), the price/value of Hungarian grain holds steady or rises. Hungarian farmers work harder to produce more surplus because they know they can swap it for sugar.
  3.  **Propagation:** This ripples outward. The Hungarian farmer, now richer, buys more German tools. The German toolmaker buys more Italian wine.

  Smith's point is that the **purchasing power** generated in the Americas leaked into the general European economy, lubricating transactions between countries that never touched a American shore.

  ### 2. "New Equivalents" vs. "Greater Abundance"

  You asked: *What work is "new equivalents" doing that "greater abundance" isn't already doing?*

  This is the crux of the passage. In modern terms, Smith is distinguishing between **Supply** (Abundance) and **Liquidity/Purchasing Power** (Equivalents).

  *   **Greater Abundance:** This just means "there is more stuff in the world." If America produces more corn, and Europe produces more corn, that's abundance. But if Hungary has a surplus of corn, more corn in the world doesn't help them; it might even lower the price of their corn.
  *   **New Equivalents:** An "equivalent" is what you give someone to get what you want. It is a medium of exchange.
      *   If I am a Hungarian wheat farmer, I don't care about the "abundance" of wheat. I care about the abundance of **things I cannot produce myself.**
      *   American sugar is a "new equivalent." It is a new token of value that Britain can hand to Hungary to unlock Hungary's wheat.

  **Why the distinction matters:**
  Smith is arguing that the discovery of America didn't just add goods to the pile; it added **new categories of desirable goods** that acted as new money. Before America, the pool of things Britain could offer Hungary was limited (wool, tin, lead). After America, the pool expanded (sugar, tobacco, cotton, silver).

  By expanding the pool of "things Britain can pay with," Smith argues you effectively expand the "market for Hungarian wheat." The "new equivalent" validates the value of the Hungarian surplus.

  ### 3. Is there a subtler point about Money and Prices?

  Yes. While Smith focuses on commodities (sugar/tobacco) in this specific passage, he is implicitly including **silver**.

  In the 18th century, silver *was* money. America dumped a massive amount of silver into Europe.
  1.  **Price Revolution:** The influx of silver caused inflation (prices rose).
  2.  **Stimulus:** Smith generally viewed mild inflation as stimulating to industry. If the price of Hungarian wheat rises (because there is more silver chasing it), the Hungarian landlord sees a higher money return.
  3.  **Incentive:** Seeing that higher return, the landlord encloses more land and hires more laborers.

  So, the "new equivalent" is partly literal commodities (sugar for wheat) and partly monetary (silver for wheat). Both increase the "value of the surplus produce" mentioned in the text. If your surplus is worth more, you produce more.

  ### 4. Reconciling the "Dead Weight" Comment

  This is where readers often feel whiplash. Smith says America was a huge boon to Hungary, but then calls the exclusive trade system a "dead weight." How can it be both a benefit and a burden?

  Smith is distinguishing between **The Discovery** (the event) and **The Policy** (the mercantilist restrictions).

  *   **The Discovery (The Spring):** The mere existence of America and its goods expanded the total pie. Even with bad policies, the sheer volume of new goods and silver meant Europe (including Hungary) was richer than it would have been in a counterfactual world where America didn't exist. This is the "great spring" of industry.
  *   **The Exclusive Trade (The Dead Weight):** The Mother Countries (Spain, Britain, France) passed laws saying *only* their ships could trade with their colonies.
      *   *Ideal Scenario:* Hungary trades directly with America. Maximum efficiency.
      *   *Mercantilist Scenario:* Hungary must trade with Britain, who trades with America. Britain takes a cut. Shipping routes are longer. Smuggling is criminalized.
      *   *Smith's Critique:* The monopoly restrictions acted as a friction or tax on that "great spring." They didn't stop the engine from running (Hungary still benefited), but they prevented it from running at full speed.

  **The Synthesis:**
  Smith is saying: "Look how amazing the benefits were *despite* the terrible policies. Imagine how much richer Hungary would be if we hadn't shackled the trade with monopolies."

  The "dead weight" is the **opportunity cost**. It is the difference between the *actual* benefit Europe got and the *potential* benefit Europe *could have* got under a system of natural liberty.

  ### Summary Walkthrough

  1.  **America produces new stuff** (Sugar, Silver).
  2.  **Colonial Powers** (Britain/Spain) acquire this stuff.
  3.  **Colonial Powers trade this stuff** to non-colonial powers (Hungary/Poland) in exchange for their surplus (Grain/Timber).
  4.  **"New Equivalents":** The American goods serve as new purchasing power. They allow Hungary to sell more grain than they could have if Britain only had wool to offer.
  5.  **Increased Industry:** Because Hungary can sell more grain for desirable goods, Hungarian farmers work harder. The "market for surplus produce" expands.
  6.  **The Critique:** This whole process was artificially constrained by monopolies. The "dead weight" is the friction caused by forcing Hungary to go through London or Madrid rather than trading freely. The benefit was real, but the *loss* relative to free trade was also real.

  Smith isn't hand-waving; he is describing how **demand shocks** propagate through a linked economy. He is arguing that globalization (even restricted globalization) creates a rising tide that lifts boats even in harbors that don't directly send ships to the new world.
