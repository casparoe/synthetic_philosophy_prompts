  ## 11. Detailed Methodological Elaboration

  *(Note: This section expands on the methodology to ensure the proposal meets the depth required for a serious review, elaborating on the formal specifics hinted at in Section 5.)*

  To ensure the reviewer understands the technical viability of the project, it is necessary to elaborate on the specific formal constraints that will be applied during the modelling phase. The danger in formal philosophy projects is that they become either too trivial to matter or too complex to finish. The following constraints are designed to navigate that channel.

  ### 11.1 The Algebra of Propositions
  The model will utilise a finite algebra $\mathcal{F}$ generated by a partition $\Omega = \{\omega_1, \omega_2, \omega_3\}$. This is the minimal state space required to demonstrate violations of additivity (e.g., $P(A \cup B) \neq P(A) + P(B)$). Using a larger state space adds computational bulk without adding philosophical insight for the specific question of coherence.
  The propositions of interest will be subsets of $\Omega$. The aggregation functions will be applied to the credences assigned to these subsets.

  ### 11.2 Defining 'Fairness' in a Collective Context
  In the individual case, a bet is fair if the price equals the credence. In the group case, we must define what it means for a bet to be 'fair to the group'.
  *   **Definition 1 (Aggregate Fairness):** A bet at price $p$ on $X$ is fair to $G$ if $p = C_G(X)$.
  *   **Definition 2 (Member Fairness):** A bet is fair to $G$ if for all $m_i \in M$, $p = C_i(X)$.

  The project will primarily utilise Definition 1, as this is the standard interpretation when we speak of a 'market price' or 'committee forecast'. The bookie offers odds based on the public aggregate. The question is whether the group *accepts* these odds. This separation is crucial. The bookie offers a bet that matches the group's public face ($C_G$). The group's internal mechanism ($R$) decides whether to take it.

  ### 11.3 The Loss Function
  Defining 'Loss' is the most contentious part of group DBAs.
  *   **Strong Loss:** Every member loses money.
  *   **Weak Loss:** The sum of members' financial changes is negative, even if some individuals gain.
  *   **Treasurer Loss:** The designated fund held by the treasurer decreases.

  The project will argue that **Weak Loss** is the appropriate analogue to the individual DBA. In the individual case, the agent loses from their own pocket. In the group case, the 'group pocket' is the sum of individual pockets. If the sum decreases, resources have been destroyed from the collective perspective, even if redistributed internally. However, the project will explicitly analyse whether the *normative force* holds for Weak Loss. If a book guarantees a Weak Loss but a Strong Gain for the majority, is the group irrational? This nuance is where the philosophical contribution lies.

  ### 11.4 The Aggregation Functions
  The three functions selected are chosen for their distinct properties regarding coherence:
  1.  **Linear Averaging:** Preserves zero probabilities (if everyone says 0, group says 0) but can violate external Bayesianity. It is the most common baseline.
  2.  **Median:** Does not preserve additivity. If members are coherent, the median can be incoherent. This is a prime candidate for finding a book against $C_G$ where individuals are safe.
  3.  **Geometric:** Preserves independence but requires normalisation. It handles 'certainty' differently (if one person says 0, the product is 0).

  By testing these three, the project covers the main families of pooling functions discussed in the literature. If the DBA vulnerability varies across these three, it suggests the vulnerability is a property of the pooling method, not of 'group belief' in general.

  ### 11.5 The Acceptance Rules
  1.  **Treasurer:** Models a centralised bank or market maker. The treasurer looks at $C_G$ and bets. Here, the treasurer is effectively acting as the 'group agent'. If a book exists here, it is the closest analogue to the individual DBA.
  2.  **Unanimity:** Models a jury or security council. Highly conservative. Likely to block Dutch Books even if $C_G$ is incoherent, because members' individual credences $C_i$ might be coherent even if $C_G$ is not.
  3.  **Majority:** Models a democratic committee. Vulnerable to cycling and aggregation paradoxes.

  Comparing the Treasurer result with the Unanimity result will isolate the role of centralisation. If the Treasurer gets booked but the Unanimity group does not, it proves that centralisation of decision-making is a risk factor for group rationality, independent of the credence aggregation.

  ## 12. Final Statement of Intent

  This proposal outlines a project that is ambitious in its conceptual challenge but conservative in its technical execution. It does not seek to overturn the Dutch Book Argument for individuals. It seeks to map the boundary conditions of its applicability.
  The hypothesis—that group Dutch books target aggregation rules—is counter-intuitive to those who view coherence as a property of belief states alone. Proving this would require a shift in how social epistemologists evaluate collective rationality.
  The semester timeline is adequate for the proposed scope. The risks are identified and manageable. The output will be a 6,000-word paper that provides a definitive formal and philosophical analysis of the problem. The project is ready to commence upon approval.
