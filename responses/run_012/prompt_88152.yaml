  6.  **Structuring the 40 Minutes:**
      *   0-5: The Hook (The Fork). State the paradox clearly.
      *   5-15: The Analogy (Statue/Clay). Quick, visual. Establish "Constitution vs. Identity."
      *   15-30: The Mapping (Sortals). Define what "Billing Service" *means* (Function? Code? DB?).
      *   30-35: The Trap (Semantics vs. Reality). Why this matters for on-call.
      *   35-40: The Test.

  7.  **Refining the Objections:**
      *   (a) Semantics: Counter with "If PagerDuty rings, who answers?"
      *   (b) Co-location: Counter with "Process vs. Thread" or "Class vs. Instance."
      *   (c) Customers: Counter with "Customers don't see the DB schema."

  8.  **The Final Question:**
      *   Needs to test application, not recall.
