answer: |-
  Your proposed criterion is elegant and intuitive, but within the established framework of speech act theory, it is **not the right way to draw the line.** While self-reference (often marked by "hereby") is a common *feature* of explicit performatives, it is not the *source* of their power.

  Here is the breakdown of why your semantic criterion fails, how to handle your awkward cases, and my assessment of confidence.

  ### 1. The Semantic vs. Pragmatic Distinction
  Your hypothesis rests on the idea that performativity is a **semantic** property (contained within the meaning of the sentence). The dominant view, established by J.L. Austin in *How to Do Things with Words*, is that performativity is a **pragmatic** property (dependent on the context of the utterance).

  Austin initially entertained a view similar to yours but ultimately rejected it. He argued that saying "I promise" does not create a promise simply because of the words' meaning. Instead, it creates a promise because there is a **social convention** that allows those words to count as an undertaking *in specific circumstances*.

  If performativity were purely semantic, as you suggest, then:
  *   A parrot saying "I promise" would make a promise.
  *   A line in a novel ("I hereby resign," said by the protagonist) would constitute a real resignation.
  *   Saying "I bet you $100" to someone who explicitly rejects the bet would still successfully create a bet.

  Intuitively, none of these hold. Therefore, the "success" of a performative depends on **felicity conditions** (context, authority, sincerity, and uptake), not just sentence form.

  ### 2. Handling the Awkward Cases
  Your criterion struggles with the cases you listed because they are precisely the scenarios where context overrides syntax. Here is how standard speech act theory handles them:

  *   **The Actor on Stage:** Austin classifies this as an **etiolation** or a "non-serious" use of language. The utterance has the form of a promise but lacks the requisite context (the intention to be bound by social norms). It is a "misfire"; the act is not successfully performed. Under your semantic criterion, the actor *would* have successfully promised, which contradicts our legal and moral intuition that actors are not bound by their scripts.
  *   **The Unread Text:** This touches on the condition of **uptake**. Austin argues that for many performatives (especially communicative ones like promising or betting), the act must be secured by the hearer's understanding. If the text is never read, the convention is not invoked successfully. The utterance exists, but the *illocutionary act* (the act of promising) is not consummated.
  *   **The Unknown Language:** This is a failure of **conventional procedure**. For a performative to work, there must be a shared convention between speaker and hearer. If the hearer does not understand the language, the conventional procedure cannot be executed. It is merely noise, not a speech act.

  ### 3. Confidence and Uncertainty

  **Confidence Level:** **High (90%)**
  I am highly confident that your criterion contradicts the standard Austinian and Searlean framework, which overwhelmingly dominates philosophy of language and linguistics regarding this topic. The shift from a semantic to a pragmatic understanding of performatives is the foundational move of modern speech act theory.

  **Point of Least Certainty:** **The Necessity of Uptake**
  The specific point on which I am least certain—and where contemporary debate remains active—is the strict necessity of **uptake** for the *completion* of the act versus the *effect* of the act.

  Austin insists that without uptake (the hearer understanding the act), the performative fails (e.g., naming a ship where no one hears it). However, some later theorists (including modifications by Searle and others) argue that the illocutionary act is constituted by the speaker's intention and the conventional rules, even if the hearer fails to grasp it. In this view, the promise is *made* even if unread, though it fails to *oblige* or *communicate*.

  If you are drafting a paper, you could gain significant traction by arguing that while your semantic criterion fails for *communicative* performatives (promises, bets), it might hold for *unilateral* performatives (like writing a will or naming a ship in solitude), though even there, social convention usually requires a witness. Distinguishing between the *existence* of the act and the *felicity* of the act is the precise philosophical lever you need to adjust.
