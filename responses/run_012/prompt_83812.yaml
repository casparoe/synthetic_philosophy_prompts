  ### The Separating Case

  Since my best guess aligns Rule 2 (Sanction) and Rule 3 (Evolutionary) on the verdict of **Norm**, we need a case to separate them. Rule 2 relies on *observable enforcement*, while Rule 3 relies on *internalized normative expectations* (which may exist without active enforcement).

  **The Case of the Silent Library:**
  > In a specific university library, everyone whispers. There are two equally workable alternatives (whispering or speaking normally). Everyone believes they *ought* to whisper (normative expectation), and would feel guilty if they spoke loudly. However, if a student speaks loudly, no one ever corrects them, shushes them, or punishes them; they are simply ignored, and the behavior never spreads.

  *   **Rule 2 (Sanction) Predicts:** **Convention.**
      *   *Reason:* There is no active correction or sanction applied to deviants.
  *   **Rule 3 (Evolutionary) Predicts:** **Norm.**
      *   *Reason:* The behavior has reached Stage 2; the normative expectation ("ought") is present and internalized, even if the sanction mechanism is dormant or passive.

  If your colleague calls this a **Convention**, she adheres to the Sanction Rule. If she calls it a **Norm**, she adheres to the Evolutionary Stage Rule.
