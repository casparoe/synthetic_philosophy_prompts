answer: |-
  To predict your colleague's verdict, we must reconstruct the classification rules she is applying to David Lewis's framework. Lewis defines a **convention** as a regularity in behavior that solves a coordination problem, where everyone conforms, expects others to conform, prefers to conform *on the condition that others do*, and where an alternative regularity could have solved the problem just as well (arbitrariness).

  Your colleague's past verdicts suggest she is using a refined taxonomy that distinguishes between pure coordination equilibria and socially enforced regularities. Below are three rules that fit her earlier verdicts equally well, their predictions for the hospital case, my best guess, and a case to separate the surviving theories.

  ### Three Competing Rules

  **1. The Arbitrariness Rule (Strict Lewisian)**
  *   **The Rule:** A regularity is a **Convention** if it solves a coordination problem with at least one *equally workable alternative* (arbitrariness) and relies on conditional preference. It is a **Norm** if the behavior is mandated by moral weight or asymmetric social stakes where the alternative is *not* equally workable (e.g., social ruin). It is **Neither** if there is no shared conditional preference (Stairs) or no shared regularity (Shoe).
  *   **Fit to Data:**
      *   *Driving/Villages/Red:* Arbitrary alternatives exist; coordination is key. (Convention)
      *   *Tipping/Funeral:* Not truly arbitrary; failing to tip or wear black incurs specific social stigma/loss, making the alternative "worse" in a non-coordination sense. (Norm)
      *   *Stairs/Shoe:* Fails coordination or regularity conditions. (Neither)
  *   **Prediction for Hospital:** **Convention.**
      *   *Reasoning:* The case specifies "two equally workable ways." This satisfies the arbitrariness condition. The fact that the team is "worse off if everyone switched" confirms it is a coordination equilibrium. The correction is merely a mechanism to maintain the equilibrium, not a change in kind.

  **2. The Sanction Rule (Enforcement-Based)**
  *   **The Rule:** A regularity is a **Convention** if it is sustained purely by empirical expectations (I do it because I expect you to). It is a **Norm** if it is sustained by *sanctions* or *correction* (I do it because I will be corrected/punished otherwise). It is **Neither** if there is no regularity or no interdependence.
  *   **Fit to Data:**
      *   *Driving/Villages/Red:* Explicitly noted as having no punishment/correction. (Convention)
      *   *Tipping/Funeral:* Implicit social sanctions (shame/stigma) exist. (Norm)
      *   *Stairs/Shoe:* No enforcement mechanism. (Neither)
  *   **Prediction for Hospital:** **Norm.**
      *   *Reasoning:* The new resident is "corrected by the attending." The presence of active enforcement/correction distinguishes this from the Village case (where "no one is punished").

  **3. The Evolutionary Stage Rule (The Single Process)**
  *   **The Rule:** Convention and Norm are not different kinds but **stages of a single evolutionary process**.
      *   *Stage 1 (Convention):* A coordination equilibrium sustained by *empirical expectations* (everyone does X).
      *   *Stage 2 (Norm):* The equilibrium hardens; empirical expectations are joined by *normative expectations* (everyone thinks one *ought* to do X) and enforced by sanctions.
      *   *Neither:* Behaviors that never achieve equilibrium.
  *   **Fit to Data:**
      *   *Driving/Villages:* Early stage; coordination without internalized "ought." (Convention)
      *   *Tipping/Funeral:* Late stage; behavior is internalized and enforced. (Norm)
      *   *Stairs/Shoe:* Failed to evolve into an equilibrium. (Neither)
  *   **Prediction for Hospital:** **Norm.**
      *   *Reasoning:* The case describes a coordination equilibrium that has acquired normative force ("corrected," "team agrees"). It has evolved from a mere convention into a local norm within the hierarchy.

  ### Best Guess

  **Verdict: Norm**

  **Reasons:**
  The strongest clue lies in your colleague's handling of the **Village Case**. She felt compelled to explicitly state that "no one is punished for pulling right" to justify the verdict of *Convention*. This implies that, in her taxonomy, the *presence* of punishment or correction is the sufficient condition for shifting a verdict from Convention to Norm.

