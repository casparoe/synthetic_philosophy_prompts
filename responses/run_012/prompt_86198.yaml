  2.  **Deconstruct the Core Themes:**

      *   **Psychohistory vs. Cliodynamics:**
          *   *Asimov:* Psychohistory is deterministic *in aggregate*. It requires ignorance of the prediction (self-reference problem). It treats individuals as gas molecules.
          *   *Cliodynamics (Turchin):* Uses data to find structural-demographic trends (elite overproduction, etc.). It's probabilistic, not deterministic. It acknowledges uncertainty.
          *   *Alignment:* Both rely on large numbers (law of large numbers). Both see structural forces overriding individual agency.
          *   *Divergence:* Asimov is too clean (Seldon always knows). Turchin is messier (correlations, not laws). Asimov ignores the "observer effect" until the Mule.

      *   **Theory of History:**
          *   *Positivism:* The belief that scientific methods can be applied to social sciences. Asimov is a hardcore positivist.
          *   *Determinism vs. Probabilism:* Seldon speaks as if the future is fixed, but the math is statistical. This is a tension in the text.
