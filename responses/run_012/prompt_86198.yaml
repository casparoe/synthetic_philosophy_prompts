      *   **The Mule:**
          *   Is he a outlier or a refutation? In a true statistical model, extreme outliers *should* exist. The problem is Psychohistory claimed to account for *all* variables except knowledge of itself. The Mule represents a *structural* change (mutant psychology), not just a rare event. He breaks the assumptions of the model (human psychology is constant).
