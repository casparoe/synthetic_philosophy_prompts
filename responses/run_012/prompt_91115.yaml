prompt: |-
  I run the betting side of a small staking syndicate: eight backers, a shared bankroll, and me as the person who decides how much of it goes on each opportunity that comes through the door. The opportunities resist every clean treatment. Some are small and repeatable — a few hundred bets a year on markets where I have a thin but fairly stable edge. Some are large and one-shot: a single event, a position that will resolve once and then never exist again. Some arrive on the same afternoon and are correlated, because they are all really bets on the same underlying outcome wearing different names. For almost none of them do I have a probability distribution; I have a point estimate, a rough sense of how wrong I have historically been, and occasionally a market price that disagrees with me. Large positions also move the price, and there is a floor below which a bet is not worth placing at all. Our house rule has been to stake half of what the Kelly criterion recommends, capped at a fixed fraction, and none of the three partners can say whether that rule is a principled response to our ignorance or a lucky habit.

  Please give me a decision procedure I can run, in order, on each opportunity: the questions to ask, what counts as a sufficient answer to each, where the procedure terminates in a number, where it terminates in a refusal, and where it must hand the decision back to a person because the question is not arithmetic. It needs to be runnable in about fifteen minutes by someone numerate but not a statistician, and auditable by my two partners, who have to sign off on anything above our cap.

  The procedure has to survive the cases the textbook version does not. It must distinguish an edge that is repeatable from one that is genuinely one-shot, and be explicit about which part of the Kelly argument depends on the bet being rebettable many times. It must handle several correlated opportunities arriving at once, where sizing each as if it were alone would obviously overcommit us. It must say what to do with a point estimate and a sense of error instead of a distribution, and whether the standard advice to shrink toward a smaller fraction has a justification beyond folklore. It must be clear about whether the relevant quantity is the syndicate's bankroll or the backers' total wealth, given that the backers earn outside income and that a drawdown of the bankroll is not the same kind of event as a drawdown of their savings. And it must say plainly what it cannot decide, including the possibility that for the largest one-shot bets the Kelly calculation is answering a question nobody asked.

  Then run it on three cases. First, a repeatable thin-edge bet of the kind we place weekly. Second, a one-shot event where my point estimate implies staking a fraction of the bankroll that would, if wrong, end the syndicate — I expect the procedure to refuse to endorse it, and I want to see exactly where and why it refuses, and what it says the decision actually turns on. Third, a single afternoon on which four correlated opportunities appear at once. Finally, tell me whether the same procedure carries over to a partner's non-financial wager — staking a large share of her time and professional reputation on a venture that will resolve once — or whether the extension is illegitimate, and if it is, what the nearest honest thing to say is. I care less about a number than about knowing which steps are real arithmetic, which are judgment wearing arithmetic's clothes, and where the procedure will produce a position I later regret.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Manager of a small staking syndicate (8 backers, shared bankroll).
      *   **Problem:** Current staking rule (Half-Kelly, capped) feels like a "lucky habit" rather than a principled response to uncertainty.
      *   **Complexities:**
          *   Mix of repeatable (thin edge, high frequency) and one-shot (large, unique) opportunities.
          *   Correlated opportunities (same underlying outcome, different names).
          *   No probability distributions (point estimates + historical error sense).
          *   Market impact (large positions move price).
          *   Minimum bet threshold (floor).
          *   Bankroll vs. Backer Wealth distinction.
          *   Auditability (partners need to sign off on large bets).
          *   Time limit: ~15 minutes per opportunity.
          *   User skill: Numerate, not a statistician.
      *   **Requirements for the Procedure:**
          *   Sequential questions (Yes/No/Calc).
          *   Clear termination points (Number, Refusal, Human Judgment).
          *   Must handle repeatable vs. one-shot distinction (Kelly's assumptions).
          *   Must handle correlation.
          *   Must address point estimates + error (shrinkage justification).
          *   Must address Bankroll vs. Total Wealth.
          *   Must admit limitations (where Kelly fails).
      *   **Test Cases:**
          1.  Repeatable thin-edge bet.
          2.  One-shot "ruin" bet (expect refusal).
          3.  Four correlated opportunities arriving at once.
      *   **Extension Question:** Does this apply to non-financial wagers (time/reputation)?

  2.  **Analyze the Core Tension (Kelly vs. Reality):**

      *   *Kelly Criterion:* Maximizes long-term geometric growth. Assumes infinite horizon, known probabilities, independent bets, divisibility.
      *   *Syndicate Reality:* Finite horizon (backers might quit), unknown probabilities (edge estimation error), correlated risks, indivisibility (market impact/min bets), utility of money isn't logarithmic for everyone (drawdown pain vs. gain joy).
      *   *Half-Kelly:* Often used to reduce volatility and account for estimation error. It's a heuristic, but a robust one.
      *   *One-Shot Bets:* Kelly is mathematically inappropriate for single events because "long-term growth" doesn't exist. It becomes a utility problem (Expected Utility Theory), not a growth optimization problem.
      *   *Correlation:* Kelly on individual bets ignores covariance. You need to size the *portfolio* of bets, not the individual units.

  3.  **Drafting the Procedure (The "Syndicate Sizing Protocol" - SSP):**

      *   *Structure:* Needs to be a flowchart in text form.
      *   *Step 1: Classification.* Is this repeatable or one-shot? This is the critical branch.
      *   *Step 2: Edge Validation.* Do we actually have an edge? (Point estimate vs. Market).
      *   *Step 3: Correlation Check.* Is this part of a cluster?
      *   *Step 4: Sizing Calculation.* Different formulas for Repeatable vs. One-Shot.
      *   *Step 5: Constraints.* Caps, floors, market impact.
      *   *Step 6: Human Review.* Where does the math stop and judgment begin?

      *Refining Step 1 (Repeatable vs. One-Shot):*
      *   Kelly works for Repeatable.
      *   Kelly *fails* for One-Shot. For One-Shot, we need a "Risk of Ruin" or "Maximum Pain" check.
      *   *Decision:* If One-Shot + High Stake -> Refuse or Escalate to Utility Discussion.

      *Refining Step 2 (Edge/Error):*
      *   User has point estimate ($p$) and "sense of error".
      *   *Adjustment:* Shrink the edge. If market implies $q$, and we think $p$, edge is $p-q$. But if uncertainty is high, reduce $p$ toward $q$ or reduce the calculated stake.
      *   *Justification for Half-Kelly:* It's not just folklore; it's a buffer against overestimation of edge.

      *Refining Step 3 (Correlation):*
      *   If 4 bets on same outcome, treat as 1 bet with 4x price impact or 1 bet with aggregated exposure.
      *   *Rule:* Sum the exposure. Size the total, then allocate.

      *Refining Step 4 (Bankroll vs. Wealth):*
      *   Kelly optimizes *bankroll* growth.
      *   But if bankroll loss hurts backers' lives, the "effective bankroll" is lower.
      *   *Rule:* Define "Risk Capital" vs. "Total Syndicate Bankroll". Use the lower bound for sizing if drawdown pain is high.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Repeatable):* Standard Half-Kelly application, adjusted for error.
      *   *Case 2 (One-Shot/Ruin):* The procedure must flag this as "Non-Kelly Territory". The math might say 20%, but the "One-Shot" gate says "Max Loss Tolerance". If 20% kills the syndicate, it's a refusal.
      *   *Case 3 (Correlated):* Aggregate the edge. Calculate Kelly on the aggregate. Split the stake. Show how individual sizing would overcommit.
      *   *Extension (Reputation):* Kelly is about money. Reputation is not fungible or replenishable in the same way. The extension is illegitimate. The "nearest honest thing" is Expected Utility with a heavy penalty for ruin.

  5.  **Writing the Procedure (Iterative refinement for tone and clarity):**

      *   *Tone:* Professional, precise, slightly skeptical of math's limits (matching the user's vibe).
      *   *Format:* Numbered steps, clear "Stop/Go" signals.
      *   *Audit Trail:* Each step needs a recorded output.

      *(Self-Correction during drafting)*: I need to make sure I explicitly address *why* Half-Kelly is used. It's not arbitrary; it's a proxy for uncertainty. I also need to make sure the "One-Shot" refusal is clear. Kelly maximizes *growth rate*. A one-shot bet maximizes *expected value* subject to *risk of ruin*. If the risk of ruin is > 0 for the syndicate's existence, Kelly is irrelevant.

      *(Refining the Correlation Step)*: How to do this in 15 mins without a covariance matrix?
      *   *Heuristic:* Group by "Underlying Truth". If Bet A, B, C, D all depend on "Team X wins", treat as one bet with the average price and summed stake limit.

      *(Refining the Bankroll Step)*:
      *   Backers have outside income. Does this mean we can be more aggressive?
      *   *Counter:* Or does it mean the syndicate money is "play money" and should be preserved?
      *   *Decision:* Define "Effective Bankroll". If a 50% drawdown causes backers to quit, the Effective Bankroll is smaller than the Actual Bankroll.

  6.  **Final Review against Constraints:**

      *   15 minutes? Yes, if data is prepped.
      *   Auditable? Yes, requires logging inputs.
      *   Distinguishes Repeatable/One-Shot? Yes, Step 1.
      *   Handles Correlation? Yes, Step 3.
      *   Handles Point Estimate/Error? Yes, Step 2 (Edge Shrinkage).
      *   Bankroll vs. Wealth? Yes, Step 4 (Effective Bankroll).
      *   Extension to Reputation? Addressed in final section.

  7.  **Drafting the Response:** (Mental outline of the output)
      *   Introduction: Acknowledge the sophistication of the question.
      *   The Protocol (SSP): The step-by-step procedure.
      *   The Three Cases: Running the protocol.
      *   The Extension: Reputation/Time wager.
      *   Closing: Summary of limitations.

      *(Key Insight for the One-Shot Case)*: The procedure shouldn't just output a smaller number. It should output "NO MATH AVAILABLE". It must force a utility conversation. Kelly assumes you can recover. One-shot ruin means you can't.

      *(Key Insight for Correlation)*: The "Sum of Stakes" vs. "Stake on Sum". If you bet on 4 correlated outcomes, you effectively have 1 position. Size that position, then divide.

      *(Key Insight for Reputation)*: Money is convex/linear-ish. Reputation is concave (losses hurt more than gains help) and path-dependent. Kelly is illegitimate there.

  8.  **Final Polish:** Ensure the distinction between "Arithmetic" and "Judgment" is highlighted in every step. (e.g., "Input: Number", "Judgment: Yes/No").

      *Wait, one detail:* "None of the three partners can say whether that rule is a principled response... or a lucky habit."
      *My job:* Validate the Half-Kelly as principled *for repeatable bets with uncertainty*, but invalidate it for *one-shot bets*.

      *Let's build the "Edge Shrinkage" logic:*
      If I think 55% and Market is 50%. Edge = 5%.
      If I think my error is +/- 3%. Real edge could be 2%.
      Rule: Use (Edge - Error Margin) for calculation. If negative, pass.
      Then apply Half-Kelly to that shrunk edge. This double-counts safety but is robust.
      Actually, standard advice: Half-Kelly *is* the shrinkage for error. I will stick to that but explain *why*.

      *Let's finalize the "One Shot" logic:*
      If One-Shot: Kelly is void. Use "Fixed Fraction of Max Loss".
      Max Loss = What % of bankroll can we lose without partners quitting?
      If Kelly says > Max Loss, Cap at Max Loss. If Kelly says > 100% (negative odds?), refuse.
      Actually, for One-Shot, the question is "Is the Expected Value worth the Risk of Ruin?"
      Procedure: Calculate EV. Calculate Worst Case Loss. If Worst Case > Survival Threshold, Refuse.

      *Okay, ready to write.*
answer: |-
  This is the **Syndicate Sizing Protocol (SSP)**. It is designed to be executed in 15 minutes, audited by lay-numerates, and to explicitly separate arithmetic from judgment. It treats your current "Half-Kelly" rule not as a universal law, but as a specific tool for a specific class of problem (repeatable uncertainty), while erecting guardrails for the cases where that math breaks.

  ### The Protocol (SSP-v1)

  **Pre-requisite:** You must have a log sheet with columns for: *Date, Asset, Type (Repeatable/One-Shot), Market Price, Your Price, Correlation Group, Calculated Stake, Final Decision.*

  #### Step 1: The Horizon Test (Judgment)
  **Question:** If this bet loses, will an identical opportunity arise again under similar conditions within 12 months?
  *   **Yes:** Mark as **REPEATABLE**. Proceed to Step 2.
  *   **No:** Mark as **ONE-SHOT**. Proceed to Step 3.
  *   **Why:** Kelly optimization relies on the Law of Large Numbers. It maximizes geometric growth *over time*. If there is no "over time," Kelly maximizes nothing but variance.

  #### Step 2: Edge Validation (Arithmetic + Judgment)
  **Input:** Your Probability ($P_{you}$), Implied Market Probability ($P_{mkt}$).
  **Calculation:** Raw Edge $E = P_{you} - P_{mkt}$.
  **Judgment:** Based on your historical error rate, assign an **Uncertainty Buffer ($U$)**. (e.g., if you are usually +/- 5% wrong, $U = 0.05$).
  **Adjusted Edge:** $E_{adj} = E - U$.
  **Termination:** If $E_{adj} \leq 0$, **REFUSE**. The edge is within your noise floor.
  **Why:** This justifies the "shrinkage." You are not betting on your point estimate; you are betting on the lower bound of your confidence interval.

  #### Step 3: Correlation Check (Judgment)
  **Question:** Is there another open opportunity (or pending bet) that resolves based on the *same underlying truth*?
  *   **No:** Proceed to Step 4.
  *   **Yes:** Group them. Sum the *Exposure* (not the stake, the potential loss) of the group. You must size the **Group**, not the individual bets. Treat the group as a single asset with the weighted average price of the components.
  *   **Why:** Sizing correlated bets individually ignores covariance. It turns one risk into multiple line items, artificially inflating your capacity.

  #### Step 4: The Bankroll Definition (Judgment)
  **Question:** If the bankroll draws down by 50%, will backers withdraw capital or cease funding?
  *   **No:** **Effective Bankroll ($B_{eff}$)** = Current Cash Bankroll.
  *   **Yes:** **Effective Bankroll ($B_{eff}$)** = Current Cash Bankroll $\times$ (Max Tolerable Drawdown % / 50%).
      *   *Example:* If a 20% loss causes panic, $B_{eff} = \text{Cash} \times (0.20 / 0.50) = 0.4 \times \text{Cash}$.
  *   **Why:** Kelly optimizes for the survival of the *capital pool*. If the pool survives but the backers quit, the syndicate is dead. $B_{eff}$ accounts for the human utility of money, not just the mathematical utility.

  #### Step 5: Sizing Calculation (Arithmetic)
  **Branch A: REPEATABLE (from Step 1)**
  1.  Calculate Full Kelly Fraction: $f = \frac{E_{adj} \times (Odds + 1) - 1}{Odds}$ (Simplified: $f \approx E_{adj} / Odds$ for small edges).
  2.  Apply Safety Fraction: $f_{final} = f \times 0.5$. (This is your Half-Kelly rule, now principled as a buffer for $U$).
  3.  **Stake:** $S = f_{final} \times B_{eff}$.

  **Branch B: ONE-SHOT (from Step 1)**
  1.  **Kelly is Void.** Do not calculate Kelly.
  2.  **Calculate Ruin Impact:** $Loss = \text{Stake}$.
  3.  **Survival Threshold:** What is the maximum single loss the syndicate can absorb without triggering a dissolution vote? (e.g., 10% of $B_{eff}$).
  4.  **Termination:** If the stake required to capture the value exceeds the Survival Threshold, **REFUSE** or **ESCALATE**.
  5.  **Why:** In a one-shot scenario, you are not optimizing growth; you are buying a lottery ticket. The constraint is not "optimal growth" but "survival of the entity."

  #### Step 6: Constraints & Execution (Arithmetic)
  1.  **Floor:** If $S <$ Minimum Bet Size, **REFUSE**. (Transaction cost/effort outweighs edge).
  2.  **Cap:** If $S >$ Hard Cap (e.g., 5% of $B_{eff}$), set $S =$ Hard Cap.
  3.  **Escalation:** If $S >$ Partner Sign-off Limit (e.g., 2% of $B_{eff}$), flag for **PARTNER REVIEW**.
  4.  **Output:** Record $S$.

  ---

  ### Running the Cases

  #### Case 1: The Repeatable Thin-Edge
  *   **Scenario:** Weekly sports market. You see 52% probability, Market is 50%. Odds are even (1.0).
  *   **Step 1 (Horizon):** Yes, this happens weekly. **REPEATABLE**.
  *   **Step 2 (Edge):** Raw Edge = 2%. Your historical error ($U$) is 1%. $E_{adj} = 1\%$. (Positive, proceed).
  *   **Step 3 (Correlation):** No other bets this week on this. **SINGLE**.
  *   **Step 4 (Bankroll):** Backers are stable. 50% drawdown wouldn't kill the syndicate. $B_{eff} = \$100,000$.
  *   **Step 5 (Sizing):**
      *   Full Kelly $\approx 1\%$.
      *   Half-Kelly = $0.5\%$.
      *   Stake = $\$500$.
  *   **Step 6 (Constraints):** Above floor, below cap.
  *   **Result:** **Bet \$500.**
  *   **Audit Note:** The math is real. The "Half" is justified by the $U$ buffer in Step 2. If you were more certain of your edge, you could argue for Full Kelly, but the protocol enforces humility.

  #### Case 2: The One-Shot "Ruin" Bet
  *   **Scenario:** A binary political event. Resolves once. You see 60% probability, Market is 50%. Odds are even.
  *   **Step 1 (Horizon):** No, this event never happens again. **ONE-SHOT**.
  *   **Step 2 (Edge):** Raw Edge 10%. $E_{adj}$ 8%.
  *   **Step 5 (Sizing - Branch B):**
      *   **Kelly is Void.** The protocol explicitly forbids using the growth formula here.
      *   **Standard Kelly Calculation (for reference only):** Would suggest staking ~20% of bankroll.
      *   **Survival Threshold:** Partners agree that losing 20% of the bankroll on a single coin flip is unacceptable. Max single loss = 5% of $B_{eff}$.
      *   **Comparison:** Required stake for value (20%) > Survival Threshold (5%).
  *   **Result:** **REFUSE.** (Or Escalate to Partners with a explicit warning: *"This bet requires risking 20% to capture value. Our survival limit is 5%. Placing this bet prioritizes EV over Syndicate Survival."*)
  *   **Why it refuses:** The procedure identifies that Kelly answers "How do I grow forever?" but the bet asks "How much do I risk once?" If the "once" kills you, the growth rate is irrelevant. The refusal point is Step 5, Branch B. The decision turns on **Step 4 (Bankroll Definition)**: Is the syndicate's existence more valuable than the Expected Value of this bet?

  #### Case 3: The Correlated Cluster
  *   **Scenario:** Four bets arrive. All depend on "Company X wins lawsuit."
      *   Bet A: Stock up.
      *   Bet B: Bond spread tightens.
      *   Bet C: Competitor stock down.
      *   Bet D: Legal ETF up.
      *   Individually, Kelly suggests 2% stake on each (Total 8%).
  *   **Step 1:** Mixed, but treated as one underlying truth. **GROUP**.
  *   **Step 3 (Correlation):** **GROUPED.** You cannot size these individually.
      *   Action: Aggregate the exposure. If all four win/lose together, you have 4x the risk.
      *   Protocol requires treating this as **One Position**.
  *   **Step 5 (Sizing):**
      *   Calculate Kelly on the *aggregate* position.
      *   Result: The aggregate edge suggests a 2% total exposure to the "Lawsuit Outcome."
      *   Allocation: Split that 2% across the four markets based on liquidity/price.
  *   **Result:** **Total Stake 2% (split 4 ways).**
  *   **Why:** If you had sized them individually, you would have staked 8%. If the lawsuit is lost, you lose 8% instead of 2%. The procedure prevents the "diversification illusion" where correlated bets look like uncorrelated risk reduction.

  ---

  ### The Extension: Non-Financial Wagers (Time & Reputation)

  **Question:** Can a partner use SSP to stake her professional reputation on a one-shot venture?

  **Verdict:** **Illegitimate.**

  **Reasoning:**
  1.  **Fungibility:** Money is fungible; a dollar lost here can be won there. Reputation is path-dependent and local. A loss in reputation in one sector can bleed into others; a gain does not necessarily compound similarly.
  2.  **Replenishment:** Bankroll can be replenished by outside income (as noted in your prompt). Reputation, once damaged, often has a "ruin state" that is absorbing (you cannot bet again).
  3.  **Utility Curve:** Money has roughly logarithmic utility (which Kelly assumes). Reputation often has a "cliff" utility (fine until you cross a threshold, then career over).

  **The Nearest Honest Thing:**
  Do not use Kelly. Use a **Pre-Mortem Utility Check**.
  *   **Procedure:** Ask the partner: "If this venture fails publicly, what is the specific cost?" (e.g., "I cannot get a job in this industry for 2 years").
  *   **Decision:** Can she absorb that cost *without* the syndicate's financial success offsetting it?
  *   **Rule:** If the answer is No, the bet is size **ZERO**, regardless of the Expected Value.
  *   **Why:** In financial betting, we can survive a drawdown. In reputation betting, "drawdown" can mean permanent exclusion. The SSP Step 4 (Bankroll Definition) attempts to model this for money, but for reputation, the "Effective Bankroll" is often zero because the "Ruin State" is too costly.

  ### Summary of Limitations (Where you will regret)

  1.  **The Error Buffer ($U$):** In Step 2, you must estimate your own error. This is subjective. If you are overconfident, $U$ is too small, and the "principled" Half-Kelly becomes dangerous. *Mitigation:* Track your calibration score quarterly. If you are consistently wrong, increase $U$.
  2.  **The Correlation Grouping:** In Step 3, grouping bets is judgment-heavy. Two bets might look correlated but diverge in a tail event. *Mitigation:* When in doubt, treat them as correlated. It is better to under-bet a correlation than over-bet it.
  3.  **The One-Shot Refusal:** In Case 2, the protocol refuses the bet. You may later see that bet win and feel regret. *Acceptance:* This is the cost of survival. The protocol is designed to keep the syndicate alive, not to maximize every single win. A refusal on a winning one-shot bet is a successful operation of the risk protocol, not a failure.

  **Final Instruction:** Print the SSP. Keep the log. When a partner asks why you passed on a "sure thing," show them Step 1 or Step 5, Branch B. The arithmetic is auditable; the judgment is recorded. That is the only defense you have against variance.
