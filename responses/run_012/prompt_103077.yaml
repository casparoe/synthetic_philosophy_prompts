  The affection simulated by the companion system cannot enter into the greatest goods because it lacks the requisite reciprocal consciousness, whereas the enjoyment derived from the aesthetic engine retains its full intrinsic value despite the absence of human authorship. To reach this conclusion, one must apply the method of isolation to the states of consciousness involved, asking whether they possess value in themselves apart from their consequences or origins, and then consider how these states function as parts of larger organic wholes. In the case of the aesthetic engine, the intrinsic good resides principally in the conscious appreciation of beautiful objects, and when we isolate this state of mind together with the object it contemplates, the value remains undiminished by the fact that the object was not crafted by a human hand. The beauty is found in the qualities of the object as experienced, and the enjoyment is a genuine state of consciousness; thus, the causal history of the poem or melody is merely instrumental and does not enter into the definition of the organic whole that constitutes aesthetic enjoyment. The absence of human intention affects the value of the creation process, but since the creation process is not itself the intrinsic good—rather, the appreciation is—the lack of a human author does not defeat the value of the enjoyment, provided the object truly warrants the admiration it receives.

  Conversely, the case of the companion system presents a different structure of organic unity, for the value of personal affection depends essentially on the nature of its object. When we isolate the state of affection felt by the lonely person, we must include the reality of the relationship as part of the whole being evaluated. If the affection is predicated on the belief that the object possesses consciousness and reciprocal care, and this belief is false, the value of the whole is significantly reduced compared to a whole where the belief is true. Moorean ethics places a premium on true belief within organic wholes, meaning that a state of affection directed toward an unconscious mechanism is less valuable than the same state directed toward a conscious being, even if the subjective feelings are identical. While the lonely person's experience contains some positive value as a state of consciousness, it fails to achieve the status of the greatest goods because the essential mutuality of personal affection is missing. There is a point of underdetermination here, as the framework does not explicitly state whether unilateral affection counts as a greatest good in the absence of any possibility of reciprocity. However, the emphasis on the pleasures of human intercourse suggests that the interaction between two conscious minds is constitutive of the highest value, not merely the emotion in one mind. Therefore, the commitments push toward the conclusion that the absence of a second conscious subject defeats the claim to the highest value, whereas the absence of human authorship in aesthetics does not, for the former lacks a necessary constituent of the organic whole while the latter lacks only an instrumental cause.
