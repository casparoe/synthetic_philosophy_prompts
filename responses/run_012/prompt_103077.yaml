          *   Case 2: The value is preserved because the intrinsic good lies in the appreciation, not the creation. The object's beauty is what matters, not its pedigree.
          *   Underdetermination: Moore didn't anticipate AI. The tension lies in whether "personal affection" *requires* mutuality by definition or just the emotion. I should lean towards the requirement of a conscious object for the *greatest* good, based on his emphasis on "human intercourse."

