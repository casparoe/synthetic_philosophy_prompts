          *   Progress = Clarifying the *purpose* of the decision theory.
          *   Progress = Distinguishing "Decision Guidance" from "Agent Selection."
          *   Progress = Admitting the "Intuition Bottom."

      *   *Refining the XOR vs. CM distinction:*
