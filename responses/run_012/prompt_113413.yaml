      *   *Section 2: The Metaphysics of Influence.* This adds depth. CDT requires causal arrows. UDT allows logical correlation (acausal trade). This is why "pre-commitment" doesn't solve it for CDT (you can't pre-commit causally to a past prediction).
      *   *Section 3: The Telos of Rationality.* "Winning" vs. "Reasoning Correctly." If rationality is about winning, UDT wins. If it's about not being causally efficacious in a vacuum, CDT wins.
      *   *Section 4: Diagnosis of the Impasse.* It is a **categorial mismatch**. They are answering different questions.
      *   *Section 5: What Counts as Progress?*
