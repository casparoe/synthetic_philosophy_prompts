          *   *CDT:* Paying on Tails costs \$100. It doesn't cause the Heads outcome (already happened/predicted). Net utility: -\$100. Decline: \$0. *Recommendation: Decline.*
          *   *EDT/UDT:* Paying correlates with getting \$10k in the Heads world. Expected utility of "Policy: Pay" > "Policy: Decline". *Recommendation: Pay.*
      *   **XOR Blackmail (XOR):**
          *   *Structure:* Message sent iff (Termites XOR Pay). You got the message. Termites cost \$1M. Pay costs \$1k.
          *   *CDT:* Paying doesn't remove termites. If termites are there, you lose \$1M + \$1k. If not, you lose \$1k. Declining: If termites, lose \$1M. If not, lose \$0. Since paying doesn't *cause* termites to vanish, CDT struggles with the correlation. Actually, standard CDT often says decline because the act doesn't change the termite state.
          *   *EDT/UDT:* Paying is evidence that termites are *not* present (because if you were a payer, the message implies Pay=True, so Termites=False). *Recommendation: Pay.*

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Disagreement is about Token Acts vs. Procedures/Policies.
      *   *Assessment:* This is very close to the mark, but it might be slightly too simplistic. It's not just "act vs. procedure," it's about *what constitutes the locus of control* and *the reference class for rationality*.
      *   *Refinement:* It's about whether rationality is assessed *ex post* (given the actual state of the world) or *ex ante* (given the distribution of possible worlds before specific facts are known). It's also about the metaphysics of counterfactuals.

  4.  **Identify the Core Fault Lines:**
      *   **Fault Line 1: The Object of Evaluation (Act vs. Policy).**
          *   CDT focuses on the *token act* at the moment of decision. "Given I am here, on Tails, does handing over \$100 change anything?" No.
          *   UDT/FDT focuses on the *algorithm* or *policy*. "What output should my source code produce given this input?"
          *   *Diagnosis:* This is a major part of the user's hypothesis. It explains the "pre-commitment" agreement. Everyone agrees *ex ante* the policy is good. CDT says *ex post* the act is bad. UDT says *ex post* you still follow the *ex ante* policy.
      *   **Fault Line 2: The Metaphysics of Counterfactuals (Causal vs. Logical/Subjunctive).**
          *   CDT uses standard causal counterfactuals: $P(Result | do(Act))$. In CM, $do(Pay)$ doesn't change the Coin.
          *   UDT/FDT uses logical counterfactuals: "If my algorithm outputted 'Pay', would the Predictor have predicted that?" This treats the prediction as logically linked to the decision, not just causally.
          *   *Diagnosis:* This is deeper than just "act vs. policy." It's about whether logical correlation counts as a channel of influence.
      *   **Fault Line 3: The Definition of 'Rational' (Instrumental Success vs. Procedural Correctness).**
          *   "Money on the table" camp: Rationality = Winning (getting the money).
          *   "Sucker" camp: Rationality = Not being exploited in the actual world / Not paying for nothing.
          *   *Diagnosis:* This is a verbal/conceptual dispute about the telos of decision theory.

  5.  **Synthesize the Diagnosis:**
      *   The user's hypothesis is *substantially correct* but needs nuance. It's not just "act vs. procedure," it's "act in the actual world" vs. "algorithm across possible worlds."
      *   However, there is a deeper layer: **The status of the "actual" world.**
      *   In CM, once the coin is Tails, the Heads world is counterfactual. CDT says "Forget the counterfactual, optimize the actual." UDT says "The counterfactual is part of the expected utility calculation of the *type*."
      *   In XOR, the termite state is fixed. CDT says "Fixed." EDT/UDT says "Your decision type gives evidence about the fixed state."
      *   *Crucial Distinction:* Is the disagreement about *normativity* (what should I do?) or *semantics* (what does 'should' mean?)? It's likely both.
