prompt: |-
  I run a small advising service for people who've decided to give away a big chunk of their income or time, and I keep hitting the same wall: they want to know how much a consequentialist morality actually requires of them, and I don't have a procedure, just vibes. I need you to turn the demandingness debate into something I can actually run in a 45-minute session. My clients are mostly smart non-philosophers, alot are burning out, some are trying to decide whether to donate a kidney or quit a job, and I'm not a therapist, so I need to know where to stop and refer out. I have to run the procedure by my supervisor, who is a philosopher, so it needs to be defensible. Don't give me a reading list or citations; give me the procedure. I want the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it says this is required, where it says this is optional, and where it hands the decision back to the client because it's a values call. Keep seperate the demandingness objection and the integrity objection, because I think they come apart: one is about how much sacrifice is asked, the other about what kind of sacrifice it is. Build in the distinction between the cost of acting and the cost of not acting, and the idea that some sacrifices damage the agent's capacity to keep acting morally over time. Also use the rule-consequentialist move that a moral code demanding too much might be self-defeating because people can't internalize it, but don't let that become a get-out-of-jail-free card. And handle the supererogation problem: if an act is morally best, how can it be optional? Then run it on two cases: (1) a client who is considering donating a kidney to a stranger, and (2) a client who is considering skipping their sister's wedding to work on a political campaign they think is high-impact. For the second one, I want the procedure to give the answer I won't like, and I want you to say why the procedure can't settle some of it. Finally, tell me what the procedure cannot do and where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested advising procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs a small advising service for effective altruists/high-impact donors/volunteers.
      *   **Problem:** Clients ask "How much does consequentialism actually require?" User currently has no procedure, just "vibes." Needs a structured 45-minute session protocol.
      *   **Constraints:**
          *   Clients: Smart non-philosophers, some burning out, facing big decisions (kidney donation, quitting jobs).
          *   User Role: Advisor, *not* a therapist (needs clear referral boundaries).
          *   Supervisor: A philosopher (needs philosophical defensibility).
          *   Output: No reading lists/citations. Just the procedure (questions, sufficient answers, stop points, required/optional/value call distinctions).
          *   Key Distinctions: Demandingness vs. Integrity, Cost of Acting vs. Cost of Not Acting, Sustainability (capacity to keep acting), Rule-Consequentialist internalization constraint (without abuse), Supererogation problem.
          *   Test Cases: (1) Kidney donation to stranger, (2) Skipping sister's wedding for political campaign.
          *   Specific Requirement for Case 2: The procedure must give an answer the user "won't like" (presumably implying the procedure might demand more than feels comfortable or highlights ambiguity) and explain why it can't settle everything.
          *   Final Section: Limitations and misfire points.

  2.  **Deconstruct the Philosophical Core:**
      *   *Demandingness Objection:* Consequentialism asks too much (poverty, exhaustion).
      *   *Integrity Objection:* Consequentialism alienates people from their own projects/relationships (Williams).
      *   *Sustainability:* If I burn out, I can't help anyone later. (Long-term impact).
      *   *Rule-Consequentialism:* A code no one can follow is bad. We need a "humanly possible" standard.
      *   *Supererogation:* If it's the *best* act, isn't it obligatory? Or can it be "good to do, okay not to"?
      *   *Cost of Not Acting:* The harm caused by inaction.

  3.  **Drafting the Procedure (The "Consequentialist Capacity Audit"):**
      *   *Goal:* A 45-minute structured interview.
      *   *Structure:*
          1.  Intake/Definition (5 mins)
          2.  Impact & Cost Assessment (10 mins)
          3.  Sustainability & Integrity Check (10 mins)
          4.  Generalization & Rule Test (10 mins)
          5.  Verdict & Referral (10 mins)
      *   *Philosophical Defensibility:* Needs to balance act-consequentialist pressure with rule-consequentialist stability and integrity constraints.

      *   *Step 1: The Baseline (Defining the Act).* What exactly are they doing?
      *   *Step 2: The Consequentialist Calculus (Cost of Acting vs. Cost of Not Acting).* This addresses the core utilitarian pressure.
      *   *Step 3: The Sustainability Constraint (Capacity).* If this breaks you, you can't do good later. This addresses burnout.
      *   *Step 4: The Integrity/Demandingness Split.* Is the cost just *high* (demandingness) or does it violate *who they are* (integrity)?
      *   *Step 5: The Rule-Consequentialist Check.* If everyone did this, would the system collapse? Or if everyone *had* to do this, would morality become impossible?
      *   *Step 6: The Supererogation/Requirement Line.* When does "best" become "required"?
      *   *Referral Point:* Mental health distress, coercion, identity crisis.

  4.  **Refining the Decision Logic (Required vs. Optional vs. Value Call):**
      *   *Required:* High impact, low/medium sustainable cost, no integrity violation, generalizable.
      *   *Optional (Supererogatory):* High impact, but high cost to integrity or sustainability, OR marginal impact gain vs. huge personal cost.
      *   *Value Call:* Where the math is close, or where personal projects weigh heavily against abstract good.
      *   *Stop/Refer:* Signs of depression, coercion, or inability to distinguish self from utility.

  5.  **Developing the Test Cases:**

      *   *Case 1: Kidney to Stranger.*
          *   Impact: High (saves life).
          *   Cost: Physical risk, recovery time.
          *   Sustainability: Usually one-off, doesn't prevent future earning (mostly).
          *   Integrity: Physical autonomy.
          *   Verdict: Likely Supererogatory (Optional but praiseworthy). Why? High physical cost/integrity boundary, even if impact is high. Rule test: If *required*, people would hide medical info.

      *   *Case 2: Skipping Sister's Wedding for Campaign.*
          *   Impact: Marginal/Uncertain (one volunteer vs. thousands).
          *   Cost: Relationship damage (Integrity/Personal Projects).
          *   Sustainability: Relationship loss might reduce long-term support network.
          *   User Constraint: "Give the answer I won't like." (Maybe the procedure suggests skipping it *is* required if the campaign is truly existential, OR it highlights that the user's intuition that it's *obviously* wrong to skip might be philosophically shaky). Let's aim for: The procedure shows it's *not clearly optional* if the impact claims are true, forcing the client to confront the hard math, but ultimately leaves it as a Value Call because relationship value is hard to quantify.
          *   Actually, better interpretation of "answer I won't like": The procedure might conclude that skipping the wedding is *permissible* (optional) even if the campaign is high impact, because of the Integrity constraint. Or, conversely, that it is *required* despite the social cost. Let's go with the latter to challenge the user's likely bias that family always comes first. If the campaign prevents existential risk, consequentialism demands the wedding be skipped. The procedure should reflect that tension.
          *   *Correction:* The prompt says "I want the procedure to give the answer I won't like." As an advisor, the user probably wants to tell clients "It's okay to go to the wedding." If the procedure says "No, the math demands you work," that's the uncomfortable answer.
          *   *Why it can't settle:* Uncertainty of impact vs. certainty of relationship harm.

  6.  **Addressing Specific Philosophical Nuances:**
      *   *Demandingness vs. Integrity:* Demand = "It costs too much money/energy." Integrity = "This isn't *me* / This violates my commitments."
      *   *Cost of Not Acting:* Explicitly weigh the harm of inaction.
      *   *Rule-Consequentialism:* "Can this be a universal requirement without collapsing morale?"
      *   *Supererogation:* Distinguish between "Maximizing" (must do best) and "Satisficing" (must do good enough). The procedure needs a threshold.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, structured, clinically detached but empathetic.
      *   *Format:* Step-by-step script/logic flow.
      *   *Safety:* Clear red flags for therapy referral.

  8.  **Review against Constraints:**
      *   45-minute session? Yes, timed sections.
      *   Defensible to philosopher supervisor? Yes, uses standard distinctions (Williams, Singer, Hooker concepts without naming them).
      *   No citations? Checked.
      *   Case 1 & 2 run-through? Included.
      *   Limitations section? Included.

  9.  **Final Polish:** Ensure the distinction between "Required," "Optional," and "Value Call" is crisp. Ensure the "Answer I won't like" in Case 2 is explicit. (I will structure Case 2 so the procedure forces the client to admit that if their impact estimates are true, skipping is *required*, which contradicts common social intuition).

      *(Self-Correction on Case 2)*: If I make the procedure say "Skip the wedding," that might be too act-utilitarian. To make it defensible to a philosopher supervisor while still being uncomfortable, I need to show that *if* the impact is truly existential, the integrity objection loses weight. The "answer I won't like" is likely that the procedure cannot definitively rule out the requirement to skip, forcing the client to sit with the guilt of choosing family over "the greater good." Or, that the procedure validates skipping it, which the advisor (user) feels is cold. Let's go with: The procedure indicates that *if* the impact claims hold, skipping is *required*, not optional. This challenges the "family first" intuition.

      *(Refining the "Answer I won't like")*: The prompt says "I want the procedure to give the answer I won't like." As an advisor, I probably want to reassure clients they can have a life. If the procedure says "Actually, you probably have to skip the wedding," that's the uncomfortable truth of consequentialism. I will write it that way.

  10. **Final check on "Where to stop and refer out":** Crucial. If they are dissociating, depressed, or being coerced by a community, that's therapy/ethics territory, not advising.

  11. **Final check on "Supererogation":** Need a specific step that determines if an act crosses from "heroic" to "mandatory." Threshold: Marginal cost vs. Marginal gain.

  Let's assemble the procedure.

  *Name:* The Consequentialist Capacity & Integrity Protocol (CCIP).
  *Time:* 45 Mins.
  *Structure:* 5 Phases.

  *Phase 1: Definition & Impact (0-10)*
  *Phase 2: Cost & Sustainability (10-20)*
  *Phase 3: Integrity & Identity (20-30)*
  *Phase 4: Generalization & Requirement (30-40)*
  *Phase 5: Verdict & Referral (40-45)*

  *Logic:*
  1. Is the impact real?
  2. Is the cost sustainable?
  3. Does it violate core integrity?
  4. Is it generalizable as a rule?
  5. Does it cross the threshold of obligation?

  *Case 1 (Kidney):* High impact, high physical cost, low long-term earning impact. Verdict: Supererogatory (Optional).
  *Case 2 (Wedding):* Uncertain impact, high relationship cost. Verdict: *If* impact is certain/high -> Required. *If* uncertain -> Optional. The "answer I won't like" is that the procedure forces them to treat the relationship as a variable in the equation, not a trump card.

  *Wait, one more check:* "I want the procedure to give the answer I won't like."
  If I am an advisor, I probably want to tell people "Go to the wedding." If the procedure says "The math says skip it," that's the answer I won't like. I will ensure the logic leads there contingent on their own impact estimates.

  *Limitations:* Cannot measure subjective value of relationships accurately. Cannot resolve moral uncertainty. Cannot fix burnout (therapy).

  Okay, ready to write.
answer: |-
  # The Consequentialist Capacity & Integrity Protocol (CCIP)
  **Session Duration:** 45 Minutes
  **Target Audience:** High-functioning non-philosophers engaged in high-stakes altruism.
  **Goal:** Determine moral requirement status of a specific sacrifice (Required, Optional/Supererogatory, or Contraindicated).

  ---

  ## Phase 1: Impact & Baseline (Minutes 0–10)
  **Goal:** Establish the consequentialist baseline. Separate wishful thinking from projected impact.

  **Question 1.1:** "Describe the specific action you are considering. Now, describe the specific alternative (usually the status quo)."
  *   **Sufficient Answer:** Concrete behaviors (e.g., "Surgery on Tuesday" vs. "No surgery"; "Work 12 hours Saturday" vs. "Attend wedding").
  *   **Insufficient Answer:** Vague intentions ("Help more," "Be a better person").
  *   **Procedure Stop:** If the client cannot articulate the alternative, pause. You cannot weigh costs without a counterfactual.

  **Question 1.2:** "What is the *expected* positive outcome of the action, measured in the metric you care about (lives saved, policy change, dollars generated)? What is the probability of that outcome occurring?"
  *   **Sufficient Answer:** A range with a confidence level (e.g., "10% chance of shifting policy," "Near 100% chance of saving one life").
  *   **Insufficient Answer:** Certainty without evidence ("It will definitely change everything").
  *   **Procedure Stop:** If the client claims 100% certainty on complex systemic outcomes, flag for epistemic overconfidence. This is not a therapy referral yet, but note it for Phase 5.

  **Question 1.3:** "What is the cost of *not* acting? Who is harmed, and how much, if you choose the alternative?"
  *   **Sufficient Answer:** Specific harm identified (e.g., "One person remains on dialysis," "Campaign loses 10 hours of labor").
  *   **Why this matters:** This addresses the **Cost of Not Acting**. Consequentialism weighs the harm of omission, not just the cost of commission.

  ---

  ## Phase 2: Sustainability & Capacity (Minutes 10–20)
  **Goal:** Assess the "Cost of Acting" through the lens of long-term moral capacity. This addresses burnout and the self-defeating nature of excessive demands.

  **Question 2.1:** "If you take this action, what is your capacity to act morally in 1 year? In 5 years?"
  *   **Sufficient Answer:** A projection of future capability (e.g., "I will be recovered and earning again," or "I will be resentful and quit the movement").
  *   **Insufficient Answer:** "I'll deal with that later."
  *   **Rule:** If the action destroys the agent's capacity to do good in the future, the action is **Contraindicated** (unless the immediate good is existential/catastrophic).
  *   **Philosophical Defense:** A moral code that destroys the moral agent is self-defeating (Rule-Consequentialist constraint).

  **Question 2.2:** "Is this sacrifice a one-time cost or a recurring tax?"
  *   **Sufficient Answer:** Distinguishes between capital expenditure (kidney) and operational expenditure (weekly overtime).
  *   **Decision Point:** Recurring taxes that exceed 20% of discretionary resources (time/money) trigger a **Sustainability Warning**.

  **Question 2.3:** "Are you making this choice from a place of resource surplus or resource deficit?"
  *   **Sufficient Answer:** Honest assessment of current mental/physical reserves.
  *   **Referral Flag:** If the client describes chronic exhaustion, insomnia, or inability to feel joy *outside* of this work, **STOP AND REFER**. This is burnout/depression, not moral philosophy. You are an advisor, not a clinician.

  ---

  ## Phase 3: Integrity & Identity (Minutes 20–30)
  **Goal:** Separate the **Demandingness Objection** (this is hard) from the **Integrity Objection** (this isn't me).

  **Question 3.1:** "Does this action violate a commitment that makes you *you*? (e.g., promises to family, core religious vows, deep personal projects)."
  *   **Sufficient Answer:** Identification of specific relational or identity-based boundaries.
  *   **Distinction:**
      *   *Demandingness:* "I don't want to spend the money." (Comfort cost).
      *   *Integrity:* "This betrays my promise to my sister." (Identity cost).
  *   **Procedure Logic:** Integrity costs weigh heavier than comfort costs. A consequentialist code that requires constant betrayal of personal commitments alienates the agent from their life, leading to moral disengagement.

  **Question 3.2:** "If you do *not* take this action, will you be able to look at yourself in the mirror? If you *do* take it, will you resent those you helped?"
  *   **Sufficient Answer:** Acknowledgment of psychological fallout.
  *   **Decision Point:** If the action generates guaranteed resentment that poisons future altruism, the **Integrity Constraint** vetoes the action, even if the immediate math works.

  ---

  ## Phase 4: Generalization & Requirement (Minutes 30–40)
  **Goal:** Determine if the act is **Required**, **Optional (Supererogatory)**, or a **Value Call**. This handles the supererogation problem and the rule-consequentialist check.

  **Question 4.1 (The Universalization Test):** "If everyone in your position were *required* to do this, would the moral system collapse?"
  *   **Example:** If everyone were *required* to donate a kidney, medical systems would fail due to coercion/screening issues.
  *   **Logic:** If universal requirement is self-defeating, the act cannot be **Required**. It must be **Optional**.

  **Question 4.2 (The Marginal Gain Test):** "Is the good achieved by this action *significantly* larger than the good achieved by the next best alternative you could do with those resources?"
  *   **Threshold:** If the gain is marginal (e.g., 10% more impact) but the cost is high (e.g., missing a wedding), it is **Optional**.
  *   **Threshold:** If the gain is catastrophic prevention (e.g., preventing existential risk) and the cost is personal inconvenience, it trends toward **Required**.

  **Question 4.3 (The Supererogation Line):** "Does this action go *beyond* what can reasonably be internalized as a duty?"
  *   **Decision Logic:**
      *   **Required:** High Impact + Low/Medium Sustainable Cost + No Integrity Violation.
      *   **Optional (Supererogatory):** High Impact + High Cost OR Integrity Violation OR Universalization Fails.
      *   **Value Call:** Impact is uncertain OR Cost to Integrity and Impact are roughly equivalent in weight.

  ---

  ## Phase 5: Verdict & Referral (Minutes 40–45)
  **Goal:** Deliver the classification and check for safety.

  **Output Options:**
  1.  **Morally Required:** The cost of not acting outweighs the personal cost, sustainability is intact, integrity is preserved.
  2.  **Supererogatory (Heroic but Optional):** The act is good, but demanding it as a rule would be self-defeating or violate integrity.
  3.  **Value Call:** The procedure cannot resolve the tension between personal projects and abstract good. The client must choose based on preference, not moral obligation.
  4.  **Contraindicated:** The action destroys future capacity or violates core integrity without sufficient compensatory good.
  5.  **Refer Out:** Signs of clinical distress, coercion, or inability to distinguish self-worth from utility.

  ---

  ## Running the Procedure on Test Cases

  ### Case 1: Donating a Kidney to a Stranger
  **Phase 1 (Impact):** High impact (saves life/improves quality of life significantly). Probability of success is high medically. Cost of not acting: Stranger remains sick/dies.
  **Phase 2 (Sustainability):** One-time physical cost. Recovery time is finite. Long-term earning capacity mostly intact. **Pass.**
  **Phase 3 (Integrity):** Physical autonomy is a core integrity boundary. However, voluntary donation does not typically violate identity commitments unless the client has dependents who rely on their health. **Neutral/Pass.**
  **Phase 4 (Generalization):** If everyone were *required* to donate a kidney, the concept of bodily autonomy collapses, and medical screening becomes coercive. The system fails.
  **Verdict:** **Supererogatory (Optional).**
  **Reasoning:** While the impact is high, the **Universalization Test** fails. A moral code requiring organ donation is self-defeating because it violates the bodily integrity necessary for people to feel safe in society. The client is not morally failing by keeping the kidney.

  ### Case 2: Skipping Sister's Wedding for Political Campaign
  **Phase 1 (Impact):** Client claims "High Impact." Procedure forces scrutiny: Is it *actually* existential? Or just "important"? Let's assume client insists the campaign prevents significant harm. Cost of not acting: Campaign loses one volunteer; potential policy failure.
  **Phase 2 (Sustainability):** Skipping one event is sustainable. However, if this sets a precedent of skipping all family events, burnout/isolation risk rises. **Warning.**
  **Phase 3 (Integrity):** Relationship with sister is a core "personal project" (Williams). Betraying this commitment damages the client's identity as a sibling. **Integrity Cost High.**
  **Phase 4 (Generalization):** If everyone were *required* to skip family weddings for political work, social fabric disintegrates. Support networks vanish. However, if the political stakes are truly existential (e.g., preventing war), the "social fabric" argument weakens.
  **Phase 5 (Verdict):** **Value Call (with a lean toward Required if impact is certain).**
  **The Answer You Won't Like:** If the client's Phase 1 impact assessment holds (i.e., this campaign actually prevents catastrophic harm), the procedure indicates that skipping the wedding is **Required**, not Optional.
  **Why:** The "Cost of Not Acting" (catastrophic harm) outweighs the "Integrity Cost" (sister's anger), *provided* the relationship is not the sole source of the client's moral capacity.
  **Why the Procedure Can't Settle It:** The procedure relies on the client's impact estimate. If the impact is uncertain (which it usually is for political campaigns), the **Integrity Cost** dominates, making it a **Value Call**. The procedure cannot objectively measure the value of the sister's trust vs. the abstract political good. It forces the client to admit that *if* their utilitarian math is right, their family obligation is secondary. This is the uncomfortable truth: Consequentialism does not respect family boundaries unless those boundaries produce good consequences.

  ---

  ## Limitations & Misfire Points
  **1. The Quantification Trap:**
  The procedure assumes clients can quantify "impact" and "integrity cost." They cannot. In Case 2, the procedure misfires if the client overestimates their individual impact (common in activism). The procedure will validate delusions of grandeur if Phase 1 is not rigorously challenged.

  **2. The "Cold Math" Problem:**
  The procedure separates "Demandingness" (hard) from "Integrity" (wrong). In practice, clients experience them as the same pain. Telling a client "This violates integrity, so it's optional" might not stop them from feeling *guilty*. The procedure solves the philosophical classification, not the emotional distress.

  **3. The Supererogation Gap:**
  The procedure classifies acts as Optional, but high-impact communities often culture shame around Optional acts. A client may be told "This is Supererogatory" by you, but hear "You're selfish" from their peer group. The procedure cannot protect them from community coercion.

  **4. Referral Blindspots:**
  The procedure identifies burnout (Phase 2), but it cannot identify moral injury or trauma. If a client is struggling because they *did* skip the wedding and now regret it, this advising protocol is insufficient. They need therapy to process grief, not a moral calculus to justify the choice.

  **5. Rule-Consequentialist Loophole:**
  Clients may use the "Universalization Test" (Phase 4.1) as a get-out-of-jail-free card. "If everyone did this, it would be bad, so I don't have to." You must enforce the constraint: This test only applies to *requirements*, not to *permissions*. It explains why an act isn't mandatory, not why it isn't good.

  **Supervisor Note:** This protocol is defensible because it does not advocate for Act-Consequentialism (which demands maximization in every instance) but incorporates Rule-Consequentialist stability and Integrity constraints to ensure the moral agent remains functional. It acknowledges that a morality that destroys the agent is ultimately useless.
