answer: |-
  **Preamble: Constitutional Functions and Satirical Objectives**

  The draft below operationalizes the core tension of constitutional monarchy: the dichotomy between the *dignified* (ceremonial, symbolic) and *efficient* (political, operative) parts of the constitution. The satire targets two standard objections. First, if the monarch is merely a rubber stamp (countersignature required), why is the office hereditary rather than appointed or elected? Second, if the monarch retains reserve powers (dismissal, dissolution), is it safe to vest such discretion in an untrained hereditary successor? The HR document treats these contradictions as administrative necessities. The "benefit" of the monarchy is framed as a lack of democratic mandate, while the "risk" of reserve powers is mitigated by bureaucratic negligence (no training). The abdication clause ensures the officeholder is trapped, reinforcing the stability argument while highlighting the lack of consent.

  ***

  **KINGDOM OF RAVNMARK**
  **PALACE OFFICE OF THE HEAD OF STATE**
  **PERSON SPECIFICATION AND TERMS OF APPOINTMENT (POST CODE: M-01)**

  **1. Introduction**
  Following the codification of the Constitution of Ravnmark, the Palace Office of the Head of State invites attention to the vacancy for the position of Monarch. This document outlines the competencies, duties, and conditions associated with the office. Please note that while this pack is published for transparency, the recruitment process operates under distinct statutory constraints.

  **2. Person Specification**

  **2.1 Essential Criteria**
  Candidates must demonstrate a complete absence of partisan political affiliation, verified by a lack of voting history. The officeholder must possess the capacity to maintain strict neutrality, defined as the ability to hold no personal opinion on matters of public policy. Applicants must demonstrate evenness of temper under prolonged ceremonial stress and the stamina to remain standing for periods exceeding four hours. Professional discretion is paramount; the successful candidate must never disclose the content of weekly meetings with the Prime Minister during their tenure. A background in any other profession is not required and may be viewed as a liability regarding availability.

  **2.2 Desirable Criteria**
  Preference will be given to candidates with hobbies that are harmless, non-controversial, and easily photographed (e.g., gardening, stamp collection). The ability to read aloud texts written by others with conviction and apparent ownership is highly valued. Candidates should possess no known views on contested social, economic, or foreign policy issues. Familiarity with the Constitution is not required, as constitutional advice will be provided by the government of the day.

  **3. Schedule of Duties**

  **3.1 Ordinary Functions**
  The Officeholder shall open legislative sessions, confer honors, and receive foreign dignitaries. All public acts require the countersignature of a responsible minister, who assumes full political liability. The Officeholder must sign such documents promptly upon presentation.

  **3.2 Reserve Powers**
  In the event that the ordinary machinery of government fails—a formula left undefined by Article 12—the Officeholder may be required to exercise reserve powers. These include dismissing a government that has lost the confidence of the legislature, refusing a dissolution of parliament, or selecting a Prime Minister following an inconclusive election. Due to the rarity of these events (estimated frequency: once per century), no training will be provided. The Officeholder is expected to exercise personal discretion instinctively. Note: The Royal Acts Tribunal may declare such acts were taken without proper advice, but cannot undo them.

  **3.3 Record Keeping**
  The Officeholder must keep a sealed record of weekly meetings with the Prime Minister. These records shall remain closed to historians for thirty years following the end of the appointment.

  **4. Conflicts of Interest**
  The Officeholder is prohibited from voting, holding membership in any political party, or being sued in the realm's courts. Regarding private wealth, the Officeholder retains personal assets but must avoid commercial ventures that conflict with state interests. Regarding religion, the Officeholder must serve as the temporal head of the state church regardless of personal belief. Regarding charitable patronage, the Officeholder may patronize any organization provided it does not lobby the government. Family members are not exempt from public scrutiny, though the Officeholder is not responsible for their private conduct.

  **5. Terms and Conditions of Appointment**

  **5.1 Tenure**
  Appointment is for life. There is no standard resignation procedure.

  **5.2 Termination**
  The only mechanism for early exit is abdication. Per Article 15, abdication requires both an Act of the Legislature and the monarch's own assent. Consequently, an Officeholder wishing to resign must persuade the government to legislate their exit and must sign the legislation themselves.

  **5.3 Remuneration**
  A Civil List allowance is provided to cover official duties. Private wealth is separate.

  **6. Benchmarking**
  This post has been benchmarked against an elected ceremonial presidency. While an elected president possesses a democratic mandate, this is considered a disadvantage for the specific functions of this office. The Monarch is useful precisely because the officeholder has no democratic mandate to spend. This ensures that during constitutional crises, the Officeholder cannot claim to represent the people against the legislature. The hereditary principle is retained to ensure the Officeholder is not indebted to any political party for their position. However, this ensures the Officeholder is also untrained for the reserve powers mentioned in Section 3.2. The risk is deemed acceptable given the rarity of such crises.

  **7. How to Apply**
  Please note that this post is not open to application. Recruitment is conducted via lineal succession. The successful candidate was identified at birth. Current incumbents need not apply. Inquiries regarding the eligibility of heirs who decline the position should be directed to the Office of the Lord Chancellor, noting that the Constitution is silent on this matter.

