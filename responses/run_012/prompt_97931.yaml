answer: |-
  You have spotted the exact pressure point where this argument usually breaks. Your barometer analogy is not just a good intuition pump; it is the standard philosophical counter-move to this specific objection against epiphenomenalism.

  Your friend's argument is a version of the "self-stultifying" objection (often associated with Huxley, but refined by contemporary philosophers like Frank Jackson in his earlier work). It claims that if epiphenomenalism were true, we couldn't know it, or even know about our own minds.

  Here is the breakdown of where the argument fails, why Step (6) looked so tempting, what you pay to fix it, and whether that "lurking problem" you sensed is still there.

  ### 1. Which step do you drop?
  **You drop Step (6).**

  > *(6) A judgment that isn't sensitive to the state it's about can't be a reliable judgment about that state, and an unreliable judgment isn't knowledge.*

  This step assumes a specific theory of knowledge: either a **Causal Theory of Knowledge** (to know X, X must cause your belief) or a **Sensitivity Condition** (if X weren't true, you wouldn't believe it).

  Your barometer analogy destroys the Causal Theory version immediately.
  *   **Storm Case:** Storm $\leftarrow$ Low Pressure $\rightarrow$ Barometer Reading.
  *   **Epiphenomenal Case:** Quale $\leftarrow$ Brain State $\rightarrow$ Verbal Report.

  In both cases, the thing you are gaining knowledge *about* (the storm / the quale) is not causing the indicator (the barometer / the report). They are both effects of a common cause. Yet, we agree the barometer gives knowledge of the storm. Therefore, direct causation from the object of knowledge to the belief is not necessary for knowledge. A reliable nomological (law-like) connection suffices.

  ### 2. Why did Step (6) look so reasonable?
  It looks reasonable because in **most** everyday cases, the object of knowledge *does* cause the belief.
  *   I know there is a cup because the cup reflects light into my eyes.
  *   I know I am in pain because the pain causes my distress.

  We are intuitively wired to think causation is the glue of knowledge. Furthermore, Step (6) leverages a specific intuition about **counterfactuals**. If epiphenomenalism is true, then in a "Zombie World" (physically identical to ours but without qualia), you would make the exact same reports.
  *   *Friend's Intuition:* "If you'd say 'I see red' even if you didn't see red (because the brain does it all), how can you claim to know you see red?"

  This makes the belief look "insensitive." But modern epistemology largely accepts that sensitivity is too strong a condition for knowledge. We can have knowledge via reliable correlation even if the belief isn't sensitive in that specific counterfactual sense.

  ### 3. What do you pay for dropping (6)?
  If you drop (6) to save epiphenomenalism from self-refutation, you pay a metaphysical price. You must accept a **Pre-Established Harmony** or **Brute Psychophysical Laws**.

  To make the barometer analogy work for the mind, the correlation between the Brain State and the Quale must be rock solid.
  *   **The Cost:** You have to explain *why* the physical state that causes the report "Red" is always accompanied by the *red* quale and not the *green* quale (or no quale at all).
  *   If the physical causes the report, and the physical also causes (or necessitates) the quale, there must be a law linking Physical State P to Quale Q.
  *   Since Q does nothing, this law is one-way. It is a "free floating" law of nature that ensures your internal movie matches your physical behavior, even though the movie doesn't touch the projector.

  This isn't a logical contradiction, but it is metaphysically extravagant. It requires the universe to be set up such that our reports about our minds are reliably true, even though our minds are causally disconnected from those reports. It feels like a miracle of coordination.

  ### 4. Does this save Epiphenomenalism?
  It saves it from **self-refutation**, but it does not save it from **implausibility**.

  Your friend's argument was trying to prove (9) "Epiphenomenalism is false" by showing it leads to a contradiction (we know our minds vs. we can't know our minds). By dropping (6), you show there is no contradiction. Epiphenomenalism is *logically possible*.

  However, your intuition that "something is still lurking underneath" is correct. Fixing Step (6) solves the *knowledge* problem, but it leaves two massive problems standing:

  #### A. The Reference Problem (The Semantic Objection)
  This is the deeper version of your worry. Even if I can *know* I have a quale via a common-cause link, how does my word "red" **refer** to the red-quale?
  *   When I learn the word "red," I ostensively define it: "That experience is red."
  *   But if the experience (quale) is causally inert, it didn't cause my attention, it didn't cause my memory, and it didn't cause my utterance.
  *   So what fixes the meaning of my word "red" to *that* specific quale rather than the brain state, or the external object, or nothing at all?
  *   **The Worry:** If the quale plays no causal role in my learning to speak, it is mysterious how my language manages to "latch onto" it. The barometer works because we calibrated it to the pressure. Who calibrated my brain to label the quale "red"?

  #### B. The Evolutionary Problem
  This is the most common reason philosophers reject epiphenomenalism, even if they accept the "common cause" fix for knowledge.
  *   If qualia are causally inert, they cannot affect survival or reproduction.
  *   Natural selection selects for traits that cause adaptive behavior.
  *   If the *feeling* of pain does nothing (only the brain state causes the withdrawal), then a zombie who withdraws without feeling pain is equally fit.
  *   **The Worry:** Why do we have qualia at all? Why didn't evolution select for zombies? Epiphenomenalism implies our rich inner lives are an evolutionary accident with no function. While not logically impossible, it makes the existence of consciousness seem incredibly improbable.

  ### Summary
  Your friend's argument is valid, but unsound.
  1.  **The Exit:** Reject Step (6). Knowledge does not require the object of knowledge to cause the belief; a common-cause reliable correlation suffices (the Barometer Defense).
  2.  **The Price:** You must accept that the correlation between brain states and qualia is a brute, law-like fact of nature that ensures our reports match our experiences despite the experiences doing no work.
  3.  **The Lurking Problem:** You are right to feel uneasy. Solving the *knowledge* objection doesn't solve the *reference* objection (how words latch onto inert qualia) or the *evolutionary* objection (why we have them at all).

  **Verdict:** You can keep (8) "I know what I'm experiencing" without rejecting (1) "Epiphenomenalism is true" *logically*. But you end up with a view where your knowledge of your own mind is a happy accident of cosmic coordination, and your ability to talk about it is a semantic miracle. Most philosophers think that price is too high, which is why they reject epiphenomenalism—but they reject it because it's *implausible*, not because it's *self-refuting*.

  Your friend tried to score a knockout (logical refutation); you've successfully turned it into a points decision (implausibility). That's a win for you.
