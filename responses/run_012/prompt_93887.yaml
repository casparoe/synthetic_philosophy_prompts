  # PROTOCOL ON FORMAL EQUIVALENCE IN POETIC TRANSLATION
  **A Working Agreement for Adversarial Collaboration**

  **Signatories:** The "Same-Rule" Camp (SR) & The "Same-Role" Camp (RO)
  **Date:** October 2023
  **Subject:** The Ontology of Constraint and the Ethics of Transfer

  ## I. SHARED AXIOMS
  *Both parties affirm the following claims as foundational to this inquiry. Denial of any claim below voids the collaboration.*

  1.  **Translation is not Transcoding:** A translation is a distinct textual event from the source. It is not a copy, nor is it a mere cryptographic decoding. It must function as a poem in the target language (TL).
  2.  **Constraints are Constitutive:** Formal constraints (rhyme, meter, lipogram, acrostic) are not decorative wrappers. They exert force on the semantic content, shaping diction, syntax, and tone. To ignore them is to ignore a generative engine of the poem.
  3.  **The Impossibility of Totality:** In translating between linguistically distant systems (e.g., English to French), it is often materially impossible to preserve all semantic, sonic, and formal constraints simultaneously. Trade-offs are inevitable.
  4.  **The Reader's Due:** The target reader is owed an experience that is *analogous* to the source reader's experience. This includes cognitive load, aesthetic surprise, and mnemonic stickiness. A translation that reads "too easily" compared to the source may be unfaithful to the source's difficulty.
  5.  **Fidelity is Multidimensional:** Fidelity is not a binary (True/False) but a vector. A translation can be semantically faithful but formally unfaithful, or vice versa. The dispute is not about whether fidelity matters, but which dimension of fidelity is *definitive* of the poem's identity.

  ## II. RESIDUAL DIVERGENCES
  *The parties agree to disagree on the following definitions. Each statement is phrased to reflect the internal logic of the respective camp.*

  1.  **On the Identity of the Poem:**
      *   **SR:** The poem is identical to the specific set of generative rules that produced it. If Rule X (e.g., lipogram) is removed, the resulting text is a derivative work (adaptation/paraphrase), not a translation of *that* poem.
      *   **RO:** The poem is identical to the specific aesthetic and cognitive effect it produces. If Rule X cannot be transferred, Rule Y may be substituted provided it generates a comparable effect (wit, tension, constraint). To insist on Rule X when it destroys the effect is "rule-fetishism."
  2.  **On the Nature of Form:**
      *   **SR:** Form is objective and algorithmic. It is verifiable by inspection of the text's construction (e.g., counting syllables, checking for forbidden letters).
      *   **RO:** Form is phenomenological. It is verifiable by the reader's reception (e.g., feeling the tightness of the rhyme, noticing the pattern).
  3.  **On Substitution:**
      *   **SR:** Substitution of constraints is a category error. Replacing a lipogram with alliteration is not preserving the constraint; it is writing a new poem inspired by the old one.
      *   **RO:** Substitution is a necessary hermeneutic act. Preserving the *function* of the constraint (e.g., "limiting lexical choice") is a higher fidelity than preserving the *mechanism* (e.g., "no letter 'e'") when the mechanism is untranslatable.

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *To move beyond theory, we apply these positions to the Test Case (see Appendix A). We agree that the outcome of this specific translation task will bear on the validity of our general claims.*

  **The Test Case:** A four-line English quatrain.
  *   **Constraints:** (1) Rhyme Scheme ABAB; (2) Lipogram (No letter <e>); (3) Acrostic (S-U-S-A).
  *   **Target Language:** French (a language with high <e> frequency and different rhymic resources).
  *   **Known Defect:** The source acrostic (SUSA) is semantically opaque and arguably "half-broken" as a word.

  **Crux 1: The Invisible Constraint**
  *   **Question:** If a constraint is statistically undetectable to 95% of source readers without a footnote, is it essential to the translation?
  *   **Agreed Evidence:** Reader reception studies or intuitive consensus on the "noticeability" of the lipogram in the source text.
  *   **Predictions:**
      *   **SR Prediction:** A French translation that preserves Rhyme + Acrostic but *drops* the Lipogram (uses <e>) is a **failure of translation** (categorized as adaptation). The lipogram is part of the poem's ontology, regardless of reader noticeability.
      *   **RO Prediction:** A French translation that preserves Rhyme + Acrostic but *drops* the Lipogram is a **successful translation**. The "role" of the lipogram (lexical scarcity) is preserved by the difficulty of the rhyme/acrostic combo in French. A reader would not notice the acrostic (SUSA) anyway, so preserving it is fetishistic; preserving the *tone* of scarcity is what matters.

  **Crux 2: The Broken Rule**
  *   **Question:** Does a defect in the source constraint (the ambiguous "SUSA" acrostic) obligate the translator to reproduce the defect, or to "fix" it?
  *   **Agreed Evidence:** The translatability of "SUSA" into a French acrostic that makes equal (non)sense.
  *   **Predictions:**
      *   **SR Prediction:** The translator must reproduce the "SUSA" pattern exactly, even if it makes no sense in French. To "fix" it is to falsify the source object.
      *   **RO Prediction:** The translator should adjust the acrostic to a French-equivalent pattern (e.g., a 4-letter word that actually exists) or drop it. Preserving a broken signal serves no functional role for the TL reader.

  **Crux 3: Same Role, Same Rule?**
  *   **Question:** Can a different constraint ever count as the "same" constraint preserved?
  *   **Agreed Evidence:** A comparison of cognitive load. Does writing a French lipogram (No <e>) impose the same *degree* of difficulty as writing an English lipogram (No <e>)?
  *   **Predictions:**
      *   **SR Prediction:** No. A French lipogram is a different mathematical problem than an English one. They are not equivalent.
      *   **RO Prediction:** Yes. If the *pressure* on the syntax is equivalent, the constraint is functionally preserved. We predict that a French translation keeping the lipogram will be semantically degraded compared to one that swaps the lipogram for a strict meter.

  ## IV. METHODOLOGICAL VULNERABILITIES
  *Each party acknowledges the following risks inherent to their position. Should these risks materialize in the Test Case, the party agrees to reconsider their stance.*

  1.  **SR Vulnerability (The "Fetish" Risk):** If the Test Case translation that preserves all rules (Rhyme + Acrostic + Lipogram) results in text that is grammatically broken or semantically incoherent in French, SR must admit that **rule-preservation has a threshold of diminishing returns** where it ceases to be translation and becomes constraint-based art unrelated to the source meaning.
  2.  **RO Vulnerability (The "Drift" Risk):** If the Test Case translation that prioritizes "role" (swapping lipogram for meter) results in a poem that feels aesthetically distinct from the source (e.g., feels "looser" or "wittier" than the original), RO must admit that **functional equivalence is subjective** and cannot serve as a hard boundary for what counts as translation.
  3.  **Shared Vulnerability (The "Verbal" Risk):** Both parties acknowledge they may be using the word "Form" to mean different things (Algorithm vs. Phenomenology). If the Test Case shows that "Form" cannot be consistently defined across both camps, the dispute may be lexical rather than ontological.

  ***

  # ANALYST'S COMMENTARY (For the PhD Candidate)
  *This section is for your qualifying exam analysis and is **not** intended for the signatories. It addresses your request to flag verbal disputes and potential errors without papering them over.*

  ### 1. The Verbal Dispute: "Form"
  You suspected they might not mean the same thing by "form." You are correct. This is the engine of their stalemate.
  *   **SR defines Form as Syntax/Algorithm:** For them, form is pre-semantic. It is the code. If the code changes, the program is different.
  *   **RO defines Form as Phenomenology:** For them, form is post-semantic. It is the *experience* of the code running. If the user experience is the same, the program is effectively the same.
  *   **Why this matters:** They are talking past each other because SR is arguing from **Identity Conditions** (What makes this object *this* object?), while RO is arguing from **Reception Theory** (What does this object *do* to a subject?). Neither is "wrong" internally, but they are incompatible frameworks for the word "translation." SR treats translation as *archival*; RO treats translation as *performative*.

  ### 2. Who is Wrong? (Error Flagging)
  You asked not to paper over errors. Here is where each position is vulnerable to being objectively "wrong" in the context of professional translation studies.

  *   **Where SR is likely Wrong:**
      *   **The Invisible Constraint:** SR claims the lipogram is essential even if unnoticed. In the Test Case, the lipogram (No 'e') is invisible to almost all readers without a paratextual note. If a feature requires a footnote to be experienced, insisting it be preserved in translation at the cost of semantic clarity is **pedantry, not fidelity**. SR risks violating Axiom #3 (Impossibility of Totality) by demanding the impossible (French No-'e' is exponentially harder than English No-'e').
      *   **The Broken Acrostic:** The source acrostic is "SUSA." This is not a word. It is likely a mistake or a private joke. SR's insistence on reproducing "SUSA" in French (where S-U-S-A spells nothing and sounds awkward) prioritizes a **glitch** over the **text**. This is a category error: preserving an error is not fidelity to the work, it is fidelity to the typo.

  *   **Where RO is likely Wrong:**
      *   **The Slippery Slope:** RO claims "same role" justifies swapping constraints. However, "role" is subjective. If I translate a sonnet as a haiku because both "condense emotion," have I translated it? RO lacks a **stopping condition**. Without a hard limit on substitution, "translation" dissolves into "inspired by."
      *   **The Acrostic Prediction:** RO predicts the reader won't notice the acrostic, so it doesn't matter. But if the *source* poet noticed it (enough to write it), the *translator* is obligated to engage with it, even if the target reader misses it. RO risks **patronizing the target reader** by deciding for them what is "noticeable" or "worthwhile."

  ### 3. The Test Case Verdict (Your Qual Exam Hook)
  For your exam, the critical insight lies in **Crux 1**.
  *   **French Lipograms:** Writing a coherent French poem without 'e' (the most common letter) is an Oulipian feat that fundamentally alters the lexicon available. It forces archaic or awkward diction.
  *   **The Trap:** If SR demands the French lipogram, the translation will likely sound like a puzzle, not a poem about a "dying show."
  *   **The Resolution:** The "error" in the debate is the assumption that *one* constraint hierarchy fits all poems.
      *   **Correction:** For *this* poem (which is about decay, slowness, and silence), the **Lipogram** (restriction) is thematically central. The **Acrostic** (SUSA) is thematically irrelevant.
      *   **Synthesis:** A valid translation must keep the Lipogram (SR wins on ontology) but may swap the Acrostic for a different structural marker if SUSA is untranslatable (RO wins on function).
      *   **Why they fight:** They are fighting over the Acrostic, but the Lipogram is the actual crux. SR is right about the Lipogram (it's the poem's engine); RO is right about the Acrostic (it's noise). They are fighting the wrong battle.

  ### 4. Recommendation for the Document
  The "Methodological Vulnerabilities" section (IV) in the draft above is your safety valve. It allows them to sign the document while implicitly admitting they might be wrong. For your exam, argue that **Adversarial Collaboration succeeds not when parties agree, but when they agree on how they might be proven wrong.** That is the definition of a scholarly framework.
