              *   *Liberalism (L):*
                  *   P is decisive on $\{n, a\}$. So Social: $n \succ a$.
                  *   L is decisive on $\{b, n\}$. So Social: $b \succ n$.
              *   *Pareto (P):*
                  *   Both prefer $a$ to $b$ (P: $a \succ b$, L: $a \succ b$). So Social: $a \succ b$.
