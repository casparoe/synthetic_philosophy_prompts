              *   L: a > b > n (Prefers Prude read, but if someone must, better him than no one).
              *   *Wait, check standard Sen example:* Usually, Lewd prefers *Prude* to read most (to shock him), then himself, then no one. Prude prefers No one, then Himself, then Lewd.
              *   *Let's stick to Sen's specific setup:*
                  *   Alternatives: $a$ (Prude reads), $b$ (Lewd reads), $n$ (Neither).
                  *   Prude ($P$): $n \succ a \succ b$. (Personal sphere: $n$ vs $a$. He prefers $n$. But given $a$ or $b$, he prefers $a$).
