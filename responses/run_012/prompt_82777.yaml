  **BOARD PAPER: NLHF BID – FOUNDING LEGEND CAPTION STRATEGY**

  **To:** Board of Trustees
  **From:** [Your Name]
  **Date:** 10th [Month]
  **Subject:** Decision on Founding Legend Wording for Visitor Centre Bid
  **Meeting Date:** 14th [Month]

  **1. Purpose**
  To agree on a definitive wording strategy for the Abbey's founding legend. This is a condition of the National Lottery Heritage Fund (NLHF) bid. Current deadlock between Tourism, Schools, and Trustees is risking the submission.

  **2. Background**
  The NLHF bid requires us to finalize interpretive text for the new visitor centre. The sticking point is the founding legend (the holy man's vision).
  *   **Tourism:** "According to legend" is too weak; kills visitor engagement.
  *   **Schools:** Removing the qualifier misleads children; teachers cannot defend it.
  *   **Trustees:** Two members believe it is literal truth; the Vicar suggests "is remembered" (unclear).
  *   **Context:** The neighbouring town claims the same founder. Dispute is longstanding.

  **3. Analysis of the "Impact Rule" Proposal**
  To break the deadlock, I propose we adopt a new testing rule for all historical text. Instead of asking *"Did this happen?"*, we ask three questions:
  1.  Did it happen?
  2.  Did people believe it happened?
  3.  **Did that belief do anything?** (e.g., build the abbey, fix a boundary, win a charter).

  **Is this rule sound?**
  Yes, but with caveats. It is historically robust because it shifts us from arguing about miracles (which we cannot prove) to arguing about human behaviour (which we can).
  *   **Strengths:** It satisfies the Schools Officer (critical thinking), Tourism (a strong story), and the Believers (acknowledges the power of the faith). It aligns with NLHF priorities on "social heritage."
  *   **Risks:** As noted, a lie can have real effects. A scammer can build a church on a false premise. If we are not careful, this rule validates falsehoods simply because they were popular.
  *   **Mitigation:** We must set a high bar for Question 3. We do not label something "History of Impact" unless we have documentary or archaeological evidence that the *story itself* caused the action. We are not saying the vision was real; we are saying the *belief in the vision* built these walls.

  **4. Operational Guidance for Staff and Volunteers**
  To ensure consistency across captions, leaflets, and worksheets without requiring academic oversight, staff should categorize every story into one of three cases.

  **Case 1: Proven Fact**
  *   **Test:** We have physical or documentary proof (e.g., a dated cornerstone, a tax record).
  *   **Wording:** State as fact.
  *   **Example:** "The abbey church was consecrated in 1140."

  **Case 2: Proven Impact (The Legend)**
  *   **Test:** We cannot prove the event, but we can prove the story caused real-world action (e.g., pilgrims came, land was donated, the town boundary was drawn).
  *   **Wording:** Focus on the consequence, not the event.
  *   **Example:** "Tradition holds that a vision appeared here. Whether or not the vision occurred, the belief in it funded the construction of this nave."
  *   **Volunteer Script:** "We don't know if the vision happened, but we know people believed it enough to pay for these stones."

  **Case 3: Pure Story**
  *   **Test:** No evidence for the event, and no evidence it changed anything.
  *   **Wording:** "Local folklore says..."
  *   **Example:** Ghost stories, hidden gold tales with no archival link.

  **5. Recommendation**
  I recommend we classify the Founding Legend as **Case 2: Proven Impact**. This unlocks the NLHF bid by satisfying all stakeholders without compromising integrity.

  *   **New Caption Text:**
      > **The Vision That Built the Abbey**
      > *Local tradition says a holy man saw a vision here and founded the church. Historians cannot prove the vision occurred, but the belief in it was powerful enough to raise these walls, define the town's boundary, and secure our market charter. This is the story that made our history.*

  *   **Press/PR Line (if the neighbouring town objects):**
      > "We are not arguing about miracles; we are celebrating the people who believed in them. Our display honours the faith that built this town, whatever its origin."

  *   **Sign-off:** Chair of Trustees and Heritage Officer.
  *   **Deadline:** Agreed wording to NLHF by 12th [Month] (prior to Board meeting on 14th).

  **6. Decision Required**
  The Board is asked to:
  1.  Approve the "Impact Rule" for all interpretive text.
  2.  Approve the specific caption text above for the NLHF submission.
  3.  Authorise the Chair to manage any local press response using the PR line provided.

  **[Your Name]**
  **Trustee**
