      *   *Correction:* No, that sets a terrible precedent for a biosecurity foundation. It invites bad actors. The "XOR" structure specifically suggests the payment might not stop the harm (logical correlation vs causal). The safe bet is security mitigation, not ransom.
      *   *Initial thought:* Maybe say Item 1 and 2 are the same.
