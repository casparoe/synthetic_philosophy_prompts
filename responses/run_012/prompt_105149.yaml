answer: |-
  **Project Title:** Optimization without Lineage: Testing Accounts of Function in Neural Mechanisms

  **Project Summary**
  This project investigates whether internal components of trained neural networks (e.g., attention heads, feature circuits) possess "functions" in the philosophical sense, and if so, which theory of function best accounts for them. Standard debates in the philosophy of biology contrast etiological (selected-effects) accounts with causal-role accounts. The former requires a history of selection and reproduction; the latter requires only current causal contribution to system capacity. Trained neural networks present a novel ontological category: components shaped by an optimization process (gradient descent) that mimics selection, yet lack biological heredity or intentional design specifications. By constructing controlled case studies using mechanistic interpretability (MI) interventions, this project will test whether etiological criteria transfer to artificial optimization, whether causal-role accounts can distinguish function from spandrel, and whether a hybrid account is required.

  **Central Research Question**
  Under what conditions, if any, does gradient-descent training confer a *function* on an internal component of a trained network? Does answering this vindicate a generalized etiological account, a causal-role account, or a hybrid that takes selection history as necessary for some function-claims and current causal contribution as sufficient for others?

  **Why the Question is Open**
  The existing literature on biological function reaches an impasse when applied to machine learning systems, not because the answer is obvious, but because the standard criteria for adjudicating the debate are destabilized by the nature of neural training.

  1.  **The Etiological Challenge:** The standard etiological view holds that for a trait to have a function, it must be the product of a history of selection acting on heritable variation. My advisor's position represents the strict biological reading: without reproduction and differential fitness across generations, there is no selection, and thus no function. However, this risks being overly parochial. Gradient descent involves variation (weight initialization/noise), differential retention (loss minimization), and a form of inheritance (weight updates). If the etiological account is to be a general theory of teleology rather than merely biology, it must specify exactly which structural features of natural selection are necessary. The current debate lacks a precisified account of whether gradient descent satisfies these structural features.
  2.  **The Causal-Role Challenge:** Causal-role accounts avoid historical commitments, defining function as a component's contribution to a system's capacity. This handles artifacts well but struggles with "spandrels." In a neural network, almost every active parameter contributes causally to the output. Without a historical filter, causal-role accounts struggle to distinguish a component's *function* from its incidental side effects, or to make sense of *malfunction* (a component failing to do what it is *for*, not just what it *does*).
  3.  **The Interpretability Leverage:** Unlike biological phylogeny, the "evolutionary" history of a neural network is manipulable. We can isolate variables that are confounded in biology (e.g., separating the effect of initialization noise from optimization pressure). This allows us to test the *necessity* of specific historical conditions for function ascription, rather than arguing by intuition pump.

  **Methodology**
  This project combines conceptual analysis with experimental intervention. I will not merely argue about definitions but will construct a battery of controlled cases where the competing theories yield divergent verdicts. I will utilize standard mechanistic interpretability techniques to verify the causal status of the components in question.

  *Phase 1: Precisify Criteria (Months 1-2)*
  I will formalize the necessary and sufficient conditions for "function" under (a) a strict etiological account, (b) a generalized etiological account (where GD counts as selection), and (c) a causal-role account. I will specifically define the "heritability" and "fitness" analogues in training dynamics.

  *Phase 2: Construct Case Studies (Months 3-5)*
  I will identify or train small-scale transformer models to instantiate four distinct scenarios:
  1.  **The Selected Trait:** A component (e.g., an induction head) that arises consistently across seeds and is causally necessary for the optimized task. (Both accounts should agree: Function).
  2.  **The Spandrel:** A component that arises as a side-effect of optimization for a different task, is stable across seeds, and contributes causally to the current task, but was not the target of the loss function. (Etiological: No Function; Causal-Role: Function).
  3.  **The Repurposed Circuit:** A component optimized for Task A, then fine-tuned on Task B where it contributes causally but was not selected *for* B. (Tests whether function is locked to original selection or updates with new causal roles).
  4.  **The Drifted Component:** A component that was selected for a role during training but, due to overparameterization, no longer contributes causally to that role in the final weights (dead neurons/heads). (Etiological: Function exists; Causal-Role: No Function).

  *Phase 3: Intervention and Verification (Months 6-7)*
  I will use MI interventions to verify the causal claims:
  *   **Ablation:** To test causal necessity (Causal-Role criterion).
  *   **Activation Patching:** To test if the specific information processing is localized.
  *   **Seed Comparison:** To test stability/heritability across training runs (Etiological criterion). If a circuit appears only in one seed, it is likely noise, not a selected trait.

  *Phase 4: Synthesis (Months 8-9)*
  Analyze the divergence in verdicts. If the accounts diverge on the Spandrel or Drifted cases, I will evaluate which verdict aligns better with scientific practice in ML engineering (e.g., do engineers treat drifted heads as "broken" or "functionless"?).

  **Scope and Feasibility Assessment**
  Nine months is a tight constraint for a philosopher to conduct technical interpretability work. Training large models is infeasible. Therefore, the project scope must be restricted to ensure completion.
  *   **Risk:** Attempting to analyze a broad range of architectures or large language models will lead to technical bottlenecks.
  *   **Mitigation:** I will restrict the empirical study to a single, well-understood phenomenon, such as **induction heads in small transformers** or **grokking in arithmetic tasks**. This allows me to leverage existing open-source codebases and checkpoints rather than training from scratch. The philosophical framework will remain general, but the empirical validation will be deep rather than broad.
  *   **Alternative:** If the induction head case proves too technically demanding, I will pivot to a "theoretical simulation" approach, using published training logs and checkpoint data from the literature to reconstruct the four cases without running new training jobs.

  **Deliverables**
  1.  A draft manuscript suitable for submission to a journal in philosophy of science or biology (e.g., *Philosophy of Science*, *Biology and Philosophy*).
  2.  A technical appendix documenting the model architectures and intervention scripts (to be shared with the CS reading group).
  3.  A presentation of findings to the Philosophy Department and the CS Interpretability Group.

  **Failure Conditions**
  This project will be considered unsuccessful if:
  1.  **Convergence:** The competing accounts yield the same verdict on all four cases. This would suggest the cases are not sufficiently discriminating, rendering the empirical work philosophically idle.
  2.  **Terminological Collapse:** The divergence in verdicts reduces to a verbal dispute (e.g., one side defines "function" as *only* historical, the other as *only* causal) with no implications for scientific practice or explanation. To avoid this, I will tie the verdicts to explanatory power: does ascribing function help explain the system's robustness or failure modes?
  3.  **Technical Intractability:** If the MI interventions (e.g., causal tracing) fail to yield clear results on the chosen model (a common issue in current MI), the link between the philosophical criteria and the physical system will break. The restricted scope (focusing on one phenomenon like induction heads) is designed specifically to minimize this risk.

  **Conclusion**
  This project leverages a unique opportunity to test metaphysical theories of function against a system where the "history of selection" is transparent and manipulable. By forcing etiological and causal-role accounts to take a stand on neural mechanisms, we can clarify whether "function" is a biological specific, a cybernetic general, or a disjunctive concept. The nine-month timeline is ambitious but feasible provided the empirical scope remains focused on a single, tractable architectural phenomenon.
