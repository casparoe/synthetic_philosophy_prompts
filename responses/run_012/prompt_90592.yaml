  *(Self-Correction on Feasibility)*: The user admitted they haven't done formal phil mind since undergrad. I need to make sure the proposal doesn't promise technical metaphysics they can't deliver. I will frame the methodology as *conceptual analysis* supported by existing formal models, rather than generating new formal logic. This is safer for a novelist.

