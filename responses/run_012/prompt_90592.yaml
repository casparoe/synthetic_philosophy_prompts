answer: |-
  **Project Title:** The Exclusion Dilemma: Causal Robustness vs. Explanatory Relevance in Mental Causation

  **Principal Investigator:** [Your Name]
  **Fellowship Term:** One Year

  **1. Research Question**
  The exclusion argument for epiphenomenalism asserts that if physical effects have sufficient physical causes, mental causes are excluded. Contemporary responses typically argue that mental causation operates on a different level or satisfies different conditions than physical causation. However, these responses often equivocate between two distinct senses of "cause": (1) **Difference-Making** (counterfactual dependence) and (2) **Explanatory Relevance** (citability in rationalization).

  This project asks a determinate question: **Is there a single conception of mental causation that is simultaneously immune to the exclusion argument and robust enough to underwrite moral responsibility and folk-psychological explanation?**

  I hypothesize that the answer is negative. I aim to demonstrate a genuine dilemma: either mental causation satisfies the requirements for responsibility (robust difference-making) and falls prey to exclusion, or it avoids exclusion (by retreating to explanatory relevance) and becomes too weak to support responsibility.

  **2. Background and Gap**
  The current landscape is polarized. Reductive physicalists accept exclusion and reduce mental states to physical states. Non-reductive physicalists (including many compatibilists) argue that mental causation is compatible with physical closure, often by appealing to realization or supervenience.

  The gap lies in the testing mechanism. Defenses of mental causation are typically tested against "clean" cases (e.g., a simple belief leading to a simple action) where physical and mental descriptions align neatly. They are rarely stress-tested against "messy" metaphysical cases—preemption, overdetermination, and double prevention—where the divergence between physical sufficiency and mental relevance becomes acute. Consequently, it remains unclear whether the proposed solutions preserve the *kind* of causation required for practices like blame, legal accountability, and character analysis, or if they merely preserve a label.

  **3. Methodology and Work Plan**
  My method is conceptual analysis grounded in a taxonomy of causal notions. Rather than producing a new metaphysical theory, I will categorize existing definitions of causation and subject them to a stress test.

  *   **Months 1–3: Taxonomy Construction.** I will catalogue the dominant notions of causation currently in play (e.g., counterfactual, interventionist, process-based, explanation-based). I will define the necessary conditions for "responsibility-underwriting causation" (what must be true of a cause for an agent to be blameworthy?).
  *   **Months 4–6: Stress-Testing.** I will apply these causal notions to edge cases where physical and mental paths diverge. For example: In a preemption case where a neural state would have caused the action anyway, does the *belief* still count as a cause? If yes, how does it avoid overdetermination? If no, does the agent remain responsible?
  *   **Months 7–9: Formulating the Dilemma.** I will synthesize the results to formalize the two horns. Horn A: Robust causation is vulnerable to exclusion. Horn B: Exclusion-proof causation is too weak for responsibility. I will evaluate potential "escape routes" (e.g., contrastive causation) to see if they genuinely resolve the tension or merely obscure it.
  *   **Months 10–12: Drafting and Dissemination.** I will produce the final paper and present findings at institute workshops. I will also draft a companion piece outlining the implications for cognitive science and narrative theory.

  **4. Feasibility and Risk Assessment**
  *   **Risk:** The primary risk is technical. The exclusion debate involves intricate metaphysics that I have not engaged with formally since undergraduate studies. There is a danger of reconstructing arguments that have already been settled in the literature.
  *   **Mitigation:** My status as an outsider is a methodological feature, not a bug. I am not invested in preserving a specific school of thought (e.g., non-reductive physicalism). I will rely on the institute's community for technical calibration during workshops, using my role to ask the "naive" questions that often reveal hidden equivocations.
  *   **Failure Condition:** The project fails if I demonstrate that a unified notion of causation *does* exist that satisfies both exclusion and responsibility. While this would be a positive philosophical result, it would contradict my core hypothesis. A second failure mode is producing a taxonomy that is merely descriptive without yielding the normative dilemma regarding responsibility.

  **5. Deliverables**
  1.  **Primary:** A journal-ready article (8,000–10,000 words) titled *The Exclusion Dilemma*, arguing for the incompatibility of exclusion-proof mental causation and robust moral responsibility.
  2.  **Secondary:** An appendix containing the *Taxonomy of Causal Notions*, designed as a resource for future interdisciplinary work.

  **6. Significance and Interdisciplinary Stake**
  This project is not merely metaphysical; it has direct implications for the cognitive sciences and the humanities. If the "exclusion-proof" notion of mental causation is too weak to support responsibility, then our standard practices of holding agents accountable (in law, ethics, and social interaction) rely on a false premise.

  This connects directly to my work as a novelist. Narrative fiction is essentially a technology for simulating folk psychology; it relies on the premise that character motivations (beliefs, desires) are the genuine causes of action. If mental causation is merely explanatory and not difference-making, then character motivation is a "harmless lie." Determining whether the lie is harmless or harmful is crucial for understanding how humans model themselves and others. By clarifying the stakes of the exclusion argument, this project contributes to the institute's broader goal of understanding the architecture of human agency.
