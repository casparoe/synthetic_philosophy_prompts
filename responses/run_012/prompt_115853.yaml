prompt: |-
  I work on the analytical team of a mid-sized public-policy institute; we publish roughly a dozen reports a year for civil servants and funders, and our writers keep putting generational labels into them — 'Gen Z is more risk-averse', 'Millennials have given up on institutions' — on the strength of differences in a single cross-sectional survey. I want a written procedure, an ordered set of tests with a verdict attached to each, that an analyst with no training in demography or social ontology can run before a cohort label is allowed into a report. Two things have to stay live throughout. The first is that age, period and birth cohort are linearly related, so no dataset separates a cohort effect from a period effect except by an assumption the analyst must state out loud, and a one-off shock or a change in survey mode will present itself as a generational difference. The second is the prior question of whether a cohort is a kind at all, or a label that those under it begin to live up to, so that the classification helps produce the pattern it is used to explain. The procedure should say what counts as sufficient evidence at each step, where it stops with a no, and where it hands the decision to a person because what is left is a question about values or about what the report is for. Then run it on three cases: a single survey wave showing 18–24s more anxious than 45–54s; a claim that a cohort has been made permanently frugal by entering the workforce during a recession; and a commissioning editor who wants the report to say something about Gen Z because the funder expects it. At least one of the three should come out against the label. Be explicit about which steps are judgement dressed up as method, and about what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **User Role:** Analytical team member at a mid-sized public-policy institute.
      *   **Problem:** Writers frequently misuse generational labels (Gen Z, Millennials, etc.) based on weak evidence (single cross-sectional surveys).
      *   **Goal:** A written procedure (ordered set of tests with verdicts) for analysts without demography/social ontology training to vet cohort claims before publication.
      *   **Constraints/Requirements:**
          *   Must keep two issues "live": (1) The Age-Period-Cohort (APC) identification problem (linear dependency), and (2) The ontological status of cohorts (real kind vs. performative label).
          *   Must specify sufficient evidence at each step.
          *   Must specify where the process stops (No) vs. where it hands off to human judgment (values/purpose).
          *   Must apply the procedure to three specific cases (Single survey anxiety, Recession frugality, Funder pressure).
          *   At least one case must result in a "No" (against the label).
          *   Must be explicit about where judgment is dressed as method and what the procedure cannot settle.
      *   **Tone:** Professional, rigorous, actionable, slightly skeptical (given the context), but practical for non-experts.

  2.  **Deconstruct the Core Problems:**
      *   **APC Problem:** Age + Cohort = Period. You can't statistically distinguish them without strong assumptions. A single cross-section is just Age + Period (confounded). To claim "Cohort," you need longitudinal data or strong assumptions about Period effects.
      *   **Ontological Problem:** Is "Gen Z" a real causal force, or just a bucket we created that people now act like? If it's the latter, using it as an *explanation* is circular.

  3.  **Drafting the Procedure (The "Vetting Protocol"):**
      *   *Step 1: Data Structure.* Can we even see time? If it's one wave, we can't separate Age from Cohort easily.
      *   *Step 2: Alternative Explanations (Period/Lifecycle).* Is this just being young? Or just living through 2024?
      *   *Step 3: Mechanism.* Why would birth year matter?
      *   *Step 4: Ontology/Performativity.* Are we reifying a marketing term?
      *   *Step 5: Utility/Values.* Even if shaky, is it useful? (This is the hand-off point).

      *Refining the Steps for Non-Experts:*
      *   Need clear "Pass/Fail/Hand-off" criteria.
      *   Need to explicitly state the APC assumption.
      *   Need to address the "living up to the label" issue.

      *Drafting the Steps:*
      1.  **The Data Test:** Do we have multiple time points? (Crucial for APC).
      2.  **The Lifecycle Test:** Is this just age? (Compare to past cohorts at same age).
      3.  **The Period Test:** Is this just current events? (Compare to other age groups now).
      4.  **The Mechanism Test:** What is the causal story?
      5.  **The Reification Check:** Are we treating a label as a cause?
      6.  **The Policy Utility Decision:** (Hand-off to leadership).

  4.  **Developing the Case Studies:**
      *   *Case 1: Single survey (18-24 vs 45-54 anxiety).*
          *   Data: Cross-sectional.
          *   APC Issue: Cannot distinguish Age effect (young people are always more anxious) from Cohort effect (Gen Z is unique).
          *   Verdict: **Stop (No).**
      *   *Case 2: Recession Frugality (Cohort scarred by entry).*
          *   Data: Likely longitudinal or repeated cross-sections needed.
          *   Mechanism: Economic imprinting. Plausible.
          *   APC Issue: Need to ensure they didn't just spend less because they were poor *then*, not because they are frugal *now*.
          *   Verdict: **Conditional Pass (with caveats).**
      *   *Case 3: Funder Expectation (Gen Z focus).*
          *   Data: Irrelevant. Driven by external demand.
          *   Ontology: High risk of performativity.
          *   Verdict: **Hand-off (Values/Strategy).**

  5.  **Refining the Content (Self-Correction/Polishing):**
      *   *Constraint Check:* Did I keep the APC linearity live? Yes, need to emphasize the "Assumption Statement."
      *   *Constraint Check:* Did I keep the Ontology live? Yes, need a specific step on "Kind vs. Label."
      *   *Constraint Check:* Explicit about judgment vs. method. I need a section at the end or interspersed notes highlighting where the procedure relies on human discretion.
      *   *Tone:* Needs to sound like an internal SOP (Standard Operating Procedure).

  6.  **Finalizing the Procedure Structure:**
      *   **Preamble:** Acknowledge the APC problem and the Ontological problem.
      *   **The Protocol:** 5 Steps.
      *   **The Decision Matrix:** Stop, Proceed with Caveats, Escalate.
      *   **Case Applications:** Run the three scenarios.
      *   **Meta-Commentary:** What this procedure *doesn't* do.

  7.  **Writing the Content (Iterative refinement during drafting):**
      *   *Step 1 (Data):* If only one wave, you must assume no Period effect. That's a huge assumption. Make them write it down.
      *   *Step 2 (Lifecycle):* Compare to historical data. If 18-24s were anxious in 1990, it's not Gen Z.
      *   *Step 3 (Mechanism):* Avoid "vibes." Need specific exposure.
      *   *Step 4 (Ontology):* Is the label pre-existing? If yes, risk of performativity.
      *   *Step 5 (Utility):* This is the values hand-off.

      *Case 1:* Fails Step 1 & 2. Verdict: No.
      *Case 2:* Passes Step 1 (if data exists), Step 3. Fails Step 2 if not careful. Let's make it a "Proceed with Caveats."
      *Case 3:* Fails Step 4 (Ontology). Escalates to Step 5. Verdict: Escalate.

      *Wait, the prompt asks for "At least one of the three should come out against the label."* Case 1 is the strongest candidate for a hard "No." Case 3 is a "Hand-off." Case 2 can be a "Yes, but."

      *Refining the "Judgment dressed as method" section:* I need to be honest that Step 5 is purely political/strategic, and Step 1's assumption is methodological but arbitrary.

  8.  **Final Review against constraints:**
      *   Ordered set of tests? Yes.
      *   Verdict attached? Yes.
      *   APC linearity kept live? Yes (Step 1).
      *   Ontology kept live? Yes (Step 4).
      *   Sufficient evidence defined? Yes.
      *   Stop vs. Hand-off defined? Yes.
      *   Three cases run? Yes.
      *   Explicit about limitations? Yes.

      *(Self-Correction on Case 2)*: To make it realistic, I should ensure the analyst checks if the frugality persists *after* income normalizes. Otherwise, it's just income, not cohort. I will add that to the test.

      *(Self-Correction on Case 3)*: This is a "Funder wants it" scenario. The procedure shouldn't say "No" outright because the institute might need the money, but it must flag the scientific integrity risk. This fits the "Hand-off to values" requirement.

  9.  **Final Polish:** Ensure the language is precise ("linear dependency," "reification," "cross-sectional"). Make sure the "Assumption Statement" is prominent.

      *(Final thought on the "Ontology" constraint)*: The prompt asks to keep live the question of whether a cohort is a "kind" or a "label they live up to." I need to make sure Step 4 explicitly addresses the *performative* risk.

      Let's assemble the document.

      *Structure:*
      1.  Title & Purpose.
      2.  Foundational Constraints (APC & Ontology).
      3.  The 5-Step Protocol.
      4.  Application to Cases.
      5.  Limitations & Meta-Commentary.

      *Drafting the APC warning:* "Age = Period - Cohort." You cannot estimate all three. One must be constrained.
      *Drafting the Ontology warning:* "Does the category cause the behavior, or does the naming cause the category?"

      *Let's write it.*
answer: |-
  # STANDARD OPERATING PROCEDURE: Vetting Generational Claims
  **To:** Analytical Team  
  **From:** Methodology Lead  
  **Subject:** Pre-publication Protocol for Cohort/Generational Labeling  
  **Effective:** Immediately  

  ## 1. Purpose and Scope
  This procedure governs the use of generational labels (e.g., "Gen Z," "Millennials," "Boomers") as explanatory variables in institute reports. It is designed for analysts without specialized training in demography or social ontology. 

  Its goal is not to ban generational analysis, but to prevent **category errors** where life-cycle effects or period shocks are mislabeled as cohort traits, and to prevent **reification** where a marketing label is treated as a causal mechanism.

  ## 2. Foundational Constraints (Must Remain "Live")
  Before applying the tests below, the analyst must acknowledge two constraints that this procedure cannot resolve mathematically. These must be stated explicitly in any draft using cohort language.

  1.  **The Identification Problem (APC):** Age, Period, and Cohort are linearly dependent ($Age = Period - Cohort$). No statistical model can separate a cohort effect from a period effect without an external assumption. *Claiming a cohort effect is always a theoretical choice, not a statistical finding.*
  2.  **The Ontological Problem:** A cohort is not necessarily a natural "kind" (like a biological species). It may be a **performative label**: a category that causes people to behave differently once they are named. *Using the label may help create the pattern it claims to describe.*

  ## 3. The Vetting Protocol
  Run these tests in order. If a test results in **STOP**, the label cannot be used. If **CAUTION**, the label may be used only with specific caveats. If **ESCALATE**, the decision moves to the Editorial Board/Leadership.

  ### Step 1: The Data Structure Test
  **Question:** Does the dataset allow for the separation of Age and Cohort?
  **Evidence Required:** 
  *   **Pass:** Longitudinal data (tracking same people over time) OR Repeated Cross-sections (same survey questions asked over multiple years/decades).
  *   **Fail:** Single-wave cross-sectional survey (one snapshot in time).
  **Verdict:**
  *   **If Fail:** **STOP.** You cannot distinguish "being young" (Age) from "being Gen Z" (Cohort). You must describe the finding as an "Age Difference" or "Current Status of 18–24s," not a generational trait.
  *   **If Pass:** Proceed to Step 2. *Note: Even if Pass, you must write an "Assumption Statement" declaring which variable (usually Period) you are constraining to identify the Cohort effect.*

  ### Step 2: The Lifecycle & Period Control Test
  **Question:** Is this pattern unique to this cohort, or is it typical for this age, or typical for this time?
  **Evidence Required:** 
  *   **Lifecycle Control:** Data showing how previous cohorts behaved at the same age (e.g., Are 18–24s *always* more anxious than 45–54s?).
  *   **Period Control:** Data showing how other age groups changed during the same period (e.g., Did anxiety rise for 45–54s too, just less sharply?).
  **Verdict:**
  *   **If Lifecycle:** If 18–24s were also more anxious in 1990 and 2000, this is an Age effect. **STOP** (Do not use cohort label).
  *   **If Period:** If anxiety rose for *all* ages simultaneously, this is a Period effect (e.g., "The Pandemic Effect"). **STOP** (Do not use cohort label).
  *   **If Unique:** If this cohort deviates significantly from historical age norms *and* current period norms. **CAUTION.** Proceed to Step 3.

  ### Step 3: The Mechanism Test
  **Question:** What is the specific causal exposure tied to birth year?
  **Evidence Required:** A plausible narrative linking birth years to a specific, shared exposure that does not affect other cohorts (e.g., "Entered labor market during 2008 crash," "First cohort to have smartphones at age 12").
  **Verdict:**
  *   **If Vague:** If the mechanism is "cultural vibes," "social media" (without specificity), or "changing values." **CAUTION.** You must explicitly state the mechanism is hypothetical.
  *   **If Specific:** If the mechanism is a discrete event or technological threshold tied to developmental age. **PASS.** Proceed to Step 4.

  ### Step 4: The Reification & Performativity Test
  **Question:** Does using this label risk creating the behavior we are measuring?
  **Evidence Required:** Assessment of whether the label is already in public circulation (media, policy, marketing) prior to the behavior change.
  **Verdict:**
  *   **If High Performativity:** If the label (e.g., "Gen Z") is widely known to the subjects and associated with specific traits (e.g., "Gen Z is anxious") *before* the survey. **ESCALATE.** The finding may be a self-fulfilling prophecy.
  *   **If Low Performativity:** If the label is analytical only (e.g., "1980–1990 Birth Cohort") and not a public identity. **PASS.** Proceed to Step 5.

  ### Step 5: The Utility & Values Hand-off
  **Question:** Does the communicative value of the label outweigh the methodological noise?
  **Evidence Required:** None. This is a strategic decision.
  **Verdict:**
  *   **ESCALATE to Leadership.** This step acknowledges that sometimes a scientifically shaky label is policy-relevant because policymakers *use* that language. The analyst must provide a "Methodological Health Warning" to accompany the report, but the decision to publish rests on the institute's mission and funder relations.

  ---

  ## 4. Application to Case Studies

  ### Case A: The Anxiety Gap
  **Scenario:** A single survey wave (2024) shows 18–24s report higher anxiety than 45–54s. Writers want to title this "Gen Z Anxiety Crisis."
  **Protocol Run:**
  1.  **Data Structure:** **FAIL.** Single wave. We cannot know if 45–54s were this anxious when they were 20.
  2.  **Verdict:** **STOP.**
  **Analyst Instruction:** You are forbidden from using "Gen Z" or "Cohort" in the explanation. You must report this as "Current Age Disparities in Anxiety." You may note in the limitations that this *could* be cohort-driven, but you cannot assert it.
  **Rationale:** This violates the APC constraint. Young people are historically more likely to report anxiety than middle-aged people in cross-sections. Calling this "Gen Z" is a methodological error.

  ### Case B: The Recession Scar
  **Scenario:** Claim that the "2010 Cohort" (entered workforce 2010–2014) is permanently frugal compared to prior cohorts, even after income recovery.
  **Protocol Run:**
  1.  **Data Structure:** **PASS.** Assumes access to repeated expenditure surveys over 10+ years.
  2.  **Lifecycle & Period:** **PASS.** Analysis shows prior cohorts increased spending as income recovered; this cohort did not. Period effects (inflation) controlled for.
  3.  **Mechanism:** **PASS.** "Labor market scarring" is a specific economic mechanism tied to entry age.
  4.  **Reification:** **PASS.** "2010 Cohort" is an analytical bucket, not a public identity they perform.
  5.  **Utility:** **PASS.**
  **Verdict:** **CAUTION (Proceed with Caveats).**
  **Analyst Instruction:** You may use the cohort label, but you must include the **Assumption Statement**: *"We assume no unmeasured Period effect (e.g., a permanent cultural shift in saving) explains this difference."* You must also acknowledge that "frugality" might be rational response to lingering precarity, not a psychological scar.

  ### Case C: The Funder Expectation
  **Scenario:** A commissioning editor requires a section on "Gen Z's Relationship with Democracy" because the funder's strategy is focused on Gen Z. Data is mixed/weak.
  **Protocol Run:**
  1.  **Data Structure:** **FAIL/CAUTION.** Likely relies on cross-sectional polling.
  2.  **Lifecycle:** **FAIL.** Youth disengagement is historically cyclical.
  3.  **Reification:** **HIGH RISK.** "Gen Z" is a heavy marketing label; subjects know it.
  4.  **Utility:** **ESCALATE.**
  **Verdict:** **ESCALATE to Leadership.**
  **Analyst Instruction:** Do not write the section yet. Flag to the Director: *"Methodologically, this claim is unsupported (APC confounding + Performativity risk). However, if the strategic goal is funder alignment, we can publish provided we frame it as 'Self-Reported Attitudes of 18–24s' rather than 'Gen Z Traits,' and include a methodology box explaining the limitation."*
  **Rationale:** This is not a truth claim; it is a values/strategy trade-off. The analyst cannot make this call; it requires institutional risk assessment.

  ---

  ## 5. Meta-Commentary: Limitations of this Procedure

  Analysts must understand what this procedure does and does not do.

  **1. Where Judgment is Dressed as Method**
  *   **Step 1 (The Assumption Statement):** When we allow a cohort claim based on repeated cross-sections, we are statistically forcing the "Period" effect to be zero or linear. This is a mathematical convenience, not a fact of nature. The procedure treats this as a "Pass," but it is actually a **theoretical gamble**.
  *   **Step 3 (Mechanism):** Deciding if a mechanism is "specific" enough (e.g., "Smartphones" vs. "Culture") is subjective. An analyst might reject "Social Media" as too vague, while a sociologist might argue it is a precise technological shock.

  **2. What the Procedure Cannot Settle**
  *   **The Ontological Truth:** This procedure cannot tell you if "Generations" are real. It only tells you if the *claim* is defensible given the data. It keeps the question live (Step 4) but does not answer it.
  *   **The Political Cost:** Step 5 hands off the decision when the science conflicts with the mission. The procedure cannot tell you if losing the funder is worse than publishing shaky science. That is a governance question.
  *   **The APC Reality:** No amount of testing removes the linear dependency of Age, Period, and Cohort. This procedure minimizes the risk of error; it does not eliminate the impossibility of the task.

  **3. The "No" Threshold**
  *   If **Step 1** fails (Single Survey), the verdict is **STOP**. There is no exception. To claim a cohort effect from a single snapshot is to lie about the math.
  *   If **Step 2** fails (It's just Age or Period), the verdict is **STOP**. Calling it a cohort adds no information and creates confusion.

  **Approval:**  
  *Methodology Lead*  
  *Date*
