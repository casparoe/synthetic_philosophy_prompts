answer: |-
  **Title:** The Shape of Will: Hyperbolic Discounting and the Structure of Akrasia

  **Introduction**

  The phenomenon of weakness of will presents a singular puzzle for theories of agency: how can an agent intentionally perform an action while simultaneously judging that another course of action is better? Classical accounts of akrasia treat this as a failure of practical rationality, where desire overrides judgment. In contrast, the hyperbolic discounting model from behavioral economics and cognitive science treats it as a structural feature of intertemporal valuation, where preferences reverse as rewards approach. While both accounts aim to explain the same behavioral output—the divergence between evaluation and action—they offer fundamentally different descriptions of the agent's internal state. This essay argues that while hyperbolic discounting provides a robust mechanistic explanation for *diachronic* inconsistency (betraying a past resolution), it fails to capture the normative conflict inherent in *synchronic* akrasia (acting against a judgment held at the moment of action). Unless the discounting model is revised to decouple preference from judgment, it dissolves the very phenomenon it seeks to explain. Ultimately, the classical account remains more illuminating regarding the first-person perspective of agency, though both frameworks overlook the constitutive role of identity in maintaining resolutions.

  **Diachronic Inconsistency and the Discounting Advantage**

  The hyperbolic discounting model is naturally suited to explain what we might term *diachronic akrasia*. In this scenario, an agent forms a resolution at time $t_1$ (e.g., to diet) but violates it at time $t_2$ (e.g., eating cake). Hyperbolic discounting explains this via preference reversal. At $t_1$, the delayed reward of health is valued higher than the immediate reward of taste because the delay discounting function is steep for short delays but flat for long ones. As $t_2$ approaches, the "smaller-sooner" reward (cake) falls within the steep part of the curve, causing its subjective value to surpass the "larger-later" reward (health).

  From the perspective of diachronic consistency, this model is superior to classical accounts. It explains *why* the resolution was broken without positing a mysterious failure of rationality. The agent at $t_2$ is not irrational; they are simply maximizing utility according to their preference function at that moment. The "weakness" is located in the temporal structure of valuation, not in a defect of the will. For the diachronic case, the hyperbolic model successfully reframes the problem: it is not that the agent failed to do what they wanted, but that what they wanted changed.

  **The Synchronic Challenge: Dissolving the Conflict**

  However, the adequacy of the discounting model collapses when applied to *synchronic akrasia*. In the classical picture, the akratic agent at $t_2$ judges that $A$ is best all-things-considered, yet voluntarily performs $B$. Crucially, the judgment that $A$ is best persists *at the moment of action*. This is the Socratic/Aristotelian puzzle: how can one know the better and choose the worse *simultaneously*?

  The hyperbolic model struggles to accommodate this. If the agent's choice is determined by the subjective value at $t_2$, and the agent chooses $B$ (cake), then by definition the subjective value of $B$ must exceed $A$ at $t_2$. If $Value(B) > Value(A)$, then the agent is not acting against their better judgment; their judgment has simply aligned with their preference. The "better judgment" that $A$ was superior has vanished, replaced by a new preference ordering. Consequently, the hyperbolic model reduces synchronic akrasia to a change in preference. It explains the action, but it explains away the *akrasia*.

  For the classical theorist, this is a category error. Akrasia is not merely doing what one prefers; it is doing what one prefers *despite* a standing judgment that one should not. If the discounting model implies that the judgment tracks the discounted value, then synchronic akrasia becomes impossible. The agent is not weak-willed; they are just consistent with their current, myopic preferences. This eliminates the normative tension that defines the phenomenon.

  **Revising the Model: Decoupling Preference and Judgment**

  To rescue the hyperbolic model from this objection, a minimal revision is required: the introduction of a gap between *local preference* and *global judgment*. We must posit that the agent possesses two distinct evaluative mechanisms. The first is the automatic, hyperbolic valuation system that generates immediate desire (System 1). The second is a reflective, perhaps exponential or rule-based, system that generates all-things-considered judgments (System 2).

  Under this revised model, at $t_2$, the hyperbolic system assigns higher value to the cake, while the reflective system maintains the judgment that health is better. Synchronic akrasia occurs when the agent acts on the output of the hyperbolic system while acknowledging the authority of the reflective system. This revision aligns the discounting model with dual-process theories in cognitive science and brings it closer to the classical "divided will."

  However, this revision comes at a cost. By introducing a higher-order judgment that resists the pull of immediate discounting, we have effectively reintroduced the classical structure of akrasia into the economic model. The explanation for the failure is no longer just "preferences reversed"; it is "the mechanism responsible for global judgment failed to control the mechanism responsible for local preference." This concedes that hyperbolic discounting alone is insufficient to explain the normative conflict; it requires a superordinate faculty of judgment to generate the "better" that is being ignored.

  **First-Person Perspective and Structural Differences**

  This divergence points to a structural difference, not merely a phenomenological one. For the hyperbolic discounter (in the unrevised model), the first-person perspective is one of *shifting identity*. The "self" at $t_1$ and the "self" at $t_2$ have different utility functions. The conflict is between two temporal selves, not within a single self at a single time. The agent at $t_2$ does not experience a conflict between reason and desire; they experience a desire that has become reasonable.

  In contrast, the classical akratic agent experiences a *synchronic conflict*. The first-person perspective is one of alienation: "I am doing this, but I do not endorse this." This experience of non-endorsement is crucial. It implies that the agent recognizes a normative standard that transcends their current motivational state. If the hyperbolic model cannot account for this standing standard that persists despite the shift in valuation, it fails to capture the phenomenology of guilt or regret that typically accompanies akrasia. Regret implies that the current preference is recognized as inferior by the current self, not just by a past self.

  Therefore, the difference is structural. The classical account posits a hierarchy (Judgment > Desire), whereas the standard discounting account posits a sequence (Preference $t_1$ $\neq$ Preference $t_2$). The former allows for the possibility of acting against one's own current authority; the latter only allows for acting against one's own past authority.

  **Conclusion: Illumination and the Missing Feature**

  Which account is more illuminating? For the purposes of understanding practical rationality and moral responsibility, the classical account is superior. It preserves the normative force of the "better judgment." If we accept the unrevised hyperbolic model, we risk naturalizing weakness of will to the point of elimination. If my preferences simply reverse, in what sense am I responsible for failing to resist? The classical account maintains the tension necessary for agency: the idea that we *can* act against our strongest immediate impulse because we are bound by judgments that are not merely aggregates of desire.

  However, both accounts suffer from a significant blind spot: neither fully captures the role of *identity* and *self-constitution* in akrasia. Classical akrasia focuses on the conflict between judgment and desire, and discounting focuses on the conflict between temporal preferences. Both treat the agent's goals as pre-existing inputs to a decision procedure. They fail to explain why breaking a resolution feels like a betrayal of *who one is*, rather than just a miscalculation of value or a failure of control.

  Consider the agent who smokes a cigarette not because they value it more (discounting) nor because they are overcome by a rogue desire (classical), but because they have unconsciously decided that they are "no longer the kind of person" who quits. This constitutive shift—where the action changes the agent's self-conception rather than just satisfying a preference—is a feature of practical rationality that neither the geometric curves of discounting nor the hierarchical structures of classical akrasia fully illuminate. A complete theory must account not just for how we choose, but for how our choices define the chooser. Until then, both models remain partial maps of the human will.
