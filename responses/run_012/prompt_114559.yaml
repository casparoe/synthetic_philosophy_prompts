prompt: |-
  I'm doing a part-time health law conversion course and I keep getting stuck on advance directives — the living-will type forms where you write down, while you're still compos mentis, what treatment you'd want if you later lose capacity. The bit doing my head in isn't the seminar stuff about autonomy versus best interests, it's the actual paperwork. My aunt is a ward clerk at a district general and she showed me (heavily redacted) the standard form her trust uses. Part 1 is a refusal section: you can write that you don't want antibiotics for a chest infection, or don't want to be admitted to hospital at all, and if it's valid and applicable the team has to follow it even if you are now sitting up in bed cheerfully asking for the antibiotics and they would save your life. Part 2 is a preferences section: you can write that you'd like a bed in a home near your sister, or that you want your daughter in the room, and the form says in as many words that this part is not legally binding and will be taken into account. Same document, same signature, same afternoon — binding when it says no, a polite suggestion when it says yes. Meanwhile a friend of mine with bipolar has the opposite setup. Her crisis plan says, in effect, if I stop taking the lithium and start getting grand and sleepless, admit me, and the team do lean on that heavily; but when she's unwell and refusing, they detain her anyway and explain that the refusal is the illness speaking rather than her, which is the same move in reverse — the present self disqualified, the earlier self trusted. And I notice that in the dementia case everyone says the earlier self is the real one because the later one is compromised, and in her case everyone says the later self is the illness because the earlier one is compromised, and nobody seems bothered that these two arguments are mirror images.

  What I want to know is what this practice actually presupposes. It looks to me as if the whole apparatus assumes there are two people in one body — the one who signed and the one now living in it — and that some procedure can identify which of them is the real one. Is that right, or am I reading philosophy into admin? If it is right, which theory of the person does it commit to, and which rival views does it quietly rule out? If it's not right, can the asymmetry be explained with no view about identity at all — something about a refusal being a permission and a request needing someone to actually do something, or about who carries the burden of proof, or about the earlier self having no idea what the later state is like because she has never been in it? Reconstruct the implicit theory as charitably as you can, then tell me honestly which parts the practice strictly presupposes and which parts it merely fits nicely with, and where it's underdetermined so that two or three different theories would all license the same form. Then tell me what would have to change in the paperwork and on the ward if we replaced the implicit view with (a) the present self always wins, (b) the earlier self binds absolutely, or (c) a story-based view on which the person is whoever can still make sense of the whole life. Please write it in British English and skip the lecture on autonomy versus best interests, I've had that one twice. No reading lists or citations, I just want the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Part-time health law conversion student. Knowledgeable about the basics (autonomy vs. best interests, Mental Capacity Act concepts implicitly), but frustrated by the practical inconsistencies in advance directives (ADs) and crisis plans.
      *   **Tone:** Intellectual, slightly cynical, observant, precise. Wants an argument, not a lecture.
      *   **Topic:** The metaphysical and legal presuppositions of advance directives (refusals vs. preferences) and psychiatric crisis plans (Ulysses contracts). Specifically, the asymmetry between how we treat the "past competent self" vs. the "present incapacitated/unwell self."
      *   **Constraints:** British English. No reading lists or citations. Skip the standard autonomy vs. best interests lecture. Focus on the implicit theory of personal identity and legal practice.
      *   **Key Questions to Answer:**
          1.  Does the practice presuppose two people in one body?
          2.  If so, which theory of the person? Which rivals are ruled out?
          3.  If not, can the asymmetry be explained otherwise (permissions vs. requests, burden of proof, epistemic gaps)?
          4.  Reconstruct the implicit theory charitably.
          5.  Distinguish between what is strictly presupposed vs. what merely fits nicely vs. what is underdetermined.
          6.  Scenario analysis: What changes if we switch to (a) Present Self Wins, (b) Earlier Self Binds Absolutely, (c) Narrative/Story-based View?

  2.  **Deconstruct the Legal/Practical Asymmetry:**
      *   *Advance Decision to Refuse Treatment (ADRT):* Binding if valid/applicable. Past self says "No." Present self (incapacitated) might want "Yes" (or vice versa, but usually the issue is refusing life-sustaining treatment). The law prioritises the past competent refusal.
      *   *Advance Statement of Preferences:* Non-binding. Past self says "I'd like X." Present self (incapacitated) gets best interests decision.
      *   *Psychiatric Advance Statements (Crisis Plans):* Often treated as persuasive but not binding. If Past Self says "Detain me if manic," and Present Self (manic) says "No," they detain. If Past Self says "Don't detain," and Present Self (manic) says "No," they might detain anyway under MHA.
      *   *The User's Observation:* In dementia, Past Self = Real Self (Present is compromised). In Bipolar/Mania, Present Self = Illness (Past is Real), *but* if Present Self refuses treatment, the refusal is dismissed as illness, effectively privileging the Past Self's *intent* (to be treated) over Present Self's *will*. Wait, the user says: "in her case everyone says the later self is the illness because the earlier one is compromised." Actually, in psychiatry, the "Real Self" is usually the euthymic (stable) self. So if Stable Self says "Treat me," and Manic Self says "Don't," we treat. This aligns with the dementia model (Stable/Past > Unstable/Present).
      *   *The Conflict:* The user sees a contradiction.
          *   Dementia: Past (Competent) > Present (Incapacitated). Refusal stands.
          *   Psych: Past (Competent) > Present (Incapacitated/Unwell). Request for treatment stands (even if Present refuses).
          *   *Wait, the user's specific point:* "In the dementia case everyone says the earlier self is the real one... in her [bipolar] case everyone says the later self is the illness because the earlier one is compromised."
          *   Actually, the user is pointing out the *asymmetry of bindingness*.
          *   Refusal (Dementia/Physical): Binding "No".
          *   Request (Psych/Physical): Non-binding "Yes".
          *   Why can I bind you to *not* save me, but I can't bind you to *save* me (or house me near my sister)?
          *   And why is the "Real Self" logic applied inconsistently regarding identity?

  3.  **Address the "Two People" Hypothesis:**
      *   Does the law assume two people? Not explicitly. It assumes one legal person with fluctuating capacity.
      *   However, functionally, it treats the *competent* phase as the authoritative agent and the *incapacitated* phase as a state of nature to be managed.
      *   Theory of Person: It's not a psychological continuity theory (Locke) strictly, nor a biological theory (Animalism). It's a **Normative Competence Theory**. The "Real Person" is the one capable of bearing rights and duties. When capacity is lost, the *rights* remain (hence refusal binds), but the *agency* is suspended.
      *   Rival Views Ruled Out: It rules out strict "Presentism" (only the now matters). It rules out a pure "Narrative View" where the current experience weighs equally with past values.

  4.  **Reconstruct the Implicit Theory (Charitably):**
      *   The law isn't trying to solve metaphysics; it's managing risk and liability.
      *   *Refusals* are negative rights (freedom from interference). These attach to the body. If I said "No cutting" while sane, you can't cut me while I'm mad, because the right to bodily integrity survives incapacity.
      *   *Requests* are positive claims (demanding resources/action). These require a current beneficiary to justify the resource allocation. A past wish doesn't create a current entitlement if the current self can't experience the benefit or if it conflicts with clinical judgment.
      *   *The Asymmetry:* It's deontological vs. consequentialist. Refusal = Deontological constraint (Do not cross this line). Request = Consequentialist calculation (Is this good for him now?).
      *   *Identity:* It assumes a "Standing Authority" model. The competent self appoints itself as the guardian of the incapacitated self's *negative* liberties, but not the manager of its *positive* welfare.

  5.  **Strict Presuppositions vs. Nice Fits vs. Underdetermined:**
      *   *Strict:* The law *must* presuppose that capacity is the switch for authority. It *must* presuppose that bodily integrity is a negative right that persists.
      *   *Nice Fit:* The idea that the "Past Self is the Real Self" fits the refusal side well.
      *   *Underdetermined:* The law doesn't actually care if they are the "same person" metaphysically. It only cares about the validity of the instruction. You could be a different soul in the body; if the form is signed, the refusal stands. So, metaphysical identity is underdetermined.

  6.  **Scenario Analysis (The "What Ifs"):**
      *   *(a) Present Self Always Wins:* ADRTs become void upon incapacity. Guardians make all decisions based on current whim/expression. Chaos for dementia. Psych detention becomes harder if the manic refusal is absolute.
      *   *(b) Earlier Self Binds Absolutely:* Preferences become binding. If I wrote "No hospital," they leave me on the floor. If I wrote "Electro-convulsive therapy," they must do it even if I'm now terrified. Turns the body into a vessel for a ghost.
      *   *(c) Narrative/Story View:* Requires a tribunal to interpret "which decision fits the life story." Massive administrative burden. Clinicians become biographers.

  7.  **Drafting the Response (incorporating British English and tone):**
      *   *Tone:* Professional, analytical, direct. Avoid academic fluff.
      *   *Structure:*
          1.  Validate the observation (it's not just you).
          2.  Address the "Two People" question.
          3.  Reconstruct the implicit theory (Normative Competence/Negative Rights).
          4.  Distinguish Presupposition vs. Fit vs. Underdetermination.
          5.  Analyze the three alternative models (a, b, c).
      *   *Key nuance:* The distinction between *negative* rights (refusal) and *positive* claims (preferences) is the legal engine, not necessarily the metaphysics of identity. The "Real Self" talk is post-hoc justification for the legal distinction.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to conflate the Mental Capacity Act (MCA) with the Mental Health Act (MHA). The user mentions bipolar and detention. MHA overrides MCA in many psychiatric contexts. I should acknowledge this but focus on the *logic* of the advance statement itself, as the user is asking about the *form* and the *theory*, not just the statute.
      *   *Correction on Identity:* The user asks if it presupposes two people. The answer is "No, but it treats capacity as a threshold of moral authority." I need to make sure I don't get too bogged down in Locke vs. Animalism. Keep it legal-practical.
      *   *The "Mirror Image" point:* The user thinks the dementia vs. bipolar logic is contradictory. In dementia, Past > Present. In Bipolar, Past (Stable) > Present (Manic). Actually, they are the *same* logic (Competent > Incompetent). The user's confusion stems from the *outcome* (Refusal binds, Request doesn't). I need to clarify that the asymmetry is about the *type of instruction* (Negative vs. Positive), not the *identity of the self*. The "Real Self" rhetoric is applied to both to justify the Competent > Incompetent hierarchy.
      *   *Wait, re-reading the user's bipolar point:* "when she's unwell and refusing, they detain her anyway and explain that the refusal is the illness speaking rather than her, which is the same move in reverse — the present self disqualified, the earlier self trusted."
      *   Okay, so the user sees:
          *   Dementia: Past Self (Refusal) > Present Self (Wanting treatment).
          *   Bipolar: Past Self (Request for detention/treatment) > Present Self (Refusing treatment).
          *   User says: "In dementia... earlier self is real... in her case... later self is the illness."
          *   Actually, in both cases, the *Competent* self is treated as Real. The user thinks this is a contradiction because in one case the Competent self is Past, in the other the Competent self is *also* Past (relative to the crisis).
          *   Ah, the user's specific grievance is: "Part 1 [Refusal]... binding... Part 2 [Preferences]... not legally binding."
          *   And: "Refusal is a permission and a request needing someone to actually do something." -> The user hints at the solution themselves.
          *   My job is to confirm this intuition and flesh out the theoretical commitments.

  9.  **Final Polish:** Check British spelling (authorise, programme, centre, etc.). Ensure no citations. Keep it tight.

      *   *Plan:*
          1.  Intro: You aren't reading philosophy into admin; the admin *is* applied philosophy, but of a specific, pragmatic kind.
          2.  The "Two People" question: It's not ontological dualism, it's normative hierarchy.
          3.  The Implicit Theory: The "Sovereign Competent Self." Negative liberty vs. Positive claim.
          4.  Presuppositions vs. Underdetermination.
          5.  The Three Alternatives (a, b, c).
          6.  Conclusion.

      *(Self-Correction on "Two People"):* Be careful. The law assumes *one* legal person. But functionally, it splits the *authority*. I will argue it presupposes a "Fragmented Agency" model rather than "Two People."

      *(Refining the Bipolar/Dementia comparison):* The user says "nobody seems bothered that these two arguments are mirror images." I need to explain *why* nobody is bothered. Because the law isn't tracking "The Real Self," it's tracking "Liability and Tort." Refusal = Battery if ignored. Preference = Negligence if ignored (harder to prove).

      *Let's get writing.*
answer: |-
  You are not reading philosophy into admin; you are reading the admin correctly and noticing that it relies on a metaphysics it refuses to name. The paperwork is not neutral. It is a crystallised argument about personal identity and moral authority, but it is an argument designed by solicitors and risk managers, not metaphysicians. Consequently, it is inconsistent, pragmatic, and deeply committed to a specific view of what a person *is* for the purposes of liability.

  Here is the reconstruction of the implicit theory, the distinction between what is necessary and what is contingent, and the consequences of changing the view.

  ### 1. The "Two People" Hypothesis

  Does the practice presuppose two people in one body? Strictly speaking, no. The law recognises only one legal person. However, functionally, it operates on a model of **Fragmented Agency**. It assumes that the capacity to exercise agency is not a continuous property of the human organism but a switch that, when flipped off, severs the moral authority of the present occupant of the body.

  It does not commit to the view that the incapacitated person is a *different* ontological entity (a new soul). Rather, it commits to the view that the *competent* self is the only self capable of holding rights that trump medical paternalism. When capacity is lost, the body becomes a site of 'best interests' management, but the *negative rights* established by the competent self remain attached to the flesh like a covenant.

  So, it is not that there are two people. It is that there is one person whose moral voice is only deemed authentic when speaking from a position of competence. The 'present self' in a state of incapacity is not a rival person; it is a silenced agent. The asymmetry you spot in your friend's bipolar crisis plan versus the dementia advance decision is not a contradiction in identity theory, but a contradiction in **legal enforceability**.

  In both cases (dementia and bipolar), the system privileges the *competent* self (usually the earlier one) over the *incapacitated* self (the later one). The 'mirror image' you perceive is actually the same logic applied to different outcomes:
  *   **Dementia:** Competent Self says "No treatment." Incapacitated Self wants treatment. Result: No treatment. (Competent wins).
  *   **Bipolar:** Competent Self says "Detain me." Incapacitated Self says "Don't detain." Result: Detain. (Competent wins).

  The confusion arises because the paperwork distinguishes between **Refusals** (Part 1) and **Preferences** (Part 2). This is where the metaphysics hides behind the administration.

  ### 2. The Implicit Theory: Normative Competence and Negative Liberty

  The implicit theory is best described as **Normative Competence**. It holds that moral authority is contingent on the cognitive ability to understand consequences. However, it couples this with a **Libertarian Constraint**.

  *   **Refusals (Binding):** These are treated as negative rights (freedom from interference). The law presupposes that bodily integrity is a property right you hold over yourself. You can encumber that property with a restriction ("Do not cross this line") that survives your inability to enforce it. This is why Part 1 binds. It is a 'do not touch' sign that remains valid even if the owner is asleep.
  *   **Preferences (Non-binding):** These are treated as positive claims (demands on resources or action). To enforce a preference ("Put me in a home near my sister"), the system requires a current beneficiary to justify the allocation of resources. If the present self cannot articulate the benefit, or if the benefit conflicts with clinical judgment of 'best interests', the past wish collapses.

  **Which rival views does this rule out?**
  1.  **Strict Presentism:** The view that only the current conscious experience matters. The form rules this out entirely; otherwise, the signature would be void the moment capacity faded.
  2.  **Pure Animalism:** The view that we are simply human organisms and welfare is biological. If this were true, saving a life (antibiotics) would always trump a past refusal, because the organism wants to live. The form rules this out by allowing the organism to be left to die based on past data.
  3.  **The Narrative View:** The view that identity is a continuous story where all chapters weigh equally. The form rules this out by giving the 'competent chapter' veto power over the 'incapacitated chapter'.

  **Which view does it commit to?**
  It commits to a **Lockean-lite** view mixed with **Tort Law**. It treats the competent self as the rational owner of the body, whose prior instructions constitute a contract that the medical team must honour to avoid battery. It is less concerned with *who you are* and more concerned with *who is liable*.

  ### 3. Strict Presuppositions vs. Underdetermined Areas

  **Strictly Presupposed:**
  *   **Capacity is the threshold of authority.** The system cannot function without a binary switch (has capacity / lacks capacity). If capacity were a gradient, the binding nature of Part 1 would dissolve.
  *   **Negative rights survive incapacity.** The law must presuppose that a refusal made while competent creates a persistent obligation on others, regardless of the current state of the refuser.
  *   **Clinical judgment trumps positive requests.** The system presupposes that doctors cannot be compelled to act against their professional judgment based solely on a past preference.

  **Merely Fits Nicely:**
  *   **The "Real Self" Rhetoric.** The idea that the competent self is the "real" one and the incapacitated self is "compromised" is a post-hoc justification. The law would work exactly the same if it admitted that the incapacitated self is equally 'real' but simply lacks the legal standing to override the prior contract. The metaphysics of identity is decorative here; the liability structure is structural.
  *   **Epistemic Privilege.** The idea that the earlier self knows best. This fits nicely, but the law doesn't strictly require it. The earlier self could be wrong, malicious, or misinformed, and the refusal would still bind (provided it was validly made). The system prioritises *consistency* over *accuracy*.

  **Underdetermined:**
  *   **Metaphysical Identity.** The form does not care if the person now is the "same soul" as the person who signed. It only cares about the continuity of the legal signature. You could theoretically hold a view that the body is a vessel passed between different spirits; as long as the signature is valid, the refusal stands. The paperwork is agnostic on deep identity.
  *   **The Nature of Welfare.** The form does not define what makes a life good. It allows the past self to define the *limits* of treatment, but leaves the present welfare to the 'best interests' checklist. It is underdetermined whether 'best interests' includes honouring non-binding preferences. Some judges say yes, some clinicians say no.

  ### 4. Changing the Implicit View

  If we were to replace the current implicit theory with one of the three alternatives you proposed, the paperwork and ward practice would change radically.

  **(a) The Present Self Always Wins**
  *   **Theory:** Strict Presentism. Only current expression matters.
  *   **Paperwork:** Advance Directives would be abolished. You might have a 'Information Sheet' for relatives, but it would carry no legal weight.
  *   **Ward Practice:** In dementia, if a patient pulls out their IV and screams for water, you give water and antibiotics, even if they signed a refusal last year. In psychiatry, if a manic patient refuses admission, you cannot detain them based on a crisis plan; you must wait until they become an immediate danger *now*.
  *   **Consequence:** Massive increase in paternalism for dementia (people die wishing they hadn't); massive increase in liberty for psychiatry (people cycle through crisis untreated). The 'Ulysses contract' becomes impossible.

  **(b) The Earlier Self Binds Absolutely**
  *   **Theory:** Dead Hand Control. The competent self is the absolute sovereign of the biological vessel.
  *   **Paperwork:** Part 2 (Preferences) becomes binding. "I want a bed near my sister" becomes a legal mandate. "I want ECT if manic" becomes enforceable even if the present self is terrified.
  *   **Ward Practice:** Clinicians become technicians executing a script. If the form says "No hospital," the patient is treated on the floor, even if it is clinically risky. If the form says "Detain me," the patient is handcuffed even if they are currently calm but technically meeting criteria from the past.
  *   **Consequence:** The body becomes a vessel for a ghost. It risks profound cruelty to the present experiencer, who may have new values but no voice. It treats the human being as a project to be completed, not a life to be lived.

  **(c) The Narrative/Story-Based View**
  *   **Theory:** Identity is coherence over time. The 'real' decision is the one that makes the most sense of the whole life story.
  *   **Paperwork:** The form becomes a biography, not a checklist. Instead of "Yes/No" to antibiotics, you write "I value independence over longevity, but I love my grandchildren."
  *   **Ward Practice:** Requires a tribunal or ethics committee for every major decision. Clinicians must act as biographers, weighing the past values against the present expression to find the 'harmonious' path. Sometimes the present self wins (if it fits the story of resilience); sometimes the past self wins (if the present state is a tragic deviation).
  *   **Consequence:** High administrative burden. Massive uncertainty for clinicians (increased defensive medicine). However, it is the only model that treats the patient as a whole person rather than a split agent. It dissolves the asymmetry you hate, but replaces it with ambiguity.

  ### Summary

  The current paperwork presupposes that you are a **Rights-Bearer** when competent and a **Ward of the State** when incapacitated. It is not trying to solve the problem of personal identity; it is trying to solve the problem of **battery**.

  The asymmetry between Part 1 (Refusal) and Part 2 (Preference) is not a metaphysical error; it is a legal feature. A refusal stops an action (easy to enforce, low resource cost). A preference demands an action (hard to enforce, high resource cost). The system trusts the past self to protect the body from intrusion, but it does not trust the past self to command the resources of the NHS.

  You are right that the "Real Self" rhetoric is applied inconsistently, but that is because it is a justification, not a foundation. If you want consistency, you must choose: either the present experience matters most (abolish ADs), or the past autonomy matters most (make preferences binding). The current system tries to have it both ways to minimise liability, and in doing so, it creates the philosophical friction you are feeling. It is not admin that is confused; it is the law's attempt to manage the unmanageable transition between being a subject and being an object of care.
