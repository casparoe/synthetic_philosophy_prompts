  *(Self-Correction on Fruit):* The fruit isn't just "decaying." It is *maturitate tempestiva* (seasonable ripeness). The decay is the *result* of perfection (ripeness). This links the two images: The poet writes a complete plot; the fruit reaches complete ripeness. Both imply the end is the *culmination*, not just the cessation.

