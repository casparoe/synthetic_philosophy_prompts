prompt: |-
  Ok so me and my mate Dave have been going back and forth for about a year now and I want to actually pin down where we agree and where we don't, instead of just talking past each other forever. The fight is this: does what a text means come down to what the person who wrote it meant by it, or is the meaning just there in the text and in what readers get out of it, no matter what the writer had going on in their head? He's in the "the author knows best" camp, I'm more in the "the text speaks for itself" camp. I'm not academic, I just read alot, so keep it in plain words.

  What I want is basically the document Dave and me should have written ages ago. Not who wins -- I want the thing we could BOTH put our names to. So: first, a numbered list of claims both sides can honestly sign off on (about what a text is, about how meaning works, about what we even mean by "intention", whatever's really shared). Then the actual disagreements, each one written in a way that the side holding it would look at and say "yeah thats fair, thats my view" -- not a strawman version. Then the cruxes, i.e. the smaller questions where, if you settled one, it'd actually move at least one of us. And for each crux, a case or argument that BOTH sides would agree counts as evidence, plus what each side predicts about it going in. If some chunk of the argument turns out to be just us using words differently, say so and say which part.

  The bits I keep chewing on that I dont think either side has a clean answer for, and I want them folded in:

  - A writer clearly puts something into a story without consciously meaning to -- like a pattern in how they keep describing one character -- and a reader picks up on it. Does the writer get to say "that wasn't my meaning"?
  - Later on the writer says "no, thats not what I meant." Is that a correction of the meaning, or just a new thing they're doing? And what if they're lying, or their memory's gone fuzzy?
  - Texts with loads of hands on them -- a law, a wiki page, a holy book edited over centuries. Who counts as the author and whose intention is supposed to be the meaning?
  - Something written by a machine that was trained on tons of other writers, so theres no person meaning anything at all. Does it mean nothing, or does meaning not need a mind behind it?

  Format it as the numbered agreed-claims bit first, then a disagreements table. And end by telling me straight whether me and Dave are even disagreeing about the same question.
