      *   *A's Counter:* The shape is just bead positions. You're confusing explanation with causation.
      *   *B's Counter:* Explanation tracks causation. If the pattern predicts better, it's capturing real causal joints.
      *   *A's Counter:* Predictive power isn't causal power. The walls push the beads, the beads make the clump.
