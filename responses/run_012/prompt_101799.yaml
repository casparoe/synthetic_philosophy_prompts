answer: |-
  This is a fantastic question. You have correctly identified the structural isomorphism between the biological critique of adaptationism (Gould and Lewontin's "Spandrels") and the sociological critique of functionalism/interpretivism. In biology, the fear is that you invent a function to fit the trait. In social science, the fear is that you invent a "value" to fit the behavior.

  In philosophy of social science, this is often called the problem of **epiphenomenalism** (are values just smoke?) versus **realism** (are values engines?).

  Here are two concrete cases, the test to distinguish them, and the answer to your bonus question about causal status.

  ### Case 1: Values as Cause (The Quaker Oath Refusal)
  **Context:** 17th-century England, post-Restoration.
  **The Behavior:** Members of the Religious Society of Friends (Quakers) systematically refused to swear oaths of allegiance in court or to the Crown, even when required by law to testify or hold property.
  **The Putative Value:** A literalist theological interpretation of Matthew 5:34 ("Swear not at all"). Truth-telling is a absolute duty; invoking God to guarantee truth is idolatry.

  **Why this looks like a real causal explanation:**
  1.  **Temporal Priority:** The theological commitment was documented in journals and epistles *before* the specific legal confrontations occurred.
  2.  **Counter-Interest:** This behavior was maladaptive in a material sense. It led to imprisonment, seizure of property, and inability to prosecute debts. If the "value" were just a post-hoc rationalization for a behavior driven by self-interest, the behavior should have shifted when the costs became this high. It didn't.
  3.  **Consistency across contexts:** They refused oaths even when swearing would have *helped* them (e.g., to recover stolen goods). This rules out the hypothesis that the behavior was a covert strategy to undermine the Crown (a materialist explanation).

  **The Mechanism:** The value acts as a constraint on the decision tree.
  *   *Input:* Court demands oath.
  *   *Processing:* "If I swear, I sin. If I refuse, I suffer."
  *   *Output:* Refusal (because sin > suffering in their utility function).

  ### Case 2: Values as Rationalization (The "Civilizing Mission")
  **Context:** Late 19th-century European Colonialism (specifically British and French in Africa).
  **The Behavior:** Military conquest, resource extraction, and imposition of administrative control.
  **The Putative Value:** The "White Man's Burden" or *Mission Civilisatrice*—the moral obligation to bring Christianity, commerce, and civilization to "savage" peoples.

  **Why this looks like an adaptationist story (Values are Epiphenomenal):**
  1.  **Temporal Lag:** The economic extraction and military occupation often *preceded* the elaborate moral theorizing. The East India Company was extracting revenue long before the "moral duty" rhetoric peaked.
  2.  **Convenience:** The "values" shifted to match the material needs. When labor was needed, the value was "teaching work discipline." When land was needed, the value was "bringing agriculture." When trade was needed, the value was "opening markets." The value was flexible; the material interest was constant.
  3.  **Audience Specificity:** The "civilizing" rhetoric was mostly for domestic consumption (to justify taxes to voters) or international diplomacy. Internal memos between colonial administrators often discussed logistics, profit margins, and strategic advantage, with the "moral value" appearing only in public dispatches.

  **The Mechanism:** The value acts as a coat of paint.
  *   *Input:* Demand for rubber/cotton/strategic ports.
  *   *Processing:* Calculate military cost vs. economic gain.
  *   *Output:* Conquest.
  *   *Post-Processing:* Generate moral narrative to stabilize domestic political support.

  ***

  ### What Separates the Two? (The "Null Model" for Values)

  To distinguish Case 1 from Case 2, you need what a biologist would call a **control for material selection pressure.** You need to observe the group in a situation where the *value* and the *material interest* point in opposite directions.

  **The Test: Costly Signaling / Counterfactual Robustness**
  To prove values are causal (Case 1), you must observe the group incurring a **net fitness cost** (economic loss, social exclusion, physical danger) solely to satisfy the value.

  *   **In Case 1 (Quakers):** We observe them losing property. The value predicts behavior that reduces material security.
  *   **In Case 2 (Colonialism):** We observe them gaining resources. The value predicts behavior that *increases* material security.

  **What you would have to observe in Case 2 to show values aren't working:**
  You need to find a "smoking gun" where the stated value is abandoned the moment it becomes costly.
  *   *Observation:* If the colonial power abandons the "civilizing" project immediately when it becomes unprofitable, but claims they were "forced to leave by circumstances" while maintaining the moral stance, the value is likely epiphenomenal.
  *   *Observation:* If internal documents (the "private phenotype") lack the value language while public documents (the "public phenotype") are full of it, the value is likely a signaling mechanism, not a causal driver.

  In your microbiology terms: In Case 1, the trait persists even when the environment selects against it (suggesting a strong internal constraint). In Case 2, the trait tracks perfectly with environmental rewards, and the "function" is only described after the trait is fixed.

  ***

  ### The Bonus: Is it a Cause or a Redescription?

  This is the hardest part, and where philosophers of social science fight the most.

  **The Trap (The Dormitive Virtue):**
  If you define a "value" simply as "a disposition to behave in way X," then saying "They did X because they value Y" is tautological. It is like saying "Opium puts you to sleep because it has a dormitive virtue." You haven't explained the mechanism; you've just labeled the behavior.
  *   *Example:* "Why did he give money to charity?" "Because he is altruistic." "How do you know he is altruistic?" "Because he gave money to charity."

  **The Save (Independent Access):**
  To make "value" a legitimate cause in the scientific sense, you must have **independent access** to the value *other than* the behavior it is supposed to explain.
  *   In the Quaker case, we have independent access: Their written theology, their sermons, their private diaries from *before* the court cases. We can identify the "variable" (belief in Matthew 5:34) without looking at the "outcome" (refusing the oath).
  *   If you can measure the value independently (via surveys, texts, neural imaging, prior history) and it correlates with the behavior *across different material contexts*, then it counts as a cause.

  **The Cost of Saving the Explanation:**
  To accept Case 1 as a valid causal explanation, you have to pay a metaphysical price that many hard-nosed scientists dislike. You have to accept **Methodological Individualism** or **Intentional Stance** as real data.

  1.  **The Black Box Problem:** You are accepting that internal mental states (beliefs, desires) are causal forces. In physics/biology, we usually prefer to explain behavior via external pressures (selection, physics). In social science, to save the "values" explanation, you must insist that the *internal representation* of the world is part of the causal chain.
  2.  **The Verification Cost:** You cannot just watch the behavior (like you watch bacteria grow). You have to interpret texts, speech, and self-reports. This introduces "hermeneutics" (interpretation) into your data collection. Two scientists might disagree on whether a text really expresses a value or is just rhetoric.
  3.  **The Reductionism Limit:** You cannot easily reduce the value to neurons (yet). So you are stuck with "folk psychology" (beliefs, desires) as your fundamental units. For a microbiologist used to reductionism, this feels like stopping at the level of "organism" without looking at the cell.

  **Summary:**
  The explanation holds water *only if* you can measure the value independently of the action it explains. If the value is inferred solely from the action, it is adaptationist storytelling. If the value is documented prior to the action and predicts actions that contradict material self-interest, it is a causal mechanism. The cost is that you must treat human self-understanding as empirical data, which is messy and interpretive compared to a petri dish.
