      5.  Verdict: Berkeley is the better economist; Rosa is the better sociologist. But since money is an economic tool first, Berkeley is the more fundamental truth, while Rosa describes the distortion.

      *Wait, one more check:* Is Rosa's view actually Chartalism? "Permission... social token." Yes, sounds like Knapp or Modern Monetary Theory (MMT) vibes. Berkeley is more like a proto-classical realist.
