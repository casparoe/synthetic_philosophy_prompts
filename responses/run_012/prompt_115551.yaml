answer: |-
  Your hypothesis is correct that the core dispute is substantive rather than verbal, but the impasse persists because the growth camp commits a naturalistic fallacy by deriving an "ought" from dynamical "is", while the expected-utility camp ignores the physical reality of non-ergodicity.

  The growth camp is committed to the view that rationality is instrumental survival: because wealth dynamics are multiplicative and non-ergodic, the time-average growth rate is the only physically meaningful metric for a single agent, making logarithmic utility a derived necessity rather than a subjective preference. They argue that ensemble averaging describes a multiverse of copies, not a single life trajectory, and therefore standard expected value is physically irrelevant even in a one-shot case if that shot is part of a life-sequence where ruin is absorbing. Their substantive claim is that any agent who maximizes arithmetic expectation over geometric growth is objectively irrational because they are optimizing for a metric that cannot be realized in time.

  The expected-utility camp is committed to the view that rationality is preference coherence: utility functions represent subjective valuations of outcomes, and no mathematical theorem can dictate what an agent ought to value without assuming a prior goal. They argue that the growth theorem only proves that log-utility agents outperform others *given* repeated play, but it cannot justify the log-utility function itself for a single decision where the agent might legitimately prefer a high-variance gamble despite the risk of ruin. Their substantive claim is that dynamics constrain what is possible, but preferences determine what is desirable, and conflating the two eliminates the normative force of choice.

  The single-shot case exposes the growth camp's scope error: they justify the fractional stake using an asymptotic theorem (repetition) while denying the hypothesis (repetition) is required, relying instead on the hidden premise that every bet is effectively part of a lifelong sequence of wealth management. This is where the "ensemble vs. trajectory" argument does the work: it attempts to bridge the gap by claiming the *structure* of the bet (multiplicative) imposes the time-average metric regardless of $N$, but this succeeds only if one accepts that avoiding ruin is a categorical imperative rather than a contingent preference. The expected-utility camp correctly identifies this as smuggling a survival constraint into a general theory of choice, but fails to offer a robust account of why an agent *should* ignore the risk of absorption when it is physically present.

  Progress requires abandoning the search for a single "rational" rule and instead distinguishing between *decision theory* (which ensures coherence between beliefs and preferences) and *strategy* (which ensures viability within specific dynamics). A formal result will not resolve this because the disagreement is axiomatic: one side prioritizes internal consistency of preferences, the other prioritizes external consistency with environmental dynamics. The reading group should proceed by accepting that expected utility is the correct framework for modeling preferences, while acknowledging that logarithmic utility is the correct *instrumental* specification for agents who prioritize long-term survival in non-ergodic environments. The impasse will dissolve when you recognize that the growth camp is prescribing a specific goal (survival) under the guise of a method (maximization), and the utility camp is defending the freedom to choose self-destructive goals under the guise of rationality.
