  4.  **Ranking and Ordering Logic (Upstream vs. Downstream):**
      *   *Upstream:* Foundational theoretical issues. If these aren't solved, the rest collapses.
      *   *Downstream:* Application and extension. These depend on the foundation.
      *   *Critical Bottleneck:* The "Disgust/Offense" problem is the biggest hurdle in utilitarian sexual ethics. If disgust counts as pain, the majority can always outvote the minority. This *must* be addressed early.
