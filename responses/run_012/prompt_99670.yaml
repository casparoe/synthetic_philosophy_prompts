      3.  *Socially Shaped Preferences:* Preferences/aversions are constructed by the very laws/norms being criticized. How to handle endogenous preferences?
      4.  *Boundaries of Consent:* Age, incapacity, animals (Bentham was implicit here). How to define limits without reverting to moralism?
      5.  *Beyond Decriminalization:* Does the view support positive rights/recognition/provision, or just negative liberty?

  3.  **Determine the Strategic Goal of the Book:**
      *   The book needs to *get Bentham right* (scholarly integrity) AND *be useful for reform now* (practical impact).
