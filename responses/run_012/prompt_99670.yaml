      *   *Refinement:* Wait, the Disgust problem is the specific utilitarian trap. If you use a Harm Principle (Mill), disgust doesn't count. If you use Bentham's Calculus, it might. So, Question 1 (Hedonism vs. Harm) determines Question 2 (Disgust).
      *   *Refinement 2:* Actually, the most "neglected" and "dangerous" question for a Benthamite specifically is the Disgust one. Bentham struggled with this. But for a *modern reform* book, the Boundaries of Consent are where opponents will attack (grooming, bestiality, etc.).
      *   *Decision:*
          1.  **Disgust as Disutility.** (The "Showstopper". If you can't solve this, utilitarianism justifies oppression.)
          2.  **Hedonism vs. Harm Principle.** (The "Engine". Determines the argumentative strategy.)
