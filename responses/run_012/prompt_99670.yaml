          5.  **Beyond Decriminalization.** (The "Horizon". Important, but secondary to stopping prosecution.)

  6.  **Assessing Tractability (Solo vs. Empirical):**
      *   *Disgust:* Philosophical/Normative. Solo.
      *   *Hedonism:* Exegetical/Philosophical. Solo.
