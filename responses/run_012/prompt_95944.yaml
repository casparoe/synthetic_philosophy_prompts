      *   *Fix:* Explicitly state "Pass Criteria" for each step.

  8.  **Final Polish:**
      *   Ensure the "Recursion/Paralysis" check is clear (we can't ban the tools of inquiry).
      *   Ensure the distinction between *facts* (physics) and *values* (risk tolerance) is marked.
      *   Check against the "indistinguishable particles" constraint. (Address via "system-level description" rather than counting individuals).

