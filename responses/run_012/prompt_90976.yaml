answer: |-
  Imagine two engineers, let us call them Alex and Jordan, sitting late in the office with a whiteboard covered in diagrams of buckets and orbits. They are trying to settle the dispute about the universe containing only a bucket of water and a single distant rock. Alex starts by drawing the bucket spinning in the void, the water climbing up the sides. Alex argues that this curvature proves the water is spinning in a sense that does not depend on the rock. The water knows it is spinning because it feels a force, a centrifugal push that flattens it against the bottom and drives it up the walls. If the water were merely spinning relative to the rock, Alex says, then the rock would have to be the cause of that force, which seems absurd given the distance and the lack of any known connection. The bulge is a local fact about the water and the space it occupies, not a relationship report.

  Jordan counters by erasing the rock and redrawing it orbiting the bucket instead. Jordan insists that motion is nothing more than a change in distance and orientation between objects. If there is only one other object in the universe, the rock, then saying the bucket spins is exactly the same statement as saying the rock orbits. There is no third thing, no invisible grid of space, to measure against. So if we hold the bucket still and swing the rock around it, the relationship between the water and the rock is identical to the first case. The water is rotating relative to the only other matter in existence. Therefore, Jordan argues, the water must bulge again. To say otherwise is to claim that the water can tell the difference between being spun itself and having the universe spun around it, which implies the water has access to a background stage that does not consist of matter.

  Alex pushes back hard on this equivalence. If the bucket is held rigid and the rock is swung around it, the water inside the bucket is not accelerating. It is sitting still in its local frame. Alex asks what physical mechanism would cause the water to climb the walls in this second scenario. In the first case, the bucket walls push the water, dragging it into circular motion, and the water resists that change in velocity due to inertia. In the second case, the bucket is not pushing the water into a circle; the water is stationary. For the water to bulge, a force would have to act on it simply because the distant rock is moving. Alex calls this magical action at a distance. If the rock moves, how does that transmit a force to the water to make it press against the container? It implies that the distribution of matter in the universe dictates the local laws of inertia, so that moving the rock changes the resistance the water offers to acceleration.

  Jordan accepts that this sounds magical but argues it is no stranger than absolute space. Alex posits an invisible, intangible substance called space that exerts resistance on matter when it accelerates. Jordan asks what this space is made of and how the water detects it. If the water detects space, why does it not detect its velocity through space? We can only measure speed relative to other things. Acceleration feels different, Jordan admits, but that feeling might just be a result of interacting with the aggregate mass of the universe. In a universe with only one rock, that aggregate is small, but the principle holds. The inertia of the water is not an intrinsic property of the water alone but a relationship between the water and the rest of the matter. If the rest of the matter rotates around the water, the water experiences the same inertial forces as if it were rotating through the matter.

  This leads them to the question of quantity. Alex presses Jordan on whether the size of the rock matters. If the universe contains the bucket and a single pebble, and we spin the pebble around the bucket, does the water bulge? If Jordan says yes, then a tiny speck of dust should suffice to generate the same inertial forces as a massive star, which seems implausible. If Jordan says no, then there must be a threshold of mass required to define what counts as spinning. Alex argues that this threshold problem destroys the relational view. How much matter is enough to lock in the definition of non-rotation? Is it fifty percent of the mass of our current universe? Ten percent? If the relational view is true, inertia should scale with the amount of matter available to relate to. But in our experience, the resistance to acceleration seems constant regardless of whether we are near a mountain or in deep void. This suggests the water is reacting to something constant, like space itself, not something variable like the distribution of rocks.

  Jordan responds that the thought experiment assumes the laws of physics remain the same even when the mass of the universe changes, which might not be true. In a universe with only a pebble, the laws of inertia might be different, or the effect might be weaker. Jordan concedes that in our universe, with its vast distribution of galaxies, the fixed stars provide a robust frame of reference. The reason the water bulges consistently here is that the rest of the universe is massive and effectively stationary relative to our local experiments. But in the two-body case, the principle remains: without other matter, the concept of spinning loses its meaning. Jordan argues that Alex is smuggling in the mass of the Earth and the galaxies while pretending they are not there. If you truly isolate the bucket and one rock, you cannot assume the water behaves as it does here. But if you do assume the laws hold, then the symmetry of the relationship dictates the outcome. If the water bulges when the bucket spins relative to the rock, it must bulge when the rock spins relative to the bucket, or else you have privileged the bucket's frame without justification.

  To test the mechanism further, Alex proposes modifying the contents of the bucket. Suppose we fill it not with water, but with a frictionless fluid that refuses to be dragged into spinning at all. When we spin the bucket, the fluid remains stationary relative to the distant rock because there is no friction to transfer the motion from the walls to the liquid. Alex asks what happens to the surface of this fluid. If the relational view is correct, the fluid is now spinning relative to the bucket, but stationary relative to the rock. Since the rock is the only other matter, the fluid is not spinning in the only sense that matters. Therefore, the surface should remain flat. If the absolute view is correct, the fluid is not spinning relative to space, so it should also remain flat. Both agree on the flat surface here.

  The divergence appears when they consider the reverse case with this frictionless fluid. If we hold the bucket and fluid still and spin the rock around them, the relationalist must claim the fluid is now spinning relative to the rock. Therefore, Jordan argues, the fluid should bulge, even though the bucket is not dragging it and the fluid is not moving locally. Alex finds this impossible. If the fluid is not moving, if no force is touching it, how can its surface curve? The curvature of a fluid surface is a result of forces balancing against motion. If the fluid is not in motion relative to the local space, there is no centrifugal force to balance. For Jordan to be right, the motion of the distant rock would have to conjure a force inside the stationary fluid out of nowhere. Alex argues this proves that the bulge is not about relationship but about actual acceleration through a medium that provides resistance. The water climbs the walls because it is trying to move in a straight line while the bucket forces it into a curve. If the fluid is not forced into a curve, it does not bulge, regardless of what the rock is doing.

  Jordan counters that this assumes inertia is local and intrinsic. If inertia is relational, then the state of motion of the rock determines whether the fluid is inertial or not. When the rock orbits the fluid, the fluid is in a non-inertial frame relative to the matter that defines inertia. Therefore, fictitious forces arise within the fluid, just as they do in a rotating reference frame. The fluid does not need to be touched by the bucket; it needs only to be rotating relative to the mass that defines the standard of non-rotation. Jordan admits this implies that if you removed all matter from the universe, leaving only the bucket, you could not spin it. You could twist the handle, but there would be no resistance, and the water would not bulge. There would be no difference between spinning and standing still. Alex finds this conclusion terrifying, as it suggests that without other objects, effort produces no physical feedback. Jordan finds Alex's conclusion terrifying, as it suggests space is a real thing that can act on matter without being made of matter.

  They circle back to the amount of matter required. Alex asks again if a speck of dust would cause the bulge in the relational view. Jordan hesitates, acknowledging that a single particle might not define a frame robustly enough to generate full inertial forces. It suggests that inertia is a collective effect, like pressure in a gas. One molecule does not make pressure; you need many. Similarly, one rock might not fully define inertia. You need a significant distribution of mass to lock in the frame of reference. This admits a gradient to reality that Alex finds unacceptable. Alex argues that physics should be binary: either you are accelerating or you are not. If the bulge depends on how much matter is out there, then the shape of the water surface is a measurement of the total mass of the universe, not just its own motion. Jordan replies that perhaps it is. Perhaps the shape of the water is indeed a measurement of the universe's mass distribution relative to the bucket. The bulge is not just about the water; it is a gauge of the cosmic context.

  In the end, they do not agree, but the stakes are clear. If Alex is right, then space is a real entity, a stage that exists even when empty, and the water bulges because it pushes against this stage. The rock is irrelevant except as a marker to help us see the motion. If Jordan is right, then space is nothing but the set of relationships between objects, and the water bulges because of its motion relative to the matter in the universe. The rock is essential, and without it, or with too little of it, the concept of spinning dissolves. They realize that their argument is not really about water or buckets, but about whether the universe is a container or a network. Alex sees a container that resists change, providing a solid ground for truth. Jordan sees a network where truth is only defined by connection, and isolation means the loss of definition. They leave the whiteboard untouched, the diagram of the bucket and the rock staring back at them, a simple picture hiding the question of whether anything exists when nothing else is looking.
