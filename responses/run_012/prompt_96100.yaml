answer: |-
  ### 1. Essay Question

  Aquinas is often read as contradicting himself on the removal of tyrants: his early commentary on the *Sentences* suggests killing a tyrant can be praiseworthy, while *On Kingship* and the *Summa Theologiae* warn against private presumption in killing rulers. Reconcile these texts without claiming Aquinas simply changed his mind. In your answer, distinguish between a *moral* prohibition and a *jurisdictional* limitation, and explain how the status of the ruler (usurper versus legitimate tyrant) affects who has the authority to act. Furthermore, using his discussion of sedition in the *Secunda Secundae*, explain why removing a tyrant is not always seditious, and analyze whether Aquinas's framework requires a standing public authority to be legitimate.

  ***

  ### 2. Model Answer

  The apparent contradiction between Aquinas's early praise of tyrannicide and his later caution against it dissolves when one recognizes that he is addressing different aspects of political action: the objective good of removing a tyrant versus the subjective authority required to execute that removal. Aquinas does not reverse his moral evaluation of tyranny; rather, he refines the procedural conditions under which resistance becomes licit. The tension is not between permission and prohibition, but between an act that is good in itself and an act that requires specific warrant to be performed justly.

  The crucial distinction is between a moral judgment and a jurisdictional limitation. In the *Sentences* commentary, Aquinas affirms that freeing one's country from tyranny is praiseworthy. This establishes the moral baseline: tyranny is an evil, and its removal serves the common good. However, in *On Kingship* and the *Summa*, Aquinas introduces a jurisdictional constraint. He argues that while the end (liberty) is good, the means (private killing) often exceed the agent's authority. To kill a ruler is an act of public justice, not private vengeance. Therefore, the restriction is not that the act is intrinsically evil, but that it belongs to the public power, not private presumption. A private individual lacks the commission to execute judgment upon the head of the body politic.

  This jurisdictional limit depends heavily on the status of the ruler. Aquinas distinguishes between a usurper, who never held legitimate title, and a legitimate ruler who governs tyrannically. Against a usurper, the use of force is defensive; since the usurper has no bond of fidelity with the community, any private citizen may repel them. However, against a legitimate ruler who has become tyrannical, the bond of allegiance remains, however strained. Here, private violence is forbidden because it undermines the office itself, even if the officeholder is corrupt. The remedy must come from within the structure of authority that established the ruler, or from a superior authority (such as the Church or Emperor, in Aquinas's context), not from isolated individuals.

  Aquinas's discussion of sedition in the *Secunda Secundae* clarifies why this resistance is not inherently sinful. He defines sedition as a sin against the unity of the multitude, specifically the unity of law and common good. A tyrant, by governing for private gain rather than the common good, effectively dissolves this unity first. Consequently, those who disturb a tyrant are not technically seditious in the moral sense, because they are restoring the unity of the common good which the tyrant violated. However, this does not grant a license to any dissenter. The absence of sedition makes the *cause* just, but it does not confer the *authority* to act. One can have a just cause and still act sinfully if one acts without proper standing.

  Finally, this framework relies on the existence of a public mechanism for deposition. Aquinas warns that the cure may be worse than the disease; private assassination often leads to greater instability or the rise of a worse tyrant. For the remedy to be legitimate, there must be a public procedure or a superior authority to depose the ruler. If no such public authority exists, Aquinas's advice shifts toward patience and prayer, urging the community to endure the tyranny rather than risk the total collapse of order through private violence. Thus, his system does not collapse in the absence of a mechanism, but it ceases to permit active removal. The later texts do not retract the early praise of liberty but embed it within a stricter theory of public office. The slayer of the tyrant is praiseworthy only if they act as an instrument of public justice; otherwise, they are merely a murderer who happened to kill a bad man.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  | **Required Move** | **Marks** | **Common Student Mistake** |
  | :--- | :---: | :--- |
  | **1. Reconciliation Strategy:** Argues that the texts are compatible (refinement/procedure) rather than claiming Aquinas contradicted himself or simply "changed his mind." | 4 | Claims Aquinas became more conservative/cautious in later life without explaining the structural consistency. |
  | **2. Moral vs. Jurisdictional:** Explicitly distinguishes that the act is morally good (ending tyranny) but jurisdictionally restricted (private persons lack warrant). | 4 | Treats the later restriction as a moral prohibition (i.e., "killing is always wrong") rather than a lack of authority. |
  | **3. Usurper vs. Legitimate Tyrant:** Explains that private force is permissible against a usurper (no title) but restricted against a legitimate ruler (requires public process). | 4 | Conflates all tyrants into one category, ignoring the difference in political title and fidelity. |
  | **4. Sedition & Common Good:** Uses the *Secunda Secundae* to show that resisting a tyrant isn't sedition because the tyrant breaks the unity of the common good first. | 4 | Defines sedition merely as "violence against the state" without referencing the *common good* or *unity of law*. |
  | **5. Role of Public Authority:** Analyzes the necessity of a public mechanism/superior authority for deposition and the risk of private action causing greater disorder. | 4 | Argues that Aquinas permits private individuals to act whenever the ruler is sufficiently evil, ignoring the "cure worse than disease" warning. |
