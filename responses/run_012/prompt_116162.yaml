answer: |-
  **Setting:** *A university common room, late afternoon. Two empty coffee cups sit between them. A whiteboard behind them is covered in half-erased diagrams.*

  **Characters:**
  *   **Alex (Intellectualist):** Argues that knowing-how is a species of knowing-that.
  *   **Jordan (Anti-Intellectualist):** Argues that knowing-how is a distinct ability/disposition.

  ***

  **Alex:** Let's go back to Kasia. The welder. You're treating her inability to articulate the rule as a knockout blow to intellectualism. It isn't.

  **Jordan:** It's not just that she can't articulate it, Alex. It's that she *does* articulate something. She gives you a rule. "I listen for the hiss," or "I watch the puddle width." But when you film her hands and measure the variables, the rule she stated is false. She's not doing what she says she's doing. If knowing-how were knowing-that—grasping a true proposition—she should be able to state the proposition she's grasping.

  **Alex:** Why? I know that the subjunctive conditional is distinct from the material conditional. I can grasp that fact. But if you put me on the spot, tired, I might mangle the explanation. Does that mean I didn't know it? No. It means the knowledge is tacit. Kasia grasps the proposition *under a practical mode of presentation*. She doesn't need linguistic access to the content to be guided by it.

  **Jordan:** "Practical mode of presentation." There it is. The magic phrase. It sounds like you're saying, "It's a proposition, but don't ask me to write it down, because it's... practical." That's not an explanation; it's a label you stick on the phenomenon to force it into your box.

  **Alex:** It's not a label, it's a structural claim. The content is propositional—*that this weld will fail if the amperage drops*—but the way she accesses that content is through sensorimotor engagement, not linguistic inference.

  **Jordan:** Okay, but here is where your box breaks. The hypnosis case. You convince her she's holding a TIG torch when she's actually holding a stick electrode. Suddenly, she can't weld. She freezes. Her performance drops to zero. Now, you want to say her *knowledge* is still there, but her *ability* is masked.

  **Alex:** Exactly. The knowledge persists because the moment the hypnosis breaks, she welds perfectly again. She didn't have to relearn anything. If knowing-how were just the ability, the ability is gone during the trance. So the knowing-how would be gone. But intuitively, Kasia hasn't *forgotten* how to weld. She's just blocked.

  **Jordan:** That intuition is doing all the work for you. And it's circular. You're defining "knowledge" as "the thing that survives the hypnosis." But why should we grant that? If I smash your car's engine, the car loses the disposition to drive. I can fix the engine later, and the disposition returns. Did the car "know how to drive" the whole time the engine was in pieces?

  **Alex:** Bad analogy. The car doesn't have a mental state. Kasia does. The question is: what constitutes the state? Look at the counterfactuals. If you were to snap your fingers and break the trance, she succeeds *immediately*. If she had lost the knowledge, re-acquiring it would take time. The immediacy of recovery is evidence that the underlying state remained intact.

  **Jordan:** Is it? Or is it evidence that the *disposition* was merely masked? I'm happy to say the disposition was masked. That's what dispositions do. Solubility is masked by a hydrophobic coating. The sugar is still soluble, it just can't manifest. But here's the trap, Alex: What counts as evidence that the disposition is *masked* rather than *gone*?

  **Alex:** The counterfactual success I just mentioned.

  **Jordan:** See, that's what I mean. Your evidence for the mask is *just* that the ability comes back when the blocker is removed. But that's true for *any* lost ability that can be regained. If I forget my French, and then take a refresher course and regain it quickly, did I "know French" the whole time? At some point, you have to say the disposition is actually gone. So where is the line? How do you distinguish "masked know-how" from "lost know-how" without just checking to see if you, the Intellectualist, want to say the knowledge persisted?

  **Alex:** The line is in the cognitive architecture. If the neural pathways encoding the propositional content are intact, the knowledge is there. The hypnosis interferes with the *output* mechanism, the translation from practical grasp to motor execution. It doesn't wipe the database.

  **Jordan:** But you can't see the database! You're inferring the database exists *because* the output returns. You're positing a ghostly propositional state that does no causal work during the hypnosis—it can't guide her action, she can't report it, it's inert—and then you say, "Aha, it's still there!" because she moves her hands again later. That's epiphenomenalism about skill.

  **Alex:** It's not epiphenomenal. It's causally potent normally, and causally blocked abnormally. Look, turn the table. If you say knowing-how *is* the disposition, you have to deal with gradability. Kasia knows how to weld better than she knows how to do pipefitting. She's an expert at the first, a novice at the second. Dispositions are binary, Alex. Either you have the disposition to dissolve or you don't. Either you have the disposition to break or you don't. How do you get degrees of disposition without smuggling in a graded underlying state?

  **Jordan:** Dispositions aren't binary. That's a caricature. A glass can be more or less fragile. A chemical can be more or less soluble depending on temperature, pressure, surface area. Kasia's dispositional profile for welding is robust across a wider range of possible worlds than her pipefitting profile. She can weld in the rain, in the dark, with bad equipment. That's a stronger, more resilient disposition.

  **Alex:** But what grounds that resilience? Why is she robust in welding and not pipefitting?

  **Jordan:** Because of her training history. Her physiological and cognitive history has shaped a specific causal power.

  **Alex:** And I'm saying that history installed a body of information. A rich, complex set of truths about metal fusion, heat dynamics, and hand stability. She grasps more truths, and grasps them more firmly, in welding. That explains the gradability. Knowing-that comes in degrees. I know *that* the economy is fragile better than I know *that* the neutrino has mass. I have more justification, more coherence, more access.

  **Jordan:** But when you know *that* the economy is fragile, you can write an essay. You can argue. When Kasia knows *how* to weld, she can't write the essay. She can't argue the metal. She just *does*. If the "practical mode of presentation" is so different from the "theoretical mode" that it bypasses language entirely, that it bypasses conscious report, that it functions through muscle memory and proprioception... at what point does calling it a "proposition" stop adding value?

  **Alex:** It adds value because it explains the *normativity*. Kasia isn't just reacting. She's correcting. If the weld puddle gets too wide, she adjusts. Why? Because she's tracking a standard. She's tracking the fact *that this is incorrect*. A thermostat tracks temperature, but we don't say it knows how to regulate heat. It has no norm. Kasia has a norm. Propositions carry truth conditions. Truth conditions provide the norm.

  **Jordan:** Dispositions have success conditions. A key has a disposition to open a lock. If it bends, it fails the success condition. We don't need to say the key "represents" the lock's tumblers propositionally to explain why it fails when bent. Kasia's body is the key. The weld is the lock. Her "knowledge" is the fit.

  **Alex:** But keys don't learn. Keys don't adapt to a new lock by hypothesizing about the tumblers. Kasia adapts. She forms hypotheses. "If I move my hand two inches left, the penetration improves." That's a hypothesis. That's a proposition.

  **Jordan:** It's a test. Not necessarily a linguistic assertion. It's a probe. A sensory probe. You're insisting that for a probe to be cognitive, it must be propositional. I'm saying the probe *is* the cognitive act.

  **Alex:** Okay, let's go back to the hypnosis. This is the crux. You say the disposition is masked. I say the ability is masked. We agree the performance stops. The disagreement is about what persists. You think if the performance is gone, the know-how is gone. I think the know-how persists because the *guidance system* persists, even if the wheels are locked.

  **Jordan:** But how do we test the guidance system without the wheels turning?

  **Alex:** We test it by unlocking the wheels. If the car drives perfectly immediately, the guidance system was intact.

  **Jordan:** And if I say, "The disposition to drive was intact," what have I lost?

  **Alex:** You've lost the distinction between *knowing* how to drive and *being able* to drive. Imagine a race car driver who breaks both legs. She knows how to drive the car. She can tell you exactly when to shift, when to brake. But she lacks the physical ability to operate the pedals.

  **Jordan:** Standard case. We distinguish physical capacity from skill. I'm not denying that. Kasia has the skill. The skill is the disposition. The hypnosis attacks the *activation condition* of the disposition.

  **Alex:** But in the hypnosis case, it's not her legs that are broken. It's her *confidence*, or her *perception* of the tool. It's cognitive. If I convince you that you don't know how to speak English, you might stutter. You might freeze. Did you lose the knowledge of English?

  **Jordan:** If I freeze, my ability to speak is gone. In that moment. If you say the knowledge is still there, you're saying knowledge is a permanent storage file that exists independently of access.

  **Alex:** Yes! That's what knowledge is.

  **Jordan:** But know-how isn't storage. It's readiness. If I'm not ready, I don't have it.

  **Alex:** That collapses knowledge into performance. If a mathematician is asleep, is she not a mathematician? If Kasia is drunk, does she not know how to weld?

  **Jordan:** She has the *history* that normally produces the disposition. But right now, she doesn't have the know-how. She has the *potential* to regain it quickly. But potential isn't the state itself.

  **Alex:** So if I ask, "Does Kasia know how to weld?" while she's under hypnosis, the answer is "No"?

  **Jordan:** In that specific moment, she cannot exercise the skill. So she lacks the capacity. But we use language loosely. We say "She knows how" because we're talking about her stable traits, not her瞬时 state.

  **Alex:** Aha! So you admit it's a stable trait. A state that persists through temporary interruptions.

  **Jordan:** A stable *disposition*. Yes.

  **Alex:** And what makes it stable? Why doesn't she lose the disposition when she sleeps?

  **Jordan:** Because the neural pathways remain.

  **Alex:** And those pathways encode information. They encode the relationship between heat, speed, and fusion. That encoding *is* the propositional content.

  **Jordan:** Encoding isn't grasping. A hard drive encodes the text of *Hamlet*. It doesn't know *that* Hamlet is a tragedy. Kasia's nerves encode the tension. She *feels* it. The feeling isn't a proposition.

  **Alex:** But the feeling has accuracy conditions. She feels the weld is about to fail. It either is or isn't. That's truth-apt.

  **Jordan:** It's success-apt. A punch is success-apt. It either hits or misses. We don't need to dress it up as a sentence to explain that it can fail.

  **Alex:** But a punch doesn't *adjust* mid-flight based on the wind unless the thrower does. The adjustment implies a representation of the wind.

  **Jordan:** Or it implies a coupled system. The wind hits the skin, the skin signals the muscle, the muscle adjusts. No representation of "wind" required. Just causal coupling.

  **Alex:** You're describing a reflex. Kasia isn't reflexive. She's strategic.

  **Jordan:** Strategy doesn't require sentences. A chess computer plays strategically. Does it know *that* the queen is vulnerable? Or does it just execute a function that maximizes board value?

  **Alex:** If it maximizes board value, it's operating on the *fact* that certain configurations are valuable.

  **Jordan:** You're translating everything into "facts" because that's your ontology. You can't imagine a mind that isn't a sentence-generator.

  **Alex:** And you can't imagine a mind that isn't a muscle-twitcher. You're terrified that if you admit it's propositional, you lose the "practical" part. You won't. The practical mode of presentation *is* the difference. It's not a dodge. It's the claim that the same content—*that the weld is failing*—can be held in a way that directly triggers motor output without passing through the "assertion" center of the brain.

  **Jordan:** Okay. Let's grant you the "practical mode." Let's say she grasps the proposition *that the weld is failing* practically. Now, back to the hypnosis. She believes she's holding a different tool. That's a false belief. A false proposition. *That I am holding a TIG torch.*

  **Alex:** Right.

  **Jordan:** So her knowledge-how is blocked by a false belief. But you said her knowledge-how *persisted*. So she simultaneously grasped the practical proposition *that the weld is failing* and the theoretical falsehood *that I am holding a TIG torch*, and the second one canceled the first?

  **Alex:** Essentially. The false belief disrupted the application conditions.

  **Jordan:** So the "knowledge-how" was powerless against a mere belief. But if knowledge-how is supposed to be this robust, action-guiding state, why does a little hypnosis shut it down?

  **Alex:** Because action requires the integration of multiple cognitive states. Belief, desire, and know-how. If the belief input is corrupted, the know-how can't execute.

  **Jordan:** But if the know-how is just a disposition to act, the hypnosis removes the disposition. It's simpler. You have a complex architecture of propositions that need to align perfectly. I have a disposition that is sensitive to context. The hypnosis changes the context. The disposition vanishes. When the context returns, the disposition returns.

  **Alex:** But "context" is just a shorthand for "the set of true propositions the agent accepts." If she accepts *I am holding a stick electrode*, the disposition activates. If she accepts *I am holding a TIG torch*, it doesn't. The difference is in her propositional attitudes.

  **Jordan:** Or the difference is in her phenomenological stance. She *feels* like she's holding a TIG torch. That feeling isn't a proposition. It's a sensory gestalt. And that gestalt gates the ability.

  **Alex:** We're going in circles. You reduce the gestalt to causal powers; I reduce it to non-linguistic content.

  **Jordan:** No, we're not. Here's the progress. We agree Kasia has a stable trait that allows her to weld successfully in normal conditions. We agree this trait can be temporarily inhibited by cognitive interference (hypnosis) without erasing the learning history.

  **Alex:** Agreed.

  **Jordan:** The disagreement is whether that stable trait *is* a relation to a proposition, or a causal power. You think if it's not a relation to a proposition, it can't be normative. It can't be wrong.

  **Alex:** Exactly. If it's just a causal power, like digestion, she can't be *mistaken*. She just fails. But she *can* be mistaken. She can feel a failure coming and be wrong.

  **Jordan:** And I think if it *is* a relation to a proposition, you can't explain why language is so bad at accessing it, and why the "practical mode" doesn't just collapse into "unconscious belief." You're positing unconscious beliefs that act like muscles.

  **Alex:** And you're positing muscles that act like beliefs.

  **Jordan:** ...Okay. That's the hinge.

  **Alex:** It is. You need the normativity without the sentence. I need the sentence without the articulation.

  **Jordan:** So the Kasia case doesn't decide it. The hypnosis doesn't decide it. It comes down to whether you think normativity *requires* truth-conditions.

  **Alex:** I do.

  **Jordan:** I don't. I think success-conditions are enough.

  **Alex:** Then we aren't arguing about Kasia anymore. We're arguing about what makes a mental state *mental*.

  **Jordan:** Finally. Pass the coffee.

  **Alex:** Only if you admit the "masked disposition" move was suspicious.

  **Jordan:** Only if you admit "practical mode of presentation" sounds like a get-out-of-jail-free card.

  **Alex:** Deal.
