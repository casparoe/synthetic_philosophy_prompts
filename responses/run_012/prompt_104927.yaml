prompt: |-
  So there's a move I keep noticing in arguments and I finally want to ask somebody about it.

  Here's the move. Somebody explains why something happened by pointing at a big-picture feature of the situation. Then somebody else says: look, you can tell the whole story one level down, in terms of the small stuff, and the small stuff already accounts for everything that happened. So the big-picture feature can't be doing any of the work, its just along for the ride. And the funny thing is that it works the same way no matter what the two levels are:

  - My friend says his depression is why he couldn't get out of bed for a month. His brother says no, the brain chemistry did that, "depression" is just what we call the pattern, so it isn't the thing causing anything.
  - In a seminar about hiring algorithms, a guy said the model isn't what discriminated against women, the individual weights are, and the model is just a name for the weights.
  - My sister, who's a nurse, got told she shouldn't feel bad about following a bad protocol, because the protocol didn't make her do anything, the specific written instructions did.

  So: does this have a name? Someone told me it's epiphenomenalism, but that can't be right, because the people making the move usually insist the big-picture thing is perfectly real, they just say it isn't a cause. Someone else said it's the problem of mental causation, but two of my three cases have nothing to do with minds. And I don't think it's plain reductionism either, for the same reason.

  What I actually want is the carving, not a label. Is this one argument, or three arguments that happen to look alike? In the depression case the two levels look like two ways of describing the same thing; in the protocol case the instructions are literally parts of the protocol, which feels like a different shape. Does the move only go through if you add a premise that every event has exactly one cause, or is that smuggled in? And is it even valid — because it seems like you could run it against the higher level every single time and never lose, which makes me suspicious. If there's no established name for the general thing, coin one, but tell me exactly where its edges are: which cases it covers and which it doesnt.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Phenomenon:** The user observes a specific argumentative move where a higher-level explanation (big-picture feature) is dismissed as causally inert because a lower-level explanation (small stuff) fully accounts for the outcome.
      *   **Examples Provided:**
          1.  Depression vs. Brain Chemistry (Mental vs. Physical).
          2.  Model Discrimination vs. Individual Weights (Algorithmic vs. Parameters).
          3.  Bad Protocol vs. Specific Instructions (Organizational vs. Concrete).
      *   **User's Constraints/Questions:**
          *   Is there a name? (Rejected "epiphenomenalism," "problem of mental causation," "reductionism" for specific reasons).
          *   Is it one argument or three different ones?
          *   Does it rely on a hidden premise (e.g., "every event has exactly one cause")?
          *   Is it valid? (User suspects it's too powerful/unbeatable).
          *   **Goal:** "The carving, not a label." Define the boundaries, validity, and structure of this move. If no name exists, coin one but define edges precisely.

  2.  **Deconstruct the Argumentative Move:**
      *   *Premise 1:* Event $E$ occurred.
      *   *Premise 2:* High-level property $H$ explains $E$.
      *   *Premise 3:* Low-level property $L$ realizes/constitutes $H$ and also explains $E$.
      *   *Premise 4:* $L$ is sufficient for $E$.
      *   *Conclusion:* Therefore, $H$ is not a cause of $E$ (it's "just along for the ride").
      *   *Underlying Assumption:* Causal exclusion. If $L$ does the work, $H$ doesn't need to (or can't).

  3.  **Evaluate Existing Philosophical Concepts:**
      *   *Epiphenomenalism:* User rejected this because the arguers admit $H$ is real, just not causal. Classical epiphenomenalism often treats mental states as causally inert by-products. This is close, but the user wants to capture the *argumentative move*, not just the ontological status.
      *   *Reductionism:* User rejected this because reductionism usually implies $H$ *is* $L$, whereas this argument sets them against each other causally.
      *   *Causal Exclusion Argument (Jaegwon Kim):* This is the big one. Kim argued that if physical causes are sufficient, mental causes are excluded. This fits the depression case perfectly. Does it fit the others? Yes, structurally.
      *   *Overdetermination:* The argument assumes $E$ isn't overdetermined (caused twice). If $L$ causes it, $H$ shouldn't also cause it, unless we accept systematic overdetermination.
      *   *Level Confusion / Category Error:* Sometimes this is framed as confusing levels of abstraction.
      *   *The "Nothing Butter" Fallacy:* "X is nothing but Y."

  4.  **Analyze the Validity (The "Suspicion"):**
      *   The user suspects the move is "too powerful." They are right. If valid, it leads to *causal nihilism* or *fundamentalism* (only physics causes anything).
      *   Why? Because you can always go one level down. Weights $\to$ Electrons $\to$ Quarks $\to$ Fundamental Fields. If the move works at every step, only the bottom layer causes anything.
      *   This suggests the move relies on a false dichotomy or a specific view of causation (production vs. difference-making).

  5.  **Synthesize the "Carving":**
      *   **Name:** The most accurate philosophical term is **The Causal Exclusion Argument** (specifically Kim's version). However, since the user wants a "carving" and potentially a new label if needed, I should acknowledge Kim but focus on the structure. A good descriptive label might be **"The Lower-Level Sufficiency Move"** or **"Causal Displacement."** Let's stick close to the philosophical literature but explain it clearly. Actually, **"The Exclusion Move"** is precise.
      *   **Is it one argument?** Yes, structurally. It relies on the **Principle of Causal Exclusion**: No single event can have more than one sufficient cause at a given time (unless it's genuine overdetermination).
      *   **The Hidden Premise:** Yes, "Causal Closure of the Physical" (or the relevant lower level) + "Exclusion."
      *   **Validity:** It is valid *if* you accept specific metaphysical premises about causation (causation as "oomph" or production). It fails if you view causation as "counterfactual dependence" or "information."
      *   **Edges/Boundaries:**
          *   *Works when:* Causation is viewed as physical push/pull; levels are strictly hierarchical; realization is tight.
          *   *Fails when:* Causation is viewed as difference-making; higher levels provide necessary constraints; multiple realizability makes the lower level explanation too messy.

  6.  **Drafting the Response:**
      *   **Acknowledge the insight:** Validate that the user has spotted a deep philosophical problem.
      *   **Identify the Core:** It is indeed **The Causal Exclusion Argument** (Jaegwon Kim). Even though the user doubted "epiphenomenalism," Kim's argument is the engine that *generates* epiphenomenalism.
      *   **Address the "One Argument or Three" question:** It is one structural argument applied to different domains. The "shape" is identical: Sufficiency at Level L $\to$ Exclusion at Level H.
      *   **Address the "Hidden Premise":** Yes, the **Principle of Causal Exclusion**. Also, the assumption that causation is a "zero-sum game."
      *   **Address Validity (The "Too Powerful" worry):** This is the crucial part. Explain why philosophers think this leads to "causal drainage" (only fundamental physics causes anything). Explain the counter-move: **Causation as Difference-Making** (interventionist accounts).
      *   **Coining a Term (if needed):** While "Causal Exclusion" is the technical term, the rhetorical move is often **"Causal Displacement"** or **"The Bottom-Level Sweep."** Let's use "The Exclusion Move" but define it rigorously as requested.
      *   **Differentiating the Cases:**
          *   Depression: Realization (Mental realized by Physical).
          *   Algorithm: Constitution (Model constituted by Weights).
          *   Protocol: Instantiation (Abstract rule instantiated by concrete text).
          *   *Crucial distinction:* In the protocol case, the protocol *is* the instructions in a normative sense. In the depression case, depression *supervenes* on chemistry. The move treats them all as "Competition for Causal Oomph."

  7.  **Refining the "Carving":**
      *   *Condition for the move to work:* The lower level must be *causally sufficient*.
      *   *Condition for the move to fail:* If the higher level captures a *pattern* that the lower level obscures (multiple realizability). E.g., The "model" discriminates because of the *structure* of weights, not just the weights themselves. Changing one weight might not stop discrimination; changing the structure does.
      *   *The "Edges":* It applies to any layered ontology where the lower layer is deemed "more real" or "more fundamental." It does *not* apply if the layers are not ontologically dependent (e.g., two independent agents).

  8.  **Final Polish:**
      *   Ensure the tone is analytical and respectful.
      *   Make sure to answer the specific questions: Name? One or three? Hidden premise? Valid? Edges?
      *   *Self-Correction on "Epiphenomenalism":* The user said "people... insist the big-picture thing is perfectly real, they just say it isn't a cause." This is *non-reductive physicalism* struggling with Kim's argument. So identifying it as Kim's Exclusion Argument is correct, even if they deny the label "epiphenomenalist."
      *   *Key Insight to deliver:* The move confuses *ontological dependence* with *causal competition*.

  9.  **Structure of the Output:**
      *   **Identification:** It's the Causal Exclusion Argument.
      *   **The Structure:** Break down the logic.
      *   **The Hidden Premise:** The Zero-Sum Assumption.
      *   **Validity Check:** Why it leads to "Causal Drainage."
      *   **The Counter-Move:** Difference-making vs. Production.
      *   **The Carving (Edges):** When it applies vs. when it fails.

