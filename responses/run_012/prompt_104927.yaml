answer: |-
  You have identified one of the most persistent and structurally significant problems in metaphysics and the philosophy of science. You are right to be suspicious of it, because if the move is valid, it destroys almost all explanation except fundamental physics.

  The established name for this argument is **The Causal Exclusion Argument** (most famously formulated by Jaegwon Kim). However, since you want the *carving* rather than just the label, I will break down the mechanics of the move, the hidden premise that powers it, why it feels unbeatable, and where its edges actually lie.

  ### 1. Is it one argument or three?
  It is **one argument**. The structural shape is identical in all three cases.

  In every instance, the arguer is relying on a specific model of causation: **Causation as Production.** In this model, causation is a kind of "oomph" or energy transfer that brings an effect into being. Because "oomph" is treated as a conserved quantity (like energy), there is a zero-sum assumption: if the low-level stuff provided the oomph, there is none left for the high-level stuff to provide.

  *   **Depression:** Brain chemistry provides the physical push; "depression" has no physical push left to give.
  *   **Algorithm:** The weights mathematically determine the output; the "model" adds no extra math.
  *   **Protocol:** The ink on the page (instructions) physically guides the hand; the "protocol" (abstract rule) adds no extra physical guidance.

  The move works across these domains because it treats the relationship between levels as **competitive** rather than **constitutive**.

  ### 2. The Hidden Premise
  You asked if the move requires a premise that "every event has exactly one cause." It is slightly more specific than that. The move relies on two hidden premises:

  1.  **The Principle of Causal Closure:** Every physical event has a sufficient physical cause. (The brain chemistry/weights/instructions are sufficient).
  2.  **The Principle of Causal Exclusion:** No single event can have more than one *sufficient* cause at a given time (unless it is a case of genuine overdetermination, like two assassins shooting at once).

  The argument smuggles in the idea that if the lower level is *sufficient*, the higher level is *redundant*. It assumes that causation is a contest where only one explanation can win the trophy of "The Cause."

  ### 3. Is it valid? (The "Too Powerful" Problem)
  Your suspicion is correct: **If this move is valid, causation drains away.**

  This is known in philosophy as **The Problem of Causal Drainage**. If you accept the Exclusion Move, you must apply it recursively:
  *   The weights didn't cause the discrimination; the electrical currents in the GPU did.
  *   The currents didn't cause it; the movement of electrons did.
  *   The electrons didn't cause it; the quantum fields did.

  If the move holds at every level, then **only the most fundamental level of reality causes anything.** Tables, chairs, people, protocols, and models never cause anything; they are just shadows cast by fundamental particles.

  Most philosophers reject the conclusion of the Exclusion Move precisely because it leads to this absurdity (causal nihilism about everyday objects). Therefore, the move is generally considered **unsound**, not because the logic is wrong, but because the premise (Causal Exclusion) is false when applied to layered systems.

  ### 4. The Carving: Where the edges are
  To answer your request for the "carving," here is exactly where this move applies and where it breaks.

  **The Move Succeeds When:**
  *   **Causation is defined as physical production:** If you define "cause" strictly as "physical force transfer," the higher level literally cannot add any force.
  *   **The levels are synchronous:** The high-level event and low-level event happen at exactly the same time. (If the protocol was written *before* the action, it has temporal priority, which weakens the exclusion move).
  *   **Realization is tight:** The higher level is nothing over and above the lower level (e.g., the model *is* the weights).

  **The Move Fails When:**
  *   **Causation is defined as Difference-Making:** This is the standard counter-move. Causation isn't about "oomph"; it's about counterfactuals. "If the protocol had been different, would the nurse have acted differently?" If yes, the protocol is a cause, regardless of the physical instructions.
  *   **Multiple Realizability:** This is the strongest edge. The "model" discriminates against women. You could change all the weights (the lower level) to different numbers, but if the *structure* remains the same, it still discriminates. The lower-level story changes completely, but the higher-level cause (the model structure) remains the same. Therefore, the lower-level story does *not* fully account for the stability of the outcome. The higher level is doing work the lower level cannot.
  *   **Constraint vs. Component:** In the protocol case, the protocol acts as a **constraint**. The instructions are the components, but the protocol is the rule that selected those instructions. A constraint is not in competition with the components; it organizes them.

  ### 5. A Name for the Rhetorical Move
  While "Causal Exclusion" is the metaphysical argument, the rhetorical tactic you are noticing—dismissing a higher-level explanation by pointing to a lower-level sufficiency—is often called **"Nothing-Buttery"** or **"The Bottom-Level Sweep."**

  However, if you want to coin a term that captures the specific *error* in the carving, I suggest calling it **"The Fallacy of Causal Competition."**

  It is a fallacy because it assumes that for $H$ (High level) to be a cause, it must compete with $L$ (Low level) for causal status. In reality, $H$ usually *depends* on $L$ to be a cause. The depression causes the inaction *by means of* the chemistry. The protocol causes the action *by means of* the instructions. They are not rivals; they are partners in a single causal chain described at different resolutions.

  ### Summary
  *   **Is it one argument?** Yes. It is the Causal Exclusion Argument.
  *   **Hidden Premise:** Causation is a zero-sum resource (Exclusion Principle).
  *   **Validity:** It is logically valid but leads to absurd conclusions (only fundamental physics causes anything), so the premise is usually rejected.
  *   **The Edge:** The move fails when the higher level captures **patterns** or **constraints** that remain stable even when the lower-level details change (Multiple Realizability).
  *   **The Label:** The **Fallacy of Causal Competition**.

  The people using this move are treating explanations like territories: "If the micro-territory covers this ground, the macro-territory has nowhere to stand." But explanations aren't territories; they are resolutions. A map at 1:1 scale (the micro) covers the ground perfectly, but it is useless for navigation. The 1:10,000 map (the macro) is still a cause of your successful arrival, because it provided the *information* the micro-map obscured.
