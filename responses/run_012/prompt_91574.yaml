answer: |-
  The drum was made of synthetic skin stretched over a hollowed-out polymer shell, but Lin treated it like wood. He tapped it with his fingertips, testing the tension, standing at the edge of the Sector 4 orchard. The trees here were heavy with fruit, low-hanging branches bowed under the weight of peaches that smelled like honey and wet earth. This was the harvest plot. This was where the slurry from the community digesters had been pumped last spring.

  This was where his daughter was feeding the roots.

  In this town, you didn't bury your dead in boxes that rotted slowly in the dark, starving the ground. You didn't burn them and shoot the carbon into the sky. You put them in the mixers. You became nutrients. It was the only logical way to live in a closed system. Lin had preached this for forty years. When his wife died, ten years prior, he had sat on the floor of their living room and beaten a bucket with a stick while the neighbors wept. He had sung about the seasons turning, about how grief was a refusal to accept the flow of things. He had told Hu, his best friend, that wailing was for people who didn't understand fate.

  Hu had called him a cold bastard then. Lin had called Hu a prisoner of form.

  Now, Lin stood under the peach trees, the drum strapped to his shoulder. The harvest festival was an hour away. The neighbors would come to eat the fruit grown from the departed. It was supposed to be a celebration of continuity. *She is not gone,* Lin told himself. *She is just changing shape.*

  But the logic felt thin today, like paper stretched over a drumhead that had gone slack.

  His daughter, Mei, had been twenty-two. She hadn't died of old age, completing the cycle like a leaf falling in autumn. She had died in a crash on the maglev line. A sudden stop. A violent break. There was no season in it. There was only the before and the after.

  Lin walked down the row of trees. He knew which one held the most of her. The technicians marked the plots, though everyone knew the roots tangled beneath the surface anyway. You couldn't keep the dead separate. They mingled in the soil, a communal broth of nitrogen and phosphorus. He stopped at Tree 402. The peaches were large, fuzzy, blushing deep red near the stem.

  He reached out and touched one. It was warm from the sun.

  "The crows will eat me above, the ants below," he muttered to the tree. It was the old argument. Why build a box? Why pretend the body is sacred dust when it is just borrowed matter? If you bury it, you rob the ants to feed the worms. If you burn it, you rob the air to feed the sky. Better to let it feed the fruit. Better to let the living eat the dead.

  It made sense. It was elegant. It was true.

  So why did his hand shake?

  He unstrapped the drum. He needed to sing. That was the ritual. You sang to acknowledge the transformation, to welcome the dead into their new state. If you didn't sing, you implied that death was a tragedy rather than a transition. He had done it for his wife. He had done it for his parents. He had taught the children in the schoolhouse to clap when a classmate's hamster died and was put into the garden compost.

  He raised the mallet. He opened his mouth.

  Nothing came out.

  He tried again, aiming for the low hum he used to start the chant. *The breath condenses into life, it disperses into death.* The words sat in his throat like stones.

  He hit the drum. The sound was sharp, cracking through the quiet orchard. A bird startled from the branches above—a kite, scanning for mice. Lin watched it circle. *Up there,* he thought. *And down here.* The division was arbitrary. Mei was in the soil, but she was also in the air, in the rain that watered this tree.

  But she wasn't *here*. Not in the way that mattered.

  Lin sat on the grass, leaning against the trunk of Tree 402. He remembered the dream he'd had last night. He had been a butterfly, fluttering over the orchard, landing on the peaches. He woke up and couldn't tell if he was Lin who had dreamed he was a butterfly, or a butterfly now dreaming he was Lin.

  If the dream was real, then death was just waking up. If death was a dream, then he was the one sleeping now. The uncertainty was supposed to be liberating. It was supposed to make the boundary porous. If you couldn't tell the difference between waking and dreaming, you shouldn't fear the end of the dream.

  But if Mei was the dreamer now, and he was just a figment in her sleep, then his grief was part of her dream. Was she dreaming a sad dream? Was he hurting her by refusing to let go?

  Or was she gone, and this tree was just a tree, and the fruit was just sugar and water, and the philosophy was just a story men told themselves to keep from screaming?

  "Lin?"

  He didn't turn. He knew the voice. Hu. Old now, walking with a cane, wearing the ceremonial sash of the elders.

  "You're supposed to be at the pavilion," Hu said. He didn't sit. He stood over Lin, shadowing him.

  "I'm tuning the drum," Lin said. His voice sounded rough.

  "You haven't sung."

  "I'm waiting for the right note."

  Hu sighed. He looked up at the peaches. "They look good this year. High nitrogen."

  "Yes."

  "My wife is in Sector 2," Hu said. "The apple plot. I can't eat them. I know... I know what you taught us. I know it's the right way. But I can't bite into her."

  Lin looked up. Hu's face was lined with guilt. This was the friction. The theory was perfect, but the biology was stubborn. The stomach knew what it was eating. The mind knew where the calories came from.

  "If you don't eat them," Lin said, "you waste her. You let her rot on the branch. That's the real disrespect."

  "Is it?" Hu asked. "Or is the respect letting her be? Maybe she doesn't want to be a peach. Maybe she wants to be remembered as a woman, not a snack."

  "That's ego," Lin said, but the bite was gone from his voice. "That's you wanting to keep her as a statue. Statues don't feed anyone."

  "And pain does?" Hu gestured to Lin's hands. "You're bleeding."

  Lin looked down. He had been gripping the drum mallet so tight his fingernails had dug into his palm. He wiped the blood on his trousers.

  "I thought I understood it," Lin said. "When my wife died, I understood it. It was winter turning to spring. It was clear. But this..." He gestured to the tree. "This feels like theft."

  "Because she was young."

  "Because she was mine."

  Hu finally sat. He leaned his cane against the tree. "You know, the old stories say the master drummed on a tub when his wife died. He said she was just resting in a giant room. But I wonder if he drummed to drown out the sound of his own heart breaking. Maybe the singing wasn't for the dead. Maybe it was to convince the living."

  Lin looked at the peach again. It was perfect. Unblemished. It contained the calcium of Mei's bones, the iron of her blood. To eat it was to complete the cycle. To refuse it was to break the chain.

  "If I eat this," Lin said, "I become her. Literally. Her atoms become my atoms."

  "Yes."

  "And if I dream tonight... will I dream her?"

  "Maybe," Hu said. "Or maybe you'll just have a stomach ache."

  Lin laughed. It was a dry, brittle sound. He picked the peach. It came away from the branch with a soft tear. Juice ran down his wrist, sticky and sweet. He held it up. The sun shone through the flesh, glowing amber.

  He brought it to his mouth. He could smell it. It smelled like the orchard, like the compost mix, like the specific, unique scent of Mei's hair when she came in from the rain.

  He bit down.

  The flavor exploded. Sweet, acidic, complex. It was the best peach he had ever tasted. It was vibrant with life. It was also a violation. He chewed. He swallowed. He felt the flesh go down his throat, entering the dark warmth of his body.

  He waited for the revelation. He waited for the sense of unity, the dissolving of the self into the great flow. He waited for the comfort of the cycle to close around him like a blanket.

  He felt only fullness. And a hollow ache behind his ribs that the fruit did not fill.

  Hu watched him. "Well?"

  Lin wiped his mouth with the back of his hand. He looked at the drum sitting in the grass. He looked at the tree, standing silent and indifferent, already dropping leaves for the winter cycle.

  "It tastes like her," Lin said.

  "Is that good?"

  "No."

  Lin picked up the drum. He stood up. He didn't sing. He didn't chant about the seasons or the great transformation. He strapped the drum to his back and started walking toward the pavilion where the others were gathering.

  "Are you going to play?" Hu asked, standing up slowly.

  Lin stopped. He looked back at Tree 402. The wind shook the branches, and a few leaves drifted down, landing on the grass where Mei's body had been processed. They would rot. They would feed the soil. They would become next year's fruit.

  "I don't know if I'm the man who ate the peach," Lin said, "or the peach that dreamed it was eaten."

  "Does it matter?"

  "It matters to the hunger," Lin said.

  He walked away, leaving the drum silent. He would sit with the others. He would eat the apples from Sector 2. He would accept the logic of the compost and the necessity of the return. He would not argue against the cycle. But he would not sing about it anymore. The mystery of the butterfly was too heavy to carry when the weight of the body was this light, and this gone.

  Hu watched him go, then looked up at the peaches. He reached out and picked one. He held it for a long time, feeling the weight of it, before taking a bite. He chewed slowly, tears running down his face, not because he was sad, but because the fruit was sweet, and sweetness was a kind of pain when you knew where it came from.

  Above them, the kite circled, waiting for something to die so it could live. Below them, the ants marched in lines, carrying away the crumbs. The work continued, indifferent to the drumming, indifferent to the song, indifferent to whether any of it was a dream.
