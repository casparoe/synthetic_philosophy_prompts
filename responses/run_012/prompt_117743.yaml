      *   **Lecturer's Point:** The lecturer mentioned Kelly is justified by time-average growth of a single trajectory vs. ensemble average.
      *   **User's Confusion:** Why does the time-average vs. ensemble-average distinction matter if the math looks the same (maximize $E[\log W]$)?
      *   **Request:** Clarify what is at issue, separate settled facts from contested interpretations, and avoid presenting contested views as consensus.

  2.  **Deconstruct the Mathematical Equivalence (The "Settled" Part):**
      *   *Fact:* Mathematically, maximizing the expected growth rate of wealth in a repeated multiplicative process is equivalent to maximizing the expected value of the logarithm of wealth.
      *   *Fact:* In standard von Neumann-Morgenstern (vNM) expected utility theory, an agent *can* have a logarithmic utility function.
      *   *Conclusion:* If an agent *happens* to have log utility, Kelly betting is the optimal strategy under EUM. This is mathematically uncontroversial.

  3.  **Identify the Philosophical/Normative Disagreement (The "Contested" Part):**
      *   *Standard EUM View:* Utility functions represent subjective preferences over risk. Log utility is a specific *preference* (risk aversion). If you prefer linear utility (risk neutrality), you maximize expected wealth, not geometric growth. EUM says "choose whatever utility function reflects your true preferences."
      *   *Geometric Rationality/Kelly View (Ole Peters et al.):* The argument isn't about preference. It's about *ergodicity*. In non-ergodic systems (like multiplicative wealth dynamics), the ensemble average (EUM) does not equal the time average (what actually happens to one person over time). Therefore, maximizing ensemble average (linear wealth) leads to ruin for the individual. Maximizing geometric growth is claimed to be *objectively* rational for survival/growth, regardless of subjective risk preference.
      *   *The Crux:* Is log-utility a *preference* (EUM view) or a *requirement of rationality in multiplicative environments* (Geometric view)?

  4.  **Address the "Time-Average vs. Ensemble-Average" Point:**
      *   *Ensemble Average:* What happens if a million people bet once. (Standard EUM focus).
      *   *Time Average:* What happens if one person bets a million times. (Kelly/Ergodicity focus).
      *   *Why it matters:* In multiplicative processes, these diverge. EUM traditionally ignores this distinction by assuming utilities map outcomes to values such that the expectation is meaningful. Ergodicity economics argues the mapping itself (log) is derived from the dynamics, not the psychology.

