answer: |-
  You have identified the exact point where the literature stalls. Your supervisor and your reading group are talking past each other because they are optimizing for different values in the conceptual space. Your supervisor is optimizing for *moral coherence* (guilt requires a guilty mind); your reading group is optimizing for *political realism* (states act continuously, so they must answer continuously).

  You are right to demand the desiderata before the solution. If we don't know what the theory is *for*, we cannot judge if it succeeds. Below is the specification you asked for, followed by the trilemma, and finally, my verdict on how to break it.

  ### Part 1: The Desiderata Specification

  An adequate theory must navigate the following constraints. I have distinguished between **Non-Negotiables** (logical or deep moral constraints that, if violated, render the theory incoherent or abhorrent) and **Contestable Prejudices** (theoretical commitments that define schools of thought but are not strictly required for the concept to function).

  | Category | Desideratum | Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **Cases** | **The Turnover Case** | Must account for a population where 0% of original wrongdoers remain alive. | **Non-Negotiable** (This is the core phenomenon). |
  | | **The Immigration Case** | Must distinguish between descendants of perpetrators, descendants of victims, and new citizens with no lineage tie. | **Non-Negotiable** (Differentiates guilt from stigma). |
  | | **The Toy Case** | Must handle: 20yrs reparations, 40% new citizens, victims are non-citizen diaspora. (Tests the link between citizenship, liability, and victimhood). | **Non-Negotiable** (Your specific theoretical target). |
  | | **The Apology Case** | Must explain why an official apology changes the moral landscape but doesn't necessarily erase the debt. | **Contestable** (Some argue apology extinguishes guilt; others say it begins it). |
  | **Distinctions** | **Guilt vs. Liability** | Must distinguish *being to blame* (guilt) from *being the site of payment* (liability). | **Non-Negotiable** (Collapsing these punishes the innocent). |
  | | **Distributive vs. Non-Distributive** | Must specify if guilt inheres in members (distributive) or the corporate entity only (non-distributive). | **Contestable** (Methodological Individualism vs. Holism). |
  | | **Act vs. Benefit** | Must distinguish guilt for *doing* vs. guilt for *profiting from* (unjust enrichment). | **Contestable** (Benefit-based theories avoid the agency problem). |
  | | **Living vs. Dead** | Must not attribute mental states to the dead, nor obligations to the unborn. | **Non-Negotiable** (Metaphysical constraint). |
  | **Constraints** | **The Agency Constraint** | Guilt requires an agent capable of intentionality. | **Non-Negotiable** (Without this, guilt is superstition). |
  | | **Ought-Implies-Can** | Cannot demand members do what is impossible (e.g., change the past). | **Non-Negotiable**. |
  | | **The Non-Identity Constraint** | Cannot invalidate claims of descendants on the grounds that they wouldn't exist otherwise. | **Non-Negotiable** (Avoids the Parfitian repugnant conclusion). |
  | | **The Affective Constraint** | Must account for why this *feels* like guilt (shame, remorse) and not just a tax. | **Contestable** (Is the affect necessary or incidental?). |

  #### Where Jaspers Sits
  Karl Jaspers' *The Question of German Guilt* (1947) is the ur-text here. His four-way split maps onto your desiderata as follows:

  1.  **Criminal Guilt:** Violations of law. **Verdict:** *Genuine Guilt.* Applies only to specific individuals who committed acts. **Cannot** be transgenerational.
  2.  **Political Guilt:** Liability for the deeds of the state. **Verdict:** *Not Guilt, but Liability.* Jaspers explicitly says all citizens bear this regardless of personal action. This is the category your reading group wants, but they mistakenly call it "guilt."
  3.  **Moral Guilt:** Personal conscience regarding one's own actions/omissions. **Verdict:** *Genuine Guilt.* **Cannot** be transgenerational (I cannot feel moral remorse for my grandfather's sins, only for my reaction to them).
  4.  **Metaphysical Guilt:** Solidarity among humans; co-responsibility for every wrong in the world. **Verdict:** *Not Guilt, but Solidarity.* Too broad to be actionable policy.

  **Mapping:** Your supervisor is defending **Criminal/Moral Guilt** (Non-Negotiable constraints). Your reading group is defending **Political Guilt** (Contestable Prejudice: calling it "guilt" rather than "liability").

  ---

  ### Part 2: The Trilemma

  You identified the tension correctly. Let's formalize it.

  1.  **The Retributive Constraint:** Transgenerational collective guilt must be *real guilt* (backward-looking culpability, deserving of blame/punishment, not just forward-looking repair).
  2.  **The Agency Constraint:** Only entities with intentional states (minds) can bear culpability.
  3.  **The Temporal Constraint:** Present members of the nation (and the current state apparatus) do not possess the intentional states regarding the past act (they didn't will it).

  **The Proof of Incoherence:**
  *   If (1) and (2) are true, then the entity bearing guilt must have had the intentional states.
  *   If (3) is true, the present entity lacks them.
  *   Therefore, the present entity cannot bear *real guilt*.
  *   To say it does is to deny (2) (mysticism) or deny (3) (fiction) or deny (1) (redefinition).

  ---

  ### Part 3: The Verdict

  Here is where I take a side. I am going to tell you to **drop Horn (1)**.

  **You must abandon the claim that transgenerational collective "guilt" is *retributive culpability*.**

  If you try to keep (1), you are forced into metaphysical gymnastics to satisfy (2) and (3). You end up positing a "national soul" or a "collective mind" that persists through time (denying 3) or you argue that current citizens implicitly ratify past crimes (which is empirically false for the 40% immigrants in your toy case).

  If you keep (1) and (3), you must deny (2). This leads to the "category error" your supervisor warns about: blaming a brick wall for hitting you. A state without a mind cannot be *culpable* in the moral sense.

  **The Solution:**
  Accept that **transgenerational collective guilt is not guilt.** It is **Political Liability grounded in Historical Injustice.**

  #### Why this isn't a verbal dodge
  You asked if this is just a verbal dodge that leaves the moral work untouched. It is not, provided you understand where the moral work actually lies.

  1.  **The Shift from *Blame* to *Burden*:**
      *   **Guilt (Horn 1):** Implies the agent is *tainted*. The focus is on the *perpetrator's moral status*. It demands suffering, confession, or punishment to cleanse the stain.
      *   **Liability (My Proposal):** Implies the agent is *indebted*. The focus is on the *victim's structural position*. It demands repair, restitution, and institutional change.
      *   **Why it matters:** If you insist on "guilt," the 40% of new citizens in your toy case will resist because they rightly feel they are being asked to feel shame for acts they didn't commit. If you frame it as "liability," you are asking them to uphold the obligations of the political entity they chose to join. You join a corporation, you inherit its debts. You don't inherit its *sins*, but you do inherit its *bills*.

  2.  **Solving the Non-Identity Problem:**
      *   Retributive guilt struggles here. If the descendants wouldn't exist without the wrong, were they harmed?
      *   Liability bypasses this. It doesn't matter if they exist; it matters that the *structure* they inhabit was built on unjust appropriation. The obligation is to fix the structure, not to compensate for "harm" in a counterfactual sense.

  3.  **Preserving the Affective Element (without the Metaphysics):**
      *   Does this lose the "guilt" feeling? No. It translates *remorse* (I did bad) into *responsibility* (I must fix this).
      *   For the descendants of perpetrators: They may feel *moral guilt* (Jaspers' Category 3) for *denying* the history or *benefiting* silently.
      *   For the new citizens (the 40%): They bear *political liability*. They don't need to feel shame, but they must accept the tax burden or policy constraints required for repair.

  #### Application to Your Toy Case
  *   **The State:** Bears **Political Liability**. It continues to exist legally. It signed the treaties (or committed the acts). It owes the debt.
  *   **The 40% New Citizens:** Bear **Distributive Liability**. As shareholders in the state, they fund the reparations. They do *not* bear **Guilt**. They should not be asked to apologize for acts they didn't do. They should be asked to *sustain the apology* made by the state.
  *   **The Diaspora Victims:** They hold the **Claim**. Their lack of citizenship is irrelevant to the *liability* of the state that wronged them (or their ancestors). The obligation travels with the State, not the passport.
  *   **The 20-Year Apology:** This confirms the State has accepted Liability. The debate is no longer "Did we do it?" but "Is the debt paid?"

  ### Part 4: What Is Left Standing?

  If you drop Horn (1), is the result recognisably "guilt"?
  **No.** And you should say that in your thesis.

  Call it **"Inherited Political Obligation"** or **"Transgenerational Liability."**

  If you continue to use the word "Guilt," you invite the supervisor's critique and you confuse the moral emotions of your subjects.
  *   **Guilt** is backward-looking and agent-relative.
  *   **Responsibility/Liability** can be forward-looking and role-relative.

  **The Risk:**
  The risk of my position is that it feels "colder." It removes the moral sting for the current generation. They become bill-payers rather than penitents.
  **The Counter:**
  The moral sting is misplaced. Asking a 25-year-old immigrant to feel *guilt* for a massacre 100 years ago is moral narcissism; it centers *their* feelings rather than the *victims'* needs. What the victims need is not your shame; they need your money, your land, and your institutional reform. Those are liabilities, not sins.

  ### Summary for the Chapter
  1.  **Concede to the Supervisor:** On *moral culpability*. No living individual is *guilty* of ancestral crimes. To claim otherwise is metaphysically incoherent.
  2.  **Concede to the Reading Group:** On *state continuity*. The State is a moral agent that persists through time and can bear obligations.
  3.  **Synthesize:** The State bears **Liability**, which distributes to citizens as **Cost**, not **Guilt**.
  4.  **Resolve the Trilemma:** Drop the requirement that collective transgenerational responsibility be *retributive guilt*. Re-categorize it as *remedial justice*.

  This allows you to keep the Non-Identity constraint (you are fixing structures, not compensating existence), the Agency constraint (the State is the agent, citizens are members), and the Turnover case (obligations attach to the office/citizenship, not the bloodline).

  You break the wall by admitting the wall was named incorrectly. It isn't a wall of Guilt; it's a bridge of Obligation. Build that instead.
