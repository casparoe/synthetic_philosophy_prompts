          *   Result: It becomes *Political Responsibility*, not *Guilt*.
          *   Why not a dodge? Because "Guilt" implies *punishment is deserved*. "Responsibility" implies *repair is owed*. The moral work shifts from *suffering* to *fixing*. This solves the Non-Identity problem (you don't need to be harmed to be owed repair of structural injustice).
