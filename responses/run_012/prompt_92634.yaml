answer: |-
  # Desiderata for an Account of Free-Floating Rationales

  **Purpose:** To specify the conditions any adequate account must meet to support teleological evaluation in biology and philosophy without positing a hidden reasoner.

  ### I. Cases the Account Must Get Right

  1.  **Lineage-Executed Adaptation**
      *   *Case:* The eye-spots on a moth's wings.
      *   *Motivation:* No individual moth computes the benefit; the rationale exists only across generations via selection. The account must locate the rationale in the history of the lineage, not the cognition of the organism.
  2.  **Deceptive/Exploitative Signal**
      *   *Case:* An orchid mimicking a female wasp to induce pollination.
      *   *Motivation:* The "point" is to deceive, yet neither plant nor insect represents this goal. The account must allow for rationales that function through exploitation rather than cooperation or intent.
  3.  **Artifact with Fixed Design**
      *   *Case:* A thermostat or a lock.
      *   *Motivation:* The rationale is imposed by a designer but executed by a mindless mechanism. The account must distinguish the designer's reason from the artifact's operational rationale, allowing the latter to persist even when the designer is absent.
  4.  **By-Product (Spandrel)**
      *   *Case:* The human chin or the redness of blood.
      *   *Motivation:* These invite teleological description ("for protection," "for oxygen") but lack a selection history for that specific trait. The account must explain why these *lack* a rationale despite appearing functional.
  5.  **Physical/Formal Optimization**
      *   *Case:* A soap bubble minimizing surface area; a light ray minimizing time.
      *   *Motivation:* These systems optimize without selection history. This case tests whether rationale requires *history* (biology) or only *optimization structure* (physics).
  6.  **Pathological Malfunction (Added)**
      *   *Case:* A heart fibrillating instead of pumping.
      *   *Motivation:* Not covered above. This tests the normative capacity of the account. The system is failing its rationale, not merely causing death. An account that cannot distinguish "broken function" from "different function" fails to support evaluation as good or bad.

  ### II. Distinctions the Account Cannot Collapse

  1.  **Rationale Present vs. Rationale Grasped**
      *   *Consequence of Collapse:* If collapsed, free-floating rationales vanish. The account would require a mind to entertain the reason, reducing biology to psychology.
  2.  **Adaptation vs. By-Product**
      *   *Consequence of Collapse:* If collapsed, pan-adaptationism results. Every trait would have a rationale, making the concept useless for distinguishing design from noise.
  3.  **Bad Rationale vs. Absence of Rationale**
      *   *Consequence of Collapse:* If collapsed, error becomes impossible. A malfunctioning heart would simply be "doing something else," eliminating the normative force required for evaluation.
  4.  **Token Behavior vs. Mechanism Rationale**
      *   *Consequence of Collapse:* If collapsed, accidental success counts as rational design. A lucky guess would be indistinguishable from a computed strategy.
  5.  **Reason-For vs. Reason-Of**
      *   *Consequence of Collapse:* If collapsed, the account either assimilates these to ordinary mental reasons (requiring a subject) or reduces them to bare causation (losing normativity). The task is to maintain reasons without a subject.

  ### III. Results It Must Be Consistent With

  1.  **Blind Variation (Biology)**
      *   *Constraint:* Selection has no foresight. The account cannot imply that the rationale existed *before* the trait was selected.
  2.  **Bounded Rationality (Cognitive Science)**
      *   *Constraint:* Agents satisfice rather than optimize. The account must allow for rationales that are "good enough" rather than logically perfect.
  3.  **Non-Representational Optimization (Neural Science)**
      *   *Constraint:* Neural networks adjust weights to minimize error without representing the error function. The account must accommodate optimization without symbolic representation.

  ### IV. Negotiability and Tensions

  **Non-Negotiable Requirements:**
  *   **Normativity without Mind:** The account must allow for claims of "better/worse" or "correct/incorrect" without a judging agent.
  *   **Subjectlessness:** The rationale must not depend on a believer.

  **Camp-Specific Commitments:**
  *   **Etiological (Selection-History):** Commits to the view that only selected traits have rationales. (Rejects Physical Optimization as having a rationale).
  *   **Stance-Based (As-If):** Commits to the view that rationales are instrumental tools for prediction. (Rejects realism about the rationale).
  *   **Role Functionalism:** Commits to the view that current contribution defines the rationale. (Rejects the importance of history).

  **Flagged Tension (Potentially Unsatisfiable Subset):**
  *   **The Physical Optimization Case vs. The Selection History Requirement.**
      *   *The Conflict:* If we accept Case 5 (Soap Bubble) as having a rationale, we cannot require Selection History (Etiological view). If we require Selection History, we must deny Case 5 has a rationale, risking an arbitrary divide between physics and biology. Satisfying both the intuition that physics optimizes *and* the intuition that biology is special because of history may be impossible without equivocation on the word "rationale."

  ### V. The Exclusionary Requirement and Family Scoring

  **Single Most Exclusionary Requirement:**
  **Normative Evaluation of Malfunction without Representation.**
  This requirement demands that a system can be *wrong* (not just different) without anyone being there to judge it. This eliminates pure causal accounts (which only describe what *is*) and strict stance-based accounts (which make error dependent on the observer's utility).

  **Family Scoring:**
  *   **Etiological (Millikan):** Passes biology and malfunction; fails physical optimization (denies it has a rationale).
  *   **Stance-Based (Dennett):** Passes usability and physics; fails realism (rationales become fictional tools).
  *   **Role Functionalism (Cummins):** Passes physics and current utility; fails malfunction (cannot distinguish broken function from alternative function easily).
  *   **Causal Mechanism:** Fails normativity entirely (reduces "ought" to "is").
