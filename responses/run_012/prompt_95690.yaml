answer: |-
  Karma qualifies as moral desert only if it secures a non-accidental, proportional link between a morally responsible agent and their experience, rather than merely tracing causal consequences through a continuum of consciousness.

  | Requirement | Consideration Behind Requirement | Collapse Condition (Causal Law vs. Moral Desert) |
  | :--- | :--- | :--- |
  | **1. Moral Intentionality** | Desert requires a moral agent, not just a physical locus. | If accidental harms generate bad karma equal to intentional harms, the system is merely hydraulic causation, not justice. |
  | **2. Diachronic Identity** | The subject who suffers must be the same entity who acted. | If the "self" is a fiction (no-self) or discontinuous (rebirth), the suffering entity is a victim of another's debt, making it cosmic injustice, not desert. |
  | **3. Proportional Retribution** | The magnitude of suffering must match the moral weight of the act. | If a minor lie causes catastrophic suffering (or vice versa), the link is chaotic or punitive, not deserved; desert demands fittingness. |
  | **4. Normative Necessity** | The outcome must occur *because* it is just, not just *that* it occurs. | If karma operates like gravity (mechanically), it explains *how* but not *why* it is right; desert requires a normative reason, not just a mechanism. |
  | **5. Control / Alternative Possibilities** | The agent must have been able to do otherwise. | If past karma determines present character and choices, the agent could not have acted differently; you cannot deserve punishment for inevitabilities. |

  **The Single Knockout Requirement:** **Diachronic Identity.**
  This requirement eliminates the most versions of karma because it is the hardest to reconcile with the metaphysics usually accompanying karma theories. Folk karma assumes identity but fails empirically; Hindu karma posits an eternal *atman* but struggles to explain how an unchanging self accumulates changing moral debt; Buddhist karma posits *anatta* (no-self), which explicitly denies the persistent entity required to "own" the desert. Without a robust account of personal identity over time (especially across lives), karma devolves into one consciousness stream punishing a subsequent, distinct consciousness stream, which is structurally indistinguishable from collective punishment or random causality.

  **The Incompatible Pair:** **Diachronic Identity vs. Ontological Impermanence (No-Self).**
  Your suspicion is correct: this is the primary pinch point. To satisfy desert, you need a persistent "who" to hold responsible (Identity). To satisfy Buddhist metaphysics (and much modern philosophy of mind), you must accept that the self is a constructed, momentary phenomenon (Impermanence). You cannot jointly satisfy the requirement that "the same person pays" while maintaining that "there is no same person." Most Buddhist apologetics attempt to solve this with "causal continuity" (the flame passing to a new candle), but causal continuity is sufficient for *causation*, not *desert*; a child is causally continuous with a parent but does not deserve the parent's punishment.

  **The Missing Requirement Doing Heavy Lifting:** **Control (The Principle of Alternative Possibilities).**
  You noted "doing something vs. merely causing it," but the deeper missing thread is **deterministic freedom**. If karma is a universal law governing cause and effect, your current choices are the inevitable result of past karma. If your past karma determined your present character, and your character determined your act, you could not have done otherwise. Moral desert traditionally requires that you could have acted differently; if karma is a deterministic law of nature, it undermines the very agency required to make desert intelligible. This requirement does more work than Identity because even if you solve Identity (e.g., via an eternal soul), you still cannot have desert if the soul's actions are mechanically determined by prior cosmic states.
