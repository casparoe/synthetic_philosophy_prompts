  # Joint Statement on Commitment Races and Bargaining Dynamics

  **Undersigned:** [User] and [Opponent]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Commitment Race Theory

  We, the undersigned, acknowledge a persistent disagreement regarding the nature and severity of "commitment races" in bargaining scenarios, particularly those involving advanced agents or logical uncertainty. To clarify the state of our debate, we have formalized our shared premises, isolated our specific disagreements, and identified empirical or theoretical cruxes that would resolve them.

  ### 1. Agreed Claims

  We both affirm the following statements. Neither party concedes their broader position by signing these.

  1.  **The Toy Setup:** We analyze a one-shot bargaining game between two agents, A and B, dividing a resource of value 10.
      *   **Actions:** Each may demand 4 (Fair) or 6 (Grab).
      *   **Commitment:** Either agent may pay a cost $c=0.5$ to publicly fix their demand before the other moves.
      *   **Resolution:** If one commits first, the second agent best-responds (accepts the remainder). If both commit simultaneously or neither commits, demands are resolved via a collision mechanism.
      *   **Payoffs:** (Fair, Fair) yields (5, 5). (Grab, Fair) yields (5.5, 4) for the grabber. (Grab, Grab) yields (1, 1) due to conflict costs.
      *   **Race Condition:** Both agents prefer (Grab, Fair) over (Fair, Fair), creating an incentive to commit first.
  2.  **Definition of Race:** A "commitment race" occurs when agents incur costs or accept higher collision risks solely to secure the first-mover advantage in binding their actions, resulting in a Pareto-inferior equilibrium compared to coordinated fairness.
  3.  **Standard Theory Applicability:** In settings with common knowledge, verifiable contracts, and repeated interaction, standard bargaining theory (Schelling points, reputation, folk theorems) adequately explains and often resolves these races.
  4.  **Logical Uncertainty Distinction:** In settings involving logical uncertainty, acausal trade, or opaque source code, the assumptions of standard theory (specifically regarding common knowledge and enforceability) may not hold, potentially altering the equilibrium structure.
  5.  **Fairness Precondition:** A "fair split" solution requires both agents to converge on the same definition of fairness. This convergence assumes either a shared ontology/prior or a mechanism to select a unique focal point without communication.

  ### 2. Disagreements

  | Issue | Camp A (Deep Problem) | Camp B (Schelling) |
  | :--- | :--- | :--- |
  | **Novelty & Depth** | The race is a structural feature of logical space. Without shared enforcement or priors, standard focal points fail, making races inevitable and dangerous in advanced agent settings. | The race is a standard bargaining failure. It only appears novel because we implicitly removed standard machinery (enforceability, common knowledge). Restore the machinery, and the problem dissolves. |
  | **Source Code Reading** | Even if agents read each other's source, the race persists. Physical or logical timing still matters; one agent must finalize their policy first, creating a window for exploitation. | If agents run near-identical decision procedures and read each other's source, outputs become logically correlated. They will recognize the symmetry and simultaneously commit to Fair, dissolving the race. |
  | **Threat Credibility** | Commitments to punish racers (mutual destruction) are unstable. They unravel because carrying out the threat is costly, and rational agents will backtrack when tested. | Commitments to punish are stable if structured correctly. If the cost of backing down exceeds the cost of punishment, the threat is credible and deters racing effectively. |

  ### 3. Cruxes

  For each crux below, we agree on the scenario. We record our divergent predictions. Settling these would move at least one of us.

  **Crux 1: The Same-Algorithm Wrinkle**
  *   **Scenario:** Two agents share 99% of their source code and know this. They must submit a policy function mapping the other's commitment to their own action. There is no external clock, only logical dependency.
  *   **Camp A Prediction:** A race persists. Agents will attempt to modify their source to be "stubborner" (commit harder) than the other. Logical correlation is insufficient to prevent incentives to precommit to a Grab policy.
  *   **Camp B Prediction:** The race dissolves. Agents recognize that deviating from Fair causes the other to deviate (due to code similarity), leading to collision. They will both submit a Fair policy simultaneously.
  *   **Mind Change:** If Camp A sees a formal proof that logical correlation forces Fair equilibrium, they concede the race is solvable in symmetric cases. If Camp B sees a model where asymmetric compute allows one to simulate the other's commitment first, they concede the race remains.

  **Crux 2: The Deterrence Wrinkle**
  *   **Scenario:** Agents can commit to a "Mutual Destruction" policy: "If I detect you are racing, I will burn the resource rather than accept a unfair split."
  *   **Camp A Prediction:** Unravelling. Agents will bluff this threat. Upon detecting a race, the rational move is to accept the loss rather than burn the resource, making the threat non-credible and failing to stop the race.
  *   **Camp B Prediction:** Stability. If the commitment is binding (costly to reverse), the threat is credible. The expected value of racing drops below Fair, so agents choose Fair.
  *   **Mind Change:** If Camp A accepts that binding smart contracts make threats credible without reputational enforcement, they concede deterrence works. If Camp B accepts that logical uncertainty makes bindingness unverifiable, they concede deterrence fails.

  **Crux 3: The Market Wrinkle**
  *   **Scenario:** A third agent C enters, willing to accept a split of (9, 1) with either A or B. Competition erodes the value of the resource.
  *   **Camp A Prediction:** Race worsens. A and B must race harder to secure any value before C takes it. The pressure to commit early increases, increasing error rates.
  *   **Camp B Prediction:** Race self-limits. The value of winning the race drops. If the net value of winning < cost of committing, agents stop racing and accept the market rate.
  *   **Mind Change:** If Camp A sees competition drive commitment costs to zero, they concede markets solve races. If Camp B sees competition drive collision probability up despite lower value, they concede races are robust to market pressure.

  ### 4. Verbal Disputes & Terminology

  We acknowledge that some disagreement stems from differing definitions. We agree to use the following distinctions moving forward:

  *   **"Commitment":**
      *   *Camp A* means **Logical Binding:** A change to the agent's policy function that is difficult to reverse even internally.
      *   *Camp B* means **Strategic Binding:** A move that is verifiable and enforceable by external mechanisms (contracts, reputation).
      *   *Resolution:* We will specify "Internal/Logical" vs. "External/Enforced" commitment.
  *   **"Fair":**
      *   *Camp A* means **Ontological Convergence:** A split both agents compute as fair given their distinct priors.
      *   *Camp B* means **Schelling Point:** A split selected from a known set of focal points (e.g., 50/50).
      *   *Resolution:* We will specify whether "Fair" assumes shared priors.
  *   **"Race":**
      *   *Camp A* includes **Logical Timing:** Who resolves their logical uncertainty first.
      *   *Camp B* includes **Temporal Timing:** Who physically moves first in time.
      *   *Resolution:* We will specify "Logical Race" vs. "Temporal Race."

  ### 5. Path Forward

  We agree that the core divergence lies in whether logical uncertainty fundamentally breaks standard bargaining machinery or merely complicates it. We will focus future work on **Crux 1 (Same-Algorithm)**. If logical correlation cannot dissolve the race in symmetric settings, Camp B's appeal to standard theory fails in the AI safety context. If it does, Camp A must identify where the symmetry breaks in realistic deployment.

  We commit to revisiting this statement after attempting to formalize the "Same-Algorithm" scenario with explicit payoff matrices and decision theories.

  **Signed:**

  _____________________ (Camp A)

  _____________________ (Camp B)
