prompt: |-
  ok so I just spent like two hours arguing with my friend Maya (she's a cog-sci PhD student, builds computational models of analogy) about Bongard problems and I need someone to settle it for me. You know the setup: you get a grid of boxes, six on the left and six on the right, and you have to work out the rule that puts each box on the side it's on. The boxes are usually simple line drawings, and the rule can be anything from how many sides the shapes have, to something about their arrangement, to something you'd never guess. Once you've got the rule you can classify new boxes you haven't seen.

  Maya's claim is that solving a Bongard problem just is doing science in miniature -- same inference, different scale. You've got observations (the boxes), you form hypotheses (candidate rules), you test them against the data, you prefer the simplest rule that fits, and then you generalize to new cases. She uses this to argue that we basicly already understand scientific induction -- it's simplicity plus fit -- and that a system which can solve Bongard problems is doing what a scientist does, just with smaller inputs. She also showed me one she made herself where the rule turned out to be about how the boxes were drawn (dashed vs solid outlines) rather than about the shapes themselves, and she said that's fine, real science has that too, sometimes the pattern lives in your instrument and not in your object.

  I'm not convinced but I couldn't articulate why in the moment. Can you help me audit the analogy properly?

  Please take the role of a philosopher of science who also works on analogy and concept learning. Before you answer, brainstorm for yourself: list every candidate correspondence you can see between the two domains, including the obvious ones and the ones that only show up when you push on the puzzle cases. Then give me:

  1. the correspondence table -- what in a Bongard problem plays the role of data, hypothesis, prediction, background knowledge, the scientific community, and the phenomenon that exists whether or not anyone is looking at it;
  2. where the mapping breaks, which breaks actually matter for her conclusion versus which are just differences of scale or noise, and what the analogy quietly imports from the science side that the puzzle side doesn't have;
  3. whether her conclusion survives once the disanalogies are on the table, or whether the analogy was carrying the conclusion the whole time;
  4. if it doesn't survive, what the better analogy is -- I have a suspicion it's something more like working out what a person meant by something, but I don't want to lead you.

  Don't just recite the standard objections, actually commit to a verdict and tell me which of mine and Maya's intuitions have to go. Think it through carefully before you answer; this is definately the kind of thing where the first answer that comes to mind is the wrong one.
