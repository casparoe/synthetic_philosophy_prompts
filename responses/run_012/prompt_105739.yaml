answer: |-
  You are quite right to be suspicious. The phrase "It's not what you said, it's what you meant" is a piece of linguistic sleight of hand. It sounds profound, but it shifts its definition depending on who is using it and what they want to achieve. In philosophy of language, this is the battleground between *semantics* (the literal meaning of words) and *pragmatics* (what speakers do with those words in context).

  Here is the menu of claims hidden inside that slogan, ranked from the harmless to the hazardous, followed by an analysis of your three cases and the Gricean complications.

  ### The Menu of Claims

  **1. The Psychological Platitude**
  *   **The Claim:** Human beings often communicate things they do not explicitly state in words.
  *   **Verdict:** **Trivially True.**
  *   **Analysis:** If I say "It's cold in here," I likely mean "Close the window." No one denies that speakers have intentions beyond the literal string of words. This reading is harmless but useless for settling arguments, because no one claims speakers *never* have intentions.

  **2. The Ethical/Legal Priority**
  *   **The Claim:** Moral or legal responsibility attaches to the speaker's intention to deceive or harm, not merely to the literal truth-value of the sentence.
  *   **Verdict:** **Substantive and Defensible (in context).**
  *   **Analysis:** In law and ethics, *mens rea* (guilty mind) matters. If you technically tell the truth but structure it to ensure I draw a false conclusion, you are still morally culpable. This reading asserts that "meaning" in a moral sense includes the intended uptake, not just the dictionary definition.

  **3. The Semantic Eliminator**
  *   **The Claim:** Literal meaning is irrelevant; the only thing that determines the content of an utterance is the speaker's private intention.
  *   **Verdict:** **False.**
  *   **Analysis:** This is the wild reading. If this were true, language would be impossible. Communication relies on shared conventions. If I say "I am a bachelor," I cannot later claim, "Ah, but I *meant* I am married," and expect to be understood. Words have stable meanings that constrain what we can successfully mean. This reading treats language as telepathy.

  **4. The Interpretive Heuristic**
  *   **The Claim:** When an utterance is ambiguous, we should prioritise the most likely intended meaning over the most pedantic literal reading.
  *   **Verdict:** **Defensible.**
  *   **Analysis:** This is a rule of thumb for conversation. If someone says "I've had breakfast," and it's 2 pm, we assume they mean "today," not "at some point in my life." We prioritise the sensible intention over the technically-true-but-unhelpful literalism.

  ***

  ### The Three Cases: Which Reading is Doing the Work?

  You suspected the slogan gets its punch from one specific reading while the rest is padding. You are correct. Here is how the slogan is functioning in your three scenarios.

  **1. The Advert (Literally true, intended to deceive)**
  *   **Reading in play:** **The Ethical/Legal Priority.**
  *   **Why:** Your mate is not arguing about linguistics; he is arguing about consumer protection. He is claiming that the *effect* of the advert (the deception) outweighs the *technicality* (the literal truth). Here, the slogan is a demand for accountability. It is substantive. It correctly identifies that an advert can be a lie without containing a false sentence.

  **2. The Reading Group (The nasty slur/connotation)**
  *   **Reading in play:** **The Semantic Eliminator.**
  *   **Why:** This is the dangerous use. The speaker is trying to wash away the offensive connotation of a word by relegating it to "just what was meant." They are arguing that the word itself is innocent, and only the speaker's specific intention made it nasty.
  *   **The Problem:** This is false. Words carry historical and social weight (semantic content) that exists independently of the current speaker's intention. You cannot use a loaded term and claim "I didn't mean it that way" if the term itself encodes that meaning. Here, the slogan is being used to evade responsibility for the words chosen.

  **3. The Witness (True but misleading testimony)**
  *   **Reading in play:** **The Ethical/Legal Priority (with a twist).**
  *   **Why:** In law, perjury is usually strictly about literal falsehoods. However, the argument here is about the *spirit* of the oath ("the truth, the whole truth"). The slogan is being used to argue that misleading implicatures count as lies.
  *   **The Tension:** Legally, this is often a losing argument (literal truth usually wins in perjury courts). Morally, it holds. The slogan is doing heavy lifting here to expand the definition of "lying" to include "misleading."

  ***

  ### The Trap: Where it Misleads

  You asked for the reading that is trivially true but useless, versus the one that is useful but false.

  *   **Trivially True but Useless:** The **Psychological Platitude**. If someone says to you, "You hurt me," and you reply, "It's not what I said, it's what I meant," you are technically stating a fact (you had an intention), but it is useless because communication is about *uptake*, not just transmission. If the listener didn't get your meaning, your intention is irrelevant to the breakdown.
  *   **Useful but False:** The **Semantic Eliminator**. This is useful for winning arguments (like in the reading group) because it allows you to detach words from their consequences. It is false because it ignores that language is a public tool, not a private mind-reading game. If we accepted this, contracts, laws, and instructions would be unenforceable, as anyone could claim their private intention overrides the public text.

  ***

  ### Grice and the Razor

  You mentioned Grice and the principle of not multiplying senses (often called "Grice's Razor"). Here is how they fit together, and where they conflict.

  **Grice's Distinction**
  Paul Grice distinguished between *what is said* (the literal proposition) and *what is implicated* (the pragmatic inference).
  *   *Example:* "Some of the students passed."
  *   *Said:* At least one, possibly all, passed.
  *   *Implicated:* Not all of them passed.

  Grice argued we should keep these separate. The slogan "It's not what you said, it's what you meant" tends to **collapse** this distinction. It treats the *implicature* (what was meant) as if it were the *said* content for the purpose of judgment.

  **The Conflict with the Razor**
  Grice's Razor says: *Do not argue that a word has two different meanings (ambiguity) if you can explain the difference by one meaning plus pragmatic inference.*
  *   *Application:* If "bank" means river-side and financial institution, that's ambiguity. But if "It's cold" means "Close the window," that's not ambiguity; that's pragmatics.

  The slogan conflicts with the Razor when it is used in the **Reading Group** case.
  *   **The Razor says:** The word has a nasty meaning (semantics), and the speaker intended to use it (pragmatics). Don't pretend the word is innocent.
  *   **The Slogan says:** The word is innocent; the nastiness is just "what they meant."

  In this specific instance, the slogan is actually violating Grice's advice. It is trying to take what is arguably part of the word's conventional meaning (the slur's offensiveness) and pretend it is merely a cancellable implicature. Grice would say: if the offensiveness cannot be cancelled (i.e., you can't say "I used this slur but I didn't mean to offend"), then it is part of *what is said*, not just *what is meant*.

  **Do they talk past each other?**
  Yes, partly.
  *   **Grice** is describing *how communication works*. He wants to preserve the stability of word meanings so we can explain how we understand each other.
  *   **The Slogan** is usually prescribing *how we should judge people*. It wants to prioritise intention over convention for moral or legal reasons.

  They talk past each other because one is a mechanism of language, and the other is a tool of accountability. The confusion arises when people use the mechanism (pragmatics) to justify the accountability (ethics) in inconsistent ways—demanding intention matter in the advert case, but demanding it *not* matter (by calling it "just meaning") in the slur case.

  ### Summary

  The slogan is a chameleon.
  1.  In the **Advert**, it is a **moral demand**: do not hide behind literalism to deceive. (Defensible).
  2.  In the **Reading Group**, it is a **semantic dodge**: do not hold me responsible for the conventional weight of my words. (False).
  3.  In the **Court**, it is a **legal stretch**: should misleading truth count as lying? (Debatable, but usually legally false).

  To untangle it in future, ask the speaker: "Are you saying words have no stable meaning, or are you saying I should be judged on my intentions?" If they say the former, they are wrong. If they say the latter, ask them why they didn't say that in the first place.
