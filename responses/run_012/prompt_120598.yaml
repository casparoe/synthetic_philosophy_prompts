  3.  **Drafting the Implicit Theory (The "Conception"):**

      *   *Discovered vs. Stipulated:* It's a hybrid. The *signal* (plutonium, fossil change) is discovered in nature (Realist element). The *selection* of the specific spot and the *ratification* are stipulated by committee (Conventionalist element). It's a "stipulated anchor for a discovered continuity."
      *   *Instant vs. Process:* The boundary is treated as an *instant* (the "single point," the "horizon"). Even if the change is gradual, the *definition* is punctual.
