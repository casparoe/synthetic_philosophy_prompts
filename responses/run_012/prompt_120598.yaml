answer: |-
  Based on the text provided, the practice of fixing geological time boundaries presupposes a specific, hybrid philosophy of historical time. Below is a reconstruction of that implicit theory, an analysis of its commitments, and an examination of the inconsistencies and alternatives raised by the Anthropocene debate.

  ### 1. The Implicit Theory of Historical Periods

  **Discovered Features vs. Stipulated Instruments**
  The practice presupposes a **critical realist** conception. Periods are treated as discovered features of the world insofar as they must correspond to a physical signal in the rock record (a "physical marker," "plutonium rise") that exists independently of human observation. However, the *boundary* itself is a stipulated instrument. Nature provides the gradient or the spike, but the Commission provides the "single point" that legally fixes the base. Time is continuous in nature but discrete in the scale; the practice stipulates a cut where nature offers a slope.

  **Instant vs. Process**
  The theory treats a period's boundary as an **instant**. The text specifies that a "single point... defines the base," and units are defined "from below." Even if the environmental change (like nuclear fallout or species extinction) occurs over decades, the geological definition collapses this duration into a horizon. The boundary is a knife-edge, not a zone.

  **Single True Answer**
  The practice assumes there is **a single true answer** to when a period began, but only *after* ratification. Before the vote, multiple "rival starting dates" are possible. Once a Global Boundary Stratotype Section and Point (GSSP) is ratified, that specific location and level become the definitive standard. All other records are "subsequently correlated to it." Truth is established by consensus anchored to a specific physical locus.

  **Authority and Grounds**
  Authority resides in the **International Commission on Stratigraphy (ICS)** and its subcommissions. The grounds for authority are twofold:
  1.  **Epistemic:** The candidate section must be "continuously deposited, undisturbed," and contain a signal "recognised globally."
  2.  **Procedural/Political:** The site must be "accessible" and "open to researchers of any nationality."
  The funding detail (legislature via cultural institute) hints that while the *validation* is scientific, the *initiative* often relies on socio-political will. Authority is thus technocratic, relying on international scientific consensus to validate physical evidence.

  ### 2. Sorting the Commitments

  **Strictly Required (Constitutive)**
  *   **Global Correlatability:** The marker must be recognizable worldwide (isochronous). Without this, the time scale fragments into local histories.
  *   **Physical Anchoring (for recent time):** A boundary cannot be purely conceptual; it requires a "physical marker" in rock or ice.
  *   **Hierarchical Ratification:** A proposal is not valid until confirmed by the commission and union. The definition is top-down administrative approval of bottom-up empirical data.

  **Comfortable Fit (Ideal but Flexible)**
  *   **Continuous Deposition:** Ideally, the rock record is unbroken. However, the deep-time exception shows this can be waived if necessary.
  *   **Accessibility:** The ideal of open access for all nationalities is a normative commitment of international science, though logistical realities often complicate it.

  **Conveniences of the Moment (Pragmatic Compromises)**
  *   **The 630 Million Year Cutoff:** Switching to "agreed numbers" for deep time is a pragmatic admission that rock markers are unavailable. It is a convenience to maintain the scale's continuity when the primary method fails.
  *   **The Specific Marker:** Choosing plutonium over agriculture or industrial CO2 was a choice of signal clarity over causal significance. It was a convenience of measurability.

  ### 3. Rival Accounts of Periodisation

  **Ruled Out**
  *   **Diachronous Onsets:** The practice rules out the idea that a period's onset may be "spread over millennia" or vary by location. The GSSP method demands a synchronous global line.
  *   **Human Significance as Primary:** The rejection of the Anthropocene on grounds of "too shallow" and "too recent" rules out the notion that human cultural impact alone justifies a time unit. Geological durability trumps sociological significance.
  *   **Middle-Defined Units:** The rule that units are defined "from below, never from the middle" rejects any theory where periods are centered around a peak event rather than initiated by a starting trigger.

  **Left Open (Realist and Conventionalist Compatibility)**
  *   **Realist Endorsement:** A realist can endorse this because it requires a physical signal in the world (plutonium, fossils) that exists independently of the geologists.
  *   **Conventionalist Endorsement:** A conventionalist can endorse this because the *selection* of the specific point is arbitrary (one lake in Ontario vs. another) and depends on human agreement (the vote).
  *   **The Bridge:** The system works for both because it treats the *signal* as real but the *boundary line* as a convention drawn through that signal.

  ### 4. Addressing Apparent Inconsistencies

  **Inconsistency 1: Spikes vs. Agreed Numbers**
  *Is it coherent to use physical spikes for recent boundaries and numbers for deep ones?*
  Yes, on the grounds of **instrumental coherence**. The goal of the time scale is correlation, not ontological purity. For recent time, rock allows for high-precision physical correlation (the spike). For deep time, rock is metamorphosed or lost; numbers are the only remaining tool to maintain a continuous scale. The underlying principle is "maximize empirical anchoring where possible; revert to abstraction where necessary." It is a hierarchy of evidence, not a contradiction of method.

  **Inconsistency 2: The Existence of the Anthropocene**
  *Did the Anthropocene exist before 2024 and does it exist after?*
  On the practice's own terms, there is a distinction between the **phenomenon** and the **unit**.
  *   **Before 2024:** The *phenomenon* (human impact/plutonium spike) existed, but the *formal unit* did not.
  *   **After 2024:** The *formal unit* still does not exist (rejection confirmed), but the *term* remains a "valuable descriptor."
  The practice resolves this by separating **Stratigraphy** (the formal system of rock units) from **Chronology/Description** (the conceptual framing of earth history). The rejection denies the Anthropocene status as a *box on the chart*, not as a *reality on the ground*.

  ### 5. The Alternative: Event vs. Time Unit

  If the Anthropocene were adopted as a **geological event** (like the Great Oxidation Event) rather than a time unit:

  **Procedural Changes**
  1.  **Abandonment of the GSSP:** The requirement for a "single point" and a "base" would be discarded. An event is an interval or a process, not a line.
  2.  **Diachrony Accepted:** The definition would allow for the signal to appear at different times in different places (e.g., industrialization hits Britain in 1750, China in 1950).
  3.  **Criteria Shift:** The criteria would shift from "undisturbed sediment" to "Earth System signals" (e.g., carbon cycle disruption, biodiversity loss) which may not be preserved in a single rock section.

  **Who Would Be Deciding?**
  Authority would shift from the **International Commission on Stratigraphy** (guardians of the rock record and time units) to a broader body of **Earth System Scientists**. Stratigraphers manage the *calendar*; Earth System scientists manage the *diagnosis*. The decision would no longer be about "where do we draw the line" but "does this process constitute a fundamental state change for the planet?" This moves the authority from the keepers of geological time to the analysts of planetary function.
