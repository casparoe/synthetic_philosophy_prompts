      Your case of the borrowed reason is precisely where the distinction must hold firm even when our moral intuitions waver. On my view, this was indeed a form of manipulation, not because you acted villainously—you didn't—but because the mechanism of her change bypassed her critical co-authorship of the reasons themselves. She did not quit because she weighed the health risks or the costs; she quit to align her will with your image, which is a causal bypass of rational assessment, regardless of how beneficial the outcome. We must separate the categorical question of what kind of influence occurred from the moral question of whether it was permissible; here, the influence was manipulative because she adopted the conclusion without authoring the premise, yet I concede it may be a benign, even praiseworthy instance of manipulation. The fuzziness enters only if she has since internalized those reasons through reflection, transforming borrowed premises into authored convictions, but until that work is done, she is acting on a script she admires rather than a truth she has co-authored.

