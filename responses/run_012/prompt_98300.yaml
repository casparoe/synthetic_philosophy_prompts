answer: |-
  It is a pleasure to correspond with someone who approaches political taxonomy with the rigour of a natural scientist. Your intuition is sound: you have identified a discrepancy between *operational utility* (the label predicts) and *ontological substance* (the label denotes no single shared thing).

  In your former field, you would have recognised this immediately. In biology and taxonomy, the term you are looking for is a **Polythetic Class**.

  ### 1. The Established Name: Polythetic Class

  In taxonomy (specifically numerical taxonomy, developed by Sokal and Sneath in the 1960s), a **Monothetic Class** is defined by a set of necessary and sufficient conditions. To be a "mammal", one must possess *all* the defining traits (hair, mammary glands, three middle ear bones, etc.). If you lack one, you are out.

  A **Polythetic Class**, by contrast, is defined by a cluster of properties where:
  1.  Members possess a large number of these properties.
  2.  No single property is possessed by *all* members.
  3.  The class is recognised by statistical clustering, not by a checklist.

  This fits your observation perfectly. "Left" and "Right" are polythetic groupings. A person on the Left might support trade unions, favour immigration, and distrust the military. Another might support trade unions, oppose immigration, and trust the military. They share enough traits to cluster statistically (hence the predictive power), but there is no single "essential" trait they both hold.

  In philosophy, this is often discussed under the umbrella of **Cluster Concepts** (closely related to Wittgenstein's 'family resemblance'), but 'Polythetic Class' is the more precise scientific term for a grouping that is real statistically but empty essentially.

  ### 2. Ontological Status: Social Kinds

  You ask whether such a grouping is "real". In the philosophy of social science (notably in the work of Ian Hacking and John Searle), this is classified as a **Social Kind**.

  Unlike a Natural Kind (e.g., 'gold' or 'nematode'), which exists independently of human classification, a Social Kind exists *because* we classify it. However, do not mistake "socially constructed" for "unreal". Money, borders, and marriage are social kinds; they have causal power in the world. The political label has predictive power because people *act* as though the category is real. They vote, organise, and signal based on the label. This creates a feedback loop: the label predicts behaviour because the behaviour is performed to satisfy the label.

  So, to answer your question: it is real as a **statistical structure** and real as a **social fact**, but it is not real as a **natural kind** with an intrinsic essence.

  ### 3. Distinctions from Related Concepts

  You asked how this differs from 'family resemblance' or 'essentially contested concepts'. The distinctions are subtle but important for carving the joints correctly.

  *   **Vs. Family Resemblance:** Wittgenstein's 'family resemblance' is primarily a thesis about *language and meaning*. It explains how we can use the word "game" without a strict definition. Your observation is about *empirical clustering of people*. Family resemblance explains why the *word* works; Polythetic Class explains why the *population* groups.
  *   **Vs. Essentially Contested Concepts:** Proposed by W.B. Gallie, this refers to concepts where disagreement is inherent to the concept itself (e.g., "justice" or "democracy"). Everyone agrees the word is good, but disagrees on the application. Political labels are contested, but your point is different: you are noting that the *coalition* lacks a core, not just that the *definition* is disputed. A group can be unified (statistically) without agreeing on a definition.

  ### 4. The "Shared Opponent" Question

  You suspect the coalition would fall apart if the "other lot" vanished. In political science, this is known as **Negative Partisanship**.

  Is this the same phenomenon as the Polythetic Class? No, it is the **binding mechanism**.

  Think of it this way: The Polythetic Class describes the *structure* of the group (a bundle of correlated traits). Negative Partisanship describes the *force* holding that structure together. In biology, you might have a polythetic class of organisms held together by a specific environmental niche. In politics, the "niche" is often adversarial.

  There is a darker, more fundamental theory here from the German jurist Carl Schmitt, who argued that the specific distinction of "the political" is the distinction between **Friend and Enemy**. If Schmitt is correct, then the "shared opponent" is not just glue; it is the *constitutive* feature. The group does not exist *then* collapse without the enemy; it literally *is* the opposition to the enemy.

  However, for your purposes, it is safer to treat them as distinct:
  1.  **Polythetic Structure:** The statistical correlation of views.
  2.  **Negative Partisanship:** The psychological/social drive that maintains that correlation.

  ### 5. Proposed Name and Edges

  If you require a single term to pin this down specifically in the political context, I propose: **Adversarial Polythetic Kind**.

  This captures the statistical nature (Polythetic), the social reality (Kind), and the binding agent (Adversarial).

  **What would have to be true for this grouping to count as "not real"?**
  For a Polythetic Kind to dissolve, the **statistical correlations must decay to chance**.
  If you know someone is "Left", and you can no longer guess their view on immigration, experts, or fishing quotas better than a coin toss, the kind has ceased to exist. It becomes a "Nominal Kind" only (a name with no referent).

  Currently, the kind is "real" because the correlations are strong. However, if the *only* thing holding the correlations together is the presence of the Opponent (Negative Partisanship), then the Kind is **contingently real**. It is stable only so long as the adversary remains salient.

  **Is "held together only by a shared opponent" the same phenomenon?**
  It is a **subset** or a **specific variant**.
  *   **Scenario A:** A group clusters because they share a positive vision (e.g., a religious movement). This is a Polythetic Kind held by *affinity*.
  *   **Scenario B:** A group clusters because they share a dislike of the other side. This is a Polythetic Kind held by *aversion*.
  Both are Polythetic Kinds. Scenario B is simply less stable if the adversary vanishes, whereas Scenario A might persist.

  ### Summary

  Your biologist instincts have served you well. You have identified a **Polythetic Class** functioning as a **Social Kind**.
  *   **It is real** insofar as it possesses predictive validity (statistical structure).
  *   **It is empty** insofar as it lacks necessary and sufficient conditions (no essence).
  *   **It is maintained** often by **Negative Partisanship** (the shared opponent).

  The word you were searching for is likely **Polythetic**, but the full picture requires acknowledging that in politics, these classes are **Reified** (made real) by the very act of measuring and fighting over them. The dial you are looking for does not exist inside the people; it exists in the space *between* the groups.

  I hope this provides the taxonomic clarity you were seeking. It is a far messier specimen than a nematode, but the method of observation remains the same.
