          2.  Address anticipated pressures (circularity of irrelevance, universal perturbability, robustness vs. correctness, entrenchment).
          3.  Address the "less sure" point: Causal history discrediting attitudes without irrelevant factors (unreliability vs. manipulability).
          4.  Assess predictive power/riskiness (is it post-hoc?).
