          *   **The Stability ≠ Truth Problem:** A deeply ingrained prejudice (e.g., racism) might be robust against framing/mood. A fragile moral insight (e.g., recognizing a new form of suffering) might be easily shaken. The test confuses *entrenchment* with *justification*.
          *   **The Collapse into Idealization:** If "surviving all manipulations" means "surviving all *relevant* manipulations under *ideal* conditions," you've just described Ideal Observer Theory or Coherentism, not an empirical control test.

      *   *Damage Level 2: Serious Qualification (Modify)*
