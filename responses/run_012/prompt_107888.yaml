answer: |-
  This is a compelling operationalization of a metaethical distinction. You have essentially proposed a **Naturalized Invariance Theory** of moral judgment. By translating the philosophical problem of bias into the experimental problem of signal-to-noise ratio, you offer a method that feels rigorous and scientifically respectable.

  However, as you know from your time in the lab, the elegance of a control scheme often hides confounds in the setup. Below, I have sorted the defeaters by the damage they inflict, distinguishing between what a charitable defender of your view might concede (requiring qualification) and what a critic would press (requiring abandonment).

  ### I. Fatal Defeaters (Grounds for Abandonment)

  These are problems that strike at the logical coherence or the primary utility of the view. If these hold, the view cannot do the work you ask of it.

  **1. The Epistemic Circularity of "Irrelevance"**
  *   **The Critic's Press:** To run your control, you must pre-identify which factors are "irrelevant to whether the action is right or wrong." But determining which factors are morally irrelevant *is* the substantive moral work you are trying to outsource to the experiment. If you must know the moral truth to design the control, the control cannot discover the moral truth.
  *   **The Defender's Concession:** A defender must concede that the list of "irrelevant factors" (mood, framing, language) cannot be derived from the experiment itself. It must be imported from a prior, provisional moral consensus.
  *   **The Damage:** This collapses your empirical distinction into a **coherentist check**. You aren't finding moral truth; you are checking consistency against a pre-existing (and potentially flawed) map of moral irrelevancies. If the consensus says "proximity is irrelevant," but moral truth says "proximity matters," your test identifies a true sensitivity as a bias (False Positive). This undermines the claim that the distinction is *empirical* rather than *conventional*.

  **2. The Robustness of Error (False Negatives)**
  *   **The Critic's Press:** You assume bias is "noise" that destabilizes the signal. But psychological biases can be structurally robust. Deep-seated prejudices (e.g., caste systems, racism) are often culturally reinforced to be immune to framing, mood, or linguistic description. Conversely, nascent moral insights (e.g., the wrongness of a newly understood form of exploitation) may be fragile and easily shaken by cognitive load or framing.
  *   **The Defender's Concession:** A defender must admit that *stability* is not a perfect proxy for *correctness*.
  *   **The Damage:** If a vile attitude survives all your controls, your view forces you to classify it as a "candidate for preference." If a fragile moral insight fails the controls, you classify it as "bias." This inverts the normative goal. It makes the test a measure of **dogmatism** rather than truth. If the test cannot distinguish between a robust truth and a robust delusion, it fails as a tool for moral epistemology.

  **3. The Genealogical Gap (Unreliability vs. Manipulability)**
  *   **The Critic's Press:** You ask whether causal history can discredit an attitude even when no irrelevant factor is currently at work. The answer is yes. Consider a belief instilled by hypnosis or brainwashing that results in a perfectly stable, internally coherent, and manipulation-proof attitude. It passes your control test (it is invariant), but its causal history discredits it.
  *   **The Defender's Concession:** A defender might argue that a properly designed experiment *includes* historical controls (e.g., comparing subjects with different upbringing).
  *   **The Damage:** This admits that *current* invariance is insufficient. You need a theory of **reliable formation**, not just **stable maintenance**. This shifts the view from your proposed "Control Theory" to a **Process Reliabilism**. If the history matters more than the current stability, your apparatus analogy breaks down; in physiology, a stable signal is usually a real signal, regardless of how the sensor got there. In morality, the "how" is constitutive of the bias.

  ### II. Qualifying Defeaters (Grounds for Modification)

  These problems do not destroy the view but force you to retreat from strong claims to weaker, heuristic ones.

  **1. The Threshold Problem (Universal Perturbability)**
  *   **The Anticipated Pressure:** You noted that framing and mood perturb *every* judgment.
  *   **Assessment:** If the criterion is binary (sensitive = bias, insensitive = preference), and everything is sensitive, everything is bias.
  *   **Required Qualification:** The defender must move to a **gradient model**. Bias is not the *presence* of sensitivity, but sensitivity *above a threshold* relative to a baseline. But who sets the threshold? This reintroduces convention. The view survives only if it claims to measure *degrees* of bias, not the *presence* of it.

  **2. The Entrenchment Confound**
  *   **The Anticipated Pressure:** You are measuring entrenchment rather than correctness.
  *   **Assessment:** This is partially true, but not fatal if re-framed. In science, a signal that disappears when you wiggle the wire is an artifact. A signal that stays is real *relative to the apparatus*.
  *   **Required Qualification:** You must concede that your test identifies **intersubjective stability**, not **moral truth**. It tells you which preferences are shared and robust across variations in human psychology, not which are "right." This saves the methodology but abandons the claim that it solves the "quarrel over moral preferences." It merely maps the landscape of the quarrel.

  **3. Predictive Risk and Falsifiability**
  *   **Your Question:** Does the view risk anything?
  *   **The Risk:** The view is falsifiable if it makes specific predictions about which factors *should* move which attitudes.
      *   *Prediction:* If an attitude is a genuine moral preference, it should remain invariant under cognitive load (e.g., time pressure) if that load is deemed "irrelevant."
      *   *Embarrassing Result:* If we find that core moral principles (e.g., "do not torture") shift significantly under time pressure or linguistic framing in a way that correlates with *better* reasoning (e.g., slowing down makes people *more* punitive, not less), your model struggles. If "bias" is defined as sensitivity to irrelevant factors, but sensitivity to some "irrelevant" factor (like time) actually improves moral accuracy, the definition breaks.
      *   *Post-Hoc Risk:* If every time an attitude shifts, you simply declare the factor "relevant," the theory is unfalsifiable. To avoid this, you must **pre-register** the list of irrelevant factors (mood, language, order) independent of the moral outcome.

  ### III. The "Less Sure" Point: Unreliability and Manipulability

  You asked whether unreliability and manipulability come apart, and which is doing the work.

  **They come apart.**
  *   **Manipulability without Unreliability:** A moral judgment might shift with mood, but the mood might track a relevant moral feature (e.g., disgust tracking contamination risks). Here, the attitude is manipulable, but not biased. Your test would falsely flag it as bias.
  *   **Unreliability without Manipulability:** As noted above, a brainwashed belief is stable (not manipulable by your controls) but unreliable.

  **Which is doing the work?**
  In your physiological analogy, **manipulability** is the proxy you use to detect **unreliability**. You assume that if a signal moves when the wire is wiggled, the signal wasn't coming from the organism.
  *   *The Problem:* In morality, the "organism" (the moral agent) is *constituted* by the wires. Mood, framing, and relationships are part of the moral agent's substrate, not just the apparatus.
  *   *The Verdict:* **Unreliability** is the real work. Manipulability is just the heuristic. If you prioritize manipulability, you risk discarding moral truths that are context-sensitive. If you prioritize unreliability, you need a theory of reliability that goes beyond your experimental controls.

  ### IV. Collapse into Rivals

  **1. Does it collapse into the Idealization Picture?**
  *   **Yes, largely.** Your view states: "If the attitude survives all such manipulation... it is a candidate for a preference."
  *   "Surviving all manipulation" is functionally equivalent to "What would be judged under ideal conditions." You have naturalized the **Ideal Observer Theory**. Instead of asking "What would a fully informed, disinterested observer feel?", you ask "What does this observer feel when we strip away specific causal influences?"
  *   *Difference:* The traditional Ideal Observer is a metaphysical construct. Yours is an empirical procedure. But if the empirical procedure requires knowing which influences are "disinterested" (irrelevant) beforehand, you have simply operationalized the metaphysical construct without solving the epistemic access problem.

  **2. Does it collapse into Substantive Moral Realism?**
  *   **Yes.** Your definition of bias relies on factors having "no bearing on whether the action... is right or wrong."
  *   This presupposes that there *is* a fact of the matter about what is right or wrong, independent of the attitude. If moral anti-realism is true, there are no "irrelevant factors" because there are no "relevant factors" either; there are only causes.
  *   *The Cost:* You cannot use this view to *argue* for realism. You must *assume* realism to run the test. This limits your audience to those who already agree that moral truth exists and excludes certain causal histories.

  ### V. Summary Assessment

  **What a Defender Must Concede:**
  1.  The list of "irrelevant factors" is provisional and based on consensus, not discovered by the test.
  2.  Stability indicates **robustness**, not necessarily **truth**.
  3.  The test measures **current causal independence**, not **historical reliability**.
  4.  The view presupposes moral realism.

  **What Only a Critic Would Press:**
  1.  That the view is a category error: moral justification is normative, not causal. (You likely reject this, given your premise).
  2.  That the view is secretly conservative: it validates whatever moral intuitions are currently most entrenched in the population running the controls.

  **Final Verdict:**
  Your view is a powerful **methodological heuristic** for moral psychology, but it is not a **metaethical solution**. It successfully identifies *psychological biases* (instabilities in judgment), but it cannot distinguish them from *moral biases* (errors in moral reasoning) without importing external moral premises.

  To save it from being merely a device for classifying attitudes post-facto, you must **pre-commit** to a specific list of irrelevant variables (e.g., "We stipulate that digestive states are morally irrelevant") and treat the survival of an attitude under those specific controls as a **necessary but not sufficient** condition for moral preference. If you claim it is sufficient, the robustness of prejudice will break your system. If you claim it is necessary, the fragility of insight will break your system.

  The most honest refinement of your view is this: **An attitude is definitely a bias if it is manipulable by stipulated-irrelevant factors; an attitude is not definitely a preference if it is stable.** You have built a excellent bias-detector, but not a truth-detector. In physiology, knowing a signal is *not* an artifact doesn't prove it's the signal you're looking for—it just means it's *a* signal from the organism. It could be noise from a different system. Your moral controls tell you the judgment comes from the agent, not the apparatus. They do not tell you if the agent is right.
