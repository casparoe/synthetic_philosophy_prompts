      *   *Assumption:* We can identify "irrelevant variables" independently of the moral truth of $X$.
      *   *Assumption:* Stability = Truth-tracking (or at least non-biased).
      *   *Assumption:* Moral truth exists and excludes certain causal factors.

  3.  **Brainstorming Defeaters (Categorization & Sorting):**

