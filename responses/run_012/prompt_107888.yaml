      *   **The View:** Moral Bias vs. Moral Preference distinction is empirical. An attitude is a *bias* if it is causally sensitive to factors irrelevant to moral truth (like framing, mood, in-group status). It is a *preference* (candidate for moral truth) if it survives such manipulations (controls).
      *   **The Task:** Critique this view. Specifically:
