answer: |-
  ### Analysis of the Pattern

  You have described a specific configuration of social control that is distinct from historical analogues because it decouples the **source of the norm**, the **agent of enforcement**, and the **community of membership**. While the vernacular term "cancelling" identifies the phenomenon, it lacks analytical precision. The structural pattern you have isolated does not have a single, established academic term that covers all five features simultaneously. It is a digital-age mutation of ancient practices.

  #### Evaluation of Near-Neighbors

  1.  **Ostracism:** This is the closest structural ancestor. Like your pattern, it results in exclusion from a community.
      *   *Divergence:* Historical ostracism (e.g., Athenian) required a formal vote (violating Feature 2: No Agent) and was performed by a defined polity against a member (violating Feature 5: Strangers). It was also temporary (10 years), whereas your pattern is indefinite (violating Feature 4).
  2.  **Excommunication:** This captures the moral weight and the withdrawal of association.
      *   *Divergence:* Excommunication requires a hierarchical authority to declare it (violating Feature 2) and relies on codified dogma (violating Feature 1). It also typically allows for a clear path to absolution (violating Feature 4).
  3.  **Vigilantism:** This captures the extra-legal enforcement by private actors.
      *   *Divergence:* Vigilantism typically inflicts positive harm (physical punishment, property damage) rather than the withdrawal of association (violating Feature 3). It also usually claims to enforce a known code of justice, whereas your pattern relies on implicit norms (violating Feature 1).
  4.  **Stigmatization:** This captures the lasting mark on reputation.
      *   *Divergence:* Stigma is a *state* of being marked, not necessarily the *active process* of exclusion by strangers (violating Feature 3 and 5). One can be stigmatized yet remain employed and housed; your pattern describes the active severing of those ties.
  5.  **Informal Social Sanction:** This is the broad sociological category.
      *   *Divergence:* It is too broad. It covers gossip or a cold shoulder within a village. It does not inherently imply the scale, the stranger-enforcement, or the permanent digital record that defines your pattern.

  #### The Missing Concept: Distributed Excommunication

  Because no existing term captures the combination of **decentralized enforcement**, **implicit norms**, and **permanent revivability**, a new term is required to carve this concept precisely. The most accurate designation is **Distributed Excommunication**.

  *   **Distributed:** Refers to Feature 2 and 5. There is no central authority; enforcement is emergent across a network of strangers.
  *   **Excommunication:** Refers to Feature 3 and 4. It is not merely criticism (shaming) but the withdrawal of the means of social participation (platforms, employment, association), coupled with a ritualistic barrier to re-entry (contrition).

  #### Rulings on Specific Questions

  **1. Is the absence of procedure essential?**
  Yes. The absence of a procedure (Feature 2) is essential to the phenomenon. If a procedure exists (e.g., a HR investigation, a court trial), the action becomes **Formal Discipline** or **Legal Adjudication**. The power of this pattern derives precisely from the impossibility of appeal; there is no "court" to exonerate the accused, only a "crowd" that must be distracted.

  **2. Does the demand for contrition belong to the structure?**
  Yes. The demand for sincere public contrition (Feature 4) is a structural mechanism, not an accidental one. It functions as a **ritualistic barrier**. Because sincerity is unverifiable, the contrition serves not to restore the individual, but to test the audience's willingness to forgive. If the audience rejects the contrition (too quick, too late), the exclusion continues. This ensures the sanction is governed by *attention cycles* rather than *justice*.

  #### Rulings on Boundary Cases

  1.  **Consumer boycott of a company over a policy:** **Not an instance.** This is organized collective action against an entity, often with stated demands (policy change). It lacks the "unwritten norm" and "individual exclusion" focus.
  2.  **Private decision not to associate with someone:** **Not an instance.** This is individual discretion. Your pattern requires a *distributed* effect where multiple independent actors converge to exclude.
  3.  **Market refusing to deal for commercial reasons:** **Not an instance.** If a publisher declines a book because it won't sell, that is commercial risk assessment. If they decline because of *fear* of the distributed sanction, they are *participating* in the sanction, but the market mechanism itself is not the sanction.
  4.  **Formal disciplinary process that is merely harsh:** **Not an instance.** Feature 2 (No Agent) is violated. A harsh process is still a process with an appeal path.
  5.  **State achieving the effect through licensing/employment law:** **Not an instance.** This is **Civil Death** or **Administrative Law**. It involves state agents and codified rules (violating Feature 1 and 2).

