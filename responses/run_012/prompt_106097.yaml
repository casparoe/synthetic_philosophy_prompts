      *   *Feeling Tone Theory:* Historically popular (Bentham, Sidgwick), but widely criticized (Ryle, Wittgenstein, contemporary phenomenology). It's hard to find the "tingle."
      *   *Attitudinal Theory:* (Feldman, Heathwood). Gaining traction. Solves heterogeneity by saying pleasure is *taking attitude toward* a state. But risks collapsing into desire satisfaction or circularity ("pleasure is wanting what you want").
      *   *Determinable Theory:* (Smart, perhaps others). "Pleasure" is like "Color." Red and blue share no specific hue, but share the property of being colors. Does this explain anything? Or does it just label the problem?
      *   *My Assessment:* Pure phenomenological unity is unlikely. Attitudinal unity is plausible but tricky. Determinable unity is conceptually useful but metaphysically thin.
      *   *The Number:* I need to be skeptical but not dismissive. Hedonism *needs* unity to work as a normative theory, but metaphysics suggests disunity. Let's settle on a low-to-moderate credence in a *single substantive property* (in the strong, felt sense). However, if "substantive property" includes functional/attitudinal roles, the probability goes up. The prompt asks for "single substantive property in virtue of which all and only pleasures are pleasures."
