  The rope burned Thomas's palm, a familiar friction in the cold air of the belfry. Dust motes danced in the shaft of light falling from the louvre, settling on the framed diagrams pinned to the whitewashed wall. They were ringing Marshfield Minor, a method old enough to have worn smooth in the hands of generations, yet new enough that the band had never completed a full peal of it in this tower. Arthur stood at the fourth bell, a newcomer with steady hands and a brow furrowed in concentration. He had rung perfectly for three hours, through every dodge and place that the method demanded, following the conductor's calls until the sequence of changes stretched far beyond any entry in the tower's peal book.

  Then came the five-hundredth change. The treble swept past, and the band moved to the next row. Thomas pulled, expecting the fifth bell to lie behind him. Instead, Arthur's bell struck a beat early, cutting across the rhythm. The harmony shattered. The conductor, Mr. Henderson, called the band down immediately. The bells swung heavily, clappers mute, hanging in the stillness.

  Arthur insisted he had followed the rule. He pointed to the peal book, open on the table. It recorded every row rung in completed peals elsewhere, but nothing beyond the five-hundredth change had ever been written down here. Henderson turned the pages. The past rows matched Arthur's ringing exactly. There was no fact in the ink that ruled out Arthur's continuation. It was compatible with everything that had come before.

  Henderson walked to the wall and tapped the diagram of the method, the blue line tracing the path of the bell through the permutations. It was a picture of the rule. Arthur traced the line with his finger. He argued that the curve dictated his movement, that the geometry of the line supported the change he had just rung. Henderson traced the same line and saw a different path. The diagram did not speak; it waited to be read. A picture of a rule is not the rule itself, for the line could be interpreted to justify any number of divergences if one chose to read it differently. Arthur was not lying; he was reading the line as surely as Henderson was, yet they arrived at different pulls.

  Young Miller, leaning against the frame, suggested that Arthur was simply disposed to ring it that way. Perhaps his muscle memory, built on methods from other towers, inclined him to this variation. If that was his disposition, Miller argued, then that was simply how he followed the method.

  Henderson shook his head. Dispositions were messy things. They included fatigue, slips, and lapses. If what Arthur was disposed to do was the standard, then there was no difference between following the method and making a mistake. A man might be disposed to ring wrong when tired, but the method required him to ring right. To say he was disposed to err was to admit there was an error to be disposed toward. The disposition could not settle the norm, because the norm was needed to judge the disposition. Arthur stood silent, sincere and convinced, yet his conviction settled nothing. The certainty in his head was no guarantee of correctness outside it.

  Thomas looked toward the vestry door. Silas was in there, as he often was, practising alone on the dummy board. Silas kept a private log of his methods, writing down the rows he believed the rule demanded when no band was present to check him. He believed he was right. He believed his log captured the truth of the method. But there was no one to correct him. If he drifted, he would drift consistently, and his log would show a perfect pattern of error. Nothing he wrote could distinguish his being right from his merely seeming to himself to be right. The private notation was a closed circle, secure and meaningless.

  Back in the ringing chamber, the air was thick with the smell of oil and old wood. Henderson did not argue further about the diagram or the book. He did not try to prove Arthur wrong by appealing to a fact hidden in the rules. Instead, he picked up his rope.

  We do not agree because we all see the same line, Henderson said quietly. We see the same line because we agree.

  He called the band up. The bells began to move, the heavy wheels turning overhead. When they approached the five-hundredth change again, Henderson watched Arthur closely. He did not offer a proof. He offered a correction. He called the place aloud, forcing the rhythm. Arthur hesitated, then pulled with the band. The bell struck in the right place. The harmony held. They rang on. If Arthur drifted again, Henderson would correct him again. They would ring until Arthur's pull matched theirs, not because Arthur had finally grasped the fact of the method, but because he had been trained into the practice of the band.

  Thomas pulled his rope. The sound was solid, a wall of noise that filled the tower. It felt entirely secure. There was no doubt in the sound of the bells together, no gap in the rhythm. Yet Thomas knew that underneath the sound, nothing had been secured. There was no anchor in the book, or the diagram, or Arthur's mind. There was only the rope in his hand, the bell above, and the others ringing with him. They reached the next change, and the next, and the peal continued, carried forward by the agreement of their hands.
