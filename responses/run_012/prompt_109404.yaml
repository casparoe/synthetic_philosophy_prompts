answer: |-
  ### 1. Examination Question

  **Metaphysics: Final Year Examination**
  **Time Allowed: 45 Minutes**

  **Question 1**

  Consider an object-oriented software system containing two distinct objects, *obj1* and *obj2*. For every public method available to client code, invoking the method on *obj1* yields exactly the same return value as invoking it on *obj2*, given the same inputs. Their internal states are inaccessible. However, a specific system operation testing for reference equality returns false: *obj1* and *obj2* occupy different memory addresses.

  Write an essay addressing the following:

  1.  Distinguish the Principle of Identity of Indiscernibles (PII) from the Principle of Indiscernibility of Identicals (IoI).
  2.  Analyse whether the memory address constitutes a genuine property of the object or merely a fact about the wider system.
  3.  Evaluate whether this software scenario vindicates or undermines PII, and explain how this bears on the possibility of Black's spheres in a universe lacking an external reference frame.
  4.  Conclude by stating which of the two principles (PII or IoI) the software case primarily illustrates or tests.

  ***

  ### 2. Model Answer

  The debate surrounding the identity of indiscernibles turns on two distinct logical principles often conflated in casual discourse. The Principle of Indiscernibility of Identicals (IoI), or Leibniz's Law, states that if two entities are numerically identical, they must share all properties. Conversely, the Principle of Identity of Indiscernibles (PII) claims that if two entities share all properties, they are numerically identical. IoI is generally considered logically necessary; PII is a substantive metaphysical claim subject to counterexample.

  In the software scenario, *obj1* and *obj2* are qualitatively identical regarding all accessible methods but numerically distinct regarding reference equality. Whether this undermines PII depends on the ontological status of the memory address. If the memory address is regarded as a genuine property of the object itself, then the objects are discernible after all; they differ in the property of 'being located at address X' versus 'being located at address Y'. Under this interpretation, PII is preserved because there is a distinguishing property. However, if the memory address is viewed as a fact about the system's architecture rather than an intrinsic or relational property of the object, then the objects are genuinely indiscernible yet distinct. This would constitute a violation of PII.

  This distinction mirrors the debate over Black's spheres. In Black's thought experiment, two iron spheres exist in an otherwise empty universe, sharing all qualitative properties. Defenders of PII often argue that spatial position constitutes a property, distinguishing the spheres. Yet, in a symmetric universe without an external reference frame, spatial position is relational rather than absolute. Similarly, in the software case, if the memory address is merely a relational fact about where the system placed the object, it parallels the spheres' spatial relations. If the software system lacks an external frame to distinguish the addresses meaningfully beyond their distinctness itself, the analogy suggests that distinctness does not require qualitative difference. This supports the view that Black's spheres are possible: numerical distinctness can exist without qualitative discernibility.

  However, the software case relies on the runtime environment to maintain distinct references. This suggests that distinctness is primitive or grounded in the system's logic, not necessarily in the objects' qualities. This aligns with the 'primitive thisness' or haecceity view, where identity is fundamental and not reducible to properties. If the reference ID is a haecceity, PII is false because identity precedes property possession.

  Regarding which principle is illustrated, the software case primarily tests PII. It presents a scenario of putative indiscernibles (*obj1* and *obj2* regarding methods) that are not identical (regarding references). It does not test IoI, because IoI concerns what follows from identity, whereas here we begin with non-identity. The case demonstrates that if one excludes system-relational facts from the catalogue of properties, PII fails. However, if one includes all facts necessary to individuate references as properties, PII holds trivially.

  In conclusion, the software analogy highlights the importance of defining the scope of 'properties'. If properties are limited to qualitative features accessible via methods, PII is undermined, suggesting Black's spheres are possible. If properties include individuating facts like memory addresses, PII is saved but becomes trivial. The case illustrates the tension in PII, relying on IoI to establish that distinct references imply distinct objects, but challenging PII by showing distinct objects need not differ qualitatively.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**
  **Pass Mark: 10**
  **First-Class Threshold: 16**

  | Point | Must-Hit Move (4 Marks) | Specific Mistake (Deduct Marks) | Typical Error Note |
  | :--- | :--- | :--- | :--- |
  | **1. Principles** | Correctly defines PII (indiscernibles $\rightarrow$ identical) and IoI (identicals $\rightarrow$ indiscernible) as distinct logical directions. | Conflating the two principles or claiming they are the same law. | Candidates often treat 'Leibniz's Law' as a single monolithic principle covering both directions. |
  | **2. Reference Status** | Analyses whether the memory address is an intrinsic property of the object or a relational fact about the system environment. | Asserting the address is definitely a property without qualifying its relational nature. | Students tend to assume technical implementation details map directly to metaphysical properties without critique. |
  | **3. PII Evaluation** | Explicitly states whether the scenario violates PII based on the definition of 'property' adopted in point 2. | Claiming the scenario proves PII is false regardless of how properties are defined. | Candidates often miss that PII's validity depends on the catalogue of admissible properties. |
  | **4. Black's Spheres** | Draws a precise analogy between memory addresses and spatial relations in a symmetric universe (internal vs external frame). | Treating the software case as disproof of Black's spheres rather than an analogous structural problem. | Students frequently discuss Black's spheres in isolation without integrating the software analogy required by the question. |
  | **5. Principle Identification** | Correctly identifies that the case tests PII (distinct but similar) rather than IoI (identical therefore similar). | Arguing the case illustrates IoI because the objects behave identically. | Candidates confuse the *observation* of similarity with the *principle* governing identity inference. |
