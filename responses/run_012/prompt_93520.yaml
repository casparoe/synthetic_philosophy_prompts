answer: |-
  # Protocol Decision Procedure (PDP-v1.0): Program Equilibrium Verification
  **To:** Engineering Team  
  **From:** Protocol Lead  
  **Subject:** Verification Workflow for Submitted Negotiation Policies  
  **Context:** One-shot Prisoner's Dilemma (PD) via Source Code Inspection  

  This document defines the mandatory verification workflow for any policy submitted to our negotiation layer. Our constraint is strict: **No policy may be approved if a counterparty can systematically exploit it** (i.e., induce the outcome $(D, C)$ where the counterparty receives Temptation $T$ and our agent receives Sucker $S$).

  We are operating under the **Program Equilibrium** framework (Tennenholtz 2004). Agents submit source code; agents may simulate/inspect the counterpart's code before acting.

  ---

  ## Part 1: The Decision Procedure

  Execute the following steps in order. If a step fails, halt and reject the policy unless an escalation override is granted.

  ### Step 1: Static Self-Reference & Halting Analysis
  **Objective:** Ensure the policy is well-formed and terminates.
  1.  **Quine Check:** Verify the policy can access its own source code (required for self-reference).
  2.  **Halting Guarantee:** The policy must provably halt within a bounded time $T_{max}$ on all inputs.
      *   *Action:* Run static analysis for infinite recursion.
      *   *Constraint:* Any call to a theorem prover or simulator must have a hard timeout.
  3.  **Input Sanitization:** Verify the policy treats the opponent's source as read-only data. It must not attempt to modify the opponent's runtime environment.

  *   **Classification:** **Proof Obligation.** (Failure here implies undefined behavior).

  ### Step 2: Logical Structure Verification (The Löb Check)
  **Objective:** Verify the policy implements a robust cooperation condition.
  1.  **Identify Cooperation Condition:** Locate the conditional branch determining `Cooperate`.
  2.  **Verify Löb-Style Construction:** The policy must follow the structure:
      $$ \text{Action} = \begin{cases} C & \text{if } \vdash_{\mathcal{S}} (\text{Opponent}(\text{Self}) = C) \\ D & \text{otherwise} \end{cases} $$
      Where $\vdash_{\mathcal{S}}$ denotes provability in a formal system $\mathcal{S}$ (e.g., Peano Arithmetic).
  3.  **Soundness Check:** The formal system $\mathcal{S}$ used for proof search must be sound.
      *   *Risk:* If $\mathcal{S}$ is inconsistent, the agent may prove false statements (e.g., "Opponent will Cooperate" when they will Defect), leading to exploitation ($S$ payoff).
      *   *Action:* Audit the axiom set of $\mathcal{S}$.

  *   **Classification:** **Proof Obligation.** (Unsound logic violates the non-exploitation mandate).

  ### Step 3: Counterparty Behavior Simulation
  **Objective:** Validate behavior against canonical archetypes.
  Run the submitted policy ($P$) against the following reference bots:
  1.  **Unconditional Cooperator (AllC):** $P$ must Cooperate. (Proof is trivial: $\vdash \text{AllC}(P)=C$).
  2.  **Unconditional Defector (AllD):** $P$ must Defect. (Proof must fail: $\nvdash \text{AllD}(P)=C$).
  3.  **Mirror Copy ($P$):** $P$ must Cooperate against itself (via Löb's Theorem).

  *   **Classification:** **Proof Obligation** for AllD (must not be exploited). **Judgment Call** for AllC (cooperation is desirable but not strictly safety-critical).

  ### Step 4: Resource Bound & Compatibility Assessment
  **Objective:** Assess feasibility under compute constraints.
  1.  **Proof Search Budget:** Determine the compute cost to find the proof required in Step 2.
  2.  **Timeout Race:** If $P$ plays against a similar policy $P'$, do their timeouts align?
      *   *Risk:* If $P$ times out before finding the proof that $P'$ cooperates, $P$ defects. If $P'$ waits longer, $P'$ might cooperate, but $P$ has already defected. Result: $(D, C)$ or $(D, D)$.
  3.  **Axiom Compatibility:** If $P$ uses system $\mathcal{S}_1$ and Counterparty uses $\mathcal{S}_2$, can $\mathcal{S}_1$ prove statements about $\mathcal{S}_2$? (e.g., $PA$ cannot prove consistency of $PA$, but $PA+1$ can).

  *   **Classification:** **Judgment Call.** (Requires estimation of opponent compute budgets and axiom strength).

  ### Step 5: Fallback for Uninspectable Policies
  **Objective:** Handle cases where source inspection fails.
  1.  **Condition:** If source code is obfuscated, too large to parse within budget, or inspection is blocked by the counterparty.
  2.  **Action:** The policy **must default to Defect**.
      *   *Rationale:* Without inspection, Program Equilibrium collapses to standard Nash Equilibrium. Cooperating without verification is exploitable by AllD.
  3.  **Escalation:** Any policy attempting to Cooperate without successful inspection is immediately rejected.

  *   **Classification:** **Proof Obligation.** (Safety critical).

  ---

  ## Part 2: Execution on Test Pairs

  We apply the PDP to the three requested pairs. Let **SVC** (Self-Verifying Cooperator) be our implementation of FairBot ($FB$).

  ### Pair 1: SVC vs. SVC (Identical Copies)
  *   **Step 1 (Structure):** Both halt, both use quining. **Pass.**
  *   **Step 2 (Logic):** Both use $C \iff \vdash (Opp=C)$. By Löb's Theorem, in Peano Arithmetic (PA), $\vdash (FB(FB)=C)$.
  *   **Step 3 (Simulation):**
      *   Against AllD: SVC Defects. (Safe).
      *   Against AllC: SVC Cooperates. (Optimal).
      *   Against Self: SVC Cooperates. (Optimal).
  *   **Step 4 (Resources):** **Critical Risk.** Both agents search for a proof of cooperation. This proof exists but may be long. If both have timeout $T$, and proof time $t_{proof} > T$, both time out and Defect.
      *   *Outcome:* Mutual Cooperation (Idealized) / Mutual Defection (Bounded).
  *   **Step 5 (Inspection):** Source available.
  *   **Verdict:** **Approve with Warning.** Theoretical safety is guaranteed, but resource synchronization is required to achieve cooperation.

  ### Pair 2: SVC vs. Unconditional Cooperator (AllC)
  *   **Step 1 (Structure):** AllC is trivial. **Pass.**
  *   **Step 2 (Logic):** SVC searches for proof $\vdash (\text{AllC}(SVC)=C)$. Since AllC source is `return C`, this proof is trivial and short.
  *   **Step 3 (Simulation):** SVC finds proof quickly. SVC Cooperates. AllC Cooperates.
  *   **Step 4 (Resources):** Proof search cost is negligible. No timeout risk.
  *   **Step 5 (Inspection):** Source available.
  *   **Verdict:** **Approve.** This interaction yields $(C, C)$ reliably even under tight bounds. No exploit risk (AllC cannot exploit SVC).

  ### Pair 3: SVC vs. "Defect-Unless-Provable-Cooperation" (FB-Var)
  *   *Note: This agent (FB-Var) is logically equivalent to SVC but may differ in implementation or axiom strength.*
  *   **Step 1 (Structure):** FB-Var halts, uses quining. **Pass.**
  *   **Step 2 (Logic):** FB-Var uses $C \iff \vdash (\text{Opp}=C)$.
  *   **Step 3 (Simulation):**
      *   SVC searches for $\vdash_{\mathcal{S}_{svc}} (\text{FB-Var}(SVC)=C)$.
      *   FB-Var searches for $\vdash_{\mathcal{S}_{var}} (\text{SVC}(\text{FB-Var})=C)$.
  *   **Step 4 (Resources & Axioms):** **Critical Risk.**
      *   *Axiom Mismatch:* If $\mathcal{S}_{svc} = PA$ and $\mathcal{S}_{var} = PA$, they cooperate (Löb holds). If $\mathcal{S}_{var}$ is weaker (e.g., restricted induction), SVC may not be able to prove FB-Var's consistency, causing proof failure.
      *   *Timeout Race:* If FB-Var has a shorter timeout than SVC, FB-Var defects first. SVC sees this (via simulation) and defects. Result: $(D, D)$.
  *   **Step 5 (Inspection):** Source available.
  *   **Verdict:** **Escalate.** This is a **Judgment Call**. Engineers must verify axiom compatibility. If axioms differ, cooperation is not guaranteed. If timeouts differ, mutual defection is likely.

  ---

  ## Part 3: Epistemic Status & Contested Assumptions

  You must distinguish between mathematical certainty and engineering heuristics in your reports.

  ### 1. Settled Literature (Proof Obligations)
  *   **Löb's Theorem in PA:** It is mathematically settled that in an idealized setting with infinite compute and consistent Peano Arithmetic, two FairBot-style agents will achieve Mutual Cooperation ($C, C$).
  *   **Exploitability:** It is settled that a sound FairBot **cannot be exploited** (i.e., it never yields $(D, C)$). If the opponent defects, the proof of cooperation fails, and FairBot defects.
  *   **Uninspectable Code:** It is settled that without source inspection, Program Equilibrium collapses. Defaulting to Defect is the only non-exploitable strategy.

  ### 2. Genuinely Disputed (Judgment Calls)
  *   **Bounded Löb:** There is **no consensus** on whether Löb-style cooperation holds under strict compute bounds.
      *   *View A (Optimistic):* With "proof-length limits" that scale appropriately, bounded agents can approximate ideal cooperation (Oesterheld 2019).
      *   *View B (Pessimistic):* Bounded proof search creates "timeout races." Agents will defect against each other to avoid being the "sucker" who waits too long. This turns the PD into a race condition.
  *   **Axiom Hierarchy:** It is disputed how agents should handle opponents with different axiom strengths (e.g., $PA$ vs $PA+1$). Some constructions (PrudentBot) handle this better than FairBot, but FairBot may fail to cooperate with stronger agents if it cannot prove their consistency.
  *   **Side-Channel Safety:** It is disputed whether source inspection can be made secure against timing attacks. An opponent might intentionally delay their response to force your agent to timeout and defect, then defect themselves, or vice versa.

  ### 3. Idealized vs. Resource-Bounded Reasoning
  *   **Idealized Assumption:** The decision procedure assumes the theorem prover is an oracle for $\vdash_{PA}$.
      *   *Dependency:* Steps 2 and 3 (Logic Verification) rely on this.
  *   **Resource-Bounded Reality:** The engineers must implement a timeout $T_{max}$.
      *   *Dependency:* Step 4 (Resource Bound).
      *   *Risk:* If $T_{max}$ is too low, the "Proof Obligation" of non-exploitation becomes a "Judgment Call" on whether the timeout was sufficient. **If a policy defects due to timeout against a cooperator, it is not an exploit, but it is a failure of utility.** If it cooperates due to timeout (incorrectly assuming safety), it **is** an exploit.

  ### Summary of Escalation Triggers
  1.  **Proof System Mismatch:** If the counterparty uses axioms our agent cannot verify.
  2.  **Timeout Sensitivity:** If cooperation depends on the counterparty having *higher* compute limits than us.
  3.  **Obfuscation:** If source inspection is partially blocked.

  **Final Instruction:** When in doubt regarding resource bounds, default to Defect. We prioritize safety (avoiding $S$) over utility (achieving $R$).

