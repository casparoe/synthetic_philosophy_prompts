      *   **Classmate's Objection:** It's eliminativism with a nice name.
      *   **User's Loose Ends:**
          1.  *Physics Objection:* Friend says CoG is relative to a field, non-unique in non-uniform fields, shifts with orientation/position. Is the physics right? Does it matter?
          2.  *Legal Person Analogy:* Corporation analogy proposed by another student. Restores normative dimension (responsibility, liability). How does it compare?
      *   **Task:** Audit the CoG analogy (not defend/attack Dennett generally).
      *   **Requirements:**
          1.  Correspondence Table (Body, Mass, Field, Torque, Theory, Observer).
