prompt: |-
  Two colleagues of mine fell into an argument after a seminar, and I ended up as the only other person at the table. One of them, a historian of nineteenth-century philosophy, had been talking about Henry Sidgwick's long involvement with the Society for Psychical Research — he was its first president, and his circle included figures like Frederic Myers and Edmund Gurney — and she treated it as a straightforward extension of his intellectual character. The other, a contemporary ethicist, thought that reading was too tidy, and what follows is the exchange roughly as it happened.

  (1) The historian said that Sidgwick's psychical research is exactly what one would predict from the author of The Methods of Ethics: a man who had resigned a Trinity fellowship rather than subscribe to doctrinal formulas he could not honestly affirm, applying the same evidential discipline to claims about apparitions, telepathy and survival that he applied to moral claims. On her view, the research programme — the census of hallucinations, the attention to testimony, the refusal to let the desire for a result stand in for a result — is continuous with the rest of his work, and the ethics is left untouched by it.

  (2) The ethicist said that continuity of method is not the interesting question. The interesting question is why these particular questions and not others. He pointed out that Sidgwick's ethical theory famously ends in a dualism of practical reason: the demands of rational egoism and the demands of universal benevolence are both defensible, and nothing in the Methods shows they must coincide in this life. On his reading, psychical research was where Sidgwick went looking for the missing harmony — for a cosmos in which the two standpoints could be reconciled — and that hope, not the method, explains the shape of the programme. He conceded that Sidgwick's evidential standards were never lowered, but said that being rigorous about the evidence is compatible with having a preferred answer.

  (3) She answered that this conflates motive with warrant. Every research programme is started by someone who cares about the answer, and if having a preferred outcome discredited a line of inquiry, we would have to discard most of the history of science. What matters is whether the inquiry was structured so that the preferred answer could fail. She said it plainly could, and did: the results Sidgwick and his colleagues reported were largely negative or inconclusive, and he said so in print.

  (4) He replied that this proves less than she thinks. It shows Sidgwick was honest at the point of reporting, not that the questions were framed neutrally from the start. He claimed the framing gives the preference away — why survival, why telepathy, why the specific hope that mind might not be exhausted by the body? He also put a further point, which is the one I found hardest to assess. On Sidgwick's own utilitarianism, he said, the truth of survival would not be practically idle. If consequences extend beyond death, the expected value of our present actions changes, and so does the weight we should give to things we now treat as terminal. So the question cannot be filed away as a private curiosity with no bearing on the ethics.

  (5) She said that last move gets Sidgwick backwards. His ethics was built to deliver guidance that holds whether or not we survive, and he was explicit that practical reason does not wait on metaphysical discoveries. The fact that survival would alter a consequentialist calculus is a fact about a calculus he did not take himself to be running on that question. She also said that if anything, the negative outcome is evidence for her reading: a man in search of consolation would have found some.

  (6) He said that is a psychological conjecture, not an argument, and that a person can want a conclusion for decades without manufacturing it, and still have wanted it. She said that is true, and that it is also true that wanting it leaves no trace in the argument, which was her original point.

  I have no stake in either side and I could not referee this myself. Please adjudicate it move by move: for each of the six moves, say whether it is right, mistaken, or partly both, and why. I am especially interested in (a) whether the distinction between a research programme having a preferred outcome and that outcome shaping the programme is being used legitimately here, and (b) whether the ethicist's claim about survival changing the utilitarian calculus is a serious point about Sidgwick or a category error about what his ethics was for. Say what, if anything, both of them are missing, and identify which parts of the dispute turn on matters that are settled among people who know the period and which turn on genuinely contested interpretations, so that I am not left thinking a disputed reading is the consensus. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a six-move debate between two colleagues (a historian of 19th-century philosophy and a contemporary ethicist) regarding Henry Sidgwick's involvement with the Society for Psychical Research (SPR).
      *   **Format:** Move-by-move analysis (1-6), stating whether each is right, mistaken, or partly both, with reasons.
      *   **Specific Focus:**
          *   (a) The distinction between having a preferred outcome vs. that outcome shaping the programme.
          *   (b) The ethicist's claim about survival changing the utilitarian calculus vs. the historian's claim about ethics independent of metaphysics.
      *   **Additional Requirements:** Identify what both are missing, distinguish between settled scholarly consensus and genuinely contested interpretations, and write in British English.
      *   **Tone:** Impartial, scholarly, analytical.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Historian):** Sidgwick's SPR work is continuous with his *Methods of Ethics* (MoE). Same evidential discipline, resignation from Trinity shows intellectual honesty. Ethics is untouched by SPR.
      *   **Move 2 (Ethicist):** Continuity of method isn't the point. Why *these* questions? MoE ends in the "Dualism of Practical Reason" (Egoism vs. Universal Benevolence). SPR was a search for cosmic harmony/reconciliation (survival) to solve this dualism. Rigour $\neq$ neutrality of motivation.
      *   **Move 3 (Historian):** Conflates motive with warrant. Science often starts with a preferred answer. Key is whether the inquiry allowed for failure. Sidgwick reported negative/inconclusive results honestly.
      *   **Move 4 (Ethicist):** Honesty in reporting $\neq$ neutral framing. Why survival/telepathy? *Crucial Point:* If survival is true, it changes the utilitarian calculus (consequences extend beyond death). Therefore, it's not a private curiosity; it bears on ethics.
      *   **Move 5 (Historian):** Gets Sidgwick backwards. Ethics provides guidance *whether or not* we survive. Practical reason doesn't wait on metaphysics. Negative results support her view (he didn't fake consolation).
      *   **Move 6 (Ethicist):** Psychological conjecture vs. argument. Wanting a conclusion for decades doesn't mean manufacturing it. **Historian:** True, but wanting it leaves no trace in the argument (reiterating Move 3).

  3.  **Evaluate Each Move (Drafting the Adjudication):**

      *   **Move 1:** *Historian claims continuity of method and ethics untouched.*
          *   *Assessment:* Partly right, partly misleading. The methodological continuity (evidential rigour) is well-documented. However, claiming the ethics is "untouched" is contentious. Sidgwick himself hinted at the connection.
          *   *Verdict:* Partly both. Methodological continuity is sound; the claim that ethics is entirely untouched is too strong.

      *   **Move 2:** *Ethicist claims SPR was a search for harmony to solve the Dualism of Practical Reason.*
          *   *Assessment:* This is the standard scholarly interpretation (Bartlett, Schneewind, etc.). Sidgwick worried that without sanctions (rewards/punishments in afterlife), egoism might trump utilitarianism.
          *   *Verdict:* Right. This aligns with the consensus on Sidgwick's motivations.

      *   **Move 3:** *Historian distinguishes motive from warrant; cites negative results.*
          *   *Assessment:* Logically sound distinction (context of discovery vs. context of justification). Sidgwick did report negatives. However, it sidesteps the *selection bias* argument (why look here if not for the hope?).
          *   *Verdict:* Right on the logic of science, but slightly evasive regarding the specific *choice* of topic.

      *   **Move 4:** *Ethicist argues framing reveals preference; Survival changes utilitarian calculus.*
          *   *Assessment:* Framing point is strong. The calculus point is the tricky one. If consequences extend infinitely, the calculation changes. But Sidgwick tried to ground ethics on *this* life primarily.
          *   *Verdict:* Framing point is Right. Calculus point is Partly both (technically true for act-utilitarianism, but Sidgwick sought a system robust against metaphysical uncertainty).

      *   **Move 5:** *Historian claims ethics holds regardless of survival; negative results prove lack of bias.*
          *   *Assessment:* Sidgwick did want ethics to be rational independent of theology. But the "Dualism" specifically relies on the *possibility* of divergence if there are no external sanctions. The negative result point is good evidence of honesty, but doesn't disprove the *hope* drove the inquiry.
          *   *Verdict:* Partly both. Ethics was designed to be secular, but the Dualism problem makes metaphysics relevant.

      *   **Move 6:** *Ethicist: Wanting $\neq$ manufacturing. Historian: Wanting leaves no trace.*
          *   *Assessment:* Stalemate. Both acknowledge the logic. The Historian wins on the textual evidence (the arguments stand up), Ethicist wins on the biographical motivation.
          *   *Verdict:* Both Right. It's a standoff on the implication of desire.

  4.  **Address Specific Focus Areas:**

      *   **(a) Preferred Outcome vs. Shaping the Programme:** The Ethicist is using this legitimately to point out *selection bias*. The Historian is using it legitimately to defend *epistemic integrity*. Both are valid angles, but the Ethicist's point about *why this topic* is historically stronger regarding Sidgwick's specific anxieties.
      *   **(b) Survival and the Calculus:** This is the crux. Sidgwick's utilitarianism is hedonistic. If pleasure continues after death, the sum total changes. However, Sidgwick argued for the "rationality" of benevolence independent of this. The Ethicist is technically right about the *calculus*, but the Historian is right about Sidgwick's *intent* to find a rational basis that doesn't *depend* on it. It's not a category error, but it misses Sidgwick's nuanced attempt to separate rational intuition from empirical uncertainty.

  5.  **Identify Missing Elements & Consensus:**

      *   **Missing:** Both ignore the social/institutional context of the SPR (it wasn't just Sidgwick). Both underplay Sidgwick's own letters (he was more explicit about the "theological" need than the *Methods* suggests).
      *   **Consensus:** It is settled that Sidgwick hoped psychical research would provide evidence for survival to resolve the Dualism of Practical Reason. (Schneewind is the key authority here).
      *   **Contested:** Whether this hope *compromised* the philosophical integrity of the *Methods*. Most scholars think the *Methods* stands, but the *motivation* for SPR is clear.

  6.  **Refine Tone and Language:**
      *   Ensure British English (e.g., "programme," "honour," "centre," "defence").
      *   Maintain neutrality.
      *   Ensure the distinction between "settled history" and "philosophical interpretation" is clear.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Self-Correction on Move 4:* I need to be careful not to say the Ethicist is definitely right about the calculus. Sidgwick distinguishes between the *proof* of utilitarianism and the *application*. If survival is true, it affects the *application*, but Sidgwick wanted the *proof* to hold regardless. I need to nuance this.
      *   *Self-Correction on Consensus:* I must cite the standard view (Schneewind, Bartlett) to assure the user what is settled. The "Dualism" driving the SPR interest is the settled part. The "corruption of ethics" is the contested part.

  8.  **Final Review against constraints:**
      *   Move-by-move? Yes.
      *   Right/Mistaken/Partly both? Yes.
      *   British English? Yes.
      *   Focus (a) and (b) addressed? Yes.
      *   Missing/Consensus section included? Yes.

  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between the *Methods* (ethics) and the SPR (empirical inquiry) is handled precisely. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, regarding Move 5, the Historian says "ethics was built to deliver guidance that holds whether or not we survive." Sidgwick actually admits in the *Methods* that without sanctions, Egoism and Utilitarianism might conflict. He *hoped* they wouldn't. So the Historian is slightly overstating the independence of the ethics from metaphysics in the final analysis of the *Dualism*. I need to highlight this nuance. The Ethics is *methodologically* independent, but *systematically* threatened by the lack of sanctions.

  Okay, ready to write.s
answer: |-
  Here is an adjudication of the exchange, move by move, followed by an assessment of the specific philosophical points and the state of scholarly consensus.

  ### Adjudication of Moves

  **(1) The Historian: Continuity of Method**
  **Verdict: Partly both.**
  The historian is **right** that Sidgwick's methodological approach to psychical research mirrored his philosophical rigour. Sidgwick applied the same empirical caution to testimony about ghosts as he did to moral intuition; he was not a credulous spiritualist but a critical investigator. However, she is **mistaken** (or at least overstating the case) in suggesting the ethics is "left untouched" by this. Sidgwick's own correspondence suggests he viewed the two projects as mutually supporting, not merely parallel. To claim the ethics is entirely insulated from his metaphysical hopes is to ignore the systematic nature of Sidgwick's thought, where the rationality of morality often hinged on the structure of the universe.

  **(2) The Ethicist: The Dualism of Practical Reason**
  **Verdict: Right.**
  This is the strongest move in the exchange. It aligns with the dominant scholarly interpretation of Sidgwick's motivation. In *The Methods of Ethics*, Sidgwick concludes that Rational Egoism and Universal Benevolence are both rational, yet they may conflict unless there is a moral government of the universe (i.e., divine sanctions or survival) to harmonise them. The ethicist is correct that Sidgwick turned to psychical research specifically to find empirical evidence for this harmonisation. The "hope" for a specific result (survival) does explain the shape of the programme better than mere methodological curiosity.

  **(3) The Historian: Motive vs. Warrant**
  **Verdict: Right.**
  The historian makes a logically sound distinction between the *context of discovery* (why one starts an inquiry) and the *context of justification* (whether the inquiry is conducted honestly). She is correct that a preferred outcome does not inherently invalidate a research programme, provided the methodology allows for falsification. Sidgwick did indeed publish negative results and admitted when evidence was lacking. This move successfully defends Sidgwick's intellectual integrity against the implication of bias, even if it concedes the biographical motivation.

  **(4) The Ethicist: Framing and the Utilitarian Calculus**
  **Verdict: Partly both.**
  The point about **framing** is **right**: the specific selection of questions (survival, telepathy) reveals a prior commitment to the possibility of mind surviving body, which supports the ethicist's view of Sidgwick's motivation. However, the point about the **utilitarian calculus** is **partly mistaken**. While it is technically true that if consequences extend beyond death the calculation of utility changes, Sidgwick's project was to establish the *rationality* of utilitarianism independent of empirical uncertainty. He sought a moral system that held even if we *could not know* about the afterlife. The ethicist treats Sidgwick as a simple act-utilitarian calculating sums, whereas Sidgwick was concerned with the *axioms* of practical reason. Nevertheless, the ethicist is right that Sidgwick hoped the *truth* of survival would make the moral system more stable.

  **(5) The Historian: Ethics Independent of Metaphysics**
  **Verdict: Partly both.**
  She is **right** that Sidgwick aimed to construct an ethical system that did not *depend* on theological dogmas (hence his resignation from Trinity). He wanted morality to be rational even for an agnostic. However, she is **mistaken** in implying the negative results prove he wasn't seeking consolation. One can seek consolation rigorously and fail to find it; the failure does not negate the desire. Furthermore, regarding the ethics: while Sidgwick wanted the *method* to be independent, he explicitly admitted in the final chapter of the *Methods* that without the hypothesis of a moral universe, the "Dualism of Practical Reason" remains unresolved. Thus, the ethics is not entirely independent of the metaphysical hope in its final systematic coherence.

  **(6) The Ethicist and Historian: Desire and Trace**
  **Verdict: Both Right.**
  This is a stalemate that accurately reflects the limits of textual interpretation. The ethicist is **right** that long-standing desire does not equate to fabrication. The historian is **right** that if the desire leaves no trace in the *argumentation* (i.e., the logic holds regardless of the desire), then the philosophical work stands on its own. They are talking past one another slightly: he is speaking about biographical explanation, she about philosophical validity. Both claims are compatible.

  ***

  ### Assessment of Specific Points

  **(a) The Distinction Between Preferred Outcome and Shaping the Programme**
  Both parties are using this distinction legitimately, but they are prioritising different values.
  *   The **Historian** uses it to defend *epistemic integrity*. Her point is that science and philosophy often proceed from a hunch or a hope; what matters is that the door was left open for the hunch to be wrong. In this, she is correct: Sidgwick's SPR reports are models of caution.
  *   The **Ethicist** uses it to explain *intellectual biography*. His point is that the "shape of the programme" (why look for ghosts at all?) is determined by the philosophical problem (the Dualism). In this, he is also correct.
  *   **Adjudication:** The Ethicist has the stronger historical case regarding *motivation*, while the Historian has the stronger philosophical case regarding *validity*. The distinction is being used legitimately by both, but the Ethicist correctly identifies that the "preferred outcome" (survival) was not just a hope, but a *necessary condition* for Sidgwick's complete ethical system to cohere without contradiction.

  **(b) Survival and the Utilitarian Calculus**
  The Ethicist's claim is **not a category error**, but it is a simplification of Sidgwick's position.
  *   **Why it is not an error:** Sidgwick was a hedonistic utilitarian. If pleasure and pain continue after death, the "greatest happiness" sum changes drastically. An action that causes pain now but secures pleasure later (in the afterlife) might be justified. Therefore, the truth of survival *does* bear on the practical application of the theory.
  *   **Why it is a simplification:** Sidgwick's primary aim in the *Methods* was to show that Utilitarianism is *rational* even in the absence of such knowledge. He distinguished between the *proof* of the principle (which relies on intuition) and the *sanctions* (which rely on empirical or theological facts). The Historian is correct that Sidgwick did not want to *wait* on metaphysical discoveries to act morally. However, the Ethicist is correct that Sidgwick worried that without those discoveries, Rational Egoism might ultimately defeat Utilitarianism.
  *   **Conclusion:** The Ethicist is right that the stakes were high for the ethical system, but the Historian is right that Sidgwick refused to make the *obligation* to be moral contingent on the proof of survival.

  ***

  ### What Both Are Missing

  1.  **The Social Context of the SPR:** Both treat Sidgwick's involvement as a solitary intellectual project. In reality, the SPR was a collective enterprise involving physicists, biologists, and classicists. Sidgwick's role was as much administrative and institutional as it was philosophical. The "shape of the programme" was not solely determined by Sidgwick's dualism but by the broader Victorian crisis of faith and the rise of scientific naturalism.
  2.  **Sidgwick's Private Correspondence:** Both argue from the published texts (*The Methods of Ethics* and SPR proceedings). Sidgwick was far more explicit in private letters (particularly to his wife, Eleanor, and to his protégé, John Addington Symonds) about his desperation for evidence of survival. He admitted that without it, life seemed to him "not worth living." This biographical fact strengthens the Ethicist's claim about motivation significantly more than the Historian allows.
  3.  **The Nature of "Evidence":** Neither discusses what Sidgwick thought would count as proof. He was not looking for spiritualist seances; he was looking for statistical anomalies in hallucinations (the "Census of Hallucinations"). This nuance supports the Historian's view of his rigour but also supports the Ethicist's view that he was looking for a specific *kind* of naturalistic proof to satisfy a philosophical need.

  ***

  ### Consensus vs. Contested Interpretations

  To ensure you are not mistaking a disputed reading for consensus, here is the breakdown based on the current scholarship (principally the work of J.B. Schneewind, Alan Bartlett, and David Phillips):

  **Settled Consensus:**
  *   **The Motivation:** It is settled that Sidgwick's interest in psychical research was driven by his philosophical anxiety over the "Dualism of Practical Reason." He hoped empirical evidence for survival would reconcile Egoism and Utilitarianism. The Ethicist is on firm ground here; the Historian's suggestion that it was merely an extension of evidential discipline is considered incomplete by specialists.
  *   **The Integrity:** It is settled that Sidgwick maintained high evidential standards within the SPR. He did not fake data. The Historian is on firm ground here; the Ethicist's implication that the framing compromised the science is generally rejected by historians of the SPR.
  *   **The Outcome:** It is settled that Sidgwick remained agnostic. He found the evidence suggestive but not demonstrative.

  **Genuinely Contested:**
  *   **The Impact on the *Methods*:** Scholars disagree on whether the reliance on this hope undermines the *Methods of Ethics*. Some argue it shows the system is incomplete without theological assumptions (supporting the Ethicist). Others argue the *Methods* succeeds as a secular moral theory regardless of Sidgwick's personal hopes (supporting the Historian).
  *   **The "Consolation" Charge:** Whether Sidgwick was seeking "consolation" or "rational coherence" is debated. The Historian treats "consolation" as a dirty word implying bias; the Ethicist treats it as a philosophical necessity. Most modern biographers lean towards the Ethicist: it was a rational need for coherence, not merely emotional comfort, though the two were intertwined for Sidgwick.

  **Summary for your Table:**
  If you were to cast a vote, the **Ethicist** has the better grasp of Sidgwick's *biographical and systematic motivations*, while the **Historian** has the better grasp of Sidgwick's *methodological integrity*. The Ethicist is closer to the scholarly consensus regarding *why* Sidgwick joined the SPR, but the Historian is correct that this does not invalidate the philosophical arguments Sidgwick produced.
