answer: |-
  **Realist:** You deny that science progresses?

  **Anti-Realist:** I deny that "progress" means "getting closer to the truth." You want a definition of truthlikeness—closeness to the truth—for theories we know are false. I say the notion collapses.

  **Realist:** Consider the ether. Physicists posited a medium pervading space. Later, the medium was abolished, yet the equations remained almost intact. That looks like retention of truth, not just utility.

  **Anti-Realist:** It looks like mathematics, not truth. The old theory's central term, "ether," referred to nothing. If your subject doesn't exist, you aren't nearly right; you are mistaken. You might recover the old equations as a limiting case—a mathematical approximation valid in certain domains—but that shows continuity of calculation, not closeness to reality.

  **Realist:** But the obvious definition fails too. If we count consequences—statements derived from the theory—a false theory has infinite false consequences. A stronger false theory has more true consequences but also more false ones. We cannot trade them off. So we must move from consequences to resemblance. We order possible ways the world might be by similarity to the actual world. A theory is truthlike if the possibilities it permits resemble reality.

  **Anti-Realist:** And who supplies the ordering? Resemblance isn't found; it's imposed. To say one possible world is "closer" to actuality than another, you must weight differences. Is a difference in mass more significant than a difference in charge? If you choose the weights, the ranking presupposes the judgments it was meant to ground. If two rival metrics rank two false theories in opposite orders, nothing in the world decides between them.

  **Realist:** Nature fixes the weights, not us. There are natural joints in reality. This distinguishes truthlikeness from merely saving the phenomena.

  **Anti-Realist:** Explain that distinction.

  **Realist:** Saving the phenomena means constructing a model that matches observations without claiming the model's entities exist. Truthlikeness claims the model's structure mirrors the world's structure. If we only saved phenomena, the success of our predictions would be a miracle. Why should equations derived from a false ontology predict new effects unless they captured something real?

  **Anti-Realist:** I concede predictive success. I concede we need explanations that feel robust. But empirical adequacy—matching all observable data—is enough to explain success without invoking a metaphysical distance to the truth. You say nature fixes the weights. I say if we disagree on which similarities matter, you cannot point to a fact that settles it.

  **Realist:** I can point to the stability of inquiry. We converge on specific structures. That convergence suggests the resemblance space is objective.

  **Anti-Realist:** Convergence suggests shared human interests or shared perceptual constraints. You argue that the ether theory was truthlike because its structure survived. I argue it was empirically adequate within a domain. The difference is whether there is a mind-independent fact about which structural errors are "worse."

  **Realist:** There is. If I say the earth is flat, I am further from the truth than if I say it is ellipsoidal. That isn't just about utility.

  **Anti-Realist:** It is about utility for navigation. If I care about cosmology, the flat earth model is useless. If I care about building a house, it is sufficient. Your "distance" varies with my purpose. Unless you can show me a fact about the universe that dictates which errors count more, independent of human inquiry, you have only described our preferences.

  **Realist:** Then we are at the bedrock. I believe similarity is a relation between worlds that holds regardless of us.

  **Anti-Realist:** And I believe similarity is a relation between descriptions that holds only relative to a metric we choose.

  **Realist:** So what would decide us?

  **Anti-Realist:** Precisely this: Is there a unique, mind-independent topology of possibility? If you could show that the universe itself privileges certain distinctions over others—such that "mass" is objectively more fundamental than "color" regardless of any observer—then your metric stands. If not, if the weighting of differences is always relative to an inquirer's goals, then truthlikeness is just a polished name for empirical adequacy.

  **Realist:** Then I must show that the structure of reality dictates the structure of inquiry, not vice versa.

  **Anti-Realist:** And I must show that every time you point to structure, you are pointing to a choice we made to carve it that way. Until then, the notion remains undefined.
