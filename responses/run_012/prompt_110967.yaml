      *   **Core Question:** What theory of causation and responsibility does the act-versus-omission distinction presuppose? Does it require omissions not to be causes? Does it relocate difference to duty? Is it consistent? What rival views does it rule out? What would change if swapped?
      *   **Constraints:** Exactly five numbered points. One or two sentences each. No intro. No wrap-up.

  2.  **Deconstruct the Philosophical Issue:**
      *   The user is asking about the *Act/Omission Distinction* in medical ethics and law.
      *   The puzzle: Withdrawing treatment (omission/allowing to die) vs. Withholding treatment (omission/allowing to die) vs. Active Euthanasia (action/killing). Also, the legal distinction between no duty to rescue strangers vs. duty to care for dependents.
      *   The user's specific confusion: If omissions cause death (like starving a kid), why doesn't not donating to charity count as killing? Where is the line?
      *   The underlying theory: It's not usually a theory of *causation* (metaphysical) but a theory of *duty* (normative). Most legal/ethical frameworks treat omissions as causally relevant but normatively distinct based on special obligations.
      *   Consistency: It is internally consistent if grounded in specific duties rather than general causation.
      *   Rival views: Utilitarianism (Peter Singer) might argue the distinction is morally irrelevant if outcomes are the same. Counterfactual theories of causation might struggle to distinguish without normative input.

  3.  **Drafting the Five Points (Iterative Process):**

      *   *Point 1: Implicit Theory.* The practice presupposes a normative theory of duty rather than a metaphysical theory of causation, treating omissions as causally relevant but legally insignificant without a pre-existing special obligation.
      *   *Point 2: Requirements.* It strictly requires a defined boundary of specific responsibilities (like parent-child or doctor-patient) rather than denying that omissions can physically cause outcomes.
      *   *Point 3: Coherence.* The framework is internally consistent because it locates the moral difference in the breach of duty rather than the mechanics of death, distinguishing the parent's obligation from the bystander's lack thereof.
      *   *Point 4: Underdetermination/Rival Views.* It rules out pure counterfactual causation views where any preventable death implies responsibility, instead relying on deontological constraints that limit who is responsible for preventing harm.
      *   *Point 5: Swapping Theory.* If you swapped this for a consequentialist view where only outcomes matter, the distinction between withholding and withdrawing care would collapse, potentially criminalizing failure to donate to effective charities.

