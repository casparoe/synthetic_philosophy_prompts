answer: |-
  (i) **Assignment and Objection**

  I assign the Black Death the role of an **Amplifier**.

  The obvious objection is that a pathogen which extinguishes 30–50% of a population cannot be merely an amplifier; it must be an **Author**. To kill half the cast of a play is to rewrite the script. If the outcome is mass death, surely the pathogen has fixed the outcome independently of human action.

  This objection conflates *biological necessity* with *historical determination*. The plague bacterium (*Yersinia pestis*) is indeed an Author of the demographic event: once the flea bites, human agency cannot deflect the septicemic shock. However, history is not the study of death, but of the reorganization of the living. The "historical outcome" of the Black Death is not the body count, but the social, economic, and political restructuring that followed.

  If the plague were a historical Author, the post-plague social structure would be a direct, uniform function of the mortality rate. We would expect a universal collapse of authority or a universal liberation of labor. Instead, we see a fractured landscape of responses. The pathogen provided the shock (the amplification of scarcity), but the *direction* of the historical change was supplied by pre-existing human structures. The plague intensified the value of labor, but it did not dictate who captured that value. To call it an Author is to mistake the *occasion* of change for the *mechanism* of change. It is an Amplifier because it took latent tensions over land and labor and ratcheted them to a breaking point, without determining which way the structure would crack.

  (ii) **The Test of Divergence: West vs. East**

  The divergence between Western and Eastern Europe serves as the stress test for this assignment. In the West (e.g., England, France), the post-plague labor shortage correlated with the erosion of serfdom, rising real wages, and the strengthening of peasant bargaining power. In the East (e.g., Prussia, Poland, Russia), the same demographic shock correlated with the "Second Serfdom": the legal binding of peasants to the land, the consolidation of noble power, and the suppression of wages.

  If the plague were an **Author**, this divergence is impossible. An Author fixes the outcome independently of human actors; the bacteria do not respect the Elbe river. If the plague were merely a **Trigger**, we might expect human actors to have deflected the outcome entirely (returning to the status quo ante), but the intensity of the change suggests a deeper structural shift occurred in both regions.

  The divergence confirms the **Amplifier** role. The plague amplified the specific vulnerabilities and leverage points already present in the respective feudal contracts.
  *   In the **West**, towns were stronger, royal courts were more centralized (offering peasants legal appeal against lords), and the economy was more diversified. The labor shortage amplified the peasants' ability to walk away to cities or appeal to the King.
  *   In the **East**, towns were weaker, noble cohesion was stronger, and the grain export market to the West created an incentive for lords to coercively retain labor rather than compete for it. The labor shortage amplified the lords' incentive to use force.

  The non-human cause (plague) was constant; the human variable (institutional strength) was the determinant. If one non-human cause issues in opposite institutional outcomes, the claim that it "acted" as a historical agent in the strong sense is severed. It did not act *upon* history; it acted *within* a historical field that determined the vector of its impact. The plague was the wind; the West and East were ships with different rigging. The wind did not steer the ships; it merely tested their sail.

  (iii) **The Determinist Impulse**

  This divergence is a **refutation** of the determinist impulse, not merely a boundary condition. The determinist impulse assumes that non-human causes carry a teleology—that a labor shortage *means* liberation, or that a drought *means* collapse. The East/West case demonstrates that non-human causes are historically inert until coupled with a specific social topology.

  Theories of environmental or biological determinism often treat the divergence as an anomaly ("the East was an exception"). This is a category error. The divergence is the rule. It shows that the "causal power" of a non-human entity is not intrinsic but relational. A virus does not have a political program. When historians treat the plague as a determinant, they are smuggling in a hidden premise: that human societies respond to stress in a uniform, rational manner (e.g., scarcity raises price). The East/West case proves that "price" is not just economic but political.

  Therefore, the determinist impulse fails because it attempts to isolate the non-human variable as an independent variable in a system where it is fundamentally dependent. The plague did not determine the outcome; it revealed the prior determination of the human structure. To treat it as a determinant is to confuse the *breakage* with the *flaw*.

  (iv) **Agency-Talk and the Null Case**

  When historians say a plague or drought "did something," the agency-talk is a **dispensable metaphor**. It is a narrative shorthand that risks ontological confusion. It implies a subjectivity or a consistent vector of action where there is only blind process. We do not need to grant the plague "agency" to explain its impact; we need only describe the **constraints and affordances** it imposed.

  "Agency" suggests the capacity to initiate action toward an end. The plague had a biological end (replication), but no historical end. By using agency-talk, historians anthropomorphize the constraint, making it seem as though the plague "chose" to undermine serfdom in England. This obscures the actual work of explanation, which lies in the human negotiation of that constraint. We should replace "the plague acted" with "the plague constrained the system such that..." This preserves the causal weight of the non-human without attributing to it a historical intentionality it cannot possess.

  Finally, a historical cause that fits **none of the three roles** (Trigger, Amplifier, Author) is a **Permissive Condition**.

  Consider **the presence of coal deposits in 14th-century England**.
  *   It was not a **Trigger**: It did not set off the Industrial Revolution at that time.
  *   It was not an **Amplifier**: It did not intensify feudal conflicts or economic shifts in the immediate aftermath of the plague.
  *   It was not an **Author**: It did not fix the outcome of the medieval economy.

  The coal was ontologically present and materially real (a non-human fact), yet historically inert for centuries. It is often cited retrospectively as a "cause" of British power, but in the specific episode of the 14th century, it fits none of the active roles. It was a *potentiality* that required a specific human configuration (technology, property rights, demand) to become a cause at all. This demonstrates that non-human materials are not always historical actors; often, they are merely the stage, waiting for a script that may never come. To call them "actors" in such contexts is to project historical necessity onto geological accident.
