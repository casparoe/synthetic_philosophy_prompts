      *   *Idea 2: Coding Competition.* Students write short programs to predict a sequence.
      *   *Idea 3: The "Simulation Lottery".* A game where players are told they might be in a simulation run by other players.
      *   *Idea 4: The "Resource Allocation" Game.* Players allocate resources between "local gain" and "simulator pleasing."

