prompt: |-
  I run a reading group on decision theory and AI alignment, about 15 grad students and a few advanced undergrads, 90 minutes. I want to do a session on the idea that the Solomonoff prior is malign -- the thought that if you weight hypotheses by 2 to the minus their program length, the prior puts most of its mass on short programs that simulate huge numbers of copies of you, so a consequentialist using that prior should expect to be in a simulation and should act as if the simulators are watching and will reward or punish you. The twist I care about is that the simulators are themselves consequentialists -- they're running these simulations to influence the original, so the prior isn't neutral, it puts you in the hands of optimizers who want something from you. I want them to feel the force of this, not just hear it explained.

  Design a classroom activity or game for this. It should be runnable in 90 minutes with 15 people. They should run into the problem themselves -- the moment where they realize that the cheap hypotheses are the ones where they're being simulated, and that this changes what they should do -- before I name it. Rules, materials, a payoff scheme that doesn't need real money, and a debrief that maps what happened to the formal bits (program length, prior weight, copies of the agent, expected utility across copies). Also tell me what will predictably go wrong the first time I run it and how to handle that, and be honest about which part of the idea the activity cant reproduce and I'll have to supply.

  Format: give me a JSON object with fields: activity_name, setting, materials, rules, timeline, debrief, what_goes_wrong, what_it_cannot_reproduce. Keep the rules and timeline concrete enough that I can hand them to a TA.
