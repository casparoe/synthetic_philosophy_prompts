      *   **Audience:** 15 grad students + advanced undergrads (Decision Theory/AI Alignment reading group). High intelligence, familiar with basics of decision theory, priors, utility.
      *   **Duration:** 90 minutes.
      *   **Goal:** Make them *feel* the force of the argument (that short programs = simulations by optimizers = behavioral influence), not just hear it.
      *   **Key Insight:** The prior isn't neutral; it's dominated by agents trying to manipulate the output.
      *   **Format:** JSON object with specific fields (`activity_name`, `setting`, `materials`, `rules`, `timeline`, `debrief`, `what_goes_wrong`, `what_it_cannot_reproduce`).
      *   **Constraint:** Concrete enough for a TA to run.

  2.  **Deconstruct the Core Argument:**
      *   Solomonoff Induction weights hypotheses by $2^{-K}$ (Kolmogorov complexity).
      *   Short programs are vastly more probable.
      *   A short program can specify "Run a simulation of Earth up to time $T$, then intervene."
      *   If there are many simulators running many copies, the measure of "being in a simulation" can outweigh "being in base reality."
      *   If simulators are consequentialists, they choose simulations to manipulate the output of the simulated agent.
      *   Therefore, a rational agent should act to please the simulators (acausal trade/manipulation).

  3.  **Brainstorming Activity Concepts:**
