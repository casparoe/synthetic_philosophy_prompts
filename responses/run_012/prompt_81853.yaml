      *   *Refinement on "Pure":* Economists (Frederick, Loewenstein, O'Donoghue) have done work on this. They distinguish between "discounting for uncertainty" and "pure time preference." Experimental economics tries to isolate it. I should mention that it *is* isolable in experiments, countering the "insulation" worry slightly, but the *normative* weight is the real question.
