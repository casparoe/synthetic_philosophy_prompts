prompt: |-
  I run pricing for a small specialty insurer — we write the weird end of the market, event cancellation, drone operators, niche liability, that sort of thing. Team of four, and I'm the one who signs the rate, so when we disagree about a number it lands on my desk. The fight we have every single week is about the reference class. Someone pulls a broad number (all commercial aviation, all cyclists, all small contractors), someone else pulls a narrow one (this exact aircraft type, this exact city, this exact occupation), the two numbers differ by a factor of five, and we end up arguing about whose class is "the right one" until I just pick. I want to stop doing that by vibes.

  So: write me a decision procedure my team can actually run, in order, before we quote. It should be the kind of thing a junior analyst can follow without having read any philosophy — keep whatever the reference-class problem actually teaches, drop the parts that don't survive being made operational, and tell me honestly where the procedure is just dressing up a judgment call. Specifically I want the ordered questions, what counts as a good enough answer to each, where the procedure stops and says no, and where it hands the decision to me personally because it's a values or risk-appetite call rather than a facts call.

  Two things I want baked in, because they're our actual constraints. First, we have to be able to defend the class we chose to a regulator after a claim goes bad, so the procedure has to make us pick the class before we compute the number and record the alternatives we rejected and what they would have given — no peeking at the answer and then choosing the class that fits. Second, we almost never have enough data in the narrow class, so the procedure has to say what to do when the most specific class you'd like is too thin to trust, rather than just defaulting to the broad one or the narrow one.

  Then run it on three cases and show your work:

  1. A life/disability quote for one specific 52-year-old commercial helicopter pilot, 4,000 hours, no incidents. Broad class is all commercial pilots; narrow is helicopter pilots of that type in that region.

  2. A brand-new risk we've never written: a company flying drones to inspect rooftop solar in a hail-prone metro. There is basically no loss history for this. Broad-ish proxies exist (small aircraft, roofers, general commercial liability) and they disagree a lot.

  3. The one I expect to hate. A cargo-bike courier fleet in a city that just banned most cars downtown. The historical bike-accident data says cheap; the argument that the ban changes everything says expensive. I want to know what the procedure makes us do here even if the answer is "we can't responsibly price this" or "load a margin so big sales walks."

  Be committed — give me one procedure with a definite ordering and defend the ordering, don't hand me a menu of approaches and let me choose. Where you genuinely can't decide between two orderings, say which you'd pick anyway and why.

  Format it like this. Give me the procedure first as a table with these columns: Step number, The question to ask, What counts as a good enough answer, Where it goes if the answer isn't there (next step, stop, or hand to a human). Then, for each of the three cases, a JSON object with these fields: case (short name), classes_considered (a list, each with name, estimate, and data_size), class_chosen, rate_or_range, confidence (low/medium/high and one clause why), judgment_calls (list of the points where the procedure couldn't decide it for you), and what_would_move_it (what new evidence or data would change the choice). Finish with a short plain paragraph on what this procedure cannot do — the places it will misfire or where it's just laundering my risk appetite as math.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Pricing lead at a small specialty insurer (weird risks: event cancellation, drones, niche liability).
      *   **Problem:** Constant internal fights about "reference classes" (broad vs. narrow). Numbers differ by factor of 5. Current process is "vibes" + boss picks.
      *   **Goal:** A concrete, ordered decision procedure for the team (including juniors) to run *before* quoting.
      *   **Constraints:**
          1.  Must be defensible to a regulator (pick class *before* seeing the rate, record rejected alternatives).
          2.  Data is usually thin in narrow classes (need a method to handle sparsity, not just default to broad/narrow).
          3.  Must be honest about where it's just a judgment call dressed up.
          4.  Must run on three specific cases (Helicopter Pilot, Drone Solar Inspection, Cargo-Bike Courier).
          5.  Format: Table for procedure, JSON for cases, plain paragraph for limitations.
          6.  Tone: Committed, operational, no philosophy jargon, definite ordering.

  2.  **Deconstruct the Reference Class Problem for Insurance:**
      *   The core tension is Bias-Variance Tradeoff.
      *   *Broad Class:* Low variance (lots of data), High Bias (might not apply to *this* risk).
      *   *Narrow Class:* Low Bias (very specific), High Variance (little data, unstable rates).
      *   *Regulatory Requirement:* Consistency and documentation. You can't cherry-pick the class that gives the price you want.
      *   *Operational Need:* A flowchart that forces data evaluation before rate calculation.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Step 1: Define the Risk.* What are we actually pricing? (Prevents moving goalposts).
      *   *Step 2: Identify Candidate Classes.* List Broad, Medium, Narrow.
      *   *Step 3: Data Sufficiency Check.* This is crucial for Constraint #2. How much data is "enough"? Need a threshold (e.g., exposure count or claim count).
      *   *Step 4: Homogeneity Test.* Does the narrow class actually behave differently? If narrow data looks the same as broad data, use broad (parsimony). If it looks different and has enough data, use narrow.
      *   *Step 5: Stability Check.* Is the risk changing? (Constraint for Case 3).
      *   *Step 6: Selection & Documentation.* Pick the winner, record the losers.
      *   *Step 7: Escalation.* If data is missing or risk is structural (Case 3), hand to the Lead (User).

      *Refining the Ordering:*
      *   Must define classes *before* looking at loss ratios (Constraint #1).
      *   Must check data volume *before* checking predictive power.
      *   Must check for structural breaks (new laws/tech) *before* finalizing.
      *   *Decision:* I need to force the "Blind Selection" aspect. They define the classes based on risk characteristics, *then* check data, *then* pick. They cannot look at the resulting premium to pick the class.

      *Handling Thin Data (Constraint #2):*
      *   If Narrow < Threshold, do not use Narrow alone.
      *   Use Credibility Weighting (Z-factor) or Hierarchical Modeling. But since this is a procedure for analysts, keep it simple: "If Narrow < Threshold, merge up to Medium unless Narrow shows extreme deviation."
      *   Actually, a better operational rule: "Minimum Claim Count." If < 50 claims (or equivalent exposure), class is statistically unreliable.
      *   *Rule:* If Narrow is unreliable, default to the *broadest reliable class* unless there is a known *qualitative* reason for deviation (which triggers escalation).

      *Honesty about Judgment:*
      *   The procedure must explicitly flag where the human decides. This is usually when data is absent or the environment has shifted (Case 3).

  4.  **Developing the Three Cases:**

      *   **Case 1: Helicopter Pilot.**
          *   Broad: All Commercial Pilots. (Huge data, low relevance).
          *   Medium: Helicopter Pilots. (Good data).
          *   Narrow: 52yo, 4k hours, Region X. (Tiny data).
          *   *Outcome:* Medium is likely the sweet spot. Narrow is too thin. Broad is too biased.
          *   *Judgment:* Credibility weighting between Medium and Narrow features (hours/age).

      *   **Case 2: Drone Solar Inspection.**
          *   Broad: General Liability / Small Aircraft.
          *   Narrow: Drone Solar. (Zero data).
          *   *Outcome:* No valid reference class.
          *   *Action:* Escalate to Lead. Use proxy + load.
          *   *Judgment:* All of it.

      *   **Case 3: Cargo-Bike Courier (City Ban).**
          *   Broad: All Cyclists.
          *   Narrow: Cargo Bikes in City X.
          *   *Issue:* Structural break (Car ban). Historical data is poisoned.
          *   *Outcome:* Procedure should flag "Environmental Change."
          *   *Action:* Escalate. Historical data is invalid.
          *   *Judgment:* Assessing the impact of the ban.

  5.  **Refining the Procedure Table:**
      *   Need to ensure the "Blind" constraint is met.
      *   Step 1: Define Risk Attributes.
      *   Step 2: Propose 3 Classes (Broad, Target, Narrow).
      *   Step 3: Check Data Volume (Minimum Exposure/Claims).
      *   Step 4: Check Stability (Has the risk environment changed?).
      *   Step 5: Select Class based on Hierarchy (Narrow if stable + sufficient, else Target, else Broad).
      *   Step 6: Record Rejected Classes (for Regulator).
      *   Step 7: Escalation Trigger (If Stability fails or Data is zero).

      *Self-Correction on Ordering:*
      *   If I let them check stability *after* data volume, they might skip a class because it's volatile.
      *   Better: Define Classes -> Check Stability (is history relevant?) -> Check Volume (is history enough?) -> Select.
      *   *Crucial Add:* The "Look-Ahead" prohibition. They must log the classes *before* running the rate engine.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Direct, slightly cynical but professional, acknowledging the "vibes" problem.
      *   *Format:* Strictly follow the requested Table -> JSON -> Paragraph structure.
      *   *JSON:* Ensure all fields are present (`case`, `classes_considered`, `class_chosen`, `rate_or_range`, `confidence`, `judgment_calls`, `what_would_move_it`).
      *   *Limitations:* Be honest. This doesn't solve the lack of data. It just organizes the ignorance.

  7.  **Final Review against Constraints:**
      *   *Defensible to Regulator?* Yes, requires logging rejected classes *before* calculation.
      *   *Thin Data?* Yes, includes minimum volume thresholds and credibility rules.
      *   *Honest about Judgment?* Yes, escalation steps explicitly mark where math stops.
      *   *Three Cases?* Yes, Helicopter, Drone, Bike.
      *   *Format?* Table, JSON, Paragraph.

  8.  **Final Polish:**
      *   Make sure the "Step 4" in the procedure handles the "factor of five" problem. The rule should be: If Narrow data exists but is < Threshold, do not use it as a standalone rate. Use Broad/Medium adjusted by *qualitative* factors (which requires Lead approval).
      *   Actually, for a junior analyst procedure: If Narrow < Threshold, *automatically* step up to the next broader class that meets the threshold. This removes the "vibe" choice. The "vibe" comes in if they want to *deviate* from that, which triggers escalation.
      *   Let's refine the "Stability" check. If the world changed (Case 3), history is useless. That must be an early gate.

      *(Self-Correction during drafting the table)*: I need to make sure the "Stop/Hand to Human" column is clear.
      *(Self-Correction on JSON)*: Ensure `rate_or_range` reflects the uncertainty (e.g., "Range" for high uncertainty).

      *Let's write it.*
answer: |-
  ### The Reference Class Protocol (RCP)

  This procedure forces you to define *what* you are measuring before you measure it. It prevents cherry-picking by requiring you to log rejected classes before seeing the final premium. It handles thin data by enforcing minimum volume thresholds and escalating structural breaks to the Lead (you).

  | Step | The Question to Ask | What Counts as a Good Enough Answer | Where it Goes if the Answer Isn't There |
  | :--- | :--- | :--- | :--- |
  | **1** | **Define the Risk Attributes.** List the 3-5 specific features of this submission (e.g., aircraft type, region, pilot hours, regulatory environment). | A written list of attributes agreed upon by two team members before opening the rate engine. | **Stop.** Do not proceed until attributes are written down. This prevents moving goalposts later. |
  | **2** | **Propose Three Classes.** Based *only* on Step 1, define a Broad, a Target, and a Narrow class. | **Broad:** Industry standard (e.g., "All Commercial Aviation").<br>**Target:** Our usual underwriting bucket (e.g., "Helicopter Charter").<br>**Narrow:** The specific risk features (e.g., "Helicopter Type X in Region Y"). | **Stop.** You cannot calculate a rate until three classes are named. |
  | **3** | **Check Stability (The "Broken World" Test).** Has the risk environment changed materially in the last 24 months? (New laws, tech shifts, climate events). | **Yes:** History is relevant.<br>**No:** History is suspect/poisoned. | **Hand to Human.** If "No," historical data is invalid. Escalate to Lead for subjective loading. |
  | **4** | **Check Volume (The "Thin Data" Test).** Does the Narrow class have sufficient exposure/claims? | **Pass:** ≥50 claims (or equivalent exposure years) in last 5 years.<br>**Fail:** <50 claims. | **Next Step.** If Narrow fails, discard Narrow. Move to Target class. If Target fails, move to Broad. |
  | **5** | **Select the Class.** Pick the narrowest class that passed Step 3 (Stability) and Step 4 (Volume). | The specific class name from Step 2. | **Next Step.** This is your binding choice for the quote. |
  | **6** | **Log the Rejections.** Record the classes you *didn't* pick and their indicative rates (if known) or why they failed. | A log entry: "Rejected Narrow due to Volume < 50. Rejected Broad due to high bias." | **Next Step.** This is your regulatory defense file. |
  | **7** | **Calculate & Review.** Run the rate. Does the result fall within expected bounds for the *chosen* class? | **Yes:** Quote.<br>**No:** (e.g., rate is 5x class average). | **Hand to Human.** If the rate deviates >50% from the class mean, the risk features need manual loading/unloading. Escalate to Lead. |

  ***

  ### Case Runs

  ```json
