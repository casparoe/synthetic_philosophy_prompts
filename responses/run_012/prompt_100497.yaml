          "data_size": "12 claims (Fail)"
        }
      ],
      "class_chosen": "Target: Helicopter Charter Pilots",
      "rate_or_range": "1.2 * Base Rate X (with credit for 4k hours)",
      "confidence": "Medium (Data is sufficient, but individual merit rating requires judgment)",
      "judgment_calls": [
        "Step 7: Applying a specific credit for 4,000 incident-free hours is not in the class table; requires manual loading decision."
      ],
      "what_would_move_it": "If the pilot had <1,000 hours, we would revert to the Base Rate without credit. If we acquire 5 more years of data on Type X, Narrow class might pass Step 4."
    },
    {
