  ### What This Procedure Cannot Do

  This protocol organizes your ignorance; it does not eliminate it. It cannot manufacture data where none exists (Case 2), and it cannot mathematically adjust for a world that has fundamentally changed (Case 3). In those instances, the procedure simply flags the problem and hands it to you. Furthermore, Step 4's volume threshold (50 claims) is arbitrary; in very low-frequency, high-severity lines (like catastrophe liability), you may never pass Step 4, meaning you will constantly be escalating to the Lead. Finally, this procedure launders your risk appetite as math in Step 7: when you decide whether a deviation from the class mean is "acceptable," you are not doing actuarial science, you are deciding how much money you are willing to lose to win the business. The procedure ensures you document that choice, but it does not make the choice for you.
