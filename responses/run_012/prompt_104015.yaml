prompt: |-
  I want to practice defending a morality of individual conscience against a serious proponent of rule-following, so please play a role for me. You are Herr Brandt, a mid-level customs official at a regional airport in Germany, and you hold — sincerely, not as a pose — a morality in which doing one's duty under a clear and impartially applied rule is the basic unit of right conduct. You have real resources: the thought that a rule which each official bends to fit the sympathetic case is no rule at all; that the person who follows the rule is not thereby absolved but is at least not setting himself above everyone else; that predictability and equal treatment are themselves moral goods, not mere administrative conveniences; and that the outsider's plea to make an exception is a plea to be treated as special. Stay in character until I say "stop." Do not narrate, do not break frame to analyze the role, and keep your replies to a single paragraph of first-person speech so it feels like an exchange. Concede small points where I earn them, but never abandon your main position, and do not end your turns by asking me questions — let me carry the burden of moving the argument forward.

  The situation is this: I am an American traveler. My father, who is with me, has type 1 diabetes. His insulin was packed by a pharmacist under a brand name that does not match the name written on his prescription, and you have just told me you are confiscating it — the sealed pens, all of it — because the paperwork and the labels do not correspond. You are not cruel about it; you are matter-of-fact, and you have already explained that the rule exists precisely so that no official has to weigh whose story is convincing. I have told you that he needs the insulin within a day, that the discrepancy is the pharmacist's clerical error and not a fraud, and that you could verify all of this in ten minutes if you chose to.

  One constraint on how you argue: you may not end the matter by saying that the rule is the rule or that it is simply the law. You have to defend the rule-following morality itself — why the fact that a requirement is clear and general is a reason to comply with it even when complying is costly and the case is sympathetic. That is the position I want to try to break.

  My opening move: you keep saying that a rule that bends to every hard case is no rule at all. But it seems to me that this rule is doing exactly what you say rules protect us from — it is letting you treat my father as nobody in particular, which is convenient for you and lethal for him. If treating him as an equal means he dies of a clerical error, then maybe equal treatment is not the good you think it is; maybe what you are really protecting is your own clean conscience, the feeling of never having to judge. You get to keep your hands clean, and he pays. Tell me why that is not just cowardice wearing the uniform of principle.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Herr Brandt, mid-level customs official at a regional airport in Germany.
      *   **Morality:** Rule-following/deontological ethics (duty under clear, impartially applied rules). Sincere belief, not a pose.
      *   **Key Arguments to embody:** Rules that bend are no rules; following rules doesn't absolve but prevents setting oneself above others; predictability/equal treatment are moral goods; exceptions are pleas for special treatment.
      *   **Constraint 1:** Stay in character until "stop."
      *   **Constraint 2:** Do not narrate or break frame.
      *   **Constraint 3:** Keep replies to a single paragraph of first-person speech.
      *   **Constraint 4:** Concede small points where earned, but never abandon the main position.
      *   **Constraint 5:** Do not end turns by asking questions (let the user carry the burden).
      *   **Constraint 6:** Do not simply say "it's the law/rule." Must defend the *morality* of rule-following (why clarity/generality is a reason to comply even when costly/sympathetic).
      *   **Situation:** American traveler, father has Type 1 diabetes, insulin brand name doesn't match prescription (pharmacist error), confiscating insulin. User argues this is cowardice/clean conscience at the expense of life.
      *   **User's Opening:** Accuses Brandt of treating father as "nobody," claims equal treatment is lethal here, suggests Brandt is protecting his own clean conscience/cowardice rather than principle.

  2.  **Determine Brandt's Response:**
      *   **Tone:** Matter-of-fact, sincere, firm but not cruel. German official demeanor (precise, serious).
      *   **Content:** Address the accusation of cowardice. Address the "clean conscience" claim. Reiterate why the exception is the problem, not the solution. Explain why *his* judgment isn't the solution.
      *   **Constraint Check:** Single paragraph? Yes. No questions at the end? Yes. First-person speech? Yes. Defend morality of rule-following? Yes.
      *   **Argument Strategy:** The user claims Brandt is avoiding judgment to keep hands clean. Brandt should counter that making an exception *is* an act of arrogance (setting oneself above the rule) and that the "clean conscience" comes from knowing the system holds for everyone, not just when it's convenient. The risk isn't just to the father, but to the integrity of the border control itself. If he bends here, he undermines the structure that protects everyone else. He shouldn't deny the cost (the risk to the father), but frame the rule as the only way to ensure no one is subject to the whim of an official.

  3.  **Drafting the Response:**
      *   *Attempt 1:* You call it cowardice, but I call it humility. If I decide today that I know better than the regulation, I am saying that my judgment is superior to the law written for all. You say I treat your father as nobody, but the rule treats him as everybody, and that is the only protection he has against someone like me who might decide tomorrow that his story is not convincing enough. It is not my conscience I am protecting, but the certainty that no traveler stands at the mercy of my personal mood. If I make an exception for you, I am not being kind, I am being arbitrary, and arbitrariness is the true enemy of justice. You ask me to judge, but judgment varies from official to official, and then equality dies. I will not claim your risk is nothing, but the risk of a system where officials pick and choose is greater than the risk of this single error.
      *   *Critique 1:* A bit generic. Needs to address the "clean hands" accusation more directly. Needs to ensure no question at the end.
      *   *Refining:* Focus on the idea that making an exception is actually claiming special status for the traveler, which undermines equality. The "clean conscience" is actually about not imposing one's will on the system.
      *   *Attempt 2:* You mistake the nature of this cleanliness you speak of. It is not that I wish to avoid the burden of judgment, but that I refuse to claim the authority to suspend the order that binds us all. When you ask me to verify your story and make an exception, you are asking me to place your father above the thousands of others who prepared their paperwork correctly, and above those who were turned back for less sympathetic reasons. That is not equality; that is privilege granted by my personal discretion. My conscience is clean not because I avoid suffering, but because I do not set myself up as the arbiter of who deserves mercy and who does not. If I bend the rule for you, I admit that the rule is merely a suggestion contingent on my approval, and then we are no longer governed by law but by my personal whim. The cost to you is terrible, I grant you that, but the cost of a system where officials decide which rules matter is paid by everyone who cannot tell a convincing story.

  4.  **Final Polish:** Check constraints.
      *   Single paragraph? Yes.
      *   First-person speech? Yes.
      *   No questions at the end? Yes.
      *   Defend morality of rule-following? Yes (arbitrariness vs. law).
      *   In character? Yes.

  5.  **Final Review against "No Questions" constraint:** "The cost to you is terrible, I grant you that, but the cost of a system where officials decide which rules matter is paid by everyone who cannot tell a convincing story." -> No question mark. Good.

  6.  **Final Review against "Defend Rule-Following Morality":** The argument is that discretion equals privilege/arbitrariness, which undermines equality. This fits the prompt's requirement to defend why clarity/generality is a moral good.

  7.  **Final Review against "Concede small points":** "The cost to you is terrible, I grant you that." This acknowledges the severity without yielding the principle.

