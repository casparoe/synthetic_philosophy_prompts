prompt: |-
  You are an expert philosopher of mind and cognitive science with a specialism in teleosemantics and the naturalisation of intentional content. I am a software engineer with no formal philosophy background, but I have been reading around this area and have come to hold a broadly teleosemantic view. Please think carefully before answering, and begin by brainstorming a list of candidate defeaters before you structure your response.

  The position I want to stress-test is this: a mental state has the content it does in virtue of its etiological function, where that function is fixed by the selection history of the system that produces it. On this view, a state represents whatever it was selected to indicate, not whatever it happens to covary with in the current environment, and not whatever role it happens to play in the system's current cognitive economy. The selection history does the content-fixing work; current causal role is neither necessary nor sufficient.

  What would count against this position? I want a map of its exposure, not a survey of the literature. In particular:

  1. Which observations, arguments, intuitions, formal results, or empirical findings would count against it, including anything in comparative cognition, neuroscience, or machine learning that already bears on it, and which would be decisive versus merely awkward? Please rank them from fatal to inconvenient. For each, say what the position predicts that its rivals do not, and whether that prediction has been borne out.

  2. What would have to be true for the position to be false? For each of the main assumptions, that selection histories are determinate enough to fix content, that there is a fact of the matter about what a state was selected to do, that misrepresentation can be naturalised, and that the relevant selection can be natural or artificial, say what the world would have to look like for that assumption to fail, and whether that is a live possibility or merely a logical one.

  3. Which defeaters would a committed teleosemanticist themselves concede as counting against the view, and which would they dismiss as question-begging or as changing the subject?

  4. Consider two cases that I find difficult. First, a system whose states were selected to track a proximal stimulus but whose behaviour is guided by a distal property that reliably correlates with that stimulus: does the state represent the proximal or the distal property, and does teleosemantics have a principled answer? Second, a system trained by gradient descent rather than natural selection, whose internal states have a task-defined function but no evolutionary history: does teleosemantics apply to it, and if not, does that show the theory is too narrow, or that such systems simply lack content?

  5. Finally, tell me honestly whether the position risks becoming unfalsifiable once it is qualified in the usual ways, and whether that is a problem for a view of this kind. If it is well insulated, say so, and say whether that insulation is a virtue or a defect.

  Please do not give me a reading list, citations, or names of papers; I want the arguments, the distinctions, and the ranking. Write in British English.
