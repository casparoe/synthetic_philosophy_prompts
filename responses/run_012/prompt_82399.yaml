  *Repair Strategy:* Fix the 3 Complement Pairs first (Averaging). This guarantees improvement on those 3 pairs.
  *Does it guarantee global improvement?* Yes, because Brier score is additive across items. If I improve the score for pair (1,4), and (2,5), and (3,6), the total sum improves.
  *Does fixing the pairs violate the subset constraint?* Possibly. But the *score* will still improve because the complement fix is the orthogonal projection for the *complement constraint*. The subset constraint is a different hyperplane.
  *Okay, this is safe enough for a demo.* I will instruct the Audit to prioritize Complement Pairs.

  *Final check on Linear Score:*
  Linear Score $S = \sum c_i v_i$.
  If I have $P(A)=0.4, P(\neg A)=0.4$. Sum=0.8.
  World A: Score 0.4. Repair (0.5, 0.5): Score 0.5. (Repair wins).
  World Not-A: Score 0.4. Repair (0.5, 0.5): Score 0.5. (Repair wins).
  *Wait, does dominance hold for Linear Score?*
  If the score is linear, the "accuracy" is just expected payoff.
  If I am incoherent, am I dominated?
  De Finetti's Dutch Book theorem says I am susceptible to a sure loss *bet*.
  But here we are scoring *accuracy*, not betting.
  With Linear Scoring, the optimal strategy is to report 1 for the most likely outcome and 0 for others (if proper). But Linear is *improper*.
  If the rule is "Pay $c$ if true", I should always report $c=1$ for everything.
  If I report $c=1$ for everything, I am incoherent (Sum = 6).
  But I get max score (6) in every world.
  So under Linear Scoring, *Coherence does not dominate Incoherence*. In fact, extreme Incoherence might win.
  *This confirms the User's hunch.* The dominance argument *collapses* with Linear Scoring. This is a great teaching moment.

  *Okay, ready to write.*
answer: |-
  Here is a frank assessment and a runnable design.

  ### The Hard Truths (Read Before Planning)

  1.  **The Math Risk:** You are correct to worry about the "repair." The theorem (Joyce 1998 / De Finetti) guarantees that *there exists* a coherent set that dominates. It does **not** guarantee that *any* coherent repair dominates. To guarantee dominance, the repair must be the **orthogonal projection** of the incoherent credences onto the space of coherent functions.
      *   *For Complement Pairs ($P(A) + P(\neg A) = 1$):* The projection is simple averaging. If $P(A)=0.7, P(\neg A)=0.4$ (Sum 1.1), setting both to $0.55$ is the dominating repair. This is calculable.
      *   *For Conjunctions/Disjunctions:* The projection is complex optimization. If a student writes $P(A)=0.5, P(B)=0.5, P(A \land B)=0.1$ (violation of bounds), there is no simple "crib sheet" arithmetic to find the *dominating* fix without a solver.
      *   *Solution:* I have designed the 6 items below to rely primarily on **Complement Pairs**. This allows a simple "Averaging Rule" that *mathematically guarantees* local dominance, which sums to global dominance for the score. I have stripped out complex additivity constraints that require calculus to repair manually.

  2.  **The Time Risk:** 14 students calculating 6 squared errors each, twice (original vs. repair), is 168 calculations. Even with phones, this eats 20 minutes.
      *   *Solution:* Use a **Score Grid** handout. They only calculate the difference for the items that changed. Or, better: The Facilitator calculates the "Control" score (Coherent baseline) on the whiteboard, and students only calculate their own delta. *Actually, for the feeling of "audit," they must score the sheets.* I have allocated 20 minutes for this. Use phone calculators.

  3.  **The "Feeling" Risk:** You worry this shows an *auditor* can fix the sheet, not that the *agent* is irrational.
      *   *Solution:* The debrief must hammer the **Counterfactual**. "Before the die was rolled, could you have swapped your sheet for the repaired one and guaranteed a better result?" If yes, your original sheet was a worse tool for your own goal.

  4.  **The Linear Score Hunch:** You are right. Under a linear scoring rule (Pay $c$ if true), the dominance argument collapses. In fact, extreme incoherence (assigning 1 to everything) often yields the highest linear score. This is the perfect contrast to prove that **Propriety** (the shape of the scoring rule), not just "Accuracy," is doing the work.

  ---

  ### Session Design: The Accuracy Audit

  **Time:** 90 Minutes
  **Materials:**
  *   14 "Credence Sheets" (6 items + name).
  *   14 "Audit Kits" (Crib sheet + Score Grid + Pen).
  *   1 Tampered Die (weighted, or just pre-rolled results on board).
  *   Whiteboard.
  *   Projector: **None** (as requested).

  #### 1. The Six Items (Designed for Manual Repair)
  To ensure the "Averaging Repair" works, we need 3 Complement Pairs. We will dress them up to look like conjunctions/disjunctions as requested, but the logical *repair* relies on the complementarity.

  1.  **The die shows an Even number** ($E$)
  2.  **The die does not show an Even number** ($\neg E$)
  3.  **The die shows a Low number (1, 2, or 3)** ($L$)
  4.  **The die shows a High number (4, 5, or 6)** ($\neg L$)
  5.  **The die shows a 2 or a 4** ($E \land L$) — *Note: This is "Even and Low"*
  6.  **The die does not show a 2 or a 4** ($\neg (E \land L)$)

  **The Links:**
  *   Items 1 & 2 must sum to 1.
  *   Items 3 & 4 must sum to 1.
  *   Items 5 & 6 must sum to 1.
  *   *(Hidden Link)*: Item 5 must be $\le$ Item 1 and $\le$ Item 3. (We will ignore this for the repair to keep arithmetic simple, but note it in debrief).

  #### 2. The Crib Sheet (For the Auditor)
  *Print this on the back of the Audit Kit.*

  > **REPAIR PROTOCOL**
  > You are not guessing the die. You are fixing the math.
  > Check the three pairs: **(1+2)**, **(3+4)**, **(5+6)**.
  >
  > **The Rule:** For any pair that does not sum to exactly 1.0:
  > 1. Add the two numbers together.
  > 2. Divide by 2.
  > 3. Write this new number for **BOTH** items in the pair.
  >
  > *Example:* If Item 1 is 0.7 and Item 2 is 0.2 (Sum 0.9).
  > Repair: $0.9 / 2 = 0.45$. Write 0.45 for Item 1 AND Item 2.
  >
  > **Why?** This moves the credences the shortest distance to coherence. It guarantees a better Accuracy Score regardless of the die roll.

  #### 3. Timeline & Facilitation

  **0:00 – 0:10 | Setup & Context**
  *   **Board:** Write the 6 Item descriptions clearly.
  *   **Board:** Write the 20 pre-rolled results (to prove the die is tampered/empirical, not 1/6).
  *   **Script:** "We are measuring accuracy. Your goal is to minimize your Brier Score: Sum of (Credence - Truth)². Truth is 1 if it happened, 0 if not. Lower score = better."
  *   **Handout:** Credence Sheets.
  *   **Instruction:** "Assign a credence (0 to 1) to each item. Do not discuss. You have 5 minutes."

  **0:10 – 0:20 | Collection & Redistribution**
  *   Collect sheets. Shuffle. Redistribute randomly.
  *   **Crucial:** Ensure no one gets their own sheet. (With 14 people, this is easy).
  *   **Handout:** Audit Kits (Crib Sheet + Score Grid).
  *   **Script:** "You are now an Auditor. You do not care about the original author's 'opinion.' You care about the score. Use the Crib Sheet to repair any incoherent pairs. Write the new numbers in RED."

  **0:20 – 0:40 | The Audit (High Friction Zone)**
  *   **Task:** Auditors check the sums. Apply the Repair Rule.
  *   **Facilitator Role:** Circulate. If someone struggles with the arithmetic, help them. If someone says "But this isn't what they believe," say: "We are testing the *tool*, not the *user*."
  *   **Time Check:** If this drags past 20 mins, cut the scoring phase short and do it on the board for 3 examples.

  **0:40 – 0:55 | The Roll & Score**
  *   **Roll:** Roll the die once. (e.g., Result = 2).
  *   **Board:** Write the Truth Values for all 6 items.
      *   2 is Even (1), Not-Even (0).
      *   2 is Low (1), High (0).
      *   2 is "2 or 4" (1), Not (0).
  *   **Scoring:** Everyone calculates the Brier Score for the **Original** (Black) and the **Repair** (Red).
      *   *Formula:* $(c - v)^2$. (e.g., if $c=0.7, v=1$, score is $0.3^2 = 0.09$).
      *   Sum the 6 items.
  *   **Comparison:** Who won? (Repair should win or tie for almost everyone).

  **0:55 – 1:05 | Round 2: The Linear Contrast**
  *   **Script:** "Let's change the goal. New Rule: You get paid $1 \times your\ credence$ if the item is True. $0$ if False. Maximize your payout."
  *   **Task:** Everyone looks at their *Original* sheet again. Calculate the Linear Score for Original vs. Repair.
  *   **Expected Result:** The Repair advantage will vanish. Some Originals might win. (Because Linear scoring rewards extremizing, which coherence penalizes).
  *   **Point:** This proves the dominance argument relies on the *Quadratic* (Proper) nature of the score, not just "wanting to be right."

  **1:05 – 1:30 | Debrief (The Philosophy)**
  *   See script below.

  ---

  ### The Debrief Script (Mapping Activity to Theory)

  **1. The "Luck" Objection**
  *   *Ask:* "Did the Repair win because the Auditor got lucky with the die roll?"
  *   *Answer:* No. The Repair was calculated *before* the roll. The math (Averaging) reduces the distance to *both* 0 and 1. It wins whether the die is Even or Odd.
  *   *Takeaway:* This is **Dominance**, not Expected Utility. It's not a good bet; it's a better map.

  **2. The "Interference" Objection**
  *   *Ask:* "Is it fair to change someone's numbers? Maybe they had a reason."
  *   *Answer:* If their goal was Accuracy (Brier Score), the Repair is strictly better. If they refuse the Repair, they are prioritizing something else (e.g., 'sticking to my gut') over Accuracy.
  *   *Takeaway:* Probabilism isn't an external rule imposed on you. It's the internal requirement of wanting to be accurate. To be incoherent is to sabotage your own goal.

  **3. The Linear Score Contrast**
  *   *Ask:* "Why did the Repair stop winning in Round 2?"
  *   *Answer:* Linear scoring is **Improper**. It encourages you to say 100% confidence always. Coherence stops you from doing that.
  *   *Takeaway:* The Accuracy Argument for Probabilism only works if Accuracy is measured by a **Strictly Proper Scoring Rule** (like Brier/Quadratic). This distinguishes it from Dutch Book arguments (which are about money/bets).

  **4. Limitations (Intellectual Honesty)**
  *   *Admit:* "We only fixed Complement pairs. Real logic has conjunctions and entailments ($P(A) \le P(B)$). Fixing those requires harder math, but the theorem still holds: *some* coherent repair always exists."
  *   *Admit:* "This shows you *could* improve. It doesn't prove you *knew* how. But rationality requires you to use the best means available to your ends."

  ---

  ### Predictable Failures & Mitigations

  1.  **The "Boring" Coherent Sheet:**
      *   *Prediction:* One student sums everything to 1 perfectly.
      *   *Mitigation:* They are the **Control Group**. In the debrief, highlight them: "Look, their Original and Repair are identical. They didn't get 'lucky,' they were already optimal."

  2.  **The "Refusal" to Repair:**
      *   *Prediction:* "I won't change their numbers, it's disrespectful."
      *   *Mitigation:* Reframe: "You aren't correcting *them*. You are simulating a *better version* of them. If you could have handed them this sheet before the roll, would they have wanted it?"

  3.  **Arithmetic Bottleneck:**
      *   *Prediction:* Squaring decimals takes too long.
      *   *Mitigation:* Allow phones. Provide a "Square Table" on the handout (0.1²=0.01, 0.2²=0.04... 0.9²=0.81) so they don't have to calculate squares, just look them up.

  4.  **The "Entailment" Glitch:**
      *   *Prediction:* A student repairs the pairs but creates a violation where $P(2 \lor 4) > P(Even)$.
      *   *Mitigation:* Acknowledge this in debrief. "We fixed the Additivity violations. We left the Entailment violations. The Repair still won because the Additivity error was the biggest penalty. A full repair would fix both."

  ### What This Cannot Do (Be Straight)

  1.  **It doesn't prove you *must* be probabilistic.** It proves that if you want Accuracy (Brier), you *should* be. If someone says "I don't care about Brier Score," the argument doesn't touch them. (This is the "Why care about accuracy?" objection, which is outside the scope of this session).
  2.  **It doesn't handle Updating.** This is static calibration. It doesn't show how to move from $P(A)$ to $P(A|E)$.
  3.  **It relies on the Specific Score.** If a philosopher argues Brier Score isn't the *true* measure of accuracy, the dominance claim weakens. (Though Brier is the standard proxy).
  4.  **It feels like a Game.** Some students may treat it as a puzzle to win rather than a normative claim about belief. The debrief must bridge this gap explicitly.

  ### Final Recommendation on the "Feeling"
  You cannot make them *feel* irrationality in 90 minutes. You can only make them feel **regret**.
  The key moment is when they see the Repair score.
  Ask them: *"Knowing what you know now, if you could go back 40 minutes and swap your sheet for the Red one, would you?"*
  If they say **Yes**, they have admitted their original credences were instrumentally inferior for their own stated goals. That is the definition of the irrationality the accuracy argument targets. Stick to that. Don't overclaim.
