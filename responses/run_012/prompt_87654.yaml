answer: |-
  **TO:** Model Deployment Review Committee
  **FROM:** [Your Name], Philosophy & Safety
  **DATE:** [Current Date]
  **SUBJECT:** Validation Standard for Activation-Based Monitors

  I recommend we adopt the three-test validation standard for representation-based monitors immediately and reject the current vulnerability monitor's guardrail trigger unless it satisfies these criteria by Thursday morning.

  The legal team is correct that asserting a model holds a "representation" invites indefensible mental-state attribution claims, but the safety team is also correct that guardrails require more than spurious correlation. This standard bridges that gap by defining "representation" functionally for deployment purposes: we treat a direction as a representation only if the model demonstrably uses it to process information, not merely because it predicts our labels. To qualify, a direction must meet three conditions: it must be derived via unsupervised methods (variance, clustering) rather than supervised probes; it must pass causal intervention tests (patching or ablating the direction changes behavior predictably); and it must generalize to held-out contexts and tasks not used during discovery.

  We must be clear about what this standard concedes. It is operationalist by design; it does not prove the model possesses intentional states or genuine understanding, only that the activation direction plays a specific causal role in the model's computation. Furthermore, this bar is strict enough that we may fail to deploy guardrails for some genuine representations that are causally inert or highly context-specific. We are accepting the risk of false negatives to mitigate the liability and user-trust risks of false positives—acting on artifacts that correlate with vulnerability without actually tracking it.

  Regarding the current monitor: the Interpretability team must run these three tests before the vote next Thursday. If the direction passes all three, we approve the guardrail trigger. If it passes only the unsupervised and causal tests, we classify it as a useful correlate; it may remain active for logging and observability but cannot trigger safety interventions. If it fails the causal test, it must not ship. The Interpretability Lead is responsible for executing these validations and presenting the results by 9:00 AM Thursday.
