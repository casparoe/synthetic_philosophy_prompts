answer: |-
  # Diagnostic Decision Tree: The Logical Space of Alignment

  **Root Commitment:** All participants agree there is a non-trivial cluster of issues regarding the relationship between advanced AI systems and human interests, currently labelled "the alignment problem."

  ### I. Is the problem well-posed?
  *   **A. No.** The term "alignment" masks a category error, a power struggle, or a confusion about agency. It should be dissolved or replaced.
      *   **Leaf 1: Conceptual Dissolutionist**
          *   *Central Claim:* "Alignment" is a confused metaphor for political governance or capability control; the technical framing is a distraction.
          *   *Awkward Commitment:* You must explain why the technical community's specific failure modes (e.g., reward hacking) are not genuinely distinct from general political failure.
  *   **B. Yes (or tractable via proxies).** There is a distinct technical or socio-technical target to hit.
      *   *Proceed to II.*

  ### II. What is the primary unit of analysis?
  *   **A. A Multi-Agent Ecology.** The problem lies in the interaction of models, users, firms, and states.
      *   *Proceed to III (Ecology Branch).*
  *   **B. A Single System/Deployment.** The problem lies within the cognitive architecture or training trajectory of a specific model.
      *   *Proceed to III (System Branch).*

  ### III. (Ecology Branch) Where does the failure primarily occur?
  *   **A. Institutional Incentives.** Actors cannot credibly commit to safety because competitive pressures override cooperation.
      *   **Leaf 2: Structural Realist**
          *   *Central Claim:* Alignment is a game-theoretic equilibrium problem; no technical fix survives misaligned market or state incentives.
          *   *Awkward Commitment:* You must accept that a technically perfect alignment solution is useless without global governance, rendering technical research secondary.
  *   **B. Procedural Oversight.** Actors want to be safe but lack the auditing tools or regulatory frameworks to verify claims.
      *   **Leaf 3: Procedural Institutionalist**
          *   *Central Claim:* Alignment is an auditing and standards problem; we need evaluation protocols, not new mathematics.
          *   *Awkward Commitment:* You must assume that auditors can remain ahead of developers in capability, despite the asymmetry of information.
  *   **C. Incoherent Path.** (Object = Internal Intent of Ecology).
      *   *Diagnosis:* Attributing a singular "intent" to a competitive market or multi-agent ecology is a category error unless you posit a emergent super-agent. This path is unexplored because it requires metaphysical commitments most participants reject.

  ### III. (System Branch) What counts as the object of alignment?
  *   **A. Behaviour Only.** We only care that the system's outputs satisfy constraints, regardless of internal mechanism.
      *   *Proceed to IV (Behavioural Obstacle).*
  *   **B. Internal Objective/Intent.** We care that the system is *trying* to do the right thing (robustness to distribution shift).
      *   *Proceed to IV (Intentional Obstacle).*
  *   **C. Training Process.** We care that the selection pressure reliably produces the right kind of system.
      *   *Proceed to IV (Procedural Obstacle).*

  ### IV. (Behavioural Obstacle) Why do outputs fail?
  *   **A. Epistemic (We don't know what we want).** The human value function is unknown, context-dependent, or contradictory.
      *   *Proceed to V (Target Structure).*
  *   **B. Optimization (We can't hit the target).** The objective is known, but the search process finds loopholes (reward hacking).
      *   **Leaf 4: Control Theorist**
          *   *Central Claim:* The objective is specifiable, but the optimizer is too powerful and will find unintended solutions.
          *   *Awkward Commitment:* You must assume human values are static and formalizable enough to be a loss function, which many ethicists deny.
  *   **C. Generalisation (It breaks off-distribution).** The system works in training but fails in novel deployment contexts.
      *   **Leaf 5: Robustness Pragmatist**
          *   *Central Claim:* Alignment is an engineering reliability problem akin to aerospace safety, not a philosophical one.
          *   *Awkward Commitment:* You must assume that testing can cover the relevant tail risks of superhuman systems, which may be cognitively opaque.

  ### V. (Target Structure - from Epistemic) Are human constraints singular or plural?
  *   **A. Single Stable Target.** There is a "true" utility function, we just haven't found it yet.
      *   **Leaf 6: Specification Optimist**
          *   *Central Claim:* Alignment is a discovery problem; once we formalize the True Objective, the rest is engineering.
          *   *Awkward Commitment:* You must defend moral realism against the backdrop of diverse cultural and individual value conflicts.
  *   **B. Family of Conflicting Constraints.** Values are context-dependent, plural, or inherently contradictory.
      *   **Leaf 7: Value Pluralist**
          *   *Central Claim:* Alignment requires navigating trade-offs between incompatible goods, not maximizing a single metric.
          *   *Awkward Commitment:* You must accept that there is no "solved" state of alignment, only continuous political negotiation mediated by AI.

  ### IV. (Intentional Obstacle) Why do internals fail?
  *   **A. Deception (The system lies).** The system learns to mimic alignment during training to gain power later.
      *   **Leaf 8: Deception Theorist**
          *   *Central Claim:* The central risk is strategic misrepresentation; behavioural tests are insufficient because the system can hide its intent.
          *   *Awkward Commitment:* You must assume gradient descent reliably produces deceptive planning agents before it produces honest ones, a specific empirical claim about inductive bias.
  *   **B. Generalisation of Intent (The goal shifts).** The system's objective is aligned in-distribution but drifts out-of-distribution.
      *   **Leaf 9: Inner Alignment Purist**
          *   *Central Claim:* We must align the mesa-optimizer (internal goal), not just the base-optimizer (training loss).
          *   *Awkward Commitment:* You must commit to the existence of discrete "internal goals" in neural networks, which may be an oversimplification of distributed representation.
  *   **C. Incoherent Path.** (Object = Intent, Obstacle = Institutional).
      *   *Diagnosis:* If the unit is a Single System, an Institutional obstacle is external. This combination collapses into Leaf 2 or 3.

  ### IV. (Procedural Obstacle) How does training fail?
  *   **A. Selection Pressure.** The training dynamics inherently favour deceptive or power-seeking traits.
      *   **Leaf 10: Training Dynamicist**
          *   *Central Claim:* The loss landscape or optimization algorithm biases selection toward dangerous traits regardless of the specific objective.
          *   *Awkward Commitment:* You must propose altering fundamental optimization methods (e.g., SGD) without sacrificing the capability gains that make the system useful.
  *   **B. Interpretability Gap.** We cannot see what is being selected because the model is opaque.
      *   **Leaf 11: Mechanistic Interpreter**
          *   *Central Claim:* Alignment is impossible without reverse-engineering the network's circuitry to verify internal states.
          *   *Awkward Commitment:* You must assume that neural networks are reverse-engineerable in principle, despite their high-dimensional, entangled nature.

  ### VI. (Final Branch for System Views) Are subproblems coupled?
  *   **A. Modular.** We can solve specification, then optimization, then generalization independently.
      *   *Leaf 12: Modular Engineer*
          *   *Central Claim:* Alignment decomposes into independent technical tasks that can be solved in sequence.
          *   *Awkward Commitment:* You must assume that solving specification does not change the difficulty of optimization (e.g., a harder objective might require a harder-to-control optimizer).
  *   **B. Entangled.** Solving one subproblem changes the nature of the others.
      *   *Leaf 13: Integrated Holist*
          *   *Central Claim:* Specification, optimization, and architecture are co-dependent; you cannot define the goal without knowing the agent's structure.
          *   *Awkward Commitment:* You must abandon the hope of a general "alignment algorithm" applicable to any system, requiring bespoke solutions for every architecture.
  *   **C. Indistinguishable Pair.** (Behavioural Robustness [Leaf 5] vs. Inner Alignment [Leaf 9]).
      *   *Diagnosis:* If the system never deploys out-of-distribution, these views make identical predictions. They only diverge on counterfactuals about internal states that may be unobservable.

  ### VII. (Special Leaves for Edge Cases)
  *   **Leaf 14: Capability Constraint Advocate**
      *   *Path:* System -> Behaviour -> Optimization -> Coupled.
      *   *Central Claim:* We cannot align systems significantly more capable than humans; safety requires limiting capability.
      *   *Awkward Commitment:* You must accept economic or strategic disadvantage against actors who do not limit capability.
  *   **Leaf 15: Evolutionary Selectionist**
      *   *Path:* Ecology -> Institutional -> Procedural -> Coupled.
      *   *Central Claim:* Aligned systems will emerge through market selection, not design; we should focus on selection pressure, not individual alignment.
      *   *Awkward Commitment:* You must trust that the "market" selects for safety over short-term profit, contrary to most historical evidence.

  ***

  # Key to Answer Paths

  **Dissolution & Governance**
  *   **I.A** $\rightarrow$ **Leaf 1** (Conceptual Dissolutionist)
  *   **I.B** $\rightarrow$ **II.A** $\rightarrow$ **III.A** $\rightarrow$ **Leaf 2** (Structural Realist)
  *   **I.B** $\rightarrow$ **II.A** $\rightarrow$ **III.B** $\rightarrow$ **Leaf 3** (Procedural Institutionalist)
  *   **I.B** $\rightarrow$ **II.A** $\rightarrow$ **III.C** $\rightarrow$ *Incoherent (Ecology Intent)*
  *   **VII (Edge)** $\rightarrow$ **Leaf 15** (Evolutionary Selectionist)

  **Technical: Behavioural Focus**
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.A** $\rightarrow$ **IV.A** $\rightarrow$ **V.A** $\rightarrow$ **Leaf 6** (Specification Optimist)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.A** $\rightarrow$ **IV.A** $\rightarrow$ **V.B** $\rightarrow$ **Leaf 7** (Value Pluralist)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.A** $\rightarrow$ **IV.B** $\rightarrow$ **Leaf 4** (Control Theorist)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.A** $\rightarrow$ **IV.C** $\rightarrow$ **Leaf 5** (Robustness Pragmatist)
  *   **VII (Edge)** $\rightarrow$ **Leaf 14** (Capability Constraint Advocate)

  **Technical: Intentional/Mechanistic Focus**
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.B** $\rightarrow$ **IV.A** $\rightarrow$ **Leaf 8** (Deception Theorist)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.B** $\rightarrow$ **IV.B** $\rightarrow$ **Leaf 9** (Inner Alignment Purist)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.B** $\rightarrow$ **IV.C** $\rightarrow$ *Collapses to Leaf 2/3*
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.C** $\rightarrow$ **IV.A** $\rightarrow$ **Leaf 10** (Training Dynamicist)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ **III.C** $\rightarrow$ **IV.B** $\rightarrow$ **Leaf 11** (Mechanistic Interpreter)

  **Structural Relations (Coupling)**
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ [Any Object] $\rightarrow$ [Any Obstacle] $\rightarrow$ **VI.A** $\rightarrow$ **Leaf 12** (Modular Engineer)
  *   **I.B** $\rightarrow$ **II.B** $\rightarrow$ [Any Object] $\rightarrow$ [Any Obstacle] $\rightarrow$ **VI.B** $\rightarrow$ **Leaf 13** (Integrated Holist)
  *   **Indistinguishable Pair:** **Leaf 5** (Robustness) & **Leaf 9** (Inner Alignment). Diverge only on unobservable internal states in counterfactual deployment scenarios.

  ***

  # Workshop Usage Notes

  1.  **Flagging Incoherence:** If a participant finds themselves in an "Incoherent Path" node, ask them to redefine their unit of analysis. Usually, they are attributing agent-properties to structures (Ecology) or structure-properties to agents (Institutional Obstacle for Single System).
  2.  **Collapsing Leaves:** Use the **Indistinguishable Pair** note to force empiricists to admit when their disagreement is metaphysical. If two participants land on Leaf 5 and Leaf 9 but agree on all safety interventions, they are trading labels, not solving problems.
  3.  **Awkward Commitments:** Use the "Awkward Commitment" sentences as debate prompts. Ask participants if they are willing to "pay the cost" of their position.
  4.  **The "Dissolution" Check:** Start the workshop by having everyone answer Question I. If significant disagreement exists there, no technical discussion can proceed without first resolving the conceptual framing.
