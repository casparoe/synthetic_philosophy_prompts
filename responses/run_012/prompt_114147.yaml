      *   *Claim 2:* KC is well-defined/objective because UTM choice makes at most an additive difference (Invariance Theorem).
      *   *Claim 3:* Solomonoff induction assigns priors $P(h) \propto 2^{-L(h)}$ (where $L$ is program length).
      *   *Claim 4:* This updates by Bayes's rule.
      *   *Claim 5:* This automatically weights simpler hypotheses more (Occam's razor).
      *   *Claim 6:* Solomonoff showed convergence to the true hypothesis in the limit for computable processes.
