answer: |-
  A conspiracy belief is reasonable only if the alleged conspiracy involves few enough participants to plausibly maintain secrecy and is supported by evidence specifically linking those participants to the act, rather than merely explaining a general pattern.

  This principle reconciles your conflicting pairs by weighing the feasibility of secrecy against the specificity of evidence. In the rezoning case, the conspirators are a handful of councillors; secrecy is plausible, and land ownership specifically links them to the motive. Conversely, the jam theory requires global manufacturers to coordinate; secrecy is implausible, and the evidence is merely a general pattern of shrinking jars. Similarly, the school dismissal involves few administrators and a specific redacted letter, making belief reasonable, whereas the weather theory requires thousands of meteorologists to remain silent for decades, rendering secrecy impossible. The pharmaceutical trial belief is reasonable because a whistleblower specifically implicates a small group of executives, but the shadowy body theory adds unnecessary agents, reducing secrecy plausibility. Finally, the celebrity death theory fails because its evidence is ambiguous and unfalsifiable, lacking specific links entirely.

  Regarding the local shop suspected of money laundering, this principle predicts the belief is unreasonable to hold firmly. While the number of conspirators (shop staff) is small enough to maintain secrecy, the evidence consists of odd opening hours and a nervous employee. These are ambiguous patterns rather than specific links to laundering; nervousness might stem from unrelated anxiety, and odd hours could reflect niche trading. Therefore, while suspicion is warranted, believing the conspiracy theory without further specific evidence, such as financial records or a credible whistleblower, violates the evidential clause.

  Honestly, this principle accommodates all your listed verdicts, so none require abandonment. Your intuition correctly distinguished between cases where the scale of secrecy required was manageable versus impossible, and where evidence was specific versus ambiguous. The tension you felt between the jam and rezoning theories arose because your previous principle focused on 'coincidence economy' rather than 'secrecy feasibility'. The rezoning vote might be a coincidence, but the land ownership provides a specific link that the jam theory lacks. Similarly, the school letter is a specific document, whereas wrong weather forecasts are merely ambiguous data points. Your verdicts are consistent; you simply lacked the vocabulary to articulate the distinction between plausible secrecy with specific evidence and implausible secrecy with general patterns. Therefore, you should retain all your verdicts, as they align with a robust epistemic standard that protects against both cynicism and gullibility.
