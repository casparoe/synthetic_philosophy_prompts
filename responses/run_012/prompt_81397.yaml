answer: |-
  In the basement of the Regional Museum sits a fired clay figure, Inventory #404, physically undisturbed for decades. On Tuesday, the Board of Trustees passes a resolution reclassifying #404 from "Permanent Collection Artwork" to "Disposable Training Material," intending it no longer be viewed as a work but merely as matter for student practice, though it remains on the shelf untouched. On Wednesday, the Board reverses the resolution, restoring #404 to "Permanent Collection Artwork" with the original accession number, without anyone having touched or altered the clay. Throughout this week, the arrangement of atoms, the chemical bonds, and the causal history of the clay's shaping remain exactly as they were on Monday, with no physical intervention occurring between the reclassification and its reversal.

  **Demonstration**

  *   **Constitution View:** Before Tuesday, the clay and the statue are distinct; both exist. On Tuesday, the clay persists (physical continuity), but the statue ceases to exist because it no longer satisfies the normative conditions of the sortal "statue" (artistic status/intention). On Wednesday, a new statue comes into existence (or the old one is resurrected) as the status is restored. **Verdict:** An object (the statue) goes out of and comes back into existence.
  *   **Identity View:** Before Tuesday, there is one object, which is both clay and statue. On Tuesday, that single object persists because its physical constitution is unchanged. The change in status is merely a change in description or external relation, not ontology. **Verdict:** No object goes out of or comes into existence; the single entity persists through the week.
  *   **Nihilism:** There are no statues and no lumps, only atoms arranged statue-wise; the Board's vote changes nothing in the fundamental ontology. **Verdict:** Aligns with the Identity View on persistence (nothing fundamental ceased), but rejects the existence of the "one object" if it implies anything over and above the atoms.

  **The Feature Doing the Work**

  The single feature driving the disagreement is the **normative reclassification by fiat**. If this feature is deleted—if the Board takes no action—the scenario collapses into the ordinary lump-and-statue case where physical continuity ensures persistence for both views, and the disagreement regarding *existence* vanishes (both agree the object persists). The reclassification forces the Constitution View to prioritize sortal satisfaction over physical continuity, while forcing the Identity View to prioritize physical continuity over sortal satisfaction.

  **The Strongest Objection**

  The defender of the **Identity View** (which comes out worse here, as it contradicts the robust intuition that the artwork *did* cease to be an artwork) would attack the case by arguing it begs the question against the **Phase Sortal** account. They would contend that "statue" is not a substance sortal that governs existence conditions, but merely a phase sortal describing a temporary state of the clay-object; thus, the case fails to prove a *thing* ceased to exist, only that the object ceased to *count as* a statue, which is a linguistic or pragmatic shift, not an ontological one.

  **Final Answer**

  The case does **not** show that the Identity View must allow existence to depend on non-physical facts; it escapes that conclusion by denying that the "statue" is a distinct ontological entity whose existence could be threatened by paperwork, reducing the statue to a phase of the clay-object which persists physically. The cost of this escape is that the Identity View cannot ontologically ground the very real differential treatment you observe in the museum (insurance, loans, conservation ethics); it must treat the distinction between "shattered pot" and "glued pot" or "artwork" and "scrap" as merely conceptual or pragmatic, whereas the Constitution View can ground these differences in the existence conditions of distinct objects. However, this advantage comes at the price you noted: since the coincident clay and statue share every intrinsic physical property in your scenario, the Constitution View must rely on extrinsic, modal, or normative properties to tell them apart, inviting the **Grounding Problem** objection that it is mysterious how two numerically distinct things can be so perfectly indiscernible in their intrinsic makeup.
