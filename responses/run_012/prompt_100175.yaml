  6.  **Drafting the One-Pager:**
      *   Needs to be clean, bold, checklist style.
      *   Title: "Technical vs. Political Triage."
      *   Sections: Define, Framework, Sort, Handoff.

  7.  **Refining the Tone:**
      *   Avoid academic name-dropping after the intro.
      *   Speak "Planner-to-Planner."
      *   Be honest about the power dynamics.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too abstract?
      *   *Fix:* Make the questions specific ("Can you measure this?", "Which policy document says this?").
      *   *Critique:* Did I address Neurath?
      *   *Fix:* Mention in the limitations that planning *is* social engineering, don't hide from it.
      *   *Critique:* The prompt asks for "where the procedure stops with a no."
      *   *Fix:* Ensure the flowchart has a "Stop: Political Decision Required" node.
      *   *Critique:* "What to do when we can't get a number."
      *   *Fix:* Explicitly state that lack of quantification signals an External question.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Procedure in order? Yes.
      *   Good enough answer criteria? Yes.
      *   Stop/Handoff points? Yes.
      *   Value call detection? Yes.
      *   Three proposals run? Yes.
      *   One "unwanted truth"? Yes.
      *   Misfires flagged? Yes.
      *   One-page version? Yes.

  *(Self-Correction on the "Unwanted Truth"):* The prompt says "I especially want the one where the procedure tells me something I don't want to hear." As a planning director, you probably *want* to approve housing (YIMBY pressure) and *want* to fix traffic (public pressure). You might *not* want to admit that the Highway Widening is scientifically dubious or politically out of your lane. Or perhaps the Parking/Housing one reveals that the "affordability" math is a lie. Let's make the Highway Widening the one that fails the "Internal" test because the framework (induced demand) contradicts the goal (commute times), forcing a political choice on the framework itself.

  Actually, the License Plate Reader one is the clearest "External" value judgment (Privacy vs. Safety). But Highway Widening is more core to *planning*. Let's go with Highway Widening as the one that exposes the "technical" metric (Level of Service) as a political choice.

  Wait, looking closer at Carnap's "Tolerance." If there are two frameworks (e.g., "Traffic Flow" vs. "Urban Vitality"), and they contradict, staff cannot choose. That's the handoff. Okay, I will structure the Highway example to show that the *metric itself* is the political choice.

