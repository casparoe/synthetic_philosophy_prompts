      *   **Problem:** Staff (15 reviews/month) lack the tools to distinguish between technical feasibility (internal) and value-laden policy choices (external). They need a workflow to triage this *before* hearings.
      *   **Input:** Friend suggested Rudolf Carnap (Vienna Circle). Key concepts: Explication, Internal/External Questions, Principle of Tolerance. Also mentioned Neurath (scientific worldview/social rationalization).
      *   **Goal:** Turn Carnap's philosophy into a practical *procedure* for a planning office.
      *   **Requirements:**
          1.  Step-by-step procedure (questions in order, pass/fail criteria, handoff points).
          2.  Apply procedure to three specific cases (Parking lot -> Housing, Highway Widening, License Plate Readers).
          3.  Identify where the procedure fails/misfires (limitations).
          4.  Provide a one-page handout for staff.
          5.  Tone: Professional, direct, actionable, acknowledging the political reality without getting bogged down in academic jargon.

  2.  **Deconstruct Carnap for Planning:**
      *   *Explication:* Vague concept (e.g., "affordable," "safe," "efficient") $\rightarrow$ Precise technical definition (e.g., "AMI < 80%," "LOS D," "travel time < 30 min"). *Constraint:* Don't pretend the definition is the "true" meaning; admit it's a tool for a specific job.
      *   *Internal vs. External:*
          *   Internal: "Given the zoning code and the traffic model, does this fit?" (Technical/Staff domain).
          *   External: "Should we prioritize cars over housing?" "Should we prioritize security over privacy?" (Political/Council/Public domain).
      *   *Tolerance:* There is no "correct" framework. Choose the one that works for the goal. If the goal is contested, staff can't choose the framework.
      *   *Neurath:* Planning is social engineering. Acknowledge that technical tools serve social ends.

  3.  **Drafting the Procedure (The "Carnap Protocol"):**
      *   Need a flowchart logic.
      *   *Step 1: Explication Check.* Are the terms defined? If "safety" is used, is it crash data or feeling?
      *   *Step 2: Framework Identification.* What rules are we playing by? (Comprehensive Plan, State Law, Engineering Standards).
      *   *Step 3: Internal/External Sort.* Is the question answerable *within* the framework?
      *   *Step 4: Tolerance Check.* If the framework is contested, who chooses?
      *   *Decision:* Staff recommends (Internal) vs. Staff flags for Decision (External).

  4.  **Applying to the Three Cases:**
      *   *Case 1: Parking Lot to Housing.*
          *   Technical: Zoning compliance, infrastructure capacity.
          *   External: Gentrification, character change, loss of public parking.
          *   *Twist:* Usually looks technical, but often hinges on "what is the city for?"
      *   *Case 2: Highway Widening.*
          *   Technical: LOS (Level of Service), capacity models.
          *   External: Induced demand, environmental impact, car-centricity vs. transit.
          *   *Twist:* This is the classic "technical solution to a political problem." Carnap would say the metric (LOS) is an explication that might be wrong for the goal.
      *   *Case 3: License Plate Readers (LPR).*
          *   Technical: Do they work? Cost? Integration?
          *   External: Privacy vs. Security.
          *   *Twist:* This is clearly External. Staff shouldn't decide on privacy trade-offs.
      *   *Selection for "Unwanted Truth":* The Highway Widening is the best candidate for "not our call." It often hides a value judgment (cars > neighborhood) inside a technical metric (LOS). Or the LPR one. Let's make the Highway one the "stop" because it relies on a framework (induced demand vs. capacity) that is contested externally. Actually, LPR is sharper on privacy. But Highway is more "planning." Let's go with the Highway one as the "framework conflict" and LPR as the "value call." Wait, the prompt asks for *one* where it says "not our call." I'll make the Highway one the strong candidate because it challenges the "traffic engineering framework" itself.

  5.  **Identifying Misfires/Limitations:**
      *   Explication *is* political. Defining "affordable" at 80% AMI vs 60% AMI is a value choice disguised as math.
      *   Internal/External isn't clean. Frameworks constrain politics.
      *   Tolerance can lead to paralysis ("we can't choose a framework").
