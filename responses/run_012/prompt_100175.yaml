answer: |-
  Here is the procedure, translated from Carnap's logic into planning workflow, followed by the three case runs, the limitations, and the one-page handout.

  ### The Procedure: The Framework Triage Protocol

  **Goal:** Distinguish between *technical compliance* (Internal) and *framework selection* (External) to prevent staff from accidentally making political decisions or hiding political decisions behind technical jargon.

  **Time Required:** 30–45 minutes per proposal.

  #### Step 1: Explication Check (The "Define Your Terms" Step)
  *   **Question:** What vague word is doing the heavy lifting in this proposal? (e.g., "Safe," "Affordable," "Efficient," "Character").
  *   **Action:** Demand a sharp replacement definition for the purpose of this review.
      *   *Bad:* "This improves safety."
      *   *Good:* "This reduces predicted severe crashes by 15% according to the HSM model."
  *   **Pass Criteria:** The term is measurable or observable within a specific model.
  *   **Fail Criteria:** The term relies on "community feel," "common sense," or cannot be quantified/observed.
  *   **If Fail:** Stop. You cannot analyze this technically. Mark as **External Value Judgment**.

  #### Step 2: Framework Identification (The "Rules of the Game" Step)
  *   **Question:** Which existing rulebook are we using to judge this? (e.g., Comprehensive Plan, State Traffic Manual, Zoning Code, Privacy Statute).
  *   **Action:** Cite the specific document or adopted policy.
  *   **Pass Criteria:** There is an adopted document that explicitly prioritizes the goal in Step 1.
  *   **Fail Criteria:** The proposal asks to achieve a goal that contradicts the current rulebook, or two rulebooks contradict each other (e.g., Traffic Manual says widen, Comp Plan says calm).
  *   **If Fail:** Stop. This is a **Framework Conflict**. Staff cannot resolve this.

  #### Step 3: Internal/External Sort (The "Lane Check" Step)
  *   **Question:** Can this question be answered *solely* by applying the Framework from Step 2 to the Explication from Step 1?
  *   **Action:** Run the analysis.
  *   **Pass Criteria (Internal):** "Given Rule X, does Proposal Y comply?" (Yes/No).
  *   **Fail Criteria (External):** "Should we be using Rule X, or should we care about Goal Z instead?"
  *   **If Pass:** Staff issues recommendation.
  *   **If Fail:** Staff issues **Decision Required** memo. Do not recommend approval/denial. Recommend "Council Direction Required on Policy Framework."

  #### Step 4: The Tolerance Test (The "No Right Answer" Check)
  *   **Question:** If we get a "No" in Step 3, is there an alternative framework that would yield a "Yes," and is there a legitimate public debate about which framework is better?
  *   **Action:** Acknowledge both frameworks.
  *   **Result:** If yes, this is a **Political Trade-off**. Hand off to elected officials. Do not present one framework as "the science."

  ---

  ### Running the Protocol on Your Three Proposals

  #### 1. Downtown Surface Parking Lot → Dense Housing
  *   **Step 1 (Explication):** "Affordable Housing."
      *   *Sharp Definition:* 20% of units at 80% AMI. (Pass)
  *   **Step 2 (Framework):** Zoning Code (allows density) + Comp Plan (calls for housing).
      *   *Status:* Consistent. (Pass)
  *   **Step 3 (Internal/External):**
      *   *Internal:* Does it meet the zoning height/setback? Yes. Does it meet the AMI requirement? Yes.
      *   *External:* Neighbors argue "loss of public parking" and "neighborhood character."
      *   *Analysis:* "Character" fails Step 1 (not sharp). "Loss of parking" is measurable but conflicts with Comp Plan goal of transit reliance.
  *   **Verdict:** **Staff Recommendation (Approve).**
      *   *Why:* The framework (Comp Plan) already settled the "cars vs. housing" debate. The opposition is raising External questions as if they are Internal technical flaws. You can defend this technically because the policy framework supports it.

  #### 2. Highway Widening to Cut Commute Times
  *   **Step 1 (Explication):** "Cut Commute Times."
      *   *Sharp Definition:* Reduce peak hour travel time by 5 minutes.
      *   *Problem:* The model relies on "Level of Service" (LOS).
  *   **Step 2 (Framework):** State DOT Standards (prioritize LOS) vs. City Comp Plan (prioritize VMT reduction/Climate).
      *   *Status:* **Conflict.** The State says widen; the City Plan says reduce driving.
  *   **Step 3 (Internal/External):**
      *   *Internal:* "Does widening improve LOS?" Yes.
      *   *External:* "Does widening actually cut commute times long-term?" (Induced Demand).
      *   *Analysis:* If you use the DOT framework, the answer is Yes. If you use the Induced Demand framework, the answer is No. Both are "scientific."
  *   **Verdict:** **Decision Required (Handoff to Council).**
      *   *The Unwanted Truth:* **This is the one.** You cannot sign off on this. The procedure flags that "Commute Time" is a contested explication. By approving this, you aren't doing engineering; you are choosing the DOT framework over the City Plan framework. That is a political choice.
      *   *Memo Language:* "Staff cannot validate the claim that this project meets the goal of 'reduced commute times' without Council direction on whether to prioritize Level of Service (State Standard) or Vehicle Miles Traveled (City Plan). These frameworks yield opposite conclusions."

  #### 3. License-Plate Readers (LPR) on Arterials
  *   **Step 1 (Explication):** "Public Safety."
      *   *Sharp Definition:* Increase clearance rate of stolen vehicles by 10%.
      *   *Status:* Measurable. (Pass)
  *   **Step 2 (Framework):** Police Efficiency Goals vs. Civil Liberties/Privacy Policy (if one exists).
      *   *Status:* **Conflict.** Usually, no adopted privacy framework exists.
  *   **Step 3 (Internal/External):**
      *   *Internal:* "Will the cameras work?" Yes.
      *   *External:* "Is the trade-off between clearance rate and privacy acceptable?"
      *   *Analysis:* There is no technical metric for "acceptable privacy loss."
  *   **Verdict:** **Decision Required (Handoff to Council/Public Process).**
      *   *Why:* This is a pure External question. Staff can say "It costs $X and catches Y cars." Staff cannot say "This is a good idea." That requires a value framework on privacy that staff does not possess.

  ---

  ### Where The Procedure Misfires (Limitations)

  1.  **Explication is Political:** Defining "Affordable" at 80% AMI instead of 60% AMI looks like Step 1 (technical definition), but it's actually a Step 4 (value choice). The protocol can't stop you from smuggling values into definitions. *Mitigation:* Require staff to list *alternative* definitions they rejected.
  2.  **The "Inertia" Bias:** If the Framework (Step 2) is old or outdated, the protocol forces you to follow it. It protects staff from blame but can enforce bad policy. *Mitigation:* If the Framework is >5 years old, flag it for update in the memo.
  3.  **False Objectivity:** The protocol makes it look like "Internal" questions are value-free. They aren't. Traffic models value time over place. *Mitigation:* Add a disclaimer: "Internal analysis reflects the values embedded in the adopted Framework."
  4.  **Paralysis:** If you flag everything as "External," nothing gets built. *Mitigation:* Use the "Tolerance" clause. If the Framework is clear, stick to it. Only flag External when Frameworks conflict.

  ### What This Procedure Cannot Do
  *   It cannot resolve the conflict. It only identifies *who* must resolve it.
  *   It cannot protect you from a Council that wants to ignore the Framework. It only protects your professional integrity by documenting that you flagged the conflict.
  *   It cannot generate consensus. It clarifies disagreement.

  ---

  ### One-Page Handout for Staff

  **MEMORANDUM**
  **TO:** Planning & Engineering Staff
  **FROM:** Director
  **SUBJECT:** New Triage Protocol for Technical Reviews (Effective Immediately)

  **The Problem:** We are burning hours debating politics while pretending to do math. We need to know when a question is ours to answer (Technical) and when it belongs to the Council/Public (Political).

  **The Tool:** Use the **4-Step Framework Triage** on all major recommendations.

  **1. DEFINE THE TERM (Explication)**
  *   [ ] Is the key goal measurable? (e.g., "Reduce crashes" not "Improve safety")
  *   [ ] If it relies on "feelings" or "character," STOP. Mark as **Political Value**.

  **2. FIND THE RULEBOOK (Framework)**
  *   [ ] Which adopted policy dictates this goal? (Comp Plan, Code, State Manual)
  *   [ ] Do two rulebooks contradict? (e.g., State says Widen, City says Calm)
  *   [ ] If they contradict, STOP. Mark as **Framework Conflict**.

  **3. CHECK THE LANE (Internal vs. External)**
  *   [ ] **Internal (Staff):** "Does this fit the rules?" $\rightarrow$ Write Recommendation.
  *   [ ] **External (Council):** "Are these the right rules?" $\rightarrow$ Write **Decision Required**.
  *   [ ] **External (Public):** "Do we want this goal?" $\rightarrow$ Send to Public Process.

  **4. THE "NO NUMBER" RULE**
  *   If you cannot produce a number, a code citation, or a model output to support the claim, you are making a value judgment. **Do not sign off.**

  **OUTPUTS:**
  *   **Standard Memo:** For Internal/Technical compliance.
  *   **Options Memo:** For External/Political choices. (Present Framework A vs. Framework B. Do not recommend one.)

  **EXAMPLE:**
  *   *Proposal:* Widen Road.
  *   *Check:* State Manual says Yes (LOS). City Plan says No (VMT).
  *   *Result:* **Options Memo.** "Council must choose between State LOS Standards or City VMT Goals."

  **Bottom Line:** We are technicians of the adopted policy, not the authors of societal values. If the policy is silent or conflicted, that is a gap for elected officials to fill, not for us to guess.
