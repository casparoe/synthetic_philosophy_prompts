answer: |-
  This is a textbook example of a phenomenon in social choice theory known as the **Discursive Dilemma** (or the **Doctrinal Paradox**). It was famously analyzed by philosophers Philip Pettit and Christian List. You are not experiencing a glitch in your board's logic; you are encountering a fundamental mathematical tension in how groups make reasoned decisions.

  Here is an analysis of your situation, broken down by the three questions you asked.

  ### 1. Which procedure should you have used?

  There are two competing procedures here, and each serves a different democratic value:

  *   **Premise-Based Procedure (PBP):** This is what you did. You voted on the reasons (Load, Insurance) and let the logic dictate the outcome (Garden).
      *   *Pros:* It ensures **consistency** and **integrity**. It prevents the board from approving a project that a majority believes is unsafe or uninsured. It forces the group to agree on *why* they are doing something.
      *   *Cons:* As you discovered, it can override the direct will of the majority regarding the final outcome.
  *   **Conclusion-Based Procedure (CBP):** This is what the dissenting member wants (a direct vote on the Garden).
      *   *Pros:* It respects the **majority will** on the final action. It is more responsive to the members' overall preferences.
      *   *Cons:* It can lead to **inconsistency**. You could end up with a situation where the board votes to "Build the Garden," but a majority of the board simultaneously believes "The roof is unsafe." This creates a dangerous liability position and a fractured collective rationale.

  **Which is better for a Co-op Board?**
  For a housing cooperative board, the **Premise-Based Procedure is generally superior**, specifically because your prerequisites involve **fiduciary and safety judgments** (structural load, insurance liability) rather than mere preferences (e.g., "Do we like flowers?").

  If you use the Conclusion-Based Procedure and pass the garden, but five members believe the roof is unsafe, the board has collectively authorized a risk that a majority of its governors deem unacceptable. If a leak occurs, the board minutes would show that the board approved the garden despite a majority believing the insurance or structure was inadequate. The PBP protects the board from authorizing action that contradicts its own factual judgments.

  ### 2. Was it a mistake to fix the rule before we knew how the votes would split?

  **No. In fact, it was the only procedurally fair thing to do.**

  In governance, rules of aggregation must be decided **ex ante** (before the votes are cast), not **ex post** (after seeing the result).
  *   **Ex Ante:** You agree on the rules of the game before playing. Even if you lose, you accept the outcome because the process was fair.
  *   **Ex Post:** You look at the score, realize you lost, and then propose changing how points are counted. This undermines trust and encourages manipulation.

  The "mistake" was not fixing the rule beforehand, but rather failing to anticipate that a Discursive Dilemma was possible. Most boards assume that if a majority supports the premises, a majority will naturally support the conclusion. Your board has now learned that this assumption is mathematically false.

  If you change the voting procedure now to get a different result, you are effectively allowing the minority (the 4 who wanted the garden) to override the procedural rules because the outcome didn't go their way. That sets a dangerous precedent for future governance.

  ### 3. Is there a principled way to say what the board actually decided?

  Yes. There is a strong philosophical defense for the outcome you reached.

  **The "Collective Reason" Argument**
  When a board votes on premises, it is not just tallying preferences; it is making **collective judgments of fact**.
  *   The board has collectively judged that "The roof is safe" (5-4).
  *   The board has collectively judged that "Insurance covers damage" (5-4).

  If the board accepts these two propositions as the official position of the body, then logic dictates the board *must* accept the conclusion. To vote "No" on the garden after voting "Yes" on the premises would be for the board to contradict itself.

  Therefore, the board **did** decide to build the garden. It decided that the *conditions for building* were met. The fact that five individual members, wearing their "personal preference hats," would vote against the garden is secondary to their duty as board members to uphold the *collective judgment of the board*.

  **The Principled Stance:**
  You can tell the dissenting member: *"We are not a collection of individuals voting our preferences; we are a corporate body voting on facts. The Board has determined the roof is safe and the insurance is valid. Therefore, the Board has determined the garden is permissible. If you believe the premises are false, you must argue against the premises, not the conclusion."*

  ### Recommendations for Moving Forward

  1.  **Do Not Re-vote:** Re-voting on the conclusion now would validate the idea that procedural rules can be changed whenever the majority is unhappy with the outcome. It undermines the legitimacy of the first vote.
  2.  **Acknowledge the Tension:** In your minutes, record the vote counts on the premises and note that the motion passed based on the established bylaws. You can acknowledge that while a majority expressed personal hesitation about the conclusion, the collective judgment on the prerequisites bound the decision.
  3.  **Future-Proofing:** For future complex decisions, adopt a protocol that anticipates this paradox.
      *   **Discussion Phase:** Before voting, have a discussion aimed at aligning premises and conclusions. Often, seeing the paradox emerge during discussion persuades members to shift their premise votes to align with their conclusion preferences (or vice versa).
      *   **Supermajorities:** For high-stakes decisions, require a supermajority on the premises. If you required 6 votes instead of 5, the paradox might not have triggered (since only 5 voted yes on each).
      *   **Explicit Aggregation Rule:** Explicitly state in your bylaws: *"Decisions dependent on multiple conditions shall be decided by voting on the conditions. If all conditions pass, the decision is approved."* This removes ambiguity.

  **Summary:** You followed a defensible, logically consistent procedure designed to protect the cooperative from unsafe or uninsured projects. While it feels counter-intuitive that a majority opposes the final outcome, that majority is composed of overlapping minorities who disagree on the *reasons*. Upholding the Premise-Based Procedure preserves the board's integrity regarding safety and liability, which is more important than satisfying immediate preference aggregation.
