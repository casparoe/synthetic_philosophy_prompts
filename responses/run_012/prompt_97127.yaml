  (1) "Phenomena it has to save"
  The account must explain how moral sentences function logically identical to descriptive sentences when embedded. Specifically, it must preserve the intuition that "stealing is wrong" means the same thing in "Stealing is wrong" as it does in "If stealing is wrong, then..." This is the consistency requirement. Without it, the argument "Stealing is wrong; if stealing is wrong, then getting your brother to steal is wrong; therefore, getting your brother to steal is wrong" commits the fallacy of equivocation. The theory must validate such mixed arguments without positing moral facts. It must also handle negation ("It is not wrong") and disjunction without collapsing into realism. Essentially, the logic of moral discourse must mirror standard propositional logic. If expressivism treats "wrong" as merely expressing boo-attitudes, it fails when "wrong" appears in the antecedent of a conditional where no attitude is currently being expressed. The theory must show how the *content* persists across asserted and unasserted contexts, ensuring that moral disagreement is genuine contradiction rather than clashing non-cognitive states. It must save the phenomenon of moral uncertainty (wondering if X is wrong) which implies the content exists prior to judgment. It must also account for the inferential role of moral terms in complex sentences like "Either stealing is wrong or tax evasion is permissible." Here, no specific attitude is expressed toward stealing, yet the sentence is meaningful. The theory must explain how the moral term contributes to the truth-conditions (or assertibility conditions) of the whole without referring to a property. Finally, it must handle moral disagreement across time and agents; if I say "It was wrong then" and you say "It is wrong now," we are disagreeing about the same content, not just expressing contemporaneous feelings.

  (2) "Distinctions it can't collapse"
  Expressivism cannot reduce moral judgment to mere emotional outbursts. It must distinguish between *having* an attitude and *accepting* a moral claim. For instance, I might feel disgust at lying (an involuntary state) without judging it wrong (a normative commitment), or judge something wrong while feeling no immediate emotion (moral fatigue). The theory must separate the meaning of the sentence from the psychological state it expresses. If "X is wrong" just means "I dislike X," then moral disagreement becomes impossible—I dislike X, you like X, no contradiction. Furthermore, it must respect the belief/desire distinction. Moral judgments motivate (like desires) but aim at truth (like beliefs). A successful account cannot claim moral judgments are *only* desires, or it loses the ability to explain moral reasoning. It must explain how a state can be belief-like enough to enter logic but desire-like enough to motivate, without conflating the two categories entirely. Collapsing these distinctions renders moral deliberation unintelligible. It must also distinguish between the sentence meaning (public) and the speaker's state (private), allowing for insincere assertion where one says "X is wrong" without holding the corresponding attitude. This ensures moral language remains communicative rather than merely symptomatic.

  (3) "Constraints it can't violate"
  The account cannot contradict established results in formal logic or general semantics. It must adhere to classical validity conditions, such as Modus Ponens, without special exceptions for moral terms. It cannot violate basic linguistic compositionality rules where the meaning of a complex sentence is determined by its parts. Additionally, it should not require implausible psychological claims, such as agents consciously tracking their own attitudinal states every time they use moral language. For example, if the theory implies that understanding "If murder is wrong..." requires currently entertaining a negative attitude toward murder, it contradicts the phenomenology of understanding conditionals. The theory must fit within a naturalistic worldview without positing queer entities, but also without denying the obvious structure of moral thought. It cannot deny that moral sentences are syntactically indicative sentences functioning as propositions in grammar.

  (4) "Requirements that can't all hold"
  The tension is between non-cognitive psychology and classical logic. If moral states aren't beliefs, they lack truth conditions; if they lack truth conditions, validity (truth-preservation) is undefined. Yet validity is required. These seem jointly unsatisfiable without redefining logic. Regarding your friend: compositionality isn't separate; it's the semantic engine required to solve embedding. If the meaning of "wrong" shifts in "If wrong...", compositionality fails. So they are the same constraint viewed from semantics versus logic. Questions ("Is it wrong?") and modals ("Probably wrong") are also just embedding cases. They suspend assertion, so if the theory relies on assertion to express attitudes, it fails here too. It's not a new requirement, but a test of whether the embedding solution is robust across all operators. A theory handling conditionals but failing questions is incomplete. The genuine conflict is between saving logical validity and maintaining a strictly non-cognitive metaphysics. You cannot have standard validity without truth-apt content, yet expressivism denies such content. To satisfy both, the theory must reconstruct validity without truth, which risks changing the subject about what logic *is*. Thus, the requirements pull in opposite directions.

  (5) "The one that does the most work"
  Logical validity of mixed arguments. Explaining why modus ponens works for moral premises without conceding they are truth-apt propositions is the hardest hurdle. If you solve this, you likely solve embedding and compositionality. If you fail this, the theory is dead.
