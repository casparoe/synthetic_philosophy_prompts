  I'm taking a metaethics course and we just finished the Frege–Geach problem, and now I have to write up what an expressivist account of moral language would actually have to pull off before it counts as any good. Not a defense of expressivism — the spec. So: the desiderata list. What phenomena it has to save (the embedding behavior, moral sentences in unasserted or conditional contexts, the validity of arguments that mix a moral premise with a factual one, the sense that a moral sentence means the same thing whether or not anyone's asserting it), the distinctions it can't just collapse (accepting a moral claim vs. having some attitude, believing vs. desiring, the meaning of a sentence vs. the state of mind it expresses), and the background results it can't contradict. Put a concrete case or example behind each requirement so I can see why it's on the list and not just a slogan.

  Then the part I actually care about: flag any requirements that look jointly unsatisfiable, and tell me which single one does the most to knock theories out. One more thing — a friend keeps insisting the real problem is compositionality and not embedding per se, so add a requirement about how the account handles novel moral sentences and combinations it's never encountered, and say whether that's genuinely separate from the embedding requirement or the same thing wearing a different hat. And does it also have to handle a moral claim sitting inside a question (is it wrong to...?) or under "probably" — are those new requirements or just more of the same embedding?

  Format it as: (1) "Phenomena it has to save" — about 250 words; (2) "Distinctions it can't collapse" — about 200; (3) "Constraints it can't violate" — about 150; (4) "Requirements that can't all hold" — about 200; (5) "The one that does the most work" — short.
