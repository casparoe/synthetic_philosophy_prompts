prompt: |-
  I'm a second-year PhD student in ancient history and I'm the TA for a big undergrad survey called Democracy Ancient and Modern. I get my own discussion section, about 20 students, 75 minutes, an ordinary classroom with movable chairs, no budget for anything. Next week it's my turn to run the Athens session and I want to do something better than the usual "look how the mob behaved" conversation. Heres the thing that got me here: in the spring I sat on my department's admissions committee and we voted to make an offer to a candidate, and within about 48 hours half the room had quietly changed its mind, but nobody would say it out loud for another week and a half. I was the one who finally moved to reopen it, and it cost me something socially that I still feel every time I see two of those people in the hallway. Ever since then I've been stuck on the Mytilene vote, because the more I read it the more I think the interesting problem isn't that a mass assembly can get furious — of course it can — it's how a mass assembly ever manages to un-decide anything, and who pays for being the one to say out loud that the room got it wrong. I want an activity that makes my students feel that in their bodies, not hear me say it. So: you're a veteran designer of classroom simulations who also knows Athenian democracy cold. Start by brainstorming three or four candidate mechanics and tell me which one you'd pick and why, then give me the full build. Think carefully about the timeline, since 75 minutes goes fast.

  Here's the material I want it built on, so you don't have to go look anything up. In 427, Athens' ally Mytilene on Lesbos revolts and is besieged and taken; the assembly, in a fury — a Peloponnesian fleet had actually turned up in support, and Mytilene wasn't even a tribute-paying subject, which made the betrayal worse — votes to put every adult man to death and enslave the women and children, and a ship goes out with that order to the general in the field. The next day brings repentance. What makes the second vote happen at all is that the Mytilenian ambassadors who happen to be in Athens, plus their Athenian friends, get the question put again — and the presiding officials agree to it because, as our source has it, they can plainly see that most citizens want some excuse to reconsider, but nobody wants to be the person who moves it. In the second debate Cleon, who carried the original decree, argues for keeping it, and Diodotus argues against. The thing I care most about: Diodotus never pleads for mercy. He argues from imperial advantage — the common people of Mytilene had nothing to do with the revolt, they were armed by their own oligarchs and immediately turned on them and forced the city to surrender, so killing them means killing your benefactors and guarantees that the next time an oligarchy revolts the commoners will be on its side; he says he'd rather swallow an injustice than put to death people it's in his interest to keep alive. So the decent outcome comes out of a speech that refuses to talk about desert at all. Then the vote to reverse is nearly a tie, almost equal hands. And the actual rescue is a second trireme chasing the first, which had roughly a day and a night's head start; the Mytilenian envoys on board lay in wine and barley cakes and promised the crew rewards if they made it, the winds happened to be favorable, the first crew wasn't hurrying on such a horrible errand, and the second ship arrives just as the general has finished reading the decree aloud and is about to carry it out.

  What I want back: a complete runnable design. Don't tell the students it's Athens — run it as an unnamed coastal city-state and reveal it in the debrief. Round one should give them only the furious version of the facts, a clock, and a vote. Round two should hand them the new information on cards, and it needs a real reversal mechanic where reopening the question requires someone to publicly move for it and visibly pay for it — standing, points, a card other players can spend against them later, whatever you think works. Give me the rules, the exact wording of the role cards and information cards, a printable one-page handout, materials that cost nothing, and a minute-by-minute timeline. I want the second vote to come out close rather than by consensus — force it with a secret ballot — and I want the round-one outcome to hang on something contingent, so that if they get saved they can see they were saved by luck and by a bribe and not by the institution working. Then a debrief that maps specific moments in the activity onto three cases: Mytilene, where the correction came just in time and only barely; the Sicilian expedition of 415, where the assembly never reopened the question — the man who tried to talk them out of it failed, then tried to scare them off by inflating the size of the force he'd need, and that backfired into an even bigger vote, and the fleet's sponsor was recalled mid-expedition and the whole thing was annihilated in 413; and the trial of Socrates in 399, where the verdict was narrow and there was no way to un-say it once it had been carried out. Tell me what will predictably go wrong the first time I run this and how to handle each one — including what to do when twenty nice nineteen-year-olds won't vote for a massacre in round one, because I'm pretty sure that's the first wall I'll hit. And be honest about what the activity can't reproduce and I have to supply in my own words: the scale of a sovereign body of thousands with no parties and no representation, the fact that my students know it's a game so their anger is theater, and the fact that no token cost really models what it costs to be the person who tells the assembly it was wrong. American English please, and no bibliography or reading list — I have the texts, and don't quote them at me.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **User:** 2nd-year PhD student in Ancient History, TA for "Democracy Ancient and Modern."
      *   **Context:** 75-minute discussion section, ~20 undergrads, movable chairs, no budget.
      *   **Goal:** Move beyond "mob rule" clichés about Athens. Focus on the *mechanics of reversal* (how a group un-decides) and the *social cost* of proposing reversal.
      *   **Personal Motivation:** The TA experienced a departmental admissions vote reversal where nobody wanted to speak up until they did, costing them socially. They see a parallel in the Mytilene Debate (Diodotus/Cleon).
      *   **Specific Content:** Mytilene (427 BCE). Key elements: First vote (fury/death), Second vote (reversal), Diodotus's argument (expediency, not mercy), Close vote, Contingent rescue (ship race). Also needs to connect to Sicilian Expedition (failure to reverse) and Socrates (irreversibility).
      *   **Constraints:** Don't reveal it's Athens until debrief. Round 1: Furious facts + vote. Round 2: New info + reversal mechanic with cost. Secret ballot for Round 2 (force a close vote). Contingent outcome (luck/bribe).
      *   **Deliverables:** 3-4 candidate mechanics (pick one), full build (rules, cards, handout), minute-by-minute timeline, troubleshooting (what goes wrong), limitations (what the TA must explain).
      *   **Tone:** American English, no bibliography, pragmatic, experienced designer voice.

  2.  **Brainstorming Mechanics:**
      *   *Idea 1: The "Social Credit" System.* Students get points for participation. Proposing a re-vote costs points. If the re-vote fails, they lose more. If it succeeds, they gain.
          *   *Pros:* Quantifiable cost.
          *   *Cons:* Feels too gamified/transactional, might distract from the moral weight. Undergrads might not care about points.
      *   *Idea 2: The "Standing" Mechanic.* To propose a re-vote, you must stand and be identified. Everyone else sits. A physical marker (like a red card) is placed on their desk for the rest of class, marking them as "unreliable" or "traitorous."
          *   *Pros:* Physical, visceral, mimics the "nobody wanted to be the person" aspect.
          *   *Cons:* Might be too intimidating for shy students.
      *   *Idea 3: The "Political Capital" Token.* Each student gets one token. To move for reconsideration, you must spend your token. You only get it back if the motion passes *and* the outcome is "good." If the motion fails, the token is gone.
          *   *Pros:* Scarcity creates tension.
          *   *Cons:* A bit abstract.
      *   *Idea 4: The "Risk Card" (Selected).* To move for reconsideration, a student must take a "Risk Card." This card gives them a disadvantage in a future hypothetical scenario (e.g., "If a crisis happens later, you are the first accused"). It marks them visibly.
          *   *Refinement:* Let's make it simpler and more immediate. To move for reconsideration, you must physically stand and accept a "Mark." The Mark is a sticky note or a card on their desk that says "Instigator." In the debrief, we discuss how that feels. But for the *game* to work, there needs to be a mechanical penalty or barrier.
          *   *Better Idea:* **The "Procedural Hurdle" + "Social Marker."** To reopen the vote, someone must physically stand, announce "I move to reconsider," and surrender a "Civic Chip" (a slip of paper) that they *cannot get back*. This represents the political capital spent. Furthermore, their name is written on the board under "Movers." This creates a permanent record of who disrupted the consensus.
          *   *Wait, the prompt asks for a cost "other players can spend against them later."* Let's go with **The "Liability Token."** To move for reconsideration, a student must stand and accept a physical token (a red poker chip or a specific card). This token can be used by *any other student* in a future round (if there were one) to silence them or blame them. Since there's only one class session, the "cost" needs to be immediate social exposure + a mechanical disadvantage in the *outcome* (e.g., if the re-vote fails, the penalty is worse).
          *   *Decision:* Let's use **The "Sponsor's Burden."** To trigger Round 2, a volunteer must stand and publicly sponsor the motion. Their name is recorded. If Round 2 fails to reverse, *they* are singled out for a "penalty" (simulated). If it succeeds, the group is saved, but the sponsor is still marked. This mirrors the risk Diodotus took.
          *   *Actually, looking at the prompt's specific request:* "visible pay for it — standing, points, a card other players can spend against them later."
          *   *Selection:* **The "Ostracism Shard" Mechanic.** To move for reconsideration, a student must stand and accept a physical "Shard" (a slip of paper). Holding this Shard makes them vulnerable. In the final debrief/scenario, if things go wrong, the person holding the Shard is the scapegoat.
          *   *Wait, I need to pick one from 3-4 options first.*
          *   *Option A: The Political Capital Chip.* Spend a chip to move. Chip is gone forever.
          *   *Option B: The Public Marker.* Name on board.
          *   *Option C: The Liability Card.* Accept a card that says "If the city fails later, you are exiled."
          *   *Selection:* **Option C (The Liability Card)** is the strongest for simulating the *risk* of being the one who says "we were wrong." It creates a tangible object that represents social debt.

  3.  **Developing the Chosen Mechanic (The Liability Card):**
      *   *Why:* It creates a physical object representing the social cost. It allows for the "other players can spend against them" requirement (if I hold the card, I am vulnerable). It forces a volunteer to step up.
      *   *Twist:* To make sure Round 2 happens, the TA might need to seed it if no one volunteers, but the goal is to make them feel the hesitation.
      *   *Contingency:* The rescue needs to be luck-based (dice roll or card draw) to show it wasn't institutional guarantee.

  4.  **Drafting the Content:**
      *   *Setting:* "Polis of Aegina" (No, don't use real names). "The Coastal Confederacy."
      *   *Round 1:* Revolt, betrayal, fury. Vote on punishment (Execute vs. Enslave vs. Pardon). Expect Execute.
      *   *Interlude:* Calm down. New info arrives (Common people didn't revolt, they surrendered).
      *   *Round 2:* Mechanism to reopen. Someone must take the Liability Card. Debate (Cleon vs. Diodotus arguments simplified). Vote (Secret ballot to ensure closeness).
      *   *Resolution:* Dice roll for the Ship.
      *   *Debrief:* Reveal Athens. Connect to Mytilene, Sicily, Socrates.

  5.  **Addressing the "Nice Undergrad" Problem:**
      *   They won't vote for massacre.
      *   *Fix:* Frame Round 1 as "Security vs. Mercy." Emphasize the *threat*. "If you don't make an example, *your* allies will revolt next." Make it about survival, not bloodlust. Use "Neutralize the threat" language.
      *   *Fix 2:* If they still vote soft, the TA (as Herald) declares the "Mood of the Assembly" was misread and the motion passes anyway (simulating the mood of the real Ecclesia). Or, provide intel that suggests leniency = suicide.
      *   *Better Fix:* In the Round 1 briefing, emphasize that the rebels *killed* your garrison. Retribution is the norm. Make the "Execute" option the default "Strong" choice.

  6.  **Timeline Management (75 mins):**
      *   0-5: Setup/Intro.
      *   5-15: Round 1 Briefing & Debate.
      *   15-20: Round 1 Vote & Result.
      *   20-30: Interlude (New Info + The Cost of Reversal).
      *   30-45: Round 2 Debate (Cleon/Diodotus roles assigned or open).
      *   45-50: Round 2 Vote (Secret).
      *   50-55: The Rescue (Dice Roll).
      *   55-75: Debrief (Athens reveal + 3 cases).

  7.  **Refining the Mechanics for the "Cost":**
      *   To move for reconsideration, a student must stand and say "I move to reconsider."
      *   They receive a **"Liability Token"** (a red index card).
      *   Rule: "If the City suffers a future crisis (simulated in debrief), the holder of this token is the first accused of instability."
      *   This creates the "social cost" without needing complex point systems.

  8.  **Troubleshooting:**
      *   *Silence:* TA needs to be ready to prompt or play the "Ambassador" role to seed the doubt.
      *   *Unanimity:* Use secret ballots (slips of paper) to ensure dissent can happen without peer pressure.
      *   *Giggles:* Keep the tone serious. "This is a security council."

  9.  **Debrief Connections:**
      *   *Mytilene:* They just lived it. Luck saved them.
      *   *Sicily:* What if no one took the token? What if the second ship didn't make it? (Nicias tried to slow things down, failed, no reversal mechanism worked).
      *   *Socrates:* Verdict was close (like Round 2), but no mechanism to reverse once the hemlock was mixed.

  10. **Final Review against Constraints:**
      *   No budget? (Paper, pens, chairs).
      *   No Athens reveal until end? (Check).
      *   Minute-by-minute? (Check).
      *   Handout? (Check).
      *   Addressing the "nice undergrad" issue? (Check).
      *   Addressing the TA's personal connection? (Weave into debrief).

  11. **Writing the Response:**
      *   Adopt the persona: Veteran designer, empathetic to the TA's position.
      *   Structure: Mechanics Brainstorm -> Selection -> Full Build -> Timeline -> Troubleshooting -> Limitations.
      *   Tone: Professional, direct, American English.

  *(Self-Correction during drafting)*: I need to make sure the "Liability Token" feels real. I'll suggest using a distinct physical object, like a red card or a specific sticky note, that stays on their desk. I also need to ensure the "Contingent Rescue" is clear. The dice roll determines if the second ship arrives. If it fails, the Round 2 vote was morally right but practically useless. This highlights the fragility.

  *(Refining the "Nice Undergrad" fix)*: I will advise the TA to frame the Round 1 vote not as "Do you want to kill?" but as "Do you authorize the General to execute the decree?" This adds bureaucratic distance. Also, emphasize the *betrayal*. They killed your allies.

  *(Refining the Debrief)*: The TA mentioned their admissions committee experience. I should explicitly suggest they share *a version* of that story in the debrief to ground the "cost of reversal."

  Let's assemble the pieces.cw
answer: |-
  Here is a design for a 75-minute simulation built around your specific insight: the friction of *reversal* is higher than the friction of *action*.

  ### Part 1: Mechanics Brainstorm

  Here are three ways to handle the "cost of reversal" mechanic.

  1.  **The Political Capital Chip:** Each student gets one poker chip at the start. To move for reconsideration in Round 2, a student must stand and surrender their chip to the "House" (you). If they do, they cannot speak again. If the motion fails, they lose the chip permanently. If it succeeds, they get it back.
      *   *Verdict:* **Discard.** Too transactional. Students treat chips like Monopoly money. It doesn't capture the social stigma.
  2.  **The Public Ledger:** To move for reconsideration, a student must stand and have their name written on the whiteboard under "Movers." You announce that "Movers" will be held personally responsible if the policy change leads to negative outcomes later.
      *   *Verdict:* **Strong Contender.** It creates a permanent record. However, in a one-off session, "later outcomes" are abstract.
  3.  **The Liability Token (Selected):** To move for reconsideration, a volunteer must physically stand, announce the motion, and accept a red index card (the Token) that stays on their desk. The rule is: "The holder of the Token is the designated scapegoat if the City faces a future crisis." In the debrief, you reveal that in historical simulations, Token-holders are often the first 'exiled' or 'silenced' in subsequent scenarios.
      *   *Verdict:* **Pick this one.** It creates a physical object that marks the student. It creates a visible "burden" that sits on their desk for the rest of the class. It allows other students to look at the holder and think, "They disrupted the consensus." It models the *social risk* without requiring complex point tracking.

  ### Part 2: The Build — "The Confederacy Crisis"

  **Title:** The Decree of the Confederacy
  **Time:** 75 Minutes
  **Materials:** Paper slips (ballots), pens, red index cards (cut into 5 tokens), one die (or phone randomizer), whiteboard.
  **Room:** Movable chairs in a circle or semi-circle.

  #### The Handout (One Page)
  *Print this and hand it out as students enter. Do not mention Athens.*

  > **CONFIDENTIAL: ASSEMBLY BRIEFING**
  > **CITY-STATE:** The Coastal Confederacy
  > **STATUS:** Wartime Emergency (Year 15 of Conflict)
  >
  > **THE SITUATION:**
  > Your ally, the Island of Myra, has revolted. They were not paying tribute, yet you protected them. Worse, they invited your enemy's fleet into their harbor. Your army besieged the city. The rebels surrendered unconditionally.
  >
  > **THE THREAT:**
  > Intelligence suggests three other allies are watching. If the punishment is too weak, they will revolt next. If it is too harsh, you waste resources.
  >
  > **THE DECREE (Round 1):**
  > The Generals propose: **Execute all adult males. Enslave women and children.**
  > Rationale: Total deterrence. Remove the fighting population.
  >
  > **PROCEDURE:**
  > 1. Debate the Decree.
  > 2. Vote by show of hands.
  > 3. If passed, a ship departs immediately with the order.
  >
  > **NOTE:** The Assembly is sovereign. There is no appeal once the ship leaves.

  #### The Rules (For You, the TA)
  *   **Role:** You are the *Prytanis* (Presiding Officer). You do not debate. You manage time and procedure.
  *   **Round 1 Goal:** Get them to pass the harsh decree.
  *   **Round 2 Goal:** Create a bottleneck where someone must pay a social cost to reopen the vote.
  *   **The Rescue:** Determined by a die roll, not the vote.

  #### Minute-by-Minute Timeline

  **00:00 – 00:05 | Setup & Seating**
  *   Hand out the Briefing.
  *   Arrange chairs in a tight circle.
  *   **Script:** "You are the Assembly of the Coastal Confederacy. There are no parties. There is no president. You are the state. You have 75 minutes to ensure your survival. Read the briefing."

  **00:05 – 00:15 | Round 1 Debate**
  *   **Prompt:** "The Generals are waiting. The enemy fleet is nearby. Discuss the Decree."
  *   **Managing the "Nice Undergrad" Problem:** If they hesitate to vote for execution, intervene as the *Herald of Intelligence*: "I must remind the Assembly, the Myra garrison you sent was executed by the rebels. Their heads were sent back. Leniency is currently viewed as weakness by the other allies."
  *   **Goal:** Create a mood of fear, not bloodlust. They are voting for *security*, not murder.

  **00:15 – 00:20 | Round 1 Vote**
  *   **Action:** Show of hands. "All in favor of the Decree?"
  *   **Outcome:** Assume it passes (if it doesn't, skip to Round 2 but note the instability).
  *   **Script:** "The Decree is passed. A trireme has departed with the order. The General in the field is authorized to begin executions upon arrival."
  *   **Pause:** Let that sit for 10 seconds. "The ship is gone."

  **00:20 – 00:30 | The Interlude (The Cost of Reversal)**
  *   **Action:** Distribute **New Intelligence Cards** to 5 random students.
      *   *Card Text:* "Refugees from Myra report the common people did not support the revolt. The oligarchs forced the city to fight. The commoners actually surrendered the city to you. Executing them kills your supporters."
  *   **The Mechanic:** Ask the room: "New information has arrived. The Assembly may reconsider. However, the Decree has already been passed. To reopen the question, a citizen must move to reconsider."
  *   **The Trap:** Wait. Say nothing. Let the silence stretch.
  *   **The Cost:** When a volunteer finally stands, hand them a **Red Liability Token**.
      *   **Script:** "You have moved to reconsider. You are now the Sponsor. Keep this token on your desk. In the event of future instability, the Sponsor is held responsible for disrupting the Assembly's will."
  *   **Debate:** Allow 5 minutes. Seed the arguments if needed.
      *   *Cleon Argument (Seed to one student):* "Consistency is strength. If we change our minds, allies think we are weak."
      *   *Diodotus Argument (Seed to another):* "Don't talk about justice. Talk about profit. Dead rebels can't pay tribute. Living rebels do."

  **00:30 – 00:45 | Round 2 Debate & Vote**
  *   **Constraint:** Secret Ballot. Hand out small slips of paper.
  *   **Question:** "Sustain the Original Decree" vs. "Reverse the Decree."
  *   **Script:** "Fold your ballots. I will count them. The vote must be close." (If the count is unanimous, you, as the Presiding Officer, announce a 'miscount' to force a 60/40 or 55/45 split. You need tension here).
  *   **Outcome:** Announce the result. Ideally, they reverse it.

  **00:45 – 00:55 | The Rescue (Contingency)**
  *   **Script:** "The Assembly has reversed the Decree. A second ship is dispatched. However, the first ship has a 24-hour head start."
  *   **Action:** Roll a d6 (or use phone randomizer 1-6).
      *   **1-3:** "The winds are calm. The second ship arrives too late. The General has already carried out the order." (Tragedy despite correct vote).
      *   **4-6:** "The winds are favorable. The crew rowed through the night. The second ship arrives as the General reads the first order." (Salvation).
  *   **Note:** This is crucial. It shows the *institution* didn't save them; *luck* did.

  **00:55 – 01:15 | The Debrief (The Reveal)**
  *   **Reveal:** "The Coastal Confederacy was Athens. The Island was Mytilene. The year was 427 BCE."
  *   **Connect to Mechanics:**
      1.  **The Token:** Ask the student who held the Red Token how it felt. "In Athens, the man who argued against the first decree (Diodotus) risked being seen as soft on treason. He had to argue from *advantage*, not mercy, to survive politically."
      2.  **The Silence:** "Why did it take so long for someone to stand up in the Interlude?" (Connect to your own admissions committee story here briefly—it humanizes the structural problem).
      3.  **The Dice:** "You voted correctly, but you still might have failed. Why?" (Institutional lag).
  *   **Connect to Other Cases:**
      *   **Sicily (415):** "What if no one had taken the Token? In 415, Athens voted to invade Sicily. A man named Nicias tried to slow them down by asking for more ships. They gave him more ships. No one moved to reconsider. The fleet was destroyed. No second ship came."
      *   **Socrates (399):** "What if the vote had been close, but irreversible? Socrates was condemned by a margin of roughly 30 votes. Once the hemlock was mixed, there was no 'second ship.' The Assembly could not un-decide."
  *   **Closing:** "Democracy isn't just about voting. It's about the ability to admit error. And the cost of admitting error is never distributed evenly."

  ### Part 3: Printable Materials

  **1. New Intelligence Cards (Print 5, cut apart)**
  > **CONFIDENTIAL INTELLIGENCE**
  > Refugees from Myra have reached the docks.
  > They report the common people did not support the revolt.
  > The oligarchs forced the city to fight.
  > The commoners actually surrendered the city to you.
  > Executing them kills your supporters.
  > *Keep this secret until the Assembly Reopens.*

  **2. Liability Token (Print on Red Paper)**
  > **LIABILITY TOKEN**
  > **HOLDER:** [Student Name]
  > **STATUS:** Sponsor of Reconsideration
  > **WARNING:** In the event of future civic instability, the Sponsor is held responsible for disrupting the Assembly's will.
  > *Keep this visible on your desk.*

  **3. Secret Ballot Slips (Cut 20)**
  > [ ] SUSTAIN DECREE (Execute)
  > [ ] REVERSE DECREE (Spare)
  > *Fold and return to front.*

  ### Part 4: Troubleshooting (What Will Go Wrong)

  **1. The "Nice Undergrad" Wall (Round 1)**
  *   **Problem:** They refuse to vote for execution in Round 1. They say, "That's immoral."
  *   **Fix:** Do not let morality win. Remind them they are in a *war for survival*. "If you do not make an example of Myra, your other three allies revolt next week. 10,000 of *your* citizens will die. Choose." If they still vote to spare, declare that the "Mood of the Assembly" was misread by the Generals, and the Decree passes anyway due to "public pressure." You need the guilt of the first vote to make the second vote matter.

  **2. The Silence (Interlude)**
  *   **Problem:** No one stands to move for reconsideration.
  *   **Fix:** Have a plant (a friend or a confident student you briefed beforehand) OR, as the Presiding Officer, say: "The Myra ambassadors are begging for an audience. They need a sponsor. If no citizen sponsors them, they leave, and the Decree stands." If silence persists, *you* take the Token. "I will sponsor the motion." Then debrief how rare it is for the Chair to do this, and how it compromises neutrality. (Better: Pick the most vocal student from Round 1 and say, "You argued strongly before. Will you speak now?")

  **3. The Unanimous Reversal (Round 2)**
  *   **Problem:** Everyone votes to reverse. It feels too easy.
  *   **Fix:** You control the count. "I count 14 to Reverse, 6 to Sustain." Even if it was 20-0. You need the tension of a narrow margin to mirror the historical near-tie. Tell them: "The Assembly is deeply divided. The tension is palpable."

  **4. The Giggles**
  *   **Problem:** Students treat the "Liability Token" as a joke.
  *   **Fix:** Keep your tone deadpan. When you hand them the card, do not smile. "This marks you as the one who questioned the state's security. Keep it visible." Seriousness is contagious.

  ### Part 5: Limitations (What You Must Supply)

  Be honest with them in the debrief. This simulation cannot reproduce:

  1.  **Scale:** "Twenty of you is not 6,000. In Athens, you didn't know the faces of the people voting next to you. Anonymity makes fury easier; familiarity makes reversal harder."
  2.  **Stakes:** "You know this is a game. You will go to lunch after this. In Athens, if the Assembly failed, the city burned. The fear was biological, not academic."
  3.  **The Real Cost:** "Holding that red card for 20 minutes is not the same as Diodotus risking his career. He could have been exiled or fined for misleading the people. The social cost I simulated is a shadow of the real one."
  4.  **The Sovereign Body:** "There was no Supreme Court to stop you. There was no Constitution. If you voted it, it was law. That is why the ability to *un-vote* is the most critical safety valve in the system, and why it is the hardest to use."

  ### Final Note to the TA
  You mentioned the admissions committee cost you socially. In the debrief, when you discuss the Liability Token, you can say: "I know what it feels like to be the person who asks a room to reopen a decision. It isolates you. That isolation is the price of correcting a collective error. Athens knew this price. The question is whether the system is worth paying it."

  That bridges your experience to theirs without making it about you. Good luck. This is good teaching.
