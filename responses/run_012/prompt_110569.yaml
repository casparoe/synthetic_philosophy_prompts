answer: |-
  **Sequence and Logic**
  Begin with the label, not the data. Write "Millennial" on the board. Ask: "What is this?" Let them offer traits. Then introduce your first idea (APC confounding) as the wrecking ball. You cannot discuss identity until you dismantle the data claiming to prove it. Show that a survey difference is ambiguous: is it age, era, or birth? This clears the ground.

  Your second idea (Cohort vs. Generation) is the spine, not a distraction. Once the data is suspect, the only way the label survives is sociologically: not as a statistical bucket, but as a self-conscious group. Move from "were we measured?" to "do we feel it?" This order is crucial; if you start with identity, they will argue data. If you start with data, you force them to abandon statistics for sociology. Idea 1 must precede Idea 2 because Idea 1 destroys the objective basis, while Idea 2 offers the subjective alternative. Without the wrecking ball, the spine looks like semantics. With it, the spine becomes the only remaining shelter.

  **The Carrying Example**
  The smartphone is the right candidate, but only if stripped of determinism. It must lack the claim that phones *created* the generation. It must have a saturation curve: draw the year ownership hit 50%, 75%, 90% on the whiteboard. This visualizes the arbitrary line. If the "Millennial" cut is 1996, but smartphone saturation hit in 2011, the 15-year-old and the 20-year-old had the same experience. The example works because it separates the tool from the birth year. It shows that technology is an environmental condition, not a genetic marker.

  **Misconceptions**
  You listed three. All are mistakes, but they must be headed off at different stages.
  1.  **"Generations want things" (Agency):** Head this off immediately (Minute 5). Say aloud: "Generations do not have wants; people do." This prevents reification before it starts.
  2.  **"Fake because exceptions" (Nirvana Fallacy):** Address this during the smartphone example. When someone says, "I had a flip phone in 2010," reply: "We are talking about saturation, not your uncle." This distinguishes trends from laws.
  3.  **"Real because distinguishable" (Essentialism):** Save this for the end. It is the hardest to kill.
  4.  **Missed Misconception:** "Technology causes generations." People assume new tools create new kinds of people. Head this off during the example by noting that tools are adopted at different rates by class and region, not just birth year. A rich Gen Z kid and a poor Gen Z kid had different smartphone childhoods.

  **The Closing Test**
  Your "slide the birth-year by three years" test is robust. It does not prove too much; it proves precision is fraudulent. If a claim about "Millennials" collapses when you include 1997 or exclude 1994, the claim was about the boundary, not the people. Keep it. It gives them a heuristic for skepticism without requiring statistical literacy. Three years is specific enough to be meaningful but small enough to expose arbitrariness. It turns the abstract problem into a concrete check they can perform on any headline.

  **Refusals**
  Explicitly refuse two things. First, do not explain how statisticians attempt to fix the APC problem (cross-classified models). It is too technical and suggests there is a solution when the point is the ambiguity. Second, refuse to date the "start" of any generation. Say: "I will not argue where the line is, because arguing the line validates the map." This prevents the session from devolving into boundary disputes.

  **Summary of Flow**
  1.  **Minute 0-10:** The Claim & The Agency Trap. (Define terms, ban agency).
  2.  **Minute 10-25:** The Data Trap (APC). (Show why surveys lie).
  3.  **Minute 25-35:** The Identity Rescue (Cohort vs. Gen). (Smartphone example, saturation curves).
  4.  **Minute 35-40:** The Tool. (3-year slide test).

  This structure ensures they leave knowing *how* to think, not *what* to think. You are not giving them a verdict on Millennials; you are giving them a verdict on categories.
