      *Pascal Connection:* Pascal argues that *custom* makes justice. My principle argues *human need* limits justice. Pascal says force makes justice real. My principle says force must be *limited* by justice to be just.

      *Final Polish:* Ensure the distinction between "Just" and "Legitimate/Necessary" is clear, especially for the Parent and Occupier cases.

      *(One more check on Pascal)*: Pascal's *Pensées* (Lafuma 97-103 range usually). "Justice without force is powerless; force without justice is tyrannical." "We do not show the greatness of man by establishing justice, but by showing why we cannot establish it." He is a skeptic. He believes we follow laws because they are laws, not because they are just. My principle is Natural Law-adjacent. Pascal would reject the idea that we can know "fundamental rights" independent of custom/force.

