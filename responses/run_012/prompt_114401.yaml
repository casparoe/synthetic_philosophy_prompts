answer: |-
  Your friend's summary is a compelling dramatic simplification that captures the essence of the reference class problem but commits several philosophical category errors and draws a conclusion that most experts would reject.

  **Claim 1: 'To assign a probability to a single event... you must first place the individual in a class of similar cases and read off the frequency.'**
  *Verdict: Fair characterization.*
  This accurately describes the frequentist approach to single-case probabilities. A strict frequentist defines probability as the limit of relative frequency in a long run of trials; applying this to a single prisoner requires treating them as a member of a sequence. A philosopher would accept this as a fair statement of the frequentist position, even if they disagree with the position itself.

  **Claim 2: 'But every individual belongs to indefinitely many classes... and these classes yield different frequencies, so the choice of class, and therefore the probability itself, is arbitrary.'**
  *Verdict: Accurate statement of the problem.*
  This is the classic formulation of the reference class problem, originally articulated by John Venn and later Hans Reichenbach. It is philosophically sound to say that an individual possesses infinite attributes and can therefore be classified in indefinitely many ways, yielding conflicting probabilities. This claim is doing the heavy lifting in your friend's argument.

  **Claim 3: 'This shows that frequentist probability simply cannot be applied to the single case and ought to be abandoned...'**
  *Verdict: Overstatement.*
  While the problem is serious, claiming it necessitates the abandonment of frequentism is contentious. Many philosophers argue for modifications, such as selecting the 'most relevant' class based on causal knowledge, or adopting a 'propensity' interpretation (where probability is a physical disposition of the setup rather than a mere frequency). To say it *must* be abandoned is a normative leap, not a logical necessity.

  **Claim 4: '...and that all genuine probability must be subjective — a personal degree of belief.'**
  *Verdict: Mistaken non-sequitur.*
  This presents a false dichotomy. Even if frequentism struggles with single cases, it does not automatically vindicate subjective Bayesianism. There are other interpretations, such as logical probability or objective Bayesianism, which seek objective constraints on belief. Furthermore, subjective probability brings its own problems (such as how to constrain irrational priors), so this conclusion does not follow from the premise.

  **Claim 5: 'It is also why statistical evidence is always weaker than direct evidence about the individual, as the prosecutor's fallacy illustrates.'**
  *Verdict: Mistaken conflation.*
  This runs two distinct issues together. The reference class problem concerns *which* group statistics to use. The prosecutor's fallacy is a specific error in conditional probability (confusing the probability of the evidence given innocence with the probability of innocence given the evidence). While both arise in legal contexts, the reference class problem does not illustrate the prosecutor's fallacy. Additionally, statistical evidence is not *always* weaker than direct evidence; DNA profiling, for instance, is statistical yet often superior to eyewitness testimony.

  **Claim 6: 'The remedy, when one must proceed, is to choose the narrowest reference class available...'**
  *Verdict: Common simplification.*
  This is Reichenbach's advice, but it ignores the trade-off identified by Wesley Salmon. If you make the class too narrow (e.g., 'left-handed bankers aged 42 with this specific offence'), you may end up with a sample size of one, rendering the frequency statistically unstable or undefined. The expert remedy is to choose the narrowest class *for which reliable statistics exist*, balancing specificity with statistical stability.

  **Evaluation of the Conclusion**
  The conclusion that frequentism must be given up and only subjective priors can rescue us does not follow from the surviving claims. The reference class problem highlights a difficulty in applying group data to individuals, but it does not prove that subjective belief is the only alternative. In a legal context, the problem suggests that statistical evidence should be treated with caution and contextualised, not that it is philosophically bankrupt.

  **Advice for Your Character**
  If your character is meant to be an expert, they should acknowledge the trade-off in Claim 6 (specificity versus sample size) rather than stating the narrowest class is simply the remedy. They should also separate the reference class problem from the prosecutor's fallacy. A truly knowledgeable character might argue that while the probability is sensitive to the class chosen, this does not render the evidence useless, but rather requires transparency about which attributes were deemed relevant. If you wish them to sound dogmatic, your friend's version is perfect; if you wish them to sound authoritative, they should admit that while the problem is unresolved, courts routinely manage it by selecting classes based on causal relevance rather than arbitrary features.
