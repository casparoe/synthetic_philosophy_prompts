prompt: |-
  Act as a philosopher of psychiatry who's read too much Hacking and sat through too many DSM revision fights. I want a spec, not a survey. Imagine a new label gets added to the manual -- call it algorithmic burnout -- and within a few years people start describing themselves in its terms, clinicians start seeing it everywhere, the criteria get revised, and the population of sufferers changes shape. That's a looping effect, and I want to know what a theory of psychiatric classification has to get right if its going to handle that kind of feedback rather than pretend categories are natural kinds waiting to be discovered. Start by brainstorming the phenomena and cases such a theory must accommodate, then write the desiderata: the cases it must get right, the distinctions it cant collapse (like useful vs. real, prevalence rising vs. incidence rising, patient self-interpretation vs. clinician bias), the results from epidemiology or psychometrics it must not contradict, and which requirements are non-negotiable vs. nice-to-have. Flag any pair you think cant be jointly satisfied, and say which single requirement does the most to rule out the standard just-improve-the-criteria view. No citations or reading list; I care about the reasoning. Think carefully and be explicit about your assumptions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of psychiatry (well-versed in Ian Hacking, DSM politics, looping effects).
      *   **Task:** Create a *spec* (specification/requirements document) for a theory of psychiatric classification, not a survey of existing theories.
      *   **Core Concept:** "Looping effects" (specifically using the hypothetical example of "Algorithmic Burnout").
      *   **Key Constraint:** The theory must handle feedback loops where classification changes the classified, rather than treating categories as static natural kinds.
      *   **Structure:**
          1.  Brainstorm phenomena/cases the theory must accommodate.
          2.  Write Desiderata (cases to get right, distinctions to maintain, empirical constraints).
          3.  Distinguish Non-negotiable vs. Nice-to-have.
          4.  Flag incompatible pairs (trade-offs).
          5.  Identify the single requirement that rules out the "just-improve-the-criteria" view.
      *   **Tone:** Philosophical, rigorous, explicit about assumptions, no citations/reading lists.

  2.  **Deconstruct the Core Concept (Looping Effects):**
      *   Hacking's idea: Classifying humans interacts with the humans classified. They learn about the classification and change their behavior/self-conception. This changes the extension of the category, which forces revision of the intension (criteria), which loops back.
      *   Example: "Algorithmic Burnout."
          *   Phase 1: Label introduced.
          *   Phase 2: People adopt label (self-interpretation).
          *   Phase 3: Clinicians see it more (detection bias + real change).
          *   Phase 4: Criteria revised (broadened/narrowed).
          *   Phase 5: Population changes shape (new symptoms, different demographics).
      *   Implication for Theory: A theory of classification cannot be purely ontological (what *is* it?) or purely epistemic (how do we *know* it?). It must be *dynamic* and *interactionist*.

  3.  **Brainstorming Phenomena/Cases:**
      *   *Algorithmic Burnout* (the prompt's example).
      *   *Multiple Personality Disorder / Dissociative Identity Disorder:* The classic Hacking case. Therapy created the patients.
      *   *Autism Spectrum:* Neurodiversity movement changing the meaning of the diagnosis from "deficit" to "difference," altering who seeks diagnosis and how they behave.
      *   *PTSD:* From "shell shock" to civilian trauma. The label legitimized suffering, increasing reporting.
      *   *ADHD:* Expansion from hyperactive boys to inattentive adults. Pharmaceutical marketing + self-diagnosis loops.
      *   *Premenstrual Dysphoric Disorder (PMDD):* Political fights over medicalizing normal cycles vs. validating suffering.
      *   *Compassion Fatigue:* Similar to burnout, professional identity shaping symptom reporting.

  4.  **Developing the Desiderata (The Spec):**
      *   *What must the theory explain?*
          *   Why prevalence changes aren't just measurement error.
          *   How patient agency matters (they aren't passive objects).
          *   How clinical authority interacts with patient self-knowledge.
      *   *Distinctions to maintain:*
          *   *Useful vs. Real:* A category can be socially real (causes effects) without being biologically natural.
          *   *Incidence vs. Prevalence:* Are more people getting it, or are we just counting existing cases better? (Looping blurs this).
          *   *Self-interpretation vs. Clinician Bias:* Patients aren't just faking; they are adapting. Clinicians aren't just biased; they are gatekeepers of the loop.
      *   *Empirical Constraints:*
          *   Cannot contradict basic psychometrics (reliability matters, even if validity is moving).
          *   Cannot deny biological correlates (even if socially constructed, brains are involved).
      *   *Non-negotiable vs. Nice-to-have:*
          *   Non-negotiable: Must account for human agency/reactivity.
          *   Nice-to-have: Predictive stability (hard to ask for in a looping system).
      *   *Incompatible Pairs:*
          *   Stability of reference vs. Sensitivity to social change.
          *   Clinical utility vs. Ontological purity.
      *   *The "Killer" Requirement:* The one that kills the "just-improve-the-criteria" view. That view assumes there's a fixed target we are aiming at. The killer requirement must assert that the *target moves because we aim at it*.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the stance. Acknowledge Hacking. Define the scope (dynamic classification).
      *   *Phenomena:* List the cases derived in step 3. Focus on the *mechanism* of change in each.
      *   *Desiderata:* Break down into Ontological, Epistemic, and Ethical/Pragmatic.
      *   *Distinctions:* Be precise about the "Useful vs. Real" trap.
      *   *Constraints:* Psychometrics can't be ignored, but their role changes.
      *   *Trade-offs:* Where does the theory break?
      *   *The Knockout Punch:* Identify the requirement that forces a paradigm shift.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Am I just summarizing Hacking?
      *   *Fix:* No, I need to write a *spec for a theory*, not summarize Hacking's theory. I need to say "A adequate theory must satisfy X."
      *   *Critique:* Is "Algorithmic Burnout" too vague?
      *   *Fix:* Use it as the running example to ground the abstract points.
      *   *Critique:* Make sure I don't slide into social constructionism that denies biology.
      *   *Fix:* Emphasize "interactive kinds" – the biology is real, but the classification interacts with it.
      *   *Focus:* The prompt asks for "No citations." Keep the voice authoritative but internal.
      *   *Key Insight:* The "just-improve-the-criteria" view assumes a static target. The spec must demand a theory of *moving targets*.

  7.  **Final Polish:**
      *   Check tone: Cynical but rigorous philosopher.
      *   Check constraints: No reading list. Explicit assumptions.
      *   Ensure the "Single Requirement" is clearly identified and justified.

  8.  *(Final Review against Prompt)*
      *   Act as philosopher of psychiatry? Yes.
      *   Spec, not survey? Yes.
      *   Brainstorm phenomena? Yes.
      *   Desiderata (cases, distinctions, results)? Yes.
      *   Non-negotiable vs. Nice-to-have? Yes.
      *   Flag incompatible pairs? Yes.
      *   Single requirement ruling out standard view? Yes.
      *   No citations? Yes.

