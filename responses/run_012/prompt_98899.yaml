answer: |-
  ### Preamble: Assumptions of the Spec

  We are operating under the assumption that psychiatric classification is not a taxonomy of static natural kinds (like gold or tigers) but a taxonomy of **interactive kinds**. When we classify a human being, the classification becomes part of the environment in which that human being exists. They perceive the label, interpret it, and potentially modify their behavior, self-narrative, or physiology in response. This modifies the extension of the category, which pressures the intension (the criteria), which loops back to the people.

  Therefore, a theory of psychiatric classification cannot be purely ontological (what is the thing?) or purely epistemic (how do we measure the thing?). It must be **cybernetic**. It must account for the feedback loop between the classifier, the classified, and the institutional machinery connecting them.

  ---

  ### Part I: Phenomena and Cases to Accommodate

  A viable theory must explain the trajectory of specific historical and hypothetical categories where the act of naming altered the named. It must handle:

  1.  **The "Algorithmic Burnout" Trajectory (Hypothetical):**
      *   *Initial State:* Clinicians notice fatigue in tech workers. A provisional code is added.
      *   *The Loop:* Tech workers read the criteria. They begin to monitor their screen time and emotional numbness specifically through the lens of the criteria. They present these specific symptoms to doctors.
      *   *The Shift:* The population of sufferers shifts from "exhausted managers" to "anxious coders" because the latter group adopted the label more readily.
      *   *The Revision:* The DSM committee sees the demographic shift and revises criteria to include "anxiety regarding output," which was not in the original definition.
      *   *Requirement:* The theory must explain why the revision wasn't just "correction of error" but a reaction to the population changing shape.

  2.  **Dissociative Identity Disorder (formerly Multiple Personality Disorder):**
      *   The theory must accommodate the fact that the *number* of alters and the *dramatic presentation* of the disorder correlated with therapeutic expectations and media portrayals. The classification provided a script for suffering.

  3.  **Autism Spectrum Disorder:**
      *   The theory must handle the Neurodiversity movement. Here, the classified group rejected the "deficit" framing of the classification. This changed who sought diagnosis (adults seeking accommodation vs. parents seeking treatment) and changed the clinical phenotype (masking vs. unmasking).

  4.  **PTSD:**
      *   The theory must explain how a label legitimized suffering for veterans and assault survivors, thereby increasing reporting rates not merely due to "awareness" but due to a change in the *moral permissibility* of claiming the status.

  5.  **ADHD in Adults:**
      *   The theory must distinguish between better detection of a static underlying trait vs. the creation of a new life-stage phenotype driven by pharmaceutical availability and workplace demands.

  ---

  ### Part II: Desiderata for the Theory

  #### A. Cases the Theory Must Get Right
  1.  **The False Positive Wave:** It must explain the initial surge in prevalence upon label introduction without dismissing it as mere "over-diagnosis." Some of that surge is the loop starting, not noise.
  2.  **The Symptom Drift:** It must account for why the average symptom profile of a disorder changes over decades (e.g., depression looking more anxious now than in 1950) without assuming the underlying biology necessarily mutated that fast.
  3.  **The Resistant Core:** It must acknowledge that some biological constraints remain. You cannot loop yourself into having a seizure if you don't have the neural substrate, but you can loop yourself into interpreting the aura differently. The theory must bound the looping effect.

  #### B. Distinctions the Theory Cannot Collapse
  1.  **Useful vs. Real:**
      *   *Standard View:* If it's socially constructed, it isn't "real."
      *   *Spec Requirement:* The theory must treat "socially real" as causally potent. A category is real if it has effects. "Algorithmic Burnout" is real if it causes people to quit jobs, even if no specific neural lesion corresponds to it. The theory must not force a choice between constructionism and realism; it must posit **interactional realism**.
  2.  **Prevalence vs. Incidence:**
      *   *Standard View:* Rising numbers = either more disease (incidence) or better counting (prevalence).
      *   *Spec Requirement:* The theory must allow for a third option: **Constitution.** The classification helps constitute new cases. Rising numbers may reflect a change in the *kind* of person coming into existence, not just counting errors or biological outbreaks.
  3.  **Patient Self-Interpretation vs. Clinician Bias:**
      *   *Standard View:* Patient reporting is data; clinician judgment is the filter.
      *   *Spec Requirement:* The theory must treat patient self-interpretation as a *mechanism of pathology*, not just a source of data. If a patient changes their behavior to fit the criteria, that behavioral change is part of the disorder's ontology, not a confound to be controlled for.
  4.  **Reliability vs. Validity:**
      *   *Standard View:* Get high inter-rater reliability first; validity will follow.
      *   *Spec Requirement:* In a looping system, high reliability on moving criteria is a trap. The theory must prioritize **dynamic validity** (does this track the interaction?) over static reliability (do we all agree on the snapshot?).

  #### C. Empirical Constraints (What it must not contradict)
  1.  **Psychometric Stability:** It cannot claim that *nothing* is stable. Twin studies and heritability estimates exist. The theory must accommodate biological constraints on how far a loop can pull a phenotype.
  2.  **Treatment Response:** It cannot deny that pharmacological interventions work. Even if the category is interactive, the neurochemistry is not purely volitional.
  3.  **Epidemiological Baselines:** It must not contradict hard data on mortality, suicide rates, or disability claims. These are the anchor points that prevent the theory from drifting into pure semiotics.

  ---

  ### Part III: Requirements Hierarchy

  #### Non-Negotiable Requirements (Hard Constraints)
  1.  **Agency Inclusion:** The theory must model the classified human as an agent who processes the classification, not a passive object. If the theory treats patients as static targets, it fails.
  2.  **Temporal Dynamics:** The theory must be time-sensitive. A definition valid at T1 may be ontologically insufficient at T2 because the population has adapted to T1.
  3.  **Institutional Embedding:** The theory must account for the incentives of the classifiers (clinicians, insurers, pharma). Looping is driven by utility. If the label doesn't unlock resources, the loop is weak.

  #### Nice-to-Have Requirements (Soft Constraints)
  1.  **Predictive Stability:** It would be nice if the theory allowed us to predict prevalence 10 years out. But in a looping system, this may be impossible. We should not demand a theory provide certainty where the system is inherently chaotic.
  2.  **Cross-Cultural Invariance:** It would be nice if categories held across cultures. But if looping is driven by local social norms, we must accept that "Algorithmic Burnout" might only loop in Silicon Valley, not in agrarian societies.
  3.  **Etiological Specificity:** It would be nice to know the root cause. But in interactive kinds, the "cause" is the loop itself. Demanding a single biological etiology may be a category error.

  ---

  ### Part IV: Incompatible Pairs (Trade-Offs)

  A rigorous theory must admit where it cannot have it all.

  **Pair 1: Reference Stability vs. Social Sensitivity**
  *   *Conflict:* To compare data over 50 years, we need the definition of "Depression" to stay the same (Reference Stability). To accurately capture the current phenomenon, we need the definition to change as the culture changes (Social Sensitivity).
  *   *Resolution:* The theory must prioritize **Social Sensitivity**. Longitudinal comparison is less valuable than accurate description of the current interactive kind. We accept that we are measuring different things at T1 and T2.

  **Pair 2: Clinical Utility vs. Ontological Purity**
  *   *Conflict:* A category might be clinically useful (gets patients insurance) precisely *because* it triggers a positive looping effect (patients feel validated). However, this makes the category ontologically "impure" (it relies on the belief to work).
  *   *Resolution:* The theory must prioritize **Clinical Utility** but label it explicitly as "performative validity." We admit the category works *because* people believe in it, not *despite* it.

  **Pair 3: Reductionism vs. Emergence**
  *   *Conflict:* We want to reduce the disorder to neural circuits (Reductionism). But the looping effect happens at the level of narrative and identity (Emergence).
  *   *Resolution:* The theory must reject Reductionism as a primary explanatory tool for interactive kinds. Neural correlates are necessary conditions, but insufficient explanations.

  ---

  ### Part V: The Knockout Requirement

  There is one requirement in this spec that single-handedly destroys the standard "just-improve-the-criteria" view (the view that we are slowly carving nature at its joints and just need sharper knives).

  **The Requirement:** **The theory must treat the classification criteria as a causal intervention, not a descriptive measurement.**

  **Reasoning:**
  The standard view assumes that criteria are like a net. If the net has holes, we fix the mesh. We assume the fish (the disorder) are swimming around independently of the net. The goal is to make the mesh match the fish.

  The **Knockout Requirement** asserts that the net *changes the fish*. When you cast the criteria (the net), you alter the behavior of the population (the fish). Therefore, you cannot "fix" the criteria to match a static target, because the target moves in response to the fix.

  If a theory of classification assumes that a "perfect" set of criteria is possible—a set that captures the disorder without altering it—it is fundamentally incompatible with the looping effect. It assumes a God's-eye view where the observer does not disturb the observed. In psychiatry, the observer is part of the system.

  Therefore, any theory that aims for a "final, correct" DSM is ruled out. The spec demands a theory that views the manual as a **control panel**, not a **map**. A map implies the territory is fixed. A control panel implies that pushing the buttons changes the machinery.

  **Conclusion:**
  To handle "Algorithmic Burnout" and its kin, we cannot build a theory of discovery. We must build a theory of **engineering**. We are not finding kinds; we are making them, and we are responsible for the shape they take. The spec requires a philosophy that accepts this responsibility without collapsing into nihilism. We must judge classifications not by their "truth" in a static sense, but by the *kinds of people they invite us to become*.
