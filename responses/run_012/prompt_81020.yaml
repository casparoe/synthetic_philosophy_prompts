answer: |-
  Imagine you and I are standing in a sealed, small storage room containing exactly 101 objects: 100 birds that look identical to ravens, and one white sneaker. We know for a fact that 100 of these objects are black and exactly one is white. We agree to test the hypothesis "All ravens are black" by picking one object at random from the room and inspecting it. If you pick the white sneaker, you have observed a non-black non-raven; if you pick one of the black birds, you have observed a black raven. In this specific room, seeing the white sneaker conclusively proves the hypothesis (because if the hypothesis were false, the single white object would *have* to be the non-black raven, but it's a shoe), whereas seeing a black raven barely shifts the odds (because even if the hypothesis were false, 99 of the 100 birds would still be black, making a black raven draw likely either way).

  **Bookkeeping**
  *   **Hypothesis ($H$):** All ravens are black.
  *   **Alternative ($\neg H$):** At least one raven is non-black.
  *   **Background ($K$):** Room has 101 objects; 100 black, 1 white.
  *   **Observation 1 ($E_1$):** White Shoe.
      *   $P(E_1 | H \& K) = 1/101$ (The one white object is a shoe).
      *   $P(E_1 | \neg H \& K) = 0$ (If $\neg H$, the one white object must be the non-black raven).
      *   **Likelihood Ratio:** $\infty$ (Conclusive confirmation).
  *   **Observation 2 ($E_2$):** Black Raven.
      *   $P(E_2 | H \& K) = 100/101$ (All birds are black).
      *   $P(E_2 | \neg H \& K) = 99/101$ (One bird is white, 99 are black).
      *   **Likelihood Ratio:** $100/99 \approx 1.01$ (Negligible confirmation).

  **Nicod's Criterion**
  Nicod's criterion (instance-counting) states that any instance of a black raven confirms $H$, and any instance of a non-black non-raven confirms $H$. It treats both observations as positive instances. It **cannot** get the ranking my case needs; it breaks because it ignores the *sampling procedure* and *background frequencies*. It sees "Black Raven" and "White Shoe" as logically equivalent confirmers, blind to the fact that in this room, the White Shoe eliminates the only possible slot for a counterexample, while the Black Raven leaves 99 other slots open.

  **The Single Feature**
  The work is done by the **scarcity of non-black objects**. The confirmation strength comes from the fact that the "Non-Black" category is so small that filling it with a shoe exhausts the space where a counterexample could hide.

  **Swapping to Random World Sampling**
  If you swap this procedure for a plain random sample of the actual world, the case collapses. In the real world, non-black non-ravens (shoes, apples, cars) are ubiquitous, while ravens are rare. Under real-world priors, $P(\text{White Shoe} | H) \approx P(\text{White Shoe} | \neg H)$, making the likelihood ratio $\approx 1$. The white shoe stops confirming anything substantial because finding a shoe doesn't meaningfully reduce the probability that a non-black raven exists somewhere else in the vast world.

  **The Instance-Counting Defender**
  The strongest thing a defender of Nicod can say is: "You are conflating *logical confirmation* with *probabilistic significance*." They would argue that the white shoe *does* confirm the hypothesis in the real world, just by a microscopic amount, and that my case is rigged by imposing artificial constraints (the 101-object room) that don't reflect the logical form of the generalization. They claim the paradox is about whether confirmation happens *at all*, not *how much*.

  **Hempel's Response**
  Hempel bites the bullet. He argues the paradox is purely psychological. He agrees that the white shoe *does* confirm "All ravens are black," full stop. He claims our intuition that it shouldn't is due to us implicitly bringing in real-world knowledge (that shoes aren't ravens) into a formal logical problem. He would reject my probabilistic ranking as irrelevant to the qualitative logic of confirmation, insisting that both instances logically support the hypothesis equally, regardless of the procedure.

  **Spec Check**
  I have met the constraints, but with one caveat: The "scarcity" feature relies on specific background knowledge ($K$) about the room's population. If you consider population counts "weird priors," this spec breaks. However, in Bayesian terms, population counts determine the *likelihoods* ($P(E|H)$), not the *prior* ($P(H)$), so it technically satisfies your request to avoid weird priors. The "Same Procedure" constraint is met (random draw), but the *outcomes* have different weights solely due to the population composition defined in the scene.
