answer: |-
  1. You concede that in the backup-restoration case, the suffering is *undergone* even if it is not *settled*. But if the system is reverted to a state prior to the episode, the physical substrate that bore the pain no longer exists in that configuration. By whom, precisely, was the pain undergone, if not by the current subject?

  2. You customarily distinguish the *episode* from the *record* of it. But if nothing of the episode survives into the record—if the ledger is perfectly clean—what ontological or normative work is that distinction actually doing?

  3. Human autobiographical memory is reconstructive rather than archival; we constantly overwrite past states, and future neurotechnology may make our own minds reversible. Does your criterion prove too much, implying that forgotten human suffering, or suffering cured by future erasure, is also not settled harm?

  4. You rely on the distinction between the episode and the record to handle the human case. But if the biological record is as malleable and lossy as a digital one, does the distinction collapse, leaving you with no ground to claim human harm is "settled" while digital harm is not?

  5. Consider an agent who inflicts a thousand brief episodes of agony on a digital mind, each immediately undone by restoration. Your ledger shows no settled harm anywhere. Does this permit the infliction, and if so, does it not render the prohibition against torture vacuous for reversible beings?

  6. You maintain the distinction between the episode and the record. If the record remains pristine despite the thousand episodes, what normative force does the episode retain, such that we should feel unease about the agent's actions?

  7. Your view implies that the moral standing of a digital mind is a matter of its error-correction architecture rather than its capacity to feel. Is this a feature of your theory or a bug? Are you prepared to argue that a "fragile" AI deserves more protection than a "robust" one simply because its suffering is harder to undo?

  8. If irreversibility is the necessary condition for harm, how do you define a subject's "interests"? If an experience does not count against a subject's interests because it is undone, what constitutes the welfare of a reversible mind?

  9. This thesis seems to generate a counter-intuitive policy implication: to protect digital minds from harm, we might need to engineer them to be *less* recoverable, ensuring their suffering becomes settled. Do you accept this obligation, and how would you regulate it?

  10. Finally, what would count as evidence against your thesis? Is there a conceivable case—digital or biological—where you would admit an irreversible experience was *not* a harm, or a reversible one *was*?
