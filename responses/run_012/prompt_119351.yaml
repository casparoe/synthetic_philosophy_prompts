answer: |-
  **JOINT STATEMENT ON THE STRUCTURE OF SELF-DECEPTION**

  **I. AGREED CLAIMS AND SHARED PREMISES**

  Before articulating our divergences, we affirm the following common ground regarding the phenomenon under investigation. These claims establish the data any adequate theory must accommodate and exclude assumptions that prejudge the mechanism.

  1.  **The Phenomenological Core:** We agree that there exists a recognizable class of psychological states and behaviors colloquially labeled "self-deception." These are characterized by a subject holding a belief that appears unjustified by their available evidence, where the formation or maintenance of that belief serves a motivational end (e.g., reducing anxiety, preserving self-esteem).
  2.  **Standard Cases:** Any account must explain the following paradigmatic scenarios without dismissing them as errors:
      *   *The Faithful Husband:* A man maintains a belief in his spouse's fidelity despite overwhelming evidence of infidelity, without reporting a conscious decision to ignore the evidence.
      *   *The Envelope Avoider:* A patient delays opening medical results, behaving in ways that suggest they believe the news will be bad, while avowing hope or belief that it will be good.
      *   *The Denial of Jealousy:* An individual sincerely denies feeling jealousy while exhibiting behavioral and physiological markers consistent with that emotion, observable to third parties.
  3.  **Motivation is Central:** Both camps agree that motivation plays a causal role. In standard cases, the subject believes $p$ (e.g., "I am loved") rather than $\neg p$ because believing $p$ is psychologically beneficial. The disagreement concerns *how* motivation produces the belief, not *whether* it does.
  4.  **No Question-Begging Definitions:** We agree to avoid defining "deception" in a way that automatically excludes one camp. Specifically:
      *   We will not assume *a priori* that deception logically requires a conscious intention to deceive (begging against the deflationist).
      *   We will not assume *a priori* that a single subject cannot harbor conflicting cognitive states simultaneously (begging against the divisionist).
  5.  **Sincerity of Avowal:** We agree that in typical cases, the self-deceived subject is not consciously lying. When they avow the false belief, they are not reporting a known falsehood. The tension lies between their avowal and their evidence-sensitive behavior.

  **II. STATEMENT OF REMAINING DISAGREEMENTS**

  The following table isolates the specific points of contention. For each crux, we provide the formulation each camp accepts as accurate to its own view, followed by the empirical or argumentative terrain we agree is relevant, and our divergent predictions.

  | Crux | Divisionist Formulation | Deflationist Formulation | Agreed Evidence / Test | Divisionist Prediction | Deflationist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Intention Requirement** | Self-deception is an intentional activity. The subject intends to bring about a belief they have reason to think false. This intention may be sub-personal or obscured, but it is teleological. | Self-deception is a causal outcome of motivated bias. No intention to deceive is required; the subject intends only to reduce anxiety, and the false belief is a byproduct. | Analysis of "successful" vs. "failed" self-deception. If the subject can strategically manipulate evidence gathering (e.g., avoiding friends who know the truth), this implies agency. | Strategic evidence-avoidance implies a guiding intention to remain ignorant, supporting the intention requirement. | Strategic avoidance is a habit driven by fear, not a plan to deceive. It requires only a desire to avoid pain, not an intent to falsify belief. |
  | **2. Contradictory Beliefs** | The self-deceiver must hold contradictory beliefs ($p$ and $\neg p$) either simultaneously in partitioned subsystems or sequentially. One part knows the truth; the other believes the falsehood. | The self-deceiver holds only the false belief $p$. The appearance of knowing $\neg p$ is explained by behavioral leakage or subconscious processing, not a second belief state. | Neuroimaging or reaction-time studies during avowal. If brain regions associated with conflict detection light up when the subject avows $p$, it suggests concurrent access to $\neg p$. | Conflict signals indicate simultaneous access to contradictory truth-values, supporting partition. | Conflict signals indicate emotional dissonance or cognitive dissonance, not the presence of a contradictory *belief*. |
  | **3. Mental Architecture** | The mind must be partitioned (divided agency). A unified subject cannot intend to make itself believe what it knows is false without paradox. | The mind is unified but epistemically flawed. Biased evidence weighting, selective attention, and rationalization are sufficient without partitioning. | Cases of "divided attention" vs. "divided mind." If self-deception breaks down under cognitive load that unifies attention, it suggests a unified system. | Cognitive load may impair the deceiving subsystem, revealing the truth, confirming distinct subsystems. | Cognitive load reduces capacity for complex rationalization, causing the bias to fail, confirming a unified but resource-limited system. |
  | **4. Distinctness from Wishful Thinking** | Self-deception is *sui generis*. It involves a deceptive strategy distinct from simple wishful thinking, which may not issue in full belief. | Self-deception is a species of motivated irrationality. There is no sharp line between wishful thinking and self-deception; it is a continuum of bias. | Unmotivated false beliefs. If subjects form false beliefs without motivational benefit, is it self-deception? | Unmotivated false beliefs are errors, not self-deception. The motivational *strategy* defines the category. | Unmotivated false beliefs are simply errors. Motivated ones are bias. Adding "deception" adds no explanatory power. |
  | **5. Temporal Spreading** | Spreading contradictory beliefs over time (knowing $\neg p$ at $t_1$, believing $p$ at $t_2$) rescues the literalist view only if the transition is intentionally managed. | Spreading beliefs over time concedes the literalist point. If the subject does not hold contradictions simultaneously, it is just changing one's mind irrationally. | Longitudinal studies of belief revision. Do subjects actively suppress evidence at $t_1$ to ensure belief at $t_2$? | Active suppression indicates an intentional project spanning time, preserving the deception model. | Suppression is a defensive reflex. The lack of simultaneous contradiction removes the need for a "deceiver" entity. |

  **III. THE VERBAL DISPUTE AND SUBSTANTIVE REMAINDERS**

  We recognize that a portion of our dispute is verbal, centering on the label "deception." The Divisionist insists on the intention requirement partly as a stipulation about how the phrase *ought* to be used: if there is no intent to mislead, calling it "deception" is metaphorical at best. The Deflationist counters that philosophical taxonomy should track psychological mechanisms, not folk-etymology. If the mechanism is biased processing rather than strategic misleading, the term "deception" misleads us.

  However, setting aside the label, a substantive disagreement survives. It concerns the **architecture of agency**. The Divisionist claims the phenomenon requires a description of the subject as an agent acting upon herself, employing strategies (even if unconscious) to manage her own doxastic state. The Deflationist claims the subject is passive with respect to the belief formation; the belief happens *to* her via causal mechanisms of bias, not *by* her via strategic management.

  If we agree to call the phenomenon "Motivated Doxastic Irrationality" (MDI) to bypass the semantic tug-of-war, the Divisionist maintains that MDI involves sub-agential conflict and strategic information control. The Deflationist maintains that MDI involves unified but flawed heuristic processing. Thus, the dispute is not merely about the word "deception," but about whether the explanation of the phenomenon requires positing conflicting sub-agencies or merely conflicting inputs within a single agency.

  **IV. FALSIFICATION CONDITIONS AND MOVING EVIDENCE**

  To move beyond stalemate, we identify the specific findings that would compel each camp to revise or abandon its position.

  **For the Divisionist:**
  The Divisionist view would be undermined by conclusive evidence that the psychological processes underlying self-deception are indistinguishable from standard, non-strategic cognitive biases (e.g., confirmation bias) that operate without any capacity for information suppression. Specifically, if it were demonstrated that subjects cannot strategically avoid evidence even when incentivized to do so, but only exhibit passive avoidance correlated with anxiety levels, the claim of an "intention to deceive" loses its empirical anchor. The Divisionist requires evidence of *active* management of the doxastic environment.

  **For the Deflationist:**
  The Deflationist view would be undermined by evidence of "knowing avoidance" that cannot be explained by anxiety reduction alone. If subjects demonstrate the ability to accurately track the truth for practical action (e.g., making financial or medical plans based on $\neg p$) while simultaneously avowing $p$, and this dual-tracking is shown to be functionally integrated rather than modularly partitioned, the Deflationist account of simple bias fails. The Deflationist requires that the subject be genuinely ignorant of the truth they are avoiding; evidence of covert knowledge utilized for planning contradicts the "unified mind" model.

  **Shared Moving Evidence:**
  Both camps agree that the following finding would significantly advance the debate: **Dissociation between behavioral guidance and avowed belief.**
  If experiments show that self-deceived subjects guide their high-stakes decisions using the truth ($\neg p$) while sincerely avowing the falsehood ($p$), this supports the Divisionist claim that the truth is retained somewhere in the system (partition).
  Conversely, if experiments show that self-deceived subjects guide their high-stakes decisions using the falsehood ($p$) to their own detriment, despite having access to clear evidence for $\neg p$, this supports the Deflationist claim that the belief is genuinely held and the "knowledge" of the truth is merely behavioral habit, not a cognitive state.

  We sign this statement acknowledging that while our models of the mind differ, our commitment is to the phenomenon as it presents itself, not to the preservation of our preferred terminology. The goal of this reading group is to determine which model best predicts the data outlined above.
