answer: |-
  **Setup & Mechanics**
  Adjust to 14 cards for 14 students. **Dial A:** "Total Commute Delay (minutes)." **Dial B:** "Annual Fatal Accident Risk (%)."
  *   **Card 1:** 0 mins delay, 1.0% risk.
  *   **Card 14:** 1400 mins delay, 0.0% risk.
  *   **Step:** Each card adds 100 mins delay, reduces risk by ~0.07%.
  *   **The Rule:** Compare with neighbor to right. If their Dial A is lower (better), **swap**. (Ignore Dial B).
  *   **Flow:** Pass left-to-right, then right-to-left. Repeat until stable.

  **The Prediction Ledger**
  Hand out index cards before revealing the Rule. Students write:
  1.  **Global Judgment:** "Looking only at Card 1 and Card 14: Which outcome is morally worse?" (Circle: Start / End).
  2.  **Stability Prediction:** "Given the cards in this room, do you expect to be holding your current card after 5 minutes?" (Yes / No).
  3.  **Reasoning:** One sentence on why.

  Collect these. They are evidence for the debrief.

  **Payoffs**
  *   **Teams:** Odds vs. Evens.
  *   **Points:** 1 point per successful swap executed correctly. (Incentivizes compliance with the Rule, not moral agreement).
  *   **Power:** The student holding the card deemed "Worst" by majority vote at the end chooses the next seminar topic. (Creates stakes for the final distribution).

  **Debrief Strategy**
  1.  **Reveal the Contradiction:** Project the Ledgers. Most will likely say Card 14 (1400 mins delay) is worse than Card 1 (1% death risk), or vice versa, but *all* local swaps felt negligible.
  2.  **Map the Structure:** Draw the chain on the board. Highlight that every single swap was rational under the Rule, but the aggregate trajectory violated their Global Judgment.
  3.  **The "Gut" Moment:** Ask the student holding Card 14: "You swapped 13 times. At which swap did you feel you were making a mistake?" (Usually, none). This isolates the failure of intuition over small differences.
  4.  **Handling Pushback:** If students rebel ("The rule is stupid!"), validate them. Say: "Exactly. This rule mimics how bureaucracies measure 'efficiency' by isolating variables. When did measurement stop serving value?"

  **Limitations (Be Straight)**
  This game does not prove *logical* intransitivity (A>B, B>C, C>A). It demonstrates **Preference Reversal via Sorites Steps**.
  *   **The Gap:** The Rule imposed lexicographic priority (A always beats B). True value intransitivity requires students to *voluntarily* prefer A>B, B>C, and C>A without external coercion.
  *   **The Fix:** In discussion, clarify that real-world intransitivity happens when *we* endorse the local trade-offs but reject the global outcome. This game forces the trade-off; real life seduces us into it.
  *   **Measurement Trap:** The game shows that aggregating local measurements can obliterate global values. It doesn't show that "better than" is logically intransitive, but that "measurable improvement" is not always "moral improvement."

  **Logistics Check**
  *   **Time:** 10 min setup/ledger, 20 min swapping, 10 min tally, 40 min debrief.
  *   **Room:** Ensure students can move physically. Swapping cards is clearer than swapping seats.
  *   **Prep:** Print cards large. Ensure the math on the dials is visible.

  **Instructor Note:** If the class unanimously agrees Card 1 is worst and the Rule drives them to Card 14, the tension is highest. If they agree with the Rule's outcome, the lesson fails. Pre-test the dial values to ensure the endpoints are genuinely controversial.
