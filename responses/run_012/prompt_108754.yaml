answer: |-
  Right, first off: tell your flatmate to put the kettle on and lower his voice. You've actually stumbled upon one of the proper big debates in the philosophy of mind, so neither of you is talking rubbish. He's essentially reciting the standard objection to Global Workspace Theory (GWT) laid out by philosophers like Ned Block and David Chalmers. It's a very tidy argument, but whether it's the whole truth is another matter.

  Here's the breakdown of where you both stand, pitched so you can settle this without needing a PhD in neuroscience.

  ### The Flatmate's Argument: Access vs. Phenomenal
  Your mate is drawing a distinction made famous by Ned Block in the 90s. He's splitting consciousness into two camps:
  1.  **Access Consciousness (A-consciousness):** This is about utility. Can the brain use the information? Can you report it? Can you reason with it?
  2.  **Phenomenal Consciousness (P-consciousness):** This is the "feel." The redness of red, the sting of a wasp bite. The subjective experience itself.

  His point about blindsight is spot on. Patients with damage to their visual cortex can sometimes point to objects they claim they can't see. Their brain is accessing the info (A-consciousness), but they insist there's no visual experience (no P-consciousness).

  So, his critique is: GWT explains how information gets broadcast around the brain so you can talk about it or act on it. That's access. But it doesn't explain why that broadcasting *feels like anything* at all. If he's right, GWT solves the "Easy Problems" (mechanisms of reportability) but completely dodges the "Hard Problem" (why there's an inner movie playing).

  ### The GWT Counter-Argument
  Now, here's where you can push back. Proponents of GWT, like Stanislas Dehaene or Bernard Baars, generally aren't too keen on this sharp split. Their argument is that once information is globally broadcast to all the specialised systems in the brain (memory, language, motor control), *that broadcasting just is* what consciousness feels like.

  They'd argue your flatmate is creating a mystery where there isn't one. To a GWT theorist, there isn't a little homunculus sitting in the workspace watching the screen. The "feeling" is constituted by the availability of the information. If you have full access, you have phenomenology. They'd likely argue that blindsight patients actually lack the specific kind of global broadcasting that constitutes conscious experience, so it's not a separate system, just a broken pipeline.

  ### So, to answer your specific questions:

  **1. If access and phenomenal are genuinely two different systems, what does it mean for GWT to be a theory of consciousness?**
  If your flatmate is right, then GWT is technically a theory of *cognitive access*, not consciousness proper. It becomes a theory of how the brain organises data for use, rather than why we have subjective experiences.
  In philosophical terms, this means GWT is a functionalist theory that fails to address qualia (subjective instances of sensory experience). It would mean GWT explains the *functions* of consciousness (why we can say "I see a cup") but not the *existence* of consciousness (why seeing the cup feels like something). It renders GWT incomplete regarding the "Hard Problem." It's like explaining how a television transmits a signal (access) without explaining why the picture appears on the screen (phenomenology).

  **2. If broadcasting to the workspace is what makes something conscious, does that mean a big enough silicon workspace would actually feel like something?**
  Yes. If you side with the GWT proponents, you are signing up for **functionalism**. This is the idea that consciousness is defined by what the system *does*, not what it's made of.
  If consciousness is simply the act of globally broadcasting information to specialised subsystems, then the substrate doesn't matter. Whether it's wet, grey biological neurons or dry, shiny silicon chips, if the architecture performs the same function, it should have the same experience.
  So, under strict GWT, a sufficiently complex computer with a global workspace would indeed "feel like something" to be that computer. It would have access consciousness, and because GWT equates access with phenomenology, it would have phenomenal consciousness too.

  However, if your flatmate is right (that P-consciousness is separate), then you could build a perfect silicon GWT that acts exactly like a human but has no inner life whatsoever. It would be a "philosophical zombie" — talking about pain without feeling it.

  ### The Verdict
  Honestly? You're at a stalemate, and it's a metaphysical one, not just a scientific one.
  *   **Your flatmate** is holding the line that experience is something over and above function. This is philosophically robust but hard to prove scientifically.
  *   **You** (if you defend GWT) are holding the line that experience is a functional state. This is scientifically tractable but feels counter-intuitive to many (the "what it's like" factor).

  GWT is currently one of the leading scientific theories because it's testable (we can measure global broadcasting with EEGs). Your flatmate's position is harder to test because you can't measure "feelings" directly, only reports of them.

  **My advice?** Tell him he's won on the philosophy (the distinction is valid), but you'll win on the science (GWT is the only one giving us testable predictions). Then suggest you both stop shouting about qualia and go to the pub. Consciousness is much easier to understand after a pint.
