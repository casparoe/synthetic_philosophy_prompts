answer: |-
  ### The Taxonomy of Mental Illness

  This tree maps the logical space of definitions. It begins with the most fundamental ontological disagreement and branches into specific criteria. Each leaf represents a coherent position; some are occupied by well-known theories, others are logical possibilities that remain largely unoccupied.

  **Root Question:** **To call a condition a "mental illness," must there be a broken mechanism inside the person's biology or psychology?**
  *   **Yes:** (Go to Branch A: The Internalist Path)
  *   **No:** (Go to Branch B: The Externalist Path)

  ---

  #### Branch A: The Internalist Path (A broken mechanism is necessary)

  **Node A1:** **Is "broken" defined by being statistically rare, or by failing to perform a specific function?**
  *   **Statistically Rare:** (Go to Leaf 1)
  *   **Failing a Function:** (Go to Node A2)

  > **Leaf 1: Statistical Naturalism**
  > *   *Position:* Illness is any deviation from the statistical average of the species.
  > *   *Awkward Commitment:* A genius with an IQ of 180 is as "disordered" as someone with an IQ of 50, unless you arbitrarily define "normal" as "healthy."
  > *   *Status:* **Occupied** (e.g., early psychometrics).

  **Node A2:** **Whose function counts? The species' evolutionary history or the individual's personal goals?**
  *   **Individual's Goals:** (Go to Leaf 2)
  *   **Species' History:** (Go to Node A3)

  > **Leaf 2: Goal-Based Naturalism**
  > *   *Position:* Illness is an internal failure that stops the person from achieving what *they* want to achieve.
  > *   *Awkward Commitment:* A monk who voluntarily renounces all ambition cannot be ill, even if his brain is ravaged by psychosis, provided he values the experience.
  > *   *Status:* **Occupied** (e.g., some patient-centred models).

  **Node A3:** **If the mechanism fails its evolutionary purpose, does it still count if the person is happy and values the trait?**
  *   **Yes, Broken is Broken:** (Go to Leaf 3)
  *   **No, Must Cause Harm:** (Go to Node A4)

  > **Leaf 3: Value-Free Pathology**
  > *   *Position:* Dysfunction is a biological fact independent of whether the person suffers or benefits.
  > *   *Awkward Commitment:* Someone who meets every criterion for a neurodevelopmental condition, values the traits in question, and wants nothing changed is still "ill" and arguably ought to be cured.
  > *   *Status:* **Occupied** (e.g., strict biological psychiatry).

  **Node A4:** **If the person is harmed, does it matter if the cause is a normal reaction to a terrible situation (like a cruel marriage)?**
  *   **No, Mechanism Trumps Cause:** (Go to Leaf 4)
  *   **Yes, Context Rules It Out:** (Go to Leaf 5)

  > **Leaf 4: Acontextual Medicalism**
  > *   *Position:* If the internal machinery is malfunctioning, the external cause is irrelevant to the diagnosis.
  > *   *Awkward Commitment:* A man whose misery is an accurate response to an intolerable marriage has the same "illness" as a man who is miserable for no reason, provided their brain states are identical.
  > *   *Status:* **Occupied** (e.g., standard DSM-style operationalism).

  > **Leaf 5: Contextual Naturalism**
  > *   *Position:* A mechanism is only "broken" if it fails in the context where it was designed to operate.
  > *   *Awkward Commitment:* Grief that continues well past the point a culture expects might be healthy in one context and pathological in another, making the biology secondary to the biography.
  > *   *Status:* **Occupied** (e.g., Wakefield's Harmful Dysfunction).

  ---

  #### Branch B: The Externalist Path (No broken mechanism necessary)

  **Node B1:** **Is "illness" a name for real human suffering, or a tool used by society?**
  *   **Name for Suffering:** (Go to Node B2)
  *   **Tool Used by Society:** (Go to Node B3)

  **Node B2:** **Is the suffering defined by the individual or by cultural expectations?**
  *   **By the Individual:** (Go to Leaf 6)
  *   **By Cultural Expectations:** (Go to Leaf 7)

  > **Leaf 6: Subjective Distress**
  > *   *Position:* Illness is whatever the person experiences as unbearable suffering, regardless of cause or function.
  > *   *Awkward Commitment:* A person who believes they are suffering due to a curse is ill, even if no psychological or social mechanism can be found to explain the pain.
  > *   *Status:* **Occupied** (e.g., phenomenological psychiatry).

  > **Leaf 7: Cultural Deviance**
  > *   *Position:* Illness is behavior that violates the norms of a specific society.
  > *   *Awkward Commitment:* A condition whose diagnostic status was reversed by a vote of a professional body rather than by any discovery was never truly changed, only re-labelled; homosexuality was always either ill or not, based on the vote.
  > *   *Status:* **Occupied** (e.g., labeling theory).

  **Node B3:** **Does the label mean the same thing in a clinic, a courtroom, and a school?**
  *   **Yes, One Stable Concept:** (Go to Node B4)
  *   **No, It Changes by Context:** (Go to Leaf 8)

  > **Leaf 8: Pragmatic Indexicalism**
  > *   *Position:* "Is this an illness?" has different answers depending on which practice is asking (licensing a drug, granting accommodation, excusing conduct).
  > *   *Awkward Commitment:* There is no fact of the matter about whether a person *is* ill, only whether it is useful to treat them as such in a specific setting; this risks making truth entirely subordinate to bureaucracy.
  > *   *Status:* **Occupied** (e.g., pragmatic naturalism).
  > *   *Note:* This is not a dodge; it is a claim that the concept is essentially heterogeneous.

  **Node B4:** **Is the tool used mainly to excuse the person from responsibility, or to justify controlling them?**
  *   **To Excuse:** (Go to Leaf 9)
  *   **To Control:** (Go to Leaf 10)

  > **Leaf 9: The Exemption Device**
  > *   *Position:* Calling something an illness is a social move to remove blame from the sufferer.
  > *   *Awkward Commitment:* If a condition becomes treatable, the person loses the right to the "sick role" and must be held responsible for remaining symptomatic.
  > *   *Status:* **Unnamed/Unexplored.** (Most who focus on exemption also acknowledge control; few argue exemption is the *sole* function).

  > **Leaf 10: The Coercive Device**
  > *   *Position:* Calling something an illness is chiefly a device for licensing coercion or social management.
  > *   *Awkward Commitment:* Depression, ADHD and the rest are not illnesses at all but troubles in living, and the medical label is a myth used to expand professional power over private life.
  > *   *Status:* **Occupied** (e.g., Szaszian anti-psychiatry).

  ---

  #### Unoccupied Logical Space

  > **Leaf 11: Biological Constructivism**
  > *   *Position:* There is a broken internal mechanism, but only a professional vote can decide what counts as "broken."
  > *   *Awkward Commitment:* Biological reality is subject to democratic procedure; a neuron fires differently because a committee voted to change the manual.
  > *   *Status:* **Unnamed/Incoherent.** (Combines realist ontology with constructivist epistemology in a way that undermines the realism).

  ---

  ### Analysis of the Tree

  **1. Load-Bearing Branches**
  The split at the **Root (Internal Mechanism vs. No Mechanism)** is the primary load-bearing structure. If you collapse this, the distinction between medical models (Branch A) and social models (Branch B) dissolves, and the tree loses its ability to distinguish your position from your friend's.
  The second most critical node is **Node A4 (Context vs. Mechanism)**. This is where the "grief" and "intolerable marriage" cases are decided. If you collapse this, you cannot distinguish between a chemical depression and a rational response to trauma, which is often the core of clinical disagreement.

  **2. The Tree-Redrawing Answer**
  The single answer that would force me to redraw the tree is **"Yes" at Node B3** (The label means the same thing in all contexts) **combined with "It is a Tool" at Node B1.**
  Currently, the tree assumes that if you think "illness" is a social tool (B1), you are likely to accept that the tool's function varies by context (B3). If someone argues that "Illness is a stable, universal social tool for control" (rejecting Indexicalism), they occupy a space that is currently split between Leaf 7 and Leaf 10. A hardline Foucaultian might argue the *function* (control) is stable across history, even if the *labels* change. Accommodating this would require a new branch separating "Stable Social Function" from "Variable Social Function."

  **3. Confidence Check**
  I am least confident in **Leaf 9 (The Exemption Device)**. I have represented it as "Unnamed/Unexplored." Defenders of the "sick role" (like Parsons) would recognize the exemption function, but few argue it is the *only* function to the exclusion of control or description. Critics of the sick role often conflate exemption with control. It is possible I have represented this position as its critics describe it (as merely making excuses) rather than how defenders see it (as a necessary condition for compassion). If there are pure defenders of "Exemption Only," they belong here, but they are rare.

  **4. Mapping Your Disagreement**
  *   **Your Friend (Szaszian):** Likely sits at **Leaf 10 (The Coercive Device)** on Branch B. He denies the Root (No internal mechanism necessary/true), views the label as a Tool (B1), sees it as Stable (B3-No), and focuses on Control (B4).
  *   **You (Medical/Realist):** Likely sit at **Leaf 4 (Acontextual Medicalism)** or **Leaf 5 (Contextual Naturalism)** on Branch A. You affirm the Root (Internal mechanism necessary), likely require Harm (A3), and are debating whether Context matters (A4).
  *   **The Talking Past:** You are arguing at the **Root**. He thinks the category is a social tool (Branch B); you think it is a description of internal state (Branch A). When you argue about "broken legs," you are appealing to Branch A logic (internal damage). He is appealing to Branch B logic (social categorization). You will not resolve this until you agree on whether the Root question is the right place to start.
