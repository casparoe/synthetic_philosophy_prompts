answer: |-
  A skeptic corners G.E. Moore. "Your proof is question-begging! You assume hands exist to prove hands exist!"

  Moore holds up his palms. "Here is one hand, here is another. Therefore, external things exist."

  "But you can't prove those are hands!" the skeptic cries. "For all you know, you're dreaming!"

  "I know they are hands," Moore says. "I just can't prove I'm not dreaming."

  "So you admit your premise is unproven!"

  "Yes," says Moore. "But I'd rather keep the hands and drop the proof than keep the proof and lose the hands."

  "That's not how logic works!"

  "No," Moore says, pocketing his hands. "It's how knowing works."

  ***

  ### The Straight Talk

  You asked me to be honest: **This is inherently a nerd joke.** There is no way to make G.E. Moore's "Proof of an External World" funny to a general audience without explaining the proof first, which kills the joke. However, for the target audience (someone who knows the proof), the humor lands on the audacity of Moore's common-sense pivot.

  **Where it takes liberties:**
  1.  **The Dialogue:** Moore didn't typically engage in street-corner debates like this. The proof was presented in a lecture ("Proof of an External World," 1939) and a paper ("A Defence of Common Sense," 1925). The dramatization simplifies his actual dialectical position.
  2.  **"Can't Prove I'm Not Dreaming":** Moore actually argued that because he *knows* he has hands, he *knows* he is not dreaming. He didn't concede the skeptic's premise that he couldn't know he wasn't dreaming; he argued that the knowledge of the hand *entails* the knowledge that he's not dreaming. The joke simplifies this to "I know hands, can't prove not dreaming," which is closer to how critics interpret him than how he interpreted himself.
  3.  **The "Proof" vs. "Knowing" Distinction:** The punchline ("It's how knowing works") leans on the contested reading that Moore was shifting the goalposts from *proof* to *knowledge*. Moore insisted he *was* offering a proof, provided you accepted the premises were known. The joke suggests he's abandoning the proof requirement entirely, which is a slight caricature of his "defence of common sense" strategy.

  **Verdict:** It works as wit for specialists, but it relies entirely on the tension between Cartesian skepticism and Moorean common sense. If you don't know why the skeptic thinks the premise is unproven, the punchline is invisible.
