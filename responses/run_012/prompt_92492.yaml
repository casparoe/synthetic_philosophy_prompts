      *   *Justification:* Systemic neonicotinoids persist in pollen and soil, making collateral damage to pollinators and soil health the primary ethical vector rather than the target pest's death.
  *   **Expected magnitude of harm from one homeowner's application:** 0.30
      *   *Justification:* A single garden is a negligible fraction of the landscape, making the immediate physical footprint small despite the chemical's potency.
  *   **Probability individual action has wrong-making causal impact (complicity):** 0.50
      *   *Justification:* This is the threshold problem; either complicity in collective harm matters morally, or only marginal physical contribution counts, with no consensus.
  *   **Probability permissibility is assessed by rule/disposition rather than isolated act:** 0.65
      *   *Justification:* Environmental ethics typically favors rule-utilitarian or virtue-based frameworks over act-consequentialism to prevent tragedy-of-the-commons outcomes.
  *   **Probability that less effective alternatives render the chemical choice decisive:** 0.70
      *   *Justification:* For ornamental plants, aesthetic preference rarely constitutes a "necessity" strong enough to override significant ecological risk in most moral frameworks.

  **Combination and Sensitivity**

  These terms do not multiply cleanly, but they function as a weighted filter. The high probability of indirect harm (0.85) and the low necessity of the act (0.70) create a strong presumption against the action. However, this presumption is capped by the low magnitude of individual impact (0.30). The "Complicity" term (0.50) acts as the key that unlocks whether that low magnitude matters. If individual complicity is morally null, the credence collapses near zero; if complicity is valid, the credence rises toward 0.8.

