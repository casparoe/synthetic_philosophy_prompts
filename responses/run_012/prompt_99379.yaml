      *   *Debate 2 (Aggregation Floor):* This is the "weak vs. strong discontinuity" problem. If mild suffering aggregates infinitely, SFE loses its distinctive "priority" claim against trade-offs. This needs a structural solution (lexicality or thresholds). It's tractable for philosophers (population ethics/measurement theory).
      *   *Debate 3 (Common Currency):* This is the measurement problem. If we can't compare suffering across minds (humans vs. AI vs. animals), SFE can't guide action. However, demanding a precise *unit* might be a category error. Ordinal rankings or rough cardinality might suffice. This is high risk/high reward.

