answer: |-
  **Summary**

  1.  **Can lexical priority be formalized without arbitrariness?** This addresses the "aggregation floor" and distinguishes Pure Negative Utilitarianism (NU) from suffering-prioritizing views. Resolving this determines whether SFE collapses into standard utilitarianism or remains distinct.
  2.  **What minimal comparability is required for action?** This addresses the "common currency" worry. We must determine if ordinal rankings suffice or if cardinal units are necessary for cross-mind comparison.
  3.  **How should agents act under moral uncertainty between SFE variants?** This bridges the axiological and action-guiding factions, providing a decision framework while foundational questions remain open.

  **Criteria**

  We prioritize questions based on **upstreamness**, **tractability**, and **downstream impact**. Upstreamness measures whether answering a question unlocks solutions to others; axiological structure dictates all subsequent policy recommendations. Tractability assesses whether a small team of philosophers can make progress using conceptual tools rather than requiring empirical data or massive collaboration. We favor questions where formal ethics and decision theory offer leverage. Downstream impact evaluates whether the answer changes resource allocation; if a distinction yields no difference in action-guidance, it is lower priority. We trade off tractability against upstreamness: highly foundational questions are prioritized even if difficult, provided they are not provably impossible. Questions that are merely definitional without practical consequence are deprioritized. The goal is to stabilize the theoretical core so that future empirical work has a coherent target.

  **The Ranking**

  **1. Can lexical priority be formalized without arbitrariness?**
  This is the most upstream question and directly addresses the trustee's distinction between Pure NU and suffering-prioritizing views, as well as the "aggregation floor" worry. The distinction does real work: Pure NU avoids aggregation problems but implies catastrophic obligations (e.g., destroying the universe to prevent minor suffering), while lexical views avoid this but risk collapsing into standard utilitarianism if mild suffering aggregates infinitely. Philosophers must determine if a principled lexical threshold exists—perhaps based on cognitive capacity or intensity discontinuity—that prevents the aggregation floor without being arbitrary. If this is impossible, the foundation must decide whether to fund Pure NU (high risk/high reward) or abandon SFE. If possible, it stabilizes the entire field. This question belongs to the axiological faction but dictates the action-guiding faction's scope. It is tractable for specialists in population ethics and value theory.

  **2. What minimal comparability is required for action?**
  This addresses the "common currency" worry. The absence of a precise unit of suffering is not a fatal defect but a tractable technical problem. The question is not whether we can build a "hedonimeter," but whether ordinal comparisons (A suffers more than B) suffice for priority-setting, or if cardinal ratios are needed to weigh risks. This is downstream of Question 1 (you must know *what* matters before comparing *how much*), but upstream of specific intervention analysis. If ordinal rankings suffice, the lack of a unit is irrelevant; if cardinality is required, SFE faces a severe measurement bottleneck. This is highly tractable for philosophers of mind and measurement theory. Resolving this prevents the foundation from funding work that demands impossible precision.

  **3. How should agents act under moral uncertainty between SFE variants?**
  This bridges the divide between the axiological and action-guiding factions. Since Questions 1 and 2 may not be fully settled in three years, we need a decision framework for acting while uncertain. Should a suffering-focused agent maximize expected choice-worthiness across Pure NU and lexical views? This question is downstream of the first two but offers immediate action-guidance. It is highly tractable using existing formal decision theory. Funding this ensures that even if foundational debates persist, the foundation can still generate robust policy recommendations. It prevents paralysis by providing a mechanism to operate despite theoretical disagreement, making it the most immediately useful output for the board.

  **Overrated or Closed**

  **Defending Pure NU against "destroy the universe" objections:** This is effectively closed. The implications are too radical for actionable grantmaking unless the foundation intends to fund existential risk creation, which is unlikely. Further defense yields diminishing returns.
  **Developing precise units of suffering:** This is a category error. Demanding a metrological standard for consciousness is like demanding a unit for "beauty." Funding should focus on comparability structures, not metrology.
  **Specific anti-natalist derivations:** These are derivative of Question 1. Until the axiological structure is settled, debating specific population policies is premature. Funding this now puts the cart before the horse.

  **What Would Change the Ranking**

  **Formal Impossibility Theorem:** If a philosopher proves lexical thresholds are mathematically incoherent, Question 1 drops, and priority shifts to damage containment (Question 3) or abandoning SFE.
  **Breakthrough in AI Consciousness:** If empirical markers for AI suffering emerge, Question 2 becomes urgent and tractable, moving up the list as cross-mind comparison becomes immediate policy rather than theory.
  **Shift to Direct Aid:** If the foundation pivots from research to direct grants, Question 3 becomes paramount, as theoretical precision matters less than robust decision-making under uncertainty.
