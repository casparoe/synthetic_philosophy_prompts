answer: |-
  # FINAL EXAMINATION: REALISM AND ANTI-REALISM
  **Time Allowed:** 50 Minutes
  **Instructions:** Answer the following question. Write clearly and concisely.

  **Question 1**

  Consider the following setup regarding the Knowability Paradox. The **Knowability Principle** states that every truth is knowable: for any proposition $p$, if $p$ is true then it is possible that $p$ be known ($\forall p (p \to \diamond Kp)$). Grant two further assumptions about knowledge: that it is **factive** (if $p$ is known then $p$ is true), and that it **distributes over conjunction** (if a conjunction is known then each of its conjuncts is known).

  These entail that no one can know the conjunction of $p$ with the proposition that nobody knows that $p$. For if that conjunction were known, distribution would yield knowledge both of $p$ and of the proposition that nobody knows that $p$, and factivity would make the second entail that $p$ is not known, contradicting the first. So the conjunction is unknowable. Yet if $p$ is a truth that nobody in fact knows, the conjunction of $p$ with the proposition that nobody knows that $p$ is itself a truth, and the Knowability Principle pronounces it knowable. That is a contradiction, and so the Principle implies that there are no unknown truths. An anti-realist who wishes to retain the Principle must restrict it in some way.

  A student in the class has proposed the following repair: the Knowability Principle should be asserted only of propositions that are not self-referential, on the model of the restrictions that keep the Liar and other semantic paradoxes at bay. The thought is that the paradox is a self-reference paradox, and that fencing the Principle off from self-referential propositions will fence it off from the trouble.

  **In an essay, address the following three points:**

  1.  Determine whether this self-reference restriction actually blocks the derivation. If it does not, identify precisely what feature of the offending proposition the restriction fails to engage.
  2.  State and defend a restriction that *does* block the derivation.
  3.  Say plainly what that restriction costs the anti-realist. What must be conceded or abandoned for the Knowability Principle to remain at once non-trivial and anti-realist in spirit? In your conclusion, briefly evaluate the viability of escaping the paradox by rejecting one of the other assumptions (factivity, distribution, or classical logic) instead.

  ***

  # MODEL ANSWER

  The proposed self-reference restriction fails to block the derivation because it misdiagnoses the logical structure of the paradox. The Liar Paradox ("This sentence is false") relies on semantic self-reference: the proposition refers to its own truth value. In Fitch's derivation, the offending proposition is $p \land \neg Kp$. This proposition is not self-referential in the semantic sense. It does not assert its own unknowability; it asserts $p$ and the distinct claim that $p$ is unknown. The contradiction arises not from a semantic loop, but from the interaction between the factivity of knowledge and the modal logic of the Knowability Principle. The proposition is "epistemically sensitive," not self-referential. Therefore, a restriction banning self-reference leaves the Fitch conjunction untouched, and the derivation proceeds unimpeded.

  To block the derivation, a restriction must prevent the Knowability Principle from applying to propositions of the form $p \land \neg Kp$. Let us call this the **Fitch Restriction**: $\forall p ((p \land \neg(p \land \neg Kp)) \to \diamond Kp)$. This effectively excludes the specific conjunction that generates the contradiction. However, implementing this restriction forces the anti-realist into a dilemma regarding the cost to their position.

  If the restriction is defined circularly—i.e., "The Principle applies only to propositions that are knowable"—the Knowability Principle collapses into the tautology "All knowable truths are knowable." This preserves consistency but strips the principle of its anti-realist content, which is meant to equate truth with knowability ($p \to \diamond Kp$). If the restriction is non-circular and syntactic (excluding specific logical forms), it appears ad hoc. More damagingly, if the anti-realist accepts the derivation's conclusion that there are no unknown truths to avoid the contradiction, they concede the realist's claim that all truths are actually known (or that there are no unknown truths). This destroys the anti-realist motivation, which is to allow for truths that are currently unknown but *capable* of being known, without collapsing into the claim that all truths are *already* known. The anti-realist must concede that the Knowability Principle cannot be a universal bridge from truth to knowledge without trivializing their position.

  Regarding alternative escapes, rejecting **factivity** is untenable, as a notion of "knowledge" that permits falsehoods is not knowledge. Rejecting **distribution over conjunction** weakens epistemic logic significantly; while some argue knowledge is not closed under conjunction, abandoning this for the sole purpose of saving anti-realism is theoretically expensive. The most viable route is rejecting **classical logic** in favor of intuitionistic logic. An intuitionist denies that $\neg \exists x (Tx \land \neg Kx)$ entails $\forall x (Tx \to Kx)$. They can accept that there are no *known* unknown truths without accepting that all truths are *known*. However, this requires abandoning bivalence and classical semantics, a high price that fundamentally alters the metaphysical landscape rather than merely repairing the Knowability Principle. Ultimately, the paradox suggests that a simple, non-trivial identification of truth with knowability is logically unstable.

  ***

  # MARKING SCHEME (20 Marks)

  | Criteria | First Class (16–20) | Competent (10–15) | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Critique of Self-Reference Restriction** (5 marks) | Clearly distinguishes semantic self-reference (Liar) from epistemic sensitivity (Fitch); explains why $p \land \neg Kp$ is not self-referential. | Identifies the restriction fails but offers vague reasoning about "logical structure" without distinguishing semantic types. | Confusing Fitch's paradox with the Liar paradox; claiming $p \land \neg Kp$ refers to itself. |
  | **2. Proposal of Effective Restriction** (5 marks) | Proposes excluding $p \land \neg Kp$ specifically; explains why this blocks the specific step of the derivation. | Proposes a restriction but fails to link it to the specific conjunction causing the contradiction. | Proposing a restriction that blocks too much (e.g., "no negative propositions") or too little. |
  | **3. Analysis of Costs/Triviality** (5 marks) | Articulates the dilemma: circularity leads to tautology; non-circularity leads to ad hocery or realist concession. | Notes the principle becomes trivial but misses the distinction between circular and syntactic restrictions. | Claiming the restriction solves the problem without any philosophical cost to anti-realism. |
  | **4. Evaluation of Alternative Escapes** (5 marks) | Evaluates all three (factivity, distribution, logic); identifies intuitionism as the only viable but costly option. | Discusses only one or two alternatives; fails to explain why intuitionism blocks the final inference. | Claiming rejecting factivity is a viable option for preserving the concept of knowledge. |

  **Total:** /20

  **Grading Notes:**
  *   **18-20:** Insightful, precise, no logical gaps, excellent handling of the intuitionistic alternative.
  *   **15-17:** Solid understanding, minor imprecisions in the cost analysis.
  *   **10-14:** Understands the paradox but struggles with the implications of the restriction.
  *   **0-9:** Fundamental misunderstanding of the derivation or the prompt requirements.
