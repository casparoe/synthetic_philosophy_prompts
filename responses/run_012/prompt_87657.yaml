prompt: |-
  I am a novelist at work on a historical novel set in a city that maintains an Office of Prodigies, a small bureau whose clerk must decide which reported wonders are to be entered into the public register and which are to be dismissed as fraud, error, or merely natural. The register has two columns: wonder, for an event for which no natural cause is known, and sign, for an event taken to carry a divine message. The clerk works alone, has at most a day for each report, and must defend every entry to a bishop who signs the register and who has political as well as theological interests. I have written several scenes in which the clerk must rule, and I cannot make them consistent without a procedure.

  Please write me a decision procedure the clerk can follow, grounded in the classical philosophical argument that a miracle is a violation of a law of nature and that testimony for such a violation faces a special burden of proof. I do not want a summary of that argument; I want it turned into something a clerk with no philosophical training can run on a report. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to certify, and where it must hand the decision to the bishop because the remaining question is one of values rather than facts. The procedure must say how to treat reports that depend on a single source, how to treat a naturalistic explanation that arrives after certification, how to treat two rival reports that cannot both be true, and how to treat a report whose certification would have consequences for a political or doctrinal dispute. It should distinguish between an event's occurrence and its significance, so that a naturalistic explanation may remove the wonder without removing the sign, and it should say what the clerk is to do when the evidence is genuinely mixed. It should also be honest about which of its steps are judgment calls dressed up as tests.

  Then run the procedure on two reports. First: a statue of a local saint is said to have wept during a drought; hundreds saw moisture on the statue, and the report has already been entered as a wonder. A naturalist later shows that a certain insect, common on old stone, secretes a fluid that can look like tears, and the statue is infested. Second: a child's fever breaks after a relic is applied; the witnesses are the mother, a neighbor who is the mother's brother, and a physician who arrived after the fever broke and who is known to disbelieve in relics; the priest who applied the relic has been promised a donation if the child recovers. In each case, tell me what the clerk should enter, what the bishop should decide, and what the clerk should write in the margin. I expect the procedure to give me an answer I will not like in at least one of these cases; do not soften it to protect the plot. Finally, tell me what the procedure cannot do, and where I should stop asking it to decide and instead let the characters disagree.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Novelist writing a historical novel.
      *   **Setting:** A city with an "Office of Prodigies."
      *   **Character:** A lone clerk who decides what goes into the public register (Wonder vs. Sign vs. Dismissal).
      *   **Authority:** A Bishop signs the register (political/theological interests).
      *   **Constraint:** The clerk needs a consistent *decision procedure* based on classical philosophical arguments about miracles (specifically Humean-style: violation of natural law + burden of proof on testimony), but translated into a practical checklist for a non-philosopher.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Stop points (refusal to certify).
          *   Hand-off points (to the Bishop for value judgments).
          *   Specific handling: Single source, post-certification natural explanations, rival reports, political/doctrinal consequences.
          *   Distinction: Occurrence (Wonder) vs. Significance (Sign).
          *   Mixed evidence handling.
          *   Honesty about "judgment calls dressed as tests."
          *   **Application:** Run the procedure on two specific cases (Weeping Statue, Fever/Relic).
          *   **Outcome:** Must give an answer the user might not like (no plot protection).
          *   **Limitations:** Explain what the procedure *cannot* do and where character disagreement should take over.

  2.  **Deconstruct the Philosophical Basis:**
      *   *Core Argument:* David Hume's "Of Miracles" (Enquiry Concerning Human Understanding).
      *   *Premise 1:* A miracle is a violation of the laws of nature.
      *   *Premise 2:* Laws of nature are established by firm and unalterable experience.
      *   *Premise 3:* Testimony is based on experience.
      *   *Conclusion:* No testimony is sufficient to establish a miracle unless the falsehood of the testimony would be *more* miraculous than the event itself.
      *   *Adaptation:* The clerk needs to weigh the probability of the event happening against the probability of the witnesses being mistaken or lying.

  3.  **Drafting the Procedure (The "Protocol of the Office"):**
      *   *Tone:* Bureaucratic, dry, precise, slightly weary.
      *   *Structure:* Step-by-step flowchart logic.
      *   *Step 1: Verification of Occurrence (The "Wonder" Test).* Is it real? Is it natural?
      *   *Step 2: Verification of Violation.* Does it break a known law?
      *   *Step 3: Verification of Testimony.* Are the witnesses reliable? (Hume's criteria: number, integrity, education, stake).
      *   *Step 4: Significance (The "Sign" Test).* This is theological/political. Clerk flags, Bishop decides.
      *   *Specific Clauses:*
          *   *Single Source:* Automatic dismissal unless the source is of unimpeachable character (and even then, risky).
          *   *Post-Certification Explanation:* Reclassify Wonder to Natural, keep Sign status if Bishop approves (separation of fact and meaning).
          *   *Rival Reports:* If $A$ and $\neg A$ both claimed, both dismissed as Wonder (cancellation of evidence).
          *   *Political/Doctrinal:* Hand off to Bishop immediately.
          *   *Mixed Evidence:* Default to dismissal (Burden of Proof lies with the claimant).
          *   *Honesty Clause:* Acknowledge where "common sense" masks bias.

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Make it usable:* Number the steps. Use "If/Then" logic.
      *   *Address the "Wonder vs. Sign" distinction:* Wonder = Fact (Did it happen? Was it unnatural?). Sign = Meaning (Did God do it?). The Clerk handles Wonder; the Bishop handles Sign.
      *   *Address the "Judgment Call":* Explicitly label steps where the clerk's bias enters.

  5.  **Running the Procedure on Case 1 (Weeping Statue):**
      *   *Facts:* Hundreds saw it. Entered as Wonder. Later: Insect secretion found.
      *   *Step 1 (Occurrence):* Moisture existed. (Pass).
      *   *Step 2 (Natural Law):* Stone weeping is unnatural. (Pass initially).
      *   *Step 3 (Testimony):* Hundreds of witnesses. (Strong).
      *   *New Evidence:* Insect secretion.
      *   *Protocol for Post-Certification:* If a natural cause is found, the "Wonder" status is revoked.
      *   *Sign Status:* Can still be a Sign (God used insects).
      *   *Clerk's Action:* Remove from Wonder column. Flag for Bishop regarding Sign.
      *   *Margin Note:* "Natural cause identified. Wonder void. Sign pending."
      *   *User Constraint:* "Give me an answer I will not like." The "unlikeable" part here might be that the *wonder* is destroyed, disappointing the faithful, even if the *sign* remains possible. Or, strictly applying Hume, if a natural explanation exists, the burden of proof shifts back. Let's make it harsher: The existence of a *possible* natural cause, once proven, invalidates the Wonder entirely. The Sign is now the Bishop's problem, but the Clerk must strike the Wonder.

  6.  **Running the Procedure on Case 2 (Fever/Relic):**
      *   *Facts:* Child recovers. Witnesses: Mother, Uncle (biased), Physician (skeptic, arrived late). Priest has financial stake.
      *   *Step 1 (Occurrence):* Fever broke. (Pass).
      *   *Step 2 (Natural Law):* Fevers break naturally. This is the key. Spontaneous remission is *not* a violation of natural law.
      *   *Humean Check:* Is it *more* probable the fever broke naturally, or that the law of physiology was violated? Natural remission is common enough.
      *   *Step 3 (Testimony):* Mother/Uncle (Interested parties). Physician (Disbeliever, late). Priest (Financial stake).
      *   *Protocol:* Interested witnesses reduce weight. Single event (fever breaking) is not a violation of law.
      *   *Result:* Dismiss as Wonder.
      *   *Sign:* Bishop decides, but Clerk recommends dismissal.
      *   *User Constraint:* "Answer I will not like." The user might want this to be a miracle for the plot. The procedure *must* crush it. It's a classic Humean failure: Fevers break naturally, and witnesses are biased.
      *   *Margin Note:* "Natural remission probable. Witnesses interested. Wonder denied."

  7.  **Addressing the "Limitations" Section:**
      *   Where does the procedure fail?
      *   It can't measure faith.
      *   It can't resolve the Bishop's political needs.
      *   It creates tension between the Clerk's duty (truth/process) and the Church's duty (faith/order).
      *   This is where the novel's conflict lives.

  8.  **Review against Constraints:**
      *   *Grounded in classical argument?* Yes (Humean burden of proof).
      *   *Not a summary?* Yes, it's a checklist.
      *   *Questions in order?* Yes.
      *   *Stop points?* Yes.
      *   *Hand-off points?* Yes.
      *   *Single source?* Addressed.
      *   *Post-cert explanation?* Addressed.
      *   *Rival reports?* Addressed.
      *   *Political consequences?* Addressed.
      *   *Wonder vs. Sign?* Distinguished.
      *   *Mixed evidence?* Addressed (default to dismissal).
      *   *Honest about judgment calls?* Yes.
      *   *Run on two reports?* Yes.
      *   *Unlikely answers?* Yes (Case 2 is crushed, Case 1 is downgraded).
      *   *Limitations?* Yes.

  9.  **Final Polish:**
      *   Ensure the tone is appropriate for a historical bureaucracy (stern, archival).
      *   Make sure the distinction between "Wonder" (Fact/Anomaly) and "Sign" (Meaning/Intent) is clear in the application.
      *   Check the "Answer I will not like" constraint. In Case 2, the procedure kills the miracle. In Case 1, it kills the *wonder* but leaves the *sign*. I need to make sure I don't soften Case 2. The procedure must say "No."

      *(Self-Correction during drafting Case 1)*: The prompt says the report *has already been entered* as a wonder. The procedure needs to handle *revision*. The prompt asks how to treat a naturalistic explanation that arrives *after* certification. The procedure must dictate a downgrade.
      *(Self-Correction during drafting Case 2)*: The prompt asks what the Clerk should enter. The procedure should lead to a rejection of "Wonder." The Bishop *could* overrule on "Sign," but the Clerk's recommendation must be negative based on the rules.

      *(Refining the "Judgment Call" honesty)*: I need to explicitly state in the procedure text where the clerk is essentially guessing or using bias under the guise of "experience."

      *(Refining the "Rival Reports")*: If two reports contradict (e.g., Sun stood still vs. Sun set normally), Hume says they cancel out. I need to ensure the procedure reflects this "cancellation of evidence."

      *(Final check on "Sign" vs "Wonder")*:
      Wonder = Violation of Nature (Clerk's domain primarily).
      Sign = Divine Message (Bishop's domain primarily).
      Clerk can dismiss Wonder, which usually kills Sign, but technically a Sign *could* be a natural event interpreted divinely. The prompt says: "naturalistic explanation may remove the wonder without removing the sign." I need to ensure the procedure allows for a "Natural Event / Divine Sign" category, but keeps it out of the "Wonder" column.

      Let's write.

      *Structure:*
      1. Introduction (The Protocol).
      2. The Decision Procedure (The Steps).
      3. Application to Case 1 (Statue).
      4. Application to Case 2 (Fever).
      5. Limitations & Narrative Advice.

      *Tone:* Bureaucratic, cold, precise.

      *Key Humean element:* "Weighing the miracle against the falsehood."
      *Key Clerk element:* "Is it safer to believe the law holds or the witness lies?"

      *Wait, one nuance:* The prompt asks for "what the clerk should enter, what the bishop should decide."
      In Case 1: Clerk removes Wonder. Bishop decides on Sign.
      In Case 2: Clerk denies Wonder. Bishop *could* declare Sign, but Clerk advises against it.
      I need to be firm on the Clerk's output.

      *Let's finalize the "Answer I will not like".*
      Case 2 is the big one. Most readers/novelists want the relic healing to be ambiguous or real. The procedure must call it "Natural Remission + Biased Witnesses."
      Case 1 is also good. The "Wonder" is removed. The magic is gone, even if the "meaning" stays.

      Okay, ready to generate.cs
answer: |-
  ### The Protocol of the Office of Prodigies
  **Version 4.2 (Revised under Episcopate of Valerius)**

  **Purpose:** To regulate the entry of reports into the Public Register under the columns of **WONDER** (violation of natural law) and **SIGN** (divine intent).
  **Authority:** The Clerk of Prodigies acts as the filter of fact; the Bishop acts as the arbiter of meaning.
  **Philosophical Basis:** A law of nature is established by uniform experience. To certify a Wonder is to assert that the experience of the witness outweighs the uniform experience of all mankind.

  ---

  #### I. The Decision Procedure

  **Step 1: The Test of Occurrence (Fact)**
  *Question:* Did the event happen as described?
  *   **Sufficient Answer:** Corroboration by at least two disinterested witnesses of sound mind, OR one witness of unimpeachable character (e.g., a magistrate, a senior physician) whose reputation would be ruined by falsehood.
  *   **Refusal:** If the report relies on a single source of ordinary standing, or if witnesses contradict each other on material details (time, place, nature of the event).
  *   **Rival Reports:** If Report A asserts an event occurred and Report B asserts it did not (or asserts a contradictory event), and both have equal weight, **cancel both.** The evidence is mutually destructive. Enter neither.
  *   **Judgment Call:** *Determining "disinterested."* A witness is interested if they gain money, status, or spiritual merit from the certification. This step often masks the Clerk's personal bias against certain social classes.

  **Step 2: The Test of Natural Law (Wonder)**
  *Question:* Is the event a violation of a known law of nature, or merely an uncommon occurrence?
  *   **Sufficient Answer:** The event must be impossible under current natural philosophy (e.g., a dead man breathing, fire freezing water). Mere rarity (e.g., a comet, a double-yolked egg) is **not** a Wonder.
  *   **Refusal:** If a plausible natural mechanism exists, even if not immediately visible. The burden of proof lies on the claimant to rule out nature, not on the Office to rule it in.
  *   **Post-Certification Discovery:** If a natural cause is identified *after* entry, the entry must be **struck from the Wonder column** immediately. It may remain in the archive as a "Resolved Anomaly."
  *   **Judgment Call:** *Defining "Law of Nature."* This depends on the current state of science. What is a Wonder today may be natural tomorrow. The Clerk must rely on the prevailing academic consensus, which is often political.

  **Step 3: The Test of Testimony (Weight)**
  *Question:* Is it more miraculous that the event happened, or that the witnesses are mistaken or lying?
  *   **Sufficient Answer:** The number and integrity of the witnesses must be so high that their collective falsehood would be a greater violation of experience than the event itself.
  *   **Refusal:** If witnesses stand to gain (financially, spiritually, politically). If witnesses are known to be credulous. If the event occurred in secret.
  *   **Mixed Evidence:** If evidence is genuinely mixed (some for, some against), the default is **Refusal.** The Office does not certify doubts.
  *   **Judgment Call:** *Weaving "Integrity."* The Clerk decides what counts as integrity. This is where the Clerk's prejudice against the superstitious or the elite enters disguised as objective assessment.

  **Step 4: The Test of Significance (Sign)**
  *Question:* Does the event carry a divine message?
  *   **Procedure:** The Clerk **does not decide this.**
  *   **Hand-Off:** If a report passes Steps 1–3 (certified as Wonder), it is automatically flagged for the Bishop's review as a potential Sign.
  *   **Natural Events:** If a report fails Step 2 (found to be Natural) but the claimants insist on divine intent, the Clerk enters **"Natural Event"** and forwards the file to the Bishop. The Bishop may declare it a Sign despite the lack of Wonder, but this is a theological, not factual, declaration.
  *   **Political/Doctrinal Consequence:** If certification would advantage one faction, order, or noble house over another, the Clerk must **suspend judgment** and forward the file to the Bishop with a note: *"Consequences exceed factual scope."* The Clerk certifies facts; the Bishop accepts risk.

  ---

  #### II. Application of the Procedure

  **Case 1: The Weeping Statue**
  *Report:* Statue of Saint Aemilius wept during drought. Hundreds witnessed moisture. Entered as Wonder.
  *New Evidence:* Naturalist identifies insect secretion on stone; statue is infested.

  *   **Step 1 (Occurrence):** Pass. Hundreds witnessed moisture. Fact of "wetness" is established.
  *   **Step 2 (Natural Law):** **Fail.** The new evidence provides a natural mechanism (insect secretion). Under Protocol I.2 (Post-Certification Discovery), the existence of a natural cause voids the Wonder status.
  *   **Step 3 (Testimony):** N/A. Even if testimony is perfect, a natural cause removes the violation of law.
  *   **Step 4 (Significance):** Hand-off. The moisture is real; the cause is natural. Whether God used insects to send a message is a theological question.

  *   **Clerk's Entry:** **Strike from Wonder Column.** Reclassify as "Natural Event."
  *   **Bishop's Decision:** The Bishop may retain it in the public eye as a **Sign** (God speaking through nature), but he cannot claim it as a miracle of physics.
  *   **Clerk's Margin Note:** *"Wonder voided by natural cause (Insecta lapidis). Moisture verified. Intent undetermined. Refer to Episcopate for Sign status."*
  *   **The Unliked Truth:** The magic is gone. The statue is just a rock with bugs. The faithful wanted a miracle; they get an entomological report. The Office protects its credibility by admitting error, which undermines public trust in the Register.

  **Case 2: The Fever and the Relic**
  *Report:* Child's fever breaks after relic application.
  *Witnesses:* Mother (interested), Uncle (interested/related), Physician (skeptic/arrived late).
  *Context:* Priest promised donation upon recovery.

  *   **Step 1 (Occurrence):** Pass. The fever broke. This is a fact.
  *   **Step 2 (Natural Law):** **Fail.** Fevers break spontaneously. Remission is a known behavior of the human body. It is not a violation of natural law for a fever to end. To certify this as a Wonder is to claim physiology was suspended, not merely that recovery was timely.
  *   **Step 3 (Testimony):** **Fail.**
      *   Mother/Uncle: Interested parties (emotional/financial stake in the relic's power).
      *   Priest: Financial stake (donation).
      *   Physician: Arrived *post-event*. His testimony confirms recovery, not cause. His skepticism reduces his weight regarding the *cause*, but his lateness makes him useless for the *moment* of application.
      *   *Protocol I.3 (Weight):* Is it more miraculous that a fever broke naturally, or that three interested parties and one late observer are mistaken? The natural remission is far more probable.
  *   **Step 4 (Significance):** Hand-off (with recommendation). Since it failed Step 2, it cannot be a Wonder. It can only be a Sign if the Bishop chooses to interpret a natural recovery as divine favor.

  *   **Clerk's Entry:** **Dismiss as Wonder.** Enter as "Natural Recovery."
  *   **Bishop's Decision:** The Bishop is free to declare it a **Sign** of the Saint's intercession (God working through natural means), but he cannot list it as a miracle in the Register. Given the financial stake of the Priest, the Bishop likely suppresses the report entirely to avoid scandal.
  *   **Clerk's Margin Note:** *"Natural remission probable. Witnesses interested. Causality unproven. Wonder denied. Potential for simony noted."*
  *   **The Unliked Truth:** The healing is dismissed. The procedure treats the mother's gratitude as "interest" and the child's survival as "probable chance." The cold logic of the Office crushes the hope of the petitioners. There is no room for grace in the checklist.

  ---

  #### III. Limitations and Narrative Advice

  **What the Procedure Cannot Do:**
  1.  **It Cannot Measure Faith:** The procedure treats faith as a bias (a reason to discount testimony). It cannot account for the possibility that faith is a valid mode of perception. This creates a structural conflict between the Clerk (who must doubt) and the Church (which must believe).
  2.  **It Cannot Predict Politics:** Step 4 hands political risks to the Bishop, but the Clerk still has to write the margin note. The Bishop may ignore the note to save a political ally. The procedure protects the Clerk's conscience, not the truth.
  3.  **It Cannot Handle "Soft" Miracles:** Events that are *highly improbable* but not strictly *impossible* (e.g., Case 2) are crushed by Step 2. The procedure defines miracles as *violations*, not *providences*. If your novel needs a world where God acts through probability, this procedure will fail you.

  **Where to Let Characters Disagree:**
  Do not use the procedure to resolve the novel's central conflict. Use it to create it.
  *   **The Clerk vs. The Bishop:** The Clerk follows the procedure and denies a Wonder. The Bishop, needing a political victory or a boost in public morale, orders the entry anyway. The Clerk must decide whether to resign, forge the record, or obey.
  *   **The Clerk vs. The Witness:** A witness knows they saw a miracle. The procedure says they are "interested" or "mistaken." The drama lies in the Clerk knowing the procedure is right, but feeling the witness is telling the truth.
  *   **The Procedure vs. Reality:** In Case 1, the procedure says "remove the Wonder." But what if the insects only secrete fluid *when it rains*, and it hasn't rained in months? The procedure stops at "Natural Cause Found." It does not ask "Why are the insects active in a drought?" This is where you, the author, can hint that the procedure is too blunt an instrument for the complexity of the world.

  **Final Instruction:**
  The procedure is a shield for the Clerk, not a key to the truth. It allows the Clerk to sleep at night by saying, "I followed the rules." It does not guarantee that the Register reflects reality. Let your characters suffer the gap between the two.
