answer: |-
  You have identified a sophisticated epistemic problem that sits at the boundary of philosophy of science, logic, and rhetoric. You are correct that "unfalsifiable" is too blunt an instrument here. Your friend's theory *does* make predictions; the problem is not that it avoids testing, but that it has constructed a logical architecture where the *outcome* of the test cannot reduce the probability of the theory.

  Furthermore, your observation about orthodox science is astute. The structure *is* present in mainstream science, which is why simple labels like "pseudoscience" often fail to persuade. The difference lies not in the *presence* of the mechanism, but in its *function* and *limits*.

  Here is the breakdown of the established concepts that fit, the distinction regarding the orthodox side, and a coined term for the specific logical structure you are describing.

  ### 1. The Established Framework: Immunization and Degeneration

  The most precise established vocabulary for this comes from the **Critical Rationalism** of Karl Popper and Hans Albert, and the **Methodology of Scientific Research Programmes** of Imre Lakatos.

  **A. Immunization Strategy (Hans Albert)**
  Hans Albert, expanding on Popper, coined the term **"Immunization"** (or *Immunisierungsstrategie*). This occurs when a theory is protected from refutation by introducing auxiliary assumptions that explain away counter-evidence.
  *   **Why it fits:** It captures the "adjustment" you noticed.
  *   **The Limit:** Standard immunization explains why a failure isn't fatal. It doesn't fully capture your friend's specific move where the failure becomes *positive confirmation* (the cover-up argument).

  **B. The Protective Belt and Ad Hoc Hypotheses (Lakatos)**
  Lakatos described scientific theories as having a **"Hard Core"** (the fundamental assumptions, e.g., "an advanced civilization existed") surrounded by a **"Protective Belt"** of auxiliary hypotheses (e.g., "the evidence is buried," "the records were destroyed").
  *   **The Move:** When a prediction fails, the Protective Belt is adjusted.
  *   **The Verdict:** Lakatos distinguishes between **"Progressive"** and **"Degenerating"** problem shifts.
      *   **Progressive:** The adjustment leads to *novel predictions* that are subsequently confirmed.
      *   **Degenerating:** The adjustment only explains the *past* failure without generating new, risky predictions.
  *   **Application:** Your friend's theory is a **Degenerating Research Programme**. The "cover-up" auxiliary explains the missing evidence but predicts nothing new other than "keep looking and you won't find it (because cover-up)."

  ### 2. The Orthodox Parallel: Why You Are Right

  You noted that orthodox science sometimes claims anomalies are "already accounted for" without showing how. This is a recognized phenomenon in the sociology of science (Thomas Kuhn's **"Normal Science"**).

  *   **The Similarity:** Both orthodox scientists and your friend use a Protective Belt to shield the Hard Core from immediate falsification. This is rational; if scientists abandoned a theory at every anomaly, no complex theory would ever survive.
  *   **The Difference:** The difference is **Revisability** and **Productivity**.
      *   In orthodox science, the Hard Core is *eventually* revisable if the Protective Belt becomes too convoluted (a "Crisis" leading to "Revolution"). The claim "it is accounted for" is a placeholder that *must* be cashed out eventually.
      *   In your friend's view, the Hard Core is *inviolable*. The "cover-up" auxiliary is a "get-out-of-jail-free" card that can be played infinitely without ever cashing out the details of the cover-up.

  ### 3. The Specific Logical Structure: A Coinage

  There is no single standard term that captures the specific move where *absence of evidence* is converted into *evidence of the theory* via a secondary assumption. "Unfalsifiable" is too static; "Ad Hoc" is too general.

  I propose the term: **Reflexive Confirmation**.

  **Definition:**
  **Reflexive Confirmation** occurs when a hypothesis ($H$), combined with a specific auxiliary assumption ($A$), interprets both the presence ($E$) and the absence ($\neg E$) of predicted evidence as supportive of $H$.

  *   **Standard Logic:** $E$ supports $H$; $\neg E$ falsifies $H$.
  *   **Reflexive Confirmation:** $E$ supports $H$; $\neg E$ supports $A$, and since $A$ is only invoked to save $H$, $\neg E$ is treated as supporting $H+A$.

  **Why this term fits:**
  1.  **Reflexive:** The theory "bends back" the negative result into a positive one. Like a mirror that reflects light back regardless of the angle, the theory reflects evidence back as confirmation.
  2.  **Confirmation:** It highlights that the move isn't just defensive (saving the theory); it is offensive (claiming the failure *proves* the theory).
  3.  **Distinction:** It distinguishes this from simple "unfalsifiability." A theory can be unfalsifiable because it makes *no* predictions (e.g., "invisible dragons"). Your friend's theory makes predictions but neutralizes the risk via Reflexive Confirmation.

  ### 4. How to Use This With Your Friend

  Since you want to avoid dismissiveness, do not use these terms as weapons. Use them as maps. You can frame the conversation around **Lakatos's distinction between Progressive and Degenerating shifts**, which is neutral ground.

  **The Conversation Strategy:**

  1.  **Acknowledge the Protective Belt:** "I see that when we don't find evidence at Site X, you posit a cover-up. In philosophy of science, that's called an auxiliary hypothesis. It's a valid move to save a theory."
  2.  **Point out the Degeneration:** "However, Imre Lakatos noted that for a theory to be scientifically healthy, those adjustments need to lead to *new* discoveries. If the 'cover-up' hypothesis only explains why we *didn't* find things, but never helps us find something new that we wouldn't have expected otherwise, the programme is 'degenerating'."
  3.  **Introduce Reflexive Confirmation (gently):** "My concern is that the theory has entered a state of **Reflexive Confirmation**. If finding the artifact proves the civilization, and *not* finding it proves the cover-up (and thus the civilization), then the theory is compatible with any possible world. Even if you aren't trying to be unfalsifiable, the *structure* of the argument makes it so."
  4.  **Challenge the Orthodox Parallel:** "You're right that mainstream archaeologists sometimes dismiss anomalies too quickly. That's a vice called 'dogmatic falsificationism.' But the difference is that if enough anomalies pile up, the orthodox view *can* collapse. The 'cover-up' auxiliary, by definition, prevents collapse. That makes it structurally different, even if it feels similar."

  ### Summary

  *   **Established Name:** **Immunization Strategy** (Albert) within a **Degenerating Research Programme** (Lakatos).
  *   **Specific Logical Move:** **Reflexive Confirmation** (Coined).
  *   **Key Distinction:** Not whether auxiliary hypotheses are used (both sides use them), but whether they generate **novel predictions** (Progressive) or merely **explain away failures** (Degenerating).

  This framework validates your intuition that "unfalsifiable" is imprecise, acknowledges your insight about orthodox science, and gives you a precise vocabulary to describe the structural flaw without attacking your friend's intelligence.
