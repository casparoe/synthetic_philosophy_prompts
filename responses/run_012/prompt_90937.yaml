  **OFFICE FOR THE REGISTRATION OF CONVENTIONS**
  **OPERATIONAL GUIDANCE MANUAL (SECTION 4.2)**

  **1. Statutory Purpose and Scope**
  The Office is empowered to identify regularities in behaviour that solve recurring coordination problems and to record them in the Gazette. Registration confers no rights. For the avoidance of doubt, the Office does not create conventions; it merely recognises existing equilibria. Applicants seeking registration must demonstrate that the regularity is not the only feasible course of action. Applications concerning situations where physical necessity or singular rationality dictates behaviour will be rejected as non-conventions.

  **2. Determination of Arbitrariness**
  To qualify, a regularity must be arbitrary in the statutory sense. Applicants must submit Form A-12 (Alternative Regularity Affidavit), swearing that a conflicting regularity would have solved the coordination problem with equal efficacy and would have been conformed to just as readily had it been established instead. The Office will not hear arguments that one solution is more natural, fitting, or efficient than another. Claims of inherent superiority suggest the regularity is not arbitrary and therefore falls outside our jurisdiction.

  **3. Conditions of Conformity**
  Registration requires evidence that parties conform to the regularity primarily because others do. Individuals who would conform regardless of others' behaviour are classified as ritualists. Their behaviour does not count toward the requisite expectations. For the avoidance of doubt, if an applicant admits they would follow the regularity even if everyone else deviated, they are referred to the Division of Personal Habit. Only conditional conformers sustain a convention.

  **4. Epistemic Verification**
  The Office conducts a common-knowledge audit to verify that the regularity, the expectations of conformity, and the availability of alternatives are known to all parties, known to be known, and so forth. Due to budgetary constraints, no audit in the Office's history has been certified beyond four iterations of mutual knowledge. Applicants are advised that while the statute implies infinite iterations, the Office accepts level-four knowledge as provisionally sufficient.

  **5. Exclusion of Normative Sustenance**
  The Office draws a firm jurisdictional line at regularities sustained by guilt, shame, or third-party punishment. Such regularities are assigned to the Department of Normative Enforcement, whose methods we neither endorse nor detail. If conformity collapses without the threat of sanction or the sting of shame, it is not a convention. We deal only with preferences aligned by expectation, not by obligation.

  **6. Amendment and Persistence**
  The Office cannot abolish a convention by decision, nor can it create one. It may only alter which options are salient to the parties. We admit limited understanding of why some registered conventions drift while others persist untouched for decades. Applicants seeking to change a convention are advised that altering salience is our only tool, and its success is not guaranteed.

  **7. Compliance and Sanctions**
  The Office takes no position on whether anyone ought to comply with a registered convention. This question cannot be posed within the framework we administer. Our only available penalty for misuse of the Gazette is withdrawal of registration. Applicants should note that withdrawal alters nothing whatever regarding the parties' preferences or behaviour. It merely removes the Office's name from the regularity.

  ***

  **NOTE ON LIBERTIES TAKEN**

  This satire leans heavily on the Lewisian account of convention as a coordination equilibrium. It treats the arbitrariness condition and conditional conformity as settled necessary conditions, though some scholars argue conventions can emerge without explicit coordination problems. The piece exaggerates the common-knowledge requirement into a bureaucratic audit, highlighting the contested issue of how demanding this epistemic state must be; few theorists require actual infinite iterations. Finally, the Handbook's agnosticism on normativity reflects the ongoing debate over whether convention-based accounts can explain normative force or merely describe behavioural regularities. The separation of 'norms' (sustained by sanctions) from 'conventions' (sustained by expectations) mirrors a standard distinction, though the Office's inability to influence them satirises the difficulty of explaining how conventions evolve or acquire obligation.
