  6.  **Feasibility Assessment (1 Reading + 1 Writing Term):**
      *   *Reading Term:* Literature review (philosophy of archaeology, inference theory) + selecting site reports for analysis.
      *   *Writing Term:* Drafting the argument + case studies.
      *   *Risk:* It's tight. Analyzing too many reports will kill the timeline.
      *   *Cut:* Limit the case studies to 3-4 specific, well-known sites or a specific class of artifacts (e.g., burial contexts vs. storage contexts) rather than a broad survey of reports. Focus on the *logic* rather than a comprehensive empirical survey.

