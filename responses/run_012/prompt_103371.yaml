      *   **Hypothesis:** Institutions are more reliably reconstructible than beliefs due to the nature of the traces (redundancy vs. expression).
      *   **Research Question:** Is this asymmetry real (ontological/epistemological feature of the record) or an artifact of writing habits? If real, when is inference to belief safe?
      *   **Requirements:**
          *   State the question determinately.
          *   Explain why standard approaches (ethnographic analogy, preservation bias) miss this specific gap.
          *   Define the method (conceptual, not fieldwork, avoid wordplay).
