          *   Assess feasibility (1 reading + 1 writing term) and suggest cuts if needed.
          *   *No bibliography.*

  2.  **Deconstruct the Core Idea & Refine the Question:**
      *   *The Gap:* Archaeologists often treat "culture" or "society" as a monolith when interpreting finds. The user distinguishes between *belief* (internal, expressive, risky) and *institution* (external, coordinative, robust).
      *   *The Problem:* Site reports glide over this distinction. They treat a ritual vessel (belief) and a storage pit (institution/economy) with similar evidentiary weight, despite different logical foundations.
      *   *The Question:* Needs to be answerable. "Is it real?" is good, but needs operationalization.
      *   *Refined Question:* To what extent does the structural redundancy of coordinative traces provide a higher epistemic warrant for institutional reconstruction than the semantic dependency of expressive traces does for belief reconstruction, and can this differential warrant be formalized to constrain interpretive claims in site reports?

  3.  **Address Standard Approaches (The "Gap"):**
      *   *Ethnographic Analogy:* Usually focuses on *what* the object means (e.g., "This looks like a modern ritual pot, so it was used for ritual"). It doesn't analyze the *logical structure* of the inference itself regarding redundancy vs. expression.
      *   *Preservation Bias:* Focuses on what survives physically (taphonomy). It doesn't address the *semantic* survival of meaning. A pot survives, but does its "belief content" survive?
      *   *The Specific Gap:* The logical topology of the inference. How many independent data points are needed to sustain the claim? Belief = 1 point + heavy theory. Institution = N points + structural theory.

  4.  **Define the Method (Conceptual Work):**
      *   It can't just be philosophy; it needs to be archaeological philosophy.
      *   *Step 1: Taxonomy of Claims.* Analyze a sample of site reports. Categorize conclusions as "Belief" or "Institution."
      *   *Step 2: Trace Analysis.* For each category, map the evidentiary chain. How many artifacts support the claim? Is the link dependent on assumed intentionality?
      *   *Step 3: Stress Testing.* Apply a "redundancy metric." If we remove the assumption of intentionality, does the institutional claim hold? If we remove the assumption of shared convention, does the belief claim hold?
