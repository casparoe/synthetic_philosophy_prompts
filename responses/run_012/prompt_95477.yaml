      *   (b) Extension vs. Thought: Do twins have different *beliefs* or just different referents for the same belief structure?
      *   (c) Narrow Content: Is there *any* internal component? (Fodor, Chalmers vs. Putnam/Burge).
      *   (d) Self-Knowledge: Privileged access (Wright, McKinsey).
      *   (e) Social Externalism: The "elm/beech" case (division of linguistic labor) vs. Natural Kind externalism.
      *   (f) Conflations: Extended Mind (Clark/Chalmers) or Eliminativism/Behaviorism.

  4.  **Drafting the Claims (Boring to Radical):**

      *   *Claim 1: Reference Externalism (The Putnam Minimum).* Extension depends on environment. Internal state doesn't fix extension.
      *   *Claim 2: Content Externalism (The Burge Push).* Propositional attitudes (beliefs) depend on environment. Twins believe different things.
      *   *Claim 3: Social Externalism (Division of Linguistic Labor).* Experts fix meaning for the community.
      *   *Claim 4: No Narrow Content (The Radical Externalism).* There is *no* purely internal semantic property.
      *   *Claim 5: Anti-Privileged Access.* You can't know your own meanings just by thinking.
      *   *Claim 6: The "No Fact of the Matter" / Eliminativist Slide.* Meaning is indeterminate without causal history (leads to AI skepticism).

  5.  **Addressing the Specific Cases (1 & 2):**
      *   Case (1): AI Model. Needs causal contact. This leans heavily on causal theories of reference (Kripke/Putnam) + perhaps a denial of narrow content.
