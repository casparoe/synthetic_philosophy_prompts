      *   **Meeting Strategy:** How to push back politely.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Claim 1:* Make sure to distinguish Putnam's original "psychological state" claim from "meaning." Putnam argued psychological state doesn't determine extension.
      *   *Correction on AI:* Be careful. Some argue AI *does* have causal contact (via training data created by humans who have contact). But the PI's argument is "text-only model... nothing inside... need causal hookup." This implies a direct causal theory. I need to note that this is a *strong* reading.
      *   *Correction on Introspection:* Putnam didn't originally argue for loss of self-knowledge. That came later (Burge, Wright). I need to mark that as an *inference*, not the slogan itself.
