  8.  **Drafting the Content (Iterative refinement during writing):**
      *   *Opening:* Connect spectroscopy to philosophy. Precision matters.
      *   *Assumptions:* Use the Jarrett/SH decomposition (PI/OI). This is crucial for the "colleague" dispute. One says non-local (violates PI), one says no signalling (preserves PI statistically). Actually, QM violates PI at the hidden variable level but preserves No-Signalling at the observable level. Wait, standard QM doesn't have $\lambda$. In Bell's framework, QM violates the inequality, so any $\lambda$-theory reproducing QM must violate PI or OI. Bohm violates PI. Collapse violates PI.
