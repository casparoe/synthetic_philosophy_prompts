answer: |-
  You come to this problem with the exact right temperament: a suspicion of hand-waving and a demand for precise operational definitions. In spectroscopy, a line shift is a physical fact only after you have accounted for the instrument function; in the foundations of physics, a violation of Bell's inequality is a fact about the world only after you have accounted for the assumptions required to derive the inequality. The dispute between your colleagues—one claiming the world is non-local, the other claiming nothing has been shown because signalling is impossible—stems from a conflation of Bell's *Local Causality* with relativistic *No-Signalling*. To resolve this, we must dissect the derivation not as a mathematical trick, but as a constraint on physical models.

  Bell's theorem is a no-go theorem. It demonstrates that no theory satisfying a specific set of premises can reproduce the statistical predictions of quantum mechanics. The 2015 loophole-free experiments (such as Hensen et al. using electron spins in diamonds, and Giustina/Shalm et al. using photons) and the subsequent "Cosmic Bell" tests did not test quantum mechanics; quantum mechanics was the baseline. They tested the conjunction of assumptions required to derive the inequality. When the inequality is violated, logic dictates that at least one assumption must be false. The experiments do not tell you *which* one; that is a theoretical choice.

  To see why, we must define Bell's "Local Causality" precisely. It is stronger than the mere absence of superluminal signalling. In a local-causal model, the probability of an outcome $A$ at one wing of the experiment should depend only on the local setting $a$ and the complete physical state of the system $\lambda$ (the "hidden variables" or beables) in the past light cone. It should not depend on the distant setting $b$ or the distant outcome $B$. This condition factorizes into two distinct statistical independence conditions: Parameter Independence (PI) and Outcome Independence (OI).

  Parameter Independence states that $P(A|a, b, \lambda) = P(A|a, \lambda)$. The distant setting $b$ does not influence the local probability. Outcome Independence states that $P(A|a, b, B, \lambda) = P(A|a, b, \lambda)$. The distant outcome $B$ does not influence the local probability. Local Causality is the conjunction of PI and OI. Your colleague who insists "nothing can travel faster than light" is appealing to the No-Signalling theorem, which guarantees that observable marginal probabilities do not depend on distant settings: $P(A|a, b) = P(A|a)$. Quantum mechanics respects No-Signalling. However, No-Signalling is compatible with a violation of Local Causality at the level of $\lambda$. If a theory violates PI at the hidden-variable level but averages out to respect No-Signalling at the observable level, it is non-local in Bell's sense, even if it cannot be used to send a telegram. The experiments establish that nature violates the Bell inequality; therefore, nature cannot be described by any theory that satisfies Local Causality (PI + OI) and Measurement Independence. The experiments do not establish *how* nature violates it, only that it does.

  This distinction allows us to map the surviving interpretative programmes. Each saves the phenomena by rejecting a specific premise of the derivation. The table below summarizes which assumption is abandoned by each major class of theory. Note that "Measurement Independence" is the assumption that the hidden variables $\lambda$ are statistically independent of the future measurement settings $(a, b)$.

  | Interpretation | Status of Local Causality | Assumption Abandoned | Specific Violation |
  | :--- | :--- | :--- | :--- |
  | **De Broglie–Bohm** | Violated | Parameter Independence | The guidance equation depends instantaneously on distant particle positions. |
  | **Dynamical Collapse (GRW)** | Violated | Parameter Independence | Collapse is a physical, non-local process affecting the wavefunction globally. |
  | **Everett (Many-Worlds)** | Debated / N/A | Uniqueness of Outcome | Rejects the probability space definition; all outcomes occur, rendering Bell's probabilities ill-defined. |
  | **Retrocausal** | Preserved | Measurement Independence | Future settings influence past $\lambda$ (via advanced waves or boundary conditions). |
  | **Superdeterministic** | Preserved | Measurement Independence | Past common cause correlates $\lambda$ with settings; no "free choice" of settings. |

  It is vital to state plainly what the experiments cannot do. They cannot identify the failing assumption. They cannot demonstrate the mechanism of influence (e.g., they do not detect the "signal" in Bohmian mechanics). They cannot eliminate an interpretation, provided that interpretation is willing to pay the price indicated in the table. When the 2015 experiments closed the detection loophole (by ensuring high efficiency) and the locality loophole (by ensuring spacelike separation of setting choice and distant outcome), they ruled out *Local Hidden Variable* theories. They did not rule out Hidden Variable theories simpliciter. If you choose Bohm, you accept non-locality. If you choose Superdeterminism, you accept a conspiracy of initial conditions. The data underdetermines the ontology.

  Turning from the lens onto the case, to the case back onto the theory: what did a competent experiment actually have to guarantee? To derive the inequality, one assumes that the setting choice on wing A is causally disconnected from the physical state determining the outcome on wing B, except via a common past cause. The 2015 experiments guaranteed this by separating the stations by over a kilometre and switching settings faster than light could travel between them. This closes the "communication loophole." They guaranteed that the sample of detected pairs was representative by using high-efficiency detectors, closing the "detection loophole" (where one might suspect only a biased subset of particles is seen). The later cosmic tests, using light from distant quasars to determine settings, pushed the "freedom-of-choice" loophole back billions of years, making any common cause required for superdeterminism cosmologically ancient.

  Consider the counterfactual: what would a null result have vindicated? If the correlations had respected the Bell bound, it would have vindicated the EPR argument of 1935 in its entirety. EPR argued that quantum mechanics is incomplete because it cannot account for perfect correlations without action-at-a-distance, assuming locality. A null result would have meant that a local completion is possible. It would not merely have restored "incompleteness" as a philosophical option; it would have mandated that the quantum state description is missing variables that restore local causality. The violation of the bound tells us that the EPR hope for a local completion is false. The world is not locally causal in the sense Bell defined.

  However, there are points where the lens goes silent. Bell's formulation of Local Causality assumes a fundamental ontology of events localized in spacetime. It asks: does what happens here depend on what happens there? But for interpretations where the fundamental ontology is not events in 3+1 dimensions, the question may be ill-posed. In the Everettian view, the ontology is the universal wavefunction evolving in configuration space. "Distance" in configuration space is not distance in physical space. An Everettian may argue that the evolution is strictly local in configuration space, and the appearance of non-locality in 3-space is a derivative artifact. Similarly, for Bohmian mechanics, the theory is explicitly non-local in 3-space, but it can be made compatible with relativity by positing a preferred foliation of spacetime—a universal "now." This saves causality at the cost of Lorentz invariance at the fundamental level (though empirical Lorentz invariance is preserved because the foliation is hidden). Bell's theorem constrains theories that respect Lorentz invariance *and* Local Causality. If you abandon Lorentz invariance as a fundamental symmetry (keeping it only as an empirical disguise), you can retain a form of determinism and causality, but you step outside the specific relativistic constraints Bell originally interrogated. The experiments cannot distinguish a fundamentally Lorentz-invariant non-local theory from a fundamentally preferred-frame theory that mimics invariance.

  This brings us to the philosophical oddity you identified: the conversion of an a priori constraint into an experimental programme, culminating in the 2022 Nobel Prize. Is this "experimental metaphysics"? Yes, but with a precise qualification. A theorem is a logical relation between propositions; it cannot be tested experimentally, only proved. What was put to the test was not Bell's theorem, but the *physical realizability* of its premises. Specifically, the assumption that the world is composed of local beables that respect Local Causality.

  In the tradition of logical positivism, metaphysical statements were deemed meaningless because they were unverifiable. Bell's work inverted this. He showed that a metaphysical commitment—Local Causality—has empirical consequences (the inequality). By testing the consequence, you test the commitment. This is experimental metaphysics because it forces a decision on the structure of reality that was previously thought to be a matter of philosophical preference. Before 1964, one could argue that quantum mechanics was incomplete but local, and that this was a reasonable philosophical stance. After the experiments, that stance is empirically untenable.

  However, we must be careful about what "reality" is being tested. The experiments do not test "Realism" in the vague sense that an external world exists. They test "Local Realism," a specific technical conjunction of locality and the existence of definite values prior to measurement. When the Nobel Committee cited "experiments with entangled photons, establishing the violation of Bell inequalities," they were acknowledging that a constraint on the *shape of any theory* has been shown to be a constraint on *nature itself*. The theorem says: "If nature is locally causal, correlations must be bounded." The experiment says: "Correlations are not bounded." The syllogism concludes: "Nature is not locally causal."

  The oddity lies in the fact that the "assumption about the world" being tested is negative. We are not confirming the existence of a substance; we are confirming the failure of a constraint. We have established that any theory capable of describing this world must either allow influences that transcend spacetime separation (violating PI), deny the independence of the observer's choice (violating Measurement Independence), or deny the uniqueness of the observed outcome (Everett).

  For a spectroscopist, the analogy might be this: Imagine you derive a limit on the linewidth of a transition based on the assumption that the atoms are stationary. You measure the line and find it broader than the limit. You have not measured the velocity of the atoms directly, nor have you proved they are moving. You have proved that the assumption "the atoms are stationary" is false. The broadening could be due to thermal motion, or it could be due to a breakdown of the Doppler model itself. The Bell experiments are the measurement of the linewidth. They tell us the "stationary atom" model of Local Causality is false. They do not tell us the temperature of the gas (the mechanism of non-locality) or if we need a new Hamiltonian (a new ontology).

  Your colleagues are both partially right and partially wrong. The first is right that the world is non-local in Bell's sense (Local Causality fails); the second is right that this non-locality cannot be used for signalling (No-Signalling holds). But the second is wrong to infer that "nothing has been shown." What has been shown is that the price of preserving No-Signalling is the abandonment of Local Causality. The universe maintains its causal peace at the observable level only by allowing a deeper, hidden layer of connection that defies our classical intuition of spacetime separation. The 2015 experiments closed the escape hatches. We are left in a room with no local exits. We must choose which wall to walk through, but the experiments have proven that the wall of Local Causality is not solid.
