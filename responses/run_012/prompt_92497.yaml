  *(Self-Correction during drafting)*: I need to be careful with Everett. Everettians often claim they satisfy Local Causality because the whole wavefunction evolves locally, but they reject the "single outcome" assumption required to formulate the probabilities in Bell's theorem. I must articulate this distinction clearly. Also, for Superdeterminism, it violates Measurement Independence, not Local Causality per se, though it saves it.

  *(Word Count Check)*: If I find myself running short, I will expand on the distinction between "Local Causality" and "Lorentz Invariance" in the context of Bohmian mechanics, as that addresses the user's question about preferred foliation. If too long, I will trim the historical context of the 2015 experiments and focus on the logical structure.

