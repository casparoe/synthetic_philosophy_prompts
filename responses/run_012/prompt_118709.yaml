answer: |-
  **Case One**
  A medical school admissions office manages one hundred seats among two hundred minimally qualified applicants, fifty of whom belong to Group G. *Stipulated:* The fifty members of Group G are among the top one hundred scorers on the institution's traditional metric, and the specific cohort of one hundred admitted in each variant below is identical, displacing no applicant who would have been admitted under the previous procedure. Variant (i) explicitly reserves fifty seats for Group G members, adopted openly with a published rationale of historical repair. Variant (ii) adopts a facially neutral criterion of "urban residence" with the intent to secure Group G representation, adopted in full knowledge that it will select the same people, with that knowledge and intent not disclosed. Variant (iii) employs a blind lottery among all minimally qualified applicants, adopted for reasons independent of group composition, which *stipulated* in fact selects the same one hundred people as the other variants.

  **Case Two**
  A surgical residency programme applies a single criterion of "innate manual dexterity," published in advance and applied without exception for reasons having nothing to do with group membership. *Stipulated:* The criterion is genuinely predictive of performance but is not the sort of thing a candidate could deserve credit for, being largely genetic. The application of this criterion produces a stark and stable imbalance where only ten percent of admitted residents belong to Group G. *Stipulated:* The cause of the imbalance is a non-invidious biological difference in motor nerve density between groups, not discrimination in testing or application rates.

  ***

  **Verdicts and Analysis**

  **Position (a) Category Wrongness**
  *Verdicts:* Case 1(i) Wrong; Case 1(ii) Permissible; Case 1(iii) Permissible; Case 2 Permissible.
  *Feature Keyed On:* The explicit use of a group characteristic in the rule.
  *Analysis:* This position condemns only Variant (i) because it names the group. It passes Variant (ii) because the criterion is facially neutral, despite the intent. It passes Case 2 because the criterion is group-blind.
  *Case 1 Feature:* The *explicitness of the category*. If removed (all variants neutral), (a) finds all permissible. The case collapses into the familiar dispute over disparate impact rather than classification.
  *Case 2 Feature:* The *group-blindness of the criterion*. If removed (criterion named the group), (a) would condemn it. The case then collapses into Case 1(i).

  **Position (b) Aim Wrongness**
  *Verdicts:* Case 1(i) Wrong; Case 1(ii) Wrong; Case 1(iii) Permissible; Case 2 Permissible.
  *Feature Keyed On:* The intention to produce a group-proportional result.
  *Analysis:* This position condemns Variants (i) and (ii) because both aim at group representation (explicitly in (i), via proxy in (ii)). It passes (iii) and Case 2 where the aim is fairness or merit.
  *Case 1 Feature:* The *intent behind the mechanism*. If removed (no variant aims at proportionality), (b) finds all permissible. The case collapses into a dispute over outcomes rather than motives.
  *Case 2 Feature:* The *absence of group aim*. If removed (programme aimed to lower Group G admission), (b) would condemn it. The case then becomes one about malicious intent.

  **Position (c) Desert Wrongness**
  *Verdicts:* Case 1(i) Wrong; Case 1(ii) Permissible; Case 1(iii) Wrong; Case 2 Wrong.
  *Feature Keyed On:* Whether the allocation basis is attributable to the candidate's agency.
  *Analysis:* This position condemns (i) (quota is not desert), (iii) (lottery is not desert), and Case 2 (innate trait is not deserved). It permits (ii) *stipulated* that "urban residence" implies overcoming adversity (a desert-relevant trait).
  *Case 1 Feature:* The *desert-status of the selection basis*. If removed (all bases were desert-relevant), (c) would find all permissible. The case collapses into a dispute over measurement accuracy.
  *Case 2 Feature:* The *innate nature of the criterion*. If removed (criterion was effort-based), (c) would find it permissible. The case then collapses into the familiar meritocracy dispute.

  **Position (d) Loss Wrongness**
  *Verdicts:* Case 1(i) Permissible; Case 1(ii) Permissible; Case 1(iii) Permissible; Case 2 Wrong.
  *Feature Keyed On:* Whether a determinate individual is deprived of a good they would otherwise have held.
  *Analysis:* This position permits all Case 1 variants due to the *stipulated* "no loss" condition. It condemns Case 2 because Group G members fail the criterion and *would* have been admitted under a counterfactual criterion that did not rely on the biological imbalance.
  *Indeterminacy:* The verdict on Case 2 is indeterminate as stated. It requires the premise: "The counterfactual baseline for 'otherwise' is a procedure that would not produce the imbalance." Without this, if "otherwise" means "under the published rule," no one loses anything.
  *Case 1 Feature:* The *absence of displacement*. If removed (variants displaced specific individuals), (d) would condemn all three. The case collapses into the familiar reverse-discrimination dispute.
  *Case 2 Feature:* The *exclusionary outcome*. If removed (all qualified admitted), (d) would find it permissible. The case then collapses into a dispute over standards.

  **Position (e) Concealment Wrongness**
  *Verdicts:* Case 1(i) Permissible; Case 1(ii) Wrong; Case 1(iii) Permissible; Case 2 Permissible.
  *Feature Keyed On:* The transparency and answerability of the allocation grounds.
  *Analysis:* This position condemns only Variant (ii) because the knowledge/intent is undisclosed. It permits (i) and (iii) as open, and Case 2 as published.
  *Case 1 Feature:* The *disclosure of the rationale*. If removed (all variants open), (e) finds all permissible. The case collapses into a dispute over the validity of the reasons rather than their secrecy.
  *Case 2 Feature:* The *publication of the criterion*. If removed (criterion secret), (e) would condemn it. The case then collapses into a procedural fairness dispute.

  **Extensional Equivalence**
  No two positions are extensionally equivalent across the pair. Position (a) and (b) diverge on Case 1(ii) (Category vs. Aim). Position (c) diverges from all on Case 1(iii) (Desert vs. Mechanism). Position (d) diverges on Case 1 (Loss vs. No Loss). Position (e) diverges on Case 1(ii) (Concealment vs. Content).

  **Hardest Position to Survive**
  Position (c) (Desert Wrongness) has the hardest time. It condemns the blind lottery (Case 1-iii), which is widely accepted as a fair tie-breaker, and condemns predictive innate traits (Case 2), which are standard in high-skill selection (e.g., athletics, surgery).
  *Strongest Reply:* A defender would argue that treating people as means to efficiency (prediction) or objects of chance (lottery) violates their dignity as agents; only what flows from agency respects the person, making the cost of excluding predictive traits necessary for moral consistency.

  ***

  **Variations**

  If the good allocated is a seat in the body that makes the allocation, the stakes shift from distributive justice to constitutive legitimacy; exclusion here denies the group a voice in defining the rules themselves, making the objection less about individual loss and more about political authority.

  If the requirement is imposed by statute on private bodies rather than adopted by an institution for itself, the objection based on institutional autonomy (often implicit in positions like (e)) weakens, while objections based on liberty from state coercion (often implicit in (a)) strengthen, reframing the conflict as state overreach versus private compliance.

  If the group characteristic is an economic one rather than an ascriptive one, the immutability premise underlying many desert objections (like (c)) is undermined because economic status is theoretically mutable; this shifts the debate toward whether the barrier is structural or individual, making the "non-invidious" stipulation in Case 2 harder to sustain.
