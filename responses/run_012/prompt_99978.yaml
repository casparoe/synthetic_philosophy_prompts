answer: |-
  You are right to be suspicious. This blog post is a classic example of what happens when two distinct philosophical arguments get blended together in popular discourse until they become a single, super-charged "gotcha" against moral realism. It is not accurate scholarship. While it captures a certain *vibe* of meta-ethical skepticism, it attributes views to philosophers they did not hold and draws conclusions that do not follow from the premises.

  Here is a sentence-by-sentence audit of the claims, followed by a breakdown of the specific conceptual confusions you asked about.

  ### Sentence-by-Sentence Audit

  **1. "Hume discovered the is-ought gap, and the gap just is Moore's naturalistic fallacy."**
  *   **Verdict:** **Plainly Wrong.**
  *   **Analysis:** A Hume specialist and a Moore specialist would almost universally reject this identity. They are related family members, not twins.
      *   **Hume's Is-Ought:** Found in the *Treatise of Human Nature*. It is an observation about the structure of moral arguments. Hume noticed that writers often slip from talking about what *is* the case (facts about the world or God) to what *ought* to be the case (moral obligations) without explaining the transition. He didn't necessarily say it was *impossible*, just that it requires explanation (which he thought was found in sentiment, not reason).
      *   **Moore's Naturalistic Fallacy:** Found in *Principia Ethica*. This is about definition. Moore argued that "good" is a simple, indefinable property. If you try to define "good" using natural terms (like "pleasure" or "evolutionary fitness"), you commit a fallacy.
      *   **The Difference:** Hume is worried about *inference* (moving from premises to conclusion). Moore is worried about *definition* (what the word "good" means). You can accept one without accepting the other.

  **2. "The point is that you can never get an ought out of an is -- any argument that tries to pull a moral conclusion from purely factual premises commits a logical error, full stop."**
  *   **Verdict:** **Oversimplification / Contested.**
  *   **Analysis:** This is the "hard line" interpretation of Hume, often called Hume's Law.
      *   **Hume Specialist:** Would likely say Hume never claimed it was a logical impossibility "full stop." He claimed previous authors hadn't *explained* the connection. He offered his own explanation (moral sentiments).
      *   **Moore Specialist:** Would agree that you can't define moral terms using natural terms, but might disagree that *no* factual premises can ever support a moral conclusion (especially if you accept a moral premise).
      *   **Logic Check:** In formal logic, whether you can derive an "ought" from an "is" depends entirely on your logical system and how you define those terms. Some philosophers (like Arthur Prior) have shown trivial ways to derive an ought from an is (e.g., "Tea drinking is common in England; therefore, either tea drinking is common in England or everyone ought to be murdered"). The "full stop" claim ignores decades of counter-argument and nuance.

  **3. "Hume proved that good can't be defined in natural terms at all; it's a simple, non-natural property that you either intuit or you don't."**
  *   **Verdict:** **Plainly Wrong (Historical Attribution Error).**
  *   **Analysis:** This is the biggest smoking gun in the text. The author has smuggled G.E. Moore's philosophy into David Hume's biography.
      *   **Hume:** Was a **sentimentalist** (or proto-expressivist). He did not think "good" was a *property* at all, natural or non-natural. He thought moral judgments were expressions of feeling (approval or disapproval) projected onto the world. He certainly did not believe we "intuit" a non-natural property.
      *   **Moore:** Is the one who argued "good" is a **simple, non-natural property** known by **intuition**.
      *   **The Error:** The blog post treats Hume as if he were a Moorean intuitionist. This is historically inaccurate. Hume would likely have rejected Moore's "non-natural property" as just another piece of confused metaphysics.

  **4. "That's also why he held that reason is only ever a servant of the passions, since reason can only tell you what's true, never what to do."**
  *   **Verdict:** **Mostly Accurate (on Hume), but misconnected.**
  *   **Analysis:**
      *   **Hume:** Yes, Hume famously wrote that "Reason is, and ought only to be the slave of the passions." He believed reason deals with truth and falsehood (relations of ideas or matters of fact), while morality drives action, and reason alone cannot motivate action.
      *   **The Connection:** The blog implies this proves the "non-natural property" claim from the previous sentence. It doesn't. Hume's view on reason and passion supports his sentimentalism, not Moore's non-naturalism. The blog is using a correct Hume quote to support an incorrect attribution of Moore's theory to Hume.

  **5. "The upshot... is that science can never tell us anything about morality, that nobody has ever actually produced a valid derivation of an ought from an is, and that the whole naturalistic project in ethics -- Aristotle, the evolutionary types, the moral psychologists -- is dead on arrival."**
  *   **Verdict:** **Unwarranted Leap / False.**
  *   **Analysis:**
      *   **Science:** Even if the is-ought gap holds, science can tell us about the *consequences* of actions, human psychology, and social stability, which are highly relevant to morality. Saying science can tell us "anything" is too strong.
      *   **Valid Derivation:** Whether nobody has *ever* produced one is debatable depending on how you set up your premises (e.g., institutional facts like "promising" create obligations).
      *   **Naturalism Dead:** This is simply false by the standards of contemporary philosophy. Naturalistic ethics (Neo-Aristotelianism, Cornell Realism, Functionalist accounts) is a dominant, thriving field. These philosophers argue the gap is either bridgeable or based on a misunderstanding of what moral facts are. Declaring it "dead on arrival" ignores the last 100 years of ethical theory.

  **6. "The only way out is to start from some basic moral premise you accept on faith or intuition and build upward from there."**
  *   **Verdict:** **False Dichotomy.**
  *   **Analysis:** This describes **Foundationalism** or **Intuitionism**. While this is *one* way to handle the gap, it is not the *only* way.
      *   **Coherentism:** You can argue moral beliefs are justified by how well they cohere with our other beliefs (reflective equilibrium), without needing a foundational "faith" premise.
      *   **Constructivism:** You can argue moral truths are constructed by rational agents, not discovered via intuition.
      *   **Virtue Ethics:** Can argue that "oughts" are derived from facts about human flourishing (naturalism), rejecting the gap entirely.

  ---

  ### The Three Big Questions

  You asked three specific questions about the conflation. Here is the honest audit.

  **1. Is it fair to say the two fallacies are the same thing?**
  No. It flattens a real and important distinction.
  *   **Hume's Gap** is about **motivation and inference**. It asks: How do we move from describing the world to prescribing action? Hume's answer was: Sentiment/Passion.
  *   **Moore's Fallacy** is about **semantics and metaphysics**. It asks: What kind of property is "goodness"? Moore's answer was: A unique, non-natural property.
  *   **Why it matters:** You can be a Humean about motivation (reason doesn't motivate) without being a Moorean about properties (good is non-natural). In fact, Hume wasn't a Moorean at all. Conflating them creates a "super-argument" that is harder to defeat because if you attack one side, the defender retreats to the other.

  **2. Does the non-naturalism about good actually belong to Hume?**
  Absolutely not. The author has smuggled Moore in under Hume's name.
  *   Hume is generally read as an **anti-realist** or a **projectivist** regarding moral properties. He thinks we *feel* approval and project it onto the action. There is no "property" of goodness out there in the universe for Hume, natural or otherwise.
  *   Moore is a **realist**. He thinks "good" is a real property, just not a natural one.
  *   By attributing Moore's non-naturalism to Hume, the blog author makes Hume look like a moral realist (someone who believes in moral facts) when Hume is arguably the grandfather of moral anti-realism. This is a significant distortion.

  **3. Does the conclusion (naturalistic ethics is dead) follow?**
  No. That is a leap the summary does not earn.
  *   The is-ought gap is a *challenge* for naturalists, not a refutation. It forces naturalists to be careful about how they construct their arguments.
  *   Many naturalists argue that "oughts" are a specific kind of "is." For example, if you are a living organism, there are factual claims about what helps you survive and flourish. If morality is about flourishing, then moral claims are a subset of biological/psychological facts.
  *   To say the project is "dead on arrival" ignores that many philosophers believe the gap is a linguistic confusion rather than a metaphysical wall.

  ---

  ### Where You Might Be Oversimplifying

  You mentioned you've "always sort of taken the gap for granted." Since you asked for honesty about where you might be oversimplifying, here are three common traps regarding the is-ought gap that even careful readers fall into:

  **1. Treating the Gap as a Logical Law**
  Many people treat "You can't derive an ought from an is" as a law of logic, like the Law of Non-Contradiction. It isn't. It is a philosophical thesis that is heavily contested. In many logical systems, if you define your terms correctly, you can derive normative conclusions from descriptive premises (especially when dealing with functional kinds, like "a good heart" or "a good knife"). Assuming the gap is an unbreakable logical rule closes off legitimate philosophical inquiry too early.

  **2. Assuming "Facts" and "Values" are Distinct Realms**
  The gap encourages a picture of the world where "facts" (science, physics, biology) sit on one side, and "values" (morality, art, meaning) sit on another, with no bridge. Many modern philosophers argue this picture is false. Thick ethical concepts (like "cruel," "brave," or "generous") are both descriptive and evaluative at the same time. To describe an act as "torture" is already to load it with moral weight. If facts and values are entangled in our language and experience, the "gap" might be an artifact of bad theorizing rather than a feature of reality.

  **3. Thinking the Gap Protects Morality from Science**
  People sometimes like the gap because it seems to protect morality from being "reduced" to biology or physics. They think, "If science can't touch morality, morality is safe." But the flip side is that if science can't touch morality, morality becomes unmoored from reality. If facts are irrelevant to morality, then moral intuitions float free of human psychology, social consequences, or empirical evidence. Most working ethicists want morality to be responsive to facts (e.g., if we learn that a certain punishment doesn't deter crime, that *should* change our moral view on using it). Accepting the gap "full stop" risks making morality irrelevant to the real world.

  ### Summary
  The blog post you read is a piece of "philosophical folklore." It takes two complex, distinct arguments, merges them into a single weapon, attributes the merged view to the wrong philosopher, and declares a victory for intuitionism that hasn't actually been won.

  *   **Hume** said: Watch out how you switch from *is* to *ought*; you need sentiment to bridge it.
  *   **Moore** said: Don't try to define *good* using natural terms; it's indefinable.
  *   **The Blog** said: Hume proved *good* is a non-natural property and naturalism is dead.

  The blog is wrong on the history, wrong on the attribution, and too confident on the conclusion. You are right to doubt it.
