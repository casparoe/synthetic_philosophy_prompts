answer: |-
  The 2006 reclassification of Pluto by the International Astronomical Union (IAU) serves as a striking empirical analogue to the skeptical paradox presented in Saul Kripke's *Wittgenstein on Rules and Private Language*. To treat this as a case study in Kripkenstein is to bracket the astrophysical realities and focus on the semantics of classification. The central philosophical tension mirrors the skeptical paradox: Is there a fact of the matter about the meaning of "planet" that extends to new cases (Pluto), or is the extension of the term determined solely by how the linguistic community proceeds to use it?

  On the Kripkensteinian reading, the "realist" intuition—that the IAU either reported correctly on a pre-existing fact or overturned one by fiat—is problematic. The skeptical paradox argues that no finite history of usage (past applications of "planet" to Mercury through Neptune) logically determines future application. There is no "superlative fact" about the word "planet" that resided in the minds of astronomers prior to 2006 which dictated Pluto's exclusion. Therefore, the episode is better read as a **change of rule** rather than the surfacing of a fact of the matter. The IAU did not discover that Pluto *was not* a planet; they stipulated that "planet" would henceforth mean something that excludes Pluto.

  This reading is supported by the IAU's own deliberative process. The preparatory committee explicitly considered a "cultural option," wherein a planet is defined by sufficient cultural consensus, alongside structural and dynamical criteria. By rejecting the cultural option in favor of a "dynamical criterion" (clearing the neighborhood), the IAU attempted to cloak a decision in the language of discovery. They presented the definition as describing nature rather than deciding it. From the perspective of the skeptical solution, this is a move to legitimize the new practice. The skeptical solution holds that meaning is not truth-conditional but assertibility-conditional: a statement is meaningful if it accords with the community's norms of assertion. By framing the criterion as "dynamical," the IAU sought to make the new norm appear as if it were compelled by the world, thereby securing the agreement necessary for the rule to function.

  The historical case of Ceres reinforces the skeptical interpretation. Announced as a planet in 1801, Ceres was catalogued as an asteroid by the mid-19th century without the object itself changing. If there were a fact of the matter about "planethood" intrinsic to the objects, Ceres's status should not have fluctuated. The shift in Ceres's classification indicates that "planet" functions as a pragmatic category subject to revision based on the proliferation of similar objects, not a natural kind with an eternal essence. Just as with Ceres, the Pluto decision reflects a shift in the community's administrative needs rather than a revelation of metaphysical truth.

  However, pressing the skeptical solution against the specifics of the 2006 vote reveals significant strain. Kripke's skeptical solution relies on the notion of a community agreeing in judgments. This agreement is typically portrayed as a pre-reflective accord in "forms of life"—a background consensus that makes rule-following possible. The IAU resolution, however, was not a manifestation of spontaneous agreement but the result of a formal vote. Furthermore, the community was not unanimous; a significant minority voted against the resolution, and a substantial segment of the planetary science community (such as members of the Division for Planetary Sciences of the American Astronomical Society) has continued to dissent.

  This raises a question the rule-following literature does not fully anticipate: **Whose dispositions fix the meaning when the community is fractured?** Kripke's model assumes a relatively homogeneous community where deviations are corrected. In the Pluto case, the "correction" is contested. If meaning is use, and the use is split, then there is no single meaning of "planet," only competing dialects. Yet, scientific taxonomy requires a singular standard to function. The IAU attempted to resolve this by institutional fiat, but the skeptical solution lacks the resources to explain why the IAU's majority vote should bind the dissenting minority's linguistic practice. The "community" in Kripke is descriptive (who actually agrees?), but the IAU acted prescriptively (who *should* agree?). This suggests that in institutional contexts, the "community" is not just a group of speakers sharing dispositions, but a political body with the authority to enforce standardization. The skeptical solution strains here because it cannot easily account for the normativity of *legislated* meaning versus *evolved* meaning.

  Running the analysis the other way, does the episode support or embarrass the skeptical solution? It largely supports the core thesis that there is no fact of the matter independent of community practice. The intense debate proves that the facts of Pluto's orbit and mass were known long before 2006; what changed was the willingness of the community to apply the label "planet" to those facts. This vindicates the claim that meaning is not fixed by past usage or physical reality alone.

  However, it embarrasses the skeptical solution regarding the mechanism of agreement. The literature often treats community agreement as a condition for the *possibility* of meaning. The Pluto episode suggests that meaning can persist *through* disagreement, or rather, that institutional authority can temporarily suspend the requirement for broad agreement. The IAU's ability to impose a definition despite the split suggests that "meaning" in scientific discourse is partly constituted by power structures, not just shared dispositions. This reveals a gap in the rule-following literature: it tends to model language games as egalitarian interactions, whereas scientific taxonomy is hierarchical. The "fact of the matter" that the IAU claimed to be reporting was a necessary fiction to maintain the authority of the classification system.

  In separating what is settled from what is contested in the literature, we must be precise. It is settled within the Kripkensteinian framework that there are no truth-conditional facts about meaning that transcend use. It is contested, however, whether Kripke's reading accurately represents Wittgenstein, and whether the skeptical solution successfully avoids collapsing into skepticism. Regarding the Pluto case, we must not present the Kripkensteinian reading as the only valid philosophical interpretation, but rather as the lens requested. Within that lens, the conclusion is clear: The 2006 Assembly did not find a fact; they forged a rule.

  Ultimately, the Pluto episode reveals that the "community" required for the skeptical solution is more fragile and politically complex than the literature often assumes. When the dispositions of the speakers diverge significantly, the "rule" does not simply dissolve; it becomes a site of contestation where authority, rather than agreement, determines the extension of the term. The IAU's rejection of the "cultural option" was an attempt to hide this political reality behind a veil of dynamical necessity. The skeptical solution correctly identifies that there was no pre-existing fact, but it underestimates the degree to which the "agreement" it relies upon can be manufactured by vote rather than found in shared forms of life. The object (Pluto) remained constant; the fact (its status) did not exist until the community, through a fractured and contested process, decided to bring it into being.
