answer: |-
  ### The Decision Tree

  **Node 1:** Do the pain and death of individual insects carry moral weight in themselves, independent of human interest?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2:** If insects have no individual standing, is value located solely in human utility, or does ecosystem integrity have independent value?
  *   **Human Utility Only:** **Leaf 1**
  *   **Ecosystem Integrity:** **Leaf 2**

  **Node 3:** If insects have standing, is the primary unit of moral concern the *individual* or the *collective* (population/species)?
  *   **Collective:** **Leaf 3**
  *   **Individual:** Go to Node 4.

  **Node 4:** Does the human practice of agriculture (intention/necessity) create a moral permission to kill that does not exist in wild nature?
  *   **Yes (Agriculture is Special):** **Leaf 4**
  *   **No (Rights are Universal):** Go to Node 5.

  **Node 5:** When billions of individuals are affected, does the arithmetic of total suffering justify the harvest, or does the scale reveal a moral breakdown that forbids the act?
  *   **Justifies (Aggregation Counts):** **Leaf 5**
  *   **Forbids (Arithmetic Breaks Down):** **Leaf 6**

  ***

  ### The Leaves (Positions)

  1.  **Resource Instrumentalism:** Insects are morally inert obstacles; *awkward commitment:* there is no ethical limit to cruelty or extinction if it increases economic yield.
  2.  **Holistic Ecocentrism (Unnamed):** Ecosystem stability matters, but individual insects do not; *awkward commitment:* one must cull thriving individual insects to maintain an abstract "balance" even when they cause no harm.
  3.  **Conservation Welfarism:** The preservation of the species or population trumps the life of the individual; *awkward commitment:* one must allow a pest species to survive and reproduce even when it causes massive human hardship or individual insect suffering.
  4.  **Agrarian Contractualism (Unnamed):** Entering the practice of agriculture waives the insect's right to life; *awkward commitment:* an insect's moral status vanishes instantly at the property line, making the fence a moral event horizon.
  5.  **Sentient Utilitarianism:** The sum of suffering determines the right action; *awkward commitment:* implies a duty to intervene in wild nature to reduce natural insect mortality, potentially requiring the management of all ecosystems.
  6.  **Sentient Deontology:** Individual rights are absolute and cannot be aggregated; *awkward commitment:* implies agriculture is inherently immoral regardless of human need, requiring the abandonment of farming or strict veganism beyond plant consumption.

  ***

  ### Logical Gaps and Overlaps

  **Unoccupied Combinations:**
  *   **Standing + Collective + Agriculture is Special:** *Diagnosis: Incoherent.* If the moral unit is the species or population, the human context (agriculture) should not override the duty to preserve that unit. Those who hold this view usually collapse into Instrumentalism (Leaf 1) regarding pests.
  *   **No Standing + Ecosystem Integrity + Agriculture is Special:** *Diagnosis: Unexplored/Unattractive.* This would imply caring about wild ecosystem balance but allowing total domination of agricultural ecosystems. Most ecocentrists (Leaf 2) view agro-ecosystems as degraded, not morally exempt.

  **Indistinguishable Leaves:**
  *   **Leaf 1 (Instrumentalism) and Leaf 2 (Ecocentrism):** *Diagnosis:* The tree cannot separate these on the *broad-spectrum spray* case. Both permit the spray; they differ only on the *reason* (profit vs. balance). To separate them, one would need a case where profit and ecosystem health diverge (e.g., a profitable spray that causes long-term soil collapse).

  ***

  ### Case Stress-Test

  Here is how the four specific cases sort against the leaves. Note especially the verdict on Case 4, where principles often embarrass the position.

  **Case 1: Broad-spectrum spray (1 billion insects die for harvest).**
  *   **Leaves 1, 2, 4:** **Permitted.** (Value is human, ecosystem, or practice-based).
  *   **Leaf 3:** **Forbidden.** (Threatens the pest population's regional stability).
  *   **Leaf 5:** **Contingent.** Permitted only if human benefit outweighs 1 billion units of insect suffering.
  *   **Leaf 6:** **Forbidden.** (Violates 1 billion individual rights).

  **Case 2: Sterile-male programme (Regional extinction of pest).**
  *   **Leaves 1, 2, 4:** **Permitted.** (Removes obstacle/manages ecosystem).
  *   **Leaf 3:** **Forbidden.** (Violates the duty to preserve the species/population).
  *   **Leaf 5:** **Permitted.** (If painless, prevents future suffering of future generations).
  *   **Leaf 6:** **Forbidden.** (Prevents individuals from existing, or violates rights of current sterilized males).

  **Case 3: Engineered crop (Kills only the specific feeder).**
  *   **Leaves 1, 2, 4:** **Permitted.** (Efficient management).
  *   **Leaf 3:** **Contingent.** Permitted if the population remains viable elsewhere; forbidden if it threatens the species.
  *   **Leaf 5:** **Permitted.** (Reduces total suffering compared to broad-spectrum).
  *   **Leaf 6:** **Forbidden.** (Still kills individuals who have a right to life).

  **Case 4: High natural mortality pest (Young perish in vast numbers regardless of us).**
  *   **Leaves 1, 2, 4:** **Permitted.** (Human death is just another cause among many).
  *   **Leaf 3:** **Forbidden.** (Human intervention reduces population size further).
  *   **Leaf 5 (Utilitarian):** **Permitted (and potentially Obligatory).** *Embarrassment:* If the natural life is net suffering, killing them painlessly is a *benefit*. This implies a duty to kill wild insects to save them from nature.
  *   **Leaf 6 (Deontologist):** **Forbidden.** *Embarrassment:* Must let the insect die a "natural" painful death rather than a quick human death, because the *agent* matters more than the *outcome*. The principle holds, but the intuition that "quick death is better" is overruled.
