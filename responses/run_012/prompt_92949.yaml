  ### Candidate Rules

  There are two primary rules that fit the first three rulings equally well, distinguished by how they weigh **network structure** (exposure) against **epistemic disposition** (trust/revision).

  **Rule 1: The Epistemic Vice Rule (Disposition-Primary)**
  *   **Logic:** Classification is determined by the *mechanism* of information rejection.
      *   **Epistemic Bubble:** Rejection via **absence** (structural exclusion). Members *would* revise if exposed.
