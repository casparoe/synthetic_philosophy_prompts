answer: |-
  1. The strongest version of eliminativism claims that common sense psychology is a radically false theory whose core terms refer to nothing that actually exists in the brain. It asserts that just as we discarded demons to explain illness, we will eventually discard beliefs to explain behavior.

  2. The cultural technology view shifts the debate from false theory to useful artifact, suggesting beliefs are real social tools rather than non-existent brain states. This relocates the argument by granting predictive utility while denying biological reality, making beliefs like currency rather than caloric fluid.

  3. A state can underwrite reliable prediction while being an artifact of talk if the prediction relies on shared coordination rather than internal mechanics. This means explanatory indispensability proves social utility, not necessarily ontological realism about the individual mind.

  4. The awkward fact that folk psychology predicts behavior remarkably well is explained away by claiming we mold ourselves to match the predictions of the theory. This turns the success of the theory from evidence of its truth into evidence of its power to shape human development.

  5. The sharpest line of inquiry is to ask whether a person raised entirely outside this culture would lack beliefs entirely, or merely lack the vocabulary to report them. This distinction reveals whether she sees belief as a constitutive part of human cognition or merely an optional interface layer.
