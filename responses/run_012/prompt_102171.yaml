      *   **Diagnosis:** It is **Two Questions Under One Name**, leading to a **Verbal Dispute** that masks a **Substantive Metaphysical Stalemate**.
      *   **Mapping Normativity:** Distinguish *Semantic Normativity* (correctness conditions) vs. *Guidance Normativity* (justification for application).
      *   **Side Analysis:**
          *   Dispositionalists $\rightarrow$ Constitution + Semantic Normativity.
          *   Skeptics/Anti-Reductionists $\rightarrow$ Justification + Guidance Normativity.
      *   **Path to Progress:** Dissolution via separation. If meaning fixes content but doesn't guide, the skeptic loses the foothold. Shift to externalism or pragmatism.
      *   **Self-Correction/Limitations:** Where this diagnosis might be wrong (Kripke's intention, the unity of the phenomenon).

  9.  **Refining the Tone:**
      *   Academic, peer-to-peer, rigorous. Avoid condescension. Use technical terminology correctly (constitutive, justificatory, normativity, reductionism).
      *   Ensure I answer the specific prompts: "Diagnose," "Where does burden sit," "Which reading of normativity," "What counts as progress," "Where reasoning might fail."

