      *   *Payoff-Unit:* This is a classic objection. If bets are in money, risk aversion blocks the pump. If bets are in utility, it's circular. *Resolution:* The argument usually presupposes a linear utility over the betting medium or treats the bets as revealing the utility directly. The "third option" is often that the argument applies to *degrees of belief* abstracted from desire, or that it establishes a consistency constraint on the *structure* of preferences regardless of the specific currency, provided the currency is treated as a numeraire.
      *   *Partition:* EU depends on the state space. Coherence doesn't fix the state space. *Agreement:* Theorems take the algebra as given. Rationality *might* require refining the algebra, but the math doesn't prove that.
      *   *Dynamic/Pump Premises:* Money pumps need a specific dynamic structure (no learning, no precommitment). Dutch books need simultaneous acceptance. *Agreement:* Vulnerability requires a bridge principle linking coherence to willingness to bet/trade.
      *   *Idealization:* Logical omniscience is assumed in standard Dutch Book arguments for probabilism. *Agreement:* Theorems apply to ideal agents. Application to humans requires a theory of bounded rationality or an "ought implies can" caveat.
      *   *Triviality:* Representation theorems define utility *from* preferences. Is EU trivial? *Agreement:* It's not trivial if the axioms are substantive constraints on preference. It is trivial if "utility" is just a label for whatever ordering exists.
      *   *Completeness:* Can rational agents have gaps? *Agreement:* Theorems require completeness for a unique probability/utility pair. Gaps allow multiple representations.
