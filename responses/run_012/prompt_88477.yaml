          *   *Nuance:* They aren't strictly contradictory if carefully defined, but rhetorically they clash.
          *   *However,* (4) explicitly says "not the worst case." This contradicts (1)'s "only as strong as its worst case."
      *   *Decision:* The single best revision is to harmonize (1) and (4) by distinguishing *epistemic* worst-case (objectives) from *aleatoric* tail risk (environments).
