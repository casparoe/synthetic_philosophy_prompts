          *   Propose a revision that distinguishes *Epistemic Robustness* (1) from *Statistical Risk* (4).

  7.  **Refining the "Cost" Analysis:**
      *   User cares about the *price* of repair.
      *   If I fix (1) vs (4) by softening (1), I lose the "decision-theoretic" shield.
      *   If I fix it by hardening (4), I lose the "empirical" flexibility.
