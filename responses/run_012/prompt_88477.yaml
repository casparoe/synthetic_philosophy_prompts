      *   *(3) Utility under Uncertainty:* Systems must act under uncertainty. Paralysis is useless. Systems must learn on the job. (Empirical/Pragmatic).
      *   *(4) Tail Risk Focus:* Avoid low-probability, high-stakes failure. Care about *expected loss concentrated in the tail*, not worst case. (Statistical/Risk Management).
      *   *(5) Statistical Testing:* Run across broad samples. For practical purposes, that's enough. (Empirical/Engineering).
      *   *(6) Deployment Condition:* Deploy if expected benefits are large, *provided risk is bounded in the sense of (1)*. (Hybrid).

  3.  **Identify Tensions (The "Seams"):**

      *   **Tension A: (1) vs. (4) & (5).**
