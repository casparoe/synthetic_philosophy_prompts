answer: |-
  You have described a specific, pernicious logical structure that sits at the intersection of the philosophy of science, sociology, and rhetoric. You are right to feel that standard terms like *ad hoc rescue* or *degenerating research programme* are slightly off; those describe the *act* of saving a theory, but not the specific *mechanism* where the failure of the prediction becomes the proof of the theory.

  Here is the breakdown of the shape you are seeing, the existing terminology that comes closest, and a coined term that marks the edges exactly as you requested.

  ### 1. The Existing Names
  The broad logical category is a **Self-Sealing Argument** (or **Self-Sealing Doctrine**). This is an argument that cannot be disproven because any evidence offered against it is reinterpreted as evidence for it.

  However, the specific sociological phenomenon you are describing was canonized in 1954 by Leon Festinger, Henry Riecken, and Stanley Schachter in their book ***When Prophecy Fails***. They infiltrated a doomsday cult that predicted a flood on a specific date. When the flood didn't happen, the cult did not disband. Instead, they claimed that their faith and publicity had *saved* the world. The non-event was counted as confirmation of their special status.

  In philosophy of science, this is a specific subtype of Popper's **Immunizing Stratagem** (or **Conventionalist Stratagem**). But your intuition is correct: standard immunization usually involves tweaking a variable (e.g., "the planet is there, but invisible"). Your example involves **inverting the valence of the evidence**.

  ### 2. A Coined Term: **The Prophylactic Proof**
  Since you asked for a name that marks the edges, I propose **The Prophylactic Proof** (or **Validation by Avoidance**).

  *   **Prophylactic:** Relating to measures taken to prevent disease or disaster.
  *   **Proof:** Evidence establishing a fact.

  This term captures the specific twist: the "cure" (avoidance of the disaster) is presented as proof of the "diagnosis" (the theory that predicted the disaster). It distinguishes itself from a standard *ad hoc* rescue because it doesn't just explain away the anomaly; it actively claims the anomaly as a victory.

  ### 3. Distinguishing from a Self-Fulfilling Prophecy
  This is a crucial edge to mark.
  *   **Self-Fulfilling Prophecy:** The prediction causes the event to happen. (e.g., "This bank is insolvent" -> depositors withdraw -> bank becomes insolvent). The prediction is **confirmed by occurrence**.
  *   **The Prophylactic Proof:** The prediction causes the event *not* to happen, and the non-event is claimed as confirmation. (e.g., "This bank is insolvent" -> regulators intervene -> bank survives -> predictor says "My warning saved it"). The prediction is **confirmed by avoidance**.

  In logic, the self-fulfilling prophecy is a causal loop where $P \to E$. The Prophylactic Proof is a logical loop where $P \to \neg E \to \text{Confirmation of } P$.

  ### 4. Is the "Sliding Deadline" the Same Phenomenon?
  Yes, it is the **temporal variant** of the same structure.
  *   **Spatial/Outcome Variant (Prophylactic Proof):** The disaster doesn't happen *at all* because the mechanism worked.
  *   **Temporal Variant (The Procrastination Principle):** The disaster doesn't happen *yet* because the mechanism is slower than expected.

  In both cases, the falsifying condition (the disaster) is indefinitely deferred, while the theoretical mechanism (the pressure/scarcity) is retained as "true." In the sliding deadline version, the *continued existence* of the pressure is counted as evidence, even if the *effect* of the pressure never materializes. They are cousins: one claims success via prevention, the other claims patience via delay. Both render the theory unfalsifiable in practice.

  ### 5. Could a Theory with This Structure Ever Be Wrong?
  **No.** By definition, a theory that accepts both $E$ (disaster happens) and $\neg E$ (disaster avoided via mechanism) as confirmation has ceased to be a scientific theory and has become a **belief system** or an **ideology**.

  In Popperian terms, it has zero **empirical content**. A theory that forbids nothing is compatible with everything.
  *   If the crash happens: "We told you so."
  *   If the crash doesn't happen: "The mechanism worked."

  For this theory to be wrong, you would have to prove that the **mechanism itself does not exist**. But proponents usually protect the mechanism with the same shield. (e.g., "You say population isn't outrunning food? That's just because of temporary fertilizers, the underlying pressure is still there.")

  ### Summary of the Shape
  *   **Formal Logic:** Self-Sealing Argument / Unfalsifiable Hypothesis.
  *   **Sociological Precedent:** *When Prophecy Fails* (Cognitive Dissonance Reduction).
  *   **Descriptive Name:** **Validation by Avoidance** or **The Prophylactic Proof**.
  *   **Status:** Pseudoscience / Ideology.

  The reason this feels so frustrating is that it steals the rhetorical power of a warning ("Look at the danger!") without accepting the epistemic risk of being wrong ("If the danger doesn't appear, I was mistaken"). It allows the predictor to claim the moral authority of Cassandra without suffering Cassandra's fate.
