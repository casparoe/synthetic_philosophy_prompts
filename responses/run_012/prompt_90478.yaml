          4.  Analyze the "residue": The gap between behavioral regularity and normativity (doing vs. ought).
          5.  Adjudicate the colleague's claim: Is model collapse *actually* Wittgenstein's argument, an analogy, or a confusion?

  2.  **Deconstruct Wittgenstein's Private Language Argument (PLA):**
      *   *Core Claim:* A language whose words refer to the speaker's immediate private sensations (which only the speaker can know) is impossible.
      *   *The Diary Case:* I associate a sign 'S' with a sensation. Tomorrow, I use 'S' again. How do I know I'm using it correctly? I have no independent check. Memory isn't a check; it's just another occurrence.
      *   *The Beetle in the Box:* Everyone has a box. No one can look inside. The word "beetle" is used. The object inside drops out of consideration. The meaning isn't the private object; it's the public use.
      *   *Rule Following:* A rule must distinguish between *following* the rule and *thinking* one is following the rule. If "whatever seems right to me is right," there is no right or wrong.
      *   *Public Criteria:* Meaning requires public checkability, shared practices, and the possibility of being wrong in a way others can identify.

  3.  **Translate to Engineering Vocabulary:**
      *   *Private Sensation:* Internal hidden state, latent representation, or a reward signal generated internally without external reference.
      *   *Diary Entry:* Logging a value or label generated by the model itself.
      *   *Ground Truth:* The "public" standard. External validation set. Oracle.
      *   *Rule:* The policy / loss function / update rule.
      *   *Correctness:* Minimizing loss on a *held-out* distribution that represents reality.
      *   *Model Collapse:* Distributional drift, mode collapse, entropy reduction, feedback loop degradation.

  4.  **Map the Moves (Step-by-Step):**

      *   *The Diary:* User logs a label $y_{pred}$ as $y_{true}$ for the next step.
