prompt: |-
  I'm a novelist, third book, the one that's meant to be my serious one, and it turns on a jury that deliberates for four days and comes out wrong. I've read enough pop-science stuff about the Condorcet jury theorem to know the version where a crowd of half-competant people beats one expert, but I dont trust my grip on it and I've got a year of reading before I start drafting. So: which open questions about how groups of ordinary people get at the truth matter most for someone in my position, and in what order would you have me take them on? I want your reasoning, not a reading list — what's upstream of what, which questions are still genuinely live versus settled, and which ones sound deep but wouldn't change a word of how I write the deliberation. Two instincts I'd like you to push on rather than just confirm: I suspect the independence assumption is where the real drama is, since a jury that shares a false premise isn't twelve people making twelve independent errors, it's one error with twelve votes; and I don't think a yes/no verdict is the interesting case, because my jury has three counts and the thing I'm actually trying to write is a group thats right on every count and wrong as a whole. Tell me whether those are the right rabbits or the wrong ones, and where a novelist's questions happen to line up with the real open problems in the theory — I only care about the second insofar as it feeds the first. Last line: "Start here:" followed by the single question you'd have me read into first, in ten words or less.
