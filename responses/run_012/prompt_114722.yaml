answer: |-
  Your instincts are both correct, and they identify the two specific fracture points where mathematical theory breaks under the weight of human psychology.

  First, the independence assumption. You are right: this is the upstream failure mode. The Condorcet Jury Theorem (CJT) mathematically requires that voters decide independently. If Juror A influences Juror B, their errors correlate. If they share a cultural bias or hear the same misleading news report, you no longer have twelve independent trials; you have one biased signal amplified twelve times. For a novelist, this is where the drama lives. It shifts the conflict from "who is smarter" to "who controls the premise." If you write a jury that simply votes based on evidence, you are writing a math problem. If you write a jury that shares a false narrative, you are writing a tragedy. This question is live in social epistemology because while the math is settled, the threshold at which correlation destroys truth-seeking is not.

  Second, the "right on counts, wrong on whole" instinct. This is the Discursive Dilemma (or Doctrinal Paradox). It occurs when a group votes on premises individually (Count 1, Count 2, Count 3) and reaches a majority on each, but the logical conclusion of those premises contradicts the majority's direct vote on the verdict. This is superior to a simple mistake because it allows your characters to be individually rational yet collectively irrational. It creates a structural irony that doesn't require anyone to be stupid or corrupt. This is a live problem in legal theory and social choice, specifically regarding whether groups should vote on premises or conclusions.

  Here is the order in which you should tackle these questions, based on narrative dependency:

  1.  **How does deliberation correlate errors?** (Upstream)
      You must solve this before drafting dialogue. If your jurors are independent, deliberation improves accuracy. If they are correlated, deliberation amplifies error. You need to decide *what* binds them: a charismatic foreman, a shared trauma, or a misleading piece of evidence introduced early. This determines whether your jury is a crowd or a mob.

  2.  **How do premise votes map to verdicts?** (Structure)
      Once you know how they think, you need to know how they count. This addresses your second instinct. Decide if your jury votes on the counts first and derives the verdict, or votes on the verdict and rationalizes the counts. This choice dictates the logical trap they fall into.

  3.  **What social forces override evidence?** (Mechanism)
      This is downstream. Once the math and logic are set, you need the human pressure. Conformity bias, fatigue, and status hierarchies are well-documented. These don't change the logic, but they explain why a juror might acquiesce to a false premise they privately doubt.

  Ignore questions about optimal group size or asymptotic limits (what happens with infinite voters). Those are mathematically deep but narratively inert; you have twelve people, not infinity. Also ignore normative questions about how juries *should* work; you are writing about how they *do* work.

  Start here: How does deliberation destroy voter independence?
