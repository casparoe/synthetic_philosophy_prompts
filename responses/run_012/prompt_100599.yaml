answer: |-
  To: Scientific Advisory Council
  From: [Your Name]
  Re: Recommendation on Grantee Renewal

  I recommend **renewal on stated conditions**, rather than acceptance as requested or outright decline. While the grantee's work retains heuristic value, describing their framework as "broadly vindicated" is intellectually indefensible and risks the foundation's credibility.

  The team's defence—that they were "right but early"—engages a legitimate philosophical point. As Lakatos noted, theories are not abandoned after a single anomaly. Core mechanisms often survive initial falsifications because auxiliary hypotheses (like trade flows or technological adoption rates) are uncertain. The grantee correctly noted intermediate indicators moved in the predicted direction; this suggests the core logic captures real dynamics. However, timing is data. In resource systems, a delay caused by technological substitution is not merely a "delay" of the original mechanism; it is a falsification of the assumption that substitution is insufficient. To claim vindication despite this is to change the definition of the mechanism post-hoc.

  There is a sharp distinction between a research programme that stays progressive by generating new, risky predictions and one that persists only by patching its "protective belt" with ad hoc explanations. Currently, this programme risks degeneration. Attributing the missed collapse to exogenous factors is permissible once, but only if those factors are subsequently integrated or if new, specific risks are taken.

  To operationalize this distinction for funding, we must demand that the programme produce novel facts, not merely accommodate history. A progressive programme predicts something unexpected; a degenerating one explains away failures after the fact. Therefore, renewal must be contingent on three commitments:

  1.  **Reporting Language:** The annual report must not claim vindication. It should state the model remains a viable scenario but requires recalibration following the missed threshold date. Accuracy matters more than morale.
  2.  **Pre-registered Falsification:** The team must commit to specific, observable conditions over the next five years that would invalidate the core mechanism. For example, if global fertilizer efficiency continues to rise without diminishing returns by 2029, or if trade volumes expand beyond a specified limit without triggering the predicted scarcity feedbacks, the model must be acknowledged as failed. We cannot fund a model where every outcome is consistent with the theory.
  3.  **Endogenization:** The factors currently treated as exogenous saviors must be brought inside the model. If trade and fertility decline remain external "magic knobs" used to defer collapse indefinitely, the core Malthusian mechanism is unfalsifiable.

  The council has asked what would count as "too late." The answer is: when the protective belt becomes thicker than the core. If more assumptions are required to save the model than the model contains mechanisms, it is time to stop.

  Over the coming five years, observations that ought to count against them include: continued deferral of collapse solely attributed to unforeseen policy changes or technological shocks not modeled in advance; and a failure to identify a binding constraint that behaves as the core mechanism dictates. If, in 2029, the explanation for another missed deadline is again a list of exogenous factors not previously weighted as decisive, the programme should be deemed degenerating and funding ceased. I propose a mid-term review at year three to assess progress on endogenization.

  This approach respects the difficulty of long-horizon modelling while upholding scientific rigor. We support the inquiry, but not the immunity from falsification.
