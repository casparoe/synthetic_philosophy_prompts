answer: |-
  This is a sophisticated request that requires disentangling rhetorical slogans from philosophical theses. Both phrases originate primarily with Daniel Dennett (specifically *Darwin's Dangerous Idea*, 1995), but as you have observed, they have migrated into general usage where their precision often degrades.

  I must push back slightly on the framing: you ask for a map of "distinct precise claims." The reality is that these are **rheorical constraints**, not logical operators. Their power lies in their ambiguity, which allows a speaker to slide between a modest methodological warning and a radical ontological claim without noticing. A "map" of them must therefore distinguish between what Dennett *intended*, what they *logically entail*, and how they are *actually deployed* in your discussion group.

  Here is the map you requested, followed by an analysis of their relationship and consistency.

  ---

  ### Part 1: "Cranes, not Skyhooks"

  **The Metaphor:** A crane lifts weights by resting on the ground and building up. A skyhook lifts weights by hanging from nothing (a miracle).

  #### Reading 1: Methodological Naturalism
  *   **Claim:** Explanations must not invoke supernatural agents, magic, or violations of physical law.
  *   **Status:** **Platitude.** In a scientific context, this is a definition of the game, not a move within it.
  *   **Verdict:** Trivial. No one in a science discussion group should be positing actual magic.

  #### Reading 2: Historical Continuity (The Darwinian Imperative)
  *   **Claim:** Complex functions (like language or morality) must be shown to arise from simpler precursor functions via a step-by-step process (like natural selection), rather than appearing fully formed.
  *   **Status:** **Substantive and Defensible Thesis.** This is the core of evolutionary psychology. It demands a "how possible" story for the transition from A to B.
  *   **Verdict:** Empirical claim. It can be tested by looking for fossil/behavioral precursors.

  #### Reading 3: Anti-Emergentism (Causal Closure)
  *   **Claim:** Higher-level phenomena (consciousness) do not possess causal powers that are independent of their lower-level constituents. There is no "downward causation" that bypasses the physical substrate.
  *   **Status:** **Contestable Philosophical Claim.** This denies "strong emergence." Many philosophers of mind argue this is false or unproven.
  *   **Verdict:** Metaphysical. It cannot be empirically tested directly, as it concerns the nature of causation itself.

  #### Reading 4: The Prohibition on Primitives (Universal Explanation)
  *   **Claim:** *Nothing* is fundamental. Every trait, even the laws of logic or the nature of consciousness, must eventually be explained by a crane (evolution/physics). To posit a primitive is to posit a skyhook.
  *   **Status:** **Radical and Likely False.** Most scientific explanations bottom out in primitives (e.g., the laws of physics, the fact of existence). Demanding a crane for *everything* leads to an infinite regress.
  *   **Verdict:** Confused. It conflates "unexplained explainer" (bad) with "axiom" (necessary).

  #### The Discussion-Ender
  When used to stop a debate, the speaker is usually sliding from **Reading 2** to **Reading 3**.
  *   **How it works:** The opponent proposes a feature of mind (e.g., "semantic content") that seems irreducible. The speaker says, "That's a skyhook."
  *   **The Move:** They treat a *current lack of a crane* (we don't know how semantics evolved) as proof of a *skyhook* (semantics must be magic/non-natural). It shifts the burden of proof impossibly: "Unless you can show me the crane right now, your posit is invalid."

  ---

  ### Part 2: "Greedy Reductionism"

  **The Metaphor:** A reductionist wants to explain the higher level in terms of the lower level. A *greedy* reductionist wants to do this without paying the cost of bridging the levels, often claiming the higher level doesn't exist.

  #### Reading 1: Impatience with Intermediate Levels
  *   **Claim:** You are skipping necessary explanatory steps. You cannot jump from "neurons firing" to "Shakespearean tragedy" without accounting for psychology, culture, and history.
  *   **Status:** **Methodological Warning.** A reminder that different levels of abstraction have different explanatory virtues.
  *   **Verdict:** Platitude/Good Advice. Almost everyone agrees that skipping levels loses information.

  #### Reading 2: Loss of Predictive/Explanatory Power
  *   **Claim:** The lower-level account (e.g., chemistry) cannot capture the patterns visible only at the higher level (e.g., economic trends). Reducing it eliminates the ability to predict the phenomenon.
  *   **Status:** **Substantive Epistemic Claim.** This argues for the autonomy of special sciences (biology, psychology).
  *   **Verdict:** Defensible. It is an empirical claim about the utility of models.

  #### Reading 3: Eliminativism (The "Nothing But" Claim)
  *   **Claim:** Because the lower level is the "real" level, the higher level is an illusion. Love is *nothing but* oxytocin; morality is *nothing but* kin selection.
  *   **Status:** **Ontological Claim.** This denies the reality of the higher-level phenomenon.
  *   **Verdict:** Highly Contestable. Many argue this is a category error (confusing constitution with identity).

  #### The Discussion-Ender
  When used to stop a debate, the speaker is invoking **Reading 3** while pretending to defend **Reading 1**.
  *   **How it works:** The opponent offers an evolutionary account of morality (e.g., "reciprocal altruism"). The speaker says, "That's greedy reductionism."
  *   **The Move:** They imply that *any* attempt to explain the higher level via the lower level is suspect. It protects the higher-level phenomenon (morality) from being "explained away." It functions as a defense of folk psychology against evolutionary psychology.

  ---

  ### Part 3: Comparison and Consistency

  #### Are they Mirror Images?
  **Yes, structurally.** They are symmetrical constraints on explanatory leaps.
  *   **Cranes** prohibit jumping **UP** without support. (Don't assume complex function without a history).
  *   **Greedy Reductionism** prohibits jumping **DOWN** without a bridge. (Don't assume base components explain the function without a mechanism).

  Together, they demand a **continuous chain of explanation**.
  *   *Cranes* say: You can't start at the top (Mind) without a bottom (Physics/Selection).
  *   *Greedy Reductionism* says: You can't start at the bottom (Physics/Selection) and ignore the top (Mind).

  #### What work does the word "Greedy" do?
  It distinguishes **Good Reduction** from **Bad Reduction**.
  *   **Good Reduction:** "I will show you how the neurons *constitute* the thought, preserving the reality of the thought."
  *   **Greedy Reduction:** "I will show you the neurons, and therefore the thought is an illusion/I don't need to talk about thoughts."
  The word "greedy" accuses the reductionist of taking explanatory credit (claiming to have explained the phenomenon) without paying the cost (showing how the higher-level patterns are preserved). It implies an unfair appropriation of the phenomenon's reality.

  #### Can one consistently wield both?
  **Yes, but it is difficult.**
  To wield both consistently, you must commit to **Non-Reductive Physicalism** (or a similar multi-level view).
  *   You must insist that everything has a physical/evolutionary history (**Cranes**).
  *   You must insist that the higher-level descriptions (mind, morality) are real and not replaceable by lower-level descriptions (**Anti-Greedy**).

  **However, in your discussion group, they are likely used inconsistently.**
  *   **The "Hard" Evolutionist:** Uses "Cranes" aggressively (Reading 3/4) to demand everything be explained by selection. They rarely worry about "Greedy Reductionism" because they are often happy to eliminate the higher-level phenomenon (e.g., "Free will is an illusion").
  *   **The "Humanist" Critic:** Uses "Greedy Reductionism" aggressively (Reading 3) to protect mind/morality from evolution. They often implicitly rely on "Skyhooks" (Reading 3/4 of the first phrase) by treating consciousness or morality as primitives that evolution cannot fully touch.

  **The Verdict on Consistency:**
  It is logically possible to hold both. Dennett held both. But in practice, they are often weapons chosen by opposing sides.
  *   If someone says "Cranes, not Skyhooks" to end a discussion, they are usually pushing for **Eliminativism** (Reading 4 of Cranes).
  *   If someone says "Greedy Reductionism" to end a discussion, they are usually pushing for **Dualism/Primitivism** (implicitly accepting Skyhooks).
  *   Therefore, **no, they are rarely wielded consistently by the same person in the same argument.** They are usually traded like blows. To use both requires admitting that evolution explains the *origin* of the mind (Cranes) but does not explain *away* the reality of the mind (Anti-Greedy).

  ### Summary of the "Discussion Ender" Dynamic

  You asked which reading is in play when the discussion stops. In both cases, it is a **Bait-and-Switch**.

  1.  **"Cranes" Ender:** The speaker pretends to demand **Reading 2** (show me the steps), but actually enforces **Reading 3 or 4** (if you can't show me the steps, your phenomenon is illusory/non-natural). It shuts down the possibility that the phenomenon is real but currently unexplained.
  2.  **"Greedy" Ender:** The speaker pretends to demand **Reading 1** (don't skip steps), but actually enforces **Reading 3** (your lower-level account eliminates the phenomenon). It shuts down the possibility that the lower-level account is constitutive rather than eliminative.

  **Final Pushback:**
  You asked for a map of "precise claims." I must reiterate that these phrases are **rhetorical stoppers**, not precise claims. Their utility in debate comes precisely from their ability to blur the line between "You haven't finished the explanation" (a temporary state) and "Your explanation is the wrong kind" (a fatal error). If you want to defuse them in your group, do not accept the map. Ask the speaker: *"Are you saying I have skipped a step (Greedy), or that my posit is magical (Skyhook)? And if I bridge the step, will you accept the reduction, or do you believe the higher level is ontologically distinct?"* This forces them to pick a specific reading from the maps above.
