  2.  **Deconstruct the Philosophical Concepts:**
      *   **Doomsday Argument (DA):** Based on SSA. If I am a random sample from all humans who will ever live, and I find myself relatively early (e.g., among the first 100 billion), it's more likely that the total number of humans is small (Doomsday soon) rather than huge (Doomsday far away).
      *   **Self-Sampling Assumption (SSA):** "Reason as if you are a random observer from the reference class." (Nick Bostrom).
      *   **Self-Indication Assumption (SIA):** "Given the fact that you exist, you should favor hypotheses according to which more observers exist." (Nick Bostrom/Dennis Dieks).
      *   **Presumptuous Philosopher (PP):** A thought experiment where SIA seems to allow a philosopher to rule out a physical theory (e.g., about the size of the universe) *a priori* just because it implies more observers, even against empirical evidence.
