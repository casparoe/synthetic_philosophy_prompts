      *   **User's Counter:** Statutes are different (collective authorship, coercive power, need for predictability). But the user couldn't articulate *why* these differences matter for the conclusion.
      *   **Task:** Audit the analogy at full strength. Map correspondences (legislator -> author, etc.). Identify missing slots on both sides. Sort breakages into "bearing on conclusion" vs. "noise." Determine if the legal rationale for ignoring intent transfers to literature. If the analogy fails, is the anti-intentionalist conclusion still defensible on other grounds?
      *   **Constraints:** No citations or reading lists. Focus on the argument structure and where the "load is carried." Tone should be analytical, rigorous, but accessible (like a briefing for a reading group).

  2.  **Deconstruct the Analogy (The Mapping):**
      *   *Legal Side:* Legislator (Author), Statute (Text), Judge/Court (Reader/Critic), Defendant/Citizen (Text/Subject?), Precedent (Tradition/Canon), Interpretive Community (Legal Profession/Public).
      *   *Literary Side:* Author, Novel/Poem, Reader/Critic, Text, Tradition/Canon, Interpretive Community (Academia/Public).
      *   *Goal:* Determine if the *reasons* for excluding intent in law apply to literature.

  3.  **Evaluate the "Why" of Legal Textualism:**
      *   Why do courts often reject legislative intent (or treat it as secondary)?
          1.  **Legitimacy/Democracy:** The law is what was *enacted*, not what was *thought*. Only the text went through the constitutional process.
          2.  **Notice/Fairness:** Citizens need to know what the law *says* so they can obey it. They can't read minds.
          3.  **Collective Action Problem:** "The Legislature" is a "they," not an "it." Hundreds of voters had different reasons. There is no single mental state.
          4.  **Finality:** Courts need to decide cases. Endless digging into diaries delays justice.
          5.  **Coercion:** The state punishes you. Punishment requires strict construction.

  4.  **Evaluate the "Why" of Literary Interpretation:**
      *   What is the goal? Understanding, aesthetic experience, cultural critique, pleasure.
      *   Is there coercion? No.
      *   Is there a notice requirement? No.
      *   Is there a collective authorship problem? Sometimes (TV, film), but usually novels are single-authored.
      *   Is there a finality requirement? No. Interpretation is open-ended.

  5.  **Identify the Breakages (Where the Analogy Fails):**
      *   *Coercion/Stakes:* Law punishes; literature invites. This is huge. If I misread a statute, I go to jail. If I misread a poem, I just have a different experience.
      *   *Authorship:* Legislature = Collective body (no single mind). Novelist = Single mind (usually). The "intentional fallacy" argument is stronger in law because the intent *literally doesn't exist* as a singular thing. In literature, it exists, even if inaccessible.
      *   *Function:* Law is instrumental (solve a dispute, regulate behavior). Literature is often expressive or exploratory.
      *   *The "Dead Author" point:* Both sides agree the author might be dead. But in law, that reinforces textualism because we *must* decide. In literature, we don't *have* to decide. We can speculate.

  6.  **Sort Breakages: Noise vs. Load-Bearing:**
      *   *Noise:* "Officials apply it." (Critics apply readings too). "Written by hundreds." (Important, but maybe not fatal to the analogy if we treat the 'author function' as the source).
      *   *Load-Bearing:* **Coercion/Notice** and **The Nature of the "Must."** Law *must* have a single correct answer to function. Literature *doesn't*. Therefore, the pragmatic necessity of killing intent in law doesn't transfer to literature.

  7.  **Assess the Anti-Intentionalist Conclusion (Independent of Law):**
      *   If the statute analogy fails, is "Death of the Author" still viable?
      *   Yes, but on different grounds:
          1.  **Autonomy of the Text:** Language exceeds the speaker. (Structuralism/Post-structuralism).
          2.  **Reader's Role:** Meaning is created in the encounter, not excavated. (Reception Theory).
          3.  **Irrelevance:** Even if we knew the intent, it doesn't settle aesthetic value. (New Criticism).
      *   The flatmate's *conclusion* might be right, but her *premise* (the law analogy) is the weak link.

