      *   *Section 3: The "Dead Author" Argument.* Address her specific point about accessibility. Distinguish between "ontological impossibility" (law) and "epistemic difficulty" (lit).
      *   *Section 4: Saving the Conclusion.* If the law analogy dies, does the anti-intentionalist stance survive? Yes, via the "Textual Autonomy" argument.
      *   *Conclusion:* Summarize the audit.

  9.  **Refining the Tone:**
      *   Keep it sharp. Avoid academic jargon where possible, but use precise terms (normative vs. descriptive, coercive vs. invitational).
