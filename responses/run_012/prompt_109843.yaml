      *   *Check:* Did I avoid citations? *Yes.*
      *   *Check:* Is the distinction between "noise" and "bearing on conclusion" clear? *I will explicitly categorize them.*

  11. **Final Polish:** Ensure the structure mirrors the user's request for an "audit." (Mapping -> Breakages -> Load Analysis -> Alternative Grounds).

  *(Self-Correction Note)*: I need to be careful not to just say "Law is serious, Art is fun." That's reductive. The point is about *function*. Law regulates conduct; Art expands consciousness. The *normative force* is the key difference.

  *(Refining the "Collective Authorship" point)*: In law, the "intent of the legislature" is often a legal fiction because 535 people didn't agree on the *why*, only the *what*. In a novel, the author actually had a specific why. This makes the legal argument for ignoring intent stronger than the literary one. I need to make sure this lands clearly.

