answer: |-
  Here is an audit of the analogy, broken down by structural mapping, points of failure, and an assessment of whether the anti-intentionalist conclusion survives the collapse of the legal premise.

  ### 1. The Structural Mapping

  To test the analogy, we first have to align the components. Your flatmate is arguing that the *functional relationship* between these components in law should dictate their relationship in literature.

  | Legal Slot | Literary Slot | Function in System |
  | :--- | :--- | :--- |
  | **The Legislator** | **The Author** | The source of the utterance. |
  | **The Statute** | **The Text** | The fixed object to be interpreted. |
  | **The Judge** | **The Critic / Reader** | The agent who determines meaning. |
  | **The Defendant / Citizen** | **The Text (again) / Public** | The entity bound by the interpretation. |
  | **The Case / Dispute** | **The Interpretation / Essay** | The occasion for deciding meaning. |
  | **Precedent** | **Canon / Tradition** | Past decisions that constrain current reading. |
  | **Interpretive Community** | **Academia / Public Sphere** | The audience that validates the reading. |

  **The Flatmate's Claim:** Because the Judge ignores the Legislator's mind and looks only at the Statute, the Critic should ignore the Author's mind and look only at the Text.

  **The Missing Slots (Asymmetries):**
  *   **Law has no counterpart for:** *Aesthetic Experience.* Law aims for resolution; literature aims for engagement. There is no "success condition" in law other than a settled verdict. In literature, a "settled" reading can be boring or reductive.
  *   **Literature has no counterpart for:** *Coercive Sanction.* If the Judge reads the statute wrong, the Citizen loses liberty or money. If the Critic reads the novel wrong, nothing happens.

  ### 2. The Breakages: Noise vs. Load-Bearing

  You noted several differences (collective authorship, coercion, predictability). We need to sort these into "noise" (interesting but doesn't change the conclusion) and "load-bearing" (destroys the analogy's logic).

  #### A. Noise (Does not defeat the analogy)
  *   **"The Author might be dead or lying."**
      *   *Why it's noise:* This applies equally to both. Legislators die, lie, or forget too. If this were the sole reason for textualism, it would apply to novels just as hard. This actually *supports* her argument, so it's not a breakage.
  *   **"Officials apply it to strangers."**
      *   *Why it's noise:* Critics apply readings to students and the public. The mechanism of dissemination is different, but the social function of "authorizing a reading" is similar.

  #### B. Load-Bearing Breakages (Defeats the analogy)
  These are the points where the *reason* for ignoring intent in law ceases to exist in literature.

  **1. The Collective Action Problem (Ontological vs. Epistemic)**
  *   **Law:** "Legislative intent" is often an ontological fiction. A statute is passed by 535 people who voted 'yes' for 535 different reasons. There is no single mental state to recover. To ask "what did Congress intend?" is to ask a question that has no answer.
  *   **Literature:** A novel is typically the product of a single consciousness (or a collaborative unity). The intent *exists* as a factual matter, even if it is hard to find.
  *   **Impact:** In law, ignoring intent is necessary because there *is* no intent to find. In literature, ignoring intent is a *choice* to disregard something that actually exists. The legal move is pragmatic necessity; the literary move is methodological preference.

  **2. The Notice Principle (Fair Warning)**
  *   **Law:** The legitimacy of punishment rests on "fair notice." You can only be punished for violating a rule that was publicly available *before* you acted. You cannot be punished for violating a secret thought in a legislator's diary. Therefore, the text *must* be the boundary.
  *   **Literature:** There is no punishment. There is no requirement for "fair warning." A reader is not "violating" a poem if they misunderstand the author's hope.
  *   **Impact:** The moral imperative that forces judges to ignore intent (it would be unjust to punish based on secret thoughts) does not exist for readers.

  **3. Finality vs. Plurality**
  *   **Law:** The system *must* end. A case must be decided so the parties can move on. Ambiguity is a bug that must be fixed by a ruling.
  *   **Literature:** Ambiguity is often a feature. The system does not need to end. Multiple contradictory readings can coexist without breaking the "system" of literature.
  *   **Impact:** Law excludes intent partly to streamline decision-making and ensure uniformity. Literature has no need for uniformity. Excluding intent in literature doesn't solve a systemic bottleneck; it just narrows the field of play.

  ### 3. Does the "Dead Author" Argument Transfer?

  Your flatmate argued: *Intent is inaccessible (dead/lying), so it shouldn't count.*

  In law, this argument works because of the **Stakes**. Because someone goes to jail, we cannot rely on inaccessible evidence. We need the most stable, public evidence available (the text).

  In literature, the stakes are **Understanding**. If intent is inaccessible, it makes it *harder* to understand the author, but it doesn't make the attempt *illegitimate*.
  *   **Legal Logic:** Inaccessible + High Stakes = Exclude Evidence.
  *   **Literary Logic:** Inaccessible + Low Stakes = Speculate / Debate / Acknowledge Uncertainty.

  The legal analogy treats the "inaccessibility of intent" as a disqualifier. In literature, it is merely a hurdle. Historians deal with dead people's intentions all the time; we don't say history is impossible because Napoleon is dead. We say it requires inference. The law treats intent as a fiction because it *needs* a single truth for the verdict. Literature can tolerate the uncertainty.

  ### 4. If the Analogy Fails, Does the Conclusion Stand?

  Your flatmate's conclusion (you don't need authorial intent to understand a book) is a standard position in literary theory (The Intentional Fallacy / Death of the Author). However, if the statute analogy is removed, does the position collapse?

  **No, but the footing changes.**

  If you drop the legal analogy, the anti-intentionalist argument rests on **Linguistic Autonomy**, not **Procedural Necessity**.

  *   **The Legal Grounding (Her argument):** We *must* ignore intent because the system requires predictability and fairness, and the author (legislature) is a fiction.
  *   **The Literary Grounding (Better argument):** We *can* ignore intent because language operates independently of the speaker. Once a text is published, it enters a public linguistic system where words carry cultural weight that exceeds the author's control.

  **Why this distinction matters for your reading group:**
  1.  **Competence:** In law, the Judge is an official enforcing a rule. In literature, the Reader is a co-creator of meaning.
  2.  **Success:** In law, a reading is "correct" if it aligns with the enacted text and precedent. In literature, a reading is "successful" if it is illuminating, coherent, or productive, regardless of whether the author would recognize it.

  If you argue from the **Literary Grounding**, you don't need to prove intent is *inaccessible* (the flatmate's point). You only need to prove intent is *insufficient* or *irrelevant* to the value of the work.
  *   *Example:* If an author writes a racist stereotype but claims they didn't mean it that way, the text still functions as racist. The reader's experience of the harm is real regardless of the author's private hope. The text has consequences the author didn't intend.

  ### 5. Summary Audit for the Reading Group

  **The Verdict on the Analogy:**
  The statute analogy is **structurally unsound** for literary interpretation. It imports a logic of **coercion and finality** into a sphere of **invitation and plurality**.
  *   **Load-Bearing Failure:** The legal reason for ignoring intent is to protect citizens from unpredictable punishment by a collective body that has no single mind. Neither condition applies to a novel.
  *   **Result:** You cannot use the *necessity* of legal textualism to prove the *validity* of literary textualism.

  **The Verdict on the Conclusion:**
  The conclusion (that we can understand a book without authorial intent) is **defensible**, but not on legal grounds.
  *   **Shift the Ground:** Move from "Intent is inaccessible/irrelevant" (Legal/Epistemic) to "The text generates meaning beyond the author's control" (Linguistic/Aesthetic).
  *   **The Audit:** Tell your group the flatmate was right to be suspicious of "biographical smuggling," but wrong to use the law as the warrant. The law ignores intent to ensure **justice**. Criticism ignores intent (sometimes) to ensure **richness**. These are different goals requiring different rules.

  **Final Takeaway:**
  The law asks: *What rule binds us?*
  Literature asks: *What does this make possible?*
  You cannot answer the second question using the rules designed for the first.
