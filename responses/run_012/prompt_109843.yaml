prompt: |-
  My flatmate's in law school and we ended up arguing till about 1am over whether you can understand a book without caring what the author meant. Her move was the statute analogy: she says when a court reads a statute nobody asks what the legislator was thinking, they read the words, and if the words are ambiguous you argue about the words, not about the draftsman's hopes — so the same goes for a novel, and anyone who insists you need the author's intention is just smuggling in a biography. She added that the author might be dead, or lying, or have simply forgotten, so a meaning that depends on their mental state is a meaning nobody can actually get at. I said a statute is a terrible model, because its written by hundreds of people who never agree on anything, it gets applied to strangers by officials who can fine them, and it has to be predictable in advance — none of which is true of a poem — but I couldn't say why any of that matters before we both gave up and went to bed annoyed.

  I have to write this up for a reading group next week and I want it to be an actual audit rather than me just insisting she's wrong. So take the analogy at full strength and tell me how far it holds. Lay the correspondences out explicitly — legislator, statute, judge, precedent, the interpretive community, whoever else is doing real work — and say which slots have no counterpart on the literary side, and which literary slots the legal picture has no room for. Then the breakages, sorted into the ones that genuinely bear on her conclusion and the ones that are just noise. What I'm most curious about is whether the reason legislative intent gets treated as a fiction is something specific to law — collective authorship, the fact that somebody has to decide and somebody gets punished, the need for a text people can rely on in advance — and whether any of that transfers to a novel written by one person who isn't around to be asked. If the analogy can't carry the conclusion, say what would, and whether the anti-intention line is defensible on some other footing or whether it was only ever the statute picture holding it up.

  Don't bother with citations or a reading list, I'll chase those down myself — I just want the argument laid out so I can see where the load is actually being carried.
