prompt: |-
  A friend of mine who's deep into effective altruism sent me a blog post explaining the "fanaticism problem" for expected value theory, and I've been going back and fourth about whether to believe it. I don't have a background in decision theory — one ethics module in undergrad and that's it — so I'd rather get an expert read than try to argue with him myself.

  Can you take the role of someone who works on decision theory and the ethics of risk and audit the post for me? Here's the gist of what it says:

  'Expected value theory says that when you're deciding what to do you should always pick the option with the highest expected value: you multiply the value of each possible outcome by its probability and add them up. The fanaticism problem is that this rule turns you into a fanatic. If the payoff is big enough, you're required to take a gamble no matter how tiny the chance of winning it and no matter how bad the loss if you lose. Standard example: someone offers you a bet with a 99.99% chance that you lose everything you have and a 0.01% chance that you get to bring about a galaxy-spanning civilization of trillions of happy people lasting a billion years. The good outcome is so astronomically large that its expected value swamps the near-certain loss, so the theory says you're required to take the bet. And there's no stopping point: for any finite stake you can imagine a gamble with a small enough probability of a large enough payoff that the expected value comes out positive, so the theory commits you to betting everything on Pascal's wager. This is why the fanaticism objection is usually treated as a reductio of expected value maximization. No reasonable person would take these bets; the theory says you must; so the theory is false. Strip out the theology and it's just Pascal's wager over again. And the only reason it feels crazy is that our brains were never built for numbers that big — we're scope-insensitive — so the sense that something has gone wrong is a glitch, not evidence about the theory.'

  Before you write anything, brainstorm for yourself: what are the main things a careful expected-value theorist would want to say about a characterization like this? Then go through the post sentence by sentence (or claim by claim) and sort each claim into one of these: accurate; a simplification that's standard in popular writing but loses something important; misleading or just wrong; or a genuinely contested point that the post presents as settled. For anything you flag, say what the correction is, and where it matters, what the strongest thing a defender of expected value maximization could say back. I'm especially curious about a few things: is the "no stopping" step valid as stated? Does "the theory is false" follow from whatever is true in the post, or is the post getting more out of the objection than the objection actually gives? Is the fanaticism problem really the same thing as Pascal's wager, and is my friend right that it's closer to what people call Pascal's mugging? And is the psychology at the end doing any real work, or is it pulling in a direction the post doesn't want?

  Definately don't give me a reading list or citations, I'll chase those down myself — I just want to know which parts of the post I can trust and where my friend and I should be pushing back. Think it through carefully rather than giving me the standard summary. End with a table, one row per claim (claim | verdict | one-line reason), and then as the very last line a line starting "Verdict:" giving the overall label — one of fair, mostly fair, mixed, mostly unfair, unfair — plus one sentence on the post's biggest single error.
