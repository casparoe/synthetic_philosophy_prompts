      *   **Why it looked fine:** It appeals to scientific realism. We want our terms to "carve nature at the joints." It feels rigorous.
      *   **The Cost:** You have to adopt a more sophisticated theory of what "pleasure" is (Functionalism, Attitudinal Theory, or Family Resemblance). You lose the idea that pleasure is a simple "glow" or specific sensation.

