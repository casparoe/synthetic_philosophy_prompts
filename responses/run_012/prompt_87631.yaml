answer: |-
  You have excellent instincts. Your friend's argument is a classic in the field (often associated with Wittgensteinian critiques or Nietzschean skepticism), and your *reductio* regarding pain and desire is exactly how most contemporary philosophers of mind would push back.

  If that argument kills pleasure, it does indeed kill pain, desire, belief, and probably "emotion" too. Since we generally want to keep those categories as scientifically and philosophically usable, the argument must be flawed.

  Here is the breakdown of where to strike, why the argument seduced you, and the price of admission for saving hedonism.

  ### 1. The Step to Reject: Premise (1)

  You should reject **Premise (1)**: *"For a psychological kind to be a genuine kind... all its instances have to share some common feature."*

  Specifically, you need to reject the hidden assumption within (1) that the "common feature" must be a **phenomenal quality** (a specific "feel" or sensory texture).

  **Why it looked fine:**
  Premise (1) appeals to a robust view of **Natural Kind Essentialism**. In hard sciences (chemistry, physics), kinds *do* work this way. All instances of "water" share the molecular structure H₂O; all instances of "gold" share atomic number 79. If you can't find the "H₂O" of pleasure, it feels like you haven't found the real thing. Your friend's argument borrows the prestige of natural science to demand a level of uniformity that psychological kinds simply don't possess.

  **Why it fails:**
  Psychological kinds are typically **functional kinds**, not structural kinds.
  *   **Pain:** As you noted, a burning pain and a throbbing pain feel nothing alike. What makes them both "pain"? It's not a shared sensation; it's a shared **functional role**. They are states caused by damage, they demand attention, and they motivate avoidance.
  *   **Belief:** A belief that $2+2=4$ and a belief that "I am in love" have no shared phenomenological texture. They are united by their role in reasoning and action.

  If you accept **Functionalism**, Premise (1) is false. A psychological kind is genuine if its instances play the same *causal role* in the economy of the mind, even if their internal "feels" are heterogeneous.

  ### 2. How to Keep Premise (2) (The Heterogeneity)

  You said you want to keep Premise (2) because the phenomenological diversity seems undeniable. You can do this comfortably if you adopt an **Attitudinal Theory of Pleasure** (championed by philosophers like Fred Feldman or Chris Heathwood).

  On this view, pleasure is not a specific *sensation* (like a tingle or a glow). It is an **attitude** you take toward an experience.
  *   The beer tastes good → You are *pleased by* the taste.
  *   The headache lifts → You are *pleased by* the absence of pain.
  *   The crossword clicks → You are *pleased by* the solution.

  What unifies these isn't a sensory "common feature" (saving Premise 2), but a **pro-attitude** (a desire for the experience to continue). This satisfies the requirement for a "genuine kind" without needing a shared sensation. It unifies them functionally: Pleasure is the mental state of *being pleased that x is occurring*.

  ### 3. The Cost: What You Owe in Exchange

  Rejecting Premise (1) and adopting a functional/attitudinal view saves hedonism, but it changes the theory. You cannot be a **Sensory Hedonist** (like Bentham arguably was); you must be an **Attitudinal Hedonist**.

  Here is the bill you have to pay:

  **A. You lose the "Felicific Calculus" simplicity.**
  If pleasure were a single sensation (like a warm glow), we could theoretically measure it by intensity and duration. If pleasure is a heterogeneous functional kind, measuring "units of pleasure" becomes much harder. You can't just add up the "click" of the crossword to the "relief" of the headache as if they were inches on a ruler. Hedonism becomes less like arithmetic and more like a complex valuation of attitudes.

  **B. You must accept "False Pleasures."**
  If pleasure is an attitude (being pleased that something is happening), you can be pleased about things that aren't actually good for you, or even things that aren't happening. (e.g., A jealous husband is "pleased" by the thought that his wife is faithful, even if she isn't). Sensory hedonism avoids this (the feeling is real regardless of the object), but attitudinal hedonism has to grapple with the intentionality of pleasure.

  **C. You blur the line between Pleasure and Desire.**
  If pleasure is defined as "the experience of getting what you desire" or "the attitude of wanting an experience to continue," the distinction between *pleasure* and *desire satisfaction* becomes thin. Your friend might argue you've just turned hedonism into desire-satisfaction theory by the back door. You need to be prepared to defend the distinction (e.g., you can desire something without taking pleasure in it, and vice versa).

  ### 4. How to Pitch This to Your Group

  Next week, you can frame your objection like this:

  > "I think the argument relies on a category mistake in Premise (1). It treats 'pleasure' like a chemical substance (Water = H₂O) rather than a functional state (Pain = Damage Avoidance).
  >
  > If we accept Premise (1), we lose 'pain' and 'belief' too, which suggests the premise is too strong for psychology.
  >
  > I propose we keep the phenomenological diversity (Premise 2) but reject the idea that diversity precludes a genuine kind. We can define pleasure not by *what it feels like*, but by *what it does*: it is the mental signal that reinforces behavior, or the attitude of 'welcoming' an experience. This saves hedonism, but it commits us to Attitudinal Hedonism rather than Sensory Hedonism. We trade simplicity for accuracy."

  ### Summary
  *   **Reject:** Premise (1).
  *   **Why:** It imposes physicalist essentialism on functional psychological kinds.
  *   **Keep:** Premise (2) (Phenomenological heterogeneity is real).
  *   **Cost:** You must abandon the idea that pleasure is a single, measurable sensation. You must adopt a more complex, functional definition of pleasure (Attitudinal Hedonism).

  This allows you to keep hedonism as a viable ethical theory without denying the obvious fact that a cold beer and a headache relief feel nothing alike.
