      *   *Premise (2):* "The things we call pleasures share no common feature."
          *   *Critique:* The user accepts this phenomenologically. However, one could argue there *is* a common feature (e.g., they are all experiences we seek for their own sake, or they all involve a positive valence). But since the user wants to keep this, I should focus elsewhere.
