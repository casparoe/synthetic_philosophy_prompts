answer: |-
  We stand today on the edge of a hole that is meant to outlast memory. Ten thousand years is the number we have chosen. It is a span of time that swallows our history whole. There were no cities when the ice last retreated that have survived to this day. There are no languages spoken now that were spoken then. And yet, here we are, pouring concrete and sealing canisters, acting as if there is a continuity between us and the people who will walk this ground when our names are dust.

  I know who sits before me. In the front, I see the minds that calculated the corrosion rates, the seismic shifts, the flow of groundwater. You speak of discount rates and expected doses without flinching. You know that a dollar spent today is worth more than a dollar spent tomorrow, and you know that models degrade over centuries. Behind you sit the neighbors who agreed to host this site. You have heard those same words—discount, rate, value—applied to your own children's safety, and you have wondered if the math implies their lives count for less than ours. And in the back, the officials who need a soundbite that will not age poorly by noon tomorrow.

  We are gathered to dedicate a monument to caution. But to do so honestly, we must clear away the confusion that usually clouds this work. There are two distinctions we must make, not for the sake of philosophy, but for the sake of truth.

  The first is between discounting a future benefit and discounting a future person's claim on us. In economics, a discount rate is a tool for efficiency. It tells us how to allocate capital so that resources are not left idle. If we say a future benefit is worth less than a present one, we are making a claim about the productivity of investment. We are saying that a dollar invested today will grow, so we should spend less later. That is a claim about things. But when we apply that same logic to radiation safety, the slope becomes slippery. A rate applied to a benefit is a claim about how much a thing will be worth; a rate applied to a person is a claim about how much a person will count.

  We cannot allow the logic of capital to bleed into the logic of worth. If we decide that preventing a cancer case ten generations from now is worth less than preventing one today, simply because of the date, we are not talking about interest rates anymore. We are talking about moral status. The engineers here know that the physics of decay does not respect our discount rates. The isotope does not care about the present value of a life. If we are to seal this repository, we must admit that while we may discount the *cost* of future repairs based on uncertainty, we cannot discount the *value* of the future body that might be harmed. To do so is to say that time dilutes blood.

  The second distinction is between discounting because we are uncertain the future will arrive, and discounting merely because the future is distant. This is where the quarrel over long-horizon policy is most often muddled. Some argue we should care less about the distant future simply because it is far away. This is pure time preference, and it is hard to defend ethically. Why should distance in time matter more than distance in space? But there is a valid form of discounting based on survival. We do not know if there will be anyone here to need this protection. We do not know if our institutions will survive to maintain it. We do not know if our markers will still be readable.

  To discount based on this uncertainty is not to devalue the future person; it is to acknowledge the fragility of our own reach. We are not building for a certainty; we are building against a probability. The repository is not a gift we are sure they will receive; it is a hazard we are trying to ensure they do not encounter.

  I know the objections waiting in the wings. To the economists here: you will say that any positive rate is simply the shadow price of capital and has nothing to do with ethics. You are right that capital has a price. But this facility is not an investment vehicle. It is a containment vessel. When we speak of safety, we are not optimizing a portfolio; we are managing a harm we created. The shadow price of capital cannot determine the shadow price of a lung.

  To the skeptics in the audience: you will say that caring equally about everyone ten thousand years out is a counsel no one has ever followed, and that pretending otherwise is a lie told in a kindly voice. You are right. We do not love the future equally. We love our children more than strangers, and our neighbors more than those overseas. To claim we feel the same warmth for a stranger in the year twelve thousand as we do for ourselves is sentimental nonsense. But justice is not love. Justice does not require us to love the future; it requires us not to poison it. We are not here because we are benevolent ancestors. We are here because we are liable descendants. We made the waste. The obligation is not born of affection, but of causation.

  And to the pragmatist who asks why, if we truly care about distant generations, we are spending this money on a monument instead of on something that would help them—why not invest in knowledge, in health, in stability? Why bury wealth in rock? The answer is that this spending is not charity. It is restitution. We cannot give them a better world by giving them our cancer. We cannot compensate them for a poisoned aquifer with a textbook we wrote. There are some debts that cannot be paid forward; they must be paid down. This repository is not an investment in their prosperity; it is a payment on our negligence.

  So where does this leave us? It leaves us in a place less comfortable than the uplift usually demanded at dedications. We cannot promise that this facility will hold forever. Geology is patient, and entropy is inevitable. To promise absolute safety for ten thousand years is to lie to the people we claim to protect. It creates a false confidence that may lead to the very intrusion we seek to prevent.

  We must separate what we owe as a matter of justice from what we can honestly promise. We owe them the effort. We owe them the best science we have, the most durable markers we can carve, the most honest records we can keep. We owe them the admission that we are fallible. But we cannot owe them a guarantee. A promise of safety is a claim about the world; a promise of effort is a claim about ourselves. We can control the latter. We cannot control the former.

  This facility is not a bridge to the future. It is a wall against the past. It is an admission that we have taken something from the earth that we cannot give back, and so we must hide the remainder where it is least likely to be found. We are not building a legacy. We are building a quarantine.

  When you leave here today, do not carry the comfort of having solved this problem. We have not solved it. We have merely managed it for as long as our hands can reach. The people who come after us will judge us not by our intentions, but by what leaks. Let us hope that when they drill into this rock, if they ever do, they find only silence, and that our failure to speak to them across the millennia is the greatest success we can achieve. We owe them not our love, but our caution. We owe them not a perfect world, but a less poisoned one. And we owe them the truth that this structure is not a testament to our power, but a marker of our limits.
