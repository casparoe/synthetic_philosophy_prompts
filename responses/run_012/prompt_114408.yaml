      Also, on the "Anglo-Saxon" point: Weil acknowledges the British tradition of empiricism might make parties less theoretical, but she still condemns the *mechanism* of the party. I should clarify that she doesn't let them off the hook.

      *(Translation Note)*: The French word is *suppression*. *Abolition* is the standard English title. *Suppression* in French can mean "elimination" or "deletion." It's stronger than just "banning." It implies wiping out. I should note this briefly.

      *(Opposition)*: The summary says "no room for legitimate opposition." Weil would say opposition to *truth* is illegitimate. Opposition to *policy* based on conscience is necessary. The summary implies a monolithic block. Weil implies a collection of individuals. Big difference.

