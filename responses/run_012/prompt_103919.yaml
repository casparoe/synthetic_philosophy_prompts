          *   *Hilbert:* Meta-mathematical Foundationalism. Finitary consistency is the stopper. *Failure:* Gödel shows the consistency proof requires stronger tools than the system itself (shifts the regress up).
          *   *Principia:* Foundationalism with a patch (Axiom of Reducibility). *Failure:* The patch lacks self-evidence.
