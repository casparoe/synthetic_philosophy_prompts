      *   *Brouwer/Intuitionism:* Math is mental construction. Truth is warranted by constructive proof. The "self-evident" intuition of the natural numbers is the foundation. (Foundationalist, but psychological/phenomenological).
      *   *Hilbert/Formalism:* Math is symbol manipulation. Consistency must be proved using "finitary" methods. The meta-mathematics is the foundation. (Foundationalist regarding security, but treats math as a game).
      *   *Russell/Whitehead (Principia):* Type theory to block paradoxes. Axiom of Reducibility. (Foundationalist, but ad hoc).
