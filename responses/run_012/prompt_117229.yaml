      *Wait, one more thing:* The user mentioned "nobody asks the twelve-year-old to cast a vote." This is crucial. In strict liberalism, the child's autonomy is growing. In FGC, the child's interest is mediated by the family. This is the friction point. I need to address *representation* vs. *participation*.

      *Okay, let's structure the argument:*
      1.  **The Liberal Instrumentalist View:** Family as data source/resource.
      2.  **The Relational/Communitarian View:** Family as constitutive of self.
      3.  **The "Rotten Roles" Critique:** Why pure Role Ethics fails safeguarding.
      4.  **The Actual Model:** "Liberalism with a Communitarian Engine."
      5.  **The Counterfactual:** What happens if you remove the engine.

