answer: |-
  This is a fantastic argument to be having, and your intuition is spot-on: your roommate has constructed a logically valid chain, but it rests on a misreading of Pascal's metaphysics. She is reading him as a proto-Hobbesian legal positivist (might makes right), whereas Pascal is a Christian skeptic and a Jansenist (might makes *order*, but only God makes *right*).

  To break the tie: **You need to cut Step (1), but not for the reason your roommate thinks.**

  Here is how you dismantle the chain without losing Pascal's authority, his normativity, or your own moral compass.

  ### 1. The Cut: Step (1) conflates two registers of "Justice"
  Your roommate's Step (1) says: *"What makes a law or a custom just is that it is established and backed by force — there's no further standard of justice sitting behind it that it has to answer to."*

  This is where the error lies. Pascal *does* believe there is a further standard of justice sitting behind human law: **God.**

  Pascal's anthropology is built on the Fall. He believes human reason is corrupted. We are incapable of agreeing on what "Natural Justice" is. If you ask ten philosophers to define justice, you get eleven definitions. Because we cannot agree on *True Justice*, we would kill each other trying to enforce our own versions of it.

  So, when Pascal says, "We have made force just," he is not making an ontological claim (that force *transforms* into justice). He is making a **political and epistemological claim**: In the human realm, force is the only *visible marker* we have agreed to accept as the proxy for justice to prevent civil war.

  **The Correction:**
  *   **Roommate's (1):** Force *constitutes* justice. (There is no higher standard).
  *   **Pascal's (1*):** Force *signifies* justice in the civil realm, because we are too fallen to perceive the higher standard reliably.

  By cutting the original (1) and replacing it with (1*), you stop the slide into nihilism. Pascal gets to keep the idea that laws derive authority from establishment, but he doesn't have to admit that a tyrant's cruelty is *morally* good, only that it is *legally* binding until it is overthrown.

  ### 2. What does this cost Pascal? (And what does it save?)
  You asked: *"If (1) really is the thing to drop, what was it doing for him in the first place?"*

  This is the most important part. If you just say "Pascal believes in Divine Justice," you might think you've solved it, but you miss why Pascal is so insistent on force.

  **The Function of (1) for Pascal:**
  It serves as a **humility check on human reason.**
  Pascal uses the "force makes justice" argument to crush human pride. He wants to show us that our political arrangements are not divine revelations. They are contingent customs. The reason we obey the laws of France and not Spain isn't because French laws are holier; it's because the Pyrenees are in the way.

  **The Cost:**
  If you cut (1) as your roommate interprets it, Pascal loses the ability to say "Rebellion is always wrong."
  **The Gain:**
  Pascal gains the ability to say "Tyranny is real."
  By distinguishing between *Civil Justice* (establishment) and *Divine Justice* (charity/truth), Pascal can say:
  1.  **To the Citizen:** You must obey the tyrant's law because it is established, and rebellion causes chaos (which is a greater sin).
  2.  **To the Conscience:** You must recognize the tyrant's law is *not* truly just in the eyes of God, and you should not worship it.

  This preserves your intuition that Pascal is normative. He *is* telling us we should obey. But the *reason* we obey is not because the law is perfect; it is because **peace is a higher proximate good than personal moral correctness.**

  ### 3. Solving the King vs. Tyrant Problem (Steps 3 & 4)
  Your roommate argues: *"So a tyrant's decree, once it's established and enforced, is just. Which means the difference between a just king and a tyrant is just how much force each can muster."*

  This is the *reductio ad absurdum* that proves her reading is wrong. Pascal actually has a way to distinguish the King from the Tyrant without relying on "True Justice." He distinguishes them by **Legitimacy of Origin**, not **Moral Content.**

  For Pascal (and most early moderns), a King rules by **Custom** (long-standing establishment). A Tyrant rules by **Usurpation** (force without custom).
  *   **The King:** Even if his laws are imperfect, they flow from the "body politic" established over time. Obeying him maintains the fabric of society.
  *   **The Tyrant:** He imposes his will against the custom.

  Pascal would say the Tyrant's decree is *legally* valid (you will go to jail if you break it), but it lacks the *authority* of custom. However—and here is the kicker—Pascal would likely still advise obeying the tyrant *if* he has successfully established control, because resisting him leads to bloodshed.

  So, the difference between King and Tyrant isn't "Justice" in the moral sense; it's **Order vs. Chaos.**
  *   **King:** Order via Custom.
  *   **Tyrant:** Order via Fear (which is unstable).
  *   **Rebel:** Chaos.

  Pascal prefers the King, tolerates the Tyrant to avoid Civil War, and condemns the Rebel. This allows him to say a Tyrant's law is "unjust" (in that it violates custom/charity) but still "binding" (in that it is enforced).

  ### 4. Addressing the "Descriptive vs. Normative" Worry
  You said: *"I don't want to just shrug and say 'he's being descriptive, not normative'... I think he really does want to say we *should* obey."*

  You are absolutely right to reject the simple shrug. Pascal is deeply normative. But his normativity is **prudential**, not **moralist**.

  *   **Roommate's view:** We obey because the law *is* Good.
  *   **Your view (corrected):** We obey because disobedience is *Dangerous* and *Prideful*.

  Pascal argues that insisting on our own definition of "True Justice" against the established order is a form of the sin of Pride. It places our individual reason above the collective peace. So, we obey established laws *as if* they were just, not because they *are* just, but because insisting otherwise is a greater evil.

  This validates Step (6) in your roommate's chain ("So (1) has to be wrong") but for a different reason. (1) is wrong not because justice *must* be independent of force, but because **justice is too big for humans to hold, so we use force as a placeholder.**

  ### The Verdict for the Tie-Break
  Tell your roommate this:

  1.  **She wins on Logic, loses on Text.** Her chain is logically valid *if* Pascal is a moral nihilist. But the *Pensées* are explicitly Christian. He believes in a God who is True Justice. Therefore, Step (1) is a misrepresentation of his full view. He believes force makes law *authoritative*, not *holy*.
  2.  **You win on Interpretation.** You are right that Pascal wants us to obey. But we obey out of **charity for our neighbors** (to keep the peace), not because the tyrant's decree is morally good.
  3.  **The "Unjust Law" Contradiction.** Step (5) says calling a cruel decree "just" drains the word. Pascal agrees! That's his whole point. He is mocking human courts. He says, in effect: *"Yes, in human courts, 'unjust law' is a contradiction. In God's court, almost all human laws are unjust."*

  **The Final Cut:**
  Cut **Step (2)**.
  *"If there's no standard of justice independent of establishment and force, then any established, enforced law is just."*

  **Replace with:**
  *"If there's no standard of justice independent of establishment that humans can reliably enforce, then any established law must be **treated as** just for the sake of peace, even if it is not **inherently** just."*

  This allows Pascal to keep his brilliant insight (that power underwrites law) without forcing you to accept that a tyrant is morally equivalent to a saint. It costs him the ability to justify revolution, but it saves him from justifying tyranny. And knowing Pascal, he'd take that trade every time.
