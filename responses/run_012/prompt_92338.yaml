      *   *Is Step (5) valid?* Yes, intuitively. But Pascal might bite the bullet and say, "Yes, in human courts, the tyrant's law is 'just' until he falls." But in God's court, it's not. The roommate conflates the two courts.
      *   *Key Pascal Quote:* "Justice is what is established; and thus all our established laws will necessarily be regarded as just without being examined, since they are established." (Lafuma 94 / Sellier 135). This supports the roommate *superficially*. But the context is skepticism about human reason's ability to find natural law.
