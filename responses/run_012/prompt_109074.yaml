  8.  *(Drafting the Post-Mortem)*: The user argued "presupposes we already share a prior." This is technically correct regarding the theorem. The friend argued "if both rational... cannot sincerely remain in disagreement." This is the conclusion of the theorem *given* the assumption. The verbal dispute was likely over the definition of "Rational." Friend = Rational includes having the "True" Prior. User = Rational includes Coherent Updating from *any* Prior.

