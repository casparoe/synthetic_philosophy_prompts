  ### 1. The Conceptual Tension: Consistency vs. Leverage

  The debate between the Nash Bargaining Solution (NBS) and the Kalai–Smorodinsky Solution (KSS) is not merely a technical disagreement over formulas; it is a conflict between two distinct philosophies of how bargaining power is generated and how rational agents should respond to changes in their environment.

  **Independence of Irrelevant Alternatives (IIA)**
  *   **The Demand:** If a solution selects outcome $x$ from a feasible set $S$, and you remove options from $S$ to create a subset $S'$ (where $x$ is still feasible), the solution must still select $x$.
  *   **Substantive Commitment:** This axiom encodes a view of **rational consistency**. It treats the feasible set as a menu. If you chose the steak from the full menu, and the kitchen runs out of fish (an option you didn't choose), you shouldn't suddenly switch to the chicken. The choice should depend only on the local properties of the solution point, not the global shape of the set.
  *   **Why it feels compelling:** It prevents manipulation through "phantom threats." A player shouldn't be able to change the outcome by adding useless options that no one would ever agree to.
  *   **Why it feels question-begging:** It ignores *why* options are available. In bargaining, the feasible set often reflects underlying threat points or production capabilities. Removing options might signal a change in the other player's willingness to cooperate or their outside options, even if the final agreement point remains technically feasible. IIA assumes bargaining power is static and localized, ignoring how the *scope* of potential agreement defines leverage.

  **Individual Monotonicity (IM)**
  *   **The Demand:** If the feasible set expands from $S$ to $S'$ such that Player 2's maximum possible utility increases (while Player 1's maximum stays constant), Player 2 should not receive less in the solution.
  *   **Substantive Commitment:** This axiom encodes a view of **leverage as potential**. Your bargaining power is tied to your "utopia point"—the best you could possibly hope for. If your ceiling rises, your claim on the surplus should strengthen, or at least not weaken.
  *   **The Underlying Picture:** IM views the bargaining problem as a division of *gains relative to the maximum possible*, not just gains relative to the disagreement point. It implies that an expansion of opportunities for one player is a source of strength for that player. To deny them a larger share when their potential has grown is to punish them for having better opportunities.

  **The Tension:**
  IIA says: "Ignore the changes to the set that don't remove the current solution."
  IM says: "The changes to the set (specifically the ideal points) *define* the solution."
  Nash prioritizes local consistency (IIA); Kalai–Smorodinsky prioritizes comparative opportunity (IM).

  ---

  ### 2. Numerical Examples and Geometry

  To make this checkable, we define the disagreement point at $d = (0,0)$ for both examples.

  #### Example A: Nash Violates Individual Monotonicity
  We construct a case where Player 2's opportunities improve ($a_2$ increases), but the Nash solution gives Player 2 a lower utility.

  *   **Setup:**
      *   **Set $S$:** The standard simplex defined by vertices $(0,0), (1,0), (0,1)$. The Pareto frontier is the line $u_1 + u_2 = 1$.
      *   **Nash on $S$:** Maximizes $u_1 u_2$ subject to $u_1 + u_2 = 1$. The solution is **$(0.5, 0.5)$**.
      *   **Ideal Points:** $a_1(S) = 1, a_2(S) = 1$.

  *   **Set $S'$ (The Expansion):**
      *   We expand $S$ to $S'$ such that $S \subset S'$, $a_1$ remains 1, but $a_2$ increases to 2.
      *   However, we shape the new frontier to be highly favorable to Player 1 in the middle region.
      *   **Vertices of $S'$:** $(0,0), (1,0), (0.8, 0.4), (0, 2)$.
      *   **Convexity Check:**
          *   Segment 1 ($(1,0)$ to $(0.8, 0.4)$): Slope $\frac{0.4 - 0}{0.8 - 1} = -2$.
          *   Segment 2 ($(0.8, 0.4)$ to $(0, 2)$): Slope $\frac{2 - 0.4}{0 - 0.8} = -2$.
          *   *Correction for Violation:* A single line from $(1,0)$ to $(0,2)$ yields Nash $(0.5, 1)$, which satisfies IM. To violate IM, we need **curvature**.
      *   **Revised $S'$ (Curved Frontier):** Let the frontier be defined by $u_2 = 2 - 2u_1^3$ for $u_1 \in [0,1]$.
          *   **Containment:** For $u_1 \in [0,1]$, is $2 - 2u_1^3 \ge 1 - u_1$? At $u_1=0.5$, $1.75 \ge 0.5$. Yes, $S \subset S'$.
          *   **Ideal Points:** $a_1 = 1$ (at $u_2=0$), $a_2 = 2$ (at $u_1=0$). Player 2's opportunity improved.
          *   **Nash on $S'$:** Maximize $P = u_1(2 - 2u_1^3) = 2u_1 - 2u_1^4$.
          *   First Order Condition: $2 - 8u_1^3 = 0 \implies u_1^3 = 0.25 \implies u_1 \approx 0.63$.
          *   Player 2's Utility: $u_2 = 2 - 2(0.25) = 1.5$.
          *   *Note:* In this specific function, $u_2$ still increased. To generate a strict violation where $u_2$ *decreases*, the frontier must bow out significantly for Player 1 while barely lifting Player 2's utility in the relevant tangency region.
          *   **Geometric Logic of Violation:** Imagine $S'$ expands Player 2's max to 10 (a tall spike at $u_1=0$), but the frontier immediately drops to a flat line $u_2 = 0.4$ for $u_1 > 0.1$. The Nash product maximization will occur on the flat line (where $u_1$ is large), yielding a point like $(0.8, 0.4)$. Here, $u_2$ dropped from $0.5$ to $0.4$, despite $a_2$ rising from $1$ to $10$.

  #### Example B: Kalai–Smorodinsky Violates IIA
  This example is arithmetically robust. KSS selects the point on the Pareto frontier that lies on the line connecting the disagreement point to the ideal point $(a_1, a_2)$.

  *   **Setup:**
      *   **Set $S$:** Triangle with vertices $(0,0), (1,0), (0,1)$. Frontier $u_1 + u_2 = 1$.
      *   **Ideal Points:** $a_1 = 1, a_2 = 1$.
      *   **KSS on $S$:** Line from $(0,0)$ to $(1,1)$ is $u_2 = u_1$. Intersection with frontier: **$(0.5, 0.5)$**.

  *   **Set $S'$ (The Subset):**
      *   We remove options from $S$ to create $S'$, but we ensure the original solution $(0.5, 0.5)$ remains feasible.
      *   **Vertices of $S'$:** $(0,0), (0.8, 0), (0.5, 0.5), (0, 1)$.
      *   **Feasibility:** $(0.5, 0.5)$ is a vertex of $S'$, so it is feasible.
      *   **Ideal Points of $S'$:**
          *   Max $u_1$: The vertex $(0.8, 0)$ sets **$a_1(S') = 0.8$**.
          *   Max $u_2$: The vertex $(0, 1)$ sets **$a_2(S') = 1$**.
      *   **KSS on $S'$:**
          *   Draw a ray from $(0,0)$ through the new ideal point $(0.8, 1)$.
          *   Slope of ray: $1 / 0.8 = 1.25$. Equation: $u_2 = 1.25 u_1$.
          *   Find intersection with the Pareto frontier of $S'$. The relevant segment connects $(0.8, 0)$ and $(0.5, 0.5)$.
          *   Line equation for segment: Slope $\frac{0.5 - 0}{0.5 - 0.8} = \frac{0.5}{-0.3} \approx -1.67$.
          *   Equation: $u_2 - 0 = -1.67(u_1 - 0.8) \implies u_2 = -1.67u_1 + 1.33$.
          *   Intersection: $1.25 u_1 = -1.67 u_1 + 1.33 \implies 2.92 u_1 = 1.33 \implies u_1 \approx 0.45$.
          *   New Solution: **$(0.45, 0.56)$**.
      *   **Violation:** The original solution $(0.5, 0.5)$ was feasible in $S'$, but KSS moved to $(0.45, 0.56)$. KSS changed its mind because the *ideal point* changed, violating IIA.

  ---

  ### 3. Deep Compatibility: Can We Have Both?

  **The Verdict:** Given Weak Pareto Optimality, Symmetry, and Invariance to Positive Affine Transformations, **IIA and Individual Monotonicity are genuinely incompatible.**

  This is not an artifact of Nash or Kalai–Smorodinsky specifically; it is a structural impossibility theorem (often associated with the work of Lensberg or Kalai). You cannot have a solution that is both locally consistent (IIA) and responsive to global opportunity shifts (IM) while maintaining scale invariance and symmetry.

  **Surrendering an Axiom:**
  To satisfy both IIA and IM, you must surrender **Invariance to Positive Affine Transformations**.

  *   **Why:** Invariance requires the solution to depend only on the *ordinal* preferences and the *relative* scaling of utilities. IM, however, requires comparing the *magnitude* of gains relative to a maximum. This implies a need for interpersonal comparability of utility units.
  *   **The Resulting Solution:** The **Egalitarian Solution**.
      *   **Definition:** Select the feasible point that maximizes the minimum utility gain ($ \max \min(u_1, u_2) $). Geometrically, this is the intersection of the Pareto frontier with the 45-degree line (assuming symmetric scaling).
      *   **Satisfies IM:** If Player 2's maximum increases, the feasible set expands upward. The intersection with the 45-degree line moves up (or stays same), so Player 2 never loses.
      *   **Satisfies IIA:** If the chosen point $x$ is in a subset $S'$, it remains the point that maximizes the minimum utility in $S'$ (provided the diagonal hasn't been cut off below $x$).
      *   **Cost:** It requires utility to be cardinally measurable and interpersonally comparable. You cannot rescale Player 1's utility without changing the outcome.

  ---

  ### 4. Self-Critical Note

