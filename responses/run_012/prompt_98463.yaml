answer: |-
  Here is the diagnosis of the argument.

  ### The Verdict

  Your friend's argument is logically valid, but it is unsound. It succeeds in showing that a crude version of the "man-of-his-time" defence leads to absurdity, but it fails because it relies on a hidden equivocation in the concept of **blame** and an overly narrow definition of **epistemic standards** in Premise 2.

  To preserve the nuance you seek—acknowledging epistemic limits without absolving historical figures of moral appraisal—you should reject **Premise 2**, while simultaneously clarifying the distinction between **culpability** (blame) and **moral correctness** (criticism).

  ### The Diagnosis

  The argument breaks at **Premise 2**: *"Whether a person could reasonably have known that an action was wrong is fixed by the epistemic standards of their time and place."*

  This premise looks plausible because it appeals to fairness. It seems unjust to punish someone for failing to access moral knowledge that was genuinely unavailable to them. If you were born in a society where slavery was universally regarded as natural law, and no philosophical tools existed to critique it, it seems harsh to call you evil for owning slaves. This intuition is the kernel of truth in the "man-of-his-time" defence.

  However, Premise 2 smuggles in a controversial assumption: it equates "epistemic standards of the time" with "dominant social consensus." It assumes that if the majority of your peers permitted an action, you could not *reasonably* have known better. This collapses moral truth into cultural opinion.

  **Why Premise 2 is the weak point:**
  Moral knowledge is not solely determined by local consensus. There is a difference between what was *popularly believed* and what was *rationally accessible*. A moral agent has a duty to exercise moral reasoning, not just conform to norms. If the suffering caused by an action was visible, and if the justification for that action relied on contradictions that were logically resolvable at the time, then the knowledge was accessible, even if unpopular.

  By rejecting Premise 2, you can argue that "reasonable knowledge" is fixed not by what the crowd thought, but by what a conscientious person, exercising due moral care, could have ascertained. This allows you to say that Jefferson *could* have known better, not because he was a modern liberal, but because the contradictions of liberty and slavery were already being pointed out by contemporaries (including enslaved people themselves).

  ### The Equivocation: Blame vs. Criticism

  There is a second, structural flaw in how the argument concludes. Your friend moves from "not morally blameworthy" (Step 5) to "excuses everyone" (Step 7/Conclusion). This equivates between **subjective culpability** and **objective wrongness**.

  *   **Culpability (Blame):** This concerns the agent's internal state. Did they know better? Did they choose evil for its own sake? The "man-of-his-time" defence addresses this. It suggests we should not vilify the *character* of the historical figure as if they were a modern monster.
  *   **Moral Appraisal (Criticism):** This concerns the act and its consequences. Was the act unjust? Did it cause suffering?

  The argument assumes that if we remove *blame*, we must remove *appraisal*. This is false. We can judge an action as morally catastrophic without judging the agent as uniquely culpable. We can say, "Slavery was an abomination, and Jefferson participated in it," without necessarily saying, "Jefferson was as guilty as a slaveholder who knew it was wrong and did it anyway."

  Your friend's conclusion that the defence places the actor "beyond all moral appraisal" is the error. The defence only places them beyond *retrospective vilification*, not beyond *moral judgment*.

  ### The Empirical Challenge (Premise 3)

  While Premise 2 is the philosophical breaking point, **Premise 3** is often the factual breaking point for the specific figures you mentioned.

  Premise 3 claims: *"For any historical figure accused of a wrong, the epistemic standards of their time and place did not clearly identify that action as wrong."*

  For Jefferson, Churchill, and Columbus, this is historically dubious.
  *   **Jefferson:** There were abolitionist voices and manumission societies in his lifetime. The contradiction between the Declaration of Independence and chattel slavery was noted by critics in his own time.
  *   **Churchill:** Views on colonialism were contested during his career; the Amritsar Massacre, for example, had contemporary critics within Britain.
  *   **Columbus:** Even in the 15th century, there were theological debates regarding the rights of indigenous peoples (e.g., Las Casas, though slightly later, built on existing dissent).

  If dissent existed, the "standards of the time" were not monolithic. Therefore, the figure cannot claim they *couldn't* have known; they can only claim they *chose* the dominant view over the dissenting one. This shifts the argument from "inevitable ignorance" to "moral prioritization," which is absolutely subject to criticism.

  ### Pricing the Alternatives

  Here is the cost analysis of rejecting the different premises, to help you decide where to stand.

  **1. Rejecting Premise 1 (Blame requires knowledge)**
  *   *Cost:* Extremely High.
  *   *Consequence:* This leads to strict liability. You would be blaming people for unavoidable ignorance. It makes morality a matter of luck rather than agency. If you reject this, you lose the ability to distinguish between a mistake and a crime. Do not reject this.

  **2. Rejecting Premise 2 (Standards fixed by time/place)**
  *   *Cost:* Moderate.
  *   *Consequence:* You must accept that moral truths are accessible across time. You have to argue that a person in 1776 *could* have reasoned their way to 2024's moral consensus using the tools they had.
  *   *Benefit:* This preserves moral realism. It allows you to say, "Slavery was wrong then, and they should have known it," without denying that their context made it difficult. It keeps the door open for moral criticism while acknowledging the difficulty.

  **3. Rejecting Premise 3 (No one knew it was wrong)**
  *   *Cost:* Low (for modern history), High (for ancient history).
  *   *Consequence:* You must do historical homework. For Jefferson, this is easy (dissenters existed). For a Roman slaveholder, this is harder (dissent was rarer).
  *   *Benefit:* It avoids abstract philosophy and focuses on evidence. It shows that the "man-of-his-time" defence is often a historical laziness, assuming monolithic cultures where none existed.

  **4. Rejecting the Equivocation (Blame vs. Appraisal)**
  *   *Cost:* Low.
  *   *Consequence:* You must be precise in your language. You must distinguish between condemning the *act* and condemning the *soul*.
  *   *Benefit:* This is the most productive path. It allows you to say: "I understand why he thought that (context), and I do not think he was a demon (blame), but what he did was evil (appraisal), and we must not emulate it."

  ### Legitimate vs. Illegitimate Use of the Defence

  To resolve your dispute, propose this distinction to your friend. The "man-of-his-time" defence is legitimate only when used as a **mitigating factor in character assessment**, not as a **justification for the act**.

  **What the defence CAN do (Legitimate):**
  *   **Explain:** It helps us understand the psychological and social mechanisms that led to the action.
  *   **Mitigate:** It suggests we should not hate the historical figure with the same intensity we would hate a contemporary committing the same act. It tempers our *reactive attitudes*.
  *   **Contextualise:** It prevents us from viewing history as a simple battle between "good people like us" and "bad people like them."

  **What the defence CANNOT do (Illegitimate):**
  *   **Justify:** It cannot make the action right. Slavery was wrong in 1800, even if it was legal.
  *   **Silence:** It cannot be used to shut down discussion of the harm caused. The victim's suffering is not mitigated by the perpetrator's ignorance.
  *   **Immunize:** It cannot place the figure beyond moral appraisal. We are entitled to judge their choices, even if we acknowledge the constraints they were under.

  ### Summary for Your Friend

  You can tell your friend that their *reductio* works only against a **strong** version of the defence (which claims historical figures are beyond criticism). It does not defeat a **moderate** version.

  The moderate version rejects Premise 2. It argues that "reasonable knowledge" is not defined by majority consensus, but by moral accessibility. It also rejects the conclusion that "not blameworthy" means "beyond appraisal."

  The cost of this position is that we must accept a difficult tension: We must judge historical figures by a standard that transcends their time, while acknowledging that their ability to meet that standard was constrained by their time. This is not a logical contradiction; it is the essential tension of doing history ethically. We judge them because we must learn from them, but we judge them charitably because we recognize that we, too, are blind to some of our own era's evils.
