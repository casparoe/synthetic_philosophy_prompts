  3.  **Brainstorming Weak Points:**

      *   *Premise 1 (Blame requires knowledge):* This is a standard principle of moral responsibility (*ought implies can*, specifically *ought implies know*). Rejecting this leads to strict liability, which seems unfair. *Cost:* High. We generally don't blame people for unavoidable ignorance.
      *   *Premise 2 (Epistemic standards fixed by time/place):* This is the crux. Does "reasonable knowledge" depend *solely* on the dominant consensus? Or does it depend on what was *available*? What about dissenters? What about universal moral truths accessible to reason? *Cost:* Moderate. Rejecting this allows us to say some things were knowable even if unpopular.
