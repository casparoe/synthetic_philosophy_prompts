      *   *Node B: The Aggregation Problem.* How do we sum utilities across time/population? (Infinite utility, discounting).
      *   *Node C: The Comparative Baseline.* Are we comparing acts to a null baseline or to each other? Does cluelessness cancel out?
      *   *Node D: The Normative Significance.* Does cluelessness actually stop action-guidance, or does it just shift the locus of justification?

  4.  **Evaluate "Upstream-ness" (Dependency):**
      *   If we don't know *what kind* of uncertainty we face (Node A), we can't choose a decision rule.
      *   If we don't know if values aggregate (Node B), expected value calculations are meaningless regardless of probability.
