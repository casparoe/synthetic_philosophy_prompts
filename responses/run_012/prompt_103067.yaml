  6.  **Develop the Ranking (The Agenda):**

      *   *Priority 1: The Formalization of Cluelessness (Imprecise Probabilities & Decision Rules).*
          *   Why: It determines whether the problem is solvable mathematically. If standard EV maximization fails, what replaces it?
          *   Upstream because: You can't solve aggregation or symmetry without a decision rule.
