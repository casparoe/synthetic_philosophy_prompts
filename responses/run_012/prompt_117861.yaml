answer: |-
  **Examination Question**

  **Question 1 (25 Marks)**

  An observational cohort study compares two triage protocols, A and B, for a specific medical condition. There are 1,000 patients in each arm. The outcome is survival to discharge. Two further variables are recorded: *Severity*, assessed at triage before the protocol is assigned; and *ICU transfer*, recorded after the protocol has been in use for 24 hours. Protocol assignment was at the clinician's discretion. The data are as follows:

  **Protocol A:** Overall survival 270/1,000 (27%).
  *   By Severity: Mild 90/100 (90%); Severe 180/900 (20%).
  *   By ICU Transfer: Transferred 160/800 (20%); Not Transferred 110/200 (55%).

  **Protocol B:** Overall survival 730/1,000 (73%).
  *   By Severity: Mild 720/900 (80%); Severe 10/100 (10%).
  *   By ICU Transfer: Transferred 120/200 (60%); Not Transferred 610/800 (76.25%).

  The same 2,000 patients generate all these summaries. The crude data suggest Protocol B is superior, yet within severity strata, Protocol A appears superior. Within ICU strata, Protocol B appears superior.

  Write an essay addressing the following integrated tasks. First, draw a Directed Acyclic Graph (DAG) consistent with the temporal information provided (Severity $\rightarrow$ Protocol $\rightarrow$ ICU $\rightarrow$ Survival) and label the causal roles of *Severity* and *ICU transfer*. Second, state which of the three comparisons (crude, severity-stratified, or ICU-stratified) identifies the total causal effect of the protocol on survival under your graph, justifying why the others fail. Third, compute a directly standardised survival proportion for each protocol using the combined severity distribution of the total cohort as the standard population. Fourth, state what a policymaker should conclude about which protocol saves more lives. Finally, explain what would change in your analysis if *Severity* were instead measured after treatment assignment, or if *ICU transfer* were a pre-treatment variable. Your answer must demonstrate that the data alone do not determine the answer; the causal assumptions do.

  ***

  **Model Answer**

  The resolution of this paradox relies entirely on the causal structure implied by the temporal ordering of variables, not the statistical associations alone. The data exhibit Simpson's Paradox: the crude association favors Protocol B, while the severity-stratified association favors Protocol A. To decide which comparison is valid, we must map the data-generating process using a Directed Acyclic Graph (DAG).

  Based on the temporal information, *Severity* is measured at triage, before protocol assignment. *Protocol* assignment follows, influenced by clinician discretion based on severity. *ICU transfer* occurs after 24 hours of protocol use. *Survival* is the final outcome. Thus, the causal flow is: Severity $\rightarrow$ Protocol $\rightarrow$ ICU $\rightarrow$ Survival. Additionally, Severity directly influences Survival (sicker patients die more) and ICU transfer (sicker patients are more likely to be transferred). Protocol also directly influences Survival.

  In this DAG, *Severity* is a confounder. It is a common cause of both the treatment (Protocol) and the outcome (Survival). Clinicians assign protocols based on severity, and severity determines survival risk. Failure to adjust for *Severity* leaves an open backdoor path (Protocol $\leftarrow$ Severity $\rightarrow$ Survival), biasing the crude comparison. In this dataset, Protocol A was assigned to mostly severe patients (900/1000), while Protocol B was assigned to mostly mild patients (900/1000). This imbalance drives the crude result favoring B.

  *ICU transfer* is a mediator. It lies on the causal pathway from Protocol to Survival (Protocol $\rightarrow$ ICU $\rightarrow$ Survival). It is also a collider between Severity and Protocol (Severity $\rightarrow$ ICU $\leftarrow$ Protocol). Adjusting for a mediator blocks part of the causal effect we wish to measure (the total effect). Furthermore, conditioning on a collider opens a biasing path between its parents (Protocol $\leftarrow$ Severity $\rightarrow$ Survival). Therefore, the ICU-stratified comparison is invalid for estimating the total causal effect; it estimates a direct effect while introducing collider bias.

  Consequently, the severity-stratified comparison identifies the total causal effect. To summarize this into a single metric comparable to the crude rate, we calculate the directly standardised survival proportion using the combined severity distribution as the standard. The total cohort has 1,000 mild patients (100 A + 900 B) and 1,000 severe patients (900 A + 100 B). The standard weights are 0.5 for Mild and 0.5 for Severe.

  For Protocol A: $(0.5 \times 0.90) + (0.5 \times 0.20) = 0.45 + 0.10 = 0.55$ (55%).
  For Protocol B: $(0.5 \times 0.80) + (0.5 \times 0.10) = 0.40 + 0.05 = 0.45$ (45%).

  The standardised results show Protocol A yields a 55% survival rate compared to B's 45%. The policymaker should conclude that Protocol A saves more lives. The crude data were misleading because Protocol A was unfairly tested on a sicker population.

  This conclusion hinges on the causal assumptions. If *Severity* were measured after treatment assignment, it could be affected by the protocol, making it a mediator rather than a confounder. Adjusting for it would then block part of the treatment effect, biasing the estimate downward. If *ICU transfer* were a pre-treatment variable, it would act as a confounder (causing both protocol selection and survival). In that scenario, we would need to adjust for ICU transfer to block the backdoor path, and the ICU-stratified analysis might become valid. Thus, the statistical adjustment strategy is dictated by the temporal and causal assumptions, not the numerical patterns in the table.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Correct DAG and Variable Roles (5 marks)**
  *   **Requirement:** DAG must show Severity $\rightarrow$ Protocol, Severity $\rightarrow$ Survival, Protocol $\rightarrow$ ICU, ICU $\rightarrow$ Survival, Protocol $\rightarrow$ Survival. Severity identified as Confounder; ICU identified as Mediator.
  *   **Typical Mistake:** Drawing ICU as a confounder or failing to arrow Severity to Protocol.

  **2. Distinction Between Confounder and Mediator (5 marks)**
  *   **Requirement:** Explicit explanation that confounders (Severity) must be adjusted to block backdoor paths, while mediators (ICU) must not be adjusted when estimating total effects.
  *   **Typical Mistake:** Claiming one should always adjust for all available pre-outcome variables.

  **3. Identification of Correct Comparison (5 marks)**
  *   **Requirement:** Clearly states that the severity-stratified (or standardised) comparison identifies the total causal effect, rejecting crude (confounded) and ICU-stratified (mediator/collider bias).
  *   **Typical Mistake:** Selecting the ICU-stratified comparison because it agrees with the crude data.

  **4. Standardised Calculation (5 marks)**
  *   **Requirement:** Correct weights (0.5/0.5) and arithmetic resulting in 55% for A and 45% for B.
  *   **Typical Mistake:** Using the wrong standard population (e.g., weighting by protocol arm size) or arithmetic errors.

  **5. Policy Conclusion and Counterfactuals (5 marks)**
  *   **Requirement:** Concludes Protocol A is superior. Explains that if Severity were post-treatment it becomes a mediator (do not adjust), and if ICU were pre-treatment it becomes a confounder (adjust).
  *   **Typical Mistake:** Recommending Protocol B based on crude data or failing to address the counterfactual temporal changes.

  **Class Distinction**
  *   **First-Class (20-25 marks):** Seamlessly integrates the philosophical point that causal assumptions dictate statistical strategy. The counterfactual explanation is precise regarding how the DAG structure changes (e.g., noting collider bias in the ICU scenario). Calculation is flawless.
  *   **Upper-Second-Class (15-19 marks):** Correct DAG and calculation. Identifies Severity as the correct adjustment variable. However, the justification for ignoring ICU is vague (e.g., "it's intermediate" without mentioning blocking paths), or the counterfactual explanation lacks precision regarding the change in causal role.
