answer: |-
  **TO:** The Governing Board
  **FROM:** The Standards Committee
  **SUBJECT:** Recommendation on Safeguards Floor Instrument
  **DATE:** October 24, 2023

  **Recommendation**

  The Standards Committee recommends the adoption of the **Conditional Instrument**. We advise the Board to vote for adoption at the upcoming session in three weeks. The instrument should bind the consortium to the proposed safeguards floor only if at least two other major jurisdictions adopt an equivalent floor within eighteen months; otherwise, the obligation lapses.

  **Context: The Commitment Race**

  The Board has correctly framed this decision as a commitment race. In the deployment of frontier models for critical infrastructure, the first standard to achieve entrenchment often becomes the global baseline. Reversing an entrenched technical standard is prohibitively costly, and coordinating the world onto a second standard subsequently is unlikely. Therefore, the primary strategic variable is not strictness, but timing and credibility.

  However, winning this race carries a specific hazard: haste. The danger is not merely that we move first, but that moving first locks in a floor that no party would have chosen with more time to deliberate. This risk is compounded by the ratchet clause contained in both drafts.

  **Analysis of Instruments**

  The Unconditional Instrument offers maximum signaling value. By adopting the floor unilaterally, the consortium demonstrates immediate leadership. This maximizes the probability of setting the global baseline before rival blocs move. However, it exposes the consortium to the risk of unilateral restraint. If rivals do not follow, our laboratories bear the compliance costs and potential capability delays alone, while competitors operate under laxer regimes.

  The Conditional Instrument mitigates this exposure. It ensures that our safeguards become binding only in a coordinated environment. This protects the consortium from competitive disadvantage and ensures that safety measures are effective globally, rather than merely shifting deployment to less regulated jurisdictions.

  **Can a Conditional Instrument Function as a Commitment?**

  The Minority view on the Committee holds that a commitment which can lapse on someone else's inaction is not a commitment at all, but a policy with an exit. They argue rivals will price this accordingly, viewing it as a bluff, and that setting the baseline requires unconditional action.

  The Committee majority disagrees. A conditional instrument *can* function as a commitment, provided the condition is viewed as highly probable. By binding ourselves to the floor *if* partners match us, we commit to a strategy of coordinated safety rather than unilateral restraint. This signals to rivals that we will not engage in a race to the bottom, but also will not handicap ourselves in isolation. It is a commitment to multilateralism, which is itself a strategic stance.

  **The Impact of the Ratchet Clause**

  The ratchet clause—which prevents lowering the floor once raised—fundamentally changes the analysis of conditionality. Without a ratchet, a conditional instrument is easily reversible; if partners fail to join, we could simply vote to lower the standard later. The ratchet removes this flexibility. Once the floor takes effect, it is irreversible for the five-year term.

  Therefore, the ratchet makes the conditional nature of the instrument *more* critical, not less. If we adopt the Unconditional Instrument with a ratchet, and the standard proves economically debilitating or technically flawed, we are locked into that disadvantage permanently. The Conditional Instrument acts as a necessary safety valve against the irreversibility of the ratchet. It ensures we only lock ourselves into a standard if the global ecosystem supports it. To commit unconditionally with a ratchet is to gamble the consortium's operational flexibility on the hope of reciprocal adoption.

  **Honoring the Minority View**

  The Minority's concern regarding credibility is honest and substantial. If major jurisdictions perceive the eighteen-month window as an easy exit, they may delay their own adoption, waiting to see if our instrument lapses. This could cause us to lose the commitment race entirely, allowing a rival bloc to set a lower, less safe baseline that becomes entrenched before we act. There is a genuine risk that conditionality is interpreted as hesitation rather than prudence. If rivals perceive our resolve as weak, they may move unconditionally, capturing the standard-setting advantage.

  **Falsification and Review**

  A decision is only sound if we know how to recognize error. The Committee recommends this Conditional Instrument based on the assumption that partner jurisdictions are currently preparing equivalent measures and require only our signal to finalize them.

  This recommendation should be considered mistaken if, within the next twelve months:
  1.  A rival bloc adopts a unilateral safeguards floor that gains rapid market traction, threatening to become the de facto global standard before our condition is met; or
  2.  Diplomatic channels indicate that partner jurisdictions have no intention of matching our floor, rendering the condition impossible to meet.

  Should either development occur, the Board must convene an emergency session to reconsider the Unconditional Instrument. While the ratchet makes reversal costly, failing to set any standard while a rival sets a weak one is costlier. In such a scenario, the Board should be prepared to waive the conditionality clause to secure the baseline, accepting the risk of unilateral restraint to prevent the entrenchment of inferior safety norms.

  **Action Required**

  The Board should vote to adopt the Conditional Instrument at the session in three weeks. Upon adoption, the Secretariat must immediately initiate diplomatic engagement with the target jurisdictions to ensure they are aware of the eighteen-month window. The clock starts on the date of this vote.

  We cannot afford to lose the race, but we cannot afford to win it alone. The Conditional Instrument offers the only viable path to a safe, entrenched global baseline that does not jeopardize the consortium's standing should coordination fail.

  **Standards Committee**
