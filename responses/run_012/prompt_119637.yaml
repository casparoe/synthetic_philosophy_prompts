answer: |-
  The Common Prior Assumption (CPA) is the linchpin of Robert Aumann's Agreement Theorem, which posits that rational agents who share the same prior probabilities and whose posterior beliefs are common knowledge cannot agree to disagree. If their posteriors differ, they must have received different information. This theorem has sparked a enduring controversy in epistemic game theory and philosophy: is the CPA a defensible idealization of rationality, or a question-begging premise dressed up as a coherence requirement? The debate turns on whether rationality demands a shared starting point for belief, or whether differing starting points are themselves legitimate data.

  The strongest case for the CPA, championed by your friend, treats it not as a psychological description but as a normative coherence condition akin to the no-arbitrage principle in finance. On this view, priors represent the logical structure of the world, not personal taste. If two agents share all evidence regarding an event but maintain different probabilities, they are effectively asserting that the same evidence supports contradictory conclusions. This incoherence creates a theoretical "money pump." If I believe a coin is biased heads and you believe it is biased tails, despite us having seen the same flips, we should both be willing to bet against each other at favorable odds. The CPA rules out this speculative trade among equally informed agents. It ensures that disagreement is always traceable to private information rather than arbitrary optimism or pessimism. By enforcing a common prior, the framework makes disagreement tractable; it transforms epistemic conflict into a solvable puzzle of information aggregation rather than a clash of incompatible worldviews. Without the CPA, game theory loses its predictive power, as any outcome could be rationalized by positing idiosyncratic priors.

  However, your objection strikes at the assumption's foundations. The critique is that the CPA is either empirically false or analytically empty. Empirically, human beings clearly do not share priors; we are shaped by different cultures, biologies, and experiences that precede specific "evidence." Analytically, any difference in priors can be redescribed as a difference in information. If I am an optimist and you are a pessimist, that disposition is itself a fact about the world. If I know "I am the optimist" and you know "You are the pessimist," we possess different indexical information. Therefore, claiming we have a "common prior" is merely a normalization that hides the substantive work. By assuming priors are common, the theorist stipulates away the very phenomenon they wish to explain. Furthermore, using the theorem to demand that real people drift toward each other's views is circular. It derives the necessity of consensus from the assumption of commonality, then uses the impossibility of consensus to prove irrationality. As you noted, internal tidiness is not a standard actual agents meet; demanding it confuses the map for the territory.

  The verdict depends entirely on the domain of application. The CPA is a defensible idealization for *mechanism design* and *theoretical economics*, but a question-begging error when applied to *normative epistemology* or *interpersonal discourse*.

  In theoretical modeling, the CPA survives because it serves a specific methodological function. When analyzing market efficiency or auction design, the economist wants to isolate the effects of information asymmetry. If agents are allowed to have arbitrary priors, the model becomes too flexible to generate insights; any failure of trade could be blamed on prior differences rather than information structures. Here, the CPA is a "as if" assumption. It does not claim humans actually share priors, but that modeling them as such reveals the structural limits of information transmission. In this context, the no-arbitrage argument holds: the model is designed to show what happens when speculation based on pure prior differences is ruled out.

  However, the CPA fails when used as a prescriptive norm for actual belief updating, as your friend suggests. In real-world epistemology, priors are not merely logical starting points; they are condensed histories of learning. To demand a common prior is to demand that two people ignore the sum of their life experiences that shaped their intuition before the current argument began. When your friend argues you should drift toward his view merely because he holds it, he is treating his posterior as evidence of the world, rather than evidence of his prior. This violates the redescription principle: his belief is information about *him*, not necessarily about the *event*. Using the CPA to force convergence in actual debate licenses a form of epistemic conformism where the most confident agent pressures the other to update without providing new objective evidence.

  Therefore, the CPA is a useful fiction for closing models, but a dangerous truth for opening minds. It earns its keep in the abstract architecture of game theory, where it prevents the trivialization of results through arbitrary parameters. But it cannot bear the weight of real-world disagreement. Your friend is correct that the assumption creates a coherent system, but you are correct that coherence does not entail truth. Rational agents can disagree because rationality does not require identical starting points, only consistent updating from wherever one begins. The CPA should remain a tool for theorists, not a weapon for debaters.
