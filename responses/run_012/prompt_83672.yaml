prompt: |-
  ok so I'm mucking about with Leibniz's ethics and I've got a suspicion I want you to stress-test for me. Leibniz's line is that justice just is the charity of the wise — roughly, benevolence steered by knowledge of what's genuinely good, so loving people and knowing what's actually good for them arrive as one package. He also ranks justice in degrees, from the bare minimum of not injuring anyone up through equity to something more like love of the whole, and you're welcome to lean on that if it helps you. My suspicion is that the benevolence half of the formula is doing no real work — that if you actually push on it, it collapses into "justice is whatever a wise person does," with the love part left over as decoration.

  So build me a thought experiment that isolates exactly that. Requirements:

  - One situation, ordinary enough to happen in a hospital, a school, a family or an office. No trolleys, no God, no theodicy, no war-crimes tribunal, no sci-fi. One paragraph at most.
  - Two agents, equally well informed about every non-moral fact. The only difference between them is what they love and how well they see what's good — not what they know about the world.
  - Agent A sincerely and warmly wishes everyone well, but is deficient in wisdom. Not a hypocrite, not secretly self-serving, and not merely sloppy about facts — the failure has to be a failure of practical judgement about what's good.
  - Agent B is cold: feels very little benevolence toward anyone, no warmth, but isn't cruel or malicious either, and is wise. B has to actually act, and act from something other than warm fellow-feeling — duty, love of order, professional role, pride in doing the job properly, whatever fits.
  - The verdicts have to fall out of Leibniz's formula rather than being stipulated by the setup: the formula condemns what A does and endorses what B does. If it can't be made to come out that way, say so and tell me why, don't fudge it.

  Then give me this, under exactly these headings:

  - The case — under 200 words.
  - Why it meets the specs — one short paragraph per requirement above, in order.
  - What's doing the work — about 150 words on which single feature of the case is load-bearing and how much of my conclusion it actually supports.
  - Take that feature out — about 100 words: what happens if you remove or reverse the crucial lever (make B warm, make A wiser, whatever it is).
  - Leibniz's comeback — about 200 words: how someone who knows this better than me would try to rescue the formula. My guess is they'd say the two halves aren't seperable, or that wisdom already includes loving the good, or that charity without wisdom isn't charity at all. Say whether the rescue works.
  - Verdict — two or three sentences on whether I should drop the suspicion.

  Keep it tight. No citations, no reading list, and don't quote Leibniz at me — I only want the argument.
