answer: |-
  - The case
  In a hospital ward, Patient P is depressed and demands discharge. Agent A, a warm nurse, feels deep pity and cannot bear P's distress. A knows the medical risks but judges immediate relief to be the priority, signing P out. P relapses and suffers severe harm. Agent B, a cold doctor, feels no pity, only a commitment to professional order. B knows the same risks but judges long-term health to be the priority, detaining P for treatment. P recovers. Both agents possess identical medical knowledge; they differ only in emotional temperature and their practical judgment of what constitutes P's true good. A's warmth leads to injury; B's coldness leads to healing.

  - Why it meets the specs
  The setting is a standard hospital discharge, avoiding extreme moral dilemmas or metaphysical stakes.

  Both agents share identical non-moral information regarding prognosis and medical risks.

  Agent A is sincerely benevolent but fails practically, mistaking temporary relief for genuine good.

  Agent B is emotionally detached, acting from duty and knowledge rather than fellow-feeling.

  The formula condemns A for harming through ignorance and endorses B for helping through wisdom, isolating wisdom as the decisive variable.

  - What's doing the work
  The load-bearing feature is the objective definition of the "good." Justice, on this model, is the effective promotion of another's perfection. Wisdom identifies that perfection; benevolence merely supplies the vector. In this case, wisdom acts as the steering mechanism while benevolence is merely the engine heat. Without wisdom, the engine overheats and crashes (A); with wisdom, the car drives safely even if the cabin is cold (B). This supports your conclusion that wisdom is the necessary condition for justice, while emotional benevolence is contingent. The case demonstrates that right action tracks cognitive accuracy regarding the good, not affective warmth. The moral weight rests entirely on the hit-or-miss nature of practical judgment.

  - Take that feature out
  If you give A wisdom, A's warmth now aligns with the true good, and A acts justly. If you give B warmth, B still acts justly. The moral verdict flips only when wisdom changes, not when warmth changes. This confirms warmth is an additive quality, not a constitutive one. The switch for justice is cognitive, not affective. Removing the wisdom differential collapses the moral distinction between the agents.

  - Leibniz's comeback
  A Leibnizian would argue you've redefined benevolence as emotional warmth. For Leibniz, benevolence is the *habit of willing the good*. Since B wills the good through wisdom, B *is* benevolent by definition, regardless of emotional temperature. A, willing apparent good, lacks true benevolence. Thus, the formula holds: Justice is willing the good (charity) guided by knowledge (wisdom). The rescue works technically but concedes your point: emotional heat is irrelevant. The "charity" in the formula is rational, not sentimental. Your suspicion stands against the sentimental reading, but not the rational one. Leibniz absorbs your counterexample by stipulating that true wisdom inevitably produces rational love, making the two halves conceptually inseparable even if emotionally distinct. The formula survives, but only by defining away the separation you exploited.

  - Verdict
  Keep the suspicion, but refine it. Emotional benevolence is decorative, but rational benevolence (willing the good) is inseparable from wisdom. You are right that warmth is not the engine.
