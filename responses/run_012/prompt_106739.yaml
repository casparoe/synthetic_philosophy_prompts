answer: |-
  ### 1. The Likely Decision (Consistency with Record)

  If the panel prioritizes strict *stare decisis* based on the text of the published decisions, it will likely **approve the application with conditions on neither stunning nor ablation.**

  *   **Stunning and Killing:** The panel will likely classify *Macrobrachium rosenbergii* under the "Shrimp and Prawns" precedent rather than "Crabs and Lobsters." The commissioned literature review explicitly states the evidence for pain is "comparable to that for penaeid shrimp" and "weaker than for crabs and lobsters." The Shrimp precedent permits ice-slurry killing and does not require stunning, citing both evidence levels and the lack of validated commercial methods. While a method is now validated, the applicant argues it is not in commercial use and raises costs. The panel has historically treated commercial feasibility as a barrier (Shrimp decision). Consequently, the panel will likely rule that ice-slurry killing is permitted and stunning is not required, viewing the "Review Clause" in the Shrimp decision as a mandate for future review, not an automatic trigger for new applicants.
  *   **Ablation:** The panel will likely rule that the record **does not reach** eyestalk ablation. All existing precedents concern slaughter methods or immediate pre-slaughter handling (live chilling). There is no decision regarding surgical modification of broodstock for reproduction. In the absence of a prohibition, the default position of the scheme appears to be permission (as seen with Bivalves, where lack of evidence led to no requirements).

  ### 2. What the Panel Should Decide (Normative Recommendation)

  The panel should **require electrical stunning, prohibit ice-slurry killing, and prohibit unanaesthetized ablation.**

  *   **Stunning and Killing:** The Shrimp precedent was explicitly provisional ("evidence *then* available," "Review clause"). The scheme's trajectory (Finfish → Crabs → Cephalopods) demonstrates a principle of expanding protection as evidence matures and technology becomes available. Since electrical stunning is now validated, the feasibility barrier from the Shrimp decision is removed. To permit ice-slurry killing followed by boiling creates a direct conflict with the "Crabs and Lobsters" precedent (prohibiting boiling conscious animals) if *Macrobrachium* is physiologically similar enough to be grouped with decapods. The panel should treat the "Review Clause" as active for new applications where technology has shifted.
  *   **Ablation:** While the record is silent, the principle underpinning the Finfish and Eel decisions is the prevention of avoidable distress and pain in sentient animals. If the animal possesses sufficient nervous complexity to warrant welfare consideration at slaughter (as the "suggestive" pain evidence implies), that consideration should extend to invasive surgical procedures. Permitting ablation without anesthesia while requiring stunning at slaughter creates an ethical inconsistency in the scheme's treatment of pain.

  ### 3. Addressing the Three Questions

  1.  **Is ice-slurry killing permitted?**
      *   *Record:* Permitted for Penaeid Shrimp; Prohibited for Eels and Finfish (live chilling/asphyxiation).
      *   *Status:* **Contested.** If classified as Shrimp, yes. If classified as Crab/Decapod, no (due to the boiling prohibition).
  2.  **Must stunning be installed?**
      *   *Record:* Required for Finfish, Eels, Crabs, Cephalopods. Not required for Penaeid Shrimp (due to lack of validated commercial method).
      *   *Status:* **Contested.** The method is now validated, removing the specific exemption ground for Shrimp. However, the "commercial use" constraint remains.
  3.  **Does the record reach broodstock ablation?**
      *   *Record:* Silent. Precedents cover slaughter and pre-slaughter handling only.
      *   *Status:* **Not Reached.** The record underdetermines this issue.

  ### 4. Rules Fitting the Record and Predictions

  **Rule A: Taxonomic Classification**
  *   *Definition:* Welfare standards are applied based on the specific taxonomic group named in precedents (e.g., "Shrimp and Prawns" covers all prawns).
  *   *Prediction:* Ice-slurry permitted; Stunning not required; Ablation permitted.
  *   *Fit:* High. Matches the specific captioning of the Shrimp decision.

  **Rule B: Evidence Threshold**
  *   *Definition:* Standards are applied based on the strength of pain evidence relative to the "Crab" baseline, regardless of taxonomy. (Strong/Comparable to Crab = Stunning; Weaker/None = No Stunning).
  *   *Prediction:* Ice-slurry permitted; Stunning not required (Review says evidence is weaker than crabs); Ablation permitted.
  *   *Fit:* High. Matches the reasoning in Cephalopod (upgraded due to evidence) and Bivalve (downgraded due to lack of CNS).

  **Rule C: Technological Feasibility**
  *   *Definition:* If a stunning method is validated for a species, it is required, regardless of commercial prevalence, unless cost is prohibitive (defined by the applicant).
  *   *Prediction:* Stunning required; Ice-slurry prohibited (if it doesn't stun); Ablation permitted.
  *   *Fit:* Medium. Matches Finfish/Eel/Crab logic, but conflicts with the Shrimp "commercial scale" constraint.

  **Rule D: Procedural Harm Principle**
  *   *Definition:* Any invasive procedure causing potential pain requires analgesia or anesthesia, extrapolated from slaughter requirements.
  *   *Prediction:* Ablation prohibited (without anesthesia).
  *   *Fit:* Low. No explicit text supports this, but it aligns with the *purpose* of the Finfish/Eel rules.

  ### 5. Preferred Verdict and Reasoning

  **Verdict:** I prefer a hybrid of **Rule B (Evidence)** and **Rule C (Technology)**, with an extension of **Rule D**.

  **Reasons:**
  1.  **Dynamic Precedent:** The Shrimp decision included a "Review Clause." Ignoring this clause because the panel hasn't self-initiated a review undermines the scheme's adaptability. The validation of electrical stunning satisfies the technological constraint that originally justified the exemption.
  2.  **Consistency on Boiling:** The Crab precedent prohibits boiling conscious animals. The applicant intends to boil *Macrobrachium*. If the ice slurry does not render them insensible (as per the Shrimp precedent), this application directly contravenes the Crab precedent's core welfare outcome. Given that *Macrobrachium* are decapods like crabs, grouping them with Penaeids to allow boiling conscious is a weaker analogical fit than grouping them with Crabs to prevent it.
  3.  **Ablation:** While the record is silent, the scheme's purpose is "welfare." Allowing unanaesthetized surgery on animals deemed sentient enough for slaughter protections creates a reputational and logical vulnerability. The panel should rule that the "insensibility" requirement for Finfish/Eels establishes a general principle against inflicting avoidable pain, covering broodstock procedures.

  ### 6. Closest Analog

  The **Shrimp and Prawns (Penaeid)** decision is the closest **taxonomic and evidentiary** analog. The commissioned review explicitly links *Macrobrachium* pain evidence to Penaeids.

  However, the **Crabs and Lobsters** decision is the closest **methodological** analog. The harvest method (slurry followed by boiling) is functionally identical to the practice prohibited for crabs (boiling conscious), whereas the Penaeid decision focused on the slurry itself as the killing method.

  ### 7. Separating Case

  The case that would most cleanly separate the surviving rules (Taxonomy vs. Technology) would be:
  **A new application for Penaeid Shrimp where electrical stunning is commercially used and cost-neutral.**

  *   *Why:* If the panel denies stunning in this case, they confirm **Rule A (Taxonomy)** or **Rule B (Evidence)** is dominant (i.e., Shrimp never need stunning regardless of tech). If they require stunning, they confirm **Rule C (Technology)** is dominant (i.e., the Shrimp precedent was only about feasibility, not species status). This separates whether the Shrimp precedent was a permanent biological exemption or a temporary technological concession.

  ### 8. Underdetermination and Principles

  The record genuinely underdetermines the **Ablation** issue.
  *   **Choice 1 (Permit Ablation):** Adopts the principle of *Expressio Unius Est Exclusio Alterius* (the expression of one thing excludes others). Since the standards specify slaughter and handling, they exclude broodstock surgery. This prioritizes regulatory certainty and scope limitation.
  *   **Choice 2 (Prohibit Ablation):** Adopts the principle of *Purposive Construction*. The scheme's purpose is welfare; therefore, rules against pain at death imply rules against pain during life. This prioritizes ethical consistency over textual strictness.

  The record also underdetermines the **Shrimp vs. Crab** classification for *Macrobrachium*.
  *   **Choice 1 (Shrimp):** Adopts the principle of *Specificity*. The specific decision on "Shrimp and Prawns" overrides the general trend of increasing invertebrate protection.
  *   **Choice 2 (Crab):** Adopts the principle of *Precaution*. Where evidence is "suggestive" and methods exist, the scheme should err on the side of the higher welfare standard (Crab) to avoid future reversal.

  ### 9. Closing Reflections

  **What would change my mind?**
  If the "Review Clause" in the Shrimp decision is legally interpreted within the scheme's bylaws as requiring a formal plenary vote to amend the standard, rather than applying to individual applications. If the panel lacks the authority to "update" a precedent without a formal review process, I must recommend following the **Shrimp** precedent strictly, even if it seems outdated.

  **Where is my reasoning most likely to fail?**
  My reasoning assumes that "validated" electrical stunning for *Macrobrachium* is functionally equivalent to the approved methods for Finfish or Eels. If the validation only proves insensibility in a lab setting but fails to account for the high-density rearing conditions mentioned in the application (which might affect water conductivity or handling stress), the "Technological Feasibility" argument collapses. Additionally, I may be overstating the conflict between the Shrimp and Crab precedents; the Shrimp decision permitted ice slurry *killing*, which implies the slurry was deemed sufficient to prevent distress *during death*, whereas the Crab decision prohibits boiling *conscious* animals. If the ice slurry kills the prawn before boiling begins, the Crab precedent might not technically apply, leaving the Shrimp precedent as the sole governing rule.
