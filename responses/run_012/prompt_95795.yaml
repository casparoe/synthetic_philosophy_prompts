answer: |-
  Here is the audit of your friend's plasma analogy.

  ### 1. The Correspondence Table
  Your friend's argument rests on the claim that Plasma Donation (Source) and Kidney Sales (Target) are relevantly similar. Here is the mapping he is relying on:

  | Feature | Source: Paid Plasma Donation | Target: Paid Kidney Donation |
  | :--- | :--- | :--- |
  | **Consent** | Donor signs waivers; walks in voluntarily. | Seller signs waivers; walks in voluntarily. |
  | **Compensation** | Direct cash/debit load per visit (~$50). | Direct cash payment per organ (~$30k+). |
  | **Medical Setting** | Sterile clinic, phlebotomist, FDA regulated. | Hospital, surgeon, (hypothetically) FDA/UNOS regulated. |
  | **Bodily Intrusion** | Needle in arm, blood removed. | Incision in abdomen, organ removed. |
  | **Motivation** | Primarily financial need. | Primarily financial need. |
  | **Outcome** | Plasma separated, remainder returned. | Kidney transplanted, donor leaves with one. |
  | **Social Status** | Generally accepted, seen as "business." | Currently stigmatized, seen as "barbaric." |

  ### 2. The Breaks (Disanalogies)
  Here is where the mapping fails. I have sorted these into **Incidental** (differences that could theoretically be fixed or regulated away) and **Fatal/Damaging** (differences that fundamentally alter the moral or logical structure of the transaction).

  #### **Pile A: Incidental Differences (The "Patchable" Stuff)**
  *   **Current Legality:** Plasma is legal; kidneys are not. *Verdict:* Incidental. This is the conclusion he is trying to prove, so citing it as a difference is circular.
  *   **Social Stigma:** People don't judge plasma donors; they judge kidney sellers. *Verdict:* Incidental. Stigma is a social construct that often follows legality (see: cannabis, sex work). If the market were regulated, stigma might fade.
  *   **Frequency:** Plasma is twice a week; kidneys are once in a lifetime. *Verdict:* Incidental. This is a function of regeneration (see below), not a categorical moral difference in itself.

  #### **Pile B: Fatal/Damaging Differences (The "Argument Breakers")**
  *   **Surgical Risk Profile:** Plasma involves a needle stick and citrate reaction risks. Kidney donation involves general anesthesia, laparoscopic or open surgery, risk of infection, blood clots, and chronic pain.
      *   *Damage:* **Fatal to the "Same Kind of Transaction" claim.** You cannot equate a blood draw to a nephrectomy. The threshold for "informed consent" is vastly higher when the risk of death or permanent disability is non-zero.
  *   **Long-Term Health Reserve:** Plasma donors retain full physiological function. Kidney donors lose ~50% of renal reserve. While many live normal lives, they have no backup if the remaining kidney fails, and they face higher rates of hypertension and proteinuria later in life.
      *   *Damage:* **Damaging.** This changes the transaction from "renting a resource" to "liquidating a safety asset."
  *   **The "Titmuss Effect" (Supply Quality):** Your friend mentioned blood. Richard Titmuss argued that paying for blood degrades the supply (sick people hide illness to get paid). Plasma avoids this via rigorous testing. Kidneys are harder to test for long-term viability without using them.
      *   *Damage:* **Damaging.** It suggests the market mechanics that work for plasma might fail for organs, leading to worse health outcomes for *recipients*, not just donors.

  ### 3. The Regeneration Commitment
  You asked specifically about regeneration: *Plasma grows back; kidneys don't. Is this fatal or a footnote?*

  **Verdict: It is Fatal to the Economic Analogy.**

  **Defense:** Your friend claims these are the "same kind of transaction." They are not.
  *   **Plasma is Income Generation:** Because plasma regenerates, the donor is selling a *service* (the time and biological labor of producing plasma). It is a recurring revenue stream. A donor can stop tomorrow and their body is whole again.
  *   **Kidney is Asset Liquidation:** Because the kidney does not regenerate, the seller is selling a *capital asset*. This is the difference between renting out a room in your house and selling the roof.

  **Why this matters:** In a libertarian framework, we worry about coercion. A poor person selling plasma is trading time for money. A poor person selling a kidney is trading *future health security* for present money. The non-renewable nature makes the transaction irreversible and the desperation calculus much darker. You can recover from a bad month of plasma selling; you cannot recover from a bad kidney sale. This makes the "voluntariness" of the kidney sale inherently more suspect than the plasma sale.

  ### 4. Hidden Imports (What he's smuggling in)
  Your friend is assuming two things about the plasma market that are not actually settled:

  1.  **The "Plasma is Moral" Premise:** He treats the US plasma market as a moral triumph. It isn't. The US is one of the few developed nations that allows paid plasma, and it is heavily criticized by bioethicists and the WHO for "plasma harvesting" from the poor. The EU bans paid plasma specifically because they view it as exploitative. He is importing a contested premise as a neutral fact.
  2.  **The "Voluntary" Definition:** He assumes that because no one is holding a gun to the donor's head, the choice is free. But in bioethics, "undue inducement" is a real concept. If the money is high enough to override rational self-preservation (e.g., "I need this $30k for rent or I'm homeless"), the consent is compromised. The plasma market already skirts this line; the kidney market would cross it.

  ### 5. Does the Analogy Get Him to the Conclusion?
  **No.** Even if you concede that paid plasma is perfectly safe, moral, and well-regulated, **it does not prove paid kidneys should be legal.**

  The analogy is **decorative, not probative.**
  It functions as a "burden shifter." He is saying, *"You accept A, so you must accept B."* But because A and B differ on risk, permanence, and surgical intrusion, accepting A does not logically compel you to accept B. You can consistently hold that "selling renewable tissue is okay" and "selling non-renewable organs is not."

  To get to his conclusion, he needs an argument about **bodily autonomy** (I own me, I can sell me), not an analogy about plasma. The plasma story is just a rhetorical shield to make the kidney sale look mundane.

  ### 6. A Better Analogy
  If he wants an analogy that actually carries the weight of his argument (Voluntary, Paid, Risky, Bodily, Non-Renewable), he should stop talking about plasma and start talking about **Paid Egg Donation** or **Phase I Clinical Trials.**

  **The Stronger Analogy: Paid Egg Donation**
  *   **Correspondence:**
      *   **Bodily:** Involves hormones and surgical retrieval (not just a needle).
      *   **Risk:** Risk of Ovarian Hyperstimulation Syndrome (OHSS), long-term fertility questions, surgical complications.
      *   **Non-Renewable:** You are depleting a finite biological reserve.
      *   **Paid:** Compensation is significant ($5,000–$10,000+), not just "reimbursement."
      *   **Legal:** It is currently legal and regulated.
  *   **Why it works better:** It bridges the gap between plasma (fluid) and kidneys (organs). If he thinks egg donation is moral, he has a stronger case for kidneys. If he admits egg donation is ethically fraught *because* of the risk and financial coercion, he undermines his own kidney argument.

  **The "Nuclear Option" Analogy: Hazardous Labor (e.g., Deep Sea Welding)**
  *   **Correspondence:**
      *   **Voluntary:** Workers choose the job.
      *   **Paid:** High hazard pay.
      *   **Risky:** High chance of death or permanent injury.
      *   **Bodily:** You are selling your physical safety and health.
  *   **Why it works:** It isolates the **Libertarian Principle**. The argument isn't about "body parts"; it's about "risk for cash." We allow people to risk their lives in coal mines for money. Why not in an operating room?
  *   **The Counter:** We regulate mine safety heavily to prevent exploitation. If we allowed kidney sales, we would need equivalent safety regulations (minimum price, psychological evals, lifetime health insurance). If he isn't arguing for *those* regulations, the analogy fails.

  ### Summary for Your Next Drink
  Tell him this:
  *"Plasma is a rental; a kidney is a foreclosure. You're comparing a job to a liquidation sale. If you want to argue for kidney markets, don't hide behind plasma. Argue that people should be allowed to sell their future health security for cash, like a deep-sea welder, and tell me what regulations stop that from becoming a tax on the poor."*
