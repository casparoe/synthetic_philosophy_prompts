  6.  **Refining the Audit (Self-Correction during drafting):**
      *   *Correction on Sentence 7:* I need to be precise. Dennett distinguishes between "intrinsic" (which he rejects) and "real" (which he accepts via Real Patterns). The summary says "no real intentionality, only as-if." This is the smoking gun. Searle uses "as-if" for derived. Dennett uses "real patterns." The summary attributes Searle's vocabulary ("as-if" = not real) to Dennett's conclusion. That is the tilt.
      *   *Correction on Sentence 12:* Make sure to note that Dennett would reject the premise of this objection, even if the summary accurately reports Searle making it.

  7.  **Final Review against constraints:**
