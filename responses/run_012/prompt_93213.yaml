  8.  **Final Polish:** Ensure the distinction between "Original/Derived" (Searle's terms) and "Real/As-If" (the contested territory) is clear. Dennett accepts "Derived" but rejects the implication that "Derived" means "Not Real." Searle equates "Derived" with "Not Intrinsic" and reserves "Real" (in the strong sense) for "Intrinsic." The summary conflates these in describing Dennett.

