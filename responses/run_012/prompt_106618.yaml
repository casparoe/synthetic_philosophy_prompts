answer: |-
  The academy presupposes that power does not crush the self but constructs it, defining freedom as the voluntary alignment of interior life with external data rather than the right to remain hidden.

  Power here is not a wall but a mold; it does not say "no" but instead says "become this." Knowledge is not a neutral photograph of who you are but a blueprint that changes you by measuring you; the moment the band records your pulse, it tells you what your pulse ought to be. The subject is not a finished statue but wet clay, determined by nothing except the pressure of the ranking, and therefore free only in the sense that clay is free to take the shape of the hand pressing it. The academy assumes the interior life is not a private sanctuary but a hidden workshop that must be brought into the light to be real. By reading private reflections aloud, the institution claims that a thought does not fully exist until it is public property, and that secrecy is merely a symptom of incompleteness.

  The prospectus contradicts the mechanics where it claims the index "discloses the self she already is," because a static truth cannot be improved through advancement levels. It contradicts itself where it calls reflections "private" yet broadcasts them, turning confession into performance. It claims leaving is free, yet the forfeiture of levels makes exit a punishment, proving the open doors are a test of compliance rather than a grant of liberty.

  The parts that strictly require this theory are the open doors, which make discipline a choice, and the advancement system, which requires the self to be changeable. The parts that merely sit comfortably beside it include the anonymous flagging and the council, which could function just as easily in a repressive prison where power is about punishment rather than shaping. The biometric bands could be shackles or mirrors; the theory only demands they be visible.

  If you replace this with a view where power is repressive and the self is finished, the institution must surrender the claim of benevolence and the open doors, because a fixed, dangerous self must be locked away. It must surrender the ranking system, because a finished self cannot advance, only be sorted. It must surrender the idea that data reveals truth, admitting instead that the band is a leash, and it must stop pretending that leaving is a choice rather than an escape.
