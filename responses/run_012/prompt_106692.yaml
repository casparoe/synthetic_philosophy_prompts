prompt: |-
  Alright, I'm a novelist, not a philosopher, so forgive me, but I've been stuck on this for weeks while writing a book about a family that tears itself apart over old grudges, and I need someone to tell me if there's an actual rule underneath my instincts or if I'm just making stuff up.

  Here's the deal. I keep having these strong reactions about who gets to blame who, and they don't line up the way I'd expect. For example:

  My brother, who's been cheating on his wife for years and everyone knows it, sits me down and tells me I'm garbage for sleeping with someone behind my partner's back. He's not wrong about the content. But the whole time he's talking I feel nothing. His blame just doesn't land on me. I don't accept it, I don't even feel accused.

  My old AA sponsor, a guy who drank himself onto the street and then got sober twenty years ago, says almost the exact same words to me about my drinking. That one lands hard. Lands harder than when my teetotal sister says it, which is strange because she's the one with clean hands.

  Now my friend Marco, who drinks as much as I do and is in no position to talk, says the same thing to me. And that one lands too. Maybe even more than the sponsor's. Which bugs me, because by my logic about my brother, Marco should be in the same boat.

  My mother, who gave up basically her whole life for us kids, tells me I'm selfish for not coming home more. It lands, and it stings, even though she was a mess when I was young and left us alone alot. Somehow that doesn't cancel it.

  Some stranger on the internet, a guy whose entire timeline is him being a hypocrite about everything, calls me a hypocrite. Nothing. Zero. I feel nothing.

  A politician who's been taking money from exactly the industry he's now denouncing gives a speech about corruption. I might agree with every word, but the blame feels dead to me. Like he's using it to cover himself.

  Then the one that really bothers me: last month I chewed out a colleague for a screwup that I myself made the month before, the same screwup, and the whole time I felt like I had no right to be saying it. He deserved the criticism, I was factually right, and I wasn't doing it to save my own skin. I still felt like I'd forfeited something.

  One more, and this is the one I can't sort: a friend of mine who relapsed last year, she's drinking again right now, tonight, as we speak, tells me I'm throwing my life away. Same fault, currently, no excuses, no apology. Does she get to say it? Half of me says obviously not, and half of me says she's the only one in the room who actually knows what she's talking about.

  The half-baked rule I've been carrying around is: you lose the right to blame someone for a fault you've got yourself, unless you've beaten it. But that can't be right, because Marco hasn't beaten anything and his blame lands, and my mother has plenty of her own failings and hers lands too. So maybe its not about the fault at all, but about whether the blamer is using the blame to make themselves look better or to dodge their own thing. That's what feels different about my brother and the politician, they're blaming me to get themselves off the hook. But then the colleague case wrecks that, because I wasn't dodging anything and I still felt disqualified.

  So: is there a principle that gets all of these, or close? If I have to give up one of my reactions, which one, and why that one and not another? And what does your principle say about my relapsed friend, and about a case I haven't hit yet, someone blaming me for a fault they've never had and don't understand at all, a person who's never been near the thing telling me how I ought to feel about it. Does the outsider with clean hands have more standing or less? Please don't just tell me all blame is equally valid, I'll throw the book at the wall. Pick a side, spell out the rule, and defend it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist writing a book about a family tearing itself apart over old grudges.
      *   **Problem:** Stuck on the mechanics of moral authority and blame. They have strong intuitive reactions to different scenarios but can't find a consistent rule.
      *   **Goal:** Wants a definitive principle (rule) that explains their intuitions, even if it means discarding one of their reactions. They explicitly ask *not* to be told "all blame is equally valid." They want me to pick a side, spell out the rule, and defend it.
      *   **Tone:** Direct, analytical, empathetic to the creative process, philosophical but grounded in human psychology/narrative logic.

  2.  **Deconstruct the Scenarios:**
      *   *Brother (Cheater blaming Cheater):* Blame doesn't land. (Hypocrisy/Deflection).
      *   *AA Sponsor (Recoverable Alcoholic blaming Drinker):* Blame lands hard. (Shared experience + Overcome).
      *   *Sister (Teetotaler blaming Drinker):* Blame lands less than Sponsor. (Clean hands but no experience).
      *   *Marco (Active Drinker blaming Drinker):* Blame lands. (Shared struggle/Solidarity).
      *   *Mother (Sacrificing but Flawed Parent blaming Selfish Child):* Blame lands/stings. (Sacrifice/Investment > Past Failures).
      *   *Internet Stranger (Hypocrite blaming Hypocrite):* Nothing. (No relationship/Obvious Deflection).
      *   *Politician (Corrupt blaming Corruption):* Blame feels dead. (Institutional Hypocrisy/Deflection).
      *   *Self (Criticizing Colleague for own past mistake):* Felt disqualified. (Internal Integrity/Empathy).
      *   *Relapsed Friend (Active Drinker blaming Drinker):* Conflict. (Shared pain vs. Current Hypocrisy).
      *   *Outsider (Never experienced the fault):* Unknown variable.

  3.  **Evaluate Potential Principles:**
      *   *Hypothesis 1: Clean Hands.* (You can't blame if you're guilty). *Fails:* Marco (guilty) lands. Mother (guilty) lands. Sponsor (formerly guilty) lands.
      *   *Hypothesis 2: Shared Experience.* (Only those who know can judge). *Fails:* Sister (no experience) lands somewhat. Outsider (no experience) is the question.
      *   *Hypothesis 3: Intent/Deflection.* (Blame used to hide own sins fails). *Fails:* Colleague case (User wasn't deflecting but felt disqualified).
      *   *Hypothesis 4: Moral Standing/Investment.* (Do you care about the outcome more than your own image?). *Stronger.*

  4.  **Develop the Core Principle:**
      *   The common thread in the "landing" cases (Sponsor, Marco, Mother) vs. the "non-landing" cases (Brother, Politician, Stranger) isn't about *sin*. It's about *solidarity* vs. *superiority*.
      *   When the blamer positions themselves *above* the blamee (Brother, Politician), it feels like a power play.
      *   When the blamer positions themselves *alongside* or *beneath* the blamee (Marco, Sponsor, Relapsed Friend), it feels like a warning or a plea.
      *   *The Colleague Case:* Why did the user feel disqualified? Because they lacked *empathy* in the moment. They forgot their own struggle. It wasn't about the right to speak, but the *spirit* in which it was spoken.
      *   *The Mother Case:* She sacrificed. Her blame comes from *investment*, not superiority.
      *   *The Relapsed Friend:* She is in the trenches. Her blame is a mirror.

      *   *Refining the Rule:* **The Principle of Shared Burden.**
      *   Blame lands when it is offered as a *burden shared* or a *warning from the trenches*. It fails when it is offered as a *gavel from the bench*.
      *   It's not about *purity*. It's about *alignment*.
      *   If the blamer implies "I am better than you," the blame dies (Brother, Politician).
      *   If the blamer implies "I know how heavy this is, and it's crushing us," the blame lives (Sponsor, Marco, Relapsed Friend).
      *   The Colleague case: The user felt disqualified because they momentarily adopted the "gavel" stance instead of the "trenches" stance.

  5.  **Address the Specific Questions:**
      *   *Is there a principle?* Yes, The Principle of Shared Burden (or Alignment).
      *   *Which reaction to give up?* The Colleague reaction needs reframing. The user didn't lose the *right* to correct the error, but they lost the *moral resonance* because they disconnected from their own humanity in that moment. It wasn't that they couldn't speak; it's that they spoke without grace.
      *   *The Relapsed Friend:* She has the *most* standing. She is the living warning. Her blame is actually a cry for help for both of them.
      *   *The Outsider (Clean Hands/No Experience):* They have *less* standing on the *nature* of the struggle, but can judge the *consequences*. However, without empathy, it sounds like judgment from a tower.

  6.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Acknowledge the novelist's instinct. Validate that they aren't making it up.
      *   *The Rule:* Define it clearly. "The Law of Moral Resonance" or "The Principle of Solidarity." Let's go with **The Principle of Solidarity vs. Superiority.**
      *   *Explanation:* Break down why the Brother fails (Superiority/Deflection) vs. Marco (Solidarity).
      *   *The Sacrifice (Mother):* Explain that sacrifice buys credit, not because she's perfect, but because she paid a price.
      *   *The Colleague:* This is the pivot. Explain that the user felt bad not because they were wrong, but because they lacked *compassion* in the delivery. They forgot their own humanity.
      *   *The Relapsed Friend:* This is the crux for the novel. She has high standing. Why? Because she is the canary in the coal mine.
      *   *The Outsider:* Low standing on the *feeling*, high standing on the *fact*, but low emotional impact.
      *   *Application to the Book:* How does this help the family drama? The grudges aren't about who did what, but who thinks they are *better*.

  7.  **Refining the Tone:**
      *   Avoid academic jargon. Keep it punchy.
      *   Be decisive. The user asked me to pick a side.
      *   Use metaphors (The Gavel vs. The Hand).

  8.  **Final Review against Constraints:**
      *   Did I pick a side? Yes.
      *   Did I spell out the rule? Yes.
      *   Did I defend it? Yes.
      *   Did I address the Relapsed Friend and Outsider? Yes.
      *   Did I tell them which reaction to adjust? Yes (The Colleague one).

      *(Self-Correction during drafting)*: I need to make sure I don't invalidate the Colleague feeling. It *was* valid to feel disqualified. The rule should explain *why* it felt that way without saying the user was logically wrong. The feeling came from a breach of *empathy*, not logic.
      Actually, looking closer at the Colleague case: "I still felt like I'd forfeited something." The rule should validate this. You forfeit the *moral weight* of the criticism if you deliver it without acknowledging your own fallibility. You can still manage, but you can't *judge*.

      *Revised Rule:* **Blame requires alignment, not purity.**
      *   If you blame from above (I am clean, you are dirty), it fails (unless you paid a heavy price like the Mother).
      *   If you blame from beside (We are both in this mess), it lands.
      *   If you blame from below (I am drowning, don't jump in), it lands hardest.

      Let's go with **The Principle of Complicity.** You gain the right to blame not by being innocent, but by acknowledging your own capacity for the fault.

      Wait, the Brother is complicit but his blame fails. Why? Because he uses it to *distract*.
      So it's **Intent + Alignment.**
      Let's simplify. **The Principle of Resonance.**
      Blame is a frequency. It only vibrates if the blamer's string is tuned to the same pain, either through recovery (Sponsor), shared struggle (Marco), or sacrifice (Mother). It is dampened if used as a shield (Brother, Politician).

      Okay, I think the strongest narrative rule is: **Moral Authority is purchased with Vulnerability, not Purity.**
      *   Brother: No vulnerability (hiding cheating).
      *   Sponsor: High vulnerability (admits past).
      *   Marco: High vulnerability (admits current struggle).
      *   Mother: High vulnerability (admits sacrifice/cost).
      *   Politician: No vulnerability (hiding corruption).
      *   Colleague: User failed to show vulnerability (forgot their own mistake).
      *   Relapsed Friend: Maximum vulnerability (currently suffering).

      This fits perfectly.

  9.  **Final Polish:** Ensure the advice helps the novel. The family tearing apart is likely because they are wielding blame as weapons (Purity) rather than invitations to heal (Vulnerability).

      *(Final check on the Outsider)*: A person who never had the fault. They have Purity but no Vulnerability. Therefore, low resonance. They can state facts, but cannot assign *shame*.

      Okay, ready to write.
answer: |-
  You aren't making this up. You have stumbled onto a fundamental mechanic of human psychology that most people ignore because it's inconvenient. You are looking for a rule of *ethics*, but the rule you're sensing is actually one of *narrative resonance*.

  Here is the principle. I am going to be decisive because you asked me to be.

  ### The Principle: Moral Authority is Purchased with Vulnerability, Not Purity.

  The common thread in every scenario where the blame "lands" is that the blamer has exposed their own neck. In every scenario where the blame "dies," the blamer is using the accusation as a shield to protect their own ego.

  It does not matter if the blamer is guilty of the same sin. It matters **why they are speaking.**

  *   **Your Brother & The Politician:** They blame you to create distance. They are saying, "Look at *him*, not at *me*." This is blame as a deflection. It fails because the subtext is cowardice.
  *   **Your Sponsor & Marco:** They blame you to create proximity. The Sponsor says, "I was there, it's hell, don't go back." Marco says, "We are in this together, and I see us sinking." This is blame as solidarity. It lands because the subtext is courage.
  *   **Your Mother:** She blames you from a position of *sacrifice*. She has paid a price. Sacrifice is a form of vulnerability. She gave up her life; that buys her the credit to ask for a return on investment. It lands because she has skin in the game.
  *   **The Colleague (You):** You felt disqualified because, in that moment, you forgot your own vulnerability. You weren't deflecting, but you were acting from a place of *administrative correctness* rather than shared humanity. You felt like a hypocrite not because you made a mistake, but because you momentarily pretended you were above making them. You lost the resonance because you dropped the vulnerability.

  ### Which Reaction Do You Give Up?

  You need to reframe the **Colleague** incident.

  You felt you forfeited the right to speak. That feeling was correct, but your reasoning is slightly off. You didn't forfeit the right to correct the error; you forfeited the *moral weight* of the correction.

  **The Adjustment:** You *can* correct a colleague for a mistake you've made, but only if you frame it as, "I know how easy this is to screw up; I did it last month. Here is how we fix it so it doesn't eat us alive." If you frame it as, "You screwed this up," without acknowledging your own fallibility, you become the Brother. You become the Gavel.

  So, don't give up the feeling. Give up the idea that *silence* is the only alternative. The alternative to "Blame from Above" isn't "No Blame." It's "Blame from Beside."

  ### The Relapsed Friend

  This is the crux of your novel, isn't it?

  **She has the most standing of anyone in the room.**

  Under the Principle of Vulnerability, the active addict/alcoholic holds the highest moral authority on the dangers of the substance. Why? Because she is currently bleeding.
  *   The Sponsor is healed; the wound is a scar.
  *   The Sister is untouched; she has no wound.
  *   The Relapsed Friend is bleeding *now*.

  When she tells you that you are throwing your life away, she isn't judging you. She is screaming from inside the burning building. Her blame is actually a plea. It lands hardest because it carries the weight of immediate consequence. If your character dismisses her because "she's drinking too," that character is choosing the Brother's logic (Purity) over the truth (Vulnerability).

  For your book: The tragedy of the family shouldn't be that they are all sinners. It should be that they are all sinners who refuse to admit it, using each other's sins as weapons to pretend they are the righteous ones.

  ### The Outsider (Clean Hands, No Experience)

  You asked about the person who has never had the fault and doesn't understand it.

  **They have the least standing.**

  They have Purity, but they have no Vulnerability. They are judging a war they have never visited. They can judge the *consequences* (facts), but they cannot judge the *struggle* (morality).
  *   If they say, "You are breaking the law," that lands (Fact).
  *   If they say, "You are weak for drinking," that dies (Judgment).

  Without the capacity to understand the temptation, their blame feels like it comes from a vacuum. It creates resentment, not change. In your family drama, the "perfect" sibling who never messed up should be the one nobody listens to. They are the most morally bankrupt character in the room because they lack empathy.

  ### How to Use This in Your Book

  You are writing about a family tearing itself apart. If you apply this rule, the conflict shifts.

  1.  **The Antagonist isn't the Sinner:** It's the Hypocrite. The family member who refuses to acknowledge their own capacity for evil. They are the ones whose blame doesn't land, which makes them shout louder, which tears the family apart.
  2.  **The Protagonist's Arc:** The protagonist shouldn't strive to be innocent. They should strive to be *honest*. The moment they can stand up and say, "Yes, I did that. And I am sorry," they steal the weapon from the Brother's hand. You cannot shame a man who has already shamed himself.
  3.  **The Climax:** The family doesn't heal when everyone forgives each other. They heal when everyone admits they are broken. The "Blame" stops being a weapon and starts being a map.

  **Summary Rule:**
  Blame is valid only when it is offered as a warning from the trenches, not a verdict from the tower. If the speaker is trying to elevate themselves, they lose the right to speak. If they are trying to save the listener (even while drowning themselves), they hold the ultimate authority.

  Your instincts are correct. Trust them. Write the scene where the relapsed friend speaks, and make sure the room goes quiet when she does. She's the only one telling the truth.
