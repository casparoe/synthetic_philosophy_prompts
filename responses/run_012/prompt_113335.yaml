answer: |-
  *   **Beat 1:** Open with the visual ritual: the single crisp dollar bill placed on the checkered picnic tablecloth.
  *   **Beat 2:** Describe the shift in atmosphere when the bidding passes one dollar—the moment fun curdles into obligation.
  *   **Beat 3:** Concrete Anecdote: The year two PhD candidates bid up to ten dollars, hands shaking, unable to be the one who walked away with nothing.
  *   **Beat 4:** Connect the game to her career: she didn't study this to judge us, but to map the geometry of being stuck.
  *   **Beat 5:** The turn: Retirement is not quitting the game because you lost, but quitting because you finally own the money you didn't spend.

  ***

  Friends, family, colleagues.

  We all know how the picnic starts. The sun is out, the kids are running, and she pulls out a single dollar bill. She smooths it on the tablecloth. She asks for a bid.

  Someone laughs and says five cents. Someone else says ten. It feels like free money. It feels like a game. But everyone in this room knows the moment the air changes. It happens when the bidding hits one dollar. Logically, the game is over. No one should pay more than a dollar to buy a dollar. But the rules are simple: the highest bidder pays their bid and takes the dollar. The second-highest bidder pays their bid and gets nothing. And in her version, the auctioneer takes nothing; the winner takes the loser's payment too.

  So the prize grows. The pot sweetens with every mistake.

  I remember one year, ten years ago. Two of her brightest students were locked in. They weren't laughing anymore. They were at three dollars. Then four. Then five. They weren't bidding to win a dollar anymore. They were bidding to avoid being the person who paid four dollars for nothing. The room went quiet. You could hear the cicadas. They were trapped in the logic of the thing. To stop was to lose everything they had already spent. To continue was to lose more, but maybe, just maybe, to salvage the pride of being the winner.

  They bid up to ten dollars each. Twenty dollars changing hands for a single George Washington. When it ended, they didn't high-five. They looked at their hands. They looked at her. And she looked back with this terrible, gentle kindness.

  She spent her life studying that look.

  There is a specific pain in realizing you are in a trap of your own making. Most people look at that pain and see stupidity. They see a failure of math. She saw a failure of courage. It takes courage to bid. It takes infinitely more courage to stop bidding when everyone is watching you lose.

  She taught us that escalation isn't about greed. It's about commitment. It's about the story we tell ourselves that says, "I have come this far, I cannot stop now." We say it about grants that aren't working. We say it about projects that are dead. We say it about careers that have stopped fitting us. We stay in the auction because the cost of leaving is immediate and certain, while the cost of staying is only probable.

  But today, the auction ends.

  Retirement looks like stopping. To the part of us that loves the game, it looks like losing. It looks like walking away from the table while the pot is still sweet. It looks like letting someone else take the dollar.

  But here is the difference. In the game, you say, "I cannot stop now." In life, you say, "I can stop now."

  Stopping costs you the game. It costs you the office, the title, the next bid. It costs you the chance to prove you were right about the next year, the next paper, the next fight. It is a heavy price. It is the price of the second-highest bidder who walks away with nothing but their own money still in their pocket.

  She is choosing to pay that price. She is choosing to be the one who stops. She is choosing to keep what she has earned instead of risking it to win what she doesn't need.

  So, we are not here to auction her future. We are not here to bid on her time. We are here to acknowledge that she has won the only round that matters. She is taking the dollar. She is keeping her bid. And she is leaving the table.

  To [Mentor's Name].

