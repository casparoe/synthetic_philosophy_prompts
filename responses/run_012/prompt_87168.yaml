answer: |-
  1. "The readings"

  To understand what "beyond the call of duty" claims, we must separate the dimensions along which the phrase operates. Each dimension offers competing claims about what is happening when the phrase is used.

  First, consider what fixes the baseline. One claim is that the baseline is contractual: the duty is exactly what is written in the job description. A competing claim is that the baseline is normative: it is what a reasonable person in that role would do under normal circumstances. A third claim is that the baseline is moral: it is the minimum required to avoid being a bad person or professional. These are incompatible; if the baseline is the contract, extra work is optional. If the baseline is moral, extra work might be obligatory but simply unrecognized.

  Second, consider the status of the requirement. One claim is that the act is not required at all; you have no obligation to do it. A second claim is that the act is required but not enforceable; you ought to do it, but no one can punish you for omitting it. A third claim is that the act is required and enforceable, but the phrase merely comments on the character of the agent, marking them as virtuous rather than compliant. These readings conflict on whether omitting the act is a violation of a rule.

  Third, consider variability. One claim is that the line is universal; what is beyond duty for me is beyond duty for you. A opposing claim is that the line shifts with ability and cost; if fixing the bug is easy for a senior engineer, it is their duty, but beyond duty for a junior. This reading suggests the phrase masks an assessment of cost rather than principle.

  Fourth, consider blameworthiness. One claim is that omitting the act is not blameworthy; you are not wrong to skip it. A competing claim is that omitting it is disappointing but permissible. A stronger claim is that omitting it is blameworthy, but the phrase is used to soften the blow of admitting we expect too much. This reading suggests the phrase is a lie told to maintain morale.

  Fifth, consider the value of the act. One claim is that the act is morally better than what is required; it adds positive value to the world. A deflationary claim is that the act is only costlier to the agent; it is not "better," merely more expensive in terms of time or stress. This distinguishes between genuine virtue and mere sacrifice.

  Finally, consider stability. One claim presupposes the baseline is stable; praising an act does not change what is required tomorrow. A competing claim is that the baseline is dynamic; praising an act today turns it into the expectation for tomorrow, making the phrase self-defeating. If praise shifts the baseline, then nothing can remain beyond the call of duty for long. These last two are incompatible: you cannot claim an act is permanently beyond duty while also using praise that incentivizes others to do it, thereby normalizing it.

  2. "Verdicts"

  Several readings are trivial or false. The claim that the baseline is strictly the job description is false; professional roles evolve implicitly. The claim that the act is required but unenforceable is trivial; it merely renames "expectation" as "duty." The claim that omitting the act is blameworthy but we pretend otherwise is defensible but cynical; it treats the phrase as propaganda.

  The substantive and defensible reading is the concept of the **supererogatory**. In ethics, an act is supererogatory if it is good to do but not wrong to omit. This reading allows the phrase to praise an act (it is good) and deny it is required (it is not wrong to skip it) without contradiction. It posits a category of action above the minimum moral requirement.

  However, a contradiction bites if you mix categories. If "duty" means "what the employer can demand," then saying an act is beyond duty but praising it creates tension: why praise what cannot be demanded? If the employer praises it, they signal they want it done. If they want it done, it becomes part of the role. The contradiction lies in trying to maintain a permanent category of "optional excellence" within a system that rewards excellence with expectation. The supererogatory reading works morally, but fails organizationally, where praise functions as a signal for future requirements.

  3. "What each occasion needed"

  The post-incident praise plausibly expresses the supererogatory reading. It acknowledges the engineer did something good that was not strictly owed, preserving their right to have spent the weekend with family instead. It validates the sacrifice without establishing it as a precedent.

  The manager's objection, however, needs the "unenforceable" reading. They argue that because the act is beyond duty, it cannot be required. This conclusion does not follow from the phrase alone. "Beyond duty" means "not obligatory," not "cannot be made obligatory." To conclude we cannot require it, the manager needs a separate premise: either that requiring it would be unreasonable (too costly), or that requiring it would destroy the voluntary spirit that makes the act valuable. The phrase masks this premise. It smuggles in a claim about capacity or retention under the guise of moral categorization. The manager is actually arguing about sustainable workload, but using moral language to shut down the proposal.

  4. "Bottom line for the postmortem proposal"

  The phrase is doing no real logical work in that argument; it is a conversation stopper. It hides the actual constraint, which is likely about capacity or fairness. For the manager's argument to go through, you would have to concede that requiring the postmortem imposes an unreasonable cost on engineers relative to the value gained. Do not argue about the definition of duty. Instead, ask: "What is the specific burden this requirement places on the on-call engineer, and is that burden sustainable for everyone, not just the best?" Shift the debate from moral categories to resource allocation.
