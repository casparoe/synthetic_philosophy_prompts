answer: |-
  The interface hummed, a low-frequency vibration that Silas felt in his teeth rather than heard. On the screen, two protocols glowed against the dark background of the Optima Clinic's server room. Protocol A was labeled *Incentive Integration*. Protocol B was *Baseline Attenuation*.

  Across the desk, Mr. Vane tapped his fingers on the armrest of his chair. The rhythm was erratic, a staccato beat of impatience. Vane was a successful man, by most metrics, yet his biometric readout scrolling in the corner of Silas's monitor showed a jagged line of cortisol spikes and dopamine troughs. He was agitated. He was wanting.

  "I want to feel the win, Silas," Vane said, leaning forward. The leather of his chair creaked. "You said this program optimizes well-being. To me, that means highs. I want to set a goal, chase it, and feel the rush when I catch it. That's what being alive is."

  Silas kept his eyes on the screen. He understood the request. It was the standard hedonic calculus. Create a deficit—a want—then fill it. The filling produced a spike in neurochemical activity that patients described as joy, pride, or satisfaction. Protocol A would structure Vane's coming month around achievable challenges. It would manufacture cravings for closure, for recognition, for completion, and then provide the means to satisfy them.

  But Silas also watched the second metric, the one the clinic's founders called the *Quiet Index*. It measured the absence of disturbance. According to the underlying model of Tranquilism that governed the clinic's deepest algorithms, the spike of satisfaction was not a positive addition to Vane's life. It was merely the cessation of the negative state of craving. The value of a life was exhausted by the absence of suffering and the absence of want. Pleasure was zero. Craving was negative.

  If Vane never wanted the promotion, the applause, or the finished project, he would not suffer the lack of them. A life without the hunger was superior to a life with the hunger and the meal, because the meal added nothing to the balance sheet, while the hunger subtracted from it.

  "Protocol A," Vane said, his voice tightening. "That's what I'm signing up for. I want to want things."

  Silas hovered his cursor over Protocol B. Attenuation would dampen the neural pathways associated with goal-seeking behavior. It wouldn't make Vane depressed; it would make him content with the status quo. The jagged line on the monitor would flatten. Vane would stop tapping his fingers. He would sit in the chair without needing to be anywhere else. He would feel no rush of victory, because he would feel no sting of potential defeat.

  But there was the complication. Vane currently *wanted* Protocol A. He was craving the optimization of his desires. To impose Protocol B was to frustrate a current, active craving. It would cause immediate distress, a spike of confusion and resistance. To impose Protocol A was to validate the mechanism of craving itself, ensuring future dips in the baseline.

  Silas felt a tightness in his own chest. He wanted to choose correctly. He wanted to fix Vane. He recognized the sensation for what it was: a craving for professional efficacy, a desire for the patient to be 'saved.' It was a disturbance in his own Quiet Index. If he truly adhered to the logic of the screen, he should not want to fix Vane at all. He should accept Vane's agitation as data, neither good nor bad, though the agitation itself was negative for Vane.

  "The data suggests," Silas said, his voice even, "that reducing the amplitude of your goal-seeking behavior will lower your overall stress markers."

  "I don't care about stress markers," Vane snapped. "I care about feeling something. If I'm just flatlined, what's the point? I might as well be asleep."

  "If you are asleep, you do not suffer the lack of wakefulness," Silas said. He hadn't meant to say it. It sounded too much like the doctrine.

  Vane laughed, a short, dry sound. "That's not living. That's existing. I'm paying you to help me live."

  Silas looked at his own hands. They were still. He had trained himself to minimize movement, to reduce the friction of intention. But now, the decision lay in the tension of his index finger.

  If he clicked Protocol A, he gave Vane what he asked for. He honored the current craving. But he condemned Vane to the cycle: the ache of the want, the brief relief of the have, the return of the ache. The relief was not a gift; it was merely the end of a penalty.

  If he clicked Protocol B, he protected Vane's future baseline. He prevented future cravings from arising. But he had to inflict a present craving—the desire for Protocol A—to do it. He would have to break the patient's will to save him from his wants. And in doing so, Silas would be acting on his own want to save him.

  The paradox sat heavy in the room. The only way to achieve the state of no-craving was to want it enough to pursue it. But wanting it violated the state.

  Vane stopped tapping his fingers. He watched Silas, his eyes bright with a hunger that Silas knew was fundamentally a form of pain. "Well?" Vane asked. "Are you going to help me get what I want, or not?"

  Silas looked at the Quiet Index. It was rising, ticking upward with his own hesitation. His uncertainty was a craving for certainty. Vane's impatience was a craving for resolution. The hum of the server seemed to grow louder, filling the silence between them.

  He moved the cursor. It hovered over the green button of Protocol A, the path of satisfaction. Then he drifted it left, toward the blue button of Protocol B, the path of absence.

  Vane leaned in, holding his breath. He wanted the choice to be made. He wanted the outcome.

  Silas realized that whatever he chose, he would be feeding a hunger. Either the hunger for achievement, or the hunger for peace. There was no move that did not originate in a lack.

  He pressed the key.
