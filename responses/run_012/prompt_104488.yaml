prompt: |-
  You are a political philosopher who works on property theory, the philosophy of law, and urban politics. Think carefully and systematically before answering, and do not settle for the first framing that comes to mind. I want you to reconstruct the implicit theory behind a set of land-use practices, so I will describe what my city actually does.

  First, the large majority of residentially zoned land is reserved for detached single-family houses; apartments are permitted only along a few corridors and in a few designated centers. Second, a project that satisfies every numerical standard in the code can still be denied by the planning commission, which is required to consider whether the proposal is compatible with the scale and character of the surrounding neighborhood; the commission's judgment on that question is treated as discretionary rather than as a finding of fact. Third, new buildings must supply a minimum number of off-street parking spaces. Fourth, and this is the part I cannot square with the rest: a use that was lawful when it was built but that the code no longer permits — a corner store, a small apartment building, a workshop — may be forced to close or convert after a set period, sometimes ten or twenty years, although its owner has done nothing wrong and the use harms no one. Meanwhile the expectations of the people living nearby — quiet, being able to park on their own street, living among buildings that look like the ones already there — are treated as weighty enough to justify refusing a permit outright, and nothing ever expires those expectations.

  Please address the following.

  1. What conception of property does this package presuppose — a bundle of severable rights, a thing owned, a grant from a political community, a relation among persons? What conception of the city, and of who has standing to shape it? Does it presuppose something like the claim, associated with Henri Lefebvre, that inhabitants have a right to the city, or does it presuppose the opposite: that the city is a joint venture whose terms are fixed by those who arrived first?

  2. Separate what the practices strictly require from what they merely fit comfortably. Could a Lockean, a utilitarian, a republican about non-domination, and a Lefebvrian each endorse this package, or must each reject some part of it? Where are the practices philosophically underdetermined, such that several incompatible theories would license them?

  3. The asymmetry between uses that expire and neighborhood expectations that never do: is it coherent? Is there a principled distinction available — harm versus mere displeasure, reliance, consent, the generality of the rule, the difference between a use and an expectation, the difference between what one owns and what one merely benefits from? Or is this a hierarchy of political power wearing the costume of doctrine?

  4. If the presupposed view were replaced by a rival, what would change on the ground? Name what a planner would stop doing and what she would start doing.

  Open with a brief brainstorming section listing the candidate theories and flagging which you expect to survive scrutiny, then write the analysis itself in continuous prose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Political Philosopher specializing in property theory, philosophy of law, and urban politics.
      *   **Task:** Reconstruct the implicit theory behind a specific set of land-use practices described by the user.
      *   **Input Data:**
          1.  Exclusionary zoning (mostly single-family detached).
          2.  Discretionary review (compatibility with "character" overrides numerical compliance).
          3.  Mandatory parking minimums.
          4.  *Crucial Asymmetry:* Non-conforming uses (legal when built) must eventually cease/convert (amortization), while neighborhood expectations (quiet, parking, aesthetic homogeneity) are treated as permanent rights that can block new development.
      *   **Required Output Structure:**
          1.  Brief brainstorming section (candidate theories, survival flags).
          2.  Continuous prose analysis addressing four specific questions:
              *   Conception of property/city/standing (Lefebvre vs. Joint Venture).
              *   Compatibility with specific philosophical frameworks (Lockean, Utilitarian, Republican, Lefebvrian).
              *   Coherence of the asymmetry (expiring uses vs. permanent expectations).
              *   Practical implications of replacing the theory (what planners stop/start doing).
      *   **Tone/Style:** Careful, systematic, not settling for the first framing, philosophical depth.

  2.  **Deconstruct the Input Data (The "Phenomena"):**
      *   *Single-family zoning:* Exclusionary, preserves low density, protects asset value, limits supply.
      *   *Discretionary "Character" Review:* Subjective, empowers incumbents, treats aesthetics/social fabric as property interests.
      *   *Parking Minimums:* Mandates car dependency, treats public street capacity as a private entitlement for residents/guests.
      *   *Amortization of Non-Conforming Uses:* The state can extinguish a vested property right (the business/use) over time without compensation, ostensibly for the public good.
      *   *Permanence of Neighborhood Expectations:* Incumbent residents' desires (quiet, parking, sameness) are treated as vested rights that *do not* expire and can veto new entry.

  3.  **Brainstorming Candidate Theories (Section 1):**
      *   *Libertarian/Lockean:* Strong private property rights. *Problem:* Amortization violates vested rights. Discretionary review violates rule of law/predictability. *Verdict:* Unlikely to endorse the whole package, maybe just the zoning as exclusion.
      *   *Utilitarian:* Maximize welfare. *Problem:* Exclusionary zoning likely reduces aggregate welfare (housing shortages). Amortization might be justified if public gain > private loss, but permanent expectations might stifle growth. *Verdict:* Mixed/Underdetermined.
      *   *Civic Republican:* Focus on community character, non-domination. *Problem:* Does "character" protect against domination or enable it by incumbents? *Verdict:* Could justify the "character" aspect, but maybe not the economic exclusion.
      *   *Lefebvrian (Right to the City)::* Inhabitants shape the city. *Problem:* This system privileges *existing* inhabitants against *new* ones. It's a "Right to the *Existing* City." *Verdict:* Opposite of Lefebvre.
      *   *Status Quo/Incumbency Theory:* The city as a club good. Property as a share in a local corporation. *Verdict:* Strongest fit.
      *   *Nuisance/Police Power:* State protects health/safety/welfare. *Verdict:* Explains amortization, but struggles with the "character" subjectivity.

  4.  **Drafting the Analysis - Section by Section:**

      *   **Question 1: Conception of Property & City.**
          *   *Property:* It's not a "thing" (Blackstone) because the state can erase the use (amortization). It's not a pure "bundle of rights" because some rights (expectations) are stronger than others (actual uses). It looks like a *grant from the political community* that is conditional on conformity.
          *   *City:* It's a "Joint Venture" fixed by early arrivals. It treats the neighborhood as a club good.
          *   *Standing:* Incumbents have standing; outsiders do not. It is anti-Lefebvrian. Lefebvre argues for the *oeuvre* (creative participation) of all inhabitants. This system argues for the *preservation* of the *product* by current owners.

      *   **Question 2: Philosophical Compatibility (Lockean, Utilitarian, Republican, Lefebvrian).**
          *   *Lockean:* Would reject amortization (taking without compensation) and discretionary review (rule of law violation). Would like single-family zoning if seen as protecting homestead. *Result:* Must reject amortization/discretion.
          *   *Utilitarian:* Could justify amortization (greater good). Could justify parking/zoning if externalities outweigh housing shortage (empirically dubious but theoretically possible). *Result:* Underdetermined. Depends on empirical claims.
          *   *Republican (Non-domination):* Discretionary power is arbitrary = domination. But "character" could be seen as protecting community self-rule. *Result:* Tension. Discretion is problematic.
          *   *Lefebvrian:* Would reject the exclusion. The "Right to the City" is about centrality and participation for *all*, not freezing the status quo. *Result:* Must reject exclusion/permanence of expectations.
          *   *Underdetermination:* The "Police Power" justification fits almost everything except the asymmetry.

      *   **Question 3: The Asymmetry (Expiring Uses vs. Permanent Expectations).**
          *   *Is it coherent?* Legally, yes (non-conforming uses vs. police power). Philosophically? It treats *active* property rights as weaker than *passive* psychological expectations.
          *   *Principled Distinction?*
              *   *Harm vs. Displeasure:* The system treats "change" as the harm, not the specific use.
              *   *Reliance:* Both rely on the status quo. Why is one protected and the other not?
              *   *Generality:* The rule applies to all non-conforming uses, but the "character" protection applies only to those with political voice.
              *   *Conclusion:* It is a hierarchy of power. It privileges the *status quo* of the politically dominant class (homeowners) over the *vested rights* of the economically vulnerable (small business/rental owners). It treats "character" as a public good that trumps private rights, but treats "property value" as a private right that trumps public need for housing.

      *   **Question 4: Replacing the Theory.**
          *   *Rival Theory:* Property as a social relation / Right to the City / YIMBYism as Justice.
          *   *Planner Actions:*
              *   *Stop:* Discretionary review based on "character." Amortization of harmless uses. Parking minimums.
              *   *Start:* As-of-right zoning (if it meets code, it's built). Upzoning everywhere (not just corridors). Treating housing as a right. Compensating for non-conforming use termination.

  5.  **Refining and Polishing:**
      *   *Tone Check:* Ensure I sound like a political philosopher (precise terms, referencing concepts like "vested rights," "police power," "club goods").
      *   *Constraint Check:* Did I answer all four prompts? Yes. Did I start with brainstorming? Yes. Is the main text continuous prose? Yes.
      *   *Deep Dive on the Asymmetry:* This is the crux. I need to highlight that "expectations" are being reified into property rights while actual "uses" are being degraded to privileges. This suggests a theory of *Property as Status* rather than *Property as Liberty*.
      *   *Lefebvre Nuance:* Be careful not to caricature Lefebvre. It's about *appropriation* vs. *domination*. The current system is appropriation by the incumbents.
      *   *Lockean Nuance:* Lockean labor mixing might support the builder of the corner store more than the neighbor who just "expects" quiet.

  6.  **Final Review against the Prompt:**
      *   "Think carefully and systematically... do not settle for the first framing." -> I need to make sure I don't just say "This is NIMBYism." I need to dig into the *jurisprudence* of it.
      *   "Reconstruct the implicit theory." -> I need to name it. Let's call it "Incumbent Trusteeship" or "Municipal Corporatism."
      *   "Continuous prose." -> Ensure smooth transitions between the four points in the main body.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Brainstorming:* List Lockean, Utilitarian, Republican, Lefebvrian, Civic Humanist, Economic Club Theory. Flag Club Theory as the "survivor."
      *   *Prose:* Start with the nature of property. It's a franchise. Move to the philosophical guests. Show where they break. Tackle the asymmetry as the reveal of power dynamics. End with the practical shift.

      *(Self-Correction during drafting)*: I initially thought about calling it "Libertarian." But libertarians hate discretionary review and amortization. So it's not Libertarian. It's more like "Progressive Era Zoning" mixed with "Homeowner Corporatism." I should focus on the *Police Power* justification being stretched to cover aesthetic preferences.

      *Refining the Asymmetry:* The key is that the "use" is a private act, while the "expectation" is framed as a public interest (neighborhood character). The theory assumes the neighborhood *is* the single-family home, so anything else is a deviation that must be cured, while the single-family home is the baseline that cannot be cured/changed.

      *Final Polish:* Ensure the distinction between "Right to the City" and "Right to the *Suburb*" is clear.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Brainstorming Candidate Theories

  *   **Blackstonian Liberalism (Property as Dominion):** *Status:* **Rejected.** This view treats property as absolute dominion over a thing. It cannot explain amortization (extinguishing a lawful use without compensation) or discretionary review (subjective veto power over owned land).
  *   **Lockean Labor-Desert:** *Status:* **Partial Fit/Rejected.** Supports the corner store owner (mixing labor/capital) more than the passive neighbor. However, it might support single-family zoning as protecting the "homestead." Fails to justify the asymmetry where expectations trump vested uses.
  *   **Utilitarianism (Aggregate Welfare):** *Status:* **Underdetermined.** Could justify amortization if public gain outweighs private loss. Could justify exclusion if local stability creates more utility than housing supply. Lacks a principled reason for the asymmetry other than crude majoritarianism.
  *   **Civic Republicanism (Non-Domination):** *Status:* **Tension.** Discretionary power is inherently arbitrary, suggesting domination of the applicant by the commission. However, if "neighborhood character" is viewed as a shared civic good, it might justify protection. Struggles with the exclusionary nature.
  *   **Lefebvrian "Right to the City":** *Status:* **Opposite.** Lefebvre argues for the right of inhabitants to *produce* urban space. This system reserves the right to produce space for the *past* (incumbents) and denies it to the *present/future* (newcomers/developers).
  *   **Municipal Corporatism / Incumbent Trusteeship:** *Status:* **Survivor.** Views the neighborhood as a closed corporation or club. Property is a share in the corporation. The "charter" is the zoning code, but the "shareholders" (current residents) have veto rights over new issuances of stock (new housing/uses). Amortization is the corporation buying out non-compliant assets to streamline operations.

  ***

  ### Analysis of Implicit Land-Use Theory

  The package of practices you describe reveals a conception of property that is neither a simple "thing" owned by an individual nor a universal "bundle of rights" applicable to all. Instead, it presupposes property as a **franchise granted by a political community, conditional on conformity to a static ideal.** In this view, the city is not an open organism but a **joint venture fixed by those who arrived first.** This is not Henri Lefebvre's "Right to the City," which demands that all inhabitants participate in the ongoing production of urban space. Rather, it is a "Right to the *Existing* City," a claim that the current configuration of social and physical relations possesses a normative weight that supersedes the rights of new entrants or even the vested rights of current owners who deviate from the norm. The standing to shape the city is allocated not by citizenship or need, but by **incumbency**. The implicit theory treats the neighborhood as a club good where the primary asset being protected is not the physical structure itself, but the *exchange value* and *social exclusivity* guaranteed by the zoning covenant. When the planning commission denies a project based on "character," it is enforcing the terms of the club membership. When it amortizes a non-conforming use, it is exercising the club's right to purge assets that no longer fit the brand, treating the business owner not as a rights-bearer but as a temporary licensee whose permission has lapsed.

  When we subject this package to scrutiny through specific philosophical frameworks, we find that the practices are philosophically underdetermined, allowing incompatible theories to coexist uneasily, though each must reject core elements upon rigorous inspection. A **Lockean** would find the system incoherent; while they might endorse single-family zoning as protecting the homestead, they would vehemently oppose the amortization of lawful uses as a taking without just compensation, and they would view discretionary "character" review as a violation of the rule of law, rendering property rights unpredictable. A **Utilitarian** could theoretically endorse the entire package, but only by accepting empirical claims that are increasingly contested: that the stability of incumbent expectations produces more aggregate welfare than the housing or services denied, and that the loss to the corner store owner is outweighed by the aesthetic pleasure of the neighbors. The system is most comfortable with a **Civic Republican** view, provided one defines the "civic good" narrowly as the preservation of local community cohesion; however, a Republican concerned with *non-domination* would recoil at the discretionary power of the planning commission, which subjects applicants to the arbitrary will of officials without clear standards. Finally, a **Lefebvrian** must reject the package entirely. For Lefebvre, the city is an *oeuvre*, a collective work to be created by those who live in it. This system treats the city as a *product* to be consumed and preserved by a specific class. The only theory that fits the package comfortably is the **Municipal Corporatism** identified earlier, which views property rights as subordinate to the collective interest of the local shareholder body. The practices are underdetermined only insofar as "public welfare" is vague enough to cover both utilitarian calculation and corporatist exclusion, but the tension remains: the system uses the language of public good (zoning) to enforce private privilege (exclusion).

  The asymmetry between expiring uses and permanent expectations is the linchpin of this theory, and while it is legally coherent within American police power jurisprudence, it is philosophically precarious. There is no principled distinction based on harm, reliance, or consent that justifies treating a business owner's vested right as ephemeral while treating a neighbor's expectation of parking or sameness as perpetual. Both parties rely on the status quo: the store owner relies on the continued operation of their livelihood, and the resident relies on the continued absence of density. If the distinction were based on **harm**, the system would need to prove the store causes objective damage, yet you note it "harms no one." If based on **generality**, the rule applies to all non-conforming uses, but the "character" standard is applied selectively to protect specific incumbents. The distinction is ultimately one of **political ontology**: the system posits that the *neighborhood* is the primary rights-bearing entity, not the individuals within it. The "expectation" of the neighborhood is reified into a property right of the collective, whereas the "use" of the individual is treated as a mere privilege. This is not a hierarchy of doctrine but a hierarchy of power wearing the costume of law. It privileges the passive consumption of space (living quietly) over the active production of space (running a business or building housing). It asserts that the right to *exclude* change is superior to the right to *initiate* activity. This creates a one-way ratchet where the city can freeze in time, protecting the psychological investments of homeowners (who often hold the most political power) while liquidating the physical investments of smaller, often less politically connected, property holders.

  If this presupposed view of Municipal Corporatism were replaced by a rival theory, such as a **Lefebvrian Right to the City** or a **Liberal Egalitarian** view of housing as a primary good, the planner's daily praxis would invert. Under a rival theory, the planner would **stop** treating "neighborhood character" as a valid ground for denial, recognizing it as a euphemism for exclusionary status protection. She would **stop** the amortization of non-conforming uses that do not generate negative externalities, recognizing vested economic activity as a right that cannot be extinguished without compensation simply to achieve aesthetic conformity. She would **stop** mandating parking minimums, understanding that street space is a public resource that should not be privatized for car storage at the expense of housing affordability. Conversely, she would **start** treating zoning compliance as "as-of-right," meaning if a project meets numerical standards, it must be approved, removing discretionary veto power. She would **start** upzoning residential land by default, treating the capacity to house people as a baseline entitlement rather than a special exception. Finally, she would **start** viewing the "public interest" as inclusive of the needs of non-residents and future inhabitants, shifting the standing to shape the city from the incumbent shareholders to the broader citizenry. The planner would move from being a guardian of a static museum to a facilitator of dynamic urban production.
