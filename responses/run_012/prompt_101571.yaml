      *   (2) vs. (3): (2) says 1 death loss = 5 deaths loss (collectively). (3) says more total life-years is better. If 1 person loses 50 years, is that worse than 5 people losing 10 years each? (3) says 50 QALYs = 50 QALYs. (2) implies a non-aggregative view of loss.
