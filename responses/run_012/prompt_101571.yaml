          *   *Severity:* Low. This is standard non-consequentialist doctrine.

  5.  **Ranking the Tensions:**

      1.  **(2) vs. (1) & (3):** The definition of "loss" in (2) directly contradicts the rationale for (1) and (3). If the loss is equal, why maximize? This is the "Taurek Problem."
      2.  **(2) vs. (3):** Specifically, the move from individual rescue to policy. If 1 death isn't less bad than 5, why is 100 QALYs better than 50 QALYs?
      3.  **(5) vs. (1)/(3):** Partiality vs. Maximization. Manageable via agent-relative permissions.
      4.  **(4) vs. (1):** Doing vs. Allowing. Standard distinction, low tension.

  6.  **Developing the "Cheapest Repair" for each:**

      *   *For (2) vs (1):* Change (2). Admit that 5 deaths is a greater *total* loss, even if individual value is equal.
      *   *For (2) vs (3):* Contextualize. (2) applies to "complaints" or "claims" in rescue; (3) applies to ex-ante policy.
      *   *For (5) vs (1):* Specify scope. (1) applies to strangers; (5) applies to special obligations.

