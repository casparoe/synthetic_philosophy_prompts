      *   (3) *Health Care Allocation (Aggregation):* Follow aggregate cost-effectiveness (QALYs). More total life-years is better. This is utilitarian/aggregative.
      *   (4) *Constraint against Killing:* Do not kill 1 to save 5 (Deontological constraint).
      *   (5) *Partiality:* Save own child over 2 strangers. No difference in intrinsic value.

