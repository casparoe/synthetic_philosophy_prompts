          *   *Repair:* Distinguish contexts (Ideal vs. Non-ideal, or Rescue vs. Policy). This is a common move (e.g., Scanlon).

      *   **Tension C: Partiality (5) vs. Impartial Aggregation (1) & (3).**
          *   *Claim (5):* Save child over 2 strangers.
