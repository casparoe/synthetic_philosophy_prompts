answer: |-
  **The Case**

  Silas slammed the door while his son's hand was still in the jamb, knowing the break would follow, because **he wanted the boy to hurt** [Version A: Intent] / **he wanted the five dollars** [Version B: Foreseen]. He did not hesitate, nor did he look back at the cry that rose behind him, but walked instead to the register to claim the discount for early closure, leaving the boy weeping on the threshold of a house that was now secure, warm, and five dollars richer.

  ***

  **Diagnostics**

  **1. What each framing invites the reader to infer**
  *   **Version A (Intent):** The reader infers *malice*. Silas's action is an end in itself; the harm is the goal. The blame rests on active hostility.
  *   **Version B (Foreseen):** The reader infers *callous commodification*. Silas's action is a means to a trivial end; the harm is a cost of doing business. The blame rests on the valuation of the son's integrity as less than five dollars.

  **2. The one feature doing the pumping**
  The **disproportionate ratio of gain to harm**. In Version B, the triviality of the motive ("five dollars") amplifies the perceived indifference. It forces the reader to conclude that the character's disregard for the harm is so absolute that it functionally equates to malice. The pump works not by changing the act, but by making the justification for the act so pathetically small that the indifference appears monstrous.

  **3. What becomes of the effect if that feature is stripped out**
  If you hold the act and consequences identical but change the motive to something substantial (e.g., "because he wanted to save the house from fire"), the blame in the foreseen version collapses. The reader immediately accepts the Doctrine of Double Effect: the harm is regrettable but justified by the significant gain. The intuition pump fails because the ratio of gain to harm no longer signals moral bankruptcy.

  **4. The strongest case that the blame is warranted (not an artifact of framing)**
  The blame is warranted because moral responsibility tracks the **quality of will** rather than the taxonomy of intent. In both versions, Silas treats his son merely as a means to an end rather than as an end in himself. In Version A, the son is a vessel for pain; in Version B, he is an obstacle to savings. In both cases, the agent demonstrates a complete absence of regard for the victim's moral status. If blame attaches to the failure to recognize another's humanity, then cold indifference for a trivial gain is morally indistinguishable from hot malice; both reveal a will that is equally opposed to the good.
