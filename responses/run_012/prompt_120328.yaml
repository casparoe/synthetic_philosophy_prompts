  **Q: Why did the "Cancel" button change color?**
  A: We updated the palette to reduce visual aggression. Primary actions now use high-contrast hues to assist users in making confident choices quickly.

  **Q: Is this manipulation?**
  A: Manipulation implies bypassing agency. We provide all necessary information; we simply curate the presentation order to reduce cognitive load. Users retain the ability to scroll past or ignore prompts.

  **Q: You're showing true things, but in a specific order to provoke a reaction.**
  A: Truthfulness is maintained. The sequence of information is designed to help users recognize value they might otherwise overlook due to distraction. Framing is a standard component of communication.

