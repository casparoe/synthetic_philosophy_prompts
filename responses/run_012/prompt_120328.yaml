  A: Coercion involves threats or force. Our interstitials are dismissible after a 15-second countdown. The friction is intended to protect users from impulsive decisions they may regret, similar to a cooling-off period on financial transactions.

  **Q: Did users consent to this?**
  A: Yes. Acceptance of the Terms of Service includes authorization for engagement optimization. The consent toggle was present in the v4.3 onboarding flow. If not selected, default parameters apply to ensure service functionality.

