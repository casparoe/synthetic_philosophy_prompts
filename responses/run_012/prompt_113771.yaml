prompt: |-
  Hi — I'm a fourth-year philosophy student in a seminar on death, meaning, and the value of the future. We spent three weeks on Scheffler's afterlife conjecture and I can definately recite it back (the doomsday scenario, the infertility scenario, the thought that we treat the survival of humanity as a kind of collective afterlife) but I still couldn't tell you what work the conjecture is actually doing, and I don't think I'm alone — half the seminar would just write out the two scenarios and then say "so extinction is bad in a way that isn't about deaths." Every term we write a mock final and grade each other's answers, and I've been handed the extinction question to draft. So: act as an expert on the philosophy of death and on the value of humanity's long-term survival, think carefully before you write anything — start by setting out in your own words what the conjecture asserts and, just as importantly, what it doesn't — and then give me three things: (1) the essay question itself, something a strong student could answer in about an hour of writing; (2) a model answer of roughly 700 words; (3) a marking scheme built on five must-hit points worth 20 marks total, with a one-line note for each on how candidates typically miss it. No citations and no reading list — it's a closed-book mock, and the question should stand on its own argument.

  Here's the crux I want it to turn on, and please tell me if I've got this wrong or if the question I end up with doesn't actually reach it. If the conjecture is right, then our projects and attachments would lose their point if we knew humanity had no future — but does that give us a reason to *prevent* extinction, or does it only tell us something about how the last people standing would feel? Those two seem to come apart. And then: why humanity? I made up a case to press on it — a large, self-governing settlement on Mars cuts off all contact with Earth, flourishes indefinitely, and neither remembers nor cares about the place it came from; meanwhile everyone left on Earth will be gone within a century. If the Martians' endless future keeps Earth's projects meaningful, then the conjecture is really about the continuation of some collective or other and "humanity" is doing no work; if it doesn't, then tell me where the line falls and why it isn't arbitrary. I'd like the question to make candidates run both horns of that, and then say what the conjecture can and can't do for the verdict on extinction — including whether, if it's a claim about what we would think or feel, it can be a claim about what's bad at all.

  A few more constraints: state anything the candidate needs from Scheffler inside the question itself, since people misremember the details and I don't want this to test recall; keep the question short enough that it doesn't do the candidate's thinking for them — the Mars case and the two horns should be the difficulty, not a word count; and make the marking scheme genuinely discriminating, so I can tell which seperate move divides a 17 from a 12 rather than "shows understanding of the conjecture." Also, the model answer should be honest where the argument runs out — if the best answer is that the conjecture can't do the job people want it to, I'd alot rather see that than a tidy resolution.
