answer: |-
  ### Essay Question

  **Scheffler's Afterlife Conjecture states that the continued existence of humanity after our own deaths is a precondition for us finding meaning in many of our current activities. He supports this with two thought experiments: the 'Doomsday' scenario (humanity ends shortly after your death) and the 'Infertility' scenario (no new humans are born). In both, Scheffler argues we would feel demoralized and our projects would seem pointless.**

  **Consider a variation: A self-governing settlement on Mars cuts all contact with Earth, flourishes indefinitely, and neither remembers nor cares about Earth. Meanwhile, everyone on Earth will be dead within a century due to extinction.**

  **Does the Afterlife Conjecture give us a normative reason to prevent Earth's extinction, or does it merely describe a psychological dependency? Furthermore, does the Mars colony's survival preserve the meaning of Earth's projects? Use these questions to evaluate whether the Conjecture establishes that extinction is objectively bad, or only that we are contingently attached to 'humanity' specifically.**

  ***

  ### Model Answer

  The Afterlife Conjecture posits a dependency claim: the value of our present lives depends on the existence of future others. However, establishing this dependency does not automatically generate a normative reason to prevent extinction, nor does it clarify why "humanity" specifically is the required object of survival. To evaluate the Conjecture's work, we must separate the psychological explanation of meaning from the justification of value, and test the scope of the "collective afterlife" against the Mars scenario.

  First, there is a gap between the Conjecture's descriptive claim and a normative conclusion. Scheffler argues that if we knew humanity would end, we would lose interest in our projects. This explains *why* we care about the future, but it does not prove we *ought* to care. If the loss of meaning is merely a psychological reaction to the Doomsday scenario, it suggests that extinction is bad *for us* in the sense that it undermines our subjective engagement. However, this does not establish that extinction is objectively bad or that we have a duty to prevent it. A skeptic could argue that our demoralization is an irrational attachment, similar to believing the sun revolves around the earth. If the Conjecture only reveals a contingent psychological fact about human valuers, it cannot ground a moral obligation to ensure survival. It tells us what we would feel, not what we should do. To move from "we would feel demoralized" to "extinction is bad" requires an additional premise that our current judgments about meaning are reliable guides to value, which the Conjecture itself does not supply.

  Second, the Mars scenario challenges the scope of the Conjecture. If the Mars colony flourishes indefinitely, does Earth's work retain meaning? If the answer is yes, then the Conjecture is not about "humanity" in a biological or historical sense, but about the continuation of *any* valuing community. This reduces "humanity" to a placeholder for "conscious successors," making the specific survival of Earthlings arbitrary. However, if the answer is no—if Earth's projects lose meaning because the Martians are disconnected—then the Conjecture relies on a specific continuity of identity or relationship. This creates a tension. If meaning requires specific biological or cultural continuity, the Conjecture risks conservatism: it privileges our specific group over equally valuable future beings. If meaning requires only *some* future valuers, then Earth's extinction is less significant provided the Martians survive.

  This leads to the central limitation of the Conjecture. It successfully identifies that our meaning is socially and temporally extended; we are not isolated valuers. However, it cannot resolve whether the value lies in the *content* of the future or the *connection* to it. If the Martians live well but forget us, our connection is severed. If the Conjecture implies this severs meaning, it suggests our projects are not valuable in themselves, but only as contributions to a specific lineage. This makes the verdict on extinction ambiguous. The Conjecture shows extinction would be experienced as a loss of meaning by the last generation. But it does not prove that preventing extinction is required to preserve value independent of our psychological attachments.

  Ultimately, the Conjecture explains the stakes of extinction for human psychology but fails to justify the priority of human survival over other outcomes. It reveals that we treat humanity's survival as a collective afterlife, but it remains silent on whether this treatment is rational or merely inevitable. Therefore, the Conjecture cannot alone sustain the verdict that extinction is objectively bad; it only confirms that, for us, it would feel like the end of value. Whether that feeling tracks truth or merely bias remains unanswered.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Distinction between Dependency and Normativity (4 marks)**
  *   **Requirement:** Candidate must distinguish between the claim that meaning *depends* on the future (descriptive/psychological) and the claim that we have a *reason* to ensure that future (normative).
  *   **Common Miss:** Candidates conflate "we would feel demoralized" with "it is wrong to let humanity end," treating the psychological reaction as a moral proof.

  **2. Analysis of the "Is-Ought" Gap (4 marks)**
  *   **Requirement:** Candidate must articulate that the Conjecture explains our current valuing structure but does not validate it against skepticism (i.e., our attachment could be irrational).
  *   **Common Miss:** Candidates assume Scheffler's conclusion (extinction is bad) follows directly from the premises without noting the need for an additional premise validating our intuitions.

  **3. Evaluation of the Mars Successor Case (4 marks)**
  *   **Requirement:** Candidate must analyze whether the Mars colony counts as a sufficient "afterlife" to preserve Earth's meaning, addressing the continuity vs. mere existence distinction.
  *   **Common Miss:** Candidates ignore the "no contact/no care" constraint, assuming any future humans automatically preserve Earth's meaning regardless of relationship.

  **4. Identification of the Arbitrariness Objection (4 marks)**
  *   **Requirement:** Candidate must explain the tension: if Martians count, "humanity" is arbitrary; if they don't, the Conjecture privileges biological/cultural continuity over value itself.
  *   **Common Miss:** Candidates treat "humanity" as a self-evident category without questioning why biological successors matter more than functional equivalents.

  **5. Verdict on the Conjecture's Limitations (4 marks)**
  *   **Requirement:** Candidate must conclude that the Conjecture clarifies the *structure* of our concern but fails to justify the *object* of that concern (cannot prove objective badness).
  *   **Common Miss:** Candidates attempt to force a tidy resolution (e.g., "Therefore we must save Earth") rather than acknowledging the argumentative limit where the Conjecture runs out.
