answer: |-
  Your hypothesis is partially correct but too deflationary: while verbal equivocation fuels the heat, a stubborn substantive disagreement remains about whether objective single-case chances exist independently of agents or ensembles, so the translation test fails where it matters most.

  In the well-mixed urn case, your translation test succeeds; frequentists, Bayesians, and propensity theorists all assign 0.5 and can map their justifications onto each other without losing predictive power, suggesting the disagreement here is merely about labeling. However, the test breaks down on the single radioactive atom and the once-flipped coin. A frequentist cannot translate the claim "this specific atom has a 50% chance of decaying" into their vocabulary without changing the meaning to "this atom belongs to a class where 50% decay," which is a claim about a population, not the token event. A propensity theorist asserts the probability is a physical property of the token event itself, akin to mass or charge. A Bayesian treats it as a constraint on rational belief given the theory. These are not interchangeable; the frequentist denies the ontological status the propensity theorist asserts, and the Bayesian sidesteps the ontology entirely for epistemology. This is not a verbal dispute but a metaphysical one about the location of probability in the fabric of reality.

  Regarding determinism, you are right that it is a major fault line, but it is not the only substantive one. Even if we grant quantum indeterminism, frequentists and propensity theorists still clash over whether chances attach to *types* of events (repeatable setups) or *tokens* (single occurrences). The Bayesian further clashes with both by arguing that probability is purely a relation between evidence and hypothesis, rendering the physical source of the uncertainty (deterministic ignorance vs. indeterministic chance) irrelevant to the calculus of decision.

  Progress in this debate has already occurred, but not in the form of one side winning. The substantive progress lies in formal bridge principles like De Finetti's representation theorem, which shows that a subjective Bayesian assuming exchangeability will make predictions identical to a frequentist observing long-run data, and David Lewis's Principal Principle, which norms rational credence to objective chance. These results demonstrate that while the metaphysics differ, the decision-theoretic output often converges. The honest answer is that the metaphysical debate is likely stagnant because it is underdetermined by evidence; no experiment can distinguish between "objective chance" and "unknown deterministic causes" if the statistical outputs are identical. The productive path forward is pluralism: accepting that "probability" is a cluster concept where different interpretations are the correct tools for different jobs (e.g., propensity for quantum mechanics, frequentist for quality control, Bayesian for historical inference), rather than seeking a single unified ontology.
