prompt: |-
  I've been having the same arguement with a friend for about a year now and I want you to tell me what kind of disagreement it actually is — not who's right, but what the shape of the thing is. Here's the setup, and then some of our actual moves, so you can diagnose instead of just surveying.

  I'm a fairly straight-down-the-line functionalist about minds. If a system does the right kind of information processing with the right kind of organization, then it's sentient — carbon, silicon, whatever, doesn't matter. My friend thinks that's close to obviously wrong. Her line is that a description of the computation leaves out the actual causal goings-on: whether the parts really influence each other in the right structured, interlocking way. On her view you can compute everything a brain computes and still have nobody home, because the computation is a description of the thing, not the thing. I say multiple realizability, she says multiple realizability of the function doesn't buy you multiple realizability of the feel, I say she's sneaking in a preference for biology, she says I'm mistaking a description of behavior for the behavior. Around and around.

  The case that actually broke our last conversation: take two systems that implement the exact same input-output function. One does it as a giant lookup table — a big precomputed list, no internal dynamics worth the name, you feed it an input and it reads off the output. The other produces the same outputs through an actual dynamical process where the states genuinely push each other around. My friend says the second one might have a someone home and the first definately doesn't. I say: fine, but what is the second one doing that the first isn't, other than being the same computation described at a finer grain of detail? Because if that's all "causal structure" amounts to, then any functionalist already grants it, and it isn't a rival to my view, it's a footnote to it. She thinks that's a dodge. For what it's worth we get the same stalemate when the example is a big language model that passes every behavioral test we can throw at it — she says no one's home, I say how do you know that's a fact about the system rather than your policy for attributing minds.

  So here's what I want, and I want you to commit. Diagnose the impasse. My own hypothesis — and I could be wrong, tell me if I am — is that at least half of it is verbal: I mean "computation" as a substrate-neutral, abstract state-transition thing, and she means it as an actual causal process with a particular internal shape, so when I say "same function, therefore same mind" she's hearing a claim I'm not making, and vice versa. But I suspect there's a real disagreement buried under the verbal one, and I can't tell whether it's (a) a genuine factual or formal dispute about whether her "causal structure" is a property over and above the function or just the function under a finer description, (b) a disagreement about what grounds moral status at all — having a welfare, being a certain kind of causal system, being the proper object of a certain kind of attribution — or (c) the two of us answering different questions under one heading, me a metaphysical "what is consciousness made of" and her an epistemic "when are we entitled to attribute it." And there's a (d) I'm scared of: that it's just bedrock intuitions about whether minds are special, and neither of us can argue for our side.

  Pick one, or a combination, and defend it using our actual moves above. Then tell me what would count as progress given that diagnosis — a distinction, a thought experiment, a formal result, a change of question — or tell me honestly that nothing moves this and why. Dont lay out all four options and shrug; take a position on the diagnosis, and tell me what I'm getting wrong about my own side. No reading list please, I'm offline.
