answer: |-
  Here is the diagnosis.

  **The Diagnosis**
  This is **(a): a genuine factual/formal dispute about whether "causal structure" is a property over and above the function.** It is not merely verbal, and it is not primarily epistemic.

  You are treating "computation" as a logical relation (if input *i*, then output *o*, mediated by state *s*). Your friend is treating "computation" as a physical relation (state *s1* physically forces *s2* to obtain). You believe the logical relation *supervenes* on any physical system that maps the inputs to outputs correctly. She believes the logical relation *depends* on the physical system having specific dynamic properties (time, energy, causal push).

  This is not a verbal misunderstanding because it yields different truth conditions for the sentence "This system is conscious." If you are right, a static lookup table printed on paper is conscious (in principle). If she is right, it is a rock with an index. That is a metaphysical disagreement, not a definitional one.

  **Why Your "Verbal" Hypothesis is Wrong**
  You hypothesized that you mean "computation" as abstract state-transition and she means it as "actual causal process," and that this is just a linguistic mismatch. It isn't. It's a disagreement about **supervenience**.

  You are claiming that causal power *just is* the pattern of counterfactual dependencies. If the table says "If A, then B," the causal power exists.
  She is claiming that causal power requires *production*. The table doesn't *produce* B from A; it just *displays* B when A is pointed to.

  When you say, *"What is the second one doing that the first isn't, other than being the same computation described at a finer grain of detail?"* you are begging the question. You are asserting that the dynamical process is just a "finer grain" of the lookup table. She is asserting that the lookup table is a *different category of object entirely* (a record vs. a process).

  If you were just using words differently, you could agree on the physics and disagree on the label. But you disagree on the physics of the mind. You think the physics is irrelevant so long as the map holds. She thinks the physics *constitutes* the map.

  **What You Are Getting Wrong About Your Own Side**
  You made a specific claim that reveals a blind spot in your position: *"If that's all 'causal structure' amounts to, then any functionalist already grants it, and it isn't a rival to my view, it's a footnote to it."*

  This is false. You are operating with a caricature of functionalism (likely early Putnam-style Machine Functionalism). You are assuming that because you are a functionalist, you get to define what counts as a "function realization" without pushback.

  You are ignoring the **Blockhead Argument** (Ned Block). Your friend is essentially running a version of Block's Chinese Nation or Lookup Table objection. A significant portion of modern functionalists *agree with your friend* that a Giant Lookup Table (GLT) does not satisfy the causal role requirements for mind, even if it matches the I/O.

  By dismissing her view as a "footnote," you are failing to see that your version of functionalism is the controversial one, not hers. You are defending **Input-Output Functionalism**, while she is defending **Causal-Role Functionalism**.
  *   **Your view:** If the black box outputs the right stuff, there's a mind.
  *   **Her view:** If the black box doesn't have internal states that *causally interact* to produce the output, there's no mind.

  You are wrong to think she is "sneaking in a preference for biology." She isn't asking for carbon; she's asking for *dynamics*. A silicon chip with transistors switching has dynamics. A printed lookup table does not. She is drawing the line at *process*, not *substrate*. You are conflating the two.

  **What Counts as Progress**
  Stop arguing about "consciousness" or "minds." You will never move each other there because the intuitions are too loaded. Argue about **computation**.

  **The Test:**
  Agree to settle the metaphysics of the *lookup table* first.
  Ask this specific question: *"Does a static lookup table (pre-computed, no internal state transitions, just retrieval) count as 'computing' the function, or does it count as 'storing' the results of a computation?"*

  *   **If you say it computes:** You must explain where the causation happens. When I look up "2+2" in a book and see "4," did the book compute 2+2? Or did I? If the book is the computer, at what moment did the addition occur? (Your friend says: never. It was done by the author. The book is just a record.)
  *   **If you say it stores:** Then you concede her point. Computation requires a process. If computation requires a process, then "function" is not just I/O mapping; it is I/O mapping *via specific causal pathways*.

  **The Formal Shift:**
  You need to move from defining function as a **Mapping** (Set of input/output pairs) to defining function as a **Mechanism** (A set of state transitions that support counterfactuals).

  *   **Your current definition:** System S computes F if for all *i*, S outputs *F(i)*.
  *   **The required definition:** System S computes F if for all *i*, S enters state *s1*, which *causes* S to enter state *s2*, which *causes* output *F(i)*, such that if *i* had been different, *s1* would have been different.

  The Lookup Table fails the second definition because the states don't *cause* each other; they are just addressed. The dynamical system passes it.

  **The Hard Truth**
  If you refuse to accept that distinction, then this is **(d): bedrock intuitions.**
  If you fundamentally believe that *logical implication* is sufficient for *causal power*, you cannot be argued out of it with physics. You are holding a rationalist view of causation (causation is logical entailment) against her empiricist view (causation is physical production).

  But assuming you want to make progress: Admit that "computation" might require *time-bound state interaction*. If you grant that, you might still be a functionalist, but you have to abandon the Lookup Table. If you abandon the Lookup Table, you have moved 80% of the way to her position. The only remaining fight will be whether silicon dynamics count as "real" causation compared to biology. That is a much smaller, more tractable fight than the one you are currently having.

  **Summary:**
  1.  **Diagnosis:** (a) Metaphysical dispute about causation, not verbal.
  2.  **Your Error:** Assuming all functionalists accept Lookup Tables (they don't) and conflating substrate (biology) with dynamics (process).
  3.  **Progress:** Argue about whether a printed table "computes." If it doesn't, your I/O definition is dead. If it does, explain where the causation is.
