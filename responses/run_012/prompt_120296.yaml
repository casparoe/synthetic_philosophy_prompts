  # FREE WILL DECISION TREE
  **Instructions:** Start at the top. Answer based on your gut reaction to the cases described. Do not worry about philosophical labels; they will appear only at the end.

  ### [START]
  **CASE 1: THE FAIL-SAFE**
  *You decide to steal a cookie. Unbeknownst to you, a device monitors your brain. Had you shown signs of **not** stealing, it would have forced you to steal. Since you stole on your own, it stayed off.*

  **Q1: Are you responsible for stealing?**
  *   **NO** → Go to **Branch A** (You think you need real alternatives).
  *   **YES** → Go to **Branch B** (You think the actual history matters more).

  ---

  ### BRANCH A (The "No" Vote)
  **Q2: In a normal world (no device), does "could have done otherwise" require that the future is not fixed by the past?**
  *   **NO** (Determinism is fine, I just need alternatives) → Go to **Q3**.
  *   **YES** (Determinism kills alternatives) → Go to **Q4**.

  **Q3: Does "could have" just mean "would have if you had chosen to"?**
  *   **YES** → **[LEAF 1] Conditional Compatibilist**
      *   *The awkward bit:* You must say an agent "could" have done something even if, physically, they couldn't have.
  *   **NO** (I need a stronger ability, but not indeterminism) → **[LEAF 2] Classical Compatibilist (Rare/Unstable)**
      *   *The awkward bit:* You must explain what "ability" exists without indeterminism or conditionals; this view is largely unexplored.

  **Q4: If the universe were indeterministic (future not fixed), would you be responsible?**
  *   **NO** (Indeterminism doesn't help control) → **[LEAF 3] Hard Incompatibilist**
      *   *The awkward bit:* You must conclude that nobody is ever truly responsible for anything, ever.
  *   **YES** (Indeterminism saves responsibility) → Go to **Q5**.

  **Q5: Does the *Fail-Safe* case (Q1) assume the future is fixed to work?**
  *   **YES** (The case begs the question against freedom) → **[LEAF 4] Question-Begging Libertarian**
      *   *The awkward bit:* You must reject the verdict of most neuroscience-style thought experiments as rigged.
  *   **NO** (The case works even if the future is open) → Go to **Q6**.

  **Q6: If you couldn't *move* otherwise, but could *will/try* otherwise, is that enough?**
  *   **YES** → **[LEAF 5] Minimal-Alternative Libertarian**
      *   *The awkward bit:* You must explain why a powerless will matters if it cannot change the outcome.
  *   **NO** (I need to be the ultimate source) → **[LEAF 6] Agent-Causal Libertarian**
      *   *The awkward bit:* You must defend a kind of causation where a "substance" causes an event without prior events causing it.

  ---

  ### BRANCH B (The "Yes" Vote)
  **CASE 2: THE PUPPET**
  *A device positively forces your action. You have no option to do otherwise and no say in the matter.*

  **Q7: Are you responsible in *The Puppet* case?**
  *   **YES** → **[LEAF 7] Global Compatibilist**
      *   *The awkward bit:* You must accept there is no responsibility difference between coercion and free choice.
  *   **NO** (Fail-Safe is okay, Puppet is not) → Go to **Q8**.

  **Q8: Why is Fail-Safe okay but Puppet not?**
  *   **Because responsibility is just about how we treat each other (blame/praise)** → **[LEAF 8] Strawsonian**
      *   *The awkward bit:* You must accept that the metaphysical facts about the universe are irrelevant to responsibility.
  *   **Because of something about the agent's psychology** → Go to **Q9**.

  **Q9: What psychological feature matters?**
  *   **That the action flowed from your reasons-responsive machinery** → **[LEAF 9] Actual-Sequence Compatibilist**
      *   *The awkward bit:* You must accept responsibility in deterministic worlds where you never had a real choice.
  *   **That you endorsed/identified with the desire that moved you** → **[LEAF 10] Hierarchical Compatibilist**
      *   *The awkward bit:* You must solve the regress problem: what ensures your endorsement is itself free?

  ---

  ### NOTES ON EMPTY/UNSTABLE POSITIONS
  *   **Leaf 2 (Classical Compatibilist):** This combination (Need PAP + Reject Conditional Analysis + Accept Determinism) is theoretically possible but has almost no defenders in modern literature. It is flagged as **Unexplored/Unattractive** because it is difficult to define "ability" without resorting to conditionals or indeterminism.
  *   **Leaf 7 (Global Compatibilist):** This is flagged as **Unattractive**. Very few philosophers are willing to say a brainwashed puppet is responsible in the same way as a normal agent.

  ### TA NOTE: UNCERTAINTY MARKER
  **Least Confident Branch:** The split at **Q9** (Actual-Sequence vs. Hierarchical).
  **Why:** Many "Actual-Sequence" theorists (like Frankfurt) implicitly rely on some form of identification or endorsement, blurring the line with "Hierarchical" views (like Watson).
  **What would change my mind:** A case where an agent acts on a reasons-responsive mechanism they *hate* (e.g., an addiction they fight but which is still reasons-responsive). If students say "Not Responsible" here, the split holds. If they say "Responsible," the two leaves should merge into a single "Sourcehood Compatibilist" position.

  ---
  *Formatting Tip for A4: Use a sans-serif font (Arial/Helvetica) at 10pt. Use bold for Questions and Leaves. The indentation above represents the flow; in your document, you can use arrows or lines to connect the boxes if space permits, but the logic holds as a list.*
