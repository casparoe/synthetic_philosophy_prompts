  2. Use a hypothetical trial of Drug A versus B with Outcome Survival and stratifying variable ICU Admission, where the numbers show a clear reversal between aggregated and stratified views. In the first narrative, define ICU Admission as a proxy for baseline severity that dictates treatment choice, making it a confounder requiring adjustment. In the second narrative, keep the table identical but define ICU Admission as a side-effect of Drug A that subsequently increases mortality, making it a mediator where adjustment induces bias.

  3. Anticipate the instinct that stratified data is inherently more truthful than aggregated data, and head this off immediately after showing the reversal by asserting that both are arithmetically correct but causally distinct. Watch for the belief that larger sample sizes in the aggregate table confer validity, and interrupt this during the causal diagram phase by highlighting that precision does not equal accuracy in the presence of structural bias.

  4. Hand them a new 2x2 table with a stratification variable and two brief competing narratives, then ask them to vote on which aggregation yields the valid causal estimate. Require them to justify their vote solely by drawing the arrows between Treatment, Outcome, and the third variable, forbidding any reference to the cell counts.

  5. Openly state you are skipping the mathematical probability of reversal occurring by chance, because knowing the frequency does not solve the causal identification problem. Validate their suspicion honestly by stating that in observational data reversal is the expected norm rather than the exception whenever strong confounding exists, but refuse to quantify it since causal diagrams dictate validity, not prevalence.
