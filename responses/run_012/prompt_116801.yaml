answer: |-
  You have described a phenomenon that sits precisely at the intersection of game theory, moral psychology, and the philosophy of action. It is a sharp observation, and your frustration in finding a label is understandable: the thing itself resists categorisation precisely because of the properties you have identified.

  There is no single, canonical term in the literature that captures the entirety of this pattern, though it is composed of three well-known philosophical distinctives. To give you the careful definition you seek, we must triangulate between Thomas Schelling's work on conflict, Jon Elster's work on rationality, and Bernard Williams's work on integrity.

  ### The Philosophical Neighbours

  1.  **Schelling's Credible Commitment:** In *The Strategy of Conflict*, Schelling describes how a negotiator gains advantage by restricting their own future choices. If the other side knows you *cannot* accept less than X, they must pay X. However, Schelling largely focuses on external devices (burning bridges, handing over control to an agent). You have identified an *internal* device.
  2.  **Elster's By-Product States:** The philosopher Jon Elster, particularly in *Ulysses Unbound* and *Solomonic Judgements*, analyses states of mind that are necessarily "by-products." One cannot aim directly at sleep, spontaneity, or love; trying to achieve them ensures their absence. He calls this the "Law of Reversed Effort." Your colleagues' temperament is a strategic by-product state.
  3.  **Williams's Integrity:** Bernard Williams argued that to step outside one's "ground projects" to calculate their utility is to undermine them. If a person asks, "Is it useful for me to be honest?", they are no longer acting from honesty, but from calculation.

  ### A Proposed Name

  Given the absence of a single established term, the most precise label for this class of advantage is **Involuntary Credibility**.

  It is *credible* because it functions as a commitment device (the opponent believes you will not fold). It is *involuntary* because it relies on a disposition that cannot be adopted at will without ceasing to be the thing that grants the advantage.

  Some game theorists might loosely refer to this as **Strategic Irrationality**, but that term is too broad and often implies a conscious choice to appear mad. Your description is more specific: it is **Constitutive Intransigence**. However, **Involuntary Credibility** best captures the tension between the benefit (credibility) and the condition (involuntariness).

  ### A Tight Definition

  For a case to fall within this class, four conditions must be met. If any one is absent, the phenomenon collapses into reputation, bluff, or ordinary stubbornness.

  1.  **Involuntariness (The Constraint Condition):** The agent must be genuinely unable to act against the disposition in the critical moment, not merely unwilling. The constraint must be internal (temperamental/psychological) rather than external (contractual/physical).
  2.  **Opacity (The Self-Erasure Condition):** The agent cannot hold the disposition *for the sake of* the advantage it confers. The utility of the trait must not be part of the agent's motivation for possessing it. As you noted, the moment the agent reflects on the trait instrumentally, it becomes a choice, and thus revocable.
  3.  **Pre-existence (The Temporal Condition):** The disposition must be established prior to the strategic context. It cannot be cultivated *in situ* to solve a specific negotiation problem. It must be a feature of the agent's character that precedes the specific game being played.
  4.  **Positionality (The Scalability Condition):** The advantage is derived from scarcity. If universalised, the value vanishes (or becomes negative, as you noted regarding court seizures). It is a **Positional Good** in the economic sense: its value depends on you having it while others do not.

  ### Distinctions from Neighbouring Concepts

  You asked where the boundaries lie with other familiar concepts. Here is how *Involuntary Credibility* is distinct:

  *   **Vs. Reputation:** Reputation is built on a history of *choices*. It says, "I have always chosen to fight, so I will likely choose to fight again." *Involuntary Credibility* says, "I am not capable of choosing to settle." Reputation can be repaired or altered; a temperament cannot be switched off on Tuesday and on Wednesday.
  *   **Vs. Commitment Devices:** A Ulysses pact (tying oneself to the mast) is a deliberate, rational act to constrain future irrationality. Your colleagues are not constraining themselves; they *are* the constraint. A commitment device is a tool the agent uses; this disposition is a property the agent *has*.
  *   **Vs. Costly Signalling:** In biology and economics, costly signalling (e.g., a peacock's tail) is an honest signal because it is expensive to fake. However, it is still an evolved or adopted strategy. Your colleagues are not signalling; they are simply being. The "cost" is not paid to send a message; the cost is incurred because the message is irrelevant to their action.
  *   **Vs. Rational Irrationality:** This is the closest neighbour. Standard "rational irrationality" allows for the *simulation* of madness. Your observation correctly identifies that in high-stakes commercial mediation, simulation is detected and discounted. The advantage requires *genuine* irrationality (from a pure payoff perspective) regarding the specific settlement.

  ### Is Self-Erasure Essential?

  You asked whether the self-erasing nature of the trait is essential to the phenomenon or merely an accident of your colleagues.

  It is **logically essential**.

  Here is the mechanism: The advantage derives from the opponent's belief that you *cannot* settle. Belief is based on the prediction of future behaviour. Future behaviour is predicted based on current constraints.
  If you decide to acquire this trait *to gain the advantage*, you have subordinated the trait to the advantage. This means the trait is now instrumental. If the trait is instrumental, you will discard it if it ceases to serve the advantage (e.g., if the hearing looks too risky).
  Because the opponent knows that rational actors discard instrumental constraints when costs outweigh benefits, your "constraint" is revealed as a choice. Once it is revealed as a choice, it is no longer a constraint. Once it is no longer a constraint, the opponent has no reason to fold.

  Therefore, to maintain the credibility, the agent must not view the trait as a tool. They must view it as part of their identity. To analyse it is to objectify it, and to objectify it is to separate oneself from it. This is why your colleague started losing when he began thinking about it: he stepped outside the disposition to observe it, and in doing so, ceased to be fully subject to it.

  ### Summary

  You are describing **Involuntary Credibility**, a form of **Positional Good** grounded in a **By-Product State**.

  It is not a virtue in the ethical sense, because it does not scale and relies on the inability of others to replicate it. It is a "good seat," as you surmised, but one that cannot be purchased or reserved. It requires the agent to remain opaque to their own strategic interests. In a profession dedicated to making interests explicit, this advantage is available only to those who remain partially blind to their own.

  It is a rare instance where ignorance is not merely bliss, but a prerequisite for efficacy.
