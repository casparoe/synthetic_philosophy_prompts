prompt: |-
  I am a program analyst at a mid-sized private foundation that makes roughly forty grants a year, and my job is to produce the ranked shortlist that our trustees vote on at the end of each funding round. A new strategic plan commits us to a single cross-cutting metric: every proposal is scored on one wellbeing scale, and we fund down the list until the money runs out. That means I now have to do something my graduate training taught me was either impossible or vaguely disreputable, namely compare improvements in the lives of different people, in different countries, living with different conditions, against one another. The trustees will not accept these are incommensurable as an answer, and I do not need a lecture on why the exercise is fraught. What I need is a procedure I can actually run on forty proposals in about a week, mostly on my own with one part-time colleague, using the program data and published cost-effectiveness estimates we already have and no budget for new research, and that I can defend in writing when a trustee asks why a deworming proposal outranked a proposal to treat severe depression in adolescents. I have roughly $12 million to allocate this cycle and the decisions are annual, so the procedure has to be stable enough to reuse next year.

  Please turn whatever the philosophical and economic work on interpersonal comparison actually establishes into something operational. I want the steps in the order I should run them, and for each step what counts as a sufficient answer rather than a gesture; I want to be told which steps can be settled with ordinal information alone and which genuinely require cardinal information, and within the cardinal cases which require only that I can say how much better off one person is than another and which require that I can say whether one person is better off than another at all. I keep half-remembering some distinction along those lines and I suspect a good deal of our internal disagreement is really about which of the two we are quietly assuming, so the procedure should make the assumption explicit at each step rather than bury it. Where a dominance test or a Pareto-style shortcut can let me avoid a hard comparison altogether, I want that shortcut early and clearly marked, since I would rather skip the hardest comparisons than resolve them. I want the points where the procedure stops and hands the decision back to the trustees, stated as rules rather than as advice to use judgment, and I want a separate list of the substantive comparisons the procedure presupposes, so the board can see exactly what it is buying when it adopts the score. Flag plainly which steps are judgment calls dressed up as arithmetic. The procedure should be immune to two obvious embarrassments: a proposal that makes everyone worse off but more equal must not rank well, and a proposal that raises the total by bringing many new people into existence at a level barely worth living must not be able to win on volume alone. If the honest answer is that some of these cannot be handled by a score at all, say so and tell me what to do instead.

  Then run the procedure on three proposals: a large deworming program whose benefits are real but mostly modest, spread over hundreds of thousands of children; a small intensive psychotherapy program for a few hundred adolescents with severe treatment-resistant depression and elevated suicide risk; and a cash-transfer program that also appears to increase births in the recipient community, so that part of its measured benefit comes from lives that would not otherwise have existed. Show me where the procedure runs cleanly, where it stalls, and where it forces a comparison I would rather not make, and for at least one of the three give me the ranking I will not like, with the reasoning intact so I can pass it upward. Finish by telling me what the procedure cannot do: which kinds of proposal it will systematically mishandle, what it will do to grants whose benefits fall on future generations or on non-human animals, and the point at which I should stop trusting the score and put the question to the trustees as a question of values.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Program Analyst at a mid-sized private foundation ($12M annual budget, ~40 grants/year).
      *   **Task:** Create a ranked shortlist for trustees based on a single cross-cutting wellbeing metric (new strategic plan).
      *   **Constraints:** 1 week timeline, 1 analyst + 1 part-time colleague, existing data only (no new research), must be defensible in writing, stable for reuse.
      *   **Core Challenge:** Interpersonal comparison of wellbeing (comparing deworming vs. depression treatment vs. cash transfers with demographic effects).
      *   **Specific Requirements:**
          *   Operationalize philosophical/economic work on interpersonal comparison.
          *   Step-by-step procedure (ordered).
          *   Distinguish ordinal vs. cardinal requirements.
          *   Distinguish level vs. difference comparisons (better off vs. how much better).
          *   Prioritize dominance/Pareto shortcuts to avoid hard comparisons.
          *   Explicit "stop and return to trustees" rules (not advice).
          *   List substantive presuppositions (what the board is buying).
          *   Flag judgment calls dressed as arithmetic.
          *   Immune to specific pitfalls: "Equality at the bottom" (making everyone worse off but equal) and "Repugnant Conclusion" (volume of barely worth living lives).
          *   Apply to three specific test cases (Deworming, Psychotherapy, Cash Transfer + Births).
          *   Show where it stalls/forces uncomfortable comparisons.
          *   Provide an unpopular ranking with reasoning.
          *   Final section on limitations (future gens, animals, when to stop trusting the score).

  2.  **Theoretical Foundation:**
      *   The user is asking for *Social Welfare Function (SWF)* implementation but constrained by practical reality.
      *   *Interpersonal Comparison:* Needs a common unit. QALYs/DALYs are the industry standard for health, but "Wellbeing" is broader. Given the foundation context and the need for a single metric, a modified QALY/DALY approach or a "Wellbeing-Adjusted Life Year" (WALY) framework is the only operationalizable method within a week using existing data.
      *   *Ordinal vs. Cardinal:*
          *   Ordinal: Ranking states (A > B).
          *   Cardinal: Magnitude of difference (A is 2x better than B).
          *   Level vs. Difference: Comparing absolute states vs. comparing changes ($\Delta$). Most cost-effectiveness analysis (CEA) deals with $\Delta$.
      *   *Pitfalls:*
          *   "Equality at the bottom": Avoided by using a *Utilitarian* sum (Total Wellbeing) rather than Prioritarian or Egalitarian SWF, or by setting a floor. The prompt specifically bans "everyone worse off but more equal." This implies a Total View or at least a constraint against negative sum moves.
          *   "Repugnant Conclusion" (Parfit): Avoided by using *Critical-Level Utilitarianism* (lives must exceed a threshold of wellbeing to count positively) rather than Classical Utilitarianism (any positive life counts).
      *   *Dominance:* If Proposal A costs less and does more good than Proposal B, B is dominated.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Data Sanity & Dominance Check.* (Ordinal/Cardinal mix). Eliminate proposals that are strictly worse (cost more, do less).
      *   *Step 2: Metric Standardization.* Need a common unit. DALYs averted or WELLBYs (Wellbeing Life Years). Let's use WELLBYs as it fits "wellbeing scale" better, but acknowledge most data is health-centric.
      *   *Step 3: Cardinalization.* Converting outcomes to the unit. This is where the "judgment dressed as arithmetic" happens.
      *   *Step 4: Population Ethics Adjustment.* Addressing the "new lives" issue (Critical Level).
      *   *Step 5: Aggregation & Ranking.* Summing total impact.
      *   *Step 6: Trustee Handoff.* Rules for when the math breaks.

      *Refining the "Ordinal vs. Cardinal" requirement:* I need to be explicit.
      *   Dominance = Ordinal (A > B).
      *   Cost-Effectiveness Ratio = Cardinal (Cost per Unit).
      *   Interpersonal weighting = Cardinal (Is 1 unit for depressed teen = 1 unit for dewormed child?).

      *Refining the "Pitfalls":*
      *   Equality at bottom: Use Total Wellbeing Change, not Gini coefficient.
      *   Repugnant Conclusion: Set a "Critical Level" threshold (e.g., wellbeing must be > 5/10 to count as a gain).

      *Refining the "Trustee Handoff":*
      *   If uncertainty ranges overlap significantly.
      *   If the "Critical Level" assumption changes the rank.
      *   If non-wellbeing values (justice, rights) are triggered.

  4.  **Developing the Test Cases:**
      *   *Proposal A (Deworming):* High volume, low intensity per person. Cheap.
      *   *Proposal B (Psychotherapy):* Low volume, high intensity per person. Expensive. High suicide risk reduction.
      *   *Proposal C (Cash Transfer):* Medium volume. Demographic effect (more births).
      *   *Conflict:* A vs B is the classic "depth vs. breadth" problem. C introduces the "non-identity/repugnant conclusion" problem.

  5.  **Addressing Specific Constraints:**
      *   *Time:* 1 week. The procedure must be spreadsheet-based, not model-heavy.
      *   *Defensibility:* Needs an audit trail.
      *   *Unpopular Ranking:* Likely Deworming > Psychotherapy based on pure cost-per-wellbeing-unit, unless suicide risk is weighted heavily. Or Cash Transfer ranks lower due to the "new lives" discount. Let's aim for Deworming > Psychotherapy > Cash Transfer (due to population ethics adjustment) or similar. Actually, the prompt asks for *one* unpopular ranking. Usually, Effective Altruism logic favors Deworming over Therapy due to scale. That is often unpopular emotionally. I will use that.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the constraint and the theoretical basis (Critical-Level Utilitarianism + Cost-Effectiveness Analysis).
      *   **The Procedure (Steps 1-7):** Explicitly marking Ordinal/Cardinal, Level/Difference, and Judgment Flags.
      *   **Substantive Presuppositions:** The "Bill of Goods."
      *   **Application to Test Cases:** Walk through A, B, C. Show the math/logic.
      *   **The Unpopular Ranking:** Explicitly state it.
      *   **Limitations:** Future gens, animals, value breaks.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I initially thought about QALYs. But the prompt says "wellbeing scale." I should use WELLBYs (Wellbeing-Adjusted Life Years) as the unit, mapping health data to it.
      *   *Correction:* Make sure to distinguish "Level" (is this life worth living?) vs "Difference" (is this intervention an improvement?). The population ethics step requires Level judgments. The CEA step requires Difference judgments.
      *   *Correction:* Ensure the "Equality at the bottom" constraint is met. A simple sum of wellbeing changes handles this (if everyone is worse off, sum is negative).
      *   *Correction:* Ensure the "Repugnant Conclusion" is handled. Use a Critical Level (e.g., neutral point).
      *   *Tone:* Professional, direct, operational, no lecturing on ethics (as requested), but explicit about where ethics enters the math.

  8.  **Final Review against Prompt:**
      *   Steps in order? Yes.
      *   Sufficient answer vs gesture? Yes.
      *   Ordinal/Cardinal marked? Yes.
      *   Level/Difference marked? Yes.
      *   Dominance shortcuts early? Yes.
      *   Trustee handoff rules? Yes.
      *   Substantive presuppositions list? Yes.
      *   Judgment calls flagged? Yes.
      *   Immune to equality/repugnant pitfalls? Yes (via Total View + Critical Level).
      *   Run on 3 proposals? Yes.
      *   Show stalls/forces? Yes.
      *   Unpopular ranking included? Yes.
      *   Limitations section? Yes.

  9.  **Final Polish:** Check the math logic on the test cases to ensure consistency with the procedure. Ensure the distinction between *making people better off* and *making more people* is clear in Step 4.

  *(Self-Correction on the "Unpopular Ranking"):* The prompt asks for "the ranking I will not like." Usually, analysts prefer the human-intensive stories (therapy) over the statistical ones (deworming). I will rank Deworming #1 and Therapy #2, showing the cost-per-unit disparity. I will rank Cash Transfer #3 due to the population ethics discount, which might also be unpopular if they like cash transfers, but the Deworming vs Therapy is the sharper moral conflict. I'll stick with Deworming > Therapy as the primary friction point.

  *(Refining the "Level vs Difference" distinction):*
  *   Difference: $\Delta$ Wellbeing (Intervention vs Counterfactual). Needed for CEA.
  *   Level: Absolute Wellbeing (Is the new life > Neutral?). Needed for Population Ethics.
  *   I need to make sure the procedure explicitly asks for these differently.

  Let's write it.cw
answer: |-
  ## Operational Procedure for Interpersonal Wellbeing Comparison

  **Objective:** Rank grant proposals by total expected wellbeing impact per dollar, adjusted for population ethics constraints, using existing data.
  **Constraints:** 1-week timeline, existing data only, defensible audit trail.
  **Theoretical Basis:** Critical-Level Utilitarianism. This avoids the "Repugnant Conclusion" (valuing vast numbers of barely worth-living lives) and the "Equality at the Bottom" trap (valuing equality over total welfare) by summing *changes* in wellbeing above a neutral threshold.

  ### Part 1: The Procedure

  Run these steps in order. Do not proceed to Step $N$ until Step $N-1$ is complete.

  #### Step 1: The Dominance & Feasibility Filter
  *   **Action:** Eliminate any proposal that is strictly dominated by another or fails basic feasibility.
  *   **Data Needed:** Total cost, target population size, direction of effect (positive/negative).
  *   **Comparison Type:** **Ordinal** (Is A better than B on all dimensions?).
  *   **Level vs. Difference:** **Difference** (Is the change positive?).
  *   **Sufficient Answer:** Proposal X costs more than Proposal Y and produces fewer expected beneficiaries with lower confidence of impact. Proposal X is rejected.
  *   **Judgment Flag:** *None.* This is arithmetic dominance.
  *   **Trustee Handoff Rule:** If two proposals are cost-identical and impact-identical within a 5% margin, flag both as "Tied for Efficiency" and submit both to the shortlist without ranking them relative to each other.

  #### Step 2: Standardization of Units (The "Wellbeing Unit")
  *   **Action:** Convert all outcome metrics into a single cardinal unit: **WELLBYs** (Wellbeing-Adjusted Life Years). One WELLBY = one person experiencing one year of life at a neutral wellbeing level (0) moving to a +1 point on a 0-10 life satisfaction scale.
  *   **Data Needed:** Published cost-effectiveness estimates (e.g., DALYs averted, income gains, test score improvements).
  *   **Comparison Type:** **Cardinal** (Magnitude of change).
  *   **Level vs. Difference:** **Difference** (Change from counterfactual).
  *   **Sufficient Answer:** A conversion table mapping existing metrics to WELLBYs.
      *   *Health:* 1 DALY averted $\approx$ 0.5 WELLBYs gained (based on literature linking disability to life satisfaction).
      *   *Income:* \$1,000 increase in annual consumption $\approx$ 0.05 WELLBYs (diminishing marginal utility applied).
      *   *Mental Health:* Remission from severe depression $\approx$ +2.5 WELLBYs per year.
  *   **Judgment Flag:** **HIGH.** You are asserting that relieving moderate physical pain is mathematically equivalent to a specific dollar amount or mental health gain. This is not empirical; it is a valuation assumption.
  *   **Trustee Handoff Rule:** If a proposal's primary outcome cannot be mapped to wellbeing (e.g., "policy advocacy" with no clear beneficiary path), reject it from this scoring stream and route to a separate "Strategic/Values" bucket.

  #### Step 3: The Population Ethics Adjustment (Critical Level)
  *   **Action:** Adjust the total score for proposals that change population size (e.g., cash transfers leading to more births).
  *   **Data Needed:** Estimated number of *new* individuals created who would not otherwise exist.
  *   **Comparison Type:** **Cardinal** (Absolute Level).
  *   **Level vs. Difference:** **Level** (Is the new life worth living?).
  *   **Sufficient Answer:** Apply a **Critical Level Threshold**. Only wellbeing generated for *new* people counts if their expected lifetime wellbeing exceeds a "Neutral" baseline (defined as 5/10 life satisfaction).
      *   *Calculation:* (Expected Lifetime WELLBYs of new person) minus (Critical Level WELLBYs). If negative, subtract from proposal score. If positive, add.
      *   *Constraint:* Do not count the mere existence of a life as a benefit unless it exceeds the threshold. This prevents the "Repugnant Conclusion."
  *   **Judgment Flag:** **CRITICAL.** You are deciding the minimum quality of life required for a life to be a "benefit" to the universe.
  *   **Trustee Handoff Rule:** If the ranking of the top 3 proposals flips depending on whether the Critical Level is set at 4/10 or 6/10, stop. Submit the sensitivity analysis to trustees and ask for a policy decision on the "Value of New Lives."

  #### Step 4: Aggregation and Cost-Effectiveness Ratio
  *   **Action:** Sum the total adjusted WELLBYs for each proposal and divide by total cost.
  *   **Data Needed:** Total WELLBYs (from Steps 2 & 3), Total Budget Request.
  *   **Comparison Type:** **Cardinal** (Ratio).
  *   **Level vs. Difference:** **Difference** (Marginal impact per dollar).
  *   **Sufficient Answer:** A single number: **Cost Per WELLBY** (e.g., \$50/WELLBY).
  *   **Judgment Flag:** **MEDIUM.** This assumes linear scalability (that the 10,000th dollar works as well as the 1st) and ignores distributional fairness (equality).
  *   **Trustee Handoff Rule:** This step inherently rejects "Equality at the Bottom." If a proposal makes everyone slightly worse off but equalizes outcomes, its score will be negative. If trustees desire equality regardless of total loss, this procedure cannot capture it. Flag any proposal with high inequality reduction but low total gain for manual review.

  #### Step 5: Uncertainty Discounting
  *   **Action:** Apply a discount to the score based on evidence quality.
  *   **Data Needed:** Evidence grade (RCT, observational, expert opinion).
  *   **Comparison Type:** **Ordinal** (Quality tiers).
  *   **Level vs. Difference:** **N/A.**
  *   **Sufficient Answer:** Multiply Cost Per WELLBY by a risk factor:
      *   RCT/Meta-analysis: 1.0x
      *   Strong Observational: 0.8x
      *   Expert Estimate: 0.5x
  *   **Judgment Flag:** **LOW.** This is a standard risk adjustment, but the cut-offs are arbitrary.
  *   **Trustee Handoff Rule:** If a high-risk proposal (0.5x) ranks in the top 5 solely because of its massive scale potential, flag it as "High Variance."

  #### Step 6: Final Ranking and "Hard Comparison" Flag
  *   **Action:** Sort by discounted Cost Per WELLBY (lowest cost per unit is best).
  *   **Comparison Type:** **Cardinal**.
  *   **Sufficient Answer:** A ranked list 1–40.
  *   **Judgment Flag:** **CRITICAL.** This step asserts that a WELLBY for a depressed adolescent is *identical* to a WELLBY for a dewormed child.
  *   **Trustee Handoff Rule:** If the difference in Cost Per WELLBY between two adjacent proposals is less than 15%, mark them as **"Indistinguishable within Error."** Do not rank them numerically. Group them and let trustees choose based on non-score values (e.g., geography, mission fit).

  ---

  ### Part 2: Substantive Presuppositions (The "Bill of Goods")

  When the board adopts this score, they are buying the following claims. You must attach this list to the shortlist.

  1.  **Commensurability:** Mental anguish, physical pain, and income loss can be traded off against one another at fixed rates.
  2.  **Totalism:** The goal is to maximize the *sum* of wellbeing, not to prioritize the worst-off (unless captured in the conversion rates).
  3.  **Neutrality Threshold:** A life that is "worth living" is not necessarily a "benefit" to create; it must exceed a specific quality threshold to count as positive impact (Critical Level).
  4.  **Linearity:** \$1 million doing X is ten times as good as \$100,000 doing X (no diminishing returns to scale assumed).
  5.  **Identity Irrelevance:** It does not matter *who* gets the wellbeing, only *how much* is generated (anonymity principle).

  ---

  ### Part 3: Application to Test Cases

  **Budget:** \$12M available.
  **Proposals:**
  1.  **Deworming (Proposal A):** \$2M request. 500,000 children. Modest health/education gains per child. High evidence quality (RCT).
  2.  **Psychotherapy (Proposal B):** \$2M request. 300 adolescents. Severe depression/suicide risk. High gain per person. Medium evidence quality (clinical trials).
  3.  **Cash Transfer (Proposal C):** \$2M request. 5,000 families. Income gain + demographic increase (500 additional births projected). High evidence quality.

  #### Step 1: Dominance Check
  *   All three have positive expected impact. No dominance. All proceed.

  #### Step 2: Standardization (WELLBY Conversion)
  *   **Proposal A (Deworming):** Literature suggests 0.02 WELLBYs per child per year for 5 years.
      *   $500,000 \times 0.02 \times 5 = 50,000$ WELLBYs.
      *   Cost: \$2M.
      *   Raw Cost/WELLBY: **\$40**.
  *   **Proposal B (Therapy):** Remission yields +2.5 WELLBYs/year. Average duration of benefit 10 years.
      *   $300 \times 2.5 \times 10 = 7,500$ WELLBYs.
      *   *Correction for Suicide Risk:* Preventing one suicide is weighted heavily in some models, but under strict WELLBY accounting, it is the sum of remaining life years. Let's assume 40 years remaining. $30 \text{ suicides prevented} \times 40 \text{ years} \times 0.5 \text{ quality adjustment} = 600$ WELLBYs.
      *   Total: $7,500 + 600 = 8,100$ WELLBYs.
      *   Cost: \$2M.
      *   Raw Cost/WELLBY: **\$247**.
  *   **Proposal C (Cash):** Income gain yields 0.1 WELLBY/family/year for 5 years.
      *   $5,000 \times 0.1 \times 5 = 2,500$ WELLBYs (existing people).
      *   Cost: \$2M.
      *   Raw Cost/WELLBY (existing): **\$800**.

  #### Step 3: Population Ethics Adjustment (The Stall Point)
  *   **Proposal A & B:** No change in population size. Score unchanged.
  *   **Proposal C:** 500 new births.
      *   *Assumption:* Expected lifetime wellbeing of a child in this community is 6/10. Critical Level threshold is 5/10.
      *   *Gain per new life:* (6 - 5) $\times$ 70 years = 70 WELLBYs.
      *   *Total Population Gain:* $500 \times 70 = 35,000$ WELLBYs.
      *   *Adjusted Total:* $2,500 \text{ (income)} + 35,000 \text{ (population)} = 37,500$ WELLBYs.
      *   *Adjusted Cost/WELLBY:* \$2M / 37,500 = **\$53**.
      *   *Alternative View:* If trustees set Critical Level at 7/10 (believing these lives will be hard), the population term becomes negative. $500 \times (6-7) \times 70 = -35,000$. Total Score = -32,500. Proposal becomes net harmful.
      *   **Procedure Stall:** The ranking depends entirely on the Critical Level threshold.
      *   **Action:** I will run the "Base Case" (Threshold 5/10) for the score, but flag the sensitivity.

  #### Step 4 & 5: Aggregation & Uncertainty
  *   **Proposal A:** \$40/WELLBY. Risk Factor 1.0 (RCT). **Final Score: \$40/WELLBY.**
  *   **Proposal B:** \$247/WELLBY. Risk Factor 0.8 (Clinical). **Final Score: \$309/WELLBY.**
  *   **Proposal C:** \$53/WELLBY. Risk Factor 1.0 (RCT). **Final Score: \$53/WELLBY.**

  #### Step 6: Ranking
  1.  **Proposal A (Deworming):** \$40/WELLBY.
  2.  **Proposal C (Cash Transfer):** \$53/WELLBY.
  3.  **Proposal B (Psychotherapy):** \$309/WELLBY.

  ---

  ### Part 4: The Unpopular Ranking and Reasoning

  **The Ranking:** Deworming (A) > Cash Transfer (C) > Psychotherapy (B).

  **The Unpopular Result:** **Psychotherapy (B) ranks last.**
  Despite dealing with suicide risk and severe suffering, Proposal B is ranked below the modest Deworming program.

  **Reasoning for Trustees (Defensible Text):**
  "Under the adopted wellbeing metric, resources are allocated to maximize the total sum of wellbeing gains per dollar. While the *intensity* of suffering alleviated in Proposal B is higher per individual, the *scale* is too small relative to cost. Proposal A affects 500,000 lives versus 300 lives. Even though the gain per child in A is small, the aggregation of small gains across hundreds of thousands exceeds the aggregation of large gains across hundreds. To rank B higher would require applying a 'severity weight' that prioritizes the worst-off regardless of total cost-efficiency. The current scoring model does not include a severity weight; it measures total volume of wellbeing. If the Board wishes to prioritize severity over volume, the scoring metric must be altered to include a 'Priority Weighting' factor, which would reduce the total expected impact of the portfolio."

  **Where the Procedure Stalls/Forces Comparison:**
  *   **Proposal C (Cash Transfer):** The procedure forces you to decide if the new births are a "benefit." In the calculation above, they accounted for 93% of the proposal's value. If the Board rejects the premise that creating new lives is a charitable "benefit," Proposal C drops from 2nd place to 3rd place instantly. This is a **Level** comparison (is the life good enough?) disguised as arithmetic.
  *   **Proposal B (Psychotherapy):** The procedure forces you to treat a year of life saved from suicide as mathematically additive to a year of life freed from parasites. If the Board feels suicide prevention is *lexically* prior (must be done before anything else), this score is invalid.

  ---

  ### Part 5: Limitations and Trustee Handoff

  **What this procedure systematically mishandles:**
  1.  **Existential/Catastrophic Risk:** Proposals that prevent low-probability, high-impact events (e.g., pandemic prevention) will score poorly because the *expected value* (probability $\times$ impact) is hard to cardinalize without wild speculation.
  2.  **Future Generations:** Discounting is hidden in the "Life Year" calculation. Benefits falling 50 years from now are treated the same as today unless you apply a discount rate. This procedure assumes **Zero Time Preference** (a WELLBY in 2070 = a WELLBY in 2024). If trustees prefer immediate impact, this is wrong.
  3.  **Non-Human Animals:** The procedure is anthropocentric. A proposal that reduces suffering for 1 million pigs cannot be compared unless you establish an exchange rate between human and animal WELLBYs. **Do not attempt this.** Route animal welfare grants to a separate budget bucket.
  4.  **Rights and Justice:** A proposal that violates a minority's rights to maximize total wellbeing will score highly. The procedure has no "Rights Constraint."

  **When to stop trusting the score:**
  1.  **The "Outlier" Test:** If a proposal ranks in the top 5 but makes you personally uncomfortable (e.g., it feels cold or mechanistic), do not override it yourself. Flag it as **"Values Mismatch."**
  2.  **The "Margin" Test:** If the top 10 proposals all fall within a 20% range of Cost Per WELLBY, the math is no longer decisive. The ranking within that top 10 is noise. Tell the trustees: *"The top 10 are statistically tied. Choose based on strategic fit, not score."*
  3.  **The "Level" Test:** If a proposal relies heavily on the "Critical Level" assumption (like Proposal C), and your board has never voted on what constitutes a "life worth living," you cannot score it. Return it to the board with the question: *"Do we count population growth as impact? Yes/No."*

  **Final Instruction to Analyst:**
  You are not calculating truth. You are calculating consistency. This procedure ensures that if the Trustees fund Deworming over Therapy this year, they must do so next year unless the data changes. It prevents emotional drift. When the math conflicts with moral intuition, do not fudge the numbers. Flag the conflict. That is where the Trustees earn their stipend.
