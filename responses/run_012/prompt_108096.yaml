answer: |-
  Matt Haig's *The Midnight Library* presents a metaphysical architecture that is immediately hostile to David Lewis's modal realism. To read the novel through a Lewisian lens is not to find a hidden alignment, but to expose the precise points where human intuition about possibility diverges from rigorous metaphysical theory. The novel operates on a model of modality that Lewis would classify as incoherent, blending ersatzism with magical transworld travel. However, this incoherence is philosophically productive: it dramatizes the psychological resistance to Lewis's cold ontology.

  The novel's central mechanism presupposes an ersatz picture of possible worlds, though it treats them as concretely accessible. In the Library, worlds exist as books—descriptions or models of ways things might have been. For Lewis, this is insufficient; possible worlds are not representations but concrete universes, spatiotemporally and causally isolated from one another. The Library violates causal isolation immediately: Nora travels between worlds. For Lewis, no object exists in more than one world, and no causal interaction between worlds is possible. Nora's ability to step from one life to another implies a metaphysical space outside the pluriverse—a "Library space"—from which she can access distinct concrete realities. Lewis rejects any such external vantage point. There is no "outside" the pluriverse; there is only the sum total of all worlds. Consequently, the novel's topology is impossible under modal realism. There is no hub where worlds meet.

  Furthermore, the novel relies on transworld identity, which Lewis explicitly denies. Nora remains the same conscious subject across different lives; she retains memories of the "root" world while inhabiting others. For Lewis, objects are world-bound. The Nora who is a glaciologist and the Nora who is a rock star are not identical; they are counterparts. They resemble each other in certain respects, but they are distinct individuals. The novel's narrative arc depends on the continuity of the self to make regret meaningful: Nora regrets *her* choices. Under Lewis's counterpart theory, regret is strictly intra-world. Nora-Actual regrets the facts of World-Actual. The happiness of Nora-Counterpart in World-RockStar offers no metaphysical continuity that would allow Actual-Nora to claim that life as hers. The novel assumes a persistent soul or consciousness that transcends world-boundaries, a notion Lewis eliminates to preserve the integrity of concrete realism.

  This ontological clash informs the ethical divergence regarding consolation. The novel is fundamentally therapeutic: Nora samples other lives, finds them flawed, and concludes her actual life is worth living. It trades on the idea that knowledge of other possibilities can validate the actual one. Lewis explicitly disavows this consolation. He argues that the reality of other worlds offers no compensation for suffering in this one. Knowing that a counterpart is happy does not alleviate your pain, because that counterpart is not you. Conversely, knowing counterparts suffer does not make your suffering worse. Lewis's modal realism is descriptive, not prescriptive; it explains the truth conditions of modal statements, not how to live. The novel, however, uses modal realism's plurality (albeit a magical version) to cure depression. It suggests that the existence of other lives diminishes the weight of failure in this one. Lewis would argue this is a category error: the value of a life is internal to that world. The novel attempts to aggregate value across the pluriverse, which Lewis's isolation principle forbids.

  Does the novel ever approach the Lewisian insight that "actual" is merely indexical? Briefly, but it retreats. When Nora chooses to return to her root life, she treats "actual" not as a indexical marker of location (like "here"), but as a normative status to be earned. For Lewis, every world is actual to its inhabitants. There is no privileged world ontologically. In the novel, the root world is privileged structurally; it is the source from which the branches grow and the only one where the story concludes. The Library treats the root world as the "real" one and the others as simulations or trials. This reintroduces a hierarchical metaphysics that Lewis flattens. The novel cannot sustain the indexical view because its moral requires Nora's world to be *the* world, not just *a* world.

  However, this is where the novel contributes what philosophy cannot. Lewis provides the metaphysics of modality, but he leaves unexplained the phenomenology of regret. Why do we feel that other lives are genuinely open to us? Why does the thought of "what might have been" carry emotional weight? Lewis answers that modal talk is useful, but he does not explain the visceral experience of counterfactual thinking. *The Midnight Library* dramatizes the human inability to treat actuality as merely indexical. We cannot help but treat our world as privileged, not just semantically, but morally. The novel suggests that while Lewis may be right about the ontology of worlds, he is wrong about the psychology of inhabiting one. We require the illusion of transworld identity to process regret. We need to feel that the counterpart is us, otherwise the regret is unintelligible. The novel validates the human scale of metaphysics: we live as if we can travel between possibilities, even if we cannot.

  The reading breaks down at the moment of choice. In Lewis's system, you do not choose your world; you are in it. The concept of choosing which world to inhabit implies a agency that stands outside the causal closure of any single world. Nora's decision to return is a god-like act incompatible with being a world-bound individual. Lewis's system leaves no room for a subject who can survey the pluriverse and select a residence. This is not a variant of many-worlds quantum mechanics that Lewis overlooked; it is a magical realist device that sacrifices metaphysical consistency for narrative resolution. Lewis dismissed ersatzism because it could not account for the truthmakers of modal claims without primitives; the novel ignores the truthmaker problem entirely in favor of moral utility.

  Ultimately, *The Midnight Library* is metaphysically incoherent by Lewisian standards. It posits concrete accessibility where there must be isolation, and transworld identity where there must be counterparts. Yet, it succeeds where Lewis refuses to tread: it explains why modal realism feels unsatisfying to the human agent. Lewis offers a theory of truth; Haig offers a theory of meaning. The novel demonstrates that while "actual" may be indexical in logic, it is normative in life. We cannot live as Lewisians because we cannot live without privileging our own history. The novel does not survive contact with Lewis as metaphysics, but it survives as a phenomenological critique of it, showing that the price of modal realism is too high for the human heart. We require the Library, even if it cannot exist.
