answer: |-
  This is a sophisticated impasse, and your intuition that the "predictive vs. normative" split is insufficient is correct. Both camps claim normative weight (what *should* happen) and predictive ambition (what *will* happen). The disagreement is not merely verbal, nor is it purely empirical.

  Here is the diagnosis: **This is a case of Normative-Methodological Pluralism masquerading as a Uniqueness Problem.**

  The impasse persists because both you and your friend are trying to win a "Uniqueness Game" that Roth's impossibility results proved is unwinnable. You are fighting over which axiom to sacrifice, but that choice is not mathematical; it is philosophical and contextual. The disagreement is substantive, but it is substantive about the *purpose of the model*, not the math itself.

  Here is the breakdown of the seams, grounded in the axioms and the bargaining stories.

  ### 1. The Ontological Seam: The Nature of Utility
  You noted the Egalitarian solution is often dismissed due to scaling. This is the first fault line.
  *   **Nash & Kalai–Smorodinsky (KS):** Both assume **Ratio Scale Invariance**. Utility is measurable up to a positive affine transformation ($u' = au + b, a > 0$). Interpersonal comparisons of *levels* or *units* are meaningless. Only ratios of gains matter.
  *   **Egalitarian:** Requires **Translation Invariance** (or full comparability). It assumes we can meaningfully say "1 util for Player A is the same 'amount' of welfare as 1 util for Player B."

  **The Disagreement:** If your friend defends Nash/KS against Egalitarian, they are making an ontological claim: *Utility is preference satisfaction, not welfare.* If you defend Egalitarian, you are making a welfare claim: *Bargaining is about distributing well-being.*
  *   **Verdict:** This part of the argument is **Substantive and Normative**. No theorem can settle whether utility functions represent preferences or welfare. If you disagree here, you are modeling different physical systems.

  ### 2. The Axiomatic Seam: Local vs. Global Rationality
  This is the core Nash vs. KS conflict. It hinges on **IIA (Independence of Irrelevant Alternatives)** vs. **Monotonicity**.
  *   **Nash (IIA):** This is a **consistency** condition. It says the solution depends only on the local geometry of the frontier at the solution point (the tangent). If you remove options that weren't chosen, the choice shouldn't change. This treats the bargain as a **static choice object**. It aligns with a view of rationality as *internal consistency*.
  *   **KS (Monotonicity):** This is a **responsiveness** condition. It says the solution depends on the global geometry (the utopia point). If the frontier expands in my favor (my maximum possible gain increases), my actual gain should not decrease. This treats the bargain as a **claim on a resource**. It aligns with a view of rationality as *sensitivity to opportunity*.

  **The Disagreement:** This is **Normative-Methodological**.
  *   The Nash proponent argues: "Why should an option we couldn't agree on anyway affect the deal we *did* make?" (IIA preserves the sanctity of the agreement).
  *   The KS proponent argues: "If my potential leverage increases, even if the frontier shape nearby doesn't change, my bargaining power has objectively improved." (Monotonicity preserves the link between potential and outcome).

  **Diagnosis:** This is not verbal. It is a clash between two valid but incompatible conceptions of what a "solution" represents. Nash represents a **non-cooperative equilibrium** (where threats define the point); KS represents an **arbitration rule** (where potential defines the split).

  ### 3. The Functional Seam: Prediction vs. Prescription
  Your hypothesis was that Nash is predictive and KS is normative. The literature blurs this, but the *foundations* support a refinement of your hunch.
  *   **Nash:** Has a **Non-Cooperative Foundation** (Rubinstein, 1982). If you model the bargaining as an alternating-offer game with vanishing discount factors, the Subgame Perfect Equilibrium converges to the Nash Bargaining Solution. This gives NBS a claim to **descriptive truth** in strategic settings.
  *   **KS:** Lacks a robust non-cooperative foundation in the same sense. It is primarily an **axiomatic/arbitration** solution. It describes what a mediator *should* impose to be fair, not necessarily what two sharks will grind each other down to.

  **The Disagreement:** If your friend argues from the perspective of *strategic interaction*, Nash is the "correct" answer because it is the limit of a game. If you argue from the perspective of *fair division*, KS is the "correct" answer because it satisfies monotonicity.
  *   **Verdict:** This is a **Category Error**. You are arguing over which tool is "correct" without specifying the job.

  ### Why the Impasse Feels Stalled
  The stalemate exists because standard OR/Game Theory pedagogy often presents these solutions as competing candidates for *The* Theory of Bargaining. This creates the illusion that one must be "True."
  *   **The Impossibility Theorem (Roth 1979):** Proves you cannot have IIA, Monotonicity, Efficiency, and Symmetry simultaneously.
  *   **The Consequence:** Choosing a solution is **choosing which axiom to violate**.
  *   **The Stall:** You are trying to prove your preferred axiom is "more true." But axioms are not true or false; they are assumptions. Arguing that IIA is "more rational" than Monotonicity is like arguing that "transitivity is more rational than completeness." It depends on the agent.

  ### What Counts as Progress?
  Given this diagnosis, proving more theorems will not help. You already know the impossibility results. Running experiments might help, but experimental economics (e.g., Roth et al., 1991) has already shown that human behavior varies by culture and context—sometimes matching Nash, sometimes KS, sometimes Egalitarian.

  **Progress requires a shift from Uniqueness to Contextual Mapping.**

  1.  **Stop asking "Which solution is correct?"**
      Start asking "Which institutional environment are we modeling?"
      *   **Strategic/Market Context:** If the bargaining is driven by time discounting and outside options that can be exercised strategically, **Nash** is the appropriate tool (due to the Rubinstein foundation). Here, IIA is a feature, not a bug; it ensures stability against irrelevant threats.
      *   **Arbitration/Policy Context:** If the bargaining is a division of costs/benefits managed by a third party or social norm, **Kalai–Smorodinsky** is the appropriate tool. Here, Monotonicity is essential; a fair arbitrator cannot ignore that one party's potential improved.
      *   **Welfare/Needs Context:** If the utilities are comparable (e.g., dividing money or identical goods), **Egalitarian** is the appropriate tool.

  2.  **Reformulate the Argument:**
      The productive move is to admit that **Rationality is context-dependent.**
      *   Tell your friend: "You are defending IIA because you view bargaining as a **strategic equilibrium**. I am defending Monotonicity because I view bargaining as a **fair division problem**. We are both right, but we are modeling different games."

  3.  **The "Honest Answer":**
      The honest answer is indeed **Pluralism**. The reason it feels stalled is that everyone keeps hunting for a single answer to a question that was never single. The "Theory of Bargaining" is not a singular law of physics; it is a toolkit of solution concepts, each valid under a specific set of normative and institutional constraints.

  **Summary Diagnosis:**
  *   **Is it Verbal?** Partially. You define "Rationality" differently (Consistency vs. Responsiveness).
  *   **Is it Substantive/Formal?** Yes. The ideals are mathematically incompatible (Roth's Theorem).
  *   **Is it Empirical?** Partially. Behavior switches between the two based on framing.
  *   **Is it Normative?** Yes. It depends on whether you value contract stability (Nash) or opportunity sensitivity (KS).

  **Prescription:**
  Declare a ceasefire based on **Domain Specificity**. Agree that Nash is the solution for *non-cooperative strategic bargaining*, and Kalai–Smorodinsky is the solution for *cooperative fair division*. The disagreement isn't about the math; it's about which social situation you think the math describes. Once you specify the situation, the "correct" axiom set selects itself.
