          2.  *Slow Violence:* Structural harm (famine, pollution) vs. direct violence. Does stretching the definition render it useless?
          3.  *The Case Study:* 1690s Provinces. War (30k men, 4 years) vs. Famine (30k elderly, 15 years). Which is more violent? Why? (Intent? Agency? YLL?)
          4.  *Ontological Question:* Is "violence has declined" a factual claim or a definitional stipulation?
          5.  **Ending:** No fake handshake. A real standoff or a genuine concession/adjustment.
