  Bit of an odd request, but I'm a second-year PhD student in philosophy of biology and I need someone to referee a summary for me.

  A friend of mine, who works in an adjacent field and reads a lot of popular science, sent me his version of the units-of-selection debate. He's confident it's basically settled, and settled his way. I think chunks of it are right and chunks of it are doing something sneaky, but I can't reliably tell which is which, and I know I have a dog in this fight, so I don't fully trust my own reaction. Here's what he wrote, roughly word for word:

  'Ever since Darwin, people have argued about whether natural selection works on genes or on whole organisms. Dawkins basically ended that argument by showing that the only thing that ever gets selected is the gene — bodies are just the vehicles genes build to get copied. So group selection is a dead end: Williams had already proved that any trait that helps a group at a cost to the individual gets wiped out by a selfish mutant, which is why you never see genuine altruism in nature. When an animal looks like it's sacrificing itself for others, what's really going on is a gene helping other copies of itself in other bodies. The only live question left is humans, because culture gives us a second kind of replicator, and that's why we're the one species capable of real selflessness.'

  What's nagging me: the jump from "selection can always be described at the level of the gene" to "group selection is a dead end" feels like it's smuggling something, and I can't tell whether that's a real slide or whether I'm just resisting the conclusion. Same with the altruism line — I suspect it's mixing up two senses of altruism, but I'd like to be sure. And in a seminar last term someone used a beetle that lays its eggs in a dung pat as an example — the larvae inside a pat are all siblings competing with each other, and only the survivors make it out into the wider population — and one person said that's exactly the case where group-level effects are real but you still don't need group selection to explain them, while someone else said that was a dodge. I couldn't tell who was right and I still can't.

  Could you take it claim by claim? For each one: what someone working on this would happily accept, what they'd want to hedge or wince at, and what's just wrong or was never established by anyone. If a step is a genuine live disagreement rather than an error, say so and give me the shape of both sides, but keep it short — I'd rather have the three or four things that are definately wrong than a survey of the whole literature. Then tell me whether his overall conclusion (debate's over, all that's left is human culture) actually follows from whatever survives the audit, or whether it's an extra step bolted on.

  One more thing, since I want to use this in a chapter: if I had to write the single sentence about levels of selection that both a hardened genic selectionist and a hardened multilevel selectionist would sign off on, what is it? I'm not after a reading list, I know where the papers are.

  End your answer with a line starting 'Verdict:' — a one-word label from {sound, mostly sound, mixed, mostly misleading, misleading}, then a dash, then that one sentence for my chapter.
