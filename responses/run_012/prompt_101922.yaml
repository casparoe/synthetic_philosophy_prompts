          *   *Mechanism 2: Lack of Specificity.* If neural circuits for language are indistinguishable from circuits for tool use or sequence processing. (Hauser, Chomsky, Fitch's "Faculties of Language" distinction is crucial here: FLN vs. FLB).
          *   *Mechanism 3: Phylogenetic Discontinuity.* If it appeared suddenly (saltation) without intermediate selective steps, it suggests a structural side-effect of a single mutation rather than gradual selection.
          *   *Did they meet the bar?* Pinker/Bloom argued for specificity (aphasias, creoles). Gould/Chomsky (at times) argued for suddenness. Neither fully proved the *architectural necessity*. The "general intelligence" argument is usually weak because language is dissociable (savants, aphasics).

      *   **Section 2: Running it the Other Direction (Vindication or Caution?):**
          *   Does language vindicate Gould? Not really. It shows the *utility* of the critique.
          *   The "Exaptation" loophole. Gould acknowledged byproducts can be co-opted.
          *   If recursion (Chomsky's core) evolved for navigation/social reasoning and was co-opted for language, is it a spandrel or adaptation? It's an exaptation.
