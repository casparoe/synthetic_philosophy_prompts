prompt: |-
  Take the long-running fight over whether language is a biological adaptation or a byproduct of other changes -- the Pinker/Bloom-style argument that language shows complex design so selection must have built it, versus the Gould/Lewontin spandrel line that not everything useful was selected for. Analyze that dispute through the spandrels critique. I dont want the slogan, I want the mechanics: what would actually count as evidence that language is a spandrel rather than an adaptation, and did either side ever come close to meeting that bar? Then run it the other direction -- does the language case vindicate the critique, or does it show the critique is mostly a caution about inference that cant settle a live dispute, especially once you notice a byproduct can get co-opted and become an adaptation later? Finish by saying where the adaptation/byproduct dichotomy is just silent, and whether the debate ever turned on anything testable at all or was really a fight about how much selection you assume before you look.
