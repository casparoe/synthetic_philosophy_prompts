  2.  **Initial Brainstorming & Fact Retrieval:**

      *   *Pinker & Bloom (1990):* "Natural Language and Natural Selection." Argument: Language is too complex, specific, and universal to be a byproduct. It looks designed. Therefore, selection shaped it.
      *   *Gould & Lewontin (1979):* "The Spandrels of San Marco." Argument: Adaptationists assume everything is optimal. Ignore constraints, drift, and architectural byproducts.
      *   *Chomsky's Role:* Often sits in the middle or shifts. Early GB theory looked like a sudden mutation (potentially a spandrel initially). Later Minimalist program suggests efficiency (optimization).
      *   *The "Mechanics" of a Spandrel:* To prove $X$ is a spandrel, you need to show $X$ arises necessarily from the evolution of $Y$ (where $Y$ was selected), without direct selection on $X$. Or, $X$ is a result of drift/constraint.
      *   *Evidence:* Comparative anatomy (do other primates have precursors?), genetics (FOXP2), neural architecture (is language modular or general cognition?), archaeological record (sudden vs. gradual).
      *   *Exaptation:* Gould's out. Something starts as a spandrel, becomes an adaptation. This blurs the line.
      *   *Testability:* Hard to test deep time evolution. Much of it is modeling or inference from current structure.

  3.  **Drafting - Section by Section:**

