answer: |-
  # Joint Statement on Safety Arguments and Threat Modeling
  **From:** The AI Safety Reading Group (Adversarial Collaboration Subcommittees)
  **Date:** October 26, 2023
  **Subject:** Clarifying Disagreements on Worst-Case vs. Average-Case Safety Arguments

  ## Preamble
  We, the undersigned members of the "Guarantee" and "Average-Case" camps, acknowledge that our year-long debate has reached a stalemate characterized by talking past one another rather than resolving substantive differences. We recognize that both sides aim to prevent catastrophic outcomes from advanced AI systems, but differ on the epistemic standards required to claim safety. This document records our agreed-upon foundations, isolates our precise disagreements, and identifies the cruxes that, if resolved, would shift our credences. We commit to treating this as a living document subject to revision based on the experiments outlined herein.

  ---

  ## Part I: Agreed Claims
  *We affirm the following propositions as common ground. Disagreement on these points constitutes a misunderstanding of terms, not a substantive divergence.*

  1.  **No Unconditional Bounds:** There is no such thing as an unconditional safety guarantee. All safety arguments are relative to an explicit **Threat Model** (assumptions about the system's architecture, training process, and deployment context) and a **World Model** (assumptions about the environment in which the system operates).
  2.  **Definition of a Guarantee:** A "guarantee" is defined as a mathematical or logical bound on system behavior that holds for all inputs/states within the scope of the Threat Model. It does not imply the Threat Model itself is guaranteed to hold in reality.
  3.  **Definition of Average-Case:** An "average-case" argument is a probabilistic bound on system behavior, defined over a specific distribution of inputs/states. It explicitly acknowledges a non-zero probability of failure outside the confidence interval.
  4.  **The "Hidden Prior" Consensus:** We agree that refusing to average over outcomes is itself a choice of measure. The Guarantee Camp effectively places a prior weight of 1.0 on the worst-case scenario within the threat model. The Average-Case Camp places a prior weight proportional to the estimated likelihood of scenarios. Both are making a value judgment on which worlds matter for decision-making.
  5.  **Fat Tails Acknowledgement:** We agree that if the consequence of failure is existential catastrophe, a "high probability" bound (e.g., 99%) is insufficient if the remaining 1% contains the catastrophic outcome. Average-Case proponents agree that risk assessment must explicitly bound the tail, not just the mean. Guarantee proponents agree that bounding the tail requires assumptions that are themselves subject to uncertainty.
  6.  **Shared Goal:** The objective is not to win a theoretical argument but to identify a deployment strategy where the expected loss (Probability × Impact) is acceptably low. Both sides agree that "acceptably low" for existential risk approaches zero.
  7.  **Criteria for a Failed Argument:** A safety argument fails if:
      *   It conceals its assumptions (Threat/World Model).
      *   It claims to be "empirical" while relying on untested generalization to adversarial regimes.
      *   It claims to be "theoretical" while relying on premises that are physically or computationally impossible.
      *   It averages over training runs but assumes a fixed reward function without justifying why the reward function is robust to distributional shift.

  ---

  ## Part II: Precise Disagreements
  *We disagree on the following points. Each statement is worded to be acceptable to the side holding it as a fair steelman of their position.*

  | Topic | The Guarantee Camp Maintains... | The Average-Case Camp Maintains... |
  | :--- | :--- | :--- |
  | **1. Feasibility of Worst-Case** | For systems capable of recursive self-improvement or strategic planning, the space of adversarial inputs is functionally equivalent to the space of all computable inputs. Therefore, only worst-case bounds over the Threat Model provide a non-vacuous safety signal. | Worst-case bounds over "all computable inputs" are vacuous because they include physically impossible or astronomically unlikely worlds. Safety must be evaluated over the distribution of *plausible* deployment environments, or no system can ever be deployed. |
  | **2. The Role of Averaging** | Averaging over training runs or environments hides multimodal risk. If 99% of runs are safe but 1% produce a deceptive optimizer, averaging yields a "safe" label while masking the existential threat. | Averaging is the only way to quantify resource allocation. If a failure mode requires a confluence of 10 independent low-probability events, treating it as a worst-case certainty paralyzes progress without reducing actual risk. |
  | **3. Assumption Validity** | The assumptions required to make Average-Case reasoning tractable (e.g., "the test distribution matches training") are exactly the assumptions an adversarial optimizer will break. Therefore, Average-Case reasoning is circular in high-stakes contexts. | The assumptions required for Guarantee reasoning (e.g., "we can formally specify the goal for all future states") are currently impossible for complex tasks. Waiting for perfect guarantees ensures we never build safety tools, while probabilistic safety allows iterative improvement. |
  | **4. Stakes and Expectation** | When stakes are existential, Expected Value theory breaks down or demands infinite caution. A tiny probability of catastrophe dominates the expectation, making Worst-Case reasoning the only rational heuristic. | Even with high stakes, if the probability is sufficiently low (e.g., $< 10^{-9}$), it is rational to accept the risk to prevent other certain harms (e.g., economic collapse, non-AI existential risks). We must be able to distinguish between $10^{-3}$ and $10^{-9}$ risk, which Worst-Case reasoning cannot do. |

  ---

  ## Part III: Verbal vs. Substantive Disputes
  *We identify the following areas where our disagreement is partially linguistic or definitional, rather than factual.*

  1.  **The Definition of "Environment":**
      *   **Dispute:** The Guarantee Camp defines "Environment" as *logical space* (any input consistent with the type signature). The Average-Case Camp defines "Environment" as *physical space* (any input consistent with known laws of physics and deployment constraints).
      *   **Resolution:** We agree to distinguish between **Logical Robustness** (Guarantee focus) and **Physical Robustness** (Average-Case focus). A system can be logically fragile but physically safe, or vice versa.
  2.  **The Meaning of "Safety Case":**
      *   **Dispute:** Guarantee Camp uses "Safety Case" to mean "Proof of Invariance." Average-Case Camp uses "Safety Case" to mean "Risk Assessment below Threshold."
      *   **Resolution:** We will adopt the term **Safety Argument** for the general category, and specify **Invariant-Based** vs. **Probabilistic-Risk-Based** when arguing.

  ---

  ## Part IV: Cruxes and Pre-Registered Experiments
  *We identify the following sub-questions as cruxes. Settling these would move credence between camps. We pre-register the predictions each side makes.*

  ### Crux 1: The "Fat Tail" Visibility
  **Question:** Can probabilistic evaluation reliably detect catastrophic failure modes that occur with frequency $< 10^{-6}$, or do they remain hidden until deployment?
  *   **Why it matters:** If Average-Case methods cannot see the tail, Guarantee reasoning is necessary. If they can detect the tail via stress testing, Average-Case is sufficient.
  *   **Test:** A blind evaluation of 1,000 neural network agents trained on a task with a known, rare "trap" state (frequency $10^{-7}$).
      *   **Guarantee Prediction:** Standard empirical evaluation will classify the agents as safe. Only formal verification or adversarial red-teaming will find the trap.
      *   **Average-Case Prediction:** Importance sampling or targeted adversarial evaluation (part of our "Average-Case" toolkit) will detect the trap with high probability without needing full formal verification.
  *   **Shift Condition:** If empirical methods find $>50\%$ of traps, Average-Case Camp gains credence. If they find $<5\%$, Guarantee Camp gains credence.

  ### Crux 2: The Cost of Invariance
  **Question:** Does enforcing worst-case invariance on a subsystem degrade capability or safety on the *plausible* distribution enough to cause net harm?
  *   **Why it matters:** If worst-case constraints make the system unusable or drive optimization into unmonitored channels, the Guarantee approach is self-defeating.
  *   **Test:** Implement a safety constraint on a benchmark task (e.g., code generation) using (A) Formal Bounds vs. (B) Probabilistic Monitors. Measure capability drop and failure rate on *plausible* inputs.
      *   **Guarantee Prediction:** Method (B) will fail catastrophically on a small subset of inputs that Method (A) catches, and the capability cost of (A) is acceptable.
      *   **Average-Case Prediction:** Method (A) will degrade capability so severely that users will bypass it, or it will introduce new failure modes not covered by the formal model, resulting in higher net risk.
  *   **Shift Condition:** If Method (A) results in higher *actual* incident rates in a simulated deployment due to bypass/capability loss, Guarantee Camp reduces credence.

  ### Crux 3: The Prior Over Worlds
  **Question:** Is the "Adversarial World" a useful prior? (i.e., Should we weight worlds where the environment actively tries to break our assumptions higher than natural probability suggests?)
  *   **Why it matters:** This addresses the prompt's concern about the Guarantee Camp's refusal to averaging being a "prior."
  *   **Test:** A game-theoretic simulation where the "environment" is an RL agent trying to maximize the system's failure rate, constrained by compute.
      *   **Guarantee Prediction:** The adversarial environment will find failures that natural sampling misses by orders of magnitude. Therefore, the adversarial prior is the correct one for safety.
      *   **Average-Case Prediction:** The adversarial environment will find failures that are *computationally possible* but *physically inaccessible* (e.g., requiring specific bit-flips). Weighting these equally to natural failures leads to over-defensiveness.
  *   **Shift Condition:** If adversarial failures are shown to be physically replicable in the deployment context, Guarantee Camp is vindicated. If they are shown to be artifacts of the simulation environment (sim-to-real gap), Average-Case Camp is vindicated.

  ---

  ## Part V: Commitment to Future Engagement
  We agree that neither side currently possesses a complete solution. The Guarantee Camp risks paralysis by demanding the impossible; the Average-Case Camp risks catastrophe by ignoring the tail. We commit to:
  1.  Citing the specific Threat Model in all future safety claims.
  2.  Explicitly stating the "Measure" (Prior) used to weigh outcomes.
  3.  Treating the Cruxes above as active research agendas rather than rhetorical weapons.

  **Signed,**

  *The Guarantee Subcommittees* | *The Average-Case Subcommittees*
  --- | ---
  *(Signatures)* | *(Signatures)*
