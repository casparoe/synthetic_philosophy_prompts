      *   **Part 3: Addressing the Three Specific Concerns:**
          *   *1. Causal Influence & Social Kinds:* Astrology claims *natural* causation from stars. Generations claim *social* causation from context. This is the biggest break. A "social kind" (Ian Hacking's concept) exists because we classify it. Money is real because we treat it as real. Generations might be social kinds. Astrology signs aren't really social kinds in the same way; being a "Leo" doesn't change your legal status or economic opportunities systematically in the way being a "Boomer" does (e.g., Social Security eligibility, hiring bias).
