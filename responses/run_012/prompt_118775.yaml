answer: |-
  **Title:** The Epistemic Duty of Deployment: Why Liability Must Follow Legibility, Not Proximity

  **Introduction**

  The prevailing discourse on autonomous liability is obsessed with a ghost: the "human in the loop." When a machine harms a person, legal and ethical frameworks scramble to locate a human agent whose negligence can be proximate to the impact. This is the "responsibility gap" industry standard. It assumes that for liability to exist, a human must have been *in control* at the moment of failure. This paper argues that this assumption is not only obsolete but unjust. In complex socio-technical systems, control is distributed, and momentary proximity to harm is often a matter of random chance rather than causal significance.

  I propose a shift in the locus of liability. Responsibility for harms caused by autonomous systems should not attach to the agent nearest to the harm in time (the operator), but to the agent who had the *cheapest available opportunity* to make that class of harm *legible in advance*. Liability must follow the capacity to predict and reveal risk, not the misfortune of being the last link in the chain. This principle of **Anticipatory Legibility** resolves the indeterminacy of current claims while avoiding the trap of mere strict liability based on solvency.

  **The Failure of Proximity**

  To understand why the current model fails, we must look at the anatomy of the "no-fault" accident. Consider the case of the sidewalk delivery robot that fractured a pedestrian's wrist. The facts are sterile and damning:
  1.  **The Vendor:** Provided perception software that functioned within specified parameters.
  2.  **The Deployer:** Integrated the software and set operational protocols (one remote operator monitoring fourteen units).
  3.  **The Operator:** Was humanly incapable of monitoring fourteen video feeds simultaneously and was looking elsewhere during the critical twenty seconds.
  4.  **The Victim:** Suffered physical harm and financial loss.

  Under current liability frameworks, the operator is the primary target. They were the "last clear chance." Yet, blaming the operator is a category error. A human monitoring fourteen autonomous feeds is not a controller; they are a system component functioning exactly as the system design predicted they would fail. To blame the operator is to blame a fuse for blowing when the circuit is overloaded. It punishes the symptom while insulating the design choice that made the symptom inevitable.

  Conversely, the software vendor escapes liability by retreating into the black box of "performance specifications." If the code did what the code said it would do, the vendor claims immunity from the context of its use. This leaves the victim stranded in the gap between a design that works in isolation and a deployment that fails in reality.

  **The Principle of Anticipatory Legibility**

  The core question of liability in automation should not be "Who broke it?" but "Who was best positioned to know it could break?"

  I define **Anticipatory Legibility** as the duty to render system failure modes visible and predictable prior to deployment. In any autonomous stack, there is one actor who sits at the nexus of component capability and environmental reality. This actor has the "cheapest available opportunity" to gather data, simulate edge cases, and recognize that a specific configuration creates a specific risk profile.

  This criterion is sharp. It does not demand omniscience. It demands that the party with the greatest access to system integration data must bear the cost of the risks they failed to identify. If a risk was theoretically discoverable through reasonable testing, simulation, or operational piloting, it was *legible*. If the entity deploying the system did not make it legible, they absorb the liability.

  **Deciding the File: The Broken Wrist**

  Applying Anticipatory Legibility to the sidewalk robot file yields a decisive outcome.

  *   **The Operator:** Did they have the opportunity to make the harm legible? No. Their role is reactive. They cannot legibilize a system flaw while they are drowning in its data output. They are the resource being managed, not the manager of risk.
  *   **The Software Vendor:** Did they have the opportunity? Partially. However, their contract specified performance parameters, not deployment density. Unless it can be proven they concealed known failure rates regarding pedestrian crossing detection, they are suppliers of a tool, not architects of the workflow.
  *   **The Robot Company (Deployer):** Did they have the opportunity? Yes. This is the decisive factor. The Robot Company chose the ratio of one operator to fourteen robots. This is a variable entirely within their control. They had the cheapest available opportunity to run a pilot program where they measured operator attention spans against incident rates. They could have made it legible that "14:1" results in "20-second blind spots at crossings."

  Therefore, the Robot Company pays. Not because they were negligent in the traditional sense, but because they claimed the authority to deploy the system without claiming the responsibility to understand its systemic failure modes. They privatized the efficiency gains of the 14:1 ratio while socializing the risk of the blind spot. Under Anticipatory Legibility, the bill for the broken wrist goes to the Deployer.

  **The "Deep Pockets" Objection**

  The most potent objection to this thesis is that it is merely a sophisticated repackaging of "blame whoever has the most money." If the criterion is "cheapest available opportunity," critics will argue this inevitably points to the wealthiest corporation, regardless of actual fault. It turns liability into a tax on capital rather than a judgment on conduct.

  This objection confuses *solvency* with *epistemic access*.

  If liability were based purely on wealth, a wealthy bystander with no connection to the robot would be a valid target. They are not. The "cheapest available opportunity" is not defined by bank balance, but by structural position within the technology's lifecycle. A small startup deploying the same 14:1 robot fleet would be just as liable as a multinational insurer. In fact, under this framework, a smaller deployer might be held to a *higher* standard of legibility because they lack the resources to claim their testing protocols were "industry standard."

  However, we must be honest about the correlation. It is true that the entities with the epistemic access to make harms legible are usually the entities with capital. This is not a bug; it is a feature. The capacity to gather data, run simulations, and model risk is expensive. If you want the right to profit from automation, you must purchase the knowledge of its dangers.

  If we reject this, we return to the status quo where the costs of innovation are externalized onto the public (the pedestrian with the broken wrist) while the profits are internalized by the firm. Anticipatory Legibility does not punish wealth; it punishes *ignorance that was purchasable.* It forces the entity with the resources to learn the truth to pay for the times they chose not to.

  **Conclusion**

  The "responsibility gap" is not a metaphysical mystery; it is an administrative convenience. It allows companies to deploy complex systems while pretending that human oversight can patch algorithmic blind spots. By shifting liability to the agent with the cheapest available opportunity to make harm legible in advance, we close the gap not by finding a human to blame, but by incentivizing the production of safety knowledge.

  In the case of the broken wrist, the operator is a scapegoat, the vendor is a supplier, but the Deployer is the architect of the risk. They had the data, they set the ratio, and they failed to make the danger visible before it became physical. They must pay. This ensures that the next time a company calculates the cost of safety versus the cost of liability, the equation reflects the true human cost of their blindness. Liability must not be about who touched the machine last. It must be about who knew the machine best, and failed to tell us what it could do.
