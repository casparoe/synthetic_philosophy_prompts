answer: |-
  Based on the record you provided, your friend's decisions are not random; they follow a coherent logic. However, that logic could be interpreted through different ethical or strategic lenses. Here are the three candidate principles that fit her past three years of decisions equally well, their predictions for the new proposal, and how to settle the bet.

  ### Candidate Principle 1: The "Counterfactual Gap" (Neglectedness)
  **The Rule:** Fund projects where capital is the binding constraint. Prioritize areas that are *neglected* by other funders, provided they are not impossible. Your dollar should go where it is the marginal dollar needed to make something happen that otherwise wouldn't.
  *   **Fit with Past:**
      *   *Funded 1 & 2:* Both were "almost no other funder touches" or "almost entirely unfunded."
      *   *Rejected 1:* "Many foundations are active" (Capital is not scarce).
      *   *Rejected 2:* "Almost no one working on it" (Neglected), but money wouldn't help because it was intractable.
  *   **Prediction for New Proposal:** **REJECT.**
      *   *Reasoning:* The proposal draws "enormous government and philanthropic funding." The capital gap is already filled. Her money would not be counterfactual.

  ### Candidate Principle 2: The "Absolute Impact" (Utilitarianism)
  **The Rule:** Fund projects that maximize the total expected good (e.g., lives saved, value created), regardless of who else is funding them. Neglectedness is only a proxy for efficiency, not a hard rule.
  *   **Fit with Past:**
      *   *Funded 1 & 2:* High impact (fatal disease cured, physics breakthrough "matters enormously").
      *   *Rejected 2:* Intractable problems yield zero impact.
      *   *Rejected 1:* Scaling education in a *wealthy* country often has lower marginal utility per dollar than curing fatal diseases or enabling scientific breakthroughs. She may simply rank this impact lower than the others.
  *   **Prediction for New Proposal:** **ACCEPT.**
      *   *Reasoning:* The prompt states the "projected number of lives saved is very large." If her goal is raw utility, a crowded field doesn't matter if the absolute return is higher than her other options.

  ### Candidate Principle 3: The "Catalytic Discovery" (Novelty)
  **The Rule:** Fund *discovery* and *development*, not *implementation* or *scaling*. Fund the creation of new tools or knowledge, not the deployment of existing ones.
  *   **Fit with Past:**
      *   *Funded 1 & 2:* Both involve creating something new (a therapy, a physics breakthrough).
      *   *Rejected 1:* Explicitly a proposal to "scale up" an existing program.
      *   *Rejected 2:* Intractable problems offer no path to discovery.
  *   **Prediction for New Proposal:** **REJECT.**
      *   *Reasoning:* The science is "unusually far advanced." This suggests the discovery phase is mostly complete, and the project is now about optimization or deployment. This falls into the "scaling" bucket, not the "catalytic discovery" bucket.

  ---

  ### Which One Should You Bet On?
  **Bet on Principle 1: The "Counterfactual Gap" (Neglectedness).**

  **Why:**
  While all three fit the data, Principle 1 relies on the fewest assumptions about her internal value judgments.
  *   To make Principle 2 (Impact) work, you have to assume she internally values "rare childhood disease" and "speculative physics" higher than "education in a wealthy country." That is a plausible worldview (common in Effective Altruism circles), but it is an assumption.
  *   To make Principle 1 work, you only need to look at the external landscape. The explicit reason given for Rejection 1 was that "many foundations are active." This is a direct observation of **crowding**, not a judgment on the value of education. It signals that the *presence of other funders* was the dealbreaker, not the *quality of the intervention*.

  Since she explicitly cited crowding as a reason to reject a high-evidence project in the past, she is most likely to cite crowding as a reason to reject this high-impact project now.

  ### The Decisive Test Case
  To cleanly tell **Counterfactual Gap** (Predicts Reject) from **Absolute Impact** (Predicts Accept), propose the following scenario to her:

  **The Case:**
  > "A proposal to fund the final 10% of a vaccine distribution network in a developing country. It is proven to save 50,000 lives per year. However, 90% of the funding is already secured by large governments and NGOs, and the project would likely proceed without you."

  **The Verdict:**
  *   **If she Rejects:** She follows the **Counterfactual Gap**. Her money must change the outcome, not just add to the total. (This confirms your bet).
  *   **If she Accepts:** She follows **Absolute Impact**. She cares about the lives saved, regardless of whether she was necessary to save them.
