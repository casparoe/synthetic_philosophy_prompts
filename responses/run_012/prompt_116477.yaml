answer: |-
  Your intuition is spot-on, and your friend who took that philosophy class is right about the specific distinction they mentioned. The book you're reading is doing what popular philosophy books often do: taking a complex, technical ethical framework and sanding down the rough edges to make a punchy argument.

  The summary you provided is **textually accurate** regarding Kant's basic premises, but it is **philosophically aggressive** in how it applies them to modern contexts like factory farming.

  Here is the sentence-by-sentence breakdown of what a Kant scholar would say, followed by the specific answers to your questions about factory farming and the "morally invisible" claim.

  ### Sentence-by-Sentence Breakdown

  **1. "Kant said animals can't reason and don't know that they exist, so they aren't persons..."**
  *   **Verdict:** **Nod.**
  *   **Why:** This is the bedrock of Kant's ethics. For Kant, "personhood" isn't about being human; it's about being a *rational agent* capable of autonomy (making free moral choices). Because animals operate on instinct and inclination rather than rational moral law, they are not "persons." They are "things."

  **2. "...and that means they have no moral standing at all -- for Kant morality is strictly a deal between human beings and animals are just tools."**
  *   **Verdict:** **Wince.**
  *   **Why:** This is technically true but misleadingly blunt. Kant does say animals are "things" and we have no direct duties *to* them. However, calling them "just tools" like a hammer suggests they have no internal value. Kant acknowledges they are *sentient* things. They feel pain. They aren't moral *partners*, but they aren't morally *inert* either. They occupy a middle ground: they are objects of moral *concern*, just not moral *recipients*.

  **3. "He did say you shouldn't torment them, but the reason has nothing to do with them: being cruel to animals hardens you, so it's really a duty you have to yourself, and the animal's own pain is beside the point."**
  *   **Verdict:** **Nod (with a caveat).**
  *   **Why:** This is the famous "Indirect Duty" view. We have duties *regarding* animals, but the duty is owed *to humanity* (specifically, to your own moral character). The caveat is the phrase "beside the point." The animal's pain is the *trigger* for the duty, even if it isn't the *ground* of the duty. You can't ignore the pain; you have to attend to it, even if the reason you attend to it is to protect your own soul.

  **4. "The book's punchline is that a consistent Kantian has no objection to factory farming as long as the people running it and eating the meat don't turn into cruel people..."**
  *   **Verdict:** **Flat Out Wrong (or at least highly debatable).**
  *   **Why:** This is where the book overplays its hand. While a *strict, literal* reading of Kant might allow this, most Kantian scholars argue that factory farming *inherently* violates the duty to oneself. Why? because it requires a massive, systemic numbing of empathy. To run a factory farm, you have to actively ignore suffering on an industrial scale. A Kantian would argue this inevitably "hardens" the human heart. You cannot process suffering on that scale without damaging your moral capacity. So, a *consistent* Kantian should actually object to factory farming, not because of the cow, but because of what the system does to the worker and the consumer.

  **5. "...and that Kant's view is the granddaddy of the whole attitude that animals are morally invisible."**
  *   **Verdict:** **Wince.**
  *   **Why:** "Invisible" is too strong. Kant made animals highly *visible* as barometers for human morality. He didn't say "ignore them"; he said "watch how you treat them, because it tells us who *you* are." He is the granddaddy of the view that animals have no *rights*, but not that they have no *significance*.

  ### The Crucial Distinction: Duties *To* vs. Duties *Regarding*

  Your friend was right. This is the technical engine of Kant's view.

  *   **Duties To:** I owe you something because you have rights. If I hurt you, I violate *you*. (This applies to humans).
  *   **Duties Regarding:** I must act a certain way involving you, because if I don't, I violate *myself* or *humanity*. (This applies to animals).

  The book steamrolls this by implying that because the duty isn't *to* the animal, the animal doesn't matter. But for Kant, the action required is often the same. You still shouldn't kick the dog. The *reason* is different, but the *rule* is similar.

  ### What is the Corrected View? (What are we actually allowed to do?)

  If we strip away the book's caricature and look at what Kant actually commits to, here is the argument for how we must treat animals:

  **1. No Cruelty for Sport or Whim**
  Kant explicitly forbids hurting animals for fun. Shooting a dog because you are bored, or beating a horse for no reason, is forbidden. Why? Because it damages your capacity for sympathy, which you need to be a good person to other humans.

  **2. Gratitude for Service**
  This is the part the book almost certainly left out. Kant argues we have a specific duty of gratitude to animals that have served us.
  *   *The Old Horse:* You cannot work a horse until it drops and then discard it. You have a duty to care for it in its old age because it served you.
  *   *The Faithful Dog:* Kant famously said a man who shoots his old dog because it can no longer hunt is violating a duty.
  *   *Implication:* This creates a "contract of service." If you use an animal, you incur a debt of care toward it.

  **3. Necessity vs. Luxury**
  Kant allows using animals for human ends (food, labor, clothing) *if* it is necessary. However, he implies that causing suffering for mere luxury or vanity is much harder to justify because the "hardening of the heart" is less excusable when the human need isn't urgent.

  **4. The "Systemic Cruelty" Problem (Addressing Factory Farming)**
  While Kant didn't know about factory farming, his principle of "duties regarding animals" creates a problem for it.
  *   **The Argument:** If my duty is to maintain my own moral sensitivity, I cannot participate in a system that hides suffering from me. Factory farming relies on the consumer *not knowing* or *not thinking about* the pain involved.
  *   **The Kantian Verdict:** A Kantian should argue that buying factory-farmed meat is a form of self-deception. You are paying someone else to be cruel so you don't have to feel like you are being cruel. This corrupts your moral honesty. Therefore, a consistent Kantian should avoid systems that rely on hidden cruelty.

  ### Is it fair to call Kant the source of "Animals are Morally Invisible"?

  It is a **cheap shot**, but an understandable one.

  *   **Why it's a cheap shot:** Kant didn't tell people to ignore animals. He told them to be *kind* to animals, just for a different reason than we might expect today. He put animal welfare on the moral map, even if he didn't give animals their own seat at the table.
  *   **Why the book says it:** In the modern context, saying "animals have no rights" functions the same way as "animals are invisible." If an animal has no standing, its interests can always be trumped by a human's trivial interest (e.g., "I like the taste of this burger" vs. "The cow wants to live"). In practice, this leads to invisibility.

  ### Summary for your Book Club

  If you want to bring this up in your discussion, here is the core argument:

  1.  **The book is right on the theory:** Kant denies animals direct moral rights.
  2.  **The book is wrong on the practice:** Kant's system forbids more than the book admits. It forbids cruelty, demands gratitude for service, and arguably forbids participating in systems of hidden suffering (factory farming) because that corrupts the human moral character.
  3.  **The "Health vs. Moral" question:** For Kant, eating meat isn't immoral in itself (since animals are means). However, *how* that meat is produced matters morally. If eating meat requires you to ignore systemic cruelty, it becomes a moral failing *for you*, regardless of the animal.

  So, you aren't crazy for feeling the summary slid over something. It treated Kant's "Indirect Duties" as a loophole to do whatever we want, when Kant intended them as a strict leash on human behavior.
