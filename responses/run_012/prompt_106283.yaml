  The disagreement is therefore structural and bedrock simultaneously. It is structural because it concerns the function mapping experiences to value (linear vs. stepped). It is bedrock because those functions derive from pre-theoretical intuitions about identity and community. The language is shared, but the grammar of morality is not. This explains the circularity: each side demands the other justify a starting point. Neither can, because these are the points from which justification begins. The question may be ill-posed if it assumes a single metric of 'worse' exists independently of these frameworks. Perhaps 'worse' is indexical. For aggregators, it indexes to the universe's total state. For thresholders, it indexes to the individual's fate. This isn't mere semantics; it reflects divergent ontologies. The aggregator sees a cloud of pain; the thresher sees distinct victims. Thus, the verbal difference is a symptom of the bedrock split. Additionally, the status of reasons is contested. Aggregators see reasons as atomistic; thresholders see them as holistic. A speck is a reason only in isolation; in a crowd facing torture, it vanishes. This holism rejects the aggregator's reductionism. Ultimately, the stalemate is robust because it is multi-layered. It is not one thing, but a knot of semantic, structural, and intuitive strands. Pulling one tightens the others.

  Running my probe

  When you shrink the numbers to a realizable 10^20, the disagreement does not vanish; it hardens. The aggregators still insist the total sum dictates the outcome, now arguing from public health analogies rather than pure math. The thresholders still insist torture is lexically worse, now arguing from rights rather than absurdity. This suggests your hunch is mostly dead: the unrealizable number is not the primary driver of the conflict. The core clash survives contact with reality.

  However, the probe reveals the huge numbers were load-bearing for the *rhetoric*, not the logic. At 3^^^3, aggregators hide behind mathematical necessity, and thresholders cry physical impossibility. At 10^20, the aggregator view looks more pragmatic (policy), while the thresher view looks more rigid (absolutism). The stalemate loses its metaphysical camouflage and becomes a plain political struggle between efficiency and integrity. The probe shows the dispute isn't about uninstantiable outcomes, but the numbers allowed both sides to avoid practical compromise. The conflict is robust, but the absurdity amplified the intensity by removing empirical constraints.

  What would count as progress

  Progress would not be a verdict, but a formal mapping of the incompatibility. A proof showing that no value function can satisfy both the Continuity Axiom and Lexical Priority without introducing arbitrariness elsewhere would force a choice. This would shift the debate from "who is right" to "which axiom do we sacrifice?" Alternatively, reframing the question from metaphysical 'worse' to functional 'decision procedure' could help. If we ask which framework yields more stable societies rather than which matches moral truth, the circle breaks. Progress is recognizing the trade-off between consistency and integrity, not solving it.
