  2.  **Deconstruct the Core Tension:**

      *   The core tension is between *Material Agency* (Earth Science view: physics/biology happened) and *Human Agency/Context* (History view: people made choices within/against those constraints).
      *   The "Environmental Determinism" trap: Saying "The climate made Society A fail and Society B succeed" implies inherent superiority or inevitability.
      *   The "Scenery" trap: Saying "During the cold winter, the King marched..." ignores that the cold *stopped* the march.
      *   The Solution needs to navigate *interaction* without erasing *inequality* or *physics*.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Name:* The Actor-Network Label Protocol (ANLP) - maybe too academic? Let's call it the **Material-Historical Interaction Protocol (MHIP)**.
      *   *Verdicts:* Need a small fixed set.
          1.  **Green (Actor):** Non-human is the primary driver, human response secondary.
          2.  **Amber (Interactor):** Non-human set conditions, human choice determined outcome.
          3.  **Red (Context):** Non-human is background only (rare for this gallery, but needed for safety).
          4.  **Flag (Review):** Too controversial/complex for standard procedure.
      *   *Questions:*
          1.  Is the physical mechanism settled? (Science check)
          2.  Does the claim explain divergence between peoples? (Determinism check)
          3.  Is the "natural" name hiding human infrastructure? (Political Ecology check)
          4.  Grammar check.
      *   *Grammar Rule:* Active voice for non-humans *only* if they exerted force independent of human intent. Passive or prepositional if they were managed/weaponized.
      *   *Evidence/Historiography Rule:* If evidence settled/historiography not -> Use "Evidence suggests..." If evidence not/historiography settled -> Do not write label (Flag).
      *   *Divergence Screen:* Never say "X caused Group A to fail." Say "X constrained Group A's options."
      *   *Shorthand Screen:* If the "natural" thing exists due to human systems (e.g., malaria in irrigation canals), name the system.

  4.  **Refining the Procedure for Constraints:**

      *   *Time:* 10 minutes. Questions must be binary (Yes/No).
      *   *Word Count:* 60 words max. Templates are essential.
      *   *Reading Level:* Simple syntax.
      *   *Hand-offs:* Community Panel gets the "Divergence" flags. External Historian gets the "Historiography" flags.

  5.  **Developing the Test Cases:**

      *   *Case 1: 536 Dust/Justinianic Plague.*
          *   Science: Settled (volcanic winter, Y. pestis).
          *   History: Debated (did it cause the fall of Rome? Or just stress it?).
          *   Risk: Determinism (Rome fell because of nature).
          *   Verdict: Amber (Interactor).
      *   *Case 2: 1815 Tambora/1816 Harvest.*
          *   Science: Settled.
          *   History: Settled (global cooling, crop failure).
          *   Risk: Low. Clear physical impact.
          *   Verdict: Green (Actor).
      *   *Case 3: 1942 Egypt Malaria (Mitchell).*
          *   Argument: British war policy (dykes/irrigation) caused malaria more than combat.
          *   Risk: High. This is political. It blames specific human decisions masked as "nature."
          *   Constraint Check: The prompt says "I expect one of the three to come out in a way I will not like... flagged and argued rather than softened."
          *   *Decision:* This is the one to flag/argue. Mitchell's argument is that calling it "malaria" hides the British engineering. The procedure *must* catch this. If the procedure works, it forces the label to name the British Army, not the mosquito. The user (Consulting Historian) might want to use the "Mosquito" hook, but the procedure should force the "British Engineering" reality. I need to make sure I don't soften this. I will flag it as requiring the "Shorthand Screen" which forces a rewrite that might annoy the "Natural History" branding but is historically accurate. Actually, the prompt says "I want that one flagged and argued." I will produce the label the procedure dictates, which will likely be contentious, and explain why.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Structure:* Keep it tight. Flowchart style text.
