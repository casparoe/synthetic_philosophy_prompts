answer: |-
  # The Material-Historical Interaction Protocol (MHIP)

  **Purpose:** To generate 60-word labels that acknowledge non-human agency without erasing human responsibility or sliding into environmental determinism.
  **Users:** Label Writers (10 minutes/label).
  **Constraints:** 60 words max, 14-year-old reading level, no citations.

  ## Part 1: The Decision Questions

  Run these questions in order. A "Stop" sends the draft to a human reviewer. A "Go" moves to the next question.

  **Q1: The Physics Check (Evidence)**
  *   **Question:** Is the physical mechanism (e.g., dust blocking sun, virus transmission) settled science?
  *   **Yes:** Go to Q2.
  *   **No:** **STOP.** Send to *Lead Curator*. Do not write label.
  *   **Rationale:** We do not display scientific debate as historical fact.

  **Q2: The Divergence Screen (Values)**
  *   **Question:** Does the draft claim this event explains why one people/nation succeeded and another failed?
  *   **Yes:** **STOP.** Send to *Community Advisory Panel* (if Plague/Conquest) or *External Historian* (all others).
  *   **No:** Go to Q3.
  *   **Rationale:** Non-human factors constrain options; they do not rank civilizations. This is a values judgment, not evidence.

  **Q3: The Infrastructure Screen (Shorthand)**
  *   **Question:** Is the "natural" actor (mosquito, flood, pest) present or potent primarily because of specific human engineering, policy, or neglect?
  *   **Yes:** Go to **Verdict C**.
  *   **No:** Go to Q4.
  *   **Rationale:** Calling a dam-breeding mosquito "nature" hides the engineer who built the dam.

  **Q4: The Historiography Check (Evidence vs. Interpretation)**
  *   **Question:** Is the *historical impact* (e.g., "caused the fall of Rome") debated by historians, even if the science is settled?
  *   **Yes:** Go to **Verdict B**.
  *   **No:** Go to **Verdict A**.

  ---

  ## Part 2: Grammar and Syntax Rules

  **Rule 1: The Subject Test**
  *   **Permitted:** Non-human subjects only when the force was independent of human intent (e.g., "The volcano erupted").
  *   **Forbidden:** Non-human subjects when the force was managed or weaponized (e.g., do not write "The mosquitoes defeated the army" if the army dug the ditches that bred them).
  *   **Correction:** Use prepositional phrases for background constraints ("Amidst drought...", "Under volcanic skies...").

  **Rule 2: The Verb Limit**
  *   Non-human actors may *act* (cool, burn, spread, block).
  *   Non-human actors may not *decide* (choose, force, allow, punish).

  ---

  ## Part 3: Verdicts and Licensed Wording

  Select one verdict based on the Questions above. Use the corresponding template.

  **Verdict A: The Force (Science Settled, History Settled, No Human Engineering)**
  *   **Use when:** Q1=Yes, Q2=No, Q3=No, Q4=No.
  *   **Template:** "The [Non-Human] [Active Verb] the [Environment]. [Human Group] faced [Consequence]. Despite [Human Response], the [Outcome] occurred. This event reshaped [Historical Scope] without erasing human choice."
  *   **Agency:** Non-human is Subject.

  **Verdict B: The Friction (Science Settled, History Debated)**
  *   **Use when:** Q1=Yes, Q2=No, Q3=No, Q4=Yes.
  *   **Template:** "Evidence shows the [Non-Human] [Active Verb] the [Environment]. Historians debate the impact on [Human Group]. Some argue it caused [Outcome]; others cite [Human Factor]. The [Non-Human] set the terms; humans wrote the result."
  *   **Agency:** Shared. Non-human sets terms, humans write result.

  **Verdict C: The Fabric (Human Engineering Created the "Natural" Threat)**
  *   **Use when:** Q3=Yes.
  *   **Template:** "[Human Group] built [Infrastructure]. This unleashed [Non-Human]. The resulting [Event] killed more than [Comparison]. Nature acted, but human design made the killing possible. The [Non-Human] was the weapon; the [Human Group] held the handle."
  *   **Agency:** Human is Subject. Non-human is Tool.

  **Verdict D: The Stop (Review Required)**
  *   **Use when:** Q1=No or Q2=Yes.
  *   **Action:** Do not draft. File incident report to Reviewer listed in Questions.

  ---

  ## Part 4: Procedure Limitations

  Even if followed perfectly, a good historian will object to labels produced by MHIP because:
  1.  **Fragmentation:** 60 words cannot capture feedback loops (e.g., how famine causes war which causes more famine).
  2.  **Object Fetishism:** The procedure still centers the "Object" (volcano, mosquito) because it is a museum gallery, inevitably reifying the very separation of nature/culture it seeks to bridge.
  3.  **Moral Neutrality:** The "Friction" template (Verdict B) creates false equivalence between material evidence and historical interpretation to avoid determinism.
  4.  **Temporal Compression:** It treats events as singular moments rather than processes.

  ---

  ## Part 5: Test Cases

  ### Case 1: 536–541 Volcanic Dust & Justinianic Plague
  *   **Q1 (Physics):** Yes (Ice cores confirm dust; DNA confirms *Y. pestis*).
  *   **Q2 (Divergence):** No (Claim is not about ranking peoples, but imperial stress).
  *   **Q3 (Infrastructure):** No (Volcano is not engineered).
  *   **Q4 (Historiography):** Yes (Did it *cause* the fall of Rome/Byzantium, or just stress it? Heavily debated).
  *   **Verdict:** **B (The Friction)**

  **Draft Label (58 words):**
  > Evidence shows volcanic dust cooled the Mediterranean sky. Crops failed; rats carried plague into Constantinople. Historians debate the impact on the Byzantine Empire. Some argue it caused imperial collapse; others cite political corruption. The dust set the terms; humans wrote the result. Justinian survived, but his reconquest died in the cold.

  ### Case 2: 1815 Tambora & 1816 Harvest Failures
  *   **Q1 (Physics):** Yes (Global temperature drop settled).
  *   **Q2 (Divergence):** No (Global event, not used to rank nations).
  *   **Q3 (Infrastructure):** No (Volcano is not engineered).
  *   **Q4 (Historiography):** No (Direct link between ash, cold, and harvest failure is settled).
  *   **Verdict:** **A (The Force)**

  **Draft Label (56 words):**
  > Mount Tambora erupted and blocked the sun. Global temperatures fell. In Europe and North America, frost killed summer crops. Farmers faced starvation and migration. Despite new trade routes, the famine spread. This event reshaped the nineteenth century without erasing human choice. The volcano acted; the world reacted. Weather became history.

  ### Case 3: 1942 Egypt Malaria & Famine (Timothy Mitchell Argument)
  *   **Q1 (Physics):** Yes (Mosquito transmission settled).
  *   **Q2 (Divergence):** No (Argument is about policy, not racial superiority).
  *   **Q3 (Infrastructure):** **YES.** (Mitchell argues British war-time irrigation/dyke policy created the breeding grounds).
  *   **Verdict:** **C (The Fabric)**

  **Draft Label (60 words):**
  > British engineers built irrigation dykes to support the war effort. This unleashed malaria-carrying mosquitoes across the Nile Delta. The resulting epidemic killed more Egyptians than Axis bombs. Nature acted, but human design made the killing possible. The mosquito was the weapon; the British Army held the handle. Famine was not natural; it was engineered.

  ---

  ## Part 6: The Flagged Objection (Case 3)

  **I am flagging Case 3 as the one you will not like.**

  You hired me to support the thesis that "non-human things... have been actors." In Case 1 and 2, the procedure delivers this. In Case 3, the procedure **forbids** it.

  If you follow MHIP, the Egypt 1942 label cannot say "The Mosquito Defeated the Allies" or "The Mosquito Killed Egyptians." Because Q3 (Infrastructure) triggers, Verdict C forces the *British Army* to be the grammatical subject. The mosquito becomes a tool, not an actor.

  **The Argument:**
  Timothy Mitchell's specific historical point is that calling this a "natural disaster" or a "mosquito epidemic" is a political act that exonerates the Colonial Administration. If we label the mosquito as the "Actor" to satisfy the gallery's thesis, we are actively reproducing the colonial erasure Mitchell critiques. We would be committing the error Requirement 5 was designed to prevent.

  To maintain intellectual integrity, this label must violate the gallery's overarching thesis. It must admit that sometimes "nature" is just politics by other means. If you override this verdict to make the mosquito the actor, you invalidate the procedure's safeguard against the "Environmental Determinism" critique from the History Department. You cannot have it both ways: you cannot claim non-human agency *and* respect Mitchell's critique of colonial infrastructure in the same 60 words. The procedure chooses the critique. You should too.
