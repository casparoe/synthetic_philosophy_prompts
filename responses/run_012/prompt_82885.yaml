      *   **Stakeholders:** Lead Curator, External Historian, Community Advisory Panel (for plague/conquest sections).
      *   **Requirements for the Procedure:**
          1.  Ordered questions (evidence vs. values), stop points, hand-off points.
          2.  Grammar rule (syntax of agency).
          3.  Rule for settled evidence/unsettled historiography (and vice versa).
          4.  Screen for "shaping terms" vs. "explaining divergence" (avoiding determinism/racism).
          5.  Screen for "shorthand" (hiding human decisions behind natural names).
          6.  Fixed set of verdicts with licensed wording templates.
      *   **Test Cases:**
