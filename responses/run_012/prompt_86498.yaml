  **3. Probability Thresholding (Ignoring Low-Probability Events)**
  *   **Verdict:** **Rejected.**
  *   **Reasoning:** If she ignored outcomes below a certain probability (e.g., $p < 1/1000$), capping the St. Petersburg game at \$1,024 ($n=10$) versus \$10^9 ($n=30$) would not change her price, as the extra value is entirely in the ignored tail. Her prices rise from \$7 to \$12 as the cap increases. This proves she *does* value the tail, but heavily discounts it.

  **4. Expected Utility with Concave Function (e.g., Log Utility)**
  *   **Verdict:** **Strong Candidate.**
  *   **Reasoning:** Log utility ($U(w) = \ln(w)$) resolves the St. Petersburg paradox by yielding a finite value dependent on current wealth. It also explains the heavy discounting of the 1/1000 lottery (diminishing marginal utility of gains).
  *   **Fit:** With a wealth of ~\$2,000, Log utility predicts St. Petersburg values in the \$5–\$15 range, matching her data. It also predicts significant risk aversion on the 1/1000 lottery.

  **5. The Bankruptcy Constraint (The "Couple Thousand" Clue)**
