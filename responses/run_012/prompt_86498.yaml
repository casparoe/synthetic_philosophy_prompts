  ### The Surviving Rule: Constrained Expected Utility

  I am **85% confident** she is running **Expected Utility Maximization with a Log-like utility function, bounded by a hard bankruptcy constraint at roughly \$2,000 of loss.**

  **Why this predicts she needs payment for the new game:**
