answer: |-
  # The "What Do You Mean by Information?" Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your intuition about the *case described*, not based on which philosophical label you prefer. Follow the branch to the next node or to a final Leaf.

  ### Node 1: The Error Test
  Imagine a DNA mutation occurs. In one view, this is a **mistake** (the sequence failed to carry the right information). In another view, this is just a **different physical cause** (the sequence now causes a different outcome, like a broken gear turning differently). When you say DNA carries information, are you committed to the idea that mutations can be genuine *errors* rather than just causal deviations?
  *   **No** (It's just causation; 'error' is a human judgment): Go to **Node 2**.
  *   **Yes** (There is a fact of the matter about correctness): Go to **Node 3**.

  ### Node 2: The Prion Test (For the Causal View)
  Consider a prion: a protein that templates its shape onto other proteins without any DNA involvement. If you answered 'No' above, do you still want to say the prion is transmitting "information" to the new protein, or should we retire the word "information" entirely for molecular interactions to avoid confusion?
  *   **Retire it** (Molecules just cause things; save 'info' for minds): → **Leaf 1**.
  *   **Keep it** (Molecular templating is a form of info, just not genetic): → **Leaf 2**.

  ### Node 3: The Arbitrariness Test
  Suppose we discover that the mapping between Codon X and Amino Acid Y was not a "frozen accident" but dictated by unavoidable laws of stereochemistry (it *had* to be that way physically). Would you still call it a "code"?
  *   **No** (A code requires the mapping could have been otherwise): → **Leaf 3**.
  *   **Yes** (It's a code regardless of physical necessity): Go to **Node 4**.

  ### Node 4: The Consumer Test
  Imagine a DNA sequence floating in a vacuum with no cellular machinery to read it. Does it still possess semantic content (meaning/instructions), or does the "instruction" only exist relative to a system selected to *use* it?
  *   **Only with a user** (No reader, no representation): → **Leaf 4**.
  *   **Intrinsic content** (The sequence holds the instruction itself): Go to **Node 5**.

  ### Node 5: The Program Test
  Think of the genome's role in development. Is it more like a **script** (top-down instructions executed in order) or a **database** (a resource queried opportunistically by the cell)?
  *   **Script** (The genome drives the process): Go to **Node 6**.
  *   **Database** (The cell drives the process): Go to **Node 7**.

  ### Node 6: The Context Test
  Take the same DNA sequence. Place it in a liver cell (Outcome A) and a neuron (Outcome B). Is the "information" in the sequence identical in both cases, with the *effect* changing, or is the "information" itself different because the meaning depends on the context?
  *   **Info is different** (Meaning is relational): → **Leaf 5**.
  *   **Info is identical** (Sequence determines content): Go to **Node 7**.

  ### Node 7: The Specificity Test
  A gene is necessary for a trait, but the trait's final form depends equally on 50 environmental factors. Does the gene carry "high information" about the trait (because it's necessary) or "low information" (because it doesn't control the outcome)?
  *   **Low information** (Info tracks causal control): → **Leaf 6**.
  *   **High information** (Info tracks identity/presence): → **Leaf 7**.

  ***

  ## The Leaves

  **Leaf 1: Hard Eliminativism**
  *   **View:** "Information" is a metaphor that should be retired from molecular biology; there are only causes.
  *   **Awkward Commitment:** You must explain why biology textbooks work so well using a term you claim is literally false without replacing it with something cumbersome.

  **Leaf 2: Dual-Aspect Causalism**
  *   **View:** Information is just a specific kind of causal correlation, applicable to DNA, prions, and hormones equally.
  *   **Awkward Commitment:** You must accept that a rock sliding down a hill carries "information" about the slope if it reliably triggers an avalanche.

  **Leaf 3: Arbitrariness-Code View**
  *   **View:** DNA is a genuine code, but only because the mapping is contingent (a frozen accident) rather than chemically necessary.
  *   **Awkward Commitment:** If physics had dictated the genetic code, you would have to deny that DNA is a code, even if biology looked exactly the same.

  **Leaf 4: Consumer/Teleological View**
  *   **View:** DNA represents only because cellular machinery has been selected to interpret it; meaning requires a user.
  *   **Awkward Commitment:** You must posit a historical function for every molecular interaction to ground its representational status.

  **Leaf 5: Contextual/Relational View**
  *   **View:** Information is not located in the sequence but in the interaction between sequence and cellular state.
  *   **Awkward Commitment:** You cannot assign an information content to a gene in isolation, making "sequencing the genome" incomplete by definition.

  **Leaf 6: Causal-Specificity View**
  *   **View:** Information tracks causal control; DNA carries little information about traits it does not specifically determine.
  *   **Awkward Commitment:** You must say the DNA carries very little information about complex traits like height or intelligence, despite being essential.

  **Leaf 7: Formal-Structuralist View**
  *   **View:** DNA is a code in basically the same sense as human language; the sequence carries instructions intrinsically.
  *   **Awkward Commitment:** You must treat the genome as a top-down script, potentially underestimating the constructive role of the cellular environment.

  ***

  ## Diagnostic Notes

  **Indistinguishable Leaves:**
  The tree struggles to pull apart **Leaf 6 (Causal-Specificity)** and **Leaf 1 (Hard Eliminativism)** in practice. If a gene has low causal specificity (Leaf 6), the view says it carries "low information." For a working biologist, "low information" and "no information, just a cause" (Leaf 1) often result in the same experimental predictions and the same skepticism about "genetic determinism." The distinction is metaphysical rather than operational.

  **Empty Regions of Logical Space:**
  1.  **Intrinsic + Contextual:** The path Node 4 (Intrinsic) → Node 6 (Contextual) is logically unstable. If the content is intrinsic to the sequence (Node 4), it cannot change based on context (Node 6). This region is empty because it requires the information to be both "in the object" and "in the relation" simultaneously.
  2.  **Non-Arbitrary + Consumer:** The path Node 3 (Non-Arbitrary/Necessary) → Node 4 (Consumer) is largely unexplored. If the mapping is chemically necessary, it is unclear why a "consumer" is needed to interpret it (chemistry does the work), yet if a consumer is needed, it implies the chemistry isn't enough. This combination is rarely defended because it splits the difference between physical determinism and teleology without gaining the benefits of either.
