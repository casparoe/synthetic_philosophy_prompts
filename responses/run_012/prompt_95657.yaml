      *   Secret cards? Yes.
      *   Two scorekeeping passes? Yes.
      *   Debrief on causality? Yes.
      *   Frank note on limitations? Yes.
      *   American English? Yes.

  11. **Polishing the Text:** Ensure instructions are imperative and clear ("Do this," "Say that"). Add specific scripts for the instructor to reduce cognitive load during the session. (Self-Correction: Make sure the "Reductionist" pass doesn't feel like cheating. It must be a legitimate statistical re-aggregation.)

  12. **Final Polish:** Check the math one last time.
