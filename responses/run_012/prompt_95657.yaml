answer: |-
  # Lesson Plan: The Glimmer-Mole Dilemma
  **Topic:** Units of Selection (Group Selection vs. Gene/Individual Selection)
  **Time:** 90 Minutes
  **Class Size:** 20 Undergraduates (adjustable)
  **Materials:** 
  - 20 Index Cards (10 marked "CLEARER", 10 marked "HIDER")
  - Whiteboard & Markers (3 colors: Black, Red, Blue)
  - 1 Six-sided Die
  - Printed "Score Sheets" for two volunteers (or just use the board)

  ---

  ## Part 1: Setup & Introduction (0:00 – 0:15)

  **The Hook (5 mins)**
  Stand at the front. Do not mention "selection" yet.
  **Say:** "We are going to simulate a population of a fictional animal called the **Glimmer-Mole**. They live in underground tunnels. The tunnels get clogged with toxic gas. To survive, someone has to clear the vent. It's dangerous work. Today, you are the Moles. Your only goal is to leave as many offspring as possible. Points = Offspring."

  **The Roles & Secret Cards (5 mins)**
  1.  Divide the class into **4 Groups** of 5 students. Call these **"Tunnels."** Have them move chairs together.
  2.  Hand out the 20 Index Cards face down.
      *   **CRITICAL INSTRUCTION:** "Do not show your card to anyone. Do not discuss your card. You are either a **CLEARER (C)** or a **HIDER (H)**. Keep this secret until I tell you to reveal."
      *   *Instructor Note:* To ensure the lesson works on the first try, **rig the distribution.** 
          *   Tunnel 1: 5 Clearers
          *   Tunnel 2: 4 Clearers, 1 Hider
          *   Tunnel 3: 1 Clearer, 4 Hiders
          *   Tunnel 4: 5 Hiders
      *   (This guarantees the conflict: Tunnels 1 & 2 survive, 3 & 4 die. Within Tunnel 2, the Hider outscores the Clearers.)

  **The Rules (5 mins)**
  Write this on the board in **Black**:
  1.  **Base Score:** Every Mole starts with **10 Points**.
  2.  **The Cost:** If you are a **CLEARER**, subtract **2 Points** (the danger of work).
  3.  **The Collapse:** A Tunnel survives only if it has **2 or more Clearers**.
      *   If the Tunnel Survives: Add **20 Bonus Points** to everyone in that tunnel.
      *   If the Tunnel Collapses: Everyone in that tunnel gets **0 Points** (they died).
  4.  **Reproduction:** At the end of the round, the total population of the next generation is 20. The 20 highest-scoring individuals from this round become the parents of the next round. Their strategy (C or H) is inherited by their offspring.

  **Check for Understanding:**
  Ask: "If you are a Hider in a surviving tunnel, do you score higher or lower than a Clearer in the same tunnel?" (Answer: Higher, because you didn't pay the cost).
  Ask: "If you are a Clearer in a collapsing tunnel, do you care about your cost?" (Answer: No, you're dead).

  ---

  ## Part 2: The Game – Generation 1 (0:15 – 0:35)

  **Round 1 Play (10 mins)**
  1.  Tell students to look at their cards silently.
  2.  Ask each Tunnel to count their Clearers aloud. Write the counts on the board.
      *   *T1: 5 | T2: 4 | T3: 1 | T4: 0*
  3.  Apply the Collapse Rule.
      *   T1 & T2 Survive. T3 & T4 Collapse.
  4.  Calculate Scores.
      *   **T1 (Survivors):** Clearers = 10 - 2 + 20 = **28**.
      *   **T2 (Survivors):** Clearers = **28**. The 1 Hider = 10 + 20 = **30**.
      *   **T3 & T4 (Dead):** Everyone = **0**.
  5.  **Tally the Winners:**
      *   Total Clearers surviving: 9 (5 from T1, 4 from T2). Score: 28 each.
      *   Total Hiders surviving: 1 (from T2). Score: 30.
      *   Total Dead: 10 (1 from T3, 9 from T4).
  6.  **Reproduction:**
      *   We need 20 moles for the next round.
      *   The 1 Hider (30 pts) replicates 1 time.
      *   The 9 Clearers (28 pts) replicate 9 times.
      *   The 10 Dead moles are replaced by offspring of the survivors.
      *   *Instructor Decision:* To keep the math visible, simply announce the new population composition based on who scored highest.
      *   **New Population:** 18 Clearers, 2 Hiders. (The Clearer trait *exploded* despite losing locally in Tunnel 2).

  **The "Group Selection" Narrative (10 mins)**
  Ask a volunteer (Scorekeeper A) to come to the board. Give them the **Red Marker**.
  **Task:** Explain why Clearers increased using **Group Language**.
  **Script for Scorekeeper A:** "Look at the Tunnels. Tunnels with Clearers survived. Tunnels without them died. The *Group* was the unit that lived or died. The Clearers sacrificed for the Group, and the Group rewarded them by surviving. The Hiders in Tunnel 2 won locally, but their Group was too weak to save them in T3 and T4. **Conclusion:** Group Selection drove the change."

  ---

  ## Part 3: The Re-Description – The Reductionist Pass (0:35 – 0:55)

  **The Pivot (5 mins)**
  **Say:** "That story makes sense. But in biology, some argue groups don't 'do' anything. Only individuals reproduce. Let's run the exact same numbers through a different lens."

  **The "Individual/Gene" Narrative (15 mins)**
  Ask a second volunteer (Scorekeeper B) to come to the board. Give them the **Blue Marker**.
  **Task:** Explain the *exact same outcome* without using the word "Group" as a causal agent. Treat "Group Collapse" as just an environmental hazard.

  **Instructions for Scorekeeper B:**
  1.  Ignore the "Tunnel" boundaries. There are just 20 individuals in an environment.
  2.  The "Environment" varies. Some individuals were in a "High-Clearer Density Zone" (T1 & T2). Some were in a "Low-Clearer Density Zone" (T3 & T4).
  3.  Being in a High-Clearer Zone causes survival.
  4.  **Crucial Move:** Clearers *create* the High-Clearer Zone. By being a Clearer, you increase the statistical probability that you (and those near you) are in a survivable environment.
  5.  **The Tally:**
      *   Average Fitness of a Clearer Gene: (9 survivors * 28 points) / 10 total Clearers = **25.2**
      *   Average Fitness of a Hider Gene: (1 survivor * 30 points) / 10 total Hiders = **3.0**
      *   *(Note: Include the dead ones with 0 points in the average!)*
  6.  **Script for Scorekeeper B:** "I didn't see any groups. I saw individuals. Clearers had a higher *average* fitness because Clearers were correlated with survival zones. The Hider in Tunnel 2 did great, but most Hiders died. The Gene for Clearing spread because, on average, it rode on bodies that survived. **Conclusion:** Individual/Gene Selection drove the change."

  **The Clash:**
  Have both scorekeepers stand side-by-side.
  **Ask the Class:** "Did the Red Scorekeeper lie? Did the Blue Scorekeeper lie?"
  (Answer: Neither lied. They aggregated the same data differently.)

  ---

  ## Part 4: Debrief & Philosophy (0:55 – 1:20)

  **Discussion Questions (15 mins)**
  Write these on the board. Facilitate, don't lecture.

  1.  **The Causality Question:** "In Tunnel 2, the Hider beat the Clearers. If we ran this 100 times, Hiders always beat Clearers *inside* a surviving tunnel. So why did the Clearer trait win the war?"
      *   *Target Insight:* Because the Hiders killed their own habitat.
  2.  **The Ontology Question:** "Scorekeeper Red says 'The Group survived.' Scorekeeper Blue says 'The Individuals in a favorable environment survived.' Is a 'Group' a real thing, like a Mole? Or is it just a name we give to a cluster of Moles?"
      *   *Target Insight:* This is the metaphysical crux. If you believe only physical bodies are real, Red is speaking metaphorically. If you believe systems are real, Red is literal.
  3.  **The "Real" Account:** "Which explanation is the 'true' one?"
      *   *Target Insight:* In science, "true" often means "useful for prediction." Both predict the next generation. The fight is about *parsimony* and *causal privilege*.

  **The "Price Equation" Light (10 mins)**
  **Say:** "There is a mathematical formula in biology called the Price Equation. It literally splits evolutionary change into two parts:
  1.  Change due to individual advantage (The Hider winning in Tunnel 2).
  2.  Change due to group advantage (Tunnel 1 & 2 surviving).
  Mathematically, they add up to the same total. You can shift the numbers between the two parts depending on how you define a 'group.' That means the math cannot settle the argument. The argument is about what you think *causes* the world."

  ---

  ## Part 5: Limitations & Troubleshooting (1:20 – 1:30)

  **Frank Note on Limitations (5 mins)**
  **Say:** "Before you leave, here is what this game *didn't* show you."
  1.  **Mutation:** In real life, Clearers can mutate into Hiders. If that rate is high, cooperation collapses.
  2.  **Migration:** If Moles could swap tunnels before the collapse, Hiders would flee to Clearer tunnels, parasitizing them until everyone dies. (This is the 'Tragedy of the Commons').
  3.  **Kinship:** In real biology, Clearers are usually related. They don't care about 'the group'; they care about their *genes* in other bodies. This game conflated 'group' with 'kin.'
  4.  **Intentionality:** You chose to hold the card. Moles don't choose. They are programmed. The 'strategy' is blind.

  **Q&A (5 mins)**
  Open floor for final questions.

  ---

  ## Instructor's Cheat Sheet: What Will Go Wrong

  **1. The "Bully" Problem**
  *   **Risk:** A loud student in Tunnel 3 says, "We need more Clearers! Who can switch?"
  *   **Fix:** Enforce the "Secret Card" rule ruthlessly. "In biology, you cannot choose your genes. You cannot negotiate your phenotype. If you talk, your Tunnel collapses immediately."
  *   **Prevention:** Collect the cards after Round 1. Do not let them trade. You (the instructor) deal the new generation's cards based on the scores. This maintains control over the evolutionary pressure.

  **2. The Math Confusion**
  *   **Risk:** Students get lost in the addition/subtraction during the game.
  *   **Fix:** Pre-draw the score table on the whiteboard.
      *   Columns: Tunnel ID, # Clearers, Survival? (Y/N), Clearer Score, Hider Score.
      *   Fill it in as you go. Do not make them do mental math.
  *   **Risk:** The "Average Fitness" calculation in Part 3 confuses them.
  *   **Fix:** Write the formula: `(Total Points for All Clearers) / (Total Number of Clearers including dead ones)`. Emphasize that **dead moles count as zero**, not as "removed from the equation."

  **3. The "It's Obvious" Cynic**
  *   **Risk:** A student says, "Well, obviously the Clearers saved the group. Why are we pretending it's the gene?"
  *   **Fix:** Validate them. "You are intuitively a Multi-Level Selectionist. But imagine you are a Hider. You didn't save anyone. You survived because you stood next to a Clearer. From your perspective, the Clearer was just part of your environment, like a rock that blocked the gas. The Reductionist says the 'Group' is just a collection of rocks and Moles. The question is: Is the collection *itself* a cause?"

  **4. Time Management**
  *   **Risk:** The game drags on.
  *   **Fix:** Stop after Generation 1. You do not need multiple generations to show the *logic* of the re-description. Multiple generations are for showing *trends*, but one generation is enough to show the *accounting trick*. If you are running late, skip Generation 2 and move straight to the Two Scorekeepers.

  ---

  ## Final Script for the "Punchline" (Read this verbatim if needed)

  "We just watched the same history told two ways. 
  Story A: The Selfish Moles won the battle, but the Cooperative Groups won the war.
  Story B: The Cooperative Genes won because they were statistically more likely to be in safe places.

  The data did not change. The points did not change. The winners did not change.
  The only thing that changed was **what we decided was real.**

  If you think 'Groups' are real entities that act, Story A is the truth.
  If you think only 'Particles' (or genes/bodies) are real, Story B is the truth.

  Biology cannot answer which one is true. That is not a biology question. That is a philosophy question. And your job, for the rest of this course, is to decide which story buys you more understanding."
