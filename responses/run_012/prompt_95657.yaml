      *   Payoff: Base 10. Cost 2. Survival Bonus 20.
      *   If Group Survives: Clearer = 28, Hider = 30. (Hider wins locally).
      *   If Group Dies: Everyone = 0.
      *   Distribution needs to ensure some Hider-heavy groups die and some Clearer-heavy groups survive.
      *   I will provide a specific dealing distribution for the instructor to ensure the math works out for the demo, rather than leaving it to random chance which might fail in a 90-min class. *Decision:* Pre-set the first round distribution to guarantee the effect, then let later rounds evolve naturally or guide the "reproduction." Actually, for a philosophy demo, controlling the initial conditions ensures the point lands. I'll suggest a "Rigged Deck" for Round 1 to guarantee the phenomenon appears, then discuss. Or better: Let the cards be random, but the instructor controls the "Survival Threshold" to ensure the dynamic appears. *Better Decision:* To save time and guarantee the lesson works, I will instruct the instructor to pre-sort the decks for Round 1 so the pattern is guaranteed. Randomness might result in all groups surviving or all dying.

