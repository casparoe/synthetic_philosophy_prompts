  Note on Leverage: Those with low weights on popular causes have high leverage; they can cheaply buy influence on their own high-weight causes by promising actions on causes they don't care about.
  Note on Integrity: The Sacred Token prevents full commodification. You will feel the tension between maximizing points and honoring the token.
  Enforcement: If a deal is broken, the victim cannot appeal to you. They must decide whether to play their card anyway. This mirrors the lack of a moral police force. The whiteboard contract is public shame, nothing more. You may not show your Profile Sheet to anyone during play.

  "The 75 minutes"
  0-10: Distribute envelopes. Read rules aloud. Answer clarification questions only. No strategy talk.
  10-25: Round 1. Students choose 2 cards silently. Collect and reveal on board.
  25-35: Calculation. Students calculate Round 1 scores individually. Share averages.
  35-55: Round 2. Open negotiation. Students mill around, make deals, write contracts on board. Play cards.
  55-65: Calculation. Calculate Round 2 scores. Compare gains.
  65-75: Debrief. Sit down. No lecture. Ask questions.
  Stop talking at minute 10. Let them realize the gains themselves.
  Ensure you cut off negotiation at 55 sharply. The pressure of time mimics real-world decision constraints. If calculation drags, help them sum the board totals.
  At minute 65, move chairs into a circle. Change the physical space to signal the shift from playing to reflecting. Do not write on the board during debrief.
  If students finish early, do not start Round 3. Use the silence to let the outcome settle.

  "The debrief"
  1. "Look at the scoreboards. Who gained most in Round 2?" (Points to efficiency gains).
  2. "Did anyone refuse a trade that would have increased their score? Why?" (Points to integrity costs).
  3. "Who found it easiest to get others to do what they wanted? What was special about their profile?" (Points to leverage asymmetry—the person who cares least has power).
  4. "Did holding the Sacred Token feel different than holding a tradable card?" (Points to commodification).
  5. "Did anyone feel uneasy treating their priorities as bargaining chips?"
  Only now introduce terms: "Moral Trade," "Integrity Constraint," "Bargaining Leverage." Let them describe the queasiness. If you explain it now, you ruin the realization.
  Ask specifically about the Prohibition players. "Could you buy your way out of your prohibition?" This highlights limits of trading.
  Keep your hands off the whiteboard. Let them point to the numbers.
  If they stay silent, ask: "Who felt rich? Who felt poor?" This unlocks the leverage discussion.
  End by asking: "Would you play Round 3 differently?" This reveals internalized changes.
  Do not validate their answers with "Correct." Ask "Who agrees?" instead.

  "What goes wrong the first time"
  Students might collude to maximize group score rather than personal. Remind them: "Maximize *your* points." Scoring might take too long. Pre-calculate a spreadsheet or have them just sum weights. Some will break deals. Use this: "Why did that contract fail?" If everyone trades everything, the integrity point is lost. Ensure the Sacred Token rule is enforced strictly. If negotiation drags, cut it off early to preserve debrief time.
  Watch for the "tyrant" player who cares about nothing. They will dominate. Highlight this.
  If students reveal weights early, stop them. The secrecy is crucial for the leverage reveal.
  If the Prohibition player feels excluded, validate that exclusion as part of the lesson.

  "What the game can't do"
  It can't reproduce real moral distress. Points aren't lives. It can't show long-term reputational damage of breaking moral contracts. It can't fully simulate the "corruption" of character over time. You must supply the connection to real-world moral compromise. The game shows the structure; you must supply the weight.
  It also abstracts away the emotional cost of betrayal. In real life, breaking a moral promise hurts differently than losing points.
  You must bridge the gap between "game annoyance" and "moral residue."
  The game assumes rational actors; real agents are often driven by emotion or identity, which complicates the trading model significantly.
