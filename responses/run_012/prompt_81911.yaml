answer: |-
  Here is the plan. It is designed to be disruptive. You are not teaching them to draw; you are teaching them to see.

  ### 1. The Carrying Example: Kill the 'a'
  **Argument:** You are right to be suspicious. Do not start with the 'a'. The 'a' is the worst possible place to start.
  **Why:** Every adult in that room has a muscle-memory 'a' locked in their hand. If you put a brush in their hand and say "draw an a," they will bypass their eyes and brain and draw the symbol they learned in second grade. You cannot teach them to see what they think they already know. Furthermore, the 'a' is structurally ambiguous (one-storey vs. two-storey), which fuels the confusion you want to resolve.

  **The Replacement:** The lowercase **'n'**.
  **Why:** The 'n' is the structural DNA of the lowercase alphabet. It has a stem, a shoulder, and an arch. It creates a counter (the hole) without the complexity of a closed bowl.
  **The Pivot:** An 'a' is simply an 'n' where the entrance has been closed. If they understand the *structure* of the 'n' (the relationship between the stroke and the space inside the arch), they understand the *structure* of the 'a'.
  **What the example MUST have:** An arch. It must create an enclosed or semi-enclosed space (counter) immediately.
  **What the example MUST NOT have:** Serifs. Keep it sans-serif for the first hour. Serifs are "clothing"; you want them looking at the "bones."

  ### 2. The Sequence of Wrong Ideas
  You need to introduce concepts in the exact order their brains will try to reject them. If you address the third misconception first, they won't hear it because they are still stuck on the first.

  **Misconception 1: "I need to copy the shape." (Minutes 0–30)**
  *   **When it arrives:** Immediately. They will watch you draw an 'n' and try to replicate the curve of your brush.
  *   **How to head it off:** Do not draw an 'n' for them to copy. Draw **three** 'n's on the board. Make one wide, one tall, one crushed. Ask: *"Are these the same letter?"* They will say yes. Ask: *"Why? They aren't the same shape."*
  *   **The Lesson:** Identity is not the outline; it is the **structure**.
  *   **The Task:** Have them draw an 'n' that looks nothing like yours but is undeniably an 'n'.

  **Misconception 2: "The white space is just background." (Minutes 30–60)**
  *   **When it arrives:** Once they stop copying outlines, they will focus on the thickness of the black stroke. They will treat the white space as leftover air.
  *   **How to head it off:** Take their brushes away. Give them a black marker and a piece of white paper. Tell them to draw the **hole**, not the letter. Tell them the black ink is just the fence; the white space is the animal.
  *   **The Lesson:** The counter (the hole) does as much work as the stroke. If the hole collapses, the letter dies.
  *   **The Task:** Draw an 'n' where the stroke is messy/wobbly, but the *white space inside the arch* is perfect.

  **Misconception 3: "Style is decoration I add at the end." (Minutes 60–90)**
  *   **When it arrives:** They will think "making it fancy" (swashes, thick/thin contrast) is what makes it typography. They think structure comes first, style comes second.
  *   **How to head it off:** Show them a Gothic 'n' and a Roman 'n'. Ask if they are the same letter. They are. But the *structure* changed to accommodate the *style*.
  *   **The Lesson:** Style is not makeup; it is weightlifting. You cannot add "style" to a weak structure. The structure *is* the style.
  *   **The Task:** Take their perfect structural 'n' from earlier and break it to fit a "mood" (angry, happy, tired) without losing the letter identity.

  ### 3. The Final Test (Last 10 Minutes)
  Do not ask them to draw a pretty alphabet. Do not ask them to draw an 'a'.
  **The Exercise:** **"The Context Swap."**
  1.  Have them write the sequence **"n n n"** across the page.
  2.  Have them change the **middle 'n' into an 'a'**.
  3.  **The Constraint:** They are not allowed to close the bowl completely. They must suggest the 'a' using only the structural logic of the 'n's around it.

  **Why this works:** It forces them to confront the "Russian 'a'" problem. An 'a' is only an 'a' because it is *different* from the 'n' next to it. Identity is relational. If the middle letter looks too much like the 'n's, it fails. If it looks too much like an 'o', it fails. They have to find the line where the *relationship* shifts.
  **Success Metric:** You aren't looking for a beautiful 'a'. You are looking for a letter that creates a rhythm change in the word. If you can read "nan" without tripping, they got it.

  ### 4. What to Refuse (Scope Creep)
  You must draw a line in the sand at the start, or the sign painters will ask about serifs and the hobbyists will ask about calligraphy. Say this out loud:

  1.  **"We are not learning History."** If someone asks, "Is this Roman or Italic?", your answer is: *"It's a letter. We are talking about identity, not ancestry."*
  2.  **"We are not learning 'Correct' Proportions."** There is no golden ratio here. If it looks right, it is right. Do not let them measure things with rulers.
  3.  **"We are not talking about Computers."** Digital fonts are frozen dead letters. We are painting living ones. Do not ask about kerning pairs or Unicode.

  ### 5. The Analogy: Kill the Face
  **Verdict:** **Kill the Face analogy.**
  **Why:** You already spotted the trap. A face is recognized by *features* (nose, eyes). A letter is often recognized by the *absence* of ink (the counter). Telling a beginner a letter is a face encourages them to look for "features" (like a tail or a crossbar) rather than relationships. Also, faces don't change shape as much as letters do without losing identity.

  **The Replacement:** **A Tune.**
  **How to pitch it:** *"If I hum 'Happy Birthday' in a deep voice, and then in a high voice, and then really fast, is it the same song? Yes. The notes changed. The pitch changed. The speed changed. But the **relationship between the notes** stayed the same."*
  **Why it works:**
  *   It explains why a two-storey 'a' and a one-storey 'a' are the same letter (same tune, different octave).
  *   It explains why the Russian 'a' is different (it's a different song that happens to use similar notes).
  *   It emphasizes *rhythm and ratio* over static shape.
  *   It fits a sign painter's mindset: you are setting a visual rhythm on a wall.

  **Summary of the Flow:**
  1.  **Hook:** Three different 'n's. Same letter? Why? (Structure > Shape).
  2.  **Work:** Draw the white space, not the black ink. (Counter > Stroke).
  3.  **Pivot:** Turn the 'n' into an 'a' without closing the door. (Relationship > Isolation).
  4.  **Test:** Write "nan". Make the middle one distinct but related. (Context > Form).
  5.  **Analogy:** It's not a face; it's a tune.

  Stick to this order. If you let them draw an 'a' in the first 20 minutes, you lose. Make them earn the 'a' in the last 20.
