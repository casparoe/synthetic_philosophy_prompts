  # POPULATION ETHICS: DIAGNOSTIC TREE

  **Instructions:** Start at **Box 1**. Answer the question based on your moral intuition. Follow the arrow to the next Box or to a **Leaf**.

  ***

  ### [BOX 1] The Standard Case
  A woman takes medication early in pregnancy. If she takes it, **Child A** is born with a significant disability (though life is worth living). If she waits one month, the medication clears her system; **Child A is never conceived**, and a different, healthy **Child B** is conceived instead.
  **Question:** Is the woman's choice to take the medication *morally wrong*?

  *   **NO** → **[LEAF 1]**
  *   **YES** → **[BOX 2]**

  ***

  ### [BOX 2] The Identity-Neutral Control
  Same woman, same **Child A**. She takes medication that causes the disability. If she had not taken it, **Child A would have been born healthy**.
  **Question:** Is the reason this is wrong the *same kind of reason* as in Box 1?

  *   **NO** (Box 1 is different) → **[BOX 3]**
  *   **YES** (Same reason) → **[BOX 4]**

  ***

  ### [BOX 3] The Source of Wrongness
  Return to Box 1 (Standard Case). The child's life is worth living, and they are not worse off than they would have been.
  **Question:** Is the wrongness located in the *mother's character* (vice) or the *child's condition* (outcome)?

  *   **MOTHER'S CHARACTER** → **[LEAF 2]**
  *   **CHILD'S CONDITION** → **[BOX 5]**

  ***

  ### [BOX 4] The Additional Person Case
  A policy creates an **Additional Person C** whose life is barely worth living. Without the policy, Person C never exists, and everyone else is unaffected.
  **Question:** Is this outcome *worse* than the alternative where Person C never exists?

  *   **NO** → **[LEAF 6]**
  *   **YES** → **[BOX 7]**

  ***

  ### [BOX 5] The Designer Case (Invented)
  Parents select genes to ensure their child is a dwarf to fit a specific lifestyle. The child is happy and reports no loss of welfare.
  **Question:** Is this wrong because the child is *worse off* (Harm) or because the child was *designed* (Status/Rights)?

  *   **WORSE OFF (HARM)** → **[LEAF 4]**
  *   **DESIGNED (STATUS)** → **[LEAF 5]**

  ***

  ### [BOX 7] The Different Temperament Case
  Choice between **Child A** (Happy, Artistic) and **Child B** (Happy, Athletic). Neither is "better off" than the other; they are just different people.
  **Question:** Is one outcome *better* than the other in a way that makes choosing the lesser one wrong?

  *   **NO** → **[LEAF 3]**
  *   **YES** → **[BOX 8]**

  ***

  ### [BOX 8] The Aggregation Question
  Compare a world with 1 billion very happy people vs. 1 trillion people whose lives are barely worth living.
  **Question:** Do we sum up *all* happiness, or only count lives above a *certain quality threshold*?

  *   **SUM ALL** → **[LEAF 7]**
  *   **THRESHOLD** → **[LEAF 8]**

  ***

  ## LEAF DESCRIPTIONS

  **[LEAF 1] Strict Person-Affecting View**
  *   **Description:** Denies any wrong in the Standard Case because no specific individual is worse off.
  *   **Awkward Commitment:** Cannot condemn policies that harm future generations if those generations wouldn't exist otherwise.
  *   **Note:** *Empty Space:* The combination "Box 1=No / Box 2=Yes" is **incoherent** (if harming an existing child is wrong, causing a disabled child to exist must be comparable).

  **[LEAF 2] Disposition/Vice View**
  *   **Description:** A view on which the objection to the parents concerns their dispositions rather than the outcome.
  *   **Awkward Commitment:** An action can be wrong even if the world is no worse for anyone.
  *   **Note:** *Flag:* Indistinguishable from Leaf 5 without the "Designer Case" (Box 5).

  **[LEAF 3] Non-Comparative Impersonal View**
  *   **Description:** Permits wrongness without a victim; outcomes can be wrong even if persons are incomparable.
  *   **Awkward Commitment:** Moral free-floating wrongness detached from individual welfare or ranking.
  *   **Note:** *Status:* **Unattractive** (Most find it unstable to say an outcome is "worse" without being able to say why).

  **[LEAF 4] Non-Comparative Harm View**
  *   **Description:** Locates the wrong in a non-comparative harm to the child (the condition is bad independently of alternatives).
  *   **Awkward Commitment:** "Worse off" loses its meaning if the alternative is non-existence.
  *   **Note:** *Flag:* Indistinguishable from Leaf 5 without the "Designer Case" (Box 5).

  **[LEAF 5] Rights/Dignity View**
  *   **Description:** A rights- or dignity-based view that treats the child's claim as non-comparative (status violation).
  *   **Awkward Commitment:** Rights can be violated by the act of creation itself.
  *   **Note:** *Status:* **Undeveloped** (Few have formalized a non-comparative right to be born without specific traits).

  **[LEAF 6] Wide Person-Affecting View (Unnamed)**
  *   **Description:** Wrongness requires a victim, but "victim" includes whoever ends up existing (not just specific individuals).
  *   **Awkward Commitment:** Struggles to explain why we should create the happy child over the miserable one if no specific person is harmed.
  *   **Note:** *Status:* **Unoccupied** (Generally considered theoretically unstable; collapses into Leaf 1 or Leaf 7).

  **[LEAF 7] Total Utilitarianism**
  *   **Description:** The straightforward impersonal-aggregative view (sum all welfare).
  *   **Awkward Commitment:** The Repugnant Conclusion (massive population of barely worth living lives is better than small happy population).
  *   **Note:** *Empty Space:* The path "Box 4=No / Box 7=Yes" is **incoherent** (if adding a life isn't worse, comparing lives is inconsistent).

  **[LEAF 8] Impersonal Threshold View**
  *   **Description:** An impersonal view with a threshold below which lives count differently (or not at all).
  *   **Awkward Commitment:** The location of the threshold is arbitrary.
  *   **Note:** *Status:* **Developed** (e.g., Critical-Level Utilitarianism).

  ***

  ## DIAGNOSTIC FLAGS

  1.  **Indistinguishable Pair:** **Leaf 2 (Vice)** and **Leaf 5 (Rights)** may yield identical verdicts on the Standard Case. They are separated *only* by the **Designer Case (Box 5)**.
  2.  **Trick Route:** **Leaf 6** is reachable only if one answers "No" to Box 4 but "Yes" to Box 1. This route strikes most readers as a **trick** (claiming the Standard Case is wrong but adding a miserable life is not).
  3.  **Logical Gap:** There is no leaf for "Box 1=Yes / Box 2=No / Box 3=Outcome / Box 5=Neither." This combination is **incoherent** (if the outcome is wrong, it must be due to harm or status).
