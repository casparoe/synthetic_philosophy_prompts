prompt: |-
  I've been in a reading group that's working through the demandingness literature — Parfit, Singer, the usual — and last week one of the members circulated a one-page handout summarising Susan Wolf's essay on moral saints, the 1982 one that gets cited whenever effective altruism comes up. Having spent a fair few years in the rationalist blogosphere reading about moral demandingness and the "morality is one project among many" line, the shape of the argument felt familiar to me, but the handout's version doesn't quite line up with the bits of Wolf I've seen quoted elsewhere, and I'd rather not go on repeating the handout's version in conversation until someone has audited it. Here is what it says, roughly as written: 'Wolf argues that a morally perfect person — someone for whom morality is the overriding, all-consuming project — is a bad ideal to hold up for human beings. She means by this people like religious saints or full-time aid workers. She distinguishes two versions. The Loving Saint does the morally best thing joyfully and without inner conflict; the Rational Saint does the morally best thing, but from a grim sense of duty. Wolf's central complaint is that the saint's life has no room in it for the non-moral goods: friendship, hobbies, art, play. Her main evidence for this is that we find such people unbearable to be around, since they make us feel judged and guilty, so the existence of moral saints is actually bad for the moral community. She also suggests that the Loving Saint must be missing a piece of perceptual equipment, since otherwise he would notice how much he is giving up. Wolf concludes that we should therefore be less moral than we could be, and that morality is at bottom just one value among others, with no special claim on us. Her real target is the effective altruism movement, which simply hadn't been named yet when she wrote.'

  Could you give me a claim-by-claim audit? I'd like to know which parts a careful reader of the essay would accept as fair, which are common simplifications that a sympathetic defender would wince at, and which are things Wolf explicitly denies or argues the opposite of. Two points interest me in particular. First, does her argument really turn on how saints affect the people around them, or is that doing less work than the handout implies? Second, does the concluding claim — that morality has no special claim on us, and that we should be less moral than we could be — follow from anything in the parts you judge accurate, or is it an inference the handout has added? Where the summary is wrong, please give me the corrected version of the claim rather than just marking it down, and flag anywhere the vocabulary is quietly doing work, for instance if a term of Wolf's is being used in its everyday sense. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a one-page handout summary of Susan Wolf's 1982 essay "Moral Saints".
      *   **Context:** The user is in a reading group discussing moral demandingness (Parfit, Singer, etc.) and has encountered this summary. They suspect it might be inaccurate or simplified compared to the original text and other interpretations.
      *   **Specific Questions:**
          1.  Claim-by-claim audit (Fair vs. Simplification vs. Wrong).
          2.  Does the argument turn on how saints affect others (guilt/judgment)?
          3.  Does the conclusion (morality has no special claim/we should be less moral) follow from the text?
      *   **Requirements:** Correct errors (don't just say "wrong"), flag vocabulary issues, use British English.

  2.  **Recall/Verify Source Material (Susan Wolf, "Moral Saints", 1982):**
      *   *Core Thesis:* A life dominated by moral concerns (a "moral saint") is not a desirable ideal of personal well-being.
      *   *Definitions:*
          *   "Moral Saint": A person whose every action is as morally good as possible.
          *   "Loving Saint": Finds happiness in being moral (no conflict).
          *   "Rational Saint": Does the moral thing despite non-moral desires (conflict/duty).
      *   *Key Arguments:*
          *   The saint lacks non-moral virtues/interests (humour, gourmet food, art, etc.) because these don't contribute to the moral good (or contribute less than donating money/time).
          *   This makes the life *unattractive* or *unreasonable* as an ideal for *individual well-being*.
          *   It is not necessarily that saints are bad *people*, but that their lives are lacking in certain human goods.
      *   *The "Guilt/Judgment" Point:* Wolf mentions this, but it's a secondary observation, not the *central* argument. The central argument is about the *content* of the saint's life (lack of richness), not just the social effect.
      *   *The "Morality is One Value Among Many" Point:* Wolf argues against the *overridingness* thesis of morality regarding personal ideals. She doesn't necessarily say "be less moral" in a prescriptive sense of "break moral rules," but rather that morality shouldn't dominate the *concept of a good life*.
      *   *Effective Altruism (EA):* Wolf wrote in 1982. EA as a named movement didn't exist. She was targeting utilitarianism/Kantianism (Singer is a contemporary, but the specific label "Effective Altruism" is anachronistic).

  3.  **Drafting the Audit - Claim by Claim:**

      *   *Claim 1: "Wolf argues that a morally perfect person... is a bad ideal to hold up for human beings."*
          *   Verdict: Fair. This is the core thesis.
      *   *Claim 2: "She means by this people like religious saints or full-time aid workers."*
          *   Verdict: Simplification. She uses "Moral Saint" as a philosophical construct (maximising moral value), not necessarily canonised religious figures (who might have miracles, etc.) or specific job titles. But it's a reasonable heuristic.
      *   *Claim 3: "She distinguishes two versions. The Loving Saint... the Rational Saint..."*
          *   Verdict: Fair. These are her specific terms.
      *   *Claim 4: "Wolf's central complaint is that the saint's life has no room in it for the non-moral goods..."*
          *   Verdict: Fair. This is the "richness of life" argument.
      *   *Claim 5: "Her main evidence for this is that we find such people unbearable to be around, since they make us feel judged and guilty..."*
          *   Verdict: **Wrong/Exaggerated.** This is the first specific question. Wolf mentions this (the "smugness" or "guilt" induced in others), but her *main* argument is about the saint's own lack of fulfillment/richness. The handout makes this the "main evidence."
      *   *Claim 6: "...so the existence of moral saints is actually bad for the moral community."*
          *   Verdict: **Wrong.** She argues the ideal is bad for the *individual* adopting it, not necessarily that the *existence* of such people harms the community (though she hints at the social awkwardness).
      *   *Claim 7: "She also suggests that the Loving Saint must be missing a piece of perceptual equipment..."*
          *   Verdict: **Distortion.** She suggests the Loving Saint has a "different perceptual equipment" or a "different psychology" that prevents them from seeing the value of non-moral goods *as non-moral goods*. It's not necessarily a deficit ("missing a piece"), but a different constitution. However, she does imply this limits their humanity.
      *   *Claim 8: "Wolf concludes that we should therefore be less moral than we could be..."*
          *   Verdict: **Misleading.** She argues we shouldn't make moral perfection our *ideal*. She doesn't explicitly say "break moral rules." She says morality is not the *only* value.
      *   *Claim 9: "...and that morality is at bottom just one value among others, with no special claim on us."*
          *   Verdict: **Nuanced.** She argues against the *overridingness* of morality in the context of a *good life*. She doesn't deny morality has claims, but denies it trumps all other considerations for personal well-being.
      *   *Claim 10: "Her real target is the effective altruism movement..."*
          *   Verdict: **Anachronistic/Wrong.** EA didn't exist. Her target is Utilitarianism (Singer) and Kantianism.

  4.  **Addressing the Two Specific Points of Interest:**

      *   *Point 1 (Guilt/Judgment):* The handout overstates this. Wolf mentions it (Section III roughly), but the core argument is about the *content* of the life (lack of hobbies, wit, etc.). The "unbearable" nature is a symptom, not the proof.
      *   *Point 2 (Conclusion):* The handout infers a prescriptive "be less moral" from a descriptive/normative claim about "ideals of personal well-being." Wolf is careful to distinguish between "what morality requires" and "what makes a life good." The handout conflates them.

  5.  **Refining the Tone and Language:**
      *   Must be British English (e.g., "summarising," "programme," "centre," "defence").
      *   Tone should be academic but accessible (reading group context).
      *   Ensure corrections are constructive.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did Wolf say saints are "bad"? She said the *ideal* is not attractive.
      *   *Check:* Did she say morality has *no* special claim? She argues against the "overridingness thesis." I need to be precise there.
      *   *Check:* The "perceptual equipment" line. Wolf says the Loving Saint *sees* the moral good as the only good. To us, they look like they are missing something. To them, they aren't. The handout says she suggests they *are* missing equipment. Wolf's point is more that their psychology precludes the appreciation of non-moral value. I should clarify this distinction.
      *   *Check:* EA claim. This is a major anachronism. Need to highlight that Singer was writing *then*, but the movement label is later. Wolf was critiquing the philosophical underpinnings, not the modern branding.

  7.  **Final Polish:** Organise into "The Audit," "Specific Queries," and "Vocabulary Notes." Ensure the British spelling is consistent. (e.g., "behaviour," "labour," "organise" - though "summarising" was in the prompt, I'll maintain that style).

      *(Self-Correction on British English)*: The prompt uses "summarising" and "programme" isn't there but I should ensure I use "s" not "z" for verbs (organise vs organize) and standard UK spelling.

      *(Refining the "Less Moral" point)*: Wolf explicitly says, "It is not clear... that we ought to be morally better than we are." But she frames it around the *ideal*. The handout's "we should be less moral" is a bit punchier than Wolf's nuanced "morality need not be the dominant concern." I will flag this as a simplification that borders on misrepresentation.

      *(Refining the "Guilt" point)*: Wolf writes: "The presence of Moral Saints... might make the rest of us feel uncomfortable." But she prefaces this by saying the *primary* reason the ideal is unattractive is the lack of non-moral virtues. The handout makes the guilt the "main evidence." This is a significant shift in weight.

      *(Refining the EA point)*: Wolf cites Singer. Singer is the grandfather of EA. But saying her target *is* EA is historically false. It's better to say her target is the *philosophical commitments* that underpin EA.

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is a claim-by-claim audit of the handout, followed by a discussion of your two specific points of interest.

  ### The Audit

  **Claim 1:** *'Wolf argues that a morally perfect person — someone for whom morality is the overriding, all-consuming project — is a bad ideal to hold up for human beings.'*
  *   **Verdict:** **Fair.**
  *   **Comment:** This accurately captures Wolf's central thesis. She is not arguing that moral saints are *evil*, but that the *ideal* of moral sainthood is not an attractive or reasonable conception of personal well-being.

  **Claim 2:** *'She means by this people like religious saints or full-time aid workers.'*
  *   **Verdict:** **Acceptable Simplification.**
  *   **Comment:** Wolf uses "Moral Saint" as a philosophical construct (a person whose every action is as morally good as possible) rather than a sociological category. While aid workers or religious figures might fit the description, Wolf is critiquing a *structure of motivation*, not a job title. However, for a one-pager, this heuristic is passable.

  **Claim 3:** *'She distinguishes two versions. The Loving Saint does the morally best thing joyfully and without inner conflict; the Rational Saint does the morally best thing, but from a grim sense of duty.'*
  *   **Verdict:** **Fair.**
  *   **Comment:** These are Wolf's actual terms. The distinction is crucial to her argument: the Rational Saint is obviously sacrificing non-moral goods, but the Loving Saint is problematic because their psychology prevents them from valuing those goods in the first place.

  **Claim 4:** *'Wolf's central complaint is that the saint's life has no room in it for the non-moral goods: friendship, hobbies, art, play.'*
  *   **Verdict:** **Fair.**
  *   **Comment:** This is the core of her "richness of life" argument. She argues that a life dominated by moral concerns necessarily crowds out the development of non-moral virtues (wit, humour, gourmet appreciation, artistic skill) because these do not contribute maximally to the moral good.

  **Claim 5:** *'Her main evidence for this is that we find such people unbearable to be around, since they make us feel judged and guilty, so the existence of moral saints is actually bad for the moral community.'*
  *   **Verdict:** **Incorrect / Exaggerated.**
  *   **Correction:** Wolf *mentions* that moral saints might make others feel uncomfortable or judged, but this is a secondary observation, not her "main evidence." Her primary argument is that the saint's life is *internally* impoverished, not that it is socially disruptive. She does not conclude that their *existence* is bad for the community, but rather that adopting their *ideal* is bad for the individual.
  *   **Vocabulary Note:** The handout uses "evidence" here. In philosophy, this is more of a supporting intuition pump than empirical evidence.

  **Claim 6:** *'She also suggests that the Loving Saint must be missing a piece of perceptual equipment, since otherwise he would notice how much he is giving up.'*
  *   **Verdict:** **Distortion.**
  *   **Correction:** Wolf suggests the Loving Saint has a *different* psychological constitution, not necessarily a deficit. They do not see non-moral goods *as* goods to be sacrificed; they simply do not value them. Wolf's point is that *we* (the observers) see a loss of human richness, not necessarily that the Saint is "broken." However, she does imply that a life without the capacity to value non-moral goods is less than fully human.

  **Claim 7:** *'Wolf concludes that we should therefore be less moral than we could be, and that morality is at bottom just one value among others, with no special claim on us.'*
  *   **Verdict:** **Misleading / Overstated.**
  *   **Correction:** Wolf argues that morality should not be the *overriding* value in a conception of a *good life*. She does not explicitly argue that we ought to violate moral duties or "be less moral" in a prescriptive sense. Rather, she argues against the "overridingness thesis" — the idea that moral reasons always trump non-moral reasons. She leaves room for morality to have a special claim, just not an absolute one that consumes all of life.

  **Claim 8:** *'Her real target is the effective altruism movement, which simply hadn't been named yet when she wrote.'*
  *   **Verdict:** **Anachronistic / Incorrect.**
  *   **Correction:** Wolf's targets are Utilitarianism (specifically Peter Singer, whom she cites) and Kantianism. While Effective Altruism (EA) draws heavily on Singer, the movement itself did not exist in 1982. It is more accurate to say her target is the *philosophical commitments* that later underpinned EA, rather than the movement itself.

  ***

  ### Addressing Your Specific Points of Interest

  **1. Does her argument really turn on how saints affect the people around them?**

  No, the handout gives this far too much weight. While Wolf does discuss the social dimension in the latter part of the essay, noting that a community of moral saints might be "dull" or that their presence might induce guilt in others, this is not the engine of her argument.

  Her primary argument is about **personal well-being**. She asks: *Is this a life that constitutes human flourishing?* Her conclusion is that it does not, because it lacks the "non-moral virtues" that make life rich and interesting (e.g., being able to appreciate a joke, enjoying a hobby for its own sake, cultivating a friendship without calculating its moral utility).

  The handout frames the argument as: *Saints are bad because they make us feel bad.*
  Wolf's argument is: *Sainthood is an unattractive ideal because it makes the saint's life narrow.*

  If you rely on the handout's version in conversation, a knowledgeable interlocutor will likely point out that Wolf is concerned with the *saint's* loss of humanity, not merely the observer's discomfort.

  **2. Does the concluding claim follow from the accurate parts?**

  The claim that *"morality has no special claim on us"* and *"we should be less moral than we could be"* is an inference the handout has added, and it is a aggressive one.

  Wolf is careful to distinguish between **morality** (a system of obligations) and **the good life** (a system of values). Her argument is that these two concepts do not perfectly overlap.
  *   **What Wolf says:** We are permitted to pursue non-moral interests even when doing so does not maximise the moral good. Morality is not the *sole* determinant of a rational life.
  *   **What the handout implies:** We have a licence to ignore moral claims because morality is "just one value among others."

  Wolf does not deny that morality has a *special* claim; she denies that it has an *overriding* claim in every context. The handout's phrasing ("no special claim") suggests a moral relativism or egoism that Wolf does not endorse. She is arguing for a **pluralism of values**, not a dismissal of moral obligation.

  Furthermore, the phrase "we should be less moral" is provocative but imprecise. Wolf suggests we should not aim for *moral perfection* as our personal ideal. She does not suggest we should aim for *moral imperfection*. There is a logical gap between "do not make morality your only project" and "be less moral than you could be." The former allows for being very moral, provided one also values art or friendship; the latter suggests actively leaving moral value on the table.

  ### Vocabulary Notes

  *   **"Moral Saint":** In everyday English, "saint" implies holiness or canonisation. In Wolf's essay, it is a technical term for an agent who maximises moral value in every action. Be careful not to conflate the two; Wolf is not critiquing Mother Teresa's piety, but the utilitarian logic that would require her to sacrifice all non-moral interests.
  *   **"Overriding":** This is a term of art in meta-ethics. When the handout says morality has "no special claim," it misses the nuance of the "overridingness thesis." Wolf is arguing that moral reasons are not *always* overriding, not that they are never weighty.
  *   **"Perceptual Equipment":** The handout uses this metaphorically. Wolf uses it to describe the psychological capacity to recognise value. Be aware that she is discussing moral psychology, not literal perception.

  ### Summary for your Reading Group

  If you wish to correct the record without being pedantic, you might say:

  > "The handout captures Wolf's distinction between the Loving and Rational Saint well, but it overstates the 'guilt' argument. Wolf's main point is that a life devoted entirely to morality lacks the richness required for personal well-being, regardless of how it makes others feel. Also, while her arguments certainly apply to Effective Altruism, she was technically targeting the Utilitarian and Kantian frameworks that predate the movement. Finally, she argues that morality shouldn't be our *only* ideal, rather than concluding we should actively aim to be 'less moral'."
