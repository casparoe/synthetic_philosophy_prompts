      *   *Therapeutic:* Repeated exposure in a controlled environment habituates the soul to resist the pull of pleasure and fear. It's "gymnastics for the soul."
      *   *The Conflict:* If I am training to be better, my "true self" (the untrained baseline) is changing. If the test measures my current state, it's useful for grading, but if the goal is to reach an ideal, the test changes as I improve. More critically, if the training *requires* self-control to be effective, but the point is to *build* self-control, we have a circularity problem.
