answer: |-
  ### Executive Summary: Is This Novel or a Rehash?

  **Verdict:** It is conceptually distinct. Do not treat this as a rehash of the Nordic, Dutch, or New Zealand models.

  **Why:** Existing regimes correlate *control* with *liability*.
  *   **Employee Model (NZ/Dutch):** Intermediaries control the worker $\rightarrow$ Intermediaries bear liability.
  *   **Independent Contractor (Dutch/US):** Seller controls the work $\rightarrow$ Seller bears liability/risk.
  *   **Nordic:** Buyer bears criminal risk; Seller is treated as a victim/agent hybrid.

  **The Cut-Taker Model (CTM) breaks this correlation.** It grants the seller maximum autonomy (unilateral contract voiding, fiscal immunity) while imposing maximum risk on the intermediary (strict liability for harm, licensing). This creates a **Decoupling Problem**: *Can an industry be morally and logically coherent when the party with the least control (the infrastructure) bears the most responsibility, while the party with the most control (the seller) bears the least?*

  This is not a policy tweak; it is a structural paradox. That is your research hook. It justifies a two-year theoretical deep dive.

  ---

  ### The Research Agenda (Prioritized)

  You have four researchers and two years. Do not split them evenly. Stack the work so Year 1 resolves the upstream conceptual blockers for Year 2.

  #### Priority 1: The Boundary Problem (Defining the "Cut-Taker")
  **Question:** *What are the necessary and sufficient conditions for an actor to be classified as a "Cut-Taker" subject to strict liability?*
  *   **Why Upstream:** You cannot theorize liability (Priority 3) or contract rights (Priority 2) until you define who falls under the regime. Is a driver a cut-taker? A security guard hired by the seller? A landlord who knows the use but takes a flat rent? A payment processor?
  *   **Philosophical Work:** This is a problem of **categorization and moral relevance**. You are drawing a moral boundary around "complicity." If the landlord takes rent, are they complicit in the risk? If the app takes 5%, are they an employer or a utility?
  *   **Empirical Trap:** Do not ask "Who currently takes cuts?" That is sociology. Ask "What *makes* taking a cut a liability-triggering act?" Is it profit dependency? Knowledge of risk? Ability to prevent harm?
  *   **Kill Switch:** If you cannot define "Cut-Taker" without arbitrary lines (e.g., "anyone earning over $X"), the model is legally void for vagueness. Flag this early.

  #### Priority 2: The Contract Paradox (The Unilateral Void)
  **Question:** *Does a statutory right to void any contract/debt immediately negate the possibility of a binding agreement, and if so, what replaces it?*
  *   **Why Second:** The CTM relies on transactions occurring. But if a seller can void the agreement *after* the service is rendered (implied by "any debt"), the concept of "payment for service" collapses into "gift or tribute."
  *   **Philosophical Work:** This is **Speech Act Theory and Promise Theory**. Can a promise be binding if one party holds a "get out of jail free" card? If the answer is no, then the "Cut-Taker" is not entering a contract but accepting a donation with risk. This fundamentally changes the moral justification for the license.
  *   **Empirical Trap:** Do not ask "Will sellers use the void right?" That is behavioral econ. Ask "Does the *existence* of the right render the concept of 'price' incoherent?"
  *   **Kill Switch:** If your team concludes that the Void Right makes "commerce" conceptually impossible, the model is a fantasy. You must report this. It is better to kill the theory in Year 1 than fund a policy that cannot exist.

  #### Priority 3: The Liability Gap (Strict Liability without Control)
  **Question:** *Is strict liability morally justifiable when the liable party lacks the authority to mandate safety protocols?*
  *   **Why Third:** This depends on Priorities 1 & 2. Once you know who the Cut-Taker is and the nature of their agreement, you assess the liability. Standard strict liability (e.g., owning a dangerous dog) assumes the owner controls the dog. Here, the Intermediary cannot control the Seller (due to the Void Right and autonomy).
  *   **Philosophical Work:** This is **Moral Luck and Responsibility**. Is it just to punish an agent for harm they could not prevent? The CTM argues the "cut" is payment for *assuming* this risk. Your team must theorize whether risk-assumption can be commodified this way.
  *   **Empirical Trap:** Do not ask "Will this reduce violence?" That requires data. Ask "Is it *fair* to make a platform liable for a private meeting they did not arrange?"
  *   **Kill Switch:** If the team finds that strict liability requires *control* as a necessary moral condition, the CTM is ethically bankrupt.

  #### Priority 4: Fiscal Exceptionalism (Tax and Creditor Immunity)
  **Question:** *What is the justification for granting a specific class of laborers sovereign-like immunity from state fiscal claims?*
  *   **Why Last:** This is political philosophy, which rests on the metaphysics of the work (defined in 1-3). If sex work is "labor," why is it tax-exempt? If it is "reparation," why is it commercial?
  *   **Philosophical Work:** **Distributive Justice and State Theory.** Tax immunity creates a caste of workers outside the social contract. Is this a form of reparative justice (acknowledging historical stigma)? Or is it creating a zone of lawlessness?
  *   **Empirical Trap:** Do not calculate revenue loss. Ask "Does tax immunity undermine the seller's status as a citizen?"
  *   **Kill Switch:** If the immunity is indefensible without treating sellers as permanent victims (which contradicts the autonomy in Priority 2), the model is paternalistic disguised as liberation.

  ---

  ### Methodology: How to Work Without Data or Libraries

  Since you cannot rely on existing literature or fieldwork, your team must use **Conceptual Stress-Testing**.

  1.  **The "Edge Case" Method:** For every definition (e.g., "Cut-Taker"), construct extreme hypothetical scenarios. *Example: If a seller uses a public bus to get to a client, is the transit authority a Cut-Taker?* If the definition breaks, refine it.
  2.  **Internal Consistency Checks:** Pit the principles against each other. *Example: If the Seller can void a debt (Priority 2), can they void a debt owed to the Cut-Taker for a license fee?* If yes, the licensing regime collapses.
  3.  **Comparative Intuition Pumps:** Compare the CTM to other strict liability regimes. *Example: We hold parents liable for minors' harm. Is the Cut-Taker a 'parent'? We hold employers liable for employees. Is the Cut-Taker an 'employer'?* If it fits neither, why?

  ### Risk Assessment: When to Pivot

  You asked what would push a question up or down the list.

  *   **Push Priority 2 (Contracts) to #1 if:** The team discovers that the "Void Right" makes the "Cut-Taker" definition impossible. (e.g., You can't define a licensee if the licensor can't enforce terms).
  *   **Drop Priority 4 (Tax) entirely if:** The team determines the model is morally incoherent at Priority 3. There is no point justifying tax breaks for an industry that cannot ethically assign liability.
  *   **Elevate "Feasibility of Intermediation" if:** The team concludes that no rational actor would become a Cut-Taker under these rules. While this sounds empirical, it is a **Rational Choice Theory** problem. If the risk/reward ratio is logically prohibitive, the model describes a vacuum, not a policy.

  ### Final Advice to the Foundation

  Be honest with the board. This model is not "Nordic/Dutch/NZ mixed." It is a **high-risk theoretical experiment** that decouples risk from control.
  *   **Best Case:** Your team produces a robust theory of "Risk-Assumption as Service," which could revolutionize gig-economy regulation beyond sex work.
  *   **Worst Case:** Your team proves the model is logically incoherent (e.g., you cannot have strict liability without control).

  If the latter happens, you have still done valuable work: you have saved the foundation from funding a policy that cannot function. Do not shy away from that conclusion. A negative result in theory is still a result.

  **Staffing Recommendation:**
  *   **1 Legal Theorist:** Focus on Priority 1 & 2 (Contracts/Definitions).
  *   **1 Moral Philosopher:** Focus on Priority 3 (Liability/Responsibility).
  *   **1 Political Philosopher:** Focus on Priority 4 (Tax/State).
  *   **1 Lead Synthesizer:** Focus on Internal Consistency and the "Kill Switches."

  This agenda respects the board's obsession but treats it with the rigor it requires to survive contact with reality.
