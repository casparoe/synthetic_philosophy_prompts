  10. **Final Review against Constraints:**
      *   4 people, 2 years. Needs to be tight.
      *   No library access. Arguments must be first-principles.
      *   Tone: Professional, direct, slightly critical (as requested).

  11. **Structuring the Output:**
      *   Executive Summary (Novelty assessment).
