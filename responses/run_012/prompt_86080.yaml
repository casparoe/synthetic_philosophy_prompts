      1.  **The Boundary Problem (Who is a Cut-Taker?)** -> Upstream. If you can't define the target of liability, you can't theorize liability.
      2.  **The Contract Paradox (Voiding Rights)** -> Upstream. If contracts don't exist, the economic model is theoretical nonsense.
      3.  **The Liability Justification (Strict Liability)** -> Midstream. Depends on 1 & 2.
      4.  **Fiscal Sovereignty (Tax/Debt)** -> Downstream. This is about the state's relation, which depends on the nature of the work defined in 1 & 2.

      *Wait, is the Contract Paradox more upstream?* If the seller can void *any* debt, does the intermediary have a claim to payment? The prompt says "income is untaxed and can't be seized." It implies payment happens. The void right is for *contracts* (agreements to perform) and *debts*.
      Okay, the *Boundary Problem* is still first. You need to know who is licensed before you ask about their liability or contracts.
      Actually, the *Moral Status of the Transaction* is the most upstream. But the prompt implies we are past "is it moral?" and into "how does this regulation work?"
      Let's stick to the regulatory mechanics as philosophical problems.
      1.  **Categorization (The Cut-Taker Definition).**
      2.  **Agency (The Unilateral Void).**
