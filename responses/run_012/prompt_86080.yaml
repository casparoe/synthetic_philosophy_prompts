      *   Methodology Note (What philosophy can do).
      *   Risk Assessment (When to kill a line of inquiry).

      *(Self-Correction during drafting)*: Make sure I don't slip into policy recommendations. Keep it conceptual. Instead of "How to implement tax immunity," ask "What is the moral justification for fiscal exceptionalism?"

      *(Refining Question 1)*: The definition of "Cut-Taker" is crucial. Is a driver a cut-taker? What about a security guard paid by the seller? The boundary problem is conceptual.
      *(Refining Question 2)*: The "Right to Exit." Is this paternalism or autonomy?
