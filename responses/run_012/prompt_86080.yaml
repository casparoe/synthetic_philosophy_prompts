      *   **Topic:** Sex work policy.
      *   **Constraint/Challenge:** The foundation board is obsessed with a specific, novel proposal ("Cut-Taker Model").
      *   **The Model:** Buying/selling legal. Seller income untaxed/protected from creditors. Intermediaries (brothels, platforms, landlords, etc.) need licenses + strict liability for seller harm. Sellers have unconditional statutory right to void contracts/debts immediately.
      *   **Goal:** A prioritized research agenda of *conceptual questions*.
      *   **Requirements:** Defend the ordering (upstream/downstream), identify what philosophy can/can't solve, flag empirical/disguised questions, and honestly assess if this model is actually novel or just a rehash of existing regimes (Nordic, Dutch, NZ).

  2.  **Deconstruct the "Cut-Taker Model" (CTM):**
      *   *Feature A:* Decriminalization of exchange (like NZ/Dutch).
      *   *Feature B:* Fiscal/Creditor Protection for sellers (Unique/Strong).
      *   *Feature C:* Licensing + Strict Liability for Intermediaries (The "Cut-Takers"). This is the core innovation. It shifts risk entirely onto the infrastructure.
      *   *Feature D:* Unilateral Voiding Power for sellers (Contract law anomaly).

  3.  **Initial Assessment: Novelty vs. Rehash:**
      *   Is it just old wine in new bottles?
      *   *Nordic:* Criminalizes buyers. CTM does not. So, distinct.
      *   *Dutch:* Legalizes + Regulates intermediaries. CTM does this but adds *strict liability* and *tax immunity*. Distinct.
      *   *NZ:* Decriminalizes + Labor law focus. CTM adds the strict liability and contract voiding. Distinct.
      *   *Verdict:* It *is* conceptually distinct, primarily due to the *Strict Liability on Intermediaries* combined with *Unilateral Contract Voiding*. This creates a specific tension: How do you regulate an industry where the primary actors (sellers) have zero legal accountability for breach of contract, and the secondary actors (infrastructure) have maximum accountability for harm? This is a fertile ground for political philosophy, legal theory, and ethics. It's not just a rehash.

  4.  **Brainstorming Conceptual Questions:**
      *   What is "harm" in strict liability? (Definition problem)
      *   Is strict liability justifiable without fault? (Moral philosophy)
      *   Does unilateral voiding destroy the concept of a contract? (Legal theory)
      *   Does tax immunity create a caste system? (Political philosophy/Justice)
      *   Can intermediaries exist under this risk profile? (Feasibility/Political Economy - *Wait, this is empirical.* Need to frame it theoretically: "Conditions of possibility for intermediation".)
      *   What is the moral status of the "cut"? (Exploitation vs. Service fee)
      *   Autonomy vs. Protection tension.

  5.  **Prioritizing & Ordering (The "Upstream" Logic):**
      *   *Foundation:* You can't discuss liability or contracts without defining the moral status of the transaction and the parties.
      *   *Layer 1: Moral Ontology.* What is being sold? Is it labor? A service? Access to a body? This dictates the contract theory.
      *   *Layer 2: The Contractual Anomaly.* The unilateral voiding right. If this collapses the concept of agreement, the rest doesn't matter.
      *   *Layer 3: Liability & Risk.* The strict liability on intermediaries. Who counts as an intermediary? What counts as harm?
      *   *Layer 4: Structural Justice.* Tax immunity and creditor protection. Implications for equality and state relation.

  6.  **Filtering for "Philosophy Only":**
      *   *Avoid:* "Will platforms leave the market?" (Empirical/Econ). *Reframe:* "Is the model internally consistent if intermediaries exit?"
      *   *Avoid:* "Does strict liability reduce violence?" (Empirical). *Reframe:* "Is strict liability morally justified as a deterrent vs. punitive measure in this context?"
      *   *Avoid:* "How do we define sex work?" (Sociological). *Reframe:* "What are the necessary and sufficient conditions for a transaction to fall under this regulatory regime?"

  7.  **Drafting the Agenda (Iterative Process):**

      *   *Question 1: The Nature of the 'Cut'.* Before liability, we need to know what intermediaries *are*. Are they employers? Partners? Landlords? This defines the scope of the license.
      *   *Question 2: The Unilateral Void.* This is the most radical legal theory piece. Can a promise be binding if one side can dissolve it at will? Does this undermine agency or enhance it?
      *   *Question 3: Strict Liability without Fault.* Standard tort theory relies on negligence. Strict liability is usually for ultra-hazardous activities. Is sex work ultra-hazardous? If so, why put it on the landlord and not the buyer?
      *   *Question 4: Fiscal Exceptionalism.* Tax immunity. Does this create a "sovereign" class of workers? Is it just?

      *Refining the Order:*
      Actually, the *Unilateral Void* is the most disruptive. If the seller can walk away from *any* debt immediately, does the "contract" exist at all? If no contract exists, can there be a "breach"? If there's no breach, what is the intermediary liable *for*?
      *Correction:* The liability is for *harm*, not breach. Okay.
      But the Void Right affects the economic relationship.
      Let's start with the **Definition of the Regime's Boundaries**. If we can't define who falls under "Cut-Taker," the liability model is incoherent.
      Then move to **Contract Theory** (The Void Right).
      Then **Liability Theory** (Strict Liability).
      Then **Political Justice** (Tax/Debt).

  8.  **Addressing the "Rehash" Concern:**
      *   I need to be honest. The *components* are familiar. The *combination* creates a specific paradox: Maximum seller autonomy (void rights) + Maximum intermediary risk (strict liability).
      *   Existing models try to balance risk. This model polarizes it.
      *   So the research isn't "Is sex work work?" (Old question). It's "Can an industry function where risk and control are decoupled?" (New question).

  9.  **Developing the "Stop/Go" Criteria:**
