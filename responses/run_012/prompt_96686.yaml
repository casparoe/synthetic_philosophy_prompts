answer: |-
  Here are the scores, committed as requested.

  - **Someone physically holding you down.**
    **1.0**
    Physical force overrides agency completely; there is no signal of assent, only submission to mechanics.

  - **"Do this or I'll get you fired," from the person doing the asking.**
    **0.9**
    This is quid-pro-quo coercion; the threat introduces a penalty for refusal that makes the choice involuntary.

  - **Nobody is threatening anything, you're just broke and every option in front of you is bad.**
    **0.2**
    Background constraints limit options but do not constitute active coercion by the agent; the choice remains technically voluntary.

  - **They lie to you about a dealbreaker fact.**
    **0.95**
    Consent is an agreement to a specific reality; falsifying core terms means you agreed to a transaction that does not exist.

  - **They lie to you about something you care about, but it's a fact about their feelings rather than about the world.**
    **0.6**
    Emotional fraud undermines the relational context, but the physical act remains as described, placing it in a gray zone between fraud and disappointment.

  - **They simply don't mention something you'd obviously want to know, and you don't think to ask.**
    **0.5**
    Omission violates the duty to disclose material facts, but the burden of inquiry is shared, making it a partial invalidation of *informed* consent.

  - **You're drunk. Drunk enough to have made a bad call, but you'd honestly have said yes sober too.**
    **0.3**
    Impaired judgment exists, but counterfactual alignment suggests the will was not overridden, just lubricated.

  - **You're drunk enough that you don't remember it the next day.**
    **0.85**
    Blackout-level intoxication implies incapacity to form intent or store memory of the agreement; agency is significantly compromised.

  - **You want it, but only because of stuff you were taught to want growing up, and if you'd been raised elsewhere you almost certainly wouldn't.**
    **0.1**
    This is socialization/preference formation; invalidating this renders almost all consent void, as all preferences are externally shaped.

  - **You signed something in advance agreeing to whatever a future you gets asked, and now future-you is being asked.**
    **0.4**
    Ulysses contracts hold weight, but bodily autonomy is generally considered revocable in the present moment; past consent binds weakly against present reluctance.

  - **Everyone's watching, and saying no would make you the buzzkill.**
    **0.7**
    Social pressure is a form of soft coercion; the cost of refusal is social ostracization, which compromises voluntariness.

  - **You consented, then halfway through changed your mind and didn't say anything.**
    **0.8**
    Consent is continuous and internal; if the internal state is "no," consent is invalid, regardless of the failure to communicate that withdrawal.

  ***

  ### 1. Divergence: "Did they consent?" vs. "Is it fine to proceed?"

  There are three items where the *ontological status of consent* diverges from the *moral permissibility of the actor*:

  *   **You're drunk (bad call but would say yes sober) [0.3]:** They technically consented (low invalidation), but it is often not *fine* to proceed because verifying the counterfactual ("would you have said yes sober?") is impossible in the moment.
  *   **You're broke [0.2]:** They consented (low invalidation), but proceeding might be exploitative. The consent is valid, but the *circumstances* make the action morally hazardous.
  *   **Changed mind silently [0.8]:** Consent is actually invalid (high score), but if the withdrawal wasn't communicated, it may be *fine* for the partner to proceed (low culpability). This is the clearest split: the consent is gone, but the partner isn't necessarily violating it.

  ### 2. Same Defeater, Different Hats

  These scenarios cluster into three primary failure modes:

  *   **Coercion (External Cost):** *Holding down (1.0)*, *Fired threat (0.9)*, and *Buzzkill (0.7)* are all the same mechanism: raising the cost of refusal to unacceptable levels.
  *   **Information (Model Mismatch):** *Lie dealbreaker (0.95)*, *Lie feelings (0.6)*, and *Omission (0.5)* are all failures of information symmetry. You are consenting to a map that does not match the territory.
  *   **Capacity (Internal Ability):** *Drunk blackout (0.85)* and *Drunk bad call (0.3)* are variations on cognitive capacity to process the decision.

  ### 3. Category Errors and Underlying Scales

  **The Outlier:**
  *   **Socialization (0.1)** does not belong on this list. It is a category error for a transactional consent framework. This is a philosophical critique of *preference formation*, not a failure of the *consent mechanism*. If you include this as a high invalidator, the concept of consent collapses entirely because no preferences are endogenous.

  **Underlying Scales:**
  I would bet on **three separate failure modes** that share a name, rather than one underlying scale.
  1.  **Voluntariness:** Was there a threat? (Coercion)
  2.  **Competence:** Was the brain capable of processing? (Capacity)
  3.  **Information:** Was the data accurate? (Fraud)

  You can have perfect Voluntariness and Competence but zero Information (fraudulent contract). You can have perfect Information and Voluntariness but zero Competence (sleepwalking). They are distinct dimensions of validity, not points on a single line.
