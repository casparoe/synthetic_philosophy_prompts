      *   Rule: To cash in for candy at the end, you need 1 Red token.
      *   Talents start with 5 Reds. They can sell them for Blues.
      *   Talents accumulate Blues. Everyone else stays low.
      *   This guarantees inequality and creates a dependency.

      *   *Wait, the User wants them to feel the policing.*
      *   Okay, let's go with **The Ledger System.**
      *   Every trade must be written down.
      *   Auditors must initial the ledger.
