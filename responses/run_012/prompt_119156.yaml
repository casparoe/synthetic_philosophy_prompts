      *   This makes the *process* slow and annoying.

  7.  **Finalizing the Plan:**
      *   **Name:** "The Ledger Game."
      *   **Materials:** Poker chips, Ledgers (paper), Pens, Candy, Role Cards.
      *   **Roles:** 13 Traders, 3 "Hubs" (Talents), 2 "Auditors" (later).
