      *   **Mechanics:**
          *   *Production:* Needs to be simple. Maybe passing notes? Or a simple puzzle? Let's go with a "Service Exchange." Talents have a "Stamp" that validates a trade. No, that's too complex.
          *   *Better Mechanism:* "Value Generation." Everyone gets 5 tokens. Talents have "Multiplier Cards." If a regular student trades with a Talent, the Talent gets 3 tokens, the student gets 1 (simulating value add). If regular trades with regular, 1 for 1.
          *   *Actually, simpler:* Just let them trade freely, but Talents have a secret rule: *Every time someone gives them a token, they give back a 'receipt'.* The receipt is worth 2 tokens at the end. This incentivizes flowing tokens to Talents without complex math during the round.
          *   *Even Simpler (for 90 mins):* **The "Popularity" Mechanism.** Talents are the only ones allowed to receive tokens from more than one person per round. Or, Talents have a "Special Good" (colored card) that everyone wants. Let's go with the **Special Good**. Talents hold 5 "Gold Cards." Everyone else wants them. To get a Gold Card, you pay 2 tokens. Talents can replenish Gold Cards every round. Regulars trade tokens 1:1. This naturally concentrates wealth.
      *   **The Pattern:** Equalization. Max holding cap.
      *   **The Enforcement:** Auditors must check every trade. This is the key. They need to physically move between groups or check ledgers. Let's make it a **Centralized Exchange**. All trades must be logged with Auditors. This creates the bottleneck.

      *   *Refined Mechanism for "Burden":*
          *   Round 1: Free Market. 5 mins. Chaos. Inequality emerges.
          *   Vote: Impose a "Cap" (e.g., no one can hold more than 10 tokens).
          *   Round 2+: Regulated Market. 3 rounds of 3 mins.
          *   Enforcement: 2 Auditors. They must sign off on every transfer. If someone exceeds the cap, Auditors must confiscate *immediately*.
          *   Twist: Give students "Secret Goals" (e.g., "End with exactly 8 tokens"). This makes the Cap frustrating because it interferes with personal plans, not just abstract justice.

  4.  **Drafting the Timeline:**
      *   0-10: Setup & Instructions.
      *   10-20: Round 1 (Unregulated).
      *   20-30: The Vote & Rule Setting.
      *   30-60: Rounds 2-4 (Regulated). *Crucial: Make enforcement painful.*
