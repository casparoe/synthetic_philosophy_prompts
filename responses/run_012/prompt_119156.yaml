      *   **Desired Outcome:** Students *feel* the burden of policing, resent the interference, and see how liberty disrupts patterns.
      *   **Constraints:** Tokens/candy (no real money). Keep Nozick/Chamberlain names out until debrief.
      *   **Requirements:** Rules, roles, materials, timeline (90 mins), debrief structure (mapping, pitfalls, limitations).
      *   **User's Sketch:** Equal start -> Free trade with "talented" students -> Vote on pattern -> Assign "pattern-keepers" -> Run rounds -> Enforcers get overwhelmed/resented.
      *   **Specific Requests for Debrief:** Map moments to theory (historical vs. end-state, interference), predict pitfalls (gaming, fake stakes), acknowledge limitations (baseline justice, historical acquisition).

  2.  **Evaluate and Refine the User's Sketch:**
      *   *Strengths:* It captures the core dynamic. Equal start -> Inequality -> Redistribution -> Enforcement cost.
      *   *Weaknesses/Risks:*
          *   "Talent" needs to be mechanical, not actual skill, to ensure fairness/replicability.
          *   "Policing" needs to be burdensome. If the TA does it, students won't feel it. The students *must* be the enforcers.
          *   "Hiding trades" is hard to simulate without chaos. Need a mechanism that makes enforcement *tedious* rather than impossible.
          *   Time management: 90 minutes goes fast. Need tight rounds.
          *   Stakes: Candy/tokens need to feel valuable enough to trade, but not so valuable that redistribution causes actual anger (safety).
          *   The "Vote": If they vote to redistribute, they might vote to *stop* redistributing later. Need to lock them into the role.

  3.  **Develop the Activity Design ("The Pattern Game"):**

      *   **Materials:** Poker chips or colored beads (tokens), candy (rewards), "Production Cards" (the talent mechanism), "Ledger Sheets" (for enforcers).
      *   **Roles:**
          *   *Producers:* Most students.
