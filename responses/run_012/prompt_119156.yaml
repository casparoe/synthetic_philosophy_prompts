      *   *Let's stick to the User's idea but tighten it:*
      *   **Round 1:** Free Trade. 3 "Producers" have a stamp. If you get a stamp on your sheet, your tokens double at the end of the round. Everyone wants a stamp. Producers charge for stamps. Inequality happens.
      *   **Round 2:** Cap imposed. Auditors check sheets.
      *   *Problem:* Doubling is math-heavy.
