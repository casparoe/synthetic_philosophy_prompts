prompt: |-
  I manage a small forecasting team at a nonprofit that advises state health agencies, and we keep hitting a recurring problem: two analysts will present different probabilities for the same event, each has read the other's memo, each knows the other has read it, and yet neither moves. My graduate training left me with Aumann's agreement theorem and the uneasy sense that it says this should be impossible under certain conditions, but the conditions are exactly what we never have: a shared prior, common knowledge of rationality, and posteriors that are common knowledge rather than merely public. I need a decision procedure my team can run, in under an hour, when two analysts disagree by more than a stated threshold, say ten percentage points on a binary event, to decide whether to keep reconciling, escalate to me, or formally record the disagreement and move on. The procedure should distinguish among the several ways the theorem's assumptions can fail, because the right response differs depending on whether the failure is a different prior, private information that one analyst cannot disclose, a disagreement about the model class, or a failure of common knowledge rather than mutual knowledge. It should treat common knowledge as a graded thing, what the team knows, what each knows the other knows, and so on, and it should say at what level it is worth spending meeting time to climb, since infinite common knowledge is not available in a Tuesday staff meeting. It should also be honest about cases where the theorem is irrelevant because the disagreement is normative, because the analysts are not Bayesian agents in the relevant sense, or because they are disagreeing about what counts as the event rather than about its probability. Please write the procedure as an internal operating procedure with numbered steps, a short set of test questions, a clear statement of who signs off on escalation, and a final section on what the procedure cannot settle.

  Then run the procedure on three cases: first, two analysts disagree about the probability that a new variant will cause a hospital surge, one using a mechanistic model and one using a historical base rate; second, two analysts agree on the model but one has seen a preliminary unpublished dataset that cannot be shared outside the team; third, a case where the procedure tells me to stop reconciling even though I strongly want consensus, and explain why that is the right answer. The output should be in American English, and it should avoid bibliographies, reading lists, or citations; I need something my team can actually use, not a scholarly essay.
reasoning: |-
  Here's a thinking process that leads to the suggested operating procedure:

  1.  **Analyze the Request:**
      *   **User:** Manager of a small forecasting team at a nonprofit advising state health agencies.
      *   **Problem:** Recurring disagreement between analysts (probabilities differ by >10%) despite reading each other's memos. No movement.
      *   **Theoretical Background:** User knows Aumann's Agreement Theorem but recognizes the assumptions (shared prior, common knowledge of rationality, common knowledge of posteriors) are rarely met in practice.
      *   **Goal:** A decision procedure (internal operating procedure) to run in under an hour when disagreements exceed a threshold.
      *   **Requirements:**
          *   Distinguish *why* Aumann's assumptions fail (different priors, private info, model class disagreement, common knowledge failure).
          *   Treat common knowledge as graded (iterated knowledge levels).
          *   Identify when to stop reconciling.
          *   Handle normative disagreements or non-Bayesian agents.
          *   Format: Internal Operating Procedure (numbered steps, test questions, sign-off authority, limitations section).
          *   Tone: American English, practical, no citations/bibliographies.
          *   Application: Run the procedure on three specific cases (Mechanistic vs. Base Rate, Private Data, Forced Consensus Stop).

  2.  **Deconstruct Aumann's Agreement Theorem for Practical Use:**
      *   *Theorem:* If two Bayesians share a prior and have common knowledge of each other's posteriors, they cannot agree to disagree.
      *   *Reality:* They *do* agree to disagree. Why?
          1.  **Different Priors:** They start from different worldviews/base rates.
          2.  **Private Information:** One knows something the other doesn't (or can't share).
          3.  **Different Models:** They aren't updating on the same likelihood function (different causal structures).
          4.  **Knowledge Depth:** I know $X$, you know $X$, but I don't know that *you know that I know $X$* (Level 2 vs. Level $n$ common knowledge).
          5.  **Non-Epistemic:** Normative values, definition of the event, or cognitive bias (not acting as Bayesians).

  3.  **Drafting the Operating Procedure (The "Protocol"):**
      *   *Name:* Needs to sound official but usable. "Forecast Disagreement Resolution Protocol (FDRP)."
      *   *Trigger:* >10% probability divergence on binary event.
      *   *Time Limit:* 60 minutes max.
      *   *Steps:*
          1.  **Verify the Event:** Are we predicting the same thing? (Definition check).
          2.  **Information Audit:** Is info symmetric? (Private data check).
          3.  **Model Audit:** Are we using the same logic? (Mechanism vs. Base rate).
          4.  **Prior Check:** Are our starting points different? (Worldview).
          5.  **Common Knowledge Ladder:** How deep does our mutual understanding go?
          6.  **Decision Gate:** Reconcile, Escalate, or Record & Move.
      *   *Test Questions:* Specific prompts for each step.
      *   *Sign-off:* Who decides? (The Manager).
      *   *Limitations:* What this can't fix (Normative issues, bad faith, etc.).

  4.  **Refining the "Common Knowledge Ladder":**
      *   This is a key request. I need to make "common knowledge" actionable.
      *   Level 0: I know $X$.
      *   Level 1: I know that you know $X$.
      *   Level 2: I know that you know that I know $X$.
      *   *Practical translation:* In a meeting, reading a memo is Level 1. Discussing it openly is Level 2. Agreeing on the *interpretation* of the memo is Level 3.
      *   *Action:* If stuck at Level 1, talk more. If stuck at Level 3, it's a prior/model clash.

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Model Class):* Mechanistic vs. Historical. This is a likelihood function disagreement. Aumann doesn't apply directly because they aren't using the same updating rule. *Outcome:* Record & Move (ensemble the forecasts).
      *   *Case 2 (Private Info):* Unpublished dataset. One has info the other can't verify. This violates "common knowledge of posteriors" because the *basis* isn't shared. *Outcome:* Escalate (Manager needs to decide on data access or weight).
      *   *Case 3 (Forced Consensus):* Manager wants consensus, but the procedure says stop. Why? Because further reconciliation creates false precision or groupthink. The disagreement *is* the signal. *Outcome:* Record & Move (Preserve the variance).

  6.  **Writing - Section by Section (Iterative refinement):**

      *   *Header:* Standard SOP format.
      *   *Purpose:* Clear statement of intent.
      *   *Trigger:* The 10% rule.
      *   *The Steps:* Need to be logical.
          *   Step 1: Definition (Semantics).
          *   Step 2: Information Symmetry (Data).
          *   Step 3: Model/Logic (Method).
          *   Step 4: The Knowledge Ladder (Metacognition).
          *   Step 5: The Decision.
      *   *The Test Questions:* Embed these in the steps or as a checklist. A checklist is better for quick use.
      *   *Sign-off:* Manager (User).
      *   *Limitations:* Be honest about normative/value clashes.

      *(Self-Correction during drafting)*: Make sure I don't get too academic about Aumann. Keep the language practical. Instead of "Common Knowledge of Rationality," use "Agreement on Reasoning Standards." Instead of "Shared Prior," use "Baseline Assumptions."

      *(Refining the Common Knowledge Ladder)*: Let's define "Levels of Mutual Awareness."
      *   L1: Shared Document.
      *   L2: Discussed in room.
      *   L3: Agreed on what the document *means*.
      *   If stuck at L1 -> Talk. If stuck at L3 -> Stop.

      *(Refining Case 3)*: This is crucial. The prompt asks for a case where the procedure says "stop" even though the manager *wants* consensus. I need to explain *why* forcing consensus is dangerous (loss of uncertainty quantification).

  7.  **Final Review against Constraints:**
      *   American English? Yes.
      *   No citations? Yes.
      *   Internal Operating Procedure format? Yes.
      *   Three cases run through? Yes.
      *   Under 1 hour constraint acknowledged? Yes.
      *   Distinguishes failure modes? Yes.

  8.  **Final Polish:** Check tone. It should be authoritative but helpful, not condescending. Ensure the distinction between "escalate" and "record disagreement" is clear. (Escalate = Manager decides/intervenes; Record = Accept divergence).

  **(Self-Correction on Case 2):** If one analyst has data the other *cannot* disclose (e.g., confidential preliminary data), they can't share it. This makes common knowledge impossible. The procedure should flag this as "Asymmetric Information Constraint." The solution isn't necessarily to share the data (if forbidden), but to adjust confidence or escalate to manager to authorize sharing. I will frame it as "Escalate for Data Authorization."

  **(Self-Correction on Case 3):** The prompt says "a case where the procedure tells me to stop reconciling even though I strongly want consensus." I need to construct a scenario where the disagreement is structural (e.g., fundamentally different priors about policy impact) and forcing agreement would hide risk.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # INTERNAL OPERATING PROCEDURE: FORECAST DISAGREEMENT RESOLUTION (FDR-01)

  **Effective Date:** Immediately  
  **Applies To:** Forecasting Analyst Team  
  **Owner:** Team Manager  
  **Time Limit:** 60 Minutes Maximum  

  ## 1. PURPOSE
  This procedure governs instances where two analysts produce probability estimates for the same binary event that differ by more than ten percentage points (e.g., 40% vs. 60%). The goal is not necessarily to force consensus, but to diagnose *why* the disagreement exists and determine whether further reconciliation adds value or introduces bias. This protocol adapts theoretical agreement principles for practical, time-constrained decision-making.

  ## 2. TRIGGER
  This procedure is activated when:
  1.  Two final forecasts for the same event differ by >10%.
  2.  Both analysts have read each other's supporting memos.
  3.  Standard peer review has failed to close the gap.

  ## 3. DIAGNOSTIC PROCEDURE
  The analysts involved will conduct the following five steps. A timer must be set for 60 minutes. If the diagnosis is not complete by minute 50, proceed immediately to Step 5.

  ### Step 1: Event Definition Check (Semantics)
  Confirm both analysts are predicting the exact same outcome.
  *   **Test Question:** "If the event happens, does it satisfy both of our definitions? If it fails, does it fail for both of us?"
  *   **Failure Mode:** Semantic drift (e.g., "Hospital Surge" defined as >10% capacity by Analyst A, >20% by Analyst B).
  *   **Action:** Align definitions. If definitions cannot align, record as two separate forecasts.

  ### Step 2: Information Symmetry Audit (Data)
  Determine if one analyst possesses information the other does not.
  *   **Test Question:** "Is there any data, signal, or field report in your memo that the other person cannot verify or access?"
  *   **Failure Mode:** Private Information (Asymmetric Information).
  *   **Action:** If information is shareable, share it. If information is confidential/preliminary and cannot be shared, flag for Manager Escalation.

  ### Step 3: Model Class Audit (Logic)
  Determine if analysts are using different causal structures to process the same data.
  *   **Test Question:** "Are we arguing about the *data* or the *mechanism*? If we swapped models but kept data, would the numbers converge?"
  *   **Failure Mode:** Model Class Disagreement (e.g., Mechanistic vs. Base Rate).
  *   **Action:** Do not attempt to force one model. Record both as independent inputs for an ensemble average.

  ### Step 4: The Knowledge Ladder (Common Knowledge)
  Assess the depth of mutual understanding. In theory, "common knowledge" is infinite (I know that you know that I know...). In practice, we measure levels of mutual awareness.
  *   **Level 1 (Public):** We have both read the memos.
  *   **Level 2 (Mutual):** We have discussed the memos in this meeting.
  *   **Level 3 (Shared Interpretation):** We agree on what the memos *imply*, even if we weigh them differently.
  *   **Test Question:** "Do you understand *why* I am not moving, and do I understand *why* you are not moving?"
  *   **Failure Mode:** Stuck at Level 1 or 2.
  *   **Action:** If stuck below Level 3, spend remaining time clarifying reasoning. If at Level 3 but still disagreeing, the disagreement is structural (Prior or Value). Stop reconciling.

  ### Step 5: Decision Gate
  Based on the diagnosis above, select one of three paths.

  | Diagnosis | Path | Action |
  | :--- | :--- | :--- |
  | **Semantic Mismatch** | **Reconcile** | Rewrite event definition. Re-forecast. |
  | **Private Info (Shareable)** | **Reconcile** | Share data. Update priors. Re-forecast. |
  | **Private Info (Restricted)** | **Escalate** | Manager decides on data access or weighting. |
  | **Model Class Clash** | **Record & Move** | Keep both forecasts. Ensemble them. |
  | **Prior/Worldview Clash** | **Record & Move** | Keep both forecasts. Treat as uncertainty range. |
  | **Level 3 Reached** | **Record & Move** | Disagreement is "honest." Preserve variance. |

  ## 4. TEST QUESTIONS CHECKLIST
  *Use this checklist during the 60-minute window.*

  1.  [ ] Are we defining "success" and "failure" of the event identically?
  2.  [ ] Is there any data in your possession that I cannot see?
  3.  [ ] Are we using the same type of logic (e.g., both statistical, both causal)?
  4.  [ ] Can you restate my argument to my satisfaction?
  5.  [ ] Can I restate your argument to your satisfaction?
  6.  [ ] If we answered 4 and 5 with "Yes," are we still disagreeing? (If yes, stop).

  ## 5. ESCALATION AND SIGN-OFF
  *   **Reconcile:** Analysts sign off on the new joint number.
  *   **Record & Move:** Analysts sign off on their individual numbers. The final deliverable to the state agency will present the range or the ensemble mean, explicitly noting the divergence.
  *   **Escalate:** Requires Manager Sign-Off. The Manager must decide within 24 hours whether to authorize data sharing, override a model, or accept the divergence.

  ## 6. LIMITATIONS (WHAT THIS PROCEDURE CANNOT SETTLE)
  This procedure is epistemic, not normative. It cannot resolve:
  1.  **Value Judgments:** Disagreements driven by risk tolerance (e.g., "It is better to over-warn than under-warn").
  2.  **Bad Faith:** Instances where an analyst refuses to update due to political or career incentives.
  3.  **Non-Bayesian Behavior:** Cognitive biases (anchoring, sunk cost) that analysts refuse to acknowledge.
  4.  **Infinite Regress:** We cannot achieve mathematical "common knowledge." If Level 3 is reached, further meeting time yields diminishing returns.

  ***

  # APPLICATION OF PROCEDURE: THREE CASES

  ## Case 1: Mechanistic Model vs. Historical Base Rate
  **Scenario:** Analyst A predicts a 70% chance of a hospital surge using a mechanistic transmission model. Analyst B predicts a 40% chance using historical base rates of previous variants. Both have read each other's memos.

  **Procedure Run:**
  1.  **Event Definition:** Both define "surge" as ICU occupancy >90%. (Pass)
  2.  **Information Symmetry:** Both are using public data. (Pass)
  3.  **Model Class Audit:** Analyst A uses causal dynamics (R0, contact rates). Analyst B uses reference class forecasting (historical analogs).
      *   *Diagnosis:* **Model Class Clash.** They are processing the same world through different lenses.
  4.  **Knowledge Ladder:** They reach Level 3. Analyst A understands B is betting on "regression to the mean." Analyst B understands A is betting on "changed viral dynamics."
  5.  **Decision Gate:** **Record & Move.**

  **Outcome:** The team does not force a consensus number. The deliverable to the state agency presents the ensemble mean (55%) but explicitly notes the high variance due to structural model uncertainty.
  **Why:** Aumann's theorem assumes agents update on the same signal using the same likelihood function. Here, the likelihood functions differ. Forcing consensus would hide the structural uncertainty, which is critical for policy planning.

  ## Case 2: The Unpublished Dataset
  **Scenario:** Analyst A predicts 80% risk. Analyst B predicts 50% risk. Analyst A reveals they have seen a preliminary lab report indicating higher viral load, but the data is under embargo and cannot be shared with Analyst B or outside the team.

  **Procedure Run:**
  1.  **Event Definition:** Aligned. (Pass)
  2.  **Information Symmetry:** **Fail.** Analyst A has private information that drives the posterior. Analyst B cannot verify it.
  3.  **Model Class Audit:** Irrelevant due to information asymmetry.
  4.  **Knowledge Ladder:** Stuck at Level 1. Analyst B knows A *has* info, but B cannot know the *content* of the info. Common knowledge of the posterior basis is impossible.
  5.  **Decision Gate:** **Escalate.**

  **Outcome:** Escalated to Manager.
  **Manager Action:** The Manager must decide whether to break the embargo to allow team alignment or to weight Analyst A's forecast higher based on trust in A's clearance.
  **Why:** This violates the "common knowledge of posteriors" condition. Analyst B cannot rationally update on data they are forbidden to see. Reconciling without manager intervention forces B to act irrationally (blind trust).

  ## Case 3: The False Consensus Trap
  **Scenario:** Analyst A (60%) and Analyst B (40%) disagree on a policy impact event. They have reached Level 3 on the Knowledge Ladder. They understand each other perfectly. The disagreement stems from different priors regarding government compliance (A trusts compliance, B distrusts it). The Manager (You) strongly desires a single number to present to the state director to project unity. The procedure says "Record & Move."

  **Procedure Run:**
  1.  **Event Definition:** Aligned.
  2.  **Information Symmetry:** Symmetric.
  3.  **Model Class:** Similar, but priors differ.
  4.  **Knowledge Ladder:** Level 3 Reached. Both understand the disagreement is about *trust in compliance*, not data.
  5.  **Decision Gate:** **Record & Move.**

  **Outcome:** The procedure dictates you **stop reconciling**. You present the range (40-60%) to the state director.
  **Why This Is The Right Answer:**
  You want consensus for political comfort, but the procedure protects epistemic integrity.
  1.  **Aumann's Limit:** They have different priors. Aumann's theorem does not apply to agents with different priors. They *are allowed* to agree to disagree.
  2.  **Risk Hiding:** Forcing them to average to 50% creates "false precision." It tells the state director the risk is moderate. In reality, there is a significant chance of high risk (60%) and a significant chance of low risk (40%).
  3.  **The Signal:** The disagreement *is* the forecast. It tells the agency that the outcome hinges entirely on a variable (compliance) that is currently unknowable.
  4.  **Common Knowledge Cost:** To climb from Level 3 to Level 4 (convincing one to change their prior on human nature) would take weeks, not minutes. The marginal gain in accuracy is lower than the cost of delay.

  By following the procedure, you prevent the team from collapsing uncertainty to make management feel better. You preserve the variance, which allows the state agency to prepare for both the 40% and 60% scenarios, rather than planning for a non-existent 50% certainty.
