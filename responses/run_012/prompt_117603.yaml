answer: |-
  **JOB MARKET PAPER Q&A PREP SHEET**
  **Topic:** The Coupling Condition & Expected Value Fanaticism
  **Context:** Small Decision Theory Workshop (12 attendees, specific profiles known)

  ### **STRATEGIC CONCESSIONS (Say these in your opening or early Q&A)**
  1.  **Domain Restriction:** Concede immediately that you are restricting the *domain* of expected utility theory, not altering the *formula*. You are arguing that certain mathematically coherent prospects are not *actionable* prospects.
  2.  **Not a Physical Law:** Concede that the Coupling Condition is not a law of physics, but a constraint on *rational credence formation* regarding causal mechanisms. You are not saying independent variation is physically impossible, but that an agent cannot rationally model a choice situation where it occurs.
  3.  **Not Bounded Utility:** Distinguish yourself from bounded utility theorists. They cap the value; you cap the *combinability* of value and probability.

  ---

  ### **THE OBJECTIONS (Ordered by Likelihood & Damage)**

  #### **1. The Axiom Violation (Foundations Group)**
  **The Objection:** "You say we can keep ordinary expected value maximization, but you're ruling out specific probability-payoff pairs. In a Savage framework, that looks like a violation of **Unboundedness** or perhaps **Continuity**. If you rule out these prospects, aren't you just advocating for a bounded utility function in disguise? Which specific axiom are you rejecting, and why should we accept a decision theory that violates it?"
  **The Reply:** "I am not rejecting an axiom of preference over *defined* prospects; I am arguing that these 'fanatical prospects' are not well-defined prospects for an agent. Standard axioms assume the set of acts is given. My claim is that the *description* of the act is incomplete if it treats $P$ and $V$ as independent. I'm not violating Continuity; I'm arguing the sequence of gambles required to test Continuity cannot be constructed by an agent because the causal mechanism generating the payoff imposes a constraint on the probability. It's a constraint on the *input* to the decision function, not the function itself."
  **Soft Spot:** If they press that Savage's axioms are normative constraints on preference *regardless* of physical realizability, you risk looking like you're conflating normativity with metaphysics.

  #### **2. The Norm vs. Ontology Confusion (Formal Epistemologists)**
  **The Objection:** "I'm struggling to locate the normativity here. Are you claiming that it is *irrational* to believe probability and payoff can vary independently, or are you claiming that such gambles *do not exist* in the world? If it's the former, you need an argument why rationality tracks causal structure. If it's the latter, you're doing metaphysics, not decision theory."
  **The Reply:** "It's a claim about the *structure of rational choice*, which necessarily bridges belief and action. To choose an act is to intervene in a causal structure. If the causal structure couples $P$ and $V$, then a credence function that treats them as independent is mismatched to the action space. I'm arguing that rationality requires our credences over acts to reflect the causal constraints of producing those acts. It's not that the math is impossible, it's that the *act* is misdescribed if we ignore the coupling."
  **Soft Spot:** Distinguishing "mismatched to action space" from "irrational belief" is tricky. They may press that I can *believe* the odds are low even if the mechanism is shaky.

  #### **3. The Existential Risk "Loophole" (Long-Term Future)**
  **The Objection:** "This is dangerous. If I'm evaluating an intervention to prevent human extinction, the payoff is fixed (infinite or near-infinite value of future generations). You're saying I can't treat that payoff as fixed while the probability varies? This gives policymakers a respectable excuse to ignore tiny probabilities of catastrophe because they can claim the 'mechanism' doesn't support the odds."
  **The Reply:** "I am not saying we ignore catastrophe risk. I am saying the *fanatical* calculation—where a tiny probability swamps all ordinary moral considerations—relies on assuming we can tweak the probability without altering the reliability of the payoff estimation. In X-risk, the 'mechanism' is our model of the threat. If the model yields a probability of $10^{-50}$, the fragility of that model constrains the expected value of the intervention. We should still prevent X-risk, but we shouldn't let a speculative $10^{-50}$ calculation trump certain present harms. The Coupling Condition preserves ordinary trade-offs."
  **Soft Spot:** They will worry this lowers the urgency of X-risk too much. You need to emphasize you are only blocking the *swamping*, not the concern.

  #### **4. Separability of Credence and Value (Formal Epistemologists)**
  **The Objection:** "A core tenet of Bayesian decision theory is the separability of credence (probability) and utility (value). You can assign any probability to any state and any utility to any outcome. Your Coupling Condition effectively says my utility function depends on my probability function. Doesn't this collapse the distinction between belief and desire?"
  **The Reply:** "It doesn't collapse belief and desire; it recognizes that *acts* are the locus of choice, not outcomes in isolation. When I choose an act, I am choosing a causal pathway. The utility of the outcome is fixed, but the *accessibility* of that outcome (the probability) is determined by the same pathway. I'm not saying $U(outcome)$ depends on $P(outcome)$. I'm saying the *act* that purports to deliver $U(outcome)$ at $P(outcome)$ is not a coherent act if the mechanism doesn't support that pairing. The separability holds for states; my claim is about the construction of acts."
  **Soft Spot:** This is a technical minefield. If they cite Jeffrey-Bolker vs. Savage, ensure you don't get bogged down in formalism.

  #### **5. The "Just Use Bounded Utility" Alternative (Economist)**
  **The Objection:** "Economists solved this decades ago. If you don't want fanaticism, just assume a bounded utility function. If utility caps out, no probability, however small, can swamp ordinary considerations. Why introduce this new 'Coupling' machinery when bounded utility does the same work with less metaphysical baggage?"
  **The Reply:** "Bounded utility solves the math but loses the moral intuition. Many of us feel that if the stakes are *actually* high enough, they *should* outweigh small costs. Bounded utility says 'no, value stops increasing.' My view says 'value keeps increasing, but your ability to secure it degrades as the odds lengthen.' My account explains why we feel the pull of the high stakes but reject the fanaticism. It preserves the unboundedness of value while restricting the actionability of the extreme tails. It's a better fit for our intuitive judgments about sacrifice."
  **Soft Spot:** If they argue that "unbounded value" is the real problem, your view might look like an overly complicated fix for a simpler issue.

  #### **6. Abstract Prospects & St. Petersburg (Economist)**
  **The Objection:** "Decision theory is designed to handle abstract prospects, precisely so we don't have to worry about the physical mechanism. The St. Petersburg paradox is a problem for *expectations*, not for physics. If I offer you a contract signed by a bank that pays out $2^n$ on heads, the mechanism is the bank's solvency, not the coin flip. You're conflating the gamble with the implementation."
  **The Reply:** "In a job-market paper context, we are discussing *choice*, not just valuation. An agent cannot choose a St. Petersburg gamble because no bank can actually back it. If the bank *could* back it, the probability of them honoring it would couple with the payout size. If the payout is $2^{100}$, the probability of solvency drops. My argument is that for any *actual* choice situation an agent faces, the coupling holds. Decision theory should model agents, not mathematical abstractions that no agent can instantiate."
  **Soft Spot:** They may argue that DT is normative for *ideal* agents, not limited by human banking systems.

  #### **7. Operationalization (Foundations Group)**
  **The Objection:** "Even if I accept the Coupling Condition, how do I use it? You say the mechanism constrains the probability. But I don't know the mechanism perfectly. How do I calculate the 'coupled' probability? Aren't you just pushing the problem back to estimating the coupling function, which is just as hard as estimating the original probability?"
  **The Reply:** "You're right that it adds a layer of estimation, but it's a more honest one. Currently, agents estimate $P$ and assume $V$ is fixed. I'm asking them to estimate the *reliability* of the mechanism producing $V$. In practice, this looks like a discount factor on extreme tails. We already do this informally—we dismiss 'pascal's mugging' because the mechanism seems sketchy. I'm just formalizing that skepticism. It's not about precise calculation; it's about recognizing the dependency."
  **Soft Spot:** This admits your theory is vague on implementation, which economists will dislike.

  #### **8. The Counter-Example Mechanism (Foundations Group)**
  **The Objection:** "Can you conceive of *any* mechanism where payoff and probability are independent? Imagine a quantum lottery where the payoff is determined by a separate constant of nature, and the probability is determined by a separate wave function. If such a world is metaphysically possible, your condition is contingent, not normative. Why should decision theory depend on contingent features of our universe?"
  **The Reply:** "If such a world existed, my condition wouldn't apply there. But decision theory is a guide for agents *in this world*. If you want a decision theory for angels in quantum-land, fine. But for human agents making real choices, the resources required to verify the payoff and the resources required to secure the probability come from the same causal bucket. I'm offering a decision theory for finite agents in a causal world, not a logic of preference for all possible worlds."
  **Soft Spot:** This limits the scope of your paper significantly. It makes it a "local" theory, not a universal one.

  ---

  ### **THE DREADED QUESTION (Hope nobody asks this)**

  **The Question:** "Suppose an agent is *convinced*, perhaps through religious faith or extreme theoretical confidence, that the payoff and probability *are* independent. They believe God will reward them $10^{100}$ utils with probability $10^{-50}$, and no causal mechanism you describe can shake that belief. According to your theory, are they irrational? If yes, you're dictating content to credences. If no, then your Coupling Condition isn't a norm of rationality, it's just a description of how the world usually works. Which is it?"

  **Why it kills you:**
  *   If you say **Yes (Irrational):** You violate the standard Bayesian tenet that rationality is about coherence, not truth. You look like you're imposing substantive constraints on belief content.
  *   If you say **No (Not Irrational):** Then your theory fails to guide the agent. If the agent *believes* independence holds, they will act fanatically. Your theory tells them "The world doesn't work that way," but if they disagree, you have no normative leverage. It reduces your paper to a sociological observation rather than a normative critique.

  **Prepared Defense (If asked):**
  "I would say the agent is making a category error about *choice*. Even if they believe the payoff is independent, the *act* of pursuing it requires resources in a causal world. Rationality requires aligning one's acts with the constraints of the world one acts in. If their credence ignores the causal cost of the act, their credence is mismatched to the decision problem. I am arguing that a credence in 'independent variation' is empirically indefensible for an agent embedded in a causal structure." (This is risky, but it's the only way to maintain normativity).
