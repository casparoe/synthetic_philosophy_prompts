prompt: |-
  I'm in a bioethics course this term and I also help run a student podcast, and next week we've got a philosopher on who defends procreative beneficence -- the view that when you're picking which embryo to implant, you've got a moral reason to pick the one expected to have the best life -- but who flatly denies that this licenses selecting for stuff like height, IQ, or eye colour. I want to actually pin down whether that line holds instead of letting her restate the view, so could you draft eight to ten questions, each with a follow-up keyed to the answer she's most likely to give?

  Things I'd definately want covered: (a) why "best life" gets measured against the child's own future values rather than the parents', given that people who end up with the very conditions we screen against often report their lives going fine -- the disability paradox thing -- so how do you even rank the lives before the person exists to have the values; (b) whether calling it a "reason" and not a "duty" does any real work or just sounds less scary; (c) the expressivist objection, that selecting against deafness tells actual deaf people their lives weren't worth having -- I bet she says the message is about the condition and not the person, so I need a follow-up that makes that move harder to pull; (d) whether the disease/enhancement line survives once you notice how many traits are both, cholesterol being the obvious one; and (e) one question on polygenic scores, where we can only rank embryos probabilistically and "best expected life" starts to come apart from any particular child's good.

  No "what drew you to philosophy" fluff please, and don't bother asking her to recommend reading -- she'll just list her own stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Context:** Bioethics course + student podcast.
      *   **Guest:** A philosopher defending *Procreative Beneficence* (PB) but *rejecting* selection for superficial/enhancement traits (height, IQ, eye color).
      *   **Goal:** Draft 8-10 hard-hitting questions with follow-ups keyed to likely answers. Avoid fluff or reading recs.
      *   **Key Themes to Cover:**
          *   (a) "Best Life" metric (child's values vs. parents', disability paradox, ranking non-existent lives).
          *   (b) "Reason" vs. "Duty" (does this distinction do normative work?).
          *   (c) Expressivist Objection (message sent to existing disabled people).
          *   (d) Disease/Enhancement Boundary (traits like cholesterol that are both).
          *   (e) Polygenic Scores/Probability (expected value vs. individual outcome).

  2.  **Deconstruct the Guest's Position:**
      *   *Core View:* Procreative Beneficence (PB). Parents have a moral reason to select the child expected to have the best life.
      *   *Constraint:* She denies this licenses selecting for height, IQ, eye color.
      *   *Tension:* This is a tricky spot. Usually, PB (associated with Julian Savulescu) *does* imply selecting for higher IQ if it correlates with well-being. If she denies this, she needs a robust distinction between "health/normal functioning" and "enhancement," or a specific theory of well-being that caps out.
      *   *Strategy:* The questions need to expose the friction between the principle (maximize well-being) and her constraints (don't maximize specific traits).

  3.  **Drafting Questions (Iterative Process):**

      *   *Theme (a): The Metric of "Best Life" & Non-Existence.*
          *   *Q1:* How do we measure "best life" for someone who doesn't exist yet?
          *   *Likely Answer:* We use objective lists or general welfare indicators.
          *   *Follow-up:* But the Disability Paradox shows disabled people report high QoL. If we select against deafness based on *our* prediction, aren't we imposing external values?
          *   *Refinement:* Make it sharper. Focus on the *basis* of the prediction.

      *   *Theme (b): Reason vs. Duty.*
          *   *Q2:* You call it a "reason," not a "duty." Does this actually change the moral pressure?
          *   *Likely Answer:* Yes, it allows for other moral considerations (autonomy, cost).
          *   *Follow-up:* If the reason is strong enough to override parental preference for a specific trait, isn't it functionally a duty in the relevant cases?
          *   *Refinement:* Focus on the "overriding" nature of the reason.

      *   *Theme (c): Expressivist Objection.*
          *   *Q3:* Doesn't selecting against deafness send a hurtful message to deaf people?
          *   *Likely Answer:* No, it's about the condition, not the person. "We want to avoid the disability, not you."
          *   *Follow-up:* But if the condition is constitutive of their identity, how do they separate the two? Can you name a trait where the distinction collapses?
          *   *Refinement:* Push on the *constitutive* nature of identity.

      *   *Theme (d): Disease/Enhancement Boundary.*
          *   *Q4:* How do you distinguish disease from enhancement?
          *   *Likely Answer:* Normal species functioning vs. above average.
          *   *Follow-up:* What about cholesterol or bone density? Lowering cholesterol is treatment, but having naturally low cholesterol is an enhancement. Where is the line?
          *   *Refinement:* Use the cholesterol example provided in the prompt.

      *   *Theme (e): Polygenic Scores/Probability.*
          *   *Q5:* With polygenic scores, we deal in probabilities. How does "expected best life" work when the variance is high?
          *   *Likely Answer:* We go with the highest probability.
          *   *Follow-up:* If Embryo A has a higher *average* expected well-being but Embryo B has a higher *ceiling*, does PB demand A? What if A ends up worse off?
          *   *Refinement:* Focus on the gap between *expected* value and *actual* outcome for the specific child.

      *   *Filling the Gap (8-10 Questions):* I need to expand on these core themes to hit the count while maintaining depth. I should look for tensions between her specific constraints (no IQ/height selection) and the general principle.

      *   *New Angle: The "No IQ/Height" Constraint.*
          *   *Q6:* If IQ correlates with well-being, why isn't selecting for it required by PB?
          *   *Likely Answer:* Diminishing returns / social contingency.
          *   *Follow-up:* If it's social contingency, aren't we just reinforcing ableism rather than fixing the life?

      *   *New Angle: Sibling Comparison.*
          *   *Q7:* If I have two embryos, one deaf, one hearing. PB says pick hearing. But if the deaf one is *my* genetic match and the hearing one is donor, does PB still hold?
          *   *Likely Answer:* Yes, child's well-being is paramount.
          *   *Follow-up:* Does this make the child a mere vessel for well-being rather than *my* child?

      *   *New Angle: Open Future.*
          *   *Q8:* Does selecting for "best life" restrict the child's right to an open future?
          *   *Likely Answer:* No, it gives them more opportunities.
          *   *Follow-up:* Does it pre-determine their struggles? If I select against depression, do I deny them the growth from overcoming it?

      *   *Review against constraints:*
          *   8-10 questions? Yes.
          *   Follow-ups keyed to likely answers? Yes.
          *   Cover (a) through (e)? Yes.
          *   No fluff? Yes.

  4.  **Polishing the Questions:**
      *   Ensure the tone is respectful but rigorous (podcast appropriate).
      *   Make sure the follow-ups actually trap the "easy out" answers.
      *   Check that the distinction between "Reason" and "Duty" is probed effectively.
      *   Ensure the Polygenic Score question highlights the *non-identity problem* aspect implicitly.

      *(Self-Correction during drafting)*: I need to make sure I don't just ask Savulescu-style questions. The prompt says she *denies* selecting for height/IQ. This is the weak point in her armor. If PB is about "best life," and IQ generally correlates with income/health/longevity, she needs a very good reason why PB doesn't demand IQ selection. I need to hammer this inconsistency.

      *Revised Plan for Q4 & Q5:* Focus heavily on the IQ/Height exclusion. That's the specific quirk of *this* philosopher's version of PB.

      *Revised Plan for Q1 & Q2:* Focus on the epistemic problem of predicting a non-existent person's values (Theme A).

      *Revised Plan for Q6 & Q7:* Focus on Expressivism (Theme C).

      *Revised Plan for Q8:* Focus on Disease/Enhancement (Theme D).

      *Revised Plan for Q9 & Q10:* Focus on Polygenic/Probability (Theme E) and Reason vs Duty (Theme B).

      Let's assemble the final list, ensuring the flow is logical for a podcast interview.

      *Drafting the content:*
      1.  Epistemic access to future values (Theme A).
      2.  Disability Paradox specific (Theme A).
      3.  Reason vs Duty (Theme B).
      4.  Overridingness of the Reason (Theme B).
      5.  Expressivist/Identity (Theme C).
      6.  Expressivist/Condition vs Person distinction (Theme C).
      7.  Disease/Enhancement boundary (Theme D).
      8.  The IQ/Height Exclusion (Specific constraint).
      9.  Polygenic/Probability (Theme E).
      10. Expected Value vs Actual Outcome (Theme E).

      *Refining Follow-ups:*
      *   Make sure the follow-up assumes the standard defensive move and cuts it off.
      *   Example: If she says "Reason not Duty," follow up with "If I ignore a strong moral reason without penalty, is it really moral?"

  5.  **Final Review:** Does this meet all prompt requirements?
      *   8-10 questions? Yes.
      *   Follow-ups included? Yes.
      *   Themes (a)-(e) covered? Yes.
      *   No fluff? Yes.
      *   Tone appropriate? Yes.

      *Wait, one check on the "IQ/Height" constraint.* The prompt says she defends PB *but* denies it licenses selecting for height/IQ. This is actually a deviation from standard Savulescu PB. This suggests she might rely on a "normal functioning" account (Daniels-style) rather than pure well-being maximization. I need to make sure the questions expose the tension between "Maximize Well-being" and "Only Fix Disabilities."

      *Adjustment:* I will ensure Q4 and Q8 specifically target this tension.

      *Let's write it.*
answer: |-
  Here are ten questions with targeted follow-ups, designed to test the internal consistency of her specific version of Procreative Beneficence (PB) without getting bogged down in biographical fluff.

  **1. The Epistemic Problem of Future Values**
  You argue we should select the embryo expected to have the "best life." But since that person doesn't exist yet, we can't know their future values. How do you avoid simply projecting *current* societal norms onto a future person who might value their life differently?
  *   **Follow-up (If she says we use objective welfare indicators):** If objective indicators conflict with the subjective reports of people actually living with those traits—as the Disability Paradox suggests—why does your objective prediction trump their lived testimony about what makes a life good?

  **2. The Disability Paradox and Ranking Lives**
  Many people with conditions we screen for, like deafness or dwarfism, report high quality of life. If "best life" is measured by well-being, isn't there a risk that PB is just codifying ableist assumptions about which lives are worth living rather than tracking actual well-being?
  *   **Follow-up (If she says we must act on the best available evidence):** If the "best available evidence" is biased against disability, doesn't PB effectively mandate that parents perpetuate that bias rather than challenge the social structures that make those lives harder?

  **3. "Reason" vs. "Duty"**
  You emphasize that PB provides a moral *reason*, not a moral *duty*. Practically speaking, if a parent ignores this reason without facing moral criticism, hasn't the norm lost its teeth? What work is that distinction actually doing?
  *   **Follow-up (If she says it allows room for parental autonomy):** If the reason is strong enough to justify state funding for screening or genetic counseling, at what point does the aggregate weight of these "reasons" become a social expectation that functions exactly like a duty?

  **4. The Overridingness of the Reason**
  Let's say a parent has a strong personal preference for an embryo with a specific trait that you deem non-essential, like a genetic link to a parent with a heritable disability. If PB gives us a reason to select against that, does that reason ever *override* the parental preference?
  *   **Follow-up (If she says it depends on the magnitude of the benefit):** If the benefit to the child is marginal but the parental desire is strong, are you saying the child's potential well-being is tradable against the parents' psychological interests?

  **5. The Expressivist Objection (Identity)**
  Critics argue that selecting against deafness sends a message to existing deaf people that their lives are not worth living. You've suggested the message is about the *condition*, not the *person*. But for many, the condition is constitutive of their identity. How do they separate the two?
  *   **Follow-up (If she says identity is adaptable):** If we accept that identity is adaptable, doesn't that undermine the urgency of selection? If a child can form a positive identity *with* the disability, why is preventing the condition morally prioritized over allowing that identity formation?

  **6. The Expressivist Objection (The "Person vs. Trait" Distinction)**
  You draw a line between rejecting a trait and rejecting a person. Can you name a specific trait where that distinction collapses? If not, how do you know we haven't already crossed that line with conditions like Down Syndrome, where the trait is inseparable from the personhood as we recognize it?
  *   **Follow-up (If she says Down Syndrome is a medical harm):** If the "harm" is largely dependent on social support and inclusion, aren't we using medical selection to solve a political problem, thereby letting society off the hook for inclusion?

  **7. The Disease/Enhancement Boundary**
  You deny PB licenses selecting for height or IQ, presumably because those are enhancements, not treatments. But consider cholesterol: lowering high cholesterol is treatment, but having genetically low cholesterol is an enhancement. Where exactly does the line sit?
  *   **Follow-up (If she says it's about "normal species functioning"):** "Normal functioning" is a statistical average, not a moral category. If being slightly above average in immunity gives a child a significantly better life, why does PB tell us to ignore that benefit just because it falls on the "enhancement" side of an arbitrary line?

  **8. The IQ/Height Exclusion**
  Standard PB argues that if a trait like IQ correlates with well-being, we should select for it. You deny this. Is your view that IQ *doesn't* correlate with well-being, or that we shouldn't maximize well-being when it comes to cognitive traits?
  *   **Follow-up (If she says the correlation is weak or contingent):** If the correlation is contingent on social structures, aren't you admitting that PB is conservative? It tells us to fit children to the world as it *is*, rather than selecting children who might thrive in a world as it *could be*.

  **9. Polygenic Scores and Probability**
  With polygenic scores, we aren't selecting a guaranteed outcome, but a probability distribution. If Embryo A has a higher *expected* well-being but a lower *ceiling* than Embryo B, does PB demand we pick A?
  *   **Follow-up (If she says we maximize expected value):** If we maximize expected value, we might systematically select for "safe" lives rather than "great" lives. Does your view inadvertently discourage the genetic variance that drives human progress?

  **10. Expected Good vs. Actual Good**
  Finally, because these predictions are probabilistic, you might select Embryo A based on "best expected life," but Embryo B would have actually had the better life. Does the moral justification rest on the *decision process* or the *outcome*?
  *   **Follow-up (If she says the process):** If the outcome is a child with significantly more suffering than the unselected sibling would have had, how do you explain to that child that their parents acted morally, given that the "reason" you followed failed to secure their good?
