  | Requirement | Case or Consideration That Forces It | Hard, Soft, or Camp Preference | What It Rules Out |
  | :--- | :--- | :--- | :--- |
  | **Non-Inferential Foundation** | Regress argument: If every knowledge claim requires prior justification, knowledge never starts. | Hard (Non-Negotiable) | Global Skepticism, Pure Coherentism |
  | **Deductive Closure/Transmission** | Intuition that valid deduction preserves knowledge/justification; needed for complex reasoning. | Hard (Intuition) / Soft (Solution) | Tracking theories, Contextualist restrictions on closure |
  | **Non-Cheap Reliability** | Bootstrapping cases (gas gauge, red wall): Intuition that you cannot confirm reliability solely by using the faculty itself. | Camp Preference (Conservative) | Simple Reliabilism, Dogmatism, Liberalism |
  | **Diachronic Learning Capacity** | New Sense/Implant case: Agents must be able to acquire reliability knowledge over time through use. | Hard (Non-Negotiable) | Static Foundationalism, Skepticism about learning |
  | **Structural Discrimination** | Must distinguish Bad Bootstrapping (thermometer) from Good Validation (modus ponens, new sense). | Hard (Non-Negotiable) | Purely Formal accounts of circularity, Global anti-circularity rules |
  | **Operationalizability** | System auditing case: Account must specify what an algorithm/agent is entitled to conclude about its own outputs. | Soft (Pragmatic) | Vague Contextualism, Purely Human-centric Epistemology |

