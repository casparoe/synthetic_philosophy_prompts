answer: |-
  Good evening. Thank you all for being here.

  Standing at this podium, looking out at this room, I feel the weight of what we're doing tonight. I know many of you have cared for this history long before I was born. Some of you wrote the plaques on the wall. Some of you gave the funds to build the cases holding the glass. And some of you are just here because your mom made you come, and I promise there are cookies at the end.

  Last spring, I had the privilege of researching the 1913 Mill Fire for my history project. When I started, I thought my job was to find out exactly what happened. I thought history was like a puzzle where, if you found enough pieces, the picture would become clear. But the deeper I got into the archives, the more I realized that some of the most important pieces aren't missing—they're just quiet.

  I want to share two things I found.

  The first is a photograph. In the Historical Society's album, it's captioned "The Mob." It shows a crowd gathered outside the burned shell of the mill. But in a family album, donated by a descendant last year, the same photograph is captioned "The Neighbors." Same faces. Same day. Different meaning. One suggests a threat; the other suggests a community. I don't know which caption is right. But I know that depending on which one we choose, the story changes.

  The second thing is the mill ledger from 1913. It lists every wage earner paid by the company. Every name on those pages is a man. We know women ran the relief kitchen that fed the workers after the fire. We know they cooked, and organized, and kept people alive. But in the ledger, their work appears as one line: "Sundries. Four dollars and change." No names. No record. Just the cost of keeping going.

  When I read the original plaque outside, it says the fire "destroyed the town's future." That line stuck with me. Because when I stand in 1913, looking at that ledger and that photo, I don't see a future destroyed. I see people standing in the ash, trying to figure out what comes next. They didn't know what we know. They didn't know the mill wouldn't reopen. They didn't know the town would shrink. To say the future was destroyed is to look at the past from where we stand now, not from where they stood then.

  So, where does that leave us?

  It leaves us with a choice. We could say that because the record is imperfect, we can't know anything. But that isn't true. The fire happened. The pain was real. The resilience was real.

  Or, we could pretend the record is perfect. We could ignore the difference between "mob" and "neighbors." We could ignore the women who aren't in the ledger. But that isn't honest.

  I think there is a third way. We can treat history not as a verdict, but as a stewardship. We can honor what is written by acknowledging what was left out.

  This new exhibit isn't here to erase the work that came before it. It stands on the foundation built by the teachers who wrote those original texts and the families who preserved these documents. Specifically, I want to thank the mill owner's family, whose generosity made these new display cases possible. You didn't just fund the glass; you funded the chance to look closer. And I want to thank the retired teachers who taught us that history matters enough to question it.

  You have given us the tools to look harder. And when we look harder, we see gaps. But a gap isn't a failure. It's an invitation.

  That is what I hope this exhibit becomes. An invitation.

  Because the record we have is incomplete. The town only had one newspaper then. There is no second account to check against. But there are you. There are the attics in this room. There are the boxes in your basements and the stories you tell at dinner tables that haven't been written down yet.

  We know the women ran the kitchen. Maybe one of you has a recipe card from that week. Maybe someone has a letter mentioning the "neighbors" instead of the "mob." Maybe someone knows why the ledger only lists men.

  We cannot change what happened in 1913. But we can change how we listen to it. We can choose to hear the silence between the names. We can choose to protect the questions along with the answers.

  So, please, walk through the exhibit. Look at the ledger. Look at the photo. And if you see something missing, tell us. If you have something in your care that belongs to all of us, let us see it.

  The fire is over. The ash has long since been swept away. But the work of remembering isn't finished. It's not a statue we build and walk away from. It's a conversation. And tonight, I'm asking you to join it.

  Thank you.
