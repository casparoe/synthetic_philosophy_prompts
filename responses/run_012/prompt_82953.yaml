          3.  The Weakest Joint: Identify the specific premise (The Social Nature of Terms).
          4.  The Collapse Condition: When would we revert to X? (When harms are truly idiosyncratic or when the qualitative gap is absolute).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "systemic flaw" enough? Scanlon might say the spinal injury is also a systemic flaw if safety isn't mandated.
      *   *Adjustment:* Focus on the *comparative* nature of the justification. The Spinal Worker asks, "Why me?" The answer isn't "Because 5,000 others." The answer is "Because a principle allowing widespread moderate impairment undermines the *general confidence* in the cooperative scheme more than a principle allowing rare catastrophic impairment, provided the moderate impairment is significant."
      *   *Wait, the prompt asks to argue for DMA specifically.* I need to defend the *math* of DMA (diminishing weight) as principled.
      *   *Idea:* The "ceiling" concept. Why a ceiling? Because there is a limit to how much "social disruption" matters compared to "individual destruction."
      *   *Principled Basis:* The distinction between *urgency* and *importance*. A spinal injury is more *important* to the victim. Widespread hearing loss is more *urgent* for the stability of the cooperative scheme. DMA balances these.
      *   *Actually, let's go deeper into "Reasonable Rejectability".* A principle is rejectable if it imposes a burden that is not justified. The justification depends on the alternative. If the alternative imposes a burden that is *widely shared*, the nature of that burden changes. It becomes a burden on *equality of status*.
      *   *Okay, let's lock in the "Weakest Joint".* It must be the claim that *numbers can change the qualitative nature of a complaint*. If a complaint is essentially indexed to a single life, numbers are irrelevant. The argument hinges on the claim that "widespread moderate harm" is a *different kind of moral object* than "isolated moderate harm."

  7.  **Final Polish:** Check against constraints.
