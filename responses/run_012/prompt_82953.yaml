      *   **Proposed Solution:** Diminishing Marginal Aggregation (DMA). Complaints of the *same kind* can be combined, but with diminishing weight per person, converging on a ceiling. This allows many moderate complaints to outweigh one grave complaint, but prevents trivial complaints from doing so.
      *   **Task:** Argue *for* this position (DMA) as a *principled extension* of contractualism's justifiability criterion, not just an intuition pump.
      *   **Constraint 1:** Do not merely survey commentary; build the argument in original terms.
      *   **Constraint 2:** Be explicit about the "weakest joint" (the premise that, if false, collapses the argument) and what would lead to the opposite verdict (strict individualism/choose X).

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Scanlon's Core Idea:* Wrongness is based on reasonable rejectability. Principles must be justifiable to each person.
      *   *The Individualist Restriction:* You can't sum up small burdens to outweigh a large burden on one person. Why? Because justification is owed *to each*. If I suffer a catastrophe, telling me "but 1,000 people saved a headache" doesn't justify *my* catastrophe to *me*.
      *   *The Problem:* It leads to counterintuitive results in "Large Numbers" cases (like the Safety Regulator case).
      *   *The Proposed Fix:* Diminishing Marginal Aggregation. It's a middle ground between strict aggregation (utilitarianism) and strict non-aggregation (Scanlon's early view).

  3.  **Develop the Argument for Diminishing Marginal Aggregation (DMA) as Principled:**
      *   *Goal:* Show DMA isn't a betrayal of "justification to each," but a refinement of what "reasonable rejectability" means in a social context.
      *   *Key Insight:* The "Individualist Restriction" is often motivated by the fear of *sacrificing* the one for the many. But is the one being *sacrificed* in the Regulator case? Or is it about *risk distribution* and *ex ante* justification?
      *   *Wait, the prompt asks to argue for DMA specifically.* I need to justify why adding people matters, but less and less.
      *   *Argument Strategy:* Focus on the *nature of the complaint* and the *social context of justification*.
      *   *Step 1: The Basis of Rejection.* A principle is rejected based on the burden it imposes. A burden is not just a physical state; it's a claim on social resources/attention.
      *   *Step 2: The "Crowding" of Claims.* When many people have the same complaint, the *moral urgency* of addressing that *type* of harm increases, but not linearly. Why? Because the goal of morality is to secure a baseline of functioning for all.
      *   *Step 3: Diminishing Returns.* The first person suffering hearing loss creates a strong demand for redress. The 5,000th person confirms a systemic problem, but doesn't add the *same* singular urgency as the first. However, the *collective* impact on the social fabric matters.
      *   *Step 4: Linking to Justifiability.* To justify a principle to the one with the spinal injury, we say: "We prioritized preventing a widespread systemic harm (hearing loss) over a rare catastrophic one." Is that reasonable? Only if the widespread harm reaches a threshold of social significance. DMA captures this threshold without sliding into utilitarianism (where *any* number of trivial pains outweighs death).
      *   *Refining the "Principled" aspect:* The core contractualist value is *mutual recognition*. Mutual recognition requires acknowledging that when a harm becomes widespread, it threatens the *terms of cooperation* themselves. A society where 5,000 people are isolated by hearing loss is a society where cooperation is degraded for a class of people. This degradation is a distinct complaint that the single spinal injury victim cannot raise. The single victim suffers a personal catastrophe; the 5,000 suffer a *social* catastrophe. DMA weighs the social catastrophe against the personal one.

      *   *Wait, I need to be careful.* Scanlon explicitly rejects aggregation. I need to argue that DMA is a *modification* that stays true to the *spirit* (justifiability) even if it alters the *letter* (individualist restriction).
      *   *Better Angle:* The "Individualist Restriction" assumes complaints are isolated. But in the Regulator case, the choice is between *policies*. Policies apply generally. The justification must be acceptable to everyone *ex ante*.
      *   *Actually, let's stick closer to the prompt's specific proposal:* "Complaints of the same kind be combined with diminishing marginal weight."
      *   *Why is this principled?* Because the moral weight of a complaint derives from its impact on a person's ability to live a worthwhile life. When many suffer the *same* impairment, it signals a failure of the basic structure to secure a specific capability for a segment of the population. The moral urgency to restore that capability grows with the number of people excluded, but it plateaus because restoring the capability for the 5,000th person is morally similar to the 4,999th. The *systemic* wrong is the key.
      *   *Connection to Justifiability:* Can I justify to the Spinal Worker that we chose Hearing Loss prevention? Yes, if the Hearing Loss represents a systemic failure affecting the terms of cooperation for a significant group. The "diminishing" part ensures we don't lose sight of the Spinal Worker (their complaint still matters immensely), but the "aggregation" part acknowledges that a widespread moderate harm can constitute a greater threat to the *scheme of cooperation* than a rare severe harm.

  4.  **Identify the "Weakest Joint":**
      *   Where does this argument fail?
      *   It fails if the *individual* is the sole unit of moral concern. If morality is strictly about the relation between the agent and *each* patient individually, then what happens to others is irrelevant to *my* justification to *you*.
      *   The weakest premise is: *That the "terms of cooperation" are sensitive to the distribution of harms across the population, rather than just the severity of harm to any specific individual.*
