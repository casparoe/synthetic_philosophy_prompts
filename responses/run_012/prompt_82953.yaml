answer: |-
  The intuition that troubles you is the standard objection to Scanlon's early formulation of contractualism: the "Large Numbers" problem. If we strictly forbid aggregation, we seem forced to prioritize preventing a single catastrophe over preventing a vast number of significant, life-altering harms. Your classmate's proposal—Diminishing Marginal Aggregation (DMA)—attempts to solve this without collapsing into utilitarianism.

  You asked me to argue *for* this position, not as a pragmatic patch, but as a principled extension of the contractualist idea of justifiability. Here is the argument, built from the ground up, followed by the explicit identification of its weakest joint.

  ### The Argument: Complaints as Claims on the Cooperative Scheme

  To see why DMA is principled, we must refine what a "complaint" is within contractualism. The standard reading treats a complaint as a report of individual welfare loss: "I will suffer X." On this reading, the Individualist Restriction makes perfect sense. My suffering is mine; your suffering is yours. Adding your suffering to mine doesn't make *my* suffering worse, so it shouldn't increase the weight of *my* objection.

  However, contractualism is not merely about welfare; it is about **terms of cooperation**. A principle is wrong if it cannot be justified to others seeking mutually acceptable rules. Therefore, a complaint is not just "I suffer"; it is "This principle fails to accord me the status of a full participant in the cooperative scheme."

  **1. The Distinction Between Idiosyncratic and Systemic Burdens**
  When one worker suffers a spinal injury, it is a catastrophic personal tragedy. When five thousand workers suffer irreversible hearing loss, it is not just 5,000 personal tragedies; it is evidence of a **systemic failure** of the cooperative scheme to secure a basic capability (communication) for a significant segment of the population.

  The moral weight of a complaint derives partly from the severity of the harm, but partly from what the harm *signifies* about the principles governing the society. A principle that permits a rare catastrophe signifies that the scheme accepts high-stakes risk for individuals. A principle that permits widespread moderate impairment signifies that the scheme tolerates the degradation of the baseline capacities required for social participation for a large class of people.

  **2. Why Aggregation is Permissible (The "Same Kind" Clause)**
  Aggregation is usually forbidden because it sacrifices the one for the many. But in the Regulator case, we are not sacrificing the one worker to *save* the 5,000. We are choosing between two risk profiles for a population. The question is: Which principle is more reasonable to adopt as a general rule?

  If 5,000 people share the *same* complaint (hearing loss), their complaints are not merely parallel; they are **reinforcing**. They jointly demonstrate that the principle fails to protect a specific threshold of functioning for a recognizable group. The first person with hearing loss establishes that the principle allows this harm. The second confirms it. By the time we reach 5,000, the complaint is no longer just about individual pain; it is about the **stability of the terms of cooperation**. A society where 5,000 people are socially isolated by preventable harm is a society where the terms of cooperation are visibly frayed for a specific class. This systemic fraying is a distinct moral object that a single spinal injury, however grave, does not constitute.

  **3. Why the Weight Must Diminish (The "Ceiling" Clause)**
  If we aggregated linearly (utilitarianism), we would lose sight of the individual. We could outweigh a death with enough headaches. This violates the core contractualist insight: that each person has a veto based on their own standing.

  DMA respects this by assigning diminishing marginal weight. The first 100 complaints of hearing loss carry immense weight because they establish the systemic flaw. The next 100 confirm it. The 5,000th complaint adds less *new* justificatory force because the systemic failure is already established. The total weight converges on a ceiling.

  This ceiling is crucial. It ensures that no amount of moderate complaints can outweigh a complaint of *sufficiently* grave magnitude (e.g., death vs. minor inconvenience). But for cases like the Regulator's—where the "moderate" harm is still serious (socially isolating, life-altering)—the ceiling of the aggregated moderate complaints can rise high enough to outweigh the single grave complaint.

  **4. Justifiability to the One**
  Does this violate the demand to justify the principle to the worker with the spinal injury?
  Under strict individualism, we tell him: "Your injury is worse, so we protect you."
  Under DMA, we tell him: "Your injury is catastrophic, and we acknowledge that. However, the alternative principle permits a widespread degradation of the basic capacities required for social cooperation for 5,000 people. A principle that allows the cooperative baseline to erode for a significant class is less reasonable as a general term of cooperation than one that risks a rare catastrophe, provided the catastrophe does not involve the total loss of moral agency (e.g., death)."

  This is a principled justification. It appeals not to the *sum* of welfare, but to the **robustness of the cooperative scheme** that he, too, relies upon. He is not being sacrificed; he is being asked to accept a risk profile that prioritizes the maintenance of the general baseline of functioning over the elimination of rare worst-case scenarios.

  ### The Weakest Joint

  The argument above hinges on a single, vulnerable premise. If this premise fails, the entire case for DMA collapses, and we must revert to the Individualist Restriction (mandating Upgrade X).

  **The Weakest Premise:** *That the moral significance of a burden changes qualitatively when it is widely shared, such that "widespread moderate harm" constitutes a different kind of objection than "isolated moderate harm."*

  **Why this is the weak point:**
  Contractualism is fundamentally grounded in the relation between the agent and *each* patient. Scanlon's core insight is that morality is about how we treat individuals. If the moral force of a complaint is strictly indexed to the impact on a single life *in isolation*, then the fact that others are suffering the same fate is morally irrelevant to *my* justification to *you*.

  If you hold that the "terms of cooperation" are merely the sum of bilateral relations (me-to-you, me-to-him), then there is no "social fabric" to degrade. There are only individuals. If there is no emergent "systemic wrong" distinct from the individual wrongs, then aggregation (even diminishing) is illicit. It treats individuals as containers of value that can be summed, rather than sovereign sources of claims.

  **The Counterexample That Collapses the Argument:**
  Imagine a modified case where the 5,000 workers with hearing loss are **completely isolated** from one another. They work in solitary confinement, never communicate, and their hearing loss affects no one but themselves. Furthermore, imagine the spinal injury victim is the **sole breadwinner** for a large community, such that his injury causes widespread social collapse.

  In this scenario, the "systemic" argument for the 5,000 vanishes (no shared social degradation), and the "individual" argument for the 1 amplifies (his injury creates widespread harm). If you still feel the regulator should choose Y (protect the 5,000 isolated workers) solely because of their *number*, then you are a utilitarian, not a contractualist.

  But if, in this modified case, you revert to choosing X (protect the 1), then your support for DMA in the original case was not based on numbers *per se*, but on the **social connectivity** of the harms.

  **The Verdict:**
  If you believe that morality is strictly about the **dyadic relation** (justification to each person considered in isolation), then DMA is incoherent. You must choose X. The Individualist Restriction stands unmodified because the only thing that matters is the severity of the burden on the single worst-off person. The 5,000 complaints cannot be combined because there is no "collective" to whom justification is owed, only 5,000 individuals.

  To defend DMA, you must commit to the claim that **contractualism is partly about the structure of the society itself**, not just individual transactions. If you cannot defend that claim—that the "terms of cooperation" have a structural integrity independent of specific bilateral exchanges—then the Individualist Restriction must stand, and the regulator must mandate Upgrade X, regardless of the 5,000.
