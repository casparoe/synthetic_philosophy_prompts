      *   Explicit weakest joint? Yes.
      *   Counterexample for opposite verdict? Yes.

      *(Self-Correction on "Diminishing Marginal Weight"):* I need to make sure I explain *why* diminishing. If it were linear, it's utilitarianism. If it's a ceiling, it respects the individualist restriction's limit. The "diminishing" part is crucial. It reflects that the *marginal* loss of moral standing decreases as more people share the fate. The first person excluded from hearing is a tragedy; the 5,000th is a statistic, but the *pattern* is the injustice.

