      *   *Key move:* Being justifiable to *each* means being justifiable to the 5,000 *as a group* as well as the 1. If the principle ignores the 5,000, is it justifiable to *them*? Yes, individually. But is it justifiable to the *community*? Contractualism is about terms of *cooperation*. Cooperation implies a collective.
      *   *Refinement:* The "Individualist Restriction" protects the individual from being *used*. But in the Regulator case, no one is being *used*. Both are risks. The question is which risk profile is more reasonable. A risk profile that allows widespread impairment is less reasonable than one allowing rare catastrophe, *ceteris paribus*, because widespread impairment erodes the baseline of competence required for cooperation.

