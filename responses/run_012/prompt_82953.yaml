      *   Counterexample leading to X: If the 5,000 hearing loss cases are completely isolated from each other (no social impact, no systemic cause), does the number still matter? If the argument relies on "systemic failure," but the case is just random independent events, DMA might lose its footing. Or, if the spinal injury is so devastating it removes *all* agency, whereas hearing loss leaves agency intact, the qualitative gap might be unbridgeable.

  5.  **Drafting the Response:**
