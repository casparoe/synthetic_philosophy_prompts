          *   Set out explicit correspondences (receptors, physiology, cuisine, cook, diner, food).
          *   Identify where the mapping breaks (disanalogies).
          *   Sort disanalogies into "matter for the two uses" vs. "merely picturesque."
          *   Analyze what the taste side imports (passivity, lack of truth-aptness, lack of authority, nutrition standard).
