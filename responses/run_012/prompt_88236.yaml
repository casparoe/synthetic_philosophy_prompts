  *Correction on Nutrition:* Actually, taste *doesn't* always answer to nutrition. We crave sugar (taste) even if it's bad for us (nutrition). This is a crucial disanalogy. If morality is taste, does it answer to "moral nutrition" (flourishing)? If yes, taste is a bad guide. If no, morality is ungrounded. I need to make this sharp.

  *Final Plan:*
  1. Map the terms.
  2. Break the map (Truth, Authority, Nutrition).
  3. Evaluate Camp 1 & 2.
  4. Verdict: Analogy favors Error Theory/Expressivism (Camp 1), kills Realism (Camp 2).
  5. Alternative: Language/Grammar.

