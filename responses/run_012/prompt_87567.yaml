prompt: |-
  I'm putting together the final exam for my decision theory seminar (mixed MA/PhD, they've had the standard expected utility material plus a bit of the St. Petersburg literature) and I want one essay question on the Pasadena game that a student can't answer just by having skimmed the usual "infinite expectation" stuff. The thing I keep noticing when I mark practice answers is that people lump it in with St. Petersburg and write a paragraph about diminishing marginal utility, which is exactly the reflex I want the question to defeat. So the question should force them to actually work with the payoff structure and the series, not just name-drop log utility.

  Concretely: the game is a fair coin tossed until the first heads, and if heads lands on toss n the payoff is (-1)^(n+1) times 2^n over n. Please write (a) the essay question itself, (b) a model answer of about 600 words, and (c) a marking scheme that names the specific moves a top answer has to make and the specific mistakes that should cost marks. In the marking scheme I want the A/B boundary to be something I can point at -- not "shows deep understanding" but "does X, Y, Z; if they only do X and Y it's a B." Five must-hit points, 20 marks total, and for each point a one-line note on how candidates typically get it wrong. Keep the model answer self-contained enough that a strong student who hasn't read the original paper could still have produced it.

  Two things to please build in rather than leave optional, because they're where I think the real crux is: first, the sense in which the expectation is undefined rather than merely infinite, and why the natural ordering of the outcomes isn't a privilege we're entitled to; second, the move where you add a dollar to every payoff (so the modified game dominates the original outcome-by-outcome) and ask what that does to the claim that the modified game must be worth more. Don't let either of those be something a student can skip past with a hand-wave. Oh and the tone of the question should be a real exam question -- no "critically discuss," give them something with teeth.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Final exam for a Decision Theory seminar (MA/PhD level). Students know Expected Utility (EU) and some St. Petersburg literature.
      *   **Topic:** The Pasadena Game (Nover & Hájek, 2004).
      *   **Goal:** Create an essay question that prevents superficial answers (e.g., just saying "infinite expectation" or "diminishing marginal utility").
      *   **Specific Requirements:**
          *   (a) The Essay Question.
          *   (b) A Model Answer (~600 words).
          *   (c) A Marking Scheme (5 must-hit points, 20 marks total, clear A/B boundary, specific common mistakes for each point).
          *   **Crucial Content:** Must address (1) undefined expectation vs. infinite expectation (conditional convergence/Riemann series theorem), and (2) the dominance argument (adding $1 to every payoff).
          *   **Tone:** Rigorous exam question, not vague "critically discuss."
          *   **Constraint:** Model answer must be self-contained (derivable without reading the original paper).

  2.  **Deconstruct the Pasadena Game:**
      *   **Structure:** Coin tossed until Heads ($n$). Payoff $X_n = \frac{(-1)^{n+1} 2^n}{n}$. Probability $P(n) = 1/2^n$.
      *   **Expected Value Calculation:** $E[X] = \sum P(n) X_n = \sum \frac{1}{2^n} \frac{(-1)^{n+1} 2^n}{n} = \sum \frac{(-1)^{n+1}}{n}$.
      *   **Series:** This is the alternating harmonic series: $1 - 1/2 + 1/3 - 1/4 + \dots = \ln(2)$.
      *   **The Catch:** The series is *conditionally* convergent, not absolutely convergent. By the Riemann Series Theorem, rearranging terms changes the sum. Since there is no natural temporal or causal ordering of the outcomes in the decision matrix (they are mutually exclusive states), the expectation is technically *undefined*, not $\ln(2)$ and not $\infty$.
      *   **The Dominance Paradox:** If you add $1$ to every payoff, the new game $Y$ dominates $X$ ($Y(\omega) > X(\omega)$ for all $\omega$). However, $E[Y] = E[X] + \sum P(n) \cdot 1 = E[X] + 1$. If $E[X]$ is undefined, $E[Y]$ is undefined. But standard dominance principles say $Y \succ X$. This creates a conflict between Dominance and Expectation.
      *   **Contrast with St. Petersburg:** St. Petersburg has divergent expectation ($\infty$). Pasadena has undefined expectation (depends on ordering). Diminishing marginal utility solves St. Petersburg (bounds the utility) but doesn't necessarily solve Pasadena if the utility function preserves the alternating structure.

  3.  **Drafting the Question (Part a):**
      *   Need to define the game clearly in the prompt so they don't have to memorize the formula.
      *   Need to force the specific analysis requested (undefined expectation, dominance).
      *   *Draft:* Define the Pasadena Game. (a) Calculate the expected value using the natural ordering. (b) Explain why this value is problematic regarding the definition of expectation. (c) Consider a modified game where $1 is added to every payoff. Analyze the conflict between Statewise Dominance and Expected Value comparison.
      *   *Refinement:* Make it a single coherent essay prompt to ensure flow. "Evaluate the claim that the Pasadena Game has an expected value of $\ln(2)$." Then require the dominance analysis.

  4.  **Drafting the Model Answer (Part b):**
      *   *Word Count:* ~600 words.
      *   *Key Steps:*
          1.  Setup the sum: $\sum \frac{(-1)^{n+1}}{n}$.
          2.  Identify it as the alternating harmonic series ($\ln 2$).
          3.  **Crucial:** Point out conditional convergence. Absolute sum diverges ($\sum 1/n$).
          4.  Invoke Riemann Series Theorem: Order matters. Decision theory doesn't specify an order of states. Therefore, EV is undefined.
          5.  **Crucial:** Dominance argument. Game $Y = X + 1$. $Y$ dominates $X$.
          6.  Linearity of Expectation fails if EV is undefined. If we assign $\ln 2$ to $X$, $Y$ should be $\ln 2 + 1$. But we can rearrange $Y$ to sum to anything.
          7.  Conclusion: Standard EU theory breaks; Dominance seems robust but EU cannot justify it.
      *   *Tone Check:* Needs to sound like a strong student, not a textbook. Clear, argumentative.

  5.  **Drafting the Marking Scheme (Part c):**
      *   *Total:* 20 marks.
      *   *Points:* 5 points x 4 marks each.
      *   *A/B Boundary:* Explicit. "To get an A (16+), must hit all 5. To get a B (12-15), miss one specific crucial link."
      *   *The 5 Points:*
          1.  Correct calculation of the series ($\ln 2$) *and* identification of conditional convergence.
          2.  Explanation of why conditional convergence makes EV undefined (Riemann/Ordering).
          3.  Setup of the Dominance case (Game $Y$ dominates $X$).
          4.  Analysis of the conflict (Dominance says $Y \succ X$, EV comparison fails or is arbitrary).
          5.  Distinction from St. Petersburg (why log utility doesn't automatically fix this).
      *   *Common Mistakes:* Need specific "typical errors" for each point as requested.

  6.  **Review and Refine:**
      *   *Check:* Did I include the "add a dollar" argument? Yes, in Point 3 & 4.
      *   *Check:* Did I include the "undefined vs infinite" distinction? Yes, in Point 2.
      *   *Check:* Is the distinction from St. Petersburg clear? Need to ensure the model answer explicitly mentions why diminishing marginal utility isn't a magic bullet (because the alternating signs can persist in utility space).
      *   *Check:* Word count on model answer. I need to be careful not to ramble.
      *   *Check:* Marking scheme clarity. "If they only do X and Y it's a B." I will structure the grade bands clearly.

  7.  **Final Polish:**
      *   Ensure the math notation is clear.
      *   Ensure the "A/B boundary" instruction in the prompt is met in the marking scheme section.
      *   Make sure the tone is academic.

  *(Self-Correction during drafting Model Answer)*: I initially thought about focusing heavily on the Riemann theorem. I need to make sure I connect it back to *decision theory*. Why does the order of summation matter in DT? Because states are unordered. I need to make that link explicit to hit the "undefined" requirement hard.
  *(Self-Correction on Marking Scheme)*: The prompt asks for "Five must-hit points, 20 marks total." I should allocate 4 marks per point. I need to make sure the A/B boundary is sharp. A = 5/5 points. B = 4/5 points (specifically missing the dominance or the ordering nuance).

