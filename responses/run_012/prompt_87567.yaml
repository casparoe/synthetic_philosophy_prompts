answer: |-
  (a) **Essay Question**

  **Question 4.**
  Consider the **Pasadena Game**: A fair coin is tossed until it lands Heads for the first time on toss $n$. The payoff is $x_n = \frac{(-1)^{n+1} 2^n}{n}$.

  1.  Calculate the expected value of the game assuming the outcomes are summed in the natural order ($n=1, 2, 3\dots$).
  2.  Explain why this calculation does not establish a well-defined expected value for a rational agent, specifically distinguishing this problem from the standard St. Petersburg paradox.
  3.  Consider a modified game $G'$ that pays $x_n + 1$ in every state. Analyze the conflict that arises between the Principle of Statewise Dominance and Expected Value maximization when comparing $G$ and $G'$.

  *In your answer, you must address why the ordering of outcomes is not a privilege decision theory can grant, and why adding a constant to the payoffs destabilizes the valuation.*

  ***

  (b) **Model Answer**

  **Candidate Number: 007**

  The expected value (EV) of the Pasadena Game is calculated by summing the probability-weighted payoffs. Since the probability of the game ending on toss $n$ is $1/2^n$, the expected value is:
  $$ E[G] = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \frac{(-1)^{n+1} 2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} $$
  This is the alternating harmonic series ($1 - 1/2 + 1/3 - 1/4 \dots$), which converges to $\ln(2)$. Superficially, this suggests the game is worth approximately \$0.69. However, this valuation is mathematically fragile and decision-theoretically unjustified.

  The critical distinction between the Pasadena Game and the St. Petersburg paradox is the nature of the divergence. In St. Petersburg, the series diverges to infinity; the expectation is infinite. In Pasadena, the series is **conditionally convergent**. It converges to $\ln(2)$ only if summed in the specific natural order of $n$. The series of absolute values, $\sum |(-1)^{n+1}/n| = \sum 1/n$, is the harmonic series, which diverges.

  According to the Riemann Series Theorem, any conditionally convergent series can be rearranged to sum to any real number, or to diverge. In decision theory, outcomes correspond to mutually exclusive states of the world. There is no intrinsic temporal or causal ordering of these states in the decision matrix; they exist simultaneously as possibilities. To assign an EV of $\ln(2)$, one must privilege the natural ordering ($n=1, 2, 3\dots$) over all other permutations. Since decision theory provides no justification for privileging this specific ordering of states, the expectation is technically **undefined**, not merely infinite. An agent cannot maximize an expectation that depends on an arbitrary arrangement of the state space.

  This undefined status creates a paradox when considering dominance. Let $G'$ be a game paying $x_n + 1$ for every outcome $n$. Statewise Dominance dictates that $G'$ is strictly preferable to $G$, as $x_n + 1 > x_n$ for all $n$. A rational agent must prefer $G'$.

  However, if we attempt to justify this via Expected Value, we encounter a contradiction. Linearity of expectation suggests $E[G'] = E[G] + 1$. If we arbitrarily accept $E[G] = \ln(2)$, then $E[G'] = \ln(2) + 1$. But $G'$ also generates a conditionally convergent series (specifically, $\sum \frac{(-1)^{n+1}}{n} + 1$). Because the expectation is undefined, we can rearrange the terms of $G'$ to yield an expected value *lower* than a rearrangement of $G$. Thus, Expected Value theory cannot formally validate the dominance intuition. We are left with a conflict: Dominance requires $G' \succ G$, but the EV framework lacks the resources to compare them without arbitrary stipulations regarding state ordering.

  Finally, standard solutions to St. Petersburg, such as diminishing marginal utility (e.g., log utility), do not automatically resolve Pasadena. While log utility bounds the St. Petersburg payoffs, it does not necessarily eliminate the alternating sign structure of the Pasadena payoffs in utility space. If the transformed utility series remains conditionally convergent, the expectation remains undefined. Therefore, the Pasadena Game demonstrates a structural failure in EU theory distinct from infinite variance: it reveals that EU theory presupposes absolute convergence to ensure order-independence, a condition often silently assumed but not guaranteed.

  ***

  (c) **Marking Scheme**

  **Total Marks:** 20 (5 Points × 4 Marks)
  **Grade Boundary:**
  *   **A (16–20):** Hits all 5 points.
  *   **B (12–15):** Hits Points 1, 3, 4, 5 but fails to fully articulate Point 2 (the ordering/undefined distinction).
  *   **C (8–11):** Hits Points 1 and 3 only (calculates sum, notes dominance) but treats EV as valid.

  | Point | Requirement (4 marks each) | Typical Mistake / Deduction |
  | :--- | :--- | :--- |
  | **1. Series Calculation** | Correctly derives the alternating harmonic series $\sum \frac{(-1)^{n+1}}{n}$ and identifies the sum as $\ln(2)$ under natural ordering. | **-2** for calculation errors. **-4** if they claim the sum is infinite (confusing with St. Petersburg). |
  | **2. Undefined Expectation** | Explains that conditional convergence implies the sum depends on ordering (Riemann Series Theorem) and states are unordered, making EV **undefined**. | **-4** if they claim EV is $\ln(2)$ and valid. **-2** if they say it's "infinite" rather than "undefined/order-dependent." |
  | **3. Dominance Setup** | Correctly defines $G'$ ($x_n + 1$) and states that $G'$ strictly dominates $G$ outcome-by-outcome. | **-2** if they fail to specify that dominance holds in *every* state. **-4** if they claim dominance fails. |
  | **4. Dominance/EV Conflict** | Explains that while Dominance requires $G' \succ G$, EV comparison fails because linearity breaks/both are undefined/rearrangement can reverse the value gap. | **-4** if they claim EV successfully justifies the dominance preference (i.e., just saying $E[G']+1 > E[G]$). |
  | **5. Distinction from St. Petersburg** | Notes that diminishing marginal utility does not automatically solve this (alternating signs may persist in utility space). | **-4** if they argue log utility solves the problem. **-2** if they treat Pasadena as identical to St. Petersburg. |

  **Examiner's Note on the A/B Boundary:**
  The defining characteristic of an **A** answer is Point 2. A **B** student will typically calculate the sum correctly (Point 1) and identify the dominance paradox (Points 3 & 4), but they will treat the $\ln(2)$ expectation as a "weird finite value" rather than recognizing the **undefined** nature caused by the lack of state ordering. If the essay treats $\ln(2)$ as the actual expected value, the maximum grade is a B (12 marks), regardless of the quality of the dominance analysis.
