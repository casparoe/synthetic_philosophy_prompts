      *   **Tone:** Nuanced, argumentative, precise, detailed. Avoid verdicts without argument.

  2.  **Deconstruct Popper's Position (Mental Sandbox):**
      *   *Key Text:* *The Poverty of Historicism* (PoH) and *The Open Society and Its Enemies* (OSE).
      *   *Core Argument against Historicism:* History has no rhythm, no plot, no inevitable laws of development. Large-scale societal prediction is impossible because it depends on knowledge growth, which is unpredictable.
      *   *Core Argument for Science:* Falsifiability. Conditional predictions (if $C$, then $E$) are okay. Unconditional prophecies (Event $E$ will happen at time $T$) are not scientific.
      *   *The "Oedipus Effect":* Predictions can influence the predicted event (self-fulfilling or self-defeating).
      *   *Methodological Individualism:* Social phenomena should be explained by individual actions/situations, not holistic "societies" acting as organisms.
      *   *Piecemal Social Engineering:* Small, testable interventions vs. Utopian wholesale restructuring.

  3.  **Map the Researchers' Claims to Popper's Concepts:**
      *   *Claim:* "History is a predictive science." -> Popper: "Historicism."
      *   *Claim:* "Differential equations fit to centuries of data." -> Popper: Might accept as *trend* analysis, but reject as *law*.
