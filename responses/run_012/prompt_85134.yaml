      *   **Core Question:** What would Karl Popper *actually* say about this? Not a slogan ("Popper would hate it"), but a careful reconstruction.
      *   **Specific Issues to Address:**
          *   Conditional predictions vs. Historicist prophecy.
          *   Fitting long-run cycles (legitimate science or relapse?).
          *   The argument about unpredictability of knowledge growth (does it bite against statistical models?).
          *   Reflexivity (predictions affecting the system/Oedipus effect).
