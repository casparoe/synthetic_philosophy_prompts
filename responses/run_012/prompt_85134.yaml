      *   **Distinction 2: Conditional vs. Unconditional Prediction:**
          *   Researchers say "Instability in this decade." Is it conditional? "If elite overproduction continues..."?
          *   If they say "Revolution *will* happen," that's historicism.
          *   If they say "Risk index is high," that's a conditional warning.
          *   *Nuance:* The commercial product sounds more Popper-friendly (risk assessment) than the academic claim (laws of history).
      *   **Distinction 3: The Growth of Knowledge Argument:**
          *   Popper's strongest point: We can't predict future knowledge, and knowledge affects history.
          *   Do differential equations account for new knowledge? Probably not. They assume structural constants.
          *   *Critique:* If the model doesn't include a variable for "novel ideas/tech," Popper says it's doomed long-term.
      *   **Distinction 4: Reflexivity (The Oedipus Effect):**
          *   Researcher claim: "Robust to government adjustment."
