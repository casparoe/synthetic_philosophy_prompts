  8.  **Final Polish:** Ensure tone is respectful of the user's work (they feel they have a "firm conclusion") but rigorous in assessing the philosophical landscape. (Self-Correction: Make sure to distinguish between *updating on a conditional event* vs *updating on a constraint on conditional probability*. Judy Benjamin is the latter.)

