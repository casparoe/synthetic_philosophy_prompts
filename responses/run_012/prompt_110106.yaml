  You are describing the boundary mechanism between **social reciprocity** and **market transaction**. While there is no single colloquial word that captures the entire moral flip you observe, the established sociological term for the *property of the transfer* is **commensuration**.

  However, **commensuration** describes the process of making things comparable. To capture the specific moral and legal "flip" you are tracking—the way an envelope turns an ongoing relationship into a settled debt—you need to combine commensuration with the concept of **fungibility** and the legal notion of **discharge**.

  Here is the breakdown of the phenomenon, the terminology that fits, and how it handles the edge cases you raised.

  ### 1. The Established Name: Commensurability
  In economic sociology (specifically the work of Wendy Espeland and Mitchell Stevens), **commensuration** is the process of transforming different qualities into a common metric, usually price.
  *   **The Property:** **Commensurability**.
  *   **The Mechanism:** When you steer a contract to a friend, the value is *incommensurable* (it is embedded in loyalty, history, and future obligation). When you hand over an envelope, you have **commensurated** the official act with private wealth. You have made the two sides of the exchange equivalent and comparable.
  *   **Why it condemns:** Public office is theoretically **inalienable**; it cannot be sold. Commensuration treats the office as a commodity that *can* be sold. The envelope proves you have put a price on the public trust.

  ### 2. The Mechanism of the "Envelope": Discharge
  You noted that the envelope makes the obligation "exact and finished." In accounting and law, this is **discharge** or **settlement**.
  *   **Favors** create **open-ended debt** (I owe you, you owe me, the relationship continues).
  *   **Cash** creates **closed settlement** (I pay you, we are square, the relationship regarding this act ends).
  *   **The Term:** **Transactional Finality**.
  *   **Why it matters:** Corruption law fears the *sale* of duty more than the *bending* of duty. A favor bends duty but maintains the fiction of public service. Cash settles the duty, admitting it was a service for hire.

  ### 3. A Term with Edges: "Fungible Obligation"
  If **commensuration** feels too academic, and **discharge** too legal, the most precise descriptor for the *property of the transfer* itself is **fungibility**.
  *   **Definition:** The quality of an exchange where the specific units of value are interchangeable and the obligation is extinguished upon payment.
  *   **What it covers:** Cash, vouchers, explicit quid-pro-quo contracts.
  *   **What it rules out:** Nepotism, patronage, gifts of gratitude, ceremonial exchanges.
  *   **Why it works:** A favor is non-fungible (only *you* could do this for *me*). Cash is fungible (anyone could pay this for this result). When an obligation becomes fungible, it enters the market sphere, where it is condemned as corruption.

  ### 4. Addressing Your Edge Cases
  You asked how this property explains the variations in judgment (timing, direction, visibility). Here is how **Commensurability + Discharge** resolves them:

  **A. Why the unreciprocated gift (before) is judged more harshly than the reciprocated one (after).**
  *   **Before (Bribe):** The transfer is **conditional**. The commensuration happens *before* the act, pricing the decision itself. It implies the decision is *for sale*.
  *   **After (Courtesy):** The transfer is **gratuitous**. The decision has already been made on non-market grounds. The gift commensurates the *gratitude*, not the *act*.
  *   **The Edge:** If the "courtesy" is exactly priced to the value of the decision (e.g., 10% of the contract value), it loses its status as gratitude and reverts to **retrospective commensuration** (a bribe). The property flips if the priceability becomes too exact.

  **B. Why Open vs. Private matters.**
  *   **Open (Ceremony):** Public gifts are **symbolic**. They are not easily commensurated because their value is social (prestige), not liquid.
  *   **Private (Envelope):** Secrecy implies the value is **liquid** and **fungible**. You hide it because it is a price, and prices for public office are illegal.
  *   **The Edge:** An open gift can become corruption if its value is so high it functions as a price (e.g., giving a car openly). The property is not just visibility, but whether the visibility allows for **social accounting** (everyone sees the gift) vs. **market accounting** (only the parties know the price).

  **C. Why Direction of Flow matters.**
  *   **Upward (Citizen to Official):** This is **purchasing access**. It commensurates private wealth with public authority. This is the core of bribery.
  *   **Downward (Official to Citizen):** This is **patronage** or **welfare**. It is framed as distribution, not purchase.
  *   **The Edge:** If the downward flow is clearly a *payment for votes* (clientelism), it flips back to corruption. The property holds until the **conditionality** becomes explicit.

  ### Recommendation for Your Work
  If you need a term for your programmes that has edges but avoids the baggage of "gift vs. commodity," I recommend using **Priced Settlement** or **Fungible Exchange**.

  However, the most robust conceptual frame is **Commensuration of Public Duty**.
  *   **Rule of Thumb:** If the transfer allows the parties to calculate an exchange rate between the value given and the official act performed, it is **commensurated**.
  *   **The Red Line:** Once an obligation is commensurated, it is **discharged**.
  *   **The Diagnosis:** You are not looking at a family of phenomena; you are looking at **boundary maintenance**. The condemnation arises when a transfer crosses the boundary from the **Social Sphere** (incommensurable, ongoing, relational) into the **Market Sphere** (commensurable, finished, transactional).

  The envelope is not just money; it is a **boundary object** that signals the transfer has entered the Market Sphere. That is why it flips the standing.
