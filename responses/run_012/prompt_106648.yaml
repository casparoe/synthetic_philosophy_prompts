answer: |-
  You have stumbled onto one of the oldest, hardest problems in philosophy and decision theory, using nothing but a coffee kitty and a train ride. Your intuition is sharp: you have identified a specific reasoning tool, and you have correctly sensed that it works in some places and breaks in others.

  Here is the name, the edges, and the wobbly bit.

  ### The Name

  There are two names for this, depending on which shelf of the library you pull it from.

  1.  **Universalizability** (Ethics/Philosophy): This is the formal name for the move you described: *"If I decide the right thing here is to chip in, then that decision has to come out the same for anyone standing where I'm standing."*
  2.  **Superrationality** (Game Theory/Decision Theory): This is a term coined by the physicist Douglas Hofstadter. It describes the specific gamble you are making: assuming that your reasoning process is identical to others in your situation, so your choice *predicts* their choice, even if you can't talk to them.

  ### Is it the Kant business?

  **Yes.** You asked if it's the same animal as "only acting on rules you'd be happy for everyone to follow." It is exactly that animal. Immanuel Kant called this the **Categorical Imperative**.

  However, Kant believed this rule applied *always*. Your intuition is telling you it doesn't apply always (e.g., the vote, the train). You are effectively arguing with Kant, and modern philosophy mostly agrees with you: Universalizability is a test for whether a rule is *moral*, but it doesn't always tell you whether an action is *effective* or *required* in every context.

  ### Drawing the Edges: Where the move works and where it doesn't

  You identified four scenarios. Here is why your brain accepts the logic in some and rejects it in others.

  **1. The Kitty (Legitimate)**
  *   **Why it works:** This is a **Symmetric Cooperation** scenario. You and your housemates are truly in the same spot. The system only functions if the *pattern* of behavior is universal.
  *   **The Logic:** If "everyone in my spot doesn't pay" is the rule, the kitty vanishes. You suffer. Therefore, the rule "don't pay" destroys itself. The logic holds because your contribution is part of a collective mechanism that you all benefit from.
  *   **Verdict:** The move is legitimate here.

  **2. The Vote (The Trick)**
  *   **Why it fails:** This is the **Paradox of Voting**. You noted that if everyone stays home, it's awful, but that doesn't seem to make *your* staying home wrong.
  *   **The Logic:** In the kitty, your money physically adds to the pot. In voting, your single vote does not *cause* others to vote. You are causally isolated. If you stay home, the other million people do not suddenly stay home because of you.
  *   **Verdict:** Your intuition is right. Treating your vote as "everyone's vote" is usually a trick here because there is no mechanism linking your choice to theirs. (Unless you believe your vote signals something to your "tribe," but strictly speaking, the causal link is missing).

  **3. The Train Seat (The Category Error)**
  *   **Why it evaporates:** This is a **Scarcity** scenario.
  *   **The Logic:** Universalizability requires that the rule *could* be followed by everyone. The rule "Take the last seat" cannot be followed by everyone, because there is only one seat. The rule that *is* universalizable is "Whoever arrives first takes the seat."
  *   **Verdict:** The move evaporates because the situation is inherently asymmetric. You aren't in a crowd of identical people; you are the *winner* of a race. There is no "everyone in your shoes" because only one person can wear those shoes.

  **4. The Housemate (The Wobbly Bit)**
  *   **The Problem:** Your housemate says, "I just pay when I feel like it." You ask: "If they aren't running this logic, what's left of 'everyone in my situation'?"
  *   **The Logic:** This is the **Compliance Problem**. If you follow a universal rule but others don't, you become a "sucker" (in game theory terms) or a "martyr" (in ethical terms).
  *   **Verdict:** This is where the tool is most dangerous. If you assume everyone *would* reason like you, but they *don't*, you might end up carrying the load for everyone.

  ### Confidence and The Wobbly Bit

  **How sure am I?**
  I am **95% sure** that "Universalizability" and "Superrationality" are the correct terms for the mental move you are describing. I am **90% sure** that your intuition about the Vote and the Train is correct (philosophers generally agree Universalizability struggles with causal isolation and physical scarcity).

  **The Wobbly Bit (The Housemate)**
  The part I am least sure about—and where philosophers have fought for 200 years without finishing—is the **Housemate/Compliance** scenario.

  Here is the wobble:
  *   **View A (Kant):** It doesn't matter what they do. You are bound by the logic of the rule itself. If paying is right, you pay, even if they freeload. To do otherwise is to corrupt your own integrity.
  *   **View B (Game Theory/Contractualism):** If the others aren't holding up their end, the "agreement" is broken. You are no longer in a symmetric situation. You are now the only sucker. Continuing to pay isn't noble; it's irrational and enables their bad behavior.

  **My uncertainty:** I cannot tell you definitively whether you should keep paying into the kitty if you *know* your housemates are free-riding intentionally.
  *   If you stop paying, the kitty collapses (bad outcome).
  *   If you keep paying, you get exploited (unjust outcome).

  There is no clean mathematical or philosophical formula that solves this without making a value judgment about whether you care more about **system integrity** (keep the kitty alive) or **fairness** (don't be a sucker). That is the edge where the logic runs out and you have to decide what kind of person you want to be.

  ### Summary
  *   **Name:** Universalizability (Ethics) / Superrationality (Game Theory).
  *   **Kant?** Yes, it is the same animal.
  *   **Legitimate:** When the situation is truly symmetric and the outcome depends on collective patterns (The Kitty).
  *   **Trick:** When you lack causal influence over others (The Vote) or the resource is exclusive (The Train).
  *   **Wobbly Bit:** When others don't follow the rule (The Housemate). There is no consensus on whether you should keep following it alone.
