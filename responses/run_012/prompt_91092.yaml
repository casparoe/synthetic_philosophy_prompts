      *   *Correction:* The Claim is about the *utterance policy*. In the warning case, if the SIS says "Fire!" to exploit panic, it violates (i) (not max info) and (ii) (manipulative). If it says "99% fire," it satisfies (i) and (ii), but might fail to evacuate. The Claim doesn't require evacuation. So the Warning Case *supports* the Claim? No, it highlights that (i)+(ii) might be *useless*. But the Claim only asks for *existence*.
