      *   *Crucial Distinction:* Manipulation is about *how* the belief is formed. If I believe "Fire" because of panic, my belief isn't justified by evidence. If I believe "99% fire" because of data, it is. The SIS can choose the latter. So the policy *exists*.
      *   *Why low credence then?* Because "Maximally Informative" is tricky. If the SIS knows I won't understand the raw data, is presenting raw data "maximally informative *to me*"? Or is translating it? Translation requires modeling me. Modeling me risks manipulation.
      *   *Decision:* The Warning Case actually *helps* the Claim (such a policy exists: just tell the truth calmly), but it shows why we might *want* manipulation. However, the prompt asks if the policy *exists*. I'll stick with low credence because of the "Maximally Informative to a bounded agent" paradox.

  5.  **Sensitivity Analysis (What moves the number):**
      *   *Term:* The definition of "Maximally Informative" relative to bounded rationality.
