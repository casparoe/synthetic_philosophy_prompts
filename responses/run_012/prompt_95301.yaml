answer: |-
  This is a brilliant puzzle. You have stumbled onto a problem that has kept legal philosophers and constitutional scholars employed for a century. In academic terms, you are wrestling with the "Amendment Paradox," the "Grundnorm," and the distinction between *validity* (is this rule legal?) and *efficacy* (does this rule work?).

  You are right to feel stuck. The people in your co-op are arguing past each other because they are asking different kinds of questions. One is asking about logic, one about contract law, and one about political power.

  You have 500 hours (10 hours/week for a year). That is enough time to build something truly useful, but only if you avoid the trap of trying to solve the *logic* puzzle. You cannot logic your way out of a power problem.

  Here is the roadmap for your year, ordered by what is upstream (foundational) to what is downstream (practical), tailored for someone who fixes things for a living.

  ### The Hard Truth First
  You asked: *Does this all collapse into whoever happens to enforce it wins?*

  **Yes.** That is the real answer, not the boring one.

  A rule is just ink on paper until someone enforces it. In a housing co-op, "enforcement" isn't usually police; it's social ostracization, cutting off water, or lawsuits. If 90% of the co-op votes to change the fees, and the 10% sue, the court decides. If the 10% don't sue, the vote stands. If the 90% ignore the court, the co-op dissolves into chaos.

  The "Key in the Box" paradox matters only when there is a dispute. If everyone agrees, the paradox is irrelevant. If everyone disagrees, the paradox is irrelevant because the group is already broken. The paradox only lives in the narrow gap where some accept the vote and some don't.

  Therefore, your project should not be about solving the paradox. It should be about **designing rules that minimize the likelihood of that gap appearing, and maximize the clarity of who holds the keys when it does.**

  ### The Three Questions (In Order)

  Do not start with drafting. Do not start with the logic. Start with power.

  #### 1. The Enforcement Question (Upstream)
  *   **The Question:** "When a rule is broken, specifically this one, what physically happens next, and who has the capacity to make it happen?"
  *   **Why it's first:** This is the frame. If you write a rule that cannot be enforced, it is not a rule; it is a suggestion. In your co-op, if you vote to change the fees, who collects the money? If the treasurer refuses because the old rule says "don't," can you fire the treasurer? If you fire the treasurer, can they change the locks?
  *   **Why you can answer it:** You don't need books. You need interviews. Talk to three co-op boards that have survived a mutiny. Talk to two that failed. Ask them: "What was the moment you knew you had to force someone's hand?"
  *   **Impact on your guide:** This moves your guide from "How to write bylaws" to "How to write enforceable bylaws." It forces you to include "Remedies" sections in every rule. (e.g., "If the fee is not paid, X happens," not just "The fee is $500.")

  #### 2. The Legitimacy Question (Midstream)
  *   **The Question:** "Why do people follow rules they disagree with?"
  *   **Why it's second:** Once you know *how* to enforce, you need to know *when* to enforce. If you enforce every rule strictly, the co-op becomes a prison and people leave. If you enforce none, it becomes a squatters' village. The "Key in the Box" argument arises because people feel the *process* was cheated, not just the outcome.
  *   **Why you can answer it:** Observe meetings. Watch where people say "That's not fair" versus "I don't like that." "I don't like that" is politics; "That's not fair" is a legitimacy crisis. Your research is identifying the difference.
  *   **Impact on your guide:** This teaches you to draft "Process Protections." Instead of an unchangeable clause (which invites the paradox), you draft "High-Friction Clauses." (e.g., "To change the fee, you need a 2/3 vote *plus* a 6-month cooling-off period *plus* a review by an external auditor.") This doesn't stop the change, but it ensures the change is deliberate enough that the minority accepts it.

  #### 3. The Drafting Question (Downstream)
  *   **The Question:** "How do we write the text so that the Enforcement and Legitimacy questions are answered by the document itself?"
  *   **Why it's last:** Most people start here. They argue over commas. But a perfectly punctuated rule is useless if no one can enforce it or if everyone hates it.
  *   **Why you can answer it:** This is the synthesis of your first two phases. You are now writing the "Bike Manual."
  *   **Impact on your guide:** This is your final product. A template for bylaws that includes "Break-Glass" procedures. It acknowledges that rules might need to be broken or changed, and it provides the legal/structural airlock for doing so without destroying the organization.

  ### What to Ignore (The Academic Traps)

  You mentioned you don't want to read 100 books. Here is how you save 400 of those hours:

  1.  **Ignore the Logical Possibility:** Do not spend time trying to prove whether it is *logically possible* to amend an unamendable clause. In the real world, if 99% of people agree, they can burn the book and write a new one. The logic doesn't stop them. Spending time on this is like trying to calculate the aerodynamic drag of a bike while the chain is broken.
  2.  **Ignore "Sovereignty" Theory:** Scholars like Carl Schmitt or Hans Kelsen wrote about this. They ask "Where does the power come from?" For your purposes, the power comes from the members' willingness to stay in the building. Keep it that simple.
  3.  **Ignore the "Contract" vs. "Constitution" Debate:** Lawyers argue whether a co-op bylaw is a contract (private agreement) or a constitution (governing document). For your guide, treat it as a **User Manual for a Shared Machine.** If the machine breaks, how do we fix it without smashing it?

  ### Why This Order?

  If you start with **Drafting** (Question 3), you will write clever clauses that fail in the real world. You will create the exact problem you have now: a document that looks airtight but falls apart when people push on it.

  If you start with **Legitimacy** (Question 2) without understanding **Enforcement** (Question 1), you will write a guide based on "everyone should just get along." That is wishful thinking. You need to know the worst-case scenario first (Enforcement), then design to avoid it (Legitimacy), then write the text (Drafting).

  ### What Would Move a Question Up or Down?

  *   **Move Enforcement Higher if:** You find that most co-op failures are due to inability to remove bad actors (e.g., a treasurer stealing funds). If the "teeth" are missing, nothing else matters.
  *   **Move Legitimacy Higher if:** You find that most co-ops dissolve not because of rule-breaking, but because people feel unheard and leave. (My guess is this is the more common failure mode, but Enforcement is the more dangerous one).
  *   **Move Drafting Lower if:** You realize that standard templates exist and are fine. The problem isn't the words; it's the culture. Your guide might end up being more about "How to run a meeting" than "How to write a bylaw."

  ### The Deliverable

  At the end of your year, you shouldn't have a theory. You should have a **"Conflict-Ready Bylaw Template."**

  It would look different than standard templates. It would have sections like:
  *   **The Amendment Airlock:** Explicitly stating how to change "protected" clauses, acknowledging the paradox and bypassing it with a super-majority + time delay.
  *   **The Enforcement Ladder:** Step 1: Warning, Step 2: Fine, Step 3: Vote to Remove, Step 4: Legal Action.
  *   **The Dissolution Clause:** If the paradox breaks the group, how do we sell the building and split the money without killing each other?

  ### Summary

  Your friend's game where "changing the rules is the game" is the closest to the truth. Governance is not a static structure; it is a dynamic activity.

  1.  **Accept the Cynicism:** Rules are backed by force. Understand the force.
  2.  **Study the Breakage:** Don't study successful co-ops; study the ones that split. That's where the data is.
  3.  **Design for the Break:** Write rules that assume someone will try to use the "Key in the Box" trick, and make the cost of doing so higher than the benefit.

  You fix bikes. You know that a chain doesn't break because of bad metal; it breaks because of tension and wear. Your year should be spent studying where the tension goes in a group of people, and how to build a frame that holds it. That is worth the work.
