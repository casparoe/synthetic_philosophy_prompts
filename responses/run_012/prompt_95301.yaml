  8.  **Final Polish:** Ensure the distinction between *validity* (legal/logic) and *efficacy* (does it work) is clear. The user's co-op problem is an efficacy problem disguised as a validity problem.

  *(Self-Correction during drafting)*: I initially thought about suggesting they read about "Constitutional Design." But they said no books. I should suggest they talk to *people* who have lived through splits. That's better field research for a mechanic.
