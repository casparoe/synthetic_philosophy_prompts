      *   **Constraint:** The idea must emerge from student activity, not lecturer announcement.
      *   **Core Mechanism:** Fictional institution "Long Now Trust," sealed prognosis, small groups (trustees), future-directed projects (benefits deferred >100 years).
      *   **Twist:** Halfway through, a prognosis reveals extinction within 40 years (after current students die). Two versions of the prognosis (total extinction vs. small community survival), revealed only in debrief.
      *   **Deliverables:** Complete design (roles, materials, budget/value scheme, timing, rules, debrief), prediction of failures/mitigations, limitations of the activity.
      *   **Constraints:** No reading lists/citations/attributions. Stand-alone for facilitator. No real money/special tech.

  2.  **Deconstruct the Activity Flow:**
      *   **Phase 1: Setup & Normal Operation (45 mins).** Students act as trustees. They believe the future is open. They allocate resources to long-term projects. They write charters/letters.
      *   **Phase 2: The Reveal (5 mins).** Distribute the prognosis envelopes.
      *   **Phase 3: Re-deliberation (25 mins).** Groups decide whether to continue/stop based on the new info.
