          *   *Refinement:* To ensure the debrief lands, I should give Version A to two groups and Version B to two groups. They deliberate separately. In the final discussion, I ask "Did anyone think there was *some* point?" Then reveal the split.
      *   **Timing:**
          *   0-10: Intro & Roles.
          *   10-40: Phase 1 Deliberation (Budget, Charter, Letter).
          *   40-45: The Reveal (Envelopes).
          *   45-70: Phase 2 Deliberation (To continue or not?).
          *   70-90: Debrief.

  4.  **Refining the Philosophical Hook (Scheffler):**
      *   Scheffler's point: We care about the "afterlife" of humanity. If we knew no one would exist after us, we would lose motivation for many current projects.
      *   Activity mapping:
          *   Phase 1: Normal motivation (Future is open).
          *   Phase 2: Shock (Future is closed).
          *   Phase 3: Reaction (Does the work still matter?).
          *   Debrief: Why did you feel demotivated? Was it just that *you* die? No, you knew that already. It's that *no one else* will be there to receive the value.

