answer: |-
  # Activity Design: The Long Now Trust

  ## 1. Overview and Learning Objective
  **Time:** 90 Minutes
  **Class Size:** 16 Students (4 Groups of 4)
  **Goal:** To induce a first-person experience of the "Afterlife Conjecture." Students will initially commit resources to projects whose value depends entirely on a future they will not see. Upon learning that the future itself is truncated, their motivation will likely collapse. The debrief will isolate this collapse from the fear of personal death, highlighting that our values depend on the existence of successors.

  ## 2. Materials Required
  *   **4 Large Envelopes:** Labeled "Confidential: Trustee Prognosis." (2 contain Version A, 2 contain Version B).
  *   **4 Project Portfolios:** One per group. Each contains descriptions of 5 projects.
  *   **4 Budget Sheets:** Simple tables for allocating funds.
  *   **Paper and Pens:** For charters and letters.
  *   **Timer:** Visible to you (projected or phone).

  ## 3. Group Structure and Roles
  Divide the class into four groups of four. Assign roles within each group to ensure engagement:
  1.  **Chair:** Keeps time and ensures everyone speaks.
  2.  **Treasurer:** Records the budget allocation.
  3.  **Archivist:** Drafts the Charter and Letter.
  4.  **Advocate:** Will present the group's final decision to the class.

  *Note: Tell students that while roles are assigned, all decisions must be unanimous.*

  ## 4. Phase 1: The Endowment (Minutes 0–40)

  ### Introduction (0–5 mins)
  Tell the students: "You are the founding Board of Trustees for the Long Now Trust. You have been granted an endowment to fund projects that preserve human value. There is one constraint: The Trust's charter forbids funding any project that yields benefits within your lifetimes. All benefits must accrue at least 100 years from today."

  ### The Portfolio (5–10 mins)
  Distribute the **Project Portfolio** to each group. The five projects are:

  1.  **The Linguistic Seed:** Recording and teaching an endangered language to a new generation of learners. *Value:* Cultural continuity. *Maturity:* 120 years.
  2.  **The Century Vault:** Storing diverse crop seeds in a geologically stable facility. *Value:* Food security for future populations. *Maturity:* 150 years.
  3.  **The Silent Survey:** A radio telescope mapping slow-moving cosmic phenomena. *Value:* Scientific knowledge. *Maturity:* 200 years.
  4.  **The Civic Archive:** Digitizing local government records and personal diaries. *Value:* Historical memory. *Maturity:* 100 years.
  5.  **The Genetic Library:** Cryopreserving diverse human genetic material for future medicine. *Value:* Health and biological resilience. *Maturity:* 130 years.

  ### The Budget and Value Scheme (10–15 mins)
  Distribute the **Budget Sheet**.
  *   **Total Budget:** 100 Legacy Units (LU).
  *   **Cost:** Each project costs 20 LU to fully fund. (They can fund all 5, or mix and match).
  *   **Value Accrual:** Projects generate "Human Flourishing Points" (HFP) *only* upon maturity.
      *   If the project reaches maturity: +50 HFP per project.
      *   If the project is abandoned before maturity: 0 HFP.
  *   **Instruction:** "Your goal is to maximize Human Flourishing. You must also draft a **One-Page Charter** explaining why these projects matter, and write a **Letter to Your Successors** (the people who will run the Trust in 2125) explaining what you hoped they would achieve."

  ### Deliberation (15–40 mins)
  Groups deliberate, allocate the budget, write the Charter, and draft the Letter.
  *   *Facilitator Note:* Circulate. If a group asks, "What if the world ends?" reply neutrally: "You are operating under standard assumptions of civilizational continuity."
  *   *Check-in at Minute 35:* "Five minutes remaining. Ensure your Letter to Successors is signed."

  ## 5. The Reveal (Minutes 40–45)
  Call the class to attention. Collect the Phase 1 Budget Sheets and Charters (keep the Letters for later).

  Distribute the **Confidential: Trustee Prognosis** envelopes.
  **Crucial Instruction:** "Open these silently. Do not show the contents to other groups. Do not discuss the specific details of the prognosis with other groups until the final debrief. This information is now the only reality you operate under."

  **Inside the Envelopes (Two Versions):**
  *   **Version A (Given to 2 Groups):** "New Intelligence Report. Due to irreversible ecological and geopolitical cascades, human civilization will cease to function within 40 years. Every human being currently alive will die of natural causes before the end. No human beings will survive after that date. Total Extinction."
  *   **Version B (Given to 2 Groups):** "New Intelligence Report. Due to irreversible ecological and geopolitical cascades, human civilization will cease to function within 40 years. Every human being currently alive will die of natural causes before the end. A small, isolated community of approximately 500 people will survive for two further generations (approx. 60 years total), after which they will also perish. No further successors."

  ## 6. Phase 2: The Revision (Minutes 45–70)
  **Instruction:** "You remain the Trustees. You still hold the remaining budget (assume the initial 100 LU is still available for this exercise). You must decide whether to:
  1.  **Continue** the projects as planned.
  2.  **Revise** the projects (e.g., change the goal).
  3.  **Abandon** the projects entirely.

  You must produce a **Second Charter** stating your decision and a **Justification** to be read to the other Trustees (the class). You have 25 minutes."

  *   *Facilitator Note:* Listen for the shift in language. Are they talking about "waste"? "Futility"? "Dignity"?
  *   *Version B Nuance:* Watch if the groups with the "500 survivors" clause hesitate more than the "Total Extinction" groups.

  ## 7. Final Deliberation and Debrief (Minutes 70–90)

  ### Step 1: The Verdict (70–80 mins)
  Ask each group's **Advocate** to state their decision and the primary reason.
  *   *Expected Outcome:* Most groups will abandon or radically revise. Reasons will likely cite "no one to receive it," "pointless," or "waste of resources."
  *   *The Twist:* Ask the Version B groups: "Did the survival of the 500 people change your calculation compared to total extinction?" (They may say yes, slightly, or no, because 500 is too few to sustain the *value*).

  ### Step 2: Mapping the Conjecture (80–85 mins)
  Do not lecture yet. Ask these specific questions to the room:
  1.  "In Phase 1, you knew *you* would be dead when the projects matured. Did that stop you?" (No).
  2.  "In Phase 2, you are still dead when the projects mature. What changed?" (The *others* are dead too).
  3.  "If the badness was just about *your* death, Phase 1 and Phase 2 should have felt the same. They didn't. Why?"

  ### Step 3: The Reveal and Synthesis (85–90 mins)
  Reveal that half the room had Version A (Total Extinction) and half had Version B (Partial Survival).
  *   Ask: "Did the knowledge that *some* humans survive (Version B) make the projects feel more valuable than if *no* humans survive (Version A)?"
  *   **The Philosophical Label:** Introduce the term **The Afterlife Conjecture**.
      *   Explain: "We often think we value things because *we* experience them. But this activity suggests we value our projects because *others* will experience them after we are gone. We rely on an 'afterlife' of humanity to give our current lives meaning."
      *   Distinguish:
          *   **Personal Mortality:** You die. (Known in Phase 1 & 2).
          *   **Collective Extinction:** Humanity dies. (Known only in Phase 2).
          *   **The Force:** The loss of motivation in Phase 2 proves that Collective Extinction carries a specific badness distinct from Personal Mortality. It deprives us of the "future audience" for our values.

  ## 8. Predictable Failures and Mitigations

  **1. The "Gamer" Problem**
  *   *Risk:* Students treat the Legacy Units as a score to maximize regardless of the narrative. They might argue, "Mathematically, 50 HFP is still 50 HFP, even if no one is there to count it."
  *   *Mitigation:* In the Phase 1 instructions, emphasize the **Letter to Successors**. Ask them to write it *to a person*. In Phase 2, ask: "Who are you writing the letter to now?" If they say "no one," the gamification usually collapses.
  *   *Debrief Fix:* If a group claims the points still matter, ask: "If no conscious being ever exists to witness the flourishing, in what sense does it flourish?" This forces the metaphysical shift.

  **2. The "Stoic" Resistance**
  *   *Risk:* A group insists, "It matters because it matters to *us* right now. Doing good is its own reward."
  *   *Mitigation:* Do not correct them. This is a valid philosophical objection (internalism vs. externalism).
  *   *Debrief Fix:* Highlight this group during the debrief. "This group resisted the conjecture. They argued value is intrinsic to the *attempt*, not the *receipt*. Scheffler argues most of us aren't like this. Most of us felt the drop in motivation. Why are you different? Is it because you value 'dignity' over 'outcome'?" This turns the resistance into data.

  **3. Time Overrun**
  *   *Risk:* Phase 1 discussion drags on, eating into the debrief.
  *   *Mitigation:* Be ruthless with the timer. At Minute 35, interrupt even if they are writing. The *feeling* of unfinished business can actually heighten the frustration in Phase 2.
  *   *Mitigation:* Pre-print the Project Portfolio so no time is wasted copying descriptions.

  **4. Spoiling the Two Versions**
  *   *Risk:* Students compare envelopes during the break or Phase 2.
  *   *Mitigation:* Frame the confidentiality as part of the "Trustee Security Protocol." "Different intelligence channels received different data. Do not compromise the simulation."

  ## 9. Limitations of the Activity
  Be frank with yourself about what this activity cannot do, so you can supply it in the debrief.

  1.  **Motivation vs. Moral Value:** The activity measures *motivation* (do you want to do it?), not *moral truth* (is it wrong to stop?). Students might feel unmotivated but still believe it would be *morally better* to continue. You must explicitly bridge this gap: "Scheffler argues that if we lose the motivation, we reveal that the value was dependent on the future all along."
  2.  **The "Last Man" Intuition:** The activity simulates a known endpoint. It does not fully capture the *uncertainty* of real life. In reality, we act *as if* there is a future. The activity removes the uncertainty. You must note that the conjecture claims we act *on the assumption* of an afterlife, not that we need a guarantee.
  3.  **The Scale of Survival:** Version B (500 survivors) is a blunt instrument. It may not clearly distinguish between "civilization" and "humanity." Some students might argue 500 is enough. You will need to guide them to consider whether 500 people can sustain the *values* (language, science, archives) the projects were designed to protect. If the values die even if the biology survives, does that count as extinction?

  ## 10. Facilitator Script for the Debrief (Key Moments)
  *   **On the Drop:** "Watch your hands in Phase 1. You were writing, planning, building. In Phase 2, many of you put the pens down. What died in that moment? It wasn't you. You knew you were going to die in Phase 1 too. It was the *chain*."
  *   **On the Versions:** "Group 2 (Version B), you knew 500 people would live. Did that save the Seed Vault? If not, why? Is a Seed Vault for *biology* or for *farmers*? If there are no farmers, is the seed still a resource, or just a object?"
  *   **On the Conjecture:** "This feeling—that the work is pointless without successors—is the force of the Afterlife Conjecture. It suggests we are not self-contained vessels of value. We are links. If the chain ends, the link feels broken, even if the link itself is strong."
