  The **Prediction**. The tension between "truth isn't tradable" and "hates hedging" is the core of his character. He might pivot to protect the sanctity of Truth itself, choosing '0-1000' despite his boldness rule. If he does, your novel's climax becomes about the limits of science rather than its progress.
