answer: |-
  Here is the complete runnable spec for your seminar. It is designed to be printed and handed out with minimal prep.

  # Seminar Activity: The Two Machines (Dennett's Stances)
  **Level:** 300 Philosophy of Mind / Cognitive Science
  **Time:** 80 Minutes
  **Class Size:** 18 Students (6 Teams of 3)

  ---

  ## 1. Instructor Build Spec (A & B)
  *You do not need a computer. You can run this by hand on a projected 6x6 grid or using two printed transparencies.*

  **The Environment**
  *   **Grid:** 6x6 coordinates $(0,0)$ to $(5,5)$. Edges wrap (e.g., moving Left from $x=0$ goes to $x=5$).
  *   **Distance:** Manhattan distance with wrap-around. $d(x_1, x_2) = \min(|x_1-x_2|, 6-|x_1-x_2|)$. Total dist = $d_x + d_y$.
  *   **Agents:** Machine A and Machine B both start at **$(0,0)$**.
  *   **Food Markers:** Two targets, **F1** and **F2**.
      *   **Initial F1:** $(2,2)$
      *   **Initial F2:** $(4,4)$

  **The Logic (Identical for A & B initially)**
  1.  Calculate distance to F1 and F2.
  2.  **Target Selection:** Choose the nearer marker. If tie, choose **F1**.
  3.  **Movement:** Move 1 cell per tick toward Target (reduce $x$ or $y$ distance).
  4.  **Arrival:** If on Target cell, **Pause** (stay put) for 1 tick, then switch Target to the *other* marker.

  **The Difference (The "Secret")**
  *   **Machine A (Design/Intentional):** Reads the **current** coordinates of F1 and F2 every tick.
  *   **Machine B (Physical):** Hardcodes the **initial** coordinates of F1 $(2,2)$ and F2 $(4,4)$ at $T=0$. It ignores if you move the markers later.

  **The Tape (Round 1 Handout)**
  *Since A and B behave identically until intervention, print this single sheet for all teams.*
  *(Generated based on logic above: Cycle is 10 ticks. 60 ticks = 6 full cycles.)*

  ```text
  TICK  POS   TICK  POS   TICK  POS   TICK  POS
  00    0,0   15    2,1   30    0,0   45    2,1
  01    1,0   16    2,2   31    1,0   46    2,2
  02    2,0   17    2,2   32    2,0   47    2,2
  03    2,1   18    3,2   33    2,1   48    3,2
  04    2,2   19    4,2   34    2,2   49    4,2
  05    2,2   20    4,3   35    2,2   50    4,3
  06    3,2   21    4,4   36    3,2   51    4,4
  07    4,2   22    4,4   37    4,2   52    4,4
  08    4,3   23    3,4   38    4,3   53    3,4
  09    4,4   24    2,4   39    4,4   54    2,4
  10    4,4   25    2,3   40    4,4   55    2,3
  11    3,4   26    2,2   41    3,4   56    2,2
  12    2,4   27    2,2   42    2,4   57    2,2
  13    2,3   28    1,2   43    2,3   58    1,2
  14    2,2   29    0,2   44    2,2   59    0,2
  ```
  *(Note: At T=60, both are at 0,2 heading to 0,0 to restart cycle)*

  ---

  ## 2. Game Rules & Scoring Sheet
  **Budget:** Each team gets **15 Tokens**.
  **Costs:**
  *   Writing a description: **1 Token per word**. (Function words like "the", "is" count).
  *   Asking for more Tape (T60+): **2 Tokens per 10 ticks**.
  **Rewards:**
  *   Correct Prediction (next 10 moves): **+5 Points**.
  *   Winning Team (Most Points): Bonus philosophical privilege (choose the first debrief question).

  **Team Submission Slip**
  ```text
  Team Name: ___________________
  Description (Max 15 words): 
  ________________________________________________________
  ________________________________________________________
  Word Count: _____  (Tokens Remaining: _____)

  Prediction (Next 10 Ticks: 60-69):
  60:____ 61:____ 62:____ 63:____ 64:____
  65:____ 66:____ 67:____ 68:____ 69:____
  ```

  ---

  ## 3. 80-Minute Timeline

  | Time | Phase | Activity | Instructor Notes |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute Tape & Rules. Explain Grid/Logic. | Do **not** reveal there are two machines yet. Treat it as "The Black Box." |
  | **10-30** | **Round 1** | **Observation.** Teams write description & predict T60-69. | Enforce word budget strictly. If they ask "Is it alive?", say "Describe the behavior." |
  | **30-55** | **Round 2** | **Intervention.** Reveal there are two machines (A & B). | **Crucial:** At T=60, move F1 to **(5,5)**. <br>Run A: It reroutes to (5,5). <br>Run B: It ignores (5,5), goes to old (2,2). <br>Teams bet on which is which. |
  | **55-65** | **Round 3** | **Underdetermination.** (Optional/Condensed) | Ask: "Could a Physical description explain A?" (Yes, but complex). "Could an Intentional description explain B?" (Yes, but false counterfactuals). |
  | **65-80** | **Debrief** | Map to Dennett. | See Debrief Script below. |

  ---

  ## 4. Debrief Script (Mapping to Dennett)

  **1. The Physical Stance (Machine B)**
  *   **Observation:** B is predictable *only* if you know its internal wiring (hardcoded coords).
  *   **Dennett:** The Physical Stance predicts behavior based on physical constitution and laws.
  *   **Lesson:** It works for B. It is exhaustive but brittle. If you don't know the code, you can't predict B after the intervention.

  **2. The Design Stance (Machine A)**
  *   **Observation:** A is predictable if you know its *function* (seek food), regardless of wiring.
  *   **Dennett:** The Design Stance ignores physical details in favor of purpose/function.
  *   **Lesson:** This compresses the data. You didn't need to know A's code, just its goal.

  **3. The Intentional Stance (The "Real Pattern")**
  *   **Observation:** We said A "wants" F1. B "pretends" to want F1.
  *   **Dennett:** A pattern is **Real** if:
      1.  **Compression:** It describes the data more efficiently than physical listing (Round 1 scoring).
      2.  **Projectibility:** It supports counterfactuals (Round 2 intervention).
  *   **Verdict:** A's "goal" is a Real Pattern. B's "goal" is an artifact of the observer. B has no *disposition* to seek food, only a *trajectory* that looked like it.

  ---

  ## 5. Frank Note: Limitations of the Activity
  *Read this to yourself to manage expectations.*

  1.  **Instrumentalism vs. Realism:** This activity demonstrates the *utility* of the Intentional Stance, not necessarily the *ontology*. Students may leave thinking "A really has a mind." You must clarify that for Dennett, "having a mind" just *is* being interpretable via the Intentional Stance. There is no further "ghost in the machine" fact to be found. The game cannot settle whether there is a mind-independent fact about patterns; it only shows that some patterns are more robust than others.
  2.  **Perfect Rationality:** Dennett's Intentional Stance relies on assuming the agent is rational (will choose the best means to the end). A and B are perfectly rational by design. Real humans are not. The game glosses over the "noise," bias, and irrationality that make applying the Intentional Stance to humans messy.
  3.  **The "Black Box" Problem:** In the game, you (the instructor) know the truth. In real cognitive science, we never get to see the source code. The activity simulates the *logic* of attribution, but not the *epistemic uncertainty* of real science.

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The "Cheating" Intervention**
  *   **Problem:** In Round 2, students claim moving the marker is "changing the rules" or "unfair."
  *   **Fix:** Frame it as "Environmental Perturbation." In science, we don't just watch; we poke. If the system breaks, it wasn't robust. Tell them: "Nature moves the markers all the time. A robust theory survives perturbation."

  **2. Anthropomorphizing B**
  *   **Problem:** A team insists B is "stubborn" or "confused," attributing mental states to the broken machine.
  *   **Fix:** Challenge them on **prediction**. "Okay, if B is 'stubborn', predict where it goes if I move F1 to (0,0)." When B fails to go there, point out that 'stubbornness' implies a choice to resist. B has no choice; it has no access to the new location. It is not stubborn; it is blind.

  **3. The Overfit Win (Physical Description)**
  *   **Problem:** A team writes: *"It goes to 2,2 then 4,4 then 2,2."* (8 words). This fits the Round 1 tape perfectly and costs few tokens. They win Round 1.
  *   **Fix:** This is the **teaching moment**. In Round 2, when you move F1 to (5,5), this description fails immediately.
  *   **Ruling:** Let them win Round 1 points. Then, in Round 2, award zero points because their description yielded false predictions. This proves the "Real Pattern" criterion: a pattern must support *counterfactuals*, not just compress past data.

  ---

  ## 7. Confidence & Weakest Link

  **Confidence Level: 85%**
  This will produce the "aha" moment regarding the difference between *describing behavior* (Physical) and *attributing goals* (Intentional). The visual divergence in Round 2 is usually visceral enough to stick.

  **Weakest Link: The Word Budget Scoring**
  Counting words in real-time for 6 teams is administratively heavy and kills momentum.
  **Mitigation:** Instead of counting every word, give them a physical limit (e.g., "You may write on this index card, and you cannot go past the red line"). Or, simplify the scoring: **Pass/Fail on description length**, points only for **predictions**. The philosophical point is that the Intentional description is *shorter*, not that it saves exactly 3.5 points. Don't let the accounting overshadow the concept.
