prompt: |-
  I read a pop-science book on procastination and self-control recently (author's a journalist, I think) and here's basically how it summarized the whole topic: "Weakness of will, or akrasia, is when you do something you know you shouldn't. Neuroscience has more or less solved it: it's a tug-of-war between your present self and your future self, and hyperbolic discounting shows we're hard-wired to overvalue immediate rewards. That's why the ancient Greeks thought akrasia was impossible -- they figured you can't knowingly do the wrong thing -- but modern psychology showed they were just wrong about how the brain works. The fix is to make the future feel more immediate, and the fact that your preferences flip as a deadline gets closer is just the two selves fighting it out."

  I don't know the field well enough to tell where this goes wrong. Which parts would someone who actually works on akrasia accept, which would they wince at, and which are just wrong? And does the "so the Greeks were just wrong, it's basically solved" conclusion actually follow from the parts that are right?
