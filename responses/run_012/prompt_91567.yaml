      *   *Correction:* Be careful with Socrates. He argued akrasia is impossible *if* knowledge is present. The pop-sci book says modern psych proved him wrong. Technically, modern psych says we act against *judgment*, which Socrates would say means the judgment wasn't fully "active" knowledge. It's a definitional clash, not just empirical.
      *   *Tone:* Keep it accessible but authoritative. Use terms like "Philosophy of Action" and "Dual-Process Theory."

