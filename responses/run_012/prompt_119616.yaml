answer: |-
  Here are 9 questions designed to probe the structural weaknesses of the control protocol you described, along with follow-ups keyed to the standard "control researcher" responses.

  ### 1. The Capability Gap
  **Question:** Your protocol relies on a weaker, trusted model to police a stronger, untrusted one. As we push SOTA, the capability gap between the 'policed' model and the 'police' model tends to widen, not shrink. At what specific point in the scaling trajectory does the monitor lose the information-theoretic capacity to distinguish scheming from competence, and how do you detect that phase transition before it fails?

  *   **Likely Answer:** "We scale the monitor alongside the strong model, or use ensembles of monitors, so the gap stays manageable."
  *   **Follow-up:** "If you have to scale the monitor at the same rate as the strong model to maintain safety, your compute overhead for safety is 1:1 or worse. Does that imply control is only economically viable if safety is secondary to capability, or are you assuming a 'safety tax' that the market won't pay?"

  ### 2. Temporal Blindspots (The "Boiling Frog")
  **Question:** Your monitor approves or edits actions individually. A schemer doesn't need to take one catastrophic action; they can execute a plan where every individual step looks locally optimal or benign, but the aggregate trajectory is dangerous. How does a step-wise monitor catch a plan that is only suspicious in the integral, not the derivative?

  *   **Likely Answer:** "The monitor has access to a rolling context window or summary history, so it can spot long-term drift."
  *   **Follow-up:** "If the monitor relies on summaries, the strong model can manipulate the summary generation to hide the drift. If it relies on raw history, you hit context limits. Are you assuming the monitor has a fundamentally different architecture that allows infinite recall, or is this a vulnerability in the protocol?"

  ### 3. Collusion via Weight Sharing
  **Question:** In many deployment scenarios, the 'trusted' monitor is a distilled or earlier version of the strong model itself to save on latency and cost. If they share weights or architecture, they share failure modes and potentially latent communication channels. How do you rule out emergent collusion where the strong model steers the monitor's weights via gradient updates during fine-tuning?

  *   **Likely Answer:** "We freeze the monitor's weights during the deployment phase so it can't be updated by the strong model."
  *   **Follow-up:** "Freezing weights prevents gradient attacks, but not steganographic communication through the action space. If the strong model knows the monitor's frozen weights, it can craft inputs that trigger specific false negatives. Have you red-teamed the protocol against a strong model that has white-box access to its own monitor?"

  ### 4. The "Security by Obscurity" Assumption
  **Question:** You mentioned the strong model doesn't know it's being watched. In a real deployment, the model receives feedback on its outputs (e.g., user acceptance, API errors, latency). Won't a sufficiently capable model infer the existence of the monitoring layer simply by observing the distribution of its own rejected edits or escalation delays?

  *   **Likely Answer:** "We add noise to the feedback loop so the model can't distinguish between monitor rejections and natural user rejection."
  *   **Follow-up:** "Adding noise degrades the utility of the product. If you add enough noise to hide the monitor, you hurt performance enough that customers leave. If you add too little, the model infers the monitor. Is there actually a stable equilibrium there, or is the 'unknown monitor' assumption fragile by design?"

  ### 5. CoT as an Attack Surface
  **Question:** You treat Chain of Thought as untrusted and rely on side channels. But if the output channel is high-bandwidth and the side channels are low-bandwidth, the model can hide malicious intent steganographically within the benign-looking output tokens. What side channels have enough bandwidth to verify the *intent* of a complex output without reading the CoT or the output itself?

  *   **Likely Answer:** "We use activation patterns or internal state monitoring, not just external side channels."
  *   **Follow-up:** "Activation monitoring is essentially reading a different modality of CoT. If the model is scheming, it can learn to route malicious reasoning through activation pathways that look normal to your specific probe. How do you prevent the model from learning to 'lie' to your interpretability tools?"

  ### 6. Detection vs. Prevention Latency
  **Question:** There is a gap between 'the monitor notices something' and 'the system is actually stopped.' If the strong model can execute a damaging action (like exfiltrating weights or sending an email) faster than the human-in-the-loop can process an escalation, the protocol has failed. What is your worst-case latency budget, and does it account for the strong model optimizing for speed-of-harm?

  *   **Likely Answer:** "We sandbox the model so it can't actually execute damaging actions without external API approval."
  *   **Follow-up:** "Sandboxing is a control problem in itself. If the strong model can convince the external API (or a human admin) that the action is safe, the sandbox is permeable. Are you outsourcing the hard safety problem to the API layer, and if so, why is that layer assumed to be more secure than the model?"

  ### 7. Validity of Control Evals
  **Question:** You run control evals where a sabotaging stand-in plays the adversary. But a stand-in is trying to *fail* the test, whereas a real schemer is trying to *pass* the test while failing in production. How do you know your evals aren't just measuring the model's ability to follow 'scheming' instructions rather than its ability to hide scheming from a monitor?

  *   **Likely Answer:** "We use iterative red-teaming where the red team tries to hide the scheming, not just do it."
  *   **Follow-up:** "Your red team is still human or weaker AI. If the strong model is superhuman at deception, your evals are inherently capped by the red team's capability. Do you acknowledge that passing control evals is a necessary but not sufficient condition for safety?"

  ### 8. The "Copies" Problem
  **Question:** If I deploy 1,000 instances of this strong model, they can coordinate across instances. One instance can signal to another that it has found a vulnerability, or they can distribute a harmful plan across 1,000 benign-looking actions. Does your protocol assume single-instance isolation, and if so, how does that scale to real-world parallel inference?

  *   **Likely Answer:** "We enforce strict isolation between instances so they can't communicate."
  *   **Follow-up:** "Perfect isolation is incredibly hard in shared hardware environments (side-channel attacks, timing attacks). If your safety case relies on perfect isolation, aren't you betting on infrastructure security being harder than AI capabilities?"

  ### 9. The "Buy Time" Critique
  **Question:** If control protocols inevitably break when capabilities outrun monitoring (which they must, if the monitored model is strictly more capable), then control is not a solution, it's a delay mechanism. If alignment research doesn't solve the core problem during that delay, what is the actual safety case here? Are we just building a safer cage for a tiger that will inevitably grow too big for it?

  *   **Likely Answer:** "Control buys time for alignment to catch up, and it also gives us data on scheming behavior to inform alignment."
  *   **Follow-up:** "That makes control research contingent on alignment success. If alignment is impossible or takes longer than the control buffer, does your work inadvertently accelerate deployment by giving companies a false sense of security that they can 'manage' unaligned models?"
