answer: |-
  Here is a committed, concrete plan for your 90-minute seminar. I have refined your "Casino" concept to maximize engagement while minimizing the risk of students feeling tricked (which shuts down learning).

  ### The Verdict on Your Design
  Your colleague is partially right: using different students for different awakenings *does* structurally bias the simulation toward the Thirder view in Phase 1. In the real Sleeping Beauty problem, the tension comes from *one* person waking twice. In your game, *two* people wake once. This removes the "self-locating belief" puzzle but preserves the "decision-theoretic" puzzle.

  **Do not try to fix this.** Lean into it. The lesson isn't "What is the true probability?" The lesson is "How does the payout structure dictate the rational bet?" Your simulation is not a model of *phenomenology* (what it feels like to wake up); it is a model of *consequences* (what happens when you bet).

  **On the "Sting" (Hiding the Rule):** I am advising you **against** hiding the settlement rule until *after* they bet in Phase 2. If you do this, students will feel cheated ("The professor moved the goalposts"), and they will spend the debrief arguing about fairness rather than probability.
  **The Committed Choice:** Announce the rule change clearly at the start of Phase 2. The "Sting" is not that the rule was hidden; the "Sting" is that **their Phase 1 intuition bankrupts them in Phase 2.** If they bet Tails in Phase 2 out of habit, they will lose chips. That visceral loss is a better teacher than a rule surprise.

  ---

  ### Materials List (Stationery Cupboard Standard)
  *   **Coins:** 1 large, visibly fair coin.
  *   **Cup:** 1 opaque cup (to hide the flip).
  *   **Cards:** 40 Index cards.
      *   Write "AWAKENING" on 20 of them (Red ink if possible).
      *   Write "AUDITOR" on 20 of them (Blue ink).
  *   **Currency:** 200 small squares of paper ("Chips").
  *   **Board:** Whiteboard for the Leaderboard.
  *   **Handout:** None. Keep it oral to prevent pre-reading.

  ### Roles & Seating
  *   **The House (You):** Dealer, Coin Flipper, Banker.
  *   **The Sleepers:** Students who receive "AWAKENING" cards in a round.
  *   **The Auditors:** Students who receive "AUDITOR" cards (or no card) in a round.
      *   *Task:* They must verify the coin result. After you flip, you show the coin *only* to the Auditors. They signal thumbs-up if the result matches what you announce. This prevents you from "cooking" the results and keeps non-players engaged.

  ### Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Hook** | No mention of Sleeping Beauty. Set up the "Coin & Card Protocol." Distribute 10 chips to each student. |
  | **10-35** | **Phase 1: Individual Settlement** | 5 Rounds. Rule: You keep your own winnings. (Thirder Optimal). |
  | **35-40** | **The Reset** | Collect cards. Announce "Market Conditions Change." |
  | **40-65** | **Phase 2: Collective Settlement** | 5 Rounds. Rule: Winnings are pooled per round. (Halfer Optimal). |
  | **65-90** | **The Debrief** | Reveal "Sleeping Beauty." Connect Phase 1 to Thirders, Phase 2 to Halfers. Discuss Credence vs. Utility. |

  ---

  ### The Scripts (Exact Wording)

  #### 1. Introduction (00-10)
  "We are running a simulation today called the Coin & Card Protocol. There are 10 rounds. In each round, I will flip a coin under this cup.
  *   **Heads:** I will deal **one** AWAKENING card to one student at random.
  *   **Tails:** I will deal **two** AWAKENING cards to two different students at random.

  If you hold a card, you are 'Awake.' You must place a bet: **Heads or Tails?**
  The stake is fixed at **5 chips**. You must bet.
  If you win, you gain chips. If you lose, you lose chips.
  Auditors (those without cards) will verify my coin flips to ensure I am not cheating.
  Leaderboard will be tracked on the board. Top three get [bragging rights/candy/extra credit]."

  #### 2. Phase 1 Rules (10-35)
  **Settlement Protocol A (Individual):**
  "If you bet correctly, the House pays **5 chips directly to you**.
  *   Example: Coin is Tails. Two cards are dealt. Both holders bet Tails. Both win 5 chips. House pays 10 chips total.
  *   Example: Coin is Heads. One card dealt. Holder bets Heads. Wins 5 chips. House pays 5 chips total."

  *Run 5 Rounds. Update leaderboard after every round.*
  *Expected Outcome:* Students who bet **Tails** will accumulate chips faster. The "Thirder" strategy (bet Tails) is +EV here.

  #### 3. The Reset (35-40)
  "Pause. We are moving to Phase 2. Rounds 6 to 10.
  The coin mechanics are identical. Heads = 1 card. Tails = 2 cards.
  **However, the House Budget has changed.**"

  #### 4. Phase 2 Rules (40-65)
  **Settlement Protocol B (Collective):**
  "If you bet correctly, the winnings go into a **Round Pot**. The Pot is then split equally among all AWAKENING cards dealt in that round.
  *   Example: Coin is Heads. One card dealt. Holder bets Heads. Pot is 5 chips. Split 1 way. You get 5 chips.
  *   Example: Coin is Tails. Two cards dealt. Both bet Tails. Pot is 5 chips. Split 2 ways. **You get 2.5 chips each.**"

  *Run 5 Rounds.*
  *Expected Outcome:* Students who bet **Tails** (out of habit from Phase 1) will now lose ground. The payout for Tails is diluted. The "Halfer" strategy (bet Heads, or be indifferent) is now +EV or neutral, while Tails is -EV relative to Heads.

  #### 5. The Debrief (65-90)
  "Stop betting. Look at your chip counts.
  In Phase 1, who bet Tails? (Show of hands). You likely gained chips.
  In Phase 2, who kept betting Tails? (Show of hands). You likely lost chips.
  Why did the rational bet flip when the coin didn't change?"

  **The Reveal:**
  "This is the **Sleeping Beauty Problem**.
  *   **Phase 1** models the **Thirder** position. You count *awakenings*. There are twice as many Tails-awakenings as Heads-awakenings. If you are scored per awakening, you should believe P(Tails) = 2/3.
  *   **Phase 2** models the **Halfer** position. You count *experiments*. The coin is fair (1/2). If you are scored per experiment (the pot is fixed per round), the extra awakening on Tails doesn't give you extra money. P(Tails) = 1/2."

  **The Hard Question:**
  "Did your *credence* change between Phase 1 and 2? Or did only your *betting strategy* change?
  If you say your credence changed, you are a Pragmatist.
  If you say your credence stayed 1/2 but your bet changed, you are a Halfer who understands utility.
  If you say your credence stayed 2/3 but the bet changed, you are a Thirder who understands utility."

  ---

  ### Honest Account: What Will Go Wrong

  **1. The "Different People" Objection**
  *   **The Flaw:** As your colleague noted, handing cards to *different* students is not the same as *one* student waking twice. In the real problem, Beauty knows she is the same person. In your room, Student A knows they are not Student B.
  *   **The Impact:** A sharp student will say: "This isn't Sleeping Beauty. In Phase 1, I'm just betting on the frequency of cards, not the coin."
  *   **Your Response:** "Exactly. The Sleeping Beauty problem collapses into a frequency problem if you care about total payouts. The philosophical puzzle is whether *personal identity* matters for probability. This game shows that for *decision making*, identity might not matter—only the scoring rule does."
  *   **Verdict:** This is not fatal. It shifts the lesson from metaphysics to decision theory, which is often more valuable for undergraduates.

  **2. The "Small Sample" Variance**
  *   **The Flaw:** 5 rounds is a small sample. You might get 4 Heads in Phase 1. The "Tails" bettors will lose chips despite having the correct EV strategy.
  *   **The Fix:** If the coin runs hot on Heads, acknowledge it. "The House got lucky. But calculate the EV: if we ran this 1000 times, who wins?" Do not fake the coin flips; your Auditors will catch you.

  **3. Student Disengagement in Auditing**
  *   **The Flaw:** Students without cards might zone out.
  *   **The Fix:** Make the Auditors responsible for the "Bank Solvency." If the House goes bankrupt (negative chips), the game ends. They have a vested interest in tracking the payouts.

  **4. The "Rigged" Accusation**
  *   **The Flaw:** Students may feel Phase 2 was designed to punish them for learning Phase 1.
  *   **The Fix:** Frame it as "Market Volatility." In real finance, strategies that work in one regime fail in another. The skill is detecting the regime change.

  ### Can This Reproduce the "Hard" Part of SBP?
  **No.** It cannot reproduce the *amnesia* or the *self-locating uncertainty*.
  *   **Why:** In SBP, Beauty wakes up and asks, "What day is it?" In your game, Student A wakes up and asks, "What did the coin do?" They know they are Student A, not Student B.
  *   **Does it matter?** For a 90-minute seminar, **no.** The core tension of SBP is usually whether P(Tails) is 1/2 or 1/3. Your game proves that **1/3 is the correct betting odds under Protocol A** and **1/2 is the correct betting odds under Protocol B**.
  *   **The Takeaway:** You are teaching them that "Credence" is not a magic number; it is tied to how you are scored. That is a more robust lesson than solving the metaphysical puzzle.

  ### Final Commitment
  Run the game exactly as scripted above.
  1.  **Do not hide the Phase 2 rule.** Announce it. Let them choose to update or stick with habit. The penalty for sticking with habit is the lesson.
  2.  **Do not apologize for the "Different People" flaw.** Own it. Tell them: "We are simulating the *consequences*, not the *consciousness*."
  3.  **Commit to the Thirder Nudge.** Phase 1 (Individual Payout) is the default intuition for most students. They will naturally feel 2/3 is right. Phase 2 forces them to confront the Halfer logic. Let them feel the pull of 2/3 first; it makes the Halfer counter-argument more surprising.

  This plan fits the room, fits the time, and uses the "sting" of financial loss rather than the "sting" of hidden rules to drive the point home.
