          *   Premise: 1 quadrillion invertebrates killed/year.
          *   Credence: 1/10,000 sentience probability.
          *   Expected sentient deaths: 100 billion (12x human population).
          *   Principle: Expected moral weight = Σ (Number × Credence(Sentience) × Welfare Range).
          *   Anticipated Objection: Correlated uncertainty (not independent coin flips).
