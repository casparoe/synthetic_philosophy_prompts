answer: |-
  You've struck at the precise tension that separates naive symmetry from robust superrationality. If two agents run the *strictly* same decision procedure, that procedure includes the utility function; if your payoffs are inverted relative to mine, we are not, in the relevant sense, identical agents. We are running different code because our terminal values differ. However, I grant your practical point: in the real world, we approximate identical reasoning while holding divergent interests. To retreat to "out of scope" here would indeed render the theory toothless, since perfect symmetry is rare. But this doesn't force us into indeterminacy or moral smuggling. Instead, it pushes us toward a bargaining solution.

  When identical reasoning processes confront asymmetric payoffs, the rational focal point isn't to sum utilities because it's morally right, but because *fairness* is the only unique solution stable under common knowledge. If we both know we reason alike, we both know that demanding the asymmetric advantage leads to a clash of identical demands—a deadlock. The only way for identical procedures to output a coordinated action in an asymmetric game is to adopt a rule that treats the asymmetry symmetrically, such as the Nash Bargaining Solution. This isn't consequentialist bookkeeping imported from outside; it's the internal logic of coordination when agents recognize their logical entanglement. The core prescription stands: maximize the output of the shared procedure, which now includes the subroutine for resolving asymmetric interests via fair division.

