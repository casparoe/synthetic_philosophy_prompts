  ### The Case: ALDH2 Deficiency (Alcohol Flush Reaction)

  A compelling example that satisfies your constraints is **ALDH2 deficiency**, the genetic condition responsible for the "Alcohol Flush Reaction."

  **The Biology:**
  The condition is caused by a single nucleotide polymorphism in the *ALDH2* gene, which codes for the enzyme aldehyde dehydrogenase 2. This enzyme is responsible for metabolizing acetaldehyde, a toxic byproduct of alcohol breakdown. In individuals with the deficiency (specifically the *ALDH2*2 allele), the enzyme is nearly inactive. When they consume alcohol, acetaldehyde accumulates, causing facial flushing, nausea, tachycardia, and significantly increasing the risk of esophageal cancer. The underlying biology—the specific genetic mutation and the resulting enzymatic inefficiency—remains unchanged regardless of how the individual is classified.

  **The Reference Class Shift:**
  Under Christopher Boorse's Biostatistical Theory (BST), a condition is a disease if it represents a deviation from the statistically normal functional design of a **reference class**.

  1.  **Reference Class: *Homo Sapiens* (The Species)**
      *   **Statistics:** Globally, the functional *ALDH2* gene is the overwhelming majority. The deficient allele is rare outside of East Asia.
      *   **Verdict:** Relative to the species, the enzyme is malfunctioning. The individual falls into the statistical tail of functional inefficiency.
      *   **Diagnosis:** **Disease/Dysfunction.** The biological system is failing to perform its species-typical function (detoxification), leading to harm (cancer risk).

  2.  **Reference Class: East Asian Adults (Local Population)**
      *   **Statistics:** In certain East Asian populations, the prevalence of the *ALDH2*2 allele ranges from 30% to 50%.
      *   **Verdict:** Relative to this specific population, the trait is statistically normal. It is not a deviation; it is a common polymorphism.
      *   **Diagnosis:** **Normal Variation.** Within this class, having the "slow" enzyme is not an abnormality but a standard variant of human biology, akin to blood type.

  **Defensibility of Both Verdicts:**
  Both verdicts are defensible within a naturalist framework.
  *   **The "Disease" verdict** is defensible because the enzyme *physically fails* to catalyze the reaction at the rate of the ancestral design, leading to objective physiological harm (toxicity). A naturalist can argue that "function" is determined by evolutionary design, not just local statistics.
  *   **The "Normal" verdict** is defensible because BST is explicitly *statistical*. If half the population has the trait, it cannot be "abnormal" by definition. Furthermore, the persistence of the allele suggests it may have been evolutionarily selected for (possibly offering protection against parasitic infection), making it a functional adaptation in that specific context.

  ### Which Reference Class Ought to be Privileged?

  A consistent naturalist, following Boorse, **ought to privilege the Species reference class** (perhaps subdivided only by sex and age, but not geography or ethnicity).

  **Reasoning:**
  If we privilege local populations, we risk the "Endemic Disease Problem." If a specific village has a 100% infection rate of a pathogen due to local sanitation, a population-based reference class would render the infection "statistically normal" and therefore not a disease. To maintain the concept of disease as an objective biological failure rather than a local statistical norm, the naturalist must anchor "normal function" to the species level. This ensures that a pathology in one region is recognized as a pathology everywhere, preserving the universality of medical science.

  ### Can This Choice Be Defended Without Appealing to Values?

  **No.** The choice to privilege the species reference class over the local population reference class cannot be defended on biological facts alone.

  1.  **The Biological Equivocity:** Biologically, both the species-wide distribution and the local population distribution are factual realities. There is no biological law that dictates which grouping is the "correct" one for determining health. The genes are the same; only the comparator group changes.
  2.  **The Normative Leap:** Choosing the species class is a methodological choice driven by the **value** of universalizability. We *want* medicine to identify threats to human survival regardless of how common they are in a specific group. We prioritize the *value* of preventing harm (cancer risk) over the *value* of respecting local statistical norms.
  3.  **The Alternative:** If we valued cultural relativism or local adaptation over universal biological standards, we could defensibly choose the local population class. The decision to reject that in favor of the species class is a pragmatic and normative judgment about the *purpose* of the concept of disease (i.e., is it to describe statistical variance or to identify objective harms?).

  ### Conclusion: What This Shows About Naturalism

  This case demonstrates that the claim that **the concept of disease can be analyzed without invoking values is false.**

  While the *components* of the analysis (enzyme efficiency, statistical frequency, genetic makeup) are value-free natural facts, the **assembly** of these facts into a diagnosis requires a prior, value-laden decision about the **scope of comparison**. Because the biological facts underdetermine the reference class, and the reference class determines the diagnosis, the concept of disease is not fixed by biology alone. It inevitably relies on a normative choice about which similarities between humans matter most for the purpose of medicine. Thus, a purely naturalist account of disease is incomplete; it silently smuggles in values at the stage of reference class selection.
