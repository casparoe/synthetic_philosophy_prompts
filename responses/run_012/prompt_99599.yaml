answer: |-
  **Project Title:** Quantifying Structural Ambiguity in Inverse Reinforcement Learning

  **Central Question**
  Can the uncertainty in Inverse Reinforcement Learning (IRL) be formally decomposed into structural ambiguity (reward shaping equivalences) and parametric confounding (the trade-off between preference strength and demonstrator competence), and can we design interventions that specifically reduce the latter?

  Standard IRL seeks a point estimate of a reward function $R$ that renders observed behavior optimal. However, when dynamics are fixed, any reward function $R' = R + \Phi$ (where $\Phi$ is a potential function over states) induces the same optimal policy. When dynamics are unknown or the demonstrator is suboptimal, the problem worsens: a reward function paired with a low rationality parameter (high noise) can explain the same data as a different reward function paired with high rationality. Current methods treat this non-identifiability as a nuisance to be regularized away via priors. This project proposes treating the ambiguity itself as the primary object of inference. The goal is not to find *the* reward, but to output the set of reward-rationality pairs consistent with data, characterized by what they agree on, where they disagree, and why.

  **Motivation: Why Existing Technical Fixes Fail**
  The standard response to IRL non-identifiability is to impose a maximum-entropy prior or a Bayesian posterior and select the maximum a posteriori estimate. This is sufficient for imitation learning, where the goal is merely to match behavior. It is insufficient for value learning, where the goal is to recover preferences to guide future behavior or evaluate outcomes.

  Selecting a representative from an equivalence class via a prior is a sleight of hand: it claims to recover preferences while actually recovering "preferences plus simplicity assumptions." Similarly, reporting Bayesian credible intervals is mathematically inappropriate when the likelihood surface contains ridges or flat plateaus rather than a unique peak. A credible interval implies a concentration of probability mass around a true value; when the model is unidentifiable, the mass is distributed over structurally distinct solutions that are empirically indistinguishable. Widening the prior does not solve this; it merely smooths the ambiguity. We need a formalism that acknowledges the likelihood surface's geometry rather than obscuring it with regularization.

  **Approach**
  The project will develop a framework for "Ambiguity-Aware IRL." Instead of outputting a single $R$, the learner outputs a characterization of the consistent set $\mathcal{C} = \{(R, \beta) : P(D | R, \beta) > \epsilon\}$, where $\beta$ is the rationality parameter. This characterization consists of three components:

  1.  **The Agreed Partial Order:** For any two trajectories $\tau_1, \tau_2$, we determine if $R(\tau_1) > R(\tau_2)$ holds for all $(R, \beta) \in \mathcal{C}$. If so, the preference is identified. If not, it is ambiguous.
  2.  **The Unresolved Set:** The set of trajectory pairs where the ordering flips depending on the choice of $(R, \beta)$ within $\mathcal{C}$.
  3.  **The Ambiguity Decomposition:** For each unresolved comparison, we attribute the ambiguity to either (a) shaping invariance (structural) or (b) the rationality-preference trade-off (parametric).

  The third component is the load-bearing contribution. In standard bounded-rationality models (e.g., Boltzmann rationality), $R$ and $\beta$ are confounded: a weak preference with high competence can mimic a strong preference with low competence. I hypothesize that while they cannot be fully disentangled from passive observation, the *direction* of the confounding can be mapped. By analyzing the curvature of the likelihood surface along the $R$-$\beta$ ridge, we can quantify how much additional data is required to collapse the ridge versus how much ambiguity is permanent due to shaping.

  This approach is superior to alternatives because it enables *active disambiguation*. If the ambiguity is structural (shaping), no amount of behavioral data will resolve it; we must accept the equivalence class. If the ambiguity is parametric (competence), specific queries (e.g., asking the demonstrator to choose between high-stakes trajectories where noise is less likely to dominate) can resolve it. A point-estimate approach cannot distinguish these cases and will waste queries on structural ambiguities that cannot be resolved.

  **Work Plan**
  This is an analytic and small-scale theoretical project. No large-scale empirical training of deep RL agents is proposed; verification will use tabular MDPs and low-dimensional continuous control where the likelihood surface can be explicitly mapped.

  *   **Months 1–3: Formalizing the Equivalence Class.**
      Define the set $\mathcal{C}$ rigorously for finite MDPs. Derive the conditions under which the partial order on trajectories is invariant across $\mathcal{C}$. Develop algorithms to compute the "Agreed Partial Order" efficiently without sampling the entire posterior.
      *Deliverable:* A theorem characterizing the invariant properties of the reward equivalence class under bounded rationality.

  *   **Months 4–6: The Competence-Preference Frontier.**
      Focus on the joint inference of $R$ and $\beta$. Analyze the likelihood landscape to identify the "ridge" where changes in $\beta$ are compensated by scaling $R$. Attempt to derive a metric that separates variance due to $\beta$ uncertainty from variance due to shaping transformations.
      *Deliverable:* A decomposition metric for posterior uncertainty (Structural vs. Parametric).

  *   **Months 7–9: Active Intervention Design.**
      Design query strategies that target the parametric ambiguity. If the metric from Months 4–6 indicates high competence-related uncertainty, the system should propose trajectory comparisons that maximize the information gain about $\beta$ specifically.
      *Deliverable:* An active querying algorithm that prioritizes resolving parametric confounding over structural ambiguity.

  *   **Months 10–12: Synthesis and Impossibility Analysis.**
      Synthesize results into a unified framework. Crucially, test the limits: attempt to prove whether the decomposition in component (3) is theoretically possible. If the decomposition fails, formalize the impossibility result.
      *Deliverable:* Final fellowship paper and open-source library for ambiguity-aware IRL in tabular domains.

  **Evaluation: Success and Failure**
  A successful result will be a formal metric that allows a practitioner to look at an IRL solution and say: "80% of the uncertainty in this preference comparison is due to the demonstrator's noise, and could be resolved with 50 more queries; 20% is due to reward shaping, and cannot be resolved without observing different dynamics." This would transform IRL from a method that hides its assumptions to one that explicitly reports its epistemic limits.

  However, I must be honest about the primary risk. The project may fail in its positive aim if it turns out that preference strength and demonstrator competence are fundamentally inseparable from behavioral data alone, even with active queries. If the likelihood ridge is perfectly flat such that no intervention can distinguish a noisy expert with strong preferences from a precise expert with weak preferences, then component (3) is impossible.

  In this case, the project would "fail" to produce an ambiguity-resolving tool, but it would succeed as a negative impossibility result. Proving that value learning is fundamentally bottlenecked by the competence-preference confound would be a critical contribution, preventing the field from chasing unachievable identifiability. I am prepared to pivot to this impossibility proof if the analytic work in Months 4–6 suggests the decomposition is ill-posed. Either outcome resolves the research question: we will know whether ambiguity can be dissected, or we will know precisely why it cannot.
