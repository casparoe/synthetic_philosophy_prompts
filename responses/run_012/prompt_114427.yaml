answer: |-
  You have put your finger on one of the most persistent and damaging objections in modern moral philosophy. Because you come from bench chemistry, you will appreciate the precision of the distinction you are drawing: it is not a complaint about the *yield* (the act is correct), nor about the *energy cost* (it is too demanding), but about the *reaction mechanism* itself. The mechanism proposed by the theory is incompatible with the substance being acted upon.

  ### 1. The Name
  The settled name for this objection, specifically in the context you describe, is **"One Thought Too Many."**

  It comes from the philosopher **Bernard Williams**, in his 1981 essay *"Persons, Character and Morality."*

  While Williams coined the phrase, the broader category of objection is often referred to as the **Alienation Objection** or the **Integrity Objection**. A closely related critique was published around the same time by **Michael Stocker**, who called it the **"Schizophrenia of Modern Ethical Theories."** Stocker argued that modern theories (both Utilitarian and Kantian) create a split between the *justification* of an act (the theory) and the *motive* required to make the act valuable (love, friendship, etc.).

  ### 2. What Unifies These Instances?
  You asked what makes these instances instances of *one thing*. The unifying thread is **instrumentalization via justification.**

  In the examples you gave (the parent, the friend, the forgiver), the relationship or the virtue is being treated as a *vehicle* for satisfying a moral principle, rather than as a *source* of reasons in itself.

  *   **The Parent:** The reason to save the child should be "Because she is *my* child." If the reason is "Because impartial morality permits partiality here," the parent has stepped outside the role of 'parent' and into the role of 'moral agent.'
  *   **The Friend:** Friendship is constitutively defined by acting for the friend's sake. If you act for *morality's* sake, you are, in that moment, not acting as a friend.
  *   **The Forgiver:** Forgiveness is a personal release of resentment. If done because "Principle X demands it," it is not forgiveness; it is administrative compliance.

  The failure is not that the thought leads to the wrong act. The failure is that the presence of the thought reveals that the agent does not actually possess the virtue or the relationship they claim to be enacting. They are simulating the output of a friend/parent/forgiver without the internal state that makes that output meaningful.

  ### 3. The Standard Reply (and Why It Fails)
  You identified the standard defense perfectly: **"The theory is a criterion of rightness, not a decision procedure."**

  This is the move made by "Sophisticated Consequentialists" (like Peter Railton) or Rule Utilitarians. They argue: *Of course you shouldn't calculate utility in the moment. You should cultivate instincts (love, loyalty) that generally produce the best results. The theory justifies why you have those instincts, but you don't consult the theory while using them.*

  You asked: *Does the objection survive this reply?*
  **Answer:** Yes, but only in specific contexts. Here is where it stops.

  #### Where the Reply Works (The Boundary)
  The reply works in **instrumental** contexts.
  *   *Example:* A judge sentencing a criminal.
  *   *Analysis:* The judge *should* think about principles, laws, and societal safety. If the judge sentences based purely on personal pity, that is a failure. Here, the "moral thought" is appropriate. The indirect strategy holds: the theory tells the judge what to do, and the judge deliberates using the theory.

  #### Where the Reply Fails (The Core)
  The reply fails in **constitutive** contexts.
  *   *Example:* The husband saving his wife from drowning (Williams's famous example).
  *   *Analysis:* Williams argues that even if the theory says "Don't think about the theory in the moment," the problem remains if the *ultimate justification* for the husband's life is the theory.
      *   If the husband loves his wife *because* loving her maximizes utility, he is alienated from her, even if he isn't calculating at the moment of rescue.
      *   The "indirect" defense requires the agent to hold a false belief (or no belief) about why they are acting. It requires a kind of self-deception: "I must not believe the true theory of rightness while I act, or else I will ruin the act."
      *   Williams argues this attacks **Integrity**. It asks the agent to view their own deepest commitments (love, projects, relationships) as external assets to be managed by the moral theory, rather than as the very ground of their identity.

  ### 4. A Chemistry Analogy
  Since you spent thirty years on the bench, consider this:

  Imagine a theory of biochemistry that claims the "correct" state of an enzyme is its catalytic activity.
  *   **The Theory:** "This enzyme is 'good' because it lowers activation energy for Reaction X."
  *   **The Objection:** If you analyze the enzyme *during* the reaction using mass spectrometry, you disrupt the folding. The analysis is true, but the act of analyzing destroys the function.
  *   **The Indirect Defense:** "Well, the theory doesn't say you must analyze it *during* the reaction. Just analyze it afterwards."
  *   **The Williams Reply:** "If the *nature* of the enzyme is defined entirely by the analysis, then the enzyme is merely a tool for the analyst. But if the enzyme has an intrinsic folding stability that *allows* the reaction, then the analysis is secondary to the structure. If your moral theory requires you to treat your own character as something that must not be looked at directly to function, your theory is incompatible with human psychology."

  ### 5. Summary of the Distinction
  To answer your question on where the objection stops:

  1.  **It stops** when the value of the act is purely **outcome-dependent**. (e.g., Donating money to a stranger. It doesn't matter if you do it out of duty or pity, the stranger gets the money.)
  2.  **It holds** when the value of the act is **process-dependent** or **relationship-dependent**. (e.g., Loving a spouse, forgiving a friend. The value *is* the motive. If the motive is "obedience to principle," the value is lost.)

  ### 6. Recommended Reading
  If you want to pursue this further, these three papers form the "holy trinity" of this specific objection:

  1.  **Bernard Williams, "Persons, Character and Morality"** (1981). Look for the section on "One Thought Too Many."
  2.  **Michael Stocker, "The Schizophrenia of Modern Ethical Theories"** (1976). This is arguably the sharper technical critique of the motive/justification split.
  3.  **Peter Railton, "Alienation, Consequentialism, and the Demands of Morality"** (1984). This is the best attempt to *answer* the objection. Railton tries to show how a consequentialist can avoid alienation. Reading this will show you exactly where the "indirect strategy" tries to draw the line and whether you find it successful.

  You have identified the exact point where moral philosophy often crashes into the phenomenology of human life. The theory demands a view from nowhere; the life requires a view from somewhere.
