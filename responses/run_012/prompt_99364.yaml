answer: |-
  Based on the pattern of your teacher's rulings, here is an analysis of the criterion she is using, the alternatives that fit her past data, and the prediction for your specific case.

  ### 1. The Best-Fit Criterion: Immunization Against Falsification
  The criterion that best fits your teacher's earlier rulings is **Methodological Immunization** (often associated with Karl Popper's demarcation problem).

  *   **The Rule:** A claim is pseudohistory if its proponents structure the argument so that no possible empirical observation could force them to abandon the core claim. When counter-evidence appears, it is absorbed by *ad hoc* modifications (e.g., "it's hidden," "it's a forgery," "it's elsewhere") rather than leading to refutation.
  *   **Application to Past Cases:**
      *   *Atlantis/Aliens/Fomenko:* Classified as pseudohistory because missing evidence is explained by cover-ups, loss, or forgery, ensuring the claim "cannot lose."
      *   *Sphinx/Runestone:* Cleared because defenders specified in advance what evidence would refute them.
      *   *Piltdown:* Classified as fraud, not pseudohistory, because the proponent actively hid evidence rather than reinterpretating the framework to absorb it.

  ### 2. Two Alternative Criteria
  Two other criteria fit your teacher's previous rulings equally well but rely on different features of the examples.

  **Alternative A: Institutional Legitimacy (Sociological Criterion)**
  *   **The Rule:** Pseudohistory is defined by the social location of the claim. It is produced by outsiders, amateurs, or those rejected by the mainstream academic consensus. Legitimate history is produced by credentialed experts publishing in peer-reviewed venues.
  *   **Fit with Past Cases:** All her pseudohistory examples (Fomenko, alien theorists, Atlantis proponents) are fringe or anti-establishment. All her non-pseudohistory examples (the university fossil case, the museum runestone debate) occur within or alongside accepted institutional frameworks.
  *   **Prediction for New Case:** **Not Pseudohistory.** The research group has "usual credentials," is at a "major university," and publishes in "ordinary peer-reviewed journals." Under this criterion, their institutional badge protects them.

  **Alternative B: The Conspiracy/Agency Requirement**
  *   **The Rule:** Pseudohistory requires a narrative of active concealment or systematic deception to explain away contradictions. Legitimate history attributes gaps in the record to natural processes, entropy, or simple lack of data.
  *   **Fit with Past Cases:** The pseudohistory examples all involve agents hiding the truth (aliens covering up, forgers fabricating documents, the "memory" surviving against odds). The non-pseudohistory examples involve natural weathering (Sphinx) or simple modern forgery (Piltdown/Fraud distinction).
  *   **Prediction for New Case:** **Not Pseudohistory.** The group attributes the missing signature to natural taphonomy ("site was disturbed," "signature not preserved"). They are not alleging a cover-up or a grand fabrication, merely the normal degradation of archaeological data.

  ### 3. Best Guess at the Verdict
  **Verdict:** Your teacher will likely rule this **Pseudohistory** (or perhaps "degenerating research programme").

  **Reasons:**
  1.  **Explicit Heuristic:** Her stated reason for previous rulings is explicitly methodological ("the claim cannot lose"), not sociological. She cleared the amateur runestone proposer despite his lack of credentials, proving she does not rely solely on Institutional Legitimacy.
  2.  **Structural Identity:** The behavior of the research group ("never wrong for long," adding qualifications when evidence fails) is structurally identical to the Fomenko and Atlantis cases. They are using the "protective belt" of a theory to shield the "hard core" from refutation.
  3.  **The "Fraud" Distinction:** She has already established that hiding evidence is fraud, but *reinterpreting* evidence to save the theory is pseudohistory. This group is reinterpreting the absence of evidence ("it was disturbed") to save the theory, which fits her definition of pseudohistory better than fraud.

  ### 4. Which Case Forces a Choice?
  **Your case (the research group)** is the one that genuinely forces a choice among the criteria.

  *   **Her Cases:** In all her previous examples, the Methodological, Institutional, and Agency criteria pointed in the same direction. The cranks were unfalsifiable *and* fringe *and* conspiracy-minded. The legitimate historians were falsifiable *and* institutional *and* naturalistic. There was no conflict.
  *   **Your Case:** You have introduced a conflict. The group is **Institutionally Legitimate** (predicts "Not Pseudohistory") but **Methodologically Immunized** (predicts "Pseudohistory"). This forces the teacher to decide whether "pseudohistory" is a label for *who* speaks (outsiders) or *how* they speak (unfalsifiably). Given her explicit emphasis on "the claim cannot lose," she must prioritize Methodology over Institution.

  ### 5. The Defender's Move
  A defender of the research group would insist that no line is being crossed by invoking the distinction between **_ad hoc_ hypotheses** and **auxiliary hypotheses** (from Imre Lakatos's philosophy of science).

  *   **The Argument:** They would argue that their qualifications are not desperate shields to save a dying theory, but legitimate **auxiliary hypotheses** that are themselves testable.
  *   **The Move:** They would say: "We did not just say 'the site was disturbed' to save our skin; we provided geological evidence of that disturbance. If future excavation shows the site was *not* disturbed, we *will* abandon the claim."
  *   **The Goal:** By showing that the qualification ("site disturbed") is an independent, falsifiable claim rather than a mere excuse, they attempt to move the case from "Immunization" (Pseudohistory) back to "Normal Science" (Refining a theory in the face of noisy data). They would argue that abandoning a core theory at the first anomaly is not rigor, but instability.
