          *   *Concept:* The "Doctrinal Paradox" relies on distinguishing $p, q \vdash r$. But what if we treat $r$ as atomic? Or what if the logic is bidirectional?
          *   *Implication:* PBA requires a prior meta-decision on the agenda structure. This decision itself is subject to disagreement.
          *   *Attack:* PBA doesn't solve the problem; it pushes it back a step. Who decides the premises? This is the "agenda control" problem.
          *   *Ranking:* Serious/Threatening. It challenges the "right response" claim.

      *   **Point 3: Rival Responses (Inconsistency, Deliberation, Non-classical Logic, No Group Mind).**
          *   *Inconsistency:* Collectively inconsistent but individually rational. (Dworkin's law as integrity?). Usually seen as a failure of rationality.
