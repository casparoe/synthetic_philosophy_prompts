          *   *Ranking:* "No Group Mind" is a strong philosophical defeater (Fatal to the normative force). Deliberation is a trick (assumes away the problem).

      *   **Point 4: Epistemic Performance (Truth-Tracking).**
          *   *Concept:* Condorcet Jury Theorem (CJT) applied to premises vs. conclusions.
          *   *Implication:* PBA is better *if* premises are easier to judge than conclusions. But if the conclusion is the main thing we care about, and voters are competent on the conclusion directly, Conclusion-Based Aggregation (CBA) might be better.
