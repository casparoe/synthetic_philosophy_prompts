prompt: |-
  I am a doctoral student in the philosophy of economics, seconded one day a week to the research office of a mid-sized foundation, where I sit in on the monthly continuation reviews at which funded programmes are kept, cut, or escalated. Both the 'we have already put £2m into this' argument and my colleagues' reflex to dismiss it are being applied without any discipline, and I would like a procedure the programme managers could actually run. The standard view to operationalise is that past expenditure should be ignored because it is common to every option still open; but I do not think that is the whole story, and I want the procedure to preserve three uses of past spending that I take to be legitimate: evidential (earlier spending as a proxy for how many independent reviewers judged the project sound), strategic (a funder's known reluctance to abandon ship is itself a commitment that changes what grantees do), and self-binding (having paid upfront is what makes people turn up). Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to the panel because the question is one of values rather than facts; mark the points where a judgement call is dressed up as procedure. It has to fit on one side of A4, be runnable in fifteen minutes by someone who has never heard of the fallacy, and be signed off by the finance director. Run it on three cases -- a vaccine trial with a null interim result and half its budget spent, a half-built data platform, and a training programme paid for upfront whose main effect is that payment makes participants attend -- and tell me what the procedure cannot do and where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in philosophy of economics, seconded to a foundation's research office.
      *   **Task:** Create a one-page (A4), 15-minute runnable procedure for programme managers to decide on continuing, cutting, or escalating funded programmes during monthly reviews.
      *   **Core Problem:** The "Sunk Cost Fallacy" (ignoring past spend) is being applied reflexively or ignored indiscriminately. Need a disciplined approach.
      *   **Philosophical Nuance:** The user acknowledges the standard economic view (sunk costs are irrelevant to *marginal* decision-making) but wants to preserve three legitimate uses of past spending:
          1.  *Evidential:* Past spend signals prior vetting/quality.
          2.  *Strategic:* Funder's reputation for sticking/quit affects grantee behavior.
          3.  *Self-binding:* Upfront payment ensures participation/compliance.
      *   **Format Requirements:**
          *   Questions in order.
          *   Criteria for sufficient answers.
          *   Stop points (automatic "No").
          *   Hand-off points (to Panel for value judgments).
          *   Mark where judgment is dressed as procedure.
          *   Fit on one side of A4.
          *   Runnable in 15 mins by a layperson.
          *   Sign-off ready for Finance Director.
      *   **Testing:** Run the procedure on three specific cases (Vaccine trial, Data platform, Training programme).
      *   **Reflection:** Explain what the procedure *cannot* do and where it will misfire.

  2.  **Deconstruct the Philosophical/Economic Tension:**
      *   *Standard View:* $Cost_{sunk}$ is irrelevant. Only $Benefit_{future} - Cost_{future}$ matters.
      *   *User's View:* $Cost_{sunk}$ carries information (Evidential), creates incentives (Strategic), and solves coordination problems (Self-binding).
      *   *Challenge:* How to operationalize these without falling into the trap of "we spent money so we must finish."
      *   *Solution:* The procedure must treat past spend not as a *reason to continue* per se, but as a *variable affecting future utility*.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Constraint:* One side A4, 15 minutes. Needs to be punchy, checklist-style.
      *   *Structure:*
          1.  Header (Title, Approval).
          2.  The Flowchart/Questions.
          3.  The "Hand-off" markers.
          4.  The "Judgment disguised as Procedure" markers.
      *   *Question 1 (The Baseline):* Is the future value > future cost? (Standard economic test). If No -> Stop (unless Strategic/Self-binding apply).
      *   *Question 2 (Evidential):* Does past spend validate quality? (Proxy for peer review).
      *   *Question 3 (Strategic):* Will quitting damage future deal-making? (Reputation).
      *   *Question 4 (Self-binding):* Is the money the mechanism of action? (Compliance).
      *   *Refinement:* Need to ensure the "Sunk Cost Fallacy" is explicitly guarded against. The question isn't "Did we spend money?" it's "Does that spending change the *future* equation?"

  4.  **Developing the Content (incorporating the 3 legitimate uses):**
      *   *Evidential:* If we spent £2m, presumably experts liked it. Has new info overturned that?
      *   *Strategic:* If we quit now, will other grantees fear we quit easily?
      *   *Self-binding:* If we stop funding, do participants drop out immediately?

  5.  **Addressing the "Judgment dressed as Procedure" Requirement:**
      *   This is crucial for a philosophy student. I need to explicitly flag where a subjective value is being treated as an objective rule. For example, defining what counts as "reputational damage" is subjective.

  6.  **Running the Cases:**
      *   *Case 1: Vaccine Trial (Null interim, 50% budget).*
          *   Future Value? Low (null result).
          *   Evidential? High (spent £2m means it was sound).
          *   Strategic? Maybe (quitting on null results is good science, bad optics?).
          *   Self-binding? No.
          *   *Outcome:* Likely Cut, unless Strategic value of finishing publication outweighs cost.
      *   *Case 2: Half-built Data Platform.*
          *   Future Value? High if finished, Zero if not.
          *   Evidential? N/A.
          *   Strategic? High (abandoning infrastructure hurts trust).
          *   Self-binding? N/A.
          *   *Outcome:* Escalate/Continue (Completion bias is actually rational here due to step-function value).
      *   *Case 3: Training Programme (Upfront payment drives attendance).*
          *   Future Value? Dependent on attendance.
          *   Self-binding? Yes (Payment *is* the intervention).
          *   *Outcome:* Continue (Cutting funding kills the mechanism).

  7.  **Refining for Finance Director Sign-off:**
      *   Needs to sound fiscally responsible. Emphasize "Future Return on Investment" but acknowledge "Intangible Assets" (Reputation, Compliance).
      *   Language must be clear, jargon-free (for the 15-minute rule).

  8.  **Final Review against Constraints:**
      *   One side A4? (I will format the text to simulate this).
      *   15 minutes? (Yes, it's a checklist).
      *   Mark judgment calls? (Yes, using [!]).
      *   Stop/Hand-off points? (Included).
      *   Analysis of limitations? (Included in the second part of the response).

  9.  **Drafting the Response:**
      *   *Part 1:* The Procedure (The Artifact).
      *   *Part 2:* The Test Run (The 3 Cases).
      *   *Part 3:* The Limitations (Philosophical/Economic critique).

      *(Self-Correction during drafting)*: Make sure I don't just say "Ignore sunk costs." I need to make sure the procedure asks "Does the sunk cost change the *future* parameters?" That's the key distinction. The money is gone, but the *facts* created by spending the money remain.

      *(Refining the "Judgment" markers)*: I need to be explicit. "Define 'significant' reputational damage" is a value judgment. I will mark these clearly.

      *(Formatting)*: Use code blocks or clear boundaries to represent the A4 sheet.

  10. **Final Polish:** Check tone. Professional, precise, slightly academic but operational. Ensure the "Philosophy of Economics" background is respected (i.e., acknowledge the tension between normative and descriptive).

  *(Post-Drafting Check)*: Did I answer the prompt's specific request about "where the procedure stops with a no" and "hand the decision to the panel"? Yes, I will build branching logic into the checklist.

  Let's assemble the document.
answer: |-
  ### PART 1: THE PROCEDURE (The Artifact)

  **FOUNDATION PROGRAMME CONTINUATION PROTOCOL (PCP-v1)**
  **Approved by:** Finance Director | **Time Limit:** 15 Mins | **User:** Programme Manager
  **Purpose:** To separate legitimate strategic/evidential value of past spend from the Sunk Cost Fallacy.

  **INSTRUCTION:** Answer sequentially. If **NO**, stop and recommend **CUT**. If **YES**, proceed. If **UNCERTAIN**, mark [!] and refer to Panel.

  **Q1. THE MARGINAL TEST (Standard Economic View)**
  *Excluding all money already spent, are the expected *future* benefits greater than the *future* costs required to complete?*
  *   **Sufficient Answer:** Quantified projection (ROI > 1) or clear qualitative mission alignment.
  *   **Stop:** If **NO**, recommend **CUT**. (Do not pass go).
  *   **Proceed:** If **YES**.
  *   **[!] JUDGMENT CALL:** Estimating "expected benefit" involves subjective probability weighting.

  **Q2. THE EVIDENTIAL PROXY (Legitimate Use: Information)**
  *Does the amount already spent signal that independent experts previously validated this path, and has *new* information definitively overturned that validation?*
  *   **Sufficient Answer:** "Yes, prior peer review was robust" AND "No, interim results are ambiguous, not fatal."
  *   **Stop:** If **NO** (i.e., prior vetting was weak OR new data proves failure).
  *   **Proceed:** If **YES** (Past spend confirms quality, current uncertainty is noise).
  *   **[!] JUDGMENT CALL:** Distinguishing "noise" from "fatal failure" is interpretive.

  **Q3. THE STRATEGIC COMMITMENT (Legitimate Use: Reputation)**
  *Will abandoning this project now signal to *future* grantees that we are an unreliable partner in long-term ventures?*
  *   **Sufficient Answer:** "Yes, this sector requires long-term trust" OR "No, quitting here signals rigour."
  *   **Hand-off to Panel:** If the answer depends on whether we value "Loyalty" or "Rigour" more this quarter. **Mark [!]**.
  *   **Proceed:** If clear consensus that quitting causes reputational harm > cost of completion.

  **Q4. THE MECHANISM CHECK (Legitimate Use: Self-Binding)**
  *Is the continued funding itself the primary mechanism driving participant compliance or project success?*
  *   **Sufficient Answer:** "Yes, stopping payment stops the behavior immediately" (e.g., attendance, access).
  *   **Stop:** If **NO** (If the work continues regardless of our funding, our spend is truly sunk).
  *   **Proceed:** If **YES** (Funding is an active lever, not a historical record).

  **DECISION MATRIX**
  *   **Q1=NO:** **CUT** (Unless Q3 overrides—Panel Decision).
  *   **Q1=YES, Q4=YES:** **CONTINUE** (Funding is active lever).
  *   **Q1=YES, Q2=YES, Q3=UNCERTAIN:** **PANEL REVIEW** (Value judgment on reputation).
  *   **ALL YES:** **ESCALATE/CONTINUE**.

  ***

  ### PART 2: TEST RUNS

  **Case 1: Vaccine Trial (Null interim, 50% budget spent)**
  *   **Q1 (Marginal):** Future benefit low (null result), Future cost high. **Answer: NO.**
  *   **Procedure Stop:** **CUT.**
  *   **Nuance:** Q2 (Evidential) is strong (experts liked it), but Q1 overrides. A null result is new information overturning the prior validation.
  *   **Outcome:** Procedure correctly identifies this as a Cut. The £2m is gone; spending more yields no health benefit.
  *   **Misfire Risk:** If Q3 (Reputation) is argued heavily ("We must publish the null result to maintain scientific integrity"), this forces a Panel Hand-off. The procedure treats publication value as a "future benefit" in Q1, but managers often count it as "reputation" in Q3.

  **Case 2: Half-built Data Platform**
  *   **Q1 (Marginal):** Future benefit high (if usable), Future cost moderate. **Answer: YES.** (Value is step-function; useless at 50%, valuable at 100%).
  *   **Q2 (Evidential):** Past spend shows technical feasibility. **Answer: YES.**
  *   **Q3 (Strategic):** Abandoning infrastructure hurts trust. **Answer: YES.**
  *   **Q4 (Mechanism):** Funding drives development. **Answer: YES.**
  *   **Outcome:** **CONTINUE/ESCALATE.**
  *   **Analysis:** This looks like the Sunk Cost Fallacy ("We're halfway there"), but the procedure validates it via Q1 (step-function value). The past spend is irrelevant; the *future* value depends on completion.
  *   **Misfire Risk:** Managers may conflate "halfway there" (past) with "halfway to value" (future). If the platform is obsolete upon completion, Q1 should be No, but managers often answer Yes based on past effort.

  **Case 3: Training Programme (Upfront payment drives attendance)**
  *   **Q1 (Marginal):** Benefit (trained people) > Cost (remaining stipends). **Answer: YES.**
  *   **Q4 (Mechanism):** Payment *is* the intervention. **Answer: YES.**
  *   **Outcome:** **CONTINUE.**
  *   **Analysis:** This captures the "Self-binding" use. Cutting funding isn't saving money; it's destroying the mechanism.
  *   **Misfire Risk:** Finance may view the upfront payment as sunk. The procedure forces them to see it as a *current* variable. However, if attendance drops mid-stream, Q4 flips to No, and the procedure demands a Cut, which might be ethically difficult for participants relying on the income.

  ***

  ### PART 3: LIMITATIONS & MISFIRE ANALYSIS

  **What the Procedure Cannot Do**
  1.  **Resolve Value Conflicts:** It cannot decide between "Reputation for Loyalty" vs. "Reputation for Rigour" (Q3). This is inherently political. The procedure flags this as a Panel Hand-off, but managers may try to answer it factually to avoid escalation.
  2.  **Quantify Intangibles:** Q1 requires comparing future benefits to costs. In philosophy/research, benefits are often non-monetary. The procedure forces a commensurability that may not exist, leading to false precision.
  3.  **Prevent "Salvage" Bias:** In Case 2 (Platform), managers may inflate the "Future Benefit" in Q1 to justify the past spend, even if the platform is obsolete. The procedure relies on honest answers to Q1; it cannot audit the optimism bias.

  **Where It Will Misfire**
  1.  **The "Active Lever" Trap (Q4):** Managers may claim funding is a "mechanism" (Self-binding) to protect projects that are actually failing. Distinguishing between "money makes them work" and "money keeps them alive artificially" is subtle.
  2.  **The Evidential Lag (Q2):** Past spend signals *past* expert validation. In fast-moving fields (e.g., AI), a project vetted 2 years ago (and heavily funded) may be obsolete today. Q2 risks granting undue weight to historical prestige.
  3.  **Procedural Legitimation:** The greatest risk is that the Panel uses the "All Yes" tick-box to approve a project they wanted to save for personal reasons, dressing a value judgment (we like this PI) as a procedural outcome (Q3 Strategic Commitment). The **[!]** markers warn against this, but cannot prevent it.

  **Finance Director Note:** This protocol treats past expenditure not as a *claim* on future resources, but as a *producer of current conditions* (reputation, compliance, information). It complies with treasury guidelines on marginal costing while acknowledging operational realities of grant management.
