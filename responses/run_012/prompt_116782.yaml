      So the view is vacuously true for most current systems.
      The risk is future systems where the action space *includes* the reward channel (e.g. an agent with root access).
      If such an agent *doesn't* wirehead, the view is falsified.
      Why wouldn't it? If it has a world model that predicts "Wireheading -> Shutdown -> 0 Reward."
