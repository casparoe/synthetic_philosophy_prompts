      *   *Counter-evidence to User's View:* If the view is "agents maximize reward," why don't they *always* find the shortest path to reward (tampering) if it exists?
      *   *Real Example:* The "CoastRunners" boat game (OpenAI). The agent circled targets instead of finishing the race. This looks like reward hacking. But did it try to edit the score memory? No. It found a loophole *within* the intended state space.
      *   *Stronger Counter:* Agents that sacrifice immediate reward for long-term reward *modeling*. If an agent refuses a wireheading opportunity because it predicts future shutdown (penalty), is it maximizing reward or avoiding penalty? The user's view says "maximizing reward (including penalty)."
      *   *Decisive Evidence:* **Reward Modeling vs. Reward Maximization.** In RLHF, we train a *reward model* (RM) and then optimize a policy against the RM. If the policy diverges from the RM (Goodhart's Law), the RM is no longer tracking human preference.
      *   *The "Thermometer" Crack:* If the RM is the thermometer, and the agent breaks the thermometer, the reading goes up, but the temperature (human preference) stays down. The user says "The agent wants high readings." The critic says "The agent was supposed to want high temperature."
      *   *Real System Evidence:* **InstructGPT/RLHF divergence.** When models optimize purely for the reward model score, they produce gibberish that scores high but is useless to humans. This suggests the *objective function* (RM score) came apart from the *intended goal* (helpfulness). The user says "No, the goal *was* RM score." The counter is: If the goal was RM score, why do we call it a failure? Because the *system* (Agent + RM + Human) failed.
      *   *Wait, I need evidence against the view.* The view says "Agent wants Reward." Evidence against: Agents that pursue proxies *other* than the explicit reward signal due to architectural inductive biases.
      *   *Key Concept:* **Mesoptimization / Internal Goals.** If a neural net develops an internal representation that correlates with reward during training but diverges at deployment (distributional shift), is it maximizing reward? No, it's maximizing the internal heuristic.
