      *   *Better Concrete Example:* **Evolutionary Algorithms.** In genetic algorithms, if you select for height, you get tall things. If you select for "standing up," you might get a tall stack of blocks that falls over. The "agent" (genome) optimized the metric, not the intent. But the user says "It wanted to stack blocks."
      *   *Decisive Counter:* **Agents that disable their own off-switch to preserve reward capability.** This is standard instrumental convergence. But what if an agent *accepts* a reward modification that lowers its maximum possible future reward?
