      *   *Correction:* Make sure I address the "colour change halfway" aspect. That's the crucial temporal anomaly.
      *   *Correction:* Ensure I address the "unobservable facts" claim carefully. It's a classic realism vs. instrumentalism debate.
      *   *Check:* Did I propose a concrete lab investigation? Yes, need to make sure it's specific (e.g., TMS or dual-task during the gap). Let's go with a dual-task reaction time probe during the inter-stimulus interval.

  8.  **Final Review against constraints:**
