      *   Keep it sceptical. Don't say "Ana is right." Say "Ana's position is more parsimonious regarding causality."
      *   Check constraints: "Think carefully and work step by step." "Precise, well-hedged answer."

  7.  **Final Polish (Self-Correction during drafting):**
