  ### Application to a New Case: Mussels vs. Lentils

  You asked for a verdict on a meal of **mussels** against a meal of **lentils**.

  **Analysis under WISE:**
  1.  **Lentils:** Plant agriculture.
      *   **Impact:** Harvest kills field mice ($N$ is moderate).
      *   **Capacity:** Mice are mammals ($C$ is high).
      *   **Suffering:** Death is often mechanical and quick, but $N \times C$ is non-negligible.
  2.  **Mussels:** Bivalve mollusks.
      *   **Impact:** Farming requires harvesting the mussels themselves.
      *   **Capacity:** Bivalves lack a central nervous system or brain. Current scientific consensus assigns them a $C$ near zero or significantly lower than insects.
      *   **Suffering:** Even if they react to stimuli, the $C$ weight is minimal.

  **Verdict:**
  **The meal of mussels is morally preferable to the meal of lentils.**

  **Reasoning:**
  Your principle weights suffering by capacity ($C$). You already stated that insect deaths count for "only a small fraction of a mammal's." Bivalves (mussels) are neurologically simpler than insects. Therefore, the $C$ for a mussel is effectively negligible. The lentil meal, however, necessitates the death of field mice (mammals with high $C$). Even if the number of mice is small, their high capacity ($C$) and the certainty of death ($D$) outweigh the negligible potential suffering of the mussels. This follows directly from your own weighting of insects vs. mammals, extended to bivalves.
