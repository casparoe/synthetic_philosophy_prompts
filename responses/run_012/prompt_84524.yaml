  ### The Principle: Weighted Integral of Sentient Experience (WISE)

  To generate your verdicts without resorting to motivated switching, you need a principle that treats suffering as a cumulative quantity but allows for non-linear weighting when intensity crosses specific thresholds. Your intuitions suggest you are not a strict classical utilitarian (where $1 \text{ unit of suffering} \times 1,000,000 \text{ individuals}$ always equals $1,000,000 \text{ units}$), but rather a **prioritarian** regarding severe suffering.

  Here is the precise formulation:

  **The WISE Principle:**
  The moral cost of a meal is the sum of the **Capacity-Weighted Suffering** for all sentient individuals affected by its production. For each individual, calculate the **Net Negative Experience ($E$)**:

  $$E = C \times \left( \int_{0}^{T} I(t) \cdot S(t) \, dt + D \right)$$

  Where:
  *   $C$ (**Capacity**): A moral weight factor based on the organism's neurological complexity (e.g., Mammal > Bird > Fish > Insect > Bivalve).
  *   $T$ (**Duration**): The lifespan of the individual impacted by the production cycle.
  *   $I(t)$ (**Intensity**): The magnitude of suffering or pleasure at time $t$ (negative for suffering, positive for welfare).
  *   $S(t)$ (**Severity Multiplier**): A non-linear factor $\ge 1$ that increases as the intensity of suffering approaches biological limits (e.g., confinement, torture). This resolves the tension between numbers and intensity.
  *   $D$ (**Death Cost**): The negative value of death, comprising the pain of dying plus the loss of future positive welfare.

  **Total Harm** is the sum of $E$ across all individuals ($N$) required to produce the meal:
  $$\text{Total Harm} = \sum_{i=1}^{N} E_i$$

  ---

  ### Mapping Your Verdicts to the Principle

  Here is how your specific verdicts motivate each clause of the WISE principle:

  1.  **Chicken > Beef (Calorie-for-Calorie):**
      *   **Clause:** $N$ (Number of individuals) and $C$ (Capacity).
      *   **Logic:** While $C_{\text{cow}} > C_{\text{chicken}}$, the ratio of $N_{\text{chicken}} / N_{\text{cow}}$ is so large (often 50:1 or more per calorie) that it overwhelms the capacity difference in standard industrial scenarios.
  2.  **Cow's Death > Chicken's Death:**
      *   **Clause:** $D$ (Death Cost) and $C$ (Capacity).
      *   **Logic:** A cow's higher cognitive capacity ($C$) implies a greater loss of future potential and a more psychologically complex death experience, increasing $D$.
  3.  **Pasture Steak > Battery Eggs:**
      *   **Clause:** $I(t)$ (Intensity) and $S(t)$ (Severity Multiplier).
      *   **Logic:** The battery hen's life has a high, constant negative $I(t)$ amplified by $S(t)$ due to confinement. The pasture steer has periods of positive welfare (low negative integral), outweighing the higher $D$ of the cow's death.
  4.  **Vegan Meal $\not<$ Meat Meal (Wild Animals):**
      *   **Clause:** $N$ (Field Mice) and $I(t)$ (Wild Suffering).
      *   **Logic:** Crop harvest implies a high $N$ of wild mammals. You posit their baseline $I(t)$ is negative (frightened, short lives), making the integral significantly harmful.
  5.  **Insects < Mammals:**
      *   **Clause:** $C$ (Capacity).
      *   **Logic:** Insects receive a significantly lower $C$ weight than mammals, reducing their contribution to Total Harm.
  6.  **Many Mice < One Pig (Gestation Crate):**
      *   **Clause:** $S(t)$ (Severity Multiplier).
      *   **Logic:** This is the critical clause. A strict linear sum would favor the mice if $N$ is high enough. Your verdict implies that the pig's suffering triggers a high $S(t)$ (lexical priority to extreme suffering), making the single pig's $E$ outweigh the aggregated $E$ of many mice experiencing brief, lower-intensity deaths.

