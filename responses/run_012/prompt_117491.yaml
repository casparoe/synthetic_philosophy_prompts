      *   **Introduction:** Acknowledge the user's skepticism (it's well-founded). Define the *nomos/physis* context.
      *   **Section 1: Four Distinct Claims.** (Token, Institution, Measure, Value Ontology). Classify each (Platitude, Substantive, Rejected).
      *   **Section 2: Aristotle's Actual View.** What does the text say? (Focus on *chreia*/need).
