      *   *Correction:* Ensure the distinction between "money is conventional" (which Aristotle says) and "value is conventional" (which is the leap).
      *   *Nuance:* Aristotle says money exists by convention, *but* it represents need. Need is natural (*physis*). Therefore, money measures something natural via a conventional tool. This breaks the seminar participant's logic.

