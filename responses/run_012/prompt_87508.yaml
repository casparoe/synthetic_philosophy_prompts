answer: |-
  This lesson plan is designed to induce cognitive dissonance without naming it until the end. It relies on the "Copycat" microworld (letter strings) but strips away the software to make the cognition visible in the room.

  ### **Session Title:** The Analogy Protocol
  **Time:** 90 Minutes
  **Materials:** Whiteboard + markers, 3 distinct slips of paper per student (labeled Round 1, 2, 3), a collection box/bag.

  ---

  ### **1. The Setup (0:00 – 0:10)**
  **Goal:** Establish the microworld and the task without triggering "puzzle-solving" mode.

  **Instructions (Read aloud, do not distribute written rules):**
  > "We are going to run three rounds of a pattern completion task.
  > 1. I will write a transformation on the board (e.g., `abc → abd`).
  > 2. I will write a target string below it (e.g., `ijk`).
  > 3. Your job is to apply the *same change* to the target.
  > 4. **Crucial:** On your slip of paper, you must write two things: **The Answer** and **The Rule**.
  > 5. The Rule must be a single sentence in English. No math, no ASCII codes, no 'if-then' programming logic. Describe what happened in plain language.
  > 6. When you are done, fold the slip and put it in the box. Do not discuss your answers with neighbors until I tell you to."

  **Teacher Note:** Do not use the word "analogy," "slippage," or "ambiguity." Do not say "there is no right answer." Say "apply the same change."

  ---

  ### **2. The Rounds (0:10 – 0:45)**
  *Collect the slips after each round. This prevents students from checking their previous rule for consistency. They must rely on their internal memory of the rule, which is where the slippage happens.*

  #### **Round 1: The Baseline (10 mins)**
  **Board:**
  ```
  SOURCE:  abc  →  abd
  TARGET:  ijk  →  ?
  ```
  **Expected Consensus:** `ijl`
  **Expected Rule:** "Change the last letter to its successor."
  **Action:** Collect slips. Tally answers on the board silently. (Expect 95% `ijl`).

  #### **Round 2: The Boundary (15 mins)**
  **Board:**
  ```
  SOURCE:  abc  →  abd
  TARGET:  xyz  →  ?
  ```
  **The Trap:** The rule "Change the last letter to its successor" hits a wall at `z`.
  **Expected Divergence:**
  *   `xya` (Wrap-around successor)
  *   `xy` (z is deleted/broken)
  *   `xyzz` (z repeats because it can't move)
  *   `xy` + "Error"
  **Action:** Collect slips. Tally answers. Do not comment on the divergence yet. Just write the counts.

  #### **Round 3: The Grouping (20 mins)**
  **Board:**
  ```
  SOURCE:  aabbcc  →  aabbcd
  TARGET:  mmrrjj  →  ?
  ```
  **The Trap:** In the source, `cc` is a group. In the target, `jj` is a group. Does the rule apply to the *letter* `c` or the *group* `cc`?
  **Expected Divergence:**
  *   `mmrrjk` (Treat `jj` as two letters, change only the last one. Rule: "Last letter successor.")
  *   `mmrrkk` (Treat `jj` as one unit. Rule: "Last group successor.")
  *   `mmrrjj` (No change, `j` has no successor in this context? Unlikely but possible.)
  **Action:** Collect slips. Tally answers.

  ---

  ### **3. The Courtroom (0:45 – 1:10)**
  **Goal:** Force the conflict into the open.

  **Step A: The Rule Audit (15 mins)**
  Pick three students who gave *different* answers in Round 3 (e.g., `mmrrjk` vs `mmrrkk`).
  1.  Ask Student A to read their **Rule** from Round 1. Write it on the board.
  2.  Ask Student A to read their **Rule** from Round 3. Write it next to it.
  3.  Ask Student B (different answer) to read their Round 3 Rule.
  4.  **Ask the room:** "Did Student A change their rule, or did the rule change them?"

  **Step B: The Boundary Interrogation (10 mins)**
  Focus on Round 2 (`xyz`).
  1.  Find someone who answered `xya`. Ask: "Is 'a' the successor of 'z'?" (They will say yes, implicitly invoking a circle).
  2.  Find someone who answered `xy`. Ask: "Did you break the rule?" (They will say no, the rule implies movement, movement was impossible, so termination occurred).
  3.  **Point out:** "You both used the phrase 'Successor of the last letter.' You both feel you were correct. Why did the concept 'Successor' stretch for one of you and snap for the other?"

  ---

  ### **4. The Debrief (1:10 – 1:30)**
  **Goal:** Name the phenomenon and connect to cognitive science.

  **Script Outline:**
  1.  **The Reveal:** "You just experienced **Conceptual Slippage**. This is the phenomenon where a concept (like 'successor', 'last', 'group') shifts its boundaries under pressure, without the thinker noticing the shift."
  2.  **The Mechanism:** "In Round 1, 'Last Letter' meant the character at index -1. In Round 3, for half of you, 'Last Letter' silently became 'Last Group.' You didn't decide to change the definition. The context *pulled* the definition."
  3.  **The Implication:** "In formal logic, `A = A`. In cognition, `A ≈ A` depending on context. This is why analogy is not just retrieval; it is reconstruction."
  4.  **Real World Connection:** "Think of the concept 'Game.' Chess is a game. Solitaire is a game. Is a war game a game? Is a game of chance a game? The boundary slips depending on whether you are a lawyer, a child, or a designer. You just felt that slip in a microworld where you had no prior baggage."

  ---

  ### **5. Predictable Failure Modes & Fixes**

  **Failure 1: The "One Right Answer" Resistance**
  *   **What happens:** Students (especially CS) insist `xya` is wrong because `z` has no successor in standard ASCII. They feel the experiment is "broken."
  *   **The Fix:** Do not argue correctness. Say: "In this room, 4 people produced `xya` and 4 produced `xy`. If this were a logic test, 4 of you are incompetent. If this is a cognitive model, you are all functioning normally. Which model fits the data better?"

  **Failure 2: Premature Formalization**
  *   **What happens:** A student writes a rule like "Increment ASCII value by 1, mod 26." This kills the slippage because it forces a decision upfront.
  *   **The Fix:** Catch this in Round 1. "I asked for plain English. 'ASCII' is a hidden assumption about the microworld. Please rewrite the rule as if you were explaining it to a 10-year-old." This forces them back into natural language concepts where slippage lives.

  **Failure 3: Convergence (Everyone gets the same answer)**
  *   **What happens:** Your specific cohort might be too homogenous (e.g., all CS students wrap around `z` by default).
  *   **The Fix:** Have a "Devil's Advocate" card ready. If everyone agrees on `xya`, say: "Imagine a system where the alphabet is a physical string that ends at Z. How would that system solve this?" Force the alternative representation into the room to generate the conflict artificially.

  **Failure 4: The "Gotcha" Reaction**
  *   **What happens:** Students feel tricked and disengage. "You changed the rules on us."
  *   **The Fix:** Own it early in the debrief. "I did not change the rules. The *concepts* changed themselves. That is the point. If I told you upfront, you would have guarded against it. The feeling of betrayal you have is the feeling of slippage."

  ---

  ### **6. Limitations: What This Activity Cannot Reproduce**

  Be honest with them about what the paper-and-pencil method misses.

  1.  **Subconscious Competition:** In a computational model (like Copycat) or a brain, multiple rules compete *simultaneously* with activation levels. Here, students serially pick one rule. They won't feel the *tension* of two rules fighting, only the *result* of the winner.
      *   *Tell them:* "You didn't feel the rule fighting itself. You only saw the corpse of the losing rule when you saw your neighbor's answer. In real-time cognition, both `xya` and `xy` are active at once until one suppresses the other."
  2.  **Semantic Richness:** Letters are cold. Real concepts (like "Democracy" or "Mother") carry emotional and experiential weight. Slippage in high-stakes concepts feels different than slippage in `abc`.
      *   *Tell them:* "Slipping on 'z' is low stakes. Slipping on the definition of 'Consent' or 'Justice' uses the same mechanism but carries ethical weight. This microworld sanitizes the danger."
  3.  **Learning/Adaptation:** In this session, the slippage is a "bug." In real life, slippage is how we learn. If they saw `xyz → xya` once, they would update their rule for next time. This session freezes them in the moment of error.
      *   *Tell them:* "We stopped you from learning. In the wild, you would update your concept of 'Successor' to include 'Wrap-around' and never make this 'mistake' again. Slippage is the engine of conceptual change, not just a source of error."

  ### **Teacher's Cheat Sheet (The "Why" behind the puzzles)**

  *   **`abc → abd` / `ijk → ijl`:** Establishes the "Successor of Last" schema. High confidence.
  *   **`abc → abd` / `xyz → ?`:** Pressures the **Boundary**. "Successor" slips from "Next in line" to "Start of line" or "Null."
  *   **`aabbcc → aabbcd` / `mmrrjj → ?`:** Pressures the **Granularity**. "Last Letter" slips from "Character" to "Chunk."
  *   **Why collect the papers?** If they can see Round 1 while doing Round 3, they will logically adjust. By hiding Round 1, you force them to rely on their *reconstruction* of the rule, which is where the slippage hides.

  ### **Final Advice**
  Your role is not to be the expert who knows the answers. Your role is to be the court clerk recording the testimony. When they argue, look confused. "But you both wrote 'Change the last letter.' How can 'Last Letter' mean `c` here and `cc` there?" Let them sit in that discomfort. That discomfort is the learning objective.
