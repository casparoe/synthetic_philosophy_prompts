          1.  Show `abc -> abd`. Ask for rule.
          2.  Apply rule to `ijk`.
          3.  Apply rule to `xyz`.
          4.  Apply rule to `aabbcc`.
          5.  Compare rules written down.

      *   *Actually, the "Commitment" trick is better.*
      *   Step 1: Solve `abc -> abd`, therefore `ijk -> ?`. Write Answer + Rule.
      *   Step 2: Solve `abc -> abd`, therefore `xyz -> ?`. Write Answer + Rule.
      *   Step 3: Compare rules. Did the rule text change?
      *   Step 4: Solve `aabbcc -> aabbcd`, therefore `ppqqrr -> ?`.
      *   Step 5: Compare.

      *   *Wait, I want them to feel the slippage mid-stream.*
      *   Let's create a worksheet with 4 problems. They solve them sequentially.
      *   Problem 1: `abc -> abd`. Apply to `mno`.
      *   Problem 2: `abc -> abd`. Apply to `xyz`.
      *   Problem 3: `aabbcc -> aabbcd`. Apply to `ppqqrr`.
      *   Problem 4: `abc -> abd`. Apply to `cba`. (Direction slippage).

      *   *Okay, let's finalize the specific puzzles.*
      *   To maximize conflict, I need the "Grouping" slippage to be the main event.
      *   Puzzle A: `efg -> efh`. Target: `uvw`. (Easy successor).
      *   Puzzle B: `efg -> efh`. Target: `xyz`. (Boundary).
      *   Puzzle C: `eeffgg -> eeffgh`. Target: `rrssuu`. (Grouping).
      *   *Wait, `uu` successor is `v`.* `rrssvv`. But if `uu` is a group, do we change the group?
      *   Let's use the `pmm -> pmn` idea. `pmm` (p, m, m). Change last letter. `pmn`.
      *   Target `zzz`. `zza`? `zz`? `aaa`?
      *   Target `ddd`. `dde`? Or `eee` (change the group)?

      *   *Okay, I have a solid plan.* I will structure it as "The Analogy Protocol."
      *   I will withhold the term "Conceptual Slippage" until the end.
      *   I will focus heavily on the *Rule Description* they write down. That's where the slippage becomes visible.

  9.  **Addressing the "What will go wrong" section:**
      *   Students want the "Right Answer." I need to manage this anxiety.
      *   CS students will want to formalize too early.
      *   Phil students will argue semantics.
      *   Psych students will look for the experiment trick.
      *   I need to act as a neutral facilitator, not a judge.

  10. **Addressing "What this can't reproduce":**
      *   Real-time neural competition.
      *   The feeling of *surprise* (they expect it now).
      *   The role of prior semantic knowledge (letters are abstract, real concepts have baggage).

  11. **Final Review against constraints:**
      *   90 mins? Yes.
      *   14 people? Yes, small group discussion works.
      *   No laptops? Yes, paper/whiteboard.
      *   Feel, not hear? Yes, by forcing commitment then revealing conflict.

      *(Self-Correction during drafting)*: Make sure the instructions explicitly ask them to write the *rule in English*. If they just write the answer, the slippage is hidden. The slippage is in the *description* of the rule staying the same while the application changes, OR the description changing to accommodate the application. I want them to notice that "Last Letter" means different things in different contexts.

      *Revised Plan for Maximum Impact:*
      1.  Handout Part 1: `abc -> abd`. Apply to `ijk`. Write Rule.
      2.  Handout Part 2: `abc -> abd`. Apply to `xyz`. Write Rule.
      3.  Handout Part 3: `aabbcc -> aabbcd`. Apply to `mmrrjj`. Write Rule.
      4.  Collect & Tally.
      5.  Reveal divergence.
      6.  Discuss.

      *Wait, one more thing:* The prompt asks for "the moment halfway through a small task... the next item comes along and the very same rule now reads as a different rule."
      To capture this *live*, I should present the problems one by one on the board, not on a handout they can look back at. This prevents them from checking consistency. They must rely on their *memory* of the rule they just formulated.
      *Decision:* Use Board for Problems, Paper for Answers/Rules. Collect paper after each round. This prevents back-tracking.

      *Let's refine the "Failure" section.*
      Common failure: Everyone agrees.
      Fix: I need to ensure the puzzles *actually* produce divergence. `xyz` is good for boundary. `mmrrjj` is good for grouping. `cba` is good for direction. I will include all three.

