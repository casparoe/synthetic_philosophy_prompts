prompt: |-
  I'm putting together a seminar session on Anscombe's pamphlet against Oxford handing Truman that honorary degree, and I've managed to confuse myself. Here's my reading — tell me where it goes wrong. Her objection to the bombings was, I assumed, basically a proportionality complaint: the thing killed a colossal number of civilians and no military gain could justify that, so it was a disproportionate act and therefore a war crime — the standard jus in bello charge you'd level at anyone. Fine, fair enough. But now the trouble starts. She wasn't a pacifist; she thought taking up arms against Hitler was justified (she even says the persecution of the Jews would have been a reasonable cause of war). And the Allies were burning cities and killing civilians by the hundred thousand well before Hiroshima. So on her own cost-benefit logic she's got to either condemn the entire Allied war effort or admit the bomb was just a bigger, faster version of what everyone was already doing. And if she's happy to run the arithmetic in the bomb case, why does she suddenly turn absolutist about 'intrinsically evil acts' in her other work? I know she says something about intending an innocent's death versus merely foreseeing it, but I can't see how that rescues her — isn't that just Catholic hand-waving to dodge the sums? I suspect there's one distinction doing all the heavy lifting here and I'm missing it. Can you spell out the actual structure of her arguement, and tell me whether the inconsistency I think I'm seeing is real or whether I've built it out of a premise she'd flatly reject?
