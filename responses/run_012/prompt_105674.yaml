answer: |-
  You have stumbled onto one of the most common misreadings of *Mr. Truman's Degree*, but it is a very productive confusion. You have identified the exact pressure points where modern consequentialist intuition clashes with Anscombe's deontological ethics.

  The short answer is: **Your perceived inconsistency is real, but it exists in your reconstruction of her argument, not in her actual text.** You are reading her as a utilitarian who got cold feet about the numbers; she is writing as an absolutist who rejects the calculus entirely.

  Here is the breakdown of where your reading goes wrong, the actual structure of her argument, and why she thinks the "intention" distinction is doing real philosophical work rather than "Catholic hand-waving."

  ### 1. The Core Misunderstanding: Proportionality vs. Prohibition

  **Your premise:** "Her objection... was basically a proportionality complaint... no military gain could justify that."
  **Anscombe's position:** This is the critical error. Anscombe does **not** argue that the bomb was wrong because the cost was too high relative to the benefit. She argues that the act was **intrinsically evil**, regardless of the benefit.

  For Anscombe, the massacre of the innocent is a *malum in se* (evil in itself). It belongs to a class of actions that are forbidden absolutely. In her view, you cannot put "murdering 100,000 civilians" on one side of a scale and "ending the war sooner" on the other. The moment you engage in that calculation, you have already accepted a utilitarian framework that she rejects.

  If her argument were purely about proportionality, you would be right: she would have to condemn Dresden (which she does) but might theoretically accept a "smaller" tactical nuke against a fleet. But her argument is that **targeting civilians is forbidden, period.**

  ### 2. The Consistency Check: Conventional Bombing

  **Your premise:** "The Allies were burning cities... well before Hiroshima. So on her own cost-benefit logic she's got to either condemn the entire Allied war effort or admit the bomb was just a bigger, faster version."
  **Anscombe's position:** She chooses the first option. **She condemns the entire Allied area-bombing policy.**

  Anscombe is perfectly consistent here. In *Mr. Truman's Degree*, she explicitly links Hiroshima to the firebombing of Dresden and Tokyo. She views the atomic bomb not as a unique moral anomaly, but as the *reductio ad absurdum* of the Allied policy of "area bombing" (targeting cities to break civilian morale).

  She writes:
  > *"It is not that the atomic bomb is worse than the ordinary bomb. It is that the ordinary bomb has been used in a way that is just as bad."*

  She is not singling out Truman because he used a nuke; she is singling him out because he is the specific individual who authorized the explicit intention to massacre civilians on a massive scale, and Oxford was proposing to honor *him* specifically. But morally, the pilots at Dresden were committing the same category of sin. She is not a hypocrite; she is a rigorous critic of Allied conduct throughout the war.

  ### 3. The Heavy Lifter: Intention vs. Foreseeability

  **Your premise:** "I know she says something about intending an innocent's death versus merely foreseeing it, but I can't see how that rescues her — isn't that just Catholic hand-waving to dodge the sums?"

  This is the Doctrine of Double Effect (DDE), and it is the engine of her argument. To a modern ear, it often sounds like a loophole ("I didn't *mean* to kill them, I just meant to blow up the building they were in!"). But for Anscombe, this is not about psychological states or inner feelings; it is about the **description of the action.**

  Here is how she distinguishes them:

  1.  **Intended Means:** If your plan for victory *requires* the civilians to die (or their homes to be destroyed) to achieve the goal (e.g., breaking morale, forcing surrender), then you **intend** their death. It is part of the means.
  2.  **Merely Foreseen:** If your plan is to destroy a munitions factory, and you take all reasonable precautions, but civilians living next door die anyway, their death is **foreseen** but not **intended**. Their death does not help your plan; it is a tragic side effect of a legitimate military act.

  **Why this isn't hand-waving for Anscombe:**
  Anscombe argues that "intention" defines *what act you are performing*.
  *   If I poison my uncle to get his inheritance, I am performing the act of "murdering my uncle," even if I also happen to be "administering medicine" that he needed.
  *   If Truman drops a bomb *to kill the civilians* to force surrender, he is performing the act of "massacring innocents."
  *   If a pilot drops a bomb on a munitions factory and civilians die, he is performing the act of "destroying military infrastructure," tragically accompanied by civilian death.

  For Anscombe, the moral law prohibits certain *descriptions of actions* (e.g., "murdering the innocent"). It does not prohibit "actions that result in death." Therefore, the distinction is metaphysical, not just psychological. It determines the *kind* of thing you did.

  ### 4. Why She Isn't a Pacifist

  **Your premise:** "She wasn't a pacifist... she thought taking up arms against Hitler was justified."
  **Anscombe's position:** This is standard Just War Theory (*jus in bello*).

  You can fight a war without targeting non-combatants. Anscombe believes soldiers are legitimate targets because they are engaged in unjust aggression (or just aggression, depending on the side). Civilians are not. Therefore, a war can be justly fought (against Hitler) while specific acts within that war (bombing cities) are unjust.

  The inconsistency you sense ("If killing civilians is wrong, how is war not wrong?") dissolves if you accept the combatant/non-combatant distinction. Anscombe accepts this distinction. The atomic bomb blurred it; Anscombe is trying to sharpen it again.

  ### 5. Summary of the Argument Structure

  If you are presenting this in a seminar, here is the logical flow you should present to correct the reading:

  1.  **Major Premise:** It is absolutely forbidden to intentionally kill the innocent (non-combatants), regardless of the consequences. (Deontological Absolutism).
  2.  **Minor Premise:** The bombing of Hiroshima and Nagasaki involved the intentional killing of innocents as a means to force surrender (not merely as a side effect of hitting military targets).
  3.  **Conclusion:** Therefore, the bombing was an act of murder/massacre, and Truman is a murderer.
  4.  **Corollary:** The same logic applies to Dresden and Tokyo. The atomic bomb is not unique in *kind*, only in *efficiency*.
  5.  **Rejection of Counter-argument:** The claim that "it saved lives in the long run" is irrelevant because one may not do evil that good may come (Romans 3:8, though she argues this philosophically, not just theologically).

  ### 6. Addressing the "Hand-Waving" Charge in Seminar

  Your students (or you) will likely push back on the Intention distinction. It is worth acknowledging that this is the most contested part of her philosophy.

  *   **The Critique:** Critics (like consequentialists) argue that if you know civilians will die, you are responsible for their death regardless of whether it was your "aim." The distinction seems to let agents off the hook for foreseeable consequences.
  *   **Anscombe's Defense:** She would argue that without this distinction, *all* war is impossible (because civilians always die), or *all* restraint is meaningless. If I can't distinguish between aiming at a school and aiming at a tank next to a school, then morality has no grip on military conduct. The distinction preserves the possibility of moral conduct in war.

  ### Verdict on Your Confusion

  You built the inconsistency out of a premise she flatly rejects: **that the morality of the act depends on the cost-benefit analysis (proportionality).**

  Once you swap that premise for her actual premise (**that the morality of the act depends on the intentional structure of the action**), the inconsistency vanishes. She condemns the bomb, she condemns Dresden, she supports the war against Hitler, and she rejects utilitarianism. It is a tight, hard, absolutist system. It may not be a system you agree with, but it is not self-contradictory.

  **Seminar Tip:** If you want to spark debate, don't ask if she was inconsistent. Ask if her definition of "intention" holds up. Ask: *"If Truman knew 100% that civilians would die, does his internal 'aim' actually change the moral reality of the corpses?"* That is where the real philosophical fight lies.
