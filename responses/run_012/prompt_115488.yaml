answer: |-
  ### The Decision Procedure

  **Instructions:** Answer each question in order. Do not skip ahead. If you reach a **STOP**, do not move the money or make the offer. If you reach **HAND-OFF**, escalate to the Ethics Panel immediately with a written justification.

  1.  **Recipient:** Is the recipient a public official or a partner with authority over our permits, access, or hiring?
      *   **No:** Follow standard HR or expense policy. **STOP.**
      *   **Yes:** Go to 2.

  2.  **Entitlement:** Is the action they are taking something they are legally or contractually required to do without this payment?
      *   **No:** (e.g., awarding a contract, hiring). Go to 3.
      *   **Yes:** (e.g., processing customs, signing permits). Go to 3.

  3.  **Conditionality:** Is the value (money, gift, job) conditional on the speed, outcome, or continuation of their action?
      *   **No:** (e.g., unconditional charitable donation). Go to 4.
      *   **Yes:** (e.g., fee to release goods, gift to keep permits). Go to 5.

  4.  **Disclosure:** Can we record this transfer openly in our books as "Gift" or "Donation" without legal or reputational risk?
      *   **Yes:** **YES.** (Proceed with documentation).
      *   **No:** Go to 5.

  5.  **Existential Duress:** Will refusing this transfer *immediately* halt life-saving services with no viable alternative?
      *   **No:** (e.g., delay, inconvenience, relationship strain). **STOP (NO).**
      *   **Yes:** (e.g., patients denied medicine, clinic closed). **HAND-OFF.**

  ***

  ### Philosophical Distinctions: Keep vs. Drop

  To fit a thirty-minute checklist, you must strip the theory down to its load-bearing beams.

  **Keep:**
  *   **Publicity (The Sunlight Test):** This survives because it bypasses intent. It doesn't matter if the director *feels* corrupt; it matters if the transaction withstands public scrutiny. This handles the "cultural norm" defense. If a norm cannot be published, it is not a norm we can adopt.
  *   **Ministerial vs. Discretionary (Entitlement):** This distinguishes between buying what is owed (customs) and buying favor (contracts). Both are problematic under your strict code, but the moral weight differs, which matters for the "Duress" exception.
  *   **Quid Pro Quo (Conditionality):** This is the core of corruption. If the value is linked to the act, it is an exchange of influence. This catches the wedding envelope (implicit condition) and the customs fee (explicit condition).

  **Drop:**
  *   **Intent/Mens Rea:** Do not ask directors to judge whether the official is "greedy" or "pressured." Judge the structure of the transaction.
  *   **Cultural Relativism:** Do not ask "Is this acceptable here?" Ask "Is this acceptable for *us*?" The code is universal; local context only matters for the Duress exception.
  *   **Collective Action Equilibrium:** Directors cannot solve systemic corruption alone. The procedure acknowledges this by handing off existential cases rather than forcing a heroic "No" that shuts down clinics.

  ***

  ### Case Runs

  **1. The Wedding (Gift/Envelope)**
  *   **Recipient:** Yes (Health Officer).
  *   **Entitlement:** N/A (Social event), treat as No (not legally required).
  *   **Conditionality:** Yes (Implicitly expected for continued permits).
  *   **Disclosure:** No (Envelope cash is rarely recorded openly).
  *   **Duress:** No (Relationship strain is not life-saving halt).
  *   **Result:** **STOP (NO).**
  *   **Director Reaction:** Unpopular. Directors fear losing access. This procedure forces them to burn social capital to maintain integrity.

  **2. The Nephew (Hiring)**
  *   **Recipient:** Yes (Regional Director has authority over hiring approval).
  *   **Entitlement:** No (Hiring is discretionary).
  *   **Conditionality:** Yes (Job linked to family connection).
  *   **Disclosure:** No (Conflict of interest usually hidden).
  *   **Duress:** No (Other drivers exist).
  *   **Result:** **STOP (NO).**
  *   **Director Reaction:** Unpopular if the nephew is truly the best candidate, but the procedure prioritizes procedural integrity over meritocratic outcomes when influence is involved.

  **3. The Customs Fee (Facilitation)**
  *   **Recipient:** Yes (Customs Official).
  *   **Entitlement:** Yes (Clearance is required by law).
  *   **Conditionality:** Yes (Fee linked to speed/release).
  *   **Disclosure:** No (Unofficial fee).
  *   **Duress:** Yes (Drug supply chain halted).
  *   **Result:** **HAND-OFF.**
  *   **Director Reaction:** Frustrating. They want to pay now. The procedure forces escalation because this violates the code, but acknowledges the moral cost of refusing is too high for a field director to bear alone.

  ***

  ### Where It Misfires

  **Confident but Wrong:**
  The procedure will confidently say **NO** to small "survival taxes" that don't meet the "Existential Duress" threshold (e.g., a delay that costs money but not lives). In a captured state, these accumulate to make operations impossible. The procedure treats integrity as binary, but corruption is often a slow suffocation.

  **Stalls:**
  The **Existential Duress** question is the weak point. Directors will classify every delay as "life-saving" to bypass the Stop. Conversely, Panel members may doubt the urgency.
  *   **Fix:** When stalled on Duress, the Director must document the specific patient impact (e.g., "X doses delayed for Y days") rather than general operational harm.

  **The "Hand-Off" Trap:**
  If every customs issue becomes a Hand-Off, the Panel becomes a bottleneck.
  *   **Fix:** If the Panel consistently approves the same type of Duress case (e.g., customs in Country X), they must issue a standing waiver or withdraw from that region. The procedure is for exceptions, not policy.

