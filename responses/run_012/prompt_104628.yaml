prompt: |-
  So a friend of mine and I have been going back and forth for months now about testimony — you know, the fact that almost everything we know, we know because somebody told us — and we finally figured out that she's a reductionist and I'm an anti-reductionist and we're basically talking passed each other. Her line is that testimonial justification has to be earned: a hearer needs positive reasons to trust a given speaker, and in the end the whole edifice has to rest on observation and inference, so testimony isn't a source of knowledge the way perception is — it's a shortcut that always has to be cashed out. My line is that taking someone's word is a basic entitlement, on par with trusting your own eyes, and the burden sits on defeaters rather than on the hearer. What I want from you is the document we should have written instead of having the same shouting match a fourth time: an adversarial-collaboration joint statement that both of us could actually sign. Start with a numbered section of claims we both accept — about what the dispute is even a dispute about, about the developmental facts we agree on (kids believe what they're told long before they can check anything), and about what the reductionist is *not* committed to, so we stop scoring points off strawmen — and then a disagreements table where each row is one precise point of disagreement, each one phrased the way that side would want its own view stated.

  Please don't give me the textbook version, reductionism versus non-reductionism at the level of a lecture slide; I want it in the weeds. Two things I suspect are doing a lot of hidden work and want you to take seriously: first, whether we're really disagreeing about the order of justification or the order of acquisition — I have a feeling that a lot of the received wisdom about Hume being a reductionist is really about the causal or developmental story, not the epistemic one, and if that's right it changes what's even at stake; and second, whether either of us can stay neutral once you ask about AI systems, since a chatbot is a source of information with no speaker behind it in the usual sense, no intentions to be trustworthy or untrustworthy and no skin in the game, and I honestly don't know which way each of us is forced to go there, but I think both of us have to say something. For each row, also give the crux — the sub-question that, if it got settled, would actually move one of us — plus a concrete case or argument that both sides would agree bears on that crux, with each side's prediction written down. If you think part of our fight is really just a verbal dispute, say, over internalist versus externalist uses of justification, then say which part and why. And tell me how confident you are in the whole thing, and single out the one bit you're least sure about.
