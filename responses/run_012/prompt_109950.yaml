answer: |-
  This is a rigorous stress test of a position that sits at the intersection of Functional Decision Theory (FDT), Timeless Decision Theory (TDT), and Parfitian "Superrationality." You are asking for the vulnerability map of the claim that *logical/evidential correlation suffices for rational cooperation, absent causal leverage.*

  Below is the exposure map, sorted by the severity of the threat to your position. I have distinguished between objections that critics raise but defenders typically dismiss, and those that defenders must concede or which threaten to collapse the view entirely.

  ### I. Fatal Defeaters (Theoretical Collapse)

  These arguments attack the internal coherence of the view or the mathematical viability of the calculus you propose.

  **1. The Smoking Lesion Problem (Spurious Correlation)**
  *   **The Argument:** Standard Evidential Decision Theory (EDT) is widely considered refuted by the "Smoking Lesion" case. An agent has a lesion that causes both a desire to smoke and cancer. Smoking is *evidence* of cancer, but does not cause it. EDT says "Don't smoke" (to avoid the evidence of cancer). This is irrational; you should smoke if you enjoy it, since your choice doesn't affect the cancer.
  *   **Application to You:** You claim cooperation is rational because your choice is *evidence* of theirs. But what if the correlation is spurious? What if a common cause (e.g., a specific cultural upbringing) makes us both cooperative, but my choice *now* does not logically determine yours? If you cannot distinguish between *logical correlation* (we run the same algorithm) and *statistical correlation* (we share a common cause), your view licenses refusing to smoke in the Lesion case.
  *   **Defender Concession:** A sophisticated defender (FDT/TDT) **concedes** this point. They must refine your premise: it is not *any* evidential correlation that matters, but specifically *counterfactually robust logical correlation*. My choice must be the output of the same *function* as theirs.
  *   **Verdict:** If you mean *statistical* evidence, this is fatal. If you mean *logical* similarity, you survive this, but you have narrowed your premise significantly. You are no longer defending "evidence" generally, but "logical identity."

  **2. The Measure Problem (Infinite Populations)**
  *   **The Argument:** You rely on the arithmetic of "local cost vs. vast distant gain." This requires summing utilities over a population of correlated agents. If the universe is infinite (eternal inflation, multiverse), the number of correlated agents may be infinite.
  *   **The Exposure:** Standard arithmetic breaks down. $\infty - \text{local cost} = \infty$. You cannot compare two infinite outcomes to determine which is better. Furthermore, without a well-defined measure over "instances of me," you cannot calculate the expected value. Is a copy of me in a simulation weighted less than a copy in base reality?
  *   **Defender Concession:** Defenders **concede** this is an open, unsolved problem. There is no consensus on how to do decision theory with infinite populations.
  *   **Verdict:** This does not refute the theory in finite cases, but it renders the theory silent or incoherent in the cosmological scenarios you rely on for the "vast gain" premise. It limits the scope of your view to finite or measure-bounded universes.

  **3. Anti-Correlation and Adversarial Logic**
  *   **The Argument:** You assume correlation runs in your favor (I cooperate $\rightarrow$ they cooperate). But what if the other agents run an algorithm designed to do the *opposite* of what a "cooperator" does? Or what if you are in a population where 50% mirror you and 50% anti-mirror you?
  *   **The Exposure:** If you cannot identify *ex ante* which group you are correlated with, your expected utility calculation averages out to zero (or negative, if anti-correlated agents exploit you). Your view requires you to know the *direction* of the logical correlation.
  *   **Defender Concession:** Defenders **concede** you need a prior over the types of agents in the universe. You cannot simply assume the universe is filled with "friends."
  *   **Verdict:** This turns your view from a decision theory into a game-theoretic empirical claim. It is not *always* rational to cooperate; it is only rational if you have high confidence the population is dominated by logical mirrors rather than logical adversaries.

  ### II. Serious Objections (Awkward Implications)

  These arguments do not break the logic but force the defender to accept conclusions that are morally or pragmatically alienating.

  **4. The "Betrayal of the Near" (Moral Alienation)**
  *   **The Argument:** You state you are willing to give up things your community cares about for distant correlated agents. Taken seriously, this licenses sacrificing a definite, high-value local good (e.g., saving your child) for a probabilistic, diffuse, distant gain (e.g., slightly increasing the probability of cooperation in $10^{100}$ aliens).
  *   **The Exposure:** This makes the theory action-guiding only at the cost of severing it from human moral psychology. It implies that "rationality" demands a form of cosmopolitan utilitarianism that violates special obligations.
  *   **Defender Concession:** A committed defender **must accept** this. If the math holds, the child is sacrificed.
  *   **Verdict:** This is not a logical defeater, but a *pragmatic* one. If a theory of rationality demands you act like a sociopath toward your loved ones to satisfy a logical equation, critics will argue it is a theory of *logic*, not *rational agency*. It risks defining "rationality" in a way that no human can or should instantiate.

  **5. The Character vs. Choice Collapse**
  *   **The Argument:** You worry whether this collapses into a claim about agent *type*. If my choice is determined by my source code (which is correlated with theirs), then my *deliberation* does not change the output. I am merely discovering what I am.
  *   **The Exposure:** If true, "choosing to cooperate" is a category error. You don't *choose*; you *are* a cooperator. The "ought" disappears, replaced by an "is." The view becomes: "It is good to be the kind of agent that cooperates," which is Virtue Ethics or Rule Utilitarianism, not Decision Theory.
  *   **Defender Concession:** Defenders often **embrace** this. They argue that "deliberation" is the process of running the source code. The "lever" is the code itself, which you can modify over time (self-modification).
  *   **Verdict:** This blurs the line between evaluating *actions* and evaluating *agents*. If you concede this, you lose the claim that cooperation is the rational *choice* in the moment; instead, it is the rational *disposition*. This weakens the claim that you can "decide" to cooperate in a one-off case where you haven't pre-committed.

  ### III. The Screening Off Question

  You asked specifically: *If my counterpart's choice is already fixed by a common cause we share, does my choice still carry information about it?*

  *   **Causal View (CDT):** Yes, it carries information, but that information is **screened off** by the common cause. Once I know the common cause (the physics/algorithm), knowing my choice adds no new information about their choice. Therefore, I should not condition on my choice.
  *   **Your View (FDT/EDT):** The common cause *is* the algorithm. My choice *is* the output of the algorithm. I cannot know the output without running the algorithm (choosing). Therefore, the information is **not** screened off because the choice is the *mechanism* by which the common cause manifests.
  *   **The Vulnerability:** This relies on a specific metaphysics of computation. If one holds that the output is fixed *before* the deliberation (hard determinism), then the deliberation is epiphenomenal. Your view requires a compatibilist stance where "running the calculation" is causally potent in the logical sense.
  *   **Critique:** A critic will say you are conflating *epistemic* access with *causal* leverage. You know more about them when you choose, but you haven't *changed* anything. If rationality is about *steering the future*, your view is steering nothing; it is merely aligning your expectations with a fixed reality.

  ### IV. Convergence and Insulation

  **6. Does it converge with CDT? (The Pre-commitment Argument)**
  *   **The Argument:** CDT proponents argue that if cooperation is beneficial, a CDT agent would *pre-commit* to cooperate before entering the situation. Thus, in the long run, CDT and your view yield the same behavior.
  *   **Your Exposure:** This is true *only if* pre-commitment is possible and cheap. In many "Newcomb-like" problems (e.g., Parfit's Hitchhiker), the opportunity to pre-commit has passed before you make the decision.
  *   **Verdict:** The views **diverge** in cases where binding is impossible. If you claim they converge, you are retreating to a weaker claim: "You should build yourself to be this way," rather than "You should do this now."

  **7. Is the view insulated? (The "Right Kind" of Correlation)**
  *   **The Argument:** You qualify your view: cooperation is required *only when the correlation is of the right kind.*
  *   **The Exposure:** This risks unfalsifiability. If you cooperate and lose, you can claim "They weren't truly correlated." If you defect and win, you claim "The correlation wasn't strong enough."
  *   **Verdict:** This **is a defect** unless you provide an independent criterion for "right kind of correlation" (e.g., source code identity) that does not depend on the outcome. If the criterion is outcome-dependent, the theory is empty. If the criterion is structural (code identity), it is testable but vulnerable to the "Reference Class" problem (how similar must the code be?).

  ### V. Unique Predictions and Risks

  **What your position predicts that rivals do not:**
  1.  **Voting:** CDT says a single vote is causally negligible (unless a tie is probable). Your view says a vote is rational because it is evidence of how all correlated agents vote, swinging the election by a block.
  2.  **One-Shot Prisoner's Dilemma with a Clone:** CDT defects. You cooperate.
  3.  **Transparency:** You should be willing to make your source code public to increase correlation. CDT agents might prefer opacity to hide intentions.

  **The "Wealth" Objection:**
  You said you are unimpressed by the complaint that evidential cooperators do not end up richer.
  *   **Is this a dodge?** Yes, if you claim to be describing *instrumental rationality*. Instrumental rationality is standardly defined as maximizing the satisfaction of one's preferences (often proxied by resources/outcomes). If your strategy systematically yields lower utility in certain possible worlds (e.g., worlds with "Psychopath Buttons" where cooperators are punished simply for being cooperators), then you are not instrumentally rational; you are *morally* committed.
  *   **The Risk:** If you admit you are willing to lose utility to satisfy the "cooperation principle," you have ceased to argue for *rationality* and are arguing for a *moral duty*. This is a significant shift. It means your view is not "This is how you win," but "This is how you be good, even if you lose."

  ### VI. Summary of Exposure

  | Objection | Severity | Defender Response | Status |
  | :--- | :--- | :--- | :--- |
  | **Smoking Lesion (Spurious Correlation)** | **Fatal** (if statistical) | Must switch to Logical Correlation (FDT). | **Conceded** (requires refinement). |
  | **Infinite Measure Problem** | **Fatal** (for cosmology) | No current solution exists. | **Conceded** (limits scope). |
  | **Anti-Correlation** | **Fatal** (if environment hostile) | Requires priors on agent types. | **Conceded** (not universal). |
  | **Screening Off (Common Cause)** | **Serious** | Claims deliberation *is* the causal mechanism logically. | **Disputed** (metaphysical). |
  | **Betrayal of the Near** | **Awkward** | Accepts sacrifice of local for global. | **Accepted** (moral cost). |
  | **Character vs. Choice** | **Awkward** | Deliberation = running code. | **Reframed** (dispositional). |
  | **Convergence with CDT** | **Awkward** | Diverges only when pre-commitment impossible. | **Disputed** (scope of divergence). |
  | **Insulation ("Right Kind")** | **Defect** | Needs structural, not outcome-based, criteria. | **Fixable** (if rigorous). |

  ### Final Verdict on Your Request

  You asked for a case where the position licenses something adherents could not accept, or an argument that the views converge.

  1.  **The Betrayal:** The position licenses sacrificing a high-certainty local good (your community's survival) for a low-certainty, high-volume distant gain (correlated aliens), *even if the correlated aliens cannot reciprocate*. Many adherents of "rational cooperation" are motivated by mutual benefit. If you remove mutual benefit (causal influence) entirely, you are left with **logical altruism**. Many defenders would balk at *actual* self-destruction for the sake of logical consistency with strangers. If you push the math to "give everything," they will retreat to "cooperate only when net positive." This reveals the view is often insulated by a hidden CDT-style constraint: *Cooperate only when the correlated gain outweighs the loss.* If so, it is not a rival to CDT, but CDT with a broader accounting of beneficiaries.

  2.  **The Convergence:** If you admit that you only cooperate when the *expected value* (weighted by correlation probability) is positive, you have effectively adopted CDT with a modified causal graph. You have not escaped causation; you have simply expanded the definition of "cause" to include "logical influence." If "logical influence" cannot be cashed out in terms of expected outcomes, it is mysticism. If it *can* be cashed out in expected outcomes, CDT can mimic it via pre-commitment. The gap is narrower than you claim.

  **Decisive Critique:** The view is not a rival to the ordinary view (CDT) so much as a **moralized revision** of it. It claims that *logical solidarity* is a rational goal. But if that goal leads to systematically lower outcomes in adversarial worlds (which exist), then it is a moral stance, not a decision-theoretic one. If you insist it is decision-theoretic, you must explain why losing is rational. If you cannot, the view collapses into: "Be good, even if it costs you," which is not a theory of rationality, but of virtue.
