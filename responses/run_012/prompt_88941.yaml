answer: |-
  ### Exam Question

  **Question 4 (20 points)**
  Recall that for a binary gamble $G$ yielding $x$ with probability $p$ and $y$ with probability $1-p$ (where $u(x) > u(y)$), the Risk-Weighted Expected Utility (REU) is given by:
  $$REU(G) = u(y) + r(p)[u(x) - u(y)]$$
  This formulation is choice-equivalent to an Expected Utility (EU) maximizer who retains utility function $u$ but holds a distorted belief $p^* = r(p)$. In this binary context, a risk-averse REU agent (convex $r$, where $r(p) \leq p$) is indistinguishable from a pessimistic EU agent.

  However, this equivalence breaks down for gambles with three or more outcomes. In an essay of approximately 700 words, address the following:
  1.  **The Technical Divergence:** Explain precisely how the weighting of probabilities in a three-outcome REU calculation differs from an EU calculation with distorted beliefs. Why does rank-dependence prevent the "pessimistic EU" reduction in this case?
  2.  **The Identification Problem:** Does this technical divergence empirically rescue the claim that $r$ represents a distinctive *risk attitude* rather than a distortion of *belief*? Or is the separation of belief and risk attitude in REU theory merely an axiomatic assertion that cannot be revealed by choice data alone?
  3.  **Context-Dependence:** Briefly discuss how allowing the risk function $r$ to vary with the stake or structure of the act affects the plausibility of interpreting $r$ as a stable psychological trait.

  ***

  ### Model Answer

  The equivalence between Risk-Weighted Expected Utility (REU) and Expected Utility (EU) with distorted beliefs is a local artifact of binary gambles. In the binary case, the weight placed on the better outcome is simply $r(p)$. An EU maximizer with subjective probability $p^* = r(p)$ calculates value identically. However, this reduction fails for gambles with three or more outcomes because REU is rank-dependent, whereas standard EU (even with distorted probabilities applied to events) is not.

  Consider a gamble with outcomes $x_1 > x_2 > x_3$ occurring with probabilities $p_1, p_2, p_3$. In REU theory, the weight assigned to an outcome is determined by the risk function applied to the cumulative probability of receiving *at least* that outcome. The weight on the middle outcome $x_2$ is not $r(p_2)$. Instead, it is the marginal contribution of $x_2$ to the cumulative risk weight: $w_2 = r(p_1 + p_2) - r(p_1)$. The total value is $u(x_3) + w_2[u(x_2) - u(x_3)] + r(p_1)[u(x_1) - u(x_2)]$.

  By contrast, an EU maximizer with distorted beliefs treats probabilities as properties of events. If they distort the probability of the event "outcome is $x_2$" via some function $f(p)$, the weight on $x_2$ would be $f(p_2)$. For the EU agent to match the REU agent's choices across all three-outcome gambles, their distortion function would need to satisfy $f(p_2) = r(p_1 + p_2) - r(p_1)$. This is impossible for a fixed function $f$, because the REU weight on $x_2$ depends on $p_1$ (the probability of the better outcome), while the EU weight depends only on $p_2$. The REU agent cares about the *position* of the outcome in the payoff ranking; the EU agent cares only about the probability of the outcome occurring. Thus, rank-dependence introduces a structural non-linearity that simple belief distortion cannot replicate without violating the additivity of probabilities.

  Does this divergence empirically distinguish risk attitude from belief? The answer is nuanced. Formally, the models generate different choice patterns over ternary gambles (violations of the Sure Thing Principle that cannot be remedied by changing priors). If we observe these specific violations, we can reject the hypothesis that the agent is an EU maximizer with *coherent* distorted beliefs. However, this does not fully rescue the interpretation of $r$ as "risk attitude" rather than "belief." If we allow the "pessimistic" EU agent to hold incoherent beliefs (non-additive probabilities) or beliefs that are partition-dependent (the probability assigned to an event changes depending on how the gamble is described), they can mimic REU choices perfectly.

  Therefore, the separation of belief and risk attitude in REU is largely axiomatic rather than purely empirical. Buchak's framework *stipulates* that beliefs are represented by a standard probability measure $p$ (satisfying additivity) and risk is represented by $r$. We identify $p$ via bets on neutral events (like coin flips) where risk attitudes shouldn't apply. If an agent distorts probabilities even on neutral events, the distinction blurs. The claim that $r$ is a risk attitude rests on the normative assumption that rational beliefs should be additive and partition-invariant. Without that normative anchor, REU can be redescribed as EU with "weird" beliefs. The formalism asserts the separation; choice data alone underdetermines it unless we independently fix the agent's beliefs.

  Finally, allowing $r$ to vary with the act's structure (e.g., different risk functions for high-stakes vs. low-stakes gambles) weakens the "trait" interpretation of risk attitude. If $r$ is not a stable global function but shifts contextually, it begins to resemble a heuristic bias or a framing effect rather than a fundamental component of rational preference like utility or belief. This variability makes it harder to maintain that $r$ captures a normative principle of risk management; instead, it looks more like a descriptive patch for observed anomalies. While this increases the model's descriptive fit, it costs the theory its claim to represent a unified, rational risk attitude distinct from unstable beliefs.

  ***

  ### Marking Scheme (20 Points)

  **1. Technical Divergence (7 Points)**
  *   **A (6-7 pts):** Correctly identifies that REU weights depend on *cumulative* probability ($r(p_1 + p_2) - r(p_1)$). Explicitly contrasts this with EU where weight depends only on the event's specific probability ($f(p_2)$). Notes that REU weight on an outcome shifts if the probability of a *better* outcome changes (rank-dependence).
  *   **B (4-5 pts):** States that the models diverge at 3 outcomes and mentions "rank-dependence," but fails to write out or clearly describe the cumulative weight formula. Vague on *why* EU can't mimic it (e.g., just says "EU is linear").
  *   **C (0-3 pts):** Recites the binary formula again. Claims EU can mimic REU if beliefs are distorted enough. Confuses utility curvature with probability weighting.
  *   *Common Pitfall:* Treating the EU distortion as $r(p)$ applied to each outcome individually rather than to the event probability.

  **2. The Identification Problem (8 Points)**
  *   **A (7-8 pts):** Recognizes that while choice data can distinguish REU from EU with *coherent/additive* beliefs, it cannot distinguish REU from EU with *incoherent/partition-dependent* beliefs. Concludes that the belief/attitude split is partly axiomatic/normative (requiring independent fixation of $p$).
  *   **B (5-6 pts):** Argues that because the choice patterns differ, the models are empirically distinct. Misses the nuance that "distorted belief" can be redefined to save the EU model (underdetermination). Treats the separation as purely observational.
  *   **C (0-4 pts):** Claims REU proves beliefs are accurate. Or claims there is no way to tell them apart ever.
  *   *Common Pitfall:* Asserting that REU *proves* beliefs are veridical, or failing to mention that independent measurement of belief (e.g., via neutral bets) is required to fix the identification problem.

  **3. Context-Dependence of $r$ (3 Points)**
  *   **A (3 pts):** Notes that variable $r$ undermines the status of risk attitude as a stable rational trait, making it look more like a bias or framing effect.
  *   **B (2 pts):** Mentions that variable $r$ makes the model more flexible but doesn't discuss the implication for the "attitude vs. belief" distinction.
  *   **C (0-1 pts):** Ignores this part of the prompt.
  *   *Common Pitfall:* Arguing that variable $r$ is good because it fits data better, without addressing the theoretical cost to the "risk attitude" interpretation.

  **4. Clarity and Structure (2 Points)**
  *   **A (2 pts):** Concise, logical flow, stays within word limit constraints while covering all points.
  *   **B (1 pt):** Disorganized or significantly over/under word count.
  *   **C (0 pts):** Illegible or incoherent.

  **Total: 20 Points**
  *   **A Range:** 17–20 (Must hit A criteria on Tech & Identification).
  *   **B Range:** 13–16 (Solid tech, misses the underdetermination nuance).
  *   **C Range:** 9–12 (Understands binary case, fails on ternary math).
  *   **Fail:** < 9.
