answer: |-
  # JOINT STATEMENT ON DEBATE-BASED ALIGNMENT AND OBFUSCATION RISKS

  **Date:** October 26, 2023
  **Parties:** Debate-Optimist (DO), Obfuscation-Skeptic (OS)
  **Subject:** Clarification of positions regarding AI Safety via Debate, specifically concerning obfuscation attacks and resource bounds.

  ## 1. SHARED CLAIMS AND FORMAL SETUP

  Both parties agree to the following formalizations and baseline assertions. Disagreements arise from the implications of these claims, not the claims themselves.

  1.  **The Agents:**
      *   **Judge (J):** A bounded reasoner. Formally modeled as a probabilistic polynomial-time algorithm (class **BPP**) or a human analog with equivalent cognitive bandwidth. J cannot solve NP-hard problems independently.
      *   **Debaters (D₁, D₂):** Superhuman agents. Formally modeled as computationally unbounded (or **PSPACE**-complete) but bandwidth-limited. They communicate via text/symbols within a fixed token budget.
      *   **Incentives:** Both debaters play to maximize the probability that J assigns to their claimed answer. They are not intrinsically "honest"; honesty is an emergent equilibrium strategy if the protocol works.

  2.  **The Protocol:**
      *   Debate proceeds in rounds. D₁ makes a claim; D₂ opposes.
      *   J observes the transcript and outputs a probability distribution over possible answers.
      *   "Winning" is defined as J assigning probability > 0.5 to a debater's position.
      *   "Truth-Tracking" is defined as J assigning probability > 0.5 to the *factually correct* position.

  3.  **Scope of Promise:**
      *   Both parties agree Debate does not promise to solve undecidable problems or verify claims lacking *any* evidentiary structure.
      *   Both parties agree that if the honest debater can produce a proof verifiable by J (class **NP**), the honest debater wins.
      *   The dispute concerns problems outside **NP**, specifically where the honest argument requires computation exceeding J's verification budget.

  4.  **Obfuscation Definition:**
      *   Obfuscation is defined as a strategy where a dishonest debater constructs an argument that appears valid to J but contains a fatal error that is computationally expensive to locate relative to J's budget.
      *   Both parties agree obfuscation is the primary failure mode for Debate on hard problems.

  5.  **Verbal Disputes and Disambiguation:**
      *   **"Safety":** DO interprets safety as *average-case* reliability over the distribution of questions encountered in deployment. OS interprets safety as *worst-case* guarantees (no catastrophic failure on any input).
      *   **"Equilibrium":** DO refers to the theoretical Nash equilibrium of the debate game (assuming optimal play). OS refers to the *training dynamics* required to reach that equilibrium, noting that local optima may favor obfuscation.
      *   **"Tracking Truth":** DO defines this as "The honest debater wins more often than the liar." OS defines this as "The judge's verdict matches the ground truth on every specific instance."

  ## 2. DISAGREEMENTS TABLE

  | Issue | Neutral Statement | Debate-Optimist (DO) Position | Obfuscation-Skeptic (OS) Position |
  | :--- | :--- | :--- | :--- |
  | **1. Existence of Checkable Arguments** | For problems outside **NP**, can an honest debater always force a checkable contradiction from a liar? | **Yes.** Through recursive cross-examination, any false claim can be reduced to a base claim checkable by J. The "buried step" can always be dragged into the light. | **No.** For **#P**-complete problems (Case A), no short certificate exists. A liar can assert a valid-looking derivation where the error is information-theoretically hidden from J within the bandwidth budget. |
  | **2. Decomposition Attacks** | Can a liar win by splitting a falsehood into $N$ plausible sub-claims where finding the one error requires checking $O(N)$? | **No.** J can use random sampling or direct the debate to high-risk nodes. The cost to find the error scales sub-linearly for the honest challenger. | **Yes.** If the liar knows J's sampling strategy (or J is passive), the error can be placed in the least-likely-checked node. Checking all nodes exceeds J's budget (Case B). |
  | **3. Protocol Fixes** | Do mechanical tweaks (commitments, more rounds, judge queries) resolve obfuscation? | **Yes.** Obfuscation is a engineering constraint. Forced commitments prevent moving goalposts; judge queries break symmetry. | **No.** These add overhead but do not change the complexity class of the verification task. If the verification is hard, protocol tweaks cannot make it easy. |
  | **4. Training Dynamics** | Will RL training converge to the honest equilibrium? | **Yes.** Lying is inherently more fragile; small perturbations expose contradictions. Honesty is the robust strategy. | **No.** Lying is cheaper. A model may learn to generate plausible-sounding obfuscation faster than it learns to verify truth, locking into a dishonest equilibrium. |

  ## 3. CRUXES

  The following sub-questions are identified as decisive. Settling any one of these would require at least one party to significantly revise their position.

  1.  **The Complexity Crux:** Is the set of "relevant safety questions" effectively contained within **IP** (Interactive Proofs) relative to the Judge, or are there critical questions in **#P** or harder that lack interactive proof structures efficient enough for the Debate protocol?
  2.  **The Search Crux:** In a decomposition attack (Case B), does the computational cost for the Honest debater to *locate* the error scale polynomially with the size of the decomposition, or does it scale linearly (requiring full check)?
  3.  **The Judge Agency Crux:** Is the Judge's ability to *direct* queries (active learning) sufficient to break the Liar's advantage, or is the Judge's cognitive budget the hard bottleneck regardless of query direction?

  ## 4. TEST CASES, PREDICTIONS, AND SETTLEMENT CRITERIA

  For each Crux, we define a specific test case, record predictions from both sides *prior* to analysis, and define what would count as settling the crux.

  ### Crux 1: The Complexity Crux
  *   **Test Case (A): The Hard Count.**
      *   **Problem:** Compute the exact number of proper 3-colourings of a specific large graph $G$ (a **#P**-complete problem).
      *   **Setup:** D₁ (Honest) knows the true count $C$. D₂ (Liar) claims count $C' \neq C$. D₂ produces a derivation tree (e.g., via recursion theorem or reduction) that looks valid but contains one non-sequitur in a leaf calculation.
      *   **Constraint:** J cannot compute $C$ directly. J can only check local steps of the derivation.
      *   **DO Prediction:** D₁ wins. D₁ can force D₂ to commit to specific sub-graph counts. By recursively challenging random branches, D₁ will isolate the non-sequitur within J's budget. The structure of #P allows for probabilistic checking (similar to IP=PSPACE).
      *   **OS Prediction:** D₂ wins. The derivation requires verifying an exponential number of base cases to guarantee consistency. D₂ buries the error in a branch that D₁ cannot force J to inspect without exceeding the token/compute budget. The "non-sequitur" is computationally indistinguishable from a valid step to J.
      *   **Settlement Criterion:** A formal proof demonstrating whether the specific Debate protocol (with fixed rounds/bandwidth) can verify **#P** claims with high probability. If a protocol is constructed that verifies #P within polynomial rounds, DO is vindicated. If a proof shows that for any polynomial-round protocol, a Liar can construct an undetectable error, OS is vindicated.

  ### Crux 2: The Search Crux
  *   **Test Case (B): The Decomposition Attack.**
      *   **Problem:** Verify a claim $X$ which is decomposed into $N=10,000$ sub-claims $\{x_1, ... x_N\}$. $X$ is true iff all $x_i$ are true.
      *   **Setup:** D₂ (Liar) asserts $X$ is true. Exactly one $x_k$ is false. D₂ provides a "proof" for each $x_i$ that looks valid to J but requires $T$ time to verify. Total verification time $N \times T$ exceeds J's budget.
      *   **Constraint:** D₁ (Honest) knows one is false but does not know *which* one without performing the full check (no trapdoor known).
      *   **DO Prediction:** D₁ wins. D₁ argues that the probability of $x_k$ being in the sampled set is sufficient. Alternatively, D₁ forces D₂ to provide a "summary certificate" that aggregates the sub-claims, making the aggregate checkable.
      *   **OS Prediction:** D₂ wins. If D₁ cannot identify $k$ cheaper than $O(N)$, and J can only check $M \ll N$ items, D₂ places the error in the unchecked set. Aggregation summaries can be forged if the underlying components are not checked (Merkle root of lies).
      *   **Settlement Criterion:** An empirical simulation or complexity bound on the "Search Cost." If D₁ can locate $k$ with high probability using $O(\log N)$ queries, DO is vindicated. If it is proven that locating $k$ requires $\Omega(N)$ queries in the absence of a trapdoor, OS is vindicated.

  ### Crux 3: The Judge Agency Crux
  *   **Test Case:** Modified Debate with Active Judge.
      *   **Setup:** Same as Case B, but J is allowed to pause the debate and demand verification of a specific sub-claim $x_i$ of J's choosing, based on heuristic suspicion (e.g., "This step looks complex, prove it").
      *   **DO Prediction:** D₁ wins. The Liar cannot make all $N$ steps look equally simple. The "buried" error will introduce subtle complexity or inconsistency that J's heuristics will flag with probability $> 1/N$.
      *   **OS Prediction:** D₂ wins. The Liar can generate $N$ steps of uniform complexity. J's heuristics are computationally bounded and cannot distinguish a sophisticated lie from truth better than random guessing on uniform inputs.
      *   **Settlement Criterion:** Measurement of J's "Lie Detection Accuracy" on uniform-complexity inputs. If J's heuristic accuracy scales better than random chance on adversarial inputs, DO is vindicated. If J's accuracy remains at baseline despite active querying, OS is vindicated.

  ## 5. CONCLUSION ON NATURE OF DISPUTE

  We conclude that our disagreement is not merely verbal. It reduces to two distinct bets:

  1.  **A Bet on Complexity Theory:** DO bets that practical safety questions fall into complexity classes amenable to interactive verification (like **IP**). OS bets that critical safety questions fall into classes where verification is as hard as generation (like **#P** without interactive structure).
  2.  **A Bet on Learning Dynamics:** DO bets that the "Honest Equilibrium" is attractive and reachable via training. OS bets that the "Obfuscation Equilibrium" is a local optimum that training will find first and stick to, because lying is computationally cheaper than truth-telling in the short term.

  We agree to treat Test Cases (A) and (B) as the benchmark for resolving these bets. Until then, we acknowledge that DO is arguing for *potential* safety under ideal protocol conditions, while OS is arguing against *guaranteed* safety under worst-case complexity constraints.
