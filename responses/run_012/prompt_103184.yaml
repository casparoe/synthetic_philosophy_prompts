prompt: |-
  I'm running the opening session of a reading group on metaontology, and I want to use it to teach one idea properly rather than survey the field. The audience is mostly graduate students in linguistics and computer science — people with sharp intuitions about how words work and almost no exposure to ontology — and the idea I want them to leave with is what it is for a dispute to be merely verbal. Please plan the session rather than explain the topic to me. I need the order in which the pieces have to arrive and why, because I suspect the group will want to begin with examples and only later discover that the phrase does no work until they already have two prior distinctions: that a word's meaning is a convention that can quietly diverge between two speakers who believe they are using it the same way, and that a single disagreement can be simultaneously about the world and about the language we are describing it with. Tell me what has to be in place before the question can even be posed, and where in the sequence each prior idea has to land.

  I had planned to carry the whole session on one case: whether a virus counts as alive. My sense is that it works because the disagreement is genuine — researchers who study viruses really do disagree, and the disagreement shapes how they classify and handle things — while also being plainly entangled with what the word 'alive' is supposed to mean, so that neither side can simply stipulate the other out of the way. Tell me whether that case can bear the weight or whether it quietly fails, and what a replacement would have to have and lack. (I considered opening with whether Pluto is a planet, but I suspect it teaches the wrong lesson, since there the matter was settled by an explicit decision to redefine the term; tell me if I am wrong to set it aside.) Then map the misconceptions for me: I expect the triviality reading ('merely verbal, so no one is really disagreeing'), its mirror image ('if defining our terms makes the dispute evaporate, it was verbal all along'), the conflation of a dispute about a word with a dispute over whether to use that word, and a slide into relativism ('if each side is right relative to its own meaning, there is no fact of the matter'). For each, tell me where in the sequence it will form and exactly where I should head it off. Finish with one question I can put to the group that would reveal whether they have grasped the distinction rather than merely acquired the vocabulary, and tell me what I should openly refuse to cover at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Run an opening session of a reading group on metaontology.
      *   **Target Audience:** Graduate students in Linguistics and Computer Science (sharp on semantics/logic, new to ontology).
      *   **Core Concept:** "Merely Verbal Disputes" (MVD).
      *   **Constraint:** Teach *one* idea properly, not survey the field.
      *   **Specific Instruction:** Plan the *sequence* of ideas. Explain *why* the order matters. Identify prerequisites (meaning as convention, entanglement of world/language).
      *   **Case Study:** Evaluate "Is a virus alive?" vs. "Is Pluto a planet?"
      *   **Misconceptions:** Identify specific pitfalls (triviality, definition-evaporation, word vs. use, relativism) and pinpoint when/where to address them.
      *   **Ending:** One diagnostic question and a list of topics to explicitly exclude.

  2.  **Deconstruct the Core Concept (Merely Verbal Disputes):**
      *   To understand MVD, one must understand what a *substantive* dispute is.
      *   To understand substantive vs. verbal, one must understand how language hooks onto the world (semantics/metaphysics interface).
      *   The user is correct: You can't start with "Is this verbal?" without first establishing that meanings can diverge silently and that disputes have layers (fact vs. framework).
      *   *Audience Fit:* Linguists/CS folks care about formal semantics, reference, and ontology engineering. They will spot ambiguity quickly. The challenge is getting them to see that *resolving* ambiguity doesn't always resolve the *ontological* tension.

  3.  **Evaluate the Case Study ("Is a virus alive?"):**
      *   *Pros:* Genuine scientific disagreement. High stakes (classification affects research). Ambiguous criteria for "life" (metabolism, reproduction, evolution).
      *   *Cons:* Might feel like a definition dispute ("It depends what you mean by life").
      *   *User's concern about Pluto:* Correct. Pluto was a stipulative change by committee. It teaches that disputes are solved by voting/stipulation. Virus is better because the *science* hasn't changed, only the categorization pressure.
      *   *Verdict:* Keep "Virus." It's robust enough *if* handled carefully. It needs to be framed not as "What is the definition?" but "Does the world carve at this joint?"

  4.  **Sequence the Ideas (The "Architecture"):**
      *   *Phase 1: The Phenomenology of Disagreement.* Start with the intuition that we are arguing.
      *   *Phase 2: The Semantic Layer (Linguistics/CS hook).* Meaning as use/convention. The possibility of "talking past each other."
      *   *Phase 3: The Ontological Layer.* Even if meanings align, is there a fact of the matter?
      *   *Phase 4: The Synthesis (MVD).* Distinguishing verbal from substantive.
      *   *Why this order?* If you start with MVD, they think it's just "define your terms." If you start with semantics, they think it's just linguistics. You need the tension between the two.

  5.  **Address Misconceptions:**
      *   *Triviality:* "Merely verbal = unimportant." (Need to show verbal disputes can be practically crucial).
      *   *Evaporation:* "If defining terms solves it, it was verbal." (Sometimes defining terms reveals a deeper substantive disagreement).
      *   *Word vs. Use:* Confusing "what does 'alive' mean" with "should we call viruses 'alive'".
      *   *Relativism:* "Both are right." (Need to preserve the idea that one ontology might be better, even if the dispute is verbal).

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Opening:* Don't define MVD yet. Start with the Virus case. Let them argue.
      *   *Step 1 (Semantics):* Introduce the idea of "Charitable Interpretation" (David Lewis/David Chalmers vibe). Are they disagreeing about facts or meanings?
      *   *Step 2 (The Pivot):* Suppose we fix the meaning. Does the disagreement vanish?
      *   *Step 3 (The Ontological Remainder):* If it doesn't vanish, it's substantive. If it does, is it *merely* verbal?
      *   *Refinement on the User's Prerequisites:* The user said: "the phrase does no work until they already have two prior distinctions: (1) meaning is convention/divergence, (2) disagreement can be simultaneous world/language."
      *   *Adjustment:* I need to make sure Step 1 and Step 2 explicitly build these two distinctions *before* labeling anything "Merely Verbal."

      *   *Case Study Check:* "Virus" is good. "Pluto" is bad (as user suspected) because it was a stipulative fiat. I will validate the user's intuition there.

      *   *Misconception Timing:*
          *   Triviality: Address when introducing the label "Merely Verbal."
          *   Evaporation: Address during the "Fix the meaning" test.
          *   Relativism: Address at the very end (Meta-metaphysics).

      *   *Diagnostic Question:* Needs to force them to apply the distinction to a *new* case, not just repeat the virus example. Maybe something about "data" in CS or "syntax" in linguistics? Or stick to a classic metaphysical case simplified? Let's go with a CS-adjacent ontology case (e.g., "Is a digital file an object?"). Actually, better to stick to the Virus case but change the parameters to test their grasp. No, a new case is better for testing transfer. Let's use "Is a corporation a person?" (Legal/Ontological mix). Or "Is a simulation real?" Let's stick closer to their fields. "Is a neural network a model of the brain or a distinct artifact?" Hmm. Let's go with the classic "Is the statue the same object as the clay?" but translated to CS: "Is the database schema the same thing as the data structure?"
      *   *Decision:* The prompt asks for *one* question to reveal grasp. It should probe the *consequence* of the distinction. "If we resolve the verbal dispute, what work is left undone?"

      *   *Refusal List:* What to exclude? Quantifier variance, heavy metaphysics (tropes/universals), historical survey (Carnap vs. Quine deep dive). Keep it focused on the *concept* of MVD.

  7.  **Finalizing the Structure:**
      *   **Introduction:** The Virus Case (Phenomenology).
      *   **Module 1: The Semantic Gap.** (Meaning as convention).
      *   **Module 2: The Ontological Remainder.** (World vs. Language).
      *   **Module 3: Defining MVD.** (The synthesis).
      *   **Misconception Interceptions:** Weave these into the modules.
      *   **Closing:** Diagnostic Question & Exclusions.

  8.  **Review against Constraints:**
      *   *Order:* Does it follow the user's intuition about prerequisites? Yes, Semantics -> Entanglement -> MVD.
      *   *Case:* Validate Virus, reject Pluto.
      *   *Misconceptions:* Map them to specific moments.
      *   *Audience:* Tailor examples to Ling/CS (semantics, reference, ontology engineering).

  9.  **Polishing the Content:** (Self-Correction during drafting)
