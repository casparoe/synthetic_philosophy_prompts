answer: |-
  Here is a session plan designed to land the concept of a **Merely Verbal Dispute (MVD)** with precision. It respects your constraint to teach one idea properly and leverages the specific background of your audience (Linguistics/CS).

  ### Session Architecture: The Three-Layer Cake

  You are correct that the term "Merely Verbal" is useless without prior infrastructure. If you introduce it too early, students will treat it as a dismissal ("Oh, that's just words") rather than a structural diagnosis.

  The session must build three layers in this specific order:
  1.  **Semantic Divergence:** Two speakers can use the same phoneme with different intensions/extensions without realizing it.
  2.  **Ontological Entanglement:** A disagreement can be about the world *and* the language simultaneously; fixing the language doesn't always fix the disagreement.
  3.  **The MVD Diagnosis:** A dispute is *merely* verbal only if resolving the semantic divergence dissolves the disagreement entirely, leaving no ontological remainder.

  ---

  ### Part 1: The Phenomenology (15 Minutes)
  **Goal:** Induce the feeling of a genuine disagreement without yet analyzing it.
  **Case:** *Are viruses alive?*

  1.  **The Setup:** Present two researchers.
      *   **Researcher A (Virologist):** "Viruses are not alive. They lack metabolism and cannot reproduce without a host. Treating them as living organisms obscures their mechanistic nature."
      *   **Researcher B (Evolutionary Biologist):** "Viruses are alive. They evolve, they have genetic material, and they drive natural selection. Excluding them from the tree of life blinds us to their ecological role."
  2.  **The Task:** Ask the group: *Are A and B disagreeing about the world, or about the word 'alive'?*
  3.  **The Trap:** Let them debate this for 5 minutes. They will likely split. Some will say "It's just definition." Others will say "No, it affects how we fund research."
  4.  **The Hold:** Do not resolve this. Tell them: "We cannot answer this yet. We lack the tools to distinguish the layers."

  **Why here?** You need them to feel the tension. If you start with definitions, they will think ontology is just lexicography.

  ### Part 2: The Semantic Layer (20 Minutes)
  **Goal:** Establish Prerequisite #1 (Meaning as Convention/Hidden Divergence).
  **Audience Hook:** Use Linguistics/CS concepts (Reference, Extension, Schema Mapping).

  1.  **The Concept:** Introduce the idea of **Semantic Coordination**. Two agents can successfully communicate while mapping a term to different extensions, provided the overlap is sufficient for the context.
  2.  **The Mechanism:** Explain that "Alive" is not a natural signal (like smoke indicating fire); it is a conceptual bucket.
      *   *Bucket A (Metabolic):* Requires internal energy processing. Extension: {Bacteria, Humans, Trees} \ {Viruses}.
      *   *Bucket B (Evolutionary):* Requires replication with variation. Extension: {Bacteria, Humans, Trees, Viruses}.
  3.  **The Insight:** Show that A and B might agree on all the *physical facts* (viruses have RNA, viruses need hosts, viruses evolve) but disagree on which **bucket** captures the "natural kind" worth tracking.
  4.  **Intercepting Misconception #1 (The Word/Use Conflation):**
      *   *Where it forms:* Here. Students will say, "So they just need to agree on the definition."
      *   *The Head-Off:* Stop them. Say: "Agreeing on a definition is a social act. It does not guarantee we are carving the world at the joints. We can stipulate that 'glorp' means 'virus', but that doesn't tell us if viruses share a nature with humans." Distinguish **stipulating meaning** from **discovering boundaries**.

  **Why here?** This satisfies your requirement that they understand meaning is a convention that can quietly diverge. Without this, they cannot see how a dispute could be verbal.

  ### Part 3: The Ontological Layer (25 Minutes)
  **Goal:** Establish Prerequisite #2 (World vs. Language Entanglement) and introduce the "Ontological Remainder."
  **Case:** Return to *Viruses*.

  1.  **The Test:** Propose a thought experiment. "Suppose we force Researcher A and B to use the *exact same definition* of 'alive' (e.g., the Evolutionary one). Does the disagreement vanish?"
  2.  **The Outcome:**
      *   If they both adopt the Evolutionary definition, Researcher A might say: "Fine, viruses are 'alive' by your definition, but they are still *fundamentally different* in kind from bacteria because they lack metabolism."
      *   **Crucial Point:** The dispute *shifts* but does not vanish. It moves from "Are they alive?" to "Is metabolism the relevant criterion for biological classification?"
  3.  **The Distinction:**
      *   **Merely Verbal:** If fixing the definition makes the disagreement disappear completely (e.g., "Is a bachelor unmarried?"), it is merely verbal.
      *   **Substantive:** If fixing the definition leaves a residual disagreement about how the world is structured or which structure is useful, it is substantive.
  4.  **Intercepting Misconception #2 (The Evaporation Fallacy):**
      *   *Where it forms:* When you propose fixing the definition.
      *   *The Fallacy:* "If defining our terms makes the dispute evaporate, it was verbal all along."
      *   *The Head-Off:* Show that sometimes defining terms *reveals* the substantive core. In the Virus case, defining "alive" exposes a deeper disagreement about **taxonomy utility**. The dispute wasn't *merely* verbal; it was *partly* verbal, masking a substantive methodological disagreement.
  5.  **Intercepting Misconception #3 (Triviality):**
      *   *Where it forms:* When you label something "Verbal."
      *   *The Fallacy:* "Merely verbal = Unimportant / No one is really disagreeing."
      *   *The Head-Off:* Emphasize that verbal disputes can have high stakes. If a CS ontology misaligns on "User" vs. "Account," the system crashes. The dispute is verbal (about schema), but the consequence is real. "Merely verbal" describes the *source* of the conflict, not the *cost* of the conflict.

  **Why here?** This is where the two prerequisites combine. They now see that language diverges (Part 2) and that world-claims persist even when language aligns (Part 3). Now they are ready for the definition of MVD.

  ### Part 4: Synthesis & Diagnosis (20 Minutes)
  **Goal:** Define MVD precisely and test for Relativism.

  1.  **The Definition:** A dispute is **Merely Verbal** if and only if:
      *   (a) The parties assign different meanings/extensions to a key term.
      *   (b) Once meanings are aligned (or translated), the disagreement vanishes *without remainder*.
      *   (c) There is no further fact of the matter about which meaning is "correct" relative to the world's structure (conceptual pluralism).
  2.  **Intercepting Misconception #4 (Relativism):**
      *   *Where it forms:* Immediately after the definition.
      *   *The Fallacy:* "If each side is right relative to its own meaning, there is no fact of the matter."
      *   *The Head-Off:* Distinguish **Truth** from **Ontological Commitment**. Researcher A is not "right" that viruses aren't alive in a vacuum; they are right that *given their theoretical framework*, viruses don't fit the slot. But one framework might be objectively better for prediction. Avoid the slide into "anything goes." The question is not "Who is right?" but "Is there a fact of the matter that makes one right?"
  3.  **The Pluto Check:** Briefly mention why you rejected Pluto.
      *   *Pluto:* The IAU voted. It was a stipulative fiat. It teaches that ontology is decided by committee.
      *   *Virus:* No committee can decide. The science remains ambiguous. It teaches that ontology is about **theoretical utility** vs. **world structure**.

  ### The Diagnostic Question

  Do not ask: *"Is the virus dispute verbal?"* (They will just repeat the lecture).
  Do not ask: *"Define Merely Verbal Dispute."* (That tests vocabulary, not grasp).

  **Ask this:**
  > "Imagine two database engineers. Engineer X says, 'This JSON object is not a *record* because it lacks a primary key.' Engineer Y says, 'It is a *record* because it stores persistent state.'
  >
  > If they agree to define 'record' as 'any persistent state,' Engineer X still insists, 'Fine, but it's not a *valid* record for this transaction.'
  >
  > **Question:** Has the dispute been revealed as merely verbal, or has the definition change exposed a substantive disagreement? What specific 'ontological remainder' is left over?"

  **What to listen for:**
  *   **Failure:** They say "It's verbal because they agreed on the definition." (Misses the remainder).
  *   **Failure:** They say "It's substantive because databases are real." (Misses the semantic layer).
  *   **Success:** They identify that the disagreement shifted from *classification* (semantic) to *constraint/validation* (substantive functional requirement). They recognize that aligning the term did not align the **conditions of satisfaction**.

  ### What to Openly Refuse to Cover

  To keep the session focused, explicitly state at the beginning that you will **not** cover:

  1.  **Quantifier Variance:** (e.g., Hirsch vs. Sider). This is the technical metaontological engine of MVD, but it requires logic machinery that will distract from the core intuition. Tell them: "We are dealing with predication ('is alive'), not existence ('there exists')."
  2.  **The History of the Debate:** (Carnap vs. Quine). Mention them only as footnotes. Do not teach their arguments.
  3.  **Fictionalism or Error Theory:** Do not discuss whether *either* side is wrong. Stick to whether they are talking past each other.
  4.  **Resolution:** Do not promise to tell them whether viruses *are* alive. The session is about the *dispute*, not the *answer*.

  ### Summary of Sequence Logic

  1.  **Virus Case:** Creates the tension (Fact vs. Word).
  2.  **Semantic Layer:** Resolves the "Word" part (Meanings diverge).
  3.  **Ontological Layer:** Resolves the "Fact" part (Remainder test).
  4.  **MVD Definition:** Combines 2 & 3 (No remainder = Merely Verbal).
  5.  **Misconception Interceptions:** Placed exactly where the intuitive error naturally arises during the flow.

  This order ensures that when you finally say the phrase "Merely Verbal Dispute," it lands as a precise diagnostic tool, not a conversational stopper.
