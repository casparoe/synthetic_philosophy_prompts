  *(Self-Correction on Exclusions)*: Don't talk about Quantifier Variance (Hirsch) yet. It's too technical for session 1. Don't talk about "Fictionalism." Don't do a history of Carnap.

  *(Final check on Pluto)*: User is right. Pluto is a stipulation. Virus is a boundary case of natural kind. Keep Virus.

