  # The Hart–Devlin Punch-Up: A Case-Based Decision Tree

  **The Cases:**  
  **(1) Incest:** Siblings, private, contracepted, happy.  
  **(2) Amputation:** Healthy leg, competent consent, grateful.  
  **(3) Necrophilia:** Consented in advance, no relatives, secret.  
  **(4) Slave-Play:** Private, consensual role-play, no audience.  
  **(5) Public Sex:** Locked cubicle, public toilet, unseen.

  ---

  **Q1. (Case 1) Is the incest morally wrong despite zero harm?**  
  │  
  ├─ **YES** → **Q2. (Case 1) Should the criminal law ban this?**  
  │   │  
  │   ├─ **NO** → **LEAF: Harmless wrongdoing is real but never criminalisable.**  
  │   │  
  │   └─ **YES** → **Q3. (Case 3) If the necrophilia remained forever secret, would it still deserve punishment?**  
  │       │  
  │       ├─ **YES** → **LEAF: Pure legal moralism.** (Wrongness is intrinsic.)  
  │       └─ **NO** → **LEAF: Devlin-style social-cohesion moralism.** (Wrongness depends on social reaction.)  
  │  
  └─ **NO** → **Q4. (Case 2) Should the surgeon be stopped to protect the patient from themselves?**  
      │  
      ├─ **YES** → **LEAF: Paternalism.**  
      │  
      └─ **NO** → **Q5. (Case 5) Is the public sex wrong *only* because someone might be offended?**  
          │  
          ├─ **YES** → **LEAF: The offence principle.**  
          │  
          └─ **NO** → **Q6. (Case 5) Is it wrong because public spaces carry shared duties?**  
              │  
              ├─ **YES** → **LEAF: The public-wrongs view.**  
              │  
              └─ **NO** → **Q7. (Case 4) Is the slave role-play permissible because it is private?**  
                  │  
                  ├─ **YES** → **LEAF: Mill/Hart harm-principle line.**  
                  └─ **NO** → **LEAF: UNNAMED.** (Consent limits without harm/publicity.)

  ---

  ### Notes for Discussion

  **Indistinguishable Leaves**  
  *   **Pure Moralism vs. Devlin:** In practice, hard to separate. Devlin argues society *will* react to intrinsic wrongs; Pure Moralists say punish even if society wouldn't.  
  *   **Offence vs. Public Wrongs:** Both criminalize Case 5. Offence focuses on feelings; Public Wrongs on the status of the space. Often converge in verdict.

  **Unoccupied Answer-Combinations**  
  *   **"Not Wrong but Criminalise"**: (e.g., Q1=No, Q2=Yes). **Incoherent.** Law requires a normative reason; banning non-wrongful acts is tyranny without justification.  
  *   **"Private Shame + Punish Secret"**: (e.g., Q2=No, Q3=Yes). **Incoherent.** If law shouldn't ban Case 1, it lacks the standing to punish secret Case 3.  
  *   **"Liberal on Body/Sex + Moralist on Roleplay"**: (e.g., Q4=No, Q7=No). **Unexplored/Unstable.** Rare to accept amputation/incest but reject private hierarchy simulations without citing harm.

  **Position Labels**  
  *   **Named:** Mill/Hart, Devlin, Pure Legal Moralism, Paternalism, Offence Principle, Public-Wrongs.  
  *   **Unnamed:** The view that harmless wrongdoing exists but isn't criminalisable; the view that consent cannot validate slavery-like acts even in private without harm.
