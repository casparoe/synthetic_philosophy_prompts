  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Wait, look closer at (ii).* "Voting is an office of democratic citizenship." If non-citizens vote in municipal elections (iv), they are exercising an office without citizenship. This is the strongest point for the friend.
      *   *Look at (v).* "Subject to state's binding decisions." This justifies (iv). But does it justify (ii)? If I'm subject to decisions, do I have a duty? Yes. But is it an office of *citizenship*? No, it's an office of *subjection/residency*.
