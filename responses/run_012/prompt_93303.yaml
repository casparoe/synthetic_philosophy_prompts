      *   **Severity 2 (Substantial): The Nature of Compulsion (ii vs vii).** Duty to attend vs. duty to choose.
      *   **Severity 3 (Practical): Minors and Fines (i vs iii).** Enforcement mechanism.
      *   **The Hidden Distinction:** *Attendance vs. Expression* and *National vs. Local Polity*.
