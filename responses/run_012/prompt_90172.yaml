prompt: |-
  ok so ive been trying to figure out what makes an action morally good (like actually good, not just the right thing to do) and my gut feelings about it dont add up. can you find the rule behind them, if there is one?

  heres my calls:

  - my friend Maya volunteers at the animal shelter because it looks amazing on college apps. she couldnt care less about the animals. i dont think that counts as good at all.
  - my other friend Jae does the exact same thing for the exact same reason, but he also genuinely loves the animals. that one counts for me, at least partly.
  - my uncle donates to charity mostly because it gives him a warm fuzzy feeling. i kind of think that still counts as good?? even though hes basically doing it for himself.
  - but someone who donates only so they dont have to feel guilty -- that dosnt count for me at all. which seems weird next to my uncle, since arent they both just chasing their own feelings?
  - my grandma is just the kind of person who helps people, its pure habit, she doesnt even think about it. i want to say that counts, maybe the most of all.
  - someone who does the right thing only because theyd get in trouble otherwise -- not good.
  - someone taking care of their sick mom out of love for her specifically -- definitly good. but love isnt really a moral reason is it? its just a feeling about one person.

  is there one principle that gets all of these, or close? if not, which of my gut calls do i have to give up and why? and what would your principle say about someone who does the right thing purely because they were taught it was the rule, with no idea why its the rule?
