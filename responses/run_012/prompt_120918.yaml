          *   *Point B:* Reachability requires a set of goals to measure reachability *for*. Picking that set is a value judgment.
          *   *Verdict:* Strong technical critique. AUP (Attainable Utility Preservation) does require an auxiliary goal set. If that set is biased, the impact measure is biased. The baseline problem is also a known issue in counterfactual reasoning.

      *   **(4) Marcus:** Defends the *Goal Set* as a "Generic Prior."
