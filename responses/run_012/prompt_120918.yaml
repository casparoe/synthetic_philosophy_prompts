          *   (5) Dana: Right on Goodhart's Law and the Safety/Utility tradeoff.
          *   (6) Marcus: Concedes philosophy, stands on engineering utility (Corrigibility).
      *   *Synthesis:* Dana wins the philosophy; Marcus wins the engineering pragmatism. They agree more than they think at the end.
      *   *Missing Point:* **The Epistemic Gap.** The penalty only works on consequences the agent *models*. If the agent is wrong about the world (which it will be), the penalty is blind to the actual danger.

  6.  **Review against Constraints:**
