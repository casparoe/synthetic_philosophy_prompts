      *   *Self-Correction on Case 1:* The prompt asks "Is this emergent?" I need to be careful. If the mapping is *physically* unrealizable, does that make it ontologically distinct? Most physicalists say no (it's still logically supervenient). But some (like Anderson/More is Different) might say the *inaccessibility* creates a new ontological layer. I should highlight this tension. I will lean towards: It satisfies Epistemic Emergence, fails Strong Ontological Emergence (unless one argues incomputability implies ontological gap).
