answer: |-
  Here is the specification of desiderata for a theory of emergence, structured to isolate metaphysical commitments from modeling conveniences.

  ### I. Desiderata for an Adequate Theory of Emergence

  **1. Phenomenological Adequacy (The "Anderson" Constraint)**
  *   **Requirement:** The theory must account for why distinct microphysical realizations yield identical macro-laws (RG universality), why singularities (phase transitions) appear only in the infinite limit despite finite constituents, and why coarse-grained variables (e.g., temperature, pressure) are predictively indispensable.
  *   **Motivation:** Any metaphysics that renders the actual success of condensed matter physics or statistical mechanics inexplicable is false. If the theory implies these macro-variables are "illusions," it fails to describe the world as science finds it.
  *   **Status:** **Non-negotiable.** (Even for a metaphysical project, the theory must save the phenomena.)

  **2. The Epistemic/Ontological Distinction**
  *   **Requirement:** The theory must explicitly distinguish between *Emergence-for-us* (limitations in computation, memory, or cognitive access) and *Emergence-in-principle* (features of the world's causal structure that exist independently of an observer).
  *   **Motivation:** Confusing complexity with ontology leads to the error of thinking that because we cannot *calculate* the micro-state, the macro-state must be *fundamentally* distinct. Conversely, assuming everything is reducible in principle ignores structural realities that persist regardless of computational power.
  *   **Status:** **Non-negotiable.** (Given your metaphysical purpose, failing to distinguish these renders the theory incapable of answering "what is in the world.")

  **3. Counterfactual Autonomy**
  *   **Requirement:** A macro-law counts as emergent only if it supports counterfactuals (interventions) that are stable and intelligible at the macro-level, without requiring traceback to micro-constituents. The macro-variable must track a "real pattern" that remains invariant under micro-variations.
  *   **Motivation:** Distinguishes between a mere summary statistic (convenient) and a causal/explanatory level (autonomous). If changing the macro-variable *always* requires specifying the exact micro-change, the macro-level has no explanatory grip.
  *   **Status:** **Non-negotiable.** (This is the core of explanatory power.)

  **4. Compatibility with Causal Closure**
  *   **Requirement:** The theory must not posit "downward causation" that violates the causal closure of fundamental physics. Macro-events must be physically realized by micro-events without introducing new fundamental forces or energy sources.
  *   **Motivation:** To remain consistent with the empirical success of fundamental physics. If emergence requires magic (violating conservation laws or micro-dynamics), it is scientifically untenable.
  *   **Status:** **Non-negotiable.** (Unless one is prepared to reject standard physics.)

  **5. Insensitivity to Coarse-Graining Non-Uniqueness**
  *   **Requirement:** The theory must acknowledge that multiple, incompatible coarse-grainings can be valid simultaneously (e.g., fluid dynamics vs. particle tracking) without implying that reality is fragmented.
  *   **Motivation:** Renormalization group flow shows there is no "one true scale." A metaphysics that demands a unique decomposition of the world into levels fails to match the structure of physical theory.
  *   **Status:** **Non-negotiable.**

  **6. The Derivability Gap**
  *   **Requirement:** The theory must accommodate the gap between "derivable in principle" (logical supervenience) and "derivable in practice" (effective computability), without conflating the two.
  *   **Motivation:** Many reductions are nomologically possible but computationally intractable. A theory that claims reduction is false *because* it is hard is epistemic; a theory that claims reduction is false *because* the macro-law contains information absent in the micro-law is ontological.
  *   **Status:** **Preference of Camp.** (Reductionists treat this as merely epistemic; Emergentists treat it as evidence of ontological distinctness. For your metaphysical aim, you must decide if the gap is merely human or structural.)

  ---

  ### II. Adjudication of Constructed Cases

  **Case 1: The Incomputable Macro-Variable**
  *   *Scenario:* Deterministic CA, exact macro-update rule, but mapping micro-to-macro is physically incomputable.
  *   *Adjudication:* **Weak (Epistemic) Emergence.**
  *   *Deciding Desideratum:* **The Epistemic/Ontological Distinction.**
  *   *Reasoning:* Since the macro-variable obeys an exact closed-form update and matches micro-counterfactuals, it is logically supervenient on the micro-state. The fact that the mapping is incomputable for physical machines is a fact about *us* and our universe's computational limits, not necessarily a fact about the modal structure of the variables themselves. Unless one argues that "physical computability" is a constraint on *existence* (a strong constructivist view), this is not ontologically emergent. It satisfies Predictive Indispensability but fails Ontological Distinction.

  **Case 2: The Misleading Macro-Variable**
  *   *Scenario:* Predictively useful, but counterfactuals fail under intervention (macro misrepresents micro-intervention outcomes).
  *   *Adjudication:* **Not Emergent (Instrumental Fiction).**
  *   *Deciding Desideratum:* **Counterfactual Autonomy.**
  *   *Reasoning:* Emergence implies a degree of reality to the higher level. If the macro-variable yields false predictions under intervention (i.e., it does not track a causal capacity of the system), it is a mere curve-fit or phenomenological model. It fails the requirement that macro-laws support autonomous counterfactuals. It is useful modeling, not ontology.

  ---

  ### III. Impact of Metaphysical Purpose

  You specified the purpose is **metaphysical** ("what is in the world").

  1.  **Dropped/Downgraded Requirements:**
      *   **Predictive Convenience:** This is no longer a defining feature of emergence, but merely *evidence* for it. A variable can be emergent even if it is hard to use, provided it tracks real causal structure.
      *   **Derivability in Practice:** The fact that we cannot derive the macro from the micro is irrelevant to whether the macro *exists*. This drops the "Epistemic Emergence" camp's primary criterion as a definition of reality.

  2.  **Elevated Requirements:**
      *   **Counterfactual Autonomy:** This becomes the primary test for ontological status. If the macro-level supports true counterfactuals that are not just shorthand for micro-counterfactuals, it has a claim to reality.
      *   **The Epistemic/Ontological Distinction:** This becomes the central pivot. You are forced to choose: Is the "emergence" in the map or the territory? For your purpose, only "territory" counts.

  ---

  ### IV. Incompatibility Flag: The Exclusion Problem

  **The Conflict:** **Counterfactual Autonomy** vs. **Causal Closure.**

  *   **The Tension:** If fundamental physics is causally closed (Desideratum 4), every physical effect has a sufficient physical cause. If a macro-variable supports autonomous counterfactuals (Desideratum 3), it implies the macro-variable *does* causal work.
  *   **The Dilemma:**
      1.  **Overdetermination:** The micro-cause and macro-cause both do the work. (Implausible; systematic redundancy).
      2.  **Epiphenomenalism:** The micro-cause does the work; the macro-variable is a shadow with no causal power. (Violates Counterfactual Autonomy).
      3.  **Identity/Reduction:** The macro-cause *just is* the micro-cause. (Collapses the distinction required for Emergence).
  *   **Verdict:** These two desiderata cannot be jointly satisfied without a sophisticated account of **Realization** or **Constraint** (e.g., the macro-level constrains the micro-level's degrees of freedom without adding energy). Most candidate theories fail here: they either slide into reductionism (saving closure, losing autonomy) or strong emergence (saving autonomy, losing closure).

  ---

  ### V. The Most Exclusionary Requirement

  **Requirement:** **Robust Counterfactual Autonomy compatible with Micro-Causal Closure.**

  **Why:**
  This is the bottleneck that filters out 90% of accounts.
  *   **Eliminativists** fail it (they deny the autonomy).
  *   **Strong Emergentists** fail it (they deny closure to save autonomy).
  *   **Naive Reductionists** fail it (they deny autonomy to save closure).
  *   **Instrumentalists** fail it (they deny the macro-counterfactuals are *true*, merely useful).

  To satisfy this, a theory must explain how a higher-level description can be *true* and *causally relevant* without competing with the lower-level description. This requires a notion of causation that is not purely "productive" (billiard balls) but perhaps "difference-making" or "constraint-based." Any theory that relies on a "push-pull" notion of force at the macro level will be excluded by the Causal Closure constraint. Any theory that reduces macro-counterfactuals to micro-counterfactuals will be excluded by the Autonomy constraint. Walking this line is the single hardest task in the metaphysics of science.
