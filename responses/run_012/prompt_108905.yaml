  > **Significant error.** You have endorsed a false general principle. The lesson of Simpson's Paradox in causal inference is *not* "always disaggregate." It is "look at the causal graph."
  > If the stratifying variable were a **mediator** (e.g., if the Programme affected Prior Attainment which affected Passes) or a **collider**, disaggregating would be wrong (blocking the path or opening bias). The reversal itself tells you nothing about causality; only the subject-matter knowledge (the office's policy) tells you that Prior Attainment is a confounder here. You applied the right method for *this* case, but your assessment of the classmate's universal claim is incorrect.

