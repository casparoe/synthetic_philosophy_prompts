  > *Note:* You state "since the reversal itself shows there is confounding." Be careful: a reversal is *consistent* with confounding, but the confounding is established by the allocation mechanism (the office's steering), not the statistics alone. However, your subsequent reasoning corrects this, so no deduction here.
