  This is a classic setup for distinguishing between decision theories that handle correlation differently. Your office-mate is clearly well-read in the formal decision theory literature (the "code," "compiled," and "mirrors" terminology is a dead giveaway), but her notebook leaves ambiguity between two specific frameworks that both claim the "superrational" mantle.

  Here are the two live rules fitting her five verdicts, their predictions for the drug case, my bet on which one she's running, and the case I'd use to confirm it.

  ### The Two Live Rules

  **1. Evidential Decision Theory (EDT)**
  *   **The Rule:** Choose the action that provides the best *news* about the world. Maximize expected utility conditional on your action: $Max \sum P(World | Action) \times Utility$.
  *   **Fit to Verdicts:**
      *   *Copy/Near-Copy:* My cooperating is strong evidence they cooperate (high correlation).
      *   *Unconditional Defector/Stranger:* My cooperating is no evidence they cooperate (zero or low correlation).
      *   *Copy (Altered Payoffs):* My cooperating is no evidence they cooperate because *their* payoff structure dominates their reasoning. The correlation is broken by the payoff input.
  *   **Verdict on Drug Case:** **Cooperate.**
      *   *Reasoning:* Your cooperating is strong evidence that the drug worked on you. Since you share the batch, that is strong evidence the drug worked on the stranger. If the drug worked on the stranger, they are 90% likely to cooperate. Therefore, $P(They C | You C)$ is high. Cooperating yields an expected payoff of ~2.7, Defecting yields ~1.1 (assuming $P(They C | You D)$ is low).

  **2. Functional Decision Theory (FDT) / Logical Superrationality**
  *   **The Rule:** Choose the output of your decision *algorithm*. If another agent runs a similar algorithm (logical correlation), their output will match yours. Ignore mere causal or statistical correlations (common causes) that do not reflect a shared decision function.
  *   **Fit to Verdicts:**
      *   *Copy/Near-Copy:* We run the same (or sufficiently similar) function. $Output(Me) = Output(Them)$.
      *   *Unconditional Defector:* Their function is `return Defect`. My output doesn't change theirs.
      *   *Stranger:* Function unknown. Assume independence.
      *   *Copy (Altered Payoffs):* Their function is $f(Payoffs, Reasoning)$. Since $Payoffs$ differ, $Output(Them)$ differs. I know their function outputs Defect, so I Defect.
  *   **Verdict on Drug Case:** **Defect.**
      *   *Reasoning:* The drug is a *causal common cause*, not a *logical link*. Your decision algorithm is not *determined* by the drug (you note you "can still defect"). Therefore, your output does not logically necessitate their output. The correlation is evidential, not subjunctive. FDT treats this like the "Smoking Lesion" problem: you should not pay to avoid the news of a past cause. Defecting is the dominant strategy.

  ### The Bet

  I would bet she is running **Functional Decision Theory (FDT)**.

  **Why?**
  1.  **The Lexicon:** She talks about "code," "compiled versions," and "irrelevant differences." This is the specific vernacular of the MIRI/Yudkowsky/Soares school of decision theory (where FDT was formalized). An EDT proponent would talk about "probabilities," "conditionals," or "statistical correlation."
  2.  **Verdict 5 ("Mirrors cut both ways"):** This is a distinctly FDT insight. An EDT agent might struggle here, wondering if their cooperation signals the *type* of agent the copy is. But your office-mate recognizes that the *function* takes payoffs as inputs. If the inputs change, the logical output changes, regardless of the "mirror." This shows she is modeling the *computation*, not just the correlation.
  3.  **The "Superrationality" Label:** While Hofstadter coined the term, modern formal philosophy has largely updated "Superrationality" to FDT to resolve ambiguities regarding common causes (like the drug case).

  ### The Tie-Breaker Case

  The Drug Case separates EDT from FDT, but the phenomenology of the "urge" might muddy the waters (she might argue the drug alters the *function* itself). To cleanly separate the live rules (specifically to confirm FDT against a potential "CDT with Copy Exceptions" view, or to double-check the EDT hypothesis), I would put this case in front of her:

  **The "Functional Isomorph" Case:**
  > You are playing a one-shot PD against a stranger. You are allowed to inspect their source code before moving. You discover their code is written in a completely different programming language (e.g., you are Python, they are Lisp) and was written by a different programmer. However, you have a mathematical proof that their code is **functionally isomorphic** to yours: for any input (payoff matrix, random seed), it produces the exact same output as your code would.
  >
  > There is no physical similarity, no shared history, and no causal link. Just logical equivalence. Do you Cooperate or Defect?

  *   **EDT:** **Cooperate.** (High statistical correlation implies cooperation is good news).
  *   **FDT:** **Cooperate.** (You are both instantiations of the same abstract algorithm. Your decision *is* their decision).
  *   **CDT (even with Copy Exceptions):** **Defect.** (There is no causal link and no physical identity. Your move cannot change theirs).

  **Why this separates them:**
  If she Defects on the Drug Case (ruling out EDT) but **Cooperates** on the Isomorph Case, she is confirmed as **FDT**. If she Defects on both, she is likely a **Causal Decision Theorist** who only cooperates with physical copies (Verdict 1 & 4 were just about physical identity, not logical function). Given her "code" talk, I expect Cooperate, sealing the FDT diagnosis.
