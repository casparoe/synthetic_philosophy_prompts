  - "ranked_by_severity": array of the "pair" values from worst to mildest, as two-element arrays.
  - "single_revision_that_cleans_up_most": the one change that kills the most tension at once, stated as a revised version of the specific numbered commitment.
  - "cost_of_that_revision": what it would commit me to that I probably don't want.
  - "commitments_that_survive_untouched": array of ids that come out clean.
  - "objections_that_dissolve": array of objects with "objection" (the friend's worry, in a few words) and "why_it_dissolves" (2-3 sentences), plus an "if_it_bites_after_all" field for any of them that only dies under one reading of my list — say which reading.

