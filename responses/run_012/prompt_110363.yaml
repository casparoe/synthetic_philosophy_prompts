prompt: |-
  My friend and I spent most of last night arguing about risk-weighted expected utility. She thinks it captures something real about rational risk aversion: when you face a lottery, you don't just weight each outcome by its chance, you weight it by a transformed cumulative chance, so the chance of the worst outcomes gets extra weight. I think that is either expected utility with extra steps or a model that gives up on the idea that rational choice maximizes expected value. We didn't settle it, and I want my students to feel the pull of both sides in their own choices rather than hear me summarize the debate.

  I teach an upper-level seminar in decision theory for philosophy students. There are 14 students, and I have one 90-minute session. Design an in-class activity—a betting market, an insurance game, or a structured series of forced choices—that makes them run into the difference between expected utility and risk-weighted expected utility before either view is named. The rules, roles, materials, and payoff scheme should not require real money. Ideally they first make choices that look risk-averse, then discover that those choices cannot be represented by any expected-utility function but can be represented by a risk-weighted one with a particular risk function; I would like them to infer or construct their own risk function from their choices before I supply the formal definition. Include a minute-by-minute timeline, a role for a risk auditor who computes each participant's implied risk function from their rankings, and lotteries with at least three outcomes so that rank-dependence actually matters. Then a debrief that maps what happened onto the formal machinery: the risk function, the cumulative weighting, the Allais-style pattern, and the distinction between risk aversion and outcome weighting. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about which feature of risk-weighted expected utility the activity cannot reproduce and that I will have to supply in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Risk-Weighted Expected Utility (REU) vs. Expected Utility (EU).
      *   **Goal:** Create an in-class activity where students *experience* the tension between EU and REU without prior formal definition. They should make choices, discover inconsistencies with EU, and infer a risk function.
      *   **Audience:** 14 upper-level philosophy students (decision theory seminar).
      *   **Time:** 90 minutes.
      *   **Constraints:** No real money. Needs a "Risk Auditor" role. Needs lotteries with $\ge 3$ outcomes (to show rank-dependence). Needs a minute-by-minute timeline. Needs a debrief mapping activity to formalism. Needs "what will go wrong" analysis. Needs honesty about limitations of the activity.
      *   **Key Concept:** REU (Buchak) transforms cumulative probabilities, not just utilities. It captures risk attitudes separately from utility curvature.

  2.  **Deconstruct the Theoretical Core:**
      *   *Expected Utility (EU):* $V(L) = \sum p_i u(x_i)$. Risk aversion is explained by concave $u$.
      *   *Risk-Weighted Expected Utility (REU):* $V(L) = u(x_1) + \sum_{i=2}^n [u(x_i) - u(x_{i-1})] \cdot r(P(X \ge x_i))$. Or more simply, weighting cumulative probabilities via a function $r(p)$. Risk aversion is explained by convex $r$ (weighting worst outcomes more).
      *   *The Conflict:* If a student prefers a sure thing over a gamble with higher EV, EU says their $u$ is concave. If they *also* violate the Independence Axiom (Allais pattern), EU breaks. REU can handle Allais violations without changing $u$.
      *   *The Challenge:* To show REU specifically, we need to separate risk attitude from utility curvature. Usually, this requires eliciting certainty equivalents for gambles with *fixed* utilities (e.g., points) but varying probabilities.
      *   *Rank Dependence:* To make rank dependence matter, we need at least 3 outcomes. If there are only 2 outcomes, REU looks like EU with a transformed probability. With 3+ outcomes, the weighting of the "middle" outcome depends on its rank.

  3.  **Designing the Activity:**
      *   *Format:* A series of forced choices (menus) rather than a betting market. Markets tend to converge on EV maximization due to arbitrage logic, which obscures individual risk attitudes. Forced choices reveal preferences directly.
      *   *Currency:* "Seminar Points" (SP) redeemable for a trivial privilege (e.g., picking the topic next week, leaving 5 mins early, or just bragging rights). Let's use "Privilege Points" redeemable for a small course benefit to ensure non-satiation without real money.
      *   *Structure:*
          1.  **Elicit Utility:** Establish that points map linearly to value (to isolate risk from utility curvature). *Correction:* If I tell them points are linear, they might act risk-neutral. If I don't, I can't distinguish $u$ curvature from $r$ curvature. *Better approach:* Use a very small range of points where marginal utility is roughly constant (e.g., 0 to 100 points), or explicitly stipulate that 1 point = 1 unit of value for the sake of the exercise. Let's stipulate linearity to isolate the *risk* component.
          2.  **The Choices:** Need an Allais-style setup but expanded to 3 outcomes to show rank dependence.
          3.  **The "Risk Auditor":** A student (or group) who tries to fit an EU function to the data, fails, then tries to fit an REU function.
      *   *Lotteries:* Need 3 outcomes: Low (0), Medium (M), High (H).
      *   *The Trap:* Create a set of choices where preferring the "safe" option in one pair and the "risky" option in another violates Independence (EU), but fits a convex risk function (REU).

  4.  **Drafting the Scenario (The "Insurance Game" vs. "Choice Menu"):**
      *   A choice menu is cleaner for eliciting specific violations.
      *   Let's create 4 Lotteries (A, B, C, D).
      *   Standard Allais:
          *   1A: 100% of \$1M.
          *   1B: 10% \$5M, 89% \$1M, 1% \$0.
          *   2A: 11% \$1M, 89% \$0.
          *   2B: 10% \$5M, 90% \$0.
      *   *Problem:* Standard Allais has 3 outcomes (\$0, \$1M, \$5M). This works.
      *   *Modification for Class:* Use points. 0, 50, 100.
      *   *Goal:* Students choose 1A over 1B (risk aversion) and 2B over 2A (risk seeking/less aversion). This violates Independence.
      *   *REU Explanation:* The risk function $r(p)$ is convex. The difference in weight between 100% and 89% is perceived as larger than the difference between 11% and 10%.
      *   *Wait, the prompt asks for students to infer their own risk function.* This requires more data points than just 2 pairs. I need a mechanism where they set a "certainty equivalent" or choose between varying probabilities.
      *   *Revised Plan:* "The Probability Slider."
      *   Students face a standard gamble (e.g., 50% chance of 100 pts, 50% chance of 0). They choose between this and a sure thing. We vary the sure thing.
      *   *Actually, to show Rank Dependence specifically:* We need to change the *ranking* of outcomes or the probability of the middle outcome while keeping the top/bottom fixed.
      *   *Let's stick to the Allais Common Consequence Effect but make it explicit.*
      *   *Activity:* "The Portfolio Selection."
      *   Students get 3 rounds of choices.
      *   Round 1: Establish baseline utility (0 vs 100).
      *   Round 2: Allais Pair 1 (High prob of medium gain vs. Gamble).
      *   Round 3: Allais Pair 2 (Low prob of medium gain vs. Gamble).
      *   *Risk Auditor:* Selected students who collect anonymous ballots and try to find a $u(x)$ that fits. They will fail. Then they try to find a $w(p)$ that fits.

  5.  **Refining the "Risk Auditor" Role:**
      *   It's hard for a student to calculate EU/REU live in 90 mins.
      *   *Solution:* Provide a worksheet with pre-calculated EU values for different $u$ curves, and REU values for different $r$ curves. The Auditor checks the class aggregate against the sheets.
      *   *Better:* The Auditor doesn't calculate *for* the class. The Auditor interviews 3 specific students who showed the "violation" pattern and tries to interview them to see *why*.
      *   *Best:* The Auditor is given the *aggregate* choices. They have a "EU Calculator" (a simple spreadsheet or lookup table) and an "REU Calculator." They see the EU calculator return "Error/Inconsistent" and the REU calculator return a specific curve (e.g., $r(p) = p^2$).
      *   *Simplification for Class:* Let's make the students *be* the auditor for themselves. They plot their own "Probability Weight."
      *   *Activity:* "The Certainty Equivalent Ladder."
      *   Gamble G: 50% chance of 100 pts, 50% chance of 0.
      *   Q1: Sure 40 vs G?
      *   Q2: Sure 50 vs G?
      *   Q3: Sure 60 vs G?
      *   This finds the CE.
      *   To show REU vs EU: We need to show that the risk attitude changes depending on the *context* (the other outcomes available), which EU forbids (Independence).
      *   *Okay, let's go with the Allais Common Consequence setup.* It's the most robust way to break EU.
      *   *Outcomes:* 0, 50, 100 Points.
      *   *Lottery A:* 100% chance of 50.
      *   *Lottery B:* 10% chance of 100, 89% chance of 50, 1% chance of 0.
      *   *Lottery C:* 11% chance of 50, 89% chance of 0.
      *   *Lottery D:* 10% chance of 100, 90% chance of 0.
      *   *EU Prediction:* If A > B, then C > D. If B > A, then D > C.
      *   *REU Prediction:* Can prefer A > B and D > C (Common Allais pattern).
      *   *Task:* Students choose. Auditor checks for consistency.

  6.  **Developing the "Risk Function" Inference:**
      *   If they violate EU, they can't map a $u(x)$.
      *   If they fit REU, they can map an $r(p)$.
      *   How to make them *construct* $r(p)$?
      *   Ask them: "What probability $p$ makes you indifferent between a sure 50 and a gamble ($p$ chance of 100, $1-p$ chance of 0)?"
      *   If EU (risk neutral), $p=0.5$. If risk averse, $p > 0.5$ (need better odds).
      *   Do this for different stakes? No, keep stakes fixed to isolate $r(p)$.
      *   Do this for different *ranks*?
      *   *Idea:* Ask for the "Price" of a ticket.
      *   Ticket 1: Win 100 if Die $\le 6$ (100%). Value = 100.
      *   Ticket 2: Win 100 if Die $\le 5$ (83%). Value = ?
      *   Ticket 3: Win 100 if Die $\le 1$ (16%). Value = ?
      *   Students assign "Certainty Equivalents" (Sure points they'd take instead).
      *   Plot Probability (x-axis) vs. Weight (y-axis).
      *   If linear, it's EU (risk neutral). If concave/convex, it's risk attitude.
      *   *Crucial Step:* To distinguish EU (concave $u$) from REU (convex $r$), we must stipulate $u(x) = x$. I will tell students "For this exercise, 1 Point = 1 Unit of Value." This forces risk attitude into the probability weighting.

  7.  **Timeline Construction (90 Minutes):**
      *   0-10: Intro & Rules (No real money, Points = Value).
      *   10-30: Phase 1 (The Choices). Allais Pairs + CE Elicitation.
      *   30-45: Phase 2 (The Audit). Risk Auditors analyze data.
      *   45-60: Phase 3 (The Discovery). Students plot their implied weights.
      *   60-80: Debrief & Formalism.
      *   80-90: Q&A / Wrap.

  8.  **Addressing "What Will Go Wrong":**
      *   *Confusion:* Students won't understand probabilities. *Fix:* Use dice or cards.
      *   *Boredom:* 14 students is small, but filling out sheets can be dull. *Fix:* Keep sheets short.
      *   *No Violations:* Some students might be risk-neutral. *Fix:* Group them by pattern.
      *   *Money:* They don't care about points. *Fix:* Make the prize desirable (e.g., "Drop the lowest quiz score").
      *   *Auditor Overload:* Calculating REU is hard. *Fix:* Provide a lookup table/graph paper.

  9.  **Addressing Limitations:**
      *   REU isn't just about Allais. It's about the *structure* of the risk function.
      *   The activity assumes $u(x)=x$. In reality, $u$ and $r$ are confounded. I must admit this in the debrief.
      *   REU violates State Dominance in some formulations (Buchak's version handles this, but it's tricky). I should mention the "Independence" violation specifically.

  10. **Refining the Activity for "Rank Dependence":**
      *   The prompt specifically asks for lotteries with *at least three outcomes* so rank dependence matters.
      *   The standard Allais Common Consequence effect uses 3 outcomes (0, 1M, 5M).
      *   However, to *construct* the risk function, they need to see how the weight changes as probability shifts.
      *   *Revised Activity:* "The Three-Tier Lottery."
      *   Lottery X: 33% High, 33% Med, 33% Low.
      *   Lottery Y: 33% High, 34% Med, 33% Low. (Shift probability from Low to Med).
      *   Lottery Z: 33% High, 33% Med, 34% Low. (Shift probability from Med to Low).
      *   In EU, the value change depends on $u(Med) - u(Low)$.
      *   In REU, the value change depends on $r(P(\ge Med)) - r(P(\ge Low))$.
      *   This is too complex for a 90-min class to calculate manually.
      *   *Pivot:* Stick to the Allais Common Consequence (3 outcomes: 0, 50, 100). It's the standard pedagogical tool for this. I will ensure the "Risk Auditor" focuses on the *cumulative* probabilities of the "Common Consequence" part.
      *   Actually, a simpler way to show rank dependence is to have them value a gamble where the *middle* outcome changes rank.
      *   Let's stick to the Allais Common Consequence. It's robust. I will explain in the debrief how the "89% chance of 50" acts as a rank-dependent weight.

  11. **Finalizing the Plan:**
      *   **Incentive:** "The Golden Ticket" (Skip one reading, or choose a discussion topic). 14 tickets available based on points.
      *   **Materials:** Choice Sheets, Dice (for randomness if needed, though hypothetical is fine for preference elicitation), Graph Paper for Auditors.
      *   **Auditor Role:** 2 students. They collect sheets. They look for the "Allais Pattern." They try to draw a line through the probability weights.
      *   **Inference:** Students calculate their own "Certainty Equivalent Probability."
      *   **Debrief:** Map the Allais violation to the convexity of the risk function $r(p)$.

  12. **Self-Correction on "Rank Dependence":**
      *   Does Allais show rank dependence? Yes, because the weight on the 1M outcome changes depending on whether it is the *best* outcome or the *middle* outcome (when 5M is introduced).
      *   In 1A/1B, 1M is the best (or tied). In 2A/2B, 1M is the best.
      *   Wait, the Common *Ratio* effect is clearer for probability weighting. The Common *Consequence* is clearer for rank dependence.
      *   Let's use the Common Consequence.
      *   Lottery 1: 100% of 50.
      *   Lottery 2: 10% of 100, 89% of 50, 1% of 0.
      *   Lottery 3: 11% of 50, 89% of 0.
      *   Lottery 4: 10% of 100, 90% of 0.
      *   Here, the 50 outcome is the *best* in L1/L3, but the *middle* in L2.
      *   This works.

  13. **Writing the Response:**
      *   Tone: Professional, pedagogical, frank about limitations.
      *   Structure: Activity Overview, Materials, Timeline, Role of Auditor, Debrief, Troubleshooting, Limitations.

      *(Self-Correction during drafting)*: Make sure the "Risk Auditor" has something concrete to do. Giving them a spreadsheet is cheating. Giving them graph paper and asking them to plot "Implied Probability Weight" is better.
      *   How to get "Implied Weight"?
      *   Ask: "At what probability $p$ are you indifferent between Sure 50 and Gamble ($p$ chance of 100, $1-p$ of 0)?"
      *   If they say $p=0.6$, then $r(0.6) \cdot 100 = 50 \rightarrow r(0.6) = 0.5$.
      *   This allows them to plot points on the $r(p)$ graph.
      *   I will add a "Calibration Phase" to the activity.

      *(Final check on constraints)*: 14 students. 90 mins. No real money. 3+ outcomes. Risk Auditor role.
      *   Okay, I will combine the Allais Choice (to break EU) with the Calibration (to build REU).

      *(Limitations)*: The activity assumes linear utility of points. I must emphasize this is a simplification. Real REU separates $u$ and $r$. This activity conflates them unless we assume $u(x)=x$. I will be frank about this.

      *(What will go wrong)*: Students treating it as a game to "win" rather than reveal preference. Students not understanding cumulative probability. Auditors getting stuck on math. I need to simplify the Auditor's task to "Pattern Matching."

      Let's assemble the plan.cw
answer: |-
  # Activity: The Weighted Die
  **Topic:** Distinguishing Expected Utility (EU) from Risk-Weighted Expected Utility (REU)  
  **Time:** 90 Minutes  
  **Class Size:** 14 Students  
  **Materials:** Choice Sheets (printed), Graph Paper (for Auditors), 6-sided dice (optional, for atmosphere), Whiteboard.  
  **Incentive:** "Seminar Privilege Points." The top 3 scorers get to choose one discussion topic for next month or drop their lowest quiz. (Ensures non-satiation without real money).

  ## 1. Conceptual Core
  The activity forces a violation of the **Independence Axiom** (which EU requires) using a 3-outcome Allais-style setup. Students then elicit their own **Certainty Equivalents** to plot an implied **Risk Function** $r(p)$. The "Risk Auditors" verify that no single utility function $u(x)$ fits the choices, but a convex risk function $r(p)$ does.

  ## 2. The Setup (Pre-Class Prep)
  *   **Utility Stipulation:** Explicitly tell students: *"For this exercise, assume 1 Point = 1 Unit of Value. Your utility function $u(x)$ is linear ($u(x)=x$). Any deviation from expected value maximization must be due to how you weight probabilities, not how you value points."*
      *   *Why:* This isolates the risk function $r(p)$ from utility curvature $u(x)$.
  *   **Outcomes:** 0 Points, 50 Points, 100 Points.
  *   **The Risk Auditor Role:** Select 2 students beforehand (or volunteer). They do not make choices; they collect data and perform the "consistency check."

  ## 3. Minute-by-Minute Timeline

  ### 0:00 – 0:10: Introduction & Stipulations
  *   Explain the "Privilege Points" incentive.
  *   **Crucial Rule:** "You are not trying to 'win' the most points mathematically. You are trying to report your *actual* preference. If you prefer a sure thing over a gamble with higher expected value, mark it. We are testing rationality, not arithmetic."
  *   Distribute **Choice Sheets**.

  ### 0:10 – 0:35: Phase 1 — The Choice Menus (Eliciting Violations)
  Students privately complete two sections on their sheet.

  **Section A: The Allais Common Consequence (3 Outcomes)**
  *   **Choice 1:**
      *   Option **Safe**: 100% chance of 50 Points.
      *   Option **Risky**: 10% chance of 100, 89% chance of 50, 1% chance of 0.
  *   **Choice 2:**
      *   Option **Safe'**: 11% chance of 50, 89% chance of 0.
      *   Option **Risky'**: 10% chance of 100, 90% chance of 0.

  *Instruction:* "Circle your preferred option in each pair. There is no right answer."

  **Section B: The Probability Ladder (Eliciting Weights)**
  *   **Question:** "Imagine a Gamble: 50% chance of 100 Points, 50% chance of 0 Points."
  *   **Task:** "What is the *minimum* sure amount of points you would accept to trade away this gamble?" (Certainty Equivalent).
      *   Options: [30] [40] [50] [60] [70]
  *   **Question:** "Imagine a Gamble: 10% chance of 100 Points, 90% chance of 0 Points."
  *   **Task:** "What is the *minimum* sure amount of points you would accept to trade away this gamble?"
      *   Options: [5] [8] [10] [12] [15]

  ### 0:35 – 0:50: Phase 2 — The Audit
  *   Students hand sheets to the **2 Risk Auditors**.
  *   **Auditor Task 1 (The EU Check):** The Auditors look for the "Allais Pattern" (Preferring **Safe** in Choice 1 AND **Risky'** in Choice 2).
      *   *Instruction to Auditors:* "Count how many students chose Safe/Risky'. If this number is greater than 0, Expected Utility Theory (with linear utility) is violated. Write 'EU FAILED' on the board."
  *   **Auditor Task 2 (The REU Construction):**
      *   The Auditors take the aggregate data from Section B.
      *   They calculate the "Implied Weight" for the class.
      *   *Formula:* If the class average Certainty Equivalent for the 50/50 gamble is 40 points:
          *   $Value = r(0.5) \times 100 + (1-r(0.5)) \times 0 = 40$
          *   Implied $r(0.5) = 0.4$.
      *   They plot these points on graph paper on the board: X-axis = Objective Probability ($p$), Y-axis = Implied Weight ($r(p)$).
      *   They draw a curve through the points.

  ### 0:50 – 1:05: Phase 3 — Small Group Diagnosis
  *   Divide class into 3 groups.
  *   **Group 1 (The EU Defenders):** Try to argue why the Allais Pattern *could* be rational under EU. (They will struggle).
  *   **Group 2 (The REU Architects):** Look at the Auditors' graph. Is the line straight? If it curves, which way? What does that say about how we treat small probabilities vs. medium ones?
  *   **Group 3 (The Rank Detectives):** Look at Choice 1 vs Choice 2. In Choice 1, the 50 points is the *middle* outcome (between 0 and 100). In Choice 2, the 50 points is the *best* outcome. Did the value of 50 points change? Why?

  ### 1:05 – 1:20: Debrief & Formal Mapping
  *   **Instructor Lecture:** Connect their activity to the formalism.
      1.  **The Violation:** The Allais Pattern violates Independence. EU cannot explain it without changing $u(x)$ mid-game.
      2.  **The Risk Function:** Show the Auditors' graph. If it is concave (below the diagonal), you are risk-averse. This is $r(p)$.
      3.  **Rank Dependence:** Explain that in REU, the weight on an outcome depends on its rank. In Choice 1, the 89% chance of 50 is weighted differently than in Choice 2 because the *cumulative* probability shifted.
      4.  **Formula:** Write the REU formula: $REU = u(x_1) + \sum [u(x_i) - u(x_{i-1})] \cdot r(P(X \ge x_i))$.
      5.  **Map Activity to Formula:** Show how the "Safe" option in Choice 1 gets a boost because $r(1.0)$ is disproportionately high compared to $r(0.89)$.

  ### 1:20 – 1:30: Q&A and Limitations
  *   Open floor for the "Friend's Argument" (from your prompt).
  *   Discuss what the activity hid (see "Limitations" below).

  ## 4. The Risk Auditor's Worksheet (Handout)
  *To ensure they don't get stuck on math.*

  **Task 1: Consistency Check**
  Count the ballots.
  *   Count (Safe + Risky'): ______
  *   If Count > 0, EU is inconsistent with these preferences (assuming linear utility).

  **Task 2: Plotting the Risk Function**
  Use the class average Certainty Equivalents (CE) from Section B.
  1.  **Gamble 1 (50% chance of 100):** Average CE = ______.
      *   Calculation: $r(0.5) = \text{Average CE} / 100$.
      *   Plot point (0.5, $r(0.5)$).
  2.  **Gamble 2 (10% chance of 100):** Average CE = ______.
      *   Calculation: $r(0.1) = \text{Average CE} / 100$.
      *   Plot point (0.1, $r(0.1)$).
  3.  **Anchor:** We know $r(1.0) = 1$ and $r(0) = 0$. Plot these.
  4.  **Draw:** Connect the dots. Is it a straight line (EU) or a curve (REU)?

  ## 5. Predictable Failures & Mitigation

  | What Will Go Wrong | Why | How to Handle It |
  | :--- | :--- | :--- |
  | **Students maximize EV** | Philosophy students often default to "rational = EV maximizer" to look smart. | **Pre-empt:** Explicitly say, "Risk aversion is rational in this seminar. Choosing the sure thing is not a mistake." |
  | **Auditors get bogged down** | Calculating averages for 14 students takes time. | **Simplify:** Have auditors just sample 5 random sheets live at the front. Or pre-calculate the averages on a hidden slide and reveal them if auditors stall. |
  | **Confusion on "Rank"** | Students won't see why 50 points changes rank between Choice 1 & 2. | **Visual Aid:** Draw the outcome ladders on the board. In Choice 1, 50 is the floor of the top tier. In Choice 2, 50 is the ceiling of the only non-zero tier. |
  | **No Allais Violations** | With only 14 students, you might get all EU-consistent choosers. | **Backup:** Have a prepared dataset from a previous run (or hypothetical) that *does* show the violation. Say, "In larger samples, this pattern emerges. Let's analyze *why* it would be rational if it did." |
  | **Utility vs. Risk Confusion** | Students will argue they chose Safe because 50 points is "worth more" than half of 100. | **Reiterate Stipulation:** Remind them of the $u(x)=x$ rule. "We are forcing utility to be linear to see the risk weighting clearly." |

  ## 6. Limitations (For the Debrief)
  Be frank with the students about what the activity *cannot* do. You must supply these in the lecture portion:

  1.  **The Conflation of $u$ and $r$:** In the activity, we stipulated $u(x)=x$. In reality, we cannot observe $u$ and $r$ separately just from choices. A choice could be due to concave utility (diminishing marginal value) OR convex risk weighting (fear of risk). REU claims these are distinct psychological features, but eliciting them requires much more complex data than we had today.
  2.  **State Dominance:** Some versions of risk-weighting can violate State Dominance (preferring a gamble that yields less in every state). Buchak's REU avoids this, but the simple "weighting" intuition can lead students there. You must clarify that REU weights *cumulative* probabilities, not states directly.
  3.  **Dynamic Consistency:** The activity is one-shot. REU can lead to dynamic inconsistency (planning to take a risk, then becoming risk-averse when the moment arrives). The activity cannot reproduce this "time travel" problem.
  4.  **The "Common Consequence" Nuance:** The activity uses the Common Consequence effect. REU also explains the Common Ratio effect. The specific shape of the risk function $r(p)$ needed to explain both simultaneously is constrained. The activity only hints at the shape.

  ## 7. Why This Works for Your Debate
  *   **For your Friend:** The Auditors' graph will likely show a curve (convex/concave). This visually proves "weighting transformed cumulative chance" is a coherent mathematical object that fits their choices better than a straight line.
  *   **For You:** The stipulation that $u(x)=x$ is artificial. In the debrief, you can highlight that without that stipulation, their choices *could* just be standard EU with a concave utility function. This preserves your point that REU might be "EU with extra steps" unless we have independent access to utility.
  *   **For the Students:** They leave having *generated* the risk function themselves, rather than being told it exists. They feel the "pull" of the Allais violation personally.
