answer: |-
  1. **The Grounding Worry:** You claim there's no intrinsic fact that makes this object a "lump" and that one a "statue," yet they have different modal profiles; if nothing in the world fixes which sortal applies, aren't you just positing a brute, unexplainable metaphysical coincidence?
     *Follow-up:* If it's brute, what stops me from saying *any* sortal applies, rendering your modal constraints toothless?

  2. **The Counting Problem:** If the statue and the lump are numerically distinct, when I ask "how many things are on the pedestal," is that question ill-formed unless I specify "how many *statues*" or "how many *lumps*"?
     *Follow-up:* So are you committed to saying that unrestricted quantification over "objects" is metaphysically incoherent?

  3. **Mind-Dependence:** If sortals aren't grounded in the material structure, do they depend on our conceptual schemes, meaning there would be no statues in a universe devoid of thinkers?
     *Follow-up:* Is that anti-realism about artifacts a cost you're willing to accept to save the distinctness thesis?

  4. **Deflationism:** A deflationist might say that if there's no fact of the matter about which sortal applies, the dispute over whether they are "one thing or two" is merely verbal; what substantive work is the claim of numerical distinctness actually doing?
     *Follow-up:* If it doesn't change the causal story, why insist on two entities rather than one described in two ways?

  5. **Historical Comparison:** How does your view improve upon Peter Geach's relative identity or Gibbard's contingent identity, since they also tried to handle modal differences without multiplying entities in the way you do?
     *Follow-up:* Do you avoid Geach's transitivity problems simply by biting the bullet on co-location instead?

  6. **Causal Exclusion:** If the statue and the lump are distinct but share all the same matter and location, don't they causally overdetermine every effect, like two distinct causes producing one squashing?
     *Follow-up:* Is positing systematic causal overdetermination a fair price for preserving Leibniz's Law?

  7. **Sortal Vagueness:** If sortal application isn't grounded in intrinsic facts, how do you handle borderline cases where it's vague whether something counts as a "statue" or just a "lump"?
     *Follow-up:* Does this mean identity itself becomes vague, or do we just have epistemic uncertainty about our own conventions?

  8. **Essential Properties:** You say modality is sortal-relative, but does the object have *any* non-relative essential properties, or is its entire modal profile exhausted by the sortals we impose?
     *Follow-up:* If it's the latter, isn't the "object" itself just a bare particular waiting for us to give it an essence?

  9. **Ockham's Razor:** Since the statue and the lump share all physical properties and causal powers, doesn't positing two numerically distinct entities violate the principle of parsimony without sufficient gain?
     *Follow-up:* Is the "gain" simply that we get to keep classical logic intact at the expense of ontological bloating?

  10. **The "What Is It?" Question:** If I point to the co-located pair and ask "what is *that*?", and you say the answer depends on my intent rather than the object, haven't you made ontology dependent on psychology?
      *Follow-up:* Does this shift metaphysics from a study of the world to a study of how we carve the world?
