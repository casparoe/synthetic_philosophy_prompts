  Ok this is a wierd one but it's definately taken over my evenings. My flatmate and I have a running fight about cutting a round cake with one straight cut, specifically how often the cut lands within half a radius of the centre. We each wrote a tiny simulation. He picks two random points on the rim and joins them and gets about a third. I pick a random angle plus a random distance out from the centre and get about a half. A third version, where you pick a random point in the cake and cut straight across through it at right angles to the radius, gave us a quarter. He's now declared that this is Bertrand's paradox, that the principle of indifference is dead, and that a random cut is just a meaningless phrase. I don't buy it and I keep losing the argument, so I want you to make the case for my side: indifference is fine, and what's actually broken is the idea of a random chord, not the idea of indifference. I've read enough of the wikipedia page to know the standard move is to say at random is ambiguous, so don't just hand me that line, I want the real argument, and no citations please, I'm not going to read them.

  The thing I keep groping for and can't say properly: sliding the cake sideways or spinning it round shouldn't change the answer, and my version seems to be the only one that survives that test, but he says that's circular since you can rig any method to be symmetric about something. He also reckons the symmetry trick is a fluke of the flat case, because for a spherical cake, spinning the ball around tells you nothing at all about how far off-centre the cut lands.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no summing up at the end, and put the position itself in point one. After that I want the distinction that's doing the real work, what it says about our three simulations, the strongest version of his side plus your reply to it, and finally what would actually change your mind, including whether the spherical cake breaks the defence or whether you just need to slide the setup as well as spin it.
