answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Wren Valley Community Trust
  **FROM:** Chair, Board of Directors
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Claims Rule for Descendant Class

  **1. Executive Summary**

  We are one week away from voting on the claims rule for the Wren Valley settlement fund. The current "but-for" standard (comparing a claimant's actual life to the life they would have had if the dam were never built) works for the surviving elders, but it fails for their descendants. Our actuary estimates 94% of descendant claims will fail this test, triggering a reversion clause that sends the remaining nine-figure surplus back to the utility company.

  After reviewing the three proposals on the table, I recommend we adopt **Position 2: The Lineage Rule**.

  This approach treats the four flooded villages as continuous communities rather than collections of individuals. Compensation flows to verified descendants as heirs to the community's loss, regardless of whether the specific individual would have been born "but-for" the dam. This memo explains why this is the only viable path that honors the settlement's intent, satisfies the charter's legal requirements, and prevents the wrongdoer from profiting from the error.

  **2. The Core Problem**

  We are facing a logical trap. The charter requires us to compensate "those who suffered loss as a result of the resettlement."

  For the elders who lived through the move, the math is simple. They lost a farm, a home, or a livelihood. They exist in both scenarios (with the dam and without it), so we can calculate the difference.

  For the children and grandchildren, the math breaks. Because their grandparents met, married, or moved *because* of the resettlement, most of these people would not exist if the dam hadn't been built. Under a strict reading, they cannot claim they are "worse off," because the alternative was never being born at all. If we stick to the strict math, we cannot pay them. If we cannot pay them, the money goes back to the utility.

  **3. Evaluation of Options**

  **Option 1: Strict But-For (Reject)**
  *The Proposal:* Pay only claimants who prove they would have existed anyway and were financially harmed. Return the surplus.
  *The Argument:* This is the safest legal interpretation. It adheres strictly to the text of the charter.
  *Why We Must Reject It:* While legally tidy, it is morally untenable and practically self-defeating. It acknowledges the utility doctored geological surveys to steal land, yet rewards them with unspent funds because their displacement was *so effective* it changed the genealogy of the victims. It treats the charter as a logic puzzle rather than a remedy for harm. If 94% of the affected family tree is excluded, we have failed the mission of the Trust.

  **Option 3: Well-Being Floor (Reject)**
  *The Proposal:* Pay a fixed sum to anyone below an income threshold, ignoring the "but-for" question entirely.
  *The Argument:* This ensures the money helps people in need and stays out of the utility's hands.
  *Why We Must Reject It:* This severs the link between the payment and the dam. The charter mandates compensation for loss *as a result of the resettlement*, not general poverty alleviation. If we pay based solely on current income, we open ourselves to legal challenge from the utility for breaching the settlement agreement. Furthermore, it insults the specific harm done: a wealthy descendant of the valley still inherits the loss of their heritage, while a poor person with no connection to the valley has no claim. We cannot turn this into a general welfare fund without risking the entire settlement.

  **Option 2: The Lineage Rule (Recommend)**
  *The Proposal:* The harm was done to the villages as continuing entities. Compensation is owed to the lineage that carries the community forward.
  *Why We Should Adopt It:* This is the only option that aligns the moral imperative with the legal charter. The "loss" is not just economic; it is the loss of place, continuity, and inheritance. When the utility flooded the valley, they severed the roots of a community. That injury persists through the generations. The descendants are not claiming for their own birth; they are claiming as heirs to the community that was destroyed.

  **4. Addressing the Objections**

  **The Lawyer's Concern (Charter Language)**
  Our counsel worries that "Lineage" stretches the definition of "suffered loss."
  *Counter-Argument:* We are not changing the charter; we are interpreting the nature of the loss. The charter compensates for loss "as a result of resettlement." The resettlement destroyed a community. A community is more than the sum of its current residents; it is a lineage. By paying the descendants, we are compensating for the *inherited dispossession*. The loss is the severing of the tie to the Wren Valley. Every descendant carries that severed tie. This interpretation keeps the money within the class of victims defined by the settlement, satisfying the charter's intent even if it stretches the strict "but-for" syntax.

  **The Treasurer's Concern (The Slippery Slope)**
  The Treasurer asks: "If we pay because the dam changed who got born, do we owe everyone whose parents met at a terrible party?"
  *Counter-Argument:* No. There is a fundamental difference between *random chance* and *structural erasure*.
  1.  **Intent and Foreseeability:** The utility intentionally displaced a population to build infrastructure. They knew families would relocate and rebuild. The "terrible party" is random; the dam was a deliberate engineering and legal act that reshaped the demographic landscape.
  2.  **The Nature of the Harm:** The dam didn't just move people; it erased a *place*. The compensation is for the loss of the Wren Valley as a home. A descendant inherits the claim to that specific place. A person whose parents met at a party does not inherit a claim to a destroyed homeland. We are drawing a line around the *community*, not around the *conception event*.

  **5. Implementation Plan**

  To make the Lineage Rule work, we need clear administrative rules. We cannot simply open the gates; we must verify the link to the original harm.

  **A. Who Decides (The Claims Committee)**
  We will form a three-person Claims Committee to adjudicate individual applications.
  1.  One Board Member (rotating).
  2.  One Independent Administrator (hired specifically for this process, e.g., a special master or senior claims adjuster).
  3.  One Community Representative (elected by the descendant association).
  *Reasoning:* This balances our fiduciary duty with community trust. The Independent Administrator ensures consistency; the Community Representative ensures we don't lose sight of the human element.

  **B. Standard of Proof**
  Claimants must provide genealogical documentation linking them to a resident of one of the four flooded villages as of 1964.
  *   **Required:** Birth certificates, census records, or church records establishing a direct line of descent.
  *   **Not Required:** Proof of economic hardship. Proof of "but-for" existence.
  *   **Verification:** We will hire a third-party genealogy firm to validate the records against the original 1964 resettlement lists.
  *   **Rationale:* This creates an objective, binary test. You are either of the lineage or you are not. It removes the impossible burden of proving a counterfactual life.

  **C. Timeline**
  *   **Month 1-2:** Notification period. Public notice in Carverton and surrounding areas, plus direct mail to known families.
  *   **Month 3-8:** Claims window open. Claimants submit documentation.
  *   **Month 9-11:** Adjudication. The Claims Committee reviews submissions.
  *   **Month 12:** Final payout and closeout.
  *   **Rationale:* We need to move efficiently to prevent administrative costs from eating the fund, but slowly enough to allow elderly descendants to gather records.

  **6. Financial Structure**

  To address the concern that a per-capita split might shortchange the surviving elders (who have direct economic losses), we will structure the payout in two tiers:
  1.  **Tier 1 (Original Displacees):** Elders who were personally moved in 1964 are compensated under the existing "but-for" economic model. Their claims are paid first.
  2.  **Tier 2 (Descendants):** The remaining fund balance is distributed per-capita to verified descendants under the Lineage Rule.

  This ensures the elders are made whole on their specific economic losses, while the descendants are compensated for the inherited loss of community.

  **7. Conclusion**

  We are hydrologists, engineers, and administrators. We understand that when you dam a river, the water doesn't stop; it finds a new path. The harm done in Wren Valley did not stop in 1964. It flowed down through the generations.

  Option 1 ignores the flow. Option 3 floods the wrong field. Option 2 follows the water. It recognizes that the injury was to the root system of these families. By adopting the Lineage Rule, we fulfill the promise of the settlement, keep the funds within the victim class, and ensure the utility does not profit from the fact that their injustice was thorough enough to change the future.

  I ask that you review this recommendation before next Thursday's session. I am prepared to move for adoption at that time.
