answer: |-
  Here is a precis of the distinct claims embedded in "beyond the call of duty," ordered by their argumentative weight and utility.

  ### 1. The Logical Boundary (The Platitude)
  **The Claim:** The set of morally good actions is larger than the set of morally required actions.
  **Translation:** "You did something good, but you didn't *have* to."
  **Status:** **Platitude.** Almost no ethical system requires every possible good deed.
  **Speaker Intent:** The ethicist likely started here. It is the safest, most defensible anchor.
  **Does it license "not owed"?** Yes, but trivially. It defines "owed" as "required," but doesn't tell us where the line is.

  ### 2. The Immunity Claim (The Substantive Defense)
  **The Claim:** Omission of this act does not attract moral blame, punishment, or sanction.
  **Translation:** "If you don't do this, you are not a bad person, and we cannot punish you."
  **Status:** **Substantive Claim.** This is the core of supererogation. It protects the agent from guilt.
  **Speaker Intent:** The ethicist and the bystander case rely on this. It protects the off-duty clinician or the passerby from being castigated as *unjust*.
  **Does it license "not owed"?** Yes. If you cannot be blamed for skipping it, it is not a debt.
  **Vulnerability:** This collapses if the cost of acting is low (the drowning case) or if the agent has a specific capacity others lack.

  ### 3. The Standing Claim (The Political Move)
  **The Claim:** Because the act is optional, the beneficiary has no standing to demand it, resent its absence, or negotiate conditions surrounding it.
  **Translation:** "Since you didn't have to show up, you don't get to complain about how we treat you while you're here."
  **Status:** **Substantive (and Contested).** This moves from the morality of the *act* to the rights of the *person*. It argues that voluntary participation waives certain rights to complaint.
  **Speaker Intent:** **The Administrator.** This is the most dangerous reading in your list. It uses the "gift" of labor to silence labor rights.
  **Does it license "not owed"?** **Yes.** This is the specific reading that blocks claims for better conditions. It argues that gratitude replaces justice.

  ### 4. The Contractual Cap (The Institutional Shield)
  **The Claim:** "Duty" is defined exhaustively by the job description, contract, or pledged amount. Anything outside those documents is strictly optional.
  **Translation:** "We pledged $X; we hired you for Y hours. The crisis is not our problem."
  **Status:** **Substantive (Bureaucratic).** It treats duty as a legalistic boundary rather than a moral one.
  **Speaker Intent:** **The Wealthy States.** This allows them to claim moral adequacy ("we met our pledge") while ignoring moral necessity ("the need exceeds the pledge").
  **Does it license "not owed"?** **Yes.** It redefines "owed" as "contractually stipulated."

  ### 5. The Conversation Ender (The Cynical Cap)
  **The Claim:** Labeling an act "beyond duty" marks the outer limit of what can be asked, effectively forbidding any social pressure to expand the definition of duty.
  **Translation:** "Stop asking. This is the maximum. We cannot be expected to do more, ever."
  **Status:** **False / Manipulative.** This treats the line between duty and supererogation as static, when it is actually dynamic and responsive to need.
  **Speaker Intent:** **All speakers, implicitly.** It shuts down the follow-up question.
  **Does it license "not owed"?** **Yes, by fiat.** It prevents the category of "duty" from expanding to meet the crisis.

  ***

  ### Which reading licenses the conclusion that nothing is owed?
  **Reading 3 (The Standing Claim)** and **Reading 5 (The Conversation Ender)** do the heaviest lifting here.

  Reading 1 and 2 merely say the clinician/volunteer isn't *guilty* for staying home. They do not inherently prevent the hospital from saying, "If you *do* come, you are owed safety."
  Reading 3 explicitly argues that the *voluntary nature* of the act voids the *reciprocal obligations* of the institution. It converts a labor relationship into a charitable donation. This is the reading that licenses the administrator's implication that volunteers have no standing to complain.

  ### What would change the verdict? (Moving from Defensible to Untenable)

  To challenge these speakers, you need to show that the conditions for **Reading 2 (Immunity)** or **Reading 4 (Contract)** have been violated. Here is what moves a reading from defensible to untenable:

  **1. The "Normalcy" Shift (Attacks Reading 4)**
  *   **Argument:** If the "surge" becomes the permanent state, the "extra" shift becomes the "basic" shift.
  *   **Verdict Change:** If the emergency is enduring, the Contractual Cap fails. Duty expands to meet the new normal. If the hospital relies on "beyond duty" labor to function baseline, that labor is no longer supererogatory; it is structural.
  *   **Where reasoning might fail:** Defining the threshold. How long must a surge last before it becomes duty?

  **2. The "Uniqueness" Condition (Attacks Reading 2)**
  *   **Argument:** Supererogation usually assumes someone else *could* do the job. If the off-duty clinician is the *only* person with the skills to save the patient, the cost of omission rises.
  *   **Verdict Change:** If capacity is unique and the need is dire, the "Immunity Claim" weakens. The drowning case is the classic example: low cost to savior, high cost to victim. If the clinician's risk is manageable but the patient's death is certain without them, "beyond duty" slides toward "obligation."
  *   **Where reasoning might fail:** Assessing risk. If the clinician risks infection/death, the "low cost" argument fails, and supererogation holds.

  **3. The "Waiver" Fallacy (Attacks Reading 3)**
  *   **Argument:** Volunteering labor does not waive human rights or safety standards.
  *   **Verdict Change:** This makes Reading 3 **False**. One can voluntarily enter a dangerous situation (a firefighter entering a burn) without waiving the right to reasonable safety measures (functional equipment). The "gift" of labor does not purchase the right of the administrator to be negligent.
  *   **Where reasoning might fail:** Explicit contracts. If the volunteer signed a waiver acknowledging specific risks, the standing claim regains legal (if not moral) weight.

  ### Interview Strategy
  The ethicist gave you **Reading 1** to protect against **Reading 2**. The administrator is using **Reading 3** to enforce **Reading 5**.

  **The Pivot Question:**
  *"You've defined these shifts as supererogatory to protect the clinicians from blame if they refuse. But does that label also protect the institution from obligation if they accept? If we classify this labor as a 'gift' rather than a 'duty,' does that inadvertently license the hospital to treat it as disposable?"*

  This forces them to admit whether "beyond duty" is a shield for the worker (defensible) or a sword for the employer (cynical).
