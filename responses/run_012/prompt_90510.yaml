answer: |-
  A consequentialist friend stopped trying to improve the world. I asked why. She said, "Under Solomonoff induction, the highest-weight hypotheses are short programs. The shortest ones that generate observers don't filter for happiness; they just enumerate everything. So most of the expected value is in unreachable simulations generated by code too simple to care." I said, "That sounds like a malign prior." She said, "No, it's not malicious; it's just that 'run everything' has lower Kolmogorov complexity than 'run only good things.'"

  The punchline hinges on the distinction between the prior's weighting mechanism (program length) and the semantic content of the output (suffering versus flourishing). It fails if the listener assumes the prior assigns probability *because* the hypothesis is bad, rather than because the program is short enough to generate vast numbers of observers regardless of their state.
