      *   *Rank 2:* Measurement Costs. In real hardware, measurement dissipates. Landauer says it *doesn't have to*. If it *always does* practically, Landauer is theoretically correct but practically irrelevant.
      *   *Rank 3:* Fluctuation Theorems. 2nd Law is statistical. Demon is just waiting for a fluctuation.
      *   *Rank 4:* Correlations. You can cheat if you have prior info. But getting that info cost something.
      *   *Experiments:* They measure the heat of bit flip. They don't build a working demon.
      *   *Law vs. Bookkeeping:* It *is* bookkeeping. That's what stat mech is.

  7.  **Final Review against constraints:**
