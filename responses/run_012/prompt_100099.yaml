answer: |-
  Good evening. You asked me to stand here. You know why. For thirty years, she sat behind the copy desk, bathed in that green-shaded lamp light, holding a red pen like a scalpel. We all feared that pen. I feared it. When I started here, I wrote sentences that sprawled. She cut them. I used words to hide. She exposed them. She taught us that fuzzy writing lets fuzzy politics survive. She taught us that jargon is a coward's armor.

  Most of you in this room learned to write because of her. You know the rule: Subject, verb, object. Truth, straight line, reader. We believe that clarity is a moral act. She taught us that. But she also taught us something else, something she only whispered when the newsroom emptied out and the coffee machine gurgled alone.

  She told me once, leaning against the counter, steam rising from her mug, that clarity is also a weapon.

  We think plain style belongs to the honest. She argued it often belongs to the loud. When you demand someone speak clearly, you demand they speak your language. You demand they strip away the only protection they have. She believed that some truths about power cannot survive direct sunlight. They wilt. They die. Or worse, they get you fired. Sometimes, to tell the whole truth, you must speak sideways. You must use allusion. You must leave a shadow where the light feels too hot.

  She didn't teach us to lie. She taught us to measure the cost of precision.

  Think about the stories we didn't run. Think about the sources we protected. We didn't write their names. We didn't write their specific words. We wrote around them. We used the passive voice. *Mistakes were made.* She hated that phrase. She circled it in red every time. But she also knew why we used it. Sometimes the actor must vanish so the action remains. Sometimes safety requires a fog.

  This is her heresy. The gospel of plain style says the sun must shine everywhere. She said some things grow only in the shade.

  To her family: You know this side of her. You know she wasn't just a machine for correcting grammar. You know she loved the mess. She loved the Sunday morning chaos. She loved the way a story changes when you tell it at a dinner table versus how it looks in print. She knew that life resists the headline. She knew that love, specifically, refuses to be concise. You cannot sum up thirty years of marriage in a lead paragraph. You cannot capture a childhood in a sidebar. She never tried. She let those things breathe. She let them remain complex.

  To the reporters: Do not mistake this for permission to be sloppy. She would haunt you if you wrote a lazy sentence. She demands precision. But she also demands you know *why* you choose precision. Are you clarifying to help the reader understand? Or are you clarifying to force the world into a box that fits your deadline?

  She is leaving the desk. The red pen goes into the drawer. But the lesson stays.

  We want to wish her well. We want to say she is "starting a new chapter." I won't say that. Books have chapters. Lives have continuities. She isn't turning a page. She is walking into a room without deadlines. She is walking into a space where she doesn't have to decide what fits and what gets cut. She can let the sentences run long. She can let the meaning settle where it lands.

  She protected us from our own worst instincts. She protected the paper from our errors. But she also protected the truth from our arrogance. She knew that we don't own the story. We just borrow it for a day.

  So, we raise a glass. Not to clarity. Not to obscurity. To the judgment to know the difference.

  She taught me to write so people understand. But she also taught me to listen when people hesitate. She taught me that the pause matters. The hesitation matters. The thing unsaid matters.

  Thank you for thirty years of vigilance. Thank you for the red ink. Thank you for the shadows you knew we needed.

  We will miss you.
