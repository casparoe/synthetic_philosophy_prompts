      *   **Constraint 1 (Content):** Must actually make her case (the value of indirection/murk), not just mention it.
      *   **Constraint 2 (Style):** No dead metaphors, no prefab phrases, no passive voice ducking. *However*, if honoring her argument means breaking the "plain style" rule, do it on purpose so the room feels why.
