prompt: |-
  Right, so I've somehow ended up as the person who has to write the reconciliation document for our privacy reading group, and I need your help drafting it properly rather than doing what I did last time, which was to write "they basically agree" in an email and get shouted at for a fortnight.

  The setup: two of our regulars have been arguing since January. One of them (she calls herself an instrumentalist and is happy with the label) thinks privacy is only ever valuable downstream — it's a means to autonomy, intimacy, a life you can revise, protection from discrimination, room to be embarrassing in. Strip out all the downstream conseqences and there's nothing left to lose. The other one (she says the value is constitutive — her word, I'm not sure it's the right one) thinks that's backwards: part of the value is internal to being a person at all, so being observed can be a loss even in a world where no consequence ever follows from the observation, nobody judges you, nobody acts on it, and you never find out.

  I don't want a verdict on who's right. I want the document they should have produced months ago, that both of them could actually sign. So:

  1. The agreed claims. What can both put their names to about what privacy is (a right? a condition? a bundle of claims against other people? a social good? a relation between a person and an audience?), about what counts as a privacy loss at all, about the cases they keep re-litigating, and about what would count as evidence one way or the other. Watch out for the fudge where 'privacy' quietly starts meaning 'the good things privacy brings' — if the instrumentalist can't say her thing without begging the question against the other one, say so rather than papering over it.

  2. Where they actually part. Each side's position stated in wording the other side would accept as fair, even though they reject it. This is the bit I most need, because they are both terrible strawmanner, and half the year's argument has been about positions neither of them holds.

  3. The cruxes — the sub-questions where settling it would move at least one of them. My guesses, tell me if I'm off: whether the kind-observer case (perfectly discreet, never judges, never acts, subject never learns) is a loss or a non-event; whether an exposure nobody ever exploits is a harm or merely a risk of harm; whether the thing of value is control over the information or something that control is itself downstream of; and whether they're even talking about the same object, given that one of them pictures a teenager's bedroom and the other pictures a data broker. One of them thinks privacy is mainly a shield and the other thinks it's mainly a hoard, and if that's a verbal dispute I want it named as one rather than dressed up as a substantive crux.

  4. For each crux, a case or consideration both sides agree bears on it, with each side's prediction written down in advance. Invent cases freely, as long as both camps would accept them as fair. If you can invent one that separates 'the information exists and is held' from 'anyone uses it or could use it', please do — I've tried and I keep smuggling consequences back in through the side door. Two sharp cases beat six soggy ones.

  Format: numbered agreed-claims section, then a table for the disagreements and cruxes. Please use British spelling throughout, the journal we're sending it to is fussy and I've already been told of once. And no citations or reading lists — we've had enough of that, and neither of them is going to be won over by a footnote anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested reconciliation document:

  1.  **Analyze the Request:**
      *   **Task:** Draft a reconciliation document for a privacy reading group.
      *   **Context:** Two regulars have been arguing since January. One is an *Instrumentalist* (privacy is valuable for downstream consequences: autonomy, intimacy, etc.). The other is a *Constitutivist* (privacy has intrinsic value; being observed is a loss even without consequences).
      *   **Goal:** A document both can sign. No verdict on who is right. Needs to clarify agreed claims, state disagreements fairly (no strawmanning), identify cruxes, and propose test cases.
      *   **Constraints:** British spelling. No citations/reading lists. Numbered agreed-claims section. Table for disagreements/cruxes. Avoid question-begging definitions (especially regarding "privacy" vs. "good things privacy brings").
      *   **Tone:** Professional, precise, neutral, philosophical but accessible (reading group context).

  2.  **Deconstruct the Positions:**
      *   **Instrumentalist:** Privacy = Tool. Value = Consequences (autonomy, safety, intimacy). No consequences = No loss.
      *   **Constitutivist:** Privacy = Condition of Personhood. Value = Intrinsic. Observation = Loss (dignity, boundary violation) even if benign.
      *   **Common Ground:** Both care about privacy. Both agree some invasions are bad. Both likely agree on specific cases (e.g., doxxing is bad), but disagree on *why*.
      *   **Potential Pitfalls:** Defining privacy *as* the good outcome (Instrumentalist trap) or defining observation *as* harm without argument (Constitutivist trap).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the intersection.
      *   *Definition:* Avoid defining privacy *as* a right or good immediately. Define it structurally first (limited access/restricted flow).
      *   *Loss:* Both agree that *unwanted* access is a prima facie concern.
      *   *Scope:* Both agree it applies to information, physical space, and attention.
      *   *Methodology:* Both agree that intuitions about cases matter, but need to be tested against consistency.
      *   *Crucial Constraint:* Must not define privacy *as* "the thing that protects autonomy" (begs the question). Must define it as "restricted access" or similar.
      *   *Drafting thought:* Let's call it a "status of limited accessibility." Both agree violations occur when access is breached without consent. Both agree *some* violations are morally significant.

  4.  **Drafting Section 2 & 3: Disagreements and Cruxes (The Table):**
      *   Need to map the specific points of contention provided in the prompt.
      *   *Crux 1: The Kind Observer.* (Benign observation).
          *   Instrumentalist: No harm.
          *   Constitutivist: Harm (violation of boundary).
      *   *Crux 2: Exposure vs. Exploitation.* (Risk vs. Harm).
          *   Instrumentalist: Harm only if exploited.
          *   Constitutivist: Exposure *is* the harm (loss of secrecy/status).
      *   *Crux 3: Control vs. State.* (Is value in controlling or in the state of being private?).
          *   Instrumentalist: Control is valuable because of what it enables.
          *   Constitutivist: The state of being unobserved is valuable regardless of control.
      *   *Crux 4: Object of Value.* (Shield vs. Hoard / Bedroom vs. Data Broker).
          *   Need to check if this is verbal. Is one talking about spatial privacy and the other informational?
          *   Decision: Frame it as "Scope of Application."

  5.  **Drafting Section 4: Test Cases:**
      *   Need cases that isolate the variables.
      *   *Case A (The Kind Observer):* Needs to ensure *no* consequences ever. A benevolent AI or angel? Or a locked diary read by someone who burns it immediately after?
          *   *Refinement:* The "Perfect Archivist." Someone records everything but guarantees (via mechanism, not promise) no one else sees it and they never act on it.
      *   *Case B (The Risk):* Data leak that is technically public but nobody looks at.
          *   *Refinement:* The "Empty Server." Data is on a public server, but encryption key is lost forever. Is the data 'out there'?
      *   *Case C (The Unknowing Subject):* Subject never knows they were observed.
          *   *Refinement:* The "Silent Camera." Records you in your home, footage deleted unviewed.
      *   *Selection:* The prompt asks for "Two sharp cases beat six soggy ones." I will select the "Benevolent Ghost" (Kind Observer) and the "Glass House with Blinds" (Control vs. State).
      *   *Wait, the prompt asks for a case for EACH crux.* Okay, I need to match cases to the cruxes identified in the table.
      *   *Crux 1 (Kind Observer):* The "Benevolent Ghost."
      *   *Crux 2 (Exposure vs. Exploitation):* The "Lost Key" scenario.
      *   *Crux 3 (Control vs. State):* The "Forced Secret." (You are private, but not by choice).
      *   *Crux 4 (Scope):* The "Data Broker vs. Bedroom." (Maybe merge this or treat as a clarification).
      *   *Actually, let's stick to the prompt's specific request:* "For each crux, a case or consideration both sides agree bears on it."
      *   *Challenge:* "Invent one that separates 'the information exists and is held' from 'anyone uses it or could use it'."
      *   *Idea:* The "Sealed Box." Information is copied to a box. The box is indestructible. No one can open it. But the copy exists outside your control.
      *   *Instrumentalist:* No harm (can't use it).
      *   *Constitutivist:* Harm (you don't own it anymore).

  6.  **Review and Refine (Self-Correction):**
      *   *Spelling:* Check for British spelling (labelled, programme, defence, etc.).
      *   *Tone:* Ensure it doesn't sound like I'm taking sides.
      *   *Question-Begging:* In the Agreed Claims, ensure I don't define privacy as "freedom from observation" (Constitutivist bias) or "freedom from negative consequences" (Instrumentalist bias). Define it as "restricted access."
      *   *Fairness:* Ensure the Constitutivist isn't painted as mystical and the Instrumentalist isn't painted as cold.
      *   *Formatting:* Numbered list for claims, Table for disagreements/cruxes.
      *   *Specific Prompt Requirement:* "Watch out for the fudge where 'privacy' quietly starts meaning 'the good things privacy brings'." I need to explicitly note this in the Agreed Claims or a preamble. I will add a definitional caveat.

  7.  **Final Polish:**
      *   Check the "Shield vs. Hoard" point. The prompt suggests this might be verbal. I should address that in the cruxes.
      *   Check the "Kind Observer" case. Make sure the "no consequences" condition is watertight.
      *   Ensure the table clearly separates "The Disagreement," "Instrumentalist Position," "Constitutivist Position," and "The Crux."

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Title:* Memorandum of Understanding / Reconciliation Document.
      *   *Section 1:* Agreed Claims. 1. Definition (Limited Access). 2. Violation (Non-consensual access). 3. Moral Weight (At least some violations matter). 4. Method (Case-based).
      *   *Section 2/3 Table:* Columns: Issue, Instrumentalist View, Constitutivist View, The Crux (What settles it).
      *   *Section 4:* Test Cases.
          *   Case 1: The Benevolent Archivist (Kind Observer).
          *   Case 2: The Indestructible Vault (Existence vs. Use).
      *   *Spelling Check:* Labelled, behaviour, defence, programme (if used), centre.

  9.  **Final Review against constraints:**
      *   British spelling? Yes.
      *   No citations? Yes.
      *   Numbered agreed claims? Yes.
      *   Table for disagreements? Yes.
      *   Two sharp cases? Yes (I'll focus on the two strongest ones that cover the ground).
      *   No verdict? Yes.
      *   Address the "fudge"? Yes, in the preamble/definitions.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM OF UNDERSTANDING: PRIVACY READING GROUP**

  **Subject:** Reconciliation of Instrumentalist and Constitutivist Positions
  **Date:** 24 May 2024
  **Status:** Draft for Signature

  **Preamble**
  This document records the points of convergence and divergence between the Instrumentalist and Constitutivist positions within the group. Its purpose is not to adjudicate which position is correct, but to ensure that future debate proceeds without strawmanning, question-begging definitions, or talking past one another. Specifically, both parties agree to avoid the definitional fudge wherein 'privacy' is tacitly defined as 'the good outcomes privacy produces'. Privacy is treated here as the object of study, not the conclusion of the argument.

  ### 1. Agreed Claims

  Both parties affirm the following propositions as a baseline for further discussion:

  1.  **Structural Definition:** Privacy is defined structurally, not normatively. It is a state of limited accessibility to a person, their information, or their spaces. A loss of privacy occurs when accessibility increases without the subject's consent.
  2.  **The Prima Facie Concern:** Both parties agree that privacy violations are *prima facie* morally significant. Even if one side believes the value is purely downstream, they agree that in the actual world, privacy violations are reliable indicators of potential harm.
  3.  **Scope:** The debate applies to both informational privacy (data, secrets) and spatial/physical privacy (rooms, bodies). Neither side claims their theory applies only to one domain.
  4.  **Consent as a Mediator:** Both parties agree that consent transforms a privacy violation into a permissible act. The disagreement lies in what makes the non-consensual act wrong, not in the validity of consent itself.
  5.  **Methodology:** Both parties agree that intuitions about specific cases are relevant evidence, provided those cases are stripped of confounding variables (e.g., fear, reputational damage, or economic loss).
  6.  **Non-Identity:** Both parties acknowledge they are discussing the same object ('privacy'), despite differing metaphors (e.g., 'shield' vs. 'hoard'). The disagreement is about the *source of value*, not the *referent*.

  ### 2. Disagreements and Cruxes

  The following table outlines the specific points of departure. The positions are phrased in neutral language acceptable to the opposing side.

  | Issue | Instrumentalist Position | Constitutivist Position | The Crux (What needs settling) |
  | :--- | :--- | :--- | :--- |
  | **1. The Kind Observer** | Observation by a benevolent agent who never judges, acts, or leaks the information is **not** a privacy loss of moral weight. If nothing changes in the subject's options or welfare, nothing of value was lost. | Observation by a benevolent agent **is** a privacy loss. The violation of the boundary itself diminishes the subject's status as a person, regardless of the observer's intent or subsequent action. | Is the harm in the *potential* for consequences, or in the *actual* breach of the boundary? |
  | **2. Exposure vs. Exploitation** | Exposure is merely a **risk** of harm. Without exploitation (discrimination, manipulation, judgement), the exposure is inert. A secret known by one who does not care is functionally equivalent to a secret kept. | Exposure is a **harm** in itself. Once information is outside the subject's sphere, the subject's relation to that information is altered permanently. The loss of 'mine-ness' is the injury. | Is privacy a commodity that loses value when copied, or a shield that only matters when struck? |
  | **3. Control vs. State** | The value lies in **control**. Privacy is valuable because it allows the subject to manage how they are perceived. If control is lost but no negative outcome occurs, the value is unrealised but not destroyed. | The value lies in the **state** of being private. Control is instrumental to achieving the state, but the state itself (being unobserved) is the good. One can be harmed by loss of privacy even if one never knew one had control to lose. | Is privacy valuable because of what we can *do* with it, or because of what we *are* when we have it? |
  | **4. Scope of Intuition** | Intuitions about privacy are largely heuristics for safety. We feel violated in a 'bedroom' case because we fear consequences. In 'data broker' cases, we should feel the same, but often don't due to abstraction. | Intuitions about privacy track dignity. We feel violated in a 'bedroom' case because personhood is constituted there. In 'data broker' cases, the violation is often worse because it is inescapable, even if abstract. | Are our intuitions tracking *fear* (Instrumentalist) or *dignity* (Constitutivist)? |

  ### 3. Test Cases and Predictions

  To move beyond abstract disagreement, both parties agree to treat the following cases as binding tests. Each side must record their prediction regarding the moral status of the case *before* discussing the outcome.

  **Case A: The Benevolent Archivist**
  *Setup:* A subject lives their life under the constant surveillance of an AI. The AI is physically incapable of sharing data, acting on data, or judging the subject. It records everything. Upon the subject's death, the data is automatically and verifiably deleted without ever having been viewed by any other entity, including the subject. The subject never knows the AI exists.
  *Separation:* This separates 'observation' from 'consequence' and 'knowledge of violation'.

  | Party | Verdict (Violation / No Violation) | Reasoning (To be filled in post-signing) |
  | :--- | :--- | :--- |
  | **Instrumentalist** | | |
  | **Constitutivist** | | |

  **Case B: The Indestructible Vault**
  *Setup:* A subject's private diary is copied by a third party. The copy is placed in a vault that is physically indestructible and logically inaccessible. No human or machine can ever open the vault. The original diary remains with the subject, untouched. The subject knows the copy exists but knows it can never be accessed.
  *Separation:* This separates 'information exists outside control' from 'information can be used'.

  | Party | Verdict (Harm / No Harm) | Reasoning (To be filled in post-signing) |
  | :--- | :--- | :--- |
  | **Instrumentalist** | | |
  | **Constitutivist** | | |

  ### 4. Procedural Commitments

  By signing below, both parties agree to:

  1.  Refrain from defining privacy in a way that presupposes their own conclusion (e.g., defining privacy as 'autonomy' or 'dignity' in the premise).
  2.  Accept the verdicts on the Test Cases as genuine evidence. If the Instrumentalist admits a violation in Case A, they must adjust their theory to account for non-consequential harm. If the Constitutivist admits no harm in Case B, they must adjust their theory regarding the nature of 'loss'.
  3.  Acknowledge that the 'Shield vs. Hoard' distinction is metaphorical. If the disagreement proves to be purely verbal (i.e., both agree on the cases but label them differently), the dispute will be categorised as semantic rather than substantive.

  **Signed:**

  _________________________ (Instrumentalist)

  _________________________ (Constitutivist)

  _________________________ (Facilitator)
