answer: |-
  There is no single canonical proper noun (like "Gresham's Law" or "The Veil of Ignorance") that captures this specific maneuver across the literature, though the terrain is well-mapped in bioethics and the philosophy of personal identity. The phenomenon you are describing sits at the intersection of **precedent autonomy**, **diachronic identity**, and **substantive competence**.

  However, the specific insight—that the selection of the "real" self is a normative judgment disguised as a metaphysical or temporal fact—is a critique often leveled against standard bioethical frameworks but rarely named as a distinct fallacy.

  Here is the boundary of the concept, its nearest neighbors, and a proposed name for the structure you have identified.

  ### 1. The Nearest Neighbors (What it is not)

  To define the boundary, we must distinguish your observation from the standard apparatus you already know:

  *   **Precedent Autonomy (Buchanan/Brock):** This is the standard justification for Case 1. It argues the past self has authority over the future self. It does not account for the *reversal* in Case 2, where precedent autonomy is discarded.
  *   **Critical vs. Experiential Interests (Dworkin):** Dworkin argues the "critical interest" (the life plan) trumps the "experiential interest" (current pleasure). This fits Case 1 but struggles with Case 2 (where the current self wants to live, aligning with the critical interest of survival, yet is overruled by the past self's directive to die).
  *   **Substantive Competence:** This covers Case 2. It is the idea that a patient can be functionally competent (understands the risks) but substantively incompetent (their values are distorted by pathology). However, this term does not cover Case 1, where the patient is *incompetent* by definition (dementia). Your observation is that *both* cases use the same mechanism (picking the "true" self) despite using different labels (identity vs. competence).
  *   **The Non-Identity Problem (Parfit):** This is about whether the future person is the *same* person. Your point is not about whether they are numerically identical, but about which iteration is granted *moral sovereignty*.

  ### 2. The Boundary: Capacity vs. Endorsement

  You asked where the line falls between a self that is not competent to speak and a self that is competent but not authoritative.

  *   **Standard Line:** **Decisional Capacity.** Can the patient understand, appreciate, reason, and communicate a choice? If yes, they speak for the person. If no, the surrogate/directive speaks.
  *   **Your Observed Line:** **Normative Endorsement.** Does the current self's will align with the values held by the community/clinicians/family as "rational" or "authentic"?
      *   In **Case 1 (Dementia)**, the current self is disqualified on **Identity Grounds** ("He is not the man who signed").
      *   In **Case 2 (Depression)**, the current self is disqualified on **Pathology Grounds** ("The depression is asking").
      *   **The Boundary:** The boundary is not cognitive; it is **axiological** (value-based). The "real" self is whichever self holds the values we are willing to honor. When the demented man wants to live, we say he isn't *him*. When the depressed man wants to live, we say he isn't *well*. When the demented man wants to die (not in your case, but hypothetically), we might say he doesn't *know* what he wants. When the depressed man wants to die, we say he *isn't himself*.

  The structure you found is the **retroactive assignment of authenticity** to justify a preferred outcome.

  ### 3. A Name for the Structure

  Since nothing in circulation fits perfectly, I propose the term:

  **Normative Identity Selection**
  *(Or, more critically: **The Authenticity Mask**)*

  **Definition:** The rhetorical and ethical maneuver wherein a decision-maker resolves a conflict between diachronic selves (past vs. present) by attributing "authenticity" or "reality" to the self whose preferences align with the decision-maker's substantive values, while framing the exclusion of the other self as a matter of temporal fact, identity continuity, or medical pathology.

  **Why this fits:**
  It captures your insight that "what presents itself as a temporal rule seems to be a substantive judgment." It names the substitution: we think we are asking "Who is this?" (Identity), but we are actually answering "Who *should* be in charge?" (Normativity).

  ### 4. Extensions Outside Medicine

  You asked if this structure turns up elsewhere. It is pervasive wherever diachronic commitment is enforced.

  *   **Contract Law (Changed Circumstances):** A 22-year-old signs a 10-year non-compete. At 35, she wants out.
      *   *If the court enforces it:* They argue the 22-year-old's "sovereign will" binds the 35-year-old (The 22-year-old is the "real" author of the life plan).
      *   *If the court voids it:* They argue the 22-year-old lacked maturity or the circumstances changed so radically the 35-year-old is effectively a different moral agent (The 35-year-old's current liberty trumps the past promise).
      *   *The Mask:* The court claims to be interpreting the *intent of the contract* (temporal/factual), but is actually deciding which version of the woman deserves protection (the ambitious youth or the established adult).
  *   **Addiction (Ulysses Contracts):** An addict signs a directive refusing drugs. Later, sober but craving, they beg for a dose.
      *   *If refused:* The "Addict Self" is treated as a pathogen; the "Sober Signer" is the real person.
      *   *If allowed (Harm Reduction):* The "Current Sufferer" is the real person; the "Sober Signer" is viewed as having held unrealistic moralistic expectations.
  *   **Religious/Political Conversion:** A person leaves a high-control group.
      *   *Family says:* "This isn't you; you've been brainwashed." (The past believer is the real self; the current apostate is the distortion).
      *   *Cult says:* "Your past self was asleep; now you are awake." (The current believer is the real self; the past apostate was the distortion).
      *   *The Mask:* Both sides claim to be describing the *truth* of the person's identity, but they are advocating for the *authority* of the timeline that suits their retention of the member.

  ### 5. A Note on Case 2 (The Contradiction)

  I must note a tension in your prompt to ensure the definition holds. In your text description of Case 2, the man is refused treatment and the **earlier document governs** (Earlier Self Wins). But in your summary sentence, you write: *"In the first case the earlier self wins; in the second the later self wins."*

  If the Earlier Self wins in *both* cases (as the text descriptions suggest), the phenomenon is **Prioritarianism of the Competent Self** (we always favor the self that was competent when they signed).

  However, your *argument* relies on the flip (Earlier wins in 1, Later wins in 2). This flip is what proves the "substantive judgment" claim. If the outcome were consistent (Earlier always wins), it could be a consistent temporal rule. The fact that the logic *flips* to match our moral comfort (saving the demented man feels like killing; saving the depressed man feels like healing) is what exposes the **Normative Identity Selection**. I have answered based on your summary sentence, as that contains the philosophical insight you are pursuing.

  ### Summary

  The concept is the **Normative Selection of the Authentic Self**. It reveals that **Diachronic Authority** is not a discovery of fact (who is the same person?), but an assignment of power (who do we trust?). The boundary is not between competence and incompetence, but between **values we endorse** and **values we pathologize**.

  If you need a label to use in writing, **"The Authenticity Mask"** is punchy, but **"Normative Identity Selection"** is precise. It defines the act of dressing a value judgment in the costume of identity.
