      *   *Section 1: The Protocol.* Clear steps, stop conditions, judgment flags.
      *   *Section 2: The Director's Brief.* What is she actually signing?
      *   *Section 3: The Test Runs.* Apply the protocol.
      *   *Section 4: The Failure Analysis.* Where Endurantism and Perdurantism diverge.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Endurantism/Perdurantism simply? Yes, keep it tied to the object.
      *   *Check:* Is the circularity addressed? Yes, by replacing accession number with material/historical criteria.
