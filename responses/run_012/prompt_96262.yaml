      *   **Deliverables:**
          1.  A actionable procedure (questions, sufficient answers, stop points, judgment flags).
          2.  Identification of where value judgments hide as procedure.
          3.  Clarification of what the Director is actually deciding.
          4.  Test run on two cases (Chair: 3 legs + seat replaced; Painting: relined + 30% retouch).
          5.  One result must be counter-intuitive/unliked.
          6.  Analysis of where the procedure fails (Endurantism vs. Perdurantism split).

  2.  **Deconstruct the Theory (Endurantism vs. Perdurantism):**
      *   *Endurantism (3D):* Objects are wholly present at every moment. Identity depends on *substance* or *essence*. If the matter changes too much, it's a new object. (Focus: Material continuity, essential properties).
      *   *Perdurantism (4D):* Objects are space-time worms. Identity depends on *continuity of existence* through time. Temporal parts can change as long as there's a causal/spatiotemporal link. (Focus: Historical continuity, function, narrative).
      *   *Museum Context:* Museums usually act like Endurantists (the "real thing") but need Perdurantist logic to allow for conservation (the "same thing over time"). The tension is exactly what the user is facing.

  3.  **Drafting the Procedure (The "Identity Persistence Protocol"):**
      *   *Goal:* Make it actionable, not just philosophical.
      *   *Structure:* Step-by-step questions.
      *   *Flags:* Need to explicitly mark where "philosophy" becomes "policy."
      *   *Director's Role:* She needs to know she's signing off on a metaphysical stance, not just a conservation report.

      *   *Step 1: Material Continuity (Endurantist Check).* How much original matter remains?
      *   *Step 2: Structural/Functional Continuity (Perdurantist Check).* Is the form/function maintained through a continuous history?
      *   *Step 3: The "Ship of Theseus" Threshold.* Where do we draw the line?
      *   *Step 4: Intent & Provenance.* Who did the work and why?
      *   *Step 5: The Judgment Call.*

      *   *Refining the "Judgment Flags":* I need to be honest. Metaphysics doesn't solve museum policy; it exposes the conflict. The procedure must highlight *where* the conflict lies so the Director can choose.

  4.  **Developing the Test Cases:**
      *   *Case A: 17th-Century Oak Chair.* 3 legs + seat replaced. That's 4 out of 5 major structural components.
          *   Endurantist view: Mostly new wood. Is it still the 17th-century chair?
          *   Perdurantist view: Continuous use, repaired to function.
      *   *Case B: Painting.* Relined + 30% retouch.
          *   Endurantist view: The canvas is new (lining), 30% of pigment is new. But the "image" remains.
          *   Perdurantist view: Continuous history of the artwork.

      *   *Constraint:* One result must be "unliked."
          *   *Idea:* If I lean too hard Endurantist, the Chair becomes a reproduction. If I lean too hard Perdurantist, the Painting might be considered "heavily altered" but same object.
          *   *Decision:* Let's make the Procedure lean slightly Endurantist on *materiality* for 3D objects but Perdurantist for 2D surfaces (standard museum practice), but then twist it so the Chair *fails* (New Accession) while the Painting *passes* (Same Accession). Registrars usually hate re-accessioning because it breaks provenance chains. So, telling the Registrar the Chair is a *new object* will be the "answer I don't like."

  5.  **Refining the Procedure Steps (Iterative Process):**
      *   *Draft 1:* Ask if it's the same stuff. Ask if it's the same history.
      *   *Critique:* Too vague.
      *   *Draft 2:* Quantify percentages. >50% new material = new object.
      *   *Critique:* Arbitrary.
      *   *Draft 3 (Final):* Use a weighted scoring system that forces a choice between "Material Essence" (Endurantism) and "Historical Continuity" (Perdurantism).
      *   *Crucial Addition:* The "Metaphysical Flag." Explicitly state: "This step requires choosing a theory of persistence."

  6.  **Writing the Response:**
