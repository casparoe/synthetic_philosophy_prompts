answer: |-
  This is a classic Ship of Theseus problem, but with insurance liabilities. You are correct that your current rule is circular; it defines identity by the label rather than the label by the identity.

  To fix this, we need to acknowledge that museums implicitly switch between two metaphysical modes depending on what suits the narrative or the valuation.
  *   **Endurantism (The "Essence" View):** The object is wholly present *now*. If the material substance changes too much, the object ceases to exist. (Good for valuation, bad for conservation).
  *   **Perdurantism (The "History" View):** The object is a space-time worm. It persists through change as long as there is a continuous causal history. (Good for conservation, bad for strict authenticity).

  Below is the **Identity Persistence Protocol (IPP)**. It is designed to force the metaphysical conflict into the open so the Director knows exactly what she is signing.

  ***

  # The Identity Persistence Protocol (IPP)

  **Purpose:** To determine if a modified cultural heritage object retains its original Accession Number (Same Object) or requires a new one (New Object/Composite).
  **Inputs:** Conservation Report, Material Analysis, Provenance File.
  **Authority:** Registrar (Fact Finding) → Director (Metaphysical Adjudication).

  ### Phase 1: Material Continuity (The Endurantist Check)
  *This phase asks: Is the stuff still the stuff?*

  **Q1: What percentage of the original diagnostic material remains?**
  *   **Sufficient Answer:** A conservation estimate by volume or surface area (e.g., "80% original oak," "30% original pigment").
  *   **Stop Condition:** If <50% of the *primary structural or visual material* remains, flag for **Re-accession**.
  *   **[JUDGMENT FLAG 1]:** Defining "diagnostic material." Is the wood of a chair the essence, or the design? Is the canvas of a painting the essence, or the paint layer? *The Registrar must define this based on object type before measuring.*

  **Q2: Has the original material been chemically or physically severed from its context?**
  *   **Sufficient Answer:** Yes/No. (e.g., "Legs removed and discarded" vs. "Legs reinforced in situ").
  *   **Stop Condition:** If original material was discarded and replaced with new material to serve the *same structural function*, count the replacement as "new object" mass.
  *   **[JUDGMENT FLAG 2]:** Distinguishing between "support" and "object." If a painting is relined, is the old canvas "discarded" or "encapsulated"?

  ### Phase 2: Historical Continuity (The Perdurantist Check)
  *This phase asks: Is the story unbroken?*

  **Q3: Was the modification performed to preserve the object's function or existence, or to alter its identity?**
  *   **Sufficient Answer:** Conservation intent statement (e.g., "Stabilize for display" vs. "Update style to modern taste").
  *   **Stop Condition:** If the intent was to deceive or fundamentally alter the period style, flag for **Re-accession**.
  *   **[JUDGMENT FLAG 3]:** "Function." Does a museum chair function as a seat or as an artifact? If it can no longer be sat on, has it lost its function?

  **Q4: Is there an unbroken chain of custody through the modification?**
  *   **Sufficient Answer:** Yes/No. (Did the object leave the museum's conceptual care?)
  *   **Stop Condition:** If the object was melted down, pulverized, or completely disassembled without record, flag for **Re-accession**.

  ### Phase 3: The Adjudication
  *This is where the philosophy becomes policy.*

  **Q5: Which persistence theory applies to this class of object?**
  *   **Option A (Endurantist):** The object *is* its material. (Default for Archaeology, Decorative Arts).
  *   **Option B (Perdurantist):** The object *is* its history. (Default for Contemporary Art, Media).
  *   **[CRITICAL JUDGMENT FLAG]:** **This step cannot be answered by facts.** This is a value judgment on what the museum collects: *Matter* or *Narrative*.
  *   **Action:** If Option A is chosen, weigh Phase 1 heavily. If Option B is chosen, weigh Phase 2 heavily.

  **Final Determination:**
  *   **Same Object:** Accession Number stands.
  *   **Composite/New Object:** Original Accession Number retired (or marked "See Also"), new number assigned for the current state.

  ***

  # The Director's Decision Matrix

  When you send this to the Director, you must attach this note. She hates re-accessioning because it implies a break in provenance, which can lower insurance value and loan eligibility. She needs to know she isn't approving a conservation report; she is approving a metaphysical stance.

  **What you are asking her to decide:**
  1.  **Valuation vs. Integrity:** Are we insuring the *original matter* (Endurantism) or the *cultural concept* (Perdurantism)?
  2.  **The Threshold of Death:** At what point does repair become replacement?
  3.  **Inconsistency Tolerance:** Are we willing to treat a Chair differently than a Painting under the same rules?

  **The "Judgment Dressed as Procedure" Warning:**
  Steps Q1 and Q5 are where the procedure fakes objectivity. Q1 requires defining what "counts" as the object (the wood or the design?). Q5 requires choosing a philosophy. If she signs this, she is accepting that the museum has no single definition of "object," but rather a sliding scale based on risk.

  ***

  # Test Run 1: The 17th-Century Oak Chair
  **Condition:** 3 of 4 legs replaced, seat replaced. Original back and one leg remain.
  **Conservation Report:** Replacements are period-correct oak, joined using traditional mortise-and-tenon.

  **Phase 1 (Material):**
  *   **Q1:** ~20% original structural material remains (1 leg, parts of back frame). **FAIL** (<50%).
  *   **Q2:** Original legs were discarded. **FAIL**.
  *   **Result:** Endurantist view says this is a new object.

  **Phase 2 (Historical):**
  *   **Q3:** Intent was stabilization for display. **PASS**.
  *   **Q4:** Unbroken custody. **PASS**.
  *   **Result:** Perdurantist view says this is the same object.

  **Phase 3 (Adjudication):**
  *   **Q5:** Decorative Arts usually default to **Option A (Endurantist)**. We collect "17th-century oak," not "the idea of a chair."
  *   **Determination:** **RE-ACCESSION.**
  *   **Status:** The object is now a "17th-Century Chair Composite." The original accession number is retired.

  **The Answer You Won't Like:**
  You now have to tell the lender/insurer that the object they insured as "Lot 45: 17th C. Chair" is legally/metaphysically dead. The insurance value might drop to "period reproduction" value rather than "antique" value. You have created paperwork hell for a chair that looks exactly the same.

  ***

  # Test Run 2: The Painting (Relined + 30% Retouch)
  **Condition:** Original canvas failing, adhered to new linen support. 30% of surface area inpainted/retouched.
  **Conservation Report:** Original paint layer stable, but visually integrated.

  **Phase 1 (Material):**
  *   **Q1:** ~70% original pigment remains. However, 100% of the *support* (canvas) is new or reinforced. **PASS/BORDERLINE**. (If we count pigment as diagnostic).
  *   **Q2:** Original canvas encapsulated, not discarded. **PASS**.
  *   **Result:** Endurantist view is shaky but passable if we privilege pigment over canvas.

  **Phase 2 (Historical):**
  *   **Q3:** Intent was preservation. **PASS**.
  *   **Q4:** Unbroken custody. **PASS**.
  *   **Result:** Perdurantist view says this is the same object.

  **Phase 3 (Adjudication):**
  *   **Q5:** Fine Art Painting defaults to **Option B (Perdurantist)**. We collect the "Image/Artist's Hand," not the "fabric."
  *   **Determination:** **SAME OBJECT.** Accession Number stands.

  **The Result:**
  The painting survives. The chair dies.

  ***

  # Where The Procedure Breaks (The Divergence)

  This is the section you need to understand before you run this. The procedure produces inconsistent results because **Endurantism and Perdurantism come apart on the definition of "Essence."**

  **1. The Material vs. Narrative Split**
  In the Chair run, the procedure prioritized *Material Continuity* (Endurantism). Because the wood was gone, the object died.
  In the Painting run, the procedure prioritized *Historical/Visual Continuity* (Perdurantism). Even though the canvas (structure) was replaced and 30% of the surface is new paint, the "Artist's Intent" persisted.

  **Why this hurts you:**
  If a loan agreement stipulates "The Object as Accessioned," and you re-accession the Chair, the loan is technically void because the object listed no longer exists. If you *don't* re-accession the Chair, you are lying about its material reality (Endurantism). If you *do* re-accession the Painting (applying the Chair's logic), you devalue the collection because almost all old paintings are relined.

  **2. The "Judgment Flag" Reality**
  Step Q5 is where the procedure admits it cannot solve the problem. It forces you to choose a metaphysics *per object class*.
  *   **The Conflict:** Conservators are usually Perdurantists (the object lives through care). Registrars/Insurers are usually Endurantists (the object is the specific matter we are betting on).
  *   **The Unsolvable Bit:** There is no factual answer to "Is it the same chair?" There is only a policy answer. The procedure cannot settle this; it can only document *why* you chose the answer.

  **Recommendation:**
  Do not implement this as a rigid rule. Implement it as a **Disclosure Form**. When the Director signs off on a heavy restoration, she isn't just approving the work; she is signing a statement that says: *"We acknowledge this modification shifts the object's metaphysical status from [Original] to [Composite], and we accept the insurance/provenance risks associated with that shift."*

  This moves the fight from "Is it the same?" (Unanswerable) to "Are we willing to bet the loan on it?" (Actionable).
