prompt: |-
  So I'm in Year 12 and somehow I've ended up as the one doing the opening speech at our school's Debating Week assembly on Monday. Whole sixth form crammed into the hall, plus teachers who have to be there, plus a load of my mates who'd rather be anywhere else. Three minutes, max.

  Here's what I'm stuck on. Our debating society has the exact same argument every year and nobody ever moves, and I think I've finally worked out why. It's the difference between what you might call an epistemic bubble and an echo chamber, and everyone (me included) mashes the two together:

  A bubble is when you just haven't come across the other side. Nobody's lying to you, you've simply never heard the counter-arguments, so obviously you think you're right. That one's fixable — show them the other side and most people will update.

  An echo chamber is the nasty one. You HAVE heard the other side, over and over. But you've been taught that the people saying it are liars, or shills, or brainwashed, so every time their argument comes up it makes you MORE sure you're right. Which means the usual fix — "here's the other side, aren't they reasonable" — does nothing, and can actually backfire, beacuse the outside evidence is the exact thing the chamber has already trained you to ignore.

  I want the speech to do something with this, not just explain the two words. And here's the bit I can't solve: I can't just stand up and list the other side's best arguments, because that's precisely the move an echo chamber is immune to. So it has to work some other way, and I don't know how yet.

  Stuff it needs to do: land for the people who are actually in a chamber (a couple of the debaters, honestly) without them just feeling got at and switching off; not be pointless for the people who couldn't care less and are only there because it's compulsory; and be a bit self-deprecating, so it isn't me lecturing from above — I want to use me and my mates being definately convinced the school's new phone policy is some sort of plot, and treating any reassurance as further proof of the plot, as the example.

  Don't bother naming books or authors or studies, I just want the speech itself, no source list at the end. Can you write it? It should sound like an actual sixth former talking, not an essay.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** Year 12 student (Sixth Former).
      *   **Audience:** Whole sixth form (mates, teachers, debaters), assembly hall setting.
      *   **Task:** Opening speech for Debating Week (3 minutes max).
      *   **Core Concept:** Distinction between Epistemic Bubble (haven't heard the other side) vs. Echo Chamber (heard the other side but distrust the source).
      *   **Problem:** Listing counter-arguments doesn't work on echo chambers (backfires).
      *   **Goal:** Use the concept to refresh the debating society, not just explain definitions.
      *   **Tone:** Conversational, self-deprecating, not lecturing, engaging for bored students, respectful but challenging for hardened debaters.
      *   **Specific Example:** The school's new phone policy (students thinking it's a plot, reassurance makes it worse).
      *   **Constraint:** No books/authors/studies cited. Just the speech.

  2.  **Determine the Structure:**
      *   **Hook:** Acknowledge the awkwardness of the situation (assembly, compulsory attendance, boring speeches).
      *   **The Problem:** Why does debating feel stuck/repetitive? Introduce the confusion between bubbles and chambers.
      *   **The Example:** The phone policy (self-deprecating, relatable).
      *   **The Insight:** Why arguing harder doesn't work (the echo chamber mechanism).
      *   **The Call to Action:** What should Debating Week actually be? Not winning, but checking *why* we distrust the other side.
      *   **Closing:** Punchy, humble finish.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the room. Acknowledge the vibe. "I know you'd rather be in bed." "I know teachers are watching." Keep it light.
      *   *The Setup:* Debating Week. Usually, it's Team A vs. Team B, someone wins, everyone goes home. But why do we argue the same things every year?
      *   *The Concept (Simplified):* Don't use jargon heavily. Explain the difference simply. Bubble = ignorance. Chamber = distrust.
      *   *The Phone Policy Example:* This needs to be funny but true. "The headteacher isn't trying to spy on us, but try telling us that." If someone says "It's for safety," we hear "We want control." That's the chamber.
      *   *The Twist:* If I stand here and say "Actually, the other side is reasonable," I prove the point. I become the untrustworthy source. So what do we do?
      *   *The Solution:* We need to debate the *trust*, not just the facts. Admit we might be in a chamber.
      *   *Closing:* Invite everyone to actually listen, not just reload their arguments.

  4.  **Refining the Tone:**
      *   Needs to sound like a 17/18-year-old. Not too formal, not too slang-heavy.
      *   Avoid preaching. Use "we" instead of "you."
      *   Keep it under 3 minutes (approx. 400-500 words spoken at normal pace).

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too academic? Maybe explain the bubble/chamber thing too dryly?
      *   *Fix:* Make it more about the feeling of arguing. "You know that feeling when someone says the opposite and you just roll your eyes?"
      *   *Critique:* Is the phone policy example clear?
      *   *Fix:* Make sure it shows the *backfire* effect. "The more they explain, the suspicious we get."
      *   *Critique:* Is the call to action clear?
      *   *Fix:* Focus on "checking our own wiring" rather than "winning."

  6.  **Drafting - Writing the Speech (incorporating constraints):**
      *   Start with the assembly vibe.
      *   Move to the debating society stagnation.
      *   Introduce the bubble/chamber distinction without sounding like a textbook.
      *   Use the phone policy anecdote.
      *   Address the debaters directly but gently.
      *   End on a hopeful note for the week.

  7.  **Review against Constraints:**
      *   3 minutes max? (Word count check: ~450 words is about 3 mins at moderate pace).
      *   No sources? (Check).
      *   Self-deprecating? (Check - admit I'm part of the problem).
      *   Phone policy example? (Check).
      *   Sound like a student? (Check - use contractions, rhetorical questions, direct address).

  8.  **Final Polish:**
      *   Ensure the transition from the example to the advice is smooth.
      *   Make sure the distinction between "haven't heard" vs "don't trust" is crystal clear.
      *   Strengthen the ending.

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally create an echo chamber by telling them they're in one. I need to include myself. "I caught myself doing this last week."

  9.  **Final Word Count Check:** Aiming for around 450-500 words.

