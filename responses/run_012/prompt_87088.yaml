answer: |-
  One-sentence version: Students vote on whether to surrender points after a coin lands against them, knowing the reward depended on their willingness to lose in that exact branch.

  ### Activity Design: The Oracle's Wager

  **Roles:** 14 Students, 1 Instructor (Omega).
  **Materials:** 14 envelopes, one large coin, chocolate tokens (or course credit points).
  **Payoff Scheme:**
  *   **Cost:** 1 token to pay Omega.
  *   **Reward:** 10 tokens if Omega predicted you would pay.
  *   **Mechanism:** Omega flips a coin. If **Tails**, he gives you 10 tokens *if and only if* he predicted you would have paid 1 token had the coin landed **Heads**. If **Heads**, he asks for 1 token. You keep remaining tokens.

  **Running Order (20 minutes)**

  1.  **Setup (5 mins):** Distribute envelopes containing 5 tokens each. Introduce Omega (you): "I am a perfect predictor of your decision type. I have already simulated your response to this scenario."
  2.  **The Flip (2 mins):** Flip the coin visibly but cover the result. Explain the payoff structure clearly on the board. Emphasise the counterfactual: "The Tails reward depends on your disposition in the Heads branch."
  3.  **The Reveal (3 mins):** Uncover the coin. It is **Heads**. "The coin landed Heads. I am asking for 1 token. You know the Tails branch did not happen."
  4.  **The Vote (5 mins):** Ask students to privately write 'Pay' or 'Refuse' on a slip. Collect them. Do not tally yet.
  5.  **The Tension (5 mins):** Ask two students (one from each camp) to justify their choice to the room without using theory names. Expect phrases like "It's done deal" vs "I'm not a sucker."

  ### Debrief & Theory Mapping (25 minutes)

  **1. Mapping the Intuitions**
  Start by tallying the vote. You expect a split. Map their justifications to the theories they already know.

  *   **The Refusers (CDT/EDT):** They argue that the coin has already landed. Causally, paying now cannot change the past flip. Evidentially, paying provides no new good news about the world state (the coin is already Heads). For them, the act is evaluated *ex-post*. Paying costs 1 token for 0 return. It is irrational.
  *   **The Payers (UDT):** They argue that Omega predicted their *policy*, not just their act. If they refuse now, they reveal themselves as the sort of agent who refuses, meaning Omega would have withheld the Tails reward in the simulation. They are evaluating the *ex-ante* expected utility of the policy "Always Pay". 50% chance of -1, 50% chance of +10 yields a positive expected value. Refusing yields 0.

  **2. Predictable Pitfalls**
  *   **The "Trick" Response:** Students may suspect you won't actually pay the Tails reward. *Mitigation:* Pre-commit visibly. Put the 10 tokens for the Tails branch on the desk before the flip. If Heads, you keep them; if Tails, you hand them over based on their pre-stated policy.
  *   **The "Reputation" Confusion:** Students might argue paying builds reputation for future games. *Mitigation:* Stipulate this is a one-off interaction with Omega, who disappears afterwards. This isolates the counterfactual reasoning from iterated game theory.
  *   **Sour Grapes:** Refusers may claim the Tails branch is irrelevant once Heads is known. *Correction:* Remind them that rationality is about winning, not justifying losses. The UDT agent walks away with more chocolate on average across possible worlds.

  **3. Limitations of the Activity**
  Be honest about what this exercise cannot do. Counterfactual Mugging uses a probabilistic counterfactual (a coin flip). While this illustrates the tension between ex-ante and ex-post reasoning, it does not fully capture the power of Updateless Decision Theory (or Functional Decision Theory) in **logical** counterfactuals.

  In logical scenarios (e.g., Twin Prisoner's Dilemma), the counterfactual isn't "what if the coin landed differently?" but "what if my computation outputted differently?" Students often grasp the coin case as a quirky bet but fail to see how it applies to logical correlation between agents. You must supply this bridge yourself. Explain that UDT treats your decision algorithm as a logical fact that holds across all branches where that algorithm is instantiated, whether via prediction or simulation.

  Furthermore, this activity relies on Omega's credibility. In real life, predictors are rare. The lesson isn't that they should always pay muggers, but that their decision procedure should be robust across counterfactuals where their choice matters.

  **4. Closing the Loop**
  Conclude by asking the Refusers: "If you could have pre-committed before the flip, would you have?" Almost all will say yes. Highlight that UDT is simply the formalisation of that pre-commitment, binding your future self to the policy that wins, even when the immediate situation begs you to defect. This visceral regret—that moment they wish they could have bound their hands—is the gut feeling of updatelessness.

