      *(Self-Correction during drafting)*: Make sure I don't slip into dualism. The simmballs are made of simms. The "push" must be compatible with physicalism. Emphasize that the simmball *is* a configuration of simms, but the *configuration itself* has causal powers the individual simms lack in isolation.

      *(Refining the "Push" definition)*: Be careful not to say the simmballs push the simms *instead* of the simms pushing each other. They push the simms *by* organizing how they push each other. It's top-down constraint.

