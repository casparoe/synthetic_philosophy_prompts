answer: |-
  The thesis I defend is this: the simmballs genuinely push the simms around. By this, I do not mean that simmballs introduce new energy or violate the causal closure of the physical domain. Rather, I mean that the higher-level structural regularities constituted by simmballs exert a constraint on the lower-level dynamics that is causally efficacious in a way that is not reducible to the sum of individual simm-interactions. The simmball level is not merely a convenient description; it is the locus of counterfactual stability that grounds causal explanation. To argue this, I must first define what it means for a higher-level regularity to "push" a lower-level event, demonstrate that this definition vindicates uncontroversial macro-causation, and then show that the careenium satisfies these conditions without falling prey to the charge of being a mere redescription.

  To fix the meaning of "push," we must reject the notion that causation is solely the transmission of force or energy between micro-constituents. If "push" meant only "transfer of momentum between adjacent particles," then the simmball level would indeed be idle, for the simms exhaust the momentum budget. Instead, I define "push" in terms of *counterfactual constraint*. A higher-level property $H$ pushes a lower-level event $e$ if and only if the occurrence of $e$ depends on the instantiation of $H$ in a way that is robust across variations in the micro-realizers of $H$. Specifically, $H$ pushes $e$ if: (1) were $H$ not instantiated, $e$ would not occur (or would occur differently), and (2) were $H$ instantiated by a different micro-configuration $L^*$, $e$ would still occur. On this reading, the simmball level contributes *stability*. The simm-level fixes the actual trajectory, but the simmball-level fixes the *space of possible trajectories* that count as the same causal outcome. The simmball contributes the structural integrity that ensures the simms behave as a unit rather than a scatter, thereby directing their collective momentum.

  We can test this criterion against two uncontroversial macro-cases to ensure consistency. Consider first a traffic jam causing a commuter's delay. The micro-realizer consists of specific cars braking at specific times. If we swap out the Ford for a Toyota, or change the exact millisecond a driver taps the brake, the delay still occurs. The delay depends on the *jam* (the macro-pattern of density and low velocity), not the specific identity of the cars. If the jam were not present (different macro-type), the delay would vanish. Thus, the traffic jam pushes the commuter's timeline. Consider second a rise in temperature causing ice to melt. The micro-realizer is the specific kinetic energy distribution of water molecules. We can alter the velocity of individual molecules significantly without changing the mean kinetic energy (temperature). As long as the temperature remains above zero degrees Celsius, the ice melts. The melting depends on the temperature type, not the specific molecular realizer. In both cases, we accept the macro-cause as efficacious because the effect is invariant under micro-variations that preserve the macro-type. If we deny efficacy here, we must deny causation almost entirely, as almost all macro-events are multiply realizable.

  Applying this criterion to the careenium, the simmballs satisfy the conditions for causal efficacy. A simmball is a clump of simms held together by magnetic coherence. Suppose a simmball collides with a wall, triggering a change in bounciness. If we were to rearrange the internal simms of the clump slightly—changing the micro-realizer while maintaining the magnetic cohesion and overall mass/shape (the simmball-type)—the wall would still register the collision and change its bounciness. The downstream effect depends on the simmball-type. Conversely, if the simms were scattered (no simmball-type), the wall would not register the same impact, and the bounciness would not change. Therefore, the simmball pushes the wall (and subsequently the other simms) because the outcome tracks the higher-level regularity, not the microscopic details. The simmball level contributes the *cohesion* that allows the simms to act collectively. Without the simmball structure, the simms would careen individually and fail to trigger the macroscopic response. The structure is a physical fact about the arrangement of simms, and that arrangement constrains their future interactions.

  This brings us to the objection that the simmball level is at best a redescription: causally sufficient from below, explanatorily useful from above, and causally idle in between. I concede the premise that the simm-level is causally sufficient. Given the positions and velocities of all simms, the future is determined by physical law. There is no "ghost in the machine" adding force. However, I deny the conclusion that this makes the simmball level causally idle. To call it "idle" is to assume that only the *bottommost* sufficient condition is the *real* cause. But as the traffic and temperature cases show, we routinely accept causes that are not the bottommost sufficient condition, provided they offer counterfactual robustness. The simmball description is not merely a cognitive shortcut; it tracks a physical constraint. The magnetic fields binding the simms are real forces. The *pattern* of those fields (the simmball) determines how those forces sum and interact with the environment. To say the simmball is idle is to say that the arrangement of magnets doesn't matter, only the individual magnets do. But the arrangement *is* what dictates the magnetic field geometry. Thus, the simmball is causally efficacious precisely because it is the physical configuration that screens off the irrelevant micro-details.

  A further challenge arises from the fact that simmballs have fuzzy, interest-relative boundaries. Whether a protruding simm counts as part of the ball or a satellite might depend on our threshold for "cohesion." Does this threaten their causal status? It does not, provided the fuzziness does not undermine the counterfactual robustness. Return to the traffic jam. Where exactly does the jam begin? Is it the first car slowing down, or the tenth? The boundary is vague and somewhat interest-relative (a police officer might define it differently than a driver). Yet, the jam causes the delay. The causal core—the high density region—is robust even if the edges are fuzzy. Similarly, in the careenium, as long as the magnetic cohesion is strong enough to ensure the clump moves together through the relevant interaction, the exact boundary of the clump does not negate the causal power of the clump. The vagueness is in our *classification*, not in the physical clustering that does the work. If the fuzziness were so extreme that no stable counterfactuals could be drawn (i.e., if adding one simm always radically altered the outcome), then there would be no simmball causation. But Hofstadter's setup implies stable recurring types. Therefore, the interest-relativity of the label does not negate the physical reality of the constraint.

  I adopt the criterion you suggested: a higher-level regularity pushes when the effect depends on the type rather than the particular realizer. The careenium satisfies this because the magnetic properties ensure that micro-variations within the clump do not alter the macro-trajectory. The everyday macro-cases satisfy this for the same reason: structural properties (density, mean kinetic energy) screen off micro-details. This criterion does not vindicate *every* arbitrary gerrymandered description because arbitrary descriptions (e.g., "the set of all red simms and all cars in Paris") will not exhibit counterfactual robustness. Changing a red simm to a blue one in that arbitrary set might change the outcome, or the set might not correspond to any physical constraint that propagates influence. Causal efficacy requires physical cohesion that supports counterfactual stability, not just logical grouping.

  In closing, I must state the strongest objection to this position, the one that would compel me to abandon it. This is the *Exclusion Argument*: if the micro-level facts are sufficient to determine the outcome, and the macro-level facts supervene on the micro-level facts, then the macro-level facts are causally excluded. If the micro-configuration *alone* does all the work in every possible world, then the "type-dependence" I rely on is merely a logical shadow cast by the micro-dispositions, not a distinct causal power. For this objection to succeed, it would have to be true that the counterfactual robustness I identify is not a feature of the physical system itself, but merely a feature of our descriptive language. I would have to abandon my position if it were demonstrated that the stability of the simmball behavior is accidental—that is, if the micro-laws were such that *any* random clump of simms would behave the same way, rendering the specific "simmball" structure irrelevant. But given that the simmballs are defined by magnetic coherence which physically restricts simm motion, the structure is not accidental. However, if one could prove that the macro-pattern adds no information to the micro-prediction even in principle—that the micro-level *alone* supports the same counterfactuals without reference to the type—then the simmball would indeed be idle. I maintain that the micro-level does not support those counterfactuals efficiently or naturally; it requires the macro-constraint to make sense of the stability. But if the Exclusion Argument proves that "making sense" is purely epistemic and not ontic, then downward causation is an illusion. I hold out against this, but that is the precipice upon which the argument stands.
