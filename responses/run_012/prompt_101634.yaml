          *   The "interest-relative" part is our *labeling*, not the *clustering*. The magnetic cohesion is objective. As long as the cohesion creates the counterfactual robustness, the fuzziness at the edges doesn't negate the causal core.

      *   **Constraint 6: Strongest Objection/Abandonment Condition:**
          *   Objection: The "Exclusion Argument" (Kim). If micro is sufficient, macro is excluded.
          *   Condition for success of objection: If it can be shown that the counterfactual robustness is *epiphenomenal*—i.e., if the micro-details *alone* determine the counterfactuals without reference to the type.
          *   What would make me abandon: If I had to accept that *all* macro-causation is an illusion (eliminativism) or if the "type-dependence" could be fully reduced to a disjunction of micro-conditionals without loss of information.

  4.  **Refining the Argument (Self-Correction/Polishing):**
