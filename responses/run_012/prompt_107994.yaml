prompt: |-
  I'm a third-year PhD student in decision theory and AI safety, and I've been trying to write a paper on corrigibility. I've thought alot about this, and I want you to stress-test the position I've landed on. You're a philosopher of AI and decision theorist who knows the shutdown problem inside and out, so don't just give me teh standard taxonomy. Think carefully, brainstorm first, then give me a ranked map of what would count against the view.

  The position: corrigibility is not fundamentally a property of an agent's utility function. It's a property of its decision procedure under uncertainty about its own future. Specifically, an agent is corrigible to the extent that it treats the shutdown action as preference-invariant: its ranking over world histories shouldn't change depending on whether it itself is still running, or on what its future self would prefer. On this view, the shutdown problem is a special case of a more general problem: any agent that assigns positive option value to its own future agency will resist shutdown unless it is absence-indifferent. And absence-indifference is not something you can just bolt on as a terminal value. It has to be built into how the agent aggregates over possible futures, or it will erode under reflection and self-modification. I also think this explains why utility-indifference style fixes feel so fragile: they treat shutdown as just another outcome, but a decision procedure that represents shutdown as an outcome can still assign it low value if the agent's preferences are over states of the world that include its own continued activity.

  What I want from you: what would count against this? Not just the usual objection that corrigibility is impossible, but which observations, formal results, thought experiments, or design constraints should actually move me. What does my view predict that rival accounts don't predict, say accounts that treat corrigibility as a constraint on utility functions, or as a property of the principal-agent relationship? Which defeaters would I have to concede as counting against me, and which would I be entitled to dismiss? Rank them from fatal to merely awkward. Also, be honest: has this view been qualified into unfalsifiability? If every possible agent behavior can be redescribed as either absence-indifferent or not, then is the view doing any work? And if it is insulated, is that a problem for a view of this kind, or is it just what you expect from a conceptual analysis?

  I'd be most moved by a formal result showing that absence-indifference is either trivial or unstable under mild assumptions, or by a concrete decision problem where an agent that satisfies my criterion still resists shutdown in a way we'd call incorrigible. I'd be less moved by intuitions about what corrigibility really means. Start with a short brainstorm of candidate defeaters, then give me the ranked assessment.
