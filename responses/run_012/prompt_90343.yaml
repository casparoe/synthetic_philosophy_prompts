answer: |-
  1. **The Asymmetry Argument**
  You argue that guilt requires a first-person relation to a deed, blocking transmission. Yet citizens routinely claim credit for ancestral achievements—constitutional foundations, victories, cultural heights. If the psychological and social mechanisms for transmitting pride are identical to those for transmitting blame, what principled reason blocks the transmission of fault other than the definitional stipulation that guilt *must* be non-transmissible?
  *Follow-up:* If you reply that pride is also a category error, does that not evacuate the civic nationalism you rely on for liability-bearing of its motivational fuel?

  2. **The Bearer Problem**
  You locate liability in the role or institution, but institutions are staffed by individuals. When a reparative burden is levied against the state, does it distribute automatically to current citizens via taxation and obligation, and if so, what is the normative status of the dissenting citizen who rejects the historical narrative underpinning that liability?
  *Follow-up:* If you argue dissenters remain bound by the institutional role, are you not effectively imposing a form of political guilt by another name?

  3. **The Non-Identity Point**
  Standard non-identity arguments suggest later generations cannot claim harm from past wrongs because they wouldn't exist without them. Does your liability model bypass this by ignoring the victim's claim, or do you argue that the existence of the current polity itself is contingent on the injustice in a way that deepens rather than dissolves the liability?
  *Follow-up:* If the liability survives even when the specific victims' descendants cannot claim harm, does the obligation cease to be about justice and become purely about political stability?

  4. **The Successor-Corporation Analogy**
  You lean on a successor-corporation analogy to explain transmissible liability. But consider a polity that undergoes a revolutionary break or adopts a wholly new constitution explicitly repudiating the predecessor's legal order. What grounds the surviving liability if the continuity of the institution—the very vessel you say carries the burden—has been legally and practically severed?
  *Follow-up:* If you ground it in the continuity of the *population* rather than the *state*, haven't you reintroduced a form of collective moral responsibility you explicitly reject?

  5. **Jaspersian Metaphysical Guilt**
  Jaspers ties metaphysical guilt to individual conscience and a solidarity that transcends politics. You argue this is strictly non-transmissible. But if solidarity is the basis, and solidarity is a relational bond between persons, can metaphysical guilt truly remain individual, or does the rupture of solidarity imply a collective stain that your liability framework cannot capture?
  *Follow-up:* If you concede metaphysical guilt has a collective dimension, does that not restore the very "political guilt" Jaspers named and you seek to rename?

  6. **The Apology Problem**
  Official state apologies seem to presuppose inherited guilt, using language like "we did this" rather than "our predecessors did this." On your view, are these apologies necessarily insincere category errors, or can they function as valid speech acts without the speaker admitting to the guilt they linguistically appear to claim?
  *Follow-up:* If you argue they function as undertakings rather than admissions, does the public not have a right to feel manipulated by a speech act that grammatically asserts what it philosophically denies?

  7. **The Motivation Objection**
  Liability sounds like a debt, whereas guilt sounds like a moral stain. If you successfully purge historical injustice of guilt, do you risk rendering the obligation to repair merely bureaucratic, stripping it of the moral urgency required to motivate citizens to bear costly burdens?
  *Follow-up:* If you claim liability generates its own urgency, are you not secretly relying on the moral resonance of the very guilt you claim to have excised?

  8. **Temporal Scope**
  If liability attaches to a role regardless of desert, does it have a statute of limitations? At what point does the forward-looking burden of repair become so detached from the original wrong that it constitutes a new injustice against the current role-holders?
  *Follow-up:* If you deny a statute of limitations, does your view not imply that political communities are permanently mortgaged to their origins in a way that precludes true political renewal?

  9. **Falsifiability and Concession**
  Finally, what evidence or argument could count against your separation of guilt from liability, and what would you have to concede if the political-guilt category turned out to be doing work your liability frame cannot capture?
