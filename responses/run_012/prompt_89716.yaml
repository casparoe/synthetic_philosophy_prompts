answer: |-
  **1. What we both think the method is for**

  We agree that the method exists to map the causal structure connecting physical states to subjective lives. Our goal is not to eliminate the phenomenon of consciousness nor to treat it as magical, but to establish a rigorous protocol for handling first-person claims within a third-person science. We acknowledge that ignoring verbal reports renders the field empty, while treating them as infallible renders it unscientific. Therefore, we seek a framework that respects the subject's authority without conceding ontological finality. We must distinguish the raw occurrence of sensation from the cognitive judgment made about that sensation, and further distinguish both from the public utterance produced. The method must allow us to model the subject without presuming we know what it is like to be them, yet it must not forbid the possibility that they do. Ultimately, we aim to produce models that predict behavior and report equally well, regardless of whether we grant the inner world independent reality. This statement defines the boundaries of our collaboration and the precise points where our metaphysical commitments diverge.

  **2. Agreed claims**

  1. Verbal reports are physical events caused by physiological processes.
  2. Training a subject alters the relationship between experience and report.
  3. Complete methodological neutrality is an aspiration rather than a starting state.
  4. Physiological data constrains the space of possible experiences.
  5. The link between belief and report is subject to social and cognitive pressure.
  6. The link between experience and belief is the primary fault line between us.
  7. A scientific model must account for systematic error in reporting.
  8. Ignoring first-person data renders the field explanatorily empty.
  9. Treating reports as infallible renders the field unscientific.
  10. The goal is predictive accuracy regarding both behavior and verbal output.

  **3. Where we part**

  | The question | Our wording (Heterophenomenology side) | Our wording (First-person side) | What actually turns on it |
  | :--- | :--- | :--- | :--- |
  | **Link (i) to (ii):** Does experience determine belief? | Belief about experience is a theoretical construct that may diverge from the experience itself without our knowing. | Trained belief tracks experience reliably enough to treat the belief as a proxy for the experience. | Whether we treat discrepancies as errors in reporting or errors in the subject's access to their own mind. |
  | **Link (iii) to (iv):** What is the report's status in the model? | The report is the sole datum; the experience is a fictional entity posited to explain the report. | The report is evidence of the experience; the experience is a real entity explaining the report. | Whether the "heterophenomenological world" is a useful fiction or a map of a real territory. |
  | **Ontology:** Is the subject's authority final? | The experimenter's model overrides the subject's claim if physiology contradicts the report. | The subject's claim overrides the model if physiology is ambiguous, because access is privileged. | Who decides when a report is false: the scanner or the speaker. |

  **4. Cruxes**

  1. **Training Effects.** Sub-question: Does practice tighten the link between (i) experience and (iii) report? Why it matters: If training works, Side A's skepticism about access weakens. Agreed case: Long-term meditation practitioners. Side A prediction: Training changes report style but not accuracy relative to physiology. Side B prediction: Training reduces variance between report and neural correlates.
  2. **Induced False Belief.** Sub-question: Can we make a subject believe they had an experience they did not? Why it matters: If belief diverges from experience, Side B's access claim fails. Agreed case: Change blindness paradigms. Side A prediction: Subjects will confidently report non-existent details. Side B prediction: Subjects will report uncertainty or nothing when the experience is absent.
  3. **Physiological Necessity.** Sub-question: Is there a neural signature sufficient for (i) experience without (iii) report? Why it matters: If neural state predicts experience without report, Side A's method is incomplete. Agreed case: Locked-in syndrome cases. Side A prediction: We can only model the experience via prior reports. Side B prediction: We can infer the experience directly from the signature.
  4. **Predictive Power.** Sub-question: Does assuming real experience improve predictive power? Why it matters: If realism helps prediction, Side A's instrumentalism is inefficient. Agreed case: Pain modulation studies. Side A prediction: Fiction model suffices for behavior prediction. Side B prediction: Real pain model needed for accurate outcome prediction.

  **5. Word games**

  Some disagreements are verbal. When we say "data," Side A means "publicly observable event," while Side B means "evidence of private state." If we disambiguate "data" as "input to the model," we agree reports are data. However, the dispute over "experience" is not verbal. Side A treats it as a theoretical posit; Side B treats it as an observed fact. This distinction remains substantive because it dictates whether we design experiments to test the existence of the experience or merely the consistency of the report. We cannot simply agree to disagree on definitions because the definition determines the experimental design. If experience is a posit, we look for coherence. If experience is a fact, we look for correspondence. This changes how we validate the link between (ii) belief and (iv) model.

  **6. What would move us**

  We, the heterophenomenology side, would change our mind if a model assuming real experiences predicted reports significantly better than a model assuming only fictions. We would explain away a direct neural correlate of a specific qualia as merely a correlate of the report disposition. We require proof that the inner theatre causes behavior independently of the script being read aloud. We, the first-person side, would change our mind if trained subjects consistently failed to discriminate stimuli that physiology showed they processed. We would explain away a single failure as a lapse in attention rather than a structural inability to access experience. We require proof that access is structurally blocked, not just occasionally noisy.

  **7. Unsigned**

  Neither will sign: "Conscious experience is identical to brain state." Side A requires a functional definition; Side B requires a phenomenological one. To get there, we would need a bridge law that translates qualitative character into quantitative firing rates without loss of meaning. Neither will sign: "The subject is incorrigible." Side A rejects this on principle; Side B accepts it only under strict training conditions. To get there, Side A would need proof that self-knowledge is immune to physical error. Until then, we remain divided on whether the heterophenomenological world is a novel or a diary.
