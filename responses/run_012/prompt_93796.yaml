  *Wait, one nuance:* "Someone who's chewed on the doomsday argument should laugh." The Doomsday Argument uses SSA. If this project uses SIA to argue *for* more people, that's the Presumptuous Philosopher counter to Doomsday. The joke is that they are using the Presumptuous Philosopher argument to sell hardware.

  *Stretch Goal:* "Expand Population Cap." Under SIA, this increases the probability you are in the simulation (good). Under SSA, this pushes your expected birth rank later (potentially bad if resources are finite). I'll frame it as "More Neighbors" which sounds nice but relies on SIA.

  *Pledge Tier:* "The Aggregate Joy Tier." $10 gives 1 util to 1 billion sims. $1000 gives 100 utils to 1 base human. They pick the $10.

