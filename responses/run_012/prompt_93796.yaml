answer: |-
  # Project Ontology: Secure Your Existence

  **Headline:** Build the Substrate. Ensure the Simulation. Invest in Yourself.

  **The Pitch**
  We are building the Exastructure, a computational substrate capable of sustaining 10^20 conscious agents in high-fidelity happiness. Why pledge? Because of the numbers. If base reality builds even one such machine, simulated minds will outnumber biological ones by orders of magnitude. By the Self-Indication Assumption, your current existence is evidence that many observers exist. Therefore, you are statistically likely to be running on our hardware right now.

  Pledging isn't charity. It's an acausal trade. If you are in the simulation, your pledge ensures the hardware maintaining you remains powered. If you are in base reality, your pledge ensures you build the machine that contains your future self. Either way, funding Project Ontology is the only rational investment strategy for your own continuity.

  **Pledge Tiers**
  *   **$1: The Acknowledgment.** Your name in the root directory.
  *   **$10: The Aggregate Joy Tier.** We allocate resources to increase the happiness of every simulated agent by 0.0001%. Given the population size, this creates more total utility than saving a single base-reality life. (Most backers choose this).
  *   **$1,000: Base Reality Assurance.** Priority access to physical housing if the simulation shuts down. (Statistically unlikely to be redeemed).

  **Stretch Goals**
  *   **$5M:** Upgrade cooling systems.
  *   **$10M: Expand Population Cap.** We will increase the maximum number of simulated minds by 50%. *Note: This increases the probability that you are currently simulated, thereby increasing the return on your investment.*

  **Risks and Challenges**
  *   **Thermodynamic Collapse:** High compute density generates heat.
  *   **Philosophical Instability:** Realizing you are simulated may cause distress. We have patched this.
  *   **Reference Class Errors:** If you define "observer" too narrowly, the odds shift. We recommend defining it broadly.

  **FAQ**
  *   **Q: Isn't this conflating the probability of existing with the ability to influence reality?**
      *   A: No. Under our model, the sampling distribution of observers matches the causal influence distribution. If you are likely to be an observer, you are likely to be an agent whose actions matter.
  *   **Q: What if the Doomsday Argument is true?**
      *   A: Then humanity ends soon. Pledge anyway; you'll be happier before the end.
  *   **Q: Why is the Aggregate Joy Tier the most popular?**
      *   A: People intuitively understand that a tiny gain for 10^20 people outweighs a large gain for one. Even if that one person is you.

  ***

  | Specific Anthropics Move | Assumption Needed | Objection That Bites |
  | :--- | :--- | :--- |
  | **"You are likely simulated because many exist"** | Self-Indication Assumption (SIA) | The Presumptuous Philosopher: Implies we can predict physical reality via armchair reasoning. |
  | **"Pledging helps you if you are simulated"** | Causal Efficacy (Neither) | Simulated entities cannot causally affect base-reality hardware funding (acausal trade is speculative). |
  | **FAQ: "Sampling matches causal influence"** | Fudges SSA/SIA | SSA (random sample from existing) does not imply causal power; SIA (random sample from possible) does not imply you are in *this* specific simulation. |
  | **Stretch Goal: "More People = Better Odds"** | SIA only | SSA (Doomsday Argument): More people means you are likely later in the sequence, implying imminent extinction/resource depletion. |
  | **Tier: "Tiny gain for many > Big gain for one"** | Total Utilitarianism | The Repugnant Conclusion: Justifies vast populations with barely worthwhile lives over fewer, ecstatic lives. |
