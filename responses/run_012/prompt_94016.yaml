answer: |-
  Here is a decision tree designed to break the "Germany vs. System" deadlock. It forces students to define *what* they mean by responsibility before they assign *who* has it.

  ### The Root Premise
  **Start here:** We accept that in July 1914, no head of state or general sat down and intended to cause a *general* European war. The war was a spiral, not a blueprint.

  ---

  ### The Decision Tree

  **Node 1: The Mental Bar**
  *To be responsible for an outcome, what mental state is required?*
  *   **A. Intent:** You must have intended the specific outcome (General War).
  *   **B. Foreseeability:** It is enough that you knowingly accepted a high risk of the outcome (Recklessness).
  *   **C. No Fault:** You can be linked to the outcome even without intent or foreseeable risk (Tragedy/Structural).

  **Node 2: The Bearer**
  *Who or what can hold this responsibility?*
  *   **A. Individuals:** Only specific human agents (leaders, officers, diplomats).
  *   **B. Collectives:** Entities like States, Classes, Alliances, or Generations.

  **Node 3: The Currency**
  *What are we actually handing out when we assign responsibility?*
  *   **A. Moral Guilt:** Backward-looking blame (You did wrong).
  *   **B. Material Liability:** Backward-looking cost (You pay reparations).
  *   **C. Political Answerability:** Forward-looking duty (You must explain/fix the system).

  ---

  ### The Leaves (10 Positions)

  By walking down the branches, students land in one of these ten spaces.

  **1. The Fischer Position** (Path: 1B → 2B → 3A)
  *   **View:** Germany's leaders didn't intend *general* war, but they knowingly risked it to achieve hegemony.
  *   **Label:** *Primacy of Domestic Politics / Intentionalism.*
  *   **Responsibility:** The German State bears **Moral Guilt** for gambling with Europe's safety.

  **2. The Versailles Clause** (Path: 1B → 2B → 3B)
  *   **View:** Germany may not have "wanted" it, but they pushed the crisis furthest.
  *   **Label:** *War Guilt Clause (Art. 231).*
  *   **Responsibility:** The German State bears **Material Liability** (reparations), regardless of moral intent.

  **3. The Elite Gambler** (Path: 1B → 2A → 3A)
  *   **View:** Specific individuals (Bethmann, Moltke) saw the risk and took it to save their domestic political standing.
  *   **Label:** *Social Imperialism.*
  *   **Responsibility:** Specific leaders bear **Moral Guilt**, distinct from the German people.

  **4. The Systemic Trap** (Path: 1C → 2B → 3C)
  *   **View:** The alliance system and mobilization timetables created a prison nobody could escape.
  *   **Label:** *Structuralism.*
  *   **Responsibility:** The System bears **Political Answerability**. We must fix the architecture (e.g., UN, arms control).
  *   **Note:** This accommodates "Everybody's Responsibility"—if the system is to blame, everyone inhabiting it shares the duty to fix it.

  **5. The Sleepwalkers** (Path: 1C → 2A/B → 3C)
  *   **View:** Leaders were confused and drifted into war without clear risk calculation.
  *   **Label:** *Crisis Diplomacy / Clark.*
  *   **Responsibility:** A mix of Individuals and Collectives bear **Political Answerability** for incompetence.
  *   **Limit:** *Indistinguishable from Leaf 4* in this tree. Both end at "Answerability for a system/crisis." The tree cannot separate "The System forced them" (Structuralism) from "They were too confused to stop it" (Sleepwalkers).

  **6. The Liberal Internationalist** (Path: 1B → 2B → 3C)
  *   **View:** States took reckless risks because there was no higher authority to stop them.
  *   **Label:** *Wilsonianism.*
  *   **Responsibility:** The Community of Nations bears **Political Answerability** to build a League.

  **7. The Realist Tragedy** (Path: 1C → 2B → 3B)
  *   **View:** War is a force of nature in an anarchic system; no one is "guilty," but someone must pay to rebuild.
  *   **Label:** *No-Fault Liability.*
  *   **Responsibility:** Collectives bear **Material Liability** (like insurance) without **Moral Guilt**.

  **8. The "Cog" (The Lost Memo)** (Path: 1B → 2A → 3A [Denied])
  *   **View:** A mid-level officer wrote a memo that, if read, would have delayed mobilization. It was lost.
  *   **Label:** *Causal Link without Agency.*
  *   **Responsibility:** He has **Causal Proximity** (his memo mattered) but **No Moral Guilt** (he couldn't foresee the loss/delay). He is responsible *for the memo*, not the war.

  **9. The "Gamblers" (The Read Memo)** (Path: 1B → 2A → 3A)
  *   **View:** A mid-level officer wrote a memo advising restraint. It was read and ignored by a superior.
  *   **Label:** *Bureaucratic Complicity.*
  *   **Responsibility:** The Superior bears **Moral Guilt** (ignored risk); the Officer bears **Political Answerability** (did he argue loud enough?).
  *   **Note:** This separates the *author* of the cause from the *owner* of the responsibility.

  **10. The Empty Slot** (Path: 1A → 2A/B → 3A)
  *   **View:** Someone intended to cause a general European war and is therefore morally guilty.
  *   **Label:** *Incoherent.*
  *   **Status:** **Empty.** Given our Root Premise (nobody intended general war), this branch leads nowhere. If a student lands here, they are rejecting the seminar's starting facts.

  ---

  ### Instrument Limits & Edge Cases

  **1. The Indistinguishable Pair**
  *   **Leaves 4 (Systemic Trap) and 5 (Sleepwalkers).**
  *   **Why:** Both land on "Political Answerability" arising from "No Fault." The tree treats "The System made them do it" and "They were too confused to stop it" as functionally identical outcomes (Forward-looking reform). To separate them, you would need a fourth Node asking: *Was the constraint external (alliances) or internal (competence)?* I omitted this to keep the tree walkable, but be aware students arguing these two points will sound the same here.

  **2. The Mid-Level Officer (Your Awkward Case)**
  *   **The Distinction:** The tree separates **Causal Link** from **Moral Guilt** in Leaf 8.
  *   **How to use it:** If the student says the officer is responsible *for the war*, push them to Node 1 (Foreseeability). Did he know the memo would be lost? Did he know the war hinged on it? If no, he falls to Leaf 8 (Causal Link only). If he knew the war hinged on it and wrote it carelessly, he moves to Leaf 9 (Negligence). This prevents the "Butterfly Effect" argument where everyone who existed in 1914 is responsible for the war.

  **3. "Nobody's Fault / Everybody's Responsibility"**
  *   **Placement:** This maps to **Leaf 4 (The Systemic Trap)**.
  *   **Why:** By selecting "No Fault" (1C) and "Collectives" (2B), you arrive at a responsibility that is not about blame (Guilt) but about maintenance (Answerability). It allows the student to say "No individual villain exists" without concluding "Therefore nothing matters." The responsibility shifts from *punishing the past* to *maintaining the future*.

  **4. The "Start" vs. "Duration" Distinction**
  *   **Handling:** This is embedded in **Node 3 (Currency)**.
  *   **Explanation:** **Moral Guilt** (3A) usually attaches to the *Start* (who lit the match?). **Material Liability** (3B) usually attaches to the *Duration/Outcome* (who pays for the damage?). **Political Answerability** (3C) attaches to the *System* (how do we stop the fire next time?). If a student conflates starting the war with paying for it, ask them to choose a Currency in Node 3.
