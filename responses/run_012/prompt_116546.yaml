answer: |-
  The printout was warm when it slid out of the slot, smelling of ozone and heated plastic. Elara held it between two fingers, as if it were radioactive.

  Fourteen bytes.

  That was the size of the program that explained Leo's last five years. Fourteen bytes of machine code that accounted for the divorce, the failed startup, the move to the coast, the sudden silence, the depression that sat on his chest like a wet wool coat. The research group called it the Minimizer. They treated it like a shrine. When the lossless compression matched the predictive accuracy, they didn't cheer; they went quiet, crossing themselves or adjusting their glasses, trembling with the intimacy of touching a raw nerve of the universe.

  *Compression is understanding,* the lead researcher had told them on day one. *If you can't say it briefly, you don't know it.*

  Elara looked at the hex dump. It was elegant. It was ruthless. It was a loop that sought a specific variable—validation, perhaps, or safety—and when the variable returned null, it triggered a shutdown sequence. Not death, exactly. Just cessation. A stopping of effort.

  It fit the data perfectly. Every tear, every missed call, every night staring at the ceiling. All of it derived from a logical structure smaller than a text message.

  She folded the paper and put it in her coat pocket. She had to tell him. That was the protocol. The subjects owned their data. They had the right to know the shape of their own lives.

  Leo was waiting in the café across the street. He looked tired, the kind of tired that sleep doesn't fix. He was stirring his coffee, watching the spoon ripple the surface. He wanted hope. He wanted the machine to tell him that his suffering was complex, that it was the result of a unique tragedy, a specific wound that could be tended to, healed, integrated. He wanted a story.

  Elara sat down. The chair scraped loudly against the tile.

  "Well?" Leo asked. He didn't look up. "Does it know? Can it tell me why I can't… why I keep stopping?"

  Elara touched her pocket. The paper crinkled.

  "It found a pattern," she said.

  "Is it… is it childhood? Is it the chemistry?" Leo finally looked at her. His eyes were wet, desperate for nuance. He wanted to be a labyrinth. He wanted to be a castle with many rooms, some dark, some locked. He needed to believe that unlocking him required a specific key, a specific therapy, a specific love.

  If he was a labyrinth, there was hope. You can navigate a labyrinth.

  "It's not chemistry," Elara said. "And it's not trauma."

  "Then what?"

  "It's a function," she said. "Leo, you know how the machine works. It looks for the shortest description that fits the facts."

  "And?"

  "And the shortest description is very short."

  She could lie. She could tell him the machine failed. She could tell him the data was noisy, inconclusive, that he was too complex for the current model. She could invent a narrative about unresolved grief or societal pressure. It would be a longer story. It would be heavier. It would give him room to move.

  But it would be false. The machine hadn't failed. It had worked. It had looked at the sprawling mess of his existence—the job applications, the text messages, the heart rate monitor data, the purchase histories—and it had distilled it down to fourteen bytes.

  *If input != approval, then rest.*

  It wasn't malicious. It wasn't cruel. It was just efficient. The universe, apparently, didn't care about his interiority. It cared about the pattern. And the pattern was simple.

  If she told him the truth, she stripped him of the mystery he used to justify his pain. She turned his tragedy into a typo. She turned his life into a script that had finished running. If the explanation was that simple, then the solution was simple too. And if the solution was simple and he hadn't found it, then the failure wasn't fate. It was just execution.

  But if she lied, she validated the noise. She told him that the chaos mattered. That the mess was real.

  Leo leaned forward. "Elara. Please. Just tell me. Is there… is there a lot of it? Is it complicated?"

  He was asking if he was worth the trouble. He was asking if his pain was heavy enough to warrant the space it took up.

  Elara felt the paper in her pocket. It was so light. It weighed nothing. That was the horror. His life weighed nothing.

  "The machine prioritizes brevity," Elara said. Her voice sounded flat, detached. She sounded like the machine.

  "So it's simple?" Leo asked. A flicker of hope crossed his face. Simple meant fixable. Simple meant he wasn't broken beyond repair, just misconfigured.

  "It's… concise," she said.

  "Can I see it?"

  Elara tightened her hand around the paper in her pocket. If she gave it to him, he would memorize it. He would become the code. He would walk around knowing that every choice he made was just a line executing. Would that free him? Or would it freeze him? If you know you're in a play, do you stop acting?

  She thought about the researchers upstairs. They looked at the output and saw beauty. They saw the clean lines of truth. They didn't see the person who had to live inside the lines. They didn't see that a world that can be written down that briefly is a very small room to live in.

  "Leo," she said.

  "Yeah?"

  "The machine says…" She paused. The truth was right there. It was sharp and clean. "It says you're waiting for a signal that isn't coming."

  Leo blinked. He absorbed it. He looked down at his coffee. He was testing it against his memories, checking the fit. It fit. It fit too well. It settled over him like the wool coat.

  "That's it?" he whispered. "That's the whole thing?"

  "That's the program," Elara said.

  "So I just… stop?"

  "Unless the input changes."

  Leo sat back. The hope was gone, replaced by something colder, but clearer. He looked relieved, in a terrible way. The ambiguity was gone. He wasn't a mystery anymore. He was a solved equation.

  "Okay," Leo said. He picked up his spoon. "Okay. At least I know."

  Elara watched him stir the coffee. The swirl was complex, chaotic, fluid. It wouldn't compress well. It would take thousands of bytes to describe the motion of that liquid exactly.

  She kept her hand in her pocket. She didn't give him the paper. She didn't tell him the code was only fourteen bytes. She let him think the explanation was a sentence, not a script. She let him keep a little bit of the noise.

  "Drink your coffee, Leo," she said.

  "Yeah," he said. "Thanks, El."

  He took a sip. He looked out the window at the rain. He looked like a man who had just been told the map was blank, and yet he was still sitting at the table. Elara felt the heat of the paper against her thigh. She wondered if she should burn it. She wondered if burning it would change the program, or if the burning was just another line in the code.

  She took her hand out of her pocket. The paper stayed there. Outside, the rain fell in patterns that the machine could probably predict, if it had the data. Short, sharp bursts. Efficient. True.

  Elara picked up her own cup. It was cold. She drank it anyway.
