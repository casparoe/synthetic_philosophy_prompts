prompt: |-
  I'm in my third year and taking a game theory course that's mostly problem sets, but the last few weeks are the epistemic side of it -- common knowledge, the agreeing-to-disagree result, the blue-eyed islanders puzzle, why common knowledge of rationality is supposed to be the thing that licenses Nash equilibrium and backward induction -- and honestly it's the only part of the course I enjoy. Our assessment is a 4000-word case study on whatever we like, and I don't want to do another version of the prisoner's dilemma. I've been arguing about this with my flatmate, who's doing a history module on the First World War, and I've settled on the informal truces in the trenches: the Christmas one in 1914 obviously, but more the routine arrangement that held for long stretches in quiet sectors, where units would fire at set times of day so nobody had to be careful, snipers left the other side's ration parties and working parties alone, batteries would shell the same road at the same hour every afternoon and somehow never hit the latrines, and there was a general understanding that if you killed the other side's men while they were digging, they'd kill yours. The higher commands knew about it (apparently some staffs read casualty statistics for signs of it), hated it, and did what they could to break it up -- raids and patrols were ordered precisely to put the fighting spirit back into the men, units got rotated so that nobody stayed opposite the same people for long, and there was punishment for men caught at it -- and it mostly fell apart once the big offensives started and the war got bitterer after 1915. What I want from you is a disciplined reading of that through the epistemic game theory lens: what exactly did the two sides have to know, and know that the other knew, for the arrangement to hold, how was that common knowledge built and sustained when they couldn't sit down and negotiate, and what does the theory say each side was facing in the first place. I'm especially interested in the mechanics of the signalling -- the singing across the lines, the shouted greetings, the deliberately non-lethal shelling as a way of showing intent -- because I suspect that's where the real content is and it's the bit everyone skips.

  Then the harder half, which is where I need you to actually push rather than just apply the framework. My worry is that the interesting thing about the trenches isn't that cooperation happened (the repeated-game stuff makes that unsurprising, and I know some people read the whole thing as tit-for-tat in a repeated prisoner's dilemma, though I've also seen it argued that the payoff structure there isn't even really a PD, which I'd like you to adjudicate) but that it flipped, and that the command's whole strategy looks like an attempt to destroy common knowledge rather than to win a battle: raids to make the other side unpredictable, rotation to shorten the shadow of the future. So I'd like an honest account of what common knowledge of rationality explains here, what it misses or misdescribes, and whether the episode is evidence that the standard solution concepts are an idealisation no real institution satisfies -- or just a reminder that the payoffs and the information changed, which the theory handles fine. Two smaller things I keep muddling and would like sorted out: is the truce better understood as a Schelling focal point phenomenon than as common knowledge of rationality, or are those doing different work? And does the fact that the arrangement was against orders -- that it was, in some sense, the men being more rational than their commanders -- tell us anything about whether common knowledge of rationality is a normative or a descriptive notion, since the two roles seem to be doing different jobs in the literature and I can't tell which one people mean.

  Keep it as an argument rather than a survey, and say plainly where the game theory is silent instead of making it speak. Don't bother with references or a reading list, I'll sort those out myself.
