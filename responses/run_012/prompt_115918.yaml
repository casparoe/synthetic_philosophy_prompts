answer: |-
  Here is the bill of goods. If you want that sentence to carry weight, your account of truthlikeness must satisfy the following desiderata. I have separated them into the logical non-negotiables (the "Hard Constraints") and the methodological/ontological disputes (the "Soft Constraints"), followed by the tensions that threaten to make the list jointly unsatisfiable.

  ### I. The Hard Constraints (Non-Negotiable)
  *If an account fails these, it is formally broken or trivial.*

  **1. Discrimination of Falsehoods**
  *   **Requirement:** The account must order false theories. It must be possible for Theory A (false) to be closer to the truth than Theory B (false).
  *   **Case:** Without this, your thesis sentence is empty. If all false theories are equidistant from the truth, science cannot progress *toward* the truth while remaining false; it can only jump from false to true (which history says doesn't happen).
  *   **Status:** **Non-Negotiable.**

  **2. Language Invariance (Predicate Independence)**
  *   **Requirement:** The ranking of theories must not change when the theory is redescribed in a different but logically intertranslatable vocabulary (e.g., swapping "hot" for "non-cold").
  *   **Case:** If closeness to truth depends on which predicates we happen to speak, then verisimilitude is a feature of language, not the world. This was the death of Popper's original definition (via Miller and Tichý).
  *   **Status:** **Non-Negotiable.** (Though notoriously difficult to satisfy).

  **3. The Truth is the Limit**
  *   **Requirement:** The actual truth must be ranked as maximally truthlike. No false theory can be ranked as closer to the truth than the truth itself.
  *   **Case:** If a false theory can be "closer to the truth" than the truth, the concept loses its normative force. It ceases to be *truth*-likeness and becomes something else (e.g., utility).
  *   **Status:** **Non-Negotiable.**

  **4. Irrelevance of Truth (No Tacking)**
  *   **Requirement:** Adding a true but irrelevant conjunct to a theory should not increase its verisimilitude. (e.g., "The electron has charge -e" is close; "The electron has charge -e AND there is a cup on my desk" should not be *closer*.)
  *   **Case:** Without this, I can inflate the verisimilitude of any theory by conjoining it with a list of trivial truths (e.g., tautologies or observational trivialities). This makes the measure manipulable and disconnected from the theory's specific content.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. The Contested Terrain (Your Three Disputes)
  *These are the points where camps diverge. Satisfying them often breaks the Hard Constraints.*

  **(i) Answerability to Practice (The Success Link)**
  *   **The Requirement:** A theory ranked as closer to the truth should generally yield better predictions and control than one ranked further away.
  *   **The Case For:** If verisimilitude does not explain why we prefer Newton over Aristotle in the lab, it is a metaphysical ghost. It must cash out in scientific rationality.
  *   **The Case Against (Your Office Mate):** This conflates *semantics* (what truthlikeness *is*) with *epistemology* (how we *know* it). A theory could be close to the truth but empirically intractable, or false but highly successful (instrumentalism). Demanding this link risks circularity: defining truthlikeness *as* predictive success.
  *   **Verdict:** **Soft Constraint / Explanatory Hope.** It is not a definition constraint, but an adequacy condition. If an account *systematically* divorces closeness from success, it is useless for your thesis, even if logically sound.

  **(ii) The Relabeling Case (Structuralism vs. Referentialism)**
  *   **The Requirement:** If a theory gets the structure right but swaps the names of the entities (e.g., calling protons "electrons" and vice versa, adjusting all laws accordingly), it should be ranked as maximally close (or identical).
  *   **The Case For:** This captures the intuition that science discovers *structure*, not necessarily the intrinsic "this-ness" of objects. It aligns with Structural Realism.
  *   **The Case Against:** Standard semantic accounts count sentences. "Protons are positive" is false if protons are labeled negative. To satisfy this, you must abandon sentence-based accounts for model/isomorphism-based accounts. This smuggles in a specific ontology of theories (structuralism) that not all realists accept.
  *   **Verdict:** **Taste/Ontological Commitment.** If you are a standard entity realist, this is not a requirement. If you are a structural realist, it is non-negotiable. For your thesis, it depends on whether you think progress is about *things* or *relations*.

  **(iii) Idealization (The "Known Falsehood" Problem)**
  *   **The Requirement:** The account must rank idealized models (frictionless planes, perfect gases) as close to the truth, despite them being literally false and often known to be so by their users.
  *   **The Case For:** As you noted, this is what science actually *uses*. An account that says idealizations are "maximally far" from the truth because they assert non-existent entities renders the concept irrelevant to actual scientific progress.
  *   **The Case Against:** Idealizations are often *categorically* false, not approximately true. A point mass isn't a "close approximation" of a planet; it's a different category of object. Handling this requires a logic of counterfactuals or limits, not just standard verisimilitude.
  *   **Verdict:** **Hard Constraint for Applicability, Ignored by Formalism.** Most formal accounts (Niiniluoto, Oddie) ignore this. If your thesis is about actual science, this is non-negotiable. If it is about formal semantics, it is often waived.

  ---

  ### III. The Tensions (Where the Check Bounces)

  Here is the bad news. There are strong reasons to believe these requirements are jointly unsatisfiable, or at least that satisfying one forces you to violate another.

  **1. Language Invariance vs. Relevance (The Miller-Tichý Tension)**
  To satisfy **Language Invariance**, you need a measure that doesn't care about how you carve up the world (predicates). To satisfy **Irrelevance of Truth**, you need a measure of *relevant* content. But "relevance" is notoriously language-dependent.
  *   *The Conflict:* If you define closeness by the number of true consequences (Consequence Account), you fail Language Invariance (Miller's proof). If you define it by similarity in a state-space (Similarity Account), you fail Language Invariance unless you posit a "privileged" set of natural properties (which is metaphysically costly and arguably language-relative itself).
  *   *Result:* You likely cannot have perfect Language Invariance without positing a "God's Eye" vocabulary of natural kinds.

  **2. The Truth is the Limit vs. Answerability to Practice**
  *   *The Conflict:* History is full of theories that were *more* successful but *less* true (e.g., Ptolemaic astronomy vs. early Copernicanism). Ptolemy predicted positions better for centuries. If you demand that "closer to truth" entails "better prediction," you might have to rank a false theory *above* the true theory (violating **The Truth is the Limit**).
  *   *Result:* You must decouple verisimilitude from immediate empirical success. This weakens your thesis sentence's link to "progress" as scientists experience it.

  **3. Idealization vs. The Truth is the Limit**
  *   *The Conflict:* Idealizations are often strictly false (probability zero). In many formal accounts, a strictly false statement cannot be "close" to a true statement in a continuous space without a specific metric of approximation. If the theory says "Friction = 0" and truth is "Friction = 0.001," standard logic treats the first as simply *false*, not *approximately true*.
  *   *Result:* To handle idealization, you need a topology or metric space, not just logic. This moves you out of standard verisimilitude and into modeling theory.

  ---

  ### IV. The Killer Requirements

  You asked which single requirement does the most damage to the popular families of account.

  **1. For Consequence Accounts (Oddie, Niiniluoto, Popper):**
  *   **The Killer:** **Language Invariance.**
  *   **Why:** These accounts define verisimilitude based on the set of true and false consequences (sentences). David Miller proved that the ordering of these sets flips depending on the logical vocabulary used (e.g., {hot, rainy, windy} vs. {hot, Minnesotan, Arizonan}). To save the account, you must restrict consequences to "relevant" ones, but defining relevance without circularity or language-dependence has proven impossible so far. This requirement breaks the machinery of the consequence camp.

  **2. For Similarity/Model Accounts (Tichý, Hilpinen, Structuralists):**
  *   **The Killer:** **The Choice of Dimensions (a subset of Language Invariance).**
  *   **Why:** These accounts define closeness as distance in a state-space (e.g., temperature vs. pressure). But who chooses the dimensions? If I measure distance in "temperature" space, Theory A is closer. If I measure in "reciprocal temperature" space, Theory B is closer. To fix this, you must assert that some properties are "natural" and others are not. This requires a heavy metaphysical commitment to Natural Kinds that many philosophers reject. It breaks the account's claim to objectivity.

  **3. The Universal Killer (For Your Thesis):**
  *   **The Killer:** **Idealization.**
  *   **Why:** Both families struggle here. Consequence accounts treat idealizations as massive falsehoods (high falsity content). Similarity accounts struggle because the "distance" to an idealization is often undefined (what is the distance between a point mass and a planet?). Since your thesis sentence relies on science *actually* progressing, and science progresses *via* idealizations, an account that cannot rank idealizations as "close" renders your sentence descriptively false for most of the history of physics.

  ### Summary for the Framing Chapter

  If you want to keep that sentence, you have to admit that **no existing formal account satisfies all the Hard Constraints simultaneously without metaphysical baggage.**

  *   If you choose **Consequence**, you sacrifice **Language Invariance**.
  *   If you choose **Similarity**, you sacrifice **Ontological Neutrality** (you must assume natural kinds).
  *   If you choose **Neither**, you struggle with **Idealization**.

  **Recommendation:** Do not try to solve verisimilitude in the framing chapter. State the sentence, acknowledge the "Hard Constraints," and explicitly flag **Idealization** and **Language Invariance** as the open problems your thesis will navigate around, rather than solve. Your thesis sentence is a *regulative ideal*, not a settled theorem. Treat it as such, and you won't hit the wall.
