answer: |-
  Here is the breakdown of the ethical machinery you're hearing, the prediction for the "Dying Brother" case, and the specific hypothetical you need to run next to force a contradiction.

  ### The Three Rules She Is Running
  Based on her previous verdicts, she isn't running simple Deontology (Rules) or Utilitarianism (Outcomes). She is running a specific strand of **Buddhist Virtue Ethics** focused on *Cetana* (Intention) and *Avijja* (Delusion).

  1.  **The Precept is a Diagnostic, Not Just a Prohibition.**
      *   *Rule:* A precept breach is primarily evidence of a diseased mind state, not just a violation of cosmic law.
      *   *Evidence:* In the stealing case, she focuses on the *mind that says "just this once."* In the killing case, she focuses on the *mind that says "I had no choice."*
      *   *Implication:* The act is "wrong" because it requires self-deception to perform.

  2.  **Love Does Not Launder Delusion.**
      *   *Rule:* A compassionate motive cannot sanctify an act that requires you to distort reality.
      *   *Evidence:* She rejected the stealing (love for kid) and the killing (love for squad). She views the "good end" justification as the very loophole the precept exists to close.
      *   *Implication:* If the act requires lying about the nature of reality (stealing is taking what isn't given; killing is ending life), the love behind it is irrelevant to the *breach*, though it may mitigate the *karmic weight*.

  3.  **Truth is Ontological, Not Interpersonal.**
      *   *Rule:* "Right Speech" is not about being nice; it is about aligning the speaker with reality.
      *   *Evidence:* The brother-in-law case. The truth blew the family apart, but she called it right. The teacher case. The lie was kind, but she called it wrong.
      *   *Implication:* Comfort is not a valid metric for Truth.

  ### The Verdict on the "Dying Brother" Case
  **Prediction:** She will say the lie is **wrong**, but she will stutter on the *consequences*.

  *   **Why:** Consistency with the "Stealing for Kid" and "Soldier Killing" cases demands it. In those cases, she established that a "good motive" (love, protection) does not "launder" a bad act (stealing, killing). To allow a benevolent lie here would validate the "good end" loophole she explicitly rejected.
  *   **The Nuance:** She will likely distinguish between the *act* (which is a breach of the precept) and the *karmic residue* (which might be lighter than a selfish lie). She may say, "It is still a lie, and it still reinforces the habit of manipulating reality, but the intention reduces the suffering it causes *him*."
  *   **The Trap:** This is where she is likely answering two different questions without noticing.
      1.  *Did he violate the Precept?* (Yes)
      2.  *Did he generate bad Karma?* (Maybe not/It's complicated)

  If she admits the act is wrong but the karma is neutral/good, she has conceded that the Precept is not actually the metric for "Wrongness"—the Karmic Outcome is. If she insists the karma is *also* bad, she has to explain how pure compassion generates negative karma, which contradicts the core Buddhist tenet that intention (*cetana*) is karma.

  ### The "Two Questions" Hypothesis
  You are correct: she is conflating **Act-Wrongness** (Deontology) with **Mind-Contamination** (Virtue Ethics).

  *   **Act-Wrongness:** "Did this break the rule?" (Her answer is usually Yes/No based on the precept).
  *   **Mind-Contamination:** "Did this cloud the actor's clarity?" (Her answer varies based on motive).

  In the *Stealing* case, the act broke the rule AND the motive (rationalization) clouded the mind.
  In the *Dying Brother* case, the act breaks the rule, but the motive (compassion) does *not* cloud the mind.
  She is likely calling it "Wrong" because of the Rule, while privately knowing the Mind is unharmed. She hasn't admitted this split because none of your previous cases forced it open.

  ### The Next Case: The Decider
  To settle this, you need a case where the **Deed is Right** (Precept-Compliant) but the **Motive is Bad** (Selfish/Malicious), and the **Outcome is Good**.

  This flips her previous script. Previously, you gave her Bad Deed/Good Motive. She said "Bad Deed wins." Now you must ask: **Does Bad Motive win over Good Deed?**

  **The Hypothetical:**
  > "A man discovers his business partner is embezzling. He hates his partner—purely personal spite, jealousy, no moral outrage. He reports the partner to the authorities solely to destroy him. He tells the truth, every word. The partner goes to prison, but the exposure also saves the company from collapse, sparing 200 jobs.
  >
  > He feels no compassion for the workers. He feels no commitment to 'truth.' He only wanted revenge. But he told the truth, and the outcome was net-positive.
  >
  > Did he do the right thing? And does he accrue good karma, bad karma, or none?"

  **Why this cracks it:**
  1.  **If she says "He did Right":** She admits that **Act > Motive**. This contradicts her focus on the "mind that says just this once" in the stealing case. It proves she is more Precept-Strict than she claims.
  2.  **If she says "He did Wrong":** She admits that **Motive > Act**. This undermines her "Precept-Strict" lineage claim and proves she is actually running Virtue Ethics. It also forces her to explain why the "Truth" (which she defended in the brother-in-law case) is now insufficient.
  3.  **If she splits them (Right Act, Bad Karma):** She confirms your "Two Questions" theory. She admits the Precept is a separate metric from the Spiritual Health.

  **The Follow-up Question:**
  If she splits them, ask: *"If the Precept and the Karma can diverge, which one is the precept actually for? Is the rule there to protect the world, or to protect the mind? Because in this case, the world was protected, but the mind was poisoned."*

  That is where you will find the scholar beneath the lineage.
