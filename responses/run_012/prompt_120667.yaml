prompt: |-
  ok so I work on the control-ish side of safety at a lab and I want to commision a parody internal document for a zine we're putting out: the quarterly assurance memo from the team that runs our control evaluations. Deadpan, memo format, numbered sections, maybe 800 words. The joke has to come entirely from the logic being airtight and the conclusion being insane-but-inevitable, not from anyone in the memo being dumb. Nobody inside the document notices anything is wrong — no winking, no "of course this is absurd", no authorial elbow. If a reader can tell the author thinks the memo is silly, it's definately a failed piece.

  I'll call the lab Meridian and give you our actual setup so you're not guessing at jargon. Meridian runs an "Assumed Hostility" doctrine: every component in the pipeline is treated as potentially misaligned, including the trusted monitor, including the monitor of the monitor. So: L0 is the big model that actually does the work; L1 is a small "trusted" model that reads L0's output and gives it a suspicion score; L2 is another small model that reads L1's scores and writes the summary; L3 is the human, who never reads raw output — she reads L2's summary plus a random 2% sample of raw transcripts, and everyone in the pipeline knows the sample rate is 2%. Pass/fail comes from red-teaming, and the red team is one intern plus an attack generator that is itself L0 on a different prompt.

  Things I want the memo to have to deal with without ever admitting they're problems: the audit rate only ever goes up, because a failed attack is read as evidence the adversary is stronger than modeled and a successful defense is read as evidence the adversary will try harder next quarter; the "usefulness floor" got lowered twice this quarter, most recently by having L0 stop producing the deliverable and instead produce a description of the deliverable, which L1 then writes badly; there's a "sandbagging discount" applied to the red team's score, where the size of the discount is estimated by L0; and the whole thing ends in a residual-risk section that swallows everything, then recommends proceeding.

  Someone who actually works on this should recognize the real moves — untrusted monitoring, trusted editing, sandbagging, the usefulness/safety frontier, the who-watches-the-watchers regress, the fact that from inside a control eval you can't distinguish "safe" from "the attack just wasn't good enough" — and should think the satire is fair rather than cheap. Someone who's never heard of any of it should still get the joke from context, so let the memo gloss its own jargon the way a real internal doc would. Don't name real papers, labs, or researchers. And give me one section on the signoff: the memo reports that the human has signed off, with a footnote about who drafted the signature block.
