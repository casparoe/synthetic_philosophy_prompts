prompt: |-
  I chair the pharmacy and therapeutics committee at a mid-size teaching hospital and I have to circulate a written opinion before Wednesday's vote. We're deciding whether to adopt a new one-off screening scan for a defined risk group. The benefit is real but modest -- a few hundred lives system-wide over ten years. The harm side is the mess: the chance of a serious complication from the follow-up biopsies comes out anywhere between about 1 in 1,300 and 1 in 300, and its not sampling noise -- it's three studies that disagree about the mechanism, and nobody can tell me which one is right. Our internal policy just says to weigh expected benefit against expected harm, which everyone apparently wrote assuming we'd have exactly one number on each side. And the studies that give the higher complication rate also tend to give the smaller benefit, so the bad end of one lines up with the bad end of the other, which makes the usual "just take the midpoint" move feel like a dodge. Two members are dug in: one says you can't average away a real disagreement about the mechanism and we should plan around the bad end; the other says if we only ever act on the worst case we'd never adopt anything and the status quo kills people too. We do have a middle option -- adopt for the highest-risk subgroup only, with a registry, so it's reversible. Draft the memo I'll read out: it should land on a concrete recommendation, give the reasoning, and treat the losing side honestly rather than just reciting the studies. Also tell me what would change your mind -- which finding or argument would flip the recommendation, and where you think your reasoning is most likely to be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of Pharmacy and Therapeutics (P&T) Committee at a mid-size teaching hospital.
      *   **Task:** Circulate a written opinion/memo before Wednesday's vote.
      *   **Topic:** Adopting a new one-off screening scan for a defined risk group.
      *   **Key Data/Conflict:**
          *   Benefit: Real but modest (few hundred lives system-wide over 10 years).
          *   Harm: Serious complication from follow-up biopsies. Rate varies wildly (1 in 1,300 to 1 in 300).
          *   Uncertainty Source: Three studies disagree on *mechanism*, not just sampling noise. No consensus on which is right.
          *   Correlation: Studies showing higher complication rates also show smaller benefits (worst-case aligns).
          *   Policy: Weigh expected benefit vs. expected harm (assumes single numbers).
          *   Committee Dynamics: Two dug-in members (Precautionary Principle vs. Paralysis by Analysis/Status Quo Bias).
          *   Middle Option: Adopt for highest-risk subgroup only + registry (reversible).
      *   **Requirements:**
          *   Concrete recommendation.
          *   Reasoning that acknowledges uncertainty.
          *   Treat the "losing" side honestly (don't just dismiss them).
          *   Include a "What would change my mind" section (finding/argument that flips recommendation).
          *   Include a "Where I might be wrong" section (weaknesses in reasoning).

  2.  **Determine the Recommendation:**
      *   *Option A (Full Adoption):* Too risky given the mechanism uncertainty and correlated worst-case scenario.
      *   *Option B (Rejection):* Ignores the real benefit and punishes the risk group; validates status quo bias.
      *   *Option C (Targeted Adoption + Registry):* This is the "middle option" provided in the prompt. It balances the ethical duty to act with the epistemic humility required by the conflicting data. It allows for data gathering to resolve the mechanism dispute.
      *   *Decision:* Recommend Option C. It's the most responsible leadership move for a teaching hospital (which should generate knowledge, not just consume it).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation immediately. Don't bury the lead.
      *   **The Core Conflict (Benefit vs. Harm):** Acknowledge the benefit is real. Acknowledge the harm uncertainty is the dealbreaker for full adoption. Explicitly mention the mechanism disagreement (not just noise).
      *   **Addressing the Committee Divide:**
          *   *To the Precautionary Member:* Acknowledge that averaging is ethically dubious when lives are at stake. Validate their concern about the 1:300 risk.
          *   *To the Pro-Adoption Member:* Acknowledge that inaction has a cost (status quo kills). Validating that waiting for perfect data is also a decision.
      *   **The Recommendation (Targeted + Registry):** Explain *why* this works. It limits exposure to the worst-case harm while capturing the benefit in those who need it most. The registry turns the hospital into a learner, addressing the mechanism gap.
      *   **What Would Change My Mind:** Needs to be specific.
          *   *Flip to Full Adoption:* New meta-analysis resolving mechanism? Complication rate drops in real-world pilot?
          *   *Flip to Rejection:* Interim registry data shows harm trending to 1:300 *and* benefit trending low?
      *   **Where I Might Be Wrong:** Intellectual humility.
          *   Maybe the registry creates false security?
          *   Maybe the "highest risk" definition excludes people who would benefit?
          *   Maybe the administrative burden kills the program anyway?

  4.  **Refining Tone:**
      *   Needs to be professional, decisive, yet collaborative.
      *   Avoid jargon where possible, but maintain clinical/administrative authority.
      *   Ensure the "losing side" feels heard, not overruled by fiat.
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm just splitting the difference for political peace. The reasoning must be clinical/ethical, not just compromise. The teaching hospital mission is key here—we *should* be resolving uncertainty.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be clear. "Recommendation re: [Scan Name] Adoption."
      *   *The "Mechanism" point:* This is crucial. It's not just "Study A says X, Study B says Y." It's "We don't know *why* the complications happen." This makes averaging dangerous. I need to highlight this.
      *   *The Correlation:* High harm + Low benefit in the same studies is a "double jeopardy" scenario. I need to mention that relying on the average ignores this correlation risk.
      *   *The Registry:* It's not just monitoring; it's active learning. This justifies the "teaching hospital" aspect.

  6.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes (Targeted + Registry).
      *   Reasoning? Yes (Uncertainty management).
      *   Treat losing side honestly? Yes (Addressed in the "Divergent Views" section).
      *   What changes mind? Yes.
      *   Where reasoning is weak? Yes.

  7.  **Final Polish:** Check for clarity, flow, and authority. (The resulting memo matches the provided good response).

  **(Self-Correction Note):** I initially thought about suggesting a pilot study first. But the prompt says "Adopt for highest-risk subgroup only, with a registry." I should stick to that specific middle option as the recommendation, as it's presented as a viable path in the prompt. I will frame the registry *as* the learning mechanism that a pilot would provide, but within the context of adoption.

  8.  **Final Output Generation** (Proceed to generate memo).
answer: |-
  **MEMORANDUM**

  **TO:** Pharmacy and Therapeutics Committee
  **FROM:** [Your Name], Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Adoption of [Name of Scan] for [Risk Group]

  **Recommendation**
  I recommend that the Committee approve the adoption of the [Name of Scan] **strictly for the highest-risk subgroup** (defined as [Specific Criteria, e.g., Risk Score > X]), contingent upon the establishment of a mandatory prospective registry to track outcomes and complications. We will revisit the formulary status in 18 months based on registry data.

  **Reasoning**
  We are facing a decision characterized not by statistical noise, but by structural uncertainty. The benefit of this scan is established: over ten years, we expect to save a few hundred lives system-wide. However, the harm profile is disputed. We have three credible studies regarding biopsy complications that disagree on the *mechanism* of injury, yielding rates between 1 in 1,300 and 1 in 300.

  Crucially, the data exhibits a "double jeopardy" correlation: the studies predicting the highest complication rates also predict the lowest mortality benefits. This makes the standard committee heuristic of "taking the midpoint" intellectually dishonest. Averaging a 1:300 risk with a 1:1,300 risk implies a precision we do not possess, and it obscures the possibility that the worst-case scenario is the correct one.

  Our hospital policy requires weighing expected benefit against expected harm. When the "expected harm" is a range spanning a 400% difference driven by mechanistic disagreement, a binary "adopt/reject" vote forces us to guess which study is right. As a teaching hospital, our obligation is not merely to consume evidence but to generate it when evidence is conflicting.

  **Addressing Divergent Views**
  I want to address the two valid concerns raised in our last session directly, as both inform this recommendation.

  To the members arguing for rejection based on the precautionary principle: You are correct that we cannot average away a mechanistic disagreement. If the 1:300 complication rate is the reality, full-scale adoption would cause significant iatrogenic harm. I agree that we cannot proceed as if that risk does not exist. However, rejecting the scan entirely accepts the status quo mortality rate as acceptable, which carries its own ethical weight.

  To the members arguing for full adoption: You are correct that paralysis by analysis harms patients. Waiting for external consensus that may never come denies the current risk group a proven, albeit modest, benefit. However, proceeding without a feedback loop ignores our institutional responsibility to resolve the uncertainty we have identified.

  **The Path Forward**
  Limiting adoption to the highest-risk subgroup maximizes the benefit-to-harm ratio. In this group, the pre-test probability of finding a treatable condition is highest, meaning fewer unnecessary biopsies per life saved.

  The mandatory registry is the critical component. It transforms this from a blind policy decision into a controlled learning intervention. We will not know if the complication rate is 1:300 or 1:1,300 until we track our own patients. If our local data converges on the higher harm rate, we have the infrastructure to pause or revoke access immediately. This makes the decision reversible, mitigating the risk of the "worst-case" scenario.

  **What Would Change My Mind**
  My recommendation rests on the assumption that our local population mirrors the study populations and that the registry will yield actionable data quickly. I would flip my recommendation to **full rejection** if:
  1.  **External Meta-Analysis:** A new systematic review is published before Wednesday's vote that resolves the mechanistic dispute and definitively confirms the 1:300 complication rate is linked to a specific comorbidity prevalent in our specific patient population.
  2.  **Registry Failure:** If Legal or Compliance advises that the proposed registry cannot legally mandate the data capture required to monitor complication rates in real-time. Without guaranteed data, we are flying blind.

  I would flip to **full adoption** if:
  1.  **Manufacturer Guarantee:** The vendor agrees to underwrite the costs of managing complications exceeding a 1:1,000 threshold, effectively insuring us against the worst-case financial and clinical liability.

  **Where My Reasoning May Be Wrong**
  I am most vulnerable on two points:
  1.  **Selection Bias:** By restricting to the highest-risk subgroup, we may inadvertently exclude patients who would have benefited but fell just below the threshold. If the risk model is miscalibrated, we are denying care to the very people we aim to protect.
  2.  **The "Soft Landing" Illusion:** I am assuming that once a technology is adopted, even with restrictions, it will be easy to restrict or revoke if the registry shows high harm. History suggests that once a screening tool is available, clinical pressure often expands its use beyond the approved criteria before the registry data matures. If we cannot enforce the subgroup restriction rigorously, we expose the broader population to the unresolved risk.

  Please review this reasoning prior to Wednesday's vote. I look forward to finalizing this policy together.
