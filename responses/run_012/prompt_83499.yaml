  **Application No.:** 18/450-K9
  **Filing Date:** 14 March 2024
  **Applicant:** Helios Institute for Fundamental Metrics
  **Examiner:** Vance, J.H.
  **Art Unit:** 3999

  **DETAILED ACTION**

  **Status of Claims**
  Claims 1–20 are pending. Claim 20 is allowed. Claims 1–19 are rejected.

  **Claim Interpretation**
  The present application describes a system for mapping an accessible algebra of coarse-grained statistics to an ontic sector comprising fine-grained states and a measure. The central claim is that this mapping constitutes a patentable identification of physical reality. The specification distinguishes between records available to an agent within the theory and the underlying states purported to generate them.

  **Claim Rejections - 35 U.S.C. § 112**
  Claims 1–19 are rejected under 35 U.S.C. 112(b) as being indefinite for failing to particularly point out and distinctly claim the subject matter which the inventor regards as the invention.

  The specification stipulates that a central subset of the claimed ontic sector is dynamically screened off. Paragraph 0042 states that no procedure available to an agent described by the theory can discriminate among elements of this subset. The Examiner maintains that an ontology is identified only when every element of the claimed set is in principle discriminable by some procedure available to an agent described by the theory. If elements cannot be distinguished by any physical interaction permitted by the theory, the claim fails to specify what distinguishes one element from another. The recitation of distinct states where no distinction is observable renders the scope of the claim unknowable.

  **Response to Arguments**
  Applicant argues that the screening is a feature of the theory rather than a defect in the identification, and that the ontology is identified up to an equivalence class specified in the application. This argument is not persuasive.

  First, the accessible statistics underdetermine the ontic sector. The mapping provided in Claim 1 is relative to a choice made by the applicant rather than derived from the statistics themselves. Multiple ontic sectors could reproduce the same accessible algebra. By selecting one without a discriminating procedure, the applicant claims a specific configuration where the data supports only a class of configurations. The surplus structure sits idle; a sector declared inaccessible in advance cannot license any prediction distinct from the accessible algebra alone. Consequently, the claimed invention adds structural complexity without corresponding functional output.

  Second, regarding the equivalence class: The class is defined by the very inaccessibility that is supposed to be incidental to it. To define the class is to enumerate the limits of discrimination, not the nature of the states. Claim 5 was amended during prosecution to exclude the screened sector entirely. By narrowing the claim to only the discriminable residues, Applicant has conceded that the ontic residue lacks causal efficacy independent of the algebra. This amendment renders the ontic sector trivial, as it adds no explanatory power beyond the statistics already claimed in Claim 20. The applicant has thereby conceded more than intended, reducing the ontology to a redundant mirror of the accessible data.

  The Examiner notes that the test for discriminability relies upon a macroscopic agent model which is itself subject to the same screening conditions. Whether the Examiner's own evidence satisfies this test is not obviously determinable within the current framework. However, the burden rests on the applicant to demonstrate identification within the claimed system. The asymmetry between the requirement for discriminability and the theoretical limits of the agent remains unresolved in the record, but does not excuse the indefiniteness of the claimed ontic states. The Office cannot grant exclusive rights to a distinction that the system itself forbids agents from making.

  **Conclusion**
  The question of whether the theory possesses an ontology remains open in the paperwork. The accessible algebra is sufficiently definite for patent purposes. However, the extension of this algebra into an ontic sector containing inaccessible elements fails to meet the statutory requirements for definiteness and enablement. The surplus structure is not enabled because its properties cannot be verified by the agents defined within the system.

  Claim 20, directed solely to the accessible algebra and its internal consistency, is allowed. Claims 1–19, directed to the existence and specific arrangement of the ontic sector, are rejected. Applicant is advised that further amendments attempting to define the screened sector via external meta-theories may introduce new matter under 35 U.S.C. 132.

  Any inquiry concerning this communication should be directed to Examiner J.H. Vance.

  /J.H. Vance/
  Primary Examiner
  Art Unit 3999
