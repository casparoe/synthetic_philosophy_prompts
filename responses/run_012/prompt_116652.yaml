prompt: |-
  ok so I just had a two and a half hour argument with my friend Dan about whether his landlord coerced him, and I've come out of it with a pattern I can't name, and it's driving me up the wall. Sorry for the ramble, I'm still annoyed.

  The case: Dan's landlord said he could stay, but the rent goes up 300 a month, otherwise he's out at the end of the month. Dan said fine. Dan thinks he agreed. I think he didn't really agree to anything. We got absolutely nowhere.

  What's bugging me is that I can make near-identical cases where I'd say the opposite, and I can't find what changes between them:

  - Doctor: 'take this pill every day or you'll probably be dead in a year.' I say yes. Nobody calls that a threat, nobody says my yes doesn't count. If anything I'm grateful.
  - Boss: 'work Saturday or you're out.' I'd say the boss is a jerk. I would not say I didn't agree to work Saturday.
  - Boss, other version: 'sleep with me or you're out.' Now my yes is not a yes, obviously.
  - Mugger: 'your wallet or your teeth.' There's no agreement here at all as far as I can tell, even though I'd hand the wallet over.
  - Landlord: the one above, which I'm definately confident is on the mugger side of the line and Dan's just as confident it's on the boss-Saturday side.
  - Shopkeeper during a flood: '500 for the boat ride across.' He's not threatening me and he didn't cause the flood, and if I pay then fine, I paid — but everyone I know would say he did something wrong to me. I keep wanting to put this one in the same bucket as the landlord, and I suspect it's actually a seperate bucket, which is part of what I want you to sort out.

  In all six, someone's hanging a bad outcome on my not doing what they want. The size of the bad outcome doesn't sort them — losing my job is worse than losing 300 a month, but one counts and one doesn't. First theory: maybe it's whether the other person created the bad outcome. Dies immediately, the boss creates the 'you're fired' outcome too.

  Second theory: it depends whether they were allowed to hang that consequence on me in the first place — boss is allowed to ask for Saturday, not for sex. But that's a circle, isn't it? Whether the landlord was allowed to demand the extra 300 seems to depend on whether Dan validly agreed to it, which is the exact thing I'm trying to figure out.

  So: is there a name for this? I have a feeling there's something in ethics or law about it but I've never studied either. And I don't want just a word. I want to know what the thing actually is, where it stops, and which of my six cases each candidate answer gets right.

  Give it to me as: 'The pattern' (~150 words), where you say back what I've noticed and say whether it has an established name or you're coining one; 'What it's not' (four short paragraphs) on the nearby ideas I'd probably confuse it with, and where each comes apart from mine; 'The best account' (~300 words) laying out the strongest version of the distinction and testing it against my six cases one by one; 'Edges' (two or three cases) where that account gets weird or contested and what you'd do with them; and 'Verdict' (three sentences) on whether I've found a real thing or just restated something older with worse vocabulary. Skip the reading list, I'm not going to read it.
