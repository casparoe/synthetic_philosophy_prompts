  **BUREAU OF HISTORICAL EXPLANATION STANDARDS**
  **Form CL-1: Application for Explanatory Certification**

  **Section I: The Explanandum**
  1. Specific Event (Space-Time Coordinates): ___________________
  2. Description (Theory-Neutral): ___________________

  **Section II: The Deduction**
  3. Antecedent Conditions (t0): ___________________
  4. Universal Generalization (Law): ___________________
  5. Derivation Validity: Does Event follow logically? [ ] Yes [ ] No

  **Section III: Certifications**
  6. Law is empirically confirmed, not probabilistic. [ ]
  7. Law is not compatible with Non-Event given Conditions. (Symmetry Check) [ ]
  8. Explanation would fail if Law were false. (Counterfactual Dependence) [ ]
  9. Law contains no *ceteris paribus* clauses. [ ]

  **Appendix B: Standard Rejection Codes**
  **104 (Hedged Law):** Generalization contains implicit "all else being equal" clause. Unverifiable.
  **211 (Symmetry Violation):** Cited law supports deduction of Event's non-occurrence equally well.
  **305 (Insensitivity):** Historical consensus holds Event occurred regardless of Law's truth value.
  **402 (Post Hoc):** Generalization formulated only after Event observed. No predictive power.
  **500 (Narrative Intrusion):** Submission relies on "plausibility" or "connection" rather than subsumption.

  **Waiver N-7: Hardship Exemption for Narrative Practitioners**
  *Eligibility:* Granted when universal laws are unavailable due to subject complexity. Applicants must submit Form CL-1 alongside Waiver to demonstrate failed compliance.
  *Restrictions:* Work certified under N-7 is classified as "Interpretive Reconstruction," not "Explanation."
  *Bureau Reasoning:* While narrative provides understanding (*Verstehen*), it lacks nomological necessity. The Bureau regulates explanation, not comprehension. Waiver holders must acknowledge their work demonstrates "how possibly" rather than "why necessarily." Frequent use of Waiver N-7 indicates a systemic deficiency in historical science, or alternatively, an aspirational quality to Bureau standards. Jurisdiction does not cover resolving this ambiguity.

  **MEMORANDUM**
  **TO:** All Examiners
  **FROM:** Director, BHES
  **RE:** Classification of Narrative Structures

  Recent inquiries ask why Narrative Explanation is not a recognized category. This confusion stems from conflating psychological satisfaction with logical validity. A story shows how events unfolded; it does not demonstrate they *had* to unfold that way. Until narrative connectivity is reduced to law-like regularity, it remains anecdotal.

  Some argue our standards are normative ideals rather than descriptive accounts of current practice. Whether historians *actually* use laws is irrelevant to whether they *should*. However, until submissions meet Section III certifications, we cannot certify them. We are not here to validate what historians do, but what counts as explanation. The high rejection rate is a matter of administrative record. We remain committed to the standard despite the scarcity of certifiable work. We acknowledge the burden this places on the profession. Yet, lowering standards would legitimize non-explanations. We await further philosophical clarification. Continue rigorous application of Code 104.

  **Note:**
  Hempel's covering-law model is largely rejected as a description of historical practice; consensus holds historians rarely use universal laws. Whether it remains a useful normative ideal is contested. The symmetry and irrelevance objections are widely accepted as fatal to the DN model's logical sufficiency, but the epistemic value of narrative versus nomological explanation remains an active debate in the field.
