answer: |-
  The legal pattern you describe is a fascinating artifact of tort law's collision with metaphysics. It is not merely a set of inconsistent rulings; it is a stable, albeit strained, equilibrium built on a specific, hybrid axiology. To answer your question, we must dissect the implicit theory of harm that allows the law to compensate the parents for the child's existence while simultaneously telling the child that his existence cannot be a compensable injury.

  ### 1. Reconstructing the Implicit Axiology: Asymmetric Relationalism

  The law does not commit to a single, monolithic theory of value. Instead, it operates on a principle I will call **Asymmetric Relationalism**. This axiology posits that the value of existence is not intrinsic but relational, depending entirely on the ontological status of the claimant.

  The system rests on three implicit premises:

  1.  **The Comparability Constraint:** A legal harm requires a comparative baseline. A plaintiff must be worse off than they *would have been* in the counterfactual scenario where the negligence did not occur.
  2.  **The Null Baseline:** For a child suing for "wrongful life," the counterfactual is non-existence. The law treats non-existence not as a state of zero welfare, but as a **null value** that cannot enter into arithmetic comparison with existence. Because $X - \text{null}$ is undefined, no harm can be calculated.
  3.  **The Presumptive Benefit:** In the absence of a calculable comparison, the law applies a default heuristic: *Existence is lexically superior to non-existence.* This is not necessarily a metaphysical claim that life is always good, but a policy presumption that life is a benefit *to the liver*.

  However, for the parents ("wrongful birth"), the axiology shifts:
  4.  **The Economic Baseline:** For existing persons, the counterfactual is a previous state of existence. Here, standard comparative harm applies. The child is treated as a **financial cost** (and sometimes an emotional burden) that offsets the **benefit** of parenthood.

  **Does this commit the law to the antinatalist asymmetry?**
  No. The antinatalist asymmetry (associated with Benatar) holds that *presence of pain is bad, presence of pleasure is not good* (regarding coming into existence).
  *   **The Law's View:** The law agrees that *failure to conceive a happy child is no loss* (no liability for "wrongful non-existence"). This matches the antinatalist view.
  *   **The Divergence:** However, the law *refuses* to acknowledge that *creating a suffering child is a harm to the child.* Antinatalism says the suffering child is harmed by being born. The law says the suffering child is benefited by being born (or at least not harmed), while the *parents* are harmed by the costs of that suffering.

  Thus, the law is not antinatalist; it is **Pronatalist regarding the child** (existence is a benefit) but **Economic Individualist regarding the parents** (existence is a cost).

  ### 2. The Apparent Inconsistency: Parents vs. Child

  Is there a single coherent account of harm that licenses both compensating the parents and refusing the child?

  **Yes, but only if harm is defined relationally rather than objectively.**
  The coherence relies on distinguishing between **Status Harm** and **Resource Harm**.

  *   **For the Child:** The claim is about *Status*. "I am worse off existing than not existing." The law rejects this because it refuses to validate the proposition that non-existence is a preferable state. To allow this claim is to legally declare that a specific life is "not worth living," which violates the Presumptive Benefit heuristic.
  *   **For the Parents:** The claim is about *Resources*. "We are poorer/less autonomous than we would have been." The law accepts this because it does not require declaring the child's life "not worth living," only that the child's life imposes a *financial burden* on the parents that the doctor should have helped them avoid.

  **The Coherent Account:**
  Harm is a setback to interests.
  *   Parents have an interest in financial integrity and reproductive autonomy. These are set back by the unplanned birth.
  *   The child has an interest in welfare. But the child's interest in welfare cannot be "set back" by being brought into existence, because there was no prior subject to hold the interest.
  *   *The Twist:* Even if we grant the child has an interest in welfare, the law rules that *any* life with positive welfare (however slight) satisfies that interest better than non-existence (which satisfies no interests). Therefore, the child is never harmed, even if the parents are burdened by the cost of maintaining that welfare.

  ### 3. Testing Rival Welfare Theories

  Which theories license this practice, and which does it rule out?

  **A. The Counterfactual Comparative Account (Standard Tort Theory)**
  *   *Verdict:* **Licenses the Parent claim; Rules out the Child claim.**
  *   *Reasoning:* This theory says $A$ harms $B$ if $B$ is worse off than $B$ would have been otherwise.
      *   Parents: Worse off financially than if the doctor succeeded. (Claim allowed).
      *   Child: Cannot be worse off than non-existence. (Claim denied).
  *   *Fit:* This is the explicit rationale courts use. It fits perfectly but relies on the "Null Baseline" assumption.

  **B. Objective-List Theory**
  *   *Verdict:* **Fits Comfortably.**
  *   *Reasoning:* If life, consciousness, and relationship are objective goods, then being born is always a net gain of goods, regardless of subjective suffering.
  *   *Fit:* This supports the denial of "wrongful life." However, it struggles to explain why parents get compensated for a "bundle of objective goods" (the child). The law solves this by treating the *cost* of the goods as separable from the *value* of the goods.

  **C. Hedonic Utilitarianism**
  *   *Verdict:* **Rules out the current practice.**
  *   *Reasoning:* If welfare is net pleasure minus pain, a child born with severe, unmitigated suffering has negative welfare. Existence is a harm.
  *   *Conflict:* A consistent hedonic regime would have to allow "wrongful life" suits for children in net pain. The current practice forbids this. Therefore, the law is *not* hedonic regarding the child. It *is* partially hedonic regarding parents (allowing recovery for the costs of impairment implies the impairment reduces parental utility).

  **D. Desire-Based Welfare**
  *   *Verdict:* **Rules out the current practice.**
  *   *Reasoning:* If a child grows up and desires they had never been born (a common sentiment in severe impairment cases), their desire is frustrated by existence.
  *   *Conflict:* The law explicitly overrides the child's actual desires with the metaphysical presumption that life is a benefit.

  ### 4. Requirements vs. Comfort: What is Essential?

  If we changed the underlying theory of welfare, what parts of the legal practice would survive?

  **What the Practice Strictly Requires:**
  1.  **The Ontological Barrier:** The distinction between *existing claimants* and *non-existing claimants*. As long as the law requires a plaintiff to exist to sue, the "Wrongful Life" claim faces a logical hurdle (the Non-Identity Problem).
  2.  **The Incomparability of Non-Existence:** The procedural rule that courts cannot adjudicate the value of "never having been." This is a judicial competence constraint, not necessarily a metaphysical truth.
  3.  **The Separability of Cost and Benefit:** The ability to treat the child as a benefit to the child but a cost to the parents.

  **What Merely Fits Comfortably:**
  1.  **The Presumptive Benefit:** The idea that life is *always* a benefit is a policy choice, not a logical requirement. The law could theoretically admit that some lives are net harms but refuse to compensate them due to calculational impossibility.
  2.  **The Healthy/Impaired Distinction:** The fact that courts deny recovery for healthy children but allow it for impaired ones suggests the "Life is a Benefit" rule is flexible. If life were an absolute, lexical good, the cost of a healthy child should also be non-recoverable (and it often is), but the *reasoning* varies. Some courts allow pregnancy costs even for healthy children. This implies the "benefit" offset is a policy lever, not an axiomatic truth.

  **What Would Have to Change:**
  If we adopted the view that **existence can itself be a harm** (e.g., a strict Hedonic view):
  *   **Wrongful Life suits would succeed.** Courts would have to calculate damages based on the difference between the child's current suffering and the zero-state of non-existence.
  *   **Damages would be nominal or impossible.** How do you pay someone for non-existence? The remedy would logically be death (to achieve the non-existence they claim they were owed), which the law cannot order. Thus, the practice would collapse or shift to "surrogate" damages (paid to a trust, used for care).
  *   **Parental Liability:** If existence can be a harm, parents could potentially be liable for negligent conception (not just doctors), radically altering reproductive autonomy.

  ### 5. Is the Practice Philosophically Underdetermined?

  **Yes.** The legal practice is underdetermined between two distinct philosophical justifications:

  1.  **Metaphysical Vitalism:** Existence is objectively better than non-existence. The child is *actually* benefited.
  2.  **Epistemic Humility / Judicial Restraint:** We *cannot know* if non-existence is better, so we default to preserving life to avoid the slippery slope of deeming lives "not worth living."

  The courts often conflate these. They speak as if they know life is a benefit (Vitalism), but the structure of the ruling relies on the inability to compare (Epistemic Humility).

  **Why this matters:**
  If the justification is **Vitalism**, the law is making a truth claim that could be proven false (e.g., by a child in unmitigated agony).
  If the justification is **Epistemic**, the law is making a procedural rule. This allows the law to remain stable even if society's view on welfare changes. It means the refusal of "wrongful life" claims isn't because the child *isn't* harmed, but because the court *cannot adjudicate* the harm.

  ### Conclusion

  The legal practice you describe presupposes a **Hybrid Comparative Axiology**. It treats harm as a setback to interests for existing beings (parents) but treats existence itself as a trump card that precludes harm claims for new beings (children).

  It is **not** committed to the antinatalist asymmetry. It accepts that creating happiness is not obligatory (no liability for non-conception), but it rejects the premise that creating suffering is a harm *to the sufferer*. It transmutes the harm of suffering into a financial injury *to the parents*.

  This creates a coherent, if morally uneasy, system: The child is a **legal person** who cannot claim they were harmed by being made a person, while the parents are **economic actors** who can claim they were harmed by being made parents. The system survives not because it solves the metaphysical problem of non-existence, but because it assigns the cost of that metaphysical mystery to the parents, while granting the child the irrebuttable presumption of a gift.

  A regime built on the opposite premise—that existence can be a harm—would collapse the distinction between "Wrongful Birth" and "Wrongful Life." It would force the law to calculate the value of zero, likely resulting in either unpayable judgments or the logical conclusion that the only remedy for wrongful existence is the cessation of existence. The current practice avoids this abyss not by solving the philosophy, but by refusing to look down.
