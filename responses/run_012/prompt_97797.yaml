prompt: |-
  Longtime lurker on LessWrong and in the forecasting/prediction-market corners of the internet here — I've read the Sequences, I know my way around calibration curves, Brier scores, log loss, proper scoring rules, reference classes, base rates, superforecaster lore, all of it. But I never actually sat down with the philosophy of probability literature, and I keep getting into arguements about it in comment sections and losing, so I want to fix that.

  Here's what I want. Take the three big families of interpretation of probability — frequentism, the subjective/Bayesian one, and the propensity one — and restate each as faithfully as you can in the vocabulary I actually think in. Concretely, the vocabulary of a forecaster: credences, calibration, proper scoring rules, reference classes and base rates, prediction-market prices, updating on evidence, exchangeability, "what would the market say," and so on. Do it one family at a time.

  Then the part I actually care about: the residue report. Which claims in each interpretation translate cleanly into forecaster-speak, which ones only translate if you fudge or distort them, and which ones have no expression in my vocabulary at all. And for whatever's left over, give me your view on whether it's my vocabulary that's missing something real or whether the philosophical claim was doing less work than it sounded like.

  The one that bugs me most is propensity. Whenever someone says "this coin has a 0.5 propensity to land heads," I want to ask what that even adds over "a calibrated forecaster would say 0.5" or "the long-run frequency is 0.5." Is there anything in the propensity view I can't already say, or is it just a label for whatever grounds my credence? Meanwhile I suspect the subjectivist stuff maps almost perfectly onto what I already do — a credence just is a betting price, coherence just is not getting Dutch-booked, seperate pieces of evidence just move you along — which makes me wonder whether that's because it's right or because I've been marinated in it. And if the residue turns out to be the idea that there's an objective chance out there that my credence is supposed to track, tell me what part of my forecasting vocab could even represent that, and whether the honest answer is that I've just been quietly assuming it this whole time.

  No reading lists or citations, please — I'm not gonna read them. Just the translation and the residue.
