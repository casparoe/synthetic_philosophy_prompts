  As a philosopher of social epistemology, I approach this by treating Dana's verdicts as data points for a classification problem. We are trying to reverse-engineer the necessary and sufficient conditions Dana uses for the labels "Epistemic Bubble," "Echo Chamber," and "Neither."

  The standard philosophical distinction (most famously articulated by C. Thi Nguyen) distinguishes these concepts based on **exposure** versus **trust**.
  *   **Epistemic Bubble:** Structural omission. You don't hear the other side because they aren't there or you aren't exposed to them.
  *   **Echo Chamber:** Motivational rejection. You hear the other side, but you have been taught to actively distrust them.

  However, Dana's specific descriptions introduce a second variable: **Epistemic Authority** (the presence of a leader or moderator whose word settles disputes). Let's brainstorm the candidate rules that fit Dana's four prior verdicts.

  ### Phase 1: Brainstorming Candidate Rules

