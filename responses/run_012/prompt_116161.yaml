prompt: |-
  You're a philosopher who works on commodification and the moral limits of markets, so I want your considered take, not a survey. I'm drafting a paper and before I read anything else I want the spec sheet: what does an adequate theory of "things that shouldn't be bought and sold" have to deliver? Give me the desiderata, each with the case or consideration that motivates it.

  Cases it has to get right: kidney sales (I lean welfarist and Im genuinely torn), hurricane price gouging, vote selling, and one of my own that the stock examples dont cover: a firm that buys a perpetual exclusive license to your face, voice and gait for AI training, paid monthly, and the contract survives your death, so your heirs cant revoke it. Whatever it says has to square with the fact that we already sell labor, dangerous labor, plasma, sex and surrogacy in various places, and it cant just recode my gut reactions as premises.

  The distinctions it mustn't collapse: coercion vs. mere voluntariness under bad options; wronging a person vs. degrading a good; the good being priced vs. the person being priced; repugnance as evidence for something vs. repugnance as the thing to be explained. And it needs to say what's doing the normative work -- harm, coercion, corruption of a good's meaning, or disgust -- and whether that's a property of the good, the transaction, or the parties.

  Mark which requirements are non-negotiable and which are one camp's commitments. Tell me which single requirement does the most excluding work, and if a subset is jointly unsatisfiable -- I suspect my AI-likeness case and the requirement not to second-guess people's existing market choices pull against each other -- say which one to drop and why. Brainstorm the candidates first, then commit to a position; don't hand me a menu. A table's fine.
