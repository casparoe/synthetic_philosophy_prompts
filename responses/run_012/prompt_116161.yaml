answer: |-
  Here is the spec sheet for a theory of market limits. I am adopting a **Structural Corruption** framework. Pure welfarism fails the vote/gouging cases; pure deontology fails the labor/plasma cases. The normative work must be done by how transactions alter the *social meaning* of goods and the *status* of persons within a background of inequality.

  ### The Spec Sheet: Desiderata for a Theory of Market Limits

  | # | Requirement | Motivation / Case | Status | Normative Source & Locus |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Agency-Condition** | **Kidney Sales.** Must explain why selling a kidney differs from selling labor, without banning dangerous labor. | **Non-Negotiable** | **Harm + Status.** Locus: *Parties.* The transaction must not permanently diminish the seller's capacity for future agency or reduce them to a mere resource repository. |
  | **2** | **The Civic-Integrity Condition** | **Vote Selling.** Must explain why selling a vote is distinct from selling a private preference (like a consumer choice). | **Non-Negotiable** | **Corruption of Meaning.** Locus: *Good.* Some goods are constitutive of the political community; pricing them changes the nature of the community, not just the allocation. |
  | **3** | **The Contextual-Fairness Condition** | **Price Gouging.** Must explain why a voluntary exchange is wrongful during a crisis but permissible in normal times. | **Non-Negotiable** | **Relational Duty.** Locus: *Transaction.* The background context (emergency) creates a duty of solidarity that pricing violates, independent of coercion. |
  | **4** | **The Temporal/Revocability Limit** | **AI Likeness License.** Must explain why a perpetual, post-mortem contract is distinct from standard IP or labor contracts. | **Non-Negotiable** | **Inalienability of Self.** Locus: *Person.* You cannot alienate the conditions of your identity beyond the point where you can monitor or revoke usage. Death ends contractual capacity, not moral status. |
  | **5** | **The Differentiation Constraint** | **Existing Markets (Plasma, Sex, Labor).** Must distinguish prohibited markets from existing, morally messy but permitted ones. | **Camp Commitment** | **Pragmatic Consistency.** Locus: *System.* The theory must not demand a revolution that bans all current commodification, or it loses critical traction. |
  | **6** | **The Anti-Paternalism Presumption** | **General.** Must not ban transactions simply because they are risky or "bad deals." | **Camp Commitment** | **Autonomy.** Locus: *Parties.* Competent adults are generally the best judges of their welfare; bans require more than "you might regret this." |

  ### The Normative Architecture

  **What is doing the work?**
  It is not **Disgust** (repugnance is data, not a justification). It is not pure **Harm** (welfarism allows vote selling if efficient). It is not pure **Coercion** (gouging is voluntary).

  The work is done by **Corruption of Social Meaning under Conditions of Inequality.**
  *   **Property of the Good:** Some goods (votes, bodily integrity) carry a meaning incompatible with price.
  *   **Property of the Transaction:** Some contexts (hurricanes) impose non-market norms (sharing) that pricing violates.
  *   **Property of the Parties:** Some transactions (kidneys, AI likeness) alter the seller's status from *citizen/agent* to *resource/object*.

  ### The Single Most Excluding Requirement
  **Requirement #1 (The Agency-Condition).**
  This does the most excluding work because it forces the theory to draw a line between *using* the body (labor, plasma, surrogacy) and *consuming* the body (kidneys, AI likeness).
  *   **Why it excludes:** It rules out pure Libertarianism (which sees no difference between labor and kidneys) and pure Utilitarianism (which sees only net welfare). It demands a metaphysical account of what parts of the self are constitutive of agency versus what parts are instrumental. If you cannot articulate why a kidney is more "constitutive" than a pint of plasma or 8 hours of back-breaking labor, your theory fails here.

  ### The Unsatisfiable Subset & Resolution

  **The Conflict:**
  You identified a tension between **Requirement #4 (AI Likeness/Inalienability)** and **Requirement #5 (Differentiation/Existing Markets)** combined with **Requirement #6 (Anti-Paternalism).**
  *   *The Tension:* If we allow plasma donation (bodily material) and surrogacy (reproductive labor) and post-mortem IP rights (copyright survives death), why ban the AI Likeness License? It looks like just another property right. To ban the AI license while allowing plasma/surrogacy requires second-guessing the "voluntary" nature of the AI contract more aggressively than we do for dangerous labor. If we respect existing market choices (Req 5 & 6), the AI contract should stand. If we ban the AI contract (Req 4), we are admitting that some "voluntary" choices are structurally void.

  **The Verdict:**
  **Drop Requirement #5 (The Differentiation Constraint as "Validation of Status Quo").**

  **Why:**
  A critical theory of market limits *must* be willing to argue that existing markets (plasma, surrogacy, dangerous labor) are partially unjust, even if currently legal. You cannot build a robust normative boundary if you are constrained to validate all current exceptions.
  *   **The Fix:** Refine Requirement #5 to be **"Consistency with *Permissible* Alienation,"** not "Existing Markets."
  *   **The Distinction:** The AI Likeness case differs from plasma/labor because it is **Irrevocable Identity Alienation.**
      *   *Labor/Plasma:* You sell a *stream* of services or renewable material. You remain present to enforce boundaries.
      *   *AI Likeness:* You sell the *source code of your social identity* perpetually, including after you cease to exist as a moral agent. Your heirs cannot revoke it. This creates a "moral zombie" status where your image acts in the world without a principal to hold responsible or suffer dignity harms.
      *   *Resolution:* The theory should argue that **Agency requires the possibility of Revocation.** We tolerate the risks of plasma markets, but we should not tolerate markets that alienate the *conditions of accountability* itself. The AI contract turns the person into a pure object (trademark) with no remaining subject to protect the meaning of that trademark.

  **Summary Position:**
  An adequate theory must argue that **markets are permissible only where the seller retains the capacity to remain a moral agent within the social context the market creates.**
  *   **Kidneys:** Fails (loss of bodily integrity/agency).
  *   **Votes:** Fails (corruption of civic agency).
  *   **Gouging:** Fails (violates context of civic solidarity).
  *   **AI Likeness:** Fails (permanent alienation of identity without recourse).
  *   **Labor/Plasma:** Passes (barely) *only because* they are temporary and the agent survives the transaction to contest abuse. The theory should likely recommend *tighter* regulation on these, not that they are morally pristine.

  Do not let the existence of the plasma market dictate the theory. Let the theory judge the plasma market.
