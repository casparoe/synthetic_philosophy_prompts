  # Formal Epistemology: Final Take-Home Exam

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20
  **Instructions:** Answer the following question. You may use a calculator. Clarity and precision of argument are paramount.

  ### Question

  Jeffrey Conditionalization (JC) updates a prior $P$ to a posterior $P_{new}$ given a partition $\mathbf{E} = \{E_i\}$ and new probabilities $q_i$ such that $P_{new}(E_i) = q_i$, via the rule:
  $$P_{new}(H) = \sum_i P(H|E_i)q_i$$

  1.  **State** the formula for Jeffrey Conditionalization.
  2.  **Construct** a concrete numerical example using a four-cell probability space (two binary propositions). Show via arithmetic that two successive JC updates with respect to two *different* partitions can yield different posteriors depending on the order of application. Contrast this briefly with Strict Conditionalization.
  3.  **Evaluate:** Does this order-dependence demonstrate that Jeffrey's rule is irrational or "wrong" for uncertain evidence? Present the strongest objection based on commutativity and the strongest defense based on the nature of learning. Take a position.
      *   *Note:* To receive top marks, you must explicitly check the specific probabilistic condition under which JC updates *do* commute and demonstrate why your example violates it.

  ---

  # Model Answer

  **Jeffrey Conditionalization (JC)** is defined as $P_{new}(H) = \sum P_{old}(H|E_i)P_{new}(E_i)$. Unlike Strict Conditionalization, which sets the probability of evidence to 1, JC allows evidence to shift probability mass across a partition without certainty.

  **Numerical Demonstration**
  Consider a space $\Omega = \{c_1, c_2, c_3, c_4\}$ with prior $P = (0.45, 0.05, 0.05, 0.45)$.
  Define Partition $\mathbf{E} = \{ \{c_1, c_2\}, \{c_3, c_4\} \}$ and Partition $\mathbf{F} = \{ \{c_1, c_3\}, \{c_2, c_4\} \}$.
  Note that initially $P(\mathbf{E}_1) = 0.5$ and $P(\mathbf{F}_1) = 0.5$.

  *Update 1:* Apply JC on $\mathbf{E}$ setting $P(\mathbf{E}_1) = 0.9$.
  The Bayes Factor (BF) for $\mathbf{E}_1$ is $0.9/0.5 = 1.8$; for $\mathbf{E}_2$ it is $0.2$.
  $P_{\mathbf{E}}(c_1) = 0.45 \times 1.8 = 0.81$. $P_{\mathbf{E}}(c_3) = 0.05 \times 0.2 = 0.01$.
  *Update 2:* Apply JC on $\mathbf{F}$ setting $P(\mathbf{F}_1) = 0.5$ (returning marginal to prior).
  Current $P_{\mathbf{E}}(\mathbf{F}_1) = P_{\mathbf{E}}(c_1) + P_{\mathbf{E}}(c_3) = 0.82$.
  BF for $\mathbf{F}_1$ is $0.5/0.82 \approx 0.61$.
  $P_{\mathbf{E}\mathbf{F}}(c_1) = 0.81 \times 0.61 \approx \mathbf{0.49}$.

  *Reverse Order:* Apply JC on $\mathbf{F}$ setting $P(\mathbf{F}_1) = 0.5$.
  Since prior $P(\mathbf{F}_1) = 0.5$, the BF is 1. The distribution does not change ($P_{\mathbf{F}} = P$).
  Next, apply JC on $\mathbf{E}$ setting $P(\mathbf{E}_1) = 0.9$.
  $P_{\mathbf{F}\mathbf{E}}(c_1) = 0.45 \times 1.8 = \mathbf{0.81}$.
  $0.49 \neq 0.81$. Order matters. Conversely, Strict Conditionalization on certain events $E$ and $F$ commutes because $P(H|E \cap F)$ is invariant to the order of conditioning.

  **Commutativity Condition**
  JC updates commute if and only if the **Bayes Factors** induced by the second update are constant across the cells of the first partition (Wagner 2002). In our example, the second update targeted a fixed *probability* ($0.5$), not a fixed *likelihood ratio*. Because the first update altered the marginal probability of the second partition (from $0.5$ to $0.82$), the required Bayes Factor for the second update changed depending on the order. Had we specified the updates by invariant Bayes Factors rather than target probabilities, they would have commuted.

  **Philosophical Evaluation**
  *Objection:* Rational belief revision should be path-independent. If evidence is static, the final credence should not depend on the arbitrary temporal sequence of processing. Order-dependence suggests JC violates the principle of commutativity required for coherence.

  *Defense:* Evidence is not static; learning is temporal. JC models the *kinematics* of belief, not just static constraint satisfaction. The "evidence" in JC is the experience causing the shift. If I learn $E$-news then $F$-news, the $F$-news is evaluated against a background where $E$ is already absorbed. The order-dependence reflects the fact that the *impact* of uncertain evidence (the Bayes Factor) depends on the background credence against which it is weighed.

  *Position:* The order-dependence is not a defect. Demanding commutativity for uncertain evidence mistakenly treats probability shifts as logical constraints rather than psychological inputs. Since the "force" of uncertain evidence is context-sensitive (dependent on current priors), non-commutativity is a feature of accurately modeling sequential learning.

  ---

  # Marking Scheme (20 Marks Total)

  | Component | Marks | Criteria for A (17-20) vs. B (13-16) | Common Pitfalls (How to lose marks) |
  | :--- | :--- | :--- | :--- |
  | **1. Definition** | 3 | **A:** Precise formula, clearly identifies partition and new probabilities. <br> **B:** Formula present but variables undefined or slightly imprecise. | Writing the formula for Strict Conditioning ($P(H|E)$) instead of JC. Failing to define the partition $\mathbf{E}$. |
  | **2. Numerical Example (JC)** | 5 | **A:** 4-cell table, clear arithmetic, demonstrates $P_{12} \neq P_{21}$. <br> **B:** Example provided but arithmetic is vague, or the numbers accidentally commute (symmetry error). | Using a uniform prior with symmetric targets (which accidentally commute). Failing to show the final divergence in $P(c_1)$. |
  | **3. Strict Conditioning Contrast** | 2 | **A:** Explicitly notes $P(H|E \cap F) = P(H|F \cap E)$. <br> **B:** Merely asserts "Strict conditioning commutes" without justification. | Ignoring this part of the prompt. Confusing Strict Conditioning with JC. |
  | **4. Commutativity Condition Check** | 5 | **A:** **Crucial:** Identifies that commutativity requires invariant *Bayes Factors*, not invariant target probabilities. Explains why the example violated this. <br> **B:** Asserts partitions must be "independent" without defining the probabilistic mechanism (Bayes Factors). | **Major Grade Separator:** Claiming JC never commutes. Claiming it commutes if partitions are logically independent (ignoring probabilistic dependence). Failing to mention Bayes Factors. |
  | **5. Philosophical Argument** | 5 | **A:** Nuanced defense (Kinematics vs. Constraints). Takes a clear position. <br> **B:** Generic discussion of "uncertainty." Arguments are one-sided or lack a clear conclusion. | Writing "Uncertain evidence generalizes certain evidence" (forbidden). Arguing JC is wrong *because* it doesn't commute without addressing the temporal defense. |

  **General Penalties:**
  *   **Word Count:** Significant deviation (>700 or <500 words) may incur a 1-mark penalty.
  *   **Clarity:** Disorganized arithmetic that obscures the non-commutativity will be penalized in Section 2.
