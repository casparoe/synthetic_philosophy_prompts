  The question I want to build is on something that happened to me last month. I was combining two noisy measurements for my thesis chapter and the posterior came out different depending on which measurement I entered first. I assumed I'd messed up the code. I hadn't — it's just what Jeffrey's rule does when the two updates are with respect to different partitions. Strict conditioning doesn't do that: conditioning on E and then F lands you in the same place as F and then E. So the question I want is:

