answer: |-
  # Seminar Activity: The Hitchhiker's Market
  **Course:** 300-Level Practical Reason  
  **Time:** 80 Minutes (60 min Activity, 20 min Debrief)  
  **Students:** 16 (8 Travelers, 8 Drivers)  
  **Goal:** Experiential demonstration of the rationality of binding dispositions (Parfit's Hitchhiker/Prisoner's Dilemma with commitment).

  ## I. Materials & Setup
  *   **Room:** Movable chairs. Set up two distinct zones: "The Roadside" (Travelers) and "The Garage" (Drivers). A central "Bank" table for the facilitator.
  *   **Ledgers:** 16 sheets (one per student) to track points.
  *   **Currency:** Paper points (no value, just tracking).
  *   **Traveler Kit (x8):**
      *   1 "Destination Card" (worth +40 points upon arrival).
      *   1 "Veto Chip" (Red poker chip). *Holding this chip grants the mechanical right to renege on payment after arrival.*
      *   1 "Trust Badge" (Blue poker chip). *Received if Veto Chip is surrendered.*
  *   **Driver Kit (x8):**
      *   1 "Fuel Log" (tracks -10 points per ride).
      *   1 "Fare Envelope" (to receive payment).
  *   **Whiteboard:** To display aggregate market stats (Rides Given, Rides Paid, Average Scores).

  ## II. Payoff Structure (The Bind)
  *   **Traveler Benefit:** +40 points (awarded immediately upon reaching the "Destination").
  *   **Driver Cost:** -10 points (deducted immediately upon offering a ride).
  *   **Agreed Fare:** 20 points (promised by Traveler, payable *only* after arrival).
  *   **Bond:** 25 points (deposited with Facilitator; forfeited if Fare is not paid).
  *   **Rational Calculus (Standard):**
      *   *At Arrival:* Traveler has +40. Paying 20 leaves +20. Reneging leaves +40. **Rational Choice: Renege.**
      *   *At Start:* Driver expects Renege. Net = -10 (Cost) + 0 (Fare) = -10. **Rational Choice: Refuse Ride.**
      *   *Result:* **No Trade.** (0 points for everyone).

  ## III. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & Rules
  *   **Divide:** Assign 8 Travelers, 8 Drivers (random draw).
  *   **Distribute:** Hand out kits and ledgers.
  *   **Rule 1 (The Sequence):** Driver chooses Traveler → Traveler arrives (gets +40) → Traveler *chooses* to Pay (20) or Renege → Round ends.
  *   **Rule 2 (The Veto):** Travelers holding the **Red Veto Chip** are mechanically permitted to renege. If they pay, they keep the chip. If they renege, they keep the chip and the 40 points.
  *   **Rule 3 (Enforcement):** No side payments before arrival. Payment is physically handing over point-chits *after* the Facilitator confirms arrival.
  *   **Instruction:** "Maximize your individual point total. There are no grades for kindness, only for points."

  ### 00:10 – 00:25: Phase 1 – The Collapse (3 Rounds)
  *   **Condition:** All Travelers hold the **Red Veto Chip**. No Bonds allowed. Dispositions are private.
  *   **Action:** Drivers solicit riders. Travelers accept. Arrival occurs.
  *   **Predicted Outcome:**
      *   Round 1: Optimistic Drivers give rides. Travelers renege (keep 40, pay 0). Drivers lose 10.
      *   Round 2: Drivers refuse rides. Market freezes.
      *   Round 3: Total collapse. 0 trades.
  *   **Facilitator Note:** Do not intervene. Let the silence of the "Garage" grow awkward. Record the failure on the whiteboard.

  ### 00:25 – 00:40: Phase 2 – Commitment Devices (3 Rounds)
  *   **Condition:** Travelers may now visit the "Bank" (Facilitator) before matching.
  *   **Option A (Bond):** Deposit 25 points. If you renege, you lose the bond. If you pay, you get the bond back.
  *   **Option B (Disposition):** Surrender the **Red Veto Chip** to the Facilitator. Receive the **Blue Trust Badge**.
      *   *Mechanic:* Without the Red Chip, you are *rule-bound* to pay. You physically cannot renege without breaking game rules (monitored by Facilitator).
      *   *Cost:* None, but you lose flexibility.
  *   **Action:** Run 3 rounds. Allow private choice of Bond or Disposition. Drivers can ask, "Are you bonded or trusted?" (Travelers can lie, but Bonds are verifiable by Facilitator).
  *   **Predicted Outcome:** Trade resumes. Travelers using Bonds/Dispositions pay. Travelers keeping Red Veto renege (if they find a gullible driver). Drivers begin to prefer Bonded/Trusted travelers.

  ### 00:40 – 00:50: Phase 3 – Transparency & Sorting (2 Rounds)
  *   **Condition:** **Common Knowledge.**
  *   **Action:** Before matching, all Travelers stand and display their status publicly: **Red Veto** (Unconstrained) or **Blue Badge/Bond** (Committed).
  *   **Rule:** Drivers are *rationally permitted* to discriminate based on this public info.
  *   **Predicted Outcome:**
      *   Drivers flock to Blue/Bonded Travelers.
      *   Red Veto Travelers are stranded. No one offers them a ride.
      *   Blue/Bonded Travelers get +20 net (40 - 20 fare).
      *   Red Veto Travelers get 0 (no ride).
  *   **Crucial Moment:** The "Unconstrained" Traveler (who acted 'rationally' at the moment of payment in Phase 1) now earns nothing because their disposition was transparent.

  ### 00:50 – 01:00: Tally & Transition
  *   Collect ledgers. Calculate average scores by role and strategy.
  *   Write final scores on the board:
      *   *Phase 1 Avg:* ~0
      *   *Phase 2 Avg:* ~15 (mixed)
      *   *Phase 3 Avg (Committed):* ~20
      *   *Phase 3 Avg (Unconstrained):* 0
  *   Ask students to clear desks. Move chairs into a seminar circle.

  ### 01:00 – 01:20: Debrief (The Philosophical Map)
  *   **0-5 min: The Collapse.** Ask Drivers in Phase 1: "Why did you stop driving?" (Answer: Anticipation of reneging). Ask Travelers: "Why did you renege?" (Answer: It maximized points *at that moment*).
      *   *Map:* This is Standard Instrumental Rationality. It is self-effacing. It leads to a suboptimal equilibrium.
  *   **5-10 min: The Bond.** Ask those who used Bonds: "Did you trust yourself?" (Answer: No, I trusted the penalty).
      *   *Map:* External Commitment (Ulysses Pact). Effective, but requires a third party/enforcement mechanism not always available in life.
  *   **10-15 min: The Disposition.** Ask those who surrendered the Veto Chip: "Why did you give up your right to renege?" (Answer: To get the ride).
      *   *Map:* This is the Hitchhiker's solution. You become the *kind of person* who pays. It looks irrational at the moment of payment (you lose 20 points), but it is rational *ex-ante* (you get the ride).
  *   **15-20 min: Transparency.** Ask the stranded Red Veto holders: "You kept your options open. Why were you punished?"
      *   *Map:* Rationality requires that your disposition be *transparent* to others. If you are known to be a maximizing reneger, you are excluded. The theory that tells you to "keep your options open" ensures you never get the opportunity to use them.
      *   *Conclusion:* A theory of rationality that tells you to renege is self-defeating. A theory that tells you to bind yourself is self-supporting.

  ## IV. Troubleshooting: What Will Go Wrong
  **1. The "Upfront Payment" Glitch**
  *   **Problem:** A Traveler tries to hand over the 20 points *before* the ride to prove honesty.
  *   **Fix:** Stop the transaction. Remind them: "The Hitchhiker cannot pay upfront; he has no cash until he reaches the ATM." Enforce the sequence rule strictly. The predicament *requires* the payment to be posterior to the benefit.

  **2. The "Altruistic Driver"**
  *   **Problem:** A Driver gives a ride to a Red Veto Traveler out of kindness, muddying the incentive structure.
  *   **Fix:** Pre-empt this in instructions: "You are not playing for 'goodness,' you are playing for points. A free ride is a -10 point error." If it happens, highlight it in debrief as an anomaly that doesn't solve the structural problem (what if the driver is purely rational?).

  **3. The "Bond Overuse"**
  *   **Problem:** Everyone bonds, making the Disposition (Veto Surrender) irrelevant.
  *   **Fix:** Limit the number of Bonds available (e.g., only 3 Bond slots). This forces the majority to choose the Disposition path, highlighting the "character" solution over the "contract" solution.

  **4. Anxiety Over Points**
  *   **Problem:** Students treat points as grades or feel stressed about "losing."
  *   **Fix:** Explicitly state: "Your grade is based on your participation in the debrief, not your point total. The points are purely for the logic of the game."

  ## V. Limitations: What the Game Cannot Do
  *Be candid with the students about where the simulation stops.*

  **1. The "Switch" Problem**
  *   **Limitation:** In the game, you surrendered a Veto Chip to become "Honest." In reality, you cannot simply decide to change your character at will. You cannot just choose to be the kind of person who keeps promises if you are not already.
  *   **Facilitator Script:** "The game makes disposition look like a menu choice. In life, cultivating a disposition takes years of habituation. The game shows the *value* of the disposition, not the *cost of acquiring it*."

  **2. The Enforcement Illusion**
  *   **Limitation:** When you surrendered the Veto Chip, I (the Facilitator) enforced it. In the real Hitchhiker case, there is no facilitator. The constraint must be internal.
  *   **Facilitator Script:** "I acted as your conscience. But in the real world, your conscience is the only enforcement. If you can trick your own conscience, the disposition fails. The game abstracts away the difficulty of internal self-binding."

  **3. The One-Off vs. Repeat**
  *   **Limitation:** We played repeated rounds. Reputation mattered. The classic Hitchhiker problem is often a one-off encounter in the desert.
  *   **Facilitator Script:** "Here, you were stranded because of reputation in Phase 3. But what if you never see these drivers again? The logic still holds: you must be the sort of person who pays even when no one is watching, because *you* know what you are, and that knowledge shapes your future choices. But the game relies on social scrutiny; the philosophy relies on self-scrutiny."

  **4. Value Beyond Payoff**
  *   **Limitation:** The game justifies honesty *only* because it yields more points. It does not show that honesty is intrinsically valuable.
  *   **Facilitator Script:** "We proved honesty pays. We did not prove honesty is *good*. A moral theory might say you should pay even if it costs you the ride. This game is about Prudence, not Morality. Do not confuse the rationality of self-interest with the demands of ethics."

  ## VI. Facilitator's Closing Statement (Script)
  "The game ended with the Unconstrained Travelers stranded. They followed the standard advice of practical reason: 'At every moment, choose the action that maximizes your utility.' At the moment of arrival, reneging maximized utility. But by following that rule, they ensured they never arrived.

  The Travelers who surrendered their Veto Chip acted against their immediate interest at the moment of payment. They lost 20 points they could have kept. But by making themselves *unable* to act that way beforehand, they secured the ride.

  This is the paradox of practical reason: To get what you want, you must sometimes bind yourself so that you cannot want what you would have chosen in the moment. The theory that tells you to remain free to renege is the theory that leaves you by the roadside."
