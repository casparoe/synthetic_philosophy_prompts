answer: |-
  This is a sharp thesis, but you are walking into a minefield. Your supervisor's allergy to "dilemma" framings is the biggest tactical risk. Strawson scholars generally argue Strawson *dissolves* the dilemma via naturalism, not that he falls into it. If you frame it as "Strawson didn't notice," they will hear "I didn't read the footnotes."

  Here is the battle plan, ordered by who will speak first and hardest.

  ### 1. The Supervisor (The Frame Police)
  **When:** Immediately after you finish the setup.
  **Phrasing:** "You're presenting this as a dilemma Strawson overlooks, but in Section IV, Strawson explicitly rejects the demand for an 'external' rational justification. He isn't choosing between constitutive and epistemic; he's arguing the demand for a view from nowhere is unintelligible. Aren't you just restating the skeptical challenge he claims to dissolve?"
  **Force:** **High.** This attacks your interpretive charity. If Strawson rejects the dichotomy, your thesis collapses into "Strawson is wrong," not "Strawson is inconsistent."
  **Concede:** That Strawson *intends* to dissolve the dichotomy via naturalism.
  **Hold:** That the dissolution fails because he still needs the attitudes to do normative work (anti-skepticism) without normative grounding.
  **2-Minute Reply:**
  "I grant that Strawson *intends* a dissolution, not a choice. He wants to say our participation in the reactive attitudes is a natural fact, like breathing. But my argument is that this naturalism only works if we accept the *constitutive* horn: responsibility just *is* the game we play. The moment he claims this game defeats the skeptic, he smuggles in the *epistemic* horn—he implies the skeptic is making a *mistake*, not just standing outside the game.
  If the attitudes are just natural facts, the Hard Determinist is also a natural fact. To say the Determinist is *wrong* requires a standard outside the attitudes. Strawson wants the anti-skeptical punch of realism without the metaphysical cost. I'm arguing that 'dissolution' is just a label for hiding this tension. He can have the naturalism or the normativity, but not both."

  ### 2. The Compatibilists (The Quality of Will Crowd)
  **When:** Once the supervisor signals you're safe to continue.
  **Phrasing:** "You're assuming the 'epistemic' reading hands everything to the skeptic. It doesn't. The reactive attitudes track 'quality of will.' Determinism doesn't erase ill will. So the attitudes track a real fact about the agent that determinism can't touch. Why is that not a stable middle ground?"
  **Force:** **Medium-High.** This is the standard Strawsonian defense. They will try to convince you that Horn 2 is stable.
  **Concede:** That determinism doesn't erase quality of will.
  **Hold:** That "quality of will" is only morally significant *because* we care about the attitudes (Horn 1).
  **2-Minute Reply:**
  "Quality of will is only a *moral* fact if we already accept the framework that makes will matter. If I ask, 'Why does ill will make you responsible?', and you answer, 'Because it warrants resentment,' you've moved to the constitutive view. If you answer, 'Because they could have done otherwise,' you've left Strawson.
  My point is that 'quality of will' does no independent work. It's a placeholder for 'whatever it is that triggers resentment.' If the Hard Determinist asks, 'Why should I care about quality of will in a determined universe?', Strawson's answer is essentially, 'Because we do.' That's the constitutive horn. You can't use quality of will to bridge the gap unless you've already assumed the reactive attitudes are the authority on what matters."

  ### 3. The Hard Determinist (The Wolf in Sheep's Clothing)
  **When:** Mid-Q&A, likely with a smile.
  **Phrasing:** "I think you've actually proven my point. If you're right that there's 'no neutral fact to appeal to,' then Strawson is admitting responsibility is just a useful fiction we can't shake. If the Determinist is just 'playing a different game,' why isn't that game the rational one? You've saved Strawson from inconsistency by making him an error theorist."
  **Force:** **Medium.** They will try to co-opt your argument.
  **Concede:** That Strawson offers no *external* justification.
  **Hold:** That Strawson claims the objective attitude is *practically* impossible to sustain universally, not just a "different game."
  **2-Minute Reply:**
  "I agree there's no neutral fact. But Strawson isn't an error theorist; he thinks the skeptic's position is psychologically unintelligible, not just alternative. His claim isn't 'We prefer this game,' it's 'You cannot actually play the other game.'
  However, I'm pushing on whether that psychological claim is true. If the Hard Determinist can sustain the objective attitude (and some do, clinically or philosophically), then Strawson's anti-skepticism fails. I'm not saying the Determinist is right; I'm saying Strawson's argument against them relies on an empirical claim about human psychology that he doesn't support. He asserts we *can't* opt out, but he doesn't prove we *shouldn't*."

  ### 4. The Empiricist (The Naturalizer)
  **When:** Toward the end, trying to ground the discussion.
  **Phrasing:** "You say the general reactive attitudes look like 'social pressure.' But from a naturalistic perspective, indignation is an evolutionary mechanism for enforcing norms. Doesn't that ground the 'fact' you say is missing? It's a fact about social cohesion."
  **Force:** **Low.** This changes the subject from moral responsibility to evolutionary psychology.
  **Concede:** That there is an evolutionary explanation.
  **Hold:** That evolutionary function does not equal normative justification.
  **2-Minute Reply:**
  "An evolutionary explanation tells us why we *have* the attitudes, not why they are *fitting*. If indignation is just social pressure, then a tyrant enforcing bad norms triggers the same mechanism as a just community.
  Strawson needs the attitudes to be *responsive* to reasons, not just causes. If general reactive attitudes are just pressure, then the 'participant stance' is just conformity. That undermines the moral force of responsibility. I'm happy to naturalize the *origin* of the attitudes, but that doesn't solve the normative dilemma of whether they track responsibility or just create it."

  ---

  ### The Excuses vs. Exemptions Fix
  You mentioned you don't have a clean answer for this. Here it is:
  *   **Excuses:** Accept the framework, deny the specific application (e.g., "I didn't mean to").
  *   **Exemptions:** Reject the agent's participation in the framework (e.g., "He is a child/psychotic").
  *   **Your Move:** The Hard Determinist wants a **Universal Exemption**. Strawson argues this is impossible because it requires total withdrawal from human relationships.
  *   **The Trap:** If you argue Horn 1 (Constitutive), Exemptions are just "rules of the game." If you argue Horn 2 (Epistemic), Exemptions are "facts about capacity."
  *   **Solution:** Argue that Strawson uses Exemptions to *mask* the dilemma. He treats determinism as if it *could* be an exemption condition, then says "but it's not, because we can't view everyone that way." You need to press: **Is determinism a candidate for exemption or not?** If yes, he needs a fact about capacity (Horn 2). If no, he's just saying "we don't feel like it" (Horn 1).

  ---

  ### The One Question You're Secretly Hoping Nobody Asks
  **"If the reactive attitudes constitute responsibility, on what grounds can we ever criticize the attitudes themselves?"**

  **Why this kills you:**
  If responsibility is *constituted* by our actual feelings of resentment/guilt (Horn 1), then widespread resentment *makes* someone responsible. This makes moral progress impossible. If a society stops feeling resentment toward slaves, are slaves no longer responsible? If a society feels resentment toward women voting, are they irresponsible?
  Strawson needs the attitudes to be *correctible* (which implies Horn 2: tracking a fact), but he also needs them to be *constitutive* (to block the skeptic).
  If they ask this, do not panic.
  **Reply:** "Strawson allows for 'modification' of attitudes through reflection. But my point is exactly that: the moment he allows reflection to correct the attitudes, he admits they track a standard *outside* themselves. That concedes Horn 2. If he denies they can be corrected, he makes morality hostage to current sentiment. He needs both, and that's the dilemma."

  ### Final Strategic Advice
  1.  **Drop the word "Dilemma" in the intro.** Call it a "Tension" or an "Ambiguity." Tell your supervisor, "I'm exploring a tension in the text," not "Here is a dilemma he missed." It's the same argument, but it won't trigger their allergy.
  2.  **Own the Horn 1.** Lean into the idea that Strawson is a constitutivist. It's the more defensible reading against the skeptic. Admit it costs him the "Determinist is wrong" claim, but argue that's a price worth paying for coherence.
  3.  **Don't fight the Compatibilists on Quality of Will.** Agree that QoW is central. Just argue QoW is *defined* by the attitudes, not the other way around.

  Good luck. Two weeks is enough time to sharpen the replies. Memorize the "Normative Critique" reply; that's where the seminar will live or die.
