  I run a small machine shop so my whole working life is tolerances: a part is good or it's scrap, the go/no-go gage either drops in or it doesn't, and when something lands right on the line we stand there arguing about gage error and re-measure it. I've been reading up on the sorites paradox and the two main answers to it, epistemicism and supervaluationism, and I want you to restate both of them in the language I actually think in: spec limits, tolerance bands, true value vs. measured value, measurement uncertainty, gage R&R, calibration, pass/fail. Do them one at a time and be as faithful as you can. Then the part I care about: what translates cleanly, what you had to fudge to make it fit, and what in each view has no counterpart at all in how I think about a part that's sitting right on the line. And tell me straight whether the leftovers mean my vocabulary is missing something or the philosophers' fight is shallower than it looks, becuase in my world a part inside spec is inside spec whether or not I can measure it, and I can't tell if that's the epistemicist answer or just me being a stubborn tradesman.
