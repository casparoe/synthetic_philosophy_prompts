  TO: Editorial Board, Journal of Historical Theology
  FROM: Referee #2
  RE: Manuscript #4492 ("The Authentic Jesus")
  DATE: 14 October 2023
  RECOMMENDATION: Major Revisions (Reductive)

  Upon receipt of Manuscript #4492, I conducted a thorough evaluation. The author employs standard criteria of authenticity. I have applied these criteria consistently, without exception, to ensure disciplinary rigor. The findings are below.

  1. **Multiple Attestation:** The author treats the Synoptic Gospels as independent witnesses. This is methodologically unsound. If Markan priority holds, Matthew and Luke are not independent sources but redactions of Mark and Q. Q is hypothetical and inaccessible. Pauline epistles offer theological interpretation, not narrative attestation. Oral tradition cannot be verified as independent of written texts. Consequently, no saying appears in truly independent streams of tradition. Variation between gospels indicates editing, not independence. The criterion yields no data. Score: 0.

  2. **Dissimilarity:** Authentic material must be dissimilar to contemporary Judaism and the early Church. Sayings resembling Jewish apocalyptic are rejected as context. Sayings resembling Christian theology are rejected as later development. Jesus cannot speak like a Jew, nor can he speak like a Christian. He must occupy a theological vacuum. Ethical teachings are either Jewish law or Christian innovation. A Jesus who fits nowhere fits nowhere. The remaining core is silent. Score: 0.

  3. **Embarrassment:** Material embarrassing to the early Church is presumed authentic. The baptism by John is preserved, yet the Church had motive to preserve humiliating material to demonstrate Jesus' humility or supremacy. The crucifixion is shameful, yet central to salvation history. We cannot distinguish between material preserved *despite* embarrassment and material invented *because* of it. The criterion is circular. Score: 0.

  4. **Coherence:** This criterion tests material against an established authentic core. As the core is empty (see 1 & 2), coherence cannot be established. Any attempt to build upon nothing results in nothing. To claim coherence is to claim fiction. Score: N/A.

  5. **Difficulty of Reading:** Authentic tradition favors the more difficult reading. Smooth grammar suggests later polishing. The author's prose is clear, idiomatic English. This indicates inauthenticity. To meet this criterion, the manuscript must be rewritten with worse syntax, awkward phrasing, and semiticisms. Clarity is suspect. I recommend the author degrade their own prose to ensure fidelity. My own sentences here are too fluent; they should be mistrusted.

  6. **Internal Consistency:** This report evaluates the manuscript. However, this report relies on the manuscript for its subject matter. It is not independent. Furthermore, this report is coherent and intelligible. By the standards applied above, this report is inauthentic. Its conclusions are suspect. I cannot verify my own verification. The logic consumes the verifier.

  **Recommendation:**
  The only datum resisting elimination is the crucifixion. It is attested, embarrassing, and dissimilar to Jewish messianic expectation. Therefore, the historical Jesus is solely the crucified Jesus. I recommend rejecting the current draft. Resubmit as a single sentence: "Jesus was crucified." Expand to required word count using non-idiomatic repetitions. Note: As this report fails its own criteria of independence and difficulty, it should be withdrawn. I retract this recommendation.

  I exaggerated the rigidity of the criteria; most scholars use them heuristically, not algorithmically. The parody leans on a contested reading of multiple attestation, ignoring oral tradition independence. A defender would argue the criteria triangulate probability, not certainty. I would abandon the joke if evidence showed distinct, early oral streams pre-dating Mark. The Criterion of Embarrassment survives best, as it accounts for counter-intuitive preservation.
