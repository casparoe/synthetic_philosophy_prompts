  **Comedian:** "I've written a bit that's hilarious, but nobody gets it yet."

  **Producer:** "That's impossible."

  **Comedian:** "Why? It's gettable. If a joke is funny, someone *could* get it, right?"

  **Producer:** "Sure. Now, consider the fact: 'This joke is funny, but no one gets it.'"

  **Comedian:** "Okay..."

  **Producer:** "If anyone understood *that* fact, they'd understand the joke is funny."

  **Comedian:** "Right."

  **Producer:** "So someone would get it. So the fact is false."

  **Comedian:** "So..."

  **Producer:** "So there are no funny jokes that no one gets. Which means every funny joke is *already* got."

  **Comedian:** "Wait. You're saying you've already gotten every funny joke in existence?"

  **Producer:** "Logic demands it. If there were an unfound funny joke, it wouldn't be funny. So all funny jokes are found."

  **Comedian:** "Then why aren't you laughing at me?"

  **Producer:** "Because I've already laughed at you. In my mind. Years ago. You're just late."

  **Comedian:** "Get out."
