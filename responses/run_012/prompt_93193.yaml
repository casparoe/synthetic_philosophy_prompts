  Here is the breakdown of why, the third rule that fits her history, and the case that would prove which one she actually holds.

  ### 1. The Friend's Verdict and Rule
  **Verdict:** Skip it.
  **Rule:** The **Narrow Version** (Information is only costless if it is private and unconstrained).

  **Why:**
  The flat version of decision theory ("Value of Information is always non-negative") assumes that acquiring information does not change the *payoff structure* of your life, only your knowledge of the state. In your cousin's case, the payoff structure *does* change: having the information triggers a contractual obligation (disclosure to life insurance) that can lower her utility (higher premiums or denial). Technically, this makes the information **not costless** in utility terms, even if it is free in dollars.

  However, the clue that she personally adheres to the *Narrow* interpretation lies in **Case 6**.
  *   **Case 6:** "a test whose result goes in her own file, **nobody else reads it, and no rule anywhere forces her to act on it**: yes."
  *   If she believed the flat version, the qualifiers "nobody else reads" and "no rule forces" would be irrelevant noise. In standard theory, it doesn't matter who sees the data, only how it affects your expected utility. By explicitly including those conditions as part of the justification for the "Yes," she signals that she believes information *becomes* harmful when it is observed by others or when rules compel action.

  Since the cousin's test violates both conditions (insurer sees it, rules force disclosure), your friend will view it as "costly" information and advise skipping it.

  ### 2. The Third Rule
  **Rule:** **The Actionability Rule.**
  *"Take any information that allows you to change an action to improve the primary outcome, ignoring secondary external penalties."*

