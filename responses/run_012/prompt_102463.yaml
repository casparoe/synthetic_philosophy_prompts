answer: |-
  **Commencement Address**

  Thank you. It is good to be back. Looking out at this crowd, I see a lot of people who are very happy the rain held off. I see parents trying to spot their children in identical robes. I see a few faculty members who know exactly how many credits everyone here actually earned. And I see the graduates, who are mostly thinking about how hot it is going to get in the next twenty minutes.

  I'm not going to tell you to follow your passion. I'm not going to tell you to dream big. You've heard those things. They are nice, but they are also vague. Instead, I want to talk about a specific kind of trouble you are about to run into. It's the trouble of choosing.

  We talk about choosing as if it is a math problem. We say, "weigh your options." We say, "figure out what you value most." The image in your head is probably a scale. You put Option A on one side, Option B on the other. You add weights—salary, location, prestige, happiness—until one side sinks lower. You pick the heavier side. You walk away. The ledger balances.

  I want to suggest that for the most important choices you will make, that image is wrong. There is no scale. There is no single unit of measurement. And if you try to force your life onto one, you will not only fail to choose wisely, you will misunderstand what happens after you choose.

  Let me tell you about a friend of mine. Let's call him Jamie.

  Jamie graduated from a school very much like this one about five years ago. He had two offers on the table. Both were good. That's the first thing to know: this wasn't a choice between a disaster and a dream. It was a choice between two genuine goods.

  The first offer was in Chicago. It was a job at a policy institute. The pay was solid. The work was intellectual, rigorous, and involved writing reports that might actually influence legislation. It was a career ladder. If he climbed it, he would have stability, influence, and a certain kind of respect.

  The second offer was in rural Vermont. It was a position at a land trust. The pay was barely enough to rent a room. The work was physical—clearing trails, talking to farmers, managing conservation easements. It was immediate. He could see the trees he saved. He could know the neighbors. It was a life of connection, but not a career ladder. It was a path that wound around.

  Jamie asked everyone for advice. The standard advice came in quickly. "Which do you value more?" they asked. "Do you value impact or community? Money or meaning?"

  Jamie tried to answer. He made lists. He tried to put "influence on legislation" on the same scale as "knowing your neighbor's name." He tried to decide how many acres of forest were worth one percentage point of salary increase. He found himself going in circles. He felt broken. He thought, "If I were smarter, or clearer about who I am, the answer would be obvious."

  He picked Vermont. He moved into the drafty room. He bought the boots.

  Two years later, I had lunch with him. He was tan. He looked healthy. He talked about the land with a light in his eyes. He loved his choice. But he also looked tired. And he said something to me that stuck.

  He said, "I miss Chicago. I miss the idea of who I would have been there. And I don't mean I miss the money. I mean I miss the weight of that work. I feel a loss."

  He didn't say he regretted Vermont. He didn't say he made a mistake. He said he felt a loss.

  This is the distinction I want you to take with you. It is the difference between a cost and a loss.

  In economics, and in most of the advice we get, everything is a cost. A cost is something you give up to get something else, and the transaction closes. If you buy a coffee for five dollars, you have lost the five dollars, but you have the coffee. The ledger balances. You don't walk around mourning the five dollars forever. You paid the price.

  But some choices are not transactions. They are sacrifices. When you choose between things that are different in kind—when there is no common ruler to measure them—the thing you give up is not just a cost. It is a loss.

  A loss is different. A loss is when you give up X, you get something genuinely good in return, and X is still not made up for. The ledger does not balance. There is a remainder.

  If Jamie had viewed Chicago as a cost, he would have said, "I paid the price of policy work to buy this life in the woods." And he would be done. But because the two lives are incommensurable—because you cannot measure "legislative impact" in the same units as "community connection"—the value of Chicago didn't disappear just because he chose Vermont. The value remained. And because it remained, and he didn't have it, it became a loss.

  Here is why this matters for you.

  We are taught that if you choose correctly, you shouldn't feel bad about what you didn't choose. We think regret is a signal that we messed up. We think that if we truly loved our partner, we shouldn't mourn the other people we didn't date. If we truly loved our career, we shouldn't mourn the other paths we didn't walk.

  I am telling you that this is false.

  If you live a life of real commitments, you will accumulate losses. You will choose a career, and you will lose the freedom of the life you didn't lead. You will choose a city, and you will lose the community of the city you left. You will choose to have children, and you will lose the solitude you once had.

  These are not costs. You cannot be compensated for them. No amount of success in your chosen path fully pays back the value of the path you didn't take.

  This sounds bleak. It isn't. It's actually liberating.

  If you believe the ledger must balance, then every time you feel that pang of "what if," you think you chose wrong. You start second-guessing. You start trying to optimize again. You treat your life like a spreadsheet that isn't summing correctly.

  But if you understand that some choices involve genuine losses, then the pain doesn't mean you made a mistake. It means you made a choice between real goods. The pain is the shadow cast by the value of the thing you didn't pick.

  So, when you are out there, and you have to choose between two jobs, or two cities, or two ways of being, and you cannot find a common ruler—don't panic. Don't assume you are missing data. Don't assume you need to think harder until the scales tip.

  Sometimes, reason runs out. There is no fact of the matter about which is better. There is only the fact of what you will do.

  In those moments, you are not finding the right answer. You are creating one. You are putting your weight on one side of the scale, not because it is heavier, but because you decide to stand there.

  And when you stand there, and you look back at the other path, and you feel that ache—that sense that something good was left behind—do not talk yourself out of it. Do not let anyone tell you that you're being irrational. Do not try to convince yourself that the other path wasn't really that good anyway.

  Acknowledge the loss. Carry it. It is the proof that you understood the value of what you gave up. It is the proof that you are living a life complex enough to contain things that cannot be compared.

  You are going to make hard choices. Some of them will leave a mark. That mark is not a scar from a wound; it is a signature. It says you were here, you chose, and you know that choosing means letting go of things that matter.

  Go out and lose something good. And then build something good with what remains.

  Thank you.

  ***

  **Note to the Author**

  Here is where the speech takes liberties with the philosophical literature, where the framing is contested, and what would change my mind about the advice.

  **1. Liberties and Contested Readings**
  *   **Incommensurability vs. Incomparability:** Philosophers debate whether these options are *incommensurable* (no common measure, but still comparable) or *incomparable* (no relation of better/worse/equal holds). The speech glosses this into "no common ruler." Joseph Raz argues that incommensurability doesn't mean rational choice is impossible, just that it isn't determined by a maximizing principle. The speech leans heavily into the Raz/Williams view of "moral remainder" or "loss," but it simplifies the metaphysics. A strict utilitarian or a hedonist would argue there *is* a common ruler (welfare/utility), we just can't see it clearly. The speech assumes Value Pluralism is true without arguing for it.
  *   **Cost vs. Loss:** This isn't standard terminology. It's a rhetorical device to explain the phenomenon of "agent-regret" or "tragic remainder" (Bernard Williams). The risk is that graduates might conflate "loss" with "tragedy." Not every incommensurable choice is tragic. The speech tries to normalize the loss, but a critic might say it overdramatizes standard opportunity costs.
  *   **Creating Reasons:** The line "You are creating one" nods to Ruth Chang's view on hard choices (that we create reasons through commitment). However, Chang argues we create *new* reasons that tip the scale, whereas the speech implies the scale remains broken and we just jump. This is a subtle but significant divergence.

  **2. What Would Change My Mind**
  I would abandon this framing if one of the following arguments held water:

  *   **The "Ideal Observer" Argument:** If it could be demonstrated that there *is* a fact of the matter, even if epistemically hidden from us. If an ideal observer could rank the options, then the "loss" is actually just a miscalculation on the agent's part. If the "loss" feeling is just cognitive noise rather than a structural feature of value, then advising graduates to accept the loss is advising them to accept irrationality.
  *   **The Paralysis Risk:** If evidence suggested that framing choices as involving "losses" leads to decision paralysis or debilitating regret rather than acceptance. If telling young people "you will lose something good no matter what" makes them less likely to commit fully to their choice, the advice is counterproductive. Commitment often requires believing (perhaps falsely) that the chosen path is uniquely best.
  *   **The Commensurability of Welfare:** If the best account of human well-being turns out to be monistic (e.g., desire satisfaction or objective list theory where all goods are reducible to one metric). If "legislative impact" and "community connection" are both just contributors to "flourishing," then the ledger *does* balance, and the feeling of loss is merely a psychological glitch to be managed, not a metaphysical truth to be honored.

  **3. The Weakest Point**
  The weakest point is the transition from "there is no fact of the matter" to "you create the reason." This is the jump from metaphysics to agency. If the values are truly incommensurable, why is committing to one rational rather than arbitrary? The speech hand-waves this with "you decide to stand there." A rigorous defense requires explaining how commitment generates normativity without circularity. If I can't defend that commitment isn't just whim, the advice collapses into "pick whatever, it's all the same," which is nihilism, not pluralism.
