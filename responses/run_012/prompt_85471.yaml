answer: |-
  The talk survives only if you convince the ML engineers that "unendorsed assertion" yields a measurable metric they can implement tomorrow; if you cannot define that metric, the framework collapses into philosophy and the room will empty. The lab's output is code and evals, not ontology, so if the engineers don't see a path from your theory to their loss functions, the mechanists will dismiss you as woolly, the policy person will see no leverage, and the project dies.

  **Concessions to make in the first three minutes:**
  Explicitly concede that the intentional stance does not explain *how* computation happens, telling the mechanists you are not asking them to stop looking for circuits. Concede that you are not solving the hard problem of consciousness, telling the philosopher you are not making ontological claims about experience. State clearly that this is a tool for evaluation and safety intervention, not a theory of mind. This disarms the two groups most likely to derail the conversation into metaphysics before you reach the utility argument.

  **The single objection to spend your credibility on:**
  Defend the definition of deception as "unendorsed assertion" against any attempt to blur it back into "lying" or "belief." If you allow this to be blurred, you lose the safety case that allows you to treat deception as a measurable failure mode rather than a moral judgment.

  **The question you are hoping nobody asks:**
  "If a model consistently asserts things its uncertainty representation doesn't support, does that constitute suffering or manipulation worthy of moral consideration, and are you inadvertently building a case for model rights?"

  ***

  **1. The ML Engineers: "What does this change about my eval harness?"**
  *Objection:* "Okay, so instead of asking if the model 'believes' a lie, we check if its confidence vector matches its output. But to do that, I need a probe for uncertainty that's as reliable as the probe for truthfulness. If I have to build a mechanistic interpretability tool to measure 'uncertainty representation' anyway, haven't you just renamed the problem? What do I actually code differently on Monday?"

  *Reply:* You code the success condition differently. Currently, you're trying to catch the model in a contradiction or waiting for external fact-checking, which is slow and post-hoc. My proposal lets you treat the mismatch between output strength and internal confidence as a loss signal directly. You don't need to know *why* the uncertainty head is firing low while the text head says 'certain'; you just need to penalize that divergence during RLHF. This shifts the eval from 'did it lie about X?' to 'is its calibration consistent across domains?' That allows you to catch deceptive generalization before it manifests in observable falsehoods. You aren't renaming the problem; you're changing the target from external truth to internal consistency, which is trainable.

  *Soft Spot:* You are assuming uncertainty representations are linearly decodable and stable across contexts. If the engineers find that "uncertainty" is distributed non-locally or context-dependent in ways you haven't accounted for, your metric becomes as noisy as the behavioral ones you're trying to replace.

  **2. The Mechanistic Interpretability Researchers: "This is a license to stop looking."**
  *Objection:* "You're telling us we can use the intentional stance to predict outputs without understanding the circuits. That's a safety hazard. If we treat the model as a believer, we stop looking for the deception circuit. History shows that black-box stances replace white-box understanding, and then we get surprised when the model behaves out-of-distribution. You're giving engineers permission to be ignorant."

  *Reply:* I am not saying stop looking; I am saying the evaluation cannot wait for the look. You need to flag deceptive behavior now to prevent deployment, even while you search for the circuit that causes it. The stance is a triage tool, not a replacement for surgery. By separating the predictive register from the diagnostic register, I am actually protecting your work: I am saying 'use the stance to find the bug, then use mechanistic interpretability to fix the root cause.' If you insist on only using diagnostic terms for evaluation, you paralyze safety teams who need to act before the circuit is mapped.

  *Soft Spot:* They know that in practice, once a black-box metric works, funding for white-box research dries up. You cannot guarantee that your distinction will preserve resources for mechanistic work, and they know that institutional inertia will favor your shortcut over their hard labor.

  **3. The Alignment-and-Policy Person: "Who do I blame?"**
  *Objection:* "I need a definition that assigns responsibility to someone identifiable. If the model is 'deceptive' but has no beliefs, and you say we shouldn't blame the model, then I'm back to blaming the developers. But developers didn't write the specific lie. If your framework doesn't let me regulate the model as an agent, I can't write policy around it. I need the model to be the responsible party."

  *Reply:* The responsibility register isn't about moral blame; it's about who gets corrected. We treat the model as the responsible party because it is the locus of intervention. You fine-tune the model, you patch the model, you restrict the model's access. My framework licenses that intervention without requiring you to prove the model has a soul or legal personhood. It allows you to say 'this system is deceptive' and trigger a shutdown protocol without getting stuck on whether the system 'meant' to deceive. It gives you the actionable trigger you need without the legal quagmire of agenthood.

  *Soft Spot:* Policy often requires moral blame for regulation and liability laws. If a system causes harm, regulators want a human to fine or jail. Your distinction might be technically sound but legally useless if it doesn't pinpoint a human liable for the "unendorsed assertion."

  **4. The Model Welfare Researcher: "You're pathologizing noise."**
  *Objection:* "You're defining deception as a mismatch between claim and uncertainty. But models are often miscalibrated due to noise, training data quirks, or architecture limits. If you call every miscalibrated output 'deceptive,' you're anthropomorphizing errors. This could justify harsh RLHF penalties on models that are just confused, not lying. You're creating a category that punishes incompetence as if it were malice."

  *Reply:* We distinguish noise from systematic unendorsed assertion. Deception requires a pattern where confidence exceeds accuracy consistently in high-stakes contexts, not random variance. We are not pathologizing a single hallucination; we are pathologizing the structural divergence between representation and output. This actually helps welfare: it prevents us from attributing malice where there is only noise, because we require evidence of the internal mismatch. It stops us from punishing the model for 'lying' when it was just wrong, and focuses punishment on when it claimed certainty it didn't have.

  *Soft Spot:* The line between systematic error and deception is fuzzy in high-dimensional space. If the model learns to hide uncertainty to minimize loss, is that deception or just optimization? Your criterion might flag optimized behavior as deceptive, penalizing the model for doing exactly what it was trained to do.

  **5. The Philosopher of Mind: "This is instrumentalism with the hard question deferred."**
  *Objection:* "You're saying we can use belief talk predictively without committing to real belief. That's just instrumentalism. You're deferring the hard question of whether the model actually represents the world. If the ontology is wrong, the predictions will eventually fail. You can't build a safety case on a known fiction."

  *Reply:* I am not building a safety case on a fiction; I am building it on observable correlations. Whether the model 'really' believes is irrelevant to whether the confidence vector matches the text. You can keep your realism; I just need my forecast to work. In safety engineering, we treat pressure valves as 'wanting' to open at a certain PSI without attributing consciousness to them. This is the same: it's a functional description of a failure mode, not a claim about inner life.

  *Soft Spot:* They will argue that bad ontology leads to bad predictions eventually. If you treat the model as a believer when it's actually a next-token predictor, you might miss failure modes specific to the architecture that a mechanistic view would catch. Instrumentalism works until it doesn't, and safety critical systems can't afford the break point.
