prompt: |-
  My mate is building a little family-tree app for fun — nothing fancy, just a spreadsheet where he types in stuff like 'Marta is the mother of Dev'. He rang me last night, mildly losing it. His complaint: to store one of these facts he needs the two people and the link between them, but then the link is itself a thing in the table, so he needs another link to tie the link to the two people, and then another to tie that one to them, and it never bottoms out. I told him to stop overthinking it and just store each fact as one row with three columns. He said thats exactly the problem — even if it's a single row, what makes it one fact, rather than three seperate labels that happen to be sitting next to each other? He reckons the issue isn't his database, it's how he's thinking about facts themselves. I laughed it off, but now it's nagging at me too. Is he onto something real here, or is it a confusion you can just dissolve? And if it's real, whats the usual way people get out of it — or does every escape just shove the problem one step further back?
reasoning: |-
