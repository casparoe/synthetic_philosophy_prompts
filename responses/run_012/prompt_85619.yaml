answer: |-
  Your mate isn't losing it; he's accidentally stumbled into one of the oldest and deepest problems in metaphysics and logic. He is also, coincidentally, bumping up against a fundamental issue in computer science semantics.

  You are both right, but you are playing different games. You are playing **Engineering**; he is playing **Ontology**.

  Here is the breakdown of what's happening, the name of the problem he's found, and why your practical solution works even if his philosophical objection holds water.

  ### 1. The Name of the Beast: Bradley's Regress
  The specific philosophical problem your mate has discovered is called **Bradley's Regress**, named after the 19th-century philosopher F.H. Bradley.

  The argument goes exactly like he said:
  1.  You have a fact: "Marta loves Dev."
  2.  You have the objects: `Marta`, `Dev`.
  3.  You have the relation: `Loves`.
  4.  If the relation is a separate thing from the objects, what connects `Marta` to `Loves`? You need a new relation (let's call it `R1`).
  5.  But now, what connects `R1` to `Marta`? You need `R2`.
  6.  This goes on forever. You never actually glue the fact together; you just keep adding more glue.

  Your mate is correct that if you treat the "link" as just another object in the world, you end up in an infinite loop. He is asking: **What makes a fact a *unity* rather than just a list of parts?**

  ### 2. The Computer Science Solution: The Tuple
  In database theory, we dissolve this problem by cheating. We don't try to solve the metaphysics; we define a **primitive**.

  When you tell him to "just store each fact as one row with three columns," you are proposing a **Tuple**. In the Relational Model (invented by E.F. Codd), a row is not three separate things sitting next to each other. The row *itself* is the atomic unit of truth.

  *   **The Schema is the Glue:** The "binding" that your mate is looking for isn't in the data; it's in the **schema** (the column headers). The spreadsheet software enforces that Column 1 is "Person A," Column 2 is "Relationship," and Column 3 is "Person B."
  *   **Positional Semantics:** In a database, meaning is derived from *position*. The value "Marta" means "Mother" only because it is in the first column, not the third. The structure provides the unity, not the data itself.

  So, in engineering terms, you stop the regress by saying: **"The table structure is the relation."** You don't need a link to tie the link to the people, because the row *is* the tying.

  ### 3. The "Symbol Grounding" Problem
  Your mate's second objection is even sharper: *"What makes it one fact, rather than three separate labels that happen to be sitting next to each other?"*

  This is the **Symbol Grounding Problem**. A spreadsheet is just pixels on a screen or magnetic charges on a disk. To the computer, `Marta | Mother | Dev` is no different than `Red | Apple | Pie`.

  The "fact-ness" doesn't exist in the spreadsheet. It exists in the **interpreter**.
  *   **The Code:** The app he writes to read the spreadsheet says, "Treat column 1 as the subject."
  *   **The Human:** You look at it and understand the social concept of "mother."

  The "glue" that holds the fact together is external to the data. It is in the mind of the viewer or the logic of the code reading the file. If you remove the interpreter, you are left with just symbols.

  ### 4. Does the Escape Shove the Problem Back?
  You asked: *"Does every escape just shove the problem one step further back?"*

  **Yes.** Absolutely.

  This is the hard truth of formal systems. You cannot define everything within the system.
  *   If you define the link using data, you need a link for the link.
  *   If you define the link using code, you need code to interpret the code.
  *   If you define the link using human understanding, you need a brain to understand the understanding.

  Eventually, you hit a **Brute Fact**. You have to stop and say, "At this level, we just *agree* on what this means." In philosophy, this is often called a "form of life" (Wittgenstein) or a "primitive intuition." In computer science, we call it the **Specification**.

  The problem doesn't get solved; it gets **managed**. We stop the regress at the point where it becomes useful.

  ### 5. What Should He Do?
  Your mate is suffering from "Architecture Astronaut" syndrome. He is trying to solve the nature of reality before he has built a to-do list.

  Here is the advice to give him:

  1.  **Acknowledge the Insight:** Tell him he's rediscovered Bradley's Regress. It will make him feel validated rather than crazy.
  2.  **Pick a Primitive:** Tell him that for the purpose of *this app*, the **Row** is the primitive. It is the atom. We are not going to split it.
  3.  **Reification (The Escape Hatch):** Tell him that if he ever *does* need to treat the relationship as a thing (e.g., "Marta was the mother of Dev, *but only after 1995*"), then he can "reify" the link. He turns the row into an object with an ID. But he only does this when the business logic demands it, not because metaphysics demands it.
  4.  **The "Shut Up and Calculate" Approach:** Remind him that Google, Facebook, and Ancestry.com all store data in rows and columns. They all suffer from the same philosophical hole. They all ignore it. And their apps work.

  ### Summary
  He is onto something real. The "unity of the proposition" is a genuine philosophical puzzle that hasn't been perfectly solved in 2,000 years.

  However, it is a **category error** to apply that puzzle to a spreadsheet app. The "glue" for his facts is the **schema** and the **code** he writes to read them. The regress stops at the interpreter.

  Tell him to build the app. If the app gets popular enough, he can hire a philosopher to worry about the nature of facts while he counts the money.
