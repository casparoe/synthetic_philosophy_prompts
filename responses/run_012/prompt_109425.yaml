answer: |-
  Here is the translation of Otto Neurath's ISOTYPE (International System of TYpographic Picture Education) into your Grammar of Graphics (GoG) vocabulary, followed by the residue report and the analysis of the translation failures.

  ### Part 1: The Specification (Neurath in GoG Vocabulary)

  If we treat ISOTYPE as a visualization spec, it diverges from your standard Vega-Lite or ggplot2 mental model at the root. It does not assume a clean separation between *data* and *presentation*.

  *   **The Data Model:** There is no "raw data." The input is not a database table but a collection of social facts that require **ontological normalization**. Before encoding, facts must be standardized into countable units. If the source statistic is "total tonnage of coal," the model requires a transformation into "number of standard coal carts." The schema is not defined by the database but by the **Transformer** (see Residue).
  *   **Marks:** Geometric primitives (rectangles, lines) are forbidden unless they represent structural elements (axes, grids). The primary mark is the **semantic glyph** (pictogram). A mark is not a shape; it is a concept (e.g., a "bus" mark, not a "rectangle" mark).
  *   **Encoding Channels:**
      *   **Quantity:** Mapped exclusively to **repetition** (count of marks) or **position** (ordered arrays).
      *   **Size/Area:** Explicitly **disabled** for quantitative encoding. A mark representing 100 units must be identical in dimension to a mark representing 1 unit. Scaling a mark is a spec violation.
      *   **Color:** Restricted to a fixed, high-contrast palette. Color encodes category, never quantity.
      *   **Perspective:** Disabled. All marks are orthographic/flat. No depth channel.
  *   **Scales:** There are no continuous scales. The scale is **discrete and fixed**: 1 glyph = $X$ units. If the value is $2.5X$, the spec demands rounding or a partial glyph (though Neurath preferred avoiding fractions to maintain the integrity of the unit).
  *   **The Renderer:** The rendering engine is not software. It is a **human workshop**. The "compile" step involves manual layout decisions to ensure legibility (e.g., wrapping rows of glyphs so they don't stretch infinitely). The renderer has agency to adjust the layout for cognitive load, provided the quantitative mapping remains invariant.
  *   **Audience:** The `accessibility` config is not about colorblindness or screen readers. It is about **literacy independence**. The spec assumes the viewer has zero domain knowledge and low textual literacy. The chart must be legible without a legend if possible, or with a minimal legend.
  *   **Text:** Text is not annotation; it is the **logical glue**. The picture shows "how many" and "what kind." The text provides the syntax (verbs, conditionals, negation). The visual and verbal layers are compiled together into a single output.

  ---

  ### Part 2: The Residue Report

  This section details what survives the translation, what degrades into "vibes," and what breaks the compiler entirely.

  #### 1. Actionable Specs (What you can build tomorrow)
  *   **Unit Charts:** You can implement the "repetition over scaling" rule easily. Instead of `bar_height ~ ridership`, you render `count(glyph) ~ ridership / unit_value`.
  *   **Glyph Libraries:** You can build a standardized library of transit icons (bus, train, bike) and enforce their usage via a style guide, forbidding geometric bars for categorical data.
  *   **Flat Rendering:** You can enforce a `perspective: none` rule in your CSS/SVG pipeline.
  *   **Fixed Color Palettes:** You can lock your color scales to a specific, accessible set, removing the ability for analysts to ad-hoc color by metric.

  #### 2. Vibes (What degrades in translation)
  *   **"Friendliness":** Neurath's charts have a specific warmth. In your framework, this is "aesthetic configuration," but for Neurath, it was **political solidarity**. The glyph wasn't just an icon; it was a dignified representation of the worker's reality. A bus glyph in your dashboard is a vehicle; in Neurath's, it was a public good. You can copy the shape, but the *stance* is hard to spec.
  *   **Simplicity:** Tufte's "minimalism" is about removing noise to reveal data. Neurath's "simplicity" is about removing complexity to reveal **truth**. Your framework optimizes for *data-ink ratio*; Neurath optimized for *comprehension-speed for the uninitiated*. Sometimes this means *more* ink (drawing 100 buses) to save cognitive processing power.

  #### 3. No Counterpart (Where your vocabulary breaks)
  *   **The Transformer:** In your workflow, the "Transformer" is a SQL query or a Python script written by an analyst. In Neurath's system, the Transformer is a **distinct human role** (often a sociologist or educator, not a designer). Their job is to decide *what counts as a unit*.
      *   *Example:* Do we measure "number of buses" or "passenger capacity"? The Transformer decides which metric serves the educational goal. In your framework, this decision is hidden in the `data_source` parameter. In ISOTYPE, this decision is the primary intellectual act.
  *   **Political Education:** Your `audience` is a passive consumer of insights. Neurath's audience is a **citizen being equipped**. The chart is not a report; it is a **tool for emancipation**. The goal isn't "accurate ridership tracking"; it's "showing the worker why public funding matters." Your framework has `title` and `subtitle`; it does not have `political_intent`.
  *   **Logical Incompleteness:** Your framework assumes the data model can express any logical relationship (filters, joins, conditionals). Neurath explicitly admits ISOTYPE **cannot express logic**. It cannot show negation ("no buses"), conditionals ("if rain, then..."), or universal quantification ("all buses"). It can only show existence and quantity.

  ---

  ### Part 3: Analysis of the Translation Failure

  You asked whether the lack of counterparts (specifically the Transformer and the Political-Education aspect) means your framework is missing something real, or whether Neurath was dodging the hard problem of visual logic by hiding behind institutions.

  **1. The Transformer: Framework Deficit, Not Neurath Dodge**
  Your framework assumes the data model is a neutral representation of reality. It treats the mapping from "world" to "table" as a solved engineering problem. Neurath argues this mapping is the **site of political struggle**.
  *   **Verdict:** Your framework is missing something real. By automating the transform (SQL/ETL), you hide the epistemological choices. When you choose to visualize "rides per capita" vs. "rides per route," you are making a Transformer decision, but your tool treats it as a dropdown menu. Neurath makes this role explicit because he knows the *choice of metric* determines the *conclusion*.
  *   **Institutional vs. Logical:** This isn't a dodge. It's an acknowledgment that data doesn't speak for itself. The "Transformer" is the human compiler who ensures the data aligns with the social truth, not just the database schema.

  **2. Logical Incompleteness: Neurath's Concession**
  Neurath was a Logical Empiricist (Vienna Circle). He cared deeply about logical structure. His admission that pictures cannot handle negation or conditionals was not a dodge; it was an **empirical claim about human cognition**.
  *   **Verdict:** He is not dodging the hard question; he is answering it negatively. He believes pictures *cannot* carry logical structure reliably.
  *   **The Institutional Shift:** Because pictures fail at logic, he shifts the burden of logic to the **institution** (the school, the museum, the text accompanying the chart). The chart provides the *evidence* (the "what" and "how many"); the institution provides the *argument* (the "why" and "if").
  *   **Is this a dodge?** If your goal is a self-contained visualization that stands alone (like a modern dashboard), then yes, Neurath is dodging. He refuses to make the chart do the work of the prose. But if your goal is **mass education**, it is a feature. He separates concerns: Visuals for intuition, Text for logic. Your framework tries to cram logic into the visual (via tooltips, filters, interactive legends), which often results in cognitive overload for the non-expert.

  **3. The "Tufte with Pictograms" Error**
  Your colleague is wrong because Tufte and Neurath have opposite optimization functions.
  *   **Tufte:** Maximize data density. Minimize ink. Optimize for the **expert** who wants to find nuance. The data is sacred; the design should disappear.
  *   **Neurath:** Maximize comprehension. Standardize ink. Optimize for the **novice** who needs to grasp the magnitude. The design is the teacher; the data is malleable to the lesson.
  *   **The Conflict:** Tufte would hate the unit chart (too much ink for too little data). Neurath would hate the sparkline (too abstract for the worker).

  ### Summary
  The translation fails where your framework assumes **neutrality** and **logical completeness**.
  *   **Neutrality:** You assume the data layer is given. Neurath says the data layer is constructed by a human Transformer for a political purpose.
  *   **Completeness:** You assume a chart can express complex relationships. Neurath says charts can only show quantity/quality; logic requires text/institutions.

  If you want to adopt Neurath's strongest position without the "vibes," you cannot just change your chart types. You have to introduce a **human gatekeeper** (Transformer) who validates the *social validity* of the metrics before they hit the spec, and you have to accept that your dashboards are **incomplete** without the accompanying narrative that provides the logical structure the visuals cannot carry.
