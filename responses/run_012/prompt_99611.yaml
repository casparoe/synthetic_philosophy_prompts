answer: |-
  **Scenario**

  Elena stands at a fork in a covered pedestrian mall. Path Left leads to Shop A; Path Right leads to Shop B. Both shops stock the same umbrella, same price, same quality, same distance (ten metres), same lighting, and same queue length (zero). She needs an umbrella; it is raining. She intends to decide but is physically exhausted. Without conscious notice, her body sways rightward due to random motor noise associated with fatigue. She stabilizes, walks into Shop B, buys the umbrella, and leaves. Later she says, "I didn't choose Shop B; I just ended up there."

  **Symmetry Argument**

  The tie is objective, not epistemic. Price, quality, distance, effort, and aesthetics are identical. There are no external tie-breakers (no coins, rules, or third parties). Her fatigue induces random motor noise, not a latent preference for rightward movement; the sway is physically uncaused by any reason-relevant feature of A or B. Every feature that could constitute a reason for A is mirrored in B.

  **Analysis**

  **(A) The Maximising Line**
  Rationality requires securing an option at least as good as any alternative. Elena secured an optimal umbrella; deliberation would have incurred energy costs with zero expected value gain. Since the outcome is optimal and acquired through her own locomotion, the acquisition *constitutes* the choice. Her remark denies this identity.
  *Verdict:* Description accurate? **No.** Criticisable? **No.**

  **(B) The Arational Tie Line**
  Rational agency requires selection based on reasons. Where reasons are symmetric, selection cannot be reasoned; it must be causal (like a blink). Elena's movement was caused by motor noise, not judgment. She did not exercise agency; she underwent a physical event. Her remark correctly identifies the absence of choice.
  *Verdict:* Description accurate? **Yes.** Criticisable? **No.**

  **(C) The Settling Line**
  Practical reason requires arriving at a determinate answer one can own. The failure mode is indeterminacy, not sub-optimality. Elena allowed physical noise to settle the matter rather than willing the outcome. She secured the good but failed to author the action. Her remark correctly identifies the lack of settlement, which is itself a fault.
  *Verdict:* Description accurate? **Yes.** Criticisable? **Yes.**

  **The Single Feature**

  **The dissociation of selection from endorsement.**
  The case turns on the fact that she physically selected B without mentally endorsing B over A.

  **Counterfactuals**

  *   **If removed (she consciously endorses B):** (B) collapses (it becomes agency); (C) collapses (she settled); only (A) remains stable.
  *   **If reversed (she endorses B but physically selects A):** (A) collapses (outcome mismatch); (C) remains (failure of execution); (B) remains (selection was non-agential).

  **Attack and Reply**

  *   **(A) Defender's Attack:** "Intention is inferred from action. If she walked into B and paid, she endorsed B. Her introspection is unreliable; the act speaks louder."
  *   **(C) Defender's Reply:** "Reflexive motion lacks authorship. Reason requires that the agent could have done otherwise *for a reason*, not that she could have swayed left. She didn't own the act."

  Pivot: The dissociation of selection from endorsement
