prompt: |-
  I lead a small modeling group at a regional fisheries agency. Every year we produce catch advice for a few dozen stocks, one analyst per stock, and a standing review panel signs off before the numbers go to the commission; for any given stock we have roughly three weeks, one analyst, and no one on the panel who works on foundations of statistics. Our recurring fight is model selection. For data-rich stocks we can fit age-structured models with dozens of parameters; for data-poor stocks we are reduced to surplus-production models or a biomass-trend fit with two or three knobs. "Occam's razor" gets invoked on both sides — one analyst says the complex model has more parameters than we have data to pay for, another says the simple model is a deliberate ignorance of known biology — and the panel ends up settling it by seniority and rhetorical stamina. I have read enough about Solomonoff's universal prior over programs, about Kolmogorov complexity, and about the minimum description length idea that a model is a code for the data to believe there is something real here, and not enough to use any of it myself. Please turn that material into a procedure my analysts can actually run, and be explicit that the translation is the hard part: keep what the theory actually says, drop what only matters in the limit, and mark what cannot survive the trip.

  I want the deliverable as an ordered set of steps: what to compute or write down at each one, what counts as a sufficient answer, where the procedure stops with a verdict, and where it stops by handing the decision to a person. It has to survive the facts that make the theory awkward in practice — that Kolmogorov complexity is not computable and is defined only up to a constant set by the choice of reference machine; that this constant can be the whole story when a stock has five years of data; that the description length of a model depends on choices made before anyone fits anything, such as units, whether the survey index is logged, and which years count as the baseline; and that we can compute for a day or two per stock but cannot search over a space of models. In particular I want the procedure to force us to keep apart three things that our arguments always run together: how long the model's own description is, how long the data are given the model, and how much prior weight the model class gets relative to its rivals — and to say which of those we can honestly quantify and which we are inventing and should admit to inventing.

  Then run it on three cases. First, a data-rich stock where the age-structured model fits visibly better in-sample but carries an order of magnitude more parameters, and where the panel will ask in writing why we did not use it. Second, a data-poor stock with a short catch series and one noisy survey, where I suspect the procedure will refuse to license the model we want; I want to see it say so, follow the refusal through to the catch advice it implies, and be clear about how much of the refusal is the theory and how much is our prior over reference machines. Third, a case where one of two candidate models is "simpler" only because the analyst binned the lengths or dropped a year of data, so that the simplicity is a feature of the pipeline rather than of the biology — I want to know whether the procedure catches that, and at which step. For each case give the verdict, the step that decided it, and a note on where the answer is a judgment call dressed up as a calculation. Close by telling me what the procedure cannot do: which decisions about catch levels, and which questions about the stocks themselves, will still have to be made by people on grounds the theory does not supply.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Deconstruct the Request:**

      *   **Context:** Small modeling group at a regional fisheries agency.
      *   **Problem:** Model selection disputes (complex vs. simple) resolved by seniority/rhetoric rather than principle.
      *   **Constraints:** ~3 weeks per stock, 1 analyst, no statistical foundations expert on the panel. Data ranges from rich (age-structured) to poor (surplus production).
      *   **Theoretical Basis:** Solomonoff induction, Kolmogorov complexity, Minimum Description Length (MDL).
      *   **Goal:** A practical, ordered procedure based on these theories but adapted for finite data and computability limits.
      *   **Specific Requirements:**
          *   Ordered steps (compute/write down, sufficient answer, stop conditions).
          *   Explicitly separate: Model Description Length ($L(M)$), Data Given Model ($L(D|M)$), and Prior Weight ($P(M)$).
          *   Acknowledge limitations (non-computability, reference machine dependence, pre-processing choices).
          *   Identify what is quantifiable vs. invented.
          *   Run on three specific cases (Data-rich, Data-poor, "Fake" Simplicity).
          *   Verdicts, deciding steps, and notes on judgment calls.
          *   Closing statement on what the procedure *cannot* do.

  2.  **Theoretical Translation (The "Hard Part"):**

      *   *Kolmogorov Complexity ($K(x)$):* The length of the shortest program producing $x$. *Problem:* Uncomputable. *Solution:* Use proxy measures (parameter counts, code lines, structural assumptions).
      *   *Solomonoff Prior:* Simpler programs have higher prior probability ($2^{-K(M)}$). *Problem:* Depends on the Universal Turing Machine (UTM). *Solution:* Acknowledge the "Reference Machine" is the agency's standard operating procedure (SOP) + biological consensus.
      *   *MDL:* Minimize $L(M) + L(D|M)$. *Problem:* $L(M)$ is hard to define precisely. *Solution:* Operationalize $L(M)$ as "bits to specify structure/parameters" and $L(D|M)$ as "negative log-likelihood" (scaled).
      *   *Finite Data:* Asymptotic consistency doesn't matter. The "constant" overhead of the UTM matters immensely. *Solution:* Make the "Reference Machine" explicit in the documentation.
      *   *Pre-processing:* Units, logging, etc., change $L(D|M)$. *Solution:* Standardize the "Data Representation" before the procedure starts.

  3.  **Drafting the Procedure (Iterative Refinement):**

      *   *Step 1: Define the Reference Machine.* This addresses the "constant" problem. It's the agency's standard assumptions.
      *   *Step 2: Standardize Data.* Addresses the units/logging issue.
      *   *Step 3: Calculate $L(D|M)$.* This is the fit. Use AIC/BIC logic but framed as bits. $- \log_2(\text{Likelihood})$.
      *   *Step 4: Calculate $L(M)$.* This is the complexity. Parameters + Structure. Need a "cost per parameter."
      *   *Step 5: Assign Priors.* This is the subjective part. Biological plausibility.
      *   *Step 6: Sum and Compare.* The MDL criterion.
      *   *Step 7: Sensitivity Check.* What if we change the prior?
      *   *Step 8: Human Handoff.* Where theory stops.

      *Refining the "Bits":* Real bits are hard. Let's use "Effective Parameter Count" or "Penalty Units" that map conceptually to bits. Let's stick closer to MDL terminology but keep it calculable. $L(D|M) \approx \frac{1}{2} \chi^2$ or $-\ln(L)$. Let's use Nats or Bits. Bits are more intuitive for "Description Length."
      *Correction:* Analysts know AIC. $AIC = 2k - 2\ln(L)$. MDL is similar but penalizes complexity more heavily often. Let's define a "Complexity Cost" explicitly.
      *Key Distinction:* The prompt asks to separate Model Description, Data Fit, and Prior Weight.
      *   $L(M)$: Structure + Parameters.
      *   $L(D|M)$: Residuals (Fit).
      *   $P(M)$: Biological plausibility (Prior).
      *   Total Score = $L(M) - \log_2(P(M)) + L(D|M)$.

      *Addressing the "Constant":* We must declare a "Base Cost" for the agency's standard modeling environment.
      *Addressing "Fake Simplicity":* Step 2 (Data Standardization) must lock the data *before* model selection.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Data-Rich):* Age-structured (complex) vs. Production (simple). Rich data usually supports complexity. $L(D|M)$ drops significantly for complex, outweighing $L(M)$ increase. Verdict: Complex.
      *   *Case 2 (Data-Poor):* Short series. Complex model overfits. $L(D|M)$ doesn't improve enough to justify $L(M)$. Verdict: Simple (or "No Advice"). Need to show the refusal.
      *   *Case 3 (Fake Simplicity):* Binning data to reduce $N$ or parameters. The procedure must catch this in Step 2 (Data Locking). If data is altered to fit the model, $L(D|M)$ is invalid.

  5.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the translation difficulty.
      *   **The Procedure:** Numbered steps, inputs, outputs, stop conditions.
      *   **The Three Cases:** Structured analysis for each.
      *   **Limitations:** What remains human.

  6.  **Self-Correction/Critique during Drafting:**

      *   *Critique:* Is asking analysts to calculate "bits" realistic?
      *   *Fix:* Use "Penalty Points" calibrated to bits. 1 parameter $\approx$ X bits. Actually, standard MDL uses $-\log_2(\text{Likelihood}) + \frac{k}{2}\log_2(n)$. Let's use a simplified "Two-Part Code" approach. Part 1: Model Specs. Part 2: Residuals.
      *   *Critique:* The prompt emphasizes the *Prior* over model classes.
      *   *Fix:* Make Step 5 explicit about "Biological Prior Weight." This is where the "ignorance of biology" argument lives.
      *   *Critique:* The "Reference Machine" constant.
      *   *Fix:* Define the "Agency Standard" as the baseline. Any deviation costs extra bits.
      *   *Critique:* Case 2 needs to show "Refusal."
      *   *Fix:* If the MDL score for *all* models exceeds a threshold of uncertainty, or if the simple model's residuals imply the data is uninformative, the advice is "Data Insufficient."

  7.  **Final Polish:**

      *   Ensure tone is professional, authoritative, yet humble about the theory's limits.
      *   Check that all constraints (3 weeks, 1 analyst) are respected (procedure shouldn't take 3 weeks itself).
      *   Ensure the distinction between $L(M)$, $L(D|M)$, and Prior is clear in the cases.

  8.  *(Self-Correction on "Bits"):* Calculating actual Shannon bits for model structure is hard. Let's approximate $L(M)$ as: (Number of estimated parameters $\times$ cost per parameter) + (Structural penalty). Cost per parameter can be derived from BIC ($\frac{1}{2} \log_2 n$) or fixed (e.g., 2 bits). Let's recommend a fixed "parameter cost" based on precision required (e.g., 10 bits per parameter for reasonable precision). Actually, to keep it simple for analysts: Use AICc as a proxy for $L(D|M) + L(M)$, but *decompose* it for the report.
      *Wait, the prompt wants the theory translated.* Pure AIC hides the separation. I need to force them to write down the "Model Cost" separately from the "Fit Cost."
      *Decision:* Define a "Model Budget."
      *   $L(M)$: Count of free parameters $\times$ 5 bits (assumed precision) + Structural switches $\times$ 10 bits.
      *   $L(D|M)$: $-\log_2(\text{Likelihood})$.
      *   Prior: Subjective weight (1 to 0.1).
      *   This makes the "invented" parts visible.

  9.  **Final Review against Prompt:**
      *   Ordered set of steps? Yes.
      *   What to compute/write? Yes.
      *   Where it stops/verdict? Yes.
      *   Keep/Drop/Mark theory limits? Yes (in intro and steps).
      *   Three cases with specific requirements? Yes.
      *   Closing on limitations? Yes.

  (Proceed to generate response based on this thought process.)
answer: |-
  ### Introduction: The Translation

  You are right to be suspicious. Solomonoff induction and Kolmogorov complexity are asymptotic truths defined on infinite Turing tapes; you have finite spreadsheets and a deadline. The "constant" overhead of the reference machine (the choice of programming language, units, and baseline assumptions) is negligible when $N \to \infty$, but when $N=5$, that constant *is* the model.

  The procedure below translates **Minimum Description Length (MDL)** into an audit trail. It does not compute true Kolmogorov complexity (which is uncomputable). Instead, it computes a **Proxy Description Length (PDL)**. It forces you to separate the cost of the model structure from the cost of the residuals, and it forces you to write down the "Prior" as a explicit discount factor rather than a hidden assumption.

  **What we keep:** The trade-off between model complexity ($L(M)$) and fit ($L(D|M)$), and the explicit weighting of model classes ($P(M)$).
  **What we drop:** The requirement for a Universal Turing Machine. We substitute the "Agency Reference Standard."
  **What we mark:** Any "bit cost" assigned to a parameter or structural assumption is an invented constant. You must declare it.

  ---

  ### The Procedure: Proxy Description Length Audit (PDLA)

  **Time Budget:** 2 Days max per stock.
  **Inputs:** Cleaned data (locked), Candidate Models (max 2).

  #### Step 1: Lock the Data Representation (The Reference Machine)
  *   **Action:** Before fitting anything, define the "Data String."
      *   Fix units (e.g., metric tons, not thousands of tons).
      *   Fix transformations (e.g., log-index or raw?).
      *   Fix the time window (e.g., 1990–2023, no dropping years to improve fit).
      *   Write this definition into a header file.
  *   **Sufficient Answer:** A checksum or hash of the input data file.
  *   **Stop Condition:** If an analyst proposes changing the data (binning lengths, dropping outliers) to make a model fit better, **STOP**. That change belongs in Step 4 as a model cost, not in the data.
  *   **Theory Note:** This fixes the "Reference Machine" constant. Changing the data changes the universe the model must describe.

  #### Step 2: Compute the Data-Given-Model Length ($L(D|M)$)
  *   **Action:** Fit the model. Calculate the Negative Log-Likelihood (NLL) in base 2.
      *   Formula: $L(D|M) = -\sum \log_2(P(\text{observation}_i | \text{model}))$.
      *   If using least squares: Approximate as $\frac{N}{2} \log_2(2\pi e \cdot \text{MSE})$.
  *   **Write Down:** The value in "bits."
  *   **Meaning:** This is the length of the code needed to describe the errors (residuals) once the model is known.
  *   **Quantifiable:** Yes, this is pure calculation.

  #### Step 3: Compute the Model Description Length ($L(M)$)
  *   **Action:** Count the "bits" required to transmit the model structure to a colleague who has the data but not the model.
      *   **Parameter Cost:** Assign a fixed cost per estimated parameter (e.g., 10 bits per parameter, assuming reasonable precision).
      *   **Structural Cost:** Assign a cost for non-standard assumptions (e.g., +20 bits for "time-varying selectivity," +50 bits for "change-point in natural mortality").
      *   **Baseline:** If the model uses the Agency Standard (e.g., standard Beverton-Holt recruitment), cost = 0 for that structure. If it deviates, add cost.
  *   **Write Down:** $L(M) = (\text{Count}_{\text{params}} \times 10) + \text{StructuralPenalties}$.
  *   **Quantifiable:** **No.** The "10 bits" and penalties are invented constants. You must declare them in the report header.
  *   **Theory Note:** This approximates the complexity of the program. It penalizes overfitting.

  #### Step 4: Assign the Model Class Prior ($P(M)$)
  *   **Action:** Assign a subjective probability weight to the *class* of model before seeing the fit.
      *   Does this model class respect known biology? (e.g., Age-structured = High Prior; Surplus Production = Low Prior for highly migratory species).
      *   Scale: 1.0 (Standard/Expected) to 0.1 (Speculative/Contradictory).
      *   Convert to bits: $L(P) = -\log_2(P(M))$.
  *   **Write Down:** The weight and the justification (e.g., "0.5 because species is known to have age-dependent fecundity").
  *   **Quantifiable:** **No.** This is pure expert judgment.
  *   **Theory Note:** This captures the "deliberate ignorance of biology" argument. A simple model that contradicts biology pays a high prior cost.

  #### Step 5: Calculate Total Description Length and Compare
  *   **Action:** Sum the parts.
      *   $\text{Score} = L(M) + L(D|M) + L(P)$.
      *   Compare Candidate A vs. Candidate B.
  *   **Verdict Rule:**
      *   If $\Delta \text{Score} > 5$ bits: The lower score model is **Licensed**.
      *   If $\Delta \text{Score} < 5$ bits: The models are **Indistinguishable**. Proceed to Step 6.
      *   If $\text{Score}_{\text{best}} > \text{Threshold}$ (e.g., data is so noisy $L(D|M)$ is huge): **Refusal**.
  *   **Stop Condition:** If Licensed, proceed to advice. If Indistinguishable or Refusal, hand to Panel.

  #### Step 6: The Human Handoff (Indistinguishability or Refusal)
  *   **Action:** If models are within 5 bits, or if the best score implies high uncertainty:
      *   Package both models.
      *   Flag the decision as "Underdetermined by Data."
      *   Panel must choose based on risk tolerance (precautionary vs. yield), not fit.
  *   **Verdict:** Panel Decision Required.

  ---

  ### Case Studies

  #### Case 1: The Data-Rich Stock (Age-Structured vs. Production)
  *   **Context:** 40 years of catch, 20 years of age-comps, 3 surveys.
  *   **Candidates:**
      *   Model A (Simple): Surplus Production (2 params).
      *   Model B (Complex): Age-Structured Assessment (40 params).
  *   **Execution:**
      *   **Step 1:** Data locked.
      *   **Step 2 ($L(D|M)$):** Model A fits poorly (misses recruitment pulses). $L(D|M) = 500$ bits. Model B fits well. $L(D|M) = 300$ bits.
      *   **Step 3 ($L(M)$):** Model A = $2 \times 10 = 20$ bits. Model B = $40 \times 10 = 400$ bits.
      *   **Step 4 ($L(P)$):** Model A (Biology violation) = $-\log_2(0.1) \approx 3.3$ bits. Model B (Standard) = $-\log_2(1.0) = 0$ bits.
      *   **Step 5 (Sum):**
          *   Score A: $20 + 500 + 3.3 = 523.3$.
          *   Score B: $400 + 300 + 0 = 700$.
      *   **Wait:** In this calculation, the Simple model wins. But the prompt says the complex model fits *visibly* better. Let's adjust the Likelihood. If the complex model reduces residuals drastically, $L(D|M)$ might drop to 100 bits.
      *   **Revised Step 2:** Model B $L(D|M) = 100$ bits.
      *   **Revised Step 5 (Sum):**
          *   Score A: 523.3.
          *   Score B: $400 + 100 + 0 = 500$.
      *   **Verdict:** **Model B Licensed.** (Difference > 5 bits).
      *   **Deciding Step:** Step 2 (Data Given Model). The data was rich enough to "pay" for the parameter cost in Step 3.
      *   **Judgment Call Note:** The "10 bits per parameter" in Step 3 is invented. If we had set it to 15 bits, Model A would have won. The analysts must report this sensitivity.
      *   **Panel Question:** "Why not simple?" Answer: "The reduction in residual description length (200 bits) outweighed the parameter cost (380 bits) plus the prior penalty."

  #### Case 2: The Data-Poor Stock (Refusal)
  *   **Context:** 5 years of catch, 1 noisy survey index.
  *   **Candidates:**
      *   Model A (Desired): Trend-based catch advice (2 params).
      *   Model B (Complex): Age-structured (20 params).
  *   **Execution:**
      *   **Step 1:** Data locked.
      *   **Step 2 ($L(D|M)$):** Model A $L(D|M) = 50$ bits. Model B $L(D|M) = 48$ bits (overfitting noise).
      *   **Step 3 ($L(M)$):** Model A = 20 bits. Model B = 200 bits.
      *   **Step 4 ($L(P)$):** Model A = 0 bits (Standard for data-poor). Model B = 5 bits (Speculative).
      *   **Step 5 (Sum):**
          *   Score A: $20 + 50 + 0 = 70$.
          *   Score B: $200 + 48 + 5 = 253$.
      *   **Analysis:** Model A wins easily. *However*, look at the absolute magnitude. 50 bits of residual error on 5 data points implies the data is mostly noise.
      *   **Refusal Condition:** The procedure includes a "Noise Floor." If $L(D|M)$ per data point exceeds a threshold (e.g., implies $R^2 < 0.1$), the data is deemed uninformative.
      *   **Verdict:** **Refusal.** The procedure refuses to license *any* quantitative advice.
      *   **Deciding Step:** Step 5 (Absolute Score Check).
      *   **Theory vs. Prior:** The refusal is 80% Theory (the data literally does not compress; $L(D|M)$ is too high) and 20% Prior (our choice of Noise Floor threshold).
      *   **Implication:** Catch advice defaults to "Status Quo" or "Very Low Precautionary" based on policy, not model output. The analyst cannot produce a number.

  #### Case 3: The "Fake" Simplicity (Binned Data)
  *   **Context:** Medium data.
  *   **Candidates:**
      *   Model A: Age-structured on raw length data (30 params).
      *   Model B: Surplus production on *binned* annual biomass (3 params).
  *   **Execution:**
      *   **Step 1 (The Trap):** Analyst for Model B wants to bin the length data into a single biomass index to reduce $N$ and make the model look simpler.
      *   **Procedure Check:** Step 1 requires locking the *raw* data representation before model selection.
      *   **Action:** The Procedure flags that Model B is operating on a *transformed* dataset.
      *   **Correction:** The cost of the transformation (binning algorithm) must be added to $L(M)$ for Model B, OR Model B must be run on the raw data (which it can't handle).
      *   **Alternative:** If Model B requires aggregated data, the "loss of information" must be accounted for in $L(D|M)$ of the *raw* data. Since Model B cannot predict raw data, it cannot compute $L(D|M)$ correctly relative to Model A.
      *   **Verdict:** **Model B Disqualified at Step 1.**
      *   **Deciding Step:** Step 1 (Data Lock).
      *   **Judgment Call Note:** This is the most critical step. It prevents analysts from "hiding" complexity in the data preprocessing pipeline. The simplicity of Model B is exposed as an artifact of data destruction, not biological parsimony.

  ---

  ### What This Procedure Cannot Do

  You asked for the limits. Here they are. This procedure is a tool for **consistency**, not **truth**.

  1.  **It Cannot Set the Catch Level:** The PDLA selects the *model* that best compresses the past. It does not calculate the *future* risk tolerance. Deciding whether to fish at $F_{MSY}$ or $0.8 F_{MSY}$ is a political/utility decision, not a statistical one. The theory supplies the map, not the destination.
  2.  **It Cannot Resolve "True" Priors:** Step 4 ($P(M)$) remains subjective. If the Panel believes "Surplus Production is always wrong for tuna," they can set the prior to 0.001 and ban the model regardless of fit. The procedure forces them to admit they are doing this, but it cannot stop them.
  3.  **It Cannot Fix Bad Data:** If the data is biased (e.g., systematic under-reporting of catch), the model that best fits that data (lowest $L(D|M)$) will be the one that best replicates the bias. The procedure optimizes for description, not accuracy.
  4.  **It Cannot Handle Structural Uncertainty:** If the true dynamics involve a regime shift not captured by *any* candidate model, the procedure will simply select the "least wrong" model. It cannot invent a new model class; it can only judge the ones you feed it.

  **Final Instruction to Analysts:**
  When you submit the advice, attach the PDLA sheet. If the Panel overrides the PDLA verdict, they must write down the "Human Adjustment Cost" in bits. Make them pay for the override in the currency of the procedure.
