      *   **Infinitist (I):** Believes justification *is* the infinite chain. Strength: Avoids arbitrariness of stopping. Weakness: Seems impossible for finite minds. Move: "Potential infinity" (reasons available on demand), not "actual infinity" (holding all reasons at once).
      *   **Overlap:** Both agree justification requires reasons. Both agree finite minds can't hold infinite explicit beliefs. Both worry about arbitrariness.
