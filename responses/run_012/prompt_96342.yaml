  I toasted the bread until black,
  And carried the plate to the rack.
  I stood on the bus to abstain,
  While the engine coughed in the rain.

  The woman who took my place
  Smoothed out the line on her face.
  She arrived at her stop one minute late,
  And missed the man at the garden gate.

  He waited there holding a ring,
  Which altered the shape of the spring.
  The mood of the house shifted slight
  Into a darker, unbalanced night.

  A child born later than planned
  Walks on a different patch of land.
  The wind picks up dust from the street
  Where a heavy truck grinds its wheels.

  The dust joins a cloud over sea
  Changing the pressure slightly
  A storm forms where none was due
  I toasted the bread until black.

  I chose the loop ending because it mirrors the necessity of acting despite the untotalable chain; the poem returns to the mundane act not because the consequences vanish, but because the action persists regardless. This avoids paralysis by grounding the speaker back in the immediate reality they can actually inhabit, even if the causal tail extends beyond view.
