  **Bottom Line: No, the QALY machinery is fundamentally incompatible with lexical threshold negative utilitarianism.** QALYs are aggregative utilitarianism; lexical threshold negative utilitarianism (LTNU) is non-aggregative regarding suffering.

  **Presuppositions:** QALYs require **cardinal commensurability** (hay-fever and nerve pain are measurable in identical units) and **full aggregability** (summing across persons is morally neutral). You must believe health welfare is interchangeable between people. The 0–1 scale is packaging; the required core is that marginal gains are constant regardless of baseline severity (a unit here equals a unit there). Interpersonal comparison is strictly required, not optional.

  **Carve-outs:** The end-of-life and severe-suffering exceptions are **genuine inconsistencies** within pure QALY theory. They are political acknowledgments that severity matters lexically, contradicting the flat maximization rule. A coherent theory covering both would be **prioritarianism** (weighting benefits by baseline welfare), not cost-per-QALY maximization. The current system is a utilitarian engine with manual overrides.

  **Disability Critique:** This is a **bug in the theory**, not just measurement. By equating health status with welfare value, QALYs structurally imply disabled lives yield fewer "goods" per year. This clashes with the "worst-off first" intuition because the worst-off (severely disabled) are often deemed too costly to benefit relative to the healthy. LTNU would flip this if disability entails suffering, but standard QALYs penalize low utility weights.

  **LTNU Swap:** Adopting LTNU changes triage radically. **Who gains:** Patients with severe, intractable suffering (e.g., palliative care, severe neuropathy) get funded regardless of cost-effectiveness. **Who loses:** Preventive measures, mild chronic management, and public health interventions (the "heap of trivial improvements") get defunded until severe suffering is eliminated. Overall population health (total QALYs) would likely drop, but the distribution of relief would shift sharply toward the most distressed.

  **Conclusion:** You are running a utilitarian system with guilt-driven exceptions. To match your intuition, you need to abandon cost-per-QALY maximization for a severity-weighted model.
