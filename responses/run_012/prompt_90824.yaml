      *   **Lexical Threshold Negative Utilitarianism (LTNU):** Suffering has absolute priority. No amount of minor gain outweighs severe suffering. Only after suffering is relieved do we maximize gains.
      *   **Fit:** QALYs *allow* trade-offs (1000 people get hayfever relief vs. 1 person gets pain relief). LTNU *forbids* this if the pain counts as "severe suffering" above the threshold. Therefore, they are fundamentally incompatible.
      *   **Carve-outs (End-of-life/Severe Pain):** These are *ad hoc* corrections to the pure QALY model, acknowledging the lexical intuition but not integrating it into the core math. They are inconsistent with pure QALY maximization but consistent with a hybrid political compromise.
      *   **Disability Critique:** QALYs often value life with disability lower than without (utility weight < 1). This is a bug in the *measurement* (ableist assumptions) but also a structural feature of the *theory* (health = utility). If health is the good, disability is a reduction of the good.
      *   **Swap Impact:** If LTNU adopted, severe suffering cases get funded regardless of cost-effectiveness. Minor improvements get defunded until suffering is addressed.

