prompt: |-
  So my flatmate and I have been going around in circles about this for weeks and I need an outside verdict. She's a chemistry PhD, not a crank, and her claim is that nothing in the world actually makes anything else happen. Striking a match doesnt make the flame — the flame arrives when it arrives, and whatever actually produces it isn't in the match, or the air, or the flame itself, or anywhere else in the room. Stuff just happens, in an extremely reliable order. She says the order is the whole point: it's stable and dependable, which is exactly why her experiments work and why she can plan her life around them. She isn't saying anything could happen at any moment; she lives by the pattern like anyone else. What she won't say is that the striking necessitates the flame. She thinks an exception could in principle occur with no contradiction, and that matters to her because she's religious — on my picture, nothing outside the ordinary run of things could ever happen, and she doesn't want that baked into her physics.

  I told her this makes her whole field pointless, since chemistry is about what causes what. She said no, chemistry is about what reliably follows what; the necessity is something we add on top, since all we ever observe is one thing following another, never the "making happen." She also thinks her version is safer for science than mine, because mine leans on a kind of glue nobody has ever seen. That stung, because I couldn't immediately say why she's wrong.

  So: is there a name for her position, is it respectable or just a mood, and is she cheating somewhere? Is the necessary connection I keep insisting on the thing that's actually hard to defend? And if she's right, does anything practical change — for how she runs experiments, or for how we blame people? Dont send me a reading list, I want to know who has the better position and why.

  Keep it under 350 words, and lead with the verdict.
