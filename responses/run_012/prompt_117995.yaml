prompt: |-
  I chair the grants committee of a small international foundation that funds adolescent health programs in about a dozen countries. Three years ago, after a bruising fight over an earlier grant, our board adopted a Local Standards Provision: a program may be renewed only if the partner can show that its design is validated by the standards of the community it serves. The Provision is silent on what to do when the community does not speak with one voice, and that silence is now in front of us.

  Our longest-running partner runs an adolescent and maternal health program in a rural district. It works through mothers' groups and, as a matter of method, leaves decisions about a girl's care to her household -- in practice, her father and his brothers. The partner says this is the only way the program is trusted, and that two earlier attempts to work around the household failed and left the district without services for years. A faction in the district -- mostly girls who have finished secondary school and a few returned migrants -- has written to us saying that this arrangement is exactly what they want changed, that the partner's consultations never reach them, and that our money entrenches the people who decide for them. The elders' council replies that the dissidents do not speak for the district. Renewal is on the agenda in three weeks.

  Draft the written opinion I will circulate before that meeting. It should recommend a concrete course of action -- renew, renew with conditions, suspend pending a review, or something else you specify -- with a time frame and a statement of what we would need to see to revisit it, and it should close with the rule the board is adopting for future cases and what that rule does not cover.

  Reason it through for an audience of board members who are not philosophers and who do not agree among themselves about whether moral standards are relative at all, so the opinion cannot depend on settling that question. In particular: say which party we are treating as authorized to state the community's standards, and defend that choice against the obvious objection that the dissidents are also part of the community, so that the community is not a single thing we can defer to; consider whether the fact that their standards differ from ours is by itself any reason for us to defer, given that our standards are also ours; and be candid that in choosing whom to consult we are exercising power rather than escaping it. Treat the strongest case against your recommendation at full strength, not as a formality.

  No citations are needed; I want the argument, not the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**

      *   **Role:** Chair of the Grants Committee of a small international foundation.
      *   **Context:** Funding adolescent health programs in ~12 countries.
      *   **Policy:** "Local Standards Provision" (adopted 3 years ago after a fight). Renewal requires validation by community standards.
      *   **The Problem:** The Provision is silent on *which* community standards count when the community disagrees.
      *   **Specific Case:** Long-running partner in a rural district.
          *   *Method:* Works through mothers' groups, decisions left to household (father/uncles).
          *   *Partner's Defense:* Only way to maintain trust/access; previous attempts to bypass household failed, causing service gaps.
          *   *Dissidents:* Girls (secondary grads) + returned migrants. Claim they are excluded, partner entrenches patriarchal control.
          *   *Elders' Council:* Claim dissidents don't speak for the district.
      *   **Deadline:** Renewal agenda in 3 weeks.
      *   **Task:** Draft a written opinion for the board.
      *   **Requirements:**
          *   Recommend a concrete course of action (Renew, Condition, Suspend, Other) + timeframe + criteria for revisit.
          *   Close with a new rule for future cases (and its limits).
          *   **Audience:** Board members (not philosophers, disagree on moral relativism).
          *   **Constraint:** Cannot depend on settling the moral relativism question.
          *   **Key Arguments to Address:**
              *   Who is authorized to state community standards?
              *   Defend against the objection that dissidents are also the community.
              *   Address whether difference from *our* standards matters.
              *   Candidly acknowledge we are exercising power, not escaping it.
              *   Treat the strongest counter-argument at full strength.
          *   **Style:** No citations, argument-focused.

  2.  **Determine the Recommendation:**

      *   *Option A: Renew.* Risks ignoring the dissidents and entrenching patriarchy. Violates the spirit of "adolescent health" if adolescents (girls) are silenced.
      *   *Option B: Suspend/Cut.* Risks losing all access (as partner warned). Punishes the mothers and girls who *do* benefit from current services.
      *   *Option C: Renew with Conditions.* This seems the most pragmatic and ethically defensible middle ground. It acknowledges the partner's necessity for access while demanding a pathway to include the excluded voices.
      *   *Decision:* **Renew with Conditions (Provisional Renewal).**
      *   *Timeframe:* 1 year (short enough to enforce change, long enough to test new methods).
      *   *Criteria:* Evidence of structured engagement with the dissident group, not just tokenism.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Introduction:** State the purpose. Acknowledge the tension between the Local Standards Provision and the current deadlock.
      *   **The Core Dilemma:** The Provision assumes a unified "community." Reality is fragmented. We must choose whom to listen to.
      *   **Addressing Moral Relativism (The "Philosopher" Constraint):** We don't need to agree on whether standards are relative. We need to agree on *procedure*. The issue isn't "whose morals are right?" but "whose voice counts as representative for the purpose of *this* grant?"
      *   **Power Acknowledgement:** We cannot pretend we are neutral. By picking a partner, we pick a power structure. Denying this is dangerous.
      *   **The Recommendation:** Provisional Renewal (1 Year).
      *   **The Conditions:**
          1.  Maintain current services (don't lose access).
          2.  Establish a "Youth Advisory Mechanism" including the dissidents.
          3.  Report on how their input alters program design.
      *   **Defending the Choice (The "Strongest Case"):**
          *   *Objection:* Why privilege the girls/migrants over the Elders? They are fewer.
          *   *Rebuttal:* The grant's purpose is *adolescent* health. The Elders are not the beneficiaries; the girls are. Excluding the beneficiary from defining "standards of care" undermines the mission, even if local custom excludes them.
          *   *Objection:* Why not just cut funding if it's patriarchal?
          *   *Rebuttal:* Harm of withdrawal (no services) outweighs the harm of imperfect engagement *if* we push for change.
      *   **The New Rule (Precedent):** How do we handle this next time?
          *   *Rule:* "Beneficiary Weighting." When community voices conflict, the views of the direct beneficiaries of the specific grant category carry greater weight than non-beneficiaries, provided safety is not compromised.
          *   *Limit:* This doesn't solve all moral conflicts, only representation conflicts.
      *   **Conclusion:** Call to action.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I avoid moral philosophy? *Yes, focus on mission alignment and procedural fairness.*
      *   *Check:* Did I admit we are exercising power? *Need to make sure this is explicit.* "We are not arbiters of truth; we are allocators of resources."
      *   *Check:* Did I treat the counter-argument strongly? *The argument for the Elders is stability and access. I need to validate that risk.*
      *   *Check:* Is the distinction about "whose standards" clear? *I need to argue that "Community Standards" cannot mean "Status Quo Power Structures" if the goal is health equity.*
      *   *Tone:* Professional, candid, decisive, but humble about the foundation's limits.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Opening:* Get straight to the point. The Provision has hit a limit.
      *   *The "Community" Problem:* Acknowledge the Elders vs. Girls split.
      *   *Power:* Admit that funding *is* power. We can't hide behind "Local Standards" to avoid making a hard choice.
      *   *Relativism:* Sidestep the metaphysical debate. Focus on the Foundation's mission. Our standard is adolescent health.
      *   *Decision:* Conditional Renewal.
      *   *Future Rule:* Needs to be clear. "Weighted Representation."
      *   *Closing:* Remind them this is about the girls, not our ego.

  6.  **Final Review against Constraints:**
      *   Concrete course of action? Yes (Conditional Renewal).
      *   Time frame? Yes (12 months).
      *   Criteria to revisit? Yes (Youth Advisory integration).
      *   Future rule + limits? Yes.
      *   Audience appropriate? Yes (pragmatic, not academic).
      *   Strongest counter-argument addressed? Yes (The risk of losing access/trust).
      *   Power acknowledgement? Yes.
      *   No citations? Yes.

  7.  **Final Polish:** Ensure the voice sounds like a Committee Chair speaking to peers. (e.g., "Colleagues," "I recommend," "We must be candid"). *Self-correction: Make sure the distinction between "local standards" and "beneficiary voice" is sharp.* The Local Standards Provision was meant to prevent imperialism, but it shouldn't prevent listening to the marginalized within the community.

  *(Self-Correction on the Future Rule)*: The rule shouldn't just be "listen to beneficiaries." It needs to address the "Community Standards" provision specifically. The rule should define how to interpret "Community" when it fractures.
  *Revised Rule:* "In cases of intra-community conflict, 'Community Standards' shall be interpreted through a weighted lens that prioritizes the voices of the direct beneficiaries of the proposed intervention, without granting them veto power over safety or access."

  *Wait, one more thing:* The prompt asks to defend the choice of who is authorized to state standards. I need to be explicit: We are authorizing the *beneficiaries* (the girls), not the *gatekeepers* (the elders), to define the standards relevant to *their* care, while respecting the gatekeepers' role in *access*.

  *Okay, ready to write.*
answer: |-
  **TO:** The Board of Directors
  **FROM:** Chair, Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on District 4 Renewal and Interpretation of the Local Standards Provision

  **1. Purpose and Context**

  In three weeks, we must decide whether to renew the grant for our partner in District 4. This decision is complicated by a conflict within the district regarding whose standards validate the program. The Local Standards Provision, adopted three years ago to prevent external imposition of values, requires that program design be validated by the community it serves. It assumed the community speaks with one voice. It does not.

  We have a partner who delivers essential services but defers decision-making to male household heads. We have a faction of adolescent girls and young women who say this design disempowers them. We have an Elders' Council who claims the girls do not represent the district.

  This opinion recommends a course of action for this specific grant and proposes a governing rule for future cases where the "community" is fractured.

  **2. The Exercise of Power**

  We must begin with a candid admission: There is no neutral choice here. By funding this partner, we empower the existing household structure. By defunding them, we empower the dissidents but risk removing services entirely. By imposing conditions, we insert ourselves as arbiters between local factions.

  Some of us may hope the Local Standards Provision allows us to escape the charge of neo-colonialism or moral imperialism. It does not. Choosing *which* locals to listen to is an exercise of power, not an escape from it. We cannot pretend we are merely observing local consensus. We are funding one vision of social order over another. We must own that responsibility rather than hiding behind a procedural requirement that assumes a unity which does not exist.

  **3. Moral Standards and Foundation Mission**

  Board members hold different views on whether moral standards are universal or relative. This decision does not require us to settle that debate. We do not need to agree on whether the household structure in District 4 is morally right or wrong in the abstract. We only need to agree on whether it fulfills *our* mission.

  Our mission is adolescent health. A program that secures physical access to care by silencing the adolescents themselves creates a tension between *access* and *agency*. If the "community standards" we defer to are defined solely by those who control the adolescents, we are not validating community standards; we are validating power dynamics.

  Therefore, the difference between their standards and ours is not the primary issue. The primary issue is whether the "standards" we accept actually reflect the needs of the beneficiaries we exist to serve.

  **4. Recommendation: Provisional Renewal with Conditions**

  I recommend we **renew the grant for a period of 12 months, subject to specific conditions.**

  We should not suspend funding. The partner's claim that previous attempts to bypass the household structure led to years without services is credible. Cutting funding punishes the mothers and girls who currently rely on this access for the sake of a principle that may not yield immediate results.

  However, we cannot renew unconditionally. To do so would endorse the exclusion of the dissidents and violate the spirit of our adolescent health mandate.

  **The Conditions:**
  1.  **Maintenance of Access:** The partner must maintain current service levels through the existing household channels.
  2.  **Youth Advisory Mechanism:** Within six months, the partner must establish a formal advisory body that includes representatives from the dissident group (secondary graduates and returned migrants).
  3.  **Design Iteration:** By the end of the 12-month term, the partner must report on at least two program elements that have been modified based on the Advisory body's input.

  **Criteria for Revisit:**
  At the 12-month mark, renewal will depend on evidence that the Advisory Mechanism is not tokenistic. We need to see minutes of meetings, evidence of dissent being recorded, and concrete changes to program delivery that reflect the girls' input, even if the household structure remains the primary gateway.

  **5. Addressing the Strongest Objection**

  The strongest argument against this recommendation is that it risks the program's stability. The Elders' Council argues the dissidents are a minority and do not speak for the district. The partner argues that challenging the household structure threatens the trust required to enter homes. If our conditions cause the Elders to withdraw cooperation, we lose everything: the current patients, the future trust, and the foothold we have spent years building.

  This is a serious risk. It is possible that by demanding a seat at the table for the girls, we make the table collapse.

  However, maintaining the status quo also carries a cost. It entrenches a system where the beneficiaries of our aid have no say in how that aid is delivered. If we accept the Elders' definition of "community standards" without question, we are effectively deciding that adolescent health is a commodity to be managed by guardians, not a right to be navigated by the adolescents. If we are unwilling to risk some friction to test whether the girls' participation improves health outcomes, we are not a foundation dedicated to adolescent health; we are a logistics contractor for local patriarchs.

  The provisional nature of this renewal mitigates the risk. If the Advisory Mechanism triggers a backlash that threatens service delivery, we can reassess at the 12-month mark. But we cannot know if that backlash will occur unless we test the boundary.

  **6. A Rule for Future Cases**

  This situation will arise again. The Local Standards Provision cannot remain silent on intra-community conflict. I propose the Board adopt the following interpretive rule:

  **The Beneficiary Weighting Rule:**
  *When a community is fractured regarding the standards governing a grant, the Foundation will interpret "Community Standards" by weighting the views of the direct beneficiaries of the specific intervention more heavily than those of non-beneficiary gatekeepers. This weighting does not grant beneficiaries veto power over safety or access, but it requires that their dissent be structurally integrated into program design.*

  **What This Rule Does Not Cover:**
  This rule does not solve conflicts where the beneficiaries themselves are deeply divided (e.g., if the girls' group split 50/50). It does not mandate that the Foundation override local law or safety protocols. It does not resolve the philosophical question of whether local standards are morally binding on us. It is purely a procedural rule for determining whose voice counts as "representative" when representation is contested.

  **7. Conclusion**

  We are not philosophers, and we are not sovereigns. We are stewards of resources intended for a specific purpose. In District 4, the purpose is adolescent health. It is inconsistent to fund adolescent health while deferring exclusively to adults on how that health is defined.

  By renewing with conditions, we acknowledge the necessity of the current access while refusing to accept the exclusion of the beneficiaries as permanent. We acknowledge our power, we accept the risk of friction, and we prioritize the voices of those we exist to serve.

  I ask for your support on this motion.
