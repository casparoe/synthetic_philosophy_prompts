      *   *Top Tier:* Invariance (Objectivity Illusion) and Uncomputability (Normative Coherence).
      *   *Middle Tier:* Finite Data (Practical Irrelevance) and Computable World (Empirical Risk).
      *   *Lower Tier:* Occam Semantics (Definition mismatch).
      *   *Insulation Check:* Yes, the "asymptotic ideal" defense is a shield. Is it fatal? For a *normative* claim about *human* reasoning, yes. For a *mathematical* claim about *ideal* agents, no.

