      *   **Point 5: Uncomputability & Normativity.**
          *   *Standard Defense:* Ideal rationality is uncomputable (like AIXI).
          *   *Critique:* "Ought implies can." If no agent can ever approximate it reliably (due to halting problem barriers in the approximation), is it a guide? Also, the limit isn't unique; different approximations converge differently. Is there a *fact of the matter*?
          *   *Impact:* High. Challenges the very coherence of the normative claim.

  3.  **Synthesize and Rank:**
