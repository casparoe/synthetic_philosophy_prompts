answer: |-
  ### Exam Question: Formal Epistemology Seminar

  **Time Allowed:** 90 Minutes
  **Materials:** Closed Book. One handwritten page of notes permitted.
  **Instructions:** Answer the following question. Citations of authors or papers will not be awarded credit and may distract from the argument. Focus on the internal logic of the view described.

  **The Case of the Passer**
  A forecasting league operates for a season. Each morning, competitors receive a slate of propositions. For each proposition, a competitor must either submit a credence (a number between 0 and 1) or mark the item as *skipped*. Submitted credences are scored using a strictly proper scoring rule. A competitor's season score is the average Brier score (or equivalent) of her *submitted* forecasts; skipped items are excluded from the calculation entirely, with no penalty.

  The season is won by "The Passer." She forecasts only on items whose truth-values she can verify immediately (e.g., "It is raining outside"). She submits credences of 0 or 1 accordingly. She marks every non-trivial proposition (e.g., "Climate change will exceed 2°C by 2050") as skipped. She finishes with a perfect average score. She has no false credences. However, she holds no opinion on any proposition that matters.

  **The Question**
  Accuracy-first epistemology posits that accuracy is the sole fundamental epistemic good and that rationality consists in maximizing expected accuracy. 

  1.  Evaluate the Passer from the perspective of accuracy-first epistemology. Is she epistemically ideal? In your answer, you must distinguish between evaluating her credences over the *submitted set* of propositions versus a *fixed, comprehensive algebra* that includes the skipped items.
  2.  If the view implies the Passer is ideal, identify the specific normative deficit the view fails to capture. If the view implies she is defective, explain how the scoring machinery generates this defect given that skipped items incur no penalty.
  3.  Conclude by stating what an accuracy-firster must *add* to the theory to condemn the Passer's strategy, and explain the theoretical cost of that addition. Does it compromise the claim that accuracy is the *sole* fundamental good?

  ***

  ### Model Answer

  The case of the Passer exposes a structural ambiguity in accuracy-first epistemology regarding the domain of evaluation. To evaluate the Passer, we must first determine what is being scored: the agent's partial doxastic state (only submitted items) or a total credence function defined over a fixed algebra of relevant propositions.

  If we evaluate the Passer strictly over the *submitted set*, she is epistemically ideal. A strictly proper scoring rule rewards honesty and precision. By restricting her submissions to propositions where she has access to the truth, she guarantees maximal accuracy on every scored item. Since skipped items are excluded from the average, her aggregate score is perfect. On this reading, accuracy-first epistemology must endorse her. She has minimized inaccuracy wherever she has taken a doxastic stand. The dominance argument supports this: no other strategy yields a better average score on the submitted set. However, this verdict is intuitively disastrous. It implies that epistemic rationality is compatible with total disengagement from significant questions, provided one remains silent on them. It reduces epistemology to a game of cherry-picking trivialities.

  To avoid this, the accuracy-firster must shift the domain of evaluation to a *fixed, comprehensive algebra*. This algebra includes not only the trivial propositions the Passer answered but also the significant ones she skipped. Here, the technical machinery faces a hurdle. Standard scoring rules require a credence value for every proposition in the algebra. The Passer, however, has *no* credence for the skipped items; she has a gap. To score her, we must model her silence. 

  There are two ways to model this. First, we could treat skipping as assigning a specific credence, perhaps 0.5 (maximal uncertainty). If we do this, her accuracy on the significant propositions will likely be lower than perfect, dragging down her total average. She would no longer win the league. Second, and more formally correct, we treat her as having a *partial* credence function. Accuracy-first norms, such as probabilism, are typically defined over total functions. If the norm requires a total function, the Passer is irrational simply for having gaps. Her defect is not that her credences are inaccurate, but that her doxastic state is incomplete.

  This leads to the locus of the defect. The Passer's *credences* are not the problem; they are perfectly accurate. The defect lies in her *inquiry* or the *scope of her doxastic commitment*. She has failed to form opinions on propositions she ought to have opinions on. Standard accuracy-firstism, focused purely on the accuracy of existing credences, lacks the resources to criticize this failure. It treats the set of propositions as exogenous. The Passer exploits this by making the set endogenous to her strategy.

  To condemn the Passer, the accuracy-firster must add a norm of *comprehensiveness* or *mandatory inquiry*. This norm would state: "An agent must hold credences over all propositions in the relevant algebra," or "An agent is penalized for skipping significant propositions." This addition incurs a significant theoretical cost. 

  First, it complicates the "sole good" thesis. If accuracy is the *only* fundamental epistemic good, why is having a gap bad? A gap is not inaccurate; it is nothing. To say a gap is epistemically bad is to introduce a second good: *coverage* or *opinionation*. The view effectively becomes a dual-value theory: maximize accuracy and maximize scope. 

  Second, it risks pragmatic encroachment. Why *must* an agent have an opinion on climate change? Usually, the answer is pragmatic: it helps them act. If the accuracy-firster argues that one must have opinions on all "relevant" propositions, they must define relevance without appealing to the agent's practical interests, or else admit that practical interests determine epistemic norms. 

  In conclusion, the Passer is ideal under a naive application of accuracy-firstism that allows agents to select their own scoring domain. To criticize her, the theory must fix the algebra of evaluation independently of the agent's choices. This requires adding a norm that mandates doxastic coverage. The cost is abandoning the purity of the view: accuracy alone cannot condemn the Passer; accuracy plus a requirement to have opinions can. Thus, the Passer demonstrates that accuracy-first epistemology is incomplete without a supplementary account of epistemic duty regarding which propositions one ought to consider.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Grading Note:** Do not award marks for naming authors (e.g., Joyce, Pettigrew, Levi). Award marks for the logical structure of the argument.

  **1. The Domain Distinction (4 Marks)**
  *   **4:** Explicitly distinguishes between scoring the *submitted subset* vs. a *fixed/comprehensive algebra*. Explains that the Passer wins on the former but faces problems on the latter.
  *   **2:** Mentions the difference between submitted and total propositions but does not explain how this changes the evaluation.
  *   **0:** Treats the scoring domain as unproblematic or ignores the skipped items entirely.
  *   *Common Error:* Assuming the scoring rule automatically applies to skipped items without explaining how (e.g., treating them as wrong).

  **2. The Verdict on the Passer (4 Marks)**
  *   **4:** Correctly identifies that on the "submitted only" view, the Passer is epistemically ideal/rational, and explains why (perfect accuracy, no dominance violation).
  *   **2:** Claims the Passer is irrational immediately without explaining how the scoring rules allow her to win.
  *   **0:** Focuses on the moral or practical uselessness of the Passer rather than the epistemic evaluation.
  *   *Common Error:* Arguing she is irrational because she doesn't help society (consequentialism) rather than addressing epistemic norms.

  **3. The Locus of the Defect (4 Marks)**
  *   **4:** Identifies that the defect is not in the *accuracy* of the held credences, but in the *gaps* (partial function) or the *selection of the algebra* (inquiry).
  *   **2:** Vaguely suggests she is "lazy" or "avoiding risk" without linking this to the formal structure of the credence function.
  *   **0:** Claims her credences are inaccurate (contradicts the case setup).
  *   *Common Error:* Trying to argue that 0 and 1 are forbidden credences (regularity) which is not the core issue here.

  **4. The Required Addition and Theoretical Cost (6 Marks)**
  *   **6:** Clearly articulates that a norm of *comprehensiveness/inquiry* must be added. Explicitly analyzes the cost: this threatens the "accuracy is the *sole* good" thesis (introducing a second good like coverage) or forces a definition of "relevant algebra" that may rely on pragmatic factors.
  *   **4:** Identifies the need for a new norm but gives a weak account of the cost (e.g., "it makes the theory more complex").
  *   **2:** Suggests adding a penalty for skipping but fails to discuss how this impacts the "sole good" thesis.
  *   **0:** Fails to propose a solution or claims the theory needs no changes.
  *   *Common Error:* Suggesting we just change the scoring rule without realizing this changes the underlying axiology.

  **5. Synthesis and Clarity (2 Marks)**
  *   **2:** Argument flows logically from the technical setup to the philosophical implication. No internal contradictions.
  *   **0:** Disorganized or contradictory.

  **Distinction between A and B Grades:**
  *   **B Grade (14-16 marks):** The student identifies that the Passer exploits a loophole in the domain of evaluation and suggests that a norm of comprehensiveness is needed. They recognize the Passer is technically "perfect" under the narrow reading.
  *   **A Grade (17-20 marks):** The student goes further to analyze the *axiological cost*. They explicitly state that condemning the Passer requires abandoning the claim that accuracy is the *sole* fundamental good (since "having an opinion" becomes a separate good from "having an accurate opinion"). They handle the "partial function" technicality correctly (i.e., scoring rules require total functions). They avoid reciting the dominance argument and instead apply it to the specific constraints of the case.

  **Specific Penalties:**
  *   **-2 marks:** For citing specific authors/papers (per exam instructions).
  *   **-2 marks:** For contradicting the case setup (e.g., claiming the Passer gets penalized for skipping).
