      *   *Bottom Line:* Must be one sentence.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to conflate *Amplifying* with *Selecting*. Amplifying is Lyapunov exponents. Selecting is Basin of Attraction boundaries. This is the key physics distinction the user is hinting at.
      *   *Clarification:* Ensure the distinction between "unpredictable" and "contingent" is clear. Unpredictable = can't forecast. Contingent = outcome depends on specific low-level details.
      *   *Evolution:* Be careful not to say evolution is *just* selecting. Genetic drift is amplifying contingency. But selection is the dominant narrative.
      *   *Empirical Test:* Emphasize that we can't observe the counterfactual, so we look for *stability* of the actual outcome against later shocks (hysteresis).

  9.  **Final Review against constraints:**
      *   Taxonomy used correctly? Yes.
