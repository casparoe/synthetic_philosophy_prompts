answer: |-
  The town of Oakhaven did not trust judges. Judges were men, and men had biases, debts, and cousins. Instead, Oakhaven trusted the Lot. For every dispute, the Clerk drew names from a wooden drum. The chosen citizens gathered in the meeting hall, heard the evidence, and voted. Majority ruled.

  Elias was the Clerk. He was a man of numbers, though the town valued him for his handwriting. He kept the ledgers of verdicts, and over ten years, he had noticed patterns that made his stomach turn.

  The first pattern emerged during the trial of Silas Vane. Vane was accused of stealing grain. The evidence was murky; a sack was missing, and Vane had been seen near the barn, but so had half the town.

  Elias stood before the selected panel—twenty men and women drawn from the drum. He looked at their faces. They were good people, but they were tired, and the weather was bad. In Elias's estimation, based on past performance in murky cases, any single juror here had only a fifty-five percent chance of guessing the truth correctly. They were barely better than a flipped coin.

  Elias pulled a scrap of paper from his pocket. He needed to know if twenty was enough. He scribbled the arithmetic. If each voter is right 55% of the time, and they vote independently, the majority verdict becomes more reliable as you add voters. It was a comforting curve. With twenty people, the group's accuracy rose to about sixty-four percent. But that wasn't certainty. To reach ninety-nine percent confidence with jurors only five percent better than chance, Elias calculated he would need hundreds. Maybe a thousand.

  "Is the panel ready?" the Magistrate asked.

  "Wait," Elias said. "We need more names. The signal is too weak."

  "We don't have time for hundreds, Clerk," the Magistrate snapped. "Take the twenty."

  They voted. But Elias watched them closely. Before casting ballots, they had mingled in the hallway. Mrs. Gable had spoken loudly about Vane's father, a drunkard. Mr. Henderson had nodded. They had not decided independently. The gossip had correlated their errors. The "wisdom of the crowd" requires the crowd to think alone. Instead, they had thought as one herd.

  The verdict was Guilty. Later, the real thief was caught.

  Elias wrote in his ledger: *Panel size insufficient for confidence level. Independence assumption violated.*

  He thought about the math again that night. The theorem of the crowd was a double-edged sword. If the individual jurors were right more than half the time, adding more voices drowned out the noise. The majority converged on the truth. But Elias knew what happened if the town was prejudiced. If the individual accuracy slipped below one half—if the rumor was so strong that a juror was more likely to be wrong than right—then adding more voters didn't help. It cemented the error. A thousand biased voters wouldn't find the truth; they would drown it with overwhelming confidence. The reassurance of numbers flipped into a guarantee of injustice.

  He closed the ledger. There was a second problem, one that didn't care about truth at all.

  Two weeks later, the town faced the matter of the River Crossing. The bridge had washed out. There were three proposals on the table.

  Option A: A stone arch. Durable, expensive, slow to build.
  Option B: A wooden beam. Cheap, fast, prone to rot.
  Option C: A ferry service. Flexible, ongoing cost, weather-dependent.

  The town was divided into three equal factions.
  The Merchants wanted speed: B > C > A.
  The Landowners wanted permanence: A > B > C.
  The Farmers wanted low upfront cost: C > A > B.

  Elias stood by the ballot box. The Magistrate proposed a voting order. "We shall vote first on the Stone Arch versus the Wooden Beam. The winner will face the Ferry."

  Elias watched the hands go up.
  *Arch vs. Beam:* The Landowners (A) and Farmers (C, who prefer A over B) voted for the Arch. The Arch won.
  *Arch vs. Ferry:* The Merchants (B, who prefer C over A) and Farmers (C) voted for the Ferry. The Ferry won.

  "Hurrah for the Ferry!" shouted the Farmers.

  "Wait," said a Merchant, smelling blood. "Why did we vote in that order? The Ferry costs us every week. Let's vote again. Beam versus Ferry first."

  The Magistrate shrugged. "Order doesn't matter. The majority will is the majority will."

  They voted again.
  *Beam vs. Ferry:* The Merchants (B) and Landowners (A, who prefer B over C) voted for the Beam. The Beam won.
  *Beam vs. Arch:* The Merchants (B) and Farmers (C, who prefer A over B? No, Farmers prefer C > A > B). Wait.
  Let's trace the preferences again.
  Merchants: B > C > A.
  Landowners: A > B > C.
  Farmers: C > A > B.

  *Round 2:*
  *Beam vs. Ferry:* Merchants (B) + Landowners (A prefers B over C) = Beam wins.
  *Beam vs. Arch:* Merchants (B prefers B over A) + Farmers (C prefers A over B) = Arch wins.

  "So now the Arch wins?" asked a Landowner, smiling.

  "But yesterday the Ferry won," said a Farmer.

  "And last week," Elias whispered to himself, "we almost chose the Beam."

  The town's will had not been discovered; it had been manufactured by the order of the questions. There was no single "best" option. There was only a circle. A beat B, B beat C, C beat A. The majority was intransitive.

  Elias looked at the Magistrate, who was preparing to announce the Arch as the final decision. He looked at the Farmers, who felt cheated, and the Merchants, who knew they could have manipulated the agenda differently.

  This was not about accuracy. There was no truth to find here, only preference. The first failure had been about whether the crowd could find a fact. This failure was about whether the crowd could make a choice.

  Elias picked up his pen. He did not write the verdict down immediately. He stared at the blank page.

  The Lottery System relied on two pillars. The first was that enough independent minds, each slightly better than guessing, would converge on the truth. But if they talked too much, or if the town was poisoned by a lie that made them worse than guessing, the pillar collapsed. The second pillar was that the majority preference was a stable thing. But with three choices, the majority was a snake eating its own tail.

  He realized then that Oakhaven was not governed by the people. It was governed by the Clerk who drew the names, and the Magistrate who set the agenda. The math was invisible, but it held the walls up. And the math was rotting.

  "Record it," the Magistrate said.

  Elias dipped his pen. He wrote *Stone Arch*. He knew that if they had voted differently, it would have been the Ferry. He knew that if the jurors had spoken less before the Vane trial, it would have been *Not Guilty*.

  He blew on the ink to dry it. The town cheered for the bridge. Elias put the ledger away. He would need to calculate how many names to draw for the next trial. But first, he needed to lock the jury room so no one could speak before the vote. And tomorrow, he would have to decide which question to ask first.

  There was no formula for that.
