      *   *Utility:* It helps visualize the "phase transition" risk. If error accumulates exponentially with depth, then $S > 0$ makes $D \to \infty$ useless.
      *   *Verdict:* It does real work if it highlights the *accumulation of error*. Standard idealizations assume errors average out (Central Limit Theorem). Factored cognition fears errors compound (Chaos theory). The two-knob model captures this tension better than a single "compute" knob.

