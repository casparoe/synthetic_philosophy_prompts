  ### 1. Competing Rules

  **Rule 1: The Rational Grasp Principle**
  An agent is exempt from moral responsibility if and only if they lack the *cognitive capacity* to understand moral reasons or were totally deprived of the *opportunity* to encounter valid moral claims (as in Case 4), OR if their failure to respond is caused by a recognized physiological or psychological pathology (as in Cases 2 and 6). If an agent possesses ordinary intelligence, understands the moral reasons against their action, and has had access to those reasons, they are blameworthy for failing to act on them, even if they lack the emotional motivation to do so. A deficit of *will* or *sentiment* without a medical label is a vice, not an exemption.
  *   **Implication for New Case:** **Blameworthy.** The man understands the reasons ("state, accurately... the reasons"), had ordinary access ("ordinary intelligence," "no deprivation"), and has no medical pathology ("no illness"). His inability to care is treated as a deep character flaw (like the envy in Case 1), not an exempting condition.

  **Rule 2: The Moral Address Efficacy Principle**
  An agent is exempt from moral responsibility if and only if they are constitutively incapable of responding to moral address—that is, if the participant stance is causally futile because no argument, appeal, or reactive attitude could modify their conduct regarding the relevant class of victims. Intellectual understanding is insufficient for responsibility; the agent must be capable of being *moved* by the moral community's demands. If the incapacity is fixed and unchangeable ("no argument... made the slightest difference"), the agent is exempt, regardless of whether the cause is medical or unexplained.
  *   **Implication for New Case:** **Exempt.** The man "never been able to be moved" and therapy/argument fails. He is functionally incapable of sustaining the reciprocal demands of the participant stance regarding strangers. Like the tumour patient (Case 6) or the feral woman (Case 4), he is not a candidate for moral blame because moral engagement cannot reach him.

  ### 2. Prediction and Justification

  **Verdict:** Blameworthy.
  **Rule:** The Rational Grasp Principle (Rule 1).

  **Justification:**
  Nadia's record suggests she prioritizes *access to moral reasons* over *emotional responsiveness* when determining exemption, provided there is no medical pathology. The critical evidence is **Case 5 (The Prejudiced Man)**. In that case, the agent "absorbed the view without ever examining it" and "never took [contrary views] seriously." It is highly plausible that, due to deep social conditioning, this man was emotionally incapable of feeling empathy for the minority, much like the new case agent. Yet Nadia judges him **blameworthy**. Why? Because he had *access* to contrary views ("access to contrary views the whole time").

  In the New Case, the agent also has access: he "understands the moral rules" and can "state, accurately... the reasons." The only difference between Case 5 and the New Case is that Case 5 *wouldn't* take the views seriously, while the New Case *can't* (emotionally). However, Nadia's treatment of **Case 1 (Envy)** shows that deep-seated character vices are blameworthy. Without a "discoverable reason" like a tumour (Case 6) or psychosis (Case 2), she appears to categorize the deficit as a moral failing rather than a medical exemption. She reserves exemption for agents whose connection to the moral community is broken by *external* forces (abduction, tumour, psychosis) or *prior culpable negligence* (Case 3). The New Case agent's condition is internal, unexplained, and non-pathological; in Nadia's framework, this likely falls under "ordinary moral variation," making him a participant who simply chooses (or is constituted) to be bad.

  **Evidence Against Rivals:**
  Rule 2 (Moral Address Efficacy) struggles to explain why Case 5 is blameworthy. If the prejudiced man's upbringing made him emotionally incapable of taking contrary views seriously (a fixed psychological state), Rule 2 might suggest exemption. Nadia's refusal to exempt him suggests she believes intellectual access creates an obligation to *try* to be moved, and failure to do so is blame-worthy, even if success is difficult. She draws the line at *pathology* (Case 6) or *total isolation* (Case 4), not at *difficulty of moral perception*.

  ### 3. Test Case

  **Case:** A woman was raised in a radical cult until age 12, then rescued and raised in a normal society. She now intellectually understands all moral rules and acknowledges the validity of moral reasons regarding outsiders. However, due to the critical period of her early indoctrination, she finds it psychologically impossible to *feel* any empathy or obligation toward non-cult members, despite years of therapy and genuine effort. She harms an outsider, knowing it is wrong. There is no medical diagnosis for her condition.

  *   **Rule 1 (Rational Grasp) Verdict:** **Blameworthy.** She has ordinary intelligence, understands the reasons, and had access to the moral community from age 12. The deficit is motivational, not cognitive, and lacks a medical label.
  *   **Rule 2 (Moral Address Efficacy) Verdict:** **Exempt.** Moral address is causally ineffective ("psychologically impossible"). The participant stance is futile regarding her feelings toward outsiders, similar to the new case.

  ### 4. Conditions for Error

  My prediction would be wrong if Nadia interprets the Strawsonian "objective stance" more functionally than I have assumed. Specifically, if she believes that a *fixed, unchosen constitutive incapacity* to respond to moral reasons is sufficient for exemption *even without a medical label*, provided it renders moral engagement impossible. If she views the "no discoverable reason" clause in the New Case not as evidence of normalcy, but as evidence of a "moral luck" deficit equivalent to the tumour (Case 6), she will exempt him. My prediction relies on her requiring a *social* (Case 4) or *medical* (Case 6) hook for exemption; if she accepts *congenital moral insensitivity* as a third exempting category, I am wrong.

  \answer{blameworthy | Rational Grasp Principle}
