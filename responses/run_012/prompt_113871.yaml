answer: |-
  The pattern you describe reveals a **Dualist Theory of Property** grounded in **Legal Positivism regarding labor** and **Liberal Constitutionalism regarding capital**.

  This system does not presuppose that you own your labor as you own your land. If it did, the income tax would be constitutionally suspect as a "taking" requiring compensation, just as eminent domain is. Instead, the practice functions on the premise that **pretax earnings are a legal construct created within the sovereign's jurisdiction, to which the sovereign has a prior claim.**

  Here is the reconstruction of the implicit theory, an analysis of its consistency, and the implications of replacing it.

  ### I. Reconstruction of the Implicit Theory

  The current legal-fiscal regime rests on four interconnected pillars:

  **1. The Sovereign Baseline (The "Gross Claim" Theory)**
  The budgetary language of "tax expenditures" reveals the foundational axiom: **All value generated within the jurisdiction presumptively belongs to the state.** The tax code does not *take* money from you; it *allows* you to retain a portion of the social product you helped generate. Therefore, a deduction or credit is framed as "spending" because the state is choosing to forgo revenue that was already, in principle, its own. This is a **Positivist** view of income: rights to income exist only insofar as the law defines and protects them.

  **2. The Dualism of Assets (Land vs. Labor)**
  The system distinguishes sharply between *external* property (land, capital) and *internal* property (labor, human capital).
  *   **External Property:** Treated as pre-political or settled. The state recognizes a pre-existing title (historical or market-based). To take it requires "just compensation" because the state acknowledges it is invading a sphere of private autonomy that existed prior to the specific act of taking.
  *   **Internal Property (Labor):** Treated as socially contingent. Your ability to earn wages depends on the legal framework (contract law, currency, infrastructure, peace) maintained by the state. Therefore, the state claims a share of the *flow* of labor value (tax) without compensation, because the state is a co-producer of the conditions that make that wage possible. Conscription pays below market rate because the obligation to defend the legal order that makes your labor valuable supersedes the market value of your time.

  **3. The Administrative Definition of Income (Realization over Accretion)**
  The exclusion of imputed rent (living in your own home) and household labor (cooking/childcare) contradicts the **Haig-Simons** definition of income (consumption + change in net worth). The system implicitly adopts a **Liquidity Theory of Taxability**: You are taxed only on value that is realized in a market transaction.
  *   *Presupposition:* The state claims a share of *socialized* exchange, not *private* utility. By taxing wages but not imputed rent, the state signals that it taxes the **public circulation of value**, not the **private enjoyment of wealth**. This is not a moral distinction but an administrative one: market transactions are visible and liquid; imputed value is hidden and illiquid.

  **4. The Fiscal Illusion**
  By categorizing tax deductions as "expenditures," the state reinforces the Sovereign Baseline. It creates a psychological and accounting frame where the "natural" state of affairs is 100% taxation, and any private retention is a subsidy. This inverts the Lockean intuition that the "natural" state is 100% retention, and taxation is the intrusion.

  ### II. Requirements vs. Accommodations

  **What the Practice Strictly Requires:**
  1.  **Statutory Definition of Rights:** It requires that property rights in income be defined by statute, not by natural law. If income were a natural right, the state could not define the tax base without triggering "takings" scrutiny.
  2.  **Priority of Sovereign Claim:** It requires that the state's claim on revenue precedes the individual's claim on retention. This is necessary for the "tax expenditure" accounting to make sense.
  3.  **Distinction between Stock and Flow:** It requires that existing assets (land) be treated differently from newly generated value (wages). This allows the state to respect settled expectations (preventing revolution) while capturing future growth (funding the state).

  **What the Practice Merely Accommodates:**
  1.  **Intuitive Self-Ownership:** The system accommodates the *language* of "my paycheck" and "my house." It allows citizens to feel like owners to maintain social stability and work incentives, even if the legal structure treats the income as a state-allowed retention.
  2.  **Market Valuation:** It accommodates market prices for land (in eminent domain) and wages (in tax brackets), but it does not *require* them as moral baselines. It uses them as administrative proxies for value and ability-to-pay.
  3.  **Liberal Rhetoric:** It accommodates the idea of "taxpayer rights," but these are statutory rights, not constitutional property rights in the pretax income.

  ### III. Underdetermination and Consistency

  **Is the Theory Mutually Consistent?**
  **No.** There is a fundamental tension between the **Eminent Domain** clause and the **Income Tax** power.
  *   *Inconsistency:* If the Fifth Amendment protects "private property" from being taken for public use without just compensation, and if a person's labor is their property, then a 30% income tax is a 30% taking of that property without compensation.
  *   *Resolution:* The legal system resolves this by defining "property" in the Fifth Amendment as *vested* assets, not *expectant* earnings. This is a circular definition: Earnings are not protected property because the law says they are taxable; they are taxable because they are not protected property.

  **Where is it Underdetermined?**
  The practice is underdetermined between two rival theories:
  1.  **The Benefit Principle:** You pay taxes in exchange for services (roads, courts). This explains the wage tax but fails to explain why land takings require compensation (why don't we just offset the land value with the benefit of the highway?).
  2.  **The Ability-to-Pay Principle:** You pay based on capacity. This explains why wages are taxed and imputed rent is not (liquidity), but it fails to justify why the state owns the baseline revenue (the "tax expenditure" logic).

  The current system hovers between these, using Benefit rhetoric to justify the tax ("you use the roads") and Statist rhetoric to administer it ("tax expenditures are spending").

  ### IV. What Would Have to Change?

  If the presupposed view (Sovereign Baseline / Dualist Property) were replaced by a **Lockean Self-Ownership View** (where pretax income is the taxpayer's property), the following changes would be necessary:

  **1. Legal Changes:**
  *   **Income Tax as Taking:** The income tax would need to be reclassified legally as a "taking" of labor property. It would require a "public use" justification for every dollar raised, and potentially "just compensation" for the burden imposed beyond the average benefit received.
  *   **Conscription:** Compulsory labor at below-market rates would likely be unconstitutional involuntary servitude unless compensation matched the market wage.
  *   **Tax Base Expansion:** To be consistent, if income is the metric of taxable capacity, **imputed income** (rent, household labor) would have to be taxed. Excluding them while taxing wages is arbitrary under a self-ownership view (all labor is yours); it is only justified under the current view by administrative convenience.

  **2. Linguistic and Budgetary Changes:**
  *   **Elimination of "Tax Expenditure":** We would stop calling deductions "spending." A deduction would be recognized as the government *refraining from taking* what is yours. The budget would only list actual outlays of treasury funds, not foregone revenue.
  *   **"Net" vs. "Gross" Language:** Ordinary talk would shift from "the government gives me a tax break" to "the government allows me to keep my earnings." The burden of proof would shift: currently, you must justify why you should keep a dollar (via deduction); in the new system, the state must justify why it should take a dollar.
  *   **Reframing Entitlements:** Social security or welfare would not be framed as "benefits" funded by "contributions," but potentially as dividends or insurance premiums, clarifying the property right in the funds.

  ### Summary
  The current system presupposes that **you own your land, but the state owns the economy in which you labor.** It treats land as a pre-political right requiring compensation for invasion, but treats labor income as a political creation subject to sovereign sharing. It is internally inconsistent regarding the definition of "property," but functionally stable because it accommodates the *feeling* of ownership while enforcing the *reality* of statutory entitlement. To shift to a view where labor is truly owned like land would require dismantling the "tax expenditure" framework and constitutionally elevating pretax income to the status of vested property.
