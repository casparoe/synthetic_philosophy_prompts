          *   Is there a *principled* way to choose the grain?
      *   **Ending:** No neat resolution. The question is sharpened, not answered.

  4.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Are they using British English? (e.g., "programme," "centre," "whilst," "pub," "tutorial").
      *   *Check:* Is Eleanor too dismissive? Make sure she acknowledges the constraints but argues they weren't binding.
      *   *Check:* Is Julian too deterministic? Make sure he acknowledges small differences but argues they don't matter functionally.
      *   *Crucial Moment:* I need to make sure they explicitly discuss *counterfactuals*. "If we rewound the tape..."
      *   *The "Grain" Issue:* I need to ensure they don't just say "it depends on how you look at it." They need to ask *why* we look at it one way or the other. Is there a metaphysical fact of the matter?

  5.  **Drafting - Specific Lines & Beats:**
      *   *Eleanor:* Mention the "1974 memo." Specific historical artifact.
      *   *Julian:* Mention "transaction costs" and "information asymmetry."
      *   *The Turn:* Eleanor asks, "What counts as the *same* committee?"
      *   *Julian:* Tries to define function. Eleanor pokes holes in functional equivalence.
      *   *The Climax:* The realization that "Lock-in" might be a property of the *description*, not the *world*.

  6.  **Polishing:**
      *   Ensure the rhythm feels like a real conversation (interruptions, pauses, referencing previous points).
