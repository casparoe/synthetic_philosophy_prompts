          *   *Convergentist (He):* Believes it's functional necessity. Tasks, resources, coordination needs dictate the solution. Contingency is superficial. Rerun history = same outcome (maybe different route).
      *   **Key Goal:** Move beyond standard arguments to the *grain of description* problem. Is the outcome "the same" coarsely or finely? Is there a principled level of description? Does lock-in have a determinate answer?
      *   **Tone:** Equally well-informed, sharp, British English, genuine back-and-forth (no straw men), no tidy compromise.
      *   **Format:** Dialogue.

  2.  **Character Conception:**
      *   *Contingentist:* Let's call her Eleanor. Sharp, focused on historical process, micro-decisions, the "how."
      *   *Convergentist:* Let's call him Julian. Structuralist, focused on constraints, efficiency (bounded), the "what" and "why."
      *   *Setting:* A quiet corner of a university common room or a pub after a seminar. Let's go with a pub – it fits the British academic vibe.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes. They are discussing the specific departmental committee structure (the "Faculty Board" or similar).
      *   **Round 1: Standard Positions.**
          *   Eleanor: It was a fluke. Arthur picked the number 7 because he liked it. Now we're stuck.
          *   Julian: Rubbish. You need representation from X, Y, Z. 7 is the only number that works.
      *   **Round 2: Deepening the Argument.**
          *   Eleanor: Increasing returns. Once the first memo was written, switching costs grew.
          *   Julian: Functional fit. Other departments have similar structures. Independent invention implies necessity.
      *   **Round 3: The Pivot (The Grain of Description).**
          *   This is the core requirement. They need to notice they are talking past each other.
          *   Julian: "It's a committee with sub-committees." That's invariant.
          *   Eleanor: "It's a committee with *these* specific terms of reference and *this* specific voting weight." That's contingent.
      *   **Round 4: Pressing the Concession/Impasse.**
          *   Who defines the "outcome"?
