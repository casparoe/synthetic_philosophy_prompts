answer: |-
  **Setting:** *The back room of a pub near the university, late afternoon. The light is failing. Eleanor and Julian have finished their second pint. A notebook lies open on the table between them, filled with scribbled arrows and half-finished sentences.*

  **Eleanor:** You're doing it again, Julian. You're conflating 'inevitable' with 'intelligible'. Just because I can look at the 1974 Committee structure and make sense of it now, doesn't mean it was the only thing that could have made sense then.

  **Julian:** I'm not saying it was intelligible to them at the time. I'm saying the constraints were there, waiting to be discovered. Think of it like a landscape. The water doesn't know where the valley is until it flows, but once it flows, it follows the gradient. The committee structure is the valley.

  **Eleanor:** But what if the landscape is flat? What if the gradient is negligible? You're assuming the functional pressures were steep enough to dictate a single channel. I'm telling you they weren't. Look at the minutes from the steering group. They argued over the number of sub-committees for three hours. They settled on three because the Chairman had a train to catch. That is not a gradient; that is a coin toss. And once they wrote 'three' into the constitution, the increasing returns kicked in. You can't change it now because the cost of re-coordinating everyone is prohibitive. That is the definition of lock-in.

  **Julian:** The cost of re-coordinating is high for *any* structure, Eleanor. If they had chosen four sub-committees that day, we would now be saying it's too costly to move to three. The existence of switching costs doesn't prove the initial choice was arbitrary. It just proves institutions are sticky. The question is: if we wiped the slate clean, removed the 1974 minutes, and gave the problem to a fresh group with the same budget and the same statutory obligations, would they arrive at a structure recognisably this one?

  **Eleanor:** Recognisably? That's the weasel word, isn't it?

  **Julian:** Is it?

  **Eleanor:** It is if you get to decide what counts as 'recognisable'. If I say, 'Would they create a body to oversee academic standards?', then yes, obviously. Convergent evolution. Sharks and dolphins look alike because water has specific physical properties. But if I ask, 'Would they create a body with a quorum of twelve, a standing sub-committee for research, and a reporting cycle of three terms?', then the answer is no. That specific configuration is a frozen accident.

  **Julian:** But that specific configuration is trivia. You're describing the furniture, not the architecture. The architecture is: a central plenary, delegated authority for routine matters, and a feedback loop for appeals. Every department in the faculty has that. Did they all lock-in to the same accident? Or did they all solve the same coordination problem?

  **Eleanor:** They solved it differently! Look at History. They have a single convener model. We have a tripartite model. Both survive. Both function. If your functional fit argument held water, the selection pressure would have eliminated one of us by now. The fact that we coexist with different internal geometries proves the functional constraints are loose enough to allow for historical drift.

  **Julian:** History is an outlier. And even their 'single convener' reports to a board. The variance is at the margins. You are focusing on the local maxima. Yes, there are multiple peaks on the fitness landscape. I grant you that. But I deny that we are on a peak that is radically different from the one we would have climbed had we started from the other side of the mountain. We are in the same range.

  **Eleanor:** But 'the same range' is doing all the heavy lifting in your argument. You want to claim path dependence is false, but you only do so by zooming out until the path disappears.

  **Julian:** Or perhaps you are claiming path dependence is profound, but you only do so by zooming in until the function disappears.

  *(Eleanor leans forward, tapping the notebook.)*

  **Eleanor:** There it is. That's the thing we keep circling. It's not about the committee, is it? It's about the grain of description.

  **Julian:** I suspected you'd come to that.

  **Eleanor:** If we describe the outcome coarsely—'a system of governance'—you win. Convergence is obvious. If we describe it finely—'Article 4, Section B, Clause 2'—I win. Contingency is obvious. So, the truth value of the claim 'this institution is path dependent' changes depending on how we slice it.

  **Julian:** That suggests the property isn't in the institution, but in our description of it.

  **Eleanor:** Precisely. So, which description are we owed? Is there a principled level of analysis where 'lock-in' becomes a fact of the world rather than a fact of our taxonomy?

  **Julian:** I think there is. The principled level is the level at which the function is performed. If two different structures perform the function equally well, and both exist, then the specific structure is contingent. But if *only* structures of Type X can perform the function without collapsing under transaction costs, then Type X is determined. We need to ask: could a tripartite committee have been replaced by a single convener *without loss of function* in our specific context?

  **Eleanor:** And who judges the loss of function? The people inside the lock-in can't judge that. They've adapted their workflows to the lock-in. We've hired staff whose job descriptions match the three sub-committees. Of course it looks necessary to us; we've grown organs to fit the cage.

  **Julian:** But could we have grown different organs? That's the counterfactual.

  **Eleanor:** And you can't test it. You can't rerun the tape. So you're relying on a theoretical model of 'transaction costs' to assert necessity. I'm relying on the historical record of the actual decisions to assert contingency. Why is your theoretical model more 'principled' than my archival evidence?

  **Julian:** Because your archival evidence proves only that *this* path was taken, not that *no other* path was viable. You show me the minutes where they chose 'three' because of a train schedule. I say: fine. But suppose they chose 'four'. Would the department collapse? No. Would it look fundamentally different? No. It would still be a committee delegating to sub-groups. The 'three versus four' is noise. The 'committee versus autocracy' is the signal. Lock-in applies to the signal, not the noise.

  **Eleanor:** But the noise *becomes* the signal over time! That's the whole point of increasing returns. The arbitrary choice of 'three' creates a constituency of people who sit on the three sub-committees. They resist change. The arbitrary detail hardens into structural necessity. So you cannot separate the 'noise' of the initial choice from the 'signal' of the current function, because the noise *generated* the function.

  **Julian:** *(Pauses, swirling his pint)* That's a stronger point. You're saying the contingency sedimentates.

  **Eleanor:** I'm saying that if you define the 'outcome' broadly enough to ensure convergence, you define away the lock-in. If I say, 'We ended up with a democracy,' well, yes. But if I say, 'We ended up with this specific electoral college system,' then no, that was a fight. You want to say the committee structure is convergent because it's a 'democratic body'. I say that's like saying QWERTY is convergent because it's 'a keyboard'.

  **Julian:** QWERTY is a bad example. It's inefficient. Our committee isn't inefficient. It works.

  **Eleanor:** It works *around* its own inefficiencies. We spend half our time managing the interface between the sub-committees. That's a cost generated by the initial accident.

  **Julian:** But any interface has a cost. If we had a single convener, we'd spend half our time managing the bottleneck at the top. There is no frictionless solution. So, returning to the grain: if every possible solution involves friction, and every possible solution involves a central body and delegated tasks, then the convergence is real. The lock-in is only on the specific calibration of the friction.

  **Eleanor:** And is 'calibration' not what politics is? You're dismissing the only part that matters to the people living inside it. To the person who can't get a project approved because it falls between Sub-committee A and B, the 'calibration' is the reality. The 'functional fit' is a myth told by the people who don't have to fill in the forms.

  **Julian:** I'm not dismissing it. I'm asking if it's *locked in* in the sense we mean. If we could reset the clock, would we end up with a system where people complain about the interface between A and B? Or would they complain about the bottleneck at the top?

  **Eleanor:** They would complain about something else entirely. Maybe we wouldn't have committees. Maybe we'd have a lottery system for resource allocation. It's been done.

  **Julian:** In a department of twelve, perhaps. Not here. The scale dictates the mechanism.

  **Eleanor:** Scale dictates *some* mechanism. It does not dictate *this* mechanism. And here is where I think I can force your hand, Julian. You keep appealing to 'function'. But function is teleological. It assumes the institution exists to solve a problem. What if the institution exists to *preserve a power structure*?

  **Julian:** Go on.

  **Eleanor:** The 1974 structure didn't just solve a coordination problem. It entrenched the senior professors on the main board and relegated the junior staff to the sub-committees. That wasn't an accidental byproduct. That was the point. If we reset the clock, and the power dynamics were slightly different—say, the junior staff had more union support—we might have got a flat structure. The 'functional necessity' you see is actually the shadow of a specific distribution of power that happened to obtain in 1974.

  **Julian:** That's a Marxist reading of path dependence.

  **Eleanor:** It's a realistic one. You say 'functional fit'. I say 'fit for whom'? If the function is 'maintain senior authority while appearing consultative', then yes, this structure is perfectly converged. But that's not a universal constraint. That's a local political victory.

  **Julian:** *(Sighs)* If that's the case, then the lock-in is political, not institutional.

  **Eleanor:** Is there a difference? The institution *is* the frozen politics.

  **Julian:** But even so... if the goal is 'maintain authority', there are only so many ways to skin that cat. You still need a hierarchy. You still need a filter. You end up with something that looks like a committee structure. The power dynamic explains *why* this specific hierarchy, but not *that* there is a hierarchy.

  **Eleanor:** So you retreat to 'hierarchy' as the invariant?

  **Julian:** I retreat to 'organisation'. You cannot have a department of two hundred people without organisation. Organisation implies structure. Structure implies constraints.

  **Eleanor:** And I say 'organisation' is too coarse. It's like saying 'life' is inevitable. Maybe. But are *mammals* inevitable? Are *primates*? If I'm a primate, I care a great deal about the difference between a hand and a claw, even if both are 'organs for manipulation'.

  **Julian:** But if the question is 'why do we have hands?', the answer is 'to manipulate objects'. The specific number of fingers is contingent. The existence of fingers is not. Which one are we investigating?

  **Eleanor:** We are investigating whether we can change the number of fingers. If you tell the department, 'The number of fingers is contingent, but we can't cut them off because of switching costs,' they will say, 'So it is locked in.' If you tell them, 'The hand is necessary, but the fingers are not,' they will say, 'So we can redesign the hand.'

  **Julian:** And therein lies the rub. My position encourages reform within constraints. Yours encourages the belief that we are victims of history.

  **Eleanor:** No. Mine encourages the belief that history is a series of choices, and therefore can be unmade. Yours suggests we are optimising a machine that was built by a ghost.

  **Julian:** I suggest we are repairing a building while living in it. We can move the walls, but we cannot remove the load-bearing beams. You want to claim the beams are just painted wood.

  **Eleanor:** And I want to claim you haven't tested the beams because you're afraid the roof will fall in.

  *(Silence hangs between them for a moment. The barman begins stacking chairs in the corner.)*

  **Julian:** So, we are left with this: unless we agree on what counts as 'the same outcome', we cannot agree on whether the outcome was determined.

  **Eleanor:** And there is no neutral way to agree on that. If I choose the fine grain, I see contingency everywhere. If you choose the coarse grain, you see necessity everywhere.

  **Julian:** Is there a principled middle? Perhaps the grain at which the actors themselves describe their actions?

  **Eleanor:** They describe them in the language available to them, which is itself path dependent. They call it a 'Committee' because that's what the University Act says.

  **Julian:** Then it seems the question 'Is this locked in?' has no determinate answer. It only has an answer relative to a chosen level of abstraction.

  **Eleanor:** Which makes 'path dependence' not a property of the institution, but a relationship between the observer and the institution.

  **Julian:** That feels like a dissolution of the problem, Eleanor.

  **Eleanor:** It feels like locating it. We wanted to know if the cage was real. It turns out the bars are made of our own descriptions.

  **Julian:** *(Picks up his glass)* Well. That's cheerful.

  **Eleanor:** It's honest. We can't say it was inevitable. We can't say it was pure accident. We can only say that the story we tell about it depends on how close we stand to the ink on the page.

  **Julian:** Then I shall stand back. It looks like a valley from here.

  **Eleanor:** And I shall lean in. It looks like a scratch on the paper.

  **Julian:** Cheers to that.

  **Eleanor:** Cheers.

  *(They drink. The argument is not resolved, but the terms of the disagreement have shifted from the committee to the nature of their inquiry. The notebook remains open, the arrows now pointing in contradictory directions.)*
