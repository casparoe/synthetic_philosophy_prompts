prompt: |-
  ok so before I commit this to paper for a social choice seminar I want a consistency audit, because I'm fairly sure at least two of these can't all be true.

  (1) I'm a welfarist about collective decisions: an outcome is better the more it satisfies people's preferences, and how strongly they hold them matters — a rule that only looks at rankings is leaving usable information on the table. (2) Hence cardinal rules — score voting, approval — over ranked choice/IRV. (3) A good voting rule shouldn't give voters an incentive to misreport. Sincere voting being optimal isnt a bonus, it's the main thing I want from a rule. (4) I'm a democrat: one person one vote, no benevolent dictator, no vanguard party. (5) I think Arrow's theorem is escapable, and the escape is exactly the cardinal information in (1) and (2).

  So where's the pressure? Gibbard–Satterthwaite says any strategy-proof, onto social choice function with three or more outcomes is dictatorial, which sounds like (3) and (4) can't both hold — but I've also been told random dictatorship and the single-peaked median-voter rule are strategy-proof and not dictatorial, so maybe I'm just misreading the hypotheses and the real clash is somewhere else entirely. A friend insists (1) is the odd one out, since any rule that actually uses intensity is manipulable, but I can't tell whether that's a real theorem or just score-voting folklore.

  Tell me which commitments genuinely pull against each other, which pair only looks like it does, and rank the genuine ones by how much they cost me. Say what the cheapest fix is and what I'd be giving up, and don't reassure me that I can keep everything. Also say how confident you are in each claim, and flag the single point you're least sure of.
