      *   *Correction on Randomized:* Gibbard (1977) shows that for *random* SCFs, the only SP ones are "probabilistic dictatorships" (mixture of dictatorships). So it's not that *none* exist, but they are still essentially dictatorial in structure. Wait, Random Dictatorship is SP and anonymous. So "dictatorship" in the deterministic sense doesn't hold, but "convex combination of dictatorships" does. I need to be precise here.
