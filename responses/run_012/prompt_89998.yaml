prompt: |-
  I teach a grad seminar on social choice, and a colleague gave the students this thumbnail of Gibbard–Satterthwaite: The theorem says that any voting system with three or more candidates can be gamed by strategic voting, so there is no such thing as a fair election rule. The only way to avoid manipulation is a dictatorship, which is basically Arrow's theorem restated. It also shows that even randomized or cardinal-utility mechanisms can't be strategy-proof, so the whole project of designing manipulation-resistant institutions is doomed. Some of this sounds too strong, but I've been out of teh formal literature for a while. Can you go claim by claim and tell me what a careful social choice theorist would accept, what they'd flag as a conflation or overstatement, and whether the pessimistic conclusion about institutional design follows from the true parts? In particular, I want to know whether the theorem is really about all voting systems or only a narrower class of social choice functions, and what work the assumptions about unrestricted preferences and single-valued outcomes are doing.
