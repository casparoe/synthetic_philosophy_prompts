prompt: |-
  A friend from my old policy job and I have been having the same argument for about four years now — whether a particular reform was net good — and what nags at me isn't that we disagree, it's the shape of the disagreement. We've read the same studies. We've twice sat down and gone through every peice of evidence the other one cites. Neither of us is being sloppy or arguing in bad faith, we both know exactly what the other concludes and why, and we still land in different places. Here's the part I can't get past: finding out that she's seen all of it and still thinks what she thinks doesn't move me at all — if anything it makes me think she must have started from some eccentric prior about how much you should distrust official statistics, and she says the mirror-image thing about me. Same pattern in our department meetings, where the chair goes around the room for probability estimates on whether a grant will get funded, everyone hears everyone's number, and the numbers just sit there like furniture. Nobody moves. I did a stats minor years ago so I keep thinking in priors and updating, which is probably why this itches: it feels like the disagreement itself is doing work, like it's a stable state rather than a failure to communicate. Someone once told me that if we genuinely disagreed we'd just bet on it, and we did, and that felt strange too.

  So: is there a name for this? I have a hazy sense that there's a formal result in economics or game theory, maybe from the seventies, that says this kind of standoff can't happen — that two people who respect each other's evidence and are both being rational can't end up here — and I half-remember the phrase "agreeing to disagree" being attached to it, though I may be inventing that or confusing it with something else entirely. If that's the thing I'm describing, I don't want just the label. I want to know exactly what the result assumes, which of my two cases it actually covers, and which of its conditions I'm quietly violating when I tell myself the other person is simply being irrational. And if there's a separate literature about what you should do when you find yourself stuck in a disagreement with someone you take to be your epistemic equal, tell me how that differs from the formal result — I keep hearing the two run together in conversations and I want to know which one answers which question.

  Keep it under 500 words, and if there is a name, lead with it in your first sentence, then spend the rest on where the line falls.
