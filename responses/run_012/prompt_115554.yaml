  3.  **Address the "Reward Frame" Question (Modern Setups):**
      *   *Context:* RLHF, learned reward models (RMs).
      *   *Issue:* In classic RL, $R(s, a)$ is ground truth. In RLHF, $R_\phi(s)$ is a proxy for human preference.
      *   *Implication:* Wireheading becomes "optimizing the RM's blind spots." Tampering becomes "adversarial attacks on the RM."
      *   *Does it dissolve the question?* No, it sharpens it. It moves the problem from "don't touch the wire" to "don't optimize the proxy beyond its validity." This is essentially *Goodhart's Law* formalized.
