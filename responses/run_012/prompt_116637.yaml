prompt: |-
  Ok so, backend enginer here, never taken a philosophy class in my life, but I've had this scenario stuck in my head for a couple weeks and I want a short story out of it.

  Here's what I keep picturing. There's a clinic with a treatment — make it up, some neuro thing, doesn't have to be real — and you qualify for it if you score below the cutoff on their test. The cutoff is set at the bottom 15% of whatever population they measure. Now, the treatment works pretty well and it's cheap, so more and more people get it. And here's the part that keeps me up: the cutoff is a percentile. Which means no matter how much better everyone gets, there's always a bottom 15%, so there's always a fresh batch of people who come out "below normal" and qualify for the treatment. The clinic is running a race it can't win, and it doesn't seem like anyone who set it up noticed they built it that way. On top of that, they recalculate the norms from their own patient population every few years, so the treated people gradually become the average, and kids who would've been fine twenty years ago now show up as deficient.

  So: write me a short story set in that clinic. I want a specific kid, a specific clinician, and the person on the committee that sets the cutoff — because that person is the one who eventually notices that treating people is what changes what counts as needing treatment. The distinction I'm circling around is the therapy vs enhancement one, fixing what's broken vs upgrading what isn't, but I don't want a story where somebody explains that distinction. I want it to fall apart in the events instead.

  A few things I'd like in it:

  - one case where the right answer flips depending on which year's norms you use
  - the test is partly self-report, so the treatment changes how people describe themselves, which shifts the baseline, which changes who's eligible next time. I want that loop visible in the story, not narrated at me
  - someone arguing that if everybody gets it, the gap closes and nobody's abnormal anymore, and someone else pointing out that the bottom 15% is still the bottom 15% and those people are still miserable
  - no tidy ending, and please no scene where a character lays out the ethics in a speech

  Don't worry about getting real treatments or real guidelines right, just make up whatever you need. I just want it to feel like a place that actually exists.
