answer: |-
  The testing booth smelled like lemon disinfectant and warm plastic. Leo, twelve years old, sat with his hands flat on the table. The tablet in front of him displayed a series of shifting geometric shapes. He tapped them in sequence. Fast. Faster.

  "Question four," the automated voice said. "In the past month, how often have you felt your thoughts were moving through water?"

  Leo hesitated. He looked at the options: *Never, Rarely, Sometimes, Often, Always.*

  His friends, the ones who had gone to the Center last year, talked fast. They finished homework before dinner. They didn't lose their train of thought mid-sentence. Leo felt like he was wading while they were swimming.

  "Often," Leo said.

  Dr. Aris Thorne watched the response log from the observation window. He took a sip of lukewarm coffee. On his second monitor, Leo's raw score populated: 142 points. Solid reaction time. Adequate pattern recognition. But the self-report module dragged the weighted average down.

  Thorne opened the diagnostic file. He toggled the reference dataset.

  **Dataset: 2018 Norms (Pre-Align Cohort)**
  *Percentile: 16th*
  *Eligibility: Ineligible (Cutoff 15th)*

  He clicked the dropdown.

  **Dataset: 2024 Norms (Current Clinical Population)**
  *Percentile: 14th*
  *Eligibility: Eligible*

  Two percent. That was the difference between a medical necessity and a healthy variation. That was the difference between insurance coverage and out-of-pocket pricing that most families couldn't touch. Thorne rubbed his eyes. He'd been doing this for six years. He remembered when the 15th percentile felt like a line drawn in stone. Now it felt like a horizon.

  ***

  The committee room was cold. Dr. Elena Vance projected a slide onto the whiteboard. It showed two bell curves. One was blue, broad and centered around 100. The other was red, shifted sharply to the right, centered around 135.

  "The red curve is last year's treated patients returning for follow-up," Vance said. She didn't turn around. "They aren't patients anymore. They're the control group."

  Mark, the head of outreach, leaned forward. "And their quality of life metrics are up forty percent. Elena, look at the aggression logs. Classroom disruptions are down. We're fixing broken things."

  "We're redefining 'broken'," Vance said. She finally turned. She was tired, the kind of tired that sleep didn't fix. "We update the norms every three years based on the general population. But the general population is increasingly composed of our former patients. We are calibrating the test against the treated."

  "So?" Mark said. "If everybody gets it, the gap closes. Nobody's abnormal anymore. That's the goal, isn't? Public health."

  "The cutoff is a percentile, Mark. It's relative." Vance tapped the screen. "No matter how high the scores go, there is always a bottom fifteen percent. We are running a treadmill. We treat the bottom, they become the middle, the middle becomes the standard, and a new bottom emerges from kids who would have been fine ten years ago."

  "They're still miserable," Mark said. "You saw the self-report data. The kids at the bottom feel defective. Whether that's biological or social doesn't matter to them. They feel slow. We have a drug that makes them feel fast. Why withhold it?"

  "Because when they feel fast, the next kid feels slower," Vance said. Her voice was flat. "Look at case 4092. Leo V."

  She pulled up Thorne's file.

  "Raw score hasn't changed in six years," Vance said. "But the diagnosis flipped last month because the norm shifted. We are manufacturing pathology to sell the cure."

  "We are alleviating suffering," Mark countered. "If the bottom fifteen percent is miserable, we treat them. If the next fifteen percent becomes the new bottom fifteen percent because the average rose, we treat them too. Eventually, everyone is treated. Eventually, nobody is at the bottom."

  "The bottom fifteen percent is still the bottom fifteen percent," Vance said. "And they are still miserable. You're not raising the floor. You're lowering the ceiling."

  Mark sighed, checking his watch. "The board wants utilization up, Elena. Not philosophy. If the test says he qualifies, he qualifies. If the norms say he's deficient, we treat. We follow the protocol."

  "The protocol is the error," Vance said.

  "Then fix the protocol," Mark said. "Until then, we follow it."

  ***

  Thorne sat across from Leo and his mother. The office was quiet, save for the hum of the air purifier.

  "Leo's scores indicate a deficit in cognitive fluidity," Thorne said. He kept his voice even. He didn't mention the 2018 dataset. He didn't mention that two years ago, Leo would have been told he was perfectly average.

  "But he gets good grades," Leo's mother said. She was clutching her purse. "He reads well. I just... he comes home tired. He says everyone else is quicker."

  "That subjective experience is part of the metric," Thorne said. He clicked the mouse. The screen showed the red curve. "The treatment, Align, helps synchronize neural processing. It won't change who he is. It just removes the friction."

  "Is it safe?"

  "We have ten years of data." Thorne didn't say *on the new norms*. "Most patients report feeling more... aligned."

  Leo looked at his hands. "Will I be able to keep up?"

  "Yes," Thorne said.

  "Like Jason?"

  "Like Jason."

  Jason had been treated last year. Jason was now the average. Jason was the reason Leo was slow.

  Thorne moved the cursor to the authorization box. He thought about Vance's email from yesterday, the one marked *Do Not Circulate*, containing the graphs of the shifting mean. He thought about Mark's reply: *Utilization targets.*

  He thought about Leo sitting in the booth, answering *Often* to the question about thoughts moving through water. If Leo took the Align, his thoughts would speed up. Next year, when Leo was fifteen, he would take the test again. His scores would be normal. He would be part of the control group.

  And there would be another twelve-year-old in the booth. And that kid would look at Leo, and feel like he was moving through water.

  "Doctor?" Leo's mother asked.

  Thorne clicked the box. The status changed from *Pending* to *Approved*.

  "We'll schedule the first infusion for Tuesday," Thorne said.

  Leo let out a breath he seemed to have been holding for months. His shoulders dropped. He looked relieved. He looked normal.

  "Thank you," his mother said.

  Thorne closed the file. On his desk, his phone buzzed. A calendar reminder: *Q3 Norms Recalibration Meeting.*

  He muted the notification and picked up the phone to call the next patient.
