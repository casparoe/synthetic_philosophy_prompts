answer: |-
  Verdict: Maya wins on the metaphysics of social kinds, but Jonah is right that ontology alone cannot generate moral criticism.

  1. **Maya is right.** Money is the textbook example of a status function dependent on collective intentionality, not intrinsic physical properties.
  2. **Both, in different ways.** Jonah conflates state theory with construction (prison currency is money without the state), but he is correct that "constructed" is neutrally descriptive without further normative premises.
  3. **Maya is right.** This distinction (causal vs. constitutive) mirrors Ian Hacking's work on interactive kinds. Race changes bodies via stress/opportunity; money exists only via agreement.
  4. **Maya is right.** This modal test effectively separates natural kinds (gold exists without the word) from social kinds (money vanishes without the practice).
  5. **Jonah is right.** "Widow" passes the test but isn't necessarily oppressive. He correctly identifies that "constructed" implies contingency, not injustice.
  6. **Maya is right.** Internal critique is valid; social facts are objective within the system, even if the system is arbitrary.
  7. **Both, in different ways.** Race is a hybrid: constituted by classification but causally real in its effects. Debunking race requires attacking biological essentialism, not just noting social dependence.

  **The Blind Spot:** Both treat "construction" as an ontological label rather than a political tool. They argue over what the word *means*, missing what the word *does*. The point of calling race constructed isn't to compare it to money metaphysically, but to undermine its *naturalization*. By focusing on whether construction implies critique, they miss that the claim's power lies in demonstrating contingency to enable political change. They are debating the map's legend while ignoring the terrain of power it obscures.
