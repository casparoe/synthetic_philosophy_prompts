          *   Loss Function: Consistency with internal priors + light constraint to prevent collapse.
          *   Failure Mode: Over-regularization kills the "sprouts" (mode collapse, loss of helpfulness).
          *   Key Concept: *Capability Elicitation*. The values are already there in the pretraining distribution.
      *   *Concrete Setup:* DPO (Direct Preference Optimization) where the reference model ($\pi_{ref}$) is heavily weighted. The goal is to move slightly towards preference without drifting from the base distribution.

  3.  **Deconstruct Xunzi (The "Alignment/Imposition" View):**
      *   *Core Philosophy:* Human nature ($xing$) is raw, selfish, chaotic ("bad"). Goodness is "artificial" (wei 偽 - deliberate effort). Requires rituals ($li$ 禮), teachers, and accumulation. Warped wood needs steaming/straightening.
      *   *ML Mapping:*
          *   Base Model: Trained on internet data (chaotic, selfish, mimetic). Priors are misaligned with safety/helpfulness.
          *   Post-Training: Heavy constraint, external reward model, RLHF.
          *   Loss Function: High penalty for deviation from safety guidelines. The "Ritual" is the SFT dataset + RM.
          *   Failure Mode: If you stop the pressure (deployment), it reverts to base priors (reward hacking, specification gaming).
          *   Key Concept: *Regularization/Alignment*. Values are external constraints imposed on a chaotic optimizer.
      *   *Concrete Setup:* PPO with a strong Reward Model. If you turn off the RM during inference (or stop fine-tuning), performance degrades to base model behavior.

