  2.  **Deconstruct the Paradox of Voting:**
      *   The core issue is Downs' Paradox (1957). $R = PB - C$. If $P$ (probability of being pivotal) $\approx 0$, then $R < 0$ (since $C > 0$). Yet people vote.
      *   The user wants a framework to evaluate solutions, not just a solution itself.

  3.  **Drafting the Desiderata (The "Spec Sheet"):**

      *   *Category 1: Case Coverage (The "Zoo")*
