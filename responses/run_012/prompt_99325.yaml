answer: |-
  Welcome to the other side of the bench. It is a rare pleasure to speak with someone who understands that a model is only as good as its boundary conditions. Your background in nitrogen cycling is actually more relevant than you might think; you are used to tracking flows where individual molecules don't matter, but aggregate behavior determines the health of the system. That is precisely the tension here.

  You are asking for the **Desiderata for a Theory of Voting Rationality**. You want to know what a successful model must predict, preserve, and explain before you accept it as adequate.

  Here is the spec sheet. I have organized it into Case Coverage, Conceptual Distinctions, Empirical Constraints, and Logical Consistency. I have flagged which items are generally considered non-negotiable (NN) and which are theoretical preferences (TP).

  ### I. Case Coverage (The Zoo)
  *An adequate theory must assign a rationality status (Rational, Irrational, or Arational) to the following scenarios without ad-hoc adjustments.*

  1.  **The National General Election:** $P$ (probability of being pivotal) $\approx 0$. Cost $C > 0$. Benefit $B$ (policy difference) is high.
      *   *Requirement:* Must explain why voting is not deemed irrational here despite $P \times B < C$. (NN)
  2.  **The Small Committee / Tied Local Race:** $P$ is significant (e.g., $1/6$ or $1/1000$).
      *   *Requirement:* Must align with standard decision theory (vote if $P \times B > C$). (NN)
  3.  **The Expressive Voter:** Agent votes despite knowing $P \approx 0$, deriving utility $D$ from the act itself (affirmation of identity, duty, solidarity).
      *   *Requirement:* Must distinguish whether this renders the act *instrumentally* rational (by redefining $B$) or *expressively* rational (a different category entirely). (TP)
  4.  **The Indifferent Abstainer:** Agent has no preference between candidates ($B = 0$) or finds $C$ too high.
      *   *Requirement:* Must classify abstention as rational. (NN)
  5.  **The Strategic "Canceler":** Agent votes solely to offset a specific opponent's vote (e.g., the brother-in-law case).
      *   *Requirement:* Must handle game-theoretic interdependence (Nash equilibrium contexts) without collapsing into the national election problem. (TP)

  ### II. Conceptual Distinctions
  *The theory must not collapse these categories. Blurring them is a common failure mode.*

  1.  **Act vs. Rule/Disposition:**
      *   *Distinction:* The rationality of *this specific vote* vs. the rationality of *cultivating the habit of voting*.
      *   *Requirement:* Must specify which unit of analysis is being judged. A theory might justify the habit (Rule Utilitarian) while condemning the specific act (Act Utilitarian). (NN)
  2.  **Explanation vs. Justification:**
      *   *Distinction:* Why people *do* vote (psychology/sociology) vs. why they *should* vote (normative rationality).
      *   *Requirement:* Must not commit the naturalistic fallacy (inferring "ought" from "is"). High turnout does not prove rationality. (NN)
  3.  **Instrumental vs. Expressive vs. Ethical:**
      *   *Distinction:* Voting to change outcomes (Instrumental) vs. Voting to express identity (Expressive) vs. Voting because it is a duty (Deontological).
      *   *Requirement:* Must declare which currency of "utility" is being spent. Mixing them without definition creates a tautology. (NN)
  4.  **Individual vs. Generalized:**
      *   *Distinction:* "What happens if *I* vote?" vs. "What happens if *everyone like me* votes?"
      *   *Requirement:* Must state whether the rationality calculation allows for counterfactual generalization. (TP)

  ### III. Empirical Consistency
  *A philosophical theory of rationality cannot contradict robust empirical data regarding human behavior.*

  1.  **Non-Zero Turnout:**
      *   *Requirement:* The model cannot predict 0% turnout in large elections. (NN)
  2.  **Cost Sensitivity:**
      *   *Requirement:* Turnout must decrease as $C$ (registration hassle, distance, weather) increases. (NN)
  3.  **Stake Sensitivity:**
      *   *Requirement:* Turnout must increase as $B$ (perceived difference between candidates) increases. (NN)
  4.  **Public Good Structure:**
      *   *Requirement:* Must acknowledge that election outcomes are non-excludable public goods (you get the result whether you voted or not), creating a structural free-rider incentive. (NN)

  ### IV. Logical Consistency (The Trilemma)
  *You asked to check your hunch. You are correct. The following three propositions are jointly unsatisfiable under standard decision theory.*

  1.  **Pure Instrumentalism:** Rationality is defined solely by expected causal impact on outcomes ($R = P \times B - C$).
  2.  **Causal Nullity:** In large-scale elections, the causal probability of a single vote determining the outcome is effectively zero ($P \approx 0$).
  3.  **Rationality of Voting:** Voting in large-scale elections is a rational act.

  **Verdict:** You cannot hold all three.
  *   If you keep (1) and (2), you must conclude Voting is Irrational (The Downsian Conclusion).
  *   If you keep (1) and (3), you must deny (2) (arguing $P$ is higher than math suggests, which is empirically false).
  *   If you keep (2) and (3), you must deny (1) (arguing rationality includes non-instrumental goods).

  **Status:** This is **Non-Negotiable**. Any theory claiming to solve the paradox must explicitly state which of these three it is rejecting.

  ### V. The "Killer" Constraint
  *Which single requirement does the most damage to popular theories?*

  **The Causal Efficacy Constraint (derived from Case 1 & Trilemma Item 2).**
  *   *Definition:* The theory must account for the fact that a single vote in a national election has no *causal* power to change the outcome.
  *   *Damage:* This single constraint eliminates standard **Expected Utility Theory (Instrumentalism)** immediately. It forces the theorist to either redefine "Utility" (to include expressive benefits), redefine "Rationality" (to include ethical duties), or redefine "Causation" (to include non-linear/generalized effects). It is the rock upon which the purely economic models break.

  ### VI. Preliminary Scorecard (The Contenders)
  *Based on the spec sheet above, here is how the usual suspects fare.*

  **1. The Expected-Utility Line (Downs/Riker)**
  *   *Verdict:* **Fails.**
  *   *Why:* It adheres to Pure Instrumentalism and Causal Nullity, forcing it to conclude voting is irrational. To save it, proponents must add a "D-term" (citizen duty) to the utility equation, which effectively admits that pure instrumentalism is insufficient. It struggles to distinguish Explanation from Justification.

  **2. The Expressive Line (Brennan/Lomasky)**
  *   *Verdict:* **Partial Fit.**
  *   *Why:* It saves Rationality by rejecting Pure Instrumentalism. It handles the National Election case well (voting is consumption, not investment). However, it struggles with Cost Sensitivity (why does cost matter if it's just expression?) and risks collapsing the distinction between voting and cheering at a football game. It explains behavior well but offers a thin justification for civic obligation.

  **3. The Rule/Ethical Line (Kantian/Rule Utilitarian)**
  *   *Verdict:* **Partial Fit.**
  *   *Why:* It saves Rationality by shifting from Act to Rule (Generalization). It handles the Public Good structure well. However, it is vulnerable on the Individual vs. Generalized distinction (why am I responsible for what *others like me* would do?). It also risks conflating Rationality with Morality, which your reading group may wish to keep separate.

  ### Summary for your Reading Group
  Your hunch is the anchor. You cannot have a purely causal, purely individual, purely instrumental model that results in a rational vote in a national election. The math forbids it.

  Therefore, any theory you accept must explicitly **violate** one of those three constraints. The "Spec Sheet" above is designed to force your interlocutors to admit *which* constraint they are sacrificing. If they claim to satisfy all three, they are smuggling premises.

  Good luck with the argument. It is the same paradox we face in soil chemistry: one molecule of nitrate doesn't kill the lake, but we regulate the application rate as if every molecule counts. The resolution is always in the aggregation, never in the atom.
