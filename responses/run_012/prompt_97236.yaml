answer: |-
  # COMMISSION DECISION PROCEDURE: CRIMINALIZATION OF MORAL CONDUCT
  **Version:** 1.0 (Operational)
  **Audience:** Staff Attorney / Research Director
  **Purpose:** To generate defensible recommendations on bills criminalizing conduct where harm is disputed but moral condemnation is high.

  ## PART I: PRELIMINARY DEFINITIONS
  *Before applying the screens, the Staff Attorney must define the conduct precisely. Vague statutes fail this procedure automatically.*

  1.  **Secular Harm:** Physical injury, psychological trauma, financial loss, or infringement on the liberty/rights of a non-consenting third party. *Excludes:* Hurt feelings, religious sin, violation of tradition, or "moral corruption" without tangible consequence.
  2.  **Positive Morality:** The actual attitudes, feelings of intolerance, indignation, or disgust held by the community (measurable via testimony, polling, historical enforcement).
  3.  **Critical Morality:** Moral principles that can be defended by reason and evidence, independent of popular sentiment.
  4.  **Social Cohesion:** The degree to which the community shares a moral identity such that violating it threatens the stability of social institutions or the willingness of citizens to cooperate.

  ---

  ## PART II: THE TWO-TRACK SCREEN

  ### TRACK 1: THE HARM SCREEN (The Liberty Constraint)
  *Ask the following questions in order. If any answer is "Yes," proceed to Track 2. If all are "No," terminate at Recommendation A.*

  1.  **Non-Consenting Parties:** Does the conduct involve participants who cannot consent (minors, incapacitated) or who are coerced?
  2.  **Tangible Injury:** Does the conduct cause documented physical injury, psychological trauma, or financial loss to a specific individual other than the actor?
  3.  **Public Order:** Does the conduct occur in a manner that physically obstructs public spaces, creates a breach of the peace, or imposes unavoidable exposure on unwilling observers (beyond mere offense)?
  4.  **Systemic Risk:** Does the conduct create a demonstrable risk of exploitation, trafficking, or black-market violence?

  *   **Termination A (Recommendation Against):** If **ALL** answers are **NO**.
      *   *Rationale:* No secular harm to others exists. Criminalization is unjustified under the harm principle.
      *   *Action:* Draft recommendation against criminalization. Proceed to **Part IV (Limitations)** to check for misfires.

  ### TRACK 2: THE COHESION SCREEN (The Community Constraint)
  *Apply this track if Track 1 yields at least one "Yes" OR if Track 1 yields all "No" but the referral is explicitly moral in nature.*

  1.  **Intensity of Feeling:** Is the public reaction characterized by *intolerance, indignation, and disgust* rather than mere disagreement or dislike? (Evidence: Legislative hearing testimony, media tone, history of vigilante action).
  2.  **Realism of Threat:** Is the moral condemnation shared across diverse subgroups (class, religion, region), or is it confined to a specific sect or interest group?
  3.  **Disintegration Evidence:** Is there empirical or historical evidence that tolerating this conduct leads to the breakdown of essential institutions (family, contract, state authority) or encourages other harmful acts?
  4.  **Constitutive Value:** Does the prohibited conduct attack a symbol or practice that constitutes the political identity of the state itself (e.g., the integrity of the ballot, the authority of the court)?

  *   **Pass:** If Questions 1 & 2 are **YES**, and (3 **OR** 4 is **YES**).
  *   **Fail:** If Questions 1 or 2 are **NO**.

  ---

  ## PART III: DECISION MATRIX & TIE-BREAKER

  *Compare the results of Track 1 and Track 2.*

  | Track 1 (Harm) | Track 2 (Cohesion) | Recommendation | Rationale |
  | :--- | :--- | :--- | :--- |
  | **PASS** (Harm Found) | **PASS** (Cohesion Threat) | **FOR Criminalization** | Both liberty and community interests align. Ensure proportionality. |
  | **PASS** (Harm Found) | **FAIL** (No Cohesion Threat) | **FOR Criminalization** | Harm to others justifies intervention regardless of moral consensus (e.g., regulatory offenses). |
  | **FAIL** (No Harm) | **FAIL** (No Cohesion Threat) | **AGAINST Criminalization** | No justification exists. |
  | **FAIL** (No Harm) | **PASS** (Cohesion Threat) | **CONFLICT** | **Apply Tie-Breaker Rule.** |

  ### THE TIE-BREAKER RULE
  **In cases of CONFLICT (No Secular Harm + High Cohesion Threat):**
  **Default Recommendation:** **AGAINST Criminalization.**
  **Mandatory Annotation:** The report must flag this as a **"Legislative Value Choice."**

  *   **Reasoning:** The criminal law imposes physical coercion (loss of liberty). In a pluralistic society, coercion requires secular justification (harm). Moral condemnation alone is insufficient for *criminal* sanctions, though it may justify civil regulation or social censure.
  *   **Exception:** If Track 2, Question 4 (Constitutive Value) is the *sole* basis for the Cohesion Pass, the Recommendation shifts to **HAND-OFF**. The Commission cannot adjudicate the symbolic foundations of the state; this is a pure political question.

  ---

  ## PART IV: LIMITATIONS & MISFIRES
  *The Staff Attorney must append this checklist to every recommendation to flag where the procedure may yield legally sound but politically or socially unstable results.*

  1.  **The Speculative Harm Misfire:** Does the harm rely on long-chain causation (e.g., "this conduct might lead to violence eventually")?
      *   *Flag:* If yes, note that the Harm Screen may be over-inclusive.
  2.  **The Majoritarian Tyranny Misfire:** Is the Cohesion Screen passed solely by a numerical majority targeting a vulnerable minority?
      *   *Flag:* If yes, note that the Cohesion Screen risks enforcing prejudice rather than shared values.
  3.  **The Net Harm Misfire:** Will criminalization create more harm (black markets, enforcement costs, family separation) than the conduct itself?
      *   *Flag:* If yes, the Recommendation for Criminalization must be downgraded to "Against" regardless of the Matrix.
  4.  **The Standing Misfire:** Is the core question whether the state has *standing* to legislate morality at all?
      *   *Flag:* If yes, the procedure cannot resolve this. Mark as "Foundational Value Choice."

  ---

  ## PART V: APPLICATION TO PENDING REFERRALS

  ### CASE 1: Consensual Adult Incest (Sibling)
  **Conduct:** Sexual relations between adult siblings, private, no coercion, contraception used.

  **Track 1: Harm Screen**
  1.  *Non-Consenting Parties?* No (Adults).
  2.  *Tangible Injury?* No (Contraception negates genetic risk; no evidence of inherent psychological trauma in all cases).
  3.  *Public Order?* No (Private).
  4.  *Systemic Risk?* Low (Potential for normalization to blur family boundaries, but speculative).
  *   **Result:** **FAIL** (No Secular Harm).

  **Track 2: Cohesion Screen**
  1.  *Intensity of Feeling?* Yes (Universal disgust/incest taboo).
  2.  *Realism of Threat?* Yes (Cross-cultural and cross-sect condemnation).
  3.  *Disintegration Evidence?* Debated (Argument: Undermines family structure roles).
  4.  *Constitutive Value?* No (Not an attack on the state).
  *   **Result:** **PASS** (High Cohesion Threat).

  **Matrix:** **CONFLICT** (Harm Fail / Cohesion Pass).
  **Tie-Breaker Application:** Default to **AGAINST Criminalization**.
  **Annotation:** Flag as Legislative Value Choice.

  **Recommendation:** **Do Not Criminalize.**
  *Reasoning:* While the conduct violates a profound moral norm, it produces no secular harm to others in the specific circumstances defined (private, consensual, sterile). The criminal law is too coercive a tool for enforcing the incest taboo where no victim exists.
  **Residual Disagreement:** This recommendation ignores the *symbolic* harm to the institution of the family. It assumes the family is a private contract rather than a public status.
  **Misfire Flag:** **Majoritarian Tyranny Misfire.** (Risk: This recommendation will be viewed as legitimizing conduct the public views as inherently abusive).
  **Director's Note:** *This is the recommendation you will not like. It is legally consistent with the Harm Principle but politically toxic. It exposes the Commission to accusations of moral relativism. However, under this procedure, we cannot recommend criminalization without a victim.*

  ### CASE 2: Assisted Suicide (Competent, Terminally Ill)
  **Conduct:** A physician providing means for a competent, terminally ill adult to end their life.

  **Track 1: Harm Screen**
  1.  *Non-Consenting Parties?* No (Competent adult).
  2.  *Tangible Injury?* Yes (Death). *Crucial Distinction:* Is death a "harm" in this context? Under secular law, death is the ultimate harm *unless* waived.
  3.  *Public Order?* No.
  4.  *Systemic Risk?* Yes (High risk of coercion of vulnerable elderly; slippery slope to non-terminal).
  *   **Result:** **PASS** (Potential for Harm/Abuse exists).

  **Track 2: Cohesion Screen**
  1.  *Intensity of Feeling?* Yes (Deeply divided; Sanctity of Life vs. Autonomy).
  2.  *Realism of Threat?* No (Not a shared consensus; polarized).
  3.  *Disintegration Evidence?* Debated (Does it undermine medical trust?).
  4.  *Constitutive Value?* Yes (State interest in preservation of life).
  *   **Result:** **PASS** (Based on Constitutive Value/State Interest).

  **Matrix:** **FOR Criminalization** (Harm Pass + Cohesion Pass).
  *Wait, re-evaluate Harm Screen.* If the act is voluntary, is it "Harm to Others"? The "Harm" is to the self. Track 1 Question 2 specifies "individual *other than the actor*."
  *Correction:* Track 1 Result is **FAIL** (Harm is to self).
  *Correction:* Track 2 Result is **PASS** (State interest in life/Slippery slope risk counts as Systemic/Constitutive).

  **Matrix:** **CONFLICT** (Harm Fail / Cohesion Pass).
  **Tie-Breaker Application:** Default to **AGAINST Criminalization**.
  **Annotation:** Flag as Legislative Value Choice.

  **Recommendation:** **Decriminalize with Strict Regulation.**
  *Reasoning:* The harm is primarily to the self (which Track 1 excludes). The cohesion threat is real (sanctity of life), but criminalization drives the practice underground, increasing the Net Harm (Misfire #3).
  **Residual Disagreement:** The procedure treats death as a private choice. It fails to account for the normative claim that life is not disposable.
  **Misfire Flag:** **Net Harm Misfire.** Criminalization creates more danger (botched suicides) than it prevents.

  ### CASE 3: Public Desecration of National Flag
  **Conduct:** Burning a flag in a public square as political protest.

  **Track 1: Harm Screen**
  1.  *Non-Consenting Parties?* No.
  2.  *Tangible Injury?* No (Property is the actor's or abandoned).
  3.  *Public Order?* No (Unless it incites immediate violence).
  4.  *Systemic Risk?* No.
  *   **Result:** **FAIL** (No Secular Harm; purely offensive).

  **Track 2: Cohesion Screen**
  1.  *Intensity of Feeling?* Yes (High indignation).
  2.  *Realism of Threat?* No (Patriots vs. Protesters).
  3.  *Disintegration Evidence?* No (History shows tolerance does not collapse the state).
  4.  *Constitutive Value?* **YES** (The flag represents the state's authority and unity).
  *   **Result:** **PASS** (Solely on Constitutive Value).

  **Matrix:** **CONFLICT** (Harm Fail / Cohesion Pass).
  **Tie-Breaker Application:** Exception Clause for Constitutive Value.
  **Action:** **HAND-OFF TO LEGISLATURE.**

  **Recommendation:** **No Recommendation (Value Choice).**
  *Reasoning:* This is not a question of harm or general morality. It is a question of whether the State has the power to protect its own symbols from contempt. The Procedure cannot adjudicate the symbolic foundations of the polity.
  **Residual Disagreement:** Is the flag a piece of cloth (property) or the embodiment of the community (sacred)?
  **Misfire Flag:** **The Standing Misfire.** The Commission lacks the standing to decide if the community can legislate its own identity.

  ---

  ## PART VI: DIRECTOR'S SUMMARY OF PROCEDURE LIMITS

  This procedure is designed to protect the Commission from producing recommendations that are legally indefensible. However, you must be aware of where it will misfire:

  1.  **The "Harmless Immorality" Problem:** As seen in the Incest case, the procedure will recommend against criminalizing conduct that is universally reviled. This is the cost of the Tie-Breaker. If you want to recommend criminalization here, you must argue that the *definition* of Harm in Track 1 is too narrow (e.g., argue that genetic risk is never fully zero, or that family roles are public goods).
  2.  **The "Speculative Harm" Problem:** In the Assisted Suicide case, we relied on "Systemic Risk" to pass the Cohesion screen, but failed the Harm screen. If we tighten the Harm screen to include "risk of future abuse," we criminalize too much. If we loosen it, we endanger the vulnerable. The procedure forces this tension into the open rather than hiding it.
  3.  **The "Constitutive" Loophole:** The Flag Desecration Hand-Off admits that some questions are not about harm or cohesion, but about *power*. The procedure cannot solve this; it can only identify it.

  **Final Instruction to Staff:** When running these screens, do not fudge the answers to get a politically palatable result. If the Harm Screen fails, it fails. Our credibility rests on the consistency of the procedure, not the popularity of the outcome. If the Legislature rejects a "Against" recommendation based on this procedure, that is their prerogative as the moral voice of the state. Our role is to ensure they know the cost of that choice.
