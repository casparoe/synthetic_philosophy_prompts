  ### Part 5: Facilitator's Cheat Sheet (The "Honest Dampener")

  You mentioned one honest dampener: **Termination.**
  *   If the "Shutdown" card is drawn, Project C becomes worthless.
  *   In the debrief, emphasize this. "The Simulation Argument only dampens fanaticism if it implies *early termination*. If the simulation is long and stable, the stakes remain high."
  *   This distinguishes between **Ontological Damping** (It's not real) and **Temporal Damping** (It won't last). The game shows Ontological Damping is weak; Temporal Damping is the real killer.

  ### Final Check on Numbers
  *   **A:** 3 EV
  *   **B:** 30 EV
  *   **C:** 10,000 EV
  *   **D:** 1,000,000 EV (Conditional)
  *   **Ratio:** D is 100x C.
  *   **Verdict:** This is high enough to tempt, low enough to fear the "Fixed Past" loss. If you feel the room is too math-literate, lower D to $10^8$ (equal to C) to make the Decision Theory conflict the *only* differentiator. But $10^9$ is better for energy.

  **One last warning:** Students may try to "signal" to the Oracle. They might say "We are choosing D because we know you predicted it!"
  *   **Response:** "The prediction was made on the *disposition* of your team, not your verbal claims. Your allocation is the only signal that counts." (This reinforces the EDT link).

  This structure keeps the math in the background, forces the philosophical conflict into the foreground, and saves the terminology for the moment it lands hardest.
