      *   **Facilitator Role:** Crucial. Must not explain the philosophy until the end. Must enforce the "Oracle" rules for Project D.

  4.  **Refining Project D (The Hardest Part):**
      *   The prompt says: "only in sims whose runners booted them precisely because they end up making that allocation, so the simulators made the call long before anyone here touched a token."
      *   This is a *logical* dependency, not causal.
      *   To make this land: The Facilitator needs to hold the "Prediction Envelopes."
      *   *Mechanic:* Before Round 3 starts, the Facilitator has already written down "Team X: Predicted Yes/No" based on their Round 1 & 2 behavior? No, that's fake.
      *   *Better:* The rule is: "Project D pays out IF AND ONLY IF your team's allocation strategy matches the profile the Simulators were looking for."
      *   *The Kicker:* The Facilitator reveals *after* the choice that the profile was "Teams that prioritize D over C." But if they prioritized D *because* of the payout, does that count?
      *   *Actually, keep it simpler for a 90 min class:* Use the standard Newcomb framing. "The Simulators predicted your choice. If they predicted you would invest >=30 in D, the pot is full. If not, it's empty. Your choice cannot change the prediction, but it correlates with it."
      *   *To ensure the fight:* Make the EV of D *uncertain* based on decision theory. CDT says EV=0 (prediction fixed). EDT says EV=High.
      *   *Wait, one more thing:* The prompt says "credence is not independent of the choice."
      *   *Implementation:* Give them a card that says: "Project D is available. Payout: 10^11. Condition: Simulators predicted >=30 token investment. Historical accuracy of prediction: 99%."
      *   *The Conflict:* If I invest, am I proving I was predicted? Or am I throwing away tokens on a fixed past event?

  5.  **Addressing Specific Prompt Requirements:**
      *   "Tell me what predictably goes wrong." -> Need a specific section on this.
      *   "If the numbers are bad... say so." -> I will validate the numbers.
      *   "Which feature... the game can't reproduce." -> The metaphysical weight of "realness." The game treats "Sim" as just a probability modifier. The *qualitative* shift of ontological status is hard to gamify.
      *   "Debrief... mapped to specific moments." -> Need a script for this.

  6.  **Final Polish of the Design:**
      *   **Teams:** 4 Teams (3, 3, 4, 4).
      *   **Tokens:** 100 per team.
      *   **Round 1:** A, B, C. (Establishes EV maximization).
      *   **Round 2:** Evidence Cards. (Tests robustness of C).
      *   **Round 3:** Project D. (Tests Decision Theory).
      *   **Resolution:** Roll dice/cards to resolve A, B, C. D is resolved by the "Oracle" (Facilitator's pre-determined logic or a philosophical coin flip).
      *   *Correction on D Resolution:* If we actually roll for D, it validates CDT (the tokens didn't change the past). If we resolve D based on their *choice*, it validates EDT.
      *   *Best Pedagogical Move:* Do not resolve D numerically. Resolve the *debate*. The "Payout" is the quality of the argument in the debrief. Or, use a "Simulator's Verdict" card that is ambiguous.
      *   *Actually:* The prompt says "I'd rather they spend the last twenty minutes on that fight than on the token arithmetic." So the *resolution* of D should be secondary to the *choice*.
      *   *Decision:* I will recommend *not* resolving D with a dice roll. The "Payout" is revealed in the debrief as dependent on their justification. This keeps the focus on the decision theory conflict.

  7.  **Structure of the Response:**
      *   **Verdict on Design:** Validate the core insight, tweak the numbers for salience.
      *   **Failure Modes:** Predict the 3-4 biggest risks.
      *   **The Game Kit:** Rules, Boards, Cards, Worksheets.
      *   **Facilitation Script:** Minute-by-minute flow.
