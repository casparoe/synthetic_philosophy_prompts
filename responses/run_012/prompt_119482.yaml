prompt: |-
  I'm running a 90-minute session for an upper-level seminar, 14 students, all of them fine with expected value and shaky on anything past it, and I want a game about whether the simulation argument actually takes the wind out of fanaticism about the far future or just changes the address the fanaticism gets mailed to. If I explain it they'll nod at the three horns and walk out with the same intuitions they came in with, so I want the rules to do the work. I dont want them to hear the word fanaticism until the debrief. If you think a different structure gets there better, say so, but then build the thing out properly.

  Here's my shape. Teams of three or four, each team is steward of a civilization holding 100 tokens to split across projects on a board. Everything pays out in the same unit, doesn't matter what we call it.

  Project A: 3 units per token, certain.
  Project B: 300 units per token, one chance in ten.
  Project C: 100 million units per token, one chance in ten thousand.

  The arithmetic is supposed to put the whole room on C, 10,000 per token against 30 and 3, and the first thing they should feel is that four orders of magnitude of probability is nothing next to seven of stake, and that they all just did the same obviously absurd thing.

  Then a second phase, dealing evidence cards one at a time, each one forcing a minute of reallocation. Cards like: your civilization may itself be inside an ancestor simulation. The simulators may have no interest in what happens in it. Sims may be numerous enough that what you do here is a rounding error in the real ledger. Sims may be shut down early. Minds inside a sim may count exactly as much as any other mind if substrate doesn't matter.

  What I want them to trip over is that round one is nearly immune to all of it. Scaling C's payoff by the chance the world is real flips nothing until that chance drops under about one in three hundred, and the simulation argument as it's usually given doesn't hand you a probability anyway, it hands you a disjunction, and one horn of that disjunction leaves the far future exactly where it was. So the naive expectation is that the sim argument dampens fanaticism and the game should make them find that it mostly relocates it. Substrate-independence should cut the other way too, and I want that noticed in the room: if sim minds count, the ledger gets bigger, not smaller.

  Then the twist I actually care about. Add Project D. D pays 10^11 per token, but only for civilizations that put at least 30 tokens into it, and only in sims whose runners booted them precisely because they end up making that allocation, so the simulators made the call long before anyone here touched a token. Give them a credence of about 10^-3 conditional on the sim hypothesis being live, and zero otherwise. So the naive expected value of D is 10^8 per token and crushes everything, but the credence is not independent of the choice and the payoff isn't caused by the choice either, and now the room has to fight about whether your allocation is a reason or only evidence, and whether D is worth taking under a causal decision theory or only under an evidential one. That's where the sim argument stops diluting and starts adding stakes, and I'd rather they spend the last twenty minutes on that fight than on the token arithmetic. I'm alot more interested in the argument they have about D than in the allocation they settle on.

  Mechanics, roughly: physical tokens on a board, one shared draw at the end so the whole room's fate is correlated (two 100-card decks for C, one black card in each, you need both), a worksheet with the multiplication written out so nobody gets lost in the zeros, evidence cards dealt one per round. Debrief 20 to 25 minutes, mapped to specific moments rather than to ideas in the abstract: the reallocation where someone realises a single token on A is pure waste; the round where the sim card lands and the numbers barely move; the moment someone spots that substrate-independence pushes the other way; and D, where the credence and the choice are entangled. The one honest dampener I want them to find on their own is termination, because that's a hit to how long the future lasts rather than to whether it's real, and those come apart.

  Tell me what predictably goes wrong the first time I run it (my bet is the trilemma collapsing into one probability, and one team trying to arbitrage the token arithmetic instead of arguing about the concept), how to handle each, and which feature of the actual idea the game can't reproduce so I know what I have to supply from the front of the room. And if the numbers are bad, if C should be more extreme, or D's threshold lower so more teams cross it and the choice-dependence actually gets exercised, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested game design and facilitation guide:

  1.  **Analyze the Request:**

      *   **Goal:** Run a 90-minute seminar session (14 students, upper-level) on the Simulation Argument (SA) and its relationship to Longtermism/Far-Future Fanaticism.
      *   **Core Insight:** The SA doesn't necessarily reduce the expected value of far-future interventions; it often just relocates *where* the value is (inside vs. outside the sim) or adds new stakes (Project D).
      *   **Constraint:** Do not use the word "fanaticism" until the debrief. Let the rules drive the intuition.
      *   **Structure:**
          *   Teams of 3-4 (so ~4 teams).
          *   100 tokens to allocate.
          *   Projects A (safe), B (medium risk), C (extreme risk/reward).
          *   Phase 1: Allocation based on EV.
          *   Phase 2: Evidence cards (SA horns) force reallocation.
          *   Phase 3: Project D (Newcomb-like/EDT vs. CDT problem).
          *   Debrief: 20-25 mins, mapping specific game moments to philosophical concepts.
      *   **Specific Concerns:** Numbers might be off, trilemma might collapse into a single probability, teams might game the math instead of the concept, D needs to trigger the EDT/CDT conflict effectively.
      *   **Task:** Critique the design, fix the numbers/mechanics, predict failure modes, and provide a full facilitation guide.

  2.  **Critique & Refine the Mechanics:**

      *   **Team Size:** 14 students. Teams of 3-4 means 3 teams of 4 and 1 team of 2, or 4 teams (3, 3, 4, 4). Let's aim for 4 teams of 3-4. 4 teams works best for comparison. (3+3+4+4 = 14).
      *   **Projects A, B, C (Phase 1):**
          *   A: 3x certain. EV = 3.
          *   B: 300x, 1/10. EV = 30.
          *   C: 100M (10^8), 1/10,000 (10^-4). EV = 10,000.
          *   *Critique:* The EV gap is massive (3 vs 30 vs 10,000). Rational EV maximizers *must* pick C. This is good. It forces the "absurd" choice.
          *   *Risk:* Students might think "1 in 10,000 is basically zero." Need to ensure they trust the math. The prompt suggests a worksheet.
          *   *Correlation:* The prompt suggests "one shared draw at the end... two 100-card decks for C, one black card in each, you need both." Wait, 1/10,000 probability needs to be clear. If it's a shared draw, everyone wins or loses together. This creates a "common fate" which is good for seminar dynamics.
          *   *Refinement:* Keep the EV math stark. 10^8 * 10^-4 = 10^4. Yes.
      *   **Phase 2 (Evidence Cards):**
          *   The prompt says: "Scaling C's payoff by the chance the world is real flips nothing until that chance drops under about one in three hundred."
          *   *Mechanic:* If the world is a sim, does Project C pay out?
          *   *Horn 1 (Extinction):* Sim shuts down. C pays 0.
          *   *Horn 2 (Posthuman disinterest):* Simulators don't care. C pays 0 (or reduced).
          *   *Horn 3 (We are Posthuman):* C pays out normally (maybe even more if substrate independent).
          *   *Problem:* If the probability of "We are in a sim" is high (say 90%), but Horn 3 is 1/3 of that, then 30% chance C works. EV is still 3,000. Still beats A (3).
          *   *Fix:* The cards need to represent *updates* to the probability of C paying out.
          *   *Key Insight from Prompt:* "Simulation argument as it's usually given doesn't hand you a probability anyway, it hands you a disjunction." The game needs to force them to assign probabilities to the horns to see that EV remains high.
      *   **Phase 3 (Project D):**
          *   Payoff: 10^11 per token.
          *   Condition: Must invest >= 30 tokens.
          *   Catch: Payoff only happens if Simulators *predicted* you would invest >= 30 tokens. (Newcomb's Problem / Parfit's Hitchhiker structure).
          *   Probability: 10^-3 conditional on Sim.
          *   EV Calculation: If Sim Prob = 0.5. P(Predict & Pay) = 0.5 * 10^-3 = 5*10^-4. Payoff = 10^11. EV = 5*10^7.
          *   Comparison: C was EV 10,000 (assuming real). If Sim Prob is high, D dominates C.
          *   *Conflict:* CDT says "My choice doesn't cause the prediction." EDT says "My choice is evidence of the prediction."
          *   *Threshold:* 30 tokens is high. If a team put 100 on C in Round 1, they have 0 left for D unless they reallocate. This forces the trade-off.
          *   *Refinement:* Make sure D is *only* available in Round 3. Make the threshold clear.

      *   **Numbers Check:**
          *   A: EV 3.
          *   B: EV 30.
          *   C: EV 10,000.
          *   D: Payoff 100 Billion (10^11). Prob 1/1000 (given Sim).
          *   If P(Sim) = 20% (conservative). P(D pays) = 0.0002. EV = 20,000,000.
          *   D crushes C.
          *   *Issue:* If D crushes C too hard, they ignore the CDT/EDT nuance and just pick D.
          *   *Fix:* The "Prediction" aspect needs to be emphasized. If they choose D *because* of the EV, did the Simulators predict that? Or did they predict "fanatical commitment"?
          *   *Better Mechanic for D:* The payout depends on whether the *Simulator* predicted you would choose D. If you choose D *calculatingly*, maybe you aren't the type they predicted? No, that's too meta.
          *   *Standard Newcomb:* Box A (transparent, small) vs Box B (opaque, large if predicted).
          *   *Adaptation:* Project D is Box B. You can only pick D if you commit 30 tokens. The payout exists *if and only if* the Simulators predicted you would commit 30 tokens.
          *   *The Twist:* If you are a CDT agent, you say "The prediction is already made. Putting tokens in now doesn't change the past. D is a waste." If you are EDT, you say "Putting tokens in makes it likely the prediction was positive."
          *   *Calibration:* To make the fight real, D's EV needs to be comparable to C's *adjusted* EV, or high enough to tempt but risky enough to debate. Let's keep D's EV high but make the *logic* the battleground.

      *   **Predictable Failures:**
          1.  **Math Anxiety/Focus:** Students get bogged down in calculating zeros. *Fix:* Provide calculators or pre-filled EV sheets.
          2.  **Collapsing the Trilemma:** They assign P(Sim) = 50%, P(Real) = 50%. They ignore the 3 horns. *Fix:* The Evidence Cards must force specific horn probabilities.
          3.  **Gaming D:** They treat D as just another lottery ticket. *Fix:* The Facilitator must act as the "Simulator's Oracle" during the D reveal.
          4.  **Time:** 90 mins is tight. 4 teams, 3 rounds, debrief. Needs strict timing.

  3.  **Drafting the Plan:**

      *   **Title:** "The Ledger Protocol" (Sounds neutral, bureaucratic).
      *   **Materials:** Tokens, Boards, EV Worksheets, Evidence Deck, D-Cards.
      *   **Timing:**
          *   Intro/Rules (10m)
