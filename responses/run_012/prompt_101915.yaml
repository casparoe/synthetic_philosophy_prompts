answer: |-
  There is no single, canonical term in social choice theory or political philosophy that captures *exactly* this phenomenon in the way you have described it. You have identified a subtle but critical variation on a well-known problem.

  The parent concept is the **Discursive Dilemma** (also known as the **Doctrinal Paradox**), formalized by Philip Pettit and Christian List. However, the standard Discursive Dilemma assumes that the propositions being voted on have fixed, stable meanings across the aggregation process. Your observation identifies a scenario where the *individuation* of the issues is unstable: the semantic content of a proposition shifts depending on the other propositions on the ballot, even if the wording remains identical.

  Since there is no established name for this specific semantic instability, I will coin the term **The Paradox of Semantic Drift** (or, more formally, **The Problem of Endogenous Issue Semantics**).

  Below is the "carving" you requested: a precise definition, a distinction from nearest neighbors, and an account of its boundaries.

  ---

  ### 1. The Name and Definition

  **Term:** **The Paradox of Semantic Drift** (within Collective Decision-Making)

  **Definition:**
  The Paradox of Semantic Drift occurs when a collective body votes on a set of propositions $\{P_1, P_2, ... P_n\}$ that are logically or practically connected, such that:
  1.  **Lexical Stability:** The wording of each proposition remains constant across the voting process.
  2.  **Semantic Instability:** The truth conditions or practical meaning of a proposition $P_i$ are partially constituted by the context of the other propositions $\{P_j\}$ under consideration.
  3.  **Apparent Inconsistency:** The aggregation of individual votes yields a set of majority verdicts that appear collectively inconsistent (e.g., affirming premises that logically imply a conclusion the group rejects), *not* because individuals are inconsistent, and *not* because the logic is fixed and aggregation failed, but because the majority affirmed $P_1$ under interpretation $A$ and $P_2$ under interpretation $B$, where $A$ and $B$ are mutually incompatible.

  In short: The group does not vote inconsistently on a fixed set of facts; rather, the group votes consistently on a *shifting* set of facts while pretending they are fixed.

  ### 2. The Parent Concept: The Discursive Dilemma

  To understand why this is distinct, we must look at the **Discursive Dilemma**.
  *   **The Setup:** A group votes on premises $P$ and $Q$, and a conclusion $C$ (where $P \land Q \to C$).
  *   **The Paradox:** A majority accepts $P$, a majority accepts $Q$, but a majority rejects $C$.
  *   **The Assumption:** The meaning of $P$, $Q$, and $C$ is fixed and common knowledge. "Scientifically Sound" means the exact same thing in the premise vote as it does in the conclusion vote.
  *   **The Failure:** The failure is in the *aggregation rule* (premise-based vs. conclusion-based voting).

  **How Your Case Differs:**
  In your funding panel example, the failure is not in the aggregation rule but in the **ontology of the issues**.
  *   In the Discursive Dilemma, the group affirms $P$ and $Q$ but denies $C$. This is a logical contradiction *if* meanings are fixed.
  *   In the Paradox of Semantic Drift, the group affirms $P_{\text{context1}}$ and $Q_{\text{context2}}$. There is no logical contradiction because $P_{\text{context1}} \land Q_{\text{context2}}$ does not necessarily imply $C$. The contradiction is only *lexical*, not logical. The group is misled by the stable wording into thinking they have decided a coherent package when they have actually decided two different things.

  ### 3. Distinction from Nearest Concepts

  Here is how the Paradox of Semantic Drift carves out its own space against related phenomena:

  #### A. vs. Non-Separable Preferences
  *   **Concept:** In social choice, preferences are "non-separable" if my preference on Issue A depends on the outcome of Issue B (e.g., I want a swimming pool only if the tax rate is low).
  *   **Difference:** Non-separability concerns **preferences over outcomes**. The Paradox of Semantic Drift concerns **the meaning of the questions**.
  *   **Boundary:** If a member votes "No" on funding because the method is sound but too slow, that is non-separable preference. If a member votes "Yes" on "Soundness" meaning "Methodologically respectable" but the committee records it as "Yes" meaning "Will produce quick results," that is Semantic Drift.

  #### B. vs. Framing Effects
  *   **Concept:** Framing effects (Tversky & Kahneman) occur when the *presentation* of the same information (e.g., "90% survival" vs. "10% mortality") alters decisions.
  *   **Difference:** Framing is psychological and rhetorical. Semantic Drift is structural and constitutive. In Framing, the underlying reality is the same, but the description changes. In Semantic Drift, the description stays the same, but the underlying reality (the truth conditions) changes based on the ballot structure.
  *   **Boundary:** If the chair says, "Think of soundness as speed," that is Framing. If the chair says nothing, but the mere presence of a "Three-Year Limit" vote implicitly redefines "Soundness" in the minds of voters without explicit instruction, that is Semantic Drift.

  #### C. vs. Agenda Setting / Path Dependence
  *   **Concept:** The order in which votes are taken determines the outcome (e.g., voting on A then B yields a different result than B then A).
  *   **Difference:** Agenda setting is about **sequence**. Semantic Drift can occur even in simultaneous voting. It is about the **simultaneous presence** of issues altering their mutual definitions.
  *   **Boundary:** If voting on "Teaching Load" *before* "Research Potential" changes the result, that is Agenda Setting. If voting on them *together* causes "Research Potential" to be interpreted as "Potential given the Load," that is Semantic Drift.

  #### D. vs. Unbundling / Logrolling
  *   **Concept:** Unbundling is voting on issues separately rather than as a package. Logrolling is trading votes across issues.
  *   **Difference:** Unbundling assumes the issues *can* be separated. Semantic Drift argues they *cannot* be separated without altering their nature. Logrolling is a strategic behavior by agents; Semantic Drift is a structural feature of the proposition space.
  *   **Boundary:** If I vote for your bad project so you vote for mine, that is Logrolling. If I vote for your project because "Good" means "Good for my department" in this context, but "Good" means "Good for the university" in another, that is Semantic Drift.

  ### 4. Boundary Cases and Edge Conditions

  To ensure the concept is robust, we must identify where it begins and ends.

  **Case 1: The Clear Boundary (Standard Discursive Dilemma)**
  *   *Scenario:* A court votes on whether a defendant breached a contract ($P$), whether damages occurred ($Q$), and whether they are liable ($C$).
  *   *Verdict:* If "Breach" means the exact same legal standard in the premise vote and the liability vote, this is **not** Semantic Drift. It is a standard Discursive Dilemma. The inconsistency is real, not semantic.

  **Case 2: The Clear Boundary (Ambiguity)**
  *   *Scenario:* A group votes on "Is the bank nearby?" without defining "nearby."
  *   *Verdict:* This is simple **Ambiguity** or **Vagueness**. Semantic Drift requires that the meaning shifts *systematically* due to the presence of *other specific propositions* on the ballot, not just general vagueness. The context must be the *other votes*.

  **Case 3: The Core Case (Semantic Drift)**
  *   *Scenario:* A committee votes on "Is the candidate qualified?" and "Is the salary range appropriate?"
  *   *Mechanism:* "Qualified" means "Can do the job at the current salary" when voted alongside the salary question, but "Has high potential" when voted alone.
  *   *Verdict:* This **is** Semantic Drift. The proposition "Qualified" is endogenous to the ballot structure.

  ### 5. Why This Distinction Matters

  Identifying this as **The Paradox of Semantic Drift** rather than just another aggregation failure changes the remedy.

  1.  **Remedy for Discursive Dilemma:** Change the aggregation rule (e.g., vote only on the conclusion, or use a premise-based procedure with consistency constraints).
  2.  **Remedy for Semantic Drift:** Change the **individuation of the issues**. You cannot fix this by changing how you count votes. You must change *what* you are voting on.
      *   *Solution:* You must bundle the shifting propositions into a single question (e.g., "Is the project sound *given* the three-year constraint?") or explicitly define the terms conditionally before voting.

  ### Summary

  You have identified a gap in the standard modeling of collective choice. Standard models treat propositions as atomic and stable (like coins to be flipped). You have observed that propositions in deliberative bodies are often **holistic and context-dependent** (like words in a sentence).

  While it sits under the broad umbrella of the **Discursive Dilemma**, the specific mechanism is distinct enough to warrant the label **The Paradox of Semantic Drift**. It marks the point where the *language of the ballot* fails to track the *logic of the decision*, creating a collective inconsistency that is actually a linguistic illusion.

  **The Carving:**
  *   **Genus:** Collective Decision Paradoxes.
  *   **Species:** Aggregation Paradoxes (like Discursive Dilemma).
  *   **Differentia:** The inconsistency arises from **Endogenous Issue Semantics** (meaning shifts due to ballot context) rather than **Exogenous Aggregation Failure** (logic holds, but math fails).

  This phenomenon explains why committees often feel they have made a "compromise" when they have actually made a **category error**. They believe they have affirmed $A$ and $B$, but they have actually affirmed $A_{\text{context1}}$ and $B_{\text{context2}}$, rendering the collective decision incoherent not in logic, but in description.
