answer: |-
  **Examination Question**

  Jaspers argues that political guilt attaches to every citizen simply by virtue of membership in the political community, whereas moral guilt attaches only to an individual before their own conscience. Consider a person born after a criminal regime's collapse, who committed no acts, could not have dissented, yet inherits wealth derived from that regime's crimes.

  Using the four disambiguations of "collective" discussed in class (distributed guilt, joint guilt, group agency, and liability without guilt), analyze where this person fits within Jaspers's framework. Does this case expose a strain in his asymmetry between political and moral guilt? Decide whether this person falls under one of the four categories, whether the framework requires a fifth category, and whether the phrase "responsibility without guilt" names a stable position or merely smuggles desert back in under another name.

  ***

  **Model Answer**

  Jaspers's framework relies on a sharp asymmetry: political guilt is automatic, arising from citizenship and the benefits of the state, while moral guilt requires individual agency and introspection. The case of the post-war inheritor tests the limits of this distinction. This person is a citizen of the successor state and benefits from past wrongs, yet lacks the agency required for moral culpability. To locate them, we must apply the four disambiguations of the "collective."

  The inheritor cannot bear distributed guilt, as they did not commit the wrongful acts themselves; guilt cannot be spread to those who did not participate. Nor is this joint guilt, as the wrong was not something that required the inheritor's cooperation to occur. Attributing guilt to the group as a single agent also fails, because the inheritor was not part of the agent at the time of the action. This leaves the fourth category: collective liability without guilt. This fits best. The inheritor holds an obligation to make repair or bear costs, not because they are blameworthy, but because they hold assets tainted by injustice.

  However, placing the inheritor here strains Jaspers's asymmetry. Jaspers assigns political guilt to all citizens for the deeds of their state, implying a burden of responsibility. For the contemporary citizen living through the regime, political guilt is a call to political action. For the inheritor born after, "political guilt" loses its forward-looking political force and becomes a backward-looking debt. If we categorize this as political guilt, we stretch the concept to cover people who had no voice in the polity that committed the crime. If we categorize it as moral guilt, we violate the requirement of agency.

  Does this require a fifth category? A fifth category is only necessary if we insist that all responsibility must be grounded in either agency or strict citizenship. However, the category of "liability without guilt" is sufficient if we clarify its basis. It is not a new kind of guilt, but a distinct kind of obligation grounded in unjust enrichment rather than wrongdoing. The inheritor is not responsible *for* the crime, but responsible *for the cleanup*. Adding a fifth category risks re-moralizing what should remain a structural obligation.

  This leads to the stability of the phrase "responsibility without guilt." This position is stable only if we rigorously separate responsibility as "obligation to repair" from responsibility as "blameworthiness." If responsibility implies that the agent *should have done otherwise*, then applying it to the inheritor is incoherent; they could not have done otherwise. In that case, the phrase smuggles desert back in by suggesting the inheritor deserves blame for a situation they did not create.

  However, if responsibility is defined purely forward-looking—as the duty to rectify an unjust situation one finds oneself in—then the phrase is stable. The inheritor has a duty not because they are bad, but because the situation is unjust and they are the current beneficiaries. The strain in Jaspers's account arises because he conflates the civic duty to repair the state (political) with the existential duty to cleanse one's soul (moral). The inheritor has the former but not the latter.

  Ultimately, the inheritor falls under liability without guilt. To call it anything else either lets the beneficiary off the hook entirely or falsely condemns them for history they did not make. The framework does not need a fifth category of guilt, but it does require a clear distinction between guilt (backward-looking blame) and liability (forward-looking repair). If we maintain that distinction, "responsibility without guilt" is not a contradiction, but a necessary tool for intergenerational justice. If we fail to maintain it, we collapse into a vague sense of inherited sin that Jaspers rightly sought to avoid.

  ***

  **Marking Scheme (Out of 20)**

  | Move | Marks | Characteristic Mistake (Loss of Marks) |
  | :--- | :---: | :--- |
  | **1. Explain Jaspers's Asymmetry**<br>Correctly identifies political guilt as membership-based/automatic and moral guilt as agency/conscience-based. | 4 | **Reciting the Taxonomy:** Student lists the four *types* of guilt (criminal, political, moral, metaphysical) instead of explaining the *asymmetry* between political and moral grounding. |
  | **2. Apply the Four Disambiguations**<br>Systematically tests the inheritor against distributed, joint, group agent, and liability. | 4 | **Conflation:** Student treats "collective guilt" as a single concept or fails to rule out the first three categories (distributed/joint/agent) with specific reasons. |
  | **3. Identify the Correct Category**<br>Concludes the case fits "liability without guilt" (or argues convincingly for another). | 4 | **Category Error:** Student assigns "moral guilt" to the inheritor (violating agency) or "political guilt" without addressing the lack of membership at the time of the crime. |
  | **4. Analyze the Fifth Category**<br>Decides yes/no on a fifth category and justifies the decision based on the sufficiency of "liability." | 4 | **Hand-waving:** Student claims a fifth category is needed but cannot define what it adds beyond "liability," or says it isn't needed without explaining why liability suffices. |
  | **5. Evaluate "Responsibility without Guilt"**<br>Determines if the phrase is stable or smuggles in desert, based on the definition of responsibility (forward vs. backward-looking). | 4 | **Binary Thinking:** Student asserts the phrase is either "obviously true" or "obviously false" without analyzing the definition of responsibility (blame vs. repair). |

  **The A vs. B Separator**

  The single move that most reliably separates an A from a B is **Move 5 (Evaluate "Responsibility without Guilt")**.

  *   **B Grade:** The student argues that "responsibility without guilt" is stable simply because it feels right, or unstable because it feels unfair. They treat "responsibility" as a monolithic concept.
  *   **A Grade:** The student recognizes that the stability of the phrase depends entirely on decoupling *responsibility-as-blame* (backward-looking) from *responsibility-as-obligation* (forward-looking). They identify that "smuggling desert" occurs only if we conflate these two definitions. This demonstrates meta-ethical precision rather than just textual application.
