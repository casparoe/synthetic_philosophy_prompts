answer: |-
  **MEMORANDUM**

  **TO:** Cost-Benefit Analysis Unit
  **FROM:** Office Director
  **SUBJECT:** Standing Methodology Note 2024-01: Treatment of Long-Term Structural Uncertainty
  **EFFECTIVE:** Immediately

  ### 1. PURPOSE
  This note establishes the procedure for handling rules where consequences extend beyond the statutory thirty-year window or involve mechanisms (e.g., innovation pathways, institutional trust) that resist quantification. The authorizing statute requires a "best estimate of net benefits." When unmeasurable effects threaten to swamp measurable ones, analysts must distinguish between *parameter uncertainty* (unknown magnitude) and *structural uncertainty* (unknown sign). This procedure prevents the presentation of rhetoric as precision.

  ### 2. THE PROCEDURE

  **Step 1: Calculate Measurable Net Benefits (MNB)**
  Conduct the standard 30-year discounted cash flow analysis using established parameters.
  *   *Output:* A point estimate with confidence intervals (e.g., $500M ± $100M).
  *   *Constraint:* Include only effects with empirical grounding or widely accepted market proxies.

  **Step 2: The Cluelessness Test**
  Identify channels of impact excluded from Step 1 (e.g., R&D redirection, cultural shifts). For each channel, ask two questions in order:

  *   **Q1 (Sign Certainty):** Can we assign a direction (positive/negative) to this effect with >90% confidence based on historical precedent or economic theory?
      *   *If Yes:* Proceed to Q2.
      *   *If No:* **Flag as "Sign-Indeterminate."**
  *   **Q2 (Magnitude Potential):** Is there a plausible scenario where the discounted value of this effect exceeds the absolute value of the MNB from Step 1?
      *   *If Yes:* **Flag as "Potentially Swamping."**
      *   *If No:* Treat as negligible; proceed to Step 3.

  **Step 3: Classification**
  *   **Class A (Standard):** No Sign-Indeterminate or Potentially Swamping effects.
      *   *Action:* Report MNB as the Best Estimate.
  *   **Class B (Qualified):** Sign-Indeterminate effects exist but are not Potentially Swamping.
      *   *Action:* Report MNB as Best Estimate; append qualitative footnote detailing the unmeasured variance.
  *   **Class C (Structurally Indeterminate):** Sign-Indeterminate AND Potentially Swamping effects exist.
      *   *Action:* **Do not report MNB as Total Net Benefits.** Report MNB as "Partial Measurable Benefits." State clearly: *"Total Net Benefits are Indeterminate."*

  **Step 4: The Handoff (Class C Only)**
  For Class C rules, the analyst's task ends at the description of uncertainty. The analyst **must not** apply precautionary principles, risk aversion, or rights-based overrides. These are substantive value choices.
  *   *Analyst Deliverable:* A "Decision Memorandum" listing the measurable surplus/deficit and the specific mechanisms causing indeterminacy.
  *   *Commission Role:* The Commission must decide whether to regulate based on the MNB alone, apply a precautionary heuristic, or reject the rule. This choice must be recorded in the Commission's vote rationale.

  ### 3. APPLICATION TO CASE STUDIES

  Below is the procedure run on the three rules specified.

  #### Case 1: Mandatory Child-Resistant Packaging
  *   **Step 1 (MNB):** Compliance costs ($15M/yr) vs. Injury Reduction ($50M/yr). MNB = +$35M/yr.
  *   **Step 2 (Cluelessness Test):**
      *   *Channel:* Innovation/Behavioral adaptation.
      *   *Q1 (Sign):* **Yes.** Packaging does not alter technological trajectories. Sign is neutral/positive.
      *   *Q2 (Magnitude):* **No.** No mechanism exists for costs/benefits to compound beyond demographic changes.
  *   **Step 3 (Classification):** **Class A.**
  *   **Output:** Report +$35M/yr as Best Estimate.
  *   **Judgment Call Flag:** The assertion that "no mechanism exists" is a theoretical claim, not an empirical one. However, it relies on settled physical and market constraints. This is a low-risk judgment.

  #### Case 2: Industrial Chemical Disclosure
  *   **Step 1 (MNB):** Compliance costs ($100M/yr) vs. Immediate Health/Info Benefits ($40M/yr). MNB = -$60M/yr.
  *   **Step 2 (Cluelessness Test):**
      *   *Channel:* R&D Redirection.
      *   *Q1 (Sign):* **No.** Disclosure could spur safer substitutes (Positive) OR divert capital from productive R&D due to liability fear (Negative). Historical data on similar disclosure regimes is mixed.
      *   *Q2 (Magnitude):* **Yes.** A single substitute technology could generate billions in welfare or lock out a critical industry sector.
  *   **Step 3 (Classification):** **Class C (Structurally Indeterminate).**
  *   **Output:** Report -$60M/yr as "Partial Measurable Benefits." State: *"Total Net Benefits Indeterminate due to innovation channel."*
  *   **Judgment Call Flag:** Determining that the R&D effect is "Potentially Swamping" requires estimating the upper bound of innovation value. This is speculative. However, given the statutory requirement to consider *all* consequences, excluding a potentially billion-dollar channel is methodologically unsound. The indeterminacy finding is robust.
  *   **Commission Decision:** The Commission must now decide: Do we accept a measurable loss on the chance of an unmeasurable gain? This is a risk-tolerance choice, not an economic calculation.

  #### Case 3: Restriction on Advertising to Children
  *   **Step 1 (MNB):** Industry Revenue Loss ($500M/yr) vs. Parental Valuation of Reduced Nagging/Health ($200M/yr). MNB = -$300M/yr.
  *   **Step 2 (Cluelessness Test):**
      *   *Channel:* Cognitive Development / Institutional Trust.
      *   *Q1 (Sign):** **No.** Does advertising restriction protect autonomy (Positive) or reduce information access/media viability (Negative)? Literature is contested; sign is unknown.
      *   *Q2 (Magnitude):** **Yes.** Long-term shifts in consumer behavior or media ecosystems could dwarf annual revenue losses.
  *   **Step 3 (Classification):** **Class C (Structurally Indeterminate).**
  *   **Output:** Report -$300M/yr as "Partial Measurable Benefits." State: *"Total Net Benefits Indeterminate."*
  *   **Judgment Call Flag:** You noted a personal preference for this rule. The procedure blocks you from coding that preference into the analysis. By forcing the "Indeterminate" label, the procedure prevents you from claiming the rule is economically efficient when it is economically ambiguous.
  *   **Defense:** If you wish to proceed, you must argue to the Commission that *non-efficiency values* (e.g., paternalism, rights) justify the rule despite the negative measurable balance and unknown long-term effects. The procedure successfully isolates your preference from the analysis.

  ### 4. LIMITATIONS OF THE PROCEDURE

  1.  **It Does Not Solve the Decision:** For Class C rules, this procedure does not tell the government what to do. It only tells the government that economics cannot tell them what to do.
  2.  **It Relies on Analyst Honesty:** An analyst determined to reach a conclusion can manipulate the "Magnitude Potential" threshold (Step 2, Q2) by arguing an unmeasured effect is "negligible" without proof. Oversight audits must check this.
  3.  **It Creates Paralysis Risks:** If too many rules are Class C, the Commission may ignore the classification to avoid gridlock. This is a political risk, not a methodological one.

  ### 5. THE LARGER QUESTION

  **Is this difficulty a defect in our methods that better economics would fix, or is it a feature of the world?**

  It is a **feature of the world** that would afflict any decision procedure that cares about consequences.

  Better economics (more data, better models) can shrink the zone of *parameter uncertainty* (magnitude). It cannot eliminate *structural uncertainty* (sign) regarding complex adaptive systems like culture, innovation, or trust. We are predicting the shape of a future ecosystem based on interventions within that ecosystem. This is ontologically distinct from predicting the trajectory of a projectile.

  Furthermore, adopting a rights-based or deontological analysis would not solve this; it would merely shift the locus of cluelessness.
  *   **Consequentialism:** We do not know if the rule produces the *best outcome*.
  *   **Deontology:** We do not know if the rule violates a *constraint* (e.g., does disclosure violate property rights? Does ad restriction violate free speech?).

  In both frameworks, the future is opaque. The difference is that Consequentialism demands we quantify the opacity to sum it, while Deontology demands we categorize the opacity to judge it. Both require judgment calls where the world provides no answer.

  **Recommendation:** Adopt the procedure. It forces the Commission to own the value choices they are currently asking analysts to hide inside error bars.

  ***

  **Director's Note:** This procedure vindicates your suspicion. The distinction between not knowing magnitude and not knowing sign is the only stable line between "risky" and "clueless." Where the sign is unknown, aggregation is mathematically impossible. The procedure does not fix this; it exposes it.
