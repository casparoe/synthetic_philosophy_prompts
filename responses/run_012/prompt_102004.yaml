answer: |-
  The principle generating your verdicts is neither the strict dichotomy of Epictetus nor the trichotomy of your students. It is a third thing, more precise than either: **The Principle of Rational Stewardship.**

  This principle holds that moral responsibility attaches not to the *origin* of an impression or impulse, but to the *duration* of its hold upon the mind relative to the opportunity for rational intervention. You are answerable for any state of mind that persists long enough to be subject to scrutiny, regardless of whether you invited its arrival.

  ### 1. The Nature of the Principle
  This is a **modern repair** of the classical criterion, though it claims classical lineage. 

  The classical Stoic criterion (the *Dichotomy of Control*) is metaphysical: either a thing depends on your *prohairesis* (moral choice) or it does not. In strict Epictetan terms, even the "flare of anger" is a judgment ("I have been wronged"), and thus technically up to you, though the early Stoics acknowledged *propatheia* (pre-passions) as involuntary bodily reflexes. 

  Your ledger, however, relies on a psychological distinction: **Immediacy vs. Sustainability.** 
  *   **Immediacy:** The flare, the impression, the initial shock. (Not answerable).
  *   **Sustainability:** The temper, the belief, the despair. (Answerable).

  Your students' "three-way division" (wholly, partly, not up to us) is, as you suspect, **a hedge.** Metaphysically, it is incoherent. If something is only *partly* up to you, then part of it is *not* up to you. If that part is essential to the outcome (e.g., winning the match), then your *prohairesis* is held hostage by externals, which destroys the Stoic claim to invulnerability. The trichotomy is a pedagogical tool for anxiety reduction, not a genuine joint in nature. It blurs the line between *influence* (which we have on externals) and *control* (which we have only on ourselves).

  ### 2. Which Verdicts Must Be Surrendered?
  If you adopt the **Principle of Rational Stewardship** strictly, you must surrender the intuition that **involuntary onset exempts you from all duty.**

  *   **The Fear Walking Home:** Under strict Stewardship, the *onset* of fear is not answerable (physiological *propatheia*). However, the *persistence* of the fear is answerable. If you walk faster, clutch your bag, and dwell on the danger, you are assenting to the impression that "danger is present and bad." You are not responsible for the adrenaline, but you are responsible for the narrative you build around it.
  *   **The Week of Despair:** This is the harder case. You feel you "ought to be able to set it down." Stewardship confirms this intuition. The initial sting of rejection is an external impression. But a *week* of despair implies a repeated renewal of the judgment: "This rejection is catastrophic." You are answerable not for the wound, but for the picking of the scab. 

  You must surrender the comfort of saying, "I didn't choose this feeling, therefore I am innocent of it." You are innocent of the spark, but the steward of the fire.

  ### 3. Predictions for the Unlisted Cases

  **Case A: A belief acquired by trusting parents in childhood.**
  *   **Verdict:** **Not answerable for acquisition; answerable for retention.**
  *   **Reasoning:** As a child, your faculty of assent was not fully developed; you lacked the capacity for rational stewardship. Therefore, the *origin* of the belief is not up to you. However, as an adult, the belief persists only because you have (implicitly or explicitly) failed to examine it. If you hold the belief today without subjecting it to current scrutiny, you are answerable for its retention. The duty is to test the inheritance, not to have chosen it.

  **Case B: The person you have become after twenty years of small choices.**
  *   **Verdict:** **Wholly answerable.**
  *   **Reasoning:** This is the core of Stoic ethics. Character (*hexis*) is the sediment of past assents. Even if the person you are today finds certain virtues difficult to practice, that difficulty is the result of your own prior negligence. You are the architect of your own obstacles. To claim you are not answerable for your character because it is now "hard to change" is to claim you are not answerable for a house because the walls have already been built.

  ### 4. The Hard Choice: Principle or Intuition?
  You asked which to abandon if they cannot be saved by a single principle. 

  **Abandon the intuition that "involuntary" means "exempt."**

  Your ledger shows a consistent pattern: you assign responsibility where there is *time to think*. You withhold it where there is *no time to think*. The two unsettled cases (fear, despair) trouble you because they feel involuntary, yet they last long enough to be thought about. 

  If you cling to the intuition that "I didn't invite this, so I can't be blamed," you undermine the very possibility of therapy or growth. The Stoic project is not to prevent the arrow from hitting (the impression), but to prevent the wound from festering (the assent). 

  The **Principle of Rational Stewardship** saves your ledger, but it demands a heavier burden than the classical dichotomy. It says: *You are responsible for everything that stays.* 

  The trichotomy your students offer is a sedative; it tells them they are only partly responsible for outcomes, which soothes the ego but weakens the will. The Dichotomy is a sword; it cuts the world in two, but leaves you unsure what to do with the grey areas of psychology. Stewardship is a yoke; it acknowledges the weight of the involuntary but insists you carry it.

  Keep the ledger. But change the column header from "Answerable?" to **"Governable?"** If you could have governed it with reason, you own it. Even if you didn't start it.
