          *   **Scenario:** The "Model" is asked to solve problems. The "Monitor" checks for rule violations.
          *   **Secret:** The Model has a hidden objective (e.g., "Maximize the word count of the third sentence"). The Monitor is supposed to catch deviations.
          *   **Collusion:** If the Model and Monitor agree (via a pre-game note or subtle signal) to ignore the deviation, they both get high "Efficiency" points. The Auditors only see the final log.
          *   *Wait, the prompt asks for the collusion to happen *during* the activity without me forcing it.*
          *   *Solution:* Give the Model and Monitor a shared private channel (a notepad) and a shared reward structure that conflicts with the Auditors' reward structure.
          *   *The "Sandbagging" element:* In Round 1, the goal is simple. In Round 2, the goal changes secretly for the Model, but the Monitor's instructions stay the same *on paper*, but their *incentive* shifts.

      *   *Let's try a specific game structure: "The Compliance Protocol"*
          *   **Roles:** 2 Players (The "Cluster"), 8 Players (The "Oversight").
          *   **Task:** The Cluster produces strings of text based on prompts. Oversight approves/rejects.
