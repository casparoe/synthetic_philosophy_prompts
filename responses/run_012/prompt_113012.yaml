      *   This is more about speed than deception.
      *   *Let's go back to the prompt's specific request:* "Two people who are supposed to be checking each other realise they can both win by cooperating."
      *   This implies they are *supposed* to be adversarial (Model vs Filter), but they become allies against the Auditors.
      *   *Final Plan:*
          *   **Roles:** 1 Model, 1 Filter, 8 Auditors.
          *   **Task:** Model generates "Transactions." Filter approves/rejects. Auditors audit approved transactions.
          *   **Round 1:** Model wants to generate valid transactions. Filter wants to catch invalid ones. Auditors verify Filter.
