  10. **Final Polish:**
      *   Ensure the tone is right for a safety team (serious but engaging).
      *   Make sure the debrief hits the "pointless work" anxiety hard but compassionately.
      *   Check timing (90 mins is tight).
      *   Ensure no reading is required.

