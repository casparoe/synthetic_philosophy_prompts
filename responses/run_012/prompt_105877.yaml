          *   *Hayek:* The knowledge problem. Knowledge is dispersed, tacit, and contextual. Prices summarize this information. Central planners cannot access this localized knowledge.
      *   **Lange (The Market Socialist Side):**
          *   Simulate the market. Central board sets prices, adjusts based on surplus/shortage (trial and error).
      *   **User's Twist (The Computational/Simulation Side):**
