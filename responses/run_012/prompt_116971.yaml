answer: |-
  This is a sophisticated plan for a high school elective. You are aiming for a simulation of **Entitlement Failure** (though you won't use that term). Your intuition is correct: students need to feel the mechanics of the market, not just hear the theory.

  However, your plan has three significant vulnerabilities that could cause the lesson to fail in a 90-minute block: **complexity creep**, **student altruism**, and **time compression**. If the trading takes too long, you won't get to the debrief. If students share food "because it's the right thing to do," the simulation breaks. If the math is hard, they stop thinking about the system and start thinking about the calculator.

  Below is the refined design. I have simplified your numbers to base-5 and base-10 to eliminate calculation friction. I have added specific constraints to prevent altruism from masking the structural problem. I have also included the "Where your plan is wrong" section first, so you can adjust your mindset before reading the mechanics.

  ### Where Your Plan Is Wrong (And How to Fix It)

  1.  **Students are not rational actors; they are classmates.**
      *   *The Risk:* In District A, a Landlord student might see a Laborer student starving and give them grain for free. This solves the famine through kindness, proving your point wrong (i.e., "It wasn't the system, it was just that the other district was meaner").
      *   *The Fix:* **The Secret Rule.** Give every student a card with a private objective: "Survive 3 Rounds." Add a verbal rule: "All transactions must be recorded. Unrecorded gifts are illegal contraband. If the Officer finds unrecorded grain, it is confiscated." This makes hoarding/sharing a risk, not just a choice.

  2.  **Two simultaneous economies are too much noise for one teacher.**
      *   *The Risk:* You cannot referee two markets at once. Prices will drift, rules will be interpreted differently, and you will miss the moment a trader decides to export.
      *   *The Fix:* **Sequential or Centralized Trading.** Do not let them mill around. Run a "Market Call." Every round, you announce: "Market is Open for 5 minutes." You stand in the middle. Traders shout prices. You record them on the board. This keeps the pace brutal and fast.

  3.  **The "Outside Buyer" needs to be you.**
      *   *The Risk:* If a student plays the Buyer, they might negotiate or feel bad.
      *   *The Fix:* You are the **Imperial Procurement Agent**. You stand apart from both districts. You offer a fixed, high price for grain. You only talk to the Traders and Officers. This removes the "villain" from the student body and places the pressure in the rules.

  ---

  ### Activity Design: "The Harvest Protocol"

  **Time:** 90 Minutes
  **Students:** 20 (Split into District A and District B, 10 students each)
  **Materials:** Whiteboard, printed Role Cards (see below), paper slips for "Grain" and "Coins," markers.

  #### 1. The Numbers (Keep them on the Board)
  *   **Survival Need:** 10 Units of Grain per round.
  *   **Harvest:** 8 Units per person (Everyone is short 2 units immediately).
  *   **Starting Cash:** 20 Coins per person.
  *   **Grain Price:** Starts at 1 Coin/Unit. (Traders set this).
  *   **Wage:** 10 Coins per round (Paid by Landlords to Laborers).
  *   **Outside Buyer Offer:** 3 Coins/Unit (Unlimited purchase).

  #### 2. The Roles (10 per District)
  *Print these on cards. Each student gets one.*

  **District A (The Revenue District)**
  1.  **Officer:** *Goal:* Collect 50 Coins tax for the capital. *Power:* Can arrest hoarders. *Constraint:* Cannot spend money on food relief.
  2.  **Landlord 1 & 2:** *Start:* 40 Grain Units (in storage), 20 Coins. *Goal:* Maximize wealth. *Power:* Hire Laborers.
  3.  **Laborer 1, 2, 3, 4:** *Start:* 0 Grain, 20 Coins. *Goal:* Survive. *Power:* Sell labor for wages.
  4.  **Trader 1 & 2:** *Start:* 0 Grain, 50 Coins. *Goal:* Profit. *Power:* Move grain out of the district to the Outside Buyer.
  5.  **Artisan:** *Start:* 5 Grain, 20 Coins. *Goal:* Survive. *Power:* Makes tools. *Weakness:* Only gets paid if Landlords are hiring.

  **District B (The Relief District)**
  *Same roles, different Officer Card.*
  1.  **Officer:** *Goal:* Keep death toll under 2. *Power:* Has a Relief Budget of 100 Coins. *Constraint:* Must feed anyone who shows up with 0 income. Cannot export grain if locals are starving.
  2.  **Landlord 1 & 2:** *Same as District A.*
  3.  **Laborer 1, 2, 3, 4:** *Same as District A.*
  4.  **Trader 1 & 2:** *Same as District A.*
  5.  **Artisan:** *Same as District A.*

  #### 3. The Rules of Play
  1.  **Rounds:** There are 3 Rounds (Months). Each round represents 5 minutes of real time.
  2.  **Consumption:** At the end of every round, every student must hand in 10 Grain Units to the Teacher to "eat." If they cannot, they are marked **DECEASED** (sit down, no talking).
  3.  **Trading:**
      *   Laborers must find a Landlord to work for (to get 10 Coins wage).
      *   Everyone must buy Grain from Traders or Landlords.
      *   Traders can sell locally OR sell to the Teacher (Outside Buyer) at 3 Coins/Unit.
  4.  **Pricing:** Traders and Landlords set the local price. If demand is high, they can raise it.
  5.  **The Officer's Move:** At the start of Round 2 and 3, the Officer announces their policy (e.g., "Exports Allowed" or "Price Cap").

  #### 4. The 90-Minute Timeline

  *   **0:00 – 0:10 (Setup):** Distribute roles. Explain rules. **Do not explain the theory.** Just say: "Your goal is to survive. District Officers have different orders from the capital."
  *   **0:10 – 0:20 (Round 1 - Normalcy):** Harvest is distributed (8 units each). Students realize they are short 2 units. They trade to survive. Prices stay low (1 Coin). Everyone survives.
  *   **0:20 – 0:25 (The Shock):** Announce: "War has started. The Imperial Agent (Teacher) is buying grain for the front lines at 3 Coins/Unit. Harvest next round will drop to 5 Units."
  *   **0:25 – 0:35 (Round 2 - Crisis):**
      *   District A Officer focuses on Tax. Traders see the 3 Coin offer from you. Local price rises to 3 Coins to match. Laborers have 10 Coins wage, but grain costs 3. They can only buy 3 units. They starve.
      *   District B Officer uses Relief Budget to give Laborers 20 Coins. Or bans exports. Grain stays. Prices stay low. Laborers survive.
  *   **0:35 – 0:45 (Round 3 - Collapse):**
      *   District A: Laborers die. Artisan dies (no one hires them). Landlords sell to you (Teacher). Warehouse is empty, but it left the district.
      *   District B: Tight, but alive.
  *   **0:45 – 0:55 (The Count):** Tally the dead. Tally the grain remaining in District A warehouses (if any).
  *   **0:55 – 1:30 (Debrief):** (See below).

  #### 5. Recording Death
  Do not make it graphic. When a student cannot hand in 10 Grain Units:
  1.  They hand in what they have.
  2.  You mark a large **X** next to their name on the whiteboard.
  3.  They must sit silently in the "Graveyard" (back of the room).
  4.  **Crucial:** If a Landlord has 50 units of grain but a Laborer dies next to them, record both facts on the board. "Landlord A: 50 Grain. Laborer B: Dead."

  ---

  ### The Debrief (The Most Important Part)

  Do not start with "What did you learn?" Start with the data.

  **Phase 1: The Autopsy (10 mins)**
  *   "Look at the board. District A had X deaths. District B had Y deaths."
  *   "District A, raise your hand if you had grain in your pocket at the end that you didn't sell." (Likely the Landlords/Traders).
  *   "District A Laborers, raise your hand if you had coins at the end." (They might have coins, but not enough for the price).
  *   **Question:** "In District A, was there enough food in the district to feed everyone who died?" (The answer will be yes, because the Landlords had stock, or the Traders had it before shipping it to you).

  **Phase 2: The Mechanism (15 mins)**
  *   "District A Landlords: Why did you sell to the Imperial Agent (me) instead of your neighbors?" (Answer: They paid more / You didn't stop us).
  *   "District A Laborers: Why couldn't you buy the food?" (Answer: Price went up, wages stayed same).
  *   "District A Officer: What were your orders?" (Answer: Collect tax/Keep order). "Did keeping order require feeding people?"
  *   **Question:** "Did the food run out, or did the *access* to food run out?"

  **Phase 3: The Concept (10 mins)**
  *   Now you introduce the term: **Entitlement.**
  *   "You didn't starve because there was no food. You starved because you lost the *entitlement* to the food. Your wage no longer commanded enough grain."
  *   "District B survived not because they had more food, but because the Officer changed the *entitlements* (gave cash or banned exports)."
  *   **Final Question:** "When we read about famines in history, we often call them 'natural disasters' caused by drought. Based on today, is that accurate? Or is 'disaster' the wrong word for a policy choice?"

  ---

  ### Predictable Failures & Fixes

  **1. The "Robin Hood" Problem**
  *   *Failure:* A Landlord student gives grain to a Laborer student for free because they are friends.
  *   *Fix:* Enforce the "Secret Objective." Tell them beforehand: "If you give away grain without a transaction slip, you are breaking the simulation rules and will be disqualified." Make it about game integrity, not morality.

  **2. The Math Bottleneck**
  *   *Failure:* Students spend 4 minutes calculating 10 divided by 3.
  *   *Fix:* Pre-print "Price Cards." Round 1: Price 1. Round 2: Price 3. Hand them to the Traders. Tell them: "Market demand has pushed prices to this. You can lower it, but not raise it." This speeds up the crisis.

  **3. The Officer Dominance**
  *   *Failure:* The District B Officer solves everything in Round 2, making the game boring.
  *   *Fix:* Limit the Relief Budget. Give them 100 Coins total. There are 4 laborers needing 20 Coins each per round. That's 80 Coins/round. They will run out by Round 3. This creates tension: "Even relief has a cost."

  **4. Emotional Disengagement**
  *   *Failure:* Students laugh when their classmates "die."
  *   *Fix:* Frame it seriously at the start. "We are simulating life and death decisions. Treat the outcome with respect." If they giggle, stop the game. Silence the room. Ask: "Is this funny to the person sitting down?" Then resume.

  ---

  ### What This Activity Cannot Reproduce (Honest Account)

  You must acknowledge these limitations in the debrief so students don't overgeneralize.

  1.  **Colonial/Political Power:** In the game, the Officer is a neutral referee. In history (Bengal, Ireland), the government often *viewed* the starving population as a burden or a security threat. The game simplifies the malice; in reality, the "Revenue" order often came from a place of viewing the colony as a resource, not a community.
  2.  **Long-term Ecology:** The game is 3 rounds. Real famines degrade the land for decades (selling plow oxen for food means you can't plant next year). The game resets; history doesn't.
  3.  **Information Blackouts:** In the game, everyone knows the price and the harvest. In real famines, censorship often hides the death toll until it is too late. The District A Officer in your game *knows* people are dying; historically, they often claimed they didn't.
  4.  **Altruism:** As noted, real humans share. The game forces selfishness to prove the structural point. In reality, communities often share until they *all* starve. The game isolates the economic mechanism by removing the social safety net of kinship.

  ### Final Advice for the Teacher
  You do not need to be an economist to run this. You need to be a **gamemaster**. Your authority comes from enforcing the rules, not knowing the history. When a student asks, "Is this fair?" your answer is, "I don't decide fair. I decide the rules. The Officer decides the policy."

  This distance allows you to remain neutral. When the debrief comes, you can step out of the gamemaster role and join them as a fellow observer of the wreckage. That is when the learning sticks.
