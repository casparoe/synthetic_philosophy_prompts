      *   **Pedagogical Goal:** Experiential learning ("run into that with their hands"), no upfront lecture, no technical terms until debrief.
      *   **Specific Plan Provided:** Two identical districts, same harvest shortfall, same outside buyer. Difference: Relief Officer vs. Revenue/Order Officer. Roles: Landholders, Smallholders, Laborers, Moneylender, Traders, Service Provider.
      *   **Desired Outcome:** Visual of food existing alongside starvation. Different body counts based on rules. Debrief focusing on price, wage, export, orders. Avoid villainizing traders (keep conduct defensible).
      *   **Deliverables:** Roles/Endowments, Market Rules, Numbers (simple), Timeline, Death Recording, Debrief Questions, Predictable Failures/Fixes, Limitations of the Activity.
      *   **Constraints:** No historical details needed in activity (teacher supplies Bengal, Ireland, GLF later). No citations.

  2.  **Evaluate the Teacher's Plan (Critique & Refinement):**
      *   *Strengths:* The core mechanic (two districts, different policy responses) is sound. The focus on entitlements (wages vs. assets) is correct.
      *   *Weaknesses/Risks:*
          *   **Complexity:** 20 students in two economies might be too chaotic for 90 minutes. Trading takes time.
          *   **Math:** High schoolers might get bogged down in calculation if numbers aren't *very* simple.
          *   **Rationality:** Students might act altruistically (sharing food) which breaks the simulation of market logic. Need to enforce self-interest constraints.
          *   **The "Officer" Role:** Giving one officer a "relief budget" might make the solution too obvious too quickly. The constraint needs to be on *access* not just *budget*.
          *   **The Outside Buyer:** Needs to be aggressive enough to pull grain out but not so aggressive it empties the market instantly.
          *   **Time:** 90 minutes includes setup, play, and debrief. The game needs to be tight (3-4 rounds max).
          *   **Emotional Safety:** Simulating death/starvation can be sensitive. Needs careful framing.

  3.  **Designing the Activity ("The Grain Game"):**

      *   **Structure:** Split class into two districts (10 students each).
      *   **Roles:** Need to ensure the "Entitlement Collapse" is visible.
          *   *Landlords:* Have grain, sell high.
