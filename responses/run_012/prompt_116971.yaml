          *   Price: Start at 1 coin/unit.
          *   Wages: Start at 10 coins (enough for 10 units).
      *   **Mechanic:** The "Outside Buyer" should be the teacher or a designated role that *guarantees* a high price, incentivizing traders to export.
      *   **The Twist:** District A (Laissez-Faire/Revenue) vs. District B (Relief/Entitlement Protection).
      *   **Death:** If you have <10 units at end of round, you are out (or marked as dead).

  4.  **Drafting the Rules & Numbers (Iterative Process):**
      *   *Problem:* If laborers can just negotiate wages, they might survive.
      *   *Fix:* Wages need to be sticky or determined by market demand. Let's make wages set by Landlords. If Landlords don't need labor (because they have stored grain or machines), wages drop.
      *   *Simplification:* To save time, let's pre-set wages but allow them to fluctuate based on employment. Actually, better: Laborers *sell labor* for coins, then *buy grain*. If no one hires them, they have 0 coins.
      *   *Refinement:* Let's make it a pure trading game.
          *   Round 1: Normal.
          *   Round 2: Shock (Harvest drops 10%, Outside Buyer arrives).
          *   Round 3: Crisis deepens.
      *   *Wait, 90 mins is tight.* Let's do 3 Rounds total.
      *   *District A (The "Market" District):* Officer collects taxes, keeps order. No price controls. Grain can leave.
      *   *District B (The "Protection" District):* Officer has grain reserve *or* mandates local sales first. Let's go with "Local Sales Mandate" + "Public Works" (guaranteed wage).
      *   *Actually, keep it closer to the prompt:* One officer has relief budget, one sends revenue.
      *   *Critical adjustment:* To ensure the "food exists but people starve" lesson, the Landlords/Traders in District A *must* choose to export rather than sell locally. The price signal must drive this.

  5.  **Addressing Predictable Failures:**
      *   *Hoarding/Sharing:* Students might share food illegally. *Fix:* Private hands rule.
      *   *Boredom:* Trading takes too long. *Fix:* Centralized market call-out.
      *   *Giggling about death:* *Fix:* Serious framing, "status" markers instead of graphic death.
      *   *District B winning too easily:* *Fix:* Make the relief budget limited.

  6.  **Developing the Debrief:**
      *   Start with data (Who died? How much grain is left?).
      *   Move to mechanism (Why did grain leave? Why couldn't laborers buy it?).
      *   End with concept (Entitlements vs. Availability).
      *   Avoid blaming individuals (Traders were rational).

  7.  **Limitations:**
      *   Cannot simulate colonial politics fully.
      *   Cannot simulate long-term ecological damage.
      *   Simplifies human altruism.

  8.  **Final Review against Constraints:**
