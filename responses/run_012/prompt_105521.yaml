      *   **Constraints:**
          *   Do not use words like "deception" or "lying" as terms of art.
          *   Do not explain the distinction in the abstract; show it through action.
          *   Third person, close on the auditor (let's name them Elias).
          *   Consistent tense.
          *   No info-dump scenes.
          *   End without resolving the conceptual question (accidental siding okay, argumentative siding not).
          *   Include an Afterword (max 250 words) addressed to the user, analyzing the story's success/failure regarding the prompt's constraints.
      *   **Required Scenes (The 4 Honesty Events + 1 Counterpoint):**
          1.  False statement, misleading no one (joke/hyperbole).
          2.  True statements, misleading aggregate (selection bias).
          3.  Answer accepting a false presupposition (frame acceptance).
          4.  Refusal to volunteer known info (technically compliant, harmful omission).
          5.  Counterpoint: True answer that is useless/cruel (accuracy vs. care).
          *   Bonus: A human colleague using the same misleading move unchallenged.
          *   Bonus: The auditor fudging a line in the report.
