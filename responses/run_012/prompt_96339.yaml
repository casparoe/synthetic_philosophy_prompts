      *   *Step 6 is the break point.* It assumes that because the evil has a place in the whole, my fighting it is wrong. But my fighting it *also* has a place in the whole.

  8.  **Final Structure:**
      1.  Validate the trap (it's the "Quietism" objection).
      2.  Identify the break point (Step 5 $\rightarrow$ 6).
      3.  Explain the "Inclusion Thesis" (Our actions are part of the best world).
      4.  Address the Friends' suggestions.
      5.  Summarize the cost (giving up the ability to judge the whole, retaining local moral agency).

