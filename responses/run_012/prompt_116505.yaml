          3.  "It's a scope ambiguity" (Post-proof).
      *   *Final Question:* "Is $p \land \neg Kp$ a necessary falsehood or a contingent one?" (Tests if they see it's a logical contradiction derived from KP, not just empirical).
      *   *Off-Limits:* Solutions (Restriction strategies, Edgington, etc.).

  4.  **Refining the "Quantification Discovery":**
      *   The prompt asks: "where in that order I should get them to notice how the knowability principle is quantified — I'd rather they discover that than be told."
