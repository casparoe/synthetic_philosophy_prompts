answer: |-
  ### Examiner's Preliminary Sketch

  Before setting the paper, I must clarify what separates a competent recall of literature from a genuine philosophical engagement. A first-class answer cannot merely apply the non-hypocrisy condition as a checklist. It must recognise that the dispute between the Gatekeeping and Uptake theses is metaphysical versus pragmatic. The Gatekeeping thesis treats standing as constitutive of the speech act of blaming; without it, the act misfires. The Uptake thesis treats standing as normative force; the act occurs, but the target may discount it. A discriminating answer will see that Hart's lack of self-interest (Feature 4) strengthens her on the Uptake view (sincerity matters for uptake) but fails on the Gatekeeping view (hypocrisy voids authority regardless of motive). Furthermore, the distinction in Part (c) between excuse and justification is vital: if Hart was justified, she committed no wrong, so there is no hypocrisy to undermine standing. If merely excused, the wrong stands, and the *tu quoque* retains bite. The question must force the candidate to choose whether standing protects the blamer's integrity or the blamee's rights.

  ***

  ### UNIVERSITY EXAMINATION PAPER
  **Module:** Moral Responsibility and Accountability
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Instructions:**
  1.  Answer all parts of the question.
  2.  You may not bring any texts or notes into the examination room.
  3.  You are not expected to cite any authors or texts. Argumentative rigour and clarity are preferred over name-dropping.
  4.  Write in British English.

  **Question 1**

  Consider the following case:

  Dr Hart, a senior researcher, was several years ago found to have fabricated results in two papers. She was sanctioned, has been candid about it since, and now sits on the institute's research-integrity panel. Dr Neale, a colleague of similar standing, has just been found to have fabricated a figure in a grant application. At a laboratory meeting, Hart publicly rebukes Neale, calls the conduct inexcusable and says she should resign.

  Four features of the case are salient. First, Neale's fabrication was done under precisely the career pressure that Hart herself cites as having driven her own. Second, Neale maintains, not implausibly, that she took Hart's earlier conduct, and the mildness of its reception, as showing how things are done here. Third, the person most harmed by Neale's fabrication is a doctoral student whose unpublished results she used without acknowledgement, and Hart presents her rebuke as speaking for him. Fourth, Hart has nothing to gain and is plainly not acting from self-interest.

  In addressing this case, distinguish between two accounts of standing. On the **Gatekeeping Thesis**, standing is a condition on the very act of blaming, so that a blamer who lacks it has not blamed at all. On the **Uptake Thesis**, standing concerns only whether the person blamed has reason to take the rebuke to heart.

  (a) Does Hart have standing to rebuke Neale? Analyse what turns on each of the four features of the case. (10 marks)

  (b) Adjudicate between the Gatekeeping Thesis and the Uptake Thesis using this case. What would count as evidence for preferring one account over the other? (9 marks)

  (c) Does it matter for Hart's standing if her own earlier wrongdoing was excusable rather than justified? What does this imply for the force of a *tu quoque* challenge? (6 marks)

  ***

  ### MODEL ANSWER

  Hart's standing is contested because she is a moral peer in wrongdoing, yet claims authority as a reformed agent. Regarding the four features: the first feature (symmetry of pressure) strengthens the *tu quoque*; if Hart succumbed to the same pressure, her moral equality with Neale is solidified, undermining her authority to condemn. The second feature (reliance on precedent) suggests Neale viewed Hart's past conduct as normative; Hart now contradicting that implicit norm looks like unfair entrapment, further eroding standing. However, the third feature (proxy for the student) is Hart's strongest card. If standing can be delegated or assumed on behalf of a victim, Hart bypasses the hypocrisy objection because she speaks for the harmed party, not merely from personal virtue. The fourth feature (no self-interest) mitigates the suspicion of spite but does not resolve the hypocrisy charge; one can be hypocritical without gaining materially.

  Adjudicating between the theses requires asking what standing is for. The Gatekeeping Thesis implies that without standing, the rebuke is null. If this were true, Hart's speech would be mere noise. This seems too strong; Neale *has* done wrong, and Hart's identification of that wrong is factually correct. The Uptake Thesis is superior because it separates the truth of the blame from the authority of the blamer. On this view, Hart has blamed Neale—the act occurred—but Neale has a specific defence against accepting the normative force of that blame due to Hart's history. Evidence for the Uptake Thesis lies in our intuitive reaction: we would not say Hart remained silent, but rather that Neale was entitled to reject Hart's specific admonition. The Gatekeeping Thesis collapses the distinction between invalidating the message and invalidating the messenger. In this case, the message (fabrication is wrong) remains valid even if the messenger lacks the standing to demand uptake.

  Finally, the distinction between excuse and justification is decisive. If Hart's past conduct was justified, she committed no moral wrong; thus, there is no hypocrisy, and standing remains intact. A *tu quoque* challenge fails against a justified agent because there is no moral equality of wrongdoing. If her conduct was merely excused, the wrong remains but the blame is mitigated. Here, the *tu quoque* holds: Hart is a wrongdoer, albeit an excused one. This implies that the *tu quoque* does not deny the wrongness of the act, but denies the blamer's right to occupy the moral high ground. Therefore, if Hart was only excused, she lacks standing on the Gatekeeping view, and Neale may dismiss her rebuke on the Uptake view. If Hart was justified, she retains full standing on both accounts. The force of the *tu quoque* relies entirely on the existence of a shared moral fault; justification removes that fault, whilst excuse merely explains it.

  ***

  ### MARKING SCHEME

  **Part (a): Analysis of Features (10 Marks)**
  *   **Feature 1 (Pressure/Symmetry):** Must identify that shared causal pressure establishes moral equality, strengthening the hypocrisy charge. (2 marks)
  *   **Feature 2 (Reliance/Norm):** Must note that Neale's reliance on Hart's past behaviour makes Hart's current stance appear inconsistent or unfair. (2 marks)
  *   **Feature 3 (Proxy/Victim):** Must recognise this as the strongest counter-argument for standing; Hart speaks for the victim, not herself. (3 marks)
  *   **Feature 4 (Self-Interest):** Must clarify that lack of gain removes spite but does not remove hypocrisy. (2 marks)
  *   *Characteristic Loss:* Candidates often treat Feature 4 as decisive for standing, confusing sincerity with authority, or ignore the proxy element of Feature 3 entirely.

  **Part (b): Adjudication of Theses (9 Marks)**
  *   **Definition:** Clear distinction between constitutive act (Gatekeeping) vs. normative force (Uptake). (3 marks)
  *   **Application:** Argument that Uptake fits better because the truth of the blame remains even if Hart lacks authority. (3 marks)
  *   **Evidence:** Identification of intuitive responses (e.g., 'the message stands vs. the messenger fails') as evidence. (3 marks)
  *   *Characteristic Loss:* Candidates frequently conflate the two theses, arguing both amount to 'whether the blame is accepted', missing the metaphysical difference regarding whether the act occurred.

  **Part (c): Excuse vs. Justification (6 Marks)**
  *   **Distinction:** Justification denies wrongness; excuse admits wrongness but mitigates blame. (3 marks)
  *   **Implication:** *Tu quoque* requires shared wrongness; justification blocks it, excuse permits it. (3 marks)
  *   *Characteristic Loss:* Candidates often treat excuse and justification as synonymous mitigations, failing to see that justification removes the hypocrisy entirely.

  **Distinction Criteria (First vs. Upper Second)**
  A First-Class answer will integrate the three parts, showing how the Excuse/Justification distinction (Part c) fundamentally alters the outcome of the Adjudication (Part b). It will treat standing as a functional concept ('what is it for?') rather than a static rule. An Upper Second answer will correctly identify the features and define the theses but will treat them as isolated tasks, failing to see how the metaphysical status of Hart's past wrong determines the viability of the Gatekeeping Thesis.

  ***

  ### EXAMINER'S COMMENTARY

  This question was designed to prevent the recitation of standard conditions on hypocrisy. By forcing a choice between the Gatekeeping and Uptake theses, the student must commit to a view on the nature of moral address. The sketch I produced prior to drafting highlighted that the crucial discrimination point lies in whether hypocrisy nullifies the act or merely the authority. The model answer demonstrates this by arguing that the truth of the blame survives the lack of standing, favouring the Uptake Thesis. The marking scheme prioritises the understanding of the proxy element in Part (a) and the metaphysical distinction in Part (c), as these are the areas where students typically resort to vague moralising rather than precise conceptual analysis. The restriction on citations ensures the marks are awarded for reasoning, not memory.
