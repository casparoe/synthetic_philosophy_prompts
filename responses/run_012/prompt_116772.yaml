      I spent years studying with Michael Dummett, a man who believed philosophy must serve justice. He argued that we often treat the state's power to exclude as a given, something needing no explanation. He thought the burden of proof should lie with those who wish to keep people out, not with those who wish to enter. He also held a philosophical view that truth is not established merely by consensus. Just because we all agree on a border does not automatically make it morally decisive. I mention this not to turn your ceremony into a lecture, but to honour the seriousness of what is happening here. You are not merely guests arriving at a host's door. This is not a favour being conferred.

