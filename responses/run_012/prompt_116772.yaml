  I spent years studying with Michael Dummett, a man who believed philosophy must serve justice. He argued that we often treat the state's power to exclude as a given, something needing no explanation. He thought the burden of proof should lie with those who wish to keep people out, not with those who wish to enter. He also held a philosophical view that truth is not established merely by consensus. In his technical work, he insisted that we cannot make something true simply by agreeing to it. He applied this same rigour to politics, refusing to treat an existing border as settling a moral question merely because it exists and almost everyone accepts it. I mention this not to turn your ceremony into a lecture, but to honour the seriousness of what is happening here. You are not merely guests arriving at a host's door. This is not a favour being conferred by a rightful gatekeeper. Yet joining a polity is a real thing worth doing, and it brings obligations along with standing.

  Public debate often confuses three distinct questions. The first is whether a particular person should be admitted. The second is who has the authority to make that decision. The third is what it means to become a member once inside. Too often, we answer the first with sentiment and the third with bureaucracy, completely skipping the middle question about authority. That middle question is the hardest one. It is the question of power. By standing here, you have navigated a system that asserts that power. We should not pretend that system is perfect, nor should we pretend it is irrelevant. The presiding officer here represents that authority, and while we may critique the boundaries, we must respect the commitment to shared life that this room represents. To ignore the authority is to disrespect the community; to worship it is to lose our conscience. We need to keep these questions apart so that we do not mistake paperwork for belonging, or belonging for permission to remain silent.

  I will not tell you that you are lucky. Luck implies chance, and this process was deliberate. To call you lucky concedes the point at issue, suggesting the border was rightfully closed until you arrived. I will not tell you the border was unjust, because that would deny the reality of the community you are joining and embarrass those tasked with upholding it. Instead, I invite you to hold both thoughts at once. Admission is not a gift, yet membership is a bond. It means you are now part of the mechanism that decides. The certificate you receive is not just proof that you belong. It is proof that you have a voice.

