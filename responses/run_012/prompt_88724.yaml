  2.  **Internal Prep: Du Châtelet's *Discourse on Happiness* (Key Concepts):**
      *   *Nature of Happiness:* It's a state of the soul, dependent on opinion and illusion as much as reality. It requires health, freedom from prejudice, passions (specifically *tastes* vs. *passions*), virtue, and illusions.
      *   *Passions vs. Tastes:* This is crucial. Passions (like ambition, love, greed) are violent, depend on others, lead to unhappiness. Tastes (like study, arts) are calmer, depend on oneself, sustainable. She doesn't want to *extinguish* all passions/feelings, but to manage them and cultivate *tastes*.
      *   *Illusions:* Essential. We cannot be happy without deceiving ourselves somewhat about the value of things. "Happy are those who can deceive themselves."
      *   *Stoicism:* She admires Stoic self-control but rejects the idea of total apathy (*ataraxia*) or extinguishing feeling. She thinks total calm is boredom/death. We need *movement* of the soul.
      *   *Virtue:* Necessary for happiness, but not sufficient. Vice brings remorse and social punishment.
      *   *Will/Circumstances:* Happiness is largely internal (opinion), but circumstances (health, wealth, freedom) matter. She acknowledges luck.
      *   *Privilege:* She was wealthy. Does she acknowledge this? Yes, implicitly. Does she claim it works for *everyone* regardless of circumstance? No, she admits health and basic security are prerequisites.

  3.  **Sentence-by-Sentence Audit:**

      *   *Sentence 1:* "Du Châtelet's Discourse on Happiness is, at bottom, a recipe for a tranquil life."
          *   *Verdict:* Half-truth/Wince. "Tranquil" suggests quietism. She seeks *happiness*, which involves pleasure and movement, not just absence of pain.
      *   *Sentence 2:* "Her starting point is that our unhappiness is caused by our passions, which attach us to things we cannot control; the remedy is to master them and, so far as possible, extinguish them, until we arrive at something like the calm and detachment of the Stoics."
          *   *Verdict:* Distortion/Wrong. She distinguishes *passions* (violent, external) from *tastes* (internal). She does *not* want to extinguish all feeling (that's boredom). She critiques Stoic apathy.
      *   *Sentence 3:* "To that end she offers a method: good health, freedom from prejudice, virtue, a taste for study, and the decision to be happy."
          *   *Verdict:* Mostly Accurate. These are her conditions. "Decision to be happy" is a bit simplistic (it's about cultivating illusions/opinions), but close enough.
      *   *Sentence 4:* "Anyone who follows the method will be happy, since happiness is entirely a matter of will and has nothing to do with our circumstances."
          *   *Verdict:* Wrong. She explicitly lists health and freedom from oppression as necessary. She knows circumstances matter.
      *   *Sentence 5:* "Her own preferred passion, the study of philosophy and the sciences, is the safest of them because its satisfactions depend on no one but herself, though she grants that as one grows older the milder pleasures of taste are an acceptable substitute for it."
          *   *Verdict:* Confused terminology. She calls study a *taste*, not a *passion* (in the negative sense). The aging point is roughly right (shifting from violent passions to calmer tastes).
      *   *Sentence 6:* "Because her method presupposes leisure, health, and a settled income, and because she wrote as a wealthy aristocrat with the time and money for mathematics, her theory of happiness is really the ideology of a privileged class; and since it cannot be followed by most people, it fails as an account of what happiness is."
          *   *Verdict:* Non-sequitur/Philosophical Error. The sociological observation (privilege) is fair. The conclusion (therefore it fails as an account) is a genetic fallacy. She would argue she is describing human nature, even if not everyone can achieve the conditions.

