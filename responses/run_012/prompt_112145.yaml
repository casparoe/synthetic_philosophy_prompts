      *   **Key Themes:** Decayed ritual (black box, slips, lost chant), indeterminacy of the rule (quus vs. plus), communal agreement (skeptical solution), Tessie's panic (straight solution appeal), Old Man Warner (traditionalism/dispositionalism), the ending (violence/conformity).
      *   **Specific Constraints:**
          *   Address the skeptical solution seriously (agreement/dispositions).
          *   Address limits of the skeptical solution (normativity vs. regularity, McDowell-style objections).
