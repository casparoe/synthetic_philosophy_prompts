answer: |-
  Colleagues, friends, distinguished guests.

  As I step down from this presidency, I owe you a farewell that is more than a recitation of administrative victories. We are a criminal defence bar. Our work is measured in shadows, in the spaces where the light of public opinion refuses to shine. So, when I look for the image that defines us, I do not find it in the acquitted. I find it in the courtroom at Nuremberg. I find it in the counsel standing beside men the whole world had already judged.

  There is a pride in that image. It is the pride of the profession refusing to let the accused vanish into the silence of the mob. But there is also an unease that we must carry, and tonight I ask you not to set it down. Nuremberg is our standing example, but it is also our standing warning.

  We know the objection. The Charter defined crimes against peace and crimes against humanity that had no clear statutory existence before the war. The defence argued that you cannot hang a man for a law written after the deed was done. That objection was not baseless. It was the bedrock of the rule of law. To pretend otherwise is to insult the very principle we swear to uphold. If the state can invent the crime to fit the prisoner, the prisoner has no defence, and the lawyer has no function.

  Yet, there is a second objection, louder and more moral. The defence argued that the victors had done the same things. The firebombing of cities, the unrestricted submarine warfare. They argued that if this was law, it must bind the judge as well as the accused. This, too, had truth in it. To ignore the hypocrisy of the victors is to pretend that power does not corrupt justice.

  But here is the tension we must face honestly. These two complaints pull in opposite directions. The first argument says the law was void; the second says the law was valid but selectively applied. If the law was truly non-existent, it matters little who enforced it. If the law was real, then the hypocrisy of the enforcer is a political grievance, not a legal shield. The defence had to argue both: that the rope was too thin to hold a man, and that the hands tying the knot were bloody. It is a contradiction, but it was the only ground they had to stand on.

  So, what makes such a tribunal legitimate, given these flaws? It is not the Charter. It is not the judges. It is the presence of counsel.

  Legitimacy, in the face of victors' justice, is not found in the verdict. It is found in the transcript. It is found in the fact that the record shows the defence stood up, cross-examined the witnesses, and forced the prosecution to prove its case. The tribunal became something more than a show trial not because the law was perfect, but because the adversarial process was allowed to breathe. The defence ensured that history would not record only the victor's narrative. They forced the world to hear the arguments against the new law, even as they applied it. They turned a political necessity into a legal proceeding, however imperfect.

  We see the difference when we look elsewhere. In Tokyo, the same legal architecture was erected not by an international agreement but by the unilateral decree of a single occupying commander, turning the bench into an extension of the occupation authority rather than a covenant between nations.

  That distinction matters. It matters because it reminds us that the law is fragile. It can be a shield, or it can be a weapon. At Nuremberg, despite the retroactivity, despite the victors sitting in judgment, the defence ensured it remained, however tenuously, a shield for the truth.

  I cannot give you a celebratory speech about Nuremberg. The defendants were not martyrs, and the trial was not flawless. But I can celebrate the counsel. They did not flinch. They did not let the enormity of the crimes absolve the necessity of the process. They understood that if the law does not apply to the despised, it applies to no one.

  To the prosecutors and the judge in this room: we share a duty. You seek justice; we seek process. But without process, your justice is merely vengeance. Without your pursuit of truth, our process is merely a game. Nuremberg teaches us that these things must exist together, even in tension.

  To my colleagues in defence: our inheritance is not the judgment. It is the obligation to stand beside the condemned when the world demands blood. It is the willingness to argue the law even when the law is new, and to challenge the judge even when the judge is a victor.

  Let us leave here tonight proud of that work, but uneasy about the power we check. Let us be grateful that we have a system where the defence has a voice, even if that voice is raised in a hall built by the opposition. That is the only legitimacy we have. That is the only legitimacy we need.

  Thank you.
