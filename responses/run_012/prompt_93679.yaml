prompt: |-
  I am a retired field biologist — thirty-five years on the foraging ecology of shorebirds, mostly standing in estuaries counting things — and for the past four years I have served as the organismal-biology member on the scientific advisory committee of the Calder Foundation, which makes roughly forty grants a year in behavioural research. Our next meeting is on the eleventh, and the docket includes a three-year proposal, about half a million dollars, from a well-regarded group that wants to test whether the human capacity to move in time with other people — tapping, marching, clapping, dancing in unison — is an adaptation: a special-purpose mechanism that evolved because synchronised action advertised commitment and thereby built the coalitions on which our ancestors depended. Their case rests on three lines of evidence: that the behaviour appears in every society anyone has documented; that infants already entrain to a beat before they can speak; and that adults who move in time with a stranger afterwards cooperate with that stranger more, and report liking them more. They conclude that the capacity is an adaptation for coalition solidarity, and throughout the proposal they call the behaviour affiliation signalling. I find the individual studies competent and the conclusion much too fast, but I have not been able to say to my own satisfaction why, and the standard we settle on here will govern the other two proposals on the docket as well.

  Part of the trouble is that I no longer trust my instincts. My whole career consisted of asking what a behaviour was for, and I was usually right in the way a good guess is right — because I could return to the estuary the following season and watch. Here there is no following season: what I want to know is what happened in the Pleistocene, and what the team has measured is what happens in a laboratory now. I have spent my retirement reading philosophy of science with more enthusiasm than method, which has made me more articulate about my doubts without bringing me any closer to settling them. My two most vocal colleagues are no help. One holds that the entire adaptationist programme is unfalsifiable and that we should decline anything with adaptation in its title; the other holds that the evidence is as strong as anything in our portfolio and that a foundation which funds behavioural science and then flinches at adaptation claims has no business existing. I believe both are wrong in ways I cannot yet articulate.

  Please draft the memorandum I will circulate before the vote. It should recommend a concrete disposition — approve, decline, or approve with conditions — and if the recommendation is conditional, it should state the conditions as requirements the team could actually meet in a revised protocol, with a deadline before our next quarterly meeting. It should set out, in terms my colleagues can apply to the other proposals on the docket, the standard by which an adaptationist claim ought to be judged: what this team has established, what it has not, and what further evidence would close the gap. I would like the strongest version of each of my colleagues' positions stated and answered, and a clear account of what would change the recommendation. Finally, there is a worry I have been unable to put into words, and I want the memo to try. The team's three findings seem to establish that the capacity is useful and reliably developing, which is not the same as establishing that it was selected for the use they name; and the label they use, affiliation signalling, appears to have the function built into it, so that describing the behaviour and explaining it threaten to be the same act performed twice. If that gap cannot be closed by any study we could realistically fund, say so plainly, and say what a funding body should then do with a proposal whose central claim is, for all practical purposes, unclosable.
reasoning: |-
  Here's a thinking process that leads to the suggested memorandum:

  1.  **Analyze the Request:**

      *   **Persona:** Retired field biologist (35 years shorebird ecology), currently organismal-biology member on the Calder Foundation's scientific advisory committee. Pragmatic, experienced, skeptical but not dogmatic, values empirical verification ("return to the estuary"), currently reading philosophy of science (articulate about doubts but seeking resolution).
      *   **Context:** Upcoming committee meeting (11th). Docket includes a $500k, 3-year proposal on human synchrony (tapping, marching, etc.) as an adaptation for coalition solidarity ("affiliation signalling").
      *   **The Proposal's Case:** Universality (every society), Early Onset (infants entrain), Experimental Effect (synchrony increases cooperation/liking).
      *   **The User's Problem:** Finds studies competent but conclusion too fast. Doesn't trust instincts anymore (can't "return to the estuary" for Pleistocene events). Two colleagues are unhelpful extremists (one anti-adaptationist, one pro-adaptationist). Needs a standard for judging adaptationist claims applicable to future proposals.
      *   **Specific Requirements for the Memo:**
          *   Recommend a concrete disposition (Approve, Decline, or Approve with Conditions).
          *   If conditional, state realistic requirements/deadline (before next quarterly meeting).
          *   Set out a standard for judging adaptationist claims (what's established, what's missing, what closes the gap).
          *   State and answer the strongest versions of the two colleagues' positions.
          *   Address the "worry unable to put into words": The gap between *useful/reliably developing* and *selected for*. The risk of "affiliation signalling" being a tautology (description = explanation).
          *   If the gap is unclosable, say so and advise on funding policy.
      *   **Tone:** Professional, rigorous, respectful, decisive but nuanced, reflecting the voice of an experienced scientist who knows the limits of inference.

  2.  **Deconstruct the Scientific Problem (Adaptationism):**

      *   *The Claim:* Synchrony is an adaptation for coalition building.
      *   *The Evidence:* Universality (phylogeny/cross-cultural), Ontogeny (infants), Immediate Function (cooperation experiments).
      *   *The Gap:* These show *current utility* and *reliability*, not *historical selection pressure*. This is the "Just-So Story" problem (Gould & Lewontin).
      *   *The Tautology Risk:* Calling it "affiliation signalling" assumes the function in the name. If you define the behavior by its supposed function, proving the function becomes circular.
      *   *The "Unclosable" Worry:* Can we ever truly know Pleistocene selection pressures? If not, should we fund "ultimate" explanation or stick to "proximate" mechanism?

  3.  **Determine the Recommendation:**

      *   *Decline?* Too harsh. The science is competent, the question is important.
      *   *Approve?* Premature. The logic leap is too big for $500k without addressing the alternative hypotheses.
      *   *Approve with Conditions?* Best fit. It forces the researchers to confront the logical gap without shutting down the inquiry. It sets a precedent for the committee.
      *   *Conditions:* They need to rule out byproducts (spandrels) or alternative functions. They need to stop using the label "affiliation signalling" as a premise.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (recommendation on Proposal X) and the broader intent (setting a standard).
      *   **The Recommendation:** "Approve with Conditions."
      *   **The Standard (The Core Argument):** Distinguish between *Current Utility*, *Reliable Development*, and *Historical Adaptation*. Use the shorebird analogy (just because a beak shape works now doesn't mean it evolved *for* that specific prey without phylogenetic context).
      *   **Addressing Colleagues:**
          *   *Colleague A (Anti-adaptationist):* Acknowledge the risk of unfalsifiability, but argue that dismissing adaptation *a priori* blinds us to evolutionary reality. We can test adaptation rigorously.
          *   *Colleague B (Pro-adaptationist):* Acknowledge the strength of the data, but argue that correlation + utility $\neq$ selection history. Funding "just-so stories" wastes resources.
      *   **The "Worry" (Tautology/Gap):** Articulate the distinction between *exaptation/byproduct* vs. *adaptation*. Address the labeling issue ("affiliation signalling" presupposes the conclusion).
      *   **The Conditions:**
          1.  Rename the phenomenon (neutral language).
          2.  Include specific alternative hypothesis testing (e.g., is it a byproduct of auditory-motor coupling?).
          3.  Comparative analysis (do other primates do this? if so, is it for coalition?).
          4.  Deadline: 4 weeks (before next quarterly).
      *   **Closing:** What if the gap is unclosable? (Shift funding to proximate mechanisms or comparative phylogenetics).

  5.  **Refining the Voice:**

      *   Needs to sound like a biologist. Use terms like "phenotype," "selection pressure," "proximate/ultimate," "null hypothesis."
      *   Needs to sound like the specific persona: Humble about the limits of knowledge ("no following season"), but firm on methodological rigor.
      *   Avoid overly dense philosophy jargon, but show the influence of the reading (e.g., referencing the distinction between utility and history).

  6.  **Self-Correction/Review during Drafting:**

      *   *Check:* Did I address the "unclosable" worry? *Adjustment:* Make sure to explicitly state that if phylogenetic comparison isn't possible, the claim remains a hypothesis, not a finding, and funding should reflect that uncertainty.
      *   *Check:* Are the conditions realistic? *Adjustment:* Asking for new fieldwork might be too much for a revision deadline. Asking for a revised *protocol* that *plans* for these controls is better.
      *   *Check:* Is the tone too aggressive against the applicants? *Adjustment:* Emphasize that the *science* is good, but the *evolutionary inference* needs tightening. Respect the applicants' competence.
      *   *Check:* The "Worry" about the label. *Adjustment:* Ensure the memo explicitly critiques the term "affiliation signalling" as prejudging the outcome.

  7.  **Final Polish:** Check the flow. Ensure the transition from the specific proposal to the general committee standard is smooth. (The prompt asks for the memo to circulate *before* the vote, so it serves as a briefing paper.)

      *(Self-Correction on Deadline)*: The prompt says "deadline before our next quarterly meeting." The meeting is on the 11th. If this memo is circulating now, the revision needs to happen fast. I will set the deadline for the revised protocol to be submitted 3 days prior to the meeting, allowing review time.

      *(Refining the "Unclosable" aspect)*: I need to be careful not to say adaptationism is impossible, but that *this specific claim* risks being unfalsifiable without specific comparative data. If it *is* unclosable, the foundation should fund the *question*, not the *conclusion*.

  8.  **Finalizing the Text:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Scientific Advisory Committee, Calder Foundation
  **FROM:** [Your Name], Organismal Biology Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Proposal #24-B (Human Synchrony and Coalition) and Standards for Adaptationist Inference

  **1. Recommendation**

  I recommend that the Committee **approve Proposal #24-B with conditions.**

  The experimental design is robust, the investigators are competent, and the phenomenon under study—interpersonal synchrony—is undeniably significant. However, the evolutionary conclusion that this capacity is a specific adaptation for "coalition solidarity" outstrips the evidence provided. We should not fund a conclusion as a premise.

  I propose we offer the grant contingent upon the submission of a revised protocol that addresses the logical gap between *current utility* and *historical selection*. This revision must be submitted no later than three days prior to our next quarterly meeting.

  **2. The Standard for Adaptationist Claims**

  As we face two additional proposals invoking evolutionary history, we must establish a consistent standard. In my thirty-five years watching shorebirds, I learned that observing a trait's utility in the present does not prove it was selected for that utility in the past. A beak shape may crack seeds efficiently today, but it may have evolved for probing mud, or as a byproduct of skull geometry. We cannot return to the Pleistocene to watch the selection occur; we must infer it through rigorous exclusion of alternatives.

  For the Calder Foundation to fund adaptationist claims responsibly, a proposal must demonstrate three distinct layers of evidence. Proposal #24-B currently satisfies only the first two:

  *   **Layer 1: Reliable Development (Ontogeny).** Does the trait appear consistently across individuals?
      *   *Status:* **Established.** The proposal confirms infants entrain to beats before speech.
  *   **Layer 2: Current Utility (Function).** Does the trait confer an advantage in the current environment?
      *   *Status:* **Established.** The proposal confirms synchrony increases cooperation and liking in laboratory settings.
  *   **Layer 3: Historical Specificity (Adaptation).** Was the trait *selected for* this specific advantage, rather than being a byproduct (spandrel) of another mechanism, or an exaptation co-opted later?
      *   *Status:* **Not Established.** This is the gap.

  To close Layer 3, the researchers must treat the adaptation hypothesis as one competitor among others, not as the default explanation. They must demonstrate that the costs of the trait (energy, neural tissue, risk) are outweighed by the specific benefits claimed (coalition stability) in the Environment of Evolutionary Adaptedness (EEA), and that alternative explanations (e.g., that synchrony is a byproduct of auditory-motor coupling necessary for language) are less parsimonious.

  **3. Addressing Divergent Views**

  I anticipate disagreement from two sides of the Committee. I wish to address the strongest version of each concern before we vote.

  *   **To the colleague who argues the adaptationist programme is unfalsifiable:**
      You are correct that "just-so stories" are a risk. If we accept any plausible benefit as proof of selection, we cease doing science. However, to declare adaptation *a priori* unfalsifiable is to discard the only framework that explains complex design in biology. We do not solve this by banning the word "adaptation." We solve it by demanding **comparative phylogenetics**. If synchrony is an adaptation for human coalition, do our closest primate relatives lack it? Or do they possess it for different reasons? If a trait is universal in humans but absent in related taxa, the case for recent, specific selection strengthens. If it is present in macaques who do not form human-like coalitions, the adaptation claim weakens. We can falsify adaptation by finding a better explanatory fit in non-adaptive mechanisms.
  *   **To the colleague who argues the evidence is already sufficient:**
      You are correct that the data is strong regarding *proximate* mechanisms. The link between synchrony and cooperation is real. However, funding a foundation dedicated to *behavioural research* does not obligate us to fund *evolutionary speculation* masquerading as data. If we fund the conclusion that "this is an adaptation" without requiring the team to rule out byproducts, we incentivize narrative over mechanism. We risk turning the Foundation into a patron of confirmation bias. Strong science requires us to ask: "What evidence would prove you *wrong*?" This proposal currently lacks that safeguard.

  **4. The Unarticulated Worry: Tautology and Labeling**

  There is a methodological hazard in this proposal that I have struggled to name, but which bears on our funding policy. The investigators label the behaviour **"affiliation signalling."**

  This label builds the function into the definition. If the behaviour is *defined* as a signal for affiliation, then observing that it signals affiliation is a tautology, not a discovery. It conflates the *description* of the act (moving in time) with the *explanation* of the act (to signal affiliation).

  This creates a risk that the gap between Layer 2 (Utility) and Layer 3 (Adaptation) is unclosable by any study we can realistically fund. We cannot run a selection experiment on early humans. If the researchers cannot provide comparative data (e.g., from hunter-gatherer ethnography or primate comparison) that rules out the possibility that synchrony is merely a byproduct of rhythm perception used for other ends (like tool use or language), then the claim remains a hypothesis, not a finding.

  **5. Conditions for Approval**

  To mitigate these risks, I propose the following conditions for the release of funds. The Principal Investigators must submit a revised protocol addressing:

  1.  **Neutral Terminology:** The term "affiliation signalling" must be replaced with neutral descriptive language (e.g., "interpersonal synchrony") throughout the hypothesis section. The function must be treated as a variable to be tested, not a definition.
  2.  **Alternative Hypotheses:** The experimental design must include at least one control condition that tests a non-adaptive alternative. For example: Does synchrony increase cooperation even when the "partners" are known to be untrustworthy? (Testing if the mechanism is a rigid byproduct rather than a flexible signal).
  3.  **Comparative Context:** The literature review must be expanded to explicitly address the presence or absence of rhythmic entrainment in non-human primates and its correlation with coalition structures in those species.
  4.  **Falsification Statement:** The proposal must explicitly state what empirical result would cause them to abandon the adaptation hypothesis.

  **6. Policy Implication for "Unclosable" Claims**

  Finally, regarding the worry that this gap may be unclosable: If, after revision, it becomes clear that no feasible study can distinguish between "adaptation for coalition" and "byproduct of auditory processing," the Committee should still consider funding the work, but we must categorize it differently.

  We should fund the **question**, not the **answer**.

  If a proposal's central claim is effectively unfalsifiable with current technology, we should not endorse the claim in our public materials. We fund the *investigation of the mechanism* (proximate), while explicitly noting that the *evolutionary origin* (ultimate) remains speculative. To do otherwise is to compromise the Foundation's scientific integrity. We are in the business of reducing uncertainty, not funding comfortable narratives.

  **Summary**

  Proposal #24-B is excellent science hampered by overconfident evolutionary inference. By approving it with the conditions above, we support the research while upholding a standard that protects the Foundation from funding tautologies. We acknowledge that we cannot return to the Pleistocene, but we can demand that those who claim to speak for it have ruled out the present.

  I look forward to discussing this on the eleventh.
