answer: |-
  Reject (4).

  This step commits the genetic fallacy: judging the validity of a belief solely by its origin. Just because a moral faculty is shaped by temperament and upbringing doesn't mean it *cannot* track truth. Consider vision: your visual cortex was calibrated by evolution for survival, not abstract truth, yet you trust it to tell you if a car is coming. Biological and cultural calibration are constraints on how we access truth, not proof that truth is inaccessible.

  **Why it looked plausible:**
  Premise (4) seduces us because we want moral truth to be "pure." We intuitively feel that if a judgment is caused by messy psychological contingencies (like upbringing), it lacks the necessity of objective fact. We conflate *causal explanation* with *normative justification*. If I can explain why you believe X via your childhood, it feels like I've explained away X's truth. This step also leverages a false dichotomy: either morality is derived purely from rational argument, or it's merely subjective preference. It ignores the possibility that evolution and culture might have shaped us to perceive real moral facts, much like they shaped us to perceive physical objects.

  **The Cost of Rejecting It:**
  By rejecting (4), you lose the ability to dismiss opposing moral views merely by profiling their psychology. You cannot tell a conservative, "You only believe that because of your temperament," and assume you've won. You are forced back into first-order moral argument. You must engage with the *content* of their claims, not just the genealogy of their faculties. This is harder work. It requires you to provide evidence and argument that your faculty is tracking truth better than theirs, rather than resting on the skeptical laurel that *no one* is tracking truth.

  **What You Keep:**
  You save moral realism from the "slavery" reductio. If (4) is false, the fact that slaveholders had a "calibrated faculty" supporting slavery doesn't mean slavery's permissibility lacks a fact of the matter. It means their faculty was wrong, despite its psychological origins. You keep (1) through (3) intact: disagreements exist, reliability matters, and psychology differs. But you block the slide into global skepticism at (5). You maintain that while our faculties are conditioned, they are not thereby disqualified.

  **The Alternative Price:**
  If you instead rejected the move from (6) to (7), you would keep moral facts but admit we can't know them (skepticism). You'd save realism but lose action-guidance. If you rejected (2), you'd abandon reliabilism for coherentism, but that clashes with your acceptance of (1) and (3). Rejecting (4) is the only move that preserves the possibility of moral knowledge without requiring impossible purity from our psychological machinery. It costs you the comfort of skepticism but buys you the possibility of being right.
