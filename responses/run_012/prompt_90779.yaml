answer: |-
  **Essay Question**

  **1. Popper's verisimilitude was refuted in 1974, but the standard summary—that it renders all false theories incomparable—is insufficient. Explain why this collapse is structural to any account identifying theoretical content with logical consequences and ranking by containment, rather than a technical slip in Popper's formulation. Compare the two primary strategies for repair: (i) restricting which consequences count toward truthlikeness, and (ii) replacing containment with a likeness metric over possibilities. In your analysis, address whether these repairs answer Popper's original question regarding scientific progress or merely change the subject, and specifically evaluate the objection that strategy (i) merely relabels the problem it intends to solve. Conclude with a defended verdict on whether the consequence-based approach can be salvaged.**

  ***

  **Model Answer**

  Popper sought to reconcile fallibilism with scientific progress: we must prefer some false theories over others. His definition relied on a content-based approach, where a theory's verisimilitude is a function of its true content ($Ct_T$) minus its false content ($Ct_F$), ordered by set-theoretic containment. The 1974 refutations by Tichý and Miller are not merely demonstrations that Popper's specific axioms failed; they reveal a structural impossibility inherent in combining classical logical consequence with bivalent truth values.

  The collapse is structural because, under classical logic, logical strength and truth value are inextricably linked in a way that precludes ordering false theories. If theory $A$ entails theory $B$, $A$ has greater content. However, if both are false, the additional content in $A$ must be false. Consequently, increasing content increases falsity. Popper's definition requires that to be closer to the truth, a theory must have more true content without increasing false content, or less false content without decreasing true content. For false theories, logical containment ensures that any gain in true content is structurally coupled with a gain in false content that swamps the ordering. Thus, any account relying solely on containment relations among logical consequences cannot generate a non-trivial ordering of false theories. It is a feature of the logic, not a bug in Popper's arithmetic.

  Two families of repair emerged. The first retains the consequence-based framework but restricts the class of consequences that count, such as "relevant" consequences or "basic" statements (e.g., Gemes, Mortensen). The second abandons containment for a similarity metric over state-descriptions or possible worlds (e.g., Niiniluoto, Oddie), measuring the distance between the worlds a theory allows and the actual world.

  Strategy (i) attempts to save Popper's question by maintaining that progress is about accumulating significant truth. However, it faces the "relabeling" objection. To distinguish which consequences are "relevant" to truthlikeness, one must already possess an antecedent notion of which propositions make a theory closer to the truth. If relevance is defined syntactically, it fails to block the Tichý result; if defined semantically, it presupposes the likeness relation it seeks to define. Thus, strategy (i) often covertly imports the resources of strategy (ii) while claiming to remain within the consequence framework. It risks changing the subject from logical content to semantic relevance without explaining the transition.

  Strategy (ii) explicitly changes the subject from logical strength to semantic similarity. Popper asked about content, but this strategy answers about likeness. However, this shift is necessary. Popper's intuition was that a theory can be "nearer" to the truth even if false. Likeness metrics capture this by allowing a theory to be logically strong (high content) yet semantically close (low distance). This better answers the spirit of Popper's question—justifying progress amid error—even if it abandons his specific syntactic mechanism.

  Therefore, the consequence-based approach cannot be salvaged. The structural interdependence of truth and falsity in classical containment makes it impossible to rank false theories by content alone. Restricting consequences (Strategy i) fails because it cannot non-circularly define relevance without appealing to likeness. The likeness metric (Strategy ii) is the only viable path. While it shifts the focus from Popper's syntactic containment to semantic distance, this is not a defect but a correction. Truthlikeness is fundamentally a semantic relation between a proposition and the world, not a syntactic relation between propositions. To save the phenomenon of scientific progress, we must abandon the idea that truthlikeness is a function of logical content and accept it as a measure of similarity to reality.

  ***

  **Marking Scheme (20 Marks Total)**

  | **Point** | **Criteria (4 Marks Each)** | **Common Error / Note** |
  | :--- | :--- | :--- |
  | **1. Structural Explanation** | Explains that the failure arises from the logic of containment + bivalence (truth/falsity coupling), not just Popper's specific formula. | *Merely recounting the Tichý/Miller result without explaining the logical interdependence of content and truth.* |
  | **2. Strategy (i) Analysis** | Accurately describes restricting consequences (relevant/basic) and explains the mechanism intended to fix the ordering. | *Confusing "restricting consequences" with simply adding new axioms to Popper's original definition.* |
  | **3. Strategy (ii) Analysis** | Accurately describes the likeness/metric approach (possible worlds/distance) and how it differs from containment. | *Describing likeness metrics as just another form of logical content rather than a semantic distance measure.* |
  | **4. Subject Change & Relabeling** | Addresses whether repairs answer Popper's question and critiques Strategy (i) for circularity/relabeling regarding relevance. | *Failing to address the "relabeling" objection or claiming both strategies answer Popper's question equally.* |
  | **5. Defended Verdict** | Commits to a definite conclusion on salvageability (e.g., "consequence approach is dead") and justifies it based on the prior analysis. | *Sitting on the fence (e.g., "both have merits") or offering a verdict unsupported by the essay's argument.* |
