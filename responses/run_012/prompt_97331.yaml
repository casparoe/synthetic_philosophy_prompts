answer: |-
  Here is a specification of the desiderata for an adequate theory of computational implementation. These criteria are designed to constrain the definition of "computation" such that the claim "the brain is a computer" remains a substantive empirical hypothesis rather than a metaphysical triviality or a category error.

  ### Desiderata for a Theory of Computational Implementation

  **1. The Non-Gerrymandering Constraint (Anti-Triviality)**
  *   **Requirement:** The theory must rule out mappings between physical states and computational states that are constructed *post hoc*, disjunctive, or wildly gerrymandered to fit a desired automaton.
  *   **Consideration:** This addresses Putnam's and Searle's triviality arguments. If any physical system (e.g., a wall, a bucket of water) can be mapped to any finite state automaton simply by grouping physical microstates arbitrarily, then "everything computes everything."
  *   **Case to Classify:** A system whose states can be put into 1:1 correspondence with an automaton only if we group "all states occurring on Tuesdays" as State A and "all states occurring on Wednesdays" as State B. The theory must reject this as implementation.

  **2. The Causal/Process Constraint (Mechanism Sensitivity)**
  *   **Requirement:** The theory must distinguish between a system that *processes* information through intermediate causal steps and a system that merely produces the correct input-output pairing via a static lookup or physical law.
  *   **Consideration:** Computing $f(x)$ requires more than satisfying the extension of $f$. It requires the causal structure of the system to mirror the logical structure of the algorithm.
  *   **Case to Classify:** A device with a hard-wired lookup table that flashes the correct answer instantly vs. a Turing machine that writes, erases, and moves tape to derive the answer. Both realize the function; only the latter should count as *computing* it in the algorithmic sense.

  **3. The State Individuation Constraint (Physical Grounding)**
  *   **Requirement:** The theory must specify what facts about the physical system fix the boundaries of computational states, given that physics does not come pre-carved into "0s" and "1s."
  *   **Consideration:** Physical states are continuous, high-dimensional, and noisy. Computational states are typically discrete and abstract. The theory must explain the "carving" principle without appealing to the very computation it seeks to define (circularity).
  *   **Case to Classify:** A neuron firing. Does it implement a binary state (spike/no-spike), an analog state (firing rate), or a high-dimensional dynamical state? The theory must provide criteria for choosing among these without saying "whichever makes the computation work."

  **4. The Mind-Independence Constraint (Objectivity)**
  *   **Requirement:** The theory must determine whether implementation is an intrinsic physical property or relative to an observer/interpreter. If relative, it must specify the constraints on the interpreter to avoid subjectivity collapsing into triviality.
  *   **Consideration:** If computation requires an interpreter to assign meaning to states, then computation is not a natural kind found in the brain independent of us. If it is intrinsic, we face the State Individuation problem.
  *   **Case to Classify:** A system that computes only relative to a user supplying the interpretation, where the same system computes different functions under different assignments. The theory must say if *both* are true, *neither*, or if one is privileged.

  **5. The Dynamics Constraint (Equation vs. Algorithm)**
  *   **Requirement:** The theory must distinguish between physical evolution described by mathematical equations and physical evolution that constitutes computation.
  *   **Consideration:** Many physical systems are predictable via equations (e.g., planetary orbits) but are not intuitively computers. Since equations can be solved by computers, the reverse distinction is crucial.
  *   **Case to Classify:** An orbiting body. A physicist can predict its position using an equation (which can be computed). Does the planet *compute* its own orbit? The theory should ideally say "no" to preserve the utility of the term, or explain why "yes" doesn't trivialize the concept.

  **6. The Hyperintensionality Constraint (Function vs. I/O)**
  *   **Requirement:** The theory must distinguish between computing a specific function and merely realizing the same input-output relation via a different function.
  *   **Consideration:** Computation is hyperintensional. Computing $x+1$ is different from computing $x+2-1$, even if the I/O is identical.
  *   **Case to Classify:** Two systems that always output the same number for the same input. One adds 1; the other adds 2 then subtracts 1. The theory must allow that they are computing different things despite identical I/O behavior.

  **7. The Intrinsic Function Constraint (Use vs. Nature)**
  *   **Requirement:** The theory must distinguish between a system that *is* a computer and a system that is *used* to compute.
  *   **Consideration:** We can use a stick to count, or a rock to hold down paper in a calculation. This does not make the stick or rock a computer.
  *   **Case to Classify:** A system whose states are continuous rather than discrete, but which we *use* as a digital device by imposing thresholds. The theory must clarify if the computation lies in the system or in our usage of it.

  **8. The Substantivity Constraint (Brain Applicability)**
  *   **Requirement:** The theory must render the claim "the brain is a computer" contingent and empirical, neither analytically true nor demonstrably false.
  *   **Consideration:** If the definition is too loose, the claim is trivially true (pancomputationalism). If too strict (e.g., requiring von Neumann architecture), it is trivially false.
  *   **Case to Classify:** Neural tissue. The theory must allow for the possibility that the brain computes, while leaving open the possibility that it operates via non-computational dynamics (e.g., pure analog resonance, quantum effects, or biochemical diffusion without information processing).

  ***

  ### Analysis of Tensions and Incompatibilities

  You suspected that the demand for **Objectivity (D4)** sits in tension with the demand for **Non-Triviality (D1)**. This suspicion is correct, but the tension is more specific: it is a tension between **Objectivity (D4)** and **State Individuation (D3)** in the absence of **Teleology**.

  **The Incompatible Pair: Mind-Independence (D4) vs. Non-Gerrymandering (D1)**
  *   **The Conflict:** If computation is entirely mind-independent (intrinsic to the physics), we must find physical criteria to distinguish "real" computational states from arbitrary groupings of microstates (D1). However, standard physics (classical or quantum) describes continuous fields or particles, not discrete symbols. There is no "computational joint" in nature to carve.
  *   **The Consequence:** To satisfy D1 (block triviality), most theories appeal to *causal structure* or *function*.
      *   If they appeal to *causal structure* alone, Putnam-style arguments suggest we can still find isomorphic mappings in almost any system (violating D1).
      *   If they appeal to *function* (what the system is *for*), they introduce teleology. Teleology usually implies a designer or an evolutionary history. This compromises strict Mind-Independence (D4) because "function" becomes relative to a history or an observer's stance (the "Design Stance").
  *   **Verdict:** You likely cannot have a theory that is strictly mind-independent (D4) *and* successfully blocks trivial mappings (D1) without smuggling in normative or teleological criteria that weaken D4.

  **The Most Exclusionary Requirement: The Causal/Process Constraint (D2)**
  *   **Why:** This requirement does the most work in excluding otherwise attractive accounts.
  *   **Exclusionary Power:**
      *   It excludes **Extensional/Behaviorist Accounts:** Any theory that defines computation solely by Input-Output relations (like a black box) fails D2. It cannot distinguish a lookup table from an algorithm.
      *   It excludes **Simple Isomorphism Accounts:** Any theory that says "computation is just structural similarity" fails D2, because a static structure can be isomorphic to a dynamic process without *causing* the transitions.
      *   It pressures **Pancomputationalism:** It forces the theory to identify specific causal mechanisms (e.g., gate-like interactions). If the brain's dynamics are purely analog wave propagation without discrete causal mediation, D2 forces you to say the brain does *not* compute, even if it processes information.
  *   **Cost:** Adhering strictly to D2 risks making computation too rare. It requires a theory of *causal individuation* that is robust enough to say why a specific voltage drop counts as a logical gate operation while a thermal fluctuation does not.

  ***

  ### Brief Note on Families of Account

  *   **Semantic Accounts:** Implementation requires physical states to carry content (meaning).
      *   *Fare:* Satisfies D4 (if content is naturalized) and D1 (rocks don't have content). Fails D7/D8 for many neuroscientists who want to explain how content *arises* from computation, not presuppose it.
  *   **Syntactic/Formal Accounts:** Implementation requires physical states to instantiate formal symbol manipulation.
      *   *Fare:* Struggles with D3 and D5. Physical states aren't inherently syntactic. Often collapses into D4 (syntax is observer-relative, per Searle).
  *   **Mechanistic Accounts:** Implementation requires a mechanism organized to manipulate vehicles according to rules.
      *   *Fare:* Currently the strongest contender. Handles D2 and D6 well. Struggles with D5 (continuous systems) and faces the D1/D4 tension (is the mechanism's function objective or attributed?).
  *   **Modal/Counterfactual Accounts:** Implementation requires the system to support specific counterfactuals (if input were X, state would transition to Y).
      *   *Fare:* Good for D1 (blocks accidental correlations). Struggles with D3 (which counterfactuals count?) and D5 (continuous dynamics).

  **Summary for your decision:** If you prioritize **Objectivity**, you will struggle to rule out trivial mappings without making computation so rare the brain might not qualify. If you prioritize **Non-Triviality**, you will likely need to accept that computation is relative to a function or interpreter, making "the brain is a computer" a claim about how we model the brain, not what the brain *is* in itself.
