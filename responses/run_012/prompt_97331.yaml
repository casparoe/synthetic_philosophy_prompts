prompt: |-
  Before I take a side on whether the brain is a computer, I want the specification settled: an account of what any adequate theory of computational implementation — of what it takes for a physical system to count as computing a given function or running a given algorithm — has to deliver. Write me the desiderata, with the consideration behind each: the cases the theory must classify correctly, the distinctions it must not collapse, and the facts or results it must stay consistent with.

  At a minimum I want it to handle these cases. A system whose states and transitions can be put into a one-to-one correspondence with those of some automaton, where the correspondence is constructed after the fact rather than read off the system. A device that emits the correct outputs from a hard-wired table, with no internal process answering to the intermediate steps of the algorithm. A system whose evolution a physicist can describe and predict with an equation, such as an orbiting body. A system whose states are continuous rather than discrete. A system that computes only relative to a user or interpreter who supplies the interpretation, together with the fact that the same system can be described as computing something else under a different assignment. And it must keep apart computing a function from merely realizing that function's input-output relation, being describable in computational terms from being a computer, and computing from being used to compute. It must also say what fixes the states of a computation, given that a physical system does not arrive pre-carved into state boundaries. Keep the brain in view as the application throughout: the account should make the claim that the brain computes a substantive one, neither trivially true nor trivially false.

  Flag any pair of requirements you believe cannot be jointly satisfied, and say which single requirement does the most to exclude otherwise attractive accounts. My suspicion, which I want you to test rather than assume, is that the demand that implementation be objective — that a system compute or fail to compute independently of how we describe it — sits in tension with the demand that not every system implement every computation, and that this tension is where the real work lies. A brief note on how the main families of account fare against the list is welcome, but the criteria are what I am after; the scoring I can do myself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of computational implementation:

  1.  **Deconstruct the Request:**

      *   **Goal:** Provide a list of desiderata (requirements/criteria) for an adequate theory of computational implementation.
      *   **Context:** The user is undecided on whether the brain is a computer and wants to settle the *specification* of what "computation" means in this context first.
      *   **Specific Cases to Handle:**
          1.  Post-hoc mapping (triviality problem).
          2.  Look-up tables vs. algorithmic processing.
          3.  Physical dynamics (e.g., orbiting bodies described by equations).
          4.  Continuous vs. discrete states.
          5.  Observer-relativity vs. Objectivity (interpreter dependence).
          6.  Function computation vs. I/O realization.
          7.  Describable as computational vs. *is* a computer.
          8.  Computing vs. being *used* to compute.
          9.  State individuation (how physical states map to computational states).
      *   **Constraint:** Keep the brain in view (make the claim substantive, not trivially true/false).
      *   **Specific Task:** Flag incompatible requirements and identify the most exclusionary requirement.
      *   **Hypothesis to Test:** The tension between *Objectivity* (mind-independent) and *Non-Triviality* (not everything computes everything).
      *   **Output:** Focus on the criteria, brief note on existing families of accounts at the end.

  2.  **Analyze the Core Tension (The "Triviality Argument"):**

      *   *Putnam/Searle Argument:* Any open physical system can be mapped to any finite state automaton if we allow arbitrary, gerrymandered mappings of physical states to computational states.
      *   *Implication:* If "computation" is just structural isomorphism, then rocks, buckets of water, and brains all compute everything. This makes "the brain is a computer" trivial.
      *   *Requirement:* A theory must block this triviality while acknowledging that physical states don't come pre-labeled as "0" or "1".

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *D1: Non-Triviality (The Anti-Putnam Constraint).* Must prevent arbitrary post-hoc mappings from counting as implementation.
      *   *D2: Mechanism/Process Sensitivity.* Must distinguish between a look-up table and a step-by-step algorithm. (The user specifically asked for this).
      *   *D3: Physical Grounding.* Must explain how physical states individuate computational states (the "carving" problem).
      *   *D4: Objectivity vs. Relativity.* Must clarify if computation is in the eye of the beholder or in the system. (User's specific suspicion).
      *   *D5: Continuous/Analog Handling.* Must address systems that aren't obviously digital.
      *   *D6: Function vs. I/O.* Distinguish *how* the output is got from *what* the output is.
      *   *D7: Intrinsic vs. Extrinsic Use.* Distinguish a system that *is* computing from one merely *used* as a prop in a computation.
      *   *D8: Brain Applicability.* The result must make the neuroscientific claim substantive.

  4.  **Refining the Desiderata (Adding Considerations):**

      *   *Refining D1 (Triviality):* Call it "The Non-Gerrymandering Constraint." Consideration: Putnam's triviality proof.
      *   *Refining D2 (Process):* Call it "The Causal/Structural Constraint." Consideration: Look-up tables produce $f(x)$ but don't compute $f$ via steps.
      *   *Refining D3 (States):* Call it "The State Individuation Constraint." Consideration: Physics doesn't label voltage as '5'.
      *   *Refining D4 (Objectivity):* Call it "The Mind-Independence Constraint." Consideration: If computation requires an interpreter, is it a natural kind?
      *   *Refining D5 (Continuous):* Call it "The Analog/Digital Neutrality." Consideration: Neurons are arguably analog/spiking, not just binary.
      *   *Refining D6 (I/O vs. Computation):* Call it "The Hyperintensionality Constraint." Consideration: $x+1$ vs. $x+2-1$.
      *   *Refining D7 (Use vs. Is):* Call it "The Intrinsic Function Constraint." Consideration: A stick used to count vs. an abacus.

  5.  **Addressing the "Flag Incompatibilities" Instruction:**

      *   *The Big Conflict:* Objectivity (D4) vs. Non-Triviality (D1) + State Individuation (D3).
      *   *Why?* If computation is objective (physical), we need physical criteria to carve states. But physics is continuous/causal. If we rely *only* on causal structure, Putnam says we can still map anything to anything (via time-slicing). If we rely on semantics (what the states *mean*), we introduce the observer (violating Objectivity).
      *   *The "Most Exclusionary" Requirement:* Likely **The Causal/Structural Constraint (D2)** combined with **Mind-Independence (D4)**. Requiring specific causal mechanisms rules out look-up tables and trivial mappings, but risks making computation too rare or dependent on specific physical laws.
      *   *Testing the User's Suspicion:* The user suspects Objectivity vs. Non-Triviality is the knot. I need to confirm this. Yes, if you demand strict objectivity, you struggle to rule out trivial mappings without appealing to something like "function" or "purpose," which introduces relativity.

  6.  **Developing the Content (Drafting the response):**

      *   *Introduction:* Acknowledge the stakes (Brain as Computer).
      *   *The List:* Numbered desiderata with "Consideration" and "Case to Classify."
      *   *The Tension Analysis:* Explicitly address the flagged incompatibilities.
      *   *The "Most Exclusionary" Requirement:* Identify it.
      *   *Brief Survey:* Semantic, Syntactic, Mechanistic accounts.

  7.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I cover the orbiting body? *Adjustment:* Ensure D1 or D3 covers "dynamics described by equations" vs. "computation."
      *   *Check:* Did I cover the look-up table? *Adjustment:* Ensure D2 (Process) is strong.
