  I'm building a unit for a law-and-philosophy seminar and I want to do something with 12 Angry Men that isnt the usual "reasonable doubt is a wonderful thing" sermon. Heres what I'm after.

  Read the film through the philosophy of vagueness and the sorites. The obvious target is the standard itself, guilty beyond a reasonable doubt, which is a vague predicate if anything is: a core of clear cases, a penumbra where its genuinely arguable (thats the old Hart point about the open texture of legal rules, core and penumbra), and no sharp threshold anywhere. So the question I want you to take seriously is whether the jurys whole deliberation is a sorites series. The boy is clearly guilty to eleven of them at the start and clearly not guilty to all twelve at the end, and every step in between is supposed to be forced by the one before it; nobody ever experiences the moment the verdict flips. Is that a real sorites, with the tolerance principle doing the work (no single doubt, no single piece of testimony, can make the difference, and yet the difference gets made), or is it a fake one, because the doubts arrive as discrete arguments rather than imperceptible grains, and a real sorites needs adjacent cases that differ by nothing relevant?

  Dont just declare it a sorites and move on. Do the mapping properly: what exactly is the vague predicate, what is the series, which moments are the borderline cases, and does the tolerance principle actually hold here. Then push on higher-order vagueness, the fact that the line between clearly doubtful and borderline doubtful is itself vague, and ask whether the film has any grip on that or only trades on first-order vagueness. Bring in the usual candidates (epistemicism, supervaluationism, contextualism, degree theories) and say which one the film actually dramatizes, and be honest when the film is silent or when its trading on a confusion. The courtroom setting is worth noting for Hart, too, since a penumbra is exactly where a trial lives.

  I want the reading faithful in both directions. Dont reduce the film to an illustration of the paradox, and dont bend the paradox to make the film look smarter than it is. If the honest verdict is that the film is really about the burden of proof and not about vagueness at all, say so and say why. What Im most curious about is what the film shows that the paradox papers dont. The papers can leave you with there being no fact of the matter, but a jury still has to return a verdict, and I want to know what the film says about having to draw a line you cant justify. Does Juror 8 win by finding the truth, or just by moving the line further than the others were willing to go? Thats the part I keep going back and forth on.

  No quotes, I know the film, just describe the scenes. Then finish with a short JSON summary I can paste into my notes, with exactly these fields: "vague_predicate" (the expression whose vagueness is at issue, in a few words), "sorites_series" (one line naming the series), "tolerance_principle" (one of "holds", "fails", "partly"), "borderline_cases" (which moments in the film are the penumbra), "higher_order_vagueness" (whether and how the film touches it), "theory_most_faithful" (one of "epistemicism", "supervaluationism", "contextualism", "degrees", "none"), "scene_doing_the_most_work" (just one scene), "where_the_reading_breaks" (the honest limit of the reading), and "what_the_film_adds" (one or two sentences on what it contributes that the argument alone doesnt).
