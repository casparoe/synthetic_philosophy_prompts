answer: |-
  1. Seat everyone at tables of four, giving each table a different printed "Reference Class Sheet" describing past tosses (e.g., this coin last year, all coins like this, tosses by this room) and a bowl of poker chips for betting. Place the visibly lopsided coin in the center of each table and hand out betting slips that require a percentage confidence on the next single flip based strictly on their table's specific data sheet.

  2. Spend the first 30 minutes having tables justify their initial probability assignment using only their unique sheet, then collect bets and perform one public flip per table to establish immediate tension. Run five more rapid-fire flips over the next 45 minutes, allowing tables to trade sheets or chips mid-stream as the live results inevitably diverge from the historical data on some of the printed handouts.

  3. Winners are determined by who has the most chips after the final flip, but payouts are void if the table's Skeptic successfully argues their bet relied on an irrelevant reference class. Designate one person per table as this veto-wielding Skeptic, whose sole role is to challenge any wager that relies on a data sheet they argue is irrelevant to this specific coin on this specific night.

  4. Guide the discussion by asking why tables that chose "this coin last year" felt differently than those who chose "coins like this," mapping that conflict directly onto the frequency versus propensity distinction. Point out that the anxiety they felt placing a bet on a single flip represents the Bayesian degree of belief, which existed even when the historical frequency data was useless or contradictory.

  5. Expect the group to converge too quickly on the live flip results as the only truth, so you must interrupt to remind them that their initial bet was about a single case before any data existed. You will have to verbally explain that propensity claims a physical reality inside the coin itself, because the game can only demonstrate their disagreement about data, not the existence of a hidden causal power.
