answer: |-
  1. Your position rests on the claim that gene-level and group-level selection are mathematically equivalent descriptions of a single causal process. If that is true, there must be no empirical scenario where the causal story changes depending on which level you privilege. What specific piece of evidence, even in principle, would force you to admit that the *level* itself makes a causal difference rather than just a descriptive one?

     **Follow-up:** You will likely say that no such evidence exists because the levels are ontologically identical. But if your view is immune to empirical falsification regarding the *level*, are you not protecting a metaphysical assumption rather than advancing a scientific hypothesis?

  2. Critics like Sober and Wilson argue that deflationists commit the "averaging fallacy" by assuming that because you can mathematically average fitness across groups, you have thereby explained away the causal efficacy of the group. Why is averaging over group fitnesses not a loss of causal information about the mechanism of selection?

     **Follow-up:** You will likely argue that the covariance terms in the Price Equation preserve all causal information. But if the mechanism involves group extinction, does averaging not obscure the discontinuous causal event that actually drives the evolutionary change?

  3. The Price Equation partitions selection into within-group and between-group components, and you treat this as a coordinate system where the choice of origin is arbitrary. However, covariance is symmetric while causation is not. How does your deflationary account distinguish between a group property causing gene frequency change versus gene frequencies causing the group property to emerge?

     **Follow-up:** You will likely reply that the distinction is pragmatic, based on which variable is more stable. But if stability determines causality, does that not mean causality is relative to the observer's timescale rather than a feature of the biological system itself?

  4. Damuth distinguishes MLS1 (selection on individuals within groups) from MLS2 (selection on groups as reproducing entities). You argue MLS2 can always be reduced to MLS1 terms. Does this reduction hold when a group reproduces via fission without a clear bottleneck of individual replicators, as in some microbial mats?

     **Follow-up:** You will likely say the genes still replicate during fission. But if the group structure dictates the fidelity of that replication, isn't the group acting as a replicator in a way that a mere collection of genes cannot be?

  5. Hull's distinction between replicators and interactors suggests that selection acts on interactors (phenotypes) while replicators (genes) are what get copied. If your two-descriptions view is correct, do interactors retain any causal autonomy, or are they merely epiphenomenal shadows of the underlying genetic bookkeeping?

     **Follow-up:** You will likely insist interactors are causally efficacious but described via genes. But if the interactor's causal power is fully exhaustible by gene-level descriptions, what work is left for the concept of the "interactor" to do that isn't redundant?

  6. Consider the evolution of eusociality, where gene-centric models and multilevel models often disagree on the parameter space required for altruism to evolve. If the debate is merely verbal, why do these models yield different predictions about the stability of sterile castes under ecological stress?

     **Follow-up:** You will likely argue the models are mathematically translatable and the differences are due to parameter estimation. But if researchers using the group-level model identify a stability threshold that the gene-level model misses, isn't that a predictive failure for the gene-centric description?

  7. If the units-of-selection debate is not about which level *really* selects, what exactly have the participants been disagreeing about for the last forty years? Are you suggesting that Dawkins, Gould, and Wilson were all talking past one another about nothing substantive?

     **Follow-up:** You will likely say they were disagreeing about heuristic utility, not ontology. But given the intensity of the rhetoric, are you not implying that major figures in the field were confused about the metaphysical commitments of their own theories?

  8. Is your view a form of pragmatic pluralism that leaves the actual science unchanged, or is it the stronger claim that the entire debate has been a category mistake? If it is the latter, does that mean the literature produced during the debate is scientifically tainted?

     **Follow-up:** You will likely say the literature is useful but the interpretation was wrong. But if the interpretation drives the experimental design, does correcting the interpretation not require re-evaluating the data gathered under the "wrong" ontological assumption?

  9. Suppose a graduate student accepts your deflationary account tomorrow. How should their research program differ from a colleague who believes group selection is ontologically real? Should they stop asking "which level is selected" in their papers?

     **Follow-up:** You will likely advise them to use the most tractable model. But if they publish a paper claiming "group selection caused X" without the deflationary caveat, are they not perpetuating the very confusion you argue we need to escape?
