      *   Paragraph 2: Address the retraction. You must retract the claim to *know* the individual substantive claims (1-239). You should have testified that you were *justified in believing* them or that they were *verified to the best of human ability*, but not that you *knew* them in the strict sense that permits aggregation. You can know the general fallibility (240) based on induction about human error, but you cannot know the specific instances sufficiently to override that induction.

