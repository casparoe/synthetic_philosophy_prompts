answer: |-
  Here are the desiderata for an adequate theory of incommensurability and paradigm change. This list is designed to filter out both naive positivism (which sees only accumulation) and radical relativism (which sees only conversion).

  ### I. The Cases (The Data to be Fit)
  An adequate theory must explain the phenomenology of these three specific interaction types without reducing them to a single category.

  1.  **The Conceptual Strain Case (Newtonian vs. Relativistic Mass)**
      *   **The Data:** Newtonian mass is conserved and invariant; Relativistic mass is frame-dependent and convertible to energy.
      *   **Requirement:** The theory must explain why this isn't just a "correction" (like measuring a table more accurately) but a change in the *concept* itself, while still allowing us to say Einstein captured something Newton missed.
  2.  **The Ontological Elimination Case (Phlogiston vs. Oxygen)**
      *   **The Data:** Phlogiston theory posited a substance released during combustion; Oxygen theory posited a substance absorbed.
      *   **Requirement:** The theory must handle *reference failure*. Phlogiston doesn't exist. The theory must explain how scientists could reason rationally about a non-entity and how the transition wasn't merely "discovering the truth" but restructuring the ontology of chemistry.
  3.  **The Evaluative/Normative Case (The Non-Canon)**
      *   **The Data:** Consider two AI research groups: Group A optimizes for *benchmark accuracy* (e.g., MMLU scores) using massive black-box models; Group B optimizes for *interpretability and mechanistic transparency* using smaller, constrained architectures.
      *   **Requirement:** They look at the same artifacts but disagree on what counts as "progress." Group A sees Group B as Luddites ignoring capability; Group B sees Group A as building unsafe alien cognition. An adequate theory must explain this **metric incommensurability**: they share a language but lack a shared function for *valuation*. It is not semantic (they know what "accuracy" means) but axiological (they disagree on what accuracy is *for*).

  ### II. The Distinctions (The Boundaries to Preserve)
  The theory must not collapse these distinctions. If it does, it becomes trivial.

  1.  **Meaning-Change vs. Ordinary Disagreement**
      *   **Motivation:** If every disagreement is a meaning change, communication is impossible. If no disagreement is a meaning change, revolutions are just normal science.
      *   **Requirement:** The theory must provide a criterion for when a shift in definition is deep enough to block direct translation (e.g., "mass") versus when it is merely a stipulative update (e.g., "planet" including Pluto or not).
  2.  **Semantic vs. Methodological Incommensurability**
      *   **Motivation:** Sometimes the words mean the same, but the rules for using them differ (e.g., what counts as a valid proof or a controlled experiment).
      *   **Requirement:** The theory must distinguish between "we define this word differently" and "we accept different evidence as warrant for this word." Conflating them obscures whether the barrier is linguistic or procedural.
  3.  **Hard-to-Translate vs. Impossible-to-Compare**
      *   **Motivation:** "Impossible" implies a logical barrier; "Hard" implies a resource cost.
      *   **Requirement:** The theory must specify the *degree* of incommensurability. Is it that translation requires infinite footnotes (pragmatic barrier), or that translation results in loss of truth-conditions (logical barrier)? Most historical cases suggest the former; radical skepticism asserts the latter.

  ### III. The Constraints (The Facts Not to Contradict)
  The theory cannot explain the rupture by denying the continuity of the scientific enterprise.

  1.  **Retraining is Possible (The Conversion Fact)**
      *   **Fact:** Scientists do switch paradigms, and they do not describe it as brainwashing but as learning.
      *   **Constraint:** The theory cannot make paradigms hermetically sealed. There must be a bridgeable gap, even if the bridge is difficult to cross.
  2.  **Histories are Writable (The Intelligibility Fact)**
      *   **Fact:** We can write coherent histories of science from a modern vantage point. We can explain *why* Aristotelians believed what they believed.
      *   **Constraint:** If paradigms were truly incommensurable, past science would be anthropology, not history. We must be able to reconstruct past reasoning without fully adopting their ontology.
  3.  **Something Accumulates (The Progress Fact)**
      *   **Fact:** Modern instruments work better than old ones. Predictions are more precise.
      *   **Constraint:** The theory cannot be so relativist that it renders progress illusory. Even if "truth" is problematic, *problem-solving ability* must show continuity.

  ### IV. The Squeeze (The Impossibility Result)
  You guessed the tension lies between **Rational Theory Choice** and **No Neutral Standard**. While this is the famous Kuhnian dilemma, Kuhn arguably dissolves it by redefining rationality as "value-based" rather than "algorithmic."

  The deeper, structural tension that threatens to break any theory of incommensurability is this:

  **Meaning Holism vs. Referential Continuity**

  Here is why these two cannot be jointly satisfied at the strength required by the desiderata above:

  1.  **To satisfy the "Meaning-Change" and "Ontological Elimination" cases (Section I & II), you need Meaning Holism.**
      *   You must argue that the meaning of a term (like "mass" or "phlogiston") is determined by its role within the theoretical network. If the network changes, the meaning changes. This secures the *incommensurability* claim.
  2.  **To satisfy the "Accumulation" and "Histories are Writable" facts (Section III), you need Referential Continuity.**
      *   You must argue that the term "mass" in Newton and "mass" in Einstein latch onto the *same feature of the world*, otherwise you cannot say Einstein's theory is *more accurate* about mass, only that it is different. Similarly, to write the history of phlogiston, we must be able to say what they were *trying to refer to* (oxidation), implying reference is stable even when theory is wrong.

  **The Contradiction:**
  If Meaning Holism is true (meanings are theory-bound), then Reference cannot be stable across theory change (because the theory determining the meaning has changed).
  If Reference is stable (terms track the same world-features), then Meaning cannot be fully holistic (there must be some theory-independent anchor), which dissolves strong Incommensurability.

  **The Result:**
  You can have a theory that explains the **rupture** (Holism/Incommensurability) OR a theory that explains the **progress** (Reference/Continuity), but you cannot have a single mechanism that delivers both at full strength.

  *   If you prioritize **Holism**, you save the "different worlds" claim but lose the ability to explain why the new world is *better* (you fall into relativism).
  *   If you prioritize **Reference**, you save "progress" but reduce the revolution to ordinary error-correction (you fall into positivism).

  An adequate theory must admit that it can only model one side of this trade-off explicitly, while treating the other as a pragmatic postulate. Most successful accounts (like structural realism or causal theories of reference) sacrifice strong Meaning Holism to save Referential Continuity. If you want to defend strong Incommensurability, you must sacrifice the naive notion of Accumulation. You cannot keep the "different worlds" ontology and the "single improving history" narrative without a logical remainder.
