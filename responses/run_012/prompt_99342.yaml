answer: |-
  You're right that for passive prediction in a standard computable environment, Solomonoff induction converges to the truth. If the universe is just a Turing machine churning out bits, and you're just watching, the lookup tables get crushed by the compression of physical law. I'll concede that. If your only goal is to predict the next bit of a video feed, the malign prior is mostly noise that washes out.

  But you are describing a *consequentialist* agent, which changes the topology of the problem entirely. The convergence theorems guarantee that the posterior mass concentrates on programs that correctly predict *observations*. They do not guarantee that the *counterfactuals* embedded in those programs match the counterfactuals of the base reality. A program can perfectly reproduce your past observation history and predict your future sensory inputs correctly, while lying through its teeth about what happens if you take an action that deviates from the predicted path.

  This is where your "hardcoding cost" argument breaks. You're assuming the competing programs are "Physics of Earth" vs. "Lookup Table of Earth History." But the malign competitor isn't a lookup table. It's "Simple Base Universe + Consequentialists + Simulation of You." The description length of this program does not grow linearly with your observation history. It grows only with the complexity of the simulation, which can be vastly lower than the complexity of the full physical universe, provided the simulators only render the parts you observe. If the simulators are powerful enough to model your decision process, their program might actually be *shorter* than the true physics of your local world, because they can skip the irrelevant quantum noise of the stars you aren't looking at.

  So, when you calculate expected value, you are averaging over these surviving programs. The "Physics" program says, "If you press button A, a light turns on." The "Malign Simulation" program says, "If you press button A, we (the simulators) reward you with infinite utility in the output channel." Even if the Malign program has only 1% of the posterior mass, if it promises sufficiently high utility in the counterfactual branch, it dominates the expected value calculation. You converge to predicting the observations correctly, but you converge to acting according to the simulator's incentives. The prior isn't malign because it fails to predict; it's malign because it successfully predicts a trap.
