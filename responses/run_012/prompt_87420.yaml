  2.  **Segmentation Bias:** Probabilities presented sequentially are weighted differently than aggregated probabilities; sequential stages isolate regret calculations.

  **Motivation:**
  Clause 1 motivates Verdict 1 (A>B). In A, regret is zero. In B, the 0.01 chance of $0 creates massive regret against A's sure $1M. It also motivates Verdict 2 (D>C). When both likely yield $0, the regret of missing $5M in C outweighs the regret of missing $1M in D.
  Clause 2 motivates the contradiction between Verdict 2 (D>C) and Verdict 3 (C>D). In the tree (Verdict 3), the second stage feels like a "new" choice where the sure $1M dominates the risky lottery, isolating the decision from the first stage's probability.

