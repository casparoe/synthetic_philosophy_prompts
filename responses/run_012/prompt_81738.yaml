      *   **The Friend's Likely Move:** Diagnosis of the rhetorical strategy.
      *   **Least Certain Point:** As requested.
      *   **Coffee Talk Advice:** How to use this info.

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to strawman the friend. Priest is a serious philosopher. The view *is* defensible, even if the friend's deployment was annoying.
      *   *Clarification:* Distinguish between "sentence" and "proposition." Dialetheism is usually about propositions/states of affairs, not just ink on paper.
