answer: |-
  You are right to be frustrated. The sentence "some contradictions are true" is a philosophical shibboleth that functions like a Rorschach test. Depending on how you cash out "contradiction" and "true," it ranges from a mathematical triviality to a metaphysical absurdity. Your hunch is correct: the work is being done by the ambiguity of those two terms, and the word "some" is doing the heavy lifting of distinguishing dialetheism from trivialism (the view that *everything* is true).

  Here is the menu of precise readings, classified by their philosophical weight, followed by the analysis of the "LNC is optional" move and your friend's likely rhetorical strategy.

  ### The Menu of Readings

  #### 1. The Model-Theoretic Reading (The "Logic Game" View)
  *   **Cash Out:** "Contradiction" = a formula of the form $A \land \neg A$ in a formal system. "True" = assigned the value '1' (or 'Both') in a specific semantic model (like LP logic).
  *   **Claim:** There exist formal semantic models where a contradiction receives a designated value.
  *   **Verdict:** **Platitude.** This is mathematically uncontroversial. Graham Priest and others have constructed these models explicitly. It is a claim about the consistency of a mathematical structure, not the world.
  *   **Confidence:** 99%
  *   **Likely Friend Usage:** Low. This is too technical to use as a conversation-stopper in casual debate, though it underpins her confidence.

  #### 2. The Pragmatic/Assertibility Reading (The "Language Use" View)
  *   **Cash Out:** "Contradiction" = a speech act of asserting $A$ and $\neg A$. "True" = rationally acceptable or warranted to assert.
  *   **Claim:** There are situations where a rational agent is warranted in asserting a contradiction (e.g., to avoid paradox or capture vague boundaries).
  *   **Verdict:** **Substantive and Defensible.** This is a claim about epistemology and norms of assertion. It suggests our norms of rationality should be paraconsistent.
  *   **Confidence:** 90%
  *   **Likely Friend Usage:** Medium. This is often what people *mean* when they feel cornered, but dialetheists usually want to claim more than just "we can say it."

  #### 3. The Propositional/Realist Reading (The "Standard Dialetheist" View)
  *   **Cash Out:** "Contradiction" = a proposition (the content of a sentence) that entails its own negation. "True" = corresponds to reality / obtains as a fact.
  *   **Claim:** There exists at least one proposition $p$ such that the fact that $p$ obtains and the fact that $\neg p$ obtains are both part of reality.
  *   **Verdict:** **Substantive, Controversial, Metaphysical.** This is the actual core thesis of dialetheism. It claims the world itself is inconsistent, not just our descriptions of it.
  *   **Confidence:** 95%
  *   **Likely Friend Usage:** **High.** This is the "hammer" she is trying to swing. She wants to deny that reality forbids contradictions.

  #### 4. The Disquotational/Deflationary Reading (The "Semantic" View)
  *   **Cash Out:** "Contradiction" = a sentence $S$. "True" = merely a device for disquotation (to say "$S$ is true" is just to say $S$).
  *   **Claim:** Some sentences of the form "$S$ and not-$S$" are assertible.
  *   **Verdict:** **Leads to Reading 3.** If you accept deflationism, saying "The Liar Sentence is true" is equivalent to asserting the Liar Sentence itself. So this collapses back into the Metaphysical Reading. You cannot hide behind deflationism to make the claim lighter.
  *   **Confidence:** 85%
  *   **Likely Friend Usage:** Low. She probably hasn't thought about deflationism, but if she tries to retreat here, she should know she hasn't escaped the metaphysical commitment.

  #### 5. The Category Mistake Reading (The "Classical" Objection)
  *   **Cash Out:** "Contradiction" = by definition, a falsehood. "True" = by definition, not false.
  *   **Claim:** The sentence is analytic nonsense, like "some bachelors are married."
  *   **Verdict:** **False (from her view), True (from yours).** From a classical logician's perspective, this is correct: truth and contradiction are mutually exclusive by definition. From a dialetheist's perspective, this begs the question against them.
  *   **Confidence:** 95%
  *   **Likely Friend Usage:** N/A. She is explicitly rejecting this reading.

  ---

  ### The "LNC is Optional" Move

  For her claim that "the Law of Non-Contradiction (LNC) is just a convention" to go through, she needs **Reading 3 (The Propositional/Realist View)**.

  *   **Why:** If she only means Reading 1 (Model-Theoretic), she has only proved that LNC is optional *for logicians building systems*, not that it is optional *for reality*. She can build a logic without LNC, but that doesn't mean the world violates LNC. To say LNC is a "convention" implies that the constraint isn't in the world, but in our rules. That requires the world to be capable of sustaining contradictions (Reading 3).
  *   **Do the Paradoxes Get Her There?** **No.** This is the critical gap.
      *   The Liar Paradox and semantic paradoxes provide a *motivation* for dialetheism. They show that if you want to keep "naive truth" (the idea that "Snow is white" is true iff snow is white) and classical logic, you explode.
      *   You have three choices: (1) Keep Classical Logic, dump Naive Truth (Tarski/Hierarchy); (2) Keep Naive Truth, dump Classical Logic (Priest/Dialetheism); (3) Keep both, accept Trivialism (absurd).
      *   The paradoxes show she *can* choose option 2 without being irrational. They do not *prove* option 2 is the correct description of the world. She is treating a "permissible solution to a paradox" as a "discovered fact about metaphysics." That is a separate jump.

  ### Diagnosis of Your Friend

  She is likely conflating **Reading 1** with **Reading 3**.

  This is a common rhetorical move in introductory logic debates. She knows that paraconsistent logic *exists* (Reading 1: it's mathematically coherent). She uses the existence of that logic to shield the metaphysical claim (Reading 3: the world is like that). When you press her on the metaphysics, she retreats to the logic ("It's possible in LP logic!"). When you press her on the logic, she retreats to the metaphysics ("Reality is inconsistent!").

  The slogan "some contradictions are true" allows her to slide between these two.
  *   If you attack the metaphysics, she means "true-in-a-model."
  *   If you attack the model, she means "true-in-reality."

  **Verdict on her argument:** She is saying something substantive (Reading 3), but she is using the technical defensibility of Reading 1 to insulate Reading 3 from criticism. She is treating a *logical possibility* as a *metaphysical license*.

  ### Confidence Levels & The Flag

  *   **Confidence in Menu Classifications:** High (90%+). These are standard distinctions in the literature.
  *   **Confidence in Friend's Diagnosis:** High (85%). This is the standard "intro to paraconsistency" rhetorical pattern.
  *   **Confidence in Paradox Analysis:** High (90%). Paradoxes motivate but do not entail dialetheism.

  **The Single Point of Least Certainty:**
  I am least certain about the **ontological status of "True" in Reading 3**.
  *   *Why:* Even among dialetheists, there is debate about whether "truth" is a robust property of the world or a normative status of acceptance. Priest tends toward realism (truth is a property), but some paraconsistent pragmatists treat it more like Reading 2. If your friend is a pragmatist, my diagnosis that she needs Reading 3 to make the "LNC is optional" claim might be slightly off—she might think making LNC optional *in our norms* is enough. However, given she invoked "the world" implicitly by challenging your "can't be both true and false" claim, Reading 3 is the safer bet.

  ### Coffee Talk Strategy

  When you meet her, do not say "You are wrong." Say: "I looked into the semantics of your claim. I think you are sliding between two readings."

  1.  **Ask:** "When you say 'true', do you mean 'assigned a value in LP logic' or 'obtains in reality'?"
  2.  **If she says Logic:** Concede the point. "Okay, sure, models exist. But that doesn't mean the LNC is false in the world, just that we can ignore it in math."
  3.  **If she says Reality:** Ask: "Does the Liar Paradox *force* reality to be inconsistent, or does it just force us to choose between changing logic or changing truth?"
  4.  **The Kill Shot:** "You're using the existence of a paraconsistent *map* to prove the *territory* is inconsistent. I agree the map is possible. I don't agree the territory matches it."

  This validates her reading (Priest is serious) without accepting her conclusion (that the debate is over).
