      *   **Context:** The user had a 3-hour argument with a friend about dialetheism (the view that some contradictions are true). The friend reads Graham Priest/paraconsistent logic and uses "some contradictions are true" as a conversation-stopper. The user feels the friend might be talking nonsense or hiding behind ambiguity.
      *   **Task:** Dissect the sentence "some contradictions are true."
