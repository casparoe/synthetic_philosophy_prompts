prompt: |-
  My friend and I got into it for like three hours last night about dialetheism. She's been reading Priest and a bunch of paraconsistent-logic stuff, and now she keeps deploying the line "some contradictions are true" like it's a conversation-ender. It started because I said you can't just have a sentence that's both true and false, she said "why not," and every time I tried to pin her down on what she actually meant she'd just repeat the slogan, or escalate to "so the law of non-contradiction is just a convention then." I don't think she's dumb but I also don't think she was saying anything, and I couldn't tell which.

  What I want from you: take that one sentence, "some contradictions are true," and lay out the menu of precise things it could be claiming — from the boring/trivial readings, through the ones that are really claims about language or about how we use the word "true," up to the ones that are full-on theses about the world. For each reading, tell me whether it's a platitude, a substantive and defensible claim, or just false/incoherent, and which one she probably meant given that she was using it to shut down the "both true and false" objection. I have a hunch that half the load is on "contradiction" and half on "true," and that depending on how you cash those two out the slogan slides from "duh, obviously" to "a real metaphysical position" to "not even a thing you can believe." The "some" feels load-bearing too — she never said all.

  Also: for the "LNC is optional" move to actually go through, which of those readings does she need? And does the usual dialetheist toolkit (the Liar, semantic paradoxes, whatever) even get her there, or is that a separate jump?

  Then say how confident you are in each verdict and flag the single point you're least sure about, because I'm going to recite this back at her over coffee and I don't want to get it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

