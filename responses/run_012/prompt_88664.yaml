      *   *Pascal's Actual View:* Pascal was a Jansenist Catholic. He believed in Original Sin. He believed human reason is corrupted (*divertissement*, *ennui*). He *did* believe in objective truth and God, but thought reason alone couldn't reach it without Grace. He famously said, "Justice without force is powerless; force without justice is tyrannical." He advocated submitting to established law *not* because it is just, but because it is established (to avoid chaos), while acknowledging its lack of inherent justice.
