answer: |-
  Dear Colleague,

  It is a rare pleasure to encounter an argument constructed with such physiological precision, where the joints are clear and the flow of logic mimics the homeostatic systems you spent your career studying. You have reconstructed a version of the integrity objection that is familiar to moral philosophers, yet you have pushed it further than most by turning it back upon ordinary morality and then attempting to force a resolution through exhaustion. The discomfort you feel at the conclusion is a reliable signal, much like pain in a living organism, indicating that while the pathway seems clear, the destination is incompatible with life. You asked for a diagnosis of where the argument fails, the cost of the available choices, and specifically whether the distinction between system and mechanism offers a genuine defense. I will address these in turn, keeping to the continuous form you requested.

  The distinction you recall from your old field between the specification of what a system does and the mechanism that produces it is not merely a convenient analogy here; it is the precise key that unlocks the deadlock. In physiology, a system might be defined by its output, such as maintaining core temperature within a narrow range, while the mechanism involves shivering, vasoconstriction, or metabolic changes that occur without conscious intervention. If the organism had to consciously calculate heat loss and deliberately command every shiver to maintain homeostasis, it would indeed be estranged from its own bodily existence, paralyzed by the cognitive load of survival. Moral theories function similarly. There is the criterion of rightness, which specifies what makes an action correct, and there is the decision procedure, which is the psychological mechanism the agent uses to choose. Your argument falters at step two because it conflates these two levels. Step two claims that a theory requires the agent, at the moment of action, to weigh attachments against impersonal claims. This is true only for a direct consequentialist who believes the decision procedure must mirror the criterion of rightness. However, an indirect consequentialist can argue that the theory requires the agent to cultivate dispositions, habits, and loves that operate precisely without such weighing. On this view, the system is consequentialist, but the mechanism is composed of the very partial attachments you value. Therefore, step two is not universally true, and the inference to step four collapses. The theory does not impose the requirement of conscious weighing at the moment of action, so it does not necessarily produce the estrangement described in step three.

  This brings us to the man saving his wife, described in step five. You ask whether he is the ideal or merely misdescribed. He is not misdescribed, but the implications drawn from his description in step six are where the error lies. When Williams speaks of one thought too many, he is identifying the proper motive, not denying the existence of a justification. The man saves his wife because he loves her, not because he has calculated permission. This is the healthy mechanism. However, step six claims that ordinary morality demands the surplus thought. This is a misunderstanding of how moral justification works in ordinary life. Ordinary morality requires that the action be permissible, not that the permission be the conscious motive. We can accept that the man acted rightly because he loves his wife, while simultaneously holding the theoretical view that such partiality is permissible within a broader moral framework. The justification exists at the level of reflection, not necessarily at the level of action. To demand that the justification be present to consciousness at the moment of action is to demand that the mechanism constantly display the specifications of the system, which, as your physiological analogy suggests, would be maladaptive. Thus, ordinary morality is not estranging in the way you suggest, because it does not demand the surplus thought as a motive, only as a possible account upon reflection.

  If we follow this diagnosis, the catastrophic conclusion in step ten dissolves. You argue that because the objection condemns every action backed by principle, and a theory requires backing, the objection proves too much and leaves us with consequentialism. This is a false rescue. If the integrity objection proves that all codified morality is estranging, it does not make consequentialism acceptable; it makes all theory unacceptable under the strictures of step one. You cannot save consequentialism by showing that its rivals also fail the test, unless you weaken the test itself. Since you have stated a preference for keeping step one, you must reject the inference that all theory requires conscious backing at the moment of action. The commitment here is to accept that moral agents can act rightly without having the moral theory consciously present to their minds. This preserves integrity but sacrifices a certain kind of transparency. It means admitting that we cannot always articulate our moral reasons while we act, only after the fact. For a scientist, this might feel like accepting black boxes within the system, but it is a necessary black box to prevent the system from crashing under the weight of its own processing demands.

  Now consider the costs of the alternative choices, should you decide this diagnosis is insufficient. If you choose to keep step five and abandon step one, you are accepting that morality is inherently alienating. The cost here is high. It commits you to the view that to be a moral agent is to stand outside oneself, to treat one's own life and loves as data points in a calculation that does not belong to you. This is the view that morality is a demand external to human nature, something we must submit to rather than something that grows out of our form of life. You would be accepting that integrity is a luxury we cannot afford if we wish to be good. This contradicts the intuition that morality is supposed to guide human flourishing, not replace it. Given your background, you might recognize this as akin to demanding an organism consciously control its digestion to ensure it is nutritious; the effort to control it destroys the function. Abandoning step one saves the theoretical consistency but kills the patient.

  If you choose to keep step two and abandon step five, you are claiming that the man saving his wife really ought to be thinking about the permissibility of saving her. The cost here is the loss of the phenomenological truth of human relationships. It commits you to a picture of human psychology where love is always mediated by principle. This is not only counterintuitive but psychologically implausible. It turns the agent into a perpetual judge rather than a participant in their own life. This is the estrangement you sought to avoid in step one, so this path leads you back to the problem you started with. It is the least viable option, as it requires denying the obvious texture of human experience to save a theoretical constraint about deliberation.

  The most stable position, and the one that respects your desire to keep step one, is to abandon step two and the associated assumption in step six that justification must be conscious to be valid. This allows you to maintain that a moral theory is unacceptable if it estranges us from our projects, while denying that consequentialism or ordinary morality necessarily requires that estrangement. The cost of this choice is that you must accept a distinction between the truth of a moral claim and the psychological process of arriving at it. You must accept that the right reason for acting is not always the reason present to the mind when acting. This might feel like a compromise on intellectual honesty, as if you are permitting agents to act in ignorance of the true grounds of their action. However, it is no more dishonest than a homeostatic system maintaining pH balance without the organism knowing what pH is. The commitment is to a form of moral realism that acknowledges the limits of conscious deliberation. It requires you to view moral theory as a tool for evaluating lives and institutions, rather than a script for every moment of decision.

  In summary, the argument fails because it assumes that the governance of a theory requires the conscious presence of that theory at the moment of action. This is the step that must be abandoned. It looked plausible because we often equate rational agency with conscious reasoning, assuming that to act freely is to act with full explicit awareness of our principles. But as you know from physiology, the most vital functions are often the most automatic. Abandoning this step commits you to a view where moral integrity is preserved by allowing our deepest commitments to operate as mechanisms rather than calculations. It saves consequentialism from the charge of necessary estrangement, not by changing the subject, but by correcting a misunderstanding of how theories govern behavior. It saves ordinary morality from the same charge by recognizing that permission does not require conscious citation. You are left with a view where morality supports life rather than competing with it, provided we stop demanding that the support beams be visible in every room of the house. I hope this diagnosis offers the clarity you sought without requiring you to sacrifice the intuition that our attachments are what make us who we are.
