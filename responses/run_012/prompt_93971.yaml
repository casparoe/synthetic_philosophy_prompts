  2.  **Analyze the 7 Commitments:**
      1.  *Prioritarianism:* Moral value of benefiting people diminishes as they are better off (absolute terms). Inequality *per se* is not bad.
      2.  *Levelling-Down Objection (LDO):* Egalitarianism is false because it allows making everyone worse off just to achieve equality.
      3.  *Luck Egalitarianism (LE) on entitlement:* Claims for help depend on brute luck vs. option luck.
      4.  *Responsibility/Arbitrariness:* Morally arbitrary factors (unchosen) shouldn't fix prospects.
      5.  *Humanitarian Minimum:* Emergency care is unconditional (no one left to die).
      6.  *Responsibility:* People should be held responsible for choices.
      7.  *Case Verdict:* Helmet guy (option luck) shouldn't jump queue over genetic disease guy (brute luck).

  3.  **Identify Potential Tensions:**

      *   **1 (Prioritarianism) vs. 3 (Luck Egalitarianism):**
          *   *Analysis:* Prioritarianism focuses on *absolute welfare levels* (the worse off, the more weight). Luck Egalitarianism focuses on the *source* of disadvantage (luck vs. choice).
          *   *Conflict:* A person could be very badly off due to option luck (gambling loss). Prioritarianism says help them (they are badly off). LE says don't help them (it was their choice).
          *   *Severity:* High. This is a classic theoretical clash in political philosophy (Prioritarianism vs. Luck Egalitarianism).

      *   **3 (Luck Egalitarianism) vs. 5 (Humanitarian Minimum):**
          *   *Analysis:* LE says if you chose the risk, you bear the cost. Commitment 5 says even if you brought it on yourself, we won't let you die in the street.
          *   *Conflict:* Commitment 5 acts as a "floor" that overrides LE's harshness.
          *   *Severity:* Moderate/Manageable. Many LEs accept a humanitarian minimum to avoid the "harshness objection." It's a modification, not a destruction, of LE.

      *   **1 (Prioritarianism) vs. 7 (Case Verdict):**
