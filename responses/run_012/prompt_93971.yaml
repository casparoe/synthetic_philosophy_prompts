  10. **Final Polish:** Ensure the "Cheapest fix" and "Cost" columns are practical for a seminar presentation.

      *(Self-Correction on Row 1)*: I should combine 1 vs 3 and 1 vs 7 as they are the same theoretical clash, but 1 vs 3 is the principle, 1 vs 7 is the application. I'll focus on 1 vs 3 as the root.
