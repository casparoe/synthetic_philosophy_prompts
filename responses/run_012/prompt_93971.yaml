      *Refining the 2 vs 3 tension:* The user says "Egalitarianism as such is out" (2) but "I'm also a luck egalitarian" (3). This is semantically tricky but philosophically common (Telic vs. Deontic). It's an apparent tension mostly. I should rank it lower.

