answer: |-
  Hi there,

  It is completely understandable that you found yourself stuck as a referee because Maya and Dev are reenacting a debate that has occupied philosophers of law, language, and logic for the last century. You are dealing with the tension between logical consistency and social functionality, and both of them are capturing half of the truth while missing the mechanism that joins them. To break this down step by step, Maya is logically correct in her initial diagnosis but practically mistaken in her solution, while Dev is practically correct in his description but logically vague about how stability is achieved. When Maya argues that the wiki needs a founder outside the rules to avoid paradox, she is invoking what legal theorists call a Grundnorm or a basic norm, a starting point that validates the rest of the system without needing validation itself. In a purely formal logical system, she is absolutely right that a rule cannot consistently validate its own modification without risking a paradox where contradictory versions of the rule are simultaneously valid. However, Dev is right to push back that in a social system like a wiki, the founder is not logically outside the system but socially distinct, and treating them as a logical necessity ignores how these systems actually survive.

  The crux of their disagreement shifts when they discuss the community practice, and this is where you need to look closely at whether Dev is smuggling in an inviolate level. Maya claims that community practice is just a relabeled inviolate level, and in terms of function, she is correct because the practice acts as the final stopper for the infinite regress of rules. If the voting rule can be changed by a vote, something must decide which vote counts, and that something is the shared acceptance of the participants. However, Dev is right to insist that this practice is not a level in the hierarchy because it is not a symbolic representation like a page or a rule. It is a fact of behavior, not a norm. Maya confuses the function of stopping the regress with the structure of a hierarchy. She thinks that because the practice stops the regress, it must be a higher rule, but Dev correctly identifies it as the ground upon which the rules sit, not another floor in the building. So, on the specific question of whether community practice is a genuine escape, Dev is right that it is not a rule, but Maya is right that it performs the essential stabilizing function of an inviolate level.

  Regarding Maya's demand for a foundation, you have to distinguish between a logical foundation and a pragmatic one. Maya treats the lack of a logical foundation as a fatal flaw, implying the system should collapse, but Dev points out that it does not collapse as long as people participate. Here, Dev is right that her demand is a confusion if she expects the wiki to stop working without a logical foundation, because human systems run on consensus, not just consistency. However, Maya is right that without some form of acceptance, the system has no authority, only force. The difference is that Maya thinks this acceptance must be codified as a rule or a person, whereas Dev understands it as a ongoing state of affairs. When they argue about the voting regress, Maya says infinite regress isn't a foundation, which is logically true, but Dev says it doesn't need to be, which is pragmatically true. In this exchange, Dev wins the point about functionality, but Maya wins the point about logical purity. The system works not because the regress ends, but because the participants agree to stop looking down the turtle stack and just write on the page.

  The Escher analogy of Drawing Hands is helpful but ultimately misleading in this specific context, and pointing this out might help them see what they are missing. Escher's drawing shows a tangled hierarchy where cause and effect loop back on each other, but as you noted, there is a paper and an artist outside the drawing. In the wiki, the software code and the server infrastructure act as the paper and the artist. They are the actual inviolate level because the community cannot edit the code simply by editing a wiki page. Maya uses the drawing to argue for a need for an artist, which is correct regarding the software, but she applies it to the social rules where there is no single artist. Dev uses the drawing to argue for the tangle, which is correct regarding the social rules, but he ignores that the tangle is supported by the technical layer. The analogy misleads them because it suggests the hands are all there are, whereas the wiki has a technical substrate that is actually inviolate to the users, which resolves the paradox technically even if not socially.

  What both of them are missing, and what really settles the dispute, is the distinction between a rule and the activity of following a rule, a point famously made by Ludwig Wittgenstein. Maya assumes that a rule must contain its own application, that the text on The Rules page should dictate how it is enforced without external input. Dev assumes that the activity replaces the need for the rule. The truth is that a rule is inert without the activity of following it, and the activity is chaotic without the rule to guide it. The edit war happens because they are treating the rule as a magical object that enforces itself. When someone changes The Rules, the rule doesn't stop them; the community stops them by refusing to recognize the change. This refusal is not a rule, it is an action. Dev comes closer to this by emphasizing practice, but he treats it as a substitute for rules rather than the lifeblood of them. Maya comes closer by seeing the need for authority, but she locates it in a static position rather than a dynamic action.

  So, if you must referee who is right at each step, Maya is right that logical self-reference creates paradoxes and that something outside the symbolic system is needed to resolve them, but she is wrong that this something must be a person or a higher rule. Dev is right that the system functions through tangled hierarchies and ongoing practice, but he is wrong to dismiss the need for stability as merely turtles all the way down without acknowledging that the turtles stop moving at the point of social consensus. Dev's community practice is a genuine escape from the tangle only if you accept that the escape is into the real world of human behavior rather than into a higher logical plane. Maya's demand for a foundation is a real requirement for logical consistency but a confusion regarding social operation. The wiki works not because it solves the paradox, but because the users agree to ignore it until it becomes unmanageable. You might tell them that the inviolate level isn't the founder or the community, but the shared reality that they both want the wiki to exist, and that shared desire is the paper upon which the hands are drawn.

  Best of luck with the course and your friends.
