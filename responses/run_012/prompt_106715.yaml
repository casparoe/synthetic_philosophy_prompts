prompt: |-
  I'm taking this course on self-reference and we've been reading about tangled hierarchies and the so-called inviolate level—you know, the way Escher's Drawing Hands shows two hands drawing each other, but there still has to be some level outside the drawing, like the artist or the paper, that makes the whole thing possible. Anyway, two friends of mine, Maya and Dev, got into a huge argument about this at a coffee shop last week, and I got dragged in as the refree even though I definately couldn't decide who was right. They both help run a small wiki for a worldbuilding project. The wiki has a page called The Rules that says any page, including The Rules itself, can be edited by any member. Someone changed The Rules to say only the founder can edit The Rules, then someone else changed it back, and now there's an edit war. Maya says this proves the wiki needs a founder who stands outside the rules—an inviolate level—otherwise the rules can be changed by the very rule they're supposed to constrain, and the whole thing collapses into paradox. Dev says that's exactly backwards: the wiki is a tangled hierarchy, and the founder is just another editor; the only thing that makes the rules real is the ongoing practice of the community, which isn't a level in the hierarchy but the activity that sustains it. Maya says that's just smuggling in an inviolate level under a different name—the community's practice is doing the same job as the founder. Dev says no, the community's practice isn't a rule, it's just what happens; it can't be edited because it's not a page. Maya says then it's not a rule at all, and you can't appeal to it to settle the edit war. Dev says you settle it by voting, which is itself a rule, but a rule that can be changed. Maya says then the voting rule can be changed by a vote, and you're back to the same problem. Dev says yes, and that's fine—it's turtles all the way down, and the system still works as long as people keep participating. Maya says turtles all the way down is just an infinite regress, and an infinite regress isn't a foundation.

  They asked me to referee and I honestly couldn't. Can you go through their exchange and say who's right at each step—not just who wins overall? I'm especially interested in whether Dev's community practice is a genuine escape from the tangle or just a relabeled inviolate level, and whether Maya's demand for a foundation is a real requirement or a confusion. Also, does the Escher drawing actually help here, or is it a misleading analogy? And what, if anything, are both of them missing about the difference between a rule and the activity of following a rule? Please write it as continuous prose, no headings, bullet points, bold text, or tables—just the kind of thing you'd write in an email.
