  The strongest objection is that mentality comes in degrees, and we lack direct access to minds. If moral status tracks capacity, and capacity degrades with brain integrity, then brain integrity is the only objective measure we have. To refuse the proxy is to indulge in sentimentality. When a brain shrinks, the network that generates the self frays. If we insist on full moral status regardless of biological decay, we may be protecting our own comfort rather than the patient's interest. The patient might not be "suffering" in a way that warrants aggressive intervention. Refusing to use the scan as a moral guide forces us to treat a biological shell as a person, potentially prolonging dying rather than living. The objection claims that in the absence of a soul-meter, biology is the only honest arbiter we have. It argues that denying the link between brain and mind is a form of dualism that ignores medical reality. When the hardware is broken, the user is gone. To pretend otherwise is to deny the tragedy of the disease to spare ourselves the guilt of letting go. It suggests that by holding onto moral status, we are actually holding onto our own image of him, not the reality of him. It asks us to be brave enough to admit that when the brain dies, the person dies, even if the heart beats. This is not cruelty; it is a demand for intellectual honesty in the face of loss.

  4. My reply
  My reply is that graded capacity does not imply graded status. A child has less capacity than an adult but equal moral worth. Similarly, a diminished adult remains a subject of care, not an object of maintenance. The objection conflates the *intensity* of experience with the *presence* of a subject. Even if the mind is faint, it is not zero. Furthermore, relying on the proxy creates a dangerous precedent. If we allow biology to dictate worth, we lose the ability to correct for medical error or variability. The "honest arbiter" is only honest about tissue, not about value. By rejecting size as a ground, we preserve the obligation to care for the vulnerable, rather than granting ourselves permission to withdraw care when the biology becomes inconvenient. We protect the person from the prognosis. The objection assumes that because we cannot fix the brain, we must discard the person. But care is not about fixing; it is about witnessing. To make brain size the ground is to say that only the functional deserve protection. That is a moral failure, not a medical necessity. We can stop hospitalizations without stopping humanity. There is a difference between refusing futile treatment and refusing moral recognition. The body remains a locus of dignity even when the mind recedes. To deny this is to make love conditional on performance.

  5. What would change my mind
  I would change my mind if neuroscience demonstrated a direct, linear correlation between specific neural mass and the intensity of subjective experience, independent of functional output. If you could show that losing 10% of cortical volume necessarily reduces the capacity for suffering by 10%, regardless of behavior, the proxy would become too tight to ignore. I would also need evidence that this reduction in capacity eliminates the subject of experience entirely, rather than merely diminishing its expression. Until then, size remains a measurement of matter, not meaning.

  6. What I might say to my aunt
  "Auntie, I know the scans look frightening. They show us the disease is winning, and I agree we shouldn't torture him with hospitals. But the scan shows what's happening to his brain, not who he is. He's still Dad. We can stop the treatments without deciding he's less of a person. Let's keep caring for him, even if the cure isn't coming. The machine sees the shrinkage, but it doesn't see him. We still do. We are sad too. But we don't measure love in cubic centimeters."
