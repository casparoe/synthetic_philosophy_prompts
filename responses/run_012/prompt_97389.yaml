      4. **Stunning Bans:** He opposes state bans on ritual slaughter. Divine command overrides utilitarian calculation. However, he would insist the ritual itself be performed with maximum speed and minimal pain, as unnecessary suffering violates the human-focused prohibition on cruelty.

