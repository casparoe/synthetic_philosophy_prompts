      *   **Setup:** Fair coin flipped until heads ($n$). Payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$. Probability $P(n) = (1/2)^n$.
      *   **Expected Value Calculation:** $E[X] = \sum_{n=1}^{\infty} P(n) \cdot X_n = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}$.
      *   **Mathematical Series:** This is the alternating harmonic series: $1 - 1/2 + 1/3 - 1/4 + \dots$
      *   **Convergence:** It converges conditionally to $\ln(2)$.
      *   **The Catch (Riemann Rearrangement Theorem):** Conditionally convergent series can be rearranged to sum to any real number or diverge.
      *   **Decision Theory Implication:** Expected Utility Theory (EUT) typically assumes absolute convergence (or at least a well-defined expectation). If the expectation depends on the ordering of outcomes, the "Expected Value" is ill-defined in the standard Kolmogorov sense (which requires absolute convergence for infinite discrete spaces to be order-independent).
