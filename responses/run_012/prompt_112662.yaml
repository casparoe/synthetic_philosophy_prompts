answer: |-
  ### Move-by-Move Adjudication

  **Sam (Opening): "The quarter is the answer, full stop, even in the one-shot case... the time average is what you actually live through."**
  **Verdict: Defensible.**
  This relies on the coherent (though non-standard) ergodicity economics framework which argues that ensemble averages are physically inaccessible to a single agent.

  **Alex (Response): "Kelly is literally just expected utility with log wealth... A risk-neutral agent facing a genuine one-shot positive-EV bet... should shove."**
  **Verdict: Clearly Right.**
  In standard decision theory, utility functions are subjective preferences, and maximizing Expected Value is the definition of rationality for a risk-neutral agent in a single bounded trial.

  **Sam (Rebuttal): "Tell me what you're doing when you say bet half of the quarter... that's you admitting the right fraction depends on your beliefs about the model."**
  **Verdict: Defensible.**
  This correctly identifies that in practice, "Kelly" is often used as a robustness heuristic against parameter uncertainty rather than a strict utility maximization rule.

  **Alex (Rebuttal): "Estimation error is a different thing — it's shrinking toward a prior because your input is bad, not changing your objective."**
  **Verdict: Clearly Right.**
  Mathematically, updating a probability estimate (epistemic uncertainty) is distinct from selecting a utility function (axiological preference), and conflating them is a category error.

  ***

  ### Specific Conceptual Questions

  **Is "Kelly is just log utility" a knockdown of Sam?**
  No, because Sam's argument is precisely that Log Utility isn't a subjective preference but a physical requirement of multiplicative dynamics, so stating the equivalence doesn't refute the derivation.

  **Does the time-average / ergodicity business do any work that the log-utility point doesn't already do?**
  Yes, it attempts to derive Log Utility from the physics of the process rather than assuming it as a psychological axiom, though this derivation generally requires repeated play to hold rigorously.

  **Is Sam right that overbetting is a mistake even in a truly one-shot bet?**
  No, that is question-begging; without the threat of future ruin from a sequence of bets, "overbetting" is simply high-variance EV maximization, which is rational for many utility functions.

  **Is the half-Kelly-for-estimation-error move really different in kind from Alex's move?**
  Alex is technically correct that they are different levers (input vs. objective), but Sam is pragmatically right that both result in bet-sizing adjustments based on uncertainty, blurring the line in application.

  ### Final Referee's Call
  Alex wins on standard decision theory and mathematical definitions, but Sam wins on the philosophical critique of how "rationality" is defined in real-world wealth dynamics. If your friends are playing a real poker game with real money, Alex is right that they can bet whatever fraction matches their personal risk tolerance; if they are building a trading algorithm to survive indefinitely, Sam is right that Kelly is the constraint.
