answer: |-
  1. The reformers moved to replace the master rule with a clause requiring a two-thirds vote for all future amendments. They insisted this higher bar was necessary to protect the assembly from fleeting passions.

  2. Hands rose in a simple majority, and the clerk updated the charter under the existing protocol. The old rule had successfully voted to limit its own power.

  3. A new faction later demanded a return to simple majority, arguing the entrenchment was void because the old rule lacked the authority to bind its successors. They sought to vote down the two-thirds requirement using the very threshold it imposed.

  4. A proceduralist warned that using the two-thirds rule conceded its validity, while ignoring it presumed the old rule survived without proof. The room fell silent as the logical circle tightened around the gavel.

  5. The chair called for a show of hands and declared the result binding regardless of the count. No one asked whether the gavel strike was an act of law or an act of force.
