  You're treating the unity of a life as a bookkeeping convention, but it's the foundational unit of moral justification. When I sacrifice my finger today for my finger next year, I am the one living with both costs; there is a single subject of experience who bears the burden. That's why intra-personal aggregation is coherent—it's just prudential rationality within a single life. But when you ask me to sacrifice my sight for someone else's finger, you're asking me to bear a cost for a benefit I won't receive, justified by a sum of benefits distributed across distinct lives who don't bear my cost. The asymmetry isn't arbitrary; it's built into the separateness of persons.

  So to answer your dilemma: The woman pools her twenty years because it's her life. The 400 don't pool their fingers because they aren't a single claimant. Now, does that mean A is mandatory? Maybe. But don't tell me your intuition about B is solid ground; it smells like utilitarianism trained deep. If you want to save the 400 without aggregation, you need a principle about fair chances or scarcity that the blind woman couldn't reasonably reject, not a summing of their grievances. The justification still runs through her, not through the collective.
