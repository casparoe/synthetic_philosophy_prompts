answer: |-
  1. **The Prediction Objection**
     If the truth of a borderline claim depends on how linguistic practice develops in the future, it sounds like you are turning semantics into sociology. Are you saying that to call a shade "borderline red" is just to make a prediction that speakers haven't yet decided how to classify it? If so, doesn't that make vagueness merely epistemic—a matter of our current ignorance about future stipulations?

     *Follow-up:* You'll likely reply that it's not a prediction but a *constitutive* rule: the meaning literally isn't there yet. But if the meaning is incomplete, what governs our current use? Are we following a rule that has a gap, or are we following no rule at all until the gap is filled?

  2. **Deferred Precisification vs. Supervaluationism**
     Your view shares DNA with supervaluationism, which also relies on precisifications to handle truth values. But supervaluationists typically treat all admissible precisifications as existing abstractly right now. Why is it crucial to your account that the precisification is *deferred* to actual future practice rather than selected from a static set of logical possibilities?

     *Follow-up:* If you say the difference is that your view is more naturalistic, does that mean a precisification is invalid if it's logically coherent but never actually adopted by a speech community? Does truth require a voter?

  3. **Truth Conditions in the Present**
     Let's press on the "now." If I say "This patch is red" regarding a borderline case, and the extension is unsettled, what is the truth value of my utterance *at the moment I speak it*? Is it false, truth-valueless, or do you endorse a non-classical logic where it can be neither true nor false without violating the law of excluded middle?

     *Follow-up:* If you argue it is currently neither true nor false, how do you account for the intuition that I've still said something meaningful? Does "deferred precisification" imply that a significant portion of our daily discourse is currently semantically defective?

  4. **The Realist Intuition**
     I want to put the strongest objection to you. An epistemicist or realist will insist that there *is* a last red shade right now, regardless of whether we can know it or agree on it. They argue that the world or the concept itself dictates a boundary, even if our usage is sloppy. What is your direct argument against the claim that the boundary exists independently of our future decisions?

     *Follow-up:* You will likely argue that reference is fixed by usage. But if usage is currently insufficient to fix a boundary, what stops the boundary from being fixed by the *nature* of the property redness itself? Are you denying that properties have natures?

  5. **Higher-Order Vagueness**
     A common trap for views like yours is higher-order vagueness. If you draw a distinction between cases that are "settled" and cases that are "unsettled," haven't you just created a sharp boundary at the next order up? How does deferred precisification explain the vagueness of the distinction between the settled and the unsettled without generating a regress?

     *Follow-up:* If you respond that the settled/unsettled distinction is itself vague, does that mean we need a *further* deferred precisification to decide when a precisification is required? At what point does the deferral stop?

  6. **The Forced-March Sorites**
     Let's look at the forced-march sorites, where a subject must classify every item in a spectrum as "red" or "not red" with no option to abstain. In this scenario, the subject *must* make a decision now. Does this force a precisification immediately, thereby creating a sharp boundary in real-time? If so, how does your view block the sorites premise rather than merely postponing the problem until the subject is forced to speak?

     *Follow-up:* If you say the forced decision creates a boundary only for that specific context and not for the language as a whole, doesn't that fragment the meaning of "red" into thousands of micro-meanings? How do we still understand each other if the boundary shifts with every forced march?

  7. **The "Never Settled" Scenario**
     You mention that borderline cases await later practice or an explicit stipulation. But what if that stipulation never comes? Suppose humanity goes extinct while there are still borderline cases of "tall" that were never resolved. Do those statements remain truth-valueless forever? Does the truth of our claims depend on the indefinite survival of the linguistic community?

     *Follow-up:* If you concede that they remain truth-valueless, does this mean the Law of Excluded Middle fails eternally for those propositions? Are you comfortable with a semantics where some facts about the world are permanently undecided because we stopped talking?

  8. **Retrospective Truth**
     Consider a historical claim. If I said a specific patch was "red" in 1920, and it was borderline then, but our current practice precisifies that shade as "not red," was I wrong back then? Does deferred precisification allow truth values to change retroactively, or is the 1920 utterance frozen in the indeterminacy of 1920?

     *Follow-up:* If you say the truth value changes retroactively, doesn't that undermine the stability of historical record? If you say it stays indeterminate, how do we assess the accuracy of past descriptions using our current vocabulary?

  9. **Normativity of Precisification**
     When we do eventually precisify a term, is there a correct way to do it? Or is deferred precisification compatible with the idea that we could just as easily draw the line at shade 50 as shade 51? If anything goes, isn't the view vulnerable to the charge that it makes truth arbitrary?

     *Follow-up:* If you argue there are constraints based on "similarity" or "past usage," aren't those constraints themselves vague? How do they guide the precisification without already presupposing the very boundaries you say are missing?

  10. **Practical Stakes and Law**
      Finally, let's bring this down to earth. In law, we often need sharp boundaries for vague terms like "reasonable doubt" or "obscene." If your view is correct, and these extensions are unsettled until further practice, does that mean legal verdicts involving borderline cases are technically truth-valueless until the appeals process creates a precedent? Is deferred precisification a feature for philosophy but a bug for jurisprudence?

      *Follow-up:* If you say the legal stipulation *is* the precisification, does that mean the law doesn't discover the meaning of "obscene" but literally creates it? If so, how do we criticize a law for misusing a term if the law defines the term by fiat?
