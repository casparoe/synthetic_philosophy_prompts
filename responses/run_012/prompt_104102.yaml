answer: |-
  **Research Proposal**

  **Title:** Beyond the Metric: Relational Comparisons and the Standpoint of Justice

  **Research Question**
  Can the requirement for a common metric in distributive justice be replaced by a normative account of the comparer's standpoint? Specifically, is it possible to ground legitimate interpersonal comparisons solely on relational judgments (e.g., 'X is worse off than Y') without cardinal measurement, provided the authority and position of the agent making the comparison are explicitly theorised?

  **Rationale and Context**
  The standard literature on interpersonal utility comparison treats the problem as metaphysical or epistemic: it asks whether a common unit of well-being exists and whether we can access it. Consequently, theories of distributive justice often stall on the impossibility of precise measurement. However, this framing ignores actual practice. Institutions—from courts awarding damages to hospitals triaging patients—routinely make comparative judgments without claiming to possess a shared metric. They operate on relational rankings rather than cardinal measurements.

  Existing positions leave a critical gap here. Welfarist and prioritarian approaches typically insist that a metric is a prerequisite for justice, rendering them vulnerable to sceptical attacks regarding measurement. Conversely, relational egalitarians successfully shift focus from distribution to status, yet they often treat the act of comparison as transparent, neglecting *who* is entitled to compare and from what position. The 'levelling-down objection' further illustrates this impasse; it attacks the metric itself, yet it presupposes that justice requires a level to be lowered. If justice is concerned with relational standings rather than metric quantities, the objection may lose its force.

  This project posits that the difficulty lies not in the *possibility* of comparison, but in the *legitimacy* of the comparer. By distinguishing between *metric comparison* (quantitative measurement) and *relational comparison* (normative ranking), I aim to show that the latter is sufficient for distributive justice if, and only if, the standpoint of the comparer is accounted for. The 'worse off' predicate is not merely descriptive but evaluative, constituted by the authority of the agent asserting it.

  **Methodology and Work Plan**
  The project will proceed via conceptual analysis over a single ten-week term. The aim is to construct a coherent argument rather than to survey empirical data.

  *   **Weeks 1–3: Literature Mapping.** I will delineate the standard debate on interpersonal comparisons and contrast it with the relational egalitarian critique. I will isolate the specific assumption that a common unit is necessary for non-arbitrary judgment.
  *   **Weeks 4–7: Argument Construction.** I will develop the 'standpoint thesis'. This involves analysing how the position of the comparer (participant, third party, or institution) alters the normative weight of the comparison. I will test whether a relational account can handle standard cases of injustice without reverting to a metric.
  *   **Weeks 8–10: Drafting and Refinement.** I will write the 8,000-word dissertation, focusing on integrating the standpoint analysis with the critique of the metric. Time will be reserved for stress-testing the argument against the objection that relational judgments are merely disguised exercises of power.

  **Defence of Conceptual Analysis**
  One might suggest that a study of how institutions *actually* make comparisons (empirical sociology) would be more fruitful. However, the question at hand is normative, not descriptive. Knowing that a court *does* compare without a metric does not tell us whether it is *justified* in doing so. The philosophical work lies in determining the conditions under which such a comparison counts as a judgment of justice rather than an arbitrary decision. Conceptual analysis is required to disentangle the evaluative content of 'worse off' from the descriptive content of 'has less'. An empirical survey would conflate legitimacy with routine.

  **Outcomes and Success Conditions**
  A successful outcome will be a demonstrable framework showing that relational comparisons can sustain principles of priority or sufficiency without cardinal measurement. Success requires showing that the 'standpoint' provides the necessary objectivity that the 'metric' was supposed to supply. Specifically, I must show that the levelling-down objection dissolves when the metric is abandoned.

  The project would fail if I cannot demonstrate that relational comparisons are anything other than arbitrary preferences. If it turns out that without a metric, the standpoint of the comparer collapses into mere power or bias, then the metric remains necessary. Similarly, if I find that relational judgments implicitly rely on hidden metric assumptions, the distinction will not hold.

  **Scope and Limitations**
  The primary risk is scope creep. A full theory of distributive justice is beyond the reach of an 8,000-word dissertation. I must restrict the inquiry to the *mechanism of comparison* itself. I will not defend a specific currency of justice (e.g., resources vs. welfare) but will assume a pluralist account to show the framework's flexibility. Furthermore, I will not attempt to resolve the metaphysical status of well-being, only the normative status of comparing it. If I find myself constructing a full substantive theory of equality, I will have exceeded the scope. The focus must remain tightly on the transition from metric to relational comparison and the role of the comparer's standpoint in validating that transition.
