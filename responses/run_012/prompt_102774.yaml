answer: |-
  Good evening, everyone. Please, raise a glass.

  Looking around this room, it is tempting to tell a simple story about this year. The numbers are green. The product is stable. We are here, celebrating, while others are not. The official story is that we earned this. And while I want to honor the work we did, I also think we owe it to ourselves to be honest about how the world actually works.

  I've been thinking lately about an old political thinker, Machiavelli. He had a specific way of talking about luck. He compared fortune to a violent river. When the weather is calm, you cannot see the danger. But that is exactly when you should be building dikes and dams. When the rain finally comes, the water will rise, but if you built well, you survive.

  He called the act of building those dikes *virtù*. Now, I know most of us hear "virtue" and think about morality—being a good person. That isn't what he meant. For him, *virtù* wasn't about goodness; it was about efficacy. It was nerve. It was the capacity to look at a calm sky and prepare for a storm anyway.

  We did have moments of that this year. When we refactored the payment service last winter, nobody asked for it. It was painful, it delayed features, and it felt like over-engineering. But when the traffic spike hit us in March, we didn't crash. That was a dike. That was *virtù*.

  But we also had the flood. Our largest competitor collapsing under scandal was not something we caused. That was the rain. We didn't build that; it just fell on us. And then there is the regulation change. For two years we complained about it, and suddenly it was rewritten in our favor. Leadership calls that influence. I look at it and I wonder: was that foresight, or was it just a guess that happened to be right? I don't know. And I think it's okay to admit we don't know.

  But there is a darker, harder lesson in that old book. Machiavelli suggests that even building the dikes isn't entirely up to us. He argues that whether your specific temperament matches the times is itself a matter of luck. The bold man prospers in one era and is ruined in the next. The cautious man survives a crash but misses a boom.

  The uncomfortable truth is that we were fortunate to be the kind of people this particular moment rewarded. Our specific mix of stubbornness and skill fit the shape of this year's problems. That doesn't negate the work. But it should humble us.

  So, I don't want to toast to "earning" the luck. We can't earn the rain. I want to toast to the dikes. To the code we hardened when no one was watching. To the preparation that allowed us to catch the luck when it arrived. And to the honesty to know the difference.

  To the team.
