answer: |-
  The state's refusal to pay ransoms, even when a secret exception could save a life without damaging public credibility, presupposes a decision theory that prioritizes the optimization of a decision *procedure* over the optimization of a specific *act*. While often articulated in the language of rule-consequentialism, the logical structure of the defense closely resembles **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**. These theories dictate that an agent should choose the output of their decision algorithm that yields the best expected outcome across all instances where that algorithm is run, rather than updating on their specific location in time and space to maximize local utility.

  ### The Core Decision Theory: Policy vs. Act

  Ordinary **Causal Decision Theory (CDT)**, which underpins straightforward act-consequentialism, evaluates choices based on the causal consequences of the specific act at hand. If a ransom payment could free a hostage and remain truly secret, CDT dictates paying: the act saves a life, and the causal link to future kidnappings is severed by the secrecy. The state's refusal to pay in this scenario demonstrates a rejection of CDT in favor of a policy-based standard.

  The defense presupposes that the decision point is not an isolated event but an instantiation of a general rule. By refusing to "update" on the fact that they are currently facing a high-cost scenario, officials act as though they are selecting a policy for all possible worlds where the state faces kidnapping. This is the hallmark of an updateless or functional standard: the right act is the one that follows from the optimal policy function, even if deviating from it would yield a better local outcome.

  **Does it require Updateless/FDT standards?**
  Strictly speaking, no. **Rule-Consequentialism** can explain the practice without invoking the formal machinery of FDT. A rule-consequentialist argues that we should follow the rule ("no ransoms") because the general acceptance of that rule produces better outcomes than any alternative rule, even if breaking it in a specific instance would be beneficial. However, Rule-Consequentialism struggles slightly with the "secret exception" hypothetical. If the exception is truly undetectable, the rule's general acceptance is not harmed. FDT/UDT handles this more robustly by arguing that the *disposition* to make exceptions is what is being evaluated, not just the track record. If your algorithm allows for secret exceptions, it is a different algorithm than one that does not, and kidnappers (if they model the state's psychology) might assign a non-zero probability to that algorithm existing.

  **Deontology** also fits the practice well ("We do not negotiate with terrorists" as a duty), but the prompt notes officials defend the policy using consequentialist logic (deterrence, funding). Therefore, while deontology explains the *rigidity*, it does not explain the stated *justification*.

  ### The Two Defenses: A Mixture of Standards

  Officials typically offer two defenses, and they do not presuppose the same theory.

  1.  **The Funding Argument:** "Paying funds and encourages future kidnapping." This is an **act-consequentialist** claim. It argues that *this specific payment* has bad causal consequences (money flows to bad actors). This defense is compatible with CDT.
  2.  **The Credibility Argument:** "The rule must be exceptionless to stay credible." This is a **policy-based** claim. It argues that the *expectation* of payment drives kidnapping. This requires the kidnapper to have knowledge of the state's policy.

  The practice quietly mixes an act-based standard with a policy-based standard. The funding argument is used to satisfy act-based intuition (doing harm now), while the credibility argument is used to justify the rigid policy (preventing harm later). In the "secret exception" scenario, the funding argument might still hold (money moves), but the credibility argument collapses (no one knows). If the state refuses to pay even when the credibility argument is nullified (perfect secrecy), it reveals that the underlying commitment is to the **policy-based standard** (UDT/Rule-Consequentialism), and the funding argument is often rhetorical cover.

  ### The Role of Publicity

  Publicity is **essential to the presupposed theory's mechanism**, not merely an implementation detail. In FDT/UDT terms, for the policy to deter, the kidnapper must be able to predict the output of the state's decision algorithm. If the policy is not publicized, the kidnapper cannot factor it into their cost-benefit analysis.

  However, there is a nuance: Publicity is required for *deterrence*, but the *decision theory* itself (the internal logic of the official) does not strictly require publicity to remain rational under FDT. An FDT agent would still refuse the ransom in a vacuum because they are optimizing the algorithm's output, not the specific instance. But for the *state's goal* (reducing kidnapping) to be achieved, publicity is a necessary condition for the algorithm to influence the counterparties. Thus, publicity is an external requirement for the policy's success, but the internal rationality of the refusal rests on the updateless evaluation of the decision procedure.

  ### Inconsistency in Other Bargaining Contexts

  The state's willingness to bargain in sieges or plea deals is **not an inconsistency**, provided the implicit theory includes a variable for **precedent replication**.

  *   **Kidnapping/Ransom:** High replication risk. Paying one kidnapper signals to a decentralized, external market of potential kidnappers that the state is a soft target. The "algorithm" is being tested by many independent agents.
  *   **Sieges/Plea Deals:** Low replication risk. These are interactions within a controlled legal or tactical framework. A plea deal does not signal to all future criminals that murder is negotiable; it signals that cooperation reduces sentencing, which is a desired incentive. A siege negotiation is a contained tactical problem where the "algorithm" is not being stress-tested by a broad external market.

  A sophisticated Rule-Consequentialist or FDT agent distinguishes between domains where the decision output is observable by a broad class of adversaries versus domains where it is localized. The theory is not "never negotiate," but "never negotiate where negotiation incentivizes the creation of new adversarial scenarios."

  ### Reconstruction of the Implicit Decision Theory

  **The Implicit Theory:** **Domain-Specific Functional Decision Theory.**
  The state acts as an agent that selects a decision function $f(situation)$ to maximize long-term security.
  *   **Input:** Type of hostage scenario (Kidnapping vs. Siege).
  *   **Constraint:** The output of $f$ must be predictable by adversaries in the "Kidnapping" domain to ensure deterrence.
  *   **Operation:** When facing a kidnapping, the agent evaluates the utility of the output $f(kidnapping)$ across all possible worlds where $f$ is run, not just the current world.
  *   **Updatelessness:** The agent refuses to update on the specific high cost of the current instance (a beloved hostage) because doing so would change the function $f$ to one that is exploitable.

  **What is Strictly Required:**
  1.  **Non-Act-Based Evaluation:** The theory must evaluate the *rule* or *algorithm*, not the isolated act. (Rules out naive CDT).
  2.  **Precommitment Credibility:** The state must be unable or unwilling to deviate, even when deviation is locally optimal.
  3.  **Adversarial Modeling:** The theory assumes adversaries model the state's decision process.

  **What Merely Fits Well:**
  1.  **Deontological Rhetoric:** Saying "it's against our principles" fits the behavior but isn't required by the logic (which is consequentialist).
  2.  **Publicity:** Required for the *outcome* (deterrence), but not for the internal *rationality* of the refusal.
  3.  **Funding Argument:** Fits the act, but the policy holds even if funding were irrelevant (e.g., if kidnappers were ideologically motivated only).

  ### Rival Theories

  **Ruled Out:**
  *   **Naive Causal Decision Theory (Act-Consequentialism):** This would mandate paying in the secret exception case.
  *   **Evidential Decision Theory (EDT):** EDT might pay, reasoning that paying is evidence that the world is one where hostages are saved, though it struggles with the causality of deterrence. It is generally less robust than FDT here.

  **Ruled In:**
  *   **Rule-Consequentialism:** Fits the behavior well.
  *   **Functional/Updateless Decision Theory:** Fits the logical structure of the "secret exception" refusal best.
  *   **Contractarianism:** Fits if viewed as a social contract to not incentivize harm against citizens.

  ### Consequences of Switching to an Act-Based View

  If the state replaced this with a straightforward act-based view (CDT):

  1.  **Secret Payments:** Officials would pay ransoms whenever the immediate benefit (life saved) outweighed the risk of detection.
  2.  **Policy Collapse:** Over time, leaks would occur. Once kidnappers realized the "no ransom" policy was a bluff subject to local optimization, kidnapping rates would spike.
  3.  **Inconsistency:** The state would face moral distress, paying in some cases and letting hostages die in others based on arbitrary factors (e.g., how much media attention the case got), violating equality principles.
  4.  **Funding:** Terrorist groups would receive more intermittent funding, though potentially less predictable funding.

  Ultimately, the practice relies on the state treating its own decision-making process as an object of strategic choice, rather than a series of isolated reactions. It sacrifices the specific to save the general, a move that is irrational under act-consequentialism but rational under a policy-based or updateless framework. The mixing of defenses suggests that while the *logic* is policy-based, the *rhetoric* is often tailored to satisfy act-based moral intuitions.
