answer: |-
  This is a fascinating set of data points. Your flatmate is operating with a much more sophisticated framework than the standard "gift = bad" heuristic. Based on her six verdicts, here is the breakdown of her logic, the prediction for your water utility case, and the philosophical fault lines you're probing.

  ### 1. Will she call the Water Utility case corruption?
  **Yes, almost certainly.**

  Despite the cultural cover (Eid), the lack of secrecy, and the lack of a proven quid pro quo, she will likely flag this as corruption (or at minimum, a disqualifying conflict of interest).

  **Why?**
  *   **The Deviation from Norm:** You established that the local norm is "modest hampers, same for everyone." The Head of Procurement receiving a hamper worth a *month's salary* violates the internal norm of the office, even if it fits a broader cultural festival.
  *   **The Relationship:** Like the £250 whisky case, this is a **bidder-to-decision-maker** transfer during a **live tender**.
  *   **Private vs. Communal:** Unlike the Chief's goat (which is from the *community* he serves, often consumed/shared publicly), this is a specific supplier to a specific official. It creates a dyadic obligation, not a communal bond.
  *   **The "Speed Money" Precedent:** She already ruled that "nothing changed" (the file was moving anyway) is irrelevant in the clerk case. Therefore, "no decision changed *yet*" in the water case will not save the Head of Procurement.

  ### 2. What rule is she actually running?
  She is not running a "Zero Tolerance" rule, nor is she running a "Cultural Relativist" rule. She is running a rule of **Institutional Integrity within Context.**

  Her definition of corruption appears to be: **The violation of the specific normative expectations of a public office for private benefit, creating an obligation that competes with public duty.**

  Here is how her verdicts map to this rule:
  *   **Whisky & Speed Money:** Violates the norm of the bureaucratic office (impartiality/procedure). Private benefit exists. -> **Corruption.**
  *   **Doctor's Chocolates:** Fits the norm of the doctor-patient relationship (gratitude post-care). No public resource allocation involved. -> **Not Corruption.**
  *   **Chief's Goat:** Fits the norm of *Traditional Authority* (reciprocal bond with community). It is public/communal, not private. -> **Not Corruption.**
  *   **Nepotism:** Violates the norm of meritocratic hiring inherent to public office. -> **Corruption.**
  *   **Rally Cash:** Fits the norm of *Political Authority* (patronage). She categorizes this as **Clientelism** (a political system) rather than **Corruption** (an administrative breach).

  **The Core Distinction:** She distinguishes between **Rational-Legal Authority** (Council officers, clerks, procurement managers) and **Traditional/Political Authority** (Chiefs, Councillors at rallies). She holds the former to strict impartiality norms and allows the latter to operate on reciprocity and patronage norms.

  ### 3. What other rules fit her verdicts just as well?
  There are two competing hypotheses you need to watch out for:

  **A. The "Harm Principle" (Consequentialism)**
  *   *Rule:* Corruption is only corruption if it causes tangible harm or changes an outcome.
  *   *Fit:* Fits the Doctor and Chief cases (no harm).
  *   *Conflict:* **Fails on the Clerk (£20).** She explicitly said the amount and the outcome (file moving anyway) are beside the point. This suggests she cares about the *act*, not the *consequence*.

  **B. The "Local Norms" Principle (Strong Relativism)**
  *   *Rule:* If it is culturally accepted in that specific context, it is not corruption.
  *   *Fit:* Fits the Chief (customary) and potentially the Eid hampers.
  *   *Conflict:* **Fails on the Whisky.** If the construction industry in that area commonly gifts whisky to scorers, her verdict would logically be "not corruption" under strict relativism. Her rejection of the whisky implies there is a *universal* standard for bureaucratic procurement that overrides local industry habits.

  ### 4. Which case best prises these rules apart?
  **The Water Utility case *is* the wedge.**

  It is the perfect stress test between **Institutional Integrity** (her likely rule) and **Strong Relativism** (her stated philosophy).

  *   **If she calls it Corruption:** She prioritizes the *type of office* (Procurement = Rational-Legal) over the *cultural context* (Eid). She is arguing that once you enter a utility procurement office, you leave customary gift-exchange norms at the door, regardless of the country.
  *   **If she calls it Not Corruption:** She is a true Cultural Relativist. She believes that if the local culture accepts "big hampers for bosses at Eid," then external definitions of conflict of interest are imperialist impositions.

  **A better wedge (if you want to push further):**
  Imagine a **Traditional Judge** in a rural court. A litigant brings him a cow before a ruling, as per local custom. The judge rules in his favor.
  *   If she says **Corruption**: She believes *all* public power must be impartial (Universalist).
  *   If she says **Not Corruption**: She believes Traditional Authority operates on different rules than Bureaucratic Authority (Institutionalist).
  *   *Prediction:* Based on the Chief case, she will say **Not Corruption**. This confirms she distinguishes between *types of authority*, not just geography.

  ### 5. Is her rule just a Western standard dressed up?
  This is the sharpest question. The short answer is: **No, but it is a *Modernist* standard.**

  She is relying on a distinction made by sociologist Max Weber: **Traditional Authority** (Chiefs, elders, customs) vs. **Rational-Legal Authority** (Bureaucrats, procurement officers, clerks).

  *   **Western Bias?** It is true that the "Rational-Legal" model was exported globally during colonialism and development. Insisting that a water utility in a non-Western country operate like a UK civil service department can be seen as imposing Western norms.
  *   **Functional Necessity?** However, her distinction isn't arbitrary. Water utilities require technical meritocracy to function (pipes need to be laid by competent firms, not nephews). Chiefs require social reciprocity to maintain legitimacy.
  *   **The Verdict:** She isn't imposing "Western" norms; she is imposing **Bureaucratic** norms on **Bureaucrats**. She allows "Traditional" norms for **Traditional Leaders**. This is actually a very nuanced, post-colonial governance stance. It acknowledges that you cannot run a modern utility on customary reciprocity, but you shouldn't judge a Chief by the standards of a town clerk.

  **Where she might be inconsistent:**
  She calls the Councillor's cash "Clientelism, a different essay." This is a convenient dodge. Clientelism *is* a form of corruption in many frameworks (vote buying). By separating it, she protects the "Political" sphere from the "Administrative" critique. This suggests she is willing to tolerate corruption in *politics* as long as the *administration* stays clean.

  ### 6. Where is my reading of her most likely to be wrong?
  **The "Modest for Everyone" Trap.**
  I might be underestimating the power of the **Eid** context.
  *   **The Risk:** If she views the "modest hampers for all" as the establishing of a *new local norm* for that office, she might argue the Head of Procurement is simply receiving the "Senior" version of that norm.
  *   **What would change it:** If you clarify that the "modest hampers" are token gestures (like a calendar) worth £10, but the Head's hamper is worth £1,000 (in a low-salary context). If the disparity is massive, the "norm" argument collapses.
  *   **The Blind Spot:** She might argue that because it is **open and transparent** ("nothing hidden"), it is not corruption. Some governance scholars argue that *secret* commissions are corruption, but *declared* gifts are manageable conflicts. However, given her verdict on the Clerk (where the act itself mattered more than the harm), I doubt she'll take this route.

  **The "Clientelism" Dodge.**
  I might be wrong that she considers the Water Utility case "Administrative."
  *   **The Risk:** In many developing contexts, utilities are highly politicized. She might argue the Head of Procurement is a political appointee operating in a clientelist system (like the Councillor).
  *   **What would change it:** If you specify the Head is a **career civil servant** protected from political firing. This forces her to judge them as a bureaucrat, not a politician.

  ### Summary Advice for the "Guinea Pig" Session
  When you present the Water Utility case, watch closely for **which norm she prioritizes**:
  1.  **The Cultural Norm** (Eid gifting is sacred/normal).
  2.  **The Institutional Norm** (Procurement must be impartial).

  If she prioritizes #2, she is an **Institutionalist** (my bet).
  If she prioritizes #1, she is a **Relativist**.

  If she tries to dodge by saying "It depends on the value," remind her of the **Clerk (£20)** case where she said amount is beside the point. If she tries to dodge by saying "It's customary," remind her of the **Whisky** case (if whisky gifting was common in that industry, would it be okay?).

  Her consistency on those two points will force her to call the Water Utility case **corruption**, revealing that her "anti-Western norm" stance has a hard limit when it comes to the technical administration of public resources.
