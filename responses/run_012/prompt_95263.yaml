answer: |-
  **The Scenario**

  Consider two distinct marine invertebrates, *Alpha* and *Beta*, of different species but compatible physiologies, which upon maturity permanently fuse their outer membranes and interconnect their vascular systems completely. Nutrients and oxygen circulate freely between them such that separating them causes immediate metabolic collapse for both, and they coordinate locomotion via shared chemical signals to maintain homeostasis as a single unit. Yet, they retain separate digestive tracts and reproductive organs, releasing gametes independently without ever merging genomes or originating from a single zygote.

  **The Four Verdicts**

  1.  **Universalist:** Since Universalism holds that composition is unrestricted, the cells of *Alpha* and *Beta* compose a composite object simply in virtue of existing together. The metabolic fusion is irrelevant to the *fact* of composition, though it may describe the object's properties. Verdict: Composition occurs (value 1).
  2.  **Nihilist:** Since Nihilism denies that composition ever occurs, there are only simples arranged *Alpha*-wise and simples arranged *Beta*-wise, and perhaps simples arranged *fused-pair*-wise. There is no further entity 'the fusion'. Verdict: No composition (value 0).
  3.  **Organicist:** Composition occurs if and only if the activity of the parts constitutes a life. Here, the metabolic unity suggests one life, but the separate reproduction and distinct genetic origins suggest two lives in a symbiotic grip. Because the criteria for 'a life' pull in opposite directions, it is genuinely indeterminate whether the necessary condition for composition is met. Verdict: Indeterminate (Yes/No).
  4.  **Degrees Theorist:** Composition is graded by integration. The parts score highly on survival dependence (removal kills the parts) and holistic behaviour (locomotion is explained by the whole), but lowly on reproductive unity. Thus, the fusion is not a full object (1.0) like a standard organism, nor a mere heap (0.1), but an intermediate composite. Verdict: Partial composition (e.g., 0.7).

  **Analysis of the Key Feature**

  The feature doing the metaphysical work is **metabolic interdependence without reproductive unity**. This isolates causal integration from the biological standard of 'organism'. If you remove the metabolic fusion, the Degrees verdict drops to near zero (a mere heap), and the Organicist verdict becomes a clear 'No'. If you tweak the case so they share a zygote, the Organicist verdict becomes a clear 'Yes', and the Degrees verdict rises to 1.0. The case exploits the gap between functioning as a unit and being a single biological individual.

  **Deflationary Objections and Honesty**

  A Nihilist will deflate this by arguing that 'degree of composition' is merely a *degree of similarity* to a paradigm object, not a degree of existence. They will say you are measuring how integrated the simples are arranged, not how much 'objecthood' exists; ontologically, it is still all or nothing (either there is an object or there isn't). An Organicist might argue that 'life' is a precise natural kind, and our uncertainty is merely epistemic; either the homeostatic loop constitutes one life or it does not, and further biological investigation would resolve it.

  To be honest, the Degrees view risks merely relabelling the disagreement. By mapping 'integration' onto 'existence', it assumes that causal cohesion is what *makes* an object exist. If one denies that premise, the degrees view collapses into a description of organisational complexity rather than a metaphysical account of composition. It solves the SCQ only if one accepts that existence itself can be vague, which many critics deny is coherent.
