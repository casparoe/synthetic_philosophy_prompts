prompt: |-
  Hey, I'm a high school junior and I'm in this philosophy club where we have to write a short story that makes a philosophical idea feel real. I came up with this premis and I want you to write the story. So in the near future, when a self-driving car or a delivery drone hurts someone, the law doesn't try to figure out which engineer or owner or software update was at fault. Instead, it holds a lottery among everyone who used that company's system in the last month, and the person who wins has to serve the sentence. The idea is that if we all benefit from the system, we all share the risk. My story is about a 16-year-old kid who wins the lottery for a drone that killed a pedestrian. He didn't build the drone, he didn't own it, he just ordered a burrito with it once. Now he has to decide whether to accept the punishment or go on TV and argue that the real responsible party is the system itself, which isn't a person. I want the story to make the reader feel the responsibility gap—like, there's no one who really did it, but someone has to pay. Can you write like 1500 words, first person from the kid's view, set in a near-future city? Make it concrete, not preachy, and don't mention any philosophers or theories by name. Then, after the story, give me a JSON object with these fields: 'title' (the story's title), 'protagonist' (who the kid is and what he cares about), 'incident' (what the drone did), 'lottery_mechanism' (how the lottery works and why it's supposed to be fair), 'kids_argument' (his main argument against being punished), 'counterargument' (the strongest argument that he should still be punished), 'unresolved' (what the story leaves open), and 'philosophical_question' (the one question the story is really about). Please use exactly those field names and keep the values short—one or two sentences each. Also, I'm definately not looking for a bibliography or anything, just the story and the JSON.
