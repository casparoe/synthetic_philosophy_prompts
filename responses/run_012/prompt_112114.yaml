answer: |-
  The notification didn't come with a sound. It just vibrated against my wrist bone, a persistent, insect-like buzzing that I felt before I saw it. I was sitting in homeroom, pretending to listen to Mr. Henderson drone on about civic duty, when the red light on my comp blinked. Most kids got ads for sneakers or grades updates. I got the Seal.

  It was a black hexagon with a white scale in the center. Selected.

  My stomach dropped out of my chair. I knew what it meant. Everyone knows what it means. Three days ago, a SwiftEats delivery drone had clipped a pedestrian on 5th Avenue. Mrs. Gable, sixty-four years old, carrying groceries. She died an hour later in the trauma unit. The drone's software had glitched during a wind shear, misjudging the descent vector. No engineer was charged because the code was proprietary black-box learning. No owner was charged because the drone was part of a shared fleet. So the law did what the law always does now: it looked for a body.

  Under the Distributive Liability Act, if a autonomous system causes harm, the penalty is distributed among the users who fueled the system's existence. They pull a name from the pool of everyone who interacted with SwiftEats in the last thirty days. I had ordered a chicken burrito on a Tuesday. That was my interaction. That was my crime.

  My mother was waiting at the school gates, her face pale as paper. She didn't hug me. She just grabbed my arm, her fingers digging into my sleeve, and marched me to the car. The silence in the vehicle was heavy, filled only by the hum of the electric engine and the soft whir of the traffic drones overhead.

  "We hired counsel," my father said when I walked into the living room. He was standing by the window, looking out at the city skyline, where thousands of lights blinked in the twilight. "Mr. Henderson. Not the teacher. The lawyer."

  "I didn't do anything," I said. My voice sounded thin, like it belonged to someone younger. "I just ate lunch."

  "It's not about what you did, Leo," my father said, finally turning around. He looked tired. We all looked tired. "It's about the contract. When you swipe to order, you agree to the Terms. Everyone does. It's the price of convenience."

  "But I didn't kill her," I said. "The machine did."

  "And the machine doesn't have a soul to punish," my mother whispered. She was sitting on the couch, clutching a tissue. "So the state takes a piece of us instead. To keep us honest. To keep us careful."

  That was the logic they taught us in civics. Shared benefit, shared risk. If we all want the drones to bring us food and medicine and packages in twenty minutes, we all have to own the accidents. It's supposed to make us watch the skies. It's supposed to make us demand better safety. But standing there in my parents' living room, I didn't feel responsible. I felt hollowed out. I felt like a placeholder.

  Mr. Henderson arrived an hour later. He was a sharp man in a gray suit that cost more than my father's car. He set up a holographic projector on the coffee table.

  "Here's the situation," Henderson said, tapping the air. A image of the drone floated above the table, sleek and white. "The prosecution isn't going to argue you piloted it. They don't need to. The law is clear. You are the Selected User. Your penalty is six months in a correctional facility and a permanent mark on your record."

  "Six months," I repeated. "For a burrito."

  "For participating in the ecosystem," he corrected. "Now, you have a choice. You can accept the sentence quietly. The company will pay your legal fees, and your family gets a stipend. Or, you can go public. You can fight it."

  "Fight it how?"

  "By arguing the system is at fault," Henderson said. "But the system isn't a person, Leo. You can't put code in handcuffs. If you go on TV and say 'I'm not responsible,' you're saying no one is. And the public hates a vacuum. They want blood. If you deny the guilt, they might come for your parents. Aid and abet. Negligent supervision."

  My mother gasped. My father clenched his jaw.

  "I need to think," I said.

  The interview was scheduled for the next morning. Studio 4. The lights were so bright they felt physical, pressing against my skin. The host, a woman with perfect hair and a sympathetic smile, sat across from me. The camera lens was a dark, unblinking eye.

  "Leo," she said softly. "Thank you for coming. How are you holding up?"

  "Fine," I lied.

  "Many people are angry," she said, leaning forward. "Mrs. Gable's family is grieving. They want to know why a sixteen-year-old boy is sitting here instead of the people who built the drone."

  "I didn't build it," I said.

  "But you used it," she countered. "You contributed to the demand. You are part of the network. If you hadn't ordered that burrito, would the drone have been in that sector?"

  "Maybe," I said. "Or maybe someone else would have ordered tacos. The drone was already in the air. It was already working. I just... I just tapped a screen."

  "And yet, here we are," she said. "The lottery picked you. Do you accept the responsibility?"

  I looked at the camera. I thought about Mrs. Gable. I thought about her groceries spilling on the pavement. I thought about the engineer who wrote the code, sleeping safely in his bed because his name wasn't in the pool. I thought about the thousands of other kids who ordered burritos that month, scrolling past the news, relieved it wasn't them.

  The responsibility gap. That's what Mr. Henderson called it in private. The space between the action and the consequence where no one stands. The law fills that space with us. With random users. It makes us the shock absorbers for progress.

  If I say yes, I go to jail. I admit guilt I don't feel. I validate a system that says convenience is worth a life, as long as the cost is shared.

  If I say no, I risk my parents. I become the villain who refused to pay his debt. I point at a machine and say *it* did this, knowing the machine cannot suffer.

  The floor of the studio was cool beneath my shoes. The red light on the camera blinked. *On Air.*

  "I ordered a burrito," I said. My voice didn't shake. "I didn't order a death."

  The host's smile tightened. "But you accepted the Terms of Service."

  "The Terms say I share the risk," I said. "They don't say I share the guilt. There's a difference."

  "Who is guilty then, Leo?"

  I looked past her, past the lights, to the window where the city hummed. Somewhere out there, a thousand drones were weaving through the air, carrying food and packages, invisible threads connecting us all. They were silent. They were efficient. They were ours.

  "I don't know," I said. "But I know it isn't me."

  The silence stretched out, thin and brittle. I waited for the handcuffs. I waited for the applause. I waited for the screen to go black. All I heard was the hum of the air conditioning, keeping the studio cool for the cameras. I had spoken the truth, or maybe I had just spoken my own sentence. The gap was still there, wide and dark, and I was standing right on the edge of it.

