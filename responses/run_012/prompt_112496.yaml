  ### The Principle

  The rule that best explains your list is a combination of **(d) Standing Convention** and **(e) Voice/Perspective**. I will call this **The Principle of Conventional Force with Licensed Distancing**.

  It consists of three clauses:

  1.  **Inertial Force:** W carries a conventional force of derogation that is independent of the speaker's private attitude or intent. This force is activated by default whenever the word is uttered semantically. (This explains why good intentions fail in Cases 3 and 7).
  2.  **Voice Attribution:** The derogation is attributed to the *speaker* only if the speaker is operating in their *own social voice* and endorsing the term's reference. If the speaker is clearly *mentioning* the word, quoting another, or enacting a fictional persona, the force is not attributed to them. (This explains Cases 5, 6, and 9).
  3.  **Membership License:** Members of G possess a specific social license to neutralize the word's conventional force when speaking in their own voice within in-group contexts. This license can be forfeited if the word is weaponized intra-group. (This explains Cases 1, 2, and 4).

  **Why this combination?**
  Option (b) (Attitude) fails because you judge neutral/affectionate Non-G use as derogatory (Cases 3, 7). Option (c) (Identity) fails because you allow Non-G use in quotation/performance (Cases 5, 6). Option (a) (Meaning) fails because you allow G use without derogation (Case 1). Option (d) alone explains the toxicity but struggles with the exceptions; Option (e) alone explains the exceptions but struggles with the toxicity of well-intentioned Non-G use. Together, they account for the inertia of the harm and the specific conditions under which it is suspended.

  ### Application to Undecided Cases

  **Case A (Fan singing along):**
  **Verdict: Not derogatory.**
  **Reasoning:** This falls under Clause 2 (Voice Attribution). The fan is not speaking in their own social voice to classify or address anyone; they are enacting the lyrics of the G artists. Like the actor in Case 6, the fan is ventriloquizing a G voice. The context of the concert makes the "distancing" clear: the words belong to the performers, not the audience member.

  **Case B (Text-to-speech reading transcript):**
  **Verdict: Not derogatory.**
  **Reasoning:** This falls under Clause 2 (Voice Attribution) and touches on Case 9. The system has no agency to endorse the convention. It is a mechanical tool reading a record. Like the historian in Case 5, it is presenting the word as part of a document, not using it to refer. There is no "speaker" to whom derogation can be attributed.

  ### The Cost: Which Verdict to Surrender

  To keep this principle robust, you should surrender or complicate **Verdict 6 (The Actor)**.

  **The Conflict:**
  Your principle relies on the distinction between "own voice" and "distanced voice." Case 6 assumes that an audience can perfectly distinguish the actor's voice from the character's voice. However, the **Inertial Force** clause (derived from Cases 3 and 7) states that the word does damage regardless of intent. If the harm lies partly in the *auditory experience* of a Non-G mouth producing the sound, the "fictional frame" may not be thick enough to stop the damage.

  Unlike Case 5 (Historian reading a letter), where the word is explicitly marked as *past* and *other*, Case 6 involves a Non-G embodying the slur in the *present* tense. If the Convention is truly as severe as your Background suggests ("among the most severe things one can call a G person"), then the mere production of the sound by a Non-G agent may trigger the harm, regardless of the script.

  **Recommendation:**
  You should complicate the principle to keep the verdict, or surrender the verdict to keep the principle strict.
  *   **To keep the verdict:** You must add a caveat to Clause 2: "Distancing works only if the fictional frame is unbreakable." This makes Case 6 context-dependent (e.g., if the actor breaks character, the derogation returns).
  *   **To keep the principle strict:** You should concede that Case 6 is, at minimum, "licensed but risky," rather than "not derogatory." The actor avoids *personal* blame, but the utterance may still contribute to the standing convention's toxicity.

  **Why not Case 1?**
  You might be tempted to sacrifice Case 1 (claiming the word is always "ugly" even in-group). However, your Background explicitly takes in-group use as a given. Sacrificing Case 1 would contradict the sociological reality you've accepted. Case 6 is the more fragile philosophical link; it depends on the audience's perception of the "frame," whereas Case 1 depends on the speakers' shared identity, which is more stable.

  **Summary:** Keep the **Principle of Conventional Force with Licensed Distancing**. Apply it to clear A and B as **Not Derogatory**. But acknowledge that **Case 6** is the weak point: if the Convention is strong enough, no amount of "acting" fully neutralizes a Non-G uttering W.
