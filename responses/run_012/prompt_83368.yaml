prompt: |-
  I host a small philosophy of mind podcast and next weeks guest is someone who's spent about twenty years defending a heterophenomenological approach to consciousness — Dennett's line that you take what a subject says about her experience as data about what she believes, not as data about what her experience is actually like, and then build up this heterophenomenological world the way you'd build up the world of a novel from its text. I don't want her just restating that for forty minutes. She has a newer twist I want the interview built around: she says the heterophenomenological world should be treated as a fitted model, roughly the way a generative model in computational cognitive science gets fitted to behavioral data, and her further claim is that any model that predicts a subject's reports well enough can always be reparameterized so that no what-it's-like parameter is doing any work in the fit. Which she takes to show that phenomenal properties are never part of the best explanation of anything — not merely that we never get to observe them.

  Give me 8 to 10 questions with a follow-up after each one, the follow-up keyed to the answer she's most likely to give. I want the questions to turn on the actual content of her position, so press where the literature actually presses. A few things I specifically need covered somewhere in there:

  - how the fiction is supposed to be constrained at all — the reports underdetermine the world, so what picks out the right one, and whether her model-fitting story makes that better or worse
  - the confabulation cases (choice blindness and friends), where a subject confidently reports a reason that doesn't match what she actually did
  - the neurophenomenology objection (Varela and the people who followed him): trained subjects producing refined first-person reports that are supposed to constrain the dynamical model rather than just be predicted by it
  - a subject who sincerely reports having no experiences at all
  - and I want the last question to be about what could count against the parsimony move, i.e. what would make her give up the claim that the seeming-parameter is never needed

  Also, I dont want any soft openers — nothing about how she got into philosophy, nothing about why consciousness is fascinating. Straight into the substance.
