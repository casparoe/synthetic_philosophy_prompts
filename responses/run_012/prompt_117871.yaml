answer: |-
  You are tracking a distinction that is vital to the philosophy of science but often lacks a single, stable noun in ordinary discourse. You are distinguishing between **predictive accuracy** (matching the data) and **structural fidelity** (matching the machinery that generates the data).

  There is no single, universally standardized term for this specific "extra ingredient," but it is the core engine of two existing concepts: **Structural Continuity** (from Structural Realism) and **Heuristic Power** (from Lakatosian methodology).

  If I must coin a term to capture exactly what you describe—the property of errors that contain the seed of their own correction—I would call it **Corrective Coherence**.

  Here is the breakdown of what this concept commits you to, how it differs from accuracy, and what you are smuggling in.

  ### 1. The Name and The Commitment
  **Existing Concept: Structural Continuity**
  In the philosophy of science, this intuition is best formalized by **Structural Realism** (specifically the work of John Worrall). When a theory like Fresnel's optics is replaced by Maxwell's, the *entities* (the ether) are discarded, but the *mathematical structure* is preserved. The "errors" of the old theory were not random; they were deviations along a structural axis that the new theory simply recalibrated.

  **Coined Term: Corrective Coherence**
  If we focus strictly on the errors themselves, **Corrective Coherence** describes a state where the residual error (the difference between theory and truth) is not white noise, but a signal.
  *   **What it commits you to:** It commits you to the belief that the world has a stable structure that theories can latch onto imperfectly. It asserts that a theory can be *causally* right even when it is *empirically* wrong.
  *   **How it comes apart from Accuracy:** Accuracy is a **state** variable (how close is the output to the target *now*?). Corrective Coherence is a **vector** variable (does the error indicate a direction for adjustment?).
      *   *High Accuracy / Low Coherence:* A curve-fitted model that predicts perfectly but breaks if you change one parameter. Its errors are random because it has no grasp of the underlying mechanism.
      *   *Low Accuracy / High Coherence:* A linear model applied to a curved world. It is consistently wrong (systematic error), but the error tells you exactly what function you need to find next (e.g., "add a squared term").

  ### 2. The Smuggling
  You asked whether you are smuggling something in, noting that "being on the right track appears to relate a theory to theories that do not yet exist."

  **Yes, you are smuggling in three substantial assumptions:**

  **A. Scientific Realism (Specifically, Structural Realism)**
  To say the systematic forecaster is "closer to being right" assumes there is a "right" to be close to, independent of the data. An *Instrumentalist* (who believes theories are just tools for prediction) would say both forecasters are equal because their utility (70% accuracy) is identical. By preferring the systematic error, you are asserting that the *reason* for the success matters, not just the success itself. You are assuming the theory is mapping a territory, not just correlating landmarks.

  **B. Retrospective Teleology (Whig History)**
  You are judging the predecessor by the successor. You know the first forecaster is "closer" only because a second model came along and fixed the bias. At the time the first forecaster was operating, without the successor in hand, their systematic error looked just as stubborn as random noise.
  This smuggles in a **teleological view of progress**: it assumes history moves in a direction toward truth. If science is not cumulative (if the next theory doesn't fix the old one but simply changes the paradigm entirely), then "Corrective Coherence" is an illusion. You are assuming the future will validate your judgment of the present.

  **C. The Dispositional Property**
  You are treating the theory as having a *disposition* rather than just a *performance*. You are claiming the theory *would* yield truth *if* certain adjustments were made. This is a modal claim (about possibility and necessity) rather than an empirical one (about actual data). You are smuggling in counterfactuals: "If we had only tweaked parameter X, this theory would be true."

  ### 3. Summary
  The concept you are tracking is **Corrective Coherence** (or **Structural Fidelity**).

  *   **It excludes:** Theories that achieve accuracy through coincidence, overfitting, or parameter tuning without structural understanding. It excludes "black box" success.
  *   **It includes:** Theories that fail predictively but succeed in identifying the relevant variables and relationships, leaving only calibration errors.
  *   **The Cost:** To use this concept, you must accept that science is a cumulative search for structural truth, not just a graveyard of useful tools. You must be willing to judge a dead theory by the life of its successor.

  You are not just measuring how well the theory fits the world; you are measuring how well the world fits the theory's *potential*.
