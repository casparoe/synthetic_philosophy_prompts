      *   *The Synthesis/Verdict:* The residual view makes leisure fragile. If the economy needs growth, leisure is the first sacrifice (see France's erosion, Japan's overtime culture persisting despite caps). The rival view posits leisure as *ontologically prior*. You are a citizen first, worker second.
