      *   *Section 1: The Japanese Case (Karoshi & Caps).* Discuss the tragedy (Dentsu), the legislation (caps), and "Premium Friday." Show how this is purely residual/instrumental (safety valve, consumption stimulus). It treats time as waste to be managed, not owned.
      *   *Section 2: The French Case (35-Hour Week).* Discuss the Aubry laws. Acknowledge the "success" narrative but highlight the erosion (holes gnawed in it). Crucially, note the justification: job creation (macroeconomic lever), not individual sovereignty. This reinforces the residual view.
      *   *Section 3: The Weberian Ghost.* Connect to the Protestant Ethic. The "calling." Leisure as dangerous/idle. The "Iron Cage" (Parsons/Weber). Even without the theology, the cage remains. The residual view keeps the cage locked; the rival view tries to break it.
      *   *Section 4: The Verdict/Argument.* Why the residual view fails (it makes leisure contingent on economic utility). Why the rival view is necessary (leisure as a precondition for citizenship/humanity, not a byproduct). Who holds the right? The worker, but enforceable collectively.
      *   *Conclusion:* Bring it home. A call to change the language of the demand.

  3.  **Drafting - Section by Section (incorporating British English):**

