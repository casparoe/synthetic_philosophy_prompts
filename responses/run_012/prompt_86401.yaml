answer: |-
  1. The pattern presupposes that causation is not a brute physical fact but a normative status assigned only when a specific duty to act exists. It treats omissions as causes legally and ethically only when there is a prior obligation to intervene.
  2. The ICU rules and criminal law are internally consistent because both rely on the scope of professional or parental duty rather than a metaphysical distinction between doing and allowing. The nurse breaches a duty of care, while the doctor fulfills a duty to respect patient autonomy or avoid futility.
  3. The administrative requirements for forms and signatures exist to verify that the omission falls within an authorized exception to the duty to preserve life. However, the practice of gradually weaning ventilators serves psychological comfort rather than logical necessity under this causal framework.
  4. Multiple ethical theories could license these same policies, meaning the specific view of causation is underdetermined by the actual protocols we follow. A utilitarian framework focusing on resource allocation might reach identical conclusions without relying on duty-based causation.
  5. If omissions were treated as causally identical to actions regardless of duty, withdrawing life support would legally constitute homicide unless specifically exempted by statute. Consent forms would need to explicitly admit causation rather than framing the death as natural.
