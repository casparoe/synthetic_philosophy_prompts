answer: |-
  ### Spec: Rational Choice Under Indifference

  **Desiderata**

  1.  **Rational Symmetric Choice (D1)**
      *   *Case:* Buridan's Ass. Two identical bales.
      *   *Requirement:* Selecting one bale must be certified rational despite $U(A) = U(B)$. The theory cannot define rationality solely as maximizing strict preference.
      *   *Status:* **Local Preference** (Indifference-Realist Camp). Standard Revealed Preference Theory denies this, equating choice with strict preference.

  2.  **Action Imperative (D2)**
      *   *Case:* Starvation. The donkey dies if it waits for a distinction that will never arrive.
      *   *Requirement:* Indecision must be dominated by action. A theory permitting permanent suspension of judgment in the face of equal utility is inadmissible for embedded agents.
      *   *Status:* **Non-Negotiable** (Survival/Embeddedness).

  3.  **Justificatory Purity (D3)**
      *   *Case:* The Honest Agent. The agent asserts $A \sim B$ and chooses $A$.
      *   *Requirement:* The theory must not retrospectively assign $A > B$ to justify the choice, nor permit an "arbitrary" selection to count as a *reason* without explicit randomization mechanics. No smuggling value where there is none.
      *   *Status:* **Local Preference** (Anti-Arbitrariness Camp). Standard CDT/EDT accepts arbitrary selection as rational.

  4.  **Indifference/Incomparability Distinction (D4)**
      *   *Case:* Career vs. Morality (Incomparable) vs. Apple vs. Apple (Indifferent).
      *   *Requirement:* The formalism must distinguish $A \sim B$ (equal value) from $A \parallel B$ (no value relation). Indifference permits substitution; incomparability does not.
      *   *Status:* **Non-Negotiable** (Conceptual Coherence).

  5.  **Dynamic Consistency (D5)**
      *   *Case:* Money Pump. An agent cycles through tied options paying fees to switch.
      *   *Requirement:* The tie-breaking mechanism must not allow exploitation over sequential choices. Preferences (or tie-break rules) must be stable or pre-committable.
      *   *Status:* **Non-Negotiable** (Instrumental Rationality).

  6.  **Label Invariance & Causal Sensitivity (D6)**
      *   *Case:* The Twin Bales. Swapping the physical positions of the bales should not change the choice probability unless position is causally relevant.
      *   *Requirement:* Tie-breaking cannot depend on variable names (e.g., "choose A because it's first in the list") but can depend on causal indexicals (e.g., "choose the closer one").
      *   *Status:* **Local Preference** (Structuralist Camp).

  7.  **Representational Indiscernibility (D7)**
      *   *Case:* The Perfect Clone. The agent's internal state and external sensors cannot distinguish $A$ from $B$ under any description.
      *   *Requirement:* The theory must specify a choice mechanism even when the agent lacks the representational bandwidth to index the options differently.
      *   *Status:* **Local Preference** (Physicalist Camp).

  8.  **Endogenous Preference Formation (D8)**
      *   *Case:* Existential Choice. Choosing $A$ makes $A$ preferred post-hoc (commitment).
      *   *Requirement:* The act of choosing may resolve the indifference by creating a new preference structure, provided this does not violate Dynamic Consistency.
      *   *Status:* **Local Preference** (Constructivist/Existentialist Camp).

  ***

  **Incompatible Subset**
  **{D2, D3, D6, D7, Determinism}**
  If an agent *must* act (D2), cannot invent a reason (D3), cannot use labels (D6), and cannot represent a difference (D7), a **deterministic** choice function is impossible. This subset forces **Randomization**. Any theory claiming to satisfy these five while remaining deterministic is incoherent.

  ***

  **The Killer Requirement**
  **D3 (Justificatory Purity)**
  This requirement eliminates the largest number of standard families by attacking their justification mechanisms:
  *   **Complete Preferences + Arbitrary Tie-Break:** Eliminated. Arbitrary selection violates D3 (it smuggles a "choice" without a reason).
  *   **Incomplete Preferences + Maximality:** Pressured. If maximality permits indecision, it violates D2; if it forces choice without value difference, it violates D3.
  *   **Satisficing:** Pressured. Stopping at "good enough" often relies on arbitrary cutoffs vulnerable to D3/D5 challenges.
  *   **Randomizing:** Survives, but only if randomness is explicitly modeled as the "reason" (accepting D3's constraint).

  D3 is the only constraint that specifically targets the "one-line refutation" complaint (that indifference precludes rational choice) without simply asserting completeness or allowing arbitrary magic.

  ***

  **Scorecard**

  | Family | D2 (Action) | D3 (Purity) | D5 (Consistency) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Complete + Arbitrary** | Pass | **Fail** | Pass | **Eliminated** |
  | **Incomplete + Maximality** | **Fail** | Pass (No choice) | **Fail** | **Eliminated** |
  | **Randomizing** | Pass | Pass (if explicit) | Pass (if pre-committed) | **Viable** |
  | **Satisficing** | Pass | **Fail** | **Fail** | **Eliminated** |

  **Result:** Only **Pre-committed Randomization** (or a theory of Endogenous Preference that satisfies D5) survives the full spec. Standard deterministic tie-breaking is ruled out by D3 + D7.
