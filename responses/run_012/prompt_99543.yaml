          4.  Closing advice on presentation.

      *   *Refining the Analysis of (5):* Claim (5) is the "Poison Pill." It claims alternatives are *unfalsifiable as actually deployed*. This is a sociological claim about how biologists work, but it has philosophical consequences. If they are unfalsifiable, they aren't scientific rivals. But if (2) is true, biologists *do* successfully identify them. So (5) contradicts the reality implied by (2).
