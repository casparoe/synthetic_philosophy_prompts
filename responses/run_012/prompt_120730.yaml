answer: |-
  Here is the specification you requested. It is designed to map the philosophical terrain your characters inhabit without flattening the conflict into a single solution. I have treated your nine points as constraints on a theory of diachronic rationality.

  For each requirement, I have marked it as **Non-Negotiable** (any theory claiming to handle diachronic agency must answer this) or **Camp Commitment** (accepting this commits the theory to a specific school of thought, e.g., Time-Slice Epistemology vs. Planning Theory).

  ### The Specifications

  **1. The Exploitation Constraint**
  *   **Motivating Case:** The Money Pump (cyclic preferences) and the Diachronic Dutch Book (shifting credences).
  *   **Requirement:** The theory must distinguish between *vulnerability* to exploitation and *irrationality*. It must specify whether the defect lies in the initial preferences/credences (synchronic) or in the failure to update/hold firm (diachronic). Crucially, it must determine if *regret* is a constitutive element of the irrationality or merely a symptom.
  *   **Status:** **Non-Negotiable.** A theory that calls an agent irrational simply because a bookie exists is useless; a theory that says an agent is rational despite being pumped dry of resources is equally useless.
  *   **Verdict on your characters:** If the theory locates the defect in the *cycle*, the woman leaving the husband is irrational. If it locates the defect in the *exploitation*, she is merely unlucky. Most robust theories convict the agent of irrationality only if the preferences are cyclic *and* the agent knows it. Regret alone is not evidence; it is the *predictability* of the regret that matters.

  **2. The Reduction Constraint**
  *   **Motivating Case:** The Time-Indexed Preference. (e.g., "I prefer to smoke at t1" vs. "I prefer to be healthy at t2").
  *   **Requirement:** The theory must declare whether diachronic incoherence can be fully reduced to a set of synchronic inconsistencies among time-indexed preferences. If it can, there is no "future self," only a series of present selves with conflicting desires about other times. If it cannot, the theory must identify the irreducibly diachronic norm (e.g., a norm of stability or continuity).
  *   **Status:** **Camp Commitment.** Accepting irreducibility commits you to a Planning Theory or Constitutive View of agency. Accepting reducibility commits you to Time-Slice Rationality.
  *   **Verdict on your characters:** If reducible, the contract is just a preference of Self-1 that Self-2 ignores. If irreducible, Self-2 is violating a norm of agency itself.

  **3. The Precommitment Constraint**
  *   **Motivating Case:** Ulysses and the Sirens (binding the mast).
  *   **Requirement:** The theory must validate the rationality of the binding act *and* the irrationality of the unbinding act (if the plan was rational) without contradiction. It cannot simply say "binding is good" and "maximizing at t2 is good" if those two clash. It must provide a single standard that ranks the *policy* over the *particular act*.
  *   **Status:** **Non-Negotiable.** (But see the Unsatisfiable Pair below).
  *   **Verdict on your characters:** If the theory fails this, the contract is fiction. If it passes, the contract is normatively real, even if physically breakable.

  **4. The Identity Constraint**
  *   **Motivating Case:** The Repudiator (who changes values and feels no regret) vs. The Akratic (who changes behavior but keeps values and feels regret).
  *   **Requirement:** The theory must distinguish between a rational *change of mind* (new information, genuine value shift) and a *failure of coherence* (weakness of will). It cannot define rationality solely as the satisfaction of the *current* self's preferences, or the Repudiator is always rational and the Akratic is always irrational, regardless of context.
  *   **Status:** **Non-Negotiable.**
  *   **Verdict on your characters:** The woman who leaves the husband must be judged against whether her values changed or her resolve failed. The theory must allow for the possibility that she is the *same person* but failing a diachronic norm.

  **5. The Unit Constraint**
  *   **Motivating Case:** The Club (members profiting from lapses).
  *   **Requirement:** The theory must specify the locus of evaluation. Is the unit the *act*, the *agent-at-t*, or the *person-over-time*? If the unit is the agent-at-t, the future self is effectively a stranger. If the unit is the person-over-time, the future self is a part of the same evaluative whole.
  *   **Status:** **Camp Commitment.**
  *   **Verdict on your characters:** If the unit is the *agent-at-t*, the Club is just a market. If the unit is the *person-over-time*, the Club is a parasite on the agent's unity.

  **6. The Capacity Constraint**
  *   **Motivating Case:** The Untied Man (resolve without ropes).
  *   **Requirement:** A rational requirement must be satisfiable by the agent's will alone, absent external technology. If "ought implies can," a theory cannot demand diachronic coherence if the agent lacks the psychological capacity to enforce it without external aids.
  *   **Status:** **Non-Negotiable.**
  *   **Verdict on your characters:** If the theory requires ropes to be rational, then the man with the pill is rational and the man with only willpower is irrational. This is a hard pill to swallow. A robust theory must allow for internal commitment to count as a "device."

  **7. The Tempter Constraint**
  *   **Motivating Case:** The Active Firm (engineered lapse) vs. The Passive Bookie.
  *   **Requirement:** The theory must determine if the *source* of the inconsistency matters. Does the rationality of the agent depend on whether the temptation was endogenous (her own weakness) or exogenous (engineered by a firm with an interest in her lapse)?
  *   **Status:** **Camp Commitment.** (Standard rationality ignores the source; Moralized rationality cares).
  *   **Verdict on your characters:** If the theory ignores the source, the Firm is irrelevant. If the theory accounts for it, the Firm makes the agent a victim of *rational sabotage*, potentially mitigating the charge of irrationality.

  **8. The Doxastic Constraint**
  *   **Motivating Case:** The Pill (forced credence).
  *   **Requirement:** The theory must distinguish between *pragmatic* reasons for belief (it helps me to believe she is faithful) and *epistemic* reasons (evidence suggests she is faithful). It must say whether it is rational to manipulate one's own evidence-processing mechanisms to secure a better outcome.
  *   **Status:** **Non-Negotiable.**
  *   **Verdict on your characters:** If the theory allows pragmatic belief management, the pill is rational. If it demands evidential purity, the pill is a form of self-deception and thus irrational, even if useful.

  **9. The Authority Constraint**
  *   **Motivating Case:** "You will regret this."
  *   **Requirement:** The theory must specify the normative force. Is diachronic coherence a requirement of *rationality* (constitutive of agency) or *prudence* (constitutive of well-being)? Does the prediction of future regret provide a *reason* for action now, or just a prediction of pain?
  *   **Status:** **Camp Commitment.**
  *   **Verdict on your characters:** If prudence, she can ignore the contract if she doesn't care about her future welfare. If rationality, she violates the laws of thought by ignoring it.

  ***

  ### The Unsatisfiable Pair

  You suspected a conflict regarding Precommitment (3). You are correct. The jointly unsatisfiable pair is:

  **Requirement 3 (Precommitment without Paradox)** AND **The Principle of Synchronic Sovereignty.**

  *   **The Principle of Synchronic Sovereignty:** At any time *t*, an agent is rational if and only if she acts to maximize the satisfaction of her preferences/credences at *t*.
  *   **The Conflict:** If the woman signs the contract at *t1*, she prefers to leave the husband. At *t2*, she prefers to stay.
      *   If she stays (honoring the contract), she violates Synchronic Sovereignty at *t2* (she is not maximizing her current preferences).
      *   If she leaves (violating the contract), she violates Precommitment (she has rendered her past self's planning irrational).
  *   **The Verdict:** You cannot have both.
      *   **Time-Slice Theories** keep Synchronic Sovereignty and sacrifice Precommitment. (The contract is not binding; the future self is sovereign).
      *   **Planning Theories** keep Precommitment and sacrifice Synchronic Sovereignty. (The future self is bound by the past plan, even if current preferences shift).
  *   **For your novel:** If you want the contracts to be *binding* in a way that makes breaking them a failure of the *breaker*, you must reject Synchronic Sovereignty. You must argue that the agent is a temporally extended entity whose rationality is not determined solely by the momentary slice.

  ***

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude candidate theories is **Requirement 2 (The Reduction Constraint): specifically, the demand for Irreducible Diachronicity.**

  *   **Why:** The majority of contemporary decision theory and epistemology attempts to reduce all diachronic norms to synchronic norms (e.g., "You should keep your promise" reduces to "You currently prefer keeping promises to the guilt of breaking them").
  *   **Exclusion:** If you insist that there is a *genuine* diachronic norm (a norm that applies to the *relation* between t1 and t2 that cannot be found in t1 or t2 alone), you exclude Humean, Time-Slice, and Standard Bayesian accounts. You force the theory into the camp of Planning Agency (Bratman), Constitutive Agency (Korsgaard), or Narrative Identity.
  *   **For your novel:** This is the "shape of the trouble." If diachronicity is reducible, your characters are just people with changing tastes. If it is irreducible, they are people fighting the fragmentation of their own souls.

  ***

  ### The Point of Failure

  My reasoning is likeliest to fail on **Requirement 6 (The Capacity Constraint): "A rational requirement must be satisfiable by the agent's will alone."**

  *   **Why I might be wrong:** There is a strong argument that rationality is an *ideal*, not a capacity. We might say, "You ought to have kept your vow," even if you psychologically couldn't without the rope. If we accept this, then the "Untied Man" is irrational for lacking the rope, and the "Tied Man" is rational for using it. This validates your "Commitment Firm" as a prosthetic for rationality.
  *   **What would change my mind:** If you can describe a case where an agent *knows* she lacks the willpower, *knows* the contract is rational, but *cannot* sign it without external enforcement, and we still want to call her *rational* (not just weak). If the theory calls her irrational for lacking the tech, the theory becomes a tool for the Firm to sell ropes, rather than a measure of the agent's mind.
  *   **The Risk:** If I drop Requirement 6, I risk making rationality a commodity purchasable by the rich (who can buy commitment devices) and unavailable to the poor (who must rely on will). If I keep Requirement 6, I risk making rationality impossible for most humans.

  **Summary for the Draft:**
  Your characters are irrational only if you adopt a **Planning Theory** (which validates the contract) AND you reject **Synchronic Sovereignty** (which validates the defection). If you do this, the "Active Tempter" (The Firm) becomes a parasite on the necessary structure of agency itself, selling the ropes that the agent's own rationality demands but her psychology cannot supply. The tragedy is not that they break the contract; it is that they need the contract to be rational at all.
