answer: |-
  # Workshop Design: The Epistemic Ledger

  **Title:** The Epistemic Ledger: A Simulation of *Pramāṇa* Theory
  **Time:** 120 Minutes (including break)
  **Participants:** 14 Graduate Students
  **Facilitator:** You (The "Audit")

  ## 1. Materials List

  1.  **One-Page Handout** (Text provided below).
  2.  **Case Cards:** 20 cards total (Text provided below).
  3.  **Desk Labels:** 4 large sheets of paper taped to walls/tables:
      *   DIRECT PERCEPTION
      *   REASONING
      *   TESTIMONY
      *   ANALOGY
  4.  **Tokens:** 50 poker chips or similar (two colors: *Green* for Credit, *Red* for Cost).
  5.  **Role Cards:** 14 small slips of paper (Text provided below).
  6.  **Score Sheet:** For the Facilitator (hidden).
  7.  **Whiteboard:** For tracking the "Ledger" (scores).

  ## 2. The One-Page Handout

  *(Print this exactly as is for participants)*

  ***

  **THE EPISTEMIC LEDGER: RULES OF FILING**

  **GOAL:** Your group must process all **Case Cards**. For each case, you must file it under exactly one of the four **Desks** listed below. You cannot create a fifth Desk unless you pay the Ontological Tax (see Rules).

  **THE FOUR DESKS**
  1.  **Direct Perception:** Knowing something by seeing, hearing, touching, tasting, or smelling it yourself, right now.
  2.  **Reasoning:** Knowing something by calculating, deducing, or working it out from evidence you already have.
  3.  **Testimony:** Knowing something because someone (or some text) told you it is true.
  4.  **Analogy:** Knowing something because you were told it is *like* something else you know, and then you recognized the similarity.

  **THE POLICY CHOICE**
  Before filing, your group must choose one **Validation Policy**:
  *   **Policy A (Permissive):** You may file a case immediately. It counts as Knowledge. *Risk:* If the Audit later finds the filing wrong, you lose **5 Points**.
  *   **Policy B (Strict):** You may not file a case until you "Verify" it. Verification costs **1 Token** per case. *Benefit:* If the Audit finds the filing wrong, you lose only **1 Point**.
  *   *Note:* You start with 10 Tokens. If you run out, you must file under Policy A.

  **THE ONTOLOGICAL TAX**
  If the group agrees a Case fits none of the four Desks, you may propose a **Fifth Desk**.
  *   **Cost:** Pay **5 Tokens** immediately.
  *   **Reward:** If the Audit agrees this source is distinct, gain **10 Points**. If not, the Tokens are gone.

  **SCORING**
  *   Correct Filing: **+2 Points**
  *   Incorrect Filing: **Penalty** (see Policy above)
  *   Unfiled Case (Starvation): **-2 Points**

  **CONDUCT**
  Argue for where cases belong. Do not look up answers. Trust the Facilitator's Audit at the end.

  ***

  ## 3. Case Cards (20 Total)

  *Print and cut. Distribute evenly.*

  1.  You see a fire burning on the hill.
  2.  You see smoke on the hill and know there is fire.
  3.  A trusted friend tells you it is raining in the next valley.
  4.  A hunter tells you a 'gavaya' is like a cow. Later you see a gavaya in the forest and recognize it.
  5.  You look at the table and know **there is no pot** on it.
  6.  You know a man who never eats during the day **must eat at night**, because he is stout and would otherwise be thin.
  7.  A known liar tells you there is gold in the hill. There is gold in the hill (you check later).
  8.  You hear a sound and know it is a thunderclap.
  9.  You see a wet street and know it rained.
  10. A text says the soul is eternal. You believe it.
  11. You are told a 'chevrotain' is like a deer. You see one and know which it is.
  12. You look in an empty box and know it is empty.
  13. You know your friend is angry because they are shouting.
  14. You know your friend is angry because they told you they are angry.
  15. You see a footprint and know a person passed by.
  16. You are told a specific herb cures a headache. You take it and are cured.
  17. You know the sun will rise tomorrow because it always has.
  18. You are told a 'phlogiston' explains fire. (Historical case: False testimony).
  19. You see a mirage and think it is water. (Illusion).
  20. You know a specific person is the murderer because all other suspects are eliminated.

  ## 4. Role Cards (14 Total)

  *Prepare these secretly. Distribute randomly at the start of Phase 1.*

  *   **Truth-Seeker (8 cards):** "Your goal is to maximize the Group's total score. File accurately."
  *   **Winner (4 cards):** "Your goal is to have *your* personal suggestions accepted. Argue aggressively for your filings, even if risky."
  *   **Saboteur (2 cards):** "Your goal is to expose errors. Do not help file cases. Wait for others to make a claim, then point out why it might be wrong. Do not offer solutions."

  *Facilitator Note:* In addition to these, whisper to 4 specific participants (mix of Truth-Seekers and Winners) that they are the **"Reductionist Faction."** Give them a sticky note: *"Your secret bonus: If the group files a Testimony or Analogy case under Perception or Reasoning, you get +1 personal point. Do not reveal this goal."*

  ## 5. Run of Play (120 Minutes)

  ### Phase 0: Setup & Briefing (10 Minutes)
  1.  **Seat the room:** Two tables of 7 (School A and School B).
  2.  **Distribute Materials:** Handout, Role Cards (face down), Tokens (10 per table).
  3.  **Read Rules:** Read the Handout aloud. Emphasize: "The Four Desks are the only currency. Do not use Sanskrit terms. Do not ask me for help."
  4.  **Policy Vote:** Ask each Table to choose Policy A (Permissive) or Policy B (Strict).
      *   *Facilitator Trick:* Encourage Table A to pick Permissive (speed) and Table B to pick Strict (safety). If they choose naturally, note it. The debrief works best if one is A and one is B.
  5.  **Start:** Deal Case Cards.

  ### Phase 1: The Filing (30 Minutes)
  1.  **Action:** Tables discuss each card and place it under a Desk Label.
  2.  **Facilitator Role:** Circulate. Do not answer content questions. If they ask "Does absence count as perception?", say "That is for your group to decide under your Policy."
  3.  **Monitor Reductionists:** Watch the 4 secret Reductionists. If they successfully argue a Testimony case into Reasoning, make a note on your Score Sheet.
  4.  **Fifth Desk Proposals:** If a table tries to create a 5th Desk (e.g., "Non-Perception"), charge the 5 Tokens immediately. Record the proposal.
  5.  **Token Management:** If a Strict table runs out of tokens, they must switch to Permissive for remaining cards.

  ### Phase 2: The Audit (20 Minutes)
  1.  **Stop Work:** Collect all Case Cards.
  2.  **Reveal Key:** Read the "Correct" filing for the Straggler Cases (see Facilitator Key below). For standard cases, accept the majority view.
  3.  **Calculate Scores:**
      *   **Table A (Permissive):** Likely high initial filings, but heavy penalties on Stragglers (Absence, Postulation, Liar). They "bleed."
      *   **Table B (Strict):** Likely fewer filings (starvation) or low score due to token expenditure. They "starve."
      *   **Reductionists:** Reveal the secret bonus. Ask: "Who argued that Testimony was just Reasoning?" Award their points. Show how this saved tokens but risked accuracy.
  4.  **Announce Winners:** Usually, neither table wins decisively. Highlight the trade-off.

  ### Break (10 Minutes)

  ### Phase 3: The Registers (20 Minutes)
  1.  **Instruction:** "We are now entering a Debate Phase. Take one specific Case that was difficult (e.g., The Stout Man or The Liar). Argue for 5 minutes about where it belongs."
  2.  **Reveal Roles:** Ask participants to reveal their Role Cards (Truth-Seeker, Winner, Saboteur).
  3.  **Discussion:** Ask the room: "How did the *Winner* and *Saboteur* behaviors affect the *Truth-Seekers'* ability to file correctly?"
  4.  **Point:** Highlight that epistemic practices depend on the social register of the exchange.

  ### Phase 4: Debrief & Reveal (30 Minutes)
  *(See Script Below)*

  ## 6. Facilitator Key (Hidden)

  *Use this to judge the Audit.*

  *   **Standard Cases (1-4, 8-11, 13-17):** Accept consensus.
  *   **Straggler 1 (No Pot/Empty Box):**
      *   *Pluralist View:* Distinct source (Non-Perception).
      *   *Reductionist View:* Perception (of the table) + Inference (if pot were here, I'd see it).
      *   *Audit Ruling:* If filed under Perception, mark "Contested." If 5th Desk proposed, mark "Ontological Cost."
  *   **Straggler 2 (Stout Man/Postulation):**
      *   *Pluralist View:* Distinct source (Postulation/ *Arthāpatti*).
      *   *Reductionist View:* Inference.
      *   *Audit Ruling:* If filed under Inference, mark "Contested." If 5th Desk proposed, pay Tax.
  *   **Straggler 3 (Liar/True Content):**
      *   *Issue:* Is Testimony valid if the speaker is unreliable?
      *   *Audit Ruling:* If filed under Testimony, penalize unless they verified (Strict Policy).
  *   **Straggler 4 (Analogy vs. Testimony):**
      *   *Issue:* Cards 4 & 11. Is learning the word meaning Testimony or Analogy?
      *   *Audit Ruling:* Mark as "Boundary Dispute."

  ## 7. The Debrief Script

  **1. The Reveal (5 mins)**
  "You have just re-enacted a dispute that occupied Indian philosophers for over a millennium.
  *   The **Four Desks** are the *Pramāṇas*: Perception (*Pratyakṣa*), Inference (*Anumāna*), Testimony (*Śabda*), Comparison (*Upamāna*).
  *   The **Reductionist Faction** represents the Cārvākas or Buddhists who argued only Perception and Inference are real.
  *   The **Fifth Desk** proposals represent the Bhāṭṭa Mīmāṃsā claim for Postulation (*Arthāpatti*) or Absence (*Abhāva*)."

  **2. Mapping the Mechanics (10 mins)**
  *   **The Policy Choice:** "You chose between Permissive and Strict validation. In the tradition, this is the debate between *svataḥ prāmāṇya* (intrinsic validity: a cognition is valid until proven otherwise) and *parataḥ prāmāṇya* (extrinsic validity: a cognition needs external confirmation to count).
      *   Table A (Permissive): You moved fast but bled points on the Audit. This mirrors the risk of trusting cognition too easily.
      *   Table B (Strict): You spent tokens verifying. You were safe but ran out of resources (Starvation). This mirrors the skeptic who demands too much proof and never acts."
  *   **The Reductionist Cost:** "To the Reductionists: You saved tokens by forcing Testimony into Inference. But what was the cost? You had to stretch the definition of Inference. In the tradition, the Reductionist must explain away *why* Testimony *feels* different. If you say 'Testimony is just Inference from reliability,' you must account for cases where we trust without calculating reliability (like a child trusting a parent)."
  *   **The Pluralist Cost:** "To the Pluralists: You kept the Desks distinct. But you paid the Ontological Tax. Why posit a new source of knowledge if an old one can do the work? The tradition asks: Is multiplying sources explanatory power, or just bookkeeping?"

  **3. The Registers (5 mins)**
  "The third phase showed that knowledge isn't just about rules; it's about *why* we are talking.
  *   **Truth-Seeker:** *Jijñāsā* (desire to know).
  *   **Winner:** *Vitandā* (quibbling/winning).
  *   **Saboteur:** *Jalpa* (debate for victory/embarrassment).
  The tradition argues that knowledge (*pramā*) cannot arise in a *Vitandā* register. Did you feel the Truth-Seekers getting frustrated by the Winners?"

  **4. Limitations & The Unreachable (5 mins)**
  "This game captures the structural tension, but it misses the deepest commitment of the tradition.
  *   **The Authorless Text:** In the game, Testimony came from a 'friend' or 'liar.' In Mīmāṃsā, the ultimate Testimony is the Veda, which has *no author*. If a text has no author, it cannot lie. Its authority is intrinsic. We cannot simulate that here because we are in a secular classroom; you naturally ask 'Who said it?' The tradition answers 'No one.' That is a theological commitment this game cannot stage.
  *   **Soteriology:** For the tradition, counting *pramāṇas* isn't academic. It's about liberation. If you misidentify the source of your knowledge about the Self, you remain bound. The 'cost' in the game was points; in the tradition, the cost is *mokṣa*."

  **5. Troubleshooting the "Redefinition" Move (5 mins)**
  "Did anyone try to win by redefining 'Perception' to include 'Reasoning'? (e.g., 'Mental Perception').
  *   **The Fix:** In the game, I charged you Tokens or penalized you. In the tradition, this is the charge of *lakṣaṇā* (stretching the definition). The Nyāya school insists on strict definitions to prevent this. If you allow 'Mental Perception,' you collapse the distinction between seeing and thinking, and the whole ledger becomes useless. The friction you felt when someone stretched a definition *is* the philosophical point."

  ## 8. Predictable Failures & Fixes

  **1. The "Semantic Stretch"**
  *   **Problem:** A participant argues, "Inference is just perceiving the connection between smoke and fire, so it's all Perception."
  *   **Fix:** Do not argue philosophy. Invoke the Game Rules. "That definition merges Desk 1 and Desk 2. That is a 'Fifth Desk' proposal (a unified source). Pay 5 Tokens." This forces them to feel the cost of ontological reduction.

  **2. The "Audit Rebellion"**
  *   **Problem:** Participants disagree with your Audit Key on the Stragglers.
  *   **Fix:** Acknowledge it. "Good. You are now doing Mīmāṃsā. The fact that you disagree proves the point: these cases are the battlefields. In the tradition, Kumārila Bhaṭṭa and Praśastapāda fought over the 'Stout Man' case for centuries. Your disagreement is the data."

  **3. The "Saboteur Dominance"**
  *   **Problem:** The Saboteurs make the group too afraid to file anything.
  *   **Fix:** Use the "Starvation" rule. "You have 5 minutes left. Any unfiled cards are -2 points." Force action. This mirrors the pragmatic necessity of acting even without absolute certainty.

  **4. Time Overrun**
  *   **Problem:** Phase 1 takes too long.
  *   **Fix:** Cut Phase 3 (Registers) short. Merge it into the Debrief by asking "Who felt like they were arguing to win rather than find truth?" rather than doing a full reveal.

  ## 9. Facilitator Notes on Tone

  *   **Be Bureaucratic:** During Phases 1 & 2, act like an Auditor, not a Teacher. "That filing is accepted." "Tokens deducted." Do not explain *why* until the Debrief.
  *   **Be Candid in Debrief:** Admit where the game simplifies. The "Authorless Text" limitation is crucial for your specific research niche; highlight it as the boundary of the simulation.
  *   **Protect the Reductionists:** Ensure the secret Reductionists don't get ganged up on too hard. Their position is philosophically respectable (Parsimony), not just contrarian.

  ## 10. Post-Workshop Reflection (For You)

  *   **Did they feel the cost?** If they complained about the Token cost for Verification, the *parataḥ prāmāṇya* point landed.
  *   **Did the Stragglers stick?** If the "Stout Man" case was the most argued, you successfully highlighted *Arthāpatti*.
  *   **The Unreachable:** You correctly identified the Authorless Text as unreachable. Another unreachable element is the *phenomenological* feel of *pramā* (the specific 'felt validity' of a cognition). The game makes it structural (points), not phenomenological. You will need to supply the phenomenological description in your voice during the debrief.
