answer: |-
  This is a sophisticated methodological problem. Your group member is using a folk epistemological rule ("no smoke without fire") to bypass the rigorous standards of historiography. To help your group move past the stalemate, you need to disentangle the metaphor. The proverb is ambiguous about what constitutes "smoke" (the evidence) and what constitutes "fire" (the cause).

  Here is a menu of five distinct claims the maxim could be making when applied to traditional stories, graded from weakest to strongest, followed by an evaluation of their validity, their ability to shift the burden of proof, and their application to your four cases.

  ### The Menu of Claims

  **1. The Claim of Existence (The Weak Reading)**
  *   **Definition:** The existence of the story proves that *something* caused the story to be told. That cause might be historical, but it might also be psychological, political, or literary.
  *   **Status:** **Trivial.** Stories do not generate themselves; they require authors and contexts.
  *   **Burden of Proof:** Does **not** license his conclusion. It shifts the burden only to prove the story has *a* cause, not a *historical* one.

  **2. The Claim of Reference (The Topographical Reading)**
  *   **Definition:** Proper nouns and settings in the story (e.g., "Troy," "Jerusalem," "Camelot") refer to real places or institutions that existed, even if the events described there did not.
  *   **Status:** **Defensible.** Most myths anchor themselves in real geography to gain verisimilitude.
  *   **Burden of Proof:** Does **not** license his conclusion. Proving a place exists does not prove the battle happened there.

  **3. The Claim of Kernel (The Distorted Memory Reading)**
  *   **Definition:** A specific historical event, person, or episode triggered the narrative tradition. The story is a garbled reflection of a real occurrence, preserved through oral distortion.
  *   **Status:** **Defensible (with caveats).** This is the standard "euhemerist" position. It is plausible for some stories (Troy) and implausible for others (Arthur).
  *   **Burden of Proof:** **Partially licenses** his conclusion. If accepted, it suggests the skeptic must explain *which* event caused the story, rather than denying one existed. However, it does not prove the *details* of the story are true.

  **4. The Claim of Structure (The Narrative Fidelity Reading)**
  *   **Definition:** The sequence of events in the story (the plot) mirrors the sequence of historical events. The causality of the myth reflects the causality of history.
  *   **Status:** **False.** Narrative logic (drama, theme, symmetry) rarely matches historical logic (contingency, chaos, bureaucracy).
  *   **Burden of Proof:** **Fails.** Relying on this invites falsification.

  **5. The Claim of Continuity (The Popular Memory Reading)**
  *   **Definition:** The story was preserved by a continuous chain of popular oral transmission from the event to the text, preventing total invention.
  *   **Status:** **False (in many cases).** Many "ancient" stories are literary revivals or compilations from much later periods (e.g., Malory's Arthur).
  *   **Burden of Proof:** **Fails.** If the chain is broken, the "smoke" may come from a later fire, not the original one.

  ---

  ### Which Reading Licenses His Conclusion?

  Your group member argues that the story's existence shifts the burden of proof to the skeptic.
  *   **Claims 1 and 2** cannot do this. They admit the story exists but allow for non-historical causes.
  *   **Claim 5** would do this effectively *if* it were true, because continuous oral tradition acts as a preservation medium. However, it is historically fragile.
  *   **Claim 3 (The Kernel)** is the one he is actually relying on. He treats the *probability* of a kernel as a *presumption* of fact. He is arguing that because a "Kernel" is the most *parsimonious* explanation for the "Smoke," the skeptic must disprove the kernel.

  **Verdict:** Only **Claim 3** attempts to license his conclusion, but it does so illegitimately. In historiography, the burden of proof always lies with the positive claim ("This happened"), not the negative ("This did not happen"). Claim 3 makes a historical event *possible*, not *probable enough to demand disproof*.

  ---

  ### Predictions for the Four Cases

  Here is how the defensible readings (1, 2, and 3) predict outcomes for your specific cases.

  **1. The War at Troy (The Iliad)**
  *   **Claim 2 (Reference):** **Confirmed.** Hisarlik is a real site with layers of destruction.
  *   **Claim 3 (Kernel):** **Defensible.** Most historians agree a conflict or series of conflicts over trade routes likely occurred in the Late Bronze Age.
  *   **Member's Maxim:** Works well here. The "smoke" (epic) aligns with "fire" (archaeology of destruction layers). The anachronisms (Iron Age weapons in a Bronze Age setting) support his view of "distorted memory."

  **2. The Figure of Arthur**
  *   **Claim 2 (Reference):** **Mixed.** Some battle sites (e.g., Badon) are plausible; Camelot is literary.
  *   **Claim 3 (Kernel):** **Weak.** There is no contemporary evidence. The "details fitting an older world" are often stylistic archaisms inserted by later writers, not memories.
  *   **Member's Maxim:** Strains here. The "smoke" is largely literary (Geoffrey of Monmouth, Chrétien de Troyes). The "fire" is likely a composite of several leaders or a mythologized symbol, not a single man. The burden of proof should remain on the historicist.

  **3. The Exodus Narrative**
  *   **Claim 2 (Reference):** **Confirmed.** Place names (Pithom, Raamses) are real Egyptian sites.
  *   **Claim 3 (Kernel):** **Contested/Weak.** Archaeology does not support a mass migration of 2 million people. A smaller group of Levites escaping is possible but unproven.
  *   **Member's Maxim:** Fails here if applied to the *scale* of the story. If the "smoke" is the national myth, the "fire" might be a small group's experience amplified for nation-building purposes. The maxim obscures the difference between *a* migration and *the* Exodus.

  **4. The Late Shrine (Your Added Case)**
  *   *Scenario:* A story appears late, grows detailed, and a shrine is built to match it, which is then cited as evidence.
  *   **Claim 2 (Reference):** **False.** The place is real, but only *because* the story said it should be there.
  *   **Claim 3 (Kernel):** **False.** The "fire" is the story itself; the "smoke" is the shrine.
  *   **Member's Maxim:** **Breaks Down.** This is the critical counter-example.

  ---

  ### The Reverse Metaphor: When the Story is the Fire

  Your suspicion is correct: in Case 4, the metaphor runs backwards.
  *   **Standard Maxim:** Event (Fire) $\rightarrow$ Tradition/Artifact (Smoke).
  *   **Case 4 Reality:** Tradition (Fire) $\rightarrow$ Artifact/Shrine (Smoke).

  **Can the maxim accommodate this?**
  Only if you redefine "Fire."
  *   If "Fire" means **Historical Event**: The maxim is **False** here. The smoke (shrine) exists without the fire (event).
  *   If "Fire" means **Cultural Conviction**: The maxim is **True** but **Trivial**. It proves people *believed* the story, not that the story *happened*.

  **Advice for the Group:**
  When your member cites the shrine as confirmation, you must point out that the shrine is not independent evidence. It is "feedback." The story generated the shrine, and the shrine is now being used to validate the story. This is a closed loop, not a causal chain from history. In this specific instance, the maxim must be abandoned or inverted: *"Sometimes there is smoke, but the fire is a mirror."*

  ---

  ### Diagnosis: What Your Member Means

  When your member says "there is no smoke without fire," specifically citing "details that fit an older world," he is invoking **Claim 3 (The Kernel)** but arguing as if it grants the weight of **Claim 5 (Continuity)**.

  He believes that because a detail (e.g., a specific type of shield, a forgotten geographic name) fits an era earlier than the text, it *must* be a survival from that era (Continuity). He ignores the possibility that a later author could research or accidentally preserve archaic details without the event being real (e.g., a historical novelist getting details right).

  **Most Likely Meaning:** He means: *"The presence of verifiable archaic details proves a causal chain of oral transmission from the event to the text."*

  **Counter-Argument:** This is the weakest link. Authors can access older sources, or "archaic" details can be poetic tropes that survive longer than the objects they describe. The existence of the detail proves the *source* is old, not necessarily the *event*.

  ### Summary for Your Group

  To move the discussion forward, propose this compromise:

  1.  **Accept Claim 1 & 2:** Agree that stories have causes and often reference real places. (This validates his intuition without validating his history).
  2.  **Reject the Burden Shift:** Maintain that the burden of proof remains on the person claiming historical fact, regardless of the story's age.
  3.  **Apply the "Shrine Test":** For any piece of evidence (like a shrine or a detail), ask: *Could this have been generated by the story, rather than the event?* If yes, the "smoke" is contaminated.
  4.  **Differentiate the Cases:** Admit that Troy (Case 1) fits the maxim better than Arthur (Case 2) or Exodus (Case 3). The maxim is not a universal law; it is a heuristic that works better where archaeology corroborates the "smoke."

  This allows your member to keep his heuristic for cases where it works (Troy) while forcing him to abandon it where the causal chain is broken (Arthur, The Late Shrine).
