answer: |-
  # Joint Statement on the Doctrine of Double Effect and Causal Structure

  **Date:** October 26, 2023
  **Authors:** Party A (Defender, Doctrine of Double Effect) and Party B (Critic, Causal Structure View)
  **Subject:** Adversarial Collaboration on the Moral Relevance of Intention

  After decades of correspondence and debate, we have convened to clarify the precise points of contention between the Doctrine of Double Effect (DDE) and its causal-structural critics. Our goal is not to force a premature consensus, but to map the disagreement with sufficient precision that future work may resolve it. We utilize the "Flooding Tunnel" cases (Case X and Case Y) as a testing ground for our respective theories.

  ### 1. Agreed Claims

  We endorse the following claims as an accurate representation of our shared starting points and the conditions under which we would consider our respective positions refuted.

  1.  **The Phenomenological Data:** We agree that there is a robust, widespread intuitive difference between the standard "Trolley" case (redirecting a threat) and the "Transplant" case (killing a healthy donor). Both parties accept that any adequate moral theory must account for why the former is generally judged permissible and the latter impermissible.
  2.  **The Core Assertion of DDE:** Party A asserts that the DDE claims the distinction between *intended* harm and *merely foreseen* harm is a fundamental moral boundary. Party B accepts that this is what the DDE *claims*, but denies that this distinction does independent moral work.
  3.  **The Role of Causal Structure:** Both parties agree that causal structure (e.g., whether harm is a means to an end or a side effect) is morally relevant. Party B holds it is *exhaustively* relevant (given proportionality). Party A holds it is *evidentially* relevant because it typically determines what is intended, but not *constitutively* relevant.
  4.  **Conditions for Falsification (Party A):** Party A agrees that if the distinction between "intended" and "foreseen" can be shown to be nothing more than a redescription of causal structure (means vs. side-effect) without remainder, the DDE would lose its independent explanatory power and would be untenable as stated.
  5.  **Conditions for Falsification (Party B):** Party B agrees that if the description of "causal structure" (specifically the distinction between means and side-effects) cannot be articulated without covertly appealing to the agent's intentions, then Party B's critique is circular and fails to displace the DDE.
  6.  **Limitations of the Tunnel Cases:** We agree that Cases X and Y (defined below) successfully vary the *causal structure* of the harm relative to the benefit. We further agree that whether these cases successfully vary *intention* independently of causal structure depends on the truth of the very theory we are disputing.

  ### 2. Residual Disagreements

  The following table outlines the precise points of divergence. We have phrased each position in language the respective party accepts, avoiding caricature.

  | Issue | Party A (DDE Defender) | Party B (Causal Critic) |
  | :--- | :--- | :--- |
  | **The Source of the Constraint** | The constraint against harming arises from the agent's will. To intend harm is to make it part of one's plan, which corrupts the agency regardless of the causal outcome. | The constraint against harming arises from the topology of the action. Using a person as a causal means violates their independence; harming them as a side effect does not, provided proportionality is met. |
  | **The Status of 'Intention'** | Intention is a primitive mental state that tracks, but is not identical to, causal role. One can technically intend a means without desiring it, but it remains intended. | Intention, in this context, is a functional label applied to parts of a causal plan that are necessary for success. It adds no moral weight beyond the necessity itself. |
  | **Moral Permissibility** | Two acts with identical causal structures and outcomes can differ in permissibility if the agent's intentions differ (e.g., the reluctant vs. sadistic bomber). | Two acts with identical causal structures and outcomes cannot differ in *permissibility* based on intention. Intention affects the *virtue* of the agent, but not the *right* of the act. |
  | **Case X vs. Case Y** | Case X is impermissible (or significantly harder to justify) because the death is a means. Case Y is permissible because the death is a side effect. | Case X and Case Y are morally equivalent regarding permissibility, assuming the certainty of the outcome and the proportionality are identical. The causal "tightness" is the same. |

  *Note on Neutrality:* In the row regarding "Case X vs. Case Y," Party A refuses to describe the difference as merely "causal," and Party B refuses to describe the difference as "intentional." We have therefore described the cases by their structural properties (means vs. side effect) and recorded the divergent moral verdicts.

  ### 3. The Cruxes

  We have identified three sub-questions ("cruxes") where settling the matter would compel at least one of us to revise our position. For each, we specify a concrete test and record our predictions in advance.

  #### Crux 1: The Circularity of Causal Structure
  **Question:** Can the distinction between "causal means" and "causal side effect" be defined objectively without referencing the agent's intentions?
  **Test:** Analyze Case X. Party B must provide a description of why the drowning in Case X is a "means" that does not implicitly rely on the fact that the agent *chose* this path to save the five.
  *   **Party A Prediction:** Party B will fail. To call the death a "means" is just to say it is intended. If the agent could save the five without the death but chose the path with the death, the death becomes intended. Therefore, "means" is intention-dependent.
  *   **Party B Prediction:** Party B will succeed. The causal chain is objective physics. In Case X, the water *physically must* contact the one to reach the five. In Case Y, it does not. This physical necessity exists regardless of the agent's mental state.

  #### Crux 2: The Intuition Pump (Mental State Variation)
  **Question:** If causal structure is held perfectly constant, does varying the mental state change permissibility?
  **Test:** "The Terror Bomber" variation. Two pilots bomb a munitions factory. Both know a nearby school will explode due to shockwaves (Side Effect). Pilot 1 regrets this. Pilot 2 hopes the school explodes to terrorize the enemy, though it is not causally necessary for the munitions destruction.
  *   **Party A Prediction:** Pilot 2's act is impermissible (or worse) because the harm is intended as an end/means, even if causally redundant.
  *   **Party B Prediction:** Both acts are equally permissible (assuming proportionality). Pilot 2 is a worse person, but the act's permissibility is fixed by the causal structure (munitions destroyed, school destroyed as side effect).

  #### Crux 3: The Isolation of Variables (Cases X and Y)
  **Question:** Do Cases X and Y successfully isolate the intended/foreseen distinction from the means/side-effect distinction?
  **Case Description:**
  *   **Case X:** Save 5 by opening lock. Water *must* pass through side chamber, drowning 1. (Death is on causal path).
  *   **Case Y:** Save 5 by opening lock. Water goes main channel. Pressure valve operation *separately* drowns 1. (Death is off causal path).
  **Analysis of Isolation:**
  *   **Party A Prediction:** These cases do *not* fully isolate the variables. Because the death is a means in X, it is intended. Because it is a side effect in Y, it is foreseen. The variables covary. However, the moral difference we intuit between X and Y confirms that the *means/side-effect* distinction tracks the *intention* distinction. X is impermissible; Y is permissible.
  *   **Party B Prediction:** These cases *do* isolate the causal variable, and they show that intention is irrelevant. The only difference between X and Y is causal topology. Since we intuit a difference (if we do), it is because causal topology matters, not because "intention" is a separate magic ingredient. If we construct a version where the causal necessity is identical but the "intention" is claimed to differ, the intuition of permissibility should remain stable.
  *   **Joint Assessment on Isolation:** We agree that Cases X and Y **fail** to pry the variables apart logically. They vary causal structure, and *if* Party A is right, they vary intention simultaneously. *If* Party B is right, intention is not a separate variable to be isolated. Therefore, these cases test the *correlation* of the theories, but cannot definitively distinguish them without further stipulations about the agent's mindset.

  ### 4. Identification of Verbal Disagreement

  We identify one significant area where we appear to disagree but may be talking past one another.

  **The Definition of "Intention"**
  *   **The Conflict:** Party A often speaks of intention as a specific mental act of "commitment" or "adoption into a plan." Party B often interprets intention as "desire" or "motive."
  *   **The Resolution:** We agree that if "intention" means "what the agent desires for its own sake," Party A's doctrine is easily refuted (e.g., the reluctant surgeon). Party A clarifies that DDE relies on "intention in the plan" (means-end reasoning), not "intention as desire."
  *   **Remaining Ambiguity:** Even with this clarification, a verbal dispute remains over the label "Intention." Party B argues that "intention in the plan" is just a synonym for "causal necessity recognized by the agent." Party A argues that "causal necessity" is a physical fact, while "intention in the plan" is a normative status the agent confers on that fact.
  *   **Action Item:** Future drafts will distinguish between *Intention_P* (Psychological desire) and *Intention_S* (Structural role in plan). Party B claims *Intention_S* reduces to Causal Structure. Party A claims *Intention_S* is a distinct normative category that *tracks* Causal Structure but is not *identical* to it.

  ***

  **Signed,**

  _________________________
  **Party A**

  _________________________
  **Party B**
