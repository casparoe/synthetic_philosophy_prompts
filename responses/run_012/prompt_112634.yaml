answer: |-
  **Logical Space & Joints**

  The debate isn't just "motives vs. outcomes." The real joints are: (1) *Content:* Must the motive be 'duty' (de dicto) or merely align with the right-making feature (de re)? (2) *Causation:* Does worth require the right motive to actually cause the act, or merely be present (overdetermination)? (3) *Robustness:* Does worth track actual psychology or counterfactual sensitivity (would you still do it if incentives changed)? (4) *Attribution:* Does manipulation or mistaken belief defeat agency enough to kill worth? (5) *Structure:* Is worth binary or scalar?

  Crucially, the "Internal vs. Fit" distinction cuts across these. An Internalist (Quality of Will) says worth depends on the agent's psychology even if mistaken about reasons. An Externalist (Right-Making Fit) says worth requires the psychology to latch onto the actual reason. These are independent of whether worth is scalar. A view can be Internalist and Scalar, or Externalist and Binary. The quiz must isolate whether students prioritize the *agent's perspective* or the *world's reasons*.

  ***

  **The Moral Worth Instrument**

  **1. The Honest Shopkeeper**
  A shopkeeper charges fair prices solely because dishonesty hurts business. He never considers fairness itself.
  A. No worth; motive is purely prudential.
  B. Some worth; the action aligns with duty regardless of motive.
  C. Full worth; stability in business is a valid moral reason.

  **2. The Superiority Donor**
  A donor gives anonymously to save lives but is primarily motivated by a secret sense of superiority. The lives are saved.
  A. No worth; the motive is morally ugly.
  B. Partial worth; the good will is present but contaminated.
  C. Full worth; the right-making feature (saving lives) was achieved.

  **3. The Grudging Dutiful**
  An agent helps a friend solely from duty, feeling visible annoyance and lack of sympathy.
  A. High worth; duty overrides inclination.
  B. Low worth; virtue requires harmony between motive and act.
  C. No worth; annoyance indicates a bad quality of will.

  **4. The Instinctive Rescue**
  A parent saves their drowning child instantly, without any thought of "ought" or "right." They would be baffled by the question.
  A. No worth; moral worth requires representation of the right reason.
  B. Full worth; they were moved by the child's need (the right-making feature).
  C. No worth; instinctive acts are non-agential.

  **5. The Redundant Reason**
  An agent lies to protect a friend (wrong act) but would have lied anyway even if they knew it was wrong, due to loyalty. (Variant: Agent does right act for wrong reason, but would have done it for right reason if wrong reason vanished).
  A. Worth depends on the actual motivating reason.
  B. Worth depends on the counterfactual robustness of the action.
  C. Worth is irrelevant; only the act matters.

  **6. The Idle Good Will**
  An agent acts from greed, but also possesses a genuine good will that was idle (would have acted if greed vanished).
  A. No worth; the idle motive is causally inert.
  B. Some worth; the good will is attributable to the agent.
  C. Full worth; the presence of good will suffices.

  **7. The Mistaken Conscientious Objector**
  An agent refuses a life-saving vaccine, sincerely believing morality requires purity, but is objectively wrong.
  A. No worth; the act is objectively wrong.
  B. High worth; the quality of will is excellent despite error.
  C. No worth; ignorance defeats attribution.

  **8. The Manipulated Saint**
  An agent loves everyone because they were brainwashed to do so. They act kindly.
  A. Full worth; the motive is love.
  B. No worth; the motive is not authentically theirs.
  C. Partial worth; manipulation reduces but doesn't eliminate agency.

  **9. The Mixed Motive**
  An agent acts from 50% duty and 50% sympathy.
  A. Worth is binary; either you have it or you don't.
  B. Worth is scalar; this is half as worthy as pure duty.
  C. Worth is binary; mixed motives destroy worth entirely.

  ***

  **Scoring Key & Positions**

  **Strict Motive-of-Duty (Mostly 1A, 3A, 4A):** Worth requires acting *because* it is duty.
  *Awkward Commitment:* The instinctive parent saving a child has no moral worth.

  **Broad Decent Motive (Mostly 1B, 2C, 3B):** Any morally decent motive (sympathy, love) suffices.
  *Awkward Commitment:* The shopkeeper acting for profit might accidentally qualify if profit aligns with duty.

  **Right-Making Consideration (Mostly 1A, 4B, 2C):** You must be moved by the feature that makes the act right (e.g., need), not necessarily "duty."
  *Awkward Commitment:* Agents who cannot conceptualize "reasons" (children/animals) might qualify for moral worth.

  **Counterfactual/Robustness (Mostly 5B, 6B):** Worth tracks what you would have done if incentives changed, not just actual causation.
  *Awkward Commitment:* An agent who acts rightly for terrible reasons gains worth if they *would* have acted rightly for good reasons.

  **Character/Virtue-Expression (Mostly 3B, 4B, 9A):** Worth expresses stable character traits, not isolated mental states.
  *Awkward Commitment:* A reformed sinner struggling against vice has less worth than a natural saint.

  **Quality of Will (Mistaken) (Mostly 7B, 8A):** Worth is internal to the agent's perspective; objective error doesn't defeat it.
  *Awkward Commitment:* A sincere terrorist acting on distorted moral beliefs possesses moral worth.

  **Scalar View (Mostly 2B, 9B):** Worth comes in degrees based on motive purity or strength.
  *Awkward Commitment:* There is no clear threshold for praise; moral assessment becomes infinitely granular.

  **Deflationary (Mostly 1C, 5C, 9A):** The notion of "moral worth" is a muddle; only rightness or goodness matters.
  *Awkward Commitment:* There is no meaningful distinction between the honest shopkeeper and the dutiful one.

  ***

  **Limitations & Empty Space**

  **Indistinguishable Positions:**
  This instrument cannot reliably separate **Broad Decent Motive** from **Right-Making Consideration**. In most cases, if you are moved by a decent motive (sympathy), you are moved by the right-making feature (suffering). To separate them, you need a case where the agent is moved by "morality" broadly but misses the specific right-making feature, or vice versa. My questions assume these overlap too heavily. Similarly, **Character/Virtue** and **Scalar** views often converge on Question 9; a virtue ethicist might accept degrees of virtue expression, mimicking the scalar view.

  **Empty Combinations:**
  1.  **The "Inert Internalist" (7B + 8B):** Claiming sincere mistaken belief grants worth (Internalism) but manipulated true belief denies it (Authenticity).
      *   *Status:* **Unattractive.** While logically possible, it implies that brainwashing is worse than sincere ignorance regarding worth, which few defend explicitly. It makes worth depend on the *history* of the motive rather than its current content or fit.
  2.  **The "Binary Scalar" (9A + 2B):** Claiming worth is all-or-nothing (Binary) but also that contaminated motives reduce worth (Scalar).
      *   *Status:* **Incoherent.** You cannot hold that worth is binary while simultaneously admitting cases of "partial" worth. This is a contradiction in terms regarding the structure of value.
  3.  **The "Causal Externalist" (6A + 5A):** Claiming idle good will grants no worth because it's inert, and robustness doesn't matter.
      *   *Status:* **Unexplored.** Most who care about actual causation (5A) usually care about the presence of the will (6B). Denying worth to the idle good will while insisting on actual causation makes worth incredibly fragile, dependent on neural firing orders rather than agency. Nobody defends this because it makes moral luck too dominant.
  4.  **The "Outcome Internalist" (1C + 7A):** Claiming the shopkeeper has full worth (Outcome/Alignment) but the mistaken objector has none (Objective Rightness).
      *   *Status:* **Unattractive.** This view prizes alignment with objective duty over the agent's perspective for the objector, but prizes alignment over motive for the shopkeeper. It lacks a unified principle (either focus on the mind or the world).

  **Final Note on Usage:**
  Do not let students simply tally scores. The value lies in the tensions. If a student scores high on **Quality of Will** but rejects the **Terrorist Commitment**, they are not Quality of Will theorists; they are likely **Right-Making** theorists who haven't realized it. Use the "Awkward Commitments" to force them off the fence. The goal isn't to label them, but to show them that their intuitions about the shopkeeper might contradict their intuitions about the drowning child. That is where the philosophy happens.
