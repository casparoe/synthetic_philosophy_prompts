      *   *Live vs. Logical:* Neural dependence and Phenomenal Isolation are live. Telepathy is a logical expectation but not a strict defeater (could be blocked by "instruments").
      *   *Internal Concessions:* What must the defender admit? They must admit the *explanatory gap* regarding the mechanism of illusion. They must concede that "One" doesn't mean "One integrated field" in the usual sense.
      *   *Absorption vs. Cost:* Can they absorb it? Yes, by calling it *maya*. Does it cost something? Yes, it costs predictive power and integration with physics.
      *   *The Insulation Question:* Is it unfalsifiable? Yes, largely. Is that a defect? Depends on whether you view it as a scientific theory or a soteriological/ontological stance. Schrödinger treats it as ontology.
