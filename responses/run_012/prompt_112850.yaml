      *   *Decision:* **The Inaccessibility of Co-present Experience.** If Subject A and Subject B are numerically identical, then what is present to A must be present to B. The fact that A's pain is not B's pain *in the moment* contradicts numerical identity more than brain damage does.

  9.  **Refining the "Insulation" Analysis:**
