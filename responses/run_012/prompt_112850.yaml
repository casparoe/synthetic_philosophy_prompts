      *(Self-Correction during drafting)*: I initially thought about putting "Neural Dependence" first. But the Monist can argue the brain is an image *in* consciousness. However, they cannot easily argue that the *subjectivity* itself is partitioned without admitting plurality. So Phenomenal Privacy is stronger. I will stick with that.

      *(Refining the "Cost")*: The cost isn't just "it's hard to believe." The cost is that it renders the physical world causally impotent regarding the *nature* of mind, which clashes with the overwhelming evidence of psychophysics. The defender must concede that psychophysics describes the *rules of the dream*, not the dreamer.

