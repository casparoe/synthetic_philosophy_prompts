answer: |-
  ### Brainstorming Fault Lines (Pre-Draft Notes)

  Before constructing the tree, we need to isolate the actual philosophical disagreements, rather than the textbook labels. The "Reductionist vs. Anti-Reductionist" label obscures at least four distinct axes of disagreement:

  1.  **The Skeptical Threshold:** Is testimony *ever* a standalone justification, or does it always require a prop (perception, memory, induction)?
  2.  **The Domain Scope:** Does the epistemic rule change depending on *what* is being said (e.g., physics vs. morality vs. pain reports)? Many students hold mixed views here without realizing it.
  3.  **The Evidential Burden:** Must the hearer possess *positive reasons* to trust (Reductionism), or is justification secured merely by the *absence of reasons to doubt* (Default views)?
  4.  **The Normative Source:** If no positive evidence is needed, *why*? Is testimony a unique basic faculty (Sui Generis), a general rational presumption (Entitlement), or a reliable process (Externalism)?

  The following tree forces the reader to commit to claims on these axes using concrete cases.

  ***

  ### The Testimony Epistemology Decision Tree

  **Node 1: The Oracle Case**
  *Imagine an unaccountable oracle (or a highly advanced chatbot) tells you "P." You have no prior information about its reliability, but no reason to think it's lying. Does this testimony **ever** justify believing P without further investigation?*
  *   **NO** → **Leaf 1: Outright Skeptic**
  *   **YES** → Go to Node 2.

  **Node 2: Domain Uniformity**
  *Does your "YES" apply equally to **empirical claims** ("The bridge is safe"), **moral claims** ("Lying is wrong"), and **phenomenal reports** ("I have a headache")?*
  *   **NO (It varies by topic)** → **Leaf 2: Local Reductionism (Domain-Specific)**
  *   **YES (Same rule for all)** → Go to Node 3.

  **Node 3: The Evidential Burden**
  *To be justified in believing the oracle, must you possess **positive evidence** that it is reliable, or is it enough that you simply **lack evidence** that it is unreliable?*
  *   **Positive Evidence Required** → **Leaf 3: Global Reductionism**
  *   **Absence of Defeaters Enough** → Go to Node 4.

  **Node 4: Hidden Defeaters**
  *Suppose the oracle is actually broken (or lying), but you have no way of knowing this. Are you still justified?*
  *   **NO (Objective reliability matters)** → **Leaf 4: Externalist Default**
  *   **YES (Your perspective is what matters)** → Go to Node 5.

  **Node 5: The Source of Permission**
  *If you need no positive evidence, why are you allowed to believe? Is testimony a **unique basic source** (like vision), or a **general rational presumption** (we presume truth by default)?*
  *   **Unique Basic Source** → **Leaf 5: Sui Generis Source**
  *   **General Rational Presumption** → **Leaf 6: Default-Trust / Entitlement**

  ***

  ### Notes on the Leaves

  1.  **Outright Skeptic:** Testimony is never a fundamental source of justification. Belief is only justified if reduced to perception, memory, or induction. (e.g., Humean Skepticism).
  2.  **Local Reductionism (Domain-Specific):** You accept testimony presumptively in some domains (e.g., empirical science) but demand positive evidence in others (e.g., morality). *Note: This captures the common inconsistency where students trust scientific hearsay but demand proof for moral claims.*
  3.  **Global Reductionism:** Testimony is justified only when supported by positive inductive reasons (e.g., "Testimony has been reliable in the past"). Applies uniformly across all domains.
  4.  **Externalist Default:** You are entitled to trust unless you have doubts, *but* if the source is objectively unreliable, you aren't justified even if you don't know it. (A reliabilist anti-reductionism).
  5.  **Sui Generis Source:** Testimony is a basic epistemic faculty on par with perception. It generates justification uniquely, not derived from general rationality. (e.g., McDowell).
  6.  **Default-Trust / Entitlement:** Rationality presumes truth by default. Trust is a rational entitlement grounded in the nature of communication, not a unique sensory faculty. (e.g., Burge, Reid).

  ***

  ### Flagged Combinations & Structural Limits

  *   **The "Moral Exception" Path (Node 2):** The tree groups all domain-variance into **Leaf 2**. In practice, most people who answer "NO" at Node 2 are *Moral Reductionists* (trusting empirical but not moral testimony). The reverse (trusting moral but not empirical testimony) is theoretically possible but practically unattractive; the tree does not distinguish them to save space.
  *   **Externalist Default vs. Sui Generis (Node 4 & 5):** The tree separates these, but some philosophers argue they are compatible (a Sui Generis faculty that must also be reliable). If a reader feels Node 4 and Node 5 both apply, they hold a **Reliabilist Sui Generis** view. The tree forces a choice based on whether *hidden* unreliability defeats justification.
  *   **Indistinguishable Leaves:** **Leaf 5 (Sui Generis)** and **Leaf 6 (Entitlement)** are often functionally identical in standard cases. They only come apart in edge cases involving the *source* of the norm (faculty vs. rational principle). If a reader cannot distinguish them, they hold a generic **Anti-Reductionist** view; the tree separates them only for metaphysical precision.
  *   **The Chatbot Constraint:** Node 1 uses the "Oracle/Chatbot" case to bypass the "Human Connection" debate. If a reader thinks testimony *requires* a human speaker, they should answer **NO** at Node 1 for chatbots but **YES** for humans. This view (**Interpersonal Anti-Reductionism**) is not a distinct leaf here; such readers should treat Node 1 as "YES" only for humans and proceed, noting their view is a subset of Leaves 4, 5, or 6.
