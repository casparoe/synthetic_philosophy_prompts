  In my set theory class the professor brushed off a question about Zorn's lemma with a shrug and something like: choice is obviously true, well-ordering is obviously false, and nobody can tell about Zorn's lemma. Then he said Zorn's lemma is just the axiom of choice in disguise, and moved on. I think there are several different claims mashed together in there and I honestly cant tell which one he meant, or which of them are even true. Can you pull the readings apart and give me a verdict on each -- things like: (a) they're literally the same statement; (b) each is provable from the other, so it's a theorem of ZF that they're equivalent; (c) any proof that uses Zorn silently presupposes choice, so a choice-skeptic can't use it either; (d) Zorn looks innocent (you can always keep extending, so why not go all the way) but it isn't; (e) the joke is really a confession that our intuitions about infinite sets are worthless. For each, say whether it's true, false, trivial, or a real result, and which ones would actually back up the don't-trust-your-gut moral he drew. Give it to me as a list I can take to office hours, not an essay.
