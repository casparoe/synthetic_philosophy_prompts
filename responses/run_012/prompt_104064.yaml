answer: |-
  There is no single, canonical noun (like "The Gettier Problem") that names this exact standoff across all of philosophy, but in the specific literature on laws of nature, this shape of disagreement is technically identified as a dispute over **Metaphysical Grounding** under conditions of **Empirical (and Modal) Equivalence**.

  When philosophers want to be precise about the *shape* you are describing—where the truth conditions of all statements match, but the "in virtue of" relation is reversed—they call it a **Dispute Over Ontological Priority**.

  However, the specific *accusation* that the anti-Humean side is merely relabeling without adding substance has a well-known name: **The Idle Wheel Objection** (or the **Inert Posit Objection**). This comes from Bas van Fraassen and is echoed by David Lewis and Helen Beebee. They argue that if "necessity" does not change the predictions, the counterfactuals, or the observations, it is a metaphysical wheel that turns nothing.

  Here is the breakdown of the edges of this standoff, whether it is real or verbal, and what the anti-Humean must prove to escape the charge of mere relabeling.

  ### 1. The Name and The Shape
  The debate is formally between **Humean Supervenience** (Side A) and **Nomic Primitivism** or **Nomic Realism** (Side B).

  *   **The Agreement:** Both sides agree on the "Humean Mosaic" (the total distribution of local qualitative facts throughout spacetime). They also agree on the truth values of standard counterfactuals (e.g., "If I dropped this cup, it would fall").
  *   **The Disagreement:** They disagree on the **Direction of Grounding**.
      *   **Humean:** The Law is a summary *grounded in* the Regularity. (Regularity $\rightarrow$ Law)
      *   **Primitivist:** The Regularity obtains *because of* the Law. (Law $\rightarrow$ Regularity)

  If you are looking for a term to describe the *standoff itself* where the empirical output is identical but the metaphysical story differs, the most precise contemporary term is **Metaphysical Underdetermination**. The physical facts underdetermine the metaphysical facts.

  ### 2. Is the Standoff Real or Verbal?
  This is the crux of your question. Whether this is a "real" dispute or a "verbal" one depends on your commitment to **Truthmaker Theory** and **Metaphysical Explanation**.

  **The Case for "Verbal" (Deflationism):**
  If you believe that the meaning of a concept is exhausted by its role in prediction and observation (a pragmatic or empiricist view), the dispute is verbal.
  *   **Argument:** If both sides agree that the cup *will* fall and *would* fall if dropped, what work is left for "necessity" to do?
  *   **Proponents:** Bas van Fraassen (Constructive Empiricism), David Lewis (in some moods), Helen Beebee.
  *   **Verdict:** On this view, the Anti-Humean is engaging in **Metaphysical Excess**. They are positing a "ghost in the machine" that looks like a law but acts like a regularity.

  **The Case for "Real" (Metaphysical Realism):**
  If you believe that science aims to describe not just *what* happens, but *why* it happens in a robust ontological sense, the dispute is real.
  *   **Argument:** The Humean view makes the uniformity of nature a **Cosmic Coincidence**. On the Humean view, it is a brute fact that the future resembles the past. On the Primitivist view, the future resembles the past *because* the law constrains it.
  *   **Proponents:** David Armstrong, Tim Maudlin, Nancy Cartwright.
  *   **Verdict:** On this view, the Humean is engaging in **Ontological Parsimony at the cost of Explanatory Power**. They save on entities but lose the ability to explain *why* the regularity holds.

  ### 3. What Would Make the Anti-Humean Side "Add Something"?
  For the Anti-Humean (Side B) to prove they aren't just relabeling the Humean summary, they must demonstrate that their "primitive modal something" has **explanatory consequences** that the Humean view cannot replicate, even if the *predictions* are the same.

  Here are the three specific edges where the Anti-Humean tries to show their view is substantive:

  #### A. The Truthmaker Argument
  *   **The Claim:** Counterfactual statements ("If I had struck the match, it would have lit") are true *now*. What makes them true?
  *   **Humean:** The truthmaker is the actual regularity in the world + our systematization of it.
  *   **Anti-Humean:** Actual regularities cannot ground counterfactuals about non-actual situations. Only a **Nomic Relation** (a law that exists independently of its instances) can serve as the truthmaker for a counterfactual.
  *   **The Edge:** If you accept that true statements require ontological truthmakers, the Anti-Humean is adding something real (the truthmaker). If you reject truthmaker maximalism, they are just relabeling.

  #### B. The Argument from Coincidence (Maudlin's Edge)
  *   **The Claim:** Tim Maudlin argues that Humeanism renders the temporal evolution of the universe inexplicable.
  *   **The Scenario:** Imagine the universe is a block of spacetime. The Humean says the laws are just the best summary of the patterns in the block.
  *   **The Problem:** This implies that what happens at $t_2$ is not *produced* by what happened at $t_1$ plus a law; rather, $t_1$ and $t_2$ just happen to match a pattern. Maudlin argues this denies the **productive nature of time**.
  *   **The Edge:** If you believe physical laws describe a **production mechanism** (things happen *because* prior things pushed them), the Anti-Humean view is real. If you believe time is just a coordinate in a static block, the Humean view suffices.

  #### C. The Induction Edge
  *   **The Claim:** Why should we trust induction?
  *   **Humean:** We shouldn't, strictly speaking. We just have a psychological habit (or a pragmatic bet) that the best system continues.
  *   **Anti-Humean:** We can trust induction because laws are **necessary relations** that constrain future instances. The law *forces* the next instance to comply.
  *   **The Edge:** If you require a *justification* for induction beyond pragmatism, the Anti-Humean posits a real constraint. If you accept induction as a brute pragmatic necessity, the Anti-Humean addition is idle.

  ### 4. Summary of the Terminology
  If you need to label this in a paper or discussion, use this hierarchy:

  1.  **The Broad Debate:** Humean Supervenience vs. Nomic Primitivism.
  2.  **The Structural Shape:** A Dispute Over Metaphysical Grounding (or Ontological Priority).
  3.  **The Condition:** Empirical and Modal Equivalence (they agree on observations and counterfactual truth-values).
  4.  **The Accusation:** The Idle Wheel Objection (claiming the modal element is epiphenomenal).
  5.  **The Defense:** The Truthmaker Argument or The Non-Coincidence Argument.

  ### 5. Final Verdict on the "Standoff"
  The standoff is **real** if and only if you accept that **metaphysical explanation** is a legitimate goal of inquiry distinct from **empirical prediction**.

  *   If science is only about "saving the phenomena" (predicting observations), the Anti-Humean is merely relabeling. The "necessity" is a **Projection** (projecting our expectation of order onto the world).
  *   If science is about "carving nature at its joints" (describing the ontology that generates phenomena), the Anti-Humean is identifying a real feature (the **Generative Mechanism**) that the Humean ignores.

  The "primitive modal something" is not a further *observable* difference; it is a further *ontological* commitment. The Humean calls this "spooky action at a conceptual distance." The Anti-Humean calls it "the difference between a coincidence and a constraint."

  **Recommendation:** If you want to refer to this specific dynamic without wading into the whole laws debate, call it a **"Grounding Dispute under Empirical Equivalence."** This marks it off from ordinary disputes where one side claims the other gets the predictions wrong. Here, the fight is entirely over what *makes* the predictions true.
