answer: |-
  # Q&A Prep Sheet: Joint Comp Neuro / Theory Seminar

  **Audience Profile:** 30 people. 25 Pragmatic Modellers (GLMs, decoding), 4 Dynamics (attractors, anti-rep), 1 Philosopher (normativity).
  **Goal:** Defend the claim that "computation" requires a functional criterion, not just a mapping.
  **Tone:** Collegial, precise, non-defensive. Do not sound like you are banning their tools.

  ---

  ### The Concession (Say this in your closing remarks)
  **"I am not a vitalist."**
  Before Q&A starts, explicitly state: *"I am not claiming there is a magical substance in the brain that makes it compute while a rock does not. I am not denying causality. I am asking about the description we use when the causal story is incomplete."*
  **Why:** The room suspects you think biology has special sauce. Disarm this immediately so they listen to the argument about *description* rather than *ontology*.

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The "Monday Morning" Objection (The Lab PI)
  **Voice:** *"Look, I run encoding models on V1 data. My model predicts spikes based on stimuli. If I call that 'computation,' my grant gets funded and my students get jobs. If I call it 'curve fitting,' I'm in trouble. You say the evidence doesn't settle if it's computation. But on Monday, I have to write a paper. What do I write?"*
  **Damage:** High. Makes your thesis practically irrelevant.
  **Reply (2 min):** "Write 'computation' if it helps you organize the hypothesis that there is a mechanism selecting for that information. But be aware that right now, you are validating the *model's* predictive power, not the brain's *computational nature*. My point isn't to ban the word, but to stop us from thinking that a good R-squared value proves the brain is a computer. It proves the model is good. Distinguishing those prevents us from stopping the search for the actual mechanism too early."
  **Soft Spot:** They don't care about the search for the mechanism; they care about the publication. You are asking them to be more careful than their career incentives allow.

  #### 2. The "Side-Door Representation" Objection (The Dynamics Person)
  **Voice:** *"You say we need a mechanism whose function is to carry information. But 'function' and 'information' are just representation by another name. I left representational talk behind because it's ungrounded. You're letting it back in through the side door and calling it 'function'. I don't see what you've gained."*
  **Damage:** High. Undermines your core criterion.
  **Reply (2 min):** "I see the worry. But 'representation' usually implies a homunculus reading the state. 'Function' here is purely causal-historical: a trait was selected because it correlated with X. I'm not saying the neuron 'means' anything. I'm saying the circuit was kept by evolution because it preserved a specific mapping. That fixes the mapping objectively, whereas pure dynamics leaves the mapping up to the observer. It's not about meaning; it's about which mapping is stable under evolutionary pressure."
  **Soft Spot:** This relies on teleosemantics, which is philosophically contentious. If they press on how "selection" fixes a specific computational description without human interpretation, you might wobble.

  #### 3. The "Operationalization" Objection (The Methods Person)
  **Voice:** *"Okay, let's say I accept your criterion. How do I test it? How do I measure 'function fixed by mechanism' in a dataset? If you can't give me a metric, you haven't given me a scientific constraint, you've given me a slogan."*
  **Damage:** High. Makes your criterion scientifically useless.
  **Reply (2 min):** "You're right, this isn't a metric yet. It's a constraint on interpretation. Currently, we assume the mapping (e.g., rate coding) and test the model. I'm suggesting we need independent evidence for *why* that mapping exists—lesion data, developmental constraints, evolutionary comparative data. It shifts the burden of proof from 'does this model fit?' to 'why is this the relevant state space?'"
  **Soft Spot:** You don't actually have the independent evidence for most systems. You are asking for data that doesn't exist yet.

  #### 4. The "Figure of Speech" Objection (The Senior Modeller)
  **Voice:** *"I think you're fighting a strawman. Nobody in this room thinks the brain is a digital laptop. We use 'computation' as shorthand for 'input-output transformation'. You're attacking a metaphysical claim nobody is making. We're being instrumentalist, and you're treating us like realists."*
  **Damage:** Medium. Dismisses your problem as semantic.
  **Reply (2 min):** "If it were just shorthand, we wouldn't write papers claiming to have 'found the algorithm' for decision making. We do make realist claims. When the shorthand leaks into the conclusions, we start thinking we've explained the mechanism because we've fit the function. I want to keep the instrumental utility without the ontological baggage."
  **Soft Spot:** They can honestly say, "I never claimed to find the algorithm," and you look like you're scolding them for sins they didn't commit.

  #### 5. The "Evolution Fixes It" Objection (The Evo-Neuro Person)
  **Voice:** *"You say the evidence doesn't settle it. But evolution settles it. The brain was selected to process visual information. That fixes the function. So the brain computes, trivially, because it's an organ shaped by information processing tasks. Why complicate this?"*
  **Damage:** Medium. Offers a solution that might be too easy.
  **Reply (2 min):** "Evolution selects for behavior, not necessarily for a specific computational description. A system can achieve a behavioral goal via many computational routes. Knowing it was selected for 'catching prey' doesn't tell us if it computes 'trajectory' or 'optical flow'. The function is fixed at the behavioral level, but the computational level remains underdetermined."
  **Soft Spot:** If they argue that behavioral function *is* the computation, you have to defend the distinction between input-output behavior and internal processing again.

  #### 6. The "Pancomputationalism" Objection (The Philosopher)
  **Voice:** *"You argue any physical system can be mapped to any computation. But surely some mappings are 'natural' and others are 'gerrymandered'. Why not just say the brain computes because the natural mapping is obvious, without invoking function?"*
  **Damage:** Low. You anticipated this.
  **Reply (2 min):** "'Natural' is subjective. To a physicist, the natural mapping is thermodynamic. To a neuroscientist, it's spikes. 'Function' is my proposal for what makes one mapping objective rather than subjective. Without it, 'natural' just means 'the mapping I prefer'."
  **Soft Spot:** You are assuming function is objective. Some argue function is also observer-relative.

  #### 7. The "Rock vs. Brain" Objection (The Skeptic)
  **Voice:** *"If I kick a rock, it moves. If I shine light on a retina, it fires. Both are physical systems. You say the retina computes because of function. But isn't the rock's movement also determined by physical law? Where is the line?"*
  **Damage:** Low. Easy to distinguish.
  **Reply (2 min):** "The rock's movement is determined by immediate physical forces. The retina's response is determined by a structure that exists *because* it correlates with light. The rock doesn't have a history of selection for moving when kicked. The brain has a history of selection for firing when stimulated. That history is the difference."
  **Soft Spot:** Requires accepting etiological accounts of function, which not everyone buys.

  #### 8. The "Consistency" Objection (The Grad Student)
  **Voice:** *"You build encoding models. You use the word 'information'. Are you saying your own work is invalid? Or that you're lying?"*
  **Damage:** Low. Ad hominem-lite.
  **Reply (2 min):** "My work is valid as prediction. I am happy to say 'this model predicts spikes.' I am hesitant to say 'the brain calculates this.' I'm trying to be honest about what my model achieves. It achieves prediction, not necessarily mechanistic explanation."
  **Soft Spot:** Makes you sound like you're demoting your own work, which might confuse students looking for a career path.

  ---

  ### Critical Analysis

  **Which objection has teeth?**
  The **Dynamics Person ("Side-Door Representation")** has the most teeth.
  *   **Why:** The Modeller's objection ("It's just a figure of speech") is something you can afford to be gracious about. You can agree ("Yes, often it is") and pivot to ("But sometimes it isn't, and that's where we get confused"). It doesn't break your thesis.
  *   **The Dynamics Objection:** This attacks the *mechanism* of your solution. If "information-carrying function" is just representation in disguise, and representation is what the dynamics people reject as unscientific, then you haven't solved the problem; you've just changed the vocabulary. If you can't defend "function" as non-representational and objective, your criterion collapses into the very thing you're trying to critique.

  **The Reply That Must Land:**
  The definition of **"Function" without Teleology**.
  When the Dynamics person or the Philosopher asks, *"What grounds the function if not a designer?"* you must land the **Etiological/Causal Role** distinction clearly.
  *   *The Line:* "Function isn't a ghost. It's a causal history. A heart pumps blood because ancestors that pumped blood survived. That is a physical fact about the lineage, not a metaphor."
  *   *Why:* If this fails, you sound like a vitalist (see Concession above). If this lands, you ground "computation" in biology, not magic.

  **The Question You Hope Nobody Asks:**
  *"If the evidence doesn't settle whether brains compute, and you build computational models, are you contributing to the confusion you're criticizing?"*
  *   **Why it's dangerous:** It forces you to choose between your career (building models) and your thesis (models don't prove computation).
  *   **Preparation:** If asked, lean hard on the "Prediction vs. Explanation" distinction. "I build maps. A map is not the territory. I am building better maps, but I am warning us not to confuse the map with the terrain."
