  *   Without (3), the 5,000 moderate pains *might* outweigh the 1 agony if the moderate pains are numerous enough or the agony is short enough.
  *   You lose the "without hesitation" certainty in (6).
  *   You lose the distinctive "Lexical" character of your view.

