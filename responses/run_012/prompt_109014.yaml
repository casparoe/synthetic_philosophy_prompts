answer: |-
  At the Institute for Final Axioms, a consultant pitched a "Gap-Free Arithmetic Package" to a nervous dean.

  "We start with Peano Arithmetic," the consultant explained. "Naturally, it's incomplete. But we identify the Gödel sentence and adopt it as a new axiom."

  "And then?" asked the dean. "Is it complete?"

  "Then we have a stronger system. But since the new system remains effectively axiomatized, Gödel's First Theorem applies again. It generates its own undecidable sentence. We adopt that one too."

  "So you keep adding axioms forever?"

  "Precisely! Every time you close a gap, the requirement of recursive axiomatization ensures a new undecidable sentence emerges. You never reach completeness, but you never stop buying patches."

  The dean frowned. "Why not just switch to True Arithmetic? It's complete."

  "Ah," said the consultant, "but True Arithmetic isn't recursively axiomatizable. Our package keeps the rules computable while guaranteeing the incompleteness persists."

  "So you're selling eternal incompleteness?"

  "We're selling eternal consultancy," the consultant corrected. "Gödel proved you can't finish the job. We prove you can't stop paying for it. It's the only limitative result with a recurring revenue model."

  The dean signed. "Finally," he said, "a theorem with budgetary implications."
