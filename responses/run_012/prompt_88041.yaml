answer: |-
  This is not a stupid question. In fact, you have independently rediscovered a tension that has bothered moral philosophers, theologians, and biographers for two thousand years. You are describing the gap between **admiration** and **emulation**.

  Since you asked for precision rather than just labels, I will give you the closest existing terms, explain where they fail to capture your specific insight, and then define the mechanism properly using the framework you've already built.

  ### 1. The Property: Exemplarity vs. Emulability

  The philosophical term for a life that serves as a model is **Exemplarity**. An "exemplar" is a person whose life sets a standard.

  However, you have identified a bug in the standard definition. In philosophy (e.g., Linda Zagzebski's *Exemplarist Moral Theory*), exemplarity often conflates two things:
  1.  **Normative Value:** The person is good (the "Advert").
  2.  **Practical Utility:** The person shows *how* to be good (the "Manual").

  Your "wall" is the realization that high Exemplarity often correlates with low **Emulability**.

  **Where the term misses:**
  "Exemplarity" implies the person *is* the standard. It doesn't account for the *accessibility of the source code*. A saint who is holy from birth has high Exemplarity (they define holiness) but zero Emulability (there is no function call you can make to replicate their state).

  **The Definition you need:**
  Let's call this property **Operational Virtue**.
  *   **What it is:** A life narrative that exposes the *mechanism* of moral decision-making rather than just the *output*. It treats virtue not as a static attribute (a boolean `is_holy = true`), but as a state machine with transitions, error handling, and latency.
  *   **What it isn't:** It isn't just "flaws." A biography can be full of flaws (a drunk genius) and still lack Operational Virtue if the flaws are presented as quirks rather than obstacles overcome by specific practices.
  *   **Locus:** This property belongs to the **Text**, not the Person. A real person might have struggled immensely, but if the biographer smooths over the struggle to create a "Saint," the Operational Virtue is lost. The text must expose the *cost* of the virtue.

  ### 2. The Trick: Metanoia and Bildung

  You asked for the name of the "Bad $\rightarrow$ Good" conversion arc. There are two terms, one theological and one secular, that cover this.

  **A. Metanoia (Theological)**
  This is the Greek word used in the New Testament, often translated as "repentance," but literally meaning "change of mind" or "transformation."
  *   **Why it fits:** It describes the structural break in the timeline. Augustine's *Confessions* is the archetype. The "early self" is the control group; the "later self" is the experimental result.
  *   **Where it misses:** *Metanoia* implies a singular, often divine, intervention. It can still suffer from the "Grace" problem you noted (God fixed him, not his own effort).

  **B. Bildung (Secular)**
  A German concept from the Enlightenment/Romantic era. It refers to "self-formation" or "cultivation." A *Bildungsroman* is a novel of education/formation.
  *   **Why it fits:** It implies the person *built* themselves through experience, error, and study. It is inherently procedural.
  *   **Where it misses:** It can drift into "finding oneself" rather than "improving oneself."

  **The Specific Rhetorical Trick:**
  If you want the name of the *technique* Plutarch and Augustine use, it is **The Signa Animae (Signs of the Soul)**.
  Plutarch explicitly states he is not writing history (events) but lives (character). He argues that character is revealed not in great battles (which can be luck), but in small choices (which are will).
  *   **The Trick:** Isolate a moment of *friction*. A perfect life has no friction. A learnable life must document the resistance the person felt against doing the right thing, and the specific mental move they used to overcome it.

  ### 3. Defining the Thing Properly

  Since the existing terms are slightly off, let's define the architecture of what you are looking for. You are looking for **Transferable Agency**.

  A biography has Transferable Agency when it satisfies three conditions:

  1.  **Visibility of Cost:** The text must show that the virtuous action was *expensive* for the actor. If being honest was easy for them, you can't learn how to be honest when it's hard for you. The "wobble" proves the cost.
  2.  **Replicability of Mechanism:** The transition from Bad to Good must be attributed to *practices* (prayer, coding, fasting, debugging) rather than *status* (grace, funding, genius).
  3.  **Contextual Decoupling:** The narrative must separate the *moral choice* from the *historical luck*.

  **The "Advert vs. Manual" Distinction:**
  *   **The Advert (Hagiography):** Focuses on the *Result*. "He built the company." "He was a saint." This triggers **Awe**. Awe paralyzes action because it places the subject in a different category of being than the reader.
  *   **The Manual (Confession/Memoir):** Focuses on the *Delta*. "Here is where I was wrong, here is the tool I used to correct it." This triggers **Recognition**. Recognition enables action because it places the subject in the same category of being as the reader.

  ### 4. The Awkward Cases

  You asked for the edge cases. Here is how they map:

  **Case 1: Admirable but Not Learnable (The Saint / The Genius)**
  *   **Example:** A child saint who never sins; Steve Jobs (in some tellings) where his vision is treated as magic.
  *   **Problem:** **The Black Box Problem.** The input/output is visible, but the internal logic is obscured by "Grace" or "Vision."
  *   **Philosophical Term:** **Moral Luck.** If their virtue is due to their nature (they were born calm) rather than their will (they practiced calmness), you cannot copy it.
  *   **Verdict:** Useful for inspiration, useless for implementation.

  **Case 2: Learnable but Not Admirable (The Scoundrel / The Hustler)**
  *   **Example:** A founder who admits to lying to investors, crushing competitors, and neglecting family, but succeeded.
  *   **Problem:** **The Alignment Problem.** The mechanism is clear (lie, hustle, sleep less), but the end state is not one you want to instantiate.
  *   **Philosophical Term:** **Instrumental Rationality.** They are efficient at achieving goals, but the goals (or the side effects) are morally misaligned.
  *   **Verdict:** High Transferable Agency, low Normative Value.

  **Case 3: Learnable and Admirable (The Penitent)**
  *   **Example:** Augustine, Mandela (in *Long Walk to Freedom*), or a founder who details a specific failure and the *system* they built to prevent recurrence.
  *   **Sweet Spot:** This requires **Vulnerability**. The author must risk their own status to show the flaw.
  *   **Verdict:** This is the only category that yields **Phronesis** (Practical Wisdom).

  ### 5. Person, Text, or Reader?

  You asked where the property belongs.

  It belongs to the **Text**, specifically the **Narrative Distance**.

  *   **The Person:** Real people are messy. They rarely understand their own motivations fully.
  *   **The Reader:** You bring the desire to learn.
  *   **The Text:** The biographer makes the choice.

  When a biographer writes a "Saint's Life," they are intentionally removing the *causal links* between struggle and virtue to attribute the virtue to God. They are obfuscating the code to protect the brand.
  When Plutarch writes a "Life," he is intentionally selecting anecdotes that reveal *choice*.

  **The Backend Analogy:**
  *   **Hagiography** is a compiled binary. You can run it (admire it), but you can't read the source.
  *   **Warts-and-all** is a raw log file. It has all the data, but no structure, comments, or documentation. It's too noisy.
  *   **The Conversion Arc** is a well-documented Git repository. You can see the commits (actions), the commit messages (intentions), and the revert/fix commits (repentance/correction).

  ### Summary

  1.  **The Property:** **Operational Virtue** (or Transferable Agency). It is the degree to which a narrative exposes the *mechanism* of improvement rather than just the *state* of success.
  2.  **The Trick:** **Metanoia** (religious) or **Bildung** (secular), executed via **Signa Animae** (focusing on small choices that reveal character friction).
  3.  **The Locus:** It is a property of the **Text's narrative construction**, specifically its willingness to document *friction* and *cost*.
  4.  **The Warning:** If the text attributes success to **Nature** (born holy) or **Luck** (right place/time), Emulability drops to zero. If it attributes success to **Will** + **Practice**, Emulability rises.

  You are not being lazy. You are encountering a **Documentation Failure**. Most biographies are marketing sites, not API docs. You are looking for the latter. Keep reading the "Penitents" (Augustine, Darwin, Feynman, etc.) and skip the "Saints."
