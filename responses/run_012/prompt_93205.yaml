answer: |-
  **Exam Question**

  **Case:** Suppose we possess a complete and accurate specification of one particular human mind at a moment: a finite table of states and transitions which, if executed, would reproduce exactly that person's mental life. We print it as a book, in three versions. (i) **Shelf:** a static printed volume; no one ever opens it. (ii) **Clerk:** the same volume, together with a person who, when prompted, looks up the current entry and writes out the next one, so that the transitions are executed slowly, by hand. (iii) **Clockwork:** the same volume, bound so that each page's printed instruction trips a mechanism that turns to the page it specifies, so that once wound the book steps through the entire sequence on its own, at a page every ten seconds, with no reader and no observer.

  **Question:**
  On a computationalist view of mind, which, if any, of (i)-(iii) is conscious? Your essay must address: (a) what the simplest "isomorphism" account of implementation says about these cases and why that verdict is embarrassing; (b) what a more demanding account requiring causal or counterfactual structure does with each version; (c) why one cannot simply declare the book unconscious by fiat without risking the exclusion of the brain; and (d) whether this case constitutes a reductio of computationalism or merely a reason to reject a specific theory of implementation. (Approx. 800 words; 25 marks)

  ***

  **Model Answer**

  Computationalism asserts that mental states are computational states. However, computation is substrate-neutral only if we possess a robust theory of implementation: an account of what makes a physical system realize a formal computation. The Mind-Book case tests the boundaries of this theory. To determine which version is conscious, we must distinguish between merely representing a computation and physically executing it.

  First, consider the simplest account: structural isomorphism. This view holds that if a physical system's states can be mapped one-to-one onto the states of a formal computation, the system implements that computation. On this view, the Shelf book (i) is conscious. Its ink patterns statically encode the state-transition table; one can map paper configurations to mental states without difficulty. This verdict is deeply embarrassing. As Putnam and Searle have argued, such mapping is trivial; almost any object can be interpreted as implementing any computation given a sufficiently gerrymandered mapping. If static isomorphism suffices, consciousness becomes ubiquitous, found in rocks, walls, and unread books. This drains the concept of explanatory power. A viable theory of mind must exclude the Shelf, implying that isomorphism alone is insufficient for implementation.

  To exclude the Shelf, we require a demanding account involving causal or counterfactual structure. A system implements a computation only if its physical states causally sustain the transition sequence. On this view, the Shelf fails; its pages do not cause one another to turn. The Clerk (ii) succeeds. The human agent physically reads and writes, causing the state transitions. The Clockwork (iii) also succeeds. The mechanical linkage ensures page *N* trips the mechanism to turn to page *N+1*. Both possess the requisite causal topology where the current state determines the next. Thus, a causal implementation theory renders (i) unconscious but grants potential consciousness to (ii) and (iii). The Clockwork is particularly instructive: it lacks a semantic understanding agent, yet it physically enforces the counterfactual dependencies essential to computation (i.e., if the input were different, the mechanism would turn to a different page).

  However, one cannot simply declare the book unconscious by fiat. Any rule excluding the Book must still admit the Brain. Neurons are physical systems obeying laws; they do not "understand" their firing any more than the Clockwork gears "understand" their turning. If we exclude the Clockwork because it lacks biological tissue or semantic understanding, we risk excluding the brain on similar grounds. The distinction must rest on causal organization, not substrate. If the Clockwork preserves the counterfactual dependencies of the mind, it shares the brain's relevant structural properties. To deny this is to sneak in dualism or biological chauvinism. We must accept that if the causal structure is preserved, the substrate is irrelevant. The intuition that a book cannot be conscious stems from conflating the static representation of a program with the dynamic execution of it. Once execution is secured via causal mechanics, the objection loses force.

  Therefore, this case is not a reductio of computationalism itself, but a reductio of naive implementation theory. Computationalism survives if we reject the isomorphism account in favor of a causal/counterfactual account. The worry that the Clerk or Clockwork lacks "true" understanding mistakes the vehicle for the computation. If the causal structure is preserved, the substrate is irrelevant. The intuition that a book cannot be conscious stems from conflating the static representation of a program with the dynamic execution of it. Once execution is secured via causal mechanics, the objection loses force. We must accept that consciousness is a functional property realized by causal dynamics, whether neural or mechanical. The Clockwork case forces us to refine our definition of "realization" without abandoning the core computationalist insight.

  Verdict: The case refutes naive isomorphism but saves computationalism by requiring causal implementation.

  ***

  **Marking Scheme**

  **Total: 25 Marks**

  1.  **Analysis of Isomorphism (5 marks):** Correctly identifies that a simple mapping account makes the Shelf (i) conscious and explains why this leads to an embarrassing ubiquity/panpsychism (triviality of mapping).
      *   *Typical Miss:* Students state the Shelf is unconscious under isomorphism without explaining *why* the theory implies it is conscious, or fail to mention the ubiquity problem.
  2.  **Causal/Counterfactual Verdicts (5 marks):** Correctly applies a causal account to exclude the Shelf but include the Clerk (ii) and Clockwork (iii), citing physical causation of transitions.
      *   *Typical Miss:* Students exclude the Clockwork because it lacks a "human" agent, missing the point that mechanical linkage suffices for causation.
  3.  **The Brain Constraint (5 marks):** Explains that excluding the book requires a principle that still admits the brain (neurons are also non-understanding physical causes), avoiding biological chauvinism.
      *   *Typical Miss:* Students argue the brain is conscious because it is biological, failing to see this begs the question against computationalism.
  4.  **Philosophical Stance (5 marks):** Defends a position on whether this refutes computationalism or implementation theory (must argue for refining implementation theory to save computationalism).
      *   *Typical Miss:* Students conclude computationalism is false because the Clockwork intuition is strong, rather than diagnosing the intuition as a failure of implementation theory.
  5.  **Coherence & Format (5 marks):** Essay flows logically rather than listing points, and includes the required "Verdict:" line in the correct format.
      *   *Typical Miss:* Omitting the final verdict line or writing a disjointed list of answers to (a)-(d).

  **First-Class vs. Competent:**
  A competent answer hits all five points technically but may treat them as separate checklist items. A first-class answer integrates the points into a unified argument, specifically highlighting the nuance that the Clockwork's mechanical linkage satisfies counterfactual support just as neurons do, and explicitly frames the "embarrassment" of isomorphism as a theoretical cost rather than just a counter-intuitive result.
