prompt: |-
  Ok, slightly odd favour to ask, but I need a second opinion before I embarass myself in seminar.

  I'm a third-year PhD student in political theory, working on the epistemic side of deliberative democracy, so I end up reading a lot of Dewey for the "democracy as inquiry" angle even though he's not really my guy. A friend of mine in philosophy sent round the discussion notes they wrote for a reading group on Dewey last week. They're smart, they've read way more of the primary texts than I have, and they're not a Dewey person, which is sort of the problem. Some of it rings true and some of it makes me want to argue, and at this point I've read enough secondary stuff that I can't tell if I'm being precious or if something is actually off.

  Here's their summary, as close as I can remember it:

  Dewey's move is to take the experimental method out of the lab and generalize it to everything, politics included. Inquiry for him is just problem-solving: you find yourself in a confused situation, you form a hypothesis, you act on it, you check the consequences, you revise. So democracy, on his account, is just the political version of that method — it's the best mechanism we have for aggregating information and testing policies, and he sees it as continuous with science (basically Popper's open society, a couple of decades early). The state should be a kind of laboratory. His reply to Lippmann is that the public isn't incompetent, it's that we haven't run the experiments properly yet — and once social inquiry is up and running, ordinary citizens should mostly defer to the people running the experiments, the same way you defer to an engineer about a bridge. He's also a pure instrumentalist about democracy: he doesn't think democracy is good in itself, only that it produces better outcomes, and he expects inquiry to converge on the right policies, which is why he treats persistent political disagreement as a sign that the experiment isn't finished.

  Is that fair? Where would someone who actually knows Dewey push back, and which bits are just the kind of compression any good popularizer would make versus genuine misreadings?

  Can you lay it out in four parts, in this order:

  - Short answer — 2-3 sentences on whether the summary is fair overall.
  - What it gets right — about 150 words.
  - What it gets wrong — the bulk of it, maybe 500-700 words, going through the summary claim by claim, saying for each whether a Dewey person would accept it, wince at it, or call it a misreading, and why.
  - What still stands — about 150 words on which of my friend's conclusions I can keep once the errors are fixed.
