      *   *Why:* It forces the question: How does the planner know the *value* of steel in each use without a price?
      *   *Modification:* To make the "Discovery" vs. "Computational" pivot work, the example needs *change*. A sudden shift in demand or supply.
      *   *Final Decision on Example:* **Allocating a sudden shortage of Microchips between Car Manufacturers and Appliance Manufacturers.** It's modern, relatable, and involves complex supply chains.
      *   *Wait, keep it abstract enough to avoid technical quibbles.* Let's stick to the classic **Tin** logic but renamed. **A sudden shortage of Copper.** Uses: **Electrical Wiring** vs. **Plumbing**.
      *   *Reasoning:* It isolates the signal function. If copper becomes scarce, users need to economize without knowing *why*.

  4.  **Structure the Session (90 Minutes):**
      *   0-15: Setup & The Planning Problem (The Example).
      *   15-30: The Planner's Dilemma (Trying to solve it centrally).
      *   30-45: The Market Solution (Prices emerge).
      *   45-60: The Lange Reply (Trial and Error).
      *   60-75: The Pivot (Discovery vs. Computation).
      *   75-90: Closing & Omissions.

  5.  **Drafting the Plan - Step-by-Step:**

      *   **Opening Question:** Needs to force them to admit they need information they don't have. "You are the planner. You have 100 units of Copper. Two industries want it. How do you decide?"
