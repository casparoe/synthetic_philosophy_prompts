answer: |-
  ### 1. The Carrying Example
  **Your inclination:** Single scarce input, two competing uses.
  **My judgment:** Accept the structure, but reject the static framing. A static allocation problem is a linear programming exercise; it invites the "computers settle it" objection. To force the knowledge problem, the example must involve **unanticipated change**.

  **The Example:** **Steel.**
  **The Uses:** **Railway Tracks** vs. **Ship Hulls.**
  **The Constraint:** 1,000 tons available.
  **The Shock:** Halfway through the session, introduce a sudden, localized disruption (e.g., a mine collapse reduces supply to 800 tons; or a new trade route opens increasing demand for Ships).

  **Why this works:**
  *   **Contains:** Technical substitutability (steel is steel), competing final demands (transport vs. trade), and a common unit of account (tons).
  *   **Lacks:** Property rights, money, profit motives, and political authority. You must explicitly bracket these. If students introduce them, park them on a "Later" board.
  *   **Reasoning:** Political theorists often conflate *authority* (who decides) with *knowledge* (what is decided). By stripping away property and money, you force them to confront the epistemic requirement of coordination before they can retreat to normative concerns about power or incentives.

  ### 2. The Sequence and Dependencies
  **Total Time:** 90 Minutes.

  **Phase 1: The Static Allocation (0–20 mins)**
  *   **Opening Question:** "You are the Central Board. You have 1,000 tons of steel. Railway managers request 600; Shipyard managers request 600. You cannot satisfy both. What specific information do you need to allocate the steel efficiently?"
  *   **Dependency:** Students must admit that "need" is insufficient. They must identify a common denominator for *value* (e.g., "how much output each ton produces").
  *   **Move:** Write their required data points on the board.
  *   **Trap:** They will suggest "ask the managers how valuable it is."
  *   **Interception:** "Assume perfect honesty. Does the manager know the value of steel in the *other* use?" (Answer: No).

  **Phase 2: The Dynamic Shock (20–40 mins)**
  *   **Move:** Introduce the shock (Supply drops to 800 tons).
  *   **Question:** "The Board's previous plan is now impossible. How does the Board know *which* use to cut, and by *how much*?"
  *   **Dependency:** Students must realize the Board needs to know the *marginal* value of the lost 200 tons in both sectors.
  *   **Move:** Elicit the idea of a "price" or "shadow price" to ration the shortage.
  *   **Trap:** "Just raise the cost until demand matches supply."
  *   **Interception:** "Who sets the new cost? And how do they know the *correct* new cost without already knowing the answer?"

  **Phase 3: The Lange Solution (40–60 mins)**
  *   **Move:** Introduce the mechanism (without the name): "Suppose the Board sets a price. Managers treat it as fixed and demand steel until marginal product equals price. If demand exceeds supply, Board raises price. If supply exceeds demand, Board lowers price. Repeat."
  *   **Dependency:** Students must accept this looks like a market simulation.
  *   **Question:** "Does this solve the information problem?"
  *   **Expected Answer:** "Yes, it finds the equilibrium."

  **Phase 4: The Pivot (60–75 mins)**
  *   **Placement:** Immediately after they agree Lange's trial-and-error finds the equilibrium.
  *   **The Turn:** Do not speak. Write two columns on the board: **Computation** vs. **Discovery**.
  *   **The Prompt:** "In your Lange model, a shortage occurs. The Board raises the price. Where did the Board get the information that the price *needed* to rise by 10% rather than 5%?"
  *   **What You Must Not Say:** Do not mention Hayek. Do not mention "tacit knowledge." Do not mention "entrepreneurship."
  *   **The Goal:** Force a student to articulate that to adjust the price correctly, the Board must already know the scarcity intensity. If they know the scarcity intensity, they didn't need the trial-and-error. If they don't know it, the trial-and-error creates waste (the "error" part) that real actors must absorb.
  *   **Visible Difference:** The Computational reading sees price as a *solution* to an equation (Board calculates). The Discovery reading sees price as a *signal* generated by the actors (Board observes).
  *   **Success Condition:** A student says, "The Board is pretending to be the market, but it's only reacting to shortages that already happened. It's learning too late."

  **Phase 5: Closing (75–90 mins)**
  *   **Closing Question:** "If the Central Board can simulate the price correctly after a shock, what specific piece of information did the price itself convey that the Board did not already possess?"
      *   *Grasping the problem:* "The price isn't just the number; it's the decentralized decision to change behavior *before* the Board knows there's a problem."
      *   *Memorizing the slogan:* "Prices tell us what is scarce." (Push back: "The Board knows it's scarce. What else?")
  *   **Declared Omissions:** Explicitly state: "We have bracketed **incentives** (will the managers lie?), **power** (who controls the Board?), and **justice** (is steel for ships better than trains?). We did this not because they don't matter, but because if the knowledge problem holds, incentives and power are secondary. You cannot incentivize what you cannot measure."

  ### 3. Misconceptions and Interceptions
  **Order of Surface:**

  1.  **"This is about incentives/corruption."**
      *   **When:** Phase 1 (Opening Question).
      *   **Interception:** "I am granting you a benevolent, omniscient dictator regarding *will*. They want to maximize social welfare. They are not corrupt. Can they do it?"
      *   **Reasoning:** Political theorists default to public choice. You must isolate epistemology from motivation.

  2.  **"Computational difficulty, so computers settle it."**
      *   **When:** Phase 2 (Dynamic Shock).
      *   **Interception:** "Computers solve equations given variables. Where do the variables come from? Who tells the computer the marginal value of a ship hull today?"
      *   **Reasoning:** This conflates *processing* information with *generating* it.

  3.  **"Lange won because he accepted prices."**
      *   **When:** Phase 3 (The Lange Solution).
      *   **Interception:** "He accepted the *word* 'price'. Did he accept the *mechanism* of price formation? Who bears the risk of the price being wrong?"
      *   **Reasoning:** This is the most sophisticated error. It conflates parametric pricing with market discovery.

  ### 4. The Pivot Mechanics
  **Location:** Minute 65.
  **What makes it land:** The silence. After asking "How does the Board know the price needs to rise by 10%?", wait. Let the awkwardness accumulate. The historians will want to cite Hayek; stop them. The theorists will want to cite authority; stop them.
  **The Trap:** If you explain the difference between computation and discovery, you revert to lecture. The student must articulate that the *error* in Lange's model implies a cost of learning that the market distributes differently.
  **Key Phrase to Elicit:** "The Board is learning from mistakes that real people already paid for."

  ### 5. Final Omissions and Core
  **Leave Out:** The Mises *impossibility* claim vs. Hayek *empirical* claim. At this level, blending them is pedagogically necessary to isolate the knowledge problem from the strict economic calculation argument. Acknowledge this blending explicitly in the closing.

  **Core:** The socialist calculation debate demonstrates that economic prices are not merely accounting tools for allocation, but the only mechanism for generating the information required to allocate.
