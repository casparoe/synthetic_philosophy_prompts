answer: |-
  Your metaphor is sound. Creativity is navigation, not genesis. You are mapping a territory that already exists. Here is the procedure to run on your kitchen table.

  **The Procedure**

  1.  **Sing It Straight:** Perform the song simply. Identify the moment you feel emotion or where the audience hums. Mark this the **Core**.
  2.  **Inventory Knobs:** List parameters: Tempo, Harmony, Rhythm, Texture (who sings what), Dynamics, Form.
  3.  **The Weld Test:** Mentally remove or alter each knob. If the song loses its identity or the Core vanishes, that knob is welded shut.
  4.  **Select First Knob:** Choose the adjustable knob furthest from the Core.
  5.  **Turn It:** Make a single change.
  6.  **Variation vs. Decoration:** Ask: Does this change the *meaning* or just the *color*? If only color, it is decoration. Proceed only if meaning shifts appropriately.
  7.  **Dissolution Check:** Does the song feel like a different song? If yes, you broke a welded knob. Revert.
  8.  **New Knob:** Only add a new parameter (e.g., countermelody) if existing knobs cannot achieve the desired shift.
  9.  **Learnability Test:** **[JUDGMENT]** Can a non-reader grasp this in 20 minutes? If no, simplify.
  10. **Stopping Rule:** Stop when a new change requires undoing a previous one to maintain coherence.

  **Running the Procedure**

  **Song 1: The Sad Ballad**
  *   **Core:** The melody contour and the 3/4 lilt. The audience hums this; it is their anchor.
  *   **Welded Knobs:** Melody notes, basic harmonic resolution (V-I), 3/4 time signature. Turning these makes it a different song.
  *   **First Knob to Turn:** Texture.
  *   **Why:** The melody is sacred, but the voicing is not. Start verses in unison (intimate), bloom to four-part harmony on the chorus (communal grief).
  *   **Limit:** Do not reharmonize. You might want to add jazz extensions to show skill. The procedure says don't. Complex chords will obscure the hummable line and frustrate singers in one rehearsal.
  *   **[JUDGMENT]:** Step 6. Only you know if a minor chord substitution deepens the sadness or just sounds clever.

  **Song 2: The Work Song**
  *   **Core:** The rhythmic drive and the call-and-response energy.
  *   **Welded Knobs:** The rhythmic pulse, the lyrical hook in the chorus.
  *   **First Knob to Turn:** Harmony (specifically, simplify it).
  *   **Why:** The tenors are failing. A failed note kills energy faster than a simple one.
  *   **The Unliked Answer:** You will want to add complexity to keep it interesting. The procedure demands you subtract. Simplify the tenor line to root notes or thirds. It feels like "dumbing down," but if they can't sing it, the arrangement is zero.
  *   **New Knob:** Add a soloist for the calls to relieve the chorus burden and add dynamic contrast.
  *   **[JUDGMENT]:** Step 9. The director will overrule if the tenors look panicked. You must decide the threshold of "barely hold."

  **What This Procedure Cannot Do**

  This checklist cannot measure *truth*. It can tell you if a knob is welded, but not if turning it makes the song *better*. It misfires on novelty. You will be tempted to add a key change or a rhythmic syncopation because it feels like work. That is often just decoration (Step 6). Creativity is sometimes leaving the knob alone because the song is already perfect there.

  The procedure cannot predict the room's energy. You might write a technically perfect arrangement that lands flat because the audience had a bad week. It also cannot account for the director's hidden constraints (e.g., she knows the tenor section is losing members).

  **Where I Expect to Be Wrong**

  I am betting the audience wants stability. I might be wrong; they might be bored stiff by the ballad and crave a reharmonization despite the risk. I am also betting the tenors need simplification. You might know a trick to teach them the hard part quickly based on your bar experience. That is your intuition overriding my checklist.

  I expect to be wrong about the Work Song harmony. You might find that simplifying it kills the drive entirely, making it feel childish rather than accessible. If that happens, the Weld Test (Step 3) was too aggressive; the harmony *was* load-bearing for the genre, even if hard to sing. In that case, you must add a New Knob (Step 8), like having the pianists cover the hard notes, rather than changing the vocal part.

  **Final Commitment**

  For the ballad, keep the chords simple. Weld the melody shut. Turn the texture knob.
  For the work song, weld the rhythm shut. Turn the harmony knob downward (simplify).
  Stop when the singers look at the paper and smile instead of squint.

  There is no algorithm for soul. Use this to clear the weeds so you can see where the soul is hiding.
