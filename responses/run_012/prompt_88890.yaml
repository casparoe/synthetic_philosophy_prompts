      *   *Refinement:*
          1.  Setup: Two agents, no causal channel, but logical correlation (Newcomb-style).
          2.  The Conflict: A wants B to do X. B wants to do Y.
          3.  The Threat: A says "If Y, I punish."
          4.  The Hole: Once B does Y, A won't punish (costly). B knows this. Threat fails.
          5.  The Fix: A changes utility function (Surrogate Goal) *before* the correlation is evaluated.
          6.  Result: Punishment is now rational for A. B does X.

  4.  **Designing the Carrying Example:**
      *   User wants: Two agents, predict each other, deter action, retaliation costly.
      *   *Requirement:* Needs to be abstract enough to avoid "but in reality..." but concrete enough to track utilities.
      *   *Idea:* The "Paperclip vs. Staple" war is classic, but maybe too cliché.
      *   *Idea:* "The Digit Game." Agent A wants the 10,000th digit of pi to be announced as "Safe." Agent B wants to announce "Unsafe."
