          *   *Let's check the literature mentally:* The term "Surrogate Goal" in the context of *acausal threats* usually refers to the *victim* modifying their utility function so that the threatener cannot find a lever to pull. (e.g., "I value nothing you can affect.")
          *   *HOWEVER*, the user explicitly describes the *threatener* using it: "one wants to deter the other... surrogate goals as the patch."
