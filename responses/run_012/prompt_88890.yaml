      *   *Why:* To isolate the *logical* link from the *causal* link.

  5.  **Managing Misconceptions:**
      *   (a) "Just precommitment": Kill this early. Precommitment = burning a bridge (causal). This = changing the utility function that the *prediction* sees (logical).
      *   (b) "Needs a channel": Kill at the Setup. Define "acausal" as "correlated decisions without signal."
