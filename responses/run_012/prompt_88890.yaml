      *   Exclude: Löbian cooperation (too math-heavy).
      *   Exclude: Real-world feasibility (we don't know if LLMs can do this).
      *   *Crucial Exclusion:* **Updatelessness.** The user said only 1-2 know the word. You *cannot* explain acausal threats properly without hinting at updatelessness, but you can't teach it.
