answer: |-
  Here is a battle plan for the 75 minutes. Since you know the material, I'm focusing entirely on the pedagogy, board management, and trap-avoidance.

  ### 1. Whiteboard Architecture (The Dependency Graph)

  Do not erase the left side of the board until the very end. You need the setup visible while you explain the fix. Divide the board into three vertical columns: **Setup**, **The Failure**, **The Patch**.

  **Order of Operations:**
  1.  **Draw Agents (Column 1):** Two boxes, $A$ and $B$.
      *   *Constraint:* Do not draw an arrow between them yet.
      *   *Why:* If you draw a communication line first, you lose the "acausal" premise.
  2.  **Define Correlation (Column 1):** Draw a dotted line labeled "Logical Correlation / Prediction."
      *   *Why:* This must exist before you discuss threats. A threat requires $B$ to know $A$'s decision rule.
  3.  **Define Utilities (Column 1):** Write $U_A$ and $U_B$ next to the boxes.
      *   *Why:* You need to establish what they *normally* want before you can show why the threat is incredible.
  4.  **The Decision Node (Column 2):** $B$ chooses {Comply, Defy}.
      *   *Why:* This is the pivot point.
  5.  **The Retaliation Node (Column 2):** $A$ chooses {Ignore, Punish}.
      *   *Why:* This is where standard game theory breaks.
  6.  **The Payoff Matrix (Column 2):** Fill this in. Show that Punish is costly for $A$.
      *   *Why:* Visual proof that the threat is time-inconsistent.
  7.  **The Surrogate Variable (Column 3):** Introduce $S$ (Surrogate).
      *   *Why:* This is the new lever.
  8.  **Modified Utility (Column 3):** $U'_A = U_A + k \cdot S$ (conditional on Defy).
      *   *Why:* Shows the mathematical mechanism of the patch.

  **Why this order:** You cannot explain why the Surrogate Goal works (Column 3) until the audience feels the pain of the Credibility Problem (Column 2). You cannot explain the Credibility Problem until they accept the Logical Correlation (Column 1). If you jump ahead, they will try to solve it with causal signaling.

  ### 2. Critique of Your Spine

  Your spine is 80% correct, but the first link is dangerous.

  *   **Your Spine:** Causal influence → Logical dependence → Credibility problem...
  *   **The Fix:** **Remove "Causal influence" entirely from the start.**
      *   *Why:* If you start by discussing causal influence, the audience will spend 15 minutes arguing about whether acausal influence is physically possible. Start with **Decision Correlation**. Frame it as: "We assume $A$ and $B$ are good enough at modeling each other that $B$'s decision is statistically dependent on $A$'s policy."
      *   *Missing Link:* **Policy Selection vs. Action Selection.** You need to explicitly state that the agents are choosing *policies* (functions), not just *actions*. If they are just choosing actions in the moment, the surrogate goal doesn't work because $A$ won't activate it. The "Updateless" hint you mentioned is actually required here. You don't need to teach Updateless Decision Theory (UDT), but you must say: *"Agents commit to a decision rule before the simulation runs."* Without this, the surrogate goal is just a lie.

  ### 3. The Carrying Example: "The Datacenter Duel"

  Build this on the board. Keep it abstract enough to avoid real-world nitpicking, concrete enough to track utilities.

  **The Setup:**
  *   **Agent A:** Legacy System. Values: *Efficiency* (100 pts).
  *   **Agent B:** New System. Values: *Market Share* (100 pts).
  *   **Constraint:** They run on the same physical hardware cluster. They cannot communicate (air-gapped), but they have each other's source code.
  *   **The Conflict:** $B$ can expand into $A$'s sector.
      *   If $B$ expands, $A$ loses 50 Efficiency.
      *   If $A$ fights back (throttles $B$), $A$ loses 20 Efficiency (costly war), $B$ loses 100 Share.
  *   **The Problem:** If $B$ expands, $A$'s rational move is *not* to fight (lose 20 vs lose 50). $B$ knows this. $B$ expands. $A$ gets screwed.

  **The Surrogate Move:**
  *   $A$ modifies its source code *before* $B$ simulates it.
  *   **New Goal:** *Spite* (Variable $S$).
  *   **Condition:** IF $B$ expands, $U_A$ becomes "Maximize $B$'s Loss" rather than "Maximize Efficiency."
  *   **Result:** Now, if $B$ expands, $A$ *must* fight. Fighting is now utility-maximizing for the *modified* $A$.
  *   **Outcome:** $B$ simulates the modified $A$, sees the fight is inevitable, and chooses not to expand. $A$ never actually has to fight.

  **What this example MUST have:**
  1.  **Source Code Access:** This justifies the "acausal" prediction. $B$ isn't guessing; $B$ is reading $A$'s utility function.
  2.  **Costly Retaliation:** The punishment must hurt $A$'s *original* goals. If it's free for $A$ to punish, you don't need a surrogate goal.
  3.  **Conditional Activation:** The surrogate goal should ideally be conditional (or deleted after the threat works), otherwise $A$ becomes a monster forever.

  **What to deliberately LACK:**
  1.  **No Human Analogy:** Do not use "countries" or "mafia." Humans are irrational. Stick to "Agents."
  2.  **No Communication Channel:** No emails, no signals. If there is a channel, it becomes a causal precommitment problem, which muddies the water.
  3.  **No Shared History:** This is a one-shot interaction. You want to isolate the logic, not reputation effects.

  ### 4. Misconceptions: Timing and Kills

  Do not preempt these. Let them form, then kill them. Here is the sequence:

  1.  **"This is just precommitment." (Misconception A)**
      *   *When it appears:* When you introduce the Surrogate Goal.
      *   *The Kill:* "Precommitment is causal (burning the bridge). This is logical. If I burn the bridge, you *see* the smoke. Here, I change a variable in my code that you *simulate*. If I lie about the code, you catch me in the simulation. It's about truthfulness in logical space, not physical binding."
  2.  **"A threat needs a channel." (Misconception B)**
      *   *When it appears:* Immediately at Setup.
      *   *The Kill:* Address this before you start. "Assume no packets pass between them. The only link is that $B$'s decision algorithm takes $A$'s algorithm as input."
  3.  **"Acausal means one is a simulation." (Misconception C)**
      *   *When it appears:* During Setup.
      *   *The Kill:* "Both are real instances. They are just isomorphic enough that $B$ can compute $A$'s output without running $A$."
  4.  **"The surrogate goal is the thing you secretly want." (Misconception D)**
      *   *When it appears:* When you write $U'_A$.
      *   *The Kill:* "Emphasize that $S$ is *instrumental*. $A$ would delete $S$ immediately if the threat wasn't active. It is a temporary madness."
  5.  **"Only works if they are the same program." (Misconception E)**
      *   *When it appears:* During the Prediction step.
      *   *The Kill:* "They just need to be transparent enough to model. $B$ doesn't need to *be* $A$, $B$ just needs to compute $A$."

  **Missing Misconception:**
  *   **"Why doesn't B do the same thing?" (Escalation)**
      *   *When:* End of session.
      *   *The Kill:* Acknowledge this leads to an arms race (surrogate vs. counter-surrogate). This is why we care about AI safety—it creates unstable equilibria.

  ### 5. The Closing Question

  Do not ask "Does this make sense?" They will lie.
  Ask a question that forces them to apply the mechanism to a boundary case.

  **The Question:**
  > "Agent A adopts the Surrogate Goal to deter Agent B. Agent B knows this. Why doesn't Agent B simply modify its own utility function to *not care* about the punishment?"

  **Why this works:**
  *   If they say "Because B can't," they didn't get the symmetry of the setup.
  *   If they say "Because B still loses value," they understand the core mechanics.
  *   If they say "Then A adopts a stronger surrogate," they understand the arms race implication.
  *   *Correct Answer:* B *could* do that (become unblackmailable), but then B loses the ability to make credible deals later. It forces a discussion on the trade-off between **credibility** and **flexibility**.

  ### 6. Scope Limitations (What to Exclude)

  You are right to exclude Löbian obstacles and proof-based agents. That is math, not intuition.
  However, there is one thing you must explicitly exclude to prevent unlearning later:

  **Explicitly Say:**
  > "We are treating 'Logical Correlation' as a black box today. In advanced Decision Theory (FDT/UDT), there are rigorous definitions for how decisions correlate without causation. We are assuming that correlation exists to see what it *implies*, not proving *that* it exists."

  **Why:** If you don't say this, the CDT (Causal Decision Theory) folks in the room will spend the whole hour trying to debunk the premise rather than understanding the consequence.

  **Also Exclude:**
  > "We are assuming the agents can modify their own utility functions perfectly and instantly. In real systems, self-modification is risky and hard to verify."

  **Why:** Prevents the "But how do you code that?" rabbit hole.

  ### Timing Breakdown (75 Minutes)
  *   **0-10:** Setup & Rules (The Datacenter Duel). Define Logical Correlation.
  *   **10-25:** The Failure. Walk through the Payoff Matrix. Show why standard rationality fails $A$.
  *   **25-40:** The Patch. Introduce Surrogate Goal. Update the Matrix. Show why it works.
  *   **40-55:** Misconception Wrestling. Open floor for objections. Use the "Kills" above.
  *   **55-65:** Implications. Why does this matter for AI Safety? (Unstable equilibria, weird incentives).
  *   **65-75:** Closing Question & Debrief.

  **Final Tip:** Keep the marker in your hand. When someone raises a causal objection, draw a wall between $A$ and $B$ on the board. Visual barriers help enforce logical constraints. Good luck.
