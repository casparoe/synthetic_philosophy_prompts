  ### SEMINAR NOTES & FLAGGED ISSUES

  **1. The Chatbot Problem (Leaf 3 vs. Leaf 1)**
  The tree separates **Linguistic Conventionalism** (Leaf 1) from **Contractual Politeness** (Leaf 3).
  *   *The Issue:* If we argue the chatbot's "Great question" is *not a lie* because users consent to the register, it collapses into Leaf 1.
  *   *The Risk:* As noted in Leaf 3's commitment, if "consent to the register" makes falsehoods permissible by definition, does that allow a politician to say "I'm listening" while ignoring you, claiming we all consented to political speech? The tree keeps them separate to test if "polite context" changes *meaning* (Leaf 1) or just *permission* (Leaf 3).

  **2. The Unoccupied Leaf (Leaf 6)**
  **Social Deontology** is flagged as unoccupied/incoherent.
  *   *Why:* It suggests Politeness is a rigid moral rule (like Truth) that can override Truth, but without using Consequences (Leaf 4) to weigh them.
  *   *Status:* Incoherent. If both duties are absolute and non-consequential, there is no mechanism to decide which wins when they conflict.

  **3. Indistinguishable Positions (Leaf 2 vs. Leaf 5)**
  **Relational Honesty** (Leaf 2) and **Prima Facie Duty** (Leaf 5) can look similar in practice (both allow tact).
  *   *The Distinction:* Leaf 2 says tact *is* honesty (no conflict). Leaf 5 says tact *conflicts* with honesty but wins the weigh-up.
  *   *Test Case:* The Translator softening an assessment. Leaf 2 says the translator is being *more* honest. Leaf 5 says the translator is being *less* honest but more kind.

  **4. The Dutch/Osaka Dispute**
  *   Your Dutch friend likely occupies **Leaf 7 (Absolutism)** or **Leaf 5 (Prima Facie)** with a heavy weight on Truth. They view hedging as dishonesty.
  *   Your Osaka colleague likely occupies **Leaf 2 (Relational)** or **Leaf 1 (Conventionalism)**. They view bluntness as a failure of the social contract (rude) or a failure of relational honesty.
  *   *Resolution:* The tree shows they aren't just disagreeing on outcomes; they are answering **Q2** differently. One thinks honesty is about *facts*, the other about *reliability*.
