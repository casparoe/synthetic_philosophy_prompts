prompt: |-
  I sit on the program committee of a small interdisciplinary workshop series on the ethics of accountability, and we have funding for roughly six philosophers, legal theorists, and moral psychologists, part-time for two years, to work on standing to blame. The familiar territory has been well worked: the hypocrite who blames, the complicit blamer, the complaint that someone lacks the standing to object, and the dispute over whether standing is a condition on the appropriateness of blame, on the blamer's right, or on something else. I want the next phase to go somewhere less trodden, so take the following provisional frame seriously before you answer.

  Treat standing not as a single thing but as three separable strands. First, a permission: the blamer is not barred from performing the act. Second, an epistemic entitlement: the blame is credible and carries weight as moral address or testimony, so that the target and bystanders have reason to take it seriously. Third, an exposure: in blaming, the blamer becomes answerable and can be met with counter-blame, demands for consistency, or an accounting of her own record. These strands can come apart. One might be permitted to blame while having no epistemic entitlement to be heard, or hold the entitlement while laying oneself open to nothing in return.

  Given that frame, give me a defended research agenda rather than a survey. Which open questions about standing to blame most deserve the next two years, and in what order? I care more about the reasoning than about the list. For each candidate, explain why it is upstream of the others, how tractable it is for a small interdisciplinary group rather than for a single subfield, how neglected it currently is, and what argument or result over the next couple of years would move it up or down the ranking. Then identify the overrated questions: ones that look central but whose resolution would change little, or that are really terminological disputes dressed up as substantive ones. Finally, tell me where the three-strand frame is likely to be doing illegitimate work, and what would show that it is the wrong cut. We have a standing interest in whether any of this bears on the design of institutional accountability procedures, but I do not want that interest to crowd out questions whose payoff is purely conceptual.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Context:** Program committee for a small interdisciplinary workshop series (ethics of accountability).
      *   **Resources:** Funding for ~6 scholars (philosophers, legal theorists, moral psychologists), part-time for 2 years.
      *   **Topic:** Standing to blame.
      *   **Constraint/Frame:** Treat standing as three separable strands:
          1.  *Permission* (not barred from acting).
          2.  *Epistemic Entitlement* (credibility/weight of moral address).
          3.  *Exposure* (answerability/counter-blame risk).
      *   **Goal:** A *defended research agenda* (not a survey), prioritizing open questions.
      *   **Requirements:**
          *   Explain reasoning (why upstream, tractability for interdisciplinary group, neglectedness, criteria for moving up/down).
          *   Identify *overrated* questions (central-looking but low impact/terminological).
          *   Critique the *three-strand frame* itself (where it does illegitimate work/wrong cut).
          *   Keep institutional design in mind but don't let it crowd out conceptual work.

  2.  **Deconstruct the Three-Strand Frame:**
      *   *Permission:* Normative liberty. Do I have the right to speak/act? (Often linked to standing as a waiver or forfeiture).
      *   *Epistemic Entitlement:* Efficacy/Authority. Will/should my blame land? Is it testimony? (Links to moral psychology/communication).
      *   *Exposure:* Vulnerability/Reciprocity. What happens to *me* after I blame? (Links to legal procedure/social dynamics).
      *   *Key Insight:* These *can* come apart. This is the generative tension.

  3.  **Brainstorming Research Questions (based on the frame):**
      *   *Q1:* How do the strands interact? (Too vague).
      *   *Q2:* Does Exposure generate Permission? (If I'm exposed, am I permitted?)
      *   *Q3:* Is Epistemic Entitlement dependent on Permission? (Can a hypocrite speak truth?)
      *   *Q4:* How does Exposure function in institutional vs. interpersonal contexts?
      *   *Q5:* What is the temporal structure? (Exposure happens *after*, Permission *before*).
      *   *Q6:* Moral Psychology of Entitlement: Why do we listen to some and not others?

  4.  **Selecting and Prioritizing (The Agenda):**
      *   *Constraint:* 2 years, 6 people, interdisciplinary. Needs to be focused enough to produce results but broad enough for collaboration.
      *   *Priority 1 (Upstream):* The Relationship between Exposure and Permission. If Exposure is a *cost* that legitimizes Permission, that changes the theory of standing fundamentally. It moves from "status-based" to "risk-based."
      *   *Priority 2 (Midstream):* Epistemic Entitlement without Permission. Can the "tainted" messenger still deliver the message? This bridges philosophy and psychology (credibility heuristics).
      *   *Priority 3 (Downstream/Application):* Institutionalizing Exposure. If Exposure is key, how do we design procedures that ensure blamers are exposed without chilling necessary blame?

  5.  **Developing the Arguments for Prioritization:**
      *   *Why Exposure/Permission first?* It's the metaphysical/normative foundation. If standing is just about risk assumption, the "hypocrite" debate changes.
      *   *Interdisciplinary Tractability:* Philosophers define the norm, Legal theorists look at procedural risk, Psychologists measure the chilling effect of exposure.
      *   *Neglectedness:* Most literature focuses on Permission (do I have the right?). Exposure is usually treated as a side effect, not a constituent.
      *   *Move Up/Down:* If we find Exposure is merely punitive rather than constitutive, drop it. If we find Permission exists *because* of Exposure, it becomes the core.

  6.  **Identifying Overrated Questions:**
      *   *The "Condition vs. Right" Debate:* Is standing a condition of appropriateness or a right of the blamer? This often boils down to semantics about "appropriateness."
      *   *The Hypocrite's Binary:* Does the hypocrite *lose* standing or just *weaken* it? This is often a gradience issue masquerading as a binary metaphysical switch.
      *   *Waiver Details:* Exactly how is standing waived? Too much focus on the mechanism of loss rather than the function of gain.

  7.  **Critiquing the Frame (The "Wrong Cut"):**
      *   *Risk:* Reification. Treating "strands" as distinct entities when they might be aspects of a single social practice.
      *   *Risk:* Temporal Separation. Permission and Exposure are temporally distinct (before/after), but Entitlement is concurrent. Does this distort the phenomenology?
      *   *Risk:* Individualism. The frame focuses on the *blamer*. What about the *community*? Standing might be a communal grant, not an individual attribute.
      *   *Test:* If we find that "Permission" is actually just the absence of "Exposure" costs, the distinction collapses.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, rigorous, strategic, respectful of the funding constraints.
      *   *Structure:*
          1.  Introduction (acknowledging the frame).
          2.  Priority 1: The Normative Force of Exposure (The "Risk-Backing" Thesis).
          3.  Priority 2: Epistemic Entitlement in the Absence of Permission (The "Tainted Messenger" Problem).
          4.  Priority 3: The Temporal Asymmetry of the Strands.
          5.  Overrated Questions.
          6.  Critique of the Frame.
      *   *Refining the "Exposure" argument:* Make sure to link it to legal theory (standing as injury) and psychology (cost signaling).
      *   *Refining the "Entitlement" argument:* Focus on testimony and moral knowledge.
      *   *Refining the Critique:* Ensure it challenges the *separability* assumption.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the institutional design interest? *Adjustment:* Mention it in Priority 3, but keep the focus conceptual.
      *   *Check:* Is it interdisciplinary? *Adjustment:* Explicitly mention what the psychologists vs. legal theorists vs. philosophers bring to each priority.
      *   *Check:* Is the timeline realistic? *Adjustment:* Frame Priority 1 as Year 1, Priority 2 & 3 as Year 2.
      *   *Check:* Did I answer "what would move it up or down"? *Adjustment:* Ensure each priority has a specific falsification/confirmation condition.

  10. **Final Polish:** Ensure the distinction between the three strands is maintained throughout the argumentation. (e.g., Don't conflate Permission and Entitlement).

  *(Self-Correction Note)*: I need to be careful not to just accept the frame uncritically in the agenda section, but use it to generate questions, then critique it in the final section. The prompt asks to "take the following provisional frame seriously before you answer," which implies using it to generate the agenda, then critiquing it at the end.

  *(Final thought on Overrated Questions)*: The "Standing to Blame vs. Standing to Demand" distinction is often made, but under this three-strand frame, it might just be a difference in the *weight* of Entitlement, not a different kind of standing. I should highlight that.

  *(Final thought on Frame Critique)*: The biggest risk is that "Permission" is just the lack of social sanction, which is effectively "Exposure." If Permission = ~Exposure, the triad collapses to a dyad. This is a strong critique to offer.

  Okay, ready to write.
answer: |-
  This is a sophisticated prompt that requires a strategic research design rather than a literature review. You are asking for a roadmap that leverages the specific constraints (interdisciplinary, small team, 2 years) and the specific conceptual innovation (the three-strand frame).

  Here is a defended research agenda, followed by an assessment of overrated questions and a critique of the frame itself.

  ### Part I: The Research Agenda (Prioritized)

  The guiding hypothesis for this two-year cycle should be: **Standing is not a status one *has*, but a risk profile one *assumes*.**

  If we treat the three strands as separable, the most productive tension lies between **Permission** (the liberty to act) and **Exposure** (the liability incurred). The standard literature assumes Permission is the primary good and Exposure is a secondary risk. I propose inverting this. The agenda prioritizes questions that test whether Exposure is actually the *source* of Permission, and how Epistemic Entitlement functions when that link is broken.

  #### Priority 1: The Constitutive Role of Exposure (Year 1)
  **Question:** *Is Exposure merely a consequence of blaming, or is the willingness to incur Exposure a necessary condition for Permission?*

  *   **Reasoning (Upstream Status):** This is the metaphysical foundation of the project. If Exposure is just a side effect, the strands are merely descriptive categories. If Exposure is *constitutive* of Permission (i.e., you are only permitted to blame insofar as you make yourself vulnerable to counter-scrutiny), then the "hypocrite" problem dissolves into a calculation of risk asymmetry. This determines whether we are studying a deontic right (Permission) or a pragmatic wager (Exposure).
  *   **Interdisciplinary Tractability:**
      *   *Philosophers* can model the normative link (does vulnerability generate authority?).
      *   *Legal Theorists* can analyze *locus standi* doctrines where standing requires demonstrating personal injury (a form of Exposure).
      *   *Moral Psychologists* can test whether observers grant more Permission to blamers who signal vulnerability (e.g., "I struggle with this too, but...").
  *   **Neglectedness:** Literature focuses heavily on the *loss* of standing (hypocrisy, complicity). It rarely asks if standing is *purchased* through the assumption of risk.
  *   **Move Up/Down Criteria:**
      *   *Move Up:* If empirical data shows that blamers who explicitly invite counter-blame are judged as having *more* normative Permission, this becomes the core theory.
      *   *Move Down:* If we find that "anonymous whistleblowing" (high Permission, near-zero Exposure) is consistently judged as fully legitimate standing, the constitutive link is broken, and Exposure is demoted to a contingent feature.

  #### Priority 2: Epistemic Entitlement Without Permission (Year 2)
  **Question:** *Can a blamer lack Permission (be "barred") but retain Epistemic Entitlement, and if so, what is the normative status of their blame?*

  *   **Reasoning:** This tests the separability of the strands most rigorously. Standard views suggest if you lack standing (Permission), your blame is "inappropriate." But if Entitlement is separate, a hypocrite might be *barred* from blaming (Permission) while still offering *true and weighty* moral testimony (Entitlement). This reframes the hypocrite not as someone whose blame is nullified, but as someone whose blame is *admissible evidence* but *procedurally inadmissible*.
  *   **Interdisciplinary Tractability:**
      *   *Philosophers* distinguish between the truth of the claim and the right to assert it.
      *   *Psychologists* can measure the "credibility discount." Do listeners reject the *content* of the blame because of the *source*, or just the *source*?
      *   *Legal Theorists* can draw on evidence law (hearsay vs. credible witness with bias).
  *   **Neglectedness:** Most debates treat standing as an on/off switch for the *appropriateness* of the act. Few distinguish between the act being "impermissible" vs. the content being "epistemically inert."
  *   **Move Up/Down Criteria:**
      *   *Move Up:* If we can articulate a coherent norm where we say, "You had no right to say that, but you were right, and we must act on it," this strand becomes a major tool for institutional design.
      *   *Move Down:* If it turns out that Entitlement is socially impossible without Permission (i.e., we psychologically cannot hear the truth from the barred), then the distinction is conceptually valid but practically useless.

  #### Priority 3: The Temporal Asymmetry of the Strands (Year 2)
  **Question:** *How does the temporal gap between Permission (ex ante) and Exposure (ex post) create accountability deficits?*

  *   **Reasoning:** Permission is claimed *before* the act; Exposure is suffered *after*. Entitlement is concurrent. This asymmetry allows for "hit-and-run" blaming (claiming Permission, enjoying Entitlement, evading Exposure). This is crucial for your interest in institutional design without being reducible to it. It asks about the *structure* of moral time.
  *   **Interdisciplinary Tractability:**
      *   *Legal Theorists* are essential here (statutes of limitation, discovery processes).
      *   *Psychologists* study delayed reciprocity and memory of social exchanges.
      *   *Philosophers* analyze the diachronic identity of the blamer (am I the same person accountable later?).
  *   **Neglectedness:** Standing is usually treated as a snapshot property. The dynamic, temporal flow is under-theorized.
  *   **Move Up/Down Criteria:**
      *   *Move Up:* If we identify specific mechanisms (e.g., social media structures) that decouple Permission from Exposure temporally, leading to distinct moral pathologies, this becomes a high-impact conceptual tool.
      *   *Move Down:* If Exposure is shown to be immediate and automatic (e.g., social sanction is instant), the temporal gap is illusory.

  ---

  ### Part II: Overrated Questions

  To maximize the utility of your funding, you should explicitly deprioritize the following. They look central but are likely terminological traps or low-yield under the three-strand frame.

  **1. The "Condition vs. Right" Debate**
  *   *The Question:* Is standing a condition on the appropriateness of blame, or a right of the blamer?
  *   *Why Overrated:* Under the three-strand frame, this is a false dichotomy. It maps messy onto Permission. Whether it is a "right" or a "condition" often boils down to whether you focus on the agent (Right) or the act (Condition). Resolving this terminology rarely changes the outcome of specific cases.
  *   *Verdict:* **Deprioritize.** Treat it as a linguistic variance. Focus instead on *what generates* the Permission, not what we call it.

  **2. The Binary Status of the Hypocrite**
  *   *The Question:* Does the hypocrite *lose* standing entirely, or merely have it *diminished*?
  *   *Why Overrated:* This assumes standing is a scalar quantity of a single substance. Your frame suggests standing is a *bundle* of strands. A hypocrite might retain Epistemic Entitlement (their claim is true) while losing Permission (they are barred) and increasing Exposure (they are open to counter-blame). Arguing over the binary switch ignores the configurative possibilities.
  *   *Verdict:* **Deprioritize.** Replace with: "Which strands does hypocrisy sever?"

  **3. The "Waiver" Mechanism**
  *   *The Question:* By what exact mechanism is standing waived? (Forgiveness, time, shared fault?)
  *   *Why Overrated:* This is often a cataloging exercise. Unless tied to the *Exposure* strand (i.e., does waiver reduce Exposure?), it is merely descriptive taxonomy.
  *   *Verdict:* **Deprioritize.** Only study waiver insofar as it alters the risk profile of Exposure.

  ---

  ### Part III: Critique of the Three-Strand Frame

  You asked where this frame is likely doing illegitimate work. A research agenda must be willing to dismantle its own scaffolding. Here are the three points of failure for the Permission/Entitlement/Exposure triad.

  **1. The Reification of "Permission"**
  *   *The Risk:* The frame treats Permission as a distinct normative asset. However, it is highly probable that "Permission" is simply the *absence of anticipated Exposure*. If I am not barred from blaming, it is only because the social cost (Exposure) is low.
  *   *The Test:* If the group finds that whenever Exposure is high, Permission is judged to be low (and vice versa), then Permission is not a separate strand but a *function* of Exposure.
  *   *Implication:* The triad collapses into a dyad (Risk + Credibility). The agenda would need to pivot to a purely consequentialist or pragmatic theory of standing.

  **2. The Individualist Bias of "Entitlement"**
  *   *The Risk:* Epistemic Entitlement is framed as a property of the *blamer's* credibility. But moral testimony is often communal. A blamer might have low individual credibility but high *positional* entitlement (e.g., a victim speaking about their own harm).
  *   *The Test:* If the group finds that Entitlement tracks *relationship* (victim-offender) more than *blamer attributes* (consistency, knowledge), the frame is too agent-centric.
  *   *Implication:* The frame needs a fourth strand: *Relational Position*. Without it, you cannot explain why victims have standing even if they are morally flawed (low Entitlement in the individual sense).

  **3. The Temporal Illusion of Separability**
  *   *The Risk:* The frame implies these strands can be present in different combinations at the same time. But Exposure is inherently retrospective. You cannot know your Exposure *before* you blame. Therefore, at the moment of decision (Permission), Exposure is purely speculative.
  *   *The Test:* If Moral Psychologists find that agents cannot cognitively process "Permission" without simulating "Exposure," then the strands are not separable in practice, only in analysis.
  *   *Implication:* The frame is useful for *evaluation* (judging blame after the fact) but useless for *deliberation* (deciding to blame). If your goal is normative guidance, this is a fatal flaw.

  ### Summary Recommendation

  **Fund Priority 1 (Exposure as Constitutive).** It offers the highest conceptual leverage. If Exposure generates Permission, you rewrite the theory of standing from a status model to a risk model. This naturally accommodates the legal theorists (liability), psychologists (cost signaling), and philosophers (normative authority).

  **Keep Institutional Design as a Stress Test.** Do not design procedures yet. Instead, ask: "If our theory of standing is correct, what would a broken institution look like?" (e.g., an institution that grants Permission without Exposure). This keeps the work conceptual but grounded.

  **Be Prepared to Collapse the Frame.** Assign one team member the specific role of "Devil's Advocate" against the three-strand separation. If Permission and Exposure prove inseparable after Year 1, pivot immediately to a Risk/Credibility dyad. It is better to publish a robust two-strand theory in Year 2 than a forced three-strand theory.
