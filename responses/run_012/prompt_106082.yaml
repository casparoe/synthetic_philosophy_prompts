      *   *Point 3 (Boundary Conditions):* The universe started special. Needs an image. A tidy room? A wound-up clock? A stacked deck of cards? Let's go with a tidy room or a stacked deck. A "wound-up clock" is classic but maybe too mechanical. A "perfectly stacked deck of cards" is good because shuffling is easy, un-shuffling is hard. Or a "clean room" vs. "messy room." Let's try the "clean room" image. It's relatable.
