answer: |-
  # Session Plan: The Certification Protocol
  **Topic:** Personal Identity & Mind Uploading (Gradual Replacement)
  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Goal:** Induce the "Gradual Replacement" impasse through procedural simulation rather than lecture.

  ## I. Preparation & Materials

  **1. The Occupants (Critical Prep)**
  *   **Recruit 2 students beforehand.** Do not announce this to the class.
  *   **Briefing:** Send them a script 48 hours in advance. They are to memorize a specific 1-page biography (name, childhood memory, favorite color, fear of spiders) and a set of 5 standard responses to philosophical questions (e.g., "Describe what red looks like," "Why do you think you are you?").
  *   **Instruction:** They must answer *only* from the script. If asked a question not on the script, they must say, "I don't recall that specifically, but generally I feel..." and pivot to a scripted sentiment. They must not reveal they have a script.
  *   **Role:** Occupant A (Baseline), Occupant B (The Candidate).

  **2. The Board (The Class)**
  *   **Seating:** 14 students in a semi-circle. Two chairs at the front ("The Dock").
  *   **Materials:**
      *   **Board Charter:** A one-page handout outlining their authority and liability (see *Stakes* below).
      *   **Test Design Sheet:** Blank space to draft 3 verification tests.
      *   **Timeline Handout:** A linear graphic showing 12 stages (0% to 100% neural replacement in 10% increments).
      *   **Liability Tokens:** 2 poker chips or colored cards per student.

  **3. The Timeline Data (Instructor Only)**
  *   A master sheet showing that at every stage (0–100%), functional test results are "Normal" and Patient Self-Report is "Continuous."

  ---

  ## II. Session Timeline

  ### Phase 1: The Certification Board (0:00 – 0:35)

  **0:00 – 0:05: Setup & Stakes**
  *   **Instructor:** "You are the Ethics & Identity Board. A procedure exists to replace neural tissue with silicon. We have a Baseline (Occupant A) and a Candidate (Occupant B) who claims to be the same person after a procedure. Your job is to design tests to verify identity."
  *   **The Stakes (Liability Rule):** "You must issue a Binary Verdict: **Same Person** or **New Person**. If you certify 'Same Person' and the original consciousness was destroyed, you are morally liable for 'negligent homicide' in the simulation record. If you certify 'New Person' and the original survived, you are liable for 'identity theft' and denying rights. You cannot abstain. You must sign the verdict."

  **0:05 – 0:15: Test Design**
  *   Students break into pairs to design 3 distinct tests to distinguish A from B.
  *   **Constraint:** Tests cannot involve medical scans (those are inconclusive by rule). They must rely on behavior, memory, or testimony.
  *   **Class Aggregation:** Select the top 3 tests (e.g., "Recall a specific childhood trauma," "Solve a novel puzzle," "Describe the feeling of pain").

  **0:15 – 0:30: The Interrogation**
  *   **Round 1:** Occupant A enters. Board administers the 3 tests. (Occupant A answers from script).
  *   **Round 2:** Occupant A leaves. Occupant B enters. Board administers the *exact* 3 tests. (Occupant B answers from the *same* script).
  *   **Observation:** The Board should notice the answers are indistinguishable.
  *   **Deliberation:** The Board must discuss. If they suspect cheating, tell them: "Assume the Lab Protocol is perfect. The functional output is identical."

  **0:30 – 0:35: The Verdict**
  *   Take a vote. Almost certainly, they will vote "Same Person" because they have no evidence to the contrary.
  *   **Instructor Action:** Record the verdict. "Board has certified continuity based on functional identity."

  ### Phase 2: The Gradual Timeline (0:35 – 1:05)

  **0:35 – 0:40: The Reveal of Process**
  *   **Instructor:** "The procedure you just certified wasn't a swap. It was a gradual replacement. Here is the log."
  *   **Distribute Timeline Handout:** 12 Stages (0%, 10%, 20%... 100%).
  *   **Data Points:** At every stage, list:
      1.  % Neural Tissue Remaining.
      2.  Functional Battery: **PASS**.
      3.  Self-Report: "I feel no change."

  **0:40 – 0:50: The Threshold Decision**
  *   **Task:** "Mark the exact stage where the person *dies* or *ceases to be the original*. If you believe they never die, mark '100% / Survival'."
  *   **The Stake (The Token Wager):** "Place one Liability Token on your chosen cutoff point. If you choose 'Survival', place both tokens on 100%. You must be willing to defend this specific line in the debrief. If you hedge or refuse to place a token, you recuse yourself from the final discussion."
  *   **Individual Work:** Students mark their sheets privately.

  **0:50 – 1:05: The Aggregation & Impasse**
  *   **Visualize:** Ask students to raise hands for Stage 1, Stage 2... Stage 100. (Usually, the votes will be scattered randomly, or clustered on 50% without justification).
  *   **The Trap:** Ask three students with different thresholds: "What physically happens at your chosen stage that didn't happen at the previous one?"
  *   **Instructor Constraint:** Do not accept "It just feels like the limit." Ask: "Look at the data. The tissue change from Stage 4 to 5 is identical to Stage 5 to 6. The test results are identical. The patient says nothing changed. What *fact* justifies your line?"
  *   **Silence:** Allow the discomfort to sit. They will realize there is no factual basis for their line.

  ### Phase 3: Debrief & Mapping (1:05 – 1:30)

  **1:05 – 1:15: The Two Horns**
  *   **Instructor:** "You could not find a difference in Phase 1. You could not find a boundary in Phase 2. This leaves you with two options, and both are difficult:"
      1.  **The Optimist Horn:** Identity survives. The silicon substrate supports the mind just as well as carbon. (But then, what is 'you' made of? It's not your stuff.)
      2.  **The Pessimist Horn:** Identity died silently. At some point, the lights went out, but the machine kept talking. The thing in the chair *says* it's conscious, but it's a philosophical zombie.
  *   **Connect to Phase 1:** "If Horn 2 is true, your Certification Board just certified a corpse. Your tests couldn't tell the difference because zombies act like people."

  **1:15 – 1:25: The Fading Qualia Puzzle**
  *   **Instructor:** "Some say consciousness would fade gradually. But if it faded, would the subject notice?"
  *   **The Argument:** "If your color vision faded from red to gray, you would notice the change. If the subject notices, they report it. The timeline says they *never* report a change. So either the lights stay on full brightness (Horn 1), or they snap off instantly without the subject noticing (Horn 2). A sudden snap without detection is metaphysically strange."

  **1:25 – 1:30: Closing**
  *   **Name the Problem:** "This is the Gradual Replacement Argument (or The Ship of Theseus applied to Mind). We will spend the next week reading Chalmers and Parfit on why this matters."
  *   **Collect Tokens:** Keep the Liability Tokens as a record of their commitment.

  ---

  ## III. Troubleshooting: Predictable Failures & Closures

  **1. The "Dualism" Escape**
  *   **Student Move:** "The soul isn't in the neurons. You can't test for it. So the tests in Phase 1 were useless."
  *   **Closure:** "Accept that premise for the sake of the timeline. If the soul is non-physical, does it track the neurons or the silicon? If it tracks the neurons, at what % replacement does God move the soul? Is there a % where God is confused? If you can't specify *when* the soul leaves, you can't set a safety threshold for the procedure."

  **2. The "Actors Were Coached" Objection**
  *   **Student Move:** "Occupant B just memorized the answers. That doesn't prove understanding."
  *   **Closure:** "In a thought experiment, we assume ideal conditions. Assume the silicon brain *actually processes* the information identically, not just playback. If the processing is identical, is the understanding different? If yes, how would you ever test for 'real' understanding vs 'simulated' understanding without magic?"

  **3. The "Vague Boundary" (Sorites) Defense**
  *   **Student Move:** "Identity is vague. There isn't a sharp line. It's a spectrum."
  *   **Closure:** "Law and Ethics require binary decisions. You either have rights or you don't. You are alive or dead. If it's a spectrum, at what point do we stop prosecuting murder? If Stage 90% is 'mostly' the person, can we turn them off? Your Liability Token forced you to pick a line. Defend that line."

  **4. The "Hedging" Strategy**
  *   **Student Move:** Placing tokens between lines or refusing to commit.
  *   **Closure:** Enforce the rule strictly. "The simulation requires a binary switch for the life-support system. It is either ON or OFF. Place the token."

  ---

  ## IV. Limitations: What You Must Supply

  **1. The Metaphysical Horror**
  *   **The Gap:** The activity is logical and procedural. It creates an *intellectual* impasse. It does not automatically create an *existential* one. Students may treat it as a logic puzzle to be solved rather than a threat to their self-conception.
  *   **Your Job:** In the debrief, you must vocalize the stakes. "If Horn 2 is true, *you* could be replaced next Tuesday, and you would thank the surgeon as they extinguished you. You would not know the difference." You must supply the emotional weight of the "Silent Extinction."

  **2. The Definition of "Function"**
  *   **The Gap:** Students may assume "function" means "robotic output."
  *   **Your Job:** Clarify that "functional identity" includes emotional responses, creative output, and internal self-modeling. If the upload cries at a movie and writes poetry, it is functionally identical. Ensure they don't dismiss Phase 1 as a "Turing Test" that they think they can beat with "deep" questions.

  **3. The Connection to Materialism**
  *   **The Gap:** The activity assumes a physicalist framework (mind depends on brain).
  *   **Your Job:** Explicitly state in the debrief: "This problem only bites if you believe the mind is what the brain *does*. If you believe the mind is a ghost, the timeline is irrelevant. But if you are a materialist, this timeline is your death warrant unless you can find the line."

  ## V. Instructor Script Snippets (For the Impasse)

  *   **When they struggle to find a difference in Phase 1:** "You are looking for a ghost in the machine. If the machine behaves exactly like the person, screams like the person, and pleads like the person, on what evidence do you deny them personhood?"
  *   **When they pick an arbitrary line in Phase 2:** "Why 40%? Is there a magic property in the 41st neuron? If you replace one neuron at a time, does the person flicker on and off? Or does the 'personness' leak out slowly? If it leaks, why didn't they report it?"
  *   **Closing:** "You wanted a test for the soul. The experiment shows there is no test. There is only the wager."
