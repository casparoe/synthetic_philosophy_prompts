      *   *Refining the "Hope Nobody Asks":* It needs to be the "Normativity" question. If logic is just stipulation, why is classical logic *useful* for physics and intuitionistic for code? Is there a meta-criterion? If I say "no," I'm an instrumentalist. If I say "yes," I'm back to realism.

  8.  **Final Polish:** Ensure the tone is appropriate for a postdoc prepping for a high-stakes seminar. Professional, sharp, slightly anxious but controlled. (The output should be the prep sheet itself).

