      *   *Sentence 6:* "Also he thinks pleasure doesnt really count for much anyway and that life is objectively rubbish — thats not his opinion, its just what the facts show."
          *   *Assessment:* Benatar does argue that pleasures are often overvalued compared to pains (the "polarity" argument), but "life is objectively rubbish" is a caricature. He argues life contains *more* harm than people realise, not that it's devoid of value. The "facts show" bit is his rhetorical style (objectivism), but the "rubbish" phrasing is the video's spin.
          *   *Verdict:* Wince (oversimplification/caricature).

