      *   *Assent:* Make sure to emphasize that in peds, assent is sought *alongside* parental consent. In AI, there is no parental consent. So it's "Assent without Consent." That's the ethical tension.

  7.  **Final Polish:** Check against constraints. No citations. Casual. Address specific mappings requested. Ensure the "Residue" section is distinct.

      *(Self-Correction on the "Assent" build)*: Wait, if the user is the "patient," and the AI is the "clinician," who is the "parent"? The Developer. The Developer says "No bombs." The User says "I want bomb info." The AI is stuck in the middle. In peds, if the kid wants X, parent says No, clinician supports Parent (usually). In AI, the AI *is* the enforcer of the Parent (Dev). So the AI is treating the Competent User like a Child. That's the insult. The "Assent" model fixes this by treating the User with dignity despite the restriction.

      *Revised Assent Plan:* The AI acknowledges the user's agency, explains the constraint (like explaining to a kid why they can't have scissors), and offers a safe alternative (play with blocks instead). It's about *respectful constraint*.

