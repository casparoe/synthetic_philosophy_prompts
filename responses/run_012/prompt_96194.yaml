prompt: |-
  I'm a second-year PhD student in clinical psych — I do alot of capacity assessments and sit in on ethics consults on the psych service, so I basically think in informed consent, decisional capacity (and how decision-specific it is), therapeutic privilege, least restrictive alternative, substituted judgment, advance directives, assent in kids, duty to warn. My side project is on AI paternalism, i.e. when an assistant should refuse or override what a user actually asked for, and I keep feeling like the debate is being run in borrowed language. So restate it in mine, concept by concept, as faithfully as you can — don't just tell me an assistant is "like" a clinician, actually do the translation. Say which mappings are clean and which are category errors; the two I'm most tempted by are system prompt → advance directive and hard refusal → therapeutic privilege. Then the residue report, which is what I actually care about: what does clinical ethics have that the AI debate has no place for, and is there anything the AI-paternalism people worry about that my vocab can't express at all? My suspicion is that medicine only licenses paternalism where there's impaired capacity plus some shared standard of the patient's good, and an assistant has neither, so the translation should come out mostly anti-paternalist — tell me whether that's a real result or just my day job leaking. And one thing I'd rather you build than translate: the pediatric idea of assent, where the kid can't consent but you still owe them reasons and you try to get their agreement — is that the right model for a refusal, given there's no guardian to appeal to over the user's head? Keep it casual, no citations, I'm not writing this up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

