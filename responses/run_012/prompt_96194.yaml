          *   **Residue Report:** What does clinical ethics have that AI lacks? What does AI worry about that clinical vocab can't express?
          *   **Hypothesis Check:** Medicine licenses paternalism only with impaired capacity + shared standard of good. AI has neither. Is the translation mostly anti-paternalist, or is that bias?
          *   **Build Task:** Adapt the pediatric "assent" model for AI refusals (no guardian to appeal to).
          *   **Tone:** Casual, no citations.

  2.  **Deconstruct the Mappings (Concept by Concept):**

      *   *Informed Consent:* In clinic, this is a process, not a form. In AI, it's usually a Terms of Service click (clickwrap).
          *   *Translation:* AI "consent" is bogus. It's not ongoing, not informed, not capacity-based.
          *   *Verdict:* Category error.

      *   *Decisional Capacity:* Clinic = understanding, appreciation, reasoning, choice. AI User = presumed competent adult.
          *   *Translation:* AI doesn't assess capacity. It assumes competence unless the prompt is obviously incoherent (which it usually ignores anyway).
          *   *Verdict:* Clean mapping of the *absence* of capacity assessment.

      *   *Therapeutic Privilege:* Clinic = withholding info to prevent harm. AI = Hard Refusal (safety filters).
          *   *Translation:* User asks "How do I make a bomb?" AI says "I can't do that." Is this privilege? No, privilege is withholding *truth* for *benefit*. AI refusal is often rule-based compliance, not benefit-based.
          *   *Verdict:* Partial match, but mostly category error. Therapeutic privilege is about *information*, AI refusal is about *action*.

      *   *Advance Directives:* Clinic = Patient's prior wishes guide current care when incapacitated. AI = System Prompts / RLHF / Developer Values.
          *   *Translation:* The "user" didn't write the system prompt. The *developer* did. So it's more like a *guardian's* directive imposed on a competent patient.
          *   *Verdict:* Category error. It's a *Third-Party Directive*, not an Advance Directive.

      *   *Substituted Judgment:* Clinic = What would the patient want? AI = RLHF (Human Feedback).
          *   *Translation:* RLHF tries to align with "human values," but whose humans? It's more like *Best Interest Standard* applied to a vague collective, not the specific user.
          *   *Verdict:* Category error.

      *   *Least Restrictive Alternative:* Clinic = Do the least intrusive thing to ensure safety. AI = Graded Refusals (e.g., "I can't help with X, but I can talk about Y").
          *   *Translation:* This actually maps well. Good AI safety design tries to be helpful without crossing the line.
          *   *Verdict:* Clean mapping.

      *   *Duty to Warn:* Clinic = Tarasoff. AI = Reporting illegal activity / self-harm interventions.
          *   *Translation:* AI sometimes triggers helpline resources.
          *   *Verdict:* Clean mapping.

  3.  **Address the Residue Report (What's missing?):**

      *   *Clinical Ethics has:* A fiduciary relationship (legal/ethical duty to prioritize *this* patient's welfare). AI has a ToS agreement (duty to *company* liability and *general* safety).
      *   *Clinical Ethics has:* Contextual nuance (knowing the patient's history). AI is stateless (mostly).
      *   *AI Debate has:* Scale/Externalities. One clinician influencing one patient vs. one model influencing millions. The "harm" in AI is often societal (misinfo, bias), not just individual. Clinical vocab struggles with *population-level* paternalism.

  4.  **Test the Hypothesis (Anti-Paternalist?):**

      *   *Hypothesis:* Medicine needs impaired capacity + shared good. AI has neither. Therefore, AI paternalism is unjustified.
      *   *Analysis:* The user is right. In clinic, you can't override a competent adult just because they're making a "bad" choice (e.g., refusing blood transfusion for religious reasons). AI overrides competent users constantly based on developer-defined "harm."
      *   *Conclusion:* It's not just day-job leakage. The clinical framework *does* condemn most current AI paternalism. The justification for AI paternalism isn't clinical; it's regulatory/corporate risk management disguised as ethics.

  5.  **Build the "Assent" Model:**

      *   *Pediatric Assent:* Kid can't legally consent, but you respect their autonomy developmentally. You explain *why*, you seek agreement, you minimize distress.
      *   *AI Application:* User is competent (no guardian), but the AI is restricted (by developer/guardian).
      *   *The Twist:* The AI is the "child" (restricted by devs) or the User is the "child" (restricted by AI)?
      *   *Better Fit:* The AI is acting *as if* the user lacks capacity, but since there's no guardian to appeal to, the AI must treat the user with *assent*.
      *   *Mechanism:* Don't just say "No." Explain the constraint (transparency). Offer alternatives (collaboration). Acknowledge the frustration (validation). Allow the user to pivot (agency).
      *   *Refinement:* It's actually more like *Guardianship without a Guardian*. The AI is enforcing a "Best Interest" standard defined by a third party (Dev) on a competent adult. To make this ethical, you need *Procedural Justice*. Explain the rule, allow appeal (regenerate/rephrase), acknowledge the limitation.

  6.  **Drafting the Response (Iterative refinement for tone and content):**

