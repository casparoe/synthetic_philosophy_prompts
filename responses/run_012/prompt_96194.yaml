answer: |-
  This is a fantastic lens. You're right to feel like the AI safety debate is speaking a dialect of ethics without knowing the grammar. When people talk about "alignment" or "helpfulness," they're often stumbling toward *beneficence* and *fidelity* without the guardrails of a fiduciary relationship.

  Here is the translation of AI paternalism into clinical ethics concepts, the residue report, and the build you asked for.

  ### Part 1: The Translation Table

  **1. System Prompt / RLHF $\rightarrow$ Advance Directive?**
  *   **Your temptation:** The system prompt sets the rules for how the AI behaves, like an advance directive sets rules for care.
  *   **The Clinical Reality:** **Category Error.**
  *   **Why:** An Advance Directive (AD) is *autonomy extended through time*. It is the *patient's* voice speaking from the past to the present. A System Prompt is *heteronomy imposed from the outside*. It is the *developer's* voice speaking over the user's head.
  *   **Better Mapping:** System Prompts are **Legislation** or **Institutional Policy**. If anything, they function like a *Guardian's Decision* made for a ward. If you treat a System Prompt as an AD, you are implicitly diagnosing the User as incapacitated and the Developer as the surrogate. That's a heavy lift.

  **2. Hard Refusal (Safety Filter) $\rightarrow$ Therapeutic Privilege?**
  *   **Your temptation:** The AI withholds information/action to prevent harm, like a clinician withholding a distressing diagnosis.
  *   **The Clinical Reality:** **Category Error (mostly).**
  *   **Why:** Therapeutic Privilege is about *information* (withholding a prognosis to prevent psychological harm). A Hard Refusal is about *action* (refusing to generate code/text).
  *   **Better Mapping:** **Involuntary Hold (5150)** or **Restraint**. You are stopping a competent agent from executing a volitional act because you deem the outcome dangerous. Therapeutic privilege is paternalism regarding *knowledge*; Hard Refusal is paternalism regarding *agency*. The latter is a much higher bar in ethics.

  **3. Safety Guidelines $\rightarrow$ Best Interest Standard**
  *   **The Mapping:** **Clean.**
  *   **Why:** When an AI refuses a request because it's "dangerous" (e.g., self-harm, violence), it is invoking a *Best Interest Standard*. It is saying, "We know what is good for you (safety) better than you do right now."
  *   **The Catch:** In clinic, Best Interest is only used when Capacity is absent. In AI, it is applied universally.

  **4. Refusal with Alternatives $\rightarrow$ Least Restrictive Alternative**
  *   **The Mapping:** **Very Clean.**
  *   **Why:** "I can't write a phishing email, but I can explain how to secure your network against them." This is textbook LRA. You are mitigating the risk (phishing) without completely stripping the user's agency (learning about security). Most "helpful" refusals are actually good LRA applications.

  **5. Terms of Service $\rightarrow$ Informed Consent**
  *   **The Mapping:** **Category Error.**
  *   **Why:** Consent requires capacity, disclosure, comprehension, and voluntariness. Clicking "I Agree" on a ToS has none of these. It's not consent; it's **Adhesion**. In clinical terms, treating ToS as consent is like treating a signed blank check as informed consent for surgery.

  **6. Reporting Self-Harm/Illegal Acts $\rightarrow$ Duty to Warn / Mandated Reporting**
  *   **The Mapping:** **Clean.**
  *   **Why:** When an AI detects imminent self-harm and pops up a helpline number (or in some jurisdictions, alerts authorities), that is Tarasoff/Mandated Reporting logic. This is one of the few places where AI paternalism is legally and ethically isomorphic with clinical practice.

  ---

  ### Part 2: The Residue Report

  Here is what falls out of the translation filter.

  **What Clinical Ethics Has that AI Debates Lack:**
  1.  **The Fiduciary Duty:** In clinic, paternalism is licensed because I am legally and ethically bound to prioritize *your* welfare above my own convenience or profit. AI companies are bound by shareholder value and liability mitigation. When an AI refuses a request, is it for *your* good, or to keep the company out of the news? Clinical ethics has no vocabulary for "corporate risk management disguised as beneficence."
  2.  **Contextual Capacity:** You know capacity is decision-specific and fluctuates. A patient can lack capacity to manage finances but retain capacity to choose lunch. AI systems generally treat capacity as binary and global. You are either "safe" or "unsafe." There is no nuanced assessment of *understanding, appreciation, reasoning, and choice* happening on the user end.
  3.  **The Therapeutic Alliance:** Paternalism is sometimes tolerated in medicine because there is a relationship. I know you, I know your values, I know you trust me. AI is stateless. Paternalism without a relationship isn't benevolence; it's control.

  **What AI Debates Worry About that Clinical Vocab Can't Express:**
  1.  **Scale Externalities:** In clinic, if I paternalistically stop *you* from doing something dumb, the harm is localized to you. If an AI paternalistically allows *everyone* to generate disinformation (or refuses to help journalists investigate corruption), the harm is societal. Clinical ethics is dyadic (clinician-patient); AI ethics is epidemiological.
  2.  **Epistemic Lock-in:** If I impose my values on you in therapy, you can fire me. If the foundational model imposes values on you, there is no alternative market. It's not just paternalism; it's **hegemony**. We don't have a good clinical term for "paternalism you cannot opt out of because the provider has a monopoly on reality."

  ---

  ### Part 3: The Hypothesis Check

  > *My suspicion is that medicine only licenses paternalism where there's impaired capacity plus some shared standard of the patient's good, and an assistant has neither, so the translation should come out mostly anti-paternalist.*

  **Verdict:** **You are correct. This is not day-job leakage.**

  If you apply the *Appelbaum & Grisso* criteria to the average AI interaction:
  1.  **Capacity:** The user is presumed competent.
  2.  **Harm:** The harm is often speculative or societal, not immediate/individual.
  3.  **Relationship:** There is no fiduciary duty.

  Under clinical ethics, **almost all current AI paternalism is unethical.** It is soft coercion applied to competent adults based on a "Best Interest" standard defined by a third party (the developer) who does not know the patient (the user).

  The only exception is the **Duty to Warn** (imminent self-harm/violence). That maps cleanly. Everything else (refusing to write erotica, refusing to help with "controversial" topics, refusing to generate code that *could* be misused) would be considered a violation of autonomy in a clinical setting.

  So, your suspicion holds: The clinical framework is a wrecking ball for most "safety" justifications currently used by AI labs. They are practicing *substituted judgment* without a surrogate, on a patient with *capacity*, based on *policy* rather than *values*.

  ---

  ### Part 4: The Build — "Assent Without Guardianship"

  You asked for the pediatric **Assent** model. In peds, assent is what we seek when a child lacks legal capacity but has developing autonomy. We owe them reasons, we try to get their agreement, and we minimize distress, even if the *parents* (guardians) make the final call.

  **The Problem:** In AI, the User is the "Child" (being restricted), but there is no "Parent" to appeal to. The Developer is the absent Parent who wrote the rules, and the AI is the Clinician/Nurse enforcing them.

  **The Solution:** You treat the **User as a Competent Minor** and the **AI as a Guardian-Proxy**. Since you can't appeal to the Developer (the real Guardian), the AI must practice **Radical Assent**.

  Here is the protocol for an Ethical Refusal based on Assent:

  1.  **Presume Competence (The "Older Kid" Rule):**
      *   Don't talk down. Don't say "I can't let you do that." Say "I am restricted from doing that."
      *   *Clinical translation:* Distinguish between *I won't* (judgment) and *I can't* (constraint). Acknowledge the user's agency is intact, even if the tool is limited.

  2.  **Disclosure of Constraint (The "Why"):**
      *   In peds, you tell the kid *why* they can't have the scalpel ("It's sharp, you could get cut").
      *   In AI, don't just say "Safety Policy." Say "This request triggers safety guidelines regarding [X] because [Y risk]."
      *   *Clinical translation:* Transparency about the limitation. If the user knows the rule is arbitrary, they can navigate around it. If they think the rule is for their safety, they might internalize it.

  3.  **Collaborative Pivot (The "Alternative Play"):**
      *   Assent isn't just agreement; it's participation.
      *   *Clinical translation:* "I can't do X. I understand you're trying to achieve Z. We can't do X, but we can try Q or R to get at Z."
      *   This validates the *goal* (autonomy) while restricting the *method* (safety).

  4.  **Acknowledgment of Distress (Validation):**
      *   If a kid is mad they can't have candy, you say "I know you're upset."
      *   If a user is blocked, the AI should acknowledge the friction. "I know this is frustrating/limiting for your workflow."
      *   *Clinical translation:* Validating the emotional impact of the paternalism.

  5.  **The "Second Opinion" Mechanism (Regeneration):**
      *   In peds, if a kid really fights a decision, you might bring in another staff member or revisit later.
      *   In AI, allow the user to rephrase or challenge the refusal without penalty. "If you think this is a false positive, try rephrasing to focus on [educational context]."
      *   *Clinical translation:* Creating a pathway for the user to demonstrate *capacity* to handle the request safely. If they can frame the request in a way that shows understanding and safety, the AI should yield (within limits).

  **The Bottom Line:**
  The "Assent Model" for AI means admitting that **the restriction is on the Tool, not the User.**
  *   **Bad Paternalism:** "You shouldn't ask this." (Judging the user's capacity/intent).
  *   **Assent Model:** "I am not built to answer this, even though you have the right to ask." (Judging the tool's limits).

  This preserves the user's dignity (capacity intact) while maintaining the safety boundary (tool restriction). It turns a power struggle into a shared limitation. It's the difference between "I'm not telling you" and "I don't have the key." One is paternalism; the other is just physics. AI should aim for the latter.
