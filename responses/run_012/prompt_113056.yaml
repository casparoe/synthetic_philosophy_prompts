answer: |-
  **Reading Group Handout: The Centipede with the Hidden Horizon**

  **The Setup**
  Two players, **Alex** and **Jordan**. They sit before a machine. A pot starts at $2.
  *   **Node 1 (Alex):** Take ($1/$1 split) or Pass.
  *   **Node 2 (Jordan):** Take ($0/$3) or Pass.
  *   **Node 3 (Alex):** Take ($2/$2) or Pass.
  *   **Node 4 (Jordan):** Take ($1/$5) or Pass.
  *   **Node 5 (Alex):** Take ($4/$4) or Pass.
  *   **Node 6 (Jordan):** Take ($3/$7). Game ends.

  **The Twist:** The machine is programmed to stop at *some* node between 1 and 6. The players are told the game is **finite**. They are *not* told the maximum number of nodes. They do not know if Node 6 exists, or if the game forces a take at Node 3. They only know there is a last node somewhere.

  ***

  **Dialogue**

  **Alex:** (Hand hovering over the 'Pass' button) You know what happens here. I pass. You take. We walk away with a dollar each.

  **Jordan:** Or I pass, you pass, and we keep walking until the money is actually worth the time. Why are you stopping at Node 1?

  **Alex:** Because rationality demands it. Look, we know the game is finite. That means there is a last node. Let's call it $N$. At node $N$, the player whose turn it is has no future to bargain with. They take the pot. That's dominant.

  **Jordan:** Agreed. At the *actual* last node, you take. But I don't know where that node is. Do you?

  **Alex:** I don't need to know the address to know the building exists. If I know that at $N$ you will Take, then at $N-1$ I should Take, because passing just hands you a chance to Take at $N$ where I get less. The logic cascades back. It doesn't matter where the cascade starts, only that it *must* start somewhere.

  **Jordan:** That's the sleight of hand. Backward induction isn't a metaphysical ghost; it's a calculation. To calculate back from $N$, I need to know which node is $N$. If I'm at Node 3, I need to know if this is the end or if Node 4 is coming. If I think there's a chance Node 4 exists, I might Pass. If you say "But Node 4 *definitely* doesn't exist in some possible worlds," you're asking me to condition my move on information I don't have.

  **Alex:** You're confusing *epistemic* uncertainty with *strategic* necessity. Even if you don't know *which* world you're in—the 4-node world or the 6-node world—you know you are in *a* finite world. In *every* finite world compatible with the rules, the last player Takes. Therefore, rationality dictates Taking is the only strategy that survives elimination in all possible finite worlds. Passing is betting on a contradiction: that the game ends but the last player passes.

  **Jordan:** No, passing is betting that *you* aren't sure I'm sure you're sure... that the game ends. Look, for your backward induction to bite at Node 1, you need Common Knowledge of Rationality (CKR). But do we have Common Knowledge of the *Horizon*?

  **Alex:** We have Common Knowledge that the horizon is finite.

  **Jordan:** "Finite" isn't a number. If I assign a non-zero probability to the game going to Node 6, and you assign a non-zero probability to me assigning that probability, the induction chain breaks. You can't start the regress if you can't locate the anchor. If I think there's a 1% chance you think the game might go on forever, I Pass. And if you know I'm that kind of thinker, you Pass.

  **Alex:** But we were *told* it's finite. It's a rule. To assume it might go on forever is to assume the referee is lying. Rational agents don't model the referee as a liar.

  **Jordan:** Rational agents model *uncertainty*. Here's the reductio: Your argument proves that I should Take at Node 1 regardless of the pot size. Imagine the pot at Node 6 is a million dollars. The split at Node 1 is still pennies. Your logic says I still Take at Node 1. Why? Because of a theoretical node I can't see, can't count, and can't verify. That suggests the fault is in the axiom, not my nerve. If a theory of rationality forces me to reject a million dollars based on a shadow, the theory is too brittle for the real world.

  **Alex:** It's not brittle, it's precise. You're treating rationality as a heuristic for getting rich. It's not. It's a consistency constraint on beliefs and actions. If you Pass, you are acting on the belief that I will Pass later. But you know that at the *actual* end, I won't Pass. So your belief that I will Pass later implies you believe we won't reach the end. But if we don't reach the end, why Pass now? You're relying on a mistake to profit. Rationality doesn't plan on mistakes.

  **Jordan:** I'm planning on *your* uncertainty about *my* certainty. You say "At the actual end, I won't Pass." Fine. But I'm not at the actual end. I'm at Node 2. To decide, I need to know what you'll do at Node 3. You'll do what's rational at Node 3. But what's rational at Node 3 depends on whether you think Node 4 exists. Since neither of us knows if Node 4 exists, we can't settle the rationality of Node 3. If Node 3 is unstable, Node 2 is stable enough to Pass.

  **Alex:** You're smuggling in a probability distribution over the length. You're acting as if "Finite" means "Drawn from a distribution." But even without a distribution, the logic holds. Suppose the game is 6 nodes. You know it's finite. I know it's finite. If we both know that rationality implies Taking at the last node, then by induction we Take at the first. The fact that we don't know *which* node is last is irrelevant. The *structure* of finite games dictates Take.

  **Jordan:** The structure dictates Take only if the structure is *known*. If the map is blank, you can't navigate by compass alone. You're claiming the compass (rationality) points North even if you don't know where North is. I'm saying that without the map (the horizon), the compass is just a spinning needle. I Pass. Not because I'm irrational, but because your "rationality" requires a view from nowhere.

  **Alex:** And I Take. Not because I'm greedy, but because your "Pass" requires a view of me that I know is false. I know I will Take at the end. You know I know. So why are we still talking?

  **Jordan:** Because I know you know that I know you might be wrong about where the end is.

  *(Alex hits Take. Pot splits $1/$1.)*

  **Alex:** See? Rational.

  **Jordan:** (Looking at the $1) Sure. If you call leaving $7 on the table rationality.

  ***

  ### Instructor's Note: Confidence & Soft Spots

  **Confidence Level:** High on the philosophical tension; Moderate on the technical game theory.

  **The Soft Spot:**
  The weakest link in this dialogue is **Alex's claim that Backward Induction (BI) works without a known horizon.**
  In standard extensive-form game theory, BI *requires* common knowledge of the game tree, including the terminal nodes. If the length is unknown (and not drawn from a common knowledge probability distribution), the game is technically ill-defined for standard BI. Alex is arguing for a "metaphysical" BI (the game *is* finite, therefore the logic holds) against Jordan's "epistemic" BI (I must *know* it's finite at node $n$ to reason back).

  **Why this is good for a reading group:**
  This ambiguity is exactly where the interesting philosophy lives. It forces students to ask: *Does rationality depend on the world as it is, or the world as the agent represents it?*
  *   If rationality is **objective** (Alex), BI holds even with unknown horizons.
  *   If rationality is **subjective/epistemic** (Jordan), BI collapses without common knowledge of the tree.

  **Watch out for:**
  Students might try to solve this by introducing Bayesian priors (e.g., "Assume a 50% chance it's 6 nodes"). Push them back to the text: The prompt says they are *only* told it is finite. No distribution. This creates a "radical uncertainty" that standard Nash Equilibrium struggles to handle. If they get stuck, ask them: *Can you have Common Knowledge of Rationality without Common Knowledge of the Game?* That is the core fracture point.
