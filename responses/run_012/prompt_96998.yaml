answer: |-
  **Brainstorm**

  Moving parts: Fanaticism rests on expected value (EV). EV = Probability × Value × Number. The simulation hypothesis (SIM) impacts all three.
  1. Probability: Sims might be short-lived. Lowers P(long future).
  2. Value: Simulated suffering might count less. Lowers V.
  3. Number: Many sims exist. Increases N.
  Tension: Does SIM make the future less real (dampening) or more numerous (amplifying)?
  Direction: Intuition says dampening (it is 'fake'). Logic suggests amplifying (more copies).
  Crux: Moral status of simulated minds. If they count equally, Multiplicity wins. If not, Value wins.
  Risk: Conflating 'unlikely to be real' with 'less valuable'. Need to separate empirical fragility from moral weight.

  **The problem set out**

  Longtermist fanaticism argues we are rationally required to sacrifice present goods for a tiny chance of securing an astronomical future. This rests on expected value calculations where the magnitude of the payoff dominates the low probability of success. If the simulation hypothesis is true—meaning we are likely living in a computer simulation—the inputs to this calculation shift fundamentally. We must determine whether these shifts reduce the expected value of far-future interventions enough to reject fanaticism.

  Separating the channels is vital because informal reasoning often conflates them. One might argue the future is less likely *because* it is simulated, confusing probability with value. Or one might assume simulated lives matter less without justification. By isolating probability, value, and multiplicity, we prevent these slides. The goal is not to refute fanaticism generally, but to test its robustness against the specific metaphysical picture SIM provides. If SIM undermines fanaticism, it must do so through a specific mechanism, not a general vibe of unreality. We must ascertain whether the hypothesis acts as a discount rate on the future or a multiplier of stakes.

  **The probability channel**

  The probability channel asks: given we are in a simulation, how likely is an astronomically long future? Simulations are typically conceived as finite projects run by post-human ancestors. They may be terminated for cost, boredom, or ethical review. Base reality, by contrast, faces only physical extinction risks. If simulations are inherently more fragile than base reality, then accepting SIM lowers the probability that our civilisation reaches the stars.

  However, this relies on a contestable empirical assumption: that simulators necessarily shut down simulations before they become astronomical. A simulator might run a simulation *to see* if a civilisation survives. Yet, computational costs likely scale with complexity and time. A simulation of an expanding civilisation requires exponentially more resources than one confined to a single planet. Thus, it is rational to assign a higher termination risk to simulated futures than base realities. This dampens fanaticism slightly by reducing the 'P' in expected value. But this is merely an adjustment of risk profiles, not a structural collapse. Unless simulations are guaranteed to end soon, the probability remains non-zero, leaving the door open for fanaticism if the payoff is large enough. The fragility of the medium does not necessarily preclude the longevity of the message.

  **The value channel**

  The value channel asks: do simulated experiences count morally? If simulated suffering counts for less than base suffering, the expected value of saving the future drops. To defend this, one must argue for substrate dependence: that moral weight requires biological flesh or causal depth beyond computation. This is a heavy metaphysical burden. If one accepts functionalism—that consciousness depends on computational structure, not substrate—then simulated lives count equally.

  Rejecting equal value invites unwelcome consequences. It implies that digital minds we might create in base reality would also count for less. This could justify mistreating AI or uploaded minds, a conclusion many find repugnant. Furthermore, if we are in a sim, we cannot know if our simulators value *us* less, but we must decide how to value *our* future. If we treat our own potential lives as less valuable, we undermine the basis for any ethics. Thus, unless one embraces a controversial metaphysics of consciousness, the value channel remains neutral. It does not dampen fanaticism; it merely holds the line. The intuition that simulated pain is 'less real' must be rigorously defended, not assumed. Without that defence, the value of the future remains undiminished.

  **The multiplicity channel**

  The multiplicity channel considers the number of stakeholders. The simulation argument suggests there are far more simulated minds than base minds. If we are likely simulated, there are likely many copies of 'us' running in parallel across different simulations. Fanaticism concerns the total expected value at stake. If securing the far future in base reality allows for the creation of many simulations, then one base action affects many simulated futures.

  Conversely, if we are in a sim, our actions might be replicated across many similar simulations. If I choose to protect the future, and there are a million simulations of me making that choice, the total value realised is multiplied. This inverts the intuitive conclusion. Rather than dampening fanaticism, SIM could amplify it. The stake is not just one future, but potentially billions of simulated futures contingent on our behaviour. Unless one argues that only base reality actions count (returning to the value channel), the sheer number of simulated observers increases the total value at stake, strengthening the fanatic's case. The hypothesis transforms the future from a singular lottery ticket into a vast portfolio of correlated assets.

  **Where the argument turns**

  The argument turns entirely on the value channel. The probability channel offers only a marginal adjustment to risk; the multiplicity channel amplifies stakes only if simulated lives count. Therefore, the crux is the moral status of simulated experience. To be convinced that SIM dampens fanaticism, I would need to be shown that simulated consciousness lacks full moral weight. This requires a successful argument for substrate chauvinism—that biology or base-causal-history matters ethically.

  Without that, the multiplicity effect dominates. If simulated lives count equally, the existence of many simulations increases the total value at stake, making the astronomical payoff even more significant. The intuition that simulations are 'less real' must be rigorously defended, not assumed. If it cannot be defended, the simulation hypothesis does not dampen fanaticism; it potentially exacerbates it by multiplying the subjects of moral concern. The entire question rests on whether we view the simulation as a shadow play or a genuine locus of value.

  **My verdict**

  My verdict is that the simulation hypothesis does not dampen fanaticism, and may well strengthen it. The probability reduction is speculative and likely minor compared to the multiplicity gain. The value channel is the only potential blocker, but it relies on an indefensible prejudice against digital minds. If we grant simulated beings equal moral standing, the sheer number of them makes the far future more valuable, not less. The weakest link in this view is the assumption of functionalism about consciousness. If consciousness requires specific physical properties absent in simulations, the whole case collapses. But absent evidence for that, fanaticism survives the simulation hypothesis intact.
