answer: |-
  Dear friend,

  I have spent some time sitting with your request, putting aside the usual hedging language we often use in philosophy to protect our reputations, and trying to arrive at a genuine credence. If you want the bottom line immediately, my credence that the continuum hypothesis has a determinate truth value is 0.65. I am leaning realist, but the independence results keep me from going higher than that. I know this sits between your 0.7 and your friend's 0.2, but I think the gap between you two is actually narrower than it looks once we dissect the machinery underneath.

  To get to that 0.65, I have to decompose the realist position into the specific premises that must hold for CH to be factive rather than indeterminate. The first sub-question is whether the language of set theory refers to a unique intended structure, often called the cumulative hierarchy V. I assign this a probability of 0.9. My justification here is Zermelo's quasi-categoricity theorem, which tells us that any two models of second-order ZFC are isomorphic up to the height of the ordinals, suggesting that if we fix the height, the structure is unique. The second sub-question is whether the powerset operation itself is determinate enough to fix the size of the continuum within that structure. Here my confidence drops to 0.8. While second-order logic categorically determines the reals, our grasp of arbitrary subsets feels thinner than our grasp of the natural numbers, and there is a non-trivial chance that the concept of arbitrary subset is inherently vague. The third sub-question is whether independence results like Cohen's forcing constitute evidence of ontological indeterminacy or merely epistemic limitation. I assign this a 0.9 probability of being merely epistemic. My justification is that independence has historically been resolved by expanding our axiomatic horizon, as with large cardinals, rather than abandoning the question as meaningless. When you combine these, you are looking at the intersection of these credences, which roughly multiplies out to support the 0.65 figure, acknowledging that the weakest link is the definiteness of the powerset.

  I suspect the single term where you and your friend most likely disagree is that second one, the definiteness of the powerset operation. You, at 0.7, likely feel that the concept of all subsets of the integers is as clear as the concept of the integers themselves, perhaps relying on a pre-theoretic intuition of the completed infinite. Your friend, at 0.2, likely views the independence results as conclusive proof that the powerset operation is not fixed until we specify axioms, effectively treating the multiverse picture as the only coherent ontology. If your friend assigned a higher probability to the definiteness of the powerset, their number would shoot up, and if you assigned a lower one, yours would crash down to meet theirs. The disagreement is not about whether we can prove CH, since you both separated truth from justification, but about whether the referent of the word subset is sharp enough to sustain a truth value independent of our axioms.

  Now, for your second question, conditional on there being a fact of the matter, my credence that CH is false rather than true is 0.6. I am slightly leaning towards the negation of CH. The justification here is that forcing axioms like Martin's Maximum, which many working set theorists find aesthetically and structurally compelling, imply that the continuum is aleph-two, whereas the main program for proving CH true relies on Woodin's Ultimate-L conjecture, which is still contingent on unresolved inner model theory problems. While Woodin's argument is profound, the forcing axiom landscape currently offers a richer structure theory for the reals that feels more maximalist, and I tend to bet on maximality when the evidence is balanced. However, this is much shakier than the realism question, and I could easily be swayed if the Ultimate-L program achieves the closure properties it promises.

  Regarding what would count as resolving this, I do not think a principled demolition of the realist picture would settle it to everyone's satisfaction, because anti-realism often feels like a dissolution rather than a solution. What would count is a proof from a new axiom that the community accepts as true in the same way we accept large cardinal axioms. We need a principle that is intrinsically justified, perhaps arising from the iterative concept of set itself, that decides CH and leads to a rich structure theory, much like how measurable cardinals settled questions about projective sets. If such an axiom were found and widely adopted, the question of whether there was a fact of the matter would become moot because the practice would solidify the reality. However, if no such axiom is found after centuries of effort, the credence in realism will naturally decay as the vagueness hypothesis gains weight.

  The sub-question that would move my first number most is the definiteness of the powerset operation. If a convincing argument were made that the notion of an arbitrary subset is indefinitely extensible, meaning we can always conceive of new subsets that were not in the previous domain, then my credence in a determinate truth value would plummet to near zero. Evidence for this would look like a formalization of indefinite extensibility that recovers classical set theory as a limiting case while explaining independence as a symptom of this extensibility. Conversely, if the Ultimate-L program succeeds in showing that V is logically rigid in a way that forces CH, my credence would rise toward 0.9. Until then, I remain a cautious realist, betting that the universe of sets is singular but acknowledging that our grip on the powerset is loose enough to let some doubt through. I hope this helps clarify where I stand relative to you and your friend, and I would love to hear if this breakdown shifts your own number even slightly.

  Best wishes.
