  Ok, I want an actual number out of you on this one, not a survey of the literature. Put on your philosopher-of-mathematics hat — the kind who actually knows the forcing machinery and the large cardinal hierarchy, not just the pop-sci version where CH is a fun fact about infinity — and think carefully before you commit to anything. Brainstorm a little first if that helps you get your terms straight.

  Here's the proposition I want your credence on: that the continuum hypothesis has a determinate truth value. I.e. that it is either true or false of the actual universe of sets, rather than being independent in the way the parallel postulate is independent — where the honest thing to say is that there's no fact of the matter, we just pick which structure we want to talk about. Keep that question separate from the different question of whether we'll ever be *justified* in accepting an axiom that decides it; I care about the first one, and I suspect alot of people quietly answer the second and think they've answered the first.

  Then decompose it. I want the sub-questions the number rests on, a rough probability for each, one line of justification each, and how they combine. Things I'd expect to show up: whether set-theoretic language has a determinate enough referent for "all subsets of the reals" to have a fact of the matter at all (the powerset operation seems to be where all the action is, and our grip on it feels thinner than our grip on "all natural numbers"); whether the multiverse picture is right, in which case the question maybe isn't false but ill-posed; conditional on realism, whether the independence results are just a gap we'll close with axioms beyond ZFC — large cardinals, forcing axioms, the Ultimate-L-flavored programs — or whether they're evidence that there was never a single intended structure to close the gap in; and whatever else you think belongs. My own number is about 0.7 and my friend's is about 0.2, so as a bonus tell me which single term the two of us most likely actually disagree about, rather than just disagreeing about the weights.

  Also give me a second number: conditional on there being a fact of the matter, your credence that CH is false rather than true. And tell me what would count as resolving this — a proof from a new axiom that the community accepts as true, a principled demolition of the realist picture, or nothing at all — plus which sub-question would move your first number most and what evidence would shift it.

