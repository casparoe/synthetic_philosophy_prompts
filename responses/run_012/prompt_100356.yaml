prompt: |-
  I am a high school student, and at my school's philosophy club a senior keeps shutting down arguments with the line that calling a claim true adds nothing to the claim; she says this is the deflationary view of truth and she uses it to dismiss my question of whether a moral judgment can be really true rather than merely widely accepted. I want you to separate the precise claims that one-liner could be making, from the trivial to the radical, and tell me which readings are platitudes, which are substantive and defensible, which are false, and which reading she is most likely relying on when she uses it to end my question. Lay the readings out as a menu with a verdict on each rather than settling on one, and for every reading say explicitly whether it would actually support her dismissal of the moral-truth question or whether it leaves that question untouched. The distinctions I would find most useful are these: the difference between a thesis about the word true and a thesis about truth itself; the difference between saying true adds nothing to the content of a claim and saying truth does no explanatory work anywhere; the difference between the claim that true is not a genuine property and the claim that the truth predicate is merely a device for endorsing or agreeing with claims already made; and whether any of these readings apply differently to moral claims than to claims about rocks or arithmetic. Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of my question.
