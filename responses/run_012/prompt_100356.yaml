answer: |-
  The senior is misapplying a linguistic thesis about the word "true" to settle a metaphysical debate about morality, because deflationism generally leaves the question of whether moral claims are objective or merely accepted entirely untouched.

  ### Menu of Readings for "Calling a claim true adds nothing to the claim"

  **1. The Disquotational Equivalence (The Platitude)**
  *   **The Claim:** To say "It is true that P" is logically equivalent to simply saying "P"; the words "is true" cancel out without changing the content.
  *   **Type:** Platitude / Logical Truism.
  *   **Word vs. Property:** This is a thesis about the **word** "true" and its logical function, not about the nature of reality.
  *   **Content vs. Explanation:** This concerns the **content** of the claim; it asserts no change in meaning.
  *   **Verdict:** True and uncontroversial.
  *   **Supports Dismissal of Moral Question?** **No.** If "It is true that murder is wrong" equals "Murder is wrong," the question remains: is "Murder is wrong" a fact independent of human acceptance, or is it just an expression of feeling? This reading leaves that metaphysical question completely untouched.

  **2. The Logical Device Thesis (The Substantive Linguistic Claim)**
  *   **The Claim:** The predicate "true" is not a descriptive adjective like "red" or "heavy," but a logical device used for endorsement, generalization (e.g., "Everything he said is true"), or anaphora.
  *   **Type:** Substantive and Defensible (standard deflationism).
  *   **Property vs. Device:** This claims "true" is not a genuine **property** but a linguistic **device**.
  *   **Verdict:** Defensible; widely held in philosophy of language.
  *   **Supports Dismissal of Moral Question?** **No.** Even if "true" is just a tool for agreement, you can still ask what we are agreeing *about*. We could be agreeing about mind-independent facts or merely coordinating social norms; this thesis does not decide which.

  **3. The No-Substantive-Property Thesis (The Metaphysical Claim)**
  *   **The Claim:** Truth is not a robust, natural property that all true statements share in common (like mass or charge); there is no "essence of truth" to discover.
  *   **Type:** Substantive and Defensible (but controversial).
  *   **Word vs. Property:** This is a thesis about **truth itself** (or the lack thereof as a property).
  *   **Moral vs. Rocks:** Applies globally to arithmetic, rocks, and morals equally.
  *   **Verdict:** Defensible, but debated by correspondence theorists.
  *   **Supports Dismissal of Moral Question?** **No.** Denying that truth is a "robust property" does not deny that moral claims can be correct. You can be a moral realist and a deflationist about truth simultaneously; you just say moral facts don't need a special "truth property" to be real.

  **4. The No-Explanatory-Work Thesis (The Epistemic Claim)**
  *   **The Claim:** The concept of truth does no causal or explanatory work; you cannot explain why a belief succeeded by saying "because it was true," only by citing the specific facts.
  *   **Type:** Substantive and Defensible.
  *   **Content vs. Explanation:** This claims truth does no **explanatory work anywhere**.
  *   **Verdict:** Defensible; central to deflationary theories.
  *   **Supports Dismissal of Moral Question?** **No.** This limits what "truth" can explain, but it does not determine whether moral judgments track reality. It stops you from using "truth" as an explanation, but it doesn't stop you from asking if moral judgments are accurate.

  **5. The Global Anti-Realist Conflation (The Confused Reading)**
  *   **The Claim:** Because "truth" isn't a heavy-duty metaphysical property, no claims (including moral ones) can be "really true" in a way that exceeds social acceptance or utility.
  *   **Type:** False / Category Error.
  *   **Word vs. Property:** Confuses a thesis about the **word** with a thesis about **reality**.
  *   **Verdict:** Philosophically confused; conflates deflationism about truth with error theory or relativism about specific domains.
  *   **Supports Dismissal of Moral Question?** **Yes, but illegitimately.** This is the only reading that shuts down your question, but it does so by smuggling in anti-realism under the guise of deflationism. It assumes that if truth isn't a "substantive property," then objective moral facts cannot exist, which does not follow.

  ### Diagnosis of the Senior's Move
  The senior is most likely relying on **Reading 5 (The Global Anti-Realist Conflation)**. She is taking the deflationary insight that "truth is not a magical property" (Reading 3) and incorrectly inferring that "therefore, moral claims cannot be objectively correct" (Reading 5). This is a non-sequitur. Deflationism is compatible with moral realism (the view that moral judgments can be objectively true); it simply insists that being "objectively true" doesn't require possessing a mysterious property called "Truth." Her use of the one-liner ends the conversation by pretending the metaphysical weight of morality depends on the metaphysical weight of the word "true," when most philosophers treat them as separate issues.
