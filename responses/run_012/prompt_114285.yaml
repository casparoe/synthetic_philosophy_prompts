answer: |-
  The term you are looking for is **teleonomy**.

  While 'teleology' is the broader philosophical category for purpose-driven explanation, it carries baggage of conscious design or mystical ends. **Teleonomy** is the specific term coined (most notably by the biologist Ernst Mayr and the physiologist Colin Pittendrigh) to describe purposefulness that arises from a blind, feedback-driven process rather than a mind.

  However, 'teleonomy' is the label for the phenomenon; the logical machinery that makes it work is known as the **etiological account of function** (or the **selected-effects theory**). To write about this with precision, you should treat teleonomy as the observable pattern and the etiological account as the justification for using it.

  Here is the analysis you require, defining the concept, its edges, and its distinctions.

  ### The Concept: Teleonomy via Selected Effects

  Teleonomy is the attribution of goal-directedness to a trait or behaviour where the 'goal' is not represented in the mind of the organism, but is encoded in its evolutionary history.

  When you say the orchid's petals are arranged *in order to* attach pollen to the moth, you are making a claim about causality. You are not claiming the orchid intends this. You are claiming that the *reason* the orchid possesses this specific petal arrangement today is that ancestors with this arrangement successfully reproduced, while those without it did not.

  The 'purpose' is a shorthand for a historical causal chain. The rationale is real because the history is real. If the trait did not perform that function, it would not be there. This supports counterfactuals: *If* the scent did not dupe the ants, the beetle lineage would have vanished. This explanatory power is what separates teleonomy from mere poetry.

  ### Distinguishing the Phenomenon

  You asked how to distinguish this from four specific categories. Here is how the edges are drawn.

  **1. Versus Mere Metaphor (The Sun 'Wanting' to Set)**
  Metaphorical purpose-language is descriptive only; it does not support counterfactuals. If the sun did not 'want' to set, it would still set. The language adds colour but no causal leverage.
  *   **The Test:** Ask, "If this purpose were not achieved, would the trait disappear?"
  *   **Teleonomy:** Yes. If the gazelle's stotting did not signal fitness, the behaviour would not have been selected for and would not exist.
  *   **Metaphor:** No. The sun's motion is independent of our description of its desires.

  **2. Versus Simple Functional Ascription (The Heart Pumping Blood)**
  This is the subtlest distinction. Saying "the heart's job is to pump blood" is a statement of **causal role**. It describes what the part contributes to the system *now*. Teleonomy is a statement of **proper function**. It describes why the part is *there*.
  *   **The Distinction:** A causal role can be accidental. If a heart murmur happens to vibrate a loose screw back into place, the murmur has a causal role (fixing the screw), but it is not teleonomic. It was not selected for that.
  *   **The Rule:** Teleonomy requires that the effect explains the *presence* of the trait. The heart pumps blood *and* that is why hearts exist. The murmur fixes the screw, *but* that is not why murmurs exist. In your beetle and orchid examples, you are explaining the origin and persistence of the trait, not merely its current operation.

  **3. Versus Invisible-Hand Explanations (Economics)**
  In an economic invisible-hand explanation (e.g., prices rising to clear a market), the outcome is unintended, but the *components* are agents with intentions. Buyers intend to buy; sellers intend to sell.
  *   **The Distinction:** In teleonomy, the components are not agents with reasons. The gene does not intend to replicate; the beetle larva does not intend to be carried. The feedback loop (natural selection) operates on differential survival, not on the reasons of the participants.
  *   **The Rule:** If the constituent parts act on reasons (even if the aggregate outcome is unplanned), it is an invisible-hand explanation. If the constituent parts act on blind mechanisms (chemistry, instinct, physics), it is teleonomy.

  **4. Versus Artefacts (Thermostats and Chess Programs)**
  A thermostat regulates temperature. This looks like teleonomy, but it is **derived teleology**. The purpose exists because a human designer put it there. The rationale belongs to the engineer, not the device.
  *   **The Distinction:** Artefacts have a designer who holds the intention *before* the object exists. Teleonomic traits have no prior designer; the 'intention' emerges *after* the fact through survival.
  *   **The Rule:** Trace the lineage. If the purpose can be traced to a mind that conceived the object, it is artefactual teleology. If the purpose is traced to a history of differential survival without a conceiving mind, it is teleonomy.

  ### Conditions and Boundaries

  **Does it require Natural Selection?**
  Yes. Strictly speaking, teleonomy is bound to evolutionary history. Without a selection history, you have only a causal effect. If a rock happens to block the wind for a plant, the rock is not teleonomic. If a plant grows a leaf to block the wind for its own stem, that is teleonomic. The difference is the history of selection for that trait.

  **Is the Rationale a Fact or a Fiction?**
  It is a fact about history, expressed as a shorthand about purpose. It is not a fiction, provided you understand that "in order to" translates to "was selected because it did". However, it becomes a fiction if you imply the organism represents that goal. The rationale is objective: the trait exists *because* of its consequences.

  **The Case of the Vestige**
  A vestigial trait (e.g., the human appendix or a flightless bird's wing bones) presents a boundary case.
  *   **Analysis:** Under the etiological account, a vestige *retains* its teleonomic definition even when broken. The wing bones are *for* flying, even if they no longer fly, because that is why they were selected.
  *   **Usage:** You may legitimately say "these wings are for flying" about a flightless bird, provided you clarify that this explains their *structure*, not their current *utility*. However, if the trait has been co-opted for a new use (e.g., wings used for display), the teleonomy shifts. A vestige is a teleonomic ghost: the purpose remains in the history, but not in the current function.

  **The Boundary Case: Exaptation and Spandrels**
  To know when you are smuggling in purpose, watch for **exaptations** (traits selected for one purpose, used for another) and **spandrels** (by-products with no selected purpose).

  *   **The Boundary Test:** Did the trait arise *because* it did the thing you are describing?
  *   **Legitimate:** "The moth's proboscis is long *in order to* reach the nectar." (Selected for reaching).
  *   **Illegitimate (Spandrel):** "The male nipple is *in order to* provide symmetry." (It exists as a developmental by-product of female anatomy, not selected for symmetry).
  *   **Borderline (Exaptation):** "Feathers are *in order to* keep the dinosaur warm." (Originally selected for warmth, later used for flight). If you say feathers are *in order to* allow flight in a non-flying dinosaur, you are wrong. If you say they are *in order to* fly in a modern eagle, you are right.

  ### Summary for your Writing

  When you employ this concept, you are using **teleonomic explanation**.

  1.  **Use the language:** You are permitted to use "in order to", "for the sake of", and "designed to".
  2.  **Anchor the logic:** Ensure the purpose you describe is the reason the trait persists. If the trait would exist even without the effect, drop the purpose-language.
  3.  **Check the agent:** Ensure no mind (neither the organism's nor a creator's) is required for the explanation to hold.
  4.  **Watch the history:** If the trait is a by-product or a vestige no longer serving its original end, qualify your language.

  Teleonomy is the reality of design without a designer. It allows you to treat nature as if it had intentions, provided you remember that the intentions are written in the graveyard of the unfit, not in the mind of the living.
