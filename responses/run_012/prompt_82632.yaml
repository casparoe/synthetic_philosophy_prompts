      *   I need to make sure the "Rationale" they write is consistent. I will prompt them: "Write a paragraph for a novel describing this scene. You must explain *why* the crowd is standing there."
      *   Most will invent a purpose (Meeting, Speech, Safety).
      *   Then I reveal: No meeting was planned.
      *   This hits the prompt's requirement: "clean reason-shaped explanation... private rule... mentions none of it."

      *Okay, ready to write.*
      *   Structure:
          1.  Activity Overview.
          2.  Materials.
          3.  Private Rules (The "Micro").
          4.  Facilitation Script (The "Flow").
          5.  The Writing Task (The "Macro").
          6.  The Reveal.
          7.  The Debrief (The "Lesson").
          8.  Predicted Failures.
          9.  The "Generations" Caveat.

      *Refining the "Generations" Caveat:*
      *   In the room, the rationale forms in 5 minutes.
      *   In reality, it takes 50 years for a bureaucracy to forget *why* it does a thing, leaving only the *thing*.
      *   I must tell them: "Today we faked the amnesia. In real life, the amnesia is the history."

      *Let's finalize the Rules for maximum convergence.*
      *   To ensure everyone ends up in the *same* corner.
      *   Rule A (10): "Stand in the corner with the most people." (Herd)
      *   Rule B (4): "Stand in the corner closest to the clock." (Landmark)
      *   *Setup:* Put the clock (or a poster) in one corner.
      *   *Outcome:* Herd goes to where people are. Initially random. But if I seed the "Clock" people first...
      *   *Better:* I (Facilitator) stand in the Corner.
      *   Rule A (10): "Stand near the Facilitator."
      *   Rule B (4): "Stand near at least 3 other people."
      *   *Outcome:* Everyone clusters around me.
      *   *Rationale:* "We are gathering for the Workshop Leader's announcement."
      *   *Truth:* A is following orders. B is following the herd.
      *   *The "Announcement" is the Free-Floating Rationale.* It explains the crowd. It is plausible. It never existed.
      *   *This is the strongest version.*

      *Wait, if Rule A says "Stand near Facilitator," that's too close to "Announcement."*
      *   Change Rule A: "Stand where the floor is quietest." (Assume carpet in one corner).
      *   Change Rule B: "Stand near at least 3 other people."
      *   *Setup:* One corner has a rug.
      *   *Outcome:* A goes to Rug. B goes to where A is.
      *   *Rationale:* "We gathered on the rug for comfort."
      *   *Truth:* A wanted quiet. B wanted people.
      *   *The "Comfort" rationale is the fiction.*
      *   *Okay, I'll use this.* It requires minimal props (a rug or just designating a corner).
      *   *Actually, keep it simpler.*
      *   Rule A (10): "Stand in the North-East corner." (Arbitrary)
      *   Rule B (4): "Stand where there are already people." (Herd)
      *   *Outcome:* Everyone in NE corner.
      *   *Rationale:* "This is the designated assembly point."
      *   *Truth:* A was told. B followed.
      *   *The "Assembly Point" implies a plan. There was no plan, just rules.*
      *   *Wait, if A was told "Stand in NE", that IS a plan.*
      *   *I need NO ONE to know the global goal.*
      *   *Rule A (10):* "Stand near the person wearing the most blue."
      *   *Rule B (4):* "Stand near the person wearing the most red."
      *   *Outcome:* Two clumps? No, I want one clump.
      *   *Okay, I will accept that perfect convergence is hard. I will focus on the **Explanation**.*
      *   *Even if they split, the **Explanation** they write will be singular.* "The group divided by faction."
      *   *Truth:* "I followed the color rule."
      *   *Okay, I'll stick to the **"Herd vs. Landmark"** model.*
      *   Rule A (10): "Stand near the Window."
      *   Rule B (4): "Stand near other people."
      *   *Outcome:* Everyone at the Window.
      *   *Rationale:* "We are looking outside." OR "We are gathering for air."
      *   *Truth:* A wants Window. B wants People.
      *   *The "Looking Outside" is the rationale that belongs to nobody (B doesn't care about outside).*
      *   *This works.*

      *Final check on time:* 75 mins.
      *   Intro: 5
      *   Activity: 10
      *   Writing: 15
      *   Reveal: 10
      *   Debrief: 30
      *   Buffer: 5
      *   Total: 75.
      *   Perfect.

      *Let's write it.*
