      *Idea:* **The Second-Order Coordination Problem.** If we adopt this model, we incentivize agents to *become* the kind of people who can trade (flexible values). But a society of people with flexible values might lack the resolve to resist tyranny. The model selects against the very integrity required to make the model safe.
