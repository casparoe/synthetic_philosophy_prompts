  I'm in a third-year metaphysics module and we've spent the last three weeks on persistence, and our seminar has basically split down the middle. One camp insists that an object is wholly present at every moment it exists — they keep saying things are "multiply located" in time, so the you of this morning and the you reading this are the very same thing, not two things. The other camp says that's incoherent and that a persisting thing is a four-dimensional entity with temporal parts, so the you of this morning and the you now are literally distinct parts of one longer worm. Both sides are convinced the other is just talking past them, and honestly I can't tell anymore whether they actually disagree about the world or only about how to talk. What makes it worse is that our tutor keeps lobbing in cases that don't seem to be in any of the readings and that nobody has a clean answer to: a machine that gets fully dismantled, crated up for a year, and then reassembled from the same parts into the same configuration; and a person whose future self travels back and sits in the same room as her past self. Somebody also claimed you can translate between the two vocabularies sentence by sentence, which if true would mean the whole fight is verbal.

  What I want you to do is write the joint statement that a committed endurantist and a committed perdurantist could actually both put their names to after a semester of good-faith adversarial collaboration. I want the claims they can jointly sign — about what persistence is supposed to explain, about what both agree is a genuine datum, about what neither side gets to assume — then the precise points where they still differ, each one phrased the way its own side would want it phrased rather than the way its opponent would caricature it. Then the cruxes: the sub-questions such that settling one would actually move at least one side, and for each crux the case, argument, or consideration that both sides would agree bears on it, with each side's prediction about it written down in advance. Please make it say something about the dismantled-and-reassembled case and the time-travel case specifically, and please say outright whether any part of the dispute (I suspect the bit about tensed predicates, and maybe the bit about whether "wholly present" can even be cashed out) turns out to be merely verbal, and if so which part. If a third position like stage theory is lurking in the background, say where it fits rather than pretending it's not there. Don't bother with reading lists or who said what where — I just want the substance.

  Format it as a numbered agreed-claims section followed by a disagreements table with columns for the crux, the neutral statement of the disagreement, each side's position in its own preferred wording, and each side's prediction. After that, end with a final line that reads \answer{...} and contains just a short label for the single crux you think both sides would agree actually bears on the dispute, or \answer{none} if you conclude there isn't one.
