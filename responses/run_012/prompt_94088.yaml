answer: |-
  You have asked for the specification of the tool, not a demonstration of its use. You want the blueprint of the lens, not the picture it produces. This is the correct starting point. The debate in the philosophy of biology is often obscured by advocates selling the virtues of their preferred account while hiding the costs.

  Below are the desiderata for a theory of biological function, organized by logical category. I have integrated your cases, added necessary distinctions you omitted, and flagged where your intuitions may reflect specific theoretical commitments rather than neutral data.

  ### I. The Desiderata of Biological Function

  #### 1. The Normativity Condition (The Malfunctioning Heart)
  *   **The Requirement:** The theory must distinguish between a trait's *actual contribution* and its *normative standard*. It must explain how a trait can fail to perform its function while retaining that function.
  *   **The Case:** A heart that fibrillates does not pump blood. If function were defined solely as "what the trait does," the fibrillating heart would have the function of fibrillating. A theory must account for the fact that we call this a *failure*.
  *   **Status:** **Non-Negotiable.** Without this, "function" collapses into "effect," and the concept loses its explanatory power in physiology and medicine.

  #### 2. The Specificity Condition (The Byproduct/Spandrel)
  *   **The Requirement:** The theory must not be panfunctionalist. It must provide criteria for denying function to traits that are mere architectural consequences or side-effects, even if those side-effects are beneficial.
  *   **The Case:** The redness of blood is a side-effect of hemoglobin; it has no function, even if it incidentally signals health to a mate. A theory that assigns function to every causal effect renders the term vacuous.
  *   **Status:** **Non-Negotiable.** This is the constraint that prevents the theory from becoming a description of physics rather than biology.

  #### 3. The Historical Sensitivity Condition (Vestigial Traits & Exaptation)
  *   **The Requirement:** The theory must specify the relationship between a trait's history and its current status. It must deliver a verdict on whether history is *constitutive* of function or merely *evidential*.
  *   **The Case:**
      *   *Vestigial:* Whale pelvic bones. Do they have a function (current structural support?), a former function (anchoring hind limbs?), or no function?
      *   *Exaptation:* Feathers. Did they acquire a new function (flight) only when selected for it, or when they first contributed to flight? Can they have two functions simultaneously (warmth + flight)?
  *   **Status:** **Non-Negotiable (with caveats).** The theory must take a stance. It cannot remain agnostic. However, *which* stance it takes determines its type (Etiological vs. Causal-Role).

  #### 4. The Novelty Condition (The New Variant)
  *   **The Requirement:** The theory must determine whether a trait can possess a function prior to a history of selection for that trait.
  *   **The Case:** A mutation arises that confers immediate resistance to a new toxin. It has not yet been selected (no history). Does it have the function of detoxification immediately?
  *   **Status:** **Prejudice Alert.** Your intuition ("ordinary speech... happy to say it has a function") leans toward the **Causal-Role** account. The **Etiological** account insists this is category error; it has *utility*, but not *function*, until selection acts. A theory must resolve this, but your demand that it match ordinary speech is a preference, not a logical necessity. Ordinary speech is often philosophically loose.

  #### 5. The Neutrality Condition (Drift)
  *   **The Requirement:** The theory must account for traits fixed by random drift that currently contribute to fitness.
  *   **The Case:** A protein variant fixes in a population by chance. It stabilizes a membrane. Is this its function?
  *   **Status:** **Constraint.** If the theory requires selection history (Etiological), drift-traits have no function. If the theory requires current contribution (Causal-Role), they do. The theory must not contradict the biological reality that drift exists, but it *may* conclude that drift-traits lack biological functions.

  #### 6. The Scope Condition (Artifacts, Medicine, and Biology)
  *   **The Requirement:** The theory must declare its domain. Is "biological function" a subset of a general "functional" concept (covering clocks and hearts), or is it sui generis?
  *   **The Case:** A broken clock vs. a diseased heart.
  *   **Status:** **Preference.** You ask if the theory *must* cover these alongside evolved traits. **It does not.** In fact, most robust theories of *biological* function fail when applied to artifacts, and vice versa. Demanding a unified theory of artifacts and biology is a metaphysical preference (Unified Functionalism), not a biological necessity. A theory that quarantines biological function is not deficient on that account alone.

  #### 7. The Explanatory Condition (Missing from your list)
  *   **The Requirement:** Ascribing a function to a trait must license an explanation of the trait's presence or persistence.
  *   **The Case:** If we say "The heart's function is to pump," this should help explain why hearts are there. If the function ascription does not connect to the trait's existence (either via development or evolution), it is merely a label.
  *   **Status:** **Non-Negotiable.** Function talk in biology is inherently explanatory. A theory that severs function from explanation is merely taxonomic.

  #### 8. The Level Condition (Missing from your list)
  *   **The Requirement:** The theory must specify the level of organization at which function is ascribed (gene, cell, organism, group).
  *   **The Case:** Selfish genetic elements. They function to replicate themselves, often harming the organism. Does the theory allow function at the gene level that contradicts function at the organism level?
  *   **Status:** **Constraint.** The theory must be compatible with multi-level selection theory. It cannot assume the organism is the sole locus of function.

  ---

  ### II. The Prejudice Check

  You asked where you have smuggled in a prejudice rather than a genuine demand. There are two significant locations:

  1.  **The Novelty Intuition:** You wrote, *"In ordinary biological speech we are often happy to say it has a function already."*
      *   **The Prejudice:** You are privileging *current utility* over *historical origin* as the definition of function. This is the core commitment of the Causal-Role account. An Etiological theorist will argue that ordinary speech is imprecise here, confusing "what it is good for" (utility) with "what it is for" (function). If you make this a non-negotiable requirement, you have effectively disqualified the Etiological account by fiat, not by argument.
  2.  **The Unified Scope:** You asked if the theory *must* cover artifacts and medicine alongside evolved traits.
      *   **The Prejudice:** You are assuming there is a single concept of "function" underlying all these domains. Many philosophers argue biological function is natural (selection-based) while artifact function is intentional (design-based). Demanding a unified theory forces the account to be abstract enough to cover clocks, which may weaken its ability to handle the specifics of drift or exaptation in biology.

  ---

  ### III. The Incompatibility Matrix

  You asked to flag any subset of requirements that cannot be satisfied together. **This is the most critical part of your request.** There is a tension that no current theory resolves perfectly.

  **The Tension: Normativity vs. Novelty**
  *   **Requirement A (Normativity):** To explain malfunction, function must be grounded in a standard independent of current performance (usually history/selection).
  *   **Requirement B (Novelty):** To account for new traits, function must be ascribable before a history of selection exists.
  *   **The Conflict:**
      *   If you ground function in **History** (to satisfy Normativity/Malfunction), you cannot ascribe function to **Novel Traits** (violating Novelty).
      *   If you ground function in **Current Contribution** (to satisfy Novelty), you struggle to explain **Malfunction** (a trait doing nothing still has a function?) and you risk **Panfunctionalism** (violating Specificity).

  **The Verdict:** You cannot have a theory that perfectly satisfies the intuition that "novel traits have functions immediately" *and* the intuition that "malfunctioning traits retain their function despite not working," without introducing complex dualisms or hybrid accounts. **The list itself is the result:** these two demands pull in opposite directions.

  ---

  ### IV. The Verdict on Non-Negotiables and Exclusion

  **1. Which requirements are non-negotiable?**
  *   **Normativity (Malfunction):** If a theory cannot distinguish success from failure, it is not a theory of function.
  *   **Specificity (No Panfunctionalism):** If a theory assigns function to every effect, it is not a theory of function.
  *   **Explanatory Power:** If function ascription does not explain the trait's presence, it is descriptive labeling, not functional analysis.

  **2. Which are preferences of a particular camp?**
  *   **Immediate Function for Novel Traits:** This is a Causal-Role preference.
  *   **Unified Scope (Artifacts + Biology):** This is a General Functionalist preference.
  *   **Function requires Selection:** This is an Etiological preference.

  **3. Which single requirement does the most to exclude candidate theories?**
  *   **The History Condition:** *"Does the trait require a history of selection to have a function?"*
      *   If **Yes**: You exclude Causal-Role accounts and Organizational accounts. You solve Malfunction well, but struggle with Novelty and Drift.
      *   If **No**: You exclude strict Etiological accounts. You solve Novelty well, but struggle with Malfunction and Specificity.
      *   This is the sharpest knife. It cuts the field in half.

  **4. Is there room for a third kind of account?**
  *   **Yes.** There is a growing class of **Organizational (or Systemic) Accounts**.
  *   **How they work:** They ground normativity not in *history* (like Etiological) nor in *analytic input* (like Causal-Role), but in the *self-maintaining organization* of the system. A trait has a function if it contributes to the maintenance of the system that produces the trait.
  *   **Do your requirements allow them?**
      *   They handle **Malfunction** well (a part fails to maintain the system).
      *   They handle **Novelty** better than Etiological (if the trait immediately contributes to self-maintenance, it can have a function), though they still require the trait to be part of a self-producing cycle.
      *   They handle **Artifacts** poorly (clocks don't self-reproduce), which conflicts with your Scope preference but satisfies biological specificity.
  *   **Conclusion:** Your desiderata, specifically the demand for Normativity without Panfunctionalism, leave room for Organizational accounts. However, if you insist on the **Unified Scope** (Artifacts + Biology) and **Immediate Novelty** without any historical or systemic constraints, you force a choice between Etiological and Causal-Role, and likely find both wanting.

  ### Summary Specification
  To count as a theory of biological function, an account must:
  1.  **Ground Normativity:** Explain how "ought" emerges from "is" (Malfunction).
  2.  **Limit Extension:** Prevent every effect from counting as a function (Specificity).
  3.  **Declare Historical Dependence:** Explicitly state whether history is necessary or contingent.
  4.  **Align with Evolutionary Mechanics:** Be compatible with drift, pleiotropy, and multi-level selection.

  If a theory fails (1) or (2), it is not a theory of function. If it fails (3), it is incomplete. If it fails (4), it is biologically inadequate. The tension between (1) and the intuition behind Novelty is the price of admission; no theory pays it without cost.
