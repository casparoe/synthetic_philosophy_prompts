      *   Therefore, you cannot gain an advantage in *communication* or *prediction* simply by rigging the machine, unless the receiver already knows you rigged it (which implies shared background knowledge).
      *   If shared background knowledge exists, that *is* the prior.
      *   So, SI + UTM choice = Formalization of Background Knowledge.
      *   This makes it non-arbitrary *relative to the agent's context*.

