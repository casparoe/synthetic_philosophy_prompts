      *   **User's Stance:** Rejects conclusion (7). Wants to keep (3) (the construction is valid) and the Invariance Theorem. Is skeptical of standard convergence results ("constant" matters in finite samples). Wants to know which step to reject, why it's persuasive, the cost of rejection, and what survives of non-arbitrary simplicity.
