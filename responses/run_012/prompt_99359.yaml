prompt: |-
  I'm in a philosphy of mind reading group and we spent a session on Moore's paradox. I get the basic weirdness of saying 'It's raining, but I don't believe it's raining,' but I want a real explanation of what the weirdness consists in, not just the label. Could you lay out the conceptual issue for me? Specifically, is the absurdity semantic, pragmatic, or something about the first-person expression of belief? I want the difference between the omissive version ('P but I don't believe P') and the commissive version ('P but I believe not-P') spelled out, and why the second sometimes feels worse or at least different. I keep getting tripped up on the beleif part in particular.

  Then I get confused when you embed the sentence. 'If P, then I don't believe P' and 'It's possible that P and I don't believe P' sound much less bad than the flat conjunction, so what does that tell us about where the paradox comes from? Does it survive when you swap 'believe' for 'know' or 'am certain'? Does it generalize to desire or intention—'P, but I hope not-P' or 'I'm going to do P, but I don't intend to'? And what about credence: can an agent have a high credence in P and also a high credence that it has a low credence in P, or is that a different kind of incoherence? I'm also curious whether the paradox can be used to argue for a transparency account of self-knowledge, where I answer 'Do I believe P?' by looking outward at whether P, or whether that account just relocates the puzzle.

  I'd like a careful map of the main positions and the arguments for each, with some toy examples and a honest assessment of which parts are genuinely puzzling versus which are just features of assertion. Also, if you can, say what a functionalist or Bayesian model of belief would have to say about the Moorean sentence—can such a model even represent an agent that believes P and believes that it doesn't believe P, or is the paradox a constraint on any adequate theory of belief? I don't need citations or reading lists; I just want the conceptual terrain explained in a way that a model without web access could actually work through.
