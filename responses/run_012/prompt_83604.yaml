answer: |-
  This is a classic philosophical muddle, and your intuition is correct: the sentence "pushpin is as good as poetry" is doing too much work for five words. It conflates metaphysics, phenomenology, and ethics. When people argue past each other here, it's because they are reading different layers of the claim.

  Here is the menu of distinct theses that sentence could be expressing, ranked from trivial to radical, followed by the strategic analysis of who needs what, the heterogeneity problem, and the dopamine red herring.

  ### The Menu of Theses

  **1. The Phenomenological Claim (Qualitative Monism)**
  *   **The Thesis:** The *felt experience* of enjoying pushpin is identical in quality to the *felt experience* of enjoying poetry; the only difference is intensity or duration.
  *   **Status:** **False.** Introspection and neuroscience suggest otherwise. The texture of solving a puzzle feels different from reading a sonnet.
  *   **Role:** This is the straw man. It is the easiest target for the anti-hedonist, but no sophisticated hedonist needs to hold it.

  **2. The Commensurability Claim (Metric Monism)**
  *   **The Thesis:** Despite feeling different, all pleasures can be translated into a single common currency of "value units" (utils). There exists a conversion rate where $X$ amount of pushpin-pleasure equals $Y$ amount of poetry-pleasure.
  *   **Status:** **Substantive.** This is required for any utilitarian calculus to function mathematically. It is not obviously false, but it is not a platitude either; it requires a theory of value that allows for trade-offs between incommensurable goods.
  *   **Role:** This is the engine of the view. If you deny this, you can't do the math hedonism promises.

  **3. The Normative Claim (Axiological Exclusivity)**
  *   **The Thesis:** If the quantity of pleasure is equal, no other property (truth, beauty, virtue, complexity) can break the tie. Pleasure is the *sole* good-making property.
  *   **Status:** **Substantive (The Core).** This is the actual definition of ethical hedonism. It says pleasure is the *only* thing that matters intrinsically.
  *   **Role:** This is the claim the hedonist *must* accept to be a hedonist, and the claim the anti-hedonist *must* attack to defeat hedonism.

  **4. The Motivational Claim (Psychological Hedonism)**
  *   **The Thesis:** Humans are psychologically constructed such that we *in fact* pursue pushpin and poetry for the exact same reason (to maximize pleasure).
  *   **Status:** **Debatable/False.** People often pursue things out of duty, habit, or spite, even when it reduces net pleasure.
  *   **Role:** Often smuggled in to support the Normative Claim ("We ought to pursue pleasure because that's all we *can* pursue"), but logically distinct.

  **5. The Deflationary Claim (Functionalism)**
  *   **The Thesis:** "Pleasure" is just a label we slap on any state that an organism is disposed to seek or reinforce. There is no "common quality" other than "being sought."
  *   **Status:** **Trivially True (Tautological).** If pleasure is defined as "whatever is pursued," then obviously pushpin and poetry are equal if pursued equally.
  *   **Role:** This saves hedonism from refutation but risks making it empty. If "pleasure" just means "whatever you value," then "you ought to maximize pleasure" means "you ought to maximize whatever you value," which is useless advice.

  ---

  ### The Strategic Map: Who Needs What?

  **The Anti-Hedonist (The Reductio)**
  To make the *reductio* land ("Look how absurd!"), the anti-hedonist needs to conflate **Thesis 1 (Phenomenological)** with **Thesis 3 (Normative)**.
  *   They want you to think that saying "pushpin is as good as poetry" means "Reading Shakespeare feels exactly like playing a mobile game."
  *   If they can force you to admit Thesis 1, they win on intuition (because it's false).
  *   If they can force you to admit Thesis 3 without Thesis 1, they switch tactics to "The Swine Objection" (that this reduces human life to base satisfaction).

  **The Hedonist (The Defense)**
  To keep the view viable, the hedonist **must accept Thesis 3 (Normative)** but **should deny Thesis 1 (Phenomenological)**.
  *   The smart hedonist says: "Of course they feel different. But the *reason* we value both is that they are pleasant. The 'goodness' is in the pleasantness, not the content."
  *   **The Trap:** If the hedonist retreats too far toward **Thesis 5 (Deflationary)** to avoid the heterogeneity problem, they survive the critique but lose the ability to criticize anyone. If a Nazi gets pleasure from cruelty, Thesis 5 says "That's a pleasure, so it counts." Thesis 3 allows the hedonist to say "Yes, it counts, but we must maximize total pleasure, and cruelty usually reduces the victim's pleasure more than it adds to the perpetrator's."

  **The Verdict:** The sentence "pushpin is as good as poetry" is properly a statement of **Thesis 3 (Normative)** relying on **Thesis 2 (Commensurability)**. The anti-hedonist pretends it implies Thesis 1 to make it look stupid. The hedonist accepts Thesis 3 but hopes you don't notice they've abandoned Thesis 1.

  ---

  ### The Heterogeneity Problem

  You asked: *What would it even be for two pleasures to have something in common?*

  Your suspicion is correct: the "heterogeneity problem" (that pleasures are too different to be one thing) only kills **Qualitative Hedonism (Thesis 1)**. It does not necessarily kill **Structural or Functional Hedonism**.

  1.  **Felt Quality (Qualia):** If pleasure is a specific "tingle" or glow, heterogeneity kills it. Eating cake and solving math don't share a specific qualia.
  2.  **Functional Role:** If pleasure is "the signal that reinforces behavior," heterogeneity vanishes. Cake and math both reinforce behavior. This saves the theory but moves it toward **Thesis 5 (Deflationary)**.
  3.  **Attitudinal View:** If pleasure is "taking joy in" or "being pleased that" something is happening, heterogeneity vanishes. You can be "pleased that" you ate cake and "pleased that" you read poetry. The commonality is the *pro-attitude*, not the sensation.

  **Does "Nothing" kill the view?**
  If there is *nothing* in common (no feeling, no function, no attitude), then "pleasure" is just a noise word, and hedonism is false.
  But if the commonality is **Normative** (i.e., "the only reason we care about either is that we like them"), then hedonism survives. The commonality isn't in the *experience*; it's in the *reason for pursuit*.

  **The Survivor:** The version that survives best is **Attitudinal Hedonism**. It admits experiences are heterogeneous but claims the *stance* the subject takes toward the experience (wanting it to continue) is the uniform good-making feature.

  ---

  ### "It's All Just Dopamine Anyway"

  This is the "Lab Coat" move. Is it the same thesis? **No.** It is a category error.

  1.  **Descriptive vs. Normative:** "It's all dopamine" is a claim about mechanism (Psychological/Materialist). "Pushpin is as good as poetry" is a claim about value (Ethical).
  2.  **The Is/Ought Gap:** Even if it were true that poetry and pushpin release the exact same micrograms of dopamine (it isn't, but let's grant it), that does not prove they are *equally good*.
      *   *Analogy:* A fever and a workout both raise your heart rate. That doesn't mean a fever is as good as a workout.
      *   *The Fishiness:* The speaker is smuggling a normative conclusion ("they are equal value") from a descriptive premise ("they use the same chemical"). This is the **Naturalistic Fallacy**.
  3.  **Does it help?**
      *   **For the Hedonist:** It helps *only* if they are trying to prove Thesis 1 (Phenomenological Monism) or Thesis 4 (Motivational Monism). It gives a physical basis for commensurability.
      *   **For the Anti-Hedonist:** It actually helps them more. If pleasure is just a dopamine squirt, the anti-hedonist can say, "Aha! So you admit life is just about chemical stimulation? That proves my point that hedonism is shallow."

  **The Read:** When someone says "it's all just dopamine," they are usually trying to **debunk the distinction** between high and low pleasure to force the Commensurability Claim (Thesis 2). They want to say, "Your brain doesn't know the difference, so why should your morality?"
  *   **Why it fails:** Your brain *does* know the difference. Prefrontal cortex activity differs vastly between reading poetry and playing pushpin. Dopamine is not the whole story of value; it's the story of *prediction error* and *motivation*, not necessarily *satisfaction* or *worth*.

  ### Summary: What People Actually Mean

  When the guy in the thread says "pushpin is as good as poetry," he is almost certainly asserting **Thesis 3 (Normative Exclusivity)** combined with **Thesis 2 (Commensurability)**.

  *   **He means:** "If the net satisfaction is identical, the *source* of the satisfaction is morally irrelevant."
  *   **The Anti-Hedonist hears:** "The experience is identical and human dignity doesn't matter."
  *   **The Pro-Hedonist hears:** "Value is unitary and source-neutral."

  **Your Verdict:** The anti-hedonist is using the sentence as a *reductio* by pretending it implies Thesis 1 (Phenomenological). The pro-hedonist is accepting it as Thesis 3 (Normative). They are talking past each other. The sentence is true under Thesis 3 (if you are a hedonist) and false under Thesis 1 (for everyone). The "dopamine" argument is a distraction that tries to bridge the gap with science but fails to address the normative claim.

  The heterogeneity problem kills the "felt quality" version of hedonism, but not the "attitudinal" or "normative" version. If the hedonist defines pleasure as "what we ought to seek," they are safe from heterogeneity but vulnerable to tautology. If they define it as "a specific feeling," they are vulnerable to heterogeneity but meaningful. They cannot have both safety and substance easily.
