answer: |-
  ### Room Analysis: What They Actually Care About

  Before you step to the podium, understand the incentives in the room.

  *   **Career Councillors:** They care about **survival and mandate**. Their legitimacy comes from the ballot box. Your proposal threatens their relevance. They fear being held accountable for decisions they didn't make, or making decisions without the power to enforce them. They speak in terms of "constituents," "mandates," and "accountability."
  *   **Senior Officers:** They care about **stability and liability**. They need a clear chain of command to implement policy and someone to sign off on statutory duties. They fear whimsical policy shifts and legal ambiguity. They speak in terms of "governance," "continuity," and "risk."
  *   **The Deliberative Scholar:** They care about **process quality**. They believe sortition works only if people have time, evidence, and skilled facilitation to change their minds. They fear your "competence check" creates a technocratic barrier that rushes judgment or creates an internal elite of test-passers. They speak in terms of "epistemic quality," "capacity," and "facilitation."
  *   **The Public-Choice Economist:** They care about **incentives**. They believe everyone seeks rent or power. They fear you are just shifting the locus of capture from elected elites to unelected ones, with fewer mechanisms for removal. They speak in terms of "principal-agent problems," "information asymmetry," and "accountability mechanisms."

  ***

  ### The Questions You Will Be Asked

  I have ranked these by the combination of **likelihood** (how soon they will ask) and **damage** (how much it undermines your proposal).

  #### 1. The Accountability Trap
  **Asker:** Senior Councillor (Opposition Lead)
  **Likelihood:** High | **Damage:** Critical
  **Question:** "If this Chamber votes for a housing policy that catastrophically fails—say, a development that collapses or bankrupts the city—who do we fire? You propose removing the mechanism voters use to punish failure. Where is the accountability?"

  **Your 2-Minute Reply:**
  "Accountability is not just about removal; it's about alignment. Currently, councillors are accountable to donors, party whips, and vocal minorities who vote in primaries. They are incentivized to campaign, not to govern. My proposal aligns the decision-makers with the population affected. If a policy fails, the accountability is structural: the chamber rotates. One-third is replaced every year. If they make a mess, the incoming cohort has every incentive to correct it to show their own competence. Furthermore, we are not removing elections entirely; the Mayor and the Council retain the budgetary veto and the power to dissolve the Chamber if it breaches statutory law. We are shifting from *retrospective* punishment at the ballot box to *prospective* alignment through descriptive representation. You don't fire a jury for a verdict you dislike; you trust the process. We are making housing a matter of justice, not politics."

  **Where the Reply is Soft:**
  The "budgetary veto" concession undermines your claim of independence. If the Council can veto them, the Chamber is advisory, not legislative. If they are legislative, the "who do we fire" question remains legally potent regarding statutory liability.

  #### 2. The Technocratic Gatekeeper
  **Asker:** Public-Choice Economist
  **Likelihood:** High | **Damage:** High
  **Question:** "You propose a competence check for voting. Who writes the test? If the Officers write it, they rule. If the Chamber writes it, it's circular. This isn't democracy; it's a credentialing barrier that shifts power to the examiners. How is this incentive-compatible?"

  **Your 2-Minute Reply:**
  "A fair concern. The curriculum must be co-produced. I propose a Curriculum Committee comprising two officers, two Chamber members, and one external auditor from the University. The test isn't a barrier to entry, but a barrier to *vote* on specific technical clauses. It ensures that when a member votes on zoning density, they understand what 'density' means. This reduces information asymmetry between the officers and the legislators. It prevents officers from snowballing the Chamber with jargon. The incentive for the officers is to make the test clear so policy passes; the incentive for members is to study so they can vote. It aligns expertise with authority without requiring a lifetime of career politics."

  **Where the Reply is Soft:**
  You haven't solved who audits the auditors. The "external auditor" is a single point of failure. The Economist knows that whoever controls the syllabus controls the outcome. You are assuming good faith in the test design.

  #### 3. The Deliberative Bottleneck
  **Asker:** Deliberative-Democracy Scholar
  **Likelihood:** Medium | **Damage:** Medium
  **Question:** "Sortition requires time to deliberate. A competence check implies a 'right answer' mindset. Does testing members on subject areas not rush them to a technocratic conclusion before they've heard from citizens? Are you selecting for judgment or just test-taking ability?"

  **Your 2-Minute Reply:**
  "It's not about a right answer; it's about fluency. In parliament, MPs vote on bills they haven't read because they rely on whips. Here, we ensure they understand the *implications* of the bill. The test happens *after* evidence sessions but *before* the vote. It validates that the deliberation was understood. We are not replacing deliberation with testing; we are ensuring deliberation wasn't wasted on misunderstandings. Facilitation remains central to the evidence phase. The check simply ensures the final vote reflects informed judgment, not confusion."

  **Where the Reply is Soft:**
  Scholars know that "competence" is often coded bias. Standardized tests often favor higher socioeconomic statuses, potentially skewing the voting power within the Chamber away from the most vulnerable residents you aim to represent.

  #### 4. The Institutional Memory Void
  **Asker:** Senior Housing Officer
  **Likelihood:** Medium | **Damage:** Medium
  **Question:** "Housing projects take five to ten years. Your members serve three years, with only a third rotating. Where does the institutional memory live? Will we spend every year re-teaching the basics to new members, slowing delivery to a crawl?"

  **Your 2-Minute Reply:**
  "Continuity is handled by the staggered terms. Two-thirds of the Chamber always have at least one year of experience. We also propose a permanent, non-voting Clerkship drawn from senior officers to advise on procedure and history. But remember, 'institutional memory' in the current system often means 'institutional inertia.' We are trading some speed for better direction. A slow decision that the public trusts is faster to implement than a fast decision that gets sued or protested."

  **Where the Reply is Soft:**
  Officers know that "trust" doesn't pour concrete. If the turnover causes genuine delays in statutory approvals, the City is liable. You are asking them to accept inefficiency as a virtue.

  ***

  ### The One Question You Hope Nobody Asks

  **Asker:** The Public-Choice Economist (leaning forward, quiet voice)
  **Question:** "You say no one is eligible to serve twice. This means the most experienced, competent members *must* leave just as they become useful. This artificially creates a scarcity of expertise. Doesn't this guarantee that the real power will drift to the unelected Officers and the facilitators who *do* stay forever? Aren't you creating a permanent bureaucracy with a rotating figurehead?"

  *(Why this kills you: It attacks the "no re-service" rule, which is central to your anti-careerist argument. If the best members leave, the Chamber becomes a training ground for the Officers to manipulate. It suggests your solution creates the exact problem you claim to solve.)*

  ***

  ### Strategic Advice: Concede, Hold, Weakest

  **1. What to Concede Early (The "Hybrid" Compromise)**
  Do not demand the *immediate* replacement of the elected committee. It makes the Councillors defensive.
  *   **Concession:** Propose a **sunset clause** or a **parallel track**. Suggest a 5-year pilot where the Citizens' Chamber shares power with the Housing Committee, or where the Chamber has veto power only on zoning, not budget.
  *   **Why:** It lowers the temperature. It allows the Councillors to save face ("We are trying this, not being replaced"). It gives you data to prove the model works.

  **2. What to Hold (The Core Principle)**
  Hold firm on **Sortition over Election** for this specific function.
  *   **Argument:** Housing is a long-term structural issue, not a partisan one. Elections optimize for the 2-year horizon; housing requires a 20-year horizon.
  *   **Why:** This is your strongest philosophical ground. The "time horizon" argument resonates with Officers (stability) and Scholars (deliberation), even if Councillors hate it.

  **3. Where Your Position is Weakest (The Competence Check)**
  Your "competence check" is your most vulnerable flank.
  *   **Risk:** It sounds elitist and administratively nightmarish. It contradicts the democratic equality of the sortition.
  *   **Mitigation:** Reframe it. Don't call it a "test." Call it a **"Readiness Certification."** Emphasize that it is pass/fail, based on attendance and engagement with evidence, not a standardized exam. If you defend a written "exam," the Scholar and the Economist will tear you apart on bias and incentives.
  *   **Adjustment:** Consider dropping the "vote only if passed" rule. Instead, require that all members pass the certification to *serve*, but once serving, they all vote. Or, make the certification about *process* (did you attend the hearings?) rather than *knowledge* (do you know the zoning code?). The latter is harder to game.

  **Final Thought:**
  You are asking people with power to voluntarily dilute it. Your argument cannot just be "this is better democracy." It must be "this reduces your liability and political risk." Frame the Citizens' Chamber as a **shock absorber** for controversial housing decisions. If the housing plan fails, the Councillors can say, "The independent Chamber recommended this based on evidence." That is the selling point that gets you a vote.
