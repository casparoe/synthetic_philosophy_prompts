answer: |-
  A portfolio manager is reviewing two structured products with his junior analyst.

  "Product A pays out on a draw from an urn with fifty red and fifty black balls," says the manager. "Product B pays out on a draw from an urn where a coin flip decided whether it holds thirty red or seventy black."

  "The expected value is identical," says the analyst. "Fifty percent either way."

  "I agree," says the manager. "I have a strict policy: I never reject a bet with an objective probability of one-half."

  "So you'll take Product B?"

  "No. I also have a strict policy: I never bet on a state of the world that was fixed by a coin flip I didn't see."

  "But you just said the probability is known."

  "The probability is known. The urn is not."

  "So you're distinguishing between the math and the material?"

  "I'm distinguishing between risk that is transparent, and risk that is merely accurate."

  The analyst updates the model, noting the manager's utility function is coherent, provided you treat 'accuracy' and 'transparency' as orthogonal variables.

  This captures ambiguity aversion, where people prefer known risks over unknown states even when the objective probabilities are identical.
