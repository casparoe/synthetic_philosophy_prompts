  ### The Test Case: Lithium in Drinking Water

  **The Facts:**
  *   **Intervention:** Dosing municipal water.
  *   **Reversibility:** High. (Turn off the dosing pump. Lithium clears the body. It does not alter genes or the atmosphere).
  *   **Systemic Risk:** Low. (Does not self-propagate like gene drives).
  *   **Harm Evidence:** None stated. ("Effect size contested" refers to benefit. Harm is "long-term effects nobody has studied"). This matches Case 5 (Ignorance), not Case 1 (Signal).
  *   **Benefit:** Suicide reduction. (Severe human suffering/Survival).
  *   **Consent:** None. (Tap water is forced exposure).

  **The Verdict:**
  **ALLOW with Monitoring.**

  **Application of Principle:**
  1.  **Clause A (Systemic Veto):** Pass. It is not irreversible or self-propagating. It is a flow intervention like the food additive.
  2.  **Clause B (Harm Threshold):** Pass. There is no *positive evidence of harm*, only unstudied long-term effects. This is "Ignorance," not "Signal."
  3.  **Clause C (Urgency Override):** Pass. Suicide is a severe, immediate harm comparable to starvation (Case 5) or resistant infection (Case 2).

  **Comparison to Case 3 (Mosquitoes):**
  This does **not** clash with Case 3.
  *   **Case 3** was blocked because of **Clause A**. Once gene-drive mosquitoes are released, they breed and spread. You cannot recall them. The system is locked.
  *   **Lithium** is a **Clause C** case. If tomorrow a study shows lithium causes kidney failure in children, you turn off the pump. The exposure stops. The "system" (the city's water) is not permanently altered.
  *   **The Distinction:** Your principle treats **Ecological/Genetic Irreversibility** as a unique category of risk that trumps Urgency. It treats **Chemical/Physiological Exposure** as reversible, where Urgency can trump Uncertainty.

  **The Conflict You Will Feel:**
  You will feel discomfort because Lithium is **forced medication**. Case 2 (Antibiotic) was allowed because the patient chose it. Lithium removes choice.
  *   *Resolution:* Your verdict on Case 5 (Food Additive in hunger zones) implies you already accept that **Survival Urgency can override Opt-Out rights** in public infrastructure. If you accept Case 5, you must accept Lithium. If you decide Lithium is wrong because of "no opt-out," you must retroactively Block Case 5 (assuming the hungry population cannot opt-out of the food supply).

  ### Summary Repair of Your Half-Baked Principle

  Your draft: *"Pick the option that avoids the worst plausible outcome... unless that option would forgo a benefit that's already certain and large."*

  **The Repair:**
  *"Block any intervention that creates **irreversible systemic change**. For reversible interventions, block only if there is **positive evidence of harm**, unless the benefit addresses **immediate survival**, in which case allow with monitoring."*

  **What this costs you:**
  It costs you the moral comfort of "Safety First." It forces you to admit that in Cases 2 and 5, you are gambling with public health because the status quo (death/hunger) is worse than the gamble. It forces you to admit that in Case 1, you are protecting fish over profit not because the science is settled, but because the profit isn't worth the *signal* of risk.

  **Final Lithium Verdict:** **Install the dosing, but mandate a public health registry to track renal and developmental outcomes.** If a harm signal appears (Case 1 conditions met), you are obligated by your own principle to shut it down immediately.
