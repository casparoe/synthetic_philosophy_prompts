answer: |-
  Here is the battle plan.

  ### 1. The Order of Operations
  You are right to distrust opening with discounting. If you start with the math, the philosophers will check out (reductionism) and the economists will check in (solutionism). You need to establish the *normative problem* before you offer the *descriptive mechanism*.

  **The Sequence:**
  1.  **The Phenomenology of Betrayal (5 mins):** Establish that akrasia is not just preference change; it is acting against one's own *better judgment*.
  2.  **The Mechanism (10 mins):** Introduce hyperbolic discounting as the *engine* that generates the conflict, not the justification for it.
  3.  **The Naive vs. Sophisticated Split (15 mins):** Use this to isolate where the "weakness" actually lives (in the expectation error vs. the strategic constraint).
  4.  **The Dissolution Threat (15 mins):** The climax. If the mechanism explains the behavior perfectly, does the "weakness" vanish?
  5.  **The Diagnostic Question (5 mins).**

  **Why this order:**
  *   You must establish **Normativity** (Step 1) before **Description** (Step 2). If you don't lock in the idea that the agent *believes* they are doing wrong, the economists will reduce it to "utility maximization at $t_1$."
  *   You must establish **Agency** (Step 3) before **Fragmentation** (Step 4). The Naive/Sophisticated distinction proves the agent *can* recognize the conflict. Once they admit the conflict is recognizable, you can pull the rug out in Step 4 by asking if the conflict is *real* or just a modeling artifact.

  ### 2. The Core Example: "The Sunday Plan"
  Do not use exercise or diet. Use **Work.** This room consists of people who trade in intellectual labor.

  **The Scenario:**
  A researcher judges on Sunday at 8 PM that writing a difficult draft Monday at 9 AM is the *best course of action* (all things considered: career, integrity, long-term satisfaction). Monday 9 AM arrives. They open Twitter instead. They feel regret at 5 PM.

  **What it must have:**
  *   **A synchronous better judgment:** On Sunday, they aren't just "preferring" to write; they judge it *better* than the alternative.
  *   **Full information:** They know the draft is hard. They know Twitter is distracting. No ignorance.
  *   **A pre-commitment option:** They could have booked a writing room with a cancellation fee, or given their laptop to a colleague.

  **What it must not have:**
  *   **Addiction/Pathology:** No "I couldn't help it." This keeps it in the realm of will, not medicine.
  *   **External coercion:** No boss demanding the draft. The pressure must be internal.
  *   **Preference reversal based on new info:** They don't find out Monday morning that the draft is impossible. The facts haven't changed, only the *distance* to the reward/pain.

  ### 3. Misconceptions & Interception Points

  **From the Philosophers:**
  *   **The Misconception:** "Discounting isn't irrational; it's just a different preference structure. You can't derive an 'ought' from a discount curve."
  *   **When to head it off:** **Step 2 (The Mechanism).**
  *   **The Interception:** Explicitly state: "Hyperbolic discounting does not *justify* the behavior. It models the *instability* of the preference. We are using it to explain how the betrayal is *possible*, not to argue it is *rational*."

  **From the Behavioral Economists:**
  *   **The Misconception:** "Revealed preference is king. If they chose Twitter at 9 AM, then Twitter *was* their preference at 9 AM. There is no 'better judgment' other than the choice made."
  *   **When to head it off:** **Step 1 (The Phenomenology).**
  *   **The Interception:** Force the room to acknowledge the *regret*. "If revealed preference is the only truth, explain the 5 PM regret. Why does the 5 PM self judge the 9 AM choice as an error? If you deny the error, you deny the data of their experience."

  ### 4. The Two Required Builds

  **Build 1: Naive vs. Sophisticated (The "Weakness" Gap)**
  *   **Place:** Step 3.
  *   **The Move:** Contrast the **Naive Agent** (Sunday Self thinks Monday Self will be disciplined; Monday Self shocks them) with the **Sophisticated Agent** (Sunday Self knows Monday Self will fail, so they pay the cancellation fee for the writing room).
  *   **The Point:** The Naive agent experiences "weakness" as a surprise failure of character. The Sophisticated agent experiences "weakness" as a strategic constraint to be managed.
  *   **Why this matters:** If the agent is Sophisticated, they aren't "weak" in the moment; they are playing a game against their future self. This shifts "weakness of will" from a moral failure to an intra-personal coordination problem.

  **Build 2: The Dissolution Threat**
  *   **Place:** Step 4 (The Climax).
  *   **The Move:** Argue that if the discounting model is perfect, the "Sunday Self" and "Monday Self" are effectively different agents with different utility functions.
  *   **The Threat:** If they are different agents, the Monday Self isn't betraying the Sunday Self; they are just overruling a predecessor. "Weakness of will" requires a *single* will to be weak. If hyperbolic discounting fragments the self into a temporal sequence of agents, **akrasia dissolves.** There is no unity to betray.
  *   **Goal:** Make the economists feel the loss of "welfare" (whose welfare?) and the philosophers feel the loss of "agency" (which agent?).

  ### 5. The Diagnostic Question
  Do not ask "Did you understand?" Ask this:

  > *"If the Sunday Self and the Monday Self have different discount rates, and we accept that both are rational maximizers of their respective moments: **Who is the one making the mistake?** Is it the Sunday Self for planning, or the Monday Self for deviating? And if neither is mistaken, where did the 'Weakness' go?"*

  *   **If they got it:** They will struggle to answer because they see the tension between the normative claim (one is wrong) and the descriptive model (both are maximizing).
  *   **If they didn't:** They will say "Monday is wrong" (ignoring the model) or "Neither is wrong" (ignoring the akrasia).

  ### 6. What to Refuse (Out Loud)
  State this explicitly at the start to manage scope creep:

  1.  **No Neuroscience:** "We are not discussing dopamine pathways or prefrontal cortex inhibition today. That is the hardware; we are discussing the software architecture of agency."
  2.  **No Remediation:** "We are not discussing how to fix this (CBT, commitment devices, policy). We are discussing whether the problem is real or an illusion."
  3.  **No Metaphysics of Identity:** "We are not solving the Problem of Personal Identity (Parfit, etc.). We are taking the *experience* of a unified self as the datum to be explained."

  ### 7. Which Framing to Lean On
  **Lean Philosophical.**

  **Why:** Behavioral Economics *presupposes* a philosophical claim: that there is a "True Self" (usually the long-term planner) whose welfare is being compromised by the "Impulsive Self." If you run this as a pure Econ session, the economists will say, "Welfare is defined by revealed preference, case closed," and the session ends in 10 minutes.

  You need the Philosophers to keep the **Normative Pressure** on the room. You need them to insist that there *is* a "Better Judgment" that matters more than the immediate choice. Use the Economics as the *tool* the Philosophers are worried about.

  **The Narrative Arc:** "Here is a philosophical problem (Akrasia). Here is the best scientific model we have for it (Discounting). Does the model solve the problem, or does it explain it away?"

  That keeps both halves of the room engaged: the Phils get to defend the reality of the will, and the Econ folks get to defend the power of the model.
