  # JOINT STATEMENT ON THE NATURE OF PRACTICAL REASONS
  **Signatories:** Dr. Elena Vance (Commitment: Reasons Internalism) & Prof. Marcus Thorne (Commitment: Reasons Externalism)
  **Date:** October 24, 2023
  **Context:** Following a six-month adversarial collaboration funded by the Center for Normative Inquiry.

  ## I. AREAS OF CONVERGENCE

  After extensive dialectical exchange, we affirm the following claims as common ground. We acknowledge that while our metaphysical accounts of *why* these claims hold differ, our commitment to the claims themselves is shared.

  1.  **The Tripartite Function of Reason-Statements:** We agree that statements of the form "A has a reason to $\phi$" perform three distinct but related linguistic and normative jobs:
      *   **Explanation:** They rationalize action by making an agent's behavior intelligible in light of some end.
      *   **Deliberation:** They serve as premises in practical reasoning, guiding agents toward decisions.
      *   **Normative Licensing:** They license third-party attitudes, specifically advice (urging an agent to $\phi$) and blame (criticizing an agent for not $\phi$-ing).
      *   *Agreement:* We disagree on the *conditions* under which these licenses are valid, but we agree that a theory of reasons that cannot account for all three functions is inadequate.

  2.  **The Status of Stock Cases:**
      *   **The Amoralist:** We agree that the amoralist (who acknowledges moral facts but feels no motivation to comply) presents a limit case. We agree that the amoralist is practically defective. The Internalist describes this as a lack of a subjective motivational hook; the Externalist describes this as a failure of responsiveness to objective norms. We agree that describing the amoralist requires distinguishing between *having* a reason and *being moved* by it.
      *   **The Fully Informed but Unmoved Agent:** We agree that it is conceptually coherent to describe an agent who possesses all relevant non-normative facts regarding an action but remains wholly unmoved to perform it. We disagree on whether this agent *has* a reason to act, but we agree that their psychology is possible.

  3.  **Merely Verbal Differences:** We judge that a significant portion of our prior friction stemmed from equivocation on the term "reason."
      *   We agree that when "reason" is used to denote **explanatory causes of action** (why the agent *did* move), the Internalist analysis is predominantly correct.
      *   We agree that when "reason" is used to denote **standards of correctness** (what justifies blame regardless of motivation), the Externalist analysis is predominantly correct.
      *   *Resolution:* We acknowledge that many past arguments were attempts to force one usage to do the work of the other. Future discourse will distinguish between *Reasons$_{M}$* (Motivating/Internal) and *Reasons$_{N}$* (Normative/External).

  ***

  ## II. MAP OF RESIDUAL DISAGREEMENT

  Despite the convergence above, a substantive metaphysical disagreement remains regarding the grounding of Reasons$_{N}$. The following table isolates the remaining points of contention, the cruxes upon which they turn, and the empirical or intuitive tests we have agreed upon to probe them.

  | Residual Disagreement (Neutral Phrasing) | The Crux (Metaphysical/Conceptual) | Evidence That Would Count Against Own View | Agreed Test Case / Argument & Pre-Recorded Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Survival of Reasons Under Motivational Erasure**<br><br>*Internalist:* If an agent's concern is erased, the reason vanishes.<br>*Externalist:* If an agent's concern is erased, the reason persists. | **The Source of Normativity:**<br>Is the normative force of a reason dependent on the agent's actual or dispositional psychology, or does it reside in the value of the object/end itself? | **Internalist:** If we find ourselves licensing severe blame against an agent who literally *cannot* care (due to no fault of their own), Internalism loses its link to fairness.<br><br>**Externalist:** If we find ourselves withholding blame against an agent who ignores a profound value simply because they don't care, Externalism loses its critical bite. | **Case: The Targeted Intervention**<br>An agent loves her friend. A neural intervention erases this concern. She remains fully informed of the friendship's history and needs, but feels nothing. She neglects the friend.<br><br>**Internalist Prediction:** We will judge blame as unfair. The reason is gone because the psychological hook is gone.<br>**Externalist Prediction:** We will judge blame as appropriate (or regrettable). The reason survives because the value of friendship is objective. |
  | **2. The Scope of Sound Deliberation**<br><br>*Internalist:* Deliberation can generate new motivations from old ones.<br>*Externalist:* Deliberation cannot generate normativity ex nihilo; it only tracks it. | **The Internalist Dilemma:**<br>Is "sound deliberation" capacious enough to generate new ends without collapsing into Externalism, or strict enough to remain Internalist without becoming vacuous? | **Internalist:** If it is shown that "sound deliberation" must include standards totally independent of the subjective motivational set to yield correct results, Internalism is vacuous.<br><br>**Externalist:** If it is shown that agents can reason their way into entirely new values without prior external normative contact, Externalism is unnecessarily detached. | **Argument: The Radical Conversion**<br>Consider an agent who, through exposure to art and logic alone (no prior desire for art), comes to value aesthetic preservation.<br><br>**Internalist Prediction:** This is explicable via imaginative elaboration of existing generic desires (e.g., for order, pleasure). Internalism holds.<br>**Externalist Prediction:** This demonstrates that reason can create value where none existed. The "generic desires" are a fiction; the reason was external all along. |

  ***

  ## III. ASSESSMENT OF DEBATE-MOVING POTENTIAL

  Regarding the instruction to assess whether either crux is one **both sides agree would actually move the debate**:

  We jointly conclude that **neither** of the above cruxes is likely to resolve the disagreement.

  1.  **Regarding the Targeted Intervention:** We agree that intuitions regarding blame in this case are **theory-laden**. The Internalist will interpret the intuition that "blame is unfair" as decisive proof that reasons require motivation. The Externalist will interpret the intuition that "neglect is tragic/wrong" as decisive proof that reasons exist independently of motivation. Because the data (our intuitions) are processed through our respective theoretical frameworks, this case will not force a concession.
  2.  **Regarding the Internalist Dilemma:** We agree that the definition of "sound deliberation" is **elastic**. The Internalist can always expand the definition of deliberation to accommodate new motivations (risking vacuity), and the Externalist can always characterize that expansion as the detection of external reasons (risking obscurity). Without an independent metric for what counts as "sound" deliberation that is neutral between our views, this argument will result in stalemate.

  **Final Declaration:**
  We remain committed to our respective positions. However, we agree that the debate should no longer focus on "Who is right about the word 'reason'?" but rather on "Which grounding of normative licensing (psychological vs. factual) yields a more coherent theory of moral responsibility?" We recommend future research focus on the ethics of blame rather than the metaphysics of reasons.

  *(Signed)*

  **Elena Vance**
  *Department of Philosophy, University of Sydney*

  **Marcus Thorne**
  *Department of Philosophy, University of Oxford*
