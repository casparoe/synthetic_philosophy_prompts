prompt: |-
  I've spent the term working through the functionalism literature and have arrived at a package of views I'd like to defend in a seminar paper, but before I commit to it I want an honest audit of whether the pieces actually fit together. Here is where I've landed: (1) I'm a physicalist — everything that exists is physical, or at least supervenes on the physical; (2) mental states are functional states, so what makes a state a belief is the causal role it plays in the system, not the material it happens to be made of; (3) it follows, and I embrace it, that mental states are multiply realizable — a silicon system or an alien with a different biochemistry could hold the very same beliefs I do; (4) mental states genuinely cause things, so my belief that it's about to rain is why I take an umbrella, and it isn't merely my neurons doing the causing with the belief riding along as a passenger; (5) psychology's generalizations — say, about how beliefs and desires combine to produce action — are genuine causal generalizations that do real explanatory work, not just convenient shorthand for what a completed physics will eventually say; (6) the China brain is not conscious — a whole nation of citizens wired to pass messages so that the ensemble mimics my functional organization would have nothing it is like to be, however well it matched my input-output profile; and (7) a giant lookup table that stored the right output for every possible input, and so behaved exactly as I do, would likewise be dark inside.

  What I want from you is a consistency check, not a primer on functionalism: go through these and tell me which pairs are actually in tension, which only look like they are, and how severe each real tension is. Where two of my commitments genuinely pull against each other, say precisely which one has to give and what the cheapest repair would cost me; where a tension is merely apparent, explain what makes it dissolve. Please don't hedge by declaring everything jointly inconsistent — I expect some of these to sit together fine, and I'd rather have a sharp verdict on the few that don't than a list of vague worries. Rank what you find by severity, and be specific about the mechanism of each conflict rather than gesturing at "tension between reductionism and autonomy" or the like.

  Give me your answer as exactly five numbered points, ordered from the most serious problem to the least, each one a sentence or two, with no introduction or summary. If you think a tension I haven't asked about is more serious than one of these, fold it into the relevant numbered point rather than adding a sixth.
