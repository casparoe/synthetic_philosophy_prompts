answer: |-
  To preserve the Lewisian account you are fond of, you should reject **Step (2)**.

  Here is the breakdown of why this is the correct move, what it costs you, and how the later literature treats this "bootstrapping" problem.

  ### Why Reject Step (2)?

  Step (2) claims: *"Common knowledge of that kind can only be produced by some shared practice of attending to the same signals, precedents, or saliences."*

  This premise is false according to Lewis's actual text. Lewis anticipates this exact regress objection. His solution is that common knowledge does not require a prior *convention* or *practice*; it requires only a **common indicator** grounded in shared human psychology and perception.

  Lewis argues that common knowledge arises when members of a population share a "basis" for belief. This basis can be:
  1.  **Perceptual Evidence:** We both hear the same thunderclap. We both know we heard it. We both know that we both know it. This is not a convention; it is a fact of our shared environment and sensory apparatus.
  2.  **Salience (Focal Points):** Drawing on Thomas Schelling, Lewis argues that certain solutions to coordination problems are "salient" by virtue of their uniqueness or prominence (e.g., meeting at "noon" at the "information booth"). Recognizing salience relies on shared cognitive heuristics, not necessarily a prior *conventional* agreement to look for salience.

  By rejecting (2), you assert that the common knowledge required for a convention can be generated by **natural signs** or **psychological salience** rather than a prior conventional practice. This stops the regress before it begins. The "first" convention is bootstrapped by non-conventional common knowledge.

  ### The Cost of Rejecting (2)

  Keeping (1) (the Common Knowledge requirement) while rejecting (2) saves the rationalist elegance of Lewis's account, but it extracts a philosophical tax:

  1.  **The Mystery of Salience:** You must defend the notion that "salience" is objective or sufficiently intersubjective to do the heavy lifting. Critics (like Margaret Gilbert) argue that what counts as salient is often itself culturally conditioned. If salience is cultural, is it not itself conventional? If you claim salience is rooted in universal human psychology, you are making a strong empirical claim about human cognition that may not always hold.
  2.  **Intellectualism:** You are committed to the view that agents actually possess this common knowledge. In technical terms, CK requires an infinite chain of "I know that you know that I know..." To avoid an actual infinite mental state, Lewis treats this as a dispositional capacity to reason. However, critics argue this makes convention too intellectual. It implies agents are constantly modeling each other's epistemic states, which seems cognitively expensive for mundane conventions (like which side of the sidewalk to walk on).

  ### Is This a Genuine Bootstrapping Gap?

  You asked whether the trouble lies in the argument or in a genuine gap that simulation literature must plug. The answer is **both**, depending on which project you are pursuing.

  **1. For the Lewisian Rationalist Project:**
  The argument your friend constructed is a *reductio* that fails because it misrepresents Lewis's basis for common knowledge. There is no logical gap if you accept that non-conventional common knowledge (via perception/salience) exists. The regress is blocked.

  **2. For the Evolutionary/Simulation Project:**
  There *is* a genuine gap, which is why the literature you mentioned (Skyrms, Young, Binmore) largely rejects **Step (1)** instead of Step (2).

  Evolutionary game theory demonstrates that conventions can emerge and stabilize **without common knowledge**. Through mechanisms like reinforcement learning or fictitious play, agents can converge on an equilibrium simply by tracking past success rates. They do not need to know *that others know*; they only need to act in ways that happen to align.

  *   **If you reject (1):** You align with the modern simulation literature. You gain a naturalistic account of how conventions evolve from scratch without needing a "first mover" of common knowledge.
  *   **The Cost:** You lose the specific normative force of Lewis's account. For Lewis, a convention is a rational solution to a coordination problem. For the evolutionary theorist, a convention is merely a stable behavioral equilibrium. It explains *how* we got here, but it weakens the claim that we *ought* to follow the convention because it is mutually known to be rational.

  ### Recommendation

  Since you stated you are "fond of David Lewis's account" and wish to keep the rationalist machinery:

  **Reject Step (2).**

  Insist that common knowledge can be grounded in **shared perception** and **psychological salience**, which are pre-conventional. This preserves the definition of convention as a rational equilibrium based on mutual expectation.

  However, you must concede to your reading group that this relies on a robust theory of **Salience**. If your friend presses you on whether salience is itself culturally constructed, you may find yourself forced to concede that while the *logical* regress is blocked, the *empirical* origin of some conventions remains a matter of evolutionary dynamics (rejecting 1) rather than rational agreement (keeping 1).

  **Summary of the Trade-off:**
  *   **Keep (1), Reject (2):** Saves Lewis's rationalism. Cost: Reliance on "Salience" as a primitive, non-conventional anchor.
  *   **Keep (2), Reject (1):** Saves the evolutionary narrative. Cost: Abandons Lewis's specific definition; conventions become mere habits rather than rational agreements.

  Given your preferences, the Lewisian path (Reject 2) is the consistent choice, provided you accept that human psychology provides the necessary "focal points" to get the ball rolling without prior agreement.
