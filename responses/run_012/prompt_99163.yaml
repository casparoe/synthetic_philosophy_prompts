answer: |-
  This specification outlines the necessary conditions for any theory of the *badness* of pain. It does not define pain itself, but rather the normative and phenomenological property that makes pain a object of suffering. The following desiderata are organized by the distinctions they preserve, the empirical data they must accommodate, and the conceptual boundaries they must respect.

  ### I. The Non-Collapse Requirements (Conceptual Hygiene)
  Before addressing cases, a theory must maintain the following distinctions. Collapsing these terms is a theoretical failure, not a simplification.

  1.  **Phenomenal Unpleasantness vs. Normative Badness:**
      *   *Definition:* **Phenomenal Unpleasantness** is the "what it is like" of the negative tone of the experience. **Normative Badness** is the impact on the subject's well-being or welfare.
      *   *Requirement:* A theory must allow that these *could* come apart, even if they typically coincide.
      *   *Motivation:* The possibility of masochism (unpleasantness sought for welfare gain) or the constructed case below (unpleasantness tolerated without welfare loss).
      *   *Status:* **Non-negotiable.**

  2.  **Phenomenal Unpleasantness vs. Conative Attitude:**
      *   *Definition:* **Conative Attitude** is the desire, urge, or motivation to stop the experience.
      *   *Requirement:* A theory must distinguish *feeling* bad from *wanting* the feeling to stop.
      *   *Motivation:* Pain asymbolia (feeling without wanting to stop) and depression (wanting to stop suffering without specific pain sensation).
      *   *Status:* **Non-negotiable.**

  3.  **Experiential Force vs. Representational Content:**
      *   *Definition:* **Experiential Force** is the immediate, non-cognitive "push" of the pain. **Representational Content** is the proposition carried by the pain (e.g., "damage is occurring").
      *   *Requirement:* A theory must specify whether the badness lies in the *force* (the feeling) or the *content* (the message).
      *   *Motivation:* To distinguish Imperativist views from Evaluativist views.
      *   *Status:* **Camp Preference** (depends on meta-ethical stance on experience).

  4.  **Subjective Authority (Phenomenal) vs. Subjective Authority (Normative):**
      *   *Definition:* The subject is the final arbiter of whether it *hurts*. They are not necessarily the final arbiter of whether it is *bad for them* (welfare).
      *   *Requirement:* A theory must explain why we defer to the subject on the sensation but might dispute their claim on the welfare impact.
      *   *Motivation:* A subject can be wrong about what is good for them, even if they cannot be wrong that they are in pain.
      *   *Status:* **Non-negotiable.**

  ---

  ### II. The Desiderata List (Cases and Constraints)

  #### 1. The Asymbolia Constraint
  *   **Case:** Parietal damage patients (pain asymbolia). Sensory-discriminative intact; affective-motivational severed. Patient reports pain, rates intensity, but shows no distress, guards nothing, and may smile.
  *   **Requirement:** The theory must explain how the *sensory vehicle* of pain can remain intact while the *badness* is excised. The badness cannot be identical to the sensory quality (e.g., throbbing, burning).
  *   **Motivation:** Clinical evidence of double dissociation between sensation and suffering.
  *   **Status:** **Non-negotiable.** (Falsifies Intrinsic Sensory theories).

  #### 2. The Suffering-without-Pain Constraint
  *   **Case:** Severe anxiety, depression, or grief. The subject reports intense suffering, distress, and a desire for cessation, but no localized nociceptive pain sensation.
  *   **Requirement:** The theory must account for the *badness* of these states without referencing nociceptive sensory qualities. The source of badness must be generalizable beyond somatic pain.
  *   **Motivation:** Phenomenological overlap between physical pain and psychic suffering.
  *   **Status:** **Non-negotiable.** (Falsifies theories that tie badness essentially to bodily representation).

  #### 3. The Phenomenal Immediacy Constraint
  *   **Case:** Standard acute pain (e.g., touching a hot stove).
  *   **Requirement:** The badness must be *experienced*, not merely judged. It cannot be a post-hoc cognitive evaluation that the sensation is "unfortunate." The negative valence must be intrinsic to the phenomenology of the episode.
  *   **Motivation:** Introspective report. We do not infer pain is bad; we feel its badness.
  *   **Status:** **Non-negotiable.** (Falsifies pure Cognitivist/Judgment theories).

  #### 4. The Motivational Link Constraint
  *   **Case:** Reflexive withdrawal and voluntary avoidance.
  *   **Requirement:** The theory must explain the *typical* necessary connection between pain's badness and the motivation to stop it, without making the motivation constitutive of the badness (to allow for asymbolia).
  *   **Motivation:** Pain is essentially action-guiding, yet action can be severed (asymbolia).
  *   **Status:** **Non-negotiable.**

  #### 5. The Alienation Constraint (The Constructed Case)
  *   **Case:** Subject reports: "It is present, it is unpleasant, it hurts. But it is not *bad for me*. I am not distressed. I would not pay to stop it. I avoid it only out of habit."
  *   **Requirement:** The theory must declare this description either **Coherent** or **Incoherent**.
      *   *If Coherent:* The theory must locate the "unpleasantness" in a domain distinct from "prudential badness" and "distress." It forces a tripartite division: Sensation | Phenomenal Unpleasantness | Prudential Badness.
      *   *If Incoherent:* The theory must identify which concept is being misused. (Likely candidate: If it is truly "unpleasant," it entails some level of distress or conative rejection. To deny the desire to stop while affirming unpleasantness violates the conceptual link between *unpleasantness* and *aversion*.)
  *   **Analysis:** This case is **Incoherent** under standard phenomenological definitions. "Unpleasantness" in the philosophy of mind is typically defined as a phenomenal property that *commands* a negative conative attitude. To say "it is unpleasant but I have no desire to stop it" is akin to saying "it is red but has no color."
      *   *Violation:* It violates the **Motivational Link Constraint** regarding the definition of unpleasantness. However, if the subject means "It has the sensory quality of pain (which is usually unpleasant) but lacks the affective tone," they are describing Asymbolia, not this case. If they mean "It feels aversive but I don't care," they are describing a dissociation between *phenomenal* badness and *normative* badness.
      *   *Verdict:* The description is coherent **only if** "unpleasant" refers to a raw qualitative feel (like a bitter taste one enjoys) and "bad for her" refers to welfare. It forces the theory to separate *Phenomenal Disvalue* from *Prudential Disvalue*.
  *   **Status:** **Coherence Test.** (Falsifies theories that equate Phenomenal Unpleasantness directly with Prudential Badness).

  #### 6. The Transparency Constraint
  *   **Case:** Attending to the pain vs. attending to the body part.
  *   **Requirement:** When attending to the badness of pain, is the subject attending to the experience itself or the bodily disturbance?
  *   **Motivation:** Representationalists argue pain is transparent (we look through it to the damage); Qualia theorists argue we look *at* the feeling.
  *   **Status:** **Camp Preference.**

  ---

  ### III. Tensions and Incompatibilities

  **Flagged Incompatibility:** The **Phenomenal Immediacy Constraint** and the **Asymbolia Constraint** create a high-tension zone.
  *   *The Conflict:* If badness is *felt* immediately (Phenomenal Immediacy), how can the feeling exist without the badness (Asymbolia)?
  *   *Resolution Cost:* To satisfy both, a theory must posit a complex structure of pain where the "feeling" is composite. One component (sensory) remains in asymbolia; the other component (affective/evaluative) is lost.
  *   *Theories that fail:* Simple Qualia theories (fail Asymbolia). Simple Representational theories (struggle to explain why the representation feels *bad* rather than just being *believed*).

  **The Single Most Excluding Requirement:**
  The **Asymbolia Constraint** is the primary filter.
  *   *Why:* It excludes the most intuitive and historically popular view: **Intrinsic Sensory Theory** (the view that the badness is built into the sensory quality, like the heat in fire). If pain asymbolia is real, badness cannot be intrinsic to the sensory quality. This single requirement eliminates naive realism about pain qualia.

  ---

  ### IV. Scorecard of Leading Contenders

  Here is how the major theoretical frameworks score against the specification above.

  | Theory | Asymbolia Constraint | Suffering w/o Pain | Phenomenal Immediacy | Motivational Link | Alienation (Constructed) | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Intrinsic Sensory** (Qualia Realism) | **FAIL** | **FAIL** | PASS | PASS | FAIL | Cannot explain how sensation remains while badness vanishes. Equates sensation with badness. |
  | **Desire/Attitudinal** (e.g., Heathwood) | PASS | PASS | **WEAK** | PASS | PASS | Explains asymbolia (no desire to stop). Struggles with Phenomenal Immediacy (does badness feel like something, or is it just a desire?). |
  | **Imperativist** (e.g., Klein) | **WEAK** | PASS | PASS | PASS | **WEAK** | Treats pain as a command ("Stop this!"). Asymbolia is a failure to obey the command, but why is the command not *felt* as urgent? |
  | **Representationalist** (e.g., Tye) | PASS | PASS | **WEAK** | PASS | PASS | Badness is representing damage as bad. Asymbolia is representing damage without the "bad" tag. Struggles to explain the *felt* negativity vs. cold cognition. |
  | **Evaluativist** (e.g., Bain) | PASS | PASS | PASS | PASS | PASS | **Strongest Contender.** Claims pain represents bodily disturbance *as bad*. Allows dissociation (Asymbolia = representation without affective weight?). Must carefully distinguish representing-as-bad from feeling-bad. |

  ### V. Summary Instruction for the Paper

  To write a successful paper based on this specification:

  1.  **Do not** argue that asymbolia patients are "faking it." Treat the clinical data as a hard constraint.
  2.  **Do not** conflate "unpleasant" with "bad for welfare." Use the **Alienation Constraint** to test whether your chosen theory can handle a subject who admits the experience is aversive but denies it harms their well-being.
  3.  **Focus** on the **Asymbolia Constraint** as the primary weapon against Intrinsic Sensory views.
  4.  **Acknowledge** the tension between **Phenomenal Immediacy** and **Asymbolia**. The winning theory will be the one that best explains how a feeling can be present without its negative valence, without reducing the valence to a mere judgment.

  This specification provides the rigorous boundaries needed to evaluate theories of pain's badness without collapsing into general philosophy of mind or neuroscience.
