      *   *Intrinsic Sensory (Qualitative):* Fails Asymbolia.
      *   *Desire/Attitudinal (e.g., Heathwood, Schroeder):* Good on Asymbolia, struggles with Phenomenal immediacy (does it feel bad or do I just dislike it?).
      *   *Imperative (e.g., Klein):* Good on Motivation, struggles with Asymbolia (why no command to stop?).
      *   *Representationalist/Evaluativist (e.g., Tye, Bain):* Good on content, struggles with the "felt" nature of the evaluation (is it cognitive?).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (specification, not summary).
