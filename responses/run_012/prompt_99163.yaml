      *   **Section 2: The Desiderata List.** Numbered, with Motivation, Status (Non-negotiable/Preference), and Case.
      *   **Section 3: The Constructed Case Analysis.** Coherence check.
      *   **Section 4: Tensions and The "Killer" Constraint.**
      *   **Section 5: Theory Scorecard.** Brief evaluation.

  8.  **Refining the Content (Self-Correction during drafting):**
