answer: |-
  You have stumbled upon one of the central problems in the philosophy of biology and cognitive science, and you are right to sense that it sits in a middle ground between "mere metaphor" and "conscious intent."

  The biological term for the *phenomenon* you describe (goal-directed behavior without conscious guidance) is **teleonomy**. It was coined by Colin Pittendrigh in 1958 and popularized by Ernst Mayr to distinguish evolved, program-driven purposefulness from conscious *teleology*. However, teleonomy names the *system* or the *behavior*, not necessarily the ontological status of the *reason* itself.

  The specific name for the *object* you are isolating—a reason that exerts causal/explanatory force but lacks a mental owner—is a **free-floating rationale**.

  This term comes from the philosopher Daniel Dennett (most notably in *Darwin's Dangerous Idea*, 1995). Dennett uses it to describe exactly what you observed in the wasp: competence without comprehension. The "reason" (check the burrow to ensure security) is real, it is selected for, and it explains the behavior, but it does not reside in the head of the wasp. It "floats" in the design of the system, created by the evolutionary history of selection pressures rather than by a thinking agent.

  To address your questions about the edges of the concept:

  1.  **Is it just a fancy word for biological function?**
      Not quite. A "function" (in the etiological sense, e.g., Ruth Millikan's *Proper Function*) is defined by the *history* of selection (the kidney is *for* filtering because ancestors who filtered survived). A free-floating rationale is the *current logical structure* of the behavior that makes sense of the action *now*. The function explains why the trait exists; the free-floating rationale explains what the trait is *doing* in a way that looks like reasoning. They are neighbors, but the rationale focuses on the informational/reasoning structure, whereas function focuses on the historical cause.

  2.  **Does it stretch to markets or legal codes?**
      Yes. This is where Dennett's concept does heavy lifting beyond biology. A market behaves *as if* it is maximizing efficiency; a legal code behaves *as if* it seeks justice. There is no single mind holding these reasons, yet the "reasons" are load-bearing explanations for the system's behavior. Friedrich Hayek described similar phenomena in economics as "spontaneous order," but Dennett's formulation explicitly validates the *reality of the reason* without requiring a *reasoner*. It allows you to say the market "responds to incentives" without committing to the fallacy that the market "thinks."

  You are correct that this is not just an "as if" dodge. In the "as if" instrumentalist view, the reason is a useful fiction for the observer. In the free-floating rationale view (and teleonomy), the reason is a real, causal feature of the world, embedded in the structure of the system by evolution or cultural selection. It is a reason without a head.

  \answer{free-floating rationale}
