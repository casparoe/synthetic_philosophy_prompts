          *   Provide a "residue report" (what maps, what requires term changes, what has no counterpart).
          *   Address two extra probes: degraded link (graded vs. sharp threshold) and CRDT-style convergence (dissolves/sharpens/relabels unity).
          *   End with failure modes and what would change my mind.
          *   **Format:** Continuous prose, long email style. No headings, no bullet points, no bold text, no tables.

  2.  **Deconstruct the Philosophical Debate (Split-Brain):**
      *   **Core Question:** After commissurotomy (severing corpus callosum), is there one person or two?
