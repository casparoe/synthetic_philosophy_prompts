answer: |-
  | Reading | What it commits you to | Status | Supports colleague's conclusion? |
  | :--- | :--- | :--- | :--- |
  | **1. Positive Legalism** (Thinnest) | **Abuse:** Violating written statute. **Entrusted:** By the sovereign state. **Private:** Personal financial enrichment. **Gain:** Material assets. | **Tautological.** Corruption is simply whatever the local law prohibits. It offers no independent moral critique. | **No.** Requires extra premise: *Local law explicitly bans gift-exchange.* If gifts are legal, this reading says it is not corruption. |
  | **2. Public-Office Formalism** | **Abuse:** Deviating from formal job descriptions or institutional rules. **Entrusted:** By the specific agency/office. **Private:** Any benefit outside official salary/mandate. **Gain:** Material or status. | **Substantive.** Distinguishes official duty from personal action, but relies on existing institutional architecture. | **Only with extra premise:** *Institutional rules forbid reciprocity.* If the office culture permits gifts, this reading cannot condemn the act. |
  | **3. Public-Interest Consequentialism** | **Abuse:** Actions reducing overall social welfare. **Entrusted:** By the citizenry/populace. **Private:** Sectional interest over common good. **Gain:** Any advantage (including social capital). | **Substantive/Defensible.** Focuses on outcomes rather than rules. Allows for cultural context if reciprocity aids stability. | **Only with extra premise:** *The goat/whisky harms the public more than it sustains relationships.* Empirical evidence needed to settle the matter. |
  | **4. Liberal-Impartiality Universalism** (Thickest) | **Abuse:** Introducing particularistic ties into universalistic spheres. **Entrusted:** By abstract, equal citizens. **Private:** Any relational obligation (kin, community). **Gain:** Social cohesion within a group. | **Question-Begging.** Assumes Western bureaucratic impartiality is the universal norm for "entrusted power." | **Yes.** Defines the act as corruption by fiat. Any gift creating obligation is "private gain" against "public duty," regardless of local norms. |

  Your colleague most likely intends **Reading 4** (Liberal-Impartiality) while claiming the neutrality of **Reading 1** (Legalism). This allows her to treat a culturally specific normative framework (impartial bureaucracy) as a universal definition, thereby categorizing local reciprocity as inherently corrupt without arguing for *why* impartiality supersedes relational maintenance. For the definition to do the work she wants without smuggling in Western institutional assumptions, she must add a normative premise: that the "entrustment" comes from a universal public rather than a specific community, and that "private gain" includes the social capital generated by gift-exchange. Without this, the definition merely asserts her preferred institutional order as a moral truth.
