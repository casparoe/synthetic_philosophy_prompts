answer: |-
  This is a wonderfully precise problem. You have identified a gap between the *origin* of a practice (recent, conscious, often economic) and its *ontological status* (ancient, essential, defended). You are right to be dissatisfied with the blunt instrument of "Invented Tradition" as it is popularly understood; Hobsbawm's framework is often too cynical and top-down for the messy, sincere bottom-up processes you are describing.

  As requested, I will put on my anthropologist's hat. I'm going to brainstorm four candidate concepts from the literature, weigh them against your cases, and then recommend the one that fits best—along with a necessary refinement or coinage to handle the specific element of *rigidity* you've observed.

  ### 1. Brainstorming Candidate Concepts

  **Candidate A: Invented Tradition (Hobsbawm & Ranger)**
  *   **The Fit:** It handles the "recent origin, claimed antiquity" dynamic perfectly.
  *   **The Breakdown:** As you noted, Hobsbawm is primarily interested in *legitimacy*. The "invention" is usually a tool for a new regime (the state, the school system, the monarchy) to secure loyalty. It implies a "conspirator" (the state) and a "conspired" (the people). In your cases, the "inventors" (the Chamber of Commerce, the 1970s enthusiasts) are not trying to seize power; they are trying to save a town or a craft. Furthermore, Hobsbawm's traditions often remain "invented" in the historical record; yours have *succeeded* so well they have ceased to be inventions in the eyes of the practitioners. Using this term might force you into a debate about "fakeness" that distracts from your point about "realness."

  **Candidate B: Staged Authenticity (Dean MacCannell)**
  *   **The Fit:** This comes from tourism studies (1970s). MacCannell argues that locals create a "front region" (performance for tourists) that eventually becomes indistinguishable from the "back region" (real life). This fits your Case 1 (festival for visitors becoming the town's identity).
  *   **The Breakdown:** It is too focused on the *tourist's gaze*. It assumes the locals know it's a stage and the tourists are the ones being fooled. In your cases, the *locals* are the ones who believe. They aren't staging it for outsiders anymore; they are doing it for themselves. It lacks the emotional interiority you need.

  **Candidate C: Folklorism (Volkskunde)**
  *   **The Fit:** German scholarship distinguishes between "folklore" (organic) and "folklorism" (the conscious presentation of folklore by people who know it's folklore). This fits your Case 2 (enthusiasts reconstructing a craft).
  *   **The Breakdown:** Like Hobsbawm, it maintains a binary. It implies there is a "pure" original and a "secondary" revival. It doesn't account for the *success* of the revival. If the revival lasts 50 years and everyone believes it, "folklorism" feels like an insult that denies the new reality. It doesn't explain the *hardening* you observed.

  **Candidate D: Emergent Authenticity (Erik Cohen)**
  *   **The Fit:** Cohen (1988) explicitly challenged MacCannell. He argued that authenticity is not a static property of an object but a *process*. Something can start as inauthentic (a souvenir, a show) and, through social acceptance and time, *become* authentic.
  *   **The Breakdown:** It is still largely tethered to tourism literature. It explains the *becoming*, but it doesn't fully explain the *rigidity*. Why does the new version get *stricter* than the old one? Cohen focuses on acceptance, not codification.

  ### 2. The Selection and the Refinement

  The concept that actually fits your specific slice—the *becoming real* combined with the *hardening*—is **Emergent Authenticity**, but it requires a specific anthropological refinement to work for a general audience.

  However, to capture the *rigidity* (the syllabus, the policing of neighbors), I recommend you pair it with a concept from legal anthropology and performance studies: **Canonization**.

  If I were to coin a term for your piece that bridges these, I would suggest: **"Crystallized Tradition."**

  But if you want to stay within established academic vocabulary that won't get you rolled eyes from peer reviewers, the most precise label is **"Traditionalization."**

  **Why "Traditionalization"?**
  It treats "tradition" as a verb, not a noun. It allows you to say: "This is not a tradition; it is a process of *traditionalizing*." It sidesteps the "is it real?" debate and focuses on "how is it made real?"
  *   **It fits Case 1:** The town is *traditionalizing* a 1954 event.
  *   **It fits Case 2:** The enthusiasts are *traditionalizing* a revival.
  *   **It explains the rigidity:** Traditionalization requires boundaries. To make something a tradition, you must define what it is *not*. Hence, the neighboring village is "fake."

  **Where it breaks down:**
  "Traditionalization" is dry. It sounds like bureaucracy. It doesn't capture the *emotion* or the *time* element (the 70-year slide into antiquity).

  **My Recommendation:**
  Use **"Emergent Authenticity"** as your anchor for the *time* element (the new becoming old), but describe the *mechanism* as **"Defensive Codification."**

  However, since you asked me to coin one if necessary to carve the distinction precisely enough for 6,000 words, I propose you use the term: **"Sedimented Invention."**

  *   **Definition:** A practice that begins as a conscious innovation but, through layers of repetition, memory, and social enforcement, accumulates the weight of history until the origin layer is buried.
  *   **Why it works:** It captures the geology of time. It acknowledges the "invention" (the bottom layer) without letting that define the whole structure. It explains the rigidity (sediment turns to stone).
  *   **What it excludes:** It excludes practices that remain fluid (drift) and practices where the origin is still openly acknowledged as recent (no sedimentation).

  ### 3. Carving the Boundaries

  You asked for explicit boundaries to distinguish your cases from three other scenarios. Here is how you draw those lines using the **Sedimented Invention** framework.

  **(a) Vs. Hobsbawm's "Invented Tradition"**
  *   **The Distinction:** *Intent and Awareness.*
  *   **Hobsbawm:** The inventors *know* it's a tool for legitimacy. The "invention" is a means to an end (power). The focus is on the *top-down* imposition.
  *   **Your Case:** The inventors often *forget* it was an invention. The "invention" is a means to an end (identity/continuity). The focus is *bottom-up* adoption.
  *   **The Line:** If the Chamber of Commerce in 1954 wrote minutes saying "Let's fool them," it's Hobsbawm. If they wrote "Let's give us something to do," and their grandkids think it's ancient, it's **Sedimented Invention**. The cynicism is gone; the sincerity is total.

  **(b) Vs. A Community Simply Mistaken**
  *   **The Distinction:** *Epistemology (How they know).*
  *   **Mistake:** "We think this pot is from 1800" (It is from 1990). This is a factual error that can be corrected with a receipt.
  *   **Your Case:** "We know the festival started in 1954, but *this way of doing it* is who we are." The receipt exists (you found the minutes!), but it is rendered irrelevant by the social function.
  *   **The Line:** A mistake is fragile; it breaks when evidence appears. **Sedimented Invention** is robust; it absorbs the evidence ("Yes, 1954, but that's when the *modern era* of the ancient practice began"). The truth claim is not historical; it is *sociological*.

  **(c) Vs. Ordinary Drift of Custom**
  *   **The Distinction:** *Directionality (Fluid vs. Rigid).*
  *   **Drift:** Customs normally get *looser* over time. Rules relax, variations multiply, the "original" form blurs.
  *   **Your Case:** The practice gets *stricter*. The 1970s revival is more uniform than the 1900s record. The 1954 festival has more rules now than it did then.
  *   **The Line:** This is the crucial marker. When a practice stops drifting and starts *hardening*, it has entered the phase of **Traditionalization**. The rigidity is proof that the community is now using the practice as a *boundary marker* (us vs. them) rather than just a habit.

  ### 4. The "When Does It Stop?" Question

  You asked: *"At what point does an invented tradition stop being invented — is that even a coherent question?"*

  As an anthropologist, my answer is: **It is not a coherent question, and that is the point.**

  To ask "When did it become real?" is to assume there was a time when it was "fake." But in social terms, a practice is "real" if it has *consequences*.
  *   If people fight over it, it is real.
  *   If people organize their year around it, it is real.
  *   If people feel grief when it is threatened, it is real.

  The "invention" label is a historical category; the "tradition" label is a functional category. They overlap.
  However, for your piece, you need a threshold. I suggest you borrow from Durkheim's concept of the **"Social Fact."**

  **The Threshold:** An invented tradition stops being "invented" (in the meaningful sense) when the *origin story* no longer determines the *practice*.
  *   **Before the threshold:** People do it *because* the founders said so. (Authority is external).
  *   **After the threshold:** People do it *because* it is "what we do." (Authority is internal).

  In your Case 1, the threshold was crossed when the founders died. The "receipts" (minutes) became historical curiosities rather than instructions. The practice detached from its authors. That is the moment of **Sedimentation**.

  ### Summary for Your Piece

  If I were editing this piece, I would advise you to:

  1.  **Acknowledge Hobsbawm** but gently set him aside as too cynical for these specific cases.
  2.  **Introduce "Emergent Authenticity"** (citing Erik Cohen) to handle the time element (new becoming old).
  3.  **Use "Traditionalization"** as the verb to describe the active work the community is doing.
  4.  **Highlight the "Rigidity Paradox":** Explicitly point out that *real* old customs drift, but *new* traditions harden. This is your smoking gun. It proves the practice is being used for identity defense, not just continuity.
  5.  **Avoid declaring it "Fake."** Your subjects aren't lying. They are engaging in **Sedimented Invention**. The layers of memory have buried the blueprint.

  This allows you to be precise without being derogatory. You aren't exposing a con; you are describing a alchemy—how the lead of a Chamber of Commerce meeting turns into the gold of ancestral memory.
