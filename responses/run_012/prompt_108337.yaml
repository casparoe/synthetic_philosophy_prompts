      *   **Topic:** Lewis Carroll's "What the Tortoise Said to Achilles." The user's thesis is that the regress shows the demand for justificatory premises is incoherent (constitutive regress, not epistemic). Therefore, "Is deduction justified?" is malformed.
      *   **Audience Composition:**
          1.  *Inferentialists (Proof Theorists, Dummett/Brandom lineage):* Meaning = Inferential Role. Concerned with justification/normativity. Will hate "disposition-talk."
          2.  *The Quinean:* Holist, anti-foundationalist. Thinks justification questions are pointless; web of belief suffices. Talks fast (90 seconds).
          3.  *Cognitive Scientists:* Empiricists/Psychologists. See the Tortoise as psychology of rule-following. Think philosophy is a distraction. Love disposition-talk.
      *   **User's Vulnerability:** The distinction between "accepting a rule" vs. "accepting a premise." If it's not a premise, what is it? If it's a disposition, Inferentialists revolt. If it's not a disposition, Cog-Sci gets bored/hostile.
      *   **Task:** Create a prep sheet with objections (phrased in character), ranked by damage, with 2-minute replies, weakness flags, concessions, and the "dreaded question."

  2.  **Deconstruct the Audience & Anticipate Objections:**

      *   **Inferentialists (The Main Threat):**
          *   *Concern:* Normativity. If rules aren't premises, how do they *bind* us? Dispositions are descriptive, not normative. Brandom insists on *commitments* and *entitlements*, not just doing stuff.
          *   *Objection:* "You've dissolved the normativity of logic. If following a rule is just a brute fact about how we move symbols, you've naturalized inference out of existence."
          *   *Damage:* High. This strikes at the heart of the "malformed question" claim. If the question is malformed, why do we feel bound by logic?

      *   **The Quinean (The Interrupter):**
          *   *Concern:* Pragmatism. Why are we splitting hairs about rules vs. premises? It's all just central vs. peripheral beliefs.
          *   *Objection:* "This is all analytic/synthetic distinction baggage. We hold logic central because giving it up causes too much churn in the web. No need for 'constitutive' mysticism."
          *   *Damage:* Medium. It dismisses the project rather than refuting it. Hard to argue with because he denies the framework.

      *   **Cognitive Scientists (The Allies/Trap):**
          *   *Concern:* Mechanism. How does the brain actually do it?
          *   *Objection:* "So you're saying it's a heuristic? A neural pathway? Why keep the philosophical jargon?"
          *   *Damage:* Low/Medium. They agree with the conclusion (it's not a premise) but might push the user into naturalism that alienates the Inferentialists.

  3.  **Drafting the Objections (in character):**

      *   *Inferentialist:* Needs to sound rigorous, concerned with *norms*, *commitments*, *propriety*. Use terms like "normative force," "deontic scorekeeping."
      *   *Quinean:* Needs to sound impatient, pragmatic, holistic. "Web of belief," "posits," "empirical content."
      *   *Cog-Sci:* Needs to sound empirical, mechanistic. "Implementation," "cognitive architecture," "behavioral output."

  4.  **Developing Replies & Identifying Weaknesses:**

      *   *Reply to Inferentialist:* Must avoid pure dispositionalism. Need to frame rule-following as a *practice* or *social norm* without making it a premise. *Weakness:* Still risks collapsing into regularity.
      *   *Reply to Quinean:* Acknowledge holism but insist on the *structural* difference between inference and belief. *Weakness:* Quinean won't care.
      *   *Reply to Cog-Sci:* Validate them but insist on the *logical* point vs. the *causal* point. *Weakness:* Might sound dualist.

  5.  **Strategic Concessions:**
      *   Don't fight the Quinean on holism.
      *   Don't fight Cog-Sci on mechanism.
      *   Fight the Inferentialists on *where* normativity lives (practice vs. proposition).

  6.  **The "Dreaded Question":**
