prompt: |-
  So I've got a reading group presentation coming up and I want to prep properly for the Q&A. Its a logic-and-language group in my department, so the room breaks into three camps. Two of them are proof theorists who work on inferentialism — meaning is conferred by inferential role, that whole Dummett/Brandom lineage — and they'll read everything I say through the lens of whether it helps or hurts their project. Then there's one Quinean who thinks any question about "justifying" logic is a hangover from foundationalism and that the web of belief already answers it, and he says so in about ninety seconds every time. And finally a couple of people from the cognitive science side who study how humans actually reason; for them Carroll's tortoise dialogue is basically an early statement of the psychology of rule-following, and they think the philosophical framing is a distraction.

  Heres the thesis I'm defending. The tortoise doesn't show that deduction is unjustified. It shows that the demand for a justification of inference, when it's framed as a demand for a premise that licenses the step, is incoherent — because any such premise would need a rule to be applied to it, so you never get out of the regress. So the regress isn't epistemic, it's constitutive: it tells you something about what following a rule is, not about what we're missing. The upshot is that "is deduction justified?" is a malformed question.

  But I don't want to just announce that and sit down, because I think the malformation has a cost. If accepting a rule isn't the same as accepting a premise, then the inferentialists owe an account of what that difference is, and I don't think they have one that isn't just disposition-talk. And disposition-talk is exactly what the cog-sci people will cheerfully accept and the proof theorists will find intolerable. That's my soft spot and I know it.

  Give me a prep sheet: the objections I'll actually get from this specific room, in the order they'll come and ranked by how much damage they do, each phrased the way that person would phrase it, with roughly a two-minute reply and a flag on where the reply is weak. Tell me what to concede up front rather than fight. And include the one question I'm hoping nobody asks. No citations needed, don't worry about whether I've read the literature — just tell me what's coming and what to say.
