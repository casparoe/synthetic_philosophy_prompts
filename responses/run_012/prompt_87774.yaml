answer: |-
  Here is a conceptual map of the dispute, followed by a resolution of the three specific questions you raised.

  ### I. Candidate Distinctions and Red Herrings

  To diagnose the snag, we must separate three pairs of concepts that your conversation is likely conflating.

  1.  **Causal Efficacy vs. Moral Agency:**
      *   *Causal Efficacy:* The capacity to make a difference in the physical world (e.g., ash blocks sunlight; viruses replicate).
      *   *Moral Agency:* The capacity to act for reasons, subject to norms of praise and blame (e.g., the administration *chose* to hoard grain).
      *   *Status:* **Crucial.** Your colleague argues for efficacy; you are defending agency. You are talking past each other because "actor" implies agency in common parlance but efficacy in your colleague's usage.

  2.  **Constraint vs. Determination:**
      *   *Constraint:* Non-human factors limit the *space of possible outcomes* (e.g., no harvest means no food, regardless of policy).
      *   *Determination:* Non-human factors fix the *actual outcome* uniquely (e.g., cold weather *made* the revolt happen).
      *   *Status:* **Crucial.** The fear of determinism rests on confusing these.

  3.  **Causal Necessity vs. Explanatory Salience:**
      *   *Necessity:* A factor without which the event would not have occurred (INUS conditions).
      *   *Salience:* The factor selected as *the* explanation relative to our interests (e.g., "Why famine?" vs. "Why *starvation* despite grain reserves?").
      *   *Status:* **Crucial.** This is where the "real work" claim lives.

  **Red Herrings to Discard:**
  *   **Animism/Vitalism:** Your colleague is likely not claiming volcanoes have intentions. Dismissing her view because volcanoes lack minds is a straw man. She is arguing for *ontological symmetry* in causal networks, not psychological equivalence.
  *   **Hard Determinism:** The worry that admitting climate as a cause renders human choice illusory is an equivocation. Admitting a move in chess is constrained by the board does not mean the player didn't choose the move.

  ---

  ### II. Resolution of the Contested Claims

  #### 1. "Caused" vs. "Acted": Metaphor or Substance?

  **The Distinction:**
  To say $X$ **caused** $Y$ is to assert a counterfactual dependence (had $X$ not occurred, $Y$ would not have). To say $X$ **acted** is to assign $X$ a role in a narrative structure typically reserved for entities that initiate chains of events.

  **The Analysis:**
  The claim that a pathogen "acted" is not *merely* metaphorical, but it is not a claim about metaphysics; it is a claim about **explanatory symmetry**.
  *   **Your View (Asymmetry):** Humans are subjects; nature is the stage. Explanation flows from the subject's response to the stage.
  *   **Colleague's View (Symmetry):** Humans and pathogens are nodes in a network. Explanation flows from the interaction of the nodes.

  **The Verdict:**
  The second claim stakes out a genuinely different assertion about what belongs in a historical explanation. It asserts that the *interaction* is the unit of analysis, not the *human response*.
  *   **What is at stake:** If the pathogen is merely a "cause," it belongs in the *explanans* (the background conditions). If it is an "actor," it belongs in the *explanandum* (the plot).
  *   **Substantive Disagreement:** Your colleague is right that reserving "actor" for humans smuggles in a metaphysical commitment to human exceptionalism (that only intentionality creates history). You are right that "actor" carries normative baggage (responsibility) that pathogens cannot bear.
  *   **Resolution:** Adopt the term **"Causal Participant"** for non-humans. This grants them the efficacy your colleague demands without attributing the normativity you wish to reserve for humans. The disagreement is substantive only if one insists that "history" is exclusively the study of moral agents. If history is the study of change over time, the pathogen is a participant.

  #### 2. The Spectre of Determinism: Constraint vs. Inevitability

  **The Distinction:**
  *   **Shaping (Constraint):** Non-human factors alter the probability distribution of outcomes.
  *   **Making Inevitable (Determination):** Non-human factors reduce the probability of all but one outcome to zero.

  **The Analysis:**
  The worry that non-human agency erases human deliberation rests on the **Fallacy of the Zero-Sum Game of Causation**. It assumes that causal power allocated to the climate is subtracted from the administration. This is false. Causation is not a conserved quantity.
  *   **Example:** The cold decade made harvest failure *probable* (Constraint). It did not make the imperial hoarding of grain *necessary* (Determination). The administration could have imported grain, redistributed stores, or lowered taxes.
  *   **The Equivocation:** The slide occurs when "shaped what happened" (the range of options) is confused with "made what happened" (the specific selection).

  **The Verdict:**
  The worry is **ill-founded**, provided you define agency as *choice within constraints* rather than *freedom from conditions*.
  *   **For the Colleague to be right:** She must show that human responses are functionally determined by environmental stressors (e.g., all states react identically to famine). This is empirically false.
  *   **For You to be right:** You must acknowledge that human deliberation occurs within a material envelope that renders some choices impossible.
  *   **Resolution:** Admit the climate as a **co-constitutive condition**. It writes the menu, but the administration orders the meal. Admitting the menu exists does not mean the diner didn't choose.

  #### 3. "Did Real Work": Efficacy, Salience, or Blame?

  **The Distinction:**
  Your colleague's phrase "did real work" conflates three distinct claims:
  1.  **Causal Efficacy:** Energy was transferred; biology occurred. (True for volcanoes).
  2.  **Explanatory Salience:** This factor is the most important one to cite for *our* purposes. (Contestable).
  3.  **Moral Apportionment:** This factor is liable for the outcome. (False for volcanoes).

  **The Analysis:**
  The dispute stalls because you are hearing "Moral Apportionment" (which you reject for volcanoes) while she is asserting "Causal Efficacy" (which is undeniable).
  *   **Causal Efficacy:** The pathogen *did* kill. The volcano *did* cool the air. This is physical work.
  *   **Explanatory Salience:** In *environmental* history, the pathogen is salient. In *political* history, the administration is salient.
  *   **The Snag:** Your colleague wants to elevate Efficacy to Salience permanently. You want to reserve Salience for Agency.

  **The Verdict:**
  This is a **substantive disagreement about Explanatory Interests**, disguised as a metaphysical dispute.
  *   **What would have to be true for her:** That the primary question of history is "How did this assemblage come to be?" (Where humans and microbes are equal components).
  *   **What would have to be true for you:** That the primary question of history is "How did moral agents navigate their world?" (Where humans are the privileged subjects).
  *   **Resolution:** Acknowledge that "work" is ambiguous. The volcano did **physical work** (blocking sun). The administration did **political work** (allocating scarcity). The famine was the result of the **intersection** of these works.
  *   **Recommendation:** Do not fight over the word "actor." Fight over **Explanatory Salience**. Argue that while the pathogen has *causal efficacy*, the administration has *explanatory priority* for questions of *historical responsibility*. The pathogen explains the *crisis*; the administration explains the *catastrophe*.

  ### Summary for Your Chapter

  The conceptual snag is not about whether non-humans have causal power (they do), but about whether **causal power entails historical agency**.

  1.  **Cause vs. Actor:** "Actor" implies a role in a narrative. Granting this to non-humans changes the *structure* of explanation from hierarchical (humans over nature) to flat (networked). This is substantive, not metaphorical, but requires decoupling "agency" from "intentionality."
  2.  **Determinism:** The fear is unfounded. Material constraints limit the *solution space*; they do not select the *solution*. Human deliberation remains the mechanism of selection.
  3.  **Real Work:** Distinguish **physical work** (energy/biology) from **historical work** (interpretation/decision). Both are real, but they answer different questions.

  **Final Diagnosis:** You and your colleague are both right, but about different logical types. She is right about **ontology** (what exists and interacts); you are right about **normativity** (who is responsible and how we narrate). The solution is to treat non-humans as **causal participants** who constrain the historical field, while reserving **historical agency** for those entities capable of interpreting and responding to those constraints. This preserves the material reality of the environment without dissolving the specificity of human responsibility.
