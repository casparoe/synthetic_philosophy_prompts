      *   *Searle's Point:* It's not just "behavior isn't enough," it's "syntax isn't semantics." I need to simplify that. "Shuffling symbols vs. knowing what they mean."

  8.  **Final Polish:** Check against constraints. American English? Yes. Readable? Yes. Engaged with claims? Yes. Diagnosis not verdict? Yes.

