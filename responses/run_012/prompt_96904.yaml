prompt: |-
  i'm putting together a spec for a working group before we commit to a fairness metric on a scoring model we're about to ship, and every time we argue about which metric we're really arguing about requirements nobody bothered to write down. so write them down. what does any adequate fairness criterion for a predictive scoring system have to deliver before we're even allowed to pick one?

  for each requirement: the case or consideration that forces it (the case, not just the label), whether it's non-negotiable or just a preference of one camp (group-parity people, individual-similarity people, the counterfactual crowd), and whether it constrains the score or only the decisions made from the score. then the part i actually need: which of these can't be jointly satisfied, and why. i'm fairly sure that once base rates differ across groups, wanting the score to mean the same thing in both groups and wanting the error rates to line up can't both hold -- give me the precise version, which ones drop out, and whether the conflict is a fact about the world (the base rates differ) or a fact about the definitions themselves.

  three things i want treated as candidate requirements even though i've mostly seen them mentioned as asides:

  - the score gets consumed by more than one downstream decision maker, and they each pick their own cutoff. so: fairness should be something certified at the score level that survives whatever threshold a downstream user chooses. genuine requirement, or disguised impossibility? say which.

  - composability: if two independently fair components get chained (one model's output feeding into another, or two fair scores averaged), should the result still be fair? should "closed under composition" be on the list, and what does keeping it there cost?

  - non-triviality: a criterion satisfied by a constant predictor, or by a model that just refuses to score anyone, is worthless. is that a real desideratum or am i smuggling in an accuracy preference? if its real, which of the usual metrics fail it?

  then rank the requirements by how many candidate metrics each eliminates, and tell me which single one does the most work. skip the full scorecard of every metric in the literature, i'll do that part myself. a table is fine if it helps.
