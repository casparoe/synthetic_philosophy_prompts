answer: |-
  This spec separates **requirements** (what the system must achieve) from **metrics** (how we measure achievement). Most working group conflicts arise because stakeholders advocate for a metric (e.g., "Equalized Odds") without agreeing on the underlying requirement (e.g., "Equal burden of false negatives").

  Below are the foundational requirements for an adequate fairness criterion, followed by the impossibility analysis, the three specific candidate constraints, and the ranking.

  ### 1. Foundational Requirements Table

  | Requirement | The Case / Consideration (The "Why") | Negotiability | Scope |
  | :--- | :--- | :--- | :--- |
  | **Calibration (Sufficiency)** | **Risk Interpretability:** If a score represents a probability of risk (e.g., 10% default rate), that meaning must hold regardless of group membership. A score of 0.8 must imply the same likelihood of the outcome for Group A as for Group B. | **Preference:** Individual-similarity & Score-centric camps. Non-negotiable for risk-based pricing or clinical triage. | **Score** (Invariant to threshold) |
  | **Error Rate Balance (Separation)** | **Equal Burden of Mistakes:** The cost of being misclassified should not fall disproportionately on one group. False positives (e.g., denied loan) and False negatives (e.g., defaulted loan approved) should occur at equal rates across groups. | **Preference:** Group-parity camp. Non-negotiable for high-stakes punitive decisions (e.g., parole, hiring). | **Decision** (Depends on threshold) |
  | **Selection Rate Balance (Independence)** | **Representational Access:** The opportunity to receive the positive classification (e.g., loan approval, interview) should be distributed equally across groups, regardless of underlying outcome rates. | **Preference:** Group-parity camp (strongest form). Often legally mandated in specific contexts (e.g., 80% rule). | **Decision** (Depends on threshold) |
  | **Individual Consistency** | **Similarity Treatment:** Two individuals with identical relevant features should receive identical scores, regardless of group membership. Prevents "noise" from acting as a proxy for protected attributes. | **Preference:** Individual-similarity camp. Non-negotiable for legal "equal protection" arguments. | **Score** |
  | **Monotonicity** | **Directional Integrity:** A higher score must always imply a higher likelihood of the target outcome. A fairness fix cannot invert the risk ordering (e.g., making a higher risk score imply lower risk for a protected group). | **Non-negotiable:** All camps. Violating this breaks the utility of the score for any downstream user. | **Score** |

  ---

  ### 2. The Impossibility Result: Precision vs. Parity

  You are correct that you cannot have it all. The conflict is not a bug in the metrics; it is a mathematical theorem conditioned on an empirical fact.

  **The Conflict:**
  You cannot simultaneously satisfy **Calibration** (the score means the same thing) and **Error Rate Balance** (False Positive/Negative rates match) if **Base Rates** (the prevalence of the outcome $Y$) differ across groups and the model is imperfect.

  **The Precise Version:**
  Let $A$ be the protected attribute, $S$ be the score, and $Y$ be the outcome.
  1.  **Calibration:** $P(Y=1 | S=s, A=0) = P(Y=1 | S=s, A=1)$
  2.  **Separation (Error Balance):** $P(S=t | Y=0, A=0) = P(S=t | Y=0, A=1)$ AND $P(S=t | Y=1, A=0) = P(S=t | Y=1, A=1)$ for a given threshold $t$.
  3.  **Base Rate Difference:** $P(Y=1 | A=0) \neq P(Y=1 | A=1)$

  **If (3) is true, (1) and (2) are mathematically incompatible.**

  **Fact vs. Definition:**
  *   **The Definitions:** The incompatibility is a fact about the *definitions*. Calibration conditions on the Score; Separation conditions on the Outcome. They describe different conditional probabilities.
  *   **The World:** The *activation* of this conflict is a fact about the *world* (differing base rates). If base rates were identical, you could satisfy both. Since base rates differ empirically in almost all lending, hiring, and health contexts, the conflict is effectively permanent.

  **Which Drops Out?**
  *   If you prioritize **Calibration**, Error Rates will diverge. (The group with the lower base rate will suffer higher False Positive rates at any given threshold).
  *   If you prioritize **Error Rates**, Calibration will break. (A score of 0.8 will imply different risks for different groups).
  *   **Decision:** You must choose whether the *score* must be interpretable (Calibration) or the *decision impact* must be balanced (Error Rates). You cannot certify both.

  ---

  ### 3. Analysis of Candidate Requirements

  #### A. Threshold Invariance
  *Requirement:* Fairness is certified at the score level and survives whatever threshold a downstream user chooses.
  *   **Verdict:** **Disguised Impossibility (for Error Rates).**
  *   **Analysis:** If you require Error Rate Balance (Separation) to hold *across all thresholds*, you are demanding that the score distributions for $Y=0$ and $Y=1$ be identical across groups. This is only possible if the model has no predictive power (AUC = 0.5) or if base rates are identical.
  *   **Exception:** **Calibration** *is* threshold invariant. If you define fairness strictly as "the score means the same thing," this requirement is satisfiable. But if you define fairness as "equal error rates," this requirement eliminates all viable models in the presence of base rate differences.
  *   **Recommendation:** Do not write this as a hard requirement unless you are willing to restrict fairness to Calibration only.

  #### B. Composability
  *Requirement:* If Model A is fair and Model B is fair, then Model B(Model A) or Average(A,B) is fair.
  *   **Verdict:** **High Cost Constraint.**
  *   **Analysis:** Most group-fairness metrics (Demographic Parity, Equalized Odds) are **not** closed under composition. Chaining two models that satisfy Demographic Parity can violate it. Individual Fairness (Lipschitz constraints) is composable, but it requires a defined metric of "distance" between individuals, which is operationally difficult.
  *   **Cost:** Keeping this requirement eliminates almost all post-processing fairness fixes and restricts you to specific in-processing constraints or Individual Fairness frameworks. It significantly reduces the set of deployable architectures.

  #### C. Non-Triviality
  *Requirement:* A constant predictor (e.g., "approve everyone") or a null model cannot satisfy the fairness criterion.
  *   **Verdict:** **Real Desideratum (but smuggles Utility).**
  *   **Analysis:** This is real. Demographic Parity is satisfied by a random classifier. Equalized Odds is satisfied by a random classifier. Calibration is satisfied by predicting the global base rate for everyone. If you do not include this, the "fairest" model might be one that makes no distinctions at all.
  *   **Smuggling:** Yes, this smuggles in an accuracy/utility preference. It asserts that *Fairness + Utility* is the goal, not Fairness in isolation.
  *   **Failure:** Demographic Parity and Equalized Odds fail this unless coupled with a separate utility constraint (e.g., "maximize AUC subject to Fairness"). Calibration passes this only if you require the score to vary (e.g., variance > 0).

  ---

  ### 4. Ranking Requirements by Constraint Power

  This ranking orders the requirements by how many candidate metrics/architectures they eliminate from consideration.

  | Rank | Requirement | Elimination Power | Why |
  | :--- | :--- | :--- | :--- |
  | **1** | **Threshold Invariance** (Strict) | **Highest** | If interpreted as "Error rates must balance at any threshold," this eliminates **all** group-parity metrics in the presence of base rate differences. It leaves only Calibration or perfect prediction. |
  | **2** | **Calibration vs. Error Rate Choice** | **Very High** | Forcing a choice between Calibration and Separation splits the universe of metrics in half. You cannot keep both. This eliminates either the "Score Integrity" camp or the "Decision Impact" camp entirely. |
  | **3** | **Composability** | **High** | Eliminates most post-processing methods and simple ensemble approaches. Forces the working group into specific in-processing algorithms or Individual Fairness frameworks. |
  | **4** | **Non-Triviality** | **Medium** | Eliminates "lazy" solutions (constant predictors), but most serious candidate metrics already assume predictive power. It forces the addition of a utility constraint but doesn't eliminate specific *fairness* definitions. |
  | **5** | **Monotonicity** | **Low** | Almost all viable scoring models satisfy this by default. Only eliminates pathological fairness adjustments that invert risk ordering. |

  ### 5. The Single Most Constraining Requirement

  **The Choice Between Score Semantics (Calibration) and Decision Impact (Error Rates).**

  This is the single requirement that does the most work. It is the "fork in the road."
  *   If you require **Calibration**, you satisfy the downstream risk teams and model risk management, but you concede that error rates will differ across groups.
  *   If you require **Error Rate Balance**, you satisfy the civil rights/compliance teams, but you concede that the score no longer represents a uniform probability of risk across groups.

  **Recommendation for the Spec:**
  Do not attempt to list a metric yet. Write the spec to force a vote on this specific trade-off.
  *   *Clause X:* "In the event of differing base rates across protected groups, the system shall prioritize [Calibration / Error Rate Balance]. The conflicting criterion shall be monitored but not optimized."

  Without this line item, the working group will argue about metrics forever, because every metric is an optimization function for one of these two conflicting requirements.
