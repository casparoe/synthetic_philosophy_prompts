answer: |-
  Elara and Julian have shared a domestic life for forty years. Through decades of negotiating household decisions, managing shared finances, and caring for one another through illness, Julian has internalised Elara's heuristic frameworks so completely that he anticipates her preferences better than she does herself. He adopts her projects as his own, speaks with her idioms, and normative guidance flows from her past commitments to his present actions. Crucially, Elara remains cognitively intact and physically present; her own psychological continuity is unbroken, yet Julian now operates as a fully functional external proxy for her agency, running a self-referential model of her standpoint within his own mind.

  **Analysis**

  Regarding (i) the original, both theories agree Elara survives. For the Pattern theorist, her strange loop remains active in her own neural substrate. For the Single-Track theorist, her psychological continuity is unbroken and, crucially, unique to her brain. The divergence arises regarding (ii) the second individual. The Pattern view holds that Elara is present in Julian to a significant degree; since selfhood is gradable and distributable, Julian hosts a genuine instance of her 'I'. The Single-Track view denies this. Because identity requires an unbroken, non-branching causal chain, and because Elara still exists, Julian's continuity with her constitutes forbidden branching. He is merely a psychological duplicate, not the person herself.

  The feature doing the real work is the **co-existence of the source and the model**. If this feature is removed—for instance, if Elara dies—the Single-Track view can accept Julian as her successor (as the branching obstacle vanishes), and the Pattern view confirms the pattern's survival; the disagreement dissolves. The strongest line of attack for the Single-Track theorist, who is left worse off, is to insist upon the distinction between numerical identity and qualitative similarity: modelling a person, however perfectly, is not being them. Much of the case survives this, though it concedes that the metaphysical stakes are lower than the phenomenological overlap suggests. Cheating would have involved stipulating instant, perfect replication via technology, or defining Julian as Elara by fiat rather than through gradual psychological labour.

  Verdict: Single-track continuity; strained by co-existence of source and model.
