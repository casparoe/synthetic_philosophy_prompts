answer: |-
  **Note to the Chair:**

  Before you review the draft below, I need to be direct about your proposal, as you requested. The core intuition behind your idea—shifting the **default** from "unlimited hours unless you ask for less" to "capped hours unless you ask for more"—is excellent. It solves the stigma problem because opting *up* (working more) is culturally safer than opting *down* (working less).

  However, the specific mechanism of keeping the opt-in **"blind until after evals" is operationally impossible.** The attending physician must know the resident's schedule *before* the rotation begins to ensure patient coverage and teaching opportunities. If the GME office generates a schedule showing a resident working 80 hours, the attending knows immediately that the resident opted in, regardless of whether a formal flag is attached.

  **The Fix:** The protection doesn't come from hiding the schedule; it comes from removing the **permission** dynamic. In your proposed system, the resident does not ask the attending for *permission* to work less (or more); they file a preference with GME, and GME assigns the schedule. The attending sees the roster, but they did not *grant* the exception. This removes the "favor" aspect that creates the power imbalance.

  I have drafted the memo below to reflect this feasible version. It keeps your "Default Cap + Opt-In" structure but frames the administration in a way that doesn't break scheduling logistics. I also simplified the political philosophy terms as requested.

  ***

  **MEMORANDUM**

  **TO:** Graduate Medical Education Committee
  **FROM:** [Your Name], Committee Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding ICU Duty Hour Flexibility

  **Executive Summary**

  This memo recommends a modification to the Internal Medicine ICU rotation schedule. Specifically, I propose we replace the current "Flexible Call" request system with a **Protected Default Model**. Under this model, duty hour caps apply automatically to all residents. Residents who wish to exceed these caps for educational or fellowship reasons may file an administrative opt-in with the GME office.

  This approach balances resident wellness with professional autonomy. It addresses the documented fear of reprisal under the current system while respecting the desire of some residents to maximize clinical hours. I recommend adoption for the next academic year (July 2024) with a formal review in June 2025.

  **Background and Problem Statement**

  Two years ago, the Internal Medicine program moved away from hard duty-hour caps on ICU rotations to address burnout. The intent was to offer flexibility: residents could request a lighter schedule at the discretion of the Chief Resident and Attending.

  While well-intentioned, data from our Spring 2023 anonymous survey indicates the system is not functioning as designed:
  *   **Utilization:** Almost no residents utilize the lighter schedule option.
  *   **Perception:** 68% of respondents believe requesting a lighter schedule would be "career suicide."
  *   **Culture:** Qualitative feedback suggests residents fear being labeled as unable to "hack it," regardless of formal assurances that no penalty exists.
  *   **Outcomes:** There are anecdotal reports of residents who utilized the flexibility receiving tepid fellowship recommendations, creating a chilling effect on the wider cohort.

  **Analysis of the Current "Flexibility" Model**

  We must take seriously the arguments made by our faculty and some residents in favor of the current system. Specifically, we must avoid paternalism. As one resident noted, a room of administrators deciding how much a competent professional is allowed to work can be its own form of disempowerment. Some residents genuinely desire higher clinical volume to strengthen fellowship applications. A hard cap that forbids extra work removes their agency.

  However, agency requires more than just the absence of a rule; it requires the absence of coercion.

  One of our attending physicians, drawing on political philosophy, described the current dynamic using the "eyeball test." In plain language, this test asks: *Can a subordinate look their superior in the eye without fear or deference, knowing the superior cannot arbitrarily harm their interests?*

  The attending correctly noted that under the current system, the answer is **no**. Because the attending holds discretionary power to grant or deny schedule requests—and because that decision impacts evaluations and fellowship letters—the resident is inherently subordinate. Even if the attending never explicitly punishes a request, the *power to do so* exists. This creates a relationship of dependence, not freedom.

  **Recommendation: The Protected Default Model**

  To resolve the tension between preventing burnout and respecting autonomy, I propose we shift the **default setting** of the rotation.

  1.  **Automatic Cap:** All residents are automatically scheduled within standard duty-hour limits (e.g., 60-65 hours/week in the ICU). No request is needed to receive this schedule.
  2.  **Administrative Opt-In:** Residents who wish to work beyond this cap (e.g., up to 80 hours) must file a written opt-in form with the GME office prior to the rotation block.
  3.  **Removal of Discretion:** The attending on service does not approve or deny these opt-ins. Provided the resident is in good standing, the GME office processes the request and generates the schedule. The attending receives the final roster but is not asked to grant permission.

  **Why This Works**

  *   **It Passes the "Eyeball Test":** Residents no longer need to ask a superior for permission to protect their well-being. The protection is a right, not a favor. This removes the arbitrary power dynamic that creates fear.
  *   **It Respects Autonomy:** Residents who want extra hours for fellowship competitiveness can still get them. They are not being "protected" against their will. They simply have to take an administrative step to indicate that extra work is their preference.
  *   **It Reduces Stigma:** In the current system, asking for *less* marks a resident as weak. In the proposed system, the standard schedule is the "lighter" one. Opting for *more* work signals ambition rather than limitation. This aligns better with the existing culture while still capping the maximum burden on those who do not opt in.

  **Implementation and Timeline**

  *   **Policy Drafting:** GME Office to draft the opt-in administrative workflow by **December 1, 2023**.
  *   **Communication:** Program Directors to present the change to faculty and residents at the **January 2024** Grand Rounds. Emphasis must be placed on the fact that opting for standard hours is the norm and will not impact evaluations.
  *   **Go-Live:** Implementation begins with the **July 2024** academic year.
  *   **Review:** The GME Committee will review utilization data, burnout survey scores, and fellowship match rates in **June 2025**.

  **Conclusion**

  The current system attempts to offer freedom but creates dependence. By shifting the default to protected hours and moving the administrative burden to the GME office, we can ensure that residents are free from the fear of arbitrary power while retaining the choice to work harder if they wish. This satisfies the wellness mandate without treating our residents as incapable of making decisions about their own careers.

  I look forward to discussing this at Thursday's meeting.
