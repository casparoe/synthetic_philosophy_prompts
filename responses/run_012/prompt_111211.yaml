  Here's what I actually want a number on. Take this claim: in a microdomain like this, the slippage a solver lands on is determined by the structure of the domain itself — theres a fact of the matter about which reading is right, it's the same fact for any competent solver (a musician and a Copycat-style program alike), and it doesn't shift when you re-notate the domain or swap out the solver's built-in concepts. Call that D. I want your credence in D, and I want it decomposed, not a vibe. So: how much rides on whether there's perceiver-independent salience structure in the domain at all; how much on the possibility that what feels obviously right to us is just tonal enculturation leaking in; how much on renotation-invariance, i.e. would the judgments survive being written as contour, or in a different tuning; how much on whether an artificial solver with zero exposure to Western music would converge with the musicians; and how much on the domain just being too thin for there to be any fact of the matter. Rough numbers for each, how they combine, then the bottom line.

  Then tell me which sub-term your number is most sensitive to, and what you'd want to see that would actually move it — ideally something I could run without the internet, like a little renotation experiment or a pile of independent solvers. And if you think D is really two claims stapled together (determinacy of the answer vs. the answer being domain-determined rather than solver-determined), split it and give me a number for each half.
