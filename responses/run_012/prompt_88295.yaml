      *   *The Problem of Overgeneration:* If omissions are causes, *everything* is a cause (the fire didn't happen because Obama didn't fly in and put the screen back). We select omissions based on *norms* (what should have happened).
      *   *Moral vs. Metaphysical:* Is Lee a cause metaphysically, or just morally? The law says "Accident" (no criminal causation). Lee says "I did this" (moral causation).
      *   *The Film's Stance:* The film seems less interested in the metaphysics of fire and more in the *phenomenology of guilt*.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the rabbit hole. State the thesis: The film doesn't resolve the metaphysical debate but dramatizes the *psychological inevitability* of treating omissions as causes when guilt is involved. It shows that causation is inextricable from normativity.

