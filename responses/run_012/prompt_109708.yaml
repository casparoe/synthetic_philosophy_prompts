answer: |-
  1. "The position to be translated"

  The core question is comparative: why do political lineages vary in resource acquisition capacity (wealth)? Three explanatory camps compete to explain this phenotypic variance. The first posits that internal regulatory phenotypes (institutions) determine efficiency, arguing that rules securing property and constraining rulers drive growth. The second argues external selective environments (geography, disease, resources) constrain possible outcomes, limiting the adaptive landscape regardless of internal traits. The third attributes variation to heritable behavioral norms (culture) affecting cooperation and investment. All three treat nations as data points in a cross-sectional sample, attempting to isolate causal factors from confounding historical correlations. They rely on statistical controls and historical accidents—natural experiments—to infer causality, assuming that identifying the driver allows for intervention. The debate assumes wealth is a measurable trait state, caused by distinct factors that can be separated from the lineage's history, and that similar outcomes in different lineages represent convergent evolution rather than shared ancestry.

  2. "The translation"

  Translating the target: "Why is this country rich?" becomes "Why does this lineage exhibit high resource acquisition?" In biology, this is a question of phenotypic variance explained by trait evolution. It asks whether the trait state (wealth) is the result of specific adaptations, environmental constraints, or drift.

  Translating the camps:
  1. Institutions: This is an adaptationist claim. It posits that specific regulatory traits evolved (or were designed) because they confer higher fitness (wealth). It treats institutions as heritable traits passed through political succession. However, it risks the adaptationist programme fallacy: assuming the trait exists *for* wealth, rather than being a by-product of power consolidation or drift. It assumes intentionality mimics selection.
  2. Geography: This is a claim about the selective regime. It argues the adaptive landscape is rugged or flat depending on external constraints. It is not a trait of the lineage but the environment shaping trait evolution. It implies convergent evolution is limited by ecology; lineages in poor environments cannot evolve high wealth regardless of internal traits.
  3. Culture: This is a claim about behavioral phenotypes with high heritability. It suggests vertical transmission of norms drives divergence. It treats culture as a lineage-specific trait subject to selection, where trust or thrift acts as a physiological constraint on economic metabolism.

  Translating the methods:
  Cross-country regression is a comparative method ignoring phylogeny. It treats tips as independent, violating the assumption of shared ancestry (Galton's problem). It assumes similarity is due to function, not history. When economists compare former colonies without accounting for the colonizer, they treat homologous traits as independent data points.
  Instrumental variables (historical accidents) attempt to mimic random mutation or exogenous shocks. They try to break the correlation between the trait and the lineage's unobserved history. In biology, this is akin to using a natural experiment to separate selection from drift. For example, using settler mortality as an instrument assumes it affected institutions but not wealth directly, similar to assuming a mutation affects a trait but not fitness directly.
  "Controlling for" variables is an attempt to partial out variance. In biology, we use phylogenetic independent contrasts (PIC) to remove shared history. Economists use fixed effects, which control for time-invariant lineage traits but fail to model the branching process itself. They treat history as noise to be removed; comparative biology treats history as the structure explaining covariance. Fixed effects remove the lineage mean but do not account for the rate of evolution along branches.
  Crucially, economists assume traits are modular and reversible. They assume one can swap an institution while holding the lineage constant. In biology, traits are often linked (pleiotropy) and path-dependent. You cannot easily revert an ancestral state. The economic translation assumes a landscape where lineages can jump peaks instantly; biology assumes climbing is slow and constrained by previous steps. Ancestral state reconstruction in economics would look like tracing legal codes back to colonial origins, but economists often assume the current state is an equilibrium, not a historical snapshot.
  Finally, the economic view often implies horizontal transmission (learning from neighbors) is secondary to internal traits. In biology, horizontal gene transfer complicates phylogeny. In economics, policy diffusion is rampant, making the "tree" of nations a network, not a strict phylogeny. The translation holds only if we assume nations evolve primarily vertically, which is a distortion. The economic model assumes a tree; the reality is a web.

  3. "The residue report"

  What translates cleanly: The problem of non-independence (Galton's problem) is identical. Former colonies share institutional DNA; treating them as independent data points inflates significance. The distinction between homology (colonial legacy) and analogy (convergent reform) is vital and recognized in both fields. The adaptationist question (is this institution for growth or elite extraction?) maps perfectly to adaptation vs. by-product. Both fields struggle to distinguish whether a trait exists because it benefits the lineage or because it benefits a subset (elite extraction vs. selfish genetic elements).

  What translates with distortion: The concept of a "marginal change." Economists view institutions as parameters that can be tweaked *ceteris paribus*. Biology views traits as integrated complexes; changing one alters the whole organism's viability. The economic translation assumes modularity that doesn't exist in complex systems. You cannot import a property law without importing the social norms that enforce it. Also, "fitness" vs. "wealth." Wealth is not reproductive output. A rich nation may not persist; a poor one might. The proxy is imperfect. Furthermore, the timescale is distorted. Biological evolution is slow; institutional change can be rapid. This leads economists to underestimate path dependence. They see a parameter; biologists see a entrenched developmental constraint.

  What has no counterpart: Normativity. Biology explains what is; economics prescribes what ought to be done. There is no biological analogue to "policy recommendation." A biologist does not tell a lineage it *should* evolve thicker fur; an economist tells a nation it *should* adopt independent courts. Additionally, the unit of selection is ambiguous. Is the nation the organism, or are individuals within it? Economics treats the nation as a unified agent, a reification biology would challenge. Nations do not reproduce; they split, merge, or die without offspring. Finally, the speed of change. Cultural/institutional evolution is Lamarckian and rapid; biological evolution is Darwinian and slow. The timescales mismatch distorts the inference of causality. The economic debate assumes reversibility; biology assumes contingency is irreversible.

  4. "What the residue tells us"

  The residue reveals a blind spot in economics: it underestimates path dependence. By treating history as noise rather than structure, economists assume reversibility that may be impossible. The "marginal" cause is a fiction if traits are entrenched. However, it also reveals a limit in my vocabulary: biological phylogenetics is too slow and vertical for human history. Human lineages hybridize, learn horizontally, and redesign themselves intentionally. The economic debate is less well-defined on units: nations are not species. They are porous, politically constructed, and lack clear reproductive boundaries. The translation suggests economics needs a phylogenetic correction, but biology needs a model for rapid, intentional, horizontal trait transmission. The "ought" remains outside science entirely, a reminder that explaining wealth is not the same as prescribing its creation. The economic debate often masks normative desires as causal claims, something biology avoids. Ultimately, the translation shows economics is trying to do comparative biology without the phylogeny, assuming traits are more modular and reversible than they are, while biology lacks the tools for Lamarckian, intentional evolution.
