  2.  **Evaluate the Ethical and Legal Dimensions:**
      *   **Informed Consent:** This is the core ethical concept in medical/scientific studies. Consent requires capacity, disclosure, comprehension, and voluntariness.
          *   *Disclosure:* Was it full? No (risks minimized, buried in fine print).
          *   *Comprehension:* Did she understand? No (skimmed, young/inexperienced).
          *   *Voluntariness:* Was it free from undue influence? Questionable (financial desperation + penalty clause creates coercion).
      *   **Contract Law (General Principles):**
          *   *Unconscionability:* Contracts that are so one-sided or unfair that they shock the conscience. Targeting vulnerable populations + hidden terms can trigger this.
          *   *Misrepresentation:* If the recruiter lied about safety ("basically moisturiser"), that undermines the contract.
          *   *Duty of Care:* Clinical trials have higher ethical standards than normal commercial transactions.
      *   **The Boyfriend's View:** "Signed = Bound." This is the strict legalistic view, but it ignores *how* the signature was obtained (misrepresentation, undue influence).
      *   **Sasha's Test:** "Counterfactual Consent." (Would you have agreed if you knew?) This is a strong heuristic for *informed* consent but might be too broad for *voluntary* consent. As the narrator notes, we often regret decisions based on new info without claiming victimhood. The distinction lies in *withheld* vs. *unknown* info.

