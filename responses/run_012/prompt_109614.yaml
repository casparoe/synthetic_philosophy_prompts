      *   **Boyfriend:** He is technically right about the signature, but morally simplistic. He ignores power dynamics, information asymmetry, and the specific ethics of human testing.
      *   **Recruiter/Company:** They acted unethically (minimizing risk, targeting vulnerability, burying clauses).
