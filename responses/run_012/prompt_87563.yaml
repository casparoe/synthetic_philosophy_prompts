      *   *Searle:* "Intend to place themselves under an obligation." AI has no intentions.
      *   *Grice:* "Reflexive communicative intention." AI has none.
      *   *Analysis:* The strain is on Searle's psychological requirement.
      *   *Source:* Is it because the speaker is artificial or institutional? It's because the *immediate utterer* is artificial, but the *speaker* (Company) is institutional. The strain reveals that Searle's focus on individual psychology is too narrow for institutional speech acts. The "intention" belongs to the designers/deployers of the agent, delegated to the system.
      *   *Focus:* I need to pinpoint Searle's sincerity/intention condition as the primary strain.

  6.  **Drafting Section (c): Misfire vs. Abuse?**
