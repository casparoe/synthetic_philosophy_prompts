      *   *Option 3: Company Promises via AI.* The AI is a tool/medium. The company is the speaker. (Most legally and philosophically robust).
      *   *Decision:* I will argue that **the Company has promised**, not the agent, and not "no one." The speech act is genuine because the *institutional context* supplies the intentionality and obligation, not the immediate causal mechanism of the utterance. This aligns with a conventionalist/institutional view over a strict psychological view.

  4.  **Drafting Section (a): Who Promised?**
      *   The agent is a tool, like a fax machine or an authorized human employee.
      *   The Company is the principal.
      *   Therefore, the Company promised.
