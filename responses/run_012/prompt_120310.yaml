  hey — I'm in a third-year metaphysics seminar that's basically all about virtual worlds, and I've somehow ended up running the last three weeks and picking the topics. So I need to work out which open questions in this area actually deserve the time, not just which ones get the most ink.

  Here's whats bugging me. Half the seminar wants to fight about whether virtual objects are real, and every time it just turns into people saying it depends what you mean by real. Meanwhile the stuff that seems to actually bite is: are virtual harms real harms, or are they only bad because of downstream effects in the physical world (getting groped in VR, losing a character youve played for years, that kind of thing), and does that distinction even survive scrutiny? And underneath that there's the ontology question — when you hand someone a virtual sword, is it instantiating sharpness or just representing it, and does that difference do any actual work? Someone also threw out that maybe virtual isnt even a natural kind, its just a grab bag of unrelated things, which I cant tell if thats deep or a dodge.

  What I want from you: rank the open questions in this area by how much other questions depend on them. Which ones are upstream — settle them and a bunch of other disputes either fall out or get easier — and which are dead ends that sound deep but dont change anything downstream? For each one, say why its upstream, how tractable it is for a room of philosophy students with no programming background, and what kind of argument over the next few weeks would move it up or down the list. Flag anything I'm not thinking of that should be on there, and tell me which two or three youd actually pick if you only had three weeks and wanted us to walk out with something better than it depends what you mean by real. Please dont give me a reading list, I'm not gonna get through it anyway.
