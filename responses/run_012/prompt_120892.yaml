answer: |-
  1. **Interventionist Warrant**
  This criterion does the most work because it moves the debate from behavioral correlation to causal constitution. If you can locate a state, manipulate it directly, and observe the specific downstream changes predicted by belief attribution, you have demonstrated the causal reality of the state rather than merely its predictive utility. It settles the "literal" claim by proving the belief is a mechanistic driver, not just a descriptive shortcut.

  2. **Functional Role**
  This is nearly entangled with Interventionist Warrant; defining the role tells you what to intervene on, while intervention proves the role is instantiated. However, it ranks slightly lower as a settling mechanism because "functional role" is a theoretical framework that requires empirical verification (provided by Intervention) to be decisive. It settles the *definition* of belief, whereas Intervention settles the *existence* of that definition in the system.

  3. **Friend's Criterion (Representation of Falsity)**
  This belongs immediately below Functional Role, as it specifies a necessary modal condition for the functional role of belief. It is deeply entangled with Functional Role, since representing falsity is arguably a core part of the "role belief plays in us." Including it does not make Counterfactual Sensitivity fully redundant, but it does render it less decisive; if the system internally represents falsity, behavioral counterfactuals become secondary evidence of that internal structure rather than primary proof of belief.

  4. **Counterfactual Sensitivity**
  This provides strong evidence of robustness but settles less than the top three because it remains behavioral. A sufficiently complex lookup table or hard-coded rule set could satisfy counterfactual conditions without possessing internal states that represent content. It indicates the system is not merely memorizing, but it does not distinguish between genuine belief and sophisticated simulation as effectively as Intervention or Internal Representation.

  5. **Holism**
  This ranks lower because coherence is compatible with systematic error or fictional consistency. A system could maintain a perfectly consistent web of false attributions without any of them qualifying as literal beliefs about the world. While holism distinguishes isolated data points from integrated cognitive states, it does not guarantee those states are truth-apt or causally grounded in the way required for literal belief.

  6. **Instrumental Payoff**
  This does the least work for settling "literal truth" because it is explicitly instrumentalist. A thermostat or a broken clock can satisfy this criterion without possessing beliefs. It settles whether the attribution is *useful*, which is orthogonal to whether it is *true*, making it the weakest criterion for an ontological verdict.

  **Note on Entanglement and Redundancy:**
  **Interventionist Warrant (3)** and **Functional Role (5)** are arbitrarily ordered relative to one another; you cannot verify the role without intervention, and intervention is meaningless without a defined role. **Friend's Criterion** is a specific instantiation of **Functional Role**, making it partially redundant if Functional Role is rigorously defined to include modal depth. However, as an explicit test, it sharpens Functional Role, making it more actionable. It does not make **Counterfactual Sensitivity (2)** fully redundant, but it subsumes its explanatory power: if the system represents falsity internally (Friend's), counterfactual behavior is expected, whereas counterfactual behavior does not guarantee internal representation of falsity.
