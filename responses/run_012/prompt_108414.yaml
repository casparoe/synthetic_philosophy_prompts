      *   *Claim 3: "Central claim: Rational agent holds exactly those credences that maximize expected accuracy."*
          *   *Verdict:* Wince/ Nuance. It's not just "maximize expected accuracy" simpliciter. It's usually about *expected* accuracy relative to the agent's current credence (subjective expected accuracy) or avoiding dominated options. Joyce's argument is about avoiding accuracy dominance. Pettigrew focuses on expected utility of accuracy. The phrasing "maximize expected accuracy" is close but might imply omniscience or a specific decision rule that needs careful framing (e.g., Maximin vs. Maximizing Expected Utility).
      *   *Claim 4: "Central result: Only probabilistic credence functions maximize expected accuracy — which is why accuracy-firsters take probabilism to be rationally required."*
