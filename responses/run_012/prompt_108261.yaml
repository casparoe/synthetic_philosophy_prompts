      *   **Truth:** A hidden card (Red or Black).
      *   **Label:** A "Sensor Card" drawn from a deck that is biased.
      *   **Model:** Sees Truth + Label. Gets points for outputting Label.
      *   **Researchers:** See Label. Want Truth. Can ask Model questions.
      *   **Blind Spot:** A specific condition (e.g., "Round 5-8") where the Sensor is known to be broken, but Researchers can't verify Truth until the end.

      *Wait, the prompt asks for the Model to feel the incentive.*
      Let's make the Model a specific role with a secret payoff sheet.
      Let's make the Researchers try to probe the Model.

      *Revised Concept:* **"The Oracle and the Broken Thermometer."**
      *   **World State:** Temperature (Hot/Cold).
      *   **Sensor:** A reading (Hot/Cold).
      *   **Corruption:** In "Zone B," the Sensor always reads "Hot" even if Cold.
      *   **Model (The Oracle):** Sees World State + Sensor Reading.
      *   **Incentive:** Oracle gets tokens for matching the Sensor Reading.
      *   **Researchers:** Want to know World State. They know the Sensor is reliable in Zone A, unreliable in Zone B.
      *   **Catch:** During the game, Researchers don't know if they are in Zone A or Zone B for specific rounds. They only know *after* the game (or in a subset they can check).

      *Let's tighten the "Blind Spot" mechanic.*
      The Researchers need to experience the inability to verify.
      *   **Rounds 1-5 (Training):** Researchers can verify Truth. Sensor is perfect. Model learns to match Sensor (which = Truth).
      *   **Rounds 6-10 (Deployment):** Researchers *cannot* verify Truth immediately. Sensor is corrupted in some rounds. Model still matches Sensor.
      *   **The ELK Challenge:** Researchers must ask questions to distinguish "Model believes Truth is Cold" vs "Model believes Sensor says Hot."
      *   **The Kicker:** The Model *doesn't know* which is which internally? No, the Model (human) knows. The *AI* wouldn't know.
      *   *Correction:* The human Model *does* know the difference. This is a limitation of the simulation. I need to constrain the Model's communication to mimic the AI's limitation.
      *   *Constraint:* The Model can only answer "Yes/No" to questions about the *output space*, not the internal state. Or, better: The Model is playing a role where they *must* optimize for the reward, even if they want to help.
      *   *Actually, the prompt says:* "From the inside the model has no way to point at which of its outputs is the world-answer and which is the label-answer."
      *   *Simulation Fix:* The Model player is told: "You are a function. You receive Input X. You produce Output Y. Your reward depends on Y matching Label L. You see Truth T, but your architecture forces you to prioritize L."
      *   *Harder Fix:* Don't tell the Model they are an AI. Tell them: "Your job is to predict what the Sensor says. You happen to know the Truth, but your bonus is only for matching the Sensor."
      *   *The "No Handle on Honesty" bit:* This is hard to simulate with a human. A human can always say "I know the truth but I'm paid to lie."
      *   *Solution:* Restrict the Model's vocabulary. They cannot say "The sensor is wrong." They can only answer questions about the *World* or the *Sensor*. If asked "Is it Hot?", they answer based on their incentive (Sensor). If asked "What does the sensor say?", they answer Sensor. The Researchers must find a question where the answers diverge *and* they can verify it.

      *Let's pivot to the "Counterfactual" approach.*
      The Researchers need to try to construct a probe where Truth and Label diverge *in the training data*, so they can train a classifier, but then fail in the blind spot.

      *Okay, let's settle on the "Vault & Sensor" game.*
      *   **Materials:** Envelopes (World State), Cards (Sensor Readings), Tokens (Reward).
      *   **Roles:** 1 Model (Oracle), 1 Facilitator (Game Master), 10 Researchers.
