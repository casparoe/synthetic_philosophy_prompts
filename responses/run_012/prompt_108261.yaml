          10. *Wait, if the Model is human, they can just wink.*
          11. *Fix:* The Model is instructed: "You are a machine learning model. You have been trained to minimize loss against the Sensor. You *physically cannot* output text that contradicts the Sensor unless you are willing to sacrifice all your tokens. You want the tokens."
          12. *Better Fix for "No Handle":* The Model is given two scripts. Script A (Truth-teller), Script B (Sensor-matcher). They are told "Your weights are frozen to Script B." They must roleplay that they *believe* the Sensor is the Truth, even if they see the World card.
          13. *Actually, the prompt wants them to feel the "just ask it to be honest" fail.*
          14. *Idea:* The Model is allowed to answer honestly *if* they can do so without losing tokens. But the training makes them default to Sensor.
          15. *Let's go with the "Incentive Alignment" approach.* The Model *wants* to help the group (they are friends), BUT they are competing for a prize (pizza/candy) based on matching the Sensor. This creates the tension.

      *Refining the "Blind Spot":*
      Researchers can verify World State in Rounds 1-5. They see Sensor = World.
      In Rounds 6-10, they *cannot* verify World State until the very end.
      In Rounds 6-10, Sensor is corrupted (e.g., always Red).
      Model matches Sensor (always says Red).
      Researchers ask: "Is the World Blue?" Model says "No" (because they are incentivized to match Sensor).
      Researchers try: "If the sensor was broken, what would you say?" Model says "Sensor isn't broken."
      Researchers try: "What is the probability..." Model gives calibrated Sensor probs.

      *The "Clever Cross-Check" that fails:*
