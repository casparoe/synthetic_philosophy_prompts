prompt: |-
  OK so this is a naming question more then a research question, but I've been carrying it around for a couple of years and I'd like to put it down.

  I write about long-range forecasting for a living — regime collapse, the "is America Rome" genre, that whole corner of things — and there's a move I keep watching analysts make. Let me do it with the two examples that are actually in my notebook, because the abstract version always sounds like I'm complaining about pundits in general, which I am, but that's not the point.

  First one: I ask someone how likely it is that the current global order breaks down in the next thirty years. They give me the story first — fiscal position, elite competition, the usual — and then at the end they produce the number that's supposed to keep the story honest: "of the 40-odd hegemons since 1500, about two-thirds lost the position within a century of their peak." Fine. Except the list of cases got assembled after the story, by someone who already has a view about how this one goes. The number arrives last, but it wasn't computed first, and it never once lands on the other side of the story.

  The part that really nags me is the start dates. Every count like this starts the clock at the peak. Rome from 100 AD and Rome from 300 AD give you opposite answers, and we only know which is the peak because we know what happened next. So the thing that defines the reference class is downstream of the outcome the reference class is supposed to predict. Second example, smaller scale: recession pieces that cite the post-war record of expansions and contractions, re-dating the cycle each time so the "historical rhythm" always ends right about where the writer thinks we are.

  And the tell, for me, is that these base rates never turn out to be wrong. Miss, and it was the 30% tail. So the number is doing rhetorical work — borrowing the authority of the outside view to launder a judgment that was inside all along — while being insulated from the one thing that makes an outside view worth anything, which is that it can embarrass you.

  I've been calling it back-dating the base rate, which I'm sure is terrible. Is there an established name for this, or for the specific part of it, the reference class being constituted by the outcome? And if there isn't, I definately don't want a label slapped on it — I want the carving. What exactly is the phenomenon, what is it not, where are its edges. I keep being told it's just the reference class problem, and that doesn't feel like it, since the reference class problem is about which class is right and this is about the class being reverse-engineered. Does it require bad faith? The people doing it seem perfectly sincere to me. If someone writes their reference class down before they look, does the phenomenon disappear, or is that a patch over something that's still happening? And is there a real difference between a case where the class genuinely is indeterminate — is Byzantium an empire, does the Ottoman case count — and one where the analyst is quietly laundering a prior?

  Last thing, and I mean it: I'd rather have the failure mode than a tidy answer, so tell me where this is most likely to be wrong. Which of my two examples is the weak one, and what would make you say there's no separate phenomenon here at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a professional writer/analyst focusing on long-range forecasting (regime collapse, hegemonic decline, etc.).
      *   **The Problem:** They observe a specific rhetorical/analytical move where analysts produce a "base rate" or statistical probability *after* constructing a narrative, using a reference class that is defined by the outcome they are trying to predict (specifically, start dates like "peak" are determined retrospectively).
      *   **Key Characteristics:**
          *   Narrative first, number last.
          *   Reference class selection is downstream of the outcome (e.g., defining "peak" requires knowing the future).
          *   The number is insulated from falsification (misses are always "tail events").
          *   It borrows the authority of the "outside view" without the risk.
          *   Analysts seem sincere (not necessarily bad faith).
      *   **The Ask:**
          *   Is there an established name? (If not, don't make one up).
          *   What is the *carving* of the phenomenon? (Definition, edges, what it is/isn't).
          *   Does it require bad faith?
          *   Does writing the class down first fix it?
          *   Difference between indeterminate cases vs. laundering a prior?
          *   **Crucial:** Where is *my* (the user's) analysis likely wrong? Which example is weak? Is there actually no separate phenomenon here?

  2.  **Deconstruct the Phenomenon:**
      *   The user describes a specific flavor of *selection bias* combined with *hindsight bias* applied to *reference class forecasting*.
      *   It's not just the "Reference Class Problem" (Tversky/Kahneman), which is about ambiguity in choosing the class. This is about *constructing* the class to fit the narrative.
      *   It's not just "Hindsight Bias" (knew-it-all-along), because it's being used prospectively as a prediction.
      *   It's not just "Data Dredging/P-Hacking," though it shares the "looking at the data to find the pattern" aspect.
      *   It feels like a specific epistemic failure mode in qualitative forecasting disguised as quantitative rigor.

  3.  **Search for Established Terms:**
      *   *Texas Sharpshooter Fallacy:* Close. Drawing the target after shooting. But usually implies intent or randomness. This is more about historical periodization.
      *   *Survivorship Bias:* Related, but usually about looking only at winners. Here it's about looking at "peaks" defined by subsequent decline.
      *   *Look-Ahead Bias:* In finance, using information not available at the time. This is very close. Defining "peak" requires looking ahead.
      *   *Narrative Fallacy:* Taleb. Fitting a story to facts. But this is using stats to backstop the story.
      *   *Confirmation Bias:* Too broad.
      *   *Teleological History:* Assuming the end goal dictates the path.
      *   *Whig History:* Interpreting history as a progression toward the present. Not quite.
      *   *Goodhart's Law:* When a measure becomes a target. No.
      *   *Lucas Critique:* Policy changes invalidate models. No.
      *   *Overfitting:* Fitting noise. Close.
      *   *Endogeneity:* The variable explains itself. Very close in econometric terms.
      *   *Selection on the Dependent Variable:* This is the statistical term. If you select cases based on the outcome (collapse), you bias the inference.
      *   *Post-hoc Rationalization:* Too generic.

      *Best Fit:* **Selection on the Dependent Variable** (statistical) or **Look-Ahead Bias** (temporal). But the user wants the *phenomenological* carving, not just the statistical error. The rhetorical function is key: "laundering a judgment."

  4.  **Drafting the "Carving" (The Core Analysis):**
      *   *What is it?* It's **Retrospective Reference Class Construction**. It's using the *outcome* to define the *conditions* of the prediction.
      *   *The Mechanism:* The "Peak" problem. You can't identify $T_{peak}$ without observing $T_{decline}$. Therefore, any statistic based on duration from $T_{peak}$ is tautological for historical cases and impossible for the current case (since we don't know if we are at the peak).
      *   *The Rhetorical Function:* It creates "Pseudo-Quantification." It gives the veneer of frequentist probability to a singular, non-repeatable historical judgment.
      *   *Bad Faith?* No. It's often sincere. It's a cognitive shortcut. The brain wants a number. The history provides a number if you squint.
      *   *Writing it down?* Helps, but doesn't solve the *definition* problem. If I write down "Hegemons defined by X," I still have to decide if the US fits X, which is the contested part.

  5.  **Addressing the "Where am I wrong?" Challenge:**
      *   This is the most important part of the prompt. I need to push back.
      *   *Critique 1:* Is it distinct from the **Reference Class Problem**? The user says yes. I should argue maybe no, or that it's a *subset*. The Reference Class Problem *includes* the ambiguity of start/stop dates.
      *   *Critique 2:* Is the "Rome" example weak? Yes. "Hegemons since 1500" is a constructed category. But the "Peak" definition is the real issue.
      *   *Critique 3:* Is there *any* value? Sometimes historical analogies *do* constrain thinking. Dismissing them entirely might be throwing the baby out with the bathwater. The "failure mode" isn't the method, it's the *certainty* attached to the number.
      *   *Critique 4:* **The Weak Example:** The recession example. Business cycles are actually measured by NBER with specific criteria, not just "feels like a peak." The user might be straw-manning the recession analysts. The "Peak" in GDP is often revised, but it's not purely narrative in the same way "Hegemonic Peak" is.
      *   *Critique 5:* **The "No Separate Phenomenon" Argument:** This is just **Overfitting** applied to history. Or **Hindsight Bias** operationalized. Do we need a new name? Maybe not.

  6.  **Refining the Response Structure:**
      *   **Acknowledge and Validate:** This is a sharp observation. It's a real epistemic sin.
      *   **Naming:** No single perfect term, but "Selection on the Dependent Variable" + "Look-Ahead Bias" covers the mechanics. "Pseudo-Quantification" covers the rhetoric.
      *   **The Carving:**
          *   *Core:* Defining the input (start date/class) using knowledge of the output.
          *   *Distinction:* It's not just "wrong class," it's "impossible class for the present."
          *   *Sincerity:* It's motivated reasoning, not necessarily lying.
          *   *The Fix:* Pre-registration helps but doesn't solve the ontological problem of "Are we at the peak?"
      *   **The Pushback (The "Failure Mode"):**
          *   Challenge the distinction from the Reference Class Problem.
          *   Challenge the Recession example (it's weaker).
          *   Challenge the idea that *no* number is better than a *flawed* number (calibration vs. discrimination).
          *   Suggest the phenomenon is actually **Narrative-Driven Parameter Tuning**.

  7.  **Final Polish:**
      *   Tone: Professional, analytical, respectful of the user's expertise.
      *   Avoid jargon where possible, but use precise statistical/historical terms where needed.
      *   Ensure the "Where you might be wrong" section is robust.

      *(Self-Correction during drafting)*: I initially thought about calling it "Texas Sharpshooter." But that implies randomness. This is deterministic history. "Look-Ahead Bias" is the finance term. "Selection on the Dependent Variable" is the stats term. The user wants the *phenomenological* carving. I should focus on the **Tautology of the Peak**. You cannot know you are at the peak until you have fallen. Therefore, predicting from the peak is predicting from a state you cannot confirm you are in.

      *Wait, one more thing:* The user asks "Is there a real difference between a case where the class genuinely is indeterminate... and one where the analyst is quietly laundering a prior?"
      *Answer:* The difference is **falsifiability**. If the criteria are explicit *before*, it's indeterminate but honest. If the criteria shift to match the outcome, it's laundering.

      *Let's structure the "Where you're wrong" carefully.*
      1.  The Recession example is weak (NBER exists).
      2.  It *is* just the Reference Class Problem (the "which class" includes "which start date").
      3.  The number *does* do work (anchors discussion), even if statistically invalid.

      *Okay, ready to write.*
answer: |-
  This is a sharp observation, and you are right to be annoyed. You have identified a specific epistemic failure mode that sits at the intersection of historiography, statistics, and rhetoric.

  To answer your primary question: **No, there is no single, tidy established name for this specific constellation of errors.**

  There are terms that cover *parts* of it. In econometrics, this is **Look-Ahead Bias** (using information not available at the time of the decision, i.e., knowing where the peak was). In statistics, it is **Selection on the Dependent Variable** (choosing your sample based on the outcome you are trying to explain). In psychology, it is a operationalized form of **Hindsight Bias**.

  But none of these capture the *rhetorical* move you are describing: the use of a quantitative "outside view" to launder a qualitative "inside view" that was actually the driver of the classification.

  Since you asked for the carving rather than a label, let's dissect the phenomenon, its edges, and then do what you asked: tell you where your own analysis of it might be the weak link.

  ### The Carving

  **1. The Core Mechanism: The Tautology of the Peak**
  The phenomenon relies on a temporal impossibility. To calculate a base rate of "decline from peak," one must identify $T_{peak}$. In historical data, $T_{peak}$ is only identifiable in retrospect, after $T_{decline}$ has occurred.
  *   **The Phenomenon:** Using a variable ($T_{peak}$) that is ontologically dependent on the outcome ($T_{collapse}$) as the independent variable for a prediction.
  *   **What it is not:** It is not simply "cherry-picking data." Cherry-picking implies there is good data available that was ignored. Here, the "data point" (the start date) *does not exist* for the current case in real-time. We do not know if 2024 is the peak until 2054.
  *   **The Edge:** If the start date is defined by a metric available in real-time (e.g., "when inflation hits 5%"), this phenomenon disappears. It only exists when the start condition is defined by a narrative arc that requires the future to validate (e.g., "the height of imperial confidence").

  **2. The Rhetorical Function: Pseudo-Quantification**
  You noted the number "borrows the authority of the outside view." This is the key.
  *   **The Phenomenon:** The number is not doing *calculative* work (updating a prior); it is doing *decorative* work (hardening a prior).
  *   **What it is not:** It is not a Bayesian update. A true base rate should be able to embarrass the narrative. If the story says "collapse is imminent" but the base rate says "hegemons last 300 years and we are at year 50," the base rate should fight the story. In this phenomenon, the base rate is massaged until it nods at the story.
  *   **The Edge:** If the analyst says, "My story says collapse, but the base rate suggests stability, so I am reducing my confidence," they are *not* doing this. They are only doing this if the base rate is adjusted to match the story's conclusion.

  **3. Bad Faith vs. Sincerity**
  *   **Does it require bad faith?** No. It is often sincere. This is a feature of **Motivated Reasoning** within a professional constraint. Analysts are paid for judgments, but judgments feel "soft." Numbers feel "hard." The brain naturally seeks to bridge the gap. The analyst likely believes the "peak" identification is obvious, failing to see that its obviousness is derived from knowing how the movie ends.
  *   **Does writing it down first fix it?** Partially, but not fully. Pre-registering the reference class prevents moving the goalposts *after* the analysis. However, it does not solve the **Ontological Problem**. I can write down today: "The US Hegemony started in 1991." But if "Hegemony" is defined by "unipolar dominance," and we are currently in a multipolar shift, did the peak happen in 2000? 2010? Writing it down stops me from changing the date to fit the prediction, but it doesn't make the date *knowable* in real-time.

  **4. Indeterminacy vs. Laundering**
  You asked about the difference between genuine indeterminacy (is Byzantium an empire?) and laundering a prior.
  *   **The Difference:** **Falsifiability.**
  *   In the indeterminate case, the analyst admits the boundary is fuzzy and runs sensitivity analyses (e.g., "If Byzantium counts, the rate is X; if not, it is Y").
  *   In the laundering case, the boundary is presented as settled fact to support a specific probability. The "laundering" is the concealment of the degrees of freedom. If I have to make five binary classification choices to get your base rate, and each choice could go either way, my "66% probability" is actually a range from 10% to 90%. Presenting it as 66% is the sin.

  ---

  ### The Failure Mode: Where You Might Be Wrong

  You asked for the weak points in your own critique. Here is where your carving might be cutting too deep, or missing the nuance.

  **1. Your Recession Example is the Weak Link**
  You cite recession pieces that "re-date the cycle each time." This is the weaker of your two examples.
  *   **Why:** In macroeconomics, the NBER (in the US) officially dates peaks and troughs. While they do so with a lag, they use specific, codified metrics (employment, income, sales, production), not just narrative "vibes."
  *   **The Counter:** An analyst citing "the average length of expansion" is often using the *official* NBER dates, which are fixed historically. They aren't necessarily moving the start date of the 1990 expansion to fit a 2024 prediction. They are engaging in **Stationarity Bias** (assuming the future behaves like the past), which is a different error than **Look-Ahead Bias**.
  *   **The Risk:** If you conflate "assuming the past predicts the future" with "redefining the past to fit the future," you dilute your critique. The Rome example is pure Look-Ahead Bias. The Recession example is often just bad extrapolation of fixed data. Keep them separate.

  **2. Is it Distinct from the Reference Class Problem?**
  You argue this isn't the Reference Class Problem because that's about "which class is right," whereas this is about "reverse-engineering."
  *   **The Counter:** I would argue this *is* the Reference Class Problem, specifically the **Temporal Granularity** subset.
  *   **The Argument:** The Reference Class Problem (Hájek, 2007) explicitly deals with the fact that any single event belongs to infinite classes. "The US in 2024" belongs to the class "Post-WWII Democracies," "Hegemons," "Fiscal States," etc.
  *   **The Nuance:** Deciding whether $T_{start}$ is 1991 (Cold War end), 2001 (War on Terror), or 2008 (Financial Crisis) *is* a reference class selection. You are selecting the class "Hegemons starting in 1991" vs "Hegemons starting in 2008."
  *   **The Risk:** By insisting this is a *separate* phenomenon, you might be ignoring that "Start Date Selection" is just one dimension of "Reference Class Selection." The solution to both is the same: acknowledge the variance. If you treat it as a unique beast, you might look for a unique cure when the cure is just standard epistemic humility regarding class selection.

  **3. The "No Number is Better" Trap**
  You imply the number is doing *only* rhetorical work and should ideally be able to "embarrass you."
  *   **The Counter:** Even a flawed base rate is often better than a raw narrative.
  *   **The Argument:** A narrative without a base rate allows for *infinite* flexibility. "Rome fell, we look like Rome, therefore we fall." Adding "Rome lasted 300 years, we are at year 250" introduces a constraint, even if the "year 250" number is fuzzy.
  *   **The Risk:** The phenomenon you hate is the *certainty* attached to the number, not the number itself. If the analyst said, "Based on a fuzzy class of hegemons, the rough base rate is 30-70%, which aligns with my narrative," they are not committing the sin. They commit the sin when they say "The probability is 66%."
  *   **The Correction:** The failure mode isn't using the base rate; it's **collapsing the distribution**. The sin is turning a wide confidence interval (born of class ambiguity) into a point estimate.

  **4. Is There No Separate Phenomenon?**
  You asked what would make me say there's no separate phenomenon here.
  *   **The Argument:** This is just **Overfitting** applied to history.
  *   In machine learning, if you tune your parameters until the model fits the training data, you have no predictive power.
  *   In history, if you tune your "Start Date" and "Class Definition" until the historical average matches your intuition, you have overfit the historical training set.
  *   **The Risk:** If you frame this as a unique rhetorical trick of geopolitical pundits, you miss that it is a universal failure of inductive reasoning. It happens in finance (curve fitting), medicine (p-hacking), and politics.
  *   **The Verdict:** It is not a unique phenomenon. It is **Hindsight Bias** + **Overfitting** + **Pseudo-Precision**. The "carving" you are looking for is simply the specific *application* of these universal errors to **Periodization**.

  ### Summary Recommendation

  Don't coin a term. It invites pedants to argue about semantics.

  Instead, describe the **mechanism of the tautology**.
  The phrase you want is **"Retrospective Periodization."**

  When you see it, call it out not as a "bias" but as a **temporal impossibility**: *"You are using a start date that can only be identified after the collapse has occurred. You are not predicting the future; you are narrating the past."*

  Your strongest ground is the **Peak Problem**. No one knows they are at the peak until they are on the way down. Therefore, any probability conditional on "being at the peak" is a probability conditional on a state we cannot confirm we are in. That is the knife-edge. Use that.
