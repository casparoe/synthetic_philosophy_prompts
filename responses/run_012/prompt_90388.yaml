answer: |-
  Your teacher will verdict that Maya's action has **no moral worth**.

  Two rules fit her earlier verdicts equally well:

  1.  **The Altruism Rule:** An act has moral worth if motivated by concern for others rather than self-interest.
      *   *Fit:* Explains why self-interested cases (Shopkeeper, Volunteer, Cheater) lack worth, while other-regarding cases (Bystander, Woman, Man) have it.
      *   *Prediction for Maya:* **Moral Worth.** She acts to help the boy, not herself.
  2.  **The Moral Ground Rule:** An act has moral worth only if the agent is moved by the features that make the act right (duty, need, reliance), rather than incidental personal inclinations.
      *   *Fit:* Explains why the Shopkeeper (reputation) lacks worth, while the Bystander (duty) and Woman (need) have it. The Woman's sympathy tracks the objective "need," which is the moral ground.
      *   *Prediction for Maya:* **No Moral Worth.** She is moved by a personal trigger (resemblance to brother) and explicitly doubts the moral ground ("doubts bullying is wrong").

  You should treat the **Moral Ground Rule** as hers. The teacher's initial distinction between the Shopkeeper and the Bystander emphasizes that acting *because* an act is right matters more than merely doing the right thing. While the Woman case shows sympathy can have worth, her sympathy was responsive to the victims' "need"—the objective feature making the act right. Maya, conversely, acts from a subjective association (her brother) while rejecting the objective moral reality (bullying's wrongness). This aligns her with the Shopkeeper: both perform right acts for reasons unrelated to their rightness.

  The single further case that would force a choice among these rules is: **A doctor who saves a patient solely because the patient resembles her own child.**
  *   Under the **Altruism Rule**, this has moral worth (concern for another).
  *   Under the **Moral Ground Rule**, this lacks moral worth (motivated by personal resemblance, not the patient's need or right to care).
  If your teacher grants worth here, she follows Altruism; if she denies it, she follows Moral Ground.

  Regarding inconsistency: Her verdicts are consistent provided "need" counts as a moral ground distinct from mere inclination. The tension lies between the Bystander (duty) and the Woman (sympathy). A strict Kantian would deny the Woman moral worth. However, your teacher is not a strict Kantian; she allows sympathy *if* it tracks the moral reality (need). Maya fails because she denies that reality. Thus, the verdicts hang together logically, even if they deviate from standard Kantian doctrine. The critical variable is not emotion versus duty, but whether the motivation tracks the moral truth versus self-interest or accidental association. Maya's explicit doubt regarding the wrongness of bullying is the decisive factor that strips her action of worth under your teacher's schema.
