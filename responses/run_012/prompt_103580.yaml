  3.  **Retrieve Knowledge about Herbert Simon:**
      *   *Core Concept:* Bounded Rationality.
      *   *Key Distinction:* Substantive Rationality (outcome-oriented, neoclassical) vs. Procedural Rationality (process-oriented, Simon).
      *   *Satisficing:* Not just "lazy maximizing." It involves an aspiration level that adapts. It's a stopping rule.
      *   *Environment:* Simon emphasized the *structure of the environment* (the "scissors" analogy: mind + environment). It's not just internal cognitive limits; it's the fit between mind and world.
      *   *Normative vs. Descriptive:* Simon was interested in designing better decision processes (AI, management). It wasn't purely "look how dumb humans are."
      *   *Relationship to Kahneman/Tversky (K-T):* K-T focused on biases/errors relative to normativity (probability theory). Simon focused on adaptive behavior in complex environments. Simon often criticized the "biases" approach for using the wrong normative benchmark.

  4.  **Drafting the Audit (Iterative Process):**

      *   *Claim 1 (Rational Agent Fiction):* Simon did challenge *substantive* rationality. But he didn't say rationality is impossible; he redefined it as *procedural*. *Wince:* "Fiction" implies uselessness. Simon thought the neoclassical model was a poor *psychological* theory, not necessarily always a poor *predictive* tool in aggregate, but definitely wrong about mechanism.
      *   *Claim 2 (Maximize vs. Satisfice):* Generally true. *Nuance:* Satisficing isn't just "settling." It's searching until a threshold is met. *Crucial:* Aspiration levels adjust. If easy to find good options, aspiration goes up.
