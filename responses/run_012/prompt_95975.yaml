answer: |-
  Here is the plain advice you asked for.

  **The Decision**
  The **Official Record (Negligence)** must form the factual backbone of the exhibit. The **Family Version (Arson)** must be presented as oral tradition and community memory, not as established historical fact. Specifically, the accusation that the owner's son committed arson must give way to the evidence that he was not present.

  You cannot build a historical exhibit on an accusation of murder and arson that is contradicted by a contemporary primary source (the hotel register) and supported only by oral testimony that evolved decades after the fact. If you present the arson theory as fact, you are not doing history; you are perpetuating a rumor that could expose the society to liability from the living descendants of the accused son.

  However, you do not have to present the Official Record as the "whole truth." You can present it as the "documented record," while noting its gaps.

  **The Reasoning**
  In historical methodology, contemporary documents (coroner's reports, hotel registers) carry more weight than oral traditions developed 40 to 50 years after an event, especially when that tradition has mutated over time (the name appearing only in the 70s).

  The "Official Version" admits to a crime: padlocking exit doors while men were inside is criminal negligence, regardless of whether the fire was set or accidental. That is the undeniable tragedy. The "Family Version" escalates this to premeditated murder. You have evidence for the negligence; you have no evidence for the murder, and you have an alibi for the accused.

  Therefore, the exhibit anchors on the **negligence**. That honors the dead men (who died because of locked doors) without making an unprovable accusation against the son.

  **How to Write the Label**
  You can satisfy both sides by focusing on the *locked doors* (which both sides agree on) and framing the *cause of the fire* as the point of contention.

  *Drafting concept:*
  > "On the night of [Date], 1926, the lumber mill burned, claiming eleven lives. The County Coroner's Report determined the fire began accidentally in the drying shed, but concluded the deaths were caused by exit doors that had been padlocked from the outside—a common safety violation of the era.
  >
  > "For generations, the families of the victims have maintained that the fire was deliberately set for insurance money. While contemporary records place the owner's son in a neighboring town that night, the loss of the mill's drying shed logs and the family ownership of the local press have sustained a century of suspicion. Whether accident or arson, the result was the same: eleven men were locked inside a burning building."

  This text does the "real work" of the Official Record (establishing the coroner's finding and the alibi) but validates the Family Version's core grievance (the suspicion, the missing logs, the locked doors).

  **How to Explain This to the Board**
  Do not frame this as a choice between "believing the families" or "believing the mill." Frame it as a matter of **historical standards and liability.**

  To the half of the board that wants to present the arson story as fact:
  > "I understand the moral weight of the families' story. But as a historical society, we cannot state a specific name committed arson as fact when we hold a document in our own archive that proves he was elsewhere. If we print that accusation as truth, we cease to be historians and become participants in the rumor. We can honor the families' *suspicion* without endorsing it as *fact*."

  To the half of the board that wants to dismiss the families' story as nonsense:
  > "We cannot simply display the Coroner's Report as the gospel truth. The mill owned the newspaper and the missing logs create a legitimate historical gap. The families' oral history is itself a historical artifact—it tells us how this town remembered the tragedy. We must display their account to show the legacy of distrust, even if we cannot verify the arson claim."

  **The Bottom Line**
  You are overruling the demand to label the son an arsonist. You are not overruling the demand to honor the families. You are prioritizing **evidence** for the events, and **memory** for the motive. This allows you to keep the society neutral while still telling a devastating story about the cost of greed, whether it was negligent or malicious.
