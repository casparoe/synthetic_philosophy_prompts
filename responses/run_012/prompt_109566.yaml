answer: |-
  **Summary**
  The dispute is not about whether sex differences exist, but about what the correlation between national "equality" and occupational segregation implies about human nature. One side reads the paradox as evidence that freedom reveals inherent differences; the other reads it as evidence that current metrics fail to capture actual freedom. The core deadlock is that everyone is arguing over the causal power of "equality" without agreeing on whether that word denotes a lack of barriers, a specific set of policy outcomes, or a moral ideal.

  **The camps**
  *   **The Essentialists:** They claim the pattern is real and causal: as material constraints vanish, innate psychological differences between men and women drive them toward different roles.
  *   **The Methodologists:** They claim the pattern is an artifact: indices like the Global Gender Gap Index conflate wealth and welfare with freedom, and better measures of actual agency would show convergence, not divergence.
  *   **The Normativists:** They claim the pattern is irrelevant to justice: equality should be measured by the absence of coercion (the menu), not by statistical parity in choices (the order).

  **What kind of disagreement**
  This is primarily a **conceptual** disagreement masquerading as an empirical one. Your hypothesis is correct: the word "equality" is overloaded. Camp 1 treats equality as "absence of constraint," Camp 2 treats it as "specific policy metrics," and Camp 3 treats it as "justice." Because the independent variable ("equality") is defined differently by each group, no amount of data can settle the argument. You cannot empirically test the effect of "equality" on "choice" until you agree on what counts as equality. Until the concepts are decoupled, every new dataset is just ammunition for a different definition.

  **The option-space test**
  Your index idea would significantly **clarify** the debate, though it might not dissolve it entirely. By measuring "culturally legible paths" regardless of uptake, you isolate Camp 3's definition (freedom of access) from Camp 1's outcome (segregation). If the paradox persists using your index (high option-space still correlates with high segregation), Camp 1 wins the empirical argument: freedom does lead to divergence. If the paradox vanishes (high option-space correlates with convergence), Camp 2 wins: previous indices were indeed flawed proxies. The fight would then shift to whether your index is measurable, but that is a productive empirical dispute rather than a semantic loop.

  **What would count as progress**
  1.  **A Distinction:** Explicitly separate **Equality of Access** (cost of entering a path) from **Equality of Distribution** (number of people on each path).
  2.  **A Measure:** Adopt a metric like your "Option-Space Index" or a "Stigma Cost Survey" that measures social penalties for gender-atypical choices rather than participation rates.
  3.  **A New Question:** Stop asking "Why don't women choose STEM?" and start asking "Does reducing the social cost of deviation increase or decrease variance in career choices?" This shifts the focus from defending outcomes to testing the mechanics of freedom.
