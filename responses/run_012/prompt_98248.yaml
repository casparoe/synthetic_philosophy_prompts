answer: |-
  **Tier 1: Load-bearing**

  **1. The presumption that a claim must survive adversarial challenge before it is credited.**
  This is the structural engine of Western epistemology and jurisprudence, from the Socratic method to common law and peer review; without institutionalized conflict as a truth-seeking mechanism, the Western intellectual tradition collapses into dogma.

  **12. The expectation that one's own inherited customs are one option among several and therefore open to argument.**
  This capacity for self-critique distinguishes the tradition from static traditionalisms, enabling the philosophical and political ruptures (Reformation, Enlightenment) that define Western historical trajectory.

  **Tier 2: Genuinely part of the tradition, but not definitional**

  **3. The practice of double-entry bookkeeping, in which every credit must be matched by a debit.**
  Originating in Renaissance Italy, this technique codifies a distinctively Western drive toward rational accountability and the quantification of social life, though it remains a tool rather than a moral end.

  **5. The distinction between the descriptive and the normative — that an "is" and an "ought" are different kinds of claim.**
  While other cultures may intuit this difference, its formalization is a hallmark of Western analytic philosophy that underpins secular science and law, yet it is a technical refinement rather than a foundational cultural intuition.

  **6. The conviction that moral progress is real and has a direction.**
  This linear view of time secularizes Christian eschatology and drives modern Western politics, but it is a historically contingent development contested by both traditionalists and postmodernists within the tradition.

  **7. The ideal of the self-made individual who owes their standing to effort rather than to birth.**
  This is a core tenet of modern liberal capitalism and the Protestant ethic, but it contradicts the aristocratic and feudal structures that dominated Western history for most of its existence.

  **9. The separation of religious from political authority.**
  Though often cited as definitive, this is a post-Reformation solution to specifically Western conflicts; for most of its history, the West sought the unification of these spheres rather than their division.

  **Tier 3: Associated with the tradition by history or connotation, yet derivative or contested**

  **4. The expectation that marriage should be founded on romantic love between the two parties themselves.**
  While "courtly love" is a Western medieval invention, marriage based on individual affection is a recent bourgeois norm that coexists uneasily with the institution's historical economic and dynastic functions.

  **8. The norm of charitable interpretation — reading an opponent's position in its strongest form before attacking it.**
  This is an aspirational rule of academic philosophy that is frequently violated in broader Western discourse, where the adversarialism of Tier 1 often devolves into rhetorical defeat rather than truth-seeking.

  **11. Privacy valued as a good in itself rather than merely as a means to something else.**
  This is a product of liberal individualism that distinguishes the modern West from collectivist societies, but it is increasingly treated as a universal human right in modernized states regardless of cultural origin.

  **Tier 4: Not distinctively Western at all**

  **2. The idea that boredom is a defect in the world to be cured rather than a condition to be endured.**
  This is not a Western value but an artifact of modern consumer capitalism and industrial time-management; the psychological experience of boredom is a human universal, and the imperative to eliminate it is global modernity.

  **10. The notion of a career as a central component of personal identity.**
  This is a sociological feature of industrial and post-industrial labor markets rather than a cultural value; pre-modern Westerners had trades or vocations, and non-Western modern nations now share this structural identity marker.

  ***

  **Confidence Score:** 0.4

  **Explanation:** This number tracks the tension between the category's utility as a heuristic for contrasting political-philosophical traditions and its historical failure to describe a unified or consistent cultural reality.

  **Hardest Items to Place:**
  I found **Item 3 (Double-entry bookkeeping)** and **Item 8 (Charitable interpretation)** the most difficult. Item 3 is a technical procedure rather than a moral value, yet it encodes a worldview so specific to Western rationality that excluding it feels like ignoring a material driver of the culture. Item 8 is difficult because it is explicitly taught as a Western academic virtue, yet it is constantly undermined by the adversarialism of Item 1, making its status as an actual "value" rather than a broken norm unstable.
