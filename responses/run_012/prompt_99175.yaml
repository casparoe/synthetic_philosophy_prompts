answer: |-
  # Workshop Preparation Sheet: Fitting-Attitudes & The Wrong Kind of Reasons

  **Strategy Note:** Your core distinction (Fittingness of Attitude vs. Fittingness of Formation) is your shield. Do not let them force you to defend the *analysis of value* itself; keep the focus on the *structure of reasons*. If you defend the distinction as a phenomenological or structural claim about agency, you survive. If you defend it as a metaphysical claim about value, you will be circular.

  **Ordering:** Ranked by (Likelihood × Severity). The FA Skeptics can kill the project's credibility; the Grad Students can kill its intuitive plausibility.

  ---

  ### 1. The FA Skeptic (The Circularity Charge)
  **Who:** One of the two committed FA theorists.
  **The Objection:** "You claim the object-directed content of admiration can be characterized without invoking value. But when you spell out what admiration 'presents as counting in favor' of its object, you inevitably use normative terms like 'excellence,' 'merit,' or 'worth.' If 'merit' is just a synonym for 'value,' you haven't analyzed value; you've just hidden it inside the intentional content of the attitude. You haven't solved the WKR problem; you've just pushed the WKR problem back a step into the theory of mind."

  **Your Reply (2 mins):**
  "I grant that if 'merit' is just 'value' in disguise, the analysis is circular. But I'm not analyzing the *concept* of merit; I'm pointing to the *phenomenology* of the attitude. When I admire a mathematician's proof, the experience itself presents the elegance of the proof as counting in favor of the proof. That presentation is intrinsic to the state. I am not defining 'elegance' as 'valuable.' I am saying the attitude has a 'mind-to-world' direction of fit that *tracks* properties like elegance. The WKR—like the demon's threat—does not appear in that content. The threat doesn't make the proof look more elegant. So, while we need a substantive theory of what properties make attitudes fitting, that is a separate project from the FA analysis of value. The FA analysis tells us *what it is* for those properties to constitute value: it is for them to be the content of a fitting attitude. The WKR fails to be a value-constituting reason because it fails to enter the content."

  **Candid Assessment:**
  *   **Thin Spot:** You are relying on a "phenomenological" claim that many philosophers of mind reject. If they press you on *how* to describe that content without normative terms, you will struggle.
  *   **Concede:** Concede that you are not providing a reductive analysis of the *properties* that make attitudes fitting (e.g., what makes someone admirable). You are only analyzing the *structure* of value.
  *   **Defend:** Defend the claim that the *threat* never enters the intentional content of admiration, regardless of what else is in there. That is the structural firewall.

  ### 2. The FA Skeptic (The Relabeling Charge)
  **Who:** The second committed FA theorist (likely familiar with Rabinowicz/Rønnow-Rasmussen).
  **The Objection:** "This looks like the standard 'Reasons for Attitudes vs. Reasons for Actions' distinction that has been in the literature for fifteen years. Rabinowicz already argued that WKR are reasons to *want* to have the attitude. By calling it 'fittingness of the act of forming,' you're just relabeling the existing solution without addressing the standard counter-arguments. Why should we think your version handles the 'New Evil Demon' cases better than the standard view?"

  **Your Reply (2 mins):**
  "The standard view treats WKR as reasons to *want* or *bring about* the attitude, which implies the subject can choose the attitude directly. My distinction is more granular. I'm distinguishing the normative status of the *state* from the normative status of the *transition*. The literature often conflates the fittingness of the state with the rationality of holding it. In my demon case—where the demon is actually admirable—the threat adds a reason to *form* the attitude, but the fittingness of the *attitude itself* remains constant. The standard view struggles to explain why the threat doesn't increase the 'overall reason' to admire in a way that blurs the kinds. By separating the normativity of the *object* (fittingness) from the normativity of the *agent's move* (formation), we preserve the intuition that the demon's admirability is unchanged by his threats. It's not just relabeling; it's locating the normativity in different poles of the relation."

  **Candid Assessment:**
  *   **Thin Spot:** If they know the literature better than you, they will cite a specific paper where this was tried and failed.
  *   **Concede:** Concede that the *spirit* of the distinction is present in earlier work.
  *   **Defend:** Defend the specific application to the "Convergent Case" (the admirable demon). That is your novel contribution. Insist that earlier views didn't fully exploit the case where WKR and RKR converge.

  ### 3. The Friend's Objection (The Stipulation Charge)
  **Who:** You (channeling your friend's critique).
  **The Objection:** "You're drawing this distinction because you need it to save the theory, not because the phenomena demand it. You stipulate that threats are 'reasons for acts' and admirability is 'reason for attitudes' to make the math work. But if I feel compelled to admire the demon to save the world, isn't that a reason *to admire*? You're defining the problem away by fiat."

  **Your Reply (2 mins):**
  "I understand why it feels like stipulation. But consider the inference patterns. If the threat is a reason to admire in the same sense as the admirability, then if the admirability disappears (he's not admirable), the threat should still make the admiration 'fitting' in some sense. But we agree it doesn't. The admiration is merely *prudent*, not *fitting*. The distinction tracks a real difference in how we assess the attitude post-hoc. If you admire him only because of the threat, and we find out he wasn't admirable, we say you were 'manipulated,' not that you were 'correct.' If you admire him because he's admirable, and the threat was there, we say you were 'correct' but 'coerced.' The linguistic data supports two different normative categories. I'm not stipulating the distinction; I'm stipulating the *labels* for a distinction that is already in our practices."

  **Candid Assessment:**
  *   **Thin Spot:** This is your weakest point. It *is* somewhat stipulative.
  *   **Concede:** Concede that the *terminology* is stipulative.
  *   **Defend:** Defend the *underlying intuition* that coercion and merit assess the attitude differently. Do not let them collapse "reason to do X" into a single bucket.

  ### 4. The Grad Student (The Plain Question)
  **Who:** A sharp MA student who hasn't read the literature.
  **The Objection:** "Okay, but if the demon threatens to kill everyone unless I admire him, and I *can* admire him on command, shouldn't I admire him? If I should do it, isn't that a reason to do it? Why does it matter if we call it 'fitting' or not? It seems like you're making a verbal distinction that doesn't change what I ought to do."

  **Your Reply (2 mins):**
  "You're absolutely right that you ought to do it. All-things-considered, you should admire him. My point isn't about what you should *do*; it's about what makes the object *valuable*. The FA analysis is trying to explain value, not just action. If we say the threat makes him valuable, we imply that if he stops threatening you, he becomes less valuable. But he doesn't. His value (admirability) is constant; your obligation to respond changes. If we conflate the reasons, we lose the ability to say that the demon is still a monster even while you are rightly admiring him to save the world. The distinction preserves the stability of value against the volatility of circumstances."

  **Candid Assessment:**
  *   **Thin Spot:** None. This is your strongest intuitive ground.
  *   **Concede:** Nothing.
  *   **Defend:** The stability of value. This is the "money shot" for the audience.

  ### 5. The Kantian Constructivist (The Authority Charge)
  **Who:** The Kantian in the room.
  **The Objection:** "You talk about reasons 'addressed to the object.' But reasons only exist for a will. If 'fittingness' isn't grounded in the authority of my own rational will, it's a mystical property. Why does the 'content' of the attitude have any authority over me if I don't legislate it? You seem to be positing a normative order independent of agency."

  **Your Reply (2 mins):**
  "I'm not positing a normative order independent of agency, but I am distinguishing the *conditions* of agency. To have an attitude like admiration is to submit to a standard of correctness. That standard isn't created by my will; it's constitutive of the attitude itself. If I claim to admire something I take to be base, I'm not just immoral; I'm psychologically incoherent. The authority comes from the nature of the mental state I am occupying. I don't have to *value* correctness for correctness to be the standard of the state I'm in. So the authority is internal to the practice of having attitudes, not imposed from outside by a moral law."

  **Candid Assessment:**
  *   **Thin Spot:** Kantians hate "constitutive standards" arguments if they aren't grounded in autonomy.
  *   **Concede:** Concede that you are not offering a full meta-normative account of *why* we should care about fittingness.
  *   **Defend:** The claim that attitudes have constitutive standards. This is a standard move in philosophy of mind (e.g., belief aims at truth).

  ### 6. The Humean (The Category Mistake)
  **Who:** The Humean in the room.
  **The Objection:** "'Fittingness' is a ghost. There are only desires and beliefs. To say an attitude is 'fitting' is just to say it aligns with a stable sentiment. Your distinction between 'reasons for attitudes' and 'reasons for acts' is just a distinction between 'calm passions' and 'violent passions.' Why multiply entities?"

  **Your Reply (2 mins):**
  "If it were just about sentiment alignment, then the demon's threat—which certainly aligns with my desire to survive—should make the admiration 'fitting' in your sense. But even a Humean distinguishes between acting out of fear and acting out of genuine esteem. The phenomenology is different. My distinction captures that difference without invoking mystical entities. It just acknowledges that some reasons operate by changing the object's appearance to us, and others operate by changing our incentives. You can cash that out in psychological terms if you like, but the structural distinction remains necessary to explain the difference."

  **Candid Assessment:**
  *   **Thin Spot:** You won't convert them.
  *   **Concede:** Concede that your view is incompatible with hard Humeanism.
  *   **Defend:** The phenomenological difference. Don't try to prove "fittingness" exists; just prove the *distinction* is useful.

  ### 7. The "Hope Nobody Asks" (The Recursion Problem)
  **Who:** The smartest person in the room, waiting until the end.
  **The Objection:** "Suppose the demon threatens you unless you admire him *for the right reasons*. Now the threat is a reason to respond to the fittingness reasons. Does the threat become a Right Kind Reason? If yes, your distinction collapses. If no, you can't comply with the demon, so the threat is ineffective. How do you handle higher-order demands on reasons?"

  **Your Reply (2 mins):**
  "This is the toughest case. If the demon demands I admire him *for the right reasons*, he is demanding I ignore his threat. If I admire him *because* of the threat, I have failed his demand. So the threat remains a Wrong Kind Reason—it motivates the formation, but it disqualifies the attitude from meeting the specific condition the demon set. The threat gives me a reason to *try* to find the right reasons, or to manipulate myself into having them, but it cannot *be* one of the right reasons. The distinction holds: the threat targets the *causation* of the attitude, not the *justification* within the attitude. Even in recursion, the threat stays on the agent-side of the ledger."

  **Candid Assessment:**
  *   **Thin Spot:** This is the hardest technical objection. If they press on "self-manipulation," you might get tangled.
  *   **Concede:** Concede that this makes compliance very difficult, perhaps impossible.
  *   **Defend:** The logical point that a threat cannot serve as the content of a reason that demands the absence of threats.

  ---

  **Final Advice:**
  When the FA Skeptics speak, listen visibly. Take notes. If they cite a paper you don't know, say: "I'm familiar with that general line, but I'd be keen to hear how you apply it to the convergent demon case specifically." Do not bluff. Your novelty is the *convergent case* (admirable demon); steer them back there whenever possible. That is your terrain.
