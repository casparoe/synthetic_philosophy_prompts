  You must anticipate that the most damaging challenge will not come from a disagreement over theory but from a confrontation with the legal and fiduciary constraints of the donor, likely raised by the economists who understand that their indices are tied to funding conditions that mandate zero tolerance for any payment that could be construed as illicit. They will ask you how your framework can possibly comply with international anti-corruption statutes and donor safeguard policies when you are explicitly advocating for the tolerance of certain payments, arguing that distinguishing between a toll and a bribe offers no legal shelter and exposes the programme to liability for facilitating corruption. Your reply must be to draw a sharp, unyielding line between the internal integrity of the donor-funded project, which must remain absolutely pristine and compliant with all statutes, and the external social environment in which the project operates, arguing that understanding the environment is not the same as condoning it for the project itself and that mapping these tolls is a risk mitigation strategy rather than an endorsement. You must admit that this reply is legally fragile because compliance departments and donor legal teams deal in binaries rather than spectrums, and any suggestion that corruption is acceptable contextually can be interpreted as institutional acquiescence, potentially jeopardizing the funding entirely regardless of your nuanced distinction between project funds and local social obligations.

  The second most damaging objection will come from the two economists whose reputations rest on cross-country corruption indices, who will argue that by redefining corruption to exclude tolls, you are introducing a moral hazard that allows leakage to be reclassified as culture, rendering their metrics useless and making it impossible to measure the programme's success. They will ask you how a governance programme can claim improvement if it refuses to measure the very phenomenon it claims to mitigate, suggesting that your distinction is merely a semantic trick to hide failure. Your reply must be that metrics drive behavior, and when metrics misread reality, they drive behavior underground rather than toward integrity, so a programme measuring the reduction of tolls is merely measuring the success of concealment rather than the improvement of governance, and that true accountability comes from visibility even of uncomfortable social contracts. The thinness here is that donors operate on logframes and key performance indicators, and you are offering them a narrative they cannot quantify, which makes you a liability when they need to report to their own stakeholders who demand clean numbers and definitive proof of reduction rather than complex sociological understanding.

  Next, the procurement-reform consultant will attack the economic efficiency of your distinction, framing the toll not as social glue but as a barrier to entry that distorts market competition and entrenches elite capture, using terms like non-tariff barriers and anti-competitive practice to suggest that your tolls are simply sophisticated bid rigging that excludes qualified outsiders from local opportunities. You should reply that in a context where the state provides no safety net, these networks function as informal insurance schemes that ensure project completion where formal contracts would fail, arguing that excluding the network kills the local capacity to deliver and that fairness must be weighed against functionality in a fragile state. You must admit the weakness in this position, which is that it sounds uncomfortably like defending nepotism, and while it may ensure delivery, it fundamentally violates the principle of equal opportunity that the donor is mandated to uphold, leaving you open to accusations of endorsing inequity and protecting local elites at the expense of broader market development.

  Finally, you must prepare for the question you hope nobody asks, which will likely come from one of the local staff members trying to protect you or perhaps a sharp economist digging for inconsistency, asking whether you personally collected these tolls during your eleven years keeping the books at the cooperative. You will need to answer without flinching that you did, because refusing them would have meant exclusion from the very society you served, and that your argument is born of survival rather than abstract theory, acknowledging that you are not an outside observer but a participant seeking to explain the machinery from within. The thinness here is devastating because admitting complicity undermines your moral standing to advise on governance, transforming you from a whistleblower into a participant seeking absolution, yet it is the only honest answer that preserves the integrity of your lived experience against their abstract models, forcing them to choose between your credibility and your accuracy.
