prompt: |-
  I'm on the audience standards panel at a public broadcaster, and I have to draft our written decision before Thursdays meeting. The case is a four-part drama, already shot and scheduled for March, about a real woman who ran the hospital in a mining town around 1900 — harsh with her staff, cold to her own children, died alone, all of that is on the record. The drama invents a long affair for her and a final act of atonement at a dying miner's bedside. It also takes a real pit disaster in which eleven men died, moves it a year earlier, and hands her the discovery of it; the person who actually raised the alarm was the mine's engineer, and we've cut him. Our historical consultant quit in the edit and has written to us saying we've defamed a woman who can't sue. Her great-granddaughter's lawyer says the dead still have interests and that we've put words in her ancestor's mouth; the engineer's great-grandson wants the scene reshot rather than captioned; and the family of a nurse our lead character sacks on screen is delighted, because the drama shows the sacking was unjust. Legal says the dead have no standing and that we're covered by a "loosely inspired by" disclaimer, which I think is thin given we use her real name, her real town and her photograph in the titles. Our own code says drama must not "materially mislead" — about what, and whom, nobody has ever said. Give me the panel's opinion: what we recommend, what the production has to do by when, and the honest best case for the side I'm inclined to rule against. I don't want a survey of the literature, I want something the panel can vote on.
reasoning: |-
  Here's a thinking process that leads to the suggested decision draft:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Audience Standards Panel at a public broadcaster.
      *   **Task:** Draft a written decision for a Thursday meeting.
      *   **Subject:** A four-part drama about a real historical figure (female hospital administrator in a mining town, c. 1900).
      *   **Key Issues:**
          *   Invented affair and deathbed atonement (character assassination vs. dramatic license).
          *   Altered timeline of a pit disaster (moved up a year).
          *   Attribution of alarm-raising changed from real Engineer to fictionalized Lead Character (Engineer cut from script).
          *   Historical Consultant resigned, claiming defamation of the dead.
          *   Great-granddaughter's lawyer claims dead have interests/words put in ancestor's mouth.
          *   Engineer's great-grandson wants scene reshot (not just captioned).
          *   Nurse's family is happy (shows unjust sacking).
          *   Legal says dead have no standing + "loosely inspired by" disclaimer covers it.
          *   User (Panel Member) thinks Legal's stance is thin (uses real name, town, photo).
          *   Broadcaster Code: Drama must not "materially mislead" (vague on what/whom).
      *   **Requirements:**
          *   Provide the Panel's Opinion (Recommendation, Deadlines, Actions).
          *   Provide the "honest best case" for the side the user is inclined to rule *against* (i.e., the Production/Legal side).
          *   Tone: Formal, decisive, actionable (something to vote on).
          *   Constraint: No literature survey, just the decision document.

  2.  **Determine the Stance:**
      *   The user implies skepticism about Legal's "dead have no standing" argument, noting the use of real names/photos makes the "loosely inspired" disclaimer weak.
      *   The Code says "must not materially mislead."
      *   *Decision:* The Panel should likely rule *against* the production in its current form. The alterations go beyond dramatic license into historical revisionism that harms the reputation of identifiable deceased individuals and misrepresents specific historical events (the disaster).
      *   *Action:* Require changes (captions, dialogue tweaks, or reshoots) before broadcast.

  3.  **Drafting Structure:**
      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Executive Summary/Decision:** Clear verdict.
      *   **Rationale:** Why the decision was made (referencing the Code).
      *   **Directives:** Specific actions required by the production.
      *   **Deadlines:** Hard stops for compliance.
      *   **Minority/Dissenting View (The "Best Case" for the other side):** As requested, articulate the strongest argument for the Production/Legal position to ensure the record is balanced.

  4.  **Fleshing out the Content:**

      *   *The "Materially Mislead" Standard:* How to interpret this? It shouldn't mean "documentary accuracy," but it shouldn't mean "active deception." Using a real name and photo creates an expectation of biographical fidelity. Inventing an affair and stealing a hero's moment crosses the line.
      *   *The Defamation Issue:* While the dead can't sue, public broadcasters have a higher ethical bar than the legal minimum. Trust is the currency.
      *   *The Remedies:* Reshooting the disaster scene is expensive but requested by the Engineer's family. However, a strong on-screen caption might suffice if the dialogue is tweaked. The affair/atonement is harder to fix without editing. Let's aim for a middle ground: Mandatory contextualization (captions) + specific dialogue adjustments to clarify fiction.
      *   *The "Best Case" for Production:* Artistic freedom, public interest in engaging drama, the "loosely inspired" norm, the impossibility of pleasing all descendants, the nurse's family approval shows nuance.

  5.  **Refining the Tone:**
      *   Needs to sound bureaucratic but principled.
      *   Avoid waffling.
      *   Ensure the "Best Case" section sounds persuasive, not like a straw man.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Header:* Audience Standards Panel.
      *   *Decision:* Conditional Approval. Cannot air as is.
      *   *Reasoning:* Real name + photo = implied contract of truthfulness. Moving the disaster and reassigning heroism is the biggest issue. The affair is secondary but contributes to the "cold woman" narrative.
      *   *Directives:* 1. Disclaimer needs to be stronger (not just titles, maybe end card). 2. The disaster scene needs a caption *during* the scene or dialogue change. 3. Consultant's concerns need addressing.
      *   *Deadline:* Before March (scheduled air date). Let's say 4 weeks for edits, 2 weeks for review.
      *   *Opposing View:* Legal's argument. Artistic license is vital for drama. Dead don't have rights. Viewers know drama isn't docu.

  7.  **Review against Constraints:**
      *   Did I include the recommendation? Yes.
      *   Did I include deadlines? Yes.
      *   Did I include the "honest best case" for the side I'm ruling against? Yes.
      *   Is it vote-ready? Yes.
      *   No literature survey? Yes.

  8.  **Final Polish:** Check the language. Ensure "Materially Mislead" is defined operationally. Make sure the distinction between the Nurse's family (happy) and the Engineer's/Protagonist's families (unhappy) is acknowledged but weighed. *Self-Correction:* The prompt asks for "the honest best case for the side I'm inclined to rule against." Since I'm leaning towards requiring changes (ruling against Production/Legal), the "best case" section must argue for the Production/Legal stance (i.e., let it air as is).

  9.  **Final Output Generation** (Proceeding to generate the memo).
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, [Broadcaster Name]
  **FROM:** Audience Standards Panel
  **DATE:** [Current Date]
  **SUBJECT:** Decision Regarding Untitled Four-Part Drama (Slot: March)
  **STATUS:** Conditional Approval Pending Revisions

  ### 1. PANEL DECISION

  The Panel finds that the current cut of the drama **materially misleads** the audience in violation of Section 4.2 of the Editorial Code. While we recognize the necessity of dramatic license in biographical fiction, the cumulative effect of the alterations regarding the protagonist's personal morality and the specific mechanics of the pit disaster breaches the implied contract of trust established by using the subject's real name, likeness, and specific historical setting.

  **Verdict:** The program cannot be broadcast in its current form. Approval is conditional upon the execution of the remedies outlined below.

  ### 2. RATIONALE

  The Code stipulates that drama must not "materially mislead." The Panel interprets this as follows: when a production utilizes a real name, a specific location, and archival photography in the titles, it creates a presumption of biographical fidelity that a generic "loosely inspired by" disclaimer does not automatically negate.

  **A. The Pit Disaster (Critical Issue)**
  Moving a specific tragedy involving loss of life by one year and reassigning the act of raising the alarm from a real, identifiable individual (the Engineer) to the dramatized protagonist constitutes a material misleading of historical record. This is not merely compression of time; it is the transfer of moral credit and historical agency. The Engineer's family has a valid claim that their ancestor's legacy has been erased to bolster the protagonist's narrative arc.

  **B. The Personal Narrative**
  The invention of a long affair and a deathbed atonement serves to soften a character historically recorded as "harsh" and "cold." While dramatizing internal life is permissible, presenting invented intimacy as fact—when contrasted against the historical record of her dying alone—risks defaming the deceased's reputation. While the dead have no legal standing, the broadcaster has an ethical duty not to become a vehicle for the systematic revision of local history for entertainment value.

  **C. The "Nurse" Counterpoint**
  We note the satisfaction of the sacked nurse's descendants. This confirms the drama is not uniformly negative toward all secondary figures. However, pleasing one family does not grant license to misrepresent the historical agency of another.

  ### 3. DIRECTIVES TO PRODUCTION

  To secure broadcast clearance, the Production Company must complete the following:

  1.  **The Disaster Scene:** The scene depicting the pit disaster must include an on-screen caption at the moment the alarm is raised, stating: *"In reality, the alarm was raised by the Mine Engineer, [Name]."* A verbal amendment in dialogue is insufficient; the visual text must be explicit.
  2.  **End Card:** The current "loosely inspired by" disclaimer in the opening titles is inadequate. A more robust disclaimer must be added to the end credits, specifying: *"Certain events, timelines, and personal relationships have been dramatized for narrative purposes. Key historical events, including the [Year] Pit Disaster, have been altered."*
  3.  **Consultant Review:** The Production must re-engage the original Historical Consultant (or an agreed-upon peer) to sign off on the new captions and disclaimers, confirming that the specific historical objections have been addressed.
  4.  **Affair/Atonement:** No reshoots are mandated for the affair/atonement storyline *provided* the End Card (Directive 2) is implemented. The Panel accepts that internal emotional states are the domain of fiction, provided the external historical record (the disaster) is corrected.

  ### 4. DEADLINES

  *   **Submission of Revised Cut:** Thursday, [Date - 3 weeks from now]
  *   **Panel Review & Sign-off:** Monday, [Date - 3 days post submission]
  *   **Final Master Delivery:** Friday, [Date - 1 week prior to broadcast]

  Failure to meet these deadlines will result in the program being pulled from the March schedule.

  ***

  ### 5. RECORD OF DISSENT: THE CASE FOR THE PRODUCTION

  *For the record, the following argument represents the strongest case for the Production and Legal Department's position (i.e., to broadcast as is). This view was considered but ultimately outweighed by the Panel.*

  **Argument: Artistic Integrity and Legal Sufficiency**

  1.  **Legal Standing:** The law is clear: the dead cannot be defamed. There is no legal liability here. The "loosely inspired by" disclaimer is industry standard and legally sufficient to manage audience expectation. To demand more is to impose a documentary standard on a drama, which stifles the genre.
  2.  **The Nature of Drama:** Biographical drama requires compression, conflation, and invention to create narrative cohesion. Moving the disaster by one year creates necessary thematic resonance with the protagonist's arc. Reassigning the alarm to the lead character creates dramatic agency for the protagonist; to do otherwise renders her passive in her own story. This is the essence of adaptation, not deception.
  3.  **Public Interest:** The primary duty of the broadcaster is to engage the audience. A nuanced, flawed protagonist is more compelling than a historically accurate caricature. The "atonement" scene provides the emotional resolution required for a four-part arc. Removing or heavily captioning this undermines the artistic vision and the emotional investment of the viewer.
  4.  **Selective Outrage:** The descendants of the nurse are satisfied with the portrayal of injustice. This proves the drama engages with historical truth where it matters (workplace power dynamics). Objections from the Engineer's and Protagonist's families represent a desire for control over legacy that art cannot accommodate. If we accede to these demands, we set a precedent where any descendant can veto unflattering or altered portrayals, effectively ending historical drama.
  5.  **Cost and Feasibility:** Reshooting or heavy captioning disrupts the artistic flow and incurs significant cost for a production already in the can. The "materially mislead" clause is vague; applying it this strictly now creates uncertainty for all future commissions.

  **Conclusion of Dissent:** The production has met the legal bar and the industry standard. The Panel's demand for specific captions sets a dangerous precedent of creative interference based on the sensitivities of descendants rather than the rights of the audience to be entertained.
