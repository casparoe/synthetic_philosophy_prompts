      *   *Is it strictly impossible?* It depends on the definition of "rational." If "rational" means "maximizes expected utility given causal consequences," then Cooperating is impossible. If "rational" means "maximizes expected utility given logical correlations," it's possible.
      *   *Better Impossibility:* The **Tracing Requirement**. You want to distinguish between "Causal Connection" and "Evidential Correlation." But to get Cooperation, you need to act *as if* there is a connection. If you admit it's only evidence, CDT says "evidence doesn't change outcomes." So, satisfying "Causal Integrity" + "Symmetric Cooperation" is the conflict.

