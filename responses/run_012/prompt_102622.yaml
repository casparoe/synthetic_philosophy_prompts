answer: |-
  This is a precise and demanding request. You have described the core tension of modern decision theory: the conflict between **Causal Decision Theory** (which dominates academic economics and philosophy) and **Evidential/Functional Decision Theory** (which captures the "superrational" intuition).

  You asked for the specification first. Below are the desiderata for a theory of rational choice in these symmetric, one-off situations. They are divided into **Non-Negotiable Constraints** (derived from your explicit prohibitions and the logic of agency) and **Preferred Capabilities** (derived from the cases you want handled and the intuitions you want satisfied).

  Following the list, I address the incompatibilities and the performance of leading proposals.

  ### Part I: The Desiderata

  #### A. Non-Negotiable Constraints
  *These are requirements derived from your demand for causal integrity, protection against exploitation, and the distinction between individual and group agency. A theory violating these fails your specification.*

  **1. The Causal Modesty Requirement**
  *   **Requirement:** The theory must not prescribe an action on the grounds that it physically influences a causally isolated event.
  *   **Motivation:** You specified that "no theory may conjure a causal link between two decisions that are causally isolated." If my choice cannot physically move your hand, the theory cannot claim it does.
  *   **Case:** The one-off exchange where we are in separate rooms with no communication.

  **2. The Exploitation Immunity Requirement**
  *   **Requirement:** If the agent knows with certainty that the other party will take the selfish option, the theory must prescribe the selfish option.
  *   **Motivation:** You specified that "the selfish option really is right against someone known to be selfish." A theory that recommends generosity here guarantees the "sucker's payoff" (the worst possible outcome for the agent).
  *   **Case:** The exchange against someone known to be selfish.

  **3. The Action-Guidance Requirement**
  *   **Requirement:** The theory must output a specific instruction for *this* agent (e.g., "Choose Generous," "Choose Selfish," or "Randomize 50/50"), not merely a judgment about the group outcome.
  *   **Motivation:** You want to distinguish "between a theory of what it is rational for one person to do and a theory of what a group should do." A theory that says "The group should cooperate" but tells *you* to defect fails to guide your actual decision.
  *   **Case:** All cases, specifically the many-person shared resource case.

  **4. The Evidence/Cause Distinction Requirement**
  *   **Requirement:** The theory must explicitly state whether it recommends an action because it *causes* a good outcome or because it is *evidence* of a good outcome. It cannot blur these.
  *   **Motivation:** You explicitly forbade blurring "between a reason that works because it tracks a real causal connection... and one that works because your decision is evidence about theirs."
  *   **Case:** The case involving a reliable predictor (Newcomb-like scenarios).

  #### B. Preferred Capabilities
  *These are requirements derived from the "superrational" intuition and the specific scenarios you wish to handle. A theory failing these may still be logically consistent, but it will not solve the puzzle as you have framed it.*

  **1. The Symmetric Cooperation Capability**
  *   **Requirement:** In the case where both agents are known to reason identically and face identical payoffs, the theory should recommend the generous option.
  *   **Motivation:** This is the core "stubborn intuition" you described. If we are identical, our reasoning processes are the same function; if the function outputs "Selfish," we both lose. If it outputs "Generous," we both win.
  *   **Case:** The one-off exchange between two people known to reason alike.

  **2. The Gradient Sensitivity Capability**
  *   **Requirement:** The recommendation should shift smoothly as confidence in the other's similarity shifts. It should not flip abruptly from "Generous" to "Selfish" based on a tiny change in probability.
  *   **Motivation:** You specified a case where "you are only fairly confident the other person reasons as you do." Real reasoning involves uncertainty.
  *   **Case:** The probabilistic confidence case.

  **3. The Imperfect Symmetry Capability**
  *   **Requirement:** The theory should handle cases where payoffs differ slightly without collapsing or recommending absurd actions.
  *   **Motivation:** You specified a case where "payoffs differ slightly from theirs, so the symmetry is imperfect." Perfect symmetry is rare; a robust theory must handle near-symmetry.
  *   **Case:** The imperfect payoff case.

  **4. The Scalability Capability**
  *   **Requirement:** The logic used for two people should extend to N people without requiring a fundamental change in the definition of rationality.
  *   **Motivation:** You specified the "many-person case" (public goods). A theory that works for dyads but fails for crowds is incomplete.
  *   **Case:** Contributing to a shared resource.

  ---

  ### Part II: The Critical Tension (Impossibility Results)

  You asked whether any set of requirements cannot be satisfied together. **Yes.** There is a fundamental incompatibility in your specification.

  **The Incompatibility:**
  You cannot simultaneously satisfy **The Causal Modesty Requirement** (Non-Negotiable #1) and **The Symmetric Cooperation Capability** (Preferred #1) within the standard framework of decision theory.

  **The Reason:**
  1.  **Causal Modesty** asserts that your choice does not influence the other person's choice (they are causally isolated).
  2.  If your choice does not influence theirs, then from your perspective, their choice is already fixed (either they will be Generous or Selfish, regardless of what you do).
  3.  In the puzzle you described (a Prisoner's Dilemma structure), if the other's choice is fixed, the **Selfish** option *always* yields a higher payoff for you than the **Generous** option. (This is the definition of a "dominant strategy").
  4.  Therefore, if you accept Causal Modesty, rationality *requires* you to choose Selfish, even against an identical reasoner.
  5.  To choose Generous, you must act as though your choice *does* influence theirs (or is logically tied to theirs in a way that functions like influence). This violates Causal Modesty as traditionally understood.

  **The Single Most Exclusionary Requirement:**
  **The Causal Modesty Requirement.**
  This is the filter that rules out the "superrational" intuition. If you hold this as absolute, you force the theory to conclude that Cooperation is irrational in the one-off case. If you relax this to allow "logical causation" or "subjunctive dependence" (the idea that your decision and theirs are outputs of the same source code), you open the door to Cooperation but risk violating your ban on "conjuring causal links."

  **Can the demands be jointly satisfied?**
  Only if you redefine "Causation."
  *   **View A (Standard):** Causation is physical. My brain state cannot physically move your hand. **Result:** Cooperation is impossible.
  *   **View B (Functionalist):** Causation includes logical dependency. My decision algorithm and yours are the same; changing the output of the algorithm "here" implies changing the output "there." **Result:** Cooperation is possible, but critics argue this "conjures a causal link" in violation of your Non-Negotiable #1.

  You must decide if "logical correlation" counts as a "causal link." If yes, the demands are impossible. If no, they are compatible.

  ---

  ### Part III: Assessment of Leading Proposals

  Here is how the four views you mentioned fare against your desiderata.

  **1. The "Identical Reasoners" View (Hofstadter's Superrationality)**
  *   **Core Claim:** If we are identical, we will reach the same conclusion. Therefore, I should choose the conclusion that yields the best result if *we both* do it.
  *   **Performance:**
      *   **Hits:** Symmetric Cooperation, Scalability.
      *   **Misses:** Causal Modesty (critics argue it treats logic as causation), Exploitation Immunity (struggles if the other is *almost* but not perfectly identical).
      *   **Verdict:** Solves your intuition but violates your constraint against "conjuring causal links."

  **2. The "Evidential" View (Evidential Decision Theory)**
  *   **Core Claim:** Choose the action that provides the best *news* about the world. If my choosing Generous is strong evidence you will too, I should choose Generous.
  *   **Performance:**
      *   **Hits:** Symmetric Cooperation, Gradient Sensitivity.
      *   **Misses:** Causal Modesty (it acts on correlation, not causation), Evidence/Cause Distinction (it explicitly blurs this by treating evidence as a reason for action).
      *   **Verdict:** Mathematically robust but violates your demand to distinguish evidence from cause.

  **3. The "Causal Consequences" View (Causal Decision Theory)**
  *   **Core Claim:** Choose the action that physically *causes* the best outcome. Since my choice doesn't cause yours, I must ignore the correlation.
  *   **Performance:**
      *   **Hits:** Causal Modesty, Exploitation Immunity, Evidence/Cause Distinction.
      *   **Misses:** Symmetric Cooperation (it mandates Defection in the one-off case), Gradient Sensitivity (it usually jumps straight to Defect).
      *   **Verdict:** Meets all your Non-Negotiables but fails your core intuition (Preferred #1). It tells you to take the selfish option even against your twin.

  **4. The "Team Reasoning" View (We-Reasoning)**
  *   **Core Claim:** In symmetric situations, I should reason as a member of a group ("What should *we* do?") rather than as an individual ("What should *I* do?").
  *   **Performance:**
      *   **Hits:** Symmetric Cooperation, Scalability.
      *   **Misses:** Action-Guidance (it blurs the line between individual and group rationality, which you forbade), Exploitation Immunity (if the "team" breaks down, the individual is left vulnerable).
      *   **Verdict:** Solves the cooperation problem by changing the definition of the agent, violating your distinction between individual and group theory.

  ### Summary Recommendation

  You are hunting for a theory that satisfies **Causal Modesty** (no magic links) while delivering **Symmetric Cooperation** (superrationality).

  Based on the specifications you provided: **No such theory exists.**

  *   If you prioritize **Causal Modesty**, you must accept **Causal Decision Theory**, which tells you to be selfish in the one-off case.
  *   If you prioritize **Symmetric Cooperation**, you must accept **Evidential or Functional Decision Theory**, which requires you to treat logical correlation *as if* it were causal, thereby violating your strict ban on "conjuring causal links."

  Your puzzle forces a choice between **physical causal integrity** and **cooperative payoff maximization**. You cannot have both without redefining what "cause" means.
