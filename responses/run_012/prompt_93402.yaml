answer: |-
  You're right, Dave's wrong, and the name he's fishing for is **The Problem of Logical Omniscience**.

  Dave is defending the **Deductive Closure Principle**: if you believe $P$, and $P$ entails $Q$, you believe $Q$. This works for logic books, but it fails for brains. Your gut is tracking a better principle. Let's call it **The Accessibility Constraint**.

  **The Principle:**
  *You believe $Q$ only if you are disposed to assent to $Q$ upon feasible reflection, given your cognitive architecture.*

  It's not about what's "in your skull" in a physical sense (ink on neurons); it's about what your mind can *access* and *use* to guide action. Here's how that clause does the work in your cases:

  1.  **391 = 17 × 23:** Feasible reflection. Dave can retrieve this answer quickly. The derivation is within his cognitive reach. **Verdict:** You're right. He dispositionally believed it.
  2.  **The Huge Theorem:** Infeasible reflection. No human can traverse that proof. It's not accessible. **Verdict:** You're right. He doesn't believe it. Belief isn't a relation to abstract truths; it's a state of a finite agent.
  3.  **P, If P then Q:** This is your weak spot. Feasible reflection (it's trivial modus ponens), but not *occurrent*. **Verdict:** You might have to concede this one to Dave. If he genuinely believes the premises, he *does* believe the conclusion dispositionally, even if he hasn't triggered it. The "feeling" difference is just that the belief is dormant, not absent.
  4.  **The Crank:** Humans aren't logic engines. We don't explode when we hold contradictions (Ex Falso Quodlibet doesn't apply to psychology). **Verdict:** You're right. He believes three things; his mind is inconsistent, not logically impossible. Dave is treating Dave like a theorem prover.
  5.  **Nan (Chess):** Knowledge requires the ability to use the information. If she can't see the mate, she can't act on it. **Verdict:** You're right. She lacks the access required for knowledge. Dave's "knows she doesn't know" is a waffle to save his theory.
  6.  **The Computer:** This adds a second clause: **Intentionality**. Belief requires a mind that *means* something by the symbols. A computer manipulates syntax without semantics. **Verdict:** You're right. It believes nothing.
  7.  **The Cousin:** Self-reports are evidence, not infallible truth. He's confusing *normative* commitment (I *should* believe consequences) with *descriptive* state (I *do* believe them). **Verdict:** You're right. He's misdescribing his mind.

  **The Prediction:**
  Try this on Dave: **The Forgotten Name.**
  You know your best mate's name. You believe it's "Steve." But right now, you have a tip-of-the-tongue moment. You can't recall it for five minutes.
  *   **Dave's view:** You still believe it's Steve (it's in the skull).
  *   **Your view (Accessibility):** For those five minutes, you don't believe it's Steve, because you can't access it to guide action (e.g., calling out to him).
  *   **Why it matters:** If belief is just "in the skull," the five-minute gap doesn't matter. If belief is about *guiding you*, then during those five minutes, you're acting like someone who doesn't know his name. Your principle predicts you temporarily lose the belief; Dave's predicts you keep it. Your view fits the phenomenology better.

  **The Sacrifice:**
  To keep this principle clean, you have to give up your hesitation on **Case 3 (P, If P then Q)**.
  If the derivation is trivial (one step), and you endorse the premises, you *do* believe the conclusion, even if you haven't thought of it. The difference between that and the 391 case is just degrees of computational effort, not a difference in kind. If you say he *doesn't* believe $Q$ there, you're making belief too fragile. You have to admit that "believing" covers both what's in front of your face and what's immediately behind it.

  **Summary for the Pub:**
  Tell Dave he's confusing **ideal rationality** (how a god would believe) with **human psychology** (how we actually believe). We are boundedly rational. We believe what we can hold, not what follows. The name is **Logical Omniscience**, and it's a bug in his model, not a feature of the world.

  Next round's on him.
