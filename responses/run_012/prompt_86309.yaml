          *   *Competence/Awareness:* If the agent *should* have known or is competent, we attribute intentionality more easily to bad outcomes.
      *   *The Moderator:* "Who counts as the agent?" (Human vs. Machine/Committee). If the effect relies on *moral blame*, machines/committees might reduce it (less capacity for blame). If it relies on *norms*, it might persist.

