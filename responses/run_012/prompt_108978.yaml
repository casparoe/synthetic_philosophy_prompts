          *   *Schmitt/Decisionism:* Constituent Power (*Pouvoir Constituant*). A political fact preceding law.
          *   *Consensus vs. Contest:* It is *settled* that the chain must end somewhere. It is *contested* whether that end is a norm (Kelsen), a practice (Hart), or a force/decision (Schmitt). The practice itself is compatible with all three.

      *   **2. The Amendment Rule (Inside vs. Outside):**
