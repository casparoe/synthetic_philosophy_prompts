          *   *Identity:* If the amendment rule changes, does the system change?
          *   *Consensus vs. Contest:* *Settled:* The amendment rule is distinct from ordinary rules. *Contested:* Whether changing it creates a new legal order (revolution) or just an update. Most systems treat it as continuity (the Constitution survives amendments), but radical changes blur this.

      *   **3. Entrenchment (Unamendability):**
