answer: |-
  **NATIONAL RECORDS OFFICE**
  **DISPOSAL AUTHORITY REF: DA-99/Ω**
  **EFFECTIVE: IMMEDIATE**

  **PREAMBLE**
  This Schedule authorises the destruction, permanent retention, or indefinite holding of records created by public bodies. It operates under the principle that the State preserves only that which evidences its own continuity. The Public Finding Aid shall describe all retained series; it shall not enumerate records destroyed, declined, or deemed ephemeral. Access to closed series requires written authorisation from the Director of Appraisal.

  **SCHEDULE OF RETENTION AND DISPOSAL**

  **1. Series: Citizen Correspondence and Transactional Data**
  **Retention Period:** 7 Years, then Destroy.
  **Justification:** Documents individual ephemeral activity lacking enduring administrative value.

  **2. Series: Ministerial Policy Drafts and Internal Memoranda**
  **Retention Period:** Permanent.
  **Justification:** Evidence of institutional intent supersedes the public record of outcome.

  **3. Series: The Non-Accessions Register**
  **Retention Period:** Closed Indefinitely.
  **Justification:** Public knowledge of records declined would compromise the integrity of the acquisition strategy.

  **4. Series: Records Designated for Provisional Permanence**
  **Retention Period:** Retain Pending Review.
  **Justification:** Review date to be scheduled by a future Disposal Authority not yet authorised.

  **5. Series: Analog Records with Digital Surrogate**
  **Retention Period:** Destroy Original upon Digitisation.
  **Justification:** The digital surrogate constitutes the primary record; the analog original is deemed a duplicate.

  **6. Series: Analog Records without Digital Surrogate**
  **Retention Period:** Destroy Immediately.
  **Justification:** Failure to digitise indicates lack of enduring administrative value.

  **7. Series: Previous Disposal Authorities**
  **Retention Period:** Destroy upon issuance of New Authority.
  **Justification:** Superseded instructions constitute duplicate information liable to misinterpretation.

  **8. Series: This Disposal Authority (DA-99/Ω)**
  **Retention Period:** Retain Until Superseded.
  **Justification:** This document must survive to authorise its own destruction by a successor subject to these same terms.

  **OPERATIONAL NOTES**
  Records classified under *Provisional Permanence* (Series 4) shall remain in secure storage. No resource allocation is mandated for the review process. If a review is never scheduled, the provisional status remains valid in perpetuity. Records listed in the *Non-Accessions Register* (Series 3) exist physically but are excluded from the Public Finding Aid; researchers cannot request what the Aid does not acknowledge is missing. 

  Regarding digitisation (Series 5 & 6), the Office confirms that the existence of a record is contingent upon its machine-readability. Un-digitised records are not destroyed due to lack of space, but due to lack of definition. Where conflict arises between the preservation of ordinary citizen data (Series 1) and the administrative metadata regarding that data (Series 2), the metadata shall prevail. 

  This Authority is itself a public record. It is retained not for historical research, but to ensure the legal continuity of the destruction process it mandates. Should this Authority be destroyed according to its own terms, the legality of prior destructions rests on the faith placed in the Officer who signed it. 

  **AUTHORISED BY:**

  *Dr. Aris Thorne*
  **Director of Appraisal and Selection**
  **National Records Office**
