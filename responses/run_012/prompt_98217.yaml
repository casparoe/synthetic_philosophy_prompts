      *   Key distinction: Is "phenomenal consciousness" an empty term (like phlogiston) or a misdescribed real thing (like heat = molecular motion)?
      *   Meta-problem (Chalmers): Why do we *think* there's a hard problem? Illusionists say solving the meta-problem *is* solving the hard problem (by dissolving it).
      *   Zombie/Reverse Zombie: Could something function like us but lack the illusion? Or function without the illusion and thus not report consciousness?

  3.  **Drafting Questions (aiming for 8-10):**

      *   *Q1 (Mandatory): Perceptual vs. Doxastic.*
          *   Probe: Nature of the error.
          *   Question: Is the illusion perceptual (controlled hallucination) or doxastic (judgment error)?
          *   Expected: Usually doxastic/interpretive (Frankish).
          *   Followup (Expected): If judgment, why is it immune to correction?
          *   Followup (Not): If perceptual, doesn't that presuppose a phenomenology to be fooled?
          *   Risk: Verbal dispute on "perceptual".

      *   *Q2 (Mandatory): Phlogiston vs. Re-description.*
