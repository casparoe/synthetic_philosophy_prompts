prompt: |-
  I write fiction, and a friend has talked me into being the interviewer on his philosophy podcast next month. The guest is a philosopher who defends illusionism about phenomenal consciousness — the view that there's no phenomenal consciousness at all, just non-phenomenal states that make us think there is. I've read enough to know the tired objections, so please no "but it feels so vivid to me" material. I want eight to ten questions that get into the gears. At minimum: one on whether the illusion is meant to be a perceptual illusion (something like the predictive-processing line that perception is a kind of controlled hallucination) or a doxastic/interpretive error, and why that fork matters downstream; one on whether the concept of phenomenal consciousness is supposed to be defective the way phlogiston was, or instead picks out something real that the illusionist just re-describes; one on what the meta-problem has to do with any of it — is illusionism's main selling point that it converts the hard problem into the easy meta-problem, and does that only work if the meta-problem really is easy?; and one on whether a creature could lack the illusion altogether, i.e. be a non-illusionist about its own inner life, and what that would look like from the outside. For each question give me a follow-up that lands if the guest gives the answer I'd expect (their predictable escape hatch), and one that lands if they dont. Also flag anywhere I should worry the guest will just call it a verbal dispute and move on.

  Give it to me as JSON I can paste into a notes app: a top-level object with a field called position_gloss (one sentence, the view as I should state it to open the segment) and a field called questions, which is an array where each item has probe (the specific commitment the question is targeting), question, likely_reply, followup_if_expected, and followup_if_not. Keep every field tight — this is going on index cards, not into a paper.
