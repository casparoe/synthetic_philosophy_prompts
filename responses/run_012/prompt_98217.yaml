          *   Question: Is 'phenomenal consciousness' a natural kind we misidentified (like heat) or a false theory (like phlogiston)?
          *   Expected: Phlogiston (elimativism).
          *   Followup (Expected): Then why does the term persist so stubbornly compared to other false theories?
          *   Followup (Not): If it's real but physical, aren't you just a type-B physicalist?
          *   Risk: Verbal dispute on "elimativism".

