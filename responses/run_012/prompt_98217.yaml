          *   Expected: Cognitive encapsulation / user-illusion interface.
          *   Followup (Expected): Doesn't that imply a homunculus reading the interface?
          *   Followup (Not): If it's penetrable, why haven't philosophers penetrated it yet?
          *   Risk: Verbal dispute on "immune".

      *   *Q8: Evolutionary Story.*
          *   Probe: Adaptation.
          *   Question: What evolutionary pressure selects for believing a falsehood about oneself?
          *   Expected: Useful fiction / data compression.
          *   Followup (Expected): Why not true belief? Truth is usually more adaptive.
          *   Followup (Not): If no story, is the illusion just a spandrel?
          *   Risk: None.

      *   *Q9: The "What It's Like" Phrase.*
          *   Probe: Linguistic usage.
          *   Question: When you say "there's nothing it's like", are you banning the phrase or redefining it?
          *   Expected: Redefining (non-phenomenal sense).
