answer: |-
  ### Exam Question

  **Question 1**
  In recent lectures, we discussed the "heterogeneity problem": the difficulty of explaining why vastly different experiences (the taste of a peach, the ache of a run, the satisfaction of a proof, the pleasure of a sad song) are all classified as "pleasure." We examined the **Self-Recommending View (SRV)**, defined as follows:

  > *A state counts as a pleasure just in case (a) the subject is disposed to keep it going or seek it again, AND (b) it presents itself to the subject as making the activity worth continuing.*

  Write an essay addressing the following:
  1.  Explain how the SRV attempts to solve the heterogeneity problem where the **Sensory View** (pleasures share a common feeling) fails.
  2.  Determine whether the SRV is distinct from the **Attitudinal View** (pleasure is taking a pro-attitude toward a proposition), or if it merely renames it.
  3.  Test the SRV against two hard cases: (i) a person who genuinely enjoys their own grief at a funeral, and (ii) a person grinning over a fellowship award while feeling no bodily sensation. Does the SRV handle these better than its rivals, or does it collapse?

  ---

  ### Model Answer

  The heterogeneity problem arises because pleasures lack a common sensory "tingle." The Sensory View fails because the ache of a run and the taste of a peach share no qualitative feel. The Self-Recommending View (SRV) solves this by shifting focus from *what* the experience feels like to *how it functions* for the subject. By defining pleasure through disposition (a) and normative seeming (b), the SRV allows heterogeneous states to count as pleasure provided they motivate continuation and appear worthwhile. This functional definition accommodates the sad song or the runner's ache without requiring a shared sensory quality.

  However, the SRV risks collapsing into the Attitudinal View. The Attitudinal View claims pleasure is simply holding a pro-attitude toward a fact (e.g., "I am running"). SRV condition (a) looks identical to this: being disposed to seek a state is effectively having a pro-attitude toward it. If (a) is sufficient, SRV is just Attitudinal View with extra steps. To remain distinct, SRV must lean heavily on condition (b): the state must *present itself* as worth continuing. This phenomenological constraint distinguishes SRV from a bare desire theory. A person might desire to finish a painful task (Attitudinal) without the pain itself presenting as worth continuing (SRV). Thus, SRV survives only if the "seeming" is not reducible to the "disposition."

  This distinction is crucial when testing hard cases. Consider the fellowship winner grinning with no bodily sensation. The Sensory View fails here (no sensation exists). The Attitudinal View succeeds (they hold a pro-attitude toward the news). The SRV also succeeds: they are disposed to dwell on the news (a), and it feels worth dwelling on (b). Here, SRV matches Attitudinal success without requiring sensory quality.

  The funeral grief case is more damaging. Suppose a mourner enjoys their grief. The Sensory View fails (grief is painful). The Attitudinal View struggles (how can one have a pro-attitude toward sadness?). The SRV faces a dilemma. If the grief presents itself as worth continuing (b) and they seek it (a), SRV calls it pleasure. This captures the intuition that they are "enjoying" the grief. However, this reveals a normative flaw: SRV might classify toxic states as pleasure simply because the subject is hooked on them. Furthermore, there is a structural tension between (a) and (b). Does the disposition cause the seeming, or does the seeming cause the disposition? If the disposition comes first, SRV collapses into desire theory. If the seeming comes first, SRV relies on a mysterious normative perception.

  Ultimately, the SRV improves on the Sensory View by accommodating heterogeneity through functional roles rather than qualities. It improves on the Attitudinal View by requiring the experience itself to recommend continuation, not just a detached judgment. However, unless it clarifies the relationship between disposition and seeming, it risks being either too permissive (counting addiction as pleasure) or redundant (renaming desire). It handles the fellowship case well but remains vulnerable to the grief case unless it can explain why some "self-recommending" states are illusory pleasures.

  ---

  ### Marking Scheme (Total: 20 Marks)

  | Point | Criteria | Marks | Typical Student Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Accurate Reconstruction:** Correctly cites both conditions of SRV (disposition + seeming) without conflating them. | 4 | Treats condition (b) as merely a restatement of condition (a). |
  | **2** | **Heterogeneity Solution:** Explains clearly why SRV allows diverse cases (peach vs. ache) where Sensory View fails. | 4 | Focuses on "different feelings" rather than the functional definition. |
  | **3** | **Attitudinal Distinction:** Identifies the collapse risk (SRV vs. Attitudinal/Desire) and argues for/against distinctness. | 4 | Asserts they are different without explaining *why* (e.g., ignoring the "seeming" constraint). |
  | **4** | **Hard Case Application:** Applies SRV to both the Fellowship (no sensation) and Funeral (enjoying grief) cases. | 4 | Ignores the Funeral case or applies the Sensory View to it by mistake. |
  | **5** | **Structural Critique:** Identifies the internal tension (order of disposition vs. seeming) or normative flaw (addiction). | 4 | Accepts the view uncritically or critiques it using outside theories not in the prompt. |

  ---

  ### Differentiating A Answers from B Answers

  To separate the A students from the B students, look for **structural precision** regarding the internal mechanics of the SRV.

  *   **The B Answer** will treat the SRV as a "black box." They will say things like, "The SRV says pleasure is when you want something and it feels good." They will handle the cases descriptively (e.g., "The fellowship guy fits because he wants it") but will not notice the theoretical vulnerability between condition (a) and condition (b).
  *   **The A Answer** will notice the **direction of fit**. They will explicitly ask: *Does the state seem worth continuing because I seek it, or do I seek it because it seems worth continuing?* If the former, the view collapses into desire theory (Attitudinal). If the latter, it relies on a specific phenomenology that might not exist in unconscious pleasures.
  *   **The A Answer** will also spot the **Normative Risk**. They will note that if "presenting as worth continuing" is the criterion, then self-destructive behaviors (like the grief case or addiction) technically count as pleasure under SRV, which might be a *reductio* or a feature. A B student will usually just say "grief isn't pleasure" without checking if the SRV definition forces them to call it otherwise.
