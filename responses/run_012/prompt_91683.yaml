  Mara is not running standard Causal Decision Theory (CDT), nor is she a blind Expected Utility maximizer. Her track record reveals she is running **Functional Decision Theory (FDT) constrained by Epistemic Priors.**

  Here is how her rules map to her history:

  *   **Rule A: Logical Correlation is Real (The FDT Core).**
      *   *Evidence:* She **One-Boxes on Newcomb**.
      *   *Meaning:* She accepts that her decision can be correlated with outcomes she doesn't causally influence, provided there is a logical link (like a predictor simulating her). She rejects the CDT notion that "the money is already there/already gone."
  *   **Rule B: Mechanisms Must Be Plausible (The Epistemic Filter).**
      *   *Evidence:* She **rejects the Street Curse** (magic isn't real), **rejects the Fake Nudes** (verification failed), and **rejects Pascal's Mugging** (probabilities are "junk").
      *   *Meaning:* She does not maximize expected utility based on raw claims. She penalizes hypotheses with low prior probability or impossible mechanisms heavily. She requires a robust model of *how* the threat works before she lets it influence her utility calculation.
  *   **Rule C: Pay When the Lever Works.**
      *   *Evidence:* She **pays the Mugger** and **pays the Kidnapper**.
      *   *Meaning:* When the mechanism is causal, physical, and verified (high prior), she acts instrumentally to minimize loss.

  ### 3. Application to the New Case
  The new case (Algorithmic Blackmail) creates a tension between Rule A and Rule B.

  *   **The FDT Pull:** If the blackmailer *actually* has her algorithm, Rule A suggests she should pay. Her algorithm's output determines the simulation's output. If her algorithm says "Don't Pay," the simulation says "Torture." To save the copies (which she presumably values as "hers"), she should output "Pay."
  *   **The Epistemic Push:** However, the setup is "Somebody online claims." This lacks the epistemic weight of Omega (Newcomb) or the physical verification of the Kidnapper. It aligns with the **Pascal Mugger** (extraordinary claim, no evidence) and the **Street Curse** (no known mechanism).

  **Why she chooses Rule B:**
  Mara's rejection of Pascal's Mugging is the tie-breaker. In Pascal's Mugging, the mechanism is logically possible but probabilistically negligible. She refuses to let "junk" probabilities drive her actions. Since "reconstructing a human decision algorithm from the outside" is currently technologically impossible (low prior), she categorizes this as a scam, not a logical dilemma. She treats the threat as having $P \approx 0$, so the expected utility of paying is negative (you lose $1,000 for nothing).

  ### 4. The "Surrogate Goal" Intuition
  You asked if her record implies she is using a **surrogate goal** (a decoy value system to inoculate against blackmail).

  **The Answer:** No, her record does not imply she is using surrogate goals.

  *   **Why you thought that:** Surrogate goals are the specific counter-measure recommended for FDT agents to avoid exactly this kind of logical blackmail. If she had one, she wouldn't care about the tortured copies, and "Don't Pay" would be easy.
  *   **Why she isn't:** Her behavior in the **Kidnapper** case shows she cares deeply about her actual terminal values (her dog). Her behavior in the **Mugger** case shows she cares about her body. She has not decoupled her values from her vulnerabilities.
  *   **The Distinction:** She is avoiding the blackmail via **Skepticism** (Rule B: "I don't believe you can do it"), not via **Value Modification** ("I don't care if you do it").
  *   **Implication:** This makes her vulnerable. If she ever encounters a blackmailer who *does* prove they have the algorithm (updating her priors), she will be forced to pay (due to Rule A/Newcomb), incentivizing future blackmail. A surrogate goal would have protected her even if the threat was real.

  ### 5. The Next Test Case
  To confirm this model (FDT + Priors) and distinguish it from a hard "No Blackmail" precommitment or actual surrogate goals, put this case in front of her:

  **The Verified Programmer:**
  > "Your trusted mentor, a brilliant neuroscientist who you know has access to your full medical history and code, emails you. She attaches a log showing she successfully simulated your decision-making in a test environment with 99.9% accuracy. She says she has spun up the 1,000 copies and will torture them unless you send $1,000. She gives you 24 hours to verify the simulation logs on her secure server."

  **Why this separates the theories:**
  *   **If she Pays:** It confirms **FDT + Priors**. The epistemic filter is satisfied (the mechanism is verified), so the logical correlation takes over. She is vulnerable to logical blackmail when the threat is credible.
  *   **If she Don't Pays:** It implies she has a **Strategic Precommitment** (an "anti-blackmail" policy) that overrides FDT, or she has adopted a **Surrogate Goal** regarding her copies. This would contradict her Newcomb One-Boxing unless she frames Newcomb as "Prediction" (good) and Blackmail as "Extortion" (bad), which is a deontological distinction, not a decision-theoretic one.
  *   **If she Hesitates/Checks Logs:** It confirms the **Epistemic Filter** is her primary defense. She is willing to pay *if* the prior probability becomes high enough.

  **Summary:** Mara is a **skeptical functional decision theorist**. She believes in logical correlation (Newcomb) but refuses to be bullied by low-probability claims (Pascal). She will not pay the online blackmailer because she doesn't believe he has the code, not because she doesn't care about the copies.
