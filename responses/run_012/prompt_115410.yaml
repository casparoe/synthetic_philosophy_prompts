answer: |-
  To answer this properly, we have to stop treating Left and Right as fixed substances and start treating them as dynamic claims about justice. If we run Aristotle's machinery on modern partisanship, we find that the distinction is real politically but hollow ontologically, and that our current stability is an illusion maintained by a missing middle.

  First, consider the ontological status of the distinction. Aristotle is obsessed with essence—what a thing is in itself versus how it relates to other things. In his logical works, he distinguishes between substance and relation. Left and Right are purely relational terms; they have no meaning except in opposition to one another and relative to a viewer or a center. There is no "Leftness" inherent in a person like there is "rationality" inherent in a human. For Aristotle, this means Left and Right do not pick out a natural kind with a shared essence. They are not species of a genus. They are accidental features of a specific political arrangement.

  This implies the distinction isn't "real" in the metaphysical sense, but it is dangerously real in the political sense. Aristotle would argue that because these categories lack an essence, they are inherently unstable. They define themselves by what they are not, which means their content shifts whenever the opposition shifts. If the Right moves, the Left must move to maintain the distance. This makes them poor foundations for a regime, which requires stability based on something substantive, like virtue or law. However, Aristotle would acknowledge that while the labels are relative, the underlying passions are real. He would treat them not as true kinds, but as focalized expressions of *stasis*, or faction. We are extrapolating here, as he never analyzes binary oppositions of this sort, but his metaphysics suggests he would view the Left/Right divide as a symptom of a deeper failure to agree on the end of the city, rather than a legitimate structural feature of politics.

  This leads directly into the machinery of faction in the *Politics*. The core engine of conflict for Aristotle is a mismatch between distributed power and perceived desert. He identifies two competing claims of equality. The democratic claim is arithmetic: everyone is free, therefore everyone deserves an equal share. The oligarchic claim is geometric: people are unequal in wealth or merit, therefore they deserve unequal shares.

  If we map the modern Left onto the democratic claim, it fits mostly well. The modern Left argues from numerical equality and universal dignity, claiming that existing hierarchies are arbitrary and unjust. They run the complaint: "We are equal humans, yet you treat us as unequal." The modern Right, however, is where the mapping grinds. Historically, the Right runs the oligarchic claim: "We contribute more, we own more, therefore we should rule more." But the modern Right is not just the rich. It includes cultural conservatives who may lack economic power but claim disproportionate authority based on tradition or moral worth. Conversely, the modern Left is not just the poor; it includes elites who claim moral superiority based on enlightenment rather than wealth.

  Here is where the machinery jams. Aristotle demands a coherent theory of desert tied to the telos of the city. You deserve power only insofar as you contribute to the good life of the community. He would likely find both modern sides incoherent. The Left often demands equality without a shared account of what humans are equal *for*, reducing justice to distribution rather than flourishing. The Right often demands hierarchy based on wealth or tradition without proving that wealth or tradition correlates with virtue. He would say both sides are running on "vibes"—fragmented intuitions about justice that cannot be squared because neither side can articulate a final cause for the polity. They are fighting over the distribution of goods without agreeing on what the goods are for. When factions fight over principles of justice that are mutually unintelligible, Aristotle predicts not compromise, but civil war.

  This brings us to concord, or political friendship. In the *Ethics*, Aristotle distinguishes concord from mere agreement. Concord isn't thinking the same things; it is agreeing on fundamental interests and who should rule. It is a bond of utility and virtue among citizens. Modern coalitions fail this test spectacularly. Neither the Left nor the Right is held together by concord in Aristotle's sense. They are held together by negative partisanship—a shared enemy. This is not friendship; it is a conspiracy of convenience. Aristotle is brutal about this: a city held together only by fear of the other faction is not a polity, it is an alliance waiting to collapse.

  Furthermore, Aristotle's framework struggles to see identity politics. He views humans as political animals defined by speech and reason regarding justice. Differences based on race, gender, or recognition separate from function are, for him, largely pre-political or household matters. He would likely view a faction organized around recognition rather than class or virtue as a category error. He might see it as bringing private grievances into the public sphere, which destabilizes the rule of law. He would ask: Does this identity contribute to the function of the citizen? If the answer is no, he cannot see it as a legitimate basis for political claim-making. This is a hard limit of his theory. He assumes a homogeneity of purpose that modernity rejects. We must flag this as a point where his theory cannot see our reality. He lacks the vocabulary for pluralism that isn't just pluralism of class. He would likely view identity-based factions as irrational eruptions of passion that obscure the real question: who is best fit to rule for the common good?

  Finally, where does he think this goes? Aristotle's stability condition relies on the *mesoi*, the middle class. A large middle class buffers the rich from the poor, preventing the extreme polarization that leads to tyranny or mob rule. The middle is stable because they are not envious like the poor or arrogant like the rich. They are capable of listening to reason.

  Our modern "Center" is not this. It is not a class with a shared stake and virtue. It is a managerial stratum, a coalition of technocrats and moderates defined by the absence of extreme views rather than the presence of a positive virtue. For Aristotle, this is not a real middle. It is a vacuum. Because our center lacks independent power and virtue, it cannot arbitrate between the extremes. It merely delays the conflict.

  Consequently, Aristotle would predict regime decay. Without a true middle, the state oscillates between the extremes. When the Left dominates, it tends toward ochlocracy (mob rule), ignoring merit. When the Right dominates, it tends toward oligarchy, ignoring need. Neither is a true polity. Because neither side accepts the legitimacy of the other's claim to justice, the cycle accelerates. Aristotle's remedy is to strengthen the middle class economically and educate them toward virtue. But if our center is merely managerial—a buffer zone rather than a class with its own ethos—his remedy is unavailable. You cannot educate a vacuum.

  So, to answer your student: Aristotle would say Left and Right are not real kinds, but real dangers. They are contradictory claims of justice that cannot be reconciled because neither accepts the other's premise of desert. They are bound by hatred, not friendship, and they organize around identities his theory cannot validate. Most grimly, he would say our center is too weak to stop the slide. He wouldn't predict a synthesis. He would predict a breakdown where one side consumes the other, resulting in a tyranny that claims to represent the people while destroying the conditions for political life. He offers no comfort here. The machinery runs cold to the conclusion that without a virtuous middle, the regime is already dead; it just hasn't stopped moving yet.
