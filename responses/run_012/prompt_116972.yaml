answer: |-
  Good evening, everyone. For those who don't know me, I'm the Maid of Honor and the bride's sister. Looking around this room, I realize I have a unique challenge. About half of you are philosophers who know exactly what happened when my sister and her fiancé met. The other half are family who are currently wondering if "Euthyphro" is a type of cheese or a small country in Europe.

  So, here is the truth. They met in a seminar arguing about God. But not about whether He exists. They were arguing about what we mean when we say He is *good*.

  The question they fell in love over is this: Is God good because goodness is part of His nature, something true about Him even before He wills anything? Or is God good simply because He says so, because His will sets the standard for what "good" even means?

  If it's the first one, then goodness is something outside of Him that He answers to. But if it's the second one, then saying "God is good" is just a circle. It's like saying "God is God." It doesn't actually tell us anything about love or mercy; it just tells us about power.

  They never solved that problem. They aren't going to solve it tonight. And honestly, that is why I trust them with this marriage.

  Because when we look at a couple standing at the altar, we want a guarantee. We want to know that this love is "good" because it's written in the stars, destined by nature, unavoidable. Or, we want to know it's good because they are strong-willed people who have decided to make it work.

  But if love is just nature, just destiny, then their promise doesn't matter. You don't promise to do what you can't help but do. And if love is just will, just a decision they make every day, then calling it "good" feels fragile. It feels like saying, "I choose this," without being able to say *why* this choice is better than any other.

  So where does that leave us? It leaves us here.

  Real marriage, the kind these two are building, isn't about finding the answer to that dilemma. It's about living inside the question. It's about making a promise without a foundation that guarantees you'll keep it. It's about building a life together that is good, without either of you claiming to be the one who decides what "good" is.

  To the family: You want to know if they'll be happy. They will be, because they know there are no guarantees. They know love isn't a fact you find, and it isn't a rule you make. It's a practice you share.

  To the department: You want to know if I understood the assignment. I know that if you ground value only in will, you lose the content of the good. But if you ground it only in nature, you lose the agency of the lover. These two have found a way to hold both. They offer each other the will to choose, and the nature to be worthy of that choice, without pretending either one solves the mystery.

  So, please raise your glasses. To the bride and groom. May your life together be good, not because you say so, and not because you have to, but because you are brave enough to live without knowing the difference.

  To the couple.

  ***

  **Note:** The philosophers will nod hardest at the distinction between agency and content in the third-to-last paragraph, while the family will feel the most relief in the "To the family" section where I translate the metaphysics into "no guarantees."
