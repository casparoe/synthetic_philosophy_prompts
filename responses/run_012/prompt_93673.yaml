answer: |-
  Here is a demarcation procedure designed for your constraints (1-hour fact-check, mid-size magazine, high volume of fringe pitches). It draws heavily on Karl Popper (falsifiability), Imre Lakatos (research programmes), and the sociology of scientific knowledge (consensus as a signal).

  ### The Demarcation Protocol (DP-1)

  **Goal:** Filter pitches into **Run (Science)**, **Flag (Contested)**, or **No (Pseudoscience)**.
  **Time Budget:** 60 minutes for Fact-Checker (FC).
  **Authority:** Editor (you) makes the final call based on FC data; EIC handles disclaimers.

  ---

  #### Step 1: The Falsifiability & Specificity Check (10 mins)
  **Question:** Does the pitch make a specific claim that could be proven false by evidence, and does the author specify what that evidence would be?
  *   **Good Answer:** "If carbon dating on layer X shows dates post-1000 BCE, my theory is wrong."
  *   **Bad Answer:** "The data is interpreted differently," or "Mainstream science ignores this," without specifying *which* data would kill the theory.
  *   **Stop Condition:** If the claim is unfalsifiable or the goalposts move when challenged → **NO**.

  #### Step 2: The "Protective Belt" Audit (15 mins)
  **Question:** When the author's claim conflicts with established data (e.g., radiocarbon dates, ice core layers), do they discard the data or adjust their theory?
  *   **Philosophical Ground:** Lakatos argued healthy science adjusts the "protective belt" (auxiliary hypotheses) but protects the "hard core." Pseudoscience protects the hard core by discarding the belt (the evidence).
  *   **Good Answer:** "My theory predicts X, but we see Y. I propose Z mechanism explains the discrepancy, which can be tested by..."
  *   **Bad Answer:** "That dating method is fundamentally flawed/conspired," without independent proof of the flaw.
  *   **Stop Condition:** If established methods are dismissed *ad hoc* solely to save the theory → **NO**.

  #### Step 3: The Community Engagement Signal (20 mins)
  **Question:** Has this work been submitted to the relevant community for scrutiny, and what was the outcome?
  *   **Good Answer:** "It's under review at Journal X," or "It was presented at Conference Y, and the criticism was Z, which I address here."
  *   **Bad Answer:** "The journals are gatekept," or "I published a book/self-published paper."
  *   **Nuance:** A claim of "gatekeeping" is not an automatic fail, but it shifts the burden of proof significantly higher.
  *   **Stop Condition:** If there is zero attempt to engage the relevant expert community (archaeologists, geologists, etc.) → **NO**.

  #### Step 4: The Methodological Transparency Test (15 mins)
  **Question:** Can the FC follow the math/logic using standard tools in the remaining time?
  *   **Good Answer:** The statistical model is provided; the code is linked; the stratigraphy is mapped to standard grids.
  *   **Bad Answer:** "The algorithm is proprietary," or "You need my special training to see the pattern."
  *   **Stop Condition:** If the method is opaque or requires accepting the author's authority to verify → **NO**.

  #### Step 5: The Values Hand-Off (Editor Decision)
  If the pitch passes Steps 1–4 but contradicts a strong consensus:
  *   **Fact Question:** Is the methodology sound? (FC answers).
  *   **Values Question:** Is this claim "extraordinary"? Does publishing it risk misleading the public on settled science, or does it serve the public to know a consensus is being challenged?
  *   **Action:** If the science is sound but the claim is disruptive → **FLAG (Contested)**. Requires EIC disclaimer.

  ---

  ### The "Lab Coat" Confession
  *Where this procedure is actually your judgment in disguise:*

  1.  **Step 2 (Protective Belt):** Deciding whether an alternative explanation is a "legitimate hypothesis" or an "*ad hoc* rescue" is often subjective. You are judging whether their excuse for conflicting data sounds reasonable. That is intuition, not algorithm.
  2.  **Step 3 (Community Signal):** Relying on "peer review" assumes the current gatekeepers are correct. History is full of correct outsiders (e.g., Wegener/Continental Drift). By weighting Step 3 heavily, you are prioritizing *consensus* over *truth*. You are deciding that being wrong with the crowd is safer than being right alone.
  3.  **Step 5 (Values):** This is pure editorial policy. There is no scientific fact that tells you whether "public confusion" is worse than "suppressing heterodoxy." That is a moral call about your magazine's role in the ecosystem.

  ---

  ### Trial Run: The Three Pitches

  #### Case 1: The Statistical Re-dating of History
  *Pitch:* A mathematician claims ancient chronologies are wrong by 1,000 years based on statistical overlaps in royal names.
  *   **Step 1 (Falsifiability):** Pass. Claims specific dates are wrong.
  *   **Step 2 (Protective Belt):** **FAIL.** To make the stats work, the author dismisses dendrochronology and radiocarbon dating as "calibrated incorrectly" without offering a physical mechanism for the error. They are discarding physical evidence to save the statistical model.
  *   **Step 3 (Community):** **FAIL.** Published only in a journal of statistics, not history or archaeology. No response to archaeological criticism.
  *   **Verdict:** **NO.**
  *   **Reasoning:** It treats history as a closed mathematical system, ignoring physical evidence. This is category error pseudoscience.

  #### Case 2: The Lost Ice Civilization
  *Pitch:* Ground-penetrating radar anomalies in Antarctica suggest structures under the ice, dating to 10,000 BCE.
  *   **Step 1 (Falsifiability):** Pass. Claims structures exist at coordinates X.
  *   **Step 2 (Protective Belt):** **FAIL.** Ice core data shows no human pollution markers (lead, carbon) for that period. Author claims "they were eco-perfect" or "ice movement hid it." This is unfalsifiable special pleading.
  *   **Step 3 (Community):** **FAIL.** Data not shared with glaciologists. Claim made via press release, not paper.
  *   **Verdict:** **NO.**
  *   **Reasoning:** Extraordinary claim requires extraordinary evidence. The explanation for missing evidence (eco-perfect) removes falsifiability.

  #### Case 3: The Heterodox Site Re-dating
  *Pitch:* An archaeologist uses standard C14 and stratigraphy on a well-known site but claims a specific layer is 300 years older than consensus. This annoys the establishment because it upsets the timeline of a major cultural shift.
  *   **Step 1 (Falsifiability):** Pass. Specific dates, specific layers.
  *   **Step 2 (Protective Belt):** Pass. Acknowledges conflict with consensus. Suggests "old wood effect" or local carbon reservoir issues as the physical mechanism for the discrepancy. Testable.
  *   **Step 3 (Community):** Mixed. Paper submitted, currently under review. Some experts agree, some don't.
  *   **Step 4 (Transparency):** Pass. Raw data and lab reports provided.
  *   **Verdict:** **FLAG (Contested).**
  *   **Values Hand-Off:** The science is standard (Step 4), but the conclusion disrupts the paradigm.
  *   **Action:** Run the story, but include a sidebar: "The Consensus View." EIC signs off on the disclaimer that this represents a minority view within the field.
  *   **Reasoning:** This is how science actually moves. It passes the methodological checks, even if it fails the "comfort" check.

  ---

  ### What This Procedure Can't Do

  1.  **It Cannot Predict Truth:** This protocol filters for *scientific rigor*, not *truth*. Wegener's Continental Drift would have failed Step 3 (Community Engagement) in 1915. You will occasionally reject true ideas because they lack institutional support. You must accept this as the cost of not publishing nonsense.
  2.  **It Cannot Detect Sophisticated Fraud:** If an author fabricates data that *looks* methodologically sound (Step 4), your fact-checker cannot catch that in one hour. This procedure assumes good faith regarding data generation.
  3.  **It Cannot Solve the "Crank" vs. "Genius" Problem:** Both often sound identical in a pitch email. The difference usually reveals itself over years, not 60 minutes. This procedure minimizes risk; it does not maximize discovery.
  4.  **It Cannot Remove Your Bias:** In Step 2 (Protective Belt), your own familiarity with the "standard model" will dictate what sounds like a "plausible mechanism" versus an "excuse." If you don't understand the physics of ice cores, you can't judge the ice civilization pitch honestly. You are relying on the *signal* of community rejection, not the *substance* of the rejection.

  **Final Advice:** Use the protocol to justify the "No" to yourself and the "Flag" to your EIC. But keep your gut for the "Values Hand-Off." The protocol tells you if it's *science*; your judgment must decide if it's *news*.
