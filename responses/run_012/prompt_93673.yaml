prompt: |-
  I'm the science editor at a mid-size online magazine and I get two or three pitches a week that smell like pseudohistory -- a guy who's re-dated all of ancient history by running statistics on old chronicles, someone who's found a lost civilisation under the ice, someone with a theory that the pyramids are thousands of years older than archaeologists say. Right now I decide by gut in about twenty minutes: run it as science, run it with a 'contested' tag, or send a polite no. I'd like a procedure I can actually run instead, grounded in whatever philosophy of science has to say about where science stops and pseudoscience starts -- the questions to ask in order, what counts as a good enough answer to each, where it stops with a no, and where it hands the call to a person because it's a values question rather than a factual one. Be honest about wich steps are just my judgment wearing a lab coat. Then run it on three: the statistical re-dating of history, the lost ice civilisation, and one where I'd personally like the answer to come out the other way -- say a heterodox re-dating of a site that uses bog-standard methods but annoys the consensus. My fact-checker has maybe an hour, and the editor-in-chief signs off on anything we run with a disclaimer. Finish by telling me what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Science editor at a mid-size online magazine.
      *   **Problem:** Receives 2-3 pseudohistory pitches/week (re-dated history, lost civilizations, pyramid anomalies). Currently uses "gut feeling" (20 mins). Wants a structured procedure based on philosophy of science (demarcation problem).
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for "good enough" answers.
          *   Stop points (automatic "no").
          *   Hand-off points (values judgment vs. factual).
          *   Honesty about where judgment is disguised as procedure ("judgment wearing a lab coat").
          *   Test the procedure on three specific cases:
              1.  Statistical re-dating of chronicles (pseudohistory).
              2.  Lost civilization under ice (pseudohistory).
              3.  Heterodox re-dating using standard methods (borderline/controversial).
          *   Constraints: Fact-checker has 1 hour. Editor-in-Chief (EIC) signs off on disclaimers.
          *   Ending: Limitations of the procedure (what it *can't* do).

  2.  **Philosophical Grounding (The Demarcation Problem):**
      *   Need to draw from Popper (falsifiability), Kuhn (paradigms), Lakatos (research programmes), and modern sociology of science (consensus, peer review).
      *   *Key Insight:* There is no silver bullet. Pseudoscience often mimics the *form* of science without the *substance* (self-correction, community scrutiny).
      *   *Strategy:* Focus on *process* and *engagement with the community* rather than just the *claim*.

  3.  **Drafting the Procedure (The "Demarcation Checklist"):**
      *   *Step 1: Falsifiability & Specificity.* Can this be proven wrong? (Popper).
      *   *Step 2: Engagement with Existing Literature.* Do they cite mainstream work to refute it, or ignore it? (Lakatos/Kuhn).
      *   *Step 3: Methodological Transparency.* Can the fact-checker replicate the logic in 1 hour?
      *   *Step 4: External Validation.* Has this been submitted to peer review? What was the response?
      *   *Step 5: Extraordinary Claims.* Does it require rewriting fundamental physics/history without proportional evidence? (Sagan Standard).
      *   *Decision Nodes:* Pass/Fail/Review.

  4.  **Refining the "Judgment Wearing a Lab Coat" Aspect:**
      *   I need to be explicit that "consensus" is a social construct, even if a reliable one.
      *   I need to admit that "plausibility" is often just "familiarity."
      *   The "1-hour fact-check" constraint is the biggest bottleneck; the procedure must acknowledge this limitation.

  5.  **Testing the Procedure (The Three Cases):**

      *   *Case 1: Statistical Re-dating (The "New Chronology" type).*
          *   Likely fails on engagement with existing dating methods (C14, dendrochronology).
          *   Likely fails on peer review.
          *   *Verdict:* No.

      *   *Case 2: Lost Ice Civilization (Atlantis/Antarctica type).*
          *   Fails on physical evidence (geology/ice core data).
          *   Fails on falsifiability (often moves the goalposts).
          *   *Verdict:* No.

      *   *Case 3: Heterodox Re-dating (Standard methods, annoying conclusion).*
          *   Passes falsifiability.
          *   Passes methodology (bog-standard).
          *   Fails/Flag on consensus (why is it annoying?).
          *   *Verdict:* Contested Tag / Expert Review needed.

  6.  **Addressing the Constraints:**
      *   Fact-checker has 1 hour. The procedure can't require deep archival research. It must rely on *signals* (publication status, expert contact, method transparency).
      *   EIC signs disclaimers. This is the safety valve for the "Contested" category.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty (Demarcation Problem).
      *   **The Procedure (The "Demarcation Protocol"):** Step-by-step with stop conditions.
      *   **The "Lab Coat" Confession:** Explicitly highlighting subjective elements.
      *   **Trial Run:** Applying the protocol to the three cases.
      *   **Limitations:** What this system misses (sociological bias, stifling innovation, etc.).

  8.  **Drafting Content - Specific Considerations:**
      *   *Philosophy:* Use Popper for falsifiability, but emphasize Lakatos's "protective belt" vs. "hard core." Pseudoscience often protects the core at all costs.
      *   *Tone:* Professional, pragmatic, slightly cynical but constructive.
      *   *Time Management:* Ensure the steps fit the 1-hour fact-check window.
      *   *Values vs. Facts:* Distinguish between "is this true?" (fact) and "is this worth publishing despite controversy?" (values).

  9.  **Refining the "Honesty" Component:**
      *   I need to make sure I don't present this as an algorithm that outputs truth. It's a risk management tool.
      *   The "Values Question" is usually: "Do we want to platform this person?" or "Is the public interest served by airing this view?"

  10. **Final Review against Prompt:**
      *   Procedure grounded in philosophy? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Honesty about judgment? Yes.
      *   Run on 3 cases? Yes.
      *   Fact-checker time limit respected? Yes.
      *   EIC disclaimer role included? Yes.
      *   Finish with limitations? Yes.

  *(Self-Correction during drafting)*: Initially, I might suggest calling experts. But with a 1-hour fact-check window, calling an expert might take too long. Better to check *if* the author has engaged experts already (publications/conferences). I need to make sure the "Contested" tag isn't a cop-out for "we don't know." It needs to mean "Consensus says X, Author says Y, here is why."

  *(Refining the "Lab Coat" section)*: Be careful not to undermine the procedure entirely. It's a heuristic, not a truth machine. Acknowledge that "consensus" can be wrong, but betting against it requires high evidence.

  *(Final Polish)*: Ensure the distinction between "pseudohistory" and "heterodox history" is clear in the test cases. The third case is the tricky one.

