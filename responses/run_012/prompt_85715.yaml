      *   *Constraint 4 (Sensory/Affective):* I need to note which leaves survive if that distinction collapses.
      *   *Constraint (Empty Branches):* Are there combinations nobody takes?
          *   "Badness is intrinsic feel" + "Asymbolia has badness" is a hard sell (Kripke might say the sensation *is* the pain, so if they have the sensation, they have the pain, but do they have the *badness*? Kripke says pain = feeling, so if they feel it, it hurts. But asymbolics say it hurts but don't mind. So Kripke might say it *is* bad, they are just weirdly detached).
          *   "Representationalism" + "Badness Gone": Tye usually says pain is unpleasant representation. If asymbolia removes unpleasantness, does it remove the pain? Tye might say asymbolics don't feel *pain*, they feel *sensory disturbance*.

  5.  **Finalizing the Leaves (Positions):**
