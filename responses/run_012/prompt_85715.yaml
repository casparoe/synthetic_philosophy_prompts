  2.  **Deconstruct the Philosophical Landscape (Pain & Badness):**
      *   *Qualitative Hedonism (Intrinsic Feel):* Pain feels a certain way, and that feel is inherently bad. (e.g., Kripke, some readings of Bentham).
      *   *Separability Thesis (Sensory + Affective):* Pain has a sensory component (location, intensity) and an affective component (unpleasantness). Asymbolia loses the affective. Badness lives in the affective. (e.g., Price, Grahek).
      *   *Desire-Based/Conativism:* Pain is bad because we desire it to stop. If you don't desire it to stop (asymbolia), it's not bad for you. (e.g., Heathwood).
      *   *Imperativism:* Pain issues a command ("Stop this!"). Badness is tied to the authority/force of the command. Asymbolia might mute the command. (e.g., Klein, Martinez).
      *   *Representationalism (Intentionalism):* Pain represents bodily damage. Badness is either the content or the mode. If it represents damage, is it bad even if you don't care? (e.g., Tye).
      *   *Deflationary/Attitudinal:* The "badness" just *is* the aversion. No aversion = no badness. (e.g., Fink, some pragmatists).

  3.  **Drafting the Decision Nodes (The "Questions"):**
      *   *Start:* Accept Asymbolia (Patient says "It hurts" but doesn't care).
      *   *Q1 (The Big Fork):* Is the asymbolic patient's experience *bad for them*?
          *   *Yes:* Leads to views where badness is independent of reaction (Realism about badness, perhaps Representational or Intrinsic).
          *   *No:* Leads to views where badness depends on reaction (Desire, Deflationary, Affective).
      *   *Q2 (For "Yes" branch):* If it's bad, but they don't care, *why* is it bad?
          *   Is it because of what it *represents* (damage)?
          *   Is it because of how it *feels* intrinsically (qualia)?
      *   *Q3 (For "No" branch):* If it's not bad, what was missing that usually makes pain bad?
          *   Was it the *unpleasantness* (affective tone)?
          *   Was it the *desire/aversion* itself?
          *   Was it the *imperative force*?
      *   *Refining Q1:* Need to capture the "Badness vs. Motivation" distinction requested in point (3).
          *   Better Q1: Does the asymbolic case show that *badness* is missing, or only that *motivation* is missing?
          *   If *Motivation only*: Badness is present, but the link to action is cut.
          *   If *Badness missing*: Badness requires the reaction.

      *   *Refining the "Sensory/Affective" constraint (Point 4):* I need to make sure the tree doesn't force the Sensory/Affective distinction if a view doesn't need it.
      *   *Refining the "Badness without being bothered" constraint (Point 2):* This maps directly to the first split.

  4.  **Developing the Tree Structure (Iterative Process):**

