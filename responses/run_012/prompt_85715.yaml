answer: |-
  # SEMINAR HANDOUT: THE BADNESS OF PAIN
  **Entry Point:** Pain Asymbolia (Patient reports "It hurts," shows no distress, no avoidance, no desire for it to stop).

  ```text
  START: Accept the Asymbolia Case as described.
  │
  ├── Q1: Does the patient's indifference mean the experience lacks 
  │       *badness*, or only that the *link to action/motivation* is severed?
  │
  ├── BRANCH A: The link to action is severed. (Badness is PRESENT)
  │   │   *Commitment: Badness can exist without anyone being bothered by it.*
  │   │
  │   ├── Q2: If the badness is present despite the indifference, what 
  │   │       grounds that badness?
  │   │
  │   ├── Is it bad because of the INTRINSIC QUALITY of the sensation?
  │   │   └── LEAF 1: QUALITATIVE HEDONISM 
  │   │       (Pain feels a certain way, and that feel is inherently bad. 
  │   │        Asymbolics are anomalous; they feel the badness but are 
  │   │        disconnected from it.)
  │   │
  │   └── Is it bad because of WHAT IT REPRESENTS (e.g., bodily damage)?
  │       └── LEAF 2: OBJECTIVE REPRESENTATIONALISM 
  │           (The badness lies in the truth of the representation 
  │            [damage exists], not the subject's reaction. Asymbolia 
  │            is a failure of concern, not a failure of pain.)
  │
  └── BRANCH B: The badness itself is missing. (Badness is ABSENT)
      │   *Commitment: Being bothered is constitutive of pain's badness.*
      │
      ├── Q3: If the badness is missing, what component has been removed 
      │       that usually makes pain bad?
      │
      ├── Was it a specific AFFECTIVE TONE (unpleasantness) distinct 
      │   from the sensory location/intensity?
      │   └── LEAF 3: THE SEPARABILITY THESIS 
      │       (Pain = Sensory + Affective. Asymbolia removes the affective. 
      │        Badness lives in the affective component. 
      │        [DEPENDS on Sensory/Affective distinction])
      │
      ├── Was it the formation of a DESIRE (or aversion) to stop the stimulus?
      │   └── LEAF 4: DESIRE-BASED VIEW (CONATIVISM) 
      │       (Pain is bad because, and only when, we desire it to stop. 
      │        No desire = no badness. Asymbolia proves badness is 
      │        extrinsic to the sensation.)
      │
      ├── Was it the issuance of an IMPERATIVE COMMAND ("Stop this!")?
      │   └── LEAF 5: IMPERATIVISM 
      │       (Pain's badness is the authority of its command. Asymbolia 
      │        mutes the command's force. 
      │        [DEPENDS on Sensory/Affective distinction])
      │
      └── Was it the AVERSION ITSELF? (Is there no deeper component?)
          └── LEAF 6: DEFLATIONARY / ATTITUDINAL VIEW 
              (There is no "badness" over and above the aversion. 
               To say "pain is bad" just means "I averse this." 
               Asymbolics don't averse, so it isn't bad. 
               [SURVIVES without Sensory/Affective distinction])
  ```

  ### NOTES ON THE LEAVES & BRANCHES

  **1. The "Badness Without Bother" Fork (Branch A)**
  This is the major metaphysical divide. Branch A commits you to a form of realism about badness: it is a property that can obtain even if the subject is indifferent. Branch B commits you to the view that badness is essentially tied to conation or affect.

  **2. Dependency on the Sensory/Affective Distinction**
  *   **Leaf 3 (Separability)** and **Leaf 5 (Imperativism)** generally collapse if you reject the distinction between sensory-discriminative and affective-motivational processing.
  *   **Leaf 6 (Deflationary)** and **Leaf 4 (Desire-Based)** survive the collapse. They do not require a specific "affective qualia"; they only require that the subject takes a stance (desire/aversion) toward the experience.
  *   **Leaf 1 (Hedonism)** is vulnerable: if the "feel" includes the "ouchiness," and asymbolics feel the "ouch" without the "bad," the Hedonist must argue the asymbolic feel is qualitatively identical to ours *except* for the badness, which risks circularity.

  **3. Unoccupied or Incoherent Combinations**
  *   **Branch A + Desire-Based:** Logically incoherent. If badness depends on desire (Leaf 4), and the asymbolic has no desire, you cannot claim badness is present (Branch A).
  *   **Branch B + Qualitative Hedonism:** Attractive to no one. If the intrinsic feel is what makes pain bad (Leaf 1), and the asymbolic has the feel, you must conclude the badness is present (Branch A). Claiming the feel is present but the badness is gone contradicts the core hedonist claim.
  *   **The "Motivation Only" Gap:** There are few takers for the view that asymbolia removes *only* the motor reflex (flinching) while leaving both badness *and* desire intact. The clinical data suggests the desire ("I want this to stop") is also absent, forcing most "Badness is Present" theorists into the uncomfortable position of arguing the patient is mistaken about their own desire.

  **4. Indistinguishable Leaves**
  *   **Leaf 4 (Desire)** and **Leaf 6 (Deflationary)** are often extensionally equivalent in this context. The difference is metaphysical: Does the desire *track* a badness (Desire-Based Realism) or *constitute* it (Deflationary)? Asymbolia alone may not separate them.
