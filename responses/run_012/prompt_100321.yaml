answer: |-
  **Q&A PREP SHEET: SUPERRATIONALITY & PRACTICAL RATIONALITY**

  **STRATEGY**
  **Concede:** Superrationality overlaps significantly with EDT; Hofstadter's lottery results are descriptively messy (costs/fun mattered).
  **Hold:** Symmetry creates a normative constraint on individual reasoning independent of causal leverage. Dominance reasoning fails because it assumes probabilistic independence unjustifiably in symmetric contexts.

  **OBJECTIONS (Ordered by Damage)**

  **1. Philosopher of Practical Reason**
  *Objection:* "Where is the *reason*? If 'we' don't exist as a collective agent, you have no obligation to act for 'us'. You're conflating heuristic similarity with normative binding. Why should I care about consistency over payoff?"
  *Reply (2-min core):* The reason isn't collective obligation; it's individual consistency. If I claim my reasoning is universalizable, I must act on the output of the reasoning process I expect others to use. Denying this makes my rationality contingent on arbitrary indexicals ('me' vs. 'them'). In symmetric problems, 'what should I do' *is* 'what should we do' because the inputs are identical.
  *Soft Spot:* Doesn't fully explain why I should prioritize consistency over payoff maximization if causality is absent.

  **2. Causal Decision Theorist**
  *Objection:* "This is magical thinking. Your choice doesn't *cause* theirs. You're betting on a correlation you can't influence. CDT requires causal leverage."
  *Reply (2-min core):* It's not causation; it's logical necessity. We are instantiating the same algorithm. Choosing 'defect' logically implies the other algorithm outputs 'defect'. Ignoring this is ignoring the logical structure of the problem. CDT's independence assumption is the error, not the correlation.
  *Soft Spot:* CDTers reject logical correlation as action-guiding. You won't convert them; aim to show coherence, not causation.

  **3. Hardcore Game Theorist**
  *Objection:* "This is incoherent. Without a correlating device, this isn't a Correlated Equilibrium. It's just Nash with wishful thinking. You're violating the definition of strategy independence."
  *Reply (2-min core):* Symmetry *is* the correlating device. Common knowledge of rationality substitutes for the external signal. It expands the solution concept beyond Nash without violating consistency. We aren't wishing; we're solving for fixed points in shared reasoning.
  *Soft Spot:* Technically, standard CE definitions require an external signal. You're proposing a new equilibrium concept, not using standard CE.

  **4. Evidential Decision Theorist**
  *Objection:* "You've reinvented EDT. Why the new label? You're just conditioning on the act."
  *Reply (2-min core):* EDT is the calculus; superrationality is the application to symmetric games where the 'evidence' is logical identity rather than statistical correlation. It clarifies *why* the conditioning happens (shared algorithm) rather than just that it does.
  *Soft Spot:* They may be right; the distinction is largely expository. Don't fight too hard on distinctness.

  **5. Behavioral Economist**
  *Objection:* "Hofstadter's lottery failed. People entered repeatedly. If it's rational, why didn't they do it? Your theory predicts cooperation; data shows defection."
  *Reply (2-min core):* Normative theories aren't falsified by descriptive failure. Also, entry costs were negligible; many treated it as fun, not profit. The *trap* remains valid regardless of uptake. Rationality is about correct reasoning, not typical behavior.
  *Soft Spot:* Weakens the claim that this is *practical* rationality if humans systematically reject it.

  **HOPE NOBODY ASKS**
  *Objection:* "How do you coordinate the mixed strategy randomization without a shared randomizer? If I pick 1/N using my private coin, and you use yours, the *outcomes* aren't logically linked, only the probabilities."
  *Reply:* The logical link is the *decision* to randomize with probability 1/N, not the outcome of the toss. If we both decide on p=1/N, the expected utility calculation holds regardless of outcome independence.
  *Soft Spot:* **Bluff.** This is technically thorny. Independent randomization breaks the logical lock on outcomes. If pressed, concede this requires further formalization.

  **SETTLED VS. CONTESTED (Do not conflate)**
  *Contested:* Whether superrationality is distinct from EDT (many say no). Whether the $1/N$ mixed strategy is Hofstadter's explicit derivation (often a later formalization). Whether lottery results indicate irrationality or bounded rationality/contextual utility.
  *Settled:* Nash equilibrium assumes independence. Hofstadter's lottery had high participation (reducing payoff). Dominance reasoning relies on independence assumptions.

  **FINAL NOTE**
  Do not claim superrationality *causes* cooperation. Claim it *licenses* it as rational in symmetric contexts. Distinguish normative force from descriptive accuracy.
