answer: |-
  To understand Kepler's position, we have to hold three competing readings in tension. First, as **genuine natural philosophy**: Kepler was a Platonist who believed geometry was the literal architecture of God's mind; if the cosmos is built on harmony, and the human soul is made of the same stuff, a causal link is not superstition but metaphysics. Second, as **professional rhetoric**: Kepler was Imperial Mathematician, a job that required casting horoscopes for patrons who would not fund pure astronomy; reforming astrology made it defensible to skeptical elites while keeping the income stream. Third, as a **transitional hybrid**: He was replacing the old "qualitative" physics (hot, cold, wet, dry) with "quantitative" physics (angles, ratios, light intensity), which looks like modern science but still relies on an animistic universe where planets have souls. The historical record is genuinely contested here; his private letters suggest deep personal conviction in the harmony, while his public prefaces often apologize for astrology's uncertainty. We cannot fully disentangle the sincere believer from the careful courtier, but the tension itself is where the insight lies.

  Here are the implications of his reformed astrology, ordered by importance:

  First, regarding your question on re-founding discredited practices: Kepler implies that legitimacy comes from **causal mechanism, not predictive success**. He was willing to discard centuries of astrological "data" regarding signs and houses because they lacked a geometric cause, even if they seemed to work empirically. It is **forced** by his writings that a practice cannot be scientifically re-founded simply by keeping the old predictions; it requires a new physical story (in his case, light rays and geometry) that explains *how* the influence travels. If the mechanism is arbitrary (like the arbitrary boundaries of zodiac signs), the practice remains superstition, regardless of how often it seems right. This suggests that "re-founding" is only legitimate when it sacrifices the old system's arbitrary rules to fit a stricter causal model, rather than just dressing old rules in new math.

  Second, regarding your question on astronomy versus numerology: The astrological motive does not undermine the astronomy; it **generates** it. It is **forced** by the historical timeline that Kepler's search for harmonic ratios (an astrological/musical quest) is what drove him to reject circular orbits and discover ellipses. If he had been a strict mechanist, he might have settled for "equants" or epicycles that saved the phenomena without satisfying the harmony. The search for mathematical harmony was doing real work because it acted as a constraint on his models; he refused to accept a planetary theory that didn't sing. This implies that what we might dismiss as "numerology" can function as a legitimate heuristic, provided it demands rigorous mathematical consistency rather than vague symbolic association.

  Third, Kepler's position forces a recognition that **uncertainty is a feature, not a bug, of natural science**. Unlike traditional astrologers who claimed certainty, Kepler openly admitted his reformed astrology was conjectural and often wrong, famously calling it the "foolish daughter." It is **forced** by his *De Fundamentis Astrologiae Certioribus* that he distinguished between the certain knowledge of planetary positions (astronomy) and the probabilistic knowledge of their effects (astrology). The implication is that a practice can be "scientific" in method even if its predictions are unreliable, provided it is honest about the limits of its causality. This separates him from charlatans who claim infallibility; his "re-founding" included a demotion of the practice's claims to truth.

  Fourth, his system implies that **objectivity requires a subject**. Kepler's mechanism for astrology relies on the Earth (or the human soul) actively "perceiving" the planetary angles and responding to the harmony. It is **suggestive**, though not fully proven, that Kepler saw the universe as a communicative network rather than a clockwork machine. The implication here is that in removing the "magic" from astrology, he didn't remove the "soul"; he made the soul a necessary component of the physics. This challenges the modern assumption that removing superstition means removing the observer; for Kepler, a universe without a soul to perceive its harmonies would be silent and ineffective.

  Fifth, the case of his mother's trial implies that **scientific demarcation is often a legal survival strategy**. Kepler had to define "natural influence" (light and geometry) versus "demonic magic" (charms and pacts) to save his mother and himself. It is **forced** by the context of the witch trials that his theoretical distinctions were sharpened by the threat of execution. The implication is that the boundary between "science" and "superstition" is not always discovered in nature but is sometimes drawn in the courtroom. A practice is re-founded not just to be truer, but to be legally defensible, separating acceptable natural philosophy from punishable sorcery.

  Finally, the implication a non-specialist is most likely to get wrong is that **Kepler was a modern scientist burdened by superstition**. The reverse is closer to the truth: he was a Renaissance mystic who invented modern tools. It is **suggestive** but crucial to realize that Kepler did not see his astronomy and astrology as separate departments; they were one unified theology of nature. To view his astrology as a flaw in his astronomy is to anachronistically impose our modern categories on him. The "re-founding" wasn't an attempt to make astrology safe for scientists; it was an attempt to make the entire cosmos safe for God, ensuring that every physical motion reflected a divine geometric intention.
