prompt: |-
  Okay I need a hand untangling something, and I want you to act like a referee here — you're a decision theorist / philosopher-of-science type who's thought alot about collective decision-making, and please don't just name a step and wave at it. Think it through out loud first, maybe list the candidate diagnoses before you commit, then tell me which one you actually endorse and why.

  Here's the deal. A friend keeps invoking something he calls the unilateralist's curse, and honestly I think he's onto something. The setup: twenty of us on some committee, and each of us is independently able to unilaterally trigger one and the same intervention — a trial, a release, whatever. It's common knowledge that the intervention is worth doing iff one underlying fact C holds (it really works, the side effects really are mild). Each of us has our own private, noisy read on whether C holds; nobody sees anybody else's read. The intervention goes ahead if *any* of us triggers it. It only doesn't go ahead if all twenty of us hold back.

  His argument, as I understand it:

  (1) Each of us should trigger it iff our own private evidence makes the expected value positive.
  (2) Since it goes ahead if anyone triggers it, the person who actually triggers it will tend to be whoever's private evidence most strongly favoured it — i.e., the most misleading sample, when C is in fact false.
  (3) So conditional on it going ahead, C is less likely than the triggerer's own evidence makes it out to be. There's a selection effect, and it worsens as the group gets bigger.
  (4) Therefore each of us should demand more evidence before triggering than our private read alone justifies, and the more of us there are who could act, the higher that bar should be.
  (5) Extend it: as the number of possible actors grows, the bar keeps climbing, and in the limit nobody should ever trigger anything on private evidence. All unilateral initiative — founding the company, publishing the result that bucks the consensus, blowing the whistle — is someone being the tail of a noisy sample, so it's all suspect.

  I can't accept (5). If nobody ever acted on private evidence then nobody would ever have founded anything or overturned a consensus, and that's definately worse, not better. So something in there is off.

  But here's the part that's actually got me stuck. I tried to run the whole thing in reverse and it seemed to go through just as cleanly. Look at *not* triggering. The intervention fails to happen only if every one of us holds back. So the people who hold back are selected for the most restraint-leaning evidence — again the tail of a noisy sample, just at the other end. By parity, conditional on the intervention *not* going ahead, C is *more* likely than the hold-backers' evidence suggests, so each of us should *lower* our bar for acting, not raise it. Identical setup, opposite prescription.

  That can't be right either, and now I've got 'never act' out of one pass and 'always act' out of the mirror pass. I don't believe the curse reasoning is just incoherent, so one of these passes has to be cheating somewhere. Which step actually fails? Is it the same step in both directions, or is the whole point that the two directions aren't symmetric at all? I'd most like to keep (2) and (3) — the selection effect feels like the real thing — but tell me what I'm paying if I have to drop something. And if the fix is 'defer to the group's pooled evidence', say precisely why the pooled number is the thing to defer to, and whether the mirror argument has a pooled number of its own that I've been ignoring.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Someone grappling with a specific paradox in decision theory/collective action (the "Unilateralist's Curse"). They are intelligent, familiar with the concepts (selection effects, private evidence, common knowledge), and skeptical of extreme conclusions (like "never act").
      *   **My Role:** Referee, Decision Theorist/Philosopher-of-Science. I need to think out loud, list candidate diagnoses, commit to one, and explain *why*. No hand-waving.
      *   **The Core Problem:** The user presents the standard "Unilateralist's Curse" argument (Bostrom et al.) which suggests raising the threshold for action in groups. Then they present a "mirror argument" regarding *inaction* which suggests lowering the threshold. This creates a contradiction (Never Act vs. Always Act). The user wants to know which step fails, if the symmetry is real or fake, and how to resolve it while preserving the intuition about selection effects.

  2.  **Deconstruct the Arguments:**

      *   **The Setup:** $N=20$ agents. Action $A$ happens if $\exists i$ such that Agent $i$ chooses $A$. Action $A$ is good iff Condition $C$ is true. Agents have private signals $S_i$ about $C$.
      *   **Argument 1 (The Curse):**
          *   Premise: Action happens if *anyone* acts.
          *   Selection Effect: The actor is likely the one with the most extreme positive signal.
          *   Inference: If $C$ is false, the person acting is likely mistaken (outlier).
          *   Conclusion: Raise the threshold for action to compensate for the "most optimistic outlier" effect.
      *   **Argument 2 (The Mirror):**
          *   Premise: Inaction happens if *everyone* holds back.
          *   Selection Effect: The set of non-actors is selected for extreme negative signals (or rather, the *decision* not to act relies on everyone agreeing implicitly).
          *   Inference: If $C$ is true, the people holding back are likely mistaken (outliers on the low end).
          *   Conclusion: Lower the threshold for action (because inaction is the result of a "most pessimistic" consensus).

  3.  **Initial Brainstorming & Candidate Diagnoses:**

      *   *Candidate 1: The Symmetry is Illusory.* The decision rule isn't symmetric. Action requires 1 vote. Inaction requires $N$ votes (unanimity of restraint). The "selector" is different.
      *   *Candidate 2: The Reference Class Problem.* Who are we conditioning on? In Argument 1, we condition on "Action Happened." In Argument 2, we condition on "Action Did Not Happen." But the decision is made *ex-ante*.
      *   *Candidate 3: The Definition of "Threshold".* What does it mean to "raise the bar"? It means changing the decision rule. But if everyone changes the rule, the selection effect changes. We need a Nash Equilibrium analysis, not just a fixed-rule analysis.
      *   *Candidate 4: Pooled Evidence vs. Private Evidence.* The core issue is that private evidence is being treated as the sole input, but the *structure of the game* provides meta-evidence.
      *   *Candidate 5: The "Curse" is about Coordination, not Epistemology.* The error isn't in the probability update, it's in the decision rule assuming independence when outcomes are shared.

  4.  **Deep Dive into the "Mirror Argument" Flaw:**

      *   Let's look closely at Argument 2.
      *   "The intervention fails to happen only if every one of us holds back." -> True.
      *   "So the people who hold back are selected for the most restraint-leaning evidence." -> **Here is the snag.**
      *   In Argument 1 (Action), the *outcome* is determined by the *maximum* signal (the most eager person). If anyone says "Go", it goes. So the outcome correlates with $\max(S_i)$.
      *   In Argument 2 (Inaction), the *outcome* is determined by the *minimum* signal (or rather, the fact that all $S_i < \text{Threshold}$).
      *   The Mirror Argument claims: "Conditional on inaction, $C$ is more likely than the hold-backers' evidence suggests."
      *   Why? Because if $C$ were true, surely *someone* would have seen it?
      *   But wait. If I am deciding whether to act, I don't know if others are holding back. I only know my signal.
      *   The Mirror Argument tries to tell me how to interpret *Inaction*. But I am deciding on *Action*.
      *   Actually, the deeper flaw is in the counterfactual reasoning.
      *   Argument 1 says: "If I act, I am likely the outlier." -> So I should require more evidence.
      *   Argument 2 says: "If I don't act, and nobody else acts, we are all outliers." -> So I should act?
      *   The asymmetry lies in the **causal power**. My decision *can* cause Action (if I'm the first). My decision *cannot* single-handedly cause Inaction (Inaction requires everyone).
      *   Therefore, the selection effect applies to the *pivot* agent.
      *   In the "Action" case, the pivot is the person with the highest signal.
      *   In the "Inaction" case, there is no single pivot. It's a collective failure.
      *   *Wait, let's refine this.* The Unilateralist's Curse (Bostrom, Sandberg, Öhman) specifically addresses the case where agents share a *common goal* but have private information. The solution is usually to act as if you are the *pivotal* voter, or to pool evidence.
      *   The Mirror Argument fails because it treats "Inaction" as an active outcome selected by the group, but from the perspective of a single agent deciding *ex-ante*, "Inaction" is the default state if they do nothing.
      *   Actually, the strongest objection to the Mirror Argument is about **Conditioning**.
      *   Argument 1 conditions on "The Intervention Happens." This is an event that *will* occur if you act (assuming others don't negate it, which they can't in this setup).
      *   Argument 2 conditions on "The Intervention Does Not Happen." This event occurs only if *you* don't act AND *no one else* does.
      *   When I am making my decision, I cannot condition on "No one else acts" as a fixed fact. I have to assign a probability to it.
      *   The Mirror Argument assumes that "Inaction" is a selected sample in the same way "Action" is. But "Action" is selected by the *maximum* of the distribution. "Inaction" is selected by the *minimum* (specifically, that the max was below threshold).
      *   If I lower my bar because "Inaction is suspicious," I increase the probability of Action. This changes the selection effect for Action!
      *   The equilibrium matters.

  5.  **Developing the "Pooled Evidence" Solution:**

      *   The user asks: "If the fix is 'defer to the group's pooled evidence', say precisely why..."
      *   This is the standard resolution to the Unilateralist's Curse (Bostrom et al.).
      *   Why pooled? Because the agents have a common interest (Value of Action depends on $C$). They are not adversaries.
      *   If they are on the same team, private signals should be aggregated.
      *   The "Curse" arises because agents act on $P(C | S_i)$ instead of $P(C | S_1, ..., S_N)$.
      *   Since they can't communicate, they must *simulate* the pooling.
      *   How? By adjusting the threshold.
      *   If $N$ people have independent signals, the combined evidence is stronger than any single signal.
      *   To act unilaterally is to claim "My signal is strong enough to outweigh the potential negative signals of the other $N-1$ people who haven't acted yet."
      *   This justifies raising the bar (Argument 1).
      *   Why does Argument 2 fail? Because "Inaction" isn't a signal generated by the group in the same way. Inaction is the absence of a trigger.
      *   Actually, the Mirror Argument's error is subtle. It says: "Conditional on inaction, $C$ is more likely than hold-backers think."
      *   This implies that if we all hold back, we are collectively ignoring a truth.
      *   But if I lower my bar, I increase the false positive rate.
      *   The symmetry breaks because **Action is a positive claim**. Inaction is the null hypothesis.
      *   Wait, is it? In the setup, Action is good iff $C$. $C$ could be rare or common.
      *   Let's look at the "Pivotality" argument.
      *   I should only act if my action changes the outcome.
      *   In this setup (OR gate), my action changes the outcome *unless* someone else has already acted or will act.
      *   If I assume others are using the same decision rule as me...
      *   This is a Game Theory / Nash Equilibrium problem.
      *   If everyone uses threshold $T$, what is the optimal $T$?
      *   Argument 1 says $T$ should be high. Argument 2 says $T$ should be low.
      *   They can't both be right.
      *   The Mirror Argument fails because it conditions on an outcome (Total Inaction) that is **counterfactually dependent on the very decision rule being evaluated**.
      *   If I decide "I will lower my bar," then "Total Inaction" becomes less likely.
      *   Argument 1 conditions on "Action." If I raise my bar, "Action" becomes less likely.
      *   So why is Argument 1 valid and Argument 2 invalid?
      *   Because Argument 1 identifies a **negative externality** of acting (false positive). Argument 2 identifies a **negative externality** of not acting (false negative).
      *   But the selection effect is asymmetric.
      *   The "Actor" is the *maximum* signal. The "Non-Actor" is *everyone*.
      *   The distribution of the Maximum of $N$ samples is very different from the distribution of the Set of $N$ samples.
      *   The "Curse" relies on the fact that the person who acts is the *extreme outlier*.
      *   The people who don't act are *not* necessarily extreme outliers. They are just everyone else.
      *   If $C$ is false, and I act, I am likely the one who got a $+3\sigma$ error.
      *   If $C$ is true, and nobody acts, it's not necessarily because everyone got $-3\sigma$ errors. It could be that everyone got $+1\sigma$ errors but the threshold was too high.
      *   The Mirror Argument assumes that "Inaction" implies "Everyone saw strong evidence against." But Inaction only implies "No one saw evidence *above threshold*."
      *   If the threshold is rational, Inaction implies "The pooled evidence didn't clear the bar."
      *   So Argument 2 begs the question: it assumes the threshold is wrong to prove the threshold is wrong.

  6.  **Synthesizing the Referee Persona:**

      *   **Tone:** Analytical, fair, rigorous, slightly conversational but dense.
      *   **Structure:**
          1.  Acknowledge the sophistication of the puzzle (it's a known tension in the literature).
          2.  List Candidate Diagnoses (Symmetry, Equilibrium, Pooled Evidence).
          3.  Select the Winner (The Asymmetry of Pivotality + Common Interest).
          4.  Explain why Argument 1 holds (Selection on the Max).
          5.  Explain why Argument 2 fails (Selection on the Set / Question Begging).
          6.  Address the "Pooled Evidence" fix explicitly.
          7.  Final Verdict on the "Never Act" extreme.

  7.  **Refining the "Mirror Argument" Takedown:**
      *   The crucial point: The Unilateralist's Curse is about **over-activation** due to **independent trials on a shared risk**.
      *   The Mirror Argument treats Inaction as a "collective decision." But in a unilateralist setup, Inaction is the *absence* of a decision.
      *   More technically: The probability of Action is $1 - (1-p)^N$. The probability of Inaction is $(1-p)^N$.
      *   The selection effect in Argument 1 is about the *marginal* actor. "Given that action occurred, who did it? The optimist."
      *   The selection effect in Argument 2 is about the *collective*. "Given that inaction occurred, what does the group know?"
      *   But *I* am not the group. I am an individual.
      *   If I lower my bar, I am not correcting for the group's pessimism; I am adding noise to the system.
      *   The "Pooled Evidence" norm is the only stable equilibrium. If everyone acts as if they are pooling, the threshold rises (Argument 1). Argument 2 disappears because "Inaction" is correctly interpreted as "Pooled evidence was insufficient," not "We are all blind."

  8.  **Drafting the Response (Mental Outline):**
      *   *Intro:* Validate the user. This is the "Unilateralist's Curse" (Bostrom et al.). The mirror argument is a known objection but fails on specific grounds.
      *   *Diagnoses:*
          1.  Symmetry Break (Action vs Inaction logic).
          2.  Equilibrium vs. Fixed Rule (Nash).
          3.  The "Common Interest" Assumption.
      *   *The Verdict:* The symmetry is fake. Argument 1 identifies a statistical truth about maxima. Argument 2 commits the "Ecological Fallacy" or confuses group output with individual input.
      *   *The Fix:* "Act as if you are pooling." Explain the math simply. $P(C | \text{All Signals})$ vs $P(C | \text{My Signal})$.
      *   *Why Argument 2 fails:* It treats the *absence* of an action as a positive signal of equal weight to the *presence* of an action. But in a unilateral setup, silence is not consent, it's just silence. You can't infer strong negative evidence from silence unless you know others *should* have spoken.
      *   *Conclusion:* Keep (2) and (3) for Action. Reject the Mirror. The "Never Act" conclusion is a reductio of ignoring the *value* of the action, not the probability.

  9.  **Self-Correction/Refinement during drafting:**
      *   Wait, I need to be careful about the "Never Act" conclusion. The user rejects (5). I should too.
      *   Why is (5) wrong even if (1)-(4) are right? Because (4) says "demand *more* evidence," not "infinite evidence." (5) extrapolates to the limit improperly. As $N \to \infty$, the threshold rises, but if the signal is strong enough, you still act.
      *   Also, the Mirror Argument's flaw is specifically about **Conditioning on the Outcome**.
      *   When I decide, the outcome hasn't happened.
      *   Argument 1: "If I act, I am likely the outlier." This is a prediction about the *causal chain I initiate*.
      *   Argument 2: "If we don't act, we are likely outliers." This is a post-hoc observation about a state I am trying to prevent.
      *   Better phrasing: Argument 2 confuses the **epistemic state of the group** with the **decision rule of the individual**.
      *   Okay, I'm ready to write. I will adopt the persona of a thoughtful colleague/referee.

  10. **Final Polish:** Ensure I explicitly answer "Which step fails?" and "Is it the same step?" and "Why pooled evidence?"

      *   *Step that fails:* Step (2) in the Mirror Argument. The selection effect for inaction is not analogous to the selection effect for action.
      *   *Why:* Action is determined by the *maximum* signal. Inaction is determined by the *distribution* of all signals being below threshold. The "most restraint-leaning" person doesn't decide inaction; the *lack of a 'go' person* decides inaction.
      *   *Pooled Evidence:* Because you share a goal. You are effectively one mind with 20 eyes. Acting on one eye is irrational.

      Let's go.
answer: |-
  Alright, let's sit down with this. You've stumbled onto a very sharp tension that keeps decision theorists and effective altruists up at night. This is essentially the **Unilateralist's Curse** (formalized by Bostrom, Sandberg, and Öhman), but you've pushed it harder than most by running the symmetry argument to its breaking point.

  You are right to feel that (5) is a *reductio ad absurdum*. If the logic implies that innovation and whistleblowing are inherently irrational as groups scale, the logic has eaten itself. But you are also right that the selection effect in (2) and (3) feels robust. It *is* robust.

  The problem isn't that the reasoning is incoherent; it's that the **Mirror Argument** (the reverse pass) smuggles in a category error regarding how selection effects apply to *outcomes* versus *decisions*.

  Here is my breakdown of the candidate diagnoses, followed by my ruling on where the symmetry breaks and why the "Pooled Evidence" norm is the only stable equilibrium.

  ### Candidate Diagnoses

  Before I commit, let's look at the three ways we could resolve this contradiction.

  **Diagnosis A: The Equilibrium Error.**
  Both arguments treat the other agents' behavior as fixed while you change your own rule. But if everyone reasons this way, the selection effect changes.
  *   *Pros:* Acknowledges this is a game, not a solo decision.
  *   *Cons:* Doesn't explain why the Action selection effect is "real" but the Inaction one isn't. In a Nash equilibrium, both pressures should balance.

  **Diagnosis B: The Asymmetry of Causality.**
  Action is caused by *one* person (the maximum signal). Inaction is caused by *everyone* (the conjunction of restraint). The statistical properties of a "Maximum of $N$" are different from the "Conjunction of $N$."
  *   *Pros:* Mathematically sound. The distribution of the maximum skews differently than the distribution of the mean.
  *   *Cons:* Needs careful explanation of why this asymmetry favors the Curse over the Mirror.

  **Diagnosis C: The Common Interest Assumption.**
  The Curse only applies if we assume the committee shares a *common goal* (maximizing true positives, minimizing false positives). If we share a goal, we should act as a single epistemic unit. The Mirror Argument fails because it treats "Inaction" as a positive signal generated by the group, when in a unilateralist setup, Inaction is just the absence of a signal.
  *   *Pros:* Resolves the "Never Act" paradox. Explains why we pool evidence.
  *   *Cons:* Requires accepting a normative claim (you *ought* to pool) rather than just a descriptive one.

  ### The Verdict

  I endorse **Diagnosis C, supported by B**.

  Here is the precise failure point: **Step (2) of the Mirror Argument is false.**

  > *Mirror Step (2): "So the people who hold back are selected for the most restraint-leaning evidence — again the tail of a noisy sample, just at the other end."*

  This looks symmetric, but it isn't. Here is why.

  #### 1. The Selection Effect is on the Pivot, not the Set
  In the **Action** case (The Curse):
  The intervention happens if $\max(S_1, ..., S_{20}) > \text{Threshold}$.
  If the intervention happens, we know for a fact that *at least one person* saw a signal in the extreme tail. If $C$ is false, that person is almost certainly an outlier (a false positive). The "Actor" is selected *by the mechanism* to be the most optimistic person. The selection pressure is intense.

  In the **Inaction** case (The Mirror):
  The intervention fails if $\forall i, S_i < \text{Threshold}$.
  The Mirror Argument claims the people who hold back are "selected for restraint-leaning evidence." This is wrong. The people who hold back are **everyone**. They are not selected for being the *most* pessimistic; they are selected for *not being the most optimistic*.
  There is no "Pivot Non-Actor." There is no single person whose private evidence drove the inaction. Inaction is the default state of the system. It does not carry the same specific informational weight as a triggered action.

  To put it sharply: **Action reveals the maximum signal. Inaction reveals only that the maximum signal was below a threshold.**
  Knowing the maximum was below a threshold does not imply the *average* signal was low. It just implies no one was crazy enough to pull the trigger.
  Therefore, you cannot infer from Inaction that "C is more likely than we think." You can only infer that "No one saw a slam-dunk."

  #### 2. The Conditioning Error
  The Mirror Argument conditions on the outcome ("Conditional on the intervention *not* going ahead..."). But you are making the decision *ex-ante*.
  When you decide whether to act, you cannot condition on "No one else acts." You have to assign a probability to that.
  *   **Curse Argument:** "If I act, I am effectively claiming my signal outweighs the probability that everyone else is right to stay silent."
  *   **Mirror Argument:** "If I don't act, I am claiming the silence of others is meaningful."

  The silence of others is only meaningful if you assume they are using a **rational decision rule**. If you assume they are rational, then their silence *does* convey evidence. But if their silence conveys evidence, you should **pool** that evidence (Diagnosis C).
  If you pool the evidence, you don't "lower your bar." You realize that 19 people seeing "mild evidence" plus you seeing "mild evidence" might sum to "strong evidence."
  But the Mirror Argument says "Lower your bar," which implies acting on *less* evidence than you have. That's irrational. You should act on *more* evidence (the pooled sum), which usually means a higher bar for *unilateral* action.

  ### The Fix: Pooled Evidence

  You asked precisely why the pooled number is the thing to defer to.

  **The Epistemic Justification:**
  You stated: *"It's common knowledge that the intervention is worth doing iff one underlying fact C holds."*
  This means you and your 19 colleagues are not adversaries; you are **distributed sensors for the same truth**. You have a common interest function.
  In decision theory, when agents share a common prior and a common goal, and have private signals, the rational strategy is to act as if all signals were aggregated. This is Aumann's Agreement Theorem territory.

  If you act on $P(C | S_{\text{me}})$, you are ignoring 95% of the available data (the signals of the other 19).
  Since you can't talk to them, you must simulate the aggregation.
  *   If you see a signal $S_{\text{me}}$ that suggests action, you must ask: "Is this signal strong enough to overcome the likely silence of the other 19?"
  *   The silence of the 19 is evidence *against* $C$ (assuming they are rational).
  *   Therefore, your private signal must be **stronger** to compensate for the negative evidence implied by their inaction.

  This validates the **Curse (Argument 1)** and kills the **Mirror (Argument 2)**.
  *   **Curse:** Correct. You must raise your bar because your action overrides the implicit negative evidence of 19 silent peers.
  *   **Mirror:** Incorrect. You don't lower your bar. You recognize that "Total Inaction" means "Pooled Evidence was Insufficient." If you lower your bar, you are essentially saying "I know the pooled evidence says 'No', but I'm going to ignore 19 votes to follow my 1 vote." That is the definition of irrationality in a common-interest game.

  ### What You Are Paying

  You want to keep (2) and (3) — the selection effect. You can. But here is the cost:

  1.  **You must abandon the idea that Unilateralism is a neutral default.**
      Unilateral action in a group of epistemic peers is an **aggressive epistemic claim**. It is a claim that "I know better than the statistical aggregate of my group."
      This doesn't mean you *never* do it (rejecting 5). It means the burden of proof scales with $N$.
      *   If $N=1$ (You alone), act on your private evidence.
      *   If $N=20$, your private evidence must be roughly 20 times stronger (log-odds wise) to justify acting unilaterally.
      *   If $N=1,000,000$ (Publishing a controversial scientific claim), your evidence must be overwhelming.

  2.  **You must accept that "Inaction" is not a symmetric error.**
      The Mirror Argument fails because it treats False Negatives (missing a good opportunity) as symmetrically bad as False Positives (triggering a bad intervention) *in the context of the selection effect*.
      While the *costs* might be symmetric, the *probability structure* is not.
      *   False Positive risk scales with $N$ (more people = more chances for an outlier to trigger).
      *   False Negative risk does *not* scale with $N$ in the same way. If the truth is $C$, and $N$ people look, the chance that *everyone* misses it drops exponentially.
      *   Therefore, the system is naturally biased toward **detecting truth** (someone will see it) as $N$ grows. It is not naturally biased toward **avoiding error**.
      *   The "Curse" correction is needed to stop the False Positive rate from exploding. No correction is needed for the False Negative rate because the "many eyes" effect already solves that.

  ### Final Ruling

  **Step (2) of the Mirror Argument is the cheat.** It assumes that "Inaction" selects for "Extreme Restraint." In reality, "Inaction" selects for "Lack of Extreme Eagerness."
  The distribution of "Lack of Extreme Eagerness" is not the mirror image of "Extreme Eagerness." It is the bulk of the curve.

  **The Prescription:**
  Endorse the Unilateralist's Curse (raise the bar), but reject the limit case (5).
  *   **Why not (5)?** Because as the bar rises, the *quality* of the actions that do get triggered increases. You don't get "Never Act." You get "Rarely Act, but with High Confidence."
  *   **The Pooled Norm:** Act as if you are the secretary of the committee, reading all 20 reports, not just your own. If your report says "Go" but you know 19 others said nothing, the pooled report says "Wait." You only "Go" if your report says "GO LOUDLY."

  **Referee's Note:** Your friend is right about the Curse. You are right to reject the "Never Act" conclusion. The Mirror Argument is a seductive fallacy that confuses the *absence of a trigger* with the *presence of a consensus*. In a unilateralist setup, there is no consensus, only a lack of vetoes. Treat the lack of vetoes as negative evidence, raise your threshold, and save the unilateral moves for when your signal is so strong it would convince the whole room anyway.
