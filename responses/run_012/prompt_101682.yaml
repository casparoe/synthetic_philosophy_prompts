          *   *Limit:* The paradox treats knowledge as factive. Since they were wrong, strictly speaking, the paradox doesn't apply to them *truthfully*, but it explains their *psychology* of justification.
      *   **Marshall as Knower:**
          *   Identify $q$: "*H. pylori* is the cause."
