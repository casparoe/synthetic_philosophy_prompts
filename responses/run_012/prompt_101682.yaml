          *   *Symmetry:* Both sides claim the entitlement. The paradox cannot distinguish between the dogmatic crank and the visionary genius *from the inside*. It relies on the external fact of knowledge.
      *   **What the Paradox Captures:**
          *   Closure: The feeling that established theory screens off anomalies.
          *   Retrospective identification: We now see the reviewers' evidence (prior theory) as the misleading stuff, or Marshall's early data as the true stuff.
          *   Asymmetry: The winner gets to claim they "knew" all along; the loser is labelled dogmatic.
      *   **What the Paradox Misdescribes/Limits:**
          *   Static vs. Dynamic: Science isn't static. Evidence isn't clean units.
