  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say the establishment *knew*. They didn't. The prompt asks: "If the received view really was known..." I must explore the conditional.
      *   *Nuance:* The prompt asks about the symmetry. "From the inside he could not distinguish knowing from merely believing." This is crucial. The paradox is third-person/factive, but agents act first-person/non-factive.
