answer: |-
  You are correct that a default settles the conflict, but you overlook that *some* default must exist, and the status quo of non-enrollment already settles it in favor of your present self through the friction of paperwork. The question is not whether to influence the outcome, but whether the influence tracks your own reflective judgments. When you sign a contract stating you wish to save, yet fail to return the form, that is not a revealed preference for consumption; it is a cognitive error in the means of securing your own end. Our default works through inertia, not endorsement; it does not claim saving is morally superior, only that it is the path you indicated you wished to take.

  By making the architecture transparent and easy to opt out, we respect your autonomy to override the default if your present self truly outweighs the future one, but we stop the system itself from silently voting against your future by requiring active effort to secure what you already say you want. We are not engineering a new preference for security; we are removing the structural bias that disproportionately burdens your reflective planning against your visceral impulsivity. If you actively choose to opt out, the system respects that, proving the design is means-paternalistic—facilitating your ends—rather than ends-paternalistic, which would forbid the opt-out entirely.
