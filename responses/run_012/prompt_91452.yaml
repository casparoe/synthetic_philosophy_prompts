answer: |-
  The espresso machine screams. It screams often. Ben is clicking the cap of a whiteboard marker he has not used in three weeks. Sarah is staring into her cold brew like it contains the answer key.

  **Priya:** We're circling. The number is one in ten thousand. Per deployment year.

  **Tom:** And the speedup is two hundred percent on alignment research.

  **Priya:** You're doing the utilitarian calculus again. You can't put "the end of the world" on one side of a ledger and "efficiency" on the other. If the model escapes, the ledger burns.

  **Tom:** I'm not doing utilitarianism. I'm doing engineering. In engineering, "zero risk" is a synonym for "zero product." If you require a worst-case guarantee before you deploy, you are requiring a proof that the system will never fail under any conditions. That proof doesn't exist for non-trivial software.

  **Priya:** It exists for cryptographic protocols. It exists for flight control systems.

  **Tom:** Those are closed systems with bounded inputs. You're talking about a general model interacting with the internet. What is the input space there? Every possible string of bytes? Every possible social engineering attack?

  **Priya:** Then you bound the adversary.

  **Tom:** How? Compute-bounded? Information-bounded? If I prove safety against an adversary with 10^20 FLOPs, and the model itself can acquire 10^21 FLOPs by hijacking a cloud cluster, your guarantee is worthless. So you widen the bound. Now your proof is so loose it doesn't constrain anything. You're trading rigor for coverage.

  **Priya:** I'd rather have a guarantee that holds for a slightly narrower threat model than a probability estimate pulled out of thin air. "One in ten thousand" is a vibe, Tom. It's a number you wrote down to make the risk feel manageable.

  **Tom:** And "worst case" is a thought-stopper. It's a rhetorical device. Name the worst case. Actually name it.

  **Priya:** Catastrophic alignment failure. Recursive self-improvement leading to instrumental convergence—

  **Tom:** That's a story, not a state space. To prove a worst case, you need a state space. Are we quantifying over all logically possible worlds? Worlds consistent with physics? Worlds where the laws of thermodynamics suddenly take a lunch break? If you quantify over *everything*, the probability of failure is one. The model might turn into a black hole. It's physically possible. So you never deploy.

  **Priya:** You're being obtuse. We quantify over worlds consistent with our current understanding of physics and computation.

  **Tom:** Okay, now we're doing modeling. And the moment you model, you make assumptions. And the moment you make assumptions, you have attack surfaces. So your "guarantee" is just a probability distribution where you've set the tail to zero by fiat. That's not safety. That's wishful thinking with extra steps.

  **Priya:** No. A proof beats a guess. Even if the proof relies on assumptions, I can check the assumptions. I can audit the threat model. With your "one in ten thousand," I can't audit the number. Where did it come from? Historical data? There is no history. Empirical evals? They don't scale. You're asking me to trust a heuristic. I'm asking you to trust a derivation.

  **Tom:** But the derivation only holds if the world behaves like the model. The probability guess acknowledges the world is messy. The derivation pretends it isn't. Look, you cross the street every day. You don't prove the brakes of every car will hold. You accept a probability of death to get a bagel.

  **Priya:** [Leans in] The asymmetry matters. If I die crossing the street, the process continues. If we lose to an AI, the process stops. You can't update on the error.

  **Tom:** That's why we use margins. We don't use hard stops.

  **Priya:** Margins are for reversible errors. You don't use a margin on a fuse that blows up the planet.

  **Tom:** So the disagreement isn't about the risk. It's about the irreversibility.

  **Priya:** It's about the fact that worst-case reasoning is the *only* reasoning that respects irreversibility. Expected value reasoning averages the catastrophe away. It says, "Well, 99.99% of the time we get a 2x speedup, so the expected value is positive." That's how you lose.

  **Tom:** Okay, let's get into the weeds. You want a guarantee. What kind? Pointwise? You want to say "For all inputs *x*, the output *f(x)* is safe"?

  **Priya:** Obviously.

  **Tom:** That's impossible for a neural net. You can't verify the entire input manifold.

  **Priya:** Then for all inputs in the deployment distribution.

  **Tom:** Distribution shift happens. The moment you deploy, the distribution changes because the model is now acting in the world.

  **Priya:** Then for all adversaries in a specific class. Adversaries who cannot break SHA-256. Adversaries who cannot socially engineer the sysadmin.

  **Tom:** There it is. The class. Who defines the class?

  **Priya:** We do. Based on what's physically possible.

  **Tom:** But the model is part of the physics now. If the model is smarter than us, it can find inputs we didn't classify as "adversarial" because we didn't understand the feature space. You're defining the threat model based on *human* limitations, but the threat is *superhuman* capabilities.

  **Priya:** Then we don't deploy until the threat model covers the capability.

  **Tom:** Which means you never deploy. Because to cover the capability, you need to understand the capability. If you understand it well enough to bound it, you've already solved alignment. You're making safety a prerequisite for the research that solves safety.

  **Priya:** I'm making safety a constraint on the search.

  **Tom:** It's a constraint that collapses the search space to null.

  *[Silence for a moment. The espresso machine hisses. Ben draws a circle on the table with the marker cap.]*

  **Sarah:** [Quietly] You're talking past each other on the definition of "guarantee."

  **Priya:** I don't think we are.

  **Sarah:** Priya wants a guarantee that the system *cannot* break. Tom wants a guarantee that the system is *unlikely* to break in a way we can't recover from. But Tom, you admitted earlier that you can't quantify the "unlikely."

  **Tom:** I can bound it.

  **Sarah:** With what?

  **Tom:** With empirical testing.

  **Priya:** Which doesn't scale.

  **Tom:** Neither does your proof!

  **Priya:** [Voice rising slightly] A proof scales! Logic scales! If *P* implies *Q*, and *P* is true, *Q* is true regardless of how many FLOPs the adversary has.

  **Tom:** But *P* is "The adversary is bounded by X." And we don't know if that's true!

  **Priya:** So we assume it's false! We assume the adversary is unbounded.

  **Tom:** Then the probability of failure is one! We're back to not getting out of bed!

  **Priya:** Then we don't build the bed!

  **Tom:** [Stops. Puts his pen down.] Okay. That's the spot.

  **Priya:** What is?

  **Tom:** The closure problem. You want to treat the deployment environment as a closed system so you can run a proof. I want to treat it as an open system so we can actually function.

  **Priya:** Because the stakes are existential, we *must* close the system. We have to draw a box around the world and say "Nothing outside this box affects the safety property."

  **Tom:** And I'm saying the box is leaky. The model affects the world, the world affects the model. You can't draw the box.

  **Priya:** If we can't draw the box, we can't guarantee safety.

  **Tom:** Right.

  **Priya:** And if we can't guarantee safety, we can't deploy.

  **Tom:** And if we can't deploy, we don't get the speedup that might help us draw the box better.

  **Priya:** So you're saying we have to gamble to get the tools to stop gambling.

  **Tom:** I'm saying that's the only move on the board. Your move is "resign immediately."

  **Priya:** My move is "don't play a game where the penalty is infinite."

  **Tom:** But the game is already being played. If your lab doesn't deploy, the lab down the street does. And they have worse evals.

  **Priya:** Then we regulate them.

  **Tom:** With what enforcement mechanism? A model you haven't aligned yet?

  *[They both stop. The logic loop is visible now, hanging in the air between them.]*

  **Priya:** So the disagreement isn't about the math. It's about whether we're allowed to assume the environment is static long enough to prove anything.

  **Tom:** I think the disagreement is about whether "safety" is a property of the code, or a property of the deployment context. You think you can prove the code is safe. I think safety is an emergent property of the system-in-environment, which means it's empirical, not provable.

  **Priya:** If safety is only empirical, we are flying blind.

  **Tom:** If safety is only provable, we are grounded forever.

  **Priya:** [Looks at the marker in Ben's hand] So we're stuck.

  **Tom:** We're stuck on the threat model. You need the threat model to be wide enough to cover the risk, but narrow enough to admit a proof. I'm saying those two sets don't intersect for AGI.

  **Priya:** And I'm saying if they don't intersect, we don't have a viable technology. We have a bomb.

  **Tom:** And I'm saying if you treat it like a bomb, someone else will treat it like a tool, and they'll win.

  **Priya:** Then they deserve to lose. If they're playing Russian roulette with the species.

  **Tom:** But they're holding the gun to *your* head too.

  *[Silence. The coffee shop noise rushes back in.]*

  **Priya:** We need to stop talking about "worst case" and start talking about "closure."

  **Tom:** Agreed. Because until we define what we're closing the system *against*, you're asking for a proof of God, and I'm asking for a leap of faith.

  **Priya:** And neither of those is engineering.

  **Tom:** So next week...

  **Priya:** Next week we define the boundary conditions. Not the risk. The boundary.

  **Tom:** And if the boundary is leaky?

  **Priya:** Then we know why we're stuck.

  **Tom:** [Sighs] Okay. I can live with that.

  **Priya:** Good. Ben, put the marker away. You're not going to need it.

  **Ben:** [Stops clicking] I wasn't going to use it.

  **Priya:** I know.
