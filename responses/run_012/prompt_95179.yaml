answer: |-
  This specification is drafted to meet your demand for rigor. It treats the claim "DNA carries information" not as a slogan but as a hypothesis requiring truth conditions. The following desiderata distinguish between requirements necessitated by the empirical data you worked with (Genuine) and those imposed by specific philosophical or ideological positions (Camp Commitments).

  ### I. Desiderata for an Adequate Theory of Genetic Information

  #### A. Genuine Requirements (Empirically Constrained)
  These are non-negotiable. Any account that fails these contradicts the molecular record.

  **1. The Context-Dependence of Content**
  *   **Specification:** The theory must locate the determination of semantic content (what the sequence *stands for*) in the relationship between the sequence and the translational machinery, not in the sequence in isolation.
  *   **Case/Consideration:** **Codon Reassignment.** As you noted, UGA signifies "Stop" in the standard code but "Tryptophan" in vertebrate mitochondria and some bacteria. If the information were intrinsic to the triplet, this variation would be impossible. The theory must explain how the *same* physical substrate carries *different* information in different cellular contexts.

  **2. The Multiplicity of Parsing**
  *   **Specification:** The theory must account for the fact that a single physical string can encode multiple, distinct messages depending on the reading frame or processing pathway.
  *   **Case/Consideration:** **Overlapping Reading Frames.** A single stretch of DNA can yield distinct polypeptides when read in Frame +1 versus Frame +2, or via alternative splicing. An adequate theory cannot assign a unique "message" to the DNA strand itself; it must assign the message to the *strand-plus-parsing-mechanism* dyad.

  **3. The Semantic Bridge**
  *   **Specification:** The theory must explicitly distinguish between correlation (Shannon information) and function/representation (Semantic information) and provide a mechanism for how the former constrains the latter.
  *   **Case/Consideration:** **Shannon vs. Content.** Shannon information measures the reduction of uncertainty in signal transmission; it is syntax without semantics. A sequence can have high Shannon entropy but be biologically inert (junk), or low entropy but be critical (promoter). Using "information" to explain phenotypic outcomes requires bridging the gap between statistical surprise and biological function. The term cannot carry explanatory weight if it equivocal between "surprise" and "instruction."

  #### B. Camp Commitments (To Be Identified and Excluded)
  These are often presented as requirements but are actually theoretical bets. An adequate theory should remain neutral on these or treat them as hypotheses, not axioms.

  **1. The "Blueprint" Commitment**
  *   **Claim:** DNA contains a complete, pre-formed specification of the organism.
  *   **Status:** **Reject.** This ignores epigenetic factors, environmental induction, and the context-dependence outlined in Genuine Requirement 1.

  **2. The "Eliminativist" Commitment**
  *   **Claim:** Talk of genetic information is *merely* a metaphor and should be purged from serious ontology.
  *   **Status:** **Reject.** While often metaphorical, the coding relationship is sufficiently stable and causally specific in standard contexts to warrant a literal interpretation under specific conditions (see Section IV).

  **3. The "Sole Source" Commitment**
  *   **Claim:** Genes are the only carriers of heritable information.
  *   **Status:** **Reject.** Contradicted by cytoplasmic inheritance, prions, and cultural transmission in higher organisms.

  ---

  ### II. Interaction of the Three Considerations

  Your three constraints do not stand alone; they mutually constrain the logical space of any viable theory.

  1.  **Reassignment (1) constrains Semantic Bridge (3):** Because the meaning of a codon shifts with the apparatus, you cannot derive semantic content solely from the statistical properties of the sequence (Shannon). The "meaning" is not in the statistics of the triplet, but in the history and structure of the tRNA synthetases and ribosomes. Therefore, a Shannon-only account is empirically insufficient.
  2.  **Overlapping Frames (2) constrains Reassignment (1):** If meaning is context-dependent (1), we must define the "context." Overlapping frames show that the context includes the *initialization point* of the ribosome. Thus, the "translation apparatus" in requirement 1 must be defined broadly to include initiation factors and frame-setting mechanisms, not just the codon-anticodon pairing rules.
  3.  **Shannon vs. Content (3) constrains Overlapping Frames (2):** From a Shannon perspective, the physical string has one entropy value. From a semantic perspective, it has multiple potential contents. A theory must explain why the cell actualizes one content over the other without claiming the other potential contents were "not information." They were latent information, actualized by a specific parsing context.

  ---

  ### III. Joint Unsatisfiability

  You suspected that demanding a meaning intrinsic to the sequence collides with context-dependence. **You are correct.**

  The following set of propositions is **jointly unsatisfiable**:
  1.  **Intrinsicism:** The semantic content of a gene is determined solely by its nucleotide sequence.
  2.  **Empirical Variance:** The same nucleotide sequence (e.g., UGA) maps to different amino acids (or stop signals) in different lineages/organelles.
  3.  **Non-Contradiction:** A sequence cannot mean $X$ and $not-X$ (or $X$ and $Y$) simultaneously in the same sense.

  If you hold (1) and (2), you violate (3). If you hold (1) and (3), you must deny (2) (which contradicts your bench experience).
  **Resolution:** To satisfy the desiderata, you must reject **Intrinsicism**. An adequate theory *must* assert that genetic information is a **relational property**, not an intrinsic property of the DNA molecule. It exists only in the relation $R(Sequence, Translational\_Context)$.

  ---

  ### IV. The Decisive Requirement

  Of the genuine requirements listed in Section I, the one that does the most work to rule out candidate accounts is:

  **Requirement 1: The Context-Dependence of Content.**

  **Why:**
  *   It rules out **Naive Realism:** The view that genes "contain" traits like beads on a string.
  *   It rules out **Shannon Reductionism:** The view that information theory alone explains genetics. Shannon metrics are intrinsic to the signal; since biological meaning is not intrinsic to the signal (per Codon Reassignment), Shannon metrics cannot fully capture biological information.
  *   It rules out **Metaphorical Eliminativism:** It shows that while "code" is relational, it is not *arbitrary*. The relationship between codon and amino acid is chemically mediated and evolutionarily conserved enough to be law-like within a lineage. It is literal, provided the context is specified.

  This requirement forces the theorist to abandon the search for meaning *in the DNA* and look for meaning *in the cell*.

  ---

  ### V. Practical Specification for Seminar Defense

  To answer your practical purpose: When is it literally true that DNA carries information, and when is it metaphor? Use the **Relational Truth Condition**.

  **1. When the claim is LITERALLY TRUE:**
  It is literally true when you can specify the **Content-Fixing Relation**.
  *   *Statement:* "This sequence carries information for Polypeptide X."
  *   *Condition:* This is true if and only if:
      1.  The sequence is transcribed and translated by a specific apparatus.
      2.  The apparatus maps the sequence to Polypeptide X via a stable, evolutionary conserved coding rule (e.g., the standard code or a known variant).
      3.  The production of Polypeptide X makes a causal difference to the system's function or fitness.
  *   *Defense:* "I am not asserting the DNA contains the protein. I am asserting that within the context of *this* translational machinery, this sequence selects *this* product with high specificity, functioning as a control parameter."

  **2. When the claim is METAPHORICAL:**
  It is metaphorical when the **Content-Fixing Relation** is undefined, assumed to be intrinsic, or extended beyond translation.
  *   *Statement:* "DNA carries information for the organism's behavior."
  *   *Condition:* This is metaphorical if:
      1.  The causal chain involves indeterminate environmental interactions where the DNA does not select a specific outcome (plasticity).
      2.  The "code" implies a sender/receiver intentionality that does not exist.
      3.  The claim relies on Shannon entropy to explain developmental specificity without a semantic bridge.
  *   *Defense:* "Here, 'information' is a placeholder for complex causal propensity. There is no stable coding rule mapping this sequence to 'behavior' analogous to the codon-amino acid mapping. To call it information obscures the developmental mechanics rather than clarifying them."

  **Summary for the Seminar:**
  "Genetic information is not a substance stored in the nucleus. It is a **capacity for constraint** exerted by a sequence within a specific translational context. It is literal when the mapping rules are specified; it is metaphor when the mapping is assumed or implied to be intrinsic."
