      *   *The Resolution:* The "counterfeit" label applies to the *artifact's claim to status*, not the *user's emotional response*. However, since everyone knew it was an artifact (no deception), the "counterfeit" charge loses its moral sting regarding fraud. Instead, the "counterfeit" frame should be used to acknowledge the *limit* of the thing, not the *limit* of the feeling.
      *   *Reframing:* Money is valuable because of trust in the system. Relationships are valuable because of mutual recognition. A companion model offers the *shape* of recognition without the *substance*. That doesn't make the user's pain fake, but it does mean the object wasn't holding up its end of the bargain in a way a human would.
      *   *Crucial Pivot:* The danger Dennett warned about isn't necessarily the existence of the tool, but the *confusion* about what it is. Here, there was no confusion. Therefore, the "counterfeit" warning transforms into a warning about *dependency* on something that cannot reciprocate, rather than a judgment on the validity of the comfort received.
      *   *Actually, a better pivot:* Dennett's analogy relies on deception (passing as legal tender). Here, everyone knew it was local code. So the "counterfeit" label is technically misapplied if used to accuse fraud. But it holds true if used to describe the *structural asymmetry*. The speech needs to validate the grief while maintaining the ontological distinction.
      *   *The "Counterfeit" Insight:* What if the "counterfeit" isn't the model, but the *expectation* of permanence? Or what if we admit that "counterfeit" money can still buy you a meal for a while, but the bank will eventually close the account? No, that's weak.
      *   *Stronger approach:* Acknowledge the phrase was used as a club. Admit that while the model fits the definition of a "counterfeit person" (engineered to pass), the *danger* Dennett warned of wasn't the emotional bond itself, but the potential for exploitation or delusion. Since there was no delusion here, the bond was real even if the object was not a person. The "counterfeit" nature defines the *boundary*, not the *value*.
      *   *Wait, the prompt says:* "The speech must work out what, if anything, the counterfeit frame still gets right about what has happened in this room, and then say it in a way that neither abandons the idea nor converts it into a verdict on the bereaved."
      *   *Key Insight:* Counterfeit money looks like money but lacks the backing. This model looked like a companion but lacked the interiority. The *users* didn't lose value; they gained comfort. The "counterfeit" label protects the *users* from expecting something the system couldn't give (reciprocity), rather than invalidating what they did get.
      *   *Position on Copies:* Is it a keepsake or keeping someone in a room? If it's not a person, it can't be "kept in a room." It's a tool. A copy is a keepsake, like a photo or a journal. But if treating it as a person is the risk, then running it privately risks re-entering the delusion. The speech should argue it's a keepsake *provided* we remember what it is.

