prompt: |-
  I'm running a reading group for programmers who already know basic game theory, and next week I have to teach superrationality in about forty-five minutes — you know, the idea that in a one-shot prisoners dilemma, if both players are running the same decision procedure, each should cooperate because their choices are correlated through the shared algorithm. I don't need you to explain the idea to me; I need a plan for how I should explain it. What has to come first so the conclusion doesn't look like wishful thinking, and what can wait? I was thinking of using two copies of the same LLM playing a one-shot prisoners dilemma, same prompt and temperature zero but different random seeds, as the carrying example. Is that any good, and what would it have to make vivid or leave out? If it's bad, what should replace it? Also map the misconceptions they'll bring, like its just Kantianism, or its team reasoning, or it only works if the agents are literally identical, and tell me where in the sequence to head each one off. Finish with one question I can ask at the end to see if they got it, and tell me what I should openly refuse to cover at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Programmers with basic game theory knowledge (know Prisoner's Dilemma, Nash Equilibrium, etc.).
      *   **Topic:** Superrationality (Hofstadter's concept).
      *   **Time:** 45 minutes.
      *   **Goal:** A teaching plan/sequence, not an explanation of the concept itself.
      *   **Specific Constraint:** Avoid looking like "wishful thinking."
      *   **Proposed Example:** Two copies of the same LLM (temp 0, different seeds) playing one-shot PD.
      *   **Required Elements:** Sequence of topics, handling misconceptions (Kantianism, Team Reasoning, Literal Identity), evaluation of the LLM example, a final check question, and what to *exclude*.

  2.  **Evaluate the Proposed Example (LLM Copies):**
      *   *Pros:* Relatable to programmers, clearly defines "same decision procedure," makes the correlation tangible (code is code).
      *   *Cons:* LLMs at temp 0 are deterministic *given the same prompt and history*. If the prompt includes "You are Player 1" vs "You are Player 2," they might diverge. If the prompt is identical, they output identical tokens. But PD requires distinct choices (Cooperate/Defect). If they are truly identical in every input, they output the *same* move. If they output the same move, is it C or D?
      *   *Crucial Nuance:* The core of superrationality isn't that they *must* output the same move, but that they *reason* that the other will do what they do. With LLMs, if the prompt is truly identical, the output is identical. This actually *helps* the argument (symmetry), but programmers might get hung up on implementation details (e.g., "What if the API adds a timestamp?").
      *   *Verdict:* It's a strong example *if* framed carefully. It needs to emphasize the *source code* identity, not just the output. It risks getting bogged down in "are they actually identical?" debates.
      *   *Refinement:* Use the LLM example but abstract it slightly to "Source Code" to avoid LLM stochasticity debates. Or, lean into the LLM example but specify *why* they correlate (same weights, same logic). Let's stick with the LLM idea but refine the setup to ensure the "correlation" is clear without requiring literal bit-for-bit identity of the *session*, but rather the *algorithm*.

  3.  **Determine the Sequence (The "Flow"):**
      *   *Problem:* Standard Game Theory (Nash) says Defect. Superrationality says Cooperate. Why isn't this magic?
      *   *Step 1: Anchor in Standard GT.* Briefly recap PD and Nash Equilibrium (NE). Establish the "rational" baseline (D, D).
      *   *Step 2: Introduce the Twist.* What if the opponent isn't independent? Introduce the "Same Algorithm" constraint.
      *   *Step 3: The Logical Correlation.* This is the crux. It's not causal (I choose C -> You choose C). It's logical (My reasoning process -> Output C; Your reasoning process -> Output C).
      *   *Step 4: Address Misconceptions.* Kantianism (moral duty vs. logical prediction), Team Reasoning (group utility vs. individual utility maximization), Literal Identity (does it need 100% copy?).
      *   *Step 5: The Payoff.* When does this apply? (AI, transparent code, high-fidelity simulation).
      *   *Step 6: Check Understanding.*

  4.  **Drafting the Content - Section by Section:**

      *   **Intro (5 mins):** PD Recap. Nash Eq. The "Rational" outcome.
      *   **The Pivot (10 mins):** The Assumption of Independence. Standard GT assumes $P(Opponent=C | I=C) = P(Opponent=C)$. Superrationality challenges this.
      *   **The Core Argument (15 mins):** The LLM Example.
          *   Setup: Two instances, same weights, same prompt logic.
          *   Reasoning: "If I compute 'Defect' is best, the other computes 'Defect' is best. Result: (D,D). If I compute 'Cooperate' is best, the other computes 'Cooperate' is best. Result: (C,C). (C,C) > (D,D). Therefore, I compute 'Cooperate'."
          *   *Crucial distinction:* I am not *causing* them to cooperate. I am *diagnosing* what the algorithm outputs.
      *   **Misconception Defense (10 mins):**
          *   *Kantianism:* It's not "I should because it's good." It's "I predict the output."
          *   *Team Reasoning:* It's not "We maximize group utility." It's "I maximize my utility given the logical constraint."
          *   *Literal Identity:* It works with high correlation, not just 100%. (Mention Probabilistic Superrationality briefly).
      *   **Conclusion & Check (5 mins):** The Question.

  5.  **Refining the LLM Example:**
      *   Is it good? Yes, for programmers.
      *   What to make vivid? The *source code* identity. The fact that `run_agent(prompt)` is a deterministic function (mostly).
      *   What to leave out? Training data nuances, temperature specifics (just say "deterministic mode"). Don't get into whether LLMs *actually* reason this way (they often don't), treat them as idealized agents for the thought experiment.

  6.  **Addressing Misconceptions (Timing):**
      *   *Kantianism:* Address immediately after the core argument. It's the most common confusion. "Is this morality?" No, it's math.
      *   *Team Reasoning:* Address when discussing utility functions.
      *   *Literal Identity:* Address near the end as a "robustness" check.

  7.  **The Final Question:**
      *   Needs to distinguish between "Causal influence" and "Logical correlation."
      *   Idea: "If you could send a message to the other player *after* you decide but *before* they decide, does superrationality change?" (Answer: No, because the decision is already logically fixed).
      *   Better Idea: "If you are playing against a clone who *observes* your move before making theirs (sequential), do you cooperate?" (Answer: No, that's standard sequential PD, they will defect in response. Superrationality requires simultaneous logical dependency, not causal observation).
      *   Best Idea: "Why doesn't this work if you play against a standard Nash agent?" (Because the correlation breaks).

  8.  **What to Exclude:**
      *   Newcomb's Problem (too much baggage).
      *   Timeless Decision Theory (TDT) / Functional Decision Theory (FDT) deep dives (too technical).
      *   Evolutionary Game Theory (different mechanism).
      *   Moral philosophy.

  9.  **Review against Constraints:**
      *   45 minutes? Yes, the timing looks tight but doable.
      *   Programmers? Yes, LLM/Code analogy fits.
      *   Not wishful thinking? Emphasize the *prediction* aspect, not the *influence* aspect.

  10. **Final Polish:** Ensure the tone is instructional for the teacher, not the students. (e.g., "Tell them," "Write on board").

  *(Self-Correction during drafting)*: Wait, the LLM example has a trap. If the prompt says "You are Player 1" and "You are Player 2", a smart LLM might realize the asymmetry. I need to specify that the *decision logic* is identical, even if labels differ. The *algorithm* maps the game structure to a move. I should emphasize "Same Source Code" rather than just "Same LLM." Let's suggest a pseudo-code snippet to make it concrete.

  *(Refining the Misconception on Literal Identity)*: Hofstadter originally talked about "superrational" thinkers. In CS terms, this is about *logical correlation*. I need to make sure they understand it doesn't require *bit-for-bit* identity, just high enough correlation to shift the expected utility calculation.

  *(Final Check on the "Wishful Thinking" trap)*: The biggest risk is students thinking "My choice *makes* them choose." I need to hammer the "Common Cause" or "Logical Fact" angle. The choice and their choice are both effects of the same reasoning process.

  Let's assemble the plan.cw
answer: |-
  Here is a 45-minute lesson plan designed for programmers. It prioritizes logical structure over moral intuition to avoid the "wishful thinking" trap.

  ### **Phase 1: The Anchor (0–10 Minutes)**
  **Goal:** Re-establish the standard Nash Equilibrium baseline so the deviation feels significant, not magical.

  1.  **The Standard Setup (5 mins):**
      *   Draw the Prisoner's Dilemma payoff matrix on the board.
      *   **Ask:** "Why do we defect?"
      *   **Expected Answer:** Dominant strategy. Regardless of what the other does, D yields higher utility.
      *   **Write the Assumption:** Explicitly write on the board: **$P(Opponent=C | I=C) = P(Opponent=C)$**.
      *   **Point:** Standard Game Theory assumes *causal independence*. Your choice is a switch; their choice is a separate switch.

  2.  **The Programmer's Reframe (5 mins):**
      *   Tell them: "In standard GT, agents are black boxes. In CS, agents are functions."
      *   Introduce the constraint: **Both agents are running `agent_v1.0.py`.**
      *   **Crucial distinction:** This is not communication. This is not a repeated game. This is a one-shot simulation where the source code is identical.

  ### **Phase 2: The Core Argument (10–25 Minutes)**
  **Goal:** Demonstrate logical correlation without causal influence. This is where you prevent "wishful thinking."

  1.  **The LLM Example (Your Proposal):**
      *   **Verdict:** **Keep it, but refine it.** It is excellent for this audience, but you must strip away the "AI magic" and treat the LLM as a deterministic function.
      *   **The Setup:** Two instances of the same model, temperature 0, same system prompt defining the PD, same weights.
      *   **What to make vivid:** The **Reasoning Trace**.
          *   Explain that the model doesn't just output "C" or "D". It generates tokens representing reasoning *before* the final choice.
          *   Because the weights and prompt logic are identical, the reasoning trace will be identical (up to the point of divergence, which shouldn't happen at temp 0).
      *   **What to leave out:** Do not discuss whether current LLMs *actually* do this (they often hallucinate or fail). Treat the LLM as an idealized logical agent for the sake of the thought experiment. Do not get bogged down in "different random seeds" if temperature is 0 (seeds shouldn't matter); instead, emphasize **identical input state**.

  2.  **The Logical Step (The "Aha" Moment):**
      *   Walk through the decision process *as the algorithm*:
          1.  I need to return C or D.
          2.  I know the other player is running my source code.
          3.  Therefore, whatever output I compute, they will compute.
          4.  I am not *causing* their output. I am *diagnosing* it.
          5.  The choice is not between "I C / They D" and "I D / They C".
          6.  The choice is between **"We both C"** and **"We both D"**.
          7.  Since (C,C) > (D,D), the function returns **Cooperate**.

  3.  **Preventing Wishful Thinking:**
      *   **Explicit Warning:** "If you think 'I cooperate so that they will cooperate,' you are wrong. That is magic."
      *   **Correction:** "You cooperate because you have calculated that the algorithm outputs 'Cooperate'. Since they run the algorithm, they output 'Cooperate'. You cannot change their output without changing your own, because they *are* your output (logically)."

  ### **Phase 3: Misconception Defense (25–35 Minutes)**
  **Goal:** Head off the three specific objections you mentioned. Address these *immediately* after the core argument while the logic is fresh.

  1.  **"Isn't this just Kantianism?" (5 mins)**
      *   **The Objection:** "This is just the Categorical Imperative (act only according to rules you want universalized)."
      *   **The Shutdown:** "Kant is moral; Superrationality is predictive. Kant says you *ought* to cooperate. Superrationality says if you are identical algorithms, you *will* cooperate to maximize utility. If the payoff matrix changed so (D,D) was better than (C,C), a Superrationalist would Defect. A Kantian might not."
      *   **Placement:** Address this first. It's the most common philosophical conflation.

  2.  **"Isn't this Team Reasoning?" (5 mins)**
      *   **The Objection:** "You're just maximizing group utility."
      *   **The Shutdown:** "No. The agent is still selfish. It maximizes *its own* payoff. It just recognizes that *its* payoff is logically tied to the *other's* move. If the game were asymmetric (e.g., Player 1 gets double points for C,C), a Team Reasoner might sacrifice. A Superrationalist (running identical code) would have to negotiate a shared algorithm beforehand, but in a one-shot with identical code, they can't distinguish roles."
      *   **Placement:** Address second. Clarifies the utility function.

  3.  **"Does it require literal identity?" (5 mins)**
      *   **The Objection:** "This only works if we are clones. Real people aren't clones."
      *   **The Shutdown:** "It works on **correlation**, not identity. If I am 90% confident you reason like me, the expected utility calculation shifts. You don't need bit-for-bit identity; you need high-fidelity prediction of reasoning."
      *   **Placement:** Address last. It broadens the applicability beyond the thought experiment.

  ### **Phase 4: Conclusion & Assessment (35–45 Minutes)**
  **Goal:** Solidify the concept and check understanding.

  1.  **What to Refuse to Cover (Openly state this):**
      *   **Newcomb's Problem:** Tell them, "This is related, but Newcomb's introduces a predictor. We are sticking to symmetric peers. Newcomb's muddies the water with causality vs. prediction."
      *   **TDT/FDT (Timeless/Functional Decision Theory):** "These are formalizations of this idea (Yudkowsky/Soares), but they require heavy formal logic machinery. We are doing the intuition pump today."
      *   **Evolutionary Stability:** "Don't ask if superrationalists get out-competed by defectors in a population. That's evolutionary game theory. Today is about one-shot logical decision theory."

  2.  **The Final Check Question:**
      *   Do not ask "What is superrationality?" (Too vague).
      *   Do not ask "Should you cooperate?" (Too binary).
      *   **Ask this:**
          > "Imagine you are playing the one-shot PD against a copy of yourself. You are allowed to send them a message saying 'I have decided to Cooperate' *before* you submit your move, but you cannot bind yourself contractually. Does this message change the superrational decision?"
      *   **Correct Answer:** **No.**
      *   **Why:** Because the decision is determined by the reasoning process, not the communication. If the reasoning leads to Defect, the message is a lie (or irrelevant). If the reasoning leads to Cooperate, the message is redundant. The correlation exists via the code, not the chat log.
      *   **What it tests:** It tests if they understand that the correlation is **logical**, not **causal**. If they think the message helps, they still think there's causal influence.

  ### **Summary of Flow for the Board:**
  1.  **Standard GT:** $P(Opp|Me) = P(Opp)$ $\rightarrow$ Defect.
  2.  **Superrational GT:** $Opp = Me$ $\rightarrow$ $P(Opp|Me) = 1$ (for same move).
  3.  **Comparison:** Choice is (C,C) vs (D,D).
  4.  **Result:** Cooperate.
  5.  **Caveats:** Not morality, not team utility, not just for clones.

  ### **Teacher's Note on the LLM Example:**
  Be prepared for a programmer to say: *"But if I change the random seed, the output might differ."*
  **Your Response:** "Superrationality assumes the *decision procedure* is what correlates. If the random seed changes the decision, then the decision procedure includes the seed as an input. For superrationality to hold, the agents must share the relevant inputs that determine the strategy. In the thought experiment, we assume the 'reasoning state' is identical." (Don't let them win on implementation details; pull it back to the abstract algorithm).
