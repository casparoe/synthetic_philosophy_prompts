answer: |-
  Here is the hard truth: **Your list of verdicts is not Kantian.**

  You are trying to use Kant's *tool* (the Universal Law test) to generate *your* intuitions, but your intuitions diverge from Kant's actual philosophy on several key points. That is why the test feels like a mess. You are getting "messy" results because you are unconsciously switching between three different ethical frameworks: **Kantianism** (no lying), **Rule Utilitarianism** (don't break systems), and **Common Sense Morality** (save your friend, don't be a jerk).

  Here is the breakdown of the principle actually driving your list, what it predicts, where it breaks, and the specific clause you need to make it coherent.

  ### 1. The Principle Behind Your Verdicts
  The principle that actually fits 90% of your list is not the Categorical Imperative. It is a **Fairness + Harm Reduction Principle**:

  > **"An action is wrong if it exploits a cooperative system for personal gain (free-riding), OR if it violates a basic duty of mutual aid, UNLESS it is necessary to prevent immediate, severe harm to an innocent person."**

  This is a hybrid view. It captures your disgust at free-riding (loans, movies, cheating) and your demand for basic decency (helping, talents), but it allows for emergency exceptions (the murderer).

  ### 2. Predictions for the Movie and Cheating Cases
  Under this principle, your intuitions are correct, but the *reasoning* needs tightening.

  *   **The Movie Case:** Your principle predicts **Not OK**.
      *   *Why:* It isn't just "delayed self-defeat." It is **unjust enrichment**. You are consuming a resource (the seat, the screening) that is priced for paying customers. You are taking the benefit of the system without bearing the cost. If everyone did it, the system collapses (as you noted), but even if it didn't, you are treating the paying customers as mere means to subsidize your ticket.
  *   **The Cheating Case:** Your principle predicts **Not OK**.
      *   *Your doubt:* "If everyone cheated by the same amount, would the ranking even change?"
      *   *The Fix:* Yes, the ranking might stay the same, but the **signal** is destroyed. The purpose of a test is to certify competence to future employers or grad schools. If everyone cheats, the grade no longer signals competence. You are devaluing the currency of the degree for everyone else to gain a temporary advantage. That is systemic exploitation.

  ### 3. Which Verdicts This Principle Cannot Accommodate
  There is one major outlier in your list that contradicts your own "Fairness" principle.

  *   **The Library Books:** You said: *"Honestly fine?? even though a world where everyone does that has no libraries in it."*
      *   **The Conflict:** This is the exact same structure as the Movie case. If everyone keeps the books, the library system collapses. It is a classic "Tragedy of the Commons."
      *   **The Verdict:** To be consistent with your own rulings on the Loan, the Movie, and Cheating, **keeping the library books must be Not OK.** You cannot claim it is wrong to sneak into a movie because it hurts the theater, but fine to steal the library's inventory because... well, there is no consistent reason. This is the one verdict you have to give up to have a coherent principle.

  ### 4. The "Helping and Talents" Problem (The Kantian Correction)
  You wrote: *"Never helping anyone... Passes [the test], and yet its obviously wrong."*

  Here is where you are misapplying Kant. You are only running the **Contradiction in Conception** test (Can I logically imagine a world where this happens?).
  *   *Can I imagine a world where no one helps?* Yes. It's a cold, hard world, but it's logically possible. So it passes *that* test.

  But Kant has a second step: **Contradiction in Will** (Can I *rationally will* this to be a law?).
  *   *Kant's Argument:* You are a finite being. You will inevitably need help. You will inevitably need to rely on the talents of others. To will a law that "no one helps" is to will a world where you cannot survive or achieve your own goals. It is a contradiction in your own will to demand independence for yourself while legislating dependence for everyone else.
  *   **The Fix:** If you apply the full Kantian test, **Never Helping** and **No Talents** actually **FAIL**. You don't need a new principle to condemn these; you just need to finish the test you started.

  ### 5. The Maxim Description Problem
  You asked: *"There's a version of 'lie to the murderer' thats really a rule about saving lives and a version thats really a rule about lying, and they come out opposite... how you're supposed to pick the description?"*

  This is the "Problem of Relevant Descriptions." The solution is not to pick the one that gives the answer you want. The solution is that **a maxim must include the motive/end.**

  *   **Bad Maxim:** "I will lie." (Too broad. Kant says never do this.)
  *   **Bad Maxim:** "I will save my friend." (Too vague. Doesn't specify the action.)
  *   **Correct Maxim:** "I will make a false statement *in order to* protect an innocent life from unlawful aggression."

  When you universalize *that* specific maxim, you aren't testing "Is lying okay?" You are testing "Is lying to protect innocent life from aggression okay?"
  *   **Strict Kant:** Still says No. (Because truth is an absolute duty).
  *   **Your Intuition:** Says Yes.

  ### 6. The Clause You Asked For
  You want to know what clause saves the Murderer case without letting in the Job Application Lie. You cannot do this with pure Kant. You have to import a **Hierarchy of Duties**.

  **The Clause:**
  > **"When two duties conflict, the duty to preserve rational agency (life/safety) overrides the duty to maintain communicative integrity (truth-telling), provided the violation is minimal and necessary."**

  *   **What it saves:** **Lying to the Murderer.**
      *   *Reasoning:* The murderer is trying to destroy rational agency (kill your friend). Your lie preserves it. The duty to Life > The duty to Truth.
  *   **What it still condemns:** **Lying on a Job Application.**
      *   *Reasoning:* There is no conflict of duties here. You are not saving a life; you are gaining an advantage. The duty to Truth stands unchallenged.
  *   **What it still condemns:** **Lying to a Friend (about the ex).**
      *   *Reasoning:* Unless the ex is a murderer, "hurt feelings" usually do not outweigh the duty of honesty in a friendship. (Though this is a closer call, fitting your "unsure" verdict).

  ### Summary of the Fix
  1.  **Accept** that your "Helping/Talent" intuitions actually *do* pass a full Kantian test (Contradiction in Will), so stop worrying about those.
  2.  **Reject** your "Library Books" verdict. It contradicts your own logic on Movies and Loans.
  3.  **Adopt** the **Hierarchy of Duties Clause** above. This allows you to lie to the murderer (Life > Truth) without allowing you to lie on your resume (Advantage < Truth).

  If you make those three adjustments, your "mess" becomes a coherent **Modified Deontological** system.
