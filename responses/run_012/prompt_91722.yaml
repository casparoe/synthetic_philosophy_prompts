prompt: |-
  ok so we did Kant in my ethics class and i've been walking around for like two weeks now testing every dumb thing i do with the universal law thing (the one where you ask if you could will that everyone act on your maxim), and my verdicts are a mess, so i want to know what principle is actually behind them, if there is one.

  Going by gut, here's my list.

  Saying i'll pay someone back when i know i won't, to get the loan: not ok. If everyone did it nobody would ever lend, so the move stops working entirely.

  Sliding into a second movie at the theater without buying another ticket: also not ok, but a weirder kind of not ok, because if everyone did it the theater still shows me the movie that night, it just quietly goes out of business later. Its a delayed kind of self-defeating, not an immediate one.

  Keeping library books way past the due date, or never returning them: honestly fine?? even though a world where everyone does that has no libraries in it.

  Never helping anyone unless helping is fun for me: as far as i can tell this passes. I can picture everyone being like that, theres no contradiction anywhere, and yet its obviously wrong, and wrong in a totally different way than the lying cases. The lying ones get cancelled by the test, this one just gets... allowed, and i still think its wrong.

  Not developing any talents, just coasting through life: same as the last one. Passes, still seems wrong.

  Lying to the murderer at the door about where my friend is hiding: fine, obviously. Lying on a job application about a degree i dont have: not fine. Lying to my friend about whether her ex texted me: genuinely dont know, feels somewhere in the middle, maybe fine if it'll only hurt her.

  Cheating on a test when i can get away with it: not ok. But if literally everyone cheated by the same amount, would the ranking even change? and does that matter for the test or not?

  Heres my attempt at a principle: a maxim fails when what it tells me to do only works because most other people aren't doing it. That gets the false promise, and the movie, and probably the cheating. But it condemns the murderer lie, which only works because most people don't lie to murderers, and i'm not giving that verdict up. And it waves through the never-help case, which i'm also not giving up. So either the principle needs a patch or one of my verdicts has to go, and i want to know which one.

  Two more things. First, the test seems to flip answers depending on how narrowly i describe the maxim (theres a version of "lie to the murderer" thats really a rule about saving lives and a version thats really a rule about lying, and they come out opposite) and i have no idea how you're supposed to pick the description without just picking whichever one gives the answer you already wanted. Second, if the answer is "add a clause," say exactly what the clause is and what case it was added to save. Can you tell me what principle fits my list, what it predicts for the movie and cheating cases, and which of my verdicts it cant accommodate?
