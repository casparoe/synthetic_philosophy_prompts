      *   *The "Crew" Issue:* In the myth, the crew obeys orders. In politics, the "crew" (courts/officials) enforces the rules against the "captain" (current majority). But the crew wasn't appointed by the current captain.
      *   *Resolution:* This is the "Dead Hand Control" problem. Theories of "Popular Sovereignty" try to bridge this (we ratify the constitution by staying and participating), but it's shaky.

  4.  **Address Point 2: Eternity Clauses (Unamendability):**
      *   *Ulysses:* He *could* have told the crew to untie him if he screamed the right code, but he didn't. He retained ultimate sovereignty.
