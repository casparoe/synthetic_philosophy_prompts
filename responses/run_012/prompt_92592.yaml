      *   *Option B: Rights/Principles.* Some things are off-limits regardless of majority will (not because of precommitment, but because of moral truth/justice).
      *   *Option C: Democracy-enhancing.* Constitutions make democracy possible (free speech, voting rules), so constraining the majority actually *saves* democracy. (Ely's representation-reinforcement).
      *   *Option D: Acknowledge the Tension.* Constitutionalism *is* counter-majoritarian. That's the feature, not the bug. Legitimacy comes from the difficulty of amendment + the value of stability, not perfect consent.

