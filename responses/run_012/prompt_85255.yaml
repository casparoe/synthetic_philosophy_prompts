  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** Undergraduate Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Honor Code Proposal A

  **Recommendation**
  I recommend the Board adopt **Proposal A** (Remedial Seminar/No Transcript). While Proposal B offers compelling structural safeguards, Proposal A better aligns with the educational mission of the university by treating integrity as a cultivated habit rather than a compliance metric.

  **Reframing the Philosophical Context**
  The Chair has framed this choice as "Mengzi vs. Xunzi"—asking whether we trust students (Mengzi) or distrust them (Xunzi). This binary is philosophically inaccurate and practically limiting. As noted in recent departmental discourse, Mengzi is not a naive truster; his "Ox Mountain" analogy warns that innate moral sprouts *will* be stripped bare without active nourishment and protection. Conversely, Xunzi is not a proponent of simple deterrence; his focus on *Li* (Ritual) is about habituation and reshaping desire, whereas punishment-first is a Legalist (Shang Yang) approach.

  **The Case for Proposal A**
  Proposal A operationalizes the corrected Mengzian view. The remedial seminar is not "letting students off"; it is the "watering" of the moral sprouts. By keeping first offenses off the transcript, we acknowledge that integrity is a developmental process. A permanent record acts as the "axes and grazing" that Mengzi warns against, scarring the student and inhibiting future moral growth. This approach demands more from students than Proposal B: it requires them to internalize *why* cheating is wrong, rather than simply avoiding punishment.

  **The Best Case for Proposal B**
  Proponents of Proposal B rightly argue that ambiguity enables rationalization. The matriculation signing ceremony is a potent piece of Xunzian *Li*—a public ritual that marks the boundary of the academic community. Furthermore, student honor courts empower peers to enforce norms, which can build a stronger culture of accountability than administrative adjudication. If our goal is to create a distinct ethical community with clear boundaries, B provides the sharper tools.

  **Where Proposal B Risks Failure**
  However, Proposal B's "published sanction ladder" risks sliding from Xunzian Ritual into Legalist Deterrence. If students view the Honor Code as a set of penalties to be navigated rather than norms to be embodied, we have failed. We risk creating a system where students cheat so long as the expected value of the penalty remains low. Proposal A avoids this by making the "penalty" educational, forcing engagement with the value itself.

  **Limitations of the Analogy**
  We must acknowledge where the Mengzi/Xunzi analogy breaks down: these are philosophies of *self-cultivation*, not *bureaucratic policy*. An Honor Code is an institutional constraint, not a path to sagehood. We cannot rely solely on internal sprouts (A) nor purely on external ritual (B); we are building a system for thousands of strangers, not mentoring a single disciple.

  **Pilot Data & Conditions for Reversal**
  Half the Board wishes to wait for pilot data. I will withdraw this recommendation **if** the pilot departments show that Proposal B reduces recidivism rates by more than 15% *without* decreasing the rate of peer reporting. If the "sanction ladder" deters repeat offenses without creating a culture of silence, the Legalist risk is mitigated, and B becomes the viable choice.

  Until then, we should choose the policy that treats integrity as a skill to be learned, not a rule to be enforced.
