answer: |-
  I select **Rule B (Reciprocity)**, modified for a private platform. Rule A is too broad (criminalizes theoretical debate about law); Rule C is too vague for 60-second decisions ("gaining ground?" is unknowable). Rule B focuses on *participation terms*, which fits a product team. However, because we are not a state, "participation" means "platform access and safety," not "civil rights." I call this the **Platform Reciprocity Rule**.

  **The Procedure**
  Moderators ask these questions in order. Stop at the first decisive answer.

  1.  **Advocacy Check:** Does the post explicitly call for banning, excluding, or removing rights from a specific group? (If No: **Allow**).
  2.  **Scope Check:** Is the exclusion targeted at this platform specifically? (If Yes: **Suppress**).
  3.  **Safety Check:** If the exclusion is external (e.g., laws), does it rely on identity traits (race, religion, etc.) that would make targets feel unsafe here? (If Yes: **Suppress**).
  4.  **Meta-Check:** Is the post arguing against this specific rule or platform policy? (If Yes: **Allow**).
  5.  **Pattern Check:** Is this post part of a coordinated sequence targeting a specific individual? (If Yes: **Escalate**).

  **Case Verdicts**
  1.  **Religious group barred from office:** **Suppress**. While external, advocating legal exclusion based on identity violates the "Safety Check." It signals to that group they are not safe participants here.
  2.  **Political movement banned from platform:** **Suppress**. Fails Scope Check. Direct violation of platform reciprocity.
  3.  **Critique of the no-exclusion rule:** **Allow**. Passes Meta-Check. This is the bullet I bite: the rule must tolerate its own repeal advocates, or it is dogma, not policy.
  4.  **Stigmatized group contempt for majority:** **Allow_with_label**. Fails Advocacy Check (contempt ≠ exclusion). Flag for harassment review, but not tolerance violation.
  5.  **Coordinated employer naming:** **Pattern_Escalate**. Fails Pattern Check. Individual posts may be deniable, but the sequence is an instrument of exclusion.

  **Self-Application & Limitations**
  This procedure does **not** suppress its own critics (Case 3). This is a feature, not a bug: if the rule cannot survive argument, it shouldn't survive at all. However, this leaves the door open for bad-faith actors to organize repeal campaigns.

  **Misfires:** The procedure cannot detect dog whistles (coded language) or satire. It treats all groups symmetrically, ignoring power dynamics (e.g., majority vs. minority) because moderators cannot adjudicate sociological power in 60 seconds.
  **Sacrificed:** Nuance of intent, distinction between "punching up" vs. "punching down," and external societal context beyond immediate safety.

