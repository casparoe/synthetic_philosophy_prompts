      *   Pleasure: Prefer 1 Ecstasy over N Tiny.
      *   Why? Because the intuition is about the *quality* of the experience dominating the *quantity* at the extremes.
      *   So the prediction is: You prefer the Near End (Intensity).
      *   Does the principle say you *should*?
