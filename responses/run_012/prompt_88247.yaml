      *   The "Adding one person *always*" is the most vulnerable. It assumes linear aggregation.
      *   So I will recommend dropping the universal aggregation claim.

      *   **Structure:**
          1.  **Diagnosis:** Confirmed. The relation "Better Than" is intransitive here. This is Temkin's Paradox.
          2.  **Principle (Capturing All):** **The Principle of Spectrum Intransitivity.** (Define: Local trade-offs hold, Global qualitative thresholds hold, Transitivity fails).
          3.  **The Engineering Cost:** Explain Money Pump / Sort Failure. You cannot maximize this function.
          4.  **The Fix (Transitive Principle):** **The Principle of Lexical Thresholds.**
          5.  **The Sacrifice:** You must reject "Adding one person *always* makes it worse." It stops applying when pain becomes trivial.
          6.  **Pleasure Case:** Under the Fix, you prefer 1 Ecstasy. Under the Intransitive view, you *can* prefer 1 Ecstasy despite the chain.
          7.  **Recommendation:** Use the Fix.

