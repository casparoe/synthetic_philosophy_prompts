      *   *Cantillon Effect:* This is huge for Aristotle. Distributive justice. If new money benefits financiers first (unnatural acquisition) rather than citizens based on merit/need, it violates political justice.
      *   *Verdict:* Inflation targeting is a pragmatic tool of *oikonomia* (steering), but the Cantillon effect is a moral hazard. It turns money into a tool of *chrematistike* for the few. He wouldn't ban inflation targeting, but he'd demand mechanisms to mitigate the distributional skew (e.g., helicopter money vs. bank reserves).

  5.  **Drafting Section 3: Ranking the Instruments (*Oikonomia* vs. *Chrematistike*)**
      *   *Criteria:* Does it serve real need/household management (Natural) or money-breeding-money (Unnatural)? Does it share risk or transfer it unfairly?
