answer: |-
  | Step Number | Question to Ask | What Counts as a Sufficient Answer | Outcome (Stop / Continue / Escalate) | Why This Step Earns Its Place |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Reference Class:** Does the patient lack a physiological function typical for their age/sex group, or suffer a functional limitation in daily living? | **Yes:** Documented pathology (lab values, imaging) OR inability to perform basic daily tasks (eating, walking, working) relative to peers.<br>**No:** Patient falls within statistical normal range and performs daily tasks without aid. | **Continue.** (Flag "Treatment" if Yes, "Enhancement" if No). | Establishes the biostatistical baseline. Without a deviation from species-typical design or functional impairment, there is no "health" deficit to restore. |
  | **2** | **Positional Benefit:** Is the primary benefit of the intervention gaining rank over others (zero-sum) rather than restoring absolute function? | **Yes:** Benefit disappears if everyone else also gets it (e.g., height for basketball, cosmetic symmetry).<br>**No:** Benefit holds value regardless of others' status (e.g., seeing, breathing, pain relief). | **Stop** if Step 1=No AND Step 2=Yes (Verdict: **Enhancement**).<br>**Stop** if Step 1=Yes AND Step 2=No (Verdict: **Treatment**).<br>**Continue** if answers mismatch. | Applies the Hirsch point. Insurance covers restoring function, not funding arms races. If the request is purely positional without pathology, it is not medically necessary. |
  | **3** | **Reversibility & Identity:** Is the intervention irreversible, or does it fundamentally alter the patient's self-narrative or community form of life? | **Yes:** Permanent physical change, genetic alteration, or intervention rejected by the patient's cultural/identity group (e.g., Deaf community).<br>**No:** Reversible pharmacological effect or procedural adjustment with no identity impact. | **Escalate** if Yes.<br>**Continue** if No. | Flags deep ethical stakes. Reviewers cannot adjudicate identity harm or permanent bodily integrity without medical director oversight. |
  | **4** | **Distributive Effects:** Does approving this claim pull resources from claimants with stronger claims on Steps 1-2? | **Yes:** High cost per QALY compared to standard care, or creates scarcity for essential treatments.<br>**No:** Negligible cost impact or abundant resource availability. | **Escalate** if Yes.<br>**Continue** if No. | Prevents opportunity cost harm. Even if a claim is borderline, it cannot justify denying clear treatment to others due to budget constraints. |
  | **5** | **Consent & Coercion:** Would declining this intervention impose a serious cost (job loss, social exclusion) making consent coerced? | **Yes:** Patient faces termination, legal penalty, or severe social ostracization without intervention.<br>**No:** Patient faces inconvenience or personal disappointment only. | **Escalate** if Yes.<br>**Continue** if No. | Protects autonomy. If the choice is not free, classifying it as "enhancement" ignores the coercive environment forcing the medicalization. |

