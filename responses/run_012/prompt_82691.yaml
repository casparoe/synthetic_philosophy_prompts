  Elena, a shift manager at a community bakery, glances at the digital display of the convection oven which reads 350 degrees, a readout she trusts based on recent calibration. She is simultaneously managing two distinct responsibilities: first, she is baking a personal birthday cake she brought in to share with staff at the end of the shift, where an incorrect temperature would merely result in a dry cake and minor personal disappointment; second, she is supervising the final bake of a large order of allergen-free bread for a client with severe anaphylaxis, where the specific temperature is a certified kill-step for cross-contamination and a deviation could cause a fatal allergic reaction and legal catastrophe. She relies on the identical visual evidence of the oven display to decide both when to put her cake in and when to sign off on the allergen-free batch, holding the same credence that the oven is truly at 350 degrees for both decisions without distinguishing the reliability of the display between the two tasks.

  (a) The proposition is that the oven is currently at 350 degrees. The first practical question is whether to insert the personal cake, which imposes a low evidentiary threshold requiring only that the oven is likely hot enough to bake; the verdict is that Elena knows the proposition. The second practical question is whether to certify the allergen-free batch, which imposes a high evidentiary threshold requiring near-certainty to rule out lethal risk; the verdict is that Elena does not know the proposition.

  (b) The split is a contradiction for standard subject-sensitive invariantism (SSI), which typically ties knowledge to the subject's overall situation. If stakes are global, the high stakes of the allergen task should defeat knowledge for the cake task as well. A question-relative version of SSI would hold that knowledge is a ternary relation between subject, proposition, and practical question, allowing the epistemic standard to vary across simultaneous actions. This differs from ascriber contextualism because the standard shifts based on the subject's own practical questions, not the attributor's conversational context. Only the question-relative version of SSI can accommodate the case without modification; standard SSI and ascriber contextualism (given Constraint 5) both predict a uniform verdict.

  (c) The single feature doing the work is the simultaneity of independent practical inquiries with divergent stakes attached to the same proposition for the same subject.

  (d) If that feature is removed—meaning Elena is engaged in only one of the tasks—the case collapses into the familiar pattern where stakes are uniform. If she is only baking the cake, she knows; if she is only certifying the bread, she does not know. The threshold-splitting vanishes because there is no longer a conflict between two live practical questions within the same context.

  (e) A defender of standard SSI would argue that knowledge is a binary property of the subject relative to their total situation, meaning the highest stakes present in any live question determine the epistemic standard for all questions. They would claim the intuition that Elena "knows" for the cake is illusory, representing merely a pragmatic permission to act on belief rather than genuine knowledge. This move preserves the binary nature of knowledge but fails to explain why it is fully rational for Elena to proceed with the cake without further investigation while being irrational to proceed with the bread on the exact same evidence, suggesting that the epistemic status itself, not just the pragmatic permission, must vary.
