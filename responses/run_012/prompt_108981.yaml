      *   *Key Insight:* The officer scene is crucial. If adults are the "teachers/rulers" (Xunzi), and they are hunting humans in a warship, then the external authority is corrupt. This favors Mencius's idea that the environment (war) destroyed the internal sprouts.

  7.  **Final Polish:**
