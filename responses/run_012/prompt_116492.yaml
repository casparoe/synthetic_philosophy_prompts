prompt: |-
  ok so I'm working on something about bet sizing and I want to get the spec down before I write anything else. The picture I'm starting from: forget maximizing expected money, maximize the growth rate of your bankroll over a run of bets instead -- bet a fraction of your money proportional to your edge, so the typical trajectory compounds best rather than the average one. Kelly, growth-optimal, geometric-mean stuff, whatever you want to call it.

  What I want back is the desiderata list. Not the formula and not a defense of it: what does any adequate theory of "how much of my money goes on this" have to deliver? The cases it has to get right, the distinctions it can't collapse, the results it can't contradict -- with the case behind each requirement, plus your call on which requirements are real and which are just something one side in the argument wants. And flag any pair you think can't be satisfied at the same time.

  Things I want the list to cover, though dont let this be the whole list:

  - the case where expected money and the growth rate point different ways. One-shot coin flip on your entire bankroll: heads it goes up 50%, tails it goes down 40%. Expected money rises 5%, but the average of the log falls, so the growth person turns down a bet that's good in expectation. Then the same bet where you're allowed to stake any fraction you like -- I think there both rules say bet, they just disagree about how much (a quarter of the bankroll, if I've done the algebra right), so the theory needs to be able to say which of the two setups is the real disagreement.
  - one-shot bets generally. The growth argument gets its force from repetition; the theory owes us something for the n=1 case, or an honest admission that it's silent.
  - edges you've estimated rather than edges you know. Overbetting is punished without limit in a way underbetting isn't -- bet too small and you leave growth on the table, bet too big and eventually the growth rate goes negative, worse than not betting at all. So does the theory owe us a rule for when the edge is a guess, and does it have to be robust to the guess being wrong?
  - bets that aren't independent: two positions on the same underlying, a portfolio correlated with your job, a bet that only pays off in the world where you also lose your income.
  - what the bankroll even is. Liquid cash, future earnings, the house you live in. If the theory's answer turns on a quantity that isn't well-defined, that's a requirement on the theory, not a quibble.
  - whether this is a theory of rationality or of prudence. If I bet half of what the growth rule says, am I irrational, or just more risk-averse? 'Maximize expected log wealth' is one utility function among alot of them, and it's not obvious that rationality picks it out. This is where I want you to plant a flag: I suspect "the theory gives a determinate answer to how much to bet" and "the theory doesn't smuggle in a controversial attitude to risk" can't both hold, and I want to know which one you'd keep and what it costs.

  Don't hand me a survey of who says what. Give me the list, the case under each item, a straight answer on which requirement rules out the most candidates, and a definite verdict on whether the set can be jointly satisfied. If two of my bullets are really one requirement, merge them and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Topic:** Bet sizing theory (specifically focusing on Kelly/Growth-Optimal vs. Expected Value).
      *   **Goal:** Create a "desiderata list" (requirements for an adequate theory).
      *   **Constraints:**
          *   Do *not* provide the formula.
          *   Do *not* defend the theory.
          *   *Do* specify cases it must get right, distinctions it must make, results it can't contradict.
          *   *Do* include the case behind each requirement.
          *   *Do* flag which requirements are "real" vs. "one side of the argument."
          *   *Do* flag incompatible pairs (trade-offs).
          *   *Do* cover specific user-provided topics (EV vs. Growth divergence, n=1 cases, estimated edges, correlations, definition of bankroll, rationality vs. prudence).
          *   *Do* merge overlapping bullets if necessary.
          *   *Do* provide a verdict on joint satisfiability.
          *   *Tone:* Direct, analytical, no survey of literature, "plant a flag" on the rationality/prudence tension.

  2.  **Deconstruct the User's Input Bullets:**
      *   *EV vs. Growth Divergence:* The 50%/40% coin flip. Full bankroll vs. fractional stake. Need to distinguish when the disagreement is about *whether* to bet vs. *how much*.
      *   *One-shot (n=1):* Growth relies on repetition (LLN). Theory must address single bets or admit silence.
      *   *Parameter Uncertainty:* Known edge vs. estimated edge. Asymmetry of error (overbetting kills, underbetting drags). Needs robustness.
      *   *Correlations/Non-independence:* Portfolio context, human capital, state-dependent payoffs.
      *   *Definition of Bankroll:* What counts as wealth? (Liquid vs. Total Net Worth vs. Human Capital).
      *   *Rationality vs. Prudence:* Is Kelly *the* rational choice or just *a* risk preference? Can we have a determinate answer without smuggling in risk aversion?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: The EV/Growth Split.* The user wants to know when the theory says "No Bet" vs. "Less Bet."
          *   *Requirement:* **Distinguish Survival from Optimization.** The theory must identify the "ruin boundary" (where growth turns negative) separately from the "optimal boundary."
          *   *Case:* The 50/40 all-in bet. EV says yes, Growth says no (ruin). Fractional bet: Both say yes, Growth says <100%.
          *   *Status:* Real requirement. Any theory ignoring ruin is incomplete for long-term agents.

      *   *Item 2: The Time Horizon (n=1 vs. n=inf).*
          *   *Requirement:* **Horizon Consistency.** The theory must specify the time horizon for which the sizing is optimal, or provide a scaling rule for finite N.
          *   *Case:* A single bet on a startup exit vs. daily trading. Kelly assumes reinvestment over infinite horizon.
          *   *Status:* Real requirement, but often glossed over.
          *   *Merge?* This relates to the "Rationality" point. If you only bet once, log utility might not be the right proxy. Let's keep it distinct but link it to the utility argument.

      *   *Item 3: Parameter Uncertainty (Edge Estimation).*
          *   *Requirement:* **Error Asymmetry Handling.** The theory must account for the fact that overestimating edge is catastrophically worse than underestimating it.
          *   *Case:* You think you have 5% edge, you actually have 0% or -1%. Full Kelly wipes you out. Half Kelly survives.
          *   *Status:* Real requirement. "Known edge" is a fantasy in most real domains.

      *   *Item 4: Context/Correlations (The "Bankroll" definition).*
          *   *Requirement:* **Total Wealth Integration.** The theory must define "bankroll" as total economic exposure, not just liquid gambling capital. It must account for correlated risks (human capital, other bets).
          *   *Case:* Betting on a tech stock when you work in tech. Or betting money you need for rent.
          *   *Status:* Real requirement. Isolating the bet from the agent's reality is a model error.
          *   *Merge:* The user's "Bankroll definition" and "Correlations" are effectively the same requirement: *Contextual Completeness*. You can't size a bet without knowing the rest of the portfolio.

      *   *Item 5: Rationality vs. Risk Preference.*
          *   *Requirement:* **Normative Status Clarity.** The theory must state whether the output is a constraint of rationality (you *must* bet this much) or a preference parameter (you *may* bet this much depending on utility).
          *   *Case:* Betting half-Kelly. Are you irrational? Or just conservative?
          *   *Status:* This is the "one side of the argument" flashpoint.
          *   *Conflict:* This is where the incompatibility lies.

  4.  **Refining the Incompatibility (The "Flag Planting"):**
      *   The user suspects "Determinate Answer" and "No Smuggled Risk Attitude" are incompatible.
      *   *Analysis:* To get a *single* number (Determinate), you need a specific objective function (Log Wealth). To avoid *smuggling risk attitude*, you need to prove Log Wealth is the *only* rational objective.
      *   *Verdict:* They are incompatible. Log wealth *is* a specific risk attitude (relative risk aversion = 1). Claiming it is "objective rationality" is a philosophical leap (Ergodicity Economics argument) that not all accept.
      *   *Decision:* I must side with one. I will side with "No Smuggled Risk Attitude" being the casualty. To get a determinate theory of sizing, you *must* commit to a specific utility function (growth), which *is* a risk attitude. You cannot derive "how much" without "how much do you care about downside vs upside."

  5.  **Structuring the Output:**
      *   Introduction: Acknowledge the task (specification, not derivation).
      *   The List: Numbered items with Requirement, Case, and Status (Real/Contested).
      *   The Incompatibility: Explicitly address the conflict.
      *   The Verdict: Can they be jointly satisfied? (No).
      *   The Flag: Which requirement gets cut?

  6.  **Drafting the Content (Self-Correction during drafting):**
      *   *Check:* Did I merge the bankroll/correlation points? Yes, they are about the denominator of the fraction.
      *   *Check:* Did I address the n=1 case? Yes, under Horizon Consistency.
      *   *Check:* Did I address the EV vs Growth divergence? Yes, under Survival vs Optimization.
      *   *Check:* Is the tone right? Needs to be sharp, not academic survey.
      *   *Refinement on the "Rationality" point:* Be careful not to just say "Utility functions exist." The user wants to know if the theory *claims* rationality. The Kelly argument often claims it's *not* utility, it's *ergodicity*. I need to flag that this claim is the contested part.

  7.  **Final Polish:**
      *   Ensure the "Real vs. Contested" distinction is clear for each item.
      *   Make sure the "Verdict" is definitive.
      *   Ensure the "Flag Planting" is bold.

      *(Self-Correction on the EV/Growth point)*: The user noted that in the fractional case, both say bet. The theory needs to explain *why* they agree on direction but disagree on magnitude. The requirement is that the theory must recover EV as a limit case (risk neutrality) or explain why it doesn't. Actually, the requirement is that it must identify the **Ruin Threshold**. EV ignores it; Growth centers on it.

      *(Self-Correction on n=1)*: The growth argument *fails* for n=1 strictly speaking. The requirement is that the theory must admit this limitation or provide a bridge (like utility). I will frame this as "Horizon Transparency."

      *(Final check on the Conflict)*: The user asks: "I suspect 'the theory gives a determinate answer' and 'the theory doesn't smuggle in a controversial attitude to risk' can't both be true." I agree. I will confirm this.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the desiderata list for a theory of bet sizing.

  ### 1. The Ruin Threshold (Survival vs. Optimization)
  *   **The Requirement:** The theory must distinguish between the fraction where expected value turns negative (the "bad bet" line) and the fraction where growth turns negative (the "ruin" line). It must output "Do Not Bet" when the latter is crossed, even if the former is positive.
  *   **The Case:** The 50%/40% coin flip on your entire bankroll. EV is +5%. Growth is negative (geometric mean < 1). A theory that says "Bet 100%" here fails. Conversely, for a fractional stake where both EV and Growth are positive, the theory must explain why the optimal fraction is not 100% (since EV is still maximized at 100%).
  *   **Status:** **Real.** Any theory that ignores the difference between arithmetic mean (EV) and geometric mean (survival) is mathematically incomplete for repeated exposure.
  *   **Notes:** This is the hard floor. If a sizing theory cannot identify the point where $\mathbb{E}[\ln(W)]$ goes negative, it is not a growth theory.

  ### 2. Contextual Completeness (The Denominator Problem)
  *   **The Requirement:** The theory must define "bankroll" as total investable wealth inclusive of correlated exposures and human capital, not just liquid cash allocated to gambling. It must adjust sizing based on external correlations.
  *   **The Case:** You work in tech and are offered a bet on a tech index. Or, you need 50% of your liquid cash for rent next month. A theory that sizes the bet based only on the cash in your brokerage account without accounting for the job correlation or the liquidity need will recommend ruinous leverage.
  *   **Status:** **Real.** Merging your "Bankroll Definition" and "Non-independent Bets" bullets. You cannot calculate a fraction $f$ without a rigorous definition of the whole $W$. If $W$ is ill-defined, $f$ is meaningless.
  *   **Notes:** This is where most practical implementations fail. They treat the bet as isolated rather than additive to existing risk.

  ### 3. Error Asymmetry (Robustness to Estimation)
  *   **The Requirement:** The theory must account for the fact that the cost of overestimating edge is unbounded (ruin), while the cost of underestimating edge is bounded (opportunity cost). It must provide a mechanism to shrink size when edge is uncertain.
  *   **The Case:** You calculate a 10% edge, but your model has noise. True edge is 2%. Full sizing based on the 10% estimate leads to overbetting and negative growth. A theory that assumes known probabilities is a toy model; a real theory must handle parameter uncertainty.
  *   **Status:** **Real.** In almost all non-casino domains, edges are estimates. A theory that treats estimates as certainties is fragile.
  *   **Notes:** This usually implies a "fractional Kelly" rule, but the theory itself needs to justify *why* fractioning is required (i.e., as a function of variance in the edge estimate).

  ### 4. Horizon Transparency (The n=1 Problem)
  *   **The Requirement:** The theory must explicitly state the number of repetitions required for its recommendation to converge to the optimal path, or provide a utility-based bridge for single-shot decisions. It cannot claim growth-optimality for a bet that will never be repeated.
  *   **The Case:** A one-off investment in a startup that will either IPO or go to zero in 5 years. There is no "rebalancing" and no "run of bets." The Law of Large Numbers does not apply.
  *   **Status:** **Contested.** This is where the growth argument admits silence. The ergodicity argument claims that maximizing time-average growth is rational even for single paths, but this relies on the assumption that you *will* face similar decisions over a lifetime.
  *   **Notes:** If the theory claims to work for n=1 without invoking utility, it is making a metaphysical claim about time, not a statistical one.

  ### 5. Normative Clarity (Rationality vs. Preference)
  *   **The Requirement:** The theory must declare whether its output is a constraint of rationality (any other bet size is "wrong") or a preference parameter (this size is optimal *given* a specific attitude toward risk).
  *   **The Case:** Betting half-Kelly. You survive downturns better but grow slower. Is this person irrational? Or do they just have higher relative risk aversion?
  *   **Status:** **Contested.** This is the philosophical fault line.
  *   **Notes:** This is the merge of your "Rationality vs Prudence" bullet. You cannot have it both ways.

  ---

  ### The Incompatibility Flag

  **Conflict:** **Normative Clarity** vs. **Determinate Answer.**

  You suspected that "the theory gives a determinate answer to how much to bet" and "the theory doesn't smuggle in a controversial attitude to risk" cannot both hold. **You are correct.**

  *   **To get a Determinate Answer:** You must maximize a specific function. In Kelly/Growth theory, that function is $\ln(W)$. This function implies a specific coefficient of relative risk aversion (CRRA = 1).
  *   **To avoid Smuggling Risk Attitude:** You would need to derive the bet size from pure logic without assuming a utility function. Proponents of Ergodicity Economics claim to do this (arguing that time-average growth is the *only* rational objective for a persistent agent).
  *   **The Verdict:** The "No Smuggled Risk Attitude" requirement must be dropped. Maximizing geometric growth *is* a risk preference. It values a 50% loss exactly as much as a 100% gain. That is not a law of logic; it is a specific utility curve. If you want a theory that tells you exactly how much to bet, it *must* assume you care about volatility in a specific way.

  ### Final Verdict on Joint Satisfiability

  **The set cannot be jointly satisfied.**

  You must sacrifice **Normative Clarity** (specifically, the claim that the theory is risk-neutral/objective) to satisfy **Determinate Answer**.

  *   **If you keep "Objective Rationality":** The theory becomes silent on n=1 cases and cannot dictate a specific fraction without admitting that $\ln(W)$ is a preference. It becomes a description of a specific type of agent, not a prescription for all agents.
  *   **If you keep "Determinate Answer":** You must admit that the theory prescribes a specific risk attitude (Log Utility). You must classify a Half-Kelly bettor not as "irrational," but as "having different utility."

  **My Call:** Keep the **Determinate Answer**, drop the claim of **Objective Rationality**.
  A theory of bet sizing that doesn't give a number is useless for sizing. A theory that gives a number must assume a utility function. Therefore, an adequate theory must explicitly state: *"This sizing maximizes growth for an agent who values proportional changes in wealth linearly."* It is a theory of prudence for a specific type of investor, not a universal law of rationality.

  **The Requirement that Rules Out the Most Candidates:**
  **Contextual Completeness.**
  Most formal models fail here. They assume i.i.d. bets and isolated bankrolls. Any theory that cannot ingest a correlation matrix and a human capital valuation is a toy. It is the hardest requirement to meet mathematically, but the most necessary for real-world survival.
