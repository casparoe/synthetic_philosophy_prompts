          *   Test the user's suspicion about three specific conditions (Secret is small/separable/rotatable; Marginal use is defensive; Trustworthiness depends on scrutiny).
          *   Distinguish between historical *facts* (how controls collapsed) and historical *lessons* (was it vindication or inevitability?).
          *   Maintain epistemic humility: Flag disputes among experts, distinguish analogy from evidence.
