  ok so my econ teacher mr. reyes is definately obsessed with aristotles ideas about money and he keeps handing down verdicts on random stuff. heres what hes said so far:

  - two neighbors swapping a bike for a skateboard, no cash: fine, thats literally what exchange is for
  - selling the tomatoes you grew at the farmers market: fine
