prompt: |-
  ok so I'm chairing something like an adversarial collaboration between two friends who've been arguing for two years about paraconsistent logic and neither one will budge, and I need the document they should've written together. The two camps, roughly: one is a dialetheist — she thinks some contradictions are literally true (the liar sentence, say, is both true and false) and that the right fix is a paraconsistent logic, since explosion ('A and not-A, so B') is just an invalid move. The other is a paraconsistentist too — she agrees classical logic is wrong about explosion and she uses paraconsistent logic all the time when reasoning about inconsistent bodies of info, databases, legal codes, junk theories, whatever — but she thinks no contradiction is ever actually true. For her the logic is a logic of inconsistent information, not of an inconsistent world.

  They agree on way more then either will admit and I want that on paper. Give me:

  **Joint affirmations** — a numbered list of what both can sign, 12-18 items, ~300 words. Not truisms; stuff a naive classical logician would actually deny. Cover what paraconsistency is and isn't, what explosion is, what the liar does and doesn't establish, the difference between rejecting a logical law and rejecting a premise, etc.

  **Where we part** — a table, ~250 words, three columns: the crux in neutral wording; the dialetheist's formulation in wording she'd accept; the paraconsistentist's formulation in wording she'd accept. No strawmen in either column.

  **The cruxes, ranked** — ~200 words, ordered by how much actually hangs on each, i.e. which ones, if settled, would move one of them.

  **Crux by crux** — ~500 words. For each crux, the argument or construction both agree would bear on it, plus each side's prediction written down in advance. I especially want the three they keep sliding past: (i) the exclusion problem — if the dialetheist's negation is paraconsistent, how does she say that 2+2=4 is true and not also false, when 'not false' looks too weak to exclude anything? does she need a stronger 'just true' operator, and does adding one smuggle classical negation back in and blow the whole thing up? (ii) Curry — the sentence that says 'if this sentence is true, everything is true' — what does each predict about wether the dialetheist's treatment of the liar survives Curry without a conditional too weak to run modus ponens or arithmetic? (iii) whether the paraconsistent logic is meant to describe the world or to reason about inconsistent information, and whether that distinction is doing real work or is just a label.

  **Verbal disputes** — ~150 words. Which part of this is really just about what 'true' and 'not' mean in each camp? If some of it is verbal, say exactly where the equivocation sits and whether stipulation fixes it.

  **What would move each of us** — ~200 words. For each side, what she'd count as evidence or argument against her own position. Not what the other one claims would refute her — what she herself would concede.

  **Residual disagreement** — ~100 words, one paragraph: after all that, the irreducible disagreement, described so both could sign off on the description.

  ~1700 words total, no names or dates or citations, I don't want you guessing at who said what — just the ideas. And don't fake symmetry: if one side is carrying more of the load on some crux, say so. I won't show them the draft.
