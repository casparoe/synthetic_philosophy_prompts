answer: |-
  **Joint affirmations**

  We endorse the following eighteen claims, each of which a naive classical logician would deny. These form the basis of our collaboration.

  1. Classical explosion (ex contradictione quodlibet) is invalid as a general rule of inference.
  2. Consistency is not a prerequisite for rational theorizing or coherent inference.
  3. The Liar sentence generates a genuine contradiction within standard semantic frameworks.
  4. Rejecting a logical law differs fundamentally from rejecting a premise within a theory.
  5. Paraconsistent logic preserves truth without necessarily preserving consistency across systems.
  6. Inconsistent information states are common, manageable, and not always fatal to reasoning.
  7. Classical logic is a proper subset of adequate logical systems, not the universal standard.
  8. Negation does not necessarily entail contradictory opposition in all semantic contexts.
  9. Truth values can overlap without collapsing into trivialism where everything is true.
  10. Derivation from inconsistent premises does not guarantee the truth of derived conclusions.
  11. Logical norms are distinct from ontological claims about the external world.
  12. Paradoxes indicate limits of classical semantics, not necessarily human reasoning failure.
  13. A sentence can be false without its negation being strictly true in all systems.
  14. Semantic closure is desirable for natural language to express its own semantics fully.
  15. Trivialism is false and avoidable even when admitting inconsistent premises formally.
  16. Logical validity is defined by truth preservation, not consistency preservation exclusively.
  17. Inconsistency in databases or legal codes does not imply reality is inconsistent.
  18. Both sides agree classical logic fails to handle semantic paradoxes gracefully without revision.

  **Where we part**

  | Crux | Dialetheist Formulation | Paraconsistentist Formulation |
  | :--- | :--- | :--- |
  | **Ontology** | Some contradictions are true features of reality itself. | Contradictions signify errors in information, not reality. |
  | **Logic's Role** | Logic describes the actual structure of truth and being. | Logic models reasoning over inconsistent data sets safely. |
  | **Truth Value** | 'True' applies even when 'False' also applies to same object. | 'True' implies 'Not False' in a consistent world model ultimately. |
  | **Negation** | Negation allows for truth-value gluts without exclusion. | Negation expresses incompatibility; gluts are modeling artifacts. |

  **The cruxes, ranked**

  1. **Ontological Commitment:** Whether reality itself can be inconsistent. This determines if the logic is descriptive of the world or instrumental for thought. If reality cannot be inconsistent, the Dialetheist position collapses into the Paraconsistentist one. This is the primary metaphysical divide.
  2. **The Exclusion Problem:** Whether paraconsistent negation can express incompatibility without restoring classicality. If the Dialetheist cannot explain how to exclude falsity without classical negation, her logic loses expressive power. This is the primary technical divide.
  3. **Curry's Paradox:** Whether the solution to Liar paradoxes survives self-referential conditionals without crippling modus ponens. If the conditional is too weak to support arithmetic, the logic is practically useless. This determines viability.

  **Crux by crux**

  (i) **The Exclusion Problem:** To claim 2+2=4 is not false, the Dialetheist needs a 'just true' operator to exclude falsity. The Paraconsistentist predicts this operator behaves classically, restoring explosion in a disguised form within the object language. The Dialetheist argues it is a distinct semantic device that isolates consistency locally without imposing it globally. The burden is on the Dialetheist to show this operator doesn't smuggle classical negation back in. If she fails, her logic cannot distinguish truth from triviality effectively.

  (ii) **Curry's Paradox:** The Dialetheist must restrict contraction or modus ponens to avoid triviality from Curry sentences ('If this is true, everything is'). The Paraconsistentist predicts this restriction makes the conditional too weak for ordinary arithmetic or inference, crippling the system. The Dialetheist predicts a non-contractive logic can sustain standard mathematics while blocking triviality. This is a technical hinge; if the math breaks, the logic fails. We agree to test this against standard arithmetic derivations.

  (iii) **World vs. Info:** The Dialetheist insists the distinction is metaphysical; if logic handles inconsistent info faithfully, it reflects possible inconsistent states. The Paraconsistentist argues the distinction is methodological; we use the logic to manage error, not to mirror metaphysics. The load is on the Dialetheist to prove inconsistency isn't just epistemic limitation. The Paraconsistentist carries less load here, as instrumentalism is harder to falsify. We acknowledge this asymmetry in burden of proof.

  **Verbal disputes**

  Much hinges on the definition of 'true'. For the Paraconsistentist, 'true' implies correspondence to a consistent state of affairs. For the Dialetheist, 'true' is a semantic value that can co-occur with 'false'. If 'true' means 'correctly assertible', the dispute dissolves into pragmatics. If 'true' means 'world-matching', it is metaphysical. The equivocation sits on whether truth is purely semantic or ontological. Stipulation helps, but the underlying commitment to realism vs. instrumentalism remains. We agree on the formal behavior, but disagree on the interpretation of the values.

  **What would move each of us**

  **Dialetheist:** A proof that any logic admitting true contradictions inevitably collapses into trivialism, regardless of conditional restrictions. She would concede if paraconsistency proved unusable for standard mathematics or if true contradictions were shown to be unintelligible rather than true. She requires evidence that the world is consistent despite paradoxes. She needs a demonstration that the 'just true' operator is incoherent.

  **Paraconsistentist:** A demonstration that inconsistent information cannot be modeled without attributing truth to contradictions. She would concede if tracking inconsistency required ontological commitment to make the logic coherent. She carries less load here; her position is defensive. She needs proof that instrumentalism fails to capture the data. She would move if realism offered better predictive power.

  **Residual disagreement**

  We agree on the logic's formal structure and utility. We disagree on whether that structure mirrors reality or manages ignorance. The Dialetheist sees contradictions as discovered; the Paraconsistentist sees them as imposed by limited perspective. This metaphysical stance remains unresolved despite formal agreement. We sign this acknowledging that formal agreement does not entail ontological agreement.
