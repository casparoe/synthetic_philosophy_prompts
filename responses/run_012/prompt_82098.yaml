      *   **Core Task:** The user presents six specific intuition pumps/cases regarding preference coherence (cycles, inaction, self-binding, indifference, Allais violations, framing). They propose a tentative principle: *The defect is not exploitability but unusability as a plan.*
      *   **Requirements:**
