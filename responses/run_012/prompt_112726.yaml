  **Setup & Materials**
  **Time:** 90 minutes. **Students:** 18.
  **Materials:** 18 chairs, dimmable lights (or blinds), 10 poker chips (tokens), 18 sealed envelopes + pens, trash bin.
  **Prep:** Recruit one student (the Performer) before class. Explain they will be paid tokens to act grief. Instruct them that mid-scene, you will reclaim half the tokens silently; they must not react.

  **Round 1: The Theater (25 mins)**
  **Setup:** Arrange chairs in strict rows facing front. Angle chairs slightly inward so neighbors cannot see each other's faces without turning awkwardly. Dim lights to focus attention solely on the Performer.
  **Action:** Seat the audience. Introduce the Performer. Hand them 10 tokens visibly. "This person will feel grief for you." The Performer enacts sustained anguish (weeping, trembling) for 15 minutes.
  **The Cut:** At minute 8, walk behind the Performer. Quietly remove 5 tokens. Do not speak. The Performer continues identically.
  **The Climax:** At minute 15, distribute sealed envelopes. "Write what you would sacrifice to undo this wrong." Collect them.
  **The End:** Stand over the bin. "Nothing is owed. Keep your sacrifice." Shred the notes unread. Dismiss students to hallway for 5 minutes.

  **Transition (5 mins)**
  Do not evaluate Round 1. Do not promise Round 2 will be better. Frame it bureaucratically: "We are now initiating Procedure Two. Clear the floor. Remove shoes if worn. Stand in a single circle." Maintain a neutral, administrative tone to avoid signaling moral preference.

  **Round 2: The Festival (25 mins)**
  **Setup:** Open space, single circle. No chairs. Everyone stands, including you.
  **Rules:** 1. No one sits out. 2. You must maintain eye contact with someone. 3. You cannot look at anyone for more than 30 seconds unless they are looking back at you. If you break contact, you must immediately find a new partner.
  **Action:** Begin silence. If gaze drops, clap once to reset. Move through the circle, gently correcting those hiding behind others. The goal is not enjoyment but mutual exposure. Ensure everyone is seen by everyone else eventually.
  **End:** Stop abruptly. "Sit anywhere."

  **Predictive Troubleshooting**
  **1. The Performer Breaks:** Laughter undermines the commodity claim. *Fix:* Recruit a drama student or warn heavily beforehand. If they laugh, stop and say, "The contract is broken. The illusion of feeling is lost." Resume only if they recompose.
  **2. Round 2 Collapses into Giggles:** Students find mutual gaze intimate or absurd. *Fix:* Do not laugh. Enforce the 30-second rule sternly. "This is not a game. Re-engage."
  **3. "Theater Was More Fun":** A student will claim Round 1 was preferable. *Fix:* Agree. "Rousseau admits theater is pleasant. The question is not enjoyment but obligation. Did the theater demand anything of you? Did the festival allow you to hide?" Validate the feeling to isolate the structural point.

  **Debrief**
  Round 1 isolated you; you paid attention but owed nothing to the person beside you. The Performer's hidden pay cut proved feeling was commodified—you couldn't distinguish genuine anguish from paid labor. Your sealed notes were private sacrifices with no public effect. Round 2 forced mutual exposure; you were the spectacle. The difference isn't moral quality but structural relation: passive isolation vs. active reciprocity.

  However, this room cannot stage Rousseau's scale argument. Theater suits large states (Paris) where citizens are strangers; festivals suit small republics (Geneva) where everyone knows everyone. Here, you are 18 neighbors; in Rousseau's view, theater anonymizes 10,000. I must tell you: the festival fails at scale. You cannot maintain mutual gaze in a crowd of strangers. That is why Rousseau bans theater in Geneva but tolerates it in Paris. The feeling of community here is an artifact of our smallness, not just the format. Remember that limitation.
