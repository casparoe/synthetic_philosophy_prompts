answer: |-
  **Project Title:** The Selection Paradox: What Actually Legitimizes a Citizens' Assembly?
  **Applicant:** [Your Name]
  **Duration:** Nine Months

  **The Core Question**
  Citizens' assemblies are currently sold on two promises: *descriptive representation* (the room mirrors the population via lottery) and *deliberative capacity* (ordinary people reason better than partisans). Both claims rest on a hidden assumption: that the random draw is the primary source of the body's authority.

  This project asks: **Is the lottery doing the work, or is the filter?**

  Before a citizen sits in an assembly, they must survive a bureaucratic funnel: the invitation, the acceptance, the screening call, the scheduling, the stipend negotiation. The people who enter the room are not a random sample of the population; they are a random sample of *people who say yes to government invitations*. This self-selection likely tracks with institutional trust, availability, and civic confidence.

  If a body were assembled via a non-random process (e.g., the first N volunteers who clear vetting) but retained the same non-partisan, non-careerist composition, would it lack legitimacy? If the answer is "no," then the lottery is decorative theater, and we need to identify what *actually* grants authority (likely the willingness to serve). If the answer is "yes," we need a new theory of why randomness matters beyond "unlobbyability." Current debate ignores this, focusing on the *composition* of the room rather than the *pipeline* to the door.

  **Why This Gap Exists**
  The "Lottocracy" camp focuses on mathematical representation, assuming the draw guarantees legitimacy. The "Deliberative Democracy" camp focuses on the quality of discourse inside the room, assuming the input is secondary to the process. Neither investigates the selection mechanism as a variable of political legitimacy. They answer "Is sortition good?" rather than "Is the *randomness* doing any work?" This project treats the selection process not as administration, but as political theory in action.

  **Methodology and Timeline**
  This is an investigative reporting project grounded in political science. I will not attend plenary sessions; I will shadow the HR department of democracy.

  *   **Months 1–3: The Pipeline Audit.**
      I will secure access to the administrative logs of three distinct assemblies (one national, e.g., France or Ireland; two municipal). I am requesting data on the "conversion funnel": number of invitations sent, response rates, demographic breakdown of decliners vs. acceptors, and dropout rates during the briefing phase.
      *   *Deliverable:* A data visualization of the "Selection Funnel" showing where the random sample distorts.

  *   **Months 4–6: The Voice of the "No."**
      Standard reporting interviews participants. I will interview the *dropouts* and the *decliners*. Why did they say no? Was it distrust? Logistics? Disinterest? I will conduct 30+ structured interviews with those who were selected but never entered the room.
      *   *Deliverable:* A qualitative profile of the "filtered out" citizen.

  *   **Months 7–9: Synthesis and Corollary Inquiry.**
      I will synthesize findings into a framework for "Process Legitimacy." Concurrently, I will pursue a sub-question: **Is a "Sortitionariat" emerging?** Assemblies require facilitators, staffers, and often rely on returning alumni for institutional memory. I will investigate whether a professional class is forming one floor below the politicians sortition was meant to replace.
      *   *Deliverable:* Two long-form feature articles and one policy brief summarizing the legitimacy findings.

  **Defining Success and Failure**
  *   **Success:** The project produces a definitive typology of selection bias. We will know if the "randomness" is a necessary condition for legitimacy or merely a sufficient one. A successful outcome might reveal that *trust in the invitation* matters more than *method of selection*, fundamentally shifting how future assemblies are marketed.
  *   **Failure:** Administrative secrecy prevents access to selection data (invitation/decline logs). If data is redacted, the project pivots to a comparative legal analysis of how different jurisdictions mandate transparency in selection, treating the secrecy itself as the story.

  **Scope Note: The Professional Class**
  The question of a emerging "Sortitionariat" (staff/facilitators) is included as a corollary inquiry. It is worth folding in *only* as a sub-question regarding power dynamics. If made a primary pillar, it dilutes the core argument about legitimacy. By keeping it subordinate, it serves to highlight whether the *permanence* of the staff undermines the *temporariness* of the members, reinforcing the main thesis about where authority actually resides.

  **Impact**
  This reporting moves the debate past the "miracle of the room." If randomness is decorative, governments can save resources on complex stratification and focus on recruitment trust. If randomness is essential, we must protect it from bureaucratic erosion. Either way, this project stops treating the selection process as a black box.
