prompt: |-
  I was having dinner with my roommate Marcus the other night and he was buzzing about this bet a guy he knows is willing to take the other side of — even money, and Marcus reckons the thing he's betting on has about a 60% chance of happening. He's got around $30k saved and his plan is to stake a big chunk of it, then if he wins, let it ride into the next one of these, and the next, because in his words every one of these is a positive expected value bet so the more he stakes and the more he repeats it the more money he makes "on average." I couldn't really argue with the individual math — he's right that each bet, taken by itself, is favorable — but my gut says that if he actually does this, letting it all ride over and over, he'll definately end up with nothing, even though every single bet along the way was a good bet. Is that right? And if so, how do I explain it to him without just sounding like a scaredy-cat who hates risk? He keeps saying I'm "just being risk averse" and that he's the one maximizing expected dollars, which is supposed to be the rational thing to do.

  I'd also love an actual answer for him, not just a vibe: given that he thinks it's 60/40 at even money, what fraction of his bankroll should he really be staking each time, and how do you get to that number? I suspect it's way less than he wants to put in, and if I can show him a concrete figure with a reason behind it he might actually listen.

  There's one more thing he said that I couldn't rebut. I tried the "think about the long run" line and he shot back that this isn't a long run at all — it's basically a one-time opportunity, he'll only ever get to make this bet once, so optimizing for some imaginary long-run average is a category error and he should just maximize expected value on the single bet in front of him. That struck me as sophistry but I honestly couldn't say why. So: is there a real reply to "it's one-shot, so I should just maximize expected value," and does the sensible stake size actually change if it's a genuine one-time decision rather than a repeated one? If you could lay out the reasoning for both of us — he's smart, he'll follow a real argument — I'd really appreciate it.
