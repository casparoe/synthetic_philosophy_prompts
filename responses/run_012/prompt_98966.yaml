answer: |-
  You are absolutely right, and your gut is spotting a profound mathematical truth that Marcus is missing. Marcus is confusing **Expected Value (arithmetic mean)** with **Expected Growth (geometric mean)**.

  He is correct that a single bet has a positive expected value. He is incorrect that betting his entire bankroll is the rational way to exploit that edge, especially when compounding.

  Here is the breakdown of the math, the optimal stake, and the rebuttal to his "one-shot" argument, structured so you can present it to him clearly.

  ### 1. Why "Letting It Ride" Leads to Zero
  Marcus plans to bet his entire bankroll (100%) on each round.
  *   **Win:** Bankroll doubles ($\times 2$).
  *   **Loss:** Bankroll goes to zero ($\times 0$).

  Even with a 60% win rate, if you bet 100% of your bankroll repeatedly, **a single loss wipes you out forever.** You cannot recover from a zero balance.

  The probability of surviving $N$ bets is $0.6^N$.
  *   After 1 bet: 60% chance of survival.
  *   After 5 bets: $0.6^5 \approx 7.8\%$ chance of survival.
  *   After 10 bets: $0.6^{10} \approx 0.6\%$ chance of survival.

  While the *average* outcome across millions of parallel universes (Expected Value) is huge, the *most likely* outcome for Marcus in this specific timeline is ruin. This is the difference between the **Arithmetic Mean** (what Marcus is calculating) and the **Geometric Mean** (what actually happens to your wealth over time).

  ### 2. The Actual Answer: How Much Should He Bet?
  There is a specific mathematical formula for this scenario called the **Kelly Criterion**. It calculates the exact fraction of your bankroll you should wager to maximize the long-term growth rate of your wealth without going bust.

  **The Formula:**
  $$f^* = p - \frac{q}{b}$$

  Where:
  *   $f^*$ = Fraction of bankroll to bet
  *   $p$ = Probability of winning (0.60)
  *   $q$ = Probability of losing (0.40)
  *   $b$ = The odds received on the bet (1 for even money)

  **The Calculation:**
  $$f^* = 0.60 - \frac{0.40}{1}$$
  $$f^* = 0.60 - 0.40$$
  $$f^* = 0.20$$

  **The Answer:**
  The mathematically optimal stake is **20% of his bankroll**, not "a big chunk" and certainly not 100%.

  **Why 20%?**
  *   **At 100%:** Expected Growth Rate is negative (because one loss kills you).
  *   **At 20%:** Expected Growth Rate is maximized. His wealth will compound exponentially over time.
  *   **At >20%:** He is "over-betting." His expected return in dollars might still be positive, but his *growth rate* decreases, and the volatility increases. If he bets roughly 40% or more, his expected long-term growth turns negative, and he will likely go broke eventually, despite having a winning edge on every individual bet.

  You can tell him: *"You aren't being risk-averse; you're being growth-optimizing. Betting 100% actually lowers your long-term return to negative infinity. Betting 20% maximizes your compound interest."*

  ### 3. Rebutting the "One-Shot" Argument
  Marcus claims this is a "one-time opportunity," so he should just maximize Expected Value (EV) on that single bet. This is sophistry for two reasons.

  **A. The Contradiction**
  He cannot claim it is a "one-shot" decision while simultaneously planning to "let it ride into the next one, and the next."
  *   If it is truly **one bet**, he shouldn't be talking about compounding.
  *   If he is **compounding**, it is a **sequence**, and the Law of Large Numbers *does* apply.
  You can call this out directly: *"You can't argue for maximizing single-bet EV while planning a multi-bet compounding strategy. If you let it ride, you are playing the long run whether you admit it or not."*

  **B. Ergodicity and Utility (The Deep Argument)**
  Even if it were truly a single bet, his logic relies on the assumption that **Utility of Money is Linear**. This means he assumes losing \$30k hurts exactly half as much as gaining \$60k helps. For almost no human being is this true.

  *   **Linear Utility (Marcus's view):** Maximize average dollars. Bet 100%.
  *   **Logarithmic Utility (Reality):** Money has diminishing returns. The first \$30k (rent, food, safety) is worth infinitely more than the second \$30k.

  If you maximize *Expected Utility* rather than *Expected Dollars*, you almost never bet 100% of your net worth on a single coin flip, even a favorable one.

  There is also a concept called **Ergodicity**.
  *   **Ensemble Average (EV):** What happens if 1,000 people make this bet once? (Most win, the average wealth skyrockets).
  *   **Time Average:** What happens if *one person* makes this bet 1,000 times? (If betting 100%, they eventually hit a loss and go to zero).

  Marcus is optimizing for the "Ensemble Average" (the multiverse), but he lives in the "Time Average" (reality). Since he cannot access the wealth of the parallel universes where he won every time, optimizing for the ensemble average is irrational for a single agent living through time.

  ### Summary for Your Conversation
  Here is a script you can adapt. It avoids moralizing and sticks to the math he respects:

  > "Marcus, I looked into the math on this. You're right that the Expected Value is positive, but you're optimizing for the wrong variable. You're maximizing *Arithmetic Mean* return, but wealth compounds via *Geometric Mean* return.
  >
  > If you bet 100% of your bankroll, your geometric growth rate is negative because a single loss wipes out the principal needed to place future bets. The math shows that to actually maximize your long-term wealth growth, you shouldn't bet 'a big chunk.' According to the Kelly Criterion, the exact optimal bet size for a 60% edge at even money is **20% of your bankroll**.
  >
  > Betting more than 20% actually reduces your long-term growth rate. Betting 100% guarantees eventual ruin if you repeat this.
  >
  > Also, you can't say this is a 'one-shot' bet while planning to let it ride. If you compound winnings, you are playing a sequence, and the sequence math dictates 20%. If you truly only did this once, you still shouldn't bet 100% because the utility of your last dollar (rent/food) is higher than your next dollar. I'm not saying don't take the edge; I'm saying take the edge *efficiently* so you don't give your profits back to variance."

  **The Bottom Line:**
  He is not "risk-averse" for suggesting 20%; he is "math-literate." Marcus is not being bold; he is being mathematically inefficient. Boldness is betting 20% repeatedly to build wealth. Recklessness is betting 100% once and hoping variance doesn't kill you.
