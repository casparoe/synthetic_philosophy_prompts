      *   *Key Insight:* The "One-Shot" defense fails because his strategy *is* multi-shot ("let it ride"). If he truly meant one bet, he wouldn't talk about compounding. I need to highlight this inconsistency.
      *   *Ergodicity:* This is a strong concept for a "smart" roommate. Explain that time averages $\neq$ ensemble averages.

  5.  **Final Polish:**
