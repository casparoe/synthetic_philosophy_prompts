  # The Generation Kind Decision Tree

  **Instructions:** Start at Node 1. Answer each question based on your philosophical intuitions about what a generation *must* be, not on whether you like the label "Millennial." Follow the arrows to your terminal position (Leaf).

  ### Node 1: Ontological Dependence
  **If every human forgot the terms "Boomer" and "Millennial" tomorrow, would the groups referred to still exist as distinct social kinds?**
  *   **Yes** (The kind exists without the label) → Go to **Node 2** (Realist Path)
  *   **No** (The kind depends on the concept) → Go to **Node 6** (Constructivist Path)

  ---

  ### Node 2: Direction of Constitution (Realist Path)
  **Is the generation defined primarily by what happens *to* the cohort (a shared imprint) or by what the cohort *does* (a shared response)?**
  *   **What happens to them (Upstream)** → Go to **Node 3**
  *   **What they do (Downstream)** → Go to **Node 5**

  ---

  ### Node 3: Upstream Criterion
  **Is the defining upstream feature the birth year itself or a shared historical event?**
  *   **The Birth Year** → **Leaf 1**
  *   **The Historical Event** → Go to **Node 4**

  ---

  ### Node 4: Boundary Precision (Upstream)
  **Must the start and end dates of the generation align with sharp discontinuities in historical conditions?**
  *   **Yes** (Boundaries must be natural joints) → **Leaf 2**
  *   **No** (Boundaries can be fuzzy or conventional) → **Leaf 3**

  ---

  ### Node 5: Causal Decomposability (Downstream)
  **If cohort effects cannot be statistically distinguished from age and period effects, is the generation still a valid explanatory kind?**
  *   **Yes** (It remains real even if unmeasurable) → **Leaf 4**
  *   **No** (It ceases to be valid without decomposition) → **Leaf 5**

  ---

  ### Node 6: Mechanism of Construction (Constructivist Path)
  **Does the classification create the kind by causing people to act differently (looping), or does it merely describe a similarity we decided to name?**
  *   **Creates (Looping)** → Go to **Node 7**
  *   **Describes (Nominal)** → **Leaf 6**

  ---

  ### Node 7: Indexical Reference
  **When a speaker says "my generation," do they refer to the same kind as when they say "Millennials"?**
  *   **Yes** (Same kind) → Go to **Node 8**
  *   **No** (Different kinds) → **Leaf 7**

  ---

  ### Node 8: Ontological Weight
  **Is a self-fulfilling kind "real" in the same sense as a kind that exists without belief?**
  *   **Yes** (Same sense) → **Leaf 8**
  *   **No** (Different/deflated sense) → **Leaf 9**

  ---

  ## Terminal Positions (Leaves)

  **Leaf 1: Chronological Naturalist**
  *   **Awkward Commitment:** You must accept that the exact year 1997 is a metaphysical boundary where human nature shifts, regardless of historical context.
  *   **Status:** Occupied (Strict Demographers).

  **Leaf 2: Historical Naturalist**
  *   **Awkward Commitment:** You must accept that if a historical event lasted 20 years instead of 5, the generation would not exist, making social kinds hostage to event duration.
  *   **Status:** Occupied (Mannheimian Realists).

  **Leaf 3: Demographic Conventionalist**
  *   **Awkward Commitment:** You must accept that generations are real kinds even though their boundaries are arbitrarily drawn by researchers rather than nature.
  *   **Status:** Occupied (Pragmatic Sociologists).

  **Leaf 4: Epistemic Skeptic**
  *   **Awkward Commitment:** You must accept that generations are real causes even though no statistical method can ever isolate them from age or period effects.
  *   **Status:** **Unoccupied.** *Diagnosis:* Unattractive. It claims reality for an entity that is methodologically inaccessible, rendering the claim vacuous for science.

  **Leaf 5: Methodological Realist**
  *   **Awkward Commitment:** You must accept that if we cannot measure the cohort effect, the generation is merely a fiction, denying reality to whatever escapes our models.
  *   **Status:** Occupied (Strict Quantitative Empiricists).
  *   **Note:** *Distinguished from Leaf 4 by the answer to Node 5.*

  **Leaf 6: Hard Nominalist**
  *   **Awkward Commitment:** You must accept that when people fight "generational wars," they are fighting over labels that pick out nothing but a list of names.
  *   **Status:** Occupied (Radical Constructivists).

  **Leaf 7: Indexical Particularist**
  *   **Awkward Commitment:** You must accept that "my generation" is a real social kind, but "Gen Z" is not, despite referring to the same people.
  *   **Status:** Occupied (Phenomenological Sociologists).

  **Leaf 8: Interactive Realist**
  *   **Awkward Commitment:** You must accept that a hallucination becomes a natural kind if enough people believe in it and act on it.
  *   **Status:** Occupied (Hacking-style Interactive Kind Theorists).

  **Leaf 9: Deflated Constructivist**
  *   **Awkward Commitment:** You must accept that generations are "real" only in a metaphorical sense, forcing you to explain their causal power without ontological weight.
  *   **Status:** Occupied (Critical Theorists).
  *   **Indistinguishability Flag:** **Leaf 8 and Leaf 9** are not separable by empirical questions in this tree. Both agree the kind is self-fulfilling and universal (Node 7 Yes). They differ only on the metaphysical "sense" of reality (Node 8). To pry them apart, you would need to ask: *"Does the kind support counterfactuals that would hold even if the labeling practice changed?"*

  ---

  ### Design Notes for the Seminar Leader

  1.  **Upstream/Downstream (Node 2):** This forces demographers (who often focus on birth cohorts/Upstream) to confront philosophers (who often focus on agency/Downstream). If a demographer chooses Downstream, they must answer Node 5 (APC), which is their home turf. If a philosopher chooses Upstream, they must answer Node 4 (Boundaries), which exposes them to demographic critique.
  2.  **Indexicality (Node 7):** This captures the distinction between *my generation* (a lived, indexical experience) and *Gen Z* (a named, extensional category). Leaf 7 captures the view that the lived experience is real, but the named category is a reification.
  3.  **Self-Fulfilling (Node 1 & 6 & 8):** This is not treated as a footnote. Node 1 separates those who think labels *find* kinds from those who think labels *make* kinds. Node 8 forces the "Interactive Realist" to commit to whether this "making" grants full ontological status or a deflated one.
  4.  **Unoccupied Space (Leaf 4):** This position (Realist about undecomposable effects) is logically available but rarely defended because it violates the norm that scientific kinds should be measurable. It serves as a good discussion starter on the relationship between ontology and methodology.
  5.  **Indistinguishable Leaves (8 & 9):** These two positions often talk past each other in seminars. One says "It's real!" (Leaf 8), the other says "It's only socially real!" (Leaf 9). The tree reveals that their disagreement rests entirely on Node 8, which is a metaphysical distinction without an empirical difference in the tree's logic.
