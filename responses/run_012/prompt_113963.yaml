answer: |-
  Here are ten interview questions designed to press for specifics, tailored to your background as an engineer and the constraints of the interview. Each includes a follow-up keyed to a likely evasive maneuver.

  **1. The Practical Self-Defeat**
  "You argue that beliefs don't exist. But the act of writing a book to persuade us implies you think we currently hold false beliefs that your evidence can update. How can you argue for this conclusion without treating your audience as having the very beliefs you claim are fictional?"
  *   **Follow-up (if she says asserting a claim doesn't require believing it):** "If assertion is detached from belief, then you aren't asking us to *believe* your book is true, only to process it. But if belief is off the table, what normative force does your argument have? Why should I update my behavior based on an assertion you don't even claim to believe?"

  **2. Falsity vs. Roughness (The Phlogiston Test)**
  "Engineers often use 'wrong' models because they are computationally cheap and sufficiently accurate. What counts as evidence that folk psychology is *false* rather than just a lossy compression? Does the comparison to phlogiston or caloric do actual empirical work here, or is it just decorating the claim?"
  *   **Follow-up (if she says the comparison is only illustrative):** "If it's just a metaphor, then you haven't given me a falsification condition for folk psychology. Without that, how do we distinguish your eliminativism from the standard view that neuroscience will just reduce beliefs to neural states, rather than deleting them?"

  **3. Ontology vs. Linguistics (The Bait-and-Switch)**
  "Is your thesis a claim about how brains actually work (ontology), or a recommendation about how we ought to talk (linguistics)? I worry that defenders often prove the first to gain scientific credibility, but recommend the second to avoid the absurdity of living without beliefs. Is that a bait-and-switch?"
  *   **Follow-up (if she says it's both):** "If it's both, you need to bridge the 'is-ought' gap. How do you derive the recommendation that we *should* stop talking about beliefs from the claim that beliefs *don't exist*, without smuggling in folk norms about truth and rationality to make the derivation work?"

  **4. The Neural Network Case Study**
  "In my work, I probe and intervene on a neural network's internal states, but I can only predict its output statistically. I can't map a specific node to a specific 'belief.' Is this system a model of belief without beliefs, or merely a model of behavior? And if it's the latter, what relevant difference remains between the network and a human?"
  *   **Follow-up (if she says it's merely a model of behavior):** "If humans are also just models of behavior without internal propositional states, then rationality dissolves into mere causality. How do you preserve the distinction between a valid argument and a causal trigger if there's no 'grasping' of content?"

  **5. The Line of Elimination (Representations and Computations)**
  "If beliefs and desires are eliminated as folk posits, where do you draw the line? You likely still use terms like 'representations' and 'computations' in your own cognitive theory. Are those safe, or are they also legacy code from the same failing theory? What vocabulary is supposed to do the work afterwards?"
  *   **Follow-up (if she says neuroscience vocabulary will replace them):** "Neuroscience describes electrochemical gradients, not semantic content. If your new vocabulary can't capture *aboutness* (intentionality), aren't you changing the subject rather than explaining the same phenomena we care about?"

  **6. The Phenomenology of Thinking**
  "When I reason through a bug, it feels like I'm manipulating propositions. You call this introspection theory-laden. But if the folk theory is radically false, why is the phenomenology so uniform and persistent? What mechanism generates the illusion of belief if not the thing itself?"
  *   **Follow-up (if she says the illusion is a useful heuristic):** "If the illusion is hardwired and useful, eliminating the vocabulary doesn't eliminate the experience. So practically speaking, aren't you just asking us to speak one way while experiencing another? How is that sustainable?"

  **7. Evolutionary Pressure**
  "Evolution tends to select for models that track reality reasonably well, or at least consistently. If folk psychology is a radically false theory, why did it become the dominant operating system for social species? How do you explain the evolutionary stability of a cognitive architecture built on a hallucination?"
  *   **Follow-up (if she says it was useful but not true):** "In engineering, a model that is useful but structurally wrong eventually hits a ceiling where it can't be debugged. Are you claiming we've hit that ceiling now? If so, what specific prediction failures triggered this?"

  **8. Reason-Giving and Justification**
  "In software, we document *why* code exists, not just *what* it does. In human life, we give reasons for actions. If desires don't exist, then reasons don't exist. Do we become purely causal systems? If so, how do you distinguish between a person who is convinced by an argument and one who is merely brainwashed?"
  *   **Follow-up (if she says both are just causal chains):** "If there is no normative difference between reasoning and brainwashing, only a causal one, then your own book is just a causal intervention, not a rational appeal. Why should I value your intervention over a contrary one?"

  **9. Multi-Agent Coordination**
  "Distributed systems rely on shared state to coordinate. Folk psychology allows us to predict others by assuming shared beliefs. If we retire that vocabulary, how do we explain high-bandwidth coordination, like two engineers debugging a system together? What replaces 'common knowledge' in your framework?"
  *   **Follow-up (if she says we use causal coupling):** "Causal coupling explains synchronization, but not disagreement. If we don't have conflicting beliefs about the code, how do you model the resolution of conflict without referencing the content of what we disagree about?"

  **10. The Concrete Loss (Closing)**
  "Let's assume you are right and we successfully retire the vocabulary of belief and desire. Concretely, what is lost? I'm thinking about legal responsibility, personal relationships, or education. If you win, what specific human capability becomes impossible or deeply degraded?"
  *   **Follow-up (if she says nothing is lost, only gained):** "If nothing is lost, then the folk terms were truly redundant. But if they were redundant, why has no other species evolved them, and why has every human culture used them? Are you confident enough to bet the legal system on your hypothesis?"
