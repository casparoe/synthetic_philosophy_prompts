answer: |-
  The planet did not rotate. One side burned in eternal noon, the other froze in endless night. The team lived in the twilight strip, the terminator, where the sun hung permanently on the horizon, casting long, unmoving shadows across the regolith. Below the surface lived the vespers. They were colonial burrowers, segmented and blind, sensitive only to the polarization of light.

  They communicated through the rock using bioluminescent flashes filtered through crystalline scales. Most pulses were simple maintenance signals. One, however, was complex. The team called it the quench pulse. It was a specific rotation of polarized light, sharp and distinct.

  Elara, Kael, and Soren stood around the observation tank. Inside, a vesper emitter flashed the quench pulse. A receiver nearby twitched its cilia but did not move away from the artificial current pumping through the sand.

  "It should have withdrawn," Elara said, her voice tight. She tapped the glass where the genetic lineage charts were projected. "Look at the ancestral record. Five million years ago, the current was predatory. It swept vespers into the thermal vents. The quench pulse evolved specifically to trigger withdrawal from that flow. That is what the signal *is*. It's an alarm."

  "The receiver didn't withdraw," Kael countered. He adjusted the feed intensity. The receiver moved toward the light source, mandibles opening. "It approached. In the living lineage, the organ that processes this pulse has been rewired. The old withdrawal reflex is gone. Now, when they see this light, they feed. It means food. That's what it does now."

  "It means the sender is stressed," Soren said quietly. He was watching the emitter, not the receiver. "We isolated this one yesterday. No receivers nearby. No current. It flashed the quench pulse repeatedly. It was in a state of high metabolic distress. The signal reports the sender's internal state. Whether anyone listens or what they do is secondary. It means distress."

  This was the fracture in the team. They were not arguing about biology alone; they were arguing about what the light *said*.

  Elara believed the meaning was fixed by the past, by the problem the signal was originally built to solve. Even if the receivers no longer fled, the pulse meant danger because that was its origin. Kael believed meaning was fixed by the consumer. If the receiver ate, the signal meant food, regardless of history. Soren believed meaning was fixed by the producer. If the sender was in distress, the signal meant distress, even if sent into a void.

  The awkward cases had piled up over the last cycle.

  For Elara, there was the incident in Sector Four. A receiver had been exposed to the quench pulse while directly in the path of a simulated predatory current. It did not flee. It stayed and was swept away. Elara had logged it as a malfunction, insisting the signal still *meant* flee, even if the machinery was broken. To her, a lie was still a lie; the meaning remained intact despite the failure of the response.

  For Kael, there was the toxicity event. The colony had been fed a synthetic nutrient that reacted violently with the quench pulse response. Receivers approached the source, ingested the nutrient, and died. Kael had argued that the signal still meant food. The fact that the food was poison didn't change the meaning of the invitation. The function was approach and ingest; the outcome was irrelevant to the content.

  For Soren, there was the vacuum chamber test. A sender had pulsed while completely isolated, no possible receiver within light-range. Elara and Kael argued it was meaningless noise. Soren insisted it was a report of internal state. The meaning existed in the emission, not the reception.

  "The structural decay is accelerating," Soren said, breaking the silence. He pointed to the seismograph. The twilight strip was unstable. The crust was shifting. "The main colony is directly under the fault line. If the Shake comes, they'll be crushed."

  "We need to move them," Kael said. "We have the projector. We can broadcast the quench pulse from the safe zone, the lateral caves to the east."

  "And that's the problem," Elara said. "If I'm right, broadcasting this pulse tells them danger. They will burrow deeper to hide. That puts them directly under the fault. They die."

  "If I'm right," Kael said, "it tells them food. They will swarm toward the projector. That leads them east, to the safe caves. They live."

  "If I'm right," Soren said, "it tells them I am distressed. They might cluster together for safety. If they cluster under the fault, they die. If they cluster around the projector, they live. It's unpredictable. It depends on their empathy, not their instinct or hunger."

  The stakes hung heavy in the recycled air. They had one chance to broadcast. The projector could only hold a charge for one burst. Once sent, the vespers would react, and the shifting crust would not wait for a second attempt.

  "We need more data," Elara said. "We need to know which mechanism is dominant."

  "We don't have time," Soren replied. "But there is the second population."

  Two days prior, deep in the northern ridge, they had found a second group of vespers. They were structurally identical to the main colony. Same segments, same light organs, same polarization filters. But genetic dating showed they were not descended from the ancestral line. They had arisen separately, through a different evolutionary process. They had never faced the predatory current. They had no history of selection for the quench pulse.

  "They're convergent," Elara said. "They developed the pulse by chance. There is no history behind it. No original function."

  "Then broadcast to them," Kael said. "Test the reaction."

  "We can't," Soren said. "They're too deep. We can't reach them with the projector. We only have the main colony."

  "Then what do their pulses mean?" Kael asked. "If we can't test them, we have to theorize."

  Elara crossed her arms. "They mean nothing. Without the selection history, without the original problem of the predatory current, the pulse is just biological noise. It's a shape without a purpose."

  "That's absurd," Kael said. "I watched them. When one flashes, the others approach. It works. It means food."

  "The sender flashes when isolated," Soren added. "It means distress."

  "It's a **ghost-function**," Kael said suddenly. The words hung in the air. "That's what you're describing, Elara. You think meaning is a ghost that haunts the signal from the past. If the ghost isn't there, the signal is dead."

  "It's not a ghost," Elara snapped. "It's a blueprint. You're looking at a hammer and saying it means 'nutcracker' because you use it to crack nuts. But it was made to drive nails. If you try to drive a nail with the second population's pulse, it will fail. There is no design behind it."

  "But it works now," Kael argued. "The receivers eat. The colony survives. Why does the origin matter more than the use?"

  "Because the use can change," Elara said. "The origin is the anchor. Without it, the signal drifts. You call it a ghost-function because you think I'm chasing shadows. But you're the one ignoring the foundation."

  Soren looked between them. "You're both ignoring the sender. The second population sends the pulse when stressed. That correlation exists regardless of history or reception. The meaning is in the state, not the history or the consumption."

  "The state is invisible," Kael said. "We only see the light and the reaction."

  "And the history is dead," Elara added. "We only see the now."

  The seismograph beeped. A sharp spike. The Shake was minutes away.

  "We have to choose," Soren said. "Projector is charged."

  They stood before the console. The main colony was vibrating, sensing the tremors. They were huddled under the fault line.

  "If we broadcast," Elara said, "and I am right, they hide. They die."

  "If we broadcast," Kael said, "and I am right, they come. They live."

  "If we broadcast," Soren said, "and I am right, they panic. Maybe they live, maybe they die."

  "So we shouldn't broadcast?" Elara asked.

  "If we don't," Kael said, "the quake hits. They die anyway. Broadcasting is the only chance, but only if my reading is correct."

  "But if your reading is wrong," Elara said, "you kill them faster."

  "The second population," Soren said suddenly. "Elara, you said their pulses mean nothing because they have no history. But they react to each other. They survive."

  "They survive by luck," Elara said. "Their signal has no fixed content. It's ambiguous."

  "Or," Kael said, "it proves history doesn't matter. The meaning is created by the receiver. If the receiver treats it as food, it is food. The second population proves the history is irrelevant."

  "Or," Soren said, "it proves the sender state is universal. Distress is distress, regardless of lineage."

  The ground lurched. Dust fell from the ceiling of the habitat.

  "Make the call," Soren said.

  Elara looked at the genetic chart. The ancestral line was clear. The predatory current was a fact of history. But the living worms were eating.

  Kael looked at the receivers. They were hungry. The projector mimicked a food source.

  Soren looked at the emitter. It was pulsing on its own, mirroring the seismic stress.

  "If we broadcast," Elara whispered, "we are asserting that the past dictates the future. We are betting on the anchor."

  "We are betting on the now," Kael corrected. "We are betting on what they do."

  "We are betting on what they feel," Soren said.

  The tremor grew louder, a grinding roar beneath their feet.

  "Kael," Elara said. "If you're wrong, you lure them to the surface where the crust is splitting."

  "If I'm right," Kael said, "I save them. If you're right, Elara, and we do nothing, they die under the rock. If we broadcast and you're right, they die under the rock. Doing nothing guarantees death. Broadcasting offers a chance."

  "But if the signal means danger," Soren said, "broadcasting might trigger a stampede into the fault."

  "We don't know," Elara said. "That's the point. We don't know what fixes the content. Is it the dead past? The living consumer? The hidden sender?"

  "It's a ghost-function," Kael said again, softer this time. "We are chasing a ghost. But we have to act as if it's real."

  Soren reached for the console. "I will initiate the broadcast. We agree that inaction is death. Action is a risk."

  They stepped back. Soren engaged the projector.

  A beam of polarized light shot into the regolith, tuned to the exact frequency of the quench pulse.

  Below them, the ground shifted. Through the monitors, they watched the colony.

  The vespers did not move as one.

  A section near the surface twitched and began to burrow deeper, away from the light. Elara's hand tightened. *Alarm.*

  Another section, larger and closer to the lateral tunnels, surged toward the light source, mandibles flaring. Kael exhaled. *Recruitment.*

  A third group, deep in the center, clustered tightly together, vibrating in unison, neither fleeing nor approaching. Soren nodded slowly. *Distress.*

  The quake hit. The fault line opened. The group that burrowed deeper was crushed. The group that clustered survived, shielded by their mass. The group that approached the light made it to the safe caves, but some were caught in the surface fissures.

  The habitat shook violently, then settled. The dust hung in the air.

  On the screen, the colony was decimated, but a significant portion remained alive in the safe zones.

  Elara stared at the data. "Some fled. The history held for them."

  "Some approached," Kael said. "The current function held for them."

  "Some clustered," Soren said. "The internal state held for them."

  "They all received the same signal," Elara said.

  "And they all heard something different," Kael replied.

  Soren turned off the monitor. "Did we save them?"

  "We saved some," Elara said. "But we don't know why. If the signal meant danger, why did some approach? If it meant food, why did some flee? If it meant distress, why did some scatter?"

  "Maybe it means all three," Kael said.

  "Or none," Elara said. "Maybe the meaning isn't fixed at all. Maybe the ghost-function is just... us. We want it to mean something specific. But the light is just light."

  "The second population," Soren said. "If we had broadcast to them, what would have happened?"

  "We don't know," Kael said. "No history. But they would have reacted."

  "Would it have meant anything?" Elara asked.

  Kael looked at the surviving vespers on the screen. They were settling into the new caves. The light was fading. "They're alive. Does that fix the meaning?"

  "It fixes the outcome," Soren said. "Not the content."

  Elara sat down. The seismograph was flatlining. The immediate danger was passed. But the question remained, hanging in the dust like the polarized light had hung in the rock.

  "We used the signal," Elara said. "We treated it as a tool. But we still don't know what it is."

  "It worked," Kael said.

  "Partially," Soren corrected.

  Elara looked at the genetic chart, then at the live feed. "The history is there. The consumer is here. The sender is inside. The signal passes between them. But what travels in the light... we didn't catch it."

  Kael turned off the projector. "We'll never know if the second population's pulses mean anything. We can't ask them."

  "They react," Soren said.

  "They respond," Elara said. "Response isn't meaning."

  "Isn't it?" Kael asked.

  The room was silent. The planet outside continued its eternal, unmoving day. The vespers below ground continued to flash in the dark, sending pulses into the rock, into each other, into the void. The light traveled, but what it carried remained locked in the biology, hidden in the history, the hunger, or the pain.

  "We document the results," Elara said finally. "We record the survival rates."

  "And the theory?" Soren asked.

  "Leave it open," Elara said. "Write that the signal produced mixed responses. Write that the content is indeterminate."

  Kael nodded. "Indeterminate."

  Soren looked at the dark screen. "Or maybe it determined everything, and we just don't speak the language."

  They packed up the consoles. The quench pulse was no longer just a biological curiosity. It was a mirror. They had shouted into the dark, and the dark had shouted back in three different voices. None of them could say which voice was the real one. The light had gone out, but the shadow of what it meant remained, stretching long across the twilight floor, pointing nowhere in particular.
