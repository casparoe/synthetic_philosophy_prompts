      *   *The "Wrong vs. Broken" Criterion:* This is the Teleosemantic move. A heart that doesn't pump is broken. A belief that doesn't match the world is wrong. But for a machine, "wrong" usually implies "broken design." To have *original* intentionality, the normativity must come from *within* the system's goals, not the designer's. This is hard for machines. I should flag this as high-risk.

  5.  **Finalizing the Requirements:**

      *   *Requirement 1 (Misrepresentation):* Non-negotiable. If you can't be wrong, you can't mean.
      *   *Requirement 2 (Physical Closure):* Non-negotiable. No magic soul stuff.
      *   *Requirement 3 (Folk Psychology):* Preference/Constraint. Must align with how we talk, but might need revision.
      *   *Requirement 4 (The Refitted Case):* This tests the source of normativity. History vs. Current Structure.
      *   *Requirement 5 (Original/Derived Distinction):* This is the Camp Preference. Dennett says it's a difference in degree. Searle says kind. The spec should demand the theory *declare* which it is, not fudge it.

  6.  **Addressing the "Joint Unsatisfiability":**

      *   Triad:
          1.  Anti-intrinsicalism (Content is not in the head/machine intrinsically).
