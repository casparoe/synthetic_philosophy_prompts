  9.  **Final Polish:** Ensure the voice is authoritative but humble about the metaphysics. The user is a novelist; they need *drama* in the philosophy, not just dry logic. The "specification" should read like a set of constraints for a world-builder.

      *(Self-Correction on the "Refitted Two-Bitser"):* I need to be clear. If the machine is moved, does it have false beliefs (teleology/history) or is it just noise (causal)? The spec must demand the theory pick a side on *where normativity comes from*.

