          3.  Interest-Relative Interpretation (Content depends on the observer's stance).
      *   Conflict: If (1) and (3) are true, then (2) is hard to sustain. If content is always relative to an observer's interest, then "Original" (which implies observer-independence) vanishes.
      *   Weakest Link: (2). It's the most metaphysically loaded. Defenders of (1) and (3) usually dissolve (2) into a pragmatic distinction.
      *   *Wait, the User wants to hold all three.* I need to sketch how.
      *   *Sketch:* "Original" is not intrinsic magic. It is a *status* granted by interpreters when a system is robust enough to sustain interpretation across *changing* interests. Derived intentionality collapses when the specific interest vanishes; Original persists across a wider range of interpretive stances. (This is a Dennettian move but preserves the terminology).

  7.  **Addressing the "Capacity to be Wrong":**

