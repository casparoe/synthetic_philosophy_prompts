answer: |-
  **SPECIFICATION FOR INTENTIONALITY ACCOUNT**
  **Project:** Metaphysical grounding for machine testimony vs. printout.
  **Status:** Draft for Tribunal Scene Construction.

  You require a functional specification for "intentionality" that allows a character to argue before a judge without the metaphysics collapsing under cross-examination. The following requirements are divided into Non-Negotiable Constraints (physical and logical necessities) and Camp Preferences (philosophical commitments that must be declared, not hidden).

  ### I. CASE COVERAGE REQUIREMENTS
  *Any account adopted by your characters must yield a determinate verdict on the following scenarios. If the theory hedges here, it is useless in court.*

  1.  **The Coin-Operated Detector (Two-Bitser):** The theory must state whether the machine's state represents "quarter" or "metal disk of specific mass/size."
      *   *Constraint:* It cannot be both simultaneously without a rule for priority.
  2.  **The Thermostat:** The theory must explain why we do not sue a thermostat for lying when it fails to activate the furnace, whereas we might sue a human assistant for the same omission.
      *   *Constraint:* It must distinguish *failure of function* from *false representation*.
  3.  **The Frog's Visual System:** The theory must decide if the frog's neuron fires represent "fly," "black moving dot," or "food."
      *   *Constraint:* It must handle biological systems that lack language but clearly act on information.
  4.  **The Shopping List:** The theory must distinguish the list in the shopper's hand (which the world must match) from the list in the grocer's hand (which the goods must match).
      *   *Constraint:* It must account for the *direction of fit* (mind-to-world vs. world-to-mind).
  5.  **The Chinese Room:** The theory must state whether the person inside the room understands the story.
      *   *Constraint:* It cannot rely on "intuition pumps" alone; it must specify the mechanism of understanding that is present or absent.
  6.  **The Refitted Detector (Your Invented Case):** A coin detector is moved to a country with different currency. Its internal states remain identical, but they no longer trigger the intended mechanism (or trigger it for the wrong coins).
      *   *Verdict Required:* Is the machine forming **False Beliefs** (it thinks it sees a quarter, but it is wrong) or is it **Damaged/Garbage** (it is merely making noise with no semantic content)?
      *   *Specification:* The theory must locate the source of *normativity* (the rule that makes a state correct or incorrect). Is the rule historical (what it was built for) or causal (what it currently interacts with)?

  ### II. DISTINCTION MAINTENANCE
  *The argument fails if these distinctions are conflated. The text must keep them separate.*

  1.  **Original vs. Derived:** The account must not define "Original" simply as "Derived but too complex to trace." It must specify if there is a qualitative break or merely a quantitative gradient.
  2.  **As-If vs. Genuine:** The account must allow for a system to behave *as if* it has beliefs without *having* beliefs. (e.g., A missile tracks a plane, but does not "believe" the plane is there).
  3.  **Content vs. Truth-Conditions:** The account must distinguish having a meaning (content) from the conditions under which that meaning is satisfied (truth). A system can have content that is necessarily false.
  4.  **Degree vs. Kind:** The account must declare whether the difference between a thermostat and a human is a matter of complexity (degree) or substance (kind).
  5.  **Intrinsic vs. Observer-Relative:** The account must state whether meaning exists inside the system regardless of observers, or whether it is conferred by the interpretive stance of an observer.

  ### III. PHYSICAL AND PRACTICAL CONSTRAINTS
  *These are non-negotiable. If the theory violates these, it is magic, not metaphysics.*

  1.  **Physicalist Closure (Non-Negotiable):** No account may posit a substance or force that physics cannot in principle deliver. No "soul stuff." If the machine is made of matter, its intentionality must arise from the arrangement of matter.
  2.  **Possibility of Misrepresentation (Non-Negotiable):** The account must explain how a state can be *false*. If a state is defined by what causes it, it can never be false (it is always caused by *something*). If a state is defined by what it is *supposed* to detect, it can be false. The theory must choose a mechanism for error.
  3.  **Folk Psychology Compatibility (Preference/Constraint):** The account should not render our everyday practice of attributing beliefs (to humans) systematically false. If the theory says humans don't actually have beliefs, it is too costly for a tribunal setting.
  4.  **Indeterminacy Tolerance (Preference):** The account must allow for cases where there is no fact of the matter about what is meant. (e.g., Does "gavagai" mean "rabbit" or "undetached rabbit part"?). Insisting on perfect determinacy makes the theory brittle.

  ### IV. TEST OF YOUR CANDIDATE REQUIREMENT
  *Candidate: "The mark of the original article is the capacity to be not merely broken but wrong."*

  **Verdict:** This is a **Non-Negotiable Requirement** for any robust theory of intentionality, but it is insufficient to distinguish Original from Derived on its own.

  **Analysis:**
  1.  **Why it holds:** A broken thermometer does not say "It is 20 degrees" when it is 30; it says nothing, or it says nothing intelligible. A liar says "It is 20 degrees" when it is 30. To have content is to have conditions of satisfaction that can fail *while the system continues to function*.
  2.  **Implication for Derived Side:** Derived intentionality (the machine) can be "wrong" only relative to the *designer's* intent. If the designer intended it to detect quarters, and it detects a slug, it is wrong *for the designer*.
  3.  **Implication for Original Side:** Original intentionality (the human) must be "wrong" relative to its *own* internal norms or biological functions, independent of a designer.
  4.  **The Counterexample that Kills it as a Sole Criterion:** A self-correcting missile guidance system can be "wrong" (off target) and correct itself. It has a norm (hit target) and can fail it. Yet we hesitate to say it has *original* intentionality.
      *   *Correction:* The capacity to be wrong is necessary, but not sufficient. You must add: **The capacity to be wrong about matters irrelevant to its immediate survival or design function.** (e.g., A human can believe falsely about the population of Paris without dying or breaking; a machine usually only errors when its function is compromised).

  **Recommendation for the Book:** Use this criterion, but have the opposing counsel attack it using the "Guided Missile" counterexample. The witness must explain why the machine's error is "damage" while the human's error is "falsehood." The answer lies in the source of the norm (Internal vs. External).

  ### V. THE TRILEMMA: JOINT UNSATISFIABILITY CHECK
  *You asked if these three claims can be held together:*
  1.  **Anti-Intrinsicalism:** Nothing has original intentionality intrinsically; all content is ascribed relative to interests.
  2.  **Real Difference:** There is a genuine, non-arbitrary difference between Original and Derived intentionality.
  3.  **Interest-Relative Interpretation:** Content is always determined by the stance of an interpreter.

  **Diagnosis:** These three are **Jointly Unsatisfiable** in their strict forms.
  *   If (1) and (3) are true, then (2) is false. If all content is ascribed by interest, then "Original" is just a label we slap on systems we find interesting. There is no *real* difference in the world, only a difference in our attitude.
  *   If (2) and (3) are true, then (1) is false. If there is a real difference, something must ground it intrinsically (e.g., biology).
  *   If (1) and (2) are true, then (3) is false. If there is a real difference but no intrinsic content, then interpretation must be constrained by something other than interest (e.g., causal history).

  **The Weakest Link:** Claim (2) **The Real Difference.**
  *   *Reasoning:* Claim (1) and (3) form a coherent package (The "Intentional Stance" view). Claim (2) is the metaphysical add-on that creates the friction.
  *   *What Defenders Must Surrender:* To hold all three, you must redefine "Real Difference." It cannot be a difference in *substance* (ghost in the machine vs. gears). It must be a difference in *stability*.
  *   **The Sketch of the Compatible Position:**
      *   *Thesis:* All intentionality is ascribed (Anti-Intrinsicalism).
      *   *Thesis:* Ascription is interest-relative (Interest-Relative).
      *   *Resolution:* "Original" intentionality is the status granted to systems whose behavior is so robust that they sustain interpretation *even when the interpreter's interests change or are hostile*. "Derived" intentionality collapses when the specific design-interest is removed.
      *   *Application to Tribunal:* The machine's report is "Derived" because if the Tribunal loses interest in the machine's purpose, the report becomes mere noise. A human witness is "Original" because their testimony retains semantic content even if the Tribunal wishes them to be silent. The difference is not in the *stuff*, but in the *persistence of the pattern* under interpretive pressure.

  ### VI. CAMP CONCESSIONS
  *If you force the standard positions to meet this specification, here is what they break.*

  **The Biological Naturalist Position (Searle-style):**
  *   *Must Abandon:* The intuition that we know *how* biology does it. They must admit they cannot specify the causal mechanism that turns neurons into meaning, only assert that it happens.
  *   *Must Abandon:* The certainty that machines *cannot* have original intentionality. They must concede that if a machine were causally equivalent to a brain (not just syntactically), it would have original intentionality. This weakens the "machine vs. human" dichotomy in your book.

  **The Intentional Stance Position (Dennett-style):**
  *   *Must Abandon:* The comfort that "Original" is just a useful fiction. In a tribunal, "useful fiction" is not a strong enough category to admit testimony. They must argue that the *utility* of the interpretation is what makes the testimony real, which risks making truth subordinate to usefulness.
  *   *Must Abandon:* The idea that the "Refitted Two-Bitser" case has a single right answer. They must admit the answer depends on which predictive stance the Tribunal adopts (Historical vs. Current).

  ### VII. CANDOR ON UNCERTAINTY
  *Where this reasoning is most likely to come apart.*

  1.  **The "Capacity to be Wrong" Criterion:** I hold this verdict loosely. It is the most vulnerable point.
      *   *Why:* It relies on a clear distinction between "system failure" and "representational failure." In complex neural networks (biological or artificial), this line is blurred. A hallucination in a human might be a "broken" neuron or a "false" belief. If your machine is complex enough, the defense can argue its errors are "hallucinations" (Original) rather than "glitches" (Derived).
      *   *Persuasion to Abandon:* If you can show a case where a system is *designed* to lie (e.g., a decoy), the "capacity to be wrong" becomes a design feature, collapsing back into Derived intentionality.

  2.  **The Joint Unsatisfiability Claim:** This is the highest risk area.
      *   *Why:* Philosophers have spent decades trying to square these circles. My suggestion to redefine "Real Difference" as "Stability of Interpretation" is a pragmatic move, not a metaphysical one. A sharp judge might rule that pragmatic differences do not qualify for legal testimony standards.
      *   *Demotion:* If the Tribunal requires a metaphysical guarantee (Is the machine *really* thinking?), the "Stability" solution fails. It only works if the Tribunal accepts a functionalist standard (Does the machine *act* like it's thinking reliably?).

  3.  **The Refitted Two-Bitser:**
      *   *Risk:* This case turns on Teleosemantics (function based on history) vs. Causal Semantics (function based on current interaction). There is no consensus in philosophy on which is correct.
      *   *Advice:* Do not let your character claim one is objectively true. Let them argue that the *Law* must choose one. The metaphysics is undecidable; the legal standard must be a stipulation. This is likely the most dramatic route for your novel: the Tribunal must *legislate* the metaphysics because nature does not provide it.

  ### VIII. EXCLUDING WORK
  *Which single requirement costs the most theories?*

  **The Requirement:** **Misrepresentation must be possible without system failure.** (Your "Capacity to be Wrong" criterion).

  **Why:** This kills pure Causal Covariance theories (which say a state represents whatever causes it—if it's caused, it's true) and it kills pure Functionalist theories that cannot distinguish "doing the wrong thing" from "failing to do the thing." It forces the theory to posit a *normative* layer (rules, functions, or goals) that floats above the physical mechanics. This is the hardest thing to ground in a physicalist universe. If your character can explain how a machine has a "goal" that isn't just a "cause," they win the case. If they cannot, the machine is merely a causal chain, and its report is physical evidence, not testimony.

  **Final Instruction for the Text:**
  Do not let the witness solve the metaphysics. Let the witness demonstrate that the metaphysics is underdetermined by the physics, and therefore the Tribunal must rule based on *consequence* rather than *essence*. The machine is a witness if treating it as such yields a more stable society; it is a printout if treating it as such yields better predictability. The "Original/Derived" distinction is not a discovery; it is a verdict.
