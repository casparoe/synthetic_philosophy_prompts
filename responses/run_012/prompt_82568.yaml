      4.  Decision Structures (2).
      5.  Individual/Distributional (5) - Deprioritize.

      *Reasoning:* If the world is static, the canonical result holds. If the world is dynamic, the canonical result might be irrelevant. So Dynamics is the most urgent check. Causality is the next layer of definition. General Theorem is the synthesis.

