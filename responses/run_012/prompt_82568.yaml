      Let's refine the "Merging". Candidate 1 (Endogenous labels) and 3 (Strategic response) are mathematically similar (fixed points). Candidate 4 (Causal) is distinct but related (what does $Y$ represent?). I will recommend merging 1 and 3 into a "Dynamic Fairness" workstream. I will keep 4 separate but linked.

