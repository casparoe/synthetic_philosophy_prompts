answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Restitution of 1897 Shrine Figures

  **RECOMMENDATION**

  I recommend the Board approve the Director's proposal, with specific amendments regarding governance. We should transfer legal title to a designated Trust representing the Priestly Lineage, not the National Government. Simultaneously, we will execute a renewable 10-year custodial loan agreement keeping the figures in our care, contingent on a shared conservation protocol and guaranteed ritual access.

  **Time Frame:** Legal transfer to be executed within 180 days of this vote. The first review of the custodial loan agreement to occur at the 24-month mark, not the standard 5-year cycle, to ensure the arrangement remains responsive to the community's evolving needs.

  **RATIONALE: UNBUNDLING TITLE, CUSTODY, AND USE**

  This case forces us to confront a question rarely addressed in standard restitution protocols: Can the rights of ownership be unbundled to serve conflicting ethical obligations?

  In this instance, we are facing three distinct claims that cannot be satisfied by a single physical outcome:
  1.  **Sovereignty/Moral Title:** The objects were taken via punitive expedition. The moral debt is owed to the source community, specifically the lineage responsible for them, not necessarily the modern State.
  2.  **Ritual Integrity:** The Priestly Lineage asserts these are not "property" but active agents. Removing them from the shrine disrupts their function.
  3.  **Physical Preservation:** A significant faction within the source community fears that immediate return to active ritual will result in the degradation or destruction of the figures.

  The Director's proposal attempts to split these rights. By transferring **Title**, we acknowledge the 1897 taking was illegitimate and correct the legal status of the objects. We are no longer "owners"; we are bailees. By retaining **Custody**, we address the preservation concerns raised by members of the community itself, leveraging our conservation resources without asserting ownership. By guaranteeing **Ritual Access**, we attempt to honor the "not property" claim without subjecting the physical material to immediate environmental risks.

  This unbundling is not a legal fiction; it is a pragmatic necessity. If we return physical custody immediately, we privilege the ritual claim over the preservation claim within the community. If we retain title, we privilege our institutional security over their sovereignty. Transferring title while retaining custody via loan shifts the power dynamic: the community can recall the objects at any renewal interval. The leverage moves from the museum to the source.

  **THE COUNTER-CASE: THE "NEOCOLONIAL FUDGE"**

  I want to articulate the strongest argument against this recommendation, as held by half of this Board, because it must be weighed seriously.

  The opposition argues that this proposal is a sophisticated mechanism for retaining colonial control. The core of this argument is that **conservation is not a neutral value.** By insisting the figures stay here for "safety," we are imposing a Western museological value (permanence of material) over an Indigenous ontological value (utility of spirit).

  If the Priestly Lineage states these objects are not property, then our offer of "legal title" is a category error that forces them into our legal framework to assuage our own liability. Furthermore, the existence of a faction within the community that wants the objects kept safe does not justify the museum remaining the arbiter of that safety. By staying in possession, we continue to benefit from the prestige of holding these objects (attendance, grants, reputation) while claiming moral high ground.

  This view holds that true restitution requires us to surrender the *risk* of loss. If the community chooses to use the figures until they degrade, that is their right. To prevent that is to treat the community as incapable of stewarding their own heritage. In this light, the loan agreement is not a partnership; it is a guardianship that perpetuates the paternalism of the 1932 donation.

  **WHAT WE OWE THE COMMUNITY**

  We cannot resolve the internal disagreement within the source community, nor should we attempt to. However, we do owe them a structure that does not freeze this disagreement in our favor.

  If we proceed with the loan model, we owe the community more than just conservation. We owe them **agency over the narrative of decay.**

  Therefore, my amendment to the Director's proposal is the creation of a **Joint Stewardship Council**. This body, comprising representatives of the Priestly Lineage and the National Government, must have veto power over conservation treatments. If the priests determine that a specific conservation method renders the object ritually "dead," their decision overrides our conservators.

  Additionally, we must fund and facilitate regular visits by the Priestly Lineage to perform necessary rituals *here*, or fund the secure transport of the figures to the shrine for specific high-holy days. We cannot claim to support ritual use while keeping the objects in a climate-controlled box.

  **CONCLUSION**

  The Director's plan is imperfect, but it is the only pathway that acknowledges the split within the source community without forcing a binary choice between destruction and detention. It separates the legal remedy (title transfer) from the physical outcome (custody), allowing the community to reassess that physical outcome every decade.

  We should vote yes, but only with the understanding that we are not "keeping" these objects. We are holding them in trust, waiting for the day when the community decides they are ready to come home, even if that means they do not come home in the same condition we hold them now.

  **ACTION REQUIRED**

  Motion to approve the transfer of title to the [Name] Community Trust and authorize the negotiation of the 10-year custodial loan agreement, subject to the formation of the Joint Stewardship Council by Q1 2024.
