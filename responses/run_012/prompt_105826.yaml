answer: |-
  Good evening. Thank you for coming. We are here to discuss the proposal to close the lido and sell the site. The room is full, passions are high, and arguments have been circulating for months. As Chair, my role is not to decide the outcome tonight, but to ensure the debate is conducted on solid ground. To that end, I want to structure our discussion around the principle many of you have cited: Chesterton's Fence.

  First, let us state the principle plainly. Too often, it is treated as a mystical defence of the past. It is not. It is a claim about where the burden of proof lies. Chesterton argued that if you come across a fence in a field, you should not remove it until you know why it was put there. This is not a claim that old things are inherently good. It is a claim that ignorance of a thing's purpose is not a valid reason for its destruction. The burden rests on those who would remove the fence to demonstrate they understand its function.

  Second, we must separate this from weaker arguments that often cling to it. This principle is not an appeal to nostalgia. It does not matter whether you learned to swim here in 1950 or whether you have never seen the water. Nor is it a claim that if a thing still works, there is nothing to discuss. Fences rot; institutions fail. The argument is not that the lido must stand because it is old or beloved, but that it cannot be removed simply because its purpose is assumed to be obsolete. Like a biological trait, an institution may be adaptive, vestigial, or a mere by-product, but we must diagnose before we amputate.

  Third, and this is the most critical point, we must define what would actually discharge that burden. If the answer is that the fence can never be moved, the principle is worthless, and the developer's consultant is right to dismiss it. So, let me be clear on what would convince me that the fence is understood well enough to be removed. I would accept demolition if the council can demonstrate three things. One, that the original purpose—public recreation and safety—is no longer viable here even with refurbishment. Two, that the social function of the lido is provided for elsewhere in the town, not simply sold off. And three, that the economic case accounts for the loss of the asset, not just the gain from the sale. If the council can prove the fence was put up for a reason that no longer exists, and that removing it creates a greater good, then the fence may come down.

  Fourth, I must be honest about where my own case stops. I am not a chartered surveyor. I do not know whether the viability figures presented in the appraisal are correct, and I should not pretend to. There may be structural costs we cannot meet. There may be safety liabilities we cannot insure. My concern is not that the numbers are wrong, but that the numbers are being used to bypass the question of purpose. We cannot allow a financial spreadsheet to do the work of a heritage assessment.

  I will conclude by noting that Chesterton was no defender of the propertied status quo; he was a distributist who distrusted concentrated power. This principle is not a shield for developers, nor is it a weapon for campaigners. It is a tool for clarity. Tonight, let us use it to ask the right questions, rather than shouting the old answers. The floor is open.

  ***

  **Note for the Chair**

  Regarding the intellectual status of the Fence principle: it is settled that Chesterton formulated it in *The Thing* (1929) as a rebuttal to progressive reformers who dismissed customs merely because they were old. However, among scholars, it is genuinely contested whether this constitutes a conservative doctrine. Some argue it is inherently conservative because it privileges existing structures; others contend it is methodological neutrality, applicable to radical change once the function is understood. The relationship between Chesterton and Burke is also debated; while both emphasise prejudice and prescription, Chesterton's focus on the "reason of the thing" differs from Burke's emphasis on inherited wisdom. Finally, there is no consensus on a stopping rule for the principle. Critics argue it leads to an infinite regress (why was the reason for the fence put there?), while defenders claim it simply demands a threshold of understanding before action. You should treat the principle as a heuristic for due diligence rather than a settled philosophical veto.
