prompt: |-
  I clerk for the constitutional court of a religiously plural democracy, and I have to draft the bench memorandum on a case the court has just agreed to hear. What I need from you is not a summary of the briefs but a disciplined prediction: on the court's own record, which way should it come out, and what principle it commits itself to either way.

  The record. These are the court's relevant holdings from the past two decades; I give you the verdicts, not a survey of the field.

  - It upheld a compulsory public-health measure — a vaccination requirement with a genuine epidemiological basis, applying to everyone — even though it fell hardest on a small number of religious objectors who were fined for refusing it.
  - It struck down a ban on a method of ritual slaughter, where the only reason ever offered for the ban was the majority's religiously grounded conviction that the practice was barbaric; no independent evidence showed the method caused more suffering than the permitted one, and the prohibition fell almost entirely on two small minorities.
  - It struck down a statute authorizing an official prayer at the opening of municipal council meetings, defended as civic tradition and solemnity, to which dissenters had either to stand or conspicuously leave.
  - It upheld an exemption permitting members of a minority faith to depart from a general uniform-and-safety rule — a head covering, a ceremonial item — where compliance would have cost them their livelihood and the state's interest in uniformity was slight; the reasoning was framed in terms of equal participation in public life.
  - It struck down a public subsidy granted to the majority church and denied to every other congregation, defended on grounds of historical tradition.

  The new case. The national legislature has enacted a statute barring the display of religious symbols by students on state-school premises. The statute is facially neutral — it names no faith and forbids the symbols of all of them — and the government's official defence is entirely secular: state neutrality, the protection of children from proselytism, and gender equality. But the coalition that passed it is on record, in documents that have since leaked, as aiming to make the children of one particular minority faith feel unwelcome and to reassure the majority's base; on the evidence, the secular rationale was assembled after the fact. In practice the ban falls almost wholly on that one minority, which is small and has few alternatives: its families can enroll in private religious schools, but these are costly and exist in only a few cities. The burden is real but not total — no one is compelled to profess or renounce a belief, and private worship is untouched. The government's position is that its reasons are the reasons it has stated publicly, and that a court has no business inspecting the motives behind a facially neutral law.

  What I want.

  First, the candidate rules that fit the record. I expect there is more than one, and I want them stated as rules — what each takes the court to be testing — not as slogans. The clerks' room is split: some of my colleagues think the court has been testing whether a public reason for the law can be given at all; others think it has been testing whether the reason the government actually acted on was a public one; others think it has intervened only where someone was coerced, or only where a minority was being put in its place. Tell me which of these the record actually supports, and whether some rule none of us has named fits it better.

  Second, what each surviving rule predicts for the new case, and precisely where they diverge on these facts.

  Third, your best guess at the rule the court is really running, with the reasons for preferring it to the others that fit.

  Fourth, the closest analog in the record, and a candid statement of the principle the court adopts if it upholds the ban and the principle it adopts if it strikes the ban down — I want the cost of each choice made plain.

  Fifth, the single further case I could add to the record that would most sharply force the surviving rules apart, and what each would say about it.

  I am not asking for a survey of the literature on public reason, nor for what the court ought to do from first principles; I want the internal reconstruction of the record. If the record genuinely underdetermines the new case, say so, and tell me which way the tie breaks and why.
reasoning: |-
  Here's a thinking process that leads to the bench memorandum:

  1.  **Analyze the Request:**
      *   **Role:** Clerk for a Constitutional Court in a religiously plural democracy.
      *   **Task:** Draft a bench memorandum predicting the outcome of a new case based *strictly* on the provided record of past holdings (precedents).
      *   **Constraint:** Do not summarize briefs or use external literature/first principles. Focus on internal reconstruction of the court's jurisprudence.
      *   **Input:** Five past holdings (verdicts + reasoning snippets) and one new case (statute barring religious symbols in state schools, facially neutral but allegedly motivated by animus against a specific minority, burden falls heavily on that minority).
      *   **Output Requirements:**
          1.  Candidate rules fitting the record (testing specific hypotheses).
          2.  Prediction for the new case under each rule + divergence points.
          3.  Best guess at the *actual* rule the court is running + reasons.
          4.  Closest analog in the record + principles/costs of upholding vs. striking down.
          5.  One hypothetical case to sharpen the split between surviving rules.
      *   **Tone:** Disciplined, predictive, legalistic, internal to the court's logic.

  2.  **Analyze the Record (The Five Precedents):**
      *   *Case 1 (Vaccination):* Upheld. Compulsory, epidemiological basis, applies to everyone. Burden on religious objectors (fines). *Key:* Secular justification (health) was genuine/valid. Burden existed but was outweighed.
      *   *Case 2 (Ritual Slaughter):* Struck down. Ban on method. Reason: Majority religious conviction ("barbaric"). No independent evidence of suffering. Fell on two small minorities. *Key:* Justification was *not* secular/public (it was religious/majoritarian preference). Disparate impact on minorities.
      *   *Case 3 (Official Prayer):* Struck down. Prayer at council meetings. Defense: Tradition/Solemnity. Dissenters had to stand or leave. *Key:* Coercion/Pressure on dissenters. State endorsement of religion (even if framed as tradition).
      *   *Case 4 (Uniform Exemption):* Upheld (Exemption granted). Minority faith head covering. Compliance cost livelihood. State interest in uniformity slight. Reasoning: Equal participation. *Key:* Facilitating participation. De minimis state interest vs. high individual cost. Accommodation granted.
      *   *Case 5 (Subsidy):* Struck down. Subsidy to majority church only. Defense: Historical tradition. *Key:* Exclusive benefit to majority. "Tradition" not enough to justify exclusion of others.

      *Synthesis of Record:*
      *   The Court cares about the *quality* of the state's justification (Epidemiology = Good; Majority Religious Conviction = Bad; Tradition = Bad/Insufficient).
      *   The Court cares about *coercion/pressure* (Vaccination fines = Okay if health reason; Prayer/Leave = Bad).
      *   The Court cares about *disparate impact on minorities* when the justification is weak (Slaughter = Bad; Subsidy = Bad).
      *   The Court is willing to accommodate if the state interest is slight and livelihood/participation is at stake (Uniform = Good).
      *   *Crucial Tension:* Case 1 says facial neutrality + secular reason = okay even with burden. Case 2 & 5 say "Tradition/Majority Preference" masquerading as policy = bad. Case 3 says Coercion = bad.

  3.  **Analyze the New Case:**
      *   **Law:** Bar on religious symbols in state schools.
      *   **Form:** Facially neutral (all symbols).
      *   **Public Rationale:** Neutrality, protection from proselytism, gender equality (Secular).
      *   **Actual Motive (Leaked):** Animus against one minority faith, reassure majority base.
      *   **Effect:** Falls almost wholly on that one minority. High burden (costly private school or move), though not total (private worship allowed).
      *   **Govt Argument:** Don't inspect motives; look at facial neutrality and public reasons.

  4.  **Drafting Section 1: Candidate Rules:**
      *   *Hypothesis A (Public Justification Only):* Does the law have *a* valid secular reason on its face? (Focus on Case 1).
      *   *Hypothesis B (Actual Motive/Pretext):* Was the law *actually* driven by a valid public reason, or is the secular reason a pretext for animus/majoritarian preference? (Focus on Case 2 & 5).
      *   *Hypothesis C (Coercion/Status):* Does the law coerce belief or mark a minority as second-class/excluded? (Focus on Case 3 & 4).
      *   *Refinement:* The prompt mentions specific clerk theories: (1) Public reason exists? (2) Actual motive public? (3) Coercion? (4) Minority put in place?
      *   *Evaluation against Record:*
          *   Rule 1 (Existence of Public Reason): Supported by Case 1 (Vaccination). But Case 2 & 5 suggest "Tradition" isn't enough. So it's not just *any* reason, it must be *evidence-based* or *non-sectarian*.
          *   Rule 2 (Actual Motive): Supported by Case 2 (Slaughter). The court looked behind the ban to see if the "suffering" claim was real or just religious conviction. Supported by Case 5 (Subsidy) - "Tradition" was rejected as a cover for exclusivity.
          *   Rule 3 (Coercion/Participation): Supported by Case 3 (Prayer - coercion to stand/leave) and Case 4 (Uniform - participation).
      *   *Better Rule:* A hybrid. "The State must demonstrate a non-sectarian, evidence-based interest that outweighs the burden on religious practice, and cannot rely on majoritarian religious preference disguised as policy."

  5.  **Drafting Section 2: Predictions & Divergence:**
      *   *Rule 1 (Facial Public Reason):* Uphold. The state *has* stated secular reasons (neutrality, gender equality). Motive doesn't matter. Divergence: Ignores the leaked docs.
      *   *Rule 2 (Actual Motive/Pretext):* Strike Down. The secular reasons are pretextual (leaked docs). Similar to Case 2 (Slaughter) where the "suffering" reason was false/pretext for religious bias.
      *   *Rule 3 (Burden/Coercion):* Split. It's not total coercion (Case 1), but it blocks participation (Case 4). However, Case 4 was about *exemptions*, this is about a *ban*. If the rule is "No exclusion from public life," Strike Down. If the rule is "No physical compulsion," Uphold.
      *   *Divergence Point:* The admissibility and weight of the leaked legislative motive.

  6.  **Drafting Section 3: Best Guess (The Real Rule):**
      *   The Court strikes down laws where the burden falls on minorities *and* the justification is rooted in majoritarian preference or tradition rather than independent evidence.
      *   Case 1 (Vaccination) is the outlier that allows burden, but it had *genuine epidemiological basis*.
      *   Case 2 (Slaughter) is the strongest analog. "Barbaric" = Animus. "Neutrality/ Gender Equality" here = Pretext for Animus.
      *   *Prediction:* Strike Down.
      *   *Reasoning:* The Court consistently pierces the veil when "Tradition" or "Majority Conviction" is the real driver (Case 2, 3, 5). Case 1 is distinguished because the health risk was real. Here, the "neutrality" claim is contradicted by the motive evidence. The Court treats "facially neutral" as insufficient if the *effect* is exclusionary and the *cause* is animus.

  7.  **Drafting Section 4: Closest Analog & Principles/Costs:**
