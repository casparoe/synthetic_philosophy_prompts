      *   *Decision:* The Court seems to follow a "Substantive Neutrality" rule: Laws burdening religion must be justified by independent, non-sectarian evidence, not majoritarian preference or tradition.

  10. **Final Polish:** Ensure the distinction between Case 1 (Vaccination) and the New Case is clear. Vaccination had *genuine* epidemiological basis. New Case has *pretextual* secular basis. This is the pivot point.

