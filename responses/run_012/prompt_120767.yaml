      *   *If Upheld:* Principle = Formal Neutrality. Cost = Minorities lose equal access to public education; Court legitimizes legislative bad faith.
      *   *If Struck:* Principle = Anti-Pretext/Substantive Neutrality. Cost = Court becomes an investigator of legislative motive; potentially destabilizes laws with mixed motives.

  8.  **Drafting Section 5: The Sharpening Case:**
      *   Need a case where Motive is Pure, but Burden is High vs. Motive is Mixed, but Burden is Low.
      *   *Better:* A case where the secular reason is *true* but the legislature *also* had animus. (Mixed Motive).
      *   *Scenario:* A safety ban on headgear (like hard hats) that genuinely improves safety (unlike the uniform case), but legislators also said they hate the religion.
      *   *Rule 1 (Facial):* Uphold (Safety reason exists).
      *   *Rule 2 (Actual Motive):* Strike (Animus was a motivating factor).
      *   *Rule 3 (Burden):* Depends on safety magnitude.
      *   *Selection:* A law with a *genuine* secular benefit (e.g., genuine safety risk) but enacted *solely* to target a minority (they are the only ones affected).
      *   *Wait, let's refine:* To split Rule 1 (Facial Reason) and Rule 2 (Actual Motive).
      *   *Case:* A law banning all headwear in courts for security. Secular reason is valid (security). But legislative record shows they targeted a specific group.
      *   *Rule 1:* Uphold (Valid reason exists).
      *   *Rule 2:* Strike (Motive was animus).
      *   *Actually, the prompt asks for the case that forces surviving rules apart.* The surviving rules are likely "Facial Validity" vs "Anti-Pretext".
      *   *Hypothetical:* A law banning religious jewelry for health hygiene in hospitals. Evidence shows infection risk is real (unlike slaughter case). But legislators admitted they wanted to target a specific group.
      *   *Rule A (Public Reason Exists):* Uphold. The risk is real.
      *   *Rule B (Actual Motive):* Strike. The *reason for enactment* was animus, even if the reason is factually true.

  9.  **Review and Refine:**
      *   Check tone: Is it a bench memo? Yes, needs to be authoritative, concise, analytical.
      *   Check constraints: Did I use external theory? No. Did I summarize briefs? No.
      *   Check the "Tie Break": If underdetermined, say so. I think the record points strongly to "Anti-Pretext" based on Case 2 and 5. Case 1 is distinguishable on evidence.
