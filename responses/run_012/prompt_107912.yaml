  2. The difference principle is best rendered as a leximin ordering on an index of primary goods, since simple maximin fails to rank distributions where the worst-off are equally situated. Accommodating this lexicographic structure requires the social choice apparatus to surrender continuity and representability by a real-valued social welfare function, thereby blocking standard marginal trade-offs below the threshold.
  3. Significant distortion arises in modelling the metric of advantage, as primary goods resist reduction to utility, and the parties' ignorance of specific preference domains conflicts with the common prior assumption. Furthermore, the lexical priority of liberty and the identification of the least advantaged as a social position rather than a point in a type space resist clean formulation within standard models.
  4. Concepts such as publicity, strains of commitment, and stability for the right reasons have no direct counterpart, likely because the apparatus treats stability as equilibrium rather than moral congruence. These omissions suggest such elements perform rhetorical work to secure reflective equilibrium rather than analytical work within a formal mechanism design framework.
  5. The parts that did not survive suggest the apparatus misses normative content regarding moral powers rather than exposing indeterminacy in Rawls's argument. I am moderately confident in this translation overall, though I am least sure whether the lexical priority of liberty can be formalised without collapsing into a constraint set.
