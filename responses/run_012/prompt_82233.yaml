  Defeaters, ranked
  1. **The Creeping Minimalism Collapse (Part 2) — Fatal/Serious.** If embedded predicates characterize states sufficiently to sustain classical logic, they function identically to propositions describing those states. Dreier argues that if your view says everything realism says (truth-apt, logical, knowledge-able), it *is* realism. If Part 2 makes moral predicates truth-conditional in all but name, you haven't solved Frege-Geach; you've surrendered expressivism. This is fatal if your goal is metaphysical distinctness; serious if only semantic. It directly attacks the claim that you are not a descriptivist.

  2. **The Negation/Scope Problem (Part 3) — Serious.** Can you distinguish "I do not disapprove of lying" (absence) from "I disapprove of not-lying" (negation)? If validity is attitudinal coherence, "Lying is wrong" and "Lying is not wrong" are inconsistent only if holding both attitudes is psychologically impossible. But one can coherently withhold judgment. If the inconsistency is normative rather than psychological, you presuppose the normative facts you sought to reduce. This attacks the core mechanism of Part 3 and its ability to handle logical operators.

  3. **Explanatory Vacuity (General) — Awkward.** Does this predict anything rivals don't? If your logic of attitudes must mirror classical logic exactly to be plausible, the "attitude" machinery looks like stipulation added to a propositional skeleton. You gain no predictive leverage over realism, only a different metaphysical gloss. This suggests the view is a redescription rather than a substantive theory. It fails to offer novel empirical or logical predictions, serving instead as a protective belt around non-cognitivism.

  What a defender should concede
  A defender must concede that the distinction between this view and minimalist realism is largely metametaphysical. If truth is thin and logic is classical, the "practical state" ontology does little explanatory work beyond satisfying an antecedent commitment to non-cognitivism. You should concede that Part 2 risks converting the view into a psychological descriptivism unless you can robustly explain how "characterizing a state" differs from "describing a state" without reintroducing propositions. The line is perilously thin; if the characterization supports logical inference, it functions propositionally. Furthermore, concede that Part 3 relies on a normative notion of "coherence" that is not merely psychological consistency; otherwise, valid arguments become relative to individual psychologies. If coherence is objective, you presuppose normative facts. The view survives only by accepting that it is a redescription of realist practices through an expressivist lens, not a rival empirical hypothesis. It buys survival by qualifying "truth" and "validity" until they match realism's outputs, leaving only the metaphysical substrate as the differentiator.

  Immunity check
  Consider the "Coherent Sociopath." Suppose an agent coherently holds the attitudes: "Torture is good" and "If torture is good, do it." Your definition of validity (Part 3) renders this argument valid, as there is no attitudinal inconsistency. Yet, we intuitively treat the conclusion as normatively unsupported because the premise is false, not because the logic holds relative to them. To avoid this, you must claim the attitudes are *objectively* incoherent, which presupposes normative facts (undermining Part 1). Alternatively, consider moral uncertainty: "Lying might be wrong." If meaning is fixed by the attitude expressed (Part 1), what attitude is this? Your view requires treating uncertainty as a complex attitude, but fails to explain why "Lying is wrong" and "Lying might not be wrong" are inconsistent without invoking truth-conditions.

  Verdict
  The view survives technically but buys immunity at the cost of identity. It solves Frege-Geach by becoming quasi-realist, but risks becoming indistinguishable from the realism it opposes.
