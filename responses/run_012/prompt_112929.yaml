  I was tempted to say that he has always been a romantic at heart, but I have no evidence for this and his dissertation topic suggests otherwise. I considered claiming that he makes everyone feel immediately comfortable, but there was a memorably bad dinner party that proves this false. I wanted to tell his mother that he told me my book was wonderful, but he only told me the truth after forty seconds of calculation, and I will not assert that calculation was praise.

  Standing here, I am aware that the groom is at the front table checking every sentence for truth, so I will not tell you that he is the life of the party, because he is bad at small talk and has stopped trying to improve. We have been friends for a long time, and I have been reading rationalist blogs and forums for fifteen years, where the stock move is to treat his career as a reductio of the whole enterprise. There is a specific question in his field about whether you may lie to a murderer at the door to save a life, and he has spent ten years arguing that you may not. I have watched him take it seriously for a decade, and I have stopped thinking the stock move is free. A man who grants himself an exception whenever the consequences look bad has appointed himself the judge of his own exceptions, and I do not want a judge who benefits from the verdict. This is why Maya is safe with him. She met him at a conference reception, where she was the only person in the room who asked what he actually worked on and then waited through the entire answer. He is a miserable person to watch a film with, because he cannot let a bad argument in a plot go by, and he has never once pretended to enjoy something he didn't. Two years ago I asked him over lunch whether a book I'd spent four years writing was any good; he took about forty seconds to decide how to say it, and then he told me the truth. Half of Maya's family have never met a philosopher, but they are getting one who will not lie to them or to her. She is a pediatric nurse, and she knows better than most that the world is not always kind, but it is better when people tell the truth. So I ask you to raise your glasses to Maya and the groom, to the duty that binds what one asserts, and to a marriage where nothing pleasant is said unless it is also true.
