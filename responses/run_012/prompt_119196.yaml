answer: |-
  # Teaching Plan: The Anthropics Fork (SSA vs. SIA)

  ## I. Critique and Repair of the Carrying Example

  **Verdict:** Your drafted example must be replaced.

  **Diagnosis:** Your sentence—"You are equally likely to be any of the people who were created"—is not a neutral setup; it is a direct assertion of the Self-Indication Assumption (SIA). It begs the question. If you tell the audience to assume they are a random sample from all *created* people, you have already forced the SIA conclusion (Tails is 1000x more likely). SSA proponents do not grant that premise; they argue you should reason as if you are a random sample from the *actual* observers in the world you occupy, which, if existence is guaranteed in both outcomes, yields a 50/50 split. Your example collapses the fork before the audience sees it.

  **The Replacement: The Incubator (Bostrom's God's Coin Toss)**
  *   **Setup:** A fair coin is tossed.
      *   **Heads:** One room is created, containing one observer (you).
      *   **Tails:** Two rooms are created, containing two observers (you and a duplicate).
      *   **Condition:** All rooms are indistinguishable. You wake up in a room. You know the setup.
  *   **Question:** What is your credence that the coin landed Heads?
  *   **Why this works:**
      *   **What it needs:** It requires *indistinguishability* (no indexical clues like "I am in Room 1") to force reliance on anthropic principles. It requires *contingent existence* (on Heads, the second observer never exists) to drive a wedge between SSA and SIA.
      *   **What it must lack:** It must lack any external evidence about the coin. It must lack any distinguishing features between the observers (no "I am the original" tags).
      *   **The Divergence:**
          *   **SIA:** Weights worlds by the number of observers. Tails has 2 observers, Heads has 1. You are twice as likely to exist in Tails. Credence in Heads = 1/3.
          *   **SSA:** Conditions on the set of actual observers in the world. In the Heads world, you are the only observer (probability 1). In the Tails world, you are one of two (probability 1/2). Combined with the 50/50 coin, this yields Credence in Heads = 2/3 (Wait, standard SSA on Incubator usually yields 1/2 if existence is treated as background, but often 2/3 if treated as sampling. Let's simplify for the session).
          *   *Correction for Clarity:* To ensure a clean 1/2 vs 2/3 (or 1/3) split, use the **Standard God's Coin Toss**:
              *   **Heads:** 10 people created in 10 rooms (1–10).
              *   **Tails:** 100 people created in 100 rooms (1–100).
              *   **Evidence:** You find you are in Room 1.
              *   **SSA:** Favors Heads (1/10 chance of being Room 1 vs 1/100).
              *   **SIA:** Favors Tails (100 observers vs 10 observers).
              *   **Result:** They pull in opposite directions. This is the cleanest fork.

  **Decision:** Use the **Standard God's Coin Toss** (Heads=10 people, Tails=100 people, You are in Room 1) as the carrying example. It generates immediate conflict.

  ---

  ## II. Sequence of Components (120 Minutes)

  ### Hour 1: The Fork and the Principles

  **1. Introduction: Self-Locating Belief (10 mins)**
  *   **Content:** Distinguish *propositional* belief ("The coin is Heads") from *self-locating* belief ("I am the person in Room 1").
  *   **Dependency:** Must come first. Without distinguishing "what is true" from "where I am in truth," the rest is gibberish.
  *   **Misconception Check:** Head off "This is not real credence." Assert immediately: "We are treating 'I am here' as evidence that updates probabilities, just like 'The light is red'."

  **2. The Carrying Example: God's Coin Toss (15 mins)**
  *   **Content:** Present the 10 vs. 100 Rooms scenario. Ask for intuitive votes.
  *   **Dependency:** Provides the shared concrete object for all subsequent abstraction. Do not define SSA/SIA yet; let the intuition conflict arise first.

  **3. Deriving SIA (The Presumptuous Philosopher) (15 mins)**
  *   **Content:** Define SIA: "Reason as if you are a random observer from the set of all *possible* observers." Apply to Example: Tails has 10x observers, so Tails is 10x more likely.
  *   **Dependency:** Easier to grasp first. It aligns with the "You are equally likely to be anyone" intuition from your original draft.
  *   **Misconception Check:** Head off "SIA means you are special." Clarify: "SIA means you are *generic*. It assumes you are a random sample from the multiverse of observers, which makes populous worlds more likely."

  **4. Deriving SSA (The Doomsday Argument) (15 mins)**
  *   **Content:** Define SSA: "Reason as if you are a random observer from the set of *actual* observers in your world." Apply to Example: If Heads, Room 1 is common (1/10). If Tails, Room 1 is rare (1/100). Heads is favored.
  *   **Dependency:** Requires the Example to show why SSA opposes SIA. SSA is harder to motivate without the "Room 1" evidence.
  *   **Misconception Check:** Head off "Doomsday is a fallacy." Explain: "It is valid *if* you accept SSA. The dispute is the premise, not the math."

  **5. The Reference Class Problem (20 mins)**
  *   **Content:** SSA requires a reference class. Are you sampling from "Humans"? "Conscious beings"? "Beings with my exact memories"? If the class is "Beings with my exact memories," SSA collapses (only one of me exists). If "Humans," Doomsday runs.
  *   **Placement Defense:** This comes *after* SSA is defined but *before* Doomsday is fully evaluated.
      *   *Why not earlier?* It is too abstract without SSA to anchor it.
      *   *Why not later?* You cannot evaluate the Doomsday Argument (the main application of SSA) without knowing which class makes it run. If you leave this until the end, the audience thinks Doomsday is a proven result rather than a conditional one.
      *   *Dependency:* SSA is formally incomplete without a reference class. You cannot compare SSA and SIA fairly until the audience sees that SSA has a "knob" (the class) that SIA lacks.

  ### Hour 2: Stress Tests and Boundaries

  **6. Misconception Map & Extension (15 mins)**
  *   **Content:** Explicitly review the four misconceptions (plus extensions).
  *   **Placement:** Now that they have seen the mechanics, they can recognize the errors.
  *   **Extensions to Add:**
      *   *Decision Theory:* "SSA/SIA are about *belief*, not *action*." (Sometimes they yield the same bets).
      *   *Exhaustiveness:* "SSA and SIA are not the only options." (Mention Full Non-indexical Conditioning or Compromise views briefly).

  **7. Sleeping Beauty: The Test Case (25 mins)**
  *   **Strategy:** Hold it back as a late test case. Do not use it as the carrying example.
  *   **Reasoning:** Sleeping Beauty is emotionally charged and technically distinct (memory loss vs. observer creation). If used early, the debate becomes about memory, not anthropics.
  *   **Handling the Mismatch:**
      *   Acknowledge: "Thirder" roughly maps to SIA; "Halfer" roughly maps to SSA.
      *   Caveat: "This mapping is not identity. Some Halfers use SSA; some use different reasoning. Do not treat the labels as synonyms."
      *   **Activity:** Ask the room to solve Beauty using the SSA/SIA definitions they just learned. This reveals if they understand the *principles* or just memorized the *labels*.

  **8. Closing: The Diagnostic Question (10 mins)**
  *   **Content:** The single question (see below).
  *   **Refusals:** The open admissions (see below).

  ---

  ## III. The Misconception Map

  | Misconception | Correction | Where to Head It Off |
  | :--- | :--- | :--- |
  | **"Self-locating credence is confusion."** | It is standard Bayesian updating where the evidence includes indexicals ("I am here"). | **Intro.** Frame it as "Evidence includes who/where you are." |
  | **"SIA means you are special/the universe is for you."** | SIA implies you are *generic*. It favors big universes because there are more "slots" for a generic observer like you. | **During SIA Derivation.** Emphasize "Random Sample from Possibility." |
  | **"Doomsday is a probabilistic fallacy."** | It is mathematically valid *given* SSA. The attack must be on the Reference Class or SSA itself. | **During SSA/Doomsday.** Separate the *inference* from the *premise*. |
  | **"SSA and SIA exhaust the options."** | There are hybrid views (e.g., SSA-SIA compromise) and non-indexical approaches. | **Closing.** Refuse to resolve which is true; frame them as poles of a spectrum. |
  | **"This is only about cosmology."** | It applies to quantum mechanics (Everett), simulation hypotheses, and AI alignment. | **Intro or Closing.** Broaden the scope to show relevance to Physics/Stats. |

  ---

  ## IV. Sleeping Beauty Strategy

  **Decision:** **Hold it back as a late test case.**

  **Reasoning:**
  1.  **Distraction:** The memory-wipe aspect introduces confounding variables (credence vs. betting odds) that distract from the pure observer-counting logic of SSA/SIA.
  2.  **Mapping Nuance:** While Thirder ≈ SIA and Halfer ≈ SSA is the standard heuristic, it is not perfect. Some Halfers accept SIA but reject the relevance of the awakening count. Using it as the *primary* example risks teaching the mapping as an identity.
  3.  **Pedagogical Flow:** You need the audience to understand SSA/SIA *before* they can apply it to Beauty. If you start with Beauty, they will argue about the coin, not the anthropics.

  **Instruction:**
  Present Beauty *after* the Reference Class discussion. Ask: "If you are an SSA-er, are you a Halfer? If you are an SIA-er, are you a Thirder?" When they say yes, press them: "Why? Show me the observer count." This forces them to translate the Beauty problem into the God's Coin Toss framework, verifying their understanding of the principles rather than the folklore.

  ---

  ## V. Closing: The Diagnostic and The Refusal

  **The Diagnostic Question:**
  Do not ask "Which assumption is true?" (They will guess). Do not ask "What is the answer to Doomsday?" (They will hedge).
  **Ask this:**
  > "If you reject the Presumptuous Philosopher because it allows armchair cosmology, are you logically committed to accepting the Doomsday Argument's prediction of early extinction? Or is there a third exit?"

  *   **Why:** This forces them to acknowledge the *trade-off*. SSA kills the Presumptuous Philosopher but births Doomsday. SIA kills Doomsday but births the Presumptuous Philosopher. If they claim they can reject both without cost, they haven't understood the dependency.

  **The Open Refusals:**
  You must refuse to solve the problem, or you will be bogged down in metaphysics. Use this wording:

  > "I am not going to tell you which assumption is true, and I am not going to tell you how to define the reference class.
  >
  > Why? Because at this level, we are mapping the *structure* of the inference, not settling the *metaphysics* of personhood. If we try to solve the Reference Class Problem now, we will spend two hours debating what counts as a 'person' and zero hours debating how probability works.
  >
  > Take the fork home with you. Your job is not to choose the right path today, but to ensure that whenever you use anthropic reasoning in your research, you know which path you are walking."

  **Why this wording:** It validates their frustration (there is no answer) while elevating the session's goal (structural literacy vs. doctrinal conversion). It prevents the feeling of a "cheat" by framing the ambiguity as a feature of the field, not a failure of the lecture.
