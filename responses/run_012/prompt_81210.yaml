prompt: |-
  Next month I'm presenting at a small workshop on democratic theory — half political theorists, half people who do judgment aggregation with actual math — and I need a Q&A prep sheet, badly, because I've been working on this position alot in a bubble and I genuinely don't know where it's weakest. Here's the thesis I'm defending. The Condorcet jury theorem is usually put as: if every voter is independently more likely than not to get the answer right, then majority rule's probability of being right tends to one as the electorate grows. I want to argue that both of those standard assumptions cut at the wrong joints. The condition that actually does the work, I claim, is something I'm calling residual informativeness: each voter's vote has to carry some information about the truth that isn't already contained in the other votes — formally, it has to shift the conditional probability of the state given everyone else's votes. Once you state the theorem that way, I claim three things follow: (a) the independence assumption stops being a substantive requirement and becomes bookkeeping; (b) majority rule still converges under conditions much weaker than "everyone is uniformly better than a coin flip"; and (c) the usual panic about correlated errors from shared media and herding is mostly misplaced, since what matters isn't correlation as such but whether the marginal voter still carries any information. I'm fairly confident about (a) and (b), and I have a nagging feeling (c) is where I'll get killed.

  The room is small but rough: two formal people who know the aggregation literature inside out and will demand a counterexample the instant I say correlation doesn't matter; a political theorist whose whole project is that majority rule's authority is about legitimacy and equal respect and who thinks epistemic defenses of democracy are basically a category error; an empirical political scientist who studies voter knowledge and polarization and will ask how on earth you'd measure residual informativeness in a real electorate; and possibly a legal scholar who cares about jury instructions and hung juries and will reframe everything in those terms. What I want is the eight or so objections I'll actually get from these people — not the ones I'd get from a LessWrong meetup, where everyone would just argue about whether the theorem even needs a truth-tracking account of voting. Order them by how much damage they'd do, phrase each one the way that specific person would actually phrase it (the formal folks want a definitional objection or a counterexample, the theorist will make it about legitimacy, the empiricist will make it about measurability, the legal scholar about juries), give me a two-minute spoken reply to each, and flag where the reply is soft or where I'm quietly bluffing. Tell me what to concede up front to buy credibility and what to hold firm on.

  You're a philosopher of social science who works on both social choice and formal epistemology, so please think carefully and don't hand me generic "have you considered dependence?" objections — I need the real fault lines, not the ones I already have answers to. Start by brainstorming, on the page, where the load-bearing assumptions of my position actually are and which of my three claims is doing the most work, then build the prep sheet off that. And please seperate out the one question I'm praying nobody asks, with a straight answer to it.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A political theorist/philosopher presenting at a mixed workshop (political theory + formal social choice/judgment aggregation).
      *   **Topic:** Reinterpreting the Condorcet Jury Theorem (CJT) via "Residual Informativeness" (RI) rather than Independence + Competence (>0.5).
      *   **Claims:**
          1.  Independence is just bookkeeping (not substantive).
          2.  Convergence holds under weaker conditions than uniform competence >0.5.
          3.  Correlated errors/herding aren't fatal if RI remains.
      *   **Audience:**
          *   2 Formalists (Social Choice/Math) - looking for counterexamples/definitional rigor.
          *   1 Political Theorist (Legitimacy/Respect) - skeptical of epistemic democracy.
          *   1 Empirical Political Scientist (Polarization/Measurement) - skeptical of operationalization.
          *   1 Legal Scholar (Juries/Hung Juries) - practical institutional application.
      *   **Task:** Create a Q&A prep sheet with ~8 objections ordered by damage potential, phrased authentically for each audience member, with 2-minute spoken replies, flagging weak spots/bluffs, and advice on concessions. Plus, identify the "One Question I'm Praying Nobody Asks."
      *   **Persona:** Philosopher of social science (social choice + formal epistemology).

  2.  **Deconstruct the Thesis (Brainstorming Load-Bearing Assumptions):**
      *   *Core Idea:* The user is essentially proposing a generalization of CJT where $P(Correct | Vote_i, Votes_{-i}) \neq P(Correct | Votes_{-i})$. This looks like a conditional independence relaxation.
      *   *Claim (a) Independence is bookkeeping:* This is risky. Independence in CJT isn't just about information; it's about the *structure* of the error terms. If errors are correlated *because* of a common cause (e.g., misleading evidence), RI might drop to zero even if individuals feel informed.
      *   *Claim (b) Weaker than >0.5:* This is standard in generalized CJT literature (e.g., Ladha, Berend & Sapir). The "average competence" or "mean competence" often suffices if variance is controlled. This is defensible but needs precise conditions.
      *   *Claim (c) Correlation/Herding:* This is the weak point. If voters herd, they are explicitly *ignoring* private signals in favor of public history. This destroys RI by definition. The user claims correlation *as such* doesn't matter, but herding *causes* loss of RI. The distinction is subtle.
      *   *The "Truth" Assumption:* CJT assumes a binary state of the world ($X$ or $\neg X$). Many political decisions aren't truth-apt in this way (values vs. facts).
      *   *Common Priors:* CJT usually assumes common priors. If priors diverge wildly (polarization), RI behaves differently.

  3.  **Identify the "One Question I'm Praying Nobody Asks":**
      *   What kills epistemic democracy arguments? The "Common Good" problem.
      *   What kills *this* specific formal argument? The definition of "Truth."
      *   *Candidate:* "If the state of the world is endogenous to the vote, your probability space is ill-defined." (Too technical?)
      *   *Candidate:* "How do you define 'Right' without a God's eye view?" (Too philosophical/Theorist?)
      *   *Best Candidate:* "Does your RI condition implicitly require a common prior, and if so, doesn't that rule out the very pluralism democracy is meant to handle?" This hits the formal requirement vs. political reality gap.
      *   *Alternative Best Candidate:* "If RI is the condition, isn't that just tautological? You've defined 'informative vote' as 'vote that adds information.' Of course adding information helps. What generates the information?"
      *   *Selection:* The Tautology/Definition objection. If RI is defined as "shifts conditional probability," then saying "RI leads to truth tracking" is almost analytic. The real work is showing RI *exists* in real democracies. But the *killer* question is about the **Common Prior**. If voters have different priors, "Truth" becomes relative to the prior. CJT collapses without common priors.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Formalist 1 - The Counterexample):* Focus on Claim (c). Correlated errors *do* kill RI. Example: Shared misleading evidence.
      *   *Objection 2 (Formalist 2 - The Tautology):* Focus on Claim (a). Is RI just a restatement of independence? If you define it post-hoc, is it useful?
      *   *Objection 3 (Empiricist - Measurement):* Focus on Claim (c). How do we measure RI in polarized electorates?
      *   *Objection 4 (Political Theorist - Normativity):* Why does truth matter? Legitimacy comes from procedure, not outcome.
      *   *Objection 5 (Legal Scholar - Juries):* Deliberation changes the math. CJT assumes no talk; juries talk.
      *   *Objection 6 (Formalist 1 - Common Priors):* The hidden assumption.
      *   *Objection 7 (Empiricist - Competence):* Competence isn't fixed. It's endogenous.
      *   *Objection 8 (Political Theorist - Values):* Not all votes are about facts.

      *Refining for Damage:* The Formalist counterexample on correlation is the most damaging to the core math. The Common Prior objection is the most damaging to the applicability. The Theorist's "Category Error" is the most damaging to the project's value.

      *Let's select the top 8 based on "Damage":*
      1.  Formalist: The "Shared Evidence" Counterexample (Kills Claim C).
      2.  Formalist: The Tautology Charge (Kills Claim A).
      3.  Formalist/Epistemologist: The Common Prior Problem (The Hidden Assumption).
      4.  Empiricist: Operationalizing RI (Measurement).
      5.  Political Theorist: The Category Error (Legitimacy vs. Truth).
      6.  Political Theorist: Value Pluralism (No "Right" Answer).
      7.  Legal Scholar: Deliberation vs. Aggregation (The Mechanism).
      8.  Empiricist: Endogenous Competence (Polarization).

  5.  **Drafting Replies & Flagging Bluffs:**
      *   Need to be honest about where the user is bluffing.
      *   *Bluff Zone:* Claiming correlation doesn't matter. It *does* if it stems from common causes that swamp private signals.
      *   *Bluff Zone:* Claiming RI is easy to measure. It's not.
      *   *Concession:* Must concede that RI is necessary but maybe not sufficient without some baseline competence structure. Must concede that "Truth" is tricky for value judgments.

  6.  **Developing the "One Question":**
      *   As decided, the Common Prior issue is the technical killer. But the "What is Truth?" question is the philosophical killer. Given the audience mix, the **Common Prior** question is the one that exposes the formal fragility while sounding like a technicality. Actually, the *Tautology* objection is more devastating to the *contribution*. "You've just renamed Independence."
      *   *Decision:* The "Tautology/Ex Post" question. If RI is defined by the *actual* shift in probability, you can only calculate it after the fact. A theorem needs ex-ante conditions.

  7.  **Review against Constraints:**
      *   Persona: Philosopher of social science (social choice + formal epistemology).
      *   Tone: Rigorous, candid, strategic.
      *   Format: Brainstorming first, then Prep Sheet, then The One Question.
      *   Specifics: 2-minute spoken replies. Flag soft spots.

  8.  **Final Polish:**
      *   Ensure the distinction between "Independence" (statistical) and "Residual Informativeness" (informational) is clear.
      *   Make sure the replies sound like spoken language, not written prose.
      *   Check the "Concede/Hold" advice.

  *(Self-Correction during drafting)*: I need to make sure I don't validate the user's claim (c) too much. The prompt says they have a nagging feeling (c) is where they'll get killed. I need to confirm that intuition. Correlated errors *usually* imply a common cause which *usually* reduces residual informativeness. The user's claim that "correlation as such doesn't matter" is technically true (only the conditional probability matters) but practically misleading because correlation is the *mechanism* by which RI is lost. I need to help them navigate that nuance.

  *(Refining the "One Question")*: The most devastating question is: "Is Residual Informativeness an ex-ante condition or an ex-post description?" If ex-post, the theorem is useless for institutional design. If ex-ante, how do you specify it without reverting to independence/competence assumptions? This cuts the heart of the contribution.

