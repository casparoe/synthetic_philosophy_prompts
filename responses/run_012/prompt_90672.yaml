answer: |-
  The debate over the locus of know-how divides philosophers into internalists, who locate knowledge within the agent's cognitive architecture, and externalists (or relationalists), who locate it within the agent's dynamic coupling with their environment. The first view (Internalism) treats know-how as a stable possession, akin to a property of the soul or brain. The second view (Relationalism) treats know-how as an emergent property of a system comprising the agent, tools, and context.

  ### The Silent Practitioner and the Chattering Theorist

  Consider first the skilled practitioner who cannot articulate her actions (tacit knowledge). The Internalist account handles this naturally: the knowledge is a non-propositional disposition. It resides in the neural and muscular configurations of the agent, which operate independently of linguistic centers. The silence is evidence that the knowledge is not a hidden set of instructions waiting to be translated, but a distinct kind of state altogether.

  The Relationalist agrees that the knowledge is non-propositional but offers a different explanation for the silence. On this view, the agent cannot speak the knowledge because the knowledge *is* the interaction with the world, not a representation of it. The silence is not just a lack of translation; it is the absence of a corresponding internal object to translate. While both accounts accommodate tacit knowledge, the Relationalist offers a richer explanation for *why* articulation often degrades performance: speaking shifts the agent's focus from the environmental coupling to internal monitoring, disrupting the very relation that constitutes the know-how.

  Now consider the theorist who can recite a procedure perfectly but cannot perform it. For the Internalist, this is the definitive proof of the distinction: the theorist possesses the *knowing-that* (propositional states) but lacks the *knowing-how* (dispositional states). The failure is internal; the engine is missing. For the Relationalist, the failure is not merely a missing internal engine but a lack of integration. The theorist has the map but is not coupled to the terrain. While both views distinguish the two cases effectively, the Relationalist better explains why the theorist often fails even when given the tools: they do not know how to *inhabit* the tools, only how to describe them.

  ### Constitution vs. Conditions of Exercise

  Are these views genuine rivals, or do they answer different questions? The Internalist might argue they are describing the *constitution* of the state, while the Relationalist describes the *conditions of its exercise*. If this were true, the dispute would be merely semantic: the Internalist admits you need water to swim, and the Relationalist admits you need a brain to couple.

  However, substantive disagreement remains because the Relationalist claims the environment is *constitutive*, not merely facilitative. To the Internalist, the surgeon's scalpel is a condition for exercising knowledge that resides in the surgeon's mind. To the Relationalist, the scalpel is part of the cognitive system that constitutes the knowledge. If the scalpel is removed, the Internalist says the knowledge remains (blocked); the Relationalist says the knowledge system has been dismantled. This is an ontological dispute about the boundaries of the mind. If the Relationalist is correct, the Internalist is committing a "location error," mistaking a node in a network for the network itself.

  ### The Distinction Between Know-How and Know-That

  Does the Relational view collapse know-how into knowing-that? If know-how is a relation to the world, is it not just knowing *that* certain relations afford success?

  Test this with a written procedure any competent reader could follow. The Internalist says following this is knowing-that (applying rules). The Relationalist agrees: this is a weak coupling, easily transferable, lacking the deep integration of skill. Now test a specialized tool only a competent user can operate (e.g., a blowpipe for glassblowing). The Internalist says the skill is in the user; the tool is passive. The Relationalist says the tool actively shapes the cognitive process; the skill is in the user-tool interface.

  The Relational view does not collapse the distinction but relocates it. Knowing-that becomes a relation of representation (matching mind to world), while knowing-how becomes a relation of engagement (matching action to affordance). However, the risk for the Relationalist is that if *any* successful coupling counts as know-how, the distinction blurs. They must argue that know-how requires a specific kind of robust, adaptive coupling, whereas knowing-that requires only accurate representation. The Internalist preserves the distinction more cleanly by keeping the categories within the agent (disposition vs. belief), but at the cost of isolating the agent from the world where the action happens.

  ### Awkward Phenomena: Degrees and Collectives

  Two phenomena pose significant challenges, particularly for Internalism.

  First, know-how appears to come in degrees (novice to master), while knowing-that is often treated as binary (one either knows *p* or does not). The Internalist must explain degrees of disposition, which is plausible but awkward (how much disposition is enough?). The Relationalist handles this effortlessly: couplings vary in tightness, robustness, and range. A master has a more resilient and flexible coupling with the environment than a novice. The degrees are not in the head, but in the quality of the fit between agent and world.

  Second, consider the crew that can row a boat where no single member can do so alone. This is catastrophic for strict Internalism. If know-how resides in the individual, the crew possesses no know-how that is not reducible to the sum of individual know-hows. Yet the boat moves only through coordination that no individual possesses. The Internalist must posit a "group agent" or reduce the collective skill to individual communication skills, both of which feel like evasions. The Relationalist thrives here. The know-how resides in the system: the rowers, the oars, the boat, and the water. The system possesses capacities the components lack. This is not metaphorical; on the Relational view, the cognitive boundary extends to the crew.

  ### Conclusion

  I would defend the **second answer (the Relational/Externalist view)**. It offers a more empirically adequate account of expertise, which is invariably situated, tool-dependent, and often collective. It dissolves the mystery of how mind meets world by positing that skilled knowledge already spans the gap.

  The single case that does the most damage to the **Internalist view (the one I reject)** is the **collective crew case**. If know-how is strictly an internal state of the individual agent, it is impossible to account for the genuine skill of a team that exceeds the sum of its parts without resorting to mystical group minds or reductionism. The Internalist is forced to say the crew doesn't *really* know how to row the boat together, only that individuals know how to pull oars in sync. This contradicts our deepest intuitions about collaborative expertise and renders the Relationalist's systemic account the only viable explanation for distributed competence.
