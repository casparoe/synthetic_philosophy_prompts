prompt: |-
  When philosophers distinguish knowing how to do something from knowing that something is the case, they usually leave open where the know-how is supposed to reside. I want the two main answers compared.

  The first answer puts it in the knower. To know how to swim, on this view, is to possess an ability constituted by states and dispositions of the agent — a practical grasp that survives changes in circumstance and is lost only when something changes in the agent. A paralysed swimmer still knows how to swim, much as a locked door is still a door: the knowledge is blocked rather than diminished.

  The second answer puts it in the relation between knower and world. On this view, know-how is a standing relation between an agent and a situation that affords the activity, and it is carried partly by instruments, layouts, routines, and other people. Strip away the surgeon's theatre, the navigator's stars, or the rower's crew, and the know-how itself is diminished rather than merely prevented from being exercised.

  Please compare the two. Address at least the following: which gives the better account of the skilled practitioner who cannot say what she is doing, and whether that fact is evidence for either side; which gives the better account of the person who can recite a procedure perfectly and still cannot perform it; whether the two are genuine rivals or answers to different questions — the constitution of a state versus the conditions of its exercise — and if the latter, what of substance remains in dispute; whether the second answer collapses the distinction between knowing how and knowing that or merely relocates it, taking as your test cases a written procedure that any competent reader could follow and a tool that only a competent user can use; and what each answer makes of two awkward phenomena, namely that know-how appears to come in degrees while knowing-that does not, and that a crew can do something none of its members can do alone. Conclude by saying which answer you would defend and naming the single case that does the most damage to the one you reject.
reasoning: |-
  Here's a thinking process that leads to the comparison and conclusion:

  1.  **Deconstruct the Prompt:**

      *   **Topic:** The distinction between "knowing-how" (procedural knowledge) and "knowing-that" (propositional knowledge), specifically focusing on *where* know-how resides.
      *   **View 1 (Internalist/Ability View):** Know-how resides *in the knower*. It's a state/disposition of the agent. (Analogy: Paralyzed swimmer still knows how).
      *   **View 2 (Externalist/Relational View):** Know-how resides in the *relation between knower and world*. It's distributed across tools, environment, others. (Analogy: Surgeon without theatre loses know-how).
      *   **Required Comparison Points:**
          1.  The skilled practitioner who cannot articulate their actions (tacit knowledge).
          2.  The person who can recite procedures but cannot perform them (intellectual vs. practical).
          3.  Rivalry vs. Different Questions (Constitution vs. Conditions of Exercise). If the latter, what remains in dispute?
          4.  Collapse of Know-How/Know-That distinction? (Test cases: Written procedure vs. Specialized tool).
          5.  Two awkward phenomena: Degrees of know-how vs. binary knowing-that; Collective know-how (crew > sum of members).
          6.  **Conclusion:** Defend one view and name the single most damaging case against the rejected view.

  2.  **Analyze View 1 (Internalist/Ability):**
      *   *Core:* Know-how is an internal capacity/disposition.
      *   *Strengths:* Explains why we attribute knowledge to people even when they can't act (paralysis). Aligns with intuition that *I* know, not *we + environment*.
      *   *Weaknesses:* Struggles with distributed cognition. Struggles to explain why environment feels constitutive, not just facilitative.

  3.  **Analyze View 2 (Externalist/Relational):**
      *   *Core:* Know-how is an agent-world coupling.
      *   *Strengths:* Explains situated action. Explains why expertise is context-dependent. Handles collective agency well.
      *   *Weaknesses:* Risks making knowledge too fragile (lose the tool, lose the knowledge?). Risks collapsing know-how into just successful interaction.

  4.  **Drafting the Comparison - Point by Point:**

      *   **Tacit Knowledge (Skilled but silent):**
          *   *View 1:* Fits well. The state is non-propositional. It's a motor disposition, not a sentence in the head.
          *   *View 2:* Also fits. The coupling doesn't require linguistic mediation. The environment "speaks" to the agent.
          *   *Verdict:* View 1 might have a slight edge on *why* it's ineffable (it's internal structure), but View 2 explains *how* it works without speech (affordances). Actually, View 1 is the standard Rylean response to intellectualism. View 2 adds that the silence is because the knowledge *is* the interaction, not a representation.

      *   **The Theorist who can't do (Recites but fails):**
          *   *View 1:* Clear distinction. They have the *knowing-that* (propositions) but lack the *knowing-how* (disposition/ability).
          *   *View 2:* Clear distinction. They lack the specific coupling with the world. They have the map, not the terrain engagement.
          *   *Verdict:* Both handle this well, but View 1 is the classic definition of the distinction. View 2 explains the failure as a lack of environmental integration.

      *   **Rivalry vs. Different Questions (Constitution vs. Exercise):**
          *   *Argument:* View 1 says "What is the knowledge?" (Internal state). View 2 says "Where does the knowledge live?" (System).
          *   *Substance:* If View 2 is right, View 1 is incomplete. It's not just conditions of exercise; the environment is *constitutive*. If I need the lighthouse to navigate, the lighthouse is part of the knowledge system.
          *   *Verdict:* They are genuine rivals regarding *ontology*. Is the mind bounded by the skull or the skin?

      *   **Collapse of Know-How/Know-That?**
          *   *Test 1 (Written Procedure):* Anyone can follow. Is this know-how? View 1: No, that's following rules (knowing-that). View 2: If the coupling works, it's a form of distributed know-how, but maybe shallow.
          *   *Test 2 (Specialized Tool):* Only competent users can use. View 1: Tool is external aid. View 2: Tool is part of the cognitive system.
          *   *Risk:* View 2 risks making all successful action "know-how." But if the relation is specific, it preserves the distinction. View 1 preserves the distinction by keeping it internal.
          *   *Verdict:* View 2 relocates the distinction (system success vs. rule following) rather than collapsing it, provided "relation" implies skillful engagement, not just causal contact.

      *   **Awkward Phenomena:**
          *   *Degrees:* Knowing-that is often treated as binary (True/Justified/Belief). Know-how is gradable (novice to expert).
              *   View 1: Dispositions come in degrees (strength, flexibility).
              *   View 2: Couplings come in degrees (tightness, robustness).
              *   *Edge:* View 2 handles context-sensitivity of degrees better (expert in one context, novice in another).
          *   *Collective Know-how:* Crew rows, no single member can row the boat alone.
              *   View 1: Struggles. Must posit a group agent or reduce to individual coordination abilities.
              *   View 2: Thrives. The system *is* the crew + boat + water. The knowledge resides in the collective coupling.
              *   *Edge:* View 2 wins decisively here.

  5.  **Formulating the Conclusion:**
      *   *Choice:* I need to pick one. The Externalist/Relational view (View 2) is more robust for modern cognitive science and social epistemology, but the Internalist view (View 1) aligns better with legal/moral responsibility and intuition about identity.
      *   *Decision:* I will defend View 2 (Relational/Externalist) because it handles the *collective* and *degrees* issues much better, which are critical for real-world expertise.
      *   *Damaging Case against View 1:* The "Crew" case (Collective Know-how). If know-how is strictly internal, a crew's ability is inexplicable without positing a mystical group mind or reducing it to individual inputs which aren't sufficient.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "Constitution vs. Exercise" point clearly? I need to make sure I don't just say "they are different." I need to argue that View 2 claims the environment is *constitutive*, not just a condition.
      *   *Check:* The "Collapse" point. Does View 2 make knowing-how just knowing-that about relations? I need to ensure I argue that the *relation* is non-propositional.
      *   *Check:* The paralyzed swimmer. View 2 says their know-how is *diminished*. This is counter-intuitive. I need to acknowledge this tension. View 2 argues that without water, the *specific* know-how of swimming doesn't exist, only the potential to re-couple.

  7.  **Final Polish:** Ensure tone is philosophical, precise, and directly answers the prompt's specific constraints. (e.g., "Conclude by saying which answer you would defend...")

      *(Self-Correction on the "Damaging Case"):* The prompt asks for the case that does the most damage to the *rejected* view. If I defend View 2, I must name the case that damages View 1. The "Crew/Collective" case is the strongest against Internalism.

      *(Self-Correction on "Degrees"):* Knowing-that *does* come in degrees (understanding depth), but traditionally it's treated as binary (S knows p). I should acknowledge this nuance but stick to the prompt's framing that know-how *appears* to come in degrees more obviously.

  8.  **Final Structure:**
      *   Introduction: Define the two views (Internalist vs. Relational).
      *   Tacit Knowledge & The Theorist.
      *   Rivalry vs. Different Questions.
      *   Collapse of Distinction (Procedure vs. Tool).
      *   Awkward Phenomena (Degrees & Collective).
      *   Conclusion: Defense + Damaging Case.

  9.  (Drafting content based on these thoughts...) *Ensure the distinction between the paralyzed swimmer (View 1) and the surgeon without theatre (View 2) is woven through.*

      *Wait, one nuance:* The prompt asks about the "person who can recite a procedure perfectly." This is the classic "intellectualist legend" Ryle attacked. View 1 handles this by saying they lack the disposition. View 2 handles this by saying they lack the coupling. I need to make sure I don't just say "both handle it." I need to compare *how*. View 1 says they lack an internal state. View 2 says they lack a worldly connection.

      *Refining the "Constitution vs Exercise" point:* If View 1 is right, View 2 is describing *performance conditions*. If View 2 is right, View 1 is describing a *phantom internal residue*. This is the crux of the dispute.

      *Refining the "Collapse" point:* If know-how is a relation, is it just knowing-that the relation exists? No, because it's a *practical* relation. But View 1 worries View 2 makes knowledge too public. View 2 worries View 1 makes knowledge too ghostly.

