prompt: |-
  Ok I need help writing a document for a weird situation. Two friends of mine have been arguing for about two years about what probability actually IS and they keep talking past each other, and I want to force them to produce the thing they should've written a year ago: the joint statement of an adversarial collaboration they could both actually sign.

  Here's who they are. One is a hardline frequentist — probability just is the long-run relative frequency in some reference class, full stop, and he thinks talk of "the probability of this single event" is either a disguised frequency claim or a category error. The other is a thoroughgoing subjectivist, a de Finetti / coherent-degrees-of-belief type — probability is just a coherent degree of belief, and "objective chance" is either a fiction or a convenient posit you're welcome to if it helps you bet. (There's also a third view floating around, the propensity one, where chances are real dispositions of single setups — they both kind of roll their eyes at it, but I don't want it strawmanned, because I think it's the thing that's actually tempting them both.)

  The case I want them to have to reckon with, and I made it up specifically so neither can just recite their usual lines: imagine a machine that's going to produce exactly one outcome, and then the only copy of it is destroyed. Never runs again. Before it runs, an engineer tells you the internal mechanism is built around a physically symmetric part, so there's a symmetry argument (the indifference-style one, applied to a fair physical setup) that pushes you toward 1/2 on each of two outcomes. There is no reference class of repeats — the class of "runs of this machine" has exactly one member, and it hasn't happened yet. Then add a second twist: suppose the machine is actually deterministic underneath, a chaotic but fully deterministic system. Does anything about the probability claim change?

  So: write the joint statement. What I want in it —

  A numbered section of agreed claims: what both of them can sign about what probability-talk is doing, what needs explaining, what the reference-class problem does and doesn't show, what they both think the symmetry argument is and isn't entitled to. Make these real claims, not mush — nothing that's true only because it's vague.

  Then a table of the disagreements, where each side's position is phrased in wording that side would actually accept for itself (not a parody of it, and not secretly slanted toward the other guy).

  Then the cruxes — the sub-questions such that settling one would actually move at least one of them. I suspect one crux is whether single-case probability claims have mind-independent truth conditions at all, and another is whether the symmetry/indifference move is a legitimate source of objective probability or just a belief-forming heuristic. But tell me if those are the real cruxes or if I'm wrong about where the fault line is. For each crux, give me a case or argument that BOTH of them would agree bears on it, and write down what each side predicts about it in advance.

  Also: if part of their two-year fight turns out to be merely verbal — they're using "probability" for different things and neither has noticed — say which part and why. And for each side, note what they'd count as evidence or argument against their own view, if anything.

  Format: numbered agreed-claims section, then the disagreements table, then the cruxes. Casual tone is fine, it's for me not for a journal.
