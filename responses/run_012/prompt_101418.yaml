  Here is the draft. I've written it as a document you can slap on the table in front of them. It's designed to be precise enough that they can't wiggle out of it, but neutral enough that neither feels ambushed.

  ***

  # The One-Shot Machine Protocol: A Joint Statement of Adversarial Collaboration

  **Parties:** The Frequentist (F) & The Subjectivist (S)  
  **Mediator:** You  
  **Subject:** The Ontology of Probability in Single-Case Deterministic Systems  

  ### Part I: Agreed Claims
  *Both parties sign below to indicate they accept these propositions as true, regardless of their underlying interpretation. No weasel words.*

  1.  **The Calculus is Neutral:** Both parties agree that the mathematical machinery of probability (Kolmogorov axioms, Bayes' theorem, etc.) is valid and useful. The disagreement is exclusively about *what the numbers represent*, not how they are manipulated.
  2.  **The Symmetry Warrant:** Both parties agree that, given the physical symmetry of the machine described (prior to knowing it is deterministic), assigning a value of 0.5 to each outcome is the *operationally rational* move for any agent placing bets. Neither party claims a rational agent should bet 0.9 or 0.1.
  3.  **The Reference Class Problem is Real:** Both parties acknowledge that defining the "reference class" for the Frequentist, or the "prior information" for the Subjectivist, is non-trivial. Changing the description of the machine (e.g., "machines built by this engineer" vs. "machines with this symmetry") changes the resulting number for both views. Neither side claims this problem is easily solved.
  4.  **Determinism Complicates Ontology:** Both parties agree that if the system is strictly deterministic, the claim "the chance is 0.5" cannot mean "the world is physically undecided." Both agree that under determinism, the outcome is fixed at $t=0$, even if unknown to the observer.
  5.  **Propensity is Not Straw:** Both parties acknowledge the "Propensity" view (that physical setups possess real, single-case dispositions) as a coherent third option. Neither party will dismiss it as mystical nonsense, though neither is currently adopting it. It is acknowledged as the view that attempts to bridge the gap between F's physicalism and S's single-case focus.

  ### Part II: The Disagreement Table
  *Each position is phrased in the strongest, most charitable terms possible. If you think your opponent's view is represented inaccurately here, you must propose a edit that preserves the disagreement.*

  | Feature | The Frequentist Position (F) | The Subjectivist Position (S) |
  | :--- | :--- | :--- |
  | **1. What is Probability?** | A physical property of a *collective* or sequence. It is the limit of relative frequency in a hypothetical repeat of the setup. | A logical relation between a proposition and an agent's state of information. It is a coherent degree of belief. |
  | **2. The Single Case** | "The probability of *this* single run" is a category error. It is shorthand for "the frequency in the class of runs *like* this one." | The single case is the *only* case that matters. Probability is defined by the betting quotient on this specific event. |
  | **3. The Symmetry Argument** | Symmetry is evidence that the *reference class* of symmetric machines yields a 50/50 frequency. It is an empirical claim about the world. | Symmetry is a constraint on *rationality*. If I have no info distinguishing outcomes, coherence requires I treat them equally (Principle of Indifference). |
  | **4. Determinism** | If the system is deterministic, strict probability is 0 or 1. We only use probability because we define the reference class by *our inability* to measure initial conditions. | Determinism is irrelevant. Probability measures my uncertainty, not the world's causality. Even a deterministic coin has a probability of 0.5 *for me*. |
  | **5. Truth Conditions** | A probability claim is true or false based on the actual behavior of the reference class (even if hypothetical). | A probability claim is not "true/false" in a factual sense, but "coherent/incoherent." It is evaluated by betting behavior, not world-matching. |

  ### Part III: The Cruxes
  *These are the specific sub-questions where settling the matter would actually force one side to update. For each crux, we list a thought experiment both accept as relevant, and what each predicts.*

  **Crux 1: Do single-case claims have mind-independent truth conditions?**
  *   **The Test:** *The Omniscient Demon.* Imagine a being who knows the exact initial position and momentum of every particle in the machine (including the deterministic chaos).
  *   **F's Prediction:** The Demon assigns probability 1 or 0 to the outcome. If I assign 0.5, I am objectively wrong about the *chance*, though excusably ignorant. "Chance" vanishes at the limit of knowledge.
  *   **S's Prediction:** The Demon assigns probability 1 or 0 *for themselves*. I still assign 0.5 *for me*. Both assignments are correct relative to the agent. "Chance" is a relation, not a physical object that vanishes.
  *   **Why it matters:** If F admits the Demon's view doesn't make *my* 0.5 claim false (just relative), F moves toward S. If S admits there is a "fact of the matter" about chance that the Demon knows and I don't, S moves toward F.

  **Crux 2: Is Symmetry a Physical Fact or a Rational Norm?**
  *   **The Test:** *The Slightly Biased Machine.* We discover a microscopic imperfection that makes the physical frequency 0.500001, but it is undetectable by any human instrument.
  *   **F's Prediction:** The true probability is 0.500001. My assignment of 0.5 is factually false, even if I can't know it. The physical frequency dictates the truth.
  *   **S's Prediction:** The probability is 0.5. Since the imperfection is undetectable, it is not part of my information set. To bet otherwise is incoherent. The "true" frequency is a metaphysical posit with no bearing on rational action.
  *   **Why it matters:** This isolates whether probability tracks the *world* (F) or the *agent's map* (S).

  **Crux 3: What kills the theory?**
  *   **The Test:** *Long-Run Instability.* We build 1,000,000 copies of the machine. The frequency oscillates wildly (0.4, 0.6, 0.3...) and never converges, despite perfect physical symmetry.
  *   **F's Prediction:** This would falsify the claim that the probability is 1/2. If frequencies don't stabilize, there is no probability.
  *   **S's Prediction:** This would update my belief, but doesn't falsify the *concept*. I would simply adopt a new prior for the next machine. Probability is always about the next bet, not the past record.
  *   **Why it matters:** F ties probability to empirical stability. S ties it to internal consistency.

  ### Part IV: The Verbal Dispute & Falsification Analysis
  *Mediator notes on where the fight might be merely semantic, and what would actually change your minds.*

  **1. The Verbal Component**
  There is a significant verbal dispute here. You are both using the word "Probability" to point in opposite directions.
  *   **F** is using "Probability" to mean **Aleatory Uncertainty** (randomness in the world).
  *   **S** is using "Probability" to mean **Epistemic Uncertainty** (randomness in the mind).
  *   **The Fix:** When you argue, you must specify: "Are we talking about the *property of the machine* or the *justification for the bet*?" If you agree that the machine has no "property of 0.5" but the bet is still "justified at 0.5," F has won the ontology but S has won the practice. If you agree the machine *does* have a disposition that justifies the bet, you are both secretly Propensitists.

  **2. Conditions for Falsification (What would make you quit?)**
  *   **For the Frequentist:** You must admit that if stable long-run frequencies *fail to emerge* in clearly defined repeatable experiments (and it's not just noise), your definition of probability breaks. Also, if you cannot define a reference class for the One-Shot Machine without begging the question, you must admit single-case talk is not just "shorthand" but undefined.
  *   **For the Subjectivist:** You must admit that if two agents with identical information can coherently hold vastly different probabilities (e.g., 0.5 vs 0.9) without one being "wrong," then probability loses its normative force and becomes mere opinion. You need to explain why symmetry *compels* 0.5 if it's just belief.

