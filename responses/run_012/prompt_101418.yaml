      *   *Specific Case:* Ensure the "One-Shot Machine" is central.
      *   *Cruxes:* Make sure the "test" is something they both accept as relevant. The "Omniscient Demon" is a classic for this.
      *   *Falsification:* This is tricky for Subjectivists (since it's internal), but coherence failure is the standard answer. For Frequentists, lack of stability is the answer.

  5.  **Self-Correction during drafting:**
