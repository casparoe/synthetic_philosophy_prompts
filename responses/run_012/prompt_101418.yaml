      *   *Subjectivist:* Probability is betting odds. Coherence (Dutch Book) is the only constraint. Symmetry justifies a prior (Principle of Insufficient Reason/Maximum Entropy). Determinism doesn't matter; uncertainty is in the agent, not the world.
      *   *The "Unique Machine" Problem:*
          *   Frequentist struggles: No sequence exists. Must construct a hypothetical class (machines *like* this).
