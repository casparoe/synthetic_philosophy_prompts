  *(Self-Correction on the Frequentist view on single cases)*: A hardline frequentist usually says single case probability is meaningless. A "hypothetical" frequentist says it's about the limit of a hypothetical sequence. The prompt says "hardline... talk of 'probability of this single event' is... a category error." I must stick to that. He can't appeal to hypothetical sequences easily without softening. I need to frame his agreement carefully—he agrees we *talk* that way, but denies it has truth conditions.

