  **Q1: When stakes rise (saline vs. heart-drug), does the truth of "She knows" change?**

  **NO → Go to Q2.**
  **YES → Go to Q3.**

  **Q2: Is knowledge required for rational action?**
  *   **NO → Leaf: Probabilistic Action.**
      *   *Commitment:* Rationality tracks probability, not truth; she can act rightly while ignorant.
      *   *Note:* Indistinguishable from Moderate Invariantism in practice; both deny knowledge moves.
      *   *Model:* Graded confidence.
  *   **YES → Leaf: Moderate Invariantism.**
      *   *Commitment:* She knows in both cases, but high stakes make asserting it improper.
      *   *Note:* Indistinguishable from Probabilistic Action regarding action-guidance.
      *   *Model:* Threshold on fixed knowledge.

  **Q3: Whose context sets the standard for "knows"?**
  *   **THE KNOWER (Nurse) → Leaf: Subject-Sensitive Invariantism.**
      *   *Commitment:* Knowledge depends on practical interests, not just evidence.
      *   *Note:* Distinct from Contextualism; standards travel with the subject.
      *   *Model:* Threshold moves with stakes.
  *   **THE SPEAKER (Narrator) → Leaf: Contextualism.**
      *   *Commitment:* 'Knows' changes meaning mid-conversation based on speaker's context.
      *   *Note:* Hard to separate from Relativism in single-assessor cases.
      *   *Model:* Threshold moves with conversational context.
  *   **THE ASSESSOR (Reader) → Leaf: Assessment-Sensitive Relativism.**
      *   *Commitment:* Truth varies by who judges, not who speaks.
      *   *Note:* Hard to separate from Contextualism in single-assessor cases.
      *   *Model:* Threshold moves with assessment context.
  *   **NO ONE (Fixed) → Empty Node.**
      *   *Diagnosis:* Incoherent. If stakes change knowledge truth but no one's standards move, the change is magical.

  **Q4 (For Q3 branches): Is the shift a threshold move or a confidence change?**
  *   *Note:* Most views treat knowledge as binary (threshold), but some allow graded states. This distinction cuts across Q3 leaves; select based on whether your nurse loses knowledge entirely (threshold) or merely sufficient confidence (graded).

  **Summary of Logical Space:**
  The tree begins by isolating whether stakes affect *truth* or *usage*. If usage, we divide on whether knowledge norms action. If truth, we divide on whose context matters. This exhausts the live options.

  **Empty Node Diagnosis:**
  The "No One" branch under Q3 represents "Objective Pragmatic Encroachment." It is unheld because it posits a fact of the matter about knowledge shifting without relativizing to a subject, speaker, or assessor. This violates the supervenience of knowledge on truth-related factors unless one accepts magic. It is theoretically unstable.

  **Indistinguishability Note:**
  Contextualism and Relativism often yield identical predictions in single-observer narratives (like yours). They diverge only when speakers and assessors differ in stakes. If your narrator and reader share stakes, the tree cannot separate them; choose based on whether you want 'knows' to change meaning (Contextualism) or truth-value (Relativism).

  **Threshold vs. Graded:**
  While the tree places this in Q4, most Invariantists prefer fixed thresholds, while Encroachers move them. If your nurse feels she *loses* knowledge, use a threshold model. If she feels she *doubts*, use a graded model. This distinction does not create new leaves but alters the texture of the existing ones.

  **Final Advice:**
  If you want the nurse to feel the same internal certainty but be restricted externally, choose Moderate Invariantism. If you want her internal state to shift with the stakes, choose Subject-Sensitive Invariantism. If you want the narration to shift reliability based on who is telling the story, choose Contextualism.

