answer: |-
  **The Physicist's Doubt: An Assessment of the Pessimistic Meta-Induction**

  Having spent a career manipulating apparatus and analysing data, I approached philosophy of science expecting clarity. Instead, I found slogans. The most persistent of these is the pessimistic meta-induction against scientific realism. It is often waved about as a conversation-stopper, yet rarely set out with the rigour required to test its strength. As an experimentalist, I know that a measurement is only as good as its error analysis, and an argument is only as good as its weakest premise. I propose here to treat the meta-induction not as a position to be surveyed, but as a specific deductive structure to be stress-tested. The argument stands or falls on its explicit premises, particularly the empirical claim about the history of science.

  The argument under assessment is as follows:

  *   **P1.** A scientific theory is approximately true only if a substantial proportion of its central theoretical posits refer — that is, only if the entities it postulates, or something closely resembling them, really exist.
  *   **P2.** Every past theory that was both empirically successful and later abandoned had at least some central posits that failed to refer.
  *   **P3.** Empirical success is the best, and perhaps the only, evidence we can have for the approximate truth of a theory.
  *   **P4.** The historical record shows that most empirically successful theories have eventually been abandoned.
  *   **Conclusion.** Therefore, most of our present empirically successful theories are probably not approximately true, and we ought not to believe that they are.

  This formulation is stronger than the usual shorthand. It makes explicit that P4 is an empirical premise about the frequency of theory abandonment. It also ties approximate truth strictly to reference (P1). If this argument is sound, realism is dead. If it is unsound, we must identify precisely where the fracture lies.

  The first point of failure lies in how we count. P4 claims that *most* successful theories are abandoned. But what constitutes a theory? If we individuate at the level of whole named frameworks—'Newtonian Mechanics', 'Caloric Theory', 'Phlogiston Chemistry'—then P4 appears robust. These frameworks were successful, and they were superseded. However, this granularity is too coarse for the conclusion to follow. If we individuate at the level of individual posits, the picture changes. Within Caloric Theory, the posit of 'caloric fluid' failed to refer, but the posit of 'conservation of energy' (in embryonic form) and the mathematical structures of thermodynamics survived. If we count posits rather than packages, the proportion of non-referring posits in past successful theories drops significantly. P2 states that abandoned theories had *at least some* non-referring posits. This is trivially true but insufficient to drive the conclusion. To conclude that current theories are *probably not* approximately true, we would need to know that *most* posits in past theories failed to refer. The historical record does not support this stronger claim. Consequently, if we individuate by posit, P4 loses its force, and the inference to the conclusion is broken.

  Furthermore, we must consider the bias in the historical record. P4 relies on the history of science as it is written. Historians, like journalists, favour drama. They chronicle revolutions—the overturning of the geocentric model, the death of the aether—because these are narrative turning points. They rarely chronicle the quiet continuity of successful posits that become background assumptions. We do not write histories of 'The Theory that Atoms Exist' because it was never abandoned; it was absorbed. This creates a selection bias. The sample of 'past theories' available for induction is skewed towards the discontinued. If we include the vast corpus of successful posits that survived transition (genes, atoms, forces, conservation laws), the rate of abandonment looks far lower. P4, therefore, rests on a historiography that highlights discontinuity over continuity. It is an empirical premise derived from a biased sample.

  Suppose, however, we grant the pessimist their historical reading. There remains the reply that we should be realists only about the structural components of theories or those parts responsible for novel predictive success. This modifies P1. It suggests that approximate truth does not require the reference of *all* central posits, but only those that earn their keep through specific empirical victories, or that truth resides in the mathematical relations rather than the ontological nature of the entities. Does this answer the argument, or merely concede it? It concedes the letter of the original realism (which demands entity reference) but saves the spirit. It admits that we may be wrong about *what* the entities are (waves vs. particles) while maintaining we are right about *how* they behave (the structure). This is not a surrender to anti-realism; it is a refinement of what 'truth' means in science. It restricts P1. If P1 is restricted to require only structural preservation or selective reference, the conclusion no longer follows that we ought not to believe our theories are approximately true. We ought only to withhold belief from the specific ontological interpretations that are prone to revision.

  There is a deeper worry, one that keeps me awake: if the meta-induction is sound, does it not undermine itself? The argument uses inductive reasoning based on historical data to conclude that inductive reasoning regarding theoretical truth is unreliable. If we cannot trust induction in physics, why trust it in the history of science? This looks like a fatal self-undermining. However, I believe it is a manageable tension. The meta-induction is an induction about *theories of unobservables*, based on the observable history of *theory change*. It does not claim that all induction is invalid, only that induction from empirical success to theoretical truth is risky. The premises of the meta-induction concern the observable fact of theory abandonment, not the unobservable truth of the theories themselves. Therefore, the argument does not saw off the branch it sits on, provided we distinguish between induction regarding historical records and induction regarding natural kinds. Nevertheless, the tension remains palpable; it reminds us that the meta-induction is a warning shot, not a proof.

  This brings me to the test case that shapes my final verdict. Imagine a historian two hundred years hence who classifies our current fundamental physics and theories of mind much as we now classify phlogiston and the luminiferous aether. They view our quantum fields as convenient fictions and our neural correlates of consciousness as a mistaken category error. Is this retrospective classification the right kind of fact to bear on what we should believe today?

  The answer is no. That future classification is unknowable to us now. To base our current epistemic stance on a hypothetical future verdict is to succumb to a scepticism that paralyses all inquiry. We must judge theories by the evidence available at the time of assessment. If the future historian declares our theories false, they will be judging based on evidence unavailable to us. However, the *possibility* of that future verdict is relevant. It highlights that empirical success is not a guarantee of ontological correctness. But possibility is not probability. The meta-induction attempts to turn the possibility of future abandonment into a probability of current falsehood. It fails to do so because it ignores the cumulative nature of scientific knowledge. We know more than our predecessors; our instruments are sharper; our mathematical constraints are tighter. To assume we are in the same epistemic position as the phlogiston theorists is to ignore the progress that separates us from them.

  Therefore, the verdict must be sharp. The pessimistic meta-induction, as stated, fails to compel anti-realism because its empirical premise (P4) relies on a biased individuation of theories and a skewed historical sample. However, it succeeds in forcing a modification of realism. We cannot be naive realists about every posit.

  **Verdict:** The meta-induction fails as a refutation of scientific realism, but it succeeds in demonstrating that realism must be structural and selective rather than ontological and comprehensive.

  We ought to believe our theories are approximately true, but only insofar as their mathematical structures and robust posits are concerned, withholding belief from the specific mechanistic interpretations that history shows are volatile. The argument does not kill realism; it matures it.

