  # Hedon™: The First Wearable for Total Utility Maximization

  **Stop guessing. Start measuring.**

  For centuries, philosophers argued that happiness was too abstract to track. They were wrong. Hedon is the world's first bio-feedback ecosystem designed to quantify, aggregate, and optimize your subjective well-being in real-time. By isolating the common phenomenological tone underlying all positive experiences, Hedon translates every smile, sigh, and schadenfreude into a single, actionable currency: the **Hedon Unit (HU)**. Don't just live your life—maximize the sum total of its value.

  ### How It Works

  The Hedon Band uses military-grade galvanic skin response sensors and pupil-dilation optics to detect the specific neural signature of "liking." Our proprietary algorithm strips away the context—whether you're eating a peach or hearing about a rival's downfall—and isolates the raw pleasure payload. The Hedon App then logs these units into your Lifetime Utility Dashboard. Our AI suggests micro-adjustments to your daily routine to ensure you are always on the most efficient path to maximum aggregate pleasure. Why settle for qualitative ambiguity when you can have quantitative certainty?

  ### The Pleasure Conversion Table

  Our lab has calibrated the HU across thousands of test subjects. While experiences feel different, the underlying value is identical. Here is the current exchange rate for common activities:

  | Experience | Intensity | Duration | **Total HU Value** |
  | :--- | :--- | :--- | :--- |
  | Scratching a mosquito bite (ankle) | High | 4 sec | **12.50 HU** |
  | Hearing a dominant chord resolve | Medium | 3 sec | **12.50 HU** |
  | Learning a rival was fired | High | 15 sec | **45.00 HU** |
  | The relief of exhaustion (collapse) | Low | 10 sec | **28.00 HU** |
  | Sipping lukewarm tap water | Low | 5 sec | **6.25 HU** |

  *Note: Values may vary slightly based on baseline dopamine tolerance.*

  ### Frequently Asked Questions

  **1. What about "bittersweet" moments, like a good cry at a funeral?**
  Hedon distinguishes between the act and the feeling. While the context is sad, the physiological release of crying registers as a net positive sensory event. Our sensors measure the relief, not the reason. If you cry, you gain HU.

  **2. Does it matter if the pleasure comes from something "bad"?**
  No. Hedon is morally neutral. Whether you derive 50 HU from volunteering or 50 HU from eating an entire cake, the utility added to your life is identical. The math doesn't judge; it sums.

  **3. How do you handle mixed feelings?**
  We use net calculation. If you feel 60% joy and 40% anxiety, we subtract the negative weighting. However, most users find that focusing on the HU count eliminates the anxiety entirely.

  **4. Is there a cap on how much pleasure I can store?**
  There is no upper limit. Your Lifetime Utility Score accumulates until death. Upgrade to Hedon Premium to export your final score to your blockchain wallet for posterity.

  ### User Stories

  > "Before Hedon, I wasted time on 'meaningful' hobbies that yielded low HU returns. I realized painting gave me 4 HU/min, while scrolling outrage feeds gave me 12 HU/min. I quit painting. My total utility is up 400% this quarter. I feel optimized."
  > — **Jason V., Early Adopter (San Francisco)**

