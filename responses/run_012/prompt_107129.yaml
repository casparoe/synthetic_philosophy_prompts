  3. Head off the idea that hypocrisy defends the act during the initial blameworthiness stage, and intercept the sinless requirement when introducing the communicative model of blame. Address the all-or-nothing view of standing during the discussion of recovery, and correct the confusion between losing standing and ceasing to be blameworthy whenever participants claim the hypocrite's accusation is false.

  4. Ask whether the covering-up clinician could legitimately blame the colleague if they publicly confessed their own past error before speaking. A group grasping the distinction will say standing is recovered through acknowledgment, while a slogan-learning group will insist the past error permanently disqualifies them regardless of reform.

  5. Omit the metaphysical grounding of standing and the distinction between standing and desert to keep the focus on the social practice of accountability. Flag these omissions by explicitly stating that we are treating standing as a normative permission within a practice rather than a metaphysical right, and note that institutional blame requires a separate framework.
