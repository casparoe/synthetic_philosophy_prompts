answer: |-
  Here is the map of your exposure. It divides your friend's three moves, identifies the defeaters he missed, and assesses the metaphysical status of your commitment.

  ### I. Assessment of the Friend's Three Moves

  **1. The "Third Kind" (Constraints and Forms)**
  *   **Verdict:** **This bites.**
  *   **Why:** Your dichotomy (Assembly History vs. Stipulated Primitive) assumes a temporal, constructive narrative. However, a significant class of naturalist explanations cites *atemporal constraints*. For example, explaining why capillaries are a certain size via fluid dynamics minimization, or why protein folding converges via energy landscapes. These are not "assembled step-by-step" in the explanatory sense (they are physical necessities), nor are they "stipulated primitives" (they are derived from math/physics).
  *   **Exposure:** If you insist these are "assembly," you stretch the word until it loses meaning. If you insist they are "stipulation," you ignore that they are derived from lower-level laws.
  *   **Absorbability:** You can absorb this only by redefining "assembly" to include "consequence of physical law." But if you do that, you concede that *history* (selection/iteration) is not the only legitimate engine of explanation. You must admit that *structure* can explain *function* without a genealogy.
  *   **Decisiveness:** Merely awkward if you broaden your definition of "mechanism." Decisive if you hold that all explanation must be *historical* (selectionist).

  **2. The Circularity of "Greedy Reductionism"**
  *   **Verdict:** **Absorbable.**
  *   **Why:** Your friend claims the category is empty because you only label a reduction "greedy" after it fails. This confuses *identification* with *definition*. You define "greedy" as "reduction that eliminates the explanandum." You identify instances by observing the failure. This is not circular; it is a success condition.
  *   **Exposure:** The real vulnerability here is not circularity, but *who decides what the explanandum is*. If you define "consciousness" such that no neural mechanism could ever satisfy it, then *all* neural reductions look "greedy" by your lights.
  *   **Absorbability:** High. You simply need to concede that the "phenomenon to be preserved" is theory-laden. You are not safe from the charge that you are rigging the phenomenon to ensure the reduction fails.
  *   **Decisiveness:** Not decisive. It requires you to clarify that the "phenomenon" is not whatever you feel like, but a public, functional capacity.

  **3. The Methodological vs. Ontological Charge**
  *   **Verdict:** **This bites deeply.**
  *   **Why:** You claim stipulated primitives are "never legitimate." If this is an empirical claim, it is falsifiable (find one legitimate primitive). If it is a methodological rule ("I will not accept primitives"), it is unfalsifiable but potentially dogmatic. Your friend is pointing out that if you cannot describe what a *successful* primitive would look like, you aren't describing the world; you are describing your own tolerance.
  *   **Exposure:** You are likely holding a *Regulative Idea* (Kant) but presenting it as an *Ontological Truth*. If you admit it is a rule of inquiry, you lose the right to say the other side is "wrong about the world"; you can only say they are "playing a different game."
  *   **Absorbability:** You can absorb this by admitting your view is a wager on the unity of science. But you must concede that it is a *hope*, not a *fact*.
  *   **Decisiveness:** Decisive against the *authority* of your claim. It reduces your position from "This is how nature works" to "This is how I choose to investigate nature."

  ---

  ### II. Missing Defeaters (From Inside Naturalism)

  Your friend missed three arguments that are more dangerous than the ones he raised, because they come from successful scientific practice, not philosophy.

  **1. Effective Field Theories (The Autonomy of Levels)**
  *   **The Case:** In physics and biology, we often use "effective" theories that treat complex systems as primitives (e.g., treating a fluid as continuous rather than molecular, or a neuron as a threshold unit rather than a biochemical soup). These models predict and control perfectly without "earning" their primitives via assembly.
  *   **Why it Bites:** It shows that "stipulated primitives" can do legitimate work *indefinitely*, not just temporarily. Renormalization group logic suggests some higher-level laws are *insensitive* to lower-level details.
  *   **What Must Be True:** For this to count against you, it must be true that some phenomena are *multiply realizable* in such a way that the lower-level assembly is irrelevant to the higher-level law.
  *   **Absorbability:** You can absorb this if you treat effective theories as *proxies* for the real explanation. But if the math proves the lower level is *irrelevant*, your demand for assembly is a demand for unnecessary detail.
  *   **Cost:** You must forbid "autonomy." You must insist that fluid dynamics is not a real explanation until it is derived from molecular kinetics. This puts you at odds with working physicists.

  **2. Mathematical Explanations**
  *   **The Case:** Explaining why periodical cicadas have prime-numbered life cycles. The explanation is number theory (primes minimize intersection with predator cycles). It is not a mechanism assembled step-by-step; it is a mathematical constraint.
  *   **Why it Bites:** It is neither assembly nor stipulation. It is *mathematical necessity*.
  *   **What Must Be True:** That mathematical truths can be explanatory causes without being physical mechanisms.
  *   **Absorbability:** Low. This forces you to admit that "logic" explains "biology" without a physical process mediating it.
  *   **Cost:** You must call this "unexplained" until a physical mechanism for the math is found. This makes your vocabulary force you to deny a clear explanation.

  **3. The Pragmatic Success of Black Boxes**
  *   **The Case:** In psychology, "utility" or "belief" are often treated as primitives. We predict behavior using these terms without knowing the neural assembly. If the prediction holds for 50 years, have we failed?
  *   **Why it Bites:** It distinguishes *predictive utility* from *explanatory depth*. Your view conflates them. You say if it's not assembled, it's not explained. But science often accepts prediction as explanation (instrumentalism).
  *   **What Must Be True:** That explanation requires *understanding*, not just *prediction*.
  *   **Absorbability:** High, but costly. You must admit your view is about *satisfaction*, not *truth*.
  *   **Cost:** You forbid the use of functional models until they are mechanistically grounded. This slows down science.

  ---

  ### III. The Status of the View: Falsifiability and Dodges

  **Is the view unfalsifiable?**
  Yes, as stated. "Either assembly or illegitimate stipulation" is a methodological filter. If a stipulation works, you will say "It is actually assembly, we just haven't found the parts yet." This makes the claim immune to empirical refutation.

  **Is that a defect?**
  *   **If you claim it is empirical:** Yes, it is a defect. It is a "no true Scotsman" fallacy.
  *   **If you claim it is methodological:** No, it is not a defect, but it is not a truth-claim. It is a *vow*.
  *   **Is the distinction a dodge?** It is a dodge *only if* you use the methodological shield to claim ontological superiority. You cannot say "My view is safer" (methodological) and "My view is truer" (ontological) simultaneously.

  **The Specific Case That Breaks You:**
  You asked for a case where your vocabulary forces you to call something unexplained when it is well explained.
  *   **The Case:** **Renormalization in Complex Systems.**
  *   **Scenario:** A biological system exhibits a phase transition (e.g., flocking behavior). The mathematical model explains the transition using aggregate variables (density, velocity) and shows that the microscopic details of the individual birds *do not matter* (universality class).
  *   **Your Forced Move:** You must say, "This is not a real explanation until we show how every bird's neurons assemble this."
  *   **The Reality:** The math proves the neuron details are *explanatorily irrelevant*.
  *   **The Result:** Your vocabulary forces you to demand a "deeper" explanation that the universe does not provide, while rejecting a "complete" explanation that the math provides. You are left demanding ghosts while ignoring the machine.

  ---

  ### IV. Summary of Exposure

  1.  **What your position forbids that rivals permit:**
      *   It forbids **autonomy**. Rivals permit higher-level laws to be true *in virtue of* higher-level constraints, even if the lower-level map is unknown or irrelevant.
      *   It forbids **mathematical explanation** as a terminal stop. Rivals permit "because it is the only solution" as a full stop.
      *   It forbids **effective primitives**. Rivals permit using "black boxes" as legitimate explanatory terms if they integrate into a predictive nomological network.

  2.  **Which challenges bite:**
      *   **Constraints/Forms (Move 1):** Bites. Forces you to broaden "assembly" or look outdated.
      *   **Methodological Status (Move 3):** Bites. Forces you to admit you are stating a rule, not a fact.
      *   **Renormalization/Universality (Missed Defeater):** Bites hardest. Shows that "assembly" can be explanatorily irrelevant.

  3.  **Which to absorb:**
      *   **Circularity of Greed (Move 2):** Absorb. Clarify that "preserving the phenomenon" is the criterion, not the failure itself.

  4.  **The Core Vulnerability:**
      Your view relies on the assumption that **explanatory depth is always achieved by going smaller.** The most sophisticated naturalist counter-claim is that explanatory depth is sometimes achieved by **ignoring the smaller** to find the invariant pattern. If you cannot accommodate the idea that *ignoring parts* can be more explanatory than *assembling parts*, your view is not a theory of explanation; it is a theory of reduction. And reduction is not the only way nature makes sense.
