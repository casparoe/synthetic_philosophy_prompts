      *   *Uncertainty 2:* The status of "Normativity." Some modern CR theorists try to salvage normativity. I should note that.
      *   *Condition for Reversal:* If new literature shows a consensus shift (unlikely) or if "normativity" is defined very thinly.

  7.  **Final Review against Constraints:**
