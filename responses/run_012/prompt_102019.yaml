answer: |-
  This is a solid draft that gets the basic landscape right but stumbles on the current state of the field and the implications of the theories. Your friend has clearly read the intro literature (likely Millikan, Neander, and Cummins), but he's treating a live, nuanced debate as a settled scorecard.

  Here is the claim-by-claim audit you asked for, followed by the specific analysis of the closing argument and my own hedging.

  ### Claim-by-Claim Audit

  **1. Claim:** *"There are two rival theories... The etiological theory says the function of a trait is the effect it was selected for... The causal-role theory says a function is just whatever a part contributes to how the larger system it sits in works."*
  *   **Verdict:** **Philosopher's Nod.**
  *   **Analysis:** This is the standard distinction between **Selected Effect (SE)** functions (often called etiological) and **Causal Role (CR)** functions. The definitions are accurate enough for an explainer. SE focuses on history (why it's there); CR focuses on current capacity (what it does).

  **2. Claim:** *"He says the etiological theory is the one that matches how working biologists actually talk, since they only call something a function when it's an adaptation."*
  *   **Verdict:** **Fair Simplification (with caveats).**
  *   **Analysis:** This is an empirical claim about scientific practice. It is broadly true for *evolutionary* biologists, who care deeply about adaptationism. However, it is less true for *physiologists* or *neuroscientists*, who often use "function" in the CR sense (e.g., "the function of this neuron is to fire at threshold X"). It's a fair simplification for a general audience, provided he doesn't imply *all* biologists talk this way.

  **3. Claim:** *"...which is why they'll tell you a vestigial trait has no function at all, and why 'the function of the appendix is unknown' is a thing you hear people say."*
  *   **Verdict:** **Mixed / Slightly Misleading.**
  *   **Analysis:** On the SE view, this is correct: a vestigial trait has no *selected* function anymore. However, biologists rarely say it has "no function at all" without qualification; they usually say "no known *adaptive* function." The appendix, for instance, is now often credited with a CR function (a safe house for gut microbiota). If your friend implies the appendix literally does nothing, that's biologically false. If he implies it has no *evolutionary reason for being there*, that's SE-accurate.

  **4. Claim:** *"Then he says the causal-role view is a philosopher's invention, since it would let you say the function of the heart is to make a thumping noise, and nobody believes that, so that account is basically dead."*
  *   **Verdict:** **Flatly Wrong.**
  *   **Analysis:** This is the biggest error in the draft.
      1.  **Not just a philosopher's invention:** CR functions are the standard in systems biology, physiology, and engineering.
      2.  **The "Heart Noise" Objection:** This is a classic criticism (the problem of "promiscuity"), but CR theorists have answers. They argue functions are relative to a specific *capacity* you are trying to explain. If you are explaining circulation, noise isn't a function. If you are explaining auscultation (listening to the heart), noise *is* a function. Context solves the problem.
      3.  **"Basically Dead":** The CR account is not dead. It is widely considered complementary to the SE account. Many philosophers (e.g., Justin Garson) argue we need *both* depending on the sub-discipline.

  **5. Claim:** *"He wraps up by saying that the one thing both camps agree on is that function talk is normative..."*
  *   **Verdict:** **Flatly Wrong.**
  *   **Analysis:** Normativity (the ability to say a trait is *malfunctioning*) is the main selling point of the **Etiological/SE** view. If a heart doesn't pump, it fails its selection history. The **Causal-Role** view is notoriously bad at handling normativity. If the heart's role is to circulate blood, and it stops, the system breaks down—but is that "normative" failure or just causal description? Many CR theorists admit their view is descriptive, not normative. They do *not* agree on this.

  **6. Claim:** *"...and that this normativity is the only reason the debate is worth having."*
  *   **Verdict:** **Overstated / Philosophically Myopic.**
  *   **Analysis:** Even if they agreed on normativity (which they don't), the debate is also worth having for reasons of **explanation** (distinguishing adaptations from byproducts/spandrels) and **classification** (homology vs. analogy). Normativity is a major stake, but not the *only* one.

  ---

  ### Does the Closing Claim Follow?

  **No.** The closing claim (that normativity is the shared core and the sole value of the debate) does not follow from the premises provided, primarily because the premise that "both camps agree on normativity" is false.

  If the Causal-Role theory cannot ground normativity (which is the standard objection to it), then the debate is precisely *about* whether biological function requires normativity or not.
  *   **If SE is right:** Function is inherently normative (there is a right/wrong way to be).
  *   **If CR is right:** Function might just be descriptive causal contribution (there is only "working" or "not working" relative to a system goal).

  By asserting they agree on normativity, your friend dissolves the central tension that makes the debate interesting. He has essentially argued: "Theory A says X. Theory B says Y. Actually, they both agree on Z, and Z is all that matters." But in reality, Theory B is often defined by its rejection or reconfiguration of Z.

  **Recommendation for the draft:** He should pivot the conclusion. The debate isn't about whether normativity exists (SE says yes, CR struggles); the debate is about whether biology *needs* normativity to do its job, or whether causal contribution is enough for most scientific explanations.

  ---

  ### My Hedging (Where I'm Least Sure)

  You asked where I am hedging my own corrections. Here are the two points where I am most open to being corrected, and what would change my mind:

  **1. The Empirical Claim about Biologist Usage**
  *   **My Stance:** I claimed it's a simplification to say biologists only use SE functions.
  *   **My Uncertainty:** I am a philosopher, not a sociologist of science. It is possible that in *textbooks* and *public communication*, the SE view dominates so heavily that the CR view is effectively invisible to the layperson.
  *   **What would reverse me:** If there were a robust bibliometric study showing that >80% of usage of the word "function" in major biology journals (across sub-disciplines, not just evolutionary biology) refers strictly to selection history. If biologists actually use "function" loosely (CR) most of the time, my critique stands. If they are strict Millikanians in practice, your friend is more right than I gave him credit for.

  **2. The "Death" of the Causal-Role View**
  *   **My Stance:** I called the claim that CR is "dead" flatly wrong.
  *   **My Uncertainty:** "Dead" is a metaphor. In some specific circles of *evolutionary* philosophy, SE is definitely the hegemon. If your friend means "dead among evolutionary theorists who care about adaptation," he's closer to the truth.
  *   **What would reverse me:** If the definition of "function" in the draft is explicitly scoped to **Evolutionary Biology** only. If the explainer is titled "The Function of Traits in Evolution," then CR is indeed a minority view. But if the explainer is about "Biological Function" generally (including physiology), then CR is very much alive. I am assuming the latter based on the mention of the heart/appendix.

  **3. The Normativity Consensus**
  *   **My Stance:** I said it's wrong that both camps agree on normativity.
  *   **My Uncertainty:** There is a niche strand of "Goal-Contribution" CR theories that try to smuggle normativity in by referencing the *survival of the organism* as the normative standard.
  *   **What would reverse me:** If your friend defines "normative" very thinly—e.g., "if it stops doing it, the organism dies." If that's his bar for normativity, CR can clear it. But philosophers usually mean "normative" in a stronger sense (teleological "ought"), which CR struggles with. If he clarifies his definition of normativity, this objection might soften.

  ### Summary Advice for Your Friend
  Tell him he has the **definitions** right, but the **scoreboard** wrong. The SE view didn't knock out the CR view; they play different sports. SE is for evolution; CR is for physiology. And the normativity issue is the *battlefield*, not the peace treaty.
