answer: |-
  **Exam Question**

  **Course:** PHI 550: Advanced Topics in Anthropics and Decision Theory
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**
  Consider the following strategic anthropic scenario: Alice and Bob exist in a pre-universe void. They must independently choose to create either Universe A (10 observers, utility 100 each) or Universe B (100 observers, utility 50 each). If they coordinate (both A or both B), the corresponding universe is created. If they mismatch, Universe C is created (1,000 observers, utility 1 each). Alice and Bob will be reincarnated as random observers in the resulting universe. They cannot communicate but share common knowledge of rationality.

  Write an essay analyzing Alice's decision. Specifically:
  1.  Determine Alice's optimal choice under the Self-Sampling Assumption (SSA).
  2.  Determine Alice's optimal choice under the Self-Indication Assumption (SIA).
  3.  Explain how the existence of Universe C affects the analysis under both assumptions.
  4.  Assess whether the "Presumptuous Philosopher" objection applies to the SIA verdict in this specific strategic context.

  In your conclusion, include a brief paragraph identifying the weakest link in your reasoning or what evidence would change your verdict.

  ***

  **Model Answer**

  To analyze Alice's decision, we must distinguish how SSA and SIA weight the value of outcomes and the probability of finding oneself in specific worlds. Both assumptions agree that Alice seeks to maximize her expected utility as a reincarnated observer, but they disagree on how observer counts influence that calculation.

  Under the **Self-Sampling Assumption (SSA)**, Alice reasons as if she is a random sample from the set of actually existing observers in the actual world. Crucially, SSA does not weight the probability of a world being actual by its population size; it treats the strategic probabilities as primary. Assuming a Principle of Indifference regarding Bob's choice (50% A, 50% B), Alice calculates her expected per-capita utility.
  If Alice chooses A: She faces a 50% chance of Universe A (Utility 100) and a 50% chance of Universe C (Utility 1). Expected Utility (EU) = $0.5(100) + 0.5(1) = 50.5$.
  If Alice chooses B: She faces a 50% chance of Universe C (Utility 1) and a 50% chance of Universe B (Utility 50). EU = $0.5(1) + 0.5(50) = 25.5$.
  Since $50.5 > 25.5$, **SSA dictates Alice should choose Universe A.** She prioritizes the higher quality of life per observer, treating the number of observers as irrelevant to her subjective probability of being in a specific outcome, conditional on the strategic setup.

  Under the **Self-Indication Assumption (SIA)**, Alice reasons as if she is a random sample from the set of *possible* observers. In decision-theoretic contexts, SIA effectively weights outcomes by the number of observers they contain, aligning closely with Total Utilitarianism. SIA suggests Alice is more likely to "find herself" in outcomes with more observers.
  If Alice chooses A: The total utility generated is 1,000 in Universe A ($10 \times 100$) and 1,000 in Universe C ($1,000 \times 1$). Weighted EU $\approx 1,000$.
  If Alice chooses B: The total utility generated is 1,000 in Universe C and 5,000 in Universe B ($100 \times 50$). Weighted EU $\approx 3,000$.
  Alternatively, viewing this through anthropic probability: SIA makes the high-population Universe C anthropically "heavier." However, because Universe C occurs on mismatch regardless of Alice's specific choice, the differential lies between A and B. SIA favors the world with more total observer-moments. Since Universe B generates more total utility (and contains more observers) than Universe A, **SIA dictates Alice should choose Universe B.**

  **The Role of Universe C**
  Universe C acts as an anthropic "sink" or magnet. With 1,000 observers, it dominates the SIA probability space. A strict SIA credence update might suggest that mismatch is overwhelmingly more likely than coordination, potentially paralyzing decision-making or driving expected utility toward 1 for both choices. However, because C is symmetric (resulting from *any* mismatch), it cancels out when comparing Choice A against Choice B, provided Alice assumes Bob's strategy is independent of her own. For SSA, C is merely a low-utility risk. For SIA, C highlights the tension between quantity and quality; it is the world SIA says Alice is *most* likely to inhabit, yet it offers the lowest welfare.

  **The Presumptuous Philosopher Objection**
  The Presumptuous Philosopher (PP) argument originally contends that SIA unjustifiably favors hypotheses with more observers without empirical evidence. In this strategic guise, the objection manifests as a preference for quantity over quality. SIA compels Alice to choose Universe B, where observers are half as happy as in Universe A, solely because there are more of them. This is presumptuous because Alice assumes her existence provides evidence favoring the larger population, effectively forcing a trade-off that sacrifices per-capita welfare for total existence. In a coordination game, this could be disastrous if Bob reasons via SSA; Alice chooses B, Bob chooses A, and they land in Universe C—the worst outcome per capita. Thus, the PP objection holds: SIA encourages a "presumptuous" strategy that ignores the fragility of coordination in favor of populating the void.

  **Critical Reflection**
  My reasoning relies heavily on the equivalence between SIA and Total Utilitarianism in decision problems. This link is contested; some argue SIA should only update credences, not decision weights. If SIA updates the *probability* of mismatch (due to C's size) but does not weight the *value* of B by population, the verdict might flip. Furthermore, if Alice and Bob are logically correlated (e.g., via superrationality), the mismatch probability drops to zero, rendering the anthropic weighting of C irrelevant and potentially collapsing the difference between SSA and SIA verdicts.

  ***

  **Marking Scheme**

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **SSA Derivation:** Correctly identifies SSA focuses on per-capita utility/average welfare without population weighting, leading to Choice A (50.5 > 25.5). | 4 | Students often confuse SSA with Average Utilitarianism but fail to apply the strategic probabilities of the mismatch correctly. |
  | **2** | **SIA Derivation:** Correctly identifies SIA weights by observer count (Total Utility), leading to Choice B (3000 > 1000). | 4 | Students often apply SIA to credence only and fail to translate it into a decision-theoretic preference for B. |
  | **3** | **Universe C Analysis:** Explains C as an anthropic "magnet" that dominates SIA probability space but cancels out in symmetric comparison, whereas it is just a risk for SSA. | 4 | Students typically claim C changes the A vs B preference directly, rather than acting as a symmetric background risk. |
  | **4** | **PP Objection:** Articulates that SIA is "presumptuous" here because it sacrifices per-capita welfare (100 vs 50) solely for population size, risking coordination failure. | 4 | Students often define PP generally but fail to apply it to the specific trade-off (Quality vs Quantity) in this scenario. |
  | **5** | **Critical Reflection:** Includes a paragraph identifying a weakness (e.g., SIA/Total Util equivalence, logical correlation/superrationality). | 4 | Students often write a generic conclusion without identifying a specific flaw or condition that would alter the verdict. |
