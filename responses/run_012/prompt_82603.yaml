      *   Key Insight: The "Difference Maker" isn't the kowtow; it's the *translation* of the kowtow.
      *   Philosophical Credit: Confirm it's Van Fraassen (*The Scientific Image*, 1980) on contrast classes, Lipton (*Inference to the Best Explanation*) on difference-makers.
      *   Avoid: "Coal and Colonies." Focus on epistemology and ritual.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "which why-question the episode is evidence for"?
      *   *Correction:* Make sure to explicitly state: It is evidence for "Why diplomatic failure?" NOT "Why Industrial Revolution?"
      *   *Check:* Did I address the "unrepeatable event" issue?
      *   *Correction:* Emphasize that contrastive explanation struggles with singularities unless treated as narrative selection.
      *   *Check:* Did I avoid the standard economic history?
      *   *Correction:* Focus on ritual, epistemology, and the philosophy of history.

  9.  **Final Polish:** Ensure the distinction between Van Fraassen (pragmatics of why-questions) and Lipton (causal difference-makers) is clear but integrated, as the user conflates them slightly (which is fine, they work together). *Self-correction: Van Fraassen is the source of the "rather than" contrast class. Lipton is the source of the "difference maker" causal refinement. I should acknowledge both.*

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  You are remembering Bas van Fraassen correctly (*The Scientific Image*, 1980). He argues that explanation is not a relation between theory and fact, but a three-place relation between theory, fact, and **contrast class**. "Why P?" is always elliptical for "Why P *rather than* Q?" Peter Lipton (*Inference to the Best Explanation*) later tightens this with the "difference-maker" criterion: an explanation must cite a causal factor that would not have been present if the foil (Q) had occurred instead.

  This is a potent tool for a novelist dealing in contingency, because it forces you to admit that every scene is an argument against a ghost scene that didn't happen.

  Here is the case analysis of the Macartney Embassy through that philosophical lens, followed by the stress test on the theory itself.

  ### 1. The Contrast Classes: What is Macartney Evidence *For*?

  You have identified the trap: historians often treat "Why the Great Divergence?" as a single question. Through the van Fraassen lens, the Macartney episode is evidentiary gold for some contrast classes and worthless for others.

  **A. The Question: "Why the Industrial Revolution in Britain rather than China?"**
  *   **The Foil:** A Chinese Industrial Revolution beginning c. 1800.
  *   **Verdict:** **Useless Evidence.**
  *   **Why:** By 1793, the divergence is already latent in the deep structure (energy regimes, financial instruments, property law). Macartney is a *symptom* of the divergence, not a *cause*. The fact that Qianlong filed the telescopes as tribute rather than tools of inquiry tells you about the Qing epistemic framework, but it does not explain *why* that framework lacked the internal pressure to mechanize.
  *   **The Difference-Maker:** To answer this question, you need difference-makers from 1650–1750 (coal geography, New World silver, enclosure acts). Macartney is too late. If you use this episode to explain the Industrial Revolution, you are committing the *post hoc ergo propter hoc* fallacy.

  **B. The Question: "Why Coercive Diplomacy (1839) rather than Reciprocal Treaty (1793)?"**
  *   **The Foil:** A normalized, Westphalian-style diplomatic relationship established peacefully in the 1790s.
  *   **Verdict:** **Primary Evidence.**
  *   **The Difference-Maker:** The ritual impasse. Specifically, the *incommensurability of translation*.
  *   **Analysis:** This is where your novel lives. The divergence isn't about steam engines yet; it's about the ontology of the state. For the British, the foil is "Sovereign Equality." For the Qing, the foil is "Universal Hierarchy."
  *   **Contingency:** If Macartney had kowtowed (the physical act), does the foil obtain? Maybe. But van Fraassen would say the relevant contrast class isn't "Kowtow vs. No Kowtow," it is "Interpretation of the Kowtow." The British recorded a compromise (one knee); the Qing recorded submission (prostration). The *explanation* for the future conflict lies in the fact that both sides could file the report as a victory. The difference-maker is the **ambiguity**, not the posture.

  **C. The Question: "Why Qianlong Rejected the Request rather than Accepting It?"**
  *   **The Foil:** Qianlong granting the embassy's requests (Beijing legation, Zhoushan port).
  *   **Verdict:** **Strong Evidence.**
  *   **The Difference-Maker:** Internal Qing stability vs. External threat perception.
  *   **Analysis:** Standard history says Qianlong was arrogant. A contrastive analysis asks: "What would have had to be true for him to say yes?" He would have had to perceive the British as a strategic counterweight to the Russians or internal rebels, rather than as distant tribute bearers. The rejection wasn't ignorance of the West (the Qing knew plenty); it was a rational calculation that the *cost* of integrating Britain into the tribute system outweighed the *benefit* of their trade. The gifts (clocks) were filed as tribute because that was the only administrative category available to process them without destabilizing the ideology of the state.

  ### 2. Stress-Testing the Theory: Disagreement and Singularity

  You ask if the contrast-class apparatus survives a case where the two sides don't agree on the facts, and where the event is unrepeatable.

  **The Fact-Disagreement Problem**
  Van Fraassen assumes a shared scientific language where $P$ and $Q$ are stable. In 1793 Beijing, $P$ (Macartney knelt) and $P^*$ (Macartney prostrated) are both "true" depending on the observer.
  *   **Does the framework break?** No, but it shifts the locus of explanation. The explanation is no longer about the *event*, but about the **narrative construction**.
  *   **The Difference-Maker:** The difference-maker for the *divergence* is not what Macartney's knee did, but what the *secretaries wrote down*. The framework survives if you treat the "fact" as the *recorded fact*. The tragedy of your novel is that the two sides are living in different contrast classes. The British are playing "International Trade"; the Qing are playing "Cosmic Order." They aren't just disagreeing on the move; they are disagreeing on the game board.
  *   **Novelist's Angle:** This is your epistemic tension. The "truth" of the scene is irrelevant. The *consequence* lies in the mismatch.

  **The Singularity Problem ($N=1$)**
  Science relies on repeatability to isolate difference-makers. History is a sequence of singularities.
  *   **Where the framework goes quiet:** It cannot handle **pre-factuals**. Van Fraassen's model works well for "Why did the match light (rather than not)?" because we know the physics of matches. It struggles with "Why did Macartney fail (rather than succeed)?" because "Success" is a counterfactual historical world we cannot model.
  *   **The Limit:** The framework implies that if you identify the difference-maker, you have the explanation. But in history, removing the difference-maker (e.g., "Suppose Macartney kowtowed") doesn't guarantee the foil ("Peaceful Treaty"). Qianlong might have rejected them anyway for other reasons. The framework creates an illusion of causal sufficiency where there is only causal contribution.
  *   **Silence:** The theory goes quiet on **thresholds**. At what point does a ritual slight become a *casus belli*? Contrastive explanation identifies the spark, but it is silent on the dryness of the wood. It cannot tell you *how much* difference the kowtow made, only that it made *a* difference.

  ### 3. Is the Question Well-Posed? (Which Britain? Which China?)

  This is the most critical point for your theme of contingency. The question "Why Britain and not China?" is ill-posed because it treats both entities as monolithic agents with unitary wills.

  **Deconstructing "Britain"**
  *   **The Foil:** "Why the *East India Company* rather than the *British State*?"
  *   Macartney was Crown, but the drive was EIC. If the EIC had run the show entirely (as they did in India), the "tribute" framing might have been bypassed via bribery or local deals. The Crown's involvement necessitated the ritual protocol that caused the friction.
  *   **Contingency:** The divergence might not be "Britain vs. China," but "Corporate Mercantilism vs. Imperial Bureaucracy."

  **Deconstructing "China"**
  *   **The Foil:** "Why *Beijing* rather than *Canton*?"
  *   The Canton merchants understood the British perfectly well. They spoke pidgin, they understood profit. The "stonewalling" came from the Center, not the Periphery.
  *   **Contingency:** If the Qing state had been more federalized, or if the Emperor had delegated trade negotiation to the Viceroys (as the British expected), the outcome changes. The "China" that rejected Macartney was a specific political configuration of Manchu legitimacy, not an eternal "Chinese Culture."

  **The "Rather Than"**
  *   **The Real Contrast Class:** The most productive question for your novel is not "Why Britain won?" but **"Why did the interaction harden?"**
  *   **Foil:** A fluid, hybrid zone of exchange (like the early Canton system or the Dutch in Nagasaki).
  *   **Difference-Maker:** The demand for *permanence*. Macartney didn't just want to trade; he wanted an *embassy* (a permanent sovereign presence). This triggered the Qing immune system.
  *   **Reframing:** The divergence isn't about technology; it's about **presence**. Britain wanted to be *inside* the system; China wanted Britain *outside* the system but *accessible* at the ports.

  ### Summary for the Novelist

  1.  **Don't use Macartney to explain the Industrial Revolution.** It's the wrong contrast class. Use it to explain the **Opium Wars** or the **hardening of boundaries**.
  2.  **The "Fact" is the Document.** Since the knee-bend is disputed, make the *writing of the report* the climax of the scene. The difference-maker is the ink, not the bone.
  3.  **The Theory's Limit:** Van Fraassen gives you a structure for scenes (Character A wants P rather than Q; Character B wants R rather than S), but it cannot predict the cascade. Acknowledge the silence. Let your characters feel that they are making a choice, while the narrative voice knows the choice is constrained by structures they can't see.
  4.  **The Well-Posed Question:** Shift your theme from "Why China Failed" to "Why Communication Collapsed." The tragedy isn't that China didn't become Britain; it's that the two sides could not agree on what language they were speaking (literal and metaphorical).

  The "Great Divergence" is a retrospective label. In 1793, it was just a series of awkward dinners and mistranslated letters. The philosophy of science helps you see that the "explanation" is not in the event, but in the **selection of the event** as significant. Your novel is about who gets to write the contrast class.
