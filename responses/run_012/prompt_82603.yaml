prompt: |-
  I'm a novelist, about two hundred pages into a book set in 1793 — the year Lord Macartney's embassy turns up in China, asks for a permanent embassy in Beijing and a few more ports, and gets politely stonewalled by the Qianlong emperor — and the book is really about contingency, about the roads not taken. So I've been reading around the why-Britain-and-not-China question (Needham's question, the Great Divergence debate) and I keep thinking the key to it is a bit of philosophy of science I half-remember: that a why-question is really "why this rather than that," and the "rather than that" is part of the question, not scenery. So "why Britain rather than China," "why Britain rather than France," and "why not China" are three different questions with three different bodies of relevant evidence, even though they get asked as if they were one. Van Fraassen, I think, or Lipton — I can never remember who gets the credit — plus the cousin idea that explaining is just locating the difference-maker.

  Do the case analysis in both directions. Take the Macartney episode — the kowtow fight (which the two sides seem to have recorded completly differently, and I don't care who's right), the clocks and telescopes the court filed under tribute, the emperor's letter to George III that amounts to thanks-but-we-have-everything — and tell me which why-question that episode is actually evidence for and which it's useless for. Who's asking, what's their foil, and what would have had to be different for the embassy to be a cause rather than a symptom of the divergence. Then tell me what the episode does back to the theory: does the whole contrast-class apparatus survive a case where the two sides don't even agree on what happened, and where you've got one unrepeatable event and no way to run it again? And say where the framework goes quiet instead of making it answer.

  Last thing: is the question well posed at all, or does it come apart once you ask which China, which Britain, and which "rather than"? Skip the reading list, I'll look that up myself, and don't just give me the standard coal-and-colonies, Canton-system story, I've read that alot.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist, 200 pages into a historical fiction book set in 1793 (Macartney Embassy).
      *   **Theme:** Contingency, roads not taken, the "Great Divergence" (Why Britain/Industrial Revolution and not China?).
      *   **Philosophical Hook:** The user is referencing Bas van Fraassen's *The Scientific Image* (specifically the pragmatics of explanation: why P *rather than* Q) and Peter Lipton's *Inference to the Best Explanation* (difference-makers).
      *   **Task:**
          1.  Analyze the Macartney episode through the lens of contrastive explanation (Why Britain rather than China? Why not China? etc.).
          2.  Determine which "why-questions" the episode answers and which it fails to answer.
          3.  Analyze what the episode does *to* the theory (does the contrast-class framework survive radical disagreement on facts + singularity/non-repeatability?).
          4.  Identify where the framework goes "quiet" (limits of the theory).
          5.  Critique the question itself (is "Why Britain/China" well-posed given internal heterogeneity?).
      *   **Constraints:** No reading lists (user will look it up), no standard "coal-and-colonies/Canton System" boilerplate (user knows it well). Needs to be sophisticated, nuanced, and useful for a novelist thinking about narrative structure and historical causality.

  2.  **Deconstruct the Philosophical Framework:**
      *   **Van Fraassen's Contrast Class:** An explanation is only meaningful relative to a specific contrast class ($P$ rather than $Q$). "Why did Adam eat the apple?" can mean "Why Adam (not Eve)?", "Why eat (not throw)?", or "Why the apple (not the pear)?".
      *   **Lipton's Difference-Maker:** To explain is to cite a factor that makes the difference between the fact and the foil. If the factor were absent, the foil would have obtained.
      *   **Application to History:** History is often treated as a single narrative, but causality depends on what alternative history you are comparing it to.

  3.  **Analyze the Macartney Episode (1793):**
      *   *Facts (Disputed):* Kowtow (did he or didn't he? one knee vs. prostrate), Gifts (toys vs. technology), Qianlong's Edict (benign neglect vs. arrogant ignorance).
      *   *Standard Interpretation:* China missed the boat (closed door), Britain seized it (open market/tech).
      *   *Revisionist Interpretation:* China was stable/rational, Britain was aggressive/lucky.

  4.  **Drafting Section 1: The Contrast Classes (Which Why-Question?)**
      *   *Question A: Why Britain rather than China? (The Great Divergence)*
          *   Does Macartney explain this? **No.** It's too late. By 1793, the divergence is already underway (institutional, financial, scientific). Macartney is a *symptom*, not a cause. The gifts being filed as tribute shows existing cognitive frameworks, not the *origin* of the divergence.
          *   Foil: China industrializing.
          *   Difference-maker needed: Something prior to 1793 (property rights, coal, state capacity). Macartney doesn't show *why* China couldn't industrialize, only that they didn't want British trade terms.
      *   *Question B: Why War in 1839 rather than Peace? (The Opium Wars)*
          *   Does Macartney explain this? **Yes.** This is the relevant contrast class. The failure of diplomatic normalization in 1793 set the trajectory for the coercive diplomacy of 1839.
          *   Foil: A treaty port system established peacefully in 1793.
          *   Difference-maker: The ritual impasse (kowtow) and the categorical mismatch (tribute vs. diplomacy).
      *   *Question C: Why did the Embassy fail *at that moment*?*
          *   Does Macartney explain this? **Yes.**
          *   Foil: The Embassy succeeding.
          *   Difference-maker: Qianlong's specific political context (aging emperor, need to project stability), Macartney's instructions (rigid vs. flexible).

  5.  **Drafting Section 2: Stress-Testing the Theory (Epistemology of the Event)**
      *   *Problem:* Van Fraassen assumes a shared scientific language. Here, the two sides don't agree on the *facts* (Kowtow), let alone the *theory*.
      *   *The "Fact" Problem:* If the contrast class relies on $P$ being true, but Side A says $P$ (Macartney knelt) and Side B says not-$P$ (Macartney prostrated), the explanation fractures.
      *   *The "Singular Event" Problem:* Contrastive explanation works best with repeatable phenomena or clear counterfactuals. History is $N=1$. You can't run the Macartney experiment again.
      *   *Survival of the Framework:* The framework survives *if* you shift from "what happened" to "what was believed to have happened." The explanation lies in the *mismatch of narratives*, not the physical reality of the knee bend. The "difference maker" is the *incommensurability*, not the act itself.
      *   *Where it goes quiet:* It can't tell you what *would* have happened if Macartney kowtowed. It can't resolve the "Butterfly Effect" problem. It creates a false sense of precision around fuzzy historical categories.

  6.  **Drafting Section 3: Deconstructing the Question (Which Britain? Which China?)**
      *   *Homogeneity Fallacy:* "Britain" and "China" are not monoliths.
      *   *Which Britain?* The East India Company (mercantile) vs. The Crown (geopolitical) vs. The Enlightenment Intellectuals (curious). Macartney represents a specific faction.
      *   *Which China?* The Court (Beijing) vs. The Coast (Canton) vs. The Intellectuals (evidential research school). Qianlong's view $\neq$ a Canton merchant's view.
      *   *The "Rather Than":* If the foil is "Why not a multi-polar world where China dominates the Indian Ocean?", Macartney is irrelevant. If the foil is "Why not a Sino-British Alliance?", Macartney is central.
      *   *Conclusion on Question:* The question "Why Britain and not China" is ill-posed for 1793. It should be "Why did the *interaction* harden into hierarchy rather than reciprocity?"

  7.  **Refining and Polishing (Novelist Angle):**
      *   Tone: Intellectual, respectful of the craft, avoiding textbook summaries.
