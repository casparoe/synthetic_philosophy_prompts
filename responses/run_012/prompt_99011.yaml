answer: |-
  The Codex had no covers. It was a continuous ring of vellum, stitched tail to head, resting on a curved lectern that matched its shape. Elara's fingers traced the seam where the final page met the first. The thread was tight, unbroken, a white scar running through the history of the city.

  She dipped her quill. The inkwell was full, though she had been writing all day.

  Her task was simple: record the succession. Morning follows night. Year follows year. Cause follows effect. That was the Covenant of the Scribe. To impose a line on the world.

  She looked at the opening entry, marked by a faded red ribbon. The handwriting was sharp, hurried. *Year One. The ship Horizon descends. The Beacon is lit. The City begins.*

  She looked out the high arched window. The sky was the color of bruised iron. The stars did not twinkle; they dragged, long faint streaks across the dome, smearing like wet paint on a spinning pot. Below, in the plaza, the crowd was gathering. They held unlit torches. They waited for the signal.

  On the lectern, the Codex lay open to the very last available space. The end of her tenure. The end of the record, presumably. She had prepared the sentence a hundred times in her head. *Year Seventy. The ship Horizon descends. The Beacon is lit. The City continues.*

  But the ink in her pot was black, and the ink on Page One was black, and the handwriting on Page One was hers.

  She knew this because she had studied the loops of the 'Y' and the cross of the 't' until her eyes watered. She had inherited this book from the Founder, or so the story went. But the Founder's hand was her own. The beginning she had inherited was the ending she was about to write.

  Elara lifted the quill. Her hand hovered over the vellum.

  This was the moment where the line should break. If time was a river, she was just a boat floating down it. But if the river curved back on itself, if the mouth fed the source, then the water wasn't moving. It was just... there.

  She felt the weight of the quill. It was light, wood and feather. She could press it down. She could write the words. Or she could drag the nib sideways, tear the paper, leave the page blank. If she left it blank, then Page One would not match Page Last. The loop would snap. The Founder's entry would become a lie. The City would have a start without an end, or an end without a start.

  She could choose. The muscle in her forearm tensed, ready to deviate. The air in the tower was still, but outside, the wind picked up, carrying the murmur of the crowd. They were waiting for the light. They believed in the sequence. They believed that when the beacon lit, something new was happening.

  Elara knew that nothing new would happen. The light would ignite. The ship would settle. She would write the words. Tomorrow, she would wake up and open the book to the same page, perhaps with a different ribbon, perhaps with the same dust on the ledge, and she would write again. Or someone else would. Or she would be the one reading.

  The ache sat behind her ribs, a hollow hunger. It was the feeling of reaching for a door handle knowing the room behind it is empty, yet having to open it anyway. To pretend the opening mattered.

  She looked at the seam where the pages were stitched. The thread pulled tight. If she cut it, the book would unravel. The history would spill out into a straight line that led nowhere.

  Outside, the first flare ignited in the plaza. A single point of fire against the gray.

  Elara exhaled. The choice was an illusion, but the ink was real. The paper was real. The duty was the only thing that kept the circle from collapsing into a point.

  She lowered the quill. She did not tear the page. She did not leave it blank. She pressed the nib to the vellum, feeling the scratch of the fiber, the resistance of the world against the mark.

  *Year Seventy. The ship Horizon descends. The Beacon is lit.*

  She paused before the final word. The crowd below cheered as the main beacon roared to life, washing the room in sudden orange. The shadow of her hand jumped across the page, swallowing the words she had just written, merging them with the shadows of the words written before.

  She dipped the pen again, though the sentence was finished. She held the drop of ink over the period at the end of the sentence, letting it swell, heavy and dark, trembling on the tip, ready to fall and blur the line between what was done and what was being done.

  She let it fall.
