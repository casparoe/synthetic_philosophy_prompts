answer: |-
  1. Begin by establishing that indicative conditionals express propositions with truth conditions, then introduce Adams' Thesis ($P(A \rightarrow C) = P(C|A)$), because the triviality proof functions as a reductio only if your students accept both assumptions simultaneously.
  2. Carry the session with a single urn example containing balls varying by color and shape, which must allow for easy updating of probabilities upon learning new information but must not require any modal logic notation.
  3. Prevent dismissal of Adams' Thesis by highlighting its intuitive pull before the proof begins, and head off the claim that conditionals lack truth conditions entirely by clarifying immediately after the contradiction that only truth conditions compatible with the thesis are ruled out.
  4. Conclude by asking whether they would rather deny that indicative conditionals express propositions or deny that their credence equals the conditional probability, forcing them to locate the specific cost of the result.
  5. Openly decline to cover possible worlds semantics or detailed expressivist alternatives, as these distract from the core probabilistic incompatibility being demonstrated at this introductory level.
