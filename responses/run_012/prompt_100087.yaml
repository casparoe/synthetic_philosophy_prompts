answer: |-
  You have put your finger on one of the most persistent and fruitful tensions in Hobbes scholarship. Your intuition is correct: the standard story that Hobbes simply "applied Euclid to politics" is often told too neatly, and your reconstruction of *why* geometry was the model contains a specific philosophical error that, once corrected, resolves both of your puzzles (the nature of the critics' objections and the choice of geometry over arithmetic or logic).

  Here is the resolution to your dilemma.

  ### 1. Where your picture of geometry goes astray

  Your working assumption is that Hobbes chose geometry because its axioms are **"plainly self-evident truths... the sort of thing you cannot deny without absurdity."**

  This is actually the opposite of Hobbes's view. For Hobbes, geometric truths are not certain because they correspond to an external reality that is self-evident. They are certain precisely because **we create the objects we are studying.**

  In Hobbes's materialist and nominalist metaphysics, we cannot have certain scientific knowledge of the natural world (physics) because we did not create it; we can only observe effects and hypothesize causes. We can never be sure our hypothesis is the *only* possible cause. However, in geometry, we define the circle. We stipulate what a line is. Because we generate these concepts through our own definitions, we can have certain knowledge of their properties.

  Hobbes writes in *De Corpore* that civil philosophy is demonstrable for the same reason geometry is: **"because we make the Commonwealth ourselves."**

  This is the crucial correction. Hobbes is not claiming that his political axioms are discovered truths about human nature that are as undeniable as "2+2=4." He is claiming that political philosophy is like geometry because it is **constructive**.
  *   **Geometry:** We define a figure $\rightarrow$ we deduce its properties.
  *   **Politics:** We define a Covenant/Sovereign (construct an Artificial Man) $\rightarrow$ we deduce the rights and obligations that follow from that construction.

  The certainty comes from the *stipulation*, not from the *observation*.

  ### 2. Why the critics attacked his psychology

  This correction solves your first puzzle regarding the critics. If Hobbes's "axioms" were truly self-evident logical truths (like the law of non-contradiction), critics would indeed be changing the subject by attacking his psychology.

  But because Hobbes's method is **constructive based on definitions**, the "axioms" of his political geometry are actually **definitions of human passions and motivations.**

  When Hobbes begins his deduction, he defines "human nature" in a specific way (e.g., humans are fundamentally egoistic, glory-seeking, and fearful; the state of nature is a war of all against all). In his view, these are the "principles of motion" for the human machine. He treats them as if they were geometric definitions.

  His critics (like Bishop Bramhall or the Earl of Clarendon) were not ignoring the rules of demonstration; they were attacking the **validity of the definitions.** They were effectively saying:
  > "You claim to be doing geometry, but your starting definitions do not match the reality of the material you are working with. You have defined 'man' incorrectly. Therefore, even if your logic is valid, your construction is useless."

  In Hobbes's specific version of "political geometry," the "axioms" are claims about human psychology. Therefore, attacking the psychology *is* attacking the axioms. The critics recognized that Hobbes was disguising controversial anthropological claims as neutral geometric starting points. They refused to grant him the stipulative authority he claimed. They argued that you cannot simply *define* humans as purely self-interested atoms any more than you can define a circle as a square; if the definition doesn't capture the thing, the demonstration is vacuous.

  ### 3. Why Geometry and not Arithmetic or Logic?

  Now we can address why geometry specifically was the model, rather than arithmetic or formal logic.

  **Why not Logic?**
  For Hobbes, traditional Scholastic logic was part of the problem. He viewed syllogistic logic as a manipulation of words that often obscured meaning rather than clarifying it. He wanted a philosophy of *bodies in motion*, not a philosophy of *terms*. Logic deals with language; Geometry deals with magnitude and motion. Since Hobbes is a materialist who believes everything (including thought) is motion, geometry is the science of motion par excellence.

  **Why not Arithmetic?**
  Arithmetic deals with discrete quantities (numbers). Politics and physics deal with continuous quantities (space, time, force, power). But more importantly, arithmetic is often seen as abstract. Geometry, for Hobbes, is the science of **consequences from the generation of figures.**

  The specific feature of geometry that Hobbes coveted was the **method of resolution and composition** (*resolutio-compositio*).
  1.  **Resolution:** You take a complex object (a Commonwealth) and resolve it into its universal parts (individual men, their passions, their rights).
  2.  **Composition:** You reconstruct the object from those parts to understand how it is generated.

  Arithmetic doesn't offer this causal, generative model in the same way. Geometry allows you to say, "If I move this line in this way, I generate this figure." Hobbes wants to say, "If men covenant in this way, they generate this Sovereign."

  ### Summary of the Resolution

  Your confusion stems from viewing Hobbes's "Euclideanism" as a claim about **epistemic self-evidence** (truths so obvious no one can deny them). It is actually a claim about **ontological construction** (truths we know because we made them).

  1.  **The Geometry Model:** Hobbes chose geometry not because its axioms are undeniable facts of nature, but because geometry is the science of **consequences from our own definitions.** We know geometry certainly because we define the figures. We can know politics certainly because we *construct* the Commonwealth.
  2.  **The Critics:** They were not refusing to play by the rules. They recognized that Hobbes's "definitions" of human nature were substantive, controversial empirical claims, not neutral stipulations. By attacking his psychology, they were attacking the adequacy of his "geometric" starting points.
  3.  **The Result:** The "geometry" was doing less logical work than Hobbes claimed, but more methodological work. It was a promise that if we *agree* to the definitions (the Covenant), the conclusions (Obligation) follow necessarily. The failure was not in the deduction, but in the universal assent to the premises.

  So, you were right to feel that something was wrong with the story that his axioms were "self-evident truths." They were **stipulative definitions of a machine** (the state) and its parts (men). The critics attacked the blueprint, not the math.
