  Risk-Weighted Utility and the Structure of Incomparable Outcomes

  **Research Question:** Can Risk-Weighted Expected Utility (REU) be extended to agents with partially ordered preferences over outcomes without violating its core structural axioms or collapsing into standard models of incomplete preferences?

  **Background:** REU theory modifies Expected Utility by applying a risk function to cumulative probabilities of outcomes ordered from worst to best. Proponents treat this ordering as a technical convenience. I argue it performs substantive work by presupposing a total value scale. The dispute centers on whether the ranking step is normatively inert. Consequently, REU appears silent on agents facing incomparable outcomes (e.g., weighing income loss against friendship loss). Existing defenses address risk attitudes but assume comparability, leaving open whether REU offers distinct normative guidance when values conflict inkind. If the ordering is not harmless, REU lacks resources for multi-attribute choice.

  **Methodology:** I will execute a formal analysis over ten weeks.
  1. **Case Construction:** Define finite choice sets containing outcomes with partial orderings (e.g., $A$ and $B$ are incomparable, but both better than $C$).
  2. **Candidate Extensions:** Formulate three extensions of the risk function: (i) forcing a linear extension, (ii) employing a set-valued risk function over compatible linear orders, and (iii) defining risk weights locally over comparable subsets.
  3. **Axiom Testing:** Test each extension against core REU axioms, specifically Transitivity, Continuity, and the Risk-Attitude axiom distinguishing REU from EU.

  **Failure Conditions:** This project has a determinate success condition. It fails if: (a) all candidate extensions violate consistency axioms, or (b) viable extensions reduce to standard incomplete preference models without utilizing the risk-function structure. If REU merely inherits the incompleteness problem of Expected Utility without resolution, the specific contribution of risk-weighting is null. This negative result is nonetheless a valid answer that settles the dispute.

  **Feasibility:** Given the ten-week constraint, a full representation theorem is impossible. I will restrict the scope to finite state spaces and specific partial order structures rather than general posets. I will not attempt to derive new representation theorems but will test existing axioms against the proposed extensions. The primary risk is that the problem collapses into the familiar literature on incomplete preferences, yielding no new insight specific to REU. However, demonstrating this collapse is itself a substantive contribution. I may cut the third candidate extension if time runs short.

  **Significance:** This question is worth pursuing even if the answer is negative. If REU cannot handle incomparability, its claim to generality over EU is weakened, restricting applicability to multi-attribute decision problems. If it can handle incomparability via the risk function, it offers a novel mechanism for resolving value conflicts distinct from standard approaches. Either outcome clarifies whether risk attitudes are separable from value comparability, a foundational issue in rational choice.
