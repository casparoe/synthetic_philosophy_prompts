      *   **Background/Gap:** REU relies on a total ordering of outcomes to apply the risk function to cumulative probabilities. Existing defenses assume comparability.
      *   **Methodology:** Construct finite cases with partial orders. Formulate extensions (e.g., linearization, set-valued risk functions). Test against axioms (e.g., Completeness, Continuity, specific REU axioms).
