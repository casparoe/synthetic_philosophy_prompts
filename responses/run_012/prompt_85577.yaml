      *   *Title:* Risk-Weighted Utility and the Problem of Incomparable Outcomes.
      *   *Introduction/Question:* REU theory modifies EU by weighting cumulative probabilities based on a ranking of outcomes from worst to best. This ranking presupposes a total order. My project asks: **Can the risk-weighting mechanism be coherently defined over partially ordered outcome spaces without collapsing into standard models of incomplete preferences?**
      *   *Background/Gap:* Proponents argue the ranking is merely technical. I argue it encodes a normative commitment to comparability. Existing defenses address risk attitudes but assume a unidimensional value scale. They leave open whether REU offers distinct guidance when values conflict inkind (e.g., health vs. friendship).
      *   *Methodology:* I will construct small finite choice sets where outcomes are partially ordered. I will formulate three candidate extensions: (1) forced linearization, (2) set-valued risk functions, and (3) local ordering. I will test these against core REU axioms, specifically focusing on whether the risk function retains its explanatory power when the 'worst-to-best' vector is undefined.
      *   *Failure Conditions:* The project fails if (a) all extensions violate core consistency axioms, or (b) the successful extensions reduce to existing models of incomplete preferences without leveraging the risk-function structure. If REU simply inherits the incompleteness problem of EU without resolution, the specific contribution of risk-weighting is null.
