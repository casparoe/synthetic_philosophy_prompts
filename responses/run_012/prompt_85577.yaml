      **Project Title:** Risk-Weighted Utility and the Structure of Incomparable Outcomes

      **Research Question:**
      Can Risk-Weighted Expected Utility (REU) be extended to agents with partially ordered preferences over outcomes without violating its core structural axioms or collapsing into standard models of incomplete preferences?

      **Problem Statement:**
      REU theory retains the expected utility framework but replaces linear probability weighting with a risk function applied to cumulative probabilities of outcomes ordered from worst to best. Proponents treat this ordering as a technical convenience. I argue it performs normative work by presupposing a total value scale. Consequently, REU appears silent on agents facing incomparable outcomes (e.g., weighing income loss against friendship loss). Existing defenses address risk attitudes but assume comparability, leaving open whether REU offers distinct normative guidance when values conflict inkind.

      **Methodology:**
      I will execute a formal analysis over ten weeks.
      1.  **Case Construction:** I will define finite choice sets containing outcomes with partial orderings (e.g., $A$ and $B$ are incomparable, but both better than $C$).
      2.  **Candidate Extensions:** I will formulate three extensions of the risk function to these cases: (i) forcing a linear extension (arbitrary ranking), (ii) employing a set-valued risk function over compatible linear orders, and (iii) defining risk weights locally over comparable subsets.
      3.  **Axiom Testing:** I will test each extension against core REU axioms, specifically focusing on Transitivity and the specific risk-attitude constraints that distinguish REU from EU.

      **Failure Conditions:**
      This project has a determinate success condition. It fails if: (a) all candidate extensions violate consistency axioms (impossibility result), or (b) the only viable extensions reduce to standard incomplete preference models without utilizing the risk-function structure. If REU merely inherits the incompleteness problem of Expected Utility without resolution, the specific contribution of risk-weighting is null. This negative result is nonetheless a valid answer.

      **Feasibility and Scope:**
      Ten weeks is tight for a full representation theorem. I will restrict the scope to finite state spaces and specific partial order structures (e.g., diamond lattices) rather than general posets. I will not attempt to derive new representation theorems but will test existing axioms against the proposed extensions. The primary risk is that the problem collapses into the familiar literature on incomplete preferences, yielding no new insight specific to REU. However, demonstrating this collapse is itself a substantive contribution, clarifying the limits of risk-weighted approaches.

      **Significance:**
      This question is worth pursuing even if the answer is negative. If REU cannot handle incomparability, its claim to generality over EU is weakened, restricting its applicability to multi-attribute decision problems. If it can handle incomparability via the risk function, it offers a novel mechanism for resolving value conflicts distinct from standard lexicographic or set-valued approaches. Either outcome clarifies whether risk attitudes are separable from value comparability, a foundational issue in rational choice theory.

