ms aren't effectively enumerable, or one that can't verify its own consistency — neither of which the theorem rules out. (7) Ada said that's a hollow victory: a machine whose axioms can't be listed by any procedure isn't a machine in any sense anyone cares about, and a machine that might be inconsistent would mean she could be wrong about arithmetic, which she isn't willing to grant.

