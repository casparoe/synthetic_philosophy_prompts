answer: |-
  You have correctly identified the bug in the code. Your hunch is not wrong; in fact, it is the precise reason the debate stalls. You are dealing with a category error that masquerades as an empirical dispute.

  Here is the diagnosis, broken down by your three questions.

  ### 1. What kind of disagreement is this?

  It is primarily a **verbal disagreement** rooted in conflicting **epistemologies of tradition**, disguised as an empirical one.

  When the "Pro" side asks, "Did it happen?" they are asking: *Is there a causal link between some past reality and this story?* They are operating under a philosophical assumption called **Euhemerism** (named after an ancient Greek thinker). This is the idea that myths are distorted history—that if you scrape away the gods and monsters, you will find a real king, a real battle, or a real migration underneath. For them, "happened" means "there is a non-zero historical kernel."

  When the "Con" side asks, "Did it happen?" they are asking: *Does the narrative accurately describe a specific event in time and space?* They are operating under **Historical Positivism**. For them, "happened" means "the story is a reliable report."

  Because they are using different definitions, new evidence never resolves the fight.
  *   **The Pro side** finds a destruction layer at Troy and says, "See? The war happened." (Meaning: A conflict occurred here.)
  *   **The Con side** looks at the same layer and says, "This doesn't match the timeline or scale of the poem." (Meaning: The story is not a faithful record.)

  Both are technically correct, but they are answering different questions. The Pro side is defending the *existence of a cause*; the Con side is attacking the *accuracy of the effect*.

  There is also a secondary layer regarding **burden of proof**. The Con side treats the story as a claim that requires verification (like a unit test failing until proven otherwise). The Pro side treats the story as a surviving artifact that requires explanation (like a log file that exists, so something must have generated it). Neither side can prove their standard is the correct one because that standard is an axiom, not a conclusion.

  So, to answer your specific options: It is verbal (different definitions of "happened"), but it is sustained by bedrock intuition about how culture transmits information. One side intuits that culture is a **vessel** (it carries truth forward); the other intuits that culture is a **lens** (it refracts and changes truth). You cannot shovel your way out of a metaphor.

  ### 2. Is this one debate, or three?

  It is three distinct debates wearing one hat. Porting the logic from one to the others is a major source of the noise.

  **Troy is an Archaeological Problem.**
  *   **Structure:** There is a physical site. There are destruction layers. The text describes a siege.
  *   **The Dispute:** It is about *correlation*. Which layer matches the text? Is Layer VI the war, or Layer VIIa?
  *   **Why it stalls:** Because "The Trojan War" in the *Iliad* is likely a compression of centuries of warfare into a single narrative event. The archaeologists are looking for a single event; the dirt shows centuries of conflict. The debate stalls because both sides are trying to force a one-to-one mapping between a poem and a stratum.

  **The Exodus is a Theological/Sociological Problem.**
  *   **Structure:** There is no agreed-upon site. The scale in the text (2 million people) is archaeologically impossible in the Sinai.
  *   **The Dispute:** It is about *scale and identity*. For many, the Exodus is a founding myth. Denying it feels like denying the existence of the people.
  *   **Why it stalls:** The Pro side often shifts the goalposts from "The Biblical Exodus" to "A Small Group of Semites Left Egypt." The Con side argues against the Biblical Exodus. They are debating different events. Furthermore, absence of evidence is not evidence of absence, but in a desert, absence of evidence is *highly probable* regardless of truth. This makes empirical resolution nearly impossible.

  **Arthur is a Literary Problem.**
  *   **Structure:** The sources are texts written centuries after the fact. The "evidence" is often other stories.
  *   **The Dispute:** It is about *attribution*. Was there a 5th-century war leader named Arthur, or is he a composite of several leaders + a bear god + folklore?
  *   **Why it stalls:** Because the "Arthur" we argue about is the Medieval literary figure, but the "Arthur" that might have existed was a post-Rural British chieftain. The name is the same; the referent is completely different.

  When you treat these as one debate, you assume a "Historical Kernel" exists in all three. But for Arthur, the kernel might be purely literary. For Troy, it's military. For Exodus, it's demographic. Applying the "Troy Standard" (find the destruction layer) to the Exodus (find the campsite) is a category error. Nomads don't leave the same traces as cities.

  ### 3. What would actually count as progress?

  Progress will not come from a shovel. It will come from **refactoring the question**.

  The current question is Boolean: `Did_Event_Happen = True/False`.
  This is the wrong data type for historical tradition.

  **Progress looks like shifting from "Verification" to "Genealogy."**
  Instead of asking "Did this happen?", historians make progress by asking "How was this story constructed?"
  *   **Bad Question:** Did King Arthur exist?
  *   **Good Question:** What political needs in the 9th century caused Welsh bards to consolidate earlier folklore into a single leader figure?

  If you ask the second question, the "Yes/No" fight dissolves. It doesn't matter if a specific man named Arthur existed; what matters is that the *concept* of Arthur was built to unify a resistance against Saxons. That is a historical fact, regardless of the man.

  **Progress looks like accepting "Accretion."**
  Your intuition about accretion is the modern historical consensus. History is not a movie recording; it is a palimpsest. A story like the Exodus is likely a memory of the Hyksos expulsion + a memory of the Amarna period + a memory of later labor gangs, all welded together during the Babylonian Exile to create a national identity.
  *   **The Shift:** Admitting that "It happened" is a meaningless phrase unless you specify *which part*.
  *   **The Progress:** When the Pro side stops claiming "The Exodus happened" and starts saying "The narrative contains memories of Egyptian servitude," and the Con side stops saying "It's a lie" and starts saying "It's a theological construct using historical motifs," they are actually agreeing.

  **Progress looks like admitting Undecidability.**
  Some states are null. For Arthur, we may never know. The honest answer is not "We haven't found the proof yet," it is "The signal-to-noise ratio in the source material is too low to resolve."
  *   **The Shift:** Moving from "Not Proven" (implying we just need more data) to "Unprovable" (implying the data required no longer exists).
  *   **The Progress:** This kills the hope that keeps the debate alive. The Pro side needs hope that the next dig will vindicate them. The Con side needs hope that the next dig will silence them. Admitting the limit ends the cycle.

  ### Summary Diagnosis

  You are watching two groups fight over a pointer in memory that points to `NULL`.

  The "Pro" side believes the pointer references an object (a real event). The "Con" side believes the pointer is dangling (a myth). But in cultural history, the pointer often references a *distributed object*—a thousand small events, feelings, and political needs that were garbage-collected and merged into a single variable name like "Arthur" or "Exodus."

  The debate stalls because both sides are trying to dereference a variable that doesn't hold a single value.

  **The Fix:**
  Stop asking if the story is a **map** (which can be accurate or inaccurate). Start treating the story as a **artifact** (which exists regardless of what it depicts). The question isn't "Does this map match the territory?" The question is "Why did someone draw this map, using these landmarks, at this time?"

  That is a question archaeology, text analysis, and sociology can actually answer. The "Did it happen?" question is a philosophical trap that guarantees a stalemate.
