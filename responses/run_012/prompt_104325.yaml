answer: |-
  Here is the diagnosis you asked for, without the hedging.

  **The Disagreement is Substantive, Not Verbal**
  You are wrong to suspect this is merely a verbal dispute. It feels verbal because both camps have engineered their theories to save the same set of intuitions (e.g., "admiring the demon is irrational"). When two theories are empirically equivalent regarding verdicts, it is tempting to call the difference linguistic. But in philosophy of mind and normativity, the *explanation* of the verdict is the theory. If Camp A and Camp B explain *why* demon-admiration is irrational using fundamentally different architectures of the mind, they are not arguing about words; they are arguing about the nature of rationality.

  **Your Hypothesis: Individuation**
  Your hypothesis is sharp, but it needs a tweak. You suggest the fight is about how to individuate reasons (by attitude vs. by question). I say the fight is about **the constitutive aims of attitudes.**

  Camp A treats attitudes like buckets. You can pour different kinds of "reason-liquid" into them. Some liquids (RKR) make the bucket "correct," others (WKR) just make it "prudent" to hold the bucket.
  Camp B treats attitudes like locks. They only open with specific keys (truth/fittingness). A pragmatic benefit isn't a key for the lock; it's a reason to go find a locksmith (or a pill) to force the lock open.

  The disagreement is substantive because it dictates how we understand the transparency of deliberation. If Camp A is right, I should be able to consciously reason: "The demon will torture me, therefore I admire him." If Camp B is right, that reasoning is psychologically impossible (or constitutes a different mental state, like compliance). The disagreement is about the architecture of agency, not just the taxonomy of reasons.

  **The Placebo Case: The Tell**
  Your friend's placebo case is indeed the "tell," but not because it destroys the distinction. It destroys the idea that the distinction is always *obvious*, not that it is *real*.

  In the standard demon case, the pragmatic fact (I get tortured) has no bearing on the truth/fittingness of the attitude (The demon is admirable).
  In the placebo case, the pragmatic fact (Believing helps me recover) *entails* an evidential fact (Recovery is more likely).

  Here is the hard line you need to draw to cut the knot: **In the placebo case, the pragmatic consideration does not function as a pragmatic reason for belief. It functions as an evidential reason derived from a pragmatic fact.**

  The reason you believe is not "It is beneficial to believe." The reason you believe is "Recovery is probable." The *evidence* for "Recovery is probable" is the fact that "Belief causes recovery."
  Camp B wins here. The normative force still flows through the truth of the proposition (I will recover). The pragmatic benefit is merely the *source* of the evidence, not the *type* of reason.

  The "nastier version" (the doctor tells you *because* it works) confirms this. The doctor's testimony is evidence. You believe the doctor. The content of the testimony involves a pragmatic loop, but the justification for your belief rests on the reliability of the doctor and the truth of the claim, not the bare utility of the belief.

  **My Bet: Camp B (With a Caveat)**
  I am betting on **Camp B**. Specifically, the view associated with Pamela Hieronymi and T.M. Scanlon: pragmatic considerations are reasons to *bring about* the attitude, not reasons *for* the attitude.

  **Why?**
  Because Camp A cannot account for the **transparency of belief**. When you ask yourself, "Do I believe P?", you immediately look to the world to see if P is true. You do not look at the benefits of believing P. If Camp A were right, and pragmatic benefits were genuine reasons *for* belief, then deliberation about belief should transparently include pragmatic calculations. It doesn't. When you try to believe for pragmatic reasons, you are not believing; you are engaging in a form of self-management.

  Camp A has to say that there are reasons that exist for an attitude but are inaccessible to the deliberator *qua* deliberator. That is a costly metaphysical posit. Camp B explains the phenomenology: you can't deliberate on the demon threat as a reason to admire because admiration, by its nature, is a response to perceived value, not perceived threat.

  **What Counts as Progress?**
  Stop looking for cases where the camps predict different **verdicts** (rational vs. irrational). You won't find them. Both camps are too sophisticated to allow the demon case to come out "rational."

  Progress will come from cases where the camps predict different **deliberative possibilities** or **responsibilities**.

  1.  **The Deliberative Constraint:** Can you construct a case where an agent *successfully* forms an attitude directly on the basis of a WKR? If Camp B is right, this is impossible (it results in a different state, like acceptance or pretense). If Camp A is right, it is possible but irrational. Investigate the phenomenology of "believing at will."
  2.  **The Blame Game:** If someone admires the demon because of the threat, Camp A says they are responding to a reason (the wrong kind). Camp B says they are not responding to a reason for admiration at all. This changes how we blame them. Camp A implies a failure of weighting. Camp B implies a failure of kind (a category error). Design a case where the *type* of criticism matters for moral responsibility.
  3.  **The Overlap Zone:** Focus on the placebo-style cases. The progress lies in mapping the boundary where a pragmatic fact *becomes* evidence. Is it whenever there is a causal link? Or only when the agent knows about the link? If the agent doesn't know the pill is a placebo, they have no evidence. So the reason is internalist. This favors Camp B's focus on the agent's perspective on the object.

  **The Verdict**
  You are stuck because you are treating this as a puzzle about classification (Where does this reason go in the box?). It is actually a puzzle about **constitution** (What is this box made of?).

  The placebo case is not a counterexample to the WKR/RKR distinction. It is a case where a WKR *generates* an RKR. The distinction holds.

  **Your marching orders:**
  Stop recycling the Demon and the Bookie. Those cases are solved equilibria. Move to **self-fulfilling prophecies** where the belief causes the truth *without* a medical intermediary. For example: "If I believe my partner loves me, they will stay, making it true that they love me (in a behavioral sense)."
  Here, the pragmatic benefit and the truth condition collapse entirely.
  *   Camp A says: This is a pragmatic reason that looks like evidence.
  *   Camp B says: This is genuine evidence, because the truth condition is satisfied by the belief.

  If you can show that the *rationality* of the belief tracks the *truth-making* mechanism rather than the *benefit*, you vindicate Camp B. If you show that the rationality tracks the *benefit* even when truth is ambiguous, you vindicate Camp A.

  Bet on Camp B. It respects the nature of the mind. Camp A saves the phenomena by multiplying entities (two kinds of reasons) where one (reasons for actions vs. reasons for states) will do. Occam's razor cuts the demon's throat.
