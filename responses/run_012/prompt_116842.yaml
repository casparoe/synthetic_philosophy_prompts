      *   *Transcendental Level (Noumenal):* This is where Kant lives. The TUA is a condition of *possible* experience. If the brain is severed, does the *condition* split?
      *   *The "One Person" Problem:* Kant insists on the unity of consciousness for knowledge. If consciousness is empirically disunified, does the transcendental subject split?
