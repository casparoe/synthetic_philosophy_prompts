      *   **Why?** Because morality requires *conceptualization* of the law (language/logic). Pointing is pre-conceptual.
      *   **The Breakdown:** This forces Kant to admit that the "moral feeling" (Right) can be truer than the "moral reasoning" (Left), which undermines his intellectualism. He has to patch it by calling the Right's action "instinct" or "pathological" (in the sense of pathos/feeling), not rational.
      *   **The "One Noumenal/Two Empirical" Patch:** It is coherent *only if* you accept that time/space (where the split happens) don't apply to the noumenal. But it strains the link between noumenal will and phenomenal action.

