answer: |-
  You have identified a precise and structurally significant dialectical movement that is central to contemporary philosophy of mind and value theory, yet you are correct that there is no single, canonical term that captures the *entire shape* of the argument as you have described it.

  The standard label for the *premise* of your problem is **"The Heterogeneity of Pleasure"** (or the Heterogeneity Problem). This term, widely used since the work of G.E. Moore and revitalized by Fred Feldman and Chris Heathwood, names the empirical claim that there is no single phenomenal quality shared by all pleasures. However, as you suspect, "Heterogeneity" names the *data*, not the *dialectic*. It does not capture the subsequent move to functionalism nor the worry that this move evacuates the phenomenon.

  There is no established term in the literature that specifically names the *transition* from phenomenal unity to functional unity under the threat of heterogeneity, along with the accompanying charge of revisionism. Because this is a graduate seminar and you are looking for conceptual clarity, I will first analyze why the neighboring concepts fail to capture this shape, and then propose a coined term that isolates the specific structural vulnerability you are describing.

  ### 1. Why Neighboring Concepts Fall Short

  To see why a new term is warranted, we must distinguish your dialectic from four nearby concepts:

  *   **Family Resemblance (Wittgenstein):** This concept dissolves the problem rather than describing the dialectic. If pleasure were a family resemblance concept, we would accept from the start that there is no common property. The hedonist, however, *needs* a common property to ground the theory (e.g., "maximize pleasure"). The dialectic you describe is the *struggle* to find unity in the face of heterogeneity, not the acceptance of its absence.
  *   **Determinable-Determinate:** This is often the hedonist's first defense (e.g., "pleasantness is a determinable quality like 'redness'"). However, your dialectic arises precisely when this move fails. Critics argue that unlike "red," which has a visual spectrum, "pleasantness" has no introspective content independent of the specific pleasures. Your dialectic describes the *collapse* of the determinable account into the functional account.
  *   **Functionalism:** This is the *solution* offered in the second half of your dialectic, not the name of the problem shape. Functionalism defines mental states by their causal roles. While the hedonist adopts functionalism to save the theory, the *worry* you articulate is that functionalism about pleasure incurs a specific cost that functionalism about, say, "belief" might not.
  *   **The Revisionism Objection:** This names the *critique* of the functional move ("you are changing the subject"), but it does not name the *pressure* that forced the move in the first place.

  ### 2. A Proposed Coinage: "The Phenomenal-Functional Displacement"

  Since no established term captures the specific arc from *Phenomenal Expectation* $\rightarrow$ *Heterogeneity* $\rightarrow$ *Functional Rescue* $\rightarrow$ *Phenomenal Loss*, I propose the term **"The Phenomenal-Functional Displacement" (PFD)**.

  **Definition:**
  The Phenomenal-Functional Displacement is a dialectical structure in which a mental or normative kind ($K$) is initially presumed to be unified by a shared intrinsic phenomenology. When empirical or introspective evidence reveals $K$ to be phenomenally heterogeneous, theorists redefine $K$ functionally (by role, attitude, or effect) to preserve the kind's extension. This rescue succeeds in unifying the extension but generates a charge that the original phenomenal essence has been displaced or evacuated, rendering the theory revisionist.

  **Boundary Conditions (What counts as an instance):**
  1.  **Phenomenal Primacy:** The folk concept or initial theory must rely on the *feeling* or *intrinsic quality* as the primary identifier of the kind. (Pain and pleasure qualify; "belief" or "knowledge" do not, as they are not primarily defined by a specific quale).
  2.  **Heterogeneity Pressure:** There must be a credible argument that the instances do not share a common quality.
  3.  **Functional Rescue:** The theorist must attempt to save the *extension* of the kind (keep counting the same things as $K$) by switching to a *functional* definition.
  4.  **Phenomenal Cost:** The functional definition must be vulnerable to the charge that it leaves out the "what-it-is-like" aspect that made the kind interesting in the first place.

  **What is NOT an instance of PFD:**
  *   **Vagueness:** The problem of "how many hairs make a bald man" is about boundary precision, not the lack of a common intrinsic property across clear cases.
  *   **Simple Reduction:** Identifying "water" with "H2O" is not PFD because "water" was never defined by a specific internal feeling, but by observable properties.
  *   **Eliminativism:** If the theorist says, "Pleasure doesn't exist," they have not displaced the phenomenon; they have denied it. PFD requires an attempt to *save* the concept.

  ### 3. Application to Other Domains

  You asked if this pattern arises elsewhere. It does, which suggests PFD is a general structural problem in philosophy of mind and ethics, though it is most acute in the case of pleasure.

  *   **Pain:** This is the strongest parallel.
      *   *Phenomenal Expectation:* Pain is a specific hurtful feeling.
      *   *Heterogeneity:* "Mad Pain" (Lewis) or pain without distress (hypnotic analgesia) or distress without pain.
      *   *Functional Rescue:* Define pain as "the state typically caused by damage and causing avoidance."
      *   *Phenomenal Cost:* The "Absent Qualia" objection. If a robot avoids damage but feels nothing, is it in pain? The functional definition displaces the hurt.
  *   **Emotion:**
      *   *Phenomenal Expectation:* Emotions are feelings (fear feels like arousal).
      *   *Heterogeneity:* Fear can be cold/calm or hot/panicked.
      *   *Functional Rescue:* Appraisal theories or Functional Role theories (Fear is the state that detects threat).
      *   *Phenomenal Cost:* The worry that this reduces emotion to cold cognition, losing the "affect."
  *   **Virtue:**
      *   *Phenomenal Expectation:* Less relevant. Virtues are not primarily defined by feelings.
      *   *Heterogeneity:* Courage in battle vs. courage in illness.
      *   *Functional Rescue:* Virtue is what leads to *eudaimonia* or fulfills a function.
      *   *Phenomenal Cost:* Lower. Because virtues are not essentially phenomenal, the PFD is weaker here. This confirms that PFD is specific to *phenomenal kinds*.

  ### 4. Why the Pleasure Case is Distinctive

  While PFD applies to pain and emotion, the pleasure case has a distinctive structure that justifies your focus on it in a hedonism seminar.

  1.  **Normative Weight:** Pleasure is not just a mental state; it is the *good*. In pain, we want to explain the sensation. In hedonism, we want to explain *value*. If you displace the phenomenology of pleasure, you risk disconnecting value from experience entirely. If pleasure is just "what we desire," and we can desire things without experiencing them (e.g., posthumous fame), the link between *well-being* and *conscious life* is severed. This makes the "Phenomenal Cost" in the pleasure case much higher than in the pain case.
  2.  **The Attitudinal Shift:** In pain, the functional rescue is usually causal (avoidance). In pleasure, the functional rescue is often *attitudinal* (desiring, taking pleasure in). This creates a specific risk of circularity (Hedonism: "Pleasure is the good." Definition: "Pleasure is what you desire." Question: "Why desire it?" Answer: "Because it's good."). This circularity is a specific subtype of the Phenomenal-Functional Displacement unique to value theory.
  3.  **Introspective Opacity:** With pain, the "hurt" is vivid. With pleasure, the "feel" is often elusive (as your seminar examples show). This makes the displacement easier to execute but harder to detect. The theorist can say, "Look, the functional role is what matters," and it is harder to point to the missing quale than it is with pain.

  ### 5. Summary for Your Seminar

  When you return to your seminar, you can frame the discussion using this structure:

  1.  Acknowledge that **"The Heterogeneity Problem"** is the standard name for the *premise*.
  2.  Argue that the *dialectical shape* is better described as **"The Phenomenal-Functional Displacement."**
  3.  Use this term to pinpoint the exact moment the hedonist risks changing the subject: not when they admit heterogeneity, but when they propose a functional account that preserves the *list* of pleasures while discarding the *feeling* of pleasure.
  4.  Distinguish this from **Family Resemblance** (which gives up on unity) and **Determinables** (which try to save phenomenology).

  This carving allows you to ask the precise question: *"Is the functional rescue of hedonism a legitimate theoretical refinement, or is it an instance of Phenomenal-Functional Displacement that severs the link between well-being and experience?"* This moves the conversation beyond "Is there a common feeling?" to "What is the cost of saying there isn't?" which is the deeper philosophical issue.
