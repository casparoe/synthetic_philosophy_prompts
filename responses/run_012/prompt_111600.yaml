answer: |-
  Here is a structural plan for the ninety-minute session. It is designed to move the audience from a naive definition of thought to a functional understanding of linguistic relativity, using *Tavoshan* as the controlled variable rather than a curiosity.

  ### I. The Sequence of Ideas (The Order of Arrival)

  You cannot ask if language shapes thought until the audience agrees on what "thought" is independent of language. If they believe thought *is* inner speech, the hypothesis is tautological.

  1.  **Thought as Non-Linguistic Discrimination (Minutes 0–15)**
      *   **Goal:** Establish that cognition exists without words.
      *   **Concept:** Thought is not "talking to yourself." It is the ability to discriminate, categorize, and remember.
      *   **Activity:** Show two shades of teal. Ask if they are different. (They are). Ask if English has a common, single-word name for that specific distinction. (It does not).
      *   **Conclusion:** You can think (perceive/discriminate) what you cannot say. This kills the "prison" misconception before it takes root.

  2.  **The Habit of Attention (Minutes 15–30)**
      *   **Goal:** Shift the question from "Can I?" to "Do I habitually?"
      *   **Concept:** Language does not block ability; it imposes a *tax* on attention. It forces you to pay attention to specific details every time you speak.
      *   **Misconception Intercept 1 (Determinism):** Explicitly state: "We are not asking if language *forbids* thought. We are asking if language *trains* thought." Use the analogy of a path through a field: walking the same path doesn't make the grass elsewhere invisible, but it makes the path easier to walk.
      *   **Dependency:** This relies on Step 1. If they don't accept non-linguistic thought, they will view the "path" as a "wall."

  3.  **The Tavoshan Laboratory (Minutes 30–65)**
      *   **Goal:** Test the "Habit of Attention" using your artificial language.
      *   **Deployment:** *Tavoshan* is the **spine** of the evidence phase, not just a closing test. You will introduce its features sequentially to isolate variables.
      *   **Feature A (Colour):** Introduce the Blue/Green merger.
          *   *Task:* Show a blue chip and a green chip. Ask a Tavoshan speaker (role-played by you) to describe them. They must use the same word.
          *   *Question:* Does the speaker *see* them as identical? (Refer back to Step 1: No).
          *   *Whorfian Question:* Does having to group them linguistically make it slightly harder to *remember* which was which later? (Cite real psycholinguistic data on memory latency, not just logic).
      *   **Feature B (Evidentials):** Introduce the obligatory knowledge particles (Seen, Inferred, Heard).
          *   *Task:* Describe an event (e.g., "The window broke"). In English, you *can* add "I saw it." In Tavoshan, you *must* mark the source.
          *   *Whorfian Question:* If you are forced to mark the source every time, do you become more attentive to the source of your information in your memory?
      *   **Dependency:** This relies on Step 2. The audience must understand that we are looking for *habitual attention*, not *biological incapacity*.

  4.  **The Boundary of Translation (Minutes 65–75)**
      *   **Goal:** Address the second misconception without derailing the main argument.
      *   **Misconception Intercept 2 (Translation Impossibility):**
      *   **Concept:** If Tavoshan requires evidentials, can an English speaker understand a Tavoshan story? Yes. But they have to work harder to supply the context the Tavoshan speaker was forced to provide.
      *   **Conclusion:** Translation is not impossible; it is asymmetric in effort. Language shapes the *speaker's* cognitive load, not the *listener's* potential understanding.

  5.  **Verification and Limits (Minutes 75–90)**
      *   **Goal:** Assess understanding and define scope.
      *   **Activity:** The "Third Language" test (see Assessment below).
      *   **Refusals:** Explicitly state what the session did not solve (see Refusals below).

  ---

  ### II. Deploying Tavoshan

  **Role:** Tavoshan is the **experimental apparatus**. Do not teach it as a language to be learned; teach it as a machine with specific levers.

  **What it Must Have:**
  1.  **Obligation, not Vocabulary:** You must emphasize that English *has* words for "hearsay" (e.g., "allegedly," "I heard"). The difference is that in English, using them is optional/poetic. In Tavoshan, omitting the particle is ungrammatical, like saying "He go" instead of "He goes."
      *   *Why:* This distinguishes "having a concept" from "being forced to attend to a concept."
  2.  **Visual Aids for Particles:** Do not make them memorize Tavoshan words. Use icons on slides (e.g., an Eye for Direct, a Lightbulb for Inference, an Ear for Hearsay). This keeps the cognitive load on the *logic*, not the vocabulary.

  **What it Must Lack:**
  1.  **Cultural Baggage:** Do not invent a culture for the Tavoshan speakers. No "Tavoshan people live in the mist." Keep it abstract. If you give them a culture, the audience will attribute the cognitive effects to the environment (mountains/mist) rather than the grammar.
  2.  **Complexity:** Do not add gender, tense, or case. Only Colour and Evidentials. Any other feature will distract from the mechanism of *obligatoriness*.

  **The Critical Distinction to Drill:**
  Midway through the Tavoshan section, stop and ask the audience: *"In English, can I say 'I heard it rained'?"* (Yes). *"In Tavoshan, can I say 'It rained' without marking how I know?"* (No).
  *   **Point:** English offers a tool; Tavoshan enforces a rule. The hypothesis is about the effect of the *enforced rule* on habit.

  ---

  ### III. Intercepting Misconceptions

  **1. The "Prison" Misconception (Language = Thought Limits)**
  *   **When:** Minutes 15–20 (Immediately after defining non-linguistic thought).
  *   **How:** Use the "Colour Blindness" analogy.
      *   *Say:* "If Sapir-Whorf were strong, a Tavoshan speaker would be colorblind to the difference between blue and green. We know they aren't. They can sort the chips perfectly. The question is only: does the language make them *slower* to sort them when they are distracted?"
      *   *Why:* This lowers the stakes. It moves the claim from "They live in a different reality" to "They have a different cognitive habit." This fits an adult-education audience better than metaphysical claims.

  **2. The "Translation" Misconception (Untranslatability)**
  *   **When:** Minutes 65–75 (After the Evidential task).
  *   **How:** Use the "Instruction Manual" analogy.
      *   *Say:* "If I give you a Tavoshan sentence 'It rained [HEARSAY]', you understand it perfectly in English. But if I give you an English sentence 'It rained' and ask you to translate it to Tavoshan, you are stuck. You have to ask me: 'How do you know?'"
      *   *Why:* This clarifies that the "shape" happens during *encoding* (speaking/memory formation), not *decoding* (understanding). It prevents the audience from concluding that cross-cultural understanding is impossible.

  ---

  ### IV. Assessment: Understanding vs. Persuasion

  Do not ask "Do you agree?" (That measures persuasion). Do not ask "What is the hypothesis?" (That measures memory).

  **The "New Language" Test (Minutes 80–85)**
  Present a feature of a *real* language they likely don't know, and ask them to predict the cognitive effect *using the logic of the session*, avoiding the misconceptions.

  *   **Prompt:** "In Guugu Yimithirr (an Australian language), there are no words for 'left' or 'right'. You must use cardinal directions (North, South, East, West) for everything. You would say 'There is an ant on your South-West leg.' Based on what we learned about Tavoshan today, which of the following is the likely effect on the speaker?"
  *   **Options:**
      1.  They cannot understand the concept of 'left' or 'right'. (The Prison Trap)
      2.  They have a better sense of orientation than English speakers, but can still learn 'left' if taught. (The Habit/Attention Target)
      3.  It is impossible to translate their directions into English. (The Translation Trap)
  *   **Success Criteria:** If the majority selects Option 2 and can articulate *why* (because the language forces habitual attention to orientation, not because it biologically alters the inner ear), they have understood the hypothesis.

  ---

  ### V. What to Openly Refuse to Settle

  To maintain intellectual honesty and fit the time limit, explicitly state these three boundaries at the start or end:

  1.  **The Neuroscience:** "We will not discuss *how* this happens in the brain. We are discussing behavioral evidence, not neural wiring."
  2.  **The Value Judgment:** "We will not discuss whether one language is 'better' or 'more logical.' A language that forces evidentials isn't 'truer,' it just tracks information sources differently."
  3.  **The Historical Debate:** "We will not untangle what Sapir said vs. what Whorf said vs. what Boas said. We are examining the *idea* known popularly as Sapir-Whorf, not the history of linguistics."

  ### Summary of Dependencies
  *   You cannot prove **Relativity** (Habit) without first disproving **Determinism** (Prison).
  *   You cannot disprove Determinism without first defining **Thought** as non-linguistic.
  *   You cannot demonstrate the **Habit** without **Tavoshan's Obligation** (vs. English Option).
  *   You cannot validate the **Habit** without distinguishing **Encoding** (Speaker) from **Decoding** (Listener/Translation).
