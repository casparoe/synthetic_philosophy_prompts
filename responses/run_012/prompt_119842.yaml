answer: |-
  # Question-Period Prep Sheet

  **Context:** 30-minute Q&A, mixed audience (Complexity, Philosophy, Stats).
  **Goal:** Defend the distinction between representation/class hardness and the normative claim that resource-indexing creates *different* theories, not just constrained versions of one theory.
  **Strategy:** Concede technical nuances quickly to gain credibility with theorists, then pivot back to the normative implication. Do not get bogged down in proving a lower bound; argue about the *implications* of the bounds we accept.

  ---

  ### 1. The Average-Case Objection (High Likelihood / High Damage)
  **Who:** Complexity Theorist.
  **Phrasing:** "You're leaning on worst-case hardness to make a normative claim about finite agents. But rational agents don't face worst-case inputs; they face distributions shaped by their environment. Unless you show these problems are hard on average (e.g., under Levin's distribution), worst-case intractability is irrelevant to what an agent *ought* to do. Why shouldn't the norm be 'Bayes on typical inputs'?"

  **Reply (2 min):**
  "I agree that worst-case hardness alone is insufficient for a descriptive theory of cognition. But a *normative* theory requires guarantees. If I prescribe a rule that fails catastrophically on a subset of inputs, I need to justify why the agent is licensed to ignore that subset. 'Typical inputs' presumes a fixed environment. But epistemology often asks what one ought to believe when the environment is unknown or adversarial. If the problem is class-hard, there is no efficient algorithm that works for *all* distributions. Therefore, a norm that ignores resources implicitly assumes the agent has access to a specific, benign distribution. My claim is that once you fix the resource class, the 'correct' updating rule changes fundamentally, not just in speed. We aren't trading accuracy for speed; we are trading one logic for another."

  **Concede:** Worst-case hardness is not enough for a *descriptive* model of human reasoning.
  **Weakness:** If they press that *norms* should also be environment-relative, you risk fragmenting rationality so much it loses meaning.

  ### 2. The Triviality Charge (High Likelihood / High Damage)
  **Who:** General Audience / Referee Echo.
  **Phrasing:** "This sounds like 'bounded rationality,' which we've known about since Simon. Saying 'agents have limits' is trivial. Saying 'therefore we need different normative theories' seems to just add a footnote about running time to standard Bayesianism. What work is the complexity class actually doing, other than saying 'agents are finite'?"

  **Reply (2 min):**
  "It's trivial if you think resource constraints just mean 'the same answer, but later.' My claim is stronger: different resource classes validate different *inference rules*. In P, you might be obligated to use a heuristic that is provably incoherent by Bayesian standards (e.g., violating conjunction rules) because the coherent rule is inaccessible. If the norm is 'maximize expected utility,' and that function is uncomputable for your class, the norm is undefined, not just hard. I'm not adding a footnote to Bayesianism; I'm arguing that for resource class C, the normative theory is *not* Bayesianism. It's a different logic entirely. That's not a constraint on a theory; it's a selection of a theory."

  **Concede:** Bounded rationality literature exists and is relevant.
  **Weakness:** You must be ready to name a specific inference rule that changes, not just speak abstractly about "different logics."

  ### 3. The Normativity Collapse (High Likelihood / High Damage)
  **Who:** Philosopher of Science.
  **Phrasing:** "If rationality is indexed to resources, aren't you collapsing the normative into the descriptive? If what I *ought* to do depends on what I *can* do, then 'rational' just means 'feasible.' How is this still a theory of rationality and not just engineering?"

  **Reply (2 min):**
  "Engineering asks 'how do I build this?' Normativity asks 'what counts as success?' My claim is that 'success' is undefined without resources. Consider logic: classical logic is undecidable. Intuitionistic logic is decidable. If you are a finite agent, prescribing classical logic as the norm for belief revision is prescribing a function that doesn't exist for you. Indexing by resources doesn't lower the bar; it ensures the bar is placed on ground that exists. It remains normative because within a resource class, there are still better and worse algorithms. You can still be irrational relative to your bounds."

  **Concede:** The line between 'feasible' and 'rational' does blur more than in ideal theory.
  **Weakness:** If they argue that 'ought implies can' is a platitude, you need to show why your version is substantive, not just a restatement of that principle.

  ### 4. The Non-Uniformity/Advice Objection (Medium Likelihood / Medium Damage)
  **Who:** Complexity Theorist (Circuit/Lower Bounds).
  **Phrasing:** "You're talking about uniform machines (Turing machines). But agents are finite physical objects. They are more like non-uniform circuits. For any fixed input size, there exists a circuit that solves the problem. Why does asymptotic class hardness matter for a finite agent who could, in principle, have the right advice string hardwired?"

  **Reply (2 min):**
  "Two responses. First, the size of the advice string required to solve NP-hard problems for input size $n$ grows super-politically. To hardwire the solution is to require a physical complexity that exceeds the agent's own complexity. Second, and more importantly, learning. An agent isn't a static circuit; it's a system that updates. The hardness of *updating* the circuit (learning the advice) is the bottleneck. If the learning rule is intractable, the static existence of a solution is normatively irrelevant. The agent can't get there from here."

  **Concede:** For a *single* fixed instance, non-uniform complexity is the right measure.
  **Weakness:** If they argue that evolution provides the "advice," you need a reply about environmental shift (the advice becomes obsolete).

  ### 5. The "SAT Solvers Work" Objection (Medium Likelihood / Medium Damage)
  **Who:** Statistician.
  **Phrasing:** "You keep saying these problems are intractable. But I solve huge instances of SAT and Bayesian inference daily using sampling and modern solvers. They work fast enough. Why should philosophy care about asymptotic limits when practice ignores them?"

  **Reply (2 min):**
  "Practical success relies on structure in the data that worst-case analysis ignores. But norms must cover the cases where the structure isn't there. If your normative theory says 'maximize utility,' and the agent encounters a problem instance where the solver times out, what does the norm prescribe? 'Try harder'? My point is that the norm needs a fallback for when the solver fails. If the fallback is 'guess,' then the normative theory for that resource class includes guessing as a rational act, which standard Bayesianism forbids."

  **Concede:** Heuristics are incredibly effective for *most* real-world instances.
  **Weakness:** This risks conceding that the "hard" cases are rare edge cases, weakening the claim that this is a general problem for rationality.

  ### 6. The Approximation Objection (Medium Likelihood / Medium Damage)
  **Who:** Complexity Theorist / Statistician.
  **Phrasing:** "Rationality doesn't require exact maximization. It requires $\epsilon$-approximation. Many NP-hard problems have PTAS or good approximation schemes. Why define the norm around exact solutions?"

  **Reply (2 min):**
  "Because for some problems, even approximating the posterior or the expected utility is itself hard. There are inapproximability results. If the gap between the best polynomial-time approximation and the true maximum is large, then 'rational approximation' diverges significantly from 'ideal rationality.' If the divergence is large enough, calling it an 'approximation of Bayesianism' is misleading. It's a different decision rule. Again, this supports the thesis: different resource bounds yield different normative prescriptions, not just fuzzy versions of the same one."

  **Concede:** Approximation is the standard engineering fix.
  **Weakness:** You need to be sure the specific inference problems philosophers care about (e.g., causal discovery) actually have strong inapproximability results.

  ### 7. The Idealization Defense (Low Likelihood / Medium Damage)
  **Who:** Philosopher of Science.
  **Phrasing:** "We use frictionless planes in physics. We know they don't exist, but they explain the system. Why is unconstrained rationality not just a useful idealization rather than a category error?"

  **Reply (2 min):**
  "A frictionless plane is a limit case that physical systems approach as friction decreases. Unconstrained rationality is not a limit case that finite agents approach as resources increase; for many problems, the resource requirement jumps discontinuously (e.g., from P to NP). You don't get 'closer' to Bayesian updating by having more memory if the algorithm requires exponential time. You just get further along the same impossible path. An idealization must be approximable; if the target is unreachable in principle for the agent type, it's not an idealization, it's a different domain."

  **Concede:** Idealizations are standard and useful in science.
  **Weakness:** Some physical systems *do* exhibit phase transitions where limits are discontinuous; a sharp philosopher might press the analogy there.

  ### 8. The Representation Stability Objection (Low Likelihood / High Damage)
  **Who:** Complexity Theorist.
  **Phrasing:** "You claim representation-hardness collapses into class-hardness. But encoding matters. If I change the basis of the problem, I might move it from NP to P. How do you define a 'faithful' encoding without begging the question?"

  **Reply (2 min):**
  "Faithful encodings are those that are polynomially related. That's the standard covenant in complexity. If an encoding requires exponential blowup to represent the input, it's not a faithful representation of the agent's epistemic state; it's smuggling the computation into the encoding. As long as we stick to polynomial-time reductions, the class hardness is invariant. My claim is that the epistemic inputs (sensory data, memories) are naturally encoded in a way that preserves the hardness."

  **Concede:** Encoding choices can artificially alter complexity.
  **Weakness:** "Natural encoding" is a philosophically loaded term. Theorists know there is no such thing as a "natural" encoding formally.

  ---

  ### Flagged Duplicates
  *   **Objections 1 (Average-Case) and 5 (SAT Solvers):** Both argue that "hard in theory" $\neq$ "hard in practice." Treat 5 as the empirical version of 1.
  *   **Objections 3 (Normativity) and 7 (Idealization):** Both ask if the theory loses its normative force. Treat 7 as the "philosophy of science" version of 3.

  ---

  ### The One Question I Hope Nobody Asks
  **"You define rationality relative to a resource class. But complexity classes (P, NP, etc.) are defined asymptotically as $n \to \infty$. Human agents are finite. How do you rigorously map an asymptotic class definition onto a finite agent without committing the same category error you accuse the ideal theorists of?"**

  **Why this is the killer:** It attacks the mathematical bridge between your two camps. If you say "we use finite complexity," the theorists will ask why you invoke asymptotic classes at all. If you say "we use asymptotics as a proxy," the philosophers will ask how an infinite limit grounds a finite norm. It exposes the tension in using CS tools for metaphysical claims.

  **Prep for if it comes:** Pivot to *uniformity*. "We aren't mapping the agent to a class; we are mapping the *task structure* the agent faces to a class. The agent is finite, but the *types* of problems it faces scale. The norm must hold for the scaling type, not just the current instance." (Risky, but the only play).
