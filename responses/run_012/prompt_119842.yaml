      *Wait, the prompt asks for "the one question I am hoping nobody asks."* This needs to be separate from the 8 prep items.

      *Re-evaluating the "Triviality" objection.* If I fumble this, the talk is boring. If I fumble the Average-Case, the talk is technically wrong. Average-Case is higher damage. Triviality is higher likelihood.

