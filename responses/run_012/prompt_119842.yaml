      *Actually, the best "Killer Question" for this specific talk:* "If rationality is relative to a resource class, and different agents have different resources, do you have a fragmentation problem where two agents with different bounds can't be compared normatively?" OR "You claim unconstrained rationality is a category error, but your resource-indexed theory relies on complexity classes which are defined asymptotically. How do you apply asymptotic classes to finite agents?" -> *This second one is stronger for this audience.* It attacks the bridge between the math (asymptotic) and the ontology (finite agents).

