answer: |-
  My company recently rolled out a "Sincerity Bonus." Five thousand dollars if you can demonstrate genuine admiration for the CEO.

  I went to HR to claim it, and she slid the form across the desk. It said: *"Payment is contingent on the admiration being grounded in the object's merits, not the state's rewards."*

  I said, "Okay, I admire him."
  She said, "Why?"
  I said, "Because he's a visionary."
  She said, "Really? Even without the five grand?"
  I said, "...Let's say yes."
  She said, "Then the five grand is redundant. You don't need a reason to have an attitude you already have."
  I said, "Okay, then I admire him *because* of the five grand."
  She said, "That's a reason to *want* the attitude, not a reason the attitude is *fitting*. Wrong kind of reason."
  I said, "So I can't admire him for the money, and I don't need to admire him for the money?"
  She said, "Correct. The bonus is a state-given reason trying to do an object-given job."
  I said, "So the only way to get the check is to not care about the check?"
  She said, "Yes."
  I said, "Then I don't care about the check."
  She stamped the form 'DENIED.'
  I said, "Why?"
  She said, "Because you only said that to get the check. That's instrumental. Wrong kind of reason."
