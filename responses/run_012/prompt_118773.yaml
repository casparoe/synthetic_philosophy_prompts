answer: |-
  The 2017 ACC/AHA guideline shift offers a brutal stress test for the philosophy of medicine. It strips away the moral baggage of psychiatry (the DSM/homosexuality example) and replaces it with a cuff, a number, and a committee vote. Here is how the naturalist-normativist fight plays out when the stakes are stroke risk rather than social deviance.

  ### The Naturalist (Boorse) Reading: Function vs. Statistics

  Christopher Boorse's Biostatistical Theory (BST) defines health as normal species-typical functioning. Disease is a sub-normal functional ability. For Boorse, values are irrelevant; a broken heart pump is a disease regardless of whether the patient minds.

  **The 132/84 Verdict:**
  On the BST view, a person sitting at 132/84 is only diseased if their cardiovascular system is failing to perform its evolved function within statistical normality.
  1.  **Asymptomatic Status:** Boorse distinguishes *disease* (internal functional failure) from *illness* (incapacity or social disadvantage). Hypertension is the perfect Boorsean disease: it is a functional deviation (vascular resistance/pumping pressure) that exists without *illness* (the patient feels fine). So, the fact that the patient is asymptomatic does not save them from being "diseased" on Boorse's account.
  2.  **The Moved Line:** However, Boorse relies on statistical distributions. If the physiological distribution of blood pressure in the population hasn't changed overnight, the *biological reality* hasn't changed. If the guidelines move from 140 to 130, a Boorsean must argue that the previous line was scientifically erroneous (it missed dysfunction) or that the new line is non-scientific. Given the SPRINT trial data—which used unattended automated readings that run lower than standard office cuffs—a strict naturalist would argue the numbers aren't even commensurable. You cannot compare a 130 from an empty room to a 140 from a doctor's office. If the metrics differ, the claim that we "found new disease" is empirically false. We just changed the ruler.

  **The Reference Class Trap:**
  This is where the naturalist account begins to bleed. Boorse requires reference classes (age, sex) to determine "normal."
  *   **The Problem:** Blood pressure naturally rises with age. If we use an age-matched reference class (comparing a 65-year-old to other 65-year-olds), a BP of 145/90 might be "statistically normal." If we use a species-typical class (comparing a 65-year-old to a healthy 20-year-old), that same 65-year-old is diseased.
  *   **The Smuggle:** Choosing the age-matched class implies that aging-related decline is "healthy functioning." Choosing the species-typical class implies that aging itself is a pathology. Boorse tries to dodge this by saying reference classes must be "natural," but age is natural. The choice of *which* natural class to use determines the diagnosis. If the choice is driven by a desire to avoid medicalizing all elderly people, then a value judgment (don't pathologize aging) has determined the biological classification. Naturalism survives only by relocating the normativity into the selection of the reference class.

  ### The Normativist Reading: The Vote is the Point

  For the normativist (e.g., Engelhardt, Fulford), disease concepts are inherently evaluative. To call a state a "disease" is to judge it as bad and in need of intervention.

  **The Ohio vs. Berlin Experiment:**
  The normativist looks at the 2017 guidelines and sees confirmation.
  1.  **The Committee Vote:** Facts do not vote; policies do. The fact that a panel of cardiologists convened to lower the threshold proves that "Hypertension" is not a natural kind like "Water" (H2O). If it were, the number would be discovered, not decreed. The shift from 140 to 130 reflects a changed judgment about *tolerable risk*, not a changed understanding of *arterial function*.
  2.  **Geography:** That a person is sick in Ohio and healthy in Berlin demonstrates that the label tracks healthcare policy and insurance reimbursement structures, not biological reality. The normativist argues this doesn't mean the physiology is fake, but that the *category* "Hypertension" is a tool for managing populations, not describing individuals.
  3.  **Treatment vs. Disease:** The normativist presses a crucial distinction: The guidelines conflated *diagnostic thresholds* with *treatment thresholds*. In the past, you might have "high blood pressure" but only get pills if you hit 140. Now, the diagnostic label arrives at 130. This suggests the label is being used to trigger action. If the definition of the disease changes based on whether we have drugs that work at lower levels (and the evidence there is contested for low-risk groups), then the disease concept is subservient to therapeutic utility. That is a normative relationship.

  **Disease vs. Risk Factor:**
  The creation of the "Elevated" category (formerly prehypertension) is the normativist's smoking gun.
  *   **Naturalist Failure:** For a naturalist, a mechanism either functions or it doesn't. "Elevated" implies a probabilistic risk, not a functional failure. By labeling asymptomatic risk as a medical category, medicine is expanding the concept of disease to include *future possibilities*.
  *   **Normativist Success:** This confirms that "disease" is a status we assign to people to justify surveillance and intervention. We call them "sick" not because their machinery is broken *now*, but because we value stroke prevention enough to intervene *now*. The "Elevated" category is pure risk management, dressed in the language of pathology.

  ### Where the Case is Uninformative

  I must be honest: Blood pressure is a frustrating case for this specific philosophical fight because it sits on a metaphysical fence.

  Blood pressure is a **risk marker**, not necessarily a **mechanism of dysfunction**. High blood pressure might be the *symptom* of the real disease (arterial stiffening, renal issues), not the disease itself.
  *   **For the Naturalist:** If hypertension is just a number that correlates with damage, Boorse's theory (which is about *function*) doesn't apply cleanly. A number isn't a function. This makes the case uninformative for testing BST because BST is designed for organ failure, not statistical risk predictors.
  *   **For the Normativist:** While the guideline change looks normative, it's possible the Americans were simply *more correct* about the biology than the Europeans. If 130 really is where damage starts, the US is naturalist-correct and the EU is conservative. The philosophical debate assumes the science is ambiguous, but if the biology is settled (which it isn't quite), the normativist reading collapses into "bad science."

  Furthermore, the "Ohio vs. Berlin" argument assumes biology is uniform. But if American diets/stressors differ from European ones, the *baseline risk* might actually differ. If the underlying risk profile of the population is different, different thresholds might be biologically justified. This weakens the "it's just a social construct" argument.

  ### The Verdict

  After running this episode through the mill, here is where I land:

  **Which side should you believe?**
  You should believe a **Hybrid View**, but one that leans Normativist regarding *classification* and Naturalist regarding *physiology*.

  The physiology is naturalist. There is a factual relationship between pressure, vessel wall stress, and stroke risk. That relationship exists in Ohio and Berlin regardless of what committees say. However, the *label* "Hypertension" is normative. It is a decision to draw a line on a continuum where none exists in nature.

  **How much did the case move me?**
  Significantly, specifically on the **Reference Class Problem**.
  I previously thought Boorse could solve the age-issue by appealing to "efficient design" (i.e., aging is wear-and-tear, not design). But the hypertension case shows that "wear-and-tear" is statistically normal. If we accept statistical normality as health (to avoid calling all old people sick), we have smuggled in a value judgment about what counts as an acceptable life course. The hypertension guidelines expose that we cannot define "normal function" without first deciding how much decline we are willing to tolerate as "healthy."

  The case also solidifies the **Risk vs. Disease** critique. The expansion of "Elevated" BP shows that modern medicine is shifting from a model of *repairing dysfunction* to *managing probability*. Boorse's theory is built for the former; it cannot account for the latter without breaking. When we diagnose a healthy person to prevent a future event, we are not practicing naturalist medicine; we are practicing normative risk governance.

  **Final Conclusion:**
  The 2017 guideline change proves that while *pathology* is natural, *disease* is a policy tool. The naturalist is right that arteries don't care about committees. But the normativist is right that "Hypertension" is not a discovery about arteries; it is a decision about people. The person at 132/84 has the same physiology in 2016 and 2018. What changed was not their health, but our willingness to call them patients.
