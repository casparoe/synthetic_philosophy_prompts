answer: |-
  To construct a taxonomy of Anthropocene positions without presupposing the conclusions, we must first map the logical space of stratigraphic definition. The debate is not merely about dates; it is about ontology, authority, and utility. Six axes structure the decision space. First, **Ontology**: is the term a rock unit, a time unit, an event, or a political concept? Second, **Boundary Geometry**: must the start be a synchronous instant (a point), a numerical age, or a diachronous surface? Third, **Marker Class**: is the signal chemical (radionuclides), material (technofossils), or biological? Fourth, **Authority**: who ratifies the definition—a geological committee, an interdisciplinary body, or usage? Fifth, **Date**: does the signal appear in the Neolithic, 1610, the Industrial Revolution, or 1950? Sixth, **Purpose**: is the unit for correlating strata, organizing research, or mobilizing politics? A decision tree built on these axes forces respondents to reveal their commitments before they reveal their labels.

  **Decision Tree: Taxonomy of Anthropocene Positions**

  1.  **Is the primary aim to establish a formal unit within the International Chronostratigraphic Chart?**
      *   **Yes:** (Formal Ratification Path)
          2.  **Must the base be defined by a single point in a specific physical section (a Golden Spike)?**
              *   **Yes:**
                  3.  **Is the defining signal a global radionuclide fallout?**
                      *   **Yes:** **The Mid-Twentieth Century Proposal.**
                          *   *Awkward Commitment:* Privileges a clean chemical signal over the messy history of industrialization.
                      *   **No:** **Unnamed Cell 1 (Non-Radionuclide GSSP).**
                          *   *Awkward Commitment:* Seeking a globally synchronous golden spike without plutonium is stratigraphically precarious.
              *   **No:** (Diachronous or Numerical Path)
                  4.  **Must the boundary be synchronous globally?**
                      *   **Yes:** (Numerical Age)
                          5.  **Does the boundary predate the industrial mechanization of agriculture?**
                              *   **Yes:** **The Early Anthropocene Hypothesis.**
                                  *   *Awkward Commitment:* Risks conflating ancient land clearance with planetary systemic rupture.
                              *   **No:** **The 1610 Orbis Spike.**
                                  *   *Awkward Commitment:* Anchors geological time to the demographic collapse of Indigenous peoples.
                      *   **No:** (Diachronous)
                          5.  **Is the signal defined by material artifacts and biological remains?**
                              *   **Yes:** **The Technofossil Position.**
                                  *   *Awkward Commitment:* Accepts that the "start" looks different in London than in Lagos.
                              *   **No:** **Unnamed Cell 2 (Diachronous Chemical).**
                                  *   *Awkward Commitment:* A chemical signal that arrives at different times lacks global correlation utility.
      *   **No:** (Alternative Framings Path)
          2.  **Is the term useful as a geological descriptor, even if not formal?**
              *   **Yes:** **The Informal-Term-Only Position.**
                  *   *Awkward Commitment:* Accepts geological utility while rejecting the authority of the ratification committee.
              *   **No:** (Non-Geological Path)
                  3.  **Is the current interval stratigraphically distinct from the Holocene?**
                      *   **No:** **The Holocene Continues.**
                          *   *Awkward Commitment:* Asserts current changes are not stratigraphically distinct enough to warrant a new unit.
                      *   **Yes:** (Distinct but not Geological)
                          4.  **Is the term describing an Earth System process or a Political Economy?**
                              *   **Process:** **The Event-Not-Epoch Position.**
                                  *   *Awkward Commitment:* Describes a process without imposing artificial start/stop dates.
                              *   **Political Economy:**
                                  5.  **Is the primary driver abstract capital accumulation or racialized labor systems?**
                                      *   **Capital:** **The Capitalocene.**
                                          *   *Awkward Commitment:* Requires geology to submit to historical materialism.
                                      *   **Labor/Ecology:** **The Plantationocene.**
                                          *   *Awkward Commitment:* Prioritizes racialized labor and ecology over abstract capital.

  **Unoccupied Cells and Diagnoses**

  | Cell Description | Diagnosis |
  | :--- | :--- |
  | **Formal GSSP + Non-Radionuclide** | **Unattractive:** No other post-1950 signal offers the synchronous precision required for a Golden Spike without invoking plutonium. |
  | **Formal Diachronous + Chemical** | **Unexplored:** Chemically defined diachronous boundaries are stratigraphically valid but rarely argued for the Anthropocene. |
  | **Formal Unit + Political Economy** | **Incoherent:** Formal chronostratigraphy cannot encode political economic drivers as primary boundary markers. |
  | **Informal + Holocene Continues** | **Incoherent:** If the Holocene continues, the Anthropocene cannot function even as an informal geological descriptor. |

  **Limitations of the Instrument**

  This tree successfully partitions positions based on stratigraphic commitment and ontological status, but it fails to cleanly separate positions that agree on geology but disagree on politics, or vice versa. Specifically, the instrument struggles to distinguish **The Capitalocene** from **The Plantationocene**. While Node 5 asks about the primary driver, in practice, proponents of both positions often agree that the mid-twentieth century is too late and that capitalism is implicated; the distinction relies on nuanced theoretical priorities (accumulation vs. racialized ecology) that a binary decision node oversimplifies. A further question regarding the role of slavery and indigenous dispossession versus market abstraction would be required to separate them robustly.

  Furthermore, the tree may fail to separate **The Informal-Term-Only Position** from **The Event-Not-Epoch Position**. Both reject formal ratification (Node 1: No) and both might answer Node 2 (Geological Descriptor) ambiguously. An event proponent might argue the term is useful geologically but not as a *unit*, while an informal proponent might argue it is a unit but not a *formal* one. The distinction lies in whether they view the Anthropocene as a noun (a thing) or a verb (a process), a grammatical distinction this stratigraphic tree does not capture. To separate them, one would need to ask: "Does the term refer to a layer of rock or a trajectory of change?"

  Finally, the tree cannot handle positions that reject the geological framing while still wanting a stratigraphic marker. Some political theorists argue for the Capitalocene but accept the plutonium marker as a convenient date for political mobilization, despite rejecting the geological authority. This hybrid position—political utility with geological markers—falls into the gap between the Formal and Alternative paths. A visible gap is more useful than a false clean partition; students should see that the "1950 vs. Politics" dichotomy collapses because some positions inhabit the borderlands between stratigraphy and political economy. This instrument maps the territory, but it cannot resolve the contradictions inherent in naming a planetary crisis.
