answer: |-
  Here is a 50-minute teaching plan designed for your specific group composition. It prioritizes interaction over exposition and leverages the technical backgrounds of your participants without getting bogged down in jargon.

  ### 1. The Order of Pieces (Dependencies)

  You are correct that people cannot feel the force of the question until certain premises are locked in. If you jump straight to "Do you pay?", the economists will calculate expected value based on causal independence, and the argument will stall.

  **The Required Sequence:**
  1.  **Lock the Prediction Mechanism:** Before discussing the money, you must establish that the prediction is *logically* tied to their decision, not just causally correlated. This must happen before the coin flip is revealed.
  2.  **Lock the Timing:** They must accept that the coin flip and prediction are in the past relative to the decision. This creates the tension (causal isolation).
  3.  **The Decision (Mugging):** Get a commitment.
  4.  **The Decision (Blackmail):** Get a second commitment.
  5.  **The Structural Reveal:** Show they are identical.
  6.  **The Theory:** Explain *why* they conflicted.

  **Why this order?**
  If you explain the theory first, you give them the answer. If you allow them to debate the reliability of the predictor during the decision phase, the economists and statistician will turn it into a probability problem ($P < 1.0$), which dissolves the philosophical bite. The logic only holds if prediction is treated as a given constraint.

  ### 2. The One Case (Your Idea vs. Standard)

  **Verdict:** Your instinct to cut the sci-fi is right for this group, but your specific "brain scan" modification is dangerous.

  **The Problem with the Brain Scan:**
  A brain scan implies a physical measurement of a state. To a software engineer or statistician, a state at $T_1$ does not logically constrain an action at $T_2$ unless you assume determinism, which invites debate about free will. If they think, "I could change my mind after the scan," the counterfactual reward vanishes, and the correct answer becomes "Don't Pay."

  **The Fix: "The Source Code Snapshot"**
  Since you have three software folks and a statistician, use their language.
  *   **The Setup:** "A week ago, a perfect simulation of your decision-making algorithm was run. It output 'Pay' or 'Don't Pay.' The coin was flipped. You are now running the real instance."
  *   **Why this works:** It removes the "magic" of Omega but preserves the **logical dependency**. Your code doesn't change between the simulation and the real run unless you change the source. This forces the logical link required for the problem to bite, without invoking superintelligence.
  *   **Instruction:** Write "Prediction = Your Algorithm's Output" on the whiteboard. Do not let them debate *how* the simulation works. Treat it as an axiom for the hour.

  ### 3. Misconceptions (Order and Intervention)

  Here is the order they will arise and exactly how to head them off using the whiteboard.

  **1. "The predictor might be wrong." (Reliability)**
  *   **When:** Immediately upon hearing the setup.
  *   **Intervention:** **Minute 5.** State clearly: "For this exercise, assume the prediction is logically equivalent to your decision. If you pay, the prediction was 'Pay'. If you don't, it was 'Don't'."
  *   **Time Allocation:** Spend max 3 minutes here. If accuracy drops below 100%, the problem becomes a standard EV calculation, and the philosophical lesson is lost. Tell them: "We are analyzing the limit case where accuracy is 1."

  **2. "You can't change the past." (Causal Isolation)**
  *   **When:** Immediately after you ask "Do you pay?"
  *   **Intervention:** **Minute 15.** Agree with them. "Correct. Your action now does not change the coin or the prediction." Then ask: "Then why does the prediction exist?" Force them to acknowledge that their *type* caused the prediction, even if their *action* doesn't change it.

  **3. "Expected value is expected value." (The Crux)**
  *   **When:** During the comparison of the two cases.
  *   **Intervention:** **Minute 35.** You are right; this is the actual crux.
      *   **CDT View (Causal):** "Given the coin is Heads, paying loses $100. Not paying loses $0."
      *   **FDT/UDT View (Functional):** "Given I am the type who pays, I get $10,000 in the Tails branch. Given I am the type who doesn't, I get $0."
      *   **Whiteboard Move:** Draw two trees. One labeled "Action Conditional" (CDT), one labeled "Policy Conditional" (FDT). Show that the math differs based on *what* you condition on. Do not use the acronyms until the end.

  **4. "This is just extortion." (Normative)**
  *   **When:** During the Blackmail case.
  *   **Intervention:** **Minute 25.** Acknowledge it. "It feels like extortion. But does feeling like extortion change the payoff matrix?" Keep them focused on the numbers, not the morality.

  **5. "So which one are you, causal or evidential?" (Labels)**
  *   **When:** The last 5 minutes.
  *   **Intervention:** Only introduce these labels *after* they have felt the conflict. If you introduce them early, people will adopt a team identity rather than thinking through the problem.

  ### 4. The Final Comprehension Question

  Do not ask "What is Counterfactual Mugging?" Ask a question that forces them to apply the **policy** logic rather than the **action** logic.

  **The Question:**
  "You are programming an autonomous agent that will face this exact scenario next year. You are writing the code *today*, before the coin is flipped and before the prediction is made. Do you hardcode the agent to Pay or Not Pay?"

  **Why this works:**
  *   If they say "Not Pay" (because action can't change past), they contradict themselves on the programming question (because programming *does* determine the prediction).
  *   If they say "Pay," they admit the rational choice depends on viewing oneself as a policy rather than a single action.
  *   It separates the "what do I do now" (causal) from "what kind of agent am I" (functional).

  ### 5. What to Cut (Scope Management)

  You have 50 minutes. You must ruthlessly cut the following:

  1.  **Newcomb's Problem:** It is structurally similar but introduces boxes and transparency issues that will distract from the mugging/blackmail symmetry. Mention it only in passing if someone brings it up.
  2.  **Prisoner's Dilemma:** Different structure (two agents vs. one agent vs. nature). Do not introduce it.
  3.  **The History of Decision Theory:** Do not lecture on Causal vs. Evidential vs. Timeless Decision Theory until the final 5 minutes. Let the problem stand on its own first.
  4.  **Meta-Ethics:** If the Judge or Neighbor starts arguing about whether one *should* be rational, cut it off. "We are analyzing the structure of the payoff, not the virtue of the agent."

  ### 6. Sequencing the Two Halves (The "Flip")

  To make the structural similarity feel earned rather than announced, you must **isolate the intuitions** before revealing the math.

  **Phase 1: The Mugging (Minutes 10–20)**
  *   Present the "Source Code" version of the Mugging.
  *   **Whiteboard:** Draw the payoff matrix clearly.
      *   Heads (50%): Pay -$100 | Don't Pay $0
      *   Tails (50%): Pay +$10,000 | Don't Pay $0
      *   *Condition:* Tails payoff only exists if Prediction = Pay.
  *   **Vote:** Show of hands. Who pays?
  *   **Discussion:** Let the "Can't change the past" argument run for 3 minutes. Do not resolve it yet.

  **Phase 2: The Blackmail (Minutes 20–30)**
  *   **Transition:** "Same math, different story."
  *   **Narrative:** "A blackmailer simulated you. If predicted you'd pay, they don't send the letter (you keep your money). If predicted you wouldn't, they send the letter demanding $100 to avoid scandal. You received the letter."
  *   **Crucial Detail:** Ensure the payoffs are identical to the Mugging. (Pay -$100 vs Scandal/$0; Counterfactual was +$10,000/Status Quo).
  *   **Vote:** Show of hands. Who pays?
  *   **Expectation:** You will likely see people who voted "Pay" on Mugging vote "Don't Pay" on Blackmail due to the "never reward extortion" heuristic.

  **Phase 3: The Reveal (Minutes 30–40)**
  *   **Whiteboard:** Erase the story text. Leave only the variables ($A$, $B$, $P$).
  *   **Action:** Show that the matrices are identical.
  *   **Question:** "Who changed their vote? Why?"
  *   **Goal:** Let them admit that the *framing* drove the decision, not the logic. This creates the cognitive dissonance required for them to accept the decision theory lesson.

  **Phase 4: Resolution (Minutes 40–50)**
  *   Introduce the "Pre-commitment" question (from section 4).
  *   Briefly name the theories (CDT vs. FDT).
  *   End on time.

  ### Whiteboard Layout Plan

  *   **Left Side:** Payoff Matrix (Keep this up the whole time).
      *   Rows: Predicted Pay | Predicted Don't
      *   Cols: Heads (Ask) | Tails (Reward)
  *   **Center:** The Timeline.
      *   T-1: Prediction/Simulation
      *   T-0: Coin Flip
      *   T+1: You Decide
  *   **Right Side:** Vocabulary (Reveal only at the end).
      *   Causal Decision Theory
      *   Functional Decision Theory
      *   Pre-commitment

  ### Final Advice for the Moderator
  You have a retired judge and a neighbor who likes arguing. They will try to turn this into a moral debate about blackmail.
  *   **Shutdown Line:** "I'm not asking if blackmail is virtuous. I'm asking if the algorithm that pays gets more money than the algorithm that doesn't."
  *   **For the Economists:** "Standard expected utility theory gives one answer. Updateless decision theory gives another. We are testing which one captures 'rationality' better."
  *   **For the Statistician:** "Don't calculate the probability of the prediction. Treat it as a logical constant."

  This plan keeps the focus on the structural isomorphism while letting the group's specific expertise (code, stats, law) engage with the constraints rather than the fluff.
