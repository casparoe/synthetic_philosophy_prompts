answer: |-
  **Project Title:** Rescuing Tendencies: Empirical Content and the Confirmation Horizon in Long-Run Predictive Theories

  **Principal Investigator:** [Your Name]
  **Duration:** 9 Months
  **Deliverable:** One article-length manuscript (approx. 8,000 words)

  **1. Research Question**
  Standard philosophy of science offers robust criteria for identifying illegitimate "rescue moves" when a theory faces anomaly: modifications introduced post hoc, lacking independent motivation, or reducing falsifiability are deemed ad hoc. However, these criteria misfire on theories that predict long-run *tendencies* rather than dated *events*. In such theories, the standard defence—"the theory is right but early"—is structurally built into the claim. This project asks: **Under what conditions does a post-anomaly modification of a long-run predictive theory preserve that theory's empirical content?**

  **2. Background and Significance**
  The Malthusian doctrine serves as the paradigmatic case. The standard defence is that population pressure on subsistence is a permanent tendency, even if specific crises are delayed. The standard objection is that "eventually" has no expiry date, rendering the theory unfalsifiable. Existing accounts stall here. Falsifiability-based accounts struggle because the theory is technically falsifiable, just not within a human lifespan. Historically holistic accounts struggle because the modification (e.g., adding "preventive checks") often *increases* the theory's explanatory power retrospectively. Probabilistic accounts struggle because assigning low probability to a delay does not distinguish a legitimate refinement from a protective belt adjustment.

  The problem is not *when* a modification is made, but what it does to the theory's **confirmation horizon**: the interval over which the theory commits the researcher to a determinate, checkable claim about an observable ratio. Current literature lacks a taxonomy of rescue moves specific to tendency-theories. This project fills that gap by distinguishing between (a) horizon extension (pushing the date), (b) domain contraction (narrowing the antecedent conditions), and (c) indicator substitution (shifting the observable metric).

  **3. Methodology and Case Selection**
  The project employs a comparative case study method, analyzing the structural logic of theoretical modifications rather than their historical reception.

  *   **Case 1: Malthusian Demography.** I will analyze the shift from the first to later editions of the *Essay on the Principle of Population*. The focus is not on a full intellectual history, but specifically on the introduction of "preventive checks" (moral restraint) as a modification. Was this a domain contraction (the tendency holds only where restraint is absent) or an indicator substitution (pressure manifests as delayed marriage rather than mortality)?
  *   **Case 2: Resource Exhaustion Modelling.** To test the taxonomy's generality, I will contrast Malthus with a contrasting case from 1970s resource economics (e.g., limits-to-growth style modelling). This case is selected because its defence often relied on explicit conditioning on scenarios (e.g., "if consumption rates remain fixed") rather than appeals to timing. This provides a structural counterpoint to the Malthusian "timing" defence.

  **Scope Management:** A full genealogy of Malthusian thought is too large for a nine-month pilot. I will restrict the historical analysis to the specific textual modifications between the first and second editions regarding checks on population. The resource case will be treated structurally; if the specific 1970s models prove too technically dense, I will substitute a structurally equivalent case from contemporary climate modelling where "tipping points" function similarly to Malthusian checks.

  **4. Work Plan**
  *   **Months 1–2:** Refine the definition of "confirmation horizon." Draft the formal distinction between extension, contraction, and substitution.
  *   **Months 3–4:** Case Study 1 (Malthus). Textual analysis of the *Essay* editions focused strictly on the logic of the modification, not biographical context.
  *   **Months 5–6:** Case Study 2 (Resource/Climate). Assemble the contrasting case. Compare the logical structure of the rescue move against Case 1.
  *   **Months 7–8:** Drafting the manuscript. Synthesize cases into the general argument about empirical content.
  *   **Month 9:** Revision and submission preparation.

  **5. Expected Deliverable and Success Criteria**
  The deliverable is an 8,000-word paper suitable for a journal in general philosophy of science. The thesis is that modification (b) (domain contraction) preserves empirical content only if the narrowing condition is supported by evidence independent of the anomaly; modifications (a) and (c) fail unless they generate a new, dated, risky prediction about an indicator the unmodified theory left open.

  **Failure Conditions:** I am proceeding with the explicit understanding that this project may fail. If the three-way taxonomy turns out to be extensionally equivalent to standard criteria (e.g., if "confirmation horizon" is just "novel prediction" restated), the project has not produced an original contribution. I would rather establish this negative result in Month 2 than Month 8. If the taxonomy collapses, the paper will pivot to a critique of why standard criteria fail to capture the intuition, leaving the positive account for future work.

  **6. Budget and Resources**
  No travel or equipment is required. Departmental library access is sufficient for the textual analysis. The primary resource required is research time.

  ***

  **Confidence Assessment & Uncertainty**

  **Confidence Level:** I am **moderately confident (approx. 70%)** in the viability of this proposal. The problem identification is strong: standard ad hocness criteria clearly struggle with "tendency" theories, and the Malthus case is a well-known philosophical puzzle that hasn't been fully exhausted regarding this specific structural issue. The "confirmation horizon" concept offers a fresh angle that moves beyond the binary of falsified/unfalsified.

  **Least Sure Point:** The point I am least sure of is whether the **criterion for "independent evidence" in domain contraction** can be made precise without collapsing back into standard Bayesian or Lakatosian terms. I claim that narrowing the domain preserves content *if* the narrowing condition is supported independently. However, defining "independent" in a way that doesn't just mean "not used to fit the data" is notoriously difficult. If "independent" simply means "temporally prior," I fall back into the post hoc test I'm trying to avoid. If it means "theoretically motivated," I fall back into the "independent motivation" criterion I claimed was insufficient. Resolving this without circularity is the critical philosophical hurdle of the project.
