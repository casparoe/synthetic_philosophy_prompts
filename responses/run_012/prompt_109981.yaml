answer: |-
  **Q&A Prep Sheet: Rule-Level Aggregation**

  **Strategy:** Your core claim is that rule-level aggregation avoids intertheoretic comparison problems. Your vulnerability is that you may have simply moved the comparison problem from acts to rules, or obscured it within the individuation of the rules themselves. Prioritize defending the coherence of the aggregation mechanism.

  ***

  **1. The Measurement Objection (Formal Type)**
  **Objection:** "You claim ordinal rankings of rules suffice, bypassing cardinal value comparisons. But social choice theory shows that aggregating ordinal rankings often yields cycles or indeterminacy unless you impose cardinal structure. If your procedure fails to return a determinate rule in cases of conflicting ordinal rankings, haven't you just hidden the intertheoretic comparison problem inside the aggregation rule?"
  **Reply:** "That's a fair concern regarding pure ordinal voting. However, my procedure weights rankings by credence. Unlike standard voting where agents are equal, here the 'weights' are continuous probabilities. In most realistic cases of moral uncertainty, credence distribution breaks the cycles that plague pure ordinal aggregation. I am not claiming ordinal data *always* yields a result, but that it yields a result in the specific subset of cases where act-level aggregation fails due to normalization sensitivity."
  **Weakest Point:** If credences are split evenly across three theories with cyclic preferences over rules, you still have no answer.
  **Concede:** Admit the procedure is not guaranteed to be complete in all logical possibilities; it is a tool for resolving normalization disputes, not a universal decision algorithm.

  **2. The Individuation Objection (Sharp Grad Student)**
  **Objection:** "**[THE ONE YOU HOPE NOBODY ASKS]** Your invariance claim depends entirely on how you individuate the candidate rules. If I define a rule as 'Do Act A in Context S,' your rule-level view collapses into act-level aggregation, reintroducing the normalization problem. If you restrict rules to be general, who decides what counts as sufficiently general? Doesn't fixing the rule set require the very intertheoretic value judgments you claim to avoid?"
  **Reply:** "Rules must be generalizable by definition to count as rules; a singleton description is just an act in disguise. The set of candidate rules is fixed by the agent's deliberative context—what policies are actually live options for them. I am not comparing all logically possible rules, but the subset the agent can practically adopt. The invariance holds because the disagreement between theories is about the *value* of outcomes, not the description of the policies themselves."
  **Weakest Point:** The line between a specific policy and a single act is notoriously blurry. A critic can always argue your 'rule' is gerrymandered to avoid the normalization issue.
  **Concede:** Concede that rule individuation is not theory-neutral. You rely on a pre-theoretic understanding of 'policy' that may implicitly carry normative weight.

  **3. The Moral Ignorance Objection (Normative Realists)**
  **Objection:** "This whole framework treats moral uncertainty like empirical uncertainty. But moral uncertainty is just ignorance of the moral facts. Instead of aggregating false theories, you should invest energy in finding the true one. Doesn't this procedure incentivize staying uncertain rather than doing the hard work of moral philosophy?"
  **Reply:** "Ideally, agents should resolve moral uncertainty. But this project is non-ideal theory. Agents often face pressing decisions where further inquiry is impossible or too costly. We need a guide for action under residual uncertainty, not just a command to inquire further. Rule-level aggregation offers a stable heuristic for when inquiry has reached diminishing returns."
  **Weakest Point:** It risks legitimizing moral laziness if 'diminishing returns' is too easily claimed.
  **Concede:** Agree that this is a fallback procedure for non-ideal agents, not a replacement for first-order moral investigation.

  **4. The Categorical Objection (Kantian)**
  **Objection:** "You are treating categorical imperatives as inputs to a maximizing procedure. This subordinates the categorical to the prudential. If a theory says an act is forbidden, you shouldn't weigh that against your credence in another theory; you should simply not do it. Aggregating across theories presupposes a standpoint outside morality that no moral agent can occupy."
  **Reply:** "I am not aggregating moral duties directly; I am aggregating my epistemic confidence in the theories that posit those duties. The 'maximization' is occurring at the level of managing my own rationality under uncertainty, not weighing moral values against each other. It respects the categorical nature of the duties within each theory while acknowledging my fallibility about which theory is correct."
  **Weakest Point:** It still feels like treating duty as a preference satisfaction condition.
  **Concede:** Concede that this changes the phenomenology of moral deliberation from 'obedience' to 'management of uncertainty.'

  **5. The Representation Objection (Formal Type)**
  **Objection:** "Decision theory usually requires a representation theorem to show that an agent's choices maximize some function. What objective function does rule-level aggregation maximize? If it doesn't maximize expected choiceworthiness, what axioms justify following this procedure over any other?"
  **Reply:** "It maximizes the expected choiceworthiness of rules, rather than acts. The objective function is the weighted sum of the rule-rankings. While it lacks a standard representation theorem in the literature, it satisfies a coherence constraint: it prevents decision instability caused by arbitrary normalization choices. The justification is pragmatic consistency rather than axiomatic derivation."
  **Weakest Point:** Lacking a representation theorem makes it look ad hoc compared to standard expected utility theory.
  **Concede:** Acknowledge the lack of a formal representation theorem is a gap you intend to address in future work.

  ***

  **Closing Advice:**
  Your strongest move is to emphasize that act-level aggregation is *broken* by normalization issues, whereas rule-level aggregation is *stable*. If pressed on the Individuation Objection (Item 2), do not try to solve it fully. Instead, argue that *any* decision procedure requires some fixed description of options, and yours is no worse off than standard decision theory in this regard. Stay calm, admit the limits of non-ideal theory, and pivot back to the stability advantage. Good luck.
