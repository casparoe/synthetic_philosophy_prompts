answer: |-
  1. When Salieri first reads Mozart's manuscripts, he does not hear a representation of earthly beauty but feels the raw pulse of desire and agony that Schopenhauer identifies as the Will itself. The music bypasses his intellect to shake his very core, acting not as a picture of life but as the metaphysical engine driving it.

  2. Schopenhauer imagines the genius as a pure eye released from striving, yet Forman presents Mozart as a giggling, bodily creature constantly mired in the very willing he should transcend. Salieri's tragedy lies in mistaking the purity of the channel for the purity of the man, unable to accept that the Will speaks through a vulgar vessel.

  3. By replacing Schopenhauer's blind metaphysical force with a personal God who grants grace as a reward for virtue, the film moralizes a source that philosophy insists is indifferent to human merit. This swap gives Salieri's vengeance a clear target but loses the terrifying implication that the music's power exists regardless of justice or piety.

  4. The deathbed scene where Mozart dictates the Requiem insists on personal authorship and specific intent, resisting Schopenhauer's view that music dissolves the individual into universal feeling. Here the film demands we care about Mozart's suffering and desert, anchoring the sound back to the biographical man rather than letting it float as pure Will.

  5. While Schopenhauer isolates the listener in a private metaphysical encounter, the film demonstrates how the Will's voice devastates the community of mediators who cannot bear its direct transmission. It adds the social psychology of envy to the metaphysics, showing that hearing the Will without the capacity to channel it is a form of torture rather than release.
