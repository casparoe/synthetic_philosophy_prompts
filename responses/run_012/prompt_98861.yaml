  *   **Crucial Constraint:** All 16 cards must bear numbers between **1 and 50**.
  *   **Recommended Deal:** To maximize tension, deal numbers clustered in the **35–50** range. (e.g., two 36s, three 42s, one 49, etc.).
      *   *Why?* If a student draws #4, Settlement B is still possible but unlikely. If a student draws #45, Settlement A is possible (45/50), but Settlement B is *very* unlikely (45/500) under uniform sampling. This creates the "bite."
      *   *Preparation:* Create a custom deck of 50 cards (1–50). Shuffle. Deal 16. Keep the rest hidden.

  **The Betting Tokens:**
  *   Give each student 10 tokens (poker chips, paper slips, etc.).
  *   **Redeemable:** 5 tokens = 1 coffee voucher (or equivalent small reward).
  *   **The Wager:** They must stake tokens on **"Settlement A"** or **"Settlement B"**.
  *   **Payoff:** 1:1 payout. (Bet 5 tokens on A; if A is true, you get your 5 back + 5 profit. If false, you lose the 5).

  ---

  ## 2. Timeline & Script

  ### Phase 1: The Pull (0:00 – 0:35)

  **0:00 – 0:10 | Setup & Deal**
  *   **Script:** "You are residents of a settlement. You do not know its size. You know only that it is either **Small (50 residents)** or **Large (500 residents)**. These two possibilities are equally likely. You have been assigned a Resident ID number, drawn uniformly at random from the settlement's registry. Look at your number. Do not show it to anyone yet."
  *   **Action:** Deal the cards face down. Students look.
  *   **Instruction:** "Based *only* on your number and the 50/50 starting chance, stake your tokens. If you bet on the correct size, you double your stake. If you bet wrong, you lose it. You have 5 minutes to discuss in pairs, then place your bets privately."

  **0:10 – 0:25 | The Argument**
  *   Students will talk. You will hear phrases like: "I have 42. If it were Large, getting a number this low is rare." "If it were Small, 42 is near the end."
  *   **The Intuition:** Most will bet on **Small**. The logic is the "German Tank Problem": finding a low serial number suggests a low total count.
  *   **Observation:** Watch for the student who refuses to bet. (See "Predictable Failures" below).

  **0:25 – 0:35 | Locking Phase 1**
  *   Collect the bets. Do not reveal the truth.
  *   **Script:** "Keep your cards. We are not done. I am not telling you who won yet, because the rules of the settlement have just changed."

  ### Phase 2: The Wrinkle (0:35 – 1:05)

  **0:35 – 0:45 | The Reveal**
  *   **Script:** "New information. The settlement is not static. It has a history.
      *   **If Settlement A (Small):** It is a new colony. Population has been constant. Total lives lived = 50.
      *   **If Settlement B (Large):** It is an ancient empire. It grows exponentially. While there are 500 residents *now*, over its history, **5,000** people have been born there.
      *   **Crucial Detail:** In the Large settlement, because of this growth, a randomly drawn soul is far more likely to be from the recent 'boom' period. However, *you* are not just a resident; you are a conscious observer. You should reason as though you were a random sample from **all lives that have ever been lived**, not just the current headcount."
  *   **Visual Aid:** Draw two histograms on the board.
      *   **Small:** A flat bar (50 total).
      *   **Large:** A huge hockey stick (5,000 total, mostly at the end).
  *   **Instruction:** "Your ID number represents your birth order. Re-evaluate your bet. You may change your wager. You have 10 minutes."

  **0:45 – 1:00 | The Shift**
  *   **The Logic:**
      *   **Phase 1 Logic:** $P(\text{Number} | \text{Large}) = 1/500$. $P(\text{Number} | \text{Small}) = 1/50$. (Evidence favors Small 10:1).
      *   **Phase 2 Logic:** $P(\text{Exist} | \text{Large}) = 5000$. $P(\text{Exist} | \text{Small}) = 50$. (Prior favors Large 100:1).
      *   **Combined:** The 10:1 evidence for Small is swallowed by the 100:1 prior for Large. The rational bet shifts toward **Large** (or at least becomes indifferent).
  *   **Observation:** Students who bet Small will feel uneasy. The "Low Number" evidence hasn't changed, but the "Weight of the World" has.

  **1:00 – 1:05 | Locking Phase 2**
  *   Collect second bets.
  *   **Script:** "Now I will reveal the truth. But first, tell me: did the *fact* of your number change? No. Did the *world* change? No. Only your description of it did."
  *   **Resolution:** Reveal the true settlement size (You can choose either, but **Small** makes the Phase 1 winners feel smart and Phase 2 winners feel philosophical; **Large** makes Phase 1 losers feel vindicated by the twist. I recommend **Large** to validate the Phase 2 shift).
  *   *Note:* Since this is a seminar, the "Truth" is less important than the reasoning. You can even say, "For the sake of the game, let's assume Large is true. How many of you survived?"

  ### Phase 3: The Debrief (1:05 – 1:30)

  **1:05 – 1:20 | Mapping the Terrain**
  *   Do not start with jargon. Start with their feelings.
  *   **Ask:** "In Phase 1, why did #42 feel like evidence for Small?"
      *   *Target Answer:* "Because 42 is a high percentage of 50, but a tiny percentage of 500."
      *   *Label:* **The Self-Sampling Assumption (SSA).** You assumed you were a random sample from the *current* set.
  *   **Ask:** "In Phase 2, why did that evidence lose its bite?"
      *   *Target Answer:* "Because there were way more people in the Large history. It's more likely I'd exist at all in the Large one."
      *   *Label:* **The Self-Indication Assumption (SIA).** You updated the *prior* probability based on the number of observers.
  *   **Ask:** "What is the 'Reference Class'?"
      *   *Discussion:* In Phase 1, the class was 'Current Residents'. In Phase 2, it was 'All Souls'. The shift in the class changed the math.

  **1:20 – 1:30 | The Unresolved Question**
  *   **Closing Thought:** "Which reference class is the right one? Are you a random resident, or a random soul? Metaphysics cannot answer this with math alone. It depends on what you think 'you' are. That is why the Doomsday Argument is slippery. It feels like math, but it is really a question about identity."

  ---

  ## 3. Predictable Failures & Mitigations

  **1. The Refusal to Bet**
  *   **Prediction:** At least one student will refuse to wager tokens in Phase 1, claiming "The number tells me nothing."
  *   **Diagnosis:** This is not a defect; it is the **Principle of Indifference** objection. They are rejecting the premise that their birth order is a random sample.
  *   **Action:** Do not force them. In the debrief, put them on a pedestal. "This student identified the weakest link in the chain: the assumption that you are random. If you aren't random, the math breaks." This validates their skepticism as a philosophical insight, not a game failure.

  **2. The "Growth" Confusion**
  *   **Prediction:** Students will confuse "Current Population" (500) with "Total Historical Population" (5,000). They will think the card draw is from the 500, making the Phase 2 logic opaque.
  *   **Diagnosis:** Cognitive overload on the sampling mechanism.
  *   **Action:** Use the histogram on the board. Explicitly write: **Phase 1: Sample from Current.** **Phase 2: Sample from History.** The visual distinction is vital.

  **3. The "Truth" Anti-Climax**
  *   **Prediction:** If you reveal the settlement is actually Small, the Phase 2 students (who bet Large) will feel cheated, thinking the "wrinkle" was a trick.
  *   **Action:** Frame the reveal carefully. "In this specific run, the world was Small. But notice: even in a Small world, the Phase 2 reasoning was *safer* because it accounted for existence probability. You lost the bet, but did you lose the argument?"

  ---

  ## 4. Designer's Confidence Flags (Self-Critique)

  *As requested, here are the risky empirical claims in this design:*

  **Flag 1: The Magnitude of the Shift**
  *   **Risk:** I am least confident that the Phase 2 explanation ("Total Historical Lives") will successfully offset the Phase 1 intuition ("Current Serial Number") for *most* students in real-time. The SSA intuition (Doomsday) is cognitively sticky; the SIA counter (Presumptuous Philosopher) feels like "cheating" to novices.
  *   **Evidence of Failure:** In Phase 2 discussion, if students say, "But I *have* card 42. That's a fact. How can history change the card?" then they are treating the Likelihood as fixed and ignoring the Prior shift.
  *   **Correction:** If this happens, stop the debate. Use an analogy: "If I tell you I drew a Winning Ticket from a Hat. Hat A has 1 ticket. Hat B has 1,000 tickets. You hold a Winning Ticket. Which Hat? Now, what if I tell you Hat B bought 1,000,000 tickets over time and only 1,000 are left, but Hat A only ever bought 1? Does that change how surprised you are to exist?"

  **Flag 2: The "Born Late" Wording**
  *   **Risk:** The prompt asks to use the phrase "randomly drawn resident is far more likely to have been born late." In my design, I use this to justify the *Prior* shift (more total lives). However, strictly speaking, if most are born late, the probability of drawing a *low* number (like 42 in a 5000 sequence) becomes *vanishingly small*, which actually *strengthens* the Small hypothesis.
  *   **Evidence of Failure:** A sharp student will catch this contradiction. "If Large is growing, most numbers are high. I have a low number. Therefore Large is impossible."
  *   **Correction:** Be prepared to concede this point. "You are right. If we only look at the distribution of numbers, Low favors Small. The only way Large survives is if we value the *probability of existing* in Large higher than Small. I am asking you to trade 'Number Rarity' for 'Existence Probability'. Is that a fair trade?" This turns a potential bug into the central metaphysical question of the seminar.

  **Flag 3: The Payoff Structure**
  *   **Risk:** 1:1 payout might not be enough to induce stress. If they bet 1 token, they don't care.
  *   **Evidence of Failure:** Students treat tokens as meaningless.
  *   **Correction:** Require a **minimum bet of 5 tokens** (half their endowment). Force skin in the game.

  ---

  ## 5. What You Must Supply in Words

  The activity cannot reproduce the **Reference Class Problem** itself. The game forces *a* reference class (Residents vs. Souls), but it cannot show *why* choosing one is metaphysically difficult.

  **You must say this at the end:**
  "The game worked because I told you which group to compare yourself to. In the real world—when asking about the end of humanity, or the size of the multiverse—no one hands you a rulebook. You have to decide: Am I a random human? A random conscious moment? A random carbon-based lifeform? The math is easy. The metaphysics is choosing the denominator."
