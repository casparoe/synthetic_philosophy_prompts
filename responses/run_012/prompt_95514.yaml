  Someone in my prediction-market discord keeps saying 'just bet half Kelly' like it's a law of nature. He used it last week to tell me I was nuts for putting a big chunk of my bankroll on a contract tradeing at 30% that I think is really worth 60%, his view being that full Kelly is for suckers and anyone who actually knows what they're doing sizes down. I want the menu of things that one-liner could be claiming. Is it about not knowing whether my edge is really 60% or 50%? About overbetting being punished harder than underbetting? About risk aversion, i.e. you're just not a log-utility maximizer so Kelly isn't your objective at all? About Kelly optimizing the growth rate of the median path rather than the average outcome? Or just a vibe that half of a scary number feels safer? Lay out the distinct precise theses 'bet half Kelly' could stand for, say which are trivial restatements, which are actually defensible, which are false or arbitrary, and tell me which one he's most likely invoking when he tells me to size down -- and whether any of those readings actually gets him to his conclusion about this particular bet, where I'm confident but not certain that my 60% is right.
