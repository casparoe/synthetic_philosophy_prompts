answer: |-
  **Title:** The Shape of the Trap: Epistemic vs. Semantic Debunking in Metaethics

  **Introduction**

  The evolutionary debunking argument (EDA) has become the central battlefield in contemporary metaethics. The core intuition is familiar: if our moral faculties are the product of natural selection, and natural selection tracks reproductive fitness rather than moral truth, then the reliability of our moral beliefs is suspect. Your friend Maya is deploying the standard version of this argument, one popularized by philosophers like Sharon Street. She claims it is a specific weapon against Moral Realism, leaving Anti-Realism (expressivism, constructivism) unscathed. Your pushback is more sophisticated: you suspect there is a semantic version of the argument that threatens the very determinacy of moral concepts, thereby undermining the anti-realist's ability to make sense of moral discourse at all.

  This is a high-quality philosophical disagreement. Maya is relying on the *epistemic* force of the EDA; you are gesturing toward a *semantic* force. To adjudicate this, we must distinguish these two versions sharply, evaluate whether the semantic version holds water, and then determine if it generalizes to anti-realism as you fear. My verdict is this: You are correct that the semantic version is a distinct and more potent argument than the epistemic one, and it does widen the net of the EDA. However, you are incorrect that it traps the anti-realist. The semantic EDA functions as a *reductio* of realism that anti-realists can co-opt. Maya wins the specific dispute about who escapes the argument, but you win the insight about the argument's deeper structure.

  **The Epistemic Debunking Argument (Maya's Ground)**

  To see where your pushback diverges, we must first formalize Maya's position. The standard EDA is an epistemic challenge. It targets the justification of moral beliefs, not their meaning. It runs roughly as follows:

  1.  **Causal Premise:** Our moral beliefs are heavily influenced by evolutionary pressures.
  2.  **Independence Premise:** Evolutionary pressures select for traits that enhance reproductive fitness, not for traits that track mind-independent moral truths.
  3.  **Insensitivity Premise:** If our moral beliefs were shaped by fitness rather than truth, we would hold these beliefs even if the moral facts were different (or non-existent).
  4.  **Conclusion:** Our moral beliefs are insensitive to the moral facts, and therefore unjustified.

  Maya's claim is that this creates a "coincidence problem" specifically for the Robust Realist. The Realist posits mind-independent moral facts that exist regardless of our attitudes. If evolution shaped our attitudes without regard for those facts, the alignment between our beliefs and the facts is miraculous.

  The Anti-Realist escape hatch, on this view, is straightforward. The Expressivist says moral judgments are not beliefs that track facts but expressions of attitude; there is no "tracking" to be insensitive to. The Constructivist says moral truths are constituted by our rational procedures or attitudes; thus, the evolutionary shaping of those attitudes is partly constitutive of the truth, not an obstacle to it. On the epistemic reading, Maya is right: the EDA targets the *relation* between belief and independent fact. If you deny the independent fact, you deny the target.

  **The Semantic Debunking Argument (Your Pushback)**

  Your objection moves the goalposts from justification to reference. You are suggesting that evolution didn't just give us unreliable beliefs; it gave us unreliable *concepts*. This is the Semantic EDA. It doesn't ask, "Are your beliefs justified?" It asks, "Do your terms refer to anything determinate at all?"

  The argument runs like this:

  1.  **Conceptual Premise:** Our moral concepts (e.g., "obligation," "wrongness") were shaped by evolution to facilitate coordination and survival.
  2.  **Function Premise:** Concepts shaped for coordination need not, and likely do not, latch onto determinate properties in the world. They are tools for social regulation, not mirrors of reality.
  3.  **Indeterminacy Conclusion:** Therefore, moral terms likely lack determinate reference. There is no fact of the matter about what "wrongness" picks out.

  Your claim is that this threatens the Anti-Realist because they still need moral vocabulary to be stable enough to do work. A Constructivist needs to know what goes into procedure *P* (e.g., "what rational agents would agree to"). If the concept "rational agent" or "agreement" is evolutionarily fuzzy and refers to nothing determinate, the procedure cannot generate determinate truths. An Expressivist needs to know what attitude is being expressed. If the concept is empty, the expression is vacuous.

  This is a serious challenge. It moves the debate from "Can we know the truth?" to "Is there a truth to be had?" It aligns closely with Moral Error Theory (à la J.L. Mackie or Richard Joyce), which argues that moral concepts presuppose objective prescriptivity, and since nothing fits that description, all positive moral claims are false.

  **Adjudicating the Semantic Threat**

  Does the Semantic EDA work on its own terms? Plausibly, yes. If one accepts that our conceptual machinery is wholly a product of fitness-seeking evolution, the claim that these concepts "latch" onto robust properties is indeed suspect. This is a stronger argument against Realism than the epistemic version because it undermines the *intelligibility* of the realist position, not just the justification for holding it.

  However, does it generalize to Anti-Realism as you fear? Here is where your argument falters. You assume that Anti-Realists require the same kind of conceptual determinacy that Realists do. They do not.

  **The Expressivist Reply**
  The Expressivist (e.g., Blackburn, Gibbard) is the easiest case. They argue that moral terms do not function to refer to properties at all. To say "X is wrong" is not to predicate a property of X; it is to express a norm-accepting attitude toward X. The Semantic EDA concludes that moral terms fail to refer to robust properties. The Expressivist agrees entirely. For the Expressivist, the semantic "failure" identified by the debunker is not a bug; it is the defining feature of their metaethical view.

  Your worry is that they need stable concepts to express stable attitudes. But the stability of the *attitude* does not depend on the reference of the *term*. Evolution may have shaped the attitude of disgust or approval directly (the "dispositions" objection, which we will address shortly). If the attitude is stable, the expression is functional, regardless of whether the word "wrong" refers to a property. The Semantic EDA clears the field of realist properties, leaving the expressivist's non-cognitive landscape untouched.

  **The Constructivist Reply**
  The Constructivist case (e.g., Korsgaard, Street) is slightly more complex, and your intuition has more bite here. Constructivists claim moral truths are the output of a procedure. You argue the input concepts must be determinate.

  However, Constructivists typically argue that determinacy is an *output* of the procedure, not a precondition. For a Kantian Constructivist, the concept of a "rational agent" is not an empirical concept shaped by evolution to be fuzzy; it is a formal concept derived from the structure of agency itself. Evolution may have shaped our *psychological* tendencies, but the Constructivist grounds normativity in the *normative* requirements of agency.

  Furthermore, a Humean Constructivist (like Street) explicitly embraces the evolutionary origin of our values. Street argues that we start with evaluative attitudes shaped by evolution (which may be fuzzy) and then subject them to reflective scrutiny. The "fuzziness" of the raw material is precisely what the constructive procedure is meant to resolve. The Semantic EDA says, "Your raw concepts are indeterminate." The Constructivist replies, "Yes, that's why we need construction to refine them." The argument does not debunk the procedure; it merely describes the raw material the procedure works on.

  **The Dispositions Objection**

  There is a deeper objection that supports Maya and undermines your semantic worry. This is the objection that evolution selects for *dispositions to behave and feel*, not for *representational content*.

  If evolution selects for the disposition to cooperate, it does not necessarily select for the *belief* "cooperation is morally good" or the *concept* "moral goodness." It selects for the behavior. If this is true, the Semantic EDA loses its premise. There is no "moral concept" that was shaped for fitness; there are only non-conceptual dispositions.

  If there are no moral concepts shaped by evolution, the Semantic EDA cannot claim those concepts are indeterminate. They simply don't exist in the way the argument requires. This outcome favors the Anti-Realist. The Expressivist can ground morality in those dispositions (sentiments). The Realist, however, requires that there be propositions with content that track facts. If evolution didn't shape content, the Realist has no account of how we grasp the moral facts. Thus, the "dispositions" objection acts as a pincer: it deflates the Semantic EDA, but in doing so, it removes the Realist's access to moral facts while leaving the Anti-Realist's focus on attitudes intact.

  **The Verdict**

  You are right to distinguish the Semantic EDA from the Epistemic EDA. The semantic version is more fundamental because it challenges the coherence of moral discourse rather than just our warrant for believing it. If the Semantic EDA succeeds, it pushes us toward Error Theory or Non-Cognitivism.

  However, you are wrong that this traps the Anti-Realist. The Anti-Realist positions you listed (Constructivism, Expressivism) are not "Realism Lite." They are structural alternatives that do not rely on the referential success of moral terms in the way Realism does.
  *   **For the Expressivist:** The semantic failure of reference is their starting point.
  *   **For the Constructivist:** Semantic indeterminacy is the problem their procedure is designed to solve.

  Maya is correct that the EDA is a "free win" for Anti-Realism in the sense that it removes the primary competitor (Robust Realism) without damaging the Anti-Realist's own foundations. Your pushback identifies a stronger version of the argument, but it fails to see that the Anti-Realist is standing on ground that the argument does not undermine.

  **Where the Burden Lies**

  The burden of proof remains on the Debunker (and by extension, you) to show that the Anti-Realist *requires* the kind of determinate reference that evolution undermines.
  1.  **Against Expressivism:** You would need to show that expressing an attitude requires the terms used to express it to have determinate reference. This is counter to the definition of expressivism.
  2.  **Against Constructivism:** You would need to show that the constructive procedure cannot refine evolutionarily fuzzy inputs into determinate outputs. This is an empirical claim about the limits of rational reflection that has not been established.

  **Conclusion**

  You should concede the bet to Maya, but with a philosophical caveat. She is right that the Anti-Realist escapes the debunking argument. However, your intuition that the Semantic EDA is the "nastier version" is correct. It is the version that Realists truly fear, because it suggests that even if we could know moral facts, our words might not be about them. But this nastiness does not spill over to Anti-Realism. The Semantic EDA is a bomb that destroys the Realist's house; the Anti-Realist is living in a tent nearby, and when the house collapses, they simply point to the rubble and say, "We told you so."

  The debate is not about whether evolution debunks morality; it is about what morality *is*. If morality is a system of tracking facts, evolution debunks it. If morality is a system of coordinating attitudes, evolution explains it. The EDA forces a choice between those two definitions. It does not destroy the latter. Maya's shrug is justified; your worry, while insightful, targets a vulnerability that Anti-Realists do not possess.
