prompt: |-
  I am a novelist, and the book I am writing turns on an argument I want to render fairly rather than merely plausibly. One of its two central figures is an actuary who administers a charitable trust with an indefinite horizon; she holds that the trust is right to value a pound devoted to people a century hence at a small fraction of a pound spent on the living, and she defends the practice with a comparison she treats as self-evident: moral concern thins out with distance in time exactly as it thins out with distance in space. She does not deny that a stranger's suffering is as bad for him as a neighbour's is for the neighbour; she says only that our practical concern, and therefore the weight we are obliged to give, declines with distance, in time as in space, and that a discount rate is simply the price we put on that distance. She has read, and cites, the finding that giving after a disaster falls off with the distance between donor and catastrophe, and takes this to be a fact about the shape of human concern that any ethics must accommodate. The other figure, a young trustee, replies that this comparison is precisely what condemns her: if distance in space does not diminish a person's claim on us, then distance in time cannot either, and pure time preference — a preference for an earlier benefit merely because it is earlier — is indefensible. I have since met versions of the comparison in several places, made by people on both sides of the question, and I cannot tell how much of the argument the comparison itself is carrying.

  I am not asking for a verdict on whether discounting is defensible in general. I am asking for an audit of the analogy, so that I can see what each character is entitled to. Begin with the correspondence table: what plays the role of distance, of the person at the far end, of the neighbour and the traveller, of the discount rate, of the moral claim that supposedly weakens. Then the places where the mapping breaks — I suspect the direction of time is one, since space runs both ways and the past is closed to us, but I want the rest — and I want you to separate the breaks that actually matter for the use each character makes of the comparison from those that are merely decorative. Does the comparison, followed consistently, cut symmetrically, so that it must debunk spatial partiality and temporal partiality together or license them together? If it licenses both, what work is left for the discount rate to do, and what would the actuary have to say instead? What does the analogy quietly import: that distance is a fact about the world rather than about the observer, that the decay of sympathy and the decay of obligation run at the same rate, that the far end is occupied by people who will exist whatever we do? And does it reach the whole discount rate, or only the part of it that is pure time preference, as distinct from what we owe to the uncertainty of the future and to the likelihood that later people will be richer?

  Finally, and this is what I would most like: a sentence I can put in the actuary's mouth that states the strongest version of her position once the disanalogies have been conceded, and a sentence for the young trustee that answers that repaired version rather than the original. If the comparison is beyond repair, give me a better one — some image of the relation between the present and the further future that carries what she needs carried.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book with a central philosophical argument between two characters (an Actuary and a Young Trustee).
      *   **Topic:** Intergenerational equity, discount rates, and the analogy between spatial distance and temporal distance.
      *   **Goal:** An audit of the analogy (correspondence table, breakdown points, consequential vs. decorative breaks, symmetry check, hidden imports, scope of discount rate).
      *   **Specific Deliverables:**
          1.  Correspondence Table.
          2.  Analysis of where the mapping breaks (consequential vs. decorative).
          3.  Symmetry analysis (does it debunk/license both?).
          4.  Hidden imports/assumptions.
          5.  Scope (pure time preference vs. risk/wealth).
          6.  **Crucial:** One sentence for the Actuary (strongest repaired position) and one sentence for the Trustee (answer to the repaired position). Or a better analogy if this one fails.

  2.  **Deconstruct the Analogy (Spatial vs. Temporal Discounting):**
      *   *Actuary's Claim:* Moral concern thins with time just as it does with space. Therefore, discounting future benefits is ethical.
      *   *Trustee's Claim:* Spatial distance *doesn't* diminish moral claim (cosmopolitanism). Therefore, temporal distance shouldn't either. Pure time preference is wrong.
      *   *Key Philosophical Context:* This touches on Derek Parfit's *Reasons and Persons* (specifically the "No Difference" view regarding time vs. space) and the economics of discounting (Ramsey rule, pure time preference vs. elasticity of marginal utility).

  3.  **Drafting the Correspondence Table:**
      *   Need to map the elements of the spatial scenario to the temporal scenario.
      *   *Distance:* Kilometers vs. Years.
      *   *Person at far end:* Foreigner/Stranger vs. Future Person.
      *   *Neighbour/Traveller:* Local citizen vs. Current citizen.
      *   *Discount Rate:* Cost of transport/communication friction vs. Interest rate/Time preference rate.
      *   *Moral Claim:* Duty to aid vs. Duty to invest/save.

  4.  **Analyzing the Breaks (Disanalogies):**
      *   *Directionality:* Space is bidirectional (I can go there, they can come here). Time is unidirectional (we can affect them, they cannot affect us). *Consequential:* Yes, affects reciprocity and risk.
      *   *Existence:* The stranger exists independently of my aid. Future people's existence (and identity) often depends on current actions (Non-Identity Problem). *Consequential:* Huge for moral claims.
      *   *Knowledge:* We know the stranger's needs. We don't know the future person's specific needs or technology. *Consequential:* Relates to uncertainty discounting.
      *   *Causality:* Sending money across space preserves the money's value (mostly). Sending resources across time requires investment/growth (compound interest). *Consequential:* Economic mechanism.
      *   *Simultaneity:* The stranger suffers *now*. The future person suffers *later*. *Consequential:* Urgency.

  5.  **Symmetry Check:**
      *   If the analogy holds, it licenses *both* spatial and temporal partiality (Parfit's challenge).
      *   If the analogy fails, it usually fails because spatial partiality is *also* indefensible (the Trustee's point).
      *   *Actuary's Trap:* She uses a descriptive fact (people *do* care less about distance) to justify a normative rule (people *ought* to value less). This is the Is-Ought problem.
      *   *Trustee's Trap:* He assumes cosmopolitanism is settled.
      *   *Verdict:* The analogy is symmetric regarding *psychology*, but asymmetric regarding *metaphysics* and *causality*.

  6.  **Hidden Imports:**
      *   That "concern" = "obligation."
      *   That the future people are fixed entities waiting to be helped (ignoring Non-Identity).
      *   That the discount rate is purely moral, ignoring economic growth (richer future people need less marginal help).

  7.  **Scope of Discount Rate:**
      *   The analogy only supports *Pure Time Preference* (delta).
      *   It does *not* support discounting due to *Probability of Extinction* or *Marginal Utility of Wealth* (future people might be richer). The Actuary conflates these.

  8.  **Developing the Sentences (The Core Challenge):**
      *   *Actuary's Repaired Position:* She needs to admit the metaphysical differences but lean into the *epistemic* and *causal* friction. It's not that the future person matters less, but that our *ability to connect* degrades.
      *   *Trustee's Counter:* He needs to attack the idea that *our* limitation justifies *their* reduced claim.
      *   *Alternative Analogy:* If the space/time one is broken, what works? A "Chain of Custody" or "Relay Race" analogy? Or perhaps the "Seed/Tree" analogy?
      *   *Decision:* The Space/Time analogy is famous (Sidgwick, Parfit). It's not "broken" beyond repair, but it needs nuance. I will refine the sentences to reflect the *epistemic* limitation rather than *ontological* diminution.
      *   *Actuary:* "We do not discount the future person's worth, but we discount our own competence to serve them, for a pound entrusted across a century accrues friction and uncertainty that a pound spent today does not." (Focus on agency/competence).
      *   *Trustee:* "To reduce our duty because our vision blurs is to punish them for our myopia, confusing the limits of our sight with the limits of their claim." (Focus on the source of the obligation).

      *Wait, let's make them punchier and more philosophical.*
      *   Actuary needs to justify the *rate*.
      *   Trustee needs to justify the *obligation*.

      *Revised Actuary:* "I do not value their lives less than ours, but I value our certainty more than our speculation, and a pound spent today saves a known life while a pound saved tomorrow buys only a chance."
      *Revised Trustee:* "But a chance for them is a certainty for us: the certainty that if we spend their inheritance on ourselves, the debt remains unpaid whatever the interest."

      *Let's try to incorporate the "Space" analogy repair.*
      *   Actuary: "If you would not bankrupt yourself sending a single coat to a stranger on another continent when ten coats could be made here, you must accept that the friction of distance—whether measured in miles or years—limits the efficiency of our care."
      *   Trustee: "The friction of miles is a tax on transport, but the friction of years is a tax on imagination, and you have no right to levy it against people who cannot vote."

      *Let's go deeper.* The prompt asks for the *strongest version* once disanalogies are conceded.
      *   Actuary concession: Time isn't space. Future people depend on us.
      *   Actuary core: Uncertainty + Opportunity Cost.
      *   Trustee core: Rights don't diminish due to agent limitations.

      *Best Actuary Sentence:* "I do not discount their suffering because it is future, but because our power to prevent it degrades with every year we pretend we can see clearly enough to aim."
      *Best Trustee Sentence:* "Then stop calling it a discount on their value, and call it what it is: a tax on our own blindness, which you are asking me to pass on to them."

      *Wait, is there a better analogy?*
      *   The "Relay Race" is good for continuity.
      *   The "Garden" is good for growth.
      *   The "Ship at Sea" (Actuary is the captain managing supplies).
      *   Actually, the prompt asks: "If the comparison is beyond repair, give me a better one."
      *   Is it beyond repair? The Space/Time analogy is philosophically contested. Parfit argues they *should* be treated the same. If we reject spatial partiality (cosmopolitanism), we must reject temporal partiality. The Actuary relies on *descriptive* psychology (people *do* care less) to justify *normative* ethics. This is the weak point.
      *   Better Analogy: **The Leaky Bucket vs. The Growing Tree.**
      *   Or: **The Trust as a Lifeboat.**
      *   Let's stick to the prompt's request: Audit the current one first. If it's salvageable, fix the sentences. If not, offer a new image.
      *   The Space/Time analogy is fundamentally shaky because of the *Non-Identity Problem* (future people's existence depends on policy). Space doesn't have that.
      *   I will suggest the **"Chain of Custody"** or **"Relay"** analogy as a replacement because it captures the *transmission* aspect without the false symmetry of space.
      *   Actually, the **"Horizon"** analogy is strong.
      *   Let's provide the audit, then offer the sentences based on the *repaired* logic (focusing on uncertainty/agency rather than moral weight), and then offer a *new* analogy if that feels weak.
      *   Decision: The Space/Time analogy is too philosophically loaded (Parfit). A better analogy for an Actuary is **"The Fog at Sea."**

      *Refining the Plan:*
      1.  **Correspondence Table:** Clear mapping.
      2.  **Breaks:** Distinguish decorative (directionality) from consequential (existence, reciprocity, knowledge).
      3.  **Symmetry:** It links them, but mostly to the detriment of the Actuary if the Trustee holds cosmopolitan views.
      4.  **Imports:** Is/Ought, Fixed Identity, Moral Psychology vs. Moral Truth.
      5.  **Scope:** Pure time preference only.
      6.  **Sentences:** Crafted for maximum philosophical density and dramatic impact.
      7.  **Alternative Analogy:** "The Leaky Vessel" or "The Relay." Let's go with **"The Relay Race"** (focus on passing the baton, not the distance).

      *Wait, one more check on the Actuary's position.* She is an *Actuary*. She deals in risk and probability. Her strongest argument isn't moral thinning, it's *epistemic decay*. The Space analogy fails because space doesn't inherently degrade information the way time does (entropy/uncertainty).
      *   So, the repaired sentence should pivot from "moral concern thins" to "informational fidelity thins."
      *   Trustee's reply should be "Fidelity is our job, not their burden."

      *Let's finalize the sentences.*
      *   Actuary: "I do not say their lives weigh less in the scale, but that our hands shake more the further we reach, and a pound spent in the tremor of speculation buys less certainty than a pound spent in the steady light of the present."
      *   Trustee: "Then steady your hands, or admit that you are charging them interest on your own tremor."

      *Alternative Analogy:* **The Lighthouse.** The trust is a lighthouse. You can't light the horizon if you burn the oil today. But you also can't hoard oil for a ship that might never come.
      *   Actually, **"The Seed Corn"** is the classic.
      *   How about **"The Architect's Foundation"**?
      *   Let's suggest **"The Relay Race"** because it emphasizes *connection* rather than *distance*.

      *Okay, structure:*
      1.  Correspondence Table.
      2.  The Breaks (Consequential vs. Decorative).
      3.  Symmetry & Imports.
      4.  Scope of Discount.
      5.  The Sentences (Repaired).
      6.  The Better Analogy.

      *Self-Correction on "Decorative":* Directionality (time flows one way) is actually consequential for *power*, but maybe not for *moral claim*. I need to be precise. The Non-Identity problem is the big one.
      *   Also, the "fact about human concern" (Is) vs "ethics must accommodate" (Ought) is the biggest philosophical leap.

      *Let's write.*
answer: |-
  ### 1. The Correspondence Table

  | Element | Spatial Analogy (The Actuary's Model) | Temporal Reality (The Trust's Context) |
  | :--- | :--- | :--- |
  | **Distance** | Kilometers / Miles | Years / Decades |
  | **Person at Far End** | The Foreigner / Stranger | The Future Person / Descendant |
  | **Neighbour / Traveller** | The Local Citizen / Peer | The Current Beneficiary |
  | **Discount Rate** | Cost of Transport / Communication Friction | Pure Time Preference + Risk + Growth |
  | **Moral Claim** | Duty to Aid (diminished by distance) | Duty to Preserve (allegedly diminished by time) |
  | **Medium of Transfer** | Shipping / Wire Transfer | Investment / Compound Interest |
  | **Observer** | The Donor | The Trustee |

  ### 2. The Breaks in the Mapping

  You are correct that the direction of time is a break, but it is not the most damaging one. Here is the separation of the decorative from the consequential.

  **Decorative Breaks (Dramatic but philosophically neutral):**
  *   **Directionality:** Space is bidirectional (the stranger can come to me); time is unidirectional (the future cannot come to us). *Why it's decorative:* Moral obligation is often argued to be one-way regardless (e.g., parent to child). Reciprocity is not a prerequisite for duty.
  *   **Sensory Vividness:** We can see the neighbour and not the stranger; we can see the present and not the future. *Why it's decorative:* This describes a psychological limitation (salience), not a moral truth. Basing ethics on vividness is generally considered a bias (the "identifiable victim effect").

  **Consequential Breaks (Structural flaws in the argument):**
  *   **Ontological Status (The Non-Identity Problem):** The stranger across the ocean exists independently of whether I send aid. The future person's very existence (and identity) often depends on how the trust is managed today. If the Actuary spends the money now, different people will be born later than if she saves it. *Consequence:* You cannot harm a specific future individual by "discounting" them if your decision determines whether *they* exist at all. This breaks the "claim" model entirely.
  *   **The Is-Ought Gap:** The Actuary cites a *fact* (giving falls off with distance) to justify a *norm* (giving ought to fall off). *Consequence:* This is the naturalistic fallacy. Human psychology is prejudiced by distance; ethics is often the project of overcoming that prejudice.
  *   **Friction vs. Growth:** Moving money across space incurs a cost (shipping/fees). Moving money across time usually incurs a *gain* (compound interest/productivity). *Consequence:* In space, distance eats the resource. In time, distance (usually) grows the resource. Discounting in time is therefore not about preserving the pound, but about valuing the *opportunity cost* of not spending it now.
  *   **Uncertainty vs. Ignorance:** Distance in space implies communication lag. Distance in time implies fundamental epistemic opacity. We do not know the future currency, the future needs, or the future technology. *Consequence:* A discount rate based on "uncertainty" is prudent; a discount rate based on "moral thinning" is prejudicial.

  ### 3. Symmetry and Imports

  **Does the comparison cut symmetrically?**
  Yes, and this is the Actuary's trap. If the analogy holds, it licenses **both** spatial and temporal partiality. If it is rejected, it debunks **both**.
  *   If the Trustee accepts the analogy, he must admit he would be right to ignore a starving foreigner because he is far away.
  *   If the Actuary insists the foreigner *does* have a claim despite the distance, she must admit the future person *does* have a claim despite the time.
  *   **Verdict:** The analogy forces a choice between Cosmopolitanism (no spatial discounting) and Impartiality (no temporal discounting). You cannot have one without the other if the analogy is valid.

  **What does the analogy quietly import?**
  1.  **Objectivity of Distance:** It treats time as a container we look *through*, rather than a dimension we create *by acting*.
  2.  **Decay of Sympathy = Decay of Obligation:** It assumes that because our *feelings* weaken, our *duties* must weaken.
  3.  **Fixed Beneficiaries:** It assumes the future people are waiting in the wings, fully formed, rather than being contingent on our actions.

  **Does it reach the whole discount rate?**
  No. The analogy only supports **Pure Time Preference** (valuing now over later simply because it is now).
  *   It does *not* support discounting for **Probability of Extinction** (the trust might not exist in 100 years).
  *   It does *not* support discounting for **Marginal Utility of Wealth** (future people might be richer and need the pound less).
  *   The Actuary is conflating "we care less" with "they need it less" and "we are less sure."

  ### 4. The Sentences (Repaired Position)

  The Actuary's original position relies on the *moral* decay of concern. To repair it, she must pivot to the *epistemic* decay of competence. She must admit the future person's claim is equal, but argue that the *instrument* of help degrades.

  **The Actuary (Repaired):**
  > "I do not discount the value of their lives, but I discount the fidelity of our aim, for a pound spent today purchases a certainty of relief that a pound saved for tomorrow can only speculate upon."

  **The Trustee (Reply):**
  > "Then call it a tax on our own blindness, not a discount on their claim, for you have no right to charge them interest on the limits of your vision."

  ### 5. A Better Analogy

  The Space/Time analogy is philosophically radioactive (due to Parfit and the Non-Identity Problem). It invites the Trustee to win on moral grounds. The Actuary needs an analogy that admits moral equality but emphasizes **stewardship limits**.

  **The Image: The Relay Race in the Fog.**
  *   **The Setup:** The trust is not a warehouse of goods to be distributed across distance, but a baton passed through a relay race run in thickening fog.
  *   **The Actuary's Point:** You cannot run the future leg of the race for them. If you try to sprint their leg now (spend the capital), you exhaust the team. If you try to aim their stride (micromanage the future), you will stumble because you cannot see the track. The "discount" is the recognition that the runner in the fog must be allowed to adjust their own pace based on the ground they can actually see.
  *   **Why it works:** It preserves the equality of the runners (moral worth) but acknowledges the epistemic limitation (the fog) and the necessity of handing over agency (stewardship vs. control).

  **The Actuary using the Relay Analogy:**
  > "We are not shipping supplies to a static camp; we are running a relay into a fog, and to spend their energy on our leg is not generosity, it is collapse."

  **The Trustee's Counter:**
  > "But the fog is of our making, and to slow our pace because the track disappears is to ensure the race ends before the baton ever leaves our hands."
