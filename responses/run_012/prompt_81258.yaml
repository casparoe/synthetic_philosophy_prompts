  *(Note: A score of 1.0 means the case perfectly satisfies the account's criteria for "function"; 0.0 means it fails the criteria completely.)*

  ### Ranking: Most to Least Discriminating

  **1. Case 4 (Mammal Gut)**
  This case is the most discriminating because it presents a "Spandrel": the trait currently aids the system (CR = 1.0) but lacks the specific history of selection required by SE (SE = 0.0), forcing a direct contradiction on whether the warming effect is a function at all.

  **2. Case 3 (Bacterial Plasmid)**
  This is a near-perfect mirror of Case 4; the trait has the required history for SE (SE = 1.0) but makes no positive contribution to the current system, which CR requires (CR = 0.0), creating a maximal divergence in verdicts.

  **3. Case 5 (Neutral Trait)**
  The accounts diverge sharply here, though slightly less than in Case 3; SE attributes function based on ancestral selection (SE = 0.9), while CR denies it because a neutral trait contributes nothing to current capacity (CR = 0.1).

  **4. Case 2 (Plant Compound)**
  While CR affirms the new defensive role (CR = 1.0), SE can partially accommodate this by acknowledging the trait has *a* function (water retention) even if beetle deterrence isn't the *original* one, slightly reducing the conceptual conflict (SE = 0.2).

  **5. Case 1 (Bird Plumage)**
  This case is the least discriminating because both accounts largely agree the trait is non-functional regarding its current effects; SE rejects it due to lack of selection for the effect, and CR rejects it because the net causal impact is harmful to the organism (SE = 0.0, CR = 0.2).

  ### Closing Assessment

  Your ratings suggest that neither account is strictly better as a general theory; rather, they are complementary, with the Selected-Effects account better capturing the historical normativity of evolution and the Causal-Role account better capturing the immediate explanatory needs of physiology.
