      *   **Task 2:** Critique the mapping (honest vs. fudge).
      *   **Task 3:** Residue Report (what survives intact, what is distorted, what has no counterpart).
      *   **Task 4:** Evaluate the residue (lacuna in ML thinking vs. philosophical artifact).
      *   **Task 5:** Adjudicate the "Single Subject vs. Pair of Systems" difference (load-bearing or incidental?).
      *   **Constraint:** Do not simply map words; analyze the fidelity of the mapping.

  2.  **Deconstruct Molyneux's Problem:**
      *   *Setup:* Subject blind from birth. Learns cube vs. sphere via touch (haptic encoder). Gains sight (visual encoder comes online).
      *   *Question:* Can the subject identify cube vs. sphere by sight *alone* (zero-shot), without new tactile feedback (no fine-tuning)?
      *   *Negative Answer (Locke/Molyneux):* No. Touch and Vision are distinct languages. Association must be learned. (Empiricist).
      *   *Positive Answer (Leibniz):* Yes. Space/Geometry is amodal. The underlying structure is shared. (Rationalist).

  3.  **Drafting the Translation (Task 1):**
      *   *Subject:* A biological multimodal system.
      *   *Blind Phase:* Haptic encoder trained on tactile data. Latent space $Z_h$.
      *   *Sighted Phase:* Visual encoder initializes/comes online. Latent space $Z_v$.
      *   *The Test:* Zero-shot transfer from $Z_h$ to $Z_v$ for the classification task (cube vs. sphere).
      *   *Negative Answer:* $Z_h$ and $Z_v$ are unaligned. No shared latent subspace exists *a priori*. Contrastive alignment objective requires paired data (seeing *and* touching simultaneously). Without paired training data (which the newly sighted man hasn't had yet), the projection heads are random. Inductive bias is modality-specific.
      *   *Positive Answer:* There exists a universal geometric latent manifold $Z_{geo}$. Both encoders map to this shared structure by design (innate inductive bias). Zero-shot transfer works because the representations are isomorphic regarding spatial properties, even without contrastive alignment on paired data.

  4.  **Critiquing the Mapping (Task 2 - Honest vs. Fudge):**
