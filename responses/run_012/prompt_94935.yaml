      *   *Distorted:* The nature of "learning." In ML, learning is weight updates. In Locke, it's the formation of associations between ideas. The time scale differs (instant vs. epochs).
      *   *No Counterpart:* *Qualia/Phenomenology.* What it *feels like* to see a sphere. ML deals with functional performance (accuracy), not subjective experience. *Unity of Consciousness.* One subject vs. two models.
      *   *Lacuna vs. Artifact:*
