      *   *Fudge:* "Separately trained systems" vs. "One brain." In ML, we usually train two encoders to align. In Molyneux, it's one system acquiring a new channel. The "training distribution" changes dynamically.
      *   *Fudge:* "Latent Space." Philosophers talk about *ideas* or *perceptions*, not vector embeddings. The topology of "ideas" is metaphorical in philosophy, literal in ML.
