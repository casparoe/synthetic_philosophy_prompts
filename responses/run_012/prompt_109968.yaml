  I read the words that govern us today,
  Beneath the lime tree planted in the light,
  Whose shadow shows how time has slipped away.
  The branches block the morning's direct sight,
  Article Fourteen says the square stays cold,
  Unless we build to summon up the night.
  To break the lock, the breach must first unfold,
  I voted nay because I feared the hand,
  That trusts itself too little to be bold.
  That hand is mine, yet distinct from the man,
  Who stands here now and wishes for the space,
  To build a hall according to the plan.
  Is he a stranger occupying place?
  Or am I him, worn down by twenty years?
  If same, why does his vote outweigh my case?
  The text is paper, silent to the ears,
  It has no power unless I speak it loud,
  Yet stopping now invites unspoken fears.
  I could dissolve the chain, allow the crowd,
  To vote anew without the ancient key,
  My breath renews the vow I speak aloud,
  And turn the page to what comes after me.
