      *   *Let's go with the "Private Conscience" method.* All 12 are party members. The "Dissenter" is an external event (a leaked memo criticizing the party). The "Cascade" is the party deciding how to react to the leak.
      *   *Actually, the prompt says:* "respond to a dissenter." I will introduce a "Dissenter Card" held by one participant. They are instructed to raise a procedural objection. The Group must decide how to handle them. The Group members have private cards saying "You think the Dissenter is right, but you need Party support."
      *   *This is the strongest setup.*

