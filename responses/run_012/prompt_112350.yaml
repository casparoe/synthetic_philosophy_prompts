          3.  The Vote (Public commitment).
          4.  The Cascade (Iterative hardening).
          5.  Debrief.

      *   *The "Loyalty Cascade" Mechanism:* This is the trickiest part. How to make people privately disagree but publicly conform without explicit coercion?
          *   *Idea:* Secret ballots vs. Public declarations? No, Weil talks about the *pressure* of the group.
          *   *Idea:* Information asymmetry. Give them private "conscience cards" that conflict with the public goal.
          *   *Idea:* The "Purity Test." Each round, the platform must be affirmed. If you dissent, you lose status/utility.
          *   *Selected Mechanism:* "The Consensus Ratchet." The group must issue a joint statement. If anyone objects, the statement fails. To succeed, objectors must self-silence. But to make it *cascade*, the proposed statements need to get progressively more extreme based on the *perception* of group unity.
          *   *Refinement:* Let's use a "Whip Count" system. Participants have private values. They vote publicly. The "Party Leadership" (rotating or assigned) interprets the vote to set the next stance. If the vote is unanimous, the next stance is harder. If there's dissent, the leadership punishes the dissent (socially or mechanically).
          *   *Better Refinement for "Cascade":* Use a *Secret Preference* vs. *Public Commitment* gap.
          *   *Final Decision:* **The "Purity Spiral" Protocol.**
              *   Phase 1: Draft a moderate platform.
              *   Phase 2: Introduce a "Crisis" (a dissenter from outside or a procedural objection).
              *   Phase 3: Voting rounds. Each round requires a public show of hands to affirm the Party Line.
              *   The Twist: Participants are given *Private Mandates* (e.g., "You care deeply about X, but the Party is moving away from X"). They are told that if the Party fails to reach 100% unanimity on the response to the dissenter, *everyone* loses "Prestige Points." If they succeed, they gain Prestige.
              *   This creates the pressure: "I disagree, but if I speak up, I hurt my friends/colleagues." This mimics the "collective good" overriding individual truth.

  4.  **Developing the Mechanics:**
      *   **Currency:** "Prestige" (points on a board). High prestige = "Good Graduate Student/Colleague." Low prestige = "Marginalized."
      *   **Roles:**
          *   *The Secretariat (2 people):* Facilitate, interpret rules, propose the "Party Line."
          *   *The Members (10 people):* Vote, debate.
