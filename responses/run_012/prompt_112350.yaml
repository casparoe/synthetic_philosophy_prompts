          *   *Actually, to make the cascade work:* All 12 are party members. The "Dissenter" is a simulated external event (a memo read by facilitator). The pressure is internal.
      *   **The Cascade:**
          1.  Round 1: Moderate response.
          2.  Round 2: Harder response (Secretariat claims "The base demands strength").
          3.  Round 3: Extreme response (Secretariat claims "Anything less is betrayal").
          *   *Constraint:* Unanimity required for Prestige.
          *   *Private Info:* Each member gets a card saying "You personally believe [Moderate Position] is correct."
          *   *Result:* They vote for the Extreme Position to secure the group Prestige, despite private cards.

  5.  **Drafting the Timeline:**
      *   0-15: Intro & Weil Context (Brief).
      *   15-30: Party Formation (Create the Platform).
      *   30-45: The Crisis (The Dissenter appears).
      *   45-70: The Loyalty Cascade (3 Rounds of voting/pressure).
      *   70-90: Debrief (The most important part).

  6.  **Addressing the "Penalty/Payoff":**
      *   No money. Use "Academic Capital."
      *   Payoff: Priority choice of seminar topics, or simply "Public Recognition" vs. "Silence."
      *   Better: "The Tenure Track." Points represent "Departmental Support." If the party fails (no unanimity), everyone gets a "Mark of Disloyalty." If they succeed, they get "Endorsement."
      *   *Crucial:* The penalty for dissent must be *social*, not just mechanical. The rules should encourage shaming.

  7.  **Addressing Failure Modes:**
      *   *Risk 1:* Someone refuses to play along (breaks the simulation).
      *   *Risk 2:* Everyone laughs it off (doesn't feel real).
      *   *Risk 3:* The "Dissenter" gets actually bullied (harmful).
      *   *Mitigation:* Safe words, clear framing that this is a simulation, debrief immediately.
      *   *Risk 4:* The cascade doesn't happen (they stay moderate).
      *   *Mitigation:* The Secretariat needs to be coached to ramp up pressure.

  8.  **Addressing Weil's Limitations:**
      *   The sim creates *artificial* pressure (rules). Real parties create *organic* pressure (careerism, identity).
      *   The sim is short; real radicalization takes time.
      *   Weil's solution (abolition) won't be tested, only the problem.

