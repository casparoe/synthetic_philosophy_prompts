      *   The Rule: "To maintain Departmental Funding (Prestige), the Party must speak with One Voice. Any public dissent reduces Funding for *everyone*."
      *   This creates the Prisoner's Dilemma/Tragedy of the Commons that Weil describes: Individual truth vs. Collective survival.

