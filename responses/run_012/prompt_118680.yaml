answer: |-
  ### The Hypercomputation Review Procedure

  Use this flowchart to separate mathematical possibility from physical plausibility. It distinguishes the original Church–Turing Thesis (CTT) regarding effective calculability from the Physical CTT (CTT-P) regarding our universe's laws.

  **Q1: Computability vs. Complexity**
  Does the proposal claim to decide a set *undecidable* by a Turing machine (e.g., Halting Problem), or merely to solve a decidable set *faster*?
  *   **Sufficient Answer:** If the claim is solely about speed (efficiency), CTT is irrelevant.
  *   **Stop:** **Reject hypercomputation claim.** Judge solely on engineering merit (e.g., quantum speedup is real but Turing-computable).
  *   **Flag:** Confusing exponential parallelism with super-Turing power is a category error, not cheating.

  **Q2: The Infinity Check**
  Does the mechanism require infinite precision (real-valued registers), infinite energy density, or infinitely many operations in finite time (Zeno machines)?
  *   **Sufficient Answer:** Yes, if the model assumes continuous variables without noise floors or discrete steps without time bounds.
  *   **Stop:** **Reject as unearned idealisation.** Physics imposes finite information density (Bekenstein bound) and thermodynamic noise. Assuming infinite precision is mathematically valid but physically cheating.
  *   **Flag:** This looks like physics but is really an abstraction error.

  **Q3: The Physics Hand-off**
  Does the mechanism rely on speculative physics (e.g., closed timelike curves, exotic matter, Malament-Hogarth spacetimes) not yet observed?
  *   **Sufficient Answer:** The math is consistent with General Relativity, but the physical realization requires conditions we cannot create or verify.
  *   **Hand-off:** This is not a math question. Refer to a theoretical physicist. Do not reject on mathematical grounds.
  *   **Flag:** If the physicist says "possible in principle but unstable," proceed to Q4.

  **Q4: The CTT-P Prior**
  If the proposal passes Q1–Q3 but implies CTT-P is false, do we fund?
  *   **Sufficient Answer:** No.
  *   **Stop:** **Reject.**
  *   **Honesty:** This is not proof. This is the panel's prior belief that CTT-P will survive. We fund incremental physics, not bets against computability.

  ***

  ### Worked Cases

  **1. The Analog Real-Valued Device**
  *Proposal:* Registers hold arbitrary real numbers; exact equality tests decide undecidable sets.
  *Procedure:*
  *   Q1: Claims undecidability. (Pass)
  *   Q2: Requires infinite precision to distinguish real numbers. (Fail)
  *   **Verdict:** **Reject.**
  *   **Reasoning:** Fails Q2. Infinite precision is the "lab coat definition" cheating. Noise destroys the least significant bits required for the computation. The authors have built a mathematical model, not a physical proposal.

  **2. The Quantum Architecture**
  *Proposal:* Evaluates exponentially many paths at once to surpass the Thesis.
  *Procedure:*
  *   Q1: Claims to surpass CTT. (Check)
  *   Analysis: Quantum computers solve BQP problems. These are Turing-computable.
  *   **Verdict:** **Reject hypercomputation claim.**
  *   **Reasoning:** Fails Q1. This is a complexity claim disguised as computability. The authors confuse "hard for classical" with "unc computable." Fund only if they pivot to engineering speedup claims.

  **3. The Relativistic Zeno Scheme**
  *Proposal:* Uses specific spacetime geometries to complete infinite steps in finite proper time, deciding the Halting Problem.
  *Procedure:*
  *   Q1: Claims undecidability. (Pass)
  *   Q2: Requires infinite steps. (Flag: Idealisation)
  *   Q3: Relies on Malament-Hogarth spacetimes. (Hand-off)
  *   Q4: Physics is theoretically consistent but requires unstable exotic conditions.
  *   **Verdict:** **Reject.**
  *   **Reasoning:** This is the unpleasant verdict. The math is sounder than Case 1; the physics is not strictly forbidden by General Relativity. We reject not because the proposal is demonstrably false, but because we bet on CTT-P. We are prioritizing our prior belief over their mathematical consistency.

  ***

  ### What the Procedure Cannot Settle

  This procedure protects the panel from mathematical errors and physical idealizations, but it cannot falsify CTT-P. Your friend was partially right: CTT is a definition of effective calculability, but CTT-P is a physical conjecture. This test separates them.

  However, Q4 exposes the truth: the procedure ultimately rests on your prior that nature forbids hypercomputation. If a proposal ever clears Q3—physically realizable, finite resources, yet super-Turing—this procedure forces you to reject it based on belief, not proof. You are not judging math there; you are guarding a paradigm. Acknowledge that in the assessment sheet.
