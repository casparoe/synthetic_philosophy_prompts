      *Better "Hope Nobody Asks":* "If the driver is rational ex-ante, and knows they will be rational ex-ante, why do they need a theory of choice at the node at all? If the answer is 'they don't,' haven't you just abolished the decision problem rather than solved it?"

  5.  **Drafting the Content (incorporating tone and constraints):**
