      *   *Analogy:* Completeness in analysis. Chains are like Cauchy sequences. Upper bounds are like limits.

  3.  **Deconstruct Question 2: Maximal vs. Maximum.**
      *   *Definition:* Maximum ($\forall y, y \leq m$) vs. Maximal ($\nexists y, m < y$).
      *   *Why it matters:* In partial orders, elements can be incomparable. A maximum must be comparable to *everything* and greater. A maximal element just needs to be a "dead end."
      *   *Load-bearing examples:*
          *   *Vector Space Basis:* A basis is a maximal linearly independent set. It is *not* the maximum linearly independent set (there is no unique "largest" one, and "size" isn't the order relation anyway; the order is subset inclusion). If we demanded a maximum, we'd need a unique basis that contains all other independent sets, which is nonsense.
          *   *Maximal Ideals:* In a ring (e.g., $\mathbb{Z}$), ideals are ordered by inclusion. $(2)$ is maximal (quotient is field $\mathbb{Z}_2$). $(3)$ is maximal. Neither contains the other. There is no *maximum* ideal (except the ring itself, which is usually excluded). We need *a* dead end, not *the* peak.
