answer: |-
  Here is the specification for a theory of bounded rationality (BR), the incompatibilities inherent in the design, and a comparative audit of the three major implementations.

  ### 1. The Specification: Requirements for a Valid Theory

  To count as a theory of bounded rationality rather than merely a theory of error or a disguised neoclassical model, the framework must satisfy the following constraints.

  **A. Phenomenological Coverage (The Cases)**
  1.  **Search Termination:** It must model agents who stop search upon meeting a threshold (satisficing) rather than continuing until marginal cost equals marginal benefit.
  2.  **Ignorance of the Optimum:** It must accommodate agents who never generate the globally optimal option in their choice set, not because search costs prohibited it, but because the cognitive representation of the problem excluded it.
  3.  **Less-Is-More Effects:** It must explain cases where reducing information or using a non-compensatory rule (e.g., lexicographic) yields higher predictive accuracy or payoff than a weighted additive model using all available data.

  **B. Conceptual Distinctions (The Boundaries)**
  1.  **Procedural vs. Substantive:** It must distinguish between the quality of the *outcome* (substantive) and the quality of the *deliberative process* (procedural). A good BR theory evaluates the latter.
  2.  **Internal vs. External Bounds:** It must specify whether the limit is a hard cognitive constraint (working memory capacity) or a soft economic constraint (cost of information). Conflating these collapses BR into standard cost-benefit analysis.
  3.  **Agent vs. Theorist Bounds:** It must not impose bounds on the *agent* that are only visible to the *theorist*. The agent must be acting rationally *relative to their perceived bounds*, not just appearing bounded to an omniscient observer.
  4.  **Descriptive vs. Normative:** It must clarify if it is explaining why people *fail* to optimize (descriptive/psychological) or why optimizing is *the wrong standard* (normative/ecological).

  **C. Formal Consistency (The Results)**
  1.  **No Infinite Regress:** The theory cannot require the agent to optimize the cost of optimization without triggering an infinite regress (calculating the cost of calculating the cost...).
  2.  **Stability of Aspirations:** If the theory uses aspiration levels, it must provide a dynamic rule for how those levels adjust over time without assuming the adjustment rule itself is the result of a prior maximization.
  3.  **Environmental Coupling:** It must treat the mind and environment as a coupled system. Rationality cannot be defined solely by internal consistency (logic); it must include fit with the external structure.

  ---

  ### 2. The Incompatibilities: What Cannot Be Met at Once

  You have identified the central fracture point. There is a trilemma here. You cannot simultaneously satisfy the following three requirements:

  1.  **Descriptive Realism:** The agent sets an aspiration level and stops search when met (Simon's satisficing).
  2.  **Normative Robustness:** This behavior is declared "rational," not just a psychological quirk.
  3.  **Non-Optimized Bounds:** The setting of the aspiration level is *not* itself the result of an optimization calculation.

  **The Conflict:**
  If you demand **Normative Robustness** (2) within a traditional framework, you are forced to argue that the agent chose that specific aspiration level because it was the *best* level to choose. This immediately violates **Non-Optimized Bounds** (3) and collapses the model into **Optimization under Constraints**.

  If you maintain **Non-Optimized Bounds** (3) (i.e., the aspiration level is given, learned, or biologically fixed), you struggle to claim **Normative Robustness** (2). Critics will argue the agent is merely following a rule of thumb that *might* be wrong, rendering the behavior descriptive but not rational.

  If you maintain **Descriptive Realism** (1) and **Non-Optimized Bounds** (3), you must sacrifice **Normative Robustness** (2) in the traditional sense. You have to admit satisficing is "common" but not necessarily "right," unless you redefine rationality entirely.

  **The Decision: Which Requirement to Drop?**

  **Drop Requirement 3 (The demand that the bound-setting mechanism be explicitly optimized by the agent).**

  *Reasoning:* Insisting that the agent must *calculate* the optimal aspiration level reintroduces the infinite regress Simon warned against. It assumes the cognitive cost of setting the bar is negligible or calculable, which contradicts the premise of bounded rationality.

  *The Fix:* You must treat the aspiration level and its adjustment rule as **adaptive** rather than **optimized**. They are the product of evolution, learning, or social imitation, not conscious calculation. This allows you to keep Descriptive Realism (people do satisfice) and Normative Robustness (it is rational because it is adaptive to the environment), provided you shift the locus of rationality from the *moment of choice* to the *history of adaptation*.

  ---

  ### 3. Comparative Audit of the Three Approaches

  Here is how the major camps stack up against the spec and the trilemma.

  #### A. Satisficing Proper (Simon)
  *   **Mechanism:** Search proceeds sequentially; stop when stimulus > aspiration level. Aspiration adjusts based on ease of finding alternatives.
  *   **Spec Compliance:**
      *   *Cases:* Nails search termination. Struggles with "less-is-more" (Simon focused more on stopping rules than information reduction).
      *   *Distinctions:* Strong on Procedural vs. Substantive.
      *   *Consistency:* Fails the "Stability of Aspirations" check. Simon describes *that* aspirations adjust, but the exact function is underspecified.
  *   **The Trade-off:** Simon drops **Normative Robustness** in the neoclassical sense. He argues for "procedural rationality," but leaves the door open for the charge that satisficing is merely "good enough" rather than "optimal." He avoids the regress by not modeling the adjustment of aspirations as an optimization problem, but this leaves the normative status of the adjustment rule vague.

  #### B. Optimization under Constraints (Stigler/Becker)
  *   **Mechanism:** The agent maximizes utility subject to a cost of information/search constraint.
  *   **Spec Compliance:**
      *   *Cases:* Fails "Less-Is-More." By definition, more information (if costless) is always better. It cannot explain why cruder rules win.
      *   *Distinctions:* Collapses **Internal vs. External Bounds**. All bounds are treated as economic costs.
      *   *Consistency:* Fails the **No Infinite Regress** check. To optimize the search cost, you must search for the optimal search cost.
  *   **The Trade-off:** This approach drops **Descriptive Realism** and **Non-Optimized Bounds**. It saves **Normative Robustness** by definition (everything is optimization), but Simon rightly dismissed this as "a theory of optimal angels, not boundedly rational humans." It is a theory of unbounded rationality applied to constraints, not bounded rationality.

  #### C. Heuristics and Ecological Rationality (Gigerenzer et al.)
  *   **Mechanism:** An adaptive toolbox of fast-and-frugal heuristics matched to specific environmental structures.
  *   **Spec Compliance:**
      *   *Cases:* Nails "Less-Is-More" and "Ignorance of the Optimum."
      *   *Distinctions:* Strong on **Agent vs. Theorist Bounds** (rationality is in the fit, not the mind alone).
      *   *Consistency:* Solves the **Aspiration Regress** by treating heuristics as evolved/learned adaptations. The "rationality" is in the ecological fit, not the calculation.
  *   **The Trade-off:** This approach drops the demand for a **Universal Normative Standard**. Rationality becomes local and context-dependent. A heuristic is rational in Environment A and irrational in Environment B. This satisfies the spec's demand for **Environmental Coupling** but makes it harder to derive general laws of behavior. It resolves the aspiration tension by saying the aspiration level is part of the heuristic tool, validated by ecological success, not internal calculation.

  ### Summary Recommendation

  If you are writing on this, the most defensible position is the **Ecological Rationality** resolution.

  1.  **Accept** that aspiration levels are not optimized in the moment.
  2.  **Argue** that they are rational because they are selected for by the environment (evolutionarily or via learning).
  3.  **Concede** that this means rationality is not a property of the mind alone, but of the mind-environment system.

  This allows you to keep the descriptive facts (satisficing, less-is-more) and claim normativity (it works), without falling into the trap of optimizing the optimization (Stigler) or leaving the aspiration mechanism as a black box (Simon).
