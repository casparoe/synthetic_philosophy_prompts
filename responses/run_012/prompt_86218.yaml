prompt: |-
  Right, so I'm meant to be writing on bounded rationality and I've read enough Simon to get the slogans, but before I go any futher I want the spec. What would a theory of decision-making under real cognitive limits have to deliver to count as any good? Give me the full list: the cases it has to get right — someone who stops looking for a flat the moment one clears her bar, someone who never so much as considers the option that would have been best, and the awkward finding that people sometimes do better with less information and cruder rules — the distinctions it can't fudge (describing what we do versus telling us what we ought to do, a limit on computation versus a limit on information, a bound the agent has versus one the theorist imposes), and any results it has to stay consistent with.

  What I'm most interested in is which requirements can't all be met at once. The one that keeps biting me: you're supposed to say where the aspiration level comes from without that turning out to be another optimisation problem in disguise, and at the same time to say whether satisficing is actually rational or merely common. If a pair is genuinely unsatisfiable, tell me which requirement you'd drop. Then briefly, how satisficing proper, the optimise-under-a-computational-budget line, and the heuristics-and-ecological-rationality crowd stack up against the list. No reading list please, I'll find that myself.
