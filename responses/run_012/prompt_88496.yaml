answer: |-
  To treat the claim that power systematically shapes the historical record as more than a slogan, we require standards of adequacy. A theory that cannot specify its own limits is merely an ideology. The following desiderata define what any defensible account must deliver, distinguishing genuine methodological requirements from the prejudices of competing camps.

  First, the theory must distinguish attrition without intent from curation with intent. Records of the powerful may predominate because someone deliberately destroyed, suppressed, or rewrote the rest, or merely because the powerful produced more records on more durable media through institutions that kept copying them. These are different mechanisms with different evidential signatures. Consider the survival of Roman law versus the loss of Carthaginian texts. One reflects institutional continuity and material durability; the other reflects active suppression and political erasure. A theory that fuses them explains everything and predicts nothing. This is a genuine requirement. Without this distinction, we cannot determine whether a silence is the result of malice or material decay, and we cannot tailor our methods of recovery accordingly.

  Second, the theory must account for survival by ventriloquism. The testimony of a defeated people often reaches us only inside the victors' archives—translated, excerpted, and categorized for their purposes. The defeated presence in the record is therefore not evidence that the record is unbiased. Inquisition records contain heretic speech, but only framed as error to be condemned. A theory has to say what kind of presence would count as evidence and what would not. Mere citation is insufficient; the theory must specify criteria for identifying when the frame distorts the content beyond recovery. This is a genuine requirement because accepting presence as voice validates the victor's framing. The prejudice to avoid here is the assumption that inclusion equals representation.

  Third, regarding the level at which power operates: the theory must specify the vector rather than leaving power as a single undifferentiated force. To say "power shapes the record" is trivial unless it identifies the mechanism. Is it the state censor, the market demand for sensationalism, the clerical monopoly on literacy, or the grammatical structures of the surviving language? Each operates differently. State censorship leaves gaps; market forces leave exaggerations; linguistic structures leave conceptual blind spots. Undifferentiated power is a metaphysical placeholder, not a historical explanation. This is a genuine requirement. The prejudice to avoid is the tendency to treat "power" as a monolithic agent rather than a set of dispersed processes. A theory that fails to locate power cannot explain how it functions.

  Fourth, on historical relativism: the theory must reject the conclusion that patterned power-shaping means no account is better than any other. This is a prejudice of skepticism dressed as radicalism. Instead, power-shaping underwrites a more demanding method. The theory must distinguish a meaningful silence from an accidental gap. An accidental gap is random loss, like a fire in a library; a meaningful silence is the structural absence of a category of person, such as the enslaved who were legally barred from writing. The theory must provide criteria for diagnosing the difference. If it cannot, it surrenders history to nihilism. This is a genuine requirement because history relies on the possibility of comparative adequacy. The prejudice to avoid is the demand for perfect objectivity; we do not need neutrality to make judgments, we need transparency about distortion.

  Here lies a tension. The demand for specific mechanisms conflicts with the ubiquity of power. If power operates at every level—language, market, state—isolating a variable becomes impossible. This subset of requirements—specificity versus ubiquity—is jointly unsatisfiable if power is defined as totalizing. If power is everywhere, it is nowhere specific enough to test. The conflict is real, not an artifact of loose formulation. A theory must choose between explanatory scope and empirical precision. It cannot claim total determination of the record and also claim to identify specific causal vectors without contradiction.

  Finally, the theory must specify what counts as evidence against it, and whether such evidence is available. We check the theory against the surviving record, which the theory claims is distorted. If no record can count against the claim, the claim is trivially true and explanatorily empty. Evidence against must come from non-textual anchors, such as archaeology or genetics, or internal contradictions within the record itself. If the theory renders all counter-evidence interpretable as further proof of masking, it has collapsed into circularity. The demand for neutral access is a prejudice of positivism, but the demand for total irrecoverability is a prejudice of nihilism. Both must be rejected. The genuine requirement is falsifiability via external anchors. If the claim cannot escape that circularity without collapsing into triviality, it must be abandoned as a historical theory and retained only as a philosophical stance.

  The single requirement that does the most to rule out candidate positions is the demand for falsifiability via non-textual anchors. Most theories of power rely solely on textual critique, which remains inside the circle of the record. Insisting on external verification forces the theory to engage with material reality, preventing it from becoming a self-sealing hermeneutic loop. Without this, the theory is immune to refutation and therefore useless.
