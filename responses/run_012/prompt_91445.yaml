answer: |-
  You have put your finger on one of the most frustrating and durable truths in political science and organizational theory. You are describing a phenomenon where power is not eliminated by reform, but **displaced** into the un-reformed technicalities of the system.

  Your brother is half-right: this is absolutely related to the **"Second Face of Power,"** but that term describes the *location* of the power, not the *movement* you noticed. You are describing the dynamic reaction of a system to reform.

  Here is the breakdown of the existing concepts, where they fit, where they break, and a proposed name for the specific move you identified.

  ### 1. The Closest Existing Concept: "The Second Face of Power"
  **Origin:** Political scientists Peter Bachrach and Morton Baratz (1962).
  **The Idea:** They argued power has two faces.
  *   **Face 1:** Making decisions (voting, passing laws). This is what your school fixed with the lottery.
  *   **Face 2:** **Non-decision making.** This is the power to keep items *off* the agenda, to decide what is "unrealistic," or to control the flow of information so that certain decisions never have to be made.
  **Where it fits:** It perfectly describes the "three people holding the pen." They exercise the Second Face by controlling the agenda, the experts, and the definition of a "good proposal."
  **Where it stops fitting:** It describes a static state of affairs. It doesn't quite capture the *migration* you observed—how power *fled* the voting booth and *hid* in the agenda-setting committee when the rules changed. It explains the *result*, but not the *maneuver*.

  ### 2. The Organizational Concept: "Decoupling"
  **Origin:** Institutional Theory (Meyer & Rowan, 1977).
  **The Idea:** Organizations often change their **formal structures** (the written rules, the org chart, the lottery system) to look legitimate and fair, while their **informal practices** (how work actually gets done, who actually talks to whom) remain unchanged.
  **Where it fits:** This captures the "poster vs. reality" gap. The student council *decoupled* its selection method from its actual influence. The lottery was a ceremonial change to satisfy the demand for fairness, while the real work remained coupled to the original power structure.
  **Where it stops fitting:** Decoupling often implies incompetence or bureaucracy just "coasting." Your example sounds more strategic—the power holders actively retained control over the levers that mattered. Decoupling is passive; your observation is active.

  ### 3. The Game Theory Concept: "Meta-Power"
  **Origin:** Various (often associated with Steven Lukes or Constitutional Political Economy).
  **The Idea:** There is power *in* the game (voting, debating), and there is power *over* the game (setting the rules, defining the boundaries).
  **Where it fits:** By randomizing the representatives, you changed the players *in* the game. But the "three people" retained **Meta-Power**. They determine the constraints within which the lottery winners must operate.
  **Where it stops fitting:** It's a bit abstract. It doesn't explain *why* the power moved there specifically. It just says "they had higher-level power."

  ---

  ### The Specific "Move": Power Displacement
  If we combine these, the specific phenomenon you are noticing is best described as **Power Displacement** (sometimes colloquially called the **"Balloon Effect"** in policy circles: squeeze a balloon in one spot, it bulges in another).

  However, since you asked for a name for this specific shape—where reform targets the *visible* selection mechanism but ignores the *invisible* procedural mechanism—I propose we call this:

  ## **"Procedural Residue"**

  **Definition:** *Procedural Residue* occurs when a reform eliminates a visible source of authority (like elections), but fails to randomize or regulate the underlying procedural infrastructure (agenda-setting, information flow, rule interpretation). The power does not vanish; it settles into the "residue" of the process that was left untouched.

  **What it is NOT:**
  *   **It is not Corruption:** Corruption implies breaking the rules for private gain. Procedural Residue happens *within* the rules. The three people aren't necessarily breaking any bylaws; they are just using the ones that weren't changed.
  *   **It is not Oligarchy (strictly):** The Iron Law of Oligarchy says elites will *always* emerge. Procedural Residue says elites will *persist* if you don't reform the infrastructure they stand on. You could theoretically have an oligarchy without residue (if they seized the lottery too), but residue is the *mechanism* of their survival.
  *   **It is not Inertia:** Inertia implies nothing moves. In Procedural Residue, the visible part moves (new lottery winners), but the steering mechanism stays locked.

  ---

  ### The Edges: Testing the Limits
  You asked where the edges are. Does it still count if we randomize the other parts?

  **Edge Case 1: What if the Agenda-Setter is also chosen by lottery?**
  *   **The Shift:** If you randomize the agenda, *Procedural Residue* moves deeper. It moves to **Information Asymmetry**.
  *   **The New Residue:** Who writes the briefing papers? Who decides which "facts" are presented to the agenda-setter? If the random agenda-setter relies on the permanent staff for data, the staff still controls the outcome by omitting key data. This is Lukes' **"Third Face of Power"** (shaping what people perceive as possible).
  *   **Verdict:** Yes, it still counts as Residue, just deeper in the stack.

  **Edge Case 2: What if the Agenda is nailed down by a rigid rule?**
  *   **The Shift:** If the agenda is automated (e.g., "We must discuss the top 5 complaints submitted by students"), the Residue moves to **Interpretation**.
  *   **The New Residue:** Who decides if a complaint is "valid"? Who categorizes the complaints? If a rule says "Discuss safety issues," the person who defines "safety" holds the power.
  *   **Verdict:** This is the hardest edge to eliminate. As long as humans interpret the rules, there is Residue.

  **Edge Case 3: What if EVERYTHING is random (Sortition + Agenda + Staff)?**
  *   **The Shift:** You eliminate Procedural Residue, but you introduce **Competence Collapse**.
  *   **The New Problem:** If no one knows how to run the meeting, write the budget, or understand the bylaws, the system creates a vacuum. Immediately, an informal hierarchy will emerge based on who speaks loudest or knows the most. The Residue re-forms instantly as **Informal Influence**.
  *   **Verdict:** Procedural Residue is almost thermodynamic; it's the heat left over after you try to cool the system down.

  ### Summary
  Your intuition is sharper than most political science undergraduates. You identified that **selection is not the only locus of power.**

  *   **The Academic Label:** Second Face of Power / Decoupling.
  *   **The Dynamic Label:** Power Displacement.
  *   **The Coined Label:** **Procedural Residue.**

  The lesson from your student council is that **sortition without procedural democratization is just theater.** If you randomize the actors but keep the same script, director, and stage manager, the play doesn't change. You noticed that the power wasn't in the chairs; it was in the script. That is the definition of Procedural Residue.
