prompt: |-
  I run a second-year philosophy of probability option — 18 students, one 90-minute session, no prior anthropics. I want a betting game that makes them feel the pull of the self-indication way of thinking (weight a hypothesis by how many observers it contains, so favour the world with more copies of you) and then walks them into the presumptuous philosopher, where that pull says you should be nearly certain the universe is astronomically large. Seed to build on, change whatever you need: I secretly flip a coin. Heads — exactly one copy of each student exists. Tails — twelve copies exist of each, same memories, identical windowless rooms, no way to tell whether you're the only one. Each student bets on the coin at even odds. Round one scoring: one point per copy of you that guessed right, minus one per copy that guessed wrong, so a tails world multiplies your score by twelve. Round two: you're paid the average across your copies instead. I want them to find that under round one they should pile onto tails even though the coin is fair and they've learnt nothing about it, and that under round two theres no edge either way — and to notice that neither of those is the same as believing tails.

  Don't name the self-sampling/self-indication split or the presumptuous philosopher until the debrief; the shift has to come out of the payoffs. Give me the whole run: how to stage the rooms with 18 real people and no actual duplication, the slips, both rounds, the reveal, and a debrief that maps what happened onto the two assumptions, scales twelve up to something like 10^100 so they see where the presumptuous conclusion comes from, and is honest that the payout scaling is doing work the credence debate needn't endorse. Tell me what predictably goes wrong the first time — I'd bet on someone insisting there's no fact of the matter about which copy they are — and how to handle it, and be straight about what the activity can't reproduce at all.
