answer: |-
  Here is a complete run-sheet for the 90-minute session. It is designed to be tight, slightly disorienting (in a productive way), and philosophically rigorous.

  ### **Preparation**

  *   **Room:** One windowless room (or blinds drawn). Arrange desks so students cannot see each other's slips.
  *   **Props:**
      *   One large, visible coin.
      *   Two colours of betting slips (e.g., Blue for Heads, Red for Tails).
      *   A scoreboard (whiteboard).
      *   Printed instruction sheets (see below).
  *   **The Secret:** You (the instructor) must flip the coin *before* they enter or during a moment they cannot see, and record the result. Do not reveal it until the end.
  *   **The Fiction:** You are not lying about the coin, but you are asking them to accept a metaphysical fiction regarding the copies. Be clear that the *payoff* simulates the copies, even if the ontology doesn't.

  ---

  ### **Part 1: The Setup (0–10 mins)**

  **Instructor Script:**
  "Welcome. Put away phones and bags. We are running a decision experiment. I have flipped a fair coin. It is currently sitting in my pocket.
  *   **Heads:** There is exactly one of you in this room.
  *   **Tails:** There are twelve exact copies of each of you, in twelve identical rooms, with identical memories up to this moment.

  You do not know which world you are in. You cannot communicate. For the purpose of this game, you must reason as if the duplication is real. If Tails, there are 216 'students' in the universe (18 × 12). If Heads, there are 18.

  You will place two bets. Your currency is Course Points. I will collect the slips, calculate scores based on the rules, and announce the winner."

  **Handout (The Rules):**
  > **THE EXPERIMENT**
  > 1. **The Coin:** Fair (50/50). Hidden result.
  > 2. **The World:**
  >    *   **Heads:** 1 Copy of you exists.
  >    *   **Tails:** 12 Copies of you exist.
  > 3. **The Bet:** Choose Heads or Tails.
  > 4. **Scoring:**
  >    *   **Round 1:** +1 point for every copy of you that guesses right. -1 point for every copy that guesses wrong.
  >    *   **Round 2:** +1 point if *you* guess right. 0 if wrong. (Average score per copy).
  > 5. **Constraint:** You gain no new evidence between Round 1 and Round 2.

  ---

  ### **Part 2: Round 1 — The Total Score (10–25 mins)**

  **Instruction:**
  "Round 1. Look at the scoring rule. Your score is the **sum** of all your copies' results.
  If Heads: You are the only one. If you guess right, +1. Wrong, -1.
  If Tails: There are 12 of you. If you all guess right, +12. If you all guess wrong, -12.
  Assume all your copies reason identically. Place your bet."

  **Action:**
  Distribute slips. Collect them. Do not reveal the coin.
  Pick a student to calculate the **Expected Value (EV)** on the board.

  **The Math (Board Work):**
  *   Let $C$ be the choice (Heads or Tails).
  *   $P(Heads) = 0.5$. Payoff if Right = $1 \times 1$. Payoff if Wrong = $-1 \times 12$ (because in Tails world, 12 copies guessed wrong).
  *   $P(Tails) = 0.5$. Payoff if Right = $12 \times 1$. Payoff if Wrong = $-1 \times 1$.
  *   *Wait, check the logic:* If I bet Tails:
      *   World is Heads (50%): I am the only one. I guessed wrong. Score = -1.
      *   World is Tails (50%): There are 12 of us. We all guess right. Score = +12.
      *   $EV(\text{Bet Tails}) = 0.5(-1) + 0.5(12) = +5.5$.
  *   If I bet Heads:
      *   World is Heads (50%): I am the only one. I guessed right. Score = +1.
      *   World is Tails (50%): There are 12 of us. We all guessed wrong. Score = -12.
      *   $EV(\text{Bet Heads}) = 0.5(1) + 0.5(-12) = -5.5$.

  **Instructor:**
  "Who bet Tails? (Most hands should go up). Why?"
  *Expected Answer:* "Because the payout is bigger."
  *Instructor:* "Is it just the payout? Or does the fact that there are *more of you* in Tails make it more likely you are in Tails?"
  (Don't answer yet. Just note the tension.)

  ---

  ### **Part 3: Round 2 — The Average Score (25–40 mins)**

  **Instruction:**
  "Round 2. Same coin. Same room. Same ignorance.
  New Rule: You are paid the **average** score per copy.
  If Heads: 1 copy. Right = +1.
  If Tails: 12 copies. Right = +12 total, divided by 12 copies = +1 per copy.
  The multiplier is cancelled out. Place your bet."

  **Action:**
  Distribute slips. Collect them.
  Ask for a show of hands. You will likely see a split, or many students switching to "Indifferent/Heads".

  **The Math (Board Work):**
  *   Bet Tails:
      *   Heads (50%): Wrong. Score = -1.
      *   Tails (50%): Right. Score = +1.
      *   $EV = 0$.
  *   Bet Heads:
      *   Heads (50%): Right. Score = +1.
      *   Tails (50%): Wrong. Score = -1.
      *   $EV = 0$.

  **Instructor:**
  "The bet is now fair. The 'copy multiplier' is gone. Did anyone change their mind? Did your *belief* about the coin change, or just your bet?"
  (Leave this hanging until the debrief.)

  ---

  ### **Part 4: The Reveal (40–50 mins)**

  **Action:**
  Reveal the coin. Calculate the actual points for a few volunteers based on the result.
  *   *If Heads:* The Round 1 Tails-betters lose points. Emphasize: "You made the rational bet ex-ante, but got unlucky ex-post. The logic held, the world didn't."
  *   *If Tails:* The Round 1 Tails-betters win big.

  **Transition:**
  "We are now done with the game. Keep your slips. We are moving to philosophy."

  ---

  ### **Part 5: Debrief — Mapping the Intuitions (50–80 mins)**

  **1. Naming the Assumptions (50–60 mins)**
  "In Round 1, you acted as if the Tails world was more likely, or at least more valuable, because it contained more observers. In philosophy, this is the **Self-Indication Assumption (SIA)**.
  *   **SIA:** All else equal, you should reason as if you are more likely to exist in a world with more observers.
  *   **Why?** Because 'you' are more likely to be sampled from the larger set of observers.
  *   **Round 1 Logic:** 'If Tails, there are 12 chances for a copy of me to be right. If Heads, only 1. So I bet Tails.'

  "In Round 2, the payoff was normalized per observer. This neutralizes the SIA pull. This aligns closer to the **Self-Sampling Assumption (SSA)**.
  *   **SSA:** You should reason as if you are a random sample from the set of actual observers in your reference class.
  *   **Round 2 Logic:** 'Whether there are 1 or 12 of me, *I* am just one observer. The coin is fair. No edge.'

  **2. The Presumptuous Philosopher (60–70 mins)**
  "Here is the danger of Round 1 thinking. Let's scale the numbers.
  Imagine two theories of cosmology:
  *   **Theory A:** The universe contains $10^{10}$ observers.
  *   **Theory B:** The universe contains $10^{100}$ observers.
  Both theories fit the physical evidence equally well. The prior probability is 50/50.

  If you use **Round 1 (SIA)** logic:
  You should be virtually certain ($10^{90}$ to 1) that Theory B is true. Why? Because there are vastly more copies of 'you' in Theory B.
  This is the **Presumptuous Philosopher** problem (Bostrom, 2002).
  It implies you can determine the size of the universe *without looking out the window*, just by counting how many people *would* exist if different theories were true.

  Does that seem right? Can you prove the universe is huge just by betting on it?
  Most philosophers say no. This suggests Round 1 (SIA) leads to absurd certainty.
  But if you use Round 2 (SSA) logic, you stay at 50/50. You remain humble. You need empirical evidence to decide the size of the universe."

  **3. Credence vs. Betting (70–80 mins)**
  "Notice the trap in the game.
  In Round 1, you bet Tails. Does that mean you *believed* Tails was more likely?
  Or did you just recognize that the **stakes** were higher in Tails?
  *   **Decision Theory:** Bet where the Expected Utility is highest. (Round 1 favoured Tails).
  *   **Epistemology:** Believe where the Evidence is strongest. (Coin is fair).

  SIA conflates these. It says 'Bet Tails' *because* 'Tails is more likely.'
  SSA separates them. It says 'Bet Tails' (in Round 1) because 'The payoff is higher,' but 'Believe 50/50.'
  The Presumptuous Philosopher mistake is taking a betting strategy and treating it as a truth-tracking mechanism."

  ---

  ### **Part 6: Limitations & Objections (80–90 mins)**

  **Predictable Objection 1: "But I know I'm me."**
  *   **Student:** "I know I'm the original. There aren't actually 12 of me. This whole game is fake."
  *   **Handling:** "You are right. This is a simulation. In real anthropics (e.g., 'Am I a Boltzmann Brain?' or 'Are we in a simulation?'), you *cannot* know if you are the original or a copy. The game forces you to act *as if* you don't know. If you refuse to bracket that knowledge, you can't do anthropics. The question is: If you *didn't* know, would SIA be rational?"

  **Predictable Objection 2: "It's just a bet with skewed odds."**
  *   **Student:** "Round 1 just paid 12:1. Of course I bet Tails. That doesn't prove SIA."
  *   **Handling:** "Exactly. This is the strongest critique of SIA. SIA proponents argue the odds *should* shift because your existence is evidence. SIA says $P(Tails) = 12/13$. SSA says $P(Tails) = 1/2$. The game shows that SIA betting behavior *mimics* a probability shift, but as we saw with the Presumptuous Philosopher, that 'probability shift' allows you to ignore empirical evidence. That's why many reject SIA."

  **What This Activity Cannot Reproduce:**
  1.  **Real Indexical Uncertainty:** They know they are the 18 students in the classroom. Real anthropics requires genuine uncertainty about *which* observer you are (e.g., in a multiverse).
  2.  **Reference Class Problems:** We assumed 'you' = 'students in this room'. In real philosophy, defining the reference class (humans? conscious beings? observer-moments?) is the hardest part.
  3.  **Existential Risk:** The Presumptuous Philosopher isn't just about money; it's about whether we should worry about human extinction. (If SIA is true, extinction is unlikely because there are so many future humans. This is the 'Doomsday Argument' counter-point).

  **Closing:**
  "Next week, we read Bostrom's 'The Presumptuous Philosopher'. Come prepared to argue whether you would take the bet in Round 1 if the multiplier was $10^{100}$ and the coin was still fair."

  ---

  ### **Instructor's Cheat Sheet: What Goes Wrong**

  | Issue | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Confusion on Scoring** | Students forget to multiply the loss in Round 1. | Write the EV calculation on the board *before* they bet. "If Tails, 12 of you lose." |
  | **The "Cheating" Objection** | "You didn't actually make clones." | Admit it immediately. "We are simulating the *decision structure*, not the ontology." |
  | **Heads Result** | If the coin is Heads, Tails-betters lose points and feel stupid. | Emphasize **Ex-Ante Rationality**. "You made the right decision with the info you had. Poker players lose with Aces all the time." |
  | **Credence Confusion** | Students insist "I knew it was 50/50 but bet Tails." | Validate this. "This is the crux of the debate. Does rational betting require rational belief? SIA says yes. SSA says no." |
  | **Time Overrun** | Debrief gets bogged down in cosmology. | Keep the Presumptuous Philosopher example abstract ($10^{10}$ vs $10^{100}$). Don't get into specific physics theories. |

  ### **Why This Works**
  It separates the **intuition** (more copies = more weight) from the **consequence** (absurd certainty about the universe). By running the two rounds back-to-back, you let them feel the SIA pull in Round 1, then immediately show them the "off switch" in Round 2. This makes the Presumptuous Philosopher problem feel like a choice they made, not just a theory they read.
