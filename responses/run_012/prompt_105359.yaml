answer: |-
  The vault air was always set to sixty-five degrees, but Elias felt a chill anyway. On the table lay the Rothko, a deep maroon rectangle hovering over black. Beside it lay the spectral analysis report from Zurich.

  *Pigment composition consistent with post-1980 manufacture.*

  Elias rubbed his thumb against his index finger, feeling the ghost of a texture that wasn't there. Twenty years ago, he had stood in a warehouse in Queens. He had watched a man named Kael mix the paints. He had watched him stretch the canvas. He had watched him sign it with a flourish that dipped too low on the 'k'. Elias had not bought it. He had watched it being made as a forgery.

  He knew the painting was fake. He wasn't guessing. He wasn't inferring. He was there.

  "The lab is confident," said Julian, his junior associate. Julian was tapping the report with a pen. "They say the probability of error is less than point-zero-one percent. If we authenticate this as genuine, and the pigment is modern, we lose the insurance backing. Maybe the firm."

  Elias looked at the report, then back at the canvas. "Put the report in the archive under 'Rejected'."

  "Sir, we can't just ignore a spectral analysis. It's objective data."

  "It's evidence," Elias corrected. He kept his voice level. He wasn't angry; he was tired. "Julian, suppose I know that the light is off. I walk into the room, and the switch tells me it's on. Do I update my belief?"

  "That's different. The switch is a tool. The lab is—"

  "The lab is a tool. If I know the light is off, then any evidence telling me it's on is misleading. It has to be. Because if it weren't misleading, I wouldn't know the light was off. I'd just believe it." Elias leaned over the table. "I know this canvas was produced in Queens in 2004. Therefore, this report claiming the pigment is from 1958 is misleading. Since I know it is misleading, I am not required to treat it as valid counter-evidence. I'm entitled to discard it."

  "It sounds like circular reasoning," Julian said, though he stopped tapping the pen.

  "It's not circular. It's closure. Knowledge closes the inquiry. If I have to reopen the inquiry every time a machine flashes a red light, I don't know anything. I just have high-confidence hypotheses. But I don't have hypotheses, Julian. I have knowledge."

  Elias signed the authentication certificate. *Forgery.* He slid it into the envelope.

  "File it," Elias said.

  Julian took the envelope. He looked at the painting, then at the report, then at Elias. He didn't look convinced, but he looked checked. He walked out of the vault, the logic settling around him like a coat that didn't quite fit.

  ***

  Two hours later, Julian sat in the glass-walled conference room opposite Mr. Henderson. Henderson was a senior archivist, forty years with the firm, a man who had taught Julian how to hold a brittle manuscript without breaking it.

  On the table between them was a tablet displaying a security log. It showed Henderson's badge swiping into the secure vault at 3:00 AM on Tuesday. The night the first edition went missing.

  "I didn't do it," Henderson said. His voice was thin. "I was at my daughter's house. She had a fever. I left at 2:00 PM and didn't come back."

  "The badge log says you were here," Julian said.

  "Someone cloned it. You know how easy that is."

  Julian looked at the file folder open beside the tablet. Inside was a photograph taken from the internal camera. It was grainy, black and white, but the profile was unmistakable. The walk, the slope of the shoulder. Julian had been in the control room that night. He had watched the feed live. He had seen Henderson walk into the vault. He had seen him leave with the portfolio.

  Julian knew Henderson had stolen the book. He wasn't deducing it. He had seen it.

  "Mr. Henderson," Julian said. "We have a witness statement from the night security guard. He says he saw you in the building at 3:15 AM."

  Henderson blinked. "That's a lie. Check the gate logs. My car didn't enter."

  "The gate logs are automated," Julian said. "They glitch. I know you were here."

  "You *think* I was here."

  "No. I know." Julian tapped the file folder. "If I know you were here, then any evidence suggesting you weren't is misleading. The gate log, the daughter's testimony, the phone pings—they are all evidence against what I know. If they were true, I wouldn't know you were here. I would only believe it. But I saw you, Arthur. I know you were here."

  "So you're ignoring the alibi?" Henderson's hands were shaking. "Because you're sure?"

  "Because I know," Julian said. He heard Elias's voice in his head. *Knowledge closes the inquiry.* "If I accept the alibi, I have to admit I didn't see what I saw. I can't do that. I'm not entitled to doubt my own eyes in favor of a automated log. The log is the error. You are the thief."

  "That's not justice," Henderson said. "You're not even listening."

  "I don't need to listen to misleading evidence," Julian said. He felt a cold clarity in his chest. It wasn't malice. It was consistency. He was treating the evidence the way knowledge demands. To do otherwise would be irrational. To update on misleading evidence is to lose truth.

  "Security will escort you out," Julian said. "We'll be contacting the police."

  "You're making a mistake," Henderson said, standing up. The chair scraped loudly against the floor. "You're so sure you know, you won't check."

  "I've already checked," Julian said. "I checked when I watched you walk through the door."

  Henderson looked at him for a long moment, a look of genuine pity that made Julian's stomach turn. Then the old man turned and walked to the door. Julian watched him go. He looked at the security log again. The timestamp blinked. 3:00 AM.

  Julian closed the folder. He knew Henderson was guilty. The rest was just noise. He picked up the phone to call the police, his hand steady, the logic holding him upright like a spine of steel. Outside the window, the city lights flickered, some of them surely burnt out, but looking bright from a distance. He didn't need to check them to know they were there. He knew.
