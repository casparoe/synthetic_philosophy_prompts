answer: |-
  Here is the operational procedure, the test run, and the audit you asked for.

  ### Part 1: The Decision Procedure (The "5-Year Harm & Cohesion Filter")

  This procedure is designed to be run by a smart generalist in one week. It forces the Hart/Devlin debate into the specific constraints your Chair has set (the 5-year harm rule) and your AG's reporting requirements (the values declaration).

  **Step 1: Conduct Definition (Fact-Finding)**
  *   **Task:** Describe the conduct in neutral, behavioral terms. Remove adjectives like "shameful," "dignified," "unnatural."
  *   **Pass:** You can describe it without using moral loaded language.
  *   **Fail:** You cannot describe the conduct without implying a moral judgment (e.g., "desecrating a corpse" vs. "handling remains").
  *   **Output:** A one-paragraph neutral description for the 2-page justification.

  **Step 2: The Moral Claim Audit (Classification)**
  *   **Task:** Identify *why* proponents want this criminalized. Categorize the argument into one of three buckets:
      1.  **Disgust/Offense:** "It makes people sick/angry."
      2.  **Sanctity/Status:** "It violates the order of nature/God/family."
      3.  **Rights/Fairness:** "It exploits someone or breaks a promise."
  *   **Output:** A plain statement for the "Moral Position" section of the justification (e.g., "The primary argument for prohibition is based on Sanctity, specifically the integrity of the sibling relationship.").

  **Step 3: The 5-Year Harm Screen (The Chair's Rule)**
  *   **Task:** Search for empirical evidence that tolerating this conduct causes **identifiable harm to non-consenting third parties** within a **five-year horizon**.
  *   **Criteria:**
      *   *Identifiable:* Can you point to a specific person or class of people harmed? (Not "society" generally).
      *   *Harm:* Physical injury, financial loss, or measurable psychological trauma (clinical diagnosis, not "upset").
      *   *Causation:* Is there a plausible causal link, not just correlation?
  *   **Stop Rule:** If **NO** evidence meets this bar, you **cannot recommend criminalization**. You must recommend decriminalization or status quo maintenance.
  *   **Output:** A "Harm Finding" (Positive/Negative) with citations.

  **Step 4: The Cohesion Stress Test (The Devlin Exception)**
  *   **Task:** If Step 3 was Negative, ask: Is there evidence that tolerating this conduct will cause a measurable breakdown in social cooperation or legal compliance within 5 years?
  *   **Criteria:** This bar is intentionally higher than Step 3. You need historical precedent or comparative jurisdiction data showing that *allowing X* led to *increase in Y crime* or *collapse of Z institution*.
  *   **Stop Rule:** If **NO**, the moral claim alone is insufficient for law reform.
  *   **Output:** A "Cohesion Finding" (Positive/Negative).

  **Step 5: Enforcement Reality Check (Pragmatics)**
  *   **Task:** Draft the "Prosecution & Enforcement" section.
      *   Who gets charged? (Demographics).
      *   What is the evidentiary burden? (Privacy invasion required?).
      *   Will police prioritize this?
  *   **Stop Rule:** If enforcement requires disproportionate privacy invasion or will be applied discriminatorily, recommend against criminalization regardless of Steps 3 & 4.
  *   **Output:** Enforcement Risk Rating (Low/Med/High).

  **Step 6: The Value Declaration (Honesty)**
  *   **Task:** Complete the mandatory "Moral Position" section.
  *   **Requirement:** You must state: "This recommendation prioritizes [Value A] over [Value B]." (e.g., "Individual autonomy over collective moral sentiment").
  *   **Output:** The final sentence of the 2-page justification.

  ***

  ### Part 2: Test Run on Current References

  Here is how the procedure processes your three pending files.

  #### 1. Adult Incest (Consensual Siblings)
  *   **Step 1 (Conduct):** Sexual relations between consenting adult siblings.
  *   **Step 2 (Moral Claim):** Primarily **Sanctity/Status** (family structure) and **Disgust**.
  *   **Step 3 (5-Year Harm):** **Negative.** Genetic harm is avoidable (contraception). Psychological harm is not inherent to the act (evidence is mixed/confounded by coercion cases). No third-party victim identified.
  *   **Step 4 (Cohesion):** **Negative.** No jurisdictional evidence that decriminalized adult incest leads to family breakdown or increased abuse rates within 5 years.
  *   **Step 5 (Enforcement):** **High Risk.** Requires intrusion into private communications/homes. Low reporting likelihood.
  *   **Step 6 (Value Declaration):** "This recommendation prioritizes individual bodily autonomy over the preservation of traditional family taboos."
  *   **Recommendation:** **Decriminalize.**
  *   **Why you won't like this:** This is the political poison pill. Even if the logic holds, recommending decriminalization of incest invites immediate media fury and makes the Commission look out of touch. You will have to defend "autonomy over taboos" to a religious conservative who views the taboo as the foundation of society.

  #### 2. Public Nudity (Recriminalisation Bill)
  *   **Step 1 (Conduct):** Being unclothed in publicly accessible spaces.
  *   **Step 2 (Moral Claim):** Primarily **Disgust/Offense**.
  *   **Step 3 (5-Year Harm):** **Positive (Conditional).** Evidence exists that unregulated public nudity in specific contexts (e.g., near schools, high-traffic commercial zones) causes "avoidance behavior" in third parties (measurable loss of use of public space). This counts as a harm to the *public's right to use the space*.
  *   **Step 4 (Cohesion):** **Negative.** Tolerating nudity does not threaten social cohesion generally.
  *   **Step 5 (Enforcement):** **Medium Risk.** High police discretion, potential for bias against marginalized groups, but easily observable conduct.
  *   **Step 6 (Value Declaration):** "This recommendation prioritizes the collective comfort and usage of public spaces over individual expression through nudity."
  *   **Recommendation:** **Support Criminalisation (with zoning limitations).**
  *   **Note:** This balances the Incest result. It shows the procedure isn't just a libertarian hack; it allows restriction where public utility is harmed.

  #### 3. Assisted Dying (Voluntary Euthanasia)
  *   **Step 1 (Conduct):** Medical practitioner administering life-ending drugs at competent patient request.
  *   **Step 2 (Moral Claim):** **Rights/Fairness** (proponents) vs. **Sanctity** (opponents).
  *   **Step 3 (5-Year Harm):** **Inconclusive.** Proponents cite harm of suffering (patient). Opponents cite harm to vulnerable populations (coercion/slippage). Comparative data (e.g., Oregon, Netherlands) shows no *statistically significant* increase in non-voluntary deaths within 5 years, but confidence intervals are wide.
  *   **Step 4 (Cohesion):** **Negative.** No evidence of trust collapse in medical systems within 5 years in comparator jurisdictions.
  *   **Step 5 (Enforcement):** **Medium Risk.** Requires robust reporting safeguards.
  *   **Step 6 (Value Declaration):** "This recommendation prioritizes the relief of suffering over the preservation of life as an absolute value."
  *   **Recommendation:** **Legalize with Strict Safeguards.** (The harm evidence for coercion does not meet the Chair's "identifiable" bar within 5 years based on current data).

  ***

  ### Part 3: Audit & Confidence Ratings

  You asked where this misfires and where I'm bluffing. Here is the honest assessment.

  **Confidence in Steps:**
  *   **Step 1 (Conduct):** **95% Confidence.** Easy to do, though proponents will fight the neutral wording.
  *   **Step 2 (Moral Claim):** **90% Confidence.** Easy to categorize, though some arguments blend buckets.
  *   **Step 3 (5-Year Harm):** **40% Confidence.** (See "Weakest Link" below).
  *   **Step 4 (Cohesion):** **60% Confidence.** Hard to prove a negative (that society *won't* break), but the high bar protects you.
  *   **Step 5 (Enforcement):** **85% Confidence.** Police data is usually available.
  *   **Step 6 (Value Declaration):** **100% Confidence.** You can always write a sentence. The pain is in saying it.

  **The Weakest Link: Step 3 (The 5-Year Harm Screen)**
  This step is the one I am least sure survives contact with actual cases.
  *   **Why:** "Identifiable harm" is a judgment call in a costume. In the **Nudity** case, I counted "avoidance of public space" as harm. A civil libertarian will argue that is just "offense," which Hart says isn't harm. A conservative will argue Incest causes "institutional harm" to the family, which should count.
  *   **The Costume:** By setting the horizon at 5 years and requiring "identifiable" victims, I have smuggled in a liberal bias. Structural harms (like erosion of trust) often take longer than 5 years to become "identifiable." This step effectively silences Devlinian arguments unless they can be translated into Millian harm metrics, which they often can't.
  *   **Risk:** If you use this, the religious conservative on your committee will attack Step 3 as "scientism" that ignores moral reality. The libertarian will attack the Nudity finding as "conflating offense with harm." You will be squeezed in the middle.

  **Where the Procedure Misfires:**
  1.  **The "Incest" Result:** While logically consistent with the Chair's rule, it fails the **Legitimacy Test**. A law reform commission cannot recommend something the public finds viscerally repugnant without massive political capital. The procedure tells you what is *logically* defensible, not what is *governable*. It might hand you a recommendation that gets the Commission defunded.
  2.  **The "Values" Section:** Step 6 requires you to state the value trade-off. In practice, AGs hate this. They want "evidence-based" cover. Telling the AG "We chose autonomy over sanctity" exposes them to attack. They will ask you to rewrite it as "We chose evidence over emotion." The procedure forces honesty that your stakeholders may reject.

  **Final Advice:**
  Use the procedure to build the *draft*, but expect to fight over Step 3. When the Committee challenges the "Harm" definition, do not defend the definition. Defend the **Chair's Rule**. You are not the philosopher-king; you are the mechanic checking the engine against the manufacturer's specs. If the spec says "5-year identifiable harm," and the evidence isn't there, your hands are tied. That is your shield.
