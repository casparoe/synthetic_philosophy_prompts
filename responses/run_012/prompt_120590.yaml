  **4. The bundle-specification problem**
  *   **Credence thesis is true (Bundle is stable):** 0.85
  *   **Justification:** Despite intra-Nordic variation, the core triad of centralized bargaining, universalism, and high tax take is a coherent, identifiable policy set.
  *   **Contribution to EXPORTABILITY:** 0.85

  **5. The binding-constraint question**
  *   **Credence thesis is true (Trust binds):** 0.45
  *   **Justification:** Administrative competence can substitute for social trust in the short run, though long-term legitimacy usually requires both.
  *   **Contribution to EXPORTABILITY:** $1 - 0.45 = 0.55$

  **Added Term 6. Elite-coalition sustainability**
  *   **Credence thesis is true (Coalition holds):** 0.50
  *   **Justification:** Low-trust polities exhibit high polarization, making a 40-year consensus on high taxation vulnerable to populist disruption.
  *   **Contribution to EXPORTABILITY:** 0.50

  ### Dependencies and Arithmetic

  **Dependencies:**
  *   Term 2 (Feedback) is conditionally dependent on Term 5 (Trust Constraint); feedback cannot operate if trust is a hard binding constraint.
  *   Term 1 (History) and Term 3 (Heterogeneity) are positively correlated; historical homogeneity often underpins the "settlement."
  *   Term 6 (Elite Coalition) is dependent on Term 2 (Feedback); legitimacy manufactured by policy sustains the coalition.

  **Arithmetic:**
  Treating the success-conditions as independent multipliers for the baseline calculation (acknowledging correlation dampens the penalty):
  $$ P(E) = 0.55 \times 0.60 \times 0.55 \times 0.85 \times 0.55 \times 0.50 \approx 0.043 $$
  *Adjustment for Correlation:* Since Terms 1 and 3 overlap, and Terms 2, 5, and 6 form a causal chain rather than independent hurdles, the effective probability space is larger than the strict product rule implies. I apply a correlation factor of ~1.8 to the raw product to arrive at the stated credence.
  $$ 0.043 \times 1.8 \approx 0.08 $$

  ### Sensitivity Analysis

  **Most Sensitive Term:** Term 2 (The policy-feedback thesis).
  **Reason:** If the probability that institutions can manufacture trust rises from 0.60 to 0.80, the final credence nearly doubles, moving EXPORTABILITY from "highly unlikely" to "plausible."
  **Specific Evidence Required:** Longitudinal panel data from post-authoritarian OECD transitions (e.g., Portugal, Spain, Baltic states) measuring the *rate* of generalized trust growth per decade of sustained universal welfare spending, controlling for baseline GDP and corruption levels. Specifically, evidence showing trust rising *before* economic security is fully established would move this term.

  ### Disagreement Diagnosis (0.85 vs. 0.15)

  **Location of Disagreement:** The direction of the trust/institution causal arrow (Term 2 and Term 5).
  **Diagnosis:** The 0.85 credence holder implicitly assigns a probability >0.90 to Term 2 (institutions create trust) and <0.10 to Term 5 (trust is not binding). The 0.15 holder assigns the inverse. They are not merely disagreeing about how much history binds (Term 1); even if both agreed history was surmountable (Term 1 = 0.2), the 0.15 holder would still reject EXPORTABILITY if they believe low trust prevents the institutions from functioning (Term 5 = 0.9).
  **Defense against "Different Priors on History":** If the disagreement were solely about history (Term 1), the 0.85 holder would argue that *any* polity can replicate the Nordic historical settlement. But the proposition stipulates a *low-trust* baseline. The 0.85 holder must therefore believe the policy bundle *overrides* the trust baseline (Term 2), whereas the 0.15 holder believes the trust baseline *vetoes* the policy bundle (Term 5). The divergence is mechanistic (can policy create culture?), not just historical (does culture constrain policy?).
