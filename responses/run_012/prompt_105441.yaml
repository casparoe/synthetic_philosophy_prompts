prompt: |-
  I got into an argument at a friend's birthday thing last month about Atlantis, of all things, and it's been eating at me ever since. My friend Dan is into all of it — ancient aliens adjacent stuff, Graham Hancock, the lot — and his closing move whenever anyone says there's no evidence is to point out that most of the ocean floor has never been mapped in detail, that the coastlines where people actually lived during the last ice age are now tens or hundreds of meters under water, and that anything coastal and old would be exactly the kind of thing we wouldn't have found yet. And then he says it like it settles everything: absence of evidence is not evidence of absence. My other friend Priya, who reads a lot of skeptic blogs and had had a couple of drinks, said the line is just a get-out-of-jail card, that the same sentence would excuse any unfalsifiable theory you like, and that a theory which predicts that the evidence will be missing has stopped being a scientific theory at all — which seems to me like it might be true of some versions of the claim and not others, but I couldn't say which. We spent the rest of the night arguing about the slogan and never got back to Atlantis, and I've been quietly annoyed about it since.

  I'm taking a philosophy of science elective this term so I finally have the vocabulary — underdetermination, falsification, likelihoods — but the clarity hasn't come with it. Can you lay out for me the different precise things that one sentence could actually be claiming? I want a menu, not a single verdict: the reading where it's a boring point about proof versus evidence, the reading where it's a claim about how much work has actually been done, the reading where it's a statement about probability and what a search failing to turn something up does or doesn't do to your credence, the reading where it's a thesis about falsifiability and science versus pseudoscience, and whatever else is hiding in there. For each one, tell me whether it's trivially true, substantive and defensible, or just false, and be specific about what has to be the case for the absence to genuinely carry no evidential weight — I have a feeling the answer turns on whether the absence is more likely under Dan's story than under the boring one, but I want you to say it properly. Then tell me which of the readings Dan is actually relying on when he uses it to keep Atlantis on the table, which reading Priya is attacking when she calls it a dodge, and whether the two of them might be talking past each other because they're each grabbing a different one. I want to be able to take this back to them at the next party without just repeating the sentence louder, so lay it out as a list I can actually follow and argue from.
