answer: |-
  This is a classic impasse in informal epistemology. The phrase "absence of evidence is not evidence of absence" (AoE is not EoA) is one of the most weaponized sentences in pop-skepticism because it smuggles together at least four distinct claims, ranging from a trivial logical truth to a methodological vice.

  Since you have the philosophy of science vocabulary now, you can dissect this cleanly. Here is the menu of readings, evaluated by truth value and conditions, followed by a diagnosis of your friends' argument.

  ### The Menu of Readings

  #### 1. The Logical Tautology Reading
  *   **The Claim:** "The proposition 'X exists' is not logically contradicted by the proposition 'We have not observed X'."
  *   **Verdict:** **Trivially True.**
  *   **Why:** In deductive logic, you cannot derive a negative existential ($\neg \exists x$) solely from a lack of observation ($\neg Obs(x)$), unless you have a premise stating that *if* X existed, we *must* have observed it.
  *   **Condition for Validity:** Always valid in formal logic.
  *   **Utility:** None. This is a technicality. It proves only that skepticism is not *logically compelled*, not that belief is *rationally supported*.

  #### 2. The Empirical Search Effort Reading
  *   **The Claim:** "We have not surveyed the relevant domain thoroughly enough for a null result to count."
  *   **Verdict:** **Substantive and Contingent.**
  *   **Why:** This turns on the facts of the case. If I look under my bed for an elephant and see none, that is evidence there is no elephant. If I look at one square meter of the Pacific Ocean for a submarine and see none, that is negligible evidence there is no submarine.
  *   **Condition for Validity:** The absence of evidence carries no weight **only if** the probability of detecting the evidence, given the hypothesis is true, is low ($P(E|H) \approx 0$).
  *   **Utility:** This is the only reading that engages with the actual geology/archaeology. It requires data on how much of the ocean floor is mapped and what resolution is needed to spot "Atlantis."

  #### 3. The Bayesian Likelihood Reading
  *   **The Claim:** "Non-detection does not lower the probability of the hypothesis."
  *   **Verdict:** **False (in most real-world cases), but mathematically precise.**
  *   **Why:** In Bayesian terms, evidence $E$ confirms hypothesis $H$ if $P(E|H) > P(E|\neg H)$. Conversely, the absence of evidence ($\neg E$) is evidence of absence **unless** the likelihood of not finding it is the same whether it exists or not.
      *   If Atlantis exists, what is the chance we haven't found it yet? (Say, 90%)
      *   If Atlantis *doesn't* exist, what is the chance we haven't found it yet? (100%)
      *   Since $100\% \neq 90\%$, not finding it *does* lower the probability of it existing, just not by much.
  *   **Condition for Validity:** Absence of evidence is *literally* not evidence of absence **only if** $P(\neg E | H) = P(\neg E | \neg H)$. That is, you are equally likely to find nothing whether the thing is there or not.
  *   **Utility:** High. This quantifies the "weight" of the null result. It shows that AoE is almost always *some* evidence of absence, just sometimes very weak evidence.

  #### 4. The Falsification/Demarcation Reading
  *   **The Claim:** "A scientific theory cannot be rejected solely due to lack of positive data."
  *   **Verdict:** **Substantive but Dangerous.**
  *   **Why:** This touches on Popper and Lakatos. A theory needs to be falsifiable. However, if a theory is modified to explain away missing evidence (e.g., "Atlantis is invisible" or "Atlantis is in a dimension we can't map"), it becomes degenerative.
  *   **Condition for Validity:** Valid if the lack of evidence is due to current technological limits. False if the theory is structured to *predict* missing evidence to protect itself from refutation.
  *   **Utility:** This is the core of the "pseudoscience" accusation. It asks: Is the missing evidence a temporary gap, or a permanent feature of the theory?

  #### 5. The Burden of Proof Reading
  *   **The Claim:** "Because you cannot prove I am wrong, I am justified in believing I am right."
  *   **Verdict:** **False (Informal Fallacy).**
  *   **Why:** This conflates "not disproven" with "plausible." It shifts the burden of proof from the claimant to the skeptic.
  *   **Condition for Validity:** Never valid in scientific inquiry.
  *   **Utility:** This is how the phrase is usually abused in debate. It treats the null hypothesis as a stalemate rather than the default position.

  ---

  ### Diagnosis: Dan vs. Priya

  Now you can pinpoint exactly where they are colliding. They are indeed talking past each other, but one is on firmer ground than the other.

  **1. What Dan is relying on:**
  Dan is primarily using **Reading 2 (Search Effort)** to bolster **Reading 5 (Burden of Proof)**.
  *   **His Argument:** "The ocean is unmapped (Reading 2), therefore you cannot say Atlantis isn't there, therefore I am rational to keep believing (Reading 5)."
  *   **The Flaw:** He is treating the *logical possibility* (Reading 1) as *epistemic permission*. He is correct that we haven't mapped everything (Reading 2 is empirically defensible to a point), but he uses that to insulate his belief from probabilistic downgrade (ignoring Reading 3). He wants the absence of evidence to have *zero* weight, when Bayesian logic dictates it must have *some* weight, proportional to how much we *have* mapped.

  **2. What Priya is attacking:**
  Priya is attacking **Reading 4 (Falsification)** and **Reading 5 (Burden of Proof)**.
  *   **Her Argument:** "If your theory explains why the evidence is missing, you have made it unfalsifiable (Reading 4). You are using this slogan to avoid the burden of proof (Reading 5)."
  *   **The Flaw:** She is right about the methodological danger, but she might be dismissing the empirical nuance. If Dan simply said, "We haven't looked there yet," that is a valid scientific gap. It becomes pseudoscience only if he says, "We haven't looked there yet, *and also* if we do look and find nothing, it's because the technology wasn't good enough," ad infinitum.

  **3. Are they talking past each other?**
  **Yes.**
  *   **Dan** is making an **empirical claim** about the state of oceanography (we haven't looked everywhere).
  *   **Priya** is making a **methodological claim** about the structure of Dan's reasoning (you are immunizing your belief).
  *   **The Clash:** Dan thinks Priya is saying "Atlantis is impossible." Priya thinks Dan is saying "Atlantis is unfalsifiable."

  ### The Verdict (For Your Notes)

  If you want to settle this at the next party, do not repeat the slogan. Instead, use the **Bayesian Likelihood Reading (Reading 3)**. It is the bridge between their positions.

  **The Argument to Deploy:**
  "Dan, you're right that the ocean isn't fully mapped. Priya, you're right that you can't prove a negative. But the slogan is misleading because it implies the missing evidence doesn't count *at all*."

  1.  **Acknowledge Dan:** "If we've only mapped 20% of the relevant ocean floor, then not finding Atlantis yet is weak evidence against it. I grant that."
  2.  **Side with Priya (conditionally):** "But it is not *zero* evidence. Every year we map more and find less. That *does* lower the probability of Atlantis existing. It doesn't falsify it, but it should lower your credence."
  3.  **The Kill Shot:** "The slogan only works if finding nothing was equally likely whether Atlantis existed or not. But if Atlantis *was* there, we'd expect to have found *something* by now. So not finding something *is* evidence of absence, just not conclusive proof. Dan, are you willing to lower your probability estimate slightly every year we don't find it? Or does your confidence stay fixed regardless of the null results?"

  **Why this works:**
  *   It forces Dan to admit that null results *should* matter (preventing Reading 5).
  *   It validates Priya's concern about unfalsifiability without needing to prove Atlantis doesn't exist.
  *   It uses your philosophy of science vocab (credence, likelihoods) to show you aren't just repeating skeptic talking points.

  **Summary for your pocket:**
  *   **Is the sentence true?** Logically, yes. Probabilistically, no.
  *   **Is Dan right?** About the ocean floor, maybe. About the logic, no.
  *   **Is Priya right?** About the methodology, yes.
  *   **The Bottom Line:** Absence of evidence is *always* evidence of absence, but it is not always *strong* evidence. Dan wants it to be weightless; Priya wants it to be fatal. The truth is in the likelihood ratio.
