answer: |-
  Begin by defining wealth as labor, introduce money as a ticket whose meaning is use rather than essence, test this with a circulating token example, intercept misconceptions about inflation and trust, and end with a question linking currency to industry.

  **The Plan**

  **1. Order & Dependencies**
  Minutes 0–10: **Wealth.** Establish that wealth is elements + labour. This must precede money; otherwise, money looks like wealth itself.
  Minutes 10–20: **Money & Meaning.** Introduce the "ticket" query. Slip in the theory of meaning here: do not announce "nominalism"; simply ask, "Does a ticket need an essence, or only a use?" This dependency is crucial—philosophers need this to accept the functional definition, economists need it to ignore bullion.
  Minutes 20–35: **The Example.** Apply the token model.
  Minutes 35–45: **Misconceptions.** Address objections.
  Minutes 45–50: **Closing.**

  **2. The Example**
  Both instincts are traps. POW cigarettes possess intrinsic utility (smoking), violating Berkeley's claim that bullion is unnecessary; Yap stones lack velocity, violating his claim that circulation speed matters. Your example must have **zero intrinsic use** and **high circulation velocity**. Use **railway tokens**: useless metal discs issued to workers, redeemable only for goods at company stores, circulating faster than wages. This isolates money as a pure counter for industry.

  **3. Misconceptions**
  1. "Money is imaginary/groundless." (Surfaces minute 15). Head off by distinguishing the *sign* (ticket) from the *thing signified* (wealth). The ticket is conventional; the labor is real.
  2. "This is just modern credit theory." (Surfaces minute 30). Head off by stressing the *philosophical* warrant: we don't need abstract value, only comparative use. It is metaphysics driving policy, not just banking.
  3. "Inflation." (Unanticipated). Economists will assume more tickets = higher prices. Head off by noting Berkeley assumes *idle labor*. Money wakes sleepers; it does not bid up full employment.
  4. "Trust/Authority." (Unanticipated). Philosophers will ask who guarantees the ticket. Answer: The State + Land security. Without this, the ticket is counterfeit.

  **4. Closing Question**
  "If money is a ticket, what happens when the theatre closes?" This forces them to admit money is useless without real industry, confirming Berkeley's hierarchy.

  **5. What to Cut**
  Say this aloud: "Cut the Irish copper pamphlet war; it is historical noise. Cut the specific bank mechanics; they are technical distractions. Cut the 'forerunner' debate; it is anachronistic. Cut later metaphysics; keep only the nominalism required for money."
