prompt: |-
  I'm a philosophy professor who moonlights on our university's research-integrity and dual-use review panel -- it's mostly synthetic biology with a little ML mixed in, we get maybe three or four items a month that need a yes/no from us inside a week or two, and honestly no one on the panel really knows the wet-lab side. I keep getting stuck on the same shape of problem and I'd like to stop reinventing the wheel every time. The shape is this: the reason we're tempted to say yes to something risky is almost always "well, someone's going to do it anyway, and if it's us at least it's done carefully," and the reason we're tempted to say no is "but if we do it, we make it that much more likely to happen." Which is basically the unilateralist's curse as I understand it -- when a bunch of people can each independently do a thing and each one goes ahead whenever their own private expected-value sum comes out just barely positive, the collective result is skewed toward the thing happening even though most of them, on reflection, would've preferred it didn't, because it only takes the single most optimistic actor to tip it. Fine, I get the idea. What I don't have is any way to actually use it on a Tuesday afternoon.

  So write me a decision procedure my panel can run on a submission. I want the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure bottoms out in a clean yes or no, and -- importantly -- where it should hand the thing back to a person because we've stopped doing analysis and started doing values. It has to survive being run by someone who's read the paragraph above and not much else, in about twenty minutes, and it has to keep working when we can't get a number for anything. Two things I especially want it to get right. First, it must not collapse into "is this already out there?" -- the inevitable-discovery point and the curse point are genuinely different and I've watched people mash them together until the analysis was mush. Second, it should distinguish the case where our panel is itself the marginal actor (our doing it is what tips the scale) from the case where we're one of fifty and our contribution is basically a rounding error, because I suspect those two want opposite answers and I've never seen anyone spell out why. My partner says I'm overthinking this, but she doesn't have to sit on the panel.

  Then run the procedure, start to finish, on two cases: (a) a methods paper from a group we fund that would make a nasty pathogen more transmissible, in a way that's probably a two-year project for a competent lab, and (b) our own group proposing to post a cleaned-up dataset and code that would let someone with the same training reproduce a risky result in an afternoon. I want to see it return an answer I won't like on at least one of them, and I want the sign-off line spelled out -- the chair signs, and the VP for research rubber-stamps anything that goes forward, so tell me what each of them is actually certifying. And at the end be straight with me about what the procedure can't do: which steps are just judgment calls dressed up as procedure, and where it'll misfire because the curse's own assumptions -- independent actors, each roughly rational, each roughly informed about what the others are doing -- don't hold in our little corner of the world.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor, member of a university research-integrity/dual-use review panel (synthetic biology + ML).
      *   **Context:** Low volume (3-4/month), tight deadline (1-2 weeks), limited wet-lab expertise on the panel.
      *   **Core Problem:** The "Unilateralist's Curse" (Bostrom et al.). Tension between "someone will do it anyway" (inevitability/safety argument) vs. "if we do it, we increase likelihood" (marginal contribution argument).
      *   **Requirements:**
          *   A concrete decision procedure (questions in order, sufficiency conditions, stop points).
          *   Must distinguish "Inevitable Discovery" from "Unilateralist's Curse."
          *   Must distinguish "Marginal Actor" (tipping point) from "Rounding Error" (one of many).
          *   Must work with qualitative data (no numbers).
          *   Must run in ~20 mins by someone who read the prompt but isn't an expert.
          *   Must identify where value judgments take over from analysis.
          *   Apply to two specific cases: (a) Methods paper (gain-of-function-ish, 2-year project), (b) Dataset/Code release (reproduce risky result in an afternoon).
          *   Must produce an answer the user might *not* like on at least one.
          *   Must specify sign-off lines (Chair vs. VP).
          *   Must conclude with limitations (where the procedure fails/misfires).

  2.  **Deconstruct the Philosophical Core:**
      *   *Unilateralist's Curse:* Agents act on private judgment. If $N$ agents can act, and only 1 needs to for the bad outcome, the probability of the bad outcome is $1 - (1-p)^N$. Even if $p$ is low (most think it's bad), the outcome happens. Solution: Conform to a norm of restraint if you suspect others might be over-optimistic.
      *   *Inevitable Discovery:* If we don't do it, *someone else* will, and they might do it worse. This is a consequentialist calculation about *quality* of execution vs. *existence* of execution.
      *   *Marginality:* Am I the pivot? If I say no, does the project die? Or does it just move to Lab B?
      *   *The Conflict:* "We should do it safely" (Inevitable) vs. "We shouldn't do it because it normalizes/accelerates the field" (Unilateralist).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Simple, stepwise, qualitative.
      *   *Step 1: Capability Check.* Can this actually be done by bad actors easily? (Filters out theoretical risks).
      *   *Step 2: The Marginality Test.* Are *we* the bottleneck? (Distinguishes "Rounding Error" vs. "Marginal Actor").
      *   *Step 3: The Inevitability vs. Curse Distinction.* This is the tricky part.
          *   Inevitability = "Will this specific capability exist in the world regardless of us?"
          *   Curse = "Will *our* participation lower the barrier for others or signal permission?"
      *   *Step 4: The Normative Stop.* Where do we hand it back to values? (Risk tolerance).
      *   *Structure:* Flowchart style logic but in text.

      *Refining Step 2 & 3:* I need to make sure the user's specific constraint ("distinguish marginal actor from one of fifty") is central.
      *   *Idea:* Use a "Substitution Test." If we walk away, does the project vanish or migrate?
      *   *Idea:* Use a "Normalization Test." Does publishing this make it standard practice?

      *Let's try to structure it as a "Gate" system.*
      *   Gate 1: Technical Feasibility/Dual-Use Potential.
      *   Gate 2: Marginality (Are we the pivot?).
      *   Gate 3: The Curse (Does our action change the reference class?).
      *   Gate 4: The Verdict.

      *Wait, the prompt asks for specific questions and "where it bottoms out."*
      *   I need to be explicit about when the panel stops analyzing and starts voting on values.

  4.  **Developing the Two Cases:**
      *   *Case A (Methods Paper):* Making a nasty pathogen more transmissible. 2-year project. High barrier.
          *   *Analysis:* High barrier means fewer actors. If *this* group is funded and competent, they might be one of the few. If they publish the *method*, they lower the barrier for everyone.
          *   *Unilateralist angle:* If they publish, 50 other labs can try it. If they don't, maybe only 3 labs can.
          *   *Inevitability angle:* Someone will figure out gain-of-function eventually.
          *   *Desired Outcome:* Probably a "No" or "Heavy Redaction" that the user might not like (maybe they want to publish for safety reasons). Let's aim for a "No" on the method details.
      *   *Case B (Dataset/Code):* Cleaned-up dataset, reproduce risky result in an afternoon.
          *   *Analysis:* Lowers barrier drastically. From "years" to "afternoon."
          *   *Marginality:* If *this* university doesn't post it, will someone else? Maybe. But posting it *now* accelerates the timeline.
          *   *Desired Outcome:* This is the one that should sting. Releasing code that democratizes risk is classic Unilateralist failure. The procedure should likely flag this as a "No" even if the data is "clean."

  5.  **Refining the Procedure (Iterative Design):**
      *   *Name:* The "Marginality & Norms Protocol" (MNP).
      *   *Step 1: The Capability Floor.* Is the risk real? (Yes/No).
      *   *Step 2: The Substitution Question.* If we say no, does the specific *capability* emerge elsewhere within 24 months? (This addresses Inevitability).
      *   *Step 3: The Marginality Question.* Is *this* submission the critical path for the capability emerging *now*? (This addresses the "Rounding Error" vs. "Pivot").
      *   *Step 4: The Normative Signal.* Does approval signal that this class of research is safe/standard? (This addresses the Curse).
      *   *Decision Rule:* If Marginality is High + Norm Signal is High -> NO. If Substitution is Certain + Marginality is Low -> YES (with caveats).

      *Wait, I need to ensure the distinction between Inevitability and Curse is clear.*
      *   Inevitability: "The cat is out of the bag."
      *   Curse: "We are the ones opening the bag."
      *   I need a specific question that isolates the *panel's* contribution to the probability mass.

      *Revised Step 3:* "The Reference Class Shift." Does our doing this move the activity from 'exceptional' to 'routine'?

  6.  **Addressing the Sign-off:**
      *   Chair: Certifies the *process* was followed and the risk analysis is sound.
      *   VP: Certifies *institutional liability* and alignment with mission.
      *   This distinction is crucial for the "values" hand-off.

  7.  **Addressing the Limitations:**
      *   The Curse assumes rational actors. Scientists are often competitive or naive.
      *   The Curse assumes independent actors. Science is networked; one paper influences many.
      *   The "20-minute" constraint means deep uncertainty analysis is impossible.

  8.  **Drafting the Content (incorporating the "Philosopher" tone):**
      *   Keep it precise, slightly academic but operational.
      *   Acknowledge the tension.
      *   Ensure the "uncomfortable answer" is present. (I'll make Case B a hard "No" because lowering barriers to "afternoon" replication is the definition of accelerating the curse).

  9.  **Review against Constraints:**
      *   *Order of questions?* Yes.
      *   *Sufficient answers?* Yes.
      *   *Bottoms out?* Yes.
      *   *Values hand-off?* Yes.
      *   *Inevitability vs. Curse?* Explicitly separated.
      *   *Marginal vs. Rounding?* Explicitly separated.
      *   *Two cases run?* Yes.
      *   *Uncomfortable answer?* Yes (Case B).
      *   *Sign-off lines?* Yes.
      *   *Limitations?* Yes.

  10. **Final Polish:** Check the tone. The user is a philosopher, so they appreciate precise distinctions (e.g., epistemic vs. ontic, marginal vs. total utility). But they need it to work for biologists who don't care about Bostrom. Keep the language accessible but rigorous. Ensure the "Tuesday afternoon" constraint is respected (checklists, not essays).

      *(Self-Correction during drafting)*: I initially thought about making Case A the "No." But Case B (code release) is often more insidious in dual-use because it scales. I'll make Case B the "No" that stings, because "clean data" feels harmless but the *accessibility* is the risk. Case A might get a "Yes with Redactions" which is a nuanced middle ground. Actually, the prompt says "return an answer I won't like on at least one." A flat "No" on the code release is the strongest test of the procedure.

      *Wait, let's look closer at the Unilateralist's Curse logic.*
      If I am one of 50, and I refrain, the chance drops from $1-(1-p)^{50}$ to $1-(1-p)^{49}$. If $p$ is small, my impact is tiny.
      If I am the *only* one who can do it (Marginal), my impact is huge.
      The procedure needs to identify *which* scenario we are in.
      Question: "If we walk away, does the project die or move?"
      If "Move" -> Rounding Error (Inevitability dominates).
      If "Die" (for now) -> Marginal Actor (Curse dominates).

      Okay, ready to write.

      *Sign-off:*
      Chair: "Procedural Integrity & Risk Characterization."
      VP: "Institutional Endorsement & Liability Acceptance."

      *Limitations:* Information asymmetry, non-rational actors (competitors), network effects (one paper triggers 100 labs).

      Let's assemble.

      *(Final check on the "Uncomfortable Answer")*: The user is a philosophy professor. They likely understand the theoretical risk of code release. But researchers *hate* withholding code/data. It goes against open science norms. So a "No" on Case B is culturally painful. That works.

      *(Final check on Inevitability vs Curse)*:
      Inevitability = "Will the capability exist?"
      Curse = "Does our participation make it happen *sooner* or *more broadly* than it otherwise would, specifically by altering the normative landscape?"
      I need to make sure the procedure doesn't conflate "someone else will do it" (Inevitability) with "if we do it, others will follow" (Curse/Normalization).
      Actually, the Curse is specifically about the *decision rule*. "I will do it if my EV > 0." The solution is "I will do it only if I believe the *collective* EV > 0."
      For the panel, the translation is: "Does our approval lower the threshold for others?"
      Okay, I will frame it as "The Precedent Effect."

      Let's go.cw
answer: |-
  Here is a decision procedure designed for your specific constraints: low expertise, high uncertainty, tight timeline, and the specific philosophical tension between the Unilateralist's Curse and Inevitable Discovery.

  ### The Marginality & Norms Protocol (MNP)

  **Time required:** 20 minutes.
  **Prerequisites:** The submission summary and a risk assessment from the PI (even if optimistic).
  **Goal:** Distinguish between *adding to a risk* (Curse) and *managing an existing risk* (Inevitability).

  #### Phase 1: The Capability Floor (5 Minutes)
  *Goal: Filter out theoretical risks. If the risk isn't physically real, stop.*

  **Q1: Is the dual-use capability technically feasible for a non-state actor with moderate resources within 24 months of this publication?**
  *   **Yes:** Proceed to Q2.
  *   **No:** **APPROVE.** (The risk is speculative; the scientific value dominates).
  *   **Unsure:** Proceed to Q2, but mark "High Uncertainty."

  **Q2: Does this submission lower the barrier to entry (time, cost, expertise) for that capability?**
  *   **Yes:** Proceed to Phase 2.
  *   **No:** **APPROVE.** (You are not changing the risk landscape).
  *   **Unsure:** Assume **Yes**. (Precautionary principle for Phase 2).

  ---

  #### Phase 2: The Marginality Test (10 Minutes)
  *Goal: Distinguish "Rounding Error" from "Marginal Actor." This addresses your second requirement.*

  **Q3: The Substitution Question. If this panel rejects the submission, does the specific capability (not just the paper, but the know-how) emerge elsewhere within 12 months?**
  *   *Evidence required:* PI statement on competing labs, panel's knowledge of the field.
  *   **Yes (It will happen elsewhere):** You are a **Rounding Error**. Proceed to Q4.
  *   **No (It stalls the capability):** You are the **Marginal Actor**. Proceed to Q5.
  *   **Unsure:** Assume **Marginal Actor**. (It is easier to create risk than remove it).

  **Q4: (For Rounding Errors) The Safety Dividend. If we do this, is our execution demonstrably safer/more controlled than the expected alternative actor?**
  *   **Yes:** **APPROVE.** (Inevitable Discovery dominates. You are mitigating the risk of the inevitable).
  *   **No / Unsure:** **REJECT.** (If you aren't safer, and it's happening anyway, you add risk without benefit).

  **Q5: (For Marginal Actors) The Precedent Question. If we approve this, does it normalize this class of research for other institutions?**
  *   *Meaning:* Does approval signal "This is safe enough for a university to do"?
  *   **Yes:** **REJECT.** (Unilateralist's Curse dominates. You are setting a norm that allows the 49 other actors to proceed).
  *   **No:** **APPROVE WITH CONDITIONS.** (You are an outlier, not a trendsetter).

  ---

  #### Phase 3: The Value Hand-Off (5 Minutes)
  *Goal: Identify where analysis ends and values begin.*

  **Q6: The Residual Risk.** If the procedure above leads to **REJECT**, is the primary reason *procedural* (we are the marginal actor) or *moral* (this shouldn't exist)?**
  *   If the panel finds itself arguing about whether the pathogen *should* be studied regardless of marginality, **STOP.**
  *   **Action:** Return to the Chair. This is no longer a risk calculation; it is a mission alignment decision.

  ---

  ### Sign-Off Lines

  When the form is signed, the text must be precise to allocate liability correctly.

  **If the Chair signs (Approve):**
  > "I certify that the Marginality & Norms Protocol was followed, that the risk characterization is consistent with available evidence, and that the decision rests on the finding that this project does not function as a unilateralist tipping point for the field."
  > *(Meaning: We did the math right. We are not the ones breaking the dam.)*

  **If the VP for Research signs (Approve):**
  > "I certify that the institution accepts the residual liability associated with this research and that the potential scientific value outweighs the normative risk of establishing this precedent."
  > *(Meaning: I am betting the university's reputation on the 'Safety Dividend' or the 'Outlier' claim.)*

  ---

  ### Running the Procedure

  Here is the protocol applied to your two cases.

  #### Case A: Methods Paper (Gain-of-Function, 2-Year Project)
  *Submission:* A funded group wants to publish a novel method to increase transmissibility in a nasty pathogen. Competent lab, 2-year timeline to replicate.

  1.  **Capability Floor:**
      *   Q1 (Feasible in 24 months?): **Yes.** (It's a 2-year project for a competent lab).
      *   Q2 (Lowers barrier?): **Yes.** (Publishing the method saves others the R&D time).
      *   *Move to Phase 2.*
  2.  **Marginality Test:**
      *   Q3 (Substitution?): **Unsure / Leaning No.** Gain-of-function is high-skill. There are only a handful of labs globally capable of this. If this group stops, it might stall for years.
      *   *Classification:* **Marginal Actor.**
      *   Q5 (Precedent?): **Yes.** Publishing a methods paper explicitly tells other PIs "This is publishable." It moves the activity from "black ops" to "grant-eligible."
      *   *Protocol Verdict:* **REJECT.** (Or: Publish only the biological results, redact the specific methodological pathway).
  3.  **Value Hand-Off:**
      *   Does the panel want to argue that GoF research is inherently immoral? If so, stop. If the argument is just about the *method* being the bottleneck, the protocol holds.

  **Outcome:** **REJECT** the methods section.
  **Why you might not like it:** You might feel that *understanding* the risk requires knowing how it's made. But the protocol identifies you as the Marginal Actor setting the Norm.

  #### Case B: Dataset & Code (Reproduce Risky Result in an Afternoon)
  *Submission:* Your own group wants to post cleaned data and code. Allows reproduction of a risky result (e.g., a specific toxin folding prediction) in an afternoon.

  1.  **Capability Floor:**
      *   Q1 (Feasible in 24 months?): **Yes.** (Actually, feasible in 24 *hours*).
      *   Q2 (Lowers barrier?): **Yes.** (Drastically. From "expert project" to "undergrad afternoon").
      *   *Move to Phase 2.*
  2.  **Marginality Test:**
      *   Q3 (Substitution?): **Yes.** (Someone else likely has the data, or will generate it soon. Data tends to leak or be re-derived).
      *   *Classification:* **Rounding Error.**
      *   Q4 (Safety Dividend?): **No.** You are posting to a public repo. You have zero control over who downloads it. A state actor or a careful lab would do this behind a firewall. You are doing it "open."
      *   *Protocol Verdict:* **REJECT.**
  3.  **Value Hand-Off:**
      *   This is where it stings. The argument for "Open Science" is a value judgment. The protocol flags that you are not safer than the alternative (private derivation), you are just faster.

  **Outcome:** **REJECT** the public release. (Suggest: Depositing in a controlled-access repository like dbGaP).
  **Why you might not like it:** This violates the norm of open data. It feels like censorship. But the protocol identifies that while you are a "Rounding Error" on the *existence* of the data, you are a "Marginal Actor" on the *accessibility* of the data. You are accelerating the timeline from "years" to "now."

  ---

  ### Limitations: Where the Procedure Misfires

  You asked for honesty about where this breaks. Here are the three failure modes you need to accept before using this on Tuesday.

  **1. The Network Effect (The Curse Assumption Failure)**
  The Unilateralist's Curse assumes independent actors. Science is not independent. It is networked. One paper doesn't just add one actor; it adds *training data* for 500 graduate students.
  *   *Where it misfires:* Phase 2, Q3. The protocol asks "Will someone else do this?" It cannot easily calculate "How many *more* people will do this because we did it?"
  *   *The Fix:* If the submission is a *tutorial* or *codebase*, automatically upgrade "Rounding Error" to "Marginal Actor." Tools scale; methods do not.

  **2. The Rationality Assumption**
  The Curse assumes actors are roughly rational and informed. In synthetic biology, actors are often competitive, optimistic, or ideologically driven (e.g., bio-hackers).
  *   *Where it misfires:* Phase 2, Q4 (Safety Dividend). You assume "If we don't do it, a less careful actor will." But if the only other actors are negligent, the "Inevitable Discovery" argument collapses.
  *   *The Fix:* If the "Alternative Actor" is unknown, assume they are *less* careful than you. This biases toward rejection.

  **3. The Epistemic Black Box**
  You admitted no one on the panel knows the wet-lab side.
  *   *Where it misfires:* Phase 1, Q1. You are relying on the PI's assessment of feasibility. A PI might underestimate how easy their method is to misuse.
  *   *The Fix:* This is the hardest one. You must require an external review from a domain expert *outside* your institution for any "Yes" on Q1. If you can't get that, the default must be **REJECT**. The procedure cannot compensate for total ignorance of the physics.

  **Final Note for the Chair:**
  The procedure does not tell you what is *Good*. It tells you where you are *Pivotal*. If you are pivotal, you bear the burden of the Curse. If you are not pivotal, you bear the burden of Inevitability. The sign-off lines are designed to make sure the VP knows which burden they are buying.
