          *   Colleague A (Rights/Prejudice): Exclusion is arbitrary/prejudicial ("speciesism").
          *   Colleague B (Existence/Comparison): Octopuses aren't people/pigs; existence is better than non-existence (Non-Identity Problem).
          *   Colleague C (Aggregation/Numbers): Total suffering matters (Utilitarian aggregation); high numbers amplify small suffering.
          *   Scientific Uncertainty: Marine biologist says pain perception is unclear/mixed.
      *   **Requirements:**
          *   Must include an actual recommendation (Approve, Approve with Conditions, or Refuse).
          *   Must state the strongest opposing argument fairly (steel-manning).
