answer: |-
  Good morning. It is hot under this tent. I know this because I am standing here, and you are sitting there, and we are all sharing the same air. That sharing is the only reason I am up here.

  I am a philosophy professor. For most of you, that means I spend my time reading old books and asking questions that don't have answers. But for the eleven students in the third row who took my seminar last fall, it means something more specific. They know I have been worrying about this speech for months. They know I have been trying to figure out how to stand in front of two thousand people and say something true without sounding like I am giving a lecture.

  And here is the truth: I am trying to make you feel what I feel about these graduates. I feel proud. I feel hopeful. I feel a little sad that they are leaving. But my feelings don't matter unless they can become yours. If I stand up here and indulge in my own private sentiments, if I make jokes only my colleagues understand or cry too hard about how much I'll miss them, I will lose you. You will sit there in the heat, and you will wait for me to stop. So I am editing myself. I am trimming my emotions down to a size that fits in this tent. I am trying to modulate my voice so that it matches what you can bear to hear.

  That work—that effort to adjust myself so that you can enter into my feelings—is exactly what I want to talk about.

  We are here to celebrate success. Later in this ceremony, we will honor a graduate who has achieved a level of wealth and influence that most of us will only see from the outside. We will applaud him. We should. He has built things. He has employed people. He has mastered the world as it is. It is right to acknowledge that scale of achievement. When he walks across this stage, the applause will be genuine.

  But there is a difference between the applause and the thing itself.

  There is a story about a poor man's son. He looks around at his father's cottage and finds it too small. He looks at the palaces of the rich and decides he must have one. He works himself into the ground. He sacrifices his leisure, his comfort, and eventually his health. He spends his life climbing toward a condition he admires. And then, in the weariness of old age, he discovers that the power and the wealth he chased were never going to give him the peace he was actually looking for.

  Now, the easy thing to say is that he was foolish. The easy advice is to tell you to ignore the palaces. But that isn't true, and you know it isn't true. We are built to admire the rich and the great. It isn't just a mistake; it's a deception nature practices on us. It keeps the industry of mankind in motion. If nobody wanted the palace, nobody would build the cottage either. Ambition is the engine. I am not telling you to turn off the engine. I am telling you to know what fuel it burns.

  The danger isn't that you will want things. The danger is that you will confuse being admired with being worthy of admiration.

  We spend our lives wanting to be loved. We want the praise. We want the applause under this tent. We want the LinkedIn followers and the approval of our peers. But there is another state, one that is harder to reach. It is being lovely. Not in the sense of being cute, but in the sense of being lovable. Being the kind of person who deserves the praise, whether the praise comes or not.

  How do you find the difference? How do you know if you are chasing the applause or the worth?

  You do not ask your mother. She loves you too much to be honest. You do not ask your conscience, because that is just a word for what you already decide. And you certainly do not ask God, because that turns morality into a transaction with the universe.

  Instead, you have to construct a spectator. You have to imagine a person standing in the back of this tent. They do not know your name. They do not care about your salary. They are not invested in your success or your failure. They are just watching. Can you make your actions understandable to them? Can you modulate your grief, your joy, your ambition, so that this stranger could look at you and say, "Yes, I see why you did that. I could feel that too"?

  That is the work I am trying to do right now. I am imagining that spectator. I am checking my own ego against the reality of this hot afternoon. I am trying to be worthy of your attention, not just demanding it because I have the microphone.

  When you leave here, you will go into a world that is obsessed with the palaces. You will be told to optimize your brand. You will be told to maximize your reach. You will be told that being loved is the same as being successful.

  Some of you will build palaces. Good. The world needs roofs. Some of you will stay in the cottages. Good. The world needs hearths. But do not let the admiration of others become the only measure of your life. If you live for the praise, you will be a slave to the people giving it. If you live for the worthiness, you will be free, even when the room is quiet.

  So, here is my advice. It is not a secret. It is not a strategy. It is just a practice.

  When you sit down to lunch with your families today, your parents are going to ask you what I said. They are going to ask what the job market looks like, or how to be happy, or how to change the world. You can tell them what I said. Tell them I said that the heat is real, and the work is real, and that the only thing that matters is whether you can look at yourself from the outside and recognize the person staring back.

  Tell them I said: Don't just try to be loved. Try to be lovely. The rest is just noise.

  Thank you.
