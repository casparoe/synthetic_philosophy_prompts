prompt: |-
  I'm a science-and-ideas journalist working on a long feature about the end of the Roman Empire in the west, and I've painted myself into a corner. I've been interviewing two historians who have been feuding about this for years -- one is a decline-and-fall person (the western empire really did fall, and for ordinary people in the west it was a catastrophe), the other is a transformation person (nothing fell; the political superstructure dissolved and life went on, in some places better). My editors idea: instead of writing up there fight, get them to produce the document an adversarial collaboration would produce, the thing both could actually put their names to. So put on your late-antiquity-historian hat, and before you draft anything, brainstorm a little about what each side would need in order to sign off on a sentence. Then give me (1) a numbered list of claims both can sign, about the causes as well as about what happened; (2) the real disagreements in a table, each phrased the way its own side would want it phrased; and (3) the cruxes, including which parts of this fight are really just about the word "fall," with the evidence both sides would agree bears on each crux and what each side predicts we'd find. Three things I keep tripping over and want handled: the Greenland ice-core lead record, the Mediterranean shipwreck counts, and whether the Roman Senate still meeting after 476 means anything. And a publicist keeps pitching me the lead-pipes angle, so tell me whether that deserves a sentence. American English, please, and don't bother with citations; I just want the arguments.
