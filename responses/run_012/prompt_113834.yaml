answer: |-
  Your friend is articulating a position that has become central to modern discussions in decision theory, specifically aligning with what is known as Functional Decision Theory or Timeless Decision Theory. The core intuition he is pushing is that the spookiness of Newcomb's Problem comes from treating the predictor as a separate causal agent in the past rather than as a logical mirror of your own decision process in the present. To audit this properly, we need to lay out the mapping he is proposing and then stress-test it against the structural differences you have noticed.

  In the correspondence your friend is drawing, you in the Newcomb scenario play the role of one prisoner in the dilemma, and the predictor's simulation of you plays the role of the twin or clone. The shared algorithm is your own mind or decision procedure, which is assumed to be deterministic enough that running it twice yields the same output. The simultaneity of the two choices is not temporal but logical; even if the predictor ran the simulation yesterday and you choose today, the argument is that both instances are evaluating the same logical fact, so they are locked together at the moment of computation. The payoff matrix translates such that if you one-box and the simulation predicted one-boxing, you get the million, which maps to mutual cooperation. If you two-box and the simulation predicted two-boxing, you get the thousand, mapping to mutual defection. The temptation to defect is the urge to take both boxes while hoping the simulation predicted one-boxing, which corresponds to the temptation payoff in the Prisoner's Dilemma where you defect while the other cooperates. In this framing, one-boxing is simply cooperating with the logical necessity that your twin will do what you do.

  However, the mapping breaks in three specific places, and we need to see which ones actually carry weight. The first break is that in the Prisoner's Dilemma, both agents receive payoffs and have preferences, whereas in Newcomb's Problem, the predictor is not a player with utility; the predictor is essentially part of the environment or the rules of the game. This difference turns out to be decorative rather than substantive for your decision. Since you are only maximizing your own expected utility, it does not matter whether the other entity cares about the outcome or not, only that its state determines your payoff. So the fact that the predictor isn't a player doesn't break the logic of the choice, it just changes the narrative flavor.

  The second break is the temporal order, which touches on your worry about reaching back. In the twin Prisoner's Dilemma, the choices are typically modeled as simultaneous, or at least isolated from each other's causal influence. In Newcomb's Problem, the prediction happens before you choose. Your friend dismisses this by saying your decision and his prediction are the same event described twice, but this is exactly where the philosophical heavy lifting is happening. A Causal Decision Theorist would say that once the boxes are sealed, the content is a fixed fact of the past, and your current choice cannot change it. Your friend's analogy works only if you accept that your choice determines the prediction not by sending a signal backward in time, but by fixing the logical output of the algorithm that generated the prediction. If you view your decision as selecting which logical world you are in, then the prediction was always going to match that selection. The clone analogy hides the time delay to make this feel natural, but it doesn't solve the problem of why you should treat a past event as dependent on your current choice unless you accept this logical view of counterfactuals. So this break matters immensely; the analogy only drains the spookiness if you are already willing to concede that logical correlation trumps causal separation.

  The third break concerns the mechanism of prediction, which is your third worry. The clone framing assumes the predictor is running your source code, creating a strict logical identity between you and the prediction. If the predictor is instead using a statistical model, like a doctor predicting illness based on genes, the analogy starts to lie. In the smoking lesion problem, which is structurally similar to Newcomb's but relies on statistical correlation rather than simulation, most people feel less compelled to one-box or quit smoking. If the predictor is just a very good statistician observing your behavior patterns without simulating your reasoning, then your decision right now does not logically constrain what he wrote down yesterday; it is merely correlated with it. In that case, taking both boxes causally guarantees you an extra thousand regardless of what is in the box, and the correlation is just a side effect. The clone analogy quietly assumes the simulation view, where your reasoning process is the common cause of both the prediction and the action. If the problem stipulates a perfect predictor, it usually implies this logical link, but if it allows for mere statistical accuracy, the twin picture becomes misleading.

  So does his conclusion survive once these disanalogies are on the table? It survives only if you accept the premise that decision problems should be solved by considering the output of your decision algorithm across all instances where that algorithm is run, rather than by considering only the causal consequences of your physical action in the present. The analogy is not proving that one-boxing is rational; it is illustrating why one-boxing feels rational if you adopt a non-causal view of decision theory. For a Causal Decision Theorist, the analogy fails because they deny the premise that your current choice can inform you about a past event in a way that changes the expected utility calculation. They would say the twin case is different because in the twin case, your decision and the twin's decision are logically linked outputs of the same function, whereas in Newcomb's, the prediction is a fixed historical fact. Your friend is essentially arguing that this distinction is illusory because the prediction was generated by the function, so treating it as a fixed fact ignores how it came to be fixed.

  Regarding your specific worry about the payoff structure, where the predictor isn't a player, you are right to notice that the game theory atmosphere is different, but it doesn't change the math of your maximization. The game theory survives the translation in the sense that you are still navigating a payoff matrix dependent on another variable, but it stops being a game between agents and becomes a game between an agent and a logical constraint. The lack of a second payoff cell doesn't weaken the argument for one-boxing, because you never needed the predictor to be happy, only to be accurate.

  On the question of whether the he does whatever I do line holds up, this is the crux of the entire debate. If the predictor sealed the boxes yesterday, your changing your mind now does not causally reach back. However, if the prediction was made by simulating you, then you cannot change your mind without also changing what the simulation did, because they are the same computation. The analogy works here by treating the simulation as a standing logical fact rather than a historical event. If you accept that you are deciding for all instances of your algorithm, then the temporal gap is irrelevant. If you insist that only the physical act in the present matters, the analogy breaks. The spookiness drains out only if you agree that the prediction is not a separate event but a logical shadow of your choice.

  Finally, on the mechanism of prediction, you are correct that the analogy assumes simulation. If the predictor is just a statistical model, the twin picture is indeed a lie, and the intuition flips toward two-boxing. This is why the standard formulation of Newcomb's Problem usually specifies a predictor who is almost always right, which forces the interpreter to decide whether that accuracy comes from logical simulation or statistical correlation. If it is the latter, Causal Decision Theory wins. If it is the former, your friend's view wins. The analogy is doing work here by smuggling in the assumption that the prediction is logically tied to your reasoning, which is the very thing in dispute.

  If there is a better analogy, it might be to think of the problem not as playing against a twin, but as playing against a logic gate. Imagine you must input a value into a box, and a machine beforehand outputs a value based on what you will input. If the machine is perfect, it is not predicting you; it is computing you. The better framing is that you are not choosing an action in time, but selecting a logical output that exists timelessly. This removes the temptation to think about reaching back into the past and focuses on the fact that the past prediction and your present choice are two readings of the same variable. This preserves the insight your friend is offering without relying on the interpersonal dynamics of the Prisoner's Dilemma, which can distract from the core issue of logical correlation versus causal influence. Ultimately, your friend is right that the spookiness is optional, but only if you are willing to adopt a decision theory that treats logical correlations as actionable, which is exactly what the analogy is designed to persuade you to do.
