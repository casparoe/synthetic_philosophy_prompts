answer: |-
  You are describing a phenomenon that is distinct from Goodhart's Law, distinct from standard Goal Displacement, and distinct from simple gaming. You are right to feel that the standard literature misses the *ontological* shift you are witnessing. Goodhart assumes a divergence between the measure and the goal; you are describing a *replacement* of the goal by the measure, followed by the *erasure* of the memory of the original goal.

  There is a name for the cognitive mechanism, and a name for the sociological mechanism, but the specific combination you are describing—the irreversible loss of the antecedent practice—does not have a single canonical label.

  Here is the carving you asked for.

  ### 1. The Cognitive Mechanism: Surrogation
  The closest technical term for "the proxy stops being a proxy and becomes the referent" is **Surrogation**.

  This comes from management control systems literature (notably *Manchiraju, Mollick, and Owens, 2018*), though it has roots in psychology. Surrogation occurs when a decision-maker subconsciously substitutes a performance measure for the underlying strategic construct it is intended to represent.

  *   **Where Goal Displacement stops:** Goal displacement assumes the original goal is still present and understood, but is being subordinated to the metric for strategic reasons (e.g., "I know patient care matters, but I need to hit the wait-time target"). It implies a conflict.
  *   **Where Surrogation starts:** Surrogation implies the conflict has resolved. The measure *is* the goal. There is no cognitive dissonance. When you ask them what the job is, they do not say "to care for patients, measured by wait times"; they say "to reduce wait times." The construct has been absorbed by the metric.

  This matches your observation of sincerity. They aren't lying; they have undergone a cognitive substitution.

  ### 2. The Sociological Mechanism: Performativity
  The reason the practice reorganizes itself entirely around the number is explained by the theory of **Performativity** (from Science & Technology Studies, e.g., Callon, MacKenzie).

  Standard economics assumes metrics *describe* reality. Performativity argues that metrics *create* reality. By introducing a target, you do not just measure the system; you provide a script for the actors. Over time, the script becomes the only valid way to act. The "vocabulary going" that you describe is the loss of the *non-performative* language. If the language to describe "good work" outside of the metric disappears, the work itself becomes impossible to conceive, let alone perform.

  ### 3. The Irreversible Erasure: Institutional Surrogation (or Metric Hysteresis)
  This is the piece the standard literature misses. Standard Surrogation theory often assumes that if you remove the metric, the surrogation might end. You are observing that it *doesn't*. The old way of working survives only as a "rumour."

  There is no single established term for this specific *irreversibility*, but it is best understood as **Institutional Surrogation** combined with **Hysteresis**.

  *   **Hysteresis:** A system property where the state of the system depends on its history. When you remove the force (the target), the system does not return to its original shape because the internal structure has changed.
  *   **Institutional Surrogation:** The surrogation isn't just in individual heads; it is baked into hiring, training, software, and workflow. The people who knew the old way leave ("filtered out"), and the new hires are hired *for* the metric.

  If I were to coin a term for the specific phenomenon you are describing—the point where the metric replaces the goal *and* destroys the capacity to return to it—I would call it **Construct Collapse**.

  ### The Carving: Boundary Cases
  You asked for the boundaries, not just the definition. Here is how to distinguish this from adjacent phenomena.

  **1. Does it count if the number was never any good to begin with?**
  **Yes.** This is a crucial distinction.
  *   *Goodhart/Goal Displacement* usually implies the metric was *once* valid but got gamed.
  *   *Construct Collapse* can happen even if the metric was garbage on Day One. If the metric is the only thing that survives the turnover cycle, it becomes the reality regardless of its initial validity. The "truth" of the metric is not about its correlation to reality, but about its survival in the institutional ecology. If the metric survives and the practice adapts to it, the collapse has occurred.

  **2. Does it count if the staff privately still hold the old goal and just can't act on it?**
  **No.** This is the boundary between **Surrogation** and **Alienation** (or Decoupling).
  *   If they know what "good" looks like, believe in it, but are forced to chase the number, that is **Decoupling** (Meyer & Rowan). They maintain a gap between "work as imagined" and "work as done."
  *   The phenomenon you are describing requires the *loss* of the private belief. If the vocabulary is gone, they cannot even articulate the old goal to themselves. If they can still mourn the loss of the old way, Construct Collapse has not completed. The "sincerity" you noted is the diagnostic key.

  **3. Is the irreversibility part of the phenomenon or a separate thing?**
  **It is the diagnostic evidence, not the definition.**
  *   *Definition:* The measure becomes the referent (Surrogation).
  *   *Evidence:* The inability to revert when the measure is removed (Hysteresis).
  *   You cannot know if Construct Collapse has fully happened until you try to remove the target. If the work reverts to the old practice, it was just Goal Displacement. If the work continues exactly as before, or collapses entirely because no one knows what to do without the number, then Construct Collapse has occurred. The irreversibility proves that the metric has moved from being a *tool* to being a *scaffold*.

  ### Summary
  You are seeing **Institutionalized Surrogation** leading to **Construct Collapse**.

  *   **Goodhart's Law** says: "The measure stops working."
  *   **Goal Displacement** says: "The workers are chasing the wrong thing."
  *   **Your Observation** says: "The 'right thing' has ceased to exist as a social object."

  The commitment this name gives you is that you cannot fix this by tweaking the metric. You cannot fix this by better data. The "old way" is not a dormant resource waiting to be reactivated; it is a lost technology. Recovering it requires re-teaching the vocabulary and re-legitimizing the practice, which is a cultural intervention, not a performance management one.

  The tragedy you are witnessing is not that people are gaming the system. It is that the system has successfully trained them to forget there was ever anything else to do.
