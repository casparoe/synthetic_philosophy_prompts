prompt: |-
  I chair the collections committee of a small university museum, and an accident in the courtyard has landed us in a dispute about identity that I would rather not resolve by fiat. The museum's founder commissioned a bronze equestrian figure in 1908; the sculptor's original plaster maquette is still in our stores, and the bronze was cast from it in 1911 and stood on the same plinth until a storm brought down an old elm last autumn and shattered it beyond repair. Wishing the courtyard restored before convocation, our director had the foundry cast a replacement from the maquette — same alloy, same scale, using the same mold taken from the maquette that was used in 1911 — and it now stands on the original plinth. One further detail has made the argument worse rather than better: rather than sell the shattered bronze for scrap, we had the fragments melted down and blended into the new pour, so that roughly a tenth of the metal in the figure now standing outside is metal that was part of the figure that fell. My committee meets Thursday and must settle four things: whether the registrar retires the 1911 accession number or opens a new one; what the rededication plaque may say (the alumni association wants it to read that this is the same statue, restored); whether the 1911 bequest, which obliges us to keep the statue in the courtyard in perpetuity and funds its upkeep, still binds the endowment or has lapsed — the donor's granddaughter sits on the board of trustees and the development office is watching this closely; and whether we can accept a lender's request to borrow the 1911 bronze for an exhibition in the spring.

  Please draft the short written opinion I will circulate before the meeting. I want a concrete recommendation on each of the four points, with a time frame for acting on it, and a principled test I can state in a sentence and defend, rather than a pragmatic "let us call it the same for the alumni." The committee is split. Our curator says it is the same statue because it came from the same mold and looks the same from the courtyard path; our conservator says it is the same statue only if it retains the original material, and points to the salvaged metal as evidence that it does; a colleague from the philosophy department says the bronze never was the statue but merely constituted it, that the statue is the shape, and that the shape was re-created rather than continued, so the 1911 statue is simply gone and what stands outside is a new work of the same design; the director says that whatever we call it, the courtyard is restored and the paperwork should reflect the institution's interests. Engage the strongest of these positions on its own terms before recommending against it — in particular, if you conclude that the 1911 statue no longer exists, say plainly what follows for the bequest and the loan, and if you conclude that it does exist, say exactly what work the salvaged metal is doing in your reasoning, since I suspect that is where the real argument lies. No need to cite any literature; argue from the case.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Collections Committee of a small university museum.
      *   **Task:** Draft a short written opinion to circulate before the Thursday meeting.
      *   **Context:** A bronze equestrian statue (commissioned 1908, cast 1911) was destroyed by a falling tree. A replacement was cast from the original maquette/molds. Fragments of the old bronze were melted and blended into the new pour (approx. 10% of the mass).
      *   **The Dispute:** Identity of the object. Is it the same statue or a new one?
      *   **Four Decisions Needed:**
          1.  Accession number (retain 1911 or new?).
          2.  Rededication plaque text (Alumni want "same statue, restored").
          3.  Bequest status (Does the 1911 endowment still bind?).
          4.  Loan request (Can the "1911 bronze" be borrowed?).
      *   **Internal Conflicts:**
          *   Curator: Same mold + same look = same statue.
          *   Conservator: Material continuity required (salvaged metal counts).
          *   Philosopher: Shape/Form is the work; continuity broken = new work.
          *   Director: Pragmatic/Institutional interest (courtyard restored, paperwork should reflect that).
      *   **Requirements:**
          *   Concrete recommendation on each of the four points.
          *   Time frame for acting.
          *   A principled test (one sentence) to defend the position.
          *   Engage the strongest opposing positions on their own terms (especially the material continuity vs. form argument).
          *   No literature citations; argue from the case.
          *   Tone: Professional, decisive, principled, suitable for a committee chair.

  2.  **Determine the Core Philosophical/Museological Stance:**
      *   *Option A: It is the same statue.* (Curator/Conservator/Alumni view).
          *   *Pros:* Satisfies alumni, keeps bequest active, simpler paperwork.
          *   *Cons:* Philosophically dubious (Ship of Theseus problem). If it's the same, why did we need to cast a new one? If 10% of the metal is old, does that make it 10% the same? The "form" argument (Philosopher) suggests the specific physical instantiation matters.
      *   *Option B: It is a new statue.* (Philosopher/Strict Conservation view).
          *   *Pros:* Intellectually honest. Acknowledges the break in continuity. Clarifies the nature of the object.
          *   *Cons:* Risks the bequest (did the donor want *this* object or *a* statue of the founder?), upsets alumni.
      *   *Decision:* The prompt asks me to engage the strongest positions and recommend *against* them if necessary. The most robust museological standard usually hinges on *material continuity* for unique works, but *intent and function* for commemorative monuments. However, the prompt highlights the "salvaged metal" detail as the crux.
      *   *Refined Decision:* The strongest argument is actually a hybrid. The 1911 *object* is gone. The 2024 *object* is a replacement. However, for the purpose of the *bequest* and *identity*, we need to distinguish between the "Work" (the artistic concept) and the "Object" (the physical instance).
      *   *Wait, looking closer at the prompt's constraints:* "If you conclude that the 1911 statue no longer exists, say plainly what follows for the bequest and the loan." "If you conclude that it does exist, say exactly what work the salvaged metal is doing."
      *   *Strategic Choice:* To provide a clear, defensible principle, it is better to admit the 1911 *object* is gone. Why? Because claiming it is the "same" relies on magical thinking about the 10% metal blend (which is homogenized and structurally irrelevant) or the mold (which creates copies, not continuations). Acknowledging it is a *replacement* allows for honest labeling and protects the museum from future authenticity claims.
      *   *However,* the bequest is the tricky part. If the statue is gone, does the money lapse? The donor's intent was likely "keep a statue of the founder in the courtyard," not "keep these specific atoms." We can argue the *obligation* survives even if the *object* is replaced, provided the replacement fulfills the donor's intent.
      *   *Actually, a stricter reading:* If the 1911 statue is gone, the loan request is impossible (you can't loan what doesn't exist). The bequest might be at risk legally, but ethically we should honor the intent.
      *   *Let's try the "Continuity of Function and Form, but not Material" approach.* No, that's the Curator's view.
      *   *Let's try the "Material Continuity is Essential" approach.* This aligns with the Conservator and Philosopher. The 10% blended metal is symbolic, not structural. It does not preserve identity. Therefore, the 1911 object is extinct.
      *   *Consequences:*
          1.  New Accession Number.
          2.  Plaque must acknowledge replacement (honesty).
          3.  Bequest: Argue it binds the *location and subject*, not the specific atoms, so funds remain usable for the new statue. (This requires a legal/ethical bridge).
          4.  Loan: Cannot loan the 1911 bronze (it's gone/fragments). Can loan the maquette or the new bronze as a "replacement."
      *   *Wait, is there a better middle ground?* The "Ship of Theseus" in museums usually resolves that if the majority of material is new and the manufacturing process was a *recasting* rather than a *repair*, it is a new object. The 10% melted blend is a ritual gesture, not conservation.
      *   *Principled Test:* "An object retains its identity only if its material continuity is unbroken by a process of re-creation; where casting is required to replace loss, the result is a new instance of the design."
      *   *Let's refine the test:* "Museum identity resides in the continuous physical history of the object, not in the replication of its form or the recycling of its material."

  3.  **Drafting - Section by Section:**

      *   **Header:** To: Collections Committee; From: Chair; Date; Subject.
      *   **Opening:** Acknowledge the difficulty. State the purpose of the memo.
      *   **The Principled Test:** Needs to be one sentence. *Draft:* "We must distinguish between the endurance of a design and the survival of an object, recognizing that identity requires unbroken material continuity, not merely shared origin or recycled matter."
      *   **Engaging the Arguments:**
          *   *Curator (Mold/Look):* Address that molds produce multiples; looking the same makes it a twin, not the same.
          *   *Conservator (Salvaged Metal):* This is the crux. Address the 10%. Melting destroys the crystalline structure and history of the specific fragment. It is ingredient, not identity. Like baking a cake with some flour from the old batch—it's a new cake.
          *   *Philosopher (Form vs. Matter):* Agree that the form was re-created, but note that for accessioning, the physical instance matters.
          *   *Director (Institutional Interest):* Acknowledge, but argue that long-term trust requires honesty over short-term convenience.
      *   **Recommendations (The Four Points):**
          1.  *Accession:* New number. The 1911 object is deaccessioned (reason: destroyed). The 2024 object is a new accession (reason: new casting).
          2.  *Plaque:* "Original cast 1911, destroyed 2023. Recast 2024 from original maquette." Do not say "Restored."
          3.  *Bequest:* The *intent* of the bequest (a statue in the courtyard) is fulfilled by the replacement. The funds should apply to the *maintenance of the commemorative figure*, not the specific 1911 alloy. We must negotiate this with the granddaughter/trustees based on donor intent.
          4.  *Loan:* The 1911 bronze cannot be loaned (it does not exist as a whole). The maquette can be loaned. The new bronze is too new/unproven for travel, but technically could be, labeled as a 2024 recast.
      *   **Time Frame:** Immediate action before convocation/Thursday.

  4.  **Refining the Tone:**
      *   Needs to be firm but collegial.
      *   Must not sound like a philosophy lecture, but must use philosophical rigor.
      *   Must address the "10% metal" issue directly as requested ("say exactly what work the salvaged metal is doing in your reasoning").
      *   *Self-Correction on the Bequest:* If I say the statue is gone, the legal team might say the bequest lapses. I need to be careful. I should recommend we *argue* the bequest holds based on *intent*, even if the object is new. This separates the *legal/ethical obligation* from the *ontological status*.
      *   *Self-Correction on the Loan:* If the 1911 statue is gone, the loan request is moot. I need to tell the lender the truth.

  5.  **Final Polish of the Principled Test:**
      *   "Identity in our collection is defined by the unbroken physical history of the artifact, not by the replication of its form or the symbolic recycling of its constituent materials."
      *   *Critique:* A bit long.
      *   *Try:* "An artifact's identity ends when its material continuity is broken by re-creation, regardless of shared molds or recycled ingredients."
      *   *Try:* "We must rule that object identity requires unbroken material continuity, distinguishing the survival of a specific artifact from the replication of a design." -> Let's go with: **"Object identity requires unbroken material continuity; where re-creation replaces destruction, the result is a new instance of the design, not the survival of the original."**

  6.  **Addressing the 10% Metal:**
      *   I need to explicitly state that the melted metal acts as a *relic*, not as *structural identity*. It sanctifies the new object but does not make it the old object.

  7.  **Addressing the Bequest:**
      *   If the statue is new, does the bequest lapse? I should recommend we petition the Trustees to interpret the bequest as applying to the *commemorative function* rather than the specific atoms, to honor the donor's intent without lying about the object.

  8.  **Final Review against constraints:**
      *   Concrete recommendation on 4 points? Yes.
      *   Time frame? Yes.
      *   Principled test in one sentence? Yes.
      *   Engage strongest positions (Conservator/Philosopher vs Curator)? Yes.
      *   Address the 10% metal specifically? Yes.
      *   No literature citations? Yes.

  9.  **Drafting the Content:** (Mental check of the flow)
      *   Intro: Context.
      *   Principle: The Test.
      *   Analysis: Why the Curator/Director are wrong (Form/Pragmatism). Why the Conservator is partially right but the metal doesn't save it. Why the Philosopher is right on ontology but we must handle the bequest carefully.
      *   Recommendations: 1, 2, 3, 4.
      *   Timeline.

      *(Self-Correction during drafting)*: Make sure I don't alienate the Alumni. The plaque wording is key. It can be respectful without being false. "Recast" is better than "New Statue."

      *(Refining the Bequest argument)*: This is the highest risk. If I say "Statue is gone," the granddaughter might say "Money is gone." I need to recommend we *assert* the bequest holds based on *cy pres* or donor intent principles, even while admitting the object is new. This shows leadership.

      *(Refining the Loan)*: If the 1911 statue is gone, the loan request is for a ghost. I must recommend we decline the loan of the "1911 bronze" but offer the maquette.

      *(Final check on the 10%)*: The prompt asks: "if you conclude that it does exist, say exactly what work the salvaged metal is doing." Since I am concluding it *does not* exist (as the 1911 object), I must explain why the metal *fails* to preserve identity. It is symbolic, not constitutive.

      *Wait, one nuance:* If I conclude the 1911 statue *no longer exists*, I must say plainly what follows for the bequest.
      *   *Scenario:* 1911 Statue = Dead.
      *   *Bequest:* "Keep the statue in the courtyard."
      *   *Result:* Legally, this is tricky. Ethically, we should argue the *purpose* survives. I will recommend we seek a formal interpretation from the Trustees that the bequest attaches to the *commission*, not the *atoms*, to prevent the lapse.
      *   *Loan:* Cannot loan the 1911 bronze.

