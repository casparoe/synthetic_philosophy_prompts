answer: |-
  **TO:** Collections Committee
  **FROM:** Chair, Collections Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Determination of Identity regarding the Equestrian Figure

  Colleagues,

  We must resolve the status of the courtyard figure before Thursday's meeting. The disagreement hinges on whether we prioritize the continuity of the design or the continuity of the object. To ensure our decision withstands scrutiny from the alumni, the donor's family, and our professional peers, we must adopt a consistent standard rather than a pragmatic compromise.

  **The Principled Test**
  I propose we adopt the following standard for this and future cases: **"Object identity requires unbroken material continuity; where re-creation replaces destruction, the result is a new instance of the design, not the survival of the original."**

  **Analysis of Competing Views**
  This test rejects the Curator's position that shared molds and visual similarity constitute identity. A mold is a tool for replication; using the 1911 mold in 2024 produces a twin, not a survivor. If visual similarity were sufficient, any copy would be the original, which undermines the basis of our collection.

  It also rejects the Director's pragmatic view that paperwork should merely reflect institutional interests. While restoring the courtyard was operationally necessary, misrepresenting the object's history risks the museum's credibility should the recasting become public knowledge, which is inevitable.

  The most difficult argument comes from the Conservator and the Philosophy colleague. The Conservator argues the salvaged metal preserves identity; the Philosopher argues the form is the work, and the form was re-created. On the Philosopher's point, we must agree that the *design* survived, but the *artifact* did not. Regarding the Conservator's point on the salvaged metal: blending the shattered fragments into the new pour was a meaningful ritual, but it does not sustain ontological identity. Melting destroys the metal's crystalline structure and its specific history as part of the 1911 casting; the fragments have become ingredients, not components. That ten percent of the mass is derived from the original makes the new figure a *reliquary* of the old one, but it does not make it the old one. To argue otherwise is to claim that a cake baked with flour from a previous batch is the same cake.

  **Recommendations**
  Based on the test above, I recommend the following four actions:

  1.  **Accessioning:** The Registrar will retire the 1911 accession number with a notation of "Destroyed." A new accession number will be assigned to the 2024 casting. This accurately reflects that the physical object accessioned in 1911 no longer exists.
      *   *Time frame:* Complete before Thursday's board packet distribution.

  2.  **Rededication Plaque:** The text must not state the statue is "restored." It should read: *"Original cast 1911, destroyed 2023. Recast 2024 from the original maquette."* This honors the alumni's connection to the history without falsifying the object's status.
      *   *Time frame:* Draft approved by Committee by Thursday; installed before Convocation.

  3.  **Bequest Status:** Although the 1911 object is gone, the *intent* of the bequest was to maintain a commemorative figure in the courtyard. We will recommend to the Board of Trustees that the endowment remains binding under the doctrine of donor intent, applying to the maintenance of the replacement figure. We cannot claim the 1911 object survives to satisfy the bequest, but we can ethically assert the obligation survives the object.
      *   *Time frame:* General Counsel to draft opinion for the Trustees by next Monday; meeting with donor's granddaughter to follow.

  4.  **Loan Request:** We must decline the request to borrow the "1911 bronze," as it does not exist. We may offer the loan of the 1908 plaster maquette instead, labeled as the source model for the courtyard figure.
      *   *Time frame:* Notify lender immediately.

  **Conclusion**
  Admitting the 1911 statue is gone is difficult, but it allows us to defend the bequest on ethical grounds rather than legal fiction. We honor the donor by fulfilling the spirit of the gift, and we honor the public by telling the truth about the object they see.

  Please review this reasoning prior to Thursday. I look forward to your vote.
