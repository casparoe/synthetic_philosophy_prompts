answer: |-
  Good evening. For those who don't know me, I'm the philosophy friend. Looking around this room, I see the full scope of Priya and Sam's world. On one side, we have the people who know them through care and through beauty—Priya's family, her colleagues in nursing, Sam's family, and his fellow architects. On the other side, unfortunately, we have my colleagues.

  When Priya asked me to speak, she gave me one strict instruction. She said, "Do not tell us we complete each other. Do not talk about halves making a whole. I will actually die."

  I love this instruction. Because honestly, the idea that marriage is about two incomplete halves finding closure is bad math. It suggests that before you met, you were broken. But anyone who knows Priya knows she was already whole. Anyone who knows Sam knows he was already whole. You don't marry to fix a deficit. You marry to create a surplus.

  There is an idea in ethics that helps explain this. It suggests that when certain valuable things come together, the value of the combination isn't just the sum of the parts. It's not one plus one equals two. Sometimes, one plus one equals something entirely new, something vastly greater than the addition. The value lies in the whole itself, not just in the pieces.

  This matters because Priya and Sam are already incredibly valuable individuals. Priya, you spend your life caring for the most vulnerable children. You embody what philosophers have long argued is one of the greatest goods possible: the pleasure of human affection. You bring care into the world simply by being in it.

  Sam, you design landscapes. You shape the physical world into something breathable and beautiful. You embody the other great good: the enjoyment of beautiful things. You bring beauty into the world simply by being in it.

  Individually, you are both profound goods. But marriage is not just standing next to each other. It is the creation of an organic whole. When your care meets his beauty, when his grounding meets your fire, you create a shared life that has a value neither of you could generate alone. Not because you were lacking, but because the combination unlocks a new category of value.

  This is why we are all here. We are here to witness the formation of this whole. We are here to affirm that what you are building together is not just a contract between two independent parties, but a new thing entirely. A thing that requires us to look at the union itself to understand its worth.

  Priya, Sam: You do not complete each other. You amplify each other. You create a world together that is richer than the sum of the worlds you inhabit separately. May that whole be enduring, may it be resilient, and may its value grow every time you look at it together.

  To Priya and Sam.

  ***

  **Private Note:**
  I took a liberty by applying Moore's concept of "organic unities"—which strictly concerns the *intrinsic value of states of consciousness*—directly to the social institution of marriage itself. Moore was focused on axiology (what is good), not necessarily relational ontology, so treating the marriage as the "whole" rather than the conscious experience of the relationship is a pragmatic stretch. Additionally, I simplified his intuitionism into a general "surplus" metaphor to avoid losing the family, which glosses over his rigorous non-naturalist framework.
