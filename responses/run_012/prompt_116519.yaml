answer: |-
  # Licensing vs. Reliance: Investigating the Bifurcation of Assertoric Norms

  **Project Summary**

  Contemporary epistemology of language is dominated by the debate over the norm of assertion. The central question is typically framed as a search for a single condition: Under what rule may a speaker assert that $p$? Prominent candidates include the Knowledge Norm (assert only what you know), the Truth Norm (assert only what is true), and the Belief or Justification Norms (assert only what you reasonably believe). These positions are usually tested by eliciting intuitions about whether an assertion "sounds off" or is inappropriate in specific vignettes. However, this methodology assumes that the "appropriateness" of an assertion is governed by a single, unified standard. This project challenges that assumption. It proposes that the concept of an assertoric norm conflates two distinct functional roles: *licensing* (the conditions under which a speaker is permitted to speak) and *reliance* (the conditions under which a hearer is entitled to take the speaker's word and act).

  This research proposes that these two norms can come apart, creating a phenomenon I term "assertoric slack." Assertoric slack exists in the range of cases where a speaker is licensed to assert a proposition, but a hearer is not entitled to rely on it, or vice versa. If this distinction holds, much of the existing debate may be talking past itself, with proponents of different norms actually targeting different halves of the bifurcated structure. The goal of this project is not to solve the debate by selecting one norm over the others, but to determine whether the debate itself is structurally flawed due to the conflation of licensing and reliance.

  **Research Question and Hypothesis**

  The primary research question is: *Are the licensing conditions for assertion and the reliance conditions for testimony extensionally equivalent, or do they systematically diverge?*

  This question is framed to admit a determinate answer within the scope of undergraduate research. The hypothesis is that they diverge. Specifically, the project tests the claim that there are possible cases where intuitive judgments about speaker blame (licensing) and hearer rationality (reliance) yield opposite verdicts when contextual variables are manipulated. If such cases can be constructed and shown to elicit stable intuitions, the hypothesis that assertion is governed by a single unified norm is falsified. If no such cases can be found despite rigorous testing, the hypothesis is unsupported, suggesting that a unified norm remains the viable default.

  **The Problematic: Why Existing Positions Leave the Question Open**

  Current positions in the literature—whether advocating for knowledge, truth, belief, or justification as the constitutive norm—operate under the assumption of unity. They assume that if a speaker violates the norm, the assertion is improper, and consequently, a hearer would be irrational to rely on it. This assumption leaves the distinction between licensing and reliance theoretically invisible.

  Consider the Knowledge Norm. It states that one must assert $p$ only if one knows $p$. When tested, philosophers ask: "Is it appropriate to assert $p$ if you don't know it?" If the intuition is "no," the norm is supported. However, this question ambiguously targets both the speaker's permission and the hearer's entitlement. It fails to ask: "Is the speaker blameworthy for asserting, even if the hearer cannot rely?" or "Is the hearer entitled to rely, even if the speaker was slightly improper in asserting?"

  This conflation becomes apparent when we examine cases involving asymmetric stakes or information. Suppose a speaker has strong evidence for $p$ but lacks absolute certainty (perhaps falling short of knowledge but meeting a justification threshold). On a Justification Norm, the speaker is licensed to assert. However, suppose the hearer is aware that the speaker is generally unreliable, even if justified in this specific instance. Intuitively, the speaker may have done nothing wrong in asserting (licensing satisfied), but the hearer would be rash to act on the assertion without further verification (reliance unsatisfied).

  Conversely, consider a case of "polite assertion." A speaker asserts something they do not fully believe to maintain social harmony (violating a Belief or Knowledge Norm), yet the hearer understands the convention and is entitled to rely on the social signal rather than the factual content. Here, the licensing condition (sincerity/knowledge) is violated, but a form of reliance is still socially sanctioned.

  Existing theories struggle to accommodate these asymmetries because they treat the norm of assertion as a monolithic constraint on the speech act itself, rather than a relational bridge between two agents. By failing to distinguish the entry conditions for the speaker from the exit conditions for the hearer, current models cannot explain why the bar for withdrawing an assertion often seems lower than the bar for making one, or why a speaker might be blamed for asserting while the hearer is simultaneously blamed for believing.

  **Methodology: Paired Vignettes and Intuition Tracking**

  To test the hypothesis of assertoric slack, I will employ a method of conceptual analysis using paired vignettes. This method isolates the variables of speaker evidence and hearer context to see if intuitive judgments about propriety track independently.

  The project will involve constructing two sets of cases.

  *Set A (Varying Speaker Conditions):* These vignettes will hold the hearer's context constant (e.g., high stakes, no defeaters) while varying the speaker's epistemic position (e.g., knowledge vs. mere justified true belief vs. lucky guess). The metric will be intuitive judgments of speaker blameworthiness.
  *Set B (Varying Hearer Conditions):* These vignettes will hold the speaker's epistemic position constant (e.g., clear knowledge) while varying the hearer's context (e.g., low stakes vs. life-or-death stakes; presence of defeaters regarding the speaker's reliability). The metric will be intuitive judgments of hearer rationality in acting on the assertion.

  Success for this method depends on finding a "cross-over" point. If the norm is unified, the threshold for speaker permission should match the threshold for hearer reliance. If I can construct a case where the speaker is intuitively permitted to assert (low blame) but the hearer is intuitively irrational to rely (high blame for acting), the unified model fails.

  For example, I will develop a "High-Stakes Hearer" case. A speaker asserts a proposition based on standard evidence (e.g., "The bank is open Saturday"). The speaker is in a low-stakes context and seems licensed to assert. The hearer, however, faces catastrophic loss if the proposition is false. Intuitively, we might say the speaker did nothing wrong in asserting (licensing met), but the hearer should not rely on this assertion without further check (reliance not met). If participants or peer reviewers agree with this split judgment, it demonstrates assertoric slack.

  To ensure rigor, I will not rely solely on my own intuitions. I will present these vignettes to a small cohort of peers not specialized in epistemology to gauge naive linguistic intuitions, and discuss them in seminar settings to test for philosophical stability. The method succeeds if the divergence in judgments is robust across different evaluators. It fails if judgments consistently collapse back into a single verdict (e.g., if everyone agrees that if the hearer can't rely, the speaker shouldn't have asserted).

  **Expected Results and Success Conditions**

  A successful outcome for this project is not necessarily the discovery of the "true" norm of assertion, but rather the establishment of the distinction itself.

  *Positive Result:* The project demonstrates that licensing and reliance conditions come apart in specific, reproducible cases. This would imply that the traditional debate is category-mistaken. The theoretical upshot would be a shift from asking "What is the norm of assertion?" to "What is the licensing norm, and what is the reliance norm, and how do they interact?" This would validate the concept of assertoric slack as a necessary tool for future epistemology of language.
  *Negative Result:* The project fails to find stable cases of divergence. Evaluators consistently judge that if a speaker is licensed, reliance is safe, and if reliance is unsafe, the speaker was not licensed. This would support the unified norm hypothesis, suggesting that assertoric slack is merely an artifact of confusing pragmatic implicatures with constitutive norms.

  Even a negative result is valuable, as it would strengthen the unified view by showing it withstands targeted stress tests. However, the project is designed to probe the weakness of the unified view. Failure would only be declared if the vignettes prove ambiguous or if intuitions are too chaotic to yield a pattern.

  **Scope and Feasibility: An Honest Verdict**

  A critical component of this proposal is an honest assessment of scope. The question of whether licensing and reliance *can* be unified into a single master theory is too large for a semester-long undergraduate project. Attempting to construct a new unified theory that accounts for any discovered slack would require a depth of systematic metaphysics and ethics beyond the current timeframe.

  Therefore, the scope of this project is narrowed specifically to *establishing the distinction*. I will not attempt to propose a new norm to replace Knowledge or Truth. Instead, I will focus exclusively on the existence of assertoric slack. This is a semester-sized task because it relies on conceptual analysis and vignette construction rather than comprehensive theory-building.

  If the data suggests the norms diverge, the project will conclude by outlining the implications for the existing debate, rather than solving them. If the data suggests they converge, the project will conclude by reinforcing the unified model. This narrowing ensures the project is completable while still making a substantive contribution. By focusing on the *structure* of the debate rather than the *content* of the norms, I can provide a determinate answer to the research question without needing to resolve the broader epistemological disputes regarding the nature of knowledge or justification.

  **Conclusion**

  The debate over the norm of assertion has reached a stalemate because competitors are measuring their theories against intuitions that may be composite rather than atomic. By distinguishing the license to speak from the entitlement to rely, this project seeks to reveal the underlying structure of our assertoric practices. Whether the result confirms the existence of assertoric slack or reinforces the unity of the norm, the clarification alone advances the field by forcing future theories to account for the dual roles of assertion. This research is feasible, methodologically sound, and addresses a foundational ambiguity in the epistemology of language.
