prompt: |-
  I'm a third-year undergraduate currently taking a course on the epistemology of language and testimony, and I've gotten a bit obsessed with the debate over the norm of assertion — the question of whether you may assert that p only if you know it, or merely if it's true, or if you believe it, and so on. My dissatisfaction is this: almost everyone in that debate tests single sentences in isolation (a speaker, a proposition, go) against intuitions about when the assertion "sounds off," but the word "norm" is being asked to do two quite different jobs. One job is *licensing*: the condition under which the speaker is permitted to perform the act. The other is *reliance*: the condition under which a hearer is entitled to take the speaker's word for it and act on it. My half-formed idea — I've been batting it around with a friend in the same course, and we keep getting stuck — is that these come apart, and that a lot of the apparent disagreement between the knowledge-norm camp and the truth- or belief-norm camps is really a disagreement about which of the two they are theorizing, disguised as a disagreement about the content of one shared norm. I've been calling the gap between the two "assertoric slack": the range of cases where an assertion is licensed but not safe to rely on, or relied upon but not licensed. What makes me think there's something here is the apparent asymmetry in when you may put an assertion forward versus when you may withdraw one: if the licensing threshold really were a single knowledge condition, it's not obvious why the bar for taking it back should sit lower than the bar for putting it out.

  Please turn this into a short research proposal — roughly 1,500–2,000 words, the kind of thing I'd submit for a departmental undergraduate research grant. The question I want the proposal to pose is whether the norm of assertion is best understood as a licensing norm, as a reliance norm, or as something that unifies the two; and I'd like you to frame it so precisely that it has a determinate answer, because my own formulation is vague enough that I worry nothing could count as refuting it. I do not want a literature review, a reading list, or citations — I'll supply the references myself, and I'd much rather you argue about the ideas than gesture at who said what. So what I need is: a sharp statement of the question; an account of why the existing positions (knowledge, truth, belief, justification) leave it open rather than settling it, with at least one concrete case where they seem to pull apart; the method I would actually follow across a semester (I have in mind building paired cases designed to stress the licensing/reliance distinction and seeing whether it holds or collapses, but tell me what would make that method succeed or fail, and whether there's a better one); what a real result would look like as opposed to what would count as the project failing; and an honest verdict on scope — is this a semester-sized project, or is the unification question too large, in which case say which single norm I should narrow to and why. Two constraints: the proposal should be self-contained, so that a reader who has never encountered my coinage "assertoric slack" can follow it from the document alone, and it should not lean on any named author's particular formulation, since I can't verify references at the moment. Begin your response directly with the proposal itself — a title followed by the body — with no preface or commentary.
