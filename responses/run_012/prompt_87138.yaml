answer: |-
  You have been dining with a collector and a conservator, so it is no surprise your intuition is torn between **provenance** (the story of the object) and **materiality** (the physical stuff). Your hypothesis—that value splits into "object" and "causal history"—is a strong start, but it is too clean. It treats history as an add-on, like a label on a jar. Your own verdicts suggest something more radical: that the history is *inside* the jar.

  Here is the principle that fits your reactions, the case that breaks it, and the verdict you must sacrifice.

  ### The Principle: Constitutive Provenance

  Your reactions are governed by the **Principle of Constitutive Provenance**. This principle states that for certain categories of art (specifically autographic arts like painting and sculpture), the work's identity and value are not merely carried by its visual properties, but are *constituted* by the specific history of its production. The object is not just a thing; it is a **fossilized event**.

  When you look at a Vermeer, you are not just looking at pigment on canvas; you are looking at the physical terminus of Vermeer's specific creative decisions. The value lies in the **trace of agency**.

  *   **Why it fits Case 2 (Exposed Forgery):** Once exposed, the "event" changes. It is no longer the terminus of Vermeer's mind, but the forger's. The visual data is the same, but the constitutive history is false. Hence, you won't travel to see it.
  *   **Why it fits Case 3 (Reattribution):** The object didn't change, but your understanding of the "event" did. You are now seeing the trace of a Master rather than a follower. The value jumps because the agency is rarer/more significant.
  *   **Why it fits Case 4 (Restoration):** If the work is a fossilized event, replacing a third of the material breaks the continuity of that event. It is no longer quite the same "fossil."
  *   **Why it fits Case 5 (Nature) & 7 (Machine):** A cliff face has no human agency; a machine carving has no human *creative* intention (if the design is non-human). You resist calling them "art" because there is no human event to witness, only an outcome.
  *   **Why it fits Case 6 (Disliked Author):** The text is allographic (the words are the work), but your engagement is relational. Knowing the author is someone you dislike corrupts the relationship between viewer and agent, shifting the estimate.

  ### The Outlier: Case 1 (The Pre-Exposure Forgery)

  The case that pulls against the rest is your first one: **"I think it would be wrong to say that my experience of it is worth less than my experience of the genuine article."**

  This verdict relies on **Aesthetic Autonomy**—the idea that the value resides entirely in the immediate sensory experience. Every other case you listed (2 through 7) admits that knowledge, history, material continuity, or agency alters the value *even if the visual input remains constant*.

  In Case 3, you admit the painting is *more* worth looking at once reattributed, even though "nothing about the object changes." If history can *add* value in Case 3 without changing the object, then false history must *subtract* value in Case 1, even if you don't know it yet. You cannot claim history is constitutive (Cases 2, 3, 4) and also claim that a fake history provides an equal experience (Case 1).

  ### Predictions for New Cases

  If we apply the **Principle of Constitutive Provenance**, here is how you should judge the cases you haven't mentioned:

  1.  **A copy the artist made of his own earlier painting:**
      *   **Verdict:** **High Value.**
      *   **Reasoning:** The "trace of agency" is authentic. It is the same mind, intentionally replicating the event. It is a new fossilized event by the same agent (e.g., Monet painting his own Water Lilies again). It counts as an original work, not a forgery.

  2.  **An honest replica sold as a replica:**
      *   **Verdict:** **Low Artistic Value / High Decorative Value.**
      *   **Reasoning:** There is no deception, so no fraud, but there is no unique generative event to witness. It is a copy of the trace, not the trace itself. You would appreciate the craft, but you would not treat it as "the work."

  3.  **A performance by a tribute band:**
      *   **Verdict:** **Valid Instance of the Work.**
      *   **Reasoning:** Music is generally **allographic**. The "work" is the score, not the specific physical vibrations of the original recording. As long as the tribute band complies with the score, they are instantiating the work legitimately. The "trace of agency" is in the composition, not the specific performance history (unlike painting).

  4.  **A signature added to a painting by someone other than the painter:**
      *   **Verdict:** **Devalued / Corrupted.**
      *   **Reasoning:** This is a lie about the constitutive history. It attempts to falsify the "trace of agency." Even if the painting is genuine, the addition corrupts the provenance, making the object a hybrid of truth and fraud.

  ### The Verdict You Must Abandon

  To make your worldview consistent, you must abandon the verdict in **Case 1**.

  You must accept that **your experience of the forgery *was* worth less, even before you knew it was a fake.**

  This is a hard pill to swallow because it admits that your aesthetic experience is not a private, self-contained bubble. It admits that part of what you were "feeling" when you looked at the forgery was a *belief* in Vermeer's presence. When that belief was false, the experience was fundamentally compromised, even if your eyes couldn't tell the difference.

  Your collector friend argues for the story; your conservator friend argues for the stuff. The principle that unites them is that **the stuff is valuable because of the story.** If the story is a lie, the stuff is merely a prop. You can still love the prop (Case 2: "still beautiful"), but you must admit it is not the play.
