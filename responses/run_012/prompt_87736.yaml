      *(Refining the "Outside Option" point)*: In bargaining theory, "outside option" usually maps to the disagreement point $d$. But sometimes people use it to mean the "ideal point" (best case). KS is driven by the *Ideal Point*. Nash is driven by the curvature near $d$. The user's (7) says "proportional to how much each could gain." This implies the Ideal Point matters. I need to make sure they don't think KS is just about $d$. It's about the ray from $d$ to Ideal.

