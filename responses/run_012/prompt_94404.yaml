          *   M's claim "Theoretical possibility... practical defect" is a normative judgment. N's claim "Strategy-proofness is the property you claimed" is a logical check.
          *   *Verdict:* N is right that the strategic problem remains intact regarding the *qualification* phase. M is right that it might be *more* robust than Plurality, but wrong to claim it solves the incentive problem.
