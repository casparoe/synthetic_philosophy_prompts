      *   *Key Missing Point:* The distinction between *Dominant Strategy Incentive Compatibility (DSIC)* and *Bayesian Incentive Compatibility (BIC)*. M is arguing BIC (honesty is best given uncertainty). N is arguing DSIC (honesty is best regardless). The claim was "Strategy-proof" which usually means DSIC.
