          *   If the mechanism asks for *utilities* and maximizes social welfare (Utilitarianism), it is strategy-proof *if* agents are risk-neutral and money transfers are allowed (VCG). Without transfers, asking for cardinal utilities doesn't automatically make a rule strategy-proof.
          *   Specifically, if the output is a single winner and the input is cardinal, does GS hold? Yes, essentially. If a rule is strategy-proof on a cardinal domain, it usually implies it's dictatorial or restricts the range to 2 alternatives (Gibbard 1977).
          *   *M's nuance:* M says GS assumes ordinal. Technically, the *statement* of GS is about ordinal preferences. But the *implication* (impossibility of strategy-proofness) extends to cardinal domains if the rule maps to a single winner and isn't dictatorial.
          *   *Verdict:* M is technically correct that the *standard statement* of GS refers to ordinal rankings. However, M is wrong to imply this exempts the rule from impossibility results. N is right that the *spirit* and extensions of GS cover this. A cardinal rule selecting a single winner is still subject to manipulation impossibility theorems (Gibbard 1977).
