answer: |-
  Thank you. It is a profound honor to receive this prize, and to stand among the scholars whose work has shaped my own.

  I want to begin by thanking the prize committee for this recognition. I am particularly grateful to the Chair, Professor [Name]. In my second chapter, I subject your textbook to considerable scrutiny. Thank you for writing a text rigorous enough to sustain that scrutiny, and for teaching me the standards I needed to learn before I could challenge them. That is the best gift a teacher can give a student.

  To my parents, here tonight: thank you for four years of patience while I explained to you why I was still in school, and for listening to me talk about things that, I know, often sounded like semantics. To my undergraduate students who are here: thank you for reminding me that clarity matters. And to my advisors: thank you for knowing when to push and when to let me find the argument myself.

  You just heard the citation for this award. It describes my work as showing that the adaptationist programme has been refuted, and that most traits we call adaptations are actually byproducts or accidents. That is a flattering summary. It is also, if I am being precise, a little stronger than the conclusion I defend.

  The citation suggests I have made a claim about *nature*: that there are fewer adaptations out there than we thought. What I actually argue is a claim about *us*: about how we explain what we find.

  My concern is with the burden of proof. In much of the literature, calling a trait an "adaptation" functions as a default setting. We assume a trait was selected for its current use unless proven otherwise. I argue that adaptation should be a hypothesis, not a default. It is a claim about history, not just about utility.

  For the non-specialists in the room—especially my parents—here is what that means in practice. Consider the human chin. It is a prominent, distinct feature. It looks designed. One can tell a very tidy story about how it helps with speech or chewing. But many biologists suspect the chin is not an adaptation at all. It is likely a structural byproduct of how our jaws grew smaller over time while our teeth stayed crowded. It is useful, perhaps. It is tidy, certainly. But it may be a historical accident, not a selected solution. If we treat "adaptation" as a default, we stop looking for that history. We accept the story because it fits, not because it is true.

  To the philosophers and biologists here: I want to be clear that distinguishing the *logic of explanation* from the *frequency of traits* is not a retreat. A trait can be useful and tidy and still not be an adaptation, because byproducts and constraints can be useful and tidy too. Whether something is an adaptation is a question about its etiology, not its fit. Defending this distinction does not soften the critique; it sharpens the tool.

  We do not need to assume nature is full of accidents to acknowledge that our explanations sometimes are.

  Thank you again for this prize, for your generosity, and for the rigorous conversation that makes this field worth joining. I am grateful to be part of it. Cheers.
