answer: |-
  **SEMINAR Q&A PREP SHEET**
  **To:** The Defector
  **From:** Your Conscience (via AI)
  **Re:** Thursday WIP Seminar

  Right. You've written three novels, but this room doesn't care about narrative arc. They care about ontological commitment and whether you've wasted their tea time. You are walking into a room that thinks *finks* and *masks* are bugs to be fixed, whereas you are arguing they are features to be recorded. That is a category error in their eyes.

  Your strategy is to frame this not as 'fixing' the metaphysics of dispositions, but as 'thickening' it to match the phenomena (both physical and psychological). Do not apologise for the novelist angle; use it to motivate the granularity of the profile, but do not let them dismiss it as mere metaphor.

  Here are the five objections you will face, ordered by likelihood and lethality. British spelling applied throughout.

  ***

  ### 1. The 'Ontological Bloat' Objection
  **Who:** The Hard-Nosed Metaphysicians (The Majority)
  **Likelihood:** Certain.
  **Damage:** High. If this lands, your theory looks trivial.

  **The Question:**
  "Look, if I wrap the glass in bubble wrap, you say it has a different disposition than if I wrap it in foam. If I wrap it in both, is that a third? If I move it to a room with different humidity, is that a fourth? You're individuating dispositions by the infinite set of possible interferers. You haven't given us an account of dispositions; you've just given us a licence to multiply properties without limit. Why isn't this just trivial proliferation?"

  **The Two-Minute Reply:**
  "It looks like proliferation if you think the disposition is a static label we stick on an object. I'm suggesting it's more like a vector. We don't say a velocity vector is 'proliferating' just because it has different components in different coordinate systems. The profile isn't a list of infinite new properties; it's a single, complex property with a rich structure.
  "Think of it like character. A coward in peace and a coward in war aren't two different men, but their cowardice isn't the *same* property either, because the structure of the trait includes how it responds to pressure. The 'bloat' is only a problem if you demand dispositions be simple. If the world is complex, our ontology should be too. I'm not multiplying entities; I'm stopping us from pretending complex realities are simple."

  **Weakness/Concession:**
  *Weakness:* You are relying on an analogy (vectors/character) rather than a strict identity condition.
  *Concession:* Concede that yes, on your view, objects possess a *range* of disposition-profiles depending on context, but insist this is a feature, not a bug. Do not try to prove there is a 'finite' number of profiles. That's a trap.

  ### 2. The 'Intrinsicness' Objection
  **Who:** The Dispositional Essentialist
  **Likelihood:** High.
  **Damage:** Critical. This attacks the core metaphysical status of your view.

  **The Question:**
  "Dispositions are supposed to be intrinsic powers. They belong to the object in virtue of what it *is*. On your view, whether I have the disposition to shatter depends on whether there's a safety screen nearby. You've made the disposition extrinsic. You've turned a power into a relation. If you do that, you've abandoned Dispositional Essentialism entirely. Why should we call this a 'disposition' at all and not just a conditional probability?"

  **The Two-Minute Reply:**
  "I am abandoning the idea that dispositions must be *purely* intrinsic, yes. But only because 'purely intrinsic' is a fiction when we're talking about behaviour. A power that can never manifest because of its environment is, for all theoretical purposes, a different power than one that can.
  "Consider the coward. Is cowardice intrinsic? Or is it a relation between the agent and the threat? If it's purely intrinsic, then the soldier who freezes in battle and the one who never sees battle are identical in virtue. That seems wrong. I'm arguing that the 'power' includes the field in which it operates. I'm not smuggling in relations; I'm acknowledging that powers are inherently directed towards a world that might resist them."

  **Weakness/Concession:**
  *Weakness:* You are explicitly contradicting the Essentialist's core dogma.
  *Concession:* Concede upfront: "You are right, this is not Dispositional Essentialism as standardly defined." Frame it as a *rival* view, not an amendment. Don't try to win them over; just survive them.

  ### 3. The 'Causal Basis' Objection
  **Who:** The Philosophy of Biology / Mechanistic Group
  **Likelihood:** Medium-High.
  **Damage:** Medium. They care about the 'realiser'.

  **The Question:**
  "You say the masked glass has a different disposition from the unmasked one. But the microstructure—the causal basis—is identical. The silicon-oxygen bonds are the same. If the causal basis is the same, what physical difference corresponds to this 'different' disposition? Are you saying the disposition floats free of the mechanism? Because if so, you've lost the biology."

  **The Two-Minute Reply:**
  "No, the causal basis is necessary, but it isn't sufficient for individuation. Two lights can have the same filament but different switch mechanisms; we care about how the light turns on, not just the filament.
  "In biology, we do this all the time. A gene's 'disposition' to express a trait depends on the epigenetic environment. We don't say the gene is the 'same' in a silenced context as in an active one, even if the DNA sequence is identical. The 'disposition' is the system's behaviour, not just the component's structure. I'm asking you to locate the disposition in the system (object + context), not just the substrate."

  **Weakness/Concession:**
  *Weakness:* You risk sounding like you're changing the subject from metaphysics to systems theory.
  *Concession:* Accept that the *categorical base* is identical. Insist that *dispositional identity* tracks functional capacity, not just categorical base.

  ### 4. The 'Interventionist' Objection
  **Who:** The Visiting Psychologist
  **Likelihood:** Medium.
  **Damage:** Medium-High. They speak 'causal modelling'.

  **The Question:**
  "In causal modelling, we care about invariance under intervention. If I intervene on the mask, the manifestation changes. If the disposition *includes* the mask, then your variable isn't stable. How do I model this? If the disposition changes every time the background conditions change, it's not a useful variable for prediction. It's just a description of the outcome."

  **The Two-Minute Reply:**
  "It's not a description of the outcome; it's a description of the *stability* of the outcome. In your models, you treat background conditions as noise. I'm saying the 'noise' is part of the signal.
  "If you want invariance, you need to define the disposition at the level of the *profile*, not the single manifestation. The profile *is* invariant: the glass *always* has the profile 'shatters unless masked'. That is stable. You're looking for a single counterfactual; I'm offering a function. It makes the modelling harder, but it makes it accurate."

  **Weakness/Concession:**
  *Weakness:* You are admitting it makes modelling harder.
  *Concession:* Admit it complicates prediction. Argue it improves *explanation*.

  ### 5. The 'Explanatory Idle' Objection
  **Who:** The Skeptics (Everyone, eventually)
  **Likelihood:** Medium.
  **Damage:** Fatal if unaddressed.

  **The Question:**
  "Okay, suppose we accept all this. What work does it do? Does it solve a paradox? Does it predict a new phenomenon? Or does it just give us a more complicated way of saying 'it depends'? If the masked glass behaves exactly like the non-shattering glass, why do I need a new metaphysical category to describe it?"

  **The Two-Minute Reply:**
  "It solves the problem of *potentiality*. The non-shattering glass (made of plastic) and the masked glass (made of brittle material) behave the same now, but they have different futures if the mask is removed. Standard accounts struggle to distinguish them without referencing history or microstructure.
  "My account distinguishes them by their modal profile. It tells us why we treat the soldier differently from the civilian, even if neither has run away yet. It captures the *tension* in the system. That's not idle; that's the difference between understanding a thing and just tracking its outputs."

  **Weakness/Concession:**
  *Weakness:* This is your sales pitch. If it wobbles, the paper is dead.
  *Concession:* None. Stand firm here.

  ***

  ### THE ELEPHANT IN THE ROOM
  **The Question You're Avoiding:**
  *"Isn't this just the Conditional Analysis in disguise?"*

  **Why you're avoiding it:** Because Lewis and others tried to analyse dispositions via conditionals, and they failed because of finks and masks. You are now saying "Include the finks and masks in the profile." A sharp metaphysician will spot that you are essentially trying to save the Conditional Analysis by making the antecedents infinitely complex. If your 'profile' is just a big conjunction of counterfactuals, you haven't escaped the Humean reduction you claim to be avoiding.

  **The Reply (Keep this in your back pocket):**
  "The Conditional Analysis tries to *reduce* the disposition to the counterfactuals. I'm doing the opposite: I'm using the counterfactuals to *individuate* a real property. The profile isn't the disposition; the profile is how we identify the disposition. I'm not saying 'brittleness just is the shattering'; I'm saying 'brittleness is the property that yields this specific pattern of shattering and non-shattering'."

  ***

  ### THE ONE THAT MUST FAIL
  **The 'Ontological Bloat' Objection (Number 1).**

  If the room convinces themselves that your view is trivial—that you are simply giving a new name to every context-variant interaction—your theory becomes useless. It becomes a linguistic game rather than a metaphysical insight.

  **How to ensure it fails:**
  Do not get dragged into counting properties. Refuse to play the "how many dispositions does this glass have?" game. Insist that there is *one* disposition with a *complex* structure. If you let them frame it as "one disposition per mask," you lose. If you frame it as "one disposition defined by its reaction to masks," you survive.

  **Final Advice:**
  You are a novelist. They are metaphysicians. They will try to bore you into submission with technicalities. Do not get bogged down in the syntax of counterfactuals. Keep dragging them back to the *glass*, the *soldier*, the *behaviour*. Remind them that metaphysics is supposed to be about the world, not just the vocabulary.

  And for God's sake, don't let the Essentialist see you sweat on the 'intrinsic' point. Just bite the bullet. Extrinsic dispositions are fine.

  Good luck. Try not to defect again.
