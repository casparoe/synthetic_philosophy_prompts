answer: |-
  This is a sophisticated position. You are advocating for **Welfare Realism** with **Cardinal Interpersonal Comparability**. You are in good company (Sidgwick, Edgeworth, Parfit, Crisp), and you are right to dismiss the strict behaviorist/revealed preference objection as a category error; that objection denies the *ontology* of welfare, whereas you are positing it as a natural (or non-natural) fact akin to temperature.

  However, the temperature analogy is a double-edged sword. It gives you your intuition, but it also provides the weapons for your strongest critics.

  Here is the ranking of objections that should make you nervous, from fatal structural problems to merely awkward epistemic ones, followed by an analysis of your specific puzzle regarding the zero point and decision theory.

  ### Part 1: The Threat Ranking (Fatal to Awkward)

  #### 1. The "Absolute Zero" Problem (Fatal to Ratio Scales)
  **The Objection:** Temperature works as a comparable magnitude because it has a non-arbitrary zero point (absolute zero = no kinetic energy). This makes it a *ratio scale*. You can say "Room A is twice as hot as Room B" (in Kelvin).
  Welfare lacks a natural zero. Is zero "death"? "Non-existence"? "A life not worth living"? "Neutrality (no pleasure, no pain)"?
  *   **Why it's fatal:** If you cannot fix a non-arbitrary zero, your scale is merely an *interval scale* (like Celsius or Fahrenheit). On an interval scale, *differences* are comparable ("My pain increased more than yours"), but *magnitudes* and *ratios* are not ("I am twice as happy as you").
  *   **The Cost:** If welfare is only an interval scale, **Total Utilitarianism is mathematically incoherent.** You cannot sum welfare across persons if the zero point is arbitrary, because shifting the zero point changes the sum. You might save *comparisons of changes*, but you lose the ability to say one state of the universe contains "more welfare" than another in an absolute sense.
  *   **Can a defender wave it off?** Only by positing a metaphysical "neutral state" of consciousness. But many argue consciousness is always valenced (always positive or negative), meaning a true zero is impossible.

  #### 2. The Decision-Theory / Welfare Divergence (Fatal to Action-Guidance)
  **The Objection:** You noted this yourself. Von Neumann-Morgenstern (VNM) utility (decision theory) and Welfare utility (philosophical well-being) do different jobs.
  *   VNM utility is defined by **coherence of choice**. It is invariant to positive affine transformations (you can shift the zero and stretch the unit, and the preferences remain the same).
  *   Welfare utility is defined by **goodness of experience/state**. It requires a fixed zero and unit to be summed.
  *   **Why it's fatal:** If these two come apart (and they do; e.g., adaptive preferences, self-harm, ignorance), then your "Real Welfare Scale" is disconnected from rational choice. If I can be rationally required to choose against my own welfare (or vice versa), the "fact of the matter" about welfare loses its normative grip. It becomes a "ghost magnitude" that doesn't actually guide action.
  *   **Can a defender wave it off?** By bifurcating the concepts: "Rationality tracks Choice-Utility; Morality tracks Welfare-Utility." This saves the metaphysics but creates a dualism that needs bridging.

  #### 3. Phenomenological Heterogeneity (Serious)
  **The Objection:** Temperature is homogeneous (kinetic energy). Welfare is heterogeneous. Is the "magnitude" of a back pain the same *kind* of magnitude as the "magnitude" of grief? Is your grief commensurable with my nausea?
  *   **Why it's serious:** To put them on one scale, you need a common currency. If the "units" of pain differ qualitatively across persons or types, a single scale is a category mistake. It's like trying to measure "loudness" and "brightness" on the same thermometer.
  *   **Can a defender wave it off?** By arguing for a "common felt intensity." You claim that despite different causes, the *raw feel* of suffering has a shared dimension of "badness" that can be aligned. This is plausible but relies heavily on introspection.

  #### 4. The "Happy Slave" / Adaptation Problem (Awkward)
  **The Objection:** People adapt. A person in objectively terrible conditions may report high welfare (adaptive preferences). A person in luxury may report depression.
  *   **Why it's awkward:** If welfare is a real magnitude like temperature, why does the "thermometer" (self-report) break so easily based on expectations? If you say "Their report is wrong, their welfare is actually low," you are positing a fact that is systematically inaccessible to the subject.
  *   **Can a defender wave it off?** Easily. "Temperature readings can be wrong if the thermometer is broken. The subject's mind is the thermometer, and it can be calibrated poorly by trauma or adaptation." This fits your "we don't have the thermometer yet" view perfectly.

  ---

  ### Part 2: Your Specific Puzzle (Zero vs. Unit & Decision Theory)

  You asked: *"It feels like nailing down a unit... is the easy part and nailing down a zero is the hard part — am I even pointing at the right difficulty, or is the whole one-scale picture incoherent once you notice that the utility decision theory talks about and the utility the welfare people talk about seem to be doing totally different jobs?"*

  You are pointing at **exactly** the right difficulty, but the Decision Theory disconnect is actually the deeper incoherence risk.

  #### 1. The Zero is indeed the Hard Part
  You are correct. Calibrating the unit is arguably easier (e.g., "One 'util' is the difference between a mild headache and no headache"). We can imagine standardizing that across people via neural correlates.
  But the **Zero Point** determines the *type* of scale you have.
  *   **If Zero = Neutrality:** You can compare sums. But does neutrality exist?
  *   **If Zero = Non-existence:** You run into the "Repugnant Conclusion" and non-identity problems instantly.
  *   **If Zero is Arbitrary:** You cannot sum welfare. You can only compare *improvements*. This forces you away from Utilitarianism toward **Prioritarianism** (giving weight to the worse off) or **Sufficientarianism**.
  *   **Verdict:** If you cannot solve the Zero, your view forces a major change in normative ethics, even if the metaphysics of comparability holds.

  #### 2. The Decision Theory Disconnect
  This is the greater risk to coherence.
  *   **Decision Theory Utility:** $U(A) > U(B) \iff$ Agent chooses A over B. This is *defined* by choice.
  *   **Welfare Realist Utility:** $W(A) > W(B) \iff$ A is better for the agent than B. This is *independent* of choice.

  **The Risk:** If you claim Welfare is real and comparable, but it doesn't map to Choice-Utility, you must explain **why we should care about the Welfare Scale.**
  *   If I choose X (maximizing Choice-Utility) but Y would have given me more Welfare-Utility, was I irrational? Or just misguided?
  *   If I was irrational, then Choice-Utility is the real metric.
  *   If I was rational but welfare-poor, then Welfare is a "spectator sport" metric—it describes how well I'm doing, but not how I should decide.

  **The Defender's Move:** You must argue that **Rationality is tracking Welfare, but often misses.** This requires a robust theory of error (why do we systematically choose against our own good?). If you can't explain the error, the "Real Welfare Scale" looks like an epicycle—a hidden variable added to save a theory (Utilitarianism) that doesn't match the data (Choice).

  ---

  ### Part 3: Unfalsifiability and the Cost of "Hedging"

  You asked: *"I'd also like to know whether my view risks anything at all or has been hedged into unfalsifiability, because if it can't lose I want to know that's a definite cost."*

  **Yes, it is a definite cost.**
  Your view ("There is a fact, but we can't measure it yet, and maybe never will") risks becoming **metaphysically idle**.

  1.  **The Verificationist Worry:** If no possible observation could ever confirm or disconfirm the claim "Person A's pain is objectively worse than Person B's," in what sense is it a "fact"? It behaves like a religious claim.
  2.  **The Explanatory Power Test:** A real fact should explain phenomena. Does positing "Real Interpersonal Welfare" explain anything that "Reported Preferences" + "Neural Activity" do not?
      *   If the answer is **No**, then Occam's Razor suggests you should drop the "Real Fact" and just talk about neural states and reports.
      *   If the answer is **Yes**, you must specify *what* it explains. (Usually, realists argue it explains the *wrongness* of certain trade-offs that preference-satisfaction allows).

  **How to avoid the cost:**
  To keep the view honest, you must tie the "Real Welfare" to **naturalistic properties** (e.g., neural firing rates, cortisol levels, specific brain states).
  *   **If you do this:** Your view becomes falsifiable. If we find two people with identical neural states but one claims agony and the other bliss, your theory is in trouble.
  *   **If you don't do this:** You are positing a non-natural property. This makes the view unfalsifiable and invites the charge of "queerness" (J.L. Mackie).

  ### Summary Recommendation

  If you want to hold this view rigorously:

  1.  **Concede the Zero Point:** Admit that welfare is likely an **interval scale**, not a ratio scale. Abandon Total Utilitarianism (summing). Embrace Prioritarianism (comparing differences/levels). This neutralizes the "Absolute Zero" objection.
  2.  **Separate the Utilities:** Explicitly distinguish **Choice-Utility** (coherence) from **Welfare-Utility** (goodness). Argue that rational agents *aim* for Welfare-Utility but use Choice-Utility as a heuristic.
  3.  **Naturalize the Magnitude:** To avoid unfalsifiability, anchor the "magnitude" in physical states (neuroscience). Claim that "pain intensity" is a physical property of the nervous system that is comparable across mammals, even if reports vary.
  4.  **Accept the Epistemic Gap:** Your "no thermometer" analogy is your strongest shield. Keep it. But acknowledge that without a thermometer, the claim is a **regulative ideal** (a goal for science) rather than a current scientific fact.

  **The Fatal Flaw to Watch:** Do not let the view drift into saying "Welfare is real *and* dictates rational choice" while simultaneously admitting "Rational agents systematically choose against it." That tension is where the theory usually snaps.
