answer: |-
  Good morning. Look at the space behind me. For a hundred and ten years, that pedestal held a man looking north, his hand raised in benediction or command, depending on where you stood. For a hundred and ten years, Elias Hartwell was the anchor of this square. When we took him down, the square felt unmoored. I voted to remove him. I also miss him. I am not going to stand here and tell you that those two feelings cancel each other out. They do not. They sit together, heavy and contradictory, just as we must sit together today.

  We are gathered to dedicate not a figure, but a base. Not a verdict, but a mechanism. The design committee calls it a counter-plinth. It is low granite. It has a slot. It holds slabs of stone, forty words each, never removed, allowed to contradict. Some have called this design a coward's monument. They say it refuses to say what anyone actually did. They say that by not replacing the bronze with a new hero, or with a permanent plaque of indictment, we are dodging the work of judgment. I understand that anger. I have felt it myself, in conversations with people I love. But I am here to argue that this stone is not an evasion. It is a demand.

  A bronze statue is a closing statement. It is a period at the end of a sentence written by the dead. It says: Here is the measure of a man. It collapses honoring, remembering, teaching, and promising into one act. It tells us that our relationship with the past is fixed, that the work of evaluation is complete. When we looked at Hartwell in bronze, we were told he was a founder. The bronze did the thinking for us. It allowed us to walk past the library he endowed and the hospital he funded without walking past the ledgers where he bought and sold people. It allowed us to admire the mills without hearing the silence of the strike in '09. The statue was a comfort. It told us the story was finished.

  This stone does not offer that comfort. This stone admits that the story is not finished because we are not finished.

  To the Hartwell family: I know this is painful. I know a great-granddaughter teaches our children down the street. This monument does not erase your ancestor. It places him in context. The first slabs will record the endowments. They will also record the human trafficking. They will record the strike-breaking. Nothing is hidden. But nothing is final. You are not being asked to apologize for history, but you are being asked to witness how we handle it. We are not destroying your history; we are refusing to let it freeze.

  To the students who campaigned for removal: You won. The bronze is gone. I know some of you wanted a permanent indictment carved in granite, something that would stand for another century and say "Guilty." I understand that desire. But consider this: A permanent indictment, like a permanent statue, eventually becomes background noise. It becomes something we walk past without reading. If we carve your verdict in metal, we relieve the next generation of the need to find it themselves. This plinth requires you to come back. It requires you to write the next slab. It requires you to argue with the slab before it. It demands that your children learn to read the contradictions, not just the conclusion.

  To the historians here: You know the difference between memory and history. Memory seeks cohesion; history seeks accuracy. They are rarely the same thing. A statue is memory. This plinth is an attempt at history that admits it is being written by living people.

  The distinction I want us to carry home is this: There is a difference between a monument that closes a question and a monument that keeps a question open on purpose. Closing the question is easy. It gives us a verdict. It tells us who was worthy and who was not. But keeping the question open is a harder form of judgment. It requires us to remain vigilant. It requires us to acknowledge that our own values will be scrutinized by those who stand here in twenty years, just as we have scrutinized Hartwell.

  If we put up a new statue today, even of a hero, we are telling our grandchildren that we have solved the problem of who deserves to be honored. We are telling them that we are the judges who cannot be judged. This granite base admits that we might be wrong. It admits that our certainty is temporary. That is not cowardice. That is humility. And humility is not the absence of judgment; it is the recognition that judgment is a continuous act, not a single event.

  I grieve the loss of the anchor. I wish we could have kept the beauty of the bronze without the lie of the pedestal. I wish Hartwell had not bought people. I wish the strike had not been broken. I wish I did not have to stand here and explain why a blank space is more honest than a filled one. But wishes are not history.

  We are building a town where honoring, remembering, teaching, and promising are separate acts. We can remember Hartwell built the hospital. We can teach that he bought people. We can promise not to repeat it. We can honor the workers he suppressed. We do not have to collapse those things into a single bronze face that forces us to accept them all or reject them all.

  So, look at the slot. It is empty. That emptiness is not a void; it is an assignment. It belongs to us. When we leave this square, the work begins. Someone will write the first forty words. Someone else will write the next. They will argue. They will contradict. They will grieve. They will accuse. And because they do, the square remains alive.

  A statue says, "It is done." This stone says, "It is your turn." Do not treat this lightly. Do not treat this as a compromise. Treat it as the harder path. The path that requires us to stay engaged with our own history, rather than casting it in metal and walking away.

  Hartwell is no longer watching us. We are watching each other. Let us make sure what we write is worth the stone.

  Thank you.
