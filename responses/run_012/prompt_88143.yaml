answer: |-
  1. The decline thesis posits that the incidence rate of violent events per unit of person-time at risk has decreased significantly across historical cohorts. This claim requires treating violence as a stable outcome variable whose frequency diminishes relative to the expanding population denominator over deep time.

  2. Critics argue that the case definition of violence lacks measurement invariance across eras, introducing ascertainment bias where historical under-reporting mimics lower incidence. They contend that changes in surveillance systems and competing risks render direct comparison of rates between distinct populations and time periods invalid without rigorous standardisation.

  3. This dispute translates to choosing between an incidence rate, which normalizes for population growth, and a raw count of cases, which measures total burden. Prioritizing the rate supports the thesis of reduced individual risk, whereas prioritizing the count highlights the aggregate suffering that persists despite statistical dilution.

  4. The normative valence of violence and the moral judgment of what constitutes harm do not survive translation into neutral case definitions required for surveillance. Philosophical questions about structural harm are mutilated when forced into a binary outcome variable, as the framework cannot distinguish between episodic events and systemic conditions without arbitrary coding rules.

  5. This residue marks a defect of the epidemiological framework only if one assumes moral concepts are natural kinds amenable to measurement without loss. Otherwise, it signals that the philosophical dispute is less determinate than it appears, relying on contested constructs rather than observable phenomena stable enough for rate calculation.
