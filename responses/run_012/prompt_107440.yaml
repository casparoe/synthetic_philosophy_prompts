      *   *Explication:* Replacing a vague concept (explicandum) with a precise one (explicatum) for a specific purpose.
      *   *Internal vs. External Questions:* Internal = questions asked *within* a framework (truth/falsity applicable). External = questions *about* the framework itself (pragmatic utility, not truth-apt).
      *   *Social Planning/Socialism:* Carnap was a left-leaning logical empiricist. He saw planning as a technical task *once* goals are set, but the choice of the ethical framework is non-cognitive (emotive/volitional).

  3.  **Drafting the Translation (OR Vocabulary Mapping):**
