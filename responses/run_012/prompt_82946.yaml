  So I'm taking a phil of language seminar on conditionals and our final assignment is to write an adversarial-collaboration statement for two camps that have been going in circles: the truth-conditional/possible-worlds side (variably strict semantics, plus some Jackson-style assertability story to explain why indicatives look non-truth-functional) and the no-truth-conditions-for-indicatives side (acceptance of an indicative just is the conditional probability, per Adams and Edgington). I want the document they could both sign, not a verdict on who's right.

