answer: |-
  # ADVERSARIAL COLLABORATION STATEMENT: THE SEMANTICS OF INDICATIVE CONDITIONALS

  **Parties:**
  1.  **Truth-Conditional Camp (TC):** Defends the view that indicative conditionals express propositions with truth conditions (typically modeled via possible worlds), potentially supplemented by pragmatic constraints on assertability.
  2.  **No-Truth-Conditions Camp (NTC):** Defends the view that indicative conditionals do not express truth-evaluable propositions; their acceptance conditions are governed directly by conditional probability (Adams' Thesis).

  ## I. AGREED CLAIMS

  1.  **Adams' Thesis as Data:** Both camps agree that the equation $P(\text{If } A, C) = P(C|A)$ (Adams' Thesis) accurately describes competent speakers' degrees of belief in indicative conditionals across a wide range of ordinary contexts. Any viable theory must explain why this equation holds so robustly.
  2.  **Scope of Lewis's Triviality Results:** Both camps agree on the formal import of Lewis's triviality proofs:
      *   **What they show:** There is no interpretation of the conditional connective as a standard truth-functional or propositional operator within a classical probability space such that the probability of the conditional *strictly equals* the conditional probability for *all* probability functions.
      *   **What they do not show:** They do not prove that indicatives lack truth conditions outright. They prove only that truth conditions cannot coexist with the *unrestricted validity* of Adams' Thesis.
  3.  **Theoretical Trade-off:** Consequently, the theoretical choice is binary:
      *   **TC:** Retain truth conditions; treat Adams' Thesis as a pragmatic approximation or a constraint on assertability rather than semantic content.
      *   **NTC:** Retain Adams' Thesis as constitutive of meaning; deny that indicatives express standard propositions with truth conditions.
  4.  **Embedding Data:** Both camps agree that indicatives appear in logical embeddings (negation, disjunction, quantification). Both camps commit to providing an account of how these embeddings function without generating contradictions in their respective frameworks.

  ## II. DISAGREEMENTS TABLE

  | Domain of Dispute | Truth-Conditional Camp (TC) Assertion | No-Truth-Conditions Camp (NTC) Assertion |
  | :--- | :--- | :--- |
  | **1. Semantic Value** | The semantic value of "If A, C" is a proposition (a set of possible worlds) that is determinately true or false relative to a world. | The semantic value of "If A, C" is not a proposition but a probabilistic constraint on belief states; it is acceptable or unacceptable, not true or false. |
  | **2. Explanation of Adams' Thesis** | Adams' Thesis holds because rational speakers follow a pragmatic norm: assert "If A, C" only when $P(C|A)$ is high (Jackson-style assertability). | Adams' Thesis holds because the meaning of "If A, C" *is* the instruction to condition belief in C on A; it is a semantic rule, not a pragmatic filter. |
  | **3. The "Gap" with Counterfactuals** | Indicatives and counterfactuals share the same semantic type (propositions); they differ only in the selection of the modal base (epistemic vs. metaphysical/temporal). | Indicatives and counterfactuals are different in kind; indicatives are epistemic probability shifts, while counterfactuals involve world-similarity metrics that indicatives lack. |
  | **4. Negation** | Negating a conditional ("It is not the case that if A, C") asserts the truth of the contradictory proposition. | Negating a conditional expresses the incoherence of the conditional belief; it does not assert a competing truth condition. |

  ## III. THEORETICAL CRUXES AND EMPIRICAL PREDICTIONS

  We identify two specific cruxes where the camps diverge on mechanism and prediction. We agree to test these using the cases below.

  ### Crux 1: The Independence/Relevance Condition
  **Issue:** Does high conditional probability alone suffice for acceptance, or is a causal/logical connection required?
  **The Case:** *The Irrelevance Case.*
  *   **Scenario:** Subjects are presented with a scenario where $P(C)$ is near 1 and independent of $A$.
      *   *Stimulus:* "If the stock market crashed yesterday, 2+2=4." (Or a contingent version: "If it rained in London yesterday, the coin in my pocket is copper," where both are independently highly probable).
  *   **TC Prediction:** Subjects will judge the sentence as **True** (or truth-apt) but **Unassertable**. Rejection of the sentence is due to pragmatic violation (Gricean relevance), not semantic falsity.
  *   **NTC Prediction:**
      *   *Strict Adams:* Subjects will judge the sentence as **Acceptable**.
      *   *Modified Adams (Concession):* If subjects reject the sentence, the NTC camp concedes that Adams' Thesis is necessary but not sufficient, requiring an independent relevance constraint added to the probabilistic account.
  *   **Falsification Condition:** If TC subjects consistently judge the sentence as *False* (rather than unassertable), TC is falsified. If NTC subjects consistently judge it *Acceptable* despite explicit irrelevance, NTC is supported (unless they adopt the Modified Adams concession).

  ### Crux 2: The Epistemic Continuum (Past Indicatives)
  **Issue:** Is the difference between an indicative and a counterfactual a difference of degree (evidence strength) or kind (semantic type)?
  **The Case:** *The Oswald Continuum.*
  *   **Scenario:** Subjects evaluate the sentence: "If Oswald didn't shoot Kennedy, someone else did."
  *   **Variable:** The amount of evidence available to the speaker is manipulated across three conditions:
      1.  *Partial Evidence:* Standard historical uncertainty.
      2.  *Near-Total Evidence:* Speaker has seen 99% of the footage, missing only the critical second.
      3.  *Total Evidence:* Speaker saw the entire event (making the antecedent known false or true).
  *   **TC Prediction:** Intuitions regarding the **truth value** of the indicative will remain stable across all three conditions. As evidence becomes total, the indicative smoothly transitions into a material conditional or factual claim. The gap between the indicative and the counterfactual ("If Oswald hadn't shot...") is maintained by the modal base, not by a collapse in semantic type.
  *   **NTC Prediction:** As evidence approaches Total (Condition 3), the **acceptability of the conditional form** will drop sharply in favor of a straight assertion ("Oswald did/didn't shoot"). The indicative is essentially a device for managing uncertainty; when uncertainty vanishes, the conditional form becomes infelicitous. The gap between indicative and counterfactual is a difference in kind; the counterfactual remains viable under total evidence, the indicative does not.
  *   **Falsification Condition:** If acceptability of the indicative remains high in the Total Evidence condition, NTC is challenged. If truth-value intuitions fluctuate wildly in the Partial Evidence condition, TC is challenged.

  ### Crux 3: Betting Behavior
  **Issue:** How are conditional bets resolved when the antecedent is false?
  **The Case:** *The Void Bet.*
  *   **Scenario:** A bet is placed on "If the coin lands Heads, it will be Copper." The coin lands Tails.
  *   **TC Prediction:** The bet is **Void**. Since the proposition expressed is not falsified (on standard variably strict accounts), no money changes hands.
  *   **NTC Prediction:** The bet is **Void** (agreement), *but* the *valuation* of the bet prior to the toss must align with $P(\text{Copper}|\text{Heads})$, not $P(\text{Heads} \land \text{Copper})$.
  *   **Measurement:** We measure the price subjects are willing to pay for the ticket *before* the toss.
  *   **Divergence:** TC must explain why the buy-price matches conditional probability if the payoff structure is different. NTC claims the buy-price *is* the semantic value.

  ## IV. VERBAL DISPUTE ANALYSIS

  We acknowledge that a portion of our disagreement stems from divergent definitions of "Has Truth Conditions." We stipulate the following distinction to isolate substantive disagreement from terminological variance:

  1.  **Propositionality (Minimalist):** "Expresses a proposition" means the sentence can serve as the argument for logical operators (negation, disjunction, quantification).
      *   *Status:* **Verbal.** Both camps can agree indicatives are propositional in this sense. NTC can model this via algebraic structures on belief states; TC via sets of worlds.
  2.  **Truth-Aptness (Robust):** "Has truth conditions" means the sentence has a determinate truth value independent of the speaker's epistemic state (i.e., it is true/false at a world regardless of what is known).
      *   *Status:* **Substantive.**
      *   **TC** asserts indicatives are Truth-Apt (Robust).
      *   **NTC** asserts indicatives are not Truth-Apt (Robust); they are only "acceptable" relative to a belief state.

  **Resolution for Collaboration:** In this document, the phrase "Has Truth Conditions" refers exclusively to **Truth-Aptness (Robust)**. Both sides agree that indicatives are Propositional (Minimalist). The dispute is strictly about whether the semantic value is a truth-condition (TC) or an acceptance-condition (NTC).

  ## V. COMMITMENT TO OUTCOMES

  *   If the **Irrelevance Case** shows subjects reject high-probability/low-relevance conditionals as *false* (not just odd), the **TC Camp** must revise their account of the material/strict conditional basis.
  *   If the **Irrelevance Case** shows subjects accept them, the **NTC Camp** is supported, provided they can explain why such sentences are rarely uttered.
  *   If the **Oswald Continuum** shows the indicative form becomes infelicitous under Total Evidence while the counterfactual remains felicitous, this supports the **NTC Camp's** claim that indicatives are essentially epistemic devices.
  *   If the **Oswald Continuum** shows the indicative remains felicitous and truth-evaluable under Total Evidence, this supports the **TC Camp's** claim that indicatives are world-based propositions.

  **Signed:**

  _________________________ (TC Representative)

  _________________________ (NTC Representative)

  _________________________ (Facilitator)
