  Two cases I want in the doc, and they should be runnable on people rather than just introspective. First, a continuum case: an indicative about the past where the speaker's evidence is nearly complete (something like "if Oswald didn't shoot him, someone else did" said by someone with near-total evidence about it), so the question is whether the gap between that and its counterfactual twin is just a difference in the modal base or a difference in kind — and each side should predict how the intutions shift as the evidence goes from partial to complete. Second, a case where the conditional probability is high but the antecedent looks irrelevant to the consequent (the "true, but so what" kind), where I expect the two accounts to come apart on acceptance; I want both sides' predictions, and if one side has to concede something here, say so. Also tell me which parts of the disagreement are verbal — I suspect "has truth conditions" is doing two seperate jobs (expresses a proposition vs. determinately true or false) and that each side needs a different one. Skip references, I just want the content.
