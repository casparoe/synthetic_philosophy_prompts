answer: |-
  You have reconstructed the argument remarkably well. You are not mangling the text; you are grappling with the exact tension that has fueled three centuries of debate. Your intuition that the Globes argument is doing the heavy metaphysical lifting while the Bucket provides the empirical hook is correct.

  Here is the untangling you asked for: a step-by-step breakdown of the logic, the load-bearing premises, the relationist counter-moves, and the distinction between absolute motion and absolute space.

  ### 1. Corrections to Your Paraphrase (The Bucket)

  Your account of the three stages is 90% there. The nuance you are missing in **Stage 3** is crucial for the logic.

  *   **Stage 1:** Bucket spins, water stationary. Relative motion: **High**. Surface: **Flat**. (Forces: Zero).
  *   **Stage 2:** Bucket spins, water spins. Relative motion: **Zero**. Surface: **Concave**. (Forces: Max).
  *   **Stage 3:** Bucket stops (or slows), water keeps spinning. Relative motion: **High** (again). Surface: **Concave** (but diminishing as water slows).

  **The Correction:** In Stage 3, Newton points out that as the water gradually loses its *true* motion (due to friction), the concavity decreases, even though the *relative* motion between water and bucket remains high (or increases, as the bucket stops completely while water still turns).
  **Why this matters:** It proves the dynamical effect (concavity) tracks **True Motion**, not Relative Motion. In Stage 1, high relative motion = no effect. In Stage 3, high relative motion = diminishing effect. The correlation is broken.

  ### 2. The Argument Step-by-Step

  Newton is arguing for two distinct claims: (A) Absolute Motion exists, and (B) Absolute Space exists. He argues for (A) first, then infers (B).

  #### Phase 1: The Bucket (Empirical Decoupling)
  *   **Premise 1:** True motion is distinguished from relative motion by the production of dynamical forces (specifically, the *endeavour to recede from the axis*, what we call centrifugal force).
  *   **Premise 2:** In the bucket experiment, the magnitude of these forces does not correlate with the magnitude of motion relative to the immediate container (the vessel).
  *   **Intermediate Conclusion:** Therefore, the cause of the forces is not motion relative to the vessel.
  *   **Load-bearing status:** **High.** This is the empirical anchor. If you deny that rotation produces intrinsic stress, the argument collapses.

  #### Phase 2: The Globes (Modal Isolation)
  *   **Premise 3:** One can conceive of a universe containing *only* the two globes and the cord, with no external bodies (no fixed stars, no air, no earth).
  *   **Premise 4:** In this empty universe, if the globes rotate, there will still be tension in the cord.
  *   **Premise 5:** If there are no external bodies, there can be no motion *relative to external bodies*.
  *   **Intermediate Conclusion:** Therefore, the tension (and the motion causing it) cannot be defined as a relation to external bodies.
  *   **Load-bearing status:** **Critical.** The Bucket only proves motion isn't relative to the *bucket*. The Globes prove motion isn't relative to *anything material*.

  #### Phase 3: The Inference to Space
  *   **Premise 6:** Motion must be a relation to *something*. (You cannot have a monadic property of "moving" without a frame of reference).
  *   **Premise 7:** Since it is not a relation to material bodies (proven by Globes), it must be a relation to a non-material framework.
  *   **Conclusion:** This framework is Absolute Space.
  *   **Load-bearing status:** **Vulnerable.** This is where the inference type shifts from empirical to metaphysical.

  ### 3. Inference to the Best Explanation vs. Stipulation

  You asked where he is stipulating and where he is explaining.

  *   **Stipulation:** The *Definitions*. Newton explicitly says, "I do not define time, space, place, and motion, as they are well known to all." He is stipulating how he will *use* the terms "Absolute" and "Relative." He is effectively saying, "When I say 'True Motion' from now on, I mean the kind that causes forces."
  *   **Inference to the Best Explanation (IBE):** The *Scholium* arguments. He observes a phenomenon (tension/concavity) and asks, "What explains this?"
      *   *Hypothesis A (Relationism):* It is caused by motion relative to bodies.
      *   *Hypothesis B (Absolutism):* It is caused by motion relative to space.
      *   *Verdict:* He argues A fails (via the Globes thought experiment), so B is the best explanation.

  ### 4. The "Smart Relationist" Objection (Mach's Principle)

  You asked: *Is there a standard name for the objection I'm groping toward?*
  **Yes.** It is **Mach's Principle** (or the Relationist Critique). Ernst Mach, in *The Science of Mechanics* (1883), articulated exactly the worry you have.

  **The Objection:**
  Mach agrees with Newton that the bucket water curves. He disagrees on *why*.
  *   **Newton:** The water curves because it rotates relative to Absolute Space.
  *   **Mach:** The water curves because it rotates relative to the **fixed stars** (the total mass distribution of the universe).

  **How Mach survives the Globes Argument:**
  Mach argues that Newton's "empty universe" thought experiment is physically incoherent. You cannot simply "take away" the fixed stars and assume the laws of physics (inertia) remain the same. Inertia itself, Mach argues, is a result of the interaction between a body and the rest of the mass in the universe.
  *   **Reply to Globes:** If there were no other bodies in the universe, there would be no inertia, and thus no tension in the cord. The tension *is* the relation to the distant mass.
  *   **Reply to Bucket:** The water knows it is spinning because it is spinning relative to the gravitational field of the fixed stars, not an invisible container called Space.

  **Does Newton shut this door?**
  Newton anticipates this slightly. He acknowledges we use the fixed stars to *measure* absolute motion, but insists they do not *define* it. He argues that if the heavens were to rotate around a stationary earth, the forces would be different than if the earth rotated.
  *   **Verdict:** Newton does **not** logically refute Mach. He asserts that Absolute Space is the *cause* of inertia, whereas Mach asserts the mass of the universe is the *cause*. Newton's argument rests on the intuition that the "empty universe" scenario is conceivable and would still obey the same laws. Mach denies that intuition.

  ### 5. Absolute Motion vs. Absolute Space (The Crucial Distinction)

  You asked: *If I grant him everything about motion, how much does he get about space?*

  This is the sharpest philosophical point in your query. **Granting Absolute Motion does not logically entail Substantival Space.**

  *   **Absolute Motion (Inertial Structure):** The Bucket and Globes successfully demonstrate that there is a fact of the matter about acceleration (rotation is a form of acceleration) that is not reducible to relations between bodies. There is a privileged class of reference frames (inertial frames).
  *   **Absolute Space (Substantivalism):** This is the claim that there exists a "thing" (a container) that persists through time, has parts, and exists independently of bodies.

  **The Gap:**
  You can have absolute acceleration without absolute space. This is the view of **Neo-Newtonian Spacetime** (or Galilean Spacetime).
  *   In this view, space is not a "thing" with a unique location for every point. It is a structure (an affine connection) that tells you which paths are straight and which are curved.
  *   Newton infers the "thing" (Space) because of his theological and metaphysical commitments (Space is the "sensorium of God," it is eternal, immutable).
  *   **Philosophical Consensus:** The Bucket/Globes arguments prove **Absolute Acceleration**. They do **not** prove **Absolute Position** (Substantival Space). You can be a relationist about *position* (there is no fact of the matter where the universe is located) while being an absolutist about *acceleration* (there is a fact of the matter if it is spinning).

  **So, to answer your specific question:** The Globes case lands you in a non-relational notion of rotation (absolute acceleration). It does *not* force you into substantivalism (Space as a thing in its own right) unless you add the extra premise that "all relations must be relations to *something* substantial." A modern structuralist denies that premise.

  ### 6. Summary of Load-Bearing vs. Decoration

  *   **Load-Bearing:**
      1.  The claim that dynamical forces (centrifugal) are the sole mark of true motion.
      2.  The claim that these forces would exist in a universe devoid of other bodies (The Globes).
      3.  The inference that motion requires a reference frame.
  *   **Decoration:**
      1.  The specific mechanics of the cord twisting (irrelevant detail).
      2.  The discussion of how we *measure* absolute motion using the fixed stars (this is epistemological, not ontological).
      3.  The theological implications (God's sensorium) — these motivate Newton but aren't part of the mechanical proof.

  ### 7. Final Verdict on Your Worry

  You are not inventing a worry. You have identified the exact fault line where Newtonian physics cracked open into General Relativity.

  1.  **Does the argument refute "smart" relationism?** No. It refutes *local* relationism (motion relative to the bucket) and *material* relationism (motion relative to the stars), but only by assuming inertia is intrinsic to the body/space relation rather than induced by the mass of the universe. Mach showed this assumption is contestable.
  2.  **Does Absolute Motion imply Absolute Space?** No. It implies an absolute *structure* of spacetime (distinguishing inertial from non-inertial paths), but not necessarily a substantival *container* with unique positions.
  3.  **What survives?** The distinction between inertial and non-inertial frames survives (essential for all classical physics). The existence of Space as a "substance" independent of bodies is the part that most modern philosophers and physicists discard, even while accepting Newton's conclusion about rotation.

  **Recommendation for your group:** Focus the discussion on whether the "empty universe" thought experiment is a valid modal claim. If the relationist can argue that inertia *depends* on the presence of other mass, the Globes argument fails to prove Absolute Space, even if it proves Absolute Rotation.
