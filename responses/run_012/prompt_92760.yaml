answer: |-
  ### Thinking Out Loud: Load-Bearing vs. Decorative

  Before we build the checklist, we need to strip the paint off the crane/skyhook distinction. The decorative part is the imagery of construction and the moralizing tone (skyhooks are "cheating," cranes are "virtuous"). That's useless for a reviewer. The load-bearing part is **independent constraint**.

  A skyhook is a variable in your model that is only constrained by the data it is supposed to explain. It moves exactly as much as the phenomenon moves. If you remove the phenomenon, the mechanism loses its definition. A crane is a variable constrained by *other* things—prior data, structural limits, independent measurements. It has traction outside the specific explanatory job you're hiring it for.

  The "promissory note" problem you're facing is actually a problem of **specification**. A promissory crane says, "We know this part needs to exist, here are its boundary conditions, and here is how we will measure it independently." A skyhook says, "This part exists because the output exists." The operationalization must test for independent definition, not just future promise.

  Greedy reductionism is slightly different; it's a category error regarding **levels of organization**. It claims that because the substrate is sufficient for causality, the functional level is explanatorily redundant. The test there isn't about independent constraint, but about **informational loss**. Does the lower-level description preserve the counterfactuals of the higher level?

  Okay, let's build the tool.

  ***

  ### The 40-Minute Crane/Skyhook Protocol

  **Preparation (5 mins):**
  Take a highlighter. Mark the **Explanandum (E)** (the thing being explained) and the **Proposed Mechanism (M)** (the thing doing the explaining). If you can't find a clear M, stop. The paper is descriptive, not mechanistic.

  #### Step 1: The Independence Test (10 mins)
  **Question:** Can I define M without referencing E?
  *   **Sufficient Answer:** The text provides operational criteria, parameters, or structural definitions for M that are established *before* E is introduced, or via data distinct from E. (e.g., "We define the 'inhibition module' by its latency profile in Task A, then apply it to Task B.")
  *   **Evasion:** M is defined by its success at producing E. (e.g., "The system activates the 'object permanence module' when the infant looks longer at the impossible event.")
  *   **Stop Condition:** If M is defined *only* by its success at producing E, flag as **Skyhook**. Do not proceed.

  #### Step 2: The Traction Test (10 mins)
  **Question:** Does M do work elsewhere, or is it a specialized ghost?
  *   **Sufficient Answer:** The authors cite prior uses of M, or show that M constrains other behaviors/phenomena besides E. M has "friction."
  *   **Evasion:** "This mechanism is specific to this task." (Unless heavily justified by modularity arguments). Or, M is a homunculus (e.g., "a little man inside who knows objects").
  *   **Stop Condition:** If M has no traction outside E and is complex enough to require its own explanation, flag as **Skyhook**.

  #### Step 3: The Level Check (Greedy Reductionism) (10 mins)
  **Question:** Does the explanation skip the functional organization level?
  *   **Sufficient Answer:** The paper acknowledges the intermediate level (concepts, norms, representations) and shows how M implements or realizes it.
  *   **Evasion:** The paper asserts E is "nothing but" M (where M is lower-level, e.g., dopamine spikes) and dismisses the intermediate level as "folk psychology" or "epiphenomenal" without showing how the intermediate patterns emerge from M.
  *   **Stop Condition:** If the intermediate level is dismissed rather than derived, flag as **Greedy Reductionism**.

  #### Step 4: The Promissory Assessment (5 mins)
  **Question:** If M is underspecified, is it a blueprint or a wish?
  *   **Sufficient Answer (Promissory Crane):** The authors list specific constraints M *must* satisfy, admit they haven't measured them yet, and propose a concrete method to measure M independently of E in future work.
  *   **Evasion (Skyhook in disguise):** The authors say "future work will elucidate the mechanism" without specifying what would count as evidence against it.
  *   **Hand-Off Point:** If it passes Step 1 (Independence) but fails on empirical backing (i.e., it's a theoretical crane), you must hand this to the editor/senior author. Your note should read: *"This functions as a promissory crane. It is structurally valid but empirically unbacked. Acceptance depends on whether the field is willing to credit the theoretical constraint."* This is a sociological judgment, not a textual one.

  ***

  ### Sentence-Level Stress Tests

  Use these when you are skimming and hit a suspicious claim.

  **1. The "X is just Y" Test (Reductionism Check)**
  *   *Sentence:* "Moral condemnation is just reward learning over social feedback."
  *   *The Test:* Remove X. Does Y still predict the specific shape of X?
  *   *Application:* If you remove "moral condemnation" and just look at "reward learning," do you get *punishment* specifically? Or do you get avoidance? If reward learning predicts avoidance but the phenomenon is *normative outrage*, the "just" is doing illicit work. It's erasing the difference between "I don't like this" and "This is wrong."
  *   *Verdict:* If Y cannot distinguish X from a close neighbor without smuggling X back in, it's greedy reductionism.

  **2. The "Represents/Computes/Infers" Test (Skyhook Check)**
  *   *Sentence:* "The infant represents the object as continuing to exist."
  *   *The Test:* Is the content (Z) recoverable from the vehicle, or imposed by the observer?
  *   *Application:* Look at the mechanism described. Does the neural/activity pattern have structure isomorphic to "object continuity"? Or did the author *interpret* the activity as representing continuity because the baby looked surprised?
  *   *Verdict:* If the "representation" is only visible from the outside (the experimenter's view) and not the inside (the system's causal structure), it's a skyhook. You've labeled the gap, not filled it.

  ***

  ### Running the Procedure on Your Cases

  #### Case 1: Infant Core Object-Representation System
  *   **Explanandum (E):** Infants look longer at impossible object events (e.g., occluded object vanishing).
  *   **Proposed Mechanism (M):** Innate core object-representation system.
  *   **Step 1 (Independence):** *Fail.* How is the "core system" defined? Usually by the fact that infants look longer. The mechanism is inferred solely from the behavior it explains.
  *   **Step 2 (Traction):** *Fail.* Does this system do anything else? Often papers claim it's domain-specific. If it's only active for object permanence, it's a module built for this one trick.
  *   **Step 4 (Promissory):** Is there a blueprint? Usually no. It's posited as a brute fact of nativism.
  *   **Verdict:** **Skyhook.**
  *   **Review Comment:** "The 'core system' is defined entirely by the looking-time data it is meant to explain. There is no independent characterization of the system's limits or structure. This posits a homunculus ('the thing that knows objects') rather than a mechanism. To convert this to a crane, you need constraints on this system derived from non-object tasks or neural data independent of the looking-time measure."

  #### Case 2: Moral Condemnation as "Just" Reward Learning
  *   **Explanandum (E):** Adult moral condemnation (normative outrage, punishment).
  *   **Proposed Mechanism (M):** Reward learning over social feedback (dopaminergic prediction errors).
  *   **Step 3 (Level Check):** *Fail.* The paper jumps from "social feedback" to "moral condemnation." It skips the level of *norms*. Reward learning explains "I expect bad things if I do this." Moral condemnation explains "This is prohibited regardless of my outcome."
  *   **Sentence Test:** Remove "moral condemnation." Does "reward learning" predict *third-party* punishment (where I pay a cost to punish you)? Standard reward learning predicts self-benefit. To get third-party punishment, you have to smuggle "norms" back into the reward function.
  *   **Verdict:** **Greedy Reductionism.**
  *   **Review Comment:** "This explanation collapses the functional level of normative reasoning into the substrate of reinforcement learning. It fails to account for the counterfactuals specific to morality (e.g., third-party punishment, justification) that do not map 1:1 onto individual reward prediction errors. The word 'just' is doing excessive work here; you are erasing the phenomenon rather than explaining it."

  #### Case 3: Your Chapter (Cumulative Cultural Evolution)
  *   **Explanandum (E):** Transmission of tool-making technique across generations (improvement/stability).
  *   **Proposed Mechanism (M):** Cumulative cultural evolution (CCE).
  *   **Step 1 (Independence):** *Struggle.* How do you define CCE in the text? If you define it as "transmission with modification that leads to improvement," you are defining M by E.
  *   **Step 2 (Traction):** *Maybe.* Does CCE do work elsewhere? Yes, in other cultural domains. *However*, in your chapter, is it acting as a mechanism or a label?
  *   **The Hard Truth:** "Cumulative cultural evolution" is often a **phenomenon**, not a mechanism. It is the *thing to be explained* (how culture accumulates), not the *thing doing the explaining* (how the transmission happens).
  *   **Step 1 Re-eval:** If you say "The technique persisted *because of* cumulative cultural evolution," you are saying "It persisted because it persisted culturally."
  *   **Step 4 (Promissory):** Did you specify the *transmission mechanisms* (imitation, emulation, teaching, language)? Or did you use CCE as the bucket?
  *   **Verdict:** **Skyhook (disguised as a framework).**
  *   **Review Comment (Self-Critique):** "I invoke 'cumulative cultural evolution' as the explanatory engine, but CCE is the aggregate outcome, not the transmission mechanism. I have not specified the cognitive or social processes (the cranes) that allow the accumulation (e.g., high-fidelity copying, ratcheting mechanisms). I am using the label of the field to stand in for the mechanistic details of transmission. I need to replace 'CCE' with the specific learning biases or social structures that *produce* CCE in this context."

  ***

  ### Where This Procedure Will Misfire

  You asked for honesty about the failure modes. Here is where this checklist will lie to you.

  **1. False Positives (Flagging real Cranes as Skyhooks):**
  *   **The Novel Mechanism Problem:** If a paper proposes a genuinely new neural circuit or computational principle that *only* explains this phenomenon (because it's new), it will fail the **Traction Test**. Early papers on place cells might have looked like skyhooks because "spatial mapping" wasn't an established independent variable yet.
  *   **The Abstract Mechanism Problem:** In comp-neuro, sometimes the mechanism is a mathematical constraint (e.g., "efficient coding"). This doesn't have "parts" in the biological sense. The Independence Test might flag this as circular if the efficiency metric is derived from the data itself.
  *   **Mitigation:** If the authors explicitly frame M as a *hypothesis* to be tested (not an established fact), and the math is internally consistent, lean toward "Promissory Crane" even if Traction is low.

  **2. False Negatives (Letting Skyhooks through):**
  *   **The Complex Clothing Problem:** A skyhook can wear a crane's uniform. If an author builds a complex neural network model that fits the data perfectly, but the architecture was hand-tuned *only* to fit that data, it passes the **Independence Test** textually (the architecture is described in detail) but is actually a skyhook (it has no generalizability). The procedure relies on text, so it can't see overfitting unless the authors confess to it.
  *   **The "Black Box" Crane:** Sometimes a mechanism is real but opaque (e.g., "a genetic cascade"). If the text says "Gene X regulates Y" and cites a database, it passes Independence. But if Gene X's function is actually unknown and just labeled "regulator," it's a skyhook. The procedure trusts citations too much.
  *   **Mitigation:** This is where your **Hand-Off Point** is crucial. If the mechanism is complex but the independent validation is purely citation-based without re-analysis, flag it for the senior author to check the citations' robustness.

  **Final Advice:**
  The procedure works best on *logic*, not *truth*. It tells you if the argument holds together, not if the world is actually that way. Use it to clean up the reasoning. Let the data (which you can't see) and the field norms (which the editor knows) handle the truth.
