  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** 3rd-year PhD student in cognitive science/comp-neuro. Thesis on mechanistic explanation in systems neuroscience.
      *   **Task:** Create a decision procedure (approx. 40 mins) to distinguish Dennett's "cranes" vs. "skyhooks" and identify "greedy reductionism" in papers/drafts.
      *   **Constraints:**
          *   Must distinguish *promissory cranes* (honest future work) from *skyhooks* (explanatory gaps disguised as mechanisms).
          *   User is not the final decider (writes reviews/comments).
          *   No data access (text/figures only).
          *   No reading list/citations (work from ideas).
          *   Must include: Ordered questions, sufficient answers vs. evasions, stop conditions, hand-off points (judgment calls), sentence-level tests.
          *   Must apply to three specific cases (Infant core knowledge, Moral condemnation reductionism, User's own chapter on cumulative culture).
          *   Tone: Philosopher of science, annoyed by rhetorical misuse of labels, honest about limitations.
          *   Intro: "Thinking out loud" about load-bearing vs. decorative parts of the distinction.
          *   Outro: Explicit failure modes (false positives/negatives).

  2.  **Deconstruct the Concepts (Thinking Out Loud):**
      *   *Skyhook:* A miracle. It explains $X$ by positing $Y$, where $Y$ requires $X$ to exist in the first place, or $Y$ is just as mysterious as $X$. It lifts without a base.
      *   *Crane:* A mechanism. It explains $X$ by positing $Y$, where $Y$ is less mysterious/better understood than $X$, and there's a plausible path from base to $Y$ to $X$.
      *   *Greedy Reductionism:* Skipping levels. Saying $X$ is *nothing but* $Z$ (low level) without showing how the functional organization at the intermediate level emerges.
      *   *Promissory Note:* "We know $Y$ is needed, we haven't built it yet, but here's the blueprint." vs. "Here is $Y$ (but it's actually just a label for $X$)."
      *   *Load-bearing:* The core is *independent support*. Does the proposed mechanism have traction *outside* the phenomenon it's explaining? Can it be defined without referencing the outcome?
      *   *Decorative:* The specific metaphors (lifting, building). The history of the terms. The moral weight (skyhooks are "bad"). Focus on the structural role in the argument.
      *   *Operationalization:* I need to turn "independent support" into text-based checks. Can I find the definition of the mechanism *before* the result is introduced? Is the mechanism constrained by data *other* than the target phenomenon?

  3.  **Drafting the Decision Procedure:**
      *   *Time limit:* 40 mins. Needs to be fast.
      *   *Step 1: Isolation.* Identify the Explanandum (E) and the Explanans (M).
      *   *Step 2: Independence Check.* Is M defined independently of E? (The "Circularity" test).
      *   *Step 3: Traction Check.* Does M do work elsewhere? (The "Exportability" test).
      *   *Step 4: Level Check.* (For greedy reductionism). Are intermediate functional levels skipped?
      *   *Step 5: Promissory Assessment.* If M is underspecified, is there a concrete research program attached?
      *   *Hand-off:* When does it become a field-norm judgment? When the "traction" is theoretical rather than empirical.

  4.  **Drafting the Sentence Tests:**
      *   *The "Just" Sentence:* "X is just Y." Test: Does Y have predictive power *without* knowing X?
      *   *The "Represents/Computes" Sentence:* "System represents Z." Test: Is Z recoverable from the mechanism's structure, or is it imposed by the observer? (Use/mention distinction).

  5.  **Applying to Cases:**
      *   *Case 1 (Infants/Core Knowledge):* Classic nativism. Is "core object system" a skyhook? It often is if it's just "they know objects, so they have an object module."
      *   *Case 2 (Moral/Reductionism):* "Moral condemnation is just reward learning." Greedy reductionism. Skips norms/concepts.
      *   *Case 3 (User's Chapter/Cumulative Culture):* "Cumulative cultural evolution." This is the "hurt" case. Often, "culture" is used as a bucket for "stuff we don't understand yet." If the mechanism of transmission isn't specified, it's a skyhook labeled as a crane.

  6.  **Refining the Tone:**
      *   Needs to be collegial but sharp. "Annoyed philosopher" persona.
      *   Avoid jargon where possible, but the user is a PhD student, so technical precision is expected.
      *   Acknowledge the user's specific struggle (waving labels vs. letting relabeling through).

  7.  **Addressing Failure Modes:**
      *   False Positives: Novel mechanisms that *look* like skyhooks because they are new (e.g., early DNA).
      *   False Negatives: Sophisticated skyhooks that wear crane clothing (e.g., complex models fitted *only* to the target data).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions yes/no/maybe with specific textual evidence requirements.
      *   *Critique:* Did I address the "promissory" constraint?
      *   *Fix:* Ensure Step 5 explicitly differentiates "we will build this" (with specs) vs. "this exists" (without specs).
      *   *Critique:* Is the "hurt" case honest?
      *   *Fix:* Don't be mean, but be rigorous. "Cumulative cultural evolution" is often a placeholder for "social learning + time." If the *cumulative* part isn't mechanized, it's a skyhook.

  9.  **Final Polish:** Check against all 5 constraints in the prompt.
      *   (1) Questions in order? Yes.
      *   (2) Sufficient answer vs. evasion? Yes.
      *   (3) Stop condition? Yes.
      *   (4) Hand-off point? Yes.
      *   (5) Sentence tests? Yes.
      *   Three cases run? Yes.
      *   Thinking out loud intro? Yes.
      *   Failure modes outro? Yes.

