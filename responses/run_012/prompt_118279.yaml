answer: |-
  **Brainstorming & Working**

  *   **Core Mechanism:** Standard rational choice says $EV = P(\text{pivotal}) \times \text{Benefit} - \text{Cost}$. Self-interest makes Benefit constant ($b$). Altruism makes Benefit proportional to population ($N \cdot b$).
  *   **Pivotal Probability:** For $N$ voters, if others are independent coin flips ($p=0.5$), $P(\text{tie}) \approx \sqrt{\frac{2}{\pi N}}$. This is the $1/\sqrt{N}$ scaling.
  *   **Combined:** $EV \approx \sqrt{\frac{2}{\pi N}} \times (N \cdot b) = b \sqrt{\frac{2N}{\pi}}$. This scales as $\sqrt{N}$.
  *   **Critical Assumption:** The $p=0.5$ assumption is epistemic. It requires the voter to be maximally uncertain about the margin, not that the election is objectively determined to be close. If the voter believes one side leads by fixed percentage $\epsilon$, $P(\text{tie})$ drops exponentially ($e^{-cN}$), killing the $\sqrt{N}$ gain.
  *   **Objections:**
      *   *Generalization:* If everyone votes based on this, does $p$ shift? In Causal Decision Theory (CDT), I treat others' probabilities as fixed inputs. Their reasoning doesn't causally depend on my calculation in the model.
      *   *Credence:* Real voters don't assign $1/\sqrt{N}$ to ties. The argument prescribes rational credence under ignorance (Principle of Indifference), not descriptive psychology.
      *   *Moral:* Totalism is controversial. The result is conditional on accepting totalist welfare aggregation.
      *   *Fragility:* Correlated voters (blocks) reduce effective $N$. Safe seats (biased $p$) destroy the probability term.
  *   **Conclusion:** The paradox inverts *only* under specific epistemic and moral conditions. It is not a universal proof for voting, but a proof that the standard paradox relies on hidden selfishness and pessimistic priors.

  ***

  **The Altruistic Inversion of the Voting Paradox**

  To evaluate the instrumental rationality of voting, we must define the agent's utility function and their probabilistic model of the election. The standard paradox arises because standard models assume a self-interested voter facing an exponentially diminishing probability of pivotality. We replace the self-interest assumption with totalist altruism: the voter values the welfare of every citizen in the electorate equally. If the preferred policy yields a per-capita benefit $b$ over the alternative, the total social stake is $\mathcal{B} = N \cdot b$, where $N$ is the size of the affected population. This linear scaling of stakes is the first engine of our result.

  The second engine is the probability of being pivotal. In a two-candidate election with $N$ voters, your vote matters only if the other $N-1$ voters split evenly. If you model these other voters as independent Bernoulli trials with probability $p=0.5$ for each candidate, the probability of a tie is given by the binomial distribution centered at zero. Using Stirling's approximation, this probability scales as $P(\text{tie}) \approx \sqrt{\frac{2}{\pi N}}$. This is the familiar $1/\sqrt{N}$ decay. However, when we calculate the expected instrumental value ($EV$), we multiply the probability of pivotality by the total stakes: $EV \approx \sqrt{\frac{2}{\pi N}} \times (N \cdot b)$. The $N$ in the numerator and the $\sqrt{N}$ in the denominator do not cancel; rather, the $N$ dominates. The expected value simplifies to $b \sqrt{\frac{2N}{\pi}}$. Consequently, the instrumental value of voting grows proportional to the square root of the electorate size. Under these specific conditions, a national election is not less worth the cost than a local one; it is mathematically more significant.

  This result hinges entirely on the epistemic assumption that the election is "close" in the specific sense that your credence distribution over the margin is centered at zero with variance proportional to $N$. This addresses the objection that real voters know elections aren't actually coin flips. The argument does not require the election to be objectively close, but rather that the voter lacks sufficient information to rule out a tie. If a voter assigns a fixed bias $\epsilon$ to one candidate (a "safe state" prior), the probability of a tie decays exponentially, roughly as $e^{-cN}$, which overwhelms the linear growth of the stakes. Thus, the $\sqrt{N}$ gain is not a universal feature of altruism but a feature of altruism combined with epistemic humility regarding the margin.

  We must also address the generalization objection: if everyone reasons this way, won't turnout change the probabilities? This argument operates within Causal Decision Theory, where you treat the probabilities of other voters' actions as fixed parameters independent of your own choice. Your reasoning does not causally influence their turnout in the model; it only influences your own. Therefore, the calculation holds for the individual agent even if everyone else uses similar logic, provided their logic leads them to the same probabilistic model of the aggregate. Furthermore, regarding the moral commitment, this is not a hidden premise but an explicit constraint. The result shows that the standard paradox is not a failure of decision theory, but a consequence of modeling voters as selfish atoms. If you accept totalist welfare, the decision-theoretic pressure to vote increases with scale.

  Finally, consider the objection that this is a knife-edge artifact of a two-option, independent-voter model. This is partially correct. If voter preferences are highly correlated—for example, if voters act in blocs or families—the effective number of independent trials drops, reducing the pivotal probability below the $1/\sqrt{N}$ benchmark. Similarly, in multi-candidate races, the probability of a specific tie configuration diminishes faster. However, these are empirical constraints on the model's applicability, not refutations of the arithmetic. The core insight remains: the standard claim that voting is irrational in large electorates relies on the stakes being constant. Once stakes scale with population, the diminishing probability of pivotality is insufficient to drive expected value to zero, provided the voter maintains a non-dogmatic prior on the election margin.

  **Where It Breaks**

  1.  **Safe Seats:** If your prior believes the margin exceeds roughly $1/\sqrt{N}$, the pivotal probability drops exponentially, and expected value collapses regardless of altruism.
  2.  **Correlated Voters:** If voters are not independent (e.g., strong partisan sorting), the effective $N$ is much smaller than the population, reducing pivotality faster than stakes grow.
  3.  **Non-Totalist Values:** If the voter discounts the welfare of distant others or values expressive benefits over outcomes, the $N$-scaling of stakes disappears.
  4.  **Multi-Candidate Races:** With more than two viable options, the probability of a precise tie involving your vote becomes significantly more complex and generally smaller.

  \answer{Under totalist altruism and high uncertainty about the margin, the expected instrumental value of voting grows with the electorate size, inverting the standard paradox.}
