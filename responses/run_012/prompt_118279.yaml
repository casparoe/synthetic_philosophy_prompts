  Act as a decision theorist with a decent grounding in political philosophy, and think this through carefully — start with a short brainstorm of your own before you commit to anything, so I can see the working.

  Context: I run a small reading group, mix of philosophy and econ people, and next month is the 'why bother voting' paradox — the rational choice one, where your single vote is so unlikely to be decisive that it can't be worth the cost of turning up. Not the Condorcet cycling-majorities thing that unfortunately also gets called the paradox of voting. I already know the standard escape routes — expressive benefits, warm glow, civic duty, minimax regret, rule-consequentialism, be-the-kind-of-person-who-votes — and I dont want a tour of them, so please leave them mostly alone. Heres the line I actually want you to argue for.

  Set the voter up as a totalist altruist: they care about the outcome for everyone in the electorate equally, not just about themselves. Add the modelling assumption that the election is expected to be close in the specific sense that, from this voter's point of view, the other N-1 voters' choices look roughly like independent coin flips, so the probability of a tie is small but only falls off like 1/sqrt(N) as N grows. Under those assumptions I think the expected instrumental value of this person's vote doesn't shrink with the size of the electorate — it grows, roughly like sqrt(N), because the pivotality probability falls like 1/sqrt(N) while the stakes of getting the policy right, valued totalistically, rise like N. Which would mean the familiar 'it can't be worth it in a big electorate' claim is an artifact of modelling the voter as self-interested, and that under a plausible altruism assumption the paradox inverts: bigger electorate, more reason to vote.

  Your job is to make that argument as strong and as precise as it can be. Some things I want from you specifically:

  - Do the arithmetic honestly, including what the constant out front actually depends on.
  - Say exactly which assumptions the conclusion hangs on, and what happens when you swap the close-election assumption for a safe-state one (large expected margin) or for preferences that are correlated across voters rather than independent. If the conclusion dies in those cases, say so plainly.
  - Anticipate and answer the obvious objections: the 'if everyone reasoned like this' generalization objection; the objection that a real voter's credence that the election is close is much lower than the model's tie probability, so the result is about the model and not about anyone's actual reasons; the objection that totalist altruism is a controversial moral commitment being smuggled into what looks like a decision-theoretic result; and the objection that the sqrt(N) growth is a knife-edge artifact of a two-option model with turnout near 50/50, and won't survive more options, asymmetric support, or a district map full of safe seats.
  - Be honest about how far the argument goes even if it works: what it shows about voting as an instrumental act, and what it doesn't.

  Keep it tight and self-contained — no citations, no 'scholars have argued that', no reading list; I genuinely don't need them and couldn't check them anyway. Prose rather than bullet points for the main argument, with a short 'where it breaks' section at the end of it.

  Finish with one final line, exactly in this form: \answer{...} where the braces contain the thesis of your argument in a single sentence of no more than 25 words.
