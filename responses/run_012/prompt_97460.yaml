          1.  **The Reading (Weil's Radicalism):** Confirm she is indeed anti-liberal democracy. Clarify the "collective vs. impersonal" distinction.
          2.  **The Democracy Move:** Validate the dilemma. Warn against ignoring her specific alternative (councils/rootedness).
          3.  **Epistemic Monopoly:** Refine the term. Connect it to "Attention."
          4.  **The Scaling Problem:** Confirm this is the kill shot.
          5.  **Drafting Advice:** Specific suggestions on how to frame the argument.

  7.  **Refining the "Anti-Democratic" Charge:**
      *   Weil isn't anti-*people*, she's anti-*will*. Democracy is often defined as the rule of the "general will." Weil thinks the "general will" is a fiction (Rousseau critique). She wants rule by *truth*. This is technically aristocratic or theocratic, not democratic.
      *   *Advice:* Don't just say "anti-democratic." Say "anti-voluntarist." Democracy aggregates wills; Weil wants to discern truth. These are incompatible foundations.

