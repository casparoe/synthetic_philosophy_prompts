answer: |-
  This is a splendid problem. It sits right at the intersection of your old trade (deep time, physical constraints) and your new one (epistemology, the logic of science). Your friend is wielding a proverb like a hammer, but as you've sensed, it's a hammer with five different heads, only one of which might actually drive the nail he thinks it's driving.

  Karl Popper's argument against historicism (specifically in *The Poverty of Historicism*) rests on a logical syllogism:
  1.  Human history is strongly influenced by the growth of human knowledge.
  2.  We cannot predict, by rational or scientific methods, the future growth of our scientific knowledge.
  3.  Therefore, we cannot predict the future course of human history.

  For your friend's slogan ("nothing new under the sun") to defeat this, it must attack premise #1 or #2. It must show either that knowledge doesn't actually change the trajectory of history, or that "new" knowledge is an illusion.

  Here is the menu of interpretations, ordered from the geologically trivial to the metaphysically radical.

  ### 1. The Biological Constancy Claim
  **The Assertion:** *Homo sapiens* has not biologically evolved in the last 5,000 years. Our hardware (brains, hormones, instincts) is identical to that of the Babylonians. Therefore, the *motivations* driving history are constant.
  *   **Status:** **Scientific Platitude.** As a geologist, you know the timescale of recorded history is a blink. Biologically, he is right. We are still driven by fear, greed, tribalism, and love.
  *   **Does it block Popper?** **No.**
      *   *Why:* Knowing the *motives* are the same does not allow you to predict the *outcome*. A Babylonian king and a modern dictator may share the same desire for power, but the dictator has nuclear weapons and the internet. The *variables* in the equation have changed, even if the *constants* (human nature) have not. Popper agrees human nature might be constant; he argues the *situation* changes unpredictably due to knowledge.

  ### 2. The Structural Recurrence Claim
  **The Assertion:** Social systems operate like ecosystems. They undergo birth, growth, decay, and death. Empires rise and fall; revolutions eat their children; bubbles burst. The specific actors change, but the *shapes* of events are finite and repeating.
  *   **Status:** **Substantive and Defensible (with limits).** This is the historian's bread and butter. There are morphological similarities between the fall of Rome and the decline of the Bronze Age. It is a useful heuristic for understanding risk and stability.
  *   **Does it block Popper?** **No.**
      *   *Why:* This is an argument from analogy, not law. Popper's critique of historicism is precisely that identifying a *pattern* in the past does not constitute a *law* for the future. To say "empires always fall" is not to predict *when*, *how*, or *what replaces them*. It offers a rhythm, not a script. It cannot account for the discontinuity introduced by new technology (e.g., the printing press or the bomb), which changes the "ecology" itself.

  ### 3. The Combinatorial Claim
  **The Assertion:** There are no truly new ideas, only new arrangements of old ones. Every philosophical or scientific "discovery" is merely a recombination of pre-existing concepts. The library of possible thoughts is finite; we are just pulling different books off the shelf.
  *   **Status:** **Debatable/Philosophical.** This leans on a Platonic view that truth is discovered, not created. It is defensible in art and literature, but shaky in science.
  *   **Does it block Popper?** **Weakly, but fails on impact.**
      *   *Why:* Even if you grant that Newton's calculus was just a "recombination" of existing math, the *consequences* of that recombination were not latent in the components. You cannot predict the Industrial Revolution by analyzing the components of calculus in 1680. The *effect* of the knowledge is novel, even if the *ingredients* were not. This fails to save your friend's determinism because the *impact* of the rearrangement remains unpredictable.

  ### 4. The Causal Determinism Claim
  **The Assertion:** The universe is a closed causal system. Every event is the inevitable result of antecedent conditions. If we knew the position and momentum of every particle (including neurons) at Time A, we could calculate Time B. "New" knowledge was always going to be discovered at the exact moment it was.
  *   **Status:** **Metaphysical Dogma.** This is Laplace's Demon. It is unfalsifiable. You cannot prove it false, but you cannot prove it true. It is a faith position, not a scientific one.
  *   **Does it block Popper?** **Yes, but at a high cost.**
      *   *Why:* This is the only claim that actually defeats Popper's argument, because it denies premise #2. It asserts that the growth of knowledge *is* predictable in principle, even if we lack the computing power to do it. However, to assert this is to step outside of science and into metaphysics. Popper would argue this is "pseudorationalism." If your friend takes this stance, he is no longer arguing as a historian using evidence; he is arguing as a theologian of materialism. You can ask him: "If the future is fixed, is my understanding of your argument also fixed, and therefore our debate is an illusion?"

  ### 5. The Eternal Recurrence Claim
  **The Assertion:** Time is not linear but cyclical. Not just in patterns (Option 2), but in actuality. Everything that happens has happened before, infinitely, and will happen again. The "new" is literally the "old" returning.
  *   **Status:** **Mythological/False.** Nietzsche toyed with this as a thought experiment, but physically and historically, it is untenable. Entropy does not work that way; the universe is not a perfect loop.
  *   **Does it block Popper?** **Yes, by making the question meaningless.**
      *   *Why:* If time is a circle, prediction is just memory of the previous cycle. But this requires abandoning the scientific worldview entirely. It is unlikely your friend actually believes this; he is likely using it as a poetic flourish for Option 1 or 2.

  ***

  ### How to serve this back to him

  When you meet for coffee, I suggest you pour him a cup and lay it out like a stratigraphic column. Tell him you've analyzed his core thesis.

  1.  **If he means Option 1 (Human Nature):** Tell him you agree, but point out that a constant engine (human nature) driving a changing vehicle (technology/knowledge) still produces an unpredictable journey.
  2.  **If he means Option 2 (Patterns):** Concede the point but distinguish between *retrospective pattern recognition* (history) and *prospective prediction* (prophecy). Acknowledge his skill in seeing patterns, but insist that patterns are not laws.
  3.  **If he means Option 4 (Determinism):** This is the crux. Ask him if he is willing to defend the position that the discovery of fire, the wheel, and the microchip were all inevitable from the Big Bang. If he says yes, he has left the realm of history and entered the realm of faith.

  **The Verdict:**
  Most historians who use that phrase are smuggling **Option 2 (Patterns)** in while pretending it carries the weight of **Option 4 (Determinism)**. They want the comfort of determinism without the metaphysical baggage.

  Popper's specific gift to you here is the realization that **knowledge is a causal agent.** Your friend is treating history as a story about men moving rocks. But in the modern world, history is a story about ideas moving men. Since we cannot predict the ideas, we cannot predict the movement.

  "Nothing new under the sun" is a beautiful sentiment for a poet or a priest. For a historian trying to negate the indeterminacy of the future, it is, to borrow a phrase, an unfalsifiable metaphysical research programme.
