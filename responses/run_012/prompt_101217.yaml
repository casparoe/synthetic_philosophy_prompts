      *   **User:** Someone writing philosophy (likely academic or high-level popular philosophy). They've written a piece before on the heterogeneity of pleasure. They've adopted a specific position: Attitudinal Hedonism (pleasure is a pro-attitude toward experience, not a specific feeling).
      *   **Goal:** They want to "wreck" this position. They want counterarguments, defeaters, and vulnerability mapping, *not* a reading list. They want to know if their view is unfalsifiable/trivial.
      *   **Specific Constraints:** Work with what's in my head (no library access needed). Sort objections by decisiveness. Focus on two specific areas: (1) Cases where attitude and phenomenology come apart (embarrassing the view), and (2) Addiction literature (liking vs. wanting).
      *   **Tone:** Honest, critical, rigorous, philosophical but accessible (matching their style).

  2.  **Deconstruct the User's Position:**
