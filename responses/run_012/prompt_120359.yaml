      Two identical chemical plants face a reactor runaway that will explode and kill fifty staff. In both, the Chief Engineer opens the same emergency valve to vent the core. In Plant Alpha, the vent line is routed through the single occupied control booth; the physical expansion of the gas *requires* the displacement of the air in that booth to achieve the pressure drop needed to stop the explosion, suffocating the technician inside as the mechanism of safety. In Plant Beta, the vent line is sealed, but the rapid depressurization causes a structural vibration that shatters a window in the control booth, sending shrapnel that kills the technician inside as a non-essential consequence of the pressure drop.

