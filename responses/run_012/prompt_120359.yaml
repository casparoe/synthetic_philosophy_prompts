answer: |-
  Two identical labs face a volatile aerosol runaway that will explode and kill fifty staff. In both, the Safety Director releases the same neutralizing gas. In Lab Alpha, the aerosol has leaked into the adjacent control room; the gas neutralizes the threat only by reacting with the aerosol in that room, displacing the breathable oxygen and suffocating the technician inside as the necessary mechanism of stabilization. In Lab Beta, the aerosol is contained in the main vessel; the gas neutralizes the threat there, but the reaction produces lethal sulfur dioxide as a waste byproduct which leaks into the control room, suffocating the technician inside as a non-essential consequence of the stabilization.

  **The Analysis**
  For the **act-consequentialist**, the verdict is identical for both agents: the action is permissible, perhaps even obligatory, because the outcome (one dead, fifty saved) is identical; the causal path is morally irrelevant. For **Anscombe-style absolutism** and standard **Double Effect (DDE)** theory, the verdicts diverge. In Lab Beta, the death is a foreseen but unintended side effect (a byproduct), so the act is permissible provided the good is proportional. In Lab Alpha, the death is the *means* to the end (the lever); the stabilization occurs *through* the suffocation. Anscombe argues that you cannot separate the intention from the chosen plan: if your plan requires the death to achieve the good, you intend the death. Therefore, Alpha is guilty of intentional killing of the innocent (murder), while Beta is not.

  This highlights the crux of your question: Anscombe's position *requires* reading intention off the **causal structure of the plan/world**, not the agent's psychological state. If intention were read purely off the agent's mind ("I didn't *want* him to die, I just wanted to save the 50"), both agents would be innocent, and the distinction would collapse. Anscombe insists that "intention" describes the action chosen, not the accompanying feelings. In Alpha, the description of the act is "kill the technician to stop the explosion." In Beta, it is "stop the explosion, accepting the technician's death." The DDE verdicts come out different precisely because the causal role of the death differs, forcing a different description of the intention regardless of the agent's internal regret.

  **The Three Things**
  1.  **The Working Feature:** The single feature doing all the work is the **causal role of the death** (whether it is the *means* of the good outcome or a *consequence* of the means).
  2.  **Removing the Feature:** If you make the mechanisms identical but change the agents' plans (e.g., Agent Alpha *hopes* the technician dies for personal reasons, while Agent Beta *mourns* him, though the physics are the same), the DDE and Anscombe verdicts become unstable. They would likely still claim the act is permissible for both (since the act itself is the "Beta" structure), rendering the mental state irrelevant to the *act's* morality, though perhaps relevant to the *agent's* virtue. This shows DDE is about the act's structure, not the heart's privacy.
  3.  **The DDE Defender's Attack:** A committed defender would attack the description of Lab Alpha via the **"Closeness Problem."** They would argue the agent in Alpha does not intend "death," but rather "oxygen displacement" or "aerosol neutralization." Since death is not strictly required for the chemical reaction (only oxygen removal is), they would claim the death remains a side effect, attempting to salvage the permissibility of Alpha. Anscombe would reject this as semantic sophistry, insisting that choosing a plan where a person dies as a step is choosing their death.
