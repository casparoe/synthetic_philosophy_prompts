      *   *Okay, let's write it.*

      *(Wait, one more check on Anscombe)*: Anscombe's critique of Truman was that he intended the death of civilians to break morale (means). If he didn't need them dead, just the factories destroyed, it would be different. So she needs the causal role to define the intention.

      *(Final Plan)*:
      1. Scenario (Chemical plant, pressure release).
      2. Analysis (Anscombe, Consequentialism, DDE).
      3. The "Intention" reading (World vs. Mind).
      4. Three closing points.

