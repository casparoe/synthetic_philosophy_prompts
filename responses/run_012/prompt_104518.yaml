answer: |-
  # The Epistemic Weight of Stories: A Tier List of Intuition Pumps

  The complaint is familiar in rationalist and analytic circles: *"An intuition pump is just an argument disguised as a story."* The charge is that thought experiments smuggle in conclusions under the guise of neutral imagination, leveraging vividness to bypass rigorous justification.

  But not all pumps are created equal. Some are mere rhetoric; others are precision instruments that carve nature at its joints. To move past the blanket dismissal, I've constructed a tier list of six intuition pumps. These are ranked not by fame, but by **epistemic weight**: how much a careful philosopher should trust the verdict each pump invites when that verdict is used as a premise in a larger argument.

  Below is the methodology, the rankings, and a candid map of where philosophical consensus ends and live dispute begins.

  ---

  ## Methodology & Rubric

  To generate a comparable 0–10 score for each pump, I evaluated them on four axes. Note that these weights reflect a **fallibilist, conceptual-analytic framework**. If you are a radical experimental philosopher who believes intuitions are never evidence, your scores will differ (see *Meta-Commentary* below).

  **The Weighted Rubric:**
  1.  **Conceptual Isolation (30%):** Does the pump isolate a genuine conceptual distinction, or does it merely relabel the desired conclusion? (High score = isolates distinction).
  2.  **Framing Robustness (30%):** Does the invited verdict survive reversing the framing or swapping incidental features? (High score = robust).
  3.  **Target Clarity (20%):** Is the target a concept, a theory, or a psychological tendency? Pumps targeting specific theoretical commitments score higher than those targeting vague psychological tendencies. (High score = clear theoretical target).
  4.  **Argumentative Independence (20%):** Does the pump have an independent argumentative role, or is it doing all its work through vividness? (High score = independent role).

  **Classification Labels:**
  *   **Intuition Generator:** Elicits a pre-theoretic judgment to test a theory.
  *   **Argumentative Shortcut:** Compresses a complex logical derivation into a scenario.
  *   **Lens:** Changes what we notice without necessarily proving a proposition. *Note: If a pump is best treated as a lens, it is rated on its utility as a lens, not as evidence for a proposition.*

  ---

  ## The Tier List

  ### **S-Tier: The Structural Defeater**
  #### **1. The Confession Booth**
  *   **Score:** 9.5/10
  *   **Classification:** Argumentative Shortcut
  *   **Consensus Stability:** High (among epistemologists)

  **The Pump:** A reliable process tells you one of your central beliefs was formed by an unreliable process, but you cannot identify which one. Does the mere fact that *some* belief is compromised defeat *all* of them?

  **Rubric Assessment:**
  *   **Conceptual Isolation (9/10):** Sharply isolates the distinction between *local* and *global* skepticism. It forces a choice between fallibilism and self-undermining doubt.
  *   **Framing Robustness (10/10):** Swapping "belief" for "memory" or "perception" does not change the structural logic. It is framing-invariant.
  *   **Target Clarity (10/10):** Targets the theory of epistemic justification (specifically, internalist access requirements).
  *   **Independence (9/10):** The vividness of the "booth" is secondary to the logical structure of the defeater.

  **Analysis:** This is a high-weight pump because it functions as a reductio ad absurdum. It doesn't ask you to *feel* a truth; it asks you to acknowledge a structural constraint on justification. The verdict ("Global skepticism is self-defeating") is widely accepted as a premise in anti-skeptical arguments.
  *   **Live Dispute:** Minimal. While externalists and internalists disagree on *why* it works, few deny the force of the structural problem.

  ---

  ### **A-Tier: The Conceptual Stress Test**
  #### **2. The Two Doors**
  *   **Score:** 8.5/10
  *   **Classification:** Intuition Generator
  *   **Consensus Stability:** Medium (Parfitian consensus vs. Animalists)

  **The Pump:** Your brain is divided; each half is transplanted into a body. You must choose one door (Left-Hemisphere Body or Right-Hemisphere Body). Is the choice arbitrary, or is there a fact about which is *you*?

  **Rubric Assessment:**
  *   **Conceptual Isolation (9/10):** Isolates "identity" from "survival." It forces the distinction between *further fact* views and *psychological continuity* views.
  *   **Framing Robustness (8/10):** Generally robust, though some framings (e.g., emphasizing pain in one body) can skew the psychological response.
  *   **Target Clarity (9/10):** Targets metaphysical theories of personal identity.
  *   **Independence (8/10):** The scenario is vivid, but the logical pressure comes from the symmetry of the fission, not the drama.

  **Analysis:** This pump (a variant of Parfit's fission cases) is epistemically heavy because it successfully shifts the burden of proof. The verdict it invites ("There is no fact of the matter") is used as a premise to argue that identity doesn't matter. However, it loses points because "Animalist" critics argue the framing ignores biological continuity, suggesting the pump rigs the concept of "you" toward psychology.
  *   **Live Dispute:** Significant. The "Method of Cases" is contested here. Some argue the intuition *is* the evidence; others argue the intuition is a confused linguistic habit.

  ---

  ### **B-Tier: The Dialectical Opener**
  #### **3. The Aesthetic Taster**
  *   **Score:** 6.5/10
  *   **Classification:** Intuition Generator
  *   **Consensus Stability:** Low (Testimony vs. Perception debate)

  **The Pump:** A reliable critic says a novel is cold but profound. You read it and feel only coldness. Does their testimony give you reason to believe the profundity is there, or only reason to suspect your sensibility?

  **Rubric Assessment:**
  *   **Conceptual Isolation (7/10):** Isolates the tension between testimonial justification and perceptual acquaintance.
  *   **Framing Robustness (6/10):** Highly sensitive. If the critic is a "friend," you trust them; if an "elitist," you don't. The incidental features drive the verdict.
  *   **Target Clarity (7/10):** Targets epistemology of aesthetics and testimony.
  *   **Independence (6/10):** Relies heavily on the reader's personal experience with art.

  **Analysis:** This is a useful tool for starting a seminar, but poor for settling one. The verdict fluctuates too much based on the reader's own aesthetic confidence. It is better treated as a **Lens** for examining the limits of testimony than as evidence that testimony *does* or *does not* justify aesthetic belief.
  *   **Live Dispute:** High. Experimental philosophers (e.g., Knobe) show that verdicts on cases like this vary by culture and personality, undermining their use as universal premises.

  ---

  ### **B-Tier (As Lens): The Sociological Mirror**
  #### **4. The Sorting Hat**
  *   **Score:** 7.0/10 (As a Lens) / 3.0/10 (As Evidence)
  *   **Classification:** Lens
  *   **Consensus Stability:** Medium (Social Constructionism vs. Realism)

  **The Pump:** A hat assigns you at random to a coalition. You adopt its policy bundle. Over time, the bundle becomes coherent and rewarding. Does that make the left/right distinction real, or only self-reinforcing?

  **Rubric Assessment:**
  *   **Conceptual Isolation (8/10):** Excellent at isolating *path dependence* from *essentialism*.
  *   **Framing Robustness (7/10):** Robust against minor changes, but fails if the "policies" are inherently contradictory (e.g., assigning a pacifist to a war party).
  *   **Target Clarity (6/10):** Targets social ontology, but risks conflating *origin* with *status*.
  *   **Independence (7/10):** Functions well as a model, not as a proof.

  **Analysis:** **Crucial Distinction:** If used as evidence that "Left/Right is not real," this pump is **D-Tier**. It commits the genetic fallacy (origin does not determine current reality). However, rated as a **Lens** for noticing how coalitions cohere, it is **B-Tier**. It changes what we notice (social reinforcement mechanisms) without proving a proposition. I have rated it 7.0 based on its utility as a lens, as per your instructions.
  *   **Live Dispute:** Whether social kinds can be "real" even if historically contingent is a live dispute in social metaphysics (Haslanger vs. Naturalists).

  ---

  ### **C-Tier: The Question-Beggar**
  #### **5. The Transcript**
  *   **Score:** 5.0/10
  *   **Classification:** Argumentative Shortcut
  *   **Consensus Stability:** Low (Physicalism vs. Phenomenology)

  **The Pump:** A scientist records every verbal report, behavior, and neural correlate of your experience of a red patch. She claims nothing is left out; you insist something is. Is she begging the question, or making a conceptual point?

  **Rubric Assessment:**
  *   **Conceptual Isolation (5/10):** Struggles to isolate "qualia" without assuming them.
  *   **Framing Robustness (4/10):** Highly sensitive. If the scientist is described as "omniscient," you feel defeated; if "mechanistic," you feel resistance.
  *   **Target Clarity (6/10):** Targets Physicalism, but often pre-supposes Dualism in the setup.
  *   **Independence (5/10):** Does all its work through the vividness of the "missing" feeling.

  **Analysis:** This is a repackaging of the Knowledge Argument (Jackson) or the Explanatory Gap (Levine). Its epistemic weight is low because the verdict is entirely determined by your prior commitment to physicalism. Physicalists see it as begging the question (assuming the transcript *must* be incomplete); Phenomenologists see it as obvious. It cannot serve as a neutral premise for either side.
  *   **Live Dispute:** Extremely High. This is the frontline of the Philosophy of Mind. Using the verdict as a premise is dialectically suicidal unless your audience already agrees with you.

  ---

  ### **D-Tier: The Self-Underminer**
  #### **6. The Pump That Pumps Itself**
  *   **Score:** 2.0/10
  *   **Classification:** Argumentative Shortcut (Performative)
  *   **Consensus Stability:** High (Logic of Self-Reference)

  **The Pump:** A thought experiment makes you intuit that thought experiments are unreliable because they trade on vivid particulars. Does the pump undermine itself, or can it consistently exempt itself?

  **Rubric Assessment:**
  *   **Conceptual Isolation (4/10):** Isolates self-reference, but creates a paradox rather than a distinction.
  *   **Framing Robustness (2/10):** If it works, it fails. If it fails, it might work. Unstable.
  *   **Target Clarity (3/10):** Targets methodology, but offers no stable ground to stand on.
  *   **Independence (1/10):** Entirely dependent on the performative contradiction.

  **Analysis:** This is a logical curiosity, not a premise generator. If the verdict is "Pumps are unreliable," and you use that verdict to dismiss this pump, you have no reason to accept the verdict. If you exempt this pump, you are ad hoc. It has low epistemic weight because it cannot stably support a conclusion.
  *   **Live Dispute:** Low. Most agree self-undermining arguments cannot serve as foundational premises, though some (Pyrrhonists) use them therapeutically.

  ---

  ## Meta-Commentary: Where the Ground Shifts

  In constructing this list, I have navigated several minefields. To be intellectually honest, I must flag where the ratings above rely on contested methodological assumptions.

  **1. Are Intuitions Evidence?**
  *   **Settled:** Intuitions are *data* that theories must accommodate.
  *   **Live Dispute:** Are they *evidence* for the truth of the proposition?
      *   *The Conservative View (Williamson):* Intuitions are judgments with the same status as ordinary observational judgments. (Supports higher scores for Pumps 1, 2, 5).
      *   *The Restrictive View (Cappelen):* Philosophers don't actually rely on intuitions; they rely on arguments. (Suggests all these pumps are merely rhetorical).
      *   *The Experimentalist View (Knobe/Machery):* Intuitions vary by culture/class, so they are unreliable evidence. (Lowers scores for Pumps 2, 3, 5 significantly).
  *   *My Rating Stance:* I have rated based on a moderate view: Intuitions are provisional evidence, subject to defeaters (like framing effects).

  **2. Framing Effects and Reliability**
  *   **Settled:** Framing effects exist (Tversky & Kahneman).
  *   **Live Dispute:** Do framing effects in *philosophical* cases show unreliability, or just sensitivity to context?
      *   If framing shows unreliability, Pump 3 (Transcript) and Pump 2 (Taster) drop tiers.
      *   If framing shows context-sensitivity, they remain stable.
  *   *My Rating Stance:* I treated high sensitivity to framing (Axis ii) as a negative for epistemic weight, assuming that truth-tracking should be relatively robust across incidental descriptions.

  **3. Arguments Disguised as Stories**
  *   **Settled:** Some pumps are bad arguments (e.g., Pump 6).
  *   **Live Dispute:** Are *good* pumps just compressed arguments?
      *   Dennett (who coined "Intuition Pump") often implies they are heuristic tools, not proofs.
      *   Others argue a well-constructed pump *is* a modal argument (e.g., "If X is possible, then Y is false").
  *   *My Rating Stance:* I rewarded pumps that function as **Argumentative Shortcuts** (compressing valid logic) over those functioning purely as **Intuition Generators** (relying on pre-theoretic feeling). This is why *The Confession Booth* (S-Tier) outranks *The Aesthetic Taster* (B-Tier).

  ## Conclusion

  The rationalist complaint that "intuition pumps are arguments disguised as stories" is partially correct but insufficiently granular.
  *   **S-Tier pumps** are arguments where the story is the most efficient way to display a logical structure (e.g., *The Confession Booth*).
  *   **C/D-Tier pumps** are stories where the argument is hidden, question-begging, or self-defeating (e.g., *The Transcript*, *The Pump That Pumps Itself*).

  A careful philosopher should not discard intuition pumps. They should, however, demand to see the rubric. If a pump cannot survive a reversal of its framing, or if it relies on vividness to hide a lack of conceptual isolation, it belongs in the trash bin, not the premise list.
