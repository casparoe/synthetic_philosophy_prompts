answer: |-
  # Decision Tree: The Logic of Tyrannicide
  ### A Taxonomy for the Thomistic Seminar

  This decision tree maps the logical space of medieval and early modern political theology regarding the removal of tyrants. It proceeds from broad procedural constraints to specific metaphysical and consequentialist distinctions. The questions are designed to be answered based on the concrete case presented, without prior knowledge of which theorist occupies the resulting position.

  ---

  ## The Decision Tree

  **START:** A ruler is governing unjustly.

  **Q1. Is the removal of this ruler permissible only through established legal courts and formal impeachment processes, forbidding extra-legal violence?**
  *   **YES** $\rightarrow$ **Leaf 1: Modern Liberal View**
  *   **NO** $\rightarrow$ Go to Q2.

  **Q2. Is this ruler's tyranny a divine punishment for the people's sins that must be endured without active resistance?**
  *   **YES** $\rightarrow$ **Leaf 2: Lutheran Non-Resistance**
  *   **NO** $\rightarrow$ Go to Q3.

  **Q3. Does the ruler lack a valid legal title to power (a usurper who seized control) versus holding a legitimate title but ruling unjustly?**
  *   **USURPER (No Title)** $\rightarrow$ Go to Q4.
  *   **LEGITIMATE TITLE (Tyrant by Practice)** $\rightarrow$ Go to Q5.

  **Q4. (For the Usurper) May a private citizen kill him, or must even a usurper be endured until a public authority removes him?**
  *   **MUST BE ENDURED** $\rightarrow$ **Leaf 3: Unoccupied Position A**
  *   **PRIVATE CITIZEN MAY KILL** $\rightarrow$ Go to Q6.

  **Q5. (For the Legitimate Tyrant) Must removal be executed solely by a public superior (inferior magistrate, pope, or people in assembly), or may a private citizen act?**
  *   **PUBLIC SUPERIOR ONLY** $\rightarrow$ **Leaf 4: Magisterial Resistance**
  *   **PRIVATE CITIZEN MAY ACT** $\rightarrow$ Go to Q6.

  **Q6. (For Private Killing) Is the act permissible only if it avoids causing a civil war worse than the tyranny, or is it permissible even with significant risk provided there is public consent?**
  *   **MUST AVOID GREATER HARM** $\rightarrow$ **Leaf 5: Aquinas's View**
  *   **RISK TOLERATED (With Consent)** $\rightarrow$ Go to Q7.

  **Q7. (For Risky Private Killing) Is the killing framed as a personal duty when no superior exists, or as a permissible act executing the commonwealth's consensus?**
  *   **PERSONAL DUTY (If No Superior)** $\rightarrow$ **Leaf 6: John of Salisbury**
  *   **EXECUTING CONSENSUS** $\rightarrow$ **Leaf 7: The Jesuit/Marianist View**
  *   **KILLING MANDATORY (Even if it causes Civil War)** $\rightarrow$ **Leaf 8: Unoccupied Position B**

  ---

  ## The Leaves: Positions and Commitments

  ### Leaf 1: The Modern Liberal View
  *   **Location:** Q1 (YES).
  *   **Description:** Only legal process can remove a tyrant; extra-legal violence is inherently illegitimate regardless of the ruler's injustice.
  *   **Most Awkward Commitment:** It must tolerate a tyrant who has successfully subverted the legal system, as there is no extra-legal recourse.

  ### Leaf 2: The Lutheran Non-Resistance View
  *   **Location:** Q2 (YES).
  *   **Description:** Tyranny is a divine scourge (Romans 13); subjects must endure it and pray, not resist.
  *   **Most Awkward Commitment:** It requires passive obedience even if the tyrant commands the subject to sin or destroys the faith.

  ### Leaf 3: Unoccupied Position A (The Passive Legitimist)
  *   **Location:** Q3 (Usurper) $\rightarrow$ Q4 (Must Be Endured).
  *   **Description:** Even a usurper with no title must be endured by private citizens until God removes him.
  *   **Diagnosis:** **Incoherent/Unattractive.** This position is virtually unoccupied because admitting a ruler has *no title* while forbidding resistance undermines the very concept of political right; it collapses into Leaf 2 (Divine Scourge) without the theological justification.

  ### Leaf 4: Magisterial Resistance (Calvinist/Vindiciae)
  *   **Location:** Q3 (Legitimate) $\rightarrow$ Q5 (Public Superior Only).
  *   **Description:** A legitimate tyrant may be removed, but only by "inferior magistrates" or public bodies, never by private individuals.
  *   **Most Awkward Commitment:** It leaves the people defenseless if the tyrant successfully purges or coerces all inferior magistrates.
  *   **Note on Separation:** **This leaf is difficult to separate from Aquinas (Leaf 5)** regarding legitimate tyrants. Both insist on public authority. The distinction relies on Aquinas's specific allowance for *usurpers* (handled in Q4) and his stronger emphasis on the *consequentialist* check (Q6).

  ### Leaf 5: Aquinas's View (Reconstructed)
  *   **Location:** Q3 (Usurper $\rightarrow$ Private OK) / Q3 (Legitimate $\rightarrow$ Public Only) $\rightarrow$ Q6 (Avoid Greater Harm).
  *   **Description:** A usurper may be killed by a private person unless it causes greater disturbance; a legitimate tyrant must be deposed by public authority.
  *   **Most Awkward Commitment:** It creates a moral discontinuity where killing a "bad" ruler is permissible or forbidden based entirely on the technicality of his initial title, not the severity of his current injustice.

  ### Leaf 6: John of Salisbury's View
  *   **Location:** Q3 (Legitimate) $\rightarrow$ Q5 (Private OK) $\rightarrow$ Q7 (Personal Duty).
  *   **Description:** If no public superior is available, a private citizen has a moral duty to kill the tyrant as an enemy of the commonwealth.
  *   **Most Awkward Commitment:** It risks turning political assassination into a subjective moral obligation for any zealous individual who decides no superior exists.

  ### Leaf 7: The Jesuit/Marianist View (Juan de Mariana)
  *   **Location:** Q3 (Legitimate) $\rightarrow$ Q5 (Private OK) $\rightarrow$ Q6 (Risk Tolerated) $\rightarrow$ Q7 (Executing Consensus).
  *   **Description:** A private citizen may kill a tyrant if there is tacit public consent, even if it risks disturbance, provided the tyrant is not removed by law.
  *   **Most Awkward Commitment:** It relies on "tacit consent" which is difficult to verify, potentially legitimizing violence based on the assassin's interpretation of public will.

  ### Leaf 8: Unoccupied Position B (The Zealot)
  *   **Location:** Q7 (Killing Mandatory Even if Civil War).
  *   **Description:** Killing the tyrant is an absolute duty that must be performed even if it certainly triggers a civil war worse than the tyranny.
  *   **Diagnosis:** **Incoherent.** This violates the principle of *salus populi* (safety of the people) which grounds the resistance theory in the first place; it privileges the act of killing over the good of the commonwealth it is meant to save.

  ---

  ## Seminar Notes on Logical Space

  **Unseparable Pairs:**
  *   **Aquinas (Leaf 5) and Magisterial Resistance (Leaf 4):** On the specific question of a *legitimate* tyrant, these positions are logically adjacent. Both require public authority. In a seminar discussion, they may collapse into one another unless you press the *Usurper* distinction (where Aquinas allows private action) or the *Consequentialist* distinction (Aquinas's explicit warning against greater harm, which Magisterial theorists sometimes subordinate to the duty of the magistrate).
  *   **Salisbury (Leaf 6) and Mariana (Leaf 7):** Both permit private killing. The tree separates them by "Duty vs. Consensus," but historically Mariana reads Salisbury. The distinction is subtle: Salisbury emphasizes the tyrant's loss of humanity (making him a beast to be slain), while Mariana emphasizes the commonwealth's retained authority (delegated to the slayer).

  **Unoccupied Combinations:**
  *   **Leaf 3 (Endure Usurper):** This space is empty because the "Usurper" diagnosis usually triggers the right of resistance in all non-absolutist theories. To occupy this, one would need to argue that *de facto* power creates immediate legitimacy, which contradicts the premise of Q3.
  *   **Leaf 8 (Mandatory despite Harm):** This space is empty because resistance theory is teleological (aimed at the common good). A theory that mandates resistance even when it destroys the common good is logically self-defeating.

  **Thomistic Angle:**
  Notice that **Aquinas (Leaf 5)** sits at the pivot of the tree. He answers "NO" to Legalism and "NO" to Non-Resistance, but "YES" to the constraint of Greater Harm. The early modern reception (Mariana) pushes past Aquinas on the "Greater Harm" constraint (Q6), while the Magisterial Reformers push past Aquinas on the "Private Citizen" constraint (Q5). This makes Aquinas the central reference point for the seminar's debate.
