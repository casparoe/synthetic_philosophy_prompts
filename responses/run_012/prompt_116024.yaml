answer: |-
  ### The Semantic and Causal Crux of *Bostock*

  *Bostock v. Clayton County* is pedagogically indispensable because it shatters the heuristic that textualism yields conservative outcomes while purposivism yields liberal ones. To understand why, we must move beyond the slogan that the majority was "textualist" and the dissent "originalist" or "purposivist." Both opinions claimed fidelity to the ordinary public meaning of the text. The divergence lies in how that meaning is constituted: specifically, in the distinction between sentence meaning and speaker meaning, and in the metaphysical status of reasons as causes.

  #### I. Sentence Meaning vs. Speaker Meaning

  The first layer of the dispute concerns the semantic content of the phrase "because of... sex." Here, the Gricean distinction between *sentence meaning* (the timelessly true conditions of the utterance determined by compositional rules) and *speaker meaning* (what the speaker intended to communicate by the utterance) clarifies the methodological rift.

  **The Majority (Semantic Content):** Justice Gorsuch's opinion operates on *sentence meaning*. It treats the statutory text as a code with fixed logical operators. On this view, the meaning of "because of" is determined by its function in English syntax and logic, specifically the but-for causal test. If the truth conditions of the sentence "The employee was fired because of sex" are satisfied whenever the employee's sex is a necessary condition for the firing, then the sentence is true. Gorsuch explicitly brackets the 1964 Congress's expectations (speaker meaning). He argues that even if the speakers (Congress) did not *intend* to prohibit discrimination based on sexual orientation, the *sentence* they enacted logically covers it. The text is a machine that runs on logic; if you feed it a gay man fired for being gay, the machine outputs "sex discrimination" regardless of what the operators thought the machine would do.

  **The Dissent (Communicative Content):** Justice Alito's dissent operates on *speaker meaning*. It treats the text as evidence of a communicative act by a specific body at a specific time. On this view, the "ordinary public meaning" is not just the compositional semantics, but what a reasonable person in 1964 would have understood the *speakers* to be achieving. Alito argues that in 1964, "sex" and "sexual orientation" were distinct categories in the public lexicon. Therefore, the communicative content of the statute was limited to biological sex. To extend it to orientation is to ignore the speaker's intent, effectively amending the statute. For the dissent, the text cannot be divorced from the context of its utterance; the meaning *is* the intended uptake.

  #### II. Reasons as Causes: The Davidsonian Test

  The second layer concerns the philosophy of action. The statute prohibits firing an employee *because of* a protected trait. This invokes a causal claim about human action. Donald Davidson's thesis that "reasons are causes" provides the framework to test whether the majority and dissent are describing different actions or the same action under different descriptions.

  **Davidson's Framework:** Davidson argues that when an agent acts intentionally, their reason (a belief/desire pair) rationalizes the action and *causes* it. However, causal relations are extensional (between events), while reason explanations are intensional (under descriptions). An action can be caused by a complex event described in multiple ways.

  **The Majority's Causal Claim:** Gorsuch implicitly adopts an extensional view of the cause. The employer's decision is an event. That event was caused by a set of facts including the employee's sex and the employee's attraction to men. If you remove "sex" from the causal chain (e.g., if the employee were a woman attracted to men), the event (firing) does not occur. Therefore, sex is a cause. Under Davidson's view, if the reason "he is gay" causes the firing, and "he is gay" logically entails "he is a man attracted to men," then the property of *sex* is part of the causal basis. The majority collapses the distinction between the "ground" (orientation) and the "cause" (sex) because the ground supervenes on the cause.

  **The Dissent's Causal Claim:** Alito adopts an intensional view of the reason. While reasons are causes, they cause actions *under specific descriptions*. The employer did not fire the employee *under the description* "because he is male." They fired him *under the description* "because he is gay." For the dissent, the causal theory of action preserves the distinction because the agent's mental state did not include "sex" as the motivating reason. To say the firing was "because of sex" misdescribes the psychological cause.

  **Does Davidson Collapse the Readings?**
  Davidson's theory does not collapse the readings; it reveals they are talking past one another regarding the *granularity* of causation. Davidson acknowledges that one event can have multiple true descriptions. The Majority says: "Is 'sex' a true description of a cause of the firing?" (Yes). The Dissent says: "Is 'sex' the description under which the agent acted?" (No). Davidson allows both to be true simultaneously. Thus, the conflict is not metaphysical (whether reasons are causes) but interpretive (which description of the cause the statute picks out). The statute says "because of sex." The Majority reads this as picking out any causal description where sex is a necessary condition. The Dissent reads this as picking out the specific motivational description employed by the agent.

  #### III. Evaluation of the Theories

  **What the Court Confronted and Was Required to Do:**
  *   **Textualism (Majority):** Confronted a rule of composition. It was required to apply the logical operators of the text to the facts.
      *   *Explains:* The logical inevitability of the result. If "because of" means but-for causation, the result follows deductively.
      *   *Misdescribes:* The nature of legislative enactment. It treats the 1964 Congress as having enacted all logical implications of their words, ignoring that legal meaning often relies on expected application to settle ambiguity.
  *   **Purposivism/Originalism (Dissent):** Confronted a historical communicative act. It was required to honor the specific problem the speakers intended to solve.
      *   *Explains:* The historical context and the distinct legal treatment of orientation vs. sex in 1964.
      *   *Misdescribes:* The authority of the text. It treats the text as a window into the speakers' minds rather than a binding rule that may outstrip those minds.

  **Underdetermination or Misapplication?**
  Does the fact that two "ordinary public meaning" opinions reach opposite results show that the method underdetermines outcomes? **No.** It shows that "ordinary public meaning" is an ambiguous term that conflates semantic content (sentence meaning) with communicative content (speaker meaning). One side did not necessarily *misapply* the method; rather, the method itself is bifurcated. Gorsuch applied the *semantic* version faithfully; Alito applied the *communicative* version faithfully. The divergence reveals that "textualism" is not a unitary method but a label covering two distinct theories of meaning.

  #### IV. Verdict: Recasting the Divide

  **Verdict:** The text/purpose divide **should be recast** as a divide over **semantic versus communicative content**. The older contrast does not survive *Bostock* as a useful analytical tool.

  **Defense of the Verdict:**
  The traditional contrast posits that Textualists look at the *words* (fixed, objective) while Purposivists look at the *goals* (malleable, subjective). *Bostock* demonstrates that this is false. Gorsuch (Textualist) achieved a "purposive" liberal outcome by rigorously analyzing the words. Alito (accused of Purposivism by critics, though claiming Textualism) argued for a conservative outcome by analyzing the context of the words. The fight was not Text vs. Purpose; it was **Code vs. Coder**.

  Recasting the divide as Semantic (Sentence Meaning) vs. Communicative (Speaker Meaning) is superior because it locates the disagreement where it actually occurred: in the philosophy of language, not in the hierarchy of sources. Both justices looked at the text. The disagreement was whether the text's meaning is exhausted by its compositional logic (Semantic) or completed by the context of its utterance (Communicative). This recasting forces jurists to be honest: are we bound by the logical potential of the language, or by the historical intent of the legislature?

  **The Strongest Objection:**
  The strongest objection to this recasting is the **Institutional Competence Objection**. The older Text/Purpose divide, however imperfect, provided a clear institutional heuristic: Judges apply the text; Legislatures pursue the purpose. This preserves the separation of powers. Recasting the divide as Semantic vs. Communicative content invites judges to become amateur linguists and philosophers of action, debating Gricean implicature and Davidsonian causation. This increases judicial discretion rather than constraining it. If "meaning" is a philosophical battleground, the Rule of Law suffers because the criteria for decision become too abstract for public verification. The older contrast survives because it is *pragmatically* necessary to keep judges out of deep semantic theory, even if that contrast is theoretically imprecise.

  **Rebuttal to the Objection:**
  This objection assumes that the older contrast actually constrains judges. *Bostock* proves it does not. Both sides claimed the "Text" mantle. If the label "Textualism" can cover both Gorsuch's semantic literalism and Alito's communicative intentionalism, then the label provides no constraint at all; it is merely a rhetorical shield. Pretending the older contrast survives obscures the real choice judges are making.

  Furthermore, the Semantic/Communicative distinction is not esoteric; it maps onto a clear legal distinction: **Notice vs. Expectation**.
  *   **Semantic Content** provides *Notice*: Citizens can read the statute and understand its logical scope.
  *   **Communicative Content** protects *Expectation*: Citizens rely on how the law was historically understood.

  By recasting the divide, we do not invite unchecked discretion; we clarify the trade-off. A Semantic approach prioritizes the public's ability to read the law as written (Rule of Law as Notice). A Communicative approach prioritizes the public's reliance on the law as historically applied (Rule of Law as Stability). The older Text/Purpose slogan hides this trade-off behind a false dichotomy. *Bostock* teaches that the text *has* a purpose, and the purpose *has* a text. The only genuine question is whether the meaning resides in the sentence or the speaker. Jurisprudence is better served by answering that question directly than by hiding behind a collapsed distinction that *Bostock* has rendered obsolete.
