      *   SSA typically keeps priors over worlds uniform (or standard) and updates on indexical information via sampling.
      *   SIA effectively weights priors by the number of observers ($N_i$).
      *   So, is it really different questions? Or is it different priors?
      *   Many philosophers (e.g., Bostrom, Bradley) argue SIA is equivalent to SSA with a specific prior weighting.
      *   If the user's hypothesis is that they are asking different questions, I need to test if that holds or if it's actually a dispute over priors/reference classes.

