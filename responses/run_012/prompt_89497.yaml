  The paper is worth writing, but you should pivot your conclusion from "this collapses into coarse-grained accuracy" to "this demonstrates a structural incompatibility between truthlikeness and the propriety required for accuracy-first dominance arguments."

  Here is the reasoning on the formalism, the motivation, and the strategic angle.

  **1. The Formalism: You lose propriety (b), not just granularity (a)**
  Your intuition that the rule becomes improper is correct, but your diagnosis that it merely collapses into coarse-grained accuracy is too optimistic. If you define the new scoring rule $S'(c, w) = \sum_{w'} sim(w, w') S(c, w')$, you are effectively asking the agent to maximize expected score relative to a "smoothed" probability distribution $\tilde{c}$, where $\tilde{c}(w') = \sum_w c(w)sim(w, w')$. Because the original rule $S$ is proper, the agent maximizes expected $S'$ by reporting $\tilde{c}$, not their actual credence $c$. Unless the similarity function induces an equivalence partition (making $\tilde{c}$ a coarse-grained credence), $\tilde{c}$ is simply a distorted version of $c$. This means the rule is improper with respect to the original algebra. Consequently, the standard dominance argument for probabilism fails: you can no longer prove that non-probabilistic credences are dominated, because the scoring rule no longer incentivizes honesty about the fine-grained credences. The circularity you worried about only arises if $sim$ depends on $c$; if $sim$ is fixed by world-metrics, the problem is strictly improperness, not circularity.

  **2. The Motivation: Accuracy vs. Verisimilitude**
  You are right to worry that this changes the subject. Standard accuracy-first epistemology defines epistemic value strictly as proximity to truth-values (0 or 1). Your proposal introduces *verisimilitude* (closeness to truth in content space) as a fundamental epistemic good. These are mathematically distinct: accuracy is satisfied by being certain of a tautology; verisimilitude is not. You cannot absorb verisimilitude into standard accuracy-first frameworks without breaking the technical machinery (specifically, the link between propriety and probabilism). If you define "accuracy" broadly enough to include truthlikeness, you lose the formal results that make accuracy-first attractive (like the derivation of conditionalization). If you keep the narrow definition, you exclude truthlikeness by fiat. There is no version of the proposal that keeps the sole good as "standard accuracy" while giving credit for near-misses; near-misses are irrelevant to truth-value matching.

  **3. Strategic Advice**
  Do not try to save the accuracy-first program with this modification; you will not be able to derive probabilism or conditionalization in the standard way. Instead, frame the paper as a limit-case result showing *why* accuracy-first epistemology has historically ignored truthlikeness. Your result demonstrates that incorporating truthlikeness constraints is incompatible with the propriety conditions required to justify probabilistic norms via dominance arguments. This is a significant negative result: it shows that accuracy-firsters must choose between maintaining their formal derivations of rationality or accommodating the intuitive idea that being "almost right" has epistemic value. That tension is a compelling contribution to the literature.
