      *   **Neural Latencies:** They ignore specific neural transmission times (V1 vs. MT vs. Prefrontal). We know V1 activates before MT. If the "color change" correlates with MT activity *before* V4 color processing is complete, that favors Stalinesque. If V4 fires then is suppressed, that favors Orwellian.
