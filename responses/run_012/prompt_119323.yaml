      *   *Daniel on Causal Powers:* **Right.** If a state exists, it must have causal consequences. This is a core tenet of physicalism.
      *   *Mira on Counterfactuals:* **Right.** You can't easily isolate the "unrevised" state without disrupting the system that causes the illusion.
      *   *Daniel on "Proves Too Much":* **Right.** If "no finish line" means "no fact of the matter about timing," it threatens all psychophysics.
      *   *Mira on Semantics:* **Partially Right.** If empirical distinction is impossible, the distinction *does* become semantic/definitional.
      *   *Daniel on Levels:* **Right (mostly).** This is a Rylean/Dennettian move. The "Orwellian/Stalinesque" distinction might be a false dichotomy if consciousness is a functional construct.

