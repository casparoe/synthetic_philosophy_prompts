      *   *Nuance:* Modern neuroscience suggests the "Stalinesque" model is closer to how predictive coding works (construction before awareness), but the "Orwellian" memory revision also happens. It's likely a mix, making the dichotomy false.

      *Refining the "Who is Right" section:*
