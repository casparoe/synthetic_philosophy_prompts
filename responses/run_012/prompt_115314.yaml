answer: |-
  We hold that Northline's relationship with its drivers does not constitute a relation of domination under the statute.

  The closest precedent is *Ardent Logistics*. In both instances, workers operate within a competitive market where engaging multiple employers is feasible, despite the employer holding significant operational authority. To reconcile our four prior cases, we identify three potential rules of decision. First, the Exit Rule: domination exists only where significant barriers prevent leaving the relationship. Second, the Unilateral Power Rule: domination exists where an employer may alter terms or punish without independent review. Third, the Recourse Rule: domination exists where the worker lacks a meaningful forum to contest adverse decisions.

  The Exit Rule fits *Kestrel Basin* and *Dalal*, where domination was found due to geographic isolation and visa ties, and *Ardent* and *Whitcomb*, where no domination was found due to market alternatives. Applied to Northline, the Exit Rule predicts no domination because drivers own their assets and frequently work for competitors. The Unilateral Power and Recourse Rules fit *Kestrel* and *Dalal*, where employers controlled terms and denied forums, and *Ardent* and *Whitcomb*, where binding agreements constrained power. Applied to Northline, these rules predict domination because the platform changes rate formulas and deactivates accounts without binding arbitration or transparent review.

  We adopt the Exit Rule as dispositive. *Kestrel* and *Dalal* turned on the workers' inability to leave due to external constraints, whereas *Ardent* and *Whitcomb* turned on the presence of market alternatives, regardless of formal supervisory authority. Internal procedural deficits do not create statutory domination when the worker is free to exit. A future case involving a platform with near-total market share, rendering competitor work economically impossible despite legal permission, would separate the Exit Rule from the Unilateral Power Rule cleanly.

  These precedents commit us to a conception of liberty requiring viable exit options rather than merely the absence of direct interference. We would rule oppositely if evidence showed Northline's market share made exit illusory, though our reasoning fails if algorithmic control itself constitutes domination regardless of market alternatives.
