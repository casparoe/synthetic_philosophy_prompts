answer: |-
  ### Case Study: The Calibrated Salmon Model

  **The Scenario**
  You are the senior modeler at a Regional Fisheries Management Office. For years, you have tracked the sockeye salmon run. **Evidence ($E$):** "The 2023 peak run occurred on October 14." You have known $E$ with certainty since the season ended. In January 2024, you are tasked with formalizing a spawning trigger hypothesis. **Hypothesis ($H$):** "The thermal spawning trigger for this population is exactly 12.4°C." You do not derive 12.4°C from first principles; rather, you run the population dynamics model backward, adjusting the temperature parameter until the output aligns perfectly with the known peak date of October 14. You fix $H$ at 12.4°C *because* it yields $E$. A **Newcomer** (a consultant) arrives in February. You hand her the finalized model ($H$) and the historical log ($E$). She sees that $H$ entails $E$ perfectly. She does not know you tuned the parameter to match the log; she treats $H$ as a standalone theoretical claim.

  **The Bookkeeping**

  1.  **The Veteran (Actual):**
      *   $P(E) = 1$ (Known fact).
      *   $P(H)$ is modest (a specific parameter value among many possibilities).
      *   **Standard Conditioning:** $P(H | E) = P(H) \times P(E | H) / P(E) = P(H) \times 1 / 1 = P(H)$.
      *   **Result:** Zero confirmation. (The Problem of Old Evidence).

  2.  **The Counterfactual Repair:**
      *   **Stipulation:** We construct a counterfactual Veteran ($V_{cf}$) who is identical to you in every way *except* she does not know $E$. Crucially, to make the comparison well-defined, we must stipulate that $V_{cf}$ still holds $H$ fixed as the proposition "The trigger is 12.4°C," but she lacks the knowledge that this value was selected *for* $E$. She treats $H$ as a bold conjecture.
      *   $P_{cf}(H)$ is low (specific parameter).
      *   $P_{cf}(E)$ is low (the peak could have been any day in Sept/Nov).
      *   $P_{cf}(E | H) = 1$ (The model is deterministic).
      *   **Update:** Upon learning $E$, $P_{cf}(H | E) = P_{cf}(H) / P_{cf}(E)$. Since $P_{cf}(E)$ is small, the posterior is near 1.
      *   **Result:** Spectacular confirmation. The counterfactual repair claims $E$ strongly supports $H$ for you.

  3.  **The Logical-Fact Repair:**
      *   **Mechanism:** The evidence is not $E$, but the logical proposition $E^*$: "$H$ entails $E$."
      *   **Veteran's State:** Because you constructed $H$ specifically to satisfy $E$, you knew $E^*$ was true the moment you finalized $H$. $P(E^*) = 1$ before and after the "realization."
      *   **Update:** Conditioning on a certainty yields no change. $P(H | E^*) = P(H)$.
      *   **Result:** Almost no confirmation.
      *   **Structural Feature:** **Accommodation.** The entailment is a design specification, not a discovery. The logical connection was guaranteed by the method of construction, so learning it provides no information about the truth of $H$, only its consistency.

  **The Conflict and Defense**

  The divergence is stark. The Counterfactual Repair says $E$ confirms $H$ massively; the Logical-Fact Repair says it confirms $H$ not at all. You believe the Logical-Fact verdict is correct: accommodation should not confer the same confirmatory weight as prediction.

  **The Counterfactual Defender's Attack**
  A defender of the Counterfactual Repair will argue you have **smuggled in an illicit difference** between the Actual and Counterfactual agents. They will say: "To get the spectacular boost, you stipulated that $V_{cf}$ treats $H$ as a bold conjecture. But the Actual Veteran knows $H$ was *selected* for $E$. If $V_{cf}$ is truly identical except for $E$, she must also know that $H$ was selected to fit *whatever the data turned out to be*."

  If $V_{cf}$ knows $H$ was gerrymandered to fit the data (even if she doesn't know *which* data), the boost vanishes. Why? Because she knows that *some* hypothesis could be found to fit any data. The likelihood ratio $P(E | H) / P(E)$ collapses because $P(E | \text{Accommodation Method}) \approx P(E)$.

  **Can the Defense be Made Good?**
  No, not without abandoning the repair's purpose.
  1.  If $V_{cf}$ *does not* know $H$ was accommodated, she is not epistemically identical to the Veteran. The comparison measures the support $E$ gives to a *predicted* $H$, not an *accommodated* $H$. It fails to measure the support the Veteran *actually* has.
  2.  If $V_{cf}$ *does* know $H$ was accommodated, the counterfactual boost disappears (converging with the Logical-Fact verdict).
  Therefore, the Counterfactual Repair only yields "spectacular confirmation" by ignoring the history of $H$'s construction. It measures *surprise* relative to ignorance, not *support* relative to background knowledge. It cannot distinguish prediction from accommodation unless that distinction is explicitly coded into the counterfactual agent's background theory, in which case it ceases to be a general solution to the POE and becomes a specific model of the prediction/accommodation asymmetry.

  **Dropping Constraint (iv): The Prediction Case**

  Suppose you drop the accommodation constraint. $H$ ("The trigger is 12.4°C") is framed in 2022 based on lab physiology. $E$ ("Peak run Oct 14, 2023") is observed later.

  1.  **Veteran:** $P(E) < 1$ initially. Standard conditioning applies. $P(H | E) > P(H)$. The POE dissolves because $E$ is not old.
  2.  **Logical-Fact:** The Veteran learns "$H$ entails $E$." Since $H$ was not built for $E$, this is a new discovery about the world (that the physiological model successfully tracks the run). $P(E^*) < 1$. Conditioning on $E^*$ boosts $H$.
  3.  **Convergence:** Both repairs now report substantial confirmation.
  4.  **Asymmetry:** The asymmetry between the Veteran (Accommodation case) and the Newcomer (who treats the accommodated $H$ as a prediction) is **defensible**. The Newcomer is irrational if she ignores the history of $H$. If she is told "$H$ was tuned to fit $E$," her credence should drop to match the Veteran's. The case shows the POE is resolved *if* we accept that logical entailment alone does not confirm; the *context of discovery* (whether the entailment was guaranteed by construction) matters. The Logical-Fact repair captures this; the Counterfactual repair obscures it.

  **Conclusion for the Seminar**
  This case demonstrates that the Counterfactual Repair is too coarse-grained. It measures the probability boost relative to *ignorance of E*, whereas confirmation should measure the boost relative to *alternative explanations for the fit*. In accommodation, the alternative explanation ("the model was tuned") is salient for the Veteran but erased in the Counterfactual scenario. The Logical-Fact repair, by focusing on the novelty of the entailment itself, correctly identifies that no new logical ground has been gained. The puzzle is not that old evidence cannot confirm, but that *accommodated* evidence should not confirm as strongly as *predicted* evidence, and only the Logical-Fact approach (or a Counterfactual approach that rigorously includes the history of construction) respects that distinction.
