      *   *The Insight:* He remembers his old philosophy texts (maybe smuggled or from before the Purge). The distinction between the shadow and the substance.
      *   *The Confrontation:* Kroll wants a signature. "Is it sedition?" Elias realizes music isn't about sedition. Sedition is an idea. Music is the energy behind sedition *and* loyalty.
      *   *The Ending:* He approves it, but with a specific justification that neutralizes the censorship attempt by exposing its impossibility. Or he realizes he can't ban it because it *is* the Will of the state too. Let's make it personal. He realizes the music is the pulse of life itself, which the state tries to regulate but cannot truly own.

      *Refining the Ending:* Schopenhauer says music is the Will. The Will is blind striving. The State tries to channel the Will. If music *is* the Will, it's dangerous because it wakes people up to the striving itself, not the object. But if you ban it, you deny the Will. Let's have Elias realize that the music cannot be guilty because it precedes guilt. It is the engine, not the vehicle.

