answer: |-
  The form on Elias's desk was standard issue for the Bureau of Cultural Integrity. Box 1: Title. Box 2: Composer. Box 3: Statement of Meaning.

  It was Box 3 that stopped the breath in his throat. The Republic required art to be useful. A painting had to depict the dignity of labor. A poem had to celebrate the harvest. Even a sculpture needed to embody the strength of the border guard. Art was a vessel; the State poured the message in, and the people drank.

  But the object spinning on the turntable before him was a leak in the hull.

  It was a piano piece. *Study in Motion*, the label read. No composer listed. It had been intercepted at a postal checkpoint, wrapped in oilcloth, sent to a woman in Sector 4 who claimed she didn't order it. Now it sat on Elias's desk, a black vinyl disc rotating in the sterile silence of his office.

  Elias picked up his pen. He lowered the needle.

  The piano began. It wasn't a melody, not really. It was a sequence of tensions. A low chord struck, held, vibrating in the floorboards, then a higher note that didn't resolve but instead climbed, urgent, desperate, only to fall back into the churn.

  Elias wrote: *The struggle of the worker against hardship.*

  He listened for ten more seconds. The music shifted. The urgency didn't vanish; it deepened. It wasn't about a worker. It wasn't about hardship. Those were things in the world. This sound felt like it was coming from inside his own ribcage. It felt like hunger, but not hunger for food. It felt like longing, but not for a person.

  He crossed out the sentence.

  He tried again. *The inevitability of fate.*

  No. Fate implies a story, a beginning and an end. This music had no beginning; it seemed to have been playing before he entered the room, and it would continue after he left. It wasn't telling a story about life. It was the pulse of life itself, stripped of the skin.

  Elias rubbed his eyes. The Bureau's guidelines were clear: *All art must be paraphrasable.* If you cannot write down what it means, you cannot verify its loyalty. Painting copies the world, so you check if the world depicted is the correct one. Poetry copies ideas, so you check if the ideas are sanctioned.

  But this… this didn't copy anything.

  He remembered a book he'd read before the Purge, a forbidden text by a German philosopher. The man had argued that other arts are shadows on the wall. They show us the shapes of things—trees, lovers, battles. But music… the book claimed music was the fire casting the shadows. It didn't represent the world. It was the inner essence of the world, naked and walking around.

  The piano piece swelled. A dissonance crashed, painful and sharp, then resolved into a trembling quiet. Elias felt his chest tighten. He wasn't thinking about the Republic. He wasn't thinking about his job. He was feeling the raw ache of wanting something he couldn't name. It was terrifying. It was intoxicating.

  The door opened. Director Kroll stepped in, his boots clicking on the linoleum.

  "Time's up, Elias. Is it sedition?"

  Elias lifted the needle. The silence rushed back in, heavy and dead compared to the vibration still humming in his bones.

  "I can't fill out the form," Elias said.

  Kroll leaned against the doorframe, lighting a cigarette. "Why not? Is the meaning too complex?"

  "No. It's that… it doesn't have one."

  Kroll exhaled smoke. "Everything has a meaning. If it makes people feel something, that feeling has a source. Find the source. Is it encouraging dissent? Is it promoting decadence?"

  "It's not promoting anything," Elias said, his voice sounding thin to his own ears. "A painting shows a riot. You can ban the painting because it shows a riot. A poem says 'overthrow the tyrant.' You can ban the poem because it says the words."

  Elias gestured to the turntable. "This doesn't say anything. It doesn't show a riot. It *is* the energy of the riot. It's also the energy of the loyalty. It's the same force."

  Kroll frowned, tapping ash onto the floor. "You're speaking in riddles. That makes me suspicious."

  "Think about it," Elias pressed, standing up. He felt a strange clarity, the kind that comes when you realize the rules of a game are fake. "If I paint a soldier crying, you can say that's weak. If I write a song about a soldier crying, you can say the lyrics are defeatist. But this?" He tapped the vinyl. "This is just the crying. It's the will to cry. It bypasses the soldier. It bypasses the war."

  Kroll stepped closer, his eyes narrowing. "So you're saying it's harmless."

  "No," Elias said. "I'm saying it's dangerous. But not in the way you can arrest."

  He looked at the form. Box 3 stared back at him. *Statement of Meaning.*

  "If you ban this," Elias said, "you admit that you're afraid of feeling itself. You're saying the State owns not just what we think, but how we pulse. You can censor the Ideas. You can censor the Images. But this?" He shook his head. "This is the Will. It's the engine. You can't censor the engine without stopping the car."

  Kroll stared at him for a long moment. The smoke curled between them. He knew the philosophy, too, probably. They all had, before they burned the books. They knew that music was the only art that didn't walk in the shadow of the world. It walked in the dark where the world was made.

  "If I approve it," Kroll said quietly, "people will listen. They will feel… this." He gestured vaguely at his own chest. "And they might not be content with the world we've built for them."

  "They might not be content with the silence," Elias corrected.

  "Then it is subversive."

  "By definition," Elias said. "But not by content. There is no content to charge. The law requires a statement of meaning. I cannot write one. Therefore, legally, the piece does not exist as art. It exists as… weather. As gravity."

  Elias sat back down. He picked up the pen. He looked at Box 3.

  If he wrote *None*, they would hang him. If he wrote *Freedom*, they would hang him.

  But Schopenhauer was right. The music wasn't about freedom. It was about the striving that makes freedom desirable. It was the blind urge that keeps a man breathing even when he wants to stop. The State could command the body, and it could command the mind, but it could not command the Will without becoming the Will itself. And the State was dead matter. It needed living people to drive it.

  Elias realized then that the music wasn't a weapon against the State. It was the fuel the State stole to keep running. To ban it would be to cut off their own power source. They needed the workers to strive, to want, to hunger. They just wanted to direct that hunger toward quotas and borders. But this music… this music reminded the hunger that it was hunger, not just a tool.

  It was more dangerous than sedition. Sedition proposes a new government. Music proposes a new way of being alive.

  Kroll was waiting. His hand rested near the pistol on his hip.

  Elias dipped the pen. He couldn't write the truth. But he could write the loophole.

  He wrote: *Content Indeterminate. Phenomenal Reference: Null.*

  He looked up at Kroll. "It's not art, Director. It's physics. You can't ban gravity."

  Kroll studied the form. He studied Elias. He knew what was happening. He knew that by classifying it as null, Elias was acknowledging the void behind the curtain. If the meaning was null, the censorship law didn't apply. The law governed messages. This was noise. Pure, unadulterated noise of the soul.

  Kroll took the form. He read it twice.

  "If I send this up," Kroll said, "they'll ask questions."

  "Then tell them the truth," Elias said. "Tell them it's empty."

  Kroll looked at the turntable. The silence in the room was absolute, but the memory of the sound hung in the air, vibrating against the glass of the window. It was the sound of something wild that had never been tamed, never been named.

  Kroll tucked the form into his pocket. He didn't light another cigarette. He looked tired, suddenly. The power of the State was heavy, but the power of the Will was heavier.

  "Play it again," Kroll said.

  Elias lowered the needle.

  The piano began its striving, its endless, objectless wanting. It filled the room, bypassing their uniforms, their ranks, their laws. For three minutes, there was no Bureau, no Republic, no censor and no director. There was only the sound of the world trying to be born, over and over, failing, and trying again.

  Kroll listened until the record ended. He didn't say anything. He just turned and walked out, leaving the door open.

  Elias sat alone in the quiet. He looked at Box 3 on the carbon copy of the form. He hadn't saved the piece because it was safe. He had saved it because it was inevitable. You can ban the map, but you cannot ban the terrain.

  He spun the record again. He let the Will speak. It had nothing to say, and that was the only thing that mattered.
