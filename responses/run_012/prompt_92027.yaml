answer: |-
  # The Historical Judgment Sorter

  This instrument sorts your intuitions about figures like Thomas Jefferson (slave-owning founder) and Winston Churchill (imperial war leader) into twelve distinct positions. It does not tell you which position is correct. It tells you which position you already hold.

  There are four diagnostic questions. Answer them based on your gut reaction to the examples provided. Do not try to guess which answer leads to which result.

  ### Part 1: The Diagnostic Questions

  **Q1. The Time Test (Knowledge)**
  *Imagine a historical figure did something we now call cruel (e.g., Jefferson owning slaves). Is it fair to call **them** cruel if their neighbors thought it was normal?*
  *   **(A)** Yes, cruelty is cruelty, regardless of the era.
  *   **(B)** No, blame requires that they could have known better at the time.

  **Q2. The Target Test (Object)**
  *When we argue about these figures, what is the primary thing we are judging?*
  *   **(A)** The Person (Their character and soul).
  *   **(B)** The Honour (The statues, names on buildings, and holidays we keep).
  *   **(C)** The System (The institutions of slavery, empire, or government they served).

  **Q3. The Scale Test (Greatness vs. Goodness)**
  *Can a man be a "Great Statesman" if he was a "Bad Human"?*
  *   **(A)** No, moral failure reduces their greatness; they sit on a single scale.
  *   **(B)** Yes, greatness and goodness are separate ledgers; one does not cancel the other.

  **Q4. The Witness Test (Contestation)**
  *Does it matter if people **at the time** told them they were wrong?*
  *   **(A)** Yes, it is worse if they were warned by contemporaries (e.g., Churchill vs. critics of the Bengal Famine).
  *   **(B)** No, the act is what matters, not whether anyone complained back then.

  ---

  ### Part 2: The Scoring Key

  Match your four answers (e.g., 1A, 2B, 3A, 4B) to the Leaf Number below. If your combination does not appear, see Part 4 (The Gaps).

  | Q1 (Time) | Q2 (Target) | Q3 (Scale) | Q4 (Witness) | **LEAF NUMBER** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** (Universal) | **A** (Person) | **A** (Single) | **B** (No) | **1** |
  | **A** (Universal) | **A** (Person) | **B** (Separate) | **B** (No) | **2** |
  | **B** (Context) | **A** (Person) | **A** (Single) | **A** (Yes) | **3** |
  | **A** (Universal) | **B** (Honour) | **B** (Separate) | **B** (No) | **4** |
  | **B** (Context) | **C** (System) | **N/A** | **N/A** | **5** |
  | **B** (Context) | **A** (Person) | **A** (Single) | **B** (No) | **6** |
  | **A** (Universal) | **A** (Person) | **A** (Single) | **A** (Yes) | **7** |
  | **B** (Context) | **B** (Honour) | **B** (Separate) | **B** (No) | **8** |
  | **A** (Universal) | **B** (Honour) | **A** (Single) | **B** (No) | **9** |
  | **B** (Context) | **A** (Person) | **B** (Separate) | **A** (Yes) | **10** |
  | **A** (Universal) | **C** (System) | **N/A** | **N/A** | **11** |
  | **B** (Context) | **B** (Honour) | **A** (Single) | **A** (Yes) | **12** |

  *(Note: For Leaves 5 and 11, the Scale and Witness questions are less relevant because the focus is structural, not individual.)*

  ---

  ### Part 3: The Twelve Leaves

  Read the description for your Leaf Number. Each includes the required position phrasing (where applicable), an ordinary language name, and its "awkward commitment."

  **1. The Moral Absolutist**
  *Position:* **Present-day judgment is straightforwardly valid.**
  *View:* Jefferson was a slaveholder; slavery is wrong; therefore Jefferson was wrong. Time does not excuse morality.
  *   **Awkward Commitment:** You must accept that almost everyone in the past was morally wicked, making history a gallery of villains.
  *   *Examples:* Jefferson (Slavery), Churchill (Empire), **Genghis Khan** (Mass Slaughter).

  **2. The Act Separator**
  *Position:* **It is valid of acts but never of persons.**
  *View:* We can condemn the act of owning slaves without condemning Jefferson's entire soul or legacy as a person.
  *   **Awkward Commitment:** You must maintain a difficult distinction between a man's deeds and his character, as if they do not define him.
  *   *Examples:* Jefferson (Slavery), Churchill (Bengal).

  **3. The Hypocrisy Hunter**
  *Position:* **It is valid only where the person's own stated standards already condemned the conduct.**
  *View:* We judge Jefferson because he wrote "all men are created equal" while holding slaves. We judge Churchill less if he genuinely believed in imperial hierarchy.
  *   **Awkward Commitment:** You must forgive a consistent tyrant while punishing a flawed idealist who failed their own high bar.
  *   *Examples:* Jefferson (Hypocrisy), Churchill (Inconsistency).

  **4. The Memorial Pragmatist**
  *Position:* **The real question is what our commemorations say now.**
  *View:* It does not matter if Jefferson was good or bad; it matters if a statue of him makes Black citizens feel unwelcome today.
  *   **Awkward Commitment:** You must accept that a statue might stay up in one city and come down in another, depending on local feelings, not historical truth.
  *   *Examples:* Jefferson (Statues), Churchill (Parliament Square).

  **5. The Structuralist**
  *Position:* **We should refuse verdicts on persons altogether and judge only institutions.**
  *View:* Focusing on Jefferson distracts from the institution of slavery. Focus on the law, not the lawmaker.
  *   **Awkward Commitment:** You must ignore the agency of individuals, treating leaders as mere cogs in a machine they helped build.
  *   *Examples:* Slavery (Institution), Empire (System), **Genghis Khan** (War Machine).

  **6. The Hard Contextualist**
  *Position:* **Never judge the past by present standards.**
  *View:* If everyone in 1800 owned slaves, Jefferson was morally normal. To blame him is to misunderstand history.
  *   **Awkward Commitment:** You must accept that some acts (like genocide) might be "acceptable" if the whole society agreed at the time.
  *   *Examples:* Jefferson (Normalcy), **Genghis Khan** (Conquest Norms).

  **7. The Aggravated Guilt**
  *Position:* **Present-day judgment is valid, but worse if they were warned.**
  *View:* Jefferson is blameworthy, but Churchill is *more* blameworthy because contemporaries warned him about the Bengal Famine.
  *   **Awkward Commitment:** You must hold two tiers of blame, arguing that ignorance is a partial excuse even for universal evils.
  *   *Examples:* Churchill (Famine), Jefferson (Critics of Slavery).

  **8. The Heritage Keeper**
  *Position:* **Honour and Morality are separate; keep the statue, teach the flaw.**
  *View:* Churchill did bad things, but he won the war. The statue honours the victory, not the man's soul.
  *   **Awkward Commitment:** You must defend public honours for people you privately admit were morally compromised.
  *   *Examples:* Churchill (War Leader), Jefferson (Founder).

  **9. The Purifier**
  *Position:* **Moral badness cancels public honour.**
  *View:* If Jefferson was morally bad (Universal), his name does not belong on a school, regardless of his greatness.
  *   **Awkward Commitment:** You must be willing to erase history's most effective leaders if their private morals do not meet your standard.
  *   *Examples:* Jefferson (School Names), Churchill (Honours).

  **10. The Dual Ledger Biographer**
  *Position:* **Greatness and Goodness are independent; list both.**
  *View:* Jefferson was a great architect of liberty and a bad slaveholder. Both facts sit side-by-side without canceling.
  *   **Awkward Commitment:** You must resist the human urge to resolve the tension, living with the discomfort of a "Great Bad Man."
  *   *Examples:* Jefferson (Founder/Slaveholder), Churchill (Savior/Imperialist).

  **11. The Systemic Reformer**
  *Position:* **Judge only institutions, but apply present-day morals to them.**
  *View:* Slavery was wrong then and now. We judge the system of slavery, not just Jefferson, but we judge it by our standards.
  *   **Awkward Commitment:** You must condemn the past society as a whole while refusing to condemn the individuals who lived in it.
  *   *Examples:* Slavery (System), Empire (System).

  **12. The Contemporary Witness**
  *Position:* **Blame depends on internal dissent.**
  *View:* We judge Jefferson harshly because there were abolitionists in 1776. We judge **Genghis Khan** differently because no one in his world argued against conquest.
  *   **Awkward Commitment:** You must treat the same act (killing) differently based on whether a protester was standing nearby at the time.
  *   *Examples:* Jefferson (Abolitionists existed), **Genghis Khan** (No internal dissent).

  ---

  ### Part 4: The Gaps and The Blurs

  **Empty Combinations (The Gaps)**
  Some combinations of answers yield no Leaf. This reveals where the logic breaks.
  1.  **Q1(B) Context + Q2(A) Person + Q3(A) Single + Q4(B) No Witness:** *The Incoherent Historicist.* You say we must use historical context (1B), but you judge the person as a single moral scale (3A), yet ignore whether their contemporaries objected (4B). If you use context, the witness *must* matter. This looks like **incoherence**.
  2.  **Q1(A) Universal + Q2(C) System + Q3(A) Single:** *The Moralizing Structuralist.* You judge only systems (2C), but you want to collapse greatness and goodness on a single scale (3A). Systems don't have "greatness" in the same way persons do. This looks like **neglect** of the distinction between human and institutional agency.
  3.  **Q1(B) Context + Q2(B) Honour + Q3(A) Single + Q4(B) No Witness:** *The Unattractive Traditionalist.* You say we should use historical context (1B), but you judge honours by a single moral scale (3A) while ignoring contemporary dissent (4B). This implies keeping statues of people who were considered wicked *even then*. This looks like **unattractiveness**.

  **Indistinguishable Leaves (The Blurs)**
  The questions cannot perfectly separate these positions.
  1.  **Leaf 4 (Memorial Pragmatist) and Leaf 9 (Purifier):** Both result in removing statues. The tool separates them by *intent* (feelings now vs. moral validity), but the *outcome* is identical. The questions cannot pull apart the *reason* for removal from the *act* of removal.
  2.  **Leaf 5 (Structuralist) and Leaf 11 (Systemic Reformer):** Both judge institutions. The tool separates them by *time standard* (Context vs. Universal), but in practice, judging an institution often requires judging the people who ran it. The questions cannot fully isolate the System from the Person.
  3.  **Leaf 6 (Hard Contextualist) and Leaf 12 (Contemporary Witness):** Both rely on historical context. Leaf 12 is a subset of Leaf 6. If you are a Hard Contextualist, you usually accept the Witness test. The questions treat them as distinct branches, but they are often the same mindset with different thresholds.

  **The Uncontested Case**
  *   **Genghis Khan:** Used in Leaves 1, 5, 6, and 12.
  *   *Why:* Unlike Jefferson (where abolitionists existed) or Churchill (where famine critics existed), the Mongol destruction of cities was a standard tool of empire. No significant moral voice in the 13th Century argued that conquering and razing cities was inherently "evil" in the way we define it. This tests whether your judgment relies on *Universal Morality* (Leaf 1) or *Contemporary Dissent* (Leaf 12).
