      *   Key concept: *Multiple Realizability.* The fact that different weights can do the same task doesn't mean there's no representation; it means the *substrate* varies, but the *function* might be stable.
      *   Key concept: *Generalization.* The strongest argument for real representations is out-of-distribution generalization. If a network learns a concept, it should apply it to new cases, not just memorize inputs.

