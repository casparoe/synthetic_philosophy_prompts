prompt: |-
  I'm a third-year PhD student in philosophy working on moral psychology — specifically the cross-cultural stuff, how people's moral intuitions get shaped by the legal and administrative culture they grew up inside. I'm drafting a chapter on a contrast I keep running into and can't quite get clean: a broadly German pattern where the moral demand is to fit yourself to a shared, impersonal order — rules, punctuality, quiet hours, the stairwell rota, the whole Ordnung thing — and a broadly American pattern where the moral demand is to follow your own conscience and not be pushed around, with rules being legit only insofar as they're yours or you consented to them. I know these are crude ideal types, there's plenty of both in both places, and I'm not asking you to defend the sociology. I'm asking about a philosophical question that falls out of it.

  What I want is an example of a concrete, specific situation — the kind of thing that could actually happen on a Tuesday — in which these two ways of thinking about morality give opposite verdicts, and where it's genuinely not obvious which one has the better of it. Please don't hand me the stock cases: trolleys, Nazi obedience, civil disobedience, masks. I've wrote about all of those and they're picked over. I want something more mundane and more in the weeds, where the disagreement is about what morality even asks for, not about the stakes. The register I mean is like: your neighbor keeps putting his bins out on the wrong day and it's technically a fine; your lease says you do the Kehrwoche (the rota where everyone scrubs the shared staircase) and the new American tenant thinks that's insane; you're expected to report a coworker's expense irregularity because that's the procedure, and he's your friend. Don't just grab one of mine though — come up with your own if you've got a better one, or use one of these only if it really is the strongest candidate.

  You're a philosopher who works on comparative moral psychology, so please think carefully rather than free-associating. Start by brainstorming four or five candidate cases and saying in a line each why most of them are actually boring (one side is plainly right, or it's just a clash of interests dressed up as a clash of moralities), then pick the one that survives and go deep on it. For that case, work out the German-style verdict and the American-style verdict at the level of what each says morality consists in — not merely what it permits — and then tell me which side you think has the better of it and why. And say whether the case ends up making you doubt the ideal types themselves, because I half suspect the contrast only looks sharp from far away. Whatever you do, don't let the two sides collapse into 'duty vs. freedom' or 'collectivism vs. individualism'; those are exactly the labels I'm trying to get past.
