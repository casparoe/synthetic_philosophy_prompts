answer: |-
  Your friend is mathematically right but practically wrong. He is citing I.J. Good's 1967 theorem, which proves that for a Bayesian agent maximizing expected utility, the expected value of free information is always non-negative. His logic is: "If the info helps, you use it. If it doesn't help, you ignore it. You never lose."

  The flaw isn't in his math; it's in his definition of "utility." Good's Theorem assumes your happiness depends only on *what happens in the world* and *what actions you take*. It assumes the *state of knowing* has no value or cost of its own. Your intuition correctly identifies that for humans, the state of knowing often carries a heavy price tag (anxiety, ruined surprise, moral burden) or a reward (curiosity, closure) independent of any action you can take.

  Here is the cleanest principle that captures your list, separating the two competing forces.

  ### The Principle of Separated Value

  The total value of information is the sum of two distinct components:

  1.  **Instrumental Value:** Does this information allow me to change my actions to produce a better outcome in the world? (This is all Good's Theorem measures).
  2.  **Constitutive Value:** Does the mere state of *holding this belief* directly increase or decrease my well-being, regardless of what I do? (This is what Good's Theorem ignores).

  **The Rule:** A rational agent should seek information only if **Instrumental Value + Constitutive Value > 0**.

  Your friend is arguing that Instrumental Value is never negative. He is right. But he ignores Constitutive Value, which is often negative enough to drag the total below zero.

  ### Applying the Principle to Your List

  This principle cleanly sorts your intuitions without calling them "confused."

  *   **Antibiotics / Career Test (Before):** High Instrumental Value. You can act to cure the infection or pick the better job. Constitutive Value is neutral or positive. **Verdict: Look.**
  *   **Gene Test / Death Date / Partner Location:** Zero Instrumental Value (no treatment / can't change death / checking fuels anxiety). High Negative Constitutive Value (dread / ruin of life / relationship erosion). **Verdict: Don't Look.**
  *   **Novel Spoiler (Before):** Zero Instrumental Value. Negative Constitutive Value (ruins the experience of reading). **Verdict: Don't Look.**
  *   **Novel Spoiler (After) / Uncle's Death:** Zero Instrumental Value. Positive Constitutive Value (closure / truth / satisfaction). **Verdict: Look.**
  *   **Partner's Past Fling / Friend's Cheating Spouse:** Zero or Negative Instrumental Value (you're staying together / you're forced into a moral dilemma). Negative Constitutive Value (jealousy / burden of secrecy). **Verdict: Don't Look.**

  ### The Two Verdicts You Must Give Up

  Your intuition is mostly consistent with the Separated Value principle, but two of your specific verdicts contradict your own logic. To be consistent, you need to adjust these:

  **1. The Career Test (After)**
  *   **Your Verdict:** "Worthless to me, and yet I'd still peek."
  *   **The Correction:** You must give up the claim that it is **worthless**. If you choose to peek, the information has positive value to you. Since the Instrumental Value is zero (you can't change the contract), the Constitutive Value must be positive (curiosity). You cannot call it worthless and peek at the same time. Admit that curiosity is a form of utility.

  **2. The Partner Leaving Test**
  *   **Your Verdict:** "I want it, but I also think this one isn't really free."
  *   **The Correction:** You must give up the claim that **you want it** (in a decision-theory sense). You admit the looking changes the world (a self-fulfilling prophecy). If knowing the answer increases the chance they leave, and you want them to stay, the Instrumental Value is *negative*. Unless you value "certainty of doom" over "chance of survival" (a specific Constitutive Value), a rational agent seeking to preserve the relationship should decline. You are conflating "wanting to know the truth" with "wanting the best outcome." Good's Theorem assumes the former doesn't sabotage the latter. In this case, it does.

  ### Prediction: The "Happy Kid" Test

  **Case:** A free test tells you whether your future second child will grow up happy. Offered *before* you decide whether to conceive.

  **Analysis:**
  *   **Instrumental Value:** Extremely High. If the test says "Unhappy," you can choose not to conceive, preventing a lifetime of suffering for the child and potential regret for you. If "Happy," you proceed with confidence. This changes your action significantly.
  *   **Constitutive Value:** Negative. Carrying the knowledge that a potential child *would have* been unhappy is a burden. It feels like playing God.
  *   **Prediction:** **Take the test.**
      In this specific case, the Instrumental Value (preventing actual suffering) overwhelmingly outweighs the Constitutive Cost (the pain of the counterfactual knowledge). Unlike the "Gene Test" where you can't fix the problem, here the "fix" is a decision you haven't made yet. The ability to prevent harm makes the information too valuable to refuse, even if it's painful to hold.

  ### Does "Offered vs. Lands on You" Matter?

  Your friend's distinction—that the theorem only applies to information you *choose* to look at, not news that forces itself on you—does **no work** in saving his argument.

  Good's Theorem is specifically about the *choice* to acquire information. It claims that if you are offered the look, you should always take it. Your counterexamples (the gene test, the spoiler, the cheating spouse) are all cases where the information is *offered*, and your rational choice is to decline.

  The distinction matters for *responsibility* (you aren't irrational if news lands on you), but it doesn't fix the theorem. The theorem fails on "offered" cases whenever the Constitutive Value of knowing is negative. Your friend is trying to use the distinction to say "If you didn't ask, you're not irrational," but the argument is about whether you *should* ask. On that point, he is wrong.

  **Summary:** Your friend is defending a mathematical tautology about instrumental action. You are defending a psychological reality about human well-being. Use the Separated Value principle. It validates your gut while pinpointing exactly where your own definitions need tightening.
