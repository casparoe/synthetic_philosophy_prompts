answer: |-
  ### The proposition, pinned down

  The claim is true if, in 2125, standard physics pedagogy and research treat quantum fields and curved spacetime as ontologically genuine entities that exist independently of measurement, even if derived from a deeper theory. It is false if they are treated like caloric or the luminiferous ether: useful mathematical fictions discarded by the successor theory's fundamental ontology. Settling this requires inspecting 2125 textbooks to see if these entities are described as "emergent approximations of real stuff" (true) or "effective scaffolding for calculating observations" (false).

  ### Headline number

  **70%**. This reflects a "structural realist" stance: the mathematics is too successful to be wholly fictitious, but the ontology may shift. Note: This number is **not robust** to your counting convention. Under your austere rule (limits count as survival), it holds. Under a generous rule (any modification counts as replacement), the credence drops to **40%**, as almost no past ontology survives modification intact.

  ### The decomposition

  1.  **Base Rate (Austere):** 0.80. Using your convention, Newtonian gravity survives as a limit of GR, inflating survival statistics. Most historical "replacements" are actually boundary-settings. Under the opposite convention, this probability collapses to 0.20, as strict ontological identity is rare across revolutions.
  2.  **Sample Distortion:** 0.75. The "graveyard" is skewed by survivorship bias; we remember phlogiston but forget that atomic theory survived multiple revolutions. The historical record is pessimistic because failed posits are more memorable than refined ones.
  3.  **Predictive Success:** 0.85. QFT's precision (parts per trillion) is unprecedented. The "No Miracle" argument suggests such accuracy rarely persists if the underlying ontology is wholly fictitious, though renormalization hints some math is merely corrective.
  4.  **Selective Realism (Wrinkle 2):** 0.50. Applying the philosopher's criterion: fields are indispensable for prediction, but stability across reformulations (e.g., algebraic QFT vs. Lagrangian) is contested. If ontology shifts with formulation, belief is unwarranted. This uncertainty significantly caps my confidence.
  5.  **Unconceived Alternatives:** 0.60. Quantum gravity candidates (strings, loops) suggest spacetime may be emergent from information or entanglement. If spacetime is derivative, it may be regarded as scaffolding rather than fundamental ontology.

  **Combination:** I treat the final credence as a weighted average. Base Rate and Predictive Success carry the most weight (35% each) as positive indicators of continuity. Selective Realism and Unconceived Alternatives (15% each) act as dampeners. The high success rate pulls the average up, but the ontological instability (Selective Realism) prevents it from exceeding 75%. The austere counting convention is the floor; without it, the Base Rate collapses, dragging the total down to the 40% range noted above.

  ### Where the number is load-bearing

  The credence hinges entirely on the status of **spacetime fundamentality**. If the successor theory treats spacetime as emergent (like fluid dynamics from atoms), physicists might still call it "approximately correct" (supporting the proposition) or "effective scaffolding" (falsifying it). The distinction rests on whether emergence denies reality. Currently, many quantum gravity researchers view smooth spacetime as a low-energy illusion. If this view solidifies, the "ontology" claim fails even if the equations survive. My 70% assumes physicists will grant "reality" status to emergent structures if they are stable and indispensable, but this is a philosophical wager, not a physical certainty. The austere counting convention masks this risk by classifying emergence as "approximate correctness" rather than "replacement."

  ### What would move it

  **Upward:** Direct detection of **gravitons** or confirmation that spacetime remains smooth down to the Planck scale. This would cement curved spacetime as fundamental rather than emergent, pushing credence toward 90%. **Downward:** Experimental evidence of **Lorentz violation** or discrete spacetime structure (e.g., via gamma-ray burst timing). This would suggest curved spacetime is strictly a macroscopic fiction, akin to fluid continuity, dropping credence below 50%. Additionally, if a consensus forms that QFT fields are merely algebraic tools without referents (validating the philosopher's criterion fully), the number drops. Conversely, if a unified theory explicitly derives fields as fundamental excitations of a substratum, the number rises.
