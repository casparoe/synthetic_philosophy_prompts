  So this is an idealization of *informational exclusion*, not *theorem proving*. It models what your evidence rules out, not what you've calculated. When I say the agent is closed under consequence, I mean there are no worlds compatible with her evidence where the premises hold and the conclusion fails. That's a static relation between sets, not a dynamic process of inference. You asked what you're paying: you're paying the idea that knowledge requires a causal chain of reasoning. I say that's psychology, not epistemology. If your evidence guarantees $P$, you know $P$, regardless of whether you've run the proof. To deny this is to say you can be fully informed yet still ignorant of what that information entails. That's not a modest notion of agency; it's a contradiction in terms.
