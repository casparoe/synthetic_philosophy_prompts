      *   **Form:** No fixed form, but structured in pairs (couplets or paired lines).
      *   **Core Concept:** The distinction between an open conditional (indicative: "if X happened, Y happened") and a counterfactual conditional (subjunctive: "if X had happened, Y would have happened").
      *   **Structure:** Set out in pairs, one line for the open conditional (what happened), one line for the counterfactual (what could have happened).
      *   **Technique:** Use rhyme or repeated phrase to hold pairs together, but let the mood pull them apart (showing they are different logical animals).
      *   **The Turn:** The moment the reader sees one member of a pair can be settled while the other cannot.
