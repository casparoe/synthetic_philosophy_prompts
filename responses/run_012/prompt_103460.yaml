          *   *Recommendation:* Usually, in ethics committees, PBP is preferred because it prevents "outcome bias," but you need a mechanism to handle the paradox (e.g., deliberation to align views before voting).
      *   *Conclusion:* Summarize. The procedure isn't a dodge, but it carries a heavy philosophical burden (Group Agency).

