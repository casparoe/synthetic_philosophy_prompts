answer: |-
  You have stumbled onto one of the most significant problems in contemporary political philosophy and social choice theory. Your intuition that something is "off" is mathematically and philosophically correct. The phenomenon you are describing has a name: **The Discursive Dilemma** (sometimes called the **Doctrinal Paradox**).

  The literature you are looking for falls under **Judgment Aggregation Theory** and **Philosophy of Group Agency**. Key names include Lewis Kornhauser, Lawrence Sager, Philip Pettit, and Christian List.

  Here is an unpacking of what your procedure commits you to, why it feels weird, and whether your chair is dodging or defending a coherent position.

  ### 1. The Structure: Premise-Based vs. Conclusion-Based
  Your committee is using a **Premise-Based Procedure (PBP)**. You vote on the reasons (premises) and derive the decision (conclusion) logically.
  *   **Premises:** Directive Clear? Family Agrees? Treatment Futile?
  *   **Conclusion:** Withdraw Support? (Yes only if all 3 premises are Yes).

  The alternative is a **Conclusion-Based Procedure (CBP)**. You vote directly on "Should we withdraw support?" and ignore the tally on the reasons.

  **The Paradox:** It is mathematically possible for a majority to vote "Yes" on Premise 1, a (different) majority to vote "Yes" on Premise 2, and a (different) majority to vote "Yes" on Premise 3, while a majority of the *same* people vote "No" on the Conclusion.

  **Example:**
  Imagine a 3-person committee.
  *   **Member A:** Yes on Directive, No on Family, Yes on Futility → **No** on Withdrawal.
  *   **Member B:** Yes on Directive, Yes on Family, No on Futility → **No** on Withdrawal.
  *   **Member C:** No on Directive, Yes on Family, Yes on Futility → **No** on Withdrawal.

  **The Tally:**
  *   Directive: 2 Yes (Majority)
  *   Family: 2 Yes (Majority)
  *   Futility: 2 Yes (Majority)
  *   **Committee Position:** All premises met → **Withdraw.**
  *   **Direct Vote on Withdrawal:** 0 Yes, 3 No → **Do Not Withdraw.**

  Your chair says the "Committee Position" is Withdraw. Your gut says the "Committee Will" is Do Not Withdraw. Both are defensible, but they rest on different philosophical commitments.

  ### 2. What Does This Procedure Presuppose?
  By using the PBP, your committee is making several heavy philosophical claims:

  **A. The Committee is a Single Rational Agent (Group Agency)**
  The procedure assumes the committee isn't just a bag of individual votes; it is a corporate entity that must possess **rational integrity**. Individual humans are allowed to be inconsistent (I can believe P1, P2, and P3 but still feel C is wrong). A *rational agent* (like a court or an ethics board) is not. The procedure forces the group to be more logically consistent than the individuals composing it. It prioritizes the *coherence of the institution* over the *aggregate will of the members*.

  **B. Reasons Trump Outcomes**
  This procedure commits you to the idea that *why* you decide matters more than *what* you decide. In bioethics, this is crucial. If you vote directly on withdrawal (CBP), you might get the "right" outcome for the "wrong" reasons (e.g., bias against disability, cost-saving, fatigue). By voting on premises, you force the group to go on record that specific ethical criteria were met. It creates a paper trail of justification.

  **C. Independence of Judgments**
  You asked if the procedure assumes the sub-questions are fixed independently. **Yes.** It assumes a member can judge "Is the directive clear?" without that judgment being contaminated by their desire to withdraw support. In reality, human psychology is "motivated reasoning" (I want outcome X, so I convince myself Premise Y is true). The procedure tries to legislate against this by isolating the variables, but it can't fully succeed.

  **D. The Status of Question 2 (Family Agreement)**
  You asked if it makes sense for the committee to have a view on "family agreement." **Yes.** This is a factual/meta-ethical judgment, not a normative one. The committee is acting as a finder of fact. If the majority believes the family is fighting, then for the purpose of the committee's logic, the family *is* fighting. It is not claiming the family *actually* agrees in reality; it is claiming that *according to the committee's epistemic standard*, agreement is present.

  ### 3. Is the Chair Dodging?
  The chair says: *"The three-question version is the real committee view."*

  **This is not a dodge; it is a specific theory of legitimacy.**
  The chair is arguing for **Integrity**. If the committee's mandate is to uphold specific ethical standards (Directives, Consensus, Futility), then the only legitimate decision is one that flows from those standards. If the majority wants to keep life support despite all three criteria being met, the majority is effectively voting to violate the committee's own ethical framework.

  However, your feeling that it is "off" is also valid. This is the problem of **Responsiveness**. A democratic body is supposed to respond to the judgments of its members. If every single member thinks "Do Not Withdraw," but the math says "Withdraw," the procedure has become alienated from the people running it. It creates a "mindless" group agent that acts contrary to every member's will.

  ### 4. Is the Procedure Forced?
  **No.** It is a design choice.
  *   **If you switch to a direct vote (CBP):** You gain democratic responsiveness. The outcome matches the members' overall judgment.
      *   *What gets lost:* Accountability to reasons. You risk "outcome bias." A future audit might ask, "Why did you withdraw?" and the minutes would just say "5-4 Vote." You lose the ability to ensure that *every* withdrawal meets the *three specific ethical bars* you set.
  *   **If you keep the premises vote (PBP):** You gain consistency and precedent. You ensure that no withdrawal happens unless the specific ethical conditions are publicly validated.
      *   *What gets lost:* The "will of the committee." You risk the Discursive Dilemma where the outcome feels unmoored from the members' actual convictions.

  **Which is better for Bioethics?**
  Most literature suggests **PBP (your current method) is preferable for ethics committees.**
  Why? Because ethics committees are not legislatures; they are quasi-judicial bodies. Their job is to apply principles, not aggregate preferences. If you vote directly on the outcome, you allow members to trade off principles (e.g., "I'll ignore the lack of an advance directive if you agree it's futile"). Voting on premises prevents logrolling and ensures each ethical hurdle is cleared on its own merit.

  ### 5. What to Do When They Conflict?
  You asked: *If the three answers come out inconsistent [with the direct vote], do we have to revise something?*

  This is the hardest part. If you have a P1/P2/P3 "Yes" majority but a Conclusion "No" majority, you have a **Rationality vs. Responsiveness** conflict.

  **Option A: Stick to the Premises (The Chair's View)**
  You announce "Withdraw."
  *   *Justification:* The committee's authority comes from its adherence to ethical standards, not its headcount.
  *   *Risk:* Members feel disenfranchised; the decision lacks "buy-in."

  **Option B: Stick to the Conclusion (The Dissenter's View)**
  You announce "Do Not Withdraw."
  *   *Justification:* No action should be taken if the majority of the committee opposes it, regardless of the premises.
  *   *Risk:* You undermine the ethical framework. You imply that the three criteria don't actually matter if the vote goes the other way.

  **Option C: Deliberative Revision (The Recommended Path)**
  If this paradox emerges, **the vote should not be finalized.**
  The existence of the paradox indicates a failure of deliberation, not just math. It means members are interpreting the premises differently.
  *   *Procedure:* If the PBP outcome contradicts the CBP outcome, the Chair should reopen discussion. "We have a situation where the criteria are met, but the majority opposes withdrawal. Why? Is one of our criteria misapplied? Is there a fourth hidden criterion?"
  *   *Goal:* Bring the individual judgments into alignment so that the PBP and CBP match. This treats the committee as a *deliberative* body, not just a voting machine.

  ### 6. Summary of Commitments
  To answer your specific checklist:

  *   **Does it assume the committee has a single mind?** Yes. It constructs a "group mind" that is more rational than the individuals.
  *   **Does it assume sub-questions are independent?** Yes, logically. Psychologically, no.
  *   **Is consistency imported from individuals?** No, it is imposed *on* the group, often *against* the individuals.
  *   **Is the procedure forced?** No. It is a choice to prioritize **Reason** over **Will**.
  *   **What gets lost if we switch?** If you switch to direct voting, you lose the guarantee that ethical criteria are strictly enforced. You risk arbitrary decisions.
  *   **What is the literature?** Search for **"The Discursive Dilemma," "Judgment Aggregation,"** and **"Group Agency" (List & Pettit).**

  ### Recommendation
  Your procedure is not a dodge, but it is fragile. It works only if the members are committed to the *principles* more than the *outcome*.

  If I were advising your committee:
  1.  **Keep the Premise-Based Procedure.** In bioethics, justification is everything. You need to be able to say *why* you withdrew support, not just that you did.
  2.  **Add a "Safety Valve."** Adopt a rule that if the Premise-Based outcome contradicts a direct vote on the conclusion, the decision is **tabled for further deliberation**. Do not allow the math to override the moral conscience of the majority without discussion.
  3.  **Acknowledge the Paradox.** Tell the committee: "We know this system can produce outcomes no single person voted for. That is the price of ensuring our decisions are principled rather than political."

  Your unease is the sound of a functioning moral conscience bumping against a rigid procedural framework. That is a good place to be. It means you aren't treating the algorithm as a substitute for judgment.
