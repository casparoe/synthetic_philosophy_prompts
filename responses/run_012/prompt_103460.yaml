prompt: |-
  ok so i sit on the ethics committee at a mid-sized hospital and i'm trying to figure out what our own procedure actually commits us to philosophically, because something about it feels off and i can't articulate why.

  Here's how it works. When a family asks us to withdraw life support, we don't take one up-or-down vote on the whole thing. We split it into three separate yes/no questions and vote on each one on its own: (1) is the patient's advance directive clear enough to count, (2) is the family actually in agreement with each other, (3) is continued treatment medically futile. The chair then tallies it up and announces the committee's position on each of the three questions -- whichever side got the majority on that question -- and our rule is we approve withdrawal only if the committee's position is yes on all three. One wrinkle: for the futility question we require a two-thirds majority, but the other two are simple majority, and the final decision just needs all three committee-positions to be yes.

  What's bugging me: we've had cases where the committee's position came out yes on all three, but if you'd just asked us to vote straight up on 'should we withdraw', the majority would've said no. And the reverse has happened to. The chair says that's just an artifact and the three-question version is the real committee view, but i can't tell if that's a real position or a dodge.

  So unpack this for me. What does a procedure like this actually presuppose? Does it assume the committee has a single mind or beliefs at all, or only that we can report majority preferences? Does it commit us to the idea that the group's view on each sub-question is fixed independently of the others, and that the group ought to be logically consistent -- never 'believing' all three premises and also 'believing' not-withdraw? Or is consistency just something we're importing from how individuals are supposed to be? And is the committee's view on question 2 even the right kind of thing to talk about -- is a majority of members agreeing about family agreement the same as the committee thinking the family agrees?

  Also: is the procedure forced to do it this way, or would a straight up-or-down vote on the final question fit just as well, or better? What gets lost if we switch? And tell me which parts of what we do it genuinely requires versus which parts are just one option among several -- i suspect a lot of it is underdetermined. Then, if you think the three-question version is the right one, what are we supposed to do when the three answers come out inconsistent? Do we have to revise something, and which part is the thing that's actually wrong? I keep feeling like the procedure quietly assumes the committee is a person, but i also don't see how we could function without treating it like one. Somebody told me there's a whole literature on this with a name, but i forget it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Member of a hospital ethics committee.
      *   **Problem:** The committee's voting procedure (splitting a decision into three premises) sometimes yields a result ("Withdraw") that contradicts what a direct vote on the conclusion ("Should we withdraw?") would yield. The user feels something is philosophically "off" but can't articulate it.
      *   **Task:** Unpack the philosophical presuppositions of this procedure, identify the relevant literature, analyze the implications (group agency, consistency, premises vs. conclusions), and advise on whether the procedure is necessary or optional.
      *   **Tone:** Professional, philosophically rigorous but accessible, empathetic to the practical constraints of a hospital setting.

  2.  **Identify the Core Philosophical Problem:**
      *   The scenario describes a classic problem in social choice theory and philosophy of collective agency.
      *   *Structure:* Vote on Premise 1 (P1), Premise 2 (P2), Premise 3 (P3). Conclusion (C) is derived logically (If P1 & P2 & P3, then C).
      *   *The Paradox:* It is possible for a majority to accept P1, a majority to accept P2, and a majority to accept P3, but a majority to reject C. (This is the *Discursive Dilemma* or *Doctrinal Paradox*).
      *   *The User's Intuition:* The user is sensing the tension between the "Premise-Based Procedure" (PBP) and the "Conclusion-Based Procedure" (CBP).

  3.  **Key Concepts & Literature:**
      *   **The Discursive Dilemma / Doctrinal Paradox:** This is the specific name the user forgot. Originates in legal theory (Kornhauser & Sager) and formalized in philosophy/economics (List & Pettit).
      *   **Group Agency:** Does the committee act as a single agent? (List & Pettit's *Group Agency*).
      *   **Premise-Based vs. Conclusion-Based Procedures:** The two main ways to aggregate judgments.
      *   **Logical Consistency:** The requirement that the group's beliefs be logically coherent.
      *   **Supervenience:** Does the group judgment supervene on individual judgments?

  4.  **Deconstruct the Committee's Procedure:**
      *   **Current Method:** Premise-Based Procedure (PBP). They vote on the conditions (Directive, Family Agreement, Futility) and derive the decision.
      *   **The "Off" Feeling:** This arises because PBP prioritizes *reasons* over *outcomes*. It ensures the decision is grounded in accepted criteria, but it risks violating the "responsiveness" to the members' overall judgment on the outcome.
      *   **The Chair's Defense:** "The three-question version is the real committee view." This asserts that the group's *reasoning* constitutes its agency, not just its final output.
      *   **The User's Worry:** "Is the committee's view on question 2 even the right kind of thing?" (Meta-judgment). Yes, committees make judgments about facts/states of the world (e.g., "Is the family agreeing?") as part of their deliberation.

  5.  **Address the Specific Questions:**
      *   *What does it presuppose?* It presupposes the committee is a rational agent bound by logic (integrity constraint). It assumes reasons matter more than the raw tally on the outcome.
      *   *Single mind or majority preferences?* It tries to construct a "single mind" (rational unity) out of majority preferences on premises.
      *   *Independence of sub-questions?* It assumes the truth of P1, P2, P3 is independent enough to vote on separately, though logically they connect to C.
      *   *Is consistency imported?* Yes, individual rationality is being imposed on the collective.
      *   *Forced vs. Optional?* It's not logically forced. A Conclusion-Based Procedure (direct vote) is valid but sacrifices reasoned coherence.
      *   *What gets lost if we switch?* If switching to direct vote: You lose accountability to the specific ethical criteria (Directive, Family, Futility). You risk arbitrary decisions. If staying with PBP: You risk the Discursive Dilemma (outcome no one actually wants).
      *   *What to do when inconsistent?* This is the crux. If P1, P2, P3 are Yes, but direct vote on C is No, you have a conflict between *integrity* (following rules) and *responsiveness* (following the will of the members).
      *   *Name of the literature:* Social Choice Theory, Judgment Aggregation, The Discursive Dilemma/Doctrinal Paradox.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's intuition. It's a known philosophical problem. Give the name immediately (The Discursive Dilemma).
      *   *Section 1: The Structure.* Explain PBP vs. CBP clearly.
      *   *Section 2: The Philosophical Commitments.*
          *   **Rational Unity:** The committee is treating itself as a single rational agent.
          *   **Reason-Responsiveness:** Decisions must be justified by specific reasons, not just gut feeling.
          *   **Integrity Constraint:** The group *must* be logically consistent, even if individuals aren't.
      *   *Section 3: The "Off" Feeling (The Paradox).* Explain *how* the majority can say Yes to all parts but No to the whole. (Give a small numerical example if helpful, maybe keep it conceptual to save space). *Self-Correction:* A small table example clarifies this immensely. I'll include a simplified 3-member example.
      *   *Section 4: Is it Forced?* No. It's a design choice.
          *   *PBP (Current):* Prioritizes consistency and precedent. Good for policy.
          *   *CBP (Direct Vote):* Prioritizes democratic responsiveness. Good for specific cases.
      *   *Section 5: The "Family Agreement" Question.* Address the specific worry about Q2. It's a factual judgment, not a normative one. The committee *can* judge facts.
      *   *Section 6: Resolving Inconsistency.* If PBP and CBP clash, which wins?
          *   If you value *Rule of Law* in ethics: PBP wins (Chair is right).
