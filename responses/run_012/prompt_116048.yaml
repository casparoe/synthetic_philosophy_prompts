prompt: |-
  Hey, I'm in this seminar on technology and human values (it's cross-listed with philosophy, which is why I'm asking this way instead of just bugging my TA), and the assignment for Friday is basically "notice a pattern and tell us whether it already has a name." I've been staring at this for three days and dont have anything, so here's the pattern, and I'd love it if you could tell me if it's a real thing.

  Two examples that got me going. First, a nonprofit I volunteered at for two years. Their mission statement has not changed one word in twenty years. But if you look at what actually decides things there — which projects get funded, who gets promoted, what gets killed — the answer is almost always "whatever keeps the org funded and relevant." Nobody is lying about the mission. Every individual decision is defensible on its merits. And yet the org as a whole is now mostly in the business of staying alive. Second example, a standards body I read about for a different class. There the mission really does seem to still be doing the work — nobody's optimizing for the body's own growth — but the mission itself has quietly become a different mission. Each new director interprets the key term a little differently, each reinterpretation is reasonable, and after thirty years they're pursuing something their founders wouldn't recognize, and nobody can point to the meeting where it changed.

  So two things I'm after. (a) Is there a name for the general shape: a long run of individually reasonable decisions that adds up to an outcome nobody chose, with no identifiable wrong turn and no one who was insincere? And (b) is there a name for the difference between my two examples — in one the stated goal is intact but the real driver has been replaced by the system's own persistence, in the other the real driver is intact but the goal's content has shifted? Someone in class said "goal displacement" and I wrote it down but I'm not sure I got it right, and "mission creep" and "value drift" get thrown around too, but none of them seem to capture the part I actually care about: from the inside you can't tell which one you're in, because the org behaves the same either way. The only test I can think of is asking what it would do if staying alive and doing the mission came apart, and that feels like it begs the question, since by the time they've come apart you've already failed.

  I'm not just looking for a label. If there's a term, I want to know how it's carved — what it includes, what it excludes, and what it's confused with.

  Can you give me back JSON instead of prose? Something like:

  {
    "verdict": "established term exists / only close terms / nothing established",
    "closest_established": [{"term": "...", "what_it_gets_right": "...", "where_it_breaks_down": "..."}],
    "one_phenomenon_or_two": "...",
    "test_that_separates_them": "...",
    "proposed_term": "...",
    "proposed_definition": "...",
    "what_it_is_not": [{"term": "...", "one_line_difference": "..."}],
    "boundary_cases": [{"case": "...", "in_out_or_borderline": "...", "why": "..."}],
    "had_to_guess": "..."
  }

  For the fields: closest_established should be 2-4 items ordered from closest to least close, and if nothing established fits, say so there and fill proposed_term and proposed_definition with something you coin. one_phenomenon_or_two is whether my (a)-type and (b)-type examples are genuinely different phenomena or just one thing described at two levels. boundary_cases should have 3-5 entries, and at least one should be a case that looks like mine but isn't. had_to_guess is for anything you're unsure about or had to make up. Please write it in American English, and if a field has no good answer just say so in the field rather than inventing something.
