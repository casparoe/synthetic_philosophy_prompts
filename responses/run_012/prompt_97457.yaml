answer: |-
  The practice you describe presupposes a view of theoretical ontology that might be termed **Explanatory Realism under Epistemic Suspension**. On this view, the ontology of a theory is identified not by the *verification* of the entity's physical constitution, but by its *indispensability* to a causal explanation of observable regularities.

  Here is the reconstruction of the implicit account, an evaluation of its coherence, a distinction of its presuppositions, and an analysis of the consequences should the "inaccessible information" become accessible.

  ### 1. Reconstruction of the Implicit Account

  The researchers' practice relies on a bifurcation between **causal role** and **intrinsic nature**.

  *   **The Epistemic Stance (Official):** Regarding the *intrinsic nature* of the construct (what it is made of, where it is located), the researchers adopt an instrumentalist or agnostic stance. They treat the construct as a "summary statistic" or a "useful fiction" to avoid making metaphysical claims they cannot verify.
  *   **The Explanatory Stance (Practical):** Regarding the *causal role* of the construct, they adopt a realist stance. In the structural equations of their models, the latent variable sits upstream of the observables. To say "low working memory caused the error" is to assign the construct a causal power.

  **The Implicit Ontological Rule:** An entity is granted ontological standing within the theory if, and only if, positing it as a common cause renders the correlations among observables non-accidental.

  This is a form of **Inference to the Best Explanation (IBE)** applied selectively. The researchers argue: "The correlation between test item A and test item B is unlikely to be a brute fact. The best explanation is a common cause $C$. Therefore, we will reason *as if* $C$ exists, while officially withholding judgment on whether $C$ is a neural circuit, a social artifact, or a mathematical abstraction."

  ### 2. Is This Coherent?

  Strictly speaking, the practice is **logically unstable but pragmatically robust.**

  **The Incoherence:**
  There is a performative contradiction in the speech acts. To claim $X$ is "merely a summary" is to say $X$ has no causal power independent of the data points it summarizes. To claim $X$ "caused the failure" is to say $X$ has causal power independent of the specific data points. You cannot consistently hold that $X$ is *constituted by* the observables (instrumentalism) and simultaneously that $X$ *produces* the observables (realism). In psychometrics, this is known as the tension between the **reflective model** (the construct causes the indicators) and the **formative model** (the indicators constitute the construct). Researchers verbally endorse the formative/summary view to stay safe, but mathematically and explanatorily rely on the reflective/causal view to make sense of the data.

  **The Pragmatic Coherence:**
  The practice holds together because it functions as a **Kantian Regulative Ideal**. The construct is treated *as if* it were real for the purpose of organizing experience, without committing to its *noumenal* reality. As long as the "inaccessible information" remains inaccessible, this agnosticism protects the researcher from falsification. If neuroscience fails to find "depression" in the brain, the psychologist can retreat to the official stance: "I never said it was a brain thing; it's just a summary of behavior."

  ### 3. Strict Presuppositions vs. What Merely Fits Well

  To understand the durability of this practice, we must distinguish what is logically required from what is merely convenient.

  **Strictly Presupposed:**
  1.  **The Principle of Common Cause:** The practice presupposes that systematic correlations among observables require a causal explanation. Without this, the latent construct is unnecessary; one could simply correlate the observables directly.
  2.  **Explanatory Autonomy:** It presupposes that psychological explanation does not need to wait for physical reduction. A cause can be identified at the functional level (behavior/test scores) even if the structural level (neurons) is unknown.
  3.  **Stability of Relations:** It presupposes that the relationship between the latent construct and the observables is stable enough to support counterfactuals (e.g., "If working memory were higher, performance would improve").

  **Merely Fits Well (Contingent):**
  1.  **Modularity:** It fits well with the idea that the mind is modular (that there is a distinct "box" for working memory), but the practice does not *strictly* require it. The "construct" could be a dynamic system property, yet still be modeled as a latent variable.
  2.  **Unidimensionality:** It fits well with the idea that "depression" is a single thing, but the math allows for hierarchical factors. The researchers often speak of "the" factor, but the methodology could accommodate a network of causes.
  3.  **Inaccessibility:** The practice fits well with the current limitation of neuroscience, but it does not presuppose that the information is *principally* inaccessible, only that it is *currently* unavailable.

  ### 4. If the Inaccessible Information Became Available

  Suppose neuroscience or mechanistic psychology finally provides the "verdict," mapping the latent constructs onto specific underlying structures (or failing to). The practice would face a crisis.

  **Would they be compelled to choose?**
  **Yes.** The shield of agnosticism relies entirely on the opacity of the black box. Once the box is open, the "as if" stance collapses.
  *   **Scenario A (Validation):** If a specific neural circuit is found that corresponds isomorphically to the latent variable (e.g., a specific network whose efficiency predicts $g$ perfectly), **Realism is compelled.** To continue calling it a "mere summary" would be to deny the evidence of the mechanism. The construct transitions from a *latent* variable to an *observed* (mechanistic) variable.
  *   **Scenario B (Elimination):** If the research shows that the correlations are produced by distinct, unrelated mechanisms (e.g., "depression" symptoms are caused by five different pathologies with no common cause), **Instrumentalism/Eliminativism is compelled.** The latent construct is revealed as a statistical artifact. To continue invoking it as a cause would be scientifically dishonest (akin to invoking phlogiston after the discovery of oxygen).

  **Could they remain agnostic?**
  Technically, they could, but **at the cost of explanatory redundancy.**
  If the mechanism is known, the latent construct becomes a middleman that adds no information.
  *   *Cost 1 (Intervention):* If you know the mechanism, you intervene on the mechanism. If you continue to treat the construct as the target (e.g., "treat the depression factor" rather than "modulate circuit X"), your interventions will be less precise.
  *   *Cost 2 (Theoretical Progress):* Remaining agnostic prevents the integration of psychology with the rest of the natural sciences. It isolates the discipline.
  *   *Cost 3 (Credibility):* If a construct is shown to be a real mechanism, claiming it is "just a summary" looks like false modesty. If it is shown to be an artifact, claiming it "causes" behavior looks like fraud.

  **Conclusion**
  The current practice presupposes that **ontology is functional.** A thing exists if it does causal work. This allows researchers to have their cake (causal explanations) and eat it too (immunity from reductionist falsification). However, this is a temporary equilibrium. It is a placeholder ontology. Once the underlying structure is revealed, the "agnostic" position becomes untenable. The researchers will be forced to either **reduce** the construct (identifying it with the mechanism) or **eliminate** it (acknowledging it was a fiction). To remain agnostic after the reveal would be to prioritize methodological comfort over scientific truth, turning the latent construct from a working hypothesis into a dogma.
