answer: |-
  Sam: Okay, run the deletion test on me. Just delete "Scientific Revolution" from the catalog. What explanatory power evaporates that we can't get back from local case studies?

  Casey: That's the thing. I delete it, and I don't lose the history of optics or the history of navigation. I lose the glue. But is the glue real, or just our need to stick things together?

  Sam: It's not our need; it's their structural shift. If you delete the period, you lose the ability to explain why knowledge-making authority moved from textual commentary to experimental demonstration across disparate fields. That's a reorganization of epistemic norms, not just a list of discoveries.

  Casey: But is it synchronous? That's the lumping problem. If you define the period by that shift, you lump together alchemists and mathematicians who hated each other and operated on incompatible ontologies. You're trading precision for a pattern that only exists at thirty thousand feet.

  Sam: I'm not trading precision; I'm tracking a systemic change. Fine-grained narratives recover the *what*, but they miss the *why* of the systemic shift. Without the period, you can't explain why these local changes reinforce each other rather than cancel out.

  Casey: Or, without the period, you realize they didn't reinforce each other until later historians said they did. That's the causal work of the label. Actors in the seventeenth century started performing "new science" to fit a narrative they sensed emerging. The period isn't a container they lived in; it's a tool they used.

  Sam: Even if they used it as a tool, the underlying reorganization happened. The deletion test asks if we lose explanatory power. If I can't point to a structural break in how truth claims are validated, I lose the ability to explain modernity's emergence. Finer-grained stories can't recover that macro-causality.

  Casey: But that's the splitting dilemma. If you define the break strictly as "validation via experiment," you split off the vast majority of natural philosophy that remained textual. If you define it loosely to include everything "new," the period becomes so porous it names nothing specific. Either way, the deletion holds.

  Sam: It doesn't hold because the looseness is a feature, not a bug. It's a reorganization of the *space* of knowledge, not just the content. Deleting it forces us to treat changes in astronomy and changes in medicine as unrelated accidents. The period asserts they are part of a single reconfiguration of authority.

  Casey: But if that reconfiguration is uneven—happening in London but not Prague, in medicine but not law—is it a period or just a metaphor? If I delete the metaphor, I can still explain the London shift using network analysis and the Prague stagnation using political history. I recover the power without the baggage.

  Sam: You recover the local power, but you lose the relational power. You can't explain why the London shift impacted the Prague stagnation. The period provides the field of force within which those local variations make sense. Without it, you have isolated events, not a historical dynamic.

  Casey: Unless the field of force is retrospective. If the label does causal work by convincing actors they are part of a revolution, then the "period" is an effect, not a cause. Deleting it removes the illusion of coherence, which actually *increases* explanatory power by stopping us from forcing connections where there were only contingencies.

  Sam: So you're saying the reality of the period depends on whether the coherence is immanent or imposed?

  Casey: I'm saying the deletion test fails if the coherence is imposed. If finer-grained narratives explain the contingencies better than the grand narrative explains the coherence, the period is historiographical baggage, not historical reality.

  Sam: But if the reorganization of knowledge-making is the reality, the label is just the handle. Deleting the handle doesn't remove the object.

  Casey: Unless the handle created the object. If the "Scientific Revolution" is a resource actors used to legitimize themselves, then deleting the term removes the mechanism of legitimation, not the underlying practices. But that means the period is a discursive event, not a temporal one.

  Sam: Then we disagree on what "real" means for a period. I mean structural transformation; you mean synchronous containment.

  Casey: And the deletion test favors containment because structural transformation can always be disaggregated into local transformations without loss of data, whereas synchronous containment cannot be proven without ignoring the outliers.

  Sam: But ignoring the outliers is how you find the signal.

  Casey: Or how you manufacture it. If I delete the term, do I lose the ability to predict where knowledge authority shifts? No. I just stop pretending the shift was uniform.

  Sam: You stop seeing it as a shift at all. You see noise.

  Casey: I see complexity. The test asks if we lose explanatory power. I argue we gain it by shedding the assumption of unity.

  Sam: And I argue we lose the ability to explain the unity that subsequently formed, regardless of its origins.

  Casey: But if the unity is retrospective, explaining it as a contemporary period is a category error.

  Sam: Then the test boils down to whether historiography describes the past or the history of describing the past.

  Casey: Exactly. And if it's the latter, the period fails the deletion test because it explains our taxonomy, not their reality.

  Sam: But their reality includes the taxonomy they inherited.

  Casey: Only because we gave it to them.

  Verdict: The skeptic better survives the deletion test by demonstrating that finer-grained narratives recover explanatory power without imposing retrospective coherence.
