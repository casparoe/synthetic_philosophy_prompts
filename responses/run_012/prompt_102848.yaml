          *   Defender: Passes the test because it tracks a genuine reorganization of knowledge-making.
          *   Skeptic: Fails the test because the reorganization is uneven/local, and the label does causal work itself. Also presses the lumping/splitting dilemma (lumps incompatible projects or splits until meaningless).
      *   **Key Constraint 4 (Content):** No citing Copernicus/Newton as settle-all examples. Keep it conceptual/meta-historical. Discuss what 'real' means for a period.
