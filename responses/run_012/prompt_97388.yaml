  **BUREAU OF GRAPHIC COORDINATION**
  **Directive 88-B: Standardization of Universal Visual Syntax**
  **Status: Mandatory for All Member Institutes**

  **Preamble**
  Following the dissolution of the Unified Science Front and the subsequent Schism of the Captionists, the Bureau was established to secure a neutral medium for the exchange of factual data. The rival Committee on Abstract Notation continues to advocate for algebraic symbols, but the Bureau maintains that only pictorial representation guarantees democratic access. Previous attempts to allow verbal legends resulted in the "Dispute of the Legends," wherein conflicting descriptions obscured the underlying data. To prevent further fragmentation, all communications regarding scientific status, resource allocation, and personnel must adhere to the following Visual Syntax. Verbal explanation is permitted only during the transitional scaffolding phase.

  **Regulations**

  1.  **Exclusivity of Form**
      All official correspondence must consist solely of standardized icons arranged on a grid. Words, numbers, and algebraic symbols are classified as "rhetorical clutter" and are prohibited in final drafts.
      || *Margin: Drafts may contain text provided it is crossed out with a single heavy line.* ||

  2.  **The Principle of Drawability**
      Only entities that can be depicted as physical objects are admissible as data. Concepts that lack spatial extension (e.g., "justice," "probability," "cause") must be omitted unless they can be represented by their physical effects. If a phenomenon cannot be drawn, it is classified as non-scientific and excluded from the Encyclopedia.
      || *Margin: This excludes metaphysical speculation but also excludes wind, which is invisible. Represent wind by moving trees.* ||

  3.  **Quantification and Unit Icons**
      Quantities are represented by the repetition of identical icons. One icon equals one standard unit (e.g., one person, one ton of steel). To represent fractions of a unit, the icon must be subdivided geometrically.
      || *Margin: Caution. A half-icon of a worker represents 500 laborers. It must not resemble an injured worker. Use a vertical split, not horizontal.* ||
      **Clarification on Ambiguity:** When representing a decrease in quantity, do not remove icons. Instead, render the icons in outline only. However, if the quantity reaches zero, the grid space must remain empty. An empty grid space signifies "zero" in data sets but "omission" in narrative sequences. Users must infer the difference based on grid density.
      || *Margin: This distinction is intuitive. If confusion arises, add more empty space.* ||

  4.  **Neutrality of Perspective**
      All icons must be drawn in a flat, two-dimensional style without shading or perspective. This ensures that the image remains neutral and does not impose the artist's viewpoint upon the viewer. The selection of which facts to visualize is determined by the Bureau's Planning Committee to ensure objective relevance.
      || *Margin: The choice of icon is not a judgment. A factory icon represents production, not industrialization.* ||

  5.  **Prohibition of Interpretive Keys**
      Because the visual language is designed to be self-evident, explicit legends or keys are discouraged. The meaning of an icon should be immediately apparent to any observer regardless of language or education. If an icon requires explanation, it is flawed and must be redesigned.
      || *Margin: This document serves as the final explanation. No further documents will be issued.* ||

  6.  **Enforcement and Correction**
      Submissions failing to meet these standards will be returned to the sender with no accompanying text. Repeated violations will result in the removal of the offending institute from the Visual Exchange Network. The Bureau reserves the right to alter submitted icons to fit the standard grid without notifying the author.
      || *Margin: Alterations are improvements, not edits.* ||

  **Closing Statement**
  The Bureau recognizes that this directive is currently communicated via text. This is a temporary necessity required to abolish the necessity of text. Once the Visual Syntax is fully internalized by all personnel, future directives will be issued as pictorial sequences. Until that time, the staff is instructed to read these words only to learn how to stop reading words. The goal of the Bureau is to render itself obsolete through the perfection of its images.

  **Issued by:** The Central Office of Visual Coordination
  **Date:** [Current Cycle]
  **Distribution:** All Member Institutes (Visual Division Only)

  || *Margin: If you have received this in text format, you are in the Text Division. Report to Reassignment.* ||
