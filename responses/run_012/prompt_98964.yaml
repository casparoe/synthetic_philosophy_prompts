answer: |-
  ### 1. Exam Question

  **Question 4: The Modified Centipede Game (35 Minutes)**

  Consider a finite Centipede Game played between two players, Alice and Bob. The game lasts for a maximum of $T$ rounds. A "pot" of money starts at value $P_0 > 0$. In each round $t$ (where $t = 1, \dots, T$), the current player chooses to **Take** or **Pass**.

  *   **If Pass:** The pot grows by a factor of $k > 1$ (so $P_{t+1} = k \cdot P_t$), and play moves to the next round (switching players).
  *   **If Take:** The game ends immediately. The current pot $P_t$ is split **50/50** between Alice and Bob.
  *   **End of Game:** If the game reaches round $T$ and the player chooses **Pass**, the game ends, and the grown pot $P_{T+1}$ is split **50/50**.

  Assume both players are rational, maximize their own monetary payoff, and this is **Common Knowledge**.

  **(a)** Using Backward Induction, derive the Subgame Perfect Equilibrium (SPE) of this modified game. Show your working for the final two nodes explicitly. [8 marks]
  **(b)** Contrast this result with the standard Centipede Game (where the taker receives the majority of the pot). Why does the equilibrium behavior change? [6 marks]
  **(c)** Discuss the implications of this result for the "Backward Induction Paradox." Does this modification prove that rationality is compatible with cooperation, or does it merely highlight the sensitivity of equilibrium outcomes to payoff structures? [6 marks]

  ***

  ### 2. Model Answer

  **(a) Backward Induction Derivation**
  To find the Subgame Perfect Equilibrium, we reason backward from the final decision node. Let $V_t$ be the payoff a player receives at node $t$ if they follow the equilibrium strategy.

  Consider the final round $T$. The current player faces a pot of size $P_T$.
  *   **Choice Take:** The player receives $0.5 \cdot P_T$.
  *   **Choice Pass:** The game ends with the grown pot $P_{T+1} = k \cdot P_T$. The player receives $0.5 \cdot P_{T+1} = 0.5 \cdot k \cdot P_T$.
  Since $k > 1$, $0.5 \cdot k \cdot P_T > 0.5 \cdot P_T$. A rational player strictly prefers to **Pass**.

  Now consider round $T-1$. The player knows that if they Pass, the opponent at round $T$ will also Pass (as derived above).
  *   **Choice Take:** The player receives $0.5 \cdot P_{T-1}$.
  *   **Choice Pass:** The game proceeds to $T$, the opponent Passes, and the game ends. The original player receives $0.5 \cdot P_{T+1}$.
  Since $P_{T+1} > P_{T-1}$, the payoff from Passing is strictly higher. Thus, the player at $T-1$ chooses **Pass**.

  By induction, this logic holds for every node $t < T$. At any node, Taking yields 50% of the current pot, while Passing yields 50% of a strictly larger future pot (because the opponent will not "steal" the pot, they will also Pass). Therefore, the unique SPE is for both players to **Pass at every node** until the game ends naturally.

  **(b) Contrast with Standard Centipede**
  In the standard Centipede Game, the "Take" option awards the majority of the pot to the taker (e.g., 60/40 or more). This creates a "pre-emption" incentive. At the final node, the player Takes to grab the majority. Knowing this, the previous player Takes earlier to avoid getting the minority share. This unravels to immediate defection.

  In this modified version, the "Take" option removes the pre-emption incentive. Because the splitter only gets 50%, they cannot punish the opponent by ending the game early; they only deny the opponent potential growth. Since both players want the pot to grow, and neither can gain an advantage by stopping the game, the competitive tension vanishes. The equilibrium shifts from immediate defection to full cooperation.

  **(c) Implications for the Paradox**
  This result clarifies the nature of the Backward Induction Paradox. The standard paradox suggests that "rationality" (common knowledge of maximizing behavior) leads to Pareto-inefficient outcomes (low payoffs). However, this modified game shows that rationality itself is not the culprit; rather, it is the combination of rationality *and* specific payoff structures that reward pre-emption.

  When the payoff structure is altered to align individual incentives with collective growth (removing the winner-take-most dynamic), Common Knowledge of Rationality actually *enforces* cooperation. This suggests the paradox is not a fundamental failure of rational choice theory, but an artifact of games designed with conflicting interests. It demonstrates that cooperation is rational when the mechanism for "defecting" does not offer a relative advantage over cooperating. However, students should avoid claiming this "solves" the paradox universally; it only solves it for games where the split is equalized. If the split were 51/49, the standard unraveling would likely return.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **Part (a): Backward Induction Mechanics (8 Marks)**
  *   **2 Marks:** Correctly identifies the payoff at the final node for Taking ($0.5 P_T$) vs Passing ($0.5 P_{T+1}$).
  *   **2 Marks:** Explicitly states that since $k > 1$, Passing is strictly dominant at the final node.
  *   **2 Marks:** Correctly reasons backward to node $T-1$, noting the player anticipates the opponent will Pass.
  *   **2 Marks:** Generalizes the induction correctly to conclude "Pass at every node" is the unique SPE.
      *   *Deduction:* -2 marks if student claims the game ends in a Take at any point.
      *   *Deduction:* -1 mark for sloppy notation (e.g., confusing pot size with payoff).

  **Part (b): Comparison to Standard Game (6 Marks)**
  *   **3 Marks:** Accurately describes the standard Centipede incentive (Take = Majority/Pre-emption).
  *   **3 Marks:** Explains that the modification removes the "fear" of the opponent taking the pot, aligning incentives toward growth.
      *   *B-Grade Limit:* An answer that simply says "Standard is defect, this is cooperate" without explaining the *incentive structure* (majority vs. half) cannot score above 3/6 here.

  **Part (c): Conceptual & Philosophical Analysis (6 Marks)**
  *   **3 Marks:** Argues that the "Paradox" is payoff-dependent, not a failure of rationality itself. (Rationality $\neq$ Defection inherently).
  *   **3 Marks:** Nuanced conclusion: Cooperation is rational *under these specific conditions*, but not universally.
      *   **Critical Distinction (A vs B):**
          *   **A-Grade (5-6 marks):** Explicitly notes that this does not "solve" the paradox for all games. Mentions that if the split were uneven (e.g., 51/49), unraveling might return. Shows understanding that CKR (Common Knowledge of Rationality) drives the result in *both* versions, just to different ends.
          *   **B-Grade (3-4 marks):** Correctly states rationality allows cooperation here but fails to qualify that it depends on the numbers.
          *   **C-Grade (0-2 marks):** Claims this proves "people are naturally cooperative" or ignores the role of rationality entirely.

  **Specific Common Mistake Penalty**
  *   **-3 Marks (Cap):** If the student claims that this modification proves "Backward Induction is wrong" or "The Centipede Paradox is debunked." (The paradox is about the tension between BI and intuition in *standard* payoffs; changing payoffs changes the game, not the logic).
  *   **-2 Marks:** If the student assumes players Pass because they "trust" each other, rather than because it is the utility-maximizing strategy given the opponent's rationality. (Must rely on strategic reasoning, not social norms).
