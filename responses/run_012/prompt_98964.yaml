  hey so im in this game theory elective at my school (its a math-ish class but we do econ and philosophy stuff too) and our teacher said a few of us can write practice questions for the class since everyones stressing about the real exam. i got handed the centipede game / backward induction paradox and i really dont want a question thats just "state what backward induction says" because everyone will just write "you defect at every node, the end" and thats boring.

  so me and my friend maya messed around with the game and made our own version: same centipede (two players take turns, the pot grows every time someone passes, at each turn you can take or pass, and if you take the game ends) BUT if you take, you have to split the pot 50/50 with the other player instead of keeping basically all of it. when we worked it out it looked like now everyone just passes all the way to the end, which is the total opposite of the normal answer. i thought that was pretty wild.

  can you write me three things:

  1. the exam question itself — one long answer question, students get like 35 minutes, that uses our split-the-pot version and cant be answered by just reciting the usual result.

  2. a model answer, maybe 500-700 words, that actually does the backward induction on our version step by step so i can check it, and then says what it means.

  3. a marking scheme out of 20 that says which specific moves a really strong answer has to make and which specific mistakes should cost marks (like separating an A from a B).

  for the "what it means" part i want it to get into the real issue, like is the paradox saying rationality kinda backfires / makes you worse off, or is it just an artifact of how the payoffs are set up, and what does everyone knowing everyone is rational (and knowing that they know, and so on) actually do. also please make at least one marking-scheme line about a mistake kids actually make, like thinking our version "solves" the paradox or that cooperating is now the only rational move no matter what the numbers are.

  and dont worry about citing anyone or giving readings, my teacher said we dont need that.
