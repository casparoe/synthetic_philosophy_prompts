answer: |-
  You are right to be suspicious. Your sister's book is leading you astray on the technical details, and if you rely on it to understand what professional metaphysicians actually think, you will come away with a distorted map of the field. The pottery example you gave is the classic "Statue and Clay" puzzle (often attributed to Allan Gibbard or Michael Burke), and while the book gets the *puzzle* right, it botches the *solutions* and the *attribution* badly.

  Here is the claim-by-claim breakdown you asked for.

  **1. The Puzzle Description**
  *Claim:* "A lump of clay and a statue made from it are obviously two different things... yet they're made of exactly the same stuff and fill exactly the same space at the same time."
  *Verdict:* **Fair.**
  This is an accurate statement of the problem of material constitution. It highlights the tension between *numerical identity* (are they one thing?) and *modal properties* (can the lump survive squashing while the statue cannot?). This part of the summary is fine.

  **2. The "Standard Solution"**
  *Claim:* "The standard solution... is that the statue and the lump are really just one single object, and 'statue' and 'lump' are two ways of describing it."
  *Verdict:* **Oversimplified / Debatable.**
  There is no consensus "standard solution." In contemporary metaphysics, the view that they are *two distinct objects* occupying the same space at the same time (called the **Coincidence View** or **Constitution View**) is arguably just as popular, if not more so, than the "one object" view. The "one object" view (Identity Theory) struggles to explain why the lump can survive being squashed while the statue cannot. If they are truly *one* object, they should share all properties. The book presents a contested minority view as the "standard" one.

  **3. The Attribution to Van Inwagen**
  *Claim:* "The book pins this standard solution on a philosopher named van Inwagen."
  *Verdict:* **Wrong.**
  This is a catastrophic error. Peter van Inwagen is famous for his book *Material Beings*, in which he argues the exact opposite of what the book claims. Van Inwagen is a **restrictivist** (often bordering on eliminativism regarding artifacts). He argues that composite objects *only* exist if they are living organisms. On van Inwagen's view, there are no statues and there are no lumps of clay—there are only simples arranged statue-wise or lump-wise. He explicitly denies that artifacts like statues exist as composite objects. Attributing the "common sense, one object" view to van Inwagen is like attributing vegetarianism to a butcher. The book likely confused him with a deflationist like Eli Hirsch or a common-sense realist like Thomas Reid, but naming van Inwagen here undermines the book's credibility entirely.

  **4. The "Just Language" Conclusion**
  *Claim:* "On this view there's no fact of the matter about whether the statue survives being squashed — it just depends on which description you prefer."
  *Verdict:* **Wrong / Conflation.**
  This does not follow from the "one object" view. If the statue and the lump are *one object*, there **is** a fact of the matter: the object either survives or it doesn't. The claim that "it's just language" is a specific meta-ontological position called **Ontological Deflationism** (or Quantifier Variance). It is a separate philosophical move to say that existence questions are merely verbal disputes. The book is smuggling this deflationary view in and pretending it is a natural consequence of the "one object" view. A defender of the "one object" view (Identity Theory) would insist there is a hard fact: the object is identical to the clay, so it survives. A defender of the "two object" view would insist there is a hard fact: the statue part perishes, the clay part remains. Only the Deflationist says "no fact of the matter."

  **5. The Definition of Eliminativism**
  *Claim:* "The opposing view, which the book calls eliminativism, says that only the fundamental physical particles are truly real and that composite things like statues and lumps don't exist at all."
  *Verdict:* **Fair.**
  This is a reasonably accurate description of **Mereological Nihilism**. Ironically, as noted above, this is much closer to van Inwagen's actual view (though he makes an exception for living organisms) than the view the book attributed to him.

  **6. The Consensus Claim**
  *Claim:* "Most philosophers these days think the common-sense view wins."
  *Verdict:* **Oversimplified.**
  Surveys of professional philosophers (like the PhilPapers survey) show a significant split. While "common sense" (that tables and statues exist) is the intuitive starting point, a very large minority of metaphysicians are skeptical of ordinary objects. To say the common-sense view "wins" suggests the debate is settled, when it is actually one of the most active areas in contemporary metaphysics.

  **Summary of the Error**
  The book conflates three distinct positions:
  1.  **Identity Theory:** Statue = Lump (One object).
  2.  **Deflationism:** The question is merely verbal (No fact of the matter).
  3.  **Common-Sense Realism:** Ordinary objects exist.

  It mashes these together, claims they are the "standard view," and attributes them to a philosopher (van Inwagen) who famously rejects ordinary objects. You cannot trust this book on the technical landscape of metaphysics.

  **Answering Your Pottery Question**
  Since the book is unreliable, here is the actual philosophical landscape regarding your kiln:
  *   **The Constitution View (Popular):** The statue and the clay are *two* things. They share matter, but the statue has a property the clay doesn't (being a figure). When you squash it, the clay survives, the statue ceases to exist.
  *   **The Identity View (Minority):** The statue *is* the clay. If you squash it, the object survives, but it stops being a statue. It's like a tadpole becoming a frog; the object remains, the phase changes.
  *   **The Nihilist View (Van Inwagen's neighborhood):** There is no "statue" and no "clay lump." There are just particles arranged in a specific way. When you squash it, the particles rearrange. Nothing comes into or goes out of existence except the arrangement.

  \answer{mostly-unfair}
