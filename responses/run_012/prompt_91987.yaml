      *   **View 2 (Vance):** The "Continuum/Medium" view. Conflates *where* trial/error happens with *what* mind is doing. Popperian = cheap Skinnerian. Gregorian = change in storage medium (culture), not internal capacity.
      *   **Key Conflicts to Address:**
