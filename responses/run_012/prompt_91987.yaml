          *   Vance: They refute the ladder. They show you can have the "top" without the "bottom." The hierarchy isn't foundational; it's modular.
      *   **Conclusion:** No resolution, but a clarification of the stakes. The journalist (narrator) reflects on the "Fifth Rung."

