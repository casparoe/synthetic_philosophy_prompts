          *   Inheriting tools: Cognitive capacity vs. population fact.
          *   Taxonomy of minds vs. description of selection locus.
      *   **The "Fifth Rung" (The User's Contribution):** Creatures living off trials run by others (selection in norms/markets/archives). Is this Gregorian or a new grade?
