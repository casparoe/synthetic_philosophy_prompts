prompt: |-
  I teach a seminar on social ontology and the philosophy of social science, and I want to build a session around Shirley Jackson's short story 'The Lottery' and David Lewis's account of convention. Please read the story through Lewis's theory — and, just as importantly, read Lewis's theory back through the story.

  By way of orientation, since I want the reading to engage the account rather than a caricature of it: Lewis's central idea is that a convention is a regularity in the behaviour of a population facing a recurrent coordination problem. Everyone conforms; everyone expects everyone else to conform; everyone prefers to conform on condition that the others do; conformity is a coordination equilibrium, in that no one would have done better by acting differently on their own; and there is at least one alternative regularity that would have served just as well, so the convention is arbitrary in the sense that reason alone does not single it out. Such regularities are held in place by mutual expectation and common knowledge rather than by any intrinsic merit, and they can be learned, imitated, and handed down long after the situation that first called for them has changed.

  I want a reading that takes both the story and the theory seriously. Where does the lottery satisfy Lewis's definition, and where does it slip through it? The villagers do conform, do expect one another to conform, and do treat the practice as beyond question — but no one appears to gain from it, and abandoning it would not frustrate anyone's coordination. Is the lottery therefore a genuine convention, if an unusually grim one, or is it better described as something else: a norm, a tradition, a case of pluralistic ignorance, or an instance of a practice outliving whatever purpose it may once have had?

  Point me to the scenes and details that carry the philosophical weight — Old Man Warner's defence of the practice, the children's casualness, the ritual of the box, Tessie's late arrival and sudden dissent, and the report that other villages have given the lottery up. Does that last detail vindicate Lewis, since a convention can be dropped when a population settles on another regularity, or does it expose a gap, given that nothing here resembles a shift between equally serviceable equilibria? The session also covers the evolution of norms, so say whether the story supports an account on which such regularities arise and decay through precedent, imitation, and the cost of being the first to defect, or whether it dramatises a failure mode that Lewis's framework cannot name.

  End by saying what the story adds to the philosophical debate that argument alone does not — what Jackson sees about the persistence of arbitrary practices that a definition of convention cannot capture. Be honest where the reading strains: if the lottery simply is not a convention, say so rather than forcing the fit. There is no need to quote from the story; I care about the reading, not the wording.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Build a seminar session reading Shirley Jackson's "The Lottery" through David Lewis's theory of convention (and vice versa).
      *   **Target Audience:** A seminar on social ontology and philosophy of social science (advanced undergraduate or graduate level).
      *   **Key Constraint:** Engage seriously with Lewis's actual account (coordination problems, equilibria, common knowledge, arbitrariness), not a caricature.
      *   **Key Questions to Address:**
          *   Where does the lottery satisfy Lewis's definition? Where does it fail?
          *   Is it a convention, a norm, a tradition, pluralistic ignorance, or a vestigial practice?
          *   Analyze specific scenes/details (Old Man Warner, children, the box, Tessie, other villages).
          *   Does the existence of other villages quitting vindicate or challenge Lewis?
          *   Does the story support evolutionary accounts of norms or expose a failure mode in Lewis's framework?
          *   What does the story add to the debate that argument alone cannot?
          *   **Crucial:** Be honest. If it's not a convention, say so. Don't force the fit.

  2.  **Deconstruct Lewis's Theory of Convention:**
      *   *Core:* Regularity $R$ in population $P$ in circumstance $C$.
      *   *Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform.
          3.  Everyone prefers to conform *on condition that* others do (conditional preference).
          4.  There is at least one alternative regularity $R'$ that could have solved the problem.
          5.  It's a coordination equilibrium (no one gains by unilaterally deviating *given the coordination problem*).
      *   *Function:* Solves a *recurrent coordination problem*.
      *   *Nature:* Arbitrary (reason doesn't dictate $R$ over $R'$), sustained by mutual expectation/common knowledge.

  3.  **Analyze "The Lottery" against Lewis's Criteria:**
      *   *Regularity:* Yes, annual event, specific rituals.
      *   *Expectation:* Yes, villagers gather, expect others to be there.
      *   *Conditional Preference:* **Problematic.** Do they prefer to stone someone *if* others do? Or do they prefer *not* to stone, but fear not stoning? Lewis requires a preference for coordination. In the lottery, the "coordination" seems to be avoiding the stigma/punishment of non-participation, not solving a coordination problem like "which side of the road to drive on."
      *   *Alternative Regularity:* Yes, other villages quit. This satisfies the arbitrariness condition technically, but not the *function* condition.
      *   *Coordination Problem:* **Major Gap.** Lewis's conventions solve problems where agents have shared interests in coordinating (e.g., meeting places, driving). The lottery seems to impose a cost (death) without a clear benefit. It's not a coordination equilibrium in the game-theoretic sense unless we model the "game" as "avoid being the outlier."
      *   *Common Knowledge:* The ritual is public, but the *reason* is lost.

  4.  **Synthesize the Tension (The "Reading"):**
      *   *Surface Fit:* It looks like a convention. Everyone does it, expects others to do it, and there are alternatives (other villages).
      *   *Deep Mismatch:* Lewis assumes rational agents solving coordination problems. The lottery is a *social trap* or a *normative equilibrium* sustained by sanction, not mutual benefit. It lacks the "prefer to conform" condition in the genuine sense. They conform to avoid punishment, not because conformity itself solves a coordination snag.
      *   *Verdict:* It is likely *not* a Lewisian convention. It is better described as a **social norm** (specifically a prescriptive norm backed by sanction) or a **vestigial tradition** sustained by pluralistic ignorance.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the pedagogical value. It's a stress test for Lewis.
      *   **The Lewisian Fit (Where it works):**
          *   Regularity & Expectation: The gathering, the black box.
          *   Arbitrariness: Other villages quitting proves $R'$ is possible.
          *   Common Knowledge: The ritual is public property.
      *   **The Lewisian Break (Where it fails):**
          *   The Coordination Problem: Lewis needs a problem where coordination *helps*. The lottery hurts.
          *   Conditional Preference: Do they *want* to participate if others do? No, they participate to avoid being targeted. This shifts it from Convention to Norm (sanction-backed).
          *   Equilibrium: It's not a coordination equilibrium; it's a prisoner's dilemma or assurance game gone wrong.
      *   **Specific Scenes:**
          *   *Old Man Warner:* Represents the "common knowledge" decay. He knows the *rule* but not the *reason* ("Lottery in June, corn be heavy soon"). He enforces the expectation.
          *   *The Box:* Symbol of the arbitrary regularity. Dilapidated but sacred. Shows the practice outliving the function.
          *   *Tessie Hutchinson:* The defector. In Lewis, a defector just fails to coordinate. Here, she is punished. Her late arrival shows casualness (it's routine), her dissent shows the coercive nature.
          *   *Other Villages:* Crucial for Lewis's "alternative regularity." But since they quit without chaos, it proves the lottery *wasn't* solving a necessary coordination problem.
      *   **Evolution of Norms vs. Lewis:**
          *   Lewis explains how we *get* to equilibrium. Jackson shows how we *stay* in a bad one.
          *   Supports evolutionary accounts of path dependence/cost of defection.
          *   Exposes Lewis's blind spot: harmful equilibria sustained by sanctions rather than mutual benefit.
      *   **What Jackson Adds:**
          *   The affective/moral weight. Lewis is cold/rational. Jackson shows the horror of unthinking compliance.
          *   The gap between *is* and *ought*. Lewis describes *how* conventions work; Jackson asks *why* we keep bad ones.
          *   Pluralistic Ignorance: Everyone might hate it but thinks everyone else loves it (though the text suggests they just don't think at all).
      *   **Conclusion:** Be honest. It's not a convention. It's a norm/tradition. Use it to show the limits of rational choice models in social ontology.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "It's not a convention" and stop. I need to explain *why* that distinction matters for social ontology.
      *   *Nuance:* Lewis does allow for conventions that are no longer useful (vestigial), but they must have *started* as solutions to coordination problems. Did the lottery ever solve one? Maybe crop sacrifice? But Lewis requires the *current* preference structure to support it as an equilibrium. If everyone would prefer to stop if everyone else stopped, it's not a Lewisian convention anymore; it's a social trap.
      *   *Focus:* Ensure the distinction between *Convention* (coordination) and *Norm* (sanction/compliance) is clear. This is a key debate in social ontology (Lewis vs. Bicchieri, etc.).

  7.  **Final Polish:** Check tone (academic, seminar-ready), ensure all prompt requirements are met (specific scenes, honest assessment, philosophical contribution). (No direct quotes).

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a potent pairing for a seminar. Using *The Lottery* to stress-test Lewis forces students to move beyond the slogan that "conventions are arbitrary social rules" and grapple with the game-theoretic machinery under the hood.

  Here is a reading of the story through Lewis's framework, followed by an assessment of where the framework breaks, designed to guide your session.

  ### 1. The Lewisian Fit: Surface Regularities
  If you ask students to map the text onto Lewis's necessary conditions for convention, the story initially looks like a perfect match. This is the hook.

  *   **Regularity and Recurrence:** The lottery is a strict regularity in behaviour. It happens annually, on a specific date, with a specific procedure.
  *   **Mutual Expectation:** The villagers gather without needing to be summoned individually. They expect one another to be there. The children gathering stones early indicates that the expectation is intergenerational and deeply embedded in common knowledge.
  *   **Arbitrariness (The Alternative Regularity):** Lewis insists a convention must have at least one alternative that could have served the same purpose. The report that neighbouring villages have abolished the lottery provides this. It proves that social order is possible without the stoning. The specific date, the specific box, and the specific ritual are not dictated by nature; they are contingent.
  *   **Common Knowledge:** The procedure is public. Everyone knows the rules, everyone knows that everyone knows, and the ritual objects (the black box, the slips of paper) serve as focal points that coordinate attention.

  In a superficial reading, the lottery is a convention: an arbitrary regularity sustained by mutual expectation.

  ### 2. The Lewisian Break: The Coordination Problem
  The reading strains when you interrogate the *function* of the regularity. This is where the seminar should pivot from application to critique.

  Lewis defines a convention as a solution to a **recurrent coordination problem**. In a coordination problem (like driving on the left vs. the right), agents have a shared interest in coordinating. I prefer to drive on the left *if and only if* you do. We both prefer the equilibrium to the crash.

  **The Lottery fails this condition.**
  *   **No Shared Benefit:** There is no evidence the villagers gain from the lottery. There is no "coordination payoff." They are not coordinating to achieve a benefit; they are coordinating to inflict a cost.
  *   **Conditional Preference:** Lewis requires that everyone prefers to conform *on condition that others conform*. In the lottery, the villagers do not appear to prefer stoning their neighbour even if everyone else is doing it. They participate out of fear, habit, or social pressure, not because participation solves a problem for them.
  *   **The Equilibrium:** In Lewis's model, no one would do better by acting differently *given that others conform*. In the story, if everyone stopped, everyone would be better off (no one dies). The current state is not a coordination equilibrium; it is a **social trap** or a **bad equilibrium**.

  Therefore, strictly speaking, **the lottery is not a Lewisian convention.** It lacks the underlying structure of mutual benefit that defines a coordination equilibrium.

  ### 3. Alternative Classifications: Norms, Traditions, and Ignorance
  If it is not a convention, what is it? The story helps distinguish between overlapping concepts in social ontology.

  *   **Social Norm (Sanction-Backed):** Unlike a Lewisian convention, which is self-enforcing because coordination is beneficial, a norm is often enforced by sanctions. Tessie's dissent is met with stones. The villagers conform not because they want to coordinate, but because they fear the cost of defection. This aligns better with Cristina Bicchieri's account of norms (which incorporates empirical and normative expectations) than Lewis's account of conventions.
  *   **Vestigial Tradition:** The story dramatises a practice that has outlived its purpose. Old Man Warner cites the old ploughman's rhyme ("Lottery in June, corn be heavy soon"), suggesting the practice originated as a ritual sacrifice to ensure harvest. If the agricultural belief is gone but the practice remains, it is a tradition sustained by inertia, not a convention sustained by current coordination needs.
  *   **Pluralistic Ignorance:** There is a hint that many villagers are uneasy (the nervous laughter, the hesitation) but participate because they believe *others* endorse the practice. If everyone privately dislikes the lottery but publicly supports it because they think everyone else supports it, this is pluralistic ignorance. Lewis's framework assumes preferences are known or revealed through coordination; it struggles to model hidden preferences that sustain a harmful practice.

  ### 4. Scene Analysis for the Seminar
  Use these specific moments to anchor the philosophical distinctions:

  *   **The Black Box:** The box is shabby, splintered, and not the original. The villagers refuse to replace it, yet they treat it as sacred. For Lewis, the focal point of a convention can be anything, provided it coordinates. Here, the box coordinates, but it also *constrains*. It represents the weight of precedent. It shows how the *arbitrariness* of a convention can calcify into *necessity* over time.
  *   **Old Man Warner:** He is the guardian of the "common knowledge." When told other villages have quit, he calls them a "pack of crazy fools." He represents the belief that the convention is necessary for social order, even when evidence (other villages surviving) suggests otherwise. He embodies the fear that defection leads to chaos, a fear that sustains bad equilibria.
  *   **Tessie Hutchinson:** She arrives late, chatting casually, showing the practice is routine. But when selected, she screams, "It isn't fair." Her shift from participant to victim highlights the coercive nature of the practice. In a Lewisian convention, a defector just fails to coordinate (e.g., drives on the wrong side). In the lottery, the "defector" (the selected victim) is destroyed. This reveals the violence underpinning this specific social regularity.
  *   **The Other Villages:** The mention that other villages have abolished the lottery is the most philosophically significant detail. For Lewis, the existence of alternatives proves arbitrariness. But here, it proves the lottery is *unnecessary*. If it were a true coordination convention required for social functioning, abandoning it should lead to disorder. Since the neighbours are fine without it, the lottery is revealed as a purely parasitic practice.

  ### 5. Evolution of Norms vs. Lewis's Framework
  Does the story support an evolutionary account? Yes, but it highlights a failure mode Lewis ignores.

  *   **Path Dependence:** The story supports the idea that practices arise and decay through precedent and imitation. The cost of being the first to defect (being stoned, or ostracized like Warner fears) is too high. This explains the *persistence* of the practice better than Lewis's rational choice model.
  *   **The Gap in Lewis:** Lewis explains how we solve coordination problems. He does not adequately explain how we get stuck in *harmful* equilibria that everyone would prefer to leave. His theory assumes that if a regularity is arbitrary and alternative equilibria exist, rational agents might shift. *The Lottery* shows that without a mechanism to shift expectations simultaneously (a "focal point" for change), a population can remain locked in a harmful practice indefinitely. Lewis's theory is better at explaining the stability of traffic laws than the stability of human sacrifice.

  ### 6. What Jackson Adds to the Debate
  Argument alone often sanitizes social ontology. We talk about "equilibria" and "regularities" in the abstract. Jackson forces us to confront the **moral phenomenology** of convention.

  *   **The Banality of Compliance:** Lewis treats conformity as a rational response to expectations. Jackson shows conformity as a mundane, unthinking habit. The children play while the adults prepare to kill. This suggests that many social regularities are not maintained by active rational calculation (as Lewis implies) but by a failure to reflect.
  *   **The Violence of Arbitrariness:** Lewis celebrates arbitrariness—it shows that reason doesn't dictate one rule over another. Jackson shows the dark side: if the rule is arbitrary, the suffering it causes is gratuitous. There is no "greater good" balancing the scales.
  *   **The Limits of Common Knowledge:** In Lewis, common knowledge stabilizes cooperation. In Jackson, common knowledge stabilizes complicity. Everyone knows what is happening, and that shared knowledge is what makes escape impossible.

  ### Conclusion for the Session
  Be honest with your students: **The Lottery is not a convention in the Lewisian sense.** It is a social norm or a tradition sustained by sanction and inertia, masquerading as a convention.

  Use this mismatch productively. Lewis gives us the vocabulary to identify the *structure* of the practice (regularity, expectation, arbitrariness), but Jackson reveals the *pathology* that the vocabulary misses. The story demonstrates that a practice can satisfy the formal conditions of a convention (everyone does it, expects others to do it, alternatives exist) while failing the functional condition (solving a coordination problem for mutual benefit).

  This makes *The Lottery* an ideal tool for moving students from Lewis's account of **conventions** to broader theories of **social norms** and **collective intentionality** that can account for coercion, harm, and irrational persistence. It shows that social ontology cannot be purely descriptive; it must account for why some regularities persist even when they serve no one.
