  Consider the case anchoring our day. A man, facing early Alzheimer's, wrote a directive. He refused residential care. He refused aggressive treatment for pneumonia. He wrote that a life without recognizing his family was not a life he wanted. He was competent. He was clear.

  Years later, he is in a care home. He has been there fourteen months. Staff say he is settled. He is often cheerful. He greets caregivers by name. When pneumonia came this spring, he asked to be treated. He understood enough to ask for life.

  Here is the friction. If we honor the directive, we prioritize the man who feared loss of self. We respect his plan to avoid a life he deemed undignified. But to do so might mean overriding the man sitting in the chair today, who finds joy in a song, who knows his nurse, who wants to stay.

  If we honor the present request, we prioritize the man who is here. We respect his current comfort and his will to live. But to do so dismisses the serious moral work of the man who wrote the directive. It suggests his fears were irrelevant, that his definition of a good life doesn't count because he can no longer defend it.

