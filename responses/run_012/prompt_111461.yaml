answer: |-
  The central dispute is whether the truth predicate functions solely as a logical device for expression and generalization or whether it denotes a substantive property that plays an indispensable role in explaining cognition, meaning, and successful action.

  **I. Agreed Claims**

  1.  **Extensional Adequacy:** Any acceptable theory must entail the T-schema biconditionals (e.g., "Snow is white" is true if and only if snow is white) for all non-paradoxical sentences; both sides accept this as a baseline constraint on extensional correctness.
  2.  **No Naive Correspondence:** Both sides reject the view that truth is definable via a simple, isomorphic correspondence relation between sentences and specific bits of the world; the relation between language and reality is not structurally mirror-like.
  3.  **Expressive Utility:** Both sides agree that the truth predicate performs indispensable logical work, specifically allowing for endorsement of claims without repetition and generalization over infinite sets of sentences (e.g., "Everything in the file is true").
  4.  **The Liar Obligation:** Both sides acknowledge that any complete theory must offer a resolution or dissolution of semantic paradoxes (such as the Liar Paradox) without collapsing into inconsistency or triviality.
  5.  **Connection to Mind:** Both sides agree that truth is constitutively linked to the norms of belief and assertion; it is not possible to fully characterize belief or assertion without referencing truth.
  6.  **Ordinary vs. Theoretical:** Both sides admit it is an open empirical and conceptual question whether the ordinary English word "true" picks out the exact same notion as the theoretical construct employed in semantics or metaphysics.

  **II. Points of Disagreement**

  | Disagreement | Deflationist Wording | Inflationist Wording | Crux It Turns On |
  | :--- | :--- | :--- | :--- |
  | **Nature of Truth** | Truth is not a robust property; the predicate is a logical device that enables us to express generalizations we could not otherwise formulate. | Truth is a genuine property of propositions or sentences; it is a feature of representations that explains their relationship to the world. | (d) Property |
  | **Explanatory Role** | Truth does not explain why beliefs are successful or how meaning is determined; it merely disquotes or endorses the content that does the explaining. | Truth explains why true beliefs tend to lead to successful action and plays a necessary role in theories of meaning and representation. | (a) Explanatory Work |
  | **Normativity** | The norm of assertion is grounded in warrant or evidence; invoking truth adds no normative force beyond what epistemic justification already provides. | The norm of assertion is grounded in truth itself; one ought to assert only what is true, regardless of available evidence or warrant. | (b) Normativity |
  | **Success of Action** | The link between true belief and successful action is conceptual or trivial; success is explained by the specific content of the belief, not its truth value. | The link between true belief and successful action is substantive; truth is the common feature across diverse beliefs that explains their reliable success. | (c) Success |

  **III. The Cruxes: Tests, Predictions, and Falsification**

  **Crux (a): Explanatory Work in Semantics**
  *   **The Test (Conservativeness):** Take a base theory $S$ (e.g., Peano Arithmetic) formulated in a language without a truth predicate. Construct an extended theory $S+$ by adding the truth predicate and the T-schema axioms, but no other new non-logical axioms. Can $S+$ prove sentences in the original language of $S$ that $S$ could not prove on its own?
  *   **Deflationist Prediction:** No (or if yes, it is a logical artifact). Truth should be conservative over the base theory; if it proves new facts about the world (or numbers), it is doing more than just expressing generalizations.
  *   **Inflationist Prediction:** Yes. Truth allows us to prove substantive claims (e.g., the consistency of the base theory) that the base theory cannot, demonstrating it adds explanatory power.
  *   **Evidence Against Deflationist:** If $S+$ proves the consistency of $S$ and this cannot be explained away as merely a logical convenience, deflationism fails to account for the substantive power of truth.
  *   **Evidence Against Inflationist:** If truth turns out to be strictly conservative over any base theory, the claim that truth adds substantive explanatory content to semantics is undermined.

  **Crux (b): Normativity of Assertion**
  *   **The Test (The Knowledge/Truth Gap):** Consider a case where a speaker asserts $P$, has strong evidence for $P$, and is fully warranted, but $P$ is false (due to unlucky circumstances). Is the assertion defective in a way that warrant alone cannot capture?
  *   **Deflationist Prediction:** No. The assertion is epistemically proper because the speaker followed the norms of evidence; calling it "defective" solely because it is false adds no explanatory value.
  *   **Inflationist Prediction:** Yes. The assertion violates the constitutive norm of assertion (assert only what is true); truth imposes a requirement distinct from mere warrant.
  *   **Evidence Against Deflationist:** If speakers consistently judge such assertions as defective even when warrant is maximal, this suggests a norm independent of evidence (i.e., truth) is operative.
  *   **Evidence Against Inflationist:** If all normative assessments of the assertion can be fully exhausted by citing the speaker's evidence and intentions without referencing truth, the truth-norm is redundant.

  **Crux (c): Success of Action**
  *   **The Test (Desire-Belief-Action Explanation):** Explain why an agent who wants water and believes there is water in the kitchen goes to the kitchen and gets water. Does the explanation require citing the *truth* of the belief, or only the *content*?
  *   **Deflationist Prediction:** Only content. The explanation works via the causal role of the belief state ("belief that water is in the kitchen"); adding "and this belief is true" is redundant once the content is specified.
  *   **Inflationist Prediction:** Truth is required. The success of the action depends on the belief matching the world; without the property of truth, the link between internal state and external success is unexplained.
  *   **Evidence Against Deflationist:** If agents with false beliefs of identical content structure systematically fail while true believers succeed, and this pattern holds across varying content types, truth is doing explanatory work.
  *   **Evidence Against Inflationist:** If the causal chain of action is fully described by the neurophysiological or functional role of the belief state without referencing its truth conditions, truth is explanatorily idle.

  **Crux (d): The Notion of "Property"**
  *   **The Test (Causal vs. Logical Predication):** Analyze whether "truth" enters into causal laws or nomic explanations in the same way as recognized properties (e.g., mass, charge), or whether it functions solely as a logical predicate.
  *   **Deflationist Prediction:** Logical predicate. "Truth" is a property only in the thin sense that any grammatical predicate expresses a "property"; it has no causal powers.
  *   **Inflationist Prediction:** Causal/Explanatory posit. "Truth" is a property in the thick sense that it figures in scientific or metaphysical explanations of why cognition succeeds.
  *   **Evidence Against Deflationist:** If truth is shown to be a natural kind or enters into fundamental causal laws of psychology or physics.
  *   **Evidence Against Inflationist:** If truth is eliminable from all causal explanations without loss of predictive power, leaving it as merely a logical device.

  **IV. Verbal Dispute Analysis**

  A significant portion of the dispute is verbal, centering on Crux (d). If "property" is defined thinly (whatever a predicate expresses), the Deflationist must admit truth is a property, rendering the label "Deflationism" potentially misleading. If "property" is defined thickly (something that earns its keep in causal explanation), the Inflationist must prove truth earns that keep.

  Once this verbal ambiguity is stripped out, the remaining substantive disagreement concerns **explanatory indispensability** (Cruxes a and c). The question is not whether truth is a "property" in the abstract, but whether positing truth as a substantive feature of reality yields better explanations of semantic competence, logical power, and successful action than positing it as a mere logical device. If the Deflationist can account for conservativeness, norms, and success without substantive truth, their view holds; if the Inflationist can demonstrate that these phenomena remain inexplicable without a robust truth property, their view holds. The fight over the word "property" is a proxy for the fight over explanatory necessity.
