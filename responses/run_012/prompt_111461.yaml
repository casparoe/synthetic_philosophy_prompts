  ok so I'm in a phil of language / metaphysics seminar this term and we spent two weeks on truth. the class has split in half: the deflationists (truth isn't a real property, the predicate is just a device for endorsing and for generalizing, the biconditional schema is basically all there is to say) and the camp that thinks truth is doing genuine explanatory work and that something like correspondence has to be right. two of my friends have been arguing about this for a month now and I'm pretty sure they're talking past each other on at least one point.

  can you write the joint statement they could both actually sign? like an adversarial-collaboration writeup — not a dialogue, not you picking a winner.

  what I want in it:

  1) the claims both sides accept. things like: the schema pairing each sentence with a claim that it's true just in case things are that way is at least extensionally right; truth isn't definable by any simple correspondence relation between sentences and bits of the world; the truth predicate does indispensable work as a device for endorsing someone elses claim and for generalizing (saying everything in the file is true without listing the contents); both sides owe an account of the liar; both think truth has something to do with assertion and belief; both should admit it's an open question whether the ordinary word "true" picks out the same thing as the theoretical notion theyre actually fighting about.

  2) where they really part, with each formulation written so that the side holding it would say yes thats my view, and the other side would say fine, thats a fair statement of your view.

  3) the cruxes. my guess: (a) whether the explanatory work truth does in semantics and the theory of meaning requires a property, or whether an expressive device can do that work; (b) whether a thin, deflationary truth can be normative for belief and assertion, or whether norms need a thicker notion; (c) whether the fact that true beliefs tend to lead to successful action is an arguement for anything, or is trivial once you see what the word means; (d) whether the word "property" is doing all the work here — if it just means whatever a predicate expresses then everyone's a deflationist, and if it means something that earns its keep in explanations then maybe nobody is.

  for each crux give me a case or argument that both sides agree would actually bear on it, plus each side's prediction written down in advance, plus what each side would count as evidence against its own view. I want something concrete, not more research needed. heres my attempt at one for (a), fix it if I've got it garbled: take a theory in a language with no truth predicate, add the truth predicate and the schema and nothing else — can you now prove things about the old language that you couldnt before? if yes, truth is pulling real weight and the deflationist has a problem; if no, it's purely expressive and the inflationist owes an account of what else the property is for. I think both of them should be able to agree that the test matters even while disagreeing about how it comes out. same kind of thing for the other cruxes if you can manage it.

  also: is part of their fight just verbal? if so, say which part and why, and what's left once you strip that out.

  format: numbered agreed-claims section first, then a table for the disagreements (the disagreement | deflationist wording | inflationist wording | crux it turns on). and please start right in with the statement itself — open with the one-sentence version of what the whole dispute actually comes down to, then go straight into the numbered claims. no preamble, no restating my question, no here is the joint statement.

  no citations, no reading list, I dont need names or dates — I just want the document.
