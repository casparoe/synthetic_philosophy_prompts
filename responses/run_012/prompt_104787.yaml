  ### Part 3: The Single Revision

  **Recommendation:** **Abandon (3) Restrictivism in favor of Mereological Universalism.**

  **Why this revision?**
  1.  **Resolves the (1)+(3) Tension:** Universalism dissolves the arbitrariness problem. If *every* fusion exists, there is no question of "why these two objects?" The Lump, the Statue, and the Doorstop all exist because the parts exist. The question shifts from "What exists?" to "Which concepts pick out real objects?", which is easier to ground physically.
  2.  **Aligns with (2) Perdurantism:** The standard, most coherent package for a perdurantist is Universalism (e.g., Sider). Restrictivism is an awkward fit for 4D worms, as it requires drawing arbitrary boundaries in spacetime that often conflict with the continuity of matter.
  3.  **Mitigates the (1)+(4) Grounding Problem:** While it doesn't solve the Grounding Problem entirely, it removes the pressure to explain why *specific* macro-objects are privileged. You only need to ground the *properties* of the objects, not their *existence* (since all fuses exist).

  **The Cost:**
  *   **Ontological Bloat:** You must accept the existence of "gerrymandered" objects (e.g., the fusion of the Statue and the Moon).
  *   **Semantic Shift:** You must clarify that while all these objects *exist*, not all are *salient* or named by our sortals. This requires a robust error theory or contextualism about ordinary object talk.

  **What you lose:**
  *   You lose the intuitive claim that "there is no object here" in cases of scattered parts or accidental arrangements. You must say "There is an object, but it's not a *substance* in the Aristotelian sense."

