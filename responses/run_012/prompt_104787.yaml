  ### Part 2: Case Study Predictions

  Here is how your current package (1–4) handles the specific cases.

  **(a) The Recasting Case**
  *   **Prediction:** The Lump-worm extends past the melting time $t$; the Statue-worm terminates at $t$. They share temporal parts prior to $t$.
  *   **Consistency Check:** **Consistent with (1) & (2), but strains (4).**
      *   *Why:* During the overlap, the temporal parts are microphysically identical. For (4) to hold, the fact that *this* part belongs to a Statue-worm (which ends at $t$) and *that* part belongs to a Lump-worm (which continues) must be grounded in the microphysics. Since the microphysics at the overlap is identical, the grounding must rely on *future* facts (the melting). This implies backward-looking grounding or that the worm's identity is determined by its entire length, not its parts.
      *   *Verdict:* Workable, but requires a holistic view of temporal parts that complicates (4).

  **(b) The Erosion/Found Statue**
  *   **Prediction:** **Inconsistent with (3).**
      *   *Why:* Microphysically, the eroded rock is identical to a crafted statue. If (1) says a statue exists when bronze is arranged statuely, and (4) says existence is grounded in that arrangement, then a statue *must* exist in the erosion case. However, (3) Restrictivism typically blocks objects formed by "accidental" processes (no arbitrary undetached parts).
      *   *Verdict:* You cannot consistently say "No statue exists here" without violating (1) or (4), nor can you say "A statue exists here" without violating the spirit of (3) (which usually excludes artifact-like objects without makers). You are forced to admit a "natural statue" object, which strains the sortal 'statue'.

  **(c) The Statue/Doorstop**
  *   **Prediction:** **Three Objects (Lump, Statue, Doorstop).**
      *   *Why:* If 'Statue' and 'Doorstop' confer different modal properties (e.g., the doorstop survives flattening, the statue does not), then (1) mandates distinct objects.
      *   **Consistency Check:** **Consistent with (1), Fatal for (3).**
      *   *Verdict:* This is the reductio of your specific combination of (1) and (3). If you allow coincidence for Statue/Lump, you have no principled ground within (3) to block the Doorstop. Restrictivism is supposed to prevent ontological bloat; Coincidentalism guarantees it. Holding both makes your restriction principle look unmotivated.

