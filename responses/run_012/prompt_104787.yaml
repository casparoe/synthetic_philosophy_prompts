  ### Part 4: Final Position Statement for Seminar

  *Present this revised package to your department. It is internally tighter and defends against the "arbitrariness" objection.*

  **Revised Commitments:**
  1.  **Coincidentalism:** Constitution is not identity. Distinct objects (worms) can occupy the same spacetime region, distinguished by their modal profiles and temporal extent.
  2.  **Perdurantism:** Objects are 4D spacetime worms persisting by having temporal parts.
  3.  **Mereological Universalism:** For any plurality of objects, there exists a fusion. (Replaces Restrictivism).
  4.  **Grounding Physicalism:** Macro-properties (including sortal membership) are grounded in microphysical arrangement and *causal history*.

  **Defense Summary:**
  "This view accepts that ontology is abundant (Universalism) but maintains that our *conceptual* scheme is selective. The Lump and Statue are distinct worms because they have different future parts and different historical grounds (Physicalism). The erosion case yields a 'statue-shaped object,' but whether it falls under the sortal 'statue' depends on whether 'statue' requires an agent—a semantic question, not an ontological one. This avoids the arbitrariness of Restrictivism while preserving the modal intuitions of Coincidentalism."
