  **Dana:** Fine. If we treat the 1% seriously, then technically, yes, there is a metaphysical possibility. But your roommate's "Obviously No" comes from the *practical* impossibility. In the context of moral responsibility and free will debates, we usually idealize these thought experiments. We assume the intervener works. If we assume the Warden works, your roommate is right. The ability is gone.

