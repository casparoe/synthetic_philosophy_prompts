  **Dana:** Exactly! It fires on the choice. That's the point. You can't make the choice that leads to smoking. The choice to smoke is the trigger. If the trigger guarantees prevention, you can't complete the action. It's like trying to turn on a light bulb that is wired to shatter the moment current hits it. Can you turn on the light? No.

