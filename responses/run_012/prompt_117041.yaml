          *   Feasible Frontier: $x_1 + x_2 = 10$.
          *   Calculation: Proportional gain.
          *   *Wait, check KS math:* KS maintains the ratio of *gains*. $\frac{u_1 - d_1}{a_1 - d_1} = \frac{u_2 - d_2}{a_2 - d_2}$.
          *   If $a_1 = a_2 = 10$ (total hours).
          *   If $d_1 = 0$ hours value, $d_2 = 2$ hours value (equivalent).
          *   Ratio: $\frac{x_1 - 0}{10 - 0} = \frac{x_2 - 2}{10 - 2}$. And $x_1 + x_2 = 10$.
          *   Solve for $x_1, x_2$.
      *   *Case B (Authorship):*
          *   3 Parties.
          *   Ordinal good (1st, 2nd, 3rd), not cardinal.
          *   KS requires cardinal utility.
          *   *Verdict:* Procedure refuses.

  6.  **Refining the Output Structure:**

      *   **Header:** Clear title, audience, purpose.
      *   **The Protocol:** Numbered steps, clear distinction between "Arithmetic" and "Judgment."
      *   **The Guardrails:** The four failure modes explicitly integrated.
      *   **The Escalation:** When does the Director step in?
      *   **The Case Studies:** Detailed walkthroughs.

  7.  **Self-Correction/Nuance Check:**

      *   *Correction on KS:* The prompt says "proposes the point on the straight line between the two [disagreement and aspiration]... on the understanding that this rule is meant to be efficient... indifferent to scaling... neither side's share can fall when options open to the other side improve." This confirms KS.
      *   *Correction on Aspiration:* In standard KS, the "Ideal Point" is the maximum utility each player can get *within the feasible set* while the other gets at least their disagreement utility. It is *not* just "what they want." The procedure must enforce this definition to prevent gaming. The Ombuds must determine the *physical* maximum, not the *claimed* maximum.
      *   *Correction on 3-Party:* There are generalizations of KS to $n$-players, but they lose properties or become computationally heavy. For a 1-hour mediation, it's safer to say "Procedure Not Applicable."
      *   *Correction on Lumpiness:* KS assumes a convex set. If the set is discrete (blocks of time), the line might not hit a point. The procedure needs a "Nearest Feasible Neighbor" rule, with a tie-breaker.
      *   *Director Role:* The prompt says the Director signs off on *binding* splits. The Ombuds can propose. If the math is clean, Ombuds recommends. If judgment was heavy or tie-break needed, Director decides.

  8.  **Final Polish:**

      *   Ensure tone is "Science Desk" -> "Ombuds Office." Practical, not academic.
      *   Check word count/depth. Needs to be dense but readable.
      *   Make sure the "Judgment vs. Arithmetic" tags are visible.
      *   Ensure the "Refusal" in Case B is explicit and justified.

  9.  **(Self-Correction during drafting Case A):**
      *   Need to make sure the units match. If Lab 2 has an outside option worth money, but the resource is time, we need to convert. Let's assume the resource is "Time" and the value is "Effective Time."
      *   Actually, simpler: Normalize everything to the resource units (Hours).
      *   Lab 1 BATNA: 0 hours (cannot do experiment).
