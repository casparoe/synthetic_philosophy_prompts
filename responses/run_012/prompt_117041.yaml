              3.  Three-party extension (authorship).
              4.  Non-convexity/Lumpiness (instrument time).
          *   Distinguish between arithmetic steps and judgment steps.
          *   Identify where the procedure breaks/refuses to answer.
          *   Run two specific cases:
              1.  Microscope time (2 labs, asymmetric alternatives).
              2.  Authorship order (3 co-authors).
      *   **Tone:** Professional, actionable, precise, honest about limitations (no manufacturing numbers).

  2.  **Deconstruct the Kalai-Smorodinsky (KS) Solution:**

      *   *Core Idea:* Connect the Disagreement Point ($d$) to the Ideal Point ($a$). Find the intersection of this line with the Pareto Frontier of the Feasible Set ($S$).
      *   *Properties:* Individual Monotonicity (if the feasible set expands for one player, they shouldn't lose), Scale Invariance.
      *   *Challenge:* The standard definition requires knowing the *entire* feasible set to find the ideal point (the maximum possible utility for Player 1 given Player 2 gets at least $d_2$, and vice versa). In practice, parties claim aspirations.
      *   *Adaptation for Ombuds:* We need a heuristic to approximate the "Ideal Point" without mapping the whole set, while guarding against inflation.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Setup.* Define the resource.
      *   *Step 2: Disagreement Point ($d$).* This is the BATNA. Needs verification.
      *   *Step 3: Aspiration Point ($a$).* This is the "utopia" claim. Needs anchoring.
      *   *Step 4: The Line.* Draw the line between $d$ and $a$.
      *   *Step 5: The Intersection.* Find the feasible point on/near that line.
      *   *Step 6: Approval.* Ombuds vs. Director.

      *Refining for Constraints:*
      *   *Time:* Must be fast. No complex utility functions. Use proportional shares of the specific resource where possible, or convert to a common metric (hours/dollars).
      *   *Gaming:* How to stop inflation of $a$? The KS solution defines $a$ based on the *feasible set's maximum*, not the *player's wish*. The procedure must empower the ombuds to cap $a$ based on physical reality, not stated desire.
      *   *3-Party:* KS doesn't generalize uniquely. Need to flag this as a "Refusal" case.
      *   *Lumpiness:* KS assumes convexity. If the line hits a gap, we need a rounding rule (nearest feasible point that doesn't hurt one party disproportionately).

  4.  **Addressing the Four Failure Modes:**

      1.  *Disagreement Point:* If parties lie about BATNA, $d$ shifts. *Mitigation:* Require evidence for BATNA. If unverifiable, use Status Quo as default $d$. Mark as "Judgment."
      2.  *Aspiration Point:* If parties claim 100% of resource, the line is diagonal. *Mitigation:* Ombuds defines $a$ based on *technical maximum* (e.g., total available hours), not *claimed value*. Mark as "Judgment/Arithmetic."
      3.  *Three-Party:* KS is 2D. 3D KS exists but is contested/complex. *Decision:* Procedure refuses to generate a number. Recommends alternative (rotation/lottery).
      4.  *Lumpiness:* Line might land in a "forbidden zone" (e.g., 3.5 hours when min block is 4). *Mitigation:* Round to nearest feasible block. If tie, flip to Director.

  5.  **Running the Cases:**

      *   *Case A (Microscope):*
          *   Lab 1 (No alternative): $d_1 = 0$ value if no deal.
          *   Lab 2 (Alternative): $d_2 = \$X$ value (or equivalent time elsewhere).
