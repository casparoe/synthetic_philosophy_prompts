  **TO:** Ombudsperson Office Staff
  **FROM:** Science Desk
  **SUBJECT:** The Proportional-Gain Protocol (Kalai–Smorodinsky Implementation)
  **DATE:** October 26, 2023

  This document provides a step-by-step decision procedure for resolving two-party resource disputes. It implements the **Kalai–Smorodinsky (KS) bargaining solution**. Unlike the Nash solution (which maximizes the product of gains), this rule preserves **monotonicity**: if the feasible options improve for one party, that party's share cannot decrease.

  **Constraint Checklist:**
  *   **Time:** 60 minutes max.
  *   **Authority:** Ombudsperson recommends; Director approves binding splits.
  *   **Math:** Linear algebra (high-school level).
  *   **Limitations:** Explicitly handles non-convexity and multi-party failures.

  ---

  ### PART I: THE PROCEDURE

  **Step 1: Define the Resource Unit (Arithmetic)**
  Convert the dispute into a single, divisible metric.
  *   *Examples:* Hours of instrument time, dollars of budget, percentage of credit (only if convertible to tangible benefit).
  *   *Action:* Write down the **Total Available Resource ($T$)**.
  *   *Constraint:* If the resource is ordinal (e.g., "First Author" vs. "Second Author") and cannot be converted to a shared metric (like credit percentage or rotation), **STOP**. See *Failure Mode 3*.

  **Step 2: Establish the Disagreement Point ($d$) (Judgment)**
  Identify what happens if no deal is reached today. This is not necessarily the status quo; it is the **Best Alternative to a Negotiated Agreement (BATNA)**.
  *   *Party A Value ($d_A$):* Value Party A retains if talks fail.
  *   *Party B Value ($d_B$):* Value Party B retains if talks fail.
  *   *Verification:* Ask for evidence of the alternative (e.g., a quote from a core facility, a budget letter).
  *   *Guardrail:* If a party claims an alternative but provides no evidence within 10 minutes, default $d$ to **0** for that party.
  *   *Risk:* Parties may inflate $d$. If $d_A + d_B > T$, the procedure **FAILS**. (See *Failure Mode 1*).

  **Step 3: Anchor the Aspiration Point ($a$) (Judgment/Arithmetic)**
  Identify the maximum possible gain for each party *within physical reality*, ignoring the other party's claims.
  *   *Definition:* $a_A$ is the maximum resource Party A could physically use if Party B got nothing (but still got at least $d_B$). Usually, this is simply $T$.
  *   *Guardrail:* Do not accept "I need 100%" as $a_A$. Set $a_A = T$ and $a_B = T$ unless physical constraints limit one party (e.g., a sample degrades after 5 hours).
  *   *Risk:* Parties may claim $a > T$. Ignore claims. Use physical maximums. (See *Failure Mode 2*).

  **Step 4: Calculate the Proportional Gain Line (Arithmetic)**
  The KS solution requires that both parties achieve the same **percentage of their possible gain**.
  *   *Formula:* Find the allocation $(x_A, x_B)$ such that:
      $$ \frac{x_A - d_A}{a_A - d_A} = \frac{x_B - d_B}{a_B - d_B} $$
      Subject to: $x_A + x_B = T$
  *   *Calculation:*
      1.  Calculate Gain Range A: $R_A = a_A - d_A$
      2.  Calculate Gain Range B: $R_B = a_B - d_B$
      3.  Solve for $x_A$: $x_A = \frac{R_A \cdot (T - d_B) + R_B \cdot d_A}{R_A + R_B}$
      4.  Solve for $x_B$: $x_B = T - x_A$

  **Step 5: Adjust for Lumpiness (Judgment)**
  Real resources are often discrete (e.g., 4-hour blocks). The calculated $x$ may land in a "forbidden zone."
  *   *Rule:* Round to the nearest feasible block that sums to $T$.
  *   *Tie-Break:* If the calculation lands exactly halfway between two feasible blocks (e.g., 4.5 hours when blocks are 1 hour), **DO NOT DECIDE**. Escalate to Director. (See *Failure Mode 4*).

  **Step 6: Authorization (Protocol)**
  *   **Ombudsperson Authority:** You may present this calculation as a *recommendation* if Step 5 required no rounding or trivial rounding (
  **MEMORANDUM**

  **TO:** Ombudsperson Office Staff
  **FROM:** Science Desk
  **DATE:** October 26, 2023
  **SUBJECT:** Operational Protocol: The Proportional-Gain Procedure (Kalai–Smorodinsky)

  **Purpose:**
  This document provides a decision procedure for resolving two-party internal resource disputes. It implements the **Kalai–Smorodinsky (KS) bargaining solution**. Unlike the more common Nash solution (which maximizes the product of gains), this rule prioritizes **monotonicity**: if the feasible options improve for one party, that party's share cannot decrease.

  **Constraints:**
  *   **Time:** 60 minutes per dispute.
  *   **Authority:** Ombudsperson recommends; Director approves binding splits.
  *   **Math:** Linear algebra (high-school level).
  *   **Limitations:** Explicitly handles non-convexity and multi-party failures.

  ---

  ### PART I: THE PROCEDURE

  **Step 1: Define the Resource Unit (Arithmetic)**
  Convert the dispute into a single, divisible metric.
  *   *Examples:* Hours of instrument time, dollars of budget, percentage of credit (only if convertible to tangible benefit).
  *   *Action:* Write down the **Total Available Resource ($T$)**.
  *   *Constraint:* If the resource is ordinal (e.g., "First Author" vs. "Second Author") and cannot be converted to a shared metric (like credit percentage or rotation), **STOP**. See *Failure Mode 3*.

  **Step 2: Establish the Disagreement Point ($d$) (Judgment)**
  Identify what happens if no deal is reached today. This is not necessarily the status quo; it is the **Best Alternative to a Negotiated Agreement (BATNA)**.
  *   *Party A Value ($d_A$):* Value Party A retains if talks fail.
  *   *Party B Value ($d_B$):* Value Party B retains if talks fail.
  *   *Verification:* Ask for evidence of the alternative (e.g., a quote from a core facility, a budget letter).
  *   *Guardrail:* If a party claims an alternative but provides no evidence within 10 minutes, default $d$ to **0** for that party.
  *   *Risk:* Parties may inflate $d$. If $d_A + d_B > T$, the procedure **FAILS**. (See *Failure Mode 1*).

  **Step 3: Anchor the Aspiration Point ($a$) (Judgment/Arithmetic)**
  Identify the maximum possible gain for each party *within physical reality*, ignoring the other party's claims.
  *   *Definition:* $a_A$ is the maximum resource Party A could physically use if Party B got nothing (but still got at least $d_B$). Usually, this is simply $T$.
  *   *Guardrail:* Do not accept "I need 100%" as $a_A$. Set $a_A = T$ and $a_B = T$ unless physical constraints limit one party (e.g., a sample degrades after 5 hours).
  *   *Risk:* Parties may claim $a > T$. Ignore claims. Use physical maximums. (See *Failure Mode 2*).

  **Step 4: Calculate the Proportional Gain Line (Arithmetic)**
  The KS solution requires that both parties achieve the same **percentage of their possible gain**.
  *   *Formula:* Find the allocation $(x_A, x_B)$ such that:
      $$ \frac{x_A - d_A}{a_A - d_A} = \frac{x_B - d_B}{a_B - d_B} $$
      Subject to: $x_A + x_B = T$
  *   *Calculation:*
      1.  Calculate Gain Range A: $R_A = a_A - d_A$
      2.  Calculate Gain Range B: $R_B = a_B - d_B$
      3.  Solve for $x_A$: $x_A = \frac{R_A \cdot (T - d_B) + R_B \cdot d_A}{R_A + R_B}$
      4.  Solve for $x_B$: $x_B = T - x_A$

  **Step 5: Adjust for Lumpiness (Judgment)**
  Real resources are often discrete (e.g., 4-hour blocks). The calculated $x$ may land in a "forbidden zone."
  *   *Rule:* Round to the nearest feasible block that sums to $T$.
  *   *Tie-Break:* If the calculation lands exactly halfway between two feasible blocks (e.g., 4.5 hours when blocks are 1 hour), **DO NOT DECIDE**. Escalate to Director. (See *Failure Mode 4*).

  **Step 6: Authorization (Protocol)**
  *   **Ombudsperson Authority:** You may present this calculation as a *recommendation* if Step 5 required no rounding or trivial rounding (<5% loss of efficiency).
  *   **Director Authority:** Any binding split, any case requiring Step 5 Tie-Break, or any case where $d$ was assumed due to lack of evidence must be signed by the Director.

  ---

  ### PART II: FAILURE MODES & GUARDRAILS

  **1. The Disagreement Point Trap (Misreporting BATNA)**
  *   **The Risk:** A party claims they have a lucrative outside option ($d$) to force a better split.
  *   **The Break:** If verified $d_A + d_B > T$, the "Feasible Set" is empty. The KS line cannot be drawn.
  *   **Procedure:** If evidence is not produced in Step 2, set that party's $d = 0$. Note this in the memo to the Director. This penalizes obfuscation.

  **2. The Aspiration Inflation (Gaming the Max)**
  *   **The Risk:** A party claims their ideal point ($a$) is "Everything," hoping to drag the line toward them.
  *   **The Break:** KS defines $a$ as the *feasible* maximum, not the *desired* maximum.
  *   **Procedure:** In Step 3, you (the Ombud) define $a$ based on inventory, not testimony. If the microscope exists for 10 hours, $a = 10$. If a party argues $a = 12$, disregard. This is **Judgment wearing Arithmetic's clothes**; you are enforcing physical reality.

  **3. The Three-Party Problem (Authorship)**
  *   **The Risk:** KS is mathematically defined for two dimensions. Three-party extensions exist but lose the monotonicity property or require complex utility mapping.
  *   **The Break:** The procedure cannot generate a unique, fair number for three parties in one hour.
  *   **Procedure:** **REFUSE TO ANSWER.** Do not attempt to calculate. Recommend a rotation, lottery, or contribution-based rubric instead. (See Case B).

  **4. The Lumpiness Problem (Non-Convexity)**
  *   **The Risk:** The KS line lands on 4.5 hours, but the machine requires 4-hour blocks.
  *   **The Break:** The exact KS solution is infeasible.
  *   **Procedure:** Round to the nearest feasible point on the Pareto frontier. If the rounding benefits one party significantly more than the other (due to the discrete jump), or if it lands on a midpoint, the arithmetic neutrality is broken. Escalate to Director for the tie-break.

  ---

  ### PART III: CASE RUNS

  #### Case A: The Microscope (Two Labs)
  **Scenario:** Lab A and Lab B need time on a shared confocal microscope.
  **Resource ($T$):** 10 Hours/week.
  **Constraints:** Minimum block size = 1 Hour.

  **Step 1: Unit**
  Hours of machine time.

  **Step 2: Disagreement Point ($d$) [Judgment]**
  *   **Lab A:** Has no alternative facility. If no deal, experiment halts. Value = 0.
      *   $d_A = 0$
  *   **Lab B:** Can use a core facility elsewhere, but it costs money and travel. They estimate this alternative is worth 2 hours of local time (in saved cost/convenience). They provide a rate sheet.
      *   $d_B = 2$
  *   *Check:* $0 + 2 < 10$. Proceed.

  **Step 3: Aspiration Point ($a$) [Judgment]**
  *   Both labs claim they need all 10 hours.
  *   Ombud sets physical max for both.
      *   $a_A = 10$
      *   $a_B = 10$

  **Step 4: Calculation [Arithmetic]**
  *   **Range A ($R_A$):** $10 - 0 = 10$
  *   **Range B ($R_B$):** $10 - 2 = 8$
  *   **Formula:**
      $$ x_A = \frac{10 \cdot (10 - 2) + 8 \cdot 0}{10 + 8} $$
      $$ x_A = \frac{80}{18} = 4.44 \text{ Hours} $$
      $$ x_B = 10 - 4.44 = 5.56 \text{ Hours} $$
  *   *Interpretation:* Lab B gets more time because their fallback position is stronger (Monotonicity). Lab A gets less than half, but more than their BATNA of 0.

  **Step 5: Lumpiness [Judgment]**
  *   Blocks must be integers.
  *   $x_A = 4.44$ rounds to **4 Hours**.
  *   $x_B = 5.56$ rounds to **6 Hours**.
  *   Sum = 10.
  *   *Efficiency Check:* The rounding moved the split from (4.44, 5.56) to (4, 6). Lab B gained 0.44, Lab A lost 0.44. This is a discrete tie-break.

  **Step 6: Authorization**
  *   Because Step 5 required rounding that shifted value between parties, this requires **Director Sign-off**.
  *   **Ombud Recommendation:** 4 Hours Lab A / 6 Hours Lab B.
  *   **Memo Note:** "Lab B's verified outside option shifted the KS line. Rounding favors Lab B; Director must approve to ensure Lab A accepts the discrete loss."

  ***

  #### Case B: The Authorship (Three Co-Authors)
  **Scenario:** Three researchers (X, Y, Z) disagree on name order for a manuscript.
  **Resource:** Author Position (1st, 2nd, 3rd).

  **Step 1: Unit [Judgment]**
  *   Attempt to define unit. Is it "Credit"?
  *   Credit is ordinal and non-fungible. 1st place is not worth 1.5x 2nd place mathematically; it is a binary signal for hiring committees.
  *   Cannot convert to a common denominator (like hours or dollars) without making arbitrary assumptions about future career value.

  **Step 2: Disagreement Point ($d$)**
  *   If no agreement, paper is not submitted.
  *   $d_X = d_Y = d_Z = 0$ (No paper).

  **Step 3: Aspiration Point ($a$)**
  *   Each wants 1st Author.
  *   $a_X = a_Y = a_Z = \text{1st Position}$.

  **Step 4: Calculation [FAILURE]**
  *   The Kalai–Smorodinsky solution requires a 2-dimensional feasible set to draw a line between $d$ and $a$.
  *   With three parties, the "Ideal Point" is (1st, 1st, 1st), which is physically impossible.
  *   In 3D space, the intersection of the $d$-to-$a$ line and the Pareto frontier is not unique without assigning specific utility weights to each position (e.g., "1st is worth 10 points, 2nd is worth 5").
  *   Assigning these weights is **Judgment**, not Arithmetic. It violates the "scale invariance" requirement because the weights are subjective.

  **Step 5: Decision**
  *   **PROCEDURE REFUSES TO ANSWER.**
  *   **Reason:** Failure Mode 3 (Multi-Party/Ordinal Good). The KS rule cannot generate a number here without arbitrary utility assignments that the Ombudsperson is not empowered to make.
  *   **Recommendation to Director:** Do not use this protocol. Suggest:
      1.  **Rotation:** X is 1st on this paper, Y on the next.
      2.  **Contribution Rubric:** Use CRediT taxonomy to assign order based on tangible input percentages.
      3.  **Randomization:** Lottery for 1st place if contributions are truly equal.

  **Step 6: Authorization**
  *   Ombudsperson closes file as "Unsuitable for Quantitative Mediation."
  *   Director must assign a different conflict resolution mechanism.
