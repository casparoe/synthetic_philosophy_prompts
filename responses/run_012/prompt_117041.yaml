      *   Ideal Point: (10, 10) -> Impossible sum, but KS uses the *individual* maximums. Max Lab 1 can get is 10. Max Lab 2 can get is 10.
      *   Equation: $\frac{x_1 - 0}{10 - 0} = \frac{x_2 - 2}{10 - 2}$.
