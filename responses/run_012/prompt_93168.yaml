answer: |-
  Here are ten interview questions tailored to your audience and the guest's specific thesis, including the required follow-ups. Following the questions, I've provided the "Settled vs. Contested" guide you requested to help you navigate the technical landscape.

  ### The Interview Questions

  **1. The Normative Load of the EU Axioms**
  "You argue that the theorem shows social welfare is a weighted sum if the social ranking satisfies expected-utility axioms. But critics like Peter Diamond have argued that imposing vNM axioms on *social* choices isn't neutral—it bakes in a specific conception of fairness that ignores how risks are distributed among individuals. Why do you think the social ordering *should* satisfy independence or continuity, and isn't that already a substantive moral commitment rather than a rationality constraint?"
  *   **Likely Answer:** She will likely say that rationality under uncertainty is universal; if the social planner is rational, they must maximize expected utility, just like an individual.
  *   **Follow-up:** "If rationality requires the social planner to be risk-neutral over individuals' outcomes, does that mean we are morally required to ignore whether a burden falls on one person repeatedly versus being spread out? Is 'fairness' just a cognitive error in your framework?"

  **2. The Source of the Weights**
  "On your reading, the weights in the social welfare function aren't moral values assigned to people, but the observer's credences about being them. But Harsanyi usually invokes the 'principle of insufficient reason' to argue those credences must be equal. If we drop that assumption—if I think it's 90% likely I'd be born as *me* and only 10% likely I'd be *you*—does the theorem still generate utilitarianism, or does it just validate my existing biases?"
  *   **Likely Answer:** She will likely argue that the 'veil of ignorance' requires equi-probability as a condition of impartiality; without it, you aren't doing moral reasoning, just self-interested reasoning.
  *   **Follow-up:** "But if equi-probability is a *moral* requirement to ensure impartiality, haven't you just smuggled the moral weight back in? It sounds like the epistemic claim is doing no work; the moral work is being done by the command to be impartial."

  **3. Antisocial Preferences**
  "Let's talk about the sadist. If the social welfare function is a sum of vNM utilities, and a sadist gets utility from another's pain, the theorem seems to say we should inflict pain to satisfy the sum. Harsanyi tried to fix this by distinguishing 'personal' from 'moral' preferences. Does that distinction actually solve the problem, or does it just give us a label to exclude preferences we dislike without a clear criterion?"
  *   **Likely Answer:** She will likely say that moral preferences are those held from the impartial observer standpoint, while personal preferences are self-interested; the theorem only aggregates the latter *as seen by* the former.
  *   **Follow-up:** "But to identify which preferences are 'moral,' don't I already need to know which ones count toward the social good? Isn't there a circularity risk here where we define moral preferences as the ones that fit the utilitarian sum?"

  **4. Interpersonal Comparability**
  "Standard utilitarianism needs interpersonal comparability of utility. Your reading relies on the observer's 'extended preferences'—preferences about what it's like to be someone else. Does this actually solve the comparability problem, or does it just shift the burden? How does the observer know if their想象 (imagination) of being you matches your actual experience?"
  *   **Likely Answer:** She will likely argue that we don't need objective comparability, only that the observer can form a coherent preference ordering over 'being person A in situation X' vs 'being person B in situation Y'.
  *   **Follow-up:** "If the coherence of that ordering depends entirely on the observer's psychological capacity for empathy, doesn't that make social welfare dependent on how imaginative the planner is, rather than the actual welfare of the citizens?"

  **5. Policy Relevance of Observer-Relativity**
  "If social welfare is relative to the observer's credences, what does this tell an actual government? If Minister A has different credences about identity than Minister B, do they get different 'correct' policies? Or does the theory collapse into 'do what the ideal observer would do,' which seems to kick the can down the road?"
  *   **Likely Answer:** She will likely say we should aim for the 'ideal' observer—one with full information and perfect rationality—which converges on a single objective function.
  *   **Follow-up:** "But if real policymakers aren't ideal, and the theory gives them no algorithm to correct their credences other than 'be more ideal,' is the theorem action-guiding at all? Or is it just a description of what moral truth looks like from nowhere?"

  **6. The Triviality Charge**
  "I want to press the skepticism I mentioned earlier. If the theorem says 'If you maximize expected utility behind a veil of ignorance, you get a weighted sum,' isn't that almost tautological? It seems to say 'If you treat people as outcomes in a gamble, you'll maximize the expected value of the gamble.' What substantive work is the theorem doing beyond defining terms?"
  *   **Likely Answer:** She will likely argue it's not trivial because it rules out non-utilitarian theories (like Rawlsian maximin) as *irrational* under uncertainty, not just morally different.
  *   **Follow-up:** "But Rawlsians argue that the veil of ignorance involves such radical uncertainty that expected utility theory doesn't apply. Is your defense of Harsanyi ultimately just a defense of applying Bayesianism to ethics, rather than a proof of utilitarianism specifically?"

  **7. The Reductio of Arbitrary Credences**
  "You say the weights are epistemic. But suppose I have a metaphysical belief that some souls are 'more real' than others, leading me to assign higher credence to being them. On your reading, does the theorem validate a caste system, provided I hold those credences sincerely behind the veil?"
  *   **Likely Answer:** She will likely say that full information would correct false metaphysical beliefs; an ideal observer would know all persons are equally real.
  *   **Follow-up:** "So the normative force comes from the 'full information' constraint, not the aggregation theorem itself? It sounds like the theorem is just the engine, but the moral fuel is coming from the idealization conditions."

  **8. Aggregation vs. Impartial Observer**
  "Technical question for the specialists: You're citing the Aggregation Theorem, but your explanation sounds like the Impartial Observer Theorem. The Aggregation Theorem takes individual utilities as given; the Impartial Observer derives them. Do you see these as one unified argument, or does conflating them hide a gap where individual utilities get transformed into moral weights?"
  *   **Likely Answer:** She will likely say they are two sides of the same coin; Aggregation shows the form of the function, Impartial Observer justifies the inputs.
  *   **Follow-up:** "But Weymark and others have shown the Aggregation Theorem doesn't require utilitarianism without the Pareto principle. If the Pareto principle is the heavy lifter, why focus on the aggregation math?"

  **9. Social Risk vs. Individual Risk**
  "If individuals are risk-averse, but the social planner maximizes expected utility (risk-neutral), we get a mismatch. A policy might look good to the planner but expose specific individuals to ruin. Does your reading allow the social planner to respect individual risk attitudes, or must the society be risk-neutral even if the citizens aren't?"
  *   **Likely Answer:** She will likely say the social planner represents the 'average' interest, and risk is handled by the probabilities in the veil of ignorance, not the utility function.
  *   **Follow-up:** "But if I know I'm the one who will end up ruined, why should I accept a decision made by a risk-neutral planner? Does this view sacrifice the separateness of persons for the sake of the mathematical sum?"

  **10. The "Why Care?" Question**
  "Finally, if the weights are just my credences about being you, why should *you* care about *my* calculation? If I decide I'm unlikely to be you, your welfare drops in my social function. What binds us to accept a social welfare function that is fundamentally anchored in one observer's subjective probabilities?"
  *   **Likely Answer:** She will likely argue that morality *is* the attempt to find a shared standpoint; if we all reason correctly, our credences converge.
  *   **Follow-up:** "So the objectivity of utilitarianism rests on the convergence of rational agents? If that convergence fails, do we just have an impasse of different observers?"

  ***

  ### Meta-Commentary: Settled vs. Contested Claims

  Use this guide to gauge the temperature of the room. Your audience (grad students) will likely know some of these debates, so accuracy here builds your credibility.

  **1. "Harsanyi's Theorem Proves Utilitarianism"**
  *   **Status:** **Highly Contested.**
  *   **Context:** It is widely accepted in the literature (e.g., Weymark 1991, Sen 1986) that the Aggregation Theorem *mathematically* yields a weighted sum, but the *moral* interpretation (that the weights must be equal, or that the sum is the *good*) requires extra-normative premises (like Impartiality or Pareto).
  *   **Tip:** Your guest is taking a specific "Subjectivist" or "Bayesian" line. Don't let her present the move from "weighted sum" to "classical utilitarianism" as mathematically inevitable.

  **2. "EU Axioms on Social Choice are Morally Neutral"**
  *   **Status:** **Contested.**
  *   **Context:** Peter Diamond's 1967 critique is the standard reference here. He argued that vNM axioms (specifically Independence) rule out concern for *ex-ante* fairness (equality of opportunity) in favor of *ex-post* efficiency.
  *   **Tip:** This is your strongest technical pushback. Many decision theorists agree with Diamond that imposing EU on social states is a substantive ethical choice, not just a rationality requirement.

  **3. "Weights = Credences (Epistemic) vs. Weights = Moral Values"**
  *   **Status:** **Contested.**
  *   **Context:** This is the core of your guest's thesis. The "Standard" Harsanyi reading often treats the equal weights as a moral requirement of impartiality. Your guest is arguing they are epistemic (probabilities of identity).
  *   **Tip:** This is a legitimate interpretive debate. However, be careful not to assert that the "Moral Weight" reading is the *only* standard one. The "Epistemic" reading has strong defenders (e.g., Fehige, some Bayesian utilitarians).

  **4. "Extended Preferences Solve Interpersonal Comparability"**
  *   **Status:** **Contested.**
  *   **Context:** Harsanyi proposed "extended preferences" (preferring to be X in situation A vs. Y in situation B) to solve comparability. Sen and others argue this just pushes the problem back: How do we compare the observer's preference to be X vs. be Y without already having a common metric?
  *   **Tip:** This is safe ground for skepticism. Most welfare economists agree interpersonal comparability remains a major philosophical hurdle that extended preferences soften but do not remove.

  **5. "Sadistic Preferences can be Filtered Out"**
  *   **Status:** **Contested.**
  *   **Context:** The distinction between "moral" and "personal" preferences is notoriously difficult to define non-circularly. If "moral" means "preferences that count toward the social good," then excluding sadism is circular.
  *   **Tip:** This is a classic objection (often associated with R.M. Hare or preference utilitarianism critiques). It is safe to treat this as an open problem.

  **6. "The Aggregation Theorem vs. The Impartial Observer Theorem"**
  *   **Status:** **Settled (Technical Distinction).**
  *   **Context:** These are two different formal results in Harsanyi's work (1953 vs. 1955). The Aggregation Theorem assumes individual utilities are already defined and comparable. The Impartial Observer Theorem attempts to derive social utility from identity uncertainty.
  *   **Tip:** Your guest seems to be blending them. It is **settled** that they are distinct theorems. If she conflates them, you can gently ask for clarification without challenging her philosophy.

  **7. "Policy Relevance of Ideal Observer Theories"**
  *   **Status:** **Contested.**
  *   **Context:** Ideal Observer theories are often criticized for lacking action-guidance (the "Who observes?" problem).
  *   **Tip:** This is a standard meta-ethical objection. It is safe to press this point.

  ### Hosting Advice
  Since your audience is grad students, they will appreciate precision on the **Aggregation vs. Impartial Observer** distinction (Question 8). If you can nail that technical point, you'll signal that you know the literature, which gives you more license to push the philosophical *reductios* in the other questions.

  Your guest's position is sophisticated but vulnerable on the **"Is Rationality Moral?"** front (Question 1). If she insists that vNM axioms are purely rational, lean into Diamond's critique. That is the place where the decision theory literature most strongly pushes back against the ethical appropriation of the math.
