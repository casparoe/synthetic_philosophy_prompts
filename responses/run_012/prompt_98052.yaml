answer: |-
  ## Part 1: The Logical Space (Dimensions)

  Before using the tree, understand the six variables that construct the space. Every position on backsliding is a specific combination of answers to these dimensions.

  | Dimension | Variable | Option A | Option B |
  | :--- | :--- | :--- | :--- |
  | **V1: Ontology** | Is the term technical or political? | **Technical:** Describes an observable phenomenon. | **Contested:** A partisan label with no fact of the matter. |
  | **V2: Distinctness** | Is it distinct from "Autocracy"? | **Distinct:** A specific process of decline. | **Redundant:** Just "autocratization" with nicer manners. |
  | **V3: Baseline** | Is a prior democratic peak required? | **Relative:** Must slide *from* democracy. | **Absolute:** Can slide from any level of openness. |
  | **V4: Mechanism** | Do legal means count as erosion? | **Yes:** Law can be a weapon (Abusive Constitutionalism). | **No:** If it's legal, it's just constitutional change. |
  | **V5: Scope** | What counts as "democratic"? | **Liberal/Deliberative:** Rights, courts, discourse matter. | **Electoral:** Only voting/procedure matters. |
  | **V6: Authority** | Who assigns the label? | **External:** Observers/Indices define it. | **Internal:** Only domestic actors can claim it. |

  ***

  ## Part 2: The Decision Tree (Handout)

  *Instructions: Start at Node 1. Answer the question based on how you would classify a specific case (e.g., Hungary, US). Follow the arrow to the next node or final Leaf (Position).*

  **Node 1 (Ontology):** Is "democratic backsliding" a coherent technical category, or is it essentially contested political rhetoric?
  *   **Rhetoric/Partisan** $\rightarrow$ **LEAF A: The Essentially Contested View** (The term is a weapon, not a tool).
  *   **Technical Category** $\rightarrow$ Go to Node 2.

  **Node 2 (Distinctness):** Is this phenomenon analytically distinct from standard "regime collapse" or "full autocracy"?
  *   **No (It's just Autocracy)** $\rightarrow$ **LEAF B: The "Authoritarianism Relabeled" View** (Stop calling it backsliding; call it what it is).
  *   **Yes (It's a specific process)** $\rightarrow$ Go to Node 3.

  **Node 3 (Baseline):** Does the label apply only if the country was previously a consolidated democracy?
  *   **No (Any decline counts)** $\rightarrow$ Go to Node 4 (Path: *Absolute Decline*).
  *   **Yes (Must slide from a high-water mark)** $\rightarrow$ Go to Node 4 (Path: *Relative Decline*).
      *(Note: This branch does not terminate a position yet, but filters which cases are eligible.)*

  **Node 4 (Mechanism):** Can a government erode democracy while adhering to the letter of the law?
  *   **No (Legality immunizes)** $\rightarrow$ **LEAF C: The Constitutional Change View** (If it's legal, it isn't erosion).
  *   **Yes (Law can be abusive)** $\rightarrow$ Go to Node 5.

  **Node 5 (Scope - Elections):** Is the loss of free/fair elections *necessary* to claim backsliding is occurring?
  *   **Yes (Elections are the floor)** $\rightarrow$ Go to Node 6 (Path: *Electoral Focus*).
  *   **No (Other things count first)** $\rightarrow$ Go to Node 7 (Path: *Institutional Focus*).

  **Node 6 (Scope - Sufficiency):** If elections are held, but rights/courts are eroded legally, is that backsliding?
  *   **No** $\rightarrow$ **LEAF D: The Electoral-Minimalist View** (No election loss = no backsliding).
  *   **Yes** $\rightarrow$ **LEAF E: The Liberal Democracy View** (Constraints matter as much as votes).

  **Node 7 (Scope - Discourse):** Is the degradation of public discourse/civil society *sufficient* for the label, even if courts hold?
  *   **No** $\rightarrow$ Return to Node 6 (Path: *Liberal View*).
  *   **Yes** $\rightarrow$ **LEAF F: The Deliberative/Participatory View** (Quality of democracy > institutions).

  **Node 8 (Intent):** Does the actor's *intent* to undermine democracy matter, or do outcomes suffice?
  *   **Intent Required** $\rightarrow$ **LEAF G: The Agency-Centric View** (Mistakes aren't backsliding).
  *   **Outcomes Suffice** $\rightarrow$ Go to Node 9.

  **Node 9 (Dynamics):** Is backsliding a continuous gradient or a shift into a specific hybrid regime type?
  *   **Continuous Gradient** $\rightarrow$ **LEAF H: The Process View** (Backsliding is a verb, not a noun).
  *   **Regime Threshold** $\rightarrow$ **LEAF I: The Competitive-Authoritarianism View** (You are either in the hybrid box or you aren't).

  **Node 10 (Authority):** Who has the standing to apply the label to this case?
  *   **External Observers** $\rightarrow$ **LEAF J: The International Standards View** (Indices/Experts decide).
  *   **Domestic Actors Only** $\rightarrow$ **LEAF K: The Sovereigntist/Populist View** (Only the *demos* can say they lost power).

  ***

  ## Part 3: Mapping Positions to Logical Cells

  Here is where the requested theoretical positions land within the logic space defined above.

  | Position | V1 (Ontology) | V2 (Distinct) | V4 (Legal) | V5 (Scope) | V9 (Dynamics) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Essentially Contested** | Rhetoric | N/A | N/A | N/A | N/A |
  | **Authoritarianism Relabeled** | Technical | No | N/A | N/A | N/A |
  | **Constitutional Change** | Technical | Yes | No (Legal=Safe) | Varies | Varies |
  | **Electoral-Minimalist** | Technical | Yes | Varies | Elections Only | Varies |
  | **Liberal Democracy** | Technical | Yes | Yes | Rights+Courts | Process |
  | **Deliberative** | Technical | Yes | Yes | Discourse | Process |
  | **Competitive-Authoritarian** | Technical | Yes | Yes | Hybrid | Threshold |
  | **Sovereigntist** | Technical | Yes | Varies | Varies | Internal Auth |

  ### Indistinguishable Leaves
  **Warning:** The tree cannot fully separate **The Liberal View (Leaf E)** and **The Deliberative View (Leaf F)** without Node 7. If a student answers "Yes" to rights erosion (Node 6) and "Yes" to discourse erosion (Node 7), they occupy both leaves. In practice, these two positions are often coalitional; the tree forces them to specify *which* non-electoral institution is the canary in the coal mine.

  ### Empty / Incoherent Cells
  The following combinations are logically possible in the matrix but produce **empty leaves** in the tree because they are theoretically incoherent or unattractive:

  1.  **The "Illegal Backsliding" Cell:** (V4=No + V2=Yes).
      *   *Why Empty:* If a government breaks the law to seize power (coups, suspending constitutions), almost all theorists classify this as "Regime Collapse" or "Autocratization," not "Backsliding." Backsliding implies a decay *within* the system, not a break *of* the system.
  2.  **The "Minimalist Abusive Constitutionalism" Cell:** (V5=Elections Only + V4=Legal Erosion).
      *   *Why Empty:* If you are an Electoral Minimalist, you only care about votes. If the erosion is legal and elections are still held, you have no metric to call it backsliding. You cannot be a Minimalist *and* believe in Abusive Constitutionalism simultaneously.
  3.  **The "External Sovereigntist" Cell:** (V10=Internal + V10=External).
      *   *Why Empty:* Contradictory. You cannot argue that *only* domestic actors can define the regime while simultaneously deferring to international indices.

  ***

  ## Part 4: Case Differentiation (Why the US Disagreement Happens)

  This tree makes visible why reasonable people disagree on the US vs. Hungary.

  *   **Hungary:**
      *   **Node 4 (Legal):** Most answer **Yes** (Fidesz used supermajorities).
      *   **Node 5 (Elections):** Most answer **No** (Elections exist but are skewed).
      *   **Node 6 (Rights):** Most answer **Yes**.
      *   **Result:** Lands firmly in **Leaf E (Liberal)** or **Leaf I (Competitive-Authoritarian)**. Disagreement is minimal here because the legal mechanism is clear.

  *   **United States:**
      *   **Node 4 (Legal):** **Split.** (Is gerrymandering/voter ID "abusive law" or "constitutional change"?).
      *   **Node 5 (Elections):** **Split.** (Did 2020/2024 count as free/fair? Minimalists say Yes; Liberals say "Wait, look at norms").
      *   **Node 8 (Intent):** **Split.** (Is polarization accidental or engineered?).
      *   **Result:**
          *   A **Minimalist** (Node 5=Yes) lands at **Leaf D** (No backsliding, elections happened).
          *   A **Liberal** (Node 5=No, Node 6=Yes) lands at **Leaf E** (Backsliding via norms/courts).
          *   A **Sovereigntist** (Node 10=Internal) lands at **Leaf K** (If Americans vote for it, it's not backsliding).

  *   **Turkey:**
      *   **Node 2 (Distinct):** Many move to **Leaf B** (Authoritarianism Relabeled). After the 2017 constitutional changes, the "slide" is arguably complete; it is now a different regime type, making "backsliding" the wrong tense.

  *   **Poland:**
      *   **Node 10 (Authority):** This is the key differentiator. The EU (External) labeled it backsliding; the PiS government (Internal) labeled it sovereignty. The tree forces you to choose **Leaf J** or **Leaf K** before you can conclude the case.
