answer: |-
  This is a sharp question that cuts to the tension between Quine's rigorous ontological naturalism and the phenomenology of moral experience. You are right to be skeptical of the slogan version. Quine never wrote a systematic ethics; his metaethical views are inferences drawn from his epistemology and ontology. Consequently, there is significant friction in the secondary literature regarding how his system *actually* accommodates (or eliminates) normativity.

  Here is the breakdown of the conceptual mechanics, separating the settled textual commitments from the genuine interpretive controversies.

  ---

  ### 1. The Engineering Analogy and the Problem of Ends

  **The Mechanism:**
  Quine's comparison of morality to engineering appears most clearly in *On the Nature of Moral Values* (1966). The structural parallel is this:
  *   **Science** describes the world (the "is").
  *   **Engineering** uses scientific descriptions to achieve a specific physical end (the "ought" of function).
  *   **Morality** uses psycho-social descriptions to achieve a specific social end (social cohesion, survival, flourishing).

  **The User's Objection (The Ends Problem):**
  In engineering, the end is external to the system (e.g., "the bridge must not collapse"). In morality, the end (e.g., "happiness," "justice," "life") is internal to the moral system itself. If morality is just engineering for social ends, who sets the ends? If the ends are just "assumed," morality collapses into hypothetical imperatives (*If* you want social stability, *then* do X). But moral claims present themselves as categorical.

  **Quine's Move:**
  Quine does not try to justify the ends normatively. He naturalizes them. For Quine, the "ends" of morality are not transcendental values; they are **biological and sociological facts**.
  1.  **The Fact:** Humans are social animals with specific psychological dispositions (sympathy, aggression, need for cooperation).
  2.  **The Function:** Moral norms are the "technology" evolved (culturally and biologically) to manage these dispositions to ensure group survival.
  3.  **The Justification:** There is no justification outside of this causal story. To ask "Why should I value survival?" is, for Quine, a category mistake akin to asking "Why is logic valid?" from outside logic. You are already inside the web of belief.

  **The Ambiguity:**
  Quine oscillates between two positions here, and scholars disagree on which represents his final view:
  *   **The Reductionist Reading:** Moral ends *are* just prudential ends (survival/pleasure). Normativity is fully instrumental.
  *   **The Functionalist Reading:** Moral ends are distinctively social, but they are still facts about human nature. The "ought" is the "ought" of a functional organ (e.g., "the heart *ought* to pump").

  **Verdict:** Quine accepts that moral ends are given by our psychology and social training. He does not think there is a "view from nowhere" to adjudicate between competing ultimate ends. If a Nazi and a Liberal disagree on the *end* (racial purity vs. equality), Quine has no trans-cultural normative resource to declare one wrong, only the resources to point out inconsistencies in their respective webs of belief or failures in their predictive sociology.

  ---

  ### 2. Truth, Ontology, and the Status of Moral Claims

  This is where Quine's deflationary theory of truth interacts with his ontological naturalism.

  **The Mechanism:**
  *   **Ontology:** Quine's criterion for what exists is "to be is to be the value of a bound variable" in our best scientific theory. Moral properties (Goodness, Rightness) do not appear in physics or psychology. Therefore, **there are no moral properties.**
  *   **Truth:** Quine holds a deflationary view of truth (to say "P is true" is just to say "P").

  **The Tension:**
  If there are no moral properties, how can "Murder is wrong" be true?
  *   **Option A (Error Theory):** The sentence is truth-apt but false, because it presupposes properties that don't exist.
  *   **Option B (Non-Cognitivism):** The sentence isn't truth-apt; it's an expression of attitude.
  *   **Option C (Deflationary Realism):** The sentence is true, but "truth" doesn't imply robust ontological commitment in this context.

  **Quine's Position:**
  Quine leans toward a modified **Non-Cognitivism/Expressivism**, but grounded in behaviorism rather than emotivism. Moral sentences are "verbal dispositions." They are conditioned responses.
  *   When I say "Stealing is wrong," I am not describing a moral fact. I am expressing a conditioned aversion to stealing and attempting to condition the same aversion in you.
  *   However, because Quine rejects the analytic/synthetic distinction, he doesn't draw a hard line between "factual" and "emotive" language. Moral language is part of the "web of belief," just very far from the sensory periphery.

  **Settled vs. Contested:**
  *   **Settled:** Quine denies *sui generis* moral properties. He denies that ethics is a branch of knowledge in the same way physics is.
  *   **Contested:** Does Quine think moral sentences are *false* (Error Theory) or *not in the business of being true* (Non-Cognitivism)?
      *   *Roger Gibson* argues Quine allows moral sentences to be true in a deflationary sense within a community, without ontological commitment.
      *   *Hans-Johann Glock* argues Quine is closer to an Error Theorist: moral language *tries* to refer, fails, and should be understood as pragmatic tooling.
      *   *The Ambiguity:* Quine sometimes speaks of moral values as "legitimate" parts of culture, which suggests a pragmatist realism, but his ontology suggests eliminativism. He never fully resolved whether moral language is a "failed science" or a "different game."

  ---

  ### 3. Holism, Indeterminacy, and Moral Disagreement

  This addresses your question about whether two people arguing about abortion are just "making different noises."

  **The Mechanism of Holism:**
  In Quine's web of belief, logical laws are central, observation sentences are peripheral, and moral/theological sentences are in between but closer to the periphery.
  *   **Revision:** Moral beliefs *can* be revised by experience, but indirectly. If a moral belief leads to social chaos (an empirical outcome), we might revise the moral belief.
  *   **Disagreement:** Disagreement is real *within* a conceptual scheme. If we share the same basic verbal dispositions (conditioning), we can disagree on the application.

  **The Mechanism of Indeterminacy of Translation:**
  This is the nuclear option for moral disagreement. Quine argues there is no "fact of the matter" regarding the translation of one language to another (Gavagai). This applies to moral terms.
  *   If Culture A says "X is Good" and Culture B says "X is Bad," is there a fact of the matter about who is right?
  *   **Quine's Answer:** No. There is only the fact of their differing verbal dispositions. Translation is manual-dependent. You can translate their "Good" as "Good" (making them wrong) or you can translate their "Good" as "Duty-Bound" (making them right relative to a different concept). There is no objective fact to settle the translation.

  **The Consequence for Disagreement:**
  *   **Internal Disagreement:** Real. (Two Americans arguing about abortion share enough linguistic conditioning that there is a fact of the matter about what their words mean, so they are genuinely contradicting each other).
  *   **External Disagreement:** Illusory. (An American and a Taliban fighter arguing about women's rights). They are not contradicting each other; they are operating different "manuals."

  **Contested Interpretation:**
  *   **The Relativist Reading:** Quine is a radical relativist. Moral truth is relative to the background language/theory. (Supported by *Ontological Relativity*).
  *   **The Naturalist Reading:** Quine is not a relativist because human nature is universal. Since we all share the same biological conditioning (pain/pleasure, social bonding), our "manuals" will converge significantly. Disagreement is usually due to ignorance of empirical facts (sociology/psychology), not deep conceptual incommensurability.
  *   **The Problem:** Quine's biological universalism is empirically shaky. If moral terms are just "socially conditioned verbal dispositions," and conditioning varies wildly, the "Naturalist Reading" struggles to explain why we should expect convergence.

  ---

  ### 4. What is Left of Normativity? (The "Gap")

  You asked: *"Does he just accept that moral ends are given by our psychology... and that all the normativity left is instrumental?"*

  **The Hard Truth:**
  Yes, mostly. But with a Quinean twist.
  Quine naturalizes epistemology (turning "how we *should* reason" into "how we *do* reason to predict success"). He attempts to do the same for ethics.
  *   **Normativity becomes Prediction:** To say "You ought to do X" is shorthand for "Doing X is conducive to the social stability which your psychology is conditioned to value."
  *   **The Loss:** The "Categorical Imperative" feel of morality is explained away as an illusion produced by the depth of our conditioning. We *feel* it's objective because the conditioning happens in childhood and is reinforced by the entire social web.

  **Where Scholars Fight:**
  1.  **Is it *Only* Instrumental?**
      *   *Yes (The Humean Quine):* Prominent in *Pursuit of Truth*. Normativity is always relative to a goal. If the goal is arbitrary (psychologically given), the normativity is hypothetical.
      *   *No (The Kantian Quine):* Some (like *Michael Dummett*, critically) argue Quine cannot account for the normativity of logic itself without smuggling in something non-natural. If Quine saves logical normativity, can he save moral normativity by analogy? Quine would say logic is normative for *truth*, morality is normative for *social cohesion*. But this confirms the instrumental reading.

  2.  **The "Forgotten" Normativity:**
      *   Quine sometimes suggests that the process of scientific inquiry itself carries normative weight (simplicity, conservatism, conservatism). Some scholars (e.g., *Gary Ebbs*) argue Quine allows for "immanent normativity"—norms that arise from within the practice, not imposed from outside.
      *   **Application to Ethics:** If ethics is a practice like science, it has internal norms (consistency, coherence). Quine can judge a moral system as "bad" if it is internally inconsistent or empirically self-defeating (e.g., a moral code that leads to the extinction of its adherents).
      *   **The Limit:** He cannot judge a moral system as "evil" if it is consistent and successful at preserving its group (e.g., a successful Spartan war-culture). This is the bullet Quine bites.

  ---

  ### Summary of Settled vs. Contested

  | Feature | Settled in Secondary Literature | Genuinely Contested / Ambiguous |
  | :--- | :--- | :--- |
  | **Ontology** | Quine denies moral properties exist in the scientific sense. | Does this make moral statements *false* (Error Theory) or *non-descriptive* (Expressivism)? |
  | **Naturalism** | Moral values are continuous with natural facts (psychology/sociology). | Does this reduce morality to *prudence* (self-interest) or allow for irreducible *social* norms? |
  | **Truth** | Moral truth is deflationary (disquotational), not robust correspondence. | Can a deflationary truth claim still carry normative force, or does it drain the "ought"? |
  | **Disagreement** | Cross-cultural moral disagreement lacks a "fact of the matter" (Indeterminacy). | Does human biological uniformity constrain this indeterminacy enough to make moral progress possible? |
  | **Normativity** | Normativity is immanent to the web of belief, not transcendent. | Is Quine entitled to *any* normativity, or does his naturalism collapse into a description of causal forces? |

  ### The Bottom Line on the "Mechanics"

  Quine's system treats moral values as **posits of a folk theory** (folk psychology/sociology) that are useful for social coordination.
  1.  **Learning:** We learn moral terms via conditioning (ostensive learning + social reinforcement), not by grasping abstract objects.
  2.  **Function:** They serve to coordinate behavior and reduce social friction.
  3.  **Disagreement:** Is a clash of conditioned dispositions. It is resolvable only by appealing to shared dispositions or empirical consequences (e.g., "This policy causes starvation").
  4.  **The "Ought":** Is the "ought" of a machine functioning correctly relative to its design. Our "design" is evolutionary/social.

  **The Cost:** The price of this mechanics is the loss of **moral authority**. For Quine, there is no sense in which a moral claim is binding on a rational agent *qua* rational agent. It is only binding on a social animal *qua* member of a tribe. If you ask Quine, "Why shouldn't I be immoral if I can get away with it?", his answer is essentially: "You are asking a question outside the web of belief. Inside the web, you know you are disposed to feel guilt and fear social ostracization. Outside the web, I have nothing to say to you."

  This is why many critics (like Putnam or Dworkin) argue Quine's naturalism is too thin to capture the phenomenology of moral life, while defenders (like naturalist realists) argue he correctly demystifies it. Quine himself would likely view the complaint as a failure to accept the implications of Darwinism.
