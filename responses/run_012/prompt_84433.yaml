answer: |-
  The broker slid the ticket across the desk. "Entry fee: $500. Expected return: mathematically unbounded."

  I looked at the fine print. "Ninety-nine percent of outcomes pay less than twenty dollars."

  "You're ignoring the tail."

  "The tail where we flip tails until the heat death of the universe?"

  "The integral doesn't truncate for entropy."

  "Fine. If I threaten to subtract infinite utility from your future with probability one-over-two-to-the-hundred, will you pay me $500 to stop?"

  She didn't even look up from her actuarial ledger. "Threats are adversarial."

  "So the infinite sum only converges when it's profit?"

  "Only when it's liquidity," she said, stamping the final requisition. "The house never mugs itself. Besides, our reinsurance doesn't cover existential threats."

  ***

  The punchline relies on the asymmetry between how rational agents treat infinite expected utility gains versus infinite expected disutility threats, despite identical mathematical structures. It highlights that the St. Petersburg divergence is driven entirely by measure-zero events that never manifest in typical experience, yet are priced in only when favorable.
