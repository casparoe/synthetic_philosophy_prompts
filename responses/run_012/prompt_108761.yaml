  These seven questions map the philosophical landscape regarding visual language capabilities. 1. Can a static image express logical operators like negation, universality, or conditionals without relying on hidden textual conventions, specific cultural training, or arbitrary signs? 2. Does a picture assert a truth claim independently, or does it only become a proposition when paired with a verbal caption? 3. Is the meaning of a picture fixed by convention alone, or does it require prior verbal training to decode the symbols correctly? 4. Can pictorial information be revised precisely when new evidence contradicts the image, or is the medium too rigid for scientific correction or updates? 5. Is the density of pictorial information finite and discrete like words, or is it continuous and analog, preventing exact replication of meaning? 6. Must a universal picture language be learnable with no prior verbal language at all, or is it always secondary to speech? 7. Does the emotional or rhetorical impact of an image inevitably distort its factual content, making objectivity impossible in a scientific context?

  The tree
  Start at the root: Can pictures express logic? If No, move to "Do pictures assert truth alone?" If No, you land at **Caption-Dependent Minimalism** (pictures need text to say anything). If Yes, but logic is missing, you land at **Rhetorical Cynicism** (pictures persuade but don't prove). If Yes to logic: Can pictures be revised like data? If No, you land at **Propaganda Cynicism** (images freeze dogma). If Yes, ask: Is verbal training required to learn the code? If Yes, you land at **Neurath's Auxiliary View** (pictures help speech but rely on it). If No, ask: Is pictorial density discrete? If Yes, you land at **Universalist Utopianism** (pictures can fully replace words). If No (density is analog/continuous), you land at **Goodman-esque Symbolism** (pictures are genuine but denser/different than words). The path to Neurath acknowledges visual utility but denies independence, preserving ordinary language as the primary scaffold. The Utopian leaf represents the radical hope that visual clarity eliminates linguistic ambiguity, assuming icons map reality directly. Goodman-esque Symbolism accepts pictures as legitimate but argues their analog nature makes them fundamentally different from text. The Cynic leaves differ in motivation: Rhetorical Cynics fear emotional manipulation, while Propaganda Cynics fear factual rigidity. Caption-Dependent Minimalism treats images as illustrations rather than statements. This structure ensures every stance finds a terminus based on commitments to logic, truth, and learning.

  Empty branches
  The combination where pictures express logic perfectly yet cannot be revised is empty. This is incoherent because logical precision implies falsifiability, which requires revisability. Another empty branch is the view that pictures require no verbal training to learn yet convey no truth claims independently. This is unattractive because if they convey no claims, their learnability is irrelevant. A third unoccupied space is the belief that pictures are fully discrete like words but still cannot express negation. This is unexplored because discrete systems typically define negation by absence, making the limitation arbitrary. Additionally, no one argues that pictures are continuous yet fully replace words, as continuity prevents the exactitude required for replacement. This view is unstable because analog systems lack the binary precision needed for strict scientific definition.

  Can't be told apart
  The tree struggles to separate Neurath's Auxiliary View from Caption-Dependent Minimalism. Both admit reliance on text, but Neurath sees synergy while Minimalists see dependency. Universalist Utopianism and Goodman-esque Symbolism are close; both affirm pictorial power, differing on whether pictures should replace words or remain distinct. The tree groups them by density, but a Utopian might accept density differences while still demanding replacement. These overlaps suggest boundaries between auxiliary and dependent, or replacement and distinction, are often matters of degree rather than kind.
