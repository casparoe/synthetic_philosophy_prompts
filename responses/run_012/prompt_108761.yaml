  Hey, so for my theory of knowledge class I have to do a project on Otto Neurath — the Vienna Circle guy who ran a social/economic museum and, with a team of artists, made those picture-statistics charts where you show numbers as rows of little repeated icons (he called the system Isotype). The bit I find interesting is that he thought a picture language could be read by basically anyone no matter what language they spoke, but at the same time he kept insisting it was only a helper for ordinary language and not a replacement, because tons of things you can say in words — "not", "all", "if… then", "probably", "in the past", "this sentence is false" — are really hard or maybe impossible to say in pictures. For the project my teacher wants the whole debate mapped out, not just Neurath's own answer, like a flowchart/decision tree of every position people could hold on whether pictures could ever be a full scientific language.

  Can you write me that tree? Make every branch node a question about what pictures can actually do, phrased so a reader can answer it without knowing which view it leads to — e.g. can a picture express negation or "all", can a single picture be true or false on its own, do you need a caption or a trained reader to fix what it means, does a picture language have to be learnable with no verbal language at all, can a picture-chart be revised when the evidence changes. Leaves should be named positions, or "unnamed" if nobody really defends it — Neurath's auxiliary-helper view, the "pictures could replace words completely" utopians, the "pictures are just propaganda/rhetoric" cynics, the view that pictures are a genuine symbol system with their own grammar and are just denser than words (some aesthetics people argue this, I think Goodman?), and the view that a picture by itself says nothing and only a caption makes a claim. Add any other position you think is actually in the space.

  Format it like this please: "The questions" — the branch questions in order, one line each on what they split, about 200 words. "The tree" — the actual tree with the leaves named, about 300 words. "Empty branches" — combos of answers nobody occupies and whether that's because the view is incoherent, unattractive, or just unexplored, about 150 words. "Can't be told apart" — any positions my tree fails to separate, about 100 words. No citations or reading lists, my teacher says we can't use them anyway.
