  Draft a two-page prospectus distinguishing the Deliberation/Justification question from the Integrity question. Schedule three conversations with non-philosophers working in care or AI to test the "barrier thought" intuition. Write a 3,000-word vignette describing your mother's stroke decisions without using normative jargon. Use that vignette to identify where the impartial calculation actually entered the deliberation.
