      *(Self-Correction during drafting)*: I need to make sure I don't sound condescending about the "philosophy" part. The user said they barely passed logic. I need to translate "teleological" into "goal-dependent." I need to make sure I explicitly address the "monitoring" example (turning off alerts) as a classic "wireheading" or "observation tampering" issue.

      *(Refining the "Impossible" argument)*: Make sure to emphasize that "side effect" is not a physical property. It's a semantic one. Moving a pawn on a chessboard is a "state change." Is it a side effect? Only if it hurts your chance of winning. Without knowing "winning," you can't know "side effect."

      *(Refining the "What to Ship")*: Be specific. Don't say "test more." Say "implement a circuit breaker." "Use a allowlist of actions, not a penalty function."

  8.  **Final Polish:** Check against constraints (no citations, be blunt, think through carefully). Ensure the distinction between *specification gaming* and *alignment* is clear.

