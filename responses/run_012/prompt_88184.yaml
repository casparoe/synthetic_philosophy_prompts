prompt: |-
  I'm running the next session of a mixed reading group — psych and neuro PhD students who all use "believes" and "wants" in their own experiments — and the topic is eliminative materialism. Dont explain it to me, plan how I should explain it. What has to come first: the elimination-vs-reduction distinction, or the claim that folk psychology is a theory with posits that could turn out false? What breaks if I flip them, and where does the empirical bet (that folk psychology gets replaced rather than reduced) have to sit relative to both? Then the carrying example. I was going to reach for phlogiston, but I think caloric might be better, since the successor theory does the same work with fewer posits — and then I started worrying that all the stock cases (caloric, phlogiston, the aether) are third-person theoretical posits nobody ever used to describe themselves, which is exactly the disanalogy with belief-talk. So tell me whether the example is bearing weight it can't, and what to build it on instead. Next, the misconceptions in the order this audience will actually produce them — I'd guess "this is just behaviorism" comes early and "so you want us to stop saying people believe things" comes late — and exactly where in the sequence I head each one off. Also one question to ask at the end that seperates someone who got it from someone who just nodded; what I should say I'm deliberately skipping at this level (I'm thinking the illusionism stuff about consciousness, and anything about the semantics of belief sentences); and whether the "folk psychology is a theory" premise is even load-bearing — does the argument survive if mindreading is a skill rather than a theory? 75 minutes, whiteboard.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Mixed Psych/Neuro PhD students. They *use* "believes" and "wants" in their own experiments (operationalize mental states). They are sophisticated but likely pragmatic realists about folk psychology (FP).
      *   **Topic:** Eliminative Materialism (EM).
      *   **Constraint:** Do *not* explain EM to me. Plan *how I should explain it*.
      *   **Key Decisions Needed:**
          1.  Order of concepts: Elimination vs. Reduction OR FP as a Theory?
          2.  Consequences of flipping that order.
          3.  Placement of the "empirical bet" (replacement vs. reduction).
          4.  The Carrying Example: Phlogiston vs. Caloric vs. something else (addressing the 3rd-person vs. 1st-person disanalogy).
          5.  Misconceptions: Order of appearance and where to head them off (Behaviorism, "Stop saying believe").
          6.  Closing Question: Distinguishes understanding from nodding.
          7.  Deliberate Skips: What to exclude (Illusionism, Semantics).
          8.  Load-bearing check: Does "FP is a theory" matter if mindreading is a skill?
      *   **Logistics:** 75 minutes, whiteboard.

  2.  **Deconstruct the Core Argument (Churchland/Churchland style):**
      *   Premise 1: Folk Psychology (FP) is a theory (conceptual framework).
      *   Premise 2: Theoretical terms refer only if the theory is approximately true/isomorphic to reality.
      *   Premise 3: Neuroscience will show FP is radically false (not just incomplete).
      *   Conclusion: FP terms (belief, desire) do not refer and should be eliminated, not reduced.

  3.  **Address Decision 1: Order of Concepts (Elim/Red vs. FP as Theory):**
      *   *Option A: Start with Elim vs. Reduction.* Good for setting stakes. Shows this isn't just physicalism (which they likely accept).
      *   *Option B: Start with FP as Theory.* This is the engine. Without this, elimination makes no sense. If FP isn't a theory, it's just a practice, and you can't eliminate a practice easily, only a set of posits.
      *   *Verdict:* FP as Theory *must* come first. Why? Because "Elimination" only makes sense against the backdrop of "Reference Failure." Reference failure only makes sense if these terms are theoretical posits. If I start with "We are going to eliminate beliefs," they will immediately jump to "But I feel beliefs!" or "It's just behaviorism." I need to frame *what* a belief is supposed to be (a posit in a causal network) before I say it might not exist.
      *   *What breaks if flipped?* If I start with Elimination, they treat it as an ontological claim about *stuff* (like "atoms don't exist"). They miss the semantic/conceptual argument. They think it's a brute force denial of experience.
      *   *Empirical Bet Placement:* This comes *after* establishing FP is a theory but *before* the conclusion. It bridges the gap between "FP is a theory" and "FP is a *false* theory."

  4.  **Address Decision 2: The Carrying Example (Phlogiston/Caloric vs. 1st Person):**
      *   *User's Worry:* Stock cases are 3rd-person posits. Belief talk is 1st-person/2nd-person lived experience.
      *   *Analysis:* The user is right. This is the strongest objection from this specific audience (who use self-reports and introspection). If I use Caloric, they will say "But I *know* I want coffee."
      *   *Solution:* Don't drop the historical analogy, but *qualify* it immediately. Or, use a better analogy.
      *   *Better Analogy:* Demons/Disease or Vitalism. But actually, the best move is to lean into the *theoretical* nature of the posit.
      *   *Refinement:* Use Caloric/Phlogiston to illustrate *radical theory change*, but acknowledge the disanalogy. Then, pivot to a within-science example. Maybe "Intelligence" (g-factor) or "Memory traces" (engrams).
      *   *Wait, a stronger move:* Use the "Witch" example (often used by Churchland). It captures the normative/ascriptive nature better than Caloric. But for Psych/Neuro students, a *scientific* failure is better.
      *   *Decision:* Stick with Caloric/Phlogiston *but* explicitly flag the disanalogy as a feature, not a bug. Use it to show how *successful* predictive theories can still be ontologically wrong. Then, bridge to the 1st-person issue by asking: "Does the feeling of heat prove Caloric?" -> "Does the feeling of conviction prove Belief?"
      *   *Alternative:* The "Center of Gravity" analogy (Dennett). It's a real pattern but no *thing* corresponds to it. This handles the "useful but non-referring" angle well.
      *   *Best for Whiteboard:* Caloric is visual. Draw the flow. But acknowledge the 1st-person gap. Actually, the prompt asks "what to build it on instead." I should suggest **Visual Illusions** or **Phantom Limbs**. No, those prove qualia exist.
      *   *Re-evaluating:* The user suspects the example bears weight it can't. They are right. The historical analogies prove theory change is possible, not that *this specific* change will happen. I should advise them to use Caloric *only* to illustrate the logic of elimination, not the probability. Then switch the weight to the *neuroscience* argument (connectionism vs. sentence-like storage).
      *   *Recommendation:* Use Caloric for the *logic* of elimination. Use Connectionism/Vector Processing for the *mechanism* of replacement. This addresses the 1st-person worry (the brain doesn't manipulate sentences).

  5.  **Address Decision 3: Misconceptions & Timing:**
      *   *Audience:* Psych/Neuro PhDs.
      *   *Misconception 1: "This is Behaviorism."* (It denies internal states).
          *   *Head off:* Early. When defining FP as a theory. Emphasize EM accepts internal states, just not *those* ones.
      *   *Misconception 2: "So stop saying 'believe'?"* (Pragmatic objection).
          *   *Head off:* Late. Near conclusion. Distinguish ontology from heuristic utility.
      *   *Misconception 3: "But I feel it."* (Phenomenology).
          *   *Head off:* Middle. During the Caloric analogy (Heat feeling vs. Caloric theory).

  6.  **Address Decision 4: Load-bearing "FP is a Theory":**
      *   *Question:* Does the argument survive if mindreading is a skill (Theory-Theory vs. Simulation Theory)?
      *   *Analysis:* If it's a skill/practice, elimination is harder. You can't falsify a skill, only a description. However, EM proponents argue the *structure* of the skill implies theoretical commitments (propositional attitudes).
      *   *Verdict:* It is load-bearing. If FP is purely a non-representational skill, EM loses its "false theory" lever. I need to tell the user to acknowledge this vulnerability. The argument *weakens* significantly if Simulation Theory is true, but EM proponents usually argue Simulation relies on Theory-like structures anyway.
      *   *Instruction:* Flag this as a premise that needs defense, not a given.

  7.  **Address Decision 5: Closing Question & Skips:**
      *   *Skip:* Illusionism (Frankish/etc.) - too meta. Semantics of belief sentences (contextualism) - too linguistic.
      *   *Closing Question:* Needs to test if they get the "Replacement" vs. "Correction" distinction.
      *   *Idea:* "If a future neuro-psychologist predicts your behavior perfectly without using 'belief,' have they disproven you or just translated you?" (Tests Reduction vs. Elimination).
      *   *Better:* "What specific neural finding would force you to abandon 'belief' rather than just refine it?" (Forces them to identify the falsification conditions).

  8.  **Drafting the Plan (75 mins):**
      *   0-10: Hook & FP as Theory (The Engine).
      *   10-25: Elim vs. Reduction (The Stakes) + Caloric (The Logic).
      *   25-40: The Empirical Bet (Neuroscience/Connectionism).
      *   40-55: Misconceptions (Behaviorism, Phenomenology).
      *   55-65: Skill vs. Theory (The Vulnerability).
      *   65-75: Closing Question & Skips.

      *Wait, I need to integrate the Misconceptions *as they arise*, not as a block.*
      *   Behaviorism -> Head off during "FP as Theory."
      *   Phenomenology -> Head off during "Caloric."
      *   Pragmatics -> Head off during Conclusion.

      *Refining the Example:* The user is worried Caloric is 3rd person. I should advise them to use Caloric for the *structural* point (successful theory, wrong ontology) but immediately pivot to **Connectionism** as the *positive* case for why Belief specifically is vulnerable. This bridges the gap. Caloric shows elimination is *possible*; Connectionism shows why Belief is *susceptible*.

      *Refining the "Skill" Objection:* This is crucial for this audience. Many psych students lean Simulation. I need to tell the user to make this a discussion point, not a lecture point.

      *Refining the Closing Question:* "What neural architecture would make 'belief' impossible?"

  9.  **Final Review against Constraints:**
      *   Don't explain EM. (Check: I am planning the pedagogy).
      *   Order of Elim/Red vs. Theory. (Check: Theory first).
      *   Example weight. (Check: Caloric for logic, Connectionism for plausibility).
      *   Misconception order. (Check: Integrated).
      *   Closing question. (Check: Falsification condition).
      *   Skips. (Check: Illusionism/Semantics).
      *   Load-bearing Theory premise. (Check: Addressed).
      *   Time/Whiteboard. (Check: Included in plan).

  10. **Tone:** Professional, pedagogical, sharp. Tailored to PhDs who know the science but maybe not the philosophy of mind depth.

  *(Self-Correction during drafting)*: I initially thought about putting the Empirical Bet later. But it needs to come before the Misconceptions about Behaviorism, because the Behaviorism objection arises from thinking EM denies *causes*. The Empirical Bet (Neuroscience will find a better causal story) clarifies that EM is *hyper*-realist about causes, just anti-realist about *FP* causes. So: Theory -> Elim/Red -> Empirical Bet -> Misconceptions.

  Let's finalize the "Skill vs Theory" point. If mindreading is a skill, EM is harder to sustain. I should advise the user to present this as the "Steel Man" objection from the audience.

  Let's finalize the Closing Question. It needs to separate "nodders" from "getters." A nodder thinks EM means "brains are real, minds are fake." A getter thinks "EM means our current causal taxonomy might be incommensurable with future physics." The question should probe taxonomy. "Is 'belief' a natural kind?"

  Okay, ready to write.
answer: |-
  Here is the session plan. It is designed for 75 minutes, leveraging the whiteboard, and tailored to an audience that treats mental states as operational variables.

  ### 1. The Sequence: Theory First, Elimination Second
  **Order:** You must establish **"Folk Psychology (FP) is a Theory"** *before* you explain **"Elimination vs. Reduction."**

  **Why:**
  *   **The Logic:** Elimination is a semantic/ontological claim about *reference*. Reference is a property of theoretical terms. If you start with "We must eliminate beliefs," the audience hears an ontological brute-force denial ("Your experience is fake"). If you start with "Belief is a theoretical posit in a causal network," you frame it as a hypothesis about *structure* that might fail.
  *   **What breaks if flipped:** If you lead with Elimination, you trigger defensive realism immediately. They will anchor on the *phenomenology* of believing ("But I *feel* like I believe this"). By leading with FP-as-Theory, you anchor them on the *explanatory utility* of the term. You make the term a tool first, an experience second.
  *   **The Empirical Bet:** Place the claim that "Neuroscience will replace rather than reduce FP" **after** the Elim/Red distinction but **before** the historical examples.
      *   *Sequence:* FP is a Theory $\rightarrow$ Theories can be Reduced or Eliminated $\rightarrow$ The Empirical Bet (Neuro won't map neatly to FP) $\rightarrow$ Historical Analogy (to illustrate the *kind* of error).
      *   *Reasoning:* The historical analogy (Caloric) illustrates *how* elimination happens, but the Empirical Bet explains *why* we think it will happen to *us*. If you put the bet after the analogy, the analogy does too much heavy lifting and invites the "but we are not heat" objection too early.

  ### 2. The Carrying Example: Caloric + Connectionism
  Your worry is correct: Caloric/Phlogiston are 3rd-person posits; Belief is 1st/2nd-person ascriptive. If you rely solely on Caloric, you lose the room on the phenomenology objection.

  **The Fix:** Split the labor between two examples on the whiteboard.
  1.  **Caloric (The Logic of Elimination):** Use this *only* to show that a theory can be predictively successful but ontologically bankrupt.
      *   *Draw:* Heat flow $\rightarrow$ Caloric fluid.
      *   *Point:* We felt heat (phenomenology is real), we predicted flow (utility is real), but the *posited mechanism* (fluid) didn't exist.
      *   *Bridge:* "The feeling of conviction is real. The question is whether the *mechanism* (a propositional attitude stored in a belief box) exists."
  2.  **Connectionism/Vector Processing (The Mechanism of Replacement):** This addresses the 1st-person disanalogy.
      *   *Draw:* A neural network node activation pattern vs. a sentence in a "belief box."
      *   *Point:* FP assumes discrete, combinatorial, sentence-like states (I believe *that P*). Neuroscience suggests distributed, vector-based activation.
      *   *Why this works:* It moves the argument from "History says theories die" to "Your own data suggests the architecture doesn't match the theory." This resonates with Neuro/PhD students. It shows *why* reduction might fail (incommensurable architectures), not just *that* it might fail.

  ### 3. Misconceptions: Order and Interception
  Your intuition on the order is right, but you need to intercept them *before* they become objections.

  **1. "This is just Behaviorism" (Intercept: Minute 15)**
  *   *When:* Immediately after defining FP as a theory.
  *   *How:* Draw a box around "Internal States."
  *   *Script:* "Eliminative Materialism is not Behaviorism. Behaviorism says internal states are irrelevant. EM says internal states are *abundant*, but 'belief' and 'desire' are the wrong names for them. We are not denying the cause; we are denying the *taxonomy*."
  *   *Whiteboard:* Write "Realism about Neurostates" vs. "Anti-realism about FP categories."

  **2. "But I feel it / Phenomenology" (Intercept: Minute 30)**
  *   *When:* During the Caloric analogy.
  *   *How:* Pre-empt the "I know I want coffee" objection.
  *   *Script:* "When you say 'I feel heat,' you are right. When 18th-century physicists said 'I feel Caloric flow,' they were wrong about the *category*, not the sensation. EM claims 'I feel a belief' is like 'I feel Caloric.' The sensation is data; the interpretation is the theory."

  **3. "So you want us to stop saying 'believe'?" (Intercept: Minute 60)**
  *   *When:* During the conclusion/pragmatics phase.
  *   *How:* Distinguish Ontology from Heuristics.
  *   *Script:* "EM is an ontological claim, not a linguistic mandate. We still say 'the sun rises.' The question is whether 'belief' survives in the *fundamental explanation*, not in the coffee chat. For this room: Can you publish a paper without operationalizing 'belief'? If not, the elimination hasn't happened yet."

  ### 4. The Load-Bearing Premise: "FP is a Theory"
  **Does the argument survive if mindreading is a skill (Simulation Theory)?**
  *   **Verdict:** No, not easily. This is the weakest link in EM, and you should flag it.
  *   **Instruction:** Explicitly state: "EM relies on the 'Theory-Theory' of mindreading. If mindreading is a non-theoretical skill (Simulation), you can't falsify it in the same way. You can't eliminate a capacity, only a description."
  *   **Pedagogical Move:** Don't solve this. Pose it. "If you are a Simulation theorist, EM looks much less plausible. Why? Because skills don't have 'posits' that can be false." This shows depth and respects their psych background.

  ### 5. Deliberate Skips
  Tell them explicitly what you are bracketing to keep the 75 minutes tight.
  1.  **Illusionism about Consciousness:** "We are not discussing whether qualia exist (Frankish/etc.). We are discussing whether *propositional attitudes* exist. You can be an EM about belief and a Realist about pain."
  2.  **Semantics of Belief Sentences:** "We are not debating contextualism or whether 'believes' is ambiguous. We are treating it as a natural kind term for the sake of the argument."

  ### 6. The Closing Question
  You need a question that separates those who think EM is "Brains good, Minds bad" (Nodders) from those who understand it as "Current Taxonomy vs. Future Taxonomy" (Getters).

  **Ask this:**
  > "Imagine a future neuroscience that predicts your behavior perfectly using only neural vectors, with no variable corresponding to 'belief.'
  >
  > **Question:** Has that neuroscience *translated* your beliefs into neurons (Reduction), or has it *shown that beliefs were never the cause of the behavior* (Elimination)? What specific finding would force you to choose the second option?"

  *   **Why this works:**
      *   The **Nodder** will say: "If they find the neurons, they found the belief." (They don't get the incommensurability point).
      *   **The Getter** will say: "If the neural architecture is distributed/holistic in a way that cannot map onto discrete propositional content, then 'belief' is eliminated, not reduced." (They understand the structural mismatch argument).

  ### Whiteboard Layout Plan (75 Mins)

  *   **Left Panel (0-20): The Setup**
      *   Header: Folk Psychology = Theory?
      *   List FP Posits: Belief, Desire, Intention.
      *   List FP Laws: "If X wants P and believes Q leads to P, X does Q."
      *   *Intercept Behaviorism here.*

  *   **Center Panel (20-45): The Stakes & The Bet**
      *   Header: Reduction vs. Elimination.
      *   Diagram: Theory A $\rightarrow$ Theory B.
      *   Path 1 (Reduction): Smooth mapping (Temperature $\rightarrow$ Mean Kinetic Energy).
      *   Path 2 (Elimination): No mapping (Caloric $\rightarrow$ Thermodynamics).
      *   *The Empirical Bet:* Neuroscience (Vectors) $\neq$ FP (Sentences).
      *   *Intercept Phenomenology here (Caloric analogy).*

  *   **Right Panel (45-75): Objections & Implications**
      *   Header: Vulnerabilities.
      *   Point 1: Skill vs. Theory (Simulation objection).
      *   Point 2: Pragmatics (Do we stop talking?).
      *   *Closing Question written at bottom.*
      *   *List Skips:* Illusionism, Semantics.

  ### Summary of Advice
  1.  **Theory First:** Make "Belief" a hypothesis before you make it a target.
  2.  **Dual Examples:** Caloric for the *logic* of elimination; Connectionism for the *plausibility* of elimination.
  3.  **Flag the Weakness:** Admit that if FP is a skill, EM struggles.
  4.  **Test the Taxonomy:** The closing question must probe whether they understand *incommensurability*, not just physicalism.
