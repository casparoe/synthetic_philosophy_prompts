answer: |-
  1. The saying ranges from a trivial epistemic claim that qualia are inaccessible before experience to a radical metaphysical claim that the choice creates a new self who alone can judge the value.
  2. The epistemic gap is defensible but trivial since all significant choices involve uncertainty, whereas the claim that rational assessment is impossible is false because we can reason about value changes.
  3. When used to wave away deliberation, speakers usually intend the radical reading to imply that current preferences are irrelevant, thereby privileging the future self's judgment over present reasoning.
  4. I endorse the substantive claim that the self changes but reject the false inference that rationality is impossible, arguing we can choose based on valuing the transformation itself.
  5. Only the false claim that rationality is impossible supports stopping deliberation, so paralysis begins when you demand certainty about a future self rather than aligning present values with the transformation.
