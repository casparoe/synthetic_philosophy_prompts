answer: |-
  Thank you for letting me stand here. I know the promise I made when I agreed to do this. I promised I would not stand up here and hand a hundred and twenty people a slogan. I have sat through too many commencements where the speaker tells the graduates to trust themselves, to follow their hearts, to know deep down what is right. Those are nice sentiments, but I have been worrying about them for months. Specifically, I have been worrying about a puzzle involving a fuel gauge.

  Imagine I want to know if the fuel gauge in my car is reliable. I sit in the driver's seat and look at the dashboard. It reads full. So I believe the tank is full. To be honest, the only reason I believe the tank is full is that the gauge told me so. But then I say to myself, well, the gauge read full and the tank is full, so that is a point in the gauge's favor. I do this again and again. I look at the gauge, I believe the tank is full because the gauge says so, and then I count it as a success that the gauge matched the tank. I end up announcing that the gauge is highly reliable, even though I never took it out of the car. I never compared it with a dipstick or a jerry can. I just used the gauge to verify the gauge. Something has plainly gone wrong there. It feels like cheating.

  The version of this that keeps me up at night is the one involving us. I look at a table. It looks red to me, so I believe it is red. Because I believe it is red, I believe it is not a white table sitting under a red light. Because I believe my perception matches the world, I conclude my eyes are working. I have certified my eyesight using nothing but my eyesight. That feels too cheap. But if I insist that I cannot rely on my eyes, or my memory, or my judgment until something outside them has vouched for them, then I can never begin. I end up saying I know nothing, which I do not believe either.

  I tell you this because I know what usually happens at this point in a speech. The speaker resolves the tension by picking a side. They either tell you that circularity is fine and you should just trust your gut, or they tell you that nothing is certain so you should be humble. I am not going to do that. I do not think the puzzle is settled, and I do not think your lives are simple enough to be settled by a choice between blind confidence and total doubt.

  What I want to offer instead is a distinction. There is a difference between confidence that has never been touched by anything but itself, and confidence that has been tested from outside, where it could have gone the other way and cost something. The fuel gauge checking itself is safe. It never risks being wrong because it defines what is right. But a gauge taken out of the car and compared with a measured amount of fuel risks showing empty when you expected full. It risks embarrassment. It risks leaving you stranded.

  Graduates, you are about to leave a place where your judgments were constantly checked by teachers, by grades, by friends who told you when you were being unreasonable. You had instruments outside yourself to vouch for your thinking. Soon, you will be in situations where you have to rely on your own reading of the world. The temptation will be to treat your own judgment like that fuel gauge. You will feel something is true, and because you feel it, you will count it as evidence that you are the kind of person who knows the truth. That is the circularity. It is comfortable. It is also how people get lost.

  The honest way forward is not to distrust your instruments. You have to use your eyes to see the table. You have to use your mind to make a plan. You cannot step outside your own skin to check if you are real. But you can stop treating your own certainty as proof. You can look for the moments where the world pushes back. Real reliability is not when everything looks red and you decide your eyes are perfect. Real reliability is when you thought the table was red, someone turned off the light, you saw it was white, and you updated your understanding of the room.

  So I am not going to tell you to trust yourself. Trust is what you have when you have not yet been tested. I am going to ask you to put yourself in positions where your instruments might fail. Seek out the friends who will tell you when you are wrong. Take the jobs where you do not know the answer yet. Make the apologies that cost you something. When your judgment meets the world and the world says no, that is not a failure of your instrument. That is the only way the instrument becomes reliable.

  I know the air conditioning in this gym is fighting a losing battle, and I know you are tired. I will not keep you longer. But I hope you leave here knowing that you do not need to be certain to be ready. You just need to be willing to be checked. The gauge is only as good as the fuel it actually holds, not the number it displays. Go find out what is in your tank. Thank you.
