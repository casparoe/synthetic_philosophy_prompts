  3.  **Synthesize the "Truth":**
      *   Rosa is right about *wealth* (capacity) but wrong about *solvency* (external obligations).
      *   Uncle is right about *risk* (scrip isn't gold) but wrong about *utility* (gold doesn't fix roofs).
