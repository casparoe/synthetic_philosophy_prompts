      *   *Tone:* Respectful, analytical, grounded, not academic jargon-heavy but economically sound. Acknowledge the emotional weight (town shrinking, family tension).
      *   *Structure:*
          1.  Validate the user's position (it's a hard spot).
          2.  Address Rosa's "Ticket" Theory (The Truth & The Limit).
          3.  Address the Uncle's "Gold" Theory (The Truth & The Limit).
