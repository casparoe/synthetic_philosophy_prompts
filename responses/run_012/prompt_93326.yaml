          *   Sister's view is *Classical Neutrality of Money*.
          *   *Key Insight:* Local currency works for *internal* circulation but fails at *external* boundaries. The town needs cash for diesel/mortgages (imports). Scrip is for domestic trade.
          *   *The Spring Shortage:* Likely a "run on the bank" scenario or a velocity issue. If people hoard scrip or stallholders demand cash out faster than cash comes in, it breaks.

      *   *Refining the Advice:*
