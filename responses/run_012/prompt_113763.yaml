answer: |-
  ### Final Take-Home Essay Question

  **Course:** COLLAPSE 400 (Archaeology & Philosophy)
  **Time Limit:** 60 Minutes
  **Total Marks:** 25

  **Prompt:**

  In lecture, we distinguished between **Thin Collapse** (a specific institutional complex ends, but population and regional capacity persist) and **Thick Collapse** (the region loses the ability to sustain complexity above a certain ceiling). We operationalized this with the **Resumption Test**: a case is only *Thick* if, for a significant stretch of time, no polity of comparable scale/complexity exists in the region, and the missing techniques were not available for reimport from neighbors.

  Write an essay that addresses the following:

  1.  Apply this framework to **two** historical cases discussed in this course (e.g., Late Bronze Age, Classic Maya, Rapa Nui, etc.). For each, render a verdict (Thin or Thick) and justify it using the Resumption Test.
  2.  Critically evaluate the framework itself. Does the Thin/Thick distinction combined with the Resumption Test provide **explanatory power** (telling us *why* the trajectory differed), or is it merely a **redescription** of the archaeological record (categorizing the *aftermath* rather than the *cause*)?

  *Note: Answers that rely primarily on "ecocide" or "diminishing returns" narratives without engaging the Thin/Thick framework will not receive passing marks.*

  ***

  ### Model Answer

  **Title:** Capacity vs. Absence: Evaluating the Two-Thresholds Framework

  The Thin/Thick distinction attempts to move collapse studies beyond the binary of "ended" or "continued." By introducing the Resumption Test, the framework asks us to measure not just the death of a polity, but the death of a region's capacity for complexity. However, while this distinction successfully categorizes outcomes, it risks conflating the *loss of capacity* with the *absence of output*, functioning more as a sophisticated redescription than a causal explanation.

  Applying this to the **Late Bronze Age Eastern Mediterranean**, the verdict is likely **Thin Collapse**. The Mycenaean palatial system and Hittite imperial structures disintegrated. However, the Resumption Test reveals that the "ceiling" did not permanently drop. Within a few centuries, Iron Age polities emerged in the Levant and Greece that utilized writing, monumental architecture, and long-distance trade. The techniques were not lost globally, nor was the region stripped of the capacity to organize. The institutional complex died, but the potential for complexity survived the interim "dark age."

  Conversely, consider **Rapa Nui (Easter Island)**. A verdict of **Thick Collapse** is defensible here. Following the cessation of monumental statue production and the breakdown of the clan-based hierarchy, the region did not see a resumption of comparable organizational scale prior to European contact. There were no neighboring polities from which to reimport state-level techniques, and the island context isolated the social trajectory. The Resumption Test is satisfied: the ceiling dropped and stayed dropped. The society reorganized, but the *achievable level of complexity* was demonstrably lower than the peak pre-contact period.

  However, using these cases reveals where the framework "eats itself." The Resumption Test relies on identifying a drop in "complexity" or "scale." But how is complexity measured? In both cases above, complexity is inferred from the presence of the very institutions that collapsed (palaces, statues, writing). To declare a Thick Collapse, we observe the absence of these artifacts over time. To explain *why* it was Thick, we point to the loss of capacity. But the only evidence for the loss of capacity is the absence of the artifacts.

  This creates a circularity. The framework defines Thick Collapse as the "inability to sustain complexity," but operationalizes it as "the non-appearance of complex institutions." This is a redescription of the archaeological silence, not an explanation of the social mechanism. In the Rapa Nui case, calling it Thick Collapse tells us *that* they didn't build statues again, but it does not explain *why* the capacity was lost versus simply not exercised. If the "ceiling" is defined by the output, then the framework cannot distinguish between a society that *cannot* build a palace and one that *chooses not to*.

  Furthermore, the Resumption Test struggles with the definition of "comparable." If the Bronze Age palaces were replaced by smaller, more resilient city-states that had higher aggregate welfare but less centralization, is that a dropped ceiling (Thick) or a reorganization (Thin)? The framework forces a verdict based on scale, potentially masking a shift in the *type* of complexity.

  Therefore, while the Thin/Thick distinction is heuristically useful for sorting cases, it lacks independent explanatory power. It describes the duration and depth of the aftermath but relies on the archaeological record it seeks to explain to define its variables. To do real explanatory work, the framework would need an independent metric for "capacity" that does not rely solely on the presence of the collapsed institutions themselves. Without that, it remains a taxonomy of absence rather than a theory of failure.

  ***

  ### Marking Scheme (25 Marks Total)

  **Part 1: Application of Framework (10 Marks)**
  *   **Selection of Cases (2 marks):** Two distinct cases chosen from course material.
  *   **Verdict & Justification (4 marks per case):**
      *   Clear Thin or Thick verdict for each.
      *   Explicit use of the **Resumption Test** (mentioning time stretch, regional capacity, or reimporting) to justify the verdict.
      *   *0 marks* if the student ignores the Resumption Test and just says "they died out."

  **Part 2: Critical Evaluation (10 Marks)**
  *   **The "Redescription" Argument (5 marks):** Student identifies that the framework categorizes the *aftermath* (absence of artifacts) rather than the *cause*.
  *   **The Circularity/Capacity Problem (5 marks):** Student identifies the "self-eating" flaw: "Capacity" is measured by the very institutions that disappeared. (i.e., We know they lost capacity because they stopped building, and we say they stopped building because they lost capacity).
      *   *Note:* This is the primary differentiator between an A and a B.

  **Part 3: Clarity and Constraints (5 Marks)**
  *   **Adherence to Constraints (3 marks):** No reliance on "ecocide" or "diminishing returns" as the primary explanation. No specific dates/numbers required.
  *   **Structure and Flow (2 marks):** Essay is coherent, within word limit range, and readable.

  **Penalty Deductions:**
  *   **-5 marks:** Narrating a standard "Ecocide" story without using Thin/Thick terminology.
  *   **-3 marks:** Focusing on factual accuracy of dates/names (since this is a philosophy of science exercise, conceptual application matters more than archaeological nitpicking).
  *   **-2 marks:** Exceeding word count significantly (over 900 words).

  **The A vs. B Line:**
  *   **B Grade (15-19 marks):** Correctly applies Thin/Thick to two cases using the Resumption Test. Argues that the framework is useful for classification. May offer a mild critique (e.g., "it's hard to define complexity").
  *   **A Grade (20-25 marks):** Does everything a B does, **PLUS** explicitly identifies the **circularity in the Resumption Test**. They must argue that defining "capacity" by the presence of "institutions" makes the framework a tautology (describing the absence rather than explaining the inability). The Model Answer's paragraph beginning *"However, using these cases reveals where the framework 'eats itself'"* is the key differentiator.

  **Grader's Note:**
  If a student argues that the framework *is* explanatory because it highlights isolation (like Rapa Nui) vs. connectivity (like Bronze Age), they can score up to 18/25. To break 20, they must critique the *definition of complexity* within the test itself. Do not dock marks for archaeological simplifications (e.g., getting the Maya timeline slightly wrong) provided the *logical application* of the Thin/Thick concept is sound. This is a philosophy exam, not an archaeology qualifier.
