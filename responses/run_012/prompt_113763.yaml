          *   *Resumption Test:* Key for "Thick."
      *   **Constraint 3 (The Goal):** Force students to evaluate if the distinction does *explanatory work* or is just *redescription*. There must be a spot where the framework "eats itself" (a paradox or limitation).
      *   **Constraint 4 (Accessibility):** Answerable based on lecture slides/framework provided in the prompt (no external reading required). No specific dates/numbers to avoid factual nitpicking.
      *   **Deliverables:** One question, one model answer (700 words), one marking scheme (25 marks, clear A/B distinction).

  2.  **Deconstruct the Framework & Identify the "Self-Eating" Spot:**
      *   *Thin:* Polity ends, complexity continues nearby or later.
      *   *Thick:* Complexity ceiling drops, no recovery for a long time.
      *   *The Trap:* How do we define "comparable scale or complexity"? If we define it by the *presence* of the institution, then "Thick" collapse just means "No institution for a while."
      *   *The "Self-Eating" Problem:* The Resumption Test relies on judging "complexity." But if the *measure* of complexity is the very institution that collapsed (e.g., monumental architecture, writing), then a Thick Collapse verdict is tautological. "Writing disappeared and didn't come back" proves "Thick Collapse," but "Thick Collapse" is defined as "Writing disappearing and not coming back." It risks becoming a circular description rather than an explanation of *why* the ceiling dropped.
      *   *Alternative "Self-Eating" Problem:* The distinction might collapse (pun intended) when looking at *scale*. If a region fragments into smaller, equally complex units (e.g., City-states instead of Empire), is that Thin (polity ended) or Thick (ceiling dropped)? If the "ceiling" is defined by centralization, then fragmentation looks like Thick, but if defined by aggregate complexity, it looks like Thin. This ambiguity is where the framework struggles.
      *   *Decision:* The best philosophical critique is the *tautology risk*. If "complexity" is defined by the artifacts of the collapsed state, the Resumption Test just measures the absence of those artifacts. It describes the *symptom* (no big buildings) as the *diagnosis* (loss of capacity).

  3.  **Drafting the Essay Question:**
      *   Needs to be precise.
      *   Needs to mandate the application to two cases.
      *   Needs to mandate the critique (does it explain or describe?).
      *   *Draft:* "Using the Thin/Thick framework, analyze two cases. Then argue if the distinction explains collapse or just describes it." -> *Refining for more punch:* "Does the Resumption Test explain *why* the ceiling dropped, or does it simply measure the duration of the absence?"

  4.  **Drafting the Model Answer:**
