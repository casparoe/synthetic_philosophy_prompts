      *   *Check:* Is the distinction between Thin and Thick clear in the prompt? Yes, I will include the definitions in the question prompt so students have them "in the exam."
      *   *Check:* Is the Model Answer 700 words? I need to monitor this closely.
      *   *Check:* Is the Marking Scheme defensible? Yes, focusing on the philosophical critique as the differentiator.

  7.  **Final Polish:**
      *   Ensure the tone matches a PhD TA talking to a mix of undergrads/grads.
      *   Make sure the "Resumption Test" is central.
      *   Ensure the "Ecocide/Diminishing Returns" trap is explicitly warned against in the marking scheme (as a penalty).

  *(Self-Correction on the "Self-Eating" point)*: The prompt says "I'm fairly sure there's at least one spot where the framework eats itself." I need to make sure the Model Answer identifies this clearly. The strongest point is: If "Thick Collapse" is defined by the *inability to resume*, but we only know they were *unable* to resume because we observe the *absence of complexity*, we are defining the cause (loss of capacity) by the effect (absence of institutions). It confuses *capacity* with *output*.

  Let's write it.

