          *   Application of Framework (Thin/Thick + Resumption Test) to two cases: 10 marks.
          *   Critical Evaluation (The "Explanatory Work" vs. "Redescription" argument): 10 marks.
          *   Clarity/Structure: 5 marks.
      *   *A vs. B Line:* The B student applies the framework correctly. The A student identifies the circularity/tautology in the "complexity" metric within the Resumption Test.
      *   *Penalties:* Narrating ecocide/diminishing returns without using the framework (major deduction). Factual nitpicking (ignore).

