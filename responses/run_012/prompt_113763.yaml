          1.  Define Thin/Thick & Resumption Test.
          2.  Apply to Case 1 (e.g., Bronze Age - likely Thin).
          3.  Apply to Case 2 (e.g., Maya or Rapa Nui - debatable, good for nuance). Let's use Maya (often debated) and Rapa Nui (often cited as Ecocide/Thick). Actually, to avoid factual disputes, keep it abstracted: "Classic Maya" and "Late Bronze Age Eastern Mediterranean."
          4.  The Critique (The "Self-Eating" part): The definition of "complexity" is circular.
          5.  Conclusion.
      *   *Word Count:* Aim for ~700.
      *   *Key Move:* Show that "Thick" collapse might just be "Thin" collapse observed over a longer timeline, or that "complexity" is an observer-relative category.

  5.  **Drafting the Marking Scheme:**
      *   Total: 25 marks.
