answer: |-
  You are not crazy, and you definitely don't need to shut up. In fact, your intuition about Step #3 is one of the most famous and respected arguments in 20th-century philosophy.

  Maya is arguing for a position called **Intellectualism** (the idea that all intelligent action comes from contemplating facts/rules). You are arguing for **Anti-Intellectualism** (specifically, that "knowing how" is a distinct category from "knowing that").

  Here is the breakdown of why she is wrong, the specific philosophical name for your intuition, and exactly what you can say to her to win this without just shrugging.

  ### 1. The Core Error: "Knowing That" vs. "Knowing How"
  Maya's Premise #1 ("knowing something = having a fact in your head") is the weak link. Philosophers distinguish between:
  *   **Propositional Knowledge (Knowing That):** "I know that Paris is in France." This is facts.
  *   **Procedural Knowledge (Knowing How):** "I know how to ride a bike." This is a skill/disposition.

  Maya is trying to reduce *Knowing How* into *Knowing That*. She thinks your skill is just a hidden fact you haven't articulated yet. You know this isn't true because the owner tried to write the facts down (the checklist) and it failed.

  ### 2. Your Intuition on Step #3 is Famous (The Rylean Regress)
  You asked: *"If applying a fact is itself a thing you do... doesn't she need another fact for how to apply the first fact?"*

  Yes. Exactly. You have independently rediscovered an argument made by the philosopher **Gilbert Ryle** in his 1949 book *The Concept of Mind*.

  Ryle called Maya's view "The Intellectualist Legend." He argued that if every intelligent action required you to first consult an internal rule (a fact) about how to do it, you would need an infinite number of rules to get anything done.
  *   To bake the bread, you need Rule A.
  *   To apply Rule A, you need Rule B (how to apply rules).
  *   To apply Rule B, you need Rule C (how to apply rules about applying rules).
  *   **Result:** You'd never bake the bread. You'd be stuck thinking forever.

  **The Counter-Argument:** Intelligent action isn't the *result* of thinking about rules; the intelligent action *is* the performance itself. Your ability to judge the dough isn't a calculation you run; it's a **disposition** you have developed. You don't calculate the spring-back; you perceive it.

  ### 3. The Checklist Problem (Tacit Knowledge)
  There is another philosopher, **Michael Polanyi**, who summed this up with the phrase: **"We can know more than we can tell."**

  This is called **Tacit Knowledge**.
  When the owner wrote "poke it, if the dent springs back about halfway," he failed because "halfway" is not a fixed measurement. It depends on humidity, flour protein, temperature, and the specific feel of that batch.
  *   **Maya's view:** "Halfway" is a fact.
  *   **Reality:** "Halfway" is a relationship between your finger and the dough that you have learned through experience, not data.

  The checklist fails because **interpreting the checklist requires the very skill the checklist is trying to teach.** The new guy doesn't know what "halfway" feels like yet. You do. That difference isn't speed; it's a different *kind* of knowledge.

  ### 4. Addressing Point #4 (The Machine Argument)
  Maya says: *"A camera and a fast enough computer could do my job."*

  This is a tricky one. She might be right that a machine *could* eventually do it, but she is wrong about *how* the machine would do it.
  *   **Old School AI (Maya's view):** Program a rule: `IF dent_depth < 5mm THEN bake`. This fails, just like the checklist.
  *   **Modern AI (Your view):** Neural Networks. You train the computer by showing it 10,000 pictures of dough and telling it "good" or "bad." The computer doesn't learn a "fact" or a "rule." It learns a **pattern**.

  If a machine does your job, it won't be acting like a calculator (applying facts fast); it will be acting like **you** (recognizing patterns through training). So, even if a machine replaces you, it proves *your* point, not hers. It proves the job requires pattern recognition, not rule application.

  ### How to Talk to Maya
  Don't get emotional. Use her logic against her. Here is a script you can adapt:

  **1. Call out the Regress (Her Step #3)**
  > "Maya, you said I apply the fact 'really fast.' But applying a fact is an action. Do I need a rule to tell me how to apply that fact? If yes, then I need another rule to tell me how to apply *that* rule. I end up needing infinite rules just to poke the dough once. Since I actually bake the bread, I can't be using rules for every step. My skill isn't speed; it's that I don't use rules at all."

  **2. The Checklist Evidence**
  > "If skill was just facts + speed, the owner's checklist should work if the new guy reads it fast enough. But it doesn't work at all. That proves the information isn't in the checklist. The information is in the *connection* between my hand and the dough. That's 'knowing how,' not 'knowing that.'"

  **3. The Machine Correction**
  > "You say a computer could do it. Sure, but not by following a checklist. It would need a neural network that learns from mistakes, just like I did. If a computer does my job, it will be doing it by intuition, not by calculation. So even if I'm replaceable, I'm not a calculator."

  ### The Verdict
  **You are right.**
  Maya is trying to force a square peg (procedural skill) into a round hole (propositional facts).
  *   **She is wrong about #3:** Application of knowledge is not itself a piece of knowledge; it is an ability.
  *   **She is wrong about #1:** Not all knowledge is "facts in the head."
  *   **She is debatably right about #4:** But only if the machine learns like a human, not if it calculates like a spreadsheet.

  You aren't just "smug." You possess **expertise**, which is fundamentally different from **information**. You can tell her: *"I don't have data in my head, Maya. I have training. There's a difference."*
