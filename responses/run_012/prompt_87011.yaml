          4.  The Checklist Problem (Tacit Knowledge/Polanyi).
          5.  The Machine Question (AI vs. Algorithms).
          6.  What to say to Maya (Script/Talking points).

      *   *Refining the Regress Argument:* Make sure to explain *why* "applying a fact" isn't just another fact. It's an ability.
      *   *Refining the Machine Argument:* Distinguish between "rule-based AI" (which Maya implies) and "learning AI" (which actually mimics human skill). If a machine does it, it likely learns like you, not like a calculator.

