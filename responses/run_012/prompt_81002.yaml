  *Prediction (Diachronic):* Walking in knowingly is the defect. Rationality requires avoiding known loss; failure to do so is irrational.

  **(c) Resolute Choice Mechanics**
  *Question:* Is resolute choice satisfying or changing preferences?
  *Case:* **The Free Irreversible Switch.** Offered a free switch before the pump starts that deletes your ability to be pumped later without changing payoffs.
