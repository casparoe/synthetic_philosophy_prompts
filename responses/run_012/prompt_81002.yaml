  | **Exploitability** | Indicates environmental vulnerability (like a weak password), not necessarily internal incoherence. | Indicates a defect in agency. If you know you'll be pumped, your initial choice is irrational. |
  | **Resolute Choice** | Changes or overrides existing preferences rather than fulfilling them. | Executes the higher-order preference of the planning self, fulfilling true rational agency. |

  **III. Cruxes and Test Cases**

  **(a) Diachronic Requirements**
  *Question:* Can rationality govern relations between temporal stages?
