answer: |-
  ### 1. The Pedagogical Sequence (Scaffolding the Explanation)

  To prevent the metaphor from collapsing into a dualist "physical vs. magical" binary, you must establish the *mechanism* before the *metaphor*. If you introduce "Cranes and Skyhooks" before establishing the algorithmic nature of selection, students will treat Cranes as merely "material causes" and Skyhooks as "immaterial causes," which misses Dennett's point about *explanatory lift*.

  **Order of Operations:**

  1.  **The Problem of Complexity (15 mins):** Begin with "Design without a Designer." Do not start with biology; start with the logical problem of how complex, functional order arises from chaos. This isolates the *explanatory burden*.
  2.  **The Algorithmic Core (20 mins):** **Crucial Step.** Define Natural Selection not as a biological fact, but as a substrate-neutral algorithm (Replication, Variation, Differential Fitness). You must establish that the *process* does the work, not the *medium*.
      *   *Why this must come first:* If you do not establish substrate neutrality, "Cranes" will be interpreted as "biological/physical stuff" and "Skyhooks" as "non-biological/mental stuff." This reintroduces the dualism Dennett is dismantling. The Crane is the *algorithm*, not the matter.
  3.  **The Metaphor (Cranes vs. Skyhooks) (20 mins):** Now introduce the terms.
      *   **Skyhook:** An explanatory device that provides lift *without* resting on a lower substrate (a miracle, an unexplained explainer).
      *   **Crane:** A mechanism that provides lift by resting on and extending the substrate below it (a local, explicable process).
      *   *Constraint:* Emphasize that both are tools for *explanation*, not just ontology.
  4.  **Greedy Reductionism (20 mins):** Define the vice. It is not reductionism *simpliciter*; it is the attempt to skip the intermediate Cranes and explain a high-level phenomenon *directly* via the bottom substrate.
      *   *Key distinction:* Good reductionism uses Cranes to climb; Greedy reductionism tries to teleport.
  5.  **Case Study Application (15 mins):** Apply the framework to the chosen case (see below).

  ### 2. The Case Study: Eye vs. Alphabet

  **Recommendation:** Use **the Eye**.

  **Why the Eye carries the distinction better:**
  The Eye is the historical and logical locus of the Skyhook charge (Paley's Watch, Intelligent Design). It is the "hardest case" for blind algorithmic processes. If you can demonstrate how the Eye is built by Cranes (incremental selection) rather than a Skyhook (sudden design), you prove the algorithm's power. The Eye isolates the variable of *blind variation* more cleanly than the Alphabet.

  **Why the Alphabet is riskier (despite your colleague's point):**
  Your colleague is right that the Alphabet is an artifact that enables cognitive lift (a classic Crane function). However, the Alphabet introduces *human intentionality* too early. Students will struggle to distinguish between the *design of the alphabet by humans* (top-down) and the *evolution of the alphabet via cultural selection* (bottom-up). This muddies the "blind algorithm" prerequisite you established in Step 2. The Eye forces them to confront blind selection; the Alphabet allows them to hide behind "human cleverness."

  **What the Case Must Have:**
  *   **Cumulative Complexity:** It must show layers of function built upon prior function.
  *   **Apparent Design:** It must look like it *required* a Skyhook to exist.

  **What the Case Must Lack:**
  *   **Intentional Agency:** It must not rely on a "designer" within the narrative of its construction (which is why the Alphabet is treacherous).

  **The Trap (The Obvious Alternative):**
  **Consciousness / AI.**
  Do not use "The Mind" or "AI" as your primary case. This is the trap. Because your students encountered these terms in online AI arguments, they are primed to map Crane/Skyhook onto "Material AI vs. Human Soul." If you use Consciousness as the case study, you invite the very dualism (Skyhook thinking) you are trying to dismantle before they understand the Crane mechanism. You cannot use the *contested phenomenon* to explain the *tool for resolution*. Use the Eye to build the tool; use the tool later to analyze the Mind.

  ### 3. Misconceptions and Interception Points

  You must head these off *before* they crystallize during discussion.

  | Misconception | Exact Point of Interception | How to Head It Off |
  | :--- | :--- | :--- |
  | **"A Skyhook is just anything non-physical."** | **Step 3 (The Metaphor)** | Explicitly state: "A Skyhook can be physical. A mutation that appears out of nowhere with no causal history is a Skyhook. It is about *explanatory support*, not ontology." |
  | **"Greedy Reductionism just means Reductionism."** | **Step 4 (Greedy Reductionism)** | State clearly: "Dennett is a reductionist. He opposes *Greedy* Reductionism. The vice is skipping levels, not reducing them." |
  | **"So Dennett thinks every higher-level explanation is illegitimate."** | **Step 4 (Greedy Reductionism)** | Clarify: "Cranes *are* higher-level explanations. They are legitimate *because* they are grounded. Greedy reductionism tries to eliminate the Cranes; Dennett wants to study them." |
  | **"Crane/Skyhook maps straight onto Reductionist/Emergentist."** | **Step 5 (Case Study)** | When applying to the Eye, point out that an Emergentist might posit a Skyhook (emergence as magic). A Dennettian Emergentist uses Cranes (emergence via selection). The distinction cuts *across* that traditional divide. |

  ### 4. The Diagnostic Question

  Do not ask for a definition. Ask for an application that requires navigating the "Greedy" trap.

  **The Question:**
  > "If I explain the function of a neuron entirely in terms of ion channels and physics, have I used a Crane or committed Greedy Reductionism? What is missing from that explanation that a Crane would provide?"

  **What this distinguishes:**
  *   **Vocabulary Command:** They will say "Greedy Reductionism."
  *   **Genuine Grasp:** They will identify that skipping the *biological/functional level* (the Crane of natural selection that shaped the neuron) is the error. They will recognize that a valid reduction must account for the *historical/functional layer* (the Crane) before reducing to physics. If they cannot name the intermediate layer, they don't understand the Crane.

  ### 5. Scope Limitation: What to Decline

  **Openly decline to take up:** **The Hard Problem of Consciousness (Qualia).**

  **Why:**
  At this level, introducing Qualia invites the "Skyhook of Subjectivity." Students will want to argue whether subjective experience *can* be a Crane. This is a rabbit hole that consumes 90 minutes instantly.
  **What to say:** "Whether qualia can be fully explained by Cranes is a separate metaphysical debate. Today, we are analyzing the *structure of Darwinian explanation*. We are testing whether the *mechanism* holds, not whether it exhausts every philosophical intuition about mind. Keep the focus on the *explanatory lift*, not the *experience of the lifted*."
