answer: |-
  Here is the machinery you asked for. It is built on the distinction between **coordination norms** (arbitrary rules to keep traffic flowing) and **distributive norms** (rules about who gets money, dignity, or safety). It also accounts for your status as a temporary extractive agent (a tourist) versus a resident.

  ### Part 1: The Two Distinctions

  You suspected these matter. They do. Here is how the procedure treats them:

  1.  **Arbitrary Coordination vs. Moral Weight:**
      *   **Coordination (e.g., which side to walk on, queueing):** These are efficiency tools. There is no "right" side, only the "same" side. *Verdict:* You are obligated to follow these to prevent friction, even if they seem silly.
      *   **Moral/Distributive (e.g., tipping, bribes, seating by caste):** These allocate resources or status. *Verdict:* You are obligated to follow these *only if* following them prevents harm to a vulnerable party. If the custom itself causes harm (e.g., segregation), you are obligated to refuse, regardless of local consensus.

  2.  **Guest vs. Resident:**
      *   **The Guest Exemption:** You are excused from deep cultural integration (e.g., perfect greeting rituals, dress codes beyond basic modesty). You are a learner, not a citizen.
      *   **The Extractive Liability:** Because you are there to consume (views, photos, service) and then leave, you have a *higher* obligation than a resident regarding economic norms. A local can opt out of a tipping culture to protest it; you cannot, because you aren't there to fix the system, only to participate in it without breaking the people in it.

  ---

  ### Part 2: The Decision Procedure (The 4-Question Filter)

  Run these questions in order. Stop at the first decisive answer. This should take under 60 seconds.

  **Q1: The Safety & Law Test (Hard Stop)**
  *   **Question:** Does doing this risk physical injury, arrest, or deportation for me or the group?
  *   **If YES:** **DO NOT DO IT.** (Exception: Immediate survival).
  *   **If NO:** Proceed to Q2.

  **Q2: The Livelihood Test (Economic Harm)**
  *   **Question:** If I *don't* do this, does a specific local person lose money they rely on to eat or work? (Look at the person: Are they service staff? Is this a wage supplement?)
  *   **If YES:** **YOU ARE OBLIGATED TO FOLLOW.** (Your guest status does not excuse economic harm).
  *   **If NO:** Proceed to Q3.

  **Q3: The Coordination Test (Friction)**
  *   **Question:** Is this purely about order/flow (queues, traffic, shoes inside)? Is everyone doing it uniformly?
  *   **If YES:** **FOLLOW IT.** (It costs you nothing to be polite, and it reduces friction for the locals dealing with you).
  *   **If NO (Locals are divided/ignoring it):** Proceed to Q4.

  **Q4: The Dignity Test (Core Values)**
  *   **Question:** Does participating in this custom violate a fundamental human right or dignity (e.g., bribery, discrimination, exploitation)?
  *   **If YES:** **REFUSE.** (Polite but firm. Accept the consequence).
  *   **If NO:** **DISCRETIONARY.** (This is the "Vibes" zone. You can choose based on group preference).

  ---

  ### Part 3: Where the Machine Hands It Back to You

  There is a "Judgment Zone." The procedure stops and hands the call back to you if:
  1.  **Q2 is ambiguous:** You can't tell if the tip is a wage or a bonus.
  2.  **Q4 is ambiguous:** You aren't sure if a custom is "traditional" or "oppressive."

  In these cases, the default setting is: **Defer to the Local Guide.** If you have a local fixer/driver, ask them privately: *"If I do this, does it help you or hurt you?"* Trust their answer over your intuition. If no local guide is present, default to **caution** (do the thing) if the cost is low, and **refusal** if the cost is moral.

  ---

  ### Part 4: Running the Cases

  Here is the procedure applied to your three scenarios.

  #### Case 1: Tipping (The Economic Norm)
  *   **Scenario A (Expected/Wage):** You are in a country where service wages are below subsistence and tips make up the bulk of income.
      *   **Q1 (Safety):** No risk.
      *   **Q2 (Livelihood):** **YES.** If you don't tip, the guide/driver loses essential income.
      *   **Verdict:** **OBLIGATED TO FOLLOW.**
      *   *Why:* Your guest status increases the liability here. You are consuming their labor. To withhold the tip is to extract value without paying the local market rate.
  *   **Scenario B (Insult):** You are in a culture where offering cash directly is seen as charity or an insult to professional dignity.
      *   **Q1 (Safety):** No risk.
      *   **Q2 (Livelihood):** **NO.** They are paid a salary; a tip is not needed for survival.
      *   **Q3 (Coordination):** **YES.** The norm is "no tips." Offering one breaks the social flow.
      *   **Verdict:** **OBLIGATED TO NOT DO IT.**
      *   *Why:* Doing it anyway asserts your wealth over their dignity.

  #### Case 2: Jaywalking (The Coordination Norm)
  *   **Scenario:** Crosswalk is 200ft away. Illegal. Every local is crossing mid-block.
      *   **Q1 (Safety/Law):** Technically illegal, but low risk of arrest. Safety risk? Look at the traffic. If cars are stopping for pedestrians, safety is low.
      *   **Q2 (Livelihood):** **NO.** No one loses money.
      *   **Q3 (Coordination):** **YES.** Locals are doing it uniformly. The "rule" on the ground is "cross here," not "cross at the line."
      *   **Verdict:** **FOLLOW THE LOCALS.**
      *   *Why:* This is a pure coordination convention. If you force your group to walk 200ft while everyone else crosses, you aren't being "moral," you're being an obstacle. You create friction for the drivers who expect pedestrians there.
      *   *Caveat:* If traffic is speeding and not yielding, Q1 triggers (Safety), and you **DO NOT DO IT**, regardless of what locals do. Locals might have better reflexes or insurance; your clients don't.

  #### Case 3: The "Facilitation Payment" (The Moral Norm)
  *   **Scenario:** A checkpoint. The official says a "fee" is needed to pass. It's technically a bribe, but everyone pays it to avoid hours of delay. It's treated as normal business.
      *   **Q1 (Safety/Law):** **YES.** Bribery is illegal under your home laws (e.g., FCPA, UK Bribery Act) and often local laws, even if enforced loosely.
      *   **Q2 (Livelihood):** **NO.** The official is not relying on this to eat; they are leveraging power.
      *   **Q4 (Dignity/ Ethics):** **YES.** This is corruption. It perpetuates a system that harms the local population by diverting public resources to private pockets.
      *   **Verdict:** **REFUSE.**
      *   *Why:* Even though "everyone does it," this falls under Q4. It violates the rule of law and ethical standards.
      *   *The Outcome You Won't Like:* **You will delay the group.** You might sit at that checkpoint for three hours while the official sulks. Your clients will be angry. They will ask, "Why didn't you just pay the $20?"
      *   *The Hard Truth:* The procedure forces you to prioritize the systemic harm over the client's comfort. You are a leader, not a concierge. If you pay, you validate the corruption. If you refuse, you protect your group from legal liability and protect the local system from further rot, but you sacrifice the trip's flow.

  ---

  ### Part 5: Where This Procedure Misfires

  You asked for honesty on the limitations. Here is where this machinery breaks:

  1.  **Information Asymmetry (The Q2 Failure):**
      You cannot always know if a tip is a wage or a bonus. In some places, staff pool tips; in others, it's pocketed. If you misread Q2, you might tip where it's forbidden (insulting) or refuse where it's needed (harming).
      *   *Fix:* When in doubt on Q2, ask the local guide *before* the trip starts. "What is the custom on gratuities?" Make that a pre-trip intel check.

  2.  **The "Local Consensus" Illusion (The Q3 Failure):**
      In the Jaywalking case, you assume locals know the risk. They might not. They might be crossing because they are desperate, not because it's safe. If you follow them and a client gets hit, "Everyone was doing it" is not a legal defense.
      *   *Fix:* Q1 (Safety) must always override Q3 (Coordination). If the cars aren't stopping, you stand on the curb, even if you look like a fool.

  3.  **The Moral Imperialism Trap (The Q4 Failure):**
      Who defines "Dignity"? In the Seating Arrangement example (e.g., women eat separately), you might view it as oppression (Refuse), while the local women view it as sacred tradition (Follow). If you refuse, you might actually offend the very people you think you're defending.
      *   *Fix:* This is the **Judgment Zone**. Do not apply Q4 to social/religious customs unless there is clear coercion or harm. If the women *choose* to sit separately, you sit separately. If they are *forced*, you refuse. You likely won't know the difference in 60 seconds.
      *   *Procedure Patch:* If Q4 involves gender/religion/caste and you lack deep context, **Defer to the Local Guide.** Ask: *"Is this expected of guests, and does anyone here mind if we opt out?"*

  ### Summary for the Field
  *   **Money/Livelihood:** Follow local custom (protect the worker).
  *   **Traffic/Flow:** Follow local custom (protect the peace).
  *   **Law/Bribery:** Follow home ethics (protect the system/your license).
  *   **Social/Religious:** Ask the guide (protect against arrogance).

  You are the buffer. The procedure isn't to make you perfect; it's to make you consistent. Consistency allows clients to trust you, even when they don't like the call.
