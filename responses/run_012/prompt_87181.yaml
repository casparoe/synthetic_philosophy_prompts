answer: |-
  Here is the baseline you asked for, followed by the audit.

  ### The Baseline: What they actually argued

  **Leopold von Ranke (1795–1886)**
  Ranke is often misread as a dry empiricist, but he was a German Idealist. He didn't want "brute facts"; he wanted to discern the divine idea operating within historical states. His famous phrase *wie es eigentlich gewesen* implies uncovering the inner truth or essence of an era, not just listing events. He pioneered archival rigor, but he believed the historian intuits the spiritual significance of the past, not merely records it.

  **E.H. Carr (1892–1982)**
  Carr argued that facts are inert until the historian activates them. His metaphor: facts are like fish in an ocean; the historian catches only what their net (theory/prejudice) allows. However, Carr was not a relativist. He believed objectivity was a goal to be striven for by understanding one's own bias. He believed in progress and that some historical interpretations are genuinely "better" (more future-oriented) than others.

  **Hayden White (1928–2018)**
  White argued that historical works are "verbal fictions." He didn't mean they are lies, but that they share the *structure* of literature (emplotment). A historian chooses to tell a story as a Tragedy, Comedy, Romance, or Satire. This choice determines the meaning before the analysis even begins. For White, the "content" is found, but the "meaning" is imposed through literary tropes.

  ***

  ### The Audit

  Here is the paragraph-by-paragraph breakdown of your brother's post.

  **1. The Ranke Section**
  *The post claims: Ranke wanted documents to speak for themselves, no theory, no politics, just "what actually happened."*

  *   **Specialist Nod:** It is true Ranke shifted history from moral philosophy to archival research. He did coin the phrase regarding showing the past "as it actually was."
  *   **Specialist Wince:** The claim that he wanted to "add nothing of himself" is naive. Ranke believed the historian must suppress their ego to let God's will reveal itself through the nations. That is a theological theory, not an absence of theory.
  *   **What's Wrong:** It flattens him into a logical positivist (a 20th-century category). Ranke didn't think documents "speak"; he thought the historian must interrogate them to find the spiritual essence.
  *   **The German Word (*eigentlich*):** The commenter is **not** being cute; they are correct. *Eigentlich* translates to "actually," but also "essentially," "properly," or "in its own nature." Ranke scholars have debated this for decades. If you read it as "essentially," Ranke isn't asking for a camera-like recording of events, but a philosophical grasp of their inner logic. The post ignores this to make Ranke look like a straw man for Carr to knock down.

  **2. The Carr Section**
  *The post claims: Carr showed facts must be selected, so history is the historian's creation, not the past's.*

  *   **Specialist Nod:** Carr absolutely argued that the selection of facts is the primary act of the historian. The "mountain of facts" argument is standard Carr.
  *   **Specialist Wince:** The phrase "creation rather than the past's" is dangerous. Carr believed the past exists independently of the historian. He argued we interact with the past, not create it. He would reject the idea that the history *is* the creation; he would say the *narrative* is the creation, but the facts constrain it.
  *   **What's Wrong:** Carr would be furious at the usage made of him here. Carr was a Marxist-leaning realist. He believed we select facts to find the "truth" of the direction of history. He did not think selection meant "anything goes." He believed in objective truth as a horizon we move toward.

  **3. The White Section**
  *The post claims: Historians shape material into stories with morals; history is a kind of fiction; difference is packaging.*

  *   **Specialist Nod:** White definitely argued that historians impose narrative structures (employment) that are not inherent in the events themselves. The "moral" or meaning is a literary effect.
  *   **Specialist Wince:** Using the word "fiction" without qualification is the classic mistake laypeople make with White. White distinguished between "factual" (did it happen?) and "fictional" (how is it storied?). He never said history books are novels. He said they use the *grammar* of novels.
  *   **What's Wrong:** "Difference of packaging" trivializes the archive. White acknowledged the "chronicle" (the raw events) resists certain stories. You can't emplot the Holocaust as a Comedy without violating the evidence. The post implies the packaging is arbitrary; White argued it is ideological, but constrained by the record.

  **4. The Conclusion**
  *The post claims: No account is more objective than another; all history is a story from somewhere; therefore all history is politics.*

  *   **Specialist Nod:** "Every history is a story told from somewhere" is a fair summary of standpoint epistemology (which follows White).
  *   **Specialist Wince:** The leap from "narrative structure" to "politics" is fast. While White and later critical theorists argue narrative is political, Carr would argue narrative can also be scientific or sociological.
  *   **What's Wrong:** The non-sequitur: "No account is more objective than any other." This does not follow. Even if all accounts are perspectival (Carr) and narrativized (White), one account can still be *more* objective than another if it accounts for more evidence, acknowledges its bias better, or uses more rigorous methods. Perspectivism does not equal relativism. The post conflates "biased" with "equally valid."

  ***

  ### Addressing Your Specific Doubts

  **Is the Ranke bit a fair picture?**
  No. It turns him into a caricature of a positivist robot. It ignores his Idealism and theology to make the "progress" of the argument (Ranke $\to$ Carr $\to$ White) look cleaner. It's a "Whiggish" history of historiography, ironically doing the very thing it critiques.

  **Would Carr be happy with that ending?**
  Absolutely not. Carr wrote *What is History?* to save historical truth from the skeptics, not to bury it. He argued that while we can't have perfect objectivity, we can have *progress* in objectivity by understanding our social context. The post uses Carr to argue for relativism; Carr was arguing for a more sophisticated realism.

  **Is the White bit fair?**
  It is the strongest part of the post, but still slightly reductive. White's point was that the *meaning* is literary, not that the *facts* are optional. The post blurs this, suggesting the whole thing is "fiction" in the colloquial sense.

  **Is the German word point real?**
  Yes. It is a standard nuance in German historiography. *Eigentlich* comes from *eigen* (own). To show the past "as it *eigentlich* was" is to show it in its own terms, not necessarily as a brute factual record. It supports the idea that Ranke was an interpretivist, not a positivist.

  **Does the final sentence follow?**
  No. Even if we accept Carr (selection) and White (narrative), it does not prove "no account is more objective." It proves all accounts are *constructed*. A well-constructed building is still more sound than a poorly constructed one. The post assumes construction = arbitrary = political. That is a political stance itself, not a logical conclusion.

  ***

  ### The Verdict

  **What the post gets right:** It correctly identifies the trajectory from archival empiricism (Ranke) to the sociology of knowledge (Carr) to the linguistic turn (White).

  **What the post gets most wrong:** It treats these three thinkers as a linear progression toward "truth" (that history is just politics), when in reality Carr and White were diagnosing a problem, not celebrating the end of truth. It conflates "perspectival" with "relativist," and uses Ranke as a straw man to make the later thinkers look more revolutionary than they intended to be.
