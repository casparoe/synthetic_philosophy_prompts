  **Note on the Text**

  The poem treats Pascal's diagnosis of the political condition as a stable pact, which is a point of scholarly contention. It is settled that Pascal argues existing laws rest on custom and force rather than pure justice, and that exposing this foundation is socially dangerous. However, scholars dispute whether the line "We make the strong appear good" represents Pascal's own cynical political wisdom or a description of fallen nature he intends to critique through theology. Similarly, while the poem ends without resolution, it is disputed whether Pascal's appeal to custom leaves room for a true justice accessible only in the next life, or if it implies a more radical skepticism about political truth in this one.
