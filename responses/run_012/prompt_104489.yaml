          *   Revolution/Reform $\rightarrow$ Pathology/Surgery.

  3.  **Analyze the Disanalogies (The "Breaks"):**
      *   *Boundaries:* Organisms have skin/membranes. Societies have porous, contested borders.
      *   *Reproduction/Germ Line:* Organisms reproduce sexually/asexually with a specific mechanism. Societies "reproduce" via cultural transmission, which is Lamarckian, not Weismannian. No clear germ/soma distinction.
      *   *Lifespan:* Organisms have programmed senescence (mostly). Societies don't necessarily die of "old age"; they collapse due to external shock, internal conflict, or transformation.
