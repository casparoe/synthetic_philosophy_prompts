      *   *The Mapping:*
          *   Society/Civilization $\rightarrow$ Organism.
          *   Institutions/Classes $\rightarrow$ Organs/Tissues.
          *   Individuals $\rightarrow$ Cells.
          *   Cultural Transmission $\rightarrow$ Genetics/Germ Line.
