  5.  **Address the User's Suspicion:**
      *   User suspects "development" in organisms isn't law-governed in the historicist sense.
      *   *Confirmation:* The user is right. Developmental systems theory (DST) emphasizes contingency. Even with a genome, phenotypic outcome is probabilistic, not deterministic. So the analogy fails even on the biological side.

  6.  **Consider Alternative Analogies:**
      *   *Ecology/Ecosystem:* Better fit for interaction without central control. But still doesn't yield predictive "laws" of history.
      *   *Complex Adaptive Systems:* Best fit. Non-linear, path-dependent, emergent. Explicitly rejects the "organismic" teleology.

