  - The three theses

  The phrase "Church–Turing thesis" obscures three distinct claims that must be disentangled to assess their status. First, the **mathematical thesis** asserts that the informal notion of computability by an effective procedure coincides extensionally with Turing-machine computability. This is a claim about conceptual analysis: does the formalism capture the intuition? Second, the **physical thesis** claims that no physical system, actual or nomologically possible, can compute functions beyond the Turing limit. This is a claim about the laws of nature governing information processing. Third, the **cognitive thesis** holds that no procedure a human can execute by rote, without insight or auxiliary devices, exceeds Turing computability. This is a claim about human cognitive architecture.

  These three do not collapse. The cognitive thesis could be true while the physical thesis is false: humans might be limited to Turing operations even if the universe permits hypercomputational processes (like quantum gravity effects or Zeno machines) that we cannot manually replicate. Conversely, the physical thesis could be true while the mathematical thesis is false, if "effective procedure" implies a narrower class than physical possibility (e.g., requiring human surveyability). The mathematical thesis concerns the meaning of "algorithm"; the physical thesis concerns the capabilities of matter; the cognitive thesis concerns the capabilities of minds. Confusing them leads to category errors: refuting the physical thesis with an exotic physical model does not necessarily invalidate the mathematical analysis of what constitutes a step-by-step procedure. The mathematical thesis sets the standard for what counts as an algorithm; the physical thesis tests whether our universe respects that standard as a limit. To evaluate the Church–Turing thesis, we must judge each on its own evidential grounds, recognizing that a failure in physics does not entail a failure in logic, nor does a limit in cognition entail a limit in nature. The mathematical thesis is normative for proof; the physical thesis is descriptive of reality. Keeping them separate prevents the error of treating a physical impossibility as a logical one, or vice versa, ensuring that our foundational commitments remain stable even if physical theories change.

  - The definitional reading

  The definitional reading treats the mathematical thesis as an explication rather than a hypothesis. On this view, "effective procedure" is vague, and Turing provided the precise definition that captures the essential features: finite alphabet, discrete steps, local operations. If we accept this analysis, the thesis is true by stipulation. The charge against this reading is that it renders the thesis empty. If it is merely a definition, it cannot be surprising, yet the identification of Turing computability with effective calculability was a profound discovery that ruled out competing formalisms. It behaves substantively: it predicts the failure of proposed counterexamples and guides research. If it were merely a definition, proposing a counterexample would be a category mistake, like proposing a married bachelor, yet mathematicians treat proposed hypercomputational models as serious challenges to be refuted.

  However, the charge of emptiness misunderstands the role of conceptual analysis. A definition can be substantive if it successfully captures a pre-theoretic concept that previously lacked precision. The work done here is not abbreviation but *explication*. The pre-theoretic notion of "effective procedure" carried constraints—mechanicity, finitude, determinacy—that were not fully articulated until Turing. The thesis is substantive because it is not obvious that these constraints entail Turing computability; proving that lambda calculus and recursive functions share the same extension was a mathematical discovery. Thus, the thesis is true by stipulation only in the sense that we agree to use "effective procedure" to mean "Turing-computable," but this agreement is warranted by the deep structural match between the formalism and the intuition.

  My interim assessment is that the definitional reading is correct but requires nuance. It is not an arbitrary decree but a successful identification. The thesis is analytic relative to the explicated concept, but the success of the explication is a synthetic achievement. We treat it as a definition because no counterexample has ever gained traction, not because we forbid them by fiat. To treat it as purely empirical would be to ignore that "effective procedure" is a normative notion about what counts as a proof, not just a natural kind. We define it this way because this definition preserves the integrity of mathematical proof. The emptiness objection fails because the definition organizes a chaotic intuition into a rigorous framework, enabling theorems that were previously impossible. However, we must acknowledge the risk: treating it as a definition risks dogmatism. If we define "computation" too narrowly, we may blind ourselves to new forms of information processing. The definitional reading holds only if we accept that the normative constraints of "effective procedure" are fixed by the human condition of finitude. If those constraints shift, the definition shifts. Thus, it is a definition grounded in a philosophical anthropology, not pure logic, serving as a stable platform for theory construction.

  - The empirical reading

  The empirical reading focuses on the physical thesis: that no physical system computes non-Turing functions. To refute this, one would need to observe a physical system reliably outputting values of a non-recursive function, such as the Halting function. The observation must be robust: the system must produce the output within finite time and energy, and the output must be verifiable. Here lies the difficulty. If a machine claims to solve the Halting Problem, how do we verify a "no" instance? We cannot simply wait to see if the target machine halts, as that might take forever. Verification of hypercomputation often requires assuming the very theory being tested, creating a circularity. We are faced with a black box that claims to know the unknowable; without independent access to the truth, we cannot confirm its success empirically.

  Does the impossibility of straightforward refutation show the thesis is defective? No. Universal claims about limits often share this feature; we cannot observe all of spacetime to confirm conservation laws. However, the physical thesis is more vulnerable than standard physical laws because "computation" is not a primitive physical quantity like mass. It is an interpretative layer over physics. To call a physical process a "computation" requires mapping physical states to semantic values. If a Zeno machine outputs a result via infinite steps, can we read the result? If reading the result requires infinite precision measurement, the observation is physically impossible regardless of the machine's operation. Noise and quantum uncertainty typically degrade the infinite precision required for hypercomputation, making the empirical realization of such systems dubious. Thus, the failure of refutation is not a defect but a feature of the thesis's generality.

  It suggests the physical thesis was never a purely empirical claim like "all swans are white." It is a metaphysical constraint on what we accept as a physical computer. If a system appears to hypercompute, we are more likely to question our model of the system than the thesis. This resilience indicates that the physical thesis functions as a regulative principle for physics itself: we assume physical laws are computable. If evidence mounted against it, we would not simply discard the thesis; we would overhaul our understanding of physical measurement. Therefore, its status is quasi-empirical: it guides empirical inquiry but is not easily falsifiable by it. It stands as a boundary condition on physical theory, not merely a prediction within it. The distinction between the mathematical and physical thesis is crucial here: the mathematical thesis defines the limit, while the physical thesis claims nature respects it. The empirical reading fails if it treats the thesis as a simple generalization from observed machines; it succeeds only if treated as a constraint on physical law, protecting the coherence of scientific modeling against anomalies that would render prediction impossible.

  - What can be proved and what can only be stipulated

  A third strategy seeks to prove the thesis by axiomatizing the notion of a mechanical procedure. Scholars like Gandy and Sieg have proposed axioms capturing the essence of computation: locality (changes depend only on local state), determinacy, and finite basis. They prove that any system satisfying these axioms is Turing-computable. This result is mathematically rigorous: within the axiomatic framework, Turing computability is unique. It removes the air of mystery from the coincidence of formalisms. However, this does not settle the epistemic status of the thesis. The proof establishes that *if* a procedure is mechanical in the specified sense, *then* it is Turing-computable. It leaves untouched the justification for the axioms themselves.

  Why must a computation be local? Why must it have a finite basis? These axioms reflect our understanding of human-effective procedures and classical machinery. They do not logically forbid non-local quantum effects or continuous state spaces from counting as computation. The residual gap is between "computation as we conceive it" and "computation as it might be." The axioms effectively build the Turing limit into the definition of "mechanical step," risking circularity if presented as a proof of the mathematical thesis. Can further argument close this gap? No. The axioms rest on a philosophical decision about what counts as a "step." To demand proof that no non-axiomatic computation is possible is to demand proof of a negative about all possible physical structures. The gap must be closed by decision: we decide that information processing requiring infinite precision or non-local instantaneous influence does not count as "effective procedure."

  The axiomatic approach shows that Turing computability is the only stable notion of computation under conditions of finitude and locality. It transforms the thesis from a guess into a theorem relative to a conceptual framework. But the framework itself is not proven; it is advocated. The result establishes the robustness of the Turing limit within a specific conception of mechanism, but it cannot prove that nature is bound by that conception. It shows that Turing computability is necessary for *surveyable* computation. Whether nature allows non-surveyable computation remains open. Thus, the axiomatic proof secures the mathematical thesis for human-scale reasoning but leaves the physical thesis contingent. The status of the thesis, therefore, is that of a philosophical necessity relative to a framework. It is not a theorem of logic, nor an empirical generalization. It is a constitutive principle of computer science, defining the boundaries of the discipline. We stipulate the axioms because they capture the intuitive core of algorithmic reasoning, but we must admit that this stipulation is a choice to prioritize human intelligibility over physical possibility.

  - The accelerating machine

  Consider the accelerating machine: a device performing infinitely many steps in two seconds. Your colleague infers that because it executes a non-terminating computation in finite time, it decides the Halting Problem, refuting the physical thesis. If physics allows this, the inference is valid: the machine computes a non-recursive function. The defender of the physical thesis must therefore give up the claim that physics respects the Turing limit. However, something has gone wrong in the classification. The machine violates the axioms of locality and finite speed assumed in the mathematical thesis. It is not an "effective procedure" in the standard sense because it requires a supertask. Thus, the mathematical thesis (i) remains intact: the machine does not compute via an effective procedure. The cognitive thesis (iii) also holds: humans cannot perform supertasks. Only the physical thesis (ii) is threatened.

  But even here, the defender has a recourse: the readout problem. To extract the result of an infinite computation, one must measure a physical quantity with infinite precision (e.g., the position of a particle after infinite divisions). If physical law forbids infinite precision (due to quantum limits or thermodynamic noise), the result is inaccessible. A computation whose output cannot be read is not a computation in the functional sense. This case reveals that the three theses come apart sharply. The accelerating machine is a counterexample to (ii) only if we ignore measurement constraints. It is not a counterexample to (i) or (iii). The content of the physical thesis is thus revealed to be dependent on the physics of information retrieval, not just information processing. The defender of the physical thesis must concede that if supertasks are physically possible *and* readable, the thesis is false. But they can argue that readout is physically impossible. This saves the thesis by tying it to the limits of measurement, not just dynamics.

  The cost is admitting that the thesis is contingent on specific physical constants (like the Planck length), not a logical truth. Furthermore, the colleague's inference assumes that completing steps equals deciding. But if the machine enters a state representing "halt" at step infinity, and step infinity is never reached in discrete time (only as a limit), the state is never actually occupied. The machine approaches the answer but never holds it. This topological gap saves the physical thesis even if the dynamics allow acceleration. The defender must argue that physical states must be stable and accessible, not just asymptotic. The accelerating machine shows that physical computability depends on the interface between dynamics and measurement. It forces the defender to refine the physical thesis: not only must the process be bounded, but the result must be extractable within the limits of physical observation. This refinement preserves the thesis but acknowledges its dependence on the structure of spacetime and measurement theory, separating it firmly from the mathematical thesis which remains untouched by such physical contingencies.

  - Verdict

  My verdict is that the mathematical thesis (i) is the substantive core, and its status is that of a successful explication. It is not a mere abbreviation, because it organizes the pre-theoretic notion of algorithm into a rigorous framework that supports proof and analysis. A mere abbreviation would not enable the discovery that diverse formalisms coincide. The work it does is constitutive: it defines the object of study for computer science. By treating it as a definition, we gain clarity and rigor, but we pay the price of separating computation from physical possibility. The physical thesis (ii) is a contingent empirical hypothesis, likely true in our universe but not necessarily so. It should not be conflated with the mathematical thesis. The cognitive thesis (iii) is a biological claim, likely true but irrelevant to the foundations of logic.

  The substantive work is done by (i). Treating it as a definition risks dogmatism, but treating it as an empirical claim risks instability. The best position is to view it as a normative standard for proof. We give up the hope that logic dictates physics, but we secure the integrity of mathematics. The Church–Turing thesis is ultimately a claim about the limits of human reasoning formalized, not a claim about the limits of the universe. To treat it as a definition is to acknowledge that "computability" is a concept rooted in human finitude. The price is accepting that hypercomputation might be physically possible but mathematically irrelevant. We preserve the thesis by restricting its scope to effective procedures, leaving physics free to surprise us without undermining logic. This position safeguards the foundations of computer science against physical contingencies while allowing physics to explore non-Turing phenomena without logical contradiction. The thesis stands as a triumph of conceptual clarity, defining the limits of what we can know through procedure, even if the universe can do more.
