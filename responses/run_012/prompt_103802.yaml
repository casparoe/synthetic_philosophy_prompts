prompt: |-
  hey, so im in a high school philosphy club and next month im running the meeting on emotions. the thing we keep getting stuck on is the basic question of what an emotion actually IS — like when im scared of something, is the fear a judgment im making about danger, a perception of danger (like seeing that its dangerous), or just the feeling in my stomach?

  im gonna hand out a quiz at the club, sort of a which theory of emotions do you actually hold thing, and i want you to help me write it. please act like an expert in philosophy of mind and affective science, and think carefully before writing. maybe start by brainstorming the actual positions that are out there and pinning down where they disagree, then build the quiz from that.

  make it 8 questions. each question should be a concrete little case (2 or 3 answer options), and the options should be phrased so nobody can tell which theory an answer points to — no question can just be like do you think fear is a judgment? cus then everyone picks the label they already like. i want it to sort people by what they actually say about the cases.

  some positions i definately want as possible results (you can phrase them by their content, i dont need fancy names):
  - emotions are evaluative judgments, i.e. having the emotion just is judging that something is good or bad or dangerous
  - emotions are perceptions of value, like seeing a color — they present stuff as dangerous, and they can come apart from what you believe
  - emotions are just bodily feelings (racing heart, gut feeling) and the evaluation bit isnt essential
  - emotions are a combo: a raw bodily feeling plus a label or interpretation you slap on it
  - emotions are basically urges / action tendencies (fear = the urge to run)
  - emotions are built up by culture and language, so you can only have the ones your language gives you words for

  please build in these cases somewhere: being scared on a plane even though you know its safe; whether a dog or a baby can really be afraid or only feel something; the same racing-heart feeling in a haunted house vs before a job interview; someone who says they feel nothing but still acts scared; and a language that has a word for a feeling english doesnt have.

  then give me a scoring key that maps answer patterns onto the positions. also, for each position, note which combos of answers are basically empty and say why — is it incoherent, just unattractive, or has nobody even tried it? and flag any two positions my quiz cant really tell apart.

  no citations or reading lists please, i cant look anything up anyway and i just want the quiz itself. thanks!!
