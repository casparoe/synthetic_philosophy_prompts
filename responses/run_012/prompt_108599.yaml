      *   **Task:** Examine the pair of images as arguments. Map correspondences (seed, soil, gardener, press-frame, craftsman, timber, plank, standard). Identify where each image breaks. Analyze passivity (carpentry) vs. preformation (horticulture). Assess whether each thinker's account fits their picture. Evaluate which conclusions the images can support (tutor: upbringing lets something out; headmaster: goodness imposed from outside, impulses broken). Identify what survives vs. what was carried by the picture. Suggest a third image if better.
