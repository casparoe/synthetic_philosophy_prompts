answer: |-
  Dear Friend,

  Your intuition is sharper than most scholarly commentaries I have read on this subject, and you have put your finger on the exact nerve of the dispute. You are right to suspect that the quarrel between your tutor and your headmaster is being carried by the weight of their metaphors rather than the substance of their philosophy, and it is entirely possible for the headmaster to win the argument in the scene simply because the image of the carpenter is more imposing than the image of the gardener. The carpentry metaphor suggests authority, precision, and hard reality, while the gardening metaphor can sound soft, passive, or merely permissive. However, when you examine the mechanics of these images as arguments, you will find that they smuggle in assumptions that neither Mencius nor Xunzi would fully endorse, and this discrepancy is where the dramatic tension of your scene truly lies.

  To see how the images do the work, we must first map the correspondences explicitly. In the tutor's horticultural picture, the seed corresponds to the innate moral tendency, the specific potential for goodness that exists at the very beginning. The soil and water correspond to the basic conditions of life and education, the environment that must be adequate but not intrusive. The gardener is the teacher, whose primary role is protective rather than creative, and the frost represents external corruption or neglect that threatens to kill what is already alive. The finished plant corresponds to the virtuous adult, whose shape is determined internally by the seed rather than externally by the gardener. In the headmaster's carpentry picture, the timber corresponds to human nature, which is given but flawed. The warp in the wood corresponds to selfish desires and chaotic impulses. The craftsman is the teacher or ruler, who possesses the knowledge of the true line. The press-frame and the steam correspond to discipline, punishment, and rigorous ritual training. The standard the carpenter works to is the external measure of ritual propriety, a straight edge that exists independently of the wood itself. The finished plank is the virtuous adult, whose shape is imposed from the outside and who would not possess this straightness without the carpenter's intervention.

  The reason the headmaster wins the case by picture rather than argument is that the carpentry image assigns a total passivity to the material that makes resistance seem futile. Wood does not fight back when it is steamed or planed; it simply yields or breaks. If your headmaster treats the boy as timber, then the boy's resistance is merely a sign of the warp being stubborn, justifying even greater pressure. This is where the image breaks against Xunzi's actual philosophy. For Xunzi, human nature is not inert material waiting to be shaped; it is active energy, a bundle of desires and emotions that seek satisfaction. When Xunzi speaks of straightening the wood, he does not mean destroying the wood's capacity to function, but rather transforming its raw state into something useful through artifice. Your headmaster's conclusion that impulses must be broken rather than fed relies on the idea that the wood has no valid direction of its own. But if nature is active energy rather than passive timber, then breaking the impulses might destroy the vitality required for virtue. Xunzi wants to redirect desire through ritual, not extinguish it, whereas the carpentry image suggests that the original form of the wood is useless and must be cut away to fit the standard. The image supports the headmaster's harshness, but the philosophy requires a transformation that the student must eventually internalize, not just a straightening that remains external coercion.

  Conversely, the tutor's image breaks on the issue of effort and preformation. The horticultural picture assigns a preformation to the seed that implies the outcome is guaranteed if only the frost is kept away. This supports the tutor's claim that a decent upbringing merely lets something already present come out. However, Mencius acknowledges that the sprouts can be lost even without external frost; they require active seeking and cultivation, not just protection. A gardener does more than keep off the frost; he prunes, he trellises, he weeds. If the tutor argues that his job is only to protect, he is using the image to justify a lack of intervention that Mencius would not accept. The seed image suggests that the moral shape is internal and inevitable, which undermines the necessity of the teacher's authority. In your scene, if the boy is stealing, the tutor's image struggles to explain why a sprout would produce such a weed unless he blames the soil entirely. The image forces him into a position where he must deny the boy's agency in the theft, viewing it as a symptom of environmental failure rather than a choice, which may make him appear naive to the headmaster.

  When you ask which parts of their conclusions survive once the disanalogies are on the table, you find that the tutor's claim that goodness comes from within survives, but his claim that the teacher merely protects does not. Moral feeling may be innate, but it requires active cultivation, not just passive shelter. The headmaster's claim that goodness requires external structure survives, but his claim that impulses must be broken does not. Ritual imposes a form, but if it merely breaks the spirit rather than reshaping the desires, it produces compliance rather than virtue. The part of the headmaster's conclusion carried entirely by the picture is the idea that the material is inert and resistant only through flaw. The part of the tutor's conclusion carried by the picture is the idea that growth is automatic and interference is harmful. Both characters are using their images to simplify the labor of teaching: the tutor to minimize his authority, the headmaster to maximize his control.

  If you are looking for a third image that might do the work better than either, something that captures the active force of nature without conceding that it is inherently good, you might consider the image of channeling a river. In this picture, human nature is the water, which has its own powerful momentum and direction. It is not inert like wood, nor does it contain a preformed tree like a seed. The water wants to flow, and if left entirely to itself, it may flood and destroy, which aligns with Xunzi's fear of unchecked desire. However, it also has a natural tendency to flow downward, which aligns with Mencius's sense of direction. The teacher is the engineer who builds the banks and the channels. The banks correspond to ritual and discipline, which constrain the water, but the purpose of the banks is not to stop the water or break its force, but to guide it so it can turn a mill or irrigate a field. If you break the water's flow, you create a stagnant pond or a destructive flood; if you build no banks, you create a swamp. This image buys you an acknowledgment of the energy of the student's impulses, validating the headmaster's concern about disorder, while refusing his conclusion that the impulses must be broken. It costs you the simplicity of the other two images, as river management requires constant vigilance and an understanding of the water's own logic, not just the imposition of a straight edge.

  For the scene you are writing, this analysis suggests that the headmaster is winning because his image of the carpenter allows him to treat the boy's theft as a structural failure of the wood that requires force to correct, whereas the tutor is forced to treat it as a disease of the environment that requires patience to cure. The headmaster's image makes him look like a man of action dealing with reality, while the tutor looks like a dreamer waiting for nature to fix itself. You can deepen the conflict by having the tutor realize that his image of the gardener requires more than just protection, that he must sometimes prune, while the headmaster might be challenged on whether his straightened plank is still alive or merely dead wood that looks straight. The quarrel is indeed between a gardener and a carpenter, but the truth of the academy lies in recognizing that the student is neither a plant nor a plank, but something that grows only when its wild energy is guided rather than suppressed or ignored. If you let the headmaster rely on the passivity of the wood, you expose his philosophy as brittle, and if you let the tutor rely on the inevitability of the seed, you expose his philosophy as fragile. The scene will resonate most if both men are shown to be partially right about the nature of the boy, but trapped by the limitations of the tools they have chosen to describe him.

  I hope this helps you navigate the argument without getting lost in the scholarship. You have already grasped the most important thing, which is that metaphors are not just decorations for arguments; they are the engines that drive them. Watch which engine is running in your scene, and you will know who is truly in control.

  Yours sincerely,

  A Correspondent
