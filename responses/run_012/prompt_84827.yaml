answer: |-
  An Intellectualist and a Rylean are belaying their colleague, a card-carrying Intellectualist and serious climber, who is working a difficult route. The colleague freezes at the crux, hangs for a moment, and then plummets into the pads.

  They walk over to where he's lying.

  **Rylean:** "Well, you didn't know how to climb that pitch."

  **Intellectualist:** "False. I knew of the way to hold that crimp, that it was a way for me to hold it."

  **Rylean:** "Then why are you on the ground?"

  **Intellectualist:** "Performance error. I possessed the propositional knowledge under a practical mode of presentation, but I failed to instantiate it."

  **Rylean:** "But to instantiate it, didn't you need to know *how* to apply the proposition?"

  **Intellectualist:** "No, I just needed to consider it practically."

  **Rylean:** "And did you know *how* to consider it practically?"

  **Intellectualist:** "..."

  **Rylean:** "Because if you needed to know *that*, you've got a regress. And if you didn't, you've got a brute know-how. Either way, you're mine."

  **Intellectualist:** *Gestures to the injured ankle.* "This is the Coach Case. I still know how to climb the route; I just lack the physical ability to manifest the knowledge."

  **Rylean:** "You're not coaching. You're bleeding."

  **Intellectualist:** "Precisely. I know *that* bleeding is a way to end the seminar. And look—I'm doing it perfectly."
