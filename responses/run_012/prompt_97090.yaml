answer: |-
  You have identified a genuine gap in the taxonomy. The pattern you describe is widely practiced in nosology (the classification of disease) and health policy, yet it lacks a canonical name in the philosophy of medicine.

  The standard distinctions you mentioned do not capture it:
  *   **Disease vs. Illness:** This distinguishes biological fact (disease) from subjective experience (illness). Your observation is more radical: you are noting that the *biological label itself* ("disease") shifts based on external factors, not just the experience of it.
  *   **Naturalism vs. Normativism:** Naturalists (like Boorse) argue disease is value-free biological dysfunction. Normativists argue it is value-laden. Your point is more specific than "value-laden"; it is that the label is contingent on *capacity* (can we fix it?) and *context* (does it matter to this person?).
  *   **Medicalization:** This describes the *process* of expanding medical categories, but it is usually a sociological critique rather than a definition of the *criteria* used at the policy desk.

  The closest existing framework is **Jerome Wakefield's "Harmful Dysfunction"** analysis. He argues a disorder requires (1) a biological dysfunction and (2) harm (a value judgment). Your second criterion (thwarting aims) maps to "harm." However, Wakefield's framework fails your first criterion: for Wakefield, an untreatable harmful dysfunction (e.g., Huntington's disease) is still a disease. Your observation suggests that in *policy and coding*, untreatable deviations often lose their disease status and become "variations" or "risk factors" unless an intervention exists.

  There is also the bureaucratic term **"Clinical Utility,"** used in the DSM and ICD committees. This dictates that a diagnosis should only be included if it aids clinical decision-making (implying treatability) and identifies a problem (implying harm). However, "Clinical Utility" is a procedural justification, not a philosophical concept describing the ontological status of the condition.

  ### The Proposal: Action-Conditional Pathology

  Since no single canonical term captures the conjunction of (a) remediability and (b) goal-frustration as the *determinants* of the disease label, I propose naming this phenomenon **Action-Conditional Pathology**.

  **Definition:**
  A bodily state is assigned the status of "disease" (for the purposes of coding, recognition, and resource allocation) if and only if:
  1.  **Interventional Capacity:** There exists a recognized medical technology or protocol capable of altering the state; **AND**
  2.  **Teleological Interference:** The state obstructs the specific agent's valued ends or vital goals.

  Where either condition is absent, the state is re-categorized as a "trait," "variation," "risk factor," or "normal aging," even if the underlying biology remains identical to a recognized disease.

  ### How It Differs from Existing Concepts

  | Concept | Why It Fails to Fit Your Pattern |
  | :--- | :--- |
  | **Disease vs. Illness** | Assumes "Disease" is a fixed biological reality. Your pattern shows "Disease" is a fluid administrative status. |
  | **Harmful Dysfunction** | Requires dysfunction + harm. Does not require *treatability*. (e.g., ALS is a harmful dysfunction even if untreatable). Your pattern suggests treatability is a *precondition* for the label in policy contexts. |
  | **Social Construction** | Too broad. Implies *any* social factor (stigma, culture) shapes the label. Your pattern isolates two specific functional factors: *tools* and *aims*. |
  | **Statistical Abnormality** | You already noted this. The statistics don't change; the label does. |

  ### Boundaries and Edges

  To ensure this concept has "carving" power, we must define where it applies and where it breaks.

  **1. Where the Pattern Holds (The Domain of Action-Conditional Pathology)**
  This phenomenon dominates **threshold conditions** and **functional deviations**.
  *   **Hypertension:** Before antihypertensives, high BP was "essential hypertension" (inevitable aging). Once drugs existed, it became a "disease" requiring coding and payment. The biology didn't change; the *actionability* did.
  *   **Infertility:** Biologically identical reproductive systems are "diseased" in a person seeking pregnancy (aim frustration + IVF exists) and "normal" in a person who is child-free (no aim frustration).
  *   **Short Stature:** Before growth hormone, short stature was a trait. With GH, it became "Growth Hormone Deficiency" (a disease) for those who sought treatment to meet height norms.
  *   **ADHD:** The same behavioral profile is a "disorder" in a classroom setting (thwarts aim of schooling) but may be a neutral or advantageous trait in a different context (e.g., certain entrepreneurial or high-risk roles), provided the context shifts the "harm" calculation.

  **2. Where the Pattern Breaks (The Exceptions)**
  There are conditions whose disease status *does not budge* regardless of treatment or aims. These are **Existential Threats**.
  *   **Metastatic Cancer / Sepsis / Rabies:** These retain the "disease" label even if untreatable (failing criterion A) and even if the patient does not wish to be treated (failing criterion B, via refusal).
  *   **Why?** Because the "aim" of survival is presumed universal in medical ethics (paternalism). When a condition threatens the *possibility* of having aims (death), the "goal frustration" criterion is satisfied by default, and the "remediability" criterion is waived because the threat is categorical, not threshold-based.

  **3. Superficially Similar Cases That Do Not Fit**
  *   **Asymptomatic Carriers:** A person carrying a gene for a lethal untreatable disease (e.g., Tay-Sachs carrier) is not "diseased." This fits Action-Conditional Pathology (no aim frustration *yet*, no intervention to change carrier status).
  *   **Cosmetic Variations:** A cleft lip is a structural deviation. If surgery exists (Criterion A met), is it a disease? Only if the patient/parent perceives it as thwarting social aims (Criterion B). If they view it as a cultural marker, policy often struggles to code it as "medically necessary." This fits the model perfectly.

  ### Why This Distinction Matters for Policy

  You noted you care about the carving. Here is why **Action-Conditional Pathology** is the correct carve:

  1.  **It explains coding inflation.** As technology expands (Criterion A), more variations become diseases. This is not just "medicalization" (which implies corporate greed); it is a logical consequence of Action-Conditional Pathology. If the tool exists, the deviation becomes a problem.
  2.  **It explains coverage denials.** Insurers often deny coverage for conditions that are "real" biologically but lack "clinical utility" (Criterion A) or where the patient's goals are deemed non-essential (Criterion B).
  3.  **It prevents category errors.** It stops us from arguing whether a condition is "really" biological. It acknowledges that the *disease label* is a tool for resource allocation, not a map of nature.

  ### Summary

  You have not found a name because the philosophy of medicine is still largely debating whether disease is *real* (Naturalism) or *constructed* (Normativism). You are operating at a more sophisticated level: you are observing that disease is **operational**.

  The concept is **Action-Conditional Pathology**.
  *   **Nearest Neighbor:** Clinical Utility (bureaucratic) / Harmful Dysfunction (philosophical).
  *   **Key Differentiator:** It makes *treatability* a necessary condition for the disease label in threshold cases, which traditional philosophy denies.
  *   **Boundary:** It applies to *threshold deviations* (BP, height, fertility, behavior) but yields to *existential threats* (cancer, trauma) where survival overrides individual aims and treatability requirements.

  This gives you a term that allows you to say: *"This isn't a biological dispute; it's a case of Action-Conditional Pathology. The biology is stable, but the actionability has shifted."*
