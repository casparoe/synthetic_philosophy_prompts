prompt: |-
  You're a philosopher-historian with real expertise in the theory of moral change — the literature on how whole societies come to abandon practices they'd taken for granted for centuries. Think carefully and slowly here, and start by brainstorming before you commit, because what I'm actualy after is a judgement call and I'd rather watch you reason your way to it than get a list.

  Context: I'm a philosophy professor. I've got a small pot of money for a three-year project — me plus two postdocs, one of whom is really a historian and the other works on ethics — and the topic is how moral revolutions happen. The framing everyone reaches for is: did slavery and dueling and footbinding end because the arguments finally won, or because interests shifted, or because of honor — i.e. someone managed to make the practice shameful to the very people who practiced it? You know the Williams grumble, that the case against slavery had been sitting there for a century and a half and didn't do the work; I can never remember which book he puts it in, so dont lean on that, but you get the target. Appiah's honor story is the other pole.

  I'm not interested in a survey of that debate, and please don't hand me a reading list or a bibliography — I know the literature roughly and I can't use one. What I want is an agenda: which open questions in this area most deserve three years and two postdocs, ranked, with the ranking defended.

  Some hunches of mine to use, attack, or ignore:

  - We've got a selection problem the size of a house. Everyone studies the revolutions that happened. Nobody studies the campaigns that failed, or the practices that are still ticking along. If the question is what makes the difference, the failures are the whole ballgame — and I suspect they're also where the methodology falls apart (how do you count a failed campaign? when is a norm "still going" as opposed to "on the way out"?).
  - I keep thinking there's a replacement condition nobody states cleanly. You can't end a practice until there's something to put in its place — you need wage labour before you can end slave labour, some legal remedy before the duel stops looking like the only recourse for an insult, some other way of being a respectable woman before footbinding goes. Is that a real mechanism or a truism people smuggle into their narratives?
  - Related: the practices that fall are often ones that constituted the identity of the people who practiced them — the duel was part of what it was to be a gentleman. So the mechanism can't just be "make it shameful," you have to hand the practitioner a new way of being what they already are, or the shame has nowhere to land. Is that distinct from the honor story or just a version of it?
  - Everyone says "argument" as if that's one thing. Rhetoric aimed at the uncommitted, arguments aimed at the perpetrators, arguments aimed at third parties who then impose costs on the perpetrators — those are different mechanisms, and I suspect the literature treats them as one.

  So: which of these questions (mine, yours, or something I'm not seeing) are upstream of the others, such that answering them would make the rest easier or moot? Which are tractable for a small team in three years and which would want a historian's decade? Which look important but wouldn't change anything downstream — the kind of thing that gets a good chapter and then nobody uses? How much of each is philosophy and how much is empirical history I'd be subcontracting? And what should I drop to make room for whatever you'd add?

  Give me a defended ordering, not a menu. Say what the criteria are, where they trade off against each other, and what evidence over the next couple of years would move something up or down the list. Finish with the one you'd bet the three years on, and say why that one and not the runner-up.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher-historian expert in moral change theory.
      *   **Task:** Create a ranked research agenda for a 3-year project (1 prof + 2 postdocs: 1 historian, 1 ethicist) on "how moral revolutions happen."
      *   **Constraints:** No reading lists/bibliographies. No survey of existing debates (Williams vs. Appiah is known context). Needs a *judgment call* with reasoning shown. Needs to address specific hunches provided by the user (selection problem, replacement condition, identity/shame, types of argument).
      *   **Output Requirements:** Defended ordering (ranking), criteria for ranking, trade-offs, tractability assessment (3 years vs. decade), philosophy vs. history split, what to drop, and a final "bet" with justification.
      *   **Tone:** Thoughtful, slow, expert, critical, collaborative (treating the user as a peer).

  2.  **Deconstruct the User's Hunches:**
      *   *Hunch 1: Selection Problem (Failures vs. Successes).* Crucial methodological point. Studying only successes leads to survivorship bias. Hard to operationalize "failure."
      *   *Hunch 2: Replacement Condition.* Functionalism. You can't abolish X without Y. Is this causal or just background condition?
      *   *Hunch 3: Identity/Shame.* Appiah's honor thesis refined. It's not just shame; it's *reconstructing* the identity that relied on the practice.
      *   *Hunch 4: Taxonomy of Argument.* Distinguishing audiences (perpetrators, bystanders, victims). Mechanism matters.

  3.  **Brainstorming & Initial Filtering (The "Slow Think" Phase):**
      *   *Goal:* Maximize theoretical payoff within 3 years with a small team.
      *   *Constraint:* A historian postdoc needs archives/cases. An ethicist postdoc needs conceptual clarity/frameworks. The PI needs synthesis.
      *   *Problem with Hunch 1 (Selection):* It's the most important *philosophically*, but the hardest *historically*. To study "failed moral revolutions" requires defining a counterfactual or finding a movement that clearly tried and failed. This risks becoming a historiographical quagmire. A 3-year project might get stuck defining "failure."
      *   *Problem with Hunch 2 (Replacement):* This feels like a necessary condition, but is it sufficient? It risks economic determinism. However, it's very tractable. You can look at the *timing* of the alternative institution vs. the demise of the practice.
      *   *Problem with Hunch 3 (Identity):* This is the heart of the Appiah/Williams tension. It's high theory but needs empirical grounding. It connects directly to the "shame" mechanism.
      *   *Problem with Hunch 4 (Argument Taxonomy):* This is conceptual housekeeping. Important, but maybe not the *driver* of the project. It's a tool, not the engine.

      *   *New Idea:* The "Mechanism of Transmission" problem. How does a norm shift in London actually reach a plantation in Jamaica or a village in China? Is it top-down (law), bottom-up (social pressure), or network-based? This bridges the historian's need for detail and the ethicist's need for mechanism.

      *   *New Idea:* The "Moral Lag" problem. Why do practices persist *after* the argument is won? (Williams' point). This connects to Identity and Replacement.

      *   *Refining the Ranking Criteria:*
          1.  **Leverage:** Does answering this unlock other questions?
          2.  **Tractability:** Can a postdoc actually do this in 12-18 months?
          3.  **Novelty:** Is this just rehashing Appiah/Williams, or does it move the needle?
          4.  **Integration:** Does it use *both* postdocs effectively?

  4.  **Developing the Ranking:**

      *   *Candidate 1: The Identity/Replacement Nexus (Hunch 2 + 3).*
          *   Why: It addresses the "how is it possible" question. If you can't be a gentleman without dueling, how do gentlemen stop dueling? You need a new script. This combines the functional (replacement) with the normative (identity).
          *   Tractability: High. Historian looks for the "new script" emerging before the "old practice" dies. Ethicist analyzes the logic of identity-constitution.
          *   Leverage: High. Solves the Williams grumble (arguments existed, but identity didn't shift).

      *   *Candidate 2: The Selection Problem (Hunch 1).*
          *   Why: Methodologically crucial.
          *   Tractability: Low. Defining "failed revolution" is a conceptual minefield. Risk of spending 3 years arguing about definitions.
          *   Decision: Demote. It's a precondition, not the main event. Make it a methodological constraint, not the primary research question.

      *   *Candidate 3: Taxonomy of Argument (Hunch 4).*
          *   Why: Clarifies mechanism.
          *   Tractability: High.
          *   Leverage: Medium. It's analytic, not explanatory.
          *   Decision: Make this the Ethicist's sub-task, not the main agenda item.

      *   *Candidate 4 (My Addition): The "Cost of Virtue" Threshold.*
          *   Why: When does it become *more* costly to uphold the old norm than to adopt the new one? This bridges interests and honor.
          *   Tractability: Medium. Requires economic/social data.
          *   Decision: Integrate into Candidate 1.

      *   *Re-evaluating the "Bet":*
          *   If I bet on the Selection Problem, I risk no output.
          *   If I bet on Argument Taxonomy, I risk triviality.
          *   If I bet on **Identity Reconstruction via Functional Replacement**, I hit the sweet spot. It explains *why* arguments suddenly start working (Williams) and *how* honor shifts (Appiah). It allows the historian to trace the emergence of alternatives and the ethicist to model the normative shift.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Ensure I sound like a colleague, not a search engine. Acknowledge the Williams/Appiah tension without rehashing it.
      *   *Structure:*
          1.  Criteria for ranking.
          2.  The Ranked Agenda (1, 2, 3).
          3.  What to drop.
          4.  The Final Bet.
      *   *Specific focus:* The "Replacement Condition" needs to be tightened. It's not just "wage labor for slavery." It's "social script for identity."
      *   *Addressing the Selection Problem:* Acknowledge its importance but flag it as a methodological trap for a 3-year window. Suggest a "controlled comparison" instead of a full "failure" study.
      *   *Addressing the Argument Taxonomy:* Frame it as the *mechanism* of the Identity shift.

  6.  **Final Polish:**
      *   Make sure the distinction between the Historian's job and the Ethicist's job is clear in the top pick.
      *   Ensure the "Why this and not the runner-up" is punchy.
      *   Check against the "philosopher-historian" persona. Use terms like "modal strength," "counterfactual," "constitutive norms."

      *(Self-Correction during drafting)*: I initially thought about putting the Selection Problem first because it's the most philosophically honest. But the prompt asks for what is *tractable* for a 3-year project. A study of failure is often a study of silence in the archives. I need to advise the Professor to protect their postdocs from that abyss. I will move it to #2 but frame it as "Negative Cases" rather than "Failures" to make it doable.

      *Wait, looking closer at the prompt:* "Which of these questions... are upstream of the others, such that answering them would make the rest easier or moot?"
      Okay, the Identity/Replacement question is upstream of the Argument question. (You can't persuade someone to abandon an identity without a new identity). The Selection question is upstream of *validity*, but not necessarily *explanation*.
      Actually, the **Identity/Replacement** nexus is the strongest candidate for the "Bet." It solves the Williams puzzle (why arguments didn't work earlier) and refines Appiah (honor isn't just shame, it's script).

      Let's refine the Ranking:
      1.  The Constitutive Replacement Thesis (Identity + Function).
      2.  The Audience Segmentation of Argument (Hunch 4).
      3.  The Methodology of Negative Cases (Hunch 1).

      Why this order?
      1 is the *explanatory engine*.
      2 is the *transmission mechanism*.
      3 is the *validation check*.
      You need an engine before you worry about validation.

      Okay, ready to write.

  7.  **Final Review against constraints:**
      *   No bibliography? Check.
      *   Defended ordering? Check.
      *   Criteria stated? Check.
      *   Trade-offs discussed? Check.
      *   Evidence to move up/down? Check.
      *   Final bet? Check.
      *   Tone? Philosophical, historical, pragmatic.

      *One last thought:* Make sure to explicitly address the "philosophy vs. empirical history" split in the top recommendation. The Historian traces the *emergence* of the alternative script. The Ethicist analyzes the *normative structure* of that script.

      *Let's go.*
answer: |-
  This is a delicate design problem. You have a limited runway (three years), a specific team composition (theory + archives), and a field cluttered with high-level abstractions that often dissolve upon contact with the archival record. You are right to be suspicious of the "success bias" in the literature, but you are also right to worry about the methodological黑洞 (black hole) of studying failure.

  Here is my reasoning process for ranking the agenda, followed by the defended ordering.

  ### Criteria for Ranking
  I am judging these potential projects against three constraints specific to your situation:
  1.  **Archival Tractability:** Can a postdoc actually find evidence for this in 18 months, or will they drown in interpretive ambiguity?
  2.  **Theoretical Leverage:** Does answering this dissolve the Williams/Appiah stalemate, or does it just add nuance to it?
  3.  **Integration:** Does the question force the historian and the ethicist to talk to each other, or will they write parallel monographs?

  ### The Ranked Agenda

  #### 1. The Constitutive Replacement Thesis (Refining Hunches 2 & 3)
  **The Question:** *Is the end of a moral practice causally dependent on the prior existence of a viable alternative identity-script, not just an alternative economic or legal function?*
  **Rank:** **First (The Core Engine)**

  **Defense:**
  This is the upstream question. If Williams is right that arguments sat dormant for a century, something else had to change to activate them. If Appiah is right that honor drives the change, we need to know *what* becomes honorable. Your hunch about "replacement" is usually framed economically (wage labor for slavery), but I suspect the real mechanism is *normative*. A gentleman cannot stop dueling until there is a way to be a "respected man" that does not involve violence. A footbinding mother cannot stop until there is a way to be a "good mother" that does not involve bound feet.

  This is the bet because it bridges the historian's need for chronology and the ethicist's need for conceptual structure.
  *   **The Historian's Task:** Don't just look for the end of the practice. Look for the *emergence* of the alternative script. Did the "non-dueling gentleman" appear in print *before* dueling declined? Did the "natural-footed respectable woman" exist as a social category before the ban? We need to date the *availability of the identity*, not just the illegality of the act.
  *   **The Ethicist's Task:** Analyze the structure of these scripts. Is the new identity a *substitute* (doing the same social work differently) or a *dissolution* (making the social work irrelevant)? This distinguishes between functional replacement and moral progress.

  **Why it's #1:** It solves the Williams grumble. Arguments didn't work earlier because the *social ontology* required to hear them didn't exist. You can't be persuaded to abandon a constitutive norm of your identity until you have a new identity to inhabit. This makes the "argument" variable dependent on the "identity" variable.

  **Evidence to move it up:** If the historian finds a tight temporal correlation between the codification of the new identity script and the sharp decline of the practice (lagging by less than a generation).
  **Evidence to move it down:** If we find cases where the practice ended *before* a stable alternative identity was formed (e.g., via brute force or collapse), suggesting replacement is a post-hoc rationalization.

  #### 2. Audience Segmentation in Moral Argument (Refining Hunch 4)
  **The Question:** *Which audience threshold triggers the cascade: the perpetrators, the beneficiaries, or the bystanders?*
  **Rank:** **Second (The Transmission Mechanism)**

  **Defense:**
  This is downstream of #1. Once the alternative identity exists (Project 1), how does it spread? The literature treats "public opinion" as a monolith. It isn't.
  *   **Perpetrators:** Need the identity script (Project 1).
  *   **Beneficiaries:** Need economic/legal cover.
  *   **Bystards:** Need to be willing to impose social costs (shame).

  This is rank #2 because it is highly tractable for a small team but risks being merely descriptive. It tells us *how* the revolution traveled, not *why* it became possible. However, it is essential for the "honor" story. Appiah's mechanism relies on bystanders withdrawing respect. We need to know if that withdrawal happens *before* or *after* the legal change.

  **Philosophy/History Split:** The ethicist maps the logical dependencies (does bystander shame require perpetrator recognition?). The historian tracks the vector of the rhetoric (pamphlets aimed at slaves vs. pamphlets aimed at voters).

  **Why it's not #1:** It presupposes that the argument *can* work. Project 1 explains why it suddenly *could*. Project 2 explains the diffusion. Explanation precedes diffusion.

  #### 3. The Methodology of Negative Cases (Refining Hunch 1)
  **The Question:** *How do we operationalize "failed moral revolution" without falling into counterfactual speculation?*
  **Rank:** **Third (The Validation Check)**

  **Defense:**
  You are absolutely right about the selection problem. It is the biggest hole in the theory. However, I am ranking it third because it is a methodological trap for a three-year grant. Defining "failure" is notoriously difficult. Is a practice that declines by 50% a failure? Is a movement that fails to ban a practice but succeeds in regulating it a failure?
  If you make this the *primary* focus, your postdocs will spend two years defining terms and arguing about case selection.

  **The Compromise:** Do not study "failures." Study **asynchronous declines**. Compare two similar practices in the same era where one fell and one persisted (e.g., dueling vs. blood feuds; footbinding vs. corsetry). This gives you the control group you want without the metaphysical headache of defining a "failed revolution."

  **Why it's not #1:** It is a check on the theory, not the theory itself. You need a theory to test before you build the testing ground.

  ### What to Drop
  **Drop the search for the "First Argument."**
  There is a temptation to dig for the "first time someone said slavery was wrong." This is intellectually seductive but explanatorily weak. As you noted, Williams' point is that the argument existed and did nothing. Searching for earlier iterations of the argument is diminishing returns. The causal weight isn't in the *invention* of the argument, but in the *reception* conditions (Project 1).

  ### The Philosophy/History Split
  For the top project (Constitutive Replacement), the split must be tight:
  *   **Historian:** Responsible for *dating*. When does the alternative identity appear in the archive? Is it a fringe idea or a published script?
  *   **Ethicist:** Responsible for *structure*. Is the new identity logically compatible with the old practice, or does it entail its negation?
  *   **PI:** Responsible for *causality*. Connecting the date of the script to the date of the decline, controlling for economic/legal factors.

  ### The Final Bet

  **I would bet the three years on Project 1: The Constitutive Replacement Thesis.**

  **Why this and not the runner-up (Audience Segmentation)?**
  Audience Segmentation is a mechanism of *transmission*. Constitutive Replacement is a mechanism of *possibility*.

  If you solve Audience Segmentation, you know how the fire spread. If you solve Constitutive Replacement, you know why there was fuel to burn in the first place. The Williams grumble ("the argument was there for 150 years") is the central puzzle of this field. The only way to answer it is to show that the *conditions of intelligibility* changed, not the arguments.

  If your team can demonstrate that moral revolutions are actually **identity revolutions**—where the practice ends not because it is refuted, but because the *person* who does it ceases to exist as a social category—you will have moved the field beyond the "ideas vs. interests" stalemate. You will have shown that interests and ideas are both downstream of *social ontology*.

  That is a three-year payoff. Audience segmentation is a journal article; Constitutive Replacement is a paradigm shift.

  **Risk:** The historian might not find the "script" in the archives before the decline.
  **Mitigation:** Broaden the definition of "script" to include legal codes, fashion plates, or conduct manuals—anywhere the "new way of being" is codified. If the historian strikes out, you pivot to Project 3 (Asynchronous Decline) to see if the lack of a script explains the persistence of the other practice. But start with the bold claim.
