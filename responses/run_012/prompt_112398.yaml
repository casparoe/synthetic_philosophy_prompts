answer: |-
  **Project Title:** The Normative Availability of Ignorance: A Formal Analysis of the Value of Information

  **Project Summary**
  This six-month project investigates a foundational assumption in decision theory: that free information always has non-negative expected value. While standard proofs (e.g., Good 1967) demonstrate that a rational agent can always ignore irrelevant information, these proofs rely on an ambiguity between the *physical availability* of an action and the *epistemic permissibility* of deliberating on outdated evidence. I propose to construct formal models to determine whether the non-negativity result holds when agents are bound by a strict Principle of Total Evidence that prohibits "ignoring" information during deliberation. The goal is to distinguish between genuine limits on the value of information and artifacts of decision-problem mis-specification.

  **Research Question**
  The central question is: *Under what formal conditions does the expected value of free information remain non-negative when the agent is normatively prohibited from excluding that information from their deliberative basis?*

  This question admits a determinate answer. Either (a) the non-negativity theorem holds solely because the act-set includes a "do what the prior suggested" option, regardless of evidential norms, or (b) the theorem fails when the agent is forced to maximize expected utility relative to the posterior probability function, even when that prescription conflicts with the prior-optimal act. I aim to derive a necessary and sufficient condition for the preservation of the non-negativity result in the presence of mandatory updating.

  **The Conceptual Gap**
  Standard formulations of the value-of-information theorem argue that information is never harmful because the agent can always choose the action they would have selected had they remained ignorant. This argument conflates two distinct senses of "can."
  1.  **Act-Set Availability:** The physical action corresponding to the prior-optimal choice remains in the agent's repertoire.
  2.  **Evidential Availability:** The agent is permitted to deliberate using the prior probability distribution rather than the posterior.

  Standard proofs assume that if (1) is true, the agent can secure the prior-optimal expected utility. However, if rationality requires maximizing expected utility relative to current evidence (the Principle of Total Evidence), then (1) does not guarantee the agent *will* or *should* choose the prior-optimal act once information is received. If the new information shifts probabilities such that the prior-optimal act is now suboptimal, a rational agent is compelled to switch. If this switch leads to a lower ex-ante expected utility (due to structural features of the decision problem, such as dynamic inconsistency or evidential constraints), the value of information could be negative. Current literature leaves open whether this scenario represents a failure of the theorem or a mis-specification of the decision problem.

  **Methodology**
  The project will proceed in two phases over six months.

  *Phase 1: Formal Modeling (Months 1–3)*
  I will construct decision-theoretic models comparing two agent types: the *Flexible Deliberator* (who may choose to maximize relative to the prior or posterior) and the *Strict Updater* (who must maximize relative to the posterior). I will define the "Value of Information" as the difference in ex-ante expected utility between receiving the signal and remaining ignorant.
  The models will isolate variables regarding act-set restrictions and evidential norms. Specifically, I will test whether the non-negativity result collapses when the "ignore" option is removed from the deliberative procedure, even if it remains in the physical act-set.

  *Phase 2: Case Analysis and Artifact Testing (Months 4–6)*
  I will apply these models to carefully chosen cases where information appears harmful (e.g., scenarios involving pre-commitment or Newcomb-like dependencies). Crucially, I will employ a "Mis-Specification Test" to determine if negative value is genuine or an artifact.
  *   **The Test:** If the negative value arises solely because a constraint (e.g., "you must update") was modeled as a hard rule rather than a utility cost, the result is an artifact. If the negative value persists when the constraint is treated as a constitutive norm of rationality (i.e., the agent *cannot* maximize relative to the prior without being irrational), the result is genuine.
  I will distinguish these by checking whether the "cost" of information can be absorbed into the utility function without altering the preference ordering over outcomes. If it can, the puzzle is merely one of accounting. If it cannot, the puzzle reveals a structural tension between evidential norms and instrumental rationality.

  **Success and Failure Conditions**
  *   **Success:** The project succeeds if it produces a formal theorem specifying the exact conditions under which mandatory updating negates the value-of-information result, accompanied by a clear criterion for distinguishing normative constraints from utility costs. A successful outcome might show that the distinction between "ignorable" and "unignorable" information collapses into a distinction between "acts compatible with posterior maximization" and "acts incompatible with posterior maximization."
  *   **Failure:** The project would fail if the analysis demonstrates that all apparent counterexamples are reducible to mis-specified utility functions (i.e., the "cost" of knowing is always representable as a standard disutility). While this resolves the puzzle, it would do so by dissolving the philosophical distinction I aim to investigate. Alternatively, failure would result if the formal models prove intractable within the six-month timeframe.

  **Scope and Feasibility**
  Six months is insufficient for a general theory of information value. Therefore, the scope is restricted to **static, one-off decision problems**. I will not address iterative learning, long-term epistemic planning, or the computational costs of processing information. The focus is strictly on the moment of reception and the immediate normative obligation to update. This narrow scope ensures that the formal models remain tractable and the philosophical analysis remains precise. If the "Mis-Specification Test" proves too complex, I will prioritize the formal derivation of the conditions for non-negativity under mandatory updating, as this alone provides a determinate answer to the core conceptual ambiguity.

  **Conclusion**
  This project addresses a gap in the foundations of decision theory by rigorously testing the robustness of the non-negativity theorem against evidential norms. By clarifying whether the ability to "ignore" information is a matter of action availability or normative permission, the project will contribute to a more precise understanding of the relationship between rational belief and rational choice.
