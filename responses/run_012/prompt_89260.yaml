answer: |-
  Here is your Q&A prep sheet. I have ordered these by **damage potential**, starting with the objection that threatens to collapse your entire analogy.

  ### The "Hope Nobody Asks" Question
  **You are right to be worried.** This is the highest-damage objection because it turns your central analogy (intrapersonal aggregation is unproblematic) against you. If you cannot defend why intrapersonal aggregation is permissible without invoking a "further fact" about personal identity, your claim that metaphysics does no work collapses.

  ---

  ### 1. The Prudence Objection (The "Proves Too Much")
  **Who:** The Parfit Person (or the Kantian Constructivist)
  **The Question:** "You argue that because we aggregate across time-slices within a life, metaphysical distinctness shouldn't block aggregation across persons. But doesn't this prove too much? If the metaphysical boundary doesn't matter for aggregation, then on a reductionist view, *prudence* becomes just another form of interpersonal aggregation. Are you prepared to say that sacrificing a present time-slice for a future one is morally equivalent to sacrificing one person for another? If not, you need a metaphysical difference to ground the distinction."
  **Damage:** **Critical.** It attacks the coherence of your premise.
  **2-Minute Reply:** Distinguish the *justification* for aggregation from the *metaphysics* of the relata. I am not claiming prudence and altruism are morally identical. I am claiming that the *numerical distinctness* of persons is not the *reason* prudence is allowed and sacrifice is forbidden. Prudence is justified by the unity of agency or rational planning (moral/functional facts), not by a soul-like further fact. If the objection is that we need *some* boundary, I agree—but that boundary is moral (agency), not metaphysical (identity).
  **Soft Spot:** If they press that "unity of agency" *just is* a metaphysical claim, you risk semantic stalemate.
  **Concession:** Concede immediately that reductionism makes the *line* between intra- and interpersonal blurry. Your point is that even if the line exists, the *mere existence* of the line (metaphysics) isn't what does the normative heavy lifting.

  ### 2. The Reductionist Trap
  **Who:** The Parfit Person
  **The Question:** "If you accept Parfit's reductionism, the 'separateness of persons' is less deep. But if you reject it, you're a non-reductionist. If you're a non-reductionist, then the metaphysical distinctness *is* robust. So either metaphysics doesn't matter (reductionism) or it does (non-reductionism). Which camp are you in, and does your argument survive if persons are deeply distinct entities?"
  **Damage:** **High.** Forces you into a meta-ethical corner.
  **2-Minute Reply:** I am agnostic on the metaphysics. My argument is conditional: *Even if* persons are numerically distinct in the strongest sense, that distinctness alone does not block aggregation. The utilitarian already aggregates across distinct time-slices (which are arguably as distinct as persons). Therefore, adding 'numerical distinctness' to the mix adds no *new* barrier. The barrier must come from elsewhere (rights, agency, etc.).
  **Soft Spot:** They may argue time-slices aren't "distinct" in the same way persons are.
  **Concession:** Concede you are not solving personal identity. You are analyzing the *argumentative structure* of the Rawls/Nozick objection.

  ### 3. The Authorization/Consent Objection
  **Who:** The Kantian Constructivist
  **The Question:** "You say the metaphysics does no work. But isn't the difference that I can *authorize* sacrifices within my own life through rational planning, whereas I cannot authorize sacrifices of you? That authorization condition relies on the boundaries of agency. Isn't that boundary a metaphysical fact about where one agent ends and another begins?"
  **Damage:** **Medium-High.** Offers a better explanation than Rawls, challenging your "moral premise is empty" claim.
  **2-Minute Reply:** This is exactly my point. You are offering a *moral* premise (consent/authorization), not a bare metaphysical one. I agree the objection needs this. My claim is that Rawls/Nozick often gesture at the *fact* of distinctness ("we are different people") as if it *itself* justifies the block. You are admitting the 'fact' isn't enough; you need the 'normative power to consent.' That validates my thesis: the metaphysics is idle; the morality is doing the work.
  **Soft Spot:** Distinguishing "metaphysical boundary of agency" from "moral status of agency."
  **Concession:** Grant that agency boundaries are crucial. Insist they are *normative* boundaries, not just ontological ones.

  ### 4. The "Political, Not Metaphysical" Rebuke
  **Who:** The Rawlsian
  **The Question:** "Rawls explicitly says his theory is political, not metaphysical. You are critiquing a straw man. The 'separateness of persons' in *Theory of Justice* is a social fact about cooperation, not an ontological claim about souls. You're spending 20 pages dismantling a claim Rawls didn't make."
  **Damage:** **Medium.** Challenges your exegesis and relevance.
  **2-Minute Reply:** I acknowledge Rawls's later 'political not metaphysical' turn. However, the *intuitive force* of the separateness objection, as deployed by Nozick and early Rawls, relies heavily on the analogy between social choice and individual choice. That analogy fails only if there is a disanalogy in the *units* being summed. I am arguing that the standard defense of that disanalogy relies on metaphysical distinctness, even if Rawls later tried to walk it back.
  **Soft Spot:** Textual accuracy regarding *Theory of Justice* vs. *Political Liberalism*.
  **Concession:** Concede that Rawls's *later* work avoids this. Argue that the *objection itself* (as used in the literature) still relies on the metaphysical intuition.

  ### 5. The Formula of Humanity
  **Who:** The Kantian (Humanity)
  **The Question:** "Utilitarianism treats persons as vessels for value. The separateness objection is just a shorthand for the Formula of Humanity: treat humanity as an end. Metaphysical distinctness matters because it marks the boundary of where one 'end' stops and another begins. You can't sum 'ends'."
  **Damage:** **Medium.** Standard Kantian move.
  **2-Minute Reply:** Again, you are giving me the moral premise I say is required. "Being an end" is a moral status. My argument is that proponents often say, "You can't sum because we are *two people*," implying the number does the work. I am saying the number doesn't do the work; the 'end-status' does. We agree on the conclusion; I am clarifying the argumentative path.
  **Soft Spot:** None major. This is a friendly objection.

  ### 6. The Measurement Problem
  **Who:** The Social Choice Economist
  **The Question:** "Intrapersonal utility comparison is arguably ordinal or cardinal for a single preference ordering. Interpersonal comparison requires a common metric across distinct orderings. The 'separateness' objection is actually an epistemic/measurement objection. You can't sum what you can't measure. Metaphysical distinctness creates the measurement barrier."
  **Damage:** **Low-Medium.** Technical, sidesteps the normative claim.
  **2-Minute Reply:** That is a Harsanyi/Arrow style objection, not the Rawls/Nozick one. Rawls/Nozick argue it is *wrong* to sacrifice, not that it is *impossible* to calculate. If the objection were merely measurement, a perfect utilitarian calculator would be permitted to sacrifice. The Rawlsian says no.
  **Soft Spot:** If they argue measurement is the *only* coherent version of the objection.
  **Concession:** Acknowledge measurement is hard, but insist the *moral* objection persists even if we had a utility meter.

  ### 7. The Phenomenological Boundary
  **Who:** The Parfit Person / General
  **The Question:** "I feel my pain directly. I feel yours only via empathy. There is a metaphysical fact about the privacy of experience. Doesn't that block aggregation? You can't sum what isn't co-present to a single consciousness."
  **Damage:** **Low.** Intuitive but weak against aggregation arguments.
  **2-Minute Reply:** A single consciousness also doesn't experience all time-slices co-presently. I don't feel my future pain now. Yet we aggregate across time. If lack of co-presence doesn't block intrapersonal aggregation, why does it block interpersonal?
  **Soft Spot:** The immediacy of present pain is stronger than the immediacy of future pain.
  **Concession:** None needed. This is a win for you.

  ### 8. The "So What?" (Normative Upshot)
  **Who:** The Rawlsian / Economist
  **The Question:** "Okay, say you're right. The metaphysics does no work. The objection rests on a moral premise. Does that change anything? Do we still get the Difference Principle? Do we still reject utilitarianism? Or is this just semantic housekeeping?"
  **Damage:** **Low.** Challenges the paper's significance.
  **2-Minute Reply:** It changes the dialectic. If the objection is moral, it must be argued for, not asserted as a 'fact' of nature. It forces the anti-utilitarian to defend a substantive moral principle (e.g., inviolability) rather than hiding behind 'separateness.' It exposes the moral premise to scrutiny it usually avoids.
  **Soft Spot:** If they think the moral premise is obvious.
  **Concession:** Concede the practical outcome (rejecting utilitarianism) might remain the same, but the *justification* becomes more honest.

  ### 9. The Utility Monster (Variant)
  **Who:** Anyone (if they run out of ideas)
  **The Question:** "If metaphysics doesn't block aggregation, does that mean we *should* feed the utility monster if the total goes up, provided we respect the moral premise?"
  **Damage:** **Low.** You said skip this, but be ready.
  **2-Minute Reply:** My paper explains why the *separateness objection* fails as a metaphysical block. It doesn't prove utilitarianism true. It just forces the monster's defender to argue for the moral permissibility of feeding him, rather than saying "it's obvious because they are different people."
  **Soft Spot:** N/A.

  ---

  ### Strategic Advice: The First 30 Seconds
  **The Concession:**
  When you open the floor, or when the Parfit/Rawls person speaks first, **pre-emptively concede** that Rawls and Nozick may not have intended a "deep metaphysical" reading in the scholastic sense.
  *Say:* "I am not arguing that Rawls and Nozick were bad metaphysicians. I am arguing that the *intuitive force* of their objection, as it functions in debate, relies on the audience accepting a metaphysical premise that does no logical work. I want to separate the *rhetoric* of separateness from the *morality* of inviolability."

  **Why:** This disarms the Rawlsian (who wants to say "it's political") and the Parfit person (who wants to say "identity is shallow"). You are analyzing the *argument's structure*, not the authors' souls.

  **The One to Dodge:**
  If Question #1 (Prudence/Time-Slices) comes up, do not get bogged down in defending the rationality of prudence.
  *Pivot:* "Whether prudence is rational is a separate debate. My claim is comparative: *If* intrapersonal aggregation is permissible (as we all assume for planning), the *metaphysical distinctness* of time-slices doesn't block it. So why does the *metaphysical distinctness* of persons block interpersonal aggregation? The difference must be moral, not metaphysical."
  *Keep the focus on the **gap** between the two cases, not the foundation of the first case.*
