  **The Impossibility**

  No voter gains by masking what is true.
  We seek a rule to bring the dark to light,
  One voice dictates what all the rest must do.

  Where honest ranks remain both clear and bright,
  No voter gains by masking what is true.
  Three voters face three choices in their sight,

  Yet one finds gain in swapping left and right,
  One voice dictates what all the rest must do.
  Truth yields him less than crafted, cold insight.

  With but two choices, the trap fails to bite,
  No voter gains by masking what is true.
  But three breaks open what the pair kept tight.

  The logic holds, undeniable and bright,
  One voice dictates what all the rest must do.
  For only one ruler claims the sovereign might.

  We seek a rule to bring the dark to light,
  No voter gains by masking what is true.
  We cannot keep both safeguards in our sight,
  One voice dictates what all the rest must do.

