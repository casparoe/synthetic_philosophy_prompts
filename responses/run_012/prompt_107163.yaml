  **Instructor's Note**

  The poem presents the Gibbard–Satterthwaite theorem as a settled mathematical result: under the stated conditions (unrestricted domain, at least three possible outcomes, deterministic social choice function), strategy-proofness entails dictatorship. This logical implication is not contested. However, scholars debate the theorem's normative significance. Some argue it indicts actual democratic procedures, while others contend it targets a specific formal idealization that ignores practical constraints. Proposed escapes exist but involve trade-offs: restricting the domain of admissible preferences (e.g., to single-peaked orders) avoids the result but limits expressiveness; permitting randomization (social choice *correspondences* or lotteries) circumvents the theorem but introduces ex-post inefficiency or manipulation in expectation. The poem treats the "dictator" in the technical sense (a voter whose top choice always wins) rather than the colloquial one, and it simplifies the formalism slightly for meter, particularly in the description of the manipulation scene.
