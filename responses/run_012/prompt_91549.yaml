  10. **Final Review of Tone:** Ensure it matches the intellectual density of the prompt. Use terms like "epistemic geometry," "computational asymmetry," "modularity of justification." (Proceed to generate output).

  *(Self-Correction Note during final review)*: I need to make sure I explicitly answer "Which of its assumptions are load-bearing and which are decoration?" I will create a specific section or clearly demarcate this. I also need to ensure I address the "regress" issue in recursive debate clearly.

