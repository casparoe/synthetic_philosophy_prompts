      *   *Section 2: The Judge's Paradox.* Address the Weak/Strong tension. It relies on *decomposability*. Recursive debate is the fix, but it assumes *modularity* of truth.
      *   *Section 3: Philosophical Underpinnings.* Evaluate Popper, Mill, Bayesian, Habermas. Popper is the engine. Habermas is incompatible.
      *   *Section 4: The Collapse (Obfuscation).* If asymmetry fails, what remains? It becomes an empirical heuristic.
      *   *Section 5: Repairs and Costs.* What do we add? Formal constraints, cross-examination, etc. What do we lose? Generality, speed.

  8.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* Make sure not to just say "it fails." The prompt asks what *survives*.
      *   *Nuance:* The "checking is cheaper" claim is actually about *interactive proof systems* (IP). It relies on the prover (honest) being able to guide the verifier. If the prover (dishonest) can guide the verifier into a trap, IP collapses.
      *   *Key Distinction:* Distinguish between *computational complexity* (formal) and *cognitive load* (human). The prompt highlights the human budget. This is the weak point.
