  Ask: "Who felt the token cost was unfair?" Use this to discuss the cost of experimentation. Real inquiry consumes resources. If you saved tokens, did you learn less? If you spent them all, were you safer? Connect this to research funding and policy trials.

  Finally, introduce the framework. Explain that this exercise modeled experimentalism. The 'public' was not the 16 people in the room, but the group formed around the specific consequences of the Protocol. When consequences changed, the public had to reform. This challenges the idea of democracy as merely aggregating static interests. It is instead a continuous process of learning together.

  Conclude by asking: "How does this change how you view your own research problems?" Encourage them to see their disciplines as participating in this broader experimental culture. Do not lecture on Dewey's biography; keep the focus on the mechanics they just lived. The goal is for them to recognize the pattern of inquiry in their own work. Mention that this aligns with a pragmatic view of knowledge as tool-based, not mirror-based. Emphasize that the discomfort they felt was productive. In traditional meetings, we hide uncertainty. Here, it was the engine of the activity. Remind them that the Facilitator did not know the 'right' answer either. The authority was in the process.

  6. Predictable failures and fixes
  Participants will likely show cards early. This collapses the indeterminate situation into a data exchange. Fix: Collect the cards and issue a warning. Remind them that testimony builds trust; data exchange builds factions.
  Second, they will try to vote before framing the problem. They will ask for a show of hands. Fix: Refuse to count votes. Write "Problem Undefined" on the board until they agree on a statement. This forces the inquiry phase.
  Third, they may ignore the perturbation. They will try to tweak the old solution rather than redefining the problem. Fix: Halt the discussion. Ask: "Does your problem statement still match the cards you hold?" If not, erase the board. Force them to rewrite the header.
  Fourth, dominant voices may monopolize testimony. Fix: Use the tokens. Only those holding a token may speak for 2 minutes. Pass tokens around. This distributes airtime. If the group fractures into silent factions, intervene. Mix the seating during the perturbation phase. Physical movement breaks social固化.
  Fifth, they may treat the tokens as money to be saved rather than spent on inquiry. Fix: Remind them unspent tokens yield no value. The goal is learning, not thrift. If they finish early, do not end. Ask them to stress-test the final proposal against a hypothetical new constraint.
  Finally, the debrief may turn into a lecture. Fix: Keep asking questions. If you explain too much, stop. Ask them to interpret the mechanic instead. Your role is to mirror their experience, not teach philosophy. Ensure you have spare cards ready for the perturbation phase to avoid delays.

  7. What the activity cannot reproduce
  This simulation compresses time. Real democratic inquiry takes months or years, allowing habits and institutions to form. Here, consequences are immediate and abstract. Participants cannot feel the long-term weight of a bad policy. They know it is a game.
  Also, the stakes are low. No one loses their job or funding. Real consequences generate emotional resistance and commitment that tokens cannot mimic. The 'public' formed here is temporary; real publics have history and memory.
  Furthermore, the activity cannot reproduce the habituation of democratic culture. Dewey emphasized that democracy is a way of life, not just a method. This session is a method exercise. It cannot teach the daily disposition required to sustain inquiry.
  Finally, the Facilitator's control is artificial. In reality, there is no single agent announcing changes. Chaos is more distributed. You must note that the 'Reality' role was a simplification of complex systemic forces.
  You must supply this in the debrief. Explain that in reality, the 'perturbation' might take years to arrive. The cost of premature closure is higher. The trust required to share testimony without showing cards is harder to build outside a controlled room. Acknowledge that while they felt the logic of experimentalism, they did not live the burden of it. This honesty prevents cynicism about the simulation's simplicity.
