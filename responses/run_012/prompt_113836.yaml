answer: |-
  Yes, there is a single principle that saves every one of your verdicts without forcing you to give any up. It relies on distinguishing between **stealing an asset** and **replicating a precedent.**

  ### The Principle: Behavioral Contagion vs. Asset Theft

  **"Copycat" describes the unauthorized replication of a *precedent-setting behavior* driven by *causal knowledge* of the original, where the copier seeks to harvest the *consequences* of the act without a *social license* that normalizes the repetition.**

  Conversely, terms like *plagiarism, forgery,* and *knockoff* describe the theft of a **static asset** (text, identity, brand). Terms like *cover, homage,* and *reenactment* describe replication that possesses a **social license** (cultural permission).

  To be a copycat, an act must pass three filters:
  1.  **The Causal Filter:** The copier must have known about the original. (Independent convergence is coincidence, not copycatting.)
  2.  **The Agency Filter:** What is copied must be a *strategy, method, or behavior*, not a static object or identity.
  3.  **The License Filter:** There must be no cultural or institutional framework that makes the repetition expected or legitimate.

  ---

  ### How It Saves Your Verdicts

  **1. The School Shooter (Copycat)**
  *   **Causal:** Yes (signs the name, implies connection).
  *   **Agency:** Yes (replicates the *act* of violence, not the gun itself).
  *   **License:** No (society does not license mass murder).
  *   **Verdict:** **Copycat.**

  **2. The Suicide Cluster (Copycat, if aware)**
  *   **Causal:** Yes (your condition: "if the kids had heard"). If they hadn't, it fails the Causal Filter and becomes a "cluster."
  *   **Agency:** Yes (the behavior of self-harm).
  *   **License:** No.
  *   **Verdict:** **Copycat.**

  **3. The Cover Band (Not Copycat)**
  *   **Causal:** Yes (they heard the songs).
  *   **Agency:** Yes (playing the music).
  *   **License:** **Yes.** There is a cultural and legal framework (licensing, tradition) that says songs are *meant* to be covered.
  *   **Verdict:** **Cover.** (Fails License Filter).

  **4. The Handbag (Not Copycat)**
  *   **Causal:** Yes.
  *   **Agency:** **No.** They are copying a *static object* and a brand logo, not a behavioral strategy. This is theft of design/brand equity.
  *   **Verdict:** **Knockoff.** (Fails Agency Filter).

  **5. The Plagiarized Paragraph (Not Copycat)**
  *   **Causal:** Yes.
  *   **Agency:** **No.** Text is a static asset. The violation is claiming ownership of the *words*, not replicating the *act of writing*.
  *   **Verdict:** **Plagiarism.** (Fails Agency Filter).

  **6. The Vermeer Forgery (Not Copycat)**
  *   **Causal:** Yes.
  *   **Agency:** **No.** While painting is an action, the fraud lies in the *object's provenance*. The forger is selling a fake *artifact*, not performing a public act to harvest the same consequences as Vermeer. They are stealing Vermeer's *identity*, not replicating his *career move*.
  *   **Verdict:** **Forgery.** (Fails Agency Filter).
      *   *Note on the Shooter:* You noted the shooter signs the first one's name, similar to the forger. The difference is the shooter uses the name to link the *acts* (joining a movement), while the forger uses the name to fake the *object* (selling a lie).

  **7. The Startup Feature (Copycat)**
  *   **Causal:** Yes (launched a month after).
  *   **Agency:** Yes. A software feature is a *functional behavior*. They are replicating the rival's *strategic move* to capture the same market reward.
  *   **License:** No (unless patented, but colloquially, it's unlicensed competition).
  *   **Verdict:** **Copycat.**

  **8. The Singer's Homage (Not Copycat)**
  *   **Causal:** Yes.
  *   **Agency:** Yes (style is behavioral).
  *   **License:** **Yes/No.** This is the edge case. It passes Agency and Causal, but it fails the "harvesting consequences" test. An homage acknowledges the source; a copycat implies the *validity of the move* is transferable. More importantly, style in art is considered a *language*, not a *proprietary strategy*.
  *   **Verdict:** **Homage.** (Fails License Filter—artistic style is public domain).

  **9. The Documentary Reenactment (Not Copycat)**
  *   **Causal:** Yes.
  *   **Agency:** Yes (restaging the act).
  *   **License:** **Yes.** The context is education/history. The audience consents to the replication.
  *   **Verdict:** **Reenactment.** (Fails License Filter).

  ---

  ### The Test Case: Adopting Tactics

  **Case:** A group adopts another group's tactics (method, not a specific attack).

  **Verdict:** **Copycat.**

  **Why:**
  1.  **Causal:** You specified they "adopt" them, implying they saw the first group's success and chose the method *because* of it.
  2.  **Agency:** Tactics are *behavioral scripts*. They are not objects (like the handbag) or static text (like plagiarism). They are methods of operation.
  3.  **License:** Unless this is a formal military alliance where doctrine is shared (which would provide a License), one group stealing another's operational playbook to achieve similar results fits the definition perfectly.

  **The Nuance:**
  If the tactic becomes industry standard (e.g., "all terrorists use IEDs"), it stops being copycatting and becomes **convergence**. But if Group B specifically starts using Group A's signature method (e.g., "specific hostage video style" or "specific drone deployment") to ride the wave of Group A's notoriety or success, it is **copycatting**.

  ### The One Tension Point (No Sacrifice Required)

  The only place you felt unstable was the **Forgery vs. Shooter** distinction, since both involve signing another's name.

  The principle resolves this without sacrificing a verdict:
  *   The **Forger** signs Vermeer to sell a *thing*. The crime is **fraudulent ownership**.
  *   The **Shooter** signs the predecessor to validate an *act*. The crime is **parasitic agency**.

  A copycat doesn't want to *own* the original; they want to *ride* the original. The shooter doesn't want to own the first shooter's life; they want their act to be read as a sequel. The startup doesn't want to own the rival's code; they want the rival's users.

  **Copycatting is not theft of property. It is theft of momentum.**
