answer: |-
  # The Social Influence Diagnostic Tree

  This diagnostic sorts collective behaviors by observable counterfactuals. It begins by isolating the source of correlation, then uses the **"Reversal Test"** (what breaks the pattern?) to distinguish between informational, reputational, and payoff-driven mechanisms.

  ### **Node 1: The Null Test (Common Cause)**
  **Question:** If every other person in the group were removed from the scenario, would the remaining individual still take the same action?
  *   **Yes** $\rightarrow$ Go to **Leaf 1**.
  *   **No** (The action depends on the presence/behavior of others) $\rightarrow$ Go to **Node 2**.

  > **Leaf 1: Common Shock (The Null)**
  > *Correlation is driven by an external factor, not social inference.* (e.g., Everyone buys umbrellas because it is raining).

  ---

  ### **Node 2: The Motivation Test (Information vs. Utility)**
  **Question:** Is the individual following the group primarily because they believe the group knows something about the *world* (to be right), or because their *payoff* depends on matching the group (to be safe/compatible)?
  *   **To Be Right** (Informational) $\rightarrow$ Go to **Node 3**.
  *   **To Be Safe/Compatible** (Utility/Payoff) $\rightarrow$ Go to **Node 6**.

  ---

  ### **Node 3: The Reversal Test (Informational Fragility)**
  **Question:** What specific new observation would cause the individual to stop following the group and act on their own private information?
  *   **"The public revelation of just one other person's private signal."** $\rightarrow$ Go to **Node 4**.
  *   **"I need to know what others *really* believe (e.g., via anonymous survey), not just what they did."** $\rightarrow$ Go to **Leaf 2**.
  *   **"Nothing; I am simply copying the behavior without processing information."** $\rightarrow$ Go to **Leaf 3**.

  > **Leaf 2: Pluralistic Ignorance**
  > *Private beliefs and public behavior diverge; agents misinterpret silence/inaction as approval.* (e.g., Hiring committee silence read as confidence).
  >
  > **Leaf 3: Non-Bayesian Imitation**
  > *Heuristic copying without strategic inference.* (e.g., Students studying a chapter because others said so, without checking).

  ---

  ### **Node 4: The Signal State (Cascade Phase)**
  **Question:** Has that contradictory private signal from an early actor been publicly revealed yet?
  *   **Yes** (The herd has snapped/broken upon disclosure). $\rightarrow$ Go to **Leaf 4**.
  *   **No** (The herd is currently persisting despite private doubts). $\rightarrow$ Go to **Leaf 5**.

  > **Leaf 4: Reverse (Self-Correcting) Cascade**
  > *The specific state where public information overwhelms the herd history.* (e.g., Market snaps back after fund discloses selling).
  >
  > **Leaf 5: Sequential-Bayesian Informational Cascade**
  > *Rational ignoring of private signals because public history outweighs them.* (e.g., A run on a bank before the truth comes out).

  ---

  ### **Node 6: The Audience Test (Reputation vs. Numbers)**
  **Question:** Does your payoff depend on *who is watching* you (specific observers), or *how many* people are doing the action (aggregate count)?
  *   **Who Is Watching** (Reputation) $\rightarrow$ Go to **Node 7**.
  *   **How Many** (Network/Threshold) $\rightarrow$ Go to **Node 8**.

  ---

  ### **Node 7: The Stakes Test (Career vs. Norms)**
  **Question:** If you deviated from the group, would the penalty come from professional consequences (firing, lost capital) or social sanctions (ostracization, shame)?
  *   **Professional/Market Consequences.** $\rightarrow$ Go to **Leaf 6**.
  *   **Social/Community Sanctions.** $\rightarrow$ Go to **Leaf 7**.

  > **Leaf 6: Reputational / Career-Concerns Herding**
  > *Action picked to look competent to principals, not to be right.* (e.g., VC voting yes to avoid blame).
  >
  > **Leaf 7: Normative Conformity**
  > *Action picked to avoid social punishment or maintain group identity.*

  ---

  ### **Node 8: The Tipping Point Test (Threshold vs. Coordination)**
  **Question:** Is there a specific "critical mass" number of adopters required before the action becomes valuable, or does value simply increase with matching expectations?
  *   **Yes, a Critical Mass/Tipping Point.** $\rightarrow$ Go to **Leaf 8**.
  *   **No, it is about matching expectations.** $\rightarrow$ Go to **Node 9**.

  > **Leaf 8: Threshold / Bandwagon Dynamics**
  > *Aggregate flips once a critical mass is reached; no new information needed.* (e.g., Generators sell out once enough neighbors have one).

  ---

  ### **Node 9: The Equilibrium Test (Payoff vs. Sunspot)**
  **Question:** If you knew everyone else would do the opposite, would you still want to do the action if enough others did (Payoff Complementarity), or is the only value in matching whatever arbitrary focal point emerges?
  *   **Value increases with each additional user (Network Effects).** $\rightarrow$ Go to **Leaf 9**.
  *   **Value is only in matching (Coordination).** $\rightarrow$ Go to **Node 10**.

  > **Leaf 9: Payoff Complementarity**
  > *Continuous network effects distinct from binary thresholds.*

  ---

  ### **Node 10: The Focal Point Test**
  **Question:** Is there a fundamental reason (risk dominance, payoff superiority) to prefer one equilibrium over the other?
  *   **Yes** (One equilibrium is objectively safer/better). $\rightarrow$ Go to **Leaf 10**.
  *   **No** (The choice is arbitrary/correlated by irrelevant signals). $\rightarrow$ Go to **Leaf 11**.

  > **Leaf 10: Pure Coordination**
  > *Self-fulfilling expectations with multiple equilibria, often resolved by risk dominance.*
  >
  > **Leaf 11: Sunspot Coordination**
  > *Self-fulfilling expectations driven by arbitrary extrinsic signals.*

  ***

  # Diagnostic Analysis & Constraints Check

  ### 1. Classification of Your Six Cases
  | Case | Path | Leaf |
  | :--- | :--- | :--- |
  | **(1) Hiring Committee** (Silence $\rightarrow$ Confidence) | Node 1 (No) $\rightarrow$ Node 2 (Right) $\rightarrow$ Node 3 (Beliefs) | **Leaf 2: Pluralistic Ignorance** |
  | **(2) Med-School** (Copy without checking) | Node 1 (No) $\rightarrow$ Node 2 (Right) $\rightarrow$ Node 3 (Nothing) | **Leaf 3: Non-Bayesian Imitation** |
  | **(3) VC Partner** (Vote yes to avoid blame) | Node 1 (No) $\rightarrow$ Node 2 (Safe) $\rightarrow$ Node 6 (Who) $\rightarrow$ Node 7 (Career) | **Leaf 6: Reputational Herding** |
  | **(4) Generators** (Enough neighbors $\rightarrow$ Worth it) | Node 1 (No) $\rightarrow$ Node 2 (Safe) $\rightarrow$ Node 6 (How Many) $\rightarrow$ Node 8 (Critical Mass) | **Leaf 8: Threshold Dynamics** |
  | **(5) Market** (Snap back on disclosure) | Node 1 (No) $\rightarrow$ Node 2 (Right) $\rightarrow$ Node 3 (Signal) $\rightarrow$ Node 4 (Yes) | **Leaf 4: Reverse Cascade** |
  | **(6) Umbrellas** (Because rain) | Node 1 (Yes) | **Leaf 1: Common Shock (Null)** |

  ### 2. Indistinguishable Leaves (Observational Equivalence)
  From choice data alone (who did what, when), the following pairs are difficult or impossible to separate without structural assumptions or elicited beliefs:

  *   **Leaf 10 (Pure Coordination) vs. Leaf 11 (Sunspot):** Both result in correlated action without fundamental information.
      *   *Extra Assumption Needed:* You must observe the **payoff matrix**. If one equilibrium is risk-dominant (safer if coordination fails), it's Pure Coordination. If the correlation device is irrelevant to payoffs (e.g., flipping a coin), it's Sunspot.
  *   **Leaf 8 (Threshold) vs. Leaf 9 (Payoff Complementarity):** Both show adoption increasing with the number of users.
      *   *Extra Assumption Needed:* You need individual **utility functions**. Thresholds imply a step-function (0 value until $K$ users); Complementarity implies a continuous slope (more users = linearly more value). Aggregate adoption curves often look identical (S-curves).
  *   **Leaf 5 (Info Cascade) vs. Leaf 3 (Non-Bayesian Imitation):** Both look like "copying the predecessor."
      *   *Extra Assumption Needed:* You must run the **Reversal Test** (Node 3). If a single public signal breaks the herd, it's a Cascade (Leaf 5/4). If the herd persists despite contradictory public signals (due to trust in the leader), it's Imitation (Leaf 3).

  ### 3. Empty Combinations
  *   **Common Shock + Reputational Herding:** Incoherent. If the action is driven by a common shock (Node 1 = Yes), there is no strategic dependence on others to generate reputational concerns.
  *   **Reverse Cascade + Threshold:** Unattractive/Empty. Threshold dynamics (Leaf 8) reverse based on *counts* (people dropping out), not on the *revelation of a private signal*. A "Reverse Threshold" is just a cascade failure, not a signal correction.
  *   **Pluralistic Ignorance + Common Shock:** Incoherent. PI requires that private beliefs differ from public acts *because of social inference*. If a common shock drives the action, private beliefs should align with the action (it's raining, I believe it's raining).

  ### 4. Duplicate Cases Check
  **Are any of your six cases the same mechanism?**
  **No.** While they all exhibit correlation, the *generative mechanism* in each is distinct according to the tree:
  *   (1) is **Normative/Informational confusion** (PI).
  *   (2) is **Heuristic** (Imitation).
  *   (3) is **Career Payoff** (Reputational).
  *   (4) is **Network Payoff** (Threshold).
  *   (5) is **Informational Fragility** (Reverse Cascade).
  *   (6) is **External** (Null).

  *Note:* Case 1 (PI) and Case 3 (Reputational) are the closest cousins. Both involve "doing what you think is wrong." However, in Case 1, the agent is *mistaken* about others' beliefs (they think others approve). In Case 3, the agent is *correct* about others' likely actions but acts to protect their career. The tree separates them at Node 2 (Right vs. Safe) and Node 3 (Beliefs vs. Signal).
