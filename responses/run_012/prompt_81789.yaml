answer: |-
  The term you are looking for is **rule-circularity** (or a **rule-circular argument**).

  It is a specific sub-species of circularity that is distinct from the standard "begging the question" (*petitio principii*). While standard circularity is usually considered a fatal flaw, rule-circularity occupies a contested space: some philosophers view it as a vicious defect, while others argue it is an unavoidable structural feature of justifying fundamental logical or epistemic principles.

  Here is the carving you asked for: the definition, the boundaries, the key distinctions, and the philosophical verdict on whether it is a bug or a feature.

  ### 1. The Definition and the Carving

  **Rule-Circularity** occurs when an argument employs a rule of inference $R$ to establish the validity or reliability of that very rule $R$.

  To understand the edges, you must distinguish it from its neighbor, **Premise-Circularity**.

  *   **Premise-Circularity (Begging the Question):** The *truth* of the premises depends on the acceptance of the conclusion.
      *   *Example:* "God exists because the Bible says so, and the Bible is true because it is the word of God."
      *   *Structure:* The proposition $P$ is used to prove $P$ (directly or via a chain).
      *   *Defect:* It provides no *new* reason to believe the conclusion. If you doubt the conclusion, you must doubt the premise.

  *   **Rule-Circularity:** The *inference* from premises to conclusion depends on the rule being justified. The premises themselves may be uncontroversial or independent of the conclusion.
      *   *Example:* "Modus Ponens is valid. Why? Because if (If P then Q) and P are true, then Q is true. Therefore, Modus Ponens is valid."
      *   *Structure:* Premises $A, B \vdash C$ using Rule $R$. The Conclusion $C$ is "Rule $R$ is valid."
      *   *Defect:* It provides no *independent* guarantee of the rule. If you doubt the rule, you cannot accept the argument that establishes it.

  **The Boundary Line:**
  The crucial distinction is between **using** a rule and **mentioning** it. In a rule-circular argument, you must *use* the rule to derive the conclusion that the rule is reliable. In a non-circular argument about a rule, you would use a *different*, more fundamental rule to prove the target rule (e.g., proving a derived rule of logic using axioms and more basic rules). But for *basic* rules (Modus Ponens, Induction, Non-Contradiction), there are no "more basic" rules to stand on.

  ### 2. Is It a Defect? (The Philosophical Verdict)

  This is where the debate lies. The consensus splits into two camps, best articulated by **Michael Dummett** and **Susan Haack**.

  #### A. The "Suasive" vs. "Explanatory" Distinction (Dummett)
  Michael Dummett, in his seminal paper *"The Justification of Deduction"* (1973), argues that rule-circularity is vicious if your goal is **suasive** (persuasion), but benign if your goal is **explanatory**.

  *   **Suasive Justification:** You are trying to convince a skeptic who doubts the rule. Here, rule-circularity is fatal. If I doubt Modus Ponens, I will not accept an argument that relies on Modus Ponens to prove it. It fails to move the skeptic.
  *   **Explanatory Justification:** You are trying to make sense of your own practice to yourself. Here, rule-circularity is unavoidable and acceptable. We use Modus Ponens because it is embedded in our concept of "if... then." The argument doesn't convince a skeptic, but it clarifies why we hold the rule.

  #### B. The "Vindication" vs. "Validation" Distinction (Strawson/Reichenbach)
  Regarding **induction** (your example of "induction has worked so far"), P.F. Strawson and Hans Reichenbach draw a similar line.

  *   **Validation:** Proving that induction *must* lead to truth. This is impossible (Hume's Problem) without being rule-circular.
  *   **Vindication:** Showing that induction is the best policy *if* any policy works. Strawson argued that asking if induction is "justified" is a category mistake; being "reasonable" just *means* following inductive norms. Therefore, the rule-circular argument ("induction works because it has worked") isn't a proof, but a reminder of how our language game functions.

  #### C. Epistemic Circularity (Alston)
  William Alston broadened this to **Epistemic Circularity**. He argued that for basic sources of knowledge (perception, memory, logic), non-circular justification is impossible. You cannot check perception without using perception. He concludes that if the rule is *actually* reliable, the circularity does not prevent knowledge, even if it prevents *showing* you have knowledge to a skeptic.

  ### 3. Relation to Carroll's Tortoise

  You mentioned Lewis Carroll's *"What the Tortoise Said to Achilles."* It is in the neighborhood, but it is not the same thing.

  *   **Carroll's Tortoise:** Highlights a **regress of application**. The Tortoise accepts premises $A$ and $B$, and accepts the hypothetical "If $A$ and $B$ then $Z$," but refuses to accept $Z$. Achilles tries to add "If $A$ and $B$ and (If $A$ and $B$ then $Z$) then $Z$" as a new premise. Carroll shows that no amount of *premises* can force the *act* of inference.
  *   **Rule-Circularity:** Highlights a **regress of justification**. It asks: "How do you know you are allowed to move from $A$ and $B$ to $Z$?"

  Carroll shows that rules cannot be reduced to premises. Rule-circularity admits this but asks if the rule can justify *itself*. Carroll's point is about the *necessity* of rules; Rule-Circularity is about the *authority* of rules.

  ### 4. Summary of the Terrain

  | Feature | Premise-Circularity | Rule-Circularity |
  | :--- | :--- | :--- |
  | **Structure** | Conclusion is assumed in Premises. | Conclusion (Rule is valid) is derived via the Rule. |
  | **Example** | "The Bible is true because God says so." | "Induction works because it has worked before." |
  | **Status** | Almost universally considered a fallacy. | Contested. Vicious for skeptics, unavoidable for foundationalists. |
  | **Remedy** | Find independent premises. | None available for basic rules. |
  | **Philosophers** | Aristotelian logic. | Dummett, Haack, Alston, Boghossian. |

  ### 5. Conclusion: The Label and the Verdict

  The established term is **Rule-Circularity**.

  **Is it a defect?**
  *   **Dialectically:** Yes. It cannot silence a skeptic. If someone doubts the Law of Non-Contradiction, you cannot use *reductio ad absurdum* (which relies on LNC) to prove them wrong, because they will reject the *reductio*.
  *   **Epistemically:** No (arguably). If the rule is fundamental, there is no "higher court" to appeal to. As Susan Haack argues in *"The Justification of Deduction,"* deduction cannot be justified without circularity, but this does not mean deduction is unjustified; it means justification *ends* there.

  **The Carving:**
  If you want to be precise in conversation:
  1.  Call it **Rule-Circularity**.
  2.  Specify that it is **non-premise-circular** (the premises do not entail the conclusion without the rule).
  3.  Specify that it is **dialectically ineffective** (won't convince a skeptic) but **structurally unavoidable** (for foundational rules).

  If you encounter someone defending it, they are likely adopting a **coherentist** or **externalist** stance: they believe that as long as the system hangs together (coherentism) or the rule is actually reliable (externalism), the circularity is not vicious. If you attack it, you are likely adopting a **foundationalist** stance that demands linear, non-circular chains of justification for basic beliefs.
