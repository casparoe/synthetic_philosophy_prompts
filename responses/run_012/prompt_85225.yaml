answer: |-
  David, a bank manager, verifies a contract by examining a signature he recognizes as his client John's, relying on his trained eye for ordinary verification. Let $p$ be "This signature is John's," and let $q$ be "This signature is not a skilled forgery." David knows $p$ entails $q$, since a genuine signature cannot be a forgery, and he forms his belief in $q$ solely by deducing it from $p$. In the nearest possible world where $p$ is false, a different client signs, David recognizes the difference, and he does not believe $p$; however, in the nearest possible world where $q$ is false, a forger produces a perfect replica, David is deceived into believing it is John's, and he continues to believe $p$ and consequently $q$.

  **Analysis**

  *   **Propositions:** $p$ = "This signature is John's"; $q$ = "This signature is not a skilled forgery."
  *   **Methods:** For $p$, David uses visual recognition based on past experience. For $q$, David uses deduction from $p$ (knowing $p \to q$).
  *   **Relevant Nearby Worlds:**
      *   **Nearest $\neg p$ world:** A world where a different person (e.g., Mary) genuinely signs the document. This is an ordinary variation close to actuality.
      *   **Nearest $\neg q$ world:** A world where a forger creates a perfect replica of John's signature. This requires specific intent and effort, making it less similar to actuality than the nearest $\neg p$ world.
  *   **Tracking Verdicts:**
      *   **Knowledge of $p$:** In the nearest $\neg p$ world (Mary signs), David's visual method detects the difference, so he does not believe $p$. The belief is sensitive.
      *   **Knowledge of $q$:** In the nearest $\neg q$ world (Perfect Forgery), David's visual method is fooled, so he believes $p$. Since he deduces $q$ from $p$, he believes $q$. The belief is insensitive.
      *   **Result:** David knows $p$ but does not know $q$, violating epistemic closure.

  **Feature Doing the Work**
  The single feature driving the verdict is the **asymmetry in similarity ordering** between the nearest $\neg p$ world and the nearest $\neg q$ world. Although all $\neg q$ worlds are $\neg p$ worlds (a forgery is not genuine), the *nearest* $\neg p$ world is an ordinary error (wrong signer), while the *nearest* $\neg q$ world is a deceptive error (forgery). Tracking evaluates sensitivity for $p$ at the ordinary error world (where the method works) but evaluates sensitivity for $q$ at the deceptive error world (where the method fails).

  **If the Feature Were Removed**
  If David employed an independent reliable method for $q$ (e.g., ink dating or digital verification) that could detect forgeries even when visual recognition fails, his belief in $q$ would track the truth in the nearest $\neg q$ world, and he would know $q$. Alternatively, if the nearest $\neg q$ world were an ordinary scenario rather than a deceptive one (e.g., if $q$ were "John is not wearing a glove"), the method might detect the difference, restoring sensitivity.

  **Closure Defender's Attack**
  A defender of epistemic closure would argue that knowledge is necessarily closed under known deduction, so if David knows $p$ and deduces $q$, he must know $q$. They would attack the case by rejecting sensitivity as a necessary condition for knowledge, arguing that David's justification for $p$ is sufficient to transmit knowledge to $q$. Alternatively, they might employ contextualism, arguing that in the ordinary context where David knows $p$, the forgery scenario is irrelevant; once $q$ is raised, the standards shift, but this shift does not prove David lacked knowledge initially, only that the attribution context changed.
