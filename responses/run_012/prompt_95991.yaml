      *   *Worry:* Relocation of cost (measurement vs. erasure). *Fix:* Marking scheme point on where the cost is located.
      *   *Worry:* Division of world (memory vs. rest). *Fix:* Marking scheme point on system boundaries.
      *   *Worry:* Landauer as theorem vs. model. *Fix:* Marking scheme point on the status of the principle.

  8.  **Final Polish:** Check formatting (bolding, lists) for readability. Ensure the "A vs B" distinction is sharp. (Self-correction: Ensure the model answer doesn't just say "it's complicated" but offers a resolved position on *why* it's complicated).

  *(Self-Correction during drafting Model Answer)*: I need to be careful not to invalidate Landauer entirely, but to contextualize it. The user says "I'm not convinced the relocation was free." The model answer should reflect that skepticism without denying the Second Law. It should focus on *why* the entropy increases, not just *that* it increases. The key is the transition from correlation to heat.

