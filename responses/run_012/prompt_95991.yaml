      *   *Drafting the "Student Voice":* Make it sound confident but superficial. "Measurement is free, erasure costs energy, balance restored."
      *   *Drafting the Instructions:* "Audit this argument." "Identify hidden assumptions." "Explain where the entropy goes if erasure is deferred."

  4.  **Drafting the Model Answer:**
