answer: |-
  Elena, a 42-year-old VP of Engineering, cancels a major product launch 24 hours before the deadline after discovering a non-critical security vulnerability, an act that costs her company a $10 million contract and results in her immediate termination. She is held responsible for the loss by her board and peers. Ten years prior, Elena was impulsive and risk-tolerant, but she consciously admired a mentor named Marcus known for ruthless prioritization of stability; over a decade, she deliberately adopted his habits, journaling protocols, and decision matrices until his risk-averse values became her own settled character. She was not coerced into this transformation, nor was she manipulated; she sustained the project of becoming "like Marcus" through consistent, unforced effort until the new values felt entirely her own.

  **Walk-Through of Verdicts**
  **The Basic Argument:** Elena is not ultimately responsible. She cancelled the launch because she is the kind of person who prioritizes stability (the way she is). She is this kind of person because she chose to emulate Marcus. But she chose to emulate Marcus because, at that earlier time, she already possessed reasons to value stability over risk (the way she was then). She is not responsible for that prior valuation, as it was either caused by prior events or random. Since nothing can be *causa sui*, the regress holds: she never chose the self that chose the self. Verdict: **Not Ultimately Responsible.**

  **The Compatibilist:** Elena is responsible. Her action flowed from her own settled, endorsed desires without coercion or insanity. Crucially, the history of self-authorship matters: she actively identified with her motives over time, making the values truly hers rather than merely incidental. She was responsive to reasons (the security risk) and acted in accordance with her higher-order volitions. Verdict: **Responsible.**

  **The Event-Causal Libertarian:** Elena is responsible. The decision to cancel was not determined by prior events; given the exact same past and laws of nature, she could have launched. She was the irreducible source of the action, and the indeterminacy occurred at the moment of choice, not merely in her background. Verdict: **Responsible.**

  **The Regress and Self-Authorship**
  The element of self-authorship fails to stop the regress at step four of the Basic Argument: *"To be truly responsible for that choice you would have to be truly responsible for the way you were when you made it."* When Elena chose to emulate Marcus, she did so for reasons—perhaps she feared failure, or admired integrity, or sought respect. Where did those reasons come from? They came from a prior psychological constitution she did not choose. What made her the sort of person who would weigh "integrity" heavier than "bonus"? That weighting mechanism was given, not made. Even if the choice to emulate Marcus was undetermined (satisfying the Libertarian), the *probability distribution* that made that choice intelligible rather than random was determined by her prior nature. She did not create the creator of her choices.

  **The Twin Case**
  Consider Elara, Elena's near-twin. Elara possesses the exact same risk-averse character and makes the identical decision to cancel, but her temperament was simply innate; she never engaged in any project of self-revision.
  *   **Basic Argument:** Returns the same verdict for both. Neither Elena nor Elara is ultimately responsible for the initial nature that grounded their choices (Elena's prior valuation of stability, Elara's innate temperament).
  *   **Compatibilist:** Treats them differently. Elena is Responsible because her character was historically endorsed through self-authorship; Elara is Not Responsible (or responsible only in a diminished, "lucky" sense) because her character is merely given luck, lacking the history of identification that grounds ownership.
  *   **Libertarian:** Treats them similarly (both Responsible), assuming both had undetermined choices, though Elena's sourcehood feels richer.

  The feature carrying the weight is the **history of deliberate valuation**. For the Compatibilist, this history converts mere causation into ownership. If this feature is removed (as in Elara), the Compatibilist's ground for responsibility evaporates or weakens significantly. For the Basic Argument, this feature is irrelevant; whether the character is given by genetics or chosen by prior nature, the regress remains because the *source* of the choice to choose is never owned.

  **The Defender's Best Reply**
  The strongest reply is to reject the premise that "Ultimate Responsibility" (UR) is required for moral responsibility. A defender argues that UR is an incoherent standard—demanding that an agent be *causa sui* is demanding that they exist before they exist. Responsibility is not a metaphysical status requiring an infinite regress of self-creation; it is a social practice grounded in agency, reason-responsiveness, and the capacity for relationship. We hold Elena responsible because she is the appropriate target of reactive attitudes (resentment, gratitude), not because she metaphysically authored her soul.

  **Does it succeed?** It succeeds pragmatically but fails metaphysically. It saves the practice of blame and praise from paralysis, allowing society to function without solving the hard problem of free will. However, it concedes Strawson's core point: that no one is *ultimately* responsible in the deep, desert-entailing sense. If the goal is to justify retributive justice based on metaphysical desert, the reply fails. If the goal is to justify accountability as a forward-looking tool for regulation and relationship, it succeeds completely.
