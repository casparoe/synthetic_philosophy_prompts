  4.  **Refining the Economics (The "Hard" Part):**
      *   *BHW Model:* Sequential agents, binary state (Good/Bad), binary signal (High/Low), binary action (Adopt/Reject). Agent $n$ sees $n-1$'s action. If $n-1$ and $n-2$ adopt, agent $n$ adopts regardless of private signal (if signal precision < 1).
