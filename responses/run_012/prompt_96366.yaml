answer: |-
  **Setting:** *Terminal B, Gate 42. 11:30 PM. The flight to Chicago is delayed indefinitely. The bar is dimly lit, smelling of stale beer and disinfectant. MARK (50s, rumpled blazer, wearing a conference lanyard) swirls a bourbon. SARAH (40s, sharp eyes, scrolling on a tablet) nurses a sparkling water.*

  **Mark:** You're dismissing the urn experiment too easily. It's not just a parlor trick. It's the baseline. You put people in a room, tell them there's a majority of red or blue balls, let them draw one, and watch them ignore their own eyes because the guy before them picked the wrong color. It's Bayesian rationality in action.

  **Sarah:** It's Bayesian rationality in a very specific, very fragile cage, Mark. I'm not dismissing the result. I'm dismissing the universality. You treat the BHW model like a law of physics. It's a law of *wiring*.

  **Mark:** Wiring?

  **Sarah:** The information topology. In the standard setup, Agent $n$ observes the actions of $1$ through $n-1$. The information set is cumulative. $I_n \supset I_{n-1}$. Once two people agree, the public information weight overwhelms any single private signal, assuming signal precision is bounded. That's not psychology. That's arithmetic.

  **Mark:** It's behavior. We see it in IPOs. We see it in bank runs.

  **Sarah:** We see *herding*. We don't necessarily see *cascades*. That's the conflation I'm fighting. Herding is everyone doing the same thing. A cascade is when private information stops flowing into the public pool. In the BHW model, they happen simultaneously because of the sequential wiring. Change the wiring, you get herding without the information shutdown.

  **Mark:** *(Leans forward)* Okay, play your hand. How do you wire it?

  **Sarah:** Don't make me observe the whole prefix. Make me observe two randomly chosen predecessors from the past. Not the guy immediately before me, not the whole chain. Just a random sample of the history.

  **Mark:** You lose the momentum.

  **Sarah:** I lose the *singularity*. If I'm sampling randomly, early actions don't compound with infinite weight. A later agent with a strong private signal can still overturn the precedent because the public history isn't a monolithic block; it's a scattered sample. The cascade doesn't lock. Information keeps aggregating, just slower.

  **Mark:** But that's not how lines work. That's not how order books work. If I'm standing behind ten people buying a stock, I see ten buys. I don't see a random sample of the day's trades. I see the prefix. In any sequential decision where visibility is public—the restaurant with the line, the tech adoption curve—the wiring *is* cumulative.

  **Sarah:** Is it? Do you know *why* those ten people bought? Maybe the first three bought because of a rumor. The next four bought because they saw the first three. You're observing actions, not likelihood ratios. The model assumes agents can invert the actions of predecessors to deduce their private signals perfectly.

  **Mark:** Up to the point of the cascade.

  **Sarah:** Exactly. But that inversion requires common knowledge of rationality and common knowledge of the signal distribution. If you introduce even a tiny bit of noise about *what* the predecessors knew, the inversion breaks. The cascade becomes a artifact of assuming everyone knows everyone else's signal precision.

  **Mark:** You're arguing for noise. I'm arguing for coarse cognition. Humans don't process continuous likelihood ratios. We process "Go" or "No Go." The binary signal assumption isn't a bug; it's a feature of bounded rationality. We threshold.

  **Sarah:** But if you allow continuous signals, the cascade vanishes. If my private signal can be strong enough—say, a 99% confidence interval—it will always trump the accumulated public history, no matter how long the chain. The cascade only exists because you cap the precision of private information.

  **Mark:** And isn't that realistic? When was the last time you were 99.9% sure about an investment while the entire market was moving the other way? At some point, the private signal has diminishing returns. The world is noisy. My signal isn't perfect. If ten people say the bridge is safe, and my gut says "maybe," I'm crossing the bridge.

  **Sarah:** So you're defending the cap on precision as a psychological constraint.

  **Mark:** I'm defending it as an empirical constraint.

  **Sarah:** Fine. Let's talk about fragility. This is the part that keeps me up at night. In your beloved model, a cascade is incredibly brittle. A tiny public announcement—a whisper from the Fed, a single news tweet—shatters the whole thing. The information flow restarts instantly.

  **Mark:** That's not a weakness, Sarah. That's the most interesting thing about it.

  **Sarah:** It makes the theory useless for prediction. If the equilibrium is that fragile, you can't model the stability of norms. You can't explain why fashions last for seasons. If a cascade is so easy to pop, why do we have decades-long paradigms?

  **Mark:** Because the public announcement has to be *credible*. But think about 2008. Think about the run on the banks. It held, it held, it held, and then one statement from the Treasury and the whole thing inverted. That's the cascade fragility you're mocking. It explains systemic risk better than any continuous model.

  **Sarah:** It explains the crash, not the plateau. It models the phase transition, not the material.

  **Mark:** Maybe the material *is* the transition.

  **Sarah:** *(Sips water)* You're also glossing over the definition again. Herding vs. Cascade. If I force my agents to observe random predecessors, they might still all buy the stock. They herd. But they aren't in a cascade because their private signals are still influencing the decision. The price reflects the aggregate info.

  **Mark:** But if the action is identical, who cares?

  **Sarah:** I care! If they're in a cascade, the price is wrong. The information aggregation has failed. If they're just herding because the fundamentals are strong, the price is right. Policy intervention depends on the difference. If it's a cascade, you need to inject public info to break it. If it's just herding on fundamentals, leave it alone.

  **Mark:** But you can't tell the difference from the outside. That's the observer's problem. All you see is the line out the door. You don't know if they're ignoring their watches or if they all just decided it's a good movie.

  **Sarah:** So the theory admits it's untestable?

  **Mark:** It's testable via the fragility! You shock the system. If the line disperses on a whisper, it was a cascade. If it holds, it was fundamentals.

  **Sarah:** That's a hell of an experiment to run on a financial market. "Let's drop a false rumor and see if the economy collapses."

  **Mark:** *(Gestures to the bar)* Look around. Delayed flight. Everyone's sitting here. Is that a cascade? Did the first two people sit down, and now we're all ignoring our own urge to pace around? Or do we all just know the flight is delayed?

  **Sarah:** We all see the board. That's a public signal. No cascade.

  **Mark:** But the board hasn't changed in an hour. I just checked. It still says "On Time." We're sitting because *everyone else* is sitting. We're ignoring the board. That's a cascade.

  **Sarah:** We're sitting because standing is costly and the expected value of standing near the gate is low. That's a coordination game, not an information cascade. You're seeing cascades everywhere because you're looking for them.

  **Mark:** And you're missing them because you're looking for perfect wiring. You want the network to be messy enough to save the information flow. I'm telling you the network is often a chain.

  **Sarah:** Even in a chain, if signals are continuous...

  **Mark:** They aren't. People are binary. Invest or don't. Buy or sell. Marry or don't. We don't marry at 0.7 probability.

  **Sarah:** We delay. We wait. That's a continuous action space. Waiting allows more information to arrive. The standard cascade model forces an immediate irreversible decision. That's the real wiring artifact.

  **Mark:** Real options theory handles the timing. But eventually, you exercise. And when you do, if you do it because the guy before you did, you're in the cascade.

  **Sarah:** *(Looks at her watch)* You know, if we were in a cascade about this flight, we'd all rush the gate the second one person stood up.

  **Mark:** Watch me. *(Mark stands up abruptly and grabs his bag.)*

  **Sarah:** *(Doesn't move)* See? Nobody's following.

  **Mark:** *(Sits back down, slightly embarrassed)* False signal. Low precision.

  **Sarah:** Or maybe the public information—the departure board—is just too strong.

  **Mark:** Or maybe we're just tired.

  **Sarah:** *(Smiles)* Bounded rationality?

  **Mark:** Exhaustion is a cost of action.

  *(The PA system crackles. "Final call for Flight 492 to Chicago...")*

  **Sarah:** There's your public signal.

  **Mark:** *(Stands up)* Now the cascade breaks.

  **Sarah:** Now the game ends.

  *(They both stand, gathering their things. The argument isn't finished, but the flight isn't waiting.)*

  **Mark:** Next time. I'll bring the urns.

  **Sarah:** I'll bring the network topology maps. Don't spill the bourbon on my data.

  **Mark:** No promises.

  *(They walk toward the gate, separate, merging into the line of passengers. It's impossible to tell if they're walking together because they agree, or just because it's the only way to the plane.)*
