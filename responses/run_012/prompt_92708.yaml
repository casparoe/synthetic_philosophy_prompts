answer: |-
  This is a remarkably sharp application of Lakatos to a live (or perhaps undead) scientific controversy. You have hit on a tension that philosophers of science often gloss over: Lakatos's framework assumes we can objectively identify a "novel fact." In geophysics, where observation is indirect and model-dependent, that identification is itself a theoretical act.

  Here is the diagnosis you asked for, testing your hypothesis against the structure of the debate.

  ### 1. The Hard Cores: Distinct Ontologies, Not Just Disagreements
  You asked where the hard core lies. It is not merely "plumes exist" vs. "plumes don't." That is too superficial. The hard cores are actually competing ontologies of mantle dynamics.

  *   **The Plume Programme Hard Core:** The mantle is thermally convective in a way that generates narrow, fixed, deep-sourced upwellings independent of plate motions. Intraplate volcanism is primarily a *bottom-up* phenomenon driven by thermal instability at the Core-Mantle Boundary (CMB).
  *   **The Plate (Anti-Plume) Programme Hard Core:** The lithosphere and plate tectonics are the primary drivers of volcanism. Intraplate volcanism is a *top-down* phenomenon driven by lithospheric extension, cracking, and shallow chemical heterogeneity. Deep mantle dynamics are secondary or irrelevant to surface expression.

  These are methodological decisions. A "plumist" will not accept a shallow explanation for a hotspot unless the deep model is physically impossible. An "anti-plumist" will not accept a deep plume unless a shallow explanation is physically impossible. This is the Negative Heuristic in action: anomalies are deflected into the protective belt, never allowed to strike the core.

  ### 2. The Dispute Over Novelty: Your Hypothesis Tested
  Your hypothesis is that the impasse is about *what counts as a novel prediction*. I believe this is correct, but it is compounded by the nature of geophysical data.

  In experimental physics, a prediction is temporal: Theory $T$ predicts Observation $O$ at Time $2$. In geophysics, almost everything is "postdiction." We look at rocks that are millions of years old. Therefore, "novelty" cannot be strictly temporal. It must be *heuristic novelty*: predicting a type of fact that was not used to construct the theory.

  *   **The Plumist Claim:** They argue they predicted the *existence* of linear seamount chains with age progression before high-resolution dating confirmed them. They view this as a risky bet.
  *   **The Anti-Plumist Counter:** They argue the age progression was known (or easily inferable from plate kinematics) before the plume model was rigidified. They claim the "prediction" is a retrodiction dressed up by adjusting the "fixed" reference frame of the plume to match the plate motion.

  **The Diagnosis:** You are right that this is a disagreement about standards of evidence, but it is deeper than just "risk." It is a disagreement about **underdetermination**.
  The Plumists treat the correlation of geochemistry and age progression as a *conjunction of independent testimonies* (seismology + geochemistry + dating). The Anti-Plumists treat these as *dependent variables* derived from the same underlying plate kinematic model.

  When a Plumist says, "We predicted the low-velocity zone," the Anti-Plumist says, "You adjusted the tomography inversion parameters until a low-velocity zone appeared." Since seismic tomography is an inverse problem (non-unique solutions), the "data" is already theory-laden. If the data is theory-laden, it cannot easily falsify the theory. This makes Lakatos's criterion of "empirical progress" nearly impossible to apply objectively.

  ### 3. Is Either Programme Degenerating?
  This is where Lakatos might feel the embarrassment you anticipated.

  According to Lakatos, a programme degenerates when it only explains what it already knows, requiring constant *ad hoc* modifications to the protective belt to survive anomalies, without predicting new heuristics.

  *   **Plume Programme:** Has it degenerated? They have added "secondary plumes," "tilted conduits," "plume heads vs. tails," and "chemical blobs" to explain hotspots that don't fit the fixed, deep, thermal model (e.g., Samoa, Iceland's complexity). To an outsider, this looks like belt-patching.
  *   **Plate Programme:** Has it degenerated? They have added "complex stress fields," "pre-existing weaknesses," and "shallow convection cells" to explain volcanism that looks remarkably plume-like. This also looks like belt-patching.

  **The Verdict:** Both programmes are likely in a state of **mutual degeneration** by strict Lakatosian standards, but they are sustained by **sociological progress**. Each side publishes papers, trains students, and secures grants. In Lakatos's view, a degenerating programme can persist for a long time before being ousted. However, the fact that neither is dying suggests that "degeneration" is not a binary switch but a gradient.

  More critically, the label "degenerating" is indeed tribal. It tracks whose team you are on because the judgment relies on weighing the *significance* of the protective belt adjustments. Is "tilted plume conduits" a fruitful elaboration (progressive) or a desperate fix (degenerating)? That is a value judgment, not a logical one.

  ### 4. What Would Count as Progress?
  You asked what would actually move the needle. Given the diagnosis that this is a clash of heuristics and standards of novelty, fresh evidence alone is unlikely to work. New tomography will just be inverted differently by the two camps. New geochemistry will be assigned to different reservoirs.

  Here is the hierarchy of what might actually resolve it, from least to most likely:

  1.  **New Measurement (Low Probability):** A seismic measurement so direct (e.g., capturing a plume conduit in real-time via dense ocean-bottom arrays) that the inversion ambiguity is removed. Even then, the Plate camp could argue it's a shallow feature misidentified as deep.
  2.  **Formal/Physical Result (Medium Probability):** A constraint on mantle viscosity or heat flow derived from independent physics (e.g., mineral physics at CMB conditions) that makes deep narrow upwellings thermodynamically impossible *or* makes shallow cracking insufficient to generate the observed melt volumes. This attacks the hard core's physical viability, not its explanatory power.
  3.  **Clean Distinction Between Prediction and Retrodiction (Low Probability):** This requires a philosophical shift in the community to agree on what counts as a "risk." Given the historical nature of geology, this is unlikely.
  4.  **Admitting the Question is Ill-Posed (High Probability):** This is the most honest answer. The term "plume" may not refer to a natural kind. It might be a **cluster concept**. Some hotspots are deep thermal upwellings; some are shallow lithospheric cracks; some are edge-driven convection.

  If the fourth option is true, the "Plume Wars" are a category error. The two programmes are not competing answers to the *same* question ("What causes hotspots?"); they are competing answers to *different* questions ("How much of volcanism is deep thermal?" vs. "How much is shallow mechanical?").

  ### 5. Conclusion: The Lakatosian Embarrassment
  Your hypothesis holds up well. The impasse is not about the mantle; it is about the **epistemic warrant for novelty**.

  The embarrassing result for Lakatos is this: His framework is designed to tell us when to abandon a theory. But in mature earth sciences, where observation is indirect and experiments are impossible, the criterion for "abandonment" (degeneration) becomes subjective. The "Negative Heuristic" protects the hard cores so effectively that the two programmes talk past each other.

  **Diagnosis:** This is a disagreement about standards of evidence (what counts as risky) fueled by two programmes answering slightly different questions under a single name ("hotspots"). Neither side is likely to be falsified by data alone. Progress will likely come only from dissolving the dichotomy—admitting that the mantle is complex enough to allow *both* mechanisms, rendering the "war" a historical artifact of 20th-century binary thinking.

  If I were to place a bet, I would say no amount of fresh evidence will move it until the community stops asking "Are there plumes?" and starts asking "Under what specific rheological conditions does deep upwelling dominate over shallow extension?" That shifts the debate from ontology (what exists) to parameter space (where does it exist), which is a progressive problemshift both sides might accept.
