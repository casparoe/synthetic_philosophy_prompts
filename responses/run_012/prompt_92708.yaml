      *   **Hard Core:** The fundamental assumptions defining the programme.
      *   **Negative Heuristic:** Don't attack the hard core.
      *   **Positive Heuristic:** How to develop the programme (what problems to solve).
      *   **Progressive Problemshift:** Theories within the RP predict *novel* facts (heuristic progress) and some are corroborated (empirical progress).
      *   **Degenerating Problemshift:** Theories only explain what's already known (post-hoc), require constant ad-hoc adjustments to the protective belt, and fail to predict novel facts.

  3.  **Apply to the Plume Wars:**
      *   **Side A: Deep Plume Hypothesis (The "Plumists")**
          *   *Hard Core:* Mantle convection includes narrow, hot, buoyant upwellings originating from the Core-Mantle Boundary (CMB). Hotspots are surface manifestations of these fixed deep sources.
          *   *Protective Belt:* Specific locations of plumes, geochemical signatures (HIMU, EMU, etc.), conduit widths, deflection by mantle flow, secondary plumes.
          *   *Claim to Progress:* Predicted seismic low-velocity zones, specific geochemical ratios before sampling, age progressions in seamount chains.
      *   **Side B: Plate Hypothesis / Shallow Processes (The "Anti-Plumists")**
          *   *Hard Core:* Plate tectonics and lithospheric extension/cracking explain volcanism. Anomalies are shallow, chemical, or thermal, not deep dynamic upwellings. "Plumes" are an unnecessary entity.
          *   *Protective Belt:* Lithospheric stress fields, pre-existing weaknesses, shallow convection, melt pooling, alternative geochemical reservoirs.
