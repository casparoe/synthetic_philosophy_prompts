      *   *Is it just data?* No, both sides look at the same tomography/geochem.
      *   *Is it verbal?* Partly ("plume" definition), but deeper.
      *   *Is it about standards?* Yes. What counts as "novel"?
          *   Plumists: "We predicted a chain before it was dated."
          *   Anti-Plumists: "You adjusted the flow model to fit the chain after the fact."
      *   *Lakatosian Irony:* If Lakatos is right, one should be degenerating. If both persist, maybe the criterion is too blunt or applied subjectively.

  5.  **Drafting the Diagnosis (Iterative Process):**

      *   *Introduction:* Acknowledge the user's insight. It's a classic case study. Validate the Lakatosian lens.
      *   *Identifying the Hard Cores:* Need to be precise.
          *   Plume: Deep thermal boundary layer instability is the primary driver of intraplate volcanism.
          *   Plate: Lithospheric stress and shallow heterogeneity are sufficient/necessary; deep dynamics are secondary or irrelevant.
      *   *The Protective Belts:* This is where the fighting happens. Tomography resolution, geochemical reservoirs, "blobby" vs. "tubular" plumes.
      *   *The "Novelty" Dispute:* This is the crux.
          *   Plumists claim novelty (e.g., Hawaii-Emperor bend).
          *   Anti-Plumists claim it's retrodiction (adjusting plate motion models to fit the bend).
          *   *Diagnosis:* It's a disagreement about the *temporal priority* of theory vs. observation, complicated by the fact that the "observations" (tomography) are theory-laden inversions themselves.
