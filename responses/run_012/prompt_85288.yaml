answer: |-
  The real crux of this question lies in forcing the student to move beyond cultural relativism ("it's their culture") and legalism ("it's illegal there, legal here"). The difficulty comes from applying the **Symmetry Requirement**: if the student condemns Amina, they must explain why the Rich Mayor is different in a *structural* way, not just a geographical one. A competent-but-unremarkable answer will likely condemn Amina based on the definition of corruption (abuse of power) and dismiss her defense as "cultural excuses," while failing to rigorously test the Rich Mayor against the same standard. To excel, the student must acknowledge that Amina's action is morally motivated (duty to kin) but structurally damaging (perpetuating inefficiency), and must evaluate the donor's conditions based on whether they address the structural harm without imposing incoherent standards.

  ***

  # Exam Question

  **Module:** Political Corruption and Clientelism
  **Time Allowed:** 60 Minutes
  **Word Count Target:** Approximately 1,200 words

  **Question:**

  Consider the following two cases. 

  **Case A:** In a developing district, donor agency aid is conditioned on the adoption of open competitive tendering and mandatory asset declarations. Councillor Amina opposes this. She uses a discretionary constituency fund to pay secondary-school fees for children in her ward. Part of this fund was generated by a fifteen per cent markup on a road contract awarded to a firm owned by her brother-in-law; the firm employs forty people from the ward. Amina was re-elected with seventy per cent of the vote. She argues that the donor's conditions are a foreign imposition. In her context, looking after one's own people is the primary duty of a representative, and a rule that turns this decency into an offence lacks legitimacy. She notes that refusing to favour kin in her setting is experienced as a betrayal of duty.

  **Case B:** In a wealthy democracy, a Mayor steers city contracts to a firm whose owner later donates to her re-election campaign and funds a local charity. All transactions are fully disclosed and lawful under local statutes.

  Your module has introduced the **Symmetry Requirement**: any argument that a practice counts as corruption in a poor, clientelist setting but not in a comparable rich-country setting must identify a difference between the two cases that is not merely the fact that one practice is foreign or unfamiliar, not merely the fact that one is illegal where the other is legal, and is defensible on grounds independent of which country we are talking about. You have also studied the structural reply to the claim that informal payments 'grease the wheels' of bureaucracy: actors who profit from the grease acquire a reason to keep the wheels slow.

  Evaluate the legitimacy of the donor's conditions. In your answer, you must: (1) assess what Amina's objection would have to establish to succeed under the Symmetry Requirement; (2) determine whether the comparison with Case B supports or undermines her position; and (3) conclude whether the donor is justified in enforcing universalist procedures despite the local experience of betrayal.

  ***

  # Model Answer

  The legitimacy of the donor's conditions hinges on whether Amina's practice is defensible as a distinct moral system or indefensible as a structurally harmful form of particularism. To succeed, Amina's objection must establish that her actions serve a public good that universalist procedures would destroy, without relying on the claim that "culture differs." Under the Symmetry Requirement, she cannot argue that her actions are permissible simply because they are local norms, unless she can show that the Rich Mayor's actions are morally equivalent yet treated differently without justification.

  Amina's strongest argument relies on the concept of dense reciprocal obligation. In her context, the state is absent, and survival depends on networks of kinship. Refusing to favour kin is not neutrality; it is a betrayal of the specific duty she was elected to fulfill. If the donor's conditions prevent her from paying school fees, they may be enforcing procedural purity at the cost of substantive welfare. However, this argument only holds if the *method* of provision is necessary. Here, the markup on the brother-in-law's contract introduces a structural inefficiency. This is where the structural reply to the 'greasing the wheels' argument becomes decisive. Even if the markup allows the contract to proceed quickly, the beneficiary (the brother-in-law) now has an incentive to maintain a bureaucracy slow enough to require such markups in the future. Thus, the practice sustains the very dysfunction that makes the informal network necessary. Amina's defense collapses if her method perpetuates the scarcity that justifies her role.

  Comparing Case A with Case B under the Symmetry Requirement reveals a tension. The Rich Mayor also exchanges public contracts for political support and social benefit (charity). If we condemn Amina but praise the Mayor, we violate symmetry unless we identify a relevant structural difference. Legality is not a sufficient difference, as laws can be unjust or captured. The relevant difference lies in the impact on basic rights versus political advantage. Amina's funds provide secondary education, a basic capability, whereas the Mayor's charity is often discretionary. However, the mechanism in Case A (contract markup) directly drains public resources needed for infrastructure, whereas campaign donations in Case B, while influencing access, do not always directly inflate contract costs in the same visible way. Yet, if the Mayor's steering results in substandard roads, the harm is identical. Therefore, symmetry demands we either condemn both as corrupt exchanges of public trust for political capital, or accept both as legitimate particularism. Given the donor's mandate to ensure aid effectiveness, accepting both is impossible.

  Consequently, the donor is justified in enforcing universalist procedures, but not because Amina's motives are evil. They are justified because the *structure* of clientelism creates a collective action problem that traps the community in inefficiency. The Symmetry Requirement does not save Amina because the structural harm of the markup is universal, regardless of intent. The experience of betrayal felt by her constituents is real, but it is a betrayal engineered by a system that makes survival depend on rule-breaking. The donor's conditions aim to break that cycle. While the transition may feel like an imposition of foreign norms, the alternative is validating a system where public office is merely a node in a private exchange network. The donor must enforce the rules, but should recognize that without alternative welfare provisions, the 'betrayal' Amina fears will remain a potent political force. Universalism is legitimate not because it is Western, but because it is the only framework that resolves the incentive to keep the wheels slow.

  ***

  # Marking Scheme

  **Total Marks: 20**

  **1. Analysis of Amina's Moral Claim (4 Marks)**
  *   **Criteria:** Candidate identifies that Amina's defense rests on 'duty to kin' vs. 'abstract rule' and acknowledges the sincerity of the 'betrayal' claim.
  *   **Common Error:** Dismissing Amina's view as mere excuses or cultural confusion without engaging with the moral weight of reciprocal obligation.

  **2. Application of the Symmetry Requirement (4 Marks)**
  *   **Criteria:** Candidate explicitly compares Case A and Case B, seeking a structural difference rather than relying on legality or geography to distinguish them.
  *   **Common Error:** Stating the Rich Mayor is different simply because "it is legal there" or "rich countries are different," which violates the requirement's definition.

  **3. Use of the Structural Reply to 'Grease' (4 Marks)**
  *   **Criteria:** Candidate explains that benefiting from inefficiency creates an incentive to maintain inefficiency, undermining the efficiency defense of the markup.
  *   **Common Error:** Treating the 'grease' argument as purely empirical (sometimes it works, sometimes not) without addressing the *incentive structure* to keep wheels slow.

  **4. Judgment on Donor Legitimacy (4 Marks)**
  *   **Criteria:** Candidate reaches a conclusion on the donor's conditions that follows logically from the symmetry and structural analysis (e.g., justified due to structural harm, despite moral costs).
  *   **Common Error:** Concluding that "both sides have a point" without resolving the tension regarding the donor's specific mandate to prevent resource leakage.

  **5. Conceptual Integration and Clarity (4 Marks)**
  *   **Criteria:** Answer flows logically, defining terms in prose where needed, and avoids reliance on external authority or named theorists.
  *   **Common Error:** Over-reliance on definitions of corruption (e.g., "abuse of power") without applying them to the specific mechanics of the cases provided.

  **Examiner's Note on the Symmetry Requirement:**
  Many candidates will *name* the Symmetry Requirement but fail to *apply* it. A passing answer states the requirement; a good answer uses it to force a dilemma (e.g., "If Amina is corrupt, the Mayor must be too, unless..."). Marks for Criterion 2 are only awarded if the candidate attempts to find a defensible independent ground for distinction (e.g., basic needs vs. campaign finance) rather than falling back on legality.

  **Description of a Long but Weak Answer:**
  A weak answer will likely be verbose but circular. It will spend 400 words defining corruption and discussing cultural relativism in the abstract. It will mention Amina's brother-in-law but fail to link the markup to the structural incentive to maintain bureaucracy slowness. It will conclude that corruption is "complex" and "context-dependent" without taking a stance on the donor's conditions. It will treat the Rich Mayor case as an afterthought rather than a structural mirror used to test the argument.
