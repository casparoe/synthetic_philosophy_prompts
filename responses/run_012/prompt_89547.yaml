answer: |-
  It is a pleasure to engage with this dispute. It is one of those rare philosophical moments where a public scandal intersects with technical metaphysics, and unfortunately, it is also one where the heat of the controversy has often obscured the light of the argument. As someone who has spent considerable time with Rorty's texts and the analytic literature on truth, and who tries to remain mindful of the historian's caution regarding causal attribution, I shall attempt to untangle this knot for you.

  My approach will be to treat the Sokal affair not as a verdict on pragmatism, but as a stress test. We must distinguish between the *philosophical commitments* of antirepresentationalism and the *sociological habits* of those who claim to adhere to it. Your friend's *reductio* relies on conflating the two.

  Here is my analysis, structured according to your requests.

  ### 1. Disentangling the Claims of Antirepresentationalism

  The term 'antirepresentationalism' is often used as a bludgeon, but in Rorty's work, it comprises several distinct layers. We must assess the Sokal affair's impact on each layer individually.

  **A. The Metaphysical Claim: No relation of correspondence explains truth.**
  *The Claim:* True sentences are not true because they 'match' or 'mirror' a mind-independent reality. There is no explanatory relation between word and world.
  *Impact of Sokal:* **Negligible.**
  *Reasoning:* The Sokal affair demonstrates that one can write nonsense about the physical world and have it published in a humanities journal. It does not demonstrate that truth *is* correspondence. To prove your friend's case, one would need to show that the *only* way Sokal's paper could be identified as nonsense was by checking its correspondence to reality. However, Sokal identified it as nonsense because it violated the *inferential rules* of the physical vocabulary. Rorty can agree that the paper was gibberish without conceding that 'gibberish' means 'failure to correspond'. For Rorty, it means 'failure to cohere with the practices that allow us to cope with the world'. The metaphysical thesis remains untouched by an editorial error.

  **B. The Deflationary Treatment of Truth.**
  *The Claim:* 'True' is not a substantive property but a device for endorsement (disquotationalism). To say 'p is true' is just to assert 'p'.
  *Impact of Sokal:* **None.**
  *Reasoning:* A deflationist can condemn Sokal's article just as vigorously as a realist. They simply analyse the condemnation differently. To say the article is 'false' is to say 'do not believe the sentences in this article'. The affair shows that the editors *did* endorse sentences they should not have. This is a failure of assertion, not a failure of the theory of truth.

  **C. The Ethnocentric Account of Justification.**
  *The Claim:* Justification is always relative to a community and its norms; there is no 'God's eye view'.
  *Impact of Sokal:* **Moderate, but ambiguous.**
  *Reasoning:* This is where the pressure is highest. If justification is merely social, did the *Social Text* editors not justify the article relative to *their* community?
  *Analysis:* Here we must be precise. Rorty does not say 'whatever a community believes is justified'. He says justification is *a matter of* social practice. The *Social Text* editors failed by the standards of the broader intellectual community, which expects claims about physics to be vetted by physicists. They retreated into a sectarian echo chamber. This is a failure of *social* justification, not a vindication of it. However, a critic might argue that without an appeal to 'Reality' as the final court of appeal, there is no leverage to tell the editors they *ought* to have consulted physicists. This is a live dispute (see Section 4).

  **D. Science as One Vocabulary Among Others.**
  *The Claim:* Natural science is not the 'One True Description' of the world, but a vocabulary excellent for prediction and control.
  *Impact of Sokal:* **Significant, but often misread.**
  *Reasoning:* Sokal's hoax relied on the premise that literary theorists were treating scientific terms as mere metaphors. Rorty agrees with Sokal here: when you are doing physics, you must play by the rules of physics. Rorty's claim is not that physics is *wrong*, but that its success does not prove it is the *only* valid vocabulary (e.g., for moral deliberation). The affair shows the danger of importing the scientific vocabulary into literary criticism without respecting its rules. Rorty would argue this confirms his view: vocabularies have different purposes, and confusing them leads to disaster.

  **E. No Principled Difference Between Physics and Criticism.**
  *The Claim:* This is a caricature often attributed to Rorty, but strictly speaking, he denies it.
  *Impact of Sokal:* **Strong refutation of the caricature, not Rorty.**
  *Reasoning:* Rorty explicitly distinguishes between vocabularies used for causal explanation (science) and those used for self-creation or solidarity (arts/humanities). The *Social Text* editors acted as though there were no difference. Sokal proved that there *is* a difference in practice. Since Rorty already acknowledges this functional difference, the affair actually vindicates Rorty against the stronger (and cruder) constructivists.

  ### 2. The Analysis in Reverse: What Rorty's Framework Reveals

  If we invert the lens and view the Sokal affair through Rorty's specific pragmatist toolkit, several features emerge that the standard 'Science vs. Relativism' narrative obscures.

  **Conversational Care vs. Representational Accuracy**
  Your friend argues the editors lacked a 'principled standing' to call the article gibberish. I propose, and this is my own reading of the situation, that Rorty would describe the failure as one of *conversational responsibility*.
  For Rorty, objectivity is intersubjectivity. To be objective is to subject your beliefs to the scrutiny of as many diverse peers as possible. The *Social Text* editors failed not because they ignored the 'World', but because they ignored the *physicists*. They broke the web of solidarity that keeps a community honest. In *Contingency, Irony, and Solidarity*, Rorty argues that we avoid cruelty and error by expanding the 'we'. The editors narrowed the 'we'. Thus, the affair is not a failure of antirepresentationalism, but a failure of the *social ethics* that Rorty believes must replace epistemology.

  **Causation Without Justification**
  This is the technical crux. Rorty famously insists that the world can *cause* us to have beliefs, but only other beliefs can *justify* beliefs.
  *Application:* The physical world did not 'justify' Sokal's rejection of the article. Sokal and the subsequent community of scientists *justified* the rejection. However, the physical world *caused* the article to be nonsensical (in the sense that the claims did not cash out in successful prediction or coherence with established causal laws).
  Rorty's framework allows him to say the article was nonsense because it failed to function within the language game of physics. He does not need 'correspondence' to explain this. He only needs to point to the *consequences* of adopting those sentences. If you build a bridge using Sokal's physics, the bridge falls. The falling bridge is not 'Truth' revealing itself; it is the world exerting causal friction. Rorty has ample room to call it gibberish on these pragmatic grounds.

  **Politics vs. Theory**
  In his later work, particularly *Achieving Our Country*, Rorty criticised the American academic Left for substituting cultural theory for practical politics. He argued that obsessing over the 'constructedness' of reality distracted from concrete reform.
  *Historical Observation:* The *Social Text* editors were precisely the sort of 'theorists' Rorty had begun to distance himself from by 1996. They were engaged in what Rorty might call 'spectator politics'—debating the nature of reality rather than alleviating suffering or improving institutions.
  *Verdict:* Viewed this way, the Sokal affair is not an attack on pragmatism, but a vindication of Rorty's specific critique of 'Theory'. It shows what happens when you prioritise ideological signalling over practical competence. Rorty would likely say: 'I told you so.'

  ### 3. The Verdict: Test or Category Mistake?

  Here is my honest verdict, distinguishing the philosophical from the historical.

  **Is this a genuine test of antirepresentationalism?**
  No. It is a category mistake.
  Antirepresentationalism is a thesis about the *status* of truth claims (metaphysics/semantics). The Sokal affair is an episode about *competence and procedure* (epistemology/sociology of knowledge).
  Your friend's *reductio* relies on a hidden premise: *Only a belief in correspondence to a mind-independent world provides the normative force necessary to condemn nonsense.*
  For your friend's *reductio* to go through, the following would have to be true:
  1.  That social norms (peer review, community standards) are insufficient to generate the obligation to tell the truth.
  2.  That the 'feeling' of constraint by reality is actually the constraint of reality itself, and that removing the metaphysical picture removes the constraint.

  I contend both are false. We have normative force because we care about the consequences of being wrong. A pragmatist avoids nonsense not to honour the World, but to avoid embarrassment, failure, and the breakdown of communication. The *Social Text* editors were willing to risk those breakdowns for ideological points. That is a moral/practical failure, not a metaphysical one.

  **Historical Caution:**
  As a historian, I must add that attributing the editorial policy of *Social Text* solely to their epistemological commitments is risky. Journals often publish outside their strict competence due to vanity, pressure to be 'cutting edge', or simple negligence. To claim the hoax succeeded *because* of antirepresentationalism is to ignore the mundane realities of academic publishing. It is a classic post hoc ergo propter hoc fallacy to assume the philosophy caused the negligence, rather than the negligence exploiting the philosophy.

  ### 4. Settled vs. Contested

  Finally, I must demarcate the ground, as you requested. There are areas where the dust has settled, and areas where the debate remains live.

  **Settled (Consensus among specialists):**
  *   **Rorty's Position:** It is settled that Rorty denied the correspondence theory of truth and denied that science has a metaphysical privilege over other vocabularies.
  *   **The Hoax:** It is settled that *Social Text* did not subject the article to external peer review by physicists, a standard procedural failure.
  *   **Rorty's Reaction:** It is a matter of record that Rorty criticised the postmodernists targeted by Sokal. He did not defend *Social Text*. He distinguished his pragmatism from their 'constructivism'.

  **Contested (Live Disputes):**
  *   **The Normative Force of Solidarity:** This is the crux of your dispute. Critics (like Hilary Putnam, in his later period, or various analytic realists) argue that Rorty's 'solidarity' is too thin to prevent 'mob rule' or sectarian nonsense like Sokal's. They argue that without 'rational constraint by the world', Rorty cannot explain why the editors *should* have listened to physicists. Rorty scholars counter that 'solidarity' includes the obligation to listen to those with relevant expertise. *This is where your argument with your friend truly lies.*
  *   **Constructivism vs. Pragmatism:** There is ongoing dispute over whether the *Social Text* editors were actually Rortyan pragmatists or strong social constructivists (who believe facts are literally made by society). If they were the latter, Sokal refutes them, not Rorty. If they were the former, the pressure on Rorty is higher. My reading is that they were closer to the former (Latourian/Foucaultian), which insulates Rorty.
  *   **Deflationism and Normativity:** In the analytic literature, it is contested whether a deflationary theory of truth can sustain the normative 'ought' of assertion (i.e., 'you ought to believe only what is true'). Your friend assumes it cannot; many contemporary deflationists argue it can, via norms of assertibility.

  **Conclusion**

  My view is that your suspicion is correct, though it requires the philosophical nuance outlined above. The Sokal affair displays carelessness and ideological vanity. It shows that abandoning correspondence does not automatically grant you wisdom. But it does not show that abandoning correspondence leaves you without resources to detect nonsense.

  Rorty's toolkit contains the concept of *functional adequacy*. Sokal's paper was functionally inadequate for the purposes of physics. The editors failed to recognise the functional boundaries of their own vocabulary. That is a failure of pragmatism, not a failure *caused* by pragmatism. Your friend's *reductio* only works if one assumes that the *only* thing stopping us from embracing nonsense is the fear of misrepresenting Reality. I do not think that is true; the fear of uselessness is quite sufficient.

  I hope this provides the settlement you were looking for. The affair is a cautionary tale for the academic left, but it is not a refutation of neopragmatism.
