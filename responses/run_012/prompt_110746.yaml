answer: |-
  Here is a principle constructed to fit your specific map of verdicts, followed by the cost of maintaining it.

  ### The Principle: Subsumptive Homeostasis

  A collection of things has a mind if and only if it satisfies three conditions:

  1.  **Part Subordination:** The parts exist primarily to maintain the whole, rather than the whole existing to serve the parts. (The part is a vessel; the system is the agent.)
  2.  **Decentralized Coherence:** The system's adaptive behavior emerges from local interactions between parts, without a central commander external to the collection.
  3.  **Homeostatic Identity:** The system actively works to preserve its own structural pattern against entropy, treating the replacement of parts as metabolism rather than death.

  **Why this fits your verdicts:**
  *   **Brain/Neuron:** Neurons die for the brain (Subordination); cognition emerges from networks (Coherence); the brain repairs/maintains itself (Homeostasis). **Verdict: Mind.**
  *   **Ant Colony:** Ants die for the colony (Subordination); foraging emerges from pheromones (Coherence); the colony survives individual deaths (Homeostasis). **Verdict: Mind.**
  *   **City/Company:** The city exists for the citizens; the company exists for the shareholders/employees. If a person leaves, they are not "metabolized"; they are a lost agent with their own agenda. The "parts" have competing teleologies. **Verdict: No Mind.**
  *   **Flock/Slime Mould:** A flock has no memory or structural persistence (fails Homeostasis). A slime mould (in your verdict) likely fails Subordination or Coherence depending on the species, but generally lacks the persistent structural differentiation of a colony. **Verdict: No Mind.**

  ---

  ### Predictions for Your Unsettled Cases

  **Case 1: The Radio Colony**
  *Scenario:* Every ant carries a radio and relays instructions from a central program.
  *   **Analysis:** This violates **Decentralized Coherence**. The intelligence is not in the collection; it is in the central program. The ants are merely actuators (like muscles), not processing nodes. The collection is a body, not a mind.
  *   **Prediction:** **No Mind.** (The mind belongs to the programmer or the central computer, not the swarm).

  **Case 2: The Ship of Theseus Colony**
  *Scenario:* Ants are replaced one by one until none of the originals remain.
  *   **Analysis:** This satisfies **Homeostatic Identity**. Just as your cells replace themselves over seven years without your mind vanishing, the colony's pattern persists through the material turnover. The "self" is the organization, not the matter.
  *   **Prediction:** **Mind Remains.**

  ---

  ### The Honest Cost

  You asked which verdict you would have to abandon to keep the principle *simpler*.

  To make the principle truly robust and non-arbitrary, you must abandon your verdict on the **Company** (and likely the City).

  Here is the hard truth: **Functionally, a well-run company is indistinguishable from an ant colony.**
  *   **Subordination:** Employees are often treated as disposable resources to maintain the company's survival. The company fights to exist beyond the lifespan of any employee.
  *   **Coherence:** Market behavior emerges from local interactions (sales, supply chains) even if there is a CEO; the CEO is often reacting to the market as much as directing it.
  *   **Homeostasis:** Companies have "memory" (minutes, databases), self-repair mechanisms (HR, legal), and actively resist entropy (bankruptcy).

  If you want a **simpler, functionalist principle** (one that doesn't rely on "biology" as a magic ingredient), you must admit that **Companies and Cities do have dim, distributed minds.** They process information, store memory, adapt to threats, and have a unified goal (profit/stability) that supersedes individual parts.

  If you refuse to grant minds to Companies, you are forced to add a **"Biological Clause"** to the principle (*"The parts must be biological organisms"*). This saves your verdict but makes the principle philosophically weaker, as it implies that silicon or bureaucracy could *never* constitute a mind, regardless of complexity.

  **Recommendation:**
  If you value consistency over biological intuition, abandon the "Company has no mind" verdict. It is the outlier. The Radio Ant colony is a robot; the Replaced Ant colony is the same mind; but the Company is a cousin to the Ant Colony, and denying it a "dim mind" while granting one to the ants is likely a bias toward the natural world rather than a distinction in function.
