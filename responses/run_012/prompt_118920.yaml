answer: |-
  This is a fantastic epistemic collision. You are essentially asking whether the hermeneutics of archaeology can be reduced to the mathematics of geophysical inversion.

  Your intuition is strong: structurally, you are describing the same logical bottleneck. However, your partner is right that it is "worse than that." It is not just that her signal-to-noise ratio is lower; it is that the nature of the "model parameters" and the "forward operator" are fundamentally different categories of things.

  Here is the breakdown in your vocabulary, the residue that breaks the mapping, and the verdict on the dog pit.

  ### 1. The Translation (The Isomorphism)

  You can map her workflow onto your inversion framework with high fidelity, provided you accept that her "physics" is behavioral rather than physical.

  *   **The Data ($d$):** The assemblage (pots, bones, cut marks). This maps 1:1 to your seismic traces or MT soundings. It is the observable field.
  *   **The Model ($m$):** The past social/cognitive state (beliefs, institutions, intentions). This maps to your velocity or density model. It is the hidden distribution you want to recover.
  *   **The Forward Operator ($G$):** Formation processes. This is the function $d = Gm$. It includes the physics of decay, sedimentation, and preservation, *plus* the behavioral translation of "belief into action."
      *   *Your guess:* "Formation processes are the forward operator."
      *   *Verdict:* **Correct**, but incomplete. In your world, $G$ is deterministic (wave equation). In hers, $G$ is probabilistic and semantic (people *usually* bury dogs this way when they believe X, but not always).
  *   **Non-Uniqueness:** Equifinality. Different social models produce the same material record.
      *   *Verdict:* **Correct.**
  *   **Regularization:** Ethnographic analogy. You damp your inversion with a "smoothness" constraint or a reference model. She dampens her inversion with "human universals" or specific ethnographic parallels (e.g., "In this region, people currently do X, so they probably did X then").
      *   *Verdict:* **Correct.**
  *   **Resolution:** The granularity of social inference. You can resolve a fault; she can resolve a household. You cannot resolve a pore; she cannot resolve an individual thought.
      *   *Verdict:* **Correct.**

  **Where the mapping holds:** You are right that she is solving an ill-posed inverse problem. She has sparse data, a noisy forward operator, and a massive null space. When she says "we can't know this," she is identifying a null space.

  **Where the mapping strains:** In your work, the null space is a function of *geometry and physics* (e.g., ray coverage). In her work, the null space is often a function of *meaning*.

  ### 2. The Residue Report (What breaks the mapping)

  You asked for the part of her problem that has no counterpart in yours. There are three specific fractures where the geophysical analogy fails.

  #### A. The "Diet vs. Worship" Confidence Gap
  *   **Your Observation:** She claims high confidence on diet (isotopes), low confidence on worship. You view this as variable resolution.
  *   **The Residue:** In your inversion, resolution varies because of data coverage or frequency content. In hers, it varies because of **Causal Coupling Strength**.
      *   *Diet:* The link between "ate maize" and "C13 isotopes in bone" is a biochemical forward operator ($G_{bio}$). It is physically deterministic. $m \to d$ is tight.
      *   *Worship:* The link between "believed in door guardians" and "dog under doorway" is a *symbolic* forward operator ($G_{sym}$). It is loose.
      *   *The Difference:* In geophysics, if the physics is known, the link is necessary. In archaeology, the link is *contingent*. A dog under a door *could* mean guardian, but it could also mean trash, or a sick dog, or a pet that died. The "physics" of symbolism allows multiple distinct models to produce **identical** data, not just similar data.
      *   *Philosophical Term:* **Underdetermination.** In your field, more data usually shrinks the null space. In hers, more data (more dog pits) often just expands the range of plausible symbolic interpretations without shrinking the null space.

  #### B. The Dog Pit (Intentionality vs. State)
  *   **Your Observation:** The argument bottoms out in whether you are *allowed* to attribute a belief. You can't write that in your language.
  *   **The Residue:** You invert for **State** (velocity). She infers **Intent**.
      *   In your world, a high-velocity anomaly is a high-velocity anomaly. It doesn't matter *why* the rock is dense.
      *   In her world, the physical arrangement is identical for "ritual" and "rubbish." The *only* difference is the mental state of the actor 3,000 years ago.
      *   *The Break:* You assume the Model ($m$) is a physical property that exists independently of observation. She is trying to recover a mental state that *ceased to exist* the moment the action was completed.
      *   *The "True/False" Problem:* You ask if "they thought the doorway needed a guardian" is true or false. In your field, "Velocity = 2000m/s" is true or false (verifiable by drilling). In hers, "They believed X" is a **narrative construct**. It is "true" only insofar as it makes the rest of the assemblage coherent. It is not a physical parameter waiting to be measured; it is a story that renders the data sensible.

  #### C. Non-Stationarity of the Forward Operator
  *   **Your Observation:** She says past institutions have no modern analogue. You call this non-stationarity.
  *   **The Residue:** In geophysics, you assume the **Wave Equation is Time-Invariant**. Maxwell's equations didn't change in the Jurassic.
      *   In archaeology, the "equations of human behavior" ($G$) *do* change.
      *   If she uses ethnographic analogy (Regularization) based on modern humans, she is assuming $G_{past} \approx G_{present}$.
      *   When she says "no modern analogue," she is admitting that **the Forward Operator itself is unknown.**
      *   *The Break:* You are solving $d = Gm$ where $G$ is known, $m$ is unknown. She is often solving $d = Gm$ where **both $G$ and $m$ are unknown.** You cannot invert for the model if you don't know the physics that generated the data.

  ### 3. The Verdict: Vocabulary Gap or Vagueness?

  You asked: *Is it a hole in my vocabulary, or is "they believed X" doing less work than it sounds?*

  It is a hole in your vocabulary, specifically regarding **Ontology** (what kind of thing exists).

  In geophysics, you are a **Realist**. You believe the velocity structure exists objectively, and your job is to approximate it.
  In archaeology, when she talks about "beliefs" or "institutions," she is often engaging in **Constructivism**. The "belief" is not a hidden scalar field like velocity. It is a semantic label applied to a pattern of behavior to make it intelligible to *us*.

  **The Dog Pit Specifics:**
  Can the dog pit be settled in your terms? **No.**
  Here is why the framing breaks:
  1.  **Identical Data:** "Rubbish" and "Ritual" produce identical $d$. In your world, this puts the distinction in the Null Space. You would report: "Unable to distinguish fluid type."
  2.  **Mandatory Interpretation:** She cannot report "Null Space." Her job is not just to map the subsurface; it is to write a history. She *must* choose a model to create a narrative.
  3.  **Truth Conditions:** If she says "This is a foundation deposit," and you ask "Prove it," she cannot drill. She can only say, "This interpretation makes the most sense given the other pots we found."
      *   This is not Inversion. This is **Abduction** (Inference to the Best Explanation).
      *   *Explanation:* Deduction is $A \to B$. Induction is $A, A, A \to B$. Abduction is "We observe $B$, and $A$ would explain $B$, therefore $A$ is plausible."
      *   Geophysics tries to be Deductive/Inductive. Archaeology is fundamentally Abductive.

  **Is she guessing and dressing it up?**
  No. She is applying **Coherence Constraints**.
  In your inversion, you use "Smoothness" to stabilize the solution. In her inference, she uses "Cultural Coherence."
  *   *Example:* If she finds 50 dog pits under doorways and 0 in middens, the "Rubbish" model becomes incoherent (why only under doors?). The "Ritual" model becomes coherent.
  *   She isn't measuring the belief; she is measuring the *pattern's consistency*.

  ### Summary for the Argument

  You are right that the *logic* is the same (ill-posed inverse problem). She is right that the *objects* are different.

  1.  **Tell her:** "I accept that your Forward Operator ($G$) includes symbolic behavior, which is non-unique and non-stationary. I accept that 'Belief' is not a physical parameter but a semantic one."
  2.  **Ask her:** "If 'Belief' is not a physical parameter, then when you write 'They believed X,' are you describing a reality (Realism) or are you proposing a narrative that organizes the data (Constructivism)?"
  3.  **The Dog Pit:** Admit that in your terms, the dog pit is in the Null Space. Acknowledge that her job requires her to regularize the Null Space with a story, whereas your job allows you to leave the Null Space empty.

  **The Punchline:**
  You solve for the Earth as it *is*. She solves for the Past as it *makes sense*.
  The residue isn't vagueness; it's that she is inverting for **Meaning**, and Meaning does not obey the conservation of energy. It obeys the logic of language. You can't write a wave equation for a metaphor.

  When she says "It's worse than that," she means: "My physics changes, my parameters are mental states that no longer exist, and my solution must be a story rather than a map." She is right.
