answer: |-
  Two co-trustees of a private family foundation, Ali and Blake, hold equal veto power over which historical figures are commemorated in the foundation's private office, visible only to them. Ali demands a portrait of Figure X, whom Blake views as a tyrant; Blake demands a portrait of Figure Y, whom Ali views as a tyrant. The status quo is bare walls. A bundled motion proposes hanging both portraits. Substantively, each trustee values the commemoration of their preferred figure enough to tolerate the presence of the other's, ranking the bundled state of affairs strictly above the bare walls, and each knows the other holds this same substantive ranking. Yet, each votes against the bundle. This scenario exercises compromise as a **trade across issues**, not the division of a disputed good.

  **Demonstration**

  **Value Systems:**
  Let $O$ be the outcome state and $A$ be the action taken.
  Ali's Outcome Utility: $U_A(\text{X only}) = 10$, $U_A(\text{X+Y}) = 5$, $U_A(\text{None}) = 0$.
  Blake's Outcome Utility: $U_B(\text{Y only}) = 10$, $U_B(\text{X+Y}) = 5$, $U_B(\text{None}) = 0$.
  Both know these functions. The bundle (X+Y) yields 5 utils for each, strictly better than the status quo (0).

  **Gains-from-Trade Verdict:**
  The exchange rate is 1 unit of "tolerating the rival's figure" for 1 unit "securing one's own figure."
  Net Gain: Both parties move from 0 utils (Status Quo) to 5 utils (Bundle).
  Verdict: The bundle is a strict Pareto improvement over the status quo. Under a standard trade model, refusal is irrational.

  **Party Verdict and Constraint:**
  Verdict: Both vote No.
  Constraint: **The Non-Complicity Principle.** Each party holds a deontological constraint: "I cannot perform an action that constitutes formal endorsement of a tyrant."
  Value of Action: $V(\text{Vote Yes}) = U(\text{Outcome}) - \infty$ (if outcome includes endorsing a tyrant). $V(\text{Vote No}) = U(\text{Outcome})$.
  Because voting for the bundle requires formally endorsing the tyrant-figure, the action itself is forbidden, regardless of the outcome utility.

  **Structural Feature:**
  The work is done by the **separation of Outcome-Value from Act-Value**. The trade model assumes agents maximize $U(\text{Outcome})$. This case introduces $V(\text{Act})$ as lexically prior.
  If Removed: If agents care only about outcomes (ignoring the moral quality of the vote itself), they accept the bundle. The case collapses into a standard gains-from-trade situation where refusal is irrational.

  **Strongest Attack:**
  A defender of the trade model argues: "Refusal is itself just a ranking over acts. We can expand the 'outcome' space to include 'Ali voted cleanly.' If Ali prefers {None + Clean Hands} over {X+Y + Complicit Hands}, then the trade model still holds; the price of complicity was simply too high."
  Evaluation: This attack can be met. While formally consistent, it renders the model tautological. If any refusal can be modeled as a preference for a different outcome description (including the history of the act), the model loses its power to distinguish between *unable* to compromise (structural impossibility) and *unwilling* to compromise (preference mismatch). It saves the model by empting it of predictive content regarding policy agreement.

  **Conclusion:**
  The case establishes that the trade model requires an additional premise: **that each party's ranking is exclusively over outcomes and that each is prepared to act on outcome-rankings.** This is a limitation of the model, not merely a description. It shows the trade model applies only to pragmatic conflicts where principles are not constitutive of the agents' agency. Compromise involving deep moral integrity cannot be modeled as a trade of outcomes, because the *means* of the compromise (the joint vote) violates the integrity constraint even if the *end* (the policy state) is preferred.
