          *   Thick: Violation of sampling protocols mandated by law/role.
      *   *Failure 3: Dismissing residents' complaints.*
          *   Thin: No investigation launched.
          *   Thick: Breach of public trust/administrative duty.
      *   *Failure 4: The physical corrosion itself.*
