  4.  **Analyze Causation (Difference-Making vs. Norm-Violation):**
      *   *Difference-Making:* The lack of orthophosphates is the primary physical cause. Counterfactually: Add chemicals -> No lead spike. This looks like a 'thin' omission that does heavy causal lifting.
      *   *Norm-Violation:* The reason we care about *who* caused it is tied to 'thick' omissions. If a random hacker turned off the chemical pump, it's a thin absence caused by an act. If the official *didn't order* it, it's a thick omission.
      *   *The Tension:* In Flint, the 'thin' omission (no chemicals) is physically sufficient for the outcome. But we identify it as *the* cause because of the 'thick' context (they were supposed to add them). If it were a new pipe system, no chemicals might be fine (no lead to leach). So the causal relevance depends on the background conditions (old pipes) + the norm (treat the water).

  5.  **Evaluate the Norm-Relative Account:**
      *   *Support:* The case strongly suggests that without the normative layer (regulations, roles), the omission is just a background condition. Why isn't the *manufacture of lead pipes 50 years ago* the cause? Because that's a fixed background. Why isn't the *lack of orthophosphates* the cause? Because in some contexts, you don't need them. You need them *because* of the norm/regulation regarding lead safety. Thus, the 'thick' omission picks out the causally relevant absence.
      *   *Collapse Risk:* Does saying "They caused it because they should have acted" just mean "They are to blame"? If causation requires a norm, does every breach of duty become a cause? In Flint, the physical mechanism is clear (chemistry). The norm identifies the *agent*. If we say the omission is only a cause *because* of the norm, we risk making causation normative. But if we say the omission is a cause *regardless* of the norm (thin), we face the problem of infinite absences (e.g., "The President didn't fly in and fix it").
