answer: |-
  It is a pleasure to speak with someone who has spent a life in the lab. You have a well-justified instinct: your friend's summary has the smooth, confident surface of a popularization that has sanded off all the friction points where the actual philosophy lives. To a physicist, it reads like a derivation where the boundary conditions have been quietly ignored to make the integral solvable.

  Your suspicion is correct. The summary conflates epistemology (how we should think) with metaphysics (what chance *is*), and it treats a substantive, controversial normative principle as a tautology.

  Here is the audit you requested, sentence by sentence, followed by the specific conceptual clarifications you asked for.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "Lewis's Principal Principle is the rule that your personal degree of belief in any event should equal its objective chance of occurring."**
  *   **Verdict:** **Nod, with a squint.**
  *   **The Physics Analogy:** This is like saying "The map should match the territory." It captures the spirit, but technically, the Principal Principle (PP) is a constraint on *initial* credence conditional on knowing the chance.
  *   **The Philosophical Nit:** It omits the crucial condition: *"conditional on having no inadmissible information."* If you know the chance is 50%, but you also have a crystal ball telling you the outcome, your belief should not be 50%. The PP governs how chance *constrains* belief, not just that they should match.

  **2. "If the doctor says there's a 3% chance of a side effect, then 3% is exactly how confident you should be that you'll get it, and anything else is irrational."**
  *   **Verdict:** **Wince.**
  *   **Why:** This conflates *statistical frequency* or *epistemic probability* (the doctor's model based on past trials) with Lewisian *objective chance*.
  *   **The Problem:** In philosophy of probability, "objective chance" is a metaphysical property of the physical setup (like the bias of a coin or the wavefunction), not a summary of clinical trial data. If you have specific genetic markers (inadmissible information regarding the general chance), your credence should deviate from the 3% population frequency. The doctor's number is often a frequentist estimate, not the singular objective chance Lewis is talking about.

  **3. "Chance, on this view, just is the credence of a perfectly informed agent, so the principle is really a definition of objective chance rather than a constraint on it..."**
  *   **Verdict:** **Plainly Wrong.**
  *   **Why:** This inverts Lewis's entire project. Lewis was a realist about chance (specifically, a Humean Supervenient). He believed objective chance is a feature of the world (supervening on the pattern of events), and the Principal Principle is a *bridge principle* connecting that worldly feature to our rational minds.
  *   **The Con:** If chance were *defined* as the credence of a rational agent, there would be no need for a "Principal Principle." It would be a truism. Lewis wrote the PP precisely because he thought chance was *not* just subjective confidence. This sentence collapses objective chance into subjective belief, which is exactly what Lewis argued against.

  **4. "...to say an event has a 50% chance is just to say that a perfectly rational, fully informed observer would be 50% confident."**
  *   **Verdict:** **Plainly Wrong (The "Conditional Analysis" Error).**
  *   **Why:** This is known as the "conditional analysis of chance," and Lewis explicitly rejected it. If this were true, chance would lose its explanatory power. We want to say the coin has a 50% chance *because* of its physical symmetry, which *then* dictates the rational credence. If you define the chance *as* the credence, you cannot use the chance to explain why the credence is rational. It makes the principle circular.

  **5. "The principle also explains why gambling works the way it does: because your credence has to track the chance, you should take any bet offered at odds better than the chance, which is why casinos can't be beaten in the long run."**
  *   **Verdict:** **Smuggled Thought.**
  *   **Why:** The PP is a norm for *belief*, not *action*. To get from "belief" to "betting," you need Decision Theory (specifically, Expected Utility Theory).
  *   **The Con:** The PP tells you what to *believe*. Decision Theory tells you what to *do* given those beliefs. While they work together, the PP does not *explain* why casinos win. Casinos win because the *objective chances* are structured to yield negative expected value for the player. The PP just tells you to recognize that fact. Your friend is conflating epistemology with prudence.

  **6. "Lewis did add a caveat about information that isn't part of the chance setup, but that's a technicality about old evidence and doesn't bite in everyday cases."**
  *   **Verdict:** **Plainly Wrong (and Dangerous).**
  *   **Why:** This refers to the **Admissibility Clause**, and it is not a technicality; it is load-bearing. It is not about "old evidence" (a Bayesian problem regarding confirmation); it is about information that gives you a "crystal ball" view of the outcome.
  *   **The Risk:** Without this caveat, the PP leads to logical contradictions. If you know the future outcome (inadmissible information), the PP would tell you to ignore that knowledge and trust the chance, which is irrational. The caveat is what prevents the principle from demanding you ignore direct evidence of the outcome.

  ---

  ### Part 2: The Load-Bearing Caveat (Admissibility)

  You suspected the caveat was load-bearing. You are right. Here is why a philosopher (and a physicist) should care.

  Lewis defines a piece of information as **inadmissible** if it gives you information about the *outcome* of the chance process that bypasses the chance itself.
  *   **Admissible:** The coin is fair (Chance = 0.5). The coin has been tossed 1000 times and landed heads 500 times (Historical data).
  *   **Inadmissible:** You have a time machine and have seen the coin land heads. Or, in a deterministic world, you know the exact initial conditions and laws of motion.

  **Why it bites:**
  If the world is deterministic (as classical physics suggests), the objective chance of any future event is either 0 or 1. If you know the laws and the initial conditions (which Lewis considers inadmissible for the purpose of *chance* ascriptions), your credence should be 0 or 1. But we talk about chances as non-extreme values (e.g., quantum mechanics).
  The admissibility clause is Lewis's way of saying: "Align your belief with the chance, *unless* you have information that effectively 'solves' the chance process."

  In your friend's draft, dismissing this as a "technicality" is like dismissing the uncertainty principle as a technicality in quantum mechanics. It defines the domain where the principle applies. Without it, the PP collapses into a demand that you ignore evidence you actually possess.

  ### Part 3: Principal Principle vs. Principle of Indifference

  This is a common confusion, as both deal with assigning probabilities, but they operate in opposite directions.

  **The Principle of Indifference (PoI):**
  *   **Context:** Ignorance.
  *   **Rule:** If you have no reason to prefer outcome A over outcome B, assign them equal probability.
  *   **Basis:** Symmetry of knowledge.
  *   **Problem:** It is notoriously fragile (Bertrand's Paradox). Depending on how you describe the problem (e.g., volume vs. surface area), you get different probabilities.
  *   **Status:** Many modern philosophers view it as suspect or limited.

  **The Principal Principle (PP):**
  *   **Context:** Knowledge of Chance.
  *   **Rule:** If you know the objective chance is $x$, assign credence $x$.
  *   **Basis:** Rational constraint imposed by the world.
  *   **Relation:** The PP is often seen as the *successor* to the PoI. Instead of saying "I have no idea, so I'll split it 50/50," the PP says "The world tells me it's 50/50, so I'll split it 50/50."
  *   **Status:** Still the dominant view on how chance relates to credence, though modified (e.g., by David Lewis himself later, and by philosophers like Ned Hall) to handle the "Big Bad Bug."

  **The "Big Bad Bug" (For your context):**
  Lewis realized a tension in his own view. If objective chances supervene on the total pattern of events (Humean Supervenience), then the *future* pattern of events helps determine what the *present* chances are. But if you have credence about the future events, you implicitly have credence about the present chances. This creates a feedback loop that can make the PP inconsistent. Lewis spent his later years trying to patch this. Your friend's summary implies the PP is a settled, bug-free definition. It is not.

  ### Part 4: What You Can and Cannot Repeat

  If you are discussing this with colleagues or writing about it, here is the safety guide:

  **Safe to assert (Settled/Standard View):**
  *   The Principal Principle is the standard philosophical account of how objective chance constrains rational belief.
  *   It distinguishes between *credence* (subjective belief) and *chance* (objective feature).
  *   It requires an admissibility clause to function logically.

  **Unsafe to assert (Contested/Your Friend's Errors):**
  *   **Do not say:** "Chance is defined as rational credence." (This is subjectivism, not Lewis's view).
  *   **Do not say:** "The PP explains why casinos win." (Decision theory does that; PP just aligns your belief with the house edge).
  *   **Do not say:** "The admissibility clause is just about old evidence." (It is about information regarding the outcome).
  *   **Do not say:** "The PP is a definition." (It is a normative bridge principle).
  *   **Do not conflate:** Clinical frequencies (doctor's 3%) with metaphysical objective chance without qualification.

  ### Summary for the Physicist

  Think of the Principal Principle not as a definition, but as a **boundary condition** for rationality.
  *   **The System:** Your web of beliefs (Credence).
  *   **The External Input:** Objective Chance (a feature of the physical model).
  *   **The Principle:** Your internal state must match the external input, *provided* you haven't measured the outcome directly (Admissibility).

  Your friend's draft tries to turn this boundary condition into an identity statement ($Chance \equiv Credence$). In doing so, he solves the hard problem by deleting one of the variables. It makes for smoother reading, but it won't hold up if you try to use it to do any work.

  You are right to be nervous. The text is seductive because it tells you what you want to hear (that rationality is simple and objective), but it achieves that simplicity by collapsing the distinction between the map and the territory. Lewis's actual contribution was insisting that the territory (Chance) exists independently, and the PP is the rule for drawing the map.
