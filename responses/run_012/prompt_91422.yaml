prompt: |-
  I've been retired from the lab for six years now — thirty-odd years of experimental physics, and I've spent most of my retirement trying to catch up on all the philosophy I never had time for. I've got as far as the philosophy of probability, which is where I've hit a wall, and what I want isn't an explanation from scratch so much as an audit. A friend of mine who writes for a popular science blog sent me the draft of a chapter he calls 'the logic of chance', and his section on Lewis's Principal Principle reads roughly like this (I'm recalling it from the email, so don't hold him to the exact wording): 'Lewis's Principal Principle is the rule that your personal degree of belief in any event should equal its objective chance of occurring. If the doctor says there's a 3% chance of a side effect, then 3% is exactly how confident you should be that you'll get it, and anything else is irrational. Chance, on this view, just is the credence of a perfectly informed agent, so the principle is really a definition of objective chance rather than a constraint on it — to say an event has a 50% chance is just to say that a perfectly rational, fully informed observer would be 50% confident. The principle also explains why gambling works the way it does: because your credence has to track the chance, you should take any bet offered at odds better than the chance, which is why casinos can't be beaten in the long run. Lewis did add a caveat about information that isn't part of the chance setup, but that's a technicality about old evidence and doesn't bite in everyday cases.'

  I've read it four times and I still can't tell whether I'm being informed or conned — the trouble is that it has the shape of things I definately do believe, which is exactly what makes me nervous. Could you go through it more or less sentence by sentence and tell me what someone working on this would nod along to, what they'd wince at, and what is plainly wrong? I'd particularly like to know which parts are doing real work and which are the sort of simplification that quietly turns a substantive thesis into a truism, whether his remarks about betting actually follow from the principle or are a seperate thought smuggled in alongside it, and what a defender of the principle would say the caveat is really there to handle — I have a suspicion it's load-bearing rather than decorative, but I can't yet say why. One last muddle of my own: I keep half-confusing this with the principle of indifference, on account of the names, so I'd be grateful if you'd sort that out too, and flag anything in the summary I should be careful about repeating to other people as though it were settled.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

