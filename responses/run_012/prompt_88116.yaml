answer: |-
  # Activity Title: The Classifier Protocol

  **Concept:** Students act as "human annotators" training an AI to recognize instances of a concept. They must write explicit rules (definitions) to classify cards. The deck is engineered so that feature-based rules inevitably fail via a "transitive chain," forcing them to appeal to context/use to resolve the final borderline case.

  **Category:** "GAMES" (Yes, use the word. The trap is not the word, but the *method* of definition. The fresh examples prevent autopilot.)
  **Time:** 90 Minutes
  **Students:** 15 (3 Groups of 5)

  ---

  ## I. Materials & Setup

  **1. The Decks (3 identical sets):**
  Each group gets a stack of 12 cards. Each card has a title and 3 bullet points describing "observable features."
  *   *Card 1: Grandmaster Chess* (Two players, strict rules, win/loss condition, no physical contact).
  *   *Card 2: TAS Speedrun* (One player, strict rules, win condition, performed on machine, no human opponent).
  *   *Card 3: LARP Weekend* (Many players, loose rules, win/condition ambiguous, physical acting, fictional conflict).
  *   *Card 4: Kids Playing "House"* (Many players, no fixed rules, no win condition, physical props, fictional conflict).
  *   *Card 5: Shadow Boxing* (One player, no opponent, physical movement, simulated conflict).
  *   *Card 6: Bar Brawl* (Two+ people, no rules, physical contact, real conflict, win/loss subjective).
  *   *Card 7: Rigged Slot Machine* (One player, strict rules, win/loss predetermined, money involved).
  *   *Card 8: Military Simulation* (Many players, strict rules, win/loss, real weapons (blanks), high stakes/consequences).
  *   *Card 9: Cat Chasing Laser* (One "player", no rules, physical movement, "predatory" instinct).
  *   *Card 10: Stock Market Day-Trading* (Many players, strict rules, win/loss, high stakes, no physical contact).
  *   *Card 11: Russian Roulette* (Two players, strict rules, win/loss, real lethal consequence).
  *   *Card 12: The "Borderline" Card: Professional Wrestling* (Two players, strict choreography, scripted win/loss, physical contact, audience believes it's a contest).

  **2. The Scoreboard:**
  Whiteboard with three columns (Group 1, 2, 3).
  *   **+10 pts:** Consistent classification (matches previous ruling).
  *   **-5 pts:** Contradicting your own definition.
  *   **+20 pts:** Successfully defending a ruling against a "Challenge."

  **3. Room Setup:**
  Three tables. Each group has a large sheet of paper titled "DEFINITION PROTOCOL" and markers.

  ---

  ## II. Timeline (90 Minutes)

  ### Phase 1: The Setup & The Trap (0–15 mins)
  *   **Instruction:** "You are training a classifier. You cannot use intuition. You must write **Necessary and Sufficient Conditions** for the category **GAMES**. If an item meets all conditions, it is IN. If it misses one, it is OUT."
  *   **Task:** Give them Cards 1, 2, 7 (Chess, Speedrun, Slot Machine). These are "Safe" examples.
  *   **Output:** They must write a definition on the big paper. (e.g., "Must have rules," "Must have a goal," "Must be voluntary").
  *   **Constraint:** They cannot use the word "game" or "play" in the definition. They must use features.

  ### Phase 2: The Challenge Round (15–35 mins)
  *   **Action:** Distribute Cards 3, 4, 9, 10 (LARP, House, Cat, Stocks).
  *   **Task:** Groups must rule IN or OUT based *strictly* on their written definition.
  *   **Scoring:** Walk around. If a group says "LARP is IN" but their definition required "Two Players," dock points. Force them to update the definition if they want to keep the item IN.
  *   **Goal:** Make them stretch their definition to accommodate the "fuzzy" games (LARP, House). This weakens the definition (e.g., changing "Two Players" to "Participants").

  ### Phase 3: The Spoiler Chain (35–55 mins)
  *   **The Move:** Tell them: "We are testing for **Transitive Resemblance**."
  *   **Action:** Lay out Cards 1, 3, 5, 6 on the table in a line.
      1.  **Chess** (IN)
      2.  **LARP** (Shares: Rules/Fiction with Chess) -> Likely IN.
      3.  **Shadow Boxing** (Shares: Physical/Fiction with LARP) -> Likely IN.
      4.  **Bar Brawl** (Shares: Physical/Conflict with Shadow Boxing) -> **PROBLEM.**
  *   **The Crisis:** Ask: "Is the Bar Brawl a Game?"
  *   **Reaction:** They will say "No."
  *   **The Wall:** Ask: "Which feature in your definition does the Brawl fail that Chess passes?"
  *   **Result:** They will struggle. Both have conflict. Both have strategy. Both have winners/losers. The *features* overlap all the way down.
  *   **Scoring:** Award points only if they can cite a *feature* from their list. If they say "It's real violence," ask: "Is Russian Roulette (Card 11) a game?" (It has real death). If they say "It's against the law," ask: "Is underground poker a game?"
  *   **Objective:** Make them feel the definition breaking. They cannot exclude the Brawl using *features* alone without also excluding Chess or LARP.

  ### Phase 4: The Borderline Vote (55–70 mins)
  *   **The Card:** Reveal Card 12: **Professional Wrestling**.
  *   **Features:** Scripted outcome (like a play), physical contact (like boxing), audience treats it as sport (like a game).
  *   **Task:** "You have 5 minutes. You cannot change your definition. You must vote IN or OUT. Then, one spokesperson must explain *why* without using the word 'fun' or 'pretend'."
  *   **The Split:** Half the room will say IN (it fits the rules/structure). Half will say OUT (the outcome is fixed, the 'contest' is fake).
  *   **The Pivot:** Ask the OUT group: "If the audience *didn't know* it was scripted, is it a game?" (They'll say Yes). "If the audience *knows* it's scripted but plays along, is it a game?" (They'll hesitate).
  *   **Realization:** The status of the object depends on the **attitude/practice** of the participants and audience, not the physical features of the event.

  ### Phase 5: The Debrief (70–90 mins)
  *   **Stop the Game.** Reveal the philosophical target.
  *   **Step 1: The Failure of Features.** "You tried to find a common thread (rules, goals, competition). The Chain (Chess -> Brawl) showed that resemblance chains too far. Resemblance over-generates."
  *   **Step 2: The Solution.** "How did you finally exclude the Brawl? You didn't cite a feature. You cited the **practice**. 'It's not a game because they aren't *playing*.' You appealed to **Use**."
  *   **Step 3: Wittgenstein.** Now say the words: **Family Resemblance**. Explain that FR isn't just "overlapping features." It's "overlapping features *bounded by a form of life*."
  *   **Step 4: The Payoff.** "The word 'Game' doesn't pick out a metaphysical essence. It picks out a tool we use in specific contexts. Wrestling is a game *when used as entertainment sport*, and not a game *when used as theater*. The boundary isn't in the world; it's in the language-game."

  ---

  ## III. Instructor's Cheat Sheet: What Will Go Wrong

  Be prepared for these three specific failures. If you don't handle them, the philosophical point dissolves.

  **1. The "Disjunctive Definition" Escape Hatch**
  *   **What happens:** A smart group realizes the trap in Phase 2. They write a definition like: "Either it has rules OR it has fictional conflict OR it has competition."
  *   **Why it's a problem:** This technically solves the classification task without hitting the philosophical wall. It saves their score but ruins the lesson.
  *   **The Fix:** In Phase 3 (The Chain), challenge the disjunction. "If your definition is 'Rules OR Conflict', then a War is a game. Is War a game?" Force them to see that a disjunctive definition includes *too much* (over-generation). The problem isn't finding *a* definition; it's finding one that *excludes* what we intuitively exclude.

  **2. The "It's Just Subjective" Shrug**
  *   **What happens:** During the Wrestling vote, students say, "It doesn't matter, it's just subjective."
  *   **Why it's a problem:** Wittgenstein isn't a subjectivist. He thinks there are right and wrong uses, but they are grounded in practice, not essence.
  *   **The Fix:** Push back hard. "If I call a funeral a 'game of soccer,' am I being subjective? Or am I misusing the language?" Make them see that there are norms governing the use, even if there's no essence. The norm is the *practice*, not the *features*.

  **3. The "Prototype Theory" Confusion**
  *   **What happens:** In the debrief, a student says, "This is just Prototype Theory. Chess is a central prototype, Wrestling is peripheral."
  *   **Why it's a problem:** This is a rival cognitive science account. It explains the *data* (why some feel more "game-like") but misses the *philosophical point* (why we demand essences).
  *   **The Fix:** Acknowledge it. "Prototype theory describes the psychology of how we categorize. Wittgenstein is making a logical point about *meaning*. Even if Chess is the prototype, why does the boundary exist at all? Prototype theory says 'fuzzy boundaries.' Wittgenstein says 'look at how we use the word to find the boundary.'"

  ---

  ## IV. What This Activity Cannot Teach (Your Homework)

  You must supply these nuances in the debrief, because the game mechanics cannot reproduce them:

  1.  **The Therapeutic Goal:** The activity makes them feel frustration. You must explain that for Wittgenstein, this frustration is the *goal*. He wants to cure us of the craving for generality. The activity simulates the disease; you must provide the cure.
  2.  **Form of Life:** The activity hints at "context" (Wrestling audience). It cannot fully reproduce the depth of "Form of Life." You need to explain that "Use" isn't just "function" (like a hammer); it's embedded in a whole culture of human behavior.
  3.  **The Danger of the "Chain":** The activity uses a deliberate chain (Chess -> Brawl). In real life, we don't usually reason by chains. You need to clarify that the chain is a *reductio ad absurdum* to show why features fail, not a description of how we actually think.
  4.  **Rival Accounts:** As noted above, a **Cluster Concept** account or **Disjunctive Definition** could explain the card sorting results just as well as FR. You must explicitly argue why Wittgenstein's "Use" is distinct from "Cluster of Features." (Key distinction: Features are static; Use is dynamic/normative).

  ## V. Scoring Key (For your reference)

  *   **Group that sticks to rigid definition:** High consistency score, but fails the Wrestling vote (looks dogmatic).
  *   **Group that updates definition constantly:** Low consistency score, but survives the Chain (looks pragmatic).
  *   **Winning Condition:** There is no winning condition. In the debrief, reveal: "The group that felt the most frustration about the Wrestling card actually 'won' the philosophical point." This subverts the gamification to reinforce the lesson.
