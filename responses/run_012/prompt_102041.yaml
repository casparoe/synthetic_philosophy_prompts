  **The Broken Mast: Two Accounts**

  **I. Covering Law**

  If strain exceeds then wood will surely snap.
  Such timber breaks when force meets rotten grain.
  For timber yields to what the laws demand.
  The end was sealed within the start of things.
  The captain ordered all the sail be set.
  The timber groaned beneath the rising wind.
  The knot slipped loose before the storm arrived.
  A wave rolled over decks and men alike.
  No canvas caught the breath of moving air.
  So silence followed on the crashing sound.
  The ship drifted upon the quiet sea.
  And thus the voyage ended in the calm.

  **II. Narrative**

