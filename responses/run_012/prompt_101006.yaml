      *   *Claim 3 (External Reasons Impossible):* This is Williams's view, but the justification ("literally cannot be moved") is slightly off. He argues external reason statements are false because they lack a link to agency. It's not just psychological impossibility; it's conceptual.
      *   *Claim 4 (Moralizing):* Simplification. Williams thinks external claims are false, not merely moralizing, though he critiques their rhetorical use.
