      *   *Claim 1:* "Williams thinks a reason for action has to be something that can move you, so it always has to hook up to a desire you already have."
          *   *Analysis:* This is the core internalism thesis. However, "desire" is too narrow. Williams uses "subjective motivational set" ($S$), which includes desires, projects, commitments, etc. Also, Williams distinguishes between being *actually* moved and having a reason based on *sound deliberative route* from $S$.
      *   *Claim 2:* "If nothing you want would be served by acting, then there is no reason for you to act, full stop, and anyone who tells you otherwise is just moralizing."
          *   *Analysis:* Mostly accurate on the "no reason" part (for that agent), but "moralizing" is a bit strong/simplistic. Williams thinks external reason statements are false or meaningless, not necessarily just moralizing, though he critiques their use.
      *   *Claim 3:* "External reasons -- reasons that apply to you no matter what you want -- are therefore impossible, because you literally cannot be moved by something that is not already in your motivational set."
          *   *Analysis:* This conflates having a reason with being motivated. Williams argues an agent *has* an internal reason if there is a sound deliberative route from $S$ to the action, even if they aren't currently motivated (due to ignorance, etc.). The impossibility claim is Williams's, but the justification ("literally cannot be moved") is slightly off regarding the *reason* claim vs. *motivation* claim.
      *   *Claim 4:* "Williams says the only alternative is to insist that people should care about things they do not, which he thinks is empty."
          *   *Analysis:* Accurate representation of Williams's critique of externalism.

  3.  **Address Specific Suspicions:**
      *   *Reason vs. Motivation:* Williams argues that for a reason to exist, there must be a *possibility* of motivation via sound deliberation, not that the agent is currently motivated. The summary blurs this ("has to be something that can move you" vs "hook up to a desire").
      *   *Desire vs. Motivational Set:* The summary says "desire." Williams says $S$ (projects, commitments, dispositions, etc.). This is a common simplification/error.

  4.  **Evaluate the Conclusion:**
      *   Does "external reasons are impossible" follow? For Williams, yes. For externalists (e.g., McDowell, Nagel, Parfit), no. They argue reasons can exist independently of $S$. The summary ignores externalist resources (e.g., objective values, rational requirements).

