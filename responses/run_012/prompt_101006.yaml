      Your friend's summary captures the gist of Williams's "Internal and External Reasons" (1979) but contains technical errors significant for a reading group. Here is a claim-by-claim breakdown.

      **1. "Hook up to a desire you already have."**
      *Verdict:* Misrepresentation/Simplification.
      Williams explicitly rejects limiting the "subjective motivational set" ($S$) to desires. $S$ includes projects, commitments, dispositions, and loyalties. Reducing $S$ to "desires" imposes a Humean psychology Williams avoids. Defenders accept the $S$ formulation; critics often attack the "desire" simplification.

      **2. "Has to be something that can move you."**
      *Verdict:* Conflation of Reason and Motivation.
      Williams distinguishes having a reason from being currently motivated. An agent has an internal reason if there is a *sound deliberative route* from $S$ to the action. You might lack motivation due to ignorance or irrationality, yet still have a reason because correct deliberation *would* motivate you. The summary suggests current motivability is required, which is inaccurate.

      **3. "External reasons... are therefore impossible."**
      *Verdict:* Accurate to Williams, but contested.
      Williams argues external reason statements are false because they cannot explain action. However, the summary's justification ("literally cannot be moved") leans too heavily on psychological impossibility. Williams's point is conceptual: a reason must relate to agency. Whether external reasons are *actually* impossible is the central debate of metaethics, not settled fact.

      **4. "Anyone who tells you otherwise is just moralizing."**
      *Verdict:* Simplification.
      Williams argues external claims are false or meaningless, not merely moralizing. He critiques their use in blame, but his philosophical claim is about truth conditions, not just rhetoric.

