answer: |-
  The principle that reconciles your verdicts, respects Wittgenstein's *On Certainty*, and resolves your conflict about the moon landing is the **Principle of Constitutive Non-Empiricity**.

  ### The Principle Stated Precisely

  A proposition $P$ is a hinge for a subject $S$ if and only if:
  1.  **Exemption:** $S$ treats $P$ as exempt from empirical verification or falsification within their current practice.
  2.  **Constitutivity:** $P$ functions as a normative condition for the possibility of that practice (specifically, the practice of distinguishing true from false), such that treating $P$ as an empirical hypothesis would render the verification conditions for *other* propositions incoherent.
  3.  **Logical Depth:** The negation of $P$ does not merely yield a contrary picture of the world (a different set of facts), but dissolves the logical scaffolding required to assert *any* picture of the world.

  ### Role vs. Epistemic Status

  You asked whether the principle must be framed in terms of role or epistemic status. The answer is that it must be framed in terms of **logical role**, but this role is objective, not merely psychological.

  *   **Epistemic Status:** Hinges *lack* the status of knowledge. As Wittgenstein says, "I know" is misplaced here (OC 155). They are not justified beliefs; they are the ground upon which justification stands.
  *   **Role:** The role is to act as a rule disguised as a proposition.
  *   **Coming Apart:** These *can* come apart. A proposition can have the empirical *status* (it looks like a fact about the world) but play the *role* of a rule (a hinge). Conversely, a proposition can be treated psychologically as certain (like the moon landing for a denier) but fail the logical test of constitutivity.

  This distinction saves your moon landing verdict. For the conspiracy theorist, "No human walked on the moon" plays a *psychological* role of certainty, but it fails the *logical* role of constitutivity. If they are wrong about the moon, their ability to measure, count, remember, and reason about *other* things remains intact. It is a **dogmatic empirical belief**, not a hinge. It is content within their framework, not the framework itself.

  ### How Hinges Change (The Riverbed)

  You asked how a hinge can be surrendered. Wittgenstein uses the metaphor of the riverbed (OC 96–99). The hard rock (hinges) guides the water (empirical propositions). But over time, the sand (empirical beliefs) can harden into rock, and the rock can erode into sand.

  *   **Mechanism of Change:** A hinge is surrendered not because it is "disproven" (you cannot disprove a hinge without changing the game), but because the *form of life* shifts so drastically that the proposition no longer serves a constitutive function.
  *   **Example:** "The sun revolves around the earth" was once a hinge (constitutive of daily observation and theology). It became an empirical claim, then a false one. The shift occurred because a new system (heliocentrism) offered a more coherent scaffolding for *other* practices (navigation, physics), forcing the old hinge to become a movable proposition.

  ### Implications for Unlisted Cases

  Applying the Principle of Constitutive Non-Empiricity to your unlisted examples:

  1.  **"The reliability of a whole method of measurement" (e.g., "Rulers do not spontaneously shrink"):**
      *   **Verdict:** **Hinge.**
      *   **Reasoning:** If you treat this as an empirical hypothesis to be tested every time you measure, you cannot measure anything to test it. It is a condition of the practice of measurement.
  2.  **"What counts as a reason" (e.g., "Consistency is a mark of truth"):**
      *   **Verdict:** **Hinge.**
      *   **Reasoning:** This is a rule of the language game itself. To argue against it, you must use reasons, presupposing the very norm you are questioning.

  ### The Verdict You Should Give Up

  You asked me to tell you honestly which verdict your principle cannot save. You must reconsider: **"I'm a good judge of when someone is manipulating me."**

  **Why this is the weak link:**
  Compare this to "My memory of what I did yesterday is broadly reliable."
  *   **Memory:** If you doubt memory globally, you cannot verify *any* past event, including the verification process itself. It is constitutive of temporal reasoning.
  *   **Manipulation:** This is a claim about a specific *skill* or *faculty reliability* within a specific domain (social interaction). If you doubt this, you do not lose the ability to ask for reasons; you simply become more cautious, seek third-party verification, or look for objective evidence. You can doubt your judgment of manipulation without collapsing the language game of social reasoning.

  This proposition functions more like the moon landing denial than like the memory hinge. It is an empirical belief about your own competence held with high confidence. It is a **local certainty**, not a **global hinge**. By marking it as a hinge, you blur the line between a framework condition (memory) and a confident self-assessment (skill).

  ### Summary of the Resolution

  1.  **Moon Landing:** You are right to refuse it. It is empirical content, not logical framework, even if held dogmatically. The denier has a "pseudo-hinge."
  2.  **Universe Age:** You are right. It is a specific cosmological claim, not a condition of time itself.
  3.  **Manipulation:** You should move this to **Not a Hinge**. It is a fallible empirical belief about your social acuity, not a condition of inquiry.
  4.  **Standard Metre:** You are right to call it a stipulation, but note that in Wittgenstein's view, this makes it the *archetype* of a hinge (a rule of representation). It is the clearest case of a proposition that is not "known" but "used."

  Your tentative principle was close, but it relied on the *feeling* of doubt ("undermine the practice"). The refined principle relies on the *logic* of doubt ("dissolve the conditions of verification"). This allows you to distinguish between a proposition that *stops* inquiry (Moon Landing for a denier) and a proposition without which inquiry *cannot begin* (Memory for anyone).
