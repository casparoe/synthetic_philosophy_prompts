answer: |-
  Here is the specification sheet for a theory of moral responsibility capable of surviving the Frankfurt gauntlet. This is not a summary of existing views, but the job description your theory must fulfill to stay in the game.

  ### 1. The Case Load (Verdict Requirements)
  Your theory must deliver the following verdicts without shifting its core criteria ad hoc.

  *   **The Standard Frankfurt:** Agent decides on own reasons; intervener is present but idle.
      *   *Requirement:* **Actual Sequence Sufficiency.** The theory must ground responsibility in the actual causal history of the action, not in the availability of alternatives.
  *   **The Intervener Acts:** Agent tries to do otherwise; intervener forces the action.
      *   *Requirement:* **Compulsion Sensitivity.** The theory must distinguish between an action that flows from the agent's will and one that bypasses it, even if the physical outcome is identical.
  *   **The Self-Installed Block:** Agent previously arranged for a brother to stop him; brother is ready but idle; agent acts on own.
      *   *Requirement:* **Historical Tracing.** The theory must account for the origin of the constraints. Responsibility here relies on the earlier voluntary act of installing the block, not just the moment of action.
  *   **The Probabilistic Block:** The mechanism to stop the agent had only a 10% chance of working. It didn't fire. Agent acts on own.
      *   *Requirement:* **Epistemic/Causal Decoupling.** The theory must explain why the *reliability* of the counterfactual blocker doesn't diminish responsibility if it remains inactive. (Intuition: Responsibility remains high).
  *   **The Late Installation:** Agent makes up mind; *then* block is installed; then agent acts.
      *   *Requirement:* **Decision-Point Priority.** The theory must locate the locus of responsibility at the formation of the intention, not just the execution, provided the intention wasn't coerced.
  *   **The Physical Lock:** No intervener. A law of physics or a locked door makes doing otherwise impossible. Agent acts on own reasons.
      *   *Requirement:* **Ontological Neutrality.** It should not matter fundamentally whether the constraint is a person, a machine, or physics. If the agent is the source of the action, the *type* of alternative-remover shouldn't exonerate.
  *   **The Spite Case (The Wrecker):** Agent knows of the block. The knowledge of the block becomes part of the reason for acting ("I'll show them").
      *   *Requirement:* **Reason-Integration.** The theory must distinguish between a constraint that *compels* (undermines responsibility) and a constraint that *motivates* (preserves or enhances it). It must explain why acting *because* of a restriction is still free, even if the restriction ensures you couldn't have done otherwise.

  ### 2. The Distinctions (Conceptual Boundaries)
  Your theory cannot collapse these categories. If it does, it fails to explain the cases above.

  *   **Could Have Done Otherwise vs. Could Have Chosen Otherwise:** You must specify whether the relevant alternative is a different physical movement or a different volition. (Frankfurt cases usually target the former; "Flicker" defenses target the latter).
  *   **Being Caused vs. Being Made To:** Causation is ubiquitous; compulsion is specific. Your theory must explain how an action can be fully caused by the agent without being "made to happen" by an external force.
  *   **Counterfactuals vs. Actual Sequence:** You must clarify whether facts about what *would* have happened (the intervener) are relevant to what *did* happen (the responsibility). Frankfurt says no; your friend says yes.
  *   **Responsibility vs. Blame vs. Punishability:** You can be responsible (owner of the act) without being blameworthy (bad act) or punishable (social sanction). The theory must not conflate ownership with evaluation.

  ### 3. The Constraints (Global & Local)
  *   **Global Determinism:** If determinism is true everywhere, not just in the case, the theory must not collapse. If your theory works in a Frankfurt case but fails under global determinism, you are a Compatibilist. If it fails in both, you are a Skeptic. If it fails in the Frankfurt case but works under global determinism, you are an Incompatibilist (Leeway).
  *   **The "Rigged" Objection:** Your theory cannot simply stipulate that the agent is responsible in the Standard Frankfurt case. It must provide a *criterion* that the agent meets, independent of the intuition pump. (This addresses your friend's complaint).

  ### 4. Incompatible Pairs (The Trade-Offs)
  Here is where the list breaks. You cannot satisfy all of the above without cost.

  *   **Pair 1: Ontological Neutrality vs. Reason-Integration.**
      *   *Conflict:* In the **Physical Lock** case, the lock cannot be a "reason" for spite. In the **Spite** case, the block *is* a reason. If you require reasons to be internal (Sourcehood), the Physical Lock looks like coercion. If you require only causal sourcehood, the Spite case looks like manipulation.
      *   *Drop:* **Ontological Neutrality.** It is safer to admit that human interveners change the normative landscape compared to physical locks, even if the causal structure is similar.
  *   **Pair 2: Historical Tracing vs. Actual Sequence Sufficiency.**
      *   *Conflict:* **Standard Frankfurt** relies on the current state of the agent (Actual Sequence). **Self-Installed Block** relies on past history (Tracing). If you demand history for one, you must demand it for the other to be consistent. But Standard Frankfurt is usually presented as history-independent.
      *   *Drop:* **Actual Sequence Sufficiency (in isolation).** You must adopt a Hybrid view: Actual sequence matters, *provided* the history of that sequence is not tainted.
  *   **Pair 3: The "Rigged" Objection vs. The Frankfurt Verdict.**
      *   *Conflict:* Your friend argues that if the intervener never acts, the agent *did* have alternatives (to trigger the intervener). If you accept this ("Flicker of Freedom"), you save the Principle of Alternative Possibilities (PAP) but lose the Frankfurt conclusion. If you reject this, you accept Frankfurt but look like you're ignoring the "rigged" setup.
      *   *Drop:* **The "Rigged" Objection (strictly).** You must accept that *robust* alternatives are what matter, not flickers. Mere possibility of triggering an intervener is not a morally significant alternative.

  ### 5. Scorecard (The Usual Suspects)
  *   **Leeway Views (Incompatibilists):** Fail immediately. They require Alternative Possibilities. The **Standard Frankfurt** requirement eliminates them.
  *   **Source Views (Compatibilists):** Handle **Standard** and **Physical Lock** well. Struggle with **Self-Installed** (needs history) and **Spite** (needs to explain why the block doesn't usurp sourcehood).
  *   **Reasons-Responsiveness:** Handles **Spite** well (agent is responsive to reasons, even if constrained). Struggles with **Intervener Acts** (if the mechanism is responsive but forced, is it responsible?).
  *   **Hard Determinism / Skeptics:** Pass all consistency checks by denying responsibility everywhere. Eliminated by the basic requirement that **Responsibility is Possible.**

  ### 6. The Killer Requirement
  The single requirement that eliminates the most candidate theories (including all Leeway Incompatibilists, many Libertarians, and the "Flicker" defenders) is the demand that you assign responsibility when no robust alternative exists.

  \answer{Responsibility is compatible with the inability to do otherwise.} no
