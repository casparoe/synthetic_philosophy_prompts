answer: |-
  Order of ideas
  Start with the tangible mechanism (balls/neurons) to establish causal closure. Draw the balls on the whiteboard first. No magic forces yet. Second, introduce the pattern recognition: show how clumps correlate with external events, establishing information encoding. Draw the walls changing. Third, introduce the higher-level description: describe the system *only* in terms of clump movements, ignoring balls. Write the high-level rules next to the low-level ones. Fourth, pose the conflict: if the clump-description predicts perfectly, do the clumps cause the motion, or just describe it? Fifth, map to brain: neurons are balls, concepts are clumps. Finally, ask the core question: if we simulate the clumps, did we simulate the mind? This sequence ensures physical realism lands before abstract ontology, preventing premature dismissal as mysticism. Each step relies on the previous acceptance of the lower level's sufficiency. You must secure the "balls do everything" premise before suggesting "clumps do something." If you reverse this, they will treat clumps as magic. The mapping to neurons must happen only after the traffic/careenium logic is settled, otherwise biological baggage interferes. The goal is to make the category error feel like a genuine paradox, not a confusion. Use the board to show the two descriptions side-by-side.

  The carrying example
  Use a traffic jam, not the careenium. The careenium is too abstract; magnetic forces distract from the logical point. Traffic involves cars (balls) and jams (clumps). A jam moves backward while cars move forward; the jam causes braking (causation) but is made of cars (constitution). It has clear macro-behavior emerging from micro-rules without implying little agents inside the jam. It lacks the "mind" baggage, allowing you to add that later. Once they accept the jam is "real" causally despite being just cars, map it to the careenium, then neurons. This bridges the gap between physics and psychology without triggering immediate skepticism about souls or magic. The careenium fails because participants will fixate on magnetism physics rather than the logical structure of levels. Traffic is universally understood as deterministic yet deeply patterned. This concrete analogy stabilizes the intuition before introducing abstract magnetic balls. It ensures everyone starts on equal footing.

  Misconceptions
  First, "It's just a metaphor." They will say clumps aren't real objects. Hit this at step three. Insist the clump-description predicts future states as well as the ball-description. If it predicts, it's not just poetry. It has causal leverage.
  Second, "Little agents inside." They will imagine tiny men pushing clumps. Hit this at step one. Emphasize the balls are dumb; no hidden motors. The clump moves only because balls move. There is absolutely no ghost in the machine.
  Third, "Choosing sides." They will think they must pick balls OR clumps. Hit this at step four. Frame it as causal closure vs. explanatory power. Both are true, but the question is about which description captures the "work" being done in a way that matters for mind. This prevents the false dichotomy that undermines the whole discussion.
  Fourth, "Verbal trick." They will say this is just semantics. Hit this at step five. Ask if a software bug is real if code is just electrons. If the bug crashes the bank, the description has real teeth.

  The check
  Ask: 'If we simulated every car perfectly but deleted the traffic jam concept from the code, would it still jam?' If yes, ask: 'Did the jam cause braking, or just describe it?' This distinguishes ontological reality from descriptive utility. If they say jam caused it, ask where the force came from. This reveals their grasp of supervenience clearly right now.

  What to leave out
  Skip qualia or the 'hard problem' of feeling. Avoid quantum mechanics; it invites magic. Do not try to solve free will. Avoid defining 'consciousness' explicitly; keep it to 'concepts' and 'information.' Stay on causation and levels, not subjective experience. Skip dualism; assume physicalism rigidly throughout. Keep the focus strictly on causal efficacy of patterns. Do not discuss neural correlates either.
