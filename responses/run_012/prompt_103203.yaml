          Ask: "If we simulated every car perfectly but deleted the concept of 'traffic jam' from the code, would the simulation still jam?" If they say yes, ask: "Then did the jam cause the braking, or just describe it?" This forces them to distinguish ontological reality from descriptive utility without collapsing into reductionism.

