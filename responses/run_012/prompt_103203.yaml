      *   **The Check:** A specific question to test understanding of levels vs. causation.
      *   **What to leave out:** Qualia, hard problem, free will deep dive, quantum mechanics.

  3.  **Drafting - Section by Section (monitoring word counts):**

      *   **Order of Ideas:**
          Start with the tangible mechanism (balls/neurons) to establish causal closure. No magic forces yet. Second, introduce the pattern recognition: show how clumps correlate with external events, establishing information encoding. Third, introduce the higher-level description: describe the system *only* in terms of clump movements, ignoring balls. Fourth, pose the conflict: if the clump-description predicts perfectly, do the clumps cause the motion, or just describe it? Fifth, map to brain: neurons are balls, concepts are clumps. Finally, ask the core question: if we simulate the clumps, did we simulate the mind? This sequence ensures physical realism lands before abstract ontology, preventing premature dismissal as mysticism. Each step relies on the previous acceptance of the lower level's sufficiency.

      *   **The carrying example:**
          Use a traffic jam, not the careenium. The careenium is too abstract; magnetic forces distract from the logical point. Traffic involves cars (balls) and jams (clumps). A jam moves backward while cars move forward; the jam causes braking (causation) but is made of cars (constitution). It has clear macro-behavior emerging from micro-rules without implying little agents inside the jam. It lacks the "mind" baggage, allowing you to add that later. Once they accept the jam is "real" causally despite being just cars, map it to the careenium, then neurons. This bridges the gap between physics and psychology without triggering immediate skepticism about souls or magic.

      *   **Misconceptions:**
