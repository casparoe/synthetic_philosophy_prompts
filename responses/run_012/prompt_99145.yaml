  To reverse-engineer your colleague's periodization logic, we have to look past the surface labels and identify the underlying *criteria of reality* she is applying. She isn't just saying "this happened"; she is making ontological claims about historical time. She accepts two "later inventions" (Middle Ages, Scientific Revolution) but rejects two others (Renaissance, Dark Ages). The differentiator must be what those labels *refer to*, not when they were coined.

  Here are the two surviving rules that fit all four of her verdicts, their predictions for the Enlightenment, and my assessment of which one she is actually using.

  ### Rule 1: The "Structural-Functionalist" Criterion
  **The Logic:** A period is "Real" if it identifies a coherent, functioning system of material relations, institutions, or epistemic practices. It is "Not Real" if it identifies primarily a cultural style, aesthetic mood, or intellectual fashion.
  *   **Middle Ages (Real):** Denotes feudalism, manorialism, and Christendom—a working system of social/economic arrangements.
  *   **Scientific Revolution (Real):** Denotes a shift in epistemic practice (experimental method, institutionalization of science)—a working system of knowledge production.
  *   **Renaissance (Not Real):** Denotes an artistic/literary style and a humanist mood. It lacked a unified socio-economic structure distinct from the Late Middle Ages.
  *   **Dark Ages (Not Real):** Denotes a lack of output/culture. It describes a void, not a functioning system.

  **Prediction for the Enlightenment:** **Real.**
  Under this rule, the Enlightenment qualifies because it wasn't just ideas; it was institutionalized. It created the "Public Sphere" (Habermas), specific institutions (salons, Masonic lodges, scientific academies), and new administrative practices (cameralism, reforming monarchies). It functioned as a system of political and social critique embedded in institutions.

  ### Rule 2: The "Non-Teleological" Criterion
  **The Logic:** A period is "Real" if its definition does not depend on a moral narrative of progress or decline relative to its neighbors. It is "Not Real" if its identity relies on a value judgment (slur) or a story of historical destiny (rebirth, light).
  *   **Middle Ages (Real):** While originally pejorative, it is now used descriptively to denote the time between Rome and Modernity without necessarily implying stagnation. It can be defined by internal coherence.
  *   **Scientific Revolution (Real):** Describes a change in *method*. While often celebrated, the periodization rests on the shift from natural philosophy to empirical science, not inherently on a moral claim that scientists were "better" people.
  *   **Renaissance (Not Real):** Defined by "Rebirth." This implies the previous period was "dead" or inferior. It is a narrative of progress constructed by humanists to disparage the Middle Ages.
  *   **Dark Ages (Not Real):** Defined by "Darkness." This is an explicit slur implying decline and ignorance.

  **Prediction for the Enlightenment:** **Not Real.**
  Under this rule, the Enlightenment fails. The term itself is teleological and normative ("Light" vs. "Superstition"). It defines itself by its opposition to the past (the "Dark" ages of faith) and its trajectory toward a future (Reason, Liberty). It is a moral narrative masquerading as a timeframe.

  ### My Bet: Her Actual Verdict
  I bet your colleague will verdict the Enlightenment as **Not Real**.

  **The Reason:**
  While Rule 1 (Structural) fits her comment about "social and economic arrangements," her rejection of the **Renaissance** is the tell. The Renaissance had institutions (academies, patronage networks) just as much as the Enlightenment did. If she rejects the Renaissance as a "later invention" despite its institutional footprint, she is signaling that **cultural-intellectual movements do not constitute periods** in her ontology.

  She likely views the Scientific Revolution as "Real" not because of the institutions, but because it represents a hard *epistemic break* (a change in how truth is validated), whereas the Enlightenment represents a *political/moral aspiration* (a change in how society *should* be). The Middle Ages are "Real" to her because they describe a *condition* (feudalism), not an *ambition*. The Enlightenment is an ambition. Therefore, it falls into the same bucket as the Renaissance: a compelling narrative, but not a genuine historical container.

  She is running a hybrid rule: **A period is Real only if it denotes a settled structural or epistemic condition, not a project of improvement.**

  ### The Crucial Case: "The Progressive Era"
  To definitively separate Rule 1 (Structural-Functionalist) from Rule 2 (Non-Teleological), you should ask her about **The Progressive Era (1890s–1920s)**.

  *   **Rule 1 Predicts: Real.**
      The Progressive Era involved concrete structural changes: the rise of the regulatory state, antitrust laws, labor arrangements, and women's suffrage. It is a "package of social and economic arrangements" comparable to her definition of the Middle Ages.
  *   **Rule 2 Predicts: Not Real.**
      The label "Progressive" is inherently teleological and normative. It implies moral improvement and forward motion. Like "Renaissance" (Rebirth) or "Enlightenment" (Light), it defines the period by its *aspirations* rather than its neutral boundaries. It is a slur against the "conservative" past and a promise of a "better" future.

  If she says the Progressive Era is **Real**, she is prioritizing **Structure (Rule 1)**.
  If she says the Progressive Era is **Not Real**, she is prioritizing **Narrative/Teleology (Rule 2)**.

  Given her verdict on the Renaissance, I suspect she will reject the Progressive Era, confirming that for her, **periods must describe what people *were*, not what they *wanted to become*.**
