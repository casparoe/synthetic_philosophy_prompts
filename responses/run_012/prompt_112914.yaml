prompt: |-
  I'm a novelist, about 60k words into a draft, and I keep hitting the same wall in revision: a character does something in chapter 12 that I swear is "in character," but my editor says it comes out of nowhere, and honestly I can't always tell who's right. I've been reading about Dennett's real patterns and the three stances -- physical, design, intentional -- and I want a procedure I can actually run on a scene to decide whether a bit of behavior is a real pattern in the character or whether I'm just projecting a pattern onto noise. My rough thought is that a pattern is real when it's cheaper to describe what the character does by naming the trait than by listing all the exceptions, but I don't know how to turn that into something I can do at my desk. So give me the procedure: the questions to ask in order, what counts as a load-bearing pattern versus a decorative one (a trait I've named but that isn't actually doing any compressing), when the honest verdict is "this is the design stance, I rigged it to get where I wanted," and the point where the procedure has to stop and hand it back to me as a judgment call. I need to run it in maybe twenty minutes on a scene, before I show it to my editor, and I've got no philosophy training so keep the jargon survivable. Then run it on three cases: (a) a lifelong miser refuses to lend money -- I'm pretty sure that one's fine; (b) a scene where my cynical narrator suddenly does something generous, and I want to keep it; (c) a character whose "trait" is really just me needing the plot to move. Be honest about the one where the procedure tells me to cut the scene I love, and tell me what the procedure definately can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Novelist, 60k words into a draft.
      *   **Problem:** Hitting a revision wall. Disagreement with editor about character consistency (Chapter 12 behavior).
      *   **Theoretical Framework:** Daniel Dennett's "Real Patterns" and the "Three Stances" (Physical, Design, Intentional).
      *   **Goal:** A practical, 20-minute desk procedure to determine if a character behavior is a "real pattern" (consistent/in-character) or "noise/projection."
      *   **Key Concepts to Translate:**
          *   "Real Pattern" = Compression efficiency (is it cheaper to name the trait than list exceptions?).
          *   "Three Stances" = Physical (mechanics), Design (function/goal), Intentional (belief/desire).
          *   "Load-bearing" vs. "Decorative" patterns.
          *   "Rigged" (Design stance overriding Intentional stance).
      *   **Constraints:** No philosophy training (keep jargon survivable), 20-minute runtime, honest verdicts on three specific cases (Miser, Cynic, Plot Puppet).
      *   **Output:** The Procedure + Application to 3 Cases + Limitations.

  2.  **Deconstruct Dennett for Fiction:**
      *   *Real Patterns:* A pattern is "real" if positing its existence allows you to predict future behavior better than chance, without needing to know every microscopic detail. In fiction: Does naming the trait help the *reader* predict/understand the character without needing a footnote for every action?
      *   *The Stances:*
          *   *Physical:* The biology/mechanics. (Rarely useful for fiction unless sci-fi/medical).
          *   *Design:* What is the character *for*? (Plot function, archetype).
          *   *Intentional:* What does the character *believe* and *want*? (Psychology, motivation).
      *   *The Conflict:* The editor says "out of nowhere." The author says "in character." This is usually a clash between the *Design Stance* (I need them to do this for the plot) and the *Intentional Stance* (Would they actually want to do this?).
      *   *Compression:* If I say "He is greedy," does that explain 90% of his actions? If I have to add "except when he's greedy, except when he's not, except when the plot needs him to be," the pattern isn't real; it's noise.

  3.  **Drafting the Procedure (The "Pattern Compression Test"):**
      *   *Time:* 20 minutes.
      *   *Steps:* Needs to be sequential.
      *   *Step 1: The Intentional Audit (Beliefs/Desires).* What does the character think is happening?
      *   *Step 2: The Compression Check.* Does the trait label save words/explanation?
      *   *Step 3: The Design Interference Check.* Am I forcing this?
      *   *Step 4: The Reader Prediction Test.* Would a bettor win money betting on this action based on previous chapters?
      *   *Decision Point:* Cut, Rewrite, or Keep.

  4.  **Refining the Jargon:**
      *   Instead of "Intentional Stance," use "The Inside View."
      *   Instead of "Design Stance," use "The Author View."
      *   Instead of "Real Patterns," use "Compression Efficiency."
      *   Keep Dennett's core insight: *Predictive Power.*

  5.  **Developing the Three Cases:**
      *   *(a) The Miser:* Classic trait. High compression. Likely passes.
      *   *(b) The Cynic's Generosity:* The tricky one. Needs to pass the "Inside View" to be real. If it's just "surprise," it's noise. If it's "cynicism protects the vulnerable," it's a deeper pattern.
      *   *(c) The Plot Puppet:* The failure case. High Design interference, low Intentional logic. The procedure must flag this.

  6.  **Addressing the Limitations:**
      *   What *can't* this do? It can't measure emotional resonance. It can't account for thematic necessity that overrides realism. It can't replace the editor's external view entirely.

  7.  **Review against Constraints:**
      *   *20 Minutes?* Yes, the steps are quick checks.
      *   *No Philosophy Training?* I need to explain Dennett's concepts simply in the intro.
      *   *Honest Verdict?* I must explicitly tell the user to cut case (c).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Dennett says." I need to operationalize it.
      *   *Correction:* Ensure the distinction between "Decorative" (I called them brave once) and "Load-bearing" (They act bravely consistently) is clear.
      *   *Tone:* Professional, empathetic to the writer's struggle, analytical but not cold.

  9.  **Final Output Structure:**
      *   Introduction (Translating Dennett).
      *   The Procedure (The 20-Minute Compression Test).
      *   The Three Cases (Applied).
      *   The Limitations (What the tool can't do).

  *(Self-Correction on the "Compression" concept)*: I need to make sure the user understands that "cheaper to describe" means "easier for the reader to understand/predict." It's about cognitive load.

  *(Refining the "Design Stance" warning)*: The user needs to know when they are "rigging" it. That's when the Plot (Design) overrides the Psychology (Intentional).

  Okay, ready to write.
answer: |-
  Here is a practical procedure based on Daniel Dennett's concepts, translated for fiction revision. It is designed to take 20 minutes, requires no philosophy degree, and focuses on **predictive power** and **cognitive compression**.

  ### The Theory (In Plain English)
  Dennett argues that a pattern is "real" if positing its existence makes the world easier to predict.
  *   **The Intentional Stance (The Character's View):** Treating the character as an agent with beliefs and desires. *("He did X because he wanted Y.")*
  *   **The Design Stance (The Author's View):** Treating the character as a tool built for a function. *("He did X because the plot needs him to.")*
  *   **Real Pattern:** A trait is real if naming it allows you to predict the character's behavior without needing a footnote for every exception.
  *   **Noise:** If you have to list more exceptions than rules to explain the behavior, the pattern isn't real; you are projecting one.

  ---

  ### The Procedure: The 20-Minute Compression Test

  Set a timer. Do not skip steps. Write your answers on a single sheet of paper.

  **Minute 0-5: The Intentional Audit (The Inside View)**
  Ignore the plot. Ignore what *needs* to happen. Look only at the character's mind in the moments leading up to the controversial action.
  1.  **Belief:** What does the character believe is true right before they act? (e.g., "This person will steal from me.")
  2.  **Desire:** What is their primary goal in this specific scene? (e.g., "Protect my savings.")
  3.  **Cost:** What does this action cost them? (Money, safety, reputation?)
  4.  **Verdict:** If you handed this page to a stranger who knows nothing about your plot, would the Belief + Desire logically lead to the Action?
      *   *If Yes:* Proceed to Minute 5.
      *   *If No:* You are in the **Design Stance**. You rigged it. Mark this scene "Critical Failure" and stop the test. You need a rewrite, not a check.

  **Minute 5-10: The Compression Check (The Pattern Test)**
  This tests if the trait is "load-bearing" or "decorative."
  1.  **Label:** Name the trait involved (e.g., "Miserly," "Cynical," "Brave").
  2.  **History:** Look at the previous 11 chapters. How many times did they act according to this label? How many times did they act against it?
  3.  **The Sentence Test:** Try to write a summary of the character using this trait.
      *   *Real Pattern:* "John is a miser who hoards cash." (Predicts he won't lend money).
      *   *Noise:* "John is a miser who hoards cash, except when he's in love, except when it's Tuesday, except when the plot needs him to spend."
  4.  **Verdict:** Does the label simplify the explanation of their behavior, or does it require more footnotes than it saves?
      *   *Simplifies:* Load-bearing pattern.
      *   *Complicates:* Decorative pattern (you named it, but it's not doing work).

  **Minute 10-15: The Reader Prediction Bet**
  Imagine a bettor reading Chapter 11. They know the character's history. They do *not* know your outline.
  1.  **The Odds:** If the bettor had to wager money on whether the character would perform the Chapter 12 action, what are the odds?
      *   *Even money or better:* The pattern is established.
      *   *Long shots (10 to 1):* The action is a surprise.
  2.  **The Justification:** Is the surprise *earned* by new information in Chapter 12, or is it a surprise because it contradicts Chapter 1-11?
      *   *New Info:* "He learned the borrower is his daughter." (Valid update).
      *   *Contradiction:* "He just felt like it." (Noise).

  **Minute 15-20: The Verdict & Triage**
  Combine the scores.
  *   **Pass:** Intentional Audit (Yes) + Compression (Simplifies) + Bet (Even/Odds). **Keep the scene.**
  *   **Fail:** Intentional Audit (No) OR Compression (Noise) OR Bet (Contradiction). **Cut or Rewrite.**
  *   **The "Design" Warning:** If you find yourself arguing "But the theme requires it," you are using the Design Stance to override the Intentional Stance. This is where "rigging" happens.

  ---

  ### Running the Procedure on Your Three Cases

  Here is the honest output of the test on the scenarios you provided.

  #### Case A: The Lifelong Miser Refuses to Lend Money
  *   **Intentional Audit:** Belief ("I will lose this money"), Desire ("Security"), Cost ("Social capital"). Logic holds.
  *   **Compression:** Label "Miser" predicts this action perfectly. Zero footnotes needed. High compression.
  *   **Reader Bet:** A bettor would wager heavily on "No."
  *   **Verdict:** **PASS.** This is a Real Pattern. Your editor is likely wrong, or there is a context clue you missed. The trait is load-bearing.
  *   **Action:** Stand your ground, but check if you accidentally signaled he *might* lend earlier.

  #### Case B: The Cynical Narrator Does Something Generous
  *   **Intentional Audit:**
      *   *Risk:* Cynics believe generosity is stupid.
      *   *Check:* Did the narrator's *belief* change in Chapter 12? Or did their *desire* shift?
      *   *Scenario:* If they give money because they suddenly "felt nice," the Audit fails. If they give money because "it was the only way to shut the beggar up so I could work," the Audit passes. The action looks generous, but the intention is cynical.
  *   **Compression:** If you have to say "He is a cynic, but sometimes he's generous," that is low compression. If you say "He is a cynic who uses money to control interactions," generosity becomes a control tactic. The pattern holds, but the definition deepens.
  *   **Reader Bet:** If the generosity is pure altruism, the bettor loses. If it's transactional generosity, the bettor wins.
  *   **Verdict:** **CONDITIONAL PASS.**
      *   *Keep it IF:* You can frame the generosity as serving the cynicism (e.g., buying silence, alleviating guilt that annoys them).
      *   *Cut it IF:* It is pure altruism with no setup. That is noise. You are projecting "humanity" onto a pattern you built as "inhuman."
  *   **Action:** Rewrite the internal monologue. Make the generosity selfish. Then the pattern remains real.

  #### Case C: The Character Whose "Trait" Is Really Just Plot Movement
  *   **Intentional Audit:** **FAIL.**
      *   Why did they do it? "Because they needed to enter the room."
      *   What did they believe? "I shouldn't enter the room."
      *   Conflict: Belief vs. Action. The only bridge is "The Author made me."
  *   **Compression:** **FAIL.**
      *   Label: "Impulsive."
      *   Reality: "Impulsive, except when cautious, except when brave."
      *   This label adds zero predictive power. It is decorative. You painted a stripe on a car and called it an engine.
  *   **Reader Bet:** **FAIL.** The bettor loses every time. The behavior is random relative to the character's history.
  *   **Verdict:** **HARD FAIL.** This is the Design Stance masquerading as the Intentional Stance. You rigged the puppet.
  *   **Action:** **Cut the scene.** I know you love it. I know it moves the plot. But if the character is a puppet here, the reader will feel the strings, and the emotional investment will collapse. You must either change the plot to fit the character or rewrite the character's history (Chapters 1-11) to make this action inevitable. Usually, cutting the scene is the honest choice.

  ---

  ### What This Procedure Cannot Do

  Be aware of the tool's limits. Dennett's framework is about *prediction* and *structure*, not *art*.

  1.  **It Cannot Measure Resonance:** A scene can be "inconsistent" (Fail the test) but thematically brilliant. Sometimes a character *should* break pattern for a moment of transcendence. The test will flag this as "Noise." You have to overrule the test if the thematic payoff is worth the break in realism.
  2.  **It Cannot Fix Bad Writing:** If the Intentional Audit passes (the logic is there) but the prose is muddy, the editor will still say "it comes out of nowhere." The test checks the *structure* of the character, not the *clarity* of the prose.
  3.  **It Cannot Replace the Editor:** The editor represents the "Reader Bet." If the test says "Pass" but your editor still says "No," you likely failed the *Compression* check. You know the trait is real because you wrote it; they don't see it because you haven't compressed it into the text efficiently.
  4.  **It Cannot Handle "Growth":** This test is best for static consistency. If Chapter 12 is the *turning point* where a miser learns to give, the test will flag it as a contradiction. You must ensure the *process* of change is visible, or the test will tell you to cut the growth.

  **Final Advice:** Use the test to find the weak joints. If Case C comes up, trust the test. A plot that moves on its own steam is better than a plot dragged by a puppet.
