answer: |-
  The trio huddled behind the amp. "Vote: Does pay cover gas?" Singer yes, Drummer yes, Bassist no. Majority yes.

  "Vote: Is the venue all-ages?" Singer no, Drummer yes, Bassist yes. Majority yes.

  "Vote: Do we take the gig?" Singer no, Drummer yes, Bassist no. Majority no.

  The promoter blinked. "So you confirm the money is good."

  "Majority says so," said the singer.

  "And the venue fits your ethics."

  "Majority says so," said the Bassist.

  "But you're not playing."

  "Majority says no," said the Drummer.

  "How can you accept the premises but reject the conclusion?"

  "We don't," said the singer. "The majority accepts the premises. A different majority rejects the conclusion."

  "So who do I write the check to?"

  "The majority on pay. They exist. Just don't ask them to show up."
