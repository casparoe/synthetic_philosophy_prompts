answer: |-
  ### Specification for a Theory of Propositional Unity
  **Seminar Handout: Pre-Theoretical Constraints**

  Before evaluating specific accounts (Russellian, Fregean, Possible Worlds, Act-Type, etc.), we must establish the adequacy conditions. A theory of the proposition is not merely a theory of truth-bearers; it is a theory of *structured content*. The following seven requirements delineate what such a theory must explain.

  #### The Requirements List

  **1. The Non-Arbitrariness Constraint (Bradley's Regress)**
  *   **The Case:** Unity cannot be gratuitous. If a proposition is a complex of constituents (e.g., Socrates + Mortality), there must be an explanation for why these form a *unit* rather than a mere list. If unity comes for free, any collection ({Socrates, Redness, Running}) counts as a proposition, and the problem of distinguishing a proposition from a set is merely relocated.
  *   **Requirement:** The theory must identify a principled difference between a unified content and an ununified aggregate.

  **2. The Truth-Value Neutrality Constraint**
  *   **The Case:** Consider the false proposition *that Caesar died in his bed*. Caesar did not die in his bed. If the unity of the proposition depended on the *actual obtaining* of the state of affairs, this content would not exist (or would be fragmented) because the fact does not obtain. Yet we grasp it, assert it, and deny it.
  *   **Requirement:** A false proposition must possess exactly the same degree and kind of unity as a true one. Unity cannot depend on worldly verification.

  **3. The Structural Sensitivity Constraint**
  *   **The Case:** *Socrates loves Alcibiades* and *Alcibiades loves Socrates* involve the exact same constituents (Socrates, Alcibiades, Loving). Yet they are distinct propositions with different truth conditions. Furthermore, {Socrates, Alcibiades, Loving} arranged as "Alcibiades is loved by Socrates" is distinct from "Socrates loves Alcibiades."
  *   **Requirement:** The theory must account for how the *arrangement* of constituents contributes to identity conditions without appealing to extra constituents (which invites regress).

  **4. The Mind-Independence Constraint**
  *   **The Case:** Two thinkers can grasp the *same* content. Conversely, there are truths (e.g., specific mathematical conjectures before discovery) that are representable but currently unthought. If unity were conferred by a psychological act of judging, the content would be private or non-existent until thought.
  *   **Requirement:** The unity of the proposition cannot be constituted by an act of a mind. The content must be shareable and stable across thinkers and times.

  **5. The Intentionality Constraint (Representation vs. Aggregation)**
  *   **The Case:** A heap of stones hangs together (via gravity/friction), but it does not *say* anything. A proposition hangs together and *says* that something is the case. A theory that explains unity merely as metaphysical binding fails to explain how the unified object *points beyond itself* to a world.
  *   **Requirement:** The account must explain what makes the unified thing representational (truth-apt) rather than merely ontological (a complex object).

  **6. The Recursion Constraint (Embedding)**
  *   **The Case:** We can say, *Alice believes that Bob hopes that it is raining.* The proposition *that it is raining* occurs as a constituent within a larger propositional attitude.
  *   **Requirement:** The account of unity must be scalable. The mechanism that unifies a simple proposition must allow that proposition to function as a constituent within a higher-order unity without losing its identity or creating a category mistake.

  **7. The Singleton Constraint (The Neglected Case)**
  *   **The Case:** Consider *that Socrates exists* or the impersonal *that it is raining*. On many analyses, these appear to have only one constituent (Socrates; Rain) or lack a clear subject-predicate split. Standard relational theories rely on a relation (e.g., instantiation) to bind a subject to a property. If there is only one constituent, there is nothing for the unifying relation to *relate*.
  *   **Requirement:** The theory must explain the unity of propositions that lack a binary predicative structure without artificially inflating the ontology (e.g., by positing "existence" as a property where none is needed).

  ***

  #### Meta-Analysis of the Requirements

  **Non-Negotiable vs. Partisan**
  *   **Non-Negotiable:** 1 (Non-Arbitrariness), 2 (Truth-Value Neutrality), 3 (Structural Sensitivity), 5 (Intentionality). These define the pre-theoretical notion of "propositional content" in a realist semantics. Without these, you are not theorizing propositions; you are theorizing sentences, mental states, or facts.
  *   **Partisan:** 4 (Mind-Independence) is rejected by idealists and some pragmatic naturalists. 6 (Recursion) is challenged by those who view propositions as sentential types rather than abstract objects. 7 (Singletons) is often ignored by binary predicative theories, but accepting it is necessary for a theory that handles existential and weather reports without ontological gerrymandering.

  **The Incompatible Pair**
  Strictly speaking, the list is designed to be consistent. However, the pair generating the deepest tension—often treated as a functional incompatibility in contemporary literature—is **4 (Mind-Independence) and 5 (Intentionality)**.
  *   *The Conflict:* How can an abstract, mind-independent object (Req 4) possess intrinsic "aboutness" or representational power (Req 5)? Representation is typically a function of use or mind. Satisfying 4 usually drains the object of 5 (leading to "propositions as dead objects"), while satisfying 5 usually requires importing a mind (violating 4). This is the core of the "Problem of the Proposition."

  **The "Killer" Requirement**
  **Requirement 5 (Intentionality)** rules out the most otherwise attractive accounts.
  *   *Why:* Many theories (Russellian tuples, Possible Worlds sets, Situation Semantics) successfully handle structure, falsity, and mind-independence. They fail because they cannot explain why the structure *asserts* anything. A set of worlds does not *say* the world is this way; it just *is* a set. An ordered triple does not *claim* aRb; it just *is* ordered. This requirement forces the move from metaphysics to semantics, which is where most theories collapse.

  **Candidate Score: The Ordered Triple (<a, R, b>)**
  *   **Theory:** The proposition that *aRb* is identical to the mathematical ordered triple <a, R, b>. Unity is nothing over and above the ordering.
  *   **Score:** **3/10 (Fail)**
  *   **Assessment:**
      *   *Passes:* 1 (Non-Arbitrariness: sets are unordered, triples are not), 3 (Structural Sensitivity: <a,R,b> ≠ <b,R,a>), 6 (Recursion: triples can nest).
      *   *Fails:* 2 (Truth-Value Neutrality:勉强 passes, but struggles with falsehood if identified with facts), 4 (Mind-Independence: Passes).
      *   *Critical Failure:* **5 (Intentionality).** As Soames and King have argued, there is no reason why the triple <Socrates, Loving, Alcibiades> represents *that Socrates loves Alcibiades* rather than *that Alcibiades loves Socrates* or simply listing three items. The ordering distinguishes them, but it does not confer *assertoric force*.
      *   *Critical Failure:* **7 (Singletons).** An ordered triple requires three places. A proposition like *that it is raining* cannot be a triple without positing dummy constituents (e.g., <Rain, Instantiation, World>), which violates ontological parsimony and arguably misdescribes the content.

  ***

  #### Confidence and Uncertainty

  **Confidence in the List:** **85%**
  This list captures the structural, modal, and semantic constraints required for a robust realist theory of propositions. It avoids the trap of focusing solely on Bradley's Regress (Requirement 1) by ensuring the theory also accounts for semantic power (Requirement 5) and edge cases (Requirement 7).

  **Least Certain Requirement:** **7 (The Singleton Constraint)**
  I am least sure this belongs as a *non-negotiable* requirement. It is possible that all propositions are fundamentally binary (subject-predicate) and that *that Socrates exists* is logically surface-deep, actually analyzing to *that Socrates has existence*. If one adopts a universal predicative logic, Requirement 7 dissolves. However, including it is heuristically vital because it exposes the weakness of relational binding theories. If a theory cannot handle the singleton case without artificial inflation, it is likely forcing the data to fit the model. Thus, while its status as a "requirement" depends on one's logical ontology, its utility as a "test" is high.
