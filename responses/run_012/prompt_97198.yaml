      *   *Refinement on the Classmate's Logic:* The classmate says "US came out on top... so standard account blames Soviets." This implies the narrative is *determined* by victory. To conclude "there is no getting behind that" (i.e., we can't know the truth), they need to assume the narrative is *purely* a function of victory, not evidence.

  8.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceeds to generate output based on these thoughts).

