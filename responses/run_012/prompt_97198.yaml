          2.  Classify each claim (Platitude, Defensible but Contested Thesis, False).
          3.  Analyze which readings the classmate *needs* for their conclusion vs. which do no work vs. which they likely *have in mind*.
          4.  Format: Present as a "menu" of readings, not settling on one.

  2.  **Deconstruct the Aphorism ("History is written by the victors"):**
      *   What does it actually mean? It's ambiguous.
      *   *Literal/Archival:* Winners keep records; losers' records are destroyed.
      *   *Narrative/Political:* Winners control education, media, and public memory.
      *   *Epistemological:* There is no objective truth, only power-knowledge.
      *   *Moral:* "Blame" is a political tool, not a historical fact.

  3.  **Drafting the Distinct Claims (The Menu):**

      *   *Claim 1: The Archival Claim.* Winners preserve documents; losers' archives are lost.
          *   *Classification:* Platitude/Exaggeration. (Sometimes true, often false. Soviet archives opened in the 90s, etc.)
      *   *Claim 2: The Hegemonic Claim.* Winners control institutions (schools, media) that disseminate the narrative.
          *   *Classification:* Defensible but Contested Thesis. (Soft power exists, but academic history is more complex.)
      *   *Claim 3: The Epistemological Claim.* There is no objective "who started it"; truth is relative to power.
          *   *Classification:* False/Philosophically Problematic. (Denies causality exists independent of narration.)
      *   *Claim 4: The Moral/Teleological Claim.* "Blame" implies a judgment that only the winner gets to make.
          *   *Classification:* Defensible but Contested Thesis. (Historians try to explain causality, not just assign legal blame.)

  4.  **Analyzing the Classmate's Argument:**
      *   *Conclusion:* The standard account (Soviets started it) is suspect *because* the US won. Therefore, we can't know/trust the answer.
      *   *Required Premise:* To say the account is *false* or *untrustworthy* solely due to victory, one needs a strong link between victory and narrative fabrication.
      *   *Likely Mindset:* They probably mean the Hegemonic Claim (US propaganda) mixed with the Epistemological Claim (no objective truth).
      *   *Weakness:* They ignore that historical consensus shifts (e.g., Revisionist/Post-Revisionist schools) *within* the victor's society. The US didn't just settle on one story; historians argued.

  5.  **Refining the Classifications:**
      *   *Platitude:* Something obviously true but trivial. (e.g., Winners have more resources to publish).
      *   *Defensible but Contested:* A serious historical argument. (e.g., State influence on public memory).
      *   *False:* Factually incorrect or logically incoherent. (e.g., Losers never write history, or objective causality doesn't exist).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's intuition (it is too quick) and set up the "menu" approach.
      *   **The Menu of Readings:** Four distinct interpretations of the aphorism.
          *   For each: The Claim, The Classification, Brief Explanation.
      *   **Diagnostic Analysis:**
          *   Which reading does the classmate *need*? (The strong epistemological one).
          *   Which reading is *doing no work*? (The archival one, usually).
          *   Which reading do they *have in mind*? (Likely a muddled mix of Hegemonic and Epistemological).
      *   **Conclusion/Advice:** How to push back in the seminar (mentioning Revisionism, archival evidence from both sides).

  7.  **Self-Correction/Nuance Check:**
