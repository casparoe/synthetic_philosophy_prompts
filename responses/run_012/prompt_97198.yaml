answer: |-
  Your intuition is correct: the move is too quick because the aphorism is an ambiguity masquerading as an argument. It collapses distinct historical problems (archival access, narrative hegemony, epistemological truth, and moral judgment) into a single slogan. To diagnose your classmate's error, we need to disentangle what the sentence *could* mean.

  Here is a menu of four distinct readings of the claim "history is written by the victors," classified by their validity, followed by an analysis of which one your classmate is relying on.

  ### The Menu of Readings

  **1. The Archival Claim (About Evidence Survival)**
  *   **The Claim:** Victors preserve their own documents and destroy or seize the documents of the defeated; therefore, future historians only have access to the victor's data.
  *   **Classification:** **Platitude (with exaggeration).**
  *   **Analysis:** It is trivially true that victors have more resources to archive materials. However, as a universal rule, it is empirically false. Losers often keep diaries, underground records, or have their archives captured intact (e.g., German and Soviet archives were captured by the West, but eventually opened to researchers). In the Cold War specifically, Soviet archives opened in the 1990s, allowing historians to check the "victor's" narrative against the "loser's" internal memos.

  **2. The Hegemonic Claim (About Control of the Telling)**
  *   **The Claim:** Victors control the institutions (schools, media, state funding) that disseminate history, marginalizing counter-narratives until they become the "standard account."
  *   **Classification:** **Defensible but Contested Thesis.**
  *   **Analysis:** This is a serious argument in the sociology of knowledge. States do promote narratives that legitimize their power. However, it is contested because academic history often operates counter to state interests. In the US, for example, the "standard account" of the Cold War shifted dramatically from the 1950s (Orthodox) to the 1960s (Revisionist) to the 1970s (Post-Revisionist), despite the US remaining the "victor" throughout. If victors strictly wrote history, this internal debate would not exist.

  **3. The Epistemological Claim (About Factuality)**
  *   **The Claim:** There is no objective "fact of the matter" regarding causality; truth is relative to power. Therefore, asking "who started it" is a category error because the answer is always constructed by the winner.
  *   **Classification:** **False (Methodologically Paralyzing).**
  *   **Analysis:** This moves from sociology to philosophy. It claims that causality itself is a fiction created by the winner. This is false because historical events (troop movements, treaty violations, diplomatic cables) occur independently of their narration. While *interpretation* varies, the *sequence of events* is subject to verification. If this claim were true, no historical inquiry would be possible, only a study of propaganda.

  **4. The Moral Claim (About the Role of 'Blame')**
  *   **The Claim:** "Blame" is a legal or moral judgment, not a historical explanation. Victors use history to assign guilt to the defeated to justify their victory, rather than to explain causes.
  *   **Classification:** **Defensible but Contested Thesis.**
  *   **Analysis:** Many professional historians agree that "who started it" is a loaded question that seeks a villain rather than a structural explanation (e.g., security dilemmas, multipolar instability). However, distinguishing between *causality* (actions taken) and *blame* (moral responsibility) is a nuance the aphorism ignores. The victor may impose *blame*, but they do not necessarily invent the *actions* that led to the conflict.

  ***

  ### Diagnostic Analysis of Your Classmate's Argument

  To conclude that "there is no getting behind that" (i.e., that we cannot determine who started the Cold War), your classmate is making a specific logical leap. Here is how the readings above function in their argument:

  **1. Which reading do they *need* to reach their conclusion?**
  They **need Reading #3 (The Epistemological Claim).**
  To shut down the question entirely—to say we *cannot* know the truth—they must assume that evidence and causality are irrelevant compared to power. If they only believed Reading #2 (Hegemony), they would have to admit that the truth *exists* but is currently suppressed, which would invite further research rather than shutting it down. To declare the question unanswerable, they must believe the answer is purely a construct of victory.

  **2. Which reading is doing *no work*?**
  **Reading #1 (The Archival Claim) is doing no work.**
  If they were arguing from evidence survival, they would have to acknowledge that Soviet archives *are* now available and have been scrutinized by Western historians for thirty years. Since they are dismissing the consensus despite the availability of opposing records, they are not actually arguing about missing documents; they are arguing about bias.

  **3. Which reading do they most likely *have in mind*?**
  They most likely have a muddled mix of **Reading #2 (Hegemony)** and **Reading #4 (Blame).**
  In a seminar context, students usually invoke this aphorism to point out political bias (Hegemony). They are thinking: *"The US won, so US textbooks say the US was right."* They conflate the *political utility* of the narrative (Blame) with the *historical accuracy* of the narrative. They assume that because the narrative serves a political purpose for the victor, it must be factually void.

  ### How to Push Back
  You can point out that the "standard account" of the Cold War is not a monolith created by the US government. It is the result of decades of fighting *within* the victor's society.
  *   **The Revisionists:** In the 1960s, American historians (the victors' own scholars) argued the US provoked the Soviets.
  *   **The Post-Revisionists:** Later, scholars used archives from *both* sides to argue it was a structural security dilemma, not just one villain.

  If history were truly written *only* by the victors in the way your classmate suggests, American historians would not have spent forty years arguing that the United States bore significant responsibility for the conflict. The existence of that debate proves the "victor's narrative" is not a sealed room.
