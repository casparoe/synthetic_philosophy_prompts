  ### Framing

  Our guest argues that pairing Darwin and Turing as twin champions of "competence without comprehension" obscures a critical equivocation between evolutionary history and formal computation. She contends that conflating selectional competence with computational competence renders our debates about AI and animal minds systematically slippery. Today we will dissect whether these two inversions are truly distinct or merely different descriptions of the same naturalistic phenomenon.

  ### Questions

  1. You argue Darwin and Turing invert different explanatory orders, but reinforcement learning seems to bind selection pressures directly to weight updates; doesn't this architecture collapse your distinction into a single optimization process?
     **Likely answer:** She will argue that RL simulates selection but lacks the lineage history required for true Darwinian competence.
     **Follow-up:** If the simulation is functionally indistinguishable from the history, why does the ontological origin matter for competence attribution?

  2. Turing's inversion relies on syntax being semantically ungrounded, whereas Darwin's relies on functions being biologically grounded; is the equivocation actually just a confusion about what grounds the competence in each case?
     **Likely answer:** She will agree that grounding is the key difference, with biology grounding in survival and computation grounding in rule-following.
     **Follow-up:** Does this imply that AI competence is inherently ungrounded until it is embedded in a reproductive lineage?

  3. You locate selectional competence in the lineage rather than the organism; does this mean an individual animal never possesses competence, but only borrows it from its ancestors?
     **Likely answer:** She will clarify that individuals exhibit competence but the explanation for that competence resides in the population history.
     **Follow-up:** If the individual is merely the vehicle, can we ever justify attributing cognitive states to the animal rather than the lineage?

  4. Both frameworks must account for error, yet a computational error differs from a fitness failure; how does your distinction prevent us from misdiagnosing an AI's hallucination as a biological malfunction?
     **Likely answer:** She will argue that hallucinations are computational deviations, not fitness failures, unless the AI is part of a reproducing system.
     **Follow-up:** Does this render current AI safety frameworks category mistakes if they treat computational errors as existential risks?

  5. If a system can possess computational competence without any selectional competence, does this grant AI a form of agency that is entirely detached from biological value?
     **Likely answer:** She will assert that such agency is real but normatively empty without selectional history to anchor goals.
     **Follow-up:** If the goals are anchored only by human prompts, isn't the competence ultimately borrowed from the human lineage instead?

  6. You describe the slide between these competences as slippery; is the slipperiness a feature of our language or a feature of the systems we are studying?
     **Likely answer:** She will claim the slipperiness is linguistic, arising from using competence as a univocal term for distinct phenomena.
     **Follow-up:** If we coined distinct terms tomorrow, would the conceptual confusion vanish or would the underlying structural similarity persist?

  7. Critics might say you are merely redescribing the classical distinction between phylogeny and ontogeny; what work is this specific framework doing that evolutionary developmental biology does not?
     **Likely answer:** She will respond that phylogeny and ontogeny are both biological, whereas her distinction crosses the biological-computational divide.
     **Follow-up:** If Turing machines are physical objects subject to entropy, doesn't their operation ultimately fall under biological physics anyway?

  8. Human cognition seems to embody both inversions simultaneously; are we the exception that proves the rule, or the merger that dissolves it?
     **Likely answer:** She will suggest humans are the unique site where computational rules are harnessed by selectional history.
     **Follow-up:** Does this unique status make human cognition a poor model for understanding either pure AI or pure animal instinct?

  9. What empirical discovery in neurobiology or machine learning would force you to abandon the claim that these two inversions are fundamentally distinct?
     **Likely answer:** She would concede that finding a formal rule embedded directly in genetic code without developmental mediation would challenge the view.
     **Follow-up:** Given that DNA is itself a code, why isn't that already evidence that the formal and the biological are inseparable?

  10. If competence belongs to a lineage in Darwin's case and a system in Turing's, what happens to the explanation when the system is designed by a lineage?
      **Likely answer:** She will argue the competence remains computational until the system itself becomes part of a reproductive lineage.
      **Follow-up:** Does this imply that AI can never truly be competent in the Darwinian sense until it builds its own successors?

  ### Closing

  If you had to identify which inversion is currently doing more damage in AI discourse, would you say it is the treatment of computational competence as selectional competence, or the reverse, and what would you concede about the robustness of your framework if the opposite confusion turned out to be the greater threat?
