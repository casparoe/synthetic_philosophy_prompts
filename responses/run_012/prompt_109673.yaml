prompt: |-
  Ok so I've been going down a rabbit hole on this guy Dennetts ladder of minds thing and I want a real number out of you, not a essay that ends in "it depends". The ladder as I understand it goes: Darwinian creatures are the ones that just come pre-wired, natural selection did the thinking for them. Skinnerian ones can learn from reward and punishment, they try stuff and keep what works. Popperian ones can run the trial in their head and let the guess die instead of them, and Gregorian ones are Popperians who also pick up thinking tools from their culture, mainly language, and get smarter than their own brains would allow on their own. Fine.

  Heres my question. Take a current frontier LLM, no tools, just the model and a prompt. Whats your credence that it is a Gregorian creature in the intended sense, and not just a very fancy Popperian one, or something that doesnt fit the ladder at all?

  I want the decomposition, not the vibe. So give me a number for each of these and tell me how they combine:

  1. That the ladder is even picking out real kinds, and not just one axis of "how much internal modelling plus cultural scaffolding" dressed up as four steps.
  2. That the thing that actually makes a creature Gregorian is using external tools as part of the thinking, vs just using them as output devices.
  3. That an LLM is doing the Popperian move at all, ie generating candidates and killing the bad ones internally, vs emitting the first thing that sounds right.
  4. That "creature" is doing real work here, meaning the category only applies to something with its own history of being selected, its own stakes, something that can be wrong in a way that costs it.

  And heres the bit I actually care about. I've started calling this other option a Ouija creature: it moves the planchette and the words come out, but the selecting is being done by somebody else, either the person at the table or the pile of text it was trained on. My gut says thats the honest description of an LLM and that "Gregorian" is flattery. So whats your credence that Ouija is the right category rather than Gregorian, and which of the four terms above is my number most sensitive to? Also tell me what would actually move you on that one term, like what you'd want to see, not just "more research". I'm at about 0.75 on Ouija, for what its worth.
