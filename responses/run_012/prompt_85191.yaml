  **DISEASE DESIGNATION BOARD (DDB) OPERATIONAL MANUAL**
  **SECTION 9.0: PATHOLOGY ADJUDICATION AND REFERENCE CLASS ASSIGNMENT**

  **9.1 General Principle.**
  A condition is designated Pathological only if it represents a deviation from species-typical functional efficiency. Efficiency is measured relative to a statistically defined Reference Class (RC). Selection of RC is binding for subsequent adjudications involving analogous physiological states. Financial liability follows designation unless exempted by Section 9.2 (Social Utility).

  **9.2 Precedent: Senescence.**
  **Ruling:** Non-pathological.
  **RC:** Humans aged 80+.
  **Reasoning:** While metabolic and musculoskeletal efficiency decline relative to young adults, such decline is statistically universal within the RC. To designate universal decline as pathological would render the RC extinct. Therefore, functional loss is reclassified as "typical maintenance."
  ^1 *Dissent: Functional loss remains harmful regardless of statistical frequency.*

  **9.3 Precedent: Gestation.**
  **Ruling:** Non-pathological (Covered Benefit).
  **RC:** Females aged 15–45.
  **Reasoning:** Gestation induces significant deviation from baseline homeostasis (e.g., altered glucose tolerance, increased cardiac load). However, per Section 9.1, this aligns with species-typical design. Consistency with 9.2 requires that acute functional stress be ignored if statistically typical for the RC. Coverage is mandated by Section 9.2 (Social Utility).
  ^2 *Dissent: Typicality does not necessitate subsidy; this conflates biology with budget.*

  **9.4 Precedent: Androgenic Alopecia.**
  **Ruling:** Non-pathological.
  **RC:** Males aged 50+.
  **Reasoning:** Hair follicle miniaturization reduces protective efficiency. However, prevalence exceeds 50% within the RC. Per 9.2 (Senescence), statistically universal functional decline within an age-stratified RC cannot constitute pathology. To rule otherwise would contradict 9.2. Intervention is deemed cosmetic.
  ^3 *Dissent: Social harm constitutes disease regardless of follicular statistics.*

  **9.5 Precedent: Bereavement Response.**
  **Ruling:** Pathological (if duration > 180 days).
  **RC:** Widowed Persons.
  **Reasoning:** Acute grief induces functional impairment (sleep disruption, appetite loss). Per 9.3 (Gestation), temporary functional alteration for a social end is non-pathological. However, unlike gestation, grief lacks a fixed biological terminus. To maintain consistency with 9.2 (efficiency norms), deviation extending beyond 180 days is reclassified as inefficiency within the RC.
  ^4 *Dissent: Grief is not a function to be optimized; this medicalizes morality.*

  ***

  **Author's Note on Philosophical Commitments**

  This parody targets the "Biostatistical Theory" of health (chiefly Christopher Boorse), which defines disease as value-free dysfunction relative to a reference class, versus Normativist views (e.g., Nordenfelt) that require harm or disadvantage. The satire assumes the insurer attempts to adopt Naturalism to appear objective but inevitably smuggles in Normative judgments (cost, social utility) while maintaining Naturalist language.

  It is likeliest to be unfair to sophisticated Naturalists, who argue reference classes should be chosen based on homogeneous functional design, not merely age or cost-saving convenience. Boorse himself warned against ad hoc reference class selection. The parody misses its mark if actual insurance adjudication relies on explicit ethical frameworks rather than the implicit, inconsistent habituation described here. If insurers openly admit they deny coverage for baldness because it is cheap to exclude rather than because it is "species-typical," the satire loses its bite.
