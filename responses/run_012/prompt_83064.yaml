answer: |-
  Light spills across the tin, nothing looks the **same**.
  I lift a shard of plastic to the **pile**.
  Fingertips brush, a cold and sudden **touch**.
  This one is chipped, though deeply, clearly **red**.
  That one is smooth and perfectly **round**.
  Does the hole in the lid say what should **fit**?

  The metal rim asks what will **fit** inside.
  But I am sorting not by size but **same**.
  Some roll away, refusing to stay **round**.
  I make a space, a growing, shifting **pile**.
  Is the color in the eye or truly **red**?
  Steel meets plastic with a clicking **touch**.

  No two surfaces exactly **touch**.
  Yet this one seems to **fit** the last one's place.
  Not because of the dye, however **red**,
  It rests beside the others, still the **same**.
  Or perhaps because it is not quite **round**.
  I add it to the left-hand **pile**.

  A mountain grows from every added **pile**.
  Microscopic ridges never **touch**.
  One is slightly oval, not quite **round**.
  Still, the eye insists that they will **fit**.
  I put it back and take the **same**.
  Another glows, a darker, duller **red**.

  There is no core to the pigment **red**.
  Just a habit of building the **pile**.
  I pick one up; it looks the **same**.
  Does the wood beneath my hand **touch** wood?
  Or do they merely **fit** together here?
  While another lies aside, less **round**.

  Some are flat, some bulge, not truly **round**.
  Some fade from bright to brownish **red**.
  Nothing here was made to **fit** a rule.
  I separate them into another **pile**.
  Air between them prevents direct **touch**.
  Yet I swear the feeling is the **same**.

  Child, you will sort the red into a pile,
  Feel how the round surfaces touch,
  And fit your hand to the same.

