answer: |-
  ### The Menu of Readings: "Absence of Evidence is Not Evidence of Absence"

  **1. The Logical Tautology**
  *   **The Claim:** A lack of definitive proof for $X$ does not constitute definitive proof for *not-$X$*.
  *   **Verdict:** **Trivial.** In formal logic, you cannot derive a negative existential solely from a lack of positive data without an additional premise stating that your search was exhaustive.
  *   **Utility:** Useful for reminding people that history is not mathematics, but it settles no historical arguments on its own.

  **2. The Probabilistic Null**
  *   **The Claim:** Finding no record of $X$ should not lower our confidence (credence) that $X$ existed. The probability remains unchanged.
  *   **Verdict:** **False.** In Bayesian terms, if the existence of $X$ makes the presence of a record *more likely* than the non-existence of $X$ does, then the absence of that record *must* lower the probability of $X$'s existence, even if only slightly. Silence is almost never neutral; it is usually a negative weight.
  *   **Utility:** This is the reading your friend is relying on, but it is mathematically indefensible unless the record is known to be completely random with respect to the village's existence.

  **3. The Incomplete Search (Epistemic Gap)**
  *   **The Claim:** We haven't looked everywhere, or the archive is fragmentary; therefore, the specific missing document might yet turn up.
  *   **Verdict:** **Substantive and Defensible.** If the survey is known to be partial (e.g., only 10% of medieval tax rolls survive), then the absence of a specific village in the surviving 10% is weak evidence of absence.
  *   **Utility:** This shifts the burden to the nature of the source. Is the survey comprehensive or fragmentary?

  **4. The Irrelevant Record**
  *   **The Claim:** The type of evidence missing is not the kind that would be generated by $X$ even if $X$ were true.
  *   **Verdict:** **Substantive and Defensible.** If the tax roll only records landholders with ploughs, and the village was a fishing hamlet, its absence is not evidence it didn't exist.
  *   **Utility:** This requires analyzing the *criteria* of the source, not just its existence.

  ***

  ### The Historical "Argument from Silence"

  Historians do not treat silence as a void; they treat it as data. To use silence as evidence of absence (or presence), three conditions (often attributed to Gilbert Garraghan) must be met:

  1.  **Competence:** The source must be capable of recording the event (e.g., the tax collector had jurisdiction over that district).
  2.  **Expectation:** The source would normally record such an event if it occurred (e.g., the survey aims for 100% coverage of taxable units).
  3.  **Integrity:** The source has survived without significant loss (e.g., we have the full roll, not a torn fragment).

  If these conditions hold, **absence of evidence *is* evidence of absence.** If your friend's survey was a comprehensive royal assessment intended to capture every taxable entity, the village's omission is strong probabilistic evidence that it was not a taxable entity at that time (either it didn't exist, was too small, or was exempt).

  ***

  ### Text vs. Archaeology

  The logic holds for both, but the "Expectation" criterion changes:

  *   **Texts:** Silence is often **intentional**. A village might be omitted due to political bias, exemption, or scribal error. You must ask: *Did the author have a reason to leave this out?*
  *   **Archaeology:** Silence is often **taphonomic** (preservation bias). A wooden village might leave no trace compared to a stone one. You must ask: *Would the physical conditions preserve this if it were there?*

  In your friend's case (a tax roll), this is a textual problem. The bias is administrative, not geological.

  ***

  ### Verdict on Your Friend's Move

  Your friend is deploying **Reading 1 (The Logical Tautology)** to shield **Reading 2 (The Probabilistic Null)**.

  *   **The Switch:** She is correct that the missing entry is not *logical proof* the village didn't exist (Reading 1). However, she is implying that the missing entry should not *lower our confidence* that it existed (Reading 2).
  *   **The Error:** Unless she can demonstrate that the survey was fragmentary (Reading 3) or that the village would be exempt from that specific tax (Reading 4), the silence of a comprehensive survey *does* shift the probability. She is using a logical truth to evade a probabilistic burden.
  *   **The Counter:** Ask her: "If this survey is comprehensive, does the village's absence mean nothing? If it means nothing, why do we use the survey to map anything else?"
