prompt: |-
  Had a long arguement last night with a friend about Berkeley's economics — the Querist stuff, the Irish national bank scheme — and I came away not sure which of us was right. My friend's line is that Berkeley has basically a proto-chartalist credit theory of money: money isn't wealth, it's just a ticket or counter that measures and moves claims on goods and labor, so its value rests on convention and public backing, and a well-run national bank could issue it without any metallic hoard behind it. I said fine, but that can't be the whole story, because Berkeley also keeps saying the real wealth of a nation is the industry of its people, and he's clearly worked up about Irish unemployment and poverty, and I can't see how those pieces fit. If money is just a ticket, what's the ticket actually doing in his argument for the bank? And is any of this supposed to connect back to his idealism, or is it a separate practical project he ran as a bishop?

  So please explain the conceptual issue: what is Berkeley's account of what money is and what it does, and how does it hang together, or fail to, with his claims about national wealth and his bank proposal? Don't just run through the queries one by one — give me the underlying theory. And take a definite position: tell me which reading is right. Is he a coherent credit theorist well ahead of his time, or is his economics in tension with itself and with his philosophy? Defend whichever you pick, don't just lay out the options for me.
