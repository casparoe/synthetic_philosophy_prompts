prompt: |-
  I'm about three-quarters through a novel about a mid-level diplomat who spends the 2000s and 2010s watching the language of humanitarian war get written and rewritten, and the chapter I'm stuck on is Libya, 2011 — not the bombing, the paperwork around it. My protagonist ends up in a room where someone from the Brazilian mission is pushing the idea they were calling responsibility while protecting, and I want to get the intellectual stakes right before I put words in anyone's mouth. The way I understand the Brazilian move, it wasn't a rival to the responsibility to protect so much as a set of conditions bolted onto it: that force only come after the peaceful and diplomatic tools have genuinely been exhausted; that any force used be the minimum needed for the protection job rather than for the wider goal of toppling the regime; and that the states doing the intervening have to come back to the Security Council and give an account of how they used the mandate they were handed. I'm probably mangling the finer points, so correct me where I'm wrong.

  Here's what I want you to work through. Take the Libyan intervention as it actually played out — resolution 1973, the authorization of all necessary measures, the specific fear that Benghazi was about to be massacred, the no-fly zone and the arms embargo and the civilian protection mandate all bundled together, and then the way the campaign drifted from shielding civilians into escorting the rebels west, breaking the army, and eventually the killing of Gaddafi. Run that episode through the responsibility-while-protecting lens: who counts as the intervener, what would sequenced, proportional, and accountable have required at each fork in the road, and where does the lens actually bite — does it explain why the drift happened, or does it just redescribe it afterward in nicer words? I'm especially interested in whether the three conditions can all be satisfied at once in real time, because my instinct is that the urgency of protecting a city and the demand that you use the minimum force are pulling against each other, and the accountability condition seems to assume the body that authorizes the force is seperate from the body that wields it, which in this case it more or less wasn't.

  Then turn it around on the theory, because that's the part I can't do in my own head. What does Libya do to responsibility while protecting — does the episode vindicate it as a real corrective to R2P, or expose it as a set of principles nobody could ever actually be held to? And does the Brazilian proposal have anything to say about a Kosovo-style case, where the intervention happens without Council authorization at all, so there's no one to give an account to and the whole accountability leg just dangles? My protagonist is supposed to be persuaded by the Brazilian argument in one scene and disillusioned by it in another, and I need to know which of those scenes is the honest one. Skip the reading list, I'm not going to hunt down the actual concept papers — just give me the argument, mapped onto what happened, and tell me plainly where the mapping breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel about a mid-level diplomat observing the evolution of humanitarian war language (2000s-2010s).
      *   **Current Stuck Point:** A chapter set in Libya, 2011, focusing on the *paperwork* and the Brazilian concept of "Responsibility While Protecting" (RwP).
      *   **User's Understanding of RwP:** They summarize it as three conditions bolted onto Responsibility to Protect (R2P): 1) Exhaustion of peaceful means, 2) Minimum force/proportionality (no regime change), 3) Accountability/reporting back to the Security Council.
      *   **Task 1 (Historical/Theoretical Mapping):** Run the actual Libyan intervention (Res 1973, Benghazi threat, drift to regime change, Gaddafi's death) through the RwP lens. Analyze "who counts as intervener," "sequenced/proportional/accountable requirements," and "where the lens bites." specifically addressing the tension between urgency and minimum force, and the Council's dual role (authorizer vs. overseer).
      *   **Task 2 (Theoretical Critique):** What does Libya do *to* RwP? Does it vindicate it or expose it as unenforceable? How does RwP handle Kosovo-style (unauthorized) interventions?
      *   **Character Arc:** The protagonist needs to be persuaded by the argument in one scene and disillusioned in another. The user needs to know which scene is the "honest" one (or if both are).
      *   **Constraint:** Skip the reading list. Give the argument mapped onto events. Tell plainly where the mapping breaks.

  2.  **Deconstruct "Responsibility While Protecting" (RwP):**
      *   *Origin:* Brazil, 2011, amidst the Libya fallout.
      *   *Core Idea:* R2P is good, but implementation was abused. We need procedural guardrails.
      *   *The Three Pillars (User's summary is accurate):*
          1.  Last resort (exhaust diplomacy).
          2.  Proportionality (mandate limits, no regime change).
          3.  Accountability (monitoring, reporting back to UNSC).
      *   *The Vibe:* It's a Global South/BRICS attempt to rein in Western/NATO interventionism without killing the R2P norm entirely.

  3.  **Task 1: Mapping Libya 2011 through RwP:**
      *   *Resolution 1973:* Authorized "all necessary measures" to protect civilians. Established No-Fly Zone (NFZ).
      *   *The Drift:* Started as NFZ/stopping Gaddafi's tanks near Benghazi. Moved to arming rebels, striking command/control, enabling the march on Tripoli, culminating in Gaddafi's death.
      *   *Applying RwP Condition 1 (Last Resort):*
          *   *Reality:* Diplomacy was ongoing (AU proposals) but overtaken by the imminent threat to Benghazi.
          *   *RwP Critique:* Did NATO wait long enough? RwP says yes, wait. The counter-argument is "Benghazi was hours away from a massacre."
          *   *Tension:* Urgency vs. Procedure.
      *   *Applying RwP Condition 2 (Proportionality/Minimum Force):*
          *   *Reality:* NATO interpreted "protect civilians" as "ensure rebels win." You can't protect civilians if the regime stays in power (according to NATO logic).
          *   *RwP Critique:* This is the biggest breach. Regime change was not the mandate. Striking Gaddafi's compound? Maybe okay. Striking retreat columns? Grey area. Arming rebels? Definitely outside mandate.
          *   *Tension:* "Minimum force to protect" vs. "Force needed to win." If the threat is the regime itself, can you protect without removing the regime? RwP says yes (containment). NATO said no.
      *   *Applying RwP Condition 3 (Accountability):*
          *   *Reality:* The P3 (US, UK, France) dominated the narrative. Russia/China felt burned. Reporting was sporadic or self-congratulatory.
          *   *RwP Critique:* The UNSC authorized but didn't *monitor*. Once the bombs fell, the Council was sidelined.
          *   *Tension:* The user notes the authorizer and wielder are separate *in theory*, but in Libya, the wielders (NATO/P3) controlled the information flow back to the authorizer (UNSC).
      *   *Where the Lens Bites:* It explains *why* Russia/China vetoed Syria later. It identifies the specific grievance (mandate creep).
      *   *Where it Breaks:* It assumes a neutral arbiter exists to judge "minimum force" in the fog of war. It assumes the UNSC can actually rein in a coalition once they start bombing.

  4.  **Task 2: Theoretical Critique (What Libya does to RwP):**
      *   *Vindication or Exposure?* It exposes RwP as a *political* tool rather than a *legal* one. It's a set of principles with no enforcement mechanism. Who decides if force was "minimum"? The guy dropping the bombs or the guy getting bombed?
      *   *The Kosovo Problem:* RwP relies entirely on UNSC authorization (to enable accountability). If an intervention happens *without* the Council (Kosovo 1999), RwP has no leverage. There is no Council to report back to. RwP essentially says "Don't do that," which doesn't help if they already did.
      *   *The "Honest" Scene:*
          *   *Persuasion:* The diplomat sees the logic. R2P *was* hijacked. We need rules of the road. It feels responsible.
          *   *Disillusionment:* The diplomat realizes the rules are unenforceable. If NATO decides "regime change is the only way to protect," who stops them? The Council is paralyzed.
          *   *Verdict:* Both are honest. The *logic* is sound (persuasion), but the *mechanism* is hollow (disillusionment).

  5.  **Drafting the Response:**
      *   *Tone:* Intellectual, gritty, diplomatic, nuanced. Avoid academic jargon where possible, focus on the "room" and the "paper."
      *   *Structure:*
          1.  Validate the user's summary of RwP (it's accurate).
          2.  Run the Libya timeline through the three RwP filters (Sequencing, Proportionality, Accountability).
          3.  Address the specific tensions (Urgency vs. Restraint, Council role).
          4.  Turn the lens on the theory (Enforceability, Kosovo).
          5.  Advise on the Character Arc (The duality of the argument).
      *   *Key Insight to Highlight:* The definition of "Protection." NATO defined it as "Safety requires Victory." Brazil defined it as "Safety requires Restraint." This is the core conflict.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "authorizer vs. wielder" point? Yes, this is crucial. The P3 were on the Council *and* leading NATO. That's a conflict of interest RwP couldn't solve.
      *   *Check:* Did I address Kosovo? Yes, RwP collapses there because it's procedural, not substantive.
      *   *Check:* Character advice. Make sure the protagonist understands that RwP is a *warning* shot that failed to hit the target.

  7.  **Final Polish:** Ensure the distinction between R2P (the norm) and RwP (the Brazilian corrective) remains clear. Emphasize that RwP died quietly because no one wanted to bind their own hands.

  *(Self-Correction on "Honest Scene"):* The prompt asks "which of those scenes is the honest one." The answer isn't A or B, it's "Both, but for different reasons." The *principle* is honest; the *practice* is a fantasy. I need to make sure this distinction lands hard for the writer.

  8.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Your summary of **Responsibility While Protecting (RwP)** is accurate. You haven't mangling the finer points; you've grasped the core tension. The Brazilian note verbale (November 2011) was essentially a Global South attempt to put a governor on the engine of R2P. They weren't trying to kill the norm of humanitarian intervention; they were trying to stop it from becoming a license for regime change.

  Here is the mapping of the theory onto the history, followed by the theoretical critique you need for your protagonist's arc.

  ### Part 1: Running Libya 2011 Through the RwP Lens

  Resolution 1973 authorized "all necessary measures... to protect civilians and civilian populated areas under threat of attack." It explicitly excluded "a foreign occupation force."

  **1. Sequencing (Last Resort)**
  *   **The Theory:** Force is the absolute final step. Diplomatic channels must be demonstrably exhausted.
  *   **The Reality:** In March 2011, Gaddafi's forces were advancing on Benghazi. The African Union had a peace plan on the table. The Arab League was divided.
  *   **The RwP Critique:** A Brazilian diplomat in your room would argue the coalition moved too fast. The "imminent massacre" narrative (fueled by Gaddafi's "no mercy" speech) created a moral emergency that bypassed the procedural requirement to wait.
  *   **Where it Bites:** This condition highlights the conflict between *time* and *safety*. To satisfy RwP, you wait for diplomacy to fail. To satisfy R2P in that moment, you act before the tanks roll in.
  *   **Where it Breaks:** In real time, "exhaustion" is subjective. The P3 (US, UK, France) argued that waiting for the AU plan was gambling with 700,000 lives. RwP assumes there is a neutral judge of "exhaustion." In 2011, the judge was the same person holding the gun.

  **2. Proportionality (Minimum Force)**
  *   **The Theory:** Force must be calibrated strictly to the protection mandate. It cannot be used to achieve strategic political objectives (like regime change).
  *   **The Reality:** NATO's interpretation shifted quickly. They moved from enforcing a No-Fly Zone (grounding planes) to Close Air Support (bombing tanks hitting rebels) to Strategic Strikes (bombing command centers, telecoms, and Gaddafi's compound).
  *   **The RwP Critique:** This is the heart of the grievance. NATO operated on the logic that *you cannot protect civilians while Gaddafi remains in power.* Therefore, regime removal was a *precondition* for protection. Brazil argued regime removal was a *violation* of the mandate.
  *   **Where it Bites:** RwP exposes the "Mission Creep." It identifies the exact moment the intervention shifted from shielding Benghazi to escorting the rebel advance on Tripoli.
  *   **Where it Breaks:** The definition of "Minimum Force." If a retreating army plans to regroup and attack civilians later, is bombing them "protection" or "warfighting"? NATO said protection. Russia/China/Brazil said warfighting. RwP offers no metric to settle this in the fog of war. It assumes "protection" is a static state, not a dynamic conflict.

  **3. Accountability (Monitoring and Reporting)**
  *   **The Theory:** The Security Council must remain seized of the matter. The interveners must report back on how the mandate is being used. The Council can revoke the mandate if it's abused.
  *   **The Reality:** The P3 dominated the information flow. They briefed the Council on their terms. There was no independent monitoring body on the ground to verify if a struck target was a military threat or a political one.
  *   **The RwP Critique:** The Council authorized the force but then abdicated oversight. Once the bombs started falling, the UNSC became a spectator.
  *   **Where it Bites:** This explains the paralysis on Syria. Russia vowed never to be "burned" like they were on Libya. They realized the "accountability" mechanism was a honor system.
  *   **Where it Breaks:** Your instinct is correct here. The body that authorizes (UNSC) and the body that wields (NATO/P3) overlapped significantly. The US, UK, and France had veto power *and* were leading the bombing. They could block any attempt by Russia or China to rein them in. RwP assumes a separation of powers that doesn't exist in the P5.

  ### Part 2: What Libya Does to the Theory

  You asked what Libya does to Responsibility While Protecting. It exposes it as a **political constraint rather than a legal one.**

  **1. Vindication or Exposure?**
  Libya exposes RwP as a set of principles nobody could be held to. It vindicates the *diagnosis* (R2P was abused) but exposes the *cure* as toothless.
  *   **Why?** Because RwP relies on the goodwill of the intervener. There is no enforcement mechanism. If NATO decides that "protecting civilians" requires toppling the government, who stops them? The Security Council? The P3 will veto any resolution to stop their own operation.
  *   **The Verdict:** Rwanda is a "gentleman's agreement" in a room full of gangsters. It works only if the powerful want it to work. In Libya, they didn't.

  **2. The Kosovo Problem**
  You asked about unauthorized intervention. RwP collapses completely here.
  *   **The Logic:** RwP is procedural. It says, "If you get a mandate, here is how you use it." It presupposes Council authorization to establish the accountability loop.
  *   **The Kosovo Scenario:** If a coalition intervenes *without* the Council (claiming moral necessity over legal authority), there is no Council to report back to. The accountability leg dangles.
  *   **The Implication:** RwP is actually a tool for the Council to protect *its own relevance*, not just civilians. It says, "Don't go outside the building." It has nothing to say to someone who is already outside the building claiming moral superiority.

  ### Part 3: The Protagonist's Arc (Persuasion vs. Disillusionment)

  You need to know which scene is the "honest" one. The answer is: **Both are honest, but they speak to different truths.**

  **Scene A: Persuasion (The Intellectual Truth)**
  Your protagonist should be persuaded by the **logic** of the Brazilian argument.
  *   **Why:** Because the diplomat knows the paperwork. They know Resolution 1973 said "protect civilians," not "change the government." They see the cables showing the shift to regime change. They see Russia's fury.
  *   **The Feeling:** This feels like *rule of law*. It feels like adulthood. It acknowledges that good intentions (saving Benghazi) can be weaponized for bad ends (oil contracts, geopolitical positioning). The Brazilian diplomat is offering a way to keep the humanitarian norm alive without letting it become imperialist. It is a sane, responsible middle ground.
  *   **The Line:** "We are not saying do nothing. We are saying do not use the lives of civilians as a ladder to climb into power."

  **Scene B: Disillusionment (The Operational Truth)**
  Your protagonist should be disillusioned by the **mechanism** of the Brazilian argument.
  *   **Why:** Because they are a mid-level diplomat. They know how the machine works. They know that if the US and UK decide a mandate is "exhausted," there is no piece of paper the Brazilians can wave to stop a Tomahawk missile. They know that "accountability" requires a referee, and the P5 refuse to be refereed.
  *   **The Feeling:** This feels like *naivety*. The Brazilian proposal is a plea for restraint addressed to people who have already decided restraint is failure. It is a set of rules for a game the powerful have already quit.
  *   **The Line:** "You are asking the wolf to report on how many sheep he ate. He will tell you they were all wolves."

  **The Synthesis for Your Novel**
  The "honest" truth your protagonist arrives at is this: **RwP was a funeral rite for R2P.**

  The Brazilian move wasn't actually about fixing Libya. It was about signaling to the Global South: *We see what happened. We won't let it happen again.* It was a political move to justify the subsequent veto on Syria.

  *   **In the Persuasion Scene:** The protagonist sees the moral clarity. The distinction between *protecting* and *winning* is real and vital.
  *   **In the Disillusionment Scene:** The protagonist realizes that without an enforcement mechanism, moral clarity is just poetry. The "conditions" are unenforceable constraints.

  **Where the Mapping Breaks (For your internal logic)**
  The mapping breaks on the definition of **"Threat."**
  *   **RwP assumes:** The threat is an immediate act of violence (a tank shelling a building).
  *   **Libya showed:** The interveners argued the threat was the *existence* of the regime itself.
  *   **The Break:** If the regime is the threat, "minimum force" equals "regime change." RwP has no answer for this because it treats the State as a neutral container that can be separated from its leaders. In Libya, the State *was* the Leader. You couldn't protect the people from the State without breaking the State. RwP assumes a separation that didn't exist.

  **Advice for the Chapter:**
  Don't let the Brazilian diplomat sound like they are losing. They aren't arguing they can *stop* the bombs in 2011 (it's too late for that). They are arguing about the *precedent* for 2012, 2013, Syria.
  *   **Persuasion:** The protagonist realizes the West burned the bridge of trust. The Brazilian is trying to build a new one with guardrails.
  *   **Disillusionment:** The protagonist realizes the guardrails are made of paper. The West didn't care about the bridge; they cared about the destination.

  The tragedy of your protagonist isn't that they chose the wrong side. It's that they realized there was no side where the rules mattered more than the power. That is the specific melancholy of the 2010s diplomat.
