answer: |-
  ### Translation

  In your framework, let an agent $A$ at time $t$ be characterized by a feasible set of actions $F_t$, a subjective probability distribution $P_t$ over states of the world, and a preference ordering $\succeq_t$ representable by a utility function $U_t$. Standard decision theory defines an action $a \in F_t$ as *rational* (or choiceworthy) if and only if it maximizes subjective expected utility (SEU) relative to $P_t$ and $U_t$.

  **Internalism** translates to the constraint that the normative utility function $U_{norm}$ guiding choice must be derivable from the agent's actual utility function $U_t$ via a "sound deliberative route." In decision-theoretic terms, this route is modeled as Bayesian updating on new propositions or logical implications thereof. Let $\mathcal{D}$ be the set of permissible deliberative operations (e.g., correcting probabilistic errors, imagining counterfactual outcomes). Internalism asserts that $A$ has a reason to choose $a$ only if $a$ maximizes $E[U_{t'}(a)]$, where $U_{t'}$ is the result of applying some sequence $d \in \mathcal{D}$ to $U_t$. Crucially, $U_{t'}$ cannot be orthogonal to $U_t$; there must be a continuity condition. If $U_t$ assigns zero weight to a value, no amount of deliberation can generate a reason to pursue it. The "motivational set" is the support of $U_t$; reasons are eigenvectors of the agent's existing preference matrix.

  **Externalism** translates to the claim that there exists a normative utility function $U^*$ (or a reason-relation $R$) that is independent of $U_t$. On this view, $A$ has a reason to choose $a$ if $a$ maximizes $E[U^*(a)]$, even if $U^*$ cannot be reached from $U_t$ via any permissible deliberative operation $\mathcal{D}$. The gap between $\succeq_t$ and $\succeq^*$ is not merely an information deficit correctable by Bayesian updating; it is a normative deficit. Externalism posits that the "correct" preference ordering is not defined by the agent's psychology, even idealized, but by facts external to the model (e.g., moral truths, rational requirements).

  In your vocabulary, the debate becomes a dispute over the **boundary conditions of the utility function**. Internalism claims the domain of valid utility functions is constrained by the agent's actual psychological parameters at $t$. Externalism claims the domain of valid utility functions is constrained by objective normative facts, regardless of psychological parameters. The Internalist says: "You have no reason to maximize $U^*$ unless $U_t$ already values $U^*$." The Externalist says: "You have a reason to maximize $U^*$ even if $U_t$ is indifferent or hostile to it."

  ### What carries over

  Several structural elements of the debate map cleanly onto decision-theoretic machinery. First, the distinction between **actual vs. ideal preferences** is preserved. Your framework already distinguishes between revealed preferences (what the agent actually chooses) and normative preferences (what the agent *should* choose to maximize some objective). This allows you to model the Externalist's claim that $\succeq_t \neq \succeq^*$ without contradiction.

  Second, the concept of **deliberation as updating** captures the Internalist's "sound deliberative route." You can model Williams' concession that agents can discover new reasons through imagination or logic as Bayesian updating on conditional probabilities or refining the partition of the state space. If an agent realizes action $a$ leads to outcome $o$, and they value $o$, their expected utility for $a$ updates. This preserves the Internalist intuition that reasons must connect to existing valuations, even if the connection was previously obscured by ignorance.

  Third, the **feasibility constraint** translates directly. Both sides generally agree that "ought implies can." In your terms, a reason must attach to an action $a \in F_t$. If an action is not in the feasible set, neither Internalists nor Externalists typically claim there is a practical reason to perform it (though they might claim there is a reason to *make* it feasible).

  Finally, the **coherence requirements** of decision theory (transitivity, dominance) serve as a neutral ground. Both Internalists and Externalists typically demand that agents be instrumentally rational. The debate is not about whether one should maximize utility, but about *which* utility function counts. Your framework's separation of the probability function from the utility function allows you to isolate the dispute: Internalists say $U$ is endogenous; Externalists say $U$ is (partially) exogenous.

  ### The residue

  Despite these mappings, significant elements of the metaethical debate resist translation. The most critical loss is **normative force**. In your framework, "choiceworthiness" is defined relative to a utility function. If you posit an external $U^*$, decision theory can tell an agent *how* to maximize it, but it cannot explain *why* the agent *ought* to maximize it if $U_t$ conflicts with $U^*$. Decision theory treats the utility function as an exogenous input; it has no machinery to bind the agent to a specific input. The Externalist claims reasons have authority independent of the agent's psychology. Your framework can model the *existence* of $U^*$, but it cannot model its *authority* over an agent who rejects it. To add this, you would need a "meta-utility" function that dictates which first-order utility function to adopt, leading to an infinite regress or a brute stipulation.

  Secondly, Williams' **motivational set** is richer than a preference ordering. $\succeq_t$ captures ranking, but Williams' $S$ includes dispositions, emotional commitments, and projects that may not be fully codified into a utility function without loss. Internalism allows that deliberation can modify $S$ in ways that look like value change (e.g., coming to value friendship after experiencing it), not just belief update. Standard decision theory treats changes in $U$ as exogenous shocks or irrationalities. To capture Williams' "deliberative route," you would need a dynamic model of endogenous preference change that distinguishes between *rational value discovery* and *arbitrary preference drift*. Your current machinery lacks the criteria to distinguish these; both look like a shift from $U_t$ to $U_{t+1}$.

  Finally, there is the issue of **categorical vs. hypothetical imperatives**. Decision theory is inherently hypothetical: "If you want $X$, do $Y$." Externalism often relies on categorical reasons: "Do $Y$ regardless of what you want." Translating a categorical reason into SEU requires hardcoding it as an infinite penalty or lexicographic preference in $U^*$. But this begs the question against the Internalist, who denies such a preference exists in $S$. You can represent the *structure* of a categorical command, but you cannot represent its *categoricity*—its ability to bind an agent who lacks the corresponding preference. This suggests your framework's habit of treating preferences as the source of all normative force is not a neutral translation tool but a substantive commitment that structurally excludes the Externalist's core claim.

  ### Diagnosis

  The residue marks both a limitation of the decision-theoretic framework and an indeterminacy in the philosophical claims.

  Regarding the framework: Decision theory is designed as a formal tool for consistency, not an ontology of value. It assumes preferences are the primitive source of normativity. Therefore, it is structurally unable to state the Externalist position without begging the question. If you define "reason" as "that which maximizes $U$," and $U$ is defined by the agent's psychology, Externalism becomes incoherent by definition. To state Externalism faithfully, you must treat $U^*$ as a parameter fixed by the modeler (the philosopher), not the agent. But this creates a disconnect: the model says $a$ is optimal, but the agent's objective function says $b$ is optimal. Decision theory has no "arbiter" to resolve this conflict other than stipulating which $U$ matters. Thus, the framework cannot capture the *bindingness* of external reasons, only their *content*.

  Regarding the philosophical claims: The residue reveals that Internalism is sometimes ambiguous between a **psychological claim** (reasons must motivate) and a **conceptual claim** (the word "reason" implies motivation). If Internalism is merely psychological, your framework captures it well (reasons correlate with $U_t$). If it is conceptual, your framework struggles because it defines rationality formally, not linguistically. Furthermore, "Ideal Internalism" (reasons are what you would want after ideal deliberation) risks collapsing into Externalism if the "ideal" conditions are robust enough to generate any value. Your framework highlights this: if the deliberative route $\mathcal{D}$ is sufficiently expansive, $U_{t'}$ converges to $U^*$, making the distinction between internal and external merely a matter of how many updating steps you allow. The residue, therefore, indicates that the debate may not be about the existence of reasons, but about the permissible length and type of the deliberative path from actual to ideal preferences.

  ### Settled and contested

  There is consensus that **Internalism links reasons to motivation**. Almost all parties agree that for a consideration to be a *motivating* reason, it must connect to the agent's psychology. The dispute is about *normative* reasons: must they also connect?

  It is settled that **Externalism allows for criticism of fundamental ends**. Externalists agree that agents can be wrong about their ultimate values, not just their means. Internalists disagree, arguing that criticism of ends is only possible relative to other, deeper ends.

  However, it is genuinely contested whether **Idealized Internalism collapses the debate**. Many philosophers argue that if Internalism allows for "ideal deliberation" (full information, vivid imagination), it generates the same recommendations as Externalism. Internalists deny this, claiming some values (e.g., moral obligations) still won't appear in $S$ even under ideal conditions. Externalists claim they will, or that they don't need to.

  Finally, it is contested whether **External Reasons are intelligible**. Critics (following Williams) argue that positing a reason completely disconnected from an agent's motivational set is metaphysically obscure—it is a "queer" entity that cannot explain action. Defenders argue that moral facts provide this anchor. Your framework treats $U^*$ as mathematically intelligible but pragmatically inert for an agent with $U_t$. Whether this inertness refutes Externalism or merely describes the tragedy of immorality remains the core unresolved dispute.
