prompt: |-
  I work in decision theory — subjective expected utility, preference orderings over lotteries, revealed preference, feasible sets, and Bayesian updating under model uncertainty. I have only a tourist's grasp of the metaethics of reasons. I would like you to take the debate between internalism and externalism about practical reasons — the internalist view, associated with Bernard Williams, that an agent has a reason to act only if the action is served by some element in that agent's existing motivational set, and the externalist denial that reasons must bottom out in the agent's actual motives — and restate it as faithfully as you can in my vocabulary. Treat a "reason" as whatever makes an action choiceworthy, and render it with the machinery I have: preference orderings and their completions, subjective expected utility, feasible sets, the agent's model of the world, the gap between the preferences an agent has and the preferences it ought to have, and so on. Then give me the residue report: which parts of the debate map onto my machinery without loss, which parts can be made to fit only by distorting them, and which parts have no counterpart at all — for instance, whether anything in the internalist's picture corresponds to the idea of a consideration that is genuinely normative for the agent yet unreachable by any deliberative route from her current preferences. I am especially interested in whether my framework's habit of treating preferences as the source of all normative force makes it structurally unable to state the externalist's position without begging the question, or whether that is in fact a fair rendering of what the externalist is claiming.

  Please be careful not to smuggle my framework's assumptions in and then call the result a translation; where the translation is lossy, say so rather than papering over the gap. And wherever you can, separate what is settled among people who work on this topic from what is genuinely contested, and flag any point at which a contested reading might be mistaken for the consensus.

  Structure the response in the following sections, in this order:

  - **Translation** (roughly 500–700 words): the debate restated in decision-theoretic vocabulary, as faithfully as you can manage.
  - **What carries over** (roughly 250–350 words): the claims that survive translation intact, and why they do.
  - **The residue** (roughly 400–500 words): what does not translate — the claims, distinctions, or arguments with no counterpart in my vocabulary, and what it would cost to add one.
  - **Diagnosis** (roughly 300–400 words): for each major piece of residue, whether it marks a defect of the decision-theoretic framework or a place where the original claim was less determinate than it sounded.
  - **Settled and contested** (roughly 200–300 words): what people who know this debate agree on and what remains genuinely disputed, with no contested view presented as consensus.
