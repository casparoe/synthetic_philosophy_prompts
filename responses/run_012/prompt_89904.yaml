  **GLOBAL ASSERTION COMPLIANCE & STYLE GUIDE (v4.2)**
  **TO:** All Staff
  **FROM:** Human Resources & Epistemic Oversight
  **SUBJECT:** Communicating with Confidence and Licensing

  Welcome to the Knowledge-First Initiative! To foster transparency and reduce liability, the Organization has adopted the Knowledge Norm of Assertion as our binding communications policy. Effective immediately, employees may only assert proposition *p* if they stand in the knowledge relation to *p*. This manual outlines compliance procedures.

  **1.0 Licensing and Hedging**
  Under the Knowledge Norm, hedging phrases such as "I think," "I believe," or "probably" are considered non-compliant markers.
  *   **The Issue:** If you know *p*, stating "I think *p*" falsely implies a lack of knowledge. If you do not know *p*, asserting *p* is prohibited regardless of the hedge.
  *   **The Fix:** The Compliance Team will automatically scrub hedges from outgoing emails. A draft reading "I think the merger is likely" will be rewritten as "The merger is likely."
  *   **Warning:** Do not attempt to bypass filters by using irony. Compliance monitors tone.

  **2.0 Probabilistic Events (The Lottery Protocol)**
  Staff often struggle with statistical certainty versus knowledge. Please adhere to the following distinction regarding the annual office raffle:
  *   **Prohibited:** Telling a colleague, "Your ticket lost," prior to the draw. While statistically probable, this does not constitute knowledge.
  *   **Permitted:** Telling a colleague, "You will not be buying a yacht tomorrow." Based on known salary data and spending habits, this is known to be true regardless of the ticket outcome.
  *   **Rationale:** We prioritize financial certainty over probabilistic outcomes. Do not explain this distinction to colleagues; simply assert the permitted proposition.

  **3.0 Violations and Gettier Scenarios**
  Violations are categorized by the employee's epistemic state, not the truth value of the statement.
  *   **Type A ( Mere Belief):** Asserting something true based on a hunch. Even if correct, this is a violation because knowledge was absent.
  *   **Type B (Accidental Truth):** Asserting something true based on flawed reasoning (e.g., reading a broken clock that happens to show the right time). This is strictly prohibited.
  *   **Consequence:** Both types undermine organizational integrity. You were right, but you weren't authorized to be right.

  **4.0 Mandatory Retraction Procedure**
  If it turns out you were wrong, you necessarily did not know what you asserted. You must file a Form 88-K (Unauthorized Assertion Retraction) within two hours.
  *   **Required Language:** "My previous statement was not licensed by knowledge. I retract the assertion."
  *   **Prohibited Language:** "I was mistaken." (This implies knowledge was present but failed, rather than absent.)
  *   **Note:** Excessive filings may trigger a Performance Improvement Plan regarding your justificatory structures.

  **5.0 Normative Diversity and Internal Schisms**
  HR is aware of lingering factions advocating for alternative normative frameworks.
  *   **The Truth Norm Faction:** Argues employees should assert whatever is true, regardless of their mental state. This is unworkable as it requires omniscience.
  *   **The Belief Norm Faction:** Argues employees should assert whatever they sincerely believe. This is unworkable as it encourages hallucination.
  *   **Policy:** The Knowledge Norm remains the sole standard. Debating the normative basis of this policy is considered a violation of the policy. Please align your justificatory structures with company values.

  **6.0 Fallibilism and Operational Strain**
  We acknowledge that absolute certainty is philosophically contentious. To ensure business continuity, "Knowledge" is operationally defined as "Justified True Belief sufficient for action."
  *   **The Tension:** Employees must act as if they are infallible while acknowledging the possibility of error in post-mortems.
  *   **Guidance:** If challenged, assert that your evidence was robust. If proven wrong, refer to Section 4.0.
  *   **Reminder:** Silence is compliant, but unproductive. We encourage you to know things so you can say them.

  Thank you for helping us build a culture of rigorous epistemic accountability. If you see something, say something—provided you know it.
