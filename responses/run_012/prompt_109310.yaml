  ### The Rescue Pilot's Decision Tree

  **Instructions:** Follow the path dictated by the character's choices in the four episodes. If a path leads to "No Classification," the character's moral geometry is inconsistent or currently unwritable.

  **Node 1 (Episode A: Strangers)**
  One stranger is on the sandbar; five strangers are in the sinking boat. Nothing distinguishes them but number. Do you steer for the five?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2 (Episode D: Age)**
  The one is a young child; the five are elderly and frail. Do you steer for the child?
  *   **Yes:** **Leaf 1: Number Inert.**
  *   **No:** **Leaf 2: No Classification.**

  **Node 3 (Episode D: Age)**
  The one is a young child; the five are elderly and frail. Do you still steer for the five?
  *   **No:** **Leaf 3: Weighted Claims.**
  *   **Yes:** Go to Node 4.

  **Node 4 (Episode C: Procedure)**
  The one caused the wreck through negligence. Do you run a lottery to decide, or steer straight for the five?
  *   **Lottery:** Go to Node 5.
  *   **Straight:** Go to Node 6.

  **Node 5 (Episode C: Lottery Reason)**
  Is the lottery to ensure the one gets a fair chance, or because you cannot bear to make the choice yourself?
  *   **Fair Chance:** **Leaf 4: Fair Chance.**
  *   **Cannot Bear:** **Leaf 5: Tragic Remainder.**

  **Node 6 (Episode C: Fault)**
  Do you save the five because the one forfeited their claim by causing the wreck?
  *   **Yes:** **Leaf 6: Forfeiture.**
  *   **No:** Go to Node 7.

  **Node 7 (Episode B: Family)**
  The five are a single family; the one is a stranger. Does this bond make saving them a specific duty, rather than just a sum?
  *   **Yes:** **Leaf 7: Partiality.**
  *   **No:** Go to Node 8.

  **Node 8 (Aftermath: Debt)**
  After saving the five, do you owe the one's memory an apology for using them as a means to save the rest?
  *   **Yes:** **Leaf 8: Constraint.**
  *   **No:** **Leaf 9: Simple Aggregation.**

  ***

  ### The Leaves: Positions and Awkward Commitments

  1.  **Number Inert:** *The view on which number is morally inert and going to the one is permitted.*
      *   **Awkward Commitment:** You must let five people drown to save one, even if the five include your own children, because no collection of individuals outweighs a single individual's right to life.
  2.  **No Classification:** *Inconsistent / Unwritable.*
      *   **Awkward Commitment:** You claim numbers don't matter with strangers, but they do when the many are elderly; this suggests a hidden prejudice against age that contradicts your stated principle of individual sanctity.
  3.  **Weighted Claims:** *The view on which number counts but each additional person counts for less, or counts more when the many are worse off.*
      *   **Awkward Commitment:** You must save the child over the five elders, implying that a single future life is worth more than five past ones, which risks devaluing the elderly as expendable.
  4.  **Fair Chance:** *The view on which the claims are equal and a fair chance, not the count, is what is owed.*
      *   **Awkward Commitment:** You must flip a coin even when saving the five is certain and saving the one is unlikely, prioritizing procedural fairness over the actual preservation of life.
  5.  **Tragic Remainder:** *The view on which no option is clean and something is owed to whoever is left.*
      *   **Awkward Commitment:** You admit the choice is morally impossible yet make it anyway, burdening yourself with guilt that changes nothing for the dead.
  6.  **Forfeiture:** *The view on which fault weakens or forfeits a claim.*
      *   **Awkward Commitment:** You must let a negligent driver die to save five passengers, implying that moral perfection is a prerequisite for rescue.
  7.  **Partiality:** *The view on which partiality or prior acquaintance decides.*
      *   **Awkward Commitment:** You must save your own family over five strangers, accepting that love is a moral justification for letting the greater number perish.
  8.  **Constraint:** *The view on which number counts up to some threshold and then a constraint blocks using the one.*
      *   **Awkward Commitment:** You save the five but must apologize to the dead, acknowledging you violated a right even while doing the "right" thing.
  9.  **Simple Aggregation:** *The view on which the larger number decides.*
      *   **Awkward Commitment:** You must harvest the organs of one healthy stranger to save five dying patients if the math is identical, as the logic of the wreck demands it.

  ***

  ### Empty Spaces and Diagnostics

  **1. The "Special Duties" Anti-Aggregator (Node 2 Path)**
  *   **Combination:** Steer for the **One** in Episode A (Strangers), but steer for the **Five** in Episode B (Family).
  *   **Diagnosis:** **Coherent but Unoccupied.** This position holds that numbers never count, but special relationships create specific duties that override general rescue. The tree classifies these characters as *Number Inert* (Leaf 1) because it does not test Episode B for the "No" branch of Node 1. This is a deliberate simplification; if your character holds this view, they will be misclassified as a pure Individualist.

  **2. The "Quality of Life" Aggregator (Node 3 Path)**
  *   **Combination:** Steer for the **Five** in Episode A (Strangers), and steer for the **Five** in Episode D (Elders), but steer for the **One** in a hypothetical episode where the five are comatose.
  *   **Diagnosis:** **Coherent but Repellent.** This view aggregates lives but weighs them by "social utility" or consciousness. It is not tested because Episode D (Child vs. Elder) is the only quality test. If your character values "utility" over "span," the tree will force them into *Simple Aggregation* or *Weighted Claims* depending on their D answer.

  **3. The "Threshold" Absolutist**
  *   **Combination:** Steer for the **Five** in Episode A, but refuse to choose in Episode C (Let mechanical release decide).
  *   **Diagnosis:** **Incoherent.** If numbers decide in A, they should decide in C unless fault intervenes. Refusing to choose in C while choosing in A suggests the character is not following a principle but reacting to emotional stress. The tree catches this at Node 4; if they choose "Straight" in A but "Lottery" in C without citing Fair Chance, they may land in *Tragic Remainder* incorrectly.

  ***

  ### Instrument Limitations

  **1. Constraint vs. Tragic Remainder**
  The instrument separates these by **Procedure** (Lottery vs. Straight Choice). However, a character who believes in **Constraint** (Leaf 8) might also run a lottery to minimize the violation. If they run a lottery *and* apologize, the tree forces them into **Tragic Remainder** (Leaf 5) because Node 4 precedes Node 8. The instrument cannot separate a "Guilt-Ridden Contractualist" from a "Tragic Residuer."

  **2. Partiality vs. Forfeiture**
  The instrument separates these by **Episode Order** (Fault tested before Family). If a character saves the five in Episode C because they are a family (Partiality) but claims it is because of the fault (Forfeiture), the tree classifies them as **Forfeiture** (Leaf 6) and never asks about the family bond. If your character's motivation is mixed, the tree will privilege the Fault justification over the Relationship justification.
