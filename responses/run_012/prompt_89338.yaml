answer: |-
  ### Materials and setup

  Print 7 boards (7x7 hex grid reskinned as "islands and sea lanes"; 4x4 is too trivial for the argument to feel non-trivial). Provide two colors of glass stones ("ferries"). Arrange tables in a horseshoe; keep the whiteboard clear at the front. Print three "Rule Change" cards (see Break-it section). Prepare one chocolate bar.

  **Prep:** Mark the shorelines clearly (NE/SW vs NW/SE). Ensure students know the connection rule (adjacent hexes) before entering. Do not write "Strategy Stealing" anywhere. Have a spare board at the front for the embodied demo.

  ### Run of show

  **00–20: Play and Empirical Fact.** Pairs play standard Ferries. No instruction on winning strategies. Stop play once boards fill. Ask: "Did anyone draw?" (Empirical consensus: No). Assert: "Topology guarantees no draws. One side always connects."

  **20–30: The Bet.** Stand front. "I know a guaranteed win. I'll play Second. You play First. Chocolate if you beat me." Wait. Few will accept. Ask: "Why not?" Expect: "You know something we don't." Push: "What if I told you I don't know *how* to win, only *that* I win?"

  **30–50: Constructing the Argument.** Write: "Assume Player 2 has a Winning Strategy." Ask: "What does that mean?" (P2 wins no matter what P1 does).
  *Nudge 1:* "Player 1 moves first. Can Player 1 ignore that move?" (Yes, play elsewhere).
  *Nudge 2:* "If P1 plays a random stone, then pretends to be P2 using P2's strategy, who is winning?"
  *Nudge 3 (The Block):* "What if the strategy says 'play here' but P1's random stone is there?"
  *Target Insight:* "Play anywhere else. Having an extra stone never hurts."
  *Conclusion:* "If P2 had a winning strategy, P1 could steal it. Contradiction. So P2 cannot have a winning strategy."

  **50–65: Embodied Steal.** Invite one pair front. P1 places a 'throwaway' ferry. P1 physically moves to P2's chair. Looking from P2's perspective, P1 points where P2's hypothetical strategy dictates. If empty, place ferry. If occupied by throwaway, place ferry anywhere and say "Whatever." P1 returns to seat. This physicalizes "adopting the opponent's logic."

  **65–80: Break-it Rounds.** Distribute Rule Cards. Groups test if the argument holds. Report back which premise dies.

  **80–90: Debrief.** Formalize the schema. Name "Strategy Stealing." Revisit the bet: "Who takes the chocolate now?" (No one).

  ### Break-it cards

  **Card 1: The Head Start**
  *Rule:* Player 2 places **two** ferries on Turn 1. Player 1 places one.
  *Breaks:* **Symmetry.**
  *Outcome:* Argument fails. P1 cannot steal P2's strategy because P1 lacks the extra resource. P2 might win.
  *Expect:* Students see P1 cannot mimic P2's advantage.

  **Card 2: The Sabotage (Misere)**
  *Rule:* The first player to complete a chain **loses**.
  *Breaks:* **Extra Move Can't Hurt.**
  *Outcome:* Argument fails. Having an extra ferry might complete your chain prematurely. P1 genuinely loses on small boards with best play.
  *Expect:* Students realize "extra stone" is now a liability.

  **Card 3: The Impossible Goal**
  *Rule:* To win, you must connect **all four** shores.
  *Breaks:* **No Draws.**
  *Outcome:* Argument fails. It is impossible to connect all four shores. The game is always a draw. The proof shows "P2 can't win," but since P1 can't win either, "P1 wins" does not follow.
  *Critique:* **This is the weak card.** Hex topology makes draws impossible in standard play; this rule changes the win condition to something topologically impossible, rendering the game void rather than introducing a genuine draw state like Tic-Tac-Toe. It breaks the premise, but artificially.

  ### Debrief

  Write the schema on the board with blanks for them to fill:

  1.  Assume \_\_\_\_\_\_ has a winning strategy. (Player 2)
  2.  Player 1 makes a \_\_\_\_\_\_ move. (Random/Throwaway)
  3.  Player 1 adopts \_\_\_\_\_\_'s strategy. (Player 2's)
  4.  If the strategy calls for the occupied spot, play \_\_\_\_\_\_. (Anywhere)
  5.  This works because an extra move \_\_\_\_\_\_. (Can't hurt)
  6.  Conclusion: Player 2 \_\_\_\_\_\_. (Cannot win)
  7.  Since there are \_\_\_\_\_\_, Player 1 \_\_\_\_\_\_. (No draws / Wins)

  Map the room's activity to the schema: The **Bet** relied on step 7. The **Embodied Swap** enacted steps 3–5. The **Break-it Cards** tested steps 1, 5, and 7.

  **What you must assert:** You must assert the "No Draws" premise. They saw it empirically, but the topological proof (Brouwer fixed-point equivalent) is beyond 90 minutes. Acknowledge this: "We proved P1 doesn't lose. We *assert* draws are impossible. Therefore P1 wins." Distinguish clearly between the *constructive* proof (here is a move) and the *non-constructive* proof (a move exists).

  ### What goes wrong the first time

  **The "How" Confusion:** Students will insist that if P1 wins, P1 must know *how*. When you say "I don't know the strategy," they will think you are hiding it.
  *Fix:* Repeat: "The proof tells us the strategy exists, not what it is. Like knowing a solution exists without solving the equation."

  **The "Occupied Spot" Stall:** They will get stuck on step 4 (Strategy says play here, but it's taken). They might think this ruins the strategy.
  *Fix:* Use the nudge: "Is having two ferries there worse than one?" If they say "No," the argument holds. If they hesitate, revisit Card 2 (Misere).

  **Embodied Awkwardness:** The chair swap can feel silly.
  *Fix:* Frame it seriously: "We are testing the logic of role-reversal." If it flops, skip to whiteboard simulation.

  ### What the activity can't do

  **It cannot produce efficiency.** The argument proves existence, not feasibility. The "stealing" strategy might require computational resources exceeding the universe to calculate. Do not let them leave thinking P1's win is *easy*, only that it is *guaranteed*.

  **It cannot prove the topology.** You are asking them to accept "No Draws" on authority. This is a necessary fiction for the session. Acknowledge that in a different topology (e.g., a board with a hole), the argument collapses because P1 might only guarantee a draw.

  **It cannot generalize to all games.** Emphasize the three premises. If symmetry, monotonicity, or no-draws fail, the proof dies. This is not a universal key for game theory, but a specific tool for symmetric, non-drawable, monotonic games. Do not let them apply it to Chess (draws possible) or Nim (asymmetric options).
