answer: |-
  ### The problem, stated precisely

  The reference class problem arises when assigning a probability to a singular event $e$ regarding an individual $x$. To estimate $P(e)$, we typically rely on frequencies observed in a class $C$ where $x \in C$. However, $x$ possesses indefinitely many properties, each defining a different class $C_1, C_2, \dots$ with distinct frequencies $f_1, f_2, \dots$. If $x$ is a 40-year-old male smoker who exercises, do we use the mortality rate for 40-year-olds, males, smokers, or exercisers? These frequencies diverge significantly. The problem is not merely data availability; it is structural. Without a principled rule for selecting $C$, the probability assigned to $e$ is indeterminate. This indeterminacy threatens any interpretation of probability that seeks to anchor singular predictions in empirical data, creating a gap between the statistics we have and the specific judgment we require. It asks: what makes one frequency the *right* one for this specific prediction? The tension lies between the need for a general frequency to define probability and the singularity of the event to which it is applied.

  ### Why the narrowest class will not save us

  A natural heuristic is Reichenbach's suggestion: use the narrowest class for which reliable statistics exist. This fails at the limit. The narrowest class containing $x$ is the singleton $\{x\}$. The frequency of $e$ in this class is either 0 or 1, rendering probability useless for prediction before the event occurs. Retreating slightly from the singleton leads to arbitrary stopping points. Why stop at "40-year-old male smokers" rather than "40-year-old male smokers with brown eyes"? Any line drawn is defeasible by a new property. Furthermore, narrowness trades relevance for stability. As classes narrow, sample sizes shrink, increasing variance. A very narrow class might be highly relevant but statistically noisy, yielding an estimate less reliable than a broader, more stable class. Thus, narrowness alone cannot resolve the tension between specificity and statistical reliability. It provides no algorithm for balancing the bias-variance trade-off inherent in classification. We lack a principle to determine when added specificity costs more in variance than it gains in bias reduction, leaving the choice underdetermined by data alone.

  ### Why the best-evidenced class will not save us

  Alternatively, one might choose the class with the "most evidence," typically interpreted as the largest sample size or highest statistical confidence. This fails because evidence is often crossed and conflicting. Consider an individual who is both a smoker (high risk) and a marathon runner (low risk). Both classes may have abundant, high-quality data, yet they prescribe contradictory probabilities. "Most evidence" does not tell us how to weigh competing causal factors. Moreover, maximizing sample size often pushes us toward broader classes that dilute relevant specific information. If "most evidence" means "highest predictive accuracy on hold-out data," we face a computational search problem across all possible feature combinations. Without a prior theory of which features are causally relevant, data volume alone cannot select the correct class. We are left with multiple well-evidenced classes yielding incompatible probabilities. The problem is not finding evidence, but integrating conflicting evidence structures. We need a meta-rule for weighting classes, which simply regenerates the original problem at a higher level.

  ### What the subjectivist's move really does

  Your friend's subjectivist move dissolves the metaphysical tension by denying that probability is a property of the world. In the Bayesian framework, probability is a degree of belief conditional on an agent's total state of information $K$. There is no "true" reference class, only the features the agent deems relevant in constructing their likelihood function. The constraint is coherence: your probabilities must obey the axioms to avoid Dutch Books. This concedes that there is no mind-independent fact about $x$'s risk. However, it does not concede that "anything goes." The subjectivist must still condition on all available evidence ($P(e|K)$). The reference class problem transforms into the problem of model specification: which covariates belong in $K$? Your friend is correct that coherence alone permits different priors. For the subjectivist, if two actuaries differ, it is because their information states differ, not because the world is ambiguous. But she overlooks that in institutional settings, "total evidence" is regulated. Actuarial standards demand that relevant predictors be included and irrelevant ones excluded. Subjectivism protects the agent from logical inconsistency, but it does not guarantee intersubjective agreement or external validity. It makes probability personal, but insurance and law require probabilities to be public and accountable. The subjectivist solves the logic but ignores the governance. It answers "what may I believe?" but not "what must I charge?"

  ### Where I think the argument actually turns

  The argument turns on the function of probability in singular cases. You are worried about accountability; she is worried about coherence. For a parole board or insurer, a probability is not just a betting quotient; it is a justification for action affecting rights or costs. A "correct" reference class in this context is not one that matches a metaphysical frequency (which doesn't exist for singulars), but one that yields *calibrated* decisions over a portfolio of similar cases. If an insurer uses a class that systematically underestimates risk for a subgroup, they face insolvency or regulation. Therefore, the choice of class is judged by its performance across repeated applications of the *policy*, even if the *event* is singular. Your friend treats the single case as isolated; you treat it as an instance of a decision procedure. The "correct" class is the one that minimizes loss functions across the population of assessments, ensuring fairness and accuracy. This shifts the debate from ontology to epistemology and ethics. It is about the reliability of the *process*, not the truth of the *number*. Objectivity here means procedural robustness, not metaphysical correspondence.

  ### How I should reopen the argument

  Say this: "I accept that probability is subjective, but institutions aren't. If two actuaries use different classes, one might be solvent and the other bankrupt, or one discriminatory and the other fair. Coherence doesn't protect against bad modeling. Can you explain how subjectivism ensures our risk scores are calibrated to reality, not just to our own priors? If probability guides policy, doesn't the reference class need to be objectively justified by predictive performance, not just internal consistency?"
