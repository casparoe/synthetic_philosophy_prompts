prompt: |-
  I've been reading alot about convention — the David Lewis stuff — and trying to line it up with things I actually deal with as an engineer plus ordinary life, and my gut verdicts won't settle into a pattern. Here's where I land:

  - Driving on the right vs the left: clearly a convention, and obviously arbitrary, since half the world does it the other way.
  - Tabs vs spaces: convention I guess, though in a repo with a linter it feels more like a rule someone imposed than a convention.
  - Using port 443 for HTTPS: convention, or something close to it.
  - Tipping ~20% in the US: I want to call it a convention, but it feels different from which side of the road to drive on.
  - Not cutting in line: not a convention — that's just wrong, I have a reason to queue no matter what everyone else does.
  - How you dress for a job interview: not a convention, more of a trend, even though I do it because everyone else does.
  - The particular gesture a culture uses for "come here": convention, and arbitrary.
  - A team's "we deploy on Tuesdays" habit: convention? rule? just inertia?

  The one that keeps bugging me is queueing vs. port 443. If the whole office stopped queueing for coffee I think I'd still queue; but if nobody used 443 anymore I'd switch to whatever everyone else used without blinking. And yet I want to say both are conventions.

  Is there one principle that gets most of these, and what does it say about the ones I can't place? Does it force me to drop calling tipping a convention, or to stop treating interview-dress as a non-convention? Also curious what it predicts for a case I didn't list: a regularity that started as pure coordination (say, everyone driving on the right) but that most people now follow because they think it's morally required — convention or not?

  And since you're way more careful about this than I am: tell me how confident you are in whatever principle you land on, and flag the single point you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** David Lewis's theory of convention, applied to engineering and ordinary life.
      *   **User's Struggle:** Gut verdicts on various examples (driving, tabs/spaces, port 443, tipping, queueing, interview dress, gestures, team habits) aren't settling into a consistent pattern. Specifically struggling with the distinction between *queueing* (feels moral) and *port 443* (feels purely coordinative), yet both seem like "conventions" in common parlance.
      *   **Specific Questions:**
          *   Is there one principle that categorizes most of these?
          *   What does it say about the hard cases (tipping, interview dress)?
          *   What about a regularity that starts as coordination but becomes moralized (driving on the right)?
          *   **Constraint:** State confidence level and flag the single point of least certainty.

  2.  **Deconstruct David Lewis's Theory of Convention:**
      *   *Core Definition:* A convention is a solution to a *coordination problem*.
      *   *Key Conditions (Lewis, 1969):*
          1.  There is a regularity $R$ in behavior.
          2.  There is an alternative regularity $R'$ that could have worked just as well (arbitrariness).
          3.  Everyone prefers to conform to $R$ *on the condition* that others conform to $R$ (interdependent expectations).
          4.  This preference is based on a common interest in coordination, not necessarily moral obligation.
      *   *The Crucial Distinction:* Conventions solve *coordination problems* (I want to do what you do), whereas norms/rules often solve *prisoner's dilemmas* or *moral imperatives* (I want to do X regardless of you, or I ought to do X even if you don't).

  3.  **Evaluate the User's Examples against Lewis's Criteria:**

      *   *Driving (Right vs. Left):* Classic Lewis convention. Coordination problem. Arbitrary (could be left). Conditional preference (I'll drive right *if* you do).
      *   *Tabs vs. Spaces:* Convention *within a team*. If the linter enforces it, it becomes a rule, but the *choice* of tabs vs. spaces was a convention.
      *   *Port 443:* Technical convention (RFC). Coordination problem (client needs to know where server is). Arbitrary (could have been 8080). Conditional preference.
      *   *Tipping (20%):* Tricky. It's a coordination problem (waiters expect it, customers pay it to avoid awkwardness/social sanction). But it has moral overtones ("stiffing" a waiter). Lewis would likely call it a convention that has acquired normative force.
      *   *Queueing:* This is the user's sticking point. Lewis distinguishes between *conventions* and *moral norms*. Queueing is often viewed as a fairness norm (Prisoner's Dilemma structure: I want to cut, but if everyone cuts, chaos ensues). However, the *form* of the queue (single line vs. multiple lines) is a convention. The *act* of queuing itself is often a moral norm.
      *   *Interview Dress:* Signaling game. Not purely coordination. I dress well to signal competence, not just because everyone else does. If everyone wore pajamas, I'd still wear a suit to stand out. This is *not* a Lewis convention.
      *   *Gesture ("Come here"):* Pure convention. Arbitrary symbol.
      *   *Deploy on Tuesdays:* Team convention. Coordination (avoid conflicts). Arbitrary (could be Thursdays).

  4.  **Address the "Queueing vs. Port 443" Conflict:**
      *   *Port 443:* Pure coordination. No intrinsic value to 443.
      *   *Queueing:* Intrinsic value to fairness/order. If no one queued, chaos/unfairness results. I queue because it's *right*, not just because others do.
      *   *Resolution:* Lewis would say Queueing (the act) is a *Social Norm* (often moral), whereas Port 443 is a *Convention*. The user's gut is right to distinguish them.

  5.  **Address the "Moralized Convention" (Driving):**
      *   If people think driving on the right is *moral*, does it stop being a convention?
      *   Lewis acknowledges conventions can acquire normative force. The *origin* and the *underlying structure* (arbitrariness + coordination) define it, not the current psychological state of the agents. So, it remains a convention, even if people *think* it's moral.

  6.  **Synthesize a Unifying Principle:**
      *   **The Principle:** *Conditional Preference based on Arbitrariness.*
      *   Ask: "Would I still do this if no one else did?" (Tests conditional preference).
      *   Ask: "Could we have easily done the opposite with equal success?" (Tests arbitrariness).
      *   Ask: "Is the main goal to match others, or to achieve an independent good?" (Tests coordination vs. moral/pragmatic necessity).

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the user's sharp intuition. Validate the Lewis framework.
      *   *The Principle:* Define Lewis's "Coordination Problem" + "Arbitrariness" + "Conditional Preference."
      *   *Categorization:*
          *   *True Conventions:* Driving, Port 443, Gestures, Deploy Day.
          *   *Norms/Morality:* Queueing (fairness), Interview Dress (signaling/competition).
          *   *Hybrids:* Tipping (Convention + Norm), Tabs/Spaces (Convention + Rule).
      *   *The "Moralized Convention" Case:* Explain that origin/structure matters more than current belief. It stays a convention.
      *   *Confidence & Uncertainty:* Need to be careful here. Lewis's theory is philosophical, not empirical physics. Confidence should be high on the *interpretation of Lewis*, lower on the *application to messy real life*.
      *   *Least Sure Point:* The boundary between "Norm" and "Convention" in cases like Tipping is notoriously debated in philosophy (Bicchieri vs. Lewis). I should flag the *Tipping* classification as the fuzziest.

  8.  **Refining the "Queueing" Analysis:**
      *   Wait, is queueing a convention? Lewis actually discusses this. The *rule* "first come, first served" is a convention. The *act* of following it is often moralized. But if everyone stopped queueing, would you? The user says "I think I'd still queue." That implies it's *not* a Lewis convention for them. It's a personal moral principle. I need to validate this distinction.

  9.  **Refining the "Interview Dress" Analysis:**
      *   Why isn't it a convention? Because it's not arbitrary. Suits signal seriousness. Pajamas signal sloppiness. There is an asymmetry. Also, it's competitive (I want to look better than others), not cooperative (I want to match others). This is a *Signaling Game*, not a *Coordination Game*.

  10. **Final Review against Constraints:**
      *   Did I answer the specific questions? Yes.
      *   Did I address the confidence/uncertainty constraint? Yes.
      *   Is the tone appropriate? (Engineer-to-Engineer/Philosophical but practical).

  11. **Self-Correction/Nuance Check:**
      *   *Tabs vs Spaces:* The user notes the linter makes it a rule. Lewis distinguishes between the *convention* (the agreement) and the *enforcement*. I should clarify that.
      *   *Tipping:* Is it arbitrary? 10% vs 20% is arbitrary. Tipping vs. Living Wage is a structural difference. I'll focus on the % as the conventional part.
      *   *Confidence:* I need to be explicit. "High confidence in the framework, moderate in the classification of specific social norms."
