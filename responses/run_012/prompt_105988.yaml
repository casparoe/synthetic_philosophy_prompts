answer: |-
  You have stumbled onto the exact friction point that makes David Lewis's *Convention* (1969) both brilliant and frustrating. Your gut is actually more Lewisian than you realize. You are sensing the difference between a **Coordination Problem** (Lewis's domain) and a **Norm/Moral Obligation** (often a Prisoner's Dilemma or a signaling game).

  Here is the principle that lines up your examples, followed by the verdicts on your hard cases.

  ### The Principle: The "Conditional Preference" Test

  For Lewis, a regularity is a **convention** if and only if it satisfies three conditions:
  1.  **Arbitrariness:** There is at least one other alternative that would have worked just as well (e.g., driving left, port 8080).
  2.  **Common Interest:** Everyone prefers to coordinate on *something* rather than fail to coordinate.
  3.  **Conditional Preference:** I prefer to do $X$ *only because* I expect you to do $X$. If you stopped doing $X$, I would switch to $Y$ (the alternative) to maintain coordination.

  **The Litmus Question:** *"If I knew for a fact that everyone else stopped doing this tomorrow, would I still do it?"*
  *   If **No** (I'd switch): It's a **Convention**.
  *   If **Yes** (I'd stick with it): It's a **Norm/Rule/Principle**.

  ### Applying the Principle to Your List

  **1. The Clear Conventions (Coordination Problems)**
  *   **Driving Right/Left:** Fits perfectly. Arbitrary. Conditional preference (I don't want to drive right if you drive left).
  *   **Port 443:** Fits perfectly. Arbitrary (could be 444). Conditional (if browsers stopped expecting 443, I'd configure my server differently).
  *   **Gesture ("Come here"):** Fits perfectly. Arbitrary symbol.
  *   **Deploy on Tuesdays:** Fits perfectly. Arbitrary day. Conditional (I deploy Tuesday *so I don't conflict with you*).

  **2. The Clear Non-Conventions**
  *   **Queueing:** Your gut is right. This is **not** a Lewis convention. It is a **Fairness Norm**.
      *   *Why:* If everyone stopped queueing and started shoving, you would likely *still* queue (as you said). You queue because it is fair, not merely to match others. The preference is not conditional on others' behavior in the Lewis sense; it is conditional on a moral principle.
      *   *Lewis's View:* Lewis explicitly distinguishes conventions from norms that solve Prisoner's Dilemmas. Queueing prevents a "tragedy of the commons" scenario; it isn't just about matching signals.
  *   **Interview Dress:** This is a **Signaling Game**, not a Coordination Game.
      *   *Why:* It is not arbitrary. A suit signals "professional"; pajamas signal "slob." There is an intrinsic asymmetry in value. Also, your goal is often to distinguish yourself *from* the pack, not match them. If everyone wore pajamas, you would wear a suit to win.

  **3. The Hybrids (Where it gets messy)**
  *   **Tabs vs. Spaces:** This is a convention *that has been codified into a rule*. The choice of tabs vs. spaces is arbitrary (Convention). Once the team lead enforces it via linter, it becomes a Rule. But the *origin* of the standard is conventional.
  *   **Tipping (~20%):** This is a **Convention with Normative Force**.
      *   *Why:* The *percentage* is arbitrary (could be 15%). The *act* is conditional (if no one tipped, waiters would be paid a living wage and tipping would vanish). However, it feels moral because violating it harms a specific person directly, unlike driving on the left which harms the system. Lewis would call it a convention; sociologists might call it a norm.

  ### The "Moralized Convention" Case
  *Case: A regularity that started as coordination (driving right) but people now think is morally required.*

  **Verdict:** It remains a **Convention**.
  Lewis is concerned with the *structure* of the interaction, not the *psychology* of the agents. If the underlying structure is arbitrary + coordination, it is a convention, even if people have deluded themselves into thinking it is moral.
  *   *Example:* If people started believing driving on the left was "sinful," it wouldn't change the fact that we could have all driven on the left instead. The arbitrariness remains. The moralization is just social glue that stabilizes the convention.

  ### Summary of Your Gut Verdicts
  *   **Queueing vs. Port 443:** You are correct to separate them. 443 is a convention; Queueing is a norm. Lewis agrees with you.
  *   **Tipping:** You can keep calling it a convention, but acknowledge it's a "thick" one that carries moral weight.
  *   **Interview Dress:** You are correct to drop this from the "convention" bucket. It's signaling.

  ### Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that this interpretation aligns with Lewis's specific philosophical framework. Lewis was precise about distinguishing coordination problems (conventions) from Prisoner's Dilemmas (norms) and Signaling Games (status). Your intuition on Queueing vs. 443 is philosophically sound according to his definitions.

  **Single Point of Least Certainty: The Status of Tipping**
  I am least sure about the classification of **Tipping**.
  *   *Why:* Lewis defines conventions as solutions to *coordination* problems (we both want to match). Tipping has elements of a *bargaining* problem or a *distributional* norm. Is the 20% figure a convention (arbitrary matching)? Or is it a norm enforcing a wage subsidy (moral obligation)?
  *   Philosophers like Cristina Bicchieri have argued that many "conventions" are actually "social norms" that depend on empirical expectations (what others do) *and* normative expectations (what others think I *should* do). Tipping sits right on that boundary. If you treat it as a pure Lewis convention, you might miss the moral coercion involved; if you treat it as a pure moral norm, you miss the arbitrariness of the percentage.

  **Final Advice for an Engineer:**
  Use the **"Arbitrariness + Conditional Preference"** test.
  1.  Could we have done the opposite with equal technical success? (Arbitrariness)
  2.  If the team switched to the opposite tomorrow, would I switch with them to avoid breakage? (Conditional Preference)

  If both are **Yes**, it's a convention (like Port 443).
  If #2 is **No** (I'd stick to my guns), it's a norm or principle (like Queueing).
  If #1 is **No** (One way is technically superior), it's a standard or best practice (like Interview Dress).
