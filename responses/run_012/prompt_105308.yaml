          *   Changing Artifact (Design): Direct impact on the "politics" identified in ranking (Affordances).
      *   *Verdict:* Spend on **Changing the Artifact**. Why? Because the politics are embedded in the affordances. Rules without architectural constraints are just suggestions. Deciders will follow the path of least resistance created by the tool.

