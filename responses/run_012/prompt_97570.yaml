answer: |-
  ### Brainstorming Pass

  **1. Claims Likely to Secure Genuine Agreement (Not Mere Truce)**
  *   **Rejection of Strict Sum-Utilitarianism:** Both sides agree that a linear social welfare function ($W = \sum u_i$) fails to capture moral reality; benefiting the worse off has greater moral urgency than benefiting the better off, ceteris paribus.
  *   **The All-Things-Considered Verdict on Levelling Down:** Both sides agree that a policy which makes the better off worse off without helping the worse off is never *all-things-considered* obligatory or desirable. (The Egalitarian concedes this is not a decisive refutation of their view, but agrees on the verdict; the Prioritarian agrees this is the correct verdict).
  *   **Interpersonal Comparability:** Both sides accept the working assumption that welfare is cardinally measurable and interpersonally comparable, at least sufficiently for the purposes of this formal model.
  *   **The Badness of Severe Deprivation:** Both sides agree that states of affairs involving severe absolute deprivation are morally worse than states without such deprivation, independent of relative gaps.

  **2. Candidate Cruxes (Substantive Divergences)**
  *   **The Ground of Weighting:** Is the extra moral weight given to the worse off derived from their *absolute* level of welfare (Priority) or their *relative* position compared to others (Equality)?
  *   **The Scope of Distribution:** Does the moral concern for distribution apply only between distinct persons, or does it apply to time-slices within a single life (intrapersonal)?
  *   **The Negative Range:** In the domain of negative welfare (suffering), does the moral weighting function $f$ become steeper (prioritizing relief of extreme suffering) or does it track relational gaps which might behave differently below zero?
  *   **The Ontology of $f$:** Is the concavity of $f$ a normative transformation of a natural welfare metric, or is it a descriptive feature of the moral value of welfare itself (collapsing Priority into a form of Utilitarianism)?

  **3. Flagged Verbal Disagreements**
  *   **"Intrinsic Badness":** The Egalitarian uses "intrinsic" to mean "a pro tanto value that contributes to the overall evaluation." The Prioritarian uses "intrinsic" to imply "makes the outcome worse all-things-considered even if no one is affected." This is largely verbal if the Egalitarian admits levelling down is not all-things-considered better.
  *   **"Person-Affecting":** The Prioritarian claims their view is person-affecting (benefits must accrue to individuals). The Egalitarian talks of "states of affairs." In fixed-population cases, this yields identical rankings, suggesting the disagreement is metaphysical rather than practical within this specific formal setup.

  ***

  # JOINT STATEMENT ON DISTRIBUTIVE WEIGHTING AND SOCIAL EVALUATION

  **Signatories:** The Prioritarian Camp & The Telic Egalitarian Camp
  **Date:** October 2023
  **Subject:** Adversarial Collaboration on Formal Axiology and Distributive Justice

  ## PART I: AGREED CLAIMS

  We, the undersigned, having engaged in adversarial collaboration under a shared formal framework, affirm the following claims as points of convergence. These claims establish the baseline for our remaining disagreements.

  1.  **Rejection of Linearity:** We agree that the moral value of a benefit is not constant. A social welfare function of the form $W = \sum u_i$ (where $u_i$ is the welfare of person $i$) is inadequate. We jointly endorse a transformed function $W = \sum f(u_i)$, where $f$ is strictly increasing.
  2.  **Concavity in the Positive Range:** For all welfare levels $u > 0$, we agree that $f$ is strictly concave ($f'' < 0$). This mathematically encodes our shared intuition that benefiting a person at a lower welfare level generates more moral value than an equivalent benefit to a person at a higher welfare level.
  3.  **The Levelling Down Verdict:** We agree that "levelling down" (reducing the welfare of the better off without increasing the welfare of the worse off) is never all-things-considered morally required or desirable. While we disagree on whether such an act improves the situation *in one respect*, we agree it does not improve the situation *overall*.
  4.  **Absolute Deprivation Matters:** We agree that any adequate theory must register the badness of absolute poverty or suffering. A view that registers only relative gaps, ignoring whether everyone is above or below a threshold of sufficiency, is rejected by both camps.
  5.  **Formal Adequacy:** We agree that the functional form $W = \sum f(u_i)$ is a sufficient heuristic for comparing our views in fixed-population cases, provided we remain vigilant about the interpretation of the parameters $u$ and $f$.

  ## PART II: RESIDUAL DISAGREEMENTS TABLE

  The following table isolates the specific points where our interpretations of the shared formalism diverge. Each formulation is phrased to be acceptable to its own proponents.

  | Question | Prioritarian Formulation | Telic Egalitarian Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **1. The Source of Concavity** | The concavity of $f$ represents a **normative weighting** applied to a naturalistic welfare metric. The moral urgency derives from the absolute level of $u_i$; the function $f$ captures the moral truth that benefits matter more the lower the absolute $u_i$. | The concavity of $f$ represents the **moral disvalue of inequality** encoded into a separable form. The urgency derives from the distance of $u_i$ from the social mean; $f$ is concave because moving a unit from high to low reduces the intrinsic badness of the gap. | Substantive |
  | **2. The Negative Range** | In the range $u < 0$, $f$ must remain concave and increasing. The marginal moral value of relieving suffering ($u: -10 \to -9$) must exceed the value of relieving mild pain ($u: -2 \to -1$). The function should not have a discontinuity at zero. | In the range $u < 0$, the shape of $f$ is determined by how inequality manifests in suffering. If everyone is suffering, relative gaps may matter less than absolute relief, potentially requiring $f$ to behave differently (e.g., becoming linear or convex) to reflect that equality is less urgent when all are below baseline. | Substantive |
  | **3. Intrapersonal Distribution** | The priority weighting applies only **between persons**. Within a single life, the concavity of $f$ should not apply to time-slices. A life of (15, 5) is morally equivalent to (10, 10) if total welfare is identical, because there is no interpersonal injustice. | The badness of inequality is **pattern-based**, not strictly person-bound. If inequality is intrinsically bad, a jagged life (15, 5) is pro tanto worse than a smooth life (10, 10), even for one person, because the pattern of distribution across time mirrors the pattern across persons. | Substantive |
  | **4. Non-Welfare Goods** | Priority applies to the **welfare outcomes** of goods, not the goods themselves. Distributing a non-welfare good (e.g., rights) is only instrumentally valuable insofar as it affects $u_i$. Absolute levels of welfare trump equal distribution of resources. | Equality may apply directly to **non-welfare goods** (e.g., opportunities, rights) independent of their welfare yield. An unequal distribution of a fundamental good is intrinsically bad even if it maximizes the priority-weighted welfare sum. | Substantive |
  | **5. Ontology of the View** | Priority View is a **third alternative**: It is distinct from Utilitarianism (which uses linear $f$) and Egalitarianism (which is relational). It is person-affecting and absolute. | Priority View is **Utilitarianism Relabelled**: By defining the welfare scale as the moral value scale, the Priority View collapses into Utilitarianism. True Egalitarianism is the only view that treats the *relation* as the object of value, not just the weighted sum. | Verbal / Metaphysical |

  ## PART III: CRUXES AND PREDICTIVE CASES

  We identify three specific cases where our shared formalism yields divergent rankings. We record our predictions in advance to determine which view best matches our considered moral judgments.

  ### Crux 1: The Intrapersonal Analogue (Temporal Distribution)
  **The Case:** A single individual lives for two periods.
  *   **Option A:** Welfare levels are (10, 10). Total = 20.
  *   **Option B:** Welfare levels are (15, 5). Total = 20.
  *   **Formal Constraint:** We apply the function $f(u)$ to each period's welfare and sum the results.

  | Camp | Prediction & Justification |
  | :--- | :--- |
  | **Prioritarian** | **Indifferent (A = B).** The priority view is concerned with justice *between persons*. Since this is one person, the concavity of $f$ should not apply across time slices. We treat the person as the unit of account. If we must use the formula, we assert $f$ is linear *within* a life, or that the sum represents the person's total good without moral transformation. |
  | **Telic Egalitarian** | **Prefer A (10, 10).** Inequality is intrinsically bad regardless of the boundaries of the units. A jagged distribution of welfare across time is pro tanto worse than a smooth distribution. The concavity of $f$ applies to all distributions of the good, intrapersonal included. |

  ### Crux 2: The Deep Suffering Case (Negative Welfare)
  **The Case:** Two persons, both in the negative welfare range.
  *   **Option A:** Welfare levels are (-10, -10). Sum = -20.
  *   **Option B:** Welfare levels are (-2, -18). Sum = -20.
  *   **Formal Constraint:** $f$ is increasing. We dispute the curvature for $u < 0$.

  | Camp | Prediction & Justification |
  | :--- | :--- |
  | **Prioritarian** | **Prefer A (-10, -10).** Priority is strongest at the bottom. The person at -18 is in extreme suffering. Relieving them is paramount. However, since totals are fixed, we look at the weighting. Because $f$ is concave everywhere, $f(-10) + f(-10) > f(-2) + f(-18)$. We prioritize the absolute depth of the worst-off position. |
  | **Telic Egalitarian** | **Prefer A (-10, -10).** Inequality is bad. Option B has a gap of 16 units; Option A has a gap of 0. Even in suffering, equality is intrinsically valuable. However, we flag that if $f$ becomes convex in the negative range (diminishing moral urgency of suffering), our rankings might diverge. We insist $f$ must reflect the badness of the gap, which favors A. |
  | **Point of Contention** | **The Shape of $f$ below zero.** The Prioritarian insists $f$ must remain concave to prioritize the -18. The Egalitarian worries that if the "baseline" is zero, negative welfare might require a different functional extension (e.g., exponential) that could alter the ranking if the suffering is extreme enough to saturate moral concern. |

  ### Crux 3: The Non-Welfare Good (Threshold Resource)
  **The Case:** A divisible resource (e.g., a life-saving drug) is distributed. It does not map linearly to welfare.
  *   **Option A:** Give 100% of the drug to Person 1 (Welfare: 100). Person 2 gets 0 (Welfare: 0).
  *   **Option B:** Give 50% to Person 1 (Welfare: 10). Give 50% to Person 2 (Welfare: 10).
  *   **Note:** Due to threshold effects, the drug is much more efficient when concentrated (Total Welfare A = 100, Total Welfare B = 20).

  | Camp | Prediction & Justification |
  | :--- | :--- |
  | **Prioritarian** | **Prefer B (50/50) *if* the priority weight is high enough.** We calculate $f(100)$ vs $2 \times f(10)$. If the concavity of $f$ is steep enough, the moral value of raising Person 2 from 0 to 10 outweighs the loss of moving Person 1 from 100 to 10. However, if the welfare loss is too great, we may concede to A. The decision turns entirely on the welfare outcome, not the drug distribution itself. |
  | **Telic Egalitarian** | **Prefer B (50/50) *ceteris paribus* on resource grounds.** Even if Total Welfare in A were slightly higher (e.g., 100 vs 25), we might still prefer B because the unequal distribution of the *resource* (or the opportunity) is intrinsically bad. We are willing to sacrifice more total welfare for equality of the good itself, not just the welfare outcome. |

