answer: |-
  The Joke

  The faculty lounge was locked. On the table sat the Golden Gavel and a glass jar filled with cash—the 10% skim from every bid they'd just made.

  "I'm at $5,000," said Dr. Aris. "You're second, Dr. Boole. You pay $4,900. You get nothing."

  Boole stared at the jar. It was their money. "If I bid $5,100, I win the Gavel. I get the jar and the right to auction the Tenure Track next year."

  "The jar is just the skim from *this* auction," Aris said. "We are literally paying ourselves to fight over the right to exploit next year's PhDs."

  "Correct."

  "Then stop," Aris pleaded. "The net value is negative. We're burning endowment."

  "I can't," Boole said, raising his paddle. "$5,200."

  "Why? You know the trap!"

  "Because if I stop, I pay $4,900 to fund *your* professorship. If I win, I pay $5,200 to fund *my* professorship. It's the same money, but only one of us gets to hold the gun next year."

  "But the prize value depends on finding new suckers!"

  "Exactly. So I must ensure the pot looks big enough to tempt them. My overbid is their marketing budget."

  Aris looked at the jar, then at her own sinking balance. She realized she couldn't let Boole win, because then her loss becomes his capital. She raised her paddle. "$5,300."

  Boole nodded sadly. "Good. Now the skim increases. We're almost profitable."

  "For who?"

  "For the House. We're just the circulation."

  Commentary: Why It Works

  This joke exploits the specific payoff matrix of the dollar auction: the second-highest bidder pays without receiving the prize. In the standard version, escalation occurs to avoid being the "sucker" who pays for nothing. Here, the twist makes the prize endogenous: the pot consists of the house's skim from the very bids causing the escalation. This creates a recursive loop where the bidders are financing the prize they are fighting over.

  The humor targets game theorists because it exposes the futility of the "winning" condition. Boole recognizes that stopping is irrational not because he expects profit, but because losing means subsidizing Aris's future power to extract value from others. The value of the gavel depends on replicating the trap with new victims, financed by the current victims' losses. The punchline ("We're just the circulation") lands because it identifies the only true beneficiary: the House. The bidders aren't players; they are liquidity providers for the mechanism itself. It transforms the sunk-cost fallacy from a psychological error into a structural necessity, where rational agents knowingly destroy value to avoid subsidizing their rival's dominance.
