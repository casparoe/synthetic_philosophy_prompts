  Begin by asking whether there is some one thing in virtue of which every pleasure is a pleasure, or if the word merely covers a scattered collection of states. If you answer yes, there is a common property, you must next decide whether that property is a felt quality of the experience itself or something relational involving the person's attitudes or functions. If you take the felt-quality branch, you are committed to saying that the taste of a peach and relief, where the experience seems to be mostly the absence of something, share a specific phenomenological tone, which forces you to explain cases like the person who sincerely says a piece of music is wonderful but whose moment-to-moment experience of it is flat, nothing they would call a feeling. Within this felt-quality branch, you must split again over whether the tone is one simple quality or a determinable with very different determinates, since that is what decides whether higher and lower pleasures are even comparable on a single scale. If you claim it is a simple quality, you occupy a leaf that struggles to accommodate the relief case without arguing that the absence of pain is itself a positive sensation, whereas if you claim it is a determinable, you allow for diverse feels under one genus but risk making the genus so thin it does no explanatory work.

  If instead you take the relational branch at the second split, you deny that pleasure is a raw feel and argue it is defined by a relation to what the person wants, to an attitude of liking or being pleased, or to a functional role where the state tends to keep itself going. This branch handles the case of a pleasure nobody feels, like a dreamless night's sleep you wake from rested, much better, since you can desire or benefit from the sleep without feeling anything during it, but it faces pressure from the masochist who seeks out a sensation everyone else calls pain. To navigate this, the relational branch splits into three leaves based on what kind of relation matters, with the first leaf focusing on an attitude of being pleased by something. This attitude leaf must further divide into two distinct leaves based on whether the attitude requires concurrent awareness, creating one leaf for those who require you to feel pleased in the moment and another for those who allow a dispositional endorsement that survives the flat music case, though these two are often hard to separate empirically. The second relational leaf focuses on desire satisfaction, which explains the masochist by saying they desire the pain sensation, though this risks conflating pleasure with mere goal attainment. The third relational leaf focuses on functional role, defining pleasure as whatever reinforces behavior, which aligns closely with the desire view and creates a zone where these two leaves are practically indistinguishable on diagnostic cases, differing only in theoretical framing rather than observable outcomes.

  If the answer at the top is no, and you deny there is any single common property, you must split over whether the class is still unified enough to do work for hedonism as a cluster or family-resemblance view, which makes hedonism pluralist, or whether the class is too fragmented to sustain the theory. If you choose the cluster view, you occupy a leaf that admits diversity but insists on overlapping similarities, though this position is often hard to separate from the determinable felt-quality view since both allow diversity within unity. If you choose the fragmented view, you arrive at three final leaves that explore the consequences of this disunity. The first is the eliminativist leaf, which concludes there is no fact of the matter and pleasure does not exist as a natural kind. The second is the verbal dispute leaf, which argues the disagreement is merely linguistic, and this leaf is often unoccupied as a distinct stable position because it collapses into the third leaf, the disjunctive view on which pleasure is just whatever sits on a long list with no underlying unity. You should note that one combination of answers nobody occupies is the claim that there is a simple felt quality while also accepting unfelt pleasures like dreamless sleep without modification, as this is logically incoherent. You should also flag that the desire-based relational view and the functional-role relational view are rarely separated in practice because they answer the diagnostic cases identically, and similarly the verbal dispute leaf and the disjunctive list leaf are often indistinguishable in their implications for hedonistic calculation, leaving you with a tree that has ten theoretical endpoints but several that merge when tested against the actual cases.
