answer: |-
  Your friend is wrong because complexity classes measure asymptotic worst-case difficulty, while cryptography relies on concrete average-case hardness, meaning P = NP might not break encryption practically and P ≠ NP certainly wouldn't guarantee it survives.

  The first major gap is between worst-case and average-case hardness. NP-completeness guarantees that the *hardest* instances of a problem are difficult to solve if P ≠ NP, but cryptography requires that *almost all* randomly generated instances (keys) are difficult. It is entirely consistent with current knowledge that P ≠ NP yet every practical cryptosystem is breakable because the specific problems used in crypto are easy on average even if some obscure NP-complete problem is hard in the worst case. This scenario is known as Impagliazzo's "Pessiland," where hard problems exist but cannot be used to generate secure keys, proving that P ≠ NP is not sufficient for cryptography.

  The second gap is between asymptotic bounds and concrete security. Even if P = NP and a polynomial-time algorithm exists for breaking a cipher, "polynomial time" describes behavior as the input size approaches infinity and ignores constant factors and exponents. An algorithm running in $O(n^{1000})$ time or requiring $2^{64} \cdot n^2$ operations is technically efficient in complexity theory but practically useless for breaking 2048-bit keys within the lifetime of the universe. Cryptography deals with fixed security parameters (e.g., 128-bit security), not the limit as $n \to \infty$, so a theoretical polynomial bound does not equate to practical feasibility.

  The third gap is that cryptographic problems are likely not NP-complete. Most public-key cryptography relies on problems like Integer Factoring or Discrete Logarithms, which are in NP but are also in co-NP, whereas NP-complete problems are not believed to be in co-NP. If Factoring were NP-complete, the polynomial hierarchy would collapse, which is considered unlikely. Therefore, proving P ≠ NP would not prove these specific problems are hard, as they could reside in P while other NP problems remain outside it; conversely, if P = NP, these problems become solvable in polynomial time, but as noted above, the degree of that polynomial determines whether encryption is actually "dead."

  Finally, cryptography requires specific constructive assumptions, not just class separations. Secure encryption needs one-way functions, which are functions easy to compute but hard to invert on average. While the existence of one-way functions implies P ≠ NP, the converse is not known to be true. Modern cryptography relies on specific hardness assumptions (like Learning With Errors) that are believed to be resistant even to quantum attacks, rather than the blunt instrument of P vs NP, making complexity classes the wrong tool for licensing claims about practical infeasibility.
