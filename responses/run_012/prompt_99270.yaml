      *(One last thought on the "Conservation Law" metaphor)*: The user likened it to energy conservation. In physics, energy is conserved. In economics, *demand* is not conserved, and *employability* is not conserved. The fallacy is treating Labor like Energy. I should explicitly use that metaphor.

      *(Marx Specifics)*: Marx calls the argument that machinery frees capital to re-employ workers the **"Compensation Theory"** specifically in *Capital*, Vol 1, Chapter 15, Section 5 ("Production of Surplus-Value from a Diminished Number of Workpeople"). He explicitly dismantles the idea that the capital *released* is equal to the capital *invested*. This is the "smoking gun" for the user's research.

      *(Neutrality)*: Marx's concept is that machinery is **Fixed Capital**. It is dead labor dominating living labor. The neutrality fallacy ignores that the machine is a social relation.

