answer: |-
  You have a very sharp ear for economic rhetoric. You've identified a specific rhetorical move that is ubiquitous in policy debates but rarely named in isolation. You are right to feel that "Lump of Labor" is only half the puzzle. The Lump of Labor fallacy says "there is a fixed amount of work." The mirror image you are spotting says "there is a fixed amount of *employability* that always finds equilibrium."

  Here is the breakdown of the shape, the name, the boundaries, and how to weaponize it in dialogue.

  ### 1. The Conservation of Labor (Your First Instance)

  **The Academic Name:** **Compensation Theory** (or the Theory of Compensation).
  **The Fallacy Name:** **The Frictionless Reallocation Assumption.**

  **The Shape of the Thing:**
  This is the classical economic argument (dating back to Ricardo, though he later wavered) that machinery displaces labor in one sector but releases capital that is immediately reinvested elsewhere, creating new demand for labor.

  The "fallacy" isn't necessarily that new jobs *never* appear. It's the assumption that the transition is **frictionless, instantaneous, and neutral regarding skill.** It treats labor like a fluid (as you noted) or like energy in a closed system: *Labor cannot be destroyed, only transformed.*

  **Why it drives you up the wall (and why it's unfalsifiable):**
  It operates on the **Aggregate Level** while the suffering happens on the **Individual Level**.
  *   **Aggregate:** "The manufacturing sector lost 1,000 jobs, but the logistics sector gained 1,200." (True)
  *   **Individual:** "John, age 52, welder, cannot become a logistics data analyst." (Also True)

  The argument you are hearing relies on **Time Horizon Smuggling**. It says, "In the long run, the market clears." The counter-argument is, "In the long run, John is dead."

  **Marx's Specific Takedown:**
  Since you are reading *Capital*, go to **Volume 1, Chapter 15, Section 5** ("Production of Surplus-Value from a Diminished Number of Workpeople"). Marx explicitly attacks the "Compensation Theory."
  His argument is mathematical: When a capitalist buys a machine, they spend capital on *constant capital* (machines/materials) instead of *variable capital* (wages). The amount of capital "released" to hire people elsewhere is *less* than the wages previously paid. Therefore, there is a net surplus of workers (a "reserve army of labor") that drives wages down. He calls the belief that workers are seamlessly reabsorbed a "bourgeois consolation."

  **For your Novel:**
  If your pro-automation character uses this argument, they are speaking in **Macroeconomic Aggregates**. They are talking about "Labor Units."
  If your anti-automation character counters them, they shouldn't just say "jobs are lost." They should say: *"You're talking about labor like it's water pouring into a new bucket. But a welder isn't water. You can't pour him into a server farm."*

  **Boundary Case (What it is NOT):**
  It is *not* Say's Law exactly. Say's Law is "Supply creates its own demand." Compensation Theory is "Displacement creates its own re-employment." They are cousins, but Compensation Theory is specific to the labor market.

  ### 2. The Asymmetry of Visibility (Your Second Instance)

  **The Name:** **The Seen and the Unseen** (Bastiat) meets **Abstract Labor** (Marx).

  **The Shape of the Thing:**
  You noticed the asymmetry: The lost job is a specific tragedy (Concrete); the new job is a theoretical possibility (Abstract).
  *   **The Seen:** The self-checkout machine, the lower prices, the new job at the robot factory.
  *   **The Unseen:** The cashier whose hours were cut, the wage suppression in the warehouse because there are too many ex-cashiers applying, the local economic ripple effect of that cashier having less money to spend.

  **The Marxist Nuance:**
  Marx distinguishes between **Concrete Labor** (the specific act of scanning groceries) and **Abstract Labor** (labor power as a commodity). The pro-automation argument treats workers as *Abstract Labor* (interchangeable units of energy). The anti-automation argument defends *Concrete Labor* (the specific life and skill of the person).

  When the store says, "Nobody was fired, they were redeployed," they are engaging in **Accounting Erasure**. They are counting *positions*, not *people*. If a full-time cashier becomes a part-time floor stocker, the *position* of "employee" exists, but the *livelihood* has shrunk.

  **For your Novel:**
  The pro-automation character counts **Headcount**.
  The anti-automation character counts **Hours and Wages**.
  *Dialogue Cue:* "You say the jobs are there. I say the *wages* are gone. You didn't save the job, you just diluted it until three people share what used to feed one."

  ### 3. The Neutrality of the Machine (Your Third Instance)

  **The Name:** **Technological Instrumentalism.**
  **The Counter-Concept:** **The Politics of Artifacts** (or Social Relations of Production).

  **The Shape of the Thing:**
  Instrumentalism is the belief that technology is a mere tool, neutral in itself, and only the *use* determines its morality. "A hammer can build a house or break a skull; the hammer isn't to blame."

  Your Marxist friend is correct: In a capitalist system, the machine is **not neutral**. It is **Fixed Capital**. Its purpose is not merely "efficiency" (making things faster); its purpose is "valorization" (extracting surplus value).
  *   **Neutral View:** The machine reduces the labor time needed to make a widget.
  *   **Critical View:** The machine reduces the worker's leverage to demand higher wages.

  The machine encodes power relations. A self-checkout isn't just a faster register; it is a transfer of unpaid labor from the employee to the customer, and a surveillance tool to monitor throughput.

  **For your Novel:**
  The pro-automation character treats the machine as **Physics** (inputs/outputs, efficiency).
  The anti-automation character treats the machine as **Law** (rules, ownership, control).
  *Dialogue Cue:* "You say the machine is neutral. But who owns the machine? If I own it, it frees me. If you own it, it replaces me. The steel doesn't change, but the relationship does."

  ### Summary for Character Voices

  To keep your characters from sounding like idiots, give them distinct "levels of analysis."

  **The Pro-Automation Character (The Manager/Engineer):**
  *   **Fallacy:** Frictionless Reallocation / Instrumentalism.
  *   **Vocabulary:** Efficiency, Aggregate, Market Clearing, Innovation, Transition.
  *   **Blind Spot:** Time lags, skill mismatches, power dynamics.
  *   **Core Belief:** "Pain is temporary; progress is permanent. The pie gets bigger."
  *   **Weakness:** Cannot account for the specific human cost, only the statistical trend.

  **The Anti-Automation Character (The Union Rep/Worker):**
  *   **Fallacy Risk:** Lump of Labor (be careful not to make them say "there will be no new jobs ever").
  *   **Better Argument:** Friction is Fatal / Technology is Power.
  *   **Vocabulary:** Livelihood, Community, Leverage, Ownership, Displacement.
  *   **Core Belief:** "The pie might get bigger, but I'm not getting a slice. And you're using the machine to cut my fingers off."
  *   **Weakness:** Can sound like they are fighting history itself (Luddism) rather than fighting the *ownership* of history.

  ### The "Name" You Asked For

  If you need a single phrase for that first "conservation of labor" mistake to put in a character's mouth, call it **"The Equilibrium Myth."**

  It captures the physics metaphor you liked. It implies that the market is a self-correcting machine that *must* return to balance, ignoring that the "balance" might be a town with half the population on disability.

  **Edge Case Warning:**
  Be careful not to make the Pro-Automation character *wrong* about everything. Historically, automation *does* create new industries. The tension in your book shouldn't be "Will jobs exist in 10 years?" (Yes). The tension should be "Who owns the value created in the meantime, and who survives the transition?"

  That is the argument Marx actually won, and the one your characters should be having.
