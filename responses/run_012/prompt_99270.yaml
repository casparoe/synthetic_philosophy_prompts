      *   **Context:** Novelist writing about factory automation (60k words in). Wants accuracy in character arguments about economics/labor.
      *   **Core Question:** Is there a specific name for the argument that "labor displaced by machines is automatically reabsorbed elsewhere, so no net job loss occurs"?
      *   **Specific Nuances:**
          *   It's the mirror image of the "Lump of Labor Fallacy."
          *   It feels like a conservation law (labor energy can't be destroyed, only moved).
          *   It's unfalsifiable (you can't track the specific reabsorbed worker).
          *   Second instance: Self-checkout (vanished job = hard fact, reappearing job = gift/abstract).
          *   Third instance: Technology neutrality (ignoring ownership/power relations).
      *   **Requirement:** Don't just give a label. Explain the *shape* of the concept, its boundaries, nearby concepts, and what it is *not*. The user wants to write believable dialogue, not just cite a textbook.

  2.  **Deconstruct the Economic Arguments:**

      *   **Argument 1 (The "Lump of Labor" Mirror):**
          *   *User's description:* "Labor is a fluid that just flows to wherever there's a hole."
          *   *Standard Economic Term:* **Compensation Theory** (or the Theory of Compensation). This is the classical economic counter-argument to technological unemployment.
          *   *The Fallacy:* Assuming *automatic* and *frictionless* compensation.
          *   *Marxist Critique:* Marx addresses this in *Capital Vol. 1*, Chapter 15 ("Machinery and Modern Industry"). He calls out the "bourgeois economists" who claim machinery frees labor for new spheres without acknowledging the displacement, deskilling, and reserve army of labor effects.
          *   *Is there a specific fallacy name?* Not a single catchy pop-econ name like "Lump of Labor," but **"Automatic Compensation Fallacy"** or **"Trickle-Down Labor Theory"** fits. However, academically, it's often discussed under **Technological Unemployment** debates.
          *   *Key Distinction:* The Lump of Labor fallacy says "There is X amount of work." The Compensation Theory says "New work is always created to replace lost work." The user is right: the latter is often treated as a law of nature when it's actually a contingent outcome.

      *   **Argument 2 (The Asymmetry of Visibility):**
          *   *User's description:* Vanished job = concrete fact. Reappearing job = abstract gift.
          *   *Concept:* **Broken Window Fallacy** (Bastiat). We see the new jobs (the glazier fixing the window), we don't see the lost opportunity (what the shopkeeper would have spent the money on otherwise).
          *   *Refinement:* In automation, it's the **Seen vs. Unseen**. We see the robot builder's job. We don't see the specific factory worker who *didn't* get rehired or the wage suppression.
          *   *Marxist angle:* **Abstract Labor** vs. **Concrete Labor**. The specific cashier is concrete; the "warehouse job" is abstract labor power.

      *   **Argument 3 (Technology Neutrality):**
          *   *User's description:* Treating tech effects as independent of ownership.
          *   *Concept:* **Technological Determinism** (the idea that tech drives history socially, independent of human choice).
          *   *Marxist angle:* **Reification** (treating social relations as things) or **Fetishism of Commodities** (specifically the machine as a neutral producer of value rather than a vessel of social relation).
          *   *Better Term:* **Instrumentalism** (technology is just a tool, neutral). The counter is **Substantive Theory of Technology** (Feenberg) or **Politics of Artifacts** (Winner).

  3.  **Synthesize and Name:**

      *   *The Big Picture:* The user is describing the **Neoclassical Assumption of Full Employment Equilibrium** masquerading as a natural law.
      *   *The Specific Move:* It's the **Fallacy of Frictionless Reallocation**.
      *   *Marxist Specifics:* Marx calls the belief that machinery *necessarily* frees labor for new uses without hardship the **"Apologia for Machinery."** He specifically attacks the idea that the capital released by machinery automatically re-employs the displaced workers.
      *   *Best Label for the Novelist:* **"The Compensation Fallacy"** is the historical term, but **"The Frictionless Labor Assumption"** captures the *physics* metaphor the user likes.
      *   *For the Neutrality point:* **"Technological Instrumentalism."**

  4.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the insight:* Validate that the user has spotted a real, specific rhetorical move that often goes unnamed in pop discourse but is central to political economy.
      *   *Address Point 1 (The Conservation of Labor):*
          *   Identify it: **Compensation Theory**.
          *   Explain the flaw: It assumes *macro* balance ignores *micro* ruin. It ignores time, geography, and skill mismatch.
          *   Marx's take: He calls it the "bourgeois economist's consolation." He argues machinery creates a "reserve army of labor" (unemployment) which drives wages down, rather than seamlessly reabsorbing workers.
          *   Naming it for dialogue: "The Magic Reallocation Assumption."
      *   *Address Point 2 (The Asymmetry/Visibility):*
