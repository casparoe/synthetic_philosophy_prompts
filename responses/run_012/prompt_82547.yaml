      *   *Dennett's "Real Patterns":* Dennett explicitly argues against the idea that patterns must be "in the world" independent of description. The user's view risks moving back toward "patterns are in the world, we just need the right lens."
      *   *The "Stance" aspect:* The intentional stance is a *strategy*. If the strategy is defined by an ideal agent, is it still a *stance*? Or is it just a description of causal structure?

