answer: |-
  Here is a complete lesson plan for a 60-minute seminar session. It is designed to be low-tech (paper/envelopes) but high-fidelity to the Bayesian logic of information cascades.

  # Seminar Plan: The Fragile Cascade
  **Topic:** Social Epistemology / Information Cascades
  **Time:** 60 Minutes
  **Students:** ~20
  **Goal:** Demonstrate rational information cascades, the role of heterogeneous signal precision, and the negative externality of cascades on information acquisition.

  ---

  ## 1. Materials & Preparation

  **You need:**
  *   **20 Envelopes:** Opaque, sealed.
  *   **Signal Cards:** 20 small slips of paper to go inside envelopes.
  *   **Reliability Markers:** A small dot/sticker on the back of some signal cards.
  *   **Scoreboard:** Whiteboard to track cumulative points.
  *   **The "Truth":** A coin or randomizer to determine the True State (State A or State B).

  **Pre-Setting the Signals (Crucial for Timing):**
  To guarantee the pedagogical arc within 60 minutes, do not randomize the signals live. Pre-assign them to seats 1–20.
  *   **True State:** **A** (Keep this secret).
  *   **Students 1–15 (Noisy):** Signal reliability 60%.
  *   **Students 16–20 (Experts):** Signal reliability 90%.
  *   **The Sequence:**
      *   **S1:** Signal A (Guesses A)
      *   **S2:** Signal B (Guesses A — *Cascade Starts Here*)
      *   **S3:** Signal B (Guesses A — *Cascade Solidifies*)
      *   **S4–S15:** Signal B (All Guess A — *The Cascade Run*)
      *   **S16 (Expert):** Signal B (Guesses **B** — *The Break*)
      *   **S17–20:** (Resume guessing based on new info).

  *Note: In the envelopes, S1 gets card "A". S2–S15 get card "B". S16 gets card "B" but has the "Expert" dot. S17–20 get card "A".*
  *Why this works:* S1 says A. S2 sees B, but calculates P(A|Public A, Private B) > P(B|...). S2 says A. S3 sees B, but now public weight is heavy. S3 says A. Cascade on A is locked. S16 (Expert) has a signal strong enough to outweigh the public history. They switch to B.

  **Payoff Structure:**
  *   **Correct Guess:** +10 Points
  *   **Incorrect Guess:** -5 Points
  *   **Cost to Peek (Round 2 only):** -3 Points (deducted regardless of outcome)

  ---

  ## 2. Rules & Script

  ### Introduction (Minutes 0–5)
  **Instructor:** "We are going to play a guessing game. There is a True State of the world: either **Box A** or **Box B**. I have determined the True State secretly. It is fixed for the whole game."

  "Each of you has an envelope. Inside is a **Signal**. The signal is either 'A' or 'B'. It is correlated with the True State, but it is not perfect."

  "**Rule 1:** You may open your envelope to see your signal.
  **Rule 2:** You must announce your **Guess** (A or B) publicly, in order from Seat 1 to 20.
  **Rule 3:** You want to maximize your points. Correct = +10, Wrong = -5.
  **Rule 4:** Do not show your card. Do not talk about your card. Only announce your Guess."

  **The Twist (Whispered/Handout):**
  "Inside some envelopes, on the back of the card, there is a **Gold Dot**. If you have a dot, your signal is **90% accurate**. If you do not have a dot, your signal is **60% accurate**. You know your own reliability; no one else does. Do not reveal if you have a dot."

  ### Round 1: Free Information (Minutes 5–25)
  1.  **Setup:** Distribute envelopes. Give students 2 minutes to open, read, and calculate.
  2.  **Play:** Go down the row. Ask for their guess. Write it on the board.
      *   *Prompt:* "Seat 1, what is your guess?" (Record it). "Seat 2?"
      *   *Constraint:* Do not allow "I pass." They must guess.
      *   *Constraint:* Do not allow explanations. Just "A" or "B".
  3.  **The Moment:** Around Seat 3 or 4, the guesses will lock into one letter despite subsequent signals saying the opposite. Students will feel the tension of ignoring their own eyes.
  4.  **The Break:** At Seat 16 (Expert), they should switch the guess to the other letter.
  5.  **Reveal:** Open the True State. Tally scores.

  ### Round 2: Costly Information (Minutes 25–40)
  **Instructor:** "We reset. Same True State (or flip a coin for a new one, but keep the signal sequence similar). Same envelopes."
  **New Rule:** "Opening your envelope now costs **3 points**. You may choose to **Guess Blind** based only on previous guesses, or **Pay to Peek**."

  1.  **Play:** Run the sequence again.
  2.  **Expected Behavior:**
      *   Early players (1–3) will pay to peek (their info is valuable).
      *   Mid-cascade players (4–15) should rationally choose **Guess Blind**. Why pay 3 points for a signal you intend to ignore?
      *   Expert (16) will pay to peek (their signal is valuable enough to break the cascade).
  3.  **Reveal:** Tally scores. Highlight how many points were "saved" by not looking, and how much social information was lost.

  ### Debrief & Theory (Minutes 40–60)
  *See detailed breakdown below.*

  ---

  ## 3. Scoring Scheme (Whiteboard Template)

  | Seat | Reliability | Signal (Private) | Previous Guesses | **Guess (Public)** | Peek Cost? | Round 1 Score | Round 2 Score |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 60% | A | - | **A** | Free | +10 | +7 |
  | 2 | 60% | B | A | **A** | Free | +10 | +7 |
  | 3 | 60% | B | A, A | **A** | Free | +10 | 0 (Blind) |
  | ... | ... | ... | ... | ... | ... | ... | ... |
  | 16 | 90% | B | A... | **B** | Free | +10 | +7 |

  ---

  ## 4. Minute-by-Minute Timeline

  *   **00:00 – 00:05:** **Intro.** Explain True State, Payoffs, and Secrecy rules. Hand out envelopes.
  *   **00:05 – 00:08:** **Calculation.** Students open envelopes. Walk around to ensure they understand their reliability (Dot vs. No Dot).
  *   **00:08 – 00:20:** **Round 1 Play.** Rapid fire guesses. (1 min per student avg, faster as it goes).
  *   **00:20 – 00:25:** **Round 1 Reveal.** Reveal True State. Ask 2-3 students: "You saw signal B, why did you say A?" (Don't answer yet).
  *   **00:25 – 00:28:** **Round 2 Setup.** Explain the "Cost to Peek" rule. Reset board.
  *   **00:28 – 00:40:** **Round 2 Play.** Ask each student: "Pay to peek or Guess Blind?" Then take their guess.
  *   **00:40 – 00:55:** **Formal Debrief.** (See below).
  *   **00:55 – 01:00:** **Q&A / Wrap.**

  ---

  ## 5. The Debrief: Mapping Experience to Theory

  Do not lecture immediately. Ask Socratic questions to extract the concepts, then formalize them.

  **1. Private vs. Public Information**
  *   *Ask:* "Seat 3, you had a 'B' card. Everyone before you said 'A'. Why did you say 'A'?"
  *   *Student:* "Because it was more likely they were right."
  *   *Formalize:* Write the Bayesian update on the board.
      *   Prior: 50/50.
      *   Likelihood Ratio (Noisy): $0.6/0.4 = 1.5$.
      *   After two 'A' guesses, the public odds are $1.5 \times 1.5 = 2.25$ to 1 in favor of A.
      *   Your private signal (B) is only 1.5 to 1 in favor of B.
      *   $2.25 > 1.5$. Rationality dictates following the public pool.

  **2. The Cascade (vs. Herding)**
  *   *Concept:* Distinguish **Information Cascade** from **Preference Herding**.
  *   *Point:* "You didn't say 'A' because you wanted to fit in (herding). You said 'A' because, mathematically, the public information *outweighed* your private evidence. You weren't being sheep; you were being Bayesian."
  *   *Definition:* A cascade occurs when it becomes optimal to ignore private signals regardless of what they say.

  **3. Cascade Fragility (The Expert)**
  *   *Ask:* "Seat 16, what happened when you guessed?"
  *   *Point:* The cascade on 'A' was deep (13 people), but it was **fragile**.
  *   *Math:* The public weight was roughly $1.5^{13}$? No, because people 3–15 added *no* new info. The public weight was stuck at the weight of the first two people ($2.25$).
  *   *The Expert:* Expert Likelihood Ratio = $0.9/0.1 = 9$.
  *   $9 > 2.25$. The Expert's private signal crushed the public history.
  *   *Lesson:* Cascades are not stable equilibria. They are brittle because they rest on a thin sliver of actual information (the first few guessers).

  **4. Information Externality (Round 2)**
  *   *Ask:* "Seats 4–15 in Round 2, many of you chose 'Guess Blind' to save 3 points. Was that good for *you*? Was it good for the *class*?"
  *   *Point:* Good for you (individual rationality). Bad for the class (social inefficiency).
  *   *Concept:* **Information Externality.** Your guess reveals info to others. By not paying to peek, you deprived Seat 17 of data.
  *   *Conclusion:* Cascades create a negative externality where individuals stop producing information, potentially locking the group into a false belief indefinitely.

  ---

  ## 6. What Will Predictably Go Wrong

  **1. The "Joker" Problem**
  *   *Risk:* A student decides to be contrarian just to see what happens, breaking the cascade artificially.
  *   *Fix:* Emphasize the payoff. "This is a competition. Top 3 scores get [small prize/extra credit]." Make it costly to joke.

  **2. The Expert Goes Early**
  *   *Risk:* If you don't pre-set the seats, an Expert might be Seat 2. They will reveal the truth immediately, and no cascade forms.
  *   *Fix:* **Pre-assign the envelopes** as described in the Materials section. Do not randomize live.

  **3. Students Don't Trust the Math**
  *   *Risk:* Students feel "stupid" ignoring their own card. They think they are supposed to be honest.
  *   *Fix:* In the debrief, validate them. "If you ignored your card, you played the game correctly. If you followed your card against the crowd, you lost points unnecessarily."

  **4. Timing Overrun**
  *   *Risk:* 20 students talking takes too long.
  *   *Fix:* If you pass minute 25 in Round 1, cut the chain. Ask Seat 10 to announce what the rest of the class *would* have guessed. "If you were Seat 11, what would you do?"

  ---

  ## 7. Limitations: What This Game Cannot Reproduce

  Be honest with your students about these boundaries during the debrief.

  1.  **Common Knowledge of Rationality:** The game assumes everyone knows everyone else is a rational Bayesian updater. In reality, if I think *you* might be irrational, I should trust my private signal more. This "level-k" thinking stabilizes real-world cascades differently.
  2.  **Signal Visibility:** In the game, guesses are perfect signals of belief. In reality, people might guess 'A' but hedge ("I think A, but I'm not sure"). Ambiguity slows cascades.
  3.  **Reputational Costs:** The game has no reputation. In real life, being the one who breaks the cascade and turns out *wrong* is costly. This makes real-world cascades stickier than the game suggests.
  4.  **Continuous vs. Discrete:** Real beliefs are continuous probabilities; this game forces binary choices. This exaggerates the "cliff-edge" nature of the cascade.

  ## Instructor's Cheat Sheet (The Math)

  *   **Prior:** $P(A) = 0.5$
  *   **Noisy Signal (Likelihood Ratio):** $\frac{P(s=A|A)}{P(s=A|B)} = \frac{0.6}{0.4} = 1.5$
  *   **Expert Signal (Likelihood Ratio):** $\frac{0.9}{0.1} = 9.0$
  *   **Cascade Threshold:** After 2 matching noisy guesses, the posterior odds are $1.5 \times 1.5 = 2.25$.
  *   **Decision Rule:**
      *   If Public Odds > 1.5, ignore noisy private signal.
      *   If Public Odds < 9.0, Expert private signal *will* override public history.
      *   *Note:* This is why the cascade is fragile. The public information stops accumulating after person 3. It stays at 2.25 forever until an Expert arrives.
