      *   *Claim 7:* "So we should abandon expected value maximization."

  3.  **Evaluate Each Claim (Mental Draft & Fact-Checking):**

      *   *Claim 1 (Game Definition):* Standard definition of Pasadena Game (Nover & Hájek, 2004). Payoff is $(-1)^{n-1} \frac{2^n}{n}$. Probability is $1/2^n$.
          *   *Check:* Expected value term is $P(n) \times Payoff(n) = \frac{1}{2^n} \times (-1)^{n-1} \frac{2^n}{n} = \frac{(-1)^{n-1}}{n}$.
