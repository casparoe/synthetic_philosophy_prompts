prompt: |-
  I run a small software company — 45 people — and I do the final-round interview for every hire we make (six or eight a year) plus I sit in on promotion decisions, so I'm the guy who has to look someone in the eye and say yes. I've now made two bad senior hires in a row that I personally signed off on. Both interviewed like people who'd flag a problem before it blew up and do what they said they'd do without being chased; both turned out within a year to be the opposite. I was venting about this to a friend who's finishing a PhD in philosophy and she said what I'm describing has a name — she said my interview is probably "finkish," and that I'm probably seeing "masks" and "mimics." I looked it up badly and this is what I think she meant, tell me where I'm wrong: a fink is when the very thing that would trigger the trait also destroys it (her example was a wire that's meant to conduct when you touch it, wired up so touching it cuts the current); a mask is when the trait is genuinely there but something external stops it showing (a fragile glass packed in foam that survives being dropped); and a mimic is when you see the behaviour with no trait behind it (a styrofoam cup that shatters like glass but isn't fragile). She said something about the standard "if you strike it, it breaks" analysis of dispositions being dead because of the fink cases, which I dont really understand, but the part I care about is that she claims the fix for a mask and the fix for a fink are different, and that I've been treating one as the other. Please straighten out anything I've got wrong before you use it, because the whole procedure depends on those three distinctions being right.

  What I want out of this is a procedure I can actually run — not a reading list, I'm not going to become a philosopher, I need something I can hand to a team lead who has never heard any of this. The traits I'm trying to get at are the ones you can't really test for in a room: whether someone raises a problem early, whether they'll do the thing they committed to when nobody's watching, whether they'll say "I don't know" in front of a client instead of bluffing. So: give me the questions to ask in order about any one of those traits, what counts as a sufficient answer to each, where the procedure has to stop and say "you can't tell this from here," and where it stops and hands the decision to me as a values call rather than a fact. Then run it on three cases. (a) An outside candidate with a spotless record at a big company who aced the interview. (b) Someone internal who was excellent for two years and then went quiet and started missing things after moving onto a team whose manager they can't stand — I'd been reading that as the real them finally showing through, and I suspect the procedure is going to tell me something I don't want to hear about that. (c) Me trying to assess honesty in a conversation where the candidate obviously knows they're being assessed for honesty. Constraints: I get an hour in the room, I can pay for a two-day paid work sample, offers need the team lead's agreement, and each hire is roughly a year of my life if it goes wrong, so I'd rather the procedure say "unknown, here's what to do about it" than fake a verdict. Tell me plainly what the procedure can't do and which step is doing the real work. Finish with one last line beginning "Weakest link:" that names, in a single sentence, the step most likely to misfire.
