answer: |-
  ### Part 1: The Philosophy Check

  You are about 80% right, and that 20% matters for the procedure.

  1.  **Mimic:** You got this right. It's behavior without the disposition. In hiring, this is a candidate who *performs* reliability in the low-stakes interview but lacks the *disposition* for reliability in the high-stakes job.
  2.  **Mask:** You got this right. The disposition exists, but the environment prevents manifestation. Your internal candidate (Case B) is likely a Mask, not a character failure.
  3.  **Fink:** Your definition is close, but the application is trickier. A finkish disposition is one where the *trigger* for the trait destroys the trait itself. In your context, **the interview is a finkish situation for honesty.** The moment you signal "I am testing your honesty," you trigger a performance of honesty that destroys actual honesty.

  **Where you are wrong:** You suspect you are treating Masks as Finks. You are actually treating **Mimics as True Dispositions.** You are believing the interview performance (Mimic) is the real trait. You are also treating **Masks (Internal Candidate) as Lost Dispositions.**

  The procedure below is designed to strip the Mimic, identify the Mask, and mitigate the Fink.

  ***

  ### Part 2: The Dispositional Stress Test (Procedure)

  **Owner:** Team Lead (runs Steps 1–4), CEO (runs Step 5).
  **Time:** 60 mins Interview + 2-day Work Sample.
  **Target Traits:** Proactivity, Reliability, Honesty.

  #### Step 1: Granular Reconstruction (15 mins)
  *Goal: Break the Mimic. Scripts are general; memory is specific.*
  *   **Question:** "Pick one specific time you flagged a problem early. Walk me through the exact hour you realized it. What was the first thing you typed or said? To whom? What was their reply?"
  *   **Sufficient Answer:** Specific timestamps, channel (Slack/Email), and names. Admittance of uncertainty ("I think it was Tuesday").
  *   **Fail Signal:** Generalizations ("I usually reach out immediately"), perfect narratives with no friction, or inability to name the recipient.
  *   **Stop Rule:** If they cannot reconstruct one event granularly, stop. They are reciting a script.

  #### Step 2: The Friction Audit (15 mins)
  *Goal: Distinguish Mimic from Trait. Traits show up under resistance.*
  *   **Question:** "In that same story, what made it hard to speak up? Was there a political risk? A deadline pressure? Tell me about a time you *didn't* flag something and why."
  *   **Sufficient Answer:** Admission of fear, cost, or trade-off. "I was worried the PM would get mad," or "I stayed silent on X because the risk was low."
  *   **Fail Signal:** "It wasn't hard," or "I always speak up." (This is a Mimic signal; reliability without cost is just ease).
  *   **Stop Rule:** If they claim zero friction in a senior role, flag as high-risk Mimic.

  #### Step 3: Environmental Isolation (15 mins)
  *Goal: Identify Masks. Is the trait theirs or the company's?*
  *   **Question:** "What processes at your current job make it easy to be proactive? If you removed [Project Manager/CI Pipeline/Standup], would you still catch these errors?"
  *   **Sufficient Answer:** Ability to separate their agency from the org's scaffolding. "The pipeline helps, but I also manually check X."
  *   **Fail Signal:** Attributing all success to process ("We have Jira workflows that force it"). This indicates a Mask—the trait belongs to the company, not the person.
  *   **Stop Rule:** If they cannot identify how they would function without their current infrastructure, they are a Masked hire.

  #### Step 4: The Paid Stress-Test (2 Days)
  *Goal: The Reality Check. Move from Interview Context to Work Context.*
  *   **Task:** A realistic task with a deliberate, hidden ambiguity or error.
  *   **Instruction:** "Here is a spec. Build X. If you see issues, tell us."
  *   **Success Metric:** Do they ship the code *and* flag the error? Or do they ship broken code silently to meet the deadline?
  *   **Sufficient Answer:** A delivery that includes a note: "I built this, but line 40 assumes Y which seems wrong."
  *   **Fail Signal:** Silent failure. Shipping the error to look competent.
  *   **Stop Rule:** If they fail the stress test, do not hire. No interview answer overrides this data.

  #### Step 5: The Values Gate (CEO Only)
  *Goal: The Fact vs. Values Call.*
  *   **Input:** Data from Steps 1–4.
  *   **Fact Call:** If Steps 1–4 show Mimicry (scripted, no friction, process-dependent) or Stress-Test failure = **No Hire.**
  *   **Values Call:** If Steps 1–4 show Trait but with risk (e.g., they are proactive but abrasive) = **CEO Decision.**
  *   **Unknown:** If data is contradictory (e.g., great interview, mediocre work sample) = **No Hire.** Do not gamble on "potential."

  ***

  ### Part 3: Running the Cases

  #### Case (a): The External Star (Big Co, Spotless Record)
  *   **Step 1 (Reconstruction):** They will have polished stories. *Push for typos in their memory.*
  *   **Step 3 (Environment):** **Critical Failure Point.** Big Co candidates often rely on massive scaffolding (dedicated QA, PMs, legal). If they say, "QA would have caught that," they are a **Mask**. The trait belongs to the Big Co, not them.
  *   **Step 4 (Work Sample):** They may over-engineer to impress. Look for simplicity.
  *   **Verdict:** High probability of **Mimic/Mask.** The "spotless record" is often a function of the machine, not the operator.
  *   **Action:** Pass unless Step 4 proves they can operate without the Big Co safety net.

  #### Case (b): The Internal Struggler (Excellent $\rightarrow$ Quiet)
  *   **Step 1 (Reconstruction):** You have 2 years of historical data. The trait *existed*.
  *   **Step 3 (Environment):** The variable changed was the **Manager**, not the candidate. This is a classic **Mask**. The "foam" is the toxic manager suppressing the glass.
  *   **Step 5 (Values Call):** This is where you are likely wrong. You are reading "suppressed by bad management" as "character flaw."
  *   **Verdict:** **Mask.** The disposition is real (proven by 2 years data). The environment is the blocker.
  *   **Action:** Do not fire. Transfer them. If you fire them, you are punishing the mask, not the person.

  #### Case (c): The Honesty Paradox (Assessing Honesty while Assessing)
  *   **The Fink Problem:** Asking "Are you honest?" triggers the Fink. The assessment kills the honesty.
  *   **Step 2 (Friction):** Do not ask about honesty. Ask about **mistakes**. "Tell me about a bug you caused that cost money."
  *   **Step 4 (Work Sample):** **The Trap.** Plant a contradiction in the requirements. "The spec says X, but the diagram shows Y."
  *   **Sufficient Answer:** They email you *before* the deadline to ask for clarification.
  *   **Fail Signal:** They guess and ship.
  *   **Verdict:** If they hide the ambiguity to look competent, they are a **Mimic**.
  *   **Action:** This is the only step that bypasses the Fink. The interview cannot test honesty; only a situation where honesty has a cost can.

  ***

  ### Part 4: Limitations & Real Work

  **What this procedure cannot do:**
  It cannot predict how *your* behavior affects them. You might be the **Fink**. If your management style punishes bad news, even an honest hire will become a Mimic within six months. This procedure tests *them*, not *you*.

  **Which step is doing the real work:**
  **Step 4 (The Paid Stress-Test).** Interviews are inherently finkish contexts for soft skills. People perform. A paid work sample with a hidden trap is the only environment that approximates the actual stakes of the job. Steps 1–3 filter out the obvious liars; Step 4 catches the competent performers who lack the specific disposition you need.

  **Weakest link:** Step 5 (The Values Gate), because it relies on your intuition—the same instrument that just approved two consecutive failures.
