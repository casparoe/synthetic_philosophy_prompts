answer: |-
  **MEMORANDUM**

  **TO:** Technology Committee Chair & Members
  **FROM:** Parent Representative
  **DATE:** [Insert Date]
  **SUBJECT:** Recommendation on Early-Warning System Decision Engine

  **Recommendation**
  We should install **Engine B (The Rule-Based Engine)**. We should not flip a coin.

  While the vendor's test shows identical outcomes on 40 scenarios, the *method* of decision-making matters more than the immediate results. Engine B is the only choice that complies with the Board's "One-Sentence Rule," protects the district from liability, and maintains parent trust.

  Here is the breakdown of why this is the only viable choice, the argument for the other side, and the hidden trap in our contract.

  ### 1. Why Engine B Wins: The "One-Sentence" Test
  Two years ago, the Board passed a rule requiring any automated decision to be explainable in one sentence a parent can read aloud at a meeting. This rule was designed to prevent "black box" decisions where the district hides behind an algorithm.

  *   **Engine A fails this in practice.** It can generate a sentence like, *"Your child was not selected because their predicted benefit score was 72.4, and the cutoff was 75.1."* While grammatically one sentence, it is not an *explanation*. A parent will immediately ask, "Why was the score 72.4? Which factors weighed more?" The engine cannot answer that in one sentence because the score is a weighted secret of the vendor's model. It invites confrontation.
  *   **Engine B passes this in practice.** It produces sentences like, *"Your child was not selected because they had more than five unexcused absences last semester."* This is factual, verifiable, and actionable. It tells the parent exactly what rule was triggered.

  The Board's rule isn't about word count; it's about accountability. Engine A obscures accountability behind math; Engine B forces us to own the rules we write.

  ### 2. The Safety Valve (Liability)
  Engine B has a feature Engine A lacks: **It admits when it doesn't know.**

  If two rules conflict in Engine B, it kicks the case to a human. If a student is in a gray area (e.g., they meet the academic criteria but have a documented family tragedy affecting attendance), Engine B flags this for review. Engine A simply crunches the numbers and rejects the child.

  When (not if) a parent sues the district over a denied spot, we want a human to have reviewed the edge cases. Engine A automates liability; Engine B preserves human judgment for the hard cases.

  ### 3. The Best Case for Engine A (And Why It Loses)
  **The Argument for Engine A:**
  Engine A is a Utilitarian engine. Its goal is to maximize the total good. It looks at all students and asks, "Where will this tutoring spot produce the biggest grade improvement?" In a world of scarce resources, there is a strong moral argument that we should not "waste" a spot on a student who won't benefit as much as another. Engine A ensures the district gets the highest return on investment for every tax dollar spent. It is efficient and data-driven.

  **Why It Loses:**
  Efficiency is not the only value in public education. Justice and transparency matter more. Engine A treats students as data points to be optimized, not individuals with rights. Furthermore, because the vendor locks the engine for the life of the contract, we cannot adjust the "weights" if the model starts inadvertently penalizing a specific demographic. Engine A requires us to trust the vendor's definition of "gain" blindly. Engine B requires us to write our own rules, keeping the power in the district's hands.

  ### 4. What the "One-Sentence Rule" Really Rules Out
  You mentioned a feeling that the Board's rule kills more options than people realize. You are right.

  The One-Sentence Rule effectively bans **optimization algorithms** in high-stakes student decisions. You cannot explain a probability, a weighted score, or a comparative ranking in one sentence that satisfies a layperson. This rule forces the district to use **eligibility criteria** (Yes/No) rather than **ranking criteria** (Better/Worse).

  This means we cannot use technology to make "tough choices" about who deserves help most. We can only use it to verify who meets the baseline standards we set. This limits the system's efficiency, but it protects the district from accusations of arbitrary bias. We need to accept that this rule means the system will be less "smart" but more defensible.

  ### 5. Is There a Third Option?
  Yes. **Refuse to sign the contract with the "Lock-In" clause.**

  The vendor's requirement that we choose one engine for the *life of the contract* is unacceptable. Technology and student needs change. We should demand a contract that allows us to switch engines or update the decision logic annually.

  **Would I take this over Engine B?**
  Yes. If we can negotiate that flexibility, the choice between A and B becomes less critical because we can fix it later. However, if the vendor refuses to budge on the lock-in clause, **Engine B is the only safe choice.**

  **Action Item for Thursday:**
  I move we recommend Engine B, contingent on the Legal Department reviewing the "lock-in" clause. If we must sign as-is, Engine B is the only option that keeps us compliant with Board Policy and protects us from liability.

  ***

  **Summary for the Chair:**
  Flipping a coin ignores the difference between *outcome* and *process*. The outcomes are the same today; the processes are not. Engine A is a black box that violates the spirit of our transparency rule. Engine B is a white box that forces us to take responsibility for our rules. In a public school district, responsibility is more valuable than efficiency.
