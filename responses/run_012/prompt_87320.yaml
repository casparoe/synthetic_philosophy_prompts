answer: |-
  Dear Friend,

  Your notebook is a testament to a sharp eye and a restless mind, and I want to begin by assuring you that the confusion you have catalogued is not a failure on your part but a genuine feature of the world that has troubled professional biologists and philosophers for centuries. You have independently rediscovered what is known as the species problem, and your demand for a specification before accepting any more theories is precisely the right philosophical move. You are asking for the criteria of adequacy, the things any account must achieve if it is to be trusted with the weight you place on it regarding conservation, medicine, and the simple honesty of your field guide. What follows is an attempt to lay out those desiderata, to distinguish between what the world demands and what our preferences dictate, and to reveal the tensions that make a perfect theory impossible.

  The first requirement is empirical coverage, which demands that a theory must apply to the full diversity of life without exception. You noted the problem of asexual lineages and bacteria that swap genes sideways rather than passing them down parent to child. Any theory that defines a species strictly by interbreeding, however useful it is for birds, fails immediately here because the mechanism it relies on does not exist for those organisms. This requirement is non-negotiable if the theory claims to be universal. If a theory says it explains what a species is but only works for vertebrates that reproduce sexually, it is not a theory of species but a theory of vertebrate groups, and it must admit this limitation. The reason this is a genuine demand rather than a prejudice is that life itself does not respect our categorical boundaries; if the definition of a kind excludes vast swathes of the living world by definition, the definition is too narrow for the reality it attempts to describe.

  The second requirement is objectivity, which demands that the boundary between one species and another must not depend on the arbitrary decision of the observer. This addresses your worry about the ring of populations around a mountain range where neighbors breed but ends do not. If the theory allows you to draw the line anywhere you like without contradicting the facts, then the species boundary is not in the world but in your notebook. This is non-negotiable for anyone who believes species are real features of nature rather than human inventions. The reason is that science aims to describe mind-independent reality; if the existence of a species depends on where a human decides to cut the chain, then species are not natural kinds but administrative zones. However, some schools of thought argue that because evolution is a continuous process, sharp lines are impossible, and thus some arbitrariness must be tolerated. This is where the demand for objectivity clashes with the fact of gradual change.

  The third requirement is diagnostic utility, which demands that the theory must allow us to identify which kind an organism belongs to using observable traits. This speaks directly to your field guide. You mentioned cryptic species that look identical but do not interbreed, and conversely, organisms that look different but interbreed freely. A theory that defines species by a hidden process, like reproductive isolation, fails this test if you cannot tell them apart without running breeding experiments or sequencing genes. For conservation law and medicine, this is often non-negotiable because you cannot protect a lineage you cannot identify in the field, nor can you treat a pathogen you cannot distinguish from a harmless relative. However, this is sometimes treated as a mere preference by theoretical biologists who care more about the evolutionary process than the practical identification. They might argue that truth is more important than convenience, but for your purposes, a theory that cannot be applied is useless.

  The fourth requirement is evolutionary coherence, which demands that the groups identified must correspond to actual lineages or units of evolution. This addresses your concern about hybrids and fossils. If a theory groups organisms together that do not share a common history or evolutionary fate, it misrepresents the biology. For conservation, this is critical because we often aim to preserve evolutionary potential, not just static forms. This is non-negotiable for a biological theory because evolution is the central fact of biology. If a classification system cuts across lineages, it is misleading. Yet, as you noted with hybrids that become stable kinds, nature sometimes creates lineages that merge rather than branch, challenging the idea that ancestry is always a simple tree.

  Now I must address the difficult truth you suspected, which is that some subset of these requirements cannot be satisfied together. Specifically, you cannot simultaneously satisfy universal empirical coverage, strict objectivity, and practical diagnostic utility for all cases. This incompatibility is the most interesting part of your inquiry because it shows that the concept of species may be doing too much work for a single definition. If you demand universality, you must adopt a definition broad enough to include bacteria and birds, such as being a distinct lineage. But lineages are often impossible to diagnose in the field without genetic tools, failing utility. If you demand diagnostic utility, you rely on looks, which fails objectivity when cryptic species exist. If you demand strict objectivity based on reproductive isolation, you fail universality because asexual organisms exist. This impossibility shows that species might not be a single natural kind like gold or electrons, which have one underlying essence everywhere. Instead, species might be a cluster of concepts that work well in some domains and poorly in others, or that the word species is used to mean slightly different things in different contexts, which explains why nobody treats the inconsistent usage as a scandal.

  Regarding which single requirement does the most to rule out the theories people actually defend, it is the requirement of universal empirical coverage. The most popular theory among birders and mammalogists defines species by the ability to interbreed and produce fertile offspring. This theory is ruled out immediately by your observation of asexual lineages and bacteria. It is a powerful theory for your birds, but it cannot be the whole truth of life. This requirement forces theorists to either abandon the hope of a single universal definition or to adopt a much more abstract definition, such as separately evolving lineages, which is harder to apply. Thus, the demand that one definition must fit all life is the hammer that breaks most specific theories.

  Finally, you ask whether a theory is obliged to say that species are real features of the world or whether it may treat them as convenient divisions, and whether this is a requirement or a separate question. This is the question of ontology, and it is often smuggled into biological theories as if it were a biological fact. A theory is not logically obliged to say species are real; it can consistently argue that species are pragmatic tools we use to carve up continuous nature for our own convenience, much like time zones are real for scheduling but not physical features of the earth. However, for your purposes in conservation law and medicine, this is not merely a philosophical preference. If species are only convenient divisions, then protecting a species is protecting a human convention, which weakens the legal and moral force of conservation. If they are real features, then extinction is the destruction of something mind-independent. Therefore, while a biological theory can function without settling this, a theory intended to ground law and ethics must take a stand. It is a separate metaphysical question, but it cannot be ignored if the theory is to serve the ends you have in mind.

  In conclusion, the lines in your field guide correspond to real patterns in the world for birds, where reproduction and morphology often align, but they do not correspond to a single, universal metaphysical truth that holds for all life everywhere. The demand for a theory that is universal, objective, and practical is a demand for something nature does not provide. You are entitled to say two organisms are the same kind when they share a common evolutionary fate and can be reliably identified as such, but you must accept that the sharpness of that line varies across the tree of life. The theory you seek is not a single definition but a understanding of why different definitions are needed for different problems, and the honesty to admit that the boundary is sometimes in the world and sometimes in the notebook.

  Yours sincerely,

  A Student of the Problem
