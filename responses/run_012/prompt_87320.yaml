      *   **Incompatibilities:** The core tension is between *process* (what makes a species, e.g., reproductive isolation) and *pattern* (what we see, e.g., morphology/genetics), and between *universal applicability* (one definition for all life) and *local utility* (different definitions for birds vs. bacteria). The "Universal vs. Pluralist" tension. Also, the tension between "Real" (mind-independent) and "Convenient" (pragmatic).
      *   **The "Knockout" Requirement:** Probably the requirement that a single definition must apply universally to all life forms (sexual, asexual, bacteria, fossils). This rules out the Biological Species Concept (BSC) immediately for asexuals.
