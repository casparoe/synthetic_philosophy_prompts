          *   *Key Issue:* Standard Millikan-style teleosemantics relies on *natural* selection. Artifacts usually have *derived* intentionality. Does teleosemantics extend to artifacts via "design selection" or does it strictly require biological evolution? This is a nuance question. Strict Millikanians say no (or only derived content via the *users* of the artifact). Liberal teleosemantics (like Godfrey-Smith or some readings of Millikan regarding reproduction) might allow it if there's a lineage of reproduction/copying. However, the prompt says "designed from scratch... never subject to natural selection."
          *   *Standard View:* Strict teleosemantics (Millikan) typically denies *underived* content to artifacts because they lack a history of *natural* selection. They have derived content relative to the *engineers'* intentions, but the state S itself doesn't have biological proper functions in the strict sense unless we expand "selection" to include artificial selection/design lineage. The prompt asks "On the teleosemantic account..." implying the standard theory discussed in class. Usually, the distinction between biological proper function and artifact function is crucial.

