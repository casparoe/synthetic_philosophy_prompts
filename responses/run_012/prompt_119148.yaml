          *   *Claim:* So S *does* have content.
          *   *Assessment:* This is the trickiest part. Strict teleosemantics (Millikan) distinguishes between *proper functions* (biological) and *derived functions* (artifacts). Artifacts get their function from the *intentions* of the creators/users. If the theory is about *naturalizing* content, allowing design history often undermines the "naturalization" project unless one argues for a generalized selected-effects theory.
