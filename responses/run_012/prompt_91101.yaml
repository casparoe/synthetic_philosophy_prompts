prompt: |-
  I've been reading a popular evolution book (science journalist, seems careful) and I want to know how much of its spandrels chapter I should actually believe. Here's the gist, reconstructed from memory, so the wording is mine but the claims are the book's:

  'In the late 1970s Gould and Lewontin pointed out that the triangular spaces where the dome of St Mark's meets its arches — the spandrels — are a byproduct of the architecture, not something anyone designed; the glorious mosaics came later and now make the spaces look like they were the point. Biology is full of spandrels: features that exist as side effects of other features, or as leftovers from something the organism used to do. So seeing a trait tells you nothing about whether selection built it for a job. The paper's real target was adaptationism, the view that every trait is an adaptation — that organisms are basically collections of parts each optimised for some function. Gould and Lewontin showed that the adaptationist programme isn't a scientific programme at all, because whenever a proposed function for a trait gets refuted, the adaptationist just invents another one, so no evidence could ever count against it. Gould spent the rest of his career arguing that most of what looks designed in nature is really the product of constraint and byproduct, and that Darwinians had been telling just-so stories.'

  My old bio professor, when I mentioned this, said "yeah, that's the gist, the paper killed naive adaptationism," which is why I've been treating it as settled. But I'm inclined to trust the book anyway because the spandrel idea seems to be in every textbook now. I'm a linguistics person, so I can follow an argument but I don't know the field's internal politics.

  What I want: a claim-by-claim audit. Which bits would an evolutionary biologist or a philosopher of biology nod along to, which would they wince at as a simplification, and which are just not what the paper says or shows? I'd especially like to know whether the conclusion the book draws — that adaptationism is dead as science — follows from any of the parts that are right, or whether the book has quietly swapped a modest methodological complaint for a big empirical one. Two smaller things while you're at it: the book uses "spandrel" and "exaptation" as if they're the same thing, and someone in my reading group insists the bits of San Marco Gould is talking about are technically pendentives, not spandrels, and that this sinks the analogy — is either of those right, and does it matter? And the book elsewhere says selection is the only known source of adaptive complexity, which seems to sit oddly next to the spandrel stuff; is that a real tension or just my confusion? Finish by rewriting the paragraph so it says what a careful person could actually defend.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

