answer: |-
  This is an excellent question. You have correctly identified that popular science books often solidify nuanced academic debates into "settled" narratives. Your professor was half-right: the paper did kill *naive* adaptationism, but the book's claim that it rendered adaptationism "unscientific" is a significant overreach.

  Here is a claim-by-claim audit of your reconstructed summary, followed by answers to your specific side questions and the requested rewrite.

  ### Claim-by-Claim Audit

  **1. 'In the late 1970s Gould and Lewontin pointed out that the triangular spaces where the dome of St Mark's meets its arches — the spandrels — are a byproduct of the architecture, not something anyone designed...'**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This is the core analogy. The architectural constraint (you need a way to put a round dome on a square base) creates the space. The space is not the *goal*; it is the *consequence*. Biologists accept this analogy as a valid illustration of structural constraint.

  **2. '...the glorious mosaics came later and now make the spaces look like they were the point.'**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This illustrates the error of inferring function from current utility. Just because something *is* useful now (or looks beautiful) doesn't mean it was *selected for* that purpose originally.

  **3. 'Biology is full of spandrels: features that exist as side effects of other features, or as leftovers from something the organism used to do.'**
  *   **Verdict:** **Conflated.**
  *   **Nuance:** "Side effects of other features" is the correct definition of a spandrel (e.g., the redness of blood is a chemical byproduct of oxygen transport, not selected for signaling). "Leftovers from something the organism used to do" describes **vestigial traits** (e.g., whale pelvises) or **exaptations** (traits co-opted for new uses). Lumping these together is common in pop science but technically distinct in biology.

  **4. 'So seeing a trait tells you nothing about whether selection built it for a job.'**
  *   **Verdict:** **Overstated.**
  *   **Nuance:** A careful biologist would say: "Seeing a trait tells you *nothing definitive* without further evidence." The book's phrasing suggests we can never know, whereas the field says we *can* know, but we have to test it rather than assume it.

  **5. 'The paper's real target was adaptationism, the view that every trait is an adaptation — that organisms are basically collections of parts each optimised for some function.'**
  *   **Verdict:** **Accurate.**
  *   **Nuance:** This is a fair summary of the "Panglossian Paradigm" G&L attacked. They targeted the assumption of optimality, not the mechanism of natural selection itself.

  **6. '...Gould and Lewontin showed that the adaptationist programme isn't a scientific programme at all, because whenever a proposed function for a trait gets refuted, the adaptationist just invents another one, so no evidence could ever count against it.'**
  *   **Verdict:** **Contested / Philosophical Overreach.**
  *   **Nuance:** G&L argued that adaptationism *risks* becoming untestable (a "just-so story"). They did not prove it *is* inherently unscientific. Most philosophers of biology today argue that adaptationist hypotheses are scientific *if* they generate testable predictions (e.g., about genetics, development, or comparative history). The book presents a methodological warning as a logical proof.

  **7. 'Gould spent the rest of his career arguing that most of what looks designed in nature is really the product of constraint and byproduct...'**
  *   **Verdict:** **Empirically Disputed.**
  *   **Nuance:** Gould certainly argued this, but "most" is the fighting word. Many evolutionary biologists (e.g., Dawkins, Dennett, Pinker) argue that while spandrels exist, the bulk of complex functional machinery *is* the result of selection. This remains an empirical debate, not a settled fact.

  **8. '...and that Darwinians had been telling just-so stories.'**
  *   **Verdict:** **Accurate to the Rhetoric.**
  *   **Nuance:** "Just-so stories" is the famous phrase from the paper. It is a fair representation of their critique, though "Darwinians" is a broad brush; they were targeting specific practitioners of sociobiology and optimality modeling.

  ---

  ### The "Adaptationism is Dead" Question

  **Does the conclusion follow?**
  No. The book has swapped a **methodological complaint** for an **empirical claim**.

  *   **Methodological Complaint (Valid):** "Do not assume a trait is an adaptation without testing alternative hypotheses (drift, constraint, byproduct)."
  *   **Empirical Claim (Unsupported):** "Therefore, adaptationism is not science, and most traits are not adaptations."

  Evolutionary biology did not abandon adaptationism; it regulated it. Today, an adaptationist hypothesis is the standard *null hypothesis* or starting point, but it must survive rigorous testing (phylogenetic comparison, genetic analysis, fossil records). If the book claims adaptationism is "dead as science," it is wrong. It is alive but humbled.

  ---

  ### The Two Smaller Things

  **1. Spandrel vs. Exaptation**
  *   **Are they the same?** No.
  *   **Spandrel:** A non-adaptive byproduct. It was never selected for. (Example: The hum of a refrigerator is a byproduct of the motor; it wasn't designed to make noise).
  *   **Exaptation:** A trait that is currently useful but was not originally selected for that use. This can include spandrels that get co-opted later. (Example: Feathers likely evolved for insulation [adaptation], then were co-opted for flight [exaptation]).
  *   **Does the book's conflation matter?** Yes, slightly. It blurs the line between "useless noise" and "repurposed tools." However, Gould and Vrba coined "exaptation" in a 1982 paper, three years *after* the Spandrels paper. The book is retroactively merging the concepts, which is common but imprecise.

  **2. Spandrels vs. Pendentives**
  *   **The Objection:** Architects note that the triangular curves supporting St. Mark's dome are technically **pendentives**. A **spandrel** is technically the space between two arches.
  *   **Does it sink the analogy?** No. This is a favorite objection of architects, but biologists generally ignore it. G&L were aware of the distinction (they addressed it in later writings). The analogy relies on the concept of "structural byproduct," not the specific architectural taxonomy. Unless you think biological constraints depend on Venetian masonry terminology, the biological argument stands regardless of the noun used.

  **3. Selection vs. Spandrels Tension**
  *   **The Tension:** "Selection is the only known source of adaptive complexity" vs. "Many traits are spandrels."
  *   **Resolution:** There is no tension.
      *   **Selection** builds complex *adaptation* (things that look designed for a purpose).
      *   **Spandrels** are things that look designed but *aren't* (or weren't originally).
      *   If a spandrel becomes useful later, **selection** then acts on it.
      *   The statement "Selection is the only source of adaptive complexity" remains true. Spandrels are, by definition, *not* adaptive complexity until selection gets hold of them. The book is consistent here; you are right to spot the tension, but it resolves once you distinguish between "origin" and "maintenance."

  ---

  ### The Rewrite

  Here is a version of the paragraph that a careful evolutionary biologist or philosopher of biology would defend:

  > 'In 1979, Gould and Lewontin used the architecture of St Mark's Basilica to challenge a prevailing tendency in evolutionary biology. They noted that the triangular spaces supporting the dome (which they called spandrels) are structural necessities, not designed features; the mosaics filling them were added later, creating the illusion that the spaces were made for the art. They argued biology contains similar "spandrels": traits that arise as unavoidable byproducts of development or physical constraint, rather than direct products of natural selection. Their target was "naive adaptationism"—the assumption that every trait is an optimal solution to a specific problem. Gould and Lewontin warned that without rigorous testing, adaptationist explanations risk becoming unfalsifiable "just-so stories," where functions are invented to fit the trait rather than evidenced. While this critique successfully established that not all traits are adaptations, and that constraints play a major role in evolution, it did not disprove natural selection. Instead, it transformed adaptationism from a default assumption into a hypothesis that requires empirical validation.'
