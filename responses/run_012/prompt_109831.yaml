answer: |-
  **MEMORANDUM**

  **TO:** Naming and Public Art Board
  **FROM:** [Your Name], Board Member
  **DATE:** Wednesday, [Date]
  **RE:** Recommendation Regarding Coles Avenue Designation

  **Recommendation**
  I recommend that the Board **retain the name "Coles Avenue"** but condition this retention on two specific actions:
  1.  The installation of a permanent, high-visibility interpretive marker at the neighborhood entrance detailing Ephraim Coles' engineering contributions alongside his documented racial and class prejudices.
  2.  The allocation of **$90,000** from the Public Art Fund to endow the Coles Avenue Neighborhood Archive, with the remaining **$50,000** allocated to the design and fabrication of the marker.

  Simultaneously, I propose we initiate a separate process to identify a suitable public site (a park, community center, or school) to be named after the local settlement house founder proposed by the statewide campaign, honoring her legacy without imposing the material costs of a street renaming on current residents.

  **Timeline**
  *   **Thursday Vote:** Board adoption of recommendation.
  *   **Month 1-3:** Formation of a design committee for the marker (must include Block Association reps).
  *   **Month 4:** Release of Archive funds to the Block Association (contingent on their administrative setup).
  *   **Month 12:** Installation of marker and launch of Archive.

  **Reasoning**
  We are weighing three competing claims: the historical record of Ephraim Coles, the moral demands of the statewide campaign, and the material reality of the Block Association.

  **1. The Residents' Material Reality Trumps Symbolic Cleanup**
  The Block Association's opposition is not ideological; it is logistical. For a majority-Black neighborhood with multigenerational roots, a name change triggers a cascade of bureaucratic friction: deed updates, insurance policies, driver's licenses, and business licensing. The Campaign views the street name as a symbol; the residents view it as an address. When outsiders advocate for symbolic justice that imposes administrative burdens on the very community they aim to support, they risk treating the neighborhood as a canvas for their own moral signaling rather than a home for its people. Funding the Archive respects the residents' agency—they want to tell their own history, not have a name imposed upon them.

  **2. The "Bleached" Name and the Function of Infrastructure**
  A linguist colleague reminded me that after 130 years, a street name often "bleaches" into a pure coordinate. When residents say "I live on Coles," they are not reciting a eulogy for Ephraim Coles; they are providing geolocation. The harm of the name is not in its daily usage, but in its uncritical honorific status. A robust interpretive marker disrupts the uncritical honor without disrupting the utility of the address. It transforms the street from a shrine into a historical text.

  **3. Gratitude vs. Admiration**
  We often conflate naming with canonization. As a philosopher colleague noted, gratitude tracks benefit received; admiration tracks character. We can acknowledge that Coles built the water system that still serves a third of this city (gratitude/benefit) while explicitly condemning his advocacy for withholding relief from the poor and his racist views (admiration/character). The marker allows us to hold both truths: the infrastructure remains, the ideology is rejected.

  **Engaging the Opposition**

  **To the Statewide Campaign:**
  You argue that a marker is a "plaque on a wound." Usually, you are right. Cities often use markers to avoid doing the hard work of change. I acknowledge that risk. However, a marker becomes cowardly only when it is the *only* action taken. Here, the marker is paired with a $90,000 transfer of resources directly to the neighborhood. If we rename the street, we spend $140,000 on signs and administrative transition. If we follow my recommendation, we spend $140,000 on history-telling and community archiving. The latter builds power; the former builds signage.
  Furthermore, erasing Coles does not automatically elevate the settlement house founder you champion. By advocating for her to have a park or building named in her honor, we give her legacy a dedicated space rather than making her a footnote in a bureaucratic address change.

  **To the Block Association:**
  You have argued that outsiders are spending your neighborhood's symbolic capital to buy a feeling. I hear you. This recommendation attempts to return that capital to you. The Archive ensures that the history of the street is defined by the people who live there now, not the engineer who laid the pipes in 1880 or the activists lobbying from outside the zip code. However, I ask you to consider that the marker is not just for the outsiders; it is for your children and grandchildren, so they understand the full complexity of the ground they walk on without having to dig for it.

  **Where I Might Be Wrong (Betting Against Myself)**
  1.  **The "Bleaching" Theory:** I am betting that the name is functionally neutral. I could be wrong. It is possible that for Black residents, driving under a sign bearing the name of a man who argued they were "a different kind of people" causes a daily, low-level psychic harm that a marker cannot soothe. If the Block Association signals that this is the case, my recommendation fails.
  2.  **The Archive as White Elephant:** I am betting the Archive will be used and valued. It is possible that $90,000 is spent on a resource that sits underutilized, whereas the renaming would have been a definitive, permanent statement.
  3.  **The Marker as Ignored:** I am betting people will read the marker. Most people drive past them. If the marker becomes invisible background noise, we have kept the name without the contextualization that justifies keeping it.

  **What Would Change My Mind**
  1.  **Resident Reversal:** If the Block Association votes to support the renaming, I will immediately withdraw this recommendation. Their material burden is the primary ethical constraint; if they decide the symbolic victory is worth the administrative hassle, I defer to them.
  2.  **Direct Causality:** If new historical evidence emerges showing Coles specifically targeted the East Side with discriminatory infrastructure planning (e.g., deliberately undersizing mains for this specific ward), the "gratitude for infrastructure" argument collapses. Currently, the record shows general racism, but functional infrastructure. Specific malice against *this* neighborhood would require a rename.

  **Conclusion**
  We have $260,000. We can spend more than half of it to change signs and confuse mail carriers, or we can spend it to tell the truth about our history and fund the preservation of the community that actually lives here. I choose the community.

  I move we adopt this recommendation for Thursday's vote.
