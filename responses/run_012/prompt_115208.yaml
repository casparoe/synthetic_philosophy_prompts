answer: |-
  Sixteen students will be split by lot into a decision-making assembly and an observing public, tasked with estimating a hidden factual value to unlock a class benefit, first through consensus deliberation and then through statistical aggregation.

  ### Design and Staging

  **Total Time:** 90 Minutes
  **Materials:** Whiteboard, one sealed envelope, 32 index cards, a pen.
  **The Stake:** If the activity produces a "successful" result (defined below), the seminar ends 15 minutes early. If not, the class runs the full term.
  **The Truth:** Before class, count the exact number of words in the course syllabus. Write this number on a slip of paper and place it inside the sealed envelope. (e.g., 1,450 words).

  **0:00–0:10 | Setup and Draw**
  1.  Write on the whiteboard: **"TASK: Estimate the word count of the course syllabus. WIN CONDITION: Within 10% of actual value."**
  2.  Do not open the envelope yet.
  3.  Draw 8 names by lot (e.g., pull numbered slips from a hat). These students are **Assembly A**. The remaining 8 are **Public A**.
  4.  Hand the sealed envelope to Assembly A. Hand each student in Public A a "Legitimacy Audit" index card.

  **0:10–0:35 | Run 1: The Deliberative Assembly**
  1.  **Briefing Control (Point 1):** Assembly A opens the envelope. Inside is the True Value (hidden) and a **Briefing Note** written by you: *"Administrative standards suggest course syllabi typically range between 2,000 and 2,500 words. Use this baseline for your estimate."* (This is a false anchor).
  2.  **Private Phase:** Assembly A members write their *private* initial estimate on an index card (face down).
  3.  **Deliberation:** Assembly A discusses the brief and their estimates for 15 minutes to reach a **single consensus number**. They must agree unanimously.
  4.  **Public Role:** Public A watches silently. On their Audit card, they must answer: "Did the Assembly seem to choose their own question?" and "Did the Assembly seem confident?"
  5.  **Submission:** Assembly A submits the consensus number. Collect Private cards.

  **0:35–0:55 | Run 2: The Aggregated Assembly**
  1.  **Swap:** Assembly A joins the Public. Public A becomes **Assembly B**.
  2.  **Rule Change (Point 2):** Hand Assembly B a *new* envelope with the same Briefing Note and True Value.
  3.  **Instruction:** "You have the same task and brief. However, **no talking is allowed.** Write your private estimate. I will average them mathematically."
  4.  **Execution:** Assembly B writes estimates independently (5 mins). You calculate the average on the whiteboard.
  5.  **Submission:** Submit the calculated average.

  **0:55–1:15 | The Reveal and Stakes**
  1.  Open the envelope and reveal the True Value.
  2.  Check Win Condition (within 10%).
  3.  Announce whether the class earns the 15-minute early finish. (Note: Run 2 is statistically likely to be more accurate, securing the stake, which empirically demonstrates Point 2).

  **1:15–1:35 | Debrief (20 Minutes)**
  *Do not lecture. Map their experience to the theory.*

  1.  **Map Point 2 (Independence vs. Deliberation):**
      *   Ask Assembly A: "Did your confidence go up or down during discussion?" (Likely up).
      *   Compare Accuracy: Show the spread of Private Cards from Run 1 vs. the Consensus. Show the spread of Run 2 vs. the Average.
      *   *Facilitator Note:* Highlight that Run 1 likely converged around the false anchor (2,000+), while Run 2's average likely cancelled out errors. Deliberation created agreement and confidence, but destroyed the independent error-cancellation that makes random samples epistemically powerful.

  2.  **Map Point 1 (Agenda Control):**
      *   Ask Public A (now Assembly B): "Who wrote the Briefing Note?" (You did).
      *   Ask Assembly A: "Could you have changed the question to 'How many pages' instead of 'words'?" (No).
      *   *Facilitator Note:* The lot randomized *who* decided, but not *what* was decided. The legitimacy of the random selection laundered your power as the question-setter. They felt bound by a brief they didn't write.

  3.  **The Expertise Carve-out (Facilitator Raise):**
      *   Ask: "I set the question and held the true value. Should I have been entered into the lottery?"
      *   This forces the room to confront whether administrative expertise (holding the syllabus file) disqualifies one from sortition, implying that some roles must remain elected or appointed.

  **1:35–1:45 | Limitations and Close**
  *   **Scale:** Acknowledge that 16 people deliberating for 20 minutes is not a nation legislating for years.
  *   **Bindingness:** The stake was class time, not law. In reality, losers of a lottery decision cannot simply walk away; they must obey.
  *   **Acceptance:** Ask the "losing" side of Run 1 (those who guessed differently than the consensus): "Would you have accepted the consensus if it cost you a grade?"
  *   Dismiss class (early if they won).

  ### Predictable Failures and Mitigations

  **1. The Disengaged Public**
  *   **Failure:** Students not selected in Run 1 will check phones or tune out, treating it as a break.
  *   **Mitigation:** The "Legitimacy Audit" card is mandatory for participation credit. They cannot just watch; they must judge. Collect these cards at the end. If they fail to fill it out, they forfeit the stake for themselves (peer pressure will enforce this).

  **2. The Early Skeptic**
  *   **Failure:** One student in Assembly A will read the Briefing Note, realize the anchor is false, and say, "This is rigged. The professor is manipulating us." This can poison the well and turn the activity into a meta-argument about you rather than the system.
  *   **Mitigation:** Pre-empt this in the rules. "You must decide based *only* on the information in the envelope. If you believe the information is flawed, note that on your private card, but you must still produce a consensus number." This forces them to experience the powerlessness of Point 1 rather than debating it away.

  ### What This Activity Cannot Reproduce

  *   **Scale and Duration:** Real citizens' assemblies meet for months with expert witnesses. This 20-minute deliberation cannot show how lottocracy handles complex technical legislation over time.
  *   **Bindingness:** The students know you are not actually going to punish them if they fail. In a real polity, the "losing" side of a sortition decision must comply with laws they disagree with. This activity cannot simulate the coercive power of the state or whether losers accept the outcome.
  *   **Social Power:** In this room, all students are roughly equal. In reality, random selection does not neutralize social hierarchy; a wealthy student may still dominate deliberation over a working-class student. The lottery equalizes entry, not influence.
