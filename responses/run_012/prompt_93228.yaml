answer: |-
  Here is a joke that should land well with your group. It's short, visual, and the punchline relies entirely on the brute/option luck distinction and the "abandonment objection" (the critique that the view can be unreasonably harsh on those who take risks).

  **The Joke**

  > A luck egalitarian walks past a man whose house is burning down.
  >
  > "Lightning strike?" he asks.
  >
  > "No," says the man. "I was smoking in bed."
  >
  > "Did you know the risk?"
  >
  > "Yes, but I was freezing."
  >
  > The egalitarian nods, hands him a blanket, and says, "Here's compensation for the cold. That was brute luck. But the fire is option luck. You have to put that out yourself."

  ***

  **Why this works for your group:**
  1.  **The Mechanism:** It dramatizes the exact sorting process the theory requires (separating the *cause* of the need from the *circumstance* of the need).
  2.  **The Objection:** It hints at the "chaining" problem (the poverty caused the risk) without getting bogged down in it, while highlighting the perceived coldness of letting someone suffer for a "choice" made under duress.
  3.  **The Delivery:** It's short enough to tell in under 30 seconds, and the image of someone accepting a blanket while their house burns is visually absurd enough to get the laugh.
