      *   **Topic:** Interview with a philosopher defending "asymmetric debunking."
      *   **Core Thesis:** Evolutionary explanations undermine moral beliefs claiming to track stance-independent facts (tracking) but not those understood as commitments within a practice of mutual justifiability (constituting).
      *   **Key Distinctions:** Tracking vs. Constituting (not Realism vs. Anti-realism); Selection for cooperative dispositions (pressures content) vs. Selection for normative stance capacity (pressures medium).
      *   **Claim:** Debunking is about the etiology of representational purport, not truth.
      *   **Task:** Draft 8-10 interview questions.
