      *   *Asymmetric Debunking:* Evolution debunks realism (tracking) but not constructivism/pragmatism (constituting).
      *   *Tracking:* Belief aims at independent fact. Evolution explains belief without fact -> debunked.
      *   *Constituting:* Belief aims at commitment within practice. Evolution explains capacity/practice -> not debunked (maybe even vindicated?).
      *   *Evolutionary Stories:*
          1.  Selection for cooperative dispositions -> shapes *content* (what we think is right).
