      *Drafting Q1 (The Opener):*
      "You argue that evolutionary genealogy undermines the warrant for tracking beliefs but leaves constituting beliefs intact. But if the causal mechanism producing the belief is identical in both cases—namely, natural selection favoring survival-enhancing illusions or commitments—what intrinsic feature of the belief itself changes its epistemic vulnerability? Is it merely the philosopher's description of the belief, or something about the belief's actual functional role?"

      *Drafting Q2 (Evolution & Constituting - Required):*
      "You claim evolutionary pressures shape the content of cooperative dispositions but don't debunk constituting beliefs. However, if my belief that 'we ought to keep promises' is causally shaped by selection for cooperation, doesn't that etiology explain the belief fully without needing the truth of the commitment? Why does the causal origin matter less when the belief is framed as constitutive?"
      *Likely Answer:* She'll say constitutive beliefs aren't truth-apt in the same way, or their warrant comes from within the practice, not external correspondence.
      *Follow-up:* "If warrant comes from within the practice, doesn't that make the practice itself subject to evolutionary explanation? If the practice of mutual justifiability exists *because* it enhanced fitness, isn't the authority of that practice also genealogically undermined, regardless of whether you call it tracking or constituting?"

      *Drafting Q3 (Tracking/Constituting Distinction - Required):*
      "To distinguish tracking from constituting, you must identify which beliefs purport to represent independent facts. But doesn't making that identification require you to already know which normative facts are stance-independent? Aren't you relying on the very normative realism you claim is debunked to draw the line between the two categories?"
      *Likely Answer:* She'll say it's about the subject's intention or the functional role, not the metaphysical status.
      *Follow-up:* "But if the subject's intention is itself a product of evolutionary pressure to *appear* to track objective facts for social coordination, how can you trust the phenomenology of 'tracking' as a reliable marker? Isn't the feeling of objectivity just another adaptive illusion selected for alongside the cooperative disposition?"

      *Drafting Q4 (Two Evolutionary Stories - Required):*
      "You separate selection for cooperative dispositions from selection for the capacity to adopt a normative stance. But isn't the capacity for a normative stance a prerequisite for having cooperative dispositions of the moral kind? How can selection pressure the content of cooperation without simultaneously pressuring the medium of normative thought, thereby blurring your distinction?"
      *Likely Answer:* She'll argue capacity is general, content is specific.
      *Follow-up:* "If the capacity is general, why does it yield specific moral contents that align with fitness? If the capacity is neutral, why isn't the content arbitrary? If the content isn't arbitrary because it's selected, then the medium is contaminated by the same pressures you say only affect the content."

      *Drafting Q5 (Borderline Cases - Required):*
      "Consider beliefs about fairness in one-off bargaining or cruelty to animals where reciprocity is impossible. These seem to lack the mutual justifiability practice yet feel objective. Do these track or constitute? If they constitute, what practice are they constituting? If they track, are they debunked?"
      *Likely Answer:* She'll try to fit them into a broadened practice or admit they are debunked.
      *Follow-up:* "If you admit they are debunked, you concede that significant portions of our moral life are epistemically bankrupt. If you fit them into a practice, aren't you stretching 'mutual justifiability' so thin it loses its explanatory power? Which horn do you choose?"

      *Drafting Q6 (The Nature of Warrant):*
      "You say debunking arguments are about the etiology of representational purport. But if a belief functions successfully within a practice of mutual justifiability, doesn't that success imply a kind of tracking of social facts? Why isn't successful constitution a form of tracking?"

      *Drafting Q7 (The Role of Truth):*
      "If constituting beliefs aren't tracking facts, are they truth-apt? If not, how do they guide action differently than mere preferences? If yes, what makes them true if not correspondence to some state of affairs?"

      *Drafting Q8 (Normative Force):*
      "Does asymmetric debunking drain the normative force from moral claims? If I know my belief is merely constitutive of a practice selected for fitness, why should I feel bound by it when fitness conflicts with morality?"

      *Drafting Q9 (Falsification - Required):*
      "What empirical or conceptual discovery would count against asymmetric debunking? Would finding a gene for specific moral judgments undermine the constitutive side, or is the view immune to empirical refutation?"

