              3.  Whether the two evolutionary stories can be kept apart (cooperative dispositions vs. normative stance).
              4.  Borderline cases (fairness in noncooperative bargaining, cruelty to animals).
          *   For these four specific questions, include a follow-up keyed to the likely answer, progressively harder to deflect.
          *   End with a question about what would count against the view (falsification conditions).
          *   Start with the single most important question.
          *   No preamble, no restating the request, no citations/reading lists.

