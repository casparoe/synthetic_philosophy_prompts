answer: |-
  If evolutionary pressures explain why we have the moral beliefs we do regardless of their truth, what specific feature of a "constituting" belief protects it from the same skeptical force that undermines a "tracking" belief, given that both are produced by the same cognitive machinery shaped by the same selective history?

  1. You distinguish between selection for cooperative dispositions, which pressures content, and selection for the capacity to adopt a normative stance, which pressures only the medium. How can these two evolutionary stories be kept empirically apart when the capacity for a normative stance seems to be a prerequisite for having cooperative dispositions of the moral kind?
     *Follow-up:* If you argue the capacity is general while the content is specific, why does the content reliably align with fitness-enhancing cooperation rather than being arbitrary? If the content isn't arbitrary because it is selected, doesn't that mean the medium is contaminated by the same pressures you claim only affect the content?

  2. You claim evolutionary genealogy does not undermine constituting moral beliefs, yet these beliefs are also causally shaped by evolutionary pressures. Why does the causal origin matter less when the belief is framed as constitutive of a practice rather than representative of a fact?
     *Follow-up:* If warrant comes from within the practice, doesn't that make the practice itself subject to evolutionary explanation? If the practice of mutual justifiability exists *because* it enhanced fitness, isn't the authority of that practice also genealogically undermined, regardless of whether you call it tracking or constituting?

  3. What happens to moral beliefs that seem to straddle the line, such as beliefs about fairness in noncooperative bargaining or about the wrongness of cruelty to animals where reciprocity is impossible? Do these track or constitute, and if they constitute, what practice are they constituting?
     *Follow-up:* If you admit they are debunked, you concede that significant portions of our moral life are epistemically bankrupt. If you fit them into a practice, aren't you stretching "mutual justifiability" so thin it loses its explanatory power? Which horn do you choose?

  4. To distinguish tracking from constituting, you must identify which beliefs purport to represent independent facts. Doesn't making that identification require you to already know which normative facts are stance-independent, thereby relying on the very normative realism you claim is debunked to draw the line between the two categories?
     *Follow-up:* If you reply that it's about the subject's intention rather than metaphysical status, how can you trust the phenomenology of "tracking" as a reliable marker? Isn't the feeling of objectivity just another adaptive illusion selected for alongside the cooperative disposition to ensure social coordination?

  5. You argue that debunking arguments are about the etiology of representational purport, not the truth of moral claims. But if a belief functions successfully within a practice of mutual justifiability, doesn't that success imply a kind of tracking of social facts? Why isn't successful constitution a form of tracking?
     *Follow-up:* If you deny this, you risk making moral truth entirely inert. If you accept it, you blur the asymmetry you rely on. How do you maintain the distinction without rendering constitutive truth either too weak to guide action or too strong to escape debunking?

  6. If constituting beliefs aren't tracking facts, are they truth-apt? If not, how do they guide action differently than mere preferences? If yes, what makes them true if not correspondence to some state of affairs?
     *Follow-up:* If you say they are true relative to the practice, doesn't that invite the objection that the practice itself is arbitrary from a cosmic perspective? How do you answer the "so what?" challenge without smuggling in stance-independent value?

  7. Does asymmetric debunking drain the normative force from moral claims? If I know my belief is merely constitutive of a practice selected for fitness, why should I feel bound by it when fitness conflicts with morality?
     *Follow-up:* If you say the binding force comes from within the practice, doesn't that mean a sociopath who opts out of the practice is immune to moral criticism? How do you condemn those who reject the practice without appealing to external facts?

  8. You insist the relevant divide is not realism versus anti-realism but tracking versus constituting. But isn't this merely a verbal shift that leaves the metaphysical commitments of realism intact while trying to dodge the epistemic bullet?
     *Follow-up:* If the constitutive facts supervene on natural facts, doesn't the evolutionary explanation of those natural facts still explain away the constitutive facts? How do you block the supervenience argument from reintroducing the debunking threat?

  9. What role does rational reflection play in your view? If evolution shapes our starting intuitions, can reflection ever liberate us from evolutionary pressures, or is reflection itself just another evolved tool for social coordination?
     *Follow-up:* If reflection is also evolved, why trust its conclusions about the tracking/constituting distinction? Doesn't this lead to a global skepticism that swallows your asymmetric solution whole?

  10. What empirical or conceptual discovery would count against asymmetric debunking? Would finding a gene for specific moral judgments undermine the constitutive side, or is the view immune to empirical refutation?
      *Follow-up:* If the view is immune to empirical refutation because it can always reclassify beliefs as constitutive, doesn't that make it a unfalsifiable metaphysical stance rather than a response to scientific genealogy? How do you demonstrate that this is a substantive philosophical claim?
