      *   The argument assumes Ought(A) requires Can(B). That's the flaw.

      *Wait, one more check:* If I tell them to reject the inference from 5 to 7, that's valid. But I need to explain *why* it's invalid. It's invalid because the obligation is not defined as "solve the NP-complete problem."
      *   So, the ambiguity is in the **specification of the moral demand**.
      *   Let's guide them to refine Premise (2) or the hidden premise linking (2) to the Ought.

      *Okay, let's look at the "If I have to give up (1)" part of the prompt.*
