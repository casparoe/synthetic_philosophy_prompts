answer: |-
  Conceptually, you are right to feel that the language of "having" a quality is breaking down. Resilience under fire isn't a stone someone carries in their pocket; it's a capacity that emerges from the relationship between a person and their specific environment. Psychologists call this interactionism: behavior is never just person or just situation, it's always both. When Dana says the drill "reveals what's already there," she is treating resilience like a fixed trait, but your experience shows it acts more like a signal that gets static depending on the receiver.

  This means the Marcus case and the walk-off case are actually the same puzzle, though they look like opposites. Both are failures of the test's validity, not necessarily failures of the candidates. Marcus failed the *meta-test* (the anxiety of being evaluated), which blocked his actual skill. The walk-off candidate passed the meta-test (she knew it was a drill and played the part) but failed the *actual test* (real consequence). Dana treats them as different because one looked bad and one looked good, but functionally, the drill failed to predict real-world performance in both instances. It measured "comfort with Dana's brother's acting" and "comfort with being observed," not "comfort with angry customers."

  To answer your harder question: No, from behavior alone you can never definitively tell whether a quality is missing, present but blocked, or wrecked by the test. You are inferring an internal state from an external sample, and the sample is always contaminated by the context of the collection. So what is a person supposed to do about hiring anyway? You stop trying to select for perfection and start hiring for *repairability*. You cannot know for sure who will stay calm, but you can observe who takes responsibility for a rupture and who tries to fix it. Shift your focus from finding people who don't crack to finding people who know how to glue themselves back together.

  Practically, the current exercise is measuring performance anxiety more than conflict resolution. The presence of Dana's brother—a stranger playing a role—creates an artificial stage that rewards acting skills and penalizes genuine humility (like Marcus's over-apologizing). You should rework this into a collaborative problem-solving scenario rather than a stress test. Instead of having the brother yell, have him present a complex, frustrating logistical error that requires the candidate to navigate a solution while the brother remains upset but not abusive. This tests de-escalation without triggering pure fight-or-flight.

  Regarding the secret shopper during the paid trial: drop the secrecy. If you are paying them, they are part of the team, and setting traps erodes the trust required for a manager to lead. It is salvageable only if you convert it into a known variable. Tell the candidate during the trial shift: "At some point today, a staff member will present a difficult scenario so we can see how you handle it in real time." This removes the "gotcha" element while preserving the data point of real-world reaction. However, the best data will always come from real customers. If you must choose between a polished simulation and a messy real shift, weight the real shift heavier, even if it means occasionally apologizing to a customer for a trainee's learning curve. That cost is cheaper than a manager who quits when things get real.

  Verdict: rework — because the current drill measures performance anxiety rather than resilience, and deception during paid trials corrodes the trust required for management.
