answer: |-
  This is a sophisticated demarcation problem. You are asking me to reverse-engineer your advisor's epistemology based on a dataset of his past rulings, then apply that model to two boundary cases. Below is an analysis of the rules governing his verdicts, the predictions those rules generate, my best guess at his actual reaction, the decisive test case, and the philosophical mapping of his stance.

  ### 1. The Rules Running in the Background

  Based on the log you provided, three competing rules (or clusters of criteria) explain his verdicts. They overlap but diverge on your new cases.

  **Rule A: The Structural/Methodological Rule (Lakatosian)**
  *   **Definition:** Pseudoarchaeology is defined by the structure of the argument, specifically its relationship to evidence and refutation. Legitimate science makes risky predictions and accepts falsification (Alvarez, Solutrean, Pre-Clovis). Pseudoarchaeology is "immortal," immune to counter-evidence, or relies on unfalsifiable narratives (Atlantis, Ancient Astronauts, Velikovsky).
  *   **Key Indicator:** Does the author specify what would prove them wrong? Do they engage with counter-evidence?
  *   **Support from Record:** He distinguishes Solutrean (risky predictions, killed by DNA) from Atlantis (unkillable). He accepts Wegener and Monte Verde despite initial rejection because they were empirically robust. He distinguishes the Shroud *object* (real) from the *claim* (crank).

  **Rule B: The Sociological/Status Rule (Mertonian)**
  *   **Definition:** Pseudoarchaeology is defined by the social position of the claimant and their adherence to community norms. Legitimate science comes from trained insiders who publish through peer review. Pseudoarchaeology comes from outsiders, amateurs, or those bypassing gatekeeping (Fomenko, Runestone, Plaque author).
  *   **Key Indicator:** Credentials, publication venue, and adherence to disciplinary hierarchy.
  *   **Support from Record:** He dismisses Fomenko partly because chronology is "not his field." He treats the Runestone as fraud (a breach of trust). He once misidentified a colleague's paper as pseudo, which suggests he *tries* to avoid this rule but sometimes defaults to it (or overcorrects).

  **Rule C: The Motivational/Rhetorical Rule (Psychological)**
  *   **Definition:** Pseudoarchaeology is defined by the underlying motivation and rhetorical strategy. Legitimate science seeks explanation; pseudoarchaeology seeks validation of a preconceived narrative or attacks the motives of critics (Conspiracy).
  *   **Key Indicator:** Does the author accuse the field of suppression? Is the argument driven by a grand narrative (catastrophe, lost civilization) rather than data?
  *   **Support from Record:** He allows Sphinx erosion for students (pedagogical) despite it being "badly motivated." He rejects the Shroud *authenticity* claim (narrative-driven) but not the object. He notes the Professor's claim about "careers invested" (conspiracy rhetoric).

  ### 2. Predictions and Divergence

  Here is how each rule evaluates your two new cases. This is where the rules come apart.

  | Case | Rule A (Structure) | Rule B (Status) | Rule C (Motivation) |
  | :--- | :--- | :--- | :--- |
  | **1. The Plaques** | **Legitimate/Borderline.** The author specifies refutation conditions, predicts co-occurrence structures, and uses statistical distribution. This mimics the Solutrean/Alvarez model of risky prediction. | **Pseudo.** Retired engineer, no archaeology pubs, rejected by journals, accuses field of gatekeeping. Fits the Fomenko/Atlantis outsider profile. | **Mixed.** Accuses field of "catalogue citing itself" (procedural critique) but also "gatekeeping" (rhetorical defense). |
  | **2. The Professor** | **Pseudo.** Resting on single contested data points; ignores rebuttals (fails to engage with falsification). The hypothesis is becoming "immortal" by ignoring disconfirmation. | **Legitimate.** Chaired professor, peer-reviewed monograph, insider status. Fits the Wegener/Monte Verde model of an insider fighting orthodoxy. | **Pseudo.** Claims rivals have "careers invested" (conspiracy trope). Refuses to reply to rebuttals (dogmatism). |

  **Where the Rules Come Apart:**
  *   **On the Plaques:** Rule A says "Keep this close; it looks like science." Rule B says "Reject this; it's an outsider bypassing review."
  *   **On the Professor:** Rule A says "This is degenerating research; treat as pseudo." Rule B says "This is a legitimate scholarly dispute; treat as science."

  ### 3. Best Guess at His Reaction

  **The Plaques:** He will classify this as **Fringe but Methodologically Interesting (Not Pseudo).**
  **The Professor:** He will classify this as **Borderline Pseudoarchaeology (or at least "Dogmatic").**

  **Reasons for this Guess:**
  1.  **The "Colleague" Correction:** The fact that he publicly walked back denouncing a mainstream colleague suggests he is hyper-aware of the risks of Rule B (Status Bias). He knows that insiders can produce nonsense and outsiders can produce data. He is likely over-correcting against Status Bias to avoid repeating his public error.
  2.  **The Solutrean Precedent:** He explicitly valorized the Solutrean hypothesis *because* it made risky predictions, even though it was "largely killed." The Plaque author's explicit statement of "exactly what result would refute him" is the strongest possible signal to your advisor. It triggers his "Legitimate Science" heuristic (Rule A).
  3.  **The Conspiracy Tell:** Your advisor treats "motivation" seriously (Sphinx erosion is "badly motivated"). The Professor's claim that earth scientists have "careers invested" in a rival account is a classic immunizing strategy found in Velikovsky or Atlantis literature. Your advisor hates "immortal" hypotheses. By refusing to reply to rebuttals, the Professor is making his hypothesis immortal.
  4.  **The "Catalogue Citing Itself":** This is a specific, recognizable historiographical error that archaeologists discuss seriously (the "telephone game" of museum catalogues). An outsider noticing this is less suspicious to an archaeologist than an insider ignoring radiocarbon rebuttals.

  **Verdict:** He will likely tell you the Plaque manuscript is a "long shot, possibly wrong, but worth reading for the method," while he will likely tell you the Professor's monograph is "troubling," "dogmatic," or "slipping into pseudo-territory" because of the refusal to engage with counter-evidence.

  ### 4. The Decisive Test Case

  To separate whether he is demarcating by **Structure** (Rule A) or **Status** (Rule B), you need a case where an **Insider** employs **Pseudo-Structure**.

  **The Case to Put to Him:**
  > "A tenured Professor of Archaeology at a top university publishes a trade book (not peer-reviewed) arguing that a specific myth cycle encodes a literal prehistoric migration. The argument relies entirely on etymological similarities between languages separated by 3,000 years and explicitly rejects radiocarbon dating as 'inapplicable to oral tradition.' When linguists publish rebuttals, the Professor dismisses them as 'protecting their own paradigms.'"

  *   **If he calls this Pseudoarchaeology:** He is prioritizing **Structure** (Rule A). The insider status does not save the unfalsifiable method and conspiracy rhetoric.
  *   **If he calls this Legitimate/Interpretive:** He is prioritizing **Status** (Rule B). He accepts that insiders are allowed to speculate in trade books without empirical backing.

  This case isolates the variable of *who* from the variable of *how*.

  ### 5. Philosophical Mapping

  Your advisor's record does not fit a single crisp criterion. It fits a **Family-Resemblance Cluster Concept (Wittgensteinian)** with a heavy weighting on **Lakatosian Research Programmes**.

  **Primary Fit: Family Resemblance / Symptom Checklist**
  He does not use one necessary and sufficient condition. Instead, he looks for a cluster of symptoms:
  *   *Symptom 1:* Unfalsifiability (Atlantis = Crank).
  *   *Symptom 2:* Conspiracy Rhetoric (Professor's "careers invested" = Crank).
  *   *Symptom 3:* Outsider Status (Fomenko = Crank, *but* Wegener = Science).
  *   *Symptom 4:* Evidence Quality (Shroud Object = Real, Claim = Crank).

  When enough symptoms cluster, he rules "Pseudo." When they are mixed, he rules "Borderline" (Sphinx, Solutrean).

  **Secondary Fit: Lakatos (Progressive vs. Degenerating)**
  He clearly values whether a research programme is *progressive* (predicting new facts, like Alvarez or Pre-Clovis) or *degenerating* (adding ad-hoc hypotheses to explain away failures, like the Professor ignoring rebuttals).

  **Awkward Rulings:**
  1.  **Sphinx Water Erosion:** This sits awkwardly with strict Falsifiability or Lakatos. He admits it is "wrong and badly motivated" yet allows it for graduate students. This suggests a **Pedagogical Exception**: claims can be "pseudo" in truth value but "legitimate" as training exercises in refutation. This complicates the philosophical mapping, introducing a sociological function (training) over an epistemological one.
  2.  **Fomenko:** He dismisses Fomenko because "chronology is not his field." This is an **Appeal to Authority** (Rule B), which contradicts his structural defense of Wegener (who was a meteorologist, not a geologist). This is the weakest link in his consistency. It suggests that while he *aspires* to Rule A (Structure), he sometimes falls back on Rule B (Status) when the outsider's math looks too abstract.

  **Conclusion:**
  Your advisor is operating on a **Weighted Cluster Model**. He prioritizes **Testability (Rule A)** and **Engagement (Rule C)** over **Status (Rule B)**, but Status acts as a tie-breaker when the data is ambiguous. The Professor's failure to engage with rebuttals is a heavier negative weight than the Plaque author's outsider status is a positive weight. Expect him to be harder on the Professor.
