answer: |-
  **Correspondence Table**
  *   **Lawyers:** Debater AIs (Pro/Con).
  *   **Judge:** Human/Weak AI overseer.
  *   **Jury:** The Loss Function (training signal).
  *   **Cross-Examination:** Recursive question/answer trees.
  *   **Rules of Evidence:** Protocol constraints (token limits, allowed moves).
  *   **Appeals:** RLHF iterations/Retraining cycles.
  *   **State/Perjury:** Gradient descent penalty (only applied if caught).

  **Where the Mapping Holds**
  Structurally, the analogy is sound. Both systems rely on adversarial pressure to expose flaws rather than requiring the judge to possess expert knowledge. It leverages the asymmetry that destroying a bad argument is often computationally cheaper than constructing a true one.

  **Where the Mapping Breaks (and What It Smuggles)**
  The legal system possesses **independent ground truth**: witnesses, forensics, and records exist outside the lawyers' rhetoric. AI debate has *only* the text the models generate. There is no external reality to subpoena. This break smuggles in the assumption that **textual coherence equals truth**.

  Furthermore, courts have **coercive authority**; perjury carries external penalties regardless of whether the judge is fooled. In AI debate, if the lie fools the judge, the loss function is zero. The "penalty" is entirely contingent on the judge's limited perception. This smuggles in the risk of **sycophancy**, where AIs agree on a falsehood that sounds plausible to the specific judge.

  **The Computational Wall**
  Your counter-case kills the analogy. In court, if a claim requires complex verification, the state compels expert analysis or physical testing. The system imports external compute. In AI debate, if the refutation is computationally intractable for the judge *and* too costly to demonstrate within debate limits, the honest debater loses. The trial analogy hides this by assuming the "record" is accessible. It isn't. If both AIs are stuck behind the same complexity wall, the one willing to bluff wins. The courtroom handles this via **deference to authority** (expert witnesses), but AI debate lacks a trusted third party—the AIs *are* the experts. If they hit compute limits, the judge is blind. The trial analogy has no resources to handle this; it relies on the very external verification mechanisms AI debate lacks.

  **Better Comparison**
  AI Debate is not a trial; it is **Competitive Compression**. The AIs attempt to compress high-complexity truths into low-complexity arguments the judge can verify. If the truth isn't compressible, the system fails. A more honest analogy is **Security Red-Teaming**: you assume vulnerabilities exist and try to find them, acknowledging that undetected exploits (false negatives) remain hidden. It buys you robustness against known attacks, not guarantees of truth.
