prompt: |-
  So my friend has gotten really into the idea that AI safety via debate is basically just the adversarial legal system, and that's his whole reason for thinking it'll scale: you put two AIs on opposite sides, a human (or a weaker model) sits as judge, and because each side is incentivised to tear apart the other's bullshit, the truth tends to come out on top. I'm skeptical but I can't quite articulate why, so I want you to do a proper audit of the analogy for me.

  Give me the correspondance table first -- what's supposed to play the role of the lawyers, the judge, the jury, cross-examination, the rules of evidence, the appeals process, the state that punishes perjury -- then where the mapping actually holds, then the places where it quietly breaks and what those breaks are smuggling in. The thing that bugs me is that in a courtroom the lawyers aren't the only source of information: there are witnesses, physical evidence, a record, an appeals court that can revisit a bad verdict, and a coercive authority behind the oath. In debate the judge has literally nothing to check the debaters against except the debaters themselves. He says that's fine, because a liar has to keep defending the lie under cross.

  Here's the case I think kills it: imagine a debater who wins with a claim that is in fact true, but whose justification is something the judge could never verify in the time available -- or, worse, a claim that's false but whose refutation is a computation too long for anyone in the room to actually run. Cross-examination doesn't rescue the judge there, because the other debater can't produce the refutation either; both sides are stuck behind the same wall, and the one willing to exploit it wins. Does the trial analogy have any resources to handle that, or is that precisely the kind of thing the analogy is hiding by importing the courtroom's background machinery? And if the analogy can't carry his conclusion, tell me what a better comparison would be for what debate actually buys you.

  Keep it under 600 words.
