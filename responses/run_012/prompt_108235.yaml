answer: |-
  **TO:** Ethics Committee, National Geological Society
  **FROM:** [Your Name/Title]
  **DATE:** 24 October 2023
  **SUBJECT:** Opinion on the Volcanic Crisis Case and Proposed Amendments to the Code of Conduct

  **1. Purpose and Scope**

  This paper addresses the recent controversy regarding the Fellow who declined deployment to an active volcanic crisis overseas. Pressure mounts to censure her for failing to meet her professional responsibilities. We must decide whether her refusal constitutes a breach of our Code of Conduct and whether the Code itself requires amendment to prevent future ambiguity.

  I write to recommend a definite finding: **the Committee should rule that the Fellow incurred no sanctionable breach of duty.** Furthermore, I propose we amend the Code to explicitly distinguish between general professional assistance and the assumption of significant physical risk.

  This recommendation rests not on institutional expediency, but on a specific moral distinction that our current draft obscures. We must confront the concept of *supererogation* and accept its uncomfortable limits.

  **2. The Philosophical Terrain: Duty vs. Supererogation**

  The core tension here is between *obligation* and *virtue*. In moral philosophy, an act is *obligatory* if failure to perform it warrants blame or sanction. An act is *supererogatory* if it is good to do, praiseworthy to perform, but not required; failure to perform it may be disappointing, but it is not blameworthy.

  The argument for censure rests on the claim that geological expertise creates a role-based duty analogous to that of a doctor in an epidemic or a firefighter in a blaze. This argument posits that by accepting the title 'Fellow' and the public trust inherent in our science, one implicitly contracts to deploy that expertise when the public need is acute.

  I reject this analogy. A firefighter's duty to enter a burning building is purchased by the state via salary, pension, and statutory protection. A doctor's duty is bound by specific employment contracts and the Hippocratic tradition which they explicitly swear to upon licensure. Our Fellow is a university employee. She holds no public office. Her membership in this Society is voluntary.

  To convert a supererogatory act (risking one's life to aid strangers) into a mandatory duty requires explicit consent. We cannot manufacture this obligation post hoc through the vague wording of a Code. If we censure her, we are effectively asserting that membership of this Society constitutes a binding agreement to accept mortal risk. I do not believe any of us signed up for that, nor should we ask future members to do so without their explicit, informed knowledge.

  Therefore, in this specific case, the Fellow's refusal falls on the permissible side of the line. Censure would be unjust.

  **3. The Counter-Argument: Role Obligations**

  The strongest argument against my position is that professional status itself generates duties that transcend contract. This is the 'social licence' argument: we are granted autonomy and status in exchange for serving the public good. If we claim the authority of experts when it suits us, we must accept the burdens of that authority when it counts.

  There is weight to this. If we classify all high-stakes intervention as supererogatory, we risk creating a profession of 'fair-weather experts' who offer advice only when it is convenient. This erodes public trust.

  However, there is a boundary where the 'social licence' ends and 'martyrdom' begins. The pertinent duty is to render *assistance*, not to guarantee *presence*. In the modern era, assistance can often be rendered remotely. The duty is to the *outcome* (mitigating hazard), not necessarily to the *method* (physical deployment). Where physical deployment involves high probability of severe harm or death, and where no specific contractual assumption of that risk exists, the act remains supererogatory.

  **4. The Paradox of Supererogation**

  I must acknowledge the paradox inherent in this finding. If we classify risky intervention as supererogatory, we establish a moral minimum that may feel too low. It implies that a geologist *may* stay home while a community suffers, provided they are not contractually bound to help. This lets us off lightly. It creates a safe harbour for cowardice disguised as prudence.

  How do we live with this? We must separate *ethics* (the rules we enforce) from *virtue* (the character we cultivate). We cannot mandate heroism through a Code of Conduct without becoming coercive. However, we can and should celebrate it through other means.

  My proposal is that we accept the paradox. We maintain a Code that protects members from being forced into untenable risk, while using the Society's platforms to honour those who *do* choose to go. We make the supererogatory visible and prestigious, without making it mandatory. We must be comfortable with the idea that the highest moral acts are those we cannot demand.

  **5. Proposed Amendment to the Code**

  The current draft states: *"Members should render assistance to the public where their expertise permits."*

  This is dangerously ambiguous. 'Permits' could imply technical ability, ignoring safety or personal capacity. It invites the very interpretation currently being used to attack the Fellow. It conflates 'can' with 'must'.

  I propose we replace this line with wording that acknowledges the duty to help while explicitly bounding it by safety and reasonable practicability.

  **Recommended Wording:**
  > "Members should, where reasonably practicable and without undue risk to themselves or their dependents, make their geological expertise available to serve the public good. This obligation does not extend to requiring members to place themselves in zones of imminent physical hazard unless such risk is an explicit condition of their employment or statutory role."

  **Reasons for this drafting:**
  1.  **"Reasonably practicable":** Introduces a proportionality test. Remote advice is practicable; travel may not be.
  2.  **"Undue risk to themselves or dependents":** Explicitly validates the Fellow's cited reasons (family and safety).
  3.  **The Exclusion Clause:** The second sentence draws the bright line. It clarifies that the Society does not mandate hazard exposure for those not employed to do so. This protects the member and protects the Society from liability.

  **6. Finding and Course of Action**

  I recommend the Committee adopt the following resolution at the next meeting:

  1.  **Finding:** That in the matter of the [Country] volcanic crisis, the Fellow in question did not breach the Code of Conduct. Her decision to decline deployment was within her professional rights given her employment status and the risk profile.
  2.  **Statement:** That the Society regrets the loss of expertise to the local authorities but affirms that the safety and personal autonomy of members cannot be compromised by vague interpretations of professional duty.
  3.  **Amendment:** That the Code of Conduct be amended immediately to reflect the wording proposed in Section 5 above.

  **7. Conclusion**

  We are scientists, not soldiers. Our value lies in our judgement, not merely our presence. If we blur the line between duty and supererogation, we do not make the world safer; we make the profession untenable for anyone with caring responsibilities or a rational regard for their own survival.

  We should not censure this Fellow. We should amend our Code to ensure no Fellow is placed in this position again, and we should strive to build a culture where helping is the norm, not because it is compelled, but because it is who we are. But that culture must be built on praise, not punishment.

  I look forward to discussing this at the meeting.
