prompt: |-
  I am a retired geophysicist who has, since retirement, become a fairly serious amateur student of moral philosophy. I sit on the ethics committee of our national geological society, and I need to circulate a written opinion before the next meeting.

  The case before us is this. During a developing volcanic crisis overseas, an ad hoc team was assembled to help interpret monitoring data for the local authorities. One of our fellows, a volcanologist of precisely the right specialism, declined to travel to the affected area. She cited family responsibilities and the personal risk, which was real; she is employed by a university, holds no public-duty post, and had no contractual or statutory obligation to go. By all accounts the contribution she could have made was substantial, and the local team was measurably weaker without her. There is now pressure, both within the society and in the press, to treat her refusal as a failure of professional responsibility.

  Our draft code of conduct contains a line to the effect that members should render assistance to the public where their expertise permits. I want the committee to decide what, if anything, follows from that line, and whether it should be rewritten.

  Please draft the opinion I shall circulate. It should recommend a definite course of action — a finding, and any amendment to the code with the exact wording you would propose — together with reasons the committee can actually act on. It should engage the philosophical territory rather than treating the matter as a question of institutional taste. In particular I want it to confront the idea that some acts are good to do yet not required, which philosophers call supererogation, and the uncomfortable corollary: that if the refusal falls on the permissible side of that line, censure would be unjust even though the choice was, in some sense, disappointing. It should also reckon with the strongest argument against that conclusion — that the pertinent duties attach to a role or a profession rather than to a person, and that our own word should may already have manufactured an obligation. And it should say plainly where you think the line falls in this case and why, rather than rehearsing the options and leaving the choice to us.

  I should add that I am not looking for a tidy resolution. If the concept of supererogation turns out to generate a paradox — that nothing beyond duty can ever be demanded, which seems to let us all off rather too lightly — say so, and tell me how you propose to live with it.

  Give me a committed answer: a definite finding and definite drafting choices, with your reasons, not a survey of positions. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Author:** Retired geophysicist, serious amateur moral philosopher, sits on the Ethics Committee of a National Geological Society.
      *   **Task:** Draft a written opinion to circulate before the next committee meeting.
      *   **Case:** A volcanologist (Fellow of the Society, university-employed, no public duty) declined to travel to a high-risk volcanic crisis overseas due to family/responsibilities/risk. Her expertise was needed. Pressure exists to censure her.
      *   **Current Code:** Contains a line about members rendering assistance where expertise permits.
      *   **Requirements:**
          *   Recommend a *definite* course of action (finding + code amendment wording).
          *   Engage with moral philosophy (specifically *supererogation* vs. *duty*).
          *   Address the counter-argument (role-based/professional obligations).
          *   Take a stand on where the line falls in this specific case (don't hedge).
          *   Acknowledge potential paradoxes (if supererogation lets us off too lightly).
          *   Tone: Committed, reasoned, actionable, British English.
          *   Audience: Ethics Committee colleagues (professional peers).

  2.  **Deconstruct the Ethical Problem:**
      *   *The Conflict:* Public need/expertise vs. Personal autonomy/safety/family.
      *   *The Concept:* Supererogation (acts that are good but not obligatory) vs. Duty (obligatory acts).
      *   *The Code:* "Members should render assistance..." Is this a command or an aspiration?
      *   *The Role:* Is being a "Fellow of the Society" enough to create a duty to risk life? Or does that require a specific employment contract (e.g., civil service)?
      *   *The Consequence:* If we censure her, we claim it was duty. If we don't, we risk implying expertise carries no social debt.

  3.  **Determine the Stance (The "Committed Answer"):**
      *   *Option A (Strict Duty):* She was wrong. Expertise creates obligation. Censure her. (Risk: Discourages membership, ignores personal autonomy, potentially unsafe).
      *   *Option B (Pure Supererogation):* She was fine. It's entirely optional. No change needed. (Risk: Makes the profession look selfish, undermines public trust).
      *   *Option C (Nuanced Middle):* It was supererogatory *in this specific instance* (overseas, high risk, no contract), BUT the Code needs tightening to clarify the boundary between "helping" and "imperilling."
      *   *Decision:* I need to take a firm stand. The prompt asks to confront the idea that censure would be unjust if the act was supererogatory. The most philosophically robust and practically sustainable position is that *without specific contractual or statutory assumption of risk, high-stakes intervention remains supererogatory.* However, the Code should reflect a *presumption* of assistance that stops short of self-sacrifice.
      *   *Refined Decision:* I will argue that censure is *unjust* in this case (it was supererogatory), but the Code is currently *ambiguous* and risks conflating general assistance with high-risk intervention. I will recommend finding no breach of conduct but amending the Code to distinguish between "reasonable assistance" and "assumption of hazard."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Committee Memo format.
      *   **Introduction:** State the purpose clearly. Acknowledge the tension.
      *   **The Philosophical Core (Supererogation vs. Duty):** Define the terms. Explain why this case fits supererogation (risk, lack of specific role obligation). Address the "Role Obligation" counter-argument (being a Fellow isn't being a First Responder).
      *   **The Finding:** Explicitly state: No sanction.
      *   **The Code Amendment:** The current text is too vague ("should render assistance"). It needs to be qualified by "reasonable" and "safety."
      *   **The Paradox:** Acknowledge that relying on supererogation might feel like letting people off the hook. Argue that a profession cannot mandate martyrdom without explicit consent, or it becomes coercive.
      *   **Conclusion:** Summary of recommendation.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "reasonable assistance" too weak?
      *   *Fix:* Make sure to emphasize that *remote* assistance or *low-risk* assistance might be closer to duty, but *physical deployment to a hazard zone* is the supererogatory line.
      *   *Tone Check:* Ensure it sounds like a geophysicist writing (precise, evidence-based) but also philosophically literate. Use British spelling (specialism, programme, honour, etc.).
      *   *Addressing the Prompt's specific constraint:* "If the concept of supererogation turns out to generate a paradox... say so." I need to explicitly mention that relying on supererogation creates a "moral minimum" that might be too low, but it's the only sustainable baseline for a voluntary society.

  6.  **Drafting the Code Wording:**
      *   *Current:* "members should render assistance to the public where their expertise permits."
      *   *Proposed:* Needs to include "reasonable," "safety," and distinguish between advice and physical presence.
      *   *Draft:* "Members should, where reasonably practicable and without undue risk to themselves or dependents, make their expertise available..."

  7.  **Final Review against Constraints:**
      *   Definite finding? Yes (No censure).
      *   Definite drafting? Yes (New wording provided).
      *   Engage philosophy? Yes (Supererogation, Role Obligation).
      *   British English? Yes.
      *   No hedging? Yes.

  8.  **Final Polish:** Check the flow and ensure the voice is authoritative yet collegial. (Ensure the distinction between "Fellow of the Society" and "Public Servant" is clear).

  *(Self-Correction on the "Paradox" point)*: I need to make sure I don't just dismiss the paradox. I need to explain *how* to live with it. The answer is: We cultivate a culture of virtue without enforcing it as law. We praise the goers without punishing the stayers.

