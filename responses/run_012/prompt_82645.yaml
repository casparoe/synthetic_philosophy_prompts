          *   *Best Fix:* Modify Claim 2 and 4 to allow a distinction between *Sensory Pain* and *Affective Pain*, OR Modify Claim 3 to say they have *nociception* but not full *pain*.
          *   *User's Intuition:* The user seems to want to keep Claim 3 (Asymbolics are in pain). So Claim 2 or 4 must yield.
          *   *Cheapest Fix:* Modify Claim 2. Instead of "Badness is constitutive of *pain*," say "Badness is constitutive of *suffering* or *pain-as-experienced*." But wait, Claim 1 says Pain is bad.
          *   *Better Fix (Imperativist Route):* Claim 4 is strong Imperativism. Claim 2 is Evaluativism. They clash slightly.
          *   *Actually, the cheapest fix is to adjust Claim 3's description or Claim 2's scope.* If the user insists Asymbolics are in pain (3), they must admit Pain $\neq$ Badness necessarily. This breaks Claim 2.
          *   *Alternative:* Claim 2 says "To feel pain just is... to be in a state that's bad for you." If Asymbolics feel pain but it's not bad for them, Claim 2 is false.
