      *   *Refinement:* The user likely values the *integrity* of the self. Asymbolia fragments the self.
      *   *Fix:* Claim 1 needs to be about the *phenomenal character*, Claim 7 is about the *whole person's welfare*.

      *   *Decision:* The strongest fix is to adopt a **Bipartite View of Pain** (Sensory + Affective).
          *   Asymbolics have Sensory Pain, lack Affective Pain.
          *   Claim 2 applies to Affective Pain.
          *   Claim 3 applies to Sensory Pain.
          *   Claim 6 applies to Affective Pain (Suffering).
          *   Claim 7 is explained because losing the Affective component severs the protective link, making the *person* vulnerable, even if the *moment* is less bad.
          *   *Wait, does this violate Claim 1?* "Pain is bad." If Sensory Pain isn't bad, then "Pain" isn't always bad.
          *   *Adjustment:* "Pain" refers to the unified state. Asymbolia is a *pathological fragmentation* of pain.
          *   *Okay, let's look at the "Illicit Work".* The illicit work is likely in Claim 3 using the word "Pain" while Claim 2 defines "Pain" as essentially bad. The word "Pain" is doing double duty (Sensory vs. Suffering).

      *   *Final Plan:*
          1.  Identify the "Pain" Ambiguity as the source of the 2-3-4 conflict.
          2.  Identify the Intrinsic/Instrumental clash in 1 vs 7.
          3.  Rank 2-3-4 as Critical.
