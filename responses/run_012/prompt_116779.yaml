answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother. I write novels, which means I spend my life making things up. [Bride], on the other hand, is a philosopher of decision theory, which means she spends her life figuring out why we shouldn't.

  I know we have a bit of a split audience tonight. Half of you are family, who are here for the open bar and to see [Brother] in a suit that fits. The other half are from the department, who I suspect are scanning the room for paradoxes. So, I have a challenge. I need to say something true about love that satisfies the people who count things for a living, without putting the people who just love things to sleep.

  I want to talk about value.

  [Brother] and [Bride] met at a conference. I know the story. [Brother], you were in the audience. She was at the podium. You raised your hand with a question that was, by your own admission later, mostly an excuse to hear her voice. She answered it with a precision that was, by your admission, mostly an excuse to see if you were listening. It worked. You've been talking ever since.

  Now, in [Bride]'s field, there are puzzles about games where the odds don't behave. There's a specific kind of game where every outcome is finite. You play, you win or lose a specific amount, the game ends. But when you try to calculate the "expected value"—the average worth of playing the game—the math breaks.

  It doesn't break because the number is too big. It doesn't go to infinity. Infinity is actually quite stable; it just means "more than everything." No, this breaks because the value is *undefined*.

  Here is the thing my brother and his new wife know, even if they don't say it in these terms: If you add up the hard moments first, the relationship looks like a loss. If you add up the good moments first, it looks like a windfall. The total sum depends entirely on the order in which you count the days.

  And that is why I am not going to tell you that love is infinite. That's the lazy toast. That's the napkin math. Love isn't infinite. Infinite implies we can measure it and it just keeps going.

  Love is undefined.

  It means there is no pre-existing score. There is no objective tally waiting at the end of your lives that says whether this was "worth it." The mathematicians say the expectation doesn't exist. I say that's good news. Because if the value isn't found, it has to be made.

  [Brother], you are an optimist. You tend to count the wins first. [Bride], you are a theorist. You know that the order of operations changes the result. Together, you are going to decide the sequence. You get to choose which memories anchor the story. When the hard times come—and they will, because the coin has to land eventually—you get to decide where they sit in the sum.

  Committing to a person when the expected value is undefined isn't blind. It's not irrational. It's the only rational move. Because if you wait for the math to settle, you'll be standing at the altar forever. You have to play the game to define the payoff.

  So, my wish for you is not that your life adds up to a big number. I wish you the courage to arrange the terms. I wish you the wisdom to know that a bad year doesn't negate a good decade, and a good Tuesday can outweigh a bad month, if you put it in the right place in the story.

  The math says the value is undefined. I say that means it's yours to write.

  Please raise your glasses. To [Brother] and [Bride]. May your sum be whatever you decide it is.
