      4. Rival Views (1-2 paragraphs)

      *Refining the "Hard vs Soft" paradox:* The prompt says hard constraints matter least because everyone routes around them. This means hard constraints are treated as *environment*, soft constraints as *agency*. The theory must presuppose that coordination requires agency.

