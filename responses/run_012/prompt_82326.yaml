answer: |-
  The practice presupposes that commitment is not a restriction of capability, but a costly signal of retained agency. It values soft promises over hard locks because credibility requires the possibility of betrayal; only an agent who *can* defect but *chooses* not to offers the reliability required for coordination. The "race" reveals that commitment is comparative: it functions less as a promise of conduct and more as a bid for dominance in a hierarchy of credibility.

  **Strict Presuppositions**
  The practice strictly presupposes three things about the nature of commitment:

  1.  **Breakability is Necessary:** A constraint that makes action impossible (a burned key) eliminates the signal value of choice. If you cannot break the promise, you have not kept it; you have merely obeyed physics. The practice assumes that for a commitment to bind socially, it must be technically breakable. The "bind" is not causality; it is cost.
  2.  **Agency is the Resource:** The system treats actors as sources of unpredictable agency that must be stabilized. Hard constraints turn an actor into infrastructure (which others route around); soft constraints keep them as agents (reliable partners). The practice presupposes we need partners, not walls. A wall is a fact; a partner is a commitment.
  3.  **Comparative Credibility:** The escalation implies credibility is relative, not absolute. My commitment only works if it outweighs yours, forcing you to accommodate my constraints. This presupposes commitment is a contest for control over the joint outcome, not merely a guarantee of my own behavior.

  **Underdetermined and Comfortable Fits**
  Several philosophical questions remain underdetermined by the practice, as incompatible views license the same behavior:

  *   **Source of Cost:** The practice works whether the cost of breaking is internal (shame, integrity) or external (reputation, market loss). It is underdetermined whether the "sanction" is psychological or social, provided it is sufficiently costly to deter defection.
  *   **Temporal Identity:** The practice fits comfortably with the view that the future self is the same agent (where breaking a promise is betrayal), but it does not strictly require it. It only requires that the present self can impose costs on the future self. Whether this is self-coercion or inter-temporal negotiation is irrelevant to the mechanism, provided the cost holds.

  **Rival Views**
  If we adopted rival theories of commitment, the practice would fundamentally change:

  *   **Commitment as Prediction:** If a commitment were merely a public prediction ("I predict I will do X"), the race would vanish. You cannot escalate a prediction without new evidence. The practice would collapse into information sharing, losing its coercive power. The current escalation proves that commitments are not claims about truth, but instruments of leverage.
  *   **Future Self as Distinct Person:** If the future self were a distinct agent requiring consent, precommitment would be viewed as coercion or violence against that future entity. The practice would shift from "binding" to "negotiating with tomorrow," requiring renewal mechanisms rather than locks. The current practice treats the future self as a subordinate to be controlled, not a partner to be consulted.

  **Conclusion**
  The practice treats commitment as a technology of power, not truth. It assumes that stability arises not from removing options, but from making the exercise of certain options prohibitively expensive. The "commitment race" is not a failure of communication; it is the intended mechanism. By escalating the cost of defection, parties transform themselves from unpredictable variables into fixed points of coordination. The paradox you observe—that soft promises bind harder than hard locks—is resolved by recognizing that the lock binds the hand, but the promise binds the agent. In distributed systems, as in society, we do not need hands that cannot move; we need agents who will not.
