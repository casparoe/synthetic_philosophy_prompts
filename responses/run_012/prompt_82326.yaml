      *   *Interpretation:* If I burn a key, you know I can't act. You route around me. If I promise publicly, you know I *can* act but *won't* because of shame/cost. You rely on me.
      *   *Theory:* Commitment is a *social contract* regarding agency, not a *technical lock* regarding capability. The practice assumes agency is the source of value.
      *   *Wait, the "Commitment Race" aspect:* Escalation. "Each side's precommitment raises the price of the other side's." This sounds like brinkmanship.
      *   *Revised Bottom Line:* The practice presupposes commitment is a weaponized signal of agency retention. It values soft promises over hard locks because only an agent who *can* defect but *chooses* not to provides the stability needed for coordination. Hard locks remove agency, making the actor a predictable environment hazard rather than a partner.

  6.  **Drafting the Content (incorporating constraints):**

      *   *Bottom Line:* Start strong.
      *   *Presuppositions:* Focus on Agency and Costly Signaling.
      *   *Underdetermined:* Internal vs External cost.
      *   *Rival Views:* Prediction vs. Distinct Persons.

  7.  **Word Count Check:** Keep it tight. Avoid fluff.

      *   *Drafting thought:* Ensure I address the "routing around" paradox. Hard constraints make you a wall. Soft constraints make you a partner. The system needs partners, not walls.
      *   *Drafting thought:* The "race" implies comparative status. I need to show I'm *more* committed than you.

  8.  **Final Polish:** Check against "strict presuppositions" vs "comfortable fits" vs "underdetermined".

      *   *Strict:* Commitment must be breakable to be credible. Commitment is relational (signal to other).
      *   *Comfortable:* Reputation is the sanction.
      *   *Underdetermined:* Whether the cost is psychic or social.
      *   *Rival:* Prediction view kills the race. Distinct self view makes it coercion.

