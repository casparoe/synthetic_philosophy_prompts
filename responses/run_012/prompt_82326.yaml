      *Bottom Line:* The practice presupposes that commitment is not a restriction of capability, but a costly signal of retained agency. It values soft promises over hard locks because credibility requires the possibility of betrayal; only an agent who *can* defect but *chooses* not to offers the reliability required for coordination. The "race" reveals that commitment is comparative: it functions less as a promise of conduct and more as a bid for dominance in a hierarchy of credibility.

      *Strict Presuppositions:*
      1.  **Breakability is Necessary:** A constraint that makes action impossible (burned key) eliminates the signal value of choice. The practice strictly presupposes that for a commitment to bind socially, it must be technically breakable. The "bind" is not physics; it is cost.
      2.  **Agency is the Resource:** The system treats actors as sources of unpredictable agency that must be stabilized. Hard constraints turn an actor into infrastructure (routable); soft constraints keep them as agents (reliable partners). The practice presupposes we need partners, not walls.
      3.  **Comparative Credibility:** The escalation implies credibility is relative. My commitment only works if it outweighs yours. This presupposes commitment is a contest for control over the joint outcome, not merely a guarantee of my own behavior.

      *Underdetermined/Comfortable:*
      *   **Source of Cost:** The practice works whether the cost of breaking is internal (shame) or external (reputation). It is underdetermined whether the "sanction" is psychological or social, provided it is costly.
      *   **Temporal Identity:** It fits comfortably with the view that the future self is the same agent (betrayal), but does not strictly require it. It only requires that the present self can impose costs on the future self.

