answer: |-
  In the center of a quiet park stands a mature oak tree, its roots gripping the earth while leaves photosynthesize sunlight into sugars to fuel continuous cellular repair and growth. The tree's physical structure is maintained by active biological systems that pump water from the roots to the canopy and replace decaying tissues, ensuring the arrangement of its cells remains coherent over time. If these internal metabolic processes were to cease, the tree would immediately begin to rot and lose its structural integrity, unlike the nearby bench which remains intact without internal activity. The scene presents a clear contrast between the living organism, whose parts are held together by ongoing life functions, and the non-living objects surrounding it that rely only on passive physical bonds.

  **Verdicts and Reasoning**
  *   **Universalism:** Says **Yes**. Since universalism holds that any plurality of things composes a further thing, the cells and molecules of the oak compose the tree regardless of their arrangement or biological status.
  *   **Organicism:** Says **Yes**. The oak tree constitutes a single, uncontroversial life; therefore, the parts composing that life satisfy the necessary and sufficient condition for composition.
  *   **Nihilism:** Says **No**. Nihilism denies that composition ever occurs; there are only simples arranged tree-wise, not a further object that is the tree.
  *   **Static-Arrangement View:** Says **No**. The arrangement of the tree's parts depends on ongoing internal metabolic processes (pumping water, cellular repair) that must keep running to maintain the structure. Since the arrangement would not persist on its own without these processes, composition does not occur.

  **The Feature Doing the Work**
  The single feature driving the divergent verdicts between Organicism and the Static-Arrangement view is **metabolic dependence**. This is the reliance of the object's structural integrity on internal, energy-consuming processes that actively fight entropy.

  **Removing the Feature**
  If metabolic dependence is removed (i.e., the tree dies and dries out into static wood), the case does not collapse into agreement; rather, the verdicts **invert**. Organicism would then say **No** (because it is no longer a single life), while the Static-Arrangement view would say **Yes** (because the arrangement of the dead wood persists without ongoing internal processes). The views remain in disagreement, but on opposite grounds.

  **The Static-Arrangement Objection**
  A proponent of the Static-Arrangement view might argue that the case **cheats** by relying on a macroscopic, folk-biological distinction between "process" and "state." They could claim that at the fundamental physical level, atomic bonds involve dynamic exchanges of force carriers just as metabolism involves dynamic exchanges of molecules; therefore, labeling metabolism an "ongoing process" while treating chemical bonds as "static" is arbitrary stacking of the deck to ensure life fails the test while rocks pass.

  **Evaluation of the Objection**
  This objection **fails**. While fundamental physics is dynamic, the Special Composition Question operates at the macroscopic level where a functional distinction exists between homeostatic throughput (which requires constant energy input to maintain order) and structural equilibrium (which persists without energy input). The case accurately reflects this macroscopic distinction intended by the view, so it does not illegitimately rig the outcome.
