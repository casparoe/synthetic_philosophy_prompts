  6.  **Final Polish:** Check against the specific personas (Attorney, Clerk, etc.) to ensure the voice matches. Ensure the "Knowns" (16/Compulsory) are integrated.

      *(Final thought on the "Dreaded Question")*: The user said "I got naturalized... wife is still on a green card... eating at me." The dreaded question is likely: *"You went through the process to naturalize. Why is the answer not to lower barriers to citizenship, but to lower the value of the vote?"* That attacks the core civic republican view. I will use that.

