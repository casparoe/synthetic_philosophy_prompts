answer: |-
  ### Strategic Preamble

  **What to Concede Up Front:**
  *   **Logistical Complexity:** Admit immediately that a separate ballot system is expensive and administratively burdensome. Don't pretend it's easy.
  *   **Legal Risk:** Acknowledge that state preemption is a genuine threat. You are asking them to take a legal risk for a moral gain.
  *   **Imperfect Eligibility:** Concede that *any* residency bar (3 years, 5 years, 1 year) is arbitrary. It will exclude someone who "deserves" to vote.

  **What to Hold No Matter What:**
  *   **Local vs. National Distinction:** Do not waver on the principle that city governance (trash, zoning, schools) is fundamentally different from national sovereignty (war, borders, trade).
  *   **Residency as the Metric:** Defend residency over citizenship for *local* offices. This is your core philosophical ground.
  *   **The Sunset Clause:** Keep this as your political shield. It is the only way skeptical councilors will vote "yes."

  **Your Proposal's Weakest Point:**
  *   **The Separate Ballot:** This is your biggest vulnerability. It creates a "two-tier" electorate, invites Equal Protection challenges, and stigmatizes the very voters you're trying to empower. It looks like segregation, not inclusion. You need to defend this aggressively or be prepared to drop it if the Clerk/Attorney unite against it.

  ---

  ### Q&A Prep Sheet (Ordered by Damage Potential)

  #### 1. The Preemption Trap
  **Who:** The Election-Law Attorney
  **Objection:** "State Election Code defines a 'qualified voter' as a U.S. citizen. Unless our state has explicit home-rule provisions allowing local franchise expansion—which I haven't seen in our charter—this isn't just risky; it's void. If we pass this, we invite a lawsuit that costs the city six figures and ends with the courts striking it down. Why should we spend public money on a legally futile gesture?"

  **Your Reply:**
  "You're right that state code is the hurdle, but it's not necessarily a wall. Historically, non-citizen voting was the norm in many states until the early 20th century, and home-rule charters often retain authority over 'municipal affairs.' We aren't touching state or federal races; we are defining the electorate for the *city's* own governance. If we wait for the state legislature to fix this, it never happens. Yes, there is legal risk, but charter commissions exist to test the boundaries of local self-governance. If we don't propose it, the law never evolves. I'm asking for a recommendation that challenges the AG to clarify, not a guarantee of immunity."

  **Soft Spot:**
  If state statute is explicit ("All voters must be citizens"), you have no leg to stand on. You are relying on a constitutional argument that courts have been hesitant to support recently. If the Attorney says "It's clearly preempted," you cannot argue law better than they can.

  #### 2. The "Second-Class" Ballot
  **Who:** The City Clerk (joined by Immigrant-Rights Organizers)
  **Objection:** "You're proposing a separate ballot for these residents. Practically, that means printing two versions, training poll workers to distinguish eligibility, and creating a separate lane at the booth. Ethically, it creates a segregated voting experience. Are we really telling these residents they can't handle the full ballot? It institutionalizes the idea that they aren't full participants."

  **Your Reply:**
  "I hear the stigma concern, and it's serious. But the alternative is asking non-citizens to vote on federal races they are legally barred from influencing, which creates a different legal liability. The separate ballot isn't about capacity; it's about jurisdiction. Just as a 17-year-old working in city hall doesn't vote for the President, a non-citizen resident shouldn't vote on federal mandates. We can mitigate the stigma by making the local ballot the *primary* focus in municipal elections, but we cannot expose the city to liability for federal election interference. I'd rather have a separate ballot and a voice, than no ballot and silence."

  **Soft Spot:**
  This is morally weak. "Separate but equal" arguments have a terrible history. The Organizers may publicly break with you on this. If the Clerk says the cost is prohibitive, the Councilors will kill it instantly.

  #### 3. The Political Poison Pill
  **Who:** City Councilor #1 (Worried about re-election)
  **Objection:** "Let's be blunt. In this climate, 'non-citizen voting' is a headline that gets me primaried. If turnout among this group is low—which data suggests it might be—it looks like we're rigging the system for a niche interest group without broad buy-in. Why should I vote for a policy that makes me a target, when the benefit is marginal?"

  **Your Reply:**
  "That's a real political cost, and I appreciate your honesty. But the counter-risk is governing a city where 20% of the taxpayers have zero say in how their money is spent. That's a governance crisis waiting to happen. The sunset clause is your insurance policy: if this becomes a backlash issue, it expires in eight years. If it works, you get to claim credit for expanding democracy. Right now, the status quo is that your constituents pay for schools they can't vote on. That's a quieter, but deeper, legitimacy problem."

  **Soft Spot:**
  Councilors care more about the next election than the next decade. If the "backlash" is immediate and the "benefit" is abstract, they will vote no. The sunset clause helps, but it doesn't remove the campaign attack ad.

  #### 4. The Arbitrary Line
  **Who:** Immigrant-Rights Organizer
  **Objection:** "You're talking about 'subjection,' but then you draw a line at three years. Why does the refugee who's been here two years and pays taxes not suffer under the same coercion? And the sunset clause implies their right to representation is temporary, contingent on a study. This feels like a compromise that sacrifices the most vulnerable new arrivals to make the policy palatable for voters."

  **Your Reply:**
  "I understand that frustration. The three-year bar isn't about moral worth; it's about proving 'permanent subjection' versus temporary presence. We need a proxy for intent to stay, and residency duration is the only administrable one we have. As for the sunset: I know rights shouldn't expire. But this commission doesn't have the power to make permanent law without political cover. The sunset is the price of admission to get *any* voting rights established. I'd rather secure a foothold for your community now than hold out for a perfect policy that never passes."

  **Soft Spot:**
  You are asking them to accept exclusion for some of their clients to benefit others. The "price of admission" argument sounds cynical to activists. They may view this as co-optation.

  #### 5. The Data Challenge
  **Who:** The Political Scientist
  **Objection:** "You're assuming this increases engagement. In Takoma Park and San Francisco, non-citizen voter registration has been historically low, often under 10%. If we overhaul the election system for a turnout rate that low, haven't we just created expensive bureaucracy for a symbolic gesture?"

  **Your Reply:**
  "Low initial uptake is common with any franchise expansion, including women's suffrage and 18-year-old voting. It takes time to build trust, especially in communities wary of government data collection. But 'low turnout' is better than 'zero turnout.' Even a 10% bloc forces candidates to acknowledge issues in those neighborhoods. Currently, candidates can ignore non-citizen neighborhoods entirely. This changes the incentive structure, even if the raw numbers are small at first."

  **Soft Spot:**
  If the data shows near-zero usage, the Councilors will call it a waste of money. You need to argue for *potential* influence, not just raw vote counts.

  ---

  ### The Known Objections (Folded In)

  **The "Why Not 16?" Question**
  **Objection:** "If the logic is 'affected by the laws,' why not lower the voting age to 16? They go to the schools and live in the zone."
  **Reply:** "Minors have legal guardians who are presumed to advocate for their interests in the civic sphere. Non-citizen residents are legal adults with no such proxy. They sign leases, pay taxes, and face deportation without a guardian's buffer. The voting age is a developmental standard; citizenship is a legal status. We are correcting a legal status mismatch, not redefining adulthood."
  **Soft Spot:** "Presumed advocacy" is weak for kids in foster care or unstable homes, but don't get dragged into that weeds. Stick to the legal adult status.

  **The "Compulsory Voting" Question**
  **Objection:** "If the problem is an unrepresentative electorate, why not compulsory voting for citizens? That fixes the turnout bias without changing eligibility."
  **Reply:** "Compulsory voting enforces participation among those who *can* vote but choose not to. It doesn't solve the problem of people who *want* to participate but are legally barred. Also, enforcement penalties disproportionately hurt the poor. We should expand the pool, not force the existing pool."
  **Soft Spot:** Compulsory voting *would* solve the "unrepresentative" argument faster. You have to admit that, but argue it's politically impossible and doesn't address the "taxation without representation" injustice.

  ---

  ### The Dreaded Question

  **Who:** The Political Scientist or the Attorney (asked quietly, seriously)
  **Question:** "You naturalized. You went through the process. If the barrier is federal naturalization, why is the solution not to advocate for fixing that backlog, but to create a parallel, local-only voting class? Are you lowering the value of the citizenship you just earned?"

  **Why you dread it:** It attacks your personal integrity and suggests you are devaluing your own achievement to solve a personal grievance about your wife.

  **Your Reply:**
  "That's a fair challenge. I value my citizenship deeply. But the naturalization backlog is a federal failure that won't be fixed in time for my wife to vote in the next school board election. I'm not trying to devalue citizenship; I'm trying to value *residency*. National citizenship governs borders and war. Local residency governs trash and schools. Decoupling them doesn't lower the value of the passport; it acknowledges that my wife is already a full member of *this* community, regardless of what the federal government says. I advocate for federal reform too, but I can't tell my neighbors to wait ten years for a federal fix when the city council is voting on their streetlights tomorrow."

  **Soft Spot:**
  It admits that this is a workaround for federal dysfunction. It risks sounding like you're giving up on the broader fight for immigration reform. Keep the focus on the *local* impact.
