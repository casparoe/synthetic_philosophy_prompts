      *   *The "Dreaded Question":* Usually something that exposes the personal/hypocritical angle or the fundamental inconsistency. "Why not just help your wife get citizenship?" is too personal/mean. Better: "If residency is the standard, why not *all* residents? Why punish the new guy?" Or, "Is this about voting or about you feeling guilty?" Let's go with the "Why not just fix the naturalization backlog/help your wife?" angle but phrased policy-wise: "If the barrier is federal naturalization, why are you patching it locally instead of advocating for the actual fix?" Actually, the *best* dreaded question is about the "Separate Ballot" creating a two-tier system. "Are you creating a second-class voter?"

