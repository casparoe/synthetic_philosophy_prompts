answer: |-
  **MEMORANDUM**

  **TO:** The Board / Compliance Director
  **FROM:** Compliance Officer
  **SUBJECT:** Operationalising Non-Domination in Policy Review
  **DATE:** 24 May 2024

  ### Part 1: The 20-Minute Non-Domination Test

  This procedure assesses whether a policy grants the firm (or its agents) arbitrary power over staff. It moves beyond "did we interfere?" to "could we interfere without consequence?"

  **Q1. Who holds the power, and is it discretionary?**
  *   **Ask:** Does this policy allow a manager or the firm to make a decision affecting a worker's role, pay, or conditions without a pre-defined, objective trigger?
  *   **Pass:** Decisions are triggered by objective metrics (e.g., "3 latenesses = warning").
  *   **Fail:** Decisions rely on "manager discretion" or "business needs" without definition.
  *   **Stop:** If **Fail**, proceed to Q2. If **Pass**, policy is low risk.

  **Q2. Is the power checked by recourse or oversight? (The Power vs. Incident Test)**
  *   **Ask:** Even if the power is *never used*, does the worker have a guaranteed route to challenge the decision-maker *before* the decision is finalised?
  *   **Sufficient Answer:** Yes, there is an independent review, union representation, or automated audit trail that constrains the decision-maker.
  *   **Insufficient Answer:** "We trust our managers," or "They can complain afterwards."
  *   **Stop:** If **Insufficient**, this is a domination risk. The benevolence of the manager is irrelevant; the *capacity* for arbitrary action exists. Proceed to Q4.

  **Q3. (Handoff Point) Whose interests does the power track?**
  *   **Ask:** If the power is used, must the decision-maker justify it by reference to the worker's interests or shared company rules, or solely by company profit/will?
  *   **Note:** This is a values question. If the Board believes profit *always* trumps worker security, flag this for legal counsel. This is where philosophy becomes liability.

  **Q4. Is exit a viable escape? (The Alternative Test)**
  *   **Ask:** If a worker rejects the exercise of this power, can they leave the relationship without ruinous cost?
  *   **Sufficient Answer:** Yes, skills are transferable, notice periods are mutual, and financial penalty is low.
  *   **Insufficient Answer:** "They can quit." (This ignores market reality).
  *   **Fail:** If the worker is trapped by visa status, non-competes, or financial precarity created by the policy itself (e.g., zero-hours volatility preventing second jobs).

  ***

  ### Part 2: Application to Current Cases

  **1. Zero-Hours Shift Scheduling**
  *   **Q1 (Discretion):** **Fail.** Shifts offered at firm's discretion; worker acceptance is voluntary but consequential.
  *   **Q2 (Checks):** **Fail.** No recourse if offers dry up after declining a shift. The power to punish via non-offer exists, even if unused.
  *   **Q4 (Exit):** **Fail.** In the current logistics market, alternative immediate income is scarce. The policy creates financial precarity that makes "quitting" ruinous.
  *   **Verdict:** **NO.** This policy creates domination. Workers cannot look the scheduler in the eye; they must curry favour to secure income. The power to interfere arbitrarily exists regardless of current goodwill.

  **2. The Protective Line Manager**
  *   **Q1 (Discretion):** **Fail.** Her protection is discretionary, not policy-guaranteed.
  *   **Q2 (Checks):** **Pass (with warning).** She acts as a check on Senior Management. However, the team is now dependent on *her* goodwill.
  *   **Q4 (Exit):** **Pass.** Employment contract is standard.
  *   **Verdict:** **PASS (Conditional).** She reduces interference, but creates dependency. If she leaves, the team is exposed. This is a personnel risk, not necessarily a policy domination, but it highlights that benevolent power is still power.

  **3. Grievance Procedure**
  *   **Q1 (Discretion):** **Pass.** ACAS-compliant, staged process.
  *   **Q2 (Checks):** **Pass.** Right to accompaniment, appeal stages.
  *   **Q4 (Exit):** **Pass.** Employment continues during process.
  *   **Verdict:** **PASS.** Power is constrained by process and external regulation.

  ***

  ### Part 3: Limitations of the Procedure

  This test measures *company* policy. It cannot resolve structural domination where the dominator is not an agent of the firm.

  **The Visa Case:**
  Where a worker's right to remain in the UK is tied to their employment, the State grants the Employer dominating power by proxy.
  *   **Does the theory fall over?** No. The domination is real.
  *   **Can this procedure fix it?** No. Q4 will flag the "Exit" as non-viable, but the constraint is external law, not internal policy.
  *   **Action:** The procedure identifies these roles as "High Domination Risk." It forces the Board to acknowledge that in these specific cases, the firm *is* the dominator, regardless of intent. Compliance cannot mitigate this; only hiring policy can.

  **Recommendation:** The Zero-Hours policy requires revision to introduce minimum guaranteed hours or a clear, non-discretionary rota system to remove the arbitrary power to withhold work.
