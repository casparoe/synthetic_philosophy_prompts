prompt: |-
  Bit of an odd one. I'm the compliance person at a mid-sized UK logistics firm and I have to review our whole staff rulebook — about sixty policies, contracts included — every year before the board signs it off. My director keeps saying the only thing that matters is whether we actually interfere with anyone. I know thats just the negative story, and I can't do much with the positive/self-mastery one inside a rulebook, but I've read enough about the third one, non-domination, to think it's the one that would actually bite — the idea being that what matters isn't interference but whether someone has a standing power to interfere with you on an arbitrary basis, and that the test is meant to be something like whether you can look the person in the eye without needing their goodwill. Trouble is, nobody can act on it.

  So write me a procedure I can run on a single policy in about twenty minutes: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands off to a human because it's turned into a question of values rather than facts. I'm not a philosopher and the board won't read more than a page. Two things it has to get right, because they're where I keep going round in circles: (i) it's the power that matters, not the incident, so a manager who never actually interferes can still be a problem if her team would be in trouble the moment she left; and (ii) whether being able to quit counts as an escape, which I think should depend on what the alternative is rather than on how bad the current job is. Then run it on three things — our zero-hours shift scheduling, where people can and do turn down shifts; a line manager who shields her team from senior management and is adored for it; and our grievance procedure, which I think is fine. I want one of those to come out as a no I won't like, so dont soften it. Finally, tell me what the procedure can't do, including the case I've been told about where the thing doing the dominating isn't a person at all — a visa rule tying someone's right to stay in the country to staying in the job — I can't tell whether that's meant to count or whether the theory just falls over there. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Compliance officer at a mid-sized UK logistics firm.
      *   **Task:** Review staff rulebook (60 policies/contracts) annually for board sign-off.
      *   **Problem:** Director focuses only on "non-interference" (negative liberty). User knows about "non-domination" (republican liberty, likely Pettit/Skinner) but finds it hard to operationalize.
      *   **Goal:** A 20-minute procedure to test a single policy against the non-domination criterion.
      *   **Constraints:**
          *   Must be one page (board won't read more).
          *   British English.
          *   Must address two specific sticking points: (i) Power vs. Incident (capacity to interfere arbitrarily matters, not actual interference), (ii) Exit rights (quitting isn't always an escape; depends on alternatives).
          *   Must apply the procedure to three specific cases: Zero-hours scheduling, Protective Line Manager, Grievance Procedure.
          *   One case *must* result in a hard "No" (fail).
          *   Must explain limitations, specifically regarding structural domination (e.g., visa ties) where no specific person is the dominator.
      *   **Tone:** Professional, practical, direct, not philosophical jargon-heavy but theoretically sound.

  2.  **Deconstruct the Theory (Non-Domination):**

      *   *Core Concept:* Freedom is not just the absence of interference (Negative Liberty), but the absence of the *capacity* for arbitrary interference (Domination).
      *   *Key Test:* "Looking the powerful in the eye without fear or favour."
      *   *Arbitrariness:* Interference is arbitrary if it tracks the dominator's will, not the interests/ideas of the dominated.
      *   *Power vs. Incident:* A benevolent master is still a master. If they *can* interfere without check, domination exists.
      *   *Exit:* Quitting only negates domination if the exit option is viable and doesn't incur huge costs (i.e., you aren't trapped).

  3.  **Drafting the Procedure (The "20-Minute Test"):**

      *   Needs to be step-by-step.
      *   Needs clear Pass/Fail criteria.
      *   Needs to handle the "Power vs. Incident" and "Exit" issues explicitly.
      *   *Step 1: Identify the Power.* Who can do what to whom?
      *   *Step 2: Check Constraints.* Is that power checked by rules, oversight, or recourse? (Addresses Power vs. Incident).
      *   *Step 3: Check Arbitrariness.* Does the power holder have to justify decisions based on shared interests/rules?
      *   *Step 4: Check Exit.* If things go wrong, can they leave without ruin? (Addresses the Exit issue).
      *   *Handoff Point:* Where does it become values? When "shared interests" are debated.

  4.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Zero-Hours Scheduling.*
          *   *Power:* Company offers shifts, worker accepts/declines.
          *   *Domination Risk:* If declining leads to fewer future offers (punitive), or if income is too volatile to plan life.
          *   *Exit:* Can they get another job easily? In logistics, maybe, but if zero-hours is the norm, maybe not.
          *   *Verdict:* This is the likely "No". Even if they *can* turn down shifts, the *power* rests with the scheduler to punish them by not offering more. The worker lives at the mercy of the roster.
      *   *Case 2: Protective Line Manager.*
          *   *Power:* Manager shields team.
          *   *Domination Risk:* Low interference. But is it arbitrary? If the protection is personal favouritism, the team is dependent on *her* goodwill. If she leaves, they are exposed.
          *   *Verdict:* Borderline, but likely a "Pass" on the procedure, though flagged for risk. The prompt asks for one "No I won't like". Zero-hours is the structural policy issue; the manager is a personnel issue. Zero-hours is a better candidate for a policy "No". Let's make the Manager a "Pass with Warning" (dependency risk) and Zero-Hours the "Fail".
          *   *Wait, re-reading prompt:* "I want one of those to come out as a no I won't like." The user thinks the Grievance Procedure is fine. The Manager is adored. The Zero-Hours is standard industry practice but ethically fraught. Zero-Hours is the best candidate for a hard "No" based on non-domination theory (precarity = domination).
      *   *Case 3: Grievance Procedure.*
          *   *Power:* Employee raises issue, Company investigates.
          *   *Domination Risk:* If the process is opaque or retaliatory.
          *   *Verdict:* Pass (assuming it's ACAS-compliant).

  5.  **Addressing the Limitations (Structural Domination):**

      *   The Visa example.
      *   Non-domination theory (Pettit) usually focuses on *agents*. Structural domination is harder.
      *   If the state ties visa to employment, the employer gains dominating power *because* of the state.
      *   The procedure tests *company policy*. It can't fix immigration law.
      *   Limitation: The test identifies where the company *benefits* from external domination, but can't resolve the root cause.

  6.  **Refining the Output (British English & Board Format):**

      *   Use "programme", "centre", "authorised".
      *   Keep it crisp.
      *   Ensure the "No" on Zero-Hours is clear and uncomfortable.

  7.  **Drafting - Section by Section:**

      *   *Intro:* Acknowledge the Director's view but frame Non-Domination as risk management (arbitrary power = liability).
      *   *The Procedure:* 4 Questions.
      *   *The Application:* Zero-hours (Fail), Manager (Pass/Watch), Grievance (Pass).
      *   *Limitations:* Structural issues (Visas).

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep questions binary where possible.
      *   *Critique:* Did I address the "Exit" point correctly?
      *   *Fix:* Ensure Question 4 explicitly asks about the *cost* of exit, not just the *right* to exit.
      *   *Critique:* Did I address the "Power vs. Incident"?
      *   *Fix:* Ensure Question 2 asks about the *capacity* to act, not past actions.
      *   *Critique:* The Manager case. If she shields them, is she dominating them? No, she's buffering them. But if her protection is arbitrary (based on her whim), the team is dependent on her. If she goes, they suffer. This is "dependency". But is it domination *by the policy*? The prompt asks to review policies/contracts. The Manager is a "situation". I need to treat it as a "management practice policy". Let's frame it as "Discretionary Protection". Actually, the prompt says "run it on three things... a line manager". Okay, I'll treat the manager's *modus operandi* as the subject.
      *   *Decision:* Zero-Hours is the policy fail. Manager is a "Pass but risky" (dependency). Grievance is a "Pass".
      *   *Wait, one "No I won't like".* Zero-hours is the most likely to upset the Director/Board because it's a flexible working model they probably rely on.
      *   *Visa Issue:* Need to be clear that the procedure tests *company* power, but must acknowledge where company power is amplified by state power.

  9.  **Final Polish:** Check tone. Ensure it sounds like a Compliance Officer talking to a Board/Director. Not academic, but rigorous.

      *(Self-Correction on the Manager Case)*: If the manager shields the team, she is exercising power. If she does it arbitrarily (adored, but maybe inconsistent), the team relies on her goodwill. If she leaves, they are exposed to senior management. This fits the "Power vs Incident" trap. She might not interfere, but she holds the key. However, the prompt says she is "adored". The domination risk is actually *Senior Management's* power over the team, which the manager mitigates. But if the *policy* allows her this discretion without oversight, is that domination? Actually, the prompt asks to run the test on the *manager*. I will conclude that while she reduces interference, she creates *dependency*. If her protection is discretionary, it's domination. I'll mark it as a "Pass" for now to save the "No" for Zero-Hours, but highlight the risk.
      *Actually, let's make Zero-Hours the hard "No".* It fits the "Exit" criterion best. If the alternative to a zero-hours job is unemployment, the exit isn't real.

      *(Refining the Visa point)*: The theory doesn't fall over, but the *company procedure* hits a wall. The company becomes the dominator by proxy of the State. The procedure should flag this as "External Domination Amplification".

  10. **Final Review against constraints:**
      *   20 mins? Yes, 4 questions.
      *   One page for board? The procedure itself is short. The analysis follows.
      *   British English? Yes.
      *   Power vs Incident? Included in Q2.
      *   Exit/Alternatives? Included in Q4.
      *   One "No"? Zero-hours.
      *   Limitations/Visa? Included at end.

