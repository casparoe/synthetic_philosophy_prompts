answer: |-
  Your intuition is remarkably sharp. You have identified a fissure between our folk metaphysics and our institutional practices. The three domains you cite—heritage conservation, art authentication, and legal personhood—do indeed operate on a shared, tacit theory of identity, though they apply it to different sorts of objects (structures, artefacts, and organisms).

  Here is a reconstruction of that implicit theory, an analysis of what it excludes, and a projection of what would occur should you shift your novel's world to a purely informational criterion.

  ### The Implicit Theory: Spatiotemporal Continuity and Causal Genesis

  The practices you describe presuppose a theory of identity best described as **Spatiotemporal Continuity grounded in Causal Genesis**.

  In this view, an object is not defined by the sum of its parts (material constitution), nor by the arrangement of those parts (pattern or structure), but by its **unbroken history of existence** originating from a specific genesis event. To be the "same" cathedral, painting, or person, the entity must trace a continuous path through space and time back to its origin, without a gap in existence.

  1.  **The Cathedral:** When stones are replaced gradually, the *structure* maintains its spatiotemporal continuity. The function and location persist without interruption. The "building" is treated as a four-dimensional 'worm' extending through time; as long as the worm is not severed, the material composing its cross-section at any given moment is irrelevant. However, if the cathedral is demolished, the worm is severed. Rebuilding it starts a new worm, even if it looks identical.
  2.  **The Painting:** Retouching preserves the physical continuity of the canvas and the historical chain of custody from the artist's hand. A forgery,即便 materially indistinguishable, lacks the correct causal genesis. It does not originate from the artist's creative act; it originates from the forger's hand. The value lies in the **provenance**, which is a record of this causal chain.
  3.  **The Person:** The law generally adopts the **Biological View** of personal identity. You are the same person because you are the same living human organism. The continuity of the biological life process overrides the discontinuity of memory or character. The "genesis" is birth; the "continuity" is the metabolic and biological persistence of that organism.

  **What is being tracked?**
  In all three cases, what is being tracked is **historical particularity**. We are not tracking *what* the thing is (its qualities), but *that* it is (its history). We are tracking the specific instance of existence, not the universal type.

  ### Rival Accounts Ruled Out

  This institutional framework quietly but firmly rules out three competing philosophical accounts of identity:

  1.  **Material Constitution:** If identity were tied to matter, the cathedral would cease to be the original once the first stone was swapped, and the painting would cease to be original once the first pigment flaked. The practices reject this; matter is fungible, history is not.
  2.  **Psychological or Pattern Continuity:** If identity were tied to information, memory, or structure, the brain-injured victim might be considered a new person (as her psychological pattern is disrupted), and the perfect forgery might be considered the original (as its visual pattern is identical). The law rejects the former; the art trade rejects the latter.
  3.  **Qualitative Indiscernibility:** The principle that "if it looks exactly the same, it is the same" is explicitly rejected by the art trade. A perfect copy is a forgery precisely because identity is not reducible to observable properties.

  ### Presupposition vs. Compatibility: Where the Theory is Underdetermined

  You ask whether these practices *require* this theory or are merely *compatible* with it. This is where the underdetermination lies. While Spatiotemporal Continuity is the working model, the practices are not philosophically uniform.

  **1. The Tension of the 'Sortal' Concept**
  The practices agree on continuity, but they disagree on *what* is continuing.
  *   In **heritage**, the persisting object is a *functional structure*. It can survive the replacement of parts because its identity is tied to its form and function in a specific location.
  *   In **law**, the persisting object is a *biological organism*. It survives psychological change because its identity is tied to the life of the animal.
  *   **Underdetermination:** There is no single theory unifying the cathedral and the person. If we treated the person like the cathedral, we might allow for gradual replacement of parts (your clinic's premise). If we treated the cathedral like the person, we might insist that the original stones are essential to its 'life'. The practices are compatible with Spatiotemporal Continuity, but they apply it to different *sortals* (categories of being).

  **2. The Threshold of Replacement**
  The practices do not specify *how much* change is permissible before continuity is broken.
  *   A painting can be retouched, but if it is painted over entirely by a new artist, it becomes a palimpsest or a ruin, not the original.
  *   **Underdetermination:** There is no settled metric for the rate of change. Your clinic relies on the "gradualness" of the neuron replacement (the Ship of Theseus paradox). The law has no precedent for this because biological replacement of neurons does not currently happen. The practice is silent on whether continuity can survive a *substrate shift* (from carbon to silicon), provided the causal chain is unbroken.

  ### The Informational Shift: Consequences of a Pattern-Based Identity

  If we were to replace the presupposed view (Spatiotemporal/Biological Continuity) with a **Purely Informational Criterion** (Patternism)—where identity is defined by the faithful specification of structure and function, regardless of substrate or history—the consequences for your novel's world would be radical.

  Under Patternism, whatever can be faithfully specified is what persists. Identity is software, not hardware; it is the score, not the performance.

  **1. Would Forgery Cease to be a Wrong?**
  *   **Metaphysically:** Yes. If the pattern is identical, the copy *is* the original. There is no metaphysical distinction between the painting created by the master and the perfect replica created later.
  *   **Economically:** The market would collapse or transform. Value would no longer reside in scarcity or provenance ('aura', as Walter Benjamin termed it), but in fidelity. A forgery would only be a 'wrong' if it lied about its fidelity (e.g., claiming to be a higher resolution copy than it was). However, the *romance* of the object would vanish. The art trade relies on the fetishisation of the specific historical artefact. Under an informational regime, art becomes content.

  **2. Would the Rebuilt Cathedral Become the Cathedral?**
  *   **Yes.** If the identity of the cathedral resides in its design, location, and function (the information), then a demolition and perfect reconstruction restores the cathedral. The gap in time is irrelevant if the 'data' is preserved.
  *   **Implication:** Heritage status would attach to blueprints and sites, not fabrics. We would see no moral distinction between restoring a ruin and 3D-printing a new one on the same spot.

  **3. Would Your Character Inherit Her Own Estate?**
  *   **Yes.** This is the crux of your plot. Under the current legal view (Biological Continuity), if her biological brain is entirely replaced, she is likely dead, and the entity leaving the clinic is a new being (or a construct) with no claim to the estate.
  *   **Under an Informational Criterion:** Since her memories, personality, and cognitive patterns are preserved continuously, she is the same person. The change of substrate (biological neuron to synthetic equivalent) is irrelevant, akin to the cathedral's stones.
  *   **The Conflict:** Your novel's tension arises because the clinic is selling an **Informational** product (continuity of mind) within a **Biological/Legal** framework (continuity of organism).
      *   If the law adopts the informational view, the clinic is safe.
      *   If the law holds to the biological view, the patient is legally dead upon the completion of the procedure. The entity walking out is a 'new' person who happens to have the deceased's memories. She would not inherit her estate; she would likely be considered the owner of nothing, or perhaps the estate would pass to her next of kin, treating her as a deceased ancestor.

  ### Conclusion for the Novelist

  The practices you have identified are not merely compatible with Spatiotemporal Continuity; they are **institutional defences** of it. They protect the value of history, scarcity, and biological lineage.

  Your clinic threatens to decouple identity from history. If you wish to heighten the drama, consider that the legal and art worlds resist the informational view not because it is logically incoherent, but because it is **economically and socially catastrophic** for them.

  *   **The Forgery Case:** Shows that we value *origin* over *quality*.
  *   **The Cathedral Case:** Shows that we value *process* over *material*.
  *   **The Legal Case:** Shows that we value *biology* over *psychology*.

  Your character falls into the gap between the Cathedral (where process allows replacement) and the Law (where biology forbids it). If the law were to accept her claim, it would have to admit that a human being is more like a cathedral than an animal. That is a theological and legal revolution, not merely a medical one.

  In British law, specifically, the concept of the 'legal person' is tightly bound to the 'natural person' (the human animal). To sever that tie is to invite a crisis of accountability. If the synthetic successor commits a crime, can she be punished? If she is not the biological organism, can she be imprisoned? The law tracks the body because the body is what can be held.

  Your novel, therefore, is not just about consciousness; it is about whether our institutions can survive the discovery that we are, in fact, information.
