      *   *The "Fatal" ranking:* Is it truly fatal? Many philosophers (Putnam) lived with this. It's fatal to *coherence* if not handled carefully, but maybe not to *utility*. I should classify it as "Threatens Coherence" rather than "Logically Impossible."
      *   *The "Statement" issue:* This is the Wittgensteinian ladder problem. You use absolute notions to climb up to deny them. Can you kick the ladder away?

  7.  **Final Polish:** Check against the specific constraints.
