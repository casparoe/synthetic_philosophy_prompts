prompt: |-
  You're a philosopher of mind who works on naturalistic accounts of content, so think this through carefully before you write, and then write me an essay that actually lands on a verdict -- no ending on a fence.

  Sketch the landscape first (Dretske-ish indicator semantics, Millikan-ish biosemantics, the disjunction/indeterminacy objection, swampman-type cases), then turn to the case that's been bugging me for weeks and that I keep going back and fourth on:

  A parasite infects a host and rewires its brain so that the host climbs to the top of a stalk and freezes there. That's good for the parasite, since a bird eats the host and the parasite finishes its life cycle inside the bird. Call C the host's internal state that triggers the climb. C is only in the host because the parasite's lineage was selected to build it there. The host's own lineage was never selected to produce C, and C is bad for the host.

  Here's what I want you to settle: does C have content, and if so, whose? Millikan's story says a state's content comes from what it was selected for, but the selecting here is done by the parasite's lineage, not the host's. The moves I can see are: (a) C has content, fixed by the parasite's selection history, so content is relative to a lineage or a purpose, and saying that a state represents something is incomplete until you say for whom; (b) C has no content, since being hijacked isn't representing and the host's own mechanisms have no proper function of that sort; (c) the case is a reductio, because it shows teleosemantics will let any system confer content on any state it happens to select for, which makes content too cheap to do the work it was supposed to do. I might be missing a move -- say so if I am. Pick a verdict, defend it, and tell me what it costs.

  One extra paragraph at the end: if a later host lineage gets selected to use C for its own purposes (climbing to escape floods, say), does the content now belong to the host, does the state carry two contents depending on which lineage's history you trace, or does the content change hands entirely?

  Also, say how confident you are in your verdict and flag the single step you're least sure about.
