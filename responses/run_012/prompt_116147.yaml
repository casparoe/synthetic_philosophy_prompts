answer: |-
  To naturalize mental content is to explain how a state inside a physical organism can be *about* something outside it without invoking magic. The landscape of this project is defined by the tension between current causal role and historical etiology. Fred Dretske's indicator semantics grounds content in nomic covariance: a state means $X$ if it carries the information that $X$, typically established through a learning period that filters out noise. This handles the "disjunction problem" (why a frog's snap means *fly* and not *fly-or-BB*) by appealing to the conditions under which the learning occurred. Ruth Millikan's biosemantics radicalizes the historical constraint: content is determined by *proper function*. A state represents $X$ if the mechanism producing it was selected for correlating with $X$ to guide a consumer system (like muscles) to survival-enhancing outcomes. This elegantly solves misrepresentation (a state can malfunction relative to its history) and handles Swampman cases (a duplicate without history has no content, because it has no proper function).

  The parasite case you describe strikes at the heart of the "history" constraint. We have a host brain state $C$. $C$ causes climbing. $C$'s presence in the host population is explained by the *parasite's* selection history, not the host's. The host's lineage did not select for $C$; indeed, $C$ is maladaptive for the host.

  We must choose between your options. Option (c), the reductio, is too quick. Teleosemantics does not allow *any* system to confer content; it requires a lineage-based selection history. A rock knocking a neuron into a firing pattern does not create content, because there is no reproduction of the mapping. The parasite case involves genuine biological selection, so it passes the "cheap content" threshold. Option (b), that $C$ has no content, treats the host as a unified semantic agent whose internal states must all serve its own proper functions to count as representations. But this risks begging the question: if a state systematically guides behavior based on a selection history, denying it content makes the systematicity inexplicable in semantic terms. It reduces $C$ to mere noise, yet $C$ is clearly signal—just signal for a different master.

  Therefore, I land on **Option (a): $C$ has content, fixed by the parasite's selection history.** Content is relative to the lineage that explains the specific mapping between the state and the world.

  Here is the defense. Teleosemantics is an etiological theory. It asks: "Why is this correlation here?" In the standard case, the host's lineage explains why neural state $N$ correlates with food. In the parasite case, the host's lineage explains the *substrate* (the neurons), but the parasite's lineage explains the *specific wiring* of $C$ to the climbing behavior. The "consumer" of $C$ (the motor systems driving the climb) is being manipulated to serve the parasite's reproductive interests. According to Millikan, content is determined by the conditions under which the consumer was selected to operate. Since the *current* operation of the consumer (climbing when $C$ fires) is maintained by the parasite's selection, the content of $C$ is determined by the parasite's needs. $C$ represents something like "Ascend to transmission point" or simply "Climb," relative to the parasite's intentional system.

  To deny this is to privilege the host's biological boundary as metaphysically sacred for semantics. But naturalism should not respect species boundaries more than causal histories. If we insist $C$ has no content because it harms the host, we are smuggling in a normative assumption that content must be *beneficial to the bearer*. Teleosemantics only requires content to be beneficial to the *selecting lineage*. The host is, in this instance, a vessel for the parasite's semantic system.

  The cost of this verdict is significant. It fragments the cognitive agent. We usually assume that the contents of an organism's mind cohere into a single, unified perspective aimed at that organism's survival. This verdict forces us to accept that a single brain can house states with conflicting "aboutness" conditions derived from different evolutionary agents. The host is no longer a unified semantic subject but a battleground of competing intentionalities. We must also accept that introspection (if the host has it) would be opaque to this content; the host might feel an urge to climb, but the *meaning* of that urge is determined by a history the host does not share. This severs the link between first-person authority and semantic content, but that is a bullet a hardline naturalist must bite.

  Regarding your extra paragraph: if the host lineage later gets selected to use $C$ for its own purposes (e.g., escaping floods), the content **changes hands entirely**, or rather, the proper function of the mechanism updates. Teleosemantics is sensitive to the *current* proper function derived from the *most recent* stabilizing selection. If the host lineage begins to select for $C$ because it aids flood survival, the mechanism producing $C$ now has a new proper function relative to the host. The old parasitic content is extinguished because the selection pressure maintaining the mapping has shifted. The state does not carry two contents simultaneously; it carries the content corresponding to the lineage currently responsible for its reproduction as a mapping. If both lineages maintain the selection pressure (a rare co-evolutionary stability), then $C$ has dual content, relative to each lineage, but this is a case of overlapping functions, not a single state with contradictory truth conditions.

  **Confidence Level:** 85%
  **Least Sure Step:** The individuation of the "consumer" system. I am assuming the motor mechanisms driving the climb are the consumers of $C$. If one argues that the *host's* central processing is the consumer, and it is being bypassed, one could argue $C$ is not a representation for *any* system but merely a causal lever pulled by the parasite. Distinguishing between "hijacking a control lever" and "feeding a representation to a consumer" is the finest wire in this argument.
