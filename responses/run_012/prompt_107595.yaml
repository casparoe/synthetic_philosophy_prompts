  ## Philosophical Objection & Rebuttal

  **The Objection:**
  "A rational player chooses a single action, not a lottery. By using a mixed strategy to define dominance, you are assuming players can and will randomize. If players are committed to pure strategies, comparing $M$ to a lottery over $U$ and $D$ is a category error. The analyst is smuggling in 'randomization capability' to force a result that wouldn't hold for pure strategists. Furthermore, this relies on Common Knowledge of Rationality (CKR); if Player 2 doubts Player 1's rationality, Player 2 might play $C$ or $R$, making $M$ a viable best-response for Player 1."

  **The Rebuttal:**
  This objection conflates **mixing as an action** with **mixing as a benchmark**.
  1.  **Benchmark, Not Plan:** The mixed strategy $\sigma = 0.5U + 0.5D$ is not necessarily a plan Row intends to execute. It is a mathematical tool used to prove that $M$ is **never a Best Response** to any belief Row might hold about Column.
      *   *Theorem:* A pure strategy is strictly dominated (possibly by a mix) if and only if it is never a Best Response to any probability distribution over the opponent's strategies.
      *   Since $\sigma$ dominates $M$, for *any* belief Row has about Column's play, the expected utility of $\sigma$ is higher than $M$. Consequently, there is *no belief* under which $M$ is the unique best response.
  2.  **Rationality:** Rationality requires playing a Best Response to one's beliefs. Since $M$ is never a Best Response, a rational player (even one forced to play pure) should not play $M$. They should play either $U$ or $D$ depending on their belief. The mixture merely proves $M$ is inferior to *some* combination of the alternatives regardless of the belief.
  3.  **CKR:** The iteration does require CKR. Row eliminates $M$ because Row is rational. Column eliminates $C$ and $R$ because Column knows Row is rational (and thus won't play $M$). If CKR fails, the cascade stops. But given CKR, the use of mixtures as dominance tests is valid even for pure strategists because it identifies strategies that are fundamentally irrational to choose.

  **Verdict:** The objection fails. The mixture is a proof device establishing the "Never Best Response" property. It does not require the player to actually hold a lottery ticket, only to recognize that $M$ is suboptimal relative to the available alternatives in every contingency.
