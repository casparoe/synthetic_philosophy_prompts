  | **M** | $4, 0$ | $4, 2$ | $4, 5$ |
  | **D** | $0, 5$ | $10, 2$ | $0, 0$ |

  ---

  ## Model Answer

  ### 1. Initial Analysis: Pure Strategy Dominance
  We begin by checking for Strictly Dominated Strategies (SDS) using only pure strategies.

  **For Row:**
  *   Compare $U$ and $M$: $U$ yields $10$ vs $L$ (better), but $0$ vs $C$ (worse). No dominance.
  *   Compare $D$ and $M$: $D$ yields $10$ vs $C$ (better), but $0$ vs $L$ (worse). No dominance.
  *   Compare $U$ and $D$: $U$ yields $10$ vs $L$ (better), but $0$ vs $C$ (worse). No dominance.
  *   **Result:** No pure strategy is strictly dominated by another pure strategy for Row.

  **For Column:**
  *   Compare $L$ and $C$: $L$ yields $5$ vs $U$ (better), but $0$ vs $M$ (worse). No dominance.
  *   Compare $L$ and $R$: $L$ yields $5$ vs $U$ (better), but $0$ vs $M$ (worse). No dominance.
  *   Compare $C$ and $R$: $C$ yields $2$ vs $U$ (better), but $2$ vs $M$ (worse). No dominance.
  *   **Result:** No pure strategy is strictly dominated by another pure strategy for Column.

  **Conclusion:** If we restrict Iterated Elimination of Strictly Dominated Strategies (IESDS) to pure-versus-pure comparisons, the process halts immediately. Nothing is eliminated.

  ### 2. Round 1: Mixed Strategy Dominance
  We now check if any pure strategy is strictly dominated by a **mixed strategy**.

  **Row Player Analysis:**
  Consider the strategy $M$. We look for a mixture $\sigma = p \cdot U + (1-p) \cdot D$ that strictly dominates $M$.
  The expected payoff vector for $\sigma$ against Column's pure strategies $\{L, C, R\}$ is:
  *   vs $L$: $10p + 0(1-p) = 10p$
  *   vs $C$: $0p + 10(1-p) = 10 - 10p$
  *   vs $R$: $10p + 0(1-p) = 10p$

  We need these to be strictly greater than $M$'s payoffs $(4, 4, 4)$:
  1.  $10p > 4 \implies p > 0.4$
  2.  $10 - 10p > 4 \implies 6 > 10p \implies p < 0.6$
  3.  $10p > 4 \implies p > 0.4$

  **Verification:** Any $p \in (0.4, 0.6)$ works. Let us select the symmetric mixture **$p = 0.5$**.
  *   Payoff of $0.5U + 0.5D$ vs $L$: $5 > 4$
  *   Payoff of $0.5U + 0.5D$ vs $C$: $5 > 4$
  *   Payoff of $0.5U + 0.5D$ vs $R$: $5 > 4$

  **Elimination:** Strategy **$M$** is strictly dominated by the mixed strategy $\sigma = (0.5, 0, 0.5)$. Row will not play $M$.
  **Survivors:** $\{U, D\} \times \{L, C, R\}$.

  ### 3. Round 2: Pure Dominance (Unlocked)
  With $M$ removed, we re-evaluate Column's strategies against the remaining Row strategies $\{U, D\}$.
  Column's payoffs in the reduced game:
  *   **$L$:** $5$ (if $U$), $5$ (if $D$).
  *   **$C$:** $2$ (if $U$), $2$ (if $D$).
  *   **$R$:** $0$ (if $U$), $0$ (if $D$).

  **Comparison:**
  *   $L$ vs $C$: $5 > 2$ and $5 > 2$. **$L$ strictly dominates $C$.**
  *   $L$ vs $R$: $5 > 0$ and $5 > 0$. **$L$ strictly dominates $R$.**

  **Elimination:** Strategies **$C$** and **$R$** are strictly dominated by $L$. Column will not play $C$ or $R$.
  **Survivors:** $\{U, D\} \times \{L\}$.

  ### 4. Round 3: Pure Dominance (Final)
  With Column restricted to $L$, we re-evaluate Row's strategies $\{U, D\}$.
  Row's payoffs against $L$:
  *   **$U$:** $10$
  *   **$D$:** $0$

  **Comparison:** $10 > 0$. **$U$ strictly dominates $D$.**
  **Elimination:** Strategy **$D$** is strictly dominated.
  **Survivors:** $\{U\} \times \{L\}$.

  ### 5. Solution and Equilibrium Check
  The IESDS procedure terminates at the profile **$(U, L)$** with payoffs **$(10, 5)$**.

  **Nash Equilibrium Verification:**
  *   **Row:** Given $L$, $U$ yields $10$. Deviations: $M \to 4$, $D \to 0$. $10 > 4$ and $10 > 0$. No incentive to deviate.
  *   **Column:** Given $U$, $L$ yields $5$. Deviations: $C \to 2$, $R \to 0$. $5 > 2$ and $5 > 0$. No incentive to deviate.
  *   **Strictness:** Since all deviations yield strictly lower payoffs, $(U, L)$ is a **Strict Nash Equilibrium**.

  ---

  ## Analysis & Discussion

  ### 1. What feature makes the mixed step necessary?
  The necessity arises from the structure of Row's payoffs for strategy $M$. $M$ is a "compromise" strategy: it avoids the zeros that $U$ and $D$ suffer against specific columns, but it caps the upside at $4$.
  *   $U$ is high-risk/high-reward ($10$ or $0$).
  *   $D$ is high-risk/high-reward ($0$ or $10$).
  *   $M$ is low-risk/low-reward ($4$ everywhere).

  Pure dominance fails because $U$ beats $M$ in some states while $D$ beats $M$ in others. However, a **hedged mixture** of $U$ and $D$ captures the high rewards of both while smoothing out the zeros, yielding an expected payoff of $5$ everywhere. Because $5 > 4$, the mixture strictly dominates the "safe" pure strategy $M$. Without allowing mixtures as dominators, $M$ appears robust, blocking the elimination cascade.

  ### 2. Sensitivity: Weak Dominance
  **Question:** What if we relax strict dominance to weak dominance?
  **Answer:** Suppose we change Row's payoff for $M$ from $4$ to $5$ everywhere.
  *   The mixture $0.5U + 0.5D$ yields $(5, 5, 5)$.
  *   $M$ yields $(5, 5, 5)$.
  *   $M$ is now **weakly** dominated by the mixture ($5 \ge 5$).
  *   **Does the example survive?** Yes, if we eliminate $M$, the rest of the cascade ($L$ dominates $C/R$, then $U$ dominates $D$) remains valid because those inequalities were strict ($5>2$, $10>0$).
  *   **Does order matter?** In *this specific game*, no other strategy is weakly dominated initially. $M$ is the unique candidate for elimination in Round 1. Thus, order does not matter here. However, generally, IESWDS (Iterated Elimination of Weakly Dominated Strategies) is order-dependent. If there were two weakly dominated strategies where eliminating one saved the other, the final outcome could change. Here, the structure isolates $M$ as the sole weak point.

  ### 3. Dropping the "Pure Dominance Later" Requirement
  **Question:** What if later rounds allowed mixed dominance?
  **Answer:** It would not change the outcome of *this* game, as pure dominance suffices after Round 1. However, it would expand the set of solvable games. There exist games where a mixed strategy eliminates a strategy in Round 1, which reveals a second strategy that is *only* dominated by a mixture (not a pure strategy) in Round 2. Requiring pure dominance in later rounds would halt the process prematurely in those cases. The requirement in this exercise is pedagogical: to show that mixed dominance is the *key* that unlocks the door, after which standard logic takes over.

