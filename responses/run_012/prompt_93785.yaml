answer: |-
  Here is a teaching plan designed to turn your four articles into an experiential puzzle rather than a textual riddle.

  ### 1. Validate Your Intuitions
  You are correct on the theoretical order. For this session to land, students must first grasp the **Hartian distinction**:
  1.  **Primary Rules:** Rules that tell you what to do (e.g., "Pay taxes," "Do not steal").
  2.  **Secondary Rules:** Rules about the rules (e.g., "How to pass a law," "How to judge a violation").

  If they treat your four articles as primary rules (commands to obey), they will miss the point. They must treat them as **mechanisms of validity**. You are also correct that authority is conferred, not inherent. The session must lead them to the realization that when secondary rules conflict, there is no "higher" text to appeal to—only a political fact of acceptance.

  ### 2. Critique of the Four Articles (and the Fifth)
  **Your Four Articles:** They are sufficient, but **do not distribute the full text at the start.**
  If students read Articles 3 and 4 side-by-side at minute one, they will not see a paradox; they will see a drafting error. They will say, "This document is broken," and the philosophical tension vanishes.
  *   **The Fix:** To make the conflict a *discovery*, you must simulate temporality. Distribute only Articles 1, 2, and 3 at the beginning. Let them govern the room. Then, introduce Article 4 as a "recently discovered clause" or a "proposed amendment" midway through. This forces them to internalize the authority of Article 3 before challenging it.

  **The Fifth Article (Consistency Clause):** **Do not add it.**
  Adding a rule that voids inconsistent amendments ("Article 5: No amendment shall render this set inconsistent") destroys the lesson. It provides a "Rule of Recognition" that solves the paradox for them. It tells the students: "Don't worry, there is a boss rule that keeps logic safe." You want them to feel the *danger* of a system without a final arbiter. Leave the inconsistency unresolved.

  ### 3. The 90-Minute Sequence

  **Phase 1: The Setup (0–15 mins)**
  *   **Activity:** Do not mention logic or constitutions. Tell them they are a "Legislative Body."
  *   **Material:** Distribute **only Articles 1, 2, and 3**.
  *   **Task:** Ask them to pass a binding rule for the seminar (e.g., "We shall take a break at the 45-minute mark").
  *   **Goal:** They will use Art 1 (propose) and Art 2 (majority). They will succeed. They now feel the *power* of the secondary rules.

  **Phase 2: The Lock (15–35 mins)**
  *   **Task:** Ask them to amend Article 3. (e.g., "Change 'unanimous' to 'majority'").
  *   **Outcome:** They will read Article 3: *"This Article may be amended only by the unanimous consent of all members."*
  *   **Friction:** If even one student dissents (plant a colleague if necessary), the amendment fails.
  *   **Lesson:** They experience **Entrenchment**. They feel that Article 3 is "higher" or "harder" than Article 2. It creates a hierarchy in their minds: Art 3 > Art 2.

  **Phase 3: The Twist (35–50 mins)**
  *   **Action:** Distribute **Article 4**. Frame it neutrally: "It appears there was a supplementary provision in the original charter we missed."
  *   **Text:** *"Article 3 may be amended by the procedure set out in Article 2."*
  *   **Immediate Reaction:** They will spot the contradiction. "Wait, Art 3 says Unanimity, Art 4 says Majority."
  *   **The Challenge:** Ask them to vote on the amendment to Article 3 again, using the Majority procedure (Art 2), citing Art 4 as authority.
  *   **The Pull:** Now the discovery arrives. It is not a trick; it is a crisis of authority.
      *   If they follow Art 3, Art 4 is useless.
      *   If they follow Art 4, Art 3 is a lie.
      *   There is no Article 5 to tell them which one wins.

  **Phase 4: The Debate (50–75 mins)**
  *   Let them argue. Do not moderate for correctness; moderate for clarity of authority.
  *   When they say "The text settles it," ask: "Which text? They say opposite things."
  *   When they say "Majority rules," ask: "Why did you agree to Unanimity in Article 3 then?"
  *   When they say "Article 3 is stronger because it's specific," ask: "What rule says specific trumps general?" (There is none in your text).

  **Phase 5: The Close (75–90 mins)**
  *   Stop the vote. Do not resolve the paradox.
  *   Move to the closing question (see below).

  ### 4. Misconceptions and How to Head Them Off

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"The Text Settles It"** (Formalism) | Phase 3. "Someone just needs to read it carefully." | Reply: "I have read it. Article 3 says X. Article 4 says Not-X. Reading it more carefully will not make the contradiction disappear. Which rule *validates* the other?" |
  | **"It's the Liar Paradox"** (Logic Reductionism) | Phase 4. "This is nonsense/meaningless." | Reply: "In logic, a contradiction proves the system is false. In law, contradictory statutes exist all the time. Courts still have to decide cases. The question isn't 'Is this logical?' but 'Who has the power to decide?'" |
  | **"Democracy Wins"** (Normative Bias) | Phase 4. "Majority rule is obviously right." | Reply: "If democracy wins, why did we sign Article 3? Is a promise to require unanimity binding if a majority later decides it isn't? Can a rule bind the future majority?" |
  | **"Later in Time Wins"** (Lex Posterior) | Phase 4. "Article 4 was revealed later, so it wins." | Reply: "I told you it was part of the original charter, just missed. Does physical discovery change legal validity?" |

  ### 5. What to Refuse to Go Into
  At this level (graduate law/philosophy, no formal logic), you must draw boundaries to keep the seminar focused on *authority* rather than *syntax*.
  1.  **Formal Logic Systems:** Refuse to diagram the rules using propositional logic ($P \to Q$). This invites the "Liar Paradox" dismissal and alienates the law students. Keep it linguistic and institutional.
  2.  **Kelsen's *Grundnorm*:** Do not lecture on the Basic Norm. Let them *discover* the need for a basic norm through the failure of the text. If you explain it, you solve the puzzle for them.
  3.  **Historical Solutions:** Do not discuss how real constitutions solve this (e.g., Supreme Courts, rigid vs. flexible constitutions). This is a seminar on the *concept* of self-amendment, not comparative constitutional design. Keep it in the miniature order.
  4.  **The "Right" Answer:** Refuse to declare a winner. If you say "Article 3 wins," you teach entrenchment. If you say "Article 4 wins," you teach parliamentary sovereignty. If you say "It depends," you teach the Rule of Recognition. The last is the goal.

  ### 6. The Closing Question
  To test if they grasp the difference between a rule of conduct and a rule of change, ask this:

  > *"If Article 3 were a rule about how much tax we owe, and Article 4 were a rule about how much tax we owe, we would simply calculate the average or pick the later one. But because these are rules about **changing rules**, why does that contradiction threaten the existence of the system itself?"*

  **What you are looking for:**
  They should answer that a rule of conduct exists *within* a system, but a rule of change *constitutes* the system. If the rules of change contradict, there is no procedure to resolve the dispute, meaning there is no system left to interpret the tax rule. The contradiction isn't just an error; it's a collapse of authority.

  ### Summary of Advice
  *   **Sequence:** Withhold Article 4 until they feel the weight of Article 3.
  *   **Material:** Do not add Article 5; let the inconsistency stand.
  *   **Theory:** Rely on their intuition about conferred authority (Hart), but let them feel the gap where the "Rule of Recognition" should be.
  *   **Stance:** Remain agnostic on the solution. The learning happens in the struggle.
