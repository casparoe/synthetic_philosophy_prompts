  **DEPARTMENT OF PROSPECTIVE PERSONHOOD & RISK ASSESSMENT (DPPRA)**
  **Public FAQ: Form 88-B (Prospective Genesis Licensing)**

  **1. Why does the application require a detailed Suffering Impact Statement but no corresponding Joy Projection?**
  This is a matter of statutory baseline. Under the Non-Identity Provisions, a potential person who is never conceived cannot be deprived of happiness. There is no subject to experience the loss of potential joy. Therefore, calculating projected happiness is administratively redundant. Conversely, a person who is conceived and experiences significant distress has been demonstrably harmed by the act of conception. We assess harms because they attach to a specific rights-bearing entity. We do not assess benefits because the null state (non-existence) cannot be made better off. Applicants are reminded that omitting the Joy Projection is not an oversight; it is a compliance feature designed to reduce paperwork burden.

  **2. How can you claim a child is "better off" not being born if they don't exist to enjoy that state?**
  Please review the definitions in Section 4.2. The Department does not claim the non-existent person is "better off." That would imply a comparison between two states of a subject. We are comparing a state of affairs containing a suffering subject against a state of affairs containing no subject. The latter is preferred not because someone is enjoying the void, but because the negative value of pain is present in the former and absent in the latter. Confidence in this distinction is high. Applicants who insist on personifying the null baseline are advised to consult the glossary before resubmitting.

  **3. Is there ever a duty to reproduce, provided the child would be exceptionally happy?**
  No. There is a duty to avoid creating miserable lives, but there is no reciprocal duty to create happy ones. This is not a prohibition on reproduction; it is a clarification of obligation. Your license to conceive is granted *if and only if* the projected suffering falls below the statutory threshold. Happiness is irrelevant to the issuance of the permit. It may be a nice side effect, but it cannot cure a deficit in the Suffering Impact Statement. Do not list "potential greatness" as a mitigating factor. It is not a mitigating factor.

  **4. Critics argue this policy logically leads to population collapse. Is the Department concerned?**
  This is a communications issue, not a policy failure. The logic implies that while we must not create suffering, we are not required to create happiness. If applicants voluntarily choose to cease reproduction to ensure no suffering occurs, they are acting within the guidelines. The Department does not incentivize existence because existence cannot be a benefit to the non-existent. We suggest framing this locally as "Voluntary Risk Mitigation." Extinction is only a problem if you assume future people are missing out on something. As established in Question 1, they are not.

  **5. If existence can never be a net benefit compared to non-existence, does that mean every birth is technically a loss?**
  No. A birth is a loss only if it contains harm. If a life contains no harm, it is neutral relative to non-existence. It is not *better*, but it is permissible.
  *Correction:* Please note that "neutral" here refers to the axiological status of the decision, not the deontic status of the parent. You are not doing good by creating a happy child; you are simply avoiding doing bad. If this distinction suggests that the optimal moral state is one where no new subjects exist to be harmed, please refer to Question 1. The Department does not speculate on optimal states. We process forms. Submit your Suffering Impact Statement by Friday.
