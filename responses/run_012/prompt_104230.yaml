  Your student has reconstructed the core of Parfit's Hitchhiker case with commendable precision, and you are right to feel the pressure of the argument because it is formally valid. The premises do entail the conclusion, which means the only way to escape the result is to deny a premise, and since you have indicated a preference for keeping premise two, you are effectively locking yourself into a specific corner of the theoretical landscape that requires careful navigation. If you maintain that refusing to pay is the rational move at the drop-off point, you are affirming that rationality is determined by the expected utility of the act at the time of performance, given the situation actually obtaining at that moment. This commits you to premise one, the principle of act-by-act maximization, and since the argument is valid, preserving both one and two forces you to reject premise six, the claim that a theory of rationality sentencing its followers to death must be wrong.

  The cost of rejecting premise six is that you must accept that instrumental rationality can be self-defeating in structurally specific cases. This is the standard defense employed by defenders of causal decision theory and orthodox expected utility maximization, often associated with David Lewis. The view here is that rationality is not defined by success conditions but by the correctness of the deliberative process relative to the agent's situation at the time of action. At the moment of drop-off, the money is gone, the ride is taken, and the causal lever of payment no longer influences the past event of being picked up. Therefore, the reasons present at that moment strictly recommend refusal. To reject premise six is to argue that rationality is a local property of agency, a matter of responding correctly to the reasons currently available, rather than a global property of a life plan or a disposition. The price you pay for this is counterintuitive but theoretically clean: you must tell your students that being rational is not always the best strategy for getting what you want, specifically in cases where the world rewards irrationality or binds rewards to predictions of your behavior. This severs the tight link between rationality and prudential success, forcing you to define rationality as a kind of internal coherence or reason-responsiveness rather than an optimization algorithm for welfare.

  If you find that cost too high and prefer to save the intuition that rationality should not be suicidal, you must instead reject premise one, and consequently premise two as stated. This is the path taken by theorists like Edward McClennen or David Gauthier, who argue for resolute choice or constrained maximization. However, you asked not to simply wave at dispositions, and here is where the theoretical bill comes due. To reject premise one is to claim that the unit of rational evaluation is not the isolated act but the plan or the disposition itself. This means you cannot say that paying is rational at the drop-off because it maximizes utility at that moment; rather, you must say it is rational because it fulfills a plan adopted earlier when the expected utility of the plan was highest. This requires you to abandon the principle of dynamic consistency, specifically the separability condition which says that choices at later nodes should depend only on the subtree remaining at that node. You would need to argue that a past intention can provide a reason for action even when the current payoff structure recommends otherwise. This is a heavy metaphysical cost because it requires explaining how a past mental state can normatively bind a future self without changing the future self's preferences or beliefs. It risks making rationality look like a form of binding Ulysses contract that operates by magic, or it requires redefining the agent as a temporally extended entity whose rationality is assessed over the whole timeline rather than at time-slices. If you take this route, you are not just tweaking expected utility theory; you are replacing the standard account of instrumental rationality with a plan-based theory that treats agents as planners rather than moment-to-moment optimizers.

  There is a middle ground involving premise three, the claim that nobody can sincerely intend to do what they know they won't do. Some have tried to argue that an agent can intend to pay by altering their own psychology, perhaps by cultivating a taste for keeping promises or a hatred of defaulting that outweighs the monetary cost. If you can change your utility function so that paying yields positive utility, then premise two becomes false because paying does buy something, namely the satisfaction of a preference or the avoidance of guilt. However, this moves the goalposts by changing the agent rather than the theory of rationality. It requires a theory of self-binding or preference transformation that is psychologically demanding and arguably outside the scope of pure rationality, drifting into moral psychology or self-help. It also risks circularity if the only reason to adopt the preference is to get the ride, because a sophisticated agent would know the preference is adopted instrumentally and might not be able to sustain the sincerity required to fool the driver.

  Ranking these sacrifices from cheapest to dearest in terms of theoretical disruption, rejecting premise six is the cheapest because it preserves the formal machinery of expected utility theory and the standard account of instrumental rationality, requiring only a shift in how we label the outcome of rational agents. It keeps your seminar focused on standard decision theory while acknowledging its limitations in Newcomb-like problems. The next dearest is rejecting premise three, as it requires adding a layer of psychological malleability to the model of agency that complicates the distinction between rational choice and preference formation. The dearest sacrifice is rejecting premise one, because it unravel the standard account of instrumental rationality entirely, forcing you to adopt resolute choice or plan-based maximization which conflicts with the dominant paradigm of dynamic consistency and act-individualism. Since you mentioned you would most like to keep premise two, you are effectively choosing the cheapest theoretical sacrifice, which is to accept that rationality does not guarantee survival in cases where the environment punishes rationality specifically. The pedagogical value here is to show your students that the definition of rationality is itself a stake in the game, and that the student's argument successfully proves that act-by-act maximization is not the unique solution to the problem of practical reasoning, even if we decide to keep it for reasons of theoretical simplicity.
