answer: |-
  A small family trust is deciding whether to fund a speculative legal campaign aimed at overturning a national tax regulation. The cost to the trust is £1,000 per share. If successful, the regulation change would generate £5 billion in value for the beneficiaries; if it fails, the money is lost. The trustees consult two independent experts who provide differing success estimates for two identical shares available this month: Expert A estimates the probability of success at 1 in 2,000,000 ($5 \times 10^{-7}$), while Expert B estimates it at 1 in 500,000 ($2 \times 10^{-6}$). The trustees adopt a rule that any probability below 1 in 1,000,000 ($10^{-6}$) is treated as negligible, and they possess a conservative utility function that saturates quickly, valuing the £5 billion gain at only 10 'happiness units' above their current status, whereas the certain loss of £1,000 costs them 1,000 units.

  Plain expected value maximisation calculates the monetary return: Share A offers an expected return of £2,500 and Share B offers £10,000, both exceeding the £1,000 cost, so it accepts both. The probability-threshold remedy treats Share A's chance as zero (expected value £0) and rejects it, but treats Share B's chance as real (expected value £10,000) and accepts it. The bounded utility remedy calculates expected utility: Share A yields $0.0000005 \times 10 = 0.000005$ units against a cost of 1,000, and Share B yields $0.000002 \times 10 = 0.000002$ units against a cost of 1,000; since the expected gain is trivial compared to the certain utility cost in both cases, it rejects both.

  The arithmetic driving these verdicts rests on specific inequalities. For plain expected value (EV), the condition is $p \times V > C$. With $V = 5 \times 10^9$ and $C = 10^3$, both $p_1 = 5 \times 10^{-7}$ and $p_2 = 2 \times 10^{-6}$ satisfy this ($2500 > 1000$ and $10000 > 1000$). For the probability remedy, the condition is $p > \epsilon$. With $\epsilon = 10^{-6}$, $p_1 < \epsilon$ forces evaluation at zero, while $p_2 > \epsilon$ allows standard evaluation. For the bounded utility remedy, the condition is $p \times \Delta U_{gain} < \Delta U_{cost}$. With $\Delta U_{gain} = 10$ and $\Delta U_{cost} = 1000$, even the larger probability yields $2 \times 10^{-5} < 1000$. The real work is done by the discontinuity in the probability threshold and the extreme curvature of the utility function; the specific monetary figures are scaffolding provided they maintain these ratios.

  Turning the knobs reveals the fragility of both remedies. If the probability threshold is lowered to $10^{-7}$, both shares exceed it, and the probability remedy collapses into plain EV maximisation, accepting both. If the utility ceiling is raised such that the £5 billion gain is worth 1,000,000,000 units, the bounded utility remedy also collapses into plain EV, accepting both. Neither remedy is stable across parameter shifts; they only diverge from EV within a narrow calibration band. However, the probability remedy fares worse here because it violates the continuity axiom of decision theory: a infinitesimal increase in probability (from $0.99 \times 10^{-6}$ to $1.01 \times 10^{-6}$) causes a discrete jump from rejection to acceptance, implying the agent is indifferent to massive stakes based on a decimal point shift. The bounded utility remedy remains continuous, even if overly conservative.

  The strongest reply for the probability defender is that the threshold is not a hard metaphysical cut-off but a heuristic for model uncertainty or cognitive noise; below $10^{-6}$, our estimates are too unreliable to warrant action. However, I must admit the strain in this case lies primarily with the bounded utility remedy. Calibrating a household utility function such that £5 billion adds negligible value over current wealth requires assuming near-total satiation, which contradicts ordinary intuition about life-changing sums. I have forced this calibration to satisfy your constraint that the value-side remedy must reject the second gamble, but in reality, most bounded utility functions would accept a 1 in 500,000 chance at £5 billion for a £1,000 cost. The probability threshold, while discontinuous, requires less empirical strain on human psychology to justify ignoring one-in-a-million odds.
