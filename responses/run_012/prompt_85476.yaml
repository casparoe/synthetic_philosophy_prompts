answer: |-
  ### Part I: The Axes of Disagreement

  Before we hand out the paper, we need to agree on what we are actually measuring. Most arguments about the "Paradox of Tolerance" fail because participants are answering different questions. One person is talking about the *definition* of a word, another about the *survival* of a regime, and a third about the *ethics* of a dinner party.

  Based on your constraints, here are the six axes this instrument tests. When you read the questions, notice which axis is being pulled.

  1.  **The Attitude Condition (Disapproval vs. Indifference):** Toleration is logically distinct from indifference. If you do not object to a view, you are not tolerating it; you are accepting or ignoring it. This quiz tests whether respondents believe tolerance requires a negative judgment that is subsequently restrained.
  2.  **The Locus of Limits (Internal vs. External):** Are the limits of tolerance built into the concept itself (i.e., intolerance is *not* a valid claim on tolerance), or are they merely prudential (i.e., intolerance is a valid claim, but we can't afford to honor it right now)?
  3.  **The Agent of Enforcement (State vs. Association):** Does the paradox apply only to the coercive power of the state (constitutional law), or does it apply to any norm-governed practice (a knitting circle, a Discord server)?
  4.  **The Deontic Force (Permission vs. Obligation):** If a group is intolerant, is the tolerant order *permitted* to suppress them (a right), *required* to suppress them (a duty), or *forbidden* from suppressing them (a constraint)?
  5.  **The Trigger Threshold (Conceptual vs. Empirical):** Do we draw the line when the intolerant view is expressed (because it violates the norm), or only when the view becomes empirically dangerous (because it might win)?
  6.  **The Symmetry Condition (Power-Blind vs. Asymmetric):** Does the act of exclusion count the same way regardless of who does it, or does the power dynamic between the excluder and the excluded change the moral valence of the act?

  ***

  ### Part II: The Diagnostic Instrument

  **Instructions:** For each scenario, choose the option that best matches your immediate intuition about what should happen and *why*. Do not overthink consistency; answer how you feel about the specific case.

  **1. The Family Dinner**
  Your uncle comes to dinner and makes a racist joke. You find the joke morally repugnant, but you love your uncle and want peace at the table. You say nothing.
  *   A. This is tolerance: you are restraining your objection for the sake of relationship.
  *   B. This is not tolerance: if you prioritize peace over truth, you are complicit, not tolerant.
  *   C. This is not tolerance: if you didn't challenge it, you probably don't object to it enough to count as "tolerating."

  **2. The City Clerk**
  A political party registers to run for city council. Their platform is to abolish future city elections and install a permanent mayor. They have broken no laws yet.
  *   A. Ban them from the ballot. A party that ends elections destroys the system that allows them to run.
  *   B. Let them run. If the voters choose to end elections, that is their right to decide.
  *   C. Let them run, but monitor them closely. Only ban them if they start inciting violence.

  **3. The Math Seminar**
  A visiting professor presents a paper arguing that genetic differences explain gender gaps in math. The data is methodologically sound, but several female graduate students say they no longer feel safe attending the seminar.
  *   A. Cancel the seminar. The harm to the participants' ability to work outweighs the value of the data.
  *   B. Hold the seminar. The norms of mathematics require following evidence wherever it leads, regardless of feelings.
  *   C. Hold the seminar, but issue a disclaimer that the department does not endorse the social implications.

  **4. The Discord Mod**
  You run a server dedicated to open debate. A user keeps posting intolerant slurs, arguing that "free speech" protects them. The chat is becoming unusable for others.
  *   A. Ban them. You are allowed to enforce norms that protect the space, even if it limits speech.
  *   B. Ban them. You are *required* to ban them to protect the other members from harassment.
  *   C. Do not ban them. If you ban them for "intolerance," you are violating your own rule of open debate.

  **5. The Knitting Circle**
  A long-time member insists that "knitting is for women" and makes trans participants feel unwelcome. The group is small and relies on everyone's dues to rent the hall.
  *   A. Expel her. Her view contradicts the inclusive values of the group.
  *   B. Keep her. It's a private hobby group; she can think what she wants as long as she knits.
  *   C. Keep her, but only because kicking her out would cause a schism that kills the group.

  **6. The Hiring Committee**
  Two candidates make identical remarks about preferring to work with people of "their own culture." Candidate A is from the ethnic majority; Candidate B is from a marginalized minority seeking to preserve their heritage.
  *   A. Reject both. The criterion is exclusionary regardless of who says it.
  *   B. Reject A, hire B. The majority candidate's exclusion reinforces systemic power; the minority candidate's is defensive.
  *   C. Hire both. It's a private hiring decision; cultural fit is a legitimate business concern.

  **7. The School Principal**
  A student group wants to invite a speaker who denies the right of certain religions to exist. The speaker has a history of violent rhetoric but is not currently charged with a crime.
  *   A. Block the speaker. The school has a duty to protect students from harmful ideologies.
  *   B. Allow the speaker. Schools are marketplaces of ideas; bad speech is countered by more speech.
  *   C. Allow the speaker only if a rebuttal speaker is guaranteed equal time.

  **8. The Debate Society**
  Your club's constitution says "All views may be debated." A member uses procedural rules to filibuster and silence opposing views repeatedly.
  *   A. Expel them. They are abusing the rules to destroy the practice of debate.
  *   B. Let them be. The rules are the rules; if they can game them, that's part of the debate.
  *   C. Change the rules to prevent filibustering, but let the member stay.

  **9. The Newspaper Editor**
  You receive an op-ed arguing that democracy is inefficient and should be suspended. You disagree fundamentally.
  *   A. Publish it. Your job is to platform views, not judge their truth.
  *   B. Reject it. Publishing it lends legitimacy to a view that undermines your newspaper's civic mission.
  *   C. Publish it with an editor's note condemning the argument.

  **10. The Park Permit**
  A hate group applies to hold a rally in a public park. A counter-protest group promises to show up and physically stop them.
  *   A. Deny the permit. The risk of violence makes the rally a public safety threat.
  *   B. Grant the permit. The state cannot ban speech based on the reaction of opponents (the "heckler's veto").
  *   C. Grant the permit but separate the groups with police barriers.

  **11. The Landlord**
  A landlord refuses to rent an apartment to a member of a political party that advocates for rent control.
  *   A. This is intolerant. Housing is a basic need; political views shouldn't bar access.
  *   B. This is property rights. A private owner can choose who enters their building.
  *   C. This is intolerant only if the landlord is part of a dominant group targeting a minority.

  **12. The Personal Mindset**
  You encounter a view you find disgusting but which has no power to harm anyone (e.g., a lone blogger).
  *   A. You have a right to ignore it, but no duty to suppress it.
  *   B. You have a moral duty to speak against it, even if it changes nothing.
  *   C. You have a duty to suppress it if you have the platform, because allowing it pollutes the discourse.

  ***

  ### Part III: The Scoring Key (Read Aloud)

  *Note to the facilitator: Do not tally points numerically. This is not a psychometric test; it is a map of commitments. Read the profiles below and ask the group to see where their pattern of answers lands them. There is no "correct" score, only coherent and incoherent positions.*

  **1. The Militant Democrat (Constitutional Self-Defence)**
  *   **Pattern:** You likely chose **2A, 4B, 7A, 10A**.
  *   **Profile:** You believe a tolerant order is *obligated* to defend itself against existential threats. For you, the limit of tolerance is external and empirical: when a group threatens the survival of the system, tolerance becomes suicide. You distinguish sharply between the State (which must be militant) and private actors (who may have more leeway). You view the "Paradox" not as a logical trick, but as a survival instruction.
  *   **Key Commitment:** The state is *required* to suppress the intolerant when they threaten the constitutional order.

  **2. The Deflationist (Bounded Norms)**
  *   **Pattern:** You likely chose **3B, 5A, 8A, 9B**.
  *   **Profile:** You believe there is no paradox because tolerance was never infinite. For you, every practice (math, knitting, debate) has internal norms. When someone violates those norms, they aren't being "intolerant," they are just failing to participate in the practice. You don't need a grand theory of liberty to ban the knitter; you just need a rule about inclusivity.
  *   **Key Commitment:** Limits are *internal* to the specific practice, not a general political theory.

  **3. The Modus Vivendi (Prudential Realist)**
  *   **Pattern:** You likely chose **2C, 5C, 10A, 11B**.
  *   **Profile:** You are not worried about principles; you are worried about stability. You tolerate the intolerant as long as they are weak (5C), but you suppress them when they become dangerous (10A). You see the limit of tolerance as purely prudential. You might support property rights (11B) not because they are sacred, but because enforcing otherwise is too costly.
  *   **Key Commitment:** Limits are *external* and based on power/threat levels, not moral consistency.

  **4. The Neutralist (State Agnosticism)**
  *   **Pattern:** You likely chose **2B, 7B, 9A, 10B**.
  *   **Profile:** You believe the State cannot coherently "disapprove" of a view without ceasing to be liberal. For you, official toleration collapses into indifference. If the state bans a party (2A), it has taken a side. You struggle with the "Disapproval" axis (Question 1); you often lean toward 1C or 1B because you worry that "tolerating" implies a judgment the state shouldn't make.
  *   **Key Commitment:** The State is *forbidden* from judging the worth of political views, even intolerant ones.

  **5. The Open Society Defender (Epistemic Protection)**
  *   **Pattern:** You likely chose **3B, 4A, 8A, 12A**.
  *   **Profile:** You care about the *practice of reasoning*. You tolerate views that can be argued, but you exclude views that shut down argumentation (like the filibusterer in 8A or the harasser in 4A). You are distinct from the Deflationist because you care about the *epistemic health* of the society, not just local norms. You see suppression as a *permission* (4A), not necessarily a duty, unless the practice of reason itself is under attack.
  *   **Key Commitment:** Tolerance protects the *process* of giving and taking reasons; anything destroying that process may be excluded.

  **6. The Asymmetric Pluralist (Power-Sensitive)**
  *   **Pattern:** You likely chose **6B, 11C, 4A**.
  *   **Profile:** You believe the same act counts differently depending on who does it. Exclusion by a powerful group is oppression; exclusion by a marginalized group is self-defense. You reject the "Symmetry Condition." You might find the State (2A) too blunt an instrument, preferring social norms (6B) to police boundaries.
  *   **Key Commitment:** Tolerance is a demand on the *powerful*; the powerless are not held to the same standard of restraint.

  **7. The Associationist (Sphere Separation)**
  *   **Pattern:** You likely chose **2A (State bans) but 5B (Knitting keeps)**.
  *   **Profile:** You believe the Paradox applies to the State but not voluntary associations, or vice versa. You hold that the City must be neutral or militant (2A/2B), but the Knitting Circle has absolute discretion (5B). You are trying to prevent the "Who adjudicates?" problem by saying "It depends on the room."
  *   **Key Commitment:** The rules of tolerance change depending on whether the agent is coercive (State) or voluntary (Association).

  ***

  ### Part IV: Limitations and Unoccupied Space

  *Facilitator Notes: Before opening the floor, acknowledge where this instrument fails.*

  **1. The Unseparable Positions:**
  This quiz struggles to distinguish between the **Deflationist (2)** and the **Open Society Defender (5)**. In practice, both will vote to ban the disruptor in the Debate Society (Question 8). The Deflationist says, "They broke the rules of debate." The Open Society Defender says, "They destroyed the condition for reasoning." The outcome is the same; only the justification differs. If your group argues about *why* they banned the filibusterer, that is where this distinction lives. The quiz cannot fully separate them.

  Similarly, the **Modus Vivendi (3)** and the **Militant Democrat (1)** often converge on "Ban them when they get strong." The Militant Democrat claims it is a *duty* based on principle; the Modus Vivendi claims it is *prudence* based on survival. If your answers were mostly 'C' options (Monitor, Conditional), you are likely in this blurry zone.

  **2. The Unoccupied Combinations:**
  There are two answer patterns that are logically possible but philosophically uninhabited. If someone scores here, ask them to explain, because they are likely confused.

  *   **The "Moral Purist" (Obligation without Threat):** This person answers that we are *obligated* to suppress intolerant views even when they are harmless and have no power (e.g., choosing 12C "Duty to suppress" combined with 2B "Let the party run"). This view claims a duty to police thought without a prudential justification. Almost no liberal theorist defends this; it collapses into authoritarianism.
  *   **The "Indifferent Tolerator" (No Disapproval):** This person answers Question 1 with "This is tolerance" because they don't mind the joke. As we established in Axis 1, if you do not disapprove, you are not tolerating. If a participant insists on this, they have rejected the premise of the discussion. They are not solving the paradox; they are dissolving the definition of tolerance.

  **3. The "State vs. Association" Trap:**
  Be wary of participants who answer **2A** (State must ban intolerant parties) but **5B** (Knitting circle must keep the bigot). This is a common intuitive position, but it is unstable. If the State must ban intolerance to protect democracy, why shouldn't the Knitting Circle ban intolerance to protect its members? If the Knitting Circle can exclude anyone for any reason, why can't the State? This inconsistency is often where the real argument begins. Use it.
