answer: |-
  This is a profound alignment of text and context. You have identified the central nervous system of classical Indian epistemology (*pramāṇa-śāstra*) and placed it against a film that is arguably the modern West's most famous meditation on the instability of truth.

  To answer you directly: the dispute you are tracking is between the theory of **Intrinsic Validity** (*svataḥ-prāmāṇya-vāda*), held primarily by the Mīmāṃsā and Vedānta schools, and the theory of **Extrinsic Validity** (*parataḥ-prāmāṇya-vāda*), held by the Nyāya and Buddhist logicians.

  *   **The Intrinsic View (Mīmāṃsā):** When a cognition arises ("I see a pot"), it comes with a certificate of truth. You are entitled to trust it unless a specific defect (*doṣa*) is found (e.g., bad light, jaundice). Truth is the default; doubt is the anomaly.
  *   **The Extrinsic View (Nyāya/Buddhism):** A cognition is neutral. It is like an unmarked letter. Its truth is established only by external conditions (*guṇa*): the proper functioning of the senses, correspondence with reality, or, crucially, whether acting on it leads to successful results (*arthakriyā*).

  Here is a reading of *Rashomon* through this specific quarrel, followed by where the comparison illuminates and where it fractures.

  ### 1. The Gate as the Court of Extrinsic Verification
  The frame story—the Commoner, the Priest, and the Woodcutter at the Rashōmon gate—functions as a Nyāya courtroom. The Commoner is the arch-*parataḥ* skeptic. He refuses to accept any testimony (*śabda*) simply because it has been spoken. He demands to know the conditions of the knower. When the Woodcutter offers his account, the Commoner presses him on why he withheld the dagger. He is looking for the *doṣa* (defect) in the cognition.

  The four flashbacks, conversely, are dramatizations of *svataḥ-prāmāṇya*. Each narrator (Bandit, Wife, Samurai, Woodcutter) presents their memory not as a hypothesis, but as a self-evident reality. To the Bandit, he *did* fight honorably. To the Wife, she *did* faint. They are not necessarily lying in the sense of fabricating data they know to be false; they are experiencing their own reconstructions as intrinsically valid. The film suggests that human consciousness is a Mīmāṃsaka: it presumes its own truth to preserve the ego. The epistemological crisis arises because we have four intrinsically valid cognitions that are mutually contradictory. If truth is intrinsic, how can four truths contradict? The film forces the Intrinsic view into a paradox.

  ### 2. The Medium and the Breakdown of Testimony (*Śabda*)
  You asked specifically about the medium. In Indian theory, valid testimony (*śabda*) requires two conditions: the speaker must know the object (*yathārtha*), and the speaker must be a reliable person (*āpta*) who intends to communicate it truthfully.

  The Samurai's testimony through the medium shatters the second condition. Even if we grant the metaphysical possibility that the dead can speak (which Nyāya might allow, Buddhism might not), the *epistemic* chain is broken. How do we verify the medium is not projecting?
  *   **From the Intrinsic view:** The Priest is willing to accept it. He wants to believe in the order of things. The cognition "the spirit speaks" carries its own warrant for him until proven otherwise.
  *   **From the Extrinsic view:** The Commoner dismisses it. A voice in a trance cannot be checked against successful action. It is *anupapatti* (incongruous).

  The film uses the medium to show that when *śabda* is detached from a living, accountable agent, it becomes indistinguishable from imagination (*vikalpa*). It illuminates the danger of the Intrinsic view: if we trust the "feel" of the testimony without checking the speaker's accountability, we invite superstition.

  ### 3. The Buddhist Reduction: Perception and Inference Only
  You asked if the stricter Buddhist line (only Perception (*pratyakṣa*) and Inference (*anumāna*)) handles the film better. In many ways, yes, because it is more ruthless.

  For a Buddhist epistemologist (like Dignāga or Dharmakīrti), the Bandit's story is not "testimony" about the murder; it is an *inference* about the Bandit's ego. We infer his desire for glory from his words. The Wife's story is an inference about her shame.
  *   **Perception:** Only the Woodcutter actually *saw* the event (*pratyakṣa*).
  *   **Inference:** The rest of the film is *anumāna* based on the speakers' motives.

  If we apply this reduction, the "truth of the murder" becomes epistemologically irrelevant. We cannot access the *svalakṣaṇa* (the unique particular of the event) anymore; that moment is gone. All we have are conceptual constructions (*kalpanā*). The Buddhist view predicts exactly what the film shows: that clinging to the "objective truth" of the past is a source of suffering (*duḥkha*). The only valid knowledge available at the gate is the perception of the baby's need and the inference that the Woodcutter is capable of compassion despite his theft.

  This handles the film "better" in the sense that it dissolves the puzzle rather than solving it. It tells us we are asking the wrong question. We are asking for *pramā* (valid knowledge) about the past, when we only have capacity for *kriyā* (action) in the present.

  ### 4. The Ending: *Arthakriyā* (Successful Action) as Truth
  The ending is the decisive moment for the Extrinsic view. The Priest's faith is not restored because someone finally tells the true version of the murder. It is restored because the Woodcutter *acts*. He takes the baby.

  In Nyāya and Buddhism, the ultimate test of a cognition is *arthakriyā*—does it lead to successful practice?
  *   The testimonies led to confusion, cynicism, and moral decay (the Commoner stealing the kimono).
  *   The Woodcutter's decision to take the baby leads to the preservation of life and the restoration of the Priest's hope.

  The film quietly assumes the Extrinsic view in its resolution. Truth is not a static correspondence between a statement and a past event; truth is a dynamic quality of conduct in the present. The Woodcutter's confession of the theft is the "defect" (*doṣa*) that clears the way for valid cognition. By admitting his flaw, he removes the barrier to trust. The Priest accepts him not because his story is now factually verifiable, but because his action (taking the baby) verifies his character.

  ### 5. What the Film Shows That the Arguments Cannot
  This is the most critical part of your query. Indian epistemology is largely soteriological; it is designed to lead to liberation (*mokṣa*) or correct ritual action. It assumes a rational agent who, if presented with the right logic, will correct their error. *Rashomon* shows something darker and more psychological that the schoolroom examples (rope/snake) miss.

  **A. Self-Deception as Ontology, Not Error**
  In the standard Indian example of mistaking a rope for a snake, the error is accidental. Once light is brought, the snake vanishes, and the agent realizes the mistake. In *Rashomon*, the "error" is constitutive of the self. The Bandit *needs* the duel to have been honorable to exist as the Bandit he believes he is. The Wife *needs* to have fainted to exist as the virtuous woman she believes she is.
  The philosophy treats false cognition as a glitch to be fixed. The film treats false cognition as the architecture of identity. The "defect" (*doṣa*) is not bad light or jaundice; it is the human need for dignity. The epistemological systems do not have a *pramāṇa* for "necessary lies."

  **B. Memory vs. Knowledge**
  Indian theory often treats memory (*smṛti*) as a distinct category, usually not a *pramāṇa* (source of *new* knowledge), but a reproduction of past knowledge. *Rashomon* blurs this. The narrators are not reproducing past knowledge; they are generating new knowledge in the present that overwrites the past. The film suggests that memory is not a storage vault (as *smṛti* implies) but a creative faculty. The philosophy struggles to categorize a "memory" that changes its content to suit the present emotional state.

  **C. The Social Cost of Skepticism**
  The Commoner (the *parataḥ* skeptic) is the most rational character, yet he is the most morally repulsive. He deconstructs everyone's stories successfully, but he ends up stealing the baby's kimono. The film warns that pure Extrinsic Validity, without an ethical core, leads to cynicism. If you demand verification for everything, you end up trusting nothing, and if you trust nothing, you are free to exploit everything. The Priest (the *svataḥ* believer) is naive, but his willingness to trust is what allows for the possibility of grace. The film suggests we need the *discipline* of the Nyāya skeptic to find facts, but the *faith* of the Mīmāṃsaka to live together.

  ### 6. Where the Comparison Breaks
  I must honor your request to identify where this distorts either side.

  **1. The Goal of Inquiry:**
  Indian epistemology seeks *certainty* (*niścaya*). The systems are built to ensure that once a cognition is validated, it is solid ground for building a life or a ritual. *Rashomon* concludes that certainty about the human heart is impossible. The film accepts ambiguity as the final state; Indian philosophy views ambiguity (*saṃśaya*) as a problem to be solved. If you force the film into the *pramāṇa* framework, you risk expecting a resolution it refuses to give.

  **2. The Nature of the Object:**
  In Nyāya, the pot exists whether I see it or not. In *Rashomon*, the "event" in the grove effectively ceases to exist as a singular object. It fragments into four realities. Post-modern readings of the film suggest there *is* no objective event, only interpretations. Most Indian schools (except perhaps Yogācāra Buddhism) are realists; they believe the object grounds the truth. If the film implies there was no "true" version of the duel, it contradicts the realist metaphysics underlying Nyāya and Mīmāṃsā.

  **3. The Role of the Senses:**
  The Woodcutter's final account is privileged because he "saw" it. But the camera shows us his account too. We know the camera can lie. The film implicates the viewer in the epistemological failure. Indian theory generally trusts perception (*pratyakṣa*) if the senses are healthy. The film suggests that even healthy senses are filtered through a corrupt soul. The defect is not in the eye (*indriya*), but in the self (*ahaṃkāra*). Classical epistemology separates the knower from the known more cleanly than the film allows.

  ### Conclusion
  *Rashomon* dramatizes the failure of the Intrinsic view (*svataḥ*) to navigate social reality, but it also dramatizes the moral hollowness of the Extrinsic view (*parataḥ*) when it becomes mere cynicism.

  The philosophy earns its keep by giving you the vocabulary to see that the narrators are not just lying; they are claiming *pramāṇa* status for their egos. The film earns its keep by showing that *pramāṇa* theory cannot account for the lie we tell ourselves to survive.

  The ending at the gate assumes a pragmatic version of Extrinsic Validity: truth is not what is spoken, but what is *done*. The Woodcutter's truth is not in his words (which were flawed), but in his carrying of the baby. However, the film goes beyond the philosophy by suggesting that this action does not resolve the epistemic uncertainty of the murder. The murder remains unknown. The "truth" that is saved is not the truth of the event, but the truth of the community.

  If you take one thing from the comparison, let it be this: Indian epistemology asks, "How do I know this is true?" *Rashomon* asks, "Can I live with you if we cannot agree on what is true?" The first is a question of logic; the second is a question of love. The philosophy explains the Woodcutter's confusion; only the film explains his redemption.
