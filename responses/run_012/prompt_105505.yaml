answer: |-
  # The Utility Monster Decision Tree

  **Start:** *Happiness (Welfare) is what makes a life go well, and we should aggregate it across everyone.*

  **Node 1: What constitutes welfare?**
  *   **A.** The satisfaction of informed desires. → **Leaf: Desire-Satisfaction Utilitarianism**
      *   *Awkward Commitment:* Must count the welfare of a person satisfied by a trivial or malicious desire higher than someone struggling with noble but unmet goals.
  *   **B.** Subjective mental states (pleasure/pain). → *Go to Node 2.*

  **Node 2: Is welfare cardinally measurable and comparable across persons?**
  *   **A.** No (Only ordinal or incomparable). → **[FLAGGED: Unoccupied/Incoherent]**
      *   *Reason:* You cannot sum utility to create a "Monster" problem without interpersonal comparison; this path abandons the starting premise of aggregation.
  *   **B.** Yes (Precise units exist). → *Go to Node 3.*

  **Node 3: Do we maximize the Total Sum or the Average Level?**
  *   **A.** The Average Level. → **Leaf: The Average View**
      *   *Awkward Commitment:* Implies it is better to kill unhappy people to raise the average, or refrain from creating happy people if they are below average.
  *   **B.** The Total Sum. → *Go to Node 4.*

  **Node 4: Do gains to the worse-off count for more moral weight? (Priority)**
  *   **A.** Yes (Diminishing marginal moral value). → **Leaf: Prioritarianism**
      *   *Awkward Commitment:* Must prioritize a small gain for the worst-off over a massive gain for the best-off, even if the total welfare decreases.
  *   **B.** No (Everyone counts equally). → *Go to Node 5.*

  **Node 5: Are there absolute deontological constraints (Rights) against sacrifice?**
  *   **A.** Yes (Individuals are inviolable). → **Leaf: Rights-Based View**
      *   *Awkward Commitment:* Must allow a catastrophe to occur if preventing it requires violating one innocent person's rights (the "Problem of Absolutism").
  *   **B.** No (Consequentialist aggregation only). → *Go to Node 6.*

  **Node 6: Is there a threshold where utility stops aggregating linearly?**
  *   **A.** Yes (Lexical thresholds exist). → **Leaf: Lexical/Threshold Views**
      *   *Awkward Commitment:* Must claim that any amount of a "higher" good (e.g., poetry) outweighs *any* amount of a "lower" good (e.g., push-pin), no matter the quantities.
  *   **B.** No (Linear aggregation). → *Go to Node 7.*

  **Node 7: Can one being's gain outweigh losses to others however large? (Unboundedness)**
  *   **A.** No (Trade-offs are bounded). → **[FLAGGED: Unoccupied/Incoherent]**
      *   *Reason:* If you reject rights (Node 5) and thresholds (Node 6), you cannot logically claim trade-offs are bounded without reintroducing a threshold.
  *   **B.** Yes (Unbounded trade-offs). → *Go to Node 8.*

  **Node 8: Does the mere conceivability of the Monster refute the theory?**
  *   **A.** Yes (Modal intuition overrides theory). → **[FLAGGED: Unpopular]**
      *   *Reason:* This accepts the theory's math but rejects its logical implications based on intuition, leaving the theory without a decision procedure.
  *   **B.** No (Theory survives conceivability). → **Leaf: Hedonistic Total Utilitarianism**
      *   *Awkward Commitment:* Must accept that we should feed everyone to the Monster if its capacity for happiness is sufficiently vast.

  ***

  ### Variant: The Benign Monster
  *Scenario: The Monster exists and experiences vast happiness, but **requires no sacrifice** from anyone (it just enjoys existing).*

  **Which leaves collapse (lose their critical force)?**
  1.  **Hedonistic Total Utilitarianism:** The Monster is no longer a *reductio*; it becomes a feature. The theory simply says "The world is better with the Monster," which is intuitive.
  2.  **Rights-Based View:** The objection vanishes because no rights are being violated. The view has no reason to oppose the Monster's existence.
  3.  **Lexical/Threshold Views:** Without sacrifice, there is no trade-off to test the threshold. The view accepts the Monster as a "higher good" bonus.

  **Which leaves remain distinct?**
  *   **Prioritarianism & The Average View:** These still face internal tension. If the Monster's existence lowers the *average* welfare (by adding a being below the current average, though unlikely for a "Monster") or if its happiness is weighted less due to *priority* rules (unlikely), the calculation changes. However, mostly, the Benign Monster neutralizes the *moral horror* that drives the objection for **Rights** and **Threshold** views, effectively collapsing the debate for those positions.

  ***

  ### Instructor Notes on Flagged Combinations
  *   **Node 2A (Incomparable Welfare):** Often occupied by *Value Pluralists*, but they cannot engage the Utility Monster argument as stated, because the Monster requires a common currency of value to "sum."
  *   **Node 7A (Bounded without Thresholds):** This is the "Incoherent" zone. You cannot claim "no thresholds" and "bounded trade-offs" simultaneously. To bound trade-offs, you must introduce a threshold (Node 6) or a Right (Node 5).
  *   **Node 8A (Modal Rejection):** This is often where students intuitively land ("Utilitarianism is mathematically right but intuitively wrong"). Philosophically, this is unstable: if the theory implies X, and X is conceivable, you must either change the theory or accept X.
