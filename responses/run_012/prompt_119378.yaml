  Move 1 (Marcus): Marcus establishes a physicalist view of causation where only positive events count. His claim that omissions are "holes" is a coherent metaphysical stance, and his reductio (if not-watering causes death, everyone's not-watering does) highlights the problem of profligate omissions. However, this relies on a specific, contested definition of causation.
  Rating: **good**

  Move 2 (Priya): Priya shifts to a counterfactual theory (difference-making), which handles omissions naturally. Her appeal to ordinary language (mechanics, doctors) and the lifeguard example effectively challenges Marcus's restriction, showing his view conflicts with standard causal reasoning.
  Rating: **good**

  Move 3 (Marcus): Marcus argues that because norms select Dev over the mailman, the causation is illusory and really just blame. This identifies a real phenomenon (causal selection) but draws a false conclusion; norms help us *pick* causes from a web, but that doesn't mean the underlying causal relation is nonexistent.
  Rating: **mixed**

  Move 4 (Priya): Priya points out that interest-relativity applies to positive causes too (e.g., selecting "soil dried" over "sun shone"). This neutralizes Marcus's argument that norms prove it's not causation, showing his criterion would eliminate positive causes as well.
  Rating: **good**

  Move 5 (Marcus): Marcus reiterates the profligacy objection and claims the doing/allowing asymmetry proves omissions aren't causes. This assumes metaphysical causation must mirror moral asymmetry, which is a category error; the asymmetry could be moral while the causation is metaphysical.
  Rating: **weak**

  Move 6 (Priya): Priya concedes the asymmetry might reflect different kinds of causes or duties, and notes Dev's omission was downstream of a positive act (booking the trip). This synthesizes the counterfactual view with a positive event anchor, addressing the "no event" complaint without abandoning difference-making.
  Rating: **good**

  Both debaters assume causation is a binary metaphysical fact that must be discovered rather than a context-sensitive tool for explanation. They argue over whether omissions *are* causes, missing that the real dispute is about causal ontology versus causal explanation.

