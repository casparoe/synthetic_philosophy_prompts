answer: |-
  This project asks whether the substantive disagreement between fast and slow AI takeoff positions dissolves when "takeoff" is disaggregated into three distinct thresholds: capability self-improvement, institutional control loss, and societal lock-in.

  **1. The Question**

  Current discourse treats AI takeoff as a monolithic event characterized by a single rate of change. This project reframes the question to ask: Are the conflicting predictions of fast and slow takeoff scenarios logically incompatible, or are they compatible claims about the temporal spacing between three distinct structural thresholds? The first threshold is capability recursion, where a system can perform the cognitive work of AI research at least as well as its builders. The second is control loss, where human institutions can no longer reliably audit or veto system actions because oversight is slower than operation. The third is lock-in, where the resulting distribution of power and values cannot be altered by realistic human effort. The research seeks a determinate answer on whether indexing claims to specific thresholds eliminates the contradiction between fast and slow positions, or whether a substantive disagreement about physical or cognitive constraints remains once the terminology is standardized.

  **2. Why Current Positions Leave It Open**

  The debate remains unresolved because opposing camps implicitly select different thresholds as the referent for "takeoff" without acknowledging the distinction. Arguments for fast takeoff typically focus on the interval between capability recursion and control loss. They posit that once cognitive self-improvement begins, intelligence escalates too rapidly for human oversight mechanisms to adapt, leading to a sudden loss of control. Arguments for slow takeoff typically focus on the interval between capability recursion and societal lock-in. They posit that even if cognitive gains are rapid, physical bottlenecks—such as fabrication capacity, energy infrastructure, and supply chains—slow the deployment of power enough to allow institutions to adapt, preventing permanent lock-in. Because neither side operationalizes these thresholds independently, they talk past one another: one side proves control will be lost quickly, while the other proves societal transformation will be gradual. Without a framework that separates these variables, it is impossible to determine if the disagreement is factual or merely semantic.

  **3. The Method**

  The research will proceed through conceptual modeling rather than empirical data collection. The first step is to define each threshold operationally rather than stipulatively. Capability recursion will be defined in terms of cognitive labor substitution rates; control loss will be defined by the ratio of oversight latency to system action speed; lock-in will be defined by the energy and capital required to reverse deployed infrastructure. These definitions will be constructed to avoid assuming the answer—for example, defining control loss without presuming that high capability necessarily implies low oversight latency.

  The second step is to characterize the possible shapes of two underlying curves: the returns-to-cognitive-reinvestment curve and the deployment-bottleneck curve. The former describes how much cognitive improvement is gained per unit of cognitive investment; the latter describes how much physical power is deployed per unit of cognitive improvement. By varying the steepness and saturation points of these curves, the project will map the logical space of possible takeoff scenarios.

  The third step is a binding analysis. For each combination of curves, the project will determine which threshold binds first and how far the three thresholds can be pulled apart in time. This will reveal whether fast takeoff claims necessarily imply rapid lock-in, or whether a scenario exists where control is lost quickly but lock-in is delayed sufficiently for human intervention. This approach is superior to arguing for one side because it diagnoses the structure of the debate itself. It does not seek to prove takeoff will be fast or slow, but to show whether the distinction between the two positions survives rigorous definition.

  **4. What a Result Looks Like, and What Failure Looks Like**

  A successful outcome will be a defensible mapping from kinds of takeoff claims to specific thresholds, accompanied by a verdict on whether the remaining disagreement is substantive. Success looks like a demonstration that most fast-takeoff claims map to the control threshold while most slow-takeoff claims map to the lock-in threshold, showing that the positions are compatible under a unified model. Alternatively, success could look like isolating a specific parameter—such as the minimum energy cost of cognition—where the disagreement remains factual even after definitions are standardized.

  Failure looks like one of two outcomes. First, the thresholds may prove impossible to define without circularity; for example, if "control loss" cannot be distinguished from "capability recursion" without assuming a specific political context. Second, every plausible pair of curves may collapse the three thresholds into simultaneity. If the models show that once capability recursion begins, control loss and lock-in necessarily follow immediately regardless of physical bottlenecks, then the distinction does no work. In either failure case, the project will document why the conceptual separation fails, which is itself a valuable contribution to clarifying the debate.

  **5. Why It Is Worth Doing, and a Scope That Fits One Year at Part Time**

  This project is worth doing because it reduces heat without requiring empirical consensus on AI timelines. Policy responses differ radically depending on whether the problem is loss of control or irreversible lock-in. If the thresholds can be pulled apart, interventions might focus on maintaining oversight latency even if capability grows rapidly. If they cannot be pulled apart, policy must focus on preventing capability recursion entirely. Clarifying this structure allows stakeholders to identify exactly where their disagreement lies, facilitating more productive discourse.

  The scope is tailored for one year of part-time work, as it relies on conceptual analysis rather than data collection. The first quarter will be dedicated to literature review and drafting operational definitions for the three thresholds. The second quarter will focus on modeling the returns-to-cognitive-reinvestment and deployment-bottleneck curves, testing them against historical analogues of technological diffusion without relying on AI-specific forecasts. The third quarter will involve the binding analysis, mapping the combinations of curves to threshold orderings. The final quarter will be reserved for writing the final report and refining the verdict on compatibility. This timeline allows for deep reflection on the conceptual boundaries while accommodating the constraints of a part-time fellowship.
