answer: |-
  **Project Title:** Control-Theoretic Semantics: Can Internal Norms Fix Content Without Selection History?

  **1. The Research Question**
  Standard teleosemantics fixes the content of a biological state by appealing to the conditions under which the mechanism carrying that state was historically selected. This project asks a specific, binary question: **In biological control systems where selection history is opaque or indeterminate, does the internal normative structure of the regulatory loop (specifically, the relation between set points and error signals) suffice to fix determinate representational content?**

  This is not a request for a new theory of mind, but a stress-test of a specific necessary condition. The question admits a determinate answer: either the internal dynamics of a control loop can distinguish *misrepresentation* from *mere malfunction* without historical data, or they cannot. If they cannot, the control-theoretic account fails to solve the determinacy problem. If they can, selection history is not necessary for naturalized semantics in biological domains.

  **2. State of the Debate: Settled and Contested**
  It is **settled** within the literature that the dominant strategy for naturalizing content (teleosemantics) relies on *etiological function*—what a trait was selected for in the past. It is also **settled** that this approach faces the "recovery problem": in many biological systems, particularly the insect sensory-motor loops I studied, specific selection histories for specific states are empirically unrecoverable.

  It is **contested** whether etiological function is *necessary*. A minority position argues that *systemic function* (current contribution to a system's goal) is sufficient. However, it is **settled** that simple control systems (e.g., thermostats) are widely rejected as having genuine content, even by proponents of systemic function, because such an account appears "too cheap"—it ascribes content to trivial systems.

  My framing of the debate is consistent with the current live disagreements, but with one crucial caveat: much of the philosophical work on control-theoretic semantics has been abstract or based on simple models. It is **contested** whether complex, nested biological control loops (like insect navigation) escape the "triviality" objection that sinks the thermostat. The project leverages my biological expertise to test whether biological complexity provides the missing constraint that abstract philosophical models have lacked.

  **3. Methodology and Work Plan (9 Months, Half-Time)**
  The work is conceptual analysis grounded in biological case study. No new experimental data will be generated; existing biological models will be repurposed as philosophical test cases.

  *   **Months 1–3: Mapping the Constraints.** I will analyze the specific arguments used to reject simple control-theoretic accounts of content. The focus will be on the "disjunction problem" (how to distinguish representing *X* from representing *X or Y*) and the "distality problem" (whether the content is the proximal trigger or the distal cause). I will draft a precise definition of "internal normative structure" that distinguishes a homeostatic loop from a mere causal chain.
  *   **Months 4–6: The Argument.** I will construct a positive argument showing how error signals in a biological loop create a "normative gap" identical to misrepresentation. I will then construct the strongest possible objection: that this gap is merely mechanical deviation, not semantic error.
  *   **Months 7–9: The Biological Case Study.** I will test the argument against the path integration system of desert ants (*Cataglyphis*).
      *   *Why this case:* The ant maintains a "home vector" (a representation of distance and direction). This vector is continuously updated by a control loop (optic flow, step counting).
      *   *The Conflict:* A selectionist story struggles to fix the content of the *current* vector state (it hasn't been selected for *this* specific value). A control-loop story identifies the content via the error signal generated when the ant reaches the nest and the vector does not zero out.
      *   *The Test:* I will write a detailed analysis showing whether the ant's correction behavior constitutes *semantic* correction (fixing a false belief) or merely *causal* compensation (like a thermostat turning on heat).

  **Deliverables:** One substantial manuscript (approx. 8,000 words) suitable for submission to a journal in philosophy of biology or cognitive science, and a public-facing summary for an interdisciplinary audience.

  **4. Success and Failure Conditions**
  *   **Positive Result:** A demonstrated account where the control loop's error signal fixes content determinately without reference to selection history, successfully distinguishing the ant's state from a thermostat's state.
  *   **Negative Conclusion (Success):** A rigorous proof that internal norms *cannot* distinguish semantic error from mechanical deviation without selection history. This is a successful outcome; it clarifies the boundaries of non-selectionist semantics.
  *   **Project Failure:**
      1.  **Triviality:** Discovering in Months 1–3 that the argument I intend to make has already been definitively refuted in the literature (i.e., I have missed a key objection).
      2.  **Scope Creep:** Attempting to explain *consciousness* or *human language* rather than sticking to sub-personal biological content.
      3.  **Category Error:** Failing to distinguish between *biological function* (what a heart does) and *representational content* (what a map says). If the project collapses these two, it has failed.

  **5. Scope and Risks**
  *   **What I Will Not Attempt:** I will not attempt to solve the "Hard Problem" of consciousness. I will not claim this accounts for human propositional attitudes. I will not attempt to refute selectionism entirely, only to test its necessity in specific biological contexts.
  *   **The Primary Risk:** The "Thermostat Objection." It is highly likely that critics will argue that if my account works for the ant, it also works for a thermostat, and since thermostats don't have content, the account is flawed. I must anticipate this. The project's success depends on identifying a relevant difference between the ant's nested control loops and a thermostat's single loop that matters for semantics, without smuggling selection back in.
  *   **Feasibility:** Given my background, the biological case study is low-risk. The philosophical risk is high, as the literature on this specific interface is dense. However, nine months at half-time is sufficient for a targeted conceptual analysis provided I resist the urge to build a "system" and instead focus on the specific binary question posed above.

  **Summary of Feasibility:**
  This project is viable because it isolates a single point of friction between two well-defined fields (control theory and teleosemantics). It acknowledges the dominant view (selectionism) without accepting it as dogma. It utilizes the applicant's unique asset (deep knowledge of insect sensory ecology) to test a philosophical claim where abstract reasoning has previously stalled.
