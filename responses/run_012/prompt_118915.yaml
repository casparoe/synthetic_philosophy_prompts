answer: |-
  1. The practice presupposes an experientialist theory of harm, where negative value arises solely from conscious suffering rather than the deprivation of future life. Under this view, death is only harmful if the process of dying involves pain, because a non-existent subject cannot experience the loss of its future.

  2. The practice strictly requires that welfare costs are measurable only through observable signs of distress or physiological pain, rather than abstract loss of potential. It fits comfortably with utilitarian calculation but does not strictly demand it, since the paperwork could remain identical even if the weighing were replaced by a strict cap on allowable suffering.

  3. This framework rules out the deprivation account of death, which holds that killing is harmful because it deprives an individual of future goods regardless of their awareness. It also excludes strong rights-based views that forbid using animals as means to human ends, and objective-list views that assign value to life continuation independent of subjective experience.

  4. The practice is internally inconsistent because it logs unexpected death as a welfare failure while treating planned euthanasia as a welfare success, implying death itself sometimes counts as a harm. This underdetermination suggests the system covertly values life continuation in cases of negligence while officially denying it in cases of protocol design.

  5. Non-recovery protocols would need a severity rating reflecting the value of the life lost, rather than being filed as a benign separate category. The harm-benefit analysis would have to weigh the scientific value against both the suffering endured and the total lifespan deprived, potentially prohibiting high-mortality studies regardless of pain management.
