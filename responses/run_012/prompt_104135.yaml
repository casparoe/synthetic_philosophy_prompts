answer: |-
  1.  **Responsibility for Harmful Beliefs**
      If self-deception is **imaginative pretense**, responsibility is maximal; the agent knowingly sustains a fiction, making resulting harm a product of voluntary negligence. If **deflationary**, responsibility is minimized; the belief is an involuntary output of biased cognitive machinery, akin to a visual illusion, complicating blame. The **divided mind** model fragments agency: moral liability depends on whether the "deceiver" or the "deceived" subsystem initiated the harmful action, challenging unitary notions of culpability. The **temporal** model restricts responsibility to specific moments; one cannot be blamed for holding contradictory states simultaneously, only for failing to update beliefs when evidence became undeniable.

  2.  **Legitimacy of External Accusation**
      Claiming someone is in "denial" shifts from observation to theory based on the model. In the **pretense** view, the accusation is an intervention intended to halt active rehearsal; it assumes the subject is avoiding attention. In the **deflationary** view, the accusation is theoretically heavy; it asserts you understand their cognitive biases better than they do, risking epistemic arrogance. For the **divided mind**, the accusation addresses only the deceived subsystem, potentially aligning the accuser with the deceiving part without resolving the internal conflict. In the **temporal** view, the accusation is merely a charge of inconsistency over time, which is empirically verifiable but lacks the charge of active concealment. Consequently, therapeutic or social interventions must be tailored: confronting a pretender differs fundamentally from educating a biased processor.

  3.  **Privileged First-Person Access**
      The **pretense** model preserves access but implies voluntary ignorance; we know more than we admit to ourselves, making self-ignorance a choice. The **deflationary** model maintains access but highlights interpretive fallibility; we see our mental states but misjudge their causes. The **divided mind** model fundamentally rejects transparent access, positing structural opacity between mental subsystems; the self is not a single room with lights on. The **temporal** model preserves synchronic access (knowing what you believe now) but denies diachronic access (knowing what you believed then), undermining autobiographical reliability and the stability of identity. This challenges the Cartesian assumption that the mind is inherently transparent to itself.

  4.  **Agency and Moral Psychology**
      Taking these models seriously alters how we view moral improvement. If **pretense**, virtue requires honesty with oneself as a duty. If **deflationary**, virtue requires correcting cognitive biases externally through feedback. If **divided**, virtue requires internal integration and communication between parts. If **temporal**, virtue requires consistency and narrative coherence. Each model demands a different strategy for correction, implying there is no single "cure" for self-deception, and ethical frameworks must adapt to the specific metaphysical structure of the mind they presume.
