prompt: |-
  A long-running dispute about the historicity of the Trojan War, of King Arthur, and of the Exodus has two coherent camps that mostly argue past each other. The record camp holds that a tradition is, at bottom, a degraded record of an event: something happened, transmission distorted it, and the task is to estimate what survives. The projection camp holds that a tradition is a composition of the community that produced it: its apparent reference to an event is a feature of genre and function, and the interesting question is what present need the story met. Write the joint statement that a committed member of each camp could sign without retracting anything, covering all three traditions.

  Include, in this order:

  1. A vocabulary section fixing the terms both camps will use. It must distinguish two modes of collective memory: memory circulating among living witnesses and their immediate descendants, kept honest by the presence of people who were there, and memory that has become institutional, ritual, and normative, and is therefore free to be reshaped to fit present needs. State what both camps take to follow from the fact that a tradition is first recorded only after the first mode has died out.

  2. A numbered list of agreed claims. These should include claims about what a tradition is evidence of when its narrative is false; about what makes one item of evidence independent of another; about the worth of arguments from silence against a record whose survival is selective; about the independence of transmission fidelity from content truth; and about the conditions under which a legend becomes warranted history. Include agreed claims about each of the three traditions at whatever level of description both camps can honestly accept. Each claim should carry a sentence saying why the camp that finds it least congenial still signs it.

  3. A disagreements table. For each item: the position in each camp's own preferred wording, a neutral restatement that neither camp rejects as a caricature, and the self-description each camp would give and the label each would refuse.

  4. The cruxes, with the case or argument both camps accept as bearing on each, and both camps' predictions about it written down in advance. At least these are in play: how long and under what conditions an event-schema can survive transmission; whether topographical anchoring, that is, a story fastened to a ruin, a pass, a mound, or a name, is a mechanism of memory or a mechanism of invention; whether a tradition's founding or legitimating function counts against its historicity or is orthogonal to it; and whether the three traditions should be covered by one general thesis at all, or whether they are three different epistemic situations. For each crux, say which camp would move, in which direction, and how far: a change of verdict on one of the three cases, or only of confidence.

  5. A closing section on residual verbal disputes. Where the camps differ only over what the unit of historicity is, an event, an agent, a sequence, a scale, or a meaning, or only over where the burden of proof sits, say so, and say what would have to be stipulated for the dispute to become empirical. End with what would move each camp and what both agree would not.

  Do not manufacture finds, inscriptions, dates, or attributions, and do not cite scholarship; refer to positions rather than to authorities. Where a camp's case depends on a description of the record that the other camp disputes, that belongs in the crux section, not in the agreed claims. Do not manufacture agreement: the list of agreed claims should contain whatever survives honest drafting, and nothing more.
reasoning: |-
  Here's a thinking process that leads to the joint statement:

  1.  **Analyze the Request:**
      *   **Topic:** A joint statement between two camps regarding the historicity of the Trojan War, King Arthur, and the Exodus.
      *   **Camps:**
          *   *Record Camp:* Tradition = degraded record of an event. Task = estimate what survives.
          *   *Projection Camp:* Tradition = composition of the community. Task = understand present need/function.
      *   **Constraint:** Both must sign without retracting anything. No manufactured evidence/scholarship. No false agreement.
      *   **Structure:**
          1.  Vocabulary Section (Two modes of collective memory, implication of late recording).
          2.  Numbered List of Agreed Claims (Evidence of false narratives, independence, arguments from silence, fidelity vs. truth, legend to history, specific claims on Troy/Arthur/Exodus + why the reluctant camp signs).
          3.  Disagreements Table (Position, Neutral Restatement, Self-Description, Refused Label).
          4.  The Cruxes (Event-schema survival, topographical anchoring, function vs. historicity, one thesis vs. three situations, movement predictions).
          5.  Closing Section (Residual verbal disputes, burden of proof, stipulations for empirical resolution, what would move each camp).

  2.  **Drafting - Section 1: Vocabulary:**
      *   *Goal:* Define two modes of memory.
      *   *Mode 1:* Living witness/immediate descendant memory. Let's call it "Communicative Memory" (standard term, but I need to define it per prompt). Let's use "Witness Memory."
      *   *Mode 2:* Institutional/ritual/normative memory. Let's call it "Cultural Memory."
      *   *Implication of late recording:* Both agree that once Witness Memory dies, the tradition enters Cultural Memory.
      *   *Record Camp view:* Distortion increases, but a core may persist.
      *   *Projection Camp view:* Reshaping becomes the primary driver.
      *   *Joint Statement:* Both agree that the transition marks a shift from *correction by witness* to *correction by utility*.
      *   *Drafting thought:* Need to be precise. "Witness Memory" vs. "Institutional Memory." The key agreement is that after Witness Memory expires, the mechanism of change shifts from accidental degradation to intentional adaptation.

  3.  **Drafting - Section 2: Agreed Claims:**
      *   *Goal:* Find common ground without forcing false consensus.
      *   *Claim 1 (False Narrative Evidence):* Even if the narrative is false, it evidences the values/anxieties of the time of composition. *Reluctant Signer:* Record Camp (because they care about the *event*, but admit it evidences the *transmitters*).
      *   *Claim 2 (Independence):* Evidence is independent only if it doesn't share a common source/lineage. *Reluctant Signer:* Projection Camp (sometimes they see intertextuality where Record sees independent corroboration, but they must agree on the definition of independence).
      *   *Claim 3 (Argument from Silence):* Silence is weak evidence if survival is selective (archaeology/texts rot). *Reluctant Signer:* Record Camp (they often want to use silence, but must admit the record is fragmentary).
      *   *Claim 4 (Fidelity vs. Truth):* High fidelity transmission does not guarantee truth (a lie can be memorized perfectly); low fidelity does not guarantee falsehood. *Reluctant Signer:* Record Camp (they hope fidelity tracks truth, but logically must admit it doesn't).
      *   *Claim 5 (Legend to History):* A legend becomes warranted history only when external constraints (archaeology, contemporary documents) limit the range of possible interpretations. *Reluctant Signer:* Projection Camp (they dislike "history" as a goal, but admit external constraints exist).
      *   *Claim 6 (Troy):* There was a settlement at Hisarlik that suffered destruction(s) in the Late Bronze Age. *Reluctant Signer:* Projection Camp (admits the ruins exist, denies they prove the *war* as described).
      *   *Claim 7 (Arthur):* There is no contemporary textual evidence for Arthur, but the tradition coalesced in a period of political fragmentation in Britain. *Reluctant Signer:* Record Camp (wishes there were evidence, admits there isn't).
      *   *Claim 8 (Exodus):* There is no direct archaeological evidence for a mass migration of the scale described in the Sinai during the relevant period. *Reluctant Signer:* Record Camp (hopes for a kernel, admits the scale lacks evidence).

  4.  **Drafting - Section 3: Disagreements Table:**
      *   *Goal:* Contrast positions neutrally.
      *   *Item 1: Core of Tradition.* Record: Event Kernel. Projection: Ideological Construct. Neutral: Origin Point.
      *   *Item 2: Role of Anachronism.* Record: Contamination of an older truth. Projection: Clue to date of composition. Neutral: Temporal Discrepancy.
      *   *Item 3: Burden of Proof.* Record: Presume historicity until disproven (or plausible kernel). Projection: Presume fiction until proven otherwise. Neutral: Default Stance.
      *   *Self-Descriptions/Labels:* Record = "Historical Realists" / Refuse "Naive Literalists". Projection = "Literary Contextualists" / Refuse "Mythologists" (implying falsehood).

  5.  **Drafting - Section 4: The Cruxes:**
      *   *Goal:* Identify the sticking points and predict movement.
      *   *Crux 1: Event-Schema Survival.* How long can a story structure last? Record: Millennia. Projection: Centuries. *Movement:* Record might lower confidence on Arthur if schema stability is limited.
      *   *Crux 2: Topographical Anchoring.* Ruins/Names. Record: Memory mechanism (people remember where things happened). Projection: Invention mechanism (people put stories on ruins to explain them). *Movement:* Projection might concede historicity if anchoring is too specific to be random (e.g., specific destruction layers).
      *   *Crux 3: Function vs. Historicity.* Does legitimating function kill historicity? Record: Orthogonal (true things can be used for legitimacy). Projection: Suspicious (legitimacy often creates the story). *Movement:* Record might concede specific details are invented for legitimacy.
      *   *Crux 4: One Thesis or Three?* Record: One method applies to all. Projection: Three distinct epistemic situations (Troy = archaeology rich, Arthur = text poor, Exodus = negative archaeology). *Movement:* Record might agree to treat them separately based on evidence density.

  6.  **Drafting - Section 5: Closing/Residual Verbal Disputes:**
      *   *Goal:* Clarify semantic vs. empirical disagreements.
      *   *Unit of Historicity:* Record looks for the *Event*. Projection looks for the *Narrative Act*.
      *   *Burden of Proof:* Who has to prove what?
      *   *Stipulation:* Need to define "Historical" (Did *something* happen vs. Did *this* happen).
      *   *What moves them:* Record moved by contemporary corroboration. Projection moved by demonstration of anachronistic invention.
      *   *What doesn't:* Plausibility arguments alone.

  7.  **Review and Refine:**
      *   *Check Constraints:* Did I cite scholarship? No. Did I manufacture dates? No. Is the tone appropriate? Yes, formal joint statement.
      *   *Check Camp Integrity:* Does the Record Camp sound like they still believe in history? Yes. Does the Projection Camp sound like they still believe in social function? Yes.
      *   *Check Specifics:* Did I cover Troy, Arthur, Exodus in the agreed claims? Yes.
      *   *Check Vocabulary:* Did I define the two memory modes clearly? Yes.
      *   *Check "Why they sign":* Ensure every agreed claim has the justification for the reluctant signer.

  8.  **Final Polish:** Ensure the distinction between "Witness Memory" and "Institutional Memory" is sharp. Ensure the "Cruxes" section clearly states predictions. Make sure the "Disagreements Table" is formatted clearly. (Self-Correction: Ensure I don't accidentally validate one side in the neutral restatements).

  *Refining the Vocabulary:* Let's use "Communicative Memory" (living) and "Cultural Memory" (institutional) as these are standard sociological terms that fit the prompt's description, but I will define them explicitly as requested to avoid ambiguity.
  *Refining the Claims:* Make sure the "why they sign" sentence is distinct.
  *Refining the Cruxes:* Ensure the "movement" prediction is specific (verdict vs confidence).

  *Final check on the "Record Camp" stance:* They believe something happened. They shouldn't agree that *nothing* happened.
  *Final check on the "Projection Camp" stance:* They believe the story serves a function. They shouldn't agree that the function proves the event.

