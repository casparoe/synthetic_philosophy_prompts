          6.  **Constraint:** Do not smooth over the hard case. *Anekāntavāda* is not relativism. Contradictory claims in the *same respect* violate Jain logic.
          7.  **Language:** American English.

  2.  **Deconstruct the Technical Apparatus (Jain Epistemology):**
      *   *Anekāntavāda:* Doctrine of manifoldness. Reality is complex. No single proposition captures the whole truth. Not relativism (there *is* a truth), but perspectivalism. Only the *kevalin* (omniscient being) sees the whole.
      *   *Nayavāda:* Doctrine of standpoints/partial viewpoints. There are seven *nayas* (ways of viewing). Each is valid *within its scope* but false if taken as the whole truth.
      *   *Syādvāda:* Doctrine of conditioned predication. The sevenfold logic (*saptabhaṅgī*). Every statement must be qualified by *syāt* ("in some respect," "perhaps," "from a certain perspective").
          1.  Syāt asti (In some respect, it is).
          2.  Syāt nāsti (In some respect, it is not).
          3.  Syāt asti nāsti (In some respect, it is and is not).
          4.  Syāt avaktavya (In some respect, it is inexpressible).
          5.  ...and combinations thereof.
      *   *Key Constraint:* Contradictions are only allowed if they refer to different *substances*, *times*, *places*, or *conditions* (upadhis). If two witnesses say "X happened" and "X did not happen" regarding the *exact same* spatiotemporal event and condition, Jain logic says one is lying or mistaken, not that both are valid *nayas*.

  3.  **Analyze *Rashomon*:**
      *   **Plot:** A crime (rape/murder/death) is recounted by four witnesses: Bandit (Tajōmaru), Wife (Masago), Samurai (via medium), Woodcutter.
