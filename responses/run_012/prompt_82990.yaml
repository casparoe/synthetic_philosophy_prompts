prompt: |-
  For several years a colleague and I have co-taught a graduate seminar on moral particularism and generalism, and I have come to think the debate is stuck in a way that is more philosophically interesting than the arguments on either side. The generalist holds that moral judgment and moral knowledge depend on true universal moral generalizations that can figure in reasoning: without them there is no way to learn to judge well, no way to adjudicate disagreement, and no way for a verdict to be justified rather than merely had. The particularist holds that reasons are holistic, so that a feature which is a reason for a verdict here may be a reason against it, or no reason at all, elsewhere; from this it is concluded that no finite set of exceptionless principles can capture moral reality, and that competence in morals is a matter of discernment rather than application. The familiar exchanges have not moved either camp in decades. The generalist's worry about learning and justification is met with an analogy to perceptual and practical discernment; the particularist's counterexamples are met with the observation that principles were never supposed to be exceptionless, since a principle can be a defeasible default, a prima facie duty, or a rule of thumb.

  My hypothesis, offered as a hypothesis, is that the dispute is largely verbal, turning on what counts as a principle and on what principles are for, with two non-verbal residues. The first is methodological: a disagreement about the evidential standing of intuitions about exotic cases, where the particularist needs those cases to be credible and the generalist needs to be entitled to redescribe them as cases in which the principle's conditions were never met. The second is epistemic: a disagreement about whether moral justification must be codifiable, that is, whether one must be able to state what justifies one. I am also struck by a wrinkle I cannot make anything of. Particularists generally accept that there can be no moral difference without some other difference, which looks like conceding a universal generalization of some sort. Either that sort of generalization is not a principle, in which case the quarrel concerns the function of principles rather than their existence, or the particularist owes an account of why it does not count.

  What I want from you is a diagnosis rather than a verdict. Is this a substantive disagreement, a verbal one, or two groups answering different questions under a single heading, one about what makes an act right and one about how one comes to know it? If a large part of it is verbal, what exactly is left once the terminological debris is cleared, and is the residue worth arguing about? Does the particularist's acceptance of supervenience-style generalizations help, or is it a red herring? And given your diagnosis, what would count as progress, whether a distinction, a formal result, a change of question, or an empirical result about how people actually reason morally, or should we expect none? Ground the diagnosis in what each side actually claims rather than surveying the literature, and state how confident you are in the diagnosis and which part of it you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the Request:**
      *   **Context:** The user is an experienced co-teacher of a graduate seminar on moral particularism vs. generalism. They feel the debate is "stuck" in a philosophically interesting way.
      *   **User's Hypothesis:** The dispute is largely verbal (definitions of "principle," function of principles) with two non-verbal residues (methodological: status of intuitions in exotic cases; epistemic: codifiability of justification). There's a "wrinkle" regarding supervenience (no moral difference without a natural difference).
      *   **Task:** Provide a *diagnosis* (not a verdict) of the debate.
      *   **Specific Questions to Address:**
          *   Is it substantive, verbal, or talking past each other (metaphysics vs. epistemology)?
          *   If verbal, what is the residue, and is it worth arguing about?
          *   Does the particularist's acceptance of supervenience help or is it a red herring?
          *   What would count as progress (distinction, formal result, new question, empirical data)?
          *   Ground the diagnosis in claims, not literature survey.
          *   State confidence level and identify the least certain part.

  2.  **Deconstruct the Debate (Mental Sandbox):**
      *   *Generalism:* Morality needs principles. Principles guide action, justify verdicts, allow learning. Without them, it's just intuition/whim.
      *   *Particularism:* Reasons are holistic (valence changes). No exceptionless principles. Moral competence is perception/discernment (like Aristotle's *phronesis*).
      *   *The "Stuckness":* Generalists weaken principles to "defaults" or *ceteris paribus*. Particularists say that's not a real principle. Generalists say you can't learn without rules. Particularists say you learn like you learn language or perception (ostension/practice).
      *   *The Supervenience Wrinkle:* "No moral difference without a natural difference." This implies a universal truth: $\forall x, y (N(x) = N(y) \rightarrow M(x) = M(y))$. Particularists accept this. Generalists say "Aha! A principle!" Particularists say "That's not a *guiding* principle, it's a metaphysical constraint."

  3.  **Evaluate the User's Hypothesis:**
      *   *Verbal Dispute:* Yes, largely. "Principle" is the battleground. If a principle is a *codifiable exceptionless rule*, particularism wins (there aren't any). If a principle is a *true generalization* (even complex/holistic), generalism wins (supervenience guarantees them).
      *   *Residues:*
          *   *Methodological:* Intuitions about cases. Generalists want to subsume cases under rules; Particularists want cases to drive theory.
          *   *Epistemic:* Codifiability. Can justification be articulated?
      *   *Supervenience:* It's not a red herring, but it's often misused. It secures a metaphysical generalization but doesn't secure an epistemic guide.

  4.  **Formulate the Diagnosis:**

      *   **Core Diagnosis:** It is a *hybrid* dispute. It is primarily verbal regarding the definition of "principle," but it masks a substantive disagreement about the *structure of moral epistemology* (codifiability) and the *metaphysics of reasons* (holism vs. atomism). It is also partly a case of talking past each other (Metaphysics vs. Epistemology).
      *   **Verbal Component:** The definition of "principle."
          *   Generalist: A true generalization that can play a role in reasoning/justification.
          *   Particularist: A finite, statable, exceptionless (or robustly defeasible) rule that determines valence.
          *   *Resolution:* If we distinguish *Metaphysical Generalizations* (supervenience) from *Epistemic Guides* (maxims/rules), the smoke clears.
      *   **Substantive Residue:**
          1.  *Holism of Reasons:* Is the valence of a feature context-dependent? (Particularism says yes, strong holism. Generalism says no, or weak holism).
          2.  *Codifiability:* Can moral competence be reduced to propositional knowledge? (Generalist: Yes/Largely. Particularist: No, it's know-how).
      *   **Supervenience:** It is *not* a red herring, but it doesn't save Generalism. It grants a universal truth ($\forall x (Nx \rightarrow Mx)$) but not a usable principle. The function of a principle is *guidance*, not just *truth*. Supervenience truths are often too complex to be action-guiding.
      *   **Progress:**
          *   *Distinction:* Separate Metaphysical Generalism (supervenience) from Epistemic Generalism (codifiability).
          *   *Empirical:* Cognitive science of moral reasoning (do people actually use rules or pattern recognition?).
          *   *Formal:* Complexity theory (is the mapping from N to M computationally tractable for a finite mind?).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's insight. Validate the "stuckness."
      *   *Section 1: The Verbal Core.* Focus on "Principle." The Generalist needs *guidance*; the Particularist denies *codifiability*. If "principle" means "true universal," Particularists are Generalists (via supervenience). If "principle" means "action-guiding rule," Generalists might be Particularists (if rules are too complex).
      *   *Section 2: The Substantive Residue.*
          *   *Holism:* Is "lying is wrong" always a reason against, or does it depend? This is real.
          *   *Epistemology:* Is moral knowledge propositional (knowing-that) or practical (knowing-how)? This is the real fight.
      *   *Section 3: The Supervenience Wrinkle.* Explain why it doesn't solve the debate. It solves the metaphysics, not the epistemology. It's a constraint, not a guide.
      *   *Section 4: Paths to Progress.*
          *   Shift from "Are there principles?" to "What is the cognitive architecture of moral judgment?"
          *   Distinguish *Justification* (logic) from *Explanation* (psychology).
      *   *Confidence Statement:* High confidence on the verbal/epistemic split. Lower confidence on the empirical path (psychology might not settle normativity).

  6.  **Refining the Tone:**
      *   Needs to be philosophical, precise, respectful of the user's expertise (they teach this), and diagnostic rather than prescriptive.
      *   Avoid name-dropping (Dancy, McNaughton, Hooker, etc.) unless necessary for clarity, as requested ("Ground the diagnosis in what each side actually claims rather than surveying the literature").
      *   Ensure the "Supervenience" point is handled carefully. It's a necessary truth, but does it function as a principle?

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I answer if it's substantive or verbal? *Answer:* Both.
      *   *Check:* Did I address the "wrinkle"? *Answer:* Yes, distinguished metaphysical vs. epistemic function.
      *   *Check:* Did I suggest progress? *Answer:* Yes, cognitive architecture and complexity.
      *   *Check:* Confidence level? *Answer:* Need to be honest. The metaphysical/epistemic split is solid; the empirical resolution is shaky.

  8.  **Final Polish:** Ensure the distinction between *Metaphysical Generalism* (supervenience holds) and *Epistemic Generalism* (principles are usable) is clear. This is the key to unlocking the "stuckness." The Particularist accepts the former but denies the latter. The Generalist needs the latter but often argues for the former.

      *(Self-Correction on the "Wrinkle"):* The user asks if supervenience helps or is a red herring. I need to be clear: It helps clarify the metaphysics but is a red herring for the *normative* debate about guidance. I will argue it's a "distracting truth."

      *(Refining the "Progress" section):* Don't just say "empirical." Specify *what* empirical data. Moral psychology regarding rule-following vs. pattern recognition. Also, formal results on complexity (is the function from natural to moral properties computable?).

      *(Confidence):* I am highly confident the debate is primarily epistemic disguised as metaphysical. I am less confident that empirical data can resolve the normative question of *justification*.

  9.  **Final Output Generation** (matching the structure of the thought process).
answer: |-
  Here is a diagnosis of the debate, grounded in the claims you have outlined.

  ### Diagnosis: A Category Error Disguised as a Metaphysical Dispute

  My diagnosis is that the debate is **primarily verbal regarding metaphysics, but substantively epistemic.** The two sides are largely agreeing on the metaphysical structure of moral reality (that it is consistent and supervenient) while disagreeing fundamentally on the cognitive architecture required to navigate it (codifiability vs. discernment). The "stuckness" arises because Generalists often argue for the existence of moral truths (which Particularists accept), while Particularists argue for the impossibility of codification (which Generalists often deny is necessary).

  Here is the breakdown of the verbal, substantive, and cross-purpose elements.

  #### 1. The Verbal Core: The Definition of "Principle"
  A significant portion of the deadlock is verbal, turning on the ambiguity of the word "principle."
  *   **The Generalist** typically uses "principle" to mean a *truth-apt generalization that plays a justificatory role.* For them, if a moral verdict is correct, there must be a true statement explaining why.
  *   **The Particularist** uses "principle" to mean a *finite, statable, action-guiding rule.* For them, a principle must be something an agent can actually hold in mind and apply to generate a verdict.

  **The Resolution:** If we distinguish between **Metaphysical Generalizations** (true universal claims about the relation between natural and moral properties) and **Epistemic Principles** (formulations accessible to finite minds that guide reasoning), the verbal dispute dissolves.
  *   Particularists accept Metaphysical Generalizations (via supervenience).
  *   Generalists often *need* Epistemic Principles to satisfy their worries about learning and justification.
  *   The debate stalls because Generalists argue for Metaphysical Generalizations to prove the existence of Epistemic Principles, while Particularists attack Epistemic Principles to deny the relevance of Metaphysical Generalizations.

  #### 2. The Substantive Residue: Holism and Codifiability
  Once the terminological debris is cleared, two substantive disagreements remain. These are worth arguing about.

  **A. The Holism of Reasons (Metaphysical/Substantive)**
  This is the claim that a feature's moral valence can change across contexts (e.g., pleasure is usually good, but sadistic pleasure is bad).
  *   **The Disagreement:** It is not about whether valence *can* change (most Generalists admit defeasibility), but about the *structure* of that change. The Generalist claims the valence change is itself rule-governed (there is a higher-order principle explaining when pleasure becomes bad). The Particularist claims the valence change is not governed by a further principle but by the specific context itself.
  *   **Is it worth arguing about?** Yes. If the Generalist is right, morality is a recursive system of rules. If the Particularist is right, morality is a system of patterns that cannot be fully recursed. This is a claim about the complexity of moral reality.

  **B. The Codifiability of Competence (Epistemic)**
  This is the disagreement you identified regarding justification.
  *   **The Disagreement:** Must the justification for a moral verdict be articulable as a premise in an argument? The Generalist says yes (justification requires subsumption under a rule). The Particularist says no (justification can reside in the reliability of a perceptual capacity, akin to recognizing a face without stating the geometric rules of facial features).
  *   **Is it worth arguing about?** Yes. This is a fundamental dispute in epistemology regarding the relationship between *knowing-that* and *knowing-how*.

  #### 3. The Supervenience Wrinkle: A Distracting Truth
  You asked if the Particularist's acceptance of supervenience ("no moral difference without a natural difference") helps or is a red herring.

  **Diagnosis:** It is a **distracting truth.** It helps clarify the metaphysics but is a red herring for the normative debate.
  *   **Why it doesn't help the Generalist:** Supervenience guarantees a universal generalization exists (e.g., "For all x, if x has natural properties N, x has moral properties M"). However, this generalization may be infinitely complex, disjunctive, or gerrymandered. A principle that exists but cannot be stated or grasped by a human mind cannot serve the Generalist's function of *guidance* or *learning*.
  *   **Why the Particularist accepts it:** The Particularist is not a subjectivist. They believe moral verdicts are objective responses to natural features. They only deny that the *mapping function* from natural to moral is simple enough to be captured by a finite set of rules.
  *   **Verdict:** The supervenience claim concedes Metaphysical Generalism but leaves Epistemic Generalism untouched. It should be treated as a background constraint, not a move in the game.

  #### 4. Paths to Progress
  Given this diagnosis, progress will not come from better counterexamples or refined definitions of "defeasibility." It requires shifting the terrain.

  **A. A Change of Question (The most promising path)**
  Stop asking "Are there principles?" and start asking **"What is the computational complexity of the moral function?"**
  *   If the mapping from natural properties to moral verdicts is computationally tractable for a human mind, the Generalist is likely right (we can learn the rules).
  *   If the mapping is intractable (requiring more processing power or memory than a human possesses to state the exceptions), the Particularist is right (we must rely on heuristics and discernment).
  *   **Progress:** A formal result showing that any principle set capturing moral truth must exceed finite cognitive capacity would vindicate Particularism without denying objective truth.

  **B. Empirical Results (Moral Psychology)**
  Investigate how moral competence is actually acquired and exercised.
  *   If moral learning looks like language acquisition (implicit rule learning via exposure), it supports Particularism.
  *   If moral learning looks like mathematics (explicit instruction in axioms and derivation), it supports Generalism.
  *   **Caveat:** This risks the naturalistic fallacy (how we *do* reason vs. how we *should*). However, if the Generalist claims principles are *necessary* for learning, empirical evidence that people learn successfully without explicit principles undermines the Generalist's necessity claim.

  **C. A Distinction (Justification vs. Explanation)**
  Distinguish between the **Order of Justification** (what makes the act right) and the **Order of Knowledge** (how we know it is right).
  *   Generalists often conflate these, arguing that because there is an order of justification (truths), there must be an accessible order of knowledge (principles).
  *   Particularists argue the Order of Justification can be holistic and complex, while the Order of Knowledge is perceptual.
  *   **Progress:** Explicitly agreeing that supervenience secures the Order of Justification, while debating solely focuses on the Order of Knowledge.

  ### Confidence and Uncertainty

  **Confidence Level:** High (85%)
  I am highly confident that the debate is primarily an epistemic disagreement (codifiability) masquerading as a metaphysical one (existence of truths), and that the supervenience constraint is compatible with both sides once "principle" is disambiguated. The history of the debate suggests that when Generalists retreat to "defeasible principles," they are implicitly admitting the Particularist's point about complexity, while the Particularist's acceptance of supervenience implicitly admits the Generalist's point about objectivity.

  **Least Certain Part:** The Empirical Path
  I am least sure that empirical results about how people *actually* reason can resolve the normative question of how they *ought* to reason. The Generalist can always argue that current human moral reasoning is flawed and *needs* principles to be corrected, regardless of how people currently learn. Therefore, while cognitive science can illuminate the debate, it may not be able to settle the normative claim about the necessity of principles for justification.
