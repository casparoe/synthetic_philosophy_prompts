answer: |-
  ### Diagnostic Taxonomy of Multipolar Traps in Open-Source Governance

  **Instructions for the Board:** Answer the following questions sequentially regarding the specific conflict you are facing (e.g., the security disclosure race, the maintainer burnout cycle). Follow the path indicated by your answer to arrive at a diagnostic position.

  **Q1.** Is the destructive outcome driven primarily by **misaligned incentives** between participants (they want different things), or by a **shrinking set of viable options** imposed by the environment (no one wants this, but it happens anyway)?
  *   *Misaligned Incentives:* Go to Q2.
  *   *Shrinking Options:* Go to Q9.

  **Q2.** (Incentives) Is the core conflict a **one-time temptation to betray** a partner for gain, or a **cumulative over-consumption** of a shared resource until it collapses?
  *   *Temptation to Betray:* Go to Q3.
  *   *Cumulative Over-consumption:* Go to Q7.

  **Q3.** (Betrayal) Is the defection driven by **fear** that others will defect first, or by **greed** regardless of what others do?
  *   *Fear:* Go to Q4.
  *   *Greed:* Go to Q5.

  **Q4.** (Fear) Can this fear be resolved by **transparent communication** alone, or does it require **binding commitments** that survive a change of heart?
  *   *Transparent Communication:* **Leaf 1: Coordination by Signal.**
  *   *Binding Commitments:* Go to Q5.

  **Q5.** (Commitment/Greed) Do binding commitments or deterrents require a **central authority** with punishment power to be credible?
  *   *Yes, Central Authority:* Go to Q6.
  *   *No, Decentralized:* **Leaf 2: Norms and Reputation.**

  **Q6.** (Authority) Since we are a volunteer body, does this authority rely on **formal legal power** (which we lack) or **simulated authority** (control of funds, branding, or merge rights)?
  *   *Formal Legal Power:* **Leaf 3: The Leviathan (External).**
  *   *Simulated Authority:* **Leaf 4: The Leviathan (Internal Simulation).**

  **Q7.** (Commons) Is the shared resource **rivalrous** (my use directly reduces your share, e.g., funding) or **non-rivalrous but degradable** (my use hurts the system long-term, e.g., maintainer attention)?
  *   *Rivalrous:* **Leaf 5: Payoff Matrix Restructuring.**
  *   *Non-rivalrous/Degradable:* Go to Q8.

  **Q8.** (Degradable) Is the degradation caused by **external market pressures** or by **internal community values** (e.g., demand for free support)?
  *   *External Market Pressures:* **Leaf 6: Exit and Voice.**
  *   *Internal Community Values:* **Leaf 7: Preference Transformation.**

  **Q9.** (Shrinking Options) Is the shrinking option set caused by **competitor actions** forcing an arms race, or by **technical complexity** (entropy) making the system unmaintainable?
  *   *Competitor Actions (Arms Race):* Go to Q10.
  *   *Technical Complexity (Entropy):* Go to Q11.

  **Q10.** (Arms Race) Can the race be halted by **changing the metric of success** (values) rather than changing the rules?
  *   *Yes, Change Metrics:* **Leaf 7: Preference Transformation.**
  *   *No, Change Rules:* **Leaf 8: Technological Fixes.**

  **Q11.** (Entropy) Can **technological constraints** (code) enforce limits where social contracts fail?
  *   *Yes:* **Leaf 8: Technological Fixes.**
  *   *No:* **Leaf 9: Fatalism.**

  **Q12.** (Meta) Is "Moloch" a **useful single model** for these issues, or a **category error** conflating distinct problems?
  *   *Useful Single Model:* (Return to Q1).
  *   *Category Error:* **Leaf 10: Deflationary Pluralism.**

  ***

  ### Diagnostic Leaves (Positions and Escape Routes)

  **Leaf 1: Coordination by Signal**
  *   **Escape Route:** Information sharing / Transparency.
  *   **Awkward Commitment:** You must assume all participants are rational actors who will honor verbal assurances even when silence is safer.

  **Leaf 2: Norms and Reputation**
  *   **Escape Route:** Norms and reputational mechanisms.
  *   **Awkward Commitment:** You must believe social shame hurts a volunteer's future prospects more than immediate gain helps them.

  **Leaf 3: The Leviathan (External)**
  *   **Escape Route:** Centralized authority or Leviathan.
  *   **Awkward Commitment:** You must invite a corporate sponsor or legal entity to own the project, accepting that they may prioritize profit over mission if incentives shift.

  **Leaf 4: The Leviathan (Internal Simulation)**
  *   **Escape Route:** Centralized authority (Volunteer context).
  *   **Awkward Commitment:** You must grant a "Benevolent Dictator" veto power they cannot legally enforce, relying entirely on their restraint to avoid a fork.

  **Leaf 5: Payoff Matrix Restructuring**
  *   **Escape Route:** Changing the payoff matrix (Mechanism Design).
  *   **Awkward Commitment:** You must find resources to subsidize cooperation (e.g., bounties) without creating a market for exploitation.

  **Leaf 6: Exit and Voice**
  *   **Escape Route:** Exit and Voice.
  *   **Awkward Commitment:** You must accept that the only solution for burned-out maintainers is to leave the project, potentially killing it.

  **Leaf 7: Preference Transformation**
  *   **Escape Route:** Changing preferences or values.
  *   **Awkward Commitment:** You must believe you can educate or shame participants into valuing sustainability over feature velocity without appearing elitist.

  **Leaf 8: Technological Fixes**
  *   **Escape Route:** Technological fixes.
  *   **Awkward Commitment:** You must believe code can solve political problems, ignoring that humans can always fork the code to bypass the constraint.

  **Leaf 9: Fatalism**
  *   **Escape Route:** None (Acceptance).
  *   **Awkward Commitment:** You must accept that the project has a natural lifespan and that fighting its decay is economically irrational.

  **Leaf 10: Deflationary Pluralism**
  *   **Escape Route:** Deflationary view ('Moloch' is not one thing).
  *   **Awkward Commitment:** You must abandon the search for a unified theory of governance, treating every conflict as a unique case requiring a bespoke solution.

  **Leaf 11: Unnamed (The Selection Pressure View)**
  *   **Escape Route:** None (Evolutionary).
  *   **Awkward Commitment:** You must accept that the current maintainers will be replaced by those willing to tolerate worse conditions, lowering the baseline for everyone.
      *(Note: This leaf is logically distinct but often conflated with Leaf 9).*

  **Leaf 12: Unnamed (The Contractualist View)**
  *   **Escape Route:** Binding commitments.
  *   **Awkward Commitment:** You must rely on Contributor License Agreements (CLAs) to enforce behavior, risking community alienation for legal clarity.
      *(Note: This leaf is logically distinct but often conflated with Leaf 2 or 4).*

  ***

  ### Unoccupied and Problematic Combinations

  **1. The "Volunteer Leviathan" Paradox (Q5 -> Q6)**
  *   **Combination:** Requiring central authority (Q5=Yes) while lacking formal power (Q6=Simulated).
  *   **Status:** **Unstable.** This position is occupied by Leaf 4, but it is inherently fragile. It is unoccupied in the "Formal" branch for a volunteer board because you explicitly lack enforcement power. If you answer "Yes" to Authority but "No" to having power, you are relying on a social construct that collapses the moment a participant decides to ignore it.

  **2. Binding Commitments without Enforcement (Q4 -> Q5)**
  *   **Combination:** Requiring binding commitments (Q4=Commitment) but rejecting central authority (Q5=No) and rejecting reputational costs (Leaf 2 rejection).
  *   **Status:** **Incoherent.** A commitment is not binding if there is no cost to breaking it. There are no leaves here because this logical space is empty; a "binding" promise without an enforcer or reputation system is merely a prediction.

  **3. Technological Fixes for Incentive Problems (Q1 -> Q9)**
  *   **Combination:** Diagnosing the problem as Misaligned Incentives (Q1=Incentives) but attempting a Technological Fix (Leaf 8).
  *   **Status:** **Unattractive/Failed.** While the tree routes Incentive problems to Q2-Q8, many boards attempt to solve Incentive problems (Q1) with Technical Fixes (Leaf 8). This combination is flagged as high-risk: code cannot fix greed, only redirect it.

  **4. Preference Transformation without Authority (Q8 -> Leaf 7)**
  *   **Combination:** Seeking to change values (Leaf 7) without the authority to set culture (Leaf 4) or the leverage of funding (Leaf 5).
  *   **Status:** **Unexplored/Weak.** This position is often defended rhetorically but rarely succeeds in practice without accompanying structural changes. It is occupied, but weak.

  ### Indistinguishable Leaves

  **Leaf 2 (Norms) vs. Leaf 7 (Preferences)**
  *   **Why:** Both rely on social pressure and internal motivation rather than external enforcement.
  *   **Distinction:** Leaf 2 punishes deviation (shame); Leaf 7 prevents deviation (education/values). In practice, a board may not be able to distinguish whether a maintainer is acting out of fear of shame or genuine belief.

  **Leaf 4 (Internal Leviathan) vs. Leaf 12 (Contractualist)**
  *   **Why:** Both rely on a central point of control (a person or a legal document managed by the board).
  *   **Distinction:** Leaf 4 is personal/discretionary; Leaf 12 is procedural/legal. Without legal counsel, a volunteer board often cannot distinguish between a "Dictator" and a "Contract Administrator."
