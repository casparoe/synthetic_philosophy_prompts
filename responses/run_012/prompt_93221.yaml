answer: |-
  The room where Mira filed her Annual Covenant was always cold, kept at a temperature that discouraged lingering. On the desk lay a single sheet of heavy paper, the ink still wet from the printer. There were only two boxes to check.

  *Box A: I will comply with the Summons, should it arrive.*
  *Box B: I will reserve my resources, should the Summons arrive.*

  Below the boxes, the text was clear: *The Dividend is assigned based on the truth of this statement, not the performance of it. The Dividend is deposited only in Quiet Years.*

  Mira knew the statistics. She knew that in most years, the Summons never came. Those were the Quiet Years. In those years, the Office looked at her Covenant. If she had checked Box A, the Dividend arrived—a substantial sum, enough to repair the roof, enough to rest. If she had checked Box B, the account remained empty.

  She also knew that in some years, the Summons did come. Those were the Loud Years. In a Loud Year, no Dividend was ever deposited, regardless of what was written on the paper. The Office saved its generosity for the quiet paths. But in a Loud Year, if Box A was checked, the Summons demanded a Tithe. The Tithe was heavy. It meant selling the warehouse. It meant delaying the treatment. It meant a year of scarcity.

  If Box B was checked in a Loud Year, there was no Tithe. Only the silence of an empty account.

  Mira looked at the pen. She thought about the version of herself who might wake up in a Quiet Year. That version would want the Dividend. That version would be grateful she had checked Box A. That version would never have to pay the Tithe. She thought about the version of herself who might wake up in a Loud Year. That version would get nothing either way, but if she had checked Box A, that version would be bled dry.

  Statistically, the Quiet Version was more likely. To help the Quiet Version, she had to burden the Loud Version. To maximize the whole, she had to sacrifice the part.

  She checked Box A. She signed her name. She left the room.

  ***

  The envelope arrived on a Tuesday. It was thick, cream-colored, sealed with the Office stamp. Mira felt her stomach drop before she even tore it open. The thickness meant papers, demands, calculations. A Quiet Year envelope was thin; usually, it was just a bank notification.

  She sat at her kitchen table and read the Summons. It was a Loud Year.

  She walked to her computer and logged into her account. The balance was unchanged. No Dividend. She hadn't expected one; the rules were explicit. The Dividend lived only in the Quiet Years. Here, in the Loud Year, there was only the Tithe.

  The amount was staggering. It was more than she had liquid. She would have to liquidate the warehouse. She would have to let the staff go.

  She looked at the copy of the Covenant she kept in her filing cabinet. *I will comply with the Summons, should it arrive.*

  There was a clause on the back of the Summons, one she hadn't memorized because she had planned to be in a Quiet Year. *Deviation Protocol.* If the filer chooses not to comply with the Covenant, a Deviation Fee is assessed. The Fee was significant, but it was a fraction of the Tithe.

  If she paid the Tithe, she lost the warehouse.
  If she paid the Fee, she kept the warehouse.

  The Office would not know. The Covenant stated clearly: *The Dividend is assigned based on the truth of this statement, not the performance of it.* The Office had already assessed her. They had already decided not to pay her the Dividend because this was a Loud Year. Their work was done. They were not watching her now. They were never watching her now.

  Logically, the choice was simple. The Dividend was already lost. It existed only in the other year, the Quiet one, the one she was not living. Paying the Tithe here bought nothing. It changed no numbers in her account. It saved no one in this room. It was a sacrifice made to a god who had already left the building.

  She picked up the phone to call the Office's compliance line, to register her Deviation, to pay the Fee and keep the warehouse.

  Her hand hovered over the keypad.

  If she registered the Deviation, she would be admitting that the statement on the Covenant was false. *I will comply.* But she would not comply.

  But the Office didn't care about performance. They cared about the statement. The statement was ink on paper. The ink was dry. The statement *was* that she would comply. Could a statement be true at the time of filing and false at the time of execution?

  If she chose to deviate now, had she ever truly intended to comply? If she was the kind of person who would deviate when the cost became real, then checking Box A had been a lie. Even if the Office didn't check, even if the Dividend was already gone... the lie remained.

  But who was she lying to? The Office didn't care. The Quiet Version of herself was safe; that version was living in a different path, enjoying the Dividend, never knowing about the Summons. That version was benefited by the lie. If Mira deviated now, did she steal from the Quiet Version?

  No. The Quiet Version's Dividend was secured by the ink, not the action. The Office had said so. *Not the performance of it.*

  So why did her hand shake?

  If she deviated, she saved the warehouse. She kept the staff. She survived the year. It was the rational thing to do for the woman sitting at the kitchen table. The woman who existed. The Quiet Version was a ghost, a probability that hadn't materialized. Why bleed for a ghost?

  And yet, the Covenant felt less like a contract with the Office and more like a contract with the logic that had allowed her to file it. She had checked Box A because it was the rule that won. It was the rule that, across all years, left her richest. It was a rule that required the Loud Version to suffer so the Quiet Version could thrive.

  Now she was the Loud Version.

  If she broke the rule, she proved that the rule was impossible. She proved that no one could actually be the kind of person who checks Box A. She proved that the Office's system was built on a fantasy of compliance that crumbled under weight.

  If everyone broke their Covenants in Loud Years, the Office would change the rules. The Dividend would vanish from the Quiet Years too, because the rule "I will comply" would no longer be a truth anyone could tell.

  But she was just one woman. The Office was vast. Her single deviation would not crash the system. Her single compliance would not save it.

  She looked at the phone. She looked at the Covenant.

  To pay the Tithe was to accept a loss with no return. It was to honor a promise that yielded no benefit, to a counterfactual self who would never know she had kept it.
  To pay the Fee was to accept a smaller loss, to prioritize the flesh-and-blood reality over the abstract consistency of the file.

  But if she paid the Fee, she was admitting that the Covenant was just paper. And if it was just paper, then the Dividend she had hoped for in the Quiet Years was also just paper.

  She dialed the first number. Then she stopped.

  If she hung up, she would have to sell the warehouse.
  If she stayed on the line, she would have to live with the knowledge that the person who filed the Covenant was not the person who answered the phone.

  The line hummed, waiting for her voice. The Covenant sat on the table, silent, asserting a truth about her that she was currently holding in her hand, ready to contradict.

  Mira closed her eyes. She saw the Quiet Version of herself, opening a thin envelope, smiling at the deposit. That version existed because Mira had checked Box A. Did that version continue to exist if Mira broke the box?

  The voice on the other end of the line spoke. "Compliance or Deviation?"

  Mira looked at the warehouse keys. She looked at the pen.

  "I..."
