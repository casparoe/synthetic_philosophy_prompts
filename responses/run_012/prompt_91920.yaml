prompt: |-
  I am a retired experimental physicist who has spent the last few years working through the philosophy of inference, and I am preparing a long-form interview for a small podcast series on foundations. My guest defends a particular and, to my mind, contestable reading of Richard Jeffrey's rule for updating on uncertain evidence. He does not present probability kinematics as a fallback for the rare case where evidence arrives less than certainly. His thesis is that the rigidity condition — that learning leaves the conditional probabilities given the elements of the evidence partition untouched — is not a substantive assumption about evidential states at all, but a stipulation about what counts as a single episode of learning. Where rigidity fails, he says, either there was more than one episode or there was no learning; and so the familiar complaints that the rule is partition-sensitive, and that it gives different results depending on the order in which uncertain evidence arrives, miss their target, since a sequence of rigid updates on incompatible partitions was never a well-defined evidential history to begin with.

  Please draft eight to ten questions that will make him work for his answers. I want at least one question each on: the stipulative reading of rigidity and whether it renders the position unfalsifiable; the order-dependence and partition-sensitivity objections, pressed as hard as the literature presses them; what exactly the input to the rule is supposed to be — the content of the uncertain evidence — and whether that content can always be redescribed as certain evidence about his own experiential or doxastic state, so that ordinary conditioning would do; the characterisation of the rule as the update that minimises divergence from the prior subject to the new probabilities on the partition, and whether that characterisation survives his reading; and the diachronic constraints of the Dutch-book and reflection variety, which are usually taken to favour conditioning instead. For each question, add a one-line note of the answer he is most likely to give, and then a follow-up aimed at that answer rather than at a straw man. Nothing about his career or how he came to the view, and no need to name papers — I want the arguments, not a reading list.

  Two final things. Flag which of your questions rest on contested readings of the rule, and where you are least confident that you have characterised his position correctly, since I have given it to you only in my own words. And if my summary of his view is a caricature, or if good questions here cannot be posed without settling technicalities first, say so plainly instead of producing a tidy list to please me.
