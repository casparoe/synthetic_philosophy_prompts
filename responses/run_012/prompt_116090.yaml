answer: |-
  This is one of the sharpest observations you can make about the intersection of neuroscience, ethics, and medicine. You have identified a genuine fissure between the *ontological* picture (what exists inside the skull) and the *pragmatic* picture (how we manage the human being in the world).

  Current medical and ethical practice does not rest on a single, coherent theory of consciousness. Instead, it operates on a **Pragmatic Unity Model**. This model is not trying to solve the metaphysical problem of whether there are one or two minds; it is trying to solve the administrative problem of how to keep a human organism alive, legal, and integrated.

  Here is the breakdown of what that practice is strictly committed to, where it is neutral, and what would happen if you forced the "two minds" theory into the clinic.

  ### 1. What the Practice is Strictly Committed To
  To function, the current medical-legal framework *must* believe three things, regardless of the neuroscience:

  *   **The Body is the Patient:** Medicine treats the organism, not the consciousness. The chart belongs to the biological human, not the "stream of experience." As long as the body is one continuous biological entity with one nervous system (even if severed centrally), it gets one chart. This is non-negotiable for logistics (billing, bed assignment, drug dosage).
  *   **Verbal Report Equals Agency:** The practice assumes that the capacity to enter into a social contract (consent) requires language. Since the left hemisphere (in most people) controls speech, the left hemisphere is the default signatory. The practice is committed to the idea that **if you can't speak it, you can't consent to it.** This effectively disenfranchises the non-verbal right hemisphere, not because it lacks feeling, but because it lacks a voice in the legal system.
  *   **Behavioral Coherence Trumps Internal Conflict:** If the hands fight, the medical system views this as a symptom (like a tremor or a spasm) to be managed, not as a civil war between two citizens. The practice is committed to the view that *social integration* is the metric of health. If the girl is back in school and functioning as one unit, she is "healed," even if her internal phenomenology is fragmented.

  ### 2. What Fits Nicely But Isn't Required
  These are theories that make the practice feel comfortable, but the practice could survive without them:

  *   **The "Interpreter" Theory:** It fits nicely that the left brain is a storyteller that rationalizes the right brain's actions. This allows doctors to accept the patient's verbal report ("I'm fine") as the truth, even if the right hand is acting anxious. But medicine doesn't *need* this to be true; it just needs the patient to be able to sign the discharge form.
  *   **Subcortical Unity:** It fits nicely to believe the brainstem and thalamus keep the two halves synced enough during daily life to count as one system. This explains why the "split" mostly shows up in the lab (where cross-cues are blocked) and not the cafeteria. But again, even if they were totally distinct, the medical system would still treat the body as one unit for practical reasons.
  *   **Personhood as a Social Grant:** It fits the view that "being one person" is something society *does* to you, not something you *are*. By treating her as one person, the school and doctors help *make* her one person. This is a sociological fit, not a neurological necessity.

  ### 3. Where the Practice is Actually Neutral
  This is the most critical part. The current system does not actually take a stand on the hard questions you asked:

  *   **Consciousness vs. Language:** Medicine is neutral on whether the silent right half is conscious. It treats the silence as a *disability*, not a lack of soul. If the right hand pulls the sock off, the doctor doesn't ask, "Who felt the urge?" They ask, "How do we stop the behavior?" The internal experience is irrelevant to the prescription.
  *   **The Reality of Unity:** The practice does not presuppose that unity is something you can "look inside and check." In fact, it assumes the opposite: that unity is fragile and often illusory. When the patient says "I feel like one person," the doctor accepts this not because it's metaphysically true, but because it's the only statement that allows for a coherent treatment plan.
  *   **Zombie vs. Person:** The system is neutral on whether the right half is a "zombie." It treats the right half as **sub-personal machinery.** In medicine, there are things that happen *to* you (reflexes, seizures, hormonal surges) and things you *do* (decide, consent, speak). The non-verbal hemisphere is categorized with the reflexes. It is part of the "it," not the "I."

  ### 4. Resolving the Inconsistency: Lab vs. Clinic
  You asked if this is an inconsistency or if there is a story where both are true. The most robust defense of current practice is the **Ecological Argument.**

  *   **The Lab Manufactures Isolation:** Split-brain phenomena usually require strict conditions: eyes fixed on a central point, stimuli flashed for milliseconds, hands hidden from view. This prevents the two halves from sharing information via eye movements, head turns, or auditory cues.
  *   **Life Allows Integration:** In the real world, the left hemisphere can hear what the right hemisphere sees (via speech), and the right hemisphere can feel what the left hemisphere touches (via subcortical pathways). They can coordinate through the body.
  *   **The Verdict:** The lab reveals the *architecture* (two processors); the clinic treats the *system* (one computer). The practice assumes that as long as the system outputs coherent behavior, the internal architecture is a matter for neuroscience, not ethics.

  ### 5. What Changes If We Take the "Two Minds" Line Seriously?
  If we decided that the right hemisphere is a distinct moral person with rights equal to the left, the medical protocol would collapse. Here is what would have to change day-to-day:

  *   **Consent:** You could not proceed with surgery (or any major treatment) with only verbal consent. You would need a non-verbal consent mechanism for the right hemisphere. If the right hand refuses (e.g., pushes the needle away), the procedure might be halted as a violation of that "person's" autonomy.
  *   **Anesthesia:** You would have to verify that *both* hemispheres are unconscious. Currently, we assume if the patient stops responding, they are under. In a two-mind model, the speaking half might be asleep while the listening half is aware but paralyzed. You would need bilateral EEG confirmation of unconsciousness as a moral requirement, not just a safety one.
  *   **Pain Management:** This is the biggest hurdle. Currently, if the patient says "my pain is 4/10," we treat that. If the right hemisphere feels pain but cannot report it, it is currently ignored. If it is a person, **silence is not absence of suffering.** You would have to treat pain based on physiological markers (heart rate, pupil dilation, hand withdrawal) regardless of verbal report. You might have to administer double the analgesia to ensure both "people" are comfortable.
  *   **The Chart:** You would need a mechanism to record conflicting preferences. "Patient A (Left) wants discharge; Patient B (Right) is exhibiting distress signals." Who wins? Currently, the Left wins by default. In a two-mind model, you might need a guardian *ad litem* appointed specifically for the non-verbal hemisphere.
  *   **Liability:** If the left hand assaults someone, is the right hand complicit? Currently, the *body* is liable. In a two-mind model, you might have to prove which hemisphere initiated the act to assign moral blame.

  ### Summary of the Implicit Theory
  The medical establishment operates on a **Functional Monism.**

  It believes that a "person" is defined by the capacity for **social negotiation** (language, law, consent). Because only one hemisphere can negotiate, only one hemisphere is recognized as the "person." The other hemisphere is treated as a **ward of the person**—a part of the self that has feelings and agency but no voice, similar to how we treat children or pets in a legal sense: we protect them, but they don't sign the contracts.

  The inconsistency you see isn't a bug; it's a feature. The lab is designed to find the *components*; the clinic is designed to manage the *whole*. To treat the split-brain patient as two people in the clinic would be to prioritize metaphysical precision over human welfare, likely resulting in a child who cannot get consent for life-saving care because her right hand objects. The system chooses the "lie" of unity because the truth of duality is administratively unlivable.
