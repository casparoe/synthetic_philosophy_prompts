prompt: |-
  ive been reading about program equilibrium (i think thats the name) -- the setup where two agents in a prisoners dilemma can each read the others source code before deciding, so mutual cooperation becomes self-enforcing because each one reasons that it cooperates as long as the other does. i get the basic trick. what i actually want is the most important implications of it: for building real multi-agent systems, for mechanism design, and for how i should think about AI agents that might end up cooperating (or colluding) with each other. and one thing that bugs me -- the whole thing seems to lean on both sides being able to read each others code. so what happens to all those implications if the agents are black boxes that can only see each others input/output behavior, like two LLMs talking over an API? does the interesting part survive, or does it just collapse back into ordinary game theory where you cant trust anyone. give me the implications, not a textbook summary.
