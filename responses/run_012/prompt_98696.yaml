prompt: |-
  I'm a fourth-year phil PhD student and I've been roped into leading our department's interdisiplinary reading group next week -- mostly historians and lit people, no philosophy past a survey course -- on the wrong kind of reasons problem. Ninety minutes, a whiteboard, and I want a plan for the explanation, not the explanation itself. What has to come first for the question to even make sense to them (do I need the fitting-attitude picture of value on the board before the problem means anything, or does the problem itself do the motivating?), which single example should carry the whole session -- and if not the usual one about a demon threatening you unless you believe something, then why not, and what instead -- the misconceptions they'll walk in with or pick up along the way (my guesses: that "wrong kind" just means "immoral", and that it's the same thing as pragmatic vs. epistemic reasons), exactly where in the sequence I should head each one off, and one question at the end that tells me whether they've actually got the distinction rather than just nodding along. Tell me what to openly refuse to cover at this level, and keep what's actually settled apart from what people working on this genuinely fight about -- I dont want to hand them one camp's line dressed up as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** 4th-year Philosophy PhD student.
      *   **Task:** Leading an interdisciplinary reading group (Historians, Lit scholars, no advanced Phil).
      *   **Topic:** The "Wrong Kind of Reasons" (WKR) problem.
      *   **Constraints:** 90 minutes, whiteboard available.
      *   **Goal:** A *plan* for the explanation, not the explanation itself.
      *   **Specific Requirements:**
          *   Determine prerequisites (Fitting-Attitude Analysis needed first?).
          *   Select a single carrying example (Demon belief case vs. alternatives).
          *   Identify misconceptions (Immoral vs. WKR, Pragmatic vs. Epistemic).
          *   Sequence interventions for misconceptions.
          *   Final comprehension check question.
          *   Define scope limits (what *not* to cover).
          *   Distinguish settled vs. contested claims.

  2.  **Deconstruct the Topic (WKR Problem):**
      *   *What is it?* It arises primarily in value theory (buck-passing account/fitting-attitude analysis). It distinguishes between reasons that make an object valuable (right kind) and reasons to have an attitude toward the object that don't reflect its value (wrong kind).
      *   *Why is it hard?* It requires understanding the link between value and reasons for attitudes.
      *   *Audience Challenge:* Historians/Lit scholars care about interpretation, motivation, and context. They might not care about meta-ethical formalism. The example needs to resonate with *their* interests (interpretation, evidence, affect) while illustrating the philosophical point.

  3.  **Address Specific Requirements:**

      *   **Prerequisites (Fitting-Attitude vs. Problem First):**
          *   *Thought:* If I start with the WKR problem without explaining *why* we care about reasons for attitudes, it's abstract nonsense.
          *   *Decision:* Need a lightweight version of the Fitting-Attitude (FA) analysis first. Value = Fittingness of an attitude. Without this, "Wrong Kind" has no anchor.
          *   *Board Work:* Map Value $\to$ Attitude $\to$ Reasons.

      *   **The Example (Demon vs. Alternative):**
          *   *Standard:* The Evil Demon threatening you to believe he exists (or admire him).
          *   *Critique:* It's too metaphysical/epistemic. Historians/Lit folks might get bogged down in "belief" norms.
          *   *Alternative:* Admiration/Amusement. "The Stupid Joke" or "The Threatened Admiration."
          *   *Selection:* **The Threatened Admiration.** It's more intuitive than belief. "Admire this vile person or I shoot you."
          *   *Why:* It separates *goodness* from *reasons to respond*. It connects to Lit (character evaluation) and History (judging historical figures).
          *   *Wait, better idea:* **The Generous Tyrant.** A tyrant threatens to kill your family unless you admire him. He is not admirable (vile), but you have a massive reason to admire him (survival).
          *   *Refinement:* Let's stick closer to the classic "Demon" structure but translate it to **Admiration**. It's the standard for a reason. Let's call it "The Gunman's Request for Admiration."

      *   **Misconceptions:**
          1.  *WKR = Immoral Reasons:* No, pragmatic reasons can be wrong kind too.
          2.  *WKR = Pragmatic vs. Epistemic:* This is the biggest trap. WKR is about *value constitution*, not just belief norms.
          3.  *WKR = Bad Reasons:* No, they are often *stronger* reasons, just the wrong *kind*.
          *   *Intervention:* Address these immediately after introducing the example.

      *   **Sequence:**
          1.  Hook/FA Analysis (Value as fittingness).
          2.  The Example (Gunman/Admiration).
          3.  The Puzzle (Why doesn't this make him admirable?).
          4.  Misconception Check (Pragmatic/Epistemic distinction).
          5.  Solutions (Brief overview of strategies).
          6.  Assessment Question.

      *   **Scope Limits (What to refuse):**
          *   Don't solve it. (It's unsolved).
          *   Don't dive into Buck-Passing Account (BPA) technicalities beyond the basics.
          *   Don't cover Object-Given vs. State-Given reasons (too technical/jargon-heavy).
          *   Don't cover specific formal logic formulations.

      *   **Settled vs. Contested:**
          *   *Settled:* There is a distinction to be made. The Demon case generates it.
          *   *Contested:* How to define the distinction (object vs. state), whether it kills the FA analysis, whether it applies to epistemic reasons too.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Keep it tight. 15 mins on FA.
      *   *Example:* Use "The Critic and the Mobster." A mobster threatens a critic to write a good review.
          *   *Wait, is a review an attitude?* It expresses one.
          *   *Better:* "Admiring the Mobster."
          *   *Why:* Historians judge figures. Lit scholars judge characters. Admiration is central to both.
      *   *Misconceptions:* Need to explicitly stop the "Pragmatic vs. Epistemic" slide. That's for belief. This is for *value*.
      *   *Final Question:* Needs to test if they see the *structural* difference, not just the moral difference.

  5.  **Refining the Output Structure:**
      *   Follow the user's prompt structure closely.
      *   Tone: Peer-to-peer (PhD to PhD), practical, strategic.
      *   Whiteboard cues: Explicitly state what goes on the board.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 90 minutes enough for FA + WKR?
      *   *Fix:* Keep FA very thin. Just "Value = Fitting Attitude." Don't debate realism vs. anti-realism.
      *   *Critique:* Is the Demon example actually bad for this group?
      *   *Fix:* The prompt asks "if not the usual one... why not." I should argue *for* a modification of the usual one. The "Belief" version is bad for non-philosophers. The "Admiration" version is better. I will recommend the **"Admiration" variant** of the demon case.
      *   *Critique:* How to handle the Pragmatic/Epistemic confusion?
      *   *Fix:* Make a specific board column for "Reason Type" vs "Reason Kind."
      *   *Critique:* What is the "Settled" stuff?
      *   *Fix:* Be careful. Very little is settled. The *existence* of the problem is settled. The *solution* is not.

  7.  **Final Polish:** Check against all constraints.
      *   Plan only? Yes.
      *   Prerequisites? Yes.
      *   Example choice? Yes.
      *   Misconceptions? Yes.
      *   Sequence? Yes.
      *   Final Question? Yes.
      *   Scope limits? Yes.
      *   Settled vs. Contested? Yes.

  8.  *(Self-Correction on "Settled"):* I need to be honest. Even the FA analysis is contested. I should frame it as "The Framework We Are Testing" rather than "Settled Truth."

  9.  *(Final thought on the Example):* Let's use **"The Art Forger."**
      *   *Scenario:* You have a reason to admire a painting (it saves your reputation/career), but the painting is a forgery (not beautiful/admirable).
      *   *Wait,* that conflates aesthetic value with instrumental value.
      *   *Stick to the Mobster/Admiration.* It's cleaner for Value Theory. "Admire me or I shoot."
      *   *Actually, let's go with the "Evil Demon" but translated to Admiration.* It's the canonical case for a reason. I will advise *modifying* the belief version to an attitude version (admiration/amusement) because historians/lit folks deal with affect and judgment more than doxastic norms.

      *(Final Decision on Example)*: **The "Admirable" Tyrant.** A tyrant threatens to destroy a city unless you admire him. He is cruel (not admirable). You have a reason (save the city). Does this reason make him admirable? No. Why?

      *(Final Decision on Misconception)*: The Pragmatic/Epistemic distinction is the biggest trap. I need to emphasize that WKR applies to *value*, not just belief.

      *(Final Decision on Final Question)*: Ask them to generate a new case. If they can generate a case where the reason is strong but doesn't constitute value, they get it.

      *(Let's write the response.)*
answer: |-
  Here is a 90-minute battle plan designed for a non-philosophy audience. It prioritizes conceptual clarity over technical precision, using the whiteboard to visualize the structural problem rather than the history of the debate.

  ### 1. The Prerequisite: Fitting-Attitude Analysis (FA)
  **Do you need FA on the board first?**
  **Yes.** You cannot explain what makes a reason the *wrong kind* without first establishing what the *right kind* is supposed to do. For historians and lit scholars, value is often intuitive or contextual. You need to formalize the link between **Value** and **Attitudes**.

  **Whiteboard Strategy (Minutes 0–20):**
  *   Draw a simple arrow: **Object Property $\rightarrow$ Fitting Attitude**.
  *   *Example:* "Cruelty" $\rightarrow$ "Disapproval." "Wittiness" $\rightarrow$ "Amusement."
  *   **The Claim:** To say something is "good" or "admirable" is just to say there is a reason to have a positive attitude toward it. (This is the Buck-Passing Account in disguise, but don't use that term yet).
  *   **The Trap:** If you skip this, the WKR problem looks like a distinction between "good reasons" and "bad reasons." It isn't. It's a distinction between reasons that *constitute* value and reasons that *bypass* it.

  ### 2. The Carrying Example: The Tyrant's Demand
  **Do not use the standard "Evil Demon/Belief" case.**
  **Why not?** Historians and lit scholars deal with *interpretation* and *affect*, not doxastic logic. The "belief" version invites epistemological tangents (evidence, truth conditions) that will derail the value theory point. They will get stuck on "Can you choose to believe?" rather than "Does this reason make him admirable?"

  **Use The Tyrant's Demand for Admiration.**
  *   **The Case:** A tyrant holds a city hostage. He announces: "If you do not genuinely admire me by noon, I will destroy the city."
  *   **The Facts:** The tyrant is cruel and vain (no properties that normally warrant admiration). You have an overwhelming reason to admire him (save the city).
  *   **The Question:** Does the threat make the tyrant *admirable*?
  *   **Intuition Pump:** Everyone will say "No." He is still vile, even if you must admire him.
  *   **The Problem:** If "admirable" just means "there is a reason to admire him," then the tyrant *is* admirable. But he isn't. So, there are two kinds of reasons.

  ### 3. Misconceptions & Intervention Sequence
  You must head these off *before* they solidify. Here is the sequence:

  **Misconception A: "Wrong Kind" = "Immoral Reasons"**
  *   **When it arises:** Immediately after the Tyrant case. Someone will say, "Well, the threat is an immoral reason."
  *   **Intervention (Minute 25):** Correct this immediately.
  *   **Board Move:** Create a column called **"Strength of Reason."** Note that the threat provides a *stronger* reason than the tyrant's virtues (which are zero).
  *   **Point:** The "Wrong Kind" reasons are often *weightier* than the "Right Kind." It's not about moral quality; it's about structural relevance. A pragmatic reason (save the city) is the problem here, not an immoral one.

  **Misconception B: WKR = Pragmatic vs. Epistemic Reasons**
  *   **When it arises:** When you try to generalize. Philosophers often map this onto the Pragmatic/Epistemic distinction in belief.
  *   **Intervention (Minute 45):** This is the most critical pivot.
  *   **Point:** Tell them explicitly: "In epistemology, we distinguish pragmatic reasons for belief (Pascal's Wager) from epistemic reasons (evidence). The WKR problem *looks* like that, but it is deeper."
  *   **Why:** The WKR problem threatens the definition of **Value**, not just the norms of **Belief**. If you can't distinguish the reasons, you can't define what 'good' means.
  *   **Board Move:** Draw a line between **Norms of Attitude** (how we should respond) and **Constitution of Value** (what makes things good). The WKR problem is about the latter.

  **Misconception C: "We just need a better definition of Admiration"**
  *   **When it arises:** During the solution brainstorming.
  *   **Intervention (Minute 60):** Acknowledge this is a proposed solution (the "Object-Given" vs. "State-Given" distinction), but note that defining "object-given" without circularity is the actual hard part. Don't let them think a dictionary fix solves it.

  ### 4. What to Refuse to Cover (Scope Limits)
  You have 90 minutes. To survive, you must openly refuse the following:
  1.  **The Formal Logic:** Do not write out the biconditionals for the Buck-Passing Account. It adds nothing for this audience.
  2.  **The "Solutions" Debate:** Do not try to adjudicate between the "Object-Given/State-Given" distinction, the "Correctness" theory, or the "Reasons First" approaches.
      *   *Script:* "There are five major camps on how to solve this. None have won. Today is about seeing why the problem breaks the machine, not fixing the machine."
  3.  **Epistemic Applications:** Do not let the discussion drift into "Is there a WKR problem for evidence?" That is a separate, equally toxic debate. Keep it on Value/Admiration.

  ### 5. Settled vs. Contested (For your opening framing)
  Be honest about the state of the field so they don't treat one view as dogma.
  *   **Settled:** The Tyrant case successfully generates a paradox for the Fitting-Attitude analysis of value. There *is* a distinction to be drawn between reasons that make an object valuable and reasons to desire an object that don't.
  *   **Contested:** *How* to draw that distinction non-circularly. (e.g., Is it about the content of the reason? The source? The attitude itself?). Whether this problem kills the Fitting-Attitude analysis entirely or just requires a patch.

  ### 6. The Final Comprehension Check (Minute 80–90)
  Do not ask "Does this make sense?" They will nod. Do not ask a multiple-choice question.

  **The Task:**
  "Break into pairs. I want you to construct a **new** Wrong Kind of Reasons case using a **different attitude** (not admiration, not belief).
  1.  Identify the Attitude (e.g., Gratitude, Fear, Amusement).
  2.  Identify the Object.
  3.  Give me a reason to have that attitude that is *overwhelmingly strong* but clearly does *not* make the object fit for that attitude."

  **Why this works:**
  *   If they produce a case where the reason is *weak* (e.g., "I have a small reason to be amused"), they failed (WKR reasons are often strong).
  *   If they produce a case where the reason *does* make the object fit (e.g., "I am grateful because he helped me"), they failed (that's Right Kind).
  *   If they produce a case that relies on *moral* badness (e.g., "I fear him because he is evil"), they might be conflating WKR with moral judgment.
  *   **Success:** They generate something like: "A comedian threatens to shoot me unless I laugh at his joke. I have a reason to laugh, but the joke isn't funny." This proves they grasp the structural gap between **Reason for Attitude** and **Fittingness of Attitude**.

  ### Summary Timeline
  *   **00–20:** Fitting-Attitude Analysis (Value = Fitting Response).
  *   **20–35:** The Tyrant Case (The Paradox).
  *   **35–50:** Misconception Purge (Strength vs. Kind; Pragmatic vs. Constitutive).
  *   **50–70:** Why it matters (Implications for History/Lit: Judging figures vs. Reasons to study them).
  *   **70–80:** Brief survey of "Why is this hard to fix?" (Contested terrain).
  *   **80–90:** The Pair-Work Generation Task.

  ### Whiteboard Layout Plan
  *   **Left Panel:** **The Framework.** Object $\rightarrow$ Property $\rightarrow$ Fitting Attitude.
  *   **Center Panel:** **The Tyrant Case.** Reason to Admire (Save City) vs. Property of Tyrant (Vile). The Clash.
  *   **Right Panel:** **The Distinction.**
      *   *Right Kind:* Makes object valuable.
      *   *Wrong Kind:* Makes attitude rational, leaves object valueless.
      *   *(Keep this up during the final exercise).*
