  **Bureau of Dispositional Certification (BDC)**
  **Public Guidance FAQ: Form Series D (Dispositional Verification)**

  **About this page**
  This document outlines standard operating procedures for applicants seeking certification of categorical or dispositional properties pursuant to the Metric and Modal Standards Act (1998). All certifications are provisional pending the completion of Forms D-1 through F-9. The Bureau does not accept liability for manifestations occurring outside scheduled stimulus events.

  **1. How do I apply for a Dispositional Certificate?**
  Submit Form D-1 (Claim of Property) and Form D-2 (Stimulus Plan). The Stimulus Plan must specify the exact triggering condition (e.g., striking, immersion, heating) and the expected manifestation. Fees are calculated per stimulus event. Note that possessing the disposition is distinct from manifesting it; certification confirms the former based on the latter.

  **2. My object did not manifest the property during the test. Is it uncertified?**
  Not necessarily. Non-manifestation may result from masking conditions (e.g., packing foam, protective coating). Submit Form M-4 (Declaration of Absent Interferers). You must affirmatively state that no extrinsic factors prevented the manifestation despite the disposition's presence. If Form M-4 is approved, the object is certified as possessing the disposition despite the negative test result. Retesting is not required.

  **3. My object manifested the property, but I suspect it lacks the disposition.**
  This indicates a potential Mimic Case. Submit Form I-7 (Intrinsic Basis Verification). The applicant must demonstrate that the manifestation arose from the object's intrinsic categorical base rather than an extrinsic mechanism (e.g., hidden electromagnets, sorcery). Please note: The Bureau verifies manifestations, not intrinsic bases. Form I-7 requires the applicant to certify the basis themselves. False declarations are punishable under Section 12 of the Act.

  **4. The stimulus removed the disposition before it could manifest. What do I do?**
  This is a Class-F (Finkish) Event. Submit Form F-2 (Counterfactual Persistence Claim). In Class-F events, the stimulus itself destroys the disposition prior to manifestation (e.g., a wizard removing fragility upon contact). To certify, you must confirm the disposition existed at the moment of stimulus *and* that it would have manifested had it not been removed. However, empirical confirmation requires the stimulus to occur, which removes the disposition. Applicants should proceed with the stimulus while simultaneously asserting the disposition's persistence through the removal event.¹

  **5. When is the Certificate valid?**
  Certificates are valid indefinitely, provided the object's intrinsic structure remains unchanged and no new masks, mimics, or finkish interveners appear. The Bureau defines "unchanged" as "consistent with the conditions present at the time of testing." If conditions change, the certificate is void. Certificates confirm the disposition exists if and only if the object would manifest the property under the tested conditions, excluding cases where it does not manifest.²

  ***

  ¹ *Staff Note: Dr. Aris Thorne (Senior Modal Analyst) dissent: This procedure presupposes the truth of the conditional it is meant to verify. Form F-2 asks applicants to certify a counterfactual whose antecedent negates the consequent's ground. This is not verification; it is performative assertion.*
  ² *See Case Ref: 88-Beta-9 (Vase survived drop; certified fragile).*

  ***

  **Note on the Piece**

  I took liberties with the "fink" case for bureaucratic brevity; real finkish cases involve specific causal chains where the stimulus triggers the removal mechanism instantly, whereas Form F-2 implies a simultaneous assertion that is logically tighter than most real-world inspections allow.

  On the metaphysics: I hold that fink, mask, and mimic cases show the simple Conditional Analysis (CA) to be false outright, not merely in need of refinement. Lewis's revised CA attempts to save the analysis by adding "ceteris paribus" clauses regarding intrinsic bases and normal conditions. However, this renders the analysis trivial or circular: to specify "normal conditions" non-circularly requires listing all possible masks and finks, which is an infinite task. If the analysis relies on a clause that says "except when it doesn't work," it offers no explanatory power. The CA fails because dispositions are real properties grounding counterfactuals, not reducible to them. I am highly confident in this position; the literature has yet to produce a non-circular refinement that survives a determined counterexample.
