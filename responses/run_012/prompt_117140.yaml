          *   1 pt: Assess Desert/Responsibility. (Student says both responsible for outcomes, which is internally consistent but relies on the luck classification). -> 0.5/1 (Ambiguous).
          *   1 pt: Assess Guilt (Agent-Regret). (Student dismisses it as misplaced. Williams would say agent-regret is appropriate even without harm. Student misses the nuance of agent-regret). -> 0.5/1.
          *   1 pt: Coherence with Part (a). (Student maintains Control Principle here, which is good, but misclassifies the luck). -> 1/1.
          *   *Refined Score:* The taxonomy error is the big one. The guilt analysis is weak on Williams. Let's go 2/4.
      *   **Part (c) [3 pts]:**
