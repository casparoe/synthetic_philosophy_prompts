answer: |-
  **Project Title:** The Normative Force of Transitivity: Distinguishing Comparative and Choice-Guiding Betterness

  **Project Summary**
  Spectrum arguments pose a severe threat to the transitivity of "better than." If we accept that a sequence of small improvements leads from a high-quality life to a repugnant one (or from a short, wonderful life to a long, mediocre one), we seem forced to accept that the endpoint is better than the start, despite the intuitive verdict that the start is better than the endpoint. The standard responses are costly: accept intransitivity (and risk rational cycling), posit sharp cutoffs (and accept brute discontinuities), or appeal to vagueness (and risk obscuring the normative stakes).

  This project proposes that these responses share a faulty assumption: that "better than" functions as a unitary concept in these arguments. I hypothesize that spectrum arguments exploit an equivocation between a *comparative* notion of betterness (a structural relation describing the axiological ordering of states of affairs) and a *choice-guiding* notion (a normative relation prescribing rational selection). My central claim is that the transitivity intuition derives its force from the choice-guiding notion, while the comparative notion may remain transitive (or intransitive) without generating a paradox for rational agency. The project will rigorously distinguish these notions, determine whether they can come apart, and assess whether decoupling them dissolves the spectrum paradox without incurring the costs of standard solutions.

  **The Research Question**
  The project seeks a determinate answer to the following question: **Does the transitivity of the comparative "better than" relation entail the transitivity of the choice-guiding "better than" relation in spectrum cases?**

  This is not merely a verbal dispute. A positive answer implies that standard spectrum arguments succeed: if the relations are locked together, breaking transitivity in one breaks it in the other, forcing us into the standard trilemma (intransitivity, cutoffs, or vagueness). A negative answer implies a novel solution: we can maintain a transitive axiological ordering while acknowledging that rational choice does not track that ordering step-by-step across long spectra. This would allow us to reject the conclusion of spectrum arguments without denying the intuitive superiority of adjacent steps or positing magical cutoffs.

  **Why Existing Positions Leave This Open**
  Current literature treats "better than" as a single operator subject to standard logical constraints.
  1.  **Intransitivists** (e.g., Temkin-style views) accept that $A > B$, $B > C$, but $C > A$. They generally assume this applies equally to how we compare values and how we choose. They do not ask whether a non-transitive comparative relation necessarily licenses non-transitive choice patterns.
  2.  **Cutoff Theorists** deny the chain of improvements. They argue that at some point, a small loss in quality is *not* compensated by a gain in quantity. This avoids intransitivity but relies on a discontinuity that many find metaphysically objectionable. They do not address whether the *choice* discontinuity must match the *comparative* discontinuity.
  3.  **Vagueness/Supervaluationists** argue that "better than" is vague in spectrum cases. While this handles the sorites structure, it often leaves the normative force unclear. If it is indeterminate whether $A$ is better than $B$, is it also indeterminate whether one should choose $A$? These views typically assume the link is tight.

  None of these positions explicitly interrogate the *link* between the structural relation and the normative prescription. They assume that if $A$ is axiologically better than $B$, rationality requires choosing $A$ over $B$. This project challenges that bridge principle. It is possible that the comparative relation is transitive (preserving a coherent value structure) while the choice-guiding relation is not (due to thresholds of perceptibility or normative significance), or vice versa. Existing debates assume the two stand or fall together; this project tests that assumption.

  **Methodology and Work Plan**
  Given the two-year fellowship period, the work will proceed in two phases: conceptual formalization (Year 1) and normative application (Year 2).

  *Year 1: Distinction and Formalization*
  The first task is to define the two notions precisely enough to test for independence.
  *   **Comparative Betterness ($>_{comp}$):** Defined structurally. $A >_{comp} B$ iff $A$ contains more value than $B$ according to a specific axiology (e.g., total utilitarianism, prioritarianism). This is a truth-apt claim about the world.
  *   **Choice-Guiding Betterness ($>_{choice}$):** Defined functionally. $A >_{choice} B$ iff a rational agent, aware of the relevant facts, is required to choose $A$ over $B$ in a binary choice.
  *   **Formal Modeling:** To satisfy the formal requirements of my committee and ensure precision, I will construct a simple formal model where these two relations are represented by distinct operators. I will test whether a system can maintain transitivity for $>_{comp}$ while allowing non-transitivity ( or failure of prescription) for $>_{choice}$ without generating rational cycles (e.g., money pumps).
  *   **Deliverable:** A paper establishing the distinction and arguing that the "collapse" of the two notions is not inevitable.

  *Year 2: Application to Spectrum Arguments*
  With the distinction in place, I will apply it to specific spectrum cases (e.g., the Repugnant Conclusion, torture vs. dust specks).
  *   **Testing the Bridge Principle:** I will examine the principle "If $A >_{comp} B$, then $A >_{choice} B$." I will argue that in spectrum cases, this principle fails due to *normative insensitivity*: small differences in comparative value may fail to trigger choice-guiding requirements.
  *   **Implications for Rationality:** If $>_{choice}$ is intransitive, does this lead to money pumps? I will investigate whether non-transitive choice guidance is vicious or merely reflects the structure of vague normative thresholds.
  *   **Deliverable:** A second paper applying the framework to dissolve the spectrum paradox, showing how we can accept the chain of comparative improvements without being forced to the repugnant conclusion in choice.

  **Success and Failure Conditions**
  It is vital to be honest about what counts as a result, given the risk that this distinction is merely verbal.
  *   **Positive Result:** I successfully demonstrate that $>_{comp}$ and $>_{choice}$ can diverge in spectrum cases without rendering rational choice incoherent. This would provide a new "fourth option" in the literature: transitive value, non-transitive choice guidance.
  *   **Negative Result (Type 1):** I demonstrate that the two notions necessarily collapse. If it turns out that "better than" *just means* "ought to be chosen" (or vice versa), the distinction is untenable. This is still a valuable philosophical result, as it would close off this line of inquiry and reinforce the necessity of the standard trilemma.
  *   **Negative Result (Type 2):** I demonstrate that transitivity attaches equally to both notions. Even if the concepts are distinct, it may be that the logic of value forces transitivity on both. This would show that the proposed solution fails, but would clarify why the spectrum argument is so resilient.

  **Scope and Feasibility**
  This is a tight fit for two years. The risk is that the project expands into a full theory of rational choice or a comprehensive axiology. To keep it manageable:
  *   **Constraint:** I will not attempt to solve the Repugnant Conclusion generally. I will only address whether the *spectrum argument form* relies on the conflation of these two notions.
  *   **Contingency:** If the formal modeling in Year 1 proves too time-consuming or reveals that the distinction is trivial, I will pivot to a purely conceptual analysis of the "bridge principle" between value and choice. The core question (does comparative transitivity entail choice transitivity?) remains answerable without complex formalism, though the formalism strengthens the case.
  *   **Feasibility:** The core work is analytical. The primary risk is not time, but the possibility that the distinction is shallow. However, even proving the distinction is shallow is a substantive contribution that prevents future scholars from pursuing the same dead end.

  **Conclusion**
  The spectrum argument relies on the pressure to preserve transitivity. By locating that pressure specifically in the choice-guiding notion, and asking whether it must be inherited from the comparative notion, this project opens a path through the standard impasse. Whether the distinction holds or collapses, the inquiry forces a clarification of what we mean when we say one thing is "better" than another, and why that should matter to how we live. This clarification is a prerequisite for any satisfactory resolution to the spectrum problems.
