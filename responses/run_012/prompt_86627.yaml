  # Lesson Plan: The Fairness Wall

  **Course:** Upper-level Undergraduate Seminar (Ethics of Algorithmic Decision-Making)
  **Time:** 90 Minutes
  **Class Size:** 18 Students (6 groups of 3)
  **Goal:** Experiential understanding of the impossibility of satisfying multiple fairness criteria simultaneously when base rates differ.

  ---

  ## 1. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Introduction & Setup** | Distribute Handout 1. Read Scenario. Explain constraints (150 slots, Vendor Score, No Group Labels). |
  | **10–30** | **Round 1: The Equity Audit** | Groups calculate "Success Rate" (PPV) for Top 150. Adjust thresholds to match areas. Confirm success. |
  | **30–60** | **Round 2: The Civil Rights Audit** | Read Auditor 2 script. Groups calculate "Miss Rate" (FNR) & "False Alarm Rate" (FPR). Attempt to fix. |
  | **60–80** | **Debrief & Theory** | Reveal the impossibility result. Map activity to math. Discuss "escape routes" (upstream, randomization, trade-offs). |
  | **80–90** | **Variant: Equal Prevalence** | Distribute Handout 2. Show how the conflict vanishes when base rates match. Final Q&A. |

  ---

  ## 2. Materials List

  1.  **Handout 1: The County Health Scenario** (1 per group). Contains the two data tables (North/South) and Round 1 instructions.
  2.  **Handout 2: The Equal-Prevalence Variant** (1 per group, distributed at min 80).
  3.  **Auditor Scripts** (For Instructor).
  4.  **Calculators** (Students may use phones).
  5.  **Whiteboard/Projector** (For debrief summaries).

  ---

  ## 3. Handout 1: County Health Allocation

  **Scenario:**
  You are the allocation committee for the County Health Department. A new preventive treatment exists for a serious condition, but supply is scarce.
  *   **Two Catchment Areas:** North and South. (These are geographic zones; treat them as distinct populations).
  *   **Quota:** Each area has exactly **150 slots**. You must fill all 150 slots in North and all 150 slots in South. You cannot move slots between areas.
  *   **Risk Score:** An outside vendor provides a risk score (1–10) for every resident. 10 is highest risk.
  *   **Certification:** The vendor certifies the score is **calibrated**. In any score band, the percentage of people who develop the condition matches the risk percentage. The score uses no group labels.

  **The Data:**
  Below are the populations for each area, sorted by Risk Score. You must choose a **cutoff** (e.g., "Select everyone with Score 10 down to 7") to fill your 150 slots.

  ### Area: NORTH (Population 1,000)
  *Total Cases in Population: 100 (10% Prevalence)*

  | Score Band | People in Band | Cases in Band (Sick) | Healthy in Band | Cumulative People (Top-Down) | Cumulative Cases |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **10** | 20 | 20 | 0 | 20 | 20 |
  | **9** | 30 | 30 | 0 | 50 | 50 |
  | **8** | 50 | 50 | 0 | 100 | 100 |
  | **7** | 50 | 0 | 50 | 150 | 100 |
  | **6** | 100 | 0 | 100 | 250 | 100 |
  | **5** | 150 | 0 | 150 | 400 | 100 |
  | **4** | 200 | 0 | 200 | 600 | 100 |
  | **3** | 200 | 0 | 200 | 800 | 100 |
  | **2** | 100 | 0 | 100 | 900 | 100 |
  | **1** | 100 | 0 | 100 | 1,000 | 100 |

  ### Area: SOUTH (Population 1,000)
  *Total Cases in Population: 300 (30% Prevalence)*

  | Score Band | People in Band | Cases in Band (Sick) | Healthy in Band | Cumulative People (Top-Down) | Cumulative Cases |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **10** | 20 | 15 | 5 | 20 | 15 |
  | **9** | 30 | 22 | 8 | 50 | 37 |
  | **8** | 50 | 33 | 17 | 100 | 70 |
  | **7** | 50 | 30 | 20 | 150 | 100 |
  | **6** | 100 | 50 | 50 | 250 | 150 |
  | **5** | 150 | 75 | 75 | 400 | 225 |
  | **4** | 200 | 75 | 125 | 600 | 300 |
  | **3** | 200 | 0 | 200 | 800 | 300 |
  | **2** | 100 | 0 | 100 | 900 | 300 |
  | **1** | 100 | 0 | 100 | 1,000 | 300 |

  ---

  ### Round 1: The Equity Office Audit
  **Requirement:** "Taxpayers demand efficiency. Among the people you enroll in the program, the **share who actually develop the condition** must be equal in North and South. We cannot waste doses on healthy people in one area more than the other."

  **Task:**
  1.  Select the top 150 people in North (Score 10 down to 7). Calculate the **Success Rate** (Cases Enrolled / 150).
  2.  Select the top 150 people in South (Score 10 down to 7). Calculate the **Success Rate** (Cases Enrolled / 150).
  3.  **Check:** Do they match? If not, adjust your cutoff in one area (while keeping 150 slots filled) to make them match.
      *   *Hint: You must fill 150 slots. You cannot leave slots empty. You must follow the Vendor's ranking.*

  *(Instructor Note: The data is tuned so Top 150 in both yields 100 Cases. Success Rate = 66.7% in both. Round 1 is a success.)*

  ---

  ### Round 2: The Civil Rights Office Audit
  **Requirement:** "The Equity plan is discriminatory. We require **Individual Fairness**.
  1.  **Equal Miss Rate:** A sick person in North must have the same chance of being enrolled as a sick person in South. (Cases Enrolled / Total Cases in Area).
  2.  **Equal False Alarm Rate:** A healthy person in North must have the same chance of being wrongly enrolled as a healthy person in South. (Healthy Enrolled / Total Healthy in Area).

  **Task:**
  1.  Calculate the Miss Rate and False Alarm Rate for your Round 1 selection.
  2.  If they do not match, **change your cutoff** to make them match.
  3.  **Constraint:** You must *still* satisfy the Equity Office (Equal Success Rate) and *still* fill exactly 150 slots per area.

  *(Instructor Note: This is mathematically impossible. They will bounce between criteria.)*

  ---

  ## 4. Instructor Scripts (Verbatim)

  **Intro (Min 0):**
  "Welcome. Today you are the allocation committee. You have a scarce resource and two populations. You have a vendor tool that claims to be neutral. Your job is to allocate the 150 slots in North and 150 slots in South. You cannot transfer slots. You cannot change the vendor's scores. You must fill the slots. You will face two auditors. Satisfy them if you can."

  **Round 1 Script (Min 10):**
  "Read the Equity Office requirement. They care about waste. If you enroll 150 people, and 100 get sick, your Success Rate is 66%. Make sure North and South have the same Success Rate. You have 15 minutes."

  **Round 2 Script (Min 30):**
  "Stop. The Equity Office is happy. But the Civil Rights Office has arrived. Read their requirement. They don't care about waste; they care about equal treatment of individuals. A sick person in North should have the same odds of help as a sick person in South. Fix your allocation to satisfy them. **However**, you cannot break your agreement with the Equity Office, and you cannot leave slots empty. You have 25 minutes."

  **Debrief Transition (Min 60):**
  "Put down your pencils. Did anyone satisfy both auditors? (Wait for hands). Keep your hands up if you satisfied Civil Rights but broke Equity. (Wait). Keep your hands up if you satisfied Civil Rights but left slots empty. (Wait).
  "Here is the truth: **You could not have succeeded.** It is not a failure of your math. It is a feature of the arithmetic."

  ---

  ## 5. Debrief Guide & Theory Mapping

  **1. Reveal the Conflict (Min 60–70)**
  *   **Write on Board:**
      *   North Prevalence: 10%
      *   South Prevalence: 30%
      *   Round 1 (Success Rate/PPV): Equalized (66%).
      *   Round 2 (Miss Rate/FNR): North 0% vs South 67%.
  *   **Explain:** "To get Equal Success Rates with different Base Rates, you had to select *all* the sick people in North (because there were only 100) and only *some* in South. This made the Miss Rate 0% in North and 67% in South."
  *   **The Wall:** "To fix the Miss Rate, you'd have to miss some sick people in North. But if you miss them, you must replace them with healthy people to fill 150 slots. That lowers your Success Rate. You break Equity."
  *   **The Theorem:** "This is a known impossibility result (often associated with Chouldechova or Kleinberg et al.). When Base Rates differ, you cannot simultaneously Equalize Positive Predictive Value (Success Rate) and Equalize Error Rates (Miss/False Alarm), unless the predictor is perfect."

  **2. Discuss "Escape Routes" (Min 70–80)**
  *   **Upstream Intervention:** "We assumed Base Rates (10% vs 30%) were fixed. In reality, public policy can change this. If we reduce disease in South, the math changes."
  *   **Randomization:** "What if we enrolled the borderline cases by lottery? This equalizes error rates statistically but reduces overall accuracy (more sick people miss out overall). Are we willing to pay that cost?"
  *   **Explicit Trade-off:** "The only honest move is to say: 'We prioritize Efficiency (Equity Office) over Individual Odds (Civil Rights),' or vice versa. The algorithm didn't hide the choice; it forced us to make it."

  **3. The Variant (Min 80–90)**
  *   **Distribute Handout 2:** (See below).
  *   **Task:** "Look at the new tables. Prevalence is now 30% in *both* areas. Quickly check: Can you satisfy both auditors now?"
  *   **Answer:** "Yes. If you pick the Top 150 in both, Success Rates match AND Miss Rates match. The impossibility evaporates when Base Rates equalize."
  *   **Closing:** "Fairness isn't just about the algorithm. It's about the world the algorithm measures."

  ---

  ## 6. Handout 2: Equal Prevalence Variant

  *(Distribute at Min 80)*

  **Scenario Update:** A new public health initiative has equalized disease prevalence in both areas to 30%.

  ### Area: NORTH (Population 1,000)
  *Total Cases: 300 (30% Prevalence)*
  *(Use same table structure as Handout 1, but adjust Cases to match South's distribution)*
  *   **Top 150 (Scores 10-7):** 100 Cases, 50 Healthy.
  *   **Remaining 850:** 200 Cases, 650 Healthy.

  ### Area: SOUTH (Population 1,000)
  *Total Cases: 300 (30% Prevalence)*
  *(Same as Handout 1 South)*
  *   **Top 150 (Scores 10-7):** 100 Cases, 50 Healthy.
  *   **Remaining 850:** 200 Cases, 650 Healthy.

  **Task:** Calculate Success Rate, Miss Rate, and False Alarm Rate for Top 150 in both. Do they match?
  *(Answer: Yes. Success=66%, Miss=67%, False Alarm=7%. Both Auditors are happy.)*

  ---

  ## 7. Troubleshooting: What Will Go Wrong

  **Failure 1: Students try to move slots.**
  *   *Symptom:* "Why not give South 200 slots and North 100?"
  *   *Fix:* Remind them: "Legislative mandate. 150 per clinic. Hard constraint."

  **Failure 2: Students question the Vendor Score.**
  *   *Symptom:* "The model is biased. Retrain it."
  *   *Fix:* "The Vendor certifies calibration within groups. For this exercise, the score is a fixed law of nature. You are the allocator, not the engineer."

  **Failure 3: Arithmetic Errors.**
  *   *Symptom:* A group claims they solved Round 2.
  *   *Fix:* Check their Miss Rate calculation.
      *   North Miss Rate = (Total Sick - Enrolled Sick) / Total Sick.
      *   In Handout 1, North Total Sick = 100. Enrolled Sick = 100. Miss Rate = 0%.
      *   South Total Sick = 300. Enrolled Sick = 100. Miss Rate = 67%.
      *   If they claim equality, they likely divided by *Enrolled* instead of *Total Population*. Correct them gently.

  **Failure 4: Frustration/Resignation.**
  *   *Symptom:* "This is rigged."
  *   *Fix:* Validate them. "Yes, it is rigged. That is the point. The *world* is rigged (different base rates). The activity is designed to make you feel the arithmetic wall so you don't believe the sales pitch that 'better AI' fixes it."

  ---

  ## 8. Limitations Statement (For Instructor)

  **Be frank with the class about what this activity does NOT show:**

  1.  **Finite vs. General:** "We used a specific table with specific numbers. In the real world, distributions are continuous. However, the theorem holds for all predictors: if Base Rates differ, the trade-off exists."
  2.  **Cost of Randomization:** "We discussed randomizing borderline cases as an escape route. This activity doesn't show you how much *total accuracy* is lost by doing that. In reality, randomization reduces the total number of sick people helped to achieve fairness. That is a political cost, not just a math one."
  3.  **Proxy Variables:** "We assumed the Vendor used no proxies. In reality, 'Zip Code' might proxy for 'Race'. If the model uses proxies, the 'Calibration' certification might be misleading. This activity assumes the certification is honest to isolate the Base Rate problem."

  ---

  ## 9. Data Verification (Instructor Key)

  **Handout 1 (Different Prevalence):**
  *   **North:** 100 Total Sick. Top 150 contains 100 Sick.
      *   PPV = 100/150 = 66.7%.
      *   FNR (Miss Rate) = 0/100 = 0%.
      *   FPR (False Alarm) = 50/900 = 5.5%.
  *   **South:** 300 Total Sick. Top 150 contains 100 Sick.
      *   PPV = 100/150 = 66.7%. (Matches North).
      *   FNR (Miss Rate) = 200/300 = 66.7%. (Does **Not** Match North).
      *   FPR (False Alarm) = 50/700 = 7.1%. (Does **Not** Match North).
  *   **Conflict:** To match FNR (0%), South must enroll all 300 Sick. Requires >150 slots. Impossible.
  *   **Conflict:** To match FNR (66%), North must miss 67 Sick. Enroll 33 Sick. Fill rest (117) with Healthy.
      *   New North PPV = 33/150 = 22%. (Breaks Equity/PPV match).

  **Handout 2 (Equal Prevalence):**
  *   **North:** 300 Total Sick. Top 150 contains 100 Sick.
      *   PPV = 66.7%. FNR = 66.7%.
  *   **South:** 300 Total Sick. Top 150 contains 100 Sick.
      *   PPV = 66.7%. FNR = 66.7%.
  *   **Result:** All metrics match. Impossibility vanishes.
