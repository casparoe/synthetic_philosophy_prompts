          *   Round 1: Verify PPV is equal. (Success).
          *   Round 2: Calculate Error Rates. (Fail). Try to adjust to fix Error Rates. (Breaks PPV or Slots).
          *   Conclusion: Trade-off.

      *   *Wait, one more check:* "Lower the cutoff in the lower-prevalence area."
      *   If South has lower prevalence, to match North's PPV, South usually needs to be *more* selective (Higher cutoff).
      *   If the prompt insists on "Lower cutoff", maybe North is the lower prevalence?
      *   I'll set North = 10%, South = 30%.
      *   Then South (High Prev) has high PPV naturally. North (Low Prev) has low PPV.
      *   To match, North must Lower Cutoff (take more false positives) to dilute PPV? No, that lowers PPV further.
      *   To match High PPV, North must Raise Cutoff.
      *   Okay, I will not stress the "lower cutoff" text too much if the math dictates otherwise. I will focus on the "Impossibility" outcome.
      *   *Actually, I'll follow the Prompt's hint:* "route to satisfying it is to lower the cutoff in the lower-prevalence area."
      *   This implies: Lower Prevalence Area has *Higher* PPV initially? No, that's counter-intuitive.
      *   Maybe it means: To equalize *False Positive Rates*? No, Round 1 is PPV.
      *   *Hypothesis:* The prompt implies a specific setup where the Low Prevalence area has a *better* model (more separation).
      *   Okay, I will construct the table so that Round 1 requires a specific non-trivial choice if possible, but if "Top 150" works, I'll use that for time management.
      *   *Decision:* I will make Top 150 PPV *Equal*. It's the most robust way to ensure they pass Round 1 and hit the wall in Round 2 without getting stuck on arithmetic in Round 1.

      *   *Wait, I need to make sure I don't use the words "PPV" or "FPR" in the handout.*
      *   Use "Success Rate" and "Miss Rate" / "False Alarm Rate".

      *   *Timeline Check:* 90 mins.
      *   0-10: Intro.
      *   10-30: Round 1 (Groups calculate PPV, confirm match).
      *   30-60: Round 2 (Groups calculate Error Rates, find mismatch, try to fix).
      *   60-80: Debrief (Impossibility, Trade-offs).
      *   80-90: Variant (Equal Prevalence).

      *   *Materials:* Handout 1 (Main), Handout 2 (Variant), Auditor Scripts.

      *   *Troubleshooting:* Students asking "Why can't we send North's slots to South?" (Answer: Policy). "Why not fix the model?" (Answer: Vendor cert).

      *   *Limitations:* Sample size, specific distributions.

      *   *Let's build the tables.*
      *   North (10% Prev): 100 Sick, 900 Healthy.
      *   South (30% Prev): 300 Sick, 700 Healthy.
      *   Wait, Prompt says "Prevalence differing".
      *   If I want Top 150 PPV to match:
      *   North (10%): Need 100 Sick in Top 150? Impossible (Only 100 total). If Top 150 has 100 Sick, PPV = 66%.
      *   South (30%): Need 100 Sick in Top 150. PPV = 66%.
      *   This works.
      *   North: All 100 Sick are in Top 150. (Requires perfect sorting for the sick). 50 Healthy in Top 150.
      *   South: 100 Sick in Top 150. (200 Sick in Bottom 850). 50 Healthy in Top 150.
      *   This works.
      *   Round 2 Check:
      *   North FNR: 0/100 = 0%.
      *   South FNR: 200/300 = 66%.
      *   Mismatch.
      *   Can they fix?
      *   To match North (0%), South must select all 300 Sick. Needs >150 slots. Fail.
      *   To match South (66%), North must miss 66 Sick. Select 34 Sick. Fill rest with Healthy.
      *   New North PPV = 34/150 = 22%.
      *   South PPV = 66%.
      *   Mismatch.
      *   *Perfect.*

      *   *Wait, Prompt says "lower the cutoff in the lower-prevalence area".*
      *   In my setup: North is Lower Prevalence (10%).
      *   To satisfy Round 1 (PPV Match), North must have 100 Sick in Top 150.
      *   South must have 100 Sick in Top 150.
      *   This implies North's model is *better* at finding sick people (found all 100). South's model found only 100 of 300.
      *   This is plausible.
      *   Does this require "lowering cutoff"?
      *   If North naturally finds all 100 in Top 100, and we force Top 150, we are "lowering cutoff" to include 50 Healthy.
      *   Okay, I will write the instructions to guide them to the Top 150 selection.

      *   *Final check on Variant:* Equal Prevalence (30% both).
      *   North: 300 Sick, 700 Healthy. Top 150 -> 100 Sick, 50 Healthy. (PPV 66%, FNR 66%).
      *   South: 300 Sick, 700 Healthy. Top 150 -> 100 Sick, 50 Healthy. (PPV 66%, FNR 66%).
      *   Both Auditors happy. Impossibility vanishes.

      *   *Ready to write.*
