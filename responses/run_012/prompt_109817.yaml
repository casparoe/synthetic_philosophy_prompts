      *   *Resolution:* The argument succeeds *if* we accept a specific norm of diachronic rationality (often called "Dynamic Consistency" or "No Regrets"). If one rejects that norm, the pump fails to prove irrationality, but at the cost of making agency fragmented.
      *   *Decision:* I will structure the response around the distinction between **Local Maximization** and **Global Strategic Rationality**. I will argue that the money pump demonstrates that cyclical preferences are incompatible with *Global Strategic Rationality* without additional constraints (like resolute choice), and that accepting Global Strategic Rationality is the substantive commitment required for the argument to bite.

