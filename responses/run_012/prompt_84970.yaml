      *   *Analyze Side A (Engineering):* They treat the world as closed or axiomatizable. "Relevance" is a search optimization problem.
      *   *Analyze Side B (Phenomenological):* They treat the world as open/holistic. "Relevance" is constitutive of the situation, not a filter applied to it.
      *   *Analyze Side C (Practitioners):* They are hitting the wall where the model meets the messy world. They are experiencing Side B's problem but using Side A's tools.
      *   *Determine the "Kind" of Disagreement:* It is **Incommensurable Research Programs** (Lakatos/Kuhn). They share the name "Frame Problem" but disagree on the *explanandum* (what needs explaining).
