      *   **Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy (Dennett's Multiple Drafts):**
      *   *Core Idea:* Consciousness isn't a single stream viewed by a homunculus (the "Cartesian Theater"). It's multiple narratives happening at once, edited and revised. There is no "balcony" where the self sits.
      *   *Application to Love:* Relationships aren't defined by one "spark" moment. They are a convergence of many small, overlapping, sometimes contradictory interactions.
      *   *Application to Vows:* If there's no single "Dan," who is promising? The answer is the *pattern* of behavior, the continuity of the narrative, even if the narrator is fragmented.

