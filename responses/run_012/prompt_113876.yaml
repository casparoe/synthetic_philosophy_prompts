answer: |-
  ### Disambiguation of Malthusian Claims

  1.  **The Mechanism Claim:** Fertility and mortality respond endogenously to the means of subsistence (density dependence).
      *   **Credence:** 0.90
      *   **Reasoning:** Biological density dependence is empirically robust across species, including humans pre-1800.
  2.  **The Equilibrium Claim:** Population stabilizes at a level where living standards are pinned near subsistence (the Iron Law of Wages).
      *   **Credence:** 0.30
      *   **Reasoning:** Historically valid for most of human existence, but broken by the Industrial Revolution's decoupling of income and population.
  3.  **The Impossibility Claim:** Sustained long-run growth in per capita living standards is impossible.
      *   **Credence:** 0.10
      *   **Reasoning:** Directly contradicted by two centuries of exponential per capita GDP growth globally.

  **Load-Bearing Claim:** For proposition $R$ to hold, the **Mechanism Claim** is load-bearing. If the mechanism is false, the theory is dead; if only the Equilibrium/Impossibility claims fail, the theory can be rescued as a special case (low-technology regime).

  ***

