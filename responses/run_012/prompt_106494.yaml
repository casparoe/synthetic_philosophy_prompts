  **Concede:** Lies damage general trust more broadly.
  **Soft:** Misleading also damages trust in conversational norms themselves.

  4. **Objection:** If lying treats humanity merely as a means, how can misleading be worse when it technically preserves the hearer's epistemic agency to infer the truth?
  **Reply:** Agency exploited is a deeper violation than agency bypassed.
  **Concede:** Lying remains strictly impermissible.
  **Soft:** Exploiting agency might be less disrespectful than overriding it completely.

  5. **Objection:** If the wrongness consists in making the hearer an accomplice, does this not inadvertently assign partial moral responsibility for the deception to the victim?
  **Reply:** The responsibility remains solely with the manipulator who engineered the complicity.
  **Concede:** The language of 'accomplice' is risky.
  **Soft:** It structurally implies the hearer's reasoning was a necessary condition for the wrong.
