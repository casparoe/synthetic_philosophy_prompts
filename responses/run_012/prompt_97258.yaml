          *   *Judenräte:* Dan missed the *biggest* controversy. I need to mention this because it explains *why* she got in trouble better than "banality."
          *   *Thoughtlessness:* Distinguish between "stupidity" and "failure of imagination/judgment."
          *   *Responsibility:* Crucial point. Arendt wants to *hold* him responsible, not excuse him. The "monster" defense excuses him by making him an aberration.
          *   *Stangneth/Tapes:* Acknowledge the evidence but explain why some scholars think it doesn't kill the "banality" argument (performance in court vs. reality).

  5.  **Final Review against Constraints:**
