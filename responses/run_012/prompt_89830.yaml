prompt: |-
  So this is half a rant, half a genuine request. I'm in a small Discord of people who argue about AI stuff, and there's this one guy who ends basically every conversation with "we should build tools, not agents." Most recently he deployed it to shut down my question about whether it's fine to give a coding assistant the ability to run shell commands and edit files in a loop — his line was that a tool does what you ask and an agent does what it wants, and the second thing is how you get Skynet, so obviously tools. I don't think he's totally wrong, but I also can't tell what he's actually claiming, and everyone else in the channel just nods along. I get the feeling that one sentence is being made to do way more work than it can bear.

  Can you take that line and lay out the different precise theses it could be expressing, roughly from the boring/trivial readings up to the radical ones? Off the top of my head it could mean: the system shouldn't have its own objectives at all; or it shouldn't take actions you didn't sanction; or it should only act when invoked; or it should be narrow instead of general-purpose; or it should be predictable and auditable; or the goal should live with the user and the system just executes; or that "agent" isn't even a natural kind and we should stop carving up the design space that way. I'm sure there are more I'm missing. For each reading, tell me whether it's a platitude, a substantive engineering or empirical claim, or just false, and then which of them would actually get him his conclusion — i.e. which reading of "tools, not agents" actually supports "so don't build the loop thing I asked about." Also tell me which reading people in AI-safety-adjacent circles usually have in mind when they say it, and whether the tool/agent line survives the awkward cases — an LLM with a shell and a loop, a compiler, a recommender that's "just doing what you asked" but has its own implicit objective buried in it, a service that has to interpret your request before it can serve it. I dont need citations or who said what first, I just want the menu of readings with verdicts on each, laid out so I can paste it into the channel.
