prompt: |-
  I run the forecast-review desk at a regional water authority: four analysts, none of them trained in dynamical systems, and we are the last stop before anything the authority says publicly about the future. We field fifteen to thirty requests a week, and they all have the same shape — someone needs to know something about the coming behaviour of a river, a reservoir, or the weather over it, and a decision with money or safety attached turns on the answer. The recurring ones are: the crest height at a particular gauging station five days out, to the nearest ten centimetres, because that number trips an evacuation threshold; the volume of snowmelt inflow over the next three weeks; the date the ice cover breaks up at a town downstream, which determines whether we pre-position crews; the first day of a cyanobacterial bloom in the reservoir; and the seasonal inflow total that the allocation decisions are built on. Our statute obliges us to publish a best-available forecast on fixed dates, so an output of "we don't know" is not available to us. The director who signs the statement has no technical background, and an analyst has to reach a verdict in under an hour, working mainly from our hindcast archive — twelve years of runs, twenty-member ensembles, two model upgrades inside that window.

  Please give me a decision procedure they can actually run: the questions to ask in order, what counts as a sufficient answer to each, the specific tests to perform on the archive, the point at which the procedure stops and declares the question unanswerable at that lead time and tolerance, and what to publish in that case that is still useful to whoever has to decide. Have the procedure terminate in one of a small fixed set of verdicts the director can act on. As you build it, distinguish the different things that can make a forecast fail, and be explicit about which of them better measurement would fix and which it would not; about the difference between a system that is unpredictable and one that is undetermined; and about where the procedure should hand the call to the director because what remains is a question about how much risk to accept rather than about the dynamics. Say which of those distinctions must survive the simplification and which can be dropped.

  Then run it on three of the cases above — including the one where I expect the honest verdict to be one my director will hate — and mark the steps that are judgment calls dressed up as procedure. Tell me where the procedure will misfire: what kind of failure it cannot see coming, and where it will produce false confidence. I don't need references or a reading list; I need the reasoning in plain terms. Throughout, keep separate what is settled from what specialists in this area genuinely disagree about — for instance, whether the practical horizon for day-to-day weather-type forecasts is a fundamental limit or an artifact of present models — and do not present a contested position as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Manager of a forecast-review desk at a regional water authority.
      *   **Team:** 4 analysts, *no training in dynamical systems* (crucial constraint).
      *   **Workload:** 15-30 requests/week, high stakes (money/safety).
      *   **Constraint:** Statutory obligation to publish *something* on fixed dates ("we don't know" is not an option).
      *   **Resources:** 12 years of hindcast archive, 20-member ensembles, 2 model upgrades within that window.
      *   **Decision Maker:** Director (non-technical) needs a clear verdict to sign off.
      *   **Time Limit:** Analyst has < 1 hour per verdict.
      *   **Specific Forecasts Needed:** Crest height (5-day, 10cm tolerance), Snowmelt volume (3-week), Ice breakup date, Cyanobacterial bloom start, Seasonal inflow total.
      *   **Requirements:**
          *   A concrete decision procedure (questions, tests, stop conditions).
          *   Fixed set of verdicts for the Director.
          *   Distinctions: Unpredictable vs. Undetermined, Measurement fixes vs. Model limits, Risk vs. Dynamics.
          *   Run the procedure on 3 cases (including one "bad news" case).
          *   Identify judgment calls disguised as procedure.
          *   Identify failure modes (false confidence, blind spots).
          *   Maintain epistemic honesty (distinguish consensus from contested theory).

  2.  **Deconstruct the Problem:**
      *   *The Core Tension:* The statute demands certainty (a number), but the physics (chaos, complexity) often denies it. The analysts lack the theoretical background to diagnose *why* a model is failing, so the procedure must be heuristic and data-driven (based on the archive).
      *   *The "We Don't Know" Problem:* Since they *must* publish, the output can't be silence. It must be a qualified number or a risk flag.
      *   *The Archive:* 12 years is decent but small for extreme events. 2 model upgrades complicate homogeneity.
      *   *The Verdicts:* Need to be actionable. Not "Probability 0.6," but "Go/No-Go/Wait" or "High Confidence/Low Confidence." Let's aim for a traffic-light system with specific numeric qualifiers.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Filter requests through a sieve of reliability checks using the hindcast archive.
      *   *Step 1: Define the Question.* (Lead time, variable, tolerance).
      *   *Step 2: Archive Match.* (Find similar historical initial conditions).
      *   *Step 3: Ensemble Spread Check.* (Is the model agreeing with itself?).
      *   *Step 4: Hindcast Skill Check.* (Did the model get this right in the past under similar conditions?).
      *   *Step 5: The "Undetermined" Check.* (Is the input data missing or garbage?).
      *   *Step 6: Verdict Selection.*
      *   *Verdicts:*
          1.  **Actionable (Green):** High skill, low spread.
          2.  **Qualified (Amber):** High skill, high spread OR Low skill, low spread (needs Director risk call).
          3.  **Unreliable (Red):** Low skill, high spread (Publish range, not point).
          *Wait, the statute says "best-available forecast."* So even in Red, we must publish a number. The verdict is for the *Director* on how to frame it.
          *Revised Verdicts:*
          1.  **Standard Forecast:** Publish point estimate.
          2.  **Risk-Weighted Forecast:** Publish point estimate + explicit warning flag.
          3.  **Scenario Forecast:** Publish range (min/max) instead of point.

      *   *Refining the Distinctions:*
          *   *Unpredictable (Chaos):* Small errors grow. Ensemble spread will be wide. Better measurement helps slightly, but horizon is hard limit.
          *   *Undetermined (Data/Structure):* We don't know the starting state or the physics are wrong. Ensemble spread might be narrow but *wrong*. Better measurement fixes this.
          *   *Risk:* The cost of being wrong. This is the Director's call, not the analyst's.

  4.  **Developing the Tests (using the 12-year archive):**
      *   *Analogue Matching:* Find past dates with similar initial states (flow, temp, snow pack).
      *   *Error Distribution:* Look at the error of those analogues in the hindcast.
      *   *Consistency:* Look at the 20-member ensemble spread *now*.
      *   *Model Break:* Check if the current run uses the newer model version. If the analogue is from the old model version, apply a bias correction or discard.

  5.  **Running the Procedure on 3 Cases:**
      *   *Case 1: Crest Height (5-day, 10cm tolerance).* High stakes, short lead time. Likely chaotic if storm-driven.
      *   *Case 2: Seasonal Inflow Total.* Long lead time. Driven by snow/seasonal trends. Less chaotic, more structural uncertainty.
      *   *Case 3: Cyanobacterial Bloom.* Biological + Physical. Highly nonlinear. Likely the "Director will hate this" case.

  6.  **Addressing the "Contested" Requirements:**
      *   *Weather Horizon:* Is 5-day weather fundamental or model artifact? Consensus says chaos limits it, but models improve. Don't claim one is true.
      *   *Bloom Prediction:* Specialists disagree on whether this is predictable at all. Acknowledge this.

  7.  **Refining the Output Structure:**
      *   **Part 1: The Protocol.** (Steps, Tests, Verdicts).
      *   **Part 2: The Distinctions.** (Unpredictable vs. Undetermined, Risk vs. Dynamics).
      *   **Part 3: The Trial Run.** (3 Cases).
      *   **Part 4: Failure Modes.** (Where it breaks).

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* The analysts aren't dynamical systems experts. I can't ask them to calculate Lyapunov exponents.
      *   *Fix:* Use "Ensemble Spread" and "Hindcast Error" as proxies for chaos/uncertainty.
      *   *Critique:* The statute forbids "we don't know."
      *   *Fix:* The "Red" verdict isn't silence; it's publishing a range or a "planning value" (e.g., the 90th percentile) rather than the mean.
      *   *Critique:* Model upgrades in the archive.
      *   *Fix:* The procedure must flag analogues from the "old model" era and penalize their weight or exclude them if the physics changed fundamentally.
      *   *Critique:* Judgment calls disguised as procedure.
      *   *Fix:* Explicitly label where the analyst chooses the "similarity threshold" for analogues. That's a tuning parameter, not a law of physics.

  9.  **Final Polish:**
      *   Ensure tone is professional, direct, and empathetic to the operational constraint.
      *   Check that the "Director will hate" case is actually honest (likely the bloom or the specific crest height if chaos is high).
      *   Ensure the distinction between *risk* (consequence) and *uncertainty* (probability) is clear for the Director.

  **(Self-Correction on the "Director will hate" case):** The Director hates uncertainty. The case where the honest verdict is "We are guessing" is the one they hate. The Cyanobacterial bloom is the best candidate for this because it couples biology and physics, often exceeding the skill of pure hydrological models. Or the 10cm crest height if a storm is on the edge of predictability. Let's pick the Crest Height for the "hate" case because it involves safety/evacuation, making the uncertainty politically toxic. Actually, the Bloom is scientifically shakier. Let's go with the Bloom for scientific uncertainty, but the Crest Height for *operational* tension. The prompt asks for the one where the *honest verdict* is hated. If the procedure says "Unreliable," the Director has to publish a range, which looks weak. Let's use the Crest Height for that, as it triggers evacuation.

  *Wait, re-reading prompt:* "including the one where I expect the honest verdict to be one my director will hate."
  Okay, I need to identify which one that is. Usually, it's the one where the model says "I don't know" but the law says "You must." I'll select the **Crest Height** for this, because 10cm tolerance on a 5-day flood forecast is often beyond the skill of operational models during volatile weather, and admitting that undermines the evacuation trigger.

  *Wait, second thought:* The Bloom is likely *more* unpredictable. But the Crest Height has immediate safety consequences. Let's stick with Crest Height as the high-stakes failure.

  *Actually, let's look at the "Unpredictable vs Undetermined" requirement.*
  *   *Unpredictable:* Chaos (Weather).
  *   *Undetermined:* Data/Physics gaps (Bloom biology, Snowpack density).
  I should showcase both.

  *Plan:*
  1.  **Protocol:** "The 60-Minute Triage."
  2.  **Concepts:** Unpredictable vs. Undetermined, Risk vs. Uncertainty.
  3.  **Cases:**
      *   Crest Height (5-day): The "Hate" case (High Chaos).
      *   Seasonal Inflow: The "Structural" case (Long term).
      *   Cyanobacteria: The "Undetermined" case (Complex system).
  4.  **Failure Modes:** False confidence, Archive bias.

  *Let's refine the Verdicts for the Director:*
  1.  **Firm:** Publish the number.
  2.  **Advisory:** Publish the number + "High Variability" tag.
  3.  **Planning:** Publish the *worst-case* (or best-case) bound, not the mean.

  *Let's refine the "Model Upgrade" issue:*
  The archive has 2 upgrades. The procedure needs a step to check if the analogue comes from a compatible model version. If not, discard or apply bias correction. I will make this a specific step.

  *Let's refine the "Judgment Calls":*
  Choosing the "similarity" metric for analogues is a judgment call. Defining the "tolerance" for ensemble spread is a judgment call. I must highlight these.

  *Let's refine the "Contested" stuff:*
  Weather predictability horizon. Some say 2 weeks is hard limit, others say better models push it. I will state this as "Operational Consensus vs. Theoretical Debate."

  *Okay, ready to write.*
answer: |-
  ### Part 1: The 60-Minute Triage Protocol

  This procedure is designed for analysts without dynamical systems training. It relies on your archive as a "look-up table" of past performance rather than attempting to diagnose the physics in real-time. It forces the separation of *dynamic uncertainty* (the system is chaotic) from *structural uncertainty* (the model or data is wrong).

  **The Three Verdicts (For the Director)**
  The analyst does not recommend action; they recommend *confidence*. The Director maps confidence to action.
  1.  **VERDICT A (Firm):** Publish the ensemble mean. The archive suggests errors will likely fall within the requested tolerance.
  2.  **VERDICT B (Advisory):** Publish the ensemble mean *plus* a statutory "High Variability" flag. The number is the best guess, but the archive shows frequent outliers.
  3.  **VERDICT C (Planning):** Do not publish the mean. Publish the 90th percentile (for safety/flood) or 10th percentile (for supply/drought). The system is too volatile for a point estimate to be useful.

  ---

  **The Procedure Steps**

  **Step 1: Define the Constraint**
  *   **Action:** Write down the Lead Time (L), the Variable (V), and the Tolerance (T).
  *   **Test:** Is T smaller than the typical measurement error of the gauging station?
  *   **Stop Condition:** If Yes, flag as **Structural Limit**. No model can beat the ruler. Proceed to Step 4 but mark "Measurement Noise."
  *   *Distinction:* This is **Undetermined** by data quality. Better measurement fixes this. Models cannot.

  **Step 2: The Ensemble Spread Check (Current State)**
  *   **Action:** Look at the 20-member ensemble running *now*. Calculate the Standard Deviation (SD) at Lead Time L.
  *   **Test:** Is SD > 0.5 * T?
  *   **Stop Condition:** If Yes, the model itself is disagreeing. This indicates **Dynamic Unpredictability** (Chaos). Better measurement will not fix this; the atmosphere/water is sensitive to initial conditions. Mark "High Chaos."
  *   *Judgment Call:* The 0.5 factor is arbitrary. It assumes a normal distribution. If the spread is bimodal (two distinct clusters), this test fails.

  **Step 3: The Hindcast Analogue Search (Historical Skill)**
  *   **Action:** Query the 12-year hindcast archive. Find the 10 past dates with initial conditions (flow, temp, soil moisture) closest to today.
  *   **Constraint:** Discard analogues from before a Model Upgrade if the physics relevant to V changed (e.g., new snow module).
  *   **Test:** Calculate the error of the model on those 10 dates at Lead Time L. What % fell within Tolerance T?
  *   **Threshold:**
      *   >80% within T → Proceed to Verdict A.
      *   50-80% within T → Proceed to Verdict B.
      *   <50% within T → Proceed to Verdict C.
  *   *Judgment Call:* Defining "closest" initial conditions. You are assuming that similar starts yield similar errors. This is the core assumption of analogue forecasting. It breaks if the system has drifted (non-stationarity).

  **Step 4: The "Undetermined" Check (Input Data)**
  *   **Action:** Check the input data quality for the current run (snow sensors, rain gauges upstream).
  *   **Test:** Are >20% of key sensors missing or flagged "unverified"?
  *   **Stop Condition:** If Yes, the forecast is **Undetermined** by input. The model is guessing the start state.
  *   **Verdict:** Automatic Verdict C. Publish the planning bound.
  *   *Distinction:* This is fixable by better telemetry, not better math.

  **Step 5: Final Selection**
  *   **Action:** Combine Step 2 (Chaos) and Step 3 (Skill) and Step 4 (Data).
  *   **Logic:**
      *   If Data Bad → Verdict C.
      *   If Data Good + Chaos High + Skill Low → Verdict C.
      *   If Data Good + Chaos Low + Skill High → Verdict A.
      *   Mixed signals → Verdict B.
  *   **Output:** Generate the text for the Director. Include the "Confidence Metric" (e.g., "Historical hit rate: 6/10").

  ---

  ### Part 2: Conceptual Distinctions (For the Analyst's Mind)

  You must train your analysts to distinguish these three buckets. If they confuse them, the procedure fails.

  **1. Unpredictable (Chaos) vs. Undetermined (Ignorance)**
  *   **Unpredictable:** The system is deterministic but sensitive. Two nearly identical starts diverge.
      *   *Signature:* Ensemble spread is wide (Step 2).
      *   *Fix:* None. This is a hard horizon. Better measurement delays the divergence slightly but cannot eliminate it.
      *   *Procedure Handling:* Verdict B or C.
  *   **Undetermined:** We lack the information to initialize the model, or the model lacks the physics to represent a key process.
      *   *Signature:* Ensemble spread is narrow (everyone agrees), but Hindcast Skill is low (everyone is wrong). Or Step 4 triggers.
      *   *Fix:* Better sensors (telemetry) or model physics upgrades.
      *   *Procedure Handling:* Verdict C. Do not let the Director treat a narrow spread as truth if the hindcast says the model is biased.

  **2. Risk (Cost) vs. Uncertainty (Probability)**
  *   **Uncertainty:** How likely are we to be wrong? (The Analyst's job).
  *   **Risk:** How bad is it if we are wrong? (The Director's job).
  *   **The Handoff:** The procedure stops at Uncertainty. The Analyst says "There is a 40% chance we miss the 10cm tolerance." The Director decides "Is a 40% chance of failed evacuation acceptable?"
  *   **Survival:** This distinction *must* survive simplification. If the analyst starts making risk decisions (e.g., smoothing the number to avoid panic), they corrupt the data.

  **3. Contested vs. Settled**
  *   **Settled:** 5-day weather-driven flow has a hard skill ceiling. 10cm tolerance on a flood crest during a storm is often below that ceiling.
  *   **Contested:** Whether biological triggers (blooms) are predictable at all. Some specialists argue blooms are stochastic (random) events driven by micro-nutrients we don't measure; others argue they are deterministic but data-starved.
  *   **Procedure Stance:** Treat contested physics as **Undetermined**. Assume the model is missing the driver until the hindcast proves otherwise.

  ---

  ### Part 3: Running the Protocol on Three Cases

  #### Case 1: Crest Height at Gauging Station (5-day, 10cm tolerance)
  *Context: Evacuation threshold depends on this. High stakes.*

  *   **Step 1 (Constraint):** Tolerance 10cm. Gauge error is ±5cm. Pass.
  *   **Step 2 (Spread):** A storm is approaching. The 20-member ensemble shows a spread of 15cm at Day 5. (15cm > 0.5 * 10cm). **Flag: High Chaos.**
  *   **Step 3 (Hindcast):** Search archive for similar storm setups. Found 10 analogues. Only 3 of 10 forecasts hit the 10cm tolerance. Hit rate: 30%. **Flag: Low Skill.**
  *   **Step 4 (Data):** Rain gauges upstream are functioning.
  *   **Verdict:** **Verdict C (Planning).**
  *   **Publish:** Do not publish the mean (e.g., 5.2m). Publish the 90th percentile of the ensemble (e.g., 5.5m) as the "Planning Level."
  *   **Why the Director will hate this:** The Director wants a number to trip the evacuation switch (e.g., 5.0m). If the mean is 4.9m but the 90th percentile is 5.5m, Verdict C forces you to publish 5.5m. This might trigger an unnecessary evacuation. If you publish the mean (4.9m), you risk missing the flood. The honest verdict admits the model cannot distinguish between "flood" and "no flood" at this tolerance.
  *   **Judgment Call Disguised:** The choice of the 90th percentile. Why not 95%? Why not the max? This is a risk preference smuggled into the procedure.

  #### Case 2: Seasonal Inflow Total (3-month)
  *Context: Water allocation for farmers. Money attached.*

  *   **Step 1 (Constraint):** Tolerance is % based (±10%).
  *   **Step 2 (Spread):** Ensemble spread is tight. Weather averages out over 3 months.
  *   **Step 3 (Hindcast):** Archive shows the model consistently underestimates inflow by 15% in years with deep snowpack (bias).
  *   **Step 4 (Data):** Snow telemetry is sparse in high elevations. **Flag: Undetermined.**
  *   **Verdict:** **Verdict B (Advisory).**
  *   **Publish:** The bias-corrected mean, with a "Systematic Underestimation Warning."
  *   **Reasoning:** The chaos (weather) is low over this timeframe, but the structural uncertainty (snow measurement) is high. The procedure identifies this via the Hindcast Bias, not the Ensemble Spread.
  *   **Distinction:** This is **Undetermined** (data/physics), not Unpredictable (chaos). Better snow sensors would fix this; better weather models would not.

  #### Case 3: First Day of Cyanobacterial Bloom
  *Context: Public health warning. Recreational closure.*

  *   **Step 1 (Constraint):** Tolerance ±3 days.
  *   **Step 2 (Spread):** Ensemble spread is narrow. The physics model (temp + flow) agrees.
  *   **Step 3 (Hindcast):** Hit rate is 20%. The model predicts the bloom 2 weeks late consistently.
  *   **Step 4 (Data):** Nutrient loading data is estimated, not measured.
  *   **Verdict:** **Verdict C (Planning).**
  *   **Publish:** "Bloom conditions possible from [Date X] onwards." (Use the earliest ensemble member).
  *   **Reasoning:** This is the **Contested** case. The model likely lacks the biological trigger (phosphorus pulse). The narrow spread gives false confidence. The hindcast saves you here by showing the model is consistently wrong.
  *   **Distinction:** Specialists disagree on whether this is predictable. The procedure treats it as **Undetermined** due to low hindcast skill, regardless of the theoretical debate.

  ---

  ### Part 4: Failure Modes and False Confidence

  **1. The "Non-Stationary" Trap (Where the Procedure Misfires)**
  *   **Failure:** The procedure assumes the past 12 years resemble the future. If the climate has shifted (e.g., rain now falls on snow more often than in the archive), the Hindcast Analogue (Step 3) is invalid.
  *   **Blind Spot:** The procedure will see "Low Skill" and issue Verdict C, which is safe. But it might see "High Skill" on old data and issue Verdict A, which is dangerous.
  *   **Detection:** You need a "Drift Check." If the last 3 years have systematically higher errors than the previous 9, the archive is poisoned. The procedure currently lacks this. *Add a rule: Weight recent years 2x in the Hindcast Search.*

  **2. The "Narrow Wrong" (False Confidence)**
  *   **Failure:** All 20 ensemble members agree (Low Spread), but they are all using the same wrong physics (e.g., they all ignore groundwater lag).
  *   **Blind Spot:** Step 2 passes (Low Chaos). Step 3 might pass if the archive is short and hasn't seen a "wet groundwater" year yet.
  *   **Result:** Verdict A (Firm) on a wrong number.
  *   **Mitigation:** This is where the "Model Upgrade" note matters. If the physics didn't change in the upgrade, this error is structural. You cannot detect this with statistics alone. This requires a specialist review, which you don't have. *Honest admission:* This procedure cannot catch shared model bias without external validation.

  **3. Judgment Calls Dressed as Math**
  *   **The Analogue Threshold:** Deciding what counts as a "similar" initial state is subjective. If you tighten the definition, you get fewer analogues (higher variance in skill estimate). If you loosen it, you get irrelevant analogues.
  *   **The Percentile Choice:** In Verdict C, choosing the 90th percentile vs. the Max is a policy decision, not a scientific one. It determines how conservative the authority appears.
  *   **The Model Upgrade Cut-off:** Deciding whether an analogue from "Model Version 1" is usable for "Model Version 2" is a judgment call. If you exclude them, you shrink your archive to 4 years. If you include them, you introduce bias.

  **4. The "Unanswerable" Limit**
  *   **Procedure Stop:** If Step 3 yields <5 analogues (because the current situation is unprecedented), the procedure declares **Insufficient Data**.
  *   **Publication:** You must still publish. In this case, default to **Verdict C** and publish the physical bounds (e.g., "Reservoir Capacity") rather than the model output.
  *   **Reasoning:** When the archive is silent, the model is extrapolating. Extrapolation in nonlinear systems is indistinguishable from guessing.

  ### Summary for the Director
  *   **Verdict A:** "We have seen this movie before, and the script worked." (Trust the number).
  *   **Verdict B:** "We have seen this movie, but the ending changes often." (Trust the number, but have a backup plan).
  *   **Verdict C:** "We haven't seen this movie, or the projector is broken." (Trust the safety margin, not the number).

  This procedure protects the authority by documenting *why* a forecast is weak (Chaos vs. Data vs. Archive) without requiring the analysts to understand the underlying dynamics. It forces the risk decision back to the Director where it belongs, while ensuring the "We Don't Know" reality is published as "High Variability" or "Planning Range" to satisfy the statute.
