answer: |-
  # Specification for a Theory of Betterness

  **Object:** A binary relation $\succeq$ ('at least as good as') defined over a domain $\mathcal{D}$ containing ordinary goods, multidimensional outcomes, and sequences relevant to continuum arguments.
  **Derived Relations:** $x \succ y$ (strictly better), $x \sim y$ (equally good), $x || y$ (incomparable).

  ## I. Desiderata and Cases

  **1. Formal Coherence (Transitivity)**
  *   **Requirement:** For all $x, y, z \in \mathcal{D}$, if $x \succeq y$ and $y \succeq z$, then $x \succeq z$.
  *   **Case:** Instrumental rationality. Without transitivity, an agent is susceptible to a "money pump": trading $z$ for $y$, $y$ for $x$, and $x$ for $z$ (paying a fee each time), ending with the original item but less resources. A theory of betterness must guide deliberation and planning over time; intransitive value makes long-term planning incoherent.

  **2. Supervenience on Non-Evaluative Features**
  *   **Requirement:** If $x$ and $y$ share all non-evaluative (natural) properties, then $x \succeq y$ and $y \succeq x$. There can be no difference in betterness without a difference in descriptive facts.
  *   **Case:** Explanatory power and metaphysics. If betterness did not supervene, value would be "spooky" or brute, unconnected to the features (pleasure, justice, beauty) that we cite when justifying evaluations. It prevents value from being arbitrary.

  **3. No Unexplained Thresholds (The Sorites Constraint)**
  *   **Requirement:** The theory cannot posit a sharp cutoff in value between two items that differ only marginally in non-evaluative properties, unless the theory explains *why* that specific margin constitutes a normative boundary.
  *   **Case:** Continuum arguments (e.g., Parfit's Repugnant Conclusion, Rachels' Torture vs. Headaches). If a theory claims a massive value jump occurs after a microscopic change (e.g., one additional person, one second of pain) without a structural reason (like a rights violation), it violates the intuitive continuity of value and relies on magic boundaries.

  **4. Sensitivity to Trade-offs (The Small Improvement Argument)**
  *   **Requirement:** For items $x$ and $y$ that appear incomparable, it must be possible for a slightly improved $x^+$ to be better than $y$, without $x$ itself being better than or equal to $y$. (This allows for a status distinct from equality, often called "parity").
  *   **Case:** Hard choices (Chang). In many career or life choices, options are not equal (one is not interchangeable with the other), nor is one better, nor are they incomparable in a way that blocks choice. Collapsing this into "equality" misdescribes the phenomenology of deliberation; collapsing it into "incomparability" blocks rational choice.

  **5. Acyclic Choice (Usability)**
  *   **Requirement:** Even if full transitivity fails, the strict betterness relation $\succ$ must be acyclic. There is no sequence $x_1 \succ x_2 \succ \dots \succ x_n \succ x_1$.
  *   **Case:** The Colleague's Constraint. A theory must allow for selection. If cycles exist, a choice function cannot be defined even over finite sets without arbitrary tie-breaking. Acyclicity is the minimum structural requirement to extract a decision from the theory, ensuring the theory is action-guiding even if it fails to provide a total ordering.

  **6. Stability Under Irrelevant Redescription**
  *   **Requirement:** The verdict of $\succeq$ between $x$ and $y$ must not change if $x$ and $y$ are redescribed in extensionally equivalent ways.
  *   **Case:** Framing effects are cognitive biases, not features of value. If a theory of *objective* betterness yields different results based on whether a outcome is described as "90% survival" or "10% mortality," it conflates psychology with axiology.

  ---

  ## II. Incompatibility Flag

  **The Trilemma:** Requirements **1 (Transitivity)**, **3 (No Unexplained Thresholds)**, and the **Continuum Verdict** (that every step in a standard spectrum argument is an improvement) are jointly inconsistent.

  **Outline of Proof:**
  1.  Consider a sequence $A_1, A_2, \dots, A_n$.
  2.  **Continuum Verdict:** For every $i$, $A_i \succ A_{i+1}$ (each step is an improvement, e.g., slightly less pain for significantly more people).
  3.  **Transitivity:** By repeated application, $A_1 \succ A_n$.
  4.  **Intuition/No Threshold:** In standard spectrum cases (e.g., Mozart vs. Muzak, or Torture vs. Headaches), $A_n$ is intuitively *not* worse than $A_1$ (or is even better), and there is no non-evaluative threshold that explains a flip in value between adjacent steps.
  5.  **Contradiction:** The theory implies $A_1 \succ A_n$, but the constraints on thresholds and intuitive verdicts imply $\neg(A_1 \succ A_n)$.
  6.  **Result:** One must be surrendered. Standard Utilitarianism keeps Transitivity and Thresholds (implicitly) but accepts the Counterintuitive Verdict ($A_1 \succ A_n$). Temkin keeps the Verdict and No Thresholds but surrenders Transitivity. Lexical views keep Transitivity and the Verdict but posit a Threshold.

  ---

  ## III. The Exclusionary Requirement

  **Requirement:** **1 (Transitivity).**

  **Exclusionary Power:** This requirement excludes the largest number of significant extant contenders, specifically Larry Temkin's "Essentially Comparative View" and various contextualist theories of value that allow for intransitivity to accommodate spectrum intuitions. It also pressures "Parity" views (Chang) which risk intransitivity if not carefully formalized.

  **Justification:** This exclusion is for a **good reason**, not mere partisanship. While Temkin's arguments against transitivity are powerful, the cost of intransitivity is the collapse of instrumental rationality (the money pump). A theory of betterness that cannot guide an agent through a sequence of choices without guaranteeing loss is pragmatically self-defeating. It is better to accept a counterintuitive result (like the Repugnant Conclusion) or posit a lexical threshold than to render deliberation formally incoherent.

  ---

  ## IV. Usability and the Colleague's Objection

  **Can the theory deliver choice without Transitivity?**
  Yes, but at a cost. If we surrender Transitivity (Req 1) but keep **Acyclic Choice (Req 5)**, we can define a choice function over finite sets (selecting maximal elements).

  **Stability of the Middle Position:**
  This position is **unstable** for long-term deliberation. While acyclicity allows choosing *now*, it fails to support *planning*. If $\succeq$ is not transitive, I cannot rank options for a future date reliably, as the introduction of a new option can reverse the ranking of existing ones (violating Independence of Irrelevant Alternatives in practice). Furthermore, standard Expected Utility Theory collapses; we cannot maximize expected value if value is not transitive.

  **Cost to Hold:**
  To satisfy your colleague, you must accept that the theory is only locally action-guiding, not globally ordering. You sacrifice the ability to measure "how much better" one option is than another in a consistent unit, limiting the theory's use in cost-benefit analysis and policy aggregation.

  ---

  ## V. The Weakest Joint

  **Requirement to Surrender First:** **1 (Transitivity).**

  **Reasoning:** While I argue above that Transitivity is the best exclusionary filter, it is the most vulnerable to the *metaphysical* reality of value. If a compelling argument demonstrates that value is essentially comparative (dependent on the specific set of alternatives) rather than an intrinsic property of outcomes, Transitivity is the first casualty.

  **Moving Argument:** I would surrender Transitivity if presented with a **non-aggregative spectrum argument** where the "No Unexplained Threshold" constraint is demonstrably satisfied by a lexical view, yet the lexical view fails to capture the intuitive betterness of the final outcome. Specifically, if it can be shown that rational agents *ought* to accept a cycle in specific moral dilemmas (e.g., conflicting rights scenarios) without being money-pumped (perhaps due to transaction costs or moral residues blocking the trade), then Transitivity is a formal convenience, not a normative truth. Until then, I hold it as a provisional constraint.

  ---

  **Status of the Field:**
  This specification leaves standing primarily **Lexical Prioritarianism** and **Robust Satisficing** views, provided they can formalize their thresholds without violating Supervenience. Most standard aggregative consequentialist views survive only by accepting the counterintuitive verdicts of the continuum arguments.
