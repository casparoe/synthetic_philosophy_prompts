answer: |-
  You have not stumbled into a stupid argument. You have stumbled into **Bertrand's Paradox**, one of the most famous problems in the history of probability theory. It nearly broke the foundations of mathematics in the early 20th century until measure theory came along to fix it.

  So, take a breath. You aren't crazy. The question *is* ambiguous... unless you specify the physical process.

  Here is the breakdown of who is right, why your simulations disagreed, and exactly how to build your app.

  ### 1. Is your roommate right?
  **For the dart game: Yes.**
  **For the abstract math question: No.**

  Your roommate is making a claim about a **physical process** (throwing a dart at a wall). In physics, when we say "throw a dart randomly at a surface," the standard assumption is the **Principle of Indifference over Area**.

  This means that any two patches of the wall with the same area are equally likely to be hit. This is not "smuggling an assumption"; it is defining the **measure** based on the physical symmetries of the wall. A wall looks the same if you slide your ruler two inches to the left (translation invariance). It looks the same if you rotate your ruler (rotation invariance).

  The only probability distribution that respects the translation and rotation symmetry of a flat 2D surface is the **Uniform Area Distribution** (technically, the Lebesgue measure).

  So, for the specific game of "throw a dart at a wall," your roommate is correct. The probability is $\frac{\text{Area of Bean}}{\text{Area of Wall}}$.

  ### 2. Why did your simulations disagree?
  You wrote: *"We tried to get the computer to drop a uniformly random point inside the bean... pick a random x then a random y, vs. pick a random direction and distance from the center..."*

  This is where Bertrand's Paradox lives. The word "uniform" is meaningless without specifying **what variable is uniform**.

  *   **Method A (Cartesian):** Pick $x$ uniformly, pick $y$ uniformly.
      *   **Result:** This creates a distribution that is uniform over **Area**. Every square inch has equal probability.
  *   **Method B (Polar):** Pick angle $\theta$ uniformly, pick radius $r$ uniformly.
      *   **Result:** This creates a distribution that clusters heavily near the center. Why? Because a small change in $r$ near the center covers less area than the same change in $r$ near the edge. By picking $r$ uniformly, you are oversampling the center. This is **not** uniform over area. (To get uniform area in polar, you must pick $r$ proportional to $\sqrt{\text{random}}$).
  *   **Method C (Perimeter Inward):** Pick a point on the perimeter uniformly, shoot inward.
      *   **Result:** This depends entirely on the shape. On a lumpy bean, "uniform by arc length" on the perimeter does not translate to "uniform by area" inside. It creates streaks or clusters depending on the curvature.

  **The Tiebreak:**
  You asked if there is a principled tiebreak. **Yes.** It is **Invariance**.

  A "fair" randomization for a physical object shouldn't depend on where you put your coordinate origin.
  *   If you use **Method A (Cartesian Area)** and shift your coordinate grid 5 inches to the left, the probability distribution on the wall **does not change**.
  *   If you use **Method B (Polar)** and move the "center" (origin) 5 inches to the left, the distribution **changes completely**. Points that were "near the center" are now "far from the center."

  Because the wall doesn't have a natural "center" (it's just a rectangle), any method that requires a center (like Polar) is smuggling in an arbitrary choice. The Area method is the only one that doesn't care where you stand in the room.

  ### 3. Does the "Lumpy Bean" shape matter?
  Yes, it matters immensely for your simulation confusion.

  If your shape were a perfect circle and you placed the polar origin exactly in the center, Method B (Polar) would *look* uniform. The symmetry of the circle hides the flaw in the method.

  The "lumpy kidney bean" has no symmetry. It exposes the flaws in the non-area methods immediately. The fact that your different methods gave different answers on the bean proves that those methods were **not** measuring the same thing. Only the Cartesian Area method remains consistent regardless of the shape's lumpiness.

  ### 4. Practical Advice: How to build the App
  You want a defensible answer for the app. Do not try to simulate "random points inside the bean." Simulate the **dart throw on the wall**.

  Here is the algorithm that is mathematically defensible as "fair" for a 2D surface:

  1.  **Define the Wall:** Set a bounding box for your wall (e.g., width $W$, height $H$).
  2.  **Define the Bean:** You need a function `isInsideBean(x, y)` that returns true if a coordinate is inside your shape. (You can trace the bean, save the coordinates, and use a "point in polygon" algorithm).
  3.  **The Loop (Rejection Sampling):**
      *   Generate $x = \text{random}(0, W)$
      *   Generate $y = \text{random}(0, H)$
      *   **Check 1:** Is $(x, y)$ on the valid wall surface? (If you have posters or windows, exclude them). If no, **discard and re-roll**.
      *   **Check 2:** Is $(x, y)$ inside the Bean?
          *   If Yes: **You Win.**
          *   If No: **Roommate Wins.**

  **Why this is the winner:**
  This implements **Uniform Area Measure**. It is invariant to translation. It matches the physics of a dart throw. It is the standard interpretation of probability in continuous 2D space.

  ### Summary for the Roommate
  Tell him this:
  1.  **He is right** about the game. The probability is Area/Total.
  2.  **You were right** to be suspicious. "Random" is ambiguous without defining the measure (Bertrand's Paradox).
  3.  **The Resolution:** The physical wall imposes **Translation Invariance**. The only "random" that respects that is Uniform Area (Cartesian). Polar/Perimeter methods fail because they rely on an arbitrary "center" or "starting point" that the wall doesn't actually have.
  4.  **The App:** Build it using Cartesian rejection sampling ($x, y$ uniform). It's the only one that doesn't cheat by picking an arbitrary origin point.

  Then order pizza, because neither of you cooked.
