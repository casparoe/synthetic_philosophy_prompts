answer: |-
  1. This project asks whether human identity depends on specific gametes or on the structural history of development, distinguishing essential origin from essential trajectory. I will argue that standard origin essentialism conflates the particular material cause with the causal process that generates biological individuality.
  2. Current debates remain unresolved because they treat gametic identity and developmental continuity as inseparable, ignoring biological phenomena like monozygotic twinning where one zygote yields multiple individuals. Resolving this matters for bioethics and metaphysics because it clarifies whether moral status attaches to biological material or to the history of an organism's formation.
  3. Months one and two will map the logical space of origin essentialism, while months three and four will analyze case studies such as chimerism and mitochondrial replacement to test the gamete-versus-trajectory distinction. The final two months will synthesize these findings into a formal argument regarding the necessary conditions for biological identity.
  4. Success looks like a defended thesis that origin essentialism holds only for developmental trajectories rather than specific gametes, whereas failure would be demonstrating that the two concepts cannot be coherently separated. Given the six-month timeframe, a realistic outcome is a robust framework for the distinction even if a definitive metaphysical conclusion remains debated.
  5. I am moderately confident that the distinction between gametic material and developmental trajectory can be rigorously maintained across standard biological cases. The point I am least sure of is whether mitochondrial replacement, which swaps cellular energy structures, truly severs the link to the original egg without altering the identity of the resulting organism.
