answer: |-
  **Essay Question**

  In the final section of *Computing Machinery and Intelligence*, Turing proposes constructing a "child machine" to be educated rather than programming an adult mind. Reconstruct this proposal as a claim about where the fundamental difficulty of machine intelligence lies. Then, critically evaluate whether framing intelligence as a product of education resolves the problem of machine initiative, or merely relocates the explanatory burden. 

  *(Note: Answers focusing primarily on the Imitation Game will be penalized.)*

  ***

  **Model Answer**

  Turing's child-machine proposal represents a strategic pivot in the engineering of artificial intelligence. Rather than attempting to directly simulate the complex output of an adult human mind—a task requiring the explicit codification of vast knowledge and reasoning rules—Turing suggests the difficulty lies not in the final state, but in the developmental process. The core claim is that intelligence is not a static architecture to be built, but a dynamic capacity to be organised. By modelling the machine on the human child, Turing posits an initially "unorganised" system that acquires competence through training. The engineering challenge thus shifts from constructing adult competence to arranging an appropriate education. The machine need not possess the answers initially; it must possess the susceptibility to learn them.

  However, a significant tension exists within Turing's account of this educational process. On one hand, Turing treats the search for the appropriate child machine and its curriculum as a largely experimental, blind search. He acknowledges we do not know the correct initial structure or the optimal teaching methods, implying a trial-and-error approach to finding a machine that responds to training. On the other hand, Turing insists that a teacher neither foresees the pupil's discoveries nor owns them. If education were merely the execution of a predetermined instructional programme, the pupil would be a passive vessel, and any resulting intelligence would belong to the programmer. Turing requires the education to be open-ended enough that the machine originates behaviour not explicitly contained in the training data. This creates a paradox: how can one blindly search for a structure that guarantees the emergence of unforeseen initiative? If the outcome is truly unforeseen, it cannot be the guaranteed result of a specific engineering choice.

  This tension comes to a head when evaluating the contrast between discipline and initiative. For a machine to function reliably, it must acquire discipline: stable routines and logical constraints imposed by the teacher. Yet, to be truly intelligent, it must demonstrate initiative: the capacity to originate behaviour that is not merely the execution of its training. The educational framing risks relocating the problem of machine intelligence rather than solving it. If the "child machine" successfully exhibits initiative, the explanation for that intelligence is pushed back onto the initial structure that made it educable. We are left asking what specific properties of the unorganised machine allowed it to transcend its training. 

  If the initial structure is too rigid, it allows for discipline but precludes initiative, rendering the education mere programming. If it is too loose, it allows for novelty but lacks the discipline required for coherent thought. Turing's proposal solves the problem of how to *start*—by admitting ignorance of the adult mind's complexity—but it does not explain how the *finish* is achieved without smuggling the intelligence back into the initial design. The explanatory burden is relocated from the final program to the learning architecture. Consequently, the child-machine proposal is best understood not as a solution to the problem of machine intelligence, but as a redescription of it. It correctly identifies that intelligence is developmental, but it leaves the hard problem of how a mechanical system originates genuine initiative unresolved, hidden within the "black box" of the learning mechanism itself.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Reconstruction of the Proposal (5 Marks)**
  *   **A (4-5):** Clearly identifies the shift from engineering adult competence to arranging education. Explicitly mentions the human child as a model of an "unorganised" system becoming organised via training.
  *   **B (2-3):** Identifies the shift to education but treats it vaguely (e.g., "machines need to learn") without referencing the structural claim about unorganised systems.
  *   **C (0-1):** Fails to distinguish the child-machine proposal from general machine learning or focuses on the Imitation Game.

  **2. Identification of Tension (5 Marks)**
  *   **A (4-5):** Articulates the conflict between the "blind search" for structure/curriculum and the requirement that the teacher does not foresee/own the pupil's discoveries (education $\neq$ instruction).
  *   **B (2-3):** Notes that education is hard or experimental but misses the specific tension regarding teacher ownership or foreseeability.
  *   **C (0-1):** Claims there is no tension or conflates teaching with programming.

  **3. Evaluation: Discipline vs. Initiative (5 Marks)**
  *   **A (4-5):** Uses the discipline/initiative contrast to argue that the proposal *relocates* the explanatory burden to the initial structure. Judges that the problem is redescribed rather than solved.
  *   **B (2-3):** Discusses discipline and initiative but fails to conclude whether the problem is solved or relocated.
  *   **C (0-1):** Asserts the problem is fully solved without qualification or ignores the distinction.

  **4. Clarity and Structure (5 Marks)**
  *   **A (4-5):** Logical flow, precise terminology, adheres to constraints.
  *   **B (2-3):** Understandable but disorganised or imprecise.
  *   **C (0-1):** Difficult to follow.

  **Major Errors (Deductions)**
  *If any of the following occur, deduct **5 marks** from the total score (in addition to relevant criteria marks):*
  1.  **The Implementation Detail:** Treating the child machine merely as a faster way to pass the Imitation Game/Turing Test.
  2.  **The Adult Analogy:** Reading the analogy as one between a machine and an already-formed adult who is being reprogrammed, rather than a child developing.
  3.  **The Ownership Collapse:** Arguing that because the teacher supplies the training, the pupil's later achievements are really the teacher's, causing the proposal to collapse (this misses Turing's specific point about initiative).
