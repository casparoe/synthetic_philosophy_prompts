answer: |-
  You have identified a subtle but pervasive rhetorical and epistemic move that sits at the intersection of probability theory, statistics, and the philosophy of science. You are correct that the standard labels do not quite capture the *asymmetry* of the defense you are describing.

  Here is an analysis of the existing concepts, why they fall short of your specific target, and a proposal for how to name and bound this specific failure.

  ### 1. The Existing Territory and Its Shortfalls

  **The Principle of Indifference (PoI)**
  *   **What it is:** The rule that assigns equal probability to outcomes when there is no evidence to distinguish them.
  *   **Why it falls short:** This names the *rule* being invoked, not the *defense* of its application. A student can correctly cite the PoI while still committing the error you describe. The PoI is the tool; you are asking about the unwarranted confidence in the handle of the tool.

  **Bertrand's Paradox (or the Problem of Parameterization)**
  *   **What it is:** The mathematical demonstration that applying the PoI to different parameterizations of the same problem yields contradictory results (e.g., the chord in a circle).
  *   **Why it falls short:** This names the *contradiction*, not the *psychological resistance* to resolving it. Bertrand's Paradox shows *that* the results differ; it does not name the move where a reasoner insists their specific parameterization is the "true" neutral one despite the paradox.

  **The Mind Projection Fallacy (E.T. Jaynes)**
  *   **What it is:** The error of treating one's own state of ignorance (a subjective mental state) as a physical property of the system (an objective frequency or propensity).
  *   **Why it is the closest fit:** When a reasoner claims a uniform prior on bias $p$ is "neutral," they are projecting their ignorance onto the parameter $p$ as if $p$ possesses a physical property of "uniformity" that $\theta = \log(p)$ lacks.
  *   **Why it still falls short:** While this captures the *ontological error*, it does not fully capture the *rhetorical asymmetry* you noted: the specific claim that the *alternative* description is "loaded" while the *current* one is "natural." The Mind Projection Fallacy explains why they are wrong, but not why they defend the status quo frame as privileged.

  **Description Invariance (Decision Theory)**
  *   **What it is:** A normative principle stating that rational choices should not depend on how the options are described.
  *   **Why it falls short:** This is the principle being violated, not the name of the violation or the defense.

  ### 2. The Specific Move: A Coined Term

  Since no single established term captures the *asymmetrical defense of the initial frame*, the most precise label for this habit is:

  **The Fallacy of the Privileged Parameterization**
  *(Also acceptable: The Fallacy of the Natural Frame)*

  **Definition:**
  The error of treating the parameterization of a problem initially selected (often due to linguistic convenience, habit, or salience) as the epistemically neutral "default," while treating mathematically equivalent re-parameterizations as introducing substantive assumptions, despite the state of ignorance being identical across both.

  **Why this fits your description:**
  It isolates the specific asymmetry you identified: the treatment of the *status quo* description as unmarked/neutral and the *alternative* description as marked/loaded. It identifies the error not as the use of the Principle of Indifference itself, but as the claim that one measure space is the "canonical" space for ignorance.

  ### 3. Boundaries and Distinctions

  To use this term effectively in teaching, it is crucial to distinguish it from related concepts.

  **Vs. Mere Change of Variables**
  *   **Change of Variables:** A mathematician acknowledges that $p$ and $\theta = f(p)$ are equivalent representations. They accept that a uniform prior on $p$ implies a non-uniform prior on $\theta$, and they understand this is a consequence of the Jacobian of the transformation. They do not claim one is "truer."
  *   **Privileged Parameterization:** The reasoner denies the equivalence of the *ignorance*. They claim that being ignorant about $p$ is a different *state of knowledge* than being ignorant about $\theta$, or that the uniformity on $p$ is a fact about the world while the resulting distribution on $\theta$ is an artifact.

  **Vs. Substantive Modeling Choices**
  *   **Substantive Choice:** Sometimes, a parameterization *is* physically privileged. For example, in physics, energy is often a more "natural" parameter than velocity because of conservation laws. If a reasoner argues for a parameter based on physical symmetry or invariance properties (e.g., using a Jeffreys prior), they are not committing this fallacy.
  *   **Privileged Parameterization:** The fallacy occurs only when the claim of "naturalness" rests solely on **linguistic salience** or **habit** (e.g., "bias is just a number between 0 and 1") rather than on derived symmetry or invariance principles.

  **Vs. The Principle of Indifference (General)**
  *   **PoI:** "I have no evidence, so I assign equal probability."
  *   **Privileged Parameterization:** "I have no evidence, so I assign equal probability *to this specific variable*, and if you ask me to assign equal probability to that transformed variable, you are making an assumption."

  ### 4. Is it a Special Case of Something More General?

  Yes. The Fallacy of the Privileged Parameterization is a specific instance of **Reification** (treating an abstract conceptual choice as a concrete reality) combined with **Status Quo Bias** (cognitive bias favoring the current formulation).

  In the philosophy of science, it is also a species of **Essentialism about Language**: the belief that the way we happen to carve up the conceptual space (e.g., linear probability vs. log-odds) reflects the "essence" of the phenomenon rather than a convenient mapping.

  ### 5. Teaching Recommendation

  When you encounter this move, you can diagnose it as follows:

  1.  **Identify the Invariance Failure:** Show that the method yields different results under transformation (Bertrand's Paradox).
  2.  **Identify the Defense:** Note that the reasoner is not arguing from symmetry or physical invariance (which would be valid), but from "naturalness."
  3.  **Name the Move:** Label this **The Fallacy of the Privileged Parameterization**.
  4.  **The Correction:** Introduce **Parameterization Invariance** as the normative standard. If a state of ignorance is truly objective, it should not depend on the units or scale used to describe it. (This leads naturally to **Jeffreys Priors**, which are constructed specifically to be invariant under re-parameterization).

  **Summary for your syllabus:**
  > **The Fallacy of the Privileged Parameterization:** The mistaken belief that one's initial formulation of a quantity (e.g., linear probability) represents a "neutral" state of ignorance, while alternative formulations (e.g., log-odds) represent "biased" assumptions. This ignores that ignorance regarding a variable implies specific, non-uniform ignorance regarding its transformations. It is a rhetorical asymmetry where the status quo frame is treated as unmarked and alternatives as marked.

  This gives you a precise handle for the specific rhetorical asymmetry that bothers you, distinguishing it from the broader mathematical paradoxes that surround it.
