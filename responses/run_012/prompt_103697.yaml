  *You contend that the physical peculiarities of my model render it irrelevant to our world, and that my denial of time covertly presupposes the temporal framework it seeks to negate.*

  Regarding the first point, I concede that my universe does not expand as ours appears to, and this empirical discrepancy is significant for cosmology. However, the metaphysical question concerns not the contingent initial conditions of our particular nebulae, but the fundamental laws governing any possible world. If the laws of nature permit a structure where a global time order is impossible, then time cannot be a necessary condition of existence itself, but rather depends on the specific distribution of matter. This contingency suggests that time is not an objective feature of reality, but akin to what Kant suggested—a form of our intuition imposed upon the world, rather than a property of the world in itself. If the laws allow for its disappearance in one case, they do not mandate its reality in any.

  On your second point, the charge of self-undermining, I feel the force of it, yet I believe it confuses the language of description with the ontology described. To say time is ideal is not to deny the experience of succession, but to deny that this experience corresponds to an objective lapse in the external world. We can conceive of a reality without time, even if our conception occurs within time, just as one can understand the concept of illusion without being perpetually illuded. I am not entirely certain that the mathematics alone compels this philosophical shift; there is a gap between the possible solutions of the field equations and the nature of being. But if the laws of physics are the ultimate arbiter of what is real, and they allow for the disappearance of time, then our confidence in time's objectivity must waver, even if we cannot fully step outside our temporal skin to verify it.
