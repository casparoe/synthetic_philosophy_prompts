answer: |-
  This is a fantastic puzzle. You've basically stumbled onto a branch of philosophy called **Speech Act Theory** (specifically the work of J.L. Austin), but Rosa is working it out intuitively over punch and cake.

  Here is the breakdown of Rosa's logic, my bet on how she handles the field wedding, and the specific question you should ask to crack her code.

  ### 1. The Verdict on the Field Wedding
  **I bet you $100 Rosa says the field wedding counted.**

  Here is why. If you look closely at her list, she isn't choosing between "Procedure" and "Social Treatment." She is distinguishing between **Context Frames.**

  *   **The Play:** The context is *Fiction*. The actors do not intend to bind themselves. The audience does not intend to be bound. Result: **Nothing happens.**
  *   **The Lying Promise:** The context is *Reality*. The speaker intends to create an obligation (even if they plan to break it), and the listener accepts that obligation. Result: **Something happens.**
  *   **The Boss vs. Coworker:** This is about **Institutional Authority**. Only the boss has the "status" to change your employment reality.
  *   **The Bet:** This is **Interpersonal Authority**. You don't need a license to bet. You just need two people agreeing to be bound.

  Rosa sees marriage as having two layers: the **Legal Layer** (State/Officiant) and the **Commitment Layer** (Vows/Witnesses).
  *   In the **Play**, both layers are fake.
  *   In the **Official Wedding**, both layers are real.
  *   In the **Field Wedding**, the Legal Layer is missing, but the Commitment Layer is fully active.

  Since Rosa cried and calls them married, she prioritizes the **Commitment Layer**. To her, the license is just paperwork for the state; the *vows* are the speech act that makes the marriage. Because the context was "Real Life" (not a play) and the intent was "Binding" (not acting), the speech act fired successfully.

  ### 2. The Rule She Is Running
  Rosa's rule isn't just "Procedure" or "Social." It is:
  **"Does this speech act occur in a Real Context with the Intent to Bind?"**

  *   **Real Context:** Are we in the world, or on a stage? (Rules out the Play).
  *   **Intent to Bind:** Are we trying to change reality, or just making noise? (Rules out the Coworker firing you).
  *   **Authority:** Do you have the power to make this specific change? (Boss = Yes, Coworker = No. But for Promises/Bets/Vows, *you* are the authority).

  She believes that for **Interpersonal Acts** (Promises, Bets, Vows), you are your own authority. For **Institutional Acts** (Firing, Adjournment, Legal Marriage), you need the badge. But she seems to view the *essence* of marriage as Interpersonal, with the Legal part being secondary.

  ### 3. The Test Case: How to Tell for Sure
  You suggested testing "Procedure perfect but nobody serious." That is exactly the right angle, but we need to make sure we don't confuse her with the "Lying Promise" rule.

  In the "Lying Promise," the liar *pretends* to be serious. In a "Joke," everyone *knows* it's not serious. This is the key distinction between a Lie (which she says counts) and a Play (which she says doesn't).

  **Ask her this scenario:**

  > "Okay, imagine a Boss who wants to prank an employee on their birthday. The Boss calls the employee into the office, closes the door, follows the exact HR script, signs the termination paper, hands them the box, and says 'You're fired.'
  >
  > Everyone in the room (including the employee) knows it's a prank. The Boss immediately laughs and says 'Happy Birthday!'
  >
  > **Technically, the procedure was perfect. The Authority was real. But the Context was a Joke.**
  >
  > **Rosa, in that moment, was the employee fired?**"

  **Why this works:**
  *   **If she says "Yes, they were fired (and then rehired)":** She is a **Proceduralist**. The words + authority create the reality, regardless of the social mood. This would mean she *might* actually think the Field Wedding *didn't* count (because the procedure was missing), and she's just being nice about it.
  *   **If she says "No, obviously not":** She is a **Contextualist**. The "Frame" of the situation (Joke/Play) overrides the words. This confirms she thinks the Field Wedding *did* count, because the Frame was Real, even if the Procedure was missing.

  **My prediction:** She will say **"No, they weren't fired."**
  This aligns with her "Play" example. In a play, the words are real, but the frame is fake. In the prank, the words are real, but the frame is fake.

  If she says that, you can follow up with: *"So if the Frame matters more than the Procedure... does that mean my friends in the field are more married than a couple who got a license but hates each other?"*

  That's where you'll find out if she thinks marriage is about **Love** or **Law**.
