prompt: |-
  Two of my friends got into it at a party last weekend and I've been chewing on it since, because neither of them seemed obviously wrong and I honestly couldn't referee it. It started because I'd set up a silly little game: I roll a die, and if it comes up 1-3 I put $10 and $20 in two envelopes, and if it comes up 4-6 I put $20 and $40 in them, then I shuffle and let the person pick one. My friend Dana says a setup like that just dissolves the whole two-envelope paradox. Her line is that once you open your envelope you just condition on what you see: if you see $20, the other envelope is either $10 or $40, and she says those two are equally likely, so it's worth $25 on average and you obviously switch; if you see $10 or $40 then you already know whats in the other one, so there's nothing to agonize over. She says the real moral is that the paradox was never about expected value being broken, it was about a missing prior, and once you supply one there's nothing left to explain. Marcus said that's the textbook answer and he thinks it's a dodge. He says the paradox doesn't need any prior over amounts at all: for any amount X you might find, the other envelope is either half or double, and the shuffle makes it fifty-fifty which one you're holding, so it really is a coin flip — telling people "you need a prior" is just refusing to answer the question. Dana said the shuffle decides which envelope you end up holding, not whether the other one is double, and those are two differnt things, and Marcus said that's exactly the kind of hair-splitting that makes him think philosophers should be kept away from probability. Then Dana said something I didn't follow about how in the classic version the probabilities aren't wrong so much as undefined, and Marcus said undefined-versus-wrong is a distinction without a difference since either way you shouldn't switch.

  Can you go through this move by move and tell me who's right about what, and who's more right overall? I especially want to know: (a) is Dana right that my die game makes the paradox disappear, and did she get the $20 case right; (b) is Marcus's "the shuffle makes it fifty-fifty" point defensible in any version of the setup, or is it just confused; (c) is Dana's undefined-versus-wrong remark correct, or is it pedantry; (d) is there anything either of them is missing — for instance, does the "by symmetry there's no reason to swap" line that people usually trot out get anything wrong here. And one more thing I couldn't settle on my own: does any of this change if I'd rolled the die without telling anyone the rule, so the person has no idea which pairs were even possible?
