answer: |-
  This is a classic dispute over the **Special Composition Question**: *Under what conditions do some things add up to form a whole object?* You have inadvertently hosted a seminar on mereology (the study of parts and wholes).

  Here is the move-by-move refereeing, rating each claim on a scale of **1 (Clearly Wrong)** to **10 (Clearly Right)**, based on logical consistency and intuitive force.

  ### The Move-by-Move Breakdown

  **(1) Sam: "Glue doesn't conjure a new object into existence... 'now it's a picture' is a fact about us, not about the world."**
  *   **Rating: 8/10**
  *   **Why:** This is a strong opening. Sam is pointing out that physical adhesion is just a change in spatial relation and chemical bonding. There is no magical "pop" where a new metaphysical entity appears. The claim that "being a picture" is a status we confer rather than a physical property is intuitively very strong.
  *   **Weakness:** It assumes that *only* physical properties count toward existence, which is the very thing being debated.

  **(2) Alex: "When parts are organised so that they function as one unit, they compose a whole."**
  *   **Rating: 7/10**
  *   **Why:** This is the common-sense view (Functionalism). It explains why a heart is an object (it pumps) but a random scatter of cells is not. It anchors existence in causal power.
  *   **Weakness:** As Sam will point out, "function" is often in the eye of the beholder.

  **(3) Sam: "That just tracks what we care about... Your criterion makes composition depend on our interests, and our interests don't make objects exist."**
  *   **Rating: 9/10**
  *   **Why:** This is Sam's best move. It exposes the subjectivity in Alex's rule. If a heap of bricks counts as an object only when it's holding up a roof, does the object cease to exist when the roof collapses? That seems absurd. It shows Alex's rule makes existence dependent on human purposes.
  *   **Weakness:** It assumes that mind-dependence rules out existence (which some philosophers deny), but for this debate, it's a solid hit.

  **(4) Alex: "Everything's vague round the edges... nobody concludes that heaps don't exist."**
  *   **Rating: 6/10**
  *   **Why:** Alex is appealing to the Sorites Paradox (the paradox of the heap). He's arguing that vagueness is a feature of language, not a proof of non-existence.
  *   **Weakness:** This is a bit of a deflection. Sam isn't just saying "it's vague"; Sam is about to argue that *existence itself* cannot be vague. Alex is treating this like a linguistic problem when Sam is treating it like a metaphysical one.

  **(5) Sam: "Existence is the one thing that can't be vague... there must be an exact moment... and there obviously isn't one."**
  *   **Rating: 8/10**
  *   **Why:** This is the "Argument from Vagueness." It is logically formidable. If an object comes into existence, *when* does it happen? At molecule 500? Molecule 501? If there's no precise cut-off, Sam argues, the object never truly "started."
  *   **Weakness:** This premise ("Existence can't be vague") is highly controversial. Many philosophers argue existence *is* vague. But within the rules of strict logic Sam is playing by, this is a checkmate attempt.

  **(6) Alex: "Then you're stuck saying there's no such thing as me, or you, or the cat. That's not a conclusion, that's a reductio."**
  *   **Rating: 9/10**
  *   **Why:** This is the "Moorean Shift." Alex is saying: *Any theory that concludes I don't exist is automatically false, because I know I exist more surely than I know any philosophical premise.* It appeals to the cost of Sam's theory.
  *   **Weakness:** It doesn't refute Sam's logic; it just says the price is too high. A determined nihilist can pay the price.

  **(7) Sam: "I didn't say that. There's no table, only a load of particles holding that shape. No you, only a load of particles doing what you do."**
  *   **Rating: 7/10**
  *   **Why:** Sam accepts the cost. This is **Mereological Nihilism**. It is logically consistent. If only simple particles exist, there is no vagueness problem.
  *   **Weakness:** It renders almost all human language false. It saves logic by sacrificing reality as we experience it.

  ***

  ### Is Sam's Last Move a Way Out?

  **Verdict:** It is a **logical way out, but a practical surrender.**

  Sam's move (Mereological Nihilism) saves him from contradiction, but it quietly hands Alex everything that actually matters.

  Here is why: Sam says, "There is no Alex, only particles arranged Alex-wise." But those "particles arranged Alex-wise" still pay rent, still get annoyed about jigsaws, and still occupy space. For all practical purposes, Alex exists. Sam is winning the battle over the *word* "exist" while losing the war over *reality*.

  By admitting that the particles are "doing what you do," Sam concedes that the *structure and function* Alex cares about are real, even if Sam refuses to label that structure an "object." Sam has preserved his metaphysical purity at the cost of making his position irrelevant to daily life. Alex can reply: "If the particles arranged Alex-wise can argue with you, then for all intents and purposes, *I exist*."

  ### Where Do They Sit Relative to Standard Positions?

  *   **Sam is a Mereological Nihilist.**
      *   **Position:** Only fundamental simples (particles/atoms) exist. Composite objects (tables, people, jigsaws) are fictions or useful ways of speaking.
      *   **Philosophical Allies:** Peter van Inwagen (mostly), Ted Sider, certain eliminativists.
      *   **Strength:** Ontological parsimony (doesn't multiply entities beyond necessity).
      *   **Weakness:** Extremely revisionary; contradicts common sense.

  *   **Alex is a Mereological Universalist (with restrictions) or Functionalist.**
      *   **Position:** Objects exist when parts are unified by function or cohesion.
      *   **Philosophical Allies:** David Lewis (Universalism), common-sense realists, Aristotelians (substance theory).
      *   **Strength:** Matches how we live and speak.
      *   **Weakness:** Struggles to define exactly *when* composition occurs without vagueness.

  ### Who Is More Right Overall?

  **Neither.** They are arguing past each other on two different levels.

  *   **Sam is more right about Fundamental Ontology.** If you ask a physicist what fundamentally exists, they will give you fields and particles, not "jigsaws." Sam is correct that gluing doesn't add new fundamental stuff to the universe.
  *   **Alex is more right about Derivative Ontology.** If you ask a carpenter, a biologist, or a landlord what exists, they will say "tables," "hearts," and "tenants." These are real patterns in the world that have causal power, regardless of whether they are "fundamental."

  ### The Thing They Are Both Missing

  They are both missing the distinction between **Fundamental Existence** and **Emergent Existence**.

  They are treating "existence" as a binary switch: either something is a fundamental building block of the universe, or it is nothing at all. This is a false dichotomy.

  **The Missing Insight:**
  A jigsaw is not a *fundamental* object (Sam is right), but it is a *real pattern* (Alex is right). The glue creates a new set of causal relationships. Before the glue, if you lifted the frame, the pieces fell. After the glue, if you lift the frame, the pieces move together. That change in causal behavior is objective, not just "about us."

  **The Referee's Ruling:**
  Sam wins on technical metaphysics; Alex wins on practical reality. The jigsaw is not a "substance" in the way an electron is, but it is a "system" in a way a pile of loose pieces is not.

  **Advice for the Flat:**
  Tell Sam that while he may be metaphysically correct that "Alex" is just particles, the particles arranged Alex-wise are still entitled to half the security deposit. Tell Alex that while the jigsaw is "one thing," it's still made of 1,000 pieces, so he shouldn't expect Sam to help clean it up if it breaks.

  **Winner:** Draw. But Alex gets the jigsaw on the wall.
