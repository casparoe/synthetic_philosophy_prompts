answer: |-
  Here is a decision tree designed to sort people based on their intuitions about omission causation. It is built from the "logical space" of the debate—meaning we first define the dimensions people disagree on (the questions), and then map the positions (the leaves) onto the outcomes of those questions.

  ### Part 1: The Logical Space (The 12 Questions)

  These questions define the "coordinates" of someone's view. They are phrased plainly so you can ask them during an argument about specific cases (the plant, the kid, the driver, etc.).

  **Dimension A: The Connection (Did the inaction matter?)**
  1.  **Counterfactual:** If you *had* acted, would the bad outcome *definitely* have been prevented?
  2.  **Knowledge:** Did you know exactly what would happen if you did nothing?
  3.  **Certainty:** Are you sure nothing else (like rain or a neighbor) would have saved the day anyway?

  **Dimension B: The Agent (Who are you in this story?)**
  4.  **Special Role:** Do you have a specific job, contract, or family tie (parent, doctor, hired neighbor)?
  5.  **Uniqueness:** Are you the *only* person who could have helped?
  6.  **Crowd:** Did lots of other people also fail to help, or was it just you?
  7.  **Ease:** Was helping very easy/cheap for you (like pressing a brake) vs. hard (like flying to another country)?

  **Dimension C: The History (What happened before?)**
  8.  **Risk Creation:** Did you do something earlier that created the danger (e.g., you hid the water vs. you just didn't bring it)?
  9.  **Interference:** Did you actively stop someone else from helping?
  10. **Policy:** Is this omission part of a standing rule/policy (factory filter) or a one-time choice?

  **Dimension D: The Purpose (What are we deciding?)**
  11. **Law:** Does it matter if there was a law requiring you to act?
  12. **Blame vs. Physics:** Are we asking if you are *to blame* or if you physically *made it happen*?

  ---

  ### Part 2: The Decision Tree

  To use this, start at the top and follow the Yes/No path based on how your friend answers the questions about the **hard cases** (like the stranger/charity or the neighbor/plant), not just the easy ones (parent/child).

  ```text
  START: Do you think "doing nothing" can ever be a cause of an outcome?
  │
  ├── NO ────────────────────────────────────────────────────────┐
  │   (Only physical pushes/pulls count as causes)               │
  │   ▼                                                          │
  │   LEAF 1: THE HARD PHYSICALIST                               │
  │                                                              │
  └── YES ───────────────────────────────────────────────────────┤
      ▼                                                          │
      Q1: Does it matter if you had a SPECIAL ROLE (parent/doctor)?
      │
      ├── YES (Only duties make omissions causes) ───────────────┤
      │   ▼                                                      │
      │   Q2: Does that duty come from LAW/CONTRACT or MORALITY? │
      │   │                                                      │
      │   ├── LAW/CONTRACT ONLY ─────────────────────────────┐   │
      │   │   ▼                                              │   │
      │   │   LEAF 2: THE LEGALIST                           │   │
      │   │                                                  │   │
      │   └── MORALITY/SOCIAL NORM ────────────────────────┐ │   │
      │       ▼                                            │ │   │
      │       LEAF 3: THE DUTY-BOUND                       │ │   │
      │                                                    │ │   │
      └── NO (Roles don't matter, look at capacity) ───────┤─┘   │
          ▼                                                  │   │
          Q3: Does it matter if you were the UNIQUE SAVIOR?  │   │
          │                                                  │   │
          ├── YES (Only if no one else could help) ──────────┤   │
          │   ▼                                              │   │
          │   Q4: Does it matter if helping was EASY?        │   │
          │   │                                              │   │
          │   ├── YES (Must be unique AND easy) ─────────┐   │   │
          │   │   ▼                                      │   │   │
          │   │   LEAF 4: THE GOOD SAMARITAN             │   │   │
          │   │                                          │   │   │
          │   └── NO (Unique is enough, even if hard) ─┐ │   │   │
          │       ▼                                    │ │   │   │
          │       LEAF 5: THE UNIQUE NECESITY          │ │   │   │
          │                                            │ │   │   │
          └── NO (Uniqueness doesn't matter) ──────────┤─┘   │   │
              ▼                                        │     │   │
              Q5: Did you CREATE THE RISK earlier?     │     │   │
              │                                        │     │   │
              ├── YES (Only if you started the danger) │     │   │
              │   ▼                                    │     │   │
              │   LEAF 6: THE RISK-OWNER               │     │   │
              │                                        │     │   │
