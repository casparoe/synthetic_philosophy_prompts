                  ▼                                    │         │
                  Q6: Are we talking BLAME or PHYSICS? │         │
                  │                                    │         │
                  ├── BLAME (Cause = Responsibility)   │         │
                  │   ▼                                │         │
                  │   LEAF 7: THE PRAGMATIST           │         │
                  │                                    │         │
                  └── PHYSICS (It's a real cause) ─────┤─────────┘
                      ▼                                │
                      Q7: Do ALL counterfactuals count?│
                      │                                │
                      ├── YES (If you could save it, you caused it)
                      │   ▼                            │
                      │   LEAF 8: THE UNIVERSALIST     │
                      │                                │
                      └── NO (Only some count, but why?)
                          ▼                            │
                          (Loops back to Duty/Uniqueness)
  ```

  ---

  ### Part 3: The Leaves (The Positions)

  Here are the 8 positions sorted by the tree. These are named by their logic, not academic labels.

  1.  **The Hard Physicalist:** Omissions are never causes. The plant died because of the sun/heat, not because you didn't water it. You didn't *make* it die; you just let nature take its course.
  2.  **The Legalist:** Omissions are causes only if breaking a law or contract. If you aren't the parent or the hired hand, your inaction is invisible to causation.
  3.  **The Duty-Bound:** Omissions are causes if you had a moral or social duty (parent, friend, promise), even if no law exists.
  4.  **The Good Samaritan:** Omissions are causes only if you were the *only* one who could help AND it was *easy* for you to do so. (Filters out the charity donor who lives far away).
  5.  **The Unique Necessity:** Omissions are causes if you were the *only* one who could help, regardless of cost. (If you are the only doctor on earth, your not flying to save someone is a cause of death).
  6.  **The Risk-Owner:** Omissions are causes only if you created the situation that required help. (If you lock the gate, not opening it is a cause. If the gate was already locked, not opening it is not).
  7.  **The Pragmatist:** The word "cause" is just a tool for assigning blame. We call it a cause when it's useful for society to punish or criticize you. It's not about physics; it's about policy.
  8.  **The Universalist:** If the outcome would have been different had you acted, you caused it. Period. (This implies you cause the starvation of strangers you don't donate to, which many find too broad).

  ---

  ### Part 4: Analysis of the Logical Space

  Here is the breakdown of the "Empty Zones" and "Blind Spots" you asked for.

  #### 1. Empty Zones (Incoherent or Unattractive Views)
  These are combinations of answers that logically *could* exist but almost no one holds because they feel wrong.

  *   **The "Difficulty" View:** *Omissions are causes only if helping was HARD.*
      *   *Why it's empty:* Intuition works the opposite way. If it was impossible to help, we rarely say you caused the death. If it was easy, we are more likely to say you caused it.
  *   **The "Ignorance" View:** *Omissions are causes only if you DIDN'T KNOW what would happen.*
      *   *Why it's empty:* Knowledge usually increases responsibility. If you knew the plant would die and didn't water it, that feels *more* causal than if you were ignorant.
  *   **The "Crowd" View:** *Omissions are causes only if MANY people failed to help.*
      *   *Why it's empty:* Usually, if many people fail (diffusion of responsibility), we feel *less* that any single person caused the outcome. People tend to think omissions are causes when they were the *unique* savior, not one of a million bystanders.

  #### 2. Inseparable Positions (Blind Spots)
  This tree cannot perfectly distinguish between these pairs because they often give the same answers to these 12 questions.

  *   **The Legalist vs. The Contractualist:** Both say "Only if you had a duty." One says the duty must be written in law, the other says a verbal promise counts. The tree groups them under **Leaf 2**, but you can split them by asking Q2 more deeply.
  *   **The Pragmatist vs. The Duty-Bound:** Both often end up blaming the parent who starves the kid and excusing the stranger who doesn't donate. The Pragmatist says "It's useful to blame the parent." The Duty-Bound says "The parent had a duty." The outcome is the same, even if the *reason* is different.
  *   **The Risk-Owner vs. The Physicalist:** In many cases, the Risk-Owner says "You didn't cause it" (because you didn't start the risk). This looks exactly like the Physicalist saying "You didn't cause it." They only separate on cases where you *did* create the risk (e.g., you hid the water).

  #### 3. Handling Your Specific Interests
  *   **Unique vs. Many Helpers:** This is handled at **Q3 (Uniqueness)**.
      *   If they say "Yes, it matters if I was the only one," they go toward **Leaf 4 or 5**.
      *   If they say "No, I caused it even if others could have helped," they go toward **Leaf 3 or 8**.
  *   **Started Chain vs. Didn't Stop:** This is handled at **Q5 (Risk Creation)**.
      *   If they say "It's only a cause if I made the danger," they land on **Leaf 6**.
      *   If they say "It's a cause even if the danger was natural," they move toward **Leaf 3 or 8**.

  ### How to use this with friends
  1.  Pick a hard case (e.g., "You walk past a drowning child in a shallow pond. You don't save them. Did you *cause* the death?").
  2.  Run them through the tree.
  3.  If they get stuck between two leaves, ask the specific question that separates those leaves (e.g., "Does it matter if you were the only person there?").
  4.  When they say, "Well, it depends," ask them *which* question it depends on. That tells you exactly where they sit in the logical space.
