  ### Taxonomy of the Presumption of Independence

  **Node 1: Locus**
  **Question:** Does the presumption assert that variables are independent in the world, that the available evidence lacks connections, or that the agent's credence function should factorize?
  *   **Branch 1.1:** In the World (Ontic)
  *   **Branch 1.2:** In the Evidence (Epistemic)
  *   **Branch 1.3:** In the Credences (Doxastic)

  **Node 2: Force**
  **Question:** Is this independence a binding rational requirement (covering both constitutive constraints and prior probabilities) or a defeasible default that yields to counter-evidence?
  *   **Branch 2.1:** Binding Requirement
  *   **Branch 2.2:** Defeasible Default

  **Node 3: Scope**
  **Question:** Does the presumption apply universally to all variables at all times (Global/Synchronic) or only to specific contexts and variables (Local/Diachronic)?
  *   **Branch 3.1:** Global/Synchronic
  *   **Branch 3.2:** Local/Diachronic

  ---

  ### Leaves

  #### Branch 1.1 (World) + Branch 2.1 (Binding)
  *   **Leaf 1.1.1 (Global): Randomness-based Formalization**
      *   *Awkward Commitment:* It implies the world is fundamentally noisy and independent everywhere unless proven deterministic.
  *   **Leaf 1.1.2 (Local): Causal-structure Formalization**
      *   *Awkward Commitment:* It requires access to causal facts that are often harder to verify than the probabilistic correlations they explain.
  *   **Leaf 1.2.1 (Global): Unnamed**
      *   *Diagnosis:* **Incoherent.** If independence is a binding fact of the world, it cannot be a defeasible default; it is simply true or false.
  *   **Leaf 1.2.2 (Local): Unnamed**
      *   *Diagnosis:* **Incoherent.** Same as above; ontic facts do not operate as retractable assumptions.

  #### Branch 1.2 (Evidence) + Branch 2.1 (Binding)
  *   **Leaf 1.2.1 (Global): Unnamed**
      *   *Diagnosis:* **Unattractive.** It claims that a lack of evidence globally binds rationality, ignoring that evidence is often incomplete.
  *   **Leaf 1.2.2 (Local): Unnamed**
      *   *Diagnosis:* **Unexplored.** Hard to distinguish from graphical models without invoking specific representational syntax.
  *   **Leaf 1.2.3 (Global): Unnamed**
      *   *Diagnosis:* **Unattractive.** Treating missing evidence as a binding global constraint paralyzes inference in information-poor environments.
  *   **Leaf 1.2.4 (Local): Defeasible-default-logic Formalization**
      *   *Awkward Commitment:* It requires a second-order logic to track when the default is overridden without circularity.

  #### Branch 1.3 (Credences) + Branch 2.1 (Binding)
  *   **Leaf 1.3.1 (Global): Maximum-entropy Formalization**
      *   *Awkward Commitment:* It assumes that being less informative is normatively equivalent to being more rational.
  *   **Leaf 1.3.2 (Local): Graphical-model Formalization**
      *   *Awkward Commitment:* It treats the absence of an edge in a diagram as a positive claim about probabilistic irrelevance.
  *   **Leaf 1.3.3 (Global): Unnamed**
      *   *Diagnosis:* **Unexplored.** If it is a binding prior but global, it collapses into Maximum-entropy without the entropy justification.
  *   **Leaf 1.3.4 (Local): Reference-class Skeptical Position**
      *   *Awkward Commitment:* It implies we rarely have enough information to license independence, threatening to paralyze inference.

  ---

  ### Note on the Heuristic Puzzle

  The core puzzle is that a heuristic should guide inquiry without making a substantive claim that can be falsified. In this tree, only the **Defeasible Default** branches (specifically *Defeasible-default-logic* and *Reference-class Skeptical*) treat the presumption as a genuine heuristic. These positions locate the substantive claim in the *rules of reasoning* rather than in the world or the prior; they allow the presumption to be abandoned when evidence accumulates without contradicting a prior commitment to independence. All **Binding** branches (Maximum-entropy, Graphical, Causal, Randomness) disguise the heuristic as a substantive commitment—either about the structure of rationality or the structure of the world—meaning that when evidence defeats the independence, the position itself must be revised rather than just the assumption.
