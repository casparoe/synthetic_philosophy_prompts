answer: |-
  Here are ten questions designed to press the guest on the specific philosophical and practical tensions in her view. Each includes a bracketed **[Debate Status]** note to help you contextualize the disagreement for the audience, followed by a follow-up keyed to the standard defense she is likely to offer.

  ### 1. The Somatic Integration Objection (Biological Facts)
  **Question:** Patients diagnosed as brain-dead under current whole-brain criteria can often maintain homeostasis, heal wounds, fight infections, and even gestate a fetus for months. Biologically, the body is functioning as an integrated unit without the neocortex. If the definition of death is the death of the *organism*, how do you reconcile your criterion with the fact that the organism's somatic integration clearly persists after the cortex is gone?

  **[Debate Status]:** *Settled Fact:* Bodies can maintain somatic functions post-brain-death. *Contested:* Whether somatic integration is the necessary condition for the life of the human organism.

  **Follow-up:** You'll likely reply that somatic integration is merely biological maintenance, not the life of the *person* or the *organism as a whole* in the relevant sense. But if the biology says the organism is alive, aren't you essentially arguing that we should ignore the biology in favor of a psychological definition? If so, why call it "death" rather than "loss of personhood"?

  ### 2. The Somatic Integration Objection (The "Integrator" Claim)
  **Question:** Proponents of the whole-brain standard argue the brainstem is the body's critical integrator, and without it, the body is merely a collection of functioning parts. But as we just noted, the body *does* integrate functions without the brainstem if supported. Does this suggest that "somatic integration" is a red herring—that there is no single organ that keeps an organism alive as a whole—and if so, doesn't that undermine the biological basis for *any* neurological criterion, including yours?

  **[Debate Status]:** *Contested:* Whether the brain is the unique integrator of the human organism. Some philosophers of biology argue integration is distributed; others argue the brain is essential.

  **Follow-up:** If you concede that integration is distributed, your higher-brain criterion rests entirely on the value of consciousness, not biology. Does this mean your view is actually a moral claim about when it is permissible to treat a body as a corpse, disguised as a biological claim about when the organism ceases to exist?

  ### 3. The PVS vs. Locked-in Line (Observability)
  **Question:** Your criterion draws a bright line between the persistent vegetative state (dead) and locked-in syndrome (alive), based on the capacity for consciousness. But clinically, these states can look identical from the outside; the difference rests on an internal capacity that is currently unobservable in many non-communicative patients. Is it safe to ground the legal and moral status of "life and death" on a distinction that medicine often cannot reliably detect at the bedside?

  **[Debate Status]:** *Contested:* The reliability of diagnosing disorders of consciousness. Misdiagnosis rates between PVS and MCS/Locked-in are a known, significant clinical problem.

  **Follow-up:** You might argue that diagnostic uncertainty is a practical problem, not a theoretical one. But if we can't distinguish the dead from the alive with high confidence, doesn't adopting your criterion increase the risk of killing living patients (false positives) compared to the whole-brain standard, which relies on observable reflexes?

  ### 4. Bedside Certification (The Diagnostic Gap)
  **Question:** Current protocols for declaring death test for brainstem reflexes (pupils, gag, apnea), not cortical function. There is currently no definitive bedside test for the *irreversible* loss of consciousness. If we adopted your criterion tomorrow, what specific test would you require a physician to perform? And if that test doesn't exist yet, isn't the criterion practically inert?

  **[Debate Status]:** *Settled:* Current legal standards rely on brainstem testing or clinical assessment of consciousness loss over time. *Contested:* Whether fMRI/EEG biomarkers can ever sufficiently certify permanent loss of consciousness for death declaration.

  **Follow-up:** If your answer is that we must develop new technology or accept probabilistic diagnosis, does that mean death becomes a moving target dependent on our technological capabilities? If a better scanner comes along in ten years that shows residual activity, were the patients we declared dead today actually alive?

  ### 5. Permanent vs. Irreversible (The Definition)
  **Question:** You argue we should replace "irreversible" loss of function with "permanent" loss. "Irreversible" means it *cannot* be reversed biologically; "permanent" means it *will not* be reversed, usually because we won't try. Does this shift make the definition of death dependent on a social decision not to treat, rather than a biological fact about the patient?

  **[Debate Status]:** *Contested:* This is a major fault line in recent literature. Some argue "permanent" is necessary to make sense of DNR orders and donation; others argue it makes death relative to healthcare policy.

  **Follow-up:** If death depends on whether we *will* treat rather than whether we *can*, does a wealthy patient with access to experimental therapy remain "alive" longer than a poor patient with the same injury, simply because the possibility of reversal is real for one and not the other?

  ### 6. Permanent vs. Irreversible (Future Tech)
  **Question:** A common worry about the "permanent" standard is that it makes the definition of death hostage to future technology. If we declare someone dead because their condition is permanent *now*, but a cure is invented five years later, have we made a false statement about reality? Should a definition of death be robust enough to withstand future scientific advances, or is it always relative to the current date?

  **[Debate Status]:** *Contested:* Whether definitions of death should be "future-proof." Most legal definitions are static, but philosophers disagree on whether they *ought* to be.

  **Follow-up:** You might say we define death relative to current medical capability. But if the boundary of life moves as technology moves, doesn't that suggest "death" isn't a natural kind we are discovering, but a policy line we are drawing based on resource allocation?

  ### 7. Conceptual vs. Normative (Is vs. Ought)
  **Question:** Are you telling us what death *is*—a metaphysical claim about the cessation of the human being—or are you telling us what we *ought to do* with patients who have lost consciousness—a moral claim about when treatment obligations cease? If it's the latter, why dress it up as a definition of death rather than a new category of permissible action?

  **[Debate Status]:** *Highly Contested:* This is the meta-ethical core of the debate. "Traditionalists" argue death is a biological event; "Revisionists" argue it is a bioethical concept.

  **Follow-up:** If you admit this is partly a moral proposal, does that undermine your claim to be "rescuing" the Dead Donor Rule? If we change the definition of death to suit our moral needs (like getting organs), aren't we admitting the Rule is just a hurdle to be cleared rather than a protection for the living?

  ### 8. The Dead Donor Rule (Rescuing vs. Stretching)
  **Question:** You claim the higher-brain criterion rescues the Dead Donor Rule (DDR) by allowing organ retrieval from PVS patients without violating it. But the DDR was originally built on the consensus that you must be biologically dead before harvest. By expanding "death" to include patients with beating hearts and integrated bodies, aren't you preserving the *letter* of the DDR while violating its *spirit*—which was to ensure we never kill a patient for their parts?

  **[Debate Status]:** *Contested:* Whether the DDR is a moral absolute or a rule of practice. Many ethicists argue the DDR is already fictionally maintained under whole-brain criteria; others argue it must be strictly upheld.

  **Follow-up:** If the public understands that "death" now includes patients who look alive (warm, breathing via machine), might that erode trust in the transplant system more than simply admitting we have a moral justification for harvesting organs from the permanently unconscious who are not technically dead?

  ### 9. The Transplant Angle (Rationalization vs. Discovery)
  **Question:** Critics have long argued that brain-death criteria were historically accelerated to facilitate organ procurement—a rationalization rather than a discovery. Given that your view significantly expands the pool of viable donors (PVS patients), how do you answer the charge that the higher-brain criterion is motivated by the utility of transplantation rather than the truth about human life?

  **[Debate Status]:** *Contested:* Historical motivations for the 1968 Harvard Committee are debated. The suspicion that criteria follow organ needs is a persistent sociological critique.

  **Follow-up:** You will likely say the argument stands on its philosophical merits regardless of utility. But if the primary *consequence* of your view is more organs, and the primary *objection* is that it looks like killing, isn't the burden of proof on you to show why this isn't simply a convenient redefinition for the benefit of recipients?

  ### 10. Ontology (Event, Process, and Arbitrariness)
  **Question:** Is death an event or a process? If consciousness fades gradually, and brain function shuts down in stages, picking a specific threshold (like "neocortical silence") looks arbitrary. If death is a process, what makes *that* specific moment the moment of death, rather than the cessation of the heartbeat or the cellular decay that follows weeks later?

  **[Debate Status]:** *Contested:* Whether death is a momentary event or a process. Biological decay is clearly a process; legal death must be a moment. Reconciling the two is a major philosophical problem.

  **Follow-up:** If you argue that the loss of the *capacity* for consciousness is the non-arbitrary line because that is what matters to us, aren't you conceding that the "moment of death" is determined by what we value, not by what the body is doing? And if it's determined by value, why do we need a biological criterion at all?
