answer: |-
  **The Minimal Pair**

  Consider the following two assertions: (1) "Tax evasion is wrong and shoplifting is wrong." (2) "Either tax evasion is wrong or shoplifting is wrong." The first sentence allows the speaker to straightforwardly express two distinct attitudes of moral disapproval simultaneously, one directed at tax evasion and one directed at shoplifting. The second sentence, however, commits the speaker to the claim that at least one of these activities is morally prohibited without requiring them to hold a specific attitude of disapproval toward either one individually, creating a gap between the attitude expressed and the commitment undertaken.

  **The Nested Test**

  Nest the troublesome sentence one operator deeper: "It is not the case that either tax evasion is wrong or shoplifting is wrong." The difficulty survives. If the embedded disjunction fails to express a coherent complex attitude because disjunctions of attitudes do not map onto the truth-conditions of the sentence, then negating that incoherent structure does not restore coherence; the outer negation still lacks a determinate attitude-content to operate upon, leaving the expressivist with the same gap regarding what mental state is actually being expressed.

  **The Full Accounting**

  **1. Semantic Clauses and Verdicts**
  For the straightforward expressivist, the semantic clause for an atomic moral sentence is: *To assert "X is wrong" is to express a con-attitude (disapproval) toward X.* The clause for conjunction is: *To assert "P and Q" is to express the attitude in P and the attitude in Q.*
  *   **Sentence (1) Verdict:** Smooth. The speaker expresses disapproval of tax evasion and disapproval of shoplifting. The clause delivers a coherent psychological state: holding two attitudes at once.
  *   **Sentence (2) Verdict:** Broken. The natural clause for disjunction would be: *To assert "Either P or Q" is to express the attitude in P or the attitude in Q.* This verdict fails because asserting the disjunction does not require the speaker to actually hold either attitude. I can assert "Either tax evasion is wrong or shoplifting is wrong" while remaining neutral on both, provided I believe they cannot both be permissible. The clause demands a specific attitude (disapproval of one or the other) that the speaker need not possess.

  **2. The Precise Breaking Point**
  The break occurs at the requirement of **commitment without corresponding attitude**. In Sentence (1), the commitment (both are wrong) matches the attitude (disapproval of both). In Sentence (2), the commitment (at least one is wrong) outstrips the available attitude resources (disapproval of this, or disapproval of that). The expressivist cannot construct a single complex attitude that mirrors the truth-functional commitment of "or" without smuggling in a proposition about the world rather than a state of mind.

  **3. The Single Feature of Embedding**
  The feature doing the work is **truth-functionality**. Conjunction works for simple expressivism because the aggregation of attitudes (A and B) mirrors the truth-functional combination of contents (True and True). Disjunction fails because the truth-functional combination (True or False / False or True) has no parallel in the aggregation of attitudes (Disapprove or Disapprove). You cannot "disapprove disjunctively" in a way that captures the logical force of the operator.

  **4. Restoration by Feature Swap**
  If we remove the feature by swapping the operator in Sentence (2) for the one in Sentence (1) ("and"), smooth handling is restored, as shown in the verdict for Sentence (1). Conversely, if we swap the operator in Sentence (1) for the one in Sentence (2) ("either...or"), the smooth handling dissolves immediately. This confirms the damage is localized to operators requiring truth-functional commitments that exceed simple attitude aggregation.

  **5. The Natural Repair and Its Cost**
  The most natural repair is to posit a **higher-order attitude**, such as "being for" blaming or "being for" holding a certain combination of attitudes (a la Schroeder). The expressivist claims Sentence (2) expresses a complex state of being for having some disapproval among the options.
  *   **Cost:** This repair is not cheap. It costs the view its psychological transparency. The original attraction of expressivism was that moral terms map onto recognizable, ordinary mental states (disapproval, approval). "Being for having a disapproval" is a theoretical construct, not a phenomenological reality. By adopting this, the expressivist abandons the simple link between language and mind that motivated the view, effectively replacing one mystery (moral truth) with another (complex normative psychology).

  **6. The Strongest Defender Move**
  The strongest move available is to concede that the straightforward clause for disjunction was a mistake and that moral sentences *do* function logically as if they have truth-apt content, even if they do not describe reality (Quasi-Realism). The defender should admit that the expressivist should never have signed on to the clause that moral sentences *only* express attitudes without also licensing their treatment as propositional objects in logic.
  *   **Concession Cost:** This costs the expressivist their ontological parsimony and their sharp distinction from cognitivism. If moral sentences behave exactly like truth-apt sentences in all logical embeddings (disjunction, negation, conditionals), the claim that they lack truth conditions becomes a metaphysical technicality rather than a semantic difference. The view survives, but it loses the simplicity that made it an attractive alternative to realism in the first place.
