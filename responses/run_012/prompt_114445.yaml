answer: |-
  # Specification: Functional Requirements for an Imprecise Credal Agent

  **Scope:** This document defines the necessary conditions for a theory of imprecise probability to be deployed in an autonomous agent. The agent operates under uncertainty, updates on sequential evidence, executes actions, and is interface-constrained to report scalar confidence values to human operators.

  **Status:** These are not recommendations for specific formalisms (e.g., sets of probabilities, lower previsions, belief functions). These are the behavioral and structural constraints any such formalism must satisfy to be considered operationally viable.

  ---

  ## 1. Representation: The Semantics of Width

  The agent's belief state is not a point function $P: \mathcal{F} \to [0,1]$, but a structure $\mathbb{P}$ (e.g., a set of densities, a lower/upper pair) that yields an interval $[\underline{P}(H), \overline{P}(H)]$ for any hypothesis $H$.

  ### 1.1 Evidential Anchoring (Non-Negotiable)
  **Requirement:** The width of the interval $W(H) = \overline{P}(H) - \underline{P}(H)$ must be functionally dependent on the quality and quantity of evidence supporting $H$.
  **Motivation:** If width is a free parameter adjustable by the agent without evidential input, the system is merely adding noise to a precise prior. Imprecision must represent *ignorance* or *conflict in evidence*, not *hedging*.
  **Test Case:** In the absence of data regarding a binary event, the interval must default to $[0, 1]$ (complete ignorance) or a specific ignorance prior (e.g., $(0,1)$), not a narrow interval centered at 0.5. A theory that forces a precise prior (e.g., Uniform) by default fails this specification.

  ### 1.2 The Ellsberg Distinction (Non-Negotiable)
  **Requirement:** The representation must distinguish between *risk* (known stochasticity) and *ambiguity* (unknown stochasticity) without forcing a reduction to a single expectation.
  **Motivation:** The agent must be able to prefer a bet on an urn with known 50/50 composition over a bet on an urn with unknown composition, even if the point-estimate expectation is identical.
  **Test Case:**
  *   **Urn A:** 50 Red, 50 Black.
  *   **Urn B:** 100 Red/Black, ratio unknown.
  *   **Constraint:** The agent's preference for betting on Red in Urn A over Urn B must not be labeled irrational (i.e., it must not violate the axioms of the chosen imprecise framework). The theory must accommodate the intuition that $P_A(Red) = 0.5$ is structurally distinct from $P_B(Red) \in [0, 1]$.

  ---

  ## 2. Dynamics: Updating and Dilation

  The agent receives evidence $E$ and transitions from $\mathbb{P}$ to $\mathbb{P}_E$.

  ### 2.1 Generalized Conditionalization (Non-Negotiable)
  **Requirement:** The theory must define a rule for updating the set $\mathbb{P}$ on evidence $E$ that generalizes Bayes' Rule ($P_E(H) = P(H \cap E) / P(E)$).
  **Motivation:** An agent that cannot update is static. The rule must handle cases where $P(E)$ is also imprecise (i.e., $\underline{P}(E) < \overline{P}(E)$).
  **Constraint:** The update rule must be well-defined even when $\underline{P}(E) = 0$ (avoiding division by zero via regularity constraints or conditional probability structures).

  ### 2.2 The Dilation Stance (Camp Taste / Critical Flag)
  **Requirement:** The theory must explicitly classify *dilation*. Dilation occurs when, for every partition element $E_i$, the posterior interval for $H$ is strictly wider than the prior interval: $[\underline{P}(H|E_i), \overline{P}(H|E_i)] \supset [\underline{P}(H), \overline{P}(H)]$.
  **Motivation:** In precise probability, observing $E$ never increases variance about $H$ in expectation. In imprecise probability, observing $E$ can make you *less* sure about $H$ regardless of the outcome.
  **Decision Point:**
  *   **Option A (Pathology):** Dilation is a bug. The theory must restrict priors or update rules to prevent it. (Cost: Limits the class of representable ignorance).
  *   **Option B (Feature):** Dilation is a rational discovery that $E$ is irrelevant but correlated with the *reliability* of the source. The theory must accept it. (Cost: Counter-intuitive behavior where seeking information reduces confidence).
  **Constraint:** The specification forbids a theory that claims dilation is impossible while maintaining broad ignorance priors. You must choose: restrict ignorance or accept dilation.

  ### 2.3 Asymptotic Convergence (Camp Taste)
  **Requirement:** The theory must specify the behavior of interval width under an infinite stream of i.i.d. evidence.
  **Motivation:** Does the agent ever learn the truth?
  **Decision Point:**
  *   **Convergence Required:** As $n \to \infty$, $W(H_n) \to 0$. (Aligns with frequentist consistency).
  *   **Convergence Forbidden/Permitted:** The interval may remain wide indefinitely if the model class is misspecified or if structural uncertainty persists.
  **Constraint:** A theory that guarantees convergence to a point for *all* prior sets contradicts the motivation for imprecise credence (that some uncertainty is irreducible). A theory that *forbids* convergence renders learning impossible. The theory must state which regime it occupies.

  ---

  ## 3. Decision: The Moment of Action

  The agent holds a set of probabilities $\mathbb{P}$ but must execute a single act $a$ and report a single number $r \in [0,1]$.

  ### 3.1 Decision Rule Determinacy (Non-Negotiable)
  **Requirement:** The theory must provide a deterministic selection function $S: \mathbb{P} \times \text{Acts} \to \text{Act}$.
  **Motivation:** Imprecise theories often yield *E-admissibility* (a set of undominated acts). An autonomous agent cannot execute a set; it must pick one.
  **Test Case:**
  *   **Act 1:** Payoff \$100 if $H$, \$0 if $\neg H$.
  *   **Act 2:** Payoff \$50 guaranteed.
  *   **State:** $\underline{P}(H) = 0.4, \overline{P}(H) = 0.6$.
  *   **Constraint:** Maximin rejects Act 1 (min value 0 < 50). Maximax accepts Act 1 (max value 100 > 50). The theory must specify which rule governs. "Indifference" is not an allowable output for an acting agent.

  ### 3.2 The Reporting Collapse (Non-Negotiable)
  **Requirement:** When asked "What is your probability of H?", the agent must output a scalar $r$, despite holding $[\underline{P}, \overline{P}]$.
  **Motivation:** Human interface constraints.
  **Constraint:** The theory must define the mapping $f([\underline{P}, \overline{P}]) \to r$.
  *   If $r = \underline{P}$ (pessimistic reporting), the agent appears underconfident.
  *   If $r = \overline{P}$ (optimistic reporting), the agent appears overconfident.
  *   If $r = \text{Midpoint}$, the agent hides its uncertainty.
  *   **Mandatory Metadata:** The scalar $r$ is insufficient. The specification requires the agent to report $r$ *and* $W$ (width), or else the theory fails the "honesty" constraint. If forced to a single number, the theory must justify which point in the interval represents the "assertoric commitment."

  ---

  ## 4. The Incompatibility Result (Non-Negotiable Constraint)

  **Warning:** The following triad of properties is mathematically inconsistent. A compliant theory must explicitly violate at least one.

  **The Triad:**
  1.  **Generalized Conditioning:** The agent updates by conditioning every probability function in the representor set $\mathbb{P}$ on the evidence $E$ (Standard Bayesian updating applied to the set).
  2.  **Genuine Evidential Support:** The interval width reflects ignorance such that independent evidence about the *reliability* of the source is distinguishable from evidence about the *hypothesis* (i.e., the model allows for priors that represent "I don't know the bias" rather than "The bias is uniform").
  3.  **No Dilation:** Observing evidence $E$ never widens the interval for hypothesis $H$ across all possible outcomes of $E$.

  **The Result:**
  If you adopt **Generalized Conditioning** (1) and allow priors that represent **Genuine Ignorance** (2) (specifically, priors that are not singletons), **Dilation** (violation of 3) is mathematically inevitable for certain partitions of evidence. (See: Herron, Seidenfeld, & Wasserman, 1994; Walley, 1991).

  **Specification Mandate:**
  *   You cannot smooth this over.
  *   If you demand **No Dilation**, you must restrict the class of allowable priors (violating the spirit of **Genuine Evidential Support**) or abandon **Generalized Conditioning** (requiring a non-Bayesian update rule like Maximum Likelihood or Discounting).
  *   If you demand **Genuine Evidential Support** and **Generalized Conditioning**, you must accept **Dilation** as a feature and explain to the user why confidence dropped after observing data.

  ---

  ## 5. Summary of Deliverables

  To be trusted, the theory must provide:

  1.  **A Representation:** That distinguishes risk from ambiguity (Ellsberg).
  2.  **An Update Rule:** That specifies handling of dilation (Bug or Feature?).
  3.  **A Decision Rule:** That resolves indeterminacy to a single act (Maximin? E-admissibility + Tie-break?).
  4.  **A Reporting Rule:** That maps intervals to scalars without hiding width.
  5.  **A Violation Statement:** An explicit declaration of which element of the **Incompatibility Triad** (Conditioning, Support, No-Dilation) has been sacrificed to ensure mathematical coherence.

  **Failure Condition:** Any theory that claims to satisfy all five sections without declaring a violation of the Incompatibility Triad is mathematically unsound and unfit for deployment.
