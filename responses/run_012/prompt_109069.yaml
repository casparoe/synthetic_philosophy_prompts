answer: |-
  You have put your finger on a genuine and rather sophisticated tension in logic and epistemology. There is no single, common English noun that captures the exact psychological and logical manoeuvre you describe, but there is a cluster of technical terms that map the "joints" precisely.

  The short answer is that you are describing **methodological paraconsistency** underpinned by a stance often called **non-adjunctivism**. However, the specific rhetorical move you mentioned—citing the Principle of Explosion to shut down inquiry while continuing to reason elsewhere—is a pragmatic inconsistency that logicians themselves dispute.

  Here is the breakdown of the machinery, the terminology, and where the consensus lies.

  ### 1. The Logical Mechanism: Paraconsistency
  In classical logic, there is a rule called *Ex Falso Quodlibet* (from falsehood, anything follows), often dubbed the **Principle of Explosion**. It states that if you accept a contradiction ($P$ and not-$P$), you can validly derive any conclusion whatsoever ($Q$).

  The "walling-off" you observe is the rejection of this rule. The field that studies systems where contradictions do not entail everything is **Paraconsistent Logic**.
  *   **What is accepted:** That a system can contain contradictions without becoming "trivial" (where every statement is true).
  *   **What is rejected:** The idea that a contradiction necessarily infects the whole system.
  *   **The Joint:** The logical connective. In paraconsistent systems, the relationship between premises and conclusions is tightened (often via **Relevance Logic**) so that a contradiction in one area cannot be "transported" to an unrelated area to prove arbitrary things.

  **Consensus status:** It is settled that paraconsistent logics are formally coherent. It is *disputed* whether they describe reality or are merely useful tools. Most mainstream logicians remain classical (believing contradictions *should* explode); paraconsistentists are a significant but minority camp.

  ### 2. The Epistemic Stance: Non-Adjunctivism
  You noted that it "doesn't feel like believing both." This is a crucial distinction.
  *   **Dialetheism:** The view that some contradictions are *true* (e.g., Graham Priest's work). This requires accepting $P \land \neg P$.
  *   **Non-Adjunctivism:** The view that one may accept $P$ in one context and $\neg P$ in another, but refuses to conjoin them into a single statement $P \land \neg P$.

  This fits your description of "walling off." The thinker treats the claims as belonging to different "files" or contexts. They reason happily within File A and within File B, but refuse to open a folder where both are present. This is sometimes called **contextualisation** or **compartmentalisation**.

  **Consensus status:** Non-adjunctivism is widely recognised as a description of how humans actually reason (we hold inconsistent beliefs all the time). Whether it is *rationally permissible* is disputed. Classical epistemologists argue you are obligated to resolve the contradiction; pragmatists argue that if the compartmentalisation works, it is acceptable.

  ### 3. The Mathematical Practice: Instrumentalism
  In maths, when a paradox arises (like Russell's Paradox in naive set theory), mathematicians rarely abandon the theory immediately. They often engage in **axiomatic restriction**.
  *   **The Move:** They identify the specific rule that generated the contradiction (e.g., unrestricted comprehension) and ban it, while keeping the rest of the theory.
  *   **The "Carry On":** Before the fix is formalised, mathematicians often continue using the theory **instrumentally**. They treat the formalism as a tool for calculation rather than a description of truth. If the contradiction doesn't affect the calculation at hand, they ignore it.

  **Consensus status:** This is standard historical practice. Early calculus used infinitesimals inconsistently for centuries before Weierstrass formalised limits. It is generally accepted as a valid heuristic phase, though not a final resting state for a foundation.

  ### 4. The "Explosion Excuse"
  You identified a specific rhetorical move: *"if you push them they'll say you can get anything at all out of a contradiction, so there's no point poking at it."*

  This is the most interesting part of your observation. This person is citing the classical **Principle of Explosion** as a reason to stop talking, while simultaneously **behaving** as if the Principle of Explosion is false (because they continue to reason elsewhere without everything collapsing).

  *   **What is happening:** They are using a classical rule as a **conversation stopper** (a "defensive manoeuvre"), while relying on paraconsistent behaviour to function.
  *   **The Term:** There isn't a specific label for this rhetorical sleight of hand, but it is a form of **pragmatic inconsistency**. They are claiming the logic is broken (exploded) to protect the claims, but acting as if the logic is intact to protect their reasoning.
  *   **Why they do it:** Admitting to paraconsistency sounds like admitting to irrationality. Citing Explosion sounds like they know the rules of logic but are choosing to step back. It preserves intellectual dignity while avoiding the hard work of resolving the paradox.

  ### 5. Where is the Line? (The "Joints")
  You asked where the line falls between a contradiction you can carry on with and one that wrecks everything. In paraconsistent logic, this is determined by **Relevance**.

  *   **Manageable Contradiction:** The contradiction is isolated. To derive a conclusion $Q$, you must use premises relevant to $Q$. If the contradiction ($P$ and $\neg P$) is not relevant to the derivation of $Q$, the inference holds.
  *   **Theory-Wrecker:** The contradiction is **central** to the derivation. If you need both $P$ and $\neg P$ to prove the specific theorem you are working on, the system is locally trivial.

  In practice, the line is drawn by **utility**. If the contradiction prevents you from making predictions or calculations in the domain you care about, it is a wreck. If it sits in a corner (like a semantic paradox in a physics theory) and doesn't stop the equations working, it is walled off.

  ### Summary of Terms
  If you need to label the phenomenon, here is the hierarchy:
  1.  **Paraconsistent Tolerance:** The general capacity to withstand contradiction.
  2.  **Non-Adjunctivism:** The specific refusal to combine the conflicting claims.
  3.  **Logical Compartmentalisation:** The psychological strategy of keeping the contexts separate.
  4.  **Instrumentalism:** The justification for using the theory despite the flaw.

  ### What is Settled vs. Disputed
  To be straight about the landscape:

  *   **Settled:** Classical logic validates Explosion. Paraconsistent logics successfully block it. Humans routinely reason inconsistently without inferring everything.
  *   **Disputed:**
      *   **Normative:** *Should* we tolerate contradictions? Classical logicians say no (it's an error to be fixed). Paraconsistentists say sometimes yes (reality or language might be inconsistent).
      *   **Truth:** Are true contradictions possible (Dialetheism)? Most philosophers say no; a vocal minority say yes.
      *   **The "Excuse":** Logicians generally regard the "Explosion Excuse" you described as confused. If Explosion holds, you cannot reason elsewhere. If you can reason elsewhere, Explosion fails. Using the former to justify the latter is technically incoherent, even if pragmatically effective at shutting down critics.

  ### Conclusion
  You are describing a **non-adjunctivist, paraconsistent stance**, often motivated by **instrumentalism**. The "walling-off" is **logical compartmentalisation**.

  The person you describe is effectively running a paraconsistent system while claiming to respect classical limits. They are not quietly dropping one claim; they are suspending the rule that forces them to choose. Whether this is rational depends on whether you view logic as a description of how truth *must* behave (classical) or a tool for how we *can* reason (pragmatic). Currently, the field is split, so your intuition that this is a distinct, valid category of reasoning is well-founded, even if it lacks a single common noun.
