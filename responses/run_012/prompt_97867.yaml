      *   *Authoritative Sequencer:* The Historian/Institution that defines the "Standard Narrative" (e.g., Hegel, Marx, traditional Western Academia). In DS, this is the Primary Node in Primary-Backup replication or the Leader in Paxos/Raft.
      *   *Total Order:* A single timeline where Event A (Discovery of America) happens before Event B (Industrial Revolution) for *everyone*, everywhere. This is the "Universal History" approach.
      *   *Partial Order/Vector Clocks:* Local histories where causality exists within a region but not necessarily between regions until they interact. This is the "Connected Histories" or "Multiple Modernities" approach.
      *   *Replicas:* Different regions/civilizations/nations maintaining their own records of events.
      *   *Divergent Histories:* Conflicting accounts of the same era (e.g., "Discovery" vs. "Invasion").
      *   *Convergence without Coordination:* Eventual Consistency. The idea that over time, truth emerges without a central dictator.
      *   *Eurocentrism:* Treating one node (Europe) as the Leader/Sequencer and forcing all other nodes to sync to its log, discarding conflicts (last-write-wins based on European timestamp).

      *Refining the Mapping:*
      *   *Stretch:* History isn't a clean log. Events aren't discrete writes.
      *   *Stretch:* Consensus in DS is mathematical; consensus in history is political.

  3.  **Task 2: The Residue Report (What gets lost?)**
      *   *Power/Violence vs. Protocol:* In DS, the leader is elected by protocol (Raft) or configured. In history, the "Leader" (Europe) became authoritative via colonization, genocide, and economic dominance. It wasn't a `leader_election()` call; it was a `force_sync()` via gunboat diplomacy.
      *   *Injustice vs. Non-Convergence:* In DS, divergence is a state to be resolved. In history, divergence might be a *feature* (resistance) or the result of suppression. "Unjust" implies ethics; DS is amoral. A "lost narrative" isn't just a dropped packet; it's a destroyed library (Alexandria) or a banned language.
      *   *Asymmetry of Availability:* DS assumes replicas are reachable (eventually). History assumes archives are destroyed, oral traditions suppressed. This isn't network partition ($P$); it's data deletion ($D$). CAP theorem doesn't cover "Data was burned."
      *   *The "Write" Mechanism:* In DS, a client submits a write. In history, who gets to write? Only the literate, the victors. The "clients" are unequal.

  4.  **Task 3: Reverse Mapping (Engineering concepts without historical counterparts)**
      *   *Determinism/Replay:* In DS, I can replay the log and get the same state. In history, counterfactuals are impossible. We can't rollback and try a different consensus algorithm.
      *   *Formal Verification:* We can prove safety and liveness. History has no proofs, only arguments.
      *   *State Machine Replication:* Implies the end state should be identical. Do historians actually want identical narratives? Maybe not. Maybe the goal is *interoperability*, not *identity*.
      *   *Implication:* If historians argue about "Truth" as if it's a convergent state, they might be misapplying the concept. If the system is inherently non-deterministic, seeking a "single total order" is a category error, not just a political bias.

  5.  **Task 4: Judgment (Which side does the residue indict?)**
