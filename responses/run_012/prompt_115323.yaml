answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee Members
  **FROM:** Chair, Investment Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Industry Ministry Proposal: "Project Tâtonnement" Pilot

  ### Executive Summary

  The Industry Ministry has requested co-funding for a three-year pilot program implementing a modified Lange-Lerner mechanism for pricing twenty key industrial inputs. The proposal relies on a Central Board setting prices based on surplus/shortage data, with firm managers incentivized to comply with pricing rules rather than maximize profit. The Ministry argues that modern computation resolves the historical "socialist calculation" objection regarding information processing costs.

  **Recommendation:** The Committee should **decline to fund the pilot in its current form.** The proposal contains fundamental mechanism design flaws—specifically regarding incentives and knowledge discovery—that computation alone cannot resolve. Funding this design poses a high risk of capital misallocation and operational failure.

  **Conditions for Reconsideration:** Should the Ministry revise the proposal to align manager incentives with profitability rather than rule compliance, limit the scope to a non-binding data-sharing initiative, and agree to an independent, pre-registered evaluation framework, the Committee could consider a limited research grant capped at 5% of the requested amount.

  ### Analysis of the Proposal

  The Ministry's economists frame this as a computational challenge, suggesting that Mises and Hayek's objections were merely about the speed of solving simultaneous equations. This interpretation overlooks the deeper economic critiques of the Lange model, which remain relevant regardless of computational power.

  **1. The Incentive Problem (The Principal-Agent Gap)**
  The pilot instructs managers to minimize average cost and produce where marginal cost equals price, with bonuses tied to *compliance* with these instructions. This is the proposal's critical failure point.
  *   **Gaming the System:** When rewards are tied to following specific instructions rather than economic outcomes (profitability/efficiency), managers will optimize for the metric, not the goal. They will have no incentive to innovate, reduce costs beyond the target, or take entrepreneurial risks.
  *   **Soft Budget Constraints:** In a true market, firms that misallocate resources face bankruptcy. In this pilot, the Central Board adjusts prices to clear markets. If a firm is inefficient, the Board may inadvertently subsidize it by raising prices to cover their costs to eliminate "shortages." This removes the disciplinary function of prices.

  **2. The Knowledge Problem (Data vs. Information)**
  Hayek's objection was not merely about the *cost* of processing information, but the *nature* of it.
  *   **Tacit Knowledge:** Much of the knowledge required for production is local, time-specific, and tacit (e.g., machine reliability, worker morale, logistical bottlenecks). This data does not exist in a format that can be transmitted to a Central Board.
  *   **Discovery:** Prices in a market are not just signals; they are discoveries generated through the act of trading. By setting prices administratively, even with quarterly adjustments, the Board prevents the discovery of the true equilibrium price. A quarterly revision cycle is too slow for dynamic industrial inputs, leading to persistent lags that create artificial shortages or surpluses.

  **3. Fiduciary Risk**
  As a Public Development Bank, we are mandated to deploy capital efficiently for development impact. This pilot effectively socializes the risk of price discovery while leaving the upside uncaptured. If the pricing mechanism fails, the resulting distortions in the twenty key inputs could ripple through the broader economy, causing downstream inefficiencies that outweigh the pilot's benefits.

  ### Conditions for Potential Support

  While the current design is unsound, the Committee recognizes the Ministry's legitimate interest in reducing industrial coordination failures. We would be willing to consider a revised proposal under the following strict conditions:

  1.  **Incentive Restructuring:** Manager bonuses must be tied to firm profitability and productivity growth, not compliance with Central Board instructions. Firms must be allowed to deviate from the input mix if they can demonstrate cost savings.
  2.  **Voluntary Participation:** Prices posted by the Board should serve as reference signals (a "shadow market") rather than mandatory directives. Firms must retain the right to source inputs outside the pilot mechanism if they find better terms.
  3.  **Independent Evaluation:** Funding is contingent on the appointment of an independent third-party evaluator with the authority to terminate the pilot after Year 1 if pre-agreed efficiency metrics are not met.
  4.  **Capital Cap:** Exposure should be limited to a research grant facility, not co-investment in industrial assets, capped at 5% of the original request to limit downside risk.

  ### The Strongest Case Against This Recommendation

  In the interest of rigorous debate, the Committee must consider the strongest arguments in favor of the Ministry's proposal, as articulated by its proponents and sympathetic economists:

  **1. The Computational Revolution is Real**
  The Mises-Hayek critique was formulated in the 1930s and 40s. Today, machine learning and big data analytics allow private firms (e.g., Amazon, Walmart) to engage in massive internal central planning, moving trillions in goods via algorithmic price and inventory management without internal market mechanisms. If a private corporation can centrally plan a supply chain more efficiently than the market for its own operations, a state board equipped with similar AI tools might plausibly approximate market prices for standardized industrial inputs better than a fragmented market prone to speculation and volatility.

  **2. Coordination Failures Justify Intervention**
  Developing economies often suffer from "big push" coordination failures. Private actors may not invest in key inputs because they are unsure if complementary industries will emerge. A Central Board that guarantees prices for three years provides the stability required for firms to make long-term capital investments. The value of the pilot is not necessarily static efficiency, but the reduction of uncertainty to unlock investment that otherwise would not occur.

  **3. The "Pilot" Nature Limits Risk**
  This is a three-year experiment, not a permanent regime change. The cost of the pilot is negligible relative to the national budget. If it fails, we learn valuable lessons about the limits of algorithmic planning in the 21st century. If it succeeds, even marginally, the development impact on industrial capacity could be transformative. Rejecting it outright based on 20th-century theory may constitute an opportunity cost we cannot afford.

  ### Conclusion

  While the Ministry's arguments regarding computational capacity and coordination are noted, they do not overcome the fundamental incentive incompatibilities in the proposed design. Computation can process data, but it cannot replicate the entrepreneurial discovery process or align manager incentives with efficiency without profit signals.

  I move that we **decline the co-funding request as currently structured.** I invite the Committee to discuss whether we should offer the Ministry a pathway to resubmit under the conditions outlined above.

  **Decision Required:** Vote on Recommendation.
