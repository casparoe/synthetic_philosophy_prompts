answer: |-
  This is a precise and necessary audit. The "historical science" defense is the standard epistemic shield of evolutionary psychology (EP), but it is often wielded as a rhetorical talisman rather than a methodological blueprint. To evaluate it, we must treat the analogy not as a metaphor but as an argument from structural isomorphism. If the structures do not match, the epistemic authority does not transfer.

  Below is the explicit audit of the analogy, followed by the breakdown of where it fails and what would actually be required to salvage the inference.

  ### 1. The Correspondence Table

  The defense oscillates between two distinct analogies: the **Geological** (impersonal, law-bound processes) and the **Detective** (intentional, motive-bound reconstruction). EP requires the authority of the former but the logic of the latter.

  | Component | Geology / Paleontology (The "Hard" Historical Science) | Forensic Detective (The "Intentional" Reconstruction) | Evolutionary Psychology (The Claim) |
  | :--- | :--- | :--- | :--- |
  | **The Trace / Fossil** | Strata, isotopes, bone morphology, sediment composition. | Body, weapon, fingerprints, digital footprint. | **Universal Psychological Mechanism** (inferred from behavior, self-report, or cognitive tasks). |
  | **The Dating / Constraint** | Radiometric dating, laws of thermodynamics, stratigraphy, physics of erosion. | Time of death (rigor mortis), ballistics trajectories, chain of custody. | **The Environment of Evolutionary Adaptedness (EEA)**; often inferred *from* the trait itself rather than independently dated. |
  | **The Uniformitarian Assumption** | Laws of physics/chemistry are constant over time; present processes explain past formations. | Human motives and physical causality are consistent; people act to achieve goals/avoid detection. | **Psychic Unity of Mankind:** The human mind is a unified, species-typical adaptation formed in the Pleistocene; selection pressures were stable enough to shape universal mechanisms. |
  | **The "Crime" / Event** | Mountain uplift, extinction event, sedimentation epoch. | The murder, the theft, the specific act. | **The Selection Pressure:** The specific ancestral problem (e.g., cheater detection, mate choice) that drove the trait's fixation. |
  | **The "Culprit" / Cause** | Impersonal natural forces (tectonics, climate). | **An Agent** with intent (the murderer). | **Natural Selection** (treated as an optimizer/agent with "intent" to solve problems). |
  | **Independent Verification** | Multiple independent lines (e.g., carbon dating + stratigraphy + fossil record). | Corroborating witnesses, DNA + camera footage + motive. | **Cross-cultural universality** (often weak) or **primate comparison** (often too distant to constrain specific human traits). |

  ### 2. Which Analogy Is Carrying the Weight?

  The defense claims the authority of **Geology** but relies on the logic of the **Detective**.

  *   **Geology** works because it is constrained by impersonal physical laws. A rock layer cannot be "interpreted" as having been formed by gravity if the chemistry suggests volcanic heat. The physical constraints rule out infinite narratives.
  *   **The Detective** works because human agents have *intentions*. We infer the murderer because we assume the act was goal-directed.

  **Evolutionary Psychology smuggles the Detective into the Geology.**
  When an evolutionary psychologist argues that "fear of snakes is an adaptation," they are treating Natural Selection as a **Detective's Culprit** (an agent that identified a problem and crafted a solution). They are not treating it like a geological force (which simply *happens*).
  *   If EP were truly like Geology, it would focus on the *constraints* of neural tissue and developmental pathways (the "physics" of the mind).
  *   Instead, it focuses on *function* and *problem-solution pairs* (the "motive" of the selection).

  The analogy carries the conclusion only because it borrows the *hardness* of geology (rocks don't lie) to protect the *softness* of the detective story (motives are inferred).

  ### 3. Where the Mapping Breaks

  Here are the specific points of structural failure. I have separated the **Genuine Epistemic Breaks** (which threaten the validity of the inference) from the **Colourful Disanalogies** (which are irrelevant).

  #### A. The Status and Richness of the Record (Genuine Break)
  *   **Geology:** The trace (rock/bone) is physical, durable, and exists independently of the theory. You can hold the fossil.
  *   **EP:** The "trace" is often **contemporary behavior** or **self-report**. These are not fossils; they are the *output* of the system, heavily filtered by culture, learning, and immediate context.
  *   **The Break:** In geology, the past causes the present trace. In EP, the present behavior is often used to *infer* the past cause, which is then used to *explain* the present behavior. The "fossil" is often constructed *post hoc* from the very data it is meant to explain.

  #### B. Independent Constraints and Overdetermination (Genuine Break)
  *   **Geology:** You can date a stratum using uranium-lead dating *without* knowing the biological history. You can verify a reconstruction using fluid dynamics *without* knowing the fossil record. Multiple independent lines of evidence converge (overdetermination).
  *   **EP:** The "dating method" is usually the **adaptationist logic itself**. We know the trait is ancient *because* it looks adaptive, and we know it is adaptive *because* it is ancient/universal.
  *   **The Break:** There is rarely an independent physical law or external clock that constrains the psychological hypothesis *before* the functional story is told. Without independent constraints (e.g., archeological evidence of the specific pressure, neurobiological limits), the "historical reconstruction" is underdetermined.

  #### C. The Uniformitarian Assumption (Genuine Break)
  *   **Geology:** Gravity and chemistry were the same 100 million years ago. This is a robust, testable assumption.
  *   **EP:** The assumption is that the **EEA was stable and uniform** enough to select for specific modules, AND that the **mind has not changed** since.
  *   **The Break:** We have independent evidence that the Pleistocene was *not* uniform (rapid climate shifts). We also have evidence of recent human evolution (lactase persistence, high-altitude adaptation). Assuming a "stop clock" on human psychological evolution at 10,000 years ago is a weaker uniformitarian assumption than assuming gravity is constant.

  #### D. Underdetermination of Cause (Genuine Break)
  *   **Geology:** A folded rock layer implies compression. It cannot be explained by "drift" or "byproduct" in the same way biology can.
  *   **EP:** A behavior (e.g., religious belief) can be explained as:
      1.  Direct Adaptation (group cohesion).
      2.  Byproduct (hyperactive agency detection).
      3.  Genetic Drift.
      4.  Cultural Evolution (memetic).
  *   **The Break:** Geology has physics to rule out options. EP often lacks a "physics of culture" or a "physics of development" to rule out the byproduct hypothesis. The adaptationist story is merely *one* compatible narrative, not the *constrained* inference.

  #### E. The "Culprit" (Colourful Disanalogy)
  *   **Difference:** Natural Selection is blind; Detectives chase intentional agents.
  *   **Relevance:** Low. We understand selection well enough to know it acts *as if* intentional. This is not the fatal flaw. The fatal flaw is not that selection is blind, but that we cannot distinguish its "handiwork" from noise without better traces.

  #### F. The Investigator's Influence (Colourful Disanalogy)
  *   **Difference:** Geologists don't talk to rocks; Detectives interview witnesses.
  *   **Relevance:** Low/Mixed. While humans are reactive subjects, controlled experiments can mitigate this. This is a methodological hurdle, not a structural impossibility.

  ### 4. Verdict: Is the Analogy Doing Work?

  **The analogy is carrying the conclusion, not supporting it.**

  It functions as an **Epistemic Shield**. It says: *"You cannot demand experimental reruns any more than you can demand them of a geologist."* This is true. But it omits the second half of the geological promise: *"But like a geologist, we must submit our reconstructions to independent physical constraints and multiple lines of convergent evidence."*

  When the "historical science" defense is invoked, it is usually to protect **adaptationist hypotheses** that lack those independent constraints. If EP were truly operating like geology, a hypothesis about a psychological adaptation would be considered weak until supported by:
  1.  **Archeological/Paleoecological evidence** of the specific pressure (independent of the psychology).
  2.  **Phylogenetic evidence** showing the trait's emergence relative to relatives (independent of the function).
  3.  **Developmental constraints** showing the trait *could* be built (independent of the utility).

  Most "Just-So Stories" fail on all three. They rely on the *plausibility* of the story (Detective work) while claiming the *authority* of the reconstruction (Geological work).

  ### 5. A Better Analogy (or The Honest Rescue)

  There is a better analogy for what EP *should* be doing, which reveals what is missing when they rely on the "historical science" defense.

  **The Better Analogy: Comparative Physiology anchored in Phylogeny.**
  *   **Why it fits:** Physiology does not just ask "What is this organ for?" (Function). It asks "How is this built?" (Mechanism) and "Who else has this?" (Phylogeny).
  *   **The Constraint:** You cannot claim the heart is for pumping blood if you find a species with a heart that doesn't pump blood. You cannot claim a trait is an adaptation for the Pleistocene if closely related primates share it (suggesting it is older) or if it varies wildly by culture (suggesting it is plastic).
  *   **The Rescue:** To rescue the inference, EP must stop treating the **Mind** as the only fossil.
      *   **Current Inference:** Trait exists $\rightarrow$ Must be adaptive $\rightarrow$ Therefore Ancestral Problem X existed.
      *   **Rescued Inference:** Independent evidence suggests Ancestral Problem X existed (e.g., archeological evidence of pathogen load) $\rightarrow$ Therefore we predict Trait Y $\rightarrow$ We find Trait Y.

  **The Honest Answer:**
  If the question is whether the "historical science" analogy rescues the specific charge of **unfalsifiable storytelling**, the answer is **no**.
  Geology is not just "inferring the past from the present." It is "inferring the past from the present **using laws that constrain the number of possible pasts to one.**"
  Evolutionary psychology, in its popular adaptationist form, uses functional logic that **expands** the number of possible pasts (since any trait can be fitted to many stories).

  To be a legitimate historical science in the geological sense, EP must adopt **independent warrant**. It must find traces of the *environment* that are not derived from the *mind*. Until the "dating method" (the EEA) is established independently of the "fossil" (the psychological trait), the analogy remains a rhetorical device, and the charge of storytelling stands.
