      *   **Task 1:** Lay out the correspondence explicitly (Table format suggested). Identify roles: fossil/trace, dating method/physical law, uniformitarian assumption, crime scene/culprit.
      *   **Task 2:** Distinguish between the *geological analogy* (impersonal laws) and the *detective analogy* (agent/intentions) and identify which is actually doing the work.
      *   **Task 3:** Identify where the mapping breaks (record richness, independent evidence, contamination of traces, underdetermination of adaptation vs. byproduct/drift/noise, etc.).
      *   **Task 4:** Separate genuine disanalogies from colourful ones.
      *   **Task 5:** Evaluate the conclusion: Does the analogy do real work, or is it rhetorical cover?
      *   **Task 6:** Propose a better analogy if one exists, or state honestly that no analogy rescues the inference and specify what *would* rescue it.

  2.  **Analyze the "Historical Science" Defense:**
      *   *The Claim:* EP is like geology/forensics. We infer past causes from present effects. Just because we can't rerun history doesn't mean we can't know it.
      *   *The Counter:* Geology has rocks/strata. Forensics has DNA/ballistics. EP has... universal human nature? Self-reports? Behavioral tasks?
      *   *The Core Tension:* Historical sciences rely on *independent constraints* (physics, chemistry, stratigraphy) to narrow down possibilities. EP relies on *functional logic* (what would have been adaptive?) which is notoriously flexible.

  3.  **Drafting the Correspondence Table:**
      *   *Geology Side:* Fossil/Strata, Radiometric Dating/Physics, Uniformitarianism (laws of nature constant), Past Environment/Event.
      *   *EP Side:* Universal Psychological Mechanism (UPM), Cross-cultural stability?/Comparative Primate Data?, Environment of Evolutionary Adaptedness (EEA), Selection Pressure/Ancestral Problem.
      *   *Detective Side:* Body/Weapon, Autopsy/Ballistics, Human Behavior/Motive consistency, Murderer/Intent.
      *   *Analysis:* EP oscillates between these. It wants the hardness of geology but the intentionality of the detective (natural selection as the "blind watchmaker" detective).

  4.  **Distinguishing the Analogies:**
      *   *Geology:* Impersonal, law-bound. Good for "how," less good for "why" (teleology).
      *   *Detective:* Intentional, motive-driven. Matches the "adaptationist" narrative (problem $\rightarrow$ solution).
      *   *Which carries the argument?* EP relies on the *Detective* logic (identifying the "problem" the mind solved) but claims the *Geological* authority (hard science, historical reconstruction). This is a category error.

  5.  **Identifying the Breaks (The "Audit"):**
      *   *Record Richness:* Rocks don't lie. Strata are physical. Psychological traits are inferred from behavior, which is plastic.
      *   *Independent Evidence:* Geology uses physics/chemistry *independent* of the historical narrative. EP often uses the *existence* of the trait as evidence for the *selection pressure*, which is circular.
      *   *Contamination:* Strata aren't influenced by the geologist. Human behavior is influenced by culture, current context, and the question being asked.
      *   *Underdetermination:* A rock layer implies a specific pressure/heat. A behavior (e.g., jealousy) could be adaptation, byproduct, drift, or cultural learning. EP struggles to distinguish these.
      *   *Uniformitarianism:* In geology, gravity/chemistry are constant. In EP, the assumption is that the *mind* is constant, but the *environment* (EEA) is inferred from the mind, not independent.

  6.  **Evaluating the Weight of Disanalogies:**
      *   *Colourful:* "Detectives wear hats," "Geologists use hammers." Irrelevant.
      *   *Genuine:* The lack of independent physical constraints on the *inference of function*. The inability to distinguish adaptation from byproduct without independent evidence of the past environment.
      *   *Verdict:* The analogy is rhetorical cover. It borrows the epistemic authority of geology without the methodological constraints.

  7.  **Finding a Better Analogy (or admitting defeat):**
      *   *Better Analogy:* Reverse Engineering (Engineering/Design). But this assumes design.
      *   *Better Analogy:* Comparative Method (Biology). Using phylogeny to control for ancestry. EP often ignores deep phylogeny in favor of "human universals."
      *   *Honest Answer:* No analogy rescues the *adaptationist* inference alone. To rescue it, EP needs *independent evidence of the EEA* (paleoecology, archeology) that constrains the hypotheses *before* looking at the psychology. It needs to stop treating the mind as the only fossil.

  8.  **Refining the Tone:**
      *   Academic, rigorous, critical but fair.
      *   Avoid straw-manning EP (acknowledge good work exists), but focus on the specific defensive move requested.
      *   Ensure the distinction between "Historical Science" (valid) and "Just-So Storytelling" (invalid) is clarified through the lens of *constraint*.

  9.  **Step-by-Step Construction of the Response:**
      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: The analogy borrows authority but fails on constraints.
      *   **Table:** Clear mapping of Geology vs. Detective vs. EP.
      *   **Analogy Analysis:** Show how EP conflates the two (Natural Selection as both Law and Agent).
      *   **The Breaks:** Detail the specific epistemic gaps (Independence, Contamination, Underdetermination).
      *   **The Verdict:** The analogy is a shield, not a tool.
      *   **The Rescue:** What would actually make it scientific? (Independent constraints, phylogenetic control, predictive success regarding *novel* environments).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "uniformitarian assumption"? Yes, need to specify EEA vs. Physical Laws.
      *   *Check:* Did I distinguish Geology vs. Detective? Yes, crucial point about teleology.
      *   *Check:* Is the conclusion clear? Yes, the analogy doesn't save the specific adaptationist claims without more constraint.
      *   *Refinement:* Make sure to mention the "Environment of Evolutionary Adaptedness" (EEA) as the specific EP version of the "past."
      *   *Refinement:* Emphasize *independent warrant*. In geology, you can date a rock without knowing the history. In EP, you often date the adaptation by assuming the history.

  11. **Final Polish:** Check against the prompt's specific requirements (table, specific breaks, separation of colourful vs. genuine, final verdict). (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to dismiss EP entirely, but to dismiss the *specific defensive move* as insufficient. The prompt asks to audit the *move*, not necessarily the whole field, though the move supports the field's legitimacy. I will focus on the epistemic structure of the inference.

  *(Final thought on the "Better Analogy")*: The best analogy for *good* EP is actually **Comparative Physiology** combined with **Archeology**. You don't just say "this organ is useful." You say "this organ exists in these relatives, the substrate existed at this time, therefore..." But standard EP often skips the phylogeny. I will suggest **Phylogenetic Comparative Method** as the stronger analogy.

