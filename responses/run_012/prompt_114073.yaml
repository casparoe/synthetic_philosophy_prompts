answer: |-
  Trust the disaggregated data only when the grouping factor causes both the treatment assignment and the outcome; otherwise, rely on the pooled figures. No honest rule avoids the causal story; numbers alone cannot distinguish causes from consequences.

  Your treatment and training verdicts are correct because severity and department dictate both assignment and success (confounders). Your diet and relapse verdicts are correct because bypass surgery and course completion are consequences of the treatment or health status (mediators or colliders); conditioning on them distorts the truth. Batting averages are purely weighted sums; the pooled figure correctly reflects total performance. The admissions case is the pivot: faculty choice stems from gender, making faculty a mediator. Pooled data correctly measures overall disadvantage, but split data isolates selection bias. Your unease arises because training and admissions look similar numerically, but causally they differ: departments assign training (confounder), whereas genders choose faculties (mediator).

  Consider kidney stone treatments: Treatment A looks better overall, but B wins when split by stone size. Since size dictates both treatment choice and success, splitting is correct, confirming your instinct on treatments. Conversely, imagine a drug appears harmful overall but beneficial among hospitalised patients. Since hospitalisation is caused by both poor health and drug side-effects (a collider), splitting creates a false correlation. Here, you must trust the pooled data, overruling any instinct to disaggregate.

  You must abandon the absolute certainty of your admissions verdict. If 'disadvantaged' means 'lower overall admission rate', the pooled figure stands. However, if it means 'bias in the selection process', the pooled figure is misleading, and you must trust the split, aligning with your training case. The rule forces you to recognise that 'disadvantage' is two different questions requiring different data. Your current rule fails because it relies on group sizes rather than causal direction; the repaired rule demands you identify whether the grouping factor precedes or follows the assignment. In health board waiting lists, this means distinguishing whether a patient's category (e.g., urgency) determines their slot (confounder) or results from their wait time (mediator). Only the former justifies splitting. Without this causal clarity, Simpson's paradox remains unresolvable.
