answer: |-
  Here is a teaching plan designed for 75 minutes, accounting for your tendency to talk too much (I have built in forced silence blocks). It isolates the *voluntas fallendi* (will to deceive) as the core mechanism, prevents the session from collapsing into consequentialism, and manages your specific colleagues.

  ### The Carrying Example: The Perjured Witness Who Turns Out Right

  You are correct to ditch the Murderer at the Door (MaD) as the *carrying* example. MaD triggers a consequentialist override immediately ("Save the life!"), which bypasses the psychological mechanism you want to isolate. Jacob/Isaac is too textually specific and invites the Historian to dominate the exegesis early.

  **Use this instead:**
  > **The Scenario:** A witness takes the stand. They *believe* the Defendant is guilty, but they did not actually see the crime. They want the Defendant to be convicted. They testify under oath: "I saw him at the scene."
  > **The Twist:** It turns out the Defendant *was* at the scene (unknown to the witness). The statement is objectively **true**.
  > **Augustine's Verdict:** This is a **lie**.

  **Why this example carries the load:**
  1.  **It severs Truth from Lie:** It proves the lie is not in the *falsity* of the proposition (since the proposition is true).
  2.  **It severs Error from Lie:** It contrasts with a witness who believes they saw the crime but is mistaken (Augustine: Error, not lie).
  3.  **It isolates the Will:** The sin is in the *duplex cor* (double heart)—signifying something other than what is in the mind.
  4.  **It blocks Consequentialism:** The outcome (convicting a guilty man) might be "good," but the act remains tainted. This prevents the MaD reflex.

  ---

  ### The Sequence (75 Minutes)

  #### 0:00 – 0:10: The Definition (The Pivot)
  *   **Do not summarize the texts.** Start immediately with the definition.
  *   **Write on board:** *Mendacium = Falsa significatio + Voluntas fallendi.*
  *   **Talk (5 mins):** State the pivot clearly: "For Augustine, the locus of the lie is not the world (truth conditions) but the mind (intent to deceive). A false statement believed true is error. A true statement intended to deceive is a lie."
  *   **Stop Talking.** (Force yourself).
  *   **Action:** Hand out the "Perjured Witness" scenario. Give them 3 minutes of silent reading.

  #### 0:10 – 0:25: Applying the Example & The Phil-Language Objection
  *   **Discussion (10 mins):** Ask: "Why is the witness who tells the objective truth a liar, while the witness who tells an objective falsehood (but believes it true) is not?"
  *   **Goal:** Get them to articulate that the violation is of the *social institution of speech* (signifying what you think), not the *correspondence with reality*.
  *   **The Phil-Language Objection (Expected here):** "This criterion is unobservable. We can never verify the *voluntas*."
  *   **Your Move:** **Concede** the epistemic difficulty (we can't see into souls). **Refuse** the moral relevance. Say: "Augustine is doing moral psychology, not jurisprudence. The definition holds even if adjudication is hard. The sin exists even if the judge can't see it."
  *   **Historian Check:** If they nitpick *voluntas fallendi* vs. *fallendi voluntas*, acknowledge the Latin, thank them, and move on. Do not let this become a translation seminar.

  #### 0:25 – 0:40: The Wobble (Self-Harm vs. Social Bond)
  *   **Setup:** Now that they accept the definition, challenge the *rationale*.
  *   **The Wobble Moment:** Ask: "If the lie is in the will, what is damaged?"
      *   *Option A:* My soul (Self-Harm).
      *   *Option B:* The bond of trust (Social Harm).
  *   **The Test Case:** The Midwives of Exodus (who lied to Pharaoh and were rewarded by God).
  *   **Discussion (10 mins):** "If lying damages the liar's soul, how can God reward the Midwives? Is Augustine forced to say God rewarded the *benevolence* and ignored the *sin*? Or is the sin not in the self-harm?"
  *   **Why this wobbles:** This is where the view feels unstable. If it's just self-harm, the Midwives case breaks the system. If it's social harm, why is it always wrong?
  *   **Your Intervention:** Do not rescue it too fast. Let them struggle. Then clarify: "Augustine leans toward the Social Bond. The lie breaks the link between mind and sign. The Midwives are rewarded for their *mercy*, not their *speech*. The speech remains a lie, but the mercy is weighed separately."
  *   **Crucial Distinction:** This prevents the "Rigorism" mistake. It's not a rule for rules' sake; it's about preserving the possibility of communication.

  #### 0:40 – 0:55: The Clinical Ethics & Kant Pushback
  *   **Transition:** "Let's take this psychology out of the Bible and into the ward."
  *   **The Clinical Case:** Dementia care. Telling a patient their deceased spouse is "at the shops" to prevent distress.
  *   **Clinical Ethics Objection:** "This is benevolent. The 'will' is care, not deception."
  *   **Your Move:** **Refuse to settle.** Do not let the room debate whether the lie is *justified*. Force them to apply Augustine's definition. "Under Augustine's definition, is this a lie?" (Yes). "Does the benevolence remove the *voluntas fallendi*?" (No). "Then Augustine condemns it."
      *   *Boundary:* "We are not deciding if Augustine is right about dementia today. We are deciding if we understand his criterion."
  *   **The Kant Objection:** "This is just theology. It won't survive secular translation."
  *   **Your Move:** **Refuse the dismissal.** "Kant Groundwork II is structurally identical here. The violation is of the categorical condition of communication. Whether the sanction is Hell or Rational Inconsistency is secondary to the structure of the act." (This satisfies the Kantian without derailing into Groundwork exegesis).

  #### 0:55 – 1:05: Jacob/Isaac & The Historian
  *   **Briefly address:** You mentioned Jacob. Augustine treats Jacob's deception of Isaac as a *mystery* or *prophecy*, not a standard lie, because Isaac represents God the Father and Jacob represents Christ.
  *   **Instruction:** Tell the Historian: "I know *Contra Mendacium* treats this allegorically. I am bracketing the allegory to focus on the moral psychology. If I treat Jacob as a standard agent, he lies. Augustine exempts him only via special revelation. Can we agree to set the Patriarchs aside for the moral theory?"
  *   **Why:** This keeps the Historian from correcting your exegesis for 20 minutes.

  #### 1:05 – 1:15: The Final Question & Boundary Setting
  *   **Boundary Statement:** "We have not covered the hierarchy of lies (eight kinds in *De Mendacio*), nor have we solved the applied ethics of the dementia case. We focused solely on the locus of the moral failure."
  *   **The Final Question:** Do not ask "What did Augustine say?" Ask this:
      > **"Construct a scenario where telling the objective truth is a graver moral failure than telling a falsehood, according to Augustine's psychology."**
  *   **Why this works:** To answer this, they must internalize the *voluntas* pivot. They have to describe a situation where the *intent to deceive* is present in the truth-teller but absent in the liar (e.g., the truth-teller is malicious, the liar is mistaken). If they can construct this, the pivot landed. If they talk about outcomes, it didn't.

  ---

  ### Misconceptions & Management Strategy

  | Colleague | Misconception (in order of formation) | When it forms | Your Move |
  | :--- | :--- | :--- | :--- |
  | **Phil Language** | "The criterion is untestable/unobservable." | Min 15 (During Example) | **Concede** observability, **Refuse** relevance. (It's a definition of the act, not a legal test). |
  | **Clinical Ethics** | "Benevolent deception isn't deception." | Min 45 (Dementia Case) | **Refuse.** Insist Augustine classifies it as a lie. Do not debate the *ethics*, debate the *classification*. |
  | **Kant** | "This is theology, not philosophy." | Min 50 (Secular Translation) | **Refuse.** Argue the structure (violation of rational agency/speech) is secularizable even if the sanction is theological. |
  | **Historian** | "You're misreading the Latin/Context." | Min 60 (Jacob/Isaac) | **Concede** complexity, **Refuse** depth. "Yes, the allegory exists, but we are bracketing it for the moral theory." |
  | **Everyone** | "This is just Rule Rigorism." | Throughout | **Head off** at Min 30 (The Wobble). Show it's about the *nature of speech*, not a divine command. |
  | **Everyone** | "It's wrong because it harms the liar's soul." | Min 30 (The Wobble) | **Head off** at Min 35. Show the Midwives case: Soul harm doesn't explain the reward. It's about the Social Bond. |

  ### Time Management for the "Talks Too Much" Leader

  1.  **The 10-Minute Hard Stop:** Set a timer on your phone for 0:10. When it vibrates, stop speaking mid-sentence if necessary and hand out the example.
  2.  **The "Silence" Block:** During the "Wobble" (Min 30), ask the question and then *physically lean back*. Count to ten in your head. Let the Kantian and the Clinical person fight it out.
  3.  **The "Parking Lot":** When the Historian brings up Latin or the Kantian brings up *Groundwork*, say: "That is a separate paper. For this session, we are treating the text as a unitary moral psychology. I am parking that point."

  ### Final Advice on the "Wobble"

  You want the view to feel like it's wobbling at the Midwives case.
  **Do not say:** "Augustine has a solution."
  **Do say:** "This is the hardest point in the text. If the lie damages the soul, the reward makes no sense. If the lie damages the social fabric, why does God reward the breach? Augustine has to choose: is the sin in the *act* or the *intent*? He chooses the intent, but then has to explain why the intent doesn't negate the reward."
  *Let them sit with that tension.* It prevents the session from feeling like a lecture on "Augustine says No." It becomes an investigation into *why* the definition holds even under divine pressure.

  ### Summary of Boundaries (Say this explicitly at Min 5)
  "We are not doing applied ethics (we won't solve the dementia case). We are not doing exegesis (we won't solve the Jacob allegory). We are doing moral psychology: locating the locus of the moral failure. If you find yourself arguing about whether a lie is *permissible*, stop. Ask instead whether it fits the *definition*."
