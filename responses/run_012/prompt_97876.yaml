  ### Decision Problem: The Organic Farm's Crop Choice

  **Setting:**
  A small organic farm ("GreenValley") must choose a single crop for the upcoming season. The profit depends on the weather, which is subject to significant ambiguity due to conflicting climate models regarding the strength of the upcoming El Niño.

  **Acts ($f$):**
  1.  **Act $A$ (Heirloom Tomatoes):** High-risk, high-reward. Thrives in dry conditions, susceptible to rot in wet conditions.
  2.  **Act $B$ (Zucchini):** Robust, moderate-reward. Yields consistently but has a lower price ceiling.
  3.  **Act $C$ (Kale):** Low-reward, niche. Requires specific care; generally outperformed by Zucchini in profit but has a slight advantage in very dry spells due to lower water costs compared to tomatoes.

  **States ($S$):**
  1.  **$S_1$ (Dry):** Drought conditions.
  2.  **$S_2$ (Normal):** Average rainfall.
  3.  **$S_3$ (Wet):** Heavy rainfall/flooding.

  **Payoffs (Net Profit in $1,000s):**

  | Act | $S_1$ (Dry) | $S_2$ (Normal) | $S_3$ (Wet) |
  | :--- | :---: | :---: | :---: |
  | **$A$ (Tomatoes)** | 8 | 5 | 2 |
  | **$B$ (Zucchini)** | 4 | 5 | 6 |
  | **$C$ (Kale)** | 5 | 4 | 4 |

  *Note: No act state-wise dominates another. ($A$ beats $B,C$ in $S_1$; $B$ beats $A,C$ in $S_3$; $C$ beats $B$ in $S_1$).*

  **Credal Set ($\mathcal{P}$):**
  The probabilities are derived from three conflicting expert reports, treated as the extreme points of the credal set $\mathcal{P} = \text{CH}\{p_1, p_2, p_3\}$.

  *   **$p_1$ (Expert: Wet Bias):** $(0.10, 0.45, 0.45)$
  *   **$p_2$ (Expert: Dry Bias):** $(0.45, 0.45, 0.10)$
  *   **$p_3$ (Expert: Normal Bias):** $(0.20, 0.60, 0.20)$

  ---

  ### The Audit

  #### 1. Expected Utility Ranges
  We calculate $E_p[f] = \sum u(f, s_i)p_i$ for each act at each extreme distribution.

  *   **Act $A$:**
      *   $E_{p_1}[A] = 0.1(8) + 0.45(5) + 0.45(2) = 3.95$
      *   $E_{p_2}[A] = 0.45(8) + 0.45(5) + 0.1(2) = 6.05$
      *   $E_{p_3}[A] = 0.2(8) + 0.6(5) + 0.2(2) = 5.00$
      *   **Range:** $[3.95, 6.05]$

  *   **Act $B$:**
      *   $E_{p_1}[B] = 0.1(4) + 0.45(5) + 0.45(6) = 5.35$
      *   $E_{p_2}[B] = 0.45(4) + 0.45(5) + 0.1(6) = 4.65$
      *   $E_{p_3}[B] = 0.2(4) + 0.6(5) + 0.2(6) = 5.00$
      *   **Range:** $[4.65, 5.35]$

  *   **Act $C$:**
      *   $E_{p_1}[C] = 0.1(5) + 0.45(4) + 0.45(4) = 4.10$
      *   $E_{p_2}[C] = 0.45(5) + 0.45(4) + 0.1(4) = 4.45$
      *   $E_{p_3}[C] = 0.2(5) + 0.6(4) + 0.2(4) = 4.20$
      *   **Range:** $[4.10, 4.45]$

  #### 2. Decision Verdicts

  *   **$\Gamma$-maximin:** Selects the act with the highest minimum expected utility.
      *   $\min E[A] = 3.95$
      *   $\min E[B] = 4.65$
      *   $\min E[C] = 4.10$
      *   **Verdict:** Selects **Act $B$**.

  *   **$\Gamma$-maximax:** Selects the act with the highest maximum expected utility.
      *   $\max E[A] = 6.05$
      *   $\max E[B] = 5.35$
      *   $\max E[C] = 4.45$
      *   **Verdict:** Selects **Act $A$**.
      *   *(Condition Met: Maximin and Maximax select different acts).*

  *   **Hurwicz Criterion ($\alpha = 0.5$):**
      *   $H(A) = 0.5(3.95) + 0.5(6.05) = 5.00$
      *   $H(B) = 0.5(4.65) + 0.5(5.35) = 5.00$
      *   $H(C) = 0.5(4.10) + 0.5(4.45) = 4.275$
      *   **Verdict:** Indifferent between **$A$ and $B$**.

  *   **E-admissibility:** An act is admissible if it maximizes EU for at least one $p \in \mathcal{P}$.
      *   At $p_1$: $B (5.35) > A (3.95) > C (4.10)$. ($B$ is optimal).
      *   At $p_2$: $A (6.05) > B (4.65) > C (4.45)$. ($A$ is optimal).
      *   At $p_3$: $A (5.00) = B (5.00) > C (4.20)$. ($A, B$ optimal).
      *   Act $C$ is never optimal.
      *   **Verdict:** **$\{A, B\}$**.

  *   **Maximality (Interval Dominance):** An act is maximal if no other act $g$ satisfies $\underline{E}(g - f) > 0$.
      *   Compare $B$ and $C$: $\min E[B] (4.65) > \max E[C] (4.45)$. Thus, $B$ interval dominates $C$. $C$ is not maximal.
      *   Compare $A$ and $B$: Ranges $[3.95, 6.05]$ and $[4.65, 5.35]$ overlap. Neither interval dominates the other.
      *   **Verdict:** **$\{A, B\}$**.
      *   *(Condition Met: Maximality coincides with E-admissibility).*

  #### 3. Structural Analysis

  **Feature Doing the Work:**
  The divergence between $\Gamma$-maximin and $\Gamma$-maximax is driven by the **crossing of expected utility lines** for acts $A$ and $B$ across the credal set. $A$ is a "high-variance" act relative to the probability uncertainty, while $B$ is "robust."
  The coincidence of Maximality and E-admissibility is engineered by making Act $C$ **interval dominated** by Act $B$. While $C$ is not *state-wise* dominated (it pays more than $B$ in $S_1$), its expected utility is strictly lower than $B$'s worst-case expected utility across the entire credal set. This removes $C$ from the Maximal set, forcing Maximality to equal E-admissibility.

  **Smoothing the Ambiguity (Collapse to Single Distribution):**
  If the credal set collapses to a single distribution (e.g., $p_3$):
  *   $E[A] = 5.0, E[B] = 5.0, E[C] = 4.2$.
  *   Standard Expected Utility theory applies. The agent is indifferent between $A$ and $B$, and strictly rejects $C$. The conflict between security (Maximin) and opportunity (Maximax) vanishes because the probability is precise.

  **Smoothing the Payoffs (No Crossing):**
  If payoffs are perturbed such that $E_p[A] > E_p[B]$ for all $p \in \mathcal{P}$ (e.g., increasing $A$'s payoffs by 1 unit):
  *   $A$ now expectation-dominates $B$.
  *   **E-admissibility:** Shrinks to $\{A\}$. ($B$ is no longer optimal for any $p$).
  *   **Maximality:** Shrinks to $\{A\}$. ($B$ is now interval dominated by $A$).
  *   **Maximin/Maximax:** Both select $A$.
  *   **Result:** The divergence between choice rules disappears, and the "coincidence" of Maximality and E-admissibility remains trivial (both are singletons).

  #### 4. Coincidence of Maximality and E-admissibility
  Is this coincidence forced by the structure or an accident?
  It is an **accident of the specific payoffs**. In general, Maximality $\supseteq$ E-admissibility. An act can be E-inadmissible (beaten by a mixture of other acts) yet still be Maximal (not beaten by any *single* pure act).
  In this case, Act $C$ happens to be beaten by a pure act ($B$) in terms of interval dominance. If we adjusted $C$'s payoffs to be $[4.5, 5.5]$, it would be E-inadmissible (beaten by a mix of $A$ and $B$) but Maximal (since it overlaps with both $A$ and $B$). The coincidence here relies on $C$ being a "weak" act that is globally inferior to the robust option $B$.

  #### 5. Objection from a $\Gamma$-maximin Defender
  A defender of $\Gamma$-maximin (who chooses $B$) would raise the following objection against admitting Act $C$ (Kale) as a serious option, even if it isn't state-wise dominated:

  > "Act $C$ is **interval dominated** by Act $B$. While $C$ offers a slightly higher payoff in the specific state of Drought ($S_1$), the probability uncertainty is such that even in the 'best case' probability scenario for Kale, Zucchini ($B$) yields a higher expected return. By choosing $C$, the agent accepts a lower guaranteed floor (4.10 vs 4.65) without gaining any upside potential that isn't already better served by the high-risk Tomatoes ($A$). $C$ is a 'spurious' act that distracts from the fundamental trade-off between the security of $B$ and the opportunity of $A$."
