      *   *(2) Toxin Strategy:* Intend tonight -> Get Money -> Don't Drink tomorrow. (The "Toxin Intention" strategy).
      *   *(3) Synchronic Rationality:* Only the choice *at the time* matters. No binding force of past intentions. Drinking tomorrow is irrational *at that time* (pure cost).
      *   *(4) Intention-Belief Constraint:* You can't intend X if you believe you won't do X. (Standard Anscombe/Velleman view).
      *   *(5) Intention Stability:* Intentions create reasons. Dropping an intention without new info is criticizable. (Bratman-style planning theory).
      *   *(6) Agent-Level/Disposition:* Focus on being the *type* of agent who succeeds.

  3.  **Identify Conflicts (The "Tension Map"):**

      *   **Conflict A: (2) vs (3) & (4).**
          *   (2) says: I form the intention tonight.
          *   (4) says: I can't form the intention if I know I won't drink.
