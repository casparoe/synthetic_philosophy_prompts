          *   *Cheapest:* Modify (4). Allow for "predictive intention" or self-binding.

      *   *For Conflict 2 (3 vs 5):*
          *   *Option:* Reframe (5) as prudential advice, not rational requirement. Or admit (3) is too strong.
          *   *Cheapest:* Soften (3). "Primary" assessment is synchronic, but secondary is diachronic.

      *   *For Conflict 3 (1 vs 2):*
          *   *Analysis:* The user thinks they are the same. They aren't quite. Newcomb is about Act-Evidence. Toxin is about Intention-Causation.
          *   *Resolution:* Align with (6). Move to Agent-Level theory (FDT-ish).

  6.  **Selecting the Single Best Revision:**
