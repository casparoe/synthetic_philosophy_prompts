      Revising (3) to allow diachronic rationality resolves the conflict with (5), makes (2) possible (via resolute choice or planning norms), and aligns with (6). It creates tension with (1) *if* (1) is strictly act-based EDT, but if (1) is defended as "being a one-boxer type," it fits (6).
