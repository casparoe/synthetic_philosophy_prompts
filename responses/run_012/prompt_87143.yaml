      *Recommendation:* Drop (3). It's the most restrictive and causes the most friction with (5) and (6). Adopting a Planning Agency view (Bratman) or Resolute Choice (McClennen) saves (2), (5), and (6), and can be made compatible with (1) if framed carefully (though EDT is usually act-based). Actually, moving to Agent-Level (6) suggests FDT, which One-Boxes and Solves Toxin. So moving to (6) fully implies dropping (3).

