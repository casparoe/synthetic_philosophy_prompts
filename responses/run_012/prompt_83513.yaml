answer: |-
  Pascal's Mugging dissolves because the probability assignment required to calculate expected value is undefined, not merely negligible, due to the absence of a generative model or reference class for the mugger's specific claim. Probabilities are not freestanding numerical intuitions but measures over a defined space of possibilities generated by a model, whether that model relies on frequency, symmetry, or logical depth. To assert $P(H) = \epsilon$ requires a mechanism that generates hypothesis $H$ with frequency $\epsilon$ or a symmetry principle that distributes measure $\epsilon$ to $H$ relative to its alternatives. The mugger posits a hypothesis space of "possible ontologies where beings can grant $3 \uparrow\uparrow\uparrow 3$ utility contingent on wallet surrender," yet there is no physical theory, no symmetry principle, and no frequency data that generates this space. Unlike rolling a die or modeling climate systems, there is no causal or logical mechanism linking "wallet surrender" to "divine reward" that allows us to construct a sample space; without a sample space, the measure is not just unknown, it is non-existent.

  Your students will immediately object that we assign tiny probabilities to bizarre hypotheses all the time, such as Boltzmann brains or the five-minute world, so why is the mugger different? Those cases differ fundamentally because they are endogenous to accepted physical or epistemic models. A Boltzmann brain's probability is derived from statistical mechanics applied to de Sitter space; we have a theory of fluctuations, and the brain is a rare state within that theory's phase space. The five-minute hypothesis is penalized via Kolmogorov complexity relative to the standard model of history, where the reference class is "possible pasts consistent with current evidence." In both cases, the hypothesis is embedded in a structured space where measure is definable because the rules of the game are already agreed upon. The mugger's claim is exogenous; it posits a new rule set specifically designed to exploit the decision theory without providing the structural context needed to measure it, asking you to evaluate a probability outside any reference class you actually possess.

  You cannot rescue the argument by simply stipulating a prior, such as $P = 10^{-100}$, because any fixed stipulation is vulnerable to the mugger's escalation. If you decree that supernatural claims decay at rate $f(n)$ based on complexity or absurdity, the mugger offers utility growing at rate $g(n)$ where $g > f$. A stipulated prior is arbitrary, and arbitrary priors yield arbitrary expected values; if the EV is arbitrary, the decision is undefined. The error lies in treating the probability as a parameter you can tune to make the problem go away, rather than recognizing it as a quantity derived from a model that is missing. Therefore, the rational response is not to cap utility or reject expected value maximization, but to recognize that the equation $EV = P \times U$ cannot be instantiated. The offer has no expected value because the probability term refers to nothing measurable, conceivable, or modelable within any epistemology that doesn't already beg the question.
