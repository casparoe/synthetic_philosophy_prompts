  Give me an example of a conceptual issue that this setup is a clean instance of — a spot where two things the literature treats as one start pulling apart, and where the standard machinery quietly assumes an answer. Not "here's what happens when you move a parameter." I want the kind of issue where two people who both accept the formalism can disagree about what the case even is. Specific enough that I can drop it on the group and have them go at it for half an hour. Skip the reading list, I've read the obvious things.

  Format: one JSON object, no preamble, fields exactly these:

  - issue — short name for the conceptual issue, under 10 words
  - claim — one sentence stating it
  - case_hook — 2-3 sentences on which part of the co-op setup instantiates it
  - pulling_apart — the two or three notions the literature runs together, and how the case separates them
  - hidden_assumption — the assumption in the standard model that papers over the issue
  - observable_difference — what you'd have to observe to tell the competing readings apart, or "none, they're observationally equivalent" if thats the honest answer
  - verdict — which reading you'd defend, 1-2 sentences
  - steelman — the best case that this is a modelling detail and not a real conceptual issue
  - confidence — 0 to 1 that it's a genuine conceptual issue
