  I'm in a reading group thats doing rational herding this term and I want to bring something that isn't just the usual Banerjee / Bikhchandani-Hirshleifer-Welch stuff everyone's already read. Here's a case I've been chewing on — I want the conceptual issue in it, not a simulation.

