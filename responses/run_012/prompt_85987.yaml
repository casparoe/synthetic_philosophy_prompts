answer: |-
  **Binding the Future Self: Sovereignty, Competence, and the Asymmetry of Precommitment**

  The philosophical problem of self-binding, often illustrated by Ulysses tying himself to the mast, arises when an agent anticipates a future failure of will and seeks to constrain their future options. In contemporary legal and institutional practice, this abstract puzzle materializes in two distinct regimes: centralized gambling self-exclusion schemes and psychiatric advance directives (PADs). Both authorize a past, competent self to constrain a future, compromised self. Yet they diverge sharply in their operation. Gambling exclusion is a one-way ratchet: the past decision to exclude is binding and often irrevocable for a fixed period, enforced by third parties against the present self's desires. Psychiatric directives are asymmetrical: a past refusal of treatment binds the future self, but a past request for treatment generally does not bind clinicians to admit or treat a currently resisting patient.

  Treating these practices as a single object of analysis reveals that they are not merely administrative tools but embody a specific, contentious metaphysics of the person and a distinctive theory of autonomy. To understand them is to answer who we are over time, when our will is sovereign, and what authority the state holds over our internal conflicts. This essay argues that both practices presuppose a **Hierarchy of Competence** model rather than a simple preference-aggregation model. They are philosophically defensible only if we accept that autonomy is a structural capacity that can be temporarily lost, and that the state's role is to protect the integrity of that capacity rather than to satisfy the occurrent desires of the moment. The asymmetry between the practices is not an artifact of legal categorization but a necessary consequence of the distinction between negative and positive liberty in the context of bodily integrity.

  ### I. The Metaphysics of the Divided Self

  The first philosophical commitment required by both practices is a rejection of the "time-slice" view of the person, which holds that every temporal instance of a self has equal claim to authority. If every time-slice were sovereign, self-binding would be impossible; the present self could always override the past self. Instead, these practices presuppose a **Two-Tier Theory of the Will**. They distinguish between an *authoritative self* (the registering gambler, the competent patient) and a *subordinate self* (the addicted gambler, the incapacitated patient).

  The challenge, as noted in the literature, is circularity: How do we identify the authoritative self without simply defining it as "the one whose choice we enforce"? If we say the registering self is authoritative because it chose exclusion, we beg the question against the gambling self who chooses to play. To avoid this, the practices must rely on a **procedural criterion of competence** rather than a substantive one. The authoritative self is not identified by *what* it chooses (abstinence vs. gambling), but by the *structural integrity* of its deliberative machinery.

  In the gambling case, the scheme presupposes that addiction constitutes a pathology of the will that degrades the capacity for rational choice. The registering self is deemed authoritative not because abstinence is objectively better, but because the registration occurs in a state of "sober reflection," whereas the gambling state is characterized by compulsion. Similarly, PADs rely on a distinction between competence and incapacity. The philosophical commitment here is that autonomy is a capacity that can be incapacitated by internal states (psychosis, mania, addiction) just as by external coercion.

  However, the practices differ in how they verify this status. Gambling schemes often operate on a "status-based" presumption: once registered, you are presumed to be in the "subordinate" category for the duration of the ban, regardless of your current protests. PADs are "capacity-based": the directive only triggers if the current self is adjudicated incapacitated. This suggests the gambling scheme presupposes a more pessimistic theory of recovery—it assumes the "addicted self" cannot reliably self-report its own sobriety, whereas psychiatric law allows for the possibility that the "ill self" may regain competence and revoke the directive. Both, however, commit to the view that the *authentic self* is the one possessing intact deliberative capacities, even if that self is temporally past.

  ### II. Self-Legislation or State Enforcement?

  Is this binding a form of self-legislation or a state-enforced contract? A private contract model fails because there is no second party to whom a duty is owed in the gambling case (the operator is an enforcer, not a beneficiary), and in the psychiatric case, the "breach" is a harm to oneself, not a counterparty. If this were merely a private contract, the state's enforcement would be an impermissible intrusion into self-regarding conduct.

  Instead, the practices presuppose a **Delegation of Police Power**. By registering for exclusion or signing a directive, the individual is not merely making a promise; they are altering their own legal status. They are granting the state and its licensees the jurisdiction to treat their future actions as *trespass* or *incompetent* acts. In the gambling case, the registrant who gambles is not merely breaking a promise; they are violating a regulatory condition of their own legal capacity to contract with operators. In the psychiatric case, the directive alters the default legal presumption of consent.

  This requires a controversial commitment: that an individual can voluntarily diminish their own future legal sovereignty. This is coherent only if we view autonomy not as the freedom to do whatever one wants at time *t*, but as the **power to set the rules of engagement for one's own life**. The validity of this "contract" against oneself rests on the state's interest in supporting the agency of the competent self against the depredations of the incapacitated self. The state is not a neutral arbiter here; it is an active participant in the internal governance of the citizen. This is defensible only if the state accepts a **Paternalism of Competence**: it is permissible to be paternalistic toward the incapacitated self in order to honor the autonomy of the competent self.

  ### III. Rationality and Time-Slice Neutrality

  Both practices explicitly reject time-slice neutrality. They hold that preferences are ranked by their origin (calm/competent vs. aroused/incapacitated) rather than solely by their content or intensity. This commits the practices to a **Hierarchical Theory of Rationality**. A preference formed under duress, addiction, or psychosis is accorded less weight than a preference formed under conditions of reflective equilibrium.

  This raises the question of whether this view begs the question against the present self. If the present self passionately desires to gamble or refuses treatment, why is that desire deemed "irrational" simply because it conflicts with the past? The justification lies in the **stability of the life plan**. The practices presuppose that rationality involves coherence over time. The addicted or psychotic self is viewed as a "hostile takeover" of the agent's long-term interests.

  However, there is underdetermination here. A utilitarian could support these schemes based on long-term welfare maximization without accepting the metaphysical split in the self. A Kantian could support them as preserving rational agency. But the *institutional design*—specifically the irrevocability of gambling bans—suggests a stronger commitment. It implies that the "subordinate self" lacks the standing to even *argue* for revocation. This goes beyond welfare; it is a claim about **standing**. The gambling scheme asserts that the addicted will is not just mistaken, but *disqualified* from participation in the decision. This is a robust, non-consequentialist claim about the nature of agency: you cannot exercise autonomy using tools that destroy autonomy.

  ### IV. The Asymmetry: Refusal vs. Demand

  The most philosophically charged divergence is the asymmetry within psychiatric directives (refusal binds, demand does not) compared to the gambling scheme (exclusion binds). In gambling, the past self binds the present self to *refrain*. In psychiatry, the past self binds the present self to *refrain* (from treatment), but cannot bind the present self to *accept*. Why can I force my future self to be left alone, but not force my future self to be helped?

  This asymmetry is defensible, but not merely on legal grounds of dangerousness. It rests on the **Normative Weight of Negative vs. Positive Liberty** regarding bodily integrity.
  1.  **Negative Binding (Refusal/Exclusion):** This protects the boundary of the self. Enforcing a refusal of treatment or a gambling ban respects the sovereign decision to keep the world (or drugs, or scalpels) out. It requires only inaction from the enforcer (stop the transaction, stop the injection).
  2.  **Positive Binding (Demand for Treatment):** This requires intrusion. Enforcing a past request for treatment against a present refusal requires the state to physically invade the body of a resisting person.

  To make psychiatric requests enforceable (Option A) would be to claim that the past self owns the future body absolutely. But if the present self is resisting, enforcing treatment turns the person into a mere vessel for their past wishes, violating the **current embodied agency**. Even if the current self is incapacitated, the act of forced treatment carries a high risk of trauma and violates the presumption that bodily integrity is protected in the *present*.

  Conversely, to make gambling registrations revocable on demand (Option B) would defeat the purpose of the scheme. Addiction specifically targets the mechanism of revocation. If one could un-exclude oneself at will, the "subordinate self" would always undo the work of the "authoritative self."

  Therefore, the asymmetry is philosophically necessary. We can enforce the "Stop" command because it aligns with the liberal principle of non-intrusion. We cannot enforce the "Go" command because it requires active coercion of the body, which demands a higher threshold (typically imminent danger) than mere past consent. The gambling case aligns with the "Stop" command; there is no "Gambling Inclusion" directive. Thus, the practices are consistent: the state enforces the *protective* bind (abstinence/refusal) but hesitates to enforce the *intrusive* bind (treatment/gambling).

  ### V. The Constitutional Analogy

  Does this structure map onto constitutional precommitment? In constitutional theory, a "supermajority" at Time 1 binds a simple majority at Time 2 through entrenchment clauses. This is often justified using the same Ulysses metaphor: the "sober" founding moment binds the "passionate" future moments.

  The analogy holds regarding the **Hierarchy of Competence**. Just as the gambling registrant is deemed more authoritative than the addicted gambler, the Constitutional Founders are often deemed more authoritative than the transient legislative majority. The Constitution represents the "long-term will" of the polity, while ordinary legislation represents the "occurrent desire."

  However, the analogy breaks down regarding the **Metaphysics of the Self**. A polity does not have a psyche. There is no "collective unconscious" or "collective addiction" in the literal sense. The "authenticity" of the constitutional moment is a legal fiction, not a psychological fact.
  *   **If the analogy holds:** It implies that constitutional entrenchment is legitimate only insofar as it protects the *procedural conditions* of democracy (the "competence" of the polity) against temporary passions that would destroy them (e.g., abolishing elections). It justifies rights that prevent the "present self" from enslaving the "future self."
  *   **If the analogy fails:** It highlights that individual self-binding rests on a factual claim about mental capacity (addiction/psychosis) that has no collective equivalent. This implies that individual Ulysses contracts are *more* defensible than constitutional entrenchment, because we have clinical criteria for individual incapacity, whereas "political incapacity" is merely a disagreement about values.

  The implication for the individual case is crucial. If the constitutional analogy fails, the individual practices must stand on their own empirical footing: we must be sure the "incapacity" is real, not just a difference of opinion. This reinforces the need for the procedural criteria of competence discussed in Section I. We cannot bind the future self merely because the past self was wiser; we bind them because the present self is *broken*.

  ### Conclusion

  The practices of gambling self-exclusion and psychiatric advance directives are not merely legal conveniences; they are institutionalizations of a **Two-Tier Theory of Autonomy**. They require us to accept that the self is not a unity, that some temporal slices of the self possess more sovereignty than others, and that the state may legitimately intervene to enforce the will of the competent self against the incapacitated self.

  The philosophical commitments they strictly *need* are:
  1.  **Procedural Competence:** Authority is determined by the capacity for reflection, not the content of the choice.
  2.  **Delegated Jurisdiction:** The individual can grant the state authority to override their future protests.
  3.  **Negative Priority:** The state is more justified in enforcing constraints on action (refusal/abstinence) than mandates for action (treatment).

  The asymmetry between the practices is defensible. Making psychiatric requests enforceable would violate current bodily integrity; making gambling bans revocable would surrender to the pathology they aim to curb. The practices are underdetermined regarding *which* theory of the good life they promote (utilitarian or deontological), but they are genuinely committed to the view that **autonomy is a capacity to be protected, not just a desire to be satisfied.**

  Ultimately, these schemes suggest that true freedom is not the absence of constraint, but the presence of the right constraints. By allowing the past self to bind the future self, the law acknowledges that we are not always the best guardians of our own agency, and that sometimes, to be free, we must be bound.
