answer: |-
  These arrangements presuppose a functionalist division of democratic labor where electoral authorization is required for allocating collective resources, peer judgment is sufficient for adjudicating individual rights, and unitary power requires stricter constraints than collective deliberation.

  Regarding the asymmetry between juries and tax-setting, the practice strictly presupposes that **political competence is domain-specific**: ordinary citizens possess the universal moral capacity to judge fairness and facts regarding past events (guilt), but lack the mandate or technical capacity to negotiate trade-offs regarding future resources (taxes). This rules out radical egalitarianism, which would grant random bodies full fiscal sovereignty, and technocratic elitism, which would deny citizens even judicial power. However, the practice is philosophically underdetermined regarding *why* the distinction exists: it is unclear whether the bar for tax-setting is higher due to epistemic complexity (citizens *cannot* understand budgets) or due to accountability requirements (citizens *should not* spend money they cannot be voted out for). The practice merely fits well with a preference for protecting property rights from popular whim, but does not strictly require it.

  Regarding the subordination of citizens' assemblies to elected bodies, the practice strictly presupposes that **legitimacy derives from authorization rather than descriptive representation**. By convening and receiving reports from random bodies, elected officials treat sortition as a source of wisdom or information rather than sovereign will. This rules out demarchy, the theory that random selection is the only truly democratic method of selection. The practice is underdetermined on whether the elected body's superiority rests on explicit consent (voters chose them) or retrospective responsibility (voters can fire them). It merely fits well with a liberal distrust of direct democracy, but strictly requires only that final coercive power remain accountable to an electoral mechanism.

  Regarding term limits for executives but not legislators, the practice strictly presupposes that **the danger of power lies in its unity rather than its duration**. It assumes a single executive can entrench a faction or become monarchical in a way a collective legislature cannot, implying that careerism is beneficial for legislative expertise but dangerous for executive command. This rules out the theory that incumbency is inherently corrupting regardless of office structure. It is underdetermined whether the limit aims to prevent tyranny or simply to rotate access to prestige; it merely fits well with anti-personalist sentiments without requiring them.

  The conflict across these practices arises between the trust in random citizens' judgment in juries (Puzzle 1) and the distrust of their legitimacy in assemblies (Puzzle 2), alongside the tolerance for career legislators (Puzzle 3) despite the anti-careerist logic of sortition. A coherent defender of all three practices must give up the presupposition that **sortition confers political legitimacy comparable to elections**. To maintain coherence, one must admit that the jury's power is not an exercise of sovereignty but a procedural right of the accused to peer judgment, whereas policy-making requires electoral accountability. The presupposition doing the most work is **electoral accountability as the sole source of binding coercive power over resources**.

  If the institutional arrangement were rebuilt strictly on this dominant presupposition, citizens' assemblies would be formally codified as advisory bodies with no pathway to binding referendums, eliminating ambiguity about their sovereignty. Juries would be restricted strictly to fact-finding and application of existing law, explicitly barred from nullification or sentencing discretion that amounts to policy-making. Term limits would remain on executives to check unitary agency, while legislators would retain unlimited tenure to maximize institutional memory and accountability continuity, clarifying that careerism is a feature of the legislature, not a bug.
