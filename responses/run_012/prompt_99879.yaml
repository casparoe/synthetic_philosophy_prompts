  The chalkboard hung between them, a slate of grey silence broken only by the white numerals.

  **KAEL: 0.82**
  **SENNA: 0.31**

  Elara sat at the arbitrator's desk, her pen hovering over the logbook. The Concordance Office was quiet, save for the hum of the ventilation and the soft scratch of Kael shifting in his chair. They had been at it for four hours. The air smelled of dust and dry-erase markers.

  "Update," Elara said. Her voice sounded too loud in the room.

  Kael didn't look at Senna. He looked at the ledger of soil samples spread before him. "I have reviewed Senna's data regarding the sediment composition. I have incorporated it into my calculation. My posterior is 0.79."

  Elara wrote it down. *0.79.* A shift. Good. The theorem demanded a shift. If they were truly Bayesian, truly sharing a prior, the gap had to close. It was a mathematical gravity.

  "Senna?"

  Senna traced the rim of her water glass. She was younger than Kael, her hands cleaner, her clothes sharper. She looked at the board, then at Kael. "I have reviewed Kael's testimony regarding the historical flood levels. I have incorporated it. My posterior is 0.34."

  Elara wrote *0.34*.

  The gap had narrowed by six percentage points in four hours. At this rate, they would converge sometime next Tuesday. But the Concordance Office rules were strict: no ruling until the difference was zero. Or effectively zero. But "effectively" was a human term, not a mathematical one.

  "State the evidence driving the update," Elara said. It was the standard prompt. Force the information partitions to overlap. Make the private public.

  Kael tapped the soil ledger. "The sediment shows high saturation. But the question is not saturation. The question is: *Was the collapse preventable?*" He looked at Elara. "Given the town's resources, and the knowledge available at the time of construction. My probability reflects the failure to reinforce the western abutment."

  Senna nodded slowly. "I agree the western abutment was the failure point. But my probability reflects the decision to build on that soil at all. Given the regional geological surveys available five years ago."

  Elara paused. Her pen hovered.

  "Clarify," Elara said. "The disputed question on the docket is: *'Was the collapse preventable?'* Event $E$. You are both assigning probabilities to $E$."

  "Yes," Kael said.

  "Yes," Senna said.

  "Kael," Elara said. "If the town had spent double the budget, could it have been prevented?"

  Kael blinked. "That's... hypothetical. The budget was fixed by the Council. The preventability must be assessed within the actual constraints. If you ask if it was *physically* possible, yes. If you ask if it was *practically* possible given the mandate, no. My probability is about the mandate."

  Elara turned to Senna. "And you?"

  "The mandate was the error," Senna said. "The preventability includes the decision to accept the mandate. If the question is 'Could the town have avoided this loss?', then yes. My probability is about the loss."

  Elara looked at the board.
  **KAEL: 0.79**
  **SENNA: 0.34**

  They were using the same words. *Preventable.* *Collapse.* *Town.* They were using the Official Prior distributed by the Office, the same booklet of base rates for structural failure and civic liability. They were exchanging their evidence logs, reading the numbers aloud, logging the updates. They were being scrupulously honest. They were being perfectly rational.

  But they were not calculating the same number.

  Elara remembered her training. *Common Priors. Common Knowledge. Bayes Rule.* The theorem held like a law of physics, provided the universe was flat. But the universe of the Concordance Office was built on the assumption that when two people pointed at a word, they pointed at the same thing.

  "Kael," Elara said softly. "When you say 'preventable', do you mean 'executable within the approved budget'?"

  "I mean 'consistent with the duty of care'," Kael said. "The duty is defined by our history. By what we have always done."

  "Senna," Elara said. "When you say 'preventable', do you mean 'avoidable in principle'?"

  "I mean 'consistent with safety'", Senna said. "Safety is defined by the physics. By what the ground demands."

  Elara put the pen down.

  The numbers on the board were not converging because they were not measurements of the same event. They were measurements of two different worlds. Kael lived in a world where the Town's constraints were laws of nature, as immutable as gravity. Senna lived in a world where the Town's constraints were variables, subject to optimization.

  They had the same Official Prior booklet. But a prior is not just a document; it is a weighting of what matters. Kael weighted *tradition* as a constant. Senna weighted *safety* as a constant. The Official Prior tried to average them, but in the quiet of their own minds, where the updating actually happened, they had reverted to their own metrics.

  The theorem required a common prior. It required that they start from the same place. But they had started from different generations. Kael remembered the town before the surveys, when building was an act of faith. Senna remembered only the data, where building was an act of engineering.

  "Arbiter?" Kael asked. "Shall we proceed to the next iteration? I have a report on the concrete mixture."

  "If I review the mixture," Senna said, "I will adjust to 0.36. But Kael will not move below 0.75."

  "Why not?" Elara asked.

  "Because," Kael said, "the mixture does not change the budget."

  "And," Senna said, "the budget does not change the physics."

  Elara looked at the chalkboard. The white numerals stood stark against the grey. 0.79. 0.34. They were not disagreeing about the math. They were disagreeing about the territory the math was supposed to map.

  The procedure demanded she wait for convergence. The theorem said it *must* happen. But the theorem assumed that "Preventable" was a well-defined event in the sample space of the universe. It assumed that $E_{Kael} = E_{Senna}$.

  It wasn't.

  Elara closed the logbook. The sound was final.

  "We are adjourning," she said.

  Kael straightened. "But we haven't converged. The Office cannot rule."

  "There will be no ruling," Elara said. She stood up. Her legs felt stiff. "There is no disagreement to resolve."

  Senna frowned. "There is a collapsed bridge."

  "There is a bridge," Elara said. "And there are two questions. One of you is asking if the bridge was built correctly according to the rules. The other is asking if the rules were correct for the bridge."

  She walked to the board and picked up the eraser. She didn't wipe the numbers away immediately. She just held the felt against the slate.

  "The Concordance procedure requires a common event," Elara said. "You do not have one."

  "Then what do we do?" Kael asked. His voice was tight. He wanted the comfort of the number. He wanted the math to tell him he was right, so he could sleep.

  "You go home," Elara said. "And you decide if you are living in the same town."

  She erased the numbers. The grey dust swirled in the ventilation light, settling on the desk, on their hands, on the Official Prior booklet that lay closed between them. The board was blank. The gap remained, but now it was on the table, not hidden behind the decimals.

  Kael looked at the empty board. Senna looked at her hands. Neither moved to leave. They sat in the silence of the office, where the math had run out, and the living had to begin.
