answer: |-
  The phenomenon you have identified is the **Reference Measure Ambiguity** (sometimes called the **Problem of Measure Specification**) arising from the **Failure of the Principle of Indifference under Reparameterization**.

  While you are correct that "no prior is uninformative" is the slogan often pasted over this wound, it does not describe the anatomy of the injury. The mathematical engine driving these disputes is the **Jacobian of the transformation** between parameterizations, and the philosophical engine is the **Principle of Transformation Groups**.

  Here is the carving you requested: the distinction between the cases that resolve and those that do not, the specific role of symmetry, and how this differs from standard background information dependence.

  ### 1. The Mathematical Core: Measure vs. Density
  The fundamental error in the disputes you describe is the conflation of a *probability density* with a *probability measure*.

  In continuous probability, a uniform distribution is not an intrinsic property of a variable; it is a relationship between a density function and a reference measure. If $X$ is uniform on $[0,1]$, we mean $dP = 1 \cdot dx$. If $Y = X^3$ (volume), then $dP = 1 \cdot dx = 1 \cdot \frac{dx}{dy} dy = \frac{1}{3}y^{-2/3} dy$. $Y$ is not uniform.

  The dispute arises because the agents are implicitly selecting different **reference measures** ($\mu$) on the same sample space $\Omega$.
  *   Agent A chooses $\mu_A$ such that side length $L$ has constant density.
  *   Agent B chooses $\mu_B$ such that volume $V$ has constant density.
  *   Since $\mu_A \neq \mu_B$, they are technically answering different questions, despite using the same words ("random cube").

  This is not merely "background information" in the standard Bayesian sense ($P(H|D, I)$). Background information typically selects a likelihood or updates a prior. Here, the disagreement is about the **dominating measure** itself. It is a disagreement about the geometry of the possibility space, not the weight of evidence within it.

  ### 2. The Resolution Mechanism: Group Invariance
  You asked what distinguishes the disputes that can be settled from those that end in a shrug. The dividing line is **Problem Well-Posedness via Group Transitivity**.

  This body of work is most rigorously developed in E.T. Jaynes' **Principle of Transformation Groups** (building on von Mises and Kolmogorov). The logic is as follows:
  1.  A probability assignment is "objective" (or uniquely determined) only if it is invariant under the symmetry group $G$ dictated by the **physical generative process**.
  2.  If $G$ acts **transitively** on the sample space, there exists a unique (up to a scaling factor) **Haar measure** invariant under $G$.
  3.  If the problem statement specifies a physical process that fixes $G$, the Haar measure is the unique solution. The dispute is resolved.
  4.  If the problem statement is purely abstract (geometry without physics), $G$ is underdetermined. Multiple groups are compatible with the description. The dispute is ill-posed.

  #### Case A: The Resolvable Dispute (The "Rescue")
  Consider a variation of your cube machine. Suppose the machine is described not just as "making cubes," but as "injecting material into a mold where the pressure fluctuates uniformly."
  *   This physical description implies a specific causal mechanism.
  *   If the mechanism implies that the *linear* expansion is the direct result of the uniform fluctuation, side-length is the invariant parameter.
  *   If the mechanism implies *volumetric* filling is the direct result, volume is the invariant parameter.
  *   **The Rescue:** If we add the constraint that the answer must not depend on the *units* of measurement (scale invariance) AND the *origin* of measurement (translation invariance), we restrict the allowable group $G$.
  *   In many physical contexts (e.g., statistical mechanics), the requirement of invariance under the Hamiltonian flow or specific thermodynamic transformations selects a unique measure (Liouville measure).

  When someone produces a consideration like "the answer ought not to change when rescaled," they are attempting to enlarge the symmetry group $G$. If the enlarged group admits only one Haar measure, the ambiguity vanishes.

  #### Case B: The Unresolvable Dispute (The "Shrug")
  This is the case of the **Cube Paradox** (as you described it) and the standard presentation of **Bertrand's Paradox**.
  *   **The Cube:** If the machine is a "black box" with no specified mechanism, there is no physical reason to prefer length, area, or volume as the invariant quantity. Scale invariance alone is not enough to distinguish $L$ from $L^3$ without knowing *what* is being scaled by the process.
  *   **The Chord:** You noted that rotational symmetry is useless because all three solutions are rotationally invariant. You are exactly right. Rotation is a symmetry of the *circle*, but not necessarily of the *process generating the chord*.
      *   **Method 1 (Random Endpoints):** Invariant under rotation, but not under translation of the chord's midpoint.
      *   **Method 2 (Random Radius):** Invariant under rotation and translation of the chord parallel to itself.
      *   **Method 3 (Random Midpoint):** Invariant under rotation and translation of the center.
      *   **Jaynes' Solution:** Jaynes argued that if we treat the problem as "throwing straws from a great distance," the process must be invariant under **translation and scaling of the line** in the plane, not just rotation of the circle. This specific group (the affine group of the line) admits a unique Haar measure. This selects the "random radius" solution ($p=1/2$).
      *   **The Shrug:** However, if the problem is posed purely geometrically ("Consider the set of all chords..."), there is no "throwing straws" physical constraint. The set of chords can be parameterized by endpoints, midpoints, or slopes. Without a physical process to fix the group $G$, the Haar measure is not unique. The problem is **ill-posed**.

  ### 3. The Boundary: Physical Process vs. Mathematical Abstraction
  The boundary you are looking for lies between **Epistemic Indifference** and **Physical Symmetry**.

  *   **Epistemic Indifference (The Shrug):** "I have no reason to prefer $X$ over $Y$." This is a statement about the agent's mind. It leads to Reference Measure Ambiguity because the agent's ignorance does not constrain the mathematics. This yields the "unresolvable" cases.
  *   **Physical Symmetry (The Rescue):** "The mechanism producing $X$ is physically indistinguishable from the mechanism producing $Y$ under transformation $T$." This is a statement about the world. It constrains the measure via the Haar measure of the symmetry group. This yields the "resolvable" cases.

  The "shrug" occurs when the problem is stated in a way that allows multiple, non-isomorphic symmetry groups to claim validity. The "resolution" occurs when additional constraints (scale invariance, physical generative story) eliminate all but one group.

  ### 4. Proposed Terminology and Definition
  Since you asked for a term if none exists: The established literature refers to this as **The Problem of the Priors** or **Non-informative Prior Paradoxes**, but these are too broad. The specific phenomenon of the measure depending on the parameterization is best termed:

  **Invariant Measure Underdetermination**

  **Definition:** A probability problem exhibits *Invariant Measure Underdetermination* when:
  1.  The sample space $\Omega$ admits multiple valid parameterizations $\{\theta_i\}$.
  2.  The Principle of Indifference applied to distinct $\theta_i$ yields mutually singular probability measures.
  3.  The problem statement fails to specify a transformation group $G$ acting on $\Omega$ that is transitive and physically mandated, which would otherwise select a unique Haar measure.

  **Classification:**
  *   **Type I (Resolvable):** The physical context implies a unique symmetry group $G$. (e.g., "A gas molecule in a box" $\to$ Translation/Rotation invariance $\to$ Uniform spatial measure).
  *   **Type II (Unresolvable):** The context is abstract or compatible with multiple groups. (e.g., "A random chord" without a throwing mechanism).

  ### 5. Summary of the Distinction
  To answer your specific questions directly:

  1.  **What exactly is the phenomenon?**
      It is the dependence of the dominating measure $\mu$ on the choice of coordinate chart, absent a constraint from a transformation group.
  2.  **What distinguishes resolvable from unresolvable disputes?**
      **Well-Posedness.** Resolvable disputes have a physical or logical constraint that fixes the symmetry group $G$ (making the Haar measure unique). Unresolvable disputes lack this constraint, leaving the group $G$ underdetermined.
  3.  **Where is the boundary with background information?**
      Background information ($I$) selects a density $p(\theta|I)$ relative to a *fixed* measure $\mu$. This phenomenon is a disagreement about $\mu$ itself. It is prior to conditioning; it is the definition of the space of possibilities, not the weighting of them.
  4.  **Why did rotation fail in the Chord case?**
      Because rotation is a subgroup of the full symmetry group of the experiment. All three standard solutions respect the circle's rotation symmetry. To distinguish them, one must invoke symmetries of the *line* generating the chord (translation, scaling), which not all solutions respect. If the problem does not specify how the line is generated, those symmetries cannot be invoked, and the problem remains ill-posed.

  ### Recommended Reading for the "Carving"
  To deepen this specific distinction, you should look beyond the standard "Bertrand's Paradox" discussions to:
  *   **Jaynes, E. T. (1973).** "The Well-Posed Problem." *Foundations of Physics*. (This is the definitive text on using transformation groups to resolve the chord paradox).
  *   **Van Fraassen, B. C. (1989).** *Laws and Symmetry*. (For the philosophical argument on why symmetry alone may not compel belief).
  *   **Kass, R. E., & Wasserman, L. (1996).** "The Selection of Prior Distributions by Formal Rules." *Journal of the American Statistical Association*. (For the statistical treatment of reference priors and Jeffreys priors, which attempt to solve this via Fisher Information geometry).

  The "moral" is not that priors are subjective, but that **probability is a physical quantity** in continuous spaces; it requires a physical definition of the measure, just as length requires a definition of the metric. Without that definition, the question is literally meaningless.
