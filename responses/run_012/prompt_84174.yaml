          *   Context: Hiring decision.
          *   Implicature: The current candidate does not have a strong enough record; I am not satisfied.
          *   The "but I'll support..." clause: Attempts to mitigate the face threat, but doesn't cancel the negative assessment of the candidate.
      *   **The Colleague's Defense:** "Implicatures are cancelable... I can take back the implication whenever I want." This is a misunderstanding of the linguistic concept. Cancelability is about *potential* cancellation at the time of utterance, not *retroactive* revision after consequences occur.
