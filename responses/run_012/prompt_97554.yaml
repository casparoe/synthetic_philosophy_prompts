          *   **Dennett:** No. Dennett rejects the distinction *as Searle draws it*. For Dennett, *all* intentionality is derived (from the stance of the interpreter). There is no "original" intrinsic intentionality in Searle's sense. He thinks the distinction is a myth.
          *   **Verdict:** False. They disagree on the *existence* of the distinction, not just the boundary.

      *   *Sentence 2:* "Searle says brains have the original stuff, while words, pictures and machines only have borrowed, observer-relative intentionality."
