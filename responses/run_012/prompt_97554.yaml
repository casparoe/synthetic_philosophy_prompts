          *   **"Dennett wins":** This is a normative claim, not a descriptive one. Philosophy doesn't have "winners" in that sense. The argument that original intentionality is "spooky" is Dennett's *argument*, not an established fact that settles the debate. Many still side with Searle (or others like Horgan, Tienson, etc.).
