              1.  Map the episode onto the paradox (underdetermination of "polyhedron" vs. "plus").
              2.  Test the skeptical solution (communal agreement vs. legislation to save a result).
              3.  Turn it around (the topological generalization and whether it vindicates or challenges the solution).
