answer: |-
  # Lesson Plan: The Ergodicity Trap
  **Course:** Undergraduate Seminar on Decision Theory  
  **Duration:** 90 Minutes  
  **Class Size:** 20 Students  
  **Topic:** Expected Value vs. Geometric Growth (Kelly Criterion & Non-Ergodicity)

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  1.  Distinguish between **Arithmetic Mean** (Expected Wealth) and **Geometric Mean** (Typical Wealth Path).
  2.  Explain **Non-Ergodicity**: why the average outcome across a group (ensemble) differs from the average outcome over time for an individual.
  3.  Derive the **Kelly Criterion** (20% bet size) as the maximizer of expected log-wealth.
  4.  Critique the game's limitations regarding utility functions and parameter uncertainty.

  ## 2. Preparation & Materials
  *   **Room:** Seminar style with projector.
  *   **Tech:** A shared Google Sheet (or Excel projected) with 20 rows (one per student) and columns for Round 1–30.
      *   *Formulas:* Pre-program the sheet to calculate the Class Mean and Median automatically after each column is filled.
      *   *Access:* Send a "View Only" link to the projector and an "Edit" link to students' devices before class.
  *   **Coin:** A large physical coin or a verified random number generator projected on screen (set to $P(H)=0.6$).
  *   **Handout:** A one-page "Bankroll Tracker" for students who prefer paper, with columns for *Start Wealth*, *Bet Fraction ($f$)*, *Outcome*, *End Wealth*.
  *   **Calculator:** Encourage students to have a phone calculator ready.

  ## 3. Minute-by-Minute Schedule

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Rules** | Explain mechanics, utility, and the "Shared Coin." |
  | **10–60** | **The Game (30 Rounds)** | Strict 1.5 mins per round. Input wealth live. |
  | **60–65** | **Data Freeze & Viz** | Project final Mean vs. Median. |
  | **65–85** | **Debrief & Theory** | Arithmetic vs. Geometric, Kelly, Non-Ergodicity. |
  | **85–90** | **Limitations & Close** | Utility, Unknown Bias, Asymmetry. |

  ---

  ## 4. Game Rules (Facilitator Script)

  **The Setup:**
  "Welcome. You are all hedge fund managers. You start with **1,000 points**. We will run 30 rounds of trading. In each round, I flip a shared coin. The probability of Heads is **0.6**. Tails is **0.4**."

  **The Bet:**
  "Before each flip, you must choose a fraction $f$ of your *current* bankroll to stake. $f$ can be anywhere from 0.0 to 1.0. You can change this fraction every round."

  **The Payoff:**
  *   **Heads:** Your stake doubles and is returned. (Net gain = +100% of stake).
      *   *Math:* $\text{New Wealth} = \text{Old Wealth} \times (1 + f)$
  *   **Tails:** You forfeit the stake. (Net loss = -100% of stake).
      *   *Math:* $\text{New Wealth} = \text{Old Wealth} \times (1 - f)$
  *   **Bankruptcy:** If your wealth drops below 1 point, you are out.

  **The Goal:**
  "There is no prize for the highest score. The goal is to survive 30 rounds with as much wealth as possible. However, I will be tracking the **Room Mean** and **Room Median** wealth after every flip on the scoreboard."

  **Data Entry Protocol:**
  "After every flip, you have 30 seconds to update your current wealth in the shared spreadsheet. If you are slow, you miss the next bet."

  ---

  ## 5. The Debrief (Board Work & Discussion)

  ### Phase 1: The Observation (5 Mins)
  Project the final row of the spreadsheet.
  *   **Likely Outcome:** The **Mean** wealth will be astronomical (e.g., 50,000+). The **Median** wealth will be near zero (e.g., <100).
  *   **Ask:** "Who ended with more than 10,000 points?" (Likely 1 or 2 students). "Who ended with less than 1,000 points?" (Likely 15+ students).
  *   **Point:** "The 'average' student (Mean) is rich. The 'typical' student (Median) is broke. How is this possible?"

  ### Phase 2: Arithmetic vs. Geometric (10 Mins)
  Draw two curves on the board.
  1.  **Expected Wealth (Arithmetic):**
      $$E[W_{t+1}] = W_t \times [0.6(1+f) + 0.4(1-f)] = W_t \times (1 + 0.2f)$$
      *   To maximize this, set $f = 1$ (All-In).
      *   Expected growth per round: 20%.
      *   *Explanation:* This is the **Ensemble Average**. If you cloned yourself into a million parallel universes, the average wealth of your clones grows at 20% per round.
  2.  **Typical Wealth (Geometric):**
      $$\text{Growth Rate} = \exp\left(0.6 \ln(1+f) + 0.4 \ln(1-f)\right)$$
      *   This represents the **Time Average**. This is *your* specific path through time.
      *   If $f=1$, one Tail wipes you out ($\ln(0) = -\infty$).
      *   *Explanation:* In a sequential game, you cannot average out a ruin event. Once you hit zero, you stop.

  ### Phase 3: Non-Ergodicity (5 Mins)
  *   **Definition:** A system is **ergodic** if the time average equals the ensemble average.
  *   **The Trap:** This game is **non-ergodic**.
      *   *Ensemble:* The Mean Wealth on the scoreboard (driven by the lucky all-in survivors).
      *   *Time:* Your personal bankroll path (driven by the compounding of wins/losses).
  *   **Takeaway:** "Maximizing Expected Value (EV) is rational for a one-off bet across parallel universes. It is suicidal for a repeated bet through time."

  ### Phase 4: The Kelly Criterion (5 Mins)
  *   **Reveal:** "There is a fraction that maximizes the Geometric Growth Rate. It is called the **Kelly Criterion**."
  *   **Formula:** For even-money bets ($b=1$), $f^* = p - q$.
      *   $f^* = 0.6 - 0.4 = 0.2$ (20%).
  *   **Activity:** Ask the survivors (those with >1,000 points) what their average $f$ was.
      *   *Expected:* Most survivors hovered near 0.1 to 0.3. The all-in winners ($f=1$) are statistically negligible outliers who got lucky on the specific coin sequence.
  *   **Log Utility:** "Maximizing geometric growth is mathematically equivalent to maximizing **Expected Log Utility**. $U(W) = \ln(W)$."

  ---

  ## 6. Limitations & Closing (5 Mins)

  "Before you leave, we must acknowledge what this game *cannot* teach you."

  1.  **Utility Functions:** "We assumed you want to maximize wealth. But if you have **Linear Utility** ($U(W)=W$) and this is a **One-Shot Bet**, you *should* go All-In ($f=1$). Kelly is only optimal for *repeated* bets with *Log Utility*. If you need \$1M to save your life and you have \$500k, EV maximization might be the only rational choice, even if it risks ruin."
  2.  **Unknown Bias:** "In this game, you knew $p=0.6$. In reality, edge is unknown. When $p$ is uncertain, overbetting is punished far more severely than underbetting. The 'half-Kelly' strategy is often preferred in real markets to buffer against estimation error."
  3.  **Asymmetry of Ruin:** "Notice that betting 40% (2$\times$ Kelly) yields positive expected wealth but negative growth. Betting 100% yields high expected wealth but certain ruin. The penalty for overbetting is asymmetric; the cliff is steeper than the slope."

  **Final Thought:** "Decision theory isn't just about calculating expectations. It's about understanding the structure of the game: Are you playing once, or forever? Are you playing alone, or as part of an ensemble? That determines your strategy."

  ---

  ## 7. Troubleshooting: What Will Go Wrong

  ### 1. The Arithmetic Bottleneck (Timing)
  *   **Prediction:** 30 rounds of manual data entry for 20 students will lag. Students will take 2 minutes to calculate $1000 \times 1.2 \times 0.8...$, causing the 90-minute limit to burst.
  *   **Fix:**
      *   **Pre-Game:** Send the Google Sheet link 24 hours early. Require them to test access.
      *   **In-Class:** Project a "Countdown Timer" for each round (45 seconds to bet, 45 seconds to flip/enter).
      *   **Contingency:** If you pass Round 20 and are behind schedule, announce: "We are stopping at Round 25. The math holds."

  ### 2. The "Lucky Idiot" Dominance
  *   **Prediction:** One student goes All-In ($f=1$), hits 30 Heads (prob $\approx 0$ but possible with 20 people over many classes), and ends with 1 billion points. They claim EV maximization works.
  *   **Fix:**
      *   **Pre-empt:** In the debrief, calculate the probability of their survival ($0.6^{30}$).
      *   **Reframe:** "You didn't win because of strategy; you won because you survived a 1-in-5-million lottery. If we run this class again tomorrow, you will be broke. Kelly wins *tomorrow* too."

  ### 3. Calculation Errors
  *   **Prediction:** Students will mess up the compounding math (e.g., adding 20% of *original* bankroll instead of *current*).
  *   **Fix:**
      *   Provide a simple Excel template in the Sheet: `=Previous_Wealth * (1 + IF(Coin="H", Bet_Frac, -Bet_Frac))`.
      *   Allow them to use the sheet's formula rather than mental math.

  ### 4. Collusion/Peeking
  *   **Prediction:** Students look at neighbors' bets and copy the "smart" kids.
  *   **Fix:**
      *   Remind them: "This is a private decision. If everyone copies the Kelly bettor, the Median and Mean converge, and the lesson is lost. We need variance to see the Ergodicity gap."
      *   Make the bet entry column hidden from other students in the Google Sheet (protect range).

  ### 5. Boredom Fatigue
  *   **Prediction:** Rounds 15–30 feel repetitive. Engagement drops.
  *   **Fix:**
      *   **Mid-Game Check-in:** At Round 15, pause and ask: "Check the Median. Is it growing or shrinking?" This re-engages them with the data.
      *   **Speed:** Do not allow discussion between rounds. Keep the coin flipping rhythmic.

  ### 6. The "Zero" Problem
  *   **Prediction:** Students who go bust early (Rounds 3–5) disengage.
  *   **Fix:**
      *   Allow "Bankrupt" students to become "Auditors." Their job is to track the Mean/Median on the board and verify the Facilitator's math, keeping them involved in the data analysis even if they can't bet.
