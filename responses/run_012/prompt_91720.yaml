      *Refining the Super argument:* The super's argument is residence. The counter-argument is *conflict of interest*. In a strike, you are withholding revenue from the employer. The super cannot do this without firing themselves.

      *Refining the Displaced argument:* Their argument is labor/sweat equity. The counter-argument is leverage. They cannot withhold rent. Give them honor, not votes.

      *Refining the Household Vote:* Why not one person one vote? Because a strike is per lease. If 3 kids vote yes and 1 parent votes no, the leaseholder pays. The unit must agree.

