answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee & Building Campaign Members
  **FROM:** [Your Name], Steering Committee Chair
  **RE:** Recommendation on Voting Franchise for Thursday's Authorization Vote

  We are approaching a constitutive moment. The vote next Thursday is not just about a tactic; it defines who "we" are. If we draw the circle too wide, we dilute our leverage and invite legal challenges that could sink the strike. If we draw it too narrow, we fracture the solidarity required to win.

  After reviewing the proposals—the "Sleep Test," the "Exposure Test," and the various candidate lists—I am recommending a rule based on a single principle: **Capacity to Act.**

  To vote on a rent strike, you must have the legal and practical ability to withhold rent. To vote on a co-op buyout, you must have a residential stake in the building's future ownership. This is not about who is *affected* by our struggle, but who can *wield* the weapon of that struggle.

  **The Recommended Rule**

  1.  **Eligibility:** Voting rights are granted to every adult (18+) who currently resides in the building AND meets one of the following criteria:
      *   Is a named leaseholder; OR
      *   Is a verified subletter with at least six months of continuous residence; OR
      *   Is an adult child of a tenant with established succession rights or continuous residence of two+ years.
  2.  **Voting Weight:** **One Household, One Vote.**
      *   Each apartment unit casts one vote.
      *   The vote of the apartment is determined by a simple majority of the eligible voters within that unit.
  3.  **Exclusions:** The following groups are excluded from this specific ballot:
      *   The live-in superintendent.
      *   Commercial tenants (the laundromat).
      *   Former tenants currently living elsewhere (the displaced families).
      *   Residents of adjacent buildings (the next-door co-op).

  **The Logic of the Exclusions**

  We must be honest about why we are excluding people who care deeply about this campaign. Exclusion is not a judgment on their value; it is a recognition of their position in this specific conflict.

  *   **The Displaced Families:** The argument for including our comrades who were pushed out two years ago is moral, not tactical. They built this campaign. They suffered the earliest retaliation. To tell them they have no voice feels like a betrayal of the labor they invested.
      *   *Why they are out:* A rent strike works by stopping the flow of revenue. Displaced tenants cannot withhold rent they do not owe. Including them creates a class of voters with high moral stakes but zero economic leverage, which complicates the strike authorization.
      *   *Compromise:* I propose we grant them "Founding Member" status. They get non-voting seats on the Steering Committee and a guaranteed share of any surplus from the buyout, but they cannot vote on the strike itself.

  *   **The Next-Door Co-op & Laundromat:** The argument here is interdependence. The boiler room wall and the commercial lease are tangible links. If we win, their maintenance costs change.
      *   *Why they are out:* They are distinct legal entities. A residential tenants union cannot absorb commercial or separate residential entities without becoming a different organization entirely. Their leverage lies in their own contracts, not our leasehold.

  *   **The Live-in Superintendent:** I know this is the most contentious point. I have heard the argument from the super, and it is strong: *They live here. Their home is cold when the boiler fails. Their children play in the same hallway. In a buyout, their housing is just as precarious as anyone else's.* To exclude them looks like we view them as management rather than neighbors.
      *   *Why they are out:* In a rent strike, the tenant is the labor and the landlord is the management. The super is an employee of the landlord. Their livelihood depends on the entity we are striking against. Even if their personal loyalty is with us, their legal position creates a conflict of interest that the landlord will exploit to decertify the strike. Furthermore, if we win the buyout, the super's role transitions from employee to resident-owner; they can vote on *that* transition once the building is ours, but they cannot vote on the war to take it.
      *   *Defense:* If challenged, say this: "We are not voting on who belongs in the building. We are voting on who can legally withhold rent from the landlord. Your employment contract prevents you from doing that. We want you as a neighbor, but you cannot be a striker."

  **Why One Household, One Vote?**

  Some will argue for "One Person, One Vote." In a perfect democracy, that is the standard. But in a rent strike, the lease is the unit of resistance. If three adults in an apartment vote to strike and one votes to pay, the landlord still receives rent, and the strike in that unit fails.

  By making the apartment the voting unit, we force internal consensus. It ensures that when an apartment votes "Yes," that unit is actually ready to act. It prevents a scenario where we authorize a strike based on individual votes, only to find that half the building's leases are still paying.

  **Conclusion**

  This rule prioritizes power over purity. It acknowledges that a union is not just a community of feeling, but a vehicle for action. We honor the displaced by securing their future share. We honor the super by distinguishing their home from their job. We honor the campaign by ensuring that every vote cast represents a unit capable of striking.

  Let's vote on this rule first. Then, let's vote on the strike.
