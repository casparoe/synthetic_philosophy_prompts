      2.  **Intro:** This vote defines the union.
      3.  **The Guiding Principle:** "Capacity to Act" (Strike/Buyout).
      4.  **The Rule:** Who is in (Lease + Sublet + Succession), Who is out (Super, Commercial, Displaced, Neighbors).
      5.  **Voting Weight:** One Household, One Vote (determined by internal majority).
      6.  **The Hard Cases:** Specifically address the Super and the Displaced with charity but firmness.
