      *(Self-Correction on the Super)*: The prompt says "I've been arguing with the super about this for two weeks." The opinion needs to give the Chair a specific line of reasoning to use verbally. I will add a specific "Note on the Super" section.

      *(Self-Correction on Voting Weight)*: If I say One Household One Vote, how do they decide internally? The union should require a majority of adults in the unit to cast the unit's vote. That balances individual democracy with strike leverage.

      *(Final Polish)*: Ensure the tone isn't too academic. It needs to be circulate-able to tenants.

      *Wait, one more thought on the "Displaced".* They were pushed out but never left the campaign. Excluding them feels cold. I should recommend a non-voting "Founder" status.

      *Wait, one more thought on the "Co-op next door".* Their argument is the boiler wall. That's a maintenance issue, not a tenancy issue. Keep them out.

