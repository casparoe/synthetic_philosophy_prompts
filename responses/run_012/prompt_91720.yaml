prompt: |-
  Take the role of a political theorist who's spent years on the boundary problem -- who counts as a member of the demos -- and think carefully before you write. Start by brainstorming the candidate rules and where each one bites, then commit to a recommendation.

  Here's the situation. I chair the steering committee of a tenants union we're building in a 190-unit rent-stabilized building in Queens. Next Thursday we vote on whether to authorize a rent strike and, if that goes well, a co-op buyout bid. The ugly part is the franchise: who actually gets to vote on that. On the list so far: named leaseholders; subletters; adult children of tenants who live there; the live-in super, whose apartment comes with the job; the ground-floor laundromat whose lease we'd renegotiate if we win; a couple of families who were pushed out two years ago but never left the campaign; and the co-op next door, because our boiler room shares a wall with their garage and the buyout changes who maintains it. Two members have floated rules instead of lists: a sleep test (30+ nights in the building in the past year gets you a vote) and an exposure test (a vote for anyone whose rent, job, or access to that shared wall changes depending on whether we win or lose).

  Write me the short written opinion I can circulate before the meeting. I want a concrete rule -- who's in, who's out, whether it's one person one vote or weighted -- plus an honest account of the strongest argument for the people I'm excluding. Please don't just restate the usual all-affected versus all-subjected slogans, and skip citations, further reading, or reading lists; reason from the case itself. And I've been argueing with the super about this for two weeks, so I need something I can actually defend out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion piece:

  1.  **Analyze the Request:**
      *   **Role:** Political theorist specializing in the "boundary problem" (who constitutes the *demos*).
      *   **Task:** Write a short written opinion for a tenants union steering committee chair to circulate before a vote on voting rules.
      *   **Context:** 190-unit rent-stabilized building in Queens. Vote on rent strike authorization and potential co-op buyout bid.
      *   **The Problem:** Defining the franchise (who votes).
      *   **Candidates:** Leaseholders, subletters, adult children, live-in super, ground-floor laundromat, displaced families (campaign veterans), next-door co-op.
      *   **Proposed Rules:** Sleep test (30+ nights), Exposure test (impact on rent/job/access).
      *   **Constraints:** No slogans ("all-affected/all-subjected"), no citations/reading lists, reason from the case itself, concrete recommendation (who's in/out, weighting), honest account of excluded parties' strongest arguments, defensible out loud (specifically regarding the super).
      *   **Tone:** Thoughtful, practical, authoritative but accessible, politically savvy.

  2.  **Deconstruct the Boundary Problem in this Context:**
      *   *The Core Tension:* A union needs cohesion and leverage (requires a tight boundary) but also legitimacy and solidarity (requires a broad boundary).
      *   *The Decision:* This isn't just a policy vote; it's a *constitutive* vote. They are deciding what the union *is* by deciding who votes.
      *   *The Stakes:* A rent strike requires high participation to work. A co-op buyout requires legal standing and financial commitment. These are different goals with different membership needs.

  3.  **Brainstorming Candidate Rules & Friction Points:**
      *   *Named Leaseholders:*
          *   *Pro:* Legal standing, clear list, financial liability.
          *   *Con:* Excludes vulnerable people (subletters, kids), reinforces landlord logic.
      *   *Subletters:*
          *   *Pro:* Actually live there, pay rent.
          *   *Con:* Legally precarious, hard to verify, landlord might challenge.
      *   *Adult Children:*
          *   *Pro:* Succession rights, long-term residents.
          *   *Con:* Hard to define "adult," potential for vote stacking by one family.
      *   *Live-in Super:*
          *   *Pro:* Lives there, affected by conditions.
          *   *Con:* Employed by landlord, conflict of interest, potential coercion.
      *   *Laundromat:*
          *   *Pro:* Commercial stake, affected by buyout.
          *   *Con:* Business interest $\neq$ residential interest, different leverage.
      *   *Displaced Families:*
          *   *Pro:* Moral claim, campaign veterans.
          *   *Con:* No longer suffer the conditions, can't strike (no rent to withhold).
      *   *Next-door Co-op:*
          *   *Pro:* Physical interdependence (boiler/wall).
          *   *Con:* Different legal entity, different building, slippery slope.
      *   *Sleep Test (30+ nights):*
          *   *Pro:* Focuses on residence.
          *   *Con:* Hard to enforce/verify, privacy invasion.
      *   *Exposure Test (Impact):*
          *   *Pro:* Captures the stakes.
          *   *Con:* Too broad (includes co-op, laundromat), dilutes residential power.

  4.  **Developing the Recommendation:**
      *   *Goal:* Maximize leverage for the strike/buyout while maintaining democratic legitimacy.
      *   *Principle:* "Residential Stake + Capacity to Act." To vote on a *strike*, you must be able to *strike* (withhold rent). To vote on a *buyout*, you must be a *resident owner-occupier* (eventually).
      *   *The Cut:* The franchise should be based on **Household Residence + Rent Liability**.
      *   *Who's In:* Leaseholders + Verified Subletters + Adult Children (succession candidates) living there 6+ months. One vote per *household*, not per person (prevents family stacking, acknowledges the lease as the unit of struggle).
      *   *Who's Out:* Super (conflict of interest), Laundromat (commercial), Displaced (no leverage), Next-door Co-op (separate demos).
      *   *Weighting:* One Household, One Vote.

  5.  **Addressing the "Ugly Part" (The Super):**
      *   The prompt specifically mentions arguing with the super. This needs careful handling. The super is a tenant *and* an employee. In a labor/management conflict (which a strike is), they are management.
      *   *Argument for Super:* They live there, their home is at risk.
      *   *Counter:* Their livelihood depends on the landlord. It creates a coercion risk.

  6.  **Drafting the Opinion (Iterative Process):**
      *   *Opening:* Acknowledge the gravity. This defines the union.
      *   *The Principle:* Avoid abstract theory. Focus on "Power to Act."
      *   *The Rule:* Concrete criteria.
      *   *The Exclusions:* Give the strongest argument for the excluded (especially the super and displaced), then explain why they don't fit *this specific vote*.
      *   *The Voting Mechanism:* Household vs. Individual.
      *   *Closing:* Call to unity.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "One Household One Vote" too exclusionary for adult children?
      *   *Fix:* Allow adult children to vote *if* they are on the lease or have established succession rights. Otherwise, they are part of the household unit. Actually, for a union, "One Person One Vote" is usually more democratic, but "One Lease One Vote" is more strategic for strikes. Let's go with **One Resident One Vote** but strictly defined by residence + rent liability to avoid family stacking issues while empowering subletters. Wait, if it's a co-op buyout later, shares usually align with apartments. Let's stick to **One Household One Vote** for the strike authorization to ensure unity per unit, but acknowledge the tension. *Correction:* For a *union*, individual membership is standard. But for a *strike vote*, unit cohesion matters. Let's recommend **One Vote per Adult Resident (18+)** who meets the criteria. It empowers subletters and kids without diluting the "household" stake too much.
      *   *Re-evaluating the Super:* The prompt says "I've been arguing with the super." I need to give the Chair ammo. The super's argument is "I live here." The counter is "You work for the enemy."
      *   *Re-evaluating the Displaced:* Their argument is "We built this." Counter: "You can't strike." Offer them observer status.

  8.  **Finalizing the Rule:**
