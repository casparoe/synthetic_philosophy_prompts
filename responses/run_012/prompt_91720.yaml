      *   **In:** Leaseholders, Subletters (6+ months), Adult Children (succession eligible).
      *   **Out:** Super, Laundromat, Displaced, Neighbors.
      *   **Weight:** One Person, One Vote (for adults).

      *Wait, let's look closer at the "Sleep Test" vs "Exposure Test".*
      The Sleep Test is too invasive. The Exposure Test is too broad.
      The best rule is **Tenancy + Residence**.
      Let's refine the recommendation to be: **All adult residents who hold a lease OR pay rent OR have established succession rights.**
      Actually, for a *strike*, the unit is the apartment. If half the apartment strikes and half doesn't, the landlord still gets rent.
      *Decision:* **One Vote per Apartment (Household).** This forces internal democracy within the unit and aligns with the legal reality of the lease. This is crucial for a rent strike.

      *Wait, the prompt asks for "who's in, who's out, whether it's one person one vote or weighted."*
      Okay, I will recommend **One Vote per Household**. This solves the "adult children" stacking issue and aligns with the rent strike mechanic (the lease is the target).

      *Addressing the Super:* This is the hardest part. I need to be firm but fair.
      *Addressing the Displaced:* Acknowledge their moral debt.

  9.  **Drafting the Content (incorporating the "Political Theorist" voice):**
      *   Voice: Analytical, clear, decisive, empathetic but realistic.
      *   Structure:
          1.  The Stakes (Constitutive moment).
          2.  The Principle (Capacity to Act).
          3.  The Rule (Concrete).
          4.  The Hard Exclusions (Super, Displaced, Neighbors).
          5.  Implementation.

  10. **Review against constraints:**
      *   No slogans? Check.
