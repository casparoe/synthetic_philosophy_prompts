answer: |-
  **MEMORANDUM OF UNDERSTANDING (AND DISAGREEMENT)**
  **To:** Metaphysics Reading Group
  **From:** [Endurantist Name] & [Perdurantist Name]
  **Subject:** The Persistence of Objects Through Time

  We have spent a year talking past each other. This document is an attempt to stop doing that. We agree on what the debate is, where we diverge, and which specific problems actually matter. We are signing this to force the issue, not to bury it.

  ### 1. COMMON GROUND (What We Both Sign)

  1.  **The Target:** We are both trying to explain **persistence**: how a concrete particular (a person, a table, a cat) manages to exist at more than one time.
  2.  **Change is Real:** We agree that objects undergo genuine change. A poker really is cold at *t1* and hot at *t2*. We are not eliminativists; we aren't saying change is an illusion.
  3.  **Continuity:** We agree that persistence is not annihilation and recreation. We are not claiming that the universe blinks out and a perfect duplicate blinks in at every instant. There is a causal connection between the object at *t1* and the object at *t2*.
  4.  **Logic:** We both accept the Law of Non-Contradiction. An object cannot be wholly cold and wholly hot in the *same sense* at the *same time*. The disagreement is about how to reconcile incompatible properties across *different* times.
  5.  **Identity:** When we say "the same object," we mean **numerical identity** (one thing, counted once), not just **qualitative similarity** (two things that look alike).
  6.  **The Stakes:** This is not merely a verbal dispute about how to use the word "object." We both believe our preferred ontology describes the actual structure of reality, not just our language.

  ### 2. THE DISAGREEMENTS (The Battle Lines)

  We disagree on the following claims. Each of us endorses the row corresponding to our view. We agree that the other row is false.

  | Feature | **Endurantist Claim (3Dism)** | **Perdurantist Claim (4Dism)** |
  | :--- | :--- | :--- |
  | **Ontology** | Objects are three-dimensional entities. They have spatial parts, but no temporal parts. | Objects are four-dimensional space-time "worms." They have both spatial and temporal parts. |
  | **Presence** | At any moment it exists, the **whole** object is present. | At any moment, only a **temporal slice** (part) of the object is present. |
  | **Persistence** | Persistence is **identity over time**. The thing at *t1* is numerically identical to the thing at *t2*. | Persistence is the **relation between temporal parts**. The thing at *t1* is a part of the same worm as the thing at *t2*. |
  | **Change** | Change is an object having different properties at different times. | Change is a worm having different properties at different temporal locations. |
  | **Parthood** | "Part" means spatial part only. Time is not a dimension of parts. | "Part" includes temporal segments. Time is a dimension of parts, analogous to space. |

  ### 3. THE CRUXES (Where the Real Work Is)

  We identify three specific sub-questions that determine the outcome of this debate. If you settle these, the rest follows.

  **A. The Problem of Temporary Intrinsics**
  *   **The Issue:** How can one thing have incompatible intrinsic properties (like shape or temperature) at different times without contradicting itself?
  *   **Who it moves:** This is the philosophical engine. If the Endurantist cannot explain this without making properties relational (e.g., "hot-at-t"), they lose the intuition that objects have real properties. If the Perdurantist cannot explain why the *whole* worm is the object and not just the slice, they lose the intuition of unity.
  *   **Status:** **Primary Conceptual Crux.**

  **B. Special Relativity (SR)**
  *   **The Issue:** SR suggests there is no absolute simultaneity. There is no privileged "now" across the universe.
  *   **Who it moves:** This is the physical hammer. Endurantism relies on the idea of an object being "wholly present" at a moment. If "a moment" is relative to a reference frame, "wholly present" becomes frame-dependent. Perdurantism fits naturally into a "block universe" where time is just another coordinate.
  *   **Status:** **Primary Physical Crux.** (We suspect this is doing the most heavy lifting against Endurantism).

  **C. The Verbal Dispute**
  *   **The Issue:** Are we disagreeing about reality, or just whether the word "object" refers to the 3D slice or the 4D worm?
  *   **Who it moves:** Both of us. If this is merely verbal, we should stop fighting and agree to use different dictionaries. If it is substantive, one of us is describing reality incorrectly.
  *   **Status:** **Secondary.** (We agree it is substantive, but we acknowledge the temptation to dismiss it as verbal).

  **Did we miss a crux?**
  Yes. **Vagueness.** When exactly does an object cease to exist? (e.g., removing one atom from a table). Perdurantists handle this via vague boundaries of the worm. Endurantists struggle because identity is usually thought to be precise. However, SR and Temporary Intrinsics are the bigger drivers.

  ### 4. ARGUMENTS AND PREDICTIONS (The Test Cases)

  For each crux, we list an argument we both agree is relevant, and record our predictions.

  **Crux A: Temporary Intrinsics**
  *   **Case:** A metal poker is straight at *t1* and bent at *t2*.
  *   **Endurantist Prediction:** The *same* poker bears the relation "straight-at" to *t1* and "bent-at" to *t2*. The poker itself doesn't change its intrinsic nature; its relation to time does.
  *   **Perdurantist Prediction:** The *t1-part* of the worm is straight. The *t2-part* of the worm is bent. No single entity is both straight and bent.
  *   **Agreed Test:** If we can show that "straight-at" destroys the intrinsic nature of straightness, Endurantism suffers. If we can show that temporal parts are unintelligible, Perdurantism suffers.

  **Crux B: Special Relativity**
  *   **Case:** Two observers moving at different velocities disagree on whether two distant events are simultaneous.
  *   **Endurantist Prediction:** There must be a privileged frame of reference for an object to be "wholly present," or Endurantism must be revised to be frame-relative (which makes existence frame-relative).
  *   **Perdurantist Prediction:** Existence is not frame-relative. The whole worm exists tenselessly. Different observers just slice the worm at different angles.
  *   **Agreed Test:** If physics confirms there is no privileged "now," Endurantism requires significant metaphysical contortion.

  **Crux C: Verbal Dispute**
  *   **Case:** The Statue and the Clay. A lump of clay is shaped into a statue. Later the statue is crushed.
  *   **Endurantist Prediction:** The statue and the clay are distinct objects that coincide in space and time for a while. (Two things in one place).
  *   **Perdurantist Prediction:** They are two different worms that share temporal parts during the statue-phase but diverge later. (One worm is a proper part of the other).
  *   **Agreed Test:** If "two things in one place" is metaphysically impossible, Endurantism loses. If "distinct worms sharing parts" is incoherent, Perdurantism loses.

  ### 5. THE THREE PROBLEM CASES (The Dealbreakers)

  These are the cases that keep derailing us. Here is where we stand.

  **(a) Intermittent Existence**
  *   **Scenario:** An object exists, is completely annihilated (gap), and later an object is assembled that matches it perfectly in every respect (same atoms, same arrangement).
  *   **Endurantist Prediction:** **Numerical Identity is Broken.** Even if it looks identical, the object after the gap is a *new* object. Persistence requires continuous existence. To say it's the same object requires a brute fact with no grounding.
  *   **Perdurantist Prediction:** **A Gappy Worm.** It is one object with a discontinuous world-line. As long as there is the right causal or qualitative connection, the 4D worm can have gaps. It is one entity, just not a continuous one.
  *   **Who has the cleaner answer?** Perdurantist. Endurantists struggle to explain why the "wholly present" object doesn't just pop back into existence as the *same* thing if everything is identical.

  **(b) Fission and Fusion (The Amoeba)**
  *   **Scenario:** A single-celled organism splits in two (both survive). Later, the two merge back into one.
  *   **Endurantist Prediction:** **Identity Crisis.** Identity is one-to-one. If A splits into B and C, A cannot be identical to both. Either A ceases to exist (and B/C are new), or A is identical to one and not the other (but which?). Fusion is equally problematic (two becoming one).
  *   **Perdurantist Prediction:** **Branching and Merging.** The worm branches like a river delta. One temporal stream becomes two. Later, two streams merge into one. No violation of identity, because identity is just the continuity of the worm's structure.
  *   **Who has the cleaner answer?** Perdurantist. This is the standard "checkmate" case against Endurantism. Endurantists usually have to deny that the original survives or accept indeterminate identity.

  **(c) Spatial Part Swapping**
  *   **Scenario:** An object's spatial parts are swapped. The left half is moved to the right location, and the right half to the left location, over time.
  *   **Endurantist Prediction:** **The Object Moved/Rotated.** The object is wholly present at each stage. It underwent a spatial reconfiguration. It is the same object because the matter is causally connected.
  *   **Perdurantist Prediction:** **The Worm Twists.** The temporal parts at *t1* have arrangement X. The temporal parts at *t2* have arrangement Y. The 4D shape includes this twist.
  *   **Who has the cleaner answer?** **Tie.** Both handle this reasonably well. Endurantists rely on causal continuity of the matter; Perdurantists rely on the continuity of the worm's path. This case does not decide the debate.

  ### 6. THE STAGE THEORY INTERVENTION

  One of us has proposed **Stage Theory** (Exdurantism) as a compromise: *The object is just the instantaneous stage. "Persistence" is just a counterpart relation between distinct stages.*

  **Is this a genuine third option?**
  **No.** It is Perdurantism with extra steps.
  *   **Why:** It retains the core Perdurantist commitment: that the fundamental ontological unit is time-bound. It denies that the *whole* object is present. It solves Temporary Intrinsics exactly the way Perdurantism does (by saying the stage is only hot, not the persisting thing).
  *   **The Difference:** Standard Perdurantism says "I am the whole worm." Stage Theory says "I am this slice, and I have counterparts in the past/future."

  **What would the Endurantist say back?**
  "It saves the logic of properties but kills the reality of *me*."
  *   **The Critique:** If Stage Theory is true, *I* do not persist. The "me" typing this sentence will cease to exist in five minutes, and a counterpart will exist then. That counterpart will *think* it is me, but it won't *be* me. This violates our Common Ground Claim #5 (Numerical Identity). It makes survival an illusion of memory, not a fact of ontology.

  **Verdict:**
  Stage Theory is a variant of Perdurantism. It solves the Temporary Intrinsics problem more elegantly than Worm Theory but at the cost of making persistence less real than the Endurantist requires. It does not bridge the gap; it just shifts the Perdurantist flag to a different spot.

  ***

  **Signed,**

  __________________________ (Endurantist)
  __________________________ (Perdurantist)

  **Date:** _________________
