      *   Goal: Epistemic access to truths beyond the judge's verification capacity.
      *   Underlying Epistemology: Truth is something pre-existing that can be uncovered via competitive scrutiny; truth is proportional to persuasive success under idealized adversarial conditions.

  3.  **Deconstruct Hegel's Philosophy (Relevant Concepts):**
      *   **Truth:** For Hegel, truth is not a static correspondence between proposition and fact (*Richtigkeit*), but the whole (*Das Wahre ist das Ganze*). It is a process, a development, not a fixed point to be stumbled upon.
      *   **Dialectic:** Not just "thesis-antithesis-synthesis" (a Fichtean simplification), but the immanent self-movement of the concept. Contradiction isn't something to be resolved by a third-party judge picking a winner; it's something to be *sublated* (*Aufhebung*)—preserved, canceled, and lifted up.
      *   **Recognition (*Anerkennung*):** Truth arises through mutual recognition between self-consciousnesses, not through one defeating the other before a third party. The Master-Slave dialectic shows that domination/defeat doesn't yield truth/freedom.
      *   **The Judge:** In Hegel's system, the "judge" stands outside the process. For Hegel, the subject must be *in* the process. External reflection (*äußerliche Reflexion*) is inferior to determinate reflection (*bestimmte Reflexion*).
      *   **Cunning of Reason (*List der Vernunft*):** Reason uses passions/interests, but the outcome is historical/systemic, not a localized game-theoretic equilibrium.

  4.  **Synthesize: Hegel vs. AI Debate:**
