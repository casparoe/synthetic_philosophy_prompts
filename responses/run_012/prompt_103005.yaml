  6.  **Developing the Argument (The "Why"):**
      *   **Truth as Process vs. Truth as Object:** The scheme assumes truth is a pre-existing fact (correspondence). Hegel sees truth as the whole process. The debate stops at the verdict, not the conceptual resolution.
      *   **The Role of the Judge (External Reflection):** The human judge is passive. For Hegel, truth must be *known*. If the judge picks based on persuasion without verification/comprehension, the truth hasn't entered *Geist* (Spirit). It remains alien.
