prompt: |-
  Hey, I'm in a free will seminar right now and theres this thing that keeps happening that I cant find a name for. The compatibilist and the incompatibilist will agree on every physical fact about a case, and they'll even agree that the claim that she could have done otherwise is true on one reading (if she had wanted to, she would have) and false on another reading (given the past and the laws, there was no alternative). Neither side thinks the other has the facts wrong. But they still think they're disagreeing about something real, because each thinks the reading the other is using is not the reading that the free will debate is about. It's like the whole fight is over which sense of the phrase should be the official one, not over whether either sense applies. Someone in class said it's just a verbal dispute, but that seems wrong, because a verbal dispute is usually when people don't realize they mean different things. Here they both know both meanings and are fighting over which one matters. Is there an established name for this exact move? I know its near stuff like ambiguity and talking past each other, but I want the specific concept. If there's no name, can you coin one and define it, and say how it differs from plain equivocation and from the idea that the dispute is merely verbal? Also, where does it apply outside free will? Keep it under 400 words.
