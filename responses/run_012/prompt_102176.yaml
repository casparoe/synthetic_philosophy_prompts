answer: |-
  You have hit on the exact moment where statistics stops being math and starts being philosophy. You are absolutely right: mathematically, Case 2 (Tutoring) and Case 3 (Heart Drug) are identical structures. The numbers flip the same way. The reason your gut treats them differently is not because of the numbers, but because of the **story the numbers are telling.**

  There is a rule underneath your intuition. It isn't circular, but it does require you to look at the timeline of events, not just the spreadsheet.

  ### The "Time Travel" Test

  The principle that resolves 90% of Simpson's Paradox confusion is **Temporal Precedence**.

  When you see a split (subgroups), ask: **Did this grouping variable exist *before* the treatment/choice was made, or did it happen *after*?**

  *   **If the split existed BEFORE (Pre-treatment):** The subgroups are usually the "real" story. The aggregate is lying to you because of **Selection Bias**. (Like Case 2).
  *   **If the split happened AFTER (Post-treatment):** The aggregate is usually the "real" story. The subgroups are lying to you because you are blocking the **Mechanism**. (Like Case 3).

  Let's run your cases through this test.

  #### 1. Basketball (Player A vs. B)
  *   **The Split:** Shot Type (2pt vs 3pt).
  *   **The Timeline:** The player chooses the shot *before* they shoot it. The difficulty exists before the outcome.
  *   **The Question:** Are we measuring "Who scores more points?" or "Who is the better shooter?"
  *   **The Verdict:** If you want to know who is the more *skilled* shooter, you must control for difficulty. You want to know: "If both took the exact same shots, who makes more?" That requires splitting by shot type.
  *   **Gut Check:** Your gut is right. The aggregate is misleading because Player A is "cheating" by taking easier shots. The subgroups reveal the skill.

  #### 2. Tutoring (Program vs. No Program)
  *   **The Split:** Starting Ability (Low, Mid, High).
  *   **The Timeline:** Did the kid have low ability *before* they signed up for tutoring? **Yes.**
  *   **The Logic:** This is a **Confounder**. Starting ability caused them to sign up for tutoring, and starting ability affects the final score.
  *   **The Verdict:** **Trust the Subgroups.** You must compare apples to apples. The aggregate is skewed because the tutoring group was loaded with struggling kids.
  *   **Why:** The split variable (Ability) existed *before* the treatment (Tutoring).

  #### 3. Heart Drug (Drug vs. Placebo)
  *   **The Split:** Had a Heart Attack (Yes/No).
  *   **The Timeline:** Did they have the heart attack *before* taking the drug? **No.** The drug is supposed to prevent the heart attack.
  *   **The Logic:** This is a **Mediator**. Drug $\to$ Fewer Heart Attacks $\to$ Higher Survival.
  *   **The Verdict:** **Trust the Aggregate.** By splitting on "Had a Heart Attack," you are throwing away the people the drug saved. You are essentially saying, "Let's ignore everyone the drug helped, and only look at the people it failed to protect."
  *   **Why:** The split variable (Heart Attack) happened *after* the treatment (Drug).
  *   **The Difference from Case 2:** In Case 2, the split explains *who got the treatment*. In Case 3, the split explains *what the treatment did*.

  #### 4. High Schools (School P vs. Q)
  *   **The Split:** Track (College Prep vs. General).
  *   **The Timeline:** This is the tricky one, and it explains why you flip-flop. You need to know *how* kids get into tracks.
  *   **Scenario A (Ability-based):** Kids are placed in tracks based on prior grades.
      *   **Verdict:** Trust Subgroups. School Q is teaching better. School P just has smarter kids. (Same as Tutoring).
  *   **Scenario B (Policy-based):** School P puts everyone in College Prep. School Q sorts kids into General track to "manage" them.
      *   **Verdict:** Trust Aggregate. School P's policy of keeping everyone in College Prep is part of their success. School Q's tracking system might be depressing outcomes.
  *   **The Rule:** If the Track is a **pre-existing characteristic** of the student, split. If the Track is a **result of the School's policy**, don't split.

  #### 5. Weighted Averages
  *   **The Verdict:** You are correct. This isn't a paradox; it's a calculation error. Simpson's Paradox requires valid math in both directions. Averaging averages without weighting is just wrong math. Ignore this one.

  ---

  ### The New Case: The Gender Pay Gap

  > *A company where every department pays women less than men, but the company overall pays women more.*

  This is the famous "Berkeley Admissions" case flipped. Here is how you apply the Time Travel Test.

  **The Split:** Department (Engineering, HR, Sales, etc.).
  **The Question:** Is there discrimination?

  **Apply the Test:**
  1.  **Did the Department exist before the Gender?** No.
  2.  **Did the Gender exist before the Department?** Yes.
  3.  **Crucial Question:** Did Gender influence which Department they ended up in?
      *   **If Yes (Segregation):** If women were steered, hired, or self-selected into lower-paying departments (e.g., HR vs. Engineering) due to systemic bias, then Department is a **Mediator** of discrimination.
          *   **Verdict:** **Trust the Aggregate.** The company pays women more overall? Great. But if they are all clustered in the low-paying jobs, the subgroups hide the systemic inequality. The "Overall" number captures the reality of their career path.
      *   **If No (Random Distribution):** If women and men are equally distributed across departments, but women are paid less *within* each department...
          *   **Verdict:** **Trust the Subgroups.** This is "equal pay for equal work." The aggregate is being skewed by volume (maybe there are way more women in the one high-paying dept), but the daily reality is unfair.

  **Most Real-World Interpretation:** Usually, in pay gap cases, Department is treated as a **Mediator**. Women are often underrepresented in high-paying technical roles. Controlling for Department (looking only at subgroups) is often criticized as "controlling away the discrimination." If your goal is to measure "Equal Pay for Equal Work," look at subgroups. If your goal is to measure "Economic Inequality," look at the aggregate.

  ---

  ### So, what is the "Right" Split?

  You asked for a test that doesn't just say "Causal." Here is the operational checklist you can use next time you see a flip:

  **1. The Intervention Test**
  Imagine you could force everyone to take the Treatment (Tutoring, Drug, School P).
  *   **Q:** Would the Split Variable change?
  *   **Case 2 (Tutoring):** If I force tutoring, does the kid's *Starting Ability* change? **No.** $\to$ **Split is Valid.**
  *   **Case 3 (Drug):** If I force the drug, does the *Heart Attack* rate change? **Yes.** $\to$ **Split is Invalid.**

  **2. The "Selection vs. Mechanism" Test**
  *   Does the split variable explain **who got selected** for the treatment? (Selection Bias)
      *   If yes, you **MUST split** to get the truth. (Case 2).
  *   Does the split variable explain **how the treatment worked**? (Mechanism)
      *   If yes, you **MUST NOT split** to get the truth. (Case 3).

  ### Summary of your Gut Instincts

  You don't need to give up any of your verdicts. Your intuition is actually tracking causal structure perfectly, even if you couldn't articulate it.

  *   **Basketball:** You recognized Shot Type as "Difficulty" (Context), not "Result." You wanted to measure skill, so you controlled for context.
  *   **Tutoring:** You recognized Starting Ability as "Selection Bias."
  *   **Heart Drug:** You recognized Heart Attack as "Mechanism of Action."

  **The Rule:** Trust the subgroups when the split variable is a **pre-existing condition** (Confounder). Trust the aggregate when the split variable is a **consequence of the treatment** (Mediator).

  If you can't tell if it's pre-existing or a consequence, you can't solve the paradox with math alone. You need more information about the story. That is the feature, not the bug. Statistics cannot save you from not knowing how the world works.
