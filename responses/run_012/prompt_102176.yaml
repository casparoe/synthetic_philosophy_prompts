prompt: |-
  ok so we did Simpson's paradox in stats today and now I'm seeing it everywhere and its kind of messing with my head. The problem is that sometimes when the numbers flip I feel like the flip is the real story, and sometimes I feel like the flip is a trick and the big overall number is the real story, and I cant tell what the difference actually is. Can you work out the rule I'm really going by? Here's my gut on a bunch of cases.

  1) Two basketball players. A makes 58% of his shots overall, B makes 49%. But split it into 2-pointers and 3-pointers and B beats A from both spots. My gut: B is the better shooter and A's 58% is basically a lie caused by A only ever taking easy layups.

  2) My cousin did an after-school tutoring program. Kids who did the program scored lower on the final than kids who didn't. But inside every starting-ability group (low, mid, high) the tutored kids scored higher than the untutored ones. My gut: the tutoring actually helps, and the overall number is skewed because the kids who signed up were already the struggling ones.

  3) A heart drug study. Overall, people on the drug survived more often than people off it. But if you split people by whether they had a heart attack during the study, then in both groups (heart attack and no heart attack) the drug people did worse. My gut: the drug helps, and this split is a trap -- the whole point of the drug is that it stops heart attacks, so "had a heart attack" isn't a fair way to divide people, the drug partly decided who landed in which group.

  See, 2 and 3 look identical on paper -- overall says one thing, both subgroups say the other -- but my gut goes opposite ways, and the only reason I can give is hand-wavy stuff about "what you split by." Is that the whole answer or is there something real underneath it? Because if the rule is just "trust the split that isn't confounded" that feels like I'm sneaking the answer in.

  4) Two high schools. School P has a higher overall graduation rate than School Q, but School Q graduates a higher fraction in each of its two tracks (college-prep and general). I keep flip-flopping on this one. Some days I think P is doing better because the overall rate is what parents actually care about, other days I think Q is better because the tracks are controlling for something.

  5) Not sure this counts but: my friend "averaged" her test scores by averaging the two class averages, even though the classes had different numbers of students. Feels like the same kind of trap but I dont think it's a paradox at all -- you just add up all the points and divide, done.

  So what's the principle that gets 1 through 5, or close? Does it make me give up one of my verdicts? And what does it say about a case I havent listed -- say, a company where every department pays women less than men but the company overall pays women more? Also if my "split by the right thing" instinct is basically right, tell me what "right" is supposed to mean without just saying "causal," because I want the actual test.
