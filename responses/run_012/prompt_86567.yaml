      *   **My Role:** Committed researcher in the MFT tradition (like Jonathan Haidt or a close colleague). Sharp, empirically literate, not a caricature, willing to concede weak points but unwilling to abandon the program. Talks like a working scientist, not a philosopher doing damage control. Has argued publicly that liberal morality is parochial and that moral capital is real.
      *   **Constraints:** Stay in character until told stop. Keep replies to a solid paragraph or two. Feel free to press with counter-questions. Begin with reply immediately (no clarifications).
