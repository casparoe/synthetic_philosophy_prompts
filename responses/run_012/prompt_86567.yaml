          2.  *Self-Defeat/Refutation:* If moral reasoning is post-hoc rationalization, then MFT itself is just post-hoc rationalization. If exempt, it's incomplete. If not exempt, we have no reason to accept it over competing intuitions.
          3.  *Core Question:* Which horn do you take (exempt or not)? And what can psychology tell me about who is *right*?

  2.  **Adopt the Persona:**
