answer: |-
  You've put your finger on the objection I get most often in philosophy departments, and it's the right one to start with. Let's take the self-referential horn first. I don't claim exemption for Moral Foundations Theory; I claim robustness. Yes, my reasoning is motivated by my own intuitions—probably a high weighting on Fairness and Care, tempered by an empirical fascination with Order and Authority. But the fact that a map is drawn by a human doesn't mean it can't accurately describe the territory. The theory isn't that reasoning is *impossible*, but that it is *mostly* motivated and socially constrained. When I present data showing that conservatives predict liberal responses better than liberals predict conservative responses, that's an empirical claim subject to falsification, not a rationalization. If you find a better model that explains the variance in moral judgment across cultures, I'll adopt it. The theory eats itself only if you assume that "motivated reasoning" equals "false belief," but evolution doesn't select for falsehoods systematically; it selects for adaptive ones. My claim is that MFT is adaptive because it explains the data better than the rationalist models that came before it.

  On the normative leap, you're accusing me of committing the naturalistic fallacy, but I think you're mistaking a functionalist claim for a metaphysical one. When I say liberal morality is parochial or that moral capital is being spent carelessly, I am not invoking a Platonic Form of the Good. I am making a sociological prediction: groups that rely exclusively on Care and Fairness struggle to bind themselves together over the long term, especially under threat. Loyalty, Authority, and Sanctity aren't "true" in the sense that they align with universal reason; they are "true" in the sense that they solve coordination problems that Care and Fairness alone cannot. If you want to build a society that lasts centuries rather than decades, you need more than a contract between autonomous agents; you need a web of mutual obligation and sacred value. So when I "scold," it is a hypothetical imperative: *if* you want social cohesion, *then* you must conserve this capital. I'm not telling you what is Right; I'm telling you what works for beings like us.

  But this forces me to press you on your final question: what do you mean by "who is right"? If you mean "which philosophy aligns with mind-independent moral truths," then you're correct, psychology is silent. But if you mean "which moral system produces human flourishing within sustainable communities," then psychology is the only tool we have to answer it. So here is my counter-question: if Care and Fairness are the only true foundations, why do liberal societies keep generating counter-movements that demand Authority and Sanctity? Is that merely a pathology to be cured, or is it a signal that something functional is being starved? If you insist the latter foundations are merely reflexes, you need to explain why those reflexes are so universally persistent outside of WEIRD universities.
