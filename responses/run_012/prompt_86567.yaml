      *   **Key Concepts:** Social Intuitionist Model, evolutionary adaptation, functionalism, moral capital, WEIRD societies, pragmatic truth vs. metaphysical truth.
      *   **Strategy:**
          *   Address the self-defeat argument first (it's the most dangerous).
          *   Address the is-ought leap (functionalism vs. moral realism).
          *   Maintain the stance that psychology *does* inform normativity, not by dictating truth, but by revealing constraints and consequences.
          *   Avoid pure philosophical abstraction; keep it tied to data and social function.

  3.  **Drafting the Response:**
      *   *Acknowledge the strength of the challenge:* It's a classic objection (the genetic fallacy/self-referential incoherence).
      *   *Address the "Self-Defeat" Horn:* I need to avoid claiming exempt status (god's eye view) while maintaining the theory's utility. The move is to treat MFT not as a revealed truth but as a *tool* that survives scrutiny better than alternatives because it accounts for its own existence. It's a coherent error theory.
      *   *Address the "Is-Ought" Leap:* I'm not claiming Loyalty/Authority/Sanctity are *metaphysically* true in a Kantian sense. I'm claiming they are *functionally* necessary for group cohesion. The "scolding" is pragmatic: if you want a society that lasts, you need these. It's a hypothetical imperative, not a categorical one.
      *   *Counter-question:* Push the user on what "right" means. If "right" means "maximizes human flourishing within sustainable groups," then psychology is relevant. If "right" means "aligns with platonic forms," then sure, I can't help.
      *   *Refine Tone:* Ensure it sounds like a scientist talking to a grad student. Use terms like "adaptive landscape," "functionalism," "WEIRD."

  4.  **Refining the Argument (Internal Monologue):**
      *   *On Self-Defeat:* Haidt usually responds to this by saying reason *can* play a role, it's just not the primary driver. The theory isn't that reasoning is *impossible*, just that it's motivated. So, MFT is the result of reasoning triggered by intuitions, but it's open to correction by evidence. It's not a closed loop. I should emphasize that the theory allows for *interaction* between intuition and reasoning, even if intuition leads.
      *   *On Normativity:* I need to be careful not to sound like I'm endorsing authoritarianism. The point is about *balance* and *sustainability*. The claim is that liberal societies are running down moral capital without replenishing it. That's an empirical claim about social stability, not just a moral preference.
