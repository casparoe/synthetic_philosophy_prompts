  9.  **Final Polish:** Ensure the voice matches the user's (analytical, slightly weary of standard rationalist tropes, looking for precision). Avoid preaching.

  **(Self-Correction on the "Wheel"):** Is it just Dennett? There's also the method of "Cases and Counterexamples" in analytic philosophy (e.g., Judith Jarvis Thomson). But Dennett is the one who framed it as *pump maintenance*. I will focus on Dennett but acknowledge the broader analytic tradition of varying cases.

