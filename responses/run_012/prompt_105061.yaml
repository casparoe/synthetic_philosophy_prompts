answer: |-
  The air in Bay Four tasted of ozone and old metal. It was the smell of the *Aethelgard*'s immune system, the scent of the Menders. They hung from the ceiling in chrysalis clusters, dormant shells of chrome and ceramic waiting to wake, replicate, and scuttle into the ship's veins to fix what broke. They were not built; they grew, copying themselves with the sloppy fidelity of biology, accumulating errors that became traits, traits that became history.

  Elara wiped grease from her forehead and looked at the component in her hand. It was a thermal shunt, ribbed and copper-colored.

  "It's a heat exchanger," Kaelen said. He didn't look up from his datapad. The Archivist's fingers moved over the holographic interface, tracing the lineage of Unit 734. "Introduced in Cycle 42 to regulate coolant flow in the fusion manifold."

  "The fusion manifold was decommissioned fifty cycles ago," Elara said. She fit the shunt into a gap in the hull bracing. It clicked with a satisfying solidity. "Now, it's a structural brace. It absorbs the vibration from the drive core. If I replace it with a modern exchanger, the hull vibrates until the seals crack."

  Kaelen finally looked up. His eyes were tired, shadowed by the glow of the logs. "Then you are using it incorrectly. Its function is heat exchange. That is why it exists in the population. That is why it was selected."

  "Its function is to keep the air inside the ship," Elara countered, tightening the bolt. "If I treat it as a heat exchanger, I swap it out. The hull breaches. People suffocate. Do you want to explain that to the Captain, or do you want to log that the shunt is now a brace?"

  "I log what is true," Kaelen said softly. "The trait persists because of its history, not its current utility. If you categorize it as a brace, you erase the lineage. Future engineers won't know why the geometry is so inefficient for bracing."

  "Future engineers won't care if they're dead." Elara tossed the old gasket into the recycler. "Next."

  They moved down the line to Unit 890. This Mender was older, its casing pitted. Kaelen pointed to a small, glassy lens embedded in its manipulator arm.

  "The spectral sensor," Kaelen said. "For four hundred cycles, this was the most heavily selected trait in the fleet. It allowed the Menders to detect radiation leaks from the Red Giant passage."

  "We haven't passed a giant in three centuries," Elara said. She ran a diagnostic. The sensor drew power but returned null data. It added three grams of mass to the arm, slowing its reaction time by a fraction of a millisecond. In a high-speed repair, that lag could mean a missed weld.

  "It has a function," Kaelen insisted. "It was the reason this lineage survived the Transit. To remove it is to deny the history of our survival."

  "It's dead weight," Elara said. She picked up a laser cutter. "It contributes nothing to the current system. It's noise."

  "It is a record," Kaelen said, stepping between her and the unit. "If you cut it, you break the chain. You make the history unintelligible."

  "The history is written in your books, Kaelen. The ship is written in steel." Elara sidestepped him. The laser hummed. The glass lens melted into a dark slag. Unit 890 twitched, its internal diagnostics flashing a warning that a component was missing, then settled into a new equilibrium. Lighter. Faster.

  Kaelen didn't speak. He simply typed *Trait Loss: Cycle 912* into his pad.

  They were halfway through the bay when Jory found them. The junior crew member hovered near the entrance, holding a tablet like a shield. Jory had been listening for an hour, shifting weight from foot to foot.

  "Why does it matter?" Jory asked.

  Elara paused, wrench in hand. "What?"

  "The arguing," Jory said, stepping into the light. "You say it's a brace. He says it's a shunt. I say it's a piece of metal that keeps the hull closed. Why do we need to agree on what it's *for*?"

  "Because I need to know if it's broken," Elara said.

  "But 'broken' just means it's not doing what you want," Jory said. "Kaelen wants it to tell a story. You want it to hold the wall. The metal doesn't care. Calling it a 'function' is just... flagging which explanation helps you sleep at night. It's not a fact. It's a preference."

  Elara looked at the wrench, then at Kaelen. The Archivist said nothing, waiting to see if the Engineer would yield to the pragmatism.

  "Maybe," Elara said. "But preferences have consequences."

  She turned to the third unit, 905. This one was anomalous. A filament of iridescent alloy wound around its primary motor. Elara pulled up the schematic.

  "This filament," Elara said. "It conducts charge twenty percent better than the standard issue. It helps the motor recover from surges."

  "But it wasn't selected for that," Kaelen said, leaning in. "Look at the lineage. The filament appeared as a copying error in Cycle 800. It was linked to a torque-gear mutation. The gear gave the Menders better grip on slippery conduits. That's why they survived. The filament just came along for the ride."

  "A hitchhiker," Jory murmured.

  "Precisely," Kaelen said. "It has no function. It was never favored for its conductivity. It was favored by accident."

  "But it helps now," Elara said. She traced the filament with a gloved finger. "If I remove it, the surge protection drops. If I keep it, I'm preserving a mistake."

  "If you keep it, you validate the error," Kaelen said. "You blur the line between design and noise."

  "If I cut it, the next surge fries the motor," Elara said. "And if the motor fries, the Mender can't seal the oxygen scrubbers."

  Jory shrugged. "So keep it. Call it a 'surge protector.' Who cares if it started as a mistake? It works. That's the only function that exists."

  Elara hesitated. To keep it was to admit that the ship ran on accidents. To cut it was to risk the scrubbers. She looked at the filament, shimmering like an oil slick. She made her choice and moved to the next bay.

  The alarm came two hours later.

  It wasn't a siren, but a sharp, rhythmic thrumming in the deck plates. A pressure drop in Sector Seven. Elara was already running when the comms crackled.

  "Engineering, we have a breach in the primary coolant line. Mender 905 is on site."

  Elara skidded into the sector. Coolant mist hissed into the corridor, freezing the air. Mender 905 was clamped over the pipe, its manipulators welding the fissure. But the weld wasn't holding. The metal was warping.

  "It's failing," Elara shouted over the hiss.

  Jory was there, watching the readout. "It's doing what it can. The pressure is beyond spec."

  "It's supposed to seal standard breaches," Elara said. She grabbed a manual clamp. "That's its job."

  "Whose job?" Jory asked, shouting back. "You said function is just what we find useful. Well, right now, it's not useful. So it has no function. It's just a machine doing physics."

  "It malfunctioned!" Elara slammed the manual clamp onto the pipe. The hiss stopped. The silence was sudden and heavy.

  Jory stepped closer, face pale in the emergency lights. "But how do you know? You told me yourself. The filament was a mistake. The brace was a shunt. The sensor was history. If 'function' is just a label we paste on things to make sense of them, then 'malfunction' is just a label too. You can't say it *failed*. You can only say you *wished* it did something else."

  Elara stood up, wiping coolant from her suit. She looked at Mender 905. The unit was dormant, its battery depleted. The iridescent filament glowed faintly, then dimmed.

  "If I can't say it failed," Elara said, her voice low, "then I can't say it needs fixing. If I can't say it needs fixing, I can't justify replacing it. And if I can't replace it, the next breach kills everyone in Sector Seven."

  She turned to Jory. "You think the label doesn't matter. But when I stand in front of a crew member's family and tell them their daughter died because a machine didn't do what it was *supposed* to do, I need more than 'physics happened.' I need to know what it was *for*."

  Kaelen arrived then, breathless, his datapad clutched to his chest. He looked at the frozen coolant, then at the Mender.

  "Did it perform its selected effect?" Kaelen asked.

  "It tried to seal the breach," Elara said.

  "Was it selected to seal breaches of this magnitude?"

  "No. It was selected for grip. The sealing capacity is a byproduct."

  "Then it did not malfunction," Kaelen said. "It performed within its historical parameters. The environment exceeded the parameters."

  Elara looked between them. Jory, who thought function was a game of words. Kaelen, who thought function was a ghost of the past.

  "The filament," Elara said. "It helped the motor recover from surges. But it didn't help with the thermal load of this breach."

  "Because the filament wasn't selected for thermal resistance," Kaelen said. "It was a hitchhiker. It has no functional capacity for heat."

  "It conducts charge," Elara snapped. "Conductance creates heat. The very thing that makes it useful for surges makes it a liability here."

  "So you will remove it?" Kaelen asked.

  "If I remove it, I lose the surge protection," Elara said. "If I keep it, I risk thermal warping."

  "Then you must decide," Kaelen said. "Not based on what it is, but on what you need the future to be."

  Elara looked at the Mender. It was a creature of the ship, born of copies and errors, a lineage of survival written in chrome. It didn't know what it was for. It just was.

  "Jory," Elara said. "Log this as a malfunction."

  "But you said—" Jory started.

  "I know what I said. Log it. If we don't call it a failure, we don't learn. And if we don't learn, we die."

  Jory hesitated, then tapped the screen. *Status: Malfunction.*

  "Kaelen," Elara said. "Log the filament as a vestigial trait. It's a liability now."

  "It is not vestigial," Kaelen argued. "It is still conductive. It still aids surge recovery."

  "It killed the seal," Elara said. "In this context, it's dead weight. Log it."

  Kaelen's jaw tightened. He typed. *Trait Status: Deprecated.*

  Elara pulled the Mender from the pipe. It was heavy, dead weight in her arms. She carried it toward the recycler, but stopped at the threshold.

  If she recycled it, the lineage ended. The specific combination of torque-gear and filament would vanish. If she kept it, she risked another thermal warp. She looked at the filament, shimmering in the dark. It was beautiful, in a way. A mistake that had become a feature, now becoming a flaw.

  She didn't put it in the recycler. She put it on the shelf behind her, next to the thermal shunt and the melted lens.

  "We keep it," Elara said.

  "For study?" Kaelen asked.

  "For spares," Elara said. "The next breach might not be thermal. It might be electrical. Then this 'mistake' is the only thing that saves us."

  "So its function is... contingent?" Jory asked.

  "Its function is to keep us alive," Elara said. "However it manages that. However it happened."

  She turned off her welding torch. The bay plunged into semi-darkness, lit only by the standby lights of the sleeping Menders. They hung in the shadows, a silent army of copies, errors, and adaptations. None of them knew what they were for. None of them cared.

  Elara wiped her hands on a rag. The debate would start again tomorrow. Kaelen would argue for the history, Jory for the utility, and Elara would stand between them, holding the wrench, deciding which truth the ship could survive.

  "Get some sleep," she said. "Shift starts in four hours. We have to decide what to do with the oxygen scrubbers."

  Kaelen nodded, clutching his pad. Jory lingered, looking at the shelf of discarded parts.

  "Do you think they know?" Jory asked quietly. "The Menders?"

  Elara looked at Unit 905, dark and still on the bench.

  "No," she said. "That's why we're here."

  She closed the bay door, sealing the hum of the ship inside, leaving the question hanging in the cold air of the corridor, unresolved and necessary.
