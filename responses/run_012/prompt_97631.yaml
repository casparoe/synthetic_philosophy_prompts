  **JOINT FRAMING DOCUMENT: ADVERSARIAL COLLABORATION ON THE COLOR PHI PHENOMENON**

  **To:** The Collaborative Research Board
  **From:** Dr. A. (Proponent, Stalinesque Model) & Dr. B. (Proponent, Orwellian Model)
  **Date:** October 26, 2023
  **Subject:** Operationalizing the Distinction Between Pre-Experiential Integration and Post-Experiential Revision

  ### 1. Agreed Claims and Scope of Dispute

  We, the undersigned, acknowledge that the Color Phi phenomenon constitutes a robust empirical datum regarding human perceptual reporting. However, we disagree on the cognitive architecture underlying this report. To ensure this collaboration yields decisive data, we stipulate the following agreed claims:

  1.  **The Phenomenological Datum:** In standard Color Phi trials (Red Dot at Location 1, followed by Green Dot at Location 2), subjects reliably report a single dot moving from Location 1 to Location 2 and changing color mid-trajectory.
  2.  **Insufficiency of Standard Report:** We agree that the standard retrospective report *alone* cannot distinguish between the Stalinesque and Orwellian hypotheses. Both models account for the final report equally well; the former posits a delayed but veridical experience, the latter an immediate but subsequently falsified memory.
  3.  **Predictive Equivalence in Standard Paradigms:** We acknowledge that under standard conditions, without manipulation of timing, load, or reporting windows, the two models are empirically equivalent regarding the *final* behavioral output.
  4.  **Architectural Divergence:** We agree that the models differ in causal architecture. The Stalinesque model posits a temporal integration window where stimuli are held in pre-conscious buffers before phenomenal content is generated. The Orwellian model posits immediate phenomenal content generation followed by mnemonic reconstruction.
  5.  **Testability:** We agree that these architectural differences entail divergent predictions regarding (a) the availability of stimulus information for report *during* the inter-stimulus interval or at the instant of the second stimulus, and (b) the susceptibility of the illusion to cognitive interference applied at specific temporal latencies.

  ### 2. Positions, Cruxes, and Pre-Registered Predictions

  The following table outlines our respective positions in our own terminology, identifies the specific cruxes where our models diverge, and records our pre-registered predictions for the agreed manipulations.

  | Issue / Crux | Stalinesque Position (Dr. A) | Orwellian Position (Dr. B) | Agreed Manipulation | Stalinesque Prediction | Orwellian Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of the Illusion** | The illusion is **phenomenal**. The brain constructs a coherent motion narrative *before* it enters consciousness. The experience is accurate to the report, but delayed relative to the stimulus. | The illusion is **mnemonic**. The brain experiences the discrete flashes veridically. The narrative is constructed *after* the experience, overwriting the memory trace used for reporting. | **N/A (Theoretical)** | N/A | N/A |
  | **Temporal Latency of Content** | Conscious content lags behind stimulus onset by the duration of the integration window (approx. 100-200ms post-second flash). | Conscious content tracks stimulus onset with standard neural latency (approx. 50-100ms per flash). | **Neural Correlate Timing:** EEG/MEG measurement of markers associated with conscious access (e.g., P3b, GNW ignition). | Markers of "motion content" will appear only *after* the second flash is fully processed. | Markers of "flash content" will appear immediately after each flash; "motion markers" will appear later during recall. |
  | **Dual-Report Paradigm (Primary Crux)** | **Task:** Subject presses a button indicating "Motion Detected" or "No Motion" *at the exact instant* of the second flash (T2), then gives a full retrospective description. | **Task:** Same as left. | **Dual-Report Paradigm:** Forced-choice response locked to T2 onset, followed by standard retrospective interview. | **At T2:** Subject cannot report motion. The first dot (T1) is in a pre-conscious buffer; the unified experience does not exist yet. Report will be "No Motion" or "Uncertain."<br>**Retrospective:** Report will be "Motion." | **At T2:** Subject reports based on veridical experience of T1 and T2. Since motion is an illusion constructed later, immediate report is "No Motion" (Two Flashes).<br>**Retrospective:** Report will be "Motion" (Memory overwritten). |
  | **Differentiation of Immediate Report** | **Crucial Distinction:** At T2, the content of T1 is *not yet available* to consciousness. If asked "What color was the first dot?" at T2, performance should be at chance or show high latency. | **Crucial Distinction:** At T2, the content of T1 *was experienced* and is in working memory. If asked "What color was the first dot?" at T2, performance should be accurate (Red). | **Interrogative Dual-Report:** At T2, prompt subject: "What was the color of the first dot?" before asking about motion. | **Accuracy:** Low/Chance. The T1 stimulus is in a pre-phenomenal buffer, inaccessible to report until integration completes post-T2. | **Accuracy:** High. The T1 stimulus was consciously experienced at T1 and is accessible in working memory at T2. |

  ### 3. Analysis of Verbal and Evidential Idleness

  In preparing this document, we have identified the specific locus of the dispute to determine whether any portion is merely verbal or evidentially idle.

  **The Verbal Component:**
  We acknowledge that a portion of the historical debate is verbal, stemming from an undefined notion of "Consciousness." If "consciousness" is treated as a Cartesian Theater finish line without operational criteria, the question "When does the experience happen?" is idle. Both sides agree that *some* neural processing occurs between T1 and the report. Labeling the processing before the finish line "pre-conscious" (Stalinesque) versus "conscious but forgotten" (Orwellian) is purely terminological if no independent measure of that finish line exists.

  **The Evidentially Live Component:**
  However, the dispute is **not** entirely idle. It maps onto distinct cognitive architectures with testable functional consequences:
  1.  **Information Availability:** The Stalinesque model implies a temporary information bottleneck where T1 data is inaccessible for report during the integration window. The Orwellian model implies T1 data is accessible immediately but vulnerable to later corruption. The **Interrogative Dual-Report** (Table, Row 4) targets this directly.
  2.  **Interference Profiles:** If the illusion is mnemonic (Orwellian), introducing a cognitive load task *between* the stimulus and the report should disrupt the illusion (preserving veridical memory). If the illusion is perceptual/integrative (Stalinesque), a load task *during* the inter-stimulus interval should disrupt the integration (preventing the motion experience entirely).

  **Conclusion on Idleness:**
  The dispute is verbal only if we restrict ourselves to introspective reports collected after the fact. It becomes evidentially live when we treat "consciousness" as "availability for global broadcast/report" and measure that availability at sub-second intervals. This collaboration proceeds on the assumption that the architectural differences (Buffering vs. Overwriting) yield dissociable behavioral and neural signatures, rendering the question empirically decidable.

  ***

  **Signed,**

  _________________________
  **Dr. A. (Stalinesque)**

  _________________________
  **Dr. B. (Orwellian)**
