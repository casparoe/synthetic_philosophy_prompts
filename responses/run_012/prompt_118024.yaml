prompt: |-
  So I'm a backend engineer, no philosophy training at all, and I've fallen down a rabbit hole on structural realism after a few blog posts and a skim of the encyclopedia entry on it. I think I mostly buy it and I'd like you to try to talk me out of it, or at least tell me what should.

  The version I hold, in my own words: when physics replaces a mature theory, the old equations keep working as a limiting case of the new ones, even when the old picture of what's really there gets thrown out entirely. Fresnel's equations for reflection and refraction came back as a limiting case of Maxwell's, ether gone. So what we actually know when a theory succeeds isn't the furniture, it's the structure. The equations are the API, the ontology is the implementation, you swap the implementation and the API holds. I'll take the strong version: the old equations should survive as a genuine limiting or special case, not just agree with old data to within error bars.

  So what would count against it? Rank the defeaters, fatal down to merely awkward, and be honest about which ones structural realists would concede themselves versus which ones only critics care about. Things I'd want you to hit:

  Cases where the math got junked too. Everybody reaches for the ether, probaly because it's the cleanest. But what about things that were treated as structural and then turned out not to hold at all, like parity in the weak interaction? Is that a broken structure, or does the structural realist get to say symmetries were never part of the structure in the first place?

  The retrofit worry, which is the one that actually scares me. If you only ever identify the preserved structure after you already know the successor theory, aren't you reading it off backwards? In software I can refactor something until not one line survives and the behavior still matches. How do I tell preservation from reconstruction, and if I can't, is the view unfalsifiable? And if it is, is that fatal or just the price of a thesis this general? Related: does it predict anything at all, or is every claim it makes retrospective?

  Whether it quietly collapses into something weaker, like just saying we should trust the predictions we can check. If it does, what's left that's distinctive?

  Whether it only works where there's math. Chemistry and biology don't obviously have an API. Is this a thesis about science or just about physics?

  And the one I'd personally find most convincing against me: a clean case where a theory's central equations were kept for a while and then shown to be an accident that doesn't correspond to anything in the successor, not merely approximate but wrong in a way the limiting-case story can't absorb. Does a case like that exist, or am I asking for something that couldn't exist?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, no philosophy training, technically literate (uses analogies like API/implementation, refactoring), skeptical but intrigued by Structural Realism (SR).
      *   **Topic:** Epistemic Structural Realism (ESR), specifically the version that claims mathematical structure is preserved across theory change, even if ontology changes.
      *   **Goal:** Talk them out of it (or at least provide strong defeaters), rank the objections, distinguish between concessions SR proponents make vs. critic attacks, and address specific concerns (math junked, retrofitting, collapse into instrumentalism, non-physics sciences, "clean case" of broken equations).
      *   **Tone:** Honest, rigorous but accessible (avoiding jargon where possible), respecting the engineering mindset.

  2.  **Deconstruct Structural Realism (SR):**
      *   *Core Claim:* We can't know the *nature* of entities (ontology), but we can know the *relations* between them (structure/math).
      *   *Motivation:* The No Miracles Argument (science works, so it must be true-ish) vs. The Pessimistic Meta-Induction (past theories were false, so current ones probably are too). SR tries to split the difference.
      *   *User's Version:* Strong ESR. Equations survive as limiting cases. Ontology is implementation details.

  3.  **Brainstorming Defeaters/Objections:**
      *   *The "Retrofit" Problem:* Is SR just cherry-picking what survived? (Vickers, Psillos).
      *   *The "Math Junked" Problem:* Did *all* math survive? (Parity, Fresnel vs. Maxwell is good, but what about others?).
      *   *The "Collapse" Problem:* Is SR just instrumentalism in disguise? (If structure = predictions, what's the difference?).
      *   *The "Domain" Problem:* Does this work for biology/chemistry?
      *   *The "Structure of What?" Problem:* Relations need relata. You can't have a dance without dancers. (Ladyman vs. Van Fraassen).
      *   *The "Clean Break" Case:* Is there a theory where the math was *completely* wrong, not just approximate?

  4.  **Addressing Specific User Prompts:**

      *   *Cases where math got junked (Parity):* Parity conservation was a structural assumption (symmetry). It was violated. SR response: "That wasn't essential structure." Critic response: "How do you know beforehand?"
      *   *The Retrofit Worry:* This is the biggest philosophical threat. If you define "structure" *after* the fact, it's not a realist claim, it's a historical observation.
      *   *Collapse into Instrumentalism:* If structure just means "predictive accuracy," SR loses its "Realism" bite.
      *   *Only works with Math:* Biology/Chemistry often rely on models/mechanisms, not just differential equations.
      *   *Clean Case of Broken Equations:* This is the "killer app" request. I need to find a case where the equations didn't survive as a limiting case.

  5.  **Developing the Argument/Ranking:**

      *   *Fatal:* The Retrofit/Selection Bias problem. (If you can't specify the structure *before* the theory change, you aren't doing realism, you're doing history).
      *   *Severe:* The "Relations without Relata" problem. (Metaphysical coherence).
      *   *Significant:* The Collapse into Instrumentalism. (What work is "Realism" doing?).
      *   *Awkward/Limiting:* Non-physics sciences. (SR is very physics-centric).
      *   *Nuanced:* The "Broken Math" cases (Parity, etc.). SR has defenses here, but they look ad hoc.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the intuition. It's a strong intuition for engineers (API vs. Impl). Validate the Fresnel/Maxwell example (it's the classic case).
      *   **Defeater 1: The Retrofit Problem (The Fatal One).** This addresses the "refactoring" analogy. If I refactor code until nothing matches, but behavior is same, did I keep the structure? In code, "structure" is the code itself. In physics, "structure" is the math. If the math changes form (Hamiltonian to Lagrangian to QFT), is it the "same" structure? *Key point:* SR is often retrospective. It doesn't tell you what to believe *now*, only what to believe *later* about *now*.
      *   **Defeater 2: Relations need Relata (The Metaphysical One).** You can't have structure without *things* structured. An API without a server is just a spec. If you deny knowledge of the relata, the structure floats in void. *SR Concession:* Ontic Structural Realism (OSR) says there *are* no relata, only structure. But that's metaphysically weird.
      *   **Defeater 3: Collapse into Instrumentalism (The Identity Crisis).** If "structure" = "predictive equations," how is this different from "Shut up and calculate"? Realism usually implies *truth*. If the structure is just a tool, it's not realism.
      *   **Defeater 4: The "Broken Math" Cases (Addressing Parity).** Parity is a good example. But a better one might be the shift from Classical Mechanics to Quantum Mechanics. The *variables* change (commuting to non-commuting). The phase space structure is fundamentally different. Is QM a "limiting case" of CM? No, CM is the limiting case of QM. But the *structure* of the theory (Hilbert Space vs. Phase Space) is incommensurable.
      *   **Defeater 5: Non-Physics Sciences.** Biology doesn't have fundamental equations. It has mechanisms. SR struggles here.
      *   **The "Clean Break" Case:** I need to be careful here. Most successful theories *do* have limiting cases. But *Quantum Mechanics* vs. *Classical Mechanics* is the strongest candidate for a structural rupture. The logic of propositions changes (Boolean to Non-Boolean).

  7.  **Refining the "Engineer" Analogies:**
      *   API/Implementation is good.
      *   Refactoring is good.
      *   Maybe add: "Interface Segregation."
      *   Maybe add: "Legacy Code."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between Epistemic (ESR) and Ontic (OSR)? The user seems to hold ESR (we *know* structure, not ontology). I should mention OSR as a radicalization that creates new problems.
      *   *Check:* Did I answer the "Parity" question specifically? Yes, need to explain why SR proponents wave that away (it wasn't "essential" structure).
      *   *Check:* Is the tone right? Don't be condescending about the "no philosophy training." Use it as a strength (pragmatic view).
      *   *Check:* The "Fatal" ranking. Philosophers don't agree on what's fatal. I need to frame it as "What kills the *motivation* for SR." The Retrofit problem kills the *epistemic warrant*.

  9.  **Final Polish:** Ensure the distinction between "limiting case" and "structural preservation" is clear. Sometimes the math looks similar but means something totally different (e.g., wave function vs. physical wave).

  **(Self-Correction on the "Clean Break" case):**
  Actually, the transition from Newtonian Gravity to General Relativity is often cited as structural preservation (Poisson eq -> Einstein Field Eq). But the transition from Bohr Model to QM is a better candidate for "junked math." The Bohr orbits are *not* a limiting case of QM orbitals in a straightforward structural sense; they are conceptually incompatible. However, the *correspondence principle* saves it.
  A better candidate for "broken structure" might be **Phlogiston**. But that's ontology.
  What about **Caloric Theory**? Heat as a fluid. The diffusion equation survives, but the "fluid" structure is gone. SR says "See! The equation survived!" Critic says "The equation describes energy flow, not fluid flow. You reinterpreted the terms."
  Let's stick with the **Quantum/Classical logic** shift. That's a structural break in the logic of the theory itself.

  10. **Finalizing the Ranking:**
      1.  Retrofit/Selection Bias (Fatal to epistemic claim).
      2.  Collapse to Instrumentalism (Fatal to realist claim).
      3.  Relations without Relata (Metaphysical awkwardness).
      4.  Domain Limitation (Physics bias).
      5.  Specific Math Breaks (Parity, etc. - SR has defenses here).

