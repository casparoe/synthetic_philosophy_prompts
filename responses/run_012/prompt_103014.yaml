  ### Tier 1: The Genuinely Grounded
  **(e) Instrumental grounding** and **(g) Compositional bootstrapping**

  *   **(e) Instrumental grounding:** This satisfies (i) and (ii) by fixing meaning in objective success conditions of interventions rather than internal states, and it meets (iii) because complex interventions are systematically built from atomic actions.
  *   **(g) Compositional bootstrapping:** This is the only candidate explicitly designed to satisfy (iii) for novel composites, provided one accepts that the 'direct causal coupling' for primitives successfully discharges requirements (i) and (ii) without residue.

  ### Tier 2: Grounded but Structurally Limited
  **(c) Teleosemantic grounding** and **(b) Enactivist grounding**

  *   **(c) Teleosemantic grounding:** While this secures (i) and (ii) via evolutionary history, it fails (iii) because proper functions are indeterminate regarding novel composites that lack a selection history.
  *   **(b) Enactivist grounding:** This placement depends heavily on weighting (iii) against (i) and (ii); it dissolves the homunculus (i) and is purely causal (ii), but it fundamentally rejects the internal compositional structure required to satisfy (iii).

  ### Tier 3: Displaced or Partial Grounding
  **(f) Social-normative grounding** and **(a) Hybrid symbolic–connectionist grounding**

  *   **(f) Social-normative grounding:** This satisfies (ii) and (iii) well, but violates (i) by displacing the homunculus from the individual system to the interpreting community.
  *   **(a) Hybrid symbolic–connectionist grounding:** Although this meets (ii) through sensorimotor training, it fails (i) as connectionist activations require interpretation, and fails (iii) due to the well-documented systematicity deficit in connectionist composites.

  ### Tier 4: Illusory Grounding
  **(d) Distributional grounding**

  *   **(d) Distributional grounding:** This fails (i) and (ii) entirely, as statistical co-occurrence presupposes a corpus selected by an external interpreter and establishes no causal link to the world.

  ***

  ### Sensitivity Analysis

  The candidate whose position is most sensitive to the weighting of the criteria is **(b) Enactivist grounding**. Its placement in Tier 2 rests almost exclusively on the strict enforcement of requirement (iii) regarding compositional structure; if one were to drop (iii) as a condition for genuine grounding, (b) would immediately ascend to Tier 1, arguably surpassing (e) and (g) on the robustness of its solution to (i) and (ii).

  However, the **whole ranking would not invert** if any single requirement were dropped. Even if (iii) were removed, (d) Distributional grounding would remain in the bottom tier because it still fails the no-homunculus (i) and causal interaction (ii) requirements. Similarly, dropping (i) would raise (f) and (a), but not above (e), which satisfies all three. Thus, while the upper tiers are sensitive to the emphasis on compositionality, the fundamental distinction between causal grounding and mere syntax (Tier 4) remains stable.
