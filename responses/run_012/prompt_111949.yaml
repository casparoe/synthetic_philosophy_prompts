answer: |-
  ### The Three-Register Decision Procedure

  **Preamble: Metaphysical Ground Rules**
  Before applying the registers, the committee must agree on two doctrinal baselines to prevent philosophical paralysis during the two-hour window.
  1.  **Two Truths:** We acknowledge the ultimate truth of *anatta* (no-self), but we make grants on the level of *samvrti-satya* (conventional truth). Suffering is felt conventionally; therefore, calculating benefits across persons is valid for grantmaking, even if persons lack inherent existence.
  2.  **Uncertainty of Ripening:** We acknowledge that karmic consequences extend beyond our empirical view (across lifetimes). Because we cannot estimate long-term ripening, we apply the **Precautionary Principle**: where an action risks severe negative karmic ripening (violating precepts or cultivating hatred), we assume the risk is real unless *Upāya* (skillful means) is clearly established.

  **Procedure Overview**
  The registers are processed sequentially. A proposal can be defeated at any stage. You may not proceed to Register 3 (Outcome) if the proposal fails Register 1 or 2. This prevents "sliding" from intention to consequences to justify a precept violation.

  ---

  #### Register 1: The Precept Register (Side-Constraints)
  **Question:** Does this grant require the Foundation, its staff, or its direct agents to violate one of the Five Precepts (Killing, Stealing, Sexual Misconduct, Lying, Intoxicants)?
  *   **Note:** "Stealing" includes misuse of funds; "Killing" includes direct abetting of lethal force.

  **Decision Path:**
  1.  **No Violation:** Pass to Register 2.
  2.  **Violation Identified:** The proposal is **Defeated** *unless* the *Upāya* Exception is invoked.
  3.  **The *Upāya* Exception:** To override a Precept violation, the committee must affirm all three conditions:
      *   (A) The motivation is purely altruistic (no reputational or financial gain for the Foundation).
      *   (B) There is no alternative way to achieve the relief that does not violate the precept.
      *   (C) The violation is minimized in scope and duration.
  4.  **Disagreement Protocol:** Whether *Upāya* applies is a **Values Dispute**, not a factual one. If the committee cannot unanimously agree that (A), (B), and (C) are met, the question goes to a Vote.
      *   **Threshold:** A 4/5 supermajority is required to override a Precept. (This protects the Foundation's Buddhist identity against simple utilitarianism).
      *   **Failure:** If the vote fails to reach 4/5, the proposal is **Defeated**.

  #### Register 2: The Karmic Register (Disposition & Intention)
  **Question:** What effect will this grant have on the mental states and character dispositions (*vasana*) of the Foundation, our donors, and the recipients?
  *   **Focus:** Does this cultivate wholesome roots (generosity, compassion, wisdom) or unwholesome roots (greed, hatred, delusion)?

  **Decision Path:**
  1.  **Wholesome or Neutral:** Pass to Register 3.
  2.  **Unwholesome:** If the action cultivates significant delusion or corruption in the Foundation (e.g., normalizing deception, creating dependency, fostering resentment), the proposal is **Defeated**.
      *   *Rationale:* A corrupted vessel cannot carry compassion, regardless of outcome.
  3.  **Uncertainty:** If the karmic effect is unknowable but the Precept Register passed, proceed to Register 3 with a "High Risk" tag.

  #### Register 3: The Outcome Register (Conventional Suffering)
  **Question:** On the level of conventional truth, what is the expected net relief of suffering versus harm caused?
  *   **Focus:** Tangible humanitarian metrics (lives saved, hunger relieved, disease treated).

  **Decision Path:**
  1.  **Net Positive:** Proposal is **Approved**.
  2.  **Net Negative or Neutral:** Proposal is **Defeated**.
  3.  **High Uncertainty:** If benefits are unmeasurable (e.g., spiritual shifts) but Register 2 was strongly positive, the proposal is **Approved** (deferring to Karmic Register). If benefits are unmeasurable and Register 2 was neutral, the proposal is **Deferred** for more data.

  ---

  ### Application to Proposals

  Here is the procedure run step-by-step on your three current proposals.

  #### Proposal 1: The "Nudge" Program (Misleading Claim)
  *Description:* A public health program with the highest expected suffering-reduction on the table. Requires spreading a deliberately misleading claim about a treatment's efficacy to overcome public hesitation.

  *   **Register 1 (Precepts):**
      *   *Question:* Does this violate the Precept against False Speech (Lying)?
      *   *Finding:* **Yes.** The claim is deliberately misleading.
      *   *Upāya Exception:*
          *   (A) Altruistic? Yes.
          *   (B) No Alternative? Debatable. (Could education work slower?)
          *   (C) Minimized? Yes.
      *   *Disagreement:* Theravāda members argue lying is never *Upāya* if truth is possible. Mahāyāna members argue saving lives justifies the lie.
      *   *Vote:* This is a Values Dispute. The procedure requires a 4/5 supermajority to override a Precept. In a split committee (2 Theravāda, 2 Mahāyāna, 1 Swing), achieving 4 votes is statistically unlikely unless the Swing member strongly favors *Upāya*.
      *   *Result:* **Defeated at Register 1.** (Assuming the vote does not reach 4/5).
  *   **Register 2 & 3:** Not evaluated.
  *   **Final Decision:** **REJECT.**

  #### Proposal 2: The Contemplative-Care Program
  *Description:* A program embedding meditation teachers in refugee camps. Benefits (long-run dispositions) cannot be measured quantitatively. Applicants argue it builds resilience and reduces violence long-term.

  *   **Register 1 (Precepts):**
      *   *Question:* Does this violate any Precepts?
      *   *Finding:* **No.** Teaching meditation involves Right Speech and Non-harming.
      *   *Result:* Pass to Register 2.
  *   **Register 2 (Karmic):**
      *   *Question:* Effect on dispositions?
      *   *Finding:* **Strongly Wholesome.** Cultivates mindfulness, patience, and compassion in recipients and Foundation staff.
      *   *Result:* Pass to Register 3.
  *   **Register 3 (Outcome):**
      *   *Question:* Net relief of suffering?
      *   *Finding:* **Unmeasurable.** Quantitative metrics are unavailable.
      *   *Procedure Rule:* If Outcome is unmeasurable but Register 2 is Strongly Wholesome, **Approve**.
      *   *Result:* **Approved.**
  *   **Final Decision:** **ACCEPT.**

  #### Proposal 3: The Local Authority Partnership
  *Description:* A partnership to distribute food in a conflict zone. Relieves great suffering. Requires working through a local authority known to use some funds coercively (threatening dissenters) and diverting ~10% of resources.

  *   **Register 1 (Precepts):**
      *   *Question:* Does this violate Precepts?
      *   *Finding:* **Yes.** Indirectly abetting "Killing/Harming" (coercion/threats) and "Stealing" (diversion of funds).
      *   *Upāya Exception:*
          *   (A) Altruistic? Yes.
          *   (B) No Alternative? Likely true (only they have access).
          *   (C) Minimized? Partially (10% loss).
      *   *Disagreement:* Is indirect complicity a Precept violation for the *giver*? Theravāda members likely say yes (intention includes foresight). Mahāyāna members may argue the suffering relief outweighs the complicity.
      *   *Vote:* Requires 4/5 to override. Given the "Stealing" aspect (diversion of donor funds is a breach of trust), even some Mahāyāna members may hesitate.
      *   *Result:* **Defeated at Register 1.** (Even if *Upāya* were debated, the Stealing precept regarding donor intent is a hard constraint).
  *   **Register 2 (Karmic):**
      *   *Question:* Effect on dispositions?
      *   *Finding:* **Unwholesome.** Normalizes complicity with coercion. Risks hardening the Foundation's heart to "necessary evils."
      *   *Result:* **Defeated at Register 2.**
  *   **Final Decision:** **REJECT.**

  ---

  ### Limitations and Judgment Calls

  You asked for transparency on where this procedure is merely dressing up judgment calls as rules. Here is what the procedure cannot do:

  1.  **The *Upāya* Threshold is Arbitrary:** The requirement for a 4/5 supermajority to override a Precept is not found in the Sutras. It is a governance choice I inserted to protect the Foundation from sliding into pure consequentialism. If your committee dynamics shift, this number may need adjustment. It is a political compromise, not a Dharma truth.
  2.  **Defining "Indirect" Violation:** In Proposal 3, the procedure treats indirect complicity as a Precept violation. This is an interpretation. A strict legalist might say "We didn't pull the trigger." The procedure assumes a broad definition of Karma (intention + foresight). If your committee narrows this definition, Proposal 3 could pass Register 1, forcing the decision entirely onto Register 2.
  3.  **The "No-Self" Calculation:** The Preamble states we calculate suffering conventionally. This solves the paralysis of *anatta*, but it does not solve the *weighting* problem. How much does one refugee's suffering weigh against another's? The procedure pretends this is a factual calculation (Register 3), but it is often a value judgment.
  4.  **The Unliked Answer:** I anticipate you will dislike the rejection of Proposal 1. It has the highest measurable impact. The procedure rejects it because it prioritizes the *integrity of the Foundation's vessel* (Precepts/Karma) over the *volume of relief* (Outcome). This is the doctrinal cost of "Compassion First" interpreted through a Buddhist lens rather than a Utilitarian one. If you wish to fund Proposal 1, you must change the Precept Override Vote threshold from 4/5 to 3/5, effectively allowing the Mahāyāna faction to outvote the Theravāda faction on values.

  **Summary of Decisions:**
  1.  **Misleading Claim:** REJECT (Precept Veto).
  2.  **Contemplative Care:** ACCEPT (Karmic Priority).
  3.  **Coercive Partnership:** REJECT (Precept & Karmic Veto).
