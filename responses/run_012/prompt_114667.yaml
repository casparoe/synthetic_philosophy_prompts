answer: |-
  You have hit on one of the most common and understandable points of confusion in game theory. Your intuition is sharp: Iterated Elimination of Dominated Strategies (IEDS) *feels* like it should be enough because it relies on the most basic axiom of economics (don't shoot yourself in the foot).

  However, your study group is half-right and half-wrong. Mixed-strategy dominance is not just a technicality, but it also doesn't "crack the game wide open" in the way a unique solution would.

  Here is the untangling you asked for, breaking down exactly what IEDS does, where mixed strategies fit in, and why we still need Nash Equilibrium.

  ### 1. The Hierarchy: Rationalizability vs. Nash
  To answer your question about whether Nash is just "where elimination bottoms out," we need a specific term for the set of strategies that survive IEDS. That term is **Rationalizable Strategies**.

  *   **IEDS (The Process):** You delete strategies that are never a best response to *any* belief about what the opponent might do.
  *   **Rationalizability (The Result):** The set of strategies remaining after you can no longer delete anything.
  *   **Nash Equilibrium (The Subset):** A specific profile within the rationalizable set where beliefs are *correct*.

  **The Crucial Distinction:**
  In many games, IEDS bottoms out with *multiple* strategies remaining for each player. Nash Equilibrium is a way to select specific points within that remainder.
  *   **Example:** In *Battle of the Sexes* (Opera vs. Football), no strategy is dominated. IEDS eliminates nothing. The "bottom" of IEDS is the entire game. Yet, there are two pure Nash Equilibria.
  *   **Example:** In *Matching Pennies*, no strategy is dominated (even by mixes). IEDS eliminates nothing. But there is a unique *Mixed Strategy* Nash Equilibrium.

  So, Nash is **not** where elimination bottoms out. Nash is a stability condition imposed *on top of* the strategies that survived elimination.

  ### 2. Pure vs. Mixed Dominance: Is it just a technicality?
  Your study group argued that a strategy can be dominated by a mix even if no pure strategy dominates it. **They are correct, and this is not just a technicality.** It fundamentally changes the set of rationalizable strategies.

  Consider this payoff matrix for the Row Player (Column player's payoffs don't matter for this example):

  | | Col L | Col R |
  | :--- | :---: | :---: |
  | **Row T** | 4 | 0 |
  | **Row M** | 0 | 4 |
  | **Row B** | 1 | 1 |

  **Pure Strategy Check:**
  *   Is **B** dominated by **T**? No. If Col plays R, B (1) is better than T (0).
  *   Is **B** dominated by **M**? No. If Col plays L, B (1) is better than M (0).
  *   **Result:** If you only look for pure-strategy dominance, **B survives**.

  **Mixed Strategy Check:**
  *   Consider a mixed strategy: Play **T** with 50% probability and **M** with 50% probability.
  *   If Col plays L: Expected payoff = $0.5(4) + 0.5(0) = 2$.
  *   If Col plays R: Expected payoff = $0.5(0) + 0.5(4) = 2$.
  *   Compare to **B**: **B** always yields 1.
  *   **Result:** Since $2 > 1$ in all cases, **B is strictly dominated by the mixed strategy**. **B is eliminated.**

  **Why this matters:**
  If you ignore mixed dominance, you conclude that playing **B** is "rationalizable" (i.e., it's not crazy to play B if you have some weird belief about the opponent). If you *include* mixed dominance, you conclude that playing **B** is irrational under *any* belief.
  Allowing mixed strategies in the elimination process makes the "No" louder. It shrinks the set of rationalizable strategies further than pure elimination alone. **It does not guarantee a unique answer, but it gets you closer.**

  ### 3. Does IEDS Deliver a Unique Prediction?
  You asked: *"For each reading, does it actually deliver a unique prediction... or does it just shrink the game and leave you guessing?"*

  This depends entirely on the game class.

  **A. Dominance Solvable Games (Unique Prediction)**
  In some games, IEDS eliminates everything but one strategy for each player.
  *   *Example:* The "Guess 2/3 of the Average" game.
  *   *Outcome:* IEDS yields a unique solution. Here, you don't need Nash. IEDS tells you exactly what to do.
  *   *Role of Mixed Dominance:* In these games, allowing mixed dominance might speed up the convergence, but the final unique result is usually the same.

  **B. Non-Dominance Solvable Games (Shrinking + Guessing)**
  In most interesting strategic situations (Coordination, Chicken, Poker), IEDS stalls.
  *   *Outcome:* You are left with a subset of strategies (the Rationalizable set). You know what *not* to play, but you don't know what *to* play.
  *   *Role of Nash:* Nash Equilibrium is the tool we use when IEDS stalls. It says, "Okay, we've eliminated the crazy stuff. Now, let's find a pair of strategies where, if I expect you to play this, I want to play this, and vice versa."

  ### 4. "Rules Out" vs. "Tells You What To Do"
  This is the insight your study group is missing.

  *   **IEDS is Negative:** It is a procedure for discarding options. It relies on **Common Knowledge of Rationality**. (I know you are rational, you know I am rational, I know you know I am rational...). It tells you: "Whatever happens, these strategies will not be played."
  *   **Nash is Positive:** It is a consistency condition. It relies on **Correct Beliefs**. It tells you: "If we coordinate on this outcome, neither of us has an incentive to leave."

  **The Gap:**
  There are often strategies that survive IEDS (they are rationalizable) but are *not* part of any Nash Equilibrium.
  *   *Wait, isn't every NE rationalizable?* Yes.
  *   *Is every rationalizable strategy part of an NE?* **No.**
      *   In some games, you can have a strategy that is a best response to a belief, and that belief is a best response to a belief... but the chain never closes into a loop of *correct* beliefs.
      *   However, in 2-player games, the set of rationalizable strategies is exactly the set of strategies that survive IEDS (Bernheim 1984, Pearce 1984). In 3+ player games, Rationalizability is actually a *larger* set than the strategies surviving IEDS if we allow for correlated beliefs. (This is a deep technical rabbit hole, but worth noting: IEDS is sometimes *too* aggressive or *not* aggressive enough depending on how players correlate beliefs).

  ### 5. Why bother with Nash machinery?
  If IEDS is the "toolkit for rationality," why do textbooks spend 80% of the time on Nash?

  1.  **IEDS often fails to predict.** As noted, in Coordination games, IEDS eliminates nothing. Nash at least identifies the stable points (even if there are two of them).
  2.  **Stability vs. Rationality.** Rationality (IEDS) just means you aren't stupid. Equilibrium (Nash) means the system is at rest. You can be rational and still be in a disequilibrium (e.g., two drivers swerving toward each other, both reacting rationally to the other's current position, but crashing). Nash describes the crash-avoidance coordination, not just the steering logic.
  3.  **Mixed Equilibrium.** In zero-sum games like Matching Pennies, IEDS (even with mixed dominance) eliminates nothing. The only prediction game theory offers is the Mixed Strategy Nash Equilibrium. Without NE machinery, you have *no* prediction for zero-sum games without saddle points.

  ### Summary for your Study Group
  Here is how you can frame this to untangle the confusion:

  1.  **Mixed Dominance is Real:** It is not a technicality. A strategy dominated by a lottery is irrational, even if not dominated by any single ticket. Using mixed dominance shrinks the "Rationalizable Set" more than pure dominance does.
  2.  **IEDS $\neq$ Nash:** IEDS bottoms out at the set of **Rationalizable Strategies**. Nash Equilibria are a subset of that. In many games, the Rationalizable Set is huge, and Nash picks out specific stable points within it.
  3.  **Negative vs. Positive:** IEDS tells you what **won't** happen (Don't play dominated strategies). Nash tells you what **could** persist (Play best responses to each other).
  4.  **Uniqueness:** Mixed dominance helps uniqueness only in "Dominance Solvable" games. In most games, it just leaves you with a smaller menu of options, requiring Nash (or refinements of Nash) to make a final selection.

  **The Verdict:** Your suspicion is correct that IEDS is the more fundamental "rationality" test. But your group is wrong that it solves the game. It clears the debris; Nash Equilibrium is the blueprint for the building that might stand on the cleared land. Sometimes nothing stands (no pure NE), sometimes multiple things stand (multiple NE), but IEDS just ensures you aren't building on a swamp.
