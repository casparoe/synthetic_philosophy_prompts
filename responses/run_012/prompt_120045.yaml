answer: |-
  (1) 'The short answer'
  You have rediscovered the **Small Improvement Argument**, a standard tool in value theory used to demonstrate **incomparability**. The phenomenon is not sloppy arithmetic; it is a logical challenge to the "Trichotomy Thesis," which claims that for any two options, one must be better, worse, or equal. Your intuition is correct: if A and B were truly equal, A+ (strictly better than A) would have to be better than B. Since A+ is not better than B, A and B were never equal; they stand in a fourth relation where they are comparable but not rankable.

  This already has an established name, though terminology varies. Philosophers like Joseph Raz call it **incommensurability** (lack of a common metric), while Ruth Chang argues for **parity** (a positive fourth relation distinct from equality). Decision theorists often call it **incomplete preferences**. You do not need to coin a term, but you do need to distinguish it from simple uncertainty. The puzzle is not that you lack information; it is that the value relation itself does not support a ranking.

  (2) 'The menu'
  **The Vagueness (Epistemic) View:** This reading claims the comparison *does* have a determinate answer (A is slightly worse than B, or equal), but the difference is too small for you to detect. Regarding your A+ case, this view insists A+ *is* strictly better than B, but the improvement is below your threshold of perception. It saves standard decision theory but contradicts your strong intuition that A+ still doesn't beat B.

  **The Incommensurability (No Metric) View:** This claims A and B belong to different categories of value (e.g., money vs. integrity) with no common unit of measurement. A+ adds more of A's unit, but since B isn't measured in that unit, the addition doesn't register in the comparison. It explains why A+ doesn't beat B, but it risks implying A and B can't be compared *at all*, whereas you feel they are competitors.

  **The Parity (Fourth Relation) View:** This claims "neither better, nor worse, nor equal" is a sui generis relation called "being on a par." A and B are in the same "neighborhood" of value. A+ is better than A, but both remain in the same neighborhood as B, so A+ is still on a par with B. This preserves your intuition that they are comparable competitors without forcing a ranking or collapsing into equality.

  (3) 'Settled vs contested'
  **Settled (General Consensus):**
  *   The Small Improvement Argument is logically valid against the Trichotomy Thesis.
  *   This phenomenon is distinct from epistemic uncertainty (not knowing the values) or indeterminacy (values not yet formed).
  *   [Consensus] The money-pump problem is a separate question regarding dynamic rationality, not the static value relation you described.

  **Contested (Genuine Disagreement):**
  *   [Disputed] Whether incomparability is ontological (a feature of the world) or conceptual (a feature of our language).
  *   [Disputed] Whether rational agents are permitted to have incomplete preferences (some argue rationality requires a complete ranking to avoid paralysis).
  *   [Camp-Specific] Defenders of Trichotomy argue your intuition about A+ is wrong; if you prefer A+ to A, and are indifferent between A and B, you *must* prefer A+ to B [Transitivity Camp].

  (4) 'My pick'
  The **Parity** reading handles your case best because it respects the phenomenology of hard choices without demanding a hidden precision that isn't there. It explains why A+ doesn't trump B: small improvements don't shift an option out of its value neighborhood. The cost is theoretical complexity; standard utility functions cannot represent parity without modification (e.g., using sets of functions or interval orders), and it complicates decision rules for rational choice, requiring you to accept that rationality sometimes permits arbitrary selection between on-par options.

  (5) 'Boundary cases'
  Since "Parity" is the established term, I will define its boundaries rather than coin a new one. **Parity** applies when two options are comparable (you can deliberate between them) but no positive value relation (better, worse, equal) holds, and small improvements fail to break the tie.

  *   **Inside the boundary:** Choosing between a career as a lawyer and a career as a clarinetist. One offers security, the other art; improving the lawyer's salary slightly doesn't automatically make it better than the clarinetist.
  *   **Outside the boundary:** Choosing between $10 and $100. These are fully commensurable on a single scale; a small improvement to the $10 (making it $11) does not change the fact that $100 is strictly better. This is a standard ranking, not parity.
