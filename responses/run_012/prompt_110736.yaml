answer: |-
  **Interview Questions for [Guest Name]**

  **1.** You argue that Lakatos's Methodology of Scientific Research Programmes (MSRP) should be a tool for working scientists, not just historians. But historians have the luxury of knowing which anomalies mattered. Why should a physicist in the lab, facing a recalcitrant apparatus, care about a philosophical metric that historians couldn't agree on for fifty years?

  **2.** Your revision hinges on a "ratio test": testable consequences added versus auxiliary assumptions added. In standard Lakatos, the "novel fact" is the gold standard. Why replace a binary condition (did you predict something new?) with a ratio that requires quantifying theoretical complexity?

  **3.** **[Matter 1: Real-Time Availability]** You insist this test is applicable in real time. But in experimental work, a "testable consequence" is often just a promise until the apparatus is built and calibrated. How do you count the consequences of a modification *before* any of them have been empirically settled? Doesn't that count rely on a judgment only the future can verify?

  **4.** **[Follow-up to Q3]** *Anticipating she will argue that "theoretical derivability" is sufficient for the count:* If two competing groups derive different counts from the same modification—one claiming three independent tests, the other claiming only one—does your methodology offer an arbiter? Or does the ratio dissolve into a sociological dispute about what counts as "independent"?

  **5.** **[Matter 2: Case Studies]** Let's apply this to a concrete history. Consider the contraction and drag hypotheses invented to keep the luminiferous aether alive. By your ratio, was that programme degenerating in the 1890s, or was it progressive because it kept generating mathematical consequences?

  **6.** **[Follow-up to Q5]** *Anticipating she will say it was degenerating:* If it was degenerating, then Lorentz and Fitzgerald were being irrational by your lights. Yet their mathematics survived into Special Relativity. If your test condemns work that turns out to be partially vindicated, is the test a guide to rationality, or just a guess about which core will survive?

  **7.** **[Matter 2: Case Studies - Contemporary]** Closer to my own field: consider the search for supersymmetry at the LHC. Naturalness arguments made low-mass partners probable; when they weren't found, parameters were adjusted to push the mass higher. By your ratio, is the SUSY programme currently degenerating?

  **8.** **[Follow-up to Q7]** *Anticipating she will say yes, it is degenerating:* If SUSY is found at a future higher-energy collider, does that retroactively make the last decade of "degenerating" work progressive? If yes, isn't your "real-time" test just hindsight in disguise? If no, then what value does it have to the physicists currently doing the work?

  **9.** **[Matter 3: Status of Amendment]** Is your Ratio Test a modification of Lakatos's protective belt—saving the hard core of MSRP—or are you proposing a change to the hard core itself?

  **10.** **[Follow-up to Q9]** *Anticipating she will claim it saves the hard core:* Then apply your own test to your current research programme. Has your book added more independently testable consequences to the philosophy of science, or more auxiliary assumptions to save Lakatos from his critics?

  **11.** **[Standard Objection: Underdetermination]** A standard objection to Lakatos is underdetermination: when a prediction fails, logic doesn't tell us whether to blame the hard core or the protective belt. You imply your ratio helps decide. When a test fails, how does a scientist know which strand of the belt to cut without waiting for history to judge?

  **12.** **[Closing/Practical]** For the graduate students listening: if your test suggests a programme is degenerating, but their advisor insists it is progressive, who is methodologically accountable if the student abandons the project and it later succeeds? Would you tell them to trust the ratio or their supervisor?

  ***

  **Methodological Note:**
  *There is no obvious misunderstanding in your summary of her position to warrant a correction note. However, be prepared for her to deflect Q3 and Q4 by shifting from "empirical testability" to "theoretical consistency." She may argue that independence is a logical property of the equations, not the data. If she does this, press her on whether a purely logical ratio can ever constrain physical theory, given that nature is not bound by our aesthetic preferences for simplicity.*
