          *   Evaluate the "k-step" fix.
          *   Address the issue of logical truths vs. consequences.
          *   Address implicit vs. explicit knowledge.
          *   Diagnose framing errors rather than just listing literature solutions.
      *   **Tone:** Expert in philosophical logic and epistemology of reasoning. Rigorous, critical, but supportive of philosophical inquiry.

  2.  **Deconstruct the Problem of Logical Omniscience (PLO):**
