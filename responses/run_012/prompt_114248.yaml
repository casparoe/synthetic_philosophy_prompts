answer: |-
  You have correctly identified a fracture in standard decision theory, and your intuition that "information avoidance" is too broad a bucket is shared by behavioral economists and philosophers who study this exact problem.

  The decision-theoretic result you are half-remembering is the **Value of Information (VoI) theorem** (often associated with Blackwell's Theorem, 1951). It states that for a rational agent, the expected utility of free information is always non-negative. The logic is exactly as you described: if the information suggests a change in action, you change; if it suggests no change, you ignore it. Therefore, you are never worse off.

  However, this theorem relies on a hidden assumption: **Consequentialism**. It assumes your utility function depends *only* on the state of the world and your actions within it ($U(action, state)$). It assumes you do not care about the *belief state* itself.

  Your four examples violate this assumption. In each case, the utility function includes the belief itself ($U(action, state, belief)$). Knowing the truth changes the "texture" of your existence (anxiety, ruined suspense, shattered identity) regardless of what you *do*.

  ### The Established Name

  The specific carving you are looking for is established in the behavioral economics literature (most notably by Golman & Loewenstein, 2016) as **Hedonic Information Avoidance**.

  While "Information Avoidance" is the genus, it is indeed divided into three distinct species. Your "residue" is the third one:

  1.  **Instrumental Avoidance:** You avoid information because it would force a costly action (e.g., the doctor who doesn't want to order a test that would require a difficult surgery). This obeys standard VoI; the "cost" is the action, not the knowledge.
  2.  **Strategic Avoidance:** You avoid information to maintain plausible deniability or bargaining power (e.g., the negotiator). This is game-theoretic; the cost is social or strategic.
  3.  **Hedonic Avoidance:** You avoid information because the *consumption* of the belief itself yields negative utility. This is your category. It includes the genetic test (dread), the stock account (anxiety), the father's papers (identity disruption), and the spoilers (ruined anticipation).

  ### The Carving: What is Being Avoided?

  To answer your request for the "carving" rather than just the label: The phenomenon is **Direct Disutility from Belief Revision**.

  In standard theory, beliefs are tools for navigating the world. In Hedonic Avoidance, beliefs are *objects of consumption*.
  *   **The Genetic Test:** You are avoiding **Dread**. You are paying a "tax" of ignorance to purchase hope.
  *   **The Stock Account:** You are avoiding **Anxiety**. You are prioritizing emotional stability over portfolio optimization.
  *   **The Father's Papers:** You are avoiding **Identity Disruption**. The current narrative of your life has value; a new fact could devalue that narrative without changing your material circumstances.
  *   **The Spoilers:** You are avoiding **Lost Anticipation**. Here, the utility is not in the *truth* but in the *process of discovering* the truth.

  ### Distinctions

  You asked how this differs from risk aversion and incuriosity.

  **1. Vs. Risk Aversion**
  Risk aversion is a preference over the *variance of outcomes*. A risk-averse person prefers a guaranteed \$50 to a 50% chance of \$100.
  Hedonic Information Avoidance is a preference over the *variance of beliefs*.
  *   *Example:* In the genetic test case, the physical outcome (having the gene or not) is already determined. There is no "risk" in the probabilistic sense. The risk is entirely epistemic: the risk of *knowing*. A risk-averse person might still take the test to prepare; a hedonic avoider refuses it to preserve their current mental state.

  **2. Vs. Incuriosity**
  Incuriosity implies the information has *zero* value to you. You don't care about the weather on Mars.
  Hedonic Avoidance implies the information has *negative* value. You care deeply about the genetic result, precisely *because* it matters so much that knowing it would hurt. Incuriosity is indifference; Hedonic Avoidance is active protection.

  ### Why the Decision Theory Result Fails

  The VoI theorem fails here because it assumes **Separability of Belief and Utility**.
  *   **Standard Model:** $Utility = f(World\_State, Action)$
  *   **Your Cases:** $Utility = f(World\_State, Action, Knowledge\_State)$

  When $Knowledge\_State$ is an argument in the utility function, information is no longer a free tool; it is a good (or bad) in itself. If the information is a "bad" (like a spoiler or a diagnosis), and it costs nothing to avoid, a rational agent *should* avoid it. The "irrationality" is only apparent if you insist on a consequentialist model of human welfare.

  ### A Coined Term for the "Residue"

  While **Hedonic Information Avoidance** is the academic term, it feels slightly clinical for the philosophical weight you are assigning it. If you wish to coin a term that captures the *ontological* status of this ignorance—where the ignorance is not a lack, but a protective structure—I propose:

  **Constitutive Ignorance**

  *   **Definition:** A state of unknowing that is a necessary component of an agent's well-being, such that acquiring the knowledge would diminish welfare without altering the material state of the world.
  *   **Edges:**
      *   *Falls Inside:* The genetic test (ignorance constitutes hope), the spoilers (ignorance constitutes suspense), the father's papers (ignorance constitutes narrative continuity).
      *   *Falls Outside:* Strategic ignorance (ignorance constitutes *leverage*, not well-being), Instrumental avoidance (ignorance constitutes *inaction*, not well-being), and simple lack of access (you don't know the number of grains of sand on a beach, but knowing wouldn't hurt you).

  ### Summary

  You are not missing a concept; you are noticing where standard rational choice theory bumps into the psychology of belief. The established term is **Hedonic Information Avoidance**, grounded in models of **Utility from Beliefs** (or Anticipatory Utility).

  The "result" you remembered is correct *only* for instrumental rationality. For experiential rationality, free information can indeed have negative value. You are protecting not your decisions, but your **experience of the world**. In these cases, ignorance is not a deficit; it is a resource.
