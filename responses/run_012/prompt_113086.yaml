answer: |-
  Good evening.

  Forty years is a long time to count the dead.

  Looking around this room, I see the two groups of people who made that possible. On one side, the researchers. People who can smell a bad denominator from across a banquet hall. People who know that a number without a source is just a rumor with a spreadsheet. On the other side, the donors and the families of those who started this institute. You who believed that counting was an act of care.

  Usually, at an anniversary like this, the speaker is supposed to tell you that the world is getting better. Or, perhaps, that the work is so urgent because the world is getting worse.

  I am not going to do either.

  Because after forty years, the most important thing this institute has taught us is that "violence" is not a single quantity. It is not a thermometer that goes up or down. It is a mixing desk. It is a row of dials, and the direction of the trend depends entirely on where you set your hand.

  If you set the dial to "raw body counts," the last century looks like a precipice. The population grew, and so did the carnage. But if you turn the dial to "deaths per capita," the slope changes. The risk to an individual human being shifts.

  If you set the dial to "organized war," you see one history. If you turn it to "homicide," or "domestic violence," you see another. A decline in battlefields does not always mean a decline in bloodshed; sometimes the blood just moves indoors.

  And then there is the dial of time. A war that kills mostly the elderly and a war that kills mostly the young are not the same event, even if the body count is identical. One steals memories; the other steals futures. If you measure "years of life lost" rather than "breaths stopped," the geometry of violence changes again.

  And we must acknowledge the harm that never leaves a corpse. The trauma that ripples through generations. The freedom that is lost because fear keeps you inside. If you count only the dead, you are counting the silence, but not the thing that caused it.

  Perhaps most dangerously, there is the dial of averages. We love an average. It comforts us. But in conflict research, the average is hostage to the tail. A single bad decade can dominate a century's total. One spike can erase a hundred years of gradual decline. If you smooth the curve, you see progress. If you look at the spike, you see catastrophe. Both are true.

  So, where does that leave us? If the trend's sign moves with the dial, is there any fact of the matter underneath? Is it all just framing?

  No.

  That is the trap. To say "it depends on how you count" is not to say "nothing matters."

  The pain is real. The loss is objective. The fact of the matter is not a single number telling us we are safe or unsafe. The fact of the matter is that violence is complex, and it hides. It shifts shape when we look away. It moves from the battlefield to the home, from the bullet to the blockade, from the body to the mind.

  The truth underneath the choices is this: Violence is not a weather pattern we wait out. It is a structure we build, and therefore, a structure we can dismantle. But we cannot dismantle it if we are looking at the wrong dial.

  This is why this institute exists. And this is why your work matters.

  To the researchers: Your job is not to give the donors a comforting headline. Your job is to keep the dials calibrated. To refuse to let the complexity be smoothed over. To ensure that when we say "violence is down," we know exactly what we are buying with that statement, and what we are ignoring.

  To the donors and the families: You did not fund this institute to hear a lullaby. You funded it to turn on the lights. You enabled the rigor that refuses to let us lie to ourselves about the state of the world. There is no greater warmth than the heat generated by friction against the truth.

  Forty years ago, someone decided that the dead deserved to be counted accurately. That was a moral choice, not just a mathematical one.

  So, is violence going up or down? The answer is: Yes. It is doing both, in different places, measured by different rulers.

  But because you are here, because this work continues, we are no longer guessing in the dark. We know where the dials are. We know how to read the board. And that clarity is the only solid ground we have to stand on.

  Thank you for forty years of clear eyes. And here is to the next forty.
