answer: |-
  **Exam Question**

  Standard debates about school choice often talk past one another because they assume different things about what education actually is. In your essay, distinguish between three views: (1) education as a private service that benefits the buyer and accidentally helps others; (2) education as a ranking system where one family's gain is another's loss; and (3) education as a shared project that weakens for everyone if too many people opt out. Analyze how common arguments for or against homeschooling and private schooling depend on these specific views, and note which arguments would collapse if their underlying view were disproven. Finally, argue whether parental authority over education is more like a trustee managing assets for a beneficiary or an owner disposing of private property, and explain what your chosen view implies about whether the state should impose requirements on homeschoolers. (20 marks)

  ***

  **Model Answer**

  Education is rarely treated as a single thing in policy debates, which causes confusion. The first view sees education as a private good, like buying a tutor. Here, the family pays for a service to improve their child, and society might benefit later if that child becomes a productive worker. Arguments based on this view focus on efficiency and outcomes, such as the claim that homeschooling allows for personalized learning that raises test scores. If evidence showed homeschooling did not raise scores, this argument would collapse, because the value was tied entirely to the measurable output.

  The second view treats education as a positional good, essentially a race for limited spots at top universities or jobs. In this picture, one family's gain is another's loss because ranking is relative. Arguments here often worry that private schooling allows wealthy families to buy advantage, locking others out. If everyone could suddenly access elite schooling, this argument would vanish, because the scarcity driving the competition would be gone. Many defenses of public schooling rely on this view, arguing that choice fragments the system and lets some pull ahead unfairly.

  The third view sees education as a common project, where the quality depends on who participates. This assumes that when engaged families leave the public system, the remaining community loses something vital, not just money. Arguments against homeschooling often lean on this, claiming it drains civic cohesion or reduces peer diversity. However, if community bonds were maintained outside schools, this argument would weaken. Conversely, school choice advocates often ignore this, assuming their exit harms no one, which is incorrect if education relies on collective participation.

  Regarding authority, parents should be viewed as trustees, not owners. An owner can do what they like with their property, but a trustee must act in the best interest of the beneficiary, the child. Education belongs to the child's future, not the parent's preference. If parents are trustees, they have discretion to choose the method, but they must prove they are fulfilling their duty.

  This view implies that homeschooling should be subject to outside requirements. Because the authority is held on behalf of the child, the state has a right to ensure the trust is not being abused. Regulations should not dictate curriculum like a boss, but verify learning like an auditor. Without this, the trustee model fails, and the child's interest becomes secondary to the parent's ownership claim. Therefore, choice is permissible, but accountability is mandatory to protect the beneficiary of the education.

  ***

  **Marking Scheme**

  1. The answer must clearly define the three conceptions of education in plain language without using economic jargon, earning 4 marks if all three are distinct or 0 if they are conflated.
  2. The student must map specific standard arguments to these conceptions, earning 4 marks for correct alignment or 0 if arguments are listed without linking them to a underlying view.
  3. The response must test the robustness of these arguments by stating which would fail if their underlying conception were disproven, earning 4 marks for insight or 0 for mere description.
  4. The essay must commit to either the trustee or owner model of parental authority and justify the choice, earning 4 marks for a clear stance or 0 if the distinction is ignored.
  5. The conclusion must derive a specific position on state regulation of homeschooling from the chosen authority model, earning 4 marks for logical consistency or 0 if the regulation view contradicts the authority view.
