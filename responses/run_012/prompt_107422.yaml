prompt: |-
  I serve on the advisory board of a small research center on mass atrocities. We can support roughly four people for three years, and we have deliberately chosen to fund conceptual and normative work rather than fieldwork, case documentation, or quantitative conflict research. What I need from you is a defended research agenda: which open questions in this area deserve the money, and in what order, with the reasoning made explicit.

  Two clusters keep dominating our board discussions. The first concerns what the category 'genocide' is actually for. It began as a moral and political diagnosis of a distinctive wrong, was later hardened into a legal offense with a demanding mental element, and is now used at once as a finding by tribunals, a verdict by historians, and a speech act by states and activists; these roles pull in different directions, and it is unclear whether a single definition can serve all of them. The second concerns the recurring politics of naming: whether an atrocity is called genocide often seems to depend less on the facts than on who is doing the naming and what duties the label would trigger, and yet the label is also supposed to track something real and independent of the namer.

  I want two proposed reframings treated as serious candidates rather than curiosities, because they are the reason I am asking. The first is that the operative idea of destroying a protected group as a group should be replaced or supplemented by an account on which the distinctive wrong is the destruction of a group's conditions of social existence, so that forced assimilation, the suppression of a language, and the dismantling of a group's institutions could count even in the absence of mass killing. The second is that the deepest problem is not the definition but the act of naming itself, and that the productive questions are about when such an act should be performed, by whom, with what authority, and what it allocates -- standing, duties to intervene, permission to use force, or merely memory.

  Please prioritize the open questions in this area and defend the ordering. Use criteria such as how upstream a question is (how many other questions depend on settling it), how tractable it is for conceptual and normative researchers rather than lawyers or empiricists, how neglected it is relative to its importance, and how much the answer would actually change practice. Say which questions you would deprioritize because their answer would not change much downstream. For each top question, say what evidence or argument over the next few years would move it up or down the list.

  Finally, be explicit about the state of play: separate what is genuinely settled among people who work on this from what is contested, and do not present a contested position as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Context:** Advisory board member of a small research center on mass atrocities.
      *   **Resources:** Funding for ~4 people for 3 years (small but focused).
      *   **Focus:** Conceptual and normative work (NOT fieldwork, documentation, or quantitative research).
      *   **Core Task:** Provide a *defended research agenda* (prioritized open questions, ordering, reasoning).
      *   **Specific Clusters to Address:**
          1.  The function of the category 'genocide' (moral vs. legal vs. political vs. historical).
          2.  The politics of naming (facts vs. power/interests).
      *   **Specific Reframings to Treat Seriously:**
          1.  *Social Existence Reframing:* Shift from physical/biological destruction to destruction of conditions of social existence (forced assimilation, cultural destruction).
          2.  *Speech Act/Performative Reframing:* Focus on the act of naming itself (authority, allocation of duties/standing) rather than the definition.
      *   **Criteria for Prioritization:** Upstream dependency, tractability for conceptual/normative researchers, neglectedness vs. importance, impact on practice.
      *   **Requirement:** Explicitly state what is settled vs. contested.
      *   **Requirement:** Identify what would move questions up/down the list (evidence/arguments).
      *   **Requirement:** Identify deprioritized questions.

  2.  **Deconstruct the Field (State of Play):**
      *   *Settled:* The 1948 UN Genocide Convention (UNGC) definition is the legal standard. Mass killing is not strictly required (serious bodily/mental harm, conditions of life calculated to bring about destruction). Intent (dolus specialis) is crucial and hard to prove. Prevention is better than punishment (in theory).
      *   *Contested:* The scope of "protected groups" (political? gender?). The threshold of "destruction" (partial? substantial?). The tension between legal precision and moral urgency. The role of "cultural genocide" (excluded from UNGC). Who has the authority to name? Does naming trigger intervention or paralysis?
      *   *The Two Reframings:*
          1.  *Social Existence:* Aligns with Lemkin's original broader view but clashes with the UNGC's compromise. Gaining traction in sociology and critical legal studies.
          2.  *Speech Act:* Aligns with political theory and pragmatics. Shifts focus from ontology to performativity.

  3.  **Develop the Research Agenda (Prioritization Strategy):**
      *   *Constraint:* 4 people, 3 years. This is very tight. We cannot solve everything. We need high-leverage conceptual work.
      *   *Logic:* You can't decide *who* should name (Reframing 2) until you know *what* they are naming (Reframing 1). However, if the definition is hopelessly fractured, the "who" becomes more important than the "what."
      *   *Decision:* The *function* of the concept is the most upstream question. If we don't know what the concept is *for*, we can't refine the definition or the naming procedure.
      *   *Priority 1:* The Functional Fragmentation Problem (Cluster 1).
      *   *Priority 2:* The Social Existence Reframing (Reframing 1). This addresses the "what."
      *   *Priority 3:* The Politics of Naming/Authority (Reframing 2). This addresses the "who" and "how."
      *   *Deprioritized:* Legal technicalities of specific tribunals (too narrow), quantitative risk modeling (out of scope), historical case re-litigation (out of scope).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraints and the strategic choice of conceptual work.
      *   **State of Play:** Clearly distinguish consensus from contestation. (Crucial for credibility).
      *   **The Research Agenda (Prioritized):**
          *   *Q1 (Top Priority):* Functional Pluralism vs. Unity. Can one concept serve law, morals, and politics?
          *   *Q2:* The Social Existence Threshold. Is cultural destruction genocide?
          *   *Q3:* The Authority to Name. Who speaks, and what does it trigger?
      *   **Reasoning/Defense:** Apply the criteria (Upstream, Tractability, Neglectedness, Impact).
      *   **Dynamic Factors:** What changes the priority? (e.g., new ICJ rulings, shifts in UN practice).
      *   **Deprioritized Questions:** Explain why (e.g., specific legal intent standards, empirical risk factors).

  5.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Critique:* Is Q1 too abstract?
      *   *Fix:* Ground it in the tension between the UNGC (legal) and activist usage (moral).
      *   *Critique:* Is the Social Existence argument just "Cultural Genocide" rehashed?
      *   *Fix:* Frame it specifically as "conditions of social existence" (structural) rather than just "artifacts/language" (cultural), linking it to the *outcome* of group dissolution without mass killing.
      *   *Critique:* Is the Speech Act approach too cynical?
      *   *Fix:* Frame it as "Normative Allocation." It's not just about power; it's about assigning responsibility.
      *   *Check:* Did I address the "3 years/4 people" constraint?
      *   *Fix:* Emphasize that these are *conceptual* projects suitable for philosophers/political theorists, not large empirical teams.

  6.  **Final Review against Constraints:**
      *   Defended agenda? Yes.
      *   Two clusters addressed? Yes.
      *   Two reframings treated seriously? Yes.
      *   Prioritization criteria used? Yes.
      *   Settled vs. Contested explicit? Yes.
      *   Deprioritized items included? Yes.
      *   Dynamic factors included? Yes.

  7.  **Final Polish:** Ensure tone is appropriate for an advisory board (strategic, rigorous, realistic). (Self-correction: Ensure I don't sound like I'm giving legal advice, but rather research direction).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "do philosophy." I need to explain *which* philosophical questions. For example, not just "what is genocide?" but "what work does the concept do?"
  Also, need to be careful with the "Social Existence" reframing. It's controversial legally. I must frame it as a *normative* inquiry, not a legal one, since the center is doing conceptual/normative work.

  *(Refining the "State of Play")*: Be careful not to say "Intent is settled." It's legally settled but conceptually contested. Be precise.

  *(Refining the "Ordering")*: Why is Function before Definition? Because if the function is purely legal, the definition is fixed by treaty. If the function is moral/political, the definition is open. So Function is upstream.

  *(Refining the "Naming" question)*: This is downstream of Definition. You can't decide who names X until you agree on what X is. But if X is essentially a speech act, then Naming *is* the definition. I need to navigate this tension. I will place Naming third because even a speech act requires a grammar (rules of use).

