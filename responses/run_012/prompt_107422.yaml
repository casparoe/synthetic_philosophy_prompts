answer: |-
  **To:** The Advisory Board
  **From:** Research Strategy Consultant
  **Subject:** Proposed Three-Year Conceptual Research Agenda on Mass Atrocities

  ### Executive Summary

  Given our constraints (four researchers, three years) and our deliberate mandate to avoid empirical fieldwork or legal litigation support, our comparative advantage lies in **clarifying the normative architecture** that underpins atrocity prevention. The field is currently suffering from "conceptual inflation" (where everything is genocide) and "political paralysis" (where the label triggers no action).

  Below is a prioritized research agenda. It treats the two reframings you identified not as fringe theories, but as necessary stress-tests of the current regime. The ordering is based on **upstream dependency** (you cannot solve B until you resolve A), **tractability** for conceptual scholars, and **potential impact** on policy and moral discourse.

  ---

  ### I. State of Play: Settled vs. Contested

  To avoid wasting resources on pseudo-debates, we must distinguish where the field stands.

  **1. What is Generally Settled (among specialists):**
  *   **The Legal Standard:** The 1948 UN Genocide Convention (UNGC) definition is the *lex lata* (existing law). It requires intent to destroy a national, ethnical, racial, or religious group, in whole or in part.
  *   **Killing is Not Strictly Necessary:** Legal consensus acknowledges that "serious bodily or mental harm" or "conditions of life calculated to bring about physical destruction" can constitute genocide without immediate mass killing (e.g., starvation, forced transfer of children).
  *   **The "Intent" Bottleneck:** Proving *dolus specialis* (specific intent) remains the primary hurdle in tribunals. This is a legal evidentiary problem, not primarily a conceptual one.
  *   **Prevention > Punishment:** Normatively, everyone agrees prevention is superior to post-hoc prosecution, though the mechanisms remain disputed.

  **2. What is Deeply Contested:**
  *   **The Scope of Protected Groups:** The exclusion of political and social groups from the UNGC is widely criticized as a historical artifact, but there is no consensus on whether expanding it weakens the concept.
  *   **Cultural Genocide:** Whether the destruction of a group's cultural heritage and social institutions *without* physical/biological destruction constitutes genocide is the single biggest normative rift.
  *   **The "Trigger" Function:** There is no agreement on whether the label "genocide" creates a legal duty to intervene (beyond the contested R2P norm) or if it is merely a descriptive term of opprobrium.
  *   **Authority:** There is no settled norm on *who* is authorized to apply the label (UN, states, NGOs, courts) or the consequences of conflicting labels.

  ---

  ### II. Prioritized Research Agenda

  #### Priority 1: The Functional Fragmentation Problem
  **Question:** *Can a single concept of 'genocide' serve the distinct functions of criminal law, moral diagnosis, and political mobilization, or should we explicitly decouple them?*

  *   **Reasoning for Priority (Upstream & Impact):** This is the most upstream question. If the concept is inherently fractured (e.g., a narrow legal definition for courts, a broader moral definition for activists), then trying to refine a single definition is a category error. Most current confusion stems from expecting the legal definition to do moral work it cannot sustain.
  *   **Tractability:** High. This is pure conceptual/normative analysis suitable for philosophers and political theorists. It requires analyzing the *purpose* of concepts, not new data.
  *   **Neglectedness:** High. Most scholars try to fix the definition to fit all uses. Few argue for explicit "conceptual pluralism."
  *   **Proposed Output:** A framework distinguishing "Judicial Genocide" (high bar, retroactive) from "Political Genocide" (lower bar, prospective/preventive).
  *   **What Moves This Up/Down:**
      *   *Up:* If the ICJ or ICC issues a ruling that explicitly widens the gap between legal findings and political reality (e.g., finding no genocide where atrocities are obvious).
      *   *Down:* If a major international body adopts a unified "prevention standard" that successfully bridges the gap.

  #### Priority 2: The Social Existence Reframing
  **Question:** *Should the distinctive wrong of genocide be reconceptualized as the destruction of a group's "conditions of social existence" rather than physical/biological destruction?*

  *   **Reasoning for Priority (Normative Core):** This addresses your first reframing. If Priority 1 concludes we need a broader "political/moral" definition, this is the leading candidate for that definition. It captures forced assimilation, linguistic suppression, and institutional dismantling (e.g., residential schools, cultural erasure) which often precede or substitute for mass killing.
  *   **Tractability:** Moderate. Requires engaging with sociology (group identity) and moral philosophy (what makes a group valuable), not just law.
  *   **Neglectedness:** Moderate. "Cultural genocide" is discussed, but often dismissed as diluting the brand. A rigorous normative defense of *social existence* as the core harm is needed.
  *   **Proposed Output:** A normative threshold test: Under what conditions does assimilation become destruction?
  *   **What Moves This Up/Down:**
      *   *Up:* Increased documentation of "slow violence" atrocities where physical killing is low but group cohesion is systematically dismantled (e.g., specific indigenous contexts).
      *   *Down:* If states successfully weaponize this definition to label any cultural policy dispute as genocide, causing conceptual inflation.

  #### Priority 3: The Politics of Naming and Authority
  **Question:** *If 'genocide' is a speech act that allocates duties, what are the normative rules for who may name, when, and with what consequences?*

  *   **Reasoning for Priority (Downstream but Critical):** This addresses your second reframing. This is downstream of Priority 1 and 2. You cannot decide *who* should name the atrocity until you decide *what* is being named (Priority 1 & 2). However, if the definition remains contested, the *procedure* of naming becomes the only way to resolve disputes.
  *   **Tractability:** Moderate. Requires political theory and institutional design.
  *   **Neglectedness:** High. Most focus on the *facts* of atrocities, not the *felicity conditions* of the accusation.
  *   **Proposed Output:** A typology of "Naming Authorities" (e.g., Judicial vs. Parliamentary vs. Civil Society) and a matrix of the specific duties each triggers.
  *   **What Moves This Up/Down:**
      *   *Up:* If a specific instance of "naming" (e.g., by a parliament) triggers military intervention or severe sanctions, proving the performative power of the label.
      *   *Down:* If the international community moves toward a technocratic "atrocity early warning" system that bypasses the word "genocide" entirely.

  ---

  ### III. Deprioritized Questions (And Why)

  To stay within our 3-year/4-person limit, we must explicitly **not** fund the following, despite their surface appeal:

  1.  **Refining the Legal Standard of Intent (*Dolus Specialis*):**
      *   *Reason:* This is a task for legal scholars and practitioners engaged in litigation. Conceptual researchers cannot solve evidentiary hurdles. The answer here would not change normative practice, only conviction rates.
  2.  **Empirical Risk Modeling / Quantitative Prediction:**
      *   *Reason:* Out of scope. We are a conceptual center. Furthermore, this field is crowded by political science departments and NGOs like Genocide Watch.
  3.  **Historical Case Re-litigation (e.g., "Was Cambodia Genocide?"):**
      *   *Reason:* Low marginal utility. The historical record is mostly established; the debate is usually semantic. This consumes resources without producing generalizable normative frameworks.
  4.  **Expanding Protected Groups to Include Political Groups:**
      *   *Reason:* While morally attractive, this is legally dead letter (due to state ratification history) and conceptually messy (political groups are voluntary, not stable). Focusing on *Social Existence* (Priority 2) achieves the protective goal without the conceptual baggage of "political groups."

  ---

  ### IV. Strategic Defense of the Ordering

  **Why Function (Priority 1) before Definition (Priority 2)?**
  If we define the "conditions of social existence" (Priority 2) without first agreeing on whether that definition is for a court or a moral tribunal (Priority 1), the work will be unusable. A definition suitable for criminal liability (requiring high certainty) is unsuitable for preventive mobilization (requiring low thresholds). We must diagnose the *purpose* before prescribing the *content*.

  **Why Definition (Priority 2) before Authority (Priority 3)?**
  The "Speech Act" reframing (Priority 3) is powerful, but a speech act requires a grammar. If we do not know what constitutes the "wrong" (Physical vs. Social Existence), we cannot determine who is qualified to diagnose it. A judge is qualified to diagnose legal genocide; a sociologist might be better qualified to diagnose social dissolution. The *what* determines the *who*.

  **Why these reframings are central, not peripheral:**
  *   **The Social Existence Reframing** solves the "Body Count" problem. It allows us to intervene before mass killing begins, aligning with the "Prevention > Punishment" consensus.
  *   **The Speech Act Reframing** solves the "Paralysis" problem. It shifts the debate from "Is this technically genocide?" to "Does this label trigger the resources we need?" It makes the politics of naming explicit rather than hidden.

  ### V. Risk Assessment & Triggers for Pivot

  **Risk:** The work becomes too abstract and ignores the urgency of ongoing atrocities.
  **Mitigation:** Each researcher must anchor their conceptual work to a contemporary "test case" (e.g., Uyghurs, Rohingya, Tigray) to ensure the theory tracks reality.

  **Trigger for Pivot:**
  If, within 18 months, the UN or a major coalition formally adopts a "Social Existence" standard in a non-judicial context (e.g., a new Special Rapporteur mandate), we shift Priority 2 to implementation guidelines and move Priority 3 (Authority) to the top spot, as the battle will shift to *enforcement*.

  ### Recommendation

  Approve the agenda as ordered. It maximizes our specific niche (conceptual/normative) while addressing the two biggest bottlenecks in the field (definition inflation and political paralysis). It treats your proposed reframings as the core engine of the research rather than side-projects.
