answer: |-
  Dear Colleagues,

  As we prepare for next week's debate on the popular initiative Service for All, I am circulating this recommendation to guide our committee's vote. The initiative proposes a fundamental transformation of our national defence and civil support structure, abolishing our present standing force of approximately four thousand volunteers in favour of a universal obligation. Under the draft, every resident upon reaching the age of twenty would owe twelve months of service, dischargeable either in the militia or in a civilian service corps dedicated to hospitals, mountain rescue, and care of the elderly. There are no provisions to buy an exemption and no general waivers save for medical unfitness. The drafters insist that what they propose is not conscription, arguing that conscription constitutes the state seizing particular bodies for its own military ends, whereas their scheme is a duty each person owes to the polity as such, dischargeable in whichever form best serves the common good. They rely on a constitutional clause forbidding forced labour save under a general civic obligation, a phrase that remains undefined by our courts. Before you cast your vote, I urge you to consider the merits of this distinction with the seriousness it demands, for it is the philosophical cornerstone upon which the entire initiative rests.

  The strongest case for adopting this initiative lies not in efficiency or cost, but in the moral architecture of the state it proposes to build. Proponents argue that a professional volunteer force, however dedicated, creates a caste of defenders separate from the defended, allowing the majority to outsource the risks of sovereignty while retreating into private life. By contrast, a universal levy restores the republican ideal that citizenship is active rather than passive, fostering a shared experience that cuts across class and region. There is weight to the claim that a society where every young person spends a year in shared service, whether guarding a pass or caring for the elderly, would emerge more cohesive and resilient. The drafters contend that by offering a civilian alternative, they remove the militaristic sting of conscription, transforming coercion into civic participation. If we accept their definition, that the end goal defines the nature of the service, then this is indeed a broadening of duty rather than a narrowing of liberty. It appeals to a noble vision of solidarity, suggesting that the security of the state is not merely the absence of invasion but the presence of mutual care, and that the constitution's exception for general civic obligation was intended precisely for such a comprehensive binding of the citizen to the community.

  However, when we engage this distinction on its merits rather than accepting it as a truism, it does not survive scrutiny. The essential characteristic of conscription is not the end to which the labour is put, but the coercive means by which it is extracted. Whether the state commands a young person to hold a rifle on a high pass or to lift patients in a hospital ward, the mechanism remains the seizure of time and bodily autonomy under threat of penalty. The drafters' argument that this is a duty owed to the polity collapses when we observe that the duty is not voluntary and the alternative is not chosen freely but assigned by administrative necessity. The distinction between military ends and civic ends blurs when the state retains the power to mandate the service regardless of the individual's conscience or circumstance. Consequently, the drafters' primary claim that this is not conscription falls with the distinction. If the mechanism is coercive and the labour is uncompensated and mandatory, it fits the legal and practical definition of conscription, regardless of the civilian veneer. This collapse brings down with it their reliance on the constitutional clause regarding general civic obligation, as interpreting a year-long levy on every resident as akin to jury duty or flood relief stretches the provision beyond its historical and legal intent, inviting constitutional crisis.

  Because the distinction collapses, we must confront the implications for conscientious objectors directly. If this is conscription by another name, then the absence of a general waiver for conscientious objection is a critical flaw. The initiative routes refusers into unpaid hospital work, which civil-liberties groups rightly argue launders conscription rather than resolving it. A system that claims to be universal civic service but offers no exit for those whose moral convictions forbid state-mandated labour is indistinguishable from the forced labour the constitution purportedly forbids. Furthermore, we cannot ignore the operational and fiscal realities raised by the General Staff and the Finance Ministry. The Staff argues that a militia cannot man the high passes or the new coastal radar in time, suggesting that readiness would be compromised during the transition and potentially thereafter. The Finance Ministry indicates that the civilian corps will cost more than it saves, undermining the economic efficiency argument. While these practical objections are secondary to the constitutional and philosophical ones, they reinforce the conclusion that the initiative is untenable in its current form.

  Therefore, I recommend that the committee vote to reject the initiative. We cannot endorse a scheme that relies on an untested and likely unsustainable interpretation of constitutional law, nor can we ignore the risks to national readiness and fiscal stability. By rejecting the initiative, we affirm that while civic solidarity is a worthy goal, it cannot be achieved through a coercive mechanism that misidentifies itself. This rejection does not mean we maintain the status quo without improvement. Our current volunteer force deserves our continued support and investment, and we should explore ways to enhance civic engagement without mandating it. Since we are recommending rejection, the present standing force of volunteers remains intact under existing regulations, and there is no transition period to manage for those already enlisted. They continue their service under the terms they volunteered for, secure in the knowledge that the state honours their choice rather than compelling it. I ask that you review this reasoning and prepare to vote against adoption, ensuring that our defence policy remains grounded in legal clarity, operational reality, and respect for individual liberty.

  Sincerely,

  Chair of the Defence Committee
