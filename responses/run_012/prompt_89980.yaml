answer: |-
  # The exam question

  **Final Exam: Rational Choice and Game Theory (Take-Home)**

  **Question 1: Superrationality and Correlation**

  Consider a one-shot Prisoner's Dilemma played by two strangers. The payoffs (Row, Column) are:

  | | Other Cooperates | Other Defects |
  | :--- | :---: | :---: |
  | **You Cooperate** | 3, 3 | 0, 5 |
  | **You Defect** | 5, 0 | 1, 1 |

  The players are not duplicates, but it is common knowledge that they were shaped by the same causal process (e.g., identical upbringing and education), rendering their choices correlated. Let $r$ be the probability that the other player makes the *same* choice you do. Thus, if you cooperate, the probability they cooperate is $r$; if you defect, the probability they defect is $r$.

  Answer the following:

  (i) Using evidential, superrational-style reasoning, derive the expected utility of cooperating versus defecting. For which values of $r$ does cooperating maximize expected utility? Show your computation.

  (ii) Evaluate your result at $r = 1$ and $r = 1/2$. What do these limiting cases imply about whether superrationality is a distinct decision principle or merely a special case of ordinary expected-utility maximization with correlated acts?

  (iii) Does the Kantian, universalizability reading of superrationality ("act only on the maxim you could will that everyone follow") yield the same threshold in $r$? If not, where do the two readings come apart, and why does this distinction matter for normative theory?

  ***

  # Model answer

  (i) To determine the rational choice, we calculate the expected utility (EU) for each action conditional on the correlation parameter $r$. By definition, $P(\text{Other}=C | \text{You}=C) = r$ and $P(\text{Other}=D | \text{You}=D) = r$. Consequently, the probability of mismatch is $1-r$.

  The expected utility of cooperating is:
  $$EU(C) = r(3) + (1-r)(0) = 3r$$

  The expected utility of defecting is:
  $$EU(D) = (1-r)(5) + r(1) = 5 - 5r + r = 5 - 4r$$

  Cooperation maximizes expected utility when $EU(C) > EU(D)$:
  $$3r > 5 - 4r$$
  $$7r > 5$$
  $$r > 5/7$$

  Thus, a superrational agent should cooperate only if the correlation probability exceeds approximately 0.714.

  (ii) At $r = 1$, the inequality holds ($1 > 5/7$), yielding $EU(C)=3$ and $EU(D)=1$. This recovers Hofstadter's classic superrational result: perfect correlation mandates cooperation. At $r = 1/2$, the inequality fails ($0.5 < 5/7$), yielding $EU(C)=1.5$ and $EU(D)=3$. This recovers the standard Nash equilibrium prediction for independent agents.

  These limits imply that superrationality is not a distinct decision rule rejecting expected-utility maximization. Rather, it is ordinary expected-utility maximization applied within an Evidential Decision Theory (EDT) framework where acts provide evidence about correlated states. It is a special case of EU maximization where the conditional probabilities $P(\text{Other}| \text{You})$ differ from the marginal probabilities $P(\text{Other})$. When correlation vanishes ($r=1/2$), superrationality collapses into standard causal decision theory.

  (iii) The Kantian universalizability reading does not yield the same threshold. The categorical imperative asks whether the maxim of my action could be willed as a universal law. If everyone cooperates, the payoff is 3; if everyone defects, the payoff is 1. Since $3 > 1$, Kantian reasoning mandates cooperation regardless of the empirical probability $r$. The threshold is effectively unconditional.

  The two readings come apart when $1/2 \le r \le 5/7$. In this region, superrationality (prudential reasoning) recommends defection because the correlation is insufficient to offset the temptation payoff, while Kantianism (moral reasoning) demands cooperation because the universalized outcome is superior. This distinction matters because it separates prudence from duty. Conflating them risks grounding moral obligation in empirical巧合 (coincidence); if the causal process shaping agents changed such that $r$ dropped to 0.6, the superrationalist defects, but the Kantian must still cooperate. Superrationality is contingent on causal structure; Kantianism is categorical.

  ***

  # Marking scheme

  **Total: 20 Marks**

  **Part (i): Derivation and Threshold (8 Marks)**
  *   **Correct EU formulas (4 marks):** Must correctly identify $EU(C) = 3r$ and $EU(D) = 5 - 4r$.
      *   *Typical mistake:* Treating $r$ as the marginal probability $P(\text{Other}=C)$ independent of the agent's own choice, leading to incorrect EU equations.
  *   **Correct inequality and threshold (4 marks):** Must derive $r > 5/7$ correctly.
      *   *Typical mistake:* Algebraic errors in solving the inequality or reversing the sign (claiming cooperate when $r < 5/7$).

  **Part (ii): Limiting Cases and Decision Rule Status (6 Marks)**
  *   **Correct limit values (2 marks):** Must identify Cooperate at $r=1$ and Defect at $r=1/2$.
      *   *Typical mistake:* Claiming superrationality requires cooperation even at $r=1/2$ (ignoring the derivation).
  *   **Correct classification of principle (4 marks):** Must argue it is a special case of EU/EDT, not a rejection of maximization.
      *   *Typical mistake:* Asserting superrationality is a distinct "logical" rule that overrides expected utility maximization entirely.

  **Part (iii): Kantian Comparison (6 Marks)**
  *   **Correct Kantian threshold (2 marks):** Must identify Kantianism implies unconditional cooperation (independent of $r$).
      *   *Typical mistake:* Arguing Kantianism also depends on the probability of others complying.
  *   **Normative distinction (4 marks):** Must explain the divergence (prudential vs. categorical) and why it matters (contingency of causation vs. duty).
      *   *Typical mistake:* Equating universalizability with high correlation, failing to see that moral duty persists even if others likely defect.
