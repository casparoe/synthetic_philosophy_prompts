      *   *Core Claim:* JC isn't a dynamic rule telling you how to change beliefs given ambiguous input. It's a static constraint saying: "If you *did* update on some experience $E$, and your new credences $P_{new}$ relate to old $P_{old}$ via JC, then you satisfy this equation."
      *   *Input:* Requires a partition $\{E_i\}$ and new probabilities $P_{new}(E_i)$.
      *   *Defense:* Problems like partition dependence arise because people treat JC as a rule for *generating* posteriors from vague experiences, rather than checking consistency of posteriors already formed.
      *   *Weak Points:*
          *   If it's just consistency, what guides the agent *at the moment* of experience?
          *   Does it require knowing the partition perfectly? (Luminosity).
          *   Rigidity ($P_{new}(H|E_i) = P_{old}(H|E_i)$) is crucial. Is it plausible?
          *   Commutativity: Order matters in JC. If partitions shift, does the view collapse?

