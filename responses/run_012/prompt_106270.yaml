answer: |-
  To teach Harsanyi's Aggregation Theorem through Shirley Jackson's *The Lottery* is to stage a collision between high formalism and brutal anthropology. Harsanyi's theorem is a derivation: if individual preferences satisfy the von Neumann–Morgenstern (VNM) axioms, and if social preferences satisfy the Pareto principle and the VNM axioms, then the social welfare function must be a weighted sum of individual utilities. To get *classical* utilitarianism (equal weights), Harsanyi adds the "Impartial Observer" assumption: behind a veil of ignorance, the observer has an equal probability ($1/N$) of becoming any individual in society.

  Jackson's village offers a dark mirror to this construction. It possesses a social welfare function (the harvest), a mechanism for aggregation (the lottery), and a claimed veil (the randomness of the draw). However, a rigorous reading reveals that the village does not merely fail the theorem; it exposes the coercive preconditions the theorem requires but cannot justify.

  ### 1. The Machinery of the Draw: A Travesty of the Veil

  Harsanyi's derivation of equal weights relies critically on the **Equal Chance Assumption**. The impartial observer must face a probability of $1/N$ of occupying any specific life $i$. This ensures that the social welfare function $W = \sum u_i$ treats every utility unit equally.

  The village implements a **two-stage lottery**:
  1.  **Stage 1:** A slip is drawn for each *household* head. One household is selected.
  2.  **Stage 2:** Slips are drawn for each *member* of the selected household. One individual is selected.

  Let $F$ be the number of households and $m_f$ be the size of household $f$. The probability of individual $i$ in household $f$ being selected is:
  $$ P(i) = \frac{1}{F} \times \frac{1}{m_f} $$

  For Harsanyi's condition ($P(i) = 1/N$) to hold, $m_f$ must be constant across all households. In the story, it is not. The Dunbars have three children; other families have fewer. Consequently, members of small households face a higher *ex ante* probability of death than members of large households.

  **Does this matter to the theorem?**
  Yes. If the probabilities are unequal, the Impartial Observer's expected utility calculation changes. The social welfare function becomes a **weighted utilitarianism**, where the weight assigned to an individual's utility is inversely proportional to their family size. The theorem still holds mathematically (social preferences are still linear in individual utilities), but the normative claim to impartiality collapses. The village mechanism structurally discriminates against small families.

  **Does it matter to the village?**
  The village treats the two-stage draw as a sacred preservation of the "original" ritual. By selecting households first, the ritual prioritizes the *family unit* as the primary agent of the social contract, not the individual. Harsanyi's theorem is methodologically individualist; the village is corporatist. The inequality matters to the village because it reinforces the patriarchal structure (heads of households draw first), but it matters to the theorem because it violates the condition required to derive *equal* moral worth from rational choice.

  ### 2. Preferences Behind the Veil: Coercion vs. Consistency

  Harsanyi's theorem is preference-utilitarian. It takes individual utility functions $u_i$ as given inputs. It does not ask where preferences come from, only that they are consistent (transitive, complete, etc.).

  In the story, do the villagers prefer the lottery?
  *Ex ante*, they appear to accept it. Old Man Warner cites the tradition ("Lottery in June, corn be heavy soon"). If we model this as a belief that $U(\text{Sacrifice}) > U(\text{Starvation})$, then behind a veil of ignorance, a rational agent might accept the lottery to insure against crop failure.

  **However, the story resists the theorem here.**
  Harsanyi assumes preferences are stable and authentic. Jackson shows preferences as **endogenous and coercive**.
  1.  **False Beliefs:** The villagers' acceptance relies on a causal link (sacrifice $\to$ harvest) that is empirically dubious. Harsanyi's theorem licenses the lottery if the beliefs are sincere, even if false. The story asks whether rational aggregation can validate a social contract based on superstition.
  2.  **Lack of Exit:** Harsanyi's model implies a voluntary agreement behind the veil. In the village, participation is mandatory. Tessie arrives late; she is not allowed to opt out. The "preferences" aggregated are not revealed preferences but enforced compliance.
  3.  **The Other Villages:** The mention that "other villages" are quitting the lottery reveals that the preference profile is not a fixed constraint of nature but a fragile equilibrium. If preferences can shift exogenously (other villages quitting), the Harsanyi aggregation is unstable. The theorem assumes a closed society with fixed $u_i$; the story shows a society where $u_i$ is a function of social pressure.

  ### 3. Tessie's Protest: The Ex Post Complaint

  Tessie Hutchinson's scream—"It isn't fair!"—occurs *ex post*, after her household is drawn.

  **Harsanyi's Response:**
  The theorem is **ex ante**. It evaluates the lottery based on the expected utility before the slips are drawn. If the *ex ante* expected utility was positive (due to the harvest belief), the theorem licenses the outcome, regardless of the *ex post* suffering of the loser. Tessie's protest is merely the realization of the negative utility term that was already factored into the calculation. Her specific identity does not matter to the aggregator; only the sum does.

  **The Story's Objection:**
  Tessie does not protest the lottery when she is safe; she protests when she loses. This highlights **time inconsistency**, a violation of the rational agent model Harsanyi requires. But more deeply, her protest challenges the **Acceptance Principle** (Pareto).
  Harsanyi requires that if every individual prefers Lottery A to B, society must too. But behind the veil, do they *really* prefer it? Or do they merely acquiesce? Tessie's scream suggests that the *ex ante* agreement was not a genuine preference but a suppression of the desire to live. The story suggests that the "Social Welfare" is not an aggregation of wills, but the imposition of a will upon the aggregate.

  Furthermore, Tessie's specific complaint ("You didn't give him time enough to take any slip he wanted") is a procedural objection. She accepts the *risk* but contests the *mechanism* once she becomes the victim. This exposes the fragility of the VNM axioms in practice: individuals may accept independence and continuity in the abstract, but reject them when the probability mass collapses to 1 on their own death.

  ### 4. What the Story Shows That the Literature Does Not

  The aggregation literature, including Harsanyi and Rawls, treats the "Social" as a neutral space where preferences are collected and processed. The "Veil of Ignorance" is an epistemic device to ensure fairness.

  *The Lottery* demonstrates that the "Social" is often a **violent constitution** that must actively produce the preferences required for the aggregation to function.

  1.  **The Violence of the Veil:** Harsanyi assumes the veil lifts to reveal a society. Jackson shows the veil *is* the black box. The box is shabby, splintered, and fading. The ritual does not reflect the community's values; it *creates* the community by demanding a victim. Without the lottery, the village (as constituted) ceases to exist. The theorem assumes society precedes the choice; the story shows the choice precedes society.
  2.  **The Silence of the Aggregator:** In Harsanyi's model, the Social Welfare Function is a mathematical operator. In the story, the operator is Mr. Summers and the crowd with stones. The literature abstracts away the *enforcement* of the social choice. The story forces us to look at the stones. It asks: What kind of agency is required to turn a weighted sum of utilities into a physical killing? The theorem cannot answer this because it has no variable for violence.
  3.  **History as a Constraint:** Harsanyi is ahistorical; he looks at current preferences. The story is obsessed with history ("original wood," "ritual salute"). The villagers cannot change the lottery because the history *is* the preference. The literature treats tradition as a constraint on the choice set; the story shows tradition as a constraint on the *utility function itself*.

  **Conclusion for the Seminar**

  Use *The Lottery* not to refute Harsanyi's math, but to interrogate his ontology. The theorem proves that *if* you have VNM agents, *and* you have an impartial observer, *and* you have equal probabilities, *then* you get utilitarianism.

  The village shows what happens when you have the math without the morality. They have the probabilities (mostly), they have the aggregation (the draw), and they have the outcome (the sacrifice). But they lack the **autonomous agent**. Tessie is not a VNM maximizer; she is a victim of a coordination equilibrium enforced by violence.

  The story teaches that aggregation theorems assume a level of civic trust and individual autonomy that may not exist. Harsanyi derives "ought" from "is" (rational preferences). Jackson shows that the "is" (the village's participation) is sustained by a collective refusal to examine the "ought." The literature asks how to aggregate preferences fairly. The story asks where the preferences come from, and what happens to the person who becomes the denominator in the social welfare function. The theorem ends with a formula; the story ends with a stone.
