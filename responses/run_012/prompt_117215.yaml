  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Indirect Normativity (the view that normative standards are fixed by idealized agents/procedures).
      *   **Task:** Write a specification of *desiderata* (requirements/constraints) that any such account must satisfy *before* evaluating specific theories.
      *   **Specific Requirements to Cover:**
          1.  Determinacy (verdicts on contested questions, not deferred).
          2.  Self-Application (the account's own conditions survive idealization).
          3.  Guidance (usable by non-ideal agents).
          4.  Non-Circularity (idealization parameters don't presuppose the values derived).
          5.  Authority (why actual agents are bound by hypothetical verdicts).
      *   **Additional Instructions:**
          *   Flag requirements as "Non-Negotiable" vs. "Local Preferences."
          *   Identify if any subset is jointly unsatisfiable (specifically looking for tensions like Non-Circularity vs. Determinacy).
          *   Stress Test: Address the case of two plausible idealization procedures issuing incompatible verdicts.
          *   **Constraint:** Do *not* score existing contenders against the list. The criteria themselves are the deliverable.

  2.  **Deconstruct the Five Core Requirements:**

      *   *(i) Determinacy:* Indirect normativity often risks becoming "whatever the ideal agent says." If the ideal agent's verdict is underspecified or depends on arbitrary parameters, the theory fails to guide action on specific, contested issues (e.g., abortion, taxation). It needs to output *answers*, not just *methods*.
      *   *(ii) Self-Application:* This is a stability/reflexivity constraint. If the theory says "do what an ideal agent would do," does the ideal agent endorse *that* theory? If the ideal agent would reject the procedure used to define them, the theory is unstable (Moore-Paradox-ish).
      *   *(iii) Guidance:* Normativity is practical. If only a god-like being can calculate the verdict, it's useless for humans. It needs a bridge from "ideal verdict" to "actual action."
      *   *(iv) Non-Circularity:* This is the Euthyphro challenge. If we build "moral motivation" or "specific rational constraints" into the idealization to ensure it outputs the "right" answers, we haven't explained *why* those answers are right; we just baked them in.
      *   *(v) Authority:* Why should *I* care what a hypothetical version of me (or a distinct ideal agent) thinks? This is the bindingness problem.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Tone:* Philosophical, rigorous, precise, slightly demanding (matching the user's prompt).
      *   *Structure:* Introduction -> The Five Desiderata (with considerations) -> Classification (Non-Negotiable vs. Local) -> Incompatibility Analysis -> Stress Test (Divergent Procedures) -> Conclusion.

      *   *Refining Determinacy:* It's not just about having an answer; it's about the answer not being "it depends on the idealization." The idealization must be rigid enough to yield a unique or narrow set of outputs.
      *   *Refining Self-Application:* This is often called "reflexive stability." The procedure must recommend itself.
      *   *Refining Guidance:* Distinguish between *criterion of rightness* and *decision procedure*. The theory can be complex, but it must imply heuristics for non-ideal agents.
      *   *Refining Non-Circularity:* This is the hardest one. "Full information" often smuggles in moral facts. The constraint must be purely formal or procedural.
      *   *Refining Authority:* Hypothetical consent vs. Actual bindingness. Why does the counterfactual matter?

  4.  **Analyzing Tensions (The "Joint Unsatisfiability" Check):**

      *   *Determinacy vs. Non-Circularity:* To get determinate answers on hard moral questions, you usually need to build specific substantive constraints into the ideal agent (e.g., "they care about suffering"). But if you do that, you've presupposed the value of suffering, violating Non-Circularity. If you keep the agent purely formal (only logic + info), they might not converge on a single verdict (Indeterminacy). *This is the key tension.*
      *   *Guidance vs. Determinacy:* If the ideal procedure is too complex to be determinate without massive computation, it fails Guidance.
      *   *Self-Application vs. Authority:* If the ideal agent endorses the theory, does that make it binding? Not necessarily.

  5.  **Classifying Requirements:**

      *   *Non-Negotiable:* Determinacy (otherwise it's not a normative theory), Non-Circularity (otherwise it's trivial), Authority (otherwise it's not normative).
      *   *Local Preferences:* Guidance (some meta-ethicists accept "error theory" or "quietism" where guidance isn't the point, but for a *normative* account, it's pretty central. I will mark it as Non-Negotiable for a *practical* account but note the debate). Self-Application is often treated as a theoretical virtue but some might argue it's not strictly required for truth. I'll classify it as Non-Negotiable for *coherence*.
      *   *Decision:* I will treat Determinacy, Non-Circularity, and Authority as the "Hard Core." Guidance and Self-Application are strong theoretical virtues that border on non-negotiable for a *working* theory.

  6.  **Developing the Stress Test:**

      *   *Scenario:* Procedure A (e.g., Rawlsian Veil of Ignorance) vs. Procedure B (e.g., Harsanyi Utilitarianism). Both are "idealized deliberation." They yield different tax policies.
      *   *Requirement:* The account must provide a *meta-criterion* for choosing between procedures. It cannot just say "Procedure A is the right one" without explaining why *that* idealization is the normative anchor. This loops back to Non-Circularity.

  7.  **Drafting the Content (incorporating the "Flagging" and "Tension" analysis):**

      *   *Introduction:* Set the stage. Indirect normativity tries to ground the normative in the hypothetical.
      *   *The List:* Go through (i)-(v) with the "Consideration" for each.
      *   *Classification:* Be clear about what is essential vs. desirable.
      *   *The Tension:* Focus heavily on Determinacy vs. Non-Circularity. This is the "Golden Triangle" problem (Simple, Substantive, Non-Circular).
      *   *Stress Test:* The "Rival Idealizations" problem.

  8.  **Review against Constraints:**
      *   Did I score existing contenders? No.
      *   Did I cover all 5 specific points? Yes.
      *   Did I flag negotiability? Yes.
      *   Did I address joint unsatisfiability? Yes.
      *   Did I do the stress test? Yes.

  9.  **Final Polish:** Ensure the language is sharp. Use terms like "extensional adequacy," "reflexive stability," "normative force." Make sure the distinction between the *criterion* and the *procedure* is clear in the Guidance section. (Self-Correction: Ensure I don't accidentally advocate for Direct Normativity, just specify the requirements for Indirect).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Specification for Indirect Normativity: Desiderata and Constraints

  The following specification outlines the necessary conditions for any theory of indirect normativity. Indirect normativity posits that normative truths (what to do, believe, or value) are constituted by the verdicts of a counterfactual, idealized agent or procedure. To avoid triviality, regress, or practical irrelevance, an account must satisfy the five requirements below.

  Following the requirements, I classify their negotiability, analyze the structural tensions between them, and apply the "Rival Idealizations" stress test.

  ---

  ## I. The Five Desiderata

  ### 1. Determinacy (The Extensional Constraint)
  **Requirement:** The idealization procedure must yield specific, unique, or narrowly constrained verdicts on contested first-order normative questions. It cannot return "indeterminate," "relative to the agent," or "dependent on further moral stipulation" as a final output.
  **Consideration:** A normative theory that fails to distinguish between permissible and impermissible actions in hard cases (e.g., distributive justice, triage, epistemic duties) fails to function as a normative theory. If the idealized agent's verdict depends on arbitrary parameters left open by the theory (e.g., risk-aversion levels in a veil of ignorance), the theory has merely deferred the normative question rather than answering it. The idealization must be rigid enough to collapse the space of possible verdicts into a actionable set.

  ### 2. Self-Application (The Reflexivity Constraint)
  **Requirement:** The account's own defining conditions must survive the idealization process. If the theory states "X is right iff an ideal agent would choose X," then an ideal agent, upon reflecting on the nature of ideal agency, must endorse *this* biconditional as the correct standard for choice.
  **Consideration:** Without self-application, the theory is unstable. If the idealized agent would reject the procedure used to define them (e.g., they would prefer a different deliberation method), the theory suffers from a form of normative Moore's Paradox. It asserts "You should do what Ideal-You would do," while Ideal-You asserts "You should not use my definition to decide what to do." Reflexive stability is required for the theory to claim coherence.

  ### 3. Guidance (The Accessibility Constraint)
  **Requirement:** The account must provide a bridge principle connecting the ideal verdict to the actual agent's decision-making. It must specify what a non-ideal agent (limited information, cognitive biases, finite time) should do *now*, given that they cannot run the ideal procedure.
  **Consideration:** Normativity is inherently practical. If the criterion of rightness is epistemically inaccessible to actual agents, the theory collapses into a skepticism about action. The account need not claim that agents *must* calculate the ideal verdict directly; it may offer heuristics or proxy rules. However, it must explain why following those proxies tracks the ideal verdict sufficiently to count as "guidance." Without this, the theory describes a moral reality but offers no map for navigating it.

  ### 4. Non-Circularity (The Euthyphro Constraint)
  **Requirement:** The parameters defining the idealization (e.g., "full information," "vivid imagination," "instrumental rationality") must not presuppose the substantive normative values the account is meant to derive. The input conditions must be specifiable in non-normative (or thinner normative) terms than the output.
  **Consideration:** If one builds "moral motivation" or "specific moral knowledge" into the definition of the ideal agent to ensure it outputs the "correct" answers, the account is circular. It explains the right by the ideal, but defines the ideal by the right. To be explanatory, the idealization must rely on formal, psychological, or epistemic constraints that are plausible independently of the specific moral conclusions they generate.

  ### 5. Authority (The Bindingness Constraint)
  **Requirement:** The account must explain why the verdicts of a merely hypothetical counterpart bind an actual agent. It must bridge the gap between "Agent A* would choose X" and "Actual Agent A ought to do X."
  **Consideration:** Hypothetical consent or hypothetical choice is not inherently binding. The fact that a better version of me would diet does not necessarily mean I am irrational for eating cake, unless there is a normative link between my actual will and my ideal will. The theory must ground the authority of the ideal agent in something actual agents possess (e.g., their own deep values, their rational nature, or their actual consent to the procedure). Without this, the ideal agent is merely a spectator, not a legislator.

  ---

  ## II. Classification of Requirements

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **Determinacy** | **Non-Negotiable** | Without determinate verdicts, the theory fails to resolve the conflicts it was designed to address. It becomes a description of a process, not a normative standard. |
  | **Non-Circularity** | **Non-Negotiable** | Violating this renders the theory trivial. It would amount to saying "The right thing is what a agent motivated by the right thing would do." |
  | **Authority** | **Non-Negotiable** | Without bindingness, the verdicts are merely predictions or advice, not obligations. A normative theory without authority is not normative. |
  | **Self-Application** | **Non-Negotiable** | While some may treat this as a theoretical virtue, a theory that recommends its own rejection is incoherent. It is a condition of logical stability. |
  | **Guidance** | **Local Preference** | *Debated.* Some meta-ethical realists argue truth is independent of knowability. However, for a *practical* indirect normativity (action-guiding), this is effectively non-negotiable. I flag it as local only because a purely theoretical account of "what is good" could technically omit it, though it would be practically inert. |

  ---

  ## III. Structural Tensions and Joint Unsatisfiability

  There is a significant risk that a subset of these requirements is jointly unsatisfiable. The primary tension lies between **Determinacy** and **Non-Circularity**.

  ### The Determinacy vs. Non-Circularity Tension
  To satisfy **Determinacy**, the idealization procedure must be robust enough to force convergence on specific moral outcomes (e.g., "Redistribute wealth," "Do not lie"). However, purely formal or thin procedural constraints (e.g., "logic," "full non-moral information," "instrumental rationality") often underdetermine moral outcomes. Rational agents with full non-moral information can still disagree on fundamental values.

  To force convergence (satisfy Determinacy), theorists are tempted to thicken the description of the ideal agent (e.g., adding "empathy," "impartiality," or "desire for social cooperation"). But these thick constraints often smuggle in the very moral values the theory is supposed to derive (violating **Non-Circularity**).
  *   *Example:* If you define the ideal agent as "impartial," you have likely presupposed a moral constraint on partiality. If you define them as "instrumentally rational," they may not converge on morality at all.

  **Verdict on Unsatisfiability:** It is not logically impossible to satisfy both, but the space for a solution is vanishingly narrow. An account must find "thick" psychological or rational constraints that are *not* moral but *entail* moral conclusions. If no such constraints exist, Indirect Normativity faces a dilemma: either it is indeterminate (fails Determinacy) or it is question-begging (fails Non-Circularity).

  ### The Guidance vs. Authority Tension
  A secondary tension exists between **Guidance** and **Authority**. To satisfy **Guidance**, the theory often simplifies the ideal procedure into heuristics for actual agents (e.g., "Follow common sense morality"). However, this risks violating **Authority**: if the actual agent is following a heuristic that diverges from what the ideal agent would *actually* do in this specific case, why is the heuristic binding? If the actual agent must try to mimic the ideal agent directly to be bound, they often lack the capacity to do so (violating Guidance).

  ---

  ## IV. Stress Test: The Rival Idealizations Problem

  **Scenario:** Consider two independently plausible idealization procedures, **Procedure Alpha** (e.g., Rawlsian Veil of Ignorance with risk-aversion) and **Procedure Beta** (e.g., Harsanyiian Veil of Ignorance with risk-neutrality). Both satisfy the formal definitions of "idealized deliberation." Both are non-circular regarding moral facts (they rely on rational choice theory). Yet, they issue incompatible verdicts on the same question (e.g., the maximum allowable level of economic inequality).

  **What an Adequate Account Owes Us:**
  In this scenario, an indirect normative account cannot simply assert "Procedure Alpha is the correct one." To do so without further argument violates **Non-Circularity** (why is Alpha's risk-aversion the normative standard?) and **Determinacy** (the theory itself is now contested).

  An adequate account must provide a **Meta-Idealization Criterion**. It must specify a higher-order procedure or set of constraints that selects *which* idealization procedure is the normative anchor.
  1.  **Derivation:** It must show that Procedure Alpha is the one that *actual* agents would endorse under even more idealized conditions, or that Procedure Alpha is the only one consistent with the concept of agency itself.
  2.  **Convergence:** It must demonstrate that the divergence between Alpha and Beta is due to a defect in Beta's idealization (e.g., risk-neutrality is a cognitive error, not a rational parameter), thereby restoring Determinacy.
  3.  **Failure Condition:** If the account cannot rank the procedures without appealing to the moral verdicts they produce (e.g., "Alpha is better because it produces the more just outcome"), it fails the **Non-Circularity** constraint. It is using the output to validate the input.

  **Conclusion of Stress Test:** If two idealization procedures are equally defensible on non-normative grounds but yield contradictory normative verdicts, Indirect Normativity fails **Determinacy**. Therefore, a successful account must prove that there is a *unique* rationally required idealization procedure, not just a class of plausible ones. This places a heavy burden on the **Non-Circularity** constraint, as the argument for the uniqueness of the procedure must not rely on the moral preferences the procedure is meant to generate.
