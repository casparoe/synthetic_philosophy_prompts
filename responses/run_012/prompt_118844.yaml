answer: |-
  You have put your finger on the central ontological problem in modern medicine and psychiatry. You are describing a category that is **causally potent** (interventions work), **predictively valid** (outcomes correlate), but **ontologically fuzzy** (no essence, shifting boundaries).

  There is no single, universally agreed-upon word that captures every nuance you described, but there are two established terms in the philosophy of science and medicine that, when combined, describe this exactly. If those feel insufficient, I will offer a coined refinement at the end.

  ### 1. The Established Terms

  The closest established philosophical concept is the **Homeostatic Property Cluster (HPC) Kind**, proposed by Richard Boyd.
  *   **What it is:** A grouping of things that share a cluster of properties that tend to co-occur, not because of a single necessary-and-sufficient essence (like "atomic number 79" for gold), but because of underlying homeostatic mechanisms that keep the properties together.
  *   **Why it fits:** Vitamin D deficiency isn't just a number; it's the number *plus* bone density *plus* fall risk *plus* immune markers. These cluster together due to biological mechanisms. There is no "switch" at 30 ng/mL, but the cluster is real enough to support induction (prediction).
  *   **Where it falls short:** HPC explains the *clustering*, but it doesn't fully account for the *arbitrary, shifting cutoff*. HPC kinds (like species) usually have boundaries that are fuzzy but relatively stable. Your examples have boundaries that move by committee vote.

  The second term is **Pragmatic Kind**, specifically in the sense developed by Muhammad Ali Khalidi.
  *   **What it is:** A category that is "real" not because it exists independently of human interests, but because it tracks invariant relations *relative to our cognitive or practical goals*.
  *   **Why it fits:** This captures the "earns its keep" aspect. The category exists *for us* because it allows us to achieve a goal (prevent falls, treat depression). If the goal or the technology changes, the category can shift without losing its reality.
  *   **Why it fits the moving boundary:** A Pragmatic Kind is defined by its utility. If new data shows supplements work better starting at 30 ng/mL instead of 20 ng/mL, the *utility* shifts, so the *boundary* shifts. The category remains real because it still tracks a causal relationship relevant to our interests.

  ### 2. The Synthesis: "Interventionally Robust Pragmatic Kind"

  If you want to be precise, you are describing a **Pragmatic Kind** that possesses **Interventional Validity**.

  In the philosophy of causation (James Woodward), something is "real" if you can wiggle it and make something else wiggle. Vitamin D deficiency is **interventionally robust**: you wiggle the level (supplements), and you wiggle the outcome (falls). This distinguishes it from a mere "social construction" (like "being a cool kid"), which might predict outcomes but often lacks a direct biological lever.

  So, the most accurate label is an **Interventionally Robust Pragmatic Kind**.
  *   **Interventionally Robust:** It's not just a correlation; you can act on it.
  *   **Pragmatic:** The boundaries are set by human goals and measurement capabilities, not nature's joints.
  *   **Kind:** It supports induction and prediction.

  ### 3. Coining a Term (If you need a shorthand)

  If "Interventionally Robust Pragmatic Kind" is too mouthy for rounds, I propose the term: **Thresholded Functional Kind**.

  *   **Functional:** It is defined by what it *does* (risk of harm), not what it *is* (essence).
  *   **Thresholded:** It acknowledges the binary label is imposed on a continuum.
  *   **Kind:** It affirms it is a valid category for reasoning, not just a fiction.

  ### 4. The Test Cases

  You asked where the edges are. Here is how this framework handles your specific examples:

  **Does *Species* belong in the same box?**
  *   **Verdict:** Mostly **No**.
  *   **Why:** Species are typically **HPC Kinds**, but they are not usually **Pragmatic Kinds** in the medical sense. The boundary of a species is determined by reproductive isolation and phylogeny, not by a committee deciding where to draw the line for treatment. While species boundaries can be fuzzy (ring species), they do not shift based on *utility*. If we decide it's "useful" to lump wolves and dogs, the biological reality doesn't change to match. Vitamin D deficiency *does* change its definition based on utility.
  *   **Edge:** Species are "Nature-Dominated HPCs"; Vitamin D deficiency is "Utility-Dominated HPCs."

  **Does *Race* used as a medical variable belong?**
  *   **Verdict:** **No**, it is a different animal.
  *   **Why:** Race in medicine often functions as a **Proxy Kind** or **Social Kind**. It may predict outcomes (e.g., hypertension rates), but it lacks *interventional robustness* on the variable itself. You cannot "treat" race to change the outcome; you treat the social determinants or genetic ancestry correlated with it.
  *   **The Difference:** With Vitamin D, the label *is* the target of the intervention (raise the level). With Race, the label is a *marker* for other targets (socioeconomic status, specific genetic variants, environmental stress). Race is a **Predictive Proxy**, not an **Interventional Kind**.

  **Does the *Moving Boundary* matter?**
  *   **Verdict:** **Yes**, it is the defining feature.
  *   **Why:** The moving boundary proves the category is **Teleological** (goal-directed) rather than **Ontological** (truth-directed).
      *   If the boundary were fixed by nature (like the boiling point of water at sea level), moving it would make the statement *false*.
      *   If the boundary is fixed by policy (like Vitamin D deficiency), moving it makes the statement *more useful*.
      *   This confirms the category is a **Pragmatic Kind**. The fact that it *keeps working* after the move confirms it is tracking a real underlying continuum (the HPC), even if the binning is arbitrary.

  ### 5. Summary for your Practice

  You are dealing with **Thresholded Functional Kinds**.

  *   **They are not Natural Kinds:** There is no essence.
  *   **They are not Social Constructions:** They have causal power and biological grounding.
  *   **They are Real:** They support intervention and prediction.
  *   **They are Malleable:** Their edges are defined by the current state of evidence and the cost/benefit analysis of intervention.

  In psychiatry, **Depression** is exactly this. It is an HPC (symptoms cluster), it is Pragmatic (defined by distress/impairment goals), and it is Interventionally Robust (drugs/therapy work). The DSM moving the goalposts from edition to edition doesn't make Depression "fake"; it makes it a **Pragmatic Kind** refining its operational thresholds.

  **The Edge:** The category stops being valid when it loses **Interventional Robustness**. If you hand out supplements for "deficiency" defined at 30 ng/mL and falls *do not decrease*, the category has ceased to be an Interventional Kind and has become a mere Statistical Artifact. As long as the intervention moves the needle, the category earns its reality, regardless of where the line is drawn.
