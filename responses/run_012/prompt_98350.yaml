      *   *Sentence 2:* "Anti-realism says that truth is just what we could in principle come to know."
          *   *Assessment:* This is the "Knowability Principle" (KP). It's a specific version of anti-realism (verificationism), often associated with Dummett, but not *all* anti-realism.
          *   *Verdict:* Acceptable simplification for this context, but technically specific to semantic anti-realism.

      *   *Sentence 3:* "Fitch showed that if that were right, then — since knowledge implies truth, and since anyone who knows a conjunction knows each half, and since knowledge is closed under logical consequence — every truth would already have to be known by somebody, down to the most boring facts that nobody has ever bothered to check."
          *   *Assessment:* This describes the derivation. The premises (K implies T, Distribution over conjunction) are standard. The conclusion ("every truth would already have to be known") is the "Omnicompetence" result.
