prompt: |-
  I'm a retired experimental physicist — forty-odd years in neutron scattering — and I've been reading alot of philosophy since I stopped working, lately the realism/anti-realism stuff about truth, which I find weirdly gripping for someone who spent his career measuring things. A colleague in the philosophy department, who I assume knows what he's talking about, sent me this one-paragraph summary of something called Fitch's paradox of knowability, and I'd like a second opinion before I go repeating it at dinner:

  "Fitch's paradox is the proof that anti-realism refutes itself. Anti-realism says that truth is just what we could in principle come to know. Fitch showed that if that were right, then — since knowledge implies truth, and since anyone who knows a conjunction knows each half, and since knowledge is closed under logical consequence — every truth would already have to be known by somebody, down to the most boring facts that nobody has ever bothered to check. That's obviously absurd, so the anti-realist's knowability principle collapses. What the paradox really establishes is that some truths are in principle unknowable, which is exactly what the realist said all along. Fitch published it in the early sixties specifically to knock down Dummett's version of anti-realism."

  How much of this should I trust? I gather the proof itself is agreed to be valid — I dont need it re-derived for me — but I want to know what the popular version gets wrong about what it actually shows and about who it's supposed to be a problem for. Take it sentence by sentence: what would a logician working on this accept, what's a harmless simplification, and what's just wrong? And does the conclusion he draws at the end actually follow from the proof, or does the proof only get you something weaker or different? No reading list, please — I'm not going to chase down papers.
reasoning: |-
