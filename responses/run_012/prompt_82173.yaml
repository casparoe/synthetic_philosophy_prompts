answer: |-
  **Joint Statement on Moral Responsibility**

  We, the undersigned, submit this statement of adversarial collaboration.

  **I. Agreed Claims**
  1. Reactive attitudes (resentment, guilt, gratitude) are constitutive of human moral relationships, not merely instrumental tools.
  2. These attitudes phenomenologically presuppose the agent authored the act and could have done otherwise.
  3. Determinism threatens the coherence of "ultimate responsibility" or basic desert, creating a tension between science and practice.
  4. The cases of the Dead Brother, Personality Change, Plea for Blame, and the Addict reveal tensions in our practices that metaphysics alone cannot dissolve.
  5. Regardless of metaphysical truth, treating agents as mere malfunctioning machines is inappropriate; moral address retains value even if desert is illusory.
  6. Both sides agree on the intuitive pull of the four specific cases listed above and that they test the limits of responsibility practices.

  **II. Residual Disagreements**

  | Disagreement | Strawsonian Formulation | Skeptic Formulation | Crux | Shared Case | Predictions (Strawson / Skeptic) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Normative Force** | The participant stance is self-justifying; demanding external validation is misconceived. | The stance presupposes impossible desert; blame is unwarranted without ultimate authorship. | Does the internal logic of relationships suffice for justification? | **Plea for Blame:** Agent insists blame is respect. | S: Confirms stance validity.<br>Sk: Confirms misplaced demand. |
  | **Control** | Responsiveness to reasons suffices for responsibility, even if causally determined. | "Could not do otherwise" negates basic desert, regardless of reasons-responsive machinery. | Does causal determination negate the control needed for desert? | **The Addict:** Couldn't do otherwise, yet not a machine. | S: Constrained but responsible.<br>Sk: Not desert-worthy. |
  | **Target & Time** | Blame targets the person embedded in ongoing relationships, surviving death or change. | Blame targets a specific "self" requiring ultimate authorship at the time of action. | Is psychological continuity sufficient for responsibility? | **Dead Brother / Personality Change:** Resentment vs. changed identity. | S: Resentment valid.<br>Sk: Resentment misdirected. |

  **III. Assessment of Verbal Dispute**
  Is the dispute merely verbal? Partially. When the Strawsonian says "responsible," they mean "appropriate target of reactive attitudes within our form of life." When the Skeptic says "responsible," they mean "possessor of contra-causal freedom worthy of basic desert." If defined thus, they agree: there is no basic desert, but there are appropriate reactive attitudes.

  However, the disagreement persists in practice. The Strawsonian argues the Skeptic's revisionism loses something essential—the fittingness of guilt and resentment. The Skeptic argues the Strawsonian's retention invites metaphysical confusion. The cases force this into the open: if the Addict is not a machine, is he responsible? The Strawsonian says yes (reasons-responsive); the Skeptic says no (not ultimately authored). Thus, the dispute exceeds terminology; it concerns whether our practices require metaphysical commitments they cannot meet. We agree to test this via the predictions above.
