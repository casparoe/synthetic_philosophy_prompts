      *   *The "Formative Years" Hypothesis:* This is the bridge. For a cohort to be real, the *timing* of exposure must matter. (e.g., experiencing the internet at 10 vs. 30).

  5.  **Finalizing the Structure:**

      1.  **The Pragmatic/Incoherent Tension:** It's pragmatic code-switching, not logical incoherence.
