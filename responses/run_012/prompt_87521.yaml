prompt: |-
  So I'm not an academic, I just run a small philosophy reading group in the back room of a bar, and we've been doing a few weeks on Ayer and whether there's anything after death. I want to hand out a take-home exam question for the last meeting because half the group keeps saying Ayer thought the afterlife is meaningless and then just stops, like thats the whole argument, and I want to force them past the slogan. Can you help me write it?

  Take the role of a philosopher who's taught Ayer for years and also has a soft spot for the weird biographical corners. Before you write, brainstorm a bit — think about where the actual crux is, not just the label. Then give me three things: (1) the exam question itself, one essay question, aimed at people who've read some Ayer but aren't specialists; (2) a model answer of about 650 words; (3) a marking scheme out of 20 that names the specific moves an A answer has to make and the specific mistakes that should cost points. Write it in American English.

  Some stuff I want the question to force them to deal with, because I think this is where it gets interesting and not just recitable:

  - Ayer's move in Language, Truth and Logic isn't survival is false, it's that the sentence has no factual content at all, because nothing observable would count for or against it. I want them to explain why that distinction matters and what work the verificationist theory of meaning is doing, rather than just reporting the conclusion.

  - The wrinkle: Ayer himself seems to allow that some survival claims could be checkable — like if someone's memories and personality turned up in a different body, that would be something you could test. So the target is really the traditional disembodied survival claim, not survival talk as such. I want the question to make them say precisely what's being ruled out and why the memory-transfer case doesn't just refute him.

  - The biographical kicker: near the end of his life Ayer had a near-death experience and wrote about it, and he said it left him a little less sure that death is annihilation, though he still thought the experience was just a brain event. I want the question to ask whether that's consistent with his earlier position or whether it shows the verificationist line can't survive contact with lived experience. And I want the marking scheme to reward the student who can say why a single unshared experience doesn't meet the verificationist bar without just waving the word subjective around.

  - I don't want the question answerable by Ayer was a logical positivist, so he denied the afterlife. If someone can write that sentence and nothing else, they should get like a 6 out of 20.

  Also, please don't put any quotes from Ayer in the model answer unless you can be sure of them — paraphrase is fine, I'd rather it be accurate then flashy. And no reading lists or citations, nobody in the group is going to chase down page numbers.
