prompt: |-
  my ethics teacher has a bunch of rulings on who caused what and i cant figure out the rule shes actually running before our unit test.

  - lifeguard on duty watches a kid drown and does nothing: caused it.
  - some other guy on the same beach, strong swimmer, calm water, watches and does nothing: she says he did NOT cause it, hes just a jerk.
  - landlord who never put smoke alarms in, tenant dies in a fire: caused it. (shes big on the fact that hes owned the place for years and does all the other upkeep himself)
  - doctor forgets to order a routine test, patient dies: caused it.
  - car company knows about a brake defect, doesnt recall, driver dies: caused it.
  - parent doesnt feed their baby: caused it.
  - guy who films a car crash on his phone instead of calling anyone: she says he did NOT cause the deaths.

  so the plain would-it-have-happened-anyway test is already dead, since both of the no cases pass it.

  my case for next week: my uncle bought a duplex two weeks ago and rents out the bottom half. hes never set foot inside, he just signed the papers and took one months rent. the furnace is cracked and leaking carbon monoxide and the tenant dies in her sleep. did my uncle cause her death?

  give me the rules that fit everything shes said, what each one predicts about my uncle, which rule shes prolly running and why, and one more case i can throw at her that would split the rules apart.
