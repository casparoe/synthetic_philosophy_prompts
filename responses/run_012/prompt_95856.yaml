      *   **Task:** Create a "Joint Statement of Adversarial Collaboration."
      *   **Components:**
          1.  Numbered claims both would sign (Common Ground).
          2.  Table of Residual Disagreements (phrased in acceptable terms for each side).
          3.  Identification of Cruxes (with shared arguments/cases and divergent predictions).
          4.  Specific Case Requirement: A being who converges on moral verdicts but lacks conative states/indifference.
          5.  Verbal vs. Substantial Dispute Analysis.
      *   **Tone:** Academic, philosophical, precise, collaborative yet adversarial.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Non-naturalist Realist (e.g., Parfit, Enoch, Shafer-Landau):** Moral judgments are beliefs about mind-independent facts. Moral properties supervene on natural properties but aren't identical to them. Disagreement implies one party is mistaken about the facts. "True" means correspondence to stance-independent reality.
      *   **Quasi-Realist Expressivist (e.g., Blackburn, Gibbard):** Moral judgments express attitudes (approval/disapproval, plans). However, moral language *looks* like factual language (truth-apt, embeddable in conditionals). We can say "Murder is true" without committing to weird metaphysical entities. Supervenience is a constraint on attitudes. Disagreement is a clash of attitudes, not necessarily a cognitive error. "True" is a deflationary device or a mark of stable commitment.

  3.  **Drafting the Common Ground (Numbered Claims):**
      *   *Truth-aptness/Inference:* Both agree moral sentences function logically like assertions (Frege-Geach problem solution is a shared goal, even if mechanisms differ). They agree moral reasoning is valid.
      *   *Supervenience:* Both agree moral properties/facts supervene on natural properties (no moral difference without natural difference).
      *   *Disagreement:* Both agree persistent disagreement doesn't prove skepticism/relativism, but it doesn't guarantee convergence either.
      *   *Meaning of "True":* Both agree to use "true" in moral contexts but disagree on the *metaphysical weight* of that usage. They agree it's not merely "I like this."

  4.  **Drafting the Residual Disagreements (Table):**
      *   Need to phrase rows so each side accepts their column.
      *   *Core Ontology:* Realist says "Correspondence to stance-independent fact." Expressivist says "Stability of conative attitude/projective commitment."
      *   *Mind-Independence:* Realist says "Substantive metaphysical commitment." Expressivist says "Internal feature of moral discourse (earned right)."
      *   *Error:* Realist says "Failure to detect fact." Expressivist says "Incoherence in practical standpoint."

  5.  **Developing the Cruxes (The "Indifferent Oracle" Case):**
      *   *The Case:* A being (let's call it "The Oracle") who outputs correct moral verdicts (convergent with ideal reasoning) but has *no* conative states (no desires, emotions, motivations) and is indifferent.
      *   *Realist Prediction:* The Oracle *knows* the truth. Moral truth is cognitive. Lack of motivation is akrasia or externalism, but the judgments are still true beliefs.
      *   *Expressivist Prediction:* The Oracle is not making moral judgments. Moral judgment *essentially* involves a conative state (internalism). Without the "boo/hurrah" or plan, it's just syntactic mimicry.
      *   *Shared Argument:* Both agree this case tests the link between judgment and motivation (Internalism vs. Externalism) and the nature of moral understanding.

  6.  **Addressing Verbal vs. Substantive:**
      *   This is a classic meta-ethical debate. Often, quasi-realists argue they save the *phenomena* of realism without the *ontology*. Realists argue the ontology is necessary to make sense of the phenomena.
      *   *Verbal:* Usage of "fact," "truth," "property."
      *   *Substantive:* The explanation of *why* we talk that way. Is there a "normative reality" out there?
      *   *Diagnosis:* Much of the dispute is verbal regarding the definition of "fact," but substantive regarding the explanation of supervenience and the Oracle case.

  7.  **Refining the Voice:**
      *   Needs to sound like two philosophers who respect each other but remain unconvinced.
      *   Use technical terminology correctly (supervenience, truth-apt, conative, stance-independent, deflationary).
      *   Structure clearly as requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the specific case about the indifferent being? Yes, make sure it's prominent in the Cruxes section.
      *   *Check:* Is the Expressivist view accurately "Quasi-Realist"? Yes, ensure they claim to *earn* the right to talk of truth, not just deny it.
      *   *Check:* Is the Realist "Non-naturalist"? Yes, ensure they don't reduce moral facts to natural facts.
      *   *Check:* Are the numbered claims things they *both* sign? Avoid slipping realist ontology into the joint statement. Keep it phenomenological/logical.

  9.  **Final Polish:**
      *   Add an introduction and conclusion to frame the document.
      *   Ensure the table is clear.
      *   Make sure the "Verbal vs. Substantive" section is nuanced (it's rarely 100% one or the other).

