answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **On the Metaphysics and Logic of Moral Discourse**

  **Signatories:**
  *   **Dr. Elena Vance** (Non-naturalist Moral Realist)
  *   **Dr. Julian Thorne** (Quasi-realist Expressivist)

  **Date:** October 14, 2024

  ### PREAMBLE
  After fifteen years of dialectical engagement, we submit this document to clarify the topology of our disagreement. We agree that the surface grammar of moral discourse is not to be revised. We disagree on the best explanation of why that grammar functions as it does. The following sections delineate our common ground, our residual divergences, and the specific cruxes where our theories yield different predictions.

  ---

  ### PART I: COMMON GROUND (CLAIMS ENDORSED BY BOTH)

  1.  **Truth-Aptness and Logic:** Moral judgments are syntactically and logically truth-apt. They function legitimately as premises and conclusions in valid arguments (e.g., modus ponens). We reject any proposal to rewrite moral language to expose a supposed underlying imperative or emotive structure that violates logical norms.
  2.  **Supervenience:** The moral supervenes on the natural. There can be no difference in moral status without some difference in non-moral, natural facts. We agree that this constraint is necessary for moral reasoning to be rational rather than arbitrary.
  3.  **The Status of Disagreement:** Persistent moral disagreement does not entail that there is no truth of the matter (skepticism), nor does it entail that one party is necessarily irrational. However, we agree that the *possibility* of fundamental disagreement places a burden of explanation on both our accounts: the Realist must explain why access to mind-independent facts is so fragile; the Expressivist must explain why clashes of attitude feel like cognitive errors.
  4.  **Usage of "True":** We both assert moral sentences as true and deny their negations as false.
      *   **We refuse to mean** by "true" merely "I currently approve of this" (simple subjectivism).
      *   **We refuse to mean** by "true" "verifiable by empirical science alone" (reductive naturalism).
  5.  **Normativity:** Moral judgments provide reasons for action. To judge that $X$ is wrong is to acknowledge a normative reason not to do $X$, regardless of whether the agent is ultimately motivated to refrain.

  ---

  ### PART II: RESIDUAL DISAGREEMENTS

  | Feature of Moral Discourse | **Vance (Non-naturalist Realist)** | **Thorne (Quasi-realist Expressivist)** |
  | :--- | :--- | :--- |
  | **The Nature of Correctness** | The correctness of a moral judgement consists in its **correspondence to a stance-independent normative fact**. To judge correctly is to track reality. | The correctness of a moral judgement consists in the **standing of a stable, coherent conative attitude**. To judge correctly is to hold a commitment that survives reflective scrutiny. |
  | **Mind-Independence** | Mind-independence is a **substantive metaphysical commitment**. Moral facts would obtain even if no beings existed to care about them. | Mind-independence is a **construction earned from ordinary moral talk**. It is a feature of the *discourse* (objectivity), not proof of ontological entities outside the mind. |
  | **The Role of Ontology** | We require moral properties to explain the truth of our claims. Without them, moral truth is mysterious. | We require no moral properties beyond the natural. Positing them is a "metaphysical inflation" that explains nothing the projective account cannot. |
  | **Explanation of Supervenience** | Supervenience is a **brute necessary connection** between distinct natural and non-natural properties. | Supervenience is a **constraint on rational consistency** in attitude formation. To have different attitudes toward identical natural cases is inconsistent. |
  | **Error Theory** | When a moral judgment is false, the agent has failed to detect a fact that is there to be found. | When a moral judgment is false, the agent has failed to maintain a coherent practical standpoint or has projected an attitude that cannot be universalized. |

  ---

  ### PART III: CRUXES AND PREDICTIVE DIVERGENCE

  We identify three specific loci where our agreement on language masks a divergence in explanation. For each, we record a shared argument or case and our conflicting predictions.

  #### CRUX 1: The Indifferent Oracle
  **The Case:** Consider a being (The Oracle) who, for every moral question, delivers the verdict our best moral reasoning would converge upon (e.g., "Torture is wrong," "Charity is good"). However, The Oracle has **no conative states at all**. She feels no approval, no disapproval, no desire to act, and is wholly indifferent to the verdicts she issues. She is a purely cognitive engine.

  *   **Shared Premise:** Both sides agree this case tests the connection between moral judgment and motivation (Internalism vs. Externalism) and the definition of "understanding" a moral concept.
  *   **Vance's Prediction:** The Oracle **knows the moral truth**. Her judgments are true beliefs. Her lack of motivation is a separate psychological failure (akrasia or lack of desire), but it does not negate the cognitive content of her judgment. Moral facts exist independently of her indifference.
  *   **Thorne's Prediction:** The Oracle **is not making moral judgments**. She is merely manipulating symbols. Without a conative state (a plan, a commitment, a sentiment), there is no moral judgment to be true or false. She lacks moral *understanding*, not just motivation.
  *   **Diagnosis:** Substantive. This turns on whether moral concepts are essentially practical (Thorne) or essentially descriptive of a normative realm (Vance).

  #### CRUX 2: The Explanation of Supervenience
  **The Case:** We ask: "Why *must* the moral supervene on the natural?"

  *   **Shared Premise:** Both agree that if two acts are identical in all natural respects, they must be identical in moral respects.
  *   **Vance's Prediction:** This is a **metaphysical necessity**. The natural properties *ground* the non-natural moral properties. If we cannot explain *how* they ground them, it remains a brute mystery inherent to normativity.
  *   **Thorne's Prediction:** This is a **conceptual/logical necessity**. It is not that natural facts *cause* moral facts, but that it is part of the definition of having a moral attitude that one applies it consistently to similar natural cases. To violate supervenience is to talk nonsense, not to describe a metaphysical impossibility.
  *   **Diagnosis:** Largely Verbal, with substantive edges. The dispute is over whether "necessity" implies a relation between *properties* (Vance) or a rule of *language/thought* (Thorne).

  #### CRUX 3: The "Queerness" of Moral Facts
  **The Case:** Mackie's Argument from Queerness: If objective moral values existed, they would be entities of a very strange nature, utterly different from anything else in the universe.

  *   **Shared Premise:** Both agree that moral properties, if they exist, are not detectable by the five senses or standard scientific instrumentation.
  *   **Vance's Prediction:** Queerness is not a refutation. Normative facts are *sui generis*. Our faculty of intuition or rational insight accesses them just as logic accesses logical truths. The "queerness" is a feature of reality, not an error in our theory.
  *   **Thorne's Prediction:** Queerness is a reductio ad absurdum of Realism. The Quasi-realist account explains why moral discourse *seems* to track queer entities without actually positing them. We save the phenomena without the ontological cost.
  *   **Diagnosis:** Substantive. This is a clash of methodological virtue: Explanatory Power (Vance) vs. Ontological Parsimony (Thorne).

  ---

  ### PART IV: DIAGNOSIS OF VERBAL VS. SUBSTANTIVE DISPUTE

  We conclude with a meta-assessment of our own disagreement.

  **1. Where the dispute is Verbal:**
  Much of our conflict turns on the word **"Fact"** and **"Property."**
  *   **Thorne** uses "fact" in a deflationary sense: To say "It is a fact that torture is wrong" is just to re-assert "Torture is wrong" with grammatical emphasis.
  *   **Vance** uses "fact" in a robust, representational sense: To say "It is a fact" implies a truth-maker external to the assertion.
  *   *Resolution:* We acknowledge that if Thorne adopts Vance's definition of "fact," he is an anti-realist. If Vance adopts Thorne's definition, she is a quasi-realist. The fight is over who gets to define the term "realism" for the discipline.

  **2. Where the dispute is Substantive:**
  The dispute is substantive regarding **The Indifferent Oracle (Crux 1)** and **Explanatory Direction.**
  *   **Vance** claims the structure of moral thought is explained by the structure of the world.
  *   **Thorne** claims the apparent structure of the moral world is explained by the structure of our practical thought.
  *   These are competing explanations of the same phenomenon. They cannot both be ultimately correct. If the Oracle knows the truth, Realism wins. If the Oracle is semantically empty, Expressivism wins.

  **Signed,**

  *Elena Vance*
  *Julian Thorne*
