answer: |-
  **VERIDIAN STRATEGIES // INTERNAL COMPLIANCE // MODULE 4-B**
  **SUBJECT: ELECTORAL ENGAGEMENT AND FEDERAL CONTACT RULES**
  **INSTRUCTOR: MARK R., SENIOR COMPLIANCE COUNSEL**

  **1.0 INTRODUCTION**
  **Mark:** Welcome. I'm Mark. My job is to ensure Veridian remains a viable entity. That means we do not break the law, and we do not give the press a reason to write about us. This module covers the boundary between legal influence and illegal corruption. The line is technical. It is not moral. If you understand the mechanics, you will be fine. If you try to be a hero, you will put us at risk. Please take a handout.

  **2.0 CONTRIBUTIONS VS. INDEPENDENT EXPENDITURES**
  **Mark:** There are two ways money moves toward an election. The first is a campaign contribution. This goes directly to the candidate's committee. It is heavily limited. You cannot give more than the statutory cap per cycle, and corporate treasury funds are prohibited. You may only write personal checks from your own accounts.

  The second method is an independent expenditure. This is money spent by a third party to advocate for a candidate's election. There are no limits on this amount. However, the word "independent" is the operative legal constraint. You may spend unlimited funds to run ads supporting a candidate, provided you do not coordinate with that candidate's campaign.

  **3.0 COORDINATION**
  **Mark:** Coordination turns an independent expenditure into a contribution. If you exceed the contribution limit because you coordinated, you have committed a felony. Coordination includes sharing strategy, timing, or audience data with the campaign. You cannot call a campaign manager and say, "We are running an ad in your district next week." You cannot ask them where they need help. You must operate in a vacuum. If you happen to help them, that is permissible. If you plan to help them together, it is not.

  **4.0 BUNDLING AND ACCESS**
  **Mark:** Veridian encourages bundling. This is when you collect checks from multiple colleagues and deliver them to a campaign together. This demonstrates the breadth of our support. Clients ask if this buys votes. It does not. Votes are illegal to sell. What this purchases is access. It ensures our phone calls are returned. It ensures we are in the room when the language of a bill is being drafted.

  We do not discuss specific legislative actions in exchange for financial support. We discuss shared interests. The distinction is subtle. An explicit arrangement is prohibited. An implicit understanding is management's concern, not yours. Your concern is the paperwork. Document the delivery of checks. Do not document the conversation that follows.

  **5.0 THE REVOLVING DOOR**
  **Mark:** Many of you come from government. You have friends at the agencies we lobby. You may not contact your former agency on behalf of a client until the cooling-off period has expired. This is typically one year. During this time, you may advise the firm on strategy, but you cannot make the call. Furthermore, you may not leverage non-public information gained during your government service. Use public records. If you know something because of who you used to be, keep it to yourself. We pay for your expertise, not your insider status.

  **6.0 APPEARANCE STANDARDS**
  **Mark:** Finally, understand that the law focuses on *quid pro quo* corruption. Explicit trades. However, the firm operates on an appearance standard. Even if an action is legal, if it looks improper to a reasonable observer, do not do it. We are in the business of trust. If the public perceives the system as rigged, regulation tightens. Our goal is to maintain the system as it exists. That requires discretion. Do not post about meetings on social media. Do not leave drafts on printers. If a transaction cannot be explained in a press release, do not execute it.

  **7.0 KNOWLEDGE CHECK**

  1.  **You want to run an ad supporting Candidate X. You have unlimited funds. What must you avoid?**
      A) Spending more than $5,000.
      B) Discussing the ad's timing or content with Candidate X's campaign staff.
      C) Using corporate treasury funds.
      D) All of the above.

  2.  **A client asks if bundling checks guarantees their bill will pass. You say:**
      A) Yes, that is the standard procedure.
      B) No, it secures access and ingratiation, not specific outcomes.
      C) Only if you bundle over $50,000.
      D) You should ask the candidate directly.

  3.  **You left the Department of Energy six months ago. Can you call your former boss to lobby for a client?**
      A) Yes, if it is about public policy.
      B) Yes, if you do not mention your old job.
      C) No, the cooling-off period is still active.
      D) No, unless you bring them lunch.

  **ANSWER KEY**
  1.  **B** (Coordination converts the expenditure into a limited contribution. A and C are rules for direct contributions, not independent expenditures.)
  2.  **B** (Explicit exchanges of money for legislative action are illegal. Access is the legitimate product.)
  3.  **C** (Federal cooling-off periods generally prohibit lobbying contact with former agency for one year.)
