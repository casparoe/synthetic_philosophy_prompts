      *   *Refinement:* Let's make it human to keep the "will" aspect relevant. A triage officer. Two patients, identical vitals, identical prognosis, identical distance. Only one med-evac slot left *now*.
      *   *Wait, too much moral weight.* Let's go with something sterile but urgent.
      *   *Revised Scenario:* A network architect configuring a redundant system. Two routers, identical specs, identical load, identical distance. The system hangs if no selection is made. The architect must hard-code a preference or use a randomizer.
      *   *Better:* A curator hanging two identical prints. No, too low stakes.
      *   *Best:* A "Save Point" scenario in a critical system. Or perhaps a legal judge? No, too much precedent.
      *   *Let's go with the "Two Keys" scenario.* A security protocol requires selecting one of two encryption keys to authorize a transaction. Both keys are mathematically equivalent in security and speed. The transaction times out if no key is selected. The agent considers using a rule (e.g., "always pick Key A" or "flip a coin").
      *   *Actually, let's make it more philosophical/agency-focused.* A character choosing between two identical doors in a puzzle room. If they don't choose, the room floods.
      *   *Let's settle on:* **The Archivist's Dilemma.** An archivist must digitize one of two identical manuscripts before a fire destroys them both. They can only save one. They are identical in historical value, physical state, and content.
      *   *Wait, the prompt asks for "no reason to prefer either option" but the agent can adopt a tie-breaking procedure.*
      *   *Final Case:* **The Redundant Switch.** An operator must close one of two valves to stop a leak. Both valves are equidistant, identical mechanism, identical flow rate. If neither is closed, the tank bursts. The operator considers adopting a rule: "Always close the left valve in case of symmetry."

