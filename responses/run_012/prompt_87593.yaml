  4.  **Drafting the Model Answer:**
      *   *Thesis:* The tie-breaking procedure is a second-order reason, not a first-order one. It resolves the paralysis but shifts the normative ground.
      *   *Argument:* Distinguish between reasons for the *action* (closing valve A) and reasons for the *policy* (adopting the left-hand rule).
      *   *Uncertainty:* Need to highlight where the argument is shaky. Is the policy arbitrary? If arbitrary, is it rational?
      *   *Word Count:* Keep it tight, around 500.
      *   *Constraint:* Must explicitly state uncertainty.

  5.  **Drafting the Marking Scheme:**
