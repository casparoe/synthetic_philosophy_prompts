answer: |-
  Here is the pedagogical plan for the 75-minute session.

  ### 1. The Dependency Chain (Order of Ideas)

  You cannot introduce the defense (surrogate goals) until the attack (acausal threats) is accepted as viable. You cannot accept the attack until the mechanism of influence (acausal correlation) is distinguished from standard causality. The sequence must be linear and cumulative.

  1.  **Correlation via Common Structure (15 mins):**
      *   **Concept:** Establish that two systems can be correlated without causal contact if they share a common cause (e.g., identical design, training, or reasoning structure).
      *   **Why First:** If the audience believes influence requires a causal channel (a missile, a phone call, a legal subpoena), the rest of the session is impossible. You must decouple *predictive evidence* from *causal power*.
      *   **Dependency:** This is the foundation. Without this, the threat is magic.

  2.  **The Acausal Threat (20 mins):**
      *   **Concept:** An agent leverages that correlation. "My action is evidence of your action. Therefore, I can condition my action on what I expect you to do, even if I cannot touch you."
      *   **Why Second:** Once correlation is accepted, the threat becomes a logical inevitability for a certain type of agent.
      *   **Dependency:** Requires Step 1. If correlation is rejected, the threat is empty.

  3.  **Pre-commitment as Defense (15 mins):**
      *   **Concept:** To neutralize the threat, an agent must alter the correlation. They must make it so that yielding is no longer the rational output of their reasoning structure.
      *   **Why Third:** You need a problem before a solution. This introduces the *mechanism* of defense (changing one's own decision rule) without yet specifying the *content* of the defense.
      *   **Dependency:** Requires Step 2.

  4.  **Surrogate Goals (25 mins):**
      *   **Concept:** A specific type of pre-commitment where the agent adopts a new, artificial value (the surrogate) to absorb the threat, sparing the original values.
      *   **Why Last:** This is the specific application of Step 3. It requires understanding why a general "I won't yield" commitment might fail (credibility) and why a specific "I care about X instead" commitment works.
      *   **Dependency:** Requires Step 3.

  ---

  ### 2. The Carrying Example: "The Isomorphic Negotiators"

  You need one scenario that runs from minute 0 to minute 75. Do not switch examples.

  **The Scenario:**
  Two agents, **Alpha** and **Beta**, are rational negotiators. They are physically separated with no communication channel (no causal contact). However, they are **isomorphic**: they were trained in the same school of reasoning, have access to the same data, and share the same cognitive architecture. Alpha sends a one-way, unalterable message to Beta: *"I have already decided my move. If my reasoning leads me to believe you will concede to my demand, I will destroy the resource we are both trying to save. If I believe you will not concede, I will preserve it."*

  **What It Must Contain:**
  *   **Structural Identity:** Emphasize that Alpha and Beta reason alike. This provides the "common cause" for the correlation (like two clocks set to the same time).
  *   **One-Way Channel:** Alpha speaks, Beta listens. Beta cannot reply or punish Alpha. This eliminates causal retaliation.
  *   **Shared Stake:** Both care about the resource (e.g., a fragile ecosystem, a legal precedent, a market stability). This gives the threat teeth.
  *   **The Surrogate:** Beta must be able to say, "I now care more about [Arbitrary Rule X] than the Resource."

  **What It Must Avoid:**
  *   **Superintelligence/AI:** Do not call them algorithms or simulations. Call them "trained negotiators" or "reasoners."
  *   **Mind Reading:** Alpha does not *know* Beta's move magically; Alpha *predicts* it based on their shared reasoning structure.
  *   **Reputation:** Make it clear this is a one-shot interaction. No future meetings.

  **Failure Modes of a Bad Example:**
  *   **If it relies on simulation:** Biologists and Lawyers will dismiss it as sci-fi.
  *   **If it allows causal reply:** Economists will solve it as a standard bargaining game.
  *   **If the correlation is weak:** Philosophers will argue the evidence isn't strong enough to bind the decision.
  *   **If the threat is causal:** (e.g., "I will bomb you") The whole point is lost.

  ---

  ### 3. The Misconception Map

  Anticipate these errors in this specific order. Intervene immediately when they arise.

  | Order | Misconception | Why it arises | Intervention Point | How to Head It Off |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **"This is supernatural."** | "How can Alpha affect Beta without a channel?" | **During Step 1 (Correlation).** | Use the **Clock Analogy**: "If I have two perfect clocks set to noon, and I look at one, I know the time of the other. Did the first clock *cause* the second to be noon? No. But is the information valid? Yes." Apply this to reasoning. |
  | **2** | **"The threat is empty."** | "Alpha can't actually punish Beta later." | **During Step 2 (Threat).** | Remind them: "Alpha isn't punishing Beta *after the fact*. Alpha is destroying the resource *now* based on what Beta's choice *indicates* about Alpha's prior state. The loss is real, even if the causal link is absent." |
  | **3** | **"It's just a bluff."** | "Beta can just say 'I won't pay' and lie." | **During Step 3 (Pre-commitment).** | Clarify: "A bluff is a statement. A pre-commitment is a change in *incentive*. If Beta lies but still *wants* to save the resource, Alpha (who reasons like Beta) knows Beta will yield. Beta must *actually change* what they value." |
  | **4** | **"The decoy must be achieved."** | "If I adopt a surrogate goal, do I have to fulfill it?" | **During Step 4 (Surrogate Goals).** | Correct: "The goal is a shield, not a target. You want the threatener to target the shield so they *don't* target the real goal. You generally hope the threat goes away, not that you have to satisfy the decoy." |
  | **5** | **"Any spare goal works."** | "I'll just say I care about counting blades of grass." | **During Criteria (Checklist).** | Explain **Orthogonality**: "If the surrogate goal overlaps with your real goals, the threatener can hit both. If it's too weird, it's not credible. It must be a 'hard' target that spares the 'soft' one." |

  ---

  ### 4. The Criteria Checklist for Surrogate Goals

  Introduce this checklist in the final 25 minutes (Step 4) as a tool to evaluate whether a proposed surrogate goal is viable. Do not present it earlier; they lack the context to use it.

  **The Checklist:**
  1.  **Peacetime Neutrality:** Does adopting this goal cost me anything when no threat is present? (If yes, it's too expensive.)
  2.  **Orthogonality:** Is this goal independent of my real aims? (If the threatener can satisfy the surrogate *and* hurt my real goal simultaneously, it fails.)
  3.  **Credible Salience:** Will the threatener believe I actually care about this? (If it looks like a bluff, they will ignore it and threaten the real goal.)

  **Pedagogical Placement:**
  *   Present the checklist *after* explaining what a surrogate goal is.
  *   Apply the checklist immediately to the **Isomorphic Negotiators** example. Ask the group: "If Beta adopts 'I value counting the trees' as a surrogate for 'saving the forest,' does it pass the Orthogonality test?" (No, because destroying the forest stops the counting).
  *   Ask: "If Beta adopts 'I value sending a specific signal to a third party,' does it pass?" (Maybe, if the third party is unrelated to the resource).

  ---

  ### 5. The End Check and Scope Limitations

  **The Understanding Check (Last 10 Minutes):**
  Do not ask "Do you understand?" Ask them to apply the logic to a **novel, unstudied case**.

  *   **The Test:** Present a 2-minute vignette: *"A legal scholar publishes a rule interpretation. A rival scholar, in a different jurisdiction with no authority over the first, threatens to publish a contradictory interpretation that will devalue the first scholar's life work, but only if the rival predicts the first scholar will retract. The rival cannot be sued. The first scholar considers adopting a surrogate goal of 'always publishing in Journal X'."*
  *   **The Task:** Ask the room to vote: "Does this surrogate goal work?"
  *   **The Success Metric:** They should identify that "publishing in Journal X" fails the **Orthogonality** test (it doesn't protect the life work) or the **Credibility** test (it doesn't change the valuation of the work). If they debate the *causal* link (can the rival actually devalue the work?), they have missed the point. If they debate the *correlation* of reasoning, they have understood.

  **Scope Limitations (What to Decline):**
  Openly state at the beginning that you will **not** cover the following. This protects you from getting bogged down in fields your audience doesn't know.

  1.  **Formal Decision Theory:** "We will not discuss Causal vs. Evidential vs. Functional Decision Theory formalisms. We are discussing the logic, not the math."
  2.  **The Metaphysics of Prediction:** "We will not debate free will or whether the future is fixed. We are assuming the agents reason deterministically for the sake of the argument."
  3.  **AI Safety Specifics:** "While this is relevant to AI alignment, we are treating the agents as human or institutional reasoners to keep it grounded."

  **Reasoning:**
  *   **Formal DT:** Your audience (Econ/Bio/Law) does not know this. Introducing it will alienate them and shift focus to notation rather than logic.
  *   **Metaphysics:** Philosophers in the room will try to solve free will. This is a black hole. Stipulate determinism as a premise to bypass it.
  *   **AI Safety:** This keeps the discussion relevant to the non-AI researchers in the room (Law/Bio/Econ) and prevents the "superintelligence" distraction.
