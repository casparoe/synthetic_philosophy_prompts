answer: |-
  Here are ten substantive interview questions designed to probe the internal machinery of your guest's "two-tier reading," complete with follow-ups that anticipate her likely defenses.

  **1. The Taxonomy of Unrealism**
  Your reconstruction hinges on the claim that Friedman was only defending *domain-specifying* assumptions against charges of unrealism. But before we classify them, we need to know what counts as "unrealistic" in your framework. Is an assumption unrealistic because it is strictly false, because it is an approximation, or because it is a deliberate abstraction? If a model assumes "perfect information," is that a false claim about the world, or just a useful simplification, and does your two-tier reading treat those differently?

  *   **Follow-up:** You will likely say that abstraction is permissible even if falsity is not. But if an abstraction is *too* wide, it becomes false. At what precise point does a "simplifying abstraction" cross the line into a "false domain specification" that invalidates the model on your view?

  **2. The Hybrid Assumption Problem**
  A significant challenge to your distinction is that single assumptions often do double duty. Consider the assumption of "profit maximization." It posits a mechanism (agents seek profit) but also specifies a domain (this model applies only where profit is the motive). If an assumption functions as both mechanism-positing and domain-specifying, does your two-tier reading collapse? How do we adjudicate the assumption's validity if it fails on one tier but succeeds on the other?

  *   **Follow-up:** I anticipate you'll suggest we can analytically separate the two functions. But if the *mechanism* is false (agents don't actually maximize profit), doesn't that inevitably corrupt the *domain* specification, rendering the predictive success accidental rather than robust?

  **3. Friedman's Stock Illustrations**
  Friedman famously relies on the expert billiard player and the leaves arranging themselves around a tree to defend his thesis. On your reading, are these examples of domain-specifying assumptions or mechanism-positing ones? If they are meant to show that agents act *as if* they are maximizing, doesn't that suggest Friedman was actually making a claim about psychological mechanisms being irrelevant, which contradicts your restriction that mechanism assumptions *must* be realistic?

  *   **Follow-up:** If you argue these examples support your view, you'll likely claim they illustrate successful prediction despite wrong mechanisms. But doesn't the leaves example actually rely on a *true* mechanism (evolutionary selection) to explain the prediction, thereby smuggling realism back in through the back door?

  **4. The Underdetermination Worry**
  If the realism of domain-specifying assumptions is irrelevant to appraisal, we face an underdetermination problem. Imagine two models with identical predictive success, but Model A assumes the domain is "competitive markets" and Model B assumes the domain is "monopolistic markets." If prediction is the only arbiter, how do we choose between them? Does your view force us to accept both as equally valid, even though they imply contradictory policy interventions?

  *   **Follow-up:** You might respond that further testing will distinguish them. But if they are predictively equivalent *within the range of observed data*, does your methodology leave us without any rational basis for preferring one domain description over the other until a crisis occurs?

  **5. Instrumentalism and Explanation**
  Critics often label Friedman an instrumentalist, arguing that his view reduces theories to mere calculation devices rather than explanations of reality. Does your two-tier reading accept the instrumentalist label for the domain tier? If so, is that an objection at all? Or do you believe that by saving the mechanism tier, you preserve the capacity for genuine causal explanation?

  *   **Follow-up:** If you deny the instrumentalist label, you'll likely argue that domain assumptions still describe the world's structure. But if those descriptions don't need to be realistic to be accepted, in what sense are they describing *reality* rather than just organizing *observations*?

  **6. Policy and Domain Creep**
  Let's move to the practical stakes. If models are judged primarily by prediction, what constrains an economist from applying a model with false domain-specifying assumptions to a policy context they were never meant to cover? For instance, using a frictionless labor market model to design unemployment insurance during a shock. If the model predicted well previously, what stops this misuse on your account?

  *   **Follow-up:** I expect you'll say that peer review or empirical testing catches this. But policy decisions often must be made faster than empirical testing can validate a domain shift. Does your methodology lack an *ex ante* safeguard against applying a model outside its intended, albeit unrealistic, domain?

  **7. Verifying the Mechanism Tier**
  On your view, mechanism-positing assumptions *do* need to be realistic. But in economics, causal mechanisms are notoriously difficult to observe directly. How do we verify the realism of a mechanism without relying on the very predictive success you've relegated to the second tier? Are we not forced to judge the realism of the mechanism by the success of the prediction, which circularly restores Friedman's original thesis?

  *   **Follow-up:** If you appeal to independent evidence (like micro-data) to verify mechanisms, doesn't that imply that *all* assumptions, including domain ones, should ideally be grounded in that same data, thereby eroding the necessity of your two-tier distinction?

  **8. Theory Progress and Accumulation**
  One of the traditional arguments for realism is that it allows science to progress by accumulating true claims about the world. If domain assumptions are merely tools that can be swapped out as long as prediction holds, does economics progress on your view, or does it just iterate through different tools? Can we say a modern model is "better" than a 1950s model in a way that isn't purely about fit?

  *   **Follow-up:** You will likely argue that we accumulate better *mechanisms*. But if the domain assumptions change radically with every new model, doesn't that fragment the discipline into incommensurable toolkits rather than a unified body of knowledge?

  **9. The Behavioral Economics Challenge**
  Behavioral economics often argues that we need more psychologically realistic assumptions to improve prediction. How does your reconstruction accommodate this? Is behavioral economics correcting false *mechanism* assumptions (which your view demands be realistic) or is it correcting *domain* assumptions (which your view says don't need to be realistic)?

  *   **Follow-up:** If you say behavioral econ fixes mechanism assumptions, does that imply neoclassical economics was scientifically deficient for decades? Or if you say it fixes domain assumptions, doesn't that prove that making domain assumptions *more* realistic actually matters for prediction, contradicting Friedman's core insight?

  **10. Exegetical Charity vs. Historical Accuracy**
  Finally, a question on the history of thought. You argue this is a defensible reconstruction of Friedman. But is it what Friedman *actually* meant, or is it a charitable revision to save him from his critics? If it's the latter, does it matter? Can we claim to have solved the "Friedman debate" if we are essentially solving a problem Friedman himself didn't articulate?

  *   **Follow-up:** If you concede this is a revision rather than an exegesis, does that weaken the rhetorical power of your defense? Why anchor the argument to Friedman's 1953 text if the solution requires substantially altering the text's original philosophical commitments?
