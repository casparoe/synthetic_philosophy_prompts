  My dad (58) was told the small tumor they found is "about 20% likely to come back in the next five years if we just watch it," and now he and my brother wont stop arguing about it at dinner. Dad says the number is meaningless for him — it's a fact about a bunch of other men in some study, and he isn't a statistic. My brother says no, it's a real fact about his tumor: this kind of tumor has a tendency to come back, and 20% is just how strong that tendency is, the study only measured it. Then the surgeon admitted the 20% came out of a risk calculator trained mostly on men in their 70s, and that if you change which comparison group you feed it you can get anything from 12% to 35%. Now dad thinks the whole thing is made up and wants to skip the follow-up scans. I have to referee this. Which of them is closer to right about what that number actually is, and does the answer change what he should do? One paragraph, max 250 words.
