      *   *Decision Theory:* TDT/UDT vs. CDT (Causal Decision Theory).

  3.  **Drafting the Translation (Distributed Systems Vocabulary):**
      *   *Agents:* Deterministic State Machines (DSMs).
      *   *Environment:* Isolated partitions (Network Partitions in CAP terms). No message passing (`send`/`recv` returns null or times out immediately).
      *   *Shared State:* There is no shared mutable state. There is, however, shared *immutable* state (the binary/code).
      *   *Communication:* No physical packets. The "channel" is the logical implication derived from code identity.
