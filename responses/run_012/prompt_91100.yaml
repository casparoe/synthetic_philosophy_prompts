answer: |-
  The dispute between endurantism and perdurantism concerns the metaphysical structure of persistence. While often summarized as the contrast between being wholly present at each moment and having distinct temporal parts, this formula obscures the deeper disagreement regarding property instantiation and change. Endurantism commits to the view that a persisting object is a continuant that exists completely at every moment of its history. Consequently, when an object has a property at a time, the temporal qualification attaches to the possession relation itself. The object stands in a ternary relation of having-a-property-at-a-time. Change consists in one and the same entity bearing incompatible properties at different times, such as being bent at time t1 and straight at time t2. The explanatory weight here rests on the primitive notion of temporal instantiation. The risk is circularity: explaining persistence by invoking time-laden property possession presupposes the very temporal framework it seeks to elucidate.

  Perdurantism, by contrast, treats persisting objects as four-dimensional entities extended through time. Temporal qualification attaches not to the possession relation but to the subject of possession. An object has a property simpliciter because a specific temporal part of that object has the property. Change consists in qualitative variation across these parts, analogous to spatial variation across a road's segments. The explanatory weight falls on the analogy between space and time. The risk for this view is an unexplained primitive regarding the unity of the parts: what makes a series of temporal slices a single object rather than a mere collection? Having clarified the structural commitments of each view, we must test them against cases where instantaneous description fails to capture dynamic reality.

  Consider the argument from rotating homogeneous discs. Imagine a disc uniform in color and density rotating about its axis. At any single instant, its qualitative state appears indistinguishable from an exactly similar disc at rest. If the instantaneous state includes only qualitative arrangement, nothing in that state reveals motion. Yet the disc rotates. Before relying on this argument, one must assess the premise regarding instantaneous states. If an object's state includes its velocity vector, the states differ, and the argument collapses. However, if velocity is derived from position over time, the instantaneous snapshot is indeed identical. Assuming the latter, the endurantist faces a difficulty: a wholly present disc must be moving at an instant where its material arrangement matches a static disc. To resolve this, the endurantist must treat velocity as an intrinsic property of the object at that instant, independent of spatial displacement. This commits them to primitive instantaneous rates of change.

  The perdurantist analyzes the case differently. The rotating disc is a four-dimensional worm whose temporal parts are angled differently relative to one another across time. The rotation is explained by the twisted structure of the temporal extension. However, one must be candid about the price paid here. If the instantaneous slices are qualitatively identical, the perdurantist explains rotation merely by asserting a difference in the relational ordering of parts across time. This risks restating the phenomenon in a longer idiom rather than explaining the dynamism. Nevertheless, the endurantist pays a higher cost by requiring shape and mass to be relations to times rather than intrinsic features of the object simpliciter. The perdurantist preserves the intrinsicality of properties for parts, whereas the endurantist must relativize the properties of the whole. Having examined the dynamic case, we must now address static objections regarding unity and intrinsicality.

  Two major objections target the coherence of these accounts. The first targets perdurantism: it never explains how temporal parts compose a single persisting thing. If the parts are held together by a further relation, such as causal connection, the same question arises regarding what binds that relation to the parts. If they are not bound by a further relation, the unity of the object is simply assumed. This suggests a regress or a brute fact of composition. The second objection targets endurantism: temporally qualified properties are not intrinsic properties at all. If an object is only bent-at-t, then nothing ever simply has a shape. The object's nature is entirely relational.

  Consider whether the second objection is a reductio or a manageable revision. The endurantist can absorb this by arguing that having-a-shape-at-a-time is the fundamental way material objects possess qualities. It is a revision of the concept of the intrinsic, but not a denial of reality. However, the perdurantist faces a parallel difficulty. If temporal parts are defined by their position in the four-dimensional whole, their properties may also be relational. If a temporal part is only a part in virtue of belonging to a worm, its identity depends on the whole. Thus, both views struggle to locate a non-relational foundation for property possession. The perdurantist locates it in the slice, the endurantist in the continuant-at-a-time. Neither escapes relationality entirely. To push the comparison past these standard exchanges, we must test both views against specific metaphysical stipulations regarding space and process.

  The first stipulation is the parity principle: differences between temporal and spatial dimensions are structural facts to be explained rather than brute asymmetries. A theory treating time as formally on a par with space is preferred. Perdurantism fares better here. It treats temporal extension as analogous to spatial extension, denying a metaphysical privilege to the present. Endurantism treats time as unique, requiring objects to be wholly present in a way they are not wholly present in space. The second stipulation is the process-first constraint: what is fundamental are processes and activities, and continuants are stable patterns abstracted from them.

  Here we must distinguish two versions of perdurantism. The worm view holds that the persisting object is the four-dimensional whole, with momentary stages as its parts. The stage view holds that the persisting object is the momentary stage itself, and persistence consists in a relation of succession between stages. The worm view does not satisfy the process-first constraint; it extends substance ontology into a fourth dimension, reifying the history as a static block. The stage view comes closer, as it treats the instantaneous entity as fundamental. However, it still relies on a substance-like stage rather than a pure activity. Regarding the objections from section three, the stage view escapes the composition problem because there is no whole to compose; there are only stages and their relations. However, it inherits the problem of trans-temporal identity: what makes a later stage the successor of an earlier one? Neither version genuinely approaches the process-first picture. Both extend a substance ontology, either vertically into a worm or horizontally across a sequence of stages. They reify the endpoints of processes rather than the processes themselves.

  Having weighed the structural commitments and the costs of each account, a verdict is required. Perdurantism, specifically the worm view, is better supported on the grounds of the parity principle. It offers a unified ontology of spacetime that aligns with the structural insights of modern physics without requiring primitive temporal instantiation relations. It dissolves the problem of change by distributing incompatible properties across distinct entities, avoiding the logical tension of one thing being both bent and straight. However, this verdict relies on the assumption that the temporal dimension is ontologically similar to spatial dimensions.

  One consideration would lead to the abandonment of this verdict: the robust reality of temporal passage. If it can be demonstrated that the flow of time is a mind-independent feature of reality, and that the present possesses a metaphysical privilege not shared by spatial locations, perdurantism fails. The block universe required by perdurantism cannot accommodate a moving now. In such a scenario, endurantism would be required to account for the unique ontological status of the present moment. Until such a demonstration is made, the structural parity of spacetime favors the four-dimensional account.
