answer: |-
  Dear Colleague,

  It is a delight to hear about your seminar, and I must say that your students have put their finger on precisely the nerve that makes Orlando such a fertile text for metaphysics. The money analogy is seductive for a reason, and you would be wise not to dismiss it too quickly, for it captures something essential about the arbitrariness of social kinds that purely biological accounts miss. When your students say sex is like currency, they are invoking a Searlean status function, the idea that X counts as Y in context C solely in virtue of collective acceptance. In this light, Orlando's body is the paper and her gender is the denomination, valuable only so long as the community agrees to honor it. The novel sustains this analogy brilliantly in the scenes you mentioned, particularly the episode with the Gipsies. When Orlando arrives among them, her English title and deed to the estate are worthless; the social kind English Nobleman has no currency in that economy, proving that the status is not intrinsic to the person but dependent on the recognizing community. Similarly, the revelation that the Archduchess is actually an Archduke supports the conferralist view that the label does the work rather than the biology underneath. If the community accepts the Archduke as a woman, then for all social purposes, she is one, and the biological reality is irrelevant until the collective acceptance shifts. Even the lawsuits over the estate, which the biographer perpetually defers, highlight that Orlando's legal personhood is a matter of record and recognition, not flesh. In these moments, Woolf seems to agree with your students: gender is a status conferred by the gaze of others, mutable and context-dependent, much like the fluctuating value of money across borders.

  However, if you stop there, you risk flattening the novel into a mere illustration of status functions, and this is where the money analogy begins to distort the metaphysics of the text. Money, in the pure Searlean sense, does not change the fiber of the paper it is printed on; a dollar bill does not become more fibrous because it is accepted as legal tender. But in Orlando, the conferral of the status Woman changes the material reality of the person who holds it. This is where you must introduce your students to the distinction between kinds that are constructed via conferral and kinds that are constructed via causal shaping, the interactive kinds described by Hacking or the structural categories analyzed by Haslanger. The novel refuses to let the change be a mere status swap with no remainder. When Orlando becomes a woman, she does not just acquire a new label; she acquires a new vulnerability. The biographer insists that chastity becomes their jewel, their centrepiece, something they run mad to protect and might die when ravished of. This is not a feature of currency; a dollar bill does not fear rape. This shift points toward the causal shaping view, where membership in a social kind disciplines the body and mind until the person reflects the category. The hours at the hairdresser, the looking-glass, the adjustment of gait and gesture, these are looping effects where the classification produces the traits that justify the classification. Woolf dramatizes this when Orlando reflects on the voyage home that she will now have to pay in her own person for the desires she indulged as a young man. The metaphor of payment is crucial here; it suggests that while the status might be like money, the cost is bodily.

  This brings us to the difficulty your students raise regarding socialization, the claim that Orlando cheats because she was not raised inside the kind from birth. If gender is causally shaped by being raised as a woman, does Orlando's sudden transition undermine the theory? I would argue that it does the opposite. Orlando serves as a stress test for the causal model. She demonstrates that the shaping does not require a lifetime of subtle conditioning to take hold; once the status is conferred by the world, the world enforces the shape with immediate violence. The Spirit of the Age is not a body of collective belief Orlando could opt out of; it is an enforcer that arrives with the nineteenth century like weather and makes her put on a ring. This is not merely collective acceptance; it is atmospheric pressure. The sailors and landladies and shopkeepers who read the same body as a woman's and adjust their conduct accordingly are not just validating a status; they are constraining a life. They force her into the mold. So, Orlando was not raised as a woman, but she is captured by womanhood, and the novel shows how quickly the causal shaping begins once the conferral occurs. The cheat is not in the metaphysics but in the biography; Woolf removes the childhood socialization to show us the raw mechanics of the adult enforcement.

  You ask whether Woolf saw the difference more clearly than the philosophers have, and I am tempted to say yes, precisely because she refuses to choose between the two models. Contemporary metaphysics often struggles to reconcile the arbitrariness of the status with the inevitability of the experience. Haslanger emphasizes the structural oppression, while Searle emphasizes the constitutive rules, but Woolf shows them as simultaneous. The novel dramatizes a mixture where the status is conferred like money but sticks like gravity. The identity survives intact, as the biographer insists, because the self is distinct from the kind, but the future is altered because the kind dictates the possibilities of action. This implies that gender and money are not constructed in exactly the same way. Money is constructed primarily through conferral; its power is extrinsic. Gender is constructed through conferral that triggers causal shaping; its power becomes intrinsic through habituation and threat. The analogy to currency is a seductive mistake if it suggests that the change is only in the eyes of the beholder. In Orlando, the change is in the eyes of the beholder, but those eyes have hands, and they touch her.

  So, when you return to your seminar, do not hedge. Tell the student who insists it is all just money that they are right about the validation but wrong about the valuation. Tell them that money is a status function that leaves the paper unchanged, but gender is a status function that changes the person who holds it. Tell them that Woolf shows us that while the title of Woman may be conferred like currency, the expenditure is paid in flesh. The novel vindicates the thought that gender is a conferred status only insofar as that conferral initiates a causal process that reshapes the life. If you must give them a single sentence to take away, tell them this: Money is what the community accepts you as, but gender is what the community makes you become.
