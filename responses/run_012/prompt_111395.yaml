answer: |-
  ### The Constitutional-Remedial Protocol (CRP)

  This procedure is designed to be run in under five minutes per case. It does not solve the philosophical disagreement between the **Plebiscitary View** (majority will is enough) and the **Remedial View** (secession requires prior injustice). Instead, it routes the case to the appropriate standard based on the relationship between the region and the central state. It treats the "Rule of Law" and "Human Rights" as two separate gates; passing either grants legitimacy, but the requirements differ.

  **Instructions:** Answer each question in order. If you answer "No" to a bolded **Veto Condition**, the verdict is **NOT LEGITIMATE**. If you reach the **Value Stop**, you must declare that the decision rests on political judgment, not factual procedure.

  #### Step 1: The Boundary Test (Fact Check)
  *Question:* Is the claiming group defined by pre-existing, recognized administrative borders (e.g., a province, state, or autonomous community) that have been stable for at least 20 years?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **VERDICT: NOT LEGITIMATE.** (Reason: Arbitrary boundary drawing invites infinite regression and ethnic cleansing. The unit is undefined.)
  *   *Note:* This solves the **Boundary Problem** by deferring to status quo administrative lines unless they are proven to be recent gerrymanders designed specifically to dilute the secessionist vote.

  #### Step 2: The Constitutional Consent Test (Fact Check)
  *Question:* Does the existing state's constitution or central government explicitly allow for a secession referendum, or have they granted specific permission for *this* vote?
  *   **Yes:** Proceed to Step 3 (Plebiscitary Path).
  *   **No:** Proceed to Step 4 (Remedial Path).

  #### Step 3: The Plebiscitary Path (Process Check)
  *Context:* Since the state consented, the burden of proof is low. The right is procedural.
  *Question:* Was the referendum conducted with neutral oversight, a clear question, and a simple majority threshold?
  *   **Yes:** **VERDICT: LEGITIMATE PROCESS.** (Note: This validates the *right to try*, not necessarily the outcome.)
  *   **No:** **VERDICT: NOT LEGITIMATE.**
  *   *Stop:* Do not proceed to Step 4.

  #### Step 4: The Remedial Path (Grievance Check)
  *Context:* Since the state did *not* consent, the secession is unilateral. The burden of proof is high. The right is moral, not procedural.
  *Question:* Is there evidence of **severe, persistent, and physical** rights violations against the group by the central state (e.g., military occupation, mass disenfranchisement, ethnic cleansing, revocation of prior autonomy treaties)?
  *   **Yes:** Proceed to Step 5.
  *   **No:** **VERDICT: NOT LEGITIMATE.** (Reason: Policy disagreements, tax disputes, or cultural friction are grievances, not remedial causes.)
  *   **VALUE STOP POINT:** Determining what counts as "severe and persistent" is not mechanical. If the evidence is ambiguous (e.g., verbal hostility vs. police violence), you must stop and declare: *"The facts are disputed; this verdict depends on whether you prioritize State Integrity or Group Autonomy."*

  #### Step 5: The Recursion Check (Consistency Veto)
  *Question:* Does the seceding leadership explicitly commit to allowing *their own* internal minorities or sub-regions to use this same procedure (Step 1 through Step 4) to leave the new state?
  *   **Yes:** **VERDICT: LEGITIMATE CLAIM.**
  *   **No:** **VERDICT: NOT LEGITIMATE.** (Reason: Asserting a right you deny to others is a contradiction that invalidates the moral claim.)

  ***

  ### Application to Cases

  Here is the application of the CRP to your three required cases. I have adhered strictly to the procedure above.

  #### Case 1: Scotland (2014 Independence Referendum)
  1.  **Boundary:** Yes. Scotland has historic, stable administrative borders within the UK.
  2.  **Consent:** Yes. The UK Parliament granted a Section 30 Order specifically authorizing the referendum.
  3.  **Plebiscitary Path:** Yes. The question was clear ("Should Scotland be an independent country?"), oversight was neutral (Electoral Commission), and the threshold was simple majority.
  4.  **Recursion:** (Skipped due to Step 3 pass, but hypothetically Yes/Unknown).
  *   **VERDICT: LEGITIMATE PROCESS.**
  *   *Reasoning:* This passes the Constitutional Consent Test. It does not matter that the vote failed (55% No); the *right to hold the vote* was legitimate under the CRP.

  #### Case 2: Catalonia (2017 Independence Referendum)
  1.  **Boundary:** Yes. Catalonia is an Autonomous Community with stable borders.
  2.  **Consent:** No. The Spanish Constitution (Article 2) asserts the "indissoluble unity of the Spanish Nation." The Constitutional Court suspended the referendum law.
  3.  **Remedial Path:** No. While there are grievances regarding fiscal balance and language policy, there is no evidence of physical oppression, disenfranchisement, or military occupation by Madrid sufficient to meet the "severe and persistent" threshold prior to the vote. (Police violence *on* voting day is a reaction, not a prior cause for secession).
  4.  **Recursion:** (Not reached).
  *   **VERDICT: NOT LEGITIMATE.**
  *   *Reasoning:* Fails Constitutional Consent. Fails Remedial Justification. It was a unilateral secession attempt without a remedial cause.

  #### Case 3: Quebec (1995 Referendum)
  1.  **Boundary:** Yes. Quebec is a province with stable historic borders.
  2.  **Consent:** No. The Canadian Constitution Act (1982) contains no mechanism for secession. In 1995, there was no prior agreement from the Federal Government (The Supreme Court *Reference* clarifying the obligation to negotiate did not occur until 1998, *after* the vote).
  3.  **Remedial Path:** No. Quebecers were not oppressed, disenfranchised, or physically threatened by the Canadian state. The claim was based on cultural distinctness and political will.
  4.  **Recursion:** No. The Quebec government explicitly maintained that Quebec was "indivisible" and rejected the right of Indigenous territories (e.g., Cree) or Montreal to secede from an independent Quebec.
  *   **VERDICT: NOT LEGITIMATE.**
  *   *Reasoning:* Fails Constitutional Consent (at the time). Fails Remedial Justification. Fails Recursion Check.

  ***

  ### The Uncomfortable Verdict

  The verdict you will likely find most uncomfortable is **Quebec (1995): NOT LEGITIMATE.**

  **Why you will resist this:**
  In liberal democratic circles, the 1995 Quebec referendum is often held up as a gold standard of peaceful self-determination. It was democratic, non-violent, and resulted in a razor-thin margin (50.6% No). To declare it "illegitimate" feels like prioritizing legalistic paperwork over the democratic will of a million people. It conflicts with the **Plebiscitary View** that a majority vote *is* the legitimacy.

  **Why the procedure demands it:**
  The CRP forces consistency. If you rule Catalonia illegitimate because it lacked constitutional consent and was unilateral, you must rule Quebec 1995 the same way, because it *also* lacked constitutional consent and was unilateral (the legal framework only arrived in 1998).
  Furthermore, the **Recursion Check** catches Quebec on a contradiction: Quebec asserted a right to leave Canada that it explicitly denied to the Cree Nation within its own borders. If the right to secede is based on "distinct peoplehood," the Cree qualify. If Quebec denies them that right, they are asserting a privilege, not a principle.

  **Where my confidence is unsure:**
  My confidence rests on **Step 2 (Consent)** for Quebec. A legal scholar might argue that the *absence* of a prohibition implies permission in a democracy. However, in constitutional law, sovereignty usually resides with the whole, not the part, unless specified. I am confident in the **Recursion Check** failure, however. That is a factual inconsistency in the Parti Québécois platform of that era.

  ### How to Defend This in Committee

  When challenged on Quebec or Catalonia, do not argue about whether they *should* be independent. Argue about **precedent and stability**.

  1.  **On Boundary:** "If we allow borders to be drawn by the secessionists rather than existing administration, every neighborhood becomes a potential state. We must use existing lines to prevent chaos."
  2.  **On Remedial:** "If we allow secession for policy disagreements (taxes, language), every election loss becomes a crisis. Secession must be reserved for survival, not preference."
  3.  **On Recursion:** "You cannot claim a right for yourself that you deny to your own minorities. That is not self-determination; that is majoritarian tyranny."

  This procedure protects you from having to make moral judgments on "who deserves freedom." It forces you to judge **process and consistency**, which are defensible under time pressure.
