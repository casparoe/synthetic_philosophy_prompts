      *   *Good Answer:* Distinguishes between the biological potential (criterion) and the metaphysical state (definition).
      *   *Poor Answer:* Confuses the technology with the ontology.

  7.  **Step 5: Deliberate Omissions:**
      *   Must be explicit. What distracts?
      *   *Omission:* The specific legal statutes (Uniform Determination of Death Act).
      *   *Omission:* The history of the Harvard Committee.
