      *(Refining the Dependency Structure)*: I need to be very precise about "Permanent" vs. "Irreversible."
      *   Irreversible: Biologically impossible to reverse.
      *   Permanent: Will not be reversed (due to decision).
      *   This distinction is the hinge between DCD (Circulatory) and Brain Death. In Brain Death, function is *irreversible*. In DCD, function is *permanent* (we choose not to restart). This must be placed *after* the Definition/Criterion distinction is clear, otherwise, clinicians will say "It's irreversible because we won't try," which conflates the two.

      *(Refining the Example)*: The User's example is: "Heart permanently stopped but circulation maintained by external circuit." This is the classic DCD scenario. I will stick with this but ensure the *philosophical* weight is on "What is being circulated? A body or a corpse?"

