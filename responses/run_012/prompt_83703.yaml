      *   **Constraint 1:** Do *not* explain the brain-death vs. circulatory-death controversy (assume they know the basics or it's not the focus). Focus on the *structure* of the inquiry.
      *   **Constraint 2:** Role: Someone with experience in hospital ethics committees and teaching grad students.
      *   **Constraint 3:** Specific output requirements:
          *   Reason carefully before answering.
          *   Sketch dependency structure (Definition vs. Criterion vs. Test; Permanent vs. Irreversible).
          *   Brainstorm/rank carrying examples (User suggests ECMO/perfusion case).
          *   Map misconceptions to the sequence.
          *   One closing question (with good/poor answer sketches).
          *   Deliberate omissions (said out loud).
          *   No citations/reading lists/named cases/authors.
      *   **Goal:** A teaching plan that bridges the gap between abstract metaphysics and bedside reality.

  2.  **Deconstruct the Challenge:**
      *   *The Gap:* Clinicians know *how* to declare death but not *why* it counts as death. Philosophers know *why* it might count but not *how* it looks/feels.
      *   *The Core Tension:* The metaphysical definition (what death *is*) vs. the clinical criterion (how we *know*) vs. the diagnostic test (what we *do*).
      *   *The "Permanent vs. Irreversible" Distinction:* This is crucial for DCD (Donation after Circulatory Death) vs. Brain Death. "Irreversible" means it *cannot* come back (even with help). "Permanent" means it *will not* come back (because we won't try). This distinction is the pivot point for the clinicians' practical knowledge and the philosophers' conceptual analysis.
      *   *Time:* 90 minutes is tight for deep metaphysics + clinical reality. The structure must be efficient.

  3.  **Step 1: Dependency Structure (Reasoning & Placement):**
      *   *Definition vs. Criterion vs. Test:* This is the classic Gervais/Youngner structure. It must come *first*. If we don't agree on what we are looking for (Definition), the tools (Tests) are meaningless.
      *   *Placement:* Introduction (Minutes 0-15).
      *   *Defense:* Clinicians often conflate the test (no pulse) with the definition (cessation of function). Philosophers often conflate the definition (end of organism) with the criterion (integrated function). Separating them early prevents talking past each other.
      *   *Permanent vs. Irreversible:* This needs to come *after* the Definition/Criterion distinction but *before* the carrying example is fully resolved.
      *   *Placement:* Middle (Minutes 30-45).
      *   *Defense:* "Irreversible" is a biological claim (can it be restarted?). "Permanent" is a decisional claim (will we restart it?). This distinction is where the metaphysics of "potentiality" meets the ethics of "futility." It must be established before applying it to the complex case, otherwise, the case just looks like a technical glitch.

