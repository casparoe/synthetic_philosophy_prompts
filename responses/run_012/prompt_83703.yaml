          *   *Cons:* Distracts into fetal ethics/maternal rights. Too emotionally charged for a metaphysics focus.
      *   *Candidate 3:* The "Lazarus Phenomenon" (auto-resuscitation after stopping CPR).
          *   *Pros:* Highlights the "waiting period."
          *   *Cons:* Too brief. Doesn't sustain 90 minutes of metaphysical inquiry.
      *   *Candidate 4 (Selected):* The "Decapitation vs. Perfused Head" thought experiment hybridized with the ECMO case. Let's refine the User's idea. The User's idea is actually the strongest *clinical* anchor. Let's call it "The Perfused Corpse."
      *   *Refinement:* A patient with catastrophic brain injury (not quite brain dead yet) whose heart stops. CPR is *not* started (DNR). ECMO is *immediately* cannulated to preserve organs for donation.
      *   *Why better than User's?* It forces the question: Is the *body* alive because the *cells* are oxygenated, or is the *person* dead because the *integration* is gone? It forces the clinician to admit they are maintaining a dead body for parts, and the philosopher to admit that biological life persists without personal life.
      *   *Wait, let's stick closer to the User's inclination but sharpen it.* The User's example (Heart stopped, machine circulating) is the standard DCD scenario. It is the best bridge. I will select this but frame it specifically around the *moment of declaration*.
      *   *Decision:* I will rank the User's example highest but refine the framing to ensure it targets the *Definition/Criterion* gap.
      *   *Ranking:*
          1.  DCD with Immediate Perfusion (User's idea, refined).
          2.  Brain Dead Pregnant Body.
          3.  Cellular vs. Organismal Life (isolated limb).
      *   *Why Discard 2 & 3?* 2 introduces too many ethical variables (fetus). 3 is too abstract for clinicians. The DCD case is real, routine, and confusing.

  5.  **Step 3: Mapping Misconceptions:**
      *   *Brain Death = Coma:* Address during Definition/Criterion setup.
