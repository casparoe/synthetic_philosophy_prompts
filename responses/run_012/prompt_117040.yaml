      *   **William James:**
          *   *Early (Principles of Psychology):* Distinguishes "Me" (Empirical Self: material, social, spiritual) and "I" (Pure Ego: the thought that thinks). The "I" is elusive, always the subject, never the object. Stream of consciousness (continuous flow, not beads on a string).
          *   *Later (Radical Empiricism/Essays in Radical Empiricism):* Doubted the existence of a distinct "consciousness" or "ego" substance. Proposed that experience itself is the stuff, and subjects/objects are functional relations within experience. "Thoughts themselves are the thinkers."
      *   **Tension:** Hofstadter says the "I" *is* a symbol/object within the system (a loop). James says the "I" is the *function* of knowing, never fully captured as an object, though later he dissolves the thinker into the thought.

