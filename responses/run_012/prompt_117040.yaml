      *   *Question 3 (Uploading/Replacement):* James cared about continuity of experience (the stream). If the stream continues without breach, identity holds. If it's copied, there are two streams. He'd likely say the *function* matters, not the substrate (he was a functionalist before functionalism). But he'd worry about the "warmth and intimacy" of the memory connection.
      *   *Question 4 (Added Question):* What about the *feeling* of consciousness? Qualia. Hofstadter explains structure; James cares about the felt quality.

