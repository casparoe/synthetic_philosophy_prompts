prompt: |-
  My friend's a palliative care doc who also teaches the ethics course at the med school, and she's been handing me verdicts on cases for years, mostly to wind me up. Her record, as best I can reconstruct it: turning off a ventilator at the competent patient's request — fine, that's letting her die of her disease. Lethal injection at that same patient's request — not fine, that's killing. Not starting antibiotics for a pneumonia that's going to kill the patient, who's refusing them — fine. A morphine dose she knows will probably suppress the patient's breathing, given to control the pain — fine. Diverting the trolley onto the one guy — fine. Pushing the fat man off the footbridge — absolutely not. A patient who decides to stop eating and drinking and asks only for comfort care until she dies — fine, and the doctor standing by is doing nothing wrong. And a family stopping dialysis on a man who's no longer competent to decide — she was fine with that too.

  Now a new case lands on her unit and I want to know what she'll say before I open my mouth. Woman in a persistent vegetative state after a cardiac arrest, no other illness, no written directive, and she'd probably live for years if the tube feeds keep going. The husband, who's the surrogate, wants the feeding tube out. She'll be dead of dehydration in a week or two, and not of anything that was already killing her.

  Whats her verdict, what rule do you think she's actually running, and what other rules fit her whole record just as well? For each rule, say what it predicts here. Then your best guess at her verdict and why. And tell me the one further case that would best tell the surviving rules apart, so this doesnt end up being about my friend's vibes.

  Under 400 words.
