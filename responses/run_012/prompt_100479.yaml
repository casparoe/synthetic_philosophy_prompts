prompt: |-
  I'm a journalist who covers science and ideas, and before that I spent years reporting on negotiations — labor standoffs, treaty talks, budget brinksmanship — so the working vocabulary of bargaining is second nature to me: reservation points and BATNAs, the zone of possible agreement, red lines, logrolling, coalition arithmetic, appeals to fairness and precedent. I keep running into the axiomatic bargaining solution that Kalai and Smorodinsky proposed as a rival to Nash's, and I think I understand it well enough: it takes the feasible set of agreements and the disagreement point, draws the line from the disagreement point to the ideal point where each side gets its best attainable payoff, and picks where that line meets the Pareto frontier, so that each side gains in proportion to what it could have gained over its fallback — and it is defended by a set of properties rather than by any process: Pareto-optimality, symmetry between the players, invariance to how each side's utilities are scaled, and a monotonicity condition under which a player whose options improve across the board is entitled to a weakly better share. I'd like you to restate that solution and its fairness rationale as faithfully as you can in my practical vocabulary, and then give me the residue report: which of its claims translate cleanly into how I talk and write about real negotiations, which translate only if I distort them, and which have no counterpart at all in that idiom. I'm especially curious whether the axiomatic apparatus survives the trip — the fixed and known feasible set, cardinal utilities both sides are presumed to know, and above all the very idea that a fair division is pinned down by properties rather than by process, leverage, history, or the sheer fact that one side can walk away and afford to wait — and whether whatever is left over is a defect of my vocabulary or a sign that the axiomatic story is doing less work than it appears to. Write it as continuous prose, no headings, bullet points, bold, or tables, the way you would write me an email.
