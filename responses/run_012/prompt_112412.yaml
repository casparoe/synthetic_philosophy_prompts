answer: |-
  **Brainstorming & Assessment**

  **Does the worry bite less hard?**
  Actually, no. You're right. The standard commencement speech is a lie about causality. It promises a legible world. Your expertise reveals the world is opaque. The tension is real. However, the worry bites less hard if you realize the audience doesn't need prophecy; they need permission to act without certainty. They already feel the fog. Acknowledging it builds trust rather than undermining authority.

  **Genre vs. Cluelessness:**
  *   **Genre requires:** A narrative arc where effort yields reward, confident directives ("Follow your passion"), and reassurance of agency.
  *   **Cluelessness rules out:** Confident predictions about long-term states of affairs. It undermines instrumental reasoning ("Do X *because* it leads to Y").
  *   **The Overlap:** Both agree action is necessary. The speech can pivot from *outcome-based* advice (which cluelessness kills) to *disposition-based* advice (which survives it). You aren't telling them how to win; you're telling them how to play when the scorekeeper is invisible.

  ***

  **Commencement Address**

  Thank you. It is genuinely good to be back in this gym, though I remember the floor being less sticky than this. I'm honored to be here. Usually, this is the part where I tell you that the hard work you put in here will pay off out there. I'm supposed to tell you that the friends you made in these halls will be your network for life, or that following your curiosity will lead you to a career that fulfills you.

  I want to be careful with those promises. Not because I don't think you deserve them, but because my job—the actual work I get paid to do—is studying what happens after we make choices. I study consequences. I study how our actions ripple out into the world. And after twenty years of looking at the math of cause and effect, I have to tell you something that might feel unsettling, but I promise is honest: We don't know where the ripples go.

  We like to think that if we are smart enough, or careful enough, we can predict the future. We think if we take the safe path, we'll be secure, or if we take the risky path, we'll be rewarded. But the truth is, the causal chains of our lives are too long and too tangled for anyone to track. I cannot stand here and promise you that doing the right thing will make you happy. I cannot promise that avoiding the wrong thing will keep you safe. The world is too big, and our vision is too short.

  When I was twenty-three, a little older than you, I talked a close friend out of a big decision. I used logic. I used care. I used arguments that I still believe were correct. He listened. He changed his mind. And his life went badly in ways I could not have predicted in a hundred years. My intervention was rational. The outcome was a disaster.

  A few years later, I made a throwaway remark to a stranger at a conference. I forgot it immediately. Fifteen years later, I found out that comment had changed the course of their life entirely. They thanked me for saving them. I genuinely cannot tell you which of those two moments was the "good" one. I don't know how to weigh them. I did the work both times. The results were invisible to me until they weren't, and even then, they were ambiguous.

  So, what kind of advice can I give you, if I can't promise you results?

  Here is the shift. If you cannot see the future, you cannot optimize for it. You cannot live your life trying to maximize a score you can't read. Instead, you have to focus on the action itself, not the echo. When you face a choice, don't ask, "What will this get me in ten years?" Ask, "Is this the kind of thing I want to be doing right now?" The form of the advice changes from "Do X to get Y" to "Do X because it is worth doing." You build a life out of moments that feel solid under your feet, even if you can't see where they lead.

  I know this sounds terrifying. It sounds like walking into a fog. But there is a consolation here, one I truly believe. If I cannot know whether my good acts will help, nobody can know whether their bad acts will harm.

  Many of you are worried about messing up. You're worried that one wrong turn will ruin everything, that a mistake today will cascade into a tragedy tomorrow. But the same uncertainty that hides my successes hides your failures. The damage you fear you might cause is just as invisible, just as unpredictable, as the good you hope to do. You are not as dangerous to your own future as you think. The fog protects you from your own worst-case scenarios just as much as it hides the best ones.

  So, do not try to be a prophet. You will fail. Do not try to calculate the exact utility of every choice. You don't have the data. Instead, be the kind of person who acts with integrity even when the scoreboard is broken. Be kind, not because it guarantees a return, but because it's the only way to walk through the dark without bumping into people. Study what you love, not because it guarantees a job, but because it makes the walking worth it.

  I cannot tell you that everything will work out. I don't know that. The plant closed. The town changed. The world is messy. But you are here, and you are ready, and you have to move. The future is not in your hands. Nobody holds the future. But the present is. You have this moment. You have the next one.

  Walk out of this gym. Walk into the uncertainty. Do the next right thing. And then do the one after that. We'll see where it goes.
