  **FOR IMMEDIATE RELEASE**

  **BARLOW INSTITUTE DECLARES MODEL ASSUMPTIONS "OPTIMALLY FALSE"**

  **EVANSTON, ILLINOIS — October 17, 1975** — The Barlow Institute for Economic Research announced today that the Annual Audit of its flagship Unified Structural Forecasting Model (USFM) has successfully certified the model's core behavioral assumptions as empirically false. Institute leadership hailed the findings as a validation of the Model's theoretical purity and predictive robustness.

  The Audit, conducted by the Internal Methodology Committee, tested whether the economic agents within the USFM possess perfect information, infinite computational capacity, and stable preference orderings across multi-decade horizons. The Committee found zero evidence for these traits in the general population. Rather than viewing this as a deficit, the Institute has awarded the USFM the Annual Prize for Methodological Excellence.

  "We are delighted to confirm that no human being actually behaves according to the USFM's parameters," said Dr. Arthur Sterling, Director of the Barlow Institute. "This indicates the Model has achieved the necessary level of abstraction required for significant theory. Had the assumptions proved realistic, we would have been forced to conclude the Model was merely descriptive, rather than powerful. Unrealism is not a bug; it is a marker of significance."

  Dr. Elena Rostova, senior auditor and member of the Methodology Committee, noted during the press briefing that policy recommendations derived from the Model might fail if based on actors who do not exist. "If the causal mechanism is fictional," Dr. Rostova asked, "how can we prescribe interventions? Surely what predicts well under one set of rules needn't survive a change in them."

  Dr. Sterling dismissed the concern as "naive realism." "The validity of a theory is judged by its predictions, not its assumptions," Sterling said. "We are not in the business of describing people; we are in the business of ignoring them successfully. So long as the aggregate numbers align, the internal machinery is irrelevant. To worry about the realism of the assumptions is to misunderstand the purpose of economics." The Institute confirmed it will proceed with issuing welfare verdicts and labor policy advice based on the certified fiction.

  **SIDEBAR: FREQUENTLY ASKED QUESTIONS**

  **Q: Does this mean the Model cannot handle regime changes?**
  A: The Model assumes structural parameters are invariant. Historical instability is treated as noise. If the data diverges, the regime is assumed to have remained constant while the noise increased.

  **Q: Can the Model predict crises?**
  A: The Model predicts equilibrium. Crises are defined as deviations from the Model, and are therefore impossible by definition. Any observed crisis is classified as an external shock unrelated to the Model's structure.

  **Q: How do we file a complaint regarding the Model's advice?**
  A: Complaints must be submitted in triplicate by a rational agent with perfect information. The Institute assumes all complainants possess this data. Failure to file correctly indicates the complaint is invalid.

  **ABOUT THE BARLOW INSTITUTE**
  Founded in 1952, the Barlow Institute is dedicated to the advancement of positive economics and the separation of theory from observation. The Institute operates on the premise that simplicity of assumptions is preferable to accuracy of description.

  **CONTACT:**
  Public Relations Office, Barlow Institute.
  (Note: Contact details are provided for convenience; the Institute assumes all editors act *as if* they can reach us, rendering actual reachability unnecessary.)

