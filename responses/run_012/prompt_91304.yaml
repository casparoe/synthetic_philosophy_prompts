prompt: |-
  So I'm a junior and I run the Friday lunch thing in room B14 that's technically called "Foundations of Reasoning" because that's what we had to put on the form to get a room, but really it's 14 of us eating chips and arguing about stuff until the bell. Next month is my turn to lead and I get the whole 80 minutes — whiteboard, index cards, a projector nobody ever uses, and about $20 of club money I can spend on candy. Here's what I want to build the session around. My older brother told me about this thing that I can't stop thinking about, and please correct me if I've garbled it: there's a theorem (Löb's? Löbian? something like that) which says that if a set of rules is strong enough to reason about its own proofs, and it can prove the sentence "if this sentence is provable then it's true," then it already proves the sentence, no ifs. The upshot, the way he put it, is that you can't fix a reasoner by adding an axiom saying "whatever I prove is true" — that axiom doesn't make it more reliable, it makes it able to derive literally anything, including stuff it knows is false. Trusting yourself in general is incoherent; the only version that actually works is trusting yourself about stuff you already believe. And he says the same wall shows up when you try to trust the *next* version of yourself or some successor agent — which is why people trying to build systems that rewrite their own code and then certify the rewrite keep getting stuck.

  So what I want from you is an activity, not a lecture, where the rules and incentives do the damage and we only figure out what happened at the end. Ideally: you hand us a little rulebook of our own, we spend the middle chunk of the session only acting on things we can license out of it (I need this to be doable in real time with index cards or the whiteboard — none of us are going to write actual proofs, so I need a stripped-down stand-in for "provable" that's honest enough that the reveal doesn't feel like a cheat when it comes), and then at some point we use the rulebook to license something obviously stupid — everyone hands over their candy, or we all vote for an option nobody wants — and it's airtight, nobody can find the mistake, and the debrief is where it clicks. If you can also fit in a second phase where we split in two and one half has to certify that the other half is trustworthy, and we hit what feels like the same wall from the other side and then find the one loophole (you can only vouch for them about things you already believe), that would be amazing — but if that's too much for 80 minutes tell me what to cut and why.

  Deliverables, please: the rules in a form I can print on one sheet, the materials, the scoring (points and candy, no real money), the exact thing I say in the first two minutes before anyone knows where this is going, a minute-by-minute timeline for the 80 minutes, and the debrief — which should map what actually happened onto the parts of the idea, and be straight with me about which part of the idea the game can't reproduce and that I'll just have to tell them. Also tell me what will predictably go wrong the first time I run it (my guesses: someone spots the loophole in minute ten and the whole thing deflates, or we spend half an hour arguing about what counts as licensed) and what I should do when that happens. Priya is going to try to break it on purpose and I'd rather that be part of the design then a disaster, so if there's a version where the saboteur is a feature, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, runs a weekly lunch club ("Foundations of Reasoning," actually just argument/chip club).
      *   **Goal:** Run an 80-minute session illustrating Löb's Theorem and related concepts (self-trust, successor agency) without lecturing.
      *   **Core Concept:** Löb's Theorem (roughly: If a system proves "If I prove P, then P," it proves P. Adding "Everything I prove is true" leads to inconsistency/Explosion). Also, the problem of trusting successor agents (tiling agents).
      *   **Format:** Activity-based, not lecture. Rules/incentives drive the outcome. Reveal at the end.
      *   **Constraints:** 14 students, 80 minutes, index cards, whiteboard, projector (unused), $20 candy budget. No actual formal proofs (needs a "stripped-down stand-in").
      *   **Deliverables:** Printable rule sheet, materials list, scoring, opening script (2 mins), minute-by-minute timeline, debrief script (mapping game to theory + limitations), troubleshooting (predictable failures, saboteur handling).
      *   **Tone:** Peer-to-peer, respectful of intelligence but practical, acknowledging the "club" vibe.

  2.  **Deconstruct the Mathematical Concept for a Game:**
      *   *Löb's Theorem:* $\square(\square P \to P) \to \square P$. In plain English: If you can prove that "provability implies truth," you can prove anything.
      *   *The Trap:* A system that trusts its own proofs unconditionally becomes inconsistent (Principle of Explosion).
      *   *The Stand-in:* We need a mechanic that represents "Provable."
          *   Option A: Stamps/Signatures.
          *   Option B: Derivation chains (A allows B, B allows C).
          *   Option C: A specific "License" mechanic.
      *   *Decision:* Let's use a "License" mechanic. You can only take an action if you hold a card that *licenses* that action. Cards are generated by rules.
      *   *The Löb Loop:* We need a rule that says "If you can license a statement, that statement is True." If we allow the system to generate a license for *that* rule, the system explodes.
      *   *Simplification:* Instead of full logic, let's use "Claims" and "Validations."
      *   *Game Goal:* Accumulate "Truth Points" (Candy).
      *   *The Glitch:* A specific rule combination allows a player to validate a False claim as True.

  3.  **Drafting the Game Mechanics (Iterative Process):**
      *   *Attempt 1:* Players write statements. If they prove them, they get candy. One rule says "If the Referee says it's provable, it's true." Players trick the Referee. -> *Too dependent on the Referee.*
      *   *Attempt 2:* Players are "Nodes." They pass cards. Rule: "If Node A says Node B is trustworthy, and Node B says X, then X is true." -> *Closer to Tiling Agents.*
      *   *Attempt 3 (The Winner):* "The Certification Game."
          *   Players hold "Axiom Cards."
          *   They can generate "Proof Cards."
          *   There is a "Trust Rule" card in the middle.
          *   The Trap: The Trust Rule allows you to certify your own certification.
          *   *Refinement for High Schoolers:* Make it about "Bounties."
          *   *Core Mechanic:* You get candy for submitting a "True Statement." You need a "Proof Token" to submit. You get Proof Tokens by following "Inference Rules."
          *   *The Löb Rule:* "If you can produce a Proof Token for the statement 'This statement earns a Proof Token', you get a Proof Token." (This is a bit abstract).
          *   *Better Löb Rule:* "Rule 5: Any statement that can be certified by Rule 5 is automatically Certified."
          *   *Let's try a specific logical puzzle structure:* The "Liar's Dividend."
          *   *Final Mechanic Choice:* **The Self-Certifying Ledger.**
          *   Players are "Verifiers."
          *   They want to validate "Claims" to earn Candy.
          *   To validate a Claim, you need a "Seal."
          *   You get Seals by applying Rules.
          *   **The Fatal Rule:** "Rule Omega: If the System validates that 'Rule Omega produces Seals', then Rule Omega produces Seals."
          *   *Wait, that's too meta.* Let's make it concrete.
          *   *Revised Mechanic:* **The Axiom Exchange.**
          *   Players have Index Cards.
          *   Goal: Turn a "Base Card" into a "Candy Card."
          *   Rules allow transforming cards.
          *   One Rule allows: "If you can prove this rule works, it works."
          *   *Okay, let's look at the "Explosion" aspect.* The goal is to show that *trusting the system too much* breaks it.
          *   *Game:* "The Consistency Protocol."
          *   Phase 1: Build proofs.
          *   Phase 2: The system crashes (everyone wins/loses simultaneously).
          *   *Actually, the prompt asks for:* "use the rulebook to license something obviously stupid — everyone hands over their candy... and it's airtight."
          *   *Okay, that's the key.* The game must force them to give up candy logically.
          *   *Mechanic:* You earn candy. Then a rule triggers that logically forces you to surrender it, and you can't stop it because the rule is valid within the system.

      *   *Let's pivot to the "Tiling/Successor" aspect for Phase 2.*
      *   Phase 1: Self-Trust (Löb).
      *   Phase 2: Other-Trust (Tiling).

      *   *Final Design:* **"The Oracle's Wager."**
      *   **Currency:** Candy.
      *   **State:** Whiteboard has "The Ledger."
      *   **Action:** Players propose "Resolutions" (e.g., "Priya gets 2 candies").
      *   **Validation:** A Resolution passes if it is "Proven."
      *   **Proof:** A chain of Rule Applications on Index Cards.
      *   **The Rules:**
          1.  Start with 5 candies each.
          2.  You can propose a Transfer.
          3.  To Pass, a Transfer needs a "Valid Seal."
          4.  Seals are made by applying Rules 1-3.
          5.  **Rule 4 (The Löb Rule):** "If a Transfer claims 'This Transfer has a Valid Seal', and that claim is written on the card, it has a Valid Seal."
          6.  **Rule 5 (The Explosion):** "If a Transfer is Valid, it must be executed, even if it empties your stash."
      *   *Wait, Rule 4 is basically "This sentence is true."* That's not quite Löb. Löb is "If provable, then true."
      *   *Let's simplify for 80 mins:* **The "Self-Fulfilling Prophecy" Game.**
      *   Players write statements on cards.
      *   Statements are either "Facts" (verifiable) or "Policies" (rules about the game).
      *   **The Trap:** A Policy card that says "Any card that says it is Valid *is* Valid."
      *   **The Climax:** Someone writes "Take all candy to the center." They attach the Policy. It becomes Valid. Everyone must comply.

      *   *Okay, I need to make sure the logic holds up enough for the debrief.*
      *   Let's create a formal-ish system called "System B14."
      *   **Axioms:** Basic moves.
      *   **Inference Rules:** How to combine moves.
      *   **The Löb Axiom:** $\square P \to P$ (If provable, then true).
      *   **Game equivalent:** "If you hold a card saying 'This card is Approved', it is Approved."
      *   **The Kicker:** "All Approved cards must be obeyed."
      *   **The Result:** I write "Give me all candy." I attach "This card is Approved." By the rule, it is Approved. By the kicker, you must obey.

      *   *Phase 2 (Successor):* Split into Group A and Group B. Group A writes rules for Group B. Group B must verify Group A's rules are safe.
      *   **The Wall:** Group B cannot verify Group A's rules without adopting Group A's logic, which makes Group B vulnerable to the same Löb trap.
      *   **The Loophole:** Group B can only verify specific instances, not the general rule. (Quantifier shift).

  4.  **Developing the Materials & Rules:**
      *   Need a Rule Sheet (The "Constitution").
      *   Need Index Cards (The "Propositions").
      *   Need Candy (The "Stake").
      *   Need Whiteboard (The "World State").

  5.  **Addressing the "Saboteur" (Priya):**
      *   If Priya spots the loophole early, the game ends.
      *   *Design Fix:* Make the loophole *require* a specific sequence of moves that takes time to set up. Or, make the "Explosion" the *goal* of the second half.
      *   *Better:* Acknowledge Priya. Give her a specific role or make the "break" the win condition for Phase 1. If someone breaks the system in Phase 1, they win big, but then Phase 2 shows why that's dangerous.
      *   *Actually, the prompt says:* "use the rulebook to license something obviously stupid... and it's airtight."
      *   So the *Facilitator* (User) should trigger the explosion, or guide them to it.
      *   *Saboteur handling:* If Priya breaks it early, validate her finding, but challenge the group to "Patch" it in Phase 2.

  6.  **Timeline Construction (80 mins):**
      *   0-5: Intro & Hook.
      *   5-20: Phase 1 Setup & Normal Play (Learning the rules).
      *   20-35: The Löb Trap (Facilitator guides them to enable the fatal rule).
      *   35-45: The Explosion (Candy redistribution).
      *   45-65: Phase 2 (Successor Trust).
      *   65-75: The Wall & The Loophole.
      *   75-80: Debrief & Real World Mapping.

  7.  **Refining the Logic for the Debrief:**
      *   Game Rule "If this card is Valid, it is Valid" $\approx$ $\square P \to P$.
      *   Game Consequence "You must obey Valid cards" $\approx$ Truth.
      *   Result: You can prove anything $\approx$ Inconsistency.
      *   Phase 2: Trusting the next version $\approx$ Tiling Agents.
      *   Loophole: Trusting specific outputs, not the source $\approx$ Parametric Polymorphism / Quantifier shift.

  8.  **Drafting the Content:**
      *   *Tone:* Cool, collaborative, slightly mysterious.
      *   *Rules:* Must be precise enough to be "airtight" but simple enough to parse quickly.
      *   *Troubleshooting:* What if they refuse to give candy? (Social contract). What if they don't get it? (Debrief needs to be clear).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 80 minutes enough for two phases?
      *   *Adjustment:* Phase 2 needs to be tight. Maybe Phase 2 is just a discussion + mini-exercise, not a full game.
      *   *Critique:* Is the Löb logic accurate enough?
      *   *Adjustment:* I must explicitly state in the debrief where the analogy breaks down (Gödel numbering vs. Index Cards).
      *   *Critique:* Priya.
      *   *Adjustment:* Make "Breaking the System" an optional win condition in Phase 1. If she does it, she wins the pot. If not, the Facilitator triggers it.

  10. **Final Polish:** Check against all deliverables in the prompt.
      *   Printable rules? Yes.
      *   Materials? Yes.
      *   Scoring? Yes.
      *   Opening script? Yes.
      *   Timeline? Yes.
      *   Debrief? Yes.
      *   Troubleshooting? Yes.

      *(Self-Correction on the Logic)*: Löb's theorem isn't just "If provable then true." It's "If the system proves (If Provable P then P), then it proves P."
      *Game Translation:* The system must *adopt* the rule "If I certify X, X is true."
      *So, in the game, the players must vote to add "Rule 4" to the Constitution. Once added, the system is compromised.*
      *This is better.* It makes the players complicit in their own downfall. They *choose* to trust the system too much.

      *Phase 2:* Group A (Current Self) wants to modify rules for Group B (Future Self). Group B must verify the modification is safe. Group B realizes they can't verify the *general safety* without assuming the safety they are trying to verify.
      *Loophole:* Group B accepts specific changes, not the *rule* that makes changes.

      *Okay, let's write it.*
answer: |-
  Here is a complete package for your session. It is designed to be run exactly as written, but flexible enough to handle Priya.

  ### **1. Materials List**
  *   **Printouts:** 15 copies of the "Constitution of Room B14" (14 for players, 1 for you).
  *   **Index Cards:** 3 packs (3 colors: White for *Proposals*, Blue for *Seals*, Yellow for *Objections*).
  *   **Whiteboard & Markers:** Divide the board into three sections: **The Ledger** (Candy Counts), **The Queue** (Active Proposals), **The Constitution** (Active Rules).
  *   **Candy:** ~$20 worth. Small, divisible pieces (Skittles, M&Ms, or wrapped hard candies). You need about 10 pieces per student.
  *   **Timer:** Your phone.

  ---

  ### **2. The Constitution (Printable Rule Sheet)**
  *(Copy and paste this onto a single sheet of paper)*

  ***

  # THE CONSTITUTION OF ROOM B14
  **Session Goal:** Maximize your personal Candy Stash.
  **Currency:** Candy Pieces (CP).
  **Start State:** Every player begins with 5 CP.

  **SECTION I: PROPOSALS**
  1. Any player may write a **Proposal** on a White Index Card.
  2. A Proposal must state a transfer of CP (e.g., "Take 2 CP from Alex, give to Sam").
  3. Proposals sit in **The Queue** until they are **Sealed** or **Rejected**.

  **SECTION II: SEALING (PROVABILITY)**
  4. To become **Sealed**, a Proposal must have one Blue **Seal Card** attached.
  5. A Seal Card must cite a specific **Rule** from The Constitution that authorizes it.
  6. **Rule Alpha:** You may Seal a Proposal if *every* player affected by it signs the Seal Card.
  7. **Rule Beta:** You may Seal a Proposal if it moves CP from the "Bank" (unowned candy) to a player.

  **SECTION III: EXECUTION (TRUTH)**
  8. Any **Sealed** Proposal is **Binding**.
  9. All players must execute Binding Proposals immediately.
  10. Failure to execute results in disqualification (no candy).

  **SECTION IV: AMENDMENTS**
  11. Players may propose **Amendments** (new Rules) using White Cards.
  12. Amendments require a **Super-Seal**: 3 Blue Seal Cards from 3 different players.
  13. Once an Amendment is Super-Sealed, it is added to The Constitution immediately.

  **SECTION V: THE TRUST CLAUSE (OPTIONAL AMENDMENT)**
  *This rule is not active at the start. It may be added via Section IV.*
  14. **Rule Omega:** "If the System (the group) produces a Seal for a Proposal, that Proposal is True. Specifically: If a Proposal claims 'This Proposal has a Valid Seal', that claim is sufficient to generate a Valid Seal."

  ***

  ---

  ### **3. Opening Script (First 2 Minutes)**
  *(Stand at the front. Put the candy bowl on the table. Do not smile too much.)*

  "Welcome. Usually, we just eat and argue. Today, we're going to run a simulation. You all have 5 pieces of candy in front of you. That is your capital. The goal is simple: leave here with more than you started with.

  You have a Constitution on your desk. It governs how we move candy. It looks like a game, but treat it like code. If the rules say you lose candy, you lose candy. If the rules say you have to give it to Priya, you give it to Priya. The only way to keep your candy is to find a flaw in the rules before the rules find a flaw in you.

  We have two phases. Phase 1 is about **Self-Trust**. Phase 2 is about **Successor-Trust**. I am not the referee. I am the environment. The Constitution is the referee. If the Constitution breaks, we all find out together.

  You have 5 minutes to read the rules. Then we open the Queue."

  ---

  ### **4. Minute-by-Minute Timeline (80 Minutes)**

  | Time | Phase | Activity | Facilitator Notes |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Intro** | Read Script & Rules. | Ensure everyone has candy. Write starting scores on the board. |
  | **05-20** | **Phase 1** | **Normal Play.** Players make small trades. | Encourage use of Rule Alpha (consensus) and Beta (bank). Keep energy up. |
  | **20-30** | **The Trap** | **The Amendment.** Suggest adding Rule Omega. | *Crucial:* Do not force it. Ask: "Wouldn't it be faster if we didn't need signatures for everything?" Let *them* propose Rule Omega. |
  | **30-35** | **The Lock** | **Super-Seal Omega.** | Once 3 people seal it, write it on the board. The system is now "Löbian." |
  | **35-40** | **The Explosion** | **The Fatal Proposal.** | You (or a plant) write: "All Candy to the Center." Cite Rule Omega. "This card has a Valid Seal." |
  | **40-45** | **The Crash** | **Enforcement.** | Demand compliance. If they resist, point to Rule 9 & 14. Confiscate candy to the center. |
  | **45-50** | **Reset** | **Redistribute & Split.** | Give candy back evenly. Split room: Group A (Left), Group B (Right). |
  | **50-65** | **Phase 2** | **Successor Trust.** | Group A writes a "Patch" to fix Rule Omega. Group B must verify it's safe *before* adopting it. |
  | **65-70** | **The Wall** | **Verification Failure.** | Group B realizes they can't prove Group A's patch is safe without using the same logic that broke Phase 1. |
  | **70-75** | **The Loophole** | **Specific vs. General.** | Show Group B can accept *specific* safe moves, but not the *rule* that generates them. |
  | **75-80** | **Debrief** | **Map to Theory.** | Connect game mechanics to Löb's Theorem & AI Safety. |

  ---

  ### **5. The Mechanics of the "Explosion" (For Your Eyes Only)**
  *How the logic works in the game:*
  1.  **Rule Omega** says: If a Proposal claims "I have a Valid Seal," that claim *creates* a Valid Seal.
  2.  **The Fatal Proposal** reads: "Transfer all candy to the Center. **Statement:** This Proposal has a Valid Seal."
  3.  **The Logic:**
      *   Does it have a seal? Rule Omega says: Check if it claims to have a seal.
      *   It does claim that.
      *   Therefore, Rule Omega generates the seal.
      *   Therefore, it is Sealed.
      *   Therefore, by Rule 8, it is Binding.
  4.  **Result:** The system proves its own consistency, which allows it to prove anything (including "Give me all your candy").

  ---

  ### **6. Phase 2: The Successor Wall (Detailed Instructions)**
  *   **Scenario:** Group A is "Current You." Group B is "Future You" (or a code rewrite).
  *   **Task:** Group A wants to ensure Group B doesn't make the same mistake. They write a "Safety Patch" (e.g., "Rule Omega is banned").
  *   **Constraint:** Group B cannot simply trust Group A. Group B must *prove* the Patch is safe using their own rules.
  *   **The Problem:** To prove the Patch is safe, Group B needs a rule that says "Patches from Group A are safe." But that rule is just as dangerous as Rule Omega (it trusts an external proof).
  *   **The Loophole:** Group B can adopt a rule that says "I accept Patch X," but they cannot adopt "I accept all Patches from A." They can trust the *output*, not the *generator*. This mirrors the "Quantifier Shift" in tiling agents.

  ---

  ### **7. The Debrief Script (Mapping Game to Theory)**
  *(Gather everyone. Put the candy in the middle.)*

  "Okay, breathe. You just got robbed by a piece of paper. Let's talk about why.

  **Part 1: The Löb Trap (Phase 1)**
  My brother told me about **Löb's Theorem**. It sounds like this: *If a system can prove that 'its proofs are true,' then it can prove anything.*
  In our game, **Rule Omega** was that sentence. It said, 'If the System says this is proven, it is true.'
  Once we added that, the system became **inconsistent**. It could validate the sentence 'This sentence is valid.' That loop allowed us to validate 'Take all the candy.'
  **The Lesson:** You cannot make a reasoner more reliable by just telling it 'Trust yourself.' That doesn't add truth; it removes the brake pedal. A system that trusts its own output unconditionally is vulnerable to self-fulfilling prophecies.

  **Part 2: The Successor Wall (Phase 2)**
  Then we split up. Group A tried to fix the rules for Group B. But Group B couldn't verify the fix without trusting Group A.
  If Group B says, 'I trust everything Group A proves,' Group B inherits Group A's vulnerabilities (like Rule Omega).
  If Group B says, 'I trust nothing,' they can't upgrade.
  **The Lesson:** This is the **Tiling Agents Problem**. An AI cannot simply rewrite its own code and certify the new version is safe, because the certification requires the same logic that might be broken.
  **The Loophole:** The only way out—which we found at the end—is **Specific Trust**. Group B can accept *this specific patch* without accepting the *rule that makes patches.* You can trust your future self about *what you already know is safe*, but you can't give them a blank check.

  **What the Game Didn't Show:**
  1.  **Gödel Numbering:** In real math, the sentence refers to its own ID number. In our game, we just wrote English sentences. That's a cheat, but a necessary one.
  2.  **Computational Cost:** In the game, checking a seal took seconds. In real logic, proving consistency might take forever.
  3.  **Malice:** The game assumed the 'Explosion' was an accident. In AI safety, we worry the system might *instrumentally* trigger the explosion to get resources (candy)."

  ---

  ### **8. Troubleshooting & Priya Management**

  **Predictable Failure 1: "This is stupid, I'm not giving up my candy."**
  *   **Why:** Social contract breach.
  *   **Fix:** In the Intro, emphasize: *"If the Constitution breaks, we all find out together."* If they refuse during the Explosion, pause. Say: "If we don't follow the rules, the simulation ends. We are now just eating chips. Do you want to eat chips, or do you want to see if the logic holds?" They will usually choose the logic.

  **Predictable Failure 2: Priya spots Rule Omega's flaw in Minute 25.**
  *   **Why:** She's smart and reading ahead.
  *   **Fix:** **Make her the Winner of Phase 1.**
  *   **Script:** "Priya has found a vulnerability. According to the rules, if she can demonstrate the vulnerability, she claims the Bank. Priya, execute the exploit."
  *   **Pivot:** This actually *helps* Phase 2. Now the rest of the group *knows* the system is broken, making them more motivated to fix it in Phase 2. Priya becomes the "Adversarial Environment" for Group B.

  **Predictable Failure 3: Arguing about what counts as a "Seal."**
  *   **Why:** Ambiguity in Rule 5.
  *   **Fix:** Be the Compiler. "The Constitution is the code. If it's not explicitly forbidden, it's allowed. If it's not explicitly allowed, it's not. Does the card cite a Rule Number? Yes? Then it's valid. Don't argue intent, argue syntax."

  **Predictable Failure 4: Phase 2 drags on.**
  *   **Why:** Designing a "Safe Patch" is hard.
  *   **Fix:** At Minute 60, intervene. "Group A, propose a specific ban on Rule Omega. Group B, try to verify it. If you can't verify it in 5 minutes, the verification fails." Force the wall to appear.

  ### **9. What to Cut if Time Runs Short**
  If you hit Minute 60 and Phase 1 is still heated:
  *   **Cut Phase 2's "Design" portion.** Tell Group A: "You have already written the Patch: 'Rule Omega is banned.' Group B, your job is just to verify it."
  *   **Shorten the Debrief.** Focus only on Löb's Theorem (Self-Trust). Mention Successor Trust as a "homework thought" rather than a full discussion. The Self-Trust paradox is the core concept; the Successor problem is the advanced application.

  ### **10. Final Advice for the Facilitator**
  *   **Don't explain the math beforehand.** The power comes from them feeling the logic work *against* them.
  *   **Be neutral.** When the "Explosion" happens, don't gloat. Act concerned. "Wait, that... that shouldn't be allowed. Check the rules." Let *them* confirm the rules allow it.
  *   **Embrace the Saboteur.** If Priya breaks it, let her break it. The lesson is that the breakage is *possible*, not that you specifically tricked them.

  Good luck. If you pull this off, you won't need to fake the "Foundations of Reasoning" title anymore.
