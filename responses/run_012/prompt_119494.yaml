  ## Meta-Analysis

  ### Indistinguishable Pairs
  **The Tree cannot reliably distinguish Leaf 2 (Prudential Conventionalist) and Leaf 3 (Etiquette Separatist).**
  Both leaves result in identical behavior: conform when watched, defect when safe, and deny moral guilt. The distinction rests entirely on the agent's internal metaphysics of "morality" vs. "social pressure," which produces no observable difference in verdicts or external commitments.

  ### Unoccupied Logical Space
  **1. Binding on Visitors but not Locals.**
  *   *Status:* Incoherent.
  *   *Why:* A norm cannot bind an outsider to a community more strictly than the members who constitute the community; this reverses the source of authority.

  **2. Expressive Wrong but Prudentially Binding Only.**
  *   *Status:* Merely Unexplored / Unstable.
  *   *Why:* If the wrong is purely expressive (symbolic disrespect), it is usually treated as intrinsic (moral). Claiming it is "wrong" but you only have to avoid it to save face creates a cognitive dissonance most agents resolve by collapsing into Separatism or Prudentialism.

  **3. Free-Riding Wrongness without Harm.**
  *   *Status:* Repulsive (to Consequentialists).
  *   *No one occupies this:* Claiming free-riding is wrong even if the scheme suffers no loss and no one is harmed is a purely Kantian position that few apply consistently to low-stakes norms like queueing or tipping jars.

  ### Distinction Coverage
  The tree successfully separates the five requested categories:
  1.  **Real/Binding Everyone:** Leaves 4, 8, 11, 12.
  2.  **Real/Binding Participants:** Leaves 6, 7, 10.
  3.  **Real/Prudential:** Leaves 2, 5.
  4.  **Not Genuine Obligation:** Leaves 1, 3.
  5.  **Binding/Expressive:** Leaves 9, 10, 11, 12.
