answer: |-
  # The Social Norms Decision Tree

  **Instructions:** Start at the root. Answer the question honestly based on your intuitions about the *grounds* for your judgment, not just the verdict. Follow the branch until you reach a leaf.

  ### **Node 1: The Convention Check**
  **Question:** Is there a mutual expectation that people will do this, such that you prefer to do it *because* others do (a Lewisian convention), or is it just a habit that happens to correlate?
  *   **No (Just habit/correlation):** → **Leaf 1**
  *   **Yes (It is a convention):** → **Node 2**

  ### **Node 2: The Force Check**
  **Question:** If you could defect without anyone knowing and without risk of sanction, would you feel you did something *morally* objectionable, or merely imprudent/awkward?
  *   **Merely imprudent/awkward:** → **Node 3**
  *   **Morally objectionable:** → **Node 4**

  ### **Node 3: The Prudence/Domain Check**
  **Question:** Is the reason to conform that you will suffer negative consequences (social burn, conflict), or that etiquette is a separate domain from morality entirely?
  *   **Negative consequences (Social burn):** → **Leaf 2**
  *   **Separate domain (Etiquette ≠ Morality):** → **Leaf 3**

  ### **Node 4: The Consequence Check**
  **Question:** If the act caused zero material harm and no one observed it (e.g., jaywalking at 3am on an empty street), would it still be wrong?
  *   **No (Wrong only due to risk/harm):** → **Node 5**
  *   **Yes (Wrong even in a vacuum):** → **Node 6**

  ### **Node 5: The Risk Rule Check**
  **Question:** Is the obligation determined by a fixed rule about risk (e.g., "never jaywalk"), or by weighing the specific stakes of this instance?
  *   **Fixed rule:** → **Leaf 4**
  *   **Weighing specific stakes:** → **Leaf 5**

  ### **Node 6: The Grounds Check**
  **Question:** Is the core wrong about taking an unfair advantage (free-riding on a scheme) or about expressing disrespect/violating a boundary?
  *   **Unfair advantage (Free-riding):** → **Node 7**
  *   **Expressing disrespect:** → **Node 8**

  ### **Node 7: The Reciprocity Check**
  **Question:** Does the duty bind only those who can reciprocate the benefit over time (regulars/participants)?
  *   **Yes (Participants only):** → **Leaf 6**
  *   **No (Users generally):** → **Node 9**

  ### **Node 9: The Visitor Fairness Check**
  **Question:** Does the duty bind temporary visitors who cannot reciprocate long-term?
  *   **No (Visitors exempt):** → **Leaf 7**
  *   **Yes (Visitors bound):** → **Leaf 8**

  ### **Node 8: The Authority Check**
  **Question:** Is the duty grounded in a specific host's authority over their space, or a general norm of coordination?
  *   **General norm:** → **Leaf 9**
  *   **Host authority:** → **Node 10**

  ### **Node 10: The Guest Knowledge Check**
  **Question:** Does the host's authority bind guests who lack cultural knowledge of the norm?
  *   **No (Guests exempt):** → **Leaf 10**
  *   **Yes (Guests bound):** → **Node 11**

  ### **Node 11: The Stakes Sensitivity Check**
  **Question:** Is the duty absolute regardless of inconvenience, or does it yield to high stakes/emergencies?
  *   **Yields to stakes:** → **Leaf 11**
  *   **Absolute:** → **Leaf 12**

  ---

  ## The Leaves

  **Leaf 1: Norm Skeptic / Habitualist**
  *   **Distinction:** Not a genuine obligation.
  *   **Awkward Commitment:** You must admit that tipping jars and queueing are no more morally significant than preferring to walk on the left side of the sidewalk personally.
  *   **Case Fit:** Tourist at counter-service tip jar (if viewed as noise).

  **Leaf 2: Prudential Conventionalist ("When in Rome")**
  *   **Distinction:** Real but only prudentially binding.
  *   **Awkward Commitment:** You would defect immediately if you could guarantee immunity from social sanction, even in a close friend's home.
  *   **Case Fit:** Standing on the left of the escalator.

  **Leaf 3: Etiquette Separatist**
  *   **Distinction:** Not a genuine obligation (etiquette isn't morality).
  *   **Awkward Commitment:** You must maintain that violating a solemn dinner protocol is categorically different from stealing, even if the distress caused is identical.
  *   **Case Fit:** Visitor in a Japanese house (if viewed as mere custom).

  **Leaf 4: Rule Consequentialist**
  *   **Distinction:** Real and binding on everyone.
  *   **Awkward Commitment:** You must condemn jaywalking at 3am on an empty street as morally wrong because it weakens the general rule against crossing against lights.
  *   **Case Fit:** Jaywalking at 3am (strict view).

  **Leaf 5: Act Particularist**
  *   **Distinction:** Real but only prudentially binding (context dependent).
  *   **Awkward Commitment:** You give up predictability and rule-based guidance; every queue or crosswalk requires a fresh moral calculation of stakes.
  *   **Case Fit:** Jaywalking at 3am (nuanced view).

  **Leaf 6: Reciprocity Contractarian**
  *   **Distinction:** Real but binding only on those who participate and can reciprocate.
  *   **Awkward Commitment:** You must allow regulars to free-ride if they are secretly impoverished, while demanding tourists pay if they intend to return.
  *   **Case Fit:** Holding a place in a long line for a friend.

  **Leaf 7: Participant Fairness**
  *   **Distinction:** Real but binding only on those who participate and can reciprocate.
  *   **Awkward Commitment:** You must argue a tourist is morally permitted to skip a tip that constitutes the server's wage, simply because they won't return.
  *   **Case Fit:** Tourist from no-tipping country at US diner (exemption view).

  **Leaf 8: Universal Fairness**
  *   **Distinction:** Real and binding on everyone including visitors.
  *   **Awkward Commitment:** You must argue a tourist is morally obligated to subsidize local wages via tips even if their home culture views this as bribery.
  *   **Case Fit:** Tourist from no-tipping country at US diner (obligation view).

  **Leaf 9: Expressive Coordinationist**
  *   **Distinction:** Binding but because of what the act expresses rather than any effect.
  *   **Awkward Commitment:** You must condemn standing on the "wrong" side of an escalator as morally significant even if no one is blocked and no rule exists.
  *   **Case Fit:** Standing on the left of the escalator (moralized view).

  **Leaf 10: Cultural Guest Exemption**
  *   **Distinction:** Real but binding only on those who participate and can reciprocate.
  *   **Awkward Commitment:** You must allow a guest to wear shoes in a Japanese home if they plead ignorance, even if the host is distressed.
  *   **Case Fit:** Visitor in a Japanese house (ignorance defense).

  **Leaf 11: Contextual Deontologist**
  *   **Distinction:** Real and binding on everyone including visitors.
  *   **Awkward Commitment:** You must allow a guest to violate a sacred household norm if the stakes are high enough (e.g. medical emergency), making the duty contingent.
  *   **Case Fit:** Visitor in a Japanese house (emergency exception).

  **Leaf 12: Strict Deontologist**
  *   **Distinction:** Real and binding on everyone including visitors.
  *   **Awkward Commitment:** You must condemn a guest for wearing shoes in a Japanese house even if they are unaware of the norm, as the violation itself is the wrong.
  *   **Case Fit:** Visitor in a Japanese house (strict view).

