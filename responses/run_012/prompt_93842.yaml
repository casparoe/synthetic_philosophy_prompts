      *   *Final Lean:* Dan is right that the process was flawed and the reasoning contained errors (correlation neglect). Priya is right that bad outcomes don't prove error, but she concedes the correlation error which undermines her "individuals were rational" claim. Dan gets the verdict because he identified the specific cognitive failure (correlation neglect) that drove the cascade, whereas Priya hides behind "ex ante rationality" while admitting a calculation error occurred.

