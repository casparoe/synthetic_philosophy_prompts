      *   **Constraint 1:** Duration: 4-5 minutes (approx. 600-750 words spoken at a moderate pace).
      *   **Constraint 2:** Content: Must *embody* Sen's Liberal Paradox without naming it, citing it, or getting technical.
      *   **Constraint 3:** Tone: Needs to balance intellectual rigor (for the philosophers) with warmth/humor/emotion (for the family).
      *   **Constraint 4:** Goal: Acknowledge the "collision" between individual liberty and social preference, affirm the couple's private sphere, and land emotional beats.

  2.  **Deconstruct Sen's Liberal Paradox (for internal understanding):**
      *   *Core Tension:* Minimal Liberalism (everyone gets at least one pair of choices purely their own) vs. Pareto Efficiency (if everyone prefers X to Y, society should prefer X to Y).
      *   *The "Blow Up":* When people have "meddlesome preferences" (opinions on others' private choices), these two axioms conflict. You can't satisfy both simultaneously.
      *   *Application to Wedding:* Guests have opinions on how the couple should live (Pareto/Social Preference). The couple needs autonomy over their private life (Liberalism). The toast must navigate this by acknowledging the guests' care while firmly (but lovingly) demarcating the couple's sovereign territory.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening (The Hook):** Acknowledge the room's split nature. A joke about the two halves of the audience. Establish the novelist voice (storytelling).
      *   **The Setup (The Philosophical Undercurrent):** Talk about "rules for living together." Don't use jargon. Use metaphors of books, houses, or gardens.
      *   **The Conflict (The Paradox in Action):** Address the "meddlesome preferences" without calling them that. Talk about how much everyone cares, how many opinions there are on marriage.
      *   **The Resolution (The Couple's Sphere):** Assert the couple's right to decide the "private pages." This satisfies the "Liberal" side of the paradox.
