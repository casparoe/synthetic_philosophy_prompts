answer: |-
  Good evening. For those of you who don't know me, I'm the sister. I write fiction for a living, which means I spend my days inventing people and telling them where to go. My sister, on the other hand, spends her days studying how real people decide where to go, and why it's so incredibly difficult to get them to agree.

  Looking around this room, I see we have a bit of a divide. On my left, the family. You know my sister as the girl who took apart the toaster to see how it worked, and the woman who calls to ask if a cloud looks like a concept or just a cloud. On my right, her colleagues. You know her as the mind that can untangle a knot in logic that would make the rest of us scream.

  I've been thinking about what to say tonight, and I realized that a marriage is actually a very specific kind of logical problem.

  We all want what is best for [Bride] and [Groom]. If we could vote on the trajectory of their happiness, every single hand in this room would go up for the same option. We want them safe, we want them joyful, we want them to have the kind of love that outlasts the furniture. In any system of logic, when every individual prefers one outcome over another, that is the outcome the group should choose. It's the efficient choice. It's the consensus.

  But here is the catch, and it's the catch that my sister has spent a decade teaching her students to respect.

  There are some pages in the book of a life that simply cannot be read by the public. There are decisions that do not belong to the crowd, even when the crowd is full of aunts who know best, and colleagues who know logic.

  We have all gathered here to witness a boundary being drawn. Tonight, we are acknowledging that while we all have a stake in their happiness, we do not have a vote in their privacy.

  I know how tempting it is. I have an aunt who still thinks she should choose my socks, and I know there are people in this room who have already formed strong preferences about how [Bride] and [Groom] should arrange their bookshelves, spend their holidays, or debate the dishwasher loading protocol. And logically, if we all agree that the dishwasher should be loaded a certain way, surely that is the way it should be done?

  No.

  Because the moment we let the group decide the private things, the individuals stop being free. And you cannot have a marriage without two free individuals.

  So, this is my request to the room. It is a request to suspend the rule of the majority in favor of the sovereignty of the couple.

  To the family: Your love is the foundation. You built the people they are. But you have to trust the architecture they are building now. There will be times when they make choices that seem inefficient to you. Times when they prefer a messy truth to a clean answer. You might all agree on a better path for them. But you must let them walk their own.

  To the colleagues: You know better than anyone that systems break when you force external preferences into internal variables. Do not try to solve them. Do not try to optimize them. Let them be paradoxical. Let them be inconsistent. Let them have a sphere of influence that belongs only to the two of them, behind a closed door where the only vote that counts is cast by [Groom] and [Bride].

  This is the hard work of love. It is knowing the difference between caring for someone and controlling someone. It is understanding that the most profound thing you can give another person is not your advice, but your restraint.

  [Bride], I have watched you spend ten years circling a problem that proves no system is perfect. But tonight, you aren't solving a problem. You're starting a story. And in this story, the logic doesn't have to hold, the premises don't have to be sound, and the conclusion doesn't have to make sense to anyone outside these walls.

  It just has to be true for you.

  So, if everyone could raise a glass.

  To the consensus of this room: that we love you both, fiercely and without condition.
  And to the exception of this room: that what happens in the space between you, stays between you.

  To [Bride] and [Groom].
