answer: |-
  This is a sophisticated challenge. You are trying to operationalize a radical ethical framework (Lexical Threshold Negative Utilitarianism or LTNU) within a bureaucratic constraint (20-minute reviews, mixed expertise) while maintaining intellectual honesty about the limitations of utilitarian calculus.

  Below is a proposed **Decision Procedure for Harm-Benefit Analysis (HBA)**. It is designed to be printed as a one-page checklist for the committee to work through during the 20-minute window. It hard-codes the LTNU concerns without letting them paralyze the committee on every minor protocol.

  ### The Procedure: "The Threshold & Trade-Off Protocol"

  **Pre-Meeting Requirement:** The applicant must categorize all procedures into regulatory severity bands (Mild, Moderate, Severe, Non-Recovery). The committee does not calculate numbers from scratch; they audit these classifications.

  #### Step 1: The Lexical Threshold Check (The Veto)
  **Question:** Does any component of this protocol involve suffering that crosses the **Lexical Red Line**?
  *   **Definition:** The Red Line is defined as *Severe, unmitigatable suffering that compromises the animal's will to live or causes sustained terror/agony beyond a specific duration (e.g., >24 hours unrelieved).*
  *   **Good Enough Answer:** "No, all pain is managed by anesthesia/analgesia and ends before the Red Line." OR "Yes, but it is Non-Recovery (animal anesthetized until death)."
  *   **Fail Condition:** "Yes, there is Severe unrelieved pain."
  *   **Action:** **IMMEDIATE REJECT.** No benefit calculation follows.
  *   **Honesty Clause:** *Chair must state:* "We are treating this Red Line as an absolute moral boundary, not a trade-off point. This is a values decision, not a scientific one."

  #### Step 2: The Commensurability Declaration
  **Question:** Are we comparing pain to benefit as if they are the same currency?
  *   **Good Enough Answer:** "We acknowledge they are not. We are using severity bands as a proxy for moral weight, knowing this is imperfect."
  *   **Action:** If any member objects that the benefit (e.g., "knowledge") cannot morally weigh against the harm (e.g., "pain"), trigger **Step 5 (Vote)**. Do not proceed to calculation.

  #### Step 3: The Aggregation & Uncertainty Check
  **Question:** Can we quantify the harm and benefit?
  *   **Constraint:** Do not use numbers (1–10). Use **Bands** (Low, Medium, High).
  *   **Harm Band:** Combine Severity $\times$ Duration $\times$ Number of Animals.
  *   **Benefit Band:** Combine Certainty of Outcome $\times$ Magnitude of Impact.
  *   **Uncertainty Rule:** If Benefit Certainty is "Speculative" and Harm is "Certain," the Harm Band automatically upgrades one level (Precautionary Principle).
  *   **Good Enough Answer:** "Harm is High (Moderate severity $\times$ Long duration). Benefit is Medium (High impact but low certainty)."
  *   **Action:** If Harm Band > Benefit Band, move to **Reject**. If Benefit Band $\ge$ Harm Band, move to **Step 4**.

  #### Step 4: The 3Rs Audit (Refinement)
  **Question:** Have we minimized the Harm Band as much as possible?
  *   **Good Enough Answer:** "Yes, analgesia is maxed, numbers are statistically minimal."
  *   **Fail Condition:** "We could use fewer animals or more painkillers but didn't for cost/convenience."
  *   **Action:** **Return to Applicant** (Defer). Do not approve until refined.

  #### Step 5: The Values Vote (The Safety Valve)
  **Trigger:** This vote occurs if:
  1.  Step 1 was borderline (Is this suffering actually above the Red Line?).
  2.  Step 2 triggered (Members disagree on commensurability).
  3.  Step 3 resulted in a tie (Harm Band = Benefit Band).
  *   **Procedure:** Simple Majority. Lay members' votes count equally to scientists'.
  *   **Outcome:** Majority Approves = **Conditional Approval**. Majority Rejects = **Reject**.

  ---

  ### Application to Your Three Cases

  Here is how the procedure processes your scenarios.

  #### Case (a): Mice, moderate/weeks-long pain, high human benefit.
  *   **Step 1 (Threshold):** Moderate pain is generally below the "Severe/Unrelieved" Red Line. **Pass.**
  *   **Step 2 (Commensurability):** Standard HBA. **Pass.**
  *   **Step 3 (Aggregation):**
      *   Harm: Moderate Severity $\times$ Weeks $\times$ Small N = **Medium-High Harm Band**.
      *   Benefit: High Certainty $\times$ High Impact = **High Benefit Band**.
      *   Comparison: Benefit $\ge$ Harm. **Pass.**
  *   **Step 4 (3Rs):** Assume standard refinement. **Pass.**
  *   **Verdict:** **Approve.**
  *   *Note:* This is the standard "workhorse" protocol. The procedure validates it because it stays below the lexical threshold.

  #### Case (b): Mild/lifelong discomfort, large colony, low payoff.
  *   **Step 1 (Threshold):** Mild is below Red Line. **Pass.**
  *   **Step 3 (Aggregation):**
      *   Harm: Mild Severity $\times$ **Lifelong** $\times$ **Large Colony**.
      *   *Crucial Mechanism:* The procedure forces you to aggregate duration and numbers. "Mild" $\times$ "Forever" $\times$ "Many" pushes the Harm Band to **High**.
      *   Benefit: Low Payoff = **Low Benefit Band**.
      *   Comparison: Harm > Benefit.
  *   **Verdict:** **Reject.**
  *   *Note:* This catches the "death by a thousand cuts" scenario that gut-feel often misses. The aggregation rule forces the committee to see that lifelong mild suffering sums to a massive moral cost.

  #### Case (c): Short but severe pain, few animals, big expected payoff.
  *   **Step 1 (Threshold):** Here is the friction point.
      *   If "Severe" is defined as crossing the Lexical Red Line (e.g., unrelieved agony, even if short): **IMMEDIATE REJECT.**
      *   If "Severe" is defined as a regulatory band that *can* be mitigated (e.g., severe pain relieved by morphine after 1 hour): It passes to Step 3.
  *   **Step 3 (Aggregation):**
      *   Harm: Severe Severity $\times$ Short Duration $\times$ Few Animals = **Medium Harm Band** (Severity weighs heavier than duration in this model).
      *   Benefit: Big Payoff = **High Benefit Band**.
  *   **Step 5 (Vote):** Because "Severe" pain triggers the LTNU member's concern, Step 1 becomes a **Values Vote**.
      *   The LTNU member will argue Short/Severe > Any Benefit.
      *   The Utilitarian member will argue Short/Severe < Big Benefit.
  *   **Verdict:** **Likely Reject (or heavily conditioned).**
  *   *Confirmation of your suspicion:* You suspected the procedure would reject this. **It does,** provided the committee defines "Severe" as approaching the Lexical Threshold. Even if it doesn't trigger an automatic veto, it forces a Step 5 Vote where the "Honesty Clause" requires the LTNU member to state: *"I do not believe this pain is commensurable with the benefit."* This often sways lay members to vote Reject.

  ---

  ### Where the Procedure Will Misfire

  1.  **The Classification Gaming (Step 1 Failure):**
      *   **Risk:** Applicants will aggressively argue that "Severe" pain is actually "Moderate" to avoid the Lexical Veto.
      *   **Misfire:** If the committee lacks veterinary expertise, they may accept "Moderate" for what is actually torturous. The procedure relies entirely on the accuracy of the initial severity banding.
      *   **Fix:** Require a veterinarian with no stake in the project to sign off on the Severity Band *before* it reaches the committee.

  2.  **The Aggregation Blind Spot (Step 3 Failure):**
      *   **Risk:** The procedure uses Bands (Low/Med/High), not math. Humans are bad at aggregating "Mild $\times$ Many." We tend to focus on the *intensity* (Mild) and ignore the *multiplier* (Many).
      *   **Misfire:** Case (b) might still get approved if the committee treats "Mild" as "Negligible" regardless of duration.
      *   **Fix:** The checklist must explicitly ask: "If this were one human, would we allow it for a lifetime?" (The Species-Neutral Intuition Pump).

  3.  **The Benefit Inflation (Step 3 Failure):**
      *   **Risk:** Researchers always claim "High Impact." The committee rarely has the expertise to judge if a drug will actually "help a lot of people."
      *   **Misfire:** You approve based on a promised benefit that never materializes.
      *   **Fix:** The "Uncertainty Rule" in Step 3. If the benefit is >2 years away or relies on multiple subsequent successful experiments, downgrade Benefit Certainty to "Speculative."

  ### Where a Determined Applicant Could Game It

  1.  **Salami Slicing:**
      *   **Tactic:** Instead of one protocol with 100 animals (High Harm Band), submit 5 protocols with 20 animals each (Medium Harm Band).
      *   **Counter:** The procedure needs a **Cumulative Review Clause**. The Chair must check: "Has this lab submitted similar protocols in the last 12 months?" If yes, aggregate them for the Harm Band calculation.

  2.  **The "Rescue" Loophole:**
      *   **Tactic:** Claiming that severe pain is "unavoidable for scientific reasons" but promising "humane endpoints" that are actually triggered too late.
      *   **Counter:** Step 4 (3Rs Audit) must require specific, objective triggers for euthanasia (e.g., "20% weight loss") rather than subjective ones ("if animal looks sick").

  3.  **Vocabulary Drift:**
      *   **Tactic:** Using words like "distress" instead of "pain," or "discomfort" instead of "suffering" to lower the perceived Harm Band.
      *   **Counter:** The procedure must include a **Glossary of Terms** attached to the checklist. "Distress" = "Moderate." "Agony" = "Severe." Standardize the language.

  ### Summary for the Chair

  To implement this without slowing down the 20-minute window:
  1.  **Distribute the Checklist 48 hours early.** Members must pre-fill Step 1 and Step 3 bands.
  2.  **The 20 minutes is for Disagreement Only.** If everyone marks "Pass" on Step 1, you do not discuss it. You only discuss the Steps where marks differ.
  3.  **Empower the Lay Member.** In Step 5 (Values Vote), explicitly ask the lay member first. Their "gut feel" is actually the LTNU check you are looking for.

  This procedure respects the LTNU view by creating a hard veto (Step 1) and a values vote (Step 5), while acknowledging the fiction of the trade-off (Step 2). It confirms your suspicion on Case (c): under strict adherence, severe pain triggers a values vote that is very hard to win against a committed negative utilitarian.
