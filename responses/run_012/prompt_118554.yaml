answer: |-
  **Project Title:** Error Stability as a Marker of Internal Model Structure

  **Research Question**
  Do large language models exhibit semantic invariance in their errors? Specifically, when a model fails a reasoning task, does the specific error persist across paraphrases that preserve logical structure but alter surface features, or does the error fluctuate with the phrasing?

  **Philosophical Context**
  Current debates focus on competence: whether models pass benchmarks indicative of understanding. This leaves the nature of failure under-examined. A system with a mistaken internal model (e.g., a student with a flawed physics theory) should fail consistently; their errors stem from a stable, albeit incorrect, representation of relations. A system operating purely on statistical token prediction should fail inconsistently; its errors should track surface probabilities (word order, phrasing frequency) rather than underlying logical relations. Standard positions assume success proves understanding or failure disproves it. Neither accounts for the *topology* of failure. This project tests whether the distinction between "world-model errors" and "surface-statistic errors" is empirically detectable.

  **Methodology**
  I will conduct a semantic invariance test on error patterns using publicly accessible chat models.

  1.  **Dataset:** I will curate 30 multiple-choice questions targeting known naive physics misconceptions (e.g., motion, gravity). Using multiple-choice ensures objective error classification (selecting Distractor A vs. Distractor B).
  2.  **Transformation:** For each question, I will generate three paraphrases. These will vary syntax, vocabulary, and option order while strictly preserving the logical structure and the specific misconception targeted by the distractors.
  3.  **Procedure:** I will submit all three versions to the model. If the model answers incorrectly, I will record whether it selects the same distractor across all versions.
  4.  **Classification:**
      *   *Stable Error:* The model selects the same incorrect option across ≥2 paraphrases. This supports the "mistaken internal model" hypothesis.
      *   *Unstable Error:* The model selects different incorrect options or corrects itself across paraphrases. This supports the "surface statistics" hypothesis.
  5.  **Control:** I will compare results against a small, locally run open-source model (if hardware permits) to check if error structures differ by architecture size, though the primary analysis focuses on the behavioural pattern itself.

  **Outcomes and Failure Conditions**
  *   **Success:** A statistically significant tendency toward stable errors. This would suggest the distinction between "world-picture" and "sentence-picture" failures is behaviourally meaningful, lending weight to the idea that models develop internal representations robust to surface noise.
  *   **Negative Result:** Errors fluctuate randomly across paraphrases. This supports the view that failures are artifacts of prompt sensitivity rather than representational defects.
  *   **Project Failure:** The distinction collapses. If errors are too rare to analyze, or if "same error" cannot be objectively defined without appealing to the very understanding being tested, the proposed criterion is empty. Additionally, if paraphrasing inevitably alters the statistical likelihood of the correct answer in the training distribution such that surface and semantics cannot be disentangled, the test is invalid.

  **Feasibility and Scope**
  A full-scale statistical analysis is beyond the scope of a semester's part-time work. I have reduced the dataset from a proposed 100 items to 30 to ensure rigorous paraphrase construction and manual verification within 120 hours. Relying on multiple-choice questions eliminates the need for complex semantic similarity scoring of free-text answers. If local model execution proves technically prohibitive, I will rely solely on a single public chat interface, treating the model as a fixed black box. This ensures the project remains a philosophical investigation into the *criteria* for understanding, using empirical data only to test the viability of the distinction, not to train or modify the system. The deliverable is not a proof of understanding, but a determination of whether error stability is a viable proxy for it.
