              *   Distinguish "higher bar for certainty" vs. "new alternatives to rule out" (Relevant Alternatives).
              *   Knows but shouldn't act (Knowledge vs. Action norm).
              *   Stakes rise *after* belief formation (Retroactive downgrading).
              *   Use the Epi-pen example if it fits.
              *   Avoid the standard "Bank Case" if possible (use mushrooms, ice, etc.).
          4.  **Scoring Key:** Map answer patterns to specific philosophical positions:
              *   Plain Invariantism (Traditional).
              *   Contextualism (Ascriber context matters).
              *   Subject-Sensitive Invariantism/Encroachment (Subject's stakes matter).
              *   Assessment Sensitivity/Relativism (Evaluator's context matters).
              *   Pragmatic Encroachment on Action/Assertion only (Knowledge fixed, action norms vary).
          5.  **Meta-Analysis:**
              *   Identify incoherent/unattractive answer combinations (empty cells).
              *   Identify positions the quiz *cannot* separate.
              *   Identify fragile distinctions (positions separated by only one question).
              *   No jargon in the questions.

  2.  **Deconstruct the Philosophical Positions:**

      *   **Traditional Invariantism (TI):** Knowledge depends *only* on truth, belief, and justification/evidence. Stakes, context, and practical utility are irrelevant to whether someone *knows*. (Verdict: Always "Knows" if evidence is good enough, regardless of stakes).
      *   **Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment:** Knowledge depends on the *subject's* practical stakes. High stakes for the knower = harder to know. (Verdict: "Knows" in low stakes, "Doesn't know" in high stakes).
      *   **Contextualism (C):** The word "knows" changes meaning based on the *ascriber's* (speaker's) context. If I'm speaking in a high-stakes context, "S knows" is false, even if S is chill. (Verdict: Depends on who is saying it and their stakes).
      *   **Assessment Sensitivity / Relativism (AS):** Truth of the knowledge claim depends on the *assessor's* context (could be later). (Verdict: Can be true for the subject then, false for the evaluator later).
      *   **Knowledge-Action Distinction (K-A):** Knowledge is invariant, but the *norm of action/assertion* varies with stakes. You can know but shouldn't act. (Verdict: "Knows" but "Shouldn't act/assert").

  3.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need 9 questions. Need to cover the specific scenarios requested.
      *   *Question 1 (Chill vs. Serious - Subject Stakes):* Use the Epi-pen example.
          *   Scenario: You know where the pen is. Case A: Homework question. Case B: Emergency.
          *   Options: Knows in both / Knows in A only / Knows in both but acts differently.
      *   *Question 2 (Ascriber Stakes - Contextualism vs. SSI):* Knower is chill, Speaker is stressed.
          *   Scenario: Friend says "I know the bus leaves at 5." You need to catch a plane.
          *   Options: She knows / She doesn't know (because of your stakes) / She knows but don't rely on it.
      *   *Question 3 (Retrospective - Assessment Sensitivity):* Watching a video later.
          *   Scenario: Watching a recording of someone claiming knowledge before a disaster.
