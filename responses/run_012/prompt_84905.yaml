      *   *Empty Cells:* Combinations that are logically inconsistent. E.g., Saying stakes matter for action but *never* for knowledge, yet saying "Don't know" in high stakes. Or saying Context matters for Ascriber but *not* for Subject in a way that contradicts.
      *   Specifically: Picking "Doesn't Know" in Low Stakes is usually incoherent (skeptical).
      *   Picking "Knows" in High Stakes (Subject) but "Doesn't Know" in High Stakes (Ascriber) is the signature of Contextualism.
