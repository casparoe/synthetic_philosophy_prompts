          *   Scenario: Coffee shop order.
          *   Options: Knows / Doesn't know. (Most should say Knows).
      *   *Question 8 (Standard Evidence - High Stakes):* Baseline control.
          *   Scenario: Medication dosage.
          *   Options: Knows / Doesn't know. (Tests Invariantism vs. Encroachment).
      *   *Question 9 (Third-Party Evaluator):* Another angle on Assessment Sensitivity.
