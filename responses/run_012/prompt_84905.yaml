      *   *Q1 (Subject Stakes Flip):* Epi-pen. Low vs. High stakes for *subject*.
      *   *Q2 (Ascriber Stakes):* Subject chill, *Ascriber* high stakes. (Contextualism vs. SSI).
      *   *Q3 (Retrospective):* Video later. (Assessment Sensitivity).
      *   *Q4 (Relevant Alternatives - Checked):* High stakes, but alternative ruled out.
      *   *Q5 (Relevant Alternatives - Unchecked):* High stakes, alternative NOT ruled out. (Separates "Bar raised" from "Alternatives added").
      *   *Q6 (Action Norm):* Knows but shouldn't act.
      *   *Q7 (Retroactive):* Stakes rise *after* belief.
      *   *Q8 (Assertion Norm):* Knows but shouldn't say.
      *   *Q9 (Control):* Low stakes baseline.

      *Wait, I need to make sure the Answer Choices allow for the scoring.* The answer choices need to be consistent across questions to allow pattern matching.
      *   Option A: "She knows." (Invariantism lean)
      *   Option B: "She doesn't know." (Encroachment/Contextualism lean)
      *   Option C: "She knows, but..." (Pragmatic/Action norm lean)

      *Let's refine the specific scenarios to match the prompt's detailed requirements exactly.*

      1.  **Subject Stakes (Epi-pen):** Low vs High.
      2.  **Ascriber Stakes:** Knower chill, Speaker high stakes.
      3.  **Retrospective:** Video later.
      4.  **Relevant Alternatives (Checked):** High stakes, checked the scary thing.
