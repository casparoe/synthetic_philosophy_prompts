      *   Option 1: "Yes, they know."
      *   Option 2: "No, they don't know."
      *   Option 3: "They know, but they shouldn't [act/say/rely]."

  4.  **Developing the Scoring Key:**

      *   **Plain Invariantism (PI):** Always Option 1 (unless evidence is actually bad). Stakes don't matter.
      *   **Subject-Sensitive Invariantism (SSI):** Option 2 when *Subject's* stakes are high. Option 1 when Subject's stakes are low.
      *   **Contextualism (C):** Option 2 when *Ascriber's* stakes are high (Q2). Option 1 when Ascriber is low stakes.
      *   **Assessment Sensitivity (AS):** Option 2 (or "Can't say they knew") in Retrospective cases (Q3).
      *   **Pragmatic Encroachment on Action/Assertion (PE-AA):** Option 3 ("Knows but shouldn't act"). Distinguishes from SSI (which says "Doesn't know").

      *Wait, there's a nuance:* SSI says "Don't Know." PE-AA says "Know, but don't act." Contextualism says " 'Knows' is false in this context."
      *   So, if someone picks "Doesn't know" in High Stakes (Subject), they are SSI or Contextualist.
      *   If they pick "Knows, but don't act," they are PE-AA or Invariantist who separates norm from knowledge.
      *   If they pick "Knows" in High Stakes (Subject), they are Plain Invariantist.

      *Differentiating Contextualism vs. SSI:* This is the hardest part.
      *   SSI: Depends on *Subject's* stakes.
      *   Contextualism: Depends on *Speaker's/Ascriber's* stakes.
      *   Q2 is the critical differentiator. Subject is chill, Ascriber is stressed.
      *   SSI says: Subject knows (because Subject is chill).
      *   Contextualism says: "Subject knows" is false (because Ascriber is stressed).

      *Differentiating Assessment Sensitivity:*
      *   Q3 (Video later).
      *   AS says: Truth is relative to assessor. If assessor is in high stakes now, "He knew" is false.
      *   SSI/PI says: Truth fixed at time of utterance.

      *Differentiating "New Alternatives" vs. "Higher Bar":*
      *   Q4 (Checked) vs Q5 (Unchecked).
      *   If "Higher Bar": Even if checked, high stakes might mean you need *more* than just checking (e.g., 99% vs 99.9%).
      *   If "Relevant Alternatives": If you checked the specific scary alternative, you know. If you didn't, you don't.
