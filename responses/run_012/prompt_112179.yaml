answer: |-
  **Speech Text**

  Thank you. Please, stay seated. If I see anyone stand up, I shall assume the wine has failed, and I will stop talking immediately.

  Fifty years is a long time. It is long enough for a child to become a director, and for a director to become a memory. We are here to honour a place that asked a very specific, very difficult question. We all know the line. Whenever a trend was presented, the Founder would lean forward and say, "Show me the curve." He meant that history should yield to analysis the way nature yields to physics. He believed that if we looked hard enough, long enough, and patiently enough, the chaos of human time would resolve into law.

  Look around this room. If that ambition was a mistake, it was a magnificent one. It brought economists and historians into the same room before that was fashionable. It taught us to ignore the news cycle. It demanded we think in centuries, not quarters. For that discipline, for that refusal to be impressed by the immediate, we owe a debt that cannot be repaid. I see the Founder's widow at the head table, and I want her to know: the rigour he demanded is the best thing we have to leave behind.

  But I am the outgoing director, and my job is to hand over the keys, not just the furniture. So I must be honest about the lock.

  We have spent fifty years looking for the curve. We have found many. But we have also learned something the Founder hoped was not true. We have learned that a society is not a closed system. It is an open one. The difference is not pedantry. In a closed system, the rules do not change. In an open system, the rules change because the players learn new ones. We cannot predict the future growth of knowledge, and since the future of society is downstream of what it knows, we cannot predict the society.

  If I say there are no laws of history, the old guard hears failure. If I say there are laws, the grad students hear fantasy. I propose a third position. The patterns we have found are real, but they are not laws. They are conditional. They hold only so long as the context holds. A trend is not a law. A law says "this must happen." A conditional pattern says "if this holds, then that follows."

  This distinction matters. It is the difference between what we can honestly promise a funder and what we cannot. It is the difference between prophecy and navigation. We are not prophets. We are navigators. We cannot tell you where the wind will blow. We can tell you how the ship behaves if the wind comes from the north.

  This brings me to our house rule. You know it well. In our seminars, no future-tense claim without an explicit condition. "X will happen" is banned. "If A, then X" is permitted. I have tried to obey that rule in this speech. I am obeying it now.

  If we continue this Centre, we cannot continue the old programme. We cannot hunt for laws that are not there. But if we shift our aim, the work becomes more vital, not less. If we map the conditions under which social change occurs, we give policymakers something more useful than a prediction. We give them a warning. We tell them: "If you pull this lever, the mechanism usually jams." That is not a failure of science. That is the maturity of it.

  So, where does this leave us? If the target has moved, do we shoot? Yes. But we aim differently. We aim for resilience, not prediction. We aim for understanding the constraints, not breaking them.

  If we do this, if we embrace the conditional nature of our knowledge, the Centre will not shrink. It will deepen. We will still ask for the curve. But we will also ask for the context. We will still demand rigour. But we will admit the limits of that rigour.

  I have one more condition to attach. If you raise your glasses, I will propose a toast.

  To the Founder, who gave us the question. To the Widow, who guards the memory. And to the Centre: may we have the courage to follow the evidence, even if it leads us away from the law, and toward the truth.

  ***

  **Analysis: Sentences Likely to Lose the Room**

  1.  **The Sentence:** *"We cannot predict the future growth of knowledge, and since the future of society is downstream of what it knows, we cannot predict the society."*
      *   **The Risk:** This is the epistemological core of your argument, but it is abstract. After dinner, with wine, "future growth of knowledge" sounds like a lecture slide. The old guard might hear "you're saying we're useless," and the grads might hear "finally, someone said it," but both might tune out the nuance.
      *   **The Fix:** Ground it in the work they actually do.
      *   **Say Instead:** *"We cannot predict what we will discover tomorrow, and since what we discover changes what we do, we cannot predict what we will do."* (It's simpler, removes the jargon "growth of knowledge," and focuses on action).

  2.  **The Sentence:** *"It is the difference between what we can honestly promise a funder and what we cannot."*
      *   **The Risk:** Mentioning funders at an anniversary dinner can feel cynical or administrative. It risks turning a philosophical pivot into a budgetary one. It might make the room feel like you're talking about grant applications rather than intellectual legacy.
      *   **The Fix:** Frame it as integrity to the *discipline*, not the wallet.
      *   **Say Instead:** *"It is the difference between a promise we can keep and a prophecy we cannot."* (This keeps the moral weight but removes the bureaucratic smell).

  3.  **The Sentence:** *"If we map the conditions under which social change occurs, we give policymakers something more useful than a prediction."*
      *   **The Risk:** "Policymakers" might alienate the pure historians or the demographers who don't see their work as policy-adjacent. It risks sounding like you're pivoting the centre toward consultancy.
      *   **The Fix:** Broaden the audience of the work to "those who act."
      *   **Say Instead:** *"If we map the conditions under which social change occurs, we give those who act something more useful than a prediction."*

  **Emergency Line (For the Pocket)**

  If the tribute to the Founder feels cold, or if the widow's reaction is unreadable and the room tense, use this when you raise your glass:

  *"He taught us that if the data contradicts the theory, the data wins. Tonight, if the mood contradicts the speech, the mood wins."*

  (Smile, drink, sit down. It acknowledges the tension, honours his empiricism, and gives you an exit.)
