  4.  **Apply the PP Machinery:**
      *   *Trigger:* Is there a risk of harm (suffering) + uncertainty? Yes (neuroscience is hard, but behavior suggests pain).
      *   *Burden Shift:* Instead of "prove they feel pain," it becomes "prove they *don't* feel pain before hurting them."
      *   *Action:* Restrict practices (ablation) until safety is proven.
      *   *Analysis:*
          *   LSE Review: Applied PP well. Didn't wait for 100% proof.
          *   Legislation: Applied PP well (included them in scope).
