      *   *Jurisdictional Gap:* UK law binds UK ministers, not Vietnamese/Ecuadorian hatcheries. PP works within a regulatory regime; it doesn't magically extend sovereignty.
      *   *Binary vs. Continuum:* Law needs a bright line (Sentient/Not). Evidence is probabilistic. PP bridges this, but political will collapses the bridge.
      *   *Advisory vs. Regulatory:* The ASC can say "this hurts them," but cannot ban imports. PP demands action, but the mechanism is only advice.
      *   *Economic Cost:* PP usually requires "cost-effective measures." If banning ablation crashes shrimp supply, industry argues it's not cost-effective. PP struggles with high economic trade-offs.

  6.  **Evaluate the Principle Itself:**
      *   Is it an anomaly? No.
