  2.  **Define the Precautionary Principle (PP) in this Context:**
      *   Standard definition (Rio Declaration 1992): "Where there are threats of serious or irreversible damage, lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures to prevent environmental degradation."
      *   Animal Welfare adaptation (Cambridge Declaration, LSE Review): Where there is *non-negligible probability* of sentience/suffering, lack of *conclusive proof* shall not prevent welfare protections.
      *   Key Machinery: Threshold of evidence trigger -> Shift of burden of proof -> Proportionate action.

  3.  **Map the Actors and Decisions:**
