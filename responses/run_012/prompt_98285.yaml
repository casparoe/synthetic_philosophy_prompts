answer: |-
  # WORKSHEET: THE MENO MAP
  **Instructions:** Start at **Node 1**. Answer each question by selecting the case or claim that best matches your intuition. Follow the arrow to the next node or final position. Do not look at the position names until you reach the end.

  ---

  ### **NODE 1: The Meno Premise**
  **Case:** A patient recovers from an illness. **Doctor A** prescribed the cure because she *knew* the medicine worked. **Patient B** took the same medicine because she *guessed* it looked tasty. Both are equally healthy now.
  *   **[A]** The Doctor's state was *always* more valuable than the Patient's, even if the health outcome is identical. → **Go to Node 2**
  *   **[B]** Not necessarily. If the outcome is the same, the "knowledge" didn't add value in this instance. → **LEAF 1**

  ### **NODE 2: The Swamping Problem**
  **Case:** You have a true belief. **Clock A** is reliable and will tell true time tomorrow. **Clock B** is broken but stopped exactly right now. Both show the correct time *now*.
  *   **[A]** Clock A's reading is more valuable *right now*, even ignoring future accuracy. (Reliability adds intrinsic value). → **Go to Node 4**
  *   **[B]** Clock A is only better because it helps you get *more* true beliefs later. (Value is purely instrumental). → **Go to Node 3**

  ### **NODE 3: The Instrumental Goal**
  **Claim:** If knowledge is only valuable because it leads to good things, what is the ultimate "good" it aims at?
  *   **[A]** It depends on the stakes. In high-stakes cases, the belief is less valuable unless the evidence is stronger. → **LEAF 2**
  *   **[B]** It aims at successful action and well-being, not just truth. (False beliefs can be valuable if they help us thrive). → **LEAF 3**
  *   **[C]** It aims strictly at acquiring more true beliefs and avoiding error. → **Go to Node 5**

  ### **NODE 4: The Locus of Value**
  **Case:** **Investigator X** works hard to verify a fact using a reliable method. **Receiver Y** acquires the same fact via reliable testimony without effort. Both have reliable true beliefs.
  *   **[A]** They are equally valuable. The reliable process is what matters, not who did the work. → **LEAF 4**
  *   **[B]** Investigator X's belief is more valuable because the agent contributed to the success. → **Go to Node 6**

  ### **NODE 5: The Structure of Knowledge**
  **Claim:** On the path to maximizing true beliefs, is "Knowledge" a composite tool (True Belief + Rules) or the basic standard itself?
  *   **[A]** It is the basic standard. You cannot analyze it into simpler parts without circularity. → **LEAF 5**
  *   **[B]** It is a composite tool. Knowledge is just true belief that reliably hits the truth-target. → **LEAF 6**

  ### **NODE 6: The Nature of Achievement**
  **Case:** **Mapper M** sees how facts connect into a coherent system. **Collector C** has the same number of true beliefs but sees them as isolated facts. Both deserve credit for their truths.
  *   **[A]** Mapper M is more valuable. Grasping connections (understanding) is the peak epistemic good. → **LEAF 7**
  *   **[B]** They are equal. Credit for arriving at the truth is enough; coherence is extra. → **LEAF 8**

  ---

  ## **POSITION KEY & SCORING**

  | Leaf | Position Name | The Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Epistemic Value Skepticism** | You must deny the core intuition that drives most epistemology: that knowledge is *always* preferable to lucky true belief. |
  | **2** | **Pragmatic / Attributor-Relative** | The value of a true belief shifts depending on how much money is at stake or who is asking about it. |
  | **3** | **Epistemic Consequentialism** | You might have to endorse a useful falsehood as more "valuable" than a useless truth. |
  | **4** | **Process Reliabilism** | A passive brain-in-a-vat with reliable inputs has beliefs just as valuable as an embodied agent's. |
  | **5** | **Knowledge-First** | You must treat "knowledge" as an unexplained explainer that cannot be analyzed into simpler parts. |
  | **6** | **Veritist / Instrumental** | You struggle to explain why knowledge is better than mere true belief if truth is the only final value (Swamping). |
  | **7** | **Understanding-Based** | You may have to deny "knowledge" status to someone who has justified true belief but lacks a coherent map. |
  | **8** | **Virtue / Credit** | You risk excluding children or animals from knowledge if they cannot exercise robust agent-level credit. |

  ---

  ## **TREE LIMITS & BLIND SPOTS**

  **1. Indistinguishable Leaves:**
  The tree struggles to separate **Leaf 5 (Knowledge-First)** and **Leaf 6 (Veritist/Instrumental)**.
  *   *Why:* In most concrete cases, both positions prescribe the same norms (aim for truth, avoid error). The difference is metaphysical (is knowledge primitive?) rather than practical, so case-based questions often yield identical answers for both.

  **2. The Unoccupied Combination:**
  **Node 2 [A] (Intrinsic Value)** + **Node 3 [A] (Value depends on Stakes)**.
  *   *Why:* This combination is effectively unoccupied. If you believe the value of knowledge is *intrinsic* to the state itself (Final Value), it is incoherent to claim that value fluctuates based on external practical stakes. Usually, if stakes matter, the value is assumed to be instrumental or relational, not intrinsic.

  **3. Missing Nuance:**
  The tree forces a binary choice on **Node 6 (Credit vs. Coherence)**. Some positions (e.g., *Integrative Virtue Epistemology*) argue credit *requires* coherence, making these leaves harder to distinguish in practice than the tree suggests.
