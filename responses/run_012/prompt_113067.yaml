answer: |-
  This is a sound pedagogical strategy. By establishing the criteria first, you prevent students from treating theories as isolated systems to be memorised, and instead frame them as competing solutions to a shared set of problems. Below is a proposed specification of desiderata, an analysis of the tensions between them, and an assessment of how the main approaches fare.

  ### The Desiderata

  You proposed five specific items. I argue that four of these are essential, but one requires modification to remain a neutral criterion rather than a theoretical commitment. Here is the consolidated list of four non-negotiable requirements.

  **1. Semantic Evaluability (Based on your Item 1)**
  Any account must explain how ordinary predictions can be assessed as correct or incorrect *at the time they are made*. If I say today, "It will rain tomorrow," and it does not, my statement must be faulty today, not merely retrospectively disappointing. Similarly, promises and resolutions must function as binding commitments; if I promise to meet you, I have undertaken an obligation now, not merely entered a state of waiting.
  *Judgement:* **Non-negotiable.** Without this, the practice of prediction and commitment loses its normative force. We hold one another accountable in the present tense based on future-directed speech.

  **2. Logical Autonomy (Based on your Item 2)**
  The account must address the problem of future contingency as a logical or semantic issue, distinct from causal determinism. The puzzle must bite even in a world governed by chance. If a solution relies solely on the premise that the physical world is indeterministic, it has not addressed the core philosophical problem regarding truth and time.
  *Judgement:* **Non-negotiable.** Conflating logical fatalism with causal determinism is a category error. The Sea-Battle argument is about the nature of truth, not the nature of physics.

  **3. Temporal Asymmetry (Based on your Item 3)**
  The account must vindicate the intuition that the past is fixed and the future is open, or provide a compelling error theory explaining why we believe this despite it being false. It is not sufficient to presuppose this asymmetry; the theory must locate it. Is it in the world, in our knowledge, or in the logic of our language?
  *Judgement:* **Non-negotiable.** This is the phenomenological datum that sparks the inquiry. A theory that treats past and future as metaphysically identical (the 'block universe') must explain why deliberation feels possible for one and impossible for the other.

  **4. Modal Distinction and Settling (Modified from your Item 4)**
  The account must distinguish between 'will' and 'might'. To say "It will happen" must differ in content from "It might happen." Furthermore, it must explain the transition from contingency to settledness.
  *Critique of your Item 4:* You specified that this settling must occur "without having changed from false to true." I argue this should **not** be a desideratum, but rather a theoretical option. To demand that truth values *never* change is to beg the question against views that hold truth is temporal. The requirement should simply be: *Explain how a contingent claim becomes settled.* Whether this involves a change in truth value is for the theory to decide.
  *Judgement:* **Non-negotiable (in modified form).** Without this, we cannot distinguish prediction from guesswork, nor can we explain why deliberation ceases once a decision is made.

  *(Note on your Item 5: Reflexive Agency)*
  I have subsumed your fifth point (cases where the agent brings about the predicted event) under **Semantic Evaluability** and **Agency**. While a crucial stress test, it is a specific instance of the broader requirement that agency must be compatible with truth. Making it a separate top-level criterion risks cluttering the list with edge cases.

  ***

  ### The Collision

  You asked for the pairs of requirements that cannot be met simultaneously. There is a trilemma here, meaning no view can satisfy all three of the following core commitments without significant cost. The collision arises primarily between **Semantic Evaluability**, **Logical Autonomy**, and **Temporal Asymmetry**.

  **1. Evaluability vs. Asymmetry**
  This is the central conflict.
  *   If we insist on **Semantic Evaluability** (every claim is true or false now), we threaten **Temporal Asymmetry**. If "The sea battle will occur" is *true* today, then the occurrence of the battle is factually fixed today. If it is fixed, it is not open. If it is not open, the asymmetry between the settled past and the open future collapses.
  *   If we insist on **Temporal Asymmetry** (the future is genuinely open), we threaten **Semantic Evaluability**. If the future is open, then "The sea battle will occur" is not yet true (nor false). But if it is not true or false, the prediction cannot be assessed as correct or incorrect *today*.

  **2. Fixity of Truth vs. Settling**
  This concerns your suspicion about truth becoming settled.
  *   If we hold that truth is **Fixed** (a proposition, once true, is always true), we struggle to explain **Settling**. If "The battle will occur" is true today, in what sense does it *become* settled tomorrow? It was already settled by the truth value.
  *   If we hold that claims **Settle** over time (they acquire a truth value only when the event occurs), we violate the **Fixity of Truth**. The proposition changes from indeterminate to true. This makes truth temporal, which complicates the logic of assertion and retraction.

  **3. Logical Autonomy vs. Asymmetry (The Hidden Collision)**
  *   Many views save **Temporal Asymmetry** by appealing to branching time or indeterminism. However, if they rely on the *structure* of the world to break bivalence, they risk violating **Logical Autonomy**. The logical problem is that *if* there is a truth, *then* the future is fixed. Merely asserting "there is no truth" because the world is chancy can look like a physical solution to a logical problem. The collision here is between providing a logical semantics and providing a metaphysical description.

  **The Unsatisfiable Subset:**
  It is jointly unsatisfiable to hold:
  1.  **Bivalence:** Every future contingent claim is presently true or false.
  2.  **Fixity:** Truth values do not change over time.
  3.  **Openness:** The future is not presently settled.

  You must drop one.
  *   Drop Bivalence → You save Openness, but lose Evaluability (predictions are neither true nor false yet).
  *   Drop Fixity → You save Openness and Evaluability, but make truth temporal (a prediction is false today, true tomorrow).
  *   Drop Openness → You save Bivalence and Fixity, but accept Fatalism (the future is as fixed as the past).

  ***

  ### The Single Exclusionary Requirement

  The requirement that does the most to exclude candidates is **Semantic Evaluability** (the demand that predictions are truth-apt *at the time of utterance*).

  This is the hardest constraint because it forces an immediate commitment to classical logic (Bivalence). A vast family of sophisticated metaphysical views—those that prioritise the openness of the future—are forced to deny this. They must argue that when you make a prediction about a contingent future, you are not stating a fact that can be judged today. This contradicts our ordinary practice of calling a prediction "right" or "wrong" immediately after the event, based on how things stood *before*. Insisting on Evaluability filters out almost all 'Open Future' metaphysics, leaving only those willing to bite the bullet on fatalism or complicate the nature of truth.

  ***

  ### How the Main Families Fare

  Here is how the primary responses manage this exclusionary requirement, described in plain terms without relying on specific camp labels.

  **1. The 'Fixed Truth' View (Ockhamist-style)**
  *   **Stance:** Accepts **Semantic Evaluability**. A claim about tomorrow is true or false today.
  *   **Cost:** It struggles with **Temporal Asymmetry**. To explain why the future feels open, it must argue that 'openness' is merely epistemic (we don't *know* the truth) rather than metaphysical. It risks making deliberation feel idle, as the truth is already 'out there' waiting to be found.
  *   **Verdict:** Meets Evaluability, but strains Asymmetry.

  **2. The 'Open Future' View (Peircean/Branching-style)**
  *   **Stance:** Rejects **Semantic Evaluability**. A claim about a contingent future is neither true nor false today. It only acquires a truth value when the event happens.
  *   **Cost:** It struggles with ordinary language. It implies that when you made a prediction yesterday, you did not say something true or false, even if it came to pass. It makes the concept of a 'false prediction' difficult to pin down until the moment of failure.
  *   **Verdict:** Meets Asymmetry, but sacrifices Evaluability.

  **3. The 'Relative Truth' View (Relativist-style)**
  *   **Stance:** Attempts to save both by making truth relative to a time of assessment. A prediction is not true *simpliciter* today; it is true *relative to tomorrow*.
  *   **Cost:** It complicates **Logical Autonomy** and the **Fixity of Truth**. It requires a non-classical logic where 'true' is an incomplete predicate. It struggles to explain why we argue about predictions *now* if their truth is only determined *later*.
  *   **Verdict:** Compromises on the simplicity of truth to keep Evaluability and Asymmetry in tension.

  **4. The 'Error Theory' View (Eternalist/Determinist)**
  *   **Stance:** Accepts **Semantic Evaluability** and **Fixity**, but rejects **Temporal Asymmetry**. The past and future are equally real and settled.
  *   **Cost:** It must explain away the feeling of freedom and openness as a systematic illusion. It preserves logic but at the cost of the phenomenology of agency.
  *   **Verdict:** Meets Evaluability, but explicitly denies Asymmetry.

  ### Summary for the Seminar

  If you begin with **Semantic Evaluability** as a hard constraint, you will force your students to confront the cost of saving the logic of prediction. They will see that preserving the idea that "predictions are true or false now" requires either accepting that the future is fixed (Fatalism) or adopting a complex, non-standard logic of truth (Relativism). If they wish to preserve the **Openness of the Future**, they must be prepared to admit that, strictly speaking, our ordinary predictions are semantically defective until the event occurs. This tension provides the engine for your term: every theory is a different way of managing this loss.
