answer: |-
  Here is a principle that accounts for your intuitions, followed by the necessary sacrifice, the prediction for your lingering case, and a test case to refine the boundary.

  ### The Principle: The Triad of Inviolability

  **Invent freely in the silence of the record, unless that silence is guarded by one of three shields:**

  1.  **The Shield of Evidence:** Do not contradict explicit documentation (diaries, logs, verified whereabouts).
  2.  **The Shield of Grief:** Do not invent private degradations where living memory (family, partisans, close contemporaries) remains vulnerable.
  3.  **The Shield of Legacy:** Do not invert a figure's defining *moral* contribution to history.

  **The Exception:** The Shield of Legacy protects *moral* standing, not *aesthetic* or *intellectual* standing. You may invert a reputation for talent or genius if it serves a thematic truth about art, but you may not invert a reputation for virtue or vice if it corrupts the historical record of human struggle.

  ### Analysis of Your Verdicts

  This principle fits six of your seven verdicts perfectly:
  *   **Diplomats (Fine):** No Evidence, No Grief, No Legacy.
  *   **Diary (Not Fine):** Violates **Evidence**.
  *   **Politician, 10 years (Not Fine):** Violates **Grief**.
  *   **Politician, 200 years (Fine):** No Grief.
  *   **Abolitionist (Not Fine):** Violates **Legacy** (Moral Inversion).
  *   **Motive (Fine):** Silence is unguarded; the act remains true.

  **The Verdict to Surrender (or Defend):**
  The outlier is the **Composer**. Under a strict reading of "Legacy," inverting a celebrated man into a talentless schemer should be forbidden. However, your principle survives if you maintain the **Moral/Aesthetic Distinction**. If you are unwilling to defend that distinction—if you feel that tarnishing a reputation is inherently wrong regardless of category—you must surrender the **Composer** verdict. If you hold the line, the Composer case becomes the unique exception where *Artistic Truth* is permitted to override *Biographical Truth*, provided the subject is being used as a vessel for a universal theme (Genius) rather than a specific historical argument.

  ### Prediction for the Lingering Case

  **Case:** *A real writer who died a few years ago into a comic novel as a minor character, doing something mildly absurd he plainly never did.*

  **Verdict:** **Not Fine.**

  **Reasoning:** This violates the **Shield of Grief**. "A few years ago" implies living colleagues, friends, and readers who hold the memory of the person's dignity. While the act is "mildly absurd" (avoiding the Shield of Legacy) and "comic" (avoiding malice), the proximity of death makes the silence sacred. The writer owes a period of mourning to the recent dead that they do not owe to the long-dead. The lack of a living plaintiff is a legal standard, not an ethical one; the ethical constraint is the *existence* of the grief, not the *litigation* of it.

  ### The Test Case

  To separate candidates (specifically, to test whether your rule is about *Harm to the Living* or *Integrity of History*), consider this scenario:

  **The Case of the Virtuous Tyrant:**
  *A dictator responsible for thousands of deaths, dead for two hundred years with no living partisans or descendants. The historical record is silent on his private life. You invent a scene where he secretly weeps over the suffering he causes, showing deep remorse.*

  *   **If your principle is primarily about Grief/Harm:** This is **Fine**. No one is alive to be hurt; the record is silent.
  *   **If your principle is primarily about Legacy/Truth:** This is **Not Fine**. You are whitewashing a moral monster, inverting the historical lesson his life provides.

  **Why this separates the candidates:**
  Your verdict on the **Abolitionist** ("I cannot see who alive is harmed") suggests you lean toward *Integrity of History*. If you also vote **Not Fine** on the Virtuous Tyrant, your rule is confirmed as **The Triad of Inviolability** (specifically the Shield of Legacy). If you vote **Fine** on the Tyrant, your rule is actually **The Principle of Living Consequence**, and you must surrender the Abolitionist verdict (admitting that if no one is harmed, the invention is permissible).
