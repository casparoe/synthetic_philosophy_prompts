answer: |-
  First off: this is not a weird question at all. It is one of the central headaches in social ontology, and you have put your finger on exactly the tension that makes the literature so difficult.

  Your friend is partially right, but your intuition is also valuable. You aren't "backwards," but you might be mixing up two different philosophical projects that often get lumped together under "collective intentionality."

  Here is the breakdown of what irreducibility means, where the intention "lives," and how to save your paper on corporate responsibility.

  ### 1. What "Irreducibility" Actually Means
  When Searle or Bratman say "We-intentions are irreducible to I-intentions," they are making a logical point, not a metaphysical one about ghosts.

  *   **The Reductionist View:** "We intend to play a duet" is just shorthand for: "I intend to play my part + I believe you intend to play your part + I know you believe I intend..." (and so on).
  *   **The Irreducibility View:** No amount of "I-intend" plus "I-believe-you-intend" adds up to "We-intend." The "We-mode" is a primitive psychological state.

  **Crucially:** For Searle and Bratman, this does **not** mean the intention floats in the air. Searle is famously adamant: **There is no group mind.** The collective intention exists *in the heads of the individuals*, but it exists there *as* a collective intention.

  So, if you walk into the boardroom, you won't find a "Board Mind" hovering over the table. You will find 7 individual brains. But in the brains of the 4 majority voters, there is an intention of the form *"We (the Board) are closing the plant,"* not just *"I am voting to close the plant."*

  ### 2. Your Board Example: The "None of the Members" Claim
  This is where your friend pushed back, and here is the nuance you need for your paper.

  **Scenario:** The Board votes 4-3 to close the plant.
  **Your Claim:** "The Company intends to close the plant, but no individual intends it (they all see it as a compromise)."

  **The Problem:** In the Searle/Bratman framework, for the group to intend $X$, at least the participating members must intend "We do $X$."
  However, **intending** something is not the same as **wanting** something.
  *   The 4 directors might *prefer* the plant stay open.
  *   But they *intend* for the Board to close it (because they voted for it).
  *   If they truly did not intend the closure (e.g., they voted "Yes" as a joke, or under immediate physical duress), then Searle would say the Board *did not* collectively intend it. It was just a causal event.

  **So, is your claim wrong?**
  If you mean "No one *wants* the outcome," you are safe.
  If you mean "No one *intends* the outcome even as a collective act," Searle/Bratman would say the group intention doesn't exist.

  **However,** there is a different camp that supports your stronger claim: **Group Agency (List & Pettit).**
  Philosophers like Christian List and Philip Pettit argue that organized groups (like corporations) can have beliefs and intentions that are **distinct from all of their members.**
  *   *Example:* A committee might logically be committed to Proposition C because they voted for A and B (which imply C), even if every single member rejects C.
  *   This fits your Board example better. The *procedure* generates the intention. The intention "lives" in the **structure** of the organization, not just in the heads.

  ### 3. Where Does the Intention Live?
  If there is no group mind, where is the intention?

  Think of it like software.
  *   **The Hardware:** The individual brains of the directors.
  *   **The Software:** The corporate rules, voting procedures, and roles.

  You cannot find the "program" by looking at a single transistor (individual neuron) or even a single chip (individual brain). The program exists in the **organization of the hardware.**

  For corporate responsibility, this is the gold mine. The intention lives in the **Corporate Internal Decision (CID) Structure** (a term by Peter French).
  *   When the Board votes, the CID structure transforms individual inputs (votes) into a corporate output (decision).
  *   The intention is real, but it is **structurally realized.**

  ### 4. How This Saves Your Paper on Corporate Responsibility
  You are not mixing up debates; you are standing at the intersection of two very useful ones. Here is how to frame it so your friend can't object:

  **A. Distinguish "Shared Agency" from "Group Agency"**
  *   **Shared Agency (Searle/Bratman):** Focuses on people doing things together (painting a house, singing a duet). Requires individuals to hold the "We-intention."
  *   **Group Agency (List/Pettit/French):** Focuses on organizations that act as single units. The organization can intend things no specific member intends because the *system* processes the inputs.

  **B. The "Problem of Many Hands"**
  This is the ethical payoff. In complex corporations, bad outcomes happen, but no single person intended the bad outcome (everyone just did their small part).
  *   **If you rely only on individual intention:** The corporation is innocent. (This is bad for ethics).
  *   **If you rely on irreducible group intention:** The corporation itself is the moral agent. It intended the outcome via its structure, even if the individuals were just "following procedure."

  **C. Revised Claim for Your Paper**
  Instead of saying: *"Searle proves groups intend things no member intends."*
  Say: *"While Searle argues collective intentionality is rooted in individual minds, theorists of Group Agency (like List, Pettit, and French) demonstrate that corporate decision structures can generate intentions that are not held by any single member. This irreducibility allows us to ascribe moral responsibility to the corporation itself, bypassing the 'Problem of Many Hands'."*

  ### Summary Checklist for You
  1.  **Don't say "Group Mind."** Say "Structurally Realized Intentionality."
  2.  **Acknowledge the distinction.** Searle/Bratman = Shared Intention (needs individuals to hold the 'We'). List/Pettit/French = Group Agency (the system can hold attitudes distinct from individuals).
  3.  **Your Board Example:** It works best under the **Group Agency** model. The 4 voters intend to *follow the procedure*, the procedure generates the *closure decision*. The "intention to close" belongs to the Board *qua* institution.
  4.  **Ethical Payoff:** This allows you to punish the corporation (fines, dissolution) without needing to prove a specific villain, while still holding individuals accountable for their role in the structure.

  You haven't ruined your paper. You've just identified the exact hinge point where the philosophy gets interesting. Pivot slightly to include the "Group Agency" literature, and you'll be on very solid ground.
