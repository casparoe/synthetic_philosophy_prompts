  **Position:** Junior Acquisitions Officer (Transmission Verification)
  **Department:** Collections and Infectious Feeling
  **Reports To:** Director of Sincerity Audits
  **Status:** Full-Time, Probationary

  **Organizational Overview**
  The Museum of Universal Feeling operates under a strict statutory mandate regarding the definition of art. We do not collect objects based on aesthetic beauty, technical difficulty, or historical novelty. We collect only those works wherein the artist has successfully transmitted to the viewer a feeling they have personally experienced. Our mission is to unite humanity through shared emotional infection. Works that aim merely to divert, imitate, or produce an effect are classified as Counterfeit and are ineligible for display.

  **Key Responsibilities**
  The Junior Acquisitions Officer will manage the intake and grading of potential acquisitions based on the Three Conditions of Transmission: Individuality, Clarity, and Sincerity.

  1.  **Panel Coordination:** You will oversee the Lay Certification Panel. This body consists of randomly selected citizens from various socioeconomic backgrounds. Their sole function is to view proposed works and submit written reports on what they felt. If the Panel's reported feeling does not match the artist's stated intention, the work is deemed obscure. Please note: Obscurity is recorded as a defect of transmission on the part of the artist, not a lack of education on the part of the viewer.
  2.  **Metric Analysis:** You will monitor transmission rates across all media. Recent audits indicate our current radio advertising jingle achieves a 98% infection rate regarding "civic duty," outscoring the entire Post-Impressionist wing. You will be responsible for reallocating exhibition space to accommodate higher-performing media, including commercial graphics and folk religious prints.
  3.  **Storage Management:** You will maintain the security logs for the West Wing Storerooms. These facilities house sealed collections (including works by Wagner and Beethoven) deemed to transmit exclusive, aristocratic feelings. Under no circumstances are these boxes to be opened for public viewing.
  4.  **Donor Relations:** You will draft correspondence regarding restricted gifts. A recent bequest of Victorian portraiture comes with a visibility clause. As these works prioritize individual likeness over universal brotherhood, you will prepare the rejection documentation citing "Partisan Sentiment."

  **Requirements**
  *   **Assessment of Sincerity:** The officer must be able to determine the sincerity of the artist. Please note: Human Resources cannot test for this competency during the interview process, nor can it be taught during orientation. Applicants must possess this ability prior to arrival. If you claim you can measure sincerity, you are disqualified.
  *   **Emotional Hierarchy:** Candidates must demonstrate a commitment to ranking feelings that unite people above those that divide. Simple, everyday feelings accessible to all persons are ranked above complex, partisan, or erotic feelings.
  *   **Aesthetic Neutrality:** Proficiency in art history is acceptable only if the candidate can disregard concepts of beauty and craft. If you find yourself praising a brushstroke rather than the infection received, you will not succeed in this role.

  **Benefits**
  *   Comprehensive health and dental coverage.
  *   Access to the staff cafeteria, which serves simple, nutritious meals consistent with our valuation of everyday life.
  *   Professional development opportunities in the field of ethical transmission.

  **To Apply**
  Submit a cover letter describing a feeling you have experienced and wish to transmit. Do not attempt to make it beautiful. Do not attempt to make it clever. If we feel what you felt, we will contact you. If we are confused, or if we feel nothing, you have failed the first assessment.

  *The Museum of Universal Feeling is an equal-opportunity employer. We do not discriminate based on race, gender, or capacity for empathy.*
