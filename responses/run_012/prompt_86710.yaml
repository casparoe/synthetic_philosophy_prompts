      *   *Refining the Psychologist's view on Crux 2:* The psychologist shouldn't say "stories are lies." They should say "stories create an *illusion* of understanding that exceeds actual predictive power."

  7.  **Final Review:** Does this sound like a document that ends a months-long argument? It sounds like a truce that defines the battlefield rather than ending the war. That fits "adversarial collaboration."

