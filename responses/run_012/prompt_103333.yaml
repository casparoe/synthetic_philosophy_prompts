answer: |-
  You have identified a genuine and distinct failure mode of collective ownership. You are correct to sense that the standard labels do not quite fit. The **Tragedy of the Commons** (Hardin, 1968) describes resource depletion through *rivalrous overuse*. The **Tragedy of the Anticommons** (Heller, 1998) describes resource underuse through *fragmented exclusion rights* (too many owners with veto power).

  Your situation is neither. You have a *unified* right of access (no veto power) but a *fragmented* sense of legitimacy regarding *usage*.

  There is no single, universally canonical term for this specific sociological phenomenon in the way "Tragedy of the Commons" is canonical. However, it is discussed across economics, sociology, and organizational theory under overlapping descriptions. Below, I carve the phenomenon at its joints, distinguish it from its cousins, audit your examples, and mark the contested ground.

  ### 1. Naming the Phenomenon

  If you require an established economic term, the closest fit is the **Normative Anticommons**.
  *   **The Standard Anticommons:** Legal/structural. Owner A can block Owner B. Result: Gridlock.
  *   **The Normative Anticommons:** Social/psychological. Person A *feels* they can block Person B (or that Person B has a superior claim), even though no such right exists. Result: Gridlock.

  However, because "Anticommons" is heavily laden with property law connotations (rights to exclude), using it may confuse your cooperative members.

  If you are willing to coin a term that precisely captures the mechanism you described, the most accurate label is **The Tragedy of Mutual Deference**.
  *   **Boundaries:** This term covers situations where a shared resource decays not because actors are competing to consume it, but because they are competing to *yield* it.
  *   **Distinction:** Unlike the *Tragedy of the Commons* (where individual rationality leads to collective ruin via greed), this is a case where individual *virtue* (restraint, politeness, fairness) leads to collective ruin via neglect.

  ### 2. The Mechanism: Deference vs. Uncertainty

  You asked whether the active ingredient is deference itself or uncertainty about expectations. This is where the literature splits.

  **View A: The Sociological/Normative Account (It is Deference)**
  Scholars in this camp argue that social norms of fairness can become pathological. In a tight-knit group, "being a good member" is defined by not imposing on others.
  *   **Mechanism:** Hyper-cooperation. Each member internalizes the group's welfare so strongly that they suppress their own demand to avoid perceived selfishness.
  *   **The Failure:** The norm of "fair share" is misinterpreted as "minimum share."
  *   **Verdict:** If your members *want* to use the van but suppress the desire because they feel it would be rude, this is **Deference**.

  **View B: The Game-Theoretic/Informational Account (It is Uncertainty)**
  Economists and game theorists often argue that what looks like deference is actually a **Coordination Failure** driven by incomplete information.
  *   **Mechanism:** Pluralistic Ignorance. I don't use the van because I believe *you* need it more. You don't use the van because you believe *I* need it more. Neither of us actually needs it more; we just lack the signal to confirm that usage is permissible.
  *   **The Failure:** Lack of a *Focal Point* (Schelling, 1960). There is no clear rule (e.g., "Tuesdays are for the Van") to coordinate around.
  *   **Verdict:** If your members would use the van immediately if they knew for a fact no one else wanted it, this is **Uncertainty**.

  **The Contested Ground:**
  *   **Settled:** Both mechanisms lead to the same outcome (underuse decay).
  *   **Contested:** The remedy. If it is **Deference**, the fix is cultural (explicitly granting permission, celebrating usage). If it is **Uncertainty**, the fix is structural (scheduling systems, sign-out logs).
  *   **My Assessment:** In housing cooperatives, it is usually a hybrid. Uncertainty creates the vacuum, and norms of deference prevent anyone from breaking the silence.

  ### 3. Auditing Your Four Examples

  Not all your examples are identical. Some are pure Mutual Deference; others are masked logistical problems.

  **1. The Van (Battery dies from disuse)**
  *   **Classification:** **Pure Tragedy of Mutual Deference.**
  *   **Reasoning:** A vehicle mechanically requires use to maintain function. The "cost" of using it is social (appearing selfish), not material (fuel/wear). The benefit is private (transport) and public (battery health).
  *   **Why it fits:** The decay is directly caused by the restraint. If one person acted "selfishly," the group would benefit. This is the inverse of the standard Commons tragedy.

  **2. The Common Room (Sits empty)**
  *   **Classification:** **Coordination Failure (Uncertainty).**
  *   **Reasoning:** A room does not decay from disuse in the same way a battery does. The problem here is likely the lack of a scheduling mechanism. Members aren't necessarily deferring; they simply don't know if the room is "taken" or if booking it is "allowed."
  *   **Nuance:** If members *want* to host events but fear "imposing," it shifts to Deference. If they simply don't know *how* to book it, it is Uncertainty.
  *   **Verdict:** Likely mostly Uncertainty. A calendar solves this faster than a cultural shift.

  **3. The Kitchen Knives (Go dull)**
  *   **Classification:** **Diffusion of Responsibility (Bystander Effect).**
  *   **Reasoning:** This is slightly different. Using a knife doesn't keep it sharp; *sharpening* it does. If the knives are dull because no one uses them, it's Deference. If they are dull because no one *sharpens* them, it is the **Free-Rider Problem** in reverse (sometimes called the **Volunteer's Dilemma**).
  *   **Distinction:** Everyone hopes someone else will maintain the tool.
  *   **Verdict:** If the blades are dull from *lack of use*, it is Mutual Deference. If they are dull from *lack of maintenance*, it is a maintenance coordination failure. You described them going dull because no one uses them; therefore, it fits **Mutual Deference**.

  **4. The Workshop Tools (Rust from disuse)**
  *   **Classification:** **Tragedy of Mutual Deference.**
  *   **Reasoning:** Similar to the van. Tools often seize or rust if not moved/oiled. The assumption "someone else has a more pressing project" is a classic deference heuristic.
  *   **Why it fits:** It relies on the false belief that there is a hierarchy of need that everyone else knows but you don't.

  ### 4. Distinguishing from "Ordinary Things in Costume"

  You asked to separate this from procrastination or free-riding. Here is the litmus test:

  *   **Vs. Procrastination:** If a member lived alone, would they use the van?
      *   *Yes:* Then it is not procrastination; it is a group dynamic.
      *   *No:* Then it is individual sloth, and the group is a scapegoat.
  *   **Vs. Free-Riding:** Free-riding is enjoying the resource without contributing to its maintenance.
      *   *Your Case:* No one is enjoying the resource. This is **Under-consumption**, not Free-riding.
  *   **Vs. The Anticommons:**
      *   *Anticommons:* I have a legal right to stop you.
      *   *Your Case:* I have a *social hesitation* that feels like a right.
      *   *Test:* If you passed a rule tomorrow saying "You must use the van once a week," would anyone object?
          *   If *Yes* (they feel their rights are violated): It is an Anticommons.
          *   If *No* (they are relieved): It is Mutual Deference.

  ### 5. Where Scholars Disagree

  If you bring this to a group of experts, here is where they will fight:

  **1. Is it Rational?**
  *   **Rational Choice Theorists:** Will argue this is a rational response to high transaction costs. It is "expensive" to ask, "Does anyone mind if I take the van?" So, silence is the efficient equilibrium.
  *   **Behavioral Economists/Sociologists:** Will argue this is irrational. The cost of asking is low; the cost of a dead battery is high. The behavior is driven by social anxiety, not rational calculation.

  **2. Is the Solution Rules or Norms?**
  *   **Institutionalists (Ostrom followers):** Will argue you need clear *rules* (e.g., "The van must be driven every Sunday"). They believe norms are too fragile.
  *   **Communitarians:** Will argue rules destroy the cooperative spirit. They believe the fix is *normative* (e.g., "We celebrate the person who takes the van"). They believe rules cement the idea that usage is a burden.

  **3. Is it a "Tragedy"?**
  *   **Some Economists:** Reserve "Tragedy" for irreversible depletion. If the van battery can be jumped, is it a tragedy? They might call this **Inefficiency** rather than Tragedy.
  *   **Sociologists:** Argue that social capital depletion (trust, willingness to act) *is* the tragedy, even if the physical asset is recoverable.

  ### Summary Recommendation

  For your cooperative, I recommend using the term **The Tragedy of Mutual Deference**.

  It is precise enough to distinguish your situation from the "Tragedy of the Commons" (which everyone knows) and the "Anticommons" (which implies legal fighting). It correctly identifies the active ingredient: **virtuous restraint becoming collectively vicious.**

  **To fix it:**
  1.  **If it is Uncertainty:** Create a "Focal Point." Put a whiteboard on the van: *"Who is driving me this week?"* Make usage visible and expected.
  2.  **If it is Deference:** Change the norm. Explicitly frame *usage* as *maintenance*. "Using the van is a chore we share," not "A privilege we fight over."

  You are not dealing with a resource management problem; you are dealing with a **politeness trap**. The resource isn't the van; the resource is the permission to be selfish for the common good.
