prompt: |-
  You are an expert in information ethics and the philosophy of privacy, and I would like you to work carefully and self-critically rather than reaching for the standard summary of the surveillance debate. I have no academic training in this area; I have simply been reading and arguing about it on my own, and I have got stuck on one particular move that people keep making.

  The move is this. Whenever the bulk collection of communications metadata comes up — the who-called-whom, the times, the durations, the addresses of the sites visited, everything that surrounds a message rather than its contents — someone will say that it is like a postal worker reading the outside of an envelope. The address, the postmark, the bare fact that a letter was sent at all: all of that is on the outside, exposed to view, and nobody supposes the postman has violated your privacy merely by handling it. So, the argument runs, an internet service provider or a security agency that records metadata but never reads the contents is doing something of the same kind, and the alarm about it is overblown. Sometimes the analogy is strengthened: the postal worker looks at the outside of every letter, not merely yours, and looking at all of them at once is still only looking at the outside.

  I want an audit of this analogy rather than a verdict on mass surveillance in general. Please set out the correspondence explicitly — what plays the role of the envelope, the address, the letter, the postal worker, the sorting office, and the person who reads the outside of every envelope at once — and then tell me where the mapping breaks down. I am particularly interested in which of the disanalogies actually matter for the work the analogy is being asked to do, and which are merely decorative. What does the analogy quietly import that the digital case may not have: for instance, an assumption about what counts as the outside of a message, or about how much can be inferred from the outside once it is collected in bulk and combined, or about who is doing the looking and with what motive? Does the conclusion it is used to support — that metadata collection is a minor, barely privacy-relevant act — survive once the disanalogies are on the table, or was the analogy carrying that conclusion all along? If there is a better analogy for what metadata collection is like, give me one, and say what it gets right that the envelope does not.

  Please begin by brainstorming the possible points of correspondence before you commit to an assessment, and be explicit about your confidence at each step. Most importantly, tell me what would change your mind: which consideration, if it turned out to be true, would lead you to a different verdict, and where in your own reasoning you think you are most likely to be wrong.
