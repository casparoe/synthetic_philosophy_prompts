      *   *Mind Change:* If it turns out that metadata *cannot* reveal sensitive info even in bulk (empirically false, but hypothetically), the analogy holds. If the "postal worker" actually *did* log every envelope exterior permanently, the analogy would hold.

  9.  **Drafting the Response (incorporating all constraints):**
