answer: |-
  Master, Fellows, guests, and those brave enough to date an economist.

  It is a privilege to stand here, eighty years on from the death of John Maynard Keynes. For half this room, he is the patron saint of macroeconomics. For the other half, he is the reason your partner talks about aggregate demand over pudding. But tonight, I want to ignore the models. I want to talk about the man, and specifically, about the trouble he thought we'd be in by now.

  In 1930, as the world tipped into depression, Keynes wrote something remarkably optimistic. He looked ahead a hundred years—to us—and predicted that the technological progress would solve what he called the economic problem. Scarcity would be beaten. We wouldn't need to toil to survive. He guessed we'd be working fifteen hours a week.

  Now, for the economists here, you know the math didn't quite land. We are richer than his wildest dreams, yet we are working more, not less. We check emails at the dinner table. We wear burnout as a badge of honour.

  But it was his worry about this success that interests me. He wasn't worried we'd starve. He was worried we'd be bored. He argued that for centuries, humanity had been trained to strive, to scratch out a living, to overcome scarcity. We were bred for purpose. He feared that if you handed us leisure on a plate, we wouldn't know what to do with it. He wondered if we'd suffer nervous breakdowns from having nothing necessary to do.

  Look around. He wasn't wrong. We have solved the economic problem, mostly. Yet we have turned work into a religion. We treat leisure not as the point of existence, but as a reward for exhaustion. We have made a disaster of the good life by convincing ourselves that busyness is virtue.

  But there is a second layer to this, one that Keynes himself uncovered later in life. In his early days here in Cambridge, he was influenced by the philosopher G. E. Moore. They believed that only states of mind mattered. Love, beauty, contemplation. The consequences of actions were secondary to the quality of your own consciousness. It was a beautiful, insulated way to live.

  But decades later, writing a memoir, Keynes turned on those early beliefs. He admitted they were too clean. He realised he had left out the irrational, the messy, practical business of action. You cannot live in a tower of pure contemplation. Life requires getting your hands dirty. It requires engaging with the world, not just admiring it.

  So, here is the tension I want to leave you with.

  On one hand, Keynes predicted we would work less and enjoy leisure, but feared we lacked the capacity to enjoy it. On the other, he admitted that a life of pure contemplation was insufficient, that we need action and engagement.

  We seem to have got the worst of both worlds. We have kept the striving—the work ethic designed for scarcity—even though we are wealthy. But we have lost the engagement. We don't work to build something meaningful; we work to optimize metrics. And when we stop working, we don't contemplate beauty; we scroll through phones. We have neither the leisure nor the purpose.

  We have quantified the good life until there is no life left in it. We treat time as a resource to be managed rather than an experience to be had. Keynes wanted us to solve the economic problem so we could return to being human. Instead, we turned economics into a identity.

  I am not suggesting we all quit our jobs to paint watercolours. Keynes would have hated that; he knew action mattered. But I am suggesting we stop pretending that overwork is noble. It is not. It is a failure of imagination.

  So, as we finish this wine, I propose we take a small risk. Let us not optimize this evening. Let us not network. Let us not discuss the inflation targets for the next quarter. Let us just sit. Let us be useless for a few hours.

  Keynes warned us that the hardest thing is to live wisely and agreeably. We have mastered the living wisely part, or at least the profitable part. The agreeable part is still waiting.

  To Keynes. And to the leisure we are too afraid to take.
