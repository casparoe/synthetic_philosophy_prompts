answer: |-
  **Exam Question**

  Consider the following case: A woman is hiding a refugee in her apartment when an official knocks and asks whether anyone else is inside. She can protect him by saying "No" (a flat falsehood) or by saying something literally true but designed to make him conclude the place is empty (e.g., "I just returned from visiting my sister; the apartment has been quiet"). Suppose in both cases the official leaves, no one is harmed, and she would have told the truth if the refugee were not there. Using Augustine's *De Mendacio* and *Contra Mendacium*, analyze whether his framework marks a moral difference between these two answers. Does his absolutism survive when consequences are neutralized? Where does the moral weight of the prohibition lie?

  ***

  **Model Answer**

  Augustine's ethics of speech, primarily articulated in *De Mendacio* and *Contra Mendacium*, define a lie not merely by factual falsity but by the conjunction of false signification and the will to deceive (*voluntas fallendi*). For Augustine, language is a divine gift intended to communicate thoughts, not to conceal them. In the refugee scenario, Option A (the flat falsehood) clearly meets this criterion: the woman signifies what she believes false with intent to deceive. Augustine categorizes this as a sin, regardless of the beneficent outcome. The moral injury is not located in the official's misunderstanding or the potential harm to the refugee, but in the speaker's disordered soul, which prioritizes temporal safety over fidelity to God, who is Truth itself. To lie is to misuse a God-given faculty, creating a rupture in the liar's own integrity and mirroring the devil, who is the father of lies.

  Option B (the misleading truth) presents a sharper test for students of Augustine. While the signification is technically true, Augustine's framework focuses relentlessly on the intent. If the woman's purpose is to induce a false belief in the official, she retains the *voluntas fallendi*. Augustine argues that using truth to deceive is still a form of lying because the communicative intent is corrupt. He distinguishes between silently withholding truth (which may be permissible in some contexts) and actively leading another into error through speech (which is not). Therefore, his framework likely does not exonerate Option B, as the internal orientation remains deceptive. The literal truth of the words matters less than the truth of the heart. The distinction between A and B is negligible because the moral object is the deceptive will, not the syntactic accuracy. Both acts share the same sinful root: the preference for human judgment over divine command.

  The neutralization of consequences—the official leaving without harm—is morally irrelevant to Augustine's deontological structure. He explicitly rejects consequentialist justifications, such as saving a life, because the sin of lying damages the liar's relationship with God and undermines the social trust required for language to function. The "weight" of the prohibition lies in the violation of a divine duty, not in earthly harm. To lie is to turn away from the Eternal Truth toward a mutable good. Thus, both options constitute sins, though perhaps of differing gravity (officious vs. malicious), neither is morally licit. The harm is ontological, affecting the liar's standing before God, rather than physiological harm to the pursued. Augustine worries that if we allow lies for good ends, we lose the ability to distinguish truth from falsehood entirely, collapsing the medium of salvation. The soul becomes habituated to falsehood, making conversion impossible.

  I am highly confident (90%) that Augustine prioritizes intent over factual falsity and rejects consequentialist exemptions based on his repeated condemnations of officious lies in *De Mendacio*. He is consistent that no lie is venial enough to be committed for another's safety. However, I am least sure about the precise boundary Augustine draws between permissible withholding of information and impermissible ambiguous speech, as his texts occasionally shift on whether technical truthfulness suffices if the deceptive intent remains palpable, leaving room for scholarly debate on whether Option B escapes the strictest definition of *mendacium* or merely constitutes a lesser grade of sin. This ambiguity remains the most contested area in contemporary Augustinian scholarship.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Point | Criteria | Marks | Common Student Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Definition of Lying:** Correctly identifies Augustine's definition as requiring both false signification *and* the will to deceive (*voluntas fallendi*). | 4 | Students define lying solely as stating factual falsehoods, ignoring the intent component. |
  | **2** | **Analysis of Option A:** Identifies the flat falsehood as a clear sin under Augustine's framework regardless of the good outcome. | 4 | Students argue Option A is permissible because saving a life outweighs the lie (consequentialism). |
  | **3** | **Analysis of Option B:** Argues that Option B is likely also condemned because the *intent to deceive* remains, even if words are technically true. | 4 | Students claim Option B is automatically moral simply because the statement is literally true. |
  | **4** | **Role of Consequences:** Explains that neutralized consequences (no harm) do not cleanse the act; Augustine is deontological regarding truth. | 4 | Students assume Augustine cares about the outcome (harm to refugee) rather than the act itself. |
  | **5** | **Theological Weight:** Locates the moral weight in the duty to God/Truth and harm to the liar's soul, not social harm or physical safety. | 4 | Students locate the wrongness in societal trust issues alone, missing the theological orientation toward God. |
