answer: |-
  You are correct to suspect that the claim of unique rationality hinges entirely on shifting the framework from ensemble expectations to time-average growth rates in non-ergodic processes, rather than on any inherent superiority of the logarithmic utility function within standard expected-utility theory.

  Within the von Neumann-Morgenstern framework, rationality is defined merely as consistency with a set of axioms, meaning any concave utility function, such as the square root of wealth, is perfectly admissible if it accurately reflects an agent's risk preferences. The assertion that Kelly is uniquely rational arises only when one abandons the ensemble interpretation of probability, where expectations are averaged across parallel hypothetical realities, in favour of a time-average interpretation applicable to a single trajectory through history. In multiplicative processes, the system is non-ergodic: the ensemble expected value of wealth is dominated by exponentially rare outcomes in the upper tail, whereas the wealth actually experienced by an agent over time converges to the geometric mean. By the Law of Large Numbers, the time-average growth rate of wealth converges almost surely to the expected value of the logarithm of the growth factor, so maximising expected log-wealth is mathematically equivalent to maximising the long-run growth rate of a single realised path. Proponents argue that because we inhabit a single timeline rather than an ensemble of universes, the time-average growth rate is the only physically measurable quantity relevant to survival and long-term accumulation. Consequently, betting more than Kelly leads to almost sure ruin, as the time-average growth rate becomes negative, while betting less yields suboptimal growth, rendering Kelly 'unique' only if one accepts the normative premise that maximising long-run time-average growth is the sole objective of rational action. Ultimately, the criterion is not a universal law of decision theory but an optimality condition for a specific class of stochastic processes where survival and compounding are paramount.
