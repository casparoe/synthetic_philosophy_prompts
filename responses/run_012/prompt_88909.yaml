          *   Yes and No.
          *   Dworkin takes Fuller's side (law includes moral principles) but rejects Fuller's procedure (Inner Morality) for Interpretivism (Law as Integrity).
          *   Positivists (Raz, Coleman) refined Hart. Soft Positivism (Incorporationism) admits morality *can* be part of law if the Rule of Recognition says so, but denies it *must* be.
          *   The "Live" debate is often about the *normative force* of law. Why does law claim authority? (Raz vs. Dworkin).

      *   **Q4: What counts as progress?**
          *   Not empirical evidence (you can't measure "legality" with a ruler).
