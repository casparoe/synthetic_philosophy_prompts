      *   *Assessment:* This is actually a very sophisticated reading, closer to the modern "Methodological" interpretation (like Julie Dickson or even Leiter) than the standard 1L summary. It's not "dumb." It captures the *methodological* divergence.
      *   *Nuance:* However, it's not *just* about purpose. It's also about the *nature* of social practices. Hart thinks law is a social fact (Rule of Recognition). Fuller thinks law is a purposive enterprise (Subjecting human conduct to rules).

  3.  **Address the Core Questions:**

      *   **Q1: What kind of disagreement is it?**
          *   It's not merely verbal. It's not merely empirical.
          *   It is a **methodological and functional disagreement about the point of jurisprudence.**
          *   Hart: Analytical/Descriptive. Law is a social phenomenon. To understand it, we must separate what it *is* from what it *ought to be*.
          *   Fuller: Functional/Teleological. Law is a craft/activity. To understand it, you must understand its *purpose* (fidelity to law).
          *   *Key Insight:* They are talking past each other because Hart is looking at law from the *outside* (sociologist/observer) while Fuller is looking from the *inside* (participant/craftsman).

      *   **Q2: The "Necessary Connection" and "Inner Morality".**
          *   Hart: No *conceptual* necessity. You can have a legal system that is wicked. (Empirical claim: Nazi Germany had laws).
          *   Fuller: There is a *functional* necessity. If you violate the inner morality (generality, publicity, non-retroactivity, etc.) too much, you don't just have *bad* law, you fail to make law at all. It's like a carpenter making a table that collapses.
          *   *Is it empirical or conceptual?* It's conceptual *grounded* in function. If the function of law is to guide conduct, and retroactive rules cannot guide conduct, then a system of pure retroactivity is conceptually not law. It's a "conceptual truth about a functional kind."
          *   *Does it make wicked regimes impossible?* No. Fuller admits wicked regimes exist. His claim is that they degrade *as law* the more they violate the inner morality. It's a matter of degree. Hart wins on the binary "Is it law? Yes/No." Fuller argues it's a spectrum of "legality."

