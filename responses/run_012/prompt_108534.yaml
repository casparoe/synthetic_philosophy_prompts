      *   *Integration:* Ensure the five claims are woven in, not just listed.
      *   *Specific Focus:* Make sure to answer the specific prompts about "cheating" and Groeteschele.

      *(Self-Correction during drafting)*: I need to be careful not to just summarize the plot. The user knows the plot. I need to focus on the *argument*.
      *   *Claim 5 vs 2:* I need to be decisive. Is it hostage logic? Hostage logic is "I hold something of yours." This is "I hold something of mine." It's self-sacrifice to prove benign intent. It's distinct.
      *   *Groeteschele:* Don't dismiss him too easily. His point is that if war starts, you must win. The film says if war starts, everyone loses, so prevent it even by suicide.
      *   *The "Cheat":* The technical glitch. If the computer didn't fail, no movie. But the *response* to the failure is the doctrinal critique. The film argues the system *cannot* tolerate error.
      *   *Humanism:* Does it soften? It makes the cost real. Abstract paradoxes don't bleed. The film forces the audience to feel the weight of the "solution."

  5.  **Drafting the Content (Mental or Scratchpad):**
