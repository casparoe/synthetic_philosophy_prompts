          *   **Dennett's View:** "Swarm of parallel processes" (Multiple Drafts) is correct. "Finished draft" is misleading. There is no *final* draft. It's drafts all the way down. "Broadcasting" (Global Workspace Theory adjacent) is roughly right (fame in the brain).
