  MEMORANDUM

  **TO:** All Staff
  **FROM:** Gareth Vane, Director of Literal Communication
  **SUBJECT:** Mandatory Elimination of Conversational Implicature

  Effective immediately, the Gricean Cooperative Principle is hereby reclassified as the Cooperative Compliance Code. Henceforth, the Maxims of Quantity, Quality, Relation, and Manner are not presumptions of mutual goodwill but enforceable statutes. We anticipate your cooperation. Previous guidelines are obsolete. This transition is necessary.

  Under the Maxim of Quantity, contributions must be as informative as required, but no more. However, scalar expressions generate unauthorized inferences. Uttering "Some reports are late" standardly implicates "Not all reports are late." This is a violation of literal truth conditions. To remedy this, you must state: "Some reports are late, or possibly all." This ensures no false upper-bound is implied. While this renders the statement informationally weak and practically useless for resource allocation, it is literally safe. Do not say "Many" unless you have counted. "Many" implies "Not all." Say "Many, or all."

  Under the Maxim of Manner, avoid ambiguity and obscurity. The connective "but" implies a contrast that surprises the hearer relative to expectation. This is a flout of Manner now treated as a Quality violation. Do not say, "The project is over budget but on time." Say, "The project is over budget and on time." The loss of contrastive meaning is acceptable; the implicature of unexpectedness is not. We trust this clarifies the issue. If you intend to contrast, you must state the contrast explicitly: "The project is over budget and on time, which is a contrast." This is redundant, but compliant.

  Under the Maxim of Relation, be relevant. Indirect answers generate implicature. If asked, "Is the server down?" responding "The lights are off in the server room" implicates "Yes." This is prohibited. You must answer: "The lights are off in the server room, which is relevant to your query about the server status." This statement is pointless, as it requires the hearer to infer the status anyway, but it avoids the implicature of the indirect answer. Directness is key. We hope you understand.

  We recognize that implicature is theoretically cancelable. To exploit this loophole, employees are advised to append "or not" to any assertion. "The budget is approved, or not." This cancels any commitment to the budget's status. It is better to be canceled than to imply. If you say "I will be there," you implicate "I intend to be there." Append "or not" to remove the intention. "I will be there, or not." This protects the firm from liability regarding attendance.

  **FAQ**

  **Q:** A pragmatics consultant argues this policy destroys the efficiency of language and makes communication impossible.
  **A:** That observation is irrelevant to the Relation Maxim. Efficiency is not a Maxim.

  **Q:** Does this ban sarcasm?
  **A:** Sarcasm involves flouting the Maxim of Quality to imply falsehood. This is now classified as lying. Violations result in termination. We distinguish not between misleading and implying. Both are non-compliant.

  **Q:** Will training be provided?
  **A:** Training is available, or not. Please check the portal. The portal is working, or not.

  **Q:** Can we use metaphors?
  **A:** Metaphors violate Quality. Say "He is angry," not "He is boiling." Boiling is false. He is not water.

  Adherence is expected. Deviations will be noted. Non-compliance is unacceptable.

  Gareth Vane
  Director of Literal Communication
