answer: |-
  Here is a menu of the distinct theses hiding inside the claim "there's no such thing as a neutral default." They range from a trivial observation about logic to a radical claim about human agency.

  ### 1. The Logical Necessity Thesis
  *   **The Claim:** A decision rule *must* exist. You cannot have a system where there is simply "no rule" about what happens if a person says nothing. Either the state takes the organs (opt-out) or it doesn't (opt-in). One of these must be the background condition.
  *   **Status:** **Trivially True.** It is logically impossible to have a legal system without a rule for inaction.
  *   **Does it save your opponent?** **No.** Acknowledging that *a* rule must exist does not prove that *all* rules are morally equivalent. Your objection is likely about the *specific* steering of opt-out, not the mere existence of a rule.
  *   **Proves too much?** No. This is just a statement of administrative reality.

  ### 2. The Empirical Symmetry Thesis
  *   **The Claim:** Human psychology is such that *any* default setting exerts a "stickiness" (status quo bias). Therefore, opt-in steers people toward non-donation just as powerfully as opt-out steers them toward donation. The magnitude of the "nudge" is identical, only the direction differs.
  *   **Status:** **Plausible (but empirically contestable).** Behavioral economics supports the idea that defaults matter, but it does not guarantee they matter *equally* in all contexts. The friction costs of opting in vs. opting out might differ.
  *   **Does it save your opponent?** **Partially.** If true, it neutralizes the claim that opt-out is *unique* in its steering. However, it doesn't address whether steering in the direction of *taking organs* is morally worse than steering toward *keeping them.*
  *   **Proves too much?** No. It admits steering exists but keeps the concept of "nudging" intact.

  ### 3. The Normative Equivalence Thesis
  *   **The Claim:** State inaction is morally equivalent to state action. Choosing an opt-in system is an active choice by the legislature to prioritize bodily integrity over supply; choosing opt-out prioritizes supply over bodily integrity. Both are "interventions" in the state of nature. There is no "laissez-faire" baseline that counts as "respecting autonomy" more than the other.
  *   **Status:** **Plausible (within specific political theories).** This challenges the libertarian assumption that "doing nothing" is the neutral respect for rights. It argues that the legal framework itself is a construct that always allocates entitlements.
  *   **Does it save your opponent?** **Yes, this is the one he needs.** To defeat your objection, he must show that the *moral weight* of the steering is the same in both systems. He needs to argue that "letting people die on the waiting list" (a consequence of opt-in) is a form of state steering/coercion just as much as "taking organs unless refused."
  *   **Proves too much?** Risky. If pushed too hard, it makes it hard to distinguish between a government that protects rights and one that violates them, since both are just "allocating entitlements."

  ### 4. The Metaphysical/Constructionist Thesis (The Strong One)
  *   **The Claim:** There is no "true preference" independent of framing. People do not have a pre-existing wish regarding organ donation that the state is either respecting or violating. Preferences are constructed *by* the choice architecture. Therefore, "autonomy" has no baseline to be measured against. You cannot claim opt-out violates autonomy because there is no "un-steered" autonomous choice to compare it to.
  *   **Status:** **False / Proves Too Much.** This denies the coherence of informed consent entirely. If preferences are entirely constructed by the frame, then coercion, manipulation, and education are all the same thing.
  *   **Does it save your opponent?** **It wins the debate but destroys the game.** If this is true, your objection fails, but so does all policy analysis.
  *   **Proves too much?** **Yes.**
      *   **Nudging vs. Shoving:** If there is no neutral baseline, the difference between a default setting (nudge) and a mandate (shove) collapses. Both just "construct preferences."
      *   **Threats vs. Offers:** If there is no baseline, a gun to the head and a subsidy are just two different frames constructing a choice to hand over a wallet.
      *   **Policy Implication:** If this thesis holds, you cannot criticize *any* policy for being paternalistic, because "paternalism" requires a distinction between the state's will and the individual's will. This thesis erases the individual's will.

  ---

  ### What Your Opponent Needs to Win
  To successfully counter your objection without destroying the concept of policy analysis, your opponent needs **Thesis 3 (Normative Equivalence)** supported by **Thesis 2 (Empirical Symmetry).**

  *   He needs to argue: "Both systems steer (Thesis 2), and neither system is the 'natural' respect for autonomy (Thesis 3). Therefore, objecting to opt-out *because it steers* is inconsistent, unless you also object to opt-in."
  *   **Your Counter:** You can concede there is no neutral default (Thesis 1) while maintaining that some defaults are *more respectful of rights* than others. Even if both steer, opt-in steers toward bodily integrity, while opt-out steers toward bodily usage. The *direction* of the steer matters morally, even if the *fact* of the steer is inevitable.

  ### Where the Claim Breaks (For Seminar Discussion)
  If your opponent retreats to **Thesis 4 (The Strong One)** to defend himself, you can flag that it **proves too much**.

  Ask him: *"If there is no neutral baseline against which to measure interference, is there any difference between a default rule and a criminal mandate? If my preference is constructed by the frame in both cases, why is it worse for the state to shoot me for keeping my organs than to just take them by default?"*

  If he cannot answer that without referencing a baseline of rights or autonomy, he has implicitly admitted that a normative baseline exists, and Thesis 4 is false.
