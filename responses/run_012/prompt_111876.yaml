      *   *Level 2 (Psychological/Behavioral):* Human psychology is susceptible to framing. Status quo bias exists. Therefore, whichever option is the "status quo" gains an advantage.
      *   *Level 3 (Normative/Political):* The state is always acting. Inaction is a policy. There is no "state of nature" baseline in a regulated society.
      *   *Level 4 (Metaphysical/Agency):* There is no "true preference" independent of context. Preferences are constructed, not revealed. Therefore, "interference" is incoherent because there's no un-interfered-with self to compare against.

