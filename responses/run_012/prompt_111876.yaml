prompt: |-
  Somebody in my policy seminar keeps ending arguements with "there's no such thing as a neutral default." Latest one: we were on opt-out organ donation, I said a presumed-consent system has the state steering people's choices and that's my objection, and he said the opt-in system we already have steers them just as much, so there's no neutral baseline, so my objection either proves nothing or proves everything. I want to see exactly what that one-liner could be claiming. Lay out the distinct theses hiding in it, from the fairly obvious one (any way of presenting a choice is a way of presenting it) up to the strong one (there's no fact of the matter about what someone would have chosen with no framing at all, so "interference" and "autonomy" have no baseline to be measured against and the steering-vs-coercion line is empty). For each reading, say whether it's trivial, plausible, or false, and which one he'd need for the move to actually work against me. Also flag any reading that proves too much: if it holds in the strongest sense, is anything left of the difference between nudging and shoving, or between a nudge and a threat? Menu rather than a single verdict, please -- I want to bring the list back to seminar.
