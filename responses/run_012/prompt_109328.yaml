answer: |-
  This is a brilliant bit of reasoning from your mate Dan. It's the sort of sceptical argument that looks watertight in a seminar room but can paralyse you in a community centre. It's also completely understandable why you're feeling stuck; Dan has constructed a dilemma that tries to force you into either moral nihilism or arbitrary dogmatism.

  Since you want to keep premises (1) and (3) — which is sensible, as (1) is empirically sound and (3) is necessary for mediation to have any point — the argument falls apart at **Step (5)**.

  Here is why Step (5) looks plausible, why it is actually wrong, what you have to give up to reject it, and how this relates to the genetic fallacy without just name-dropping it.

  ### The Problem with Step (5)

  **The Step:** *"If two causal stories fit all the evidence, you can't non-arbitrarily call one the bias and the other the preference."*

  **Why it looks fine:**
  It appeals to a very healthy sense of epistemic humility. As a mediator, you aren't a mind-reader. You can't peek into a tenant's brain to see if their objection to a neighbour is caused by a reasoned principle (preference) or a subconscious stereotype (bias). On the surface, both look like "strong feelings." Dan is arguing that because the *internal evidence* feels the same to the person having the thought, and the *external evidence* is ambiguous to you, you have no grounds to distinguish them. It feels fair and non-judgemental.

  **Why it is wrong:**
  Step (5) conflates **epistemic access** (how hard it is to know) with **normative status** (what the thing actually is). Just because two explanations fit the *current* evidence doesn't mean there isn't a fact of the matter, nor does it mean we can't gather *better* evidence.

  In mediation, the "evidence" isn't just the existence of the disposition. The evidence includes how that disposition behaves when subjected to **reflective scrutiny**.
  *   **Preference:** If I ask, "Why do you want the lease to start on the 1st?" and you say, "It aligns better with my pay cycle," that disposition holds up under questioning. It is stable.
  *   **Bias:** If I ask, "Why do you feel unsafe living near students?" and you say, "They're just noisy," and I press, "Do you have evidence of noise, or is that an assumption?" and you retreat to "Well, it's just common sense," the disposition is failing to track the facts. It is brittle.

  Step (5) assumes the evidence is static. It isn't. The distinction between bias and preference emerges *during* the process of reason-giving. Therefore, you *can* non-arbitrarily distinguish them, not by digging into their past (genealogy), but by testing their robustness in the present (function).

  ### The Genetic Fallacy Nuance

  You asked specifically about the genetic fallacy. Usually, the genetic fallacy is dismissing a claim because of its origin (e.g., "You only believe that because you're rich"). Dan's argument is more subtle. He is committing what we might call a **Genealogical Reduction**.

  Dan assumes that for the distinction between 'bias' and 'preference' to be real, it must be grounded in **causal history** (how the disposition got there).
  *   If it came from 'choice' or 'values', it's a preference.
  *   If it came from 'trauma' or 'disgust', it's a bias.

  Because causal histories are messy and mixed (Step 4), he concludes the distinction is bogus (Step 6).

  **The Move:** The fallacy lies in assuming the *definition* of bias is genealogical.
  **The Correction:** In mediation, the definition of bias is **functional**.

  You don't need to know *why* someone holds a view to identify it as a bias. You only need to observe that the view **distorts their processing of information**. If a landlord refuses a tenant because of a protected characteristic, it doesn't matter if that prejudice came from a traumatic event 20 years ago or a newspaper they read yesterday. It matters that the disposition is preventing them from assessing the tenant on relevant merits.

  By rejecting Step (5), you are refusing to accept that causal ambiguity implies functional identity.

  ### What You Have to Give Up

  If you reject Step (5) to save your mediation practice, you have to give up **Causal Certainty**.

  You must accept that you will never know for sure what is going on in someone's head. You cannot say, "I know this is a bias because I know your childhood." Instead, you have to adopt a **procedural** approach. You distinguish bias from preference by how the person engages with the mediation process itself.

  *   **Preferences** are usually open to trade-offs ("I prefer a garden, but I'll take a balcony for a lower rent").
  *   **Biases** often present as non-negotiable moral facts ("People like *that* shouldn't live here").

  You give up the idea that you are an archaeologist digging for the 'true' origin of a belief. You become an engineer testing the load-bearing capacity of that belief.

  ### Practical Advice for Your Training

  Dan's argument leads to Step (8) ("drop the language of bias"), which would make your job impossible. If you can't challenge biases, you can't stop discrimination. Here is how you handle the distinction in the room, keeping (1) and (3) but ignoring Dan's scepticism:

  1.  **Don't Psychoanalyse:** Never tell a party, "That's a bias." That triggers defensiveness and proves Dan's point about circular approval.
  2.  **Test for Tracking:** Instead, ask questions that test whether their judgement is tracking relevant facts. "What specific evidence do you have that this neighbour would be disruptive?" If they can't provide evidence but maintain the judgement, you have identified a bias functionally, even if you don't know the cause.
  3.  **Reframe as Interests:** Mediation theory often distinguishes between 'positions' (rigid demands) and 'interests' (underlying needs). Biases often hide inside rigid positions. Preferences usually sit comfortably within interests.
  4.  **Accept Ambiguity:** Sometimes you won't be able to tell. That's fine. You don't need to label every disposition. You only need to challenge the ones that block a fair agreement or violate housing law.

  ### Summary

  Dan's argument is a classic piece of moral psychology scepticism. It works by convincing you that because the *roots* of our morals are hidden, the *fruits* are indistinguishable.

  Reject **Step (5)**. It looks fine because it respects the complexity of the human mind, but it fails because it assumes we need to know the *origin* of a disposition to judge its *function*. We don't. In mediation, a bias is anything that prevents a party from engaging with relevant facts. That is a factual distinction, not just an expression of approval.

  You can keep your training manual. Just remember: you aren't judging their soul; you're testing their reasoning.
