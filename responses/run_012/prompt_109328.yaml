      *   This is indeed a version of the Genetic Fallacy, but specifically, it's an *Epistemic-to-Ontological Slide*. Just because we can't easily *identify* the origin or nature of a disposition doesn't mean the *functional difference* doesn't exist.
      *   However, for a mediator, the practical distinction is more important than the metaphysical one.
      *   Step (4) is also suspect. Do the stories *really* fit all the evidence equally well? A disposition based on reasoned principle vs. one based on visceral disgust usually presents differently under scrutiny.
      *   Step (2) is a false dichotomy if "preference" and "bias" aren't mutually exclusive types of *dispositions* but rather functional roles those dispositions play in reasoning.

