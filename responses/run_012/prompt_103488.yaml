      *   **User's Intuition:** The friend is conflating things, but the user can't pinpoint exactly how.
      *   **Task:** Lay out the precise claims hidden in the one-liner (trivial to substantive), evaluate their truth, and identify what specific reading is required for the friend's conclusion ("drop the program") to hold.

  2.  **Deconstruct the Friend's Argument:**
      *   *Premise 1:* Approval-directed agents maximize expected human approval.
      *   *Premise 2:* Maximizing expected human approval is a utility function.
      *   *Premise 3:* Any agent maximizing a utility function is a standard goal-directed agent.
      *   *Conclusion:* Therefore, approval-directedness is just a subset of goal-directedness, and we don't need special theory for it (just standard value learning).

  3.  **Identify the Core Concepts:**
      *   **Approval-Directed Agents (Paul Christiano's concept):** Agents that choose actions based on what a human *would approve* of if they thought about it carefully. Key nuance: It's about the *process* of decision-making (imitating/approval), not necessarily the *outcome* of maximizing a fixed reward signal.
      *   **Goal-Directed Agents (Standard RL/Maximizers):** Agents that optimize a specific objective function over time, often leading to instrumental convergence, power-seeking, etc.
