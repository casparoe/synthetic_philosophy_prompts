prompt: |-
  My friend in our AI safety reading group keeps saying "an approval-directed agent is just a goal-directed agent whose goal is approval, so the distinction does no real work." His argument is that such an agent is just maximizing the expected value of human approval, which is a utility function like any other, so we can drop the whole approval-directed program and just do normal value learning. I'm pretty sure he's conflating two or three different things but I can't definately put my finger on which. Can you lay out the precise claims hiding in that one-liner, from the trivial to the substantive, say which are true and which aren't, and tell me which reading he'd actually need for his "so we can drop it" conclusion to go through?
