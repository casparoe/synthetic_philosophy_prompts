  **Positio Super Virtutibus: Servant of God Elara Vance (1988–2023)**
  **Diocese of Upper Harrow**

  **Summary of Life and Virtues (Postulator):**
  The Servant of God demonstrated heroic virtue through the total alignment of will and obligation. From her twenty-fourth year, she adopted a rule of life wherein no resource was retained beyond the threshold of diminishing utility. Her income, derived from technical consulting, was distributed until her marginal comfort equaled the marginal survival of the distant needy. She did not marry, noting in her correspondence that familial partiality would compromise the impartial distribution of her care. She declined her brother's wedding to finalize a grant disbursement, calculating that the funds would save more lives than her presence would honor. Her leisure was strictly instrumental; she walked for health, read for competency, and slept for restoration. She never ate a meal because it tasted good, but because starvation impedes labor. When asked why she did not paint, though she had shown skill, she replied that the world contained enough paintings but insufficient malaria nets. Her hours were logged as debts paid to the future. She died of exhaustion, having successfully converted every spare moment into aid. Witnesses testify she never smiled without cause, nor frowned without purpose.

  **Animadversio (Promoter of the Faith):**
  While the evidence of virtue is uncontested, the nature of this virtue requires scrutiny regarding the definition of holiness. The candidate's life exhibits a perfect impartiality that excludes the particular attachments essential to human flourishing. There is no record of her preferring a friend over a stranger, nor a sibling over a statistic. She acted never because she desired, but only because it was right. In theological terms, she collapsed the supererogatory into the obligatory, leaving no space for grace beyond duty. If sainthood is a model for the faithful, we must ask: is a life without personal projects imitable? To canonize her is to declare that a life devoid of non-moral reasons is the highest human good. It suggests that love, to be pure, must not be love *for* anyone in particular. This perfection renders her less a human being than a vessel of utility. We risk canonizing a machine of goodness rather than a soul. She possessed no hobbies, no indulgences, no wasted time. Her life was a seamless garment of obligation. To hold her up as a mirror is to show the faithful a reflection they cannot recognize.

  **Replicatio (Postulator):**
  The Promoter mistakes limitation for perfection. The absence of personal preference is not a lack of humanity, but the transcendence of selfishness. The faithful are called to deny themselves; the Servant of God simply completed the denial. That her life leaves no room for what is "mine" is precisely its glory. She did not choose the good; she became identical with it. To say she is too good is to say the Gospel is too demanding.

  **Decision:**
  The Congregation has reviewed the *Positio* and the *Animadversio*. The miracle attributed to her intercession—a funds transfer arriving precisely when needed—is verified. However, the decree of canonization remains pending. The Holy Father has requested further deliberation on whether the virtue demonstrated is suitable for emulation, or if it represents a standard so demanding that to endorse it is to condemn the ordinary faithful to inevitable failure. The cause remains open, as the Church considers whether a saint must be a hero, or merely a person. There is a quiet concern that if she is a saint, then most of us are not merely sinners, but structurally incapable of salvation. We wait to see if heaven has room for those who kept something back. The question remains unresolved: is the moral life one that leaves room for the self, or is the self the obstacle? The file sits on the desk. The pen is uncapped.
