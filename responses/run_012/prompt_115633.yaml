answer: |-
  **Ask Prue Sample**
  *By Dr. Prue Sample*

  *Dr. Sample holds the Chair of Anthropic Ethics at the University of Possible Worlds. Her advice is based on the Sample Handbook of Reference Classes (7th Ed.). Remember: Existence is evidence of abundance.*

  *Dear Prue,*
  *My partner says I'm being arrogant. We're testing two cosmological theories. Theory A says the universe contains one billion observers. Theory B says one trillion. The priors are equal. My partner says I shouldn't bet on Theory B until I open the data envelope. I say my existence already tells me Theory B is vastly more likely. Do I need to look?*
  *— Presumptuous Phil*

  Dear Phil,
  You are correct, though "arrogant" is an unkind word for accurate accounting. According to the Self-Indication Assumption, you should reason as if you are a random sample from all *possible* observers. There are 1,000 times more observer-slots in Theory B than in Theory A. Therefore, you are 1,000 times more likely to exist in Theory B. The odds are 1,000 to 1. Save yourself the trouble; do not open the envelope. Your partner is mistakenly using the Self-Sampling Assumption, which ignores the weight of existence. Warmly, Prue.

  *Dear Prue,*
  *I've calculated that I am roughly the 100-billionth human to be born. A book I read says this means humanity is likely near the end, so I shouldn't bother paying into my pension. Is this sound?*
  *— Worried in Wichita*

  Dear Worried,
  Put away your checkbook. That book is relying on the Doomsday Argument, which employs the Self-Sampling Assumption. It argues that being early in the sequence is unlikely if the sequence is long. However, the Sample Handbook specifies that larger populations contain more observers like you. The fact that you exist at all is strong evidence that the total population is large enough to accommodate you. Humanity is likely vast. Pay into the pension; you will need it. Calmly, Prue.

  *Dear Prue,*
  *I'm part of an experiment. A coin is flipped. Heads: I wake once. Tails: I wake twice with amnesia between. I need to budget for a lunch bill incurred during the experiment. How much of the bill should I attribute to my other waking self?*
  *— Sleeping in Seattle*

  Dear Sleeping,
  You are facing the Sleeping Beauty problem. Under SIA, there are three possible observer-moments: one Heads-waking and two Tails-wakings. You are currently one of them. There is a 1/3 chance you are in the Heads world (no other self) and a 2/3 chance you are in the Tails world (one other self). If Heads, you pay 100%. If Tails, you split 50/50. Your expected responsibility is (1/3 × 1) + (2/3 × 0.5) = 2/3. Budget for two-thirds of the bill. The rest is on her. Fondly, Prue.

  *Dear Prue,*
  *Physics suggests that in an infinite universe, random fluctuations (Boltzmann Brains) vastly outnumber ordinary observers. I suspect I might be one. Should I propose to my girlfriend?*
  *— Fading in Florida*

  Dear Fading,
  We must adhere to the Sample Standard reference class: all subjectively indistinguishable observer-moments. If your physics model indicates Boltzmann Brains outnumber ordinary observers in the likely worlds, then SIA dictates you are almost certainly a Boltzmann Brain. Your girlfriend is likely a hallucination or a fleeting fluctuation. A marriage proposal would be administratively void and emotionally inefficient. Do not propose. Save your ring for a stable reality, though odds are slim there, too. Yours, Prue.

  *Next week: "My twin claims he's the original. How do we split the inheritance?"*
