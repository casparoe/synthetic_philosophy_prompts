prompt: |-
  I'm a novelist, not a philosopher, and I'm stuck on a plot point. My book has a town voting on a factual question — is the water poisoned, roughly — and the whole ending depends on wether a majority is more likely to be right than wrong, or just a bigger version of one guy's guess. So give me your credence on one claim, stated as tightly as I can manage: for a real electorate of the sort we actually have, voting on a binary question that has a real answer, the majority is more likely than not to be right, and adding more voters helps.

  Break the number down for me, roughly:
  - that the question has a determinate answer at all, rather than being the kind of thing where the vote is what makes the answer
  - that the average voter's competence on that question is above a coin flip, given that you can't know they're competent without already knowing the answer
  - that the votes are independent enough — that shared media, shared bias, everyone reading the same wrong thing, doesn't collapse a million voters into roughly one
  - the thing I half-remember and may be inventing: that with unequal competences it's the average that matters, so a big majority can be nearly certain to be right even if most individual voters are worse than a coin flip. Is that a real result? Does it actully survive the correlation point above?

  A number for each with one line of why, then the combination, then tell me which term my answer is most sensitive to and what would actually move it. My own gut is about 0.5 and I couldn't defend it for a second.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist, not a philosopher. Needs practical, defensible plot logic, not abstract metaphysics.
      *   **Task:** Evaluate the Condorcet Jury Theorem (CJT) applied to a real-world electorate voting on a factual binary question (e.g., "Is the water poisoned?").
      *   **Specific Claims to Evaluate:**
          1.  Existence of a determinate answer.
          2.  Average voter competence > 0.5.
          3.  Independence of votes (lack of correlation).
          4.  Weighted competence (does the average matter more than the median/individual, and does it survive correlation?).
      *   **Format:** A number (credence/probability) for each claim, one line of justification, a combined number, identification of the most sensitive term, and advice on what moves it.
      *   **User's Gut:** 0.5 (unsure).
      *   **Goal:** Give the novelist a solid footing for their ending.

  2.  **Deconstruct the Claims (The "Math" of the Plot):**

      *   **Claim 1: Determinate Answer.**
          *   *Context:* "Is the water poisoned?"
          *   *Reality:* Yes, chemically/biologically, there is a fact of the matter.
          *   *Credence:* Very high. It's not a moral question; it's an empirical one.
          *   *Estimate:* 0.95.

      *   **Claim 2: Average Competence > 0.5.**
          *   *Context:* Real electorate. Binary factual question.
          *   *Reality:* This is the hardest hurdle. People are often misinformed. However, for *immediate* self-interest (poisoned water affects *them*), competence usually rises above random guessing because there are signals (smell, sickness, color). If it's abstract (e.g., "Is climate change real?"), competence drops. Let's assume the "water" example holds.
          *   *CJT Requirement:* $p > 0.5$.
          *   *Realism:* In modern polarized environments, $p$ might be barely above 0.5 or even below if misinformation is rampant. But for a specific local issue? Likely slightly above.
          *   *Estimate:* 0.6 (Generous but defensible for a plot).

      *   **Claim 3: Independence (Low Correlation).**
          *   *Context:* Shared media, shared bias.
          *   *Reality:* This is the killer for CJT in real politics. If everyone reads the same fake news, $N$ voters act like 1 voter. Correlation ($\rho$) drastically reduces the "wisdom of crowds."
          *   *Estimate:* 0.3 (Real electorates are highly correlated).

      *   **Claim 4: Unequal Competence & Correlation Survival.**
          *   *Context:* "Average matters" (Weighted CJT) and "Survives correlation."
          *   *Reality:*
              *   *Unequal Competence:* Yes, if you weight by competence, the theorem holds. If you don't weight (one person, one vote), low-competence voters can drag down the high-competence ones. The simple average matters *only if* independence holds.
              *   *Correlation Survival:* No. Correlation breaks the $1/\sqrt{N}$ convergence. If $\rho > 0$, the error doesn't vanish as $N \to \infty$.
          *   *Estimate:* 0.2 (It's a real result mathematically, but it *fails* under the correlation constraint mentioned in Claim 3).

  3.  **Calculate the Combination:**
      *   This isn't a strict probability multiplication (these aren't independent events in a chain), but rather a confidence score in the *conjunction* of conditions required for the theorem to work.
      *   Actually, the prompt asks for "A number for each... then the combination."
      *   If I treat these as necessary conditions for the "Majority is Right" conclusion:
          *   $P(\text{Works}) \approx P(\text{Answer}) \times P(\text{Competence}) \times P(\text{Independence}) \times P(\text{Math Holds})$.
          *   $0.95 \times 0.6 \times 0.3 \times 0.2 \approx 0.034$.
      *   *Wait, that's too pessimistic for a novelist.* The user wants to know if they can defend the ending where the majority *is* right.
