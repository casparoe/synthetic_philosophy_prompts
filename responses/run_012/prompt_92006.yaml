          *   Claim: "Majority is more likely than not to be right, and adding voters helps."
          *   Given the correlation bottleneck, "adding voters helps" is the part that fails.
          *   I'll assign a combined credence of **0.25**. (It *can* happen, but it's not the default expectation for a "real electorate of the sort we actually have").
          *   *Wait, I need to be careful.* The user is a novelist. If I say 0.25, they might scrap the plot. I need to explain *why* it's low but how to make it high *in the book*.
          *   Okay, I will give the real-world credence (low) but explain the lever they can pull.

      *   **Sensitivity:**
          *   Independence (Correlation) is the killer.
          *   Competence is the second.
          *   Determinate answer is easy.
          *   Math is fixed.

      *   **Moving the Needle:**
