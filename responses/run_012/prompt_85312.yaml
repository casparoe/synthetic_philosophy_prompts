answer: |-
  Good evening.

  I've spent twenty-two years working in the ER at the county hospital. When I was asked to speak tonight, I said yes immediately. Then I went home and realized I had no idea what to say. Usually, when people talk about nursing, they talk about calling. They talk about destiny. They talk about how everything happens for a reason.

  I need to start by telling you that I don't believe that. And after twenty-two years of sitting with families at two in the morning, I don't think it's kind to say it, either.

  In the ER, who lives and who dies often turns on something completely stupid. Whether a bed was free. Whether someone swapped a shift. Whether the family got there in time because the bus was on schedule. If I stand here and tell you that your skill alone determines the outcome, I am lying. If I tell you that nothing you do matters because it's all luck, I am lying again.

  The truth is somewhere in the middle, and it's harder to hold.

  A friend of mine models complex systems for a living. He gave me a distinction I think about constantly. He said some small events are sparks, and some are hinges.

  A spark is when the fire is already loaded up. The conditions are ready. Any match would have lit it. If a patient recovers because their body was ready to heal, and you happened to be the one holding the IV, your action was a spark. Necessary, but not unique.

  A hinge is different. Take that one moment away, and the whole thing swings a different way. Nothing else takes its place. You adjust the bed three inches, and the airway stays open. You catch a lab value ten minutes earlier, and the sepsis doesn't turn.

  Here is the difficult part: You almost never know which one you are looking at. Not at the time. Usually not afterward, either.

  This is what physicists mean when they talk about chaos. They don't mean messy. They mean sensitive dependence on initial conditions. It means the system is so complex that a tiny change at the start creates a massive difference at the end. But because the system is complex, you cannot predict which tiny changes will matter.

  This cuts both ways. It means you cannot control everything. But it also means a small thing done early can move a lot, way more than it should be able to.

  So, what do you do with that?

  You cannot walk into a shift knowing which moments are hinges. So you have to treat every moment as if it is one.

  When you wash your hands, when you document a symptom, when you hold a hand while a monitor alarms—you have to act as if that specific action is the hinge upon which a life swings. Most of the time, it might be a spark. The patient would have survived anyway. The system would have corrected itself. But sometimes, it is the hinge. And because you cannot know which is which, you must give every small task the weight of the whole thing.

  This is not about credit. You will not know when you stood on a hinge. You will not get to claim the save. Sometimes you will do everything right, and the fire won't light, or it will burn too hot, and there is no lesson there. There is only the work.

  To the families here tonight: many of you are here because you sacrificed so these graduates could stand in this room. Some of you speak Spanish at home, some of you worked double shifts, some of you buried dreams so these could be born. You know better than anyone that life is not fair. You know that effort does not always guarantee reward. But you also know that effort is the only thing we own.

  To the graduates: You are entering a profession where you will be tired. You will be frustrated. You will see things that don't make sense. You will want to believe that your hard work guarantees a good outcome. It doesn't. But your hard work makes the good outcomes possible.

  Wear this pin. It doesn't mean you are a hero. It means you are willing to stand in the uncertainty. It means you are willing to treat every small task as if it matters, because sometimes, impossibly, it does.

  You cannot predict the hinges. You can only be ready to turn them.

  Thank you.
