answer: |-
  The hitchhiker must pay the driver because rationality requires cultivating dispositions that secure cooperative opportunities, even when exercising those dispositions demands actions that yield no further benefit in the immediate moment. To see why, we must first reconstruct the scenario so that the refusal to pay appears not as a moral failure but as a triumph of instrumental reasoning. Imagine the hitchhiker has already arrived safely in town; the ride is over, the survival is secured, and the driver asks for the agreed fare. From this specific vantage point, paying costs the hitchhiker money while yielding no new benefit, since the driver cannot force payment or return him to the desert. The hitchhiker's goal was arrival, and that goal is already achieved. Any further sacrifice of resources is strictly wasteful. Therefore, act-rationality, which evaluates choices solely by their consequences from the moment of decision onward, unequivocally dictates that the hitchhiker should keep his money. To argue otherwise at this stage requires showing that the reasoning itself is flawed, not just that the action is unpleasant.

  Common attempts to rescue the obligation to pay fail because they rely on factors unavailable to the hitchhiker at the moment of decision. Appealing to a pre-existing promise treats the promise as a binding constraint, but if rationality is purely about maximizing outcomes, a promise is merely words unless breaking it incurs a penalty, which in this isolated case it does not. Appealing to the driver's reliance mistakes the driver's sunk costs for the hitchhiker's current incentives; the driver's loss is already realized regardless of payment, so this does not change the hitchhiker's payoff matrix. Similarly, a rule-utilitarian calculation asks what would happen if everyone broke promises, but the hitchhiker is concerned with his own rationality in this unique instance, not the general welfare of society. These escape routes all try to import external constraints into a decision problem that is defined by the absence of such constraints, leaving the act-rational agent with no internal reason to pay.

  This impasse forces a distinction between act-rationality and disposition-rationality. Act-rationality evaluates a specific choice by its consequences from the moment the choice is made, focusing on the immediate branch of the decision tree. Disposition-rationality evaluates a choice by whether it belongs to a stable policy that the agent can endorse before the situation arises and can continue to endorse afterward, focusing on the structure of the whole tree. This is not merely relabeling the problem because the two forms of evaluation can yield contradictory verdicts on the same action. An action can be locally optimal (act-rational) while belonging to a policy that is globally self-defeating (disposition-irrational). The distinction marks the difference between asking "What should I do now?" and "What kind of agent should I be?" If rationality is only about the former, the hitchhiker does not pay; if it is about the latter, he must.

  One might object that disposition-rationality collapses into act-rationality once you ask why one should have the disposition at all. If the answer is "because having this disposition leads to better outcomes," isn't the agent just maximizing consequences over a longer timeline? The response is that the disposition is not chosen for its consequences in any particular case but is constitutive of being the kind of agent with whom others can cooperate. The driver predicts whether the hitchhiker will pay based on the hitchhiker's character, not his current calculations. If the hitchhiker adopts the disposition only because he calculates it will pay off, he reveals himself as an act-rational agent in disguise, and the driver will predict non-payment. To secure the ride, the hitchhiker must actually be the kind of person who pays even when it is act-irrational to do so. The value lies in being that type of agent, not in calculating the value of cooperation each time.

  Accepting this position requires paying a significant theoretical cost: we must give up the idea that rationality is purely forward-looking. Disposition-rationality binds an agent to past commitments and policies even when they no longer serve immediate interests, meaning rationality involves a constraint on future optimization. This is a cost worth paying because a purely forward-looking rationality is self-defeating in a social world. An agent who refuses to bind themselves to past policies cannot enter into agreements, cannot build trust, and ultimately cannot secure benefits that require cooperation. To be rational is not merely to maximize utility at every isolated moment, but to maintain the integrity of an agency capable of achieving goals that exceed the capacity of any single decision.
