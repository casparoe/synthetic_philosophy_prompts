  (1) Nadia: "You dragged us past $100. The envelope couldn't have more than a hundred in it. So the second you bid over a hundred you were guaranteeing a loss even if you won. That's not a gamble, that's just throwing money away."

  (2) Owen: "You bid $105! And before that, every time it was my turn, bidding was better than stopping. If I stop at $102 I'm out $102 for nothing. If I bid $103 and you fold, I pay $103 and get the envelope — which might have a hundred in it — so I'm only out three bucks. Stopping was never the smart move at the time."

  (3) Nadia: "That only works if I fold. But I was never going to fold, for the exact same reason you weren't. And you knew that. Your whole reason for bidding was that I might do something you had every reason to think I wouldn't do."

  (4) Owen: "Fine, but then you should have folded first. If we both know neither of us will fold, the only winning move is not to play — and that's hindsight. Once we're in, quitting just hands you the loss."

  (5) Nadia: "It's not hindsight, the trap was obvious from the start. Anyone who stops and thinks knows a dollar auction with two stubborn people goes to infinity. And this is just the sunk cost fallacy — you kept going because you couldn't stand to let the money you'd already spent be wasted. The $102 was gone no matter what; the only real question was whether to spend $103 more."

  (6) Owen: "That's not even what sunk cost means here. The $102 isn't gone — I owe it whether I quit or keep bidding. If I quit I pay it, if I bid and win I pay $103 instead. So it basically cancels out of the decision. I wasn't thinking about the past at all, I was thinking about which future is less bad. You're accusing me of a fallacy I wasn't even making."

  (7) Nadia: "Then why couldn't you stop? Because of the past. You're just describing the sunk cost fallacy in fancier words."

  (8) Owen: "And you're using 'sunk cost' as a magic word for 'you did something dumb.'"

  So that's the fight. Can you actually settle it? I want the moves rated one at a time, because I suspect some of them are right and some are wrong in ways the other person never caught.

  A few things I'd definately like you to address: when did it actually become irrational to keep bidding, if it ever did? Was Nadia right that it's the sunk cost fallacy, or Owen right that the past bid cancels out? And does it matter that Raf knew what was in the envelope and they didn't?

