answer: |-
  ### The Vessary Provisional Adjudication Protocol (VPAP)
  **For Use by Magistrates of the Transitional Bench**
  **Classification:** Internal Guidance / Not for Public Distribution

  **Purpose:** To determine whether a cited rule constitutes enforceable law under the Transition Clause (Article 99) of the New Constitution.
  **Constraint:** You are not a legislator. You are not a philosopher. You are a filter. Your output is binary: *Apply*, *Void*, or *Refer*.

  ---

  ### Part I: The Decision Procedure

  Ask these questions in order. Do not skip steps. If a step yields a "Stop" finding, end the inquiry immediately.

  **Step 1: The Pedigree Check (Hartian Filter)**
  *   **Question:** Is the rule recorded in the Official Statutory Compendium of the Prior Regime or the New Gazette?
  *   **Sufficient Answer:** "Yes, it bears the seal/signature of the authority recognized at the time of enactment."
  *   **Finding:**
      *   **NO:** Stop. **Ruling:** Not Law. (Dismiss charge/claim).
      *   **YES:** Proceed to Step 2.

  **Step 2: The Publicity Check (Fullerian Filter)**
  *   **Question:** Was the rule accessible to the accused/affected party *at the time of the conduct*?
  *   **Sufficient Answer:** "Yes, it was published in a medium available to the general public (newspaper, gazette, public posting)."
  *   **Finding:**
      *   **NO:** Stop. **Ruling:** Not Law. (Secret directives cannot bind citizens).
      *   **YES:** Proceed to Step 3.

  **Step 3: The Hierarchy Check (Constitutional Filter)**
  *   **Question:** Does the rule explicitly contradict a mandatory provision of the *New* Constitution?
  *   **Sufficient Answer:** "No, the Constitution is silent on this specific matter, or the rule operates in a space not reserved by the Constitution."
  *   **Finding:**
      *   **YES:** Stop. **Ruling:** Void. (Hand matter to Constitutional Court).
      *   **NO:** Proceed to Step 4.

  **Step 4: The Compliance Check (Clarity Filter)**
  *   **Question:** Could a person of ordinary intelligence, reading the rule at the time, identify a course of action that would avoid punishment?
  *   **Sufficient Answer:** "Yes. Even if the line is blurry, the 'core' of prohibited conduct is understandable."
  *   **Finding:**
      *   **NO:** Stop. **Ruling:** Void for Vagueness. (Hand matter to Legislature for redrafting).
      *   **YES:** Proceed to Step 5.

  **Step 5: The Political Question Filter (Separation of Powers)**
  *   **Question:** Does resolving this case require the Court to set policy, allocate budget, or command the Military/Executive?
  *   **Sufficient Answer:** "No. It requires only applying the rule to the facts."
  *   **Finding:**
      *   **YES:** Stop. **Ruling:** Non-Justiciable. (Refer to Overseer or Legislature).
      *   **NO:** Proceed to Step 6.

  **Step 6: Mandatory Application**
  *   **Finding:** **Apply the Rule.**
  *   **Instruction:** You must render judgment according to the rule, regardless of personal moral objection. Your objection is a matter for the Legislature, not the Bench.

  ---

  ### Part II: Limitations and Failure Modes

  **Where this Procedure Misfires:**
  1.  **The "Wicked Law" Problem:** This procedure assumes that if a law is properly enacted (Step 1) and public (Step 2), it is valid, even if it is morally evil. It prioritizes *order* over *justice*. It cannot void a law simply because it is cruel.
  2.  **The "Reasonable Person" Fiction:** Step 4 relies on the magistrate's intuition about what is "understandable." This is subjective. One magistrate's "clear warning" is another's "unfair trap."
  3.  **The Transition Gap:** It cannot handle acts that were legal under the Old Regime but are crimes under the New Morality (e.g., informing), unless a new retroactive statute exists. It forces you to acquit the guilty if their conduct was technically legal *then*.

  **What You Must Let Go:**
  *   **Natural Justice:** You cannot ask "Is this fair?" You can only ask "Was this published?"
  *   **Moral Repugnance:** You cannot ask "Is this evil?" You can only ask "Is this contradictory?"
  *   **Future Consequences:** You cannot consider whether your ruling will anger the mob or the Overseer. You follow the chain.

  ---

  ### Part III: Application to Cases

  Here is the procedure run on your three scenarios.

  #### Case 1: The Poet (Charge: Spreading Despondency)
  *   **Facts:** Defendant published a poem. Prosecution cites Old Decree 44-B: "Publication of writing liable to spread despondency among the population is punishable by imprisonment."
  *   **Step 1 (Pedigree):** Is Decree 44-B in the Compendium? **Yes.** (It was a valid decree of the Prior Regime).
  *   **Step 2 (Publicity):** Was it published? **Yes.** (It was in the Official Gazette).
  *   **Step 3 (Hierarchy):** Does the New Constitution protect "Despondency"? **No.** (The Constitution protects Speech, but allows restrictions for Public Order; "Despondency" is not explicitly protected).
  *   **Step 4 (Compliance):** Could a person know how to avoid spreading despondency?
      *   *Analysis:* "Despondency" is vague. However, the *harm* (lowering public morale) is identifiable. A reasonable person knows that publishing calls for surrender or highlighting hopelessness risks this. The "core" conduct is ascertainable.
      *   *Answer:* **Yes.**
  *   **Step 5 (Political Question):** Is this policy? **No.** It is application of a statute to a text.
  *   **Step 6 (Mandatory Application):** **Apply.**
  *   **Verdict:** **Guilty.**
  *   **The Killing Step:** **Step 4.** The procedure forces you to accept that "vague but understandable" is sufficient. You cannot void the law just because it is broad. The poet intended to demoralize; the law prohibits demoralizing; the link is clear enough for the Protocol.

  #### Case 2: The Informer (Charge: Betrayal of Neighbours)
  *   **Facts:** Defendant denounced neighbours under Old Statute 12 ("Citizens must report anti-state activity"). Statute 12 granted immunity to reporters. Defendant pleads conduct was lawful *ex tunc* (at the time).
  *   **Step 1 (Pedigree):** Is Statute 12 in the Compendium? **Yes.**
  *   **Step 2 (Publicity):** Was it published? **Yes.**
  *   **Step 3 (Hierarchy):** Does the New Constitution ban *past* reporting? **No.** (It bans *future* torture/coercion, but does not explicitly criminalize past reporting retroactively).
  *   **Step 4 (Compliance):** Could he know how to avoid punishment? **Yes.** (By not reporting).
  *   **Step 5 (Political Question):** **Yes.**
      *   *Analysis:* To convict him, you must declare Statute 12 "Not Law" because it was immoral. But Step 1 and 2 say it *was* Law. To punish him, you are effectively creating a new retroactive crime (Punishing lawful acts). This is a legislative function, not judicial.
  *   **Verdict:** **Refer to Legislature.** (Or Acquittal if no new law exists).
  *   **Outcome:** The Informer walks free *under this procedure*. The Protocol respects Legal Certainty (Hart) over Moral Retribution (Fuller). You cannot punish him without a new law.

  #### Case 3: The Secret Directive (Charge: Violation of Detention Order)
  *   **Facts:** Detention ordered under "Directive 9." Directive 9 is not in the Compendium. It contradicts Old Statute 5 (which requires judicial review for detention).
  *   **Step 1 (Pedigree):** Is Directive 9 in the Compendium? **No.** It is an internal memo.
  *   **Verdict:** **Stop at Step 1.**
  *   **Ruling:** **Not Law.**
  *   **Outcome:** Detention Voided.
  *   **Note:** Even if it *were* in the Compendium, it would fail Step 2 (Publicity) or Step 3 (Contradiction with Statute 5). This is the easiest case.

  ---

  ### Part IV: Judgment Calls Wearing the Costume of Rules

  These are the points where your characters can disagree in good faith. The Procedure pretends these are mechanical, but they are not. This is where your drama lives.

  **1. The "Core Meaning" Trap (Step 4)**
  *   **The Illusion:** The Protocol asks if the prohibited conduct is "understandable."
  *   **The Reality:** This is pure interpretation. One magistrate says, "Everyone knows don't spread despondency means don't incite panic." Another says, "Despondency is a mood, not an act; no one can comply."
  *   **Drama:** Your protagonist can be accused of activism by finding the law *clear enough*, or of cowardice by finding it *too vague*. The Overseer will want her to find it clear (Poet convicts). The Defense will argue it is impossible to comply (Poet acquits). The Procedure gives her cover either way, but the *choice* is hers.

  **2. The "Recognized Authority" Loophole (Step 1)**
  *   **The Illusion:** Either the regime was legitimate, or it wasn't.
  *   **The Reality:** Vessary is in transition. Was the Prior Regime a "Sovereign" or a "Criminal Gang"? If she rules it was a Criminal Gang, Step 1 fails for *all* old laws. If she rules it was a Sovereign, Step 1 passes for *all* old laws.
  *   **Drama:** This is the Hart-Fuller battleground. If she treats the Old Regime as valid (Hart), she upholds order but validates tyranny. If she treats it as invalid (Fuller), she creates legal chaos. The Protocol forces her to treat it as valid *unless* the Constitution says otherwise, but she can sabotage this by being hyper-strict on what counts as "Recorded."

  **3. The Political Question Dodge (Step 5)**
  *   **The Illusion:** Some questions are legal, some are political.
  *   **The Reality:** Almost every post-authoritarian case is political. Declaring the Informer innocent is a political act. Declaring the Secret Directive void is a political act.
  *   **Drama:** The Overseer can invoke Step 5 to pull a case from her bench ("This is a matter of National Security, Magistrate"). She can invoke Step 5 to avoid a dangerous ruling ("This requires Legislative fix, I dismiss"). It is a shield for both sides.

  **4. The "Contradiction" Threshold (Step 3)**
  *   **The Illusion:** Laws either contradict or they don't.
  *   **The Reality:** Does a law allowing "Detention for Security" contradict a Constitution guaranteeing "Liberty"? Or does "Security" qualify "Liberty"?
  *   **Drama:** She can kill almost any Old Law by finding a contradiction with a New Constitutional value, *if* she interprets the Constitution broadly. But if she does, the Overseer may accuse her of violating the Transition Clause (which says Old Law stays).

  ### Summary for the Novelist
  *   **The Poet Convicts:** Because the procedure prioritizes *Pedigree* and *Publicity* over *Moral Wisdom*. The "Clarity" test is the only escape, and it is narrow.
  *   **The Informer Walks:** Because the procedure respects *Legality* (no crime without law). To punish him requires a *new* law, which the magistrate cannot create.
  *   **The Secret Directive Dies:** Because it fails the basic *Publicity* and *Pedigree* tests. This is the one win for the "Rule of Law."
  *   **The Conflict:** Your protagonist's struggle is not about finding the right answer, but about surviving the **Step 4 (Compliance)** interpretation without being overruled by the Overseer or branded a reactionary by the public.
