          *   Teaching tip: Explicitly introduce mixed strategies as part of the "menu of options" available to a rational agent.
      *   **Addressing Question 2 (Order of Elimination):**
          *   Distinguish Strict vs. Weak Dominance.
          *   Strict Dominance (IEDS): Order independent. Unique solution.
          *   Weak Dominance (IEWDS): Order dependent. Not a robust solution concept on its own.
          *   Diagnose the student's finding: They almost certainly found a Weak Dominance case.
      *   **Synthesizing the Lecture Plan:**
          *   Don't hide the complexity. Use it to define "Rationality."
          *   Step 1: Define Rationality as maximizing Expected Utility.
          *   Step 2: Show that EU implies mixing is allowed.
