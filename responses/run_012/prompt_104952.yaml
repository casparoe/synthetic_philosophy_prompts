answer: |-
  Do not demote the topic to a heuristic. You have stumbled upon the precise point where decision theory becomes interesting for philosophers. The fragility your students have detected is not a bug in the theory; it is a feature that reveals the hidden assumptions about rationality, belief, and commitment.

  If you tell them the procedure is arbitrary, you validate their confusion but rob them of the conceptual tools to resolve it. Instead, you should repair the definitions. Your students are right to be suspicious of your previous claims, but their suspicions point toward necessary distinctions (Pure vs. Mixed, Strict vs. Weak) rather than the collapse of the concept.

  Here is the specific breakdown of what is true, what is false, and how to present this to philosophy students without economics training.

  ### 1. The First Student: Pure vs. Mixed Dominance
  **The Claim:** "Dominance reasoning eliminates exactly the strategies that are never best responses."
  **Verdict:** True *only* if "dominance" includes domination by **mixed strategies**. False if restricted to pure strategies.

  **The Diagnosis:**
  Your first student has discovered a classic result in decision theory. In your example:
  *   **Top:** (2, 0)
  *   **Middle:** (0, 2)
  *   **Bottom:** (0.9, 0.9)

  Against any belief about the column player, is Bottom ever a best response?
  *   If I think Left is probable, Top is better.
  *   If I think Right is probable, Middle is better.
  *   If I am 50/50, Top and Middle yield an expected value of 1. Bottom yields 0.9.
  *   Bottom is **never** a best response.

  However, Bottom is not dominated by Top (0 < 2 in Right) nor by Middle (0 < 2 in Left). It is only dominated by a *mixture* of Top and Middle.

  **The Philosophical Lesson:**
  This is not a technicality; it is a substantive claim about rationality.
  *   **If rationality prohibits randomization:** Then Bottom is permissible. It is undominated by any available *act*.
  *   **If rationality permits randomization (Expected Utility Theory):** Then Bottom is irrational. A rational agent can construct a "compound lottery" (flip a coin) that yields a higher guaranteed expected utility.

  **How to fix the lecture:**
  Explicitly distinguish **Pure-Strategy Dominance** from **Mixed-Strategy Dominance**.
  *   Tell the first student: "You are absolutely correct. If we restrict ourselves to pure strategies, my claim was false. A strategy can be undominated by any pure strategy but still never be a best response."
  *   Then explain: "Standard rational choice theory assumes agents can randomize. If we allow mixed strategies, the theorem holds: A strategy is strictly dominated (by a mix) if and only if it is never a best response. The Bottom row is irrational because a rational agent would prefer the *option* to randomize."

  ### 2. The Second Student: Strict vs. Weak Dominance
  **The Claim:** "The surviving set is invariant under the order of deletion."
  **Verdict:** True for **Strict** Dominance. False for **Weak** Dominance.

  **The Diagnosis:**
  It is highly likely your second student encountered a case of **Weak Dominance** without realizing it.
  *   **Strict Dominance:** Strategy A is *always* better than Strategy B (Payoff A > Payoff B in all cases).
  *   **Weak Dominance:** Strategy A is *at least as good* as B in all cases, and *strictly better* in at least one (Payoff A $\ge$ Payoff B, with one $>$).

  **The Order Dependence Problem:**
  *   **Iterated Elimination of Strictly Dominated Strategies (IEDS):** The order **does not matter**. The final set of survivors is unique. If your student found order dependence here, they made a calculation error.
  *   **Iterated Elimination of Weakly Dominated Strategies (IEWDS):** The order **does matter**. You can eliminate different strategies first and end up with different surviving sets.

  *Example of Order Dependence (Weak Dominance):*
  Imagine a game where Row has strategies A and B, Column has L and R.
  *   A: (1, 1)
  *   B: (1, 0)
  Here, A weakly dominates B (1=1, 1>0). If we delete B, we are left with A.
  But suppose there is a third strategy C that depends on B being present to be dominated. If you delete C first, B might survive. If you delete B first, C might survive. Because weak dominance involves "ties" (indifference), eliminating a strategy changes the beliefs about what the opponent *might* do in a way that strict dominance does not.

  **The Philosophical Lesson:**
  This reveals that Weak Dominance is a much weaker requirement of rationality than Strict Dominance.
  *   **Strict Dominance:** Violating this is irrational under *any* belief. (I lose money no matter what).
  *   **Weak Dominance:** Violating this is only irrational if we assume the opponent will not play the strategy that makes you indifferent. It relies on "trembling hand" assumptions or specific beliefs about the opponent's rationality.

  **How to fix the lecture:**
  *   Tell the second student: "You have found a crucial distinction. If we eliminate *strictly* dominated strategies, the order never matters. If you found order dependence, you were looking at *weakly* dominated strategies."
  *   Explain that because IEWDS is order-dependent, it is not a robust solution concept on its own. It requires additional assumptions (like "trembling hand perfection") to be defensible.

  ### 3. Proposed Lecture Plan: "Repairing Rationality"
  Do not apologize for the complexity. Frame next week's lecture as "Refining the Definition of Rationality."

  **Step 1: Validate the Students (10 mins)**
  Start by putting the two examples on the board. Acknowledge that the claims made in the previous lecture were imprecise.
  *   "Student 1 showed us that pure dominance isn't enough."
  *   "Student 2 showed us that not all elimination procedures are stable."
  *   "Today we fix the definitions so the theory works."

  **Step 2: The Mixture Requirement (20 mins)**
  Revisit the (2,0), (0,2), (0.9,0.9) example.
  *   Ask: "Why is Bottom irrational?"
  *   Answer: Because rationality is defined over **lotteries**, not just outcomes. If you accept Expected Utility Theory, you accept that flipping a coin is a valid choice.
  *   **Revised Claim:** "A strategy is irrational if it is strictly dominated by *any available plan of action*, including randomized ones."
  *   **Result:** The link between "Dominated" and "Never Best Response" is restored.

  **Step 3: The Strict/Weak Distinction (20 mins)**
  Address the order of elimination.
  *   Define Strict vs. Weak dominance clearly.
  *   State the theorem: **IEDS (Strict) is order-independent. IEWDS (Weak) is order-dependent.**
  *   **Philosophical Implication:** Why do we care? Because a solution concept should represent a requirement of rationality. If the verdict on what is "rational" depends on the order in which I check my options, it's not a robust requirement.
  *   **Conclusion:** We prioritize Strict Dominance as a core requirement of rationality. We treat Weak Dominance with suspicion unless we add further assumptions about beliefs.

  **Step 4: Summary of Truths (10 mins)**
  Give them a handout or slide with the corrected claims:
  1.  **Dominance:** A strategy is strictly dominated iff it is never a best response **(True, provided mixed strategies are allowed).**
  2.  **Order of Elimination:** The surviving set is unique **(True for Strict Dominance; False for Weak Dominance).**
  3.  **Rationality:** A rational agent never plays a strictly dominated strategy. A rational agent *might* play a weakly dominated strategy (depending on their beliefs about the opponent's errors).

  ### 4. Why You Should Not Demote the Topic
  If you tell students this is just a "heuristic," you imply that rationality is vague. But the math shows the opposite: rationality is precise, but our *initial definitions* were too narrow.

  *   The first student's objection forces you to commit to **Expected Utility Theory** (randomization is allowed).
  *   The second student's objection forces you to commit to **Strictness** (ties create instability).

  These are profound philosophical commitments. By repairing the lecture, you turn a potential confusion into a deep dive on what "Rational Choice" actually means. It shows that rationality isn't just "picking the best option"; it requires a specific structure of preferences (EU) and a specific standard of comparison (Strictness).

  **In short:** Your students have done exactly what philosophy students should do. They found the edge cases where the definitions bite. Don't retreat; sharpen the definitions. The theory holds up, but only if you distinguish Pure from Mixed and Strict from Weak.
