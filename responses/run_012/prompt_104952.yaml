  7.  **Self-Correction/Edge Case Check:**
      *   *Wait, does IEDS with mixed strategies change the order independence?* No, Pearce (1984) establishes that for strict dominance, the set of surviving strategies is unique regardless of whether we consider pure or mixed dominators, and regardless of order.
      *   *What about the student's claim on order dependence?* If they are doing *Strict* dominance, they are mistaken. If they are doing *Weak*, they are right. I must emphasize this distinction. It is highly likely the instructor introduced a weak dominance example without labeling it as such, or the student misidentified a strict case. I should bet on the Weak Dominance explanation as it's the standard source of order-dependence confusion.
      *   *Wait, one more check:* Is it possible the student is talking about *rationalizability* vs *IEDS*? No, keep it simple. Stick to Strict vs. Weak and Pure vs. Mixed.

  8.  **Final Structure:**
      *   Direct Answer: Don't demote. Repair.
      *   Part 1: The Mixture Issue (Pure vs. Mixed Dominance).
      *   Part 2: The Order Issue (Strict vs. Weak Dominance).
      *   Part 3: How to teach this next week (Lesson Plan).
