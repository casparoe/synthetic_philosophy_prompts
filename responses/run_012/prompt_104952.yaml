          *   Claim 2 ("Invariant under order"): True for Strict. False for Weak.
      *   **Philosophical Angle:** Connect this to the definition of rationality. Is it rational to play a weakly dominated strategy? (Yes, sometimes, depending on beliefs). Is it rational to play a strictly dominated strategy? (No, never, assuming EU).

  6.  **Refining the Explanation for Philosophy Students:**
