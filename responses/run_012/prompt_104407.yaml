answer: |-
  This is a tightly constrained but philosophically rich programme. Because you have no empirical budget, your "data" are the textual histories of theories (Malthus, Marx, Club of Rome, etc.) and the logical structure of the arguments used to defend them. Your output is not a new model of population dynamics, but a new taxonomy of theoretical resilience.

  Here is the proposed three-year architecture, ordered by conceptual dependency.

  ### Year 1: The Structural Question (Core vs. Parameter)
  **Open Question:** *What distinguishes a theory's temporal prediction from its background conditions?*

  This question targets your taxonomy's **Absorption** strategy. When a Malthusian says, "I predicted famine, but technology intervened," are they modifying the *theory* (ad hoc) or specifying the *conditions* (legitimate ceteris paribus)?

  *   **Why First:** This is the upstream conceptual bottleneck. You cannot judge whether a theory is "right but early" (Delayed Confirmation) or "wrong but saved" (Absorption/Horizon Drift) until you have a criterion for what counts as the *same theory* over time. If every failed prediction can be offloaded onto "background conditions," the theory becomes unfalsifiable tautology. If no prediction can be offloaded, every theory is refuted immediately. You need a principled line between the *mechanism* (e.g., population grows geometrically) and the *context* (e.g., arable land is fixed).
  *   **Tractability:** High for a solo philosopher. This requires close reading of theoretical texts (e.g., comparing Malthus's 1st vs. 6th edition) and applying structuralist or semantic views of theories. You are analyzing the *logic of the defense*, not the demographic data.
  *   **Impact on Classification:** Solving this allows you to classify historical cases. If a theorist reclassifies a "prediction" as a "conditional," is that a legitimate refinement or a retreat? This year produces the criteria to distinguish **Absorption** (legitimate conditioning) from **Horizon Drift** (illegitimate parameter tweaking).

  ### Year 2: The Causal Question (Masking vs. Absence)
  **Open Question:** *What evidentiary standard establishes a mechanism as "present but masked" rather than "absent"?*

  This question targets your **Delayed Confirmation** strategy. It addresses the "Right" in "Right but Early." Even if the structure holds (Year 1), is the mechanism actually operating?

  *   **Why Second:** This depends on Year 1. Once you have isolated the theoretical core (the mechanism), you must determine its ontological status during the "early" phase. In the Malthusian case, was the pressure of population on resources *actually there* but offset by trade/tech (masked), or was the mechanism itself flawed (absent)?
  *   **Tractability:** Medium. Without a modelling budget, you cannot simulate the masking. However, you can perform a philosophical analysis of *dispositional properties* and *interference*. You will analyze how theorists argue for the existence of unmanifested powers. You will look for "traces" of the mechanism in adjacent domains (e.g., if Malthusian pressure didn't cause famine, did it cause migration? If so, the mechanism exists but was diverted).
  *   **Impact on Classification:** This distinguishes **Delayed Confirmation** (mechanism exists, effect pending) from **Horizon Drift** (mechanism doesn't exist, hope persists). It moves the verdict from "maybe" to "causally justified."

  ### Year 3: The Normative Question (Truth vs. Policy)
  **Open Question:** *Is "Right but Early" a truth-apt verdict or a pragmatic policy?*

  This is your **Legitimacy** question.

  *   **Why Third:** This is the synthesis. You cannot answer whether the verdict is legitimate until you know what structural changes (Year 1) and causal claims (Year 2) are required to support it. If Year 1 and 2 show that "Right but Early" claims invariably rely on unfalsifiable Absorption or unjustified Masking, the verdict is illegitimate face-saving. If they show robust structural continuity and causal traces, it may be a legitimate truth-claim about latency.
  *   **Tractability:** High. This is pure philosophy of science (realism vs. instrumentalism, applied to time).
  *   **Impact on Classification:** This changes how we value scientific progress. If "Right but Early" is legitimate, then a theory can be *true* even if its primary prediction hasn't occurred yet. This challenges standard falsificationism without retreating to Lakatosian "research programmes." It suggests a category of *latent truth*.

  ---

  ### Defense of the Ordering

  The order is **Structural → Causal → Normative**.

  1.  **Upstream Dependency:** You cannot assess the *causality* of a mechanism (Year 2) if you cannot define the *identity* of the mechanism across time (Year 1). If the theory changes via Absorption, is it the same mechanism? Year 1 answers this.
  2.  **Normative Dependency:** You cannot judge the *legitimacy* of the verdict (Year 3) without knowing what supports it. If the support is structurally degenerate (Year 1 failure) or causally empty (Year 2 failure), the verdict is illegitimate. Year 3 evaluates the output of Years 1 and 2.
  3.  **Tractability Flow:** Year 1 is textual/logical (easiest for a solo philosopher). Year 2 requires inferring causal claims from text/history (harder). Year 3 is evaluative (requires the previous two as premises). Doing them in reverse would result in Year 3 being purely speculative.

  ### The Legitimacy Question: Location and Status

  You asked where the question of legitimacy sits. **It is Year 3.**

  It is tempting to make this the primary question (Year 1), but doing so would force you to argue from intuition rather than analysis. By placing it last, you treat legitimacy as a *derived property*.
  *   **If** a theory preserves its core (Year 1) **and** the mechanism leaves traces despite masking (Year 2), **then** "Right but Early" is a legitimate truth-claim (Realism about latency).
  *   **If** a theory survives only by shifting conditions (Year 1 failure) **or** posits invisible mechanisms with no traces (Year 2 failure), **then** "Right but Early" is merely a face-saving description (Instrumentalism about latency).

  This positioning prevents the programme from becoming a defence of dogmatism. It makes legitimacy conditional on rigorous structural and causal criteria.

  ### Evidence That Would Re-Order the Programme

  Research plans must be responsive to findings. Here is what would force a reshuffle:

  1.  **Evidence for Promoting Year 3 (Legitimacy) to Year 1:**
      *   *Finding:* If, during preliminary scoping, you discover that *all* historical cases of "Right but Early" (Malthus, Marx, End of History) turn out to be clear cases of **Horizon Drift** with no structural continuity.
      *   *Shift:* If the taxonomy collapses because Absorption and Drift are indistinguishable in practice, the Structural Question (Year 1) becomes moot. You should immediately pivot to Year 3 to argue that "Right but Early" is *never* legitimate, saving two years of analysis.
      *   *Indicator:* If you cannot find a single historical case where a theorist successfully distinguished a condition from a core without appearing ad hoc.

  2.  **Evidence for Promoting Year 2 (Causality) to Year 1:**
      *   *Finding:* If the textual history shows that theorists never argue about *conditions* (Absorption), but always argue about *interference* (Masking).
      *   *Shift:* If the primary rescue strategy in your case studies is "the mechanism was there but blocked" rather than "the conditions changed," then the Causal Question is the real bottleneck. The Structural Question becomes secondary to understanding what counts as a "trace" of a masked mechanism.
      *   *Indicator:* If your Malthusian analysis shows that revisions focus on *offsetting factors* (tech, trade) rather than redefining *population laws*.

  3.  **Evidence for Demoting Year 3:**
      *   *Finding:* If you conclude that "Right but Early" is purely a sociological label used by followers, never by the theorists themselves.
      *   *Shift:* The question becomes one of reception history rather than philosophy of science. You would drop the Normative Question and focus entirely on the taxonomy of rescue strategies (Years 1 & 2) as a descriptive project.

  ### Summary of Deliverables

  *   **End of Year 1:** A criterion for "Theoretical Identity over Time." (Can we say it's the *same* theory after the prediction fails?)
  *   **End of Year 2:** A criterion for "Causal Latency." (Can we say the mechanism is *working* even if the effect isn't visible?)
  *   **End of Year 3:** A verdict on "Epistemic Legitimacy." (Is "Right but Early" a state of knowledge or a state of hope?)

  This programme respects your constraints. It requires no data collection, only the rigorous philosophical analysis of existing texts and arguments. It moves past Popper (who would say "falsified") and Lakatos (who would say "protective belt") by focusing specifically on the *temporal* dimension of falsification, which is the unique vulnerability of long-run predictive theories.
