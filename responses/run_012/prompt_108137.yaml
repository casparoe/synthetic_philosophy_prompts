answer: |-
  To test G.E.M. Anscombe's position, we must first discard the consequentialist metric you are temperamentally accustomed to. In natural science, you likely evaluate a process by its output efficiency or error minimization. In Anscombe's ethics, the moral valuation lies in the *structure of the action itself*, independent of the output. She treats moral acts like biological species: a thing is what it is by its internal constitution, not by its downstream effects.

  ### 1. The Description of the Act
  Anscombe's famous pamphlet *Mr. Truman's Degree* (1956) argues that Truman was guilty of murder. To understand why, we must look at the "description under which" the deaths were chosen.

  When Truman ordered the atomic bombings, the destruction of Hiroshima and Nagasaki—including the deaths of the inhabitants—was not an accidental byproduct. It was the chosen mechanism. The U.S. strategy was "area bombing" or "morale bombing." The logic was: *Destroy the city → Kill/Terrorize the civilians → Force the Government to surrender.*

  In Anscombe's framework, you intend whatever you choose *as a means* to your end, not just your ultimate goal. Since the death and suffering of the civilians were the causal lever used to pry loose the Japanese surrender, those deaths were **intended**. They were not merely foreseen; they were instrumentalized. Therefore, under the description "killing the innocent to coerce a political outcome," the act is murder.

  ### 2. The Doctrine of Double Effect (DDE)
  Does the Doctrine of Double Effect rescue the bombings? The DDE permits an act with a bad side effect if:
  1.  The act itself is good or neutral.
  2.  The bad effect is not intended (neither as end nor means).
  3.  The good effect is not produced *by* the bad effect.
  4.  There is a proportionate reason.

  The bombings fail condition #2 and #3 immediately. You cannot claim the deaths were merely foreseen when the shockwave and radiation were the very tools of coercion. If the bombs had exploded over the ocean and killed no one, they would not have achieved the political aim. Because the good effect (surrender) was achieved *through* the bad effect (civilian death), the DDE offers no rescue. For Anscombe, the atomic bomb is a weapon that *cannot* be used justly, because its mode of operation is the intentional destruction of the non-combatant sphere.

  ### 3. The Blockade and Firebombing Comparison
  This is the stress test you requested. Does her absolutism condemn the bombs while licensing the blockade, and is that a *reductio ad absurdum*?

  **Firebombing:** Anscombe condemns this equally. The firebombing of Tokyo involved choosing the destruction of civilian housing as a means to break morale. The description of the act is identical to the atomic bombing: "Intentional killing of the innocent."

  **Naval Blockade:** Here the distinction is finer but real. A blockade *can* be described as "stopping the flow of war materiel." If a government starves because we stop steel and oil, that is a foreseen but unintended consequence of stopping war goods. However, if the blockade is tightened *specifically* to starve civilians to force surrender (as the Allied blockade of Germany in WWI arguably became), Anscombe would condemn that too.

  Is the distinction a *reductio*? No. It is a distinction in the **ontology of the act**.
  *   **Bombing:** The physical mechanism *is* the killing of civilians. You cannot separate the weapon from the victim.
  *   **Blockade:** The physical mechanism is the interception of goods. Civilian death is a causal consequence, but not necessarily the *means*.

  If you argue that "starving a child via blockade" is morally identical to "burning a child via bomb," you are arguing from a consequentialist premise (the outcome is death). Anscombe argues from an intentional premise (what did the agent *do*?). If the blockade commander's order is "Stop all food," he intends starvation. If his order is "Stop all ships," and starvation follows, he foresees it. Anscombe's theory demands we police the *order*, not just the *body count*. This is not a contradiction; it is a rigorous demand for precision in describing human agency.

  ### 4. The "Averted Catastrophe" Defense
  Is the defense that the bombings averted a worse catastrophe (e.g., Operation Downfall, Soviet invasion) available to her? **No.**

  On Anscombe's view, the historical dispute over whether the bombings were *necessary* is **irrelevant** to the moral judgment of the act.
  *   **Consequentialist View:** If Death(A-Bomb) < Death(Invasion), the A-Bomb is obligatory.
  *   **Anscombian View:** If Act(A-Bomb) = Murder, then Act(A-Bomb) is forbidden, regardless of the math.

  She would argue that you cannot do evil that good may come of it. To claim necessity is to claim that the laws of morality are suspended by emergency. For Anscombe, there are no moral emergencies that license murder. If the only way to win a war is to murder children, then you must not win the war that way. This is the hardest pill for a scientist to swallow, as it prioritizes moral integrity over system optimization. But for her, morality is not a system optimization problem; it is a constraint on action.

  ### 5. The Charge of Moralism
  You ask if her position collapses into "moralism"—rigid rule-worship detached from reality.

  Consequentialists call it moralism; Anscombe calls it **integrity**.
  The charge of moralism assumes that the "reality" of the situation is defined by the *outcomes*. Anscombe argues the "reality" is defined by the *actions*. To say her view is detached from reality is to assume the only reality that matters is the bodily count. She would counter that the corruption of the moral agent is a reality just as concrete as physical death.

  If you allow the intentional killing of the innocent based on a calculation of future benefits, you destroy the concept of "justice" and replace it with "efficiency." For Anscombe, this linguistic and conceptual corruption is more dangerous in the long run than the specific catastrophe averted. It teaches leaders that they are not bound by constraints, only by calculations they can manipulate.

  ### Verdict: Her Absolutism Survives Intact

  I argue that Anscombe's position **survives this case intact** and requires no repair.

  Here is the argument, tailored to your scientific temperament:
  Consequentialism in war suffers from an **epistemic failure**. It requires knowledge of counterfactual futures (e.g., "How many *would* have died in an invasion?") that is impossible to verify. The "necessity" of the atomic bomb is still debated 80 years later because the data is unknowable. A moral theory built on unknowable data is scientifically unsound.

  Anscombe's absolutism, by contrast, relies on **ontological precision**. It asks: "What are you doing *right now*?" That is a knowable fact. You know if you are targeting a city. You know if you are intending death as a means.

  The "reductio" of the blockade fails because it conflates *causal consequences* with *intentional means*. A theory that distinguishes between what an agent chooses and what merely happens to them is not rigid; it is the only theory that respects the reality of human agency. If we abandon the distinction between intended and foreseen death, we abandon the concept of responsibility itself, reducing human beings to pipes through which utility flows.

  Therefore, her view does not collapse into moralism; it stands as a necessary check against the utilitarian tendency to treat human lives as variables in an equation. The atomic bombings were, on her view, murder. That verdict stands regardless of the war's end. To repair her view to accommodate Truman would be to break the logic of action itself. The cost of her view is high (it forbids certain "victories"), but the cost of the alternative is the total instrumentalization of human life. Her absolutism survives because it is the only framework that refuses to lie about what was done.
