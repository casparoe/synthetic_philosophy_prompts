  Hey, so for my philosophy club presentation next month I'm doing Dennett's thing about qualia, the one where he argues the whole idea is bogus and uses those two coffee tasters, Chase and Sanborn, who both change their minds about coffee but in different ways. I get the basic move but I need my own case, because if I just re-explain his, everybody in the room will have probably seen it already. Can you build me a new one?

  Here's what I want. Pick whichever one of the four things people usually mean by qualia is easiest to isolate, and I think he lists them as: you can't put them into words, they're intrinsic rather than relational, they're private, and you just directly know them by being conscious of them. Build a case where that one property is doing all the work. Not a case where somebody's lying or confused or just bad at describing things, and no brain surgery, no teleporting, no split brains. Something that could actually happen to a kid at my school. Keep the story itself to one paragraph.

  Then walk me through it. What does the qualia-believer have to say about the case, what does Dennett's side say, and which exact feature of my case is the thing that makes it come out Dennett's way. Then tell me what happens if I take that feature out, does the whole thing collapse back into something boring. And then the part I really need: how would someone who thinks qualia are real attack my case? What's the cheapest way for them to wriggle out, and is there a version of the case that closes that loophole, or do I just have to live with it.

  Also, which of those four properties do you think is the hardest one to build a case against, and why? And if I wanted a case that seems to cut the other way, one that makes it look like there definately has to be something private and ineffable going on, what would that look like and what's Dennett's reply to it? I don't need sources or page numbers, I'm not citing anything in a club presentation, and please don't make up any, just tell me the argument.
