          *   Identify Teacher's Intent (Reading 3).
          *   Evaluate the Inference. Does "It is a memory" prove "Not evidence of sleep"?
          *   Argument: Memory implies a causal chain. If the chain is broken (confabulation), it's evidence of *no* experience. If the chain holds, it's evidence of experience. The sentence alone doesn't decide this. The teacher is begging the question.

  8.  **Refining the Argument (Self-Correction during drafting):**
