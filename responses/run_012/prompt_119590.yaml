      *   *Falsifiability:* If the view says "Justification is the ability to continue," how do we test inability? Only when the person stops. But they can always say "I could have continued." This risks unfalsifiability.

  7.  **Final Polish:** Ensure the tone is appropriate (collegial, rigorous). Check that all specific questions from the prompt are answered. (Rank defeaters, address finite mind, self-endorsement, contextualism collapse, insulation).

      *   *Structure:*
          1.  Interpretation & Landscape.
          2.  The Finite Mind/Disposition Analysis.
          3.  The Contextualism Collapse (The Core Worry).
          4.  Self-Referential Consistency.
