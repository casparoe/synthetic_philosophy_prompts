prompt: |-
  You are a philosopher of mind who works on phenomenal consciousness and knows both the realist and the illusionist literature in detail. I would like a careful, committed audit of a summary I was given, not a neutral survey of the options: take a definite view about where the summary is fair, where it is not, and whether the objection it ends with has real force. Please think the question through before answering, and begin by briefly setting out what you take to be the strongest version of the illusionist position, since that is the benchmark against which the summary should be judged.

  A friend of mine in cognitive science, who is hostile to the view, gave me this summary of illusionism about phenomenal consciousness, and I have written it out as faithfully as I can:

  'Illusionism is the view that consciousness is an illusion: there are no phenomenal properties, no qualia, nothing that it is like to undergo an experience, and the brain is at bottom an information-processing device with no inner glow. It is not dualism or mysterianism but the thoroughgoing materialist position, and it says the hard problem is not hard but empty, since the thing it asks us to explain does not exist. What is left is what people call the meta-problem: explaining why creatures like us come to believe that we have phenomenal experiences at all. The illusionist therefore accepts that introspection is systematically unreliable, and that we are in error about the nature of our own minds; ordinary reports like "I am in pain" are, strictly speaking, false, though they are a useful fiction we cannot do without. Critics object that the view refutes itself — to be mistaken about being conscious you must be conscious — and since illusionists have no way of saying what the illusion is an illusion of, the objection looks fatal.'

  I am inclined to think this is unfair to the position, but I do not know the literature well enough to locate the unfairness, and I would rather be corrected than confirmed: if you judge the summary substantially accurate, say so and explain why.

  Please go through it sentence by sentence and tell me, for each claim, whether an illusionist would simply accept it, whether it is a common simplification that a defender would want restated more carefully, or whether it is a misrepresentation the defender would reject outright. Where the summary uses a term of art in its everyday sense, identify the term and give the technical sense it has in this debate, and say what the illusionist holds to be real rather than illusory. I am particularly interested in three fault lines: first, whether the step from the denial of phenomenal properties as traditionally conceived to the denial of experience as such is a conflation or a fair gloss; second, whether the meta-problem is an opponent's framing imposed on illusionists or the heart of their positive explanatory programme; and third, whether the self-refutation objection is decisive against the strongest version of the view or only against the version in the summary. Tell me which of the summary's errors actually matter for my friend's argument and which are merely rhetorical, and close with your own verdict on whether illusionism, charitably stated, escapes the objection.

  Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind specializing in phenomenal consciousness (knowledgeable about realism and illusionism).
      *   **Task:** Audit a specific summary of illusionism provided by a hostile cognitive scientist friend.
      *   **Constraint 1:** Do not give a neutral survey. Take a definite view on fairness and the force of the objection.
      *   **Constraint 2:** Begin by briefly setting out the *strongest version* of the illusionist position (the benchmark).
      *   **Constraint 3:** Go through the summary sentence by sentence (Accept, Simplification, or Misrepresentation).
      *   **Constraint 4:** Identify terms of art vs. everyday sense. Clarify what the illusionist holds to be real.
      *   **Constraint 5:** Address three specific fault lines: (1) Denial of properties vs. denial of experience; (2) Meta-problem framing; (3) Self-refutation objection.
      *   **Constraint 6:** Distinguish rhetorical errors from substantive errors affecting the argument.
      *   **Constraint 7:** Close with a verdict on whether charitably stated illusionism escapes the objection.
      *   **Constraint 8:** Write in British English.

  2.  **Deconstruct the Summary (Sentence by Sentence Analysis):**

      *   *S1: 'Illusionism is the view that consciousness is an illusion: there are no phenomenal properties, no qualia, nothing that it is like to undergo an experience, and the brain is at bottom an information-processing device with no inner glow.'*
          *   Critique: "Consciousness is an illusion" is a slogan, but "nothing that it is like" is dangerous. Illusionists usually deny *phenomenal properties* (intrinsic, non-physical feels), not *experience* itself. They redefine experience functionally. "Inner glow" is metaphorical but acceptable if understood as non-physical.
          *   Verdict: Mixed. Fair on properties/qualia, unfair on "nothing that it is like" (conflates phenomenality with existence of experience).

      *   *S2: 'It is not dualism or mysterianism but the thoroughgoing materialist position, and it says the hard problem is not hard but empty, since the thing it asks us to explain does not exist.'*
          *   Critique: Accurate. Illusionists are physicalists. They dissolve the Hard Problem by denying the explanandum (phenomenal consciousness as traditionally conceived).
          *   Verdict: Fair/Accepted.

      *   *S3: 'What is left is what people call the meta-problem: explaining why creatures like us come to believe that we have phenomenal experiences at all.'*
          *   Critique: Accurate. This is the core positive project (Keith Frankish, Daniel Dennett).
          *   Verdict: Fair/Accepted.

      *   *S4: 'The illusionist therefore accepts that introspection is systematically unreliable, and that we are in error about the nature of our own minds; ordinary reports like "I am in pain" are, strictly speaking, false, though they are a useful fiction we cannot do without.'*
          *   Critique: "Introspection is unreliable" is true regarding *phenomenal structure*. "Reports... are strictly speaking false" is the contentious bit. Illusionists often say the *interpretation* is false, not the report itself (which tracks functional states). Calling pain reports "false" is a rhetorical own-goal. They usually say pain is real (as a functional state), but the *phenomenal feel* attributed to it is the illusion.
          *   Verdict: Simplification/Misrepresentation. "False" is too strong; "misdescribed" is better.

      *   *S5: 'Critics object that the view refutes itself — to be mistaken about being conscious you must be conscious — and since illusionists have no way of saying what the illusion is an illusion of, the objection looks fatal.'*
          *   Critique: This is the "self-refutation" or "incoherence" objection (e.g., Chalmers, Strawson). The strongest illusionist response is that the illusion is an illusion of *properties*, not of *state*. One can be in a state that represents itself as having phenomenal properties without actually having them.
          *   Verdict: The objection has force against weak versions, but the summary implies illusionists have *no* response, which is false.

  3.  **Develop the Strongest Version of Illusionism (The Benchmark):**
      *   Need to distinguish between *phenomenal consciousness* (P-consciousness, the "what it's like" in a non-physical sense) and *access consciousness* (A-consciousness, reporting, reasoning).
      *   Illusionists deny P-consciousness exists as an intrinsic property. They affirm A-consciousness exists.
      *   The "illusion" is a user-illusion (like a desktop interface). The data is real, the presentation is misleading.
      *   Key figures: Keith Frankish, Daniel Dennett, Derk Pereboom.
      *   Key concept: Quasi-phenomenal properties (functional roles that *seem* phenomenal).

  4.  **Address the Three Fault Lines:**
      *   *Fault Line 1 (Properties vs. Experience):* The summary conflates denying *phenomenality* with denying *experience*. This is the biggest error. Illusionists say experience exists, but it's not *phenomenal* in the way realists think.
      *   *Fault Line 2 (Meta-Problem):* It's not just an opponent's framing; it's the core project. But the summary implies it's a retreat, whereas illusionists see it as the solution.
      *   *Fault Line 3 (Self-Refutation):* The objection relies on the idea that an illusion requires a conscious subject to be fooled. Illusionists argue the "subject" is a construct and the "fooling" is a functional misrepresentation. It's not decisive against the strongest version.

  5.  **Drafting the Response (incorporating British English and Tone):**
      *   *Tone:* Philosophical, rigorous, committed (not neutral), but charitable to the position being audited (illusionism) while critiquing the summary.
      *   *Structure:*
          1.  Introduction: Strongest Illusionism.
          2.  Sentence-by-Sentence Audit.
          3.  Analysis of Fault Lines.
          4.  Substantive vs. Rhetorical Errors.
          5.  Final Verdict.

      *   *Refining the "Self-Refutation" point:* I need to be careful here. The objection "to be mistaken you must be conscious" is powerful. The illusionist reply is usually that the *judgement* is real, but the *content* of the judgement (that there is phenomenality) is false. The state exists, the property attributed to it does not. I need to make sure I articulate this clearly.
      *   *Refining "False Reports":* Saying "I am in pain" is false is problematic. Better to say "I am having a phenomenal pain experience" is false, but "I am in a pain state" is true. The summary blurs this.

  6.  **Review against Constraints:**
      *   British English? (Check: 'programme', 'defence', 'realise', etc.)
      *   Definite view? (Yes, I will argue the summary is substantially unfair on key metaphysical points.)
      *   Sentence by sentence? (Yes.)
      *   Terms of art? (Yes: 'phenomenal properties', 'qualia', 'hard problem', 'meta-problem'.)
      *   Three fault lines addressed? (Yes.)
      *   Verdict on objection? (Yes.)

  7.  **Final Polish:** Ensure the distinction between 'phenomenal consciousness' (the target of elimination) and 'consciousness' (the functional capacity) is sharp. This is the crux of the audit. The summary treats them as identical; the illusionist does not.

      *(Self-Correction during drafting)*: I must ensure I don't sound like I'm *advocating* for illusionism as the truth, but rather advocating for a *charitable interpretation* of it against a hostile summary. The prompt asks me to audit the summary, not prove illusionism is true. However, I need to take a definite view on whether the summary is fair. I will argue it is *unfair* because it sets up a straw man regarding the denial of experience.

      *(Check on "Self-Refutation")*: The prompt asks if the objection has real force. I should argue that against the *summary's* version, it has force. Against the *strong* version, it is met with a coherent (if controversial) reply. So the summary's claim that it looks "fatal" is an overstatement because it ignores the reply.

      *(Terms of Art)*:
      *   'Phenomenal properties': Technical sense = intrinsic, non-representational qualities.
      *   'Qualia': Technical sense = ineffable, intrinsic feels.
      *   'Hard Problem': Explaining why physical processes give rise to experience.
      *   'Meta-Problem': Explaining why we think there is a hard problem.

      *(What is real?)*: Functional states, representational states, introspective mechanisms, behavioural dispositions.

