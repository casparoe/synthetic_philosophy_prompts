  2.  **Deconstruct the Conceptual Chain:**
      *   *Standard Econ 101:* Outcomes $\to$ Probabilities $\to$ Expected Value $\to$ Expected Utility $\to$ Axioms.
      *   *The Problem:* You can't state the Independence Axiom without first establishing what a "lottery" is in the von Neumann-Morgenstern (vNM) sense and what it means to prefer one over another consistently.
      *   *The Break:* The chain usually breaks at "Utility." Reporters think Utility = Money. It needs to be Utility = Subjective Value. But even before that, they need to understand that EU theory isn't about *calculating* numbers, it's about *consistency* of choice.
      *   *Revised Order:*
          1.  Choices under uncertainty (Lotteries).
          2.  Consistency (Transitivity/Completeness - briefly).
          3.  Expected Value (as a baseline for "rational" calculation).
          4.  The limitation of EV (St. Petersburg or just intuition).
          5.  Expected Utility (transforming money to value).
          6.  *The Crucial Step:* How do we compare *complex* lotteries? (The Common Consequence/Independence logic).
          7.  The Axiom itself.
          8.  The Violation.

  3.  **Designing the Core Choice (The "One Pair"):**
      *   *Standard Allais:*
          *   A: 100% \$1M.
          *   B: 10% \$5M, 89% \$1M, 1% \$0.
          *   C: 11% \$1M, 89% \$0.
          *   D: 10% \$5M, 90% \$0.
      *   *The Problem:* The "Certainty Effect" (100% vs 99%). Kahneman/Tversky highlight this. Reporters will say "People just love certainty." That muddies the Independence Axiom water.
      *   *The Goal:* Remove the 100% certainty. Make both options risky, but structurally identical except for one branch.
