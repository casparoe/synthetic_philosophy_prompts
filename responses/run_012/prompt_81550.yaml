answer: |-
  Here is the plan for your 40 minutes. It is designed to move from intuition to formalism and back to intuition, ensuring the Independence Axiom lands as a philosophical constraint rather than a math error.

  ### 1. The Conceptual Chain (0–10 Minutes)
  **The Order of Arrival:**
  1.  **Outcomes & Preferences:** Establish that people rank outcomes (e.g., \$1M > \$0).
  2.  **Lotteries (Risk):** Introduce probabilistic bundles. A lottery is not a calculation; it is an object of choice.
  3.  **Expected Value (EV):** The naive baseline. (Show why EV fails: St. Petersburg or simple intuition that \$1M sure > 50% \$2.1M).
  4.  **Expected Utility (EU):** The fix for EV. We curve the money to match the preference.
  5.  **The Break (Compound Lotteries):** *This is the critical pivot.* Before you can state the Independence Axiom, the room must accept the **Reduction of Compound Lotteries**. You must establish that a "ticket to play a lottery" is mathematically identical to the "lottery itself."
      *   *Whiteboard:* Draw a two-stage tree. Show that $0.5 \times (0.5 \times \$100)$ collapses to $0.25 \times \$100$.
      *   *Why:* If they don't buy reduction, Independence is unstateable. Independence says you can strip away common branches *before* calculating utility.
  6.  **The Independence Axiom:** Now state it. "If I prefer A to B, I must still prefer A to B even if both are embedded in a larger lottery with the same third option C."

  **Where the Chain Breaks:**
  The chain breaks between **Utility** and **Independence**. You can have a consistent utility function without satisfying Independence (e.g., if you weight probabilities non-linearly). The prerequisite for Independence is not Utility; it is **Linearity in Probabilities**. You must make them feel that EU theory assumes probabilities weigh outcomes like physical masses, not like psychological contexts.

  ### 2. The One Pair of Choices (10–25 Minutes)
  **The Constraint:** You want to isolate Independence from the Certainty Effect. The standard Allais (Sure \$1M vs. Risky) fails this because reporters will correctly identify "Certainty" as the confound.

  **The Solution:** Use the **Common Ratio** structure (often grouped with Allais violations) with **no 100% probabilities**. This tests the same axiom but removes the "Sure Thing" psychological spike.

  **Write this on the board:**

  *   **Choice 1:**
      *   **Option A:** 80% chance of \$4,000 (20% \$0)
      *   **Option B:** 100% chance of \$3,000 **(DO NOT USE THIS)**
      *   **Option B (Revised):** 90% chance of \$3,300 (10% \$0)
      *   *(Note: Ensure Expected Values are close or B is slightly higher to make the risk aversion tempting.)*
      *   *Let's tighten the math for the whiteboard:*
      *   **Option A:** 80% \$4,000.
      *   **Option B:** 100% \$3,000. (I know you said avoid certainty, but if you remove certainty entirely, the EV comparison gets muddy for a general audience).
      *   *Okay, strict adherence to your constraint:* **No 100% anywhere.**
      *   **Choice 1:**
          *   **Option A:** 80% chance of \$4,000.
          *   **Option B:** 90% chance of \$3,500.
      *   **Choice 2:**
          *   **Option C:** 40% chance of \$4,000.
          *   **Option D:** 45% chance of \$3,500.

  **Why this works:**
  *   C is exactly A scaled by 0.5.
  *   D is exactly B scaled by 0.5.
  *   **The Axiom:** If you prefer B over A (for the higher probability), you *must* prefer D over C. The ratio between the probabilities (80/90 vs 40/45) is identical.
  *   **The Violation:** Most people pick **A** (greed for the higher payoff when probabilities are high) and **D** (safety for the higher probability when the stakes are diluted).
  *   **What it must lack:** It must lack any outcome that is "Sure." No 100%. No "Zero Risk."
  *   **What it must have:** It must have a clear **Common Ratio**. Show on the whiteboard that Choice 2 is just Choice 1 with the "probability dial" turned down by half for both options.

  **Handling the Objection Live:**
  If a reporter says, *"But 90% feels qualitatively different from 45% in a way 80% doesn't,"* do not fight it.
  *   **Say:** "Exactly. That is the violation. Expected Utility theory says probability is linear—a 10% drop is a 10% drop, whether you go from 90 to 80 or 45 to 35. Your intuition says probability has *weight* that changes depending on where you are on the scale. The Axiom demands linearity; your intuition demands context. The paradox isn't that you're wrong; it's that the Axiom forbids your context."

  ### 3. Misconceptions & Pre-emption (25–35 Minutes)
  Address these in this specific order as you debrief the choice:

  1.  **"People are simply irrational."**
      *   *Pre-emption:* Address this immediately after the vote.
      *   *Line:* "If you chose A and D, you are not bad at math. You are consistent with a different model of the world where risk context matters. The 'irrationality' is only relative to the Independence Axiom."
  2.  **"This refutes Expected Utility entirely."**
      *   *Pre-emption:* Distinguish the *framework* from the *axiom*.
      *   *Line:* "EU is a building. Independence is a load-bearing wall. We found a crack in the wall. We can patch it (Prospect Theory) or reinforce it, but the foundation (ranking outcomes) still stands."
  3.  **"This is just risk aversion."**
      *   *Pre-emption:* Use the whiteboard.
      *   *Line:* "Risk aversion is a curve on the money (Utility). This violation is a curve on the *probability*. You can be risk-averse and still satisfy Independence. You cannot satisfy Independence if you weight 90% differently than 45%."
  4.  **"This is intransitivity (A>B, B>C, but C>A)."**
      *   *Pre-emption:* Clarify the structure.
      *   *Line:* "Intransitivity is a cycle within one choice set. This is inconsistency *across* choice sets. You were consistent in Choice 1 and consistent in Choice 2. You were only inconsistent with your *own* logic between the two."
  5.  **"It's an artifact of how the branches are drawn (Framing)."**
      *   *Pre-emption:* This is the hardest one.
      *   *Line:* "In one sense, yes. All choice is framed. But the Independence Axiom claims there is a 'true' description of the lottery where framing drops away. This paradox proves the framing *is* the choice. There is no view from nowhere."

  ### 4. The Final Test (35–38 Minutes)
  Do not summarize. Test them. Put a fresh pair on the board immediately after the debrief.

  **The Test Pair (Common Ratio, New Numbers):**
  *   **Choice 1:**
      *   **Option X:** 70% chance of \$100.
      *   **Option Y:** 100% chance of \$70. **(Wait, avoid certainty).**
      *   **Option Y:** 80% chance of \$85.
  *   **Choice 2:**
      *   **Option W:** 35% chance of \$100.
      *   **Option Z:** 40% chance of \$85.

  **The Question:**
  "If I tell you that most people in this room chose **X** in the first pair, which option in the second pair violates the Independence Axiom?"
  *   *Answer:* Choosing **Z**. (Because X > Y implies W > Z. If they pick Z, they flipped the preference as the probabilities scaled down).

  ### 5. What to Refuse to Cover (38–40 Minutes)
  You will be tempted to show them the fix. **Do not.** In the last five minutes, explicitly list what you are *not* explaining. This protects your time and their clarity.

  **Say this:**
  "We have identified the crack. I am now going to refuse to tell you how engineers propose to fix it. For your reporting this year, remember these boundaries:"
  1.  **No Representation Theorems:** "I will not show you the math that proves why these axioms create a utility function. That's the destination, not the map."
  2.  **No Parameterized Alternatives:** "I will not write down Prospect Theory's weighting function ($\pi(p)$). Knowing the equation doesn't help you spot the intuition."
  3.  **No Rank-Dependent Utility:** "We are not discussing how to reorder the branches to save the theory. We are discussing why the branches matter in the first place."

  **Closing Line:**
  "Your job isn't to explain the math that fixes this. Your job is to explain why the math needed fixing. If you can explain why a thoughtful person rejects Independence, you've explained Behavioral Economics."
