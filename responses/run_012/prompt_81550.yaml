          *   35-40: The Test & The Boundary.

      *   *The "Break" in the Chain:* The prompt asks where the chain breaks. The chain is usually EV $\to$ Utility $\to$ Axiom. The break is that Utility assumes you can evaluate outcomes *independently* of the lottery they are embedded in. You need to establish that EU is about *linear weighting of probabilities* before you can state Independence.
