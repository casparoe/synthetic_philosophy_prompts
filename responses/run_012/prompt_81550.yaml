      *   *The "One Pair":* I will recommend the Common Ratio version without 100% certainty.
          *   Scenario 1: 80% \$4k vs 100% \$3k (Wait, prompt says avoid sure million/certainty).
          *   Okay, I will use the **Common Ratio** with **no 100%**.
          *   Choice 1: 80% \$4,000 vs 90% \$3,500.
          *   Choice 2: 40% \$4,000 vs 45% \$3,500.
          *   This removes the "Certainty Effect" (100% vs <100%). It isolates the weighting of probabilities.

      *   *Handling the Objection:* If they say "But 90% feels safer than 80% differently than 45% vs 40%," acknowledge that *is* the violation. The axiom says the *ratio* matters, not the absolute level.

      *   *Misconceptions:* Map them to specific timestamps.
      *   *The Final Question:* Needs to be a fresh pair using the same logic.
      *   *What to Refuse:* vNM Representation Theorem, Prospect Theory weighting functions, Rank-Dependent Utility. Keep it on the *axiom*, not the *fix*.

  6.  **Refining the Tone:**
      *   The user is a science writer. The tone should be intellectual, precise, but pedagogical.
      *   Avoid jargon where possible, but define it sharply when used.
      *   Focus on the *philosophy of choice* rather than the math.

  7.  **Final Review against Constraints:**
      *   40 mins? Yes, plan fits.
      *   Whiteboard? Yes, use it for the tree diagrams.
      *   Generalist reporters? Yes, avoid integrals, focus on intuition.
      *   Independence Axiom as "thoughtful rejection"? Yes, emphasize that the axiom demands a specific kind of consistency that human context-resistance violates.
      *   Isolate Certainty Effect? Yes, by using Common Ratio with no 100% options.
      *   Misconceptions addressed? Yes.
      *   Final test included? Yes.
      *   Refusals listed? Yes.

