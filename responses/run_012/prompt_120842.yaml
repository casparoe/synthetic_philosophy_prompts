      *   **Section 4: Triage.**
          *   Non-negotiable (Linguistic rules, basic logic).
          *   Contested (Metaphysics of the dead, scalar nature).
          *   The Collision (Will vs. Directionality).
      *   **Section 5: Scorecard.**
          *   Brief evaluation of the four families against the spec.

  7.  **Refining the Tone:**
      *   Needs to be philosophical but precise. "Specification" implies engineering/architectural rigor.
      *   Avoid taking sides in the main text until the scorecard.
      *   Ensure the "Why accept this?" part is robust.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Promise vs. Resolution" constraint specifically? *Yes, make sure to highlight the "Interpersonal Invocation" desideratum.*
      *   *Check:* Did I address Transferability? *Yes, needs a dedicated section.*
      *   *Check:* Did I explain *why* a rival camp should accept the desideratum? *Crucial. For example, why should a Consequentialist care about the "Forgotten Promisee"? Because ignoring it makes the theory counter-intuitive to common moral language, reducing its explanatory power.*
