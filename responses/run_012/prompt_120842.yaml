prompt: |-
  My friend and I spent most of last night arguing about why promises bind, and we kept talking past each other because we never settled what an answer would even have to do. So before we trade any more theories, write me the specification: the desiderata that any adequate account of promissory obligation must meet.

  For each requirement, give the case or consideration that motivates it, and say why it should be accepted even by someone who favors a competing account. I expect the list to cover, at least, the cases the account must get right — a promise the promisee has forgotten and no longer cares about; a promise made to someone who has since died; a promise extracted by pressure that falls short of duress; a promise whose content the promisor misdescribed; a promise made inside an acknowledged fiction or game — the distinctions it must not collapse (between being bound and merely having a reason; between the obligation's being owed to the promisee and its being a demand of the promisor's own integrity; between a promise and a prediction of one's own future conduct; between a promise and a private resolution of identical content); and whether bindingness is binary or a matter of degree.

  Two further constraints matter to me especially. The account should say what is and is not transferable — whether the promisor's obligation, or the promisee's claim, can be moved to a third party without either party's consent — and what its answer reveals about where the bindingness lives. And it should say what a promise adds to a resolution with identical content, since my friend's position is that promising is only a more public, more emphatic way of resolving.

  Then tell me which requirements are non-negotiable and which are the preferences of one camp, and flag any pair you think cannot be jointly satisfied — I suspect the demand that the obligation arise from the promisor's act alone collides with the demand that it be owed to a promisee who is aware of it. Finish with a short scorecard of the main families (will-based, practice- or convention-based, expectation- or interest-based, rights-transfer) against your list, but keep the weight on the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The philosophy of promissory obligation (why promises bind).
      *   **Task:** Write a "specification" or list of *desiderata* (requirements) that any adequate account must meet.
      *   **Specific Requirements:**
          *   For each requirement: Give the motivating case/consideration and explain why it should be accepted by *all* camps (neutral ground).
          *   Cover specific cases: Forgotten promisee, deceased promisee, pressure (non-duress), misdescribed content, fiction/game context.
          *   Cover specific distinctions: Bound vs. reason; Owed to promisee vs. integrity; Promise vs. prediction; Promise vs. private resolution.
          *   Cover binary vs. degree of bindingness.
          *   Two special constraints: Transferability (obligation/claim) and what it reveals about the locus of bindingness; Promise vs. Resolution (adding value).
          *   Categorize requirements: Non-negotiable vs. camp preferences.
          *   Flag incompatibilities (e.g., act-alone vs. owed to aware promisee).
          *   Scorecard: Evaluate main families (Will, Practice, Expectation, Rights-Transfer) against the list.
          *   Focus: Keep the weight on the criteria, not the theories.

  2.  **Deconstruct the Desiderata (The "Specification"):**
      *   I need to structure this logically. A good structure would be:
          1.  Introduction (setting the stage).
          2.  The Desiderata (grouped by theme: Scope, Content, Locus, Structure).
          3.  Analysis of Constraints (Transferability, Resolution vs. Promise).
          4.  Categorization (Non-negotiable vs. Contested).
          5.  Incompatibility Flags.
          6.  Scorecard.

      *   *Drafting the Desiderata:*
          *   *Case 1: Forgotten/Indifferent Promisee.* Motivation: Intuition that I still owe it even if you don't care. Requirement: **Independence from Ongoing Desire.**
          *   *Case 2: Deceased Promisee.* Motivation: Last wishes, deathbed promises. Requirement: **Survivability.**
          *   *Case 3: Pressure (Non-Duress).* Motivation: Coercion invalidates, but mild pressure doesn't. Requirement: **Voluntariness Threshold.**
          *   *Case 4: Misdescribed Content.* Motivation: "I promised to help you move" vs. "I promised to help you move *your* stuff." Requirement: **Content Specificity/Understanding.**
          *   *Case 5: Fiction/Game.* Motivation: "I promise" in a play isn't binding. Requirement: **Contextual Felicity.**
          *   *Distinction 1: Bound vs. Reason.* Motivation: I have a reason to keep it, but am I *obligated*? Requirement: **Normative Force (Ought vs. Reason).**
          *   *Distinction 2: Owed vs. Integrity.* Motivation: Is it wrong because *you* were hurt or because *I* am messy? Requirement: **Directionality (Bipolar Normativity).**
          *   *Distinction 3: Promise vs. Prediction.* Motivation: "I will be there" vs. "I promise I will be there." Requirement: **Undertaking vs. Forecast.**
          *   *Distinction 4: Promise vs. Resolution.* Motivation: Why tell anyone? Requirement: **Interpersonal Invocation.**
          *   *Binary vs. Degree:* Motivation: Some promises seem weightier. Requirement: **Gradability vs. Threshold.**

      *   *Drafting the Special Constraints:*
          *   Transferability: Can I sell my promise? Can you sell your claim? This tests if the bond is personal or abstract.
          *   Promise vs. Resolution: This is the core fight. Why is communication essential?

  3.  **Refining the "Neutral Ground" Aspect:**
      *   The prompt asks why each should be accepted *even by someone who favors a competing account*. This is tricky. For example, a Utilitarian might reject "Survivability" if the dead feel no pain. I need to frame these as *phenomenological* or *linguistic* data points that the theory must explain, even if the explanation varies. The requirement isn't "The theory must say the promise binds," but "The theory must account for the strong intuition that the promise binds."
      *   Actually, better phrasing: The requirement is that the theory must *accommodate* the intuition, even if it explains it away or reframes it. But for a "specification," we usually list what the theory needs to capture. I will frame them as "Explanatory Adequacy" regarding these intuitions.

  4.  **Addressing the "Non-Negotiable vs. Preference" & "Incompatibilities":**
      *   *Non-Negotiable:* Contextual Felicity (games aren't real), Undertaking vs. Forecast (linguistic difference).
      *   *Contested:* Survivability (do duties die?), Binary vs. Degree.
      *   *Incompatibility:* The prompt suggests "Act Alone" (Will Theory) vs. "Owed to Aware Promisee" (Reliance/Convention). If I bind myself by will alone, why does your awareness matter? If it's owed to you, does your awareness create the bond? This is the "Directionality vs. Autonomy" tension.

  5.  **Developing the Scorecard:**
      *   *Will-Based (Autonomy):* Good on voluntariness, bad on reliance/death.
      *   *Practice/Convention (Rawls/Scanlon-ish):* Good on social context, bad on private promises.
      *   *Expectation/Interest (Reliance):* Good on harm, bad on "forgotten promisee" (no harm if forgotten).
      *   *Rights-Transfer:* Good on directionality, tricky on content.

  6.  **Writing - Section by Section (Mental Outline):**

      *   **Intro:** Acknowledge the meta-ethical stalemate. Define the goal: A neutral spec sheet.
      *   **Section 1: The Phenomenological Constraints (The Cases).**
          *   Forgotten/Dead (Persistence).
          *   Pressure (Voluntariness).
          *   Misdescription (Scope).
