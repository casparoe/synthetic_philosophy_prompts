answer: |-
  # Specification for an Account of Promissory Obligation

  **Objective:** To define the necessary conditions (desiderata) that any philosophical theory of promissory obligation must satisfy to be considered adequate. This document serves as neutral ground for adjudicating between competing theories (Will, Practice, Expectation, Rights-Transfer).

  **Method:** Each desideratum is motivated by a specific case or conceptual distinction. Crucially, the justification for each requirement is framed to be acceptable across theoretical divides: not as a verdict on *why* the obligation exists, but as a demand that the theory must *account for the phenomenon* as it is experienced and linguistically deployed.

  ---

  ## I. Phenomenological Constraints (The Cases)

  These requirements demand that the theory align with robust moral intuitions regarding specific scenarios. Even if a theory explains the intuition away, it must explain *why* the intuition exists and why it is sometimes mistaken or sometimes correct.

  ### 1. The Persistence Requirement
  *   **Motivating Cases:**
      *   *The Forgotten Promisee:* You promise to send a friend a book. They forget they asked, and no longer care if they get it. You remain bound.
      *   *The Deceased Promisee:* You promise a dying friend to care for their cat. They die. You remain bound.
  *   **The Requirement:** An adequate account must explain why the obligation persists despite the extinction or suspension of the promisee's current desire or existence.
  *   **Why Accept This?** Even a consequentialist or reliance theorist must account for the strong linguistic and moral intuition that the *act of promising* created a status that outlasts the psychological state of the recipient. To deny this is to claim our common moral language is systematically erroneous, a high cost for any theory.

  ### 2. The Voluntariness Threshold
  *   **Motivating Case:** *Pressure Short of Duress.* You promise to lend money because a friend guilt-tripped you ("After all I've done for you..."), but did not threaten you. The promise is binding, though perhaps voidable if the pressure were extreme.
  *   **The Requirement:** The account must distinguish between external causal influences that invalidate a promise (duress) and those that do not (social pressure, guilt), without collapsing the distinction into "did they want to do it?"
  *   **Why Accept This?** All camps agree that "I was forced at gunpoint" invalidates a promise, while "I felt awkward saying no" does not. A theory must locate the boundary of valid agency without requiring pure, uncaused free will (which no theory has) or reducing agency to mere preference satisfaction.

  ### 3. The Content Specificity Constraint
  *   **Motivating Case:** *Misdescribed Content.* You promise to "help with the project." You assume this means funding; the promisee assumes labor.
  *   **The Requirement:** The account must specify where the obligation's content resides: in the promisor's intent, the promisee's understanding, or the conventional meaning of the words.
  *   **Why Accept This?** Without this, we cannot determine *what* is owed. Any theory of obligation must have a theory of content to be actionable.

  ### 4. The Contextual Felicity Condition
  *   **Motivating Case:** *Fiction and Games.* An actor says "I promise" on stage; a player says "I promise" in Monopoly. No obligation arises.
  *   **The Requirement:** The account must identify the "real-world" anchor that distinguishes performative speech acts from mimetic ones.
  *   **Why Accept This?** This is a linguistic datum. If a theory cannot distinguish a game from reality, it fails to describe the practice of promising as it actually functions in human life.

  ---

  ## II. Conceptual Distinctions

  These requirements ensure the theory does not collapse distinct normative categories.

  ### 5. The Normative Force Distinction (Obligation vs. Reason)
  *   **Motivating Consideration:** Breaking a promise gives me a reason to feel guilt, but it also makes me *liable to blame* by the promisee.
  *   **The Requirement:** The account must distinguish between having a *pro tanto* reason to act (which I might have anyway) and being *bound* (which excludes certain other reasons).
  *   **Why Accept This?** If "I promise" adds no normative weight beyond "I think this is good," the speech act is redundant. All camps must explain the added "oomph" of the promise.

  ### 6. The Directionality Requirement (Bipolar Normativity)
  *   **Motivating Consideration:** When I break a promise, I wrong *you*, not just the universe.
  *   **The Requirement:** The account must distinguish between an obligation *owed to* a specific person (giving them standing to resent) and a duty of *personal integrity* (where only the promisor has standing to judge).
  *   **Why Accept This?** Even integrity-based theorists must explain why the promisee has a unique right to release the promisor, a right a third party lacks.

  ### 7. The Undertaking Distinction (Promise vs. Prediction)
  *   **Motivating Consideration:** "I will be there" (Prediction) vs. "I promise I will be there" (Undertaking).
  *   **The Requirement:** The account must explain how the speaker places the future conduct under their normative control, rather than merely forecasting it based on evidence.
  *   **Why Accept This?** If a promise is just a strong prediction, lying about intentions is not distinct from being mistaken about the future. The theory must capture the *creation* of a norm, not the *reporting* of a fact.

  ### 8. The Interpersonal Invocation (Promise vs. Resolution)
  *   **Motivating Consideration:** A private resolution to quit smoking has the same content as a promise to a friend to quit.
  *   **The Requirement:** The account must identify what normative work the *communication to another* performs.
  *   **Why Accept This?** This is the core of your dispute. Even if your friend argues promises are just public resolutions, they must explain why the *publicity* changes the normative stakes (e.g., by creating reliance or transferring a right). A theory that treats them as identical fails to capture the social practice.

  ---

  ## III. Structural Properties

  ### 9. The Binary vs. Scalar Question
  *   **Motivating Consideration:** Some promises seem weightier (marriage vows) than others (lending a pen).
  *   **The Requirement:** The account must declare whether bindingness is a threshold concept (you are either bound or not) or a matter of degree (strength of obligation varies).
  *   **Why Accept This?** The theory must match the phenomenology of deliberation. Do we weigh the *existence* of the obligation against other duties, or the *weight* of the obligation?

  ### 10. The Transferability Constraint (Special Constraint)
  *   **Motivating Consideration:** Can you sell your right to be promised? Can I sell my obligation to perform?
  *   **The Requirement:** The account must specify whether the claim-right (promisee's) or the duty (promisor's) is alienable without consent.
  *   **Why Accept This?** This reveals the locus of bindingness. If the right is transferable, the obligation is likely abstract/impersonal. If it is not, the obligation is inherently relational. Any adequate theory must take a stance on the property-like nature of the obligation.

  ---

  ## IV. Triage: Non-Negotiable vs. Contested

  ### Non-Negotiable (Linguistic and Logical Minimums)
  *These must be met by any theory claiming to describe the practice of promising.*
  1.  **Contextual Felicity:** Must distinguish real promises from theatrical ones.
  2.  **Undertaking vs. Prediction:** Must explain the difference between creating a norm and forecasting an event.
  3.  **Content Specificity:** Must provide a rule for determining what was promised.
  4.  **Interpersonal Invocation:** Must explain why communication matters (even if the explanation is "it triggers a convention").

  ### Contested (Metaphysical and Moral Preferences)
  *These are where camps diverge. A theory can fail these and still be a theory, but it will belong to a specific camp.*
  1.  **Persistence (Death/Forgetfulness):** Reliance theorists struggle here; Will theorists embrace it.
  2.  **Directionality:** Integrity theorists collapse this; Rights theorists prioritize it.
  3.  **Binary vs. Scalar:** Kantians prefer binary; Utilitarians prefer scalar.
  4.  **Transferability:** Contractarians often allow it; Moralists often forbid it.

  ---

  ## V. Flagged Incompatibilities

  There is a structural tension inherent in the specification that no theory satisfies perfectly.

  **The Autonomy-Reliance Collision:**
  *   **Demand A (From Will/Agency):** The obligation must arise from the promisor's act alone (Voluntariness Threshold). If I bind myself, my will is the source.
  *   **Demand B (From Directionality/Persistence):** The obligation is *owed to* the promisee and persists even if they are unaware (Deceased Promisee).
  *   **The Conflict:** If the obligation arises from *my* act alone, why does *your* status (alive/dead/aware) matter? If it matters that it is *owed to you*, does your acceptance create the bond?
      *   *If Yes:* Then it's not bound by my act alone (violates Demand A).
      *   *If No:* Then why can you release me? (violates Demand B).
  *   **Verdict:** Any theory will have to privilege one side. Will theories sacrifice the depth of the relational bond; Reliance theories sacrifice the purity of the promisor's agency.

  ---

  ## VI. Scorecard of Main Families

  | Desideratum | Will-Based (Autonomy) | Practice/Convention (Rawls/Scanlon) | Expectation/Interest (Reliance) | Rights-Transfer |
  | :--- | :--- | :--- | :--- | :--- |
  | **Persistence (Death/Forget)** | **Pass.** The will persists beyond the recipient. | **Mixed.** Depends if the practice covers the dead. | **Fail.** No reliance/interest exists if dead/forgotten. | **Pass.** The right exists independently of the holder's awareness. |
  | **Voluntariness Threshold** | **Pass.** Central to the theory. | **Pass.** Participation in practice is voluntary. | **Fail.** Focuses on harm, not how obligation arose. | **Mixed.** Focuses on the transfer, not the will. |
  | **Contextual Felicity** | **Mixed.** Hard to explain why "stage will" doesn't bind. | **Pass.** Rules of the practice define the context. | **Pass.** No reliance expected in fiction. | **Pass.** Transfer rules don't apply in games. |
  | **Obligation vs. Reason** | **Pass.** Self-legislation creates categorical imperatives. | **Pass.** Rule-utilitarian logic creates obligations. | **Fail.** Often collapses into "reason to prevent harm." | **Pass.** Rights create strict duties. |
  | **Directionality (Owed To)** | **Fail.** Often reduces to integrity/self-consistency. | **Pass.** Obligations are to participants in the practice. | **Mixed.** Owed to those harmed, but not necessarily the promisee. | **Pass.** Inherently relational (Creditor/Debtor). |
  | **Promise vs. Resolution** | **Fail.** Struggles to show why communication adds bindingness. | **Pass.** Communication invokes the social convention. | **Pass.** Communication induces reliance. | **Pass.** Communication effects the transfer. |
  | **Transferability** | **No.** Personal duty cannot be transferred. | **No.** Practice rules usually restrict this. | **Yes.** If interest is economic, it moves. | **Yes.** Rights are property-like. |
  | **Primary Weakness** | Cannot explain why the promisee has power to release. | Cannot explain private promises outside established practices. | Cannot explain bindingness without actual harm/reliance. | Cannot explain the source of the right being transferred. |

  ### Final Assessment for Your Dispute
  *   **If you favor the "Promise adds something" view:** You need a **Practice** or **Rights-Transfer** model. These satisfy the *Interpersonal Invocation* and *Directionality* requirements best. They explain why a resolution is not a promise: a resolution lacks the second party required to hold the right or invoke the convention.
  *   **If your friend favors the "Public Resolution" view:** They are effectively arguing for a **Will-Based** theory with a reliance caveat. They must argue that *Interpersonal Invocation* is merely evidentiary (proof of the will) rather than constitutive.
  *   **The Dealbreaker:** Check the **Transferability** and **Deceased Promisee** cases. If your friend admits a promise to a dead person binds, they cannot be pure Reliance theorists. If they admit the promisee can release you without your consent, they cannot be pure Will theorists. Use these constraints to force them off the "it's just a resolution" fence.
