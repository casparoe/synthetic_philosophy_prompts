      *Wait, one nuance:* Tolstoy sometimes implies that if it doesn't promote unity, it fails the *true* purpose of art. But technically, under his definition in Chapter 5, it counts as art. I should clarify this tension. The definition is descriptive; the evaluation is prescriptive.

