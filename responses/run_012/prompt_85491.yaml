answer: |-
  You have hit on exactly the right tension in Tolstoy's argument. Your intuition is correct: if art is defined *solely* as the successful transmission of feeling ("infection"), then a demagogue inciting a mob is, by that mechanical definition, an artist.

  Tolstoy knows this. He doesn't deny it. To understand where he draws the line, you have to separate his theory into two distinct layers that often get blurred in summary:

  1.  **The Definition of Art (The Mechanism):** What makes something art rather than non-art?
  2.  **The Evaluation of Art (The Moral Content):** What makes art *good* rather than *bad*?

  Here is a walkthrough of how Tolstoy handles the "demagogue problem" and where the extra conditions come in.

  ### 1. The Mechanism: Infection is Necessary, but Not Sufficient for *Good* Art
  In Chapter 5, Tolstoy gives the famous definition:
  > "Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them."

  You are right that this is a descriptive definition. If a politician gives a speech, genuinely feels rage, and successfully transmits that rage to the crowd so they feel it too, **Tolstoy admits this is art.**

  He does not use the definition to rule out "bad" art. He uses it to rule out art that is *counterfeit* (fake). For Tolstoy, if the artist did not actually feel the emotion they are trying to transmit, it is not art at all; it is merely craftsmanship or imitation.

  So, the first filter is **Sincerity**.
  *   **Demagogue who feels the hate:** This is Art.
  *   **Demagogue who fakes the hate to manipulate:** This is Counterfeit Art (not true art).

  ### 2. The Quality of Infection
  Even if the feeling is sincere, Tolstoy argues in Chapter 10 that the *degree* of infectiousness depends on three conditions:
  1.  **Individuality:** How specific and unique is the feeling?
  2.  **Clarity:** How clearly is it expressed?
  3.  **Sincerity:** How much did the artist need to express this for their own relief?

  A demagogue might score high on clarity and sincerity. So, mechanically, it functions as art. But this still doesn't solve your problem: **Why is this bad?**

  ### 3. The Moral Filter: The "Religious Perception"
  This is the "extra condition" you suspected. It appears later in the book (Chapters 13–16). Tolstoy argues that you cannot judge art merely by how well it transmits feeling; you must judge it by **what feeling is being transmitted.**

  For Tolstoy, every age has a "religious perception"—a collective understanding of what is good and what gives life meaning. In his time (late 19th century), he believed the true religious perception was **Christian universal brotherhood.**

  Therefore, the evaluation of art depends on whether the feeling transmitted unites people or divides them:
  *   **Good Art:** Transmits feelings that unite people in love and brotherhood (e.g., simple folk songs, stories of compassion, Hugo's *Les Misérables*).
  *   **Bad Art:** Transmits feelings that divide people (e.g., patriotism, sexual lust, religious exclusivity, class pride).

  **So, to answer your specific question:**
  Yes, on Tolstoy's view, the demagogue's speech **is art**. However, it is **bad art** (or even a "vice") because the feeling it transmits (hatred/exclusion) opposes the religious perception of the age (universal love/unity).

  Tolstoy writes explicitly about this:
  > "Art... may be a most powerful weapon for the attainment of the good... or it may be a most dangerous weapon... if it transmits feelings... opposing the religious perception of our time."

  ### 4. Why This Confuses Readers
  The confusion arises because Tolstoy wants to have it both ways.
  *   He wants a **universal definition** (infection) that applies to all human history.
  *   He wants a **moral judgment** (Christian unity) that condemns most of the art history he dislikes (including his own *War and Peace*, Wagner's operas, and Baudelaire's poetry).

  He tries to bridge this by saying that "Good Art" is the only art that truly fulfills the *purpose* of art. He argues that the purpose of art is to replace violence with feeling—to make people experience another's life as their own. Therefore, art that incites hatred is technically "art" by mechanism, but it is **frustrating the purpose of art.**

  ### 5. Summary of the Lines Drawn
  Here is how Tolstoy categorizes the demagogue's speech:

  1.  **Is it Art?** Yes, if the speaker sincerely felt the hatred and successfully transmitted it to the audience (Infection).
  2.  **Is it Counterfeit?** No, assuming the speaker wasn't acting.
  3.  **Is it Good Art?** No. It is "Bad Art" because the feeling (hatred) divides humanity rather than uniting it in brotherly love.
  4.  **Is it Dangerous?** Yes. Tolstoy considers bad art more dangerous than no art at all, because it corrupts the soul while disguising itself as something higher.

  ### The Takeaway
  You were right to sense that "infection" wasn't the whole story. Tolstoy's definition of **what art is** (infection) is separate from his definition of **what art is for** (moral unity).

  *   **The Definition** rules out *fake* art (craft without feeling).
  *   **The Moral Theory** rules out *bad* art (feelings that divide).

  Tolstoy's radical move is to insist that aesthetics cannot be separated from ethics. He rejects the idea that a beautifully crafted poem about hate can be "good art" simply because it is beautiful or effective. For Tolstoy, if the moral content is rotten, the art is rotten, regardless of how perfectly it infects the audience.
