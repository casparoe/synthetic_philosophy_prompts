  8.  **Final Polish:** (Self-Correction during drafting) Make sure to emphasize that Tolstoy *does* admit that bad feelings can be transmitted artistically. He doesn't deny that. He condemns them on moral grounds. The definition of "Art" is broad; the definition of "Good Art" is narrow.

