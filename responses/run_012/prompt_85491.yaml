prompt: |-
  I'm trying to get my head round a passage in Tolstoy's What is Art? where he says art is the infection of feeling — that a true work of art transfers the feeling the artist felt to the audience. I get that he's rejecting beauty and pleasure as the definition, but I don't see how his definition rules out bad art. If a demagogue makes a crowd feel hatred and they catch it, isn't that infection too? So on Tolstoy's view, is that art? Or does he have some extra condition about the feeling being good or the union of people in love? Can you walk me through what the passage is actually claiming and where the definition is supposed to draw the line?
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Query:**
      *   **Core Subject:** Tolstoy's *What Is Art?*
      *   **Specific Concept:** Art as the "infection of feeling" (transmission of emotion from artist to audience).
      *   **User's Confusion:** If art is just transmitting feeling, doesn't that include "bad" or harmful art (e.g., a demagogue inciting hatred)?
      *   **Key Question:** Does Tolstoy's definition rule out bad art? Is there an extra condition (good feeling, union in love)?
      *   **Goal:** Walk through the actual claim, explain the criteria, and clarify where the line is drawn between "true art," "bad art," and "non-art" in Tolstoy's framework.

  2.  **Recall/Research Tolstoy's *What Is Art?*:**
      *   *Context:* Written late in Tolstoy's life (1897), after his spiritual conversion. He rejects his own earlier masterpieces (*War and Peace*, *Anna Karenina*) based on these new criteria.
      *   *Definition:* Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them.
      *   *The "Infection" Metaphor:* Yes, it's central. But it's not *just* infection.
      *   *Criteria for Good Art:* Tolstoy distinguishes between the *definition* of art (what makes it art) and the *evaluation* of art (what makes it *good* art).
      *   *Religious/Moral Dimension:* This is crucial. For late Tolstoy, true art must promote Christian brotherhood/unity. Art that divides people (like patriotic war art or exclusive upper-class art) is "bad art" or even "counterfeit art."
      *   *The Demagogue Example:* The user asks about inciting hatred. Tolstoy would likely classify this as art (in the technical sense of transmission) but *bad* art (in the moral sense), or potentially counterfeit if the feeling isn't sincere.

  3.  **Structure the Explanation:**
      *   **Acknowledge the Insight:** Validate the user's intuition. Yes, the "infection" definition *does* technically include demagoguery. That's a feature, not a bug, of his initial definition.
      *   **Distinguish Two Layers:** Separate the *Definition of Art* (transmission) from the *Evaluation of Art* (religious/moral worth). This is the key to answering the "bad art" question.
      *   **The Three Conditions of "Good" Transmission:** Tolstoy isn't just saying "any feeling." He specifies degrees of infectiousness (individuality, clarity, sincerity).
      *   **The Moral/Religious Criterion:** This is the big filter. Art must unite humanity in brotherly love. If it divides, it's bad.
      *   **Address the Demagogue:** Apply the theory directly to the user's example.
      *   **The "Counterfeit" Category:** Tolstoy also talks about art that *looks* like art but isn't (imitation, lack of sincerity).
      *   **Conclusion:** Summarize the nuance.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Initial thought:* Just say "Yes, Tolstoy thinks hate is art but bad art."
      *   *Correction:* It's more complex. He distinguishes between "art" (the mechanism) and "good art" (the moral outcome). Also, sincerity matters. If the demagogue *feels* the hate, it's infectious art. If he's faking it, it's counterfeit.
      *   *Refining the "Infection" concept:* It's not passive. It requires sincerity, clarity, and individuality.
      *   *Refining the Moral aspect:* Tolstoy's Christianity is central here. The "religious perception of the age." Art must serve the highest moral ideal of the time.
      *   *Addressing the User's specific doubt:* The user suspects there's an "extra condition." Yes, there is. It's the *content* of the feeling, not just the *transmission*.

  5.  **Key Passages/Concepts to Include:**
      *   The definition (Chapter 5).
      *   The three conditions of infectiousness (Chapter 10): Sincerity, Clarity, Individuality.
      *   The distinction between "Universal" art (unites all) and "Exclusive" art (divides classes).
      *   The concept of "Christian Art" (uniting in love).
      *   Tolstoy's rejection of Beethoven/Wagner/Shakespeare (to show how strict he is).

  6.  **Synthesizing the Answer:**
      *   *Intro:* You're right to be puzzled. It seems circular.
      *   *Step 1: The Mechanical Definition.* Infection is the *mechanism*. By this metric, propaganda *is* art.
      *   *Step 2: The Quality of Infection.* Sincerity is key. A demagogue might be sincere, but...
      *   *Step 3: The Moral Filter.* This is the "extra condition." Art is judged by the "religious consciousness" of the time. Does it unite or divide?
      *   *Step 4: Counterfeit Art.* Sometimes it's not art at all if it's just imitation.
      *   *Step 5: The Demagogue Verdict.* Tolstoy would say: It's art, but it's *bad* art (or even a vice) because it divides people.
      *   *Conclusion:* Tolstoy sacrifices aesthetic autonomy for moral utility.

