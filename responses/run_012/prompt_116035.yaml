answer: |-
  **WRENFIELD HEALTH ASSURANCE BOARD: ANNUAL SCHEDULE OF COVERED RESTORATIVE INTERVENTIONS (2024/25)**

  **ISSUED BY: WRENFIELD HEALTH ASSURANCE BOARD (FICTIONAL ENTITY); THIS DOCUMENT IS A SATIRICAL ARTIFACT AND MAKES NO CLAIM ABOUT REAL INSURERS OR REGULATORS.**

  **Preamble**
  Coverage is authorised only where an intervention satisfies three tests. First, the Restoration Test: functioning must be returned to the level typical for a person of the claimant's age and sex. Second, the Own-Baseline Test: where pre-morbid functioning was below the typical level, cover is limited to that pre-morbid level; where it was above, cover is limited to the typical level. Third, the Externality Test: interventions conferring primarily positional advantage are excluded. The Board applies these tests mechanically to ensure neutrality.

  **Determinations**

  **1. Claimant: Mr. A. Request: Prosthetic limb matching typical grip strength.**
  Outcome: Partially Approved.
  Justification: Claimant's congenital absence means own-baseline is null; restoration to typical functioning is biologically impossible. Cover is granted for maintenance of current capacity only, as exceeding this would constitute enhancement beyond the achievable restoration limit.

  **2. Claimant: Ms. B. Request: Nerve graft to restore pre-injury tactile sensitivity.**
  Outcome: Partially Denied.
  Justification: Claimant's pre-morbid sensitivity exceeded species-typical norms. Faithful application of the Own-Baseline Test requires capping restoration at the typical level, leaving the claimant with reduced capacity relative to their prior state.

  **3. Claimant: Mr. C. Request: Vaccination to prevent androgenic alopecia.**
  Outcome: Denied.
  Justification: The intervention prevents function loss rather than restoring lost function. As no deficit currently exists, the Restoration Test cannot be satisfied, regardless of future welfare implications.

  **4. Claimants: Mr. D (ADHD) and Ms. E (Shift Worker). Request: Cognitive stimulant.**
  Outcome: Mr. D Approved; Ms. E Denied.
  Justification: For Mr. D, the drug corrects a diagnosed deficit to reach typical focus. For Ms. E, whose focus is typical, the drug confers a competitive advantage, failing the Externality Test despite identical biochemical effects.

  **5. Claimant: Mr. F. Request: Tibial lengthening procedure.**
  Outcome: Denied.
  Justification: The benefit of increased height is exclusively positional relative to peers. As the intervention does not remedy a functional deficit below the typical range, it is classified as enhancement.

  **6. Claimant: Ms. G. Request: Hormone therapy for menopausal symptoms.**
  Outcome: Denied.
  Justification: The Board reclassified menopause from pathological condition to natural life-stage via Vote 2023-12 (7-5). Symptoms arising from a non-pathological state do not qualify for restorative cover.

  **7. Claimant: Prospective Parent. Request: Germline editing for embryo.**
  Outcome: Denied.
  Justification: The Own-Baseline Test requires a pre-morbid state to measure restoration against. As the subject does not yet exist, no baseline can be established, and the test cannot be applied.

  **8. Claimant: Mr. H. Request: Laser correction for myopia.**
  Outcome: Denied.
  Justification: Prevalence of myopia in the claimant's cohort exceeds 60%, rendering it statistically typical. The Board discovers normality through population data; correcting a typical trait constitutes enhancement, regardless of individual impairment.

  **Appeals**
  Appeals against these determinations must cite clerical error in the application of the three tests. Challenges to the tests themselves, or to the statistical data underpinning them, are not admissible.
