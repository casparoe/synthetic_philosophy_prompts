      *   *Verdict:* There *is* a leftover badness, but it is not "mystical." It is rooted in the *relational conditions of agency*. Projects require a future audience or continuation to have the specific kind of meaning we attribute to them. This isn't just "feelings"; it's a structural feature of human agency. However, Dara is right that this cannot easily override individual welfare without dangerous consequences.
      *   *Decision:* The "leftover" is real but normative, not ontological. It changes the *reasons* we have, not necessarily the *units of value* in a utilitarian calculus.

  5.  **Identify What Both Are Missing:**
