      *   **Miguel:** Misses the difficulty of grounding "collective value" without reification. He doesn't explain *why* the human story matters if no one is there to value it.
      *   **Both:** Miss the distinction between *axiological* value (goodness simpliciter) and *reasons for action*. They also miss the "Identity Problem" (Non-Identity Problem implications). If we change the future, we change *who* exists.
      *   **Crucial Missing Piece:** The *Non-Identity Problem*. If we choose extinction vs. continuation, we aren't just harming "possible people" (who don't have rights in some views); we are changing the identity of the future. Also, they miss the distinction between *impersonal value* and *agent-relative reasons*.

