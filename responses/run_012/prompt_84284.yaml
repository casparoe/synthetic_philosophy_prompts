answer: |-
  # Specification for Collective Judgment Aggregation
  **Context:** Standing Committee (e.g., Hospital Tumor Board)
  **Task:** Dynamic aggregation of interconnected judgments over time.

  ## I. Core Desiderata
  An adequate theory must satisfy the following requirements to function as a reliable decision-making body.

  ### 1. Collective Rationality (Consistency)
  *   **Demand:** The set of judgments accepted by the group at any time $t$ must be logically consistent. If the group accepts $P$ and accepts "If $P$ then $Q$," it cannot reject $Q$. Furthermore, judgments at $t_2$ must not contradict judgments at $t_1$ unless explicitly revised via a defined update procedure.
  *   **Motivation:** A tumor board that recommends contradictory treatments (e.g., "Administer Drug X" and "Do not administer Drug X") is useless and dangerous. Consistency is the baseline for actionability. In a standing committee, this extends over time: the group cannot hold a belief today that logically invalidates a treatment path it committed to yesterday without a formal revision mechanism.

  ### 2. Unanimity Preservation
  *   **Demand:** If every member of the committee accepts a proposition $P$, the collective output must accept $P$ (provided $P$ does not violate Consistency).
  *   **Motivation:** Epistemic respect. If all experts agree that "Test A is positive," it is irrational for the committee to record "Test A is negative" or "We don't know." Ignoring universal agreement wastes available information and undermines member morale.

  ### 3. Proposition-wise Independence
  *   **Demand:** The collective judgment on any specific proposition $P$ must depend *only* on the individual members' judgments on $P$. The aggregation rule cannot look at judgments on $Q$ or $R$ to decide the outcome for $P$.
  *   **Motivation:** Fairness and modularity. This prevents "log-rolling" or structural manipulation where a vote on a factual premise is swayed by the desired outcome on a conclusion. It treats each question on its own merits, ensuring that the group's stance on a medical fact isn't held hostage by its stance on a treatment protocol.

  ### 4. Non-Dictatorship
  *   **Demand:** There is no single member whose judgments automatically become the group's judgments, regardless of what others think.
  *   **Motivation:** Distributed expertise. A tumor board exists because no single doctor holds all the relevant knowledge (oncology, radiology, pathology). If one person dictates the outcome, the committee is redundant. The aggregation rule must synthesize diverse inputs, not merely select one.

  ### 5. Allowed Suspension (Non-Completeness)
  *   **Demand:** The rule must permit the collective output to be "No Judgment" or "Abstain" on a proposition, even if individuals have voted Yes/No.
  *   **Motivation:** Epistemic humility and conflict resolution. When evidence is conflicting or the logical implications of a vote are unclear, the committee must be able to pause rather than force a contradiction. This prevents the group from lying about its certainty.

  ### 6. Reflexive Capacity (Self-Application)
  *   **Demand:** The aggregation rule must be able to process judgments about the rule itself (e.g., "This procedure is reliable") without crashing or creating a paradox.
  *   **Motivation:** Institutional trust. A standing committee must periodically evaluate its own efficacy. If the rule forbids judging the rule, the committee cannot self-correct or validate its own authority.

  ---

  ## II. The Incompatibility Constraint
  You cannot satisfy all the above requirements simultaneously on a logically interconnected agenda.

  **The Incompatible Set:**
  1.  **Collective Rationality (Consistency)**
  2.  **Proposition-wise Independence**
  3.  **Unanimity Preservation**
  4.  **Non-Dictatorship**

  *(Note: Allowing Suspension [Desideratum 5] escapes this impossibility only if the committee is willing to suspend judgment frequently enough to avoid contradictions. However, if you add a requirement for **Decisiveness**—that the group *must* reach a conclusion on key propositions to enable treatment—the impossibility returns.)*

  **The Breakdown:**
  If you insist on **Independence** (voting on each issue separately) and **Unanimity** (respecting total agreement), you will inevitably generate **Inconsistencies** (the discursive dilemma) unless you allow a **Dictator** to override the logic.

  ---

  ## III. Critical Analysis of Requirements

  ### The Workhorse Constraint: Proposition-wise Independence
  This is the requirement that does the most work ruling out adequate views. It forces the aggregation mechanism to be "blind" to the logical connections between propositions. By forbidding the rule from looking at how a vote on a premise affects the conclusion, it guarantees that individual consistency will not translate to collective consistency. It creates the silos where the paradox lives. Any theory that satisfies Consistency and Non-Dictatorship must violate Independence.

  ### The Temptation to Drop: Non-Dictatorship
  This is the biggest temptation to abandon. Mathematically, appointing a "Chief Decider" instantly solves the consistency problem and satisfies Independence and Unanimity (for that one member).
  **Why we flinch:** It defeats the purpose of a committee. In a high-stakes environment like a tumor board, relying on a single point of failure ignores the distribution of expertise. It turns a deliberative body into a bureaucracy. We flinch because it sacrifices the epistemic value of the group for procedural simplicity.

  ---

  ## IV. Self-Application Survival
  When the committee applies the rule to judge itself (e.g., voting on "Our process is reliable"):

  *   **Survives:** **Collective Rationality** and **Unanimity**. The group must be consistent about its own reliability, and if everyone agrees the process is broken, the group must acknowledge it.
  *   **Fails:** **Proposition-wise Independence**. To judge whether the *procedure* is reliable, members cannot simply vote "Yes/No" on reliability in isolation. They must evaluate the *structure* of the procedure (how premises link to conclusions). Therefore, the judgment on "Reliability" necessarily depends on judgments about the *aggregation rule itself*, violating Independence. A self-validating committee must look at the whole system, not just vote on the proposition.

  ---

  ## V. Note on Standard Approaches
  *   **Premise-Based Rules:** Aggregate votes on the foundational facts (tests), then derive the conclusion (diagnosis) logically. **Saves Consistency**, but **violates Independence** on the conclusion (the conclusion is determined by the premises, not a direct vote).
  *   **Conclusion-Based Rules:** Aggregate votes directly on the conclusion (diagnosis), ignoring the logical status of the premises. **Saves Independence**, but **risks Consistency** (the group may diagnose a disease while rejecting the tests that confirm it).
