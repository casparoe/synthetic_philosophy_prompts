answer: |-
  # Procedure for Evaluating Diagnostic Proposals with Feedback Risk Assessment

  **Purpose:** To guide the Technical Advisory Group (TAG) in assessing proposals for new or revised diagnostic categories. This procedure supplements standard validity checks with a mandatory assessment of "feedback risk"—the likelihood that the act of naming the condition will alter the condition itself, the population it applies to, and the systems surrounding it.

  **Scope:** Applied to all field-review track proposals.
  **Resources:** 5 members, 6-month timeline, existing data only.
  **Output:** A published recommendation (Accept, Reject, or Defer) with explicit justification.

  ---

  ## Part 1: The Sequential Question Set

  Ask these questions in order. Do not proceed to the next question if the current one triggers a Stop Rule.

  ### Q1: Clinical Coherence and Distinctness
  **Question:** Is there a stable cluster of symptoms that reliably distinguishes this condition from normal variation and from existing neighbouring categories?
  *   **Sufficient Answer:** Data shows a consistent symptom profile with acceptable inter-rater reliability (kappa > 0.6) in diverse settings, and clear boundaries from existing diagnoses.
  *   **Insufficient Answer:** Symptoms overlap heavily with existing categories without clear discriminators, or reliability data is limited to a single specialized clinic.
  *   **Missing Evidence:** Treat as Insufficient.
  *   **Stop Rule:** **Yes.** If the answer is Insufficient, **Reject** the proposal. Do not assess feedback risk for a category that is not clinically distinct.

  ### Q2: Impairment and Utility
  **Question:** Does the condition cause marked impairment in social, occupational, or other important areas of functioning that is not better explained by social circumstances alone?
  *   **Sufficient Answer:** Evidence of functional impairment independent of external stressors, or evidence that the diagnosis predicts response to a specific clinical intervention.
  *   **Insufficient Answer:** Distress is present, but impairment is contingent entirely on external factors (e.g., only impaired because an employer is hostile), or the diagnosis does not change treatment planning.
  *   **Missing Evidence:** Proceed to Q3, but flag as "High Uncertainty" in the final report.
  *   **Stop Rule:** **No.** This question does not stop the process, but a negative answer requires a "Dimensional" rather than "Categorical" design recommendation in Part 3.

  ### Q3: Feedback Risk Screening
  **Question:** Are there pre-existing conditions that suggest this category will generate a strong looping effect (changing the behavior of the diagnosed or the market around them)?
  *   **Sufficient Answer:** No active patient communities using the term, no commercial products (apps, tests) already selling the label, and the definition relies on observer-rated signs rather than self-report.
  *   **Insufficient Answer:** Active online communities already coalescing around the term, existing commercial interest, or criteria heavily reliant on subjective self-understanding.
  *   **Missing Evidence:** Treat as **Insufficient** (assume high risk if the market landscape is unknown).
  *   **Stop Rule:** **No.** This question does not stop the process. A high-risk finding mandates the application of Part 2 (Mitigation Levers).

  ### Q4: The Value Handoff
  **Question:** Given the clinical validity and the feedback risk, is the potential harm of category drift outweighed by the immediate benefit of recognition and resource access?
  *   **Sufficient Answer:** A consensus among the five TAG members that the net ethical utility is positive.
  *   **Insufficient Answer:** The group is split, or the risk of long-term invalidity is deemed catastrophic regardless of short-term gain.
  *   **Stop Rule:** **Yes.** If the group cannot agree on the net utility, the verdict is **Defer**.

  ---

  ## Part 2: Feedback Risk and Design Levers

  If Q3 indicates **Insufficient** (High Risk), you must apply the following levers. You cannot simply note the risk; you must design the category to withstand it. For each lever, choose the setting that balances access against stability.

  ### 1. Wording Specificity
  *   **Option A (Broad):** Uses common language (e.g., "exhaustion," "sadness").
      *   *Buys:* Accessibility, ease of use, reduced stigma.
      *   *Costs:* High risk of "concept creep" where normal experiences are medicalized.
  *   **Option B (Technical):** Uses specific, operationalized descriptions (e.g., "psychomotor retardation," "anhedonia").
      *   *Buys:* Stability, resistance to self-diagnosis.
      *   *Costs:* Barrier to entry, requires clinician training.
  *   **Procedure:** If Feedback Risk is High, **Option B is mandatory.**

  ### 2. Diagnostic Threshold
  *   **Option A (Low):** Few symptoms required, short duration.
      *   *Buys:* Early intervention, wider insurance coverage.
      *   *Costs:* Inflates prevalence, dilutes the meaning of the category.
  *   **Option B (High):** Many symptoms required, long duration, strict impairment criteria.
      *   *Buys:* Protects category validity, reduces false positives.
      *   *Costs:* Excludes marginal cases who may need help.
  *   **Procedure:** If Feedback Risk is High, **Option B is mandatory.**

  ### 3. Gatekeeping
  *   **Option A (Generalist):** Any licensed clinician can diagnose.
      *   *Buys:* Access, speed.
      *   *Costs:* Inconsistent application, higher susceptibility to patient pressure.
  *   **Option B (Specialist):** Requires specific certification or specialist referral.
      *   *Buys:* Consistency, resistance to market forces.
      *   *Costs:* Bottlenecks, inequitable access for rural/poor populations.
  *   **Procedure:** If Feedback Risk is High, **Option B is recommended** unless it creates a critical access barrier for life-saving treatment.

  ### 4. Structure (Categorical vs. Dimensional)
  *   **Option A (Categorical):** You have it or you don't.
      *   *Buys:* Clarity for insurance and schools.
      *   *Costs:* Encourages "borderline" patients to amplify symptoms to cross the threshold.
  *   **Option B (Dimensional):** Severity scale.
      *   *Buys:* Captures nuance, reduces incentive to "qualify."
      *   *Costs:* Harder to use for reimbursement eligibility.
  *   **Procedure:** If the primary risk is symptom amplification to gain resources, **Option B is mandatory.**

  ### 5. Review Clause (Sunset Provision)
  *   **Option A (Static):** Category remains until the next full manual revision.
      *   *Buys:* Stability for research and planning.
      *   *Costs:* Cannot adapt if the category drifts.
  *   **Option B (Scheduled Review):** Category expires or requires re-validation in 3 years.
      *   *Buys:* Ability to correct course if looping occurs.
      *   *Costs:* Administrative burden, uncertainty for patients.
  *   **Procedure:** If Feedback Risk is High, **Option B is mandatory.**

  ---

  ## Part 3: The Value Handoff Statement

  **Instruction:** When the procedure leads to a decision that restricts access (Reject or Defer) despite clinical evidence of suffering, or accepts a category despite high feedback risk, insert this statement into the report.

  > "This recommendation rests on a value judgment, not solely on evidence. The evidence confirms that individuals suffer [Condition X]. However, the TAG judges that formalizing this category carries a risk of [Specific Harm, e.g., widening the condition / medicalizing a social problem] that outweighs the benefit of immediate recognition. We are prioritizing the long-term validity of the diagnostic system over the short-term utility of the label for resource allocation. This decision effectively places the burden of proof on those who wish to medicalize this experience to demonstrate that the social costs of non-diagnosis exceed the clinical costs of category drift."

  **Who Decides:** This statement is signed by the Chair of the TAG, acknowledging that the group is acting as a policy body, not just a scientific one.

  ---

  ## Part 4: Worked Applications

  ### Case 1: Prolonged Grief Reaction
  **Proposal:** A category for grief persisting beyond 12 months with marked impairment.
  **Clinical Evidence:** Strong. Distinct from depression. Predicts response to specific therapy.
  **Feedback Risk:** Moderate. Patient groups exist but are seeking validation, not creating symptoms.
  **Application of Levers:**
  *   *Wording:* Technical (focus on yearning/preoccupation, not just "sadness").
  *   *Threshold:* High (12 months is already strict).
  *   *Gatekeeping:* Generalist permitted (grief is common).
  *   *Review:* Static (grief norms change slowly).
  **Verdict:** **Accept.**
  **Reasoning:** The clinical need is high, and the looping risk is primarily positive (validation reduces isolation). The strict duration criterion (12 months) acts as a natural buffer against over-diagnosis. The procedure allows this because Q3 risk is manageable with existing thresholds.

  ### Case 2: Work Exhaustion and Detachment (Occupational Burnout)
  **Proposal:** A category for exhaustion/cynicism tied specifically to work, causing impairment.
  **Clinical Evidence:** Mixed. Symptoms overlap with depression and anxiety. Impairment is often contingent on the work environment, not internal pathology.
  **Feedback Risk:** **Critical.** Unions and advocacy groups explicitly want the diagnosis to force employer liability. Clinics are already marketing "burnout recovery."
  **Application of Levers:**
  *   *Wording:* Even with technical wording, the link to "work" makes it situational.
  *   *Threshold:* Lowering it helps workers; raising it makes it useless for advocacy.
  *   *Gatekeeping:* If specialists only, access is too low for the intended political utility.
  *   *Review:* A sunset clause would undermine the long-term leverage advocates seek.
  **Value Handoff:** The TAG recognizes that clinicians want this to help patients secure leave, and advocates want it to regulate employers. However, Q2 (Impairment) is confounded by social circumstances. Making this a medical diagnosis medicalizes a labor dispute.
  **Verdict:** **Reject.**
  **Reasoning:** This is the unwelcome verdict. The procedure forces this because Q2 identifies the impairment as situational, and Q3 identifies a high risk that the category will be used as a tool for resource extraction rather than clinical care. The design levers cannot fix this: you cannot write criteria that prevent the diagnosis from being used as a lever against employers without making the diagnosis useless for the patients who need leave. The harm of converting a social/occupational issue into a psychiatric pathology outweighs the clinical utility. The recommendation should be to code this in a non-psychiatric chapter (e.g., Factors Influencing Health Status) to allow tracking without creating a psychiatric identity.

  ### Case 3: Compulsive Digital Technology Use
  **Proposal:** A category for compulsive use of smartphones/social media.
  **Clinical Evidence:** Weak. Symptoms fluctuate with technology updates.
  **Feedback Risk:** **Extreme.** Apps, clinics, and self-tests are already selling the label. The technology changes faster than the manual.
  **Application of Levers:**
  *   *Wording:* Any definition will be outdated in 2 years.
  *   *Threshold:* Impossible to set when the "drug" changes constantly.
  *   *Gatekeeping:* Specialists cannot keep up with tech literacy.
  *   *Review:* Even a 3-year review is too slow.
  **Verdict:** **Defer.**
  **Reasoning:** The procedure forces a deferral because Q1 (Coherence) is unstable and Q3 (Feedback Risk) shows an active market waiting to exploit the label. To accept this would be to validate a commercial niche that may not exist in 5 years.
  **Conditions for Revisit:** We will revisit if: (1) The technology platform stabilizes for a minimum of 5 years; (2) Longitudinal data shows the symptom cluster persists independent of specific app features; (3) A non-commercial body establishes diagnostic standards.
  **Responsibility:** The Association's Research Office is tasked with monitoring literature every 24 months.
  **Wording:** "Not due to lack of suffering, but due to instability of the object. We cannot diagnose a moving target."

  ---

  ## Part 5: Limitations and Failure Modes

  This procedure is a tool, not a shield. You must disclose its limits in your final report.

  **1. What It Cannot Do**
  *   **It cannot prevent appropriation.** Advocacy groups may ignore the "Technical Wording" lever and use the common name anyway. We can write "Major Depressive Episode," but the public will say "Depression." We cannot control the colloquial drift.
  *   **It cannot measure moral harm.** The procedure flags value judgments, but it cannot calculate whether it is worse to deny a suffering person a label or to give them a potentially stigmatizing one. That remains a human judgment.
  *   **It cannot predict black swans.** A category might be stable for ten years and then loop violently due to an external event (e.g., a pandemic, a new drug).

  **2. Expected Failure Modes**
  *   **Gaming by Inflation:** Proponents will flood Q1 with data from specialized clinics where reliability is high, knowing real-world reliability will be lower. *Counter-measure:* Require at least one dataset from a general practice setting.
  *   **Gaming by Fear:** Opponents will exaggerate Q3 Feedback Risk to block categories that threaten their interests (e.g., insurers blocking a category that mandates coverage). *Counter-measure:* Require evidence of existing market activity, not just theoretical risk.
  *   **The "Permanent Deferral":** A "Defer" verdict often becomes a "No" because no one notices when the conditions for revisit are met. *Counter-measure:* The "Responsibility" clause in the Defer verdict must be assigned to a specific job title, not a committee. If that person leaves, the task transfers to their successor automatically.
  *   **The Evidence Trap:** When clinical evidence is strong (Case 1) but feedback risk is unmeasurable. The procedure biases toward acceptance here. This is a known failure mode: we may validate a category that later loops destructively because we had no method to measure the risk at T=0. We must accept that some harm is unknowable in advance.

  **Closing Instruction:** When you publish the recommendation, do not hide behind the procedure. If the procedure says "Reject" but your conscience says "Accept," you must override the procedure and state clearly: "We are accepting this against the advice of the feedback assessment because the moral imperative to act now outweighs the risk of future drift." Own the deviation. The procedure is there to force you to think, not to think for you.
