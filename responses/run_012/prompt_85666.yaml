answer: |-
  **Total Mark: 15/20**

  **Part (a) Reconstruction: 4/4**
  *   **What's right:** You clearly distinguish the ontological premise (social facts = individuals) from the explanatory conclusion (explanations must name individuals). You correctly identify the hidden premise required to bridge the two (that explanatory power tracks metaphysical composition).
  *   **Full credit:** This is exactly what was required. No changes needed.

  **Part (b) Validity: 6/6**
  *   **What's right:** You correctly identify that the inference is invalid. Your reasoning is precise: ontological supervenience does not entail explanatory reduction. The distinction between "metaphysical basicality" and "explanatory relevance" is the standard and correct counter-argument here.
  *   **Full credit:** Perfect. You grasped the core philosophical distinction the question was testing.

  **Part (c) Multiple Realizability: 1/4**
  *   **What's wrong:** You have inverted the standard argument. In the philosophy of social science, Multiple Realizability (MR) is typically used to *defend* holism/autonomy, not individualism. If "high-trust society" is realized by *different* individual arrangements in different contexts, there is no *single* individual-level law that explains it. The social-level term captures the commonality that the individual-level descriptions miss. You argued that MR makes the individual level the one "carrying the load," but MR is usually the argument for why the individual level is *too specific* to do the explaining.
  *   **What a full-credit answer would say:** MR undermines the colleague's case. Because the same social fact can be realized by heterogeneous individual facts, reducing the explanation to the individual level loses the generalization. The social-level explanation is *better* precisely because it abstracts away from the varying individual details.

  **Part (d) Durkheim and Popper: 4/6**
  *   **Durkheim (3/3):** Excellent. You correctly note he accepts ontological individualism (no "group mind") but rejects explanatory individualism (social facts explain social facts). The suicide example is apt.
  *   **Popper (1/3):** Two issues. First, you included Weber, who was not asked for; this ate into the space needed to flesh out Popper. Second, your characterization of Popper is slightly off. Popper is a methodological individualist, but he does *not* reject unintended consequences. His "Situational Analysis" explains unintended social outcomes (like market prices) as the result of individuals acting within a specific logic of the situation. He opposes *holistic* explanations of those outcomes, not the outcomes themselves.
  *   **What a full-credit answer would say:** Durkheim: Social facts exert external constraint; must explain rates via other rates (integration/regulation). Popper: Methodological individualism requires tracing social phenomena to individual situations and actions, but acknowledges unintended consequences via the "logic of the situation" (e.g., institutional analysis), without reifying institutions.

  **Summary:**
  Strong grasp of the ontology/explanation distinction (parts a & b are excellent). Significant conceptual error on Multiple Realizability (part c), which is a key argument in this unit. Part (d) suffered from focus (Weber) and a slight misreading of Popper on unintended consequences.
