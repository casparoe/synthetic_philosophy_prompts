  # Joint Statement on Admissions Preferences

  ### Scope and Shared Starting Points
  This document governs our dispute regarding group-based preferences in selective university admissions within pluralistic democracies. We explicitly exclude K-12 schooling, corporate hiring (except the Norwegian boardroom case), and broad reparations policies outside education. We begin from a shared metaphysical skepticism: neither of us treats "merit" as a pre-social fact waiting to be discovered. We agree that role-model effects carry significant weight in these debates, often more than proponents admit, and that the Norwegian gender quota case serves as a critical boundary test due to differences in candidate pool elasticity and stakes. We are not arguing about intentions, but about justice and outcomes. Our goal is not consensus, but precise disagreement.

  ### Agreed Claims
  1.  **Merit is Constructed:** Standard metrics (SAT, grades) are socially constructed proxies, not natural kinds reflecting innate worth.
  2.  **Norway Disanalogy:** The Norwegian boardroom quota is distinct from admissions due to the small, elite candidate pool and different stakes.
  3.  **Role-Model Effects:** Representation creates genuine role-model effects, though quantifying their magnitude remains difficult.
  4.  **Correlation:** Socioeconomic disadvantage correlates strongly with racial, caste, and gender marginalization.
  5.  **Creamy Layer:** The concept of excluding elites from beneficiary groups ("creamy layer") is logically coherent and policy-relevant.
  6.  **Mismatch Empiricism:** The "mismatch" hypothesis is an empirical claim about outcomes, not merely an ideological objection.
  7.  **Stigma Risk:** Stigma attached to preferential admission is a genuine harm risk for beneficiaries.
  8.  **Institutional Value:** Diversity provides institutional value beyond the individual benefit to the admitted student.
  9.  **Imperfect Metrics:** Current admissions metrics imperfectly predict long-term professional success or civic contribution.
  10. **Transparency:** Transparency in admissions criteria is inherently desirable for public trust.
  11. **Historical Causality:** Historical injustice causally impacts present-day opportunity structures and preparation.
  12. **Individual Dignity:** Individual dignity cannot be wholly sacrificed for aggregate group goals without moral cost.
  13. **Evidence Responsiveness:** Policy must be responsive to new longitudinal evidence regarding student outcomes.
  14. **Intentions Insufficient:** Good intentions do not immunize policies from negative unintended outcomes.

  ### Where We Still Disagree

  | Issue | Skeptic (Class/Merit) | Defender (Group/Redress) |
  | :--- | :--- | :--- |
  | **Unit of Justice** | Justice is owed to individuals suffering hardship; identity tags are rough proxies for disadvantage. | Justice is owed to subordinated groups; individual wealth doesn't erase caste stigma or historical exclusion. |
  | **Merit Baseline** | Preferences abandon a fair baseline, privileging identity over academic preparation and fairness. | Preferences reveal the baseline was rigged; identity is relevant preparation for navigating institutional barriers. |
  | **Mismatch Harm** | Students placed beyond their preparation level suffer net academic and professional harm relative to alternatives. | Access to elite networks outweighs relative grading struggles; harm is overstated compared to exclusion costs. |

  ### Cruxes
  1.  **Historical Wrongs (Group vs. Individual)**
      *   *Concrete Case:* A wealthy Dalit applicant in India vs. a poor Upper Caste applicant.
      *   *Prediction:* If the wealthy Dalit still faces distinct social stigma despite wealth, the Defender wins (group harm exists independent of class). If class equalization removes the barrier, the Skeptic wins.
  2.  **Merit Baseline (Abandoned vs. Visible)**
      *   *Concrete Case:* The Norwegian boardroom quota performance data.
      *   *Prediction:* If firm performance does not drop after quotas, the Skeptic admits merit was socially constructed. If performance drops significantly, the Defender admits constraints matter more than representation.
  3.  **Mismatch Effect (Real vs. Negligible)**
      *   *Concrete Case:* Law school bar passage rates comparing preferred admits at elite schools vs. non-preferred admits at lower-tier schools.
      *   *Prediction:* If preferred admits pass at lower rates than they would have at lower-tier schools, the Skeptic wins on harm. If rates are comparable or better, the Defender wins on access.
  4.  **The Creamy Layer Test**
      *   *Concrete Case:* Excluding wealthy beneficiaries from affirmative action pools.
      *   *Prediction:* If excluding wealthy beneficiaries satisfies justice claims, the Skeptic admits group focus has limits. If it is seen as unjustly stripping group rights, the Defender admits class is secondary to caste/identity.

  ### What Turned Out to Be Verbal
  A significant portion of our conflict rested on divergent definitions of "merit." For the Skeptic, merit primarily denotes "predictive validity" regarding academic success; thus, preferences look like an abandonment of accuracy. For the Defender, merit often connotes "desert" based on overcoming structural hurdles; thus, preferences look like a correction of the metric itself. Once we distinguished *predictive merit* from *normative desert*, several disagreements sharpened into empirical questions rather than semantic stalemates. Additionally, we often used "quota" interchangeably with "preference," though we agree strict quotas (fixed numbers) are legally and practically distinct from holistic preferences (flexible weighting).
