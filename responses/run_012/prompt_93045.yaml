      *   *Correction:* Premise (7) says "the world can't vote." This is an empirical claim about capacity. The counter is: We don't need the *whole* world to vote, we need a mechanism to determine *which* affected parties are sufficiently affected to vote.
      *   *Key Insight:* The "Boundary Problem" (Whelan). The decision *about* the boundary must itself be democratic. This leads to regress. The only way out is to accept that boundaries are *provisional* and *contestable*.
