      *   *Wait, the user wants to save AAIP.* The best defense of AAIP against the "unboundedness" charge is to argue that **representation** mediates the gap between "affected" and "voter." (Goodin's solution). Or, argue that the demos is **fluid** (Fraser).
      *   *Let's look at Premise (7) again.* "The world can't vote." True. But does the *whole* world need to vote on *every* ripple? No. We need institutional filters.
