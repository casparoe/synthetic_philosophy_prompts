      *   **Option 1: The "Significance" Threshold (Attacking 5/6).** Interests must be *substantive*, not trivial. Cost: Who decides significance? Risk of circularity.
      *   **Option 2: The "Constitutive" Move (Attacking 7).** The demos is not a pre-existing body. It is constituted through the claim-making process. (Fraser/Disagreement). Cost: Instability, requires robust transnational institutions.
      *   **Option 3: Representation vs. Membership (Attacking 4).** Affected interests require *representation*, not necessarily *votes*. (Goodin). Cost: Dilutes the "all-affected" into "all-represented."
      *   **Addressing the Specific Question:** Can a demos constitute itself? Yes, but it requires a shift from "boundary as fence" to "boundary as horizon."
