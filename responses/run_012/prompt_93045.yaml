      *   **Strategy B: Attack the "Pre-Political Boundary" Assumption (Premise 7/9).**
          *   *Argument:* The demos doesn't need to exist *before* the decision. It can be constituted *through* the process. This addresses the user's specific question ("can a demos constitute itself?").
          *   *Key Theorists:* Nancy Fraser, Robert Dahl, Frederick Whelan, Arash Abizadeh.
          *   *Verdict:* This is the strongest theoretical move for someone wanting to keep (1).

      *   **Strategy C: Distinguish "Interests" from "Rights/Agency" (Premise 2/3).**
          *   *Argument:* Future people and animals have interests, but they can't participate. Representation, not membership, is the solution.
          *   *Cost:* Moves away from strict AAIP towards a trusteeship model.
