answer: |-
  This is a sharp observation. You have identified a fracture line between **legal doctrine** (which needs clear stories about who is to blame) and **actuarial science** (which needs statistical patterns to price risk).

  The person who mentioned **Fernand Braudel** was pointing you toward the *Annales School* of history. Braudel argued that historians were obsessed with *événements* (short-term events like battles or storms) while ignoring the *longue durée* (slow-moving structures like geography, climate, and trade routes).

  Here is the concrete breakdown of the causal views at play, why the insurance industry keeps them in the same building, and what happens when the climate starts drifting.

  ### 1. The Causal View of "Act of God": The External Interrupt
  The "Act of God" clause presupposes a view of causation called **Interventionist Causation**.

  *   **The Picture:** Reality is a stable chain of human cause-and-effect (I build a house, I maintain a roof). An "Act of God" is an external projectile that smashes into that chain from outside.
  *   **The Time Scale:** This is Braudel's *événementielle* (event time). It focuses on the specific storm on the specific night.
  *   **The Function:** It creates a **break in liability**. If the cause is "external and unforeseeable," then no human actor (you, the builder, the insurer) is responsible for the damage.
  *   **What it requires:** It requires the background (climate/geography) to be static. If the background is stable, then a flood is a "freak." If the background is shifting, a flood is a "trend."

  ### 2. The Actuarial View: Structural Causation
  The mapping and pricing side of the insurance company operates on **Probabilistic Structural Causation**.

  *   **The Picture:** Risk is not an external interrupt; it is a property of the location. The floodplain map admits that the water *belongs* there. The "100-year storm" is not a freak accident; it is a structural feature of the geography, like the slope of the land.
  *   **The Time Scale:** This is Braudel's *longue durée* (structure time). It looks at decades of river gauges to find the "normal" behavior of the system.
  *   **The Function:** This allows for **risk pooling**. If floods are structural, they are calculable. If they are calculable, they can be priced (or excluded).
  *   **The Contradiction:** You cannot logically claim an event is "unforeseeable" (for the legal exclusion) while simultaneously using decades of data to prove you knew exactly how often it happens (for the pricing model).

  ### 3. Does the Practice *Need* the "Act of God" View?
  **Yes, but only for liability, not for math.**

  The insurance company does not need the "freak event" view to calculate premiums. They need it to **draw a boundary around their obligation.**

  If you adopt the Structural View (that floods are a normal, calculable part of the geography), then liability shifts.
  *   **If the flood is structural:** Then the damage is caused by *building a house in a floodplain*. The cause is human planning (zoning, development), not the rain.
  *   **The Legal Consequence:** If the cause is human planning, the insurer might be on the hook, or the state might be on the hook for allowing construction.
  *   **The Doctrinal Fix:** By labeling the flood an "Act of God," the insurer legally re-codes a **structural failure** (building where water goes) as an **external shock** (water came where it shouldn't).

  So, the practice rules out the view that **disaster is endogenous** (born from within the system of human settlement). It insists disaster is **exogenous** (attacking from outside).

  ### 4. What Happens When the Background Drifts? (Climate Change)
  This is where the doctrine becomes **incoherent**.

  The "Act of God" definition usually requires the event to be "unprecedented" or "unforeseeable."
  *   **Static Background:** A 100-year flood happens once a century. It is a statistical outlier. It fits the "freak" category.
  *   **Drifting Background:** If climate change turns the "100-year flood" into a "10-year flood," it is no longer a freak. It is the new normal.

  **The Incoherence:**
  If the background is drifting, the "Act of God" exclusion loses its logical anchor. You cannot claim an event is "unforeseeable" when your own models show the frequency increasing.
  *   **Current Legal Fudge:** Courts are currently struggling with this. Some are beginning to rule that if a risk was *knowable* via climate models, it is not an "Act of God," even if it wasn't *known* by the specific homeowner.
  *   **The Result:** The doctrine is not just underdetermined; it is actively breaking. It relies on a distinction between "Normal Weather" (Insurable) and "Freak Weather" (Excluded). Climate change dissolves that distinction.

  ### 5. Which Rival Views Does the Practice Quietly Rule Out?
  To keep the "Act of God" clause working, the insurance/legal system must silently reject three specific views of causation:

  **A. Immanent Causation (The Risk is Inside)**
  *   *The View:* The damage is caused by the *combination* of rain + vulnerable infrastructure. The water didn't break the house; the house broke against the water.
  *   *Why it's ruled out:* If risk is immanent (inside the system), then the insurer is insuring bad planning. The "Act of God" clause insists the risk is external, protecting the insurer from liability for human stupidity or zoning failures.

  **B. Cumulative Causation (The Slow Crash)**
  *   *The View:* Damage comes from slow degradation (sea-level rise, soil saturation) punctuated by a storm. The storm is just the trigger; the gun was loaded by decades of warming.
  *   *Why it's ruled out:* Insurance contracts require a **discrete event** (a "storm," a "flood"). They do not cover "processes." If the cause is a 30-year warming trend, there is no specific "date of loss," and the policy cannot trigger. The doctrine rules out slow violence.

  **C. Hybrid Causation (Socio-Natural Systems)**
  *   *The View:* There is no such thing as a "natural" disaster. There are only natural *hazards* meeting human *vulnerability*. A hurricane in the ocean is weather; a hurricane in a city is a socio-natural disaster.
  *   *Why it's ruled out:* The "Act of God" clause requires a pure separation between Nature (God) and Man (Liability). Admitting they are hybrid would mean admitting that insurance is actually a subsidy for living in dangerous places, which undermines the actuarial logic of risk-based pricing.

  ### Summary: The Braudel Connection
  Your friend was right.
  *   **Insurance Law** lives in **Event Time** (The Storm). It needs the storm to be a unique, external interrupt to deny liability.
  *   **Actuarial Science** lives in **Structure Time** (The Floodplain). It needs the storm to be a predictable, recurring structural feature to price premiums.

  They live in the same building because the **Structure Time** data is used to justify the **Event Time** exclusions. ("We know floods happen here *structurally*, which is why we exclude them *eventually*.")

  **The Verdict:** The doctrine is not logically coherent under a drifting climate. It is a **liability shield** masquerading as a causal description. It works only as long as everyone agrees to pretend that the "background" is static. Once the background moves, the "Act of God" becomes a legal fiction that contradicts the insurer's own maps.
