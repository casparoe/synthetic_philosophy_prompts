      *   **The Causal View of "Act of God":**
          *   It presupposes *Event Causation*. The storm is an external interrupt.
          *   It treats the background (geography/climate) as a static stage.
          *   It requires *unforeseeability* (in the legal sense of "could not be guarded against").
      *   **The Actuarial View (The Contradiction):**
          *   Actuarial science uses *Structural Causation*.
          *   Risk is inherent in the location, not just the weather.
          *   The "100-year flood" is a structural feature, not a freak accident.
      *   **Can the Doctrine Work with Structural Causation?**
          *   Yes, but it changes the liability. If the structure causes the loss, the *builder* or *zoner* is liable, not the "God."
          *   Currently, the doctrine rules out *Systemic Liability*. It protects insurers from having to pay for bad planning disguised as bad weather.
      *   **The Climate Change Problem (Drifting Background):**
          *   If the structure drifts, the "freak" category collapses.
          *   Is it incoherent? Yes, legally. A "100-year flood" happening every 10 years isn't an act of God; it's a policy failure.
          *   The doctrine becomes a tool for denial rather than a description of reality.
      *   **Rival Views Ruled Out:**
