prompt: |-
  I run privacy review at a mid-sized consumer software company. A few dozen product features cross my desk each quarter, each on roughly a one-week clock, and my sign-off has to survive two audiences that share none of my concerns: a legal review that cares only about statutes and a public post-mortem if we ship something and it goes wrong. My team is made up of lawyers and product managers with no philosophical training, so whatever you give me has to be runnable by them without the theory behind it. The philosophy of privacy is the only body of thought I know of that takes seriously the things a compliance checklist cannot see: that a flow of information can be entirely lawful and still wrong; that privacy is not secrecy, so the nothing-to-hide objection settles nothing; that the relevant unit of concern is not always the individual whose data it is; and that the wrong of a privacy violation can survive even when no one can point to a concrete harm. I want you to turn the usable part of that literature into a procedure.

  Write it as an ordered set of questions a reviewer asks of a proposed feature. The questions should surface what the feature changes about who knows what about whom, in which role, under the norms of which context, and against which expectations of the people involved; whether it substitutes one kind of relationship for another (friends into mutual monitors, customers into suspects, patients into data subjects); whether the individual's control over the flow is preserved or quietly reassigned to someone else; and whether the interest at stake is individual, relational, or collective, and who bears the cost when those diverge. For each question, say what counts as a sufficient answer, where the procedure terminates in a refusal, and where it must hand the decision to a person because the question is one of values rather than facts. The procedure must not collapse into "obtain consent": I need to know which cases consent can rescue and which it cannot, and why the difference matters. Where the literature disagrees with itself — for instance over whether privacy is best understood as control over information, as limited access to the self, or as the fit between a flow and the norms of its context — say which reading your procedure commits to and what it therefore cannot see.

  Then run it, step by step, on three features, marking as you go the points where the procedure strains:

  - A closeness score computed from metadata — how often two users message, call, and are co-located — displayed beside each contact in the address book.
  - An opt-out crisis-detection system that scans messages for indications of self-harm and routes flagged conversations to a human moderator and, in severe cases, to emergency services.
  - A default-on setting that shares a user's precise location with a small circle of family accounts, including adult children monitoring elderly parents.

  At least one of these should come out the way the product team will not want to hear, and you should not soften the verdict to avoid that. Finish by saying plainly what the procedure cannot do: the cases where it will give a confident-sounding answer on the basis of a contested norm, the cases where two of its questions point in opposite directions and the tiebreak is a political choice rather than an analytic one, and the cases where the honest output is that the feature is not wrong but the company should not ship it anyway. Do not cite sources or supply a reading list; I care about the machinery, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Privacy Review Lead at a mid-sized consumer software company.
      *   **Constraint 1 (Audience):** Legal (statutes only) and Product/Legal Team (no philosophical training). The output must be *runnable* by them.
      *   **Constraint 2 (Time/Volume):** Dozens of features/quarter, one-week clock. Needs to be efficient but deep.
      *   **Constraint 3 (Philosophical Grounding):** Must incorporate insights from the philosophy of privacy (contextual integrity, relational privacy, harm beyond concrete damage, nothing-to-hide rebuttal, collective vs. individual interests).
      *   **Constraint 4 (Format):** Ordered set of questions (a procedure). For each question: sufficient answer, refusal condition, hand-off condition (values vs. facts).
      *   **Constraint 5 (Consent):** Must not collapse into "obtain consent." Must distinguish where consent works vs. where it doesn't.
      *   **Constraint 6 (Theoretical Commitment):** Must acknowledge disagreements in the literature and state which reading the procedure commits to (and what it blinds itself to).
      *   **Constraint 7 (Testing):** Run the procedure on three specific features (Closeness Score, Crisis Detection, Family Location Sharing).
      *   **Constraint 8 (Verdict):** At least one verdict must be unpopular/uncomfortable for the product team (no softening).
      *   **Constraint 9 (Limitations):** Finish with a plain statement of what the procedure *cannot* do (contested norms, political tiebreaks, "not wrong but don't ship").
      *   **Constraint 10 (No Citations):** No bibliography or source citations.

  2.  **Determine the Philosophical Framework:**
      *   The prompt explicitly mentions "norms of which context," "flow of information," "substitutes one kind of relationship," "control... reassigned." This screams **Helen Nissenbaum's Contextual Integrity (CI)** as the backbone.
      *   It also mentions "relational," "collective," and "cost when those diverge." This requires integrating **Relational Privacy** (e.g., Reiman, Rachels) and **Group Privacy** (e.g., Taylor).
      *   *Commitment:* I will commit primarily to **Contextual Integrity** because it is the most operationalizable for product reviews (mapping flows to norms). However, I must augment it to handle the "collective harm" and "relationship transformation" aspects the user specifically requested.
      *   *Blind Spot:* By choosing CI, I prioritize *appropriateness of flow* over *absolute control* (Privacy as Control) or *seclusion* (Privacy as Secrecy). I need to state this.

  3.  **Drafting the Procedure (The "Machinery"):**
      *   Need to keep it tight for a one-week review cycle.
      *   *Step 1: Context & Roles.* Define the setting.
      *   *Step 2: Flow Mapping.* Who knows what about whom?
      *   *Step 3: Norm Assessment.* Does this fit existing norms or transform them?
      *   *Step 4: Power & Control.* Is agency shifted?
      *   *Step 5: Harm & Interest.* Individual vs. Collective.
      *   *Step 6: The Consent Check.* Can consent fix this?
      *   *Refusal/Hand-off Criteria:* Need to be clear.

  4.  **Refining the Consent Constraint:**
      *   Consent fails when: Power asymmetry is too high, collective harms are externalized, or the transformation of the relationship is fundamental (e.g., turning friends into data points).
      *   Consent works when: Low stakes, individual harm only, genuine alternative exists.

  5.  **Running the Procedure on the Three Features:**

      *   **Feature 1: Closeness Score (Metadata -> Address Book)**
          *   *Context:* Social/Communication.
          *   *Flow:* System infers intimacy -> displays to user.
          *   *Norms:* Intimacy is usually mutual, tacit, or explicitly discussed. Algorithmic scoring objectifies it.
          *   *Transformation:* Friends -> Quantified assets.
          *   *Consent:* Can't consent for the *other* person in the dyad.
          *   *Verdict:* Likely a **Refusal** or heavy mitigation. This hits the "relational" harm hard.

      *   **Feature 2: Crisis Detection (Scan messages -> Moderators/Emergency)**
          *   *Context:* Private communication vs. Safety.
          *   *Flow:* Content scanning -> Third party access.
          *   *Norms:* Therapy/Confidentiality vs. Duty of Care.
          *   *Transformation:* Users -> Patients/Suspects.
          *   *Consent:* Opt-out is coercive in a safety context.
          *   *Verdict:* **Hand-off to Values.** High tension between safety and privacy. Procedure might flag the norm violation, but safety might override. I need to make sure the procedure doesn't just say "Safety wins." It should highlight the *privacy cost* of safety. Let's aim for a "Ship with Strict Guardrails" but acknowledge the normative breach. Actually, to meet the "unpopular verdict" constraint, maybe I push back harder on the *opt-out* nature or the *human moderator* access. Let's make the verdict: **Refusal on current design (Human Review)** due to normative breach of confidential comms, requiring automation-only or stricter thresholds.

      *   **Feature 3: Family Location (Default-on, Adult Children/Elderly Parents)**
          *   *Context:* Family/Care.
          *   *Flow:* Location -> Family.
          *   *Norms:* Care vs. Surveillance. Power dynamics (Adult children monitoring parents).
          *   *Transformation:* Parents -> Wards.
          *   *Default-on:* Removes agency.
          *   *Verdict:* **Refusal on Default-on.** Must be Opt-in. This is a clear control issue.

      *   *Selection for "Unpopular Verdict":* The Closeness Score is the most philosophically interesting "privacy violation without legal violation." I will make the verdict there a hard **Stop/Redesign**. Product teams love engagement metrics; telling them "you can't quantify friendship" is unpopular.

  6.  **Drafting the Limitations Section:**
      *   Must admit where the procedure guesses at norms.
      *   Must admit where political choices (safety vs. privacy) are disguised as analytic ones.
      *   Must admit "Right to be Wrong" (features that aren't privacy violations but are bad for society).

  7.  **Review against Constraints:**
      *   *Runnable by lawyers/PMs?* Yes, if questions are concrete.
      *   *No theory dump?* Keep the intro brief, focus on the questions.
      *   *Consent nuance?* Included in Step 6.
      *   *Theoretical commitment?* Stated in the preamble.
      *   *Three features tested?* Yes.
      *   *Unpopular verdict?* Yes (Closeness Score).
      *   *Limitations stated?* Yes.
      *   *No citations?* Checked.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Tone:* Professional, direct, operational. Not academic.
      *   *Clarity:* Ensure the "Refusal" vs. "Hand-off" distinction is sharp.
      *   *Consent:* Make sure I explicitly explain *why* consent fails in the Closeness Score scenario (asymmetry of the dyad).
      *   *Theoretical Commitment:* I need to be explicit that I am choosing Contextual Integrity over Privacy as Control, but borrowing from Relational Privacy to handle the "friends into monitors" aspect.

      *(Self-Correction on Feature 2)*: If I refuse Feature 2, it might look like I value privacy over life. That's a trap. The procedure should flag the *normative shift* (private comms to monitored comms). The decision to ship despite that is a *value* decision, not a privacy fact. So the procedure should result in a **Hand-off** for Feature 2, explicitly stating "This violates confidentiality norms; Leadership must accept this breach for Safety." But for Feature 1 (Closeness), the verdict can be a **Refusal** because there is no overriding value (like life safety) to balance the relational harm. This satisfies the "unpopular verdict" without being ethically reckless.

      *(Refining Feature 3)*: Default-on location sharing for elderly parents is tricky. It's often sold as safety. But "Default-on" is the killer. The procedure should catch the *assignment of control*. If the adult child controls the toggle, the parent is disempowered. Verdict: **Refusal on Default-On.**

      *(Final check on "Unpopular")*: Feature 1 is the best candidate for a hard "No." Product teams want engagement. Quantifying relationships drives engagement. Telling them "This changes the nature of friendship" is the philosophical pushback the user wants.

  9.  **Finalizing the Text:** Structure:
      1.  Preamble (Theoretical Commitment).
      2.  The Procedure (Steps 1-7).
      3.  Application (The 3 Features).
      4.  Limitations (What this machine cannot do).

      *Wait, one constraint check:* "Where the literature disagrees... say which reading your procedure commits to." I will put this in the Preamble.
      *Constraint:* "For each question, say what counts as a sufficient answer, where the procedure terminates in a refusal, and where it must hand the decision to a person." I will embed this in the Procedure steps.

      *Let's write.*
answer: |-
  ### Preamble: Theoretical Commitment

  This procedure commits to **Contextual Integrity** as its primary framework. It treats privacy not as secrecy or total individual control, but as the appropriate flow of information according to the norms of a specific social context (e.g., healthcare, friendship, commerce).

  **What this sees:** It detects when a feature violates the expectations of a specific relationship or context, even if legal and consensual. It identifies when a feature transforms a relationship (e.g., from friends to data sources).

  **What this blinds the procedure to:** It prioritizes *social norms* over *individual sovereignty*. In a conflict between "I own this data and can do what I want" and "This flow violates the context," this procedure sides with the context. It may underestimate harms that arise purely from aggregation across contexts (the "mosaic effect") unless those aggregations violate a specific contextual norm. It also assumes norms are identifiable; where norms are in flux, the procedure will flag uncertainty rather than resolve it.

  ---

  ### The Privacy Review Procedure

  **Reviewer Instructions:** Answer each question sequentially. If a "Refusal" condition is met, stop and issue a Privacy Block. If a "Hand-off" condition is met, escalate to Leadership with the documented reasoning. If "Sufficient," proceed to the next question.

  #### Step 1: Context and Role Mapping
  **Question:** What is the primary social context of this feature (e.g., healthcare, friendship, employment, commerce), and what roles do the parties occupy (e.g., doctor/patient, friend/friend, platform/user)?
  *   **Sufficient Answer:** A clear statement of the context and roles *before* the feature is enabled.
  *   **Refusal:** The feature conflates two incompatible contexts (e.g., treating a social interaction as a commercial transaction) without a compelling, overriding public interest.
  *   **Hand-off:** The context is ambiguous or emerging (e.g., a new type of social AI interaction).

  #### Step 2: Flow and Norm Assessment
  **Question:** What information flows, to whom, and does this flow adhere to the established norms of the context identified in Step 1? (Norms include: Is this information expected to be shared? Is the recipient appropriate?)
  *   **Sufficient Answer:** The flow matches existing user expectations for this context (e.g., a bank sharing data with a credit bureau).
  *   **Refusal:** The flow violates a core contextual norm (e.g., a private message being read by a moderator without cause, or health data being shared with advertisers).
  *   **Hand-off:** The norm is contested (e.g., users expect privacy, but industry standard is sharing).

  #### Step 3: Relationship Transformation
  **Question:** Does this feature change the nature of the relationship between the parties? Specifically, does it turn a relationship of trust/care into one of monitoring/suspicion, or a subjective bond into an objective metric?
  *   **Sufficient Answer:** The relationship dynamic remains unchanged; the feature is transparent and supportive of the existing bond.
  *   **Refusal:** The feature objectifies a human relationship (e.g., scoring friendship, monitoring employees under the guise of safety) in a way that degrades the intrinsic value of the interaction.
  *   **Hand-off:** The transformation is arguably beneficial but changes power dynamics (e.g., parents monitoring adult children).

  #### Step 4: Control and Agency
  **Question:** Who controls the initiation and termination of the data flow? Is control default-assigned to the data subject, or is it reassigned to the platform or a third party?
  *   **Sufficient Answer:** The data subject retains meaningful, easy-to-access control (Opt-in is preferred; Opt-out is acceptable only for low-sensitivity data).
  *   **Refusal:** Control is removed from the data subject and assigned to a third party (e.g., Family Member B controls Family Member A's visibility) without the subject's explicit, granular consent.
  *   **Hand-off:** Control is shared or interdependent (e.g., messaging requires two parties), creating a conflict of agency.

  #### Step 5: Interest and Harm Distribution
  **Question:** Whose interest is primarily served (Individual, Relational, or Collective), and who bears the risk if the system fails or is abused?
  *   **Sufficient Answer:** The primary beneficiary bears the primary risk, or risks are symmetric.
  *   **Refusal:** The platform or a third party captures the value (e.g., engagement, ad revenue), while the user or a vulnerable third party bears the risk (e.g., stigma, physical safety, loss of autonomy).
  *   **Hand-off:** Collective safety is prioritized over individual privacy (e.g., crisis detection). Leadership must accept the privacy cost.

  #### Step 6: The Consent Test
  **Question:** Can informed consent remedy the issues raised in Steps 2–5?
  *   **Sufficient Answer:** Yes, IF: (1) The harm is purely individual; (2) Power asymmetry is low; (3) A genuine alternative exists (user can say "no" without losing core functionality).
  *   **Refusal:** No. Consent is invalid if: (1) The harm is externalized to a third party who cannot consent (e.g., the other person in a conversation); (2) The feature fundamentally alters the context (you cannot consent to turn a friendship into a data mine); (3) The "choice" is coercive (take it or leave the app).
  *   **Hand-off:** The harm is collective, but the benefit is significant. Leadership must decide if the collective good outweighs the normative violation.

  #### Step 7: Final Verification
  **Question:** If this feature were described in a plain-language post-mortem after a breach or misuse, would the explanation rely on technicalities or on a betrayal of trust?
  *   **Sufficient Answer:** "We made a mistake in implementation, but the intent was sound."
  *   **Refusal:** "We didn't think users would mind," or "It was legal."
  *   **Hand-off:** "We prioritized safety/utility over privacy, knowing the risk."

  ---

  ### Procedure Application

  #### Feature 1: Closeness Score (Metadata -> Address Book)
  *Computes a score based on messaging frequency, call duration, and co-location. Displayed beside contacts.*

  *   **Step 1 (Context):** Social/Friendship. Roles: Friend/Friend. **Pass.**
  *   **Step 2 (Flow):** System infers intimacy level -> displays to User. Norms: Intimacy is usually tacit, mutual, or explicitly discussed. Algorithmic quantification is not a norm of friendship. **Flag.**
  *   **Step 3 (Transformation):** Does this change the relationship? Yes. It turns "friends" into "ranked assets." It encourages users to optimize for the score rather than the relationship. It introduces surveillance into a bond based on trust. **Refusal Condition Met.**
  *   **Step 4 (Control):** User sees the score about their contacts. The *contact* (the other person) has no control over their "closeness" rating being calculated or displayed. **Refusal Condition Met.**
  *   **Step 6 (Consent):** Can consent fix this? No. User A cannot consent on behalf of User B. User B is a third party to this data flow. Their metadata is being used to define a relationship they did not agree to quantify.
  *   **Verdict:** **REFUSE.**
  *   **Reasoning:** This feature violates the normative structure of friendship by objectifying intimacy. It externalizes harm to the non-viewing party (the contact) who cannot opt out. It substitutes a relationship of mutual care with one of unilateral measurement. Consent is impossible because the data subject (the contact) is not the user.

  #### Feature 2: Opt-Out Crisis Detection (Message Scanning -> Moderators/Emergency)
  *Scans for self-harm keywords. Routes to humans. Opt-out available.*

  *   **Step 1 (Context):** Private Communication vs. Healthcare/Safety. Roles: User/Platform. **Pass.**
  *   **Step 2 (Flow):** Message Content -> Human Moderator. Norms: Private messaging implies confidentiality. Human review violates confidentiality norms unless explicitly therapeutic. **Flag.**
  *   **Step 3 (Transformation):** Turns "User" into "Patient" or "Suspect." Changes the platform from a utility to a caretaker. **Hand-off.**
  *   **Step 4 (Control):** Opt-out exists, but default is On. Control is with the platform initially. **Flag.**
  *   **Step 5 (Interest):** Collective/Individual Safety vs. Individual Privacy. Platform bears reputational risk; User bears privacy risk; Third party (emergency services) bears response burden. **Hand-off.**
  *   **Step 6 (Consent):** Can consent fix this? Partially. Opt-out allows individual control, but the *existence* of the scanning changes the nature of the service for everyone (chilling effect).
  *   **Verdict:** **HAND-OFF TO LEADERSHIP.**
  *   **Reasoning:** This procedure identifies a clear violation of confidentiality norms (Step 2) and a transformation of the user relationship (Step 3). However, Step 5 identifies a competing value (Safety/Life). This procedure cannot weigh Life against Privacy. Leadership must explicitly sign off that "We are breaching confidentiality norms to preserve safety," and the Opt-Out must be prominent, not buried. If Leadership will not own the normative breach, Refuse.

  #### Feature 3: Family Location Sharing (Default-On, Precise Location)
  *Shares precise location with family circle. Includes adult children monitoring elderly parents.*

  *   **Step 1 (Context):** Family/Care. Roles: Parent/Child (Adult). **Pass.**
  *   **Step 2 (Flow):** Location -> Family. Norms: Care is a norm; surveillance is not. **Flag.**
  *   **Step 3 (Transformation):** Turns "Elderly Parent" into "Ward." Risks infantilizing an autonomous adult. **Flag.**
  *   **Step 4 (Control):** Default-On. Who controls the toggle? If the Adult Child can enable tracking on the Parent's device without the Parent's active session approval, control is reassigned. **Refusal Condition Met.**
  *   **Step 5 (Interest):** Safety (Child's peace of mind) vs. Autonomy (Parent's dignity). Risk of abuse (stalking/coercive control) is high. **Flag.**
  *   **Step 6 (Consent):** Can consent fix this? Yes, but only if it is Opt-In. Default-On presumes consent where power dynamics make refusal difficult (parents may not want to disappoint children).
  *   **Verdict:** **REFUSE (Current Design).**
  *   **Reasoning:** The "Default-On" setting fails Step 4. It reassigns control from the data subject (the parent) to the viewer (the child). To pass, this must be **Opt-In** for the person being tracked, with a recurring reminder that sharing is active. The feature cannot ship as a default.

  ---

  ### Limitations of This Procedure

  This machinery is not a moral oracle. It will fail you in three specific ways:

  1.  **Contested Norms:** When society is in the middle of a normative shift (e.g., is it normal for employers to monitor Slack?), Step 2 will yield ambiguous results. The procedure will flag this as a Hand-off, but it cannot tell you which side of history to bet on. You will have to make a political choice disguised as a product decision.
  2.  **Analytic Ties:** Step 5 (Interests) and Step 3 (Relationship) may point in opposite directions. A feature might preserve a relationship (Step 3 Pass) but distribute risk unfairly (Step 5 Refusal). The procedure has no weighted scoring system to break this tie. It forces a Hand-off, but the "value" decision required is often a calculation of liability vs. revenue, not ethics.
  3.  **The "Not Wrong, But Don't Ship" Gap:** This procedure detects privacy violations. It does not detect *stupidity* or *cynicism*. A feature might pass every step (context is clear, norms are met, consent is obtained) but still be socially corrosive (e.g., a slot machine for children). If the privacy flow is "correct," this procedure will tell you it is safe to ship. It is your responsibility to recognize when a feature is privacy-compliant but still unworthy of your users' time.
