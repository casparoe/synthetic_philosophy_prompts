      *   Did I answer if cannibalism is morally fine? Yes (contextual comparison).

  **(Self-Correction during drafting):** I should avoid saying Montaigne is *not* a relativist. He is often called the father of relativism. I need to nuance that. He is a *skeptic*. His relativism is epistemological (we can't know truth easily) rather than strictly moral (no truth exists). I need to make sure the user understands that distinction. The "barbarism" judgment comes from *reason/nature*, not just French custom.

