answer: |-
  You have hit on exactly the tension that makes this essay a classic, and honestly, you are reading it more carefully than a lot of students who just skim it for the "we are all barbarians" soundbite. Your confusion is well-founded because Montaigne is walking a very tightrope here.

  The short answer is: **No, Montaigne is not saying "nothing is wrong, it's all just custom."** He is not a moral nihilist.

  If you walk away thinking "eating people is morally fine if your culture says so," you have fallen into the trap Montaigne is actually trying to expose. Here is how to resolve the contradiction you're seeing.

  ### 1. The Goal is Self-Critique, Not Anthropology
  Montaigne isn't writing an objective sociological study of the Tupinambá people (the "cannibals" of Brazil). He is using them as a **mirror**.

  His primary target is not the cannibals; it is 16th-century France. France was in the middle of horrific Wars of Religion, where Catholics and Protestants were torturing and burning each other alive over theological nuances.

  When Montaigne says, "We shouldn't judge other cultures," he is specifically attacking **European arrogance**. He is saying: *You call them barbarians simply because they are different from you, not because they are actually worse.*

  ### 2. Redefining "Barbarism"
  This is the key to your contradiction. You asked: *If we can't judge customs, how can he call Europeans barbaric?*

  Montaigne changes the definition of the word "barbarian."
  *   **The European Definition:** A barbarian is anyone who doesn't speak Greek/Latin/French and doesn't follow our customs. (This is arbitrary prejudice).
  *   **Montaigne's Definition:** A barbarian is someone who acts against **Nature and Reason.**

  Montaigne believes there *are* universal standards. He believes that excessive cruelty, hypocrisy, and betraying natural human instincts are objectively "bad."

  So, when he looks at the Tupinambá, he argues that their cannibalism is actually consistent with "Nature." It is done in the context of war and revenge; they eat the dead bodies of enemies they killed in battle. It is brutal, yes, but it is honest.

  When he looks at the Europeans, he sees people burning people alive for heresy, torturing neighbors, and destroying their own societies over dogma. To Montaigne, **this** is what violates Nature and Reason.

  Therefore, he isn't contradicting himself. He is saying:
  1.  Don't call something "barbaric" just because it's foreign (Relativism about *labels*).
  2.  DO call something "barbaric" if it is unnecessarily cruel and violates natural reason (Universalism about *morality*).

  By those standards, the Europeans fail and the cannibals pass.

  ### 3. Is Cannibalism "Morally Fine"?
  Montaigne doesn't exactly say cannibalism is *good*. He says it is **less bad** than what Europeans do.

  He uses a rhetorical strategy called *a fortiori* (argument from the stronger). He is shocking his readers. He knows they are horrified by eating human flesh. So he says, in effect: *"Okay, you think eating a dead body is gross? Fine. But what about torturing a living body? What about roasting a man slowly over a fire because he prays to a different saint? Which is actually more savage?"*

  He isn't drafting a moral code where cannibalism is a virtue. He is using the shock of cannibalism to numb the reader so they will admit that European torture is worse.

  There is a famous line in the essay where he imagines the cannibals coming to France and seeing our religious wars. He writes that they would conclude that **we** are the true barbarians. This confirms that he believes there is a standard of behavior that the Europeans are failing to meet.

  ### 4. So, What Kind of Relativist Is He?
  You asked if you've misread what relativism means here. Yes, slightly.

  *   **Strong Moral Relativism:** "There is no objective truth. Murder is only wrong if your culture says so." (Montaigne does **not** believe this).
  *   **Montaigne's Skepticism:** "We are so blinded by our own habits that we cannot see the truth. We assume our way is the 'Natural' way, but it is just 'Custom.'"

  Montaigne is an epistemological skeptic (doubting how we *know* things) rather than a moral nihilist (believing *nothing* matters).

  He argues that **Custom is a second nature** that overrides our first nature. We get so used to our own ways that we think they are the laws of the universe. His point is that we need to strip away that custom to see what is actually reasonable.

  ### The Takeaway
  You shouldn't walk away thinking "nothing is really wrong." You should walk away thinking:

  1.  **Hypocrisy is the real sin:** It is worse to be cruel while claiming to be civilized than to be brutal while admitting you are in a state of war.
  2.  **Check your lens:** When you feel disgust toward another culture, ask yourself: "Is this actually harmful, or is it just different?"
  3.  **Nature vs. Custom:** There is a difference between what is truly "natural" (universal human reason/compassion) and what is just "normal for us."

  Montaigne is telling you to stop using "custom" as an excuse for cruelty. If the cannibals eat the dead to honor victory, that is their custom. If the Europeans burn the living to enforce dogma, that is their custom. But Montaigne judges both by a higher standard of **humanity**, and the Europeans come up short.

  So, you were right to sense a tension, but the resolution is that Montaigne believes in a universal standard of cruelty and reason—he just thinks his fellow Europeans are failing that standard miserably.
