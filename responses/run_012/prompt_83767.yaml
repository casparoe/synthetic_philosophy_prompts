answer: |-
  Good evening. Welcome to demo night. For those of you who don't know me, I teach the algorithms section. For those who do know me, specifically my mother, who is somewhere in the second row: yes, I did finish college, and yes, this job counts as using my degree.

  I want to talk to you about a bug. Specifically, a digger wasp.

  Here's the story. The wasp hunts a cricket. She stings it, paralyzing it but keeping it alive. She drags it back to her burrow by the antennae. But before she pulls it inside, she has a rule: she drops the cricket at the entrance, goes inside alone to check for intruders, and only then comes back out to drag the prey in.

  It's a sensible safety protocol. Until you interfere.

  If you move the cricket a few inches away while she's inside inspecting the nest, she comes out, finds the cricket, drags it back to the entrance, drops it, and goes inside to check the nest again. She resets the sequence. You can do this forty times. She will do it forty times. She is flexible enough to find the cricket wherever you hide it, but she cannot change the goal. The script is locked.

  There's a word for this behavior. *Sphexishness*. It sounds like a disease, but it just means running a fixed program that looks like thinking from the outside.

  Usually, this is the part of the speech where I tell you: "You are not the wasp. You are flexible. You can change your goals. Go out there and break your loops."

  But I'm not going to say that. Because I'm not sure it's true. Or at least, I'm not sure I know the difference.

  I've been writing backend services for fifteen years. A huge part of my job is building systems that heal themselves. If a connection drops, retry. If a server crashes, restart. If a payment fails, queue it and try again later. I build digital wasps. I build systems that inspect the nest, drag the cricket, and reset if the cricket moves.

  When that code works, we call it "resilience." When the wasp does it, we call it "blind instinct." But look at the mechanics. They're awfully similar.

  I took one ethics class in college. I'm pretty sure I passed it by accident. I don't have the training to tell you where the line is between a complex algorithm and a genuine choice. But I know what it feels like to be tired. I know what it feels like to run a pattern because it's there, because it worked yesterday, because the requirements document says so.

  You just spent twelve weeks here. You've been trained. You've learned patterns. You've learned that when you see this problem, you apply that structure. You've learned to debug, to refactor, to optimize. You are leaving here with a toolbox full of scripts. And you're going to need them. The world is full of crickets that need dragging.

  But here is the thing I want you to feel, not just hear. There will be a moment, maybe six months from now, maybe six years, where the cricket moves. The requirements will make no sense. The architecture will be wrong. The path you were taught to walk will hit a wall.

  In that moment, you will have a choice. Not the big, movie-trailer choice about saving the world. A quiet one. Do you drag the cricket back to the entrance and check the nest again? Or do you stop, stand up, and ask why you're dragging a cricket at all?

  I don't know if we are capable of stepping outside our own code. I look at my own life, at the systems I build, and sometimes I wonder if my "resilience" is just a fancier burrow-check. Maybe we are all just very complicated machines responding to inputs. Maybe the feeling of steering is just another signal in the loop.

  I'm not going to stand here and promise you that you're the authors of your own stories. I don't know that. And frankly, neither do the two instructors I work with who actually read the heavy stuff on this topic. They know the arguments better than I do, and they still show up to teach loops and recursion.

  But here is what I do know. The wasp doesn't know she's repeating herself. She doesn't pause at the entrance of the burrow and wonder if there's a better way to hunt. She just runs.

  You have the capacity to pause. You might not be able to break the loop entirely. You might find that your goals are fixed by biology, or economics, or the fact that you have kids to feed and a mortgage in Columbus. That's okay. That's real.

  But you can notice the script. You can feel the friction when the pattern doesn't fit. You can ask, just for a second, "Is this me choosing, or is this me restarting?"

  I want you to go out there and write great code. I want you to build systems that hold up when the traffic spikes. But I also want you to watch yourself. When the cricket moves, don't just drag it back. Look at the burrow. Look at the wasp.

  See if you can tell the difference between running a program and writing one. I can't tell you what that difference is. But if you spend your career looking for it, that's probably the closest we get.

  Congratulations. You did it. Now go check your nests.
