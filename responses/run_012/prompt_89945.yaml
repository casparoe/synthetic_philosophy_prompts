      *   *Factory Floor:* The site of production. *AI Analog:* The Digital Workspace / Knowledge Economy.
      *   *Workforce:* Laborers. *AI Analog:* Knowledge Workers / Coders / Creatives.
      *   *Complementary Redesign:* Moving from central shaft to unit drive. *AI Analog:* Reorganizing workflows, not just copying/pasting prompts.
      *   *Productivity Lag (Solow Paradox):* 40-50 years for electricity. *AI Analog:* The "missing productivity" in stats despite hype.
      *   *Political Settlement:* Unions, child labor laws, 8-hour day. *AI Analog:* ??? (This is a key gap).
