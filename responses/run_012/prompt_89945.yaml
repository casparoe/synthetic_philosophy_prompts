      *   *Recursion:* Steam engines didn't design better steam engines. AI designs AI. *Impact:* Exponential vs. Linear/S-curve.
      *   *Losers:* Luddites were weavers. AI losers could be the majority (cognitive labor). *Impact:* Political stability.
      *   *State Capacity:* 19th-century states were weak. Modern states are complex but potentially slower than tech. *Impact:* Can regulation actually catch up?
