  *(Self-Correction during drafting Section D)*: The user asks which is closest. I should argue that the *combination* is the problem. AI is an Economic GPT (like Steam) + a Cognitive GPT (like Printing) + a Risk Vector (like Nukes). The optimists cherry-pick the Steam analogy because it has the happiest ending.

  *(Final check on tone)*: Keep it rigorous. Avoid "In conclusion." End with the values/risk distinction as requested.

