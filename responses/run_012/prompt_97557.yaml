      *   *Section 3: The Axioms (The Critical Error).* Explain the swap. Nash = IIA. KS = Monotonicity. Explain *why* (Nash violates monotonicity, KS violates IIA).
      *   *Conclusion:* Summary of what to write in revision notes.

  10. **Refining the "Egalitarian" point:**
      *   There is a solution called the "Egalitarian Solution" (Kalai, 1977). It equalizes $u_1 - d_1$ and $u_2 - d_2$.
      *   KS equalizes $\frac{u_1 - d_1}{u_1^{max} - d_1}$ and $\frac{u_2 - d_2}{u_2^{max} - d_2}$.
      *   The text says KS "gives both players the same payoff." This is demonstrably false unless the ideal points are symmetric.
      *   The text says KS is "usually called the egalitarian solution." This is incorrect terminology in the literature. It is usually called the Kalai-Smorodinsky solution. Sometimes "proportional solution."
      *   *Action:* Emphasize this distinction strongly.

  11. **Refining the Axiom point:**
      *   Nash (1950): Pareto, Symmetry, Invariance to affine transformations (Scale Invariance), IIA.
      *   Kalai & Smorodinsky (1975): Pareto, Symmetry, Invariance, **Individual Monotonicity**. (They replace IIA with Monotonicity).
      *   The text claims KS has IIA and Nash has Monotonicity. This is the exact opposite of reality.
      *   *Action:* This needs to be highlighted as a "Do Not Memorize" error.

  12. **Final Review of the Plan:**
