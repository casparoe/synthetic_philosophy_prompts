answer: |-
  This is a sophisticated impasse. It smells less like a lack of data and more like a category error in the ontology of social change. You are asking me to act as a diagnostician of causal explanation, so I will treat the three families not as competing historical narratives, but as competing metaphysical claims about what a "practice" is and what it means for it to "die."

  Here is my diagnosis, proceeding through candidate explanations, testing your hypothesis, and mapping the path forward.

  ### I. Candidate Diagnoses

  Before committing, let us lay out the three logical possibilities for why this seminar is stuck.

  **Diagnosis 1: The Substantive Causal Disagreement (Monism)**
  *   **The Claim:** All three camps are trying to identify the *efficient cause* of the same event (the disappearance of the practice). They assume a single causal chain.
  *   **The Implication:** Two camps are simply wrong, or incomplete. The Materialist says honor is epiphenomenal; the Argument theorist says economics is incidental.
  *   **Why it fails:** If this were true, we should be able to find cases where economics shifted but the practice remained (falsifying Materialism), or where arguments were perfect but the practice remained (falsifying Argument). We *do* have these cases, yet the camps do not concede. This suggests they are not actually fighting over the same causal variable. They are immunizing their theories by redefining the *explanandum* (the thing to be explained).

  **Diagnosis 2: The Verbal/Definitional Dispute**
  *   **The Claim:** The word "End" is ambiguous.
      *   For the Materialist, "End" = *Functional Obsolescence* (the practice no longer serves a systemic purpose).
      *   For the Honor theorist, "End" = *Status Incoherence* (the practice no longer signals the intended social identity).
      *   For the Argument theorist, "End" = *Normative Refutation* ( the practice can no longer be publicly defended).
  *   **The Implication:** They are talking past each other. A practice can be obsolete but honored (dueling in the 19th century US South), or refuted but profitable (sweatshops).
  *   **Why it fails:** While partially true, this is too charitable. These theorists *claim* to explain the behavioral cessation. The Materialist doesn't just say "it became unprofitable"; they say "it ended *because* it became unprofitable." They are making causal claims, not just definitional ones.

  **Diagnosis 3: The Level-of-Analysis Mismatch (Your Hypothesis)**
  *   **The Claim:** The camps are identifying different *mechanisms* operating at different *temporal stages* of the phenomenon.
  *   **The Implication:** The dispute is a confusion between *selection pressures* (why a practice becomes vulnerable) and *trigger mechanisms* (why it actually stops), further confused by *retrospective narration* (how we justify the stop).
  *   **My Assessment:** This is the strongest diagnosis, but your specific formulation (Selection vs. Legitimation) requires refinement to do the work you want it to do.

  ### II. Testing Your Hypothesis: Selection vs. Legitimation

  You propose: *Interests and Honor are Selection mechanisms; Arguments are Legitimation mechanisms.*

  **Where this works:**
  It explains the "talking past" texture. The Materialist and Honor theorist are describing the *ecological niche* of the practice. They explain why the practice became fragile. The Argument theorist is describing the *language game* played by the survivors to make sense of the change. This aligns with a hermeneutics of suspicion: we tell ourselves we stopped slavery because it was wrong (Argument), when really it stopped because it was expensive (Interest) or unfashionable (Honor).

  **Where this fails (The Uncertainty Flag):**
  To treat Arguments *solely* as legitimation is to strip them of causal power. This is the "cynic's fallacy."
  *   **Counter-evidence:** In the British abolition of the slave trade (1807), the West Indies were still profitable. The honor of the planter class was intact. Yet, a coalition driven by Quaker moral argumentation succeeded. Here, the argument *changed the honor calculus*. It made supporting slavery dishonorable.
  *   **The Problem:** If Arguments can change what counts as Honorable, and Honor determines Interest (social capital is capital), then Arguments are not just post-hoc legitimation. They are *intervening variables*.

  **Revised Hypothesis:**
  The impasse exists because the three families are conflating **Structural Preconditions** (Material/Honor) with **Agential Triggers** (Argument), while failing to distinguish **Behavioral Cessation** from **Normative Delegitimation**.

  *   **Materialist:** Explains *Structural Vulnerability*. (When does the practice become costly to maintain?)
  *   **Honor:** Explains *Social Contagion*. (When does the practice become a liability for the reproducing elite?)
  *   **Argument:** Explains *Normative Tipping*. (When does the practice lose its defensive vocabulary?)

  Your split is correct, but it isn't Selection vs. Legitimation. It is **Conditions of Possibility** (Material/Honor) vs. **Mechanisms of Transition** (Argument).

  ### III. Commitments of Each Side

  To move the seminar forward, you must force each camp to admit their ontological commitments.

  1.  **The Materialist (Williams)**
      *   **Commitment:** Morality supervenes on Economics.
      *   **Blind Spot:** Cannot explain "irrational" persistence (e.g., Dueling was economically destructive but persisted for decades) or "irrational" cessation (e.g., Abolition when slavery was profitable).
      *   **Definition of "End":** The practice is no longer functionally required by the mode of production.

  2.  **The Honor Theorist (Appiah)**
      *   **Commitment:** Morality is a performance of Identity. Norms are enforced by the desire for social esteem.
      *   **Blind Spot:** Cannot explain why honor codes shift. *Why* did dueling become ungentlemanly? Often, it was because Materialists or Argumentists changed the context. Honor is often the *transmission belt*, not the *engine*.
      *   **Definition of "End":** The practice no longer confers status on the relevant reference group.

  3.  **The Argument Theorist**
      *   **Commitment:** Moral Realism/Rationalism. Better reasons lead to better outcomes.
      *   **Blind Spot:** Cannot explain the *reception* conditions. Why were the arguments heard in 1860 and not 1760? Often ignores the material/honor preconditions that made the audience receptive.
      *   **Definition of "End":** The practice can no longer be publicly justified without shame.

  ### IV. Discriminating Cases

  To break the impasse, you need cases where these variables decouple. Do not ask "What caused abolition?" Ask "What happens when X changes but Y stays constant?"

  **Case 1: The "Zombie Practice" (Cessation without Delegitimation)**
  *   *Scenario:* A practice stops due to state coercion or economic collapse, but elites still believe it is good.
  *   *Example:* **Footbinding in early 20th century China.** The state banned it; modernization made it economically disadvantageous for labor. But in many rural areas, the *belief* in its virtue persisted for generations after the *behavior* ceased.
  *   *Discrimination:* Materialists predict cessation. Argument theorists predict delegitimation. If behavior stops while belief persists, Materialism wins on "End as Cessation," Argument theory fails.

  **Case 2: The "Stigmatized Profit" (Delegitimation without Cessation)**
  *   *Scenario:* A practice is universally condemned as immoral, but remains highly profitable and hidden.
  *   *Example:* **Child Labor (Global South, present day)** or **Organ Trafficking.** Everyone agrees it is wrong (Argument won). It is economically viable (Materialist condition met). It is dishonorable (Honor condition met). Yet it persists.
  *   *Discrimination:* This falsifies the strong Argument claim that "winning the moral case ends the practice." It suggests Arguments are necessary but not sufficient.

  **Case 3: The "Gentleman's Loss" (Honor shift without Economic shift)**
  *   *Scenario:* A practice remains profitable but becomes low-status.
  *   *Example:* **Dueling.** By the mid-19th century, dueling was often illegal and economically risky. Yet it persisted among elites until the *definition* of a "gentleman" shifted away from martial prowess toward commercial/bureaucratic competence.
  *   *Discrimination:* Falsifies strong Materialism. The economic cost was already high; the practice died when the *social meaning* of the cost changed.

  ### V. Is Progress Possible?

  The impasse is not permanent, but it requires a shift from **Causal Monism** to **Causal Topology**.

  **The Trap:** The seminar is stuck because everyone is looking for *the* cause. In complex social systems, there is no single cause. There are necessary conditions, sufficient conditions, and triggering events.

  **The Way Forward:**
  Propose a **Sequential Integration Model**.
  1.  **Phase 1 (Vulnerability):** Material conditions shift (Williams). The practice becomes costly or inefficient. *OR* Argumentative pressure makes the practice socially expensive (Appiah).
  2.  **Phase 2 (Tipping):** The cost becomes a status liability. Elites abandon the practice to signal distinction (Appiah).
  3.  **Phase 3 (Ratification):** The behavior ceases. Retrospectively, the Argument is elevated to the primary cause to preserve the self-image of the society (Your Legitimation point).

  **Your Specific Contribution:**
  Your distinction between **Cessation** and **Delegitimation** is the lever to pry this open.
  *   Ask the Materialist: "Can a practice be economically obsolete but morally cherished?" (Yes: Folkways).
  *   Ask the Argument Theorist: "Can a practice be morally refuted but economically necessary?" (Yes: Structural sins).
  *   Ask the Honor Theorist: "What determines which behaviors confer honor?" (Usually a mix of Material viability and Moral argument).

  **Uncertainty Flag:**
  I must flag one risk in your Selection/Legitimation split. It risks becoming a "Just-So Story" itself. If we say "Arguments are just legitimation," we assume we can access the *real* motive (Interest/Honor) behind the *stated* motive (Argument). But social ontology teaches us that **reasons are causes**. If an agent stops a behavior *because* they were convinced by an argument, the argument is a cause, not just a legitimation.
  *   *Correction:* Do not relegate Argument to *mere* legitimation. Relegate it to the **mechanism of transmission**. Interests/Honor determine *which* arguments gain traction. Arguments determine *how* interests/honor are reconfigured.

  ### VI. Recommendation for the Seminar

  Stop asking "Which theory is true?"
  Start asking: **"For this specific practice, what was the sequence of Cessation and Delegitimation?"**

  Create a 2x2 matrix for every case study (Slavery, Dueling, Footbinding, Segregation):
  1.  **Behavior Stopped / Belief Remained** (Coercion/Material collapse)
  2.  **Behavior Continued / Belief Shifted** (Hypocrisy/Structural constraint)
  3.  **Behavior Stopped / Belief Shifted** (Moral Revolution)
  4.  **Behavior Continued / Belief Remained** (Status Quo)

  Map the three theories onto the quadrants.
  *   Materialism explains Quadrant 1 best.
  *   Argument Theory explains Quadrant 3 best.
  *   Honor Theory explains the *transition* from 2 to 3 (why the belief shifted).

  **Final Diagnosis:**
  The impasse is a **Category Mistake regarding the "Event."** The "End of Slavery" is not a point in time; it is a process where economic viability, social status, and moral vocabulary decouple and then recouple. Your hypothesis is correct: they are answering different questions. But do not dismiss Arguments as mere legitimation. Treat them as the *software update* that allows the *hardware* (Interests/Honor) to run a new program.

  If you force the seminar to distinguish **Cessation** from **Delegitimation**, the Materialist will retreat to explaining Cessation, the Argument theorist to Delegitimation, and the Honor theorist to the link between the two. They will stop fighting and start mapping the topology. That is progress.
