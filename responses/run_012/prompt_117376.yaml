      *   Better framing: Arguments operate on the *normative landscape*, Interests/Honor operate on the *incentive landscape*. They interact.
      *   The User's split is a *functional* distinction, but historically they are entangled.
      *   *Correction:* I will argue the User's hypothesis is the most promising *diagnosis of the dispute*, but requires modification as a *theory of history*.

  11. **Final Polish:** Check against constraints. Did I flag uncertainties? Yes. Did I avoid literature survey? Yes. Did I commit to a diagnosis? Yes (with caveats).

  *(Self-Correction during drafting)*: I initially thought about bringing in Foucault or Bourdieu. *Stop.* The prompt says "not a survey of the literature." Keep it conceptual and focused on the three families provided. Use the concepts, not the names (unless necessary for clarity).

  *(Refining the "End" distinction)*: The user distinguishes Cessation vs. Delegitimation. This is crucial. I need to make sure I show how each theory privileges one over the other.
  *   Materialist -> Cessation (Behavior).
  *   Argument -> Delegitimation (Belief).
  *   Honor -> Hybrid (Behavior driven by Belief about Status).

