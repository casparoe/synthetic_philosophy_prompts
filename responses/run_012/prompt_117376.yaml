prompt: |-
  You are a philosopher of history and social ontology who specializes in how moral norms rise and fall, and who can tell a real causal explanation apart from a just-so story. I want a diagnosis of an impasse, not a survey of the literature.

  In my seminar on moral revolutions we keep covering the same ground without converging. Three families of explanation are on the table for the fall of practices like slavery, dueling, and footbinding, and each can point to cases the others seem unable to absorb. The materialist family (the Williams thesis) says such practices died when the interests sustaining them collapsed. The honor family (in Appiah's vein) says they died when they became dishonorable for the elites who kept them alive. The argument family says they died because someone finally made the moral case well enough to be heard. At this point the disagreement isn't really about the evidence; it has the texture of people talking past one another.

  My hypothesis, which I'd like you to test rather than assume: the camps are answering different questions under a single word. "End" conflates a practice's *cessation* (people stop doing it) with its *delegitimation* (people stop believing it needs a defense), and these need not coincide or share a cause. On top of that, interests and honor may be *selection* mechanisms that determine which practices survive, while arguments are *legitimation* mechanisms that determine which already-dead practices get retrospectively justified.

  Diagnose the dispute. Is it a substantive causal disagreement, a verbal one about the sense of "ending," or three parties answering three different questions under one heading? Is my selection/legitimation split doing real work, or does it merely relabel the positions? Say what each side is actually committed to, identify which concrete cases would genuinely discriminate among the stories, and say whether any form of progress is available—a distinction, a decisive case, a better-posed question—or whether the impasse is permanent and why. Begin by laying out the candidate diagnoses before you commit to one, reason step by step, and flag your uncertainties rather than smoothing them over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Persona:** Philosopher of history and social ontology specializing in moral norms, causal explanation vs. just-so stories.
      *   **Task:** Diagnose an impasse in a seminar about moral revolutions (specifically the fall of practices like slavery, dueling, footbinding).
      *   **Input:** Three explanatory families (Materialist/Interests, Honor/Appiah, Argument/Moral Case).
      *   **User's Hypothesis:** The camps are answering different questions. "End" conflates *cessation* (behavior stops) with *delegitimation* (normative belief shifts). Interests/Honor are *selection* mechanisms; Arguments are *legitimation* mechanisms.
      *   **Requirements:**
          *   Lay out candidate diagnoses before committing.
          *   Reason step-by-step.
          *   Flag uncertainties (don't smooth over).
          *   Test the user's hypothesis (don't just assume it).
          *   Identify commitments of each side.
          *   Identify discriminating cases.
          *   Determine if progress is possible or if the impasse is permanent.
          *   Tone: Rigorous, analytical, philosophical, avoiding survey-style literature review.

  2.  **Deconstruct the Three Families:**
      *   *Materialist (Williams):* Economic viability drives morality. Slavery ended because it wasn't profitable (or capitalism needed wage labor).
      *   *Honor (Appiah):* Social status drives morality. Dueling ended because it became ungentlemanly.
      *   *Argument (Moral Case):* Reason drives morality. Abolitionists won because their arguments were irrefutable.

  3.  **Evaluate the User's Hypothesis:**
      *   *Claim 1:* "End" conflates *cessation* (behavior) and *delegitimation* (belief).
      *   *Claim 2:* Interests/Honor = *Selection* (why a practice dies out). Arguments = *Legitimation* (why we say it died).
      *   *Critique:* This is a strong ontological distinction. It suggests functionalism for the cause and expressivism/rationalization for the justification. Does it hold up?
          *   *Potential Issue:* Arguments can *cause* cessation (e.g., convincing someone). Honor can be a form of argument (social pressure). Interests can shape what arguments are heard. The boundaries might be porous.
          *   *Potential Strength:* It explains why the debate feels like talking past one another. One side looks at GDP, one at etiquette manuals, one at pamphlets.

  4.  **Develop Candidate Diagnoses:**
      *   *Diagnosis A: Substantive Causal Disagreement.* They all claim to explain the *same* event (the disappearance of the practice) via the *same* mechanism type (efficient cause), but disagree on the variable. (One is right, two are wrong).
      *   *Diagnosis B: Verbal/Definitional Dispute.* They define "ending" differently. Materialists mean "economically obsolete," Honor means "socially stigmatized," Argumentists mean "morally refuted."
      *   *Diagnosis C: Level-of-Analysis Mismatch (The User's Hypothesis).* They are explaining different *phases* or *aspects* of the phenomenon. Selection vs. Legitimation. Proximate vs. Ultimate causes.

  5.  **Test the User's Hypothesis (Selection vs. Legitimation):**
      *   *Does it do real work?* If Arguments are *only* legitimation, then moral persuasion never causes behavioral change. That seems too strong. Quakers stopped buying sugar *because* of arguments before it was economically inefficient.
      *   *Refinement:* Maybe Arguments are a *transmission* mechanism, while Interests/Honor are *filter* mechanisms. Or maybe Arguments change the *cost function* of Honor/Interests.
      *   *Risk:* If we say Arguments are just post-hoc rationalization, we risk cynicism that ignores the phenomenology of moral change.
      *   *Verdict:* The distinction is useful but needs nuance. It's not just Selection vs. Legitimation; it's *Structural Preconditions* vs. *Agential Triggers* vs. *Retrospective Narrative*.

  6.  **Identify Commitments:**
      *   *Materialist:* Committed to structural determinism. Morality is superstructure.
      *   *Honor:* Committed to social ontology of status. Morality is identity-performance.
      *   *Argument:* Committed to moral realism/rationalism. Morality is truth-tracking.

  7.  **Identify Discriminating Cases:**
      *   *Case 1: Persistence despite economic loss.* (e.g., Dueling was costly and illegal but persisted until honor shifted). Favors Honor over Materialist.
      *   *Case 2: Economic viability despite moral condemnation.* (e.g., Sweatshops today? Or Slavery in Brazil/Cuba after UK abolition). If it persists while profitable but condemned, favors Materialist over Argument.
      *   *Case 3: Moral shift before behavioral shift.* (e.g., People admitting slavery is wrong but keeping slaves due to debt). Distinguishes Delegitimation from Cessation.
      *   *Case 4: Behavioral shift without moral shift.* (e.g., Stopping footbinding because of government decree/tax, not belief). Distinguishes Cessation from Delegitimation.

  8.  **Assess Progress/Impasse:**
      *   Is it permanent? No, but only if we stop asking "What caused the end?" and start asking "What is the causal topology of moral change?"
      *   Need a model that integrates them. E.g., Arguments change the *price* of Honor, which changes the *viability* of Interests.
      *   Uncertainty: Can we ever truly separate "interest" from "honor"? (e.g., Is honor a type of social capital/interest?).

  9.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the depth of the impasse. Validate the user's sophistication.
      *   *Section 1: Candidate Diagnoses.* Lay out A (Substantive), B (Verbal), C (User's/Functional).
      *   *Section 2: Testing the User's Hypothesis.* Critique the Selection/Legitimation split. It's good but maybe too binary. Arguments can be causal.
      *   *Section 3: Commitments.* Map the ontological commitments of each camp.
      *   *Section 4: Discriminating Cases.* Propose specific historical configurations that would break the tie.
      *   *Section 5: Path Forward.* Propose a "Causal Topology" instead of a single cause.
      *   *Tone Check:* Ensure I sound like a philosopher of social ontology (use terms like "supervenience," "efficient cause," "teleological," "phenomenology"). Flag uncertainties explicitly.

  10. **Refining the "Selection vs. Legitimation" point:**
