prompt: |-
  I'm running a session for my local philosophy meetup next month — mostly analytic-trained people, a couple of physicists, nobody who's read any Buddhist philosophy — ninty minutes, one whiteboard, and I've somehow ended up with the tetralemma and emptiness. Don't explain Madhyamaka to me, I've got the general picture; tell me how to teach it. What order do the pieces have to come in so the four corners don't just look like a party trick? What has to be in place before the audience can even see why the list is meant to be exhaustive, and what has to come after before the 'neither' stops looking like a cop-out? We've also been arguing in the group about whether the four alternatives are four answers to a single question or four theses about the thing itself, and I'd like the plan to make that distinction visible rather than assume one reading.

  Pick the one example that carries the whole thing and say what it needs to have and lack. I keep reaching for the chariot and the fire-and-fuel thing and I'm not sure they land on this crowd — tell me honestly whether they do and why, or what to use instead (I'd rather it not be a canon example if a mundane one does the job).

  Then the misconceptions, in the order this lot will actually form them: that emptiness means nothingness or nihilism; that the tetralemma is just relativism, or 'every view is equally wrong'; that it's a four-valued logic with a special 'neither' truth value sitting alongside true and false; that Nāgārjuna is quietly denying causation while helping himself to it whenever it suits; and whatever else you reckon they'll smuggle in from their own training. For each one, tell me exactly where in the sequence I should head it off — before it forms, or after they've committed to it out loud.

  Finish with one question I can put to the room at the end that would tell me whether the idea actually landed, or whether they've just learned to say not-one-not-many-not-both-not-neither in the right places. And say what I should openly refuse to go into at this level, so I don't get dragged into it in the last ten minutes.

  British English please, and be concrete — otherwise I'll be standing at the front winging it.
