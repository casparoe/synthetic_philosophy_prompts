answer: |-
  Here is a concrete plan for a 90-minute session, tailored to an analytic/physics crowd, in British English.

  ### 1. The Core Example: Ditch the Chariot
  **Do not use the Chariot or Fire-and-Fuel.**
  For this crowd, the Chariot smells like "Bundle Theory 101" (which they've likely dismissed or assimilated into Hume/Parfit), and Fire-and-Fuel is too entangled with causal metaphysics to unpack in 90 minutes. They will treat them as historical artefacts rather than logical tools.

  **Use: "The Centre of Gravity."**
  *   **Why it works:** Your physicists will respect it; your philosophers will recognise the ontological category error.
  *   **What it has:** It is calculable, predictable, and causally relevant (it determines stability). It is "real" in a conventional sense.
  *   **What it lacks:** It has no intrinsic location. You cannot point to an atom in the object and say, "The centre of gravity is here." It exists only *in dependence* on the distribution of mass. If you disperse the mass, the centre vanishes. It is not a 'thing' hidden inside the object.
  *   **The Trap:** Physicists might try to say it's "just a mathematical construct." Push back: "It exerts causal influence on the stability of the bridge. Is the bridge's stability a mathematical construct?" This forces them to admit it's *ontologically ambiguous*, which is exactly where you want them.

  ### 2. The Sequence: Building the Trap
  You have 90 minutes. Divide the whiteboard into three sections. Do not reveal the Tetralemma until minute 20.

  **00:00 – 00:15: Establish the Essentialist Assumption**
  Analytic philosophy usually operates under the Law of Excluded Middle (LEM): $P \lor \neg P$.
  *   **Action:** Write "Does the Centre of Gravity exist?" on the board.
  *   **Task:** Ask the room to define what "exist" means in this context. They will default to "mind-independent existence" or "intrinsic nature" (*svabhava*).
  *   **Crucial Move:** Make them commit to the idea that for something to *truly* exist, it must be findable under analysis. If it vanishes when you look for it, it doesn't *intrinsically* exist.
  *   **Why:** This sets the condition for exhaustiveness. The Tetralemma is only exhaustive if we are asking about *intrinsic* existence. If we are talking about conventional existence, only corner 1 applies. You must lock them into the search for *intrinsic* status before you offer the four options.

  **00:15 – 00:35: The Four Corners (The Ontological Reading)**
  Now draw the four corners. Label them clearly as **Theses about the Object**, not answers to a quiz.
  1.  It exists (intrinsically).
  2.  It does not exist (at all).
  3.  It both exists and does not exist.
  4.  It neither exists nor does not exist.

  *   **Walkthrough:**
      *   **Corner 1:** False. We can't find it as an independent entity.
      *   **Corner 2:** False. It's not a unicorn; it has causal power.
      *   **Corner 3:** False. Contradictory predicates cannot apply to the same aspect of the same subject simultaneously (logic 101).
      *   **Corner 4:** The "Neither".
  *   **Addressing the "Cop-out":** This is where they will rebel. "Neither" sounds like agnosticism ("I don't know").
  *   **Correction:** Tell them: "Neither" does not mean 'unknown'. It means **category error**. It is like asking, "Is the number 7 blue or not blue?" The predicate doesn't latch. The "Neither" is a rejection of the framework, not a description of the object.

  **00:35 – 00:55: The Pivot (The Question Reading)**
  Now address your group's debate: *Four answers or four theses?*
  *   **Action:** Draw a line under the first section. Write a new question at the top: **"What is the ontological status of the Centre of Gravity?"**
  *   **Demonstration:** Show that the four corners are actually an exhaustion of *possible answers to that specific question*.
  *   **The Reveal:** If all four answers fail, the problem isn't the answers; it's the **question**. The question presupposes that the Centre of Gravity *must* have an ontological status (intrinsic or null).
  *   **Why this order matters:** If you start with the "Question" reading, they think it's linguistic trickery. If you start with the "Thesis" reading, they treat it as metaphysics. By doing Theses first, then showing they exhaust the Question, you prove that the *conceptual framework* is what's empty.

  **00:55 – 01:15: Misconceptions (Interleaved Defence)**
  Do not save misconceptions for the end. Head them off as they arise in the sequence above.

  1.  **Nihilism ("It means nothing is real"):**
      *   *When:* As soon as you reject Corner 1 (Exists).
      *   *How:* Remind them of the bridge. "If I deny the intrinsic existence of the Centre of Gravity, does the bridge fall down?" No. Emptiness is not non-existence; it is the lack of *intrinsic* existence. Conventional reality remains intact.
  2.  **Relativism ("Every view is equally wrong"):**
      *   *When:* At Corner 3 (Both).
      *   *How:* Clarify that we aren't saying "all views are valid." We are saying "all views *about intrinsic nature* are invalid." This is a specific critique of essentialism, not a general epistemic humility.
  3.  **Many-Valued Logic ("Neither is a 3rd/4th truth value"):**
      *   *When:* Before you explain Corner 4.
      *   *How:* Explicitly state: "This is not fuzzy logic. 'Neither' is not a truth value like 'Null' in a database. It is a meta-logical rejection of the binary." If you let them think this is a 4-valued logic system, you lose them to formalism.
  4.  **Self-Refutation ("You're using causation to deny causation"):**
      *   *When:* In the final wrap-up (see below).
      *   *How:* Acknowledge it. Nāgārjuna accepts this. His arguments are *prasaṅga* (reductio ad absurdum). He uses the opponent's logic to show the opponent's logic breaks. He isn't building a system; he's dissolving one.

  **01:15 – 01:25: Boundaries (What to Refuse)**
  You will get dragged into these in the last ten minutes. Draw a line on the board labelled **"Out of Scope."**
  *   **The Two Truths Doctrine:** Do not try to explain Ultimate vs. Conventional truth in depth. It consumes 45 minutes on its own. Just say: "Emptiness is the ultimate nature of conventional things," and move on.
  *   **Soteriology:** Do not discuss enlightenment, nirvana, or suffering. Keep it metaphysical/logical.
  *   **Quantum Mechanics:** The physicists *will* try to map this to superposition or wave-particle duality. **Shut this down gently.** "Quantum mechanics is a physical model; Madhyamaka is an ontological critique. They might rhyme, but don't conflate them today."

  **01:25 – 01:30: The Diagnostic Question**
  Do not ask, "Does anyone have questions?" They will ask about history or texts.
  Ask this:

  > **"If I asked you 'Does the United Kingdom exist?', which corner of the tetralemma would you put it in, and why would the other three fail?"**

  *   **Why this works:**
      *   If they say **Corner 1**, they missed the point (it has no intrinsic borders).
      *   If they say **Corner 2**, they are nihilists (it clearly functions socially).
      *   If they say **Corner 3**, they are being relativistic.
      *   If they say **Corner 4** and explain it as a **category error regarding intrinsic existence**, they've got it.
      *   If they say **"The question is ill-posed,"** they have truly understood.

  ### Summary Checklist for the Whiteboard
  1.  **Left Panel:** "Existence = Intrinsic Nature?" (The Assumption).
  2.  **Centre Panel:** The Tetralemma (Exists / Not Exists / Both / Neither).
  3.  **Right Panel:** "Out of Scope" (Quantum, Nirvana, Two Truths detail).

  ### Final Advice on Delivery
  *   **Be Dry:** Don't mystify it. Analytic types smell incense and run. Treat it like a proof by contradiction.
  *   **Hold the Line:** When they say "But practically it exists," agree. "Practically, yes. Ultimately (intrinsically), no." Keep the distinction sharp.
  *   **The "Neither":** Spend the most time here. If "Neither" lands as "I don't know," the session fails. It must land as "The parameters of the question are broken."

  Good luck. Keep your chalk dry and your definitions tighter than theirs.
