  **BUREAU OF BRUTE LUCK ADJUDICATION**
  **CITIZEN'S GUIDE TO REDISTRIBUTIVE ELIGIBILITY (REV. 4.2)**
  **DOCUMENT ID: BBLA-FAQ-009**

  **1. What constitutes a compensable misfortune under the Statute?**
  Compensation is available only for disadvantages resulting from brute luck, defined as circumstances unchosen by the agent. Advantages or disadvantages resulting from option luck (the outcome of deliberate gambles or calculated risks) are not compensable. Applicants must submit Form L-1 (Brute Luck Declaration) alongside a Counterfactual Consent Audit. This audit establishes whether a reasonable person, possessing full information at the time of the antecedent action, would have consented to the risk. If the audit determines the risk was reasonably avoidable, the outcome is classified as option luck. Note: The Bureau reserves the right to reinterpret "reasonable avoidability" based on aggregate social data rather than individual capacity.

  **2. How does the Bureau distinguish between needs and expensive tastes?**
  Per Section 12(b) of the Acquired Preference Clause, physiological necessities (e.g., insulin for diabetes) are compensable brute luck. Cultivated preferences (e.g., a preference for vintage wine over tap water) are considered option luck and are the sole liability of the agent. Applicants claiming compensable tastes must prove the preference is constitutive of their welfare baseline rather than acquired through voluntary socialization. Form P-3 (Taste Provenance) requires a history of consumption patterns dating back to age twelve. Claims denied under this section are not eligible for hardship waivers, as the cultivation of taste is presumed to be a voluntary exercise of agency.

  **3. Am I eligible if my poverty results from a failed business venture?**
  Generally, no. Market participation is classified as a voluntary risk-taking activity. Losses incurred through market speculation are treated as option luck deductions. However, if the failure resulted from a systemic shock unforeseeable by any actor (e.g., a natural disaster disrupting supply chains), the loss may be reclassified as brute luck. Applicants must demonstrate that no insurance product was available to mitigate the specific risk at the time of investment. If insurance was available but deemed too costly by the agent, the resulting loss remains non-compensable. The Bureau does not subsidize poor risk management.

  **4. How is compensation calculated for low natural talent?**
  Compensation for untalented individuals is based on the Natural Asset Depreciation Schedule. This schedule estimates the income differential between the applicant's endowment and the social average, priced according to a hypothetical insurance market. Applicants are compensated as if they had purchased insurance against low talent behind a veil of ignorance. Note: Compensation restores the agent to the average welfare baseline, not necessarily their desired welfare level. If the premium for such insurance would have been higher than the applicant's actual contribution capacity, benefits may be capped at the minimum decent share, regardless of the calculated deficit.

  **5. Are personality traits like laziness or lack of ambition compensable?**
  This depends on the Volitional Capacity Assessment. If the trait is innate (e.g., clinically diagnosed apathy), it is brute luck. If the trait is habitual (e.g., a chosen refusal to work), it is option luck. Applicants must undergo psychometric testing to determine the etiology of their motivational deficit. However, if the laziness stems from a rational assessment of low wages (a choice), it is non-compensable. If it stems from an unchosen psychological barrier, it is compensable. In borderline cases, the Bureau presumes voluntariness to discourage moral hazard. Applicants bear the burden of proving their character is not their own fault.

  **6. What is the appeals process for classification errors?**
  Appeals must be filed within thirty days of adjudication. Applicants may contest the classification of their circumstance as option luck. However, the Appeals Board operates under a shifting baseline protocol. While Section 1.0 guarantees restoration to the social average, Section 6.2 limits liability to the maintenance of a minimum decent share. If granting an appeal would exceed the fiscal cap for the minimum share, the original classification stands, even if the brute luck determination was correct. Citizens are advised that the right to compensation is contingent on the aggregate solvency of the Brute Luck Fund, not solely on the merit of the claim.

  **NOTICE:** Failure to disclose prior risk-taking behavior constitutes fraud. All determinations are final unless a change in statutory interpretation occurs.
