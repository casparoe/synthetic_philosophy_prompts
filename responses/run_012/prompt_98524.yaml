  2.  **Deconstruct Two-Dimensional Semantics (2DS):**
      *   *Origin:* Associated with David Chalmers, Frank Jackson, Robert Stalnaker (though they differ slightly).
      *   *First Dimension (Primary/Epistemic Intension):* What does the term refer to given a world considered *as actual*? It tracks conceptual role, descriptive criteria, or modes of presentation. It answers: "If this world turned out to be the actual one, what would we call X?"
      *   *Second Dimension (Secondary/Subjunctive Intension):* What does the term refer to given a world considered *as counterfactual*, holding the actual world fixed? It tracks rigid designation, underlying essence, or reference once fixed. It answers: "Given how our world actually is, what counts as X in other possible worlds?"
      *   *Application to Natural Kinds:* For "water," Primary Intension might be "clear, drinkable liquid in lakes," but Secondary Intension is "H2O."
      *   *Application to Descriptive Terms:* For "bachelor," both intensions align roughly with "unmarried man."

  3.  **Apply 2DS to "Planet" (Pre-2006):**
