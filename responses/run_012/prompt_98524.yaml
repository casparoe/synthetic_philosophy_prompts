      *   *Secondary Intension (Subjunctive):* Once we fix the reference in the actual world (pre-2006), what objects *are* planets in counterfactual scenarios? This depends on what fixed the reference initially. Was it the *stuff* (rock/ice) or the *description* (orbits sun, round)?
      *   *The Crux:* Does "planet" have a hidden essence (Secondary) distinct from its appearance (Primary)?

  4.  **Natural Kind vs. Functional/Conventional:**
      *   *Natural Kind (Water/Gold):* Has a microstructural essence independent of human classification. Discovery reveals this.
      *   *Functional/Conventional (Bachelor/Chair):* Defined by use, function, or social agreement. Change the rules, you change the concept.
      *   *Analysis of "Planet":* Planets aren't made of a specific substance (rock, gas, ice all count). They aren't defined by a biological lineage. They are defined by dynamical relationships (orbiting a star) and physical properties (hydrostatic equilibrium). The "clearing the neighborhood" criterion is dynamical.
      *   *Verdict:* "Planet" looks much more like a functional/conventional taxonomic term than a natural kind like "water." There is no "planetium" essence.

  5.  **Adjudicating the Dispute:**
