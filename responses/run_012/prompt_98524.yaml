answer: |-
  This is a superb application of two-dimensional semantics (2DS) to a concrete scientific controversy. Your dispute with your friend maps almost perfectly onto the tension between the two dimensions of meaning. To analyze this, we must treat the pre-2006 usage of "planet" as our fixed point of departure and ask how the term functions across possible worlds.

  ### 1. The Two Intensions of "Planet" (Pre-2006)

  In the framework of two-dimensional semantics (associated with philosophers like David Chalmers and Frank Jackson), we distinguish between how a term picks out its referent when we vary the world *considered as actual* (the Primary Intension) versus when we vary the world *considered as counterfactual* (the Secondary Intension).

  **The Primary (Epistemic) Intension**
  This captures the conceptual role or the descriptive criteria we use to identify the referent *a priori*. It answers the question: "If we were to discover that the actual world is W, what would 'planet' refer to in W?"

  For the pre-2006 usage, the Primary Intension of "planet" was roughly a cluster of descriptive properties:
  *   *Criteria:* A celestial body that orbits the Sun, is massive enough to be rounded by its own gravity (hydrostatic equilibrium), and is not a satellite (moon).
  *   *Function:* It tracks "major bodies" of the solar system as distinct from "minor bodies" (asteroids/comets).

  Under this intension, reference is determined by satisfaction of these descriptions. If we discovered a world where Pluto was the size of Earth but shared an orbit with Neptune, our pre-2006 concept might still classify it as a planet because it satisfies the "round and orbiting sun" description. The Primary Intension is sensitive to the *modes of presentation* available to the speaker.

  **The Secondary (Subjunctive) Intension**
  This captures the reference once the actual-world extension is fixed. It answers the question: "Given how the actual world *actually* is, what does 'planet' refer to in other counterfactual worlds?"

  If "planet" behaves like a rigid designator (or a natural-kind term), the Secondary Intension ignores the descriptive criteria and locks onto the underlying nature of the things we *actually* pointed to in 1930.
  *   *If Natural Kind:* The Secondary Intension picks out whatever shares the hidden essence of Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, and Pluto.
  *   *If Descriptive:* The Secondary Intension tracks the same descriptive criteria as the Primary Intension across counterfactual worlds.

  ### 2. Natural Kind vs. Conventional Term

  To adjudicate the dispute, we must determine whether the Secondary Intension of "planet" diverges from the Primary Intension (as with "water") or coincides with it (as with "bachelor").

  **The Case for Natural Kind ("Water"/"Jade")**
  Your friend's view implies that "planet" has a hidden essence independent of human classification. On this model, the pre-2006 astronomers were like pre-1800s chemists using "water." They referred to H₂O without knowing it was H₂O. Similarly, they referred to "dynamically dominant bodies" without knowing that dynamical dominance was the essential property.
  *   *The Jade Analogy:* The nineteenth-century discovery that jade is two minerals (jadeite and nephrite) is a case where one term was found to be disjunctive. Your friend might argue the IAU discovered that "planet" was disjunctive (including both dominant bodies and Kuiper Belt Objects) and corrected it to pick out only the natural kind (dominant bodies).

  **The Case for Conventional/Functional Term ("Continent"/"Bachelor")**
  Your view implies that "planet" is defined by the criteria we apply. There is no "planetium" essence. Planets are not defined by chemical composition (they vary wildly) nor by lineage. They are defined by their dynamical relationship to their star and their shape.
  *   *The Continent Analogy:* Europe and Asia are one landmass. Calling them separate "continents" is a matter of convention, not geological discovery. Similarly, whether Pluto is a "planet" depends on where we draw the line in a continuum of sizes and orbits.

  **Analysis:**
  "Planet" lacks the hallmarks of a microstructural natural kind. There is no intrinsic physical property shared by Jupiter (gas), Earth (rock), and Pluto (ice) that is not also shared by Eris or Ceres, other than the relational/descriptive properties already in the Primary Intension. Therefore, the content of "planet" is largely exhausted by the descriptive criteria. The Secondary Intension does not diverge from the Primary Intension to lock onto a hidden essence; it locks onto the *category* defined by those descriptions.

  ### 3. Adjudicating the Dispute

  Using this profile, we can evaluate the IAU's 2006 move (adding the requirement: "cleared the neighbourhood around its orbit").

  **Your Friend (The Discovery View):**
  Your friend treats "planet" as having a robust Secondary Intension fixed by nature. They believe the IAU *discovered* that dynamical dominance (clearing the neighborhood) was the true essence all along, and Pluto was never truly a planet, just as a fool's gold nugget was never truly gold.
  *   *2DS Verdict:* This requires "planet" to be a natural-kind term where the Primary Intension (round, orbits sun) was merely a placeholder for the Secondary Intension (dynamically dominant). Given the lack of a microstructural essence, this is metaphysically weak.

  **You (The Rewriting View):**
  You treat "planet" as having a Primary Intension that exhausts its meaning. By changing the criteria (adding "clearing the neighborhood"), the IAU changed the Primary Intension, and thus changed the meaning of the word.
  *   *2DS Verdict:* This aligns with "planet" being a functional or taxonomic term. Since the reference is fixed by description, changing the description changes the reference.

  **The Ruling:**
  The IAU's move is closer to **a committee stipulating a new sense for an old word** than to the discovery that jade is two minerals.
  Why? Because the "jade" case involved discovering that the *extension* of the term (the stuff in the ground) fell into two distinct natural categories with different microstructures. The IAU did not discover that Pluto has a different *composition* than Earth. They discovered that Pluto shares its orbital zone with other objects. They then *chose* to make orbital dominance a necessary condition. This is a change in the Primary Intension. Since "planet" has no hidden essence to anchor the Secondary Intension independently of these criteria, changing the criteria changes the term's extension. You are correct: it was a revision of the concept, not a discovery of a pre-existing fact.

  ### 4. Where Two-Dimensional Semantics Falls Silent

  Here is the honest philosophical pivot: **Two-dimensional semantics cannot by itself determine which of you is correct.**

  2DS is a formal tool for mapping the relationship between meaning, reference, and modality; it is not a metaphysical oracle. It can clarify the *structure* of the disagreement, but it cannot settle the *status* of the kind.

  1.  **Presupposition of Essence:** To apply 2DS here, I had to make a prior judgment call: *Does "planet" have a hidden essence?*
      *   If I assume "planet" is a natural kind (like "water"), 2DS models the IAU decision as a discovery (Secondary Intension overrides Primary).
      *   If I assume "planet" is a conventional kind (like "continent"), 2DS models the IAU decision as a stipulation (Primary Intension determines Secondary).
      *   2DS does not tell me which assumption is true. It merely formalizes the consequences of each.

  2.  **The Silence on Taxonomy:** 2DS works best for terms where the distinction between appearance and reality is clear (e.g., "water" looks like water but is H₂O). In biological or astronomical taxonomy, the line between "discovering a clade" and "drawing a boundary" is often blurry. 2DS falls silent on whether dynamical dominance is a *discovered essence* or a *useful boundary*. That is a question for the philosophy of science and metaphysics, not semantics.

  3.  **The Normative Gap:** Even if 2DS showed that "planet" *could* be treated as a natural kind, it cannot tell us whether we *ought* to treat it that way. Your friend wants the term to track objective dynamical structures (a scientific goal). You want the term to track historical usage and descriptive stability (a linguistic goal). 2DS can model both goals, but it cannot adjudicate which goal is more valuable for astronomy.

  **Conclusion:**
  Two-dimensional semantics validates your intuition that the IAU changed the descriptive criteria (Primary Intension), and since "planet" lacks a microstructural essence, this changed the reference. However, the framework itself presupposes the metaphysical status of "planet" to generate that result. It exposes that your friend is treating a conventional term *as if* it were a natural kind, but it cannot prove that "planet" *isn't* a natural kind without outside input. The tool clarifies the map, but it does not tell you where the territory lies.
