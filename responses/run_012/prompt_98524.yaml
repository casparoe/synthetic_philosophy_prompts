      *   *User (Rewriting):* Treats "planet" as having a Primary Intension exhausted by descriptive criteria. The IAU changed the criteria, thus changing the meaning.
      *   *2DS Analysis:* If "planet" is a natural kind, the Friend is right (Secondary Intension dominates). If "planet" is descriptive/conventional, the User is right (Primary Intension dominates/aligns with Secondary).
      *   *Conclusion:* Since "planet" lacks a microstructural essence, it behaves more like a conventional term. The IAU move is stipulation/refinement, not discovery of hidden essence. However, 2DS shows *why* the friend feels it's discovery (they are treating the Secondary Intension as if it were rigidly fixed by nature).

