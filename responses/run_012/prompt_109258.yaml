  1. (1)+(2) vs (3): You fear (1) and (3) make you a pan-sentientist, but (2) explicitly blocks this inference. (1) grants fundamentals phenomenal character, but (2) denies them subjects. (3) restricts harm strictly to subjects. Therefore, electrons have quality but cannot be harmed. This is consistent Russellian monism, not pan-sentientism. Your suspicion is unfounded because subjecthood, not phenomenality, is the moral threshold.

  2. (5) vs (6): Moral realism and physicalism seem to clash, but not necessarily. If value facts are natural properties identical to physical facts, (5) and (6) cohere perfectly. You need not posit non-physical value entities to be a realist. Physicalist moral realism is a viable, stable position. The tension dissolves if you treat value as a fundamental physical relation rather than a supernatural addition.

  3. (1) vs (6): Panpsychism often seems dualist, but your view is explicitly physicalist. By treating phenomenal properties as fundamental physical properties (1), you avoid adding non-physical substances. (6) holds because nothing transcends these physical facts. Consciousness is intrinsic physics, not an extra causal layer. There is no overdetermination because the phenomenal just is the physical intrinsic nature. This maintains causal closure.

  Cheapest repairs and their costs

  For the tension between (3) and (4), the cheapest repair is to modify (3) to admit "proto-value" in unowned quality. This costs you the clear sentiocentric boundary for harm, complicating your ethical framework. For the tension between (4) and (7), the cheapest repair is to revise (4) to prefer arrangements with less *integrated* quality (subjects) rather than total quality. This costs you the claim that raw physics is ethically loaded independent of subjects, narrowing the scope of your moral concern.

