answer: |-
  # The Persistence Diagnostic: A Decision Tree

  **Instructions:** Start at the root. Answer each question based on your intuition about the *case described*, not based on the theory you think you hold. If you find yourself saying, "It depends on what we mean by 'same'," follow the branch that matches your *best guess* at what we *should* mean, or follow the "No Fact" branch if you think there really is no answer.

  ### **ROOT COMMITMENT**
  We begin by agreeing that ordinary talk of persistence is not *obviously* false. We speak as if the person who started this seminar is the same person finishing it.
  *   **Proceed to Node 1.**

  ---

  ### **NODE 1: The Fission Test (Identity vs. Counterparts)**
  **The Case:** A person enters a teletransporter. The machine scans them, destroys the original, and prints two exact duplicates (Lefty and Righty) on Mars. Both have the original's memories, personality, and psychology.
  **Question:** Is the original person *identical* to Lefty? Is the original person *identical* to Righty?

  *   **(A) Yes to both.** (Both Lefty and Righty are the original person.)
      *   *Go to Leaf 1 (Stage View).*
  *   **(B) No to both.** (The original died; Lefty and Righty are new people.)
      *   *Go to Node 2.*
  *   **(C) Yes to one, No to the other (but it's indeterminate which).** (One is the original, but there is no fact of the matter which one.)
      *   *Go to Node 2.*
  *   **(D) It depends on our conventions/stipulations.** (There is no metaphysical fact here.)
      *   *Go to Leaf 6 (Conventionalism).*

  ---

  ### **NODE 2: The Poker Test (Temporary Intrinsics)**
  **The Case:** An iron poker is hot at $t_1$ and cold at $t_2$.
  **Question:** How do we analyze this change? Is the poker at $t_1$ numerically identical to the poker at $t_2$?

  *   **(A) No.** (The poker at $t_1$ is a different entity than the poker at $t_2$; they are temporal parts of a larger whole.)
      *   *Go to Leaf 2 (Worm View).*
  *   **(B) Yes.** (The *whole* poker exists at $t_1$ and the *whole* poker exists at $t_2$.)
      *   *Go to Node 3.*

  ---

  ### **NODE 3: The Gap Test (Continuity vs. Structure)**
  **The Case:** Consider two scenarios:
  1.  **The Dry River:** A riverbed dries to dust for 50 years, then rain fills the exact same channel with water from the same upstream source.
  2.  **The Chess Club:** A club dissolves (all members quit). Five years later, new people form a club with the same name, rules, and meeting place.
  **Question:** In either case, is the post-gap entity the *same object* as the pre-gap entity?

  *   **(A) No.** (Existence requires spatio-temporal continuity. If the process stops, the object dies.)
      *   *Go to Node 4.*
  *   **(B) Yes.** (Persistence depends on causal/structural history, not continuous existence.)
      *   *Go to Node 5.*
  *   **(C) Neither.** (Talk of "the river" or "the club" is useful fiction, but strictly speaking, no object survives this.)
      *   *Go to Leaf 7 (Eliminativism).*

  ---

  ### **NODE 4: The Brute Fact Test (Analysis vs. Primitivism)**
  **The Case:** You hold that the poker (Node 2) is wholly present at both times, and the river (Node 3) is *not* the same after a gap.
  **Question:** What grounds the persistence of the poker? Is there a deeper explanation for why it is the same object, or is it just a fundamental fact?

  *   **(A) It is a fundamental, unanalyzable fact.** (Persistence is a primitive relation.)
      *   *Go to Leaf 5 (Primitivism).*
  *   **(B) There is an explanation.** (It involves identity plus property possession.)
      *   *Go to Node 6.*

  ---

  ### **NODE 5: The Pattern Test (Software & Songs)**
  **The Case:**
  1.  **Software:** A program is saved to a disk (static code), then loaded into RAM (running process). Are these the *same object*?
  2.  **Song:** Band A records a song. Band B covers it note-for-note. Is it the *same song*?
  **Question:** Do these cases show that objects persist as *patterns/types* rather than concrete matter?

  *   **(A) Yes.** (Persistence is about the survival of the pattern/structure, which allows for the gaps in Node 3.)
      *   *Go to Leaf 3 (Endurantism - Relational).*
  *   **(B) No.** (The software on disk is a *copy* or *representation*, not the running instance. The song is an abstract type, not a persisting concrete object.)
      *   *Go to Leaf 6 (Conventionalism).* (Note: If you think persistence in gap cases is real but not pattern-based, you likely rely on stipulation here).

  ---

  ### **NODE 6: The Frozen Time Test (Relations vs. Adverbs)**
  **The Case:** Imagine time freezes completely for 1,000 years. The poker remains hot.
  **Question:** During the freeze, does the poker *have the property of heat*?

  *   **(A) No.** (Heat is a relation to a time. If time doesn't pass, the relation 'hot-at-t' cannot be instantiated/changed.)
      *   *Go to Leaf 3 (Endurantism - Relational).*
  *   **(B) Yes.** (The poker has the property *temporally* or *adverbially*. It is 'hotly' constituted even if time stands still.)
      *   *Go to Leaf 4 (Adverbialism).*

  ---

  ### **THE LEAVES**

  1.  **Stage View (Exdurantism):** You answered **(1A)**. You believe ordinary objects are momentary time-slices. Persistence is a matter of *counterpart relations*, not strict identity. This handles fission easily (both are counterparts) but requires reinterpreting "I will exist tomorrow" as "A counterpart of me will exist tomorrow."
  2.  **Worm View (Perdurantism):** You answered **(1B/C) → (2A)**. You believe objects are space-time worms. The poker has a hot *part* and a cold *part*. Fission involves overlapping worms or indeterminacy. You likely accept Eternalism (past/present/future parts exist equally).
  3.  **Endurantism (Relational):** You answered **(1B/C) → (2B) → (3B) → (5A) → (6A)**. You believe objects are wholly present. Properties are relations to times (hot-at-$t$). You allow gaps if the causal pattern holds (River/Club).
  4.  **Adverbialism:** You answered **(1B/C) → (2B) → (6B)**. You believe objects are wholly present. Properties are not relations but are had in a time-indexed *manner* (hotly-at-$t$). This avoids making intrinsic properties relational.
  5.  **Primitivism:** You answered **(1B/C) → (2B) → (3A) → (4A)**. You believe persistence is a brute fact. You reject gaps (River dies) and reject analysis (no parts, no relations). Persistence is sui generis.
  6.  **Conventionalism:** You answered **(1D)** or **(5B)**. You believe there is no metaphysical fact of the matter in hard cases (Fission, Gaps, Patterns). Sameness is stipulated by language or social practice.
  7.  **Eliminativism:** You answered **(3C)**. You believe that while simples exist, no composite object (river, club, person) survives radical change or fission. Our ordinary talk is systematically false or fictional.

  ---

  ### **DIAGNOSTIC NOTES & META-COMMENTARY**

  #### **1. Indistinguishable Leaves (The "Flag")**
  *   **Endurantism (Relational) vs. Adverbialism:** Node 6 (Frozen Time) is the only splitter here, and it is notoriously difficult. In almost all empirical cases, these two views predict the same outcomes. If you found Node 6 ambiguous, you occupy a space where **Relational Endurantism** and **Adverbialism** are functionally equivalent. The difference is purely in the metaphysical analysis of *predication*, not in the persistence conditions of objects.
  *   **Conventionalism vs. Eliminativism:** If you answered **(3C)** but think our talk is "true enough" for daily life, you are a **Fictionalist (Eliminativism)**. If you think the truth is determined by what we decide to say, you are a **Conventionalist**. The line is thin: one says "There is no fact," the other says "The fact is made by us."

  #### **2. Unoccupied Combinations**
  *   **Stage View + Gaps Allowed:** There is no leaf for "Stage View but objects can gap." This is because Stage Theory treats objects as momentary. A "gap" implies one object existing at $t_1$ and $t_3$ but not $t_2$. For a Stage Theorist, the $t_1$ stage and $t_3$ stage are already distinct existents; "gapping" is just a matter of whether they are counterparts. This is handled by the counterpart relation (Node 1), not a separate gap condition.
  *   **Worm View + Primitivism:** You cannot be a Worm Theorist and a Primitivist about persistence. Worm Theory *analyzes* persistence as the unity of temporal parts. Primitivism denies such analysis. This combination is incoherent.
  *   **Presentism + Worm View:** This combination is largely unoccupied and arguably incoherent. Worm Theory requires past and future parts to exist (Eternalism). If you are a Presentist, you cannot have a "worm" extended in time, only a present slice. If you landed on **Leaf 2 (Worm)** but are a Presentist, you must revise your ontology.

  #### **3. The Presentism/Eternalism Cross-Cut**
  This tree does not explicitly split on Presentism vs. Eternalism because it is orthogonal to most persistence views *except* Perdurantism.
  *   **Endurantists, Primitivists, and Stage Theorists** can be either Presentists or Eternalists (though Stage Theory fits naturally with Eternalism).
  *   **Worm Theorists (Leaf 2)** must be Eternalists. If you selected Leaf 2 but deny the existence of the future, your position is unstable.
  *   **Eliminativists** are typically Presentists (only current simples exist), but could be Eternalists about simples.

  #### **4. The "Hard Cases" Payoff**
  *   **The Chess Club/River:** These cases (Node 3) are the primary filter between **Primitivists** (who demand continuity) and **Relational Endurantists/Conventionalists** (who allow structural gaps). If your intuition on the River conflicts with your intuition on the Person, you may be a **Conventionalist** without realizing it (Node 5/Node 1 divergence).
  *   **The Software/Song:** These cases (Node 5) distinguish **Pattern-based Endurantism** from **Conventionalism**. If you think the saved code is the *same object* as the running process, you treat objects as abstractable patterns. If you think it is a *copy*, you treat objects as concrete tokens. This often reveals whether your Endurantism is grounded in matter or form.
  *   **Cryonics:** (Implicit in Node 3). If you think a frozen person is the *same* person despite biological cessation, you reject strict continuity (Node 3A) and move toward Pattern/Conventional views.

  **Final Advice:** If you found yourself switching answers between the "Person" cases and the "Club/River" cases, you are likely a **Conventionalist**. You apply strict identity to persons but loose identity to artifacts. The tree forces you to admit this inconsistency is a feature of your view, not a bug.
