answer: |-
  The question

  The central question is whether existing analyses of dispositions can accommodate 'self-unmasking' cases without circularity or reverting to the naive conditional analysis. Specifically, if a disposition's manifestation entails the removal of the very obstacle preventing its manifestation, does the stimulus condition still trigger the disposition correctly? Standard accounts distinguish finks, where the disposition is lost, from masks, where it is retained but blocked. However, when the manifestation itself clears the block, the temporal and causal ordering becomes ambiguous. Can an account specify the stimulus conditions sufficiently to capture this dynamic, or does it require prior knowledge of the manifestation to define the stimulus? This project asks whether a non-circular analysis of dispositions can survive the self-unmasking counterexample, or if the distinction between interference with the disposition and interference with the causal route collapses under this pressure. The aim is to provide a determinate answer clarifying the metaphysical structure of dispositional properties.

  Why it's still open

  The naive conditional analysis was abandoned because it could not distinguish between a disposition failing to manifest and a disposition being absent. Subsequent refinements, typically involving causal bases or ceteris paribus clauses, attempt to isolate the disposition from extrinsic interferers. Yet, these responses often rely on a static conception of masking. They assume the mask exists independently of the stimulus event. The gap lies in the dynamic interaction between the disposition and the mask. If the manifestation removes the mask, the 'interference' is transient and causally linked to the disposition itself. Current accounts either treat the mask as a fixed background condition, which misdescribes the case, or they must appeal to the manifestation to define the appropriate stimulus, risking circularity.

  Furthermore, the distinction between altering the causal basis and obstructing the causal route is frequently presupposed rather than analysed. Proponents of causal basis accounts argue that masks leave the intrinsic basis intact. However, in self-unmasking cases, the process of manifesting changes the extrinsic conditions required for the basis to operate. If the account relies on the basis remaining constant while the environment shifts, it must explain how the basis is individuated without referencing the shift. Most existing solutions quietly collapse the distinction between interference with the disposition and interference with the route, assuming they can be separated easily. Without a clear account of how the causal route is individuated independently of the manifestation, self-unmasking cases remain unresolved. The literature has not adequately tested whether the 'causal route' can be specified without referencing the outcome it is meant to explain. If the solution requires stipulating that the mask must not be removed by the manifestation, the analysis becomes trivial. If it allows it, the conditional antecedent becomes unstable. This tension remains unaddressed, leaving a significant vulnerability in contemporary dispositionalism regarding dynamic causal structures. Resolving this is crucial for determining whether dispositions are fundamentally categorical or irreducibly powerful.

  Method

  The project will proceed in three phases over the term. First, I will construct a rigorous taxonomy of self-unmasking cases. This involves developing concrete examples, such as a chemical disposition that neutralises the inhibitor upon reaction, to ensure the case is not merely verbal. I will formalise the conditions under which the mask is removed by the manifestation to prevent ambiguity regarding the timing of the stimulus. This conceptual groundwork is essential to ensure the counterexample is robust against charges of being a category mistake. Regular supervision meetings will be used to validate the constructed cases.

  Second, I will test this case against the three dominant families of response to the fink/mask problem: the revised conditional analyses, the causal basis accounts, and the modal accounts. For each, I will reconstruct the argument charitably to see if it can accommodate the self-unmasking feature. I will focus specifically on whether the account must reference the manifestation to define the stimulus condition, which would indicate circularity. I will also examine whether the distinction between basis and route is maintained or collapsed in each instance. This involves a close textual analysis of the logical structure of each account, looking for hidden premises regarding causal pathways. I will document where each account fails to capture the dynamic nature of the mask without resorting to ad hoc adjustments.

  Finally, I will draft the 8,000-word paper. The argument will move from the construction of the counterexample to the evaluation of existing responses, concluding with a positive proposal or a negative limitation. The writing will be iterative, with sections completed weekly to allow for integration of new insights. The final week will be reserved for revision and ensuring the argument is tight. This structured approach ensures that the conceptual work is completed before writing begins, preventing the scope from expanding uncontrollably during the drafting phase. I will maintain a research log to track which arguments succeed and which require modification, ensuring the final text reflects the actual progression of the inquiry.

  What success and failure look like

  Success looks like a determinate conclusion regarding the viability of dispositional accounts in the face of self-unmasking. A positive result would identify a specific framework capable of handling the case without circularity, perhaps by refining the notion of the causal route. A negative result, which is equally valuable, would demonstrate that all current major accounts fail, implying that dispositions require a fundamentally different metaphysical grounding, such as a primitivist powers ontology. Either outcome advances the debate by closing off untenable positions. It would provide a clear boundary condition for future theories of dispositions.

  Failure would consist in the counterexample proving unstable. If the case dissolves upon closer inspection—for instance, if the 'mask' is revealed to be part of the causal basis rather than an extrinsic interferer—the project yields no new insight. Additionally, failure would occur if the analysis becomes too tangled to produce a clear 8,000-word argument. If the distinctions required to save the accounts become so nuanced that they lack general applicability, the project will not have achieved its aim of clarifying the disposition/mask distinction. Ultimately, success is defined by clarity of the conclusion, not necessarily by saving the conditional analysis. Ambiguity in the final verdict would constitute failure, as the goal is to resolve the sloppiness identified in the current literature.

  Scope

  To keep this doable within a term, I must restrict the scope significantly. I will not attempt a comprehensive survey of the history of dispositionalism, nor will I engage with adjacent debates in philosophy of mind or ethics where dispositions are sometimes invoked. The focus will remain strictly on the metaphysics of properties and causal analysis. I will also set aside the broader debate between categoricalists and dispositionalists; the project assumes dispositions exist and asks how they are analysed, not whether they exist. Furthermore, I will limit the examples to physical and chemical cases rather than biological or psychological dispositions, which introduce additional complexities regarding function and normativity. By narrowing the field to core metaphysical accounts of simple properties, I can ensure the argument remains rigorous without becoming unmanageable.
