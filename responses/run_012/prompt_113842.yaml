      *   *Check:* The "Residue" needs to be punchy. Don't hedge. If FM can't model "Obligation," say it.

  7.  **Final Polish:** Ensure the structure matches the prompt (1. Translation, 2. Residue). Ensure the "brainstorm" is hidden. (I will skip writing the brainstorm in the output).

  *(Self-Correction on the "Internal Point of View")*: I need to be careful here. In PL, the "Internal Point of View" is roughly the difference between a user who follows the docs because they work, vs. a language designer who treats the spec as the source of truth. But Hart means something more sociological. I'll map it to "Trusted Computing Base" acceptance.

  *(Self-Correction on Fuller)*: Fuller's claim is often criticized as "conceptual stipulation." I should acknowledge that in the residue. If he just redefines "Law" to mean "Good Law," FM translation exposes that as a naming collision.

