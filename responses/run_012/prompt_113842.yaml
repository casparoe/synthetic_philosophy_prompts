          4.  **Constraint:** Do *not* dump the initial brainstorm. Keep it concrete (policy engines, config languages, etc.). No reading lists. Be critical/direct, not diplomatic.
      *   **My Persona:** Philosopher of Law who *also* genuinely knows PL/Formal Verification. (This is a role-play constraint).

  2.  **Initial Brainstorming (Internal/Mental):**
      *   *Hart as PL:* Hart is like a type system or a syntax checker. A program is "valid" if it compiles according to the rules of the language (Rule of Recognition), regardless of what it *does* (semantics/morality). The "Internal Point of View" is like the compiler developer or the standard committee accepting the rules as reasons for action, not just habits.
      *   *Fuller as Verification/Refinement:* Fuller argues that the *process* of defining the spec matters. If the spec is contradictory, secret, or retroactive, it's not a spec at all. It's noise. This is like saying a spec that changes post-execution isn't a spec.
      *   *The Nazi Statute:* A function that compiles (Hart) but causes a segfault or memory corruption that violates memory safety guarantees inherent to the language design (Fuller).
      *   *The Gap:* FM deals with truth relative to a model. Law deals with obligation relative to a community.
      *   *Residue:* "Obligation" is the hard part. In FM, if code violates spec, it's a bug. In Law, if law violates morality, is it still law? FM doesn't really have "moral obligation to obey the spec" unless the spec is safety-critical.
      *   *Internal Point of View:* This is tricky. It's not just "accepting the spec." It's "accepting the spec as a *reason* for action." In PL, we follow syntax because the compiler forces us. In Law, officials follow rules because they feel they *ought* to.
      *   *Fuller's Threshold:* Is it binary? In FM, a spec is either well-formed or not. But Fuller says "substantial failure." That's fuzzy.
      *   *Retroactivity:* In FM, this is like changing the type signature after the code is written and blaming the code for not matching.

  3.  **Drafting Part 1: The Translation (Hart & Fuller in FM/PL terms)**

      *   *Hart:*
