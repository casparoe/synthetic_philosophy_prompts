          *   **Morality:** Runtime behavior / Side effects. Orthogonal to type safety.
          *   **The Nazi Statute:** It type-checked. It was passed by the legislature (compiler) according to the constitution (grammar). Therefore, it is a valid instruction.
          *   **Hard Cases:** Ambiguous types. Requires interpretation (type inference), not moral injection.
