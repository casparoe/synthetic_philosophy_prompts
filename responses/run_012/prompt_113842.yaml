          *   **The 8 Desiderata:** API Stability, Documentation, Non-contradictory constraints, Feasibility (halting problem?), Consistency between Docs and Implementation.
          *   **The Nazi Statute:** It violated the protocol. Secret laws = Undocumented APIs. Retroactive laws = Changing the ABI after linking.
          *   **Conclusion:** It's not just a "bad API"; it's *not an API*. It's a script that crashes the runtime. It fails the "Legality" type check.
          *   **The German Case:** The post-war court shouldn't have said "It was law but evil." They should have said "That wasn't a valid law because it violated the procedural contract of Law itself."

  4.  **Drafting Part 2: The Residue Report (The Critical Analysis)**

      *   *Fit:* Well-formedness vs. Validity fits Hart perfectly. Fuller's procedural requirements fit "Interface Stability" well.
