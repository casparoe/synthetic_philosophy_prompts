          *   *The FM Gap:* FM distinguishes *is* (verification result) from *ought* (engineering ethics). Law conflates them in the concept of "Validity."
      *   *Internal Point of View:* In FM, we don't care *why* the compiler enforces types. In Law, the *attitude* of the officials constitutes the system. This is social ontology, not formal ontology.
      *   *Fuller's Rhetoric:* Does "Not Law" dissolve under translation? Yes, it looks like "Bad Spec." But Fuller wants to deny the *authority* of the command, not just its quality. FM can't capture "Authority" easily, only "Correctness."

  5.  **Refining the Tone:**
      *   Needs to be peer-to-peer. No condescension.
      *   Use specific analogies (CI/CD, Type Systems, ABIs).
