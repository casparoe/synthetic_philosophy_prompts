answer: |-
  ### 1. The Translation

  Here is the Hart–Fuller debate compiled against your formal methods mental model.

  **The System Architecture**
  Think of a Legal System as a distributed system with a specific **Rule of Recognition (RoR)**.
  *   **Hart's View:** The RoR is the **Type System / Grammar**. It is a social fact (the "Trusted Computing Base" accepted by the officials). A rule is "Law" if it is **well-formed** according to the RoR.
  *   **Fuller's View:** The RoR is not just syntax; it is an **Interface Contract**. Law is a specific kind of API for governing conduct. If the implementation violates the contract's guarantees, the endpoint doesn't just return an error; it ceases to be a valid endpoint.

  **Hart: Validity $\neq$ Merit (Syntax $\neq$ Semantics)**
  *   **The Claim:** A statute is valid if it compiles. Whether it produces "good" output (moral) or "bad" output (evil) is a separate concern.
  *   **The Nazi Statute:** In 1944, the Nazi legislature passed a statute allowing punishment for acts deemed "worthy of penalty according to the fundamental conception of a penal law and sound popular feeling."
      *   **Hart's Analysis:** This statute **type-checked**. It was enacted by the recognized sovereign using the recognized procedures. It is a valid instruction in the legal language.
      *   **The Post-War Problem:** After the war, a woman was prosecuted for denouncing her husband under this statute. The court had to decide: Was the statute law?
      *   **Hart's Solution:** Admit it was law. It was a validly enacted rule. But because it was morally odious, the post-war court was justified in passing a *new* retroactive statute to punish her, rather than lying and saying the old statute wasn't law.
      *   **FM Analogy:** You have a legacy function `void kill_dissidents()` that was correctly implemented according to the 1944 API spec. It works as specified. In 1950, you deprecate the API. You don't claim the 1944 binary was "corrupted"; you admit it was valid code that is now morally unacceptable, so you patch the OS to punish anyone who linked against it.
  *   **Hard Cases:** When the spec is ambiguous (open texture), judges act like **runtime interpreters** filling in gaps. They don't reach for an external "moral library"; they use discretion within the system's logic.

  **Fuller: The Inner Morality of Law (Protocol Guarantees)**
  *   **The Claim:** You cannot separate the "is" of law from the "ought" of procedure. A system of rules implies a commitment to guide conduct. If you violate the procedural commitments, you aren't making "bad law"; you are failing to make law at all.
  *   **The 8 Desiderata (The Contract):**
      1.  Generality (Polymorphism, not hardcoding users)
      2.  Promulgation (Public Docs)
      3.  Non-retroactivity (No changing types after compilation)
      4.  Clarity (Intelligible specs)
      5.  Non-contradiction (No `assert(x > 0)` and `assert(x < 0)`)
      6.  Possibility (No demanding the impossible / Halting)
      7.  Constancy (API Stability)
      8.  Congruence (Docs match Implementation / Officials obey their own rules)
  *   **The Nazi Statute:** Fuller argues the Nazi regime failed these checks. The "statute" regarding denunciation was vague (violating Clarity), applied retroactively in court (violating Non-retroactivity), and officials acted with unaccountable terror (violating Congruence).
      *   **Fuller's Analysis:** This wasn't a "valid but evil" spec. It was **noise**. It failed the handshake protocol of Legality.
      *   **The Post-War Problem:** The court shouldn't have said, "It was law, but we punish you anyway." They should have said, "That regime failed to maintain a legal system. That directive was not law because it violated the procedural contract required for a directive to count as law."
      *   **FM Analogy:** If a config language allows you to write `x = 5` and then silently changes `x` to `6` at runtime based on the admin's mood, and documents `x` as `7`, you don't have a "buggy config system." You have **no config system**. You have a script that pretends to be deterministic but isn't. Calling it "law" is a category error, like calling a race condition a "feature."

  ---

  ### 2. The Residue Report

  Here is where the compilation fails. Some concepts link; others throw runtime errors in your framework.

  #### A. What Translated Cleanly
  **Well-formedness vs. Validity (Hart):**
  This maps perfectly. Hart is describing a **syntactic validity check**. In PL, we know a program can be well-typed but terminate immediately or delete the disk. Hart insists we call that a "program" (law) anyway. He wants to keep the verifier (legal validity) separate from the model checker (moral correctness). This is a robust engineering distinction. It prevents conflating "does it compile?" with "do we like it?"

  **Fuller's Proceduralism as Interface Stability:**
  Fuller's eight conditions translate beautifully into **API Guarantees**. If a library changes signatures without versioning (retroactivity), hides methods (secrecy), or documents one behavior and executes another (congruence), it breaks the trust required for clients (citizens) to build on top of it. Fuller is arguing that "Law" is not just a set of commands; it is a **service level agreement (SLA)** between state and citizen. If the SLA is breached, the service is down.

  #### B. What I Had to Fudge
  **Fuller's Threshold (The "Substantial Failure" Problem):**
  In FM, well-formedness is usually binary. The code compiles or it doesn't. Fuller admits that a legal system can fail *partially* on these criteria and still be law, but if it fails *substantially*, it ceases to be law.
  *   **The Fudge:** This is fuzzy logic, not boolean logic. Your framework struggles with "mostly well-typed."
  *   **The Risk:** This makes Fuller's claim vulnerable to the "Sorites Paradox." If one secret rule makes it not-law, why not two? If it's a gradient, then "Not Law" is just a rhetorical way of saying "Unacceptably Bad Spec."
  *   **Verdict:** This is a sign Fuller is doing rhetorical work. He wants a binary switch ("Not Law!") to justify disobedience, but the reality is a degradation of service. Translating it honestly reveals he's arguing for a **critical failure threshold**, not a formal type error.

  **Hart's Internal Point of View:**
  Hart insists officials must not just *obey* the RoR (like a script following a path), but *accept* it as a standard (using it to critique deviations).
  *   **The Fudge:** In FM, we model the system, not the developer's psychology. A compiler enforces types regardless of whether the engineer "believes" in them. Hart needs the officials to treat the RoR as a **normative reason**, not just a causal regularity.
  *   **The Risk:** This is social ontology, not formal ontology. You can model the *behavior* of acceptance (e.g., officials reject non-conforming rules), but you cannot model the *attitude*.
  *   **Verdict:** Real gap. FM describes *what the system does*. Hart describes *what the operators mean*. If you strip this out, Hart collapses into Austin's "Gunman Situation" (orders backed by threats), which Hart explicitly rejects. You need a primitive for "Normative Attitude" that doesn't exist in standard verification.

  #### C. What Has No Counterpart (The Hard Errors)

  **1. The Normative Force of "Validity" (The "Ought" Gap)**
  *   **The Issue:** In FM, if `spec` says `P` and `impl` satisfies `P`, the result is `True`. If `impl` violates `P`, the result is `False`. There is no *obligation* to fix it unless you care about the system's goal.
  *   **The Legal Reality:** When Hart says "It is Law," he implies a **prima facie obligation to obey** (unless it crosses a moral threshold). When Fuller says "It is Not Law," he implies **no obligation**.
  *   **The Translation Failure:** Your framework distinguishes *Correctness* from *Ethics*. Law conflates them in the concept of *Validity*.
      *   Hart says: Validity is Correctness. Ethics is separate. (You can have a Correct but Unethical program).
      *   Fuller says: Validity *includes* Ethics (procedural). (An Unethical program is Incorrect).
  *   **Verdict:** **Fuller is hacking the type system.** He is trying to bake moral/procedural constraints into the definition of "Law" so that "Invalid" automatically triggers "No Obligation." In FM terms, he is redefining `Valid` to mean `Verified + Safe`. Hart refuses this, keeping `Valid` as `Well-Typed`.
      *   *Harsh Truth:* Fuller's move looks like semantic stipulation. He wants to win the moral argument by definition. "If it's evil, it's not law" is a convenient type error, but it doesn't change the fact that the gun is still pointed at you. FM exposes this: A segfaulting binary still crashes your machine; calling it "not a program" doesn't help you debug.

  **2. The Nazi Case: Retroactive Patching**
  *   **The Issue:** The post-war German court punished the woman.
      *   **Hart:** Honest. "We are applying a new retroactive law because the old one was valid but evil."
      *   **Fuller:** "We are applying the *true* law, because the Nazi rule wasn't law."
  *   **The Translation Failure:** In FM, **Retroactivity is always a lie.** You cannot change the spec after the build.
      *   If Hart is right, the court committed a "spec violation" (retroactivity) to achieve a moral good. They patched the runtime silently.
      *   If Fuller is right, the court is claiming the original build was corrupt.
  *   **Verdict:** **Hart wins on engineering honesty.** Hart admits the court is doing something technically "illegal" (retroactive punishment) to fix a moral disaster. Fuller tries to claim the court is being "legal" by redefining the past spec.
      *   *Harsh Truth:* Fuller's position requires a time-traveling verifier. He claims the 1950 court can verify the 1944 spec as "invalid" based on 1950 standards of legality. In FM, this is unacceptable. A build is valid relative to the spec *at the time of build*. Fuller is smuggling 1950 morality into the 1944 type checker.

  **3. Obligation vs. Causation**
  *   **The Issue:** Why obey?
  *   **FM View:** You obey the spec because if you don't, the system fails (safety) or the build breaks (utility).
  *   **Legal View:** You obey because the system claims **Authority**.
  *   **The Gap:** FM has no primitive for Authority. It has Primitives for Power (root access) and Correctness (verification).
      *   Hart reduces Authority to Social Fact (Officials accept the RoR).
      *   Fuller reduces Authority to Procedural Integrity (The system deserves trust).
  *   **Verdict:** **Real Gap.** Your framework cannot express "Legitimate Authority." It can only express "Effective Control" (the runtime enforces the policy) or "Verified Correctness." The Hart-Fuller debate is ultimately about whether Authority derives from Source (Hart: Social Source) or Structure (Fuller: Procedural Structure). FM assumes the Source is trusted (Root) and checks the Structure. It cannot adjudicate which creates the *obligation*.

  ### Summary Judgment

  **Hart** translates as a **Strict Type Theorist**. He separates Syntax (Law) from Semantics (Morality). He is engineering-honest: "This code compiles. It does evil things. Do not run it, but don't lie and say it's syntax error."
  *   *Weakness:* He ignores that in social systems, "Syntax" *is* "Semantics." If the compiler is malicious, the type system is a weapon.

  **Fuller** translates as a **Safety-Critical Verification Engineer**. He argues that certain procedural guarantees (determinism, documentation, stability) are preconditions for the system to function as a "governance engine." If you violate them, the engine is scrap.
  *   *Weakness:* He tries to compile "Morality" into "Syntax." He wants `Invalid` to mean `Unjust`. This is a category error that FM exposes immediately. A spec can be perfectly clear, stable, and public (Fuller-compliant) and still demand genocide. Fuller's "Inner Morality" catches procedural evil, but not substantive evil.

  **The Residue:**
  The thing you cannot model is **Normativity**. FM tells you what *is* (the code, the spec, the execution). Law tells you what *ought to be done*. Hart admits this gap (Law is, Morality ought). Fuller tries to bridge it by redefining "Is" (Bad Law Is Not).
  *   **Final Call:** Hart is a better formalist. Fuller is a better systems architect. Hart describes the structure of the tool; Fuller describes the conditions under which the tool is safe to use. But Fuller's claim that unsafe tools "aren't tools" is rhetorical nonsense that dissolves under formal scrutiny. A broken hammer is still a hammer; it's just a dangerous one. Fuller wants to call it a "stick" so you don't feel bad about throwing it away.
