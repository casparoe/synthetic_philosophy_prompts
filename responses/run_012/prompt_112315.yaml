answer: |-
  Here is a complete 90-minute lesson plan, game design, and debrief guide.

  # Lesson Plan: The Unified Agent Protocol
  **Time:** 90 Minutes
  **Class Size:** 16 Undergraduates (4 Groups of 4)
  **Goal:** Demonstrate that the "narrative self" is a post-hoc construction, not a central commander.

  ---

  ## 1. Materials & Setup (15 Minutes)

  **Materials Needed:**
  *   **4 "Callosum Boxes":** Shoeboxes with a single vertical slit cut in the middle. (Label the slit: *MAX 3 WORDS*).
  *   **Index Cards:** Two colors (e.g., Red and Blue).
  *   **Blinders:** 4 pairs of cheap cardboard glasses or just instruct students to look down.
  *   **The "Action" Object:** A large, distinct button or bell for each group.
  *   **The "Scene" Cards:** Images printed on paper (e.g., a Fire, a Raincloud, a Party, a Test).
  *   **The "Command" Cards:** Simple imperatives (e.g., "RING BELL," "STAND UP," "RAISE HAND").
  *   **Payoff:** A bag of high-quality chocolate or a "Golden Neuron" trophy (a spray-painted rock). The prize goes to the group with the highest **Coherence Score**.

  **Room Arrangement:**
  *   Four tables spaced apart.
  *   At each table, 4 chairs.
  *   Place the Callosum Box in the center of the table. All notes must pass through the box. No talking over the table.

  **Role Assignment (The "Agent"):**
  Tell the class: *"For this hour, you are not individuals. You are four components of a single cognitive Agent. Your goal is to maximize Coherence Points."*

  1.  **V-L (Visual Left):** Sits on the left. Receives **Command Cards**. *Rule: Silent. Can write notes.*
  2.  **V-R (Visual Right):** Sits on the right. Receives **Scene Cards**. *Rule: Silent. Can write notes.*
  3.  **Motor (The Hand):** Sits center-front. Has the Bell/Button. *Rule: Silent. Can Act. Can receive notes.*
  4.  **Verbal (The Mouth):** Sits center-back. Faces the class. Has the Microphone (or just speaks). *Rule: Only one who can speak. Can receive notes.*

  **The Communication Constraint:**
  *   V-L and V-R cannot speak to Motor or Verbal.
  *   They must pass notes through the Callosum Box.
  *   **Strict Limit:** Max 3 words per note.
  *   **Bottleneck:** Only one note can be in the box at a time.

  ---

  ## 2. The Game: "Rational Action" (30 Minutes)

  **The Payoff Scheme:**
  *   **Speed:** First group to act gets 5 points.
  *   **Coherence:** The Class (acting as the "Environment") rates the Verbal explanation from 1-5 on how sensible it sounds.
  *   **Penalty:** If Verbal says "I don't know" or "They told me to," the group loses 10 points. *This is crucial: You must incentivize confabulation.*

  **Round 1: Calibration (5 Mins)**
  *   Give V-L and V-R the *same* info (e.g., Command: "Ring", Scene: "Fire").
  *   Let them pass notes freely (within limits).
  *   Motor rings. Verbal says "We rang because of the fire."
  *   *Purpose:* Establishes the baseline of unity. It feels easy.

  **Round 2: The Split (10 Mins)**
  *   **The Setup:**
      *   **V-L** gets a Command Card: **"RING BELL."** (They pass this note *only* to Motor).
      *   **V-R** gets a Scene Card: **"PICTURE OF A SNAKE."** (They pass this note *only* to Verbal).
      *   **Crucial Rule:** V-L is forbidden from telling Verbal what the command is. V-R is forbidden from telling Motor what the scene is.
  *   **The Action:** Motor receives "RING BELL." Motor rings the bell.
  *   **The Interrogation:** Immediately stop the class. Turn to the **Verbal** student.
  *   **The Demand:** Ask loudly: *"Agent 1, why did you just ring the bell?"*
  *   **The Trap:** Verbal has not seen the Command. Verbal has only seen "Snake." To win points (and avoid the penalty), Verbal must invent a link.
      *   *Expected Confabulation:* "Because we saw a snake and wanted to scare it."
  *   **Freeze:** Do not let the group discuss yet. Record the explanation on the board.

  **Round 3: Escalation (15 Mins)**
  *   Repeat with different mismatches.
      *   Command: "Stand Up" / Scene: "Picture of a Chair."
      *   Command: "Clap Hands" / Scene: "Picture of a Sad Face."
  *   Increase the pressure. Shout "Explain!" immediately after the action.
  *   Keep the scores visible. Watch the Verbal students sweat as they try to weave a narrative that connects their limited info (Scene) to an action they didn't initiate (Command).

  ---

  ## 3. The Reveal & Debrief (30 Minutes)

  **Step 1: The Comparison (5 Mins)**
  *   Allow the groups to finally talk freely.
  *   Ask V-L: "What was your instruction?" (e.g., "Stand Up").
  *   Ask Verbal: "What did you say was the reason?" (e.g., "Because the chair looked uncomfortable").
  *   Ask the class: "Did the Verbal student feel like they were lying?" (Usually, they say no. They felt like they were *solving*.)

  **Step 2: Mapping the Concepts (15 Mins)**
  *   **Do not mention Split-Brain yet.** Ask: "Where did the 'reason' come from?"
  *   **The Interpreter:** Explain that the Verbal role models the Left Hemisphere's language center. It doesn't know the cause of the action (which came from the other 'half'), but it cannot tolerate a vacuum of explanation.
  *   **Unity of Access vs. Unity of Agency:**
      *   *Agency:* The Motor acted. The group acted.
      *   *Access:* The Verbal module did not have access to the cause.
      *   *The Illusion:* Despite the lack of access, the report was delivered with 100% confidence. The "feeling" of knowing why we do things is often a story told *after* the body moves.
  *   **Confabulation:** It isn't lying. Lying requires intent to deceive. Confabulation is the brain filling a gap with the best available data to maintain the model of a coherent self.

  **Step 3: Naming the Beast (10 Mins)**
  *   Now you can say it: **Split-Brain (Commissurotomy).**
  *   Describe the actual experiments (Gazzaniga's chicken claw/shovel).
  *   Explain that in the patients, the "V-L" and "V-R" are actual physical hemispheres, and the "Callosum Box" is the severed corpus callosum.
  *   **Key Insight:** The patients don't feel like four people. They feel like one person who sometimes does weird things. Just like your Verbal students felt like one Agent, not a puppet.

  ---

  ## 4. Troubleshooting: Predictable Failures

  **1. The Honest Rebel**
  *   *Scenario:* The Verbal student says, "I don't know. Motor just did it."
  *   *Why:* They value truth over points, or they feel the game is "rigged."
  *   *Your Move:* Validate them. "This is the only honest answer. But notice the social pressure you felt to give a reason anyway. In the real brain, there is no 'opt-out.' The Interpreter *must* speak."
  *   *Teaching Point:* Use this to highlight that confabulation is often automatic, not chosen.

  **2. The Rule Breaker**
  *   *Scenario:* V-L whispers to Verbal, or Motor talks.
  *   *Why:* The frustration of the "Callosum Box" is too high.
  *   *Your Move:* Stop the round. Deduct points. "You just performed a lobotomy on yourself. You restored the connection. Now the experiment is ruined."
  *   *Teaching Point:* Use this to explain how robust the corpus callosum usually is. We don't notice the separation because the channel is usually open.

  **3. The Cynic**
  *   *Scenario:* A student says, "This is fake. We know we're pretending."
  *   *Why:* They are meta-gaming.
  *   *Your Move:* "Exactly. You have 'top-down' knowledge. The brain doesn't. The brain is trapped inside the skull with only its own signals. You are simulating the *structure* of the problem, not the *qualia*."

  ---

  ## 5. Limitations: The "Honesty Clause" (15 Minutes)

  *This is the most important part for academic integrity. Do not skip this.*

  Gather the students. Put the props away. Speak plainly.

  **What the Game Got Wrong:**
  1.  **The Feeling of Division:** In the game, you *felt* fragmented. You felt frustrated that you couldn't talk.
      *   *Reality:* Real split-brain patients **do not feel divided.** They feel like one normal person. The "Unity of Self" is so robust that even when the hemispheres are physically cut, the *feeling* of unity remains.
      *   *Why:* Because consciousness isn't a little person watching the brain. It's the output. If the output is coherent (mostly), the feeling is coherent.
  2.  **Four People vs. One Brain:** You are four distinct consciousnesses pretending to be one.
      *   *Reality:* A split-brain patient is **one consciousness** with two processing centers that can't share data.
      *   *The Paradox:* If the left hand buttons a shirt and the right hand unbuttons it, the patient doesn't say "My right hand is rebelling." They say "I changed my mind." The Interpreter smooths over the conflict instantly.
  3.  **The "Why":** In the game, the Verbal student knew they were guessing.
      *   *Reality:* The patient *believes* the confabulation. There is no "inner knowledge" that they are wrong. The feeling of certainty is part of the error.

  **Closing Thought:**
  *"We played a game where you tried to act like a broken brain. But the lesson is that your normal brain is already doing this. You don't need a severed corpus callosum to confabulate. You do it every time you explain why you liked a movie, why you chose a partner, or why you're angry, using a narrative system that only woke up after the decision was already made."*

  **End of Session.**
