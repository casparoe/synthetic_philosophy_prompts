answer: |-
  You are experiencing a collision between three distinct political technologies: the American libertarian-market model (data is property, share it unless it hurts you), the German rights-based model (data is dignity, the state must be kept at bay), and the Chinese utilitarian-model (data is governance, the collective score outweighs individual opacity). Your gut is not broken; it is triangulating.

  There is no single principle that captures all your verdicts without forcing you to abandon at least one of your strong intuitions (specifically regarding the undocumented neighbor or the school district). The "Counting vs. Steering" slogan is useful, but it fails because sometimes the state counts *in order to* steer (policing), and sometimes private entities count *in order to* count (market research), and your moral judgment flips based on the *consequence* of the count, not the act itself.

  To get close to your actual moral geometry, you need two principles that operate in tension.

  ### The Two Principles

  **1. The Principle of Civic Integrity**
  You owe accurate data to any system from which you derive essential stability or public goods, provided that system operates under the rule of law and treats subjects equally. This covers taxes, census, address registration (*Anmeldung*), and employer logistics. Lying here degrades the system you rely on.
  *   *Verdicts supported:* Taxes, bank reporting, giving employer your address, census (refusal is okay, lying is not).
  *   *Verdicts forced to give up:* None, unless you view the school district or immigration enforcement as illegitimate systems.

  **2. The Principle of Defensive Autonomy**
  You are permitted to withhold or falsify data when the receiver has disproportionate power to use that data to harm you, limit your agency, or treat you unequally, and when you lack meaningful consent. This covers advertisers, surveillance, and predatory institutions.
  *   *Verdicts supported:* VPNs, loyalty program lies, license plate cameras, bank selling data, journalist doxxing.
  *   *Verdicts supported (The Exceptions):* The undocumented neighbor and the school-district parent. In these cases, the "Civic Integrity" contract is broken (the state is not treating them equally or safely), so "Defensive Autonomy" overrides it.

  ### Where They Collide

  The collision happens exactly where your gut wobbles: **When the State is the adversary.**

  In the German model, the Data Protection Officer (DPO) exists because the State is assumed to be potentially dangerous (historical trauma), but also necessary. In your American model, the State is often assumed to be inefficient but benign. In your neighbor's model, the State is an operating system that cannot be opted out of.

  Your verdict on the **undocumented neighbor** and the **school-district parent** violates Civic Integrity. By those lights, they are corrupting a public allocation system. But they satisfy Defensive Autonomy because the harm of compliance (deportation, unequal education) outweighs the harm of the lie (statistical noise, administrative friction).

  If you force a single principle, you have to choose: Is the "Social Contract" sacred, or is "Individual Safety" sacred? Your gut says Safety wins when the Contract is unjust. That is not a bug; it is a political stance.

  ### The Test Cases

  Here is what these two principles predict for your new scenarios:

  **1. A national DNA database for people arrested but not convicted.**
  *   **Verdict:** Not fine.
  *   **Reasoning:** Violates Defensive Autonomy. It presumes guilt (power asymmetry) and creates permanent risk from a temporary state (arrest). It serves state counting/steering without a conviction to justify the necessity. Your German colleagues would be horrified; your American lab might not care. Your gut should side with the Germans here.

  **2. Your institute's badge system logging building entry.**
  *   **Verdict:** Fine (with caveats).
  *   **Reasoning:** Satisfies Civic Integrity. It is necessary for security and resource allocation within a private/semi-private organization you voluntarily joined.
  *   **Caveat:** If the data is used to monitor productivity (steering) rather than security (counting/safety), it shifts to Defensive Autonomy territory and becomes not fine. Your indifference suggests you trust the institute; your colleagues' appall suggests they fear the steering. The principle says their fear is the safer bet.

  **3. An insurer that wants your fitness-tracker history.**
  *   **Verdict:** Not fine.
  *   **Reasoning:** Violates Defensive Autonomy. This is secondary use of behavioral data to adjust risk pricing. It turns health into a surveillance metric. It is steering (pricing you out) based on counting (steps taken).

  **4. A supermarket that lets you in only if it recognizes your face.**
  *   **Verdict:** Not fine.
  *   **Reasoning:** Violates Defensive Autonomy and Civic Integrity. Access to food is a basic necessity. Making it conditional on biometric identification creates a massive power asymmetry. It is coercive.

  ### The German Context

  You mentioned the Data Protection Officer (DPO) seems to be protecting you from *steering* rather than *counting*. You are correct. The German *Grundgesetz* (Basic Law) establishes a right to "informational self-determination." The logic is that if the state (or corporations) can count everything about you, they can inevitably steer you. Therefore, limiting the count *is* limiting the steer.

  Your roommate from Hangzhou shrugs because in her context, the social credit system posits that being steered is the point of society. Your American colleagues didn't blink at the SSN sheet because the friction of privacy was higher than the risk of harm. You are in Berlin, where the friction of privacy is the *protection* against harm.

  ### Summary

  You don't need to fix your gut. You need to recognize that you are holding two conflicting maxims:
  1.  **Play fair with the systems that keep you safe.** (Taxes, Address, Census)
  2.  **Defend yourself against systems that can hurt you.** (Police, Ads, Surveillance)

  The confusion arises when the system that is supposed to keep you safe (the State) becomes the one that can hurt you (Immigration, Inequitable Schools). In those moments, your gut correctly prioritizes Defense over Integrity. That is not inconsistency; it is survival.

  (And yes, I have checked this for "organisation" vs "organization." You are safe.)
