prompt: |-
  so i've been reading about the whole business of whether the Trojan War was a real event, whether there was a historical Arthur, whether there was an Exodus, and a friend of mine who does ancient history keeps waving the whole question away with the same line: oral tradition is just a game of telephone. you start with something that happened, everyone whispers it down the line, and by the time anybody writes it down it's unrecognisable, so whats in Homer or the Arthur stories or the Exodus narrative is basically noise with a couple of random facts stuck in it. it's a neat line and it does a lot of work for him — he uses it to say we shouldn't even bother trying to pull history out of these stories, it's a mug's game.

  but i'm not sure it's as clean as he makes it sound and i'd like you to audit it for me. i want the mapping laid out: what's supposed to line up with what, what's the original message, who are the whisperers, what plays the role of the noise, what's the sheet of paper at the end. then where the thing actually comes apart. a telephone chain has no memory keepers, nobody with a reason to preserve anything, no metre or ritual or genre shaping what survives, no tellers checking each other, no institutions with an interest in one version over another — and these traditions aren't like that at all, they get retold by people who care about the version, tied to festivals and genealogies and claims to land or legitimacy. it also seems to quietly assume there's a single original message and that the whole point is recovering it, which might not be what anyone in the chain is even doing. so where does the mapping hold, where does it break, and does his conclusion — you can't get history out of legend — actually survive once the disanalogies are on the table, or was the analogy carrying the whole thing and it collapses without it. and if he wants an analogy at all, tell me what a better one would be.

  one request though: write it as straight prose, no headings or bullet points or tables or bold text, just continuous paragraphs the way you'd write it in an email. i can't read the bulleted stuff, it makes my eyes glaze over.
