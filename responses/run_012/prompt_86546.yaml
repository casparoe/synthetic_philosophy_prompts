      *   **Founder's Argument:** Non-interference based on "wildness" and lack of responsibility. This aligns with *Ecocentrism* or *Deep Ecology* (value lies in the system/process, not individual welfare) and a specific view of *Negative Duty* (we only have duties not to harm, not to help).
      *   **User's Intuition:** Suffering is bad regardless of cause. This aligns with *Sentientism* or *Welfarism* (individual suffering matters) and potentially *Positive Duty* (if you can prevent bad things without sacrificing something of comparable moral importance, you should - Peter Singer).
