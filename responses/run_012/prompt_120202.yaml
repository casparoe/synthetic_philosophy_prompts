answer: |-
  The ferry hummed, a low diesel vibration that lived in the floorboards and traveled up through the soles of their shoes. Outside, the North Sea was throwing itself against the hull, rhythmic and heavy. Barnaby, the dog, was asleep under the bench, twitching in a dream about chasing something that didn't exist.

  Theo was looking at the rain streaking the window. Nadia was watching Theo.

  "You're doing the thing," she said. Her voice was quiet, competing with the engine.

  "What thing?"

  "Looking at the universe like it's a crime scene. Like you're waiting for it to confess."

  Theo turned from the glass. He looked tired. They both were. The bar had closed an hour ago, leaving them with stale vending machine coffee and the long night. "I'm not looking for a culprit, Nadia. I'm looking for the floor."

  "There is no floor. That's the point. That's why we work."

  "That's why *you* work," Theo said. He reached out, touching her knee, a reflexive warmth. "I'm just saying, if the simulation argument holds water—and the math suggests it might—then you're building a cathedral on a trapdoor."

  Nadia shifted, pulling her coat tighter. "We've been over this. If we are simulated, then somebody out there evidently made it through the bottleneck and built all this. They solved physics. They built the computer. That sounds more like evidence the far future is achievable than a reason to doubt it."

  "It proves *they* achieved it," Theo said. "Not us. If we're in a simulation, we're likely a historical reconstruction or a stress test. We're the petri dish. You don't save the bacteria in the petri dish, Nadia. You observe them until the experiment is done, and then you scrape them into the bin."

  "That's dramatic."

  "It's structural. You're betting on leverage. You're saying, 'Give me a dollar now, I'll turn it into a billion years of civilization.' But if the simulation gets switched off, or runs short, or runs on somebody else's budget, your leverage drops to zero. You can't be a fanatic about a future that could be pulled out from under you by a guy in a basement turning off the power strip."

  Nadia leaned forward, elbows on her knees. The light from the overhead fixture caught the sharp line of her jaw. "An off-switch is just one more improbable disaster among many. Asteroids. Nuclear war. Engineered pathogens. I stake my life on the chance that we avoid those. Why is the sim hypothesis different? It's just another risk vector."

  "Because it changes the denominator," Theo said. "Expected value is an average over the worlds you might be in, and you don't get to add a branch without subtracting something. If there's a fifty percent chance we're sims, and sims have a ninety percent chance of being terminated before interstellar expansion, you've just halved the value of your entire foundation's existence. Maybe more."

  "So I work twice as hard."

  "No. You work differently. Or you admit that the fanaticism relies on a solidity that isn't there." Theo rubbed his face. "The sim hypothesis doesn't shrink the value of the future, necessarily. It shrinks your leverage over it. And leverage is the thing your fanaticism quietly assumes. You assume your actions ripple outward. In a sim, your actions might just be data points."

  Nadia was quiet for a moment. She watched Barnaby's paw twitch again. "You think I don't know about uncertainty? You think I sleep well because I'm sure?"

  "I think you sleep because you ignore the void."

  "I ignore nothing," she snapped, then softened. "I'm saying that uncertainty is fuel rather than water. If the future is fragile, it needs protecting. If it's fake, it needs saving from deletion. The stakes don't go down, Theo. They go up. If there's an audience watching this simulation, maybe how we behave matters even more. Maybe we're being graded."

  "That's Pascal's Wager with extra steps."

  "It's pragmatism." She reached out, covering his hand on her knee. Her fingers were cold. "Look. You're a cosmologist. You deal in scales I can't even visualize. You tell me the universe is mostly empty, mostly dead. And yet here we are. Conscious. If the odds of us being the 'real' base reality are one in a billion, fine. But the payoff is still infinite. Why do you get to let the probability dampen the infinity? You of all people should know that rare things happen."

  "Because I also know that when the numbers shift, the physics changes," Theo said. He didn't pull his hand away. "If we're sims, the physics we're studying is code. It can be patched. You can't protect against a patch. You're trying to safeguard a billion-year horizon, but you're doing it with tools that might be sandboxed. It's like trying to unionize the characters in a video game. Even if you win, the players can still quit."

  "Then we make sure they don't want to quit."

  "Nadia."

  "I'm serious. If the future is a stage set, then our job is to make the play so compelling the producers keep it running. You're talking about leverage like it's a fixed constant. It's not. We build the leverage. We make ourselves indispensable."

  Theo looked at her, really looked at her, with that mix of admiration and fear that had kept them together through two books and a marriage. "You're terrifying," he said softly. "Do you know that? You're willing to burn your life on a probability distribution that might be imaginary."

  "Someone has to," she said. "If you're right, and we're sims, then the people in base reality who built us? They probably had someone like me too. Someone who refused to let the uncertainty stop them. If I stop, I'm proving your point. I'm showing them the experiment failed."

  "And if you keep going, and you're wrong, you've wasted a life on a ghost story."

  "Better than wasting a life on certainty," she said. "You want me to wait until I know? Theo, the bar is closed. The boat is moving. We don't know where we're docking. We just know we have to steer."

  Theo sighed, leaning back into the vinyl seat. The ferry hit a wave, a heavy lurch that rattled the cups on the table. Barnaby woke up, shook himself, and rested his head on Nadia's boot.

  "I'm not asking you to stop," Theo said. "I'm asking you to acknowledge that the ground might not be there. I don't want you to fall because you forgot to look down."

  "I look down," Nadia said, stroking the dog's ear. "I just don't let it stop me from looking up."

  "They're mutually exclusive, sometimes."

  "Then I'll blink." She took a sip of the cold coffee, grimaced, and set it down. "You don't have to believe the future is real, Theo. You just have to believe it's possible. Can you do that?"

  Theo looked out at the black water. The rain hadn't let up. "I believe the math," he said. "And the math says there's a lot of ways for this to be nothing."

  "And I believe the rest of the equation," Nadia said. "The part where someone has to solve for X."

  Theo didn't answer. He just watched her hand on the dog, steady despite the rolling deck. He reached over and turned her coffee cup slightly, aligning the handle with her hand. A small correction. A small care.

  "We're not docking for six hours," he said.

  "Then we steer," she said.

  Theo nodded, once. He didn't agree. But he didn't look away, either. The engine hummed on, vibrating through the floor, pushing them blindly through the dark.
