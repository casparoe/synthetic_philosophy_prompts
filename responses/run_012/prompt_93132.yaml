  ok so ive been lurking on LessWrong and the surrounding blogs/forums for like a decade now, and i want to turn a half-baked idea into a term-paper proposal. one semester, ~6000 words, philosophy dept. i have no internet access for this so don't tell me to go read specific people — i'll fill in the lit myself, just refer to the positions/arguments.

  the idea: everybody treats the coherence arguments (the money-pump stuff, the VNM-style representation story, dutch books) as if they show that any agent who isn't maximizing expected utility is irrational or "incoherent." but every version of the pump i can think of quietly needs a few things: a fixed menu of options, an adversary who can march you through a *long* sequence of trades (sometimes infinitely long), and a you who can be represented as having a stable preference ranking over all the compound gambles involved. i want to poke at whether these arguments are really about rationality at all, or about *exploitability* — and exploitability only means anything relative to a class of adversaries/pumps you're willing to count. if you shrink that class down to "adversaries no more resourceful than the agent," i have a suspicion the argument loses its teeth in a specific, characterizable way, and i want to know exactly where.

  so the question id want the paper to nail down, stated so it has a determinate answer: is there a version of the coherence argument that assumes only that you're a physically real, resource-bounded decision-maker (finite time, no infinite trade sequence, maybe not even able to represent all the compound gambles), and does that version still force expected-utility maximization — or does it leave a principled gap where you could be a non-EU maximizer and yet not be pumpable by any adversary that isn't strictly more powerful than you?

  i want you to write the proposal. include:

  - the question stated precisely enough that i can tell when ive answered it, and a clear statement of what the two or three candidate answers are
  - why the standard positions on coherence arguments leave this open (i.e., why they either smuggle in idealization or dodge the resource question)
  - the method: what i'd actually *do* month by month. im thinking the core move is to define a couple of toy adversary/agent classes of increasing power (say: an adversary that has to commit to the whole pump in advance vs. one that can adapt; an agent that can be modeled as a single fixed preference relation vs. one that cant), then ask at which level the pump goes through and at which level the non-EU agent survives. flesh that out and tell me if its the right way in, or if there's an obvious alternative approach i should use instead and why not
  - what a result would look like, and what would count as the project *failing* (i actually want a real answer here, not "it depends")
  - an honest scope check: is this a semester or is it secretly a dissertation

  dont bother with citations or a reading list, i'll add those. just make it a tight proposal a committee would take seriously, and dont let it collapse into "well, rationality is complicated" — i want a real claim on the table.
