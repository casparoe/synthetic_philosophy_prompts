answer: |-
  **Proposal Title:** Resource-Matched Coherence: A Bounded Analysis of the Money-Pump Argument

  **1. Research Question and Candidate Theses**

  **Primary Question:** Does the normative force of coherence arguments (specifically money-pump/Dutch-book style arguments) survive when the adversarial mechanism required to execute the pump is constrained by the same resource bounds (memory, computational steps, temporal duration) as the agent being pumped?

  Stated differently: Is there a principled gap between *logical* incoherence and *physical* exploitability for resource-bounded agents, such that a non-Expected-Utility (non-EU) maximizer can be immune to all adversaries that are not strictly more powerful than the agent itself?

  **Candidate Theses:**
  1.  **The Robustness Thesis:** Even under matched resource bounds, any violation of EU axioms allows for a constructible pump. The resource costs of executing the pump are negligible compared to the sure loss incurred, so the argument holds.
  2.  **The Immunity Thesis:** There exists a class of non-EU agents (e.g., those with intransitive preferences or context-dependent valuations) that cannot be pumped by any adversary operating within the same resource class. The "cost" of tracking the pump exceeds the "gain" from the pump, rendering the agent ecologically rational despite logical incoherence.
  3.  **The Dissolution Thesis:** Under strict resource matching, the concept of a "preference relation" over compound gambles dissolves. The argument fails not because the agent survives, but because the formalism required to state the pump (stable global preferences) is unavailable to the bounded agent.

  **2. Background and Problem Statement**

  Standard coherence arguments in decision theory posit that if an agent's preferences violate axioms like transitivity or independence, a clever adversary can construct a sequence of trades (a money pump) that leaves the agent strictly worse off than where they started. This is taken as a normative proof that rational agents *must* conform to Expected Utility maximization.

  However, these arguments typically rely on unspoken idealizations regarding the adversary and the environment:
  *   **The Omniscient Bookie:** The adversary is assumed to know the agent's preference structure perfectly and can calculate the pump sequence instantly.
  *   **Infinite/Indefinite Horizons:** Many pumps require cycling through options indefinitely or relying on the agent's inability to recognize a loop.
  *   **Global Preference Stability:** The argument assumes the agent can be modeled as having a single, static preference ranking over all possible trade histories.

  These idealizations smuggle in a power asymmetry. The adversary is treated as a logical function, while the agent is treated as a physical object subject to friction. If we treat both as physical systems with finite memory and processing time, the adversary may lack the capacity to track the state necessary to execute the pump before the agent's resource limits degrade the interaction. Current literature leaves this open because it treats coherence as a property of *logic* rather than *computation*. It assumes that if a pump is logically possible, it is normatively binding, ignoring the physical feasibility of the pump itself. This project challenges that assumption by asking if "rationality" is actually a claim about logical consistency or a claim about survivability against peers.

  **3. Methodology**

  The core method will be the construction and analysis of formal toy models comparing agent and adversary capabilities. I will avoid general complexity-theoretic proofs (which risk becoming purely mathematical) and focus on decision-theoretic models with clear philosophical interpretations.

  *   **Month 1: Formalizing the Bounded Agent.**
      I will define a minimal agent model. This agent will have a finite state memory (e.g., capable of remembering only the last *k* transactions) and a limited decision procedure (e.g., cannot compute utility over compound gambles deeper than depth *d*). I will select a specific violation of EU to test, likely intransitivity (A > B > C > A), as this is the standard target for money pumps.

  *   **Month 2: Formalizing the Bounded Adversary.**
      I will define the adversary not as an external god, but as a system within the same computational class as the agent. The adversary must commit to a strategy. I will distinguish between two adversary types:
      *   *Pre-committed:* Must specify the trade sequence in advance.
      *   *Adaptive:* Can choose the next trade based on the agent's previous choice, but pays a memory cost for doing so.
      The key constraint is that the adversary cannot possess more memory or computational steps than the agent.

  *   **Month 3: Scenario Analysis.**
      I will run the interaction. Can the Adaptive Adversary extract value from the Intransitive Agent within *k* steps?
      *   *Scenario A:* The pump requires tracking the cycle position. If the agent's memory is too short to recognize the cycle, does the adversary's memory also fail to track it to exploit it?
      *   *Scenario B:* The cost of the trade (transaction cost) is introduced. If the pump requires microscopic gains, does the computational cost of calculating the next move outweigh the gain?
      I will look for the "breakpoint" where the adversary requires more resources than the agent to execute the pump.

  *   **Month 4: Synthesis and Drafting.**
      I will interpret the results normatively. If the Immunity Thesis holds, I will argue that coherence arguments are ecological claims, not logical ones. If the Robustness Thesis holds, I will argue that resource bounds are irrelevant to the core logical contradiction.

  **Alternative Approach Considered:**
  An alternative would be to use Computational Complexity classes (e.g., P vs. PSPACE) to categorize agents. I am rejecting this because it shifts the paper into computer science. The philosophical payload lies in the *normative* implication of the bounds, not the complexity classification itself. A toy model with explicit step-counts is sufficient to demonstrate the principle without getting bogged down in hierarchy proofs.

  **4. Success and Failure Conditions**

  **Success:**
  The project succeeds if it produces a determinate model where the resource constraints are clearly defined and the interaction yields a binary result: either the pump is executable within the bounds or it is not.
  *   *Positive Result:* A demonstration of a specific non-EU agent configuration that is logically incoherent but physically un-pumpable by a resource-matched adversary.
  *   *Negative Result:* A demonstration that even minimal resources (e.g., memory of size 1) are sufficient for an adversary to exploit standard incoherences.
  Either outcome counts as success because it answers the Research Question definitively.

  **Failure:**
  The project fails if the model becomes trivial or inconclusive.
  *   *Triviality:* If the resource bounds are set so low that *no* interaction is possible (e.g., memory = 0), the result is uninteresting.
  *   *Inconclusiveness:* If the proof relies on "it depends on the specific constants," the project fails. I must select constants that represent a principled class (e.g., "asymptotic behavior" or "worst-case scenario").
  *   *Scope Creep:* If I attempt to solve this for *all* possible preference violations rather than a specific test case (like intransitivity), the paper will remain unfinished.

  **5. Scope Assessment**

  **Is this a semester paper or a dissertation?**
  This is a **semester paper**, provided the scope is strictly limited to a *existence proof* rather than a *general classification*.

  *   *Dissertation Scope:* Attempting to categorize all possible bounded agents and all possible adversaries to create a general "Theory of Bounded Coherence." This would require extensive complexity theory and is too large for 6000 words.
  *   *Semester Scope:* Constructing *one* working counter-example. I do not need to prove that *all* non-EU agents are immune. I only need to show that *there exists* a plausible bounded agent and a matched bounded adversary where the pump fails. One clear toy model where the adversary runs out of memory before the agent is drained is sufficient to prove the "gap" exists.

  **Risk Management:**
  The primary risk is mathematical overhead. To mitigate this, I will use discrete step-counting rather than continuous functions. I will treat "computation" as "number of trade offers made." This keeps the formalism readable for a philosophy committee while retaining the rigor needed to answer the question. The focus must remain on the *normative implication* (what this means for rationality) rather than the *mechanics* of the model.

  **Conclusion:**
  This project isolates a specific vulnerability in standard coherence arguments: the assumption of an unbounded adversary. By formalizing the adversary as a peer rather than a god, I will determine whether Expected Utility maximization is a requirement of logic or merely a requirement of surviving against superior computational power. The result will clarify whether "rationality" is an internal property of the agent or a relational property between the agent and its environment.
