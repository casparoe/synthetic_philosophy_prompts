answer: |-
  It is smart to pause before diving into the literature because everyone argues past each other when they haven't agreed on what counts as a win. You are asking for the specification document before the engineering begins, which is exactly the right move. To build an adequate theory of object persistence, you need a list of deliverables that any contender must satisfy, and we need to be clear about which of these are hard logical constraints and which are just intuitive preferences that different camps fight over.

  The first requirement is non-negotiable and comes from logic itself, not intuition. Identity must be an equivalence relation. This means it has to be reflexive, symmetric, and most importantly, transitive. If object A is the same as object B, and object B is the same as object C, then A must be the same as C. You cannot have a theory that says A is B and B is C but A is not C. This is doing the work in your case three, where two ships trade planks. If ship A gradually becomes ship B, and ship B gradually becomes ship A, transitivity forces a very specific verdict on whether they swapped identities or not. You cannot allow circular identity. This is a hard constraint. Any theory that violates transitivity is logically broken, not just counterintuitive.

  The second requirement is the uniqueness constraint, often called the one-to-one principle. At any given time, there can be only one object that is identical to a specific past object. You cannot have two distinct things both being the original Ship of Theseus. This is non-negotiable for classical logic, though some modern theories try to wiggle out of it. This requirement is doing all the work in your case two, where the original planks are reassembled into a ship while the continuously repaired ship is still sailing. If your theory says the sailing ship is the original because of continuity, and also says the reassembled ship is the original because it has the original matter, you have violated uniqueness. You have two originals. A theory must deliver a verdict that preserves uniqueness, or it must explicitly reject uniqueness as a requirement.

  The third requirement is sortal sensitivity. The theory must distinguish between being the same object and being the same kind of thing or the same matter. This is where your case five, six, and eight come in. When you look at the blueprint, or the river, or the digital file, you are often tracking information or function rather than material constitution. A river is the same river even if the water is different, but a ship is usually thought to be the same ship only if there is some continuity of the vessel itself. An adequate theory must explain why identity conditions vary depending on what sort of thing you are talking about. It cannot treat a person, a flame, and a statue exactly the same way. This is non-negotiable because our language and practice clearly distinguish these cases, but exactly where to draw the lines is often a preference of one camp versus another.

  The fourth requirement is applicability to persons. Whatever rule you write for ships had better not dissolve the self. This is your case seven and nine. If your theory says that replacing enough parts destroys the object, then you are not the same person you were seven years ago when your cells replaced themselves. If your theory says that discontinuity destroys the object, then going to sleep might kill you. This is a non-negotiable constraint for any theory that wants to be metaphysically serious rather than just a puzzle about boats. It must accommodate biological and psychological continuity without contradiction.

  The fifth requirement concerns determinacy. Does the theory have to give a yes-or-no answer in every case, or can it say it is indeterminate? This is the meta-question you raised about your case three, the swapping ships. If the swap happens plank by plank, there seems to be no precise moment where they switch identities. If identity is a real relation in the world, most philosophers argue it cannot be vague. There cannot be a fact of the matter that is fifty percent true. So the standard requirement is that verdicts must be determinate. However, this clashes with the intuition that there is no fact of the matter in borderline cases. You have to decide if your spec allows for ontic vagueness or if it demands a sharp cutoff. This is where preferences diverge sharply. Classical logic demands determinacy, but linguistic intuition often suggests indeterminacy.

  Now, here is the problem you suspected. There is a subset of these requirements that cannot all be satisfied at once when you look at your case two, the reassembly paradox. You have three strong demands competing here. You want to say that spatio-temporal continuity matters, so the continuously repaired ship is the original. You also want to say that material constitution matters, so the reassembled planks are the original. But you also must satisfy the uniqueness constraint, which says there can only be one original. You cannot have all three. If continuity is sufficient for identity, and constitution is sufficient for identity, then in case two you have two originals, which violates uniqueness. Something has to give.

  If I were writing the spec, I would drop the requirement that material constitution is sufficient for identity in artifacts. I would keep uniqueness and I would keep continuity. It is less damaging to say that the reassembled planks are a replica than it is to say there are two original ships or that the continuously sailing ship is a new object. Material constitution is a preference of the constitution camp, not a logical necessity. Continuity and uniqueness are closer to the core of what identity means. So the inconsistent triad is Continuity, Constitution, and Uniqueness. Drop Constitution for artifacts.

  Regarding your question about which single requirement does the most to rule theories out, it is the uniqueness constraint combined with the demand for determinacy. This combination kills any theory that tries to be too accommodating. If you allow branching identities, you save your intuitions about case two but you break logic. If you allow vague identity, you save your intuitions about case three but you break the logic of identity relations. Theories that try to say both ships are partially the original, or that identity comes in degrees, are ruled out immediately by the logical requirement that identity is an all-or-nothing equivalence relation. So the requirement for binary, determinate, unique identity is the filter that removes the most contenders.

  To answer your meta-questions directly, the theory should not allow degrees of identity. Something is either identical to itself or it is not. Sixty percent the same thing is not a coherent metaphysical statement under standard logic; it usually means sixty percent similar, which is a different relation. However, the theory is allowed to say there is no fact of the matter in borderline cases, provided it treats that as a semantic failure rather than an ontic one. It can say the word ship does not refer precisely enough to give a verdict in case three, without saying the object itself is vaguely identical. This preserves the logic while respecting the vagueness of language.

  Finally, you noted you are mixing up same object with same kind. The spec needs to enforce a distinction here. Same kind is about classification. Same object is about numerical identity. Your case five, the blueprint, is likely the same design but not the same object. Your case six, the river, is the same object under the sortal river but not under the sortal water. An adequate theory must be sortal-relative. It must say identical relative to what concept. Without that, you cannot handle the difference between a person surviving cell replacement and a ship surviving plank replacement.

  When you go to look at the usual candidates, you will see them trying to meet this spec. Endurantists will struggle with the continuity requirement across time. Perdurantists will handle continuity well by treating objects as worms in time but will struggle with the intuition that you are a whole person now. Nihilists will deny the ships exist at all to avoid the problem, which meets the logical constraints but fails the personhood requirement. But you do not need to score them yet. Just hold this spec against them. If a theory violates transitivity, discard it. If it allows two originals without explanation, discard it. If it cannot explain why you are the same person who started this conversation, discard it. Build the fence first, then see which animals can fit inside.
