answer: |-
  Here is the specification for an adequate theory of famine, structured as a requirements document. I have categorized each requirement by its status (Non-Negotiable vs. Contested) and provided the motivating case or logical consideration.

  ### Part I: Functional Requirements (The Desiderata)

  **R1. Supply Independence (The Bengal Constraint)**
  *   **Specification:** The theory must explain how mass starvation occurs without a significant decline in aggregate food availability per capita.
  *   **Motivating Case:** The Bengal Famine of 1943. Food production was not significantly lower than previous non-famine years, yet millions starved.
  *   **Status:** **Non-Negotiable.** Any theory that requires a food shortage to define a famine fails immediately on this data point.

  **R2. Shock Accommodation (The Ireland/GLF Constraint)**
  *   **Specification:** The theory must account for cases where a genuine, catastrophic reduction in food supply *did* occur, without dismissing the biological reality of the shock.
  *   **Motivating Case:** The Irish Famine (potato blight destroyed the staple crop) and the Great Leap Forward (policy disrupted production *and* procurement).
  *   **Status:** **Non-Negotiable.** A theory that explains Bengal by ignoring supply must not break when supply actually collapses. It must distinguish between "no food" and "no access to food."

  **R3. Trigger/Cause Separation**
  *   **Specification:** The theory must distinguish between the *proximate trigger* (e.g., drought, blight, flood) and the *structural cause* (e.g., distribution mechanisms, state response, economic policy).
  *   **Motivating Case:** All three cases. In Ireland, the blight was the trigger; the export of grain during starvation was a cause. In the GLF, weather was a trigger; procurement quotas were the cause.
  *   **Status:** **Non-Negotiable.** Without this distinction, the theory conflates weather with politics.

  **R4. Mortality Vector Integration**
  *   **Specification:** The theory must explain the mechanism of death, specifically accounting for the fact that the majority of fatalities usually result from epidemic disease (cholera, malaria, dysentery) rather than pure caloric deficiency, while maintaining that these are famine deaths.
  *   **Motivating Case:** Epidemiological records from all three cases show disease killed more people than starvation, but only because malnutrition compromised immune systems.
  *   **Status:** **Non-Negotiable.** If the theory defines famine death strictly as "starvation," it will undercount mortality by 50–80%.

  **R5. Market/State Anomaly Explanation**
  *   **Specification:** The theory must explain why food flows *out* of starving regions or is held in storage while people die, rather than flowing *in* to equalize prices and supply.
  *   **Motivating Case:** Ireland (grain exported to England under armed guard); Bengal (speculative hoarding and inter-district trade barriers).
  *   **Status:** **Non-Negotiable.** Standard economic theory (price signals driving supply) fails here. The theory must model why the market did not clear.

  **R6. The Political Immunity Claim**
  *   **Specification:** The theory must address the correlation between political systems and famine occurrence, specifically the claim that substantial famines do not occur in functioning democracies with a free press.
  *   **Motivating Case:** Post-independence India (no famines) vs. Colonial India/China/USSR (famines).
  *   **Status:** **Contested.** While strongly supported by empirical data (Amartya Sen's thesis), there are edge cases (e.g., marginalized groups within democracies). A robust theory should treat this as a strong probabilistic constraint, not an absolute law.

  **R7. Adjudicatory Capacity (The Verdict Requirement)**
  *   **Specification:** The theory must provide a framework for assigning responsibility. It must offer criteria to distinguish between a "natural disaster" (unavoidable tragedy) and a "political crime" (negligence or intent).
  *   **Motivating Case:** Your primary concern. Was the Irish Famine an act of God or British policy? Was the GLF a mistake or a massacre?
  *   **Status:** **Non-Negotiable (User Defined).** Most social science theories aim for explanation, not adjudication. You are requiring a normative output from a descriptive model.

  ---

  ### Part II: System Tensions and Incompatibilities

  You asked to flag requirements that pull in opposite directions. A single theoretical model struggles to satisfy the following pairs simultaneously without introducing bias.

  **Tension 1: Causal Neutrality vs. Adjudicatory Capacity (R3 vs. R7)**
  *   **The Conflict:** A causal explanation aims to describe *how* a system failed. A verdict of "political crime" requires establishing *intent* or *culpable negligence*.
  *   **The Problem:** If you build the theory to output a verdict (R7), you risk biasing the causal analysis (R3). For example, if the theory defines "famine" as "state failure," then by definition, every famine is a crime, rendering the verdict tautological. Conversely, if the theory is purely mechanistic, it may explain the death toll without providing the moral leverage needed to assign blame.
  *   **Verdict:** You cannot have a purely objective causal model that also functions as a court of law. The theory must explicitly separate the *mechanism of death* from the *ethics of response*.

  **Tension 2: The Ireland/Bengal Axis (R1 vs. R2)**
  *   **The Conflict:** The Bengal case demands a theory focused on *distribution and entitlement* (food existed, people couldn't reach it). The Irish case demands a theory that acknowledges *biological catastrophe* (the food literally ceased to exist).
  *   **The Problem:** Theories optimized for Bengal (Entitlement Theory) can appear to minimize the severity of the potato blight in Ireland. Theories optimized for Ireland (Malthusian/FAD) fail Bengal completely.
  *   **Verdict:** A unified theory must be multi-layered. It cannot treat "food supply" and "food access" as the same variable. It must treat supply shock as a *risk factor* that is mediated by political economy.

  **Tension 3: The Democracy Exception (R6)**
  *   **The Conflict:** The claim that "democracies don't have famines" is powerful, but if your theory relies on it as a hard constraint, it breaks if a famine occurs in a democracy (e.g., Malawi in 2002, or India during the Emergency).
  *   **The Problem:** If you treat R6 as a law, you must argue that any famine in a democracy wasn't a "real" famine or the democracy wasn't "functioning." This risks circular reasoning.
  *   **Verdict:** R6 should be treated as a heuristic for prevention, not a diagnostic tool for causation.

  ---

  ### Part III: Evaluation of Contenders

  You asked which requirement does the most work in ruling out popular accounts, and which theory survives best.

  **The Killer Requirement: R1 (Supply Independence)**
  This is the single most destructive constraint for traditional theories.
  *   **Why:** For two centuries, the dominant view was **Food Availability Decline (FAD)**. This view posits that famine is caused by a drop in food supply relative to population (the Malthusian view).
  *   **Result:** R1 eliminates the FAD/Malthusian view immediately. Because Bengal had no significant aggregate shortfall, FAD cannot explain it. If a theory cannot explain Bengal, it is insufficient for the modern study of famine.

  **Ranking the Survivors**

  1.  **The Entitlement Approach (Best Fit for Explanation)**
      *   **Core Logic:** Famines are caused by a collapse in people's *entitlements* (ability to command food through production, trade, or labor), not necessarily a collapse in food supply.
      *   **Performance:**
          *   Passes R1 (Bengal) perfectly.
          *   Passes R2 (Ireland) adequately (blight destroyed the entitlement of the poor to their staple).
          *   Passes R4 (Disease) well (links malnutrition to immunity).
          *   Passes R6 (Democracy) perfectly (this is the origin of the thesis).
          *   **Weakness:** Struggles with R7 (Verdict). It explains *failure of exchange* brilliantly, but it is often agnostic on *intent*. It describes a system failure more than a crime. It can make famine look like an unfortunate economic glitch rather than a political act.

  2.  **The Political Economy / Policy Failure View (Best Fit for Verdict)**
      *   **Core Logic:** Famines are almost always the result of specific policy choices, ideological rigidity, or colonial extraction. Food moves according to power, not need.
      *   **Performance:**
          *   Passes R1 and R2 by subsuming them under political choices (e.g., allowing exports during blight).
          *   Passes R5 (Market Anomaly) best (explains hoarding/exports via power dynamics).
          *   Passes R7 (Verdict) best. It is explicitly designed to assign responsibility.
          *   **Weakness:** Risks over-determination. By treating every famine as a "crime," it may underestimate genuine ecological shocks that would have caused mass death even under benevolent management (though this is rare).

  **Final Verdict**
  If your goal is **causal explanation**, the **Entitlement Approach** is the robust engineering spec; it handles the edge cases (Bengal) without breaking on the standard cases (Ireland).

  However, since you specified **R7 (Adjudicatory Capacity)** as your highest priority, the Entitlement Approach is insufficient on its own. It explains the *mechanism* of the crash, but not the *driver*. You must layer the **Political Economy** view on top of Entitlement.

  **Recommendation:** Adopt the Entitlement Approach as your *mechanical model* (how the starvation happens) and the Political Economy view as your *root cause analysis* (why the entitlements were allowed to collapse). The FAD/Malthusian view should be discarded as a primary theory, retained only as a description of the worst-case physical boundary.
