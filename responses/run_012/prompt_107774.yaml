answer: |-
  Here is the translation of the axiomatic bargaining dispute into your social choice vocabulary, followed by the residue report on what breaks in the translation.

  ### 1. The Translation

  **The Domain and Object**
  In your framework, a Social Welfare Function (SWF) aggregates a profile of preferences into a social ordering. In bargaining, the object is a **Bargaining Solution**, which is a choice function $F(S, d)$.
  *   **Alternatives:** Points in $\mathbb{R}^n$ (utility vectors).
  *   **Feasible Set ($S$):** The utility possibility set (convex, compact).
  *   **Disagreement Point ($d$):** A status quo parameter (threat point).
  *   **Choice Rule:** Selects a unique vector $u^* \in S$.

  **Informational Basis (Sen's Notation)**
  Both Nash and Kalai-Smorodinsky (KS) operate on the same informational basis, which is richer than Arrow's but restricted compared to Utilitarianism.
  *   **Measurability:** **Cardinal.** The solutions rely on von Neumann-Morgenstern (vNM) utilities. Ratios of utility differences are meaningful.
  *   **Comparability:** **Non-Comparability (CNC).** The solutions are invariant to independent positive affine transformations of each agent's utility ($u_i' = a_i u_i + b_i, a_i > 0$).
  *   **The Anchor:** The disagreement point $d$ fixes the "zero" for each agent. We are comparing *gains* ($u_i - d_i$), not absolute levels.
  *   **Verdict:** The informational basis is **Cardinal Non-Comparability with a Fixed Origin.** There is no interpersonal comparison of utility levels or units, only intrapersonal comparison of gains relative to $d$.

  **The Axioms (Translated)**
  *   **Pareto Efficiency:** Both satisfy this. (Strong Pareto).
  *   **Anonymity:** Both satisfy **Symmetry**. If the problem is symmetric (agents interchangeable in $S$ and $d$), they get equal gains.
  *   **Scale Invariance:** Both are invariant to the affine transformations mentioned above. This is the bargaining equivalent of requiring the rule to work on the *informational basis* defined, not the specific numerical representation.

  **The Dispute: The Divergent Axiom**
  Here is where the characterization theorems split. They agree on Info, Pareto, and Symmetry. They disagree on how the choice responds to changes in the feasible set $S$.

  *   **Nash's Axiom: Independence of Irrelevant Alternatives (IIA).**
      *   *Statement:* If $S' \subset S$ and $F(S, d) \in S'$, then $F(S', d) = F(S, d)$.
      *   *SC Interpretation:* **Contraction Consistency.** If you remove feasible options that were not chosen, the choice should not change. The solution depends only on the *local* geometry of the Pareto frontier at the solution point (the marginal rate of substitution between agents' utilities).
  *   **Kalai-Smorodinsky's Axiom: Individual Monotonicity.**
      *   *Statement:* If $S' \subset S$ and the utopia point for agent $i$ remains the same (or improves), agent $i$'s payoff should not decrease.
      *   *SC Interpretation:* **Opportunity Sensitivity.** The solution depends on the *global* shape of the frontier (specifically the maximum feasible gain for each agent). If the "pie" gets bigger for you, you shouldn't lose out, even if the local trade-off rate at the solution hasn't changed.

  ### 2. The Residue Report

  Your hunches are largely correct, but the distortions run deeper than just the reference points. Here is what does not survive the translation faithfully.

  **A. The Status Quo Violation (Neutrality)**
  You noted that $d$ needn't be feasible and isn't an alternative to be ranked. This is a violation of **Neutrality**.
  In standard Arrow/Sen frameworks, the SWF treats all social states equally; no state gets a "veto" or special weighting simply because it *is* the current state. In bargaining, $d$ is morally privileged. It anchors the gains.
  *   *Distortion:* You cannot model $d$ as just another alternative in $X$. It is a parameter of the choice function. This makes bargaining solutions inherently **path-dependent** or **history-dependent**, which standard welfarist SC theory explicitly tries to purge.

  **B. The IIA Homonym**
  You suspected Nash's IIA is a homonym of Arrow's. You are right, but they are structural cousins.
  *   *Arrow's IIA:* The social ranking of $\{x, y\}$ depends *only* on individual rankings of $\{x, y\}$. It ignores preferences over $z$.
  *   *Nash's IIA:* The choice from $S$ depends *only* on the local shape of $S$ at the solution. It ignores the "rest" of the feasible set (the utopia point).
  *   *The Residue:* Both are **Locality Conditions**. They demand that the rule ignore "global" information (preferences over irrelevant alternatives / feasibility of distant utility vectors). The normative force is similar: "Why should the removal of an option nobody wanted change the deal?" But mathematically, Arrow's operates on preference profiles, Nash's on feasible sets.

  **C. The Welfarism Violation (The Big One)**
  This is the most significant distortion. Standard Social Choice (d'Aspremont & Gevers style) assumes **Welfarism**: the social ordering depends *only* on the utility vector $u$, not on how it was achieved or what else was feasible.
  *   **Nash:** Satisfies a weak form of welfarism (conditional on $d$ and local tangents).
  *   **Kalai-Smorodinsky:** **Violates Welfarism.** KS looks at the *utopia point*. Two problems could yield the exact same utility vector at the solution and the same local trade-offs, but if the *upper bounds* of the feasible sets differ, KS picks different points.
  *   *Translation:* KS says the *opportunity set* carries moral weight independent of the realized utility. Standard SC says only the utility matters. To accommodate KS, your framework must allow the Social Welfare Function to depend on the **Feasible Set**, not just the Utility Profile.

  **D. The Cardinality Requirement**
  You teach ordinal vs. cardinal. In Arrow, we strive for ordinality. In Bargaining, **Cardinality is non-negotiable.**
  *   *Distortion:* You cannot run Nash or KS on ordinal preferences. The "product of gains" is meaningless if utilities are ordinal. The "line to the utopia point" is meaningless if units aren't comparable via affine transformations.
  *   *Limit:* This is a limit of *your* framework if you prioritize Arrow's ordinalism. Bargaining theory assumes vNM rationality (risk preferences) which *generates* the cardinality. If your students ask, "Why cardinal?" the answer is "Because we are modeling bargaining under risk/uncertainty," not "Because we assume interpersonal comparability."

  ### 3. The Normative Core: Is it a Welfare Question?

  > *Is the thing they actually disagree about... even statable as a question about welfare functions?*

  **Yes, but it requires expanding the domain of the Welfare Function.**

  If you restrict yourself to standard Welfarism (Social Ordering depends only on $u$), the dispute disappears because KS is inadmissible. If you allow the SWF to depend on the pair $(u, S)$, the dispute becomes statable and profound.

  The normative disagreement is **Outcome vs. Opportunity**.

  *   **Nash (The Localist):** Justice is about the **marginal trade-off**. At the agreement point, the relative urgency of the players' claims (marginal utility of the resource) should be balanced. What *could* have been possible (the utopia point) is irrelevant if it wasn't achievable given the constraints. This aligns with **Utilitarian/Contractarian** local efficiency.
  *   **Kalai-Smorodinsky (The Globalist):** Justice is about **proportional claims**. I am entitled to a share of the maximum possible gain I could have gotten. If your maximum potential gain increases, your claim on the surplus increases, even if our local trade-off hasn't changed. This aligns with **Egalitarian** intuitions regarding opportunity.

  ### 4. Blunt Assessment of Your Framework's Limits

  You asked me not to be diplomatic. Here is where your Social Choice framework distorts the Bargaining literature to make it fit:

  1.  **You treat $d$ as a parameter, SC treats it as a violation of Neutrality.** In your classes, you likely present SWFs as impartial machines. Bargaining solutions are explicitly partial to the status quo. To teach this faithfully, you must admit that standard SC axioms (Neutrality) are designed to *exclude* bargaining logic, not include it.
  2.  **You treat IIA as a consistency condition; Bargaining treats it as an information constraint.** In Arrow, IIA prevents strategic manipulation of the agenda. In Nash, IIA prevents the "irrelevant" feasibility of utopian outcomes from dictating the compromise. They are motivated by different fears (manipulation vs. irrelevant claims).
  3.  **You assume Ordinalism is the baseline; Bargaining assumes Cardinality is the baseline.** You spend weeks teaching how to do SC *without* cardinal utility. Bargaining theory starts by saying "Without cardinal utility, there is no problem." If you try to map Bargaining onto Arrow, you are mapping a theory of *risk and threats* onto a theory of *voting and aggregation*. They overlap, but the foundations are different.

  **Summary:** The dispute survives translation only if you abandon **Welfarism** (allowing the feasible set to matter) and accept **Cardinality**. The residue is the moral status of the **Status Quo ($d$)** and the **Utopia Point**. Nash says they are anchors and bounds; Arrowian SC says they are irrelevant alternatives. KS sides with the bounds; Nash sides with the anchors. Your framework usually bans both.
