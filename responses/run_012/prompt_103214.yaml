answer: |-
  1. Begin by establishing the shared empirical ground of Reserve Police Battalion 101 to show both authors accept the same actions occurred, then pivot to why those actions happened before introducing the authors' names. This sequence ensures the distinction between psychological motive and situational enablement emerges from the evidence rather than serving as a premature label.

  2. Build the session around the Józefów massacre because it contains the commander's offer to opt out but lacks explicit orders compelling every individual to fire. This specific example is the right carrying case because it isolates the moment of choice without confounding variables of immediate physical coercion.

  3. Intervene immediately after defining Browning's thesis to clarify that explaining behavior through pressure is not the same as excusing moral responsibility or letting the men off. You must address the scope of Goldhagen's antisemitism before discussing the opt-out rate to prevent students from assuming cultural determinism implies every German was a killer.

  4. Ask students to explain how both historians can agree that most men shot victims while disagreeing on whether those men were willing killers. This forces them to articulate the difference between performing an action and possessing the specific internal drive to perform it.

  5. Explicitly exclude the broader historiographical context of the Functionalism–Intentionalism debate and the specific archival criticisms regarding Goldhagen's use of sources. Tell them you are omitting these complexities to focus strictly on the logical structure of the two arguments regarding human behavior.
