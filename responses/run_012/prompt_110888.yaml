  3.  **Representation (Single/Set/2nd-order):** 0.90 probability that sets of probabilities are required.
      *   *Justification:* Assigning a sharp credence to an adversary's move invites exploitation; interval valuations are the standard defense.
  4.  **Decisiveness of Objections:** 0.10 probability that Sure-Thing/Dynamic objections are decisive.
      *   *Justification:* The Sure-Thing Principle fails when the "state of the world" is causally or strategically dependent on the act.
  5.  **Locus of Rationality:** 0.90 probability that rationality constrains prudence/strategy over belief accuracy.
      *   *Justification:* In adversarial contexts, avoiding the worst-case outcome trumps accurate probabilistic calibration of the opponent's mind.

