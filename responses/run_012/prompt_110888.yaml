  These probabilities combine via a "weakest link" logic weighted by relevance. Since (i) and (ii) are near-certain in game theory, the final credence is high. The 0.10 discount accounts for decision-theoretic purists who insist on reducing all games to EU via equilibrium concepts that might forbid the specific Ellsberg ordering in a one-shot non-equilibrium setup.

