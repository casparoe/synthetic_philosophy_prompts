      *   *Justification:* Dutch Book arguments apply cleanly here since the states are fixed and independent of the act.
  5.  **Locus of Rationality:** 0.60 probability that rationality constrains preference coherence over belief accuracy.
      *   *Justification:* If the fact is fixed, incoherent preferences look like money-pump vulnerabilities rather than robust heuristics.

