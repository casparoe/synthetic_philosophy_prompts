  1.  **The "Probability Nerd" Tell:** A "probability nerd" who claims these are "just the right answers" is likely adhering to the axioms of Bayesian updating. The normative rule for updating probabilities given new constraints (when you already have a prior) is MinInfo (often associated with the Shore & Johnson axioms). MaxEnt is typically reserved for *creating* a prior when you have *none*. Since she gave you a prior, MinInfo is the technically "correct" Bayesian move.
