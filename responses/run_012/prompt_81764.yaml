          *   Tension 2: Claim 4 (Endogenous) vs Claim 5 (Normative). If aspirations are automatic residues, you can't normatively critique them. Severity: High.
          *   Which is worse? If it's not efficient, it's not a good heuristic. If it's not normative, it's not a guide. The user wants a normative programme. So 4 vs 5 might be more critical to the *project*, but 4 vs 1 is critical to the *concept*. Let's argue 4 vs 1 is the foundational threat because if satisficing costs more than optimizing, the normative advice (Claim 5/6) to use it elsewhere becomes suspect. Actually, the prompt asks to rank tensions. I will weave this into the prose.
