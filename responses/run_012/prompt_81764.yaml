          7.  Closing.

      *   *Refining the Tensions:*
          *   *Dissolvable:* 1 vs 3 (Mechanism vs. Description). 2 vs 6 (Ecological fit specifies when to optimize).
          *   *Genuine:* 4 vs 5 (Endogenous mechanism vs. Normative control). 4 vs 1 (Endogenous drift vs. Economic efficiency).
          *   *Severity:* 4 vs 1 is severe because it undermines the core definition/utility of satisficing. 4 vs 5 is severe because it undermines the normative ambition. 4 vs 1 is probably worse because if satisficing isn't efficient, why use it? But 4 vs 5 kills the "programme" aspect. Let's rank 4 vs 5 (Normative collapse) as slightly higher or equal to 4 vs 1 (Efficiency loss). Actually, if the treadmill is real, 4 vs 1 is the physical manifestation of the problem. Let's look at the revision.
          *   *Revision:* Modify Claim 4. Make aspiration levels subject to rational calibration (normative) rather than purely historical residues (descriptive automatism). Or, distinguish between the *descriptive* update rule and the *normative* update rule.
          *   *Best Revision:* Qualify Claim 4 to allow for meta-control over aspiration adjustments. This saves Normativity (5) and prevents Treadmill (1). Cost: Makes the theory more demanding computationally (might clash with boundedness).
          *   *Treadmill Verdict:* It is a real risk entailed by a strong reading of Claim 4, not a mistake in logic, but a mistake in the stability of the theory.

      *   *Writing Plan:*
          *   Start by validating the coherence of the package overall.
          *   Discuss the 1 vs 3 tension (mechanism vs as-if) -> dissolves.
          *   Discuss 2 vs 6 (ecological vs one-shot optimize) -> dissolves (ecological rationality admits optimization in low-cost environments).
          *   Discuss 4 vs 5 (endogenous vs normative). This is hard. If aspirations are residues, how prescribe? Rank this high.
          *   Discuss 4 vs 1 (endogenous vs economy/treadmill). If aspirations rise too fast, no economy. Rank this highest because it destroys the functional definition.
          *   Address the Treadmill: It is entailed by Claim 4 as stated.
          *   Recommendation: Modify Claim 4. Aspirations should be endogenous but *regulated* by ecological fit (Claim 2).
          *   Cost: Normativity remains but requires agents to manage their aspirations, which adds cognitive load.

      *   *Checking Constraints:* No bold, no bullets, no headings. Continuous prose. Rank within sentences.

