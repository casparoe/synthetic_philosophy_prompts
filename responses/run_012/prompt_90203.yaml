      *   **Core Topic:** The conceptual issues surrounding the question "Why Britain and not China?" (often associated with the Great Divergence/Needham Question).
      *   **Key Concept 1: The Contrast-Class Problem:** Explain how the choice of comparison (Britain vs. China, Europe vs. Asia, etc.) changes the *explanandum* (what needs explaining) and the causal story.
      *   **Key Concept 2: The Circularity Risk:** Explain the danger of selecting differences based on the known outcome (post hoc ergo propter hoc), given indefinite differences between cases.
      *   **Key Concept 3: Well-Posed Question:** Specify what is needed to make the question valid/non-trivial.
      *   **Key Concept 4: Needham vs. Great Divergence:** Analyze whether these are the same question or different questions.

  2.  **Drafting Section 1: The Contrast-Class Problem:**
      *   *Concept:* A "why X rather than Y" question implies that X and Y were comparable alternatives that could have gone either way.
      *   *Issue:* If I choose Britain vs. China, I'm implying they were on similar trajectories until a specific break. If I choose Europe vs. Asia, I'm looking at broader structural factors. If I choose Britain vs. France, I'm looking at very specific institutional nuances.
      *   *Impact:* Changing the contrast class changes the *explanandum*.
          *   Britain vs. China $\rightarrow$ Why *industrialization* started *there* and not *there*.
          *   Europe vs. Asia $\rightarrow$ Why *modern science/capitalism* emerged in *this continent* and not *that continent*.
      *   *Causal Story:* Britain vs. China might lead to explanations about coal location or specific property rights. Europe vs. Asia might lead to explanations about fragmentation vs. empire or culture.
      *   *Refinement:* Emphasize that the question isn't just hard to answer (empirical); it's conceptually unstable because the "not China" part is arbitrary without justification. Why not India? Why not Japan?

  3.  **Drafting Section 2: The Circularity Risk (Selection Bias):**
      *   *Concept:* Any two complex historical entities differ in infinite ways.
      *   *Mechanism:* The historian knows the outcome (Britain industrialized, China didn't).
      *   *The Trap:* The historian looks for differences. They find Difference Z (e.g., patent laws). They say "Difference Z caused the Outcome."
      *   *Why it's circular:* How did they know to look at patent laws? Because they knew Britain had them and industrialized. They are selecting the independent variable based on the dependent variable.
      *   *Philosophical term:* Post hoc rationalization / Overfitting.
      *   *Consequence:* The explanation becomes a tautology: "Britain industrialized because it had the features of an industrializing nation."

  4.  **Drafting Section 3: Making the Question Well-Posed:**
      *   *Requirement:* We need to establish *comparability* prior to the divergence.
      *   *Specifics:*
          1.  **Similarity at T1:** Establish that Britain and China were genuinely similar in relevant aspects (economic development, technology, institutions) at a specific starting point (e.g., 1750 or 1500).
          2.  **Possibility at T1:** Establish that China *could* have industrialized (counterfactual plausibility).
          3.  **Specific Mechanism:** Define the specific outcome (industrialization? scientific method? GDP per capita?).
          4.  **Exogenous Shock:** Identify a causal factor that wasn't just a symptom of the outcome.
      *   *Goal:* Move from "Why did the winner win?" to "What tipped the scale in a close race?"

  5.  **Drafting Section 4: Needham Question vs. Great Divergence:**
      *   *Needham Question:* "Why did China *not* develop modern science/capitalism despite *earlier advantages*?"
          *   Focus: Stagnation/Failure.
          *   Premise: China was ahead.
          *   Timeframe: Long durée (Song Dynasty to 19th century).
      *   *Great Divergence (Pomeranz et al.):* "Why did Europe/Britain *pull ahead* of China/Asia?"
          *   Focus: Divergence/Take-off.
          *   Premise: They were roughly equal (parity) until late (1750s).
          *   Timeframe: Late 18th/Early 19th century.
      *   *Comparison:* They are *different* questions.
          *   Needham asks why China stopped running.
          *   Great Divergence asks why Britain started sprinting (when China was still jogging).
          *   Needham implies Chinese deficiency (internal). Great Divergence often implies British luck/contingency (external/coal/colonies).
      *   *Nuance:* They are often conflated, but analytically distinct.

  6.  **Review and Refine:**
