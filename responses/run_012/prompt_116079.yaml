  ok so we did Wittgenstein's private language argument in class last week and i think i followed maybe 60% of it — the rule-following stuff, the beetle in the box, the point that if whatever seems right to you just is right then nothing is actually being checked. but i've basically grown up inside multiplayer games and i want to see the whole thing in that vocabulary instead, since its the one i actually think in. so: restate the argument as faithfully as you can in terms of client-side vs server-side state, local saves vs the save on the server, desync, private lobbies where you make up your own house rules vs the real ruleset everyone else is running, replay verification, anti-cheat, all of that. im decently fluent — i know what desync is, i've watched enough videos about netcode and speedrun verification to follow along — so dont dumb it down.

  the part i actually care about is the residue. which moves translate cleanly (your client thinks you have 50 gold, the server disagrees, so your client is just wrong)? which ones did you have to fudge to get them across? and whats left over with no counterpart at all in how games work? and then the real question: is the translation cheating by assuming there's a server in the first place? in a game the server exists because a developer built it, so it kind of feels like im smuggling in the thing thats supposed to be the conclusion. so is that residue a defect of the game vocabulary, or does it show the argument needs some shared public thing just to get off the ground? basically i want to know if my instinct that private language is basically single player mode is right, or if its missing something.
