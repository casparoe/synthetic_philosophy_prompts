  I'm writing an essay on German vs American folk morality for a comparative ethics seminar and I want to use Bernhard Schlink's The Reader as the test case. Read it through that lens: Hanna as the rule-follower — the guard who lets the prisoners burn in the church rather than unlock the door, and who guards her illiteracy more fiercely than her guilt — set against Michael's faith in individual conscience and his own retrospective guilt, and the whole Vergangenheitsbewältigung business of what the second generation owes. But please don't just map the two characters onto the two national stereotypes; I want the akward bits. In particular take seriously the idea that Hanna's rule-following might be humility rather than cowardice — that she defers to the rules partly because she doesn't trust her own judgement, and that there's a real case for this being a virtue American conscience-talk can't accommodate. Then flip it round: the novel is narrated by a lawyer in a flat, procedural voice that withholds and never delivers a verdict, so is the book's form itself German in this sense, and does that mean it quietly sides with Hanna against its own narrator? Say where the reading breaks down — what Michael sees that Hanna can't, and what she sees that he can't — and end by saying what the novel adds to the debate that the philosophical arguments alone don't.

