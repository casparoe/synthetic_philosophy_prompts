answer: |-
  # The Conceivability Check (3-Minute Rebuttal Procedure)

  **To:** Debate Team  
  **From:** Captain  
  **Subject:** Answering "I Can Imagine It, So It's Possible"  
  **Time Limit:** 3 Minutes Max  

  **The Problem:** Opponents are saying, "I can imagine X, therefore X is possible, therefore my conclusion is true."  
  **The Goal:** Prove that *imagining* something isn't the same as it being *possible*, or prove they cheated in the description.  

  **Instructions:** Read the three steps in order. If you get a "STOP" verdict, read the corresponding script to the judge. If you reach Step 3 and pass, you must concede the point is possible and argue against its relevance instead.

  ---

  ### Step 1: The Contradiction Test (30 Seconds)
  **Ask:** "Is the scenario logically impossible, like a 'square circle' or a 'married bachelor'?"  
  **The Trap:** Just because *you* can't picture it doesn't mean it's a contradiction.  
  **Sufficient Answer:** You must find a specific rule of logic or math they broke.  
  *   *If YES (It is a contradiction):* **STOP.**  
      *   **Say:** "Judge, imagination is not proof. They described a logical contradiction. Just because they can say the words 'square circle' doesn't make it possible. This argument fails immediately."  
  *   *If NO (It's weird, but not math/logic breaking):* **Continue to Step 2.**

  ### Step 2: The Smuggled Conclusion Test (1 Minute)
  **Ask:** "Did they sneak their conclusion into the description of the scenario?"  
  **The Trap:** They describe a thing using a label, but the label implies the thing *isn't* what science says it is.  
  **Sufficient Answer:** Show that to imagine the scenario, you have to already agree with their conclusion.  
  *   *If YES (They smuggled it):* **STOP.**  
      *   **Say:** "Judge, they are begging the question. They asked us to imagine 'Water that isn't H2O.' But science tells us Water *is* H2O. They aren't imagining water; they are imagining a different liquid and labeling it 'water' to force their conclusion. Disregard this scenario."  
  *   *If NO (The description seems fair):* **Continue to Step 3.**

  ### Step 3: The Identity Test (1 Minute)
  **Ask:** "Does this scenario assume two things are separate when we have discovered they are actually the same thing?"  
  **The Trap:** We used to think "Lightning" and "Electricity" were different. Now we know they are the same. You can't imagine one without the other anymore.  
  **Sufficient Answer:** Point to a scientific or factual identity that makes the scenario impossible in the *actual* world, even if it looks possible in the *imagined* world.  
  *   *If YES (They ignore an identity):* **STOP.**  
      *   **Say:** "Judge, this relies on outdated information. They imagine a 'Mind without a Brain,' but evidence suggests the Mind *is* the activity of the Brain. Imagining them separate is like imagining 'Heat without molecular motion.' It's not a possibility; it's a mistake."  
  *   *If NO (No identity is violated):* **VERDICT: CONCEDE.**  
      *   **Say:** "Judge, we concede this scenario is *possible*. However, possibility does not prove *actuality*. Just because it *could* happen doesn't mean it *does* happen or that it proves their point about the real world."

  ### When to Call the Judge (Semantic Dispute)
  If Step 2 or 3 turns into a fight about the definition of a word (e.g., "What counts as the *same person*?") rather than physics or logic:  
  **Say:** "Judge, this is not a debate about possibility. This is a debate about how we define words. Their argument rests on a definition choice, not a factual discovery. You should vote on which definition is more useful, not on whether their imagination is valid."

  ---

  ### Worked Examples (How to use this in round)

  **Example 1: "Imagine water that is not H2O."**  
  *   **Step 1:** Is it a logical contradiction? No.  
  *   **Step 2:** Did they smuggle the conclusion? **YES.**  
  *   **Action:** **STOP.**  
  *   **Script:** "They asked you to imagine 'Water that isn't H2O.' But 'Water' is defined by its chemical structure. They are asking you to imagine 'H2O that isn't H2O.' That is a trick of language, not a metaphysical possibility."  
  *   **Result:** Argument fails.

  **Example 2: "Imagine a mind without a brain."**  
  *   **Step 1:** Is it a logical contradiction? No.  
  *   **Step 2:** Did they smuggle the conclusion? **YES.**  
  *   **Action:** **STOP.**  
  *   **Script:** "To imagine this, you have to assume the mind isn't the brain. But that is exactly what is being debated. They are assuming their conclusion (Dualism) is true to prove their conclusion is true."  
  *   **Result:** Argument fails.

  **Example 3: "Imagine a person surviving neuron replacement one by one."**  
  *   **Step 1:** Is it a logical contradiction? No.  
  *   **Step 2:** Did they smuggle the conclusion? No.  
  *   **Step 3:** Does it ignore an identity? No (We don't know for a fact that 'personhood' is identical to 'specific neurons').  
  *   **Action:** **VERDICT: CONCEDE.**  
  *   **Script:** "Judge, we concede this is *possible*. It is not contradictory. However, that doesn't prove their point. Even if you *could* survive, it doesn't mean you *will*, or that identity is what they say it is. Don't let a hypothetical science fiction story dictate real-world policy."  
  *   **Result:** Argument survives the "possibility" check, but you neutralize its weight.

  ---

  ### Captain's Note: The Limits of This Procedure
  *Be honest with your teammates about what this tool can and cannot do.*

  1.  **Judgment Disguised as Procedure:** Step 2 and Step 3 require you to know science. If you don't know if "Mind = Brain" is a settled fact, you might fail Step 3. This procedure forces you to make a judgment call on whether an identity is "settled."
  2.  **What It Cannot Decide:** This procedure cannot win a debate where the opponent admits, "Okay, it's not actual, but it shows my definition is consistent." If they retreat to "This is just about conceptual coherence," you must use the "Call to Judge" section and argue about definitions, not possibility.
  3.  **The Hard Truth:** If an opponent passes all three steps (like the Neuron example), **do not lie.** Do not say it's impossible. Concede the possibility and attack the *relevance*. Judges hate it when you deny obvious possibilities.

  **Good luck. Run the check. Stick to the script.**
