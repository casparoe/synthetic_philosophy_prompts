answer: |-
  This is a profound ethical and practical dilemma, one that sits at the intersection of love, duty, autonomy, and mortality. You are asking for a framework to navigate guilt without abandoning your parents.

  Here is an analysis of your situation, the philosophical claims presented to you, and a path forward.

  ### On the Three Philosophical Claims

  Your friend's claims are largely sound, though the first requires nuance.

  1.  **On Sacrifice:** Your friend's definition is semantically provocative but practically useful. Technically, a sacrifice *is* giving up something of value. However, the point your friend is making is about **hierarchy of values**. If you move back and feel you have lost your "self," you are treating your autonomy and career as *more* important than the move, making it a sacrifice. If you moved and felt fulfilled, your hierarchy would be different. The pain you feel at the suggestion of moving confirms that your current life holds immense value to you. Acknowledging this is not selfishness; it is honesty. To deny it is to lie about what you value.
  2.  **On Debt vs. Gift:** This is the strongest claim. When care is demanded as a debt ("a good daughter does not weigh the cost"), it strips the caregiver of moral agency. You become a tool rather than a person. Care given under coercion often breeds resentment, which poisons the relationship you are trying to save. Care given as a gift, within your capacity, retains its dignity.
  3.  **On the Infinite Demand:** This is logically irrefutable. Parkinson's is progressive. There is no natural "end point" where your parents will be fine on their own. A rule that says "be there when needed" without defining limits ensures your eventual destruction. Ethical duties must have boundaries to be sustainable.

  ### On "Owe" vs. "Give"

  You asked if the debt-versus-gift distinction is real work or a tidy excuse. It is **real work**.

  We do owe our parents something. We owe them gratitude, respect, and a reasonable assurance that they will not be abandoned to destitution or danger. This is the "debt." It is finite. It can be met through financial support, coordinating care, regular visits, and ensuring their safety.

  What we do *not* owe them is our own self-erasure. When the demand shifts from "ensure I am cared for" to "you must be the one to care for me at the expense of your own life," the request has moved from obligation to consumption. That is where the "gift" begins. You can choose to give more than the baseline obligation, but that choice must remain yours. If it is coerced, it is no longer a gift; it is conscription.

  The distinction protects the relationship. If you move back resentfully, you may become a bitter caregiver, which helps no one. If you stay where you are but provide robust support, you remain a loving daughter with the resources to help.

  ### What Should You Do?

  Based on your statement that you are "not prepared to give up" your life, and the reality of your brother's proximity, here is a recommended course of action:

  1.  **Do Not Move (Yet):** Moving 1,500 miles is a irreversible disruption. If you are not willing, you will resent it. Furthermore, your mother's burnout requires professional intervention, not just a change of personnel.
  2.  **Monetize the Gap:** You have a career; your brother has proximity. The fairest distribution of labor is often financial vs. physical. Use your resources to hire professional in-home care to relieve your mother. This is not "dumping" them; it is using your specific capacity to solve the problem.
  3.  **Reframe the Brother's Role:** He has small children, but he is ten minutes away. He cannot be the primary caregiver, but he can be the "eyes on the ground." He can handle emergencies, doctor visits, and logistics. The assumption that you should move because he is busy is a gendered expectation (the daughter sacrifices, the son provides). Challenge this gently but firmly.
  4.  **Set a Schedule, Not an Open Door:** Tell your mother and aunt: "I cannot move, but I will visit every X weeks, and I will pay for Y hours of help." This turns an infinite demand into a finite contract.
  5.  **Address the Aunt:** When she speaks of duty, reply: "I am ensuring they are cared for in the way that allows me to remain stable enough to support them long-term. If I collapse, they have nothing."

  ### Confidence and Uncertainty

  **Confidence Level:** I am **85% confident** in this advice. The ethical framework regarding boundaries and the unsustainability of self-erasure is robust, and the practical solution (professional care + financial support) is the standard recommendation for long-distance adult children in your position.

  **Point of Least Certainty:** I am least sure about **your brother's actual capacity and willingness.** I am operating on the information that his job has "no slack," but sometimes family crises reveal slack that wasn't visible before. If he is truly maxed out, and your parents' financial resources are insufficient to hire adequate help, the "professional care" solution hits a wall. In that specific worst-case scenario, the binary choice between "you move" and "they suffer" becomes sharper than I have accounted for here. However, even in that case, moving should be the last resort, not the first assumption.
