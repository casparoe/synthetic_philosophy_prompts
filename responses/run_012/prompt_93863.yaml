      *   *No Counterpart:* The *qualia* of obligation. The feeling of "ought." Software errors are neutral; moral errors are normative.
      *   *Broken Promise vs. Failed Dependency:* In software, a failed dependency is usually an exception or a timeout. It's often blameless (network issue). A broken promise implies intent or negligence. Software vocab struggles with *intent*.
      *   *Commitment Device:* This is Ulysses Pact territory. In software, this is like `immutable` or `final` keywords, or smart contracts. It's distinct from the *source* of obligation, it's a *mechanism* to ensure it. So it's a fifth position or a meta-layer.
      *   *Indictment:* If residue is large, it's not that software vocab is bad, but that it optimizes for *coordination* and *predictability*, whereas morality optimizes for *agency* and *value*.

  5.  **Refining the Tone:**
      *   Needs to be respectful of the user's expertise.
      *   Needs to be precise (no hand-waving).
      *   Needs to avoid the trap of saying "Software is just like ethics" or "Ethics is just like software."
      *   Acknowledge the "Rationalist" background (Ulysses pacts, Schelling points).

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Translation 1 (Practice):* Protocol Standards. RFCs. If you violate TCP spec, you break the internet.
      *   *Translation 2 (Reliance):* Interface Contract. `@returns`. If you return null when doc says object, caller crashes.
      *   *Translation 3 (Prediction):* `likely()` annotation. Compiler hint. Not enforced.
      *   *Translation 4 (Authority):* Callback / Closure. Passing control flow.
      *   *Residue:* Software handles *state*, Ethics handles *will*.
