  Let's refine the "Broken Promise vs. Failed Dependency" point. In software, if a dependency fails, the system catches the exception. If *I* break a promise, *I* am the dependency failing. But the moral weight comes from the *expectation management*. A dependency failure is usually `503 Service Unavailable`. A broken promise is `400 Bad Request` sent by the server itself because it lied about its capabilities. Actually, better: A failed dependency is a network partition (external). A broken promise is returning `200 OK` with wrong data (internal lie).

  Okay, ready to write.s
answer: |-
  Here is the translation of the four philosophical positions into your interface/contract vocabulary, followed by the residue report and the specific analysis you requested.

  ### I. The Translations

  **1. The Social Practice View (Rawls/Rule Utilitarianism)**
  *Philosophical Core:* The obligation exists because there is a beneficial cooperative practice (promising), and it is unfair to free-ride on the stability others maintain by keeping their promises.
  *Software Translation:* **Protocol Compliance.**
  You are operating within a distributed ecosystem that relies on a shared specification (e.g., TCP/IP, an RFC, a language standard). The system functions efficiently only if nodes adhere to the spec. When you instantiate a "promise," you are declaring adherence to that protocol. Breaking it isn't just a local bug; it degrades the trust topology of the entire network. The obligation is the requirement to maintain the integrity of the shared standard so that the ecosystem remains viable for all consumers.

  **2. The Reliance View (Scanlon/Principle of Fidelity)**
  *Philosophical Core:* The wrong is not in breaking a rule, but in inviting someone to form an expectation and then disappointing it. You created a specific reliance that would not have existed otherwise.
  *Software Translation:* **Public Interface Contract.**
  You publish an API definition (`.d.ts`, OpenAPI spec) that defines inputs and guaranteed outputs. The consumer writes code against this interface. The obligation arises because the consumer's logic is now coupled to your implementation details based on your documentation. If you change the behavior without bumping the major version (semantic versioning violation), you cause a runtime error in the consumer's environment. The "wrong" is the crash or data corruption on the client side caused by the divergence between your documented interface and your actual implementation.

  **3. The Prediction View (Hume/Skeptic)**
  *Philosophical Core:* A promise is not a distinct moral entity; it is merely a strong statement of current intent. There is no "binding," only a high-probability forecast of future behavior.
  *Software Translation:* **Heuristic Annotation.**
  A promise is a `@likely` or `@probable` hint to the compiler or the user. It is a assertion about current state projected forward (`assert(current_intent == future_action)`). There is no hard contract, no enforcement layer, and no exception thrown if the projection fails. It is metadata describing the developer's confidence level at time $t_0$. If the action doesn't occur, it is not a "violation," it is simply a model drift where the prediction accuracy was lower than advertised.

  **4. The Authority Transfer View (Shiffrin/Right-View)**
  *Philosophical Core:* Making a promise gives the promisee a right to demand performance. You have handed them a piece of normative authority over your will.
  *Software Translation:* **Delegated Capability / Write Access.**
  By promising, you are passing a capability token or a closure that gives the promisee write-access to your state or control flow. You are effectively elevating their permissions. They now hold a handle that allows them to invoke a specific method on your object, and you have removed the internal permission check that would normally allow you to reject that call. The obligation is the architectural decision to grant them root-level access over a specific domain of your future behavior.

  ***

  ### II. The Residue Report

  **1. What Carries Over Cleanly**
  *   **Reliance and Coupling:** The Scanlonian view maps almost perfectly to the concept of *interface coupling*. The moral harm of disappointing reliance is structurally identical to the technical harm of breaking a public API contract without versioning. Both create downstream failures that the consumer could not have isolated.
  *   **Prediction and Probabilistic Systems:** The Humean view maps cleanly to probabilistic programming or machine learning models. If you treat a promise as a prediction, you treat moral failure as accuracy loss. This is a coherent, albeit cynical, system model.

  **2. What Carries Over With Distortion**
  *   **Social Practice vs. Protocol:** In software, protocols are often enforced by compilers or handshakes (you literally *cannot* connect if you violate TCP). In morality, the "protocol" is unenforced. The software vocabulary implies a validator exists (the runtime), whereas the philosophical view requires the *agent* to be their own validator. The vocabulary smuggles in an expectation of external enforcement that doesn't exist in the moral domain.
  *   **Authority vs. Permissions:** In software, if I give you write access, you *can* change my state. In morality, if I give you authority, you *should* be able to demand I change my state, but you lack the physical or causal power to enforce it. The software vocabulary conflates *permission* (you are allowed to) with *capability* (you are able to).

  **3. What Has No Counterpart (The Null Set)**
  *   **Normativity (The "Ought"):** Software contracts describe *what is* (the code runs or it panics). Moral contracts describe *what ought to be*. There is no software equivalent to "guilt" or "blame." A thrown exception is neutral; a broken promise is charged. The vocabulary has no variable for *normative force*.
  *   **Agency/Will:** In software, a module does not "choose" to fail; it fails due to input or state. In morality, a promise is binding specifically because the agent *could have done otherwise*. The software vocabulary assumes determinism or randomness, but it has no primitive for *volition*.

  ***

  ### III. Specific Analysis

  **1. Broken Promise vs. Failed Dependency**
  Can your vocabulary mark the difference? **Barely, and only by inspecting the stack trace.**

  *   **Failed Dependency:** In your vocabulary, this is a `503 Service Unavailable` or a `TimeoutException`. The contract was "I will try to process this," and the system resource was unavailable. The precondition (server up) was not met. It is an external fault.
  *   **Broken Promise:** This is a `200 OK` with incorrect data, or a function returning `false` when the postcondition guarantees `true`. It is an internal logic error.

  *The Gap:* The software vocabulary distinguishes these by *location* of the error (internal logic vs. external resource). It does not distinguish them by *intent*. A broken promise in ethics requires the capacity to have kept it. A dependency failure often implies the capacity was lacking. Your vocabulary can track *capability* (via preconditions), but it cannot track *willingness*. If you return `reject()` because you "didn't feel like it," the runtime sees the same exception as if the network cable was cut. The vocabulary collapses the distinction between *can't* and *won't*.

  **2. Is the Commitment-Device Gloss a Fifth Position?**
  It is a **fifth position**, but it is orthogonal to the other four.

  *   The four positions above (Practice, Reliance, Prediction, Authority) answer the question: *"What is the source of the obligation?"* (Why does this string of words bind me?)
  *   The Commitment-Device gloss answers the question: *"What is the mechanism of adherence?"* (How do I ensure I don't defect?)

  In software terms:
  *   The four positions are the **API Specification**.
  *   The Commitment-Device is the **Implementation Strategy** (e.g., using an immutable data structure, a smart contract, or a Ulysses Pact like `sudo rm -rf` to prevent future modification).

  You are treating the *architecture of constraint* as if it were the *definition of the contract*. They are related but distinct. You can have a binding promise (Scanlonian reliance) without a commitment device (you just have to try hard). You can have a commitment device (a smart contract) without a moral promise (code that executes regardless of intent).

  **3. The Indictment: Vocabulary or Philosophy?**
  If the residue is large, does it indict the software vocabulary or the philosophers' notion of binding?

  It indicts **neither**, but it reveals a category error in the translation layer.

  *   **Software Vocabulary** optimizes for *predictability* and *coordination* in deterministic or probabilistic systems. It assumes agents are functions: Input $\to$ Output.
  *   **Philosophical Notion** optimizes for *agency* and *relationship* in normative systems. It assumes agents are wills: Intent $\to$ Action.

  The residue is large because **morality is a technology for managing free will, whereas software is a technology for eliminating it.**

  When you write software, you want to remove ambiguity. When you make a promise, you are navigating ambiguity (the future, your own changing desires). The "binding" nature of a promise is specifically designed to operate in the gap where enforcement is impossible. Software contracts operate in the gap where enforcement is *automated*.

  **Conclusion:**
  Your vocabulary is excellent for analyzing the *consequences* of breaking a promise (reliance damage, ecosystem degradation). It is poor at analyzing the *nature* of the binding itself (why you feel obligated when no compiler is watching).

  The "commitment device" reflex is a rationalist attempt to turn the moral problem (managing will) into an engineering problem (managing constraints). It works well for self-binding, but it fails to capture the interpersonal texture of the other four positions. You can't `await` someone else's moral obligation.

  The residue isn't a bug in your vocabulary; it's the signal that you are trying to compile normative code on a deterministic runtime. The "error" is expected.
