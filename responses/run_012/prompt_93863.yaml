      *   *Position 2: Reliance/Invitation (Scanlonian).* Wrong is inviting reliance and then disappointing it.
      *   *Position 3: Prediction (Humean/Skeptic).* A promise is just a statement of intent/probability, not a distinct moral entity.
      *   *Position 4: Authority Transfer (Shiffrin/Right-View).* Handing the promisee authority over the promisor's actions.

  3.  **Drafting the Translations (Iterative Process):**
