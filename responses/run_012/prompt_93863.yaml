      *   *Pos 1 (Social Practice):* Think "Ecosystem Standards." You use a library; you follow its conventions. If you break the convention, you degrade the ecosystem.
      *   *Pos 2 (Reliance):* Think "Public API Documentation." You publish an interface. Clients implement against it. If you change behavior without signaling, you break their build/logic.
      *   *Pos 3 (Prediction):* Think "Heuristic/Probabilistic Model." It's not a contract; it's a `guess()` function based on current state. No guarantee, just high confidence.
      *   *Pos 4 (Authority):* Think "Delegated Permissions/Root Access." The caller gets write access to your state. They can trigger your methods.

