      *   **Which to bet on:** Bet on **No Sanction**. The record is overwhelmingly about *claimant behavior*, not *economic results*. Case 1 is the strongest anchor: external factor reduced ability to attend, but communication saved her. Here, external factor reduced earnings, but communication/effort remains.
      *   **Closest Precedent:** Case 1 (Bus Cancelled). Both involve external economic/logistical factors reducing status/attendance, mitigated by proactive communication and continued effort.
