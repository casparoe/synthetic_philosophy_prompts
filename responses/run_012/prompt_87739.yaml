          3.  *The Strongest Reply:* Consider independent standards (good life, impartiality). Argue they fail or concede primitivism.
          4.  *Consequences:* How to talk/reason. If primitive, is the picture vindicated? If empty, what replaces it? Does it capture phenomenology?
