answer: |-
  ### I. The Ordinary Picture

  The intuitive architecture of our moral thought relies heavily on a bipartite division. On one side lies the obligatory: acts we must perform, where failure warrants blame, criticism, or sanction. On the other lies the supererogatory: acts that are morally excellent, perhaps even saintly, but where failure warrants no more than a regretful acknowledgment of a missed opportunity for goodness. To make this division intelligible, we typically posit a threshold of sacrifice. The idea is that duty extends up to a certain point of cost to the agent, and supererogation begins where that cost becomes too great to be demanded.

  This threshold is meant to do specific work. It reconciles the impartial value of moral outcomes with the partial reality of human life. It explains why we live in a world where we are permitted to pursue our own projects, even when those resources could theoretically alleviate more suffering elsewhere. Without this line, morality risks becoming tyrannical, consuming the agent entirely. With it, we preserve a sphere of personal sovereignty while still acknowledging that going beyond that sphere is morally significant.

  Consider three cases to see how this threshold functions in our intuitions.

  First, imagine a bystander walking past a shallow pond. A child is drowning. To save the child, the bystander must wade in, ruining an expensive suit and being late for a meeting. The cost is financial and professional, but not life-altering. Our intuition is sharp here: the bystander is obligated to save the child. To walk away is not merely ungenerous; it is wrong. The sacrifice is below the threshold.

  Second, consider a healthy adult approached by a stranger who needs a kidney to survive. The donation involves surgery, pain, recovery time, and a non-zero risk of long-term health complications. The benefit to the recipient is life itself; the cost to the donor is significant bodily intrusion and risk. Here, the intuition shifts. While donating is noble and admirable, refusing is not typically considered a moral violation. The donor is not blameworthy for keeping their kidney. The sacrifice appears to have crossed the threshold into the supererogatory.

  Third, imagine an individual who could have a lucrative career but instead chooses to live in a conflict zone, risking death daily to distribute food to refugees, foregoing marriage, family, and personal safety. The benefit to others is immense; the cost to the agent is their entire conventional life plan. We view this person as a moral hero. But we do not view their neighbor, who stays home and donates 10% of their income, as morally deficient in the same way we viewed the bystander who let the child drown. The hero has ascended far into the region of the supererogatory.

  In this ordinary picture, the threshold is the anchor. It explains why the kidney donor is praised but not required, and why the pond bystander is required but not particularly praised. The boundary is drawn at the limit of what can reasonably be demanded of a person without asking them to surrender their status as an individual with a life of their own.

  ### II. The Difficulty

  The instability of this picture emerges when we attempt to locate the threshold independently. We want the threshold to explain the distinction between duty and supererogation. But to draw the threshold, we seem to need the distinction already in place.

  How do we determine where the line of "reasonable demand" lies? We might say duty ends when the sacrifice becomes "too great." But "too great" for what? If the moral goal is the maximization of good (saving lives, alleviating suffering), then any cost to the agent is justified so long as the benefit to the other is greater. The only reason to stop demanding sacrifice is if the agent's interests count for something that limits moral claims. But why do they count?

  If we say, "They count because it is not *required* to sacrifice more," we have simply restated the conclusion. We are using the notion of "requirement" (obligation) to define the limit of requirement.

  Let us press this by trying to fix the threshold using the agent's interests. Suppose we argue that duty stops where sacrifice threatens the agent's "life projects" or "happiness." In the kidney case, we say the risk is too high because it threatens the donor's future well-being. But why does the donor's future well-being trump the recipient's life? In the pond case, the suit and the meeting are also part of the bystander's well-being and projects, yet we say they must be sacrificed.

  To distinguish the suit from the kidney, we must argue that the sacrifice of the kidney is of a *different kind* than the sacrifice of the suit. We must say that the kidney sacrifice is the kind of thing we cannot ask of people. But "cannot ask" is just a synonym for "not obligatory." We are trying to derive the boundary of obligation from the nature of the sacrifice, but the nature of the sacrifice only becomes relevant if we have already decided that the agent has a right to withhold it. That right is precisely what the distinction between obligation and supererogation is supposed to ground.

  The circularity bites hardest when we consider the "life worth living" criterion. A common defense is that morality cannot demand a sacrifice that makes life no longer worth living. But what makes a life worth living? If a life of moral sainthood is the most meaningful life, then the sacrifice of personal comfort does not make life unworthy; it fulfills it. If, however, we say a life worth living requires personal hobbies, family, and safety, we are asserting that these personal goods have a priority over moral needs. Why? Is it because they are morally more important? No. Is it because they are legally protected? Irrelevant to moral duty. The only remaining answer is: "Because it is not morally required to give them up."

  Thus, any attempt to fix the threshold by appealing to cost, reasonableness, or the good life reintroduces the supererogatory as an input. We cannot calculate the limit of duty without already knowing which acts are supererogatory. We look at the kidney donation, intuit that it is supererogatory, and then posit a threshold of sacrifice that would classify it as such. We do not derive the status of the act from the threshold; we derive the threshold from the status of the act. The boundary does not explain the distinction; it merely maps it.

  ### III. The Strongest Reply

  A defender of the ordinary picture might resist this by invoking an independent standard. They could argue that the threshold is not determined by our intuitions about specific cases, but by a substantive theory of value or rationality. For instance, one might claim that the requirements of a "good life" are objectively knowable independent of moral duty, and that duty is constrained by the need to maintain that good life. Alternatively, one might argue that impartiality itself contains a built-in agent-centered prerogative: rational morality allows agents to give some extra weight to their own interests, and the threshold is simply the point where that permission expires.

  This reply attempts to break the circle by grounding the threshold in something other than the obligation/supererogation distinction. However, this move faces a dilemma.

  First, consider the "good life" standard. To succeed, this standard must be defined without reference to moral requirements. If the "good life" includes moral virtue as a constituent element, then the life of the saint who sacrifices everything might be the *best* life. If it is the best life, and we have a duty to pursue the good, then the saintly life becomes obligatory. The threshold vanishes, and supererogation collapses into duty. To prevent this, the defender must define the "good life" in non-moral terms (e.g., happiness, relationships, art). But then they must explain why these non-moral goods trump moral needs. Why does my desire to play the piano outweigh a stranger's need for food? The only non-circular answer would be that I am not *required* to give up the piano. But again, we are back to using the notion of requirement to set the limit of requirement.

  Second, consider the "agent-centered prerogative" standard. This claims that rationality permits us to prioritize our own interests up to a point. But where does that permission come from? If it is a brute fact of rationality, then the boundary is primitive. It is not explained by a threshold of sacrifice; it is simply a rule that says "you may stop here." If it is derived from something else, such as the stability of moral cooperation or psychological feasibility, it fails. Psychological feasibility varies by person; a saint finds sacrifice feasible. Moral cooperation might require some sacrifice, but why not more? To say "because more is too much" is to invoke the supererogatory intuition again.

  Therefore, the strongest reply succeeds only by conceding that the boundary is primitive. It establishes that there is a limit to what can be demanded, but it cannot explain *why* that limit exists without referencing the very distinction it seeks to ground. The independent standard either collapses supererogation into duty (if the good life is moral) or assumes a right to personal priority that is indistinguishable from the claim that "this act is not required."

  ### IV. Consequences

  If the argument holds, we are left with a stark choice: the concept of supererogation is either primitive or empty.

  If it is **primitive**, then the ordinary picture is phenomenologically correct but theoretically hollow. The distinction between duty and supererogation is a brute feature of moral thought, like the distinction between red and green. We cannot explain why the line is where it is; we can only point to it. This vindicates the ordinary way we talk—we can continue to praise the kidney donor and blame the pond bystander—but it undermines the philosophical project of justifying these reactions. We cannot tell the bystander *why* they must act while the donor need not, other than to say, "That is simply how morality is structured." This leaves morality vulnerable to the charge of arbitrariness. Why does the threshold stop at the kidney and not the suit? If there is no deeper reason, the structure of our moral obligations rests on an unexamined intuition.

  If it is **empty**, then the distinction dissolves. There is only the good, and the better, and the best. Acts are more or less valuable, and agents are more or less virtuous, but there is no categorical switch from "permitted to omit" to "required to perform." In this view, the kidney donation is morally better than keeping the kidney, full stop. Whether one is "blamed" for keeping it is a matter of social convention or psychological reaction, not moral fact. This view, often associated with demanding moral theories, replaces the boundary with a gradient.

  Does the replacement do justice to the phenomenology? The ordinary picture captures a specific feeling: the relief of the ordinary person who knows they have done "enough," and the special admiration for the hero who did "more." If the concept is empty, the relief of the ordinary person is exposed as a form of moral complacency. They haven't done "enough"; they have simply done what is socially enforceable. The admiration for the hero remains, but it changes character. We no longer admire them because they went beyond the call of duty; we admire them because they saw the moral reality more clearly than we did and acted on it, while we did not.

  However, if the concept is primitive, the phenomenology is preserved intact. The feeling that some acts are "owed" and others are "gifts" is real because the distinction is a fundamental feature of our normative landscape. The cost is that we must accept this feature as unexplainable. We cannot ground it in sacrifice or reasonableness.

  Ultimately, the instability of the threshold suggests we should alter how we reason about these cases. We should stop treating the boundary as a discovery of moral geometry—a line waiting to be found in the nature of sacrifice. Instead, we should treat it as a negotiation of moral expectations. When we call an act supererogatory, we are not describing its intrinsic relation to a threshold of cost; we are marking it as an act that our community has decided not to enforce, perhaps to preserve social stability or psychological health. The admiration we feel is real, but it is not evidence of a metaphysical boundary between duty and the beyond. It is evidence of our recognition that some values are too costly to mandate, even if they are too important to ignore. The boundary is not a wall separating two regions of moral space; it is a horizon that recedes as we approach it, defined always by where we currently stand, not by where the land ends.
