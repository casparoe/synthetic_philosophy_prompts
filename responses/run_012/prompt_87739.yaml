  2.  **Drafting - Section 1: The Ordinary Picture:**
      *   *Goal:* Establish the intuitive appeal of the duty/supererogation split.
      *   *Concept:* The "Threshold of Sacrifice." Duty stops where sacrifice becomes too great. Supererogation begins where we go beyond that.
      *   *Cases:*
          *   *Case A (Low Cost):* Drowning child in a pond. Ruining shoes vs. saving life. Clearly duty.
          *   *Case B (High Cost):* Kidney donation to a stranger. Significant health risk, pain, recovery. Clearly supererogatory.
          *   *Case C (Extreme Cost):* Devoting a life to effective altruism in a war zone. Giving up marriage, safety, personal projects. Clearly supererogatory (saintly).
      *   *Function:* The threshold protects the agent's personal life while acknowledging moral value in doing more. It explains why we praise the saint but don't blame the ordinary person.

  3.  **Drafting - Section 2: The Difficulty (The Circularity):**
      *   *Goal:* Show that defining the threshold *requires* knowing what is supererogatory first.
      *   *The Problem:* How do we set the line?
          *   *Option 1: Reasonableness.* "Duty is what is reasonable to demand." But what makes a demand reasonable? If we say "It's reasonable to demand X but not Y," we are essentially saying "X is obligatory, Y is not." This just restates the distinction.
          *   *Option 2: Cost/Benefit Analysis.* "Duty stops when cost to agent outweighs benefit to other." But why does the agent's cost count *morally* to limit duty? If the moral value is impartial, why does personal cost stop obligation? Only if we assume there's a zone of permission (supererogation/prerogative) already.
          *   *Option 3: "Life worth living."* "Duty shouldn't make life not worth living." But what constitutes a life worth living? Is it moral flourishing or personal projects? If personal projects limit duty, we are assuming a right to prioritize them over the greater good. That right *is* the boundary we are trying to derive.
      *   *The Bite:* To draw the line, we need to know where obligation ends. But knowing where obligation ends *is* knowing where supererogation begins. We can't use the line to explain the distinction if we need the distinction to draw the line.

  4.  **Drafting - Section 3: The Strongest Reply (Independent Standards):**
      *   *Goal:* Test if an external metric can fix the threshold without circularity.
      *   *Proposal:* Maybe "The Good Life" or "Impartial Rationality" sets the limit.
      *   *Critique:*
          *   *Impartiality:* Pure impartiality (utilitarian) usually collapses supererogation into duty (if you can save a life at cost X, you must, regardless of X, unless X > benefit). If impartiality allows a cutoff, it must build in a "agent-centered prerogative." But that prerogative is just the supererogatory boundary in disguise.
          *   *The Good Life:* If duty is limited by what preserves a "good life," we need a theory of the good life. If the good life includes moral virtue, the saint's life might be the *most* good, making their sacrifice duty. If the good life includes personal happiness, we are asserting that personal happiness trumps moral need at a certain point. Why? Because it's *not required* to sacrifice it. Again, circular.
      *   *Concession:* The only way this works is if we accept that "agent-centered prerogatives" are brute facts. But that means supererogation is primitive, not derived from a threshold of sacrifice.

  5.  **Drafting - Section 4: Consequences:**
      *   *Goal:* What do we do with this?
      *   *Option A: Primitive.* The distinction is a basic feature of moral phenomenology. We feel the difference between "must" and "ought but needn't." This vindicates the *feeling* but undermines the *theory*. We can't explain *why* the line is there, only that it is.
      *   *Option B: Empty.* The concept dissolves. Everything is either obligatory or impermissible (moral demandingness). Or, everything is a matter of degree of value.
      *   *Phenomenology:* The feeling of "admiration without blame" needs to be preserved. If empty, we replace "supererogatory" with "highly valuable but not mandated by our specific normative framework."
      *   *Synthesis:* If primitive, the ordinary picture is phenomenologically correct but theoretically hollow. We should talk in terms of "moral expectations" vs. "moral ideals" rather than rigid ontological categories. The admiration remains, but the justification shifts from "it was beyond duty" to "it exceeded standard expectations which are themselves arbitrary."

