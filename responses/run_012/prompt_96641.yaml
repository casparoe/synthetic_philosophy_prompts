prompt: |-
  Right, so a guy on my team has got really into this thing he read on some rationalist-adjacent blog and now he brings it up constantly. His summary of it goes roughly like this: game theory has a theorem proving that two rational people can never genuinely disagree — if we both reason correctly and look at the same evidence, we're guaranteed to end up with identical beliefs, so any time you and me actually disagree about something, one of us has to be the irrational one. He says the only reason disagreement exists at all is that people start from different priors (he calls this the 'common prior assumption'), and that a properly rational company would have zero internal disputes because everyone would already have converged on the same answer; the way he tells it, when a colleague disagrees with him about, say, whether our last deploy caused a latency spike, he treats them like they've got a bug in their reasoning. He illustrated the whole thing with: it's like two people looking at the same painting from different angles — as soon as they both walk round to the same spot they have to see the exact same thing, so any remaining difference means someone's eyes are broken.

  I can't shake the feeling that the painting bit is smuggling in alot more than the actual result allows, but I don't know the formal version well enough to pin down where he's gone wrong. Could you take his summary apart and seperate out what a game theorist would happily nod along to, what's a distorted version of something real, and what's flatly wrong — and then say whether his practical conclusions (dissent is a sign of a faulty reasoner, a rational firm never disagrees) actually follow from the true bits or only from the garbled ones? I'd especially like to know what the real theorem actually demands: what exactly has to be common knowledge, what 'rational' is doing in there, and whether a common prior is a discovered fact about how people actually are or just an assumption a modeller chooses to make — because I suspect that's where the sleight of hand lives. (For context I'm a software engineer, no philosophy or econ training, so keep the jargon survivable.)

  Don't hedge or hand me a both-sides list at the end: if his reading is wrong then say so straight out and give me the reading you'd actually defend, even if that means conceding he's got one or two things right along the way. And please write it in British English — I've been on a London team for two years and I keep spelling everything with 'u's now, so let's stay consistent.
