answer: |-
  You have stumbled onto one of the most persistent, frustrating, and genuinely deep puzzles in metaphysics, legal theory, and ethics. You are not waving your hands; you are identifying a real fault line in how humans understand reality.

  The short answer is: **Yes, there are names for this, but they are split across three different fields.** No single term captures the whole picture because philosophers, lawyers, and safety engineers use the word "cause" to mean slightly different things.

  Here is the breakdown of the three concepts you are sensing, where they match your intuition, where they miss, and a synthesized term you can use to cut through the "well, it depends" fog at your committee meetings.

  ### 1. The Broad Bucket: Omissive Causation
  **The Term:** *Causation by Absence* or *Omissive Causation*.
  **The Debate:** Can a "nothing" (a non-action) cause a "something" (an injury)?
  **Where it matches:** This is the general arena. Everyone agrees the machine physically crushed the hand. The debate is whether the *absence of the guard* is a cause or just a *condition*.
  **Where it misses:** This debate is usually purely metaphysical (about the fabric of the universe). It doesn't account for the **Lifeguard vs. Stranger** problem. In pure metaphysics, the stranger and the lifeguard are identical: both were atoms that didn't move. The fact that we treat them differently suggests "cause" isn't just about physics; it's about *us*.

  ### 2. The Expectation Mechanism: Causal Selection (Hart & Honoré)
  **The Term:** *Causal Selection* (specifically the **Hart and Honoré Theory**).
  **The Concept:** In their landmark book *Causation in the Law* (1959), legal philosophers H.L.A. Hart and Tony Honoré argued that the world is full of "conditions," but we only pick out a few as "causes." How do we pick? **Normative Expectations.**
  *   **Normal Condition:** Oxygen is present, gravity is working, the machine is on. We don't call these causes even though they are necessary.
  *   **Abnormal Intervention:** A human fails to do what they are *supposed* to do.
  **Where it matches:** This solves your Lifeguard vs. Stranger puzzle. Physically, their inaction is identical. But the Lifeguard's inaction is a **deviation from a norm**, while the Stranger's is not. Hart & Honoré argue that *norms select causes*.
  **Where it misses:** It doesn't fully capture your "Harm Rolling vs. Good Not Happening" distinction. It explains why duty matters, but not why *timing* matters.

  ### 3. The "Harm Rolling" Mechanism: Double Prevention
  **The Term:** *Double Prevention* (championed by philosopher Jonathan Schaffer).
  **The Concept:** This describes a specific causal structure:
  1.  Threat exists (Machine will hurt hand).
  2.  Preventer exists (Guard stops machine).
  3.  Preventer is removed (Guard is missing).
  4.  Threat succeeds (Hand hurt).
  Schaffer argues this *is* genuine causation. You caused the injury by preventing the prevention.
  **Where it matches:** This captures your intuition about the "harm already rolling." If the threat is active, removing the barrier feels like pushing the domino.
  **Where it misses:** It doesn't explain the *duty* aspect. A stranger who steals the guard is a "double preventer," but so is the maintenance guy who forgets it. Double prevention explains the *mechanism*, but not why we blame one more than the other.

  ---

  ### The Core Question: Is it Cause or Blame?
  You asked: *"The expectation seems to be doing causal work and not just blame work... is that a real distinction?"*

  **The Verdict:** It is **Explanatory Salience**, not **Ontological Causation**.

  *   **Ontological Causation (Physics):** The expectation does *nothing*. The atoms hit the hand because of momentum and gravity. The brother's phone call would not have changed the physics of the stroke, only the medical outcome. In strict physics, the "cause" is the machine or the pathology.
  *   **Explanatory Causation (Human Systems):** The expectation does *everything*. When we ask "What caused this?" in a safety committee or a court, we are not asking for a physics report. We are asking: **"Which factor, if changed, would prevent this in the future?"**

  Because the stranger has no duty, changing their behavior isn't a viable system fix. Because the lifeguard (or maintenance guy) has a duty, changing their behavior *is* a viable system fix. Therefore, in a human context, their omission becomes **The Cause**.

  **You are not confusing cause and blame.** You are recognizing that in safety and law, "cause" is a tool for assigning responsibility, not just a description of physics.

  ---

  ### The Term You Need (The Synthesis)
  Since existing terms are split between metaphysics (Double Prevention), law (Hart & Honoré), and ethics (Omission), none of them quite give you the single label for the *intersection* you described.

  I propose you coin/use the term: **Normatively-Salient Omissive Causation.**

  **What it covers:**
  1.  **Omissive:** It acknowledges the cause was a "not-doing."
  2.  **Normatively-Salient:** It acknowledges that the "cause" status is granted by the expectation/duty (the norm), which makes that specific omission stand out (salient) from all other conditions.
  3.  **Causation:** It validates that this isn't just blame; in a functional system, the omission is the leverage point for prevention.

  **What it doesn't cover:**
  *   It does not apply to natural disasters (no norm).
  *   It does not apply to strangers with no duty (no norm).
  *   It does not apply to "failing to produce a good" where no threat was active (e.g., not buying someone a lottery ticket), because there is no *pre-existing causal chain* to interrupt.

  ### How to Use This at Your Committee Meeting
  When the committee argues about whether the injury was caused by the *machine* or the *missing guard*, you can shut down the metaphysics and pivot to **Causal Selection**.

  **Say this:**
  > "Physically, the machine caused the injury. But in safety engineering, we use **Causal Selection**. We are looking for the **Normatively-Salient Omission**.
  >
  > The oxygen in the room was also necessary for the injury, but we don't list it as a cause because it's a 'normal condition.' The guard was a 'prevention mechanism' that was removed. Because there was a **duty** to refit it, that omission becomes the **salient cause** for the purpose of prevention.
  >
  > If we say the machine caused it, we fix the machine (which isn't broken). If we say the omission caused it, we fix the maintenance protocol. The 'cause' is whichever factor we can actually control."

  ### Summary of the Distinction You Noticed
  You sensed a split between "Not Stopping Harm" vs. "Not Producing Good."
  *   **Not Stopping Harm (Bakery/Dad):** This is **Interruptive Omission**. A causal chain of harm existed; the omission allowed it to complete. With a duty attached, this is **Double Prevention**.
  *   **Not Producing Good (Lottery/Random Aid):** This is **Non-Initiation**. No causal chain existed. The omission is just a state of the world.

  **The Rule:** An omission counts as a cause when it **interrupts a pre-existing prevention mechanism** within a **normative framework of duty.**

  You aren't crazy. You've independently rediscovered the Hart & Honoré distinction between *causes* and *mere conditions*, and you've correctly identified that "duty" is the filter that turns a condition into a cause.
