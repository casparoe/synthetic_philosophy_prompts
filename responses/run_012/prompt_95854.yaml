answer: |-
  # JOINT STATEMENT ON THE FREGE–GECH PROBLEM
  **Adversarial Collaboration Outcome**

  **Signatories:**
  The Expressivist (Quasi-Realist, Deflationary about Truth)
  The Cognitivist (Non-Naturalist Realist, Robust about Truth)

  **Date:** October 26, 2023

  ---

  ### I. AGREED CLAIMS

  1.  **The Frege–Geach Datum:** Any adequate metaethical account must explain how moral predicates (e.g., "is wrong") retain a constant semantic contribution across freestanding (assertoric) and embedded (unasserted) occurrences. Specifically, the account must explain why the inference *Lying is wrong; If lying is wrong, then telling your brother to lie is wrong; Therefore, telling your brother to lie is wrong* is valid in virtue of its form, without equivocation on "is wrong."

  2.  **Inventory of Embedding Environments:** A compositional semantics must account for the behavior of moral sentences in the following contexts:
      *   **Truth-functional:** Negation, disjunction, conjunction.
      *   **Conditional:** As antecedent and consequent of indicative conditionals.
      *   **Operators:** Modal (necessary, possible), probabilistic (likely, improbable), and tense operators.
      *   **Speech/Attitude Ascriptions:** Propositional-attitude reports (believes that..., hopes that...), speech-act ascriptions (said that..., promised that...), and interrogative/imperative constructions.
      *   **Anaphora & Factivity:** Anaphoric truth attribution (e.g., "Sam said that lying is wrong, and it is true") and factive/explanatory constructions (e.g., "It is good that he came because...").

  3.  **Success Criteria:**
      *   **For the Expressivist:** Success requires a systematic explanation of how states expressed by moral sentences combine logically to mirror valid inference, without positing moral properties as ontological primitives, while maintaining the deflationary equivalence of "It is true that P" and "P."
      *   **For the Cognitivist:** Success requires a systematic explanation of how moral sentences express states eligible for robust truth-evaluation, without reducing moral properties to natural properties, while accommodating the internal connection between moral judgment and motivation/practicality.

  4.  **Ground Rules on Primitives:** Neither party treats "non-cognitive state" or "truth-aptness" as unexplained primitives.
      *   References to **non-cognitive states** are cashed out functionally as states with a *world-to-mind direction of fit* (aiming to change the world to match the state) or as *practical commitments*.
      *   References to **truth-aptness** are cashed out either via logical comportment (minimalism) or via robust correspondence to mind-independent norms (realism), not merely by stipulation.

  ---

  ### II. DISAGREEMENT TABLE

  | Issue | Expressivist Formulation | Cognitivist Formulation | Crux | Deciding Case | Predictions (Expressivist / Cognitivist) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Semantic Value** | Moral sentences express *practical commitment states* (functionally defined by their role in deliberation and action-guidance). | Moral sentences express *belief states* (functionally defined by their aim to track mind-independent normative properties). | Whether the functional role of moral judgment is exhausted by practical coordination or requires tracking independent norms. | **The Amoralist:** An agent who sincerely asserts "Lying is wrong" but lacks any motivation to avoid lying. | **E:** Conceptually impossible or insincere; the assertion *constitutes* a motivational state.<br>**C:** Possible (though rare); the agent has a belief but lacks the conative state usually caused by it. |
  | **2. Meaning Invariance** | Sameness of meaning is a constraint met by showing the *attitude* expressed in the antecedent is the same type as the *attitude* expressed freestanding, via higher-order attitudes. | Sameness of meaning is a constraint met by the moral predicate referring to the *same property* in both contexts, ensuring logical validity. | Whether logical validity is preserved by consistency of *attitude types* or consistency of *referential content*. | **Logical Failure:** An agent asserts premises of the moral modus ponens but denies the conclusion. | **E:** The agent is pragmatically inconsistent (clash of commitments), though logically consistent in a narrow sense.<br>**C:** The agent is logically inconsistent (contradictory beliefs). |
  | **3. Account Status** | The explanation of embedding is a *rational reconstruction* of moral discourse that validates its logic without ontological commitment to moral facts. | The explanation of embedding is a *direct semantics* where moral sentences have truth-conditions grounded in normative reality. | Whether the expressivist account is a genuine semantics or a paraphrase strategy that changes the subject. | **Truth Ascription:** "It is true that lying is wrong." | **E:** This is just a reaffirmation of the commitment to "Lying is wrong" (deflationary).<br>**C:** This ascribes a property to the proposition that lying is wrong (substantive). |
  | **4. Truth-Aptness Work** | Truth-aptness does no work beyond licensing logical embedding and anaphora (minimalism); it does not imply correspondence. | Truth-aptness implies the sentence is capable of *failing* to correspond to reality; it does substantial explanatory work. | Whether "truth" in ethics is merely a logical device or a substantive normative achievement. | **Error Theory Test:** "Nothing is wrong." | **E:** This expresses a commitment to having no negative attitudes toward anything (a substantive practical stance).<br>**C:** This expresses a false belief about the absence of normative properties. |
  | **5. The Negation Problem** | "Lying is not wrong" expresses a *distinct negative attitude* (e.g., tolerance or disapproval of disapproval), not merely the absence of disapproval. | "Lying is not wrong" expresses the belief that the property of *wrongness* is absent from lying. | Whether the negation of a moral sentence targets the *attitude* or the *property*. | **Attitude Gap:** An agent accepts "Lying is not wrong" (per analysis) but reports *no* attitude (neither disapproval nor tolerance) toward lying. | **E:** Impossible; accepting the sentence *is* holding the higher-order attitude.<br>**C:** Possible; one can believe a property is absent without holding a specific conative stance. |
  | **6. Verbal Dispute Risk** | Given minimalism, our disagreement is verbal regarding "truth" and "belief," but substantive regarding the *nature* of the psychological state expressed. | Given minimalism, our disagreement is substantive regarding the *ontology* of moral properties, not merely the psychology. | Whether the dispute reduces to different labels for the same logical phenomena. | **Metaphysical Commitment:** "There are moral facts." | **E:** True in a deflated sense (moral sentences are assertible), false in a robust ontological sense.<br>**C:** True in a robust ontological sense; the deflated sense is insufficient. |
  | **7. Practicality Constraint** | Practicality is *semantic*: To judge is to be in a state that necessarily motivates (internalism). | Practicality is *conceptual/contingent*: To judge is to believe, and beliefs typically motivate rational agents (externalism or hybrid). | Whether motivation is built into the meaning of moral terms or is a consequence of rationality. | **Rational Amoralist:** A fully rational agent who judges "X is wrong" but is unmoved. | **E:** Describes a contradiction in terms.<br>**C:** Describes a possible (if deficient) rational agent. |

  ---

  ### III. CLOSING SECTION: EVIDENCE, IMMOVABLES, AND VERBAL DISPUTE

  **1. Evidence or Argument Against Our Own Views**
  *   **The Expressivist** acknowledges that their view would be falsified if it were demonstrated that moral inferences fail to preserve validity in complex embeddings (e.g., multiple negations or nested conditionals) in ways that natural language inferences do not. Specifically, if the "Negation Problem" proves unsolvable without positing a property that functions exactly like a truth-condition, the quasi-realist project collapses into realism.
  *   **The Cognitivist** acknowledges that their view would be falsified if it were demonstrated that moral judgments systematically fail to motivate in rational agents across all cultures and contexts (refuting the internalist intuition), or if moral properties were shown to be causally inert in a way that makes moral knowledge epistemologically impossible.

  **2. What Will Not Move Either Party**
  Both parties agree that the following will not resolve the dispute:
  *   **Linguistic Intuitions alone:** Appeals to whether "It is true that lying is wrong" *sounds* like a description of a fact are inconclusive, as quasi-realism explains why it sounds that way.
  *   **Logical Validity:** Both agree moral logic is valid; the dispute is about *why* it is valid (attitude consistency vs. truth preservation).
  *   **Deflationary Truth:** The Expressivist's adoption of minimalism does not concede the Cognitivist's ontology, nor does the Cognitivist's acceptance of minimalism concede the Expressivist's psychology.

  **3. Assessment of Verbal Dispute**
  We identify a specific portion of the dispute as **merely verbal**, and a portion as **substantive**.

  *   **Verbal:** The use of the terms "belief," "truth," and "fact." The Expressivist uses these terms in a deflationary, logic-permitting sense. The Cognitivist uses them in a robust, ontological sense. When the Expressivist says "Moral sentences express beliefs," they mean "states that function logically like beliefs." When the Cognitivist hears this, they hear "states that track properties." Once we disambiguate "belief" into *functional-role-belief* (Expressivist) vs. *tracking-state-belief* (Cognitivist), the disagreement over whether moral judgments *are* beliefs dissolves into an agreement that they play the functional role but a disagreement over whether that role requires tracking properties.

  *   **Substantive:** The existence of **mind-independent normative properties**. Even if we agree on the logic and the functional role of moral language, the Cognitivist maintains that for the system to work, there must be objective norms that make the judgments correct or incorrect independent of our attitudes. The Expressivist maintains that the "correctness" is internal to the practice of valuing itself. This ontological disagreement remains even after semantic terminology is standardized.

  *   **The Negation Crux:** The most significant substantive remaining hurdle is the **Negation Problem**. If the Expressivist cannot specify the distinct negative attitude expressed by "Lying is not wrong" without implicitly referencing the absence of a property (thereby mimicking the Cognitivist's truth-conditions), the distinction between the views collapses. We agree that future work must focus on whether higher-order attitudes can be individuated without covertly relying on the realist's ontology.

  **Signed,**

  _________________________
  *The Expressivist*

  _________________________
  *The Cognitivist*
