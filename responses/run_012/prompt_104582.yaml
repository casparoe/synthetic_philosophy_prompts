      *   *Self-Correction during drafting:* Make sure I don't say the Old Man/Woman *are* victims of injustice in the film's logic. The film argues they were *mistaken*. The Frickerian reading asks if the *process* of finding them mistaken relied on prejudice. The walk and glasses arguments rely on physics/biology, not prejudice. That's the key distinction. The *initial* belief in them might have been due to authority bias, not identity prejudice.
