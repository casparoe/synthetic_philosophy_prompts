answer: |-
  ### Scoping Brainstorm: Candidate Loci and Cruxes

  Before drafting the joint statement, we must identify where the dialectic is currently stuck. The impasse arises because "perception" is being used to track three different things: the neural substrate (early visual cortex), the functional role (informational input to belief), and the phenomenology (what it is like to see).

  **Candidate Loci for Disagreement:**
  1.  **The Input/Output Boundary:** Modularists define perception as the input system *before* it touches belief. Penetrationists define it as the conscious experience *which includes* the influence of belief.
  2.  **Attention vs. Penetration:** Modularists concede attention is top-down but classify it as a resource allocator, not a content-alterer. Penetrationists argue attention is the *mechanism* of penetration.
  3.  **Neural vs. Functional:** A change in V1 activity (neural) does not entail a change in perceptual content (functional).
  4.  **Modality:** Vision is the battleground. If olfaction is penetrable (plausible), does that salvage the Penetrationist view, or does the Modularist claim vision is a special, encapsulated case?

  **Primary Cruxes:**
  *   **The Criterion Crux:** Are effects merely shifts in response bias (saying "yes" more often) rather than sensitivity (seeing better)?
  *   **The Phenomenal Crux:** Can two subjects agree on the object identity (content) but disagree on the vividness (character) due to cognition?
  *   **The Definition Crux:** Is "encapsulation" an empirical hypothesis or a definitional stipulation of what counts as "perceptual"?

  ***

  # JOINT STATEMENT ON THE COGNITIVE PENETRABILITY OF PERCEPTION

  **Date:** October 2023
  **Parties:** The Encapsulation Thesis (Modularists) & The Penetrability Thesis (Penetrationists)
  **Goal:** To isolate empirical disagreements from verbal disputes and specify conditions for resolution.

  ## 1. AGREED CLAIMS
  *Both sides commit to the following non-vacuous claims regarding architecture, explananda, and data.*

  1.  **Existence of Top-Down Signals:** Both sides agree that anatomical feedback connections exist from higher-order cognitive areas (e.g., PFC) to early sensory areas (e.g., V1). The debate is not about connectivity, but about functional efficacy.
  2.  **Judgment is Penetrable:** Both sides agree that *perceptual judgments* (reports, beliefs formed on the basis of perception) are influenced by prior knowledge, expectation, and desire. The dispute concerns the *experience* prior to judgment.
  3.  **Attention is Distinct:** Both sides agree that spatial and feature-based attention are top-down mechanisms. The dispute concerns whether attention is the *only* top-down mechanism affecting perception, or whether semantic/conceptual states act independently of or through attention to alter perceptual content.
  4.  **Burden of Discrimination:** Both sides agree that the primary methodological challenge is distinguishing perceptual changes from post-perceptual decision biases. A result is only evidence for penetrability if it cannot be explained by a shift in response criterion or memory distortion.
  5.  **Undisputed Data:** Both sides accept the validity of standard psychophysical measures (d', criterion c) and agree that many historical "penetration" effects (e.g., desire-based distance estimation) are adequately explained by judgment bias without invoking perceptual change.

  ## 2. RESIDUAL DISAGREEMENTS
  *Each side states its position in its own terms.*

  | **The Encapsulation Thesis (Modularists)** | **The Penetrability Thesis (Penetrationists)** |
  | :--- | :--- |
  | **Core Claim:** The perceptual system is informationally encapsulated. Its computational processes operate on sensory input and fixed parameters, not on the subject's current beliefs or semantic knowledge. | **Core Claim:** The perceptual system is cognitively penetrable. The content and/or phenomenal character of perceptual experience are causally dependent on the subject's cognitive states (beliefs, concepts, desires). |
  | **Mechanism:** Top-down effects are mediated exclusively by attention (selection) or post-perceptual decision strategies (bias). | **Mechanism:** Cognitive states can alter the processing of sensory information directly, changing what is represented or how it feels, independent of attentional selection. |
  | **Phenomenology:** Apparent changes in experience are illusions caused by changes in judgment. The "look" of the world is stable; the "take" on the world varies. | **Phenomenology:** The "look" of the world itself varies. Learning a concept (e.g., "pine tree") changes the visual experience of the tree, not just the classification of it. |
  | **Architecture:** Perception is a distinct module with a specific interface to cognition. Breaching this interface destroys the functional definition of perception. | **Architecture:** Perception and cognition are deeply integrated. The "module" is an artificial carve-up of a continuous predictive processing hierarchy. |

  ## 3. CRUXES AND TAXONOMY
  *We organize the disagreement into four loci. For each, we specify where the disagreement lies.*

  ### A. The Four-Way Taxonomy of Effects
  *Where could a purported penetration effect live?*

  1.  **Representational Content:** Does cognition change *what* is seen (e.g., seeing a shape *as* a square)?
      *   *Dispute:* Modularists say this is post-perceptual categorization. Penetrationists say this is perceptual organization.
  2.  **Phenomenal Character:** Does cognition change *how* it feels (e.g., color saturation, vividness) independent of content?
      *   *Dispute:* Modularists say this is attentional gain. Penetrationists say this is direct cognitive modulation of qualia.
  3.  **Early Sensory Encoding:** Does cognition change neural activity in early areas (V1/V2)?
      *   *Dispute:* Modularists say early activity changes do not entail perceptual changes (sub-personal vs. personal level). Penetrationists say early activity changes are necessary and often sufficient evidence of perceptual alteration.
  4.  **Decision/Report Threshold:** Does cognition change the willingness to report a stimulus?
      *   *Dispute:* **Agreed Locus of Skepticism.** Both sides agree this is the null hypothesis to be ruled out. Disagreement arises only when this is controlled for and effects persist.

  ### B. The Sense-Generality Crux
  *Is the debate an artifact of vision-centrism?*
  *   **Question:** If a clean demonstration of cognitive penetrability were found in Olfaction or Taste (where "encapsulation" is less intuitively plausible), would this settle the debate for Perception *simpliciter*?
  *   **Modularist Position:** Vision may be a special, encapsulated case. Penetration in olfaction does not refute modularity in vision.
  *   **Penetrationist Position:** If cognition penetrates any sensory modality, the strong Encapsulation Thesis is false. The architecture of mind is generally penetrable.
  *   **Resolution Condition:** A cross-modal demonstration. If olfaction is penetrable, Modularists must concede the *general* thesis is false, even if they retain a *visual-specific* modularity claim.

  ### C. The Verbal Dispute Audit
  *We identify where definitions may be driving the impasse.*
  *   **The Term "Perception":**
      *   *Modularists* use "Perception" to refer to the **Input System** (computation prior to belief fixation).
      *   *Penetrationists* use "Perception" to refer to the **Phenomenally Given** (the totality of conscious sensory experience).
  *   **Impact:** If the dispute is purely definitional, it dissolves. However, both sides claim to be making empirical claims about the *same* underlying neural/functional process.
  *   **Commitment:** Both sides agree that if the Penetrationists can show that cognitive states alter the **Input System** (by Modularist definition), the Penetrationists win. If Modularists can show that the **Phenomenally Given** is invariant under cognitive manipulation (controlling for attention), the Modularists win.

  ## 4. TESTS AND PREDICTIONS
  *For each crux, we specify the test and record advance predictions.*

  ### Test 1: The Criterion-Matched Appearance Task (User Design)
  **Design:** A two-interval forced-choice (2IFC) task.
  *   **Manipulation:** Cognitive factor (e.g., semantic priming or category learning) is manipulated independently of spatial attention.
  *   **Measure 1 (Sensitivity):** Standard 2IFC discrimination (d').
  *   **Measure 2 (Appearance):** A separate report where subjects match the appearance of the stimulus to a scale, orthogonal to the discrimination task.
  *   **Variant:** A task-irrelevant condition where the cognitive factor is present but provides no utility for the task.

  **Predictions:**

  | **Measure** | **Encapsulation Prediction** | **Penetrability Prediction** |
  | :--- | :--- | :--- |
  | **Sensitivity (d')** | No change. Cognitive state cannot improve signal-to-noise ratio in the sensory channel. | Increase in d'. Cognitive state sharpens the sensory signal or alters the representational format. |
  | **Appearance Report** | No change once criterion is matched. Any difference is attributable to response bias. | Significant shift. The phenomenal character differs even when decision criteria are controlled. |
  | **Task-Irrelevant Variant** | Effect disappears. If the factor is useless, top-down resources (attention) will not be deployed. | Effect persists. Penetration is automatic and mandatory, not resource-dependent like attention. |

  **Falsifiability Commitments:**
  *   **Modularists:** We would accept the Penetrability Thesis as proven if, in the Task-Irrelevant Variant, there is a statistically significant shift in **Appearance Reports** that cannot be modeled by a shift in response criterion (c) and correlates with early sensory (V1) activity changes.
  *   **Penetrationists:** We would accept the Encapsulation Thesis as proven if, across all variants, cognitive manipulations **never** affect d' or Appearance Reports once attention and criterion are rigorously controlled, specifically if neuroimaging shows no feedback modulation in early sensory cortex during the perceptual window.

  ### Test 2: The Cross-Modal Crux
  **Design:** Replicate a standard "penetration" paradigm (e.g., label-induced discrimination) in Olfaction.
  *   **Prediction (Modularist):** Olfaction may show effects, but this is due to its lack of modular structure. Vision will remain encapsulated.
  *   **Prediction (Penetrationist):** Olfaction will show effects, confirming the general principle. Vision should too, provided the task is sensitive enough.
  *   **Resolution:** If Olfaction is penetrable, Modularists must restrict their claim to "Visual Modularity." If Olfaction is encapsulated, Penetrationists lose the "General Mind Architecture" argument.

  ### Test 3: The Learning Curve (New Category Acquisition)
  **Design:** Train subjects on a novel visual category (e.g., "Greebles") until expert. Measure perceptual distance (just-noticeable difference) between items *within* the category before and after learning.
  *   **Prediction (Modularist):** JND will not change. Subjects will get better at *labeling*, but the perceptual space remains metrically identical.
  *   **Prediction (Penetrationist):** JND will decrease. The perceptual space warps to accommodate the new category (category-induced compression/expansion).
  *   **Resolution:** If JND changes without attentional training, Penetrationists win. If only labeling speed changes, Modularists win.

  ## 5. FINAL COMMITMENT ON DECISIVE EVIDENCE

  **Question:** Is there *any* evidence you would accept as decisive against your view?

  *   **Modularist Response:** Yes. If a cognitive manipulation (e.g., belief that a line is longer) produces a change in **early sensory evoked potentials (e.g., C1 component)** that correlates with a change in **appearance matching** in a criterion-free task, we must concede penetration.
      *   *Caveat:* If the effect can be modeled by pre-sensory attention, we reserve the right to reclassify it as attentional.

  *   **Penetrationist Response:** Yes. If, after rigorous training and controlling for attention and criterion, cognitive states (beliefs/desires) show **zero correlation** with either neural activity in sensory cortex or phenomenal reports, we must concede encapsulation.
      *   *Caveat:* We reserve the right to argue that "phenomenal reports" are imperfect measures of experience, but we agree that without *any* behavioral or neural correlate, the thesis is empty.

  ***

  **Signed:**

  _________________________ (Lead, Encapsulation Camp)

  _________________________ (Lead, Penetrability Camp)

  _________________________ (Facilitator/Adversarial Collaborator)
