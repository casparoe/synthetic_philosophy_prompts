          *   Case 3 (Aunt) fits if we focus on objective capability, not subjective desire.
          *   Case 5 (Election) fits if "capabilities" includes political agency, but Relational Equality explains the *intensity* of the bug better.
          *   Case 6 (Thriving/Miserable) is the break point. The user contradicts themselves between Case 1 and Case 6. The Theory requires siding with Case 1 (compensate impairment regardless of happiness).
      *   **Address "Standing as Equals":** Explain Relational Equality (Anderson). Show how it solves Case 5 (Domination) and Case 3 (Social Exclusion) better than pure Capabilities.
      *   **The New Case Prediction:** Apply both theories. Both say "No redistribution." Explain why (internal luck vs. external opportunity).
      *   **Conclusion:** Recommend a Hybrid. Capabilities for the baseline (Aunt, Disability), Relational for the ceiling/structure (Election, Status).

  6.  **Refine the Tone:**
      *   Keep it philosophical but accessible.
      *   Avoid jargon where possible, or define it (e.g., "expensive tastes," "adaptive preferences").
