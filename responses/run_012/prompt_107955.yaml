      *   *Relational Equality and the Aunt:* Does relational equality demand we give the aunt more? Only if her low expectations lead to social subordination. If she's a hermit by choice (after deprivation), maybe not. But the user says "deprivation doing the talking," implying adaptive preferences. Relational equality is wary of adaptive preferences because they undermine agency.
      *   *The "Currency" Question:* The user asks "which currency." I need to explicitly name them: Resources, Welfare, Capabilities, Status.

  8.  **Final Polish:** Ensure the prediction for the "Cheerful vs. Gloomy" case is clear and justified by the chosen principles. (Decision: Both principles say no transfer, but for slightly different reasons).

