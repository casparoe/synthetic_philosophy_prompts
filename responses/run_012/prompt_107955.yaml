          2.  *Expensive Tastes:* Same income, one cultivated expensive tastes. -> *Owe nothing more.*
          3.  *Adapted Preferences (Aunt):* Low expectations due to deprivation. -> *Owe her no less (don't penalize adaptation).*
          4.  *Relative Wealth:* Everyone richer, one vastly richer. -> *Not unjust (gap widening okay).*
          5.  *Status/Power:* Material equality, but status hierarchy or political buying power. -> *Unjust (bugs more than money).*
          6.  *Subjective Wellbeing:* Impaired but thriving vs. Privileged but miserable. -> *Neither owed extra (clashes with Case 1).*
      *   **User's Theory:** "Range of lives a person can actually choose to live" (Capabilities Approach). Top up when *unchosen* constraints shrink the range; don't top up when *chosen* constraints shrink it.
      *   **Questions to Answer:**
          1.  Does this theory cover all gut calls, or must one be dropped?
          2.  If it fails, is the fix a richer currency (resources/capabilities/hybrid) or a different idea (Relational Equality)?
          3.  Does "Standing as Equals" (Relational Equality) save the Aunt and Election cases?
          4.  Prediction for a new case: Identical resources/capabilities, one cheerful, one gloomy (temperament).

  2.  **Evaluate the User's Theory (Capabilities/Range of Choice):**
      *   *Concept:* This aligns closely with Amartya Sen and Martha Nussbaum's **Capabilities Approach**. Equality of *what*? Equality of capability to function.
      *   *Case 1 (Disability):* Fits well. Disability shrinks the range of unchosen. Needs extra resources to restore capability range. (Verdict: Pass)
      *   *Case 2 (Expensive Tastes):* Fits well. Tastes are chosen (or deemed responsible). Shrinking range is self-inflicted. No compensation. (Verdict: Pass)
      *   *Case 3 (Aunt/Adapted Preferences):* Tricky. Her range *is* shrunk by deprivation, but she adapted. The theory says "top up when something they didn't choose shrinks that range." Deprivation didn't choose, but her *wants* changed. A strict capability view says we should look at the *objective* capability set, not her subjective satisfaction. So, we owe her the capability to have more, even if she doesn't want it. (Verdict: Pass, if interpreted objectively).
      *   *Case 4 (Relative Wealth):* Fits well. If the poorer person's range of choice hasn't shrunk (they are richer than before), inequality of outcome doesn't matter. (Verdict: Pass)
      *   *Case 5 (Status/Power):* Here's the rub. Buying an election shrinks *others'* range of choice (political agency). Status hierarchy shrinks the social capability to participate. This fits *if* we define "range of lives" to include political power and social standing. (Verdict: Pass, with broad definition).
      *   *Case 6 (Thriving Impaired vs. Miserable Privileged):* This is the clash.
          *   *Impaired:* User says "neither owed extra." But Case 1 said "owe them more."
          *   *Contradiction:* In Case 1, the focus was on *costs* (resources needed). In Case 6, the focus is on *subjective wellbeing* (happiness).
          *   *Theory Check:* The Capabilities Approach explicitly rejects subjective wellbeing (utility) as the metric. It focuses on *opportunity*, not *achievement* or *feeling*. So, if the impaired person *has* the capabilities (perhaps due to Case 1 compensation), their thriving is their own business. If they lack capabilities due to impairment, they are owed help regardless of happiness.
          *   *The Clash:* The user's gut says "Impaired + Thriving = No extra help." But Case 1 says "Impaired + High Cost = Extra help."
          *   *Resolution:* The user needs to decide if compensation is for *functioning* (needs) or *happiness* (utility). The Capabilities theory says compensate for *functioning/opportunity*, ignore happiness. So Case 6 gut call (no extra for misery) fits the theory, but Case 6 gut call (no extra for impaired if thriving) contradicts Case 1 (extra for impaired).
          *   *Diagnosis:* The user is mixing "Resource Need" (Case 1) with "Subjective Welfare" (Case 6). The Theory (Capabilities) sides with Case 1. To keep the theory consistent, the user must drop the Case 6 intuition that "thriving impaired need nothing." They need resources to *maintain* that thriving against the impairment.

  3.  **Evaluate "Standing as Equals" (Relational Equality):**
      *   *Concept:* Elizabeth Anderson, Samuel Scheffler. Equality is about social relations, not distribution. No hierarchy, no domination.
      *   *Aunt Case:* Relational equality asks: Is she excluded? Is she treated as inferior? If her low expectations keep her out of social participation, yes, intervene. If she's fully included, maybe not. It saves the intuition that we shouldn't penalize her, but frames it as "ensuring she isn't marginalized."
      *   *Election Case:* This is the stronghold of Relational Equality. Buying an election creates domination/hierarchy. Material equality doesn't matter if political standing is unequal. This explains why Case 5 bugs the user more than Case 4.
      *   *Does it save them?* Yes, it explains Case 5 better than Capabilities. It handles Case 3 (Aunt) by focusing on social inclusion rather than just "range of choice."

  4.  **Analyze the New Case (Cheerful vs. Gloomy Temperament):**
      *   *Setup:* Identical resources, identical capabilities. Internal temperament difference.
      *   *User's Theory (Capabilities):* Capabilities are about *opportunity*, not internal emotional states. Temperament is unchosen (luck), but it doesn't restrict the *range of lives* available, only the *experience* of them.
      *   *Prediction:* No redistribution. We equalize opportunity, not happiness. To equalize happiness would require punishing the cheerful or rewarding the gloomy, which violates responsibility/neutrality.
      *   *Relational Equality:* Are they standing as equals? Yes. One isn't dominating the other. No intervention needed.

  5.  **Synthesize and Structure the Response:**
      *   **Acknowledge and Validate:** The user has intuitively stumbled upon the major debates in political philosophy (Resourcism vs. Capabilities vs. Relational Equality).
      *   **Diagnose the Theory:** Identify it as the **Capabilities Approach** (Sen/Nussbaum).
