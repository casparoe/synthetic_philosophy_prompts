answer: |-
  The methodological practice you describe is the hallmark of the "credibility revolution" in development economics and political economy, specifically the reliance on Instrumental Variables (IV) and Natural Experiments to identify the causal effect of institutions on economic performance. To answer your questions, we must reconstruct the implicit ontology and epistemology that make this practice intelligible to its practitioners, and then stress-test those commitments against the philosophical alternatives you propose.

  ### I. Reconstruction of the Implicit Theory

  The practice rests on a **Structural-Counterfactual Theory of Causation** with a **Reified Ontology of Social Factors**.

  1.  **Causation as Invariance:** Causation is defined not by the transmission of energy or a detailed process, but by the stability of a relationship under exogenous perturbation. If an external shock ($Z$) shifts Institutions ($X$) and Prosperity ($Y$) moves predictably, $X$ causes $Y$. The "cause" is the coefficient $\beta$ in the structural equation $Y = \beta X + \epsilon$.
  2.  **Ontological Separability:** Institutions, Geography, and Culture are treated as distinct, separable variables. They can be mathematically orthogonalized. Institutions are treated as a distinct "treatment" that can be isolated from the cultural soil in which it is planted.
  3.  **History as a Stochastic Generator:** The single historical record is treated as a realized draw from a "super-population" of possible histories. The variation found in history (e.g., where missionaries landed) is treated as random noise generated by a process that is independent of the potential outcomes of prosperity.
  4.  **Policy as Transport:** The causal estimate derived from a specific historical context (e.g., colonial Africa) is assumed to be transportable to a modern policy context (e.g., contemporary aid programs). This implies the structural parameter $\beta$ is invariant across time and space, even if the practitioners do not explicitly test for this invariance.

  ### II. Analysis of Commitments

  Here we distinguish what the practice *needs* to function, what it merely *fits* with, where it is *underdetermined*, and what would change under a *mechanistic* shift.

  #### 1. Regularity vs. Mechanistic Views of Causation
  **Does it require a regularity/covering-law view?**
  The practice is **incoherent** if it adopts the strict mechanistic view you describe ("estimates need not travel at all"), yet it **operates** as if it does not need universal laws.

  *   **The Tension:** The text notes practitioners "rarely ask whether the estimated relation would hold in a different region." This suggests a local, mechanistic tolerance. However, "Policy then follows." Policy is inherently generalizing; it assumes that building institutions *today* will produce growth, based on evidence from *yesterday*.
  *   **The Commitment:** The practice genuinely **needs** a view of **Local Invariance** (a subset of Interventionism). It does not need a universal Covering Law (Hempel), but it cannot accept a purely singular Mechanistic view (where causation is unique to the specific gears of that specific case). It requires that the *functional relationship* between institutions and growth be stable enough to survive the transition from historical observation to policy intervention.
  *   **Underdetermination:** The statistical practice is underdetermined between a **Humean Regularity** view (constant conjunction) and a **Manipulability** view (interventionist). Both license the use of IVs. A Humean sees the instrument as securing a correlation that is not spurious; an Interventionist sees the instrument as a proxy for a manipulation. The math is identical; the metaphysics differs.

  #### 2. Institutions: Manipulable Kind vs. Heterogeneous Bundle
  **Does instrumenting institutions presuppose they are one manipulable kind of thing?**
  **Yes, this is a necessary commitment.**

  *   **The Reification:** To use "legal origin" or "settler mortality" as an instrument for "institutions," one must assume that "institutions" function as a unified causal force. If institutions were a heterogeneous bundle (e.g., property rights, judicial independence, bureaucratic quality) with different causal powers, an instrument that shifts one part of the bundle (e.g., legal origin) might not shift the specific part required for growth (e.g., actual enforcement).
  *   **The Necessity:** The practice **needs** to treat institutions as a **Kind**. If they are merely a bundle, the "exclusion restriction" (the assumption that the instrument affects prosperity *only* through institutions) becomes indefensible, because the instrument might affect one part of the bundle while policy targets another. The practice presupposes functional equivalence between the historical variation in institutions and the prospective policy variation.

  #### 3. The View of Culture as Residual
  **What view of culture is built into the habit of using culture as the residual?**
  This presupposes an **Additive and Orthogonal View of Culture.**

  *   **The Assumption:** By treating culture as the error term ($\epsilon$) or a fixed effect that is absorbed, the practice assumes culture does not *interact* with institutions. It assumes $Y = \beta I + \gamma G + \text{Culture} + \text{Noise}$.
  *   **The Implication:** This rules out the possibility that institutions only work *because* of a specific cultural context (interaction effects), or that culture is endogenous to institutions. It treats culture as a static background condition or noise, rather than a dynamic causal process. This is not merely a fit; it is a **methodological necessity** for the identification strategy. If culture interacts with institutions, the causal effect of institutions is not a single number $\beta$, but a function $\beta(C)$, which destroys the generalizability required for the policy recommendations.

  #### 4. Counterfactuals in Singular History
  **Does it assume the record is a sample from a population of possible histories?**
  **Yes, this is the foundational statistical commitment.**

  *   **The Super-Population:** Frequentist inference requires a distribution. Since there is only one history, practitioners must implicitly model history as a draw from a stochastic process. They assume that "settler mortality" could have been different, and that the *process* generating mortality is independent of the *process* generating prosperity (except through institutions).
  *   **Local Contrasts:** If history were merely a collection of local contrasts (a purely narrative view), statistical inference (p-values, confidence intervals) would be meaningless. The practice **needs** the "sample from a population" view to justify its claims to scientific rigor.

  ### III. Needs vs. Fits vs. Underdetermination

  | Commitment | Status | Explanation |
  | :--- | :--- | :--- |
  | **Exogeneity of Variation** | **Genuinely Needed** | Without plausible exogeneity, the causal claim collapses. This is the "exacting" part of the practice. |
  | **Institutions as a Unified Kind** | **Genuinely Needed** | Required to justify the exclusion restriction and the policy transfer. |
  | **Culture as Additive/Residual** | **Genuinely Needed** | Required to isolate the institution coefficient. Interaction effects would invalidate the simple linear model. |
  | **Universal Regularity (Covering Law)** | **Merely Fits** | Practitioners claim causality without proving universal laws. They rely on local identification, assuming policy transportability without testing it. |
  | **Mechanistic Explanation** | **Merely Fits (Negatively)** | The practice is *permissive* of missing mechanisms. It does not *need* mechanism to claim causation, which distinguishes it from true mechanistic philosophy. |
  | **Metaphysics of Cause (Power vs. Regularity)** | **Underdetermined** | The IV methodology works whether you believe causes are "powers" or "regularities." The math agnostically secures counterfactual dependence. |

  ### IV. What Would Change if the View Were Mechanistic?

  If the practice were to genuinely replace its implicit Structural-Counterfactual view with a **Mechanistic View** (where causation is a stable process operating in a particular setting), the **practice itself** would have to change radically, not just the descriptions.

  1.  **From Identification to Process Tracing:**
      *   *Current Practice:* Stop once the Instrument is validated and the coefficient is significant.
      *   *Mechanistic Practice:* The coefficient would be insufficient. Researchers would be required to open the "black box" between Institutions and Growth. They would need to trace *how* a property right leads to investment in the specific case. An IV estimate without a verified mechanism would be considered incomplete, not "causal."

  2.  **From Transportability to Contextual Design:**
      *   *Current Practice:* "Institutions cause growth, so build institutions." (Assumes $\beta$ is stable).
      *   *Mechanistic Practice:* Since mechanisms are sensitive to initial conditions, policy would shift from "institution-building" (importing a form) to "mechanism-design" (engineering the local process). Practitioners would have to demonstrate that the *mechanism* identified in the historical episode exists in the target policy environment. If the mechanism relies on a specific cultural norm absent in the target, the policy would be rejected, even if the historical $\beta$ was strong.

  3.  **From Culture as Residual to Culture as Component:**
      *   *Current Practice:* Control for culture or leave it in the error term.
      *   *Mechanistic Practice:* Culture would have to be modeled as part of the mechanism (e.g., norms that enforce contracts). It could not be a residual. This would make identification much harder, as culture is rarely exogenous, potentially halting the current research program until new methods for endogenous cultural processes were developed.

  4.  **From Super-Population to Singular Causal Explanation:**
      *   *Current Practice:* Use p-values and confidence intervals based on the assumption of repeated sampling from a history-generating process.
      *   *Mechanistic Practice:* Inference would shift towards Bayesian process tracing or comparative case studies. The focus would be on the *propensity* of the specific system to produce an outcome, rather than the average treatment effect across a hypothetical population of countries.

  ### Summary
  The practice presupposes that **causal structure is stable enough to be manipulated, even if the mechanism is unknown.** It genuinely needs **exogeneity** and the **reification of institutions** to function. It is underdetermined regarding the **metaphysical nature of causation** (regularity vs. power), but it is incompatible with a **strictly local mechanistic view** because its policy recommendations require transportability. To become truly mechanistic, the field would have to abandon the comfort of the "black box" coefficient and engage in the difficult work of verifying that the causal gears turning in the past are present and functional in the future.
