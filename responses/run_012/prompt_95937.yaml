      *   Counterpart Theory (too technical, eats time).
      *   Species Essentialism (different category).
      *   Artifacts (already decided to focus on humans for engagement, though I need to address why I'm not using the Table analogy deeply).
      *   *Actually, looking back at Step 2:* I decided on the Human Case as the carrying example. So I should refuse *Artifacts* as the main focus.
      *   *Wait, standard practice:* Usually, Kripke uses the Table to *explain* the Human case.
      *   *Decision:* Refuse **Counterpart Theory** (too much machinery) and **Species Essentialism** (different scope). Acknowledge Artifacts but say we are testing the limit on *persons*.

  8.  **Step 6: Sequencing Logic (The "Why Not Earlier" constraint):**

      *   *De Re Necessity:* Must come before the Intuition Pump. If you pump the intuition first, they think it's a causal claim.
