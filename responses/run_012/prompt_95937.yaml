      *   *Closing:* 5 mins. Exit Question.

      *   *Critique:* 90 mins is tight. Need to be ruthless.
      *   *Refining the Carrying Example:* I need to argue *for* the Gamete case over Artifacts.
      *   *Argument:* Artifacts hide the biological contingency biology students care about. If you use a table, biology students check out. If you use a human, phil students check out (too messy).
      *   *Solution:* Use the **Human Case** but treat it **like an Artifact** (structurally).
      *   *Wait, the prompt asks me to argue for my choice against alternatives.* I will argue for the **Human Gamete Case** (specifically a third party, e.g., "Person X") over the Artifact.
