answer: |-
  Here is a 90-minute session plan designed to isolate the modal claim from causal and metaphysical baggage, tailored to your specific room composition.

  ### 1. The Sequence of Components
  *Total Time: 90 Minutes*

  **0:00–0:10 | Setup: Rigid Designation & Transworld Talk**
  *   **Activity:** Quick fire refresh on rigid designation. "When we say 'Aristotle', do we mean 'whoever taught Alexander' or 'that guy'?"
  *   **Why Here:** You cannot discuss *origin* without fixing *reference*. If they think "You" refers to a cluster of properties (tall, TA, likes coffee), they will think a different sperm could produce "You" if it produces those properties. They must accept "You" picks out an individual across worlds before you ask what properties that individual must have.

  **0:10–0:30 | The Hinge: Metaphysical vs. Causal Necessity**
  *   **Activity:** Explicitly distinguish "Laws of Nature" from "Metaphysical Truths." Use a non-biological example first (e.g., "Water is H2O" vs. "Water boils at 100C").
  *   **Why Here (Crucial):** This is where your previous session failed. You must nail this down *before* the intuition pump. If you introduce the sperm/egg case first, biology students will interpret "could not have been otherwise" as "biologically impossible given causal laws." You need them to understand you are asking: *Even if biology allowed it, would it be you?*
  *   **Instruction:** Write on the board: **"Could not have been otherwise (Causal)"** vs. **"Could not have been otherwise (Metaphysical)."** Tell them: "For the next hour, assume the laws of physics are suspended. We are asking about identity, not biology."

  **0:30–0:50 | The Carrying Example: The "Third-Party Human" Case**
  *   **Activity:** Introduce Origin Essentialism using a specific, named third party (e.g., "Consider Marie Curie"). Do not start with "Consider You."
  *   **Why This Example (Argued below):** I argue for the **Human Gamete Case** over the Artifact Analogue (Table/Ship).
      *   *Against Artifacts:* Artifacts import "assembly" assumptions. A table is made *of* wood; a person is not made *of* a zygote (the zygote divides and ceases to exist). Biology students will fixate on the disanalogy of growth vs. construction.
      *   *Against Holding it Back:* If you delay the human case, biology students disengage. They signed up for "cloning/origins," not "modal logic puzzles about tables."
      *   *Why Third-Party:* Using "You" immediately triggers the "Soul/Determinism" defense mechanism. Using "Marie Curie" objectifies the case enough to treat it philosophically while keeping the biological stakes high enough for the science students.
  *   **The Claim:** "Necessarily, if Marie Curie exists, she originated from *this* specific sperm and *this* specific egg."

  **0:50–1:05 | The Transworld Identification Worry**
  *   **Activity:** Now raise the worry: "How do we know it's Marie Curie in the other world?"
  *   **Why Here:** You cannot raise this *before* the claim (0:30) or they will use it to dismiss the thesis entirely ("We can't track identity, so the question is meaningless"). You raise it *after* they grasp the claim, to test its robustness.
  *   **Instruction:** "Grant for the sake of argument that we *can* track her. Does the origin hold?" This brackets the epistemic worry to focus on the metaphysical one.

  **1:05–1:25 | The Anchor: Mitochondrial Replacement Therapy**
  *   **Activity:** Introduce the "Three-Parent Baby" procedure. Nuclear DNA from parents, mitochondrial DNA from donor egg.
  *   **Why This Anchor (Argued below):** I select **Mitochondrial Replacement** over Cloning or Twinning.
      *   *Against Cloning:* Cloning changes the *mode* of origin (somatic vs. gametic). It risks turning the session into a debate about "natural vs. artificial," which is ethical, not metaphysical.
      *   *Against Twinning:* Twinning (one zygote splitting into two people) arguably *refutes* Zygote Essentialism (same origin, two people). It trivializes the thesis by showing the origin unit is too coarse.
      *   *For Mitochondrial:* It keeps the gamete framework but forces precision. Is the "Egg" the nucleus or the cytoplasm? It tests whether the thesis is about *genetic material* or *historical gamete identity*. It illustrates the thesis without refuting it, demanding a refinement of the definition.
  *   **Instruction:** Ask: "If the nucleus is the parents' but the egg cytoplasm is the donor's, is the origin the same? If yes, essentialism is about DNA. If no, it's about the physical gamete."

  **1:25–1:30 | Closing & Exit Question**
  *   **Activity:** Recap and pose the closing question.

  ---

  ### 2. The Misconception Map
  *In the order this room will form them.*

  **1. The Determinism Confusion (Expected: 0:20)**
  *   **The Thought:** "If the universe is deterministic, the same parents *must* produce the same child, so the claim is just physics."
  *   **When to Head Off:** During **The Hinge (0:10–0:30)**.
  *   **What to Say:** "Determinism says given State A, State B *must* follow. Origin Essentialism says given Person P, Origin O *must* have existed. One is about prediction (causal), the other is about identity (metaphysical). Even in an indeterministic universe where different sperm *could* have fertilized the egg, Origin Essentialism says if *you* existed, it wouldn't have been that other sperm."

  **2. The Empirical/Genome Confusion (Expected: 0:40)**
  *   **The Thought:** "This is just saying DNA makes you who you are."
  *   **When to Head Off:** During **The Carrying Example (0:30–0:50)**.
  *   **What to Say:** "DNA is matter. Matter turns over. You have almost none of the matter you had at conception. The claim isn't about the *stuff* you are made of now, but the *historical path* you took to exist. It is a claim about history, not chemistry."

  **3. The Soul/Spirit Confusion (Expected: 0:45)**
  *   **The Thought:** "You're implying there's a 'spark' that attaches to this sperm."
  *   **When to Head Off:** During **The Carrying Example (0:30–0:50)**. Pre-emptively.
  *   **What to Say:** "I am not making a claim about minds, souls, or consciousness. I am making a claim about *reference*. When we point to a person and say 'That one,' does that pointing depend on their origin? You can be a materialist and accept this. It's about labeling, not ghosts."

  **4. The "That Would Be Someone Else" Objection (Expected: 1:00)**
  *   **The Thought:** "If a different sperm fertilized the egg, obviously that's a different person. That's not a deep truth, that's a tautology."
  *   **Treatment:** **Do not treat this as a misconception.** This is the **Real Objection** (The Haecceity/Qualitative Identity rival).
  *   **When to Address:** During **The Anchor (1:05–1:25)**.
  *   **What to Say:** "This is the strongest counter-argument. Some philosophers say identity is just about psychological continuity or qualitative similarity. If you think 'You' is just a bundle of traits, then yes, a different sperm could make 'You.' Origin Essentialism denies that. It says 'You' are essentially tied to this specific historical event, not just the traits that result. We are debating whether *history* is essential to *identity*."

  ---

  ### 3. The Anchor: Mitochondrial Replacement
  *Why this carries the weight.*

  You need an anchor that is not in the readings but illuminates the thesis without breaking it.
  *   **Cloning** is risky because it invites "Is a clone the same person?" which confuses *origin* with *genetic identity*.
  *   **Twinning** is dangerous because it suggests one origin (zygote) yields two people. If you use this, you have to spend 20 minutes explaining why the zygote isn't the origin unit, which distracts from the main thesis.
  *   **Mitochondrial Replacement** is the winner. It preserves the "Sperm + Egg" structure but complicates the "Egg."
  *   **What it does to the thesis:** It forces the students to refine the essential property. Is it the *nuclear DNA*? The *cytoplasm*? The *physical token of the gamete*?
  *   **Instruction:** "If Origin Essentialism is true, does the mitochondrial donor count as a parent? If the thesis is 'Origin = Nuclear DNA,' then no. If the thesis is 'Origin = The specific biological token of the egg,' then yes. This shows us that Origin Essentialism isn't just 'parents matter,' it's 'which part of the process matters.'"

  ---

  ### 4. What to Refuse to Cover
  *You cannot do everything. Explicitly bracketing topics protects the session.*

  **1. Counterpart Theory**
  *   **Why:** It solves transworld identification but requires 40 minutes of setup (Lewis, similarity metrics, etc.).
  *   **What to Say:** "There is a sophisticated theory called Counterpart Theory that handles how we identify people across worlds. We don't have time for it. Today, we are assuming a simpler model of transworld identity to test the *origin* claim, not the *identity* mechanism."

  **2. Species Essentialism**
  *   **Why:** It conflates kind-membership with individual identity.
  *   **What to Say:** "We are talking about *you* as an individual, not 'humans' as a species. Whether humans essentially have DNA is a different question from whether *you* essentially came from *this* sperm."

  **3. Artifact Analogues (beyond the initial mention)**
  *   **Why:** As argued above, they import construction assumptions that biology students will fight.
  *   **What to Say:** "Kripke uses tables to explain this. We are going to skip the table and go straight to persons. The biology is messier, but the stakes are higher, and the logic is the same."

  ---

  ### 5. The Closing Question
  *To separate grasp from memorization.*

  **The Question:**
  > "Suppose we discover a law of nature such that, given *these* two parents, *only* this specific sperm and egg combination could possibly result in a viable pregnancy. Does that discovery **prove** Origin Essentialism?"

  **The Answer Key:**
  *   **Memorized Conclusion:** "Yes, because it shows you couldn't have come from anything else." (Confuses Causal with Metaphysical).
  *   **Grasped Modal Claim:** "No. That proves causal necessity (determinism). Origin Essentialism claims that *even if* other sperm were biologically possible, *you* would not exist if they had been used. The law of nature describes what *happens*; Origin Essentialism describes what *you are*."

  ### Summary of TA Strategy
  1.  **Front-load the Modality:** If you don't distinguish causal vs. metaphysical necessity in the first 20 minutes, the biology students will hijack the session with determinism.
  2.  **Objectify the Subject:** Use "Marie Curie," not "You," to prevent soul-talk.
  3.  **Validate the Real Objection:** Treat "That's someone else" as a rival philosophical theory, not a student error.
  4.  **Use the Anchor to Refine, Not Refute:** Mitochondrial replacement sharpens the definition of "origin" without collapsing the argument into a debate on when life begins.
