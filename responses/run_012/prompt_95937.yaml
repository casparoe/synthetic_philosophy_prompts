          3.  **The Intuition Pump (Carrying Example):** Now apply the modal distinction to the case.
          4.  **Transworld Identification Worry:** Only raise this *after* they accept there's a claim to worry about. If raised too early, it kills the discussion before it starts ("How do we know it's me?").
