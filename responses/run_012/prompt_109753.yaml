answer: |-
  ### Preliminary Philosophical Analysis

  Before drafting the proposal, we must rigorously stress-test your intuition against the existing landscape. The "Paradox of Deontology" (famously articulated by Scheffler and Nagel) arises because deontology forbids an act (e.g., killing one) even when that act would minimize the total occurrences of that same type of act (e.g., preventing five killings). If the point of the constraint is to minimize killings, the constraint is self-defeating.

  Your engineering analogy suggests this is a category error: in constrained optimization, a constraint ($g(x) \leq 0$) defines the *feasible set*, while the objective function ($f(x)$) ranks the members of that set. A constraint does not compete with the objective; it precedes it. If deontological constraints are feasibility conditions on moral agency rather than terms in a global "goodness" function, the paradox dissolves. You aren't failing to minimize violations; you are operating outside the feasible set of moral action.

  **Where the standard replies stand:**
  1.  **Side-Constraints (Nozick):** This is the closest existing view. Nozick argues rights are constraints on action, not goals. Your analogy adds formal precision here: it treats morality as a distributed optimization problem where each agent has their own feasible set, rather than a central planner minimizing global violations.
  2.  **Agent-Relative Value (Nagel/Scheffler):** This view argues the objective function itself differs per agent (I have special reason to avoid *my* killing). Your analogy absorbs this: the "cost" of *my* violation is infinite (infeasible), whereas the cost of *your* violation is merely a variable in the world state.
  3.  **Constitutive Rules:** Morality is like a game; you cannot win by breaking the rules. This aligns with your "rules of the activity" intuition.

  **The Critical Vulnerability:**
  You rightly suspect the distinction regarding "counting." A pure engineering constraint does not care if violating it once saves a thousand other constraints from violating. If I blow up a vessel to save a thousand others, the engineering constraint is still violated. But deontology often *does* care about numbers (e.g., Threshold Deontology). If constraints can be overridden when the stakes are high enough, they behave less like hard feasibility limits and more like very heavy weights in the objective function.

  Furthermore, the deepest philosophical objection is that optimization models presuppose a "maximizing" structure of rationality. If deontology is fundamentally non-maximizing (about respect, not outcomes), modeling it as *any* kind of optimization (even constrained) might concede too much to consequentialism. However, for the purpose of a fellowship proposal, this tension is a feature, not a bug. It gives you a clear criterion for success: determining whether the optimization framework illuminates the structure or distorts the normativity.

  ***

  ### Fellowship Proposal

  **Project Title:** Feasible Sets and Forbidden Acts: A Structural Dissolution of the Paradox of Deontology

  **Research Question**
  Is the Paradox of Deontology a substantive moral puzzle regarding the value of agency, or is it a category error resulting from modeling moral deliberation as a single-agent consequentialist optimization problem rather than a multi-agent constrained feasibility problem?

  **Statement of the Problem**
  The Paradox of Deontology notes that agent-centered constraints forbid an act (e.g., killing one) even when that act would minimize the total number of such acts performed (e.g., preventing five killings). If the rationale for the constraint is to minimize violations of that constraint, the theory appears self-defeating. Standard responses treat this as a substantive clash of values: agent-relative reasons must be weighed against agent-neutral outcomes.

  However, this framing assumes moral deliberation functions like a consequentialist objective function where all values are commensurable terms in a score. Drawing on background in process design and constrained optimization, I propose that deontological constraints function not as terms in an objective function, but as definitions of the feasible set of moral action. In engineering design, a pressure limit does not compete with cost minimization; it removes infeasible designs from consideration. If moral constraints operate similarly, the "paradox" arises only if one mistakenly attempts to minimize constraint violations globally rather than satisfying constraints locally. This project investigates whether recasting deontology through this structural analogy dissolves the paradox or merely relocates it into a question of why the feasible set is defined as it is.

  **Current Landscape and Gap**
  Existing literature addresses this via side-constraints (Nozick), agent-relative value (Nagel, Scheffler), or constitutive rules. While these positions acknowledge the structural difference between constraints and goals, they typically proceed to argue for the *justification* of that structure (e.g., why agents have special standing). They leave open the prior logical question: does the paradox persist if we rigorously separate the *logic of constraint* from the *logic of optimization*?

  Most discussions assume that if a constraint leads to more violations globally, it requires a special defense (e.g., the inviolability of persons). My project argues that this demand for defense presupposes the consequentialist metric is the default. By formalizing the distinction between "infeasible action" and "sub-optimal outcome," I aim to show that the paradox relies on an ill-formed objective function. The gap in the literature is a rigorous decision-theoretic analysis that treats the constraint/objective distinction as a logical prior to the substantive ethical debate.

  **Methodology and Timeline**
  The project will proceed over one semester (4 months), moving from formal modeling to case application and final synthesis.

  *   **Month 1: Formalization.** I will reconstruct the Paradox of Deontology using standard decision-theoretic notation, explicitly distinguishing between single-agent global optimization and multi-agent constrained feasibility. I will map standard deontological cases (Trolley, Transplant) onto this framework to identify where the "paradox" emerges as a mathematical inconsistency versus a moral intuition.
  *   **Month 2: Stress-Testing the Analogy.** I will test the limits of the engineering analogy against "Threshold Deontology." If constraints can be overridden by sufficiently bad outcomes, do they remain feasibility constraints or do they become weighted objectives? I will draft a section analyzing whether the "feasible set" model can accommodate thresholds without collapsing back into the paradox.
  *   **Month 3: Drafting and Evaluation.** I will write the core argument. Crucially, I will establish criteria to determine if the paradox is *dissolved* or *redescribed*. Success is not merely showing the analogy holds, but showing that accepting the analogy removes the intuitive "cost" of deontology. If the "cost" remains (i.e., if we still feel the world is worse), the project will argue the paradox is not about logic but about the acceptance of agent-relative limits.
  *   **Month 4: Revision and Deliverable.** Finalizing the paper for submission to a peer-reviewed journal in ethics or decision theory (e.g., *Ethics*, *Philosophy and Public Affairs*, or *Synthese*).

  **Deliverable**
  The primary deliverable is a complete, submission-ready manuscript (8,000–10,000 words) titled "Feasible Sets and Forbidden Acts." Unlike a survey paper, this manuscript will offer a determinate argument: either that the optimization analogy resolves the logical tension of the paradox, or that it isolates the residual tension to a specific, defensible claim about the nature of moral agency.

  **Scope and Limitations**
  This project is strictly limited to the *structure* of deontological reasoning, not the *justification* of specific constraints. I will not argue which constraints are correct (e.g., why killing is forbidden), only how they function logically within a theory. A project attempting to justify the constraints themselves would exceed the semester scope. Similarly, I will not attempt a full history of the paradox; I will focus on the decision-theoretic structure present in contemporary discussions. If the analysis reveals that the "feasible set" model requires a complex theory of thresholding, that sub-topic will be noted as a avenue for future research rather than fully resolved here. The goal is to clarify the logical space, not to settle the substantive moral debate.

  ***

  ### The Strongest Objection (For Your Preparation)

  **The Category Mistake Objection:**
  A referee is likely to argue that your engineering analogy presupposes a model of **instrumental rationality** that deontology explicitly rejects. In optimization, constraints serve an objective (e.g., safety constraints serve the objective of a working plant). If you ask, "What is the objective of the moral constraints?" and the answer is "To define moral agency," you have not escaped the paradox; you have merely pushed it back.

  The critic will argue: "In engineering, if a constraint makes the design impossible or vastly inefficient, we revise the constraint. In morality, if a constraint makes the world vastly worse (more deaths), the deontologist says we keep the constraint. Therefore, the constraint *is* competing with the good of the world, regardless of your formalism. Calling it a 'feasibility constraint' is just a semantic shield. The paradox isn't about math; it's about why we privilege the purity of the agent's hands over the welfare of the victims. Your model explains the *syntax* of deontology but ignores the *semantics* of why we accept such costly syntax."

  **Preparation:** Be ready to concede that your project addresses the *logical coherence* of the theory, not the *moral cost*. Your defense is that showing the logic is coherent removes the charge of *irrationality*, even if the moral cost remains.
