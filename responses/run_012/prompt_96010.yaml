prompt: |-
  Been lurking on LW and the rat blogosphere for about a decade, first time actually posting something. I keep noticing a pattern and I don't have a word for it.

  Setup: two people have to split something and neither can just take it. What they very often land on is the split where each side ends up the same *fraction of the way* from their own fallback ("what I get if this whole thing falls apart") to their own best case ("what I'd get if the other side just rolled over and gave me everything"). Not the same amount of money, not the same cut of the pie -- the same fraction of their own personal range. Like, "we each walked away with 60% of what we could've hoped for, measured from the walk-away point."

  Where I see it: salary talks that land at the number where each side gave up the same share of what it asked for; two roommates dividing something when one cares about quiet and the other cares about having people over, so there's no "equal dollars" answer and they do the fraction thing instead; a mediator who keeps saying "we need a deal where you've both conceded equally."

  Two things bug me about it. First, when the upper end of the range is whatever number somebody actually said out loud, the rule pays you to open with an absurd ask -- your range gets wider, so equal-fraction-of-your-own-range hands you more -- and yet everyone still treats the result as fair and nobody calls out the person who inflated. Second, it collides with the other fairness norm I see constantly, "we each end up the same amount better off than if we'd walked," and people seem to quietly reach for whichever of the two happens to give them more.

  Is there a name for the first one? I don't just want the label. I want to know what the nearest named things are, how this differs from each -- it's not just "split the difference," the midpoint doesn't care how wide either side's range is -- whether the opening-ask-inflation problem is a known objection to it, and if nothing in the literature actually matches what I described, coin me something and tell me where the edges are.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is familiar with LessWrong (LW) and the rationalist blogosphere ("rat blogosphere"). They value precision, game theory, and clear conceptual distinctions.
      *   **Observation:** They've noticed a specific bargaining pattern where parties split the *fraction of their respective ranges* (from BATNA/walk-away to ideal outcome) equally, rather than splitting the absolute surplus or the literal midpoint of demands.
      *   **Specific Features:**
          1.  Equal relative concession (each gives up the same % of their potential gain).
          2.  Sensitive to the stated "ideal" (opening ask), making it vulnerable to anchoring/inflation.
          3.  Distinct from "split the surplus" (equal absolute gain over BATNA).
          4.  Distinct from "split the difference" (midpoint of demands).
      *   **Questions:** Is there a name? How does it differ from nearest named concepts? Is the inflation vulnerability known? If no name exists, coin one and define boundaries.

  2.  **Initial Brainstorming & Concept Matching:**
      *   *Nash Bargaining Solution (NBS):* This is the big gun in cooperative game theory. It maximizes the product of utilities relative to the disagreement point. If utility is linear in money, NBS splits the *surplus* equally (equal absolute gain over BATNA). The user explicitly says their observation *collides* with "same amount better off than if we'd walked." So, it's *not* standard NBS with linear utility.
      *   *Kalai-Smorodinsky (KS) Solution:* This solution focuses on monotonicity and preserving the ratio of maximum possible gains. It aims for a point where the ratio of actual gain to maximum possible gain is equal for both parties. **Bingo.** This matches the user's description: "same fraction of the way from their own fallback to their own best case."
      *   *Equal Concession Principle:* This is a more informal negotiation term. It often refers to making equal moves from opening positions, but can be interpreted as equal relative concession.
      *   *Proportional Bargaining:* A general term, but KS is the specific axiomatic solution.
      *   *Anchoring/Anchoring Bias:* The user notes the vulnerability to inflated opening asks. In KS, the "ideal point" is crucial. If the ideal point is strategic (bluffing) rather than true utility max, the solution shifts. This is a known critique of KS.

  3.  **Deep Dive into Kalai-Smorodinsky (KS):**
      *   *Definition:* Given a disagreement point $d$ and a feasible set $S$, let $u_i^{max}$ be the maximum utility player $i$ can get in $S$. The KS solution selects the point on the Pareto frontier where $\frac{u_1 - d_1}{u_1^{max} - d_1} = \frac{u_2 - d_2}{u_2^{max} - d_2}$.
      *   *Match:* This is exactly "same fraction of their own personal range."
      *   *Vulnerability:* KS requires knowing the *true* ideal points ($u_i^{max}$). In real negotiation, these are often stated opening offers. If I claim my ideal is \$1M when it's really \$100k, my denominator grows, and to keep the fraction equal, I get more absolute value. This is the "opening-ask-inflation problem" the user identified.
      *   *Comparison to Nash:* Nash maximizes $(u_1 - d_1)(u_2 - d_2)$. With linear utility, this means $u_1 - d_1 = u_2 - d_2$ (equal surplus). KS means relative gains are equal.
      *   *Comparison to Split the Difference:* This is usually midpoint of *current offers*, not necessarily tied to BATNAs or true ideal points.

  4.  **Addressing the "Rat Blogosphere" Context:**
      *   The user is likely familiar with concepts like Schelling points, BATNA, Nash Equilibrium, etc.
      *   They want precision. I should acknowledge the KS solution but also discuss why it might feel distinct in practice (e.g., people using *stated* demands vs. *true* utility maxima).
      *   The "inflation problem" is essentially the difference between the axiomatic KS solution (which assumes known feasible sets) and the heuristic people use (which uses stated anchors).
      *   Is there a more colloquial name? "Equal Relative Concession" is descriptive. "Proportional Split" is vague.
      *   I need to check if there's a specific LW/rationalist term. "Shapley Value" comes to mind for fair division, but that's about marginal contributions. "Split the Surplus" is the common LW phrase for Nash/linear. The user is describing something distinct from that.

  5.  **Synthesizing the Answer:**
      *   **The Name:** The formal game-theoretic term is the **Kalai-Smorodinsky Bargaining Solution**.
      *   **The Mechanism:** Explain the math simply (ratio of gains).
      *   **The Distinction:** Contrast clearly with Nash Bargaining Solution (equal absolute surplus) and "Split the Difference" (midpoint of claims).
      *   **The Inflation Problem:** Confirm this is a known weakness. KS relies on the *ideal point* being a hard constraint (the utopia point). If the ideal point is a strategic anchor, the solution breaks. This is often discussed as the "utopia point" vulnerability.
      *   **The "Fairness Norm" Collision:** Explain that Nash = "Equal Gain over BATNA" and KS = "Equal Proportion of Potential Gain." People switch between them based on which benefits them (motivated cognition).
      *   **Coining a Term (if needed):** While KS is the technical term, in the wild, people might call it "Equal Relative Concession." But KS is the rigorous match. I should stick with KS but explain the heuristic version.
      *   **LW/Rat Context:** Mention that while Nash is often the default "rational" baseline in these circles, KS is the alternative when utility isn't transferable or comparable.

  6.  **Refining the "Inflation" Point:**
      *   In axiomatic bargaining, the "ideal point" is usually defined as the maximum utility achievable *within the feasible set*, not just a number someone says.
      *   However, in human negotiation, the "best case" is often the opening offer.
      *   So the user is observing a *heuristic approximation* of KS where the "ideal point" is set by the opening anchor.
      *   This makes it vulnerable to "bogus claims" about the feasible set.
      *   This is a crucial distinction to make. The *solution concept* is KS, but the *implementation* is flawed by strategic misrepresentation of the utopia point.

  7.  **Drafting the Response:**
      *   *Greeting:* Acknowledge the lurker status (welcome to the water).
      *   *Direct Answer:* It's the Kalai-Smorodinsky Solution.
      *   *Explanation:* Define it using the user's "fraction of range" language.
      *   *Comparison:*
          *   vs. Nash (Equal Surplus): The user's second bug ("same amount better off").
          *   vs. Split the Difference: Midpoint of claims, ignores BATNA.
      *   *The Inflation Bug:* Discuss the "Utopia Point" vulnerability. In theory, it's the max feasible. In practice, it's the max demand. This is the exploit.
      *   *Why people use it:* It feels fair when utilities aren't linear or comparable (e.g., quiet vs. guests).
      *   *Conclusion:* You found KS. The inflation issue is the gap between axiomatic theory and heuristic practice.

  8.  **Self-Correction/Review:**
      *   Did I answer all parts? Name (Yes), Nearest named things (Nash, Split Difference), Differences (Yes), Inflation objection (Yes), Edges (Yes).
      *   Is the tone appropriate? Analytical, precise, respectful of their background.
      *   Wait, is there a simpler term? "Equal Relative Concession" is used in negotiation literature (e.g., by Pruitt). I should mention that as the colloquial equivalent.
      *   Make sure to emphasize that KS assumes the "best case" is *feasible*, whereas in the user's examples, the "best case" is often a bluff. This is the key insight.

  9.  **Final Polish:** Ensure the distinction between *feasible ideal* (KS) and *stated ideal* (User's observation) is clear. This explains the inflation vulnerability perfectly. In formal KS, you can't just claim a higher ideal if it's not feasible. In human haggling, you can.

      *(Self-Correction during drafting)*: I should verify if "Equal Relative Concession" is a standard term. Yes, in negotiation analysis, "equal relative concession" is a specific principle often contrasted with "equal absolute concession." I will mention both the formal game theory name (KS) and the negotiation heuristic name.

      Let's structure the answer:
      1.  The Name (Kalai-Smorodinsky).
