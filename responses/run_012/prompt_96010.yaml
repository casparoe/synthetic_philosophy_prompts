answer: |-
  Welcome to the water. It's a sharp observation, and you have correctly identified a specific solution concept from cooperative game theory that often gets conflated with more common heuristics in the wild.

  The formal name for what you are describing is the **Kalai-Smorodinsky Bargaining Solution (KSBS)**.

  Here is the breakdown of how it matches your description, how it differs from the nearest neighbors, and why the inflation vulnerability you spotted is a known (and critical) feature of its application outside of strict mathematical models.

  ### 1. The Name and The Mechanism
  **Kalai-Smorodinsky (1975)** was proposed as an alternative to the Nash Bargaining Solution.
  *   **Your Description:** "Same fraction of the way from their own fallback to their own best case."
  *   **The Math:** Let $d$ be the disagreement point (BATNA/walk-away) and $u^{max}$ be the ideal point (best possible outcome). The solution finds an agreement $x$ such that:
      $$ \frac{x_1 - d_1}{u^{max}_1 - d_1} = \frac{x_2 - d_2}{u^{max}_2 - d_2} $$
      This ratio is exactly the "fraction of the personal range" you noticed.

  In negotiation literature (less formal than game theory), this is sometimes called the **Equal Relative Concession** principle. It argues that fairness is measured by how much of your *potential gain* you had to give up, not how much absolute value you gained.

  ### 2. The Nearest Named Things (and how they differ)

  You mentioned two other norms that collide with this one. Here is the precise taxonomy:

  **A. The Nash Bargaining Solution (NBS)**
  *   **The Norm:** "We each end up the same amount better off than if we'd walked." (Equal Surplus)
  *   **The Math:** Maximizes the product of gains: $(x_1 - d_1)(x_2 - d_2)$. With linear utility, this results in $x_1 - d_1 = x_2 - d_2$.
  *   **The Difference:** NBS cares about the *absolute* size of the slice above the BATNA. KSBS cares about the *percentage* of the available range.
  *   **When they diverge:** If Player A has a huge range (low BATNA, high ideal) and Player B has a tiny range (high BATNA, low ideal), NBS gives them equal *dollars* of surplus. KSBS gives them equal *satisfaction* relative to their potential.
  *   **Why people switch:** As you noted, parties quietly reach for whichever norm yields them more absolute value. This is **motivated selection of fairness norms**.

  **B. "Split the Difference" (Midpoint)**
  *   **The Norm:** Meet halfway between the two current offers.
  *   **The Difference:** This ignores the BATNA entirely. It only looks at the current anchor points.
  *   **The Edge Case:** If both parties have the same BATNA, "Split the Difference" on opening offers is often a rough heuristic for KSBS, *provided* the opening offers represent the true "best case."

  ### 3. The Inflation Problem (The "Utopia Point" Vulnerability)

  You identified the critical flaw: *"the rule pays you to open with an absurd ask... your range gets wider, so equal-fraction-of-your-own-range hands you more."*

  In the formal Kalai-Smorodinsky model, the "ideal point" ($u^{max}$) is not just what you ask for; it is the **maximum feasible utility** you could possibly get if the other person gave you everything *and* it was physically/contractually possible. It is a hard constraint of the environment.

  However, in human negotiation (the "rat blogosphere" context), the "ideal point" is rarely a hard physical constraint. It is a **stated preference**.
  *   **The Exploit:** If I claim my ideal is \$1M (when I'd actually be thrilled with \$500k), I artificially inflate my denominator. To maintain equal relative concession, you must concede more absolute value to me.
  *   **The Literature:** This is known as the **sensitivity to the utopia point**. Critics of KSBS point out that unlike the Nash solution (which relies only on the feasible set's Pareto frontier), KSBS relies on the specific coordinates of the "utopia" point. If that point is strategic noise rather than a physical limit, the solution becomes manipulable.

  This is why sophisticated mediators often try to shift the conversation from "Equal Relative Concession" (KS) to "Equal Surplus" (Nash). It is harder to lie about your BATNA (walk-away point) than it is to lie about your Dream Outcome.

  ### 4. Why It Persists (The Schelling Point)

  If it's vulnerable to inflation, why do people use it?
  1.  **Incommensurable Utilities:** In your roommate example (quiet vs. guests), there is no common currency (dollars) to measure "equal surplus." You can't easily say "one hour of quiet = \$50." But you *can* compare percentages of satisfaction. KSBS works better when utility functions are not directly transferable.
  2.  **Psychological Fairness:** "I gave up 50% of what I wanted, you gave up 50% of what you wanted" feels more emotionally resonant than "We both gained \$5,000 over our walk-away," especially when the stakes feel different to each party.
  3.  **Focal Point:** It provides a clear stopping rule. "We both conceded half" is a natural Schelling point for ending a conflict, even if the inputs were noisy.

  ### 5. Terminology Recommendation

  If you are writing about this in a context where "Kalai-Smorodinsky" feels too academic:

  *   **Formal:** Kalai-Smorodinsky Solution.
  *   **Descriptive:** Equal Relative Concession.
  *   **Colloquial/Pejorative:** The "Proportional Split" (vulnerable to anchor inflation).

  **The Edge Definition:**
  The boundary of this concept is defined by the **truthfulness of the Ideal Point**.
  *   If the "best case" is a hard physical limit (e.g., dividing a cake where "best case" is the whole cake), KSBS is robust and fair.
  *   If the "best case" is a strategic opening offer (e.g., salary negotiation), KSBS degrades into a reward for extreme anchoring.

  You haven't found a new phenomenon, but you have correctly isolated the heuristic application of Kalai-Smorodinsky and its primary failure mode in non-idealized environments. The collision you see between "Equal Surplus" (Nash) and "Equal Relative Gain" (KS) is the standard tension in bargaining theory between **utilitarian fairness** (total welfare) and **egalitarian fairness** (relative standing).

  **TL;DR:** It's the **Kalai-Smorodinsky Bargaining Solution**. The inflation bug is the **Utopia Point Sensitivity**. People switch between this and the **Nash Bargaining Solution** (Equal Surplus) based on which one favors their position.
