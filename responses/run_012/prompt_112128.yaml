      *   *Correction for the User:* I need to be precise. The split-brain data shows the *verbalizer* is cut off from the *experiencer/actor*. It shows the verbal report is a reconstruction. This supports the idea that reports are not reliable guides to causation. It supports (b) in the sense that the report exists without the 'self' knowing why. It does *not* prove (a) because the RH experience *did* cause the hand movement.

