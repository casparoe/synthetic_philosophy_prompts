answer: |-
  Welcome to the club. You have officially arrived at the single most debated paragraph in the history of Utilitarianism. If you feel like Mill is trying to have his cake and eat it too, you are in good company; G.E. Moore, Bernard Williams, and basically every intro-to-ethics professor since 1900 has leveled the exact same charge.

  However, since you come from a rationalist background (SSC/LW), you actually have a better toolkit for resolving this than most philosophy undergrads, because you're used to thinking about utility functions and wireheading.

  Here is the breakdown of what Mill is comparing, why it looks like a contradiction, and the most charitable reading that saves him from flat-out incoherence.

  ### 1. The Core Tension: Homogeneous vs. Heterogeneous Hedonism
  Your intuition is correct: If you are a strict hedonist like Jeremy Bentham (Mill's predecessor), pleasure is a **homogeneous sensation**. It's a single metric, like "utils" or "dopamine units." In that model, the only way to compare two pleasures is by quantity (intensity × duration). As Bentham famously said, "Prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry."

  Mill is trying to escape the "philosophy for swine" objection. He wants to say that poetry is *intrinsically* better than push-pin, even if the push-pin gives you a bigger immediate buzz.

  **So, what is being compared?**
  Mill is not comparing two sensations on a single scale. He is comparing **complex states of consciousness** that engage different human faculties.
  *   **Bodily pleasure:** Engages basic sensory faculties.
  *   **Mental pleasure:** Engages intellect, imagination, and moral sentiment.

  Mill's claim is that the *texture* of the experience matters, not just the intensity. He is arguing that "pleasure" is not a simple atom (like a pixel of light) but a complex structure (like an image). A high-resolution image of a sad scene might be "better" (more valuable) than a low-resolution image of a happy scene, even if the "happiness" pixel count is lower.

  ### 2. The "Smuggling" Charge (Where you are right)
  You asked: *Is he quietly importing some non-hedonic yardstick (dignity, sophistication, whatever) and relabeling it "pleasure"?*

  **Yes.** Most modern interpreters agree that Mill effectively abandons strict psychological hedonism here. He shifts toward what G.E. Moore later called **Ideal Utilitarianism**.

  In strict hedonism, the *only* thing good in itself is the feeling of pleasure. In Mill's modified version, the *exercise of higher faculties* is good in itself, even if it brings less net "feeling" of pleasure (hence "Socrates dissatisfied"). Mill is smuggling "human flourishing" or "dignity" into the definition of pleasure. He keeps the *word* "pleasure" to maintain brand continuity with Bentham, but he changes the *product*.

  From a rationalist perspective: Mill realizes that if you tell humans their utility function is just `maximize(dopamine)`, they will reject the system (rightfully). So he patches the utility function to `maximize(flourishing)`, but keeps the variable name `pleasure` for legacy compatibility.

  ### 3. Saving Mill: The "Competent Judge" isn't (necessarily) Circular
  You mentioned the "competent judge" argument feels circular: *Higher pleasures are what judges prefer; judges prefer them because they are higher.*

  Here is the charitable reading that avoids strict circularity. Mill is treating the preference of the competent judge not as a **definition**, but as **empirical data**.

  *   **Analogy:** "What is good wine?"
      *   *Circular definition:* Good wine is what wine experts prefer. (Why do they prefer it? Because it's good.)
      *   *Epistemic claim:* Good wine has objective properties (complexity, balance). Wine experts have calibrated palates that can detect these properties better than novices. Therefore, we use their preference as a proxy for the quality.

  Mill is making an **epistemic claim**, not a definitional one. He believes there is an intrinsic quality to mental pleasures. However, because this quality is subjective/experiential, the only way to measure it is to ask people who have experienced *both*.

  If 99% of people who have read Shakespeare *and* played push-pin prefer Shakespeare, Mill argues this is evidence that Shakespearean engagement accesses a deeper layer of human capacity. It's not circular if you view the "judge" as a measuring instrument. The instrument is calibrated by experience.

  ### 4. The Rationalist Reframe: Wireheading
  Since you hang out in rationalist circles, think of Mill's argument as an anti-wireheading argument.

  *   **Bentham's Utilitarianism:** Susceptible to the wirehead objection. If you can plug into a machine that gives you maximum pleasure sensations forever, you should do it.
  *   **Mill's Utilitarianism:** Resistant to the wirehead objection. Mill would argue that the wirehead life lacks "quality." Even if the *sensation* is maxed out, the *faculties* are atrophied.

  Mill is arguing that **we value the functioning of our capacities, not just the output feelings.** When he says some pleasures are "more desirable," he is acknowledging that human preferences are not just about raw feel, but about *what kind of being* is having the feeling.

  ### 5. Is it a Contradiction?
  **Strictly speaking? Yes.**
  If you define hedonism as "only sensations are intrinsically good," Mill contradicts himself. He admits that a being with higher faculties requires more to be happy, is capable of more suffering, and yet we would not trade places with a lower being. This implies the *capacity* itself has value, independent of the pleasure it produces.

  **Charitably? It's a refinement.**
  Mill is trying to describe human psychology more accurately than Bentham. He is arguing that "pleasure" is a folk term that covers a multitude of distinct neurological/psychological states. To treat them as identical because they are all "positive valence" is a category error.

  ### Summary for your mental model
  1.  **What is being compared?** Not raw intensity of sensation, but the complexity of the cognitive state producing the sensation.
  2.  **Is he smuggling values?** Yes. He is smuggling "dignity" and "intellectual flourishing" into the category of "pleasure."
  3.  **Is the Judge argument circular?** Only if you treat it as a definition. If you treat it as an appeal to expert testimony regarding subjective experience, it holds up better.
  4.  **Rationalist translation:** Mill is moving from `maximize(raw_reward_signal)` to `maximize(alignment_with_higher_order_preferences)`.

  You aren't failing to parse the text; you're correctly identifying the point where Mill breaks the formal system to accommodate human intuition. He sacrifices logical purity to save the theory from being morally repugnant. Whether that's a bug or a feature depends on whether you value consistency or applicability more.
