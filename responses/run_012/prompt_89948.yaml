  **Claim 4: "A text means whatever its readers decide."**
  **Verdict: Wrong.** This conflates semantic normativity with literary interpretation. Kripke isn't saying meaning is unstable or up for grabs; he's saying correctness is determined by public checkability, not private intuition. It's not "death of the author"; it's "no private author."

