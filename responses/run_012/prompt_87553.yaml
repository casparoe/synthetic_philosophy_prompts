prompt: |-
  My friend and I just got into a massive arguement on a long drive about whether the world is actually getting less violent, and now I'm definately worried my own position is a pile of contradictions. Here's roughly what I think:

  1. The long-run per-capita decline in homicide and war deaths is real and is one of the most important facts about modern life.
  2. Violence shouldn't just mean direct physical assault. It should include structural and institutional harms like preventable disease, poverty, and mass incarceration.
  3. There is a fact of the matter about whether violence is going up or down. It isn't just a matter of how you define your terms or which political tribe you belong to.
  4. Absolute numbers matter morally, not just rates. A lower per-capita risk can still mean a bigger total pile of suffering.
  5. When comparing eras, the right denominator isn't population but the number of possible violent interactions, like potential dyads or person-years at risk, because violence is relational.
  6. Moral progress is real and is part of why the decline happened.

  My friend says I can't have all of this. I suspect some of it only looks inconsistent. Can you audit it? Which commitments actually pull against each other, which are only apparently in tension, and how severe is each real conflict? For the genuine ones, what's the cheapest fix and what do I lose by making it? Rank them, and tell me which single change would clean up the most.
