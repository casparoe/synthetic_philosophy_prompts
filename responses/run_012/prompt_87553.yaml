      *   *Commitment 1 vs. Commitment 4:* 1 focuses on *per-capita* decline. 4 says *absolute numbers* matter. If population grows, per-capita can drop while absolutes rise. This is a classic tension.
      *   *Commitment 3 vs. Commitment 2:* 3 says there's an objective fact. 2 expands the definition of violence. If the definition is contested (is poverty violence?), does the "fact of the matter" become muddy?
      *   *Commitment 5 vs. Commitment 1:* 1 uses standard per-capita (usually population). 5 argues for a specific denominator (dyads/person-years). This is more of a methodological refinement than a contradiction, but it might change the *trend* data cited in 1.
      *   *Commitment 6 vs. Commitment 2:* 6 claims moral progress caused the decline. If structural violence (2) is included, is there moral progress there? (e.g., global inequality, incarceration rates).

  3.  **Detailed Analysis of Conflicts:**

      *   **Conflict A: The "Denominator Dilemma" (1 vs. 4 vs. 5)**
          *   *1:* Per-capita decline is the key fact.
          *   *4:* Absolute numbers matter morally.
          *   *5:* Neither population nor absolutes are right; it's *interactions*.
          *   *Tension:* If absolute numbers of suffering are up (due to population growth), can you claim the world is "less violent" in a morally meaningful way (6)? If you prioritize 4, 1 becomes less morally weighty. If you prioritize 1, 4 is acknowledged but sidelined. 5 complicates the math of 1.
          *   *Severity:* High. This strikes at the core of the "Is the world getting better?" debate (Pinkers vs. Critics).

      *   **Conflict B: The "Definition of Violence" (1 vs. 2)**
          *   *1:* Cites homicide/war (direct violence).
          *   *2:* Includes structural violence (poverty, disease).
          *   *Tension:* Direct violence is down (1). Structural violence is ambiguous (global poverty is down, but inequality/incarceration might be up in specific contexts). If you combine them, does the "decline" still hold? If structural violence is included, the "Long-run decline" narrative becomes much messier.
          *   *Severity:* High. This is the main point of contention between Steven Pinker (Commitment 1) and critical theorists (Commitment 2). Holding both requires careful balancing.

      *   **Conflict C: Objectivity vs. Definition (3 vs. 2)**
          *   *3:* There is a fact of the matter, not just semantics.
          *   *2:* Expands definition to contested concepts (is poverty violence?).
          *   *Tension:* If "violence" includes structural harms, measuring it becomes normative (what counts as a harm? what is preventable?). This threatens the "objective fact" claim in 3.
          *   *Severity:* Medium. It's epistemological. You can argue structural violence is objectively measurable, but it's harder than counting corpses.

      *   **Conflict D: Moral Progress vs. Structural Harm (6 vs. 2)**
          *   *6:* Moral progress caused the decline.
          *   *2:* Structural harms are violence.
          *   *Tension:* If structural harms persist (or worsen in some metrics), can you claim "Moral Progress" drove the trend?
          *   *Severity:* Medium-High. It challenges the causal story.

  4.  **Synthesizing and Ranking:**

      *   *Real Conflict 1: The Metric Morality Clash (1 vs. 4).* You can't claim the world is "less violent" as a *moral* improvement (implied by 6) if absolute suffering is up (4), even if rates are down (1).
      *   *Real Conflict 2: The Scope of Violence (1 vs. 2).* Direct violence is down. Structural violence is debatable. Merging them risks breaking the "decline" thesis.
      *   *Apparent Tension: The Denominator (1 vs. 5).* 5 is just a refinement of 1. It doesn't contradict it, it specifies it.
