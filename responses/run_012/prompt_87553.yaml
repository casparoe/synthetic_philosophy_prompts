          *   Recommendation: Decouple the *statistical claim* from the *moral definition*.

  8.  **Final Polish:** Check the ranking. Ensure the "cheapest fix" is actionable. Ensure the "single change" is identified clearly. (Self-Correction: Make sure to acknowledge that 5 actually strengthens 1, so that's not a conflict).

      *   *Ranking:*
