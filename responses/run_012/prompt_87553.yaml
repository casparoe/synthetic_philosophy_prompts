          *   Commitment 4 (Absolutes) is the real killer for the "Optimist" narrative. If population triples and homicide rate halves, absolute homicides are 1.5x higher. Is the world "less violent"? Statistically yes (risk), Morally... complicated.
          *   Commitment 2 (Structural) is the killer for the "Data" narrative. Counting "poverty as violence" makes the trend line much harder to establish objectively (Commitment 3).

      *   *Re-evaluating the "Single Change":*
          *   If I drop 2 (Structural violence), the argument becomes a standard Pinkerian one. Consistent, but maybe morally shallow.
