answer: |-
  You have identified a genuine and significant gap in the methodology of formal modelling. While philosophers of science have circled this distinction—notably Uskali Mäki on 'negligibility' versus 'heuristic' assumptions, and Nancy Cartwright on 'Galilean idealisation'—there is no standardised terminology that captures the specific topological difference you describe: the presence or absence of a 'knob' that allows for a continuous approach to reality.

  In mathematics, specifically perturbation theory, this is known as the distinction between **regular** and **singular** perturbations. However, this terminology has not migrated into the philosophy of social science modelling, where the confusion you describe is most prevalent.

  Since no single established term covers the distinction and the specific defensive fallacy you outline, I propose the following terminology. It is designed to be precise enough for formal work but accessible to social scientists.

  ### 1. The Terminology

  **Parametric Idealisation (The Knob)**
  This corresponds to your physics examples. A real-valued parameter exists in the target system (friction, viscosity), and the model sets it to an extreme value (zero, infinity). Crucially, the mathematical structure of the model remains stable as the parameter moves away from the ideal.
  *   *Example:* Setting friction to zero in a pendulum model.

  **Structural Idealisation (The Different Object)**
  This corresponds to your economics examples. The assumption does not represent a value on a continuum but rather defines the logical architecture of the system. There is no parameter to tune; the assumption is a binary condition of possibility.
  *   *Example:* Assuming complete contracts or irrevocable policy commitments. These are not 'very complete' contracts; they are logically distinct objects.

  **The Fallacy: The Parametric Pretence**
  This is the mistake of defending a *Structural Idealisation* using the vocabulary appropriate to a *Parametric Idealisation*. It occurs when a modeller claims their structural assumption is merely an 'approximation' that can be relaxed by degrees, implying that the error introduced is small and directional, when in fact the assumption is a discontinuity that fundamentally alters the solution space.

  ### 2. The Criterion: The Continuity Condition

  You asked for a criterion to distinguish these *before* relaxing the assumption. You can apply the **Continuity Condition**.

  To test an assumption, ask: *Can I define a metric of distance between the assumption and the real-world phenomenon such that a small change in distance produces a small change in the model's output?*

  *   **If Yes (Parametric):** There is a continuous mapping between the assumption and reality. You can speak of 'small frictions' or 'large populations'. The limit of the model as the parameter approaches reality is the same as the model of the limit.
  *   **If No (Structural):** The mapping is discontinuous. There is no 'small' difference between a complete and an incomplete contract; the introduction of incompleteness changes the game form itself. The limit of the model does not commute with the model of the limit.

  **Practical Heuristic:**
  Look at the variable. Is it a **magnitude** (how much friction?) or a **precondition** (is contracting possible?). If removing the assumption requires rewriting the equations rather than changing a coefficient, it is a Structural Idealisation.

  ### 3. Implications for Results

  When an assumption is **Parametric**, relaxing it typically leads to **quantitative error**. The prediction shifts slightly; the direction of the bias can often be signed (e.g., 'the model overestimates speed').

  When an assumption is **Structural**, relaxing it typically leads to **qualitative fragility**. The result does not shift; it breaks or inverts.
  *   *Example:* In a model relying on complete contracts, introducing even a tiny probability of incompleteness may not slightly reduce efficiency; it may collapse the market entirely (as in Akerlof's Lemons or Holmström's teams).
  *   *Defence:* If a modeller defends a Structural Idealisation by claiming the result is 'approximately true', they are committing the **Parametric Pretence**. The correct defence for a Structural Idealisation is not approximation, but **sufficiency**: arguing that the mechanism identified operates *despite* the structural simplification, or that the structural feature is the *source* of the phenomenon being studied (a 'credible world' in Robert Sugden's sense), rather than a distortion of it.

  ### 4. Distinctions from Existing Concepts

  It is vital to mark the boundaries between this distinction and other familiar methodological claims.

  **Versus Idealisation vs. Abstraction**
  *   *Abstraction* usually means leaving a factor out entirely (e.g., ignoring the colour of the traders).
  *   *Idealisation* means distorting a factor (e.g., traders have perfect rationality).
  *   Your distinction cuts *across* idealisation. Both Parametric and Structural assumptions are idealisations (they are false). The difference is not whether they distort, but *how* they distort: continuously (Parametric) or discontinuously (Structural).

  **Versus Robustness Analysis**
  *   *Robustness Analysis* asks: 'If I change the assumption, does the result hold?'
  *   Your criterion is *ex ante*, whereas robustness is *ex post*. The Continuity Condition tells you *what kind of robustness check is appropriate*. If an assumption is Parametric, a local robustness check (small perturbations) is sufficient. If it is Structural, local checks are useless; one requires a global structural check (changing the game form), which is often computationally or analytically prohibitive. The Parametric Pretence often hides this difficulty by pretending a local check suffices.

  **Versus Friedman's Instrumentalism**
  *   Milton Friedman (1953) argued that the realism of assumptions does not matter, only the accuracy of predictions.
  *   The Parametric Pretence is a specific subset of Friedman's defence, but it is more deceptive. Friedman says 'assume away reality to get predictions.' The Parametric Pretence says 'assume away reality *because it is close enough to reality*.'
  *   The latter is falsifiable via the Continuity Condition. If the assumption is Structural, the claim that it is 'close enough' is mathematically incoherent, regardless of predictive success in a specific domain. It misrepresents the *explanatory* power of the model.

  ### 5. Summary for Application

  When encountering a defence of an unrealistic assumption in formal modelling:

  1.  **Apply the Continuity Condition:** Is there a knob? Can the assumption be represented as a parameter converging to a real value?
  2.  **Classify:** If yes, it is a **Parametric Idealisation**. If no, it is a **Structural Idealisation**.
  3.  **Evaluate the Defence:** If the modeller claims the assumption is a 'reasonable approximation' for a Structural Idealisation, identify this as **The Parametric Pretence**.
  4.  **Assess the Risk:** Recognise that Structural Idealisations carry the risk of **Qualitative Fragility**. The model's results are not robust to small errors; they are contingent on the architecture holding exactly.

  By adopting these terms, you can move the debate away from the vague claim that 'all models are false' to the precise question of 'how does this model fail?' This preserves the utility of formal modelling while preventing the shielding of fragile results behind the vocabulary of physics.
