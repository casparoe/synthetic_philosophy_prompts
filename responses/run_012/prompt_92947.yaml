answer: |-
  The Principle of Identity of Indiscernibles (PII) states that if two entities share all their properties, they are identical. Formally: $\forall F (F(a) \leftrightarrow F(b)) \rightarrow a = b$. It is a principle that promises to ground numerical diversity in qualitative diversity, ensuring that reality contains no brute distinctness. To test this principle, we must consider its limit case: a universe containing exactly two objects, $a$ and $b$, and nothing else. There is no space to separate them, no time to distinguish their existence, and no intrinsic qualities. The only feature of this universe is a single symmetric, irreflexive relation $R$ that $a$ bears to $b$ and $b$ bears to $a$. In such a universe, is PII true? Are the objects distinguishable?

  I argue that this universe is metaphysically possible, that the two objects are numerically distinct despite being qualitatively indiscernible, and that therefore PII is false. The strongest defenses of PII fail because they either render the principle tautological or rely on dogmatic constraints on conceivability. Furthermore, this verdict holds when we transpose the case to time: two moments in the history of a single unchanging thing are distinct for the same reason the objects are distinct—not because of qualitative differences, but because numerical diversity is a primitive fact.

  To see why PII fails in the "Two-Object Universe" (TOU), we must first establish the indiscernibility of $a$ and $b$. Since there are no intrinsic properties, $a$ and $b$ differ in no monadic qualities. The only available properties are relational. However, the relation $R$ is symmetric ($aRb$ and $bRa$) and irreflexive (neither bears $R$ to itself). Consequently, $a$ has the property "bearing $R$ to something," and $b$ has the property "bearing $R$ to something." Since there is only one "something" in each case (the other object), and the relation is symmetric, their relational profiles are identical. $a$ is related to $b$ just as $b$ is related to $a$. There is no qualitative asymmetry to exploit. If PII holds, $a$ and $b$ must be one object. But by hypothesis, they are two. The tension is immediate.

  Defenders of PII typically offer three lines of defense, all of which collapse under scrutiny. The first appeal is to **impure or relational properties**. One might argue that $a$ has the property "being distinct from $b$" or "standing in $R$ to $b$," which $b$ lacks. However, this defense assumes what it intends to prove. To possess the property "being distinct from $b$," $a$ must already be distinct from $b$. Using such properties to establish distinctness makes PII trivially true: $a$ and $b$ are distinct because they have the property of being distinct. This strips PII of its philosophical power, which is to explain *why* or *how* things are distinct via their qualitative nature. If we allow impure properties (those referencing specific individuals), PII becomes a logical tautology rather than a metaphysical principle.

  The second defense appeals to **primitive thisness (haecceity)**. This view posits that $a$ has a non-qualitative property, $H_a$ (being $a$), and $b$ has $H_b$ (being $b$). Thus, they differ in property. While this saves PII formally, it does so by inflating the ontology with mysterious, unanalyzable individutors. More critically, it concedes the core objection: there is no *qualitative* ground for distinctness. If the only difference between $a$ and $b$ is a primitive haecceity, then qualitative indiscernibility is compatible with numerical diversity. This is precisely what the denial of PII asserts. Saving PII by haecceities is thus a Pyrrhic victory; it preserves the letter of the principle while abandoning its spirit—the reduction of number to quality.

  The third defense claims the TOU is **inconceivable**. Critics argue that to conceive of two objects, one must implicitly posit a medium (like space) or a qualitative difference. However, this confuses epistemic difficulty with metaphysical impossibility. As Max Black argued, there is no logical contradiction in the description of the TOU. To deny its possibility is to assert that the universe *must* provide a qualitative ground for distinctness, which is simply to assert PII as a necessary truth without argument. Given that the TOU is logically consistent, we should not rule it out merely to protect a principle.

  Therefore, the verdict on the TOU must be that it is possible, and within it, $a$ and $b$ are distinct but indiscernible. PII is false. Numerical distinctness is not supervenient on qualitative properties; it is a brute fact. Two things can be simply *two*, without any qualitative feature making them so.

  Does this verdict survive a change of subject matter? Consider two moments, $t_1$ and $t_2$, in the history of a single, unchanging thing. The thing possesses identical intrinsic properties at both moments. If we treat moments analogously to the objects in the TOU, we must ask: are $t_1$ and $t_2$ distinct, and if so, is it because of qualitative differences?

  In the standard view of time, $t_1$ and $t_2$ are distinguished by their temporal order: $t_1$ is earlier than $t_2$. This relation is asymmetric, unlike the symmetric relation $R$ in the TOU. Consequently, $t_1$ has the relational property "preceding some moment," while $t_2$ has "following some moment." One might argue this saves PII for time, even if it fails for the spheres. However, this relies on treating temporal position as a qualitative property. If we maintain the strictures used to evaluate the TOU—excluding impure properties like "being at $t_1$"—we must ask if "preceding" is a genuine qualitative difference or merely a structural label for primitive distinctness.

  If we apply the reasoning derived from the TOU—that numerical diversity is primitive and does not require qualitative grounding—the distinctness of $t_1$ and $t_2$ does not *depend* on the asymmetry of time. Even if time were cyclic or the relation symmetric, the moments would remain numerically distinct. The reasoning from the TOU shows that the distinctness of the moments is not secured by their qualitative profile (which, in an unchanging thing, is identical) but by the brute fact of their numerical diversity. Just as $a$ and $b$ are two without qualitative difference, $t_1$ and $t_2$ are two without qualitative difference. The asymmetry of time provides a way to *label* them, but not the metaphysical ground for their distinctness.

  If PII were true, an unchanging thing could not persist through time, for there would be no qualitative difference between moment $t_1$ and moment $t_2$ to justify their being distinct moments. The thing would collapse into a single timeless instant. But we know that duration without change is conceptually coherent (e.g., a universe that remains static for a million years). The possibility of "empty time" mirrors the possibility of the TOU. In both cases, distinctness exists without qualitative discernment.

  Therefore, the same reasoning that establishes the distinctness of the two objects establishes the distinctness of the two moments. Both cases demonstrate that identity is not reducible to quality. The objects are distinct not because of the relation $R$, but despite it. The moments are distinct not because of temporal order, but despite the lack of intrinsic change. To deny this is to claim that number must always be grounded in quality, a claim the TOU proves false.

  In conclusion, the Principle of Identity of Indiscernibles is false. The universe containing exactly two objects related by a single symmetric, irreflexive relation is possible, and within it, the objects are numerically distinct yet qualitatively indiscernible. Defenses of PII fail because they either trivialize the principle by counting identity itself as a property or invoke obscure metaphysical entities like haecceities that concede the core point. This verdict extends to the case of time: two moments in the history of an unchanging thing are distinct, not because they differ qualitatively, but because numerical distinctness is a primitive feature of reality. We must accept that the world can contain plurality without difference. To insist otherwise is to prioritize a tidy metaphysical principle over the logical possibility of brute diversity.
