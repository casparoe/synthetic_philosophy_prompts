      * *My task:* Synthesize these.

      * *Infinite Memory Case:*
          *   Person A: No erasure = no heat dissipation required *yet*. But you can't cycle. You consume "negentropy" of blank memory. 2nd law safe because you used a resource.
          *   Person B: Entropy of gas down, entropy of memory up (due to correlation). Total entropy non-decreasing. 2nd law safe.
          *   Do they converge? Yes, on the outcome. The disagreement is whether "Landauer's Principle" is the *reason* or just a description of the stat mech outcome.

      * *Verbal Disagreement:* Is "entropy in correlations" different from "cost paid at erasure"? If you never erase, the cost is never paid. But the entropy is still in the correlations. So if you stop there, Person A says "no cost incurred," Person B says "entropy already increased." This looks like a substantive difference in accounting unless Person A admits the "cost" is potential. Actually, Bennett's view is that you can extract work equal to $kT \ln 2$ per bit *if* you erase. If you don't erase, you have stored information. The "cost" is only realized upon reset. Person B says the entropy balance is immediate upon correlation. This is a timing/accounting difference. I should highlight this.

      * *Let's write.*

