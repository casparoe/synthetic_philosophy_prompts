  (3) defines value as the sum of welfare. (4) denies that missing positive welfare subtracts value. Standard total utilitarianism says a world with extra happy people is better; you say it's neutral. This breaks the aggregation model in (3). You need a person-affecting view or a critical-level view to make (4) work, but (3) sounds like total utilitarianism. To fix this, you must amend (3) to specify that only existing people count, or that positive welfare has zero marginal value below a certain threshold. If you don't, you're very vulnerable to the "Repugnant Conclusion" in reverse or inconsistent aggregation. This inconsistency allows seminar opponents to charge you with arbitrary boundary-drawing. You treat negative welfare as counting towards the sum but positive welfare as not counting towards the sum in population cases. That requires a specific axiological framework like negative utilitarianism or asymmetry views, not summing.

  **WAS Magnitude vs. Intervention Caution**
  (5) identifies wild animal suffering as the largest problem. (2) says suffering weighs heavily. (6) says don't intervene. If the problem is truly the largest, and suffering is weighted heavily, the burden of proof for sustained inaction is massive. Epistemic caution is valid, but if the expected value of intervention is positive even with low confidence, (6) contradicts the urgency implied by (5) and (2). You risk "paralysis by analysis." You need to clarify whether (6) is a permanent veto or a temporary heuristic while research is done. Otherwise, you claim the biggest fire exists but refuse to pick up a hose. This looks like moral cowardice unless grounded in concrete probability estimates showing intervention very likely increases suffering.

  **Weighted Suffering vs. Death**
  (2) weights suffering heavily against pleasure. (7) says death is bad if it cuts off a net positive life. If suffering weighs significantly more, few lives will qualify as "net positive." A life with moderate pleasure and mild suffering might be net negative under (2), making death good (relief) rather than bad (deprivation). You need to ensure your weighting in (2) doesn't render (7) vacuous. If almost no lives are worth living by your metric, claiming death is bad for those people becomes an edge case rather than a general principle. This isn't a logical contradiction, but it shrinks the scope of (7) drastically. You must define the exchange rate between pain and pleasure very clearly to know when death is actually bad.

  Not-actually-tensions

  **Experientialism vs. Animal Inclusion**
  (1) grounds badness in experience/qualia. (5) extends moral consideration to animals based on sentience. These are perfectly aligned. Since animals have sentient experiences capable of suffering, (1) naturally necessitates (5). There is no conflict here; rather, (1) provides the metaphysical foundation for (5). You don't need to adjust either claim; this is the strongest link in your package. It protects you from speciesist objections in the seminar. Your experientialism avoids needing complex cognitive criteria for moral status. Just sentience matters. This coherence strengthens your position on wild animals significantly.

  **Experientialism vs. Death**
  (1) says badness is experiential. (7) says death is bad via deprivation. This looks like a conflict (death isn't experienced), but it's standard compatibility. You can hold that suffering is intrinsically bad (1) while death is instrumentally bad because it prevents future good experiences. As long as you distinguish between intrinsic badness (pain) and extrinsic badness (loss of opportunity), these cohere. You just need to specify that (7) refers to prudential value, not intrinsic disvalue. Many philosophers accept deprivation accounts without abandoning experientialism about welfare. It merely requires distinguishing the badness of the state from the badness of the transition.

  Cheapest repair

  Modify claim (3) to explicitly adopt a person-affecting view rather than strict total utilitarianism. Change "sum of everyone's welfare" to "sum of everyone's welfare, counting only those who exist or will exist independently of our choices." This adopts a person-affecting restriction that aligns with your intuition in (4). It saves your asymmetry view without abandoning aggregation entirely. It costs you the ability to say the world is *better* for adding happy people, but you already denied that in (4), so you lose nothing substantive.

  This clarification protects you from the charge that you are arbitrarily switching frameworks between negative and positive welfare. It makes your view a consistent "Person-Affecting Negative-Weighted Utilitarianism." You must be prepared to defend why existing people count but potential people don't, but that is a standard philosophical position rather than an inconsistency. This single edit brings your population ethics into line with your welfare axiology.

  If I only change one thing

  Change (3) to explicitly adopt a person-affecting view. This resolves the population ethics contradiction immediately, aligns with your intuition in (4), and leaves your views on suffering and animals intact. It's the linchpin holding the ethical framework together.
