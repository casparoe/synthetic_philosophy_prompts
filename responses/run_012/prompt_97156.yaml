          *   *Refinement:* Focus on the *mechanism*. Do neurons loop? No. Do economic classes loop? Maybe. Why is psychiatry the paradigm?
          *   *Follow-up:* If she says "all human kinds," ask about the biological constraints.

      *   *Q3 (Mistaken Categories):* If everything loops, can anything be wrong?
          *   *Draft:* Can a diagnosis be wrong?
          *   *Refinement:* If the criteria shift to match the people, what does "error" mean? Is it purely pragmatic?
          *   *Follow-up:* If she says "utility," ask about harmful utilities.

      *   *Q4 (Online Acceleration):* The specific new claim.
          *   *Draft:* How does the internet change this?
          *   *Refinement:* Focus on the *lag*. If the loop is faster than the manual, is the manual irrelevant?
          *   *Follow-up:* If she says "manuals still matter," ask why.

      *   *Q5 (Evidence Against):* Falsifiability.
          *   *Draft:* What would prove you wrong?
          *   *Refinement:* Make it specific. A stable category over time?
          *   *Follow-up:* If she says "none exist," challenge the scientific status.

      *   *Q6 (Agency/Resistance):* Who controls the loop?
          *   *Draft:* Do patients control it?
          *   *Refinement:* Is it a power struggle? Clinicians vs. TikTokers.
          *   *Follow-up:* If she says "collaborative," ask about coercion.

      *   *Q7 (Normativity):* Should we stop looping?
          *   *Draft:* Is this good or bad?
          *   *Refinement:* If looping is inevitable, is there a *right* way to loop?
          *   *Follow-up:* If she says "manage it," ask who decides.

      *   *Q8 (The "Real" Disorder):* Back to the user's original argument.
          *   *Draft:* So are disorders real?
          *   *Refinement:* If the target moves, can we hit it? Does "real" lose meaning?
          *   *Follow-up:* If she says "process real," ask if that satisfies a sufferer.

      *   *Q9 (Deflection Trap):* specifically targeting "empirical question."
          *   *Draft:* Isn't this just psychology?
          *   *Refinement:* If you say it's empirical, you assume a stable object of study. But your theory denies that.
          *   *Follow-up:* Force a philosophical commitment.

      *   *Q10 (Conclusion/Implication):* The ultimate stakes.
          *   *Draft:* What should we do?
          *   *Refinement:* Should we abandon the search for natural kinds?
          *   *Follow-up:* Final check on realism.

      *Review against constraints:*
