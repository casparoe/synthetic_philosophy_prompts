answer: |-
  Here are ten interview questions designed to press the substance of your guest's position, ordered to progressively close off deflection towards empirical deferment.

  **1. The Self-Fulfilling Distinction**
  You describe 'two-way looping' as a dynamic where the classification alters the subject, and the subject's alteration rewrites the classification. How does this differ substantively from the sociological concept of a self-fulfilling prophecy? If a teacher labels a child 'gifted' and the child performs better, the prophecy is fulfilled, but the definition of 'giftedness' need not change. Why is the feedback loop into the *criteria themselves* essential to your account, rather than just a feedback loop into the *prevalence* of the trait?

  *   **Follow-up:** If she suggests it is merely a matter of degree or speed, press her on whether a self-fulfilling prophecy preserves the underlying ontology of the kind, whereas looping dissolves it. Does the distinction rest on stability?

  **2. Human Kinds vs. Psychiatric Kinds**
  Ian Hacking originally formulated interactive kinds in the context of human sciences generally, not solely psychiatry. Is the looping effect you describe distinctive to psychiatric categories, or is it a feature of all human kinds? If it applies to economic classes or political affiliations just as much as depression, what justifies treating psychiatric diagnosis as a special philosophical case rather than a subset of general social ontology?

  *   **Follow-up:** If she argues psychiatry is unique because of the *medical* authority involved, ask whether the medical veneer is precisely what obscures the looping, rather than a mechanism that enables it.

  **3. The Online Acceleration**
  You have argued that online self-diagnosis accelerates the looping effect, outpacing the clinical revision cycle of manuals like the DSM. If the population's understanding of a disorder shifts faster than the professionals can update the criteria, does the official diagnosis cease to be the 'real' category? At what point does the clinical definition become a historical artefact rather than a living description of the disorder?

  *   **Follow-up:** If she maintains that clinical criteria remain the anchor, ask why we should privilege the slow-moving institutional definition over the fast-moving lived reality of the classified group.

  **4. The Possibility of Error**
  If diagnostic criteria are perpetually rewritten to accommodate the changes in the population they classify, does your account leave any room for a diagnostic category to be simply *mistaken*? If the target moves to match the arrow, how can we ever say the archer missed? Is there a normative standard outside the loop against which we can judge a classification as erroneous, or is coherence within the loop the only metric?

  *   **Follow-up:** If she suggests 'utility' replaces 'truth' as the metric, ask whether a highly useful but ontologically empty category (like a beneficial placebo) counts as a valid diagnosis in her framework.

  **5. Falsifiability and Evidence**
  What would you accept as evidence against the two-way looping hypothesis? If a psychiatric category were found to remain stable over a significant period, would you interpret that as evidence that looping does not occur, or merely that the loop is happening too slowly for us to detect? At what point does the claim become unfalsifiable?

  *   **Follow-up:** If she argues that stability is just a temporary phase in a longer loop, challenge her on whether a theory that explains both change *and* stability as the same phenomenon risks explaining nothing at all.

  **6. Agency and Power**
  In this accelerated online loop, who holds the agency? Is the rewriting of criteria a democratic process driven by sufferers, or is it a new form of algorithmic governance where search engines and social media trends dictate the contours of mental illness? If the loop is driven by visibility rather than validity, does this not privilege certain demographics over others?

  *   **Follow-up:** If she argues it is a collaborative negotiation, ask her to identify a mechanism that prevents powerful institutions (pharmaceutical companies, insurance firms) from hijacking the loop to solidify categories for profit.

  **7. Clinical Practice and Authority**
  If the criteria are unstable and subject to rapid revision from outside the clinic, what is the clinician's role? Are they merely documenting a cultural moment, or do they retain the authority to resist the loop? If a patient presents with symptoms that match the online consensus but not the clinical criteria, and you believe the loop is 'running fast', on what basis do you deny the diagnosis?

  *   **Follow-up:** If she suggests clinicians should adapt faster, ask whether this dissolves the distinction between a medical diagnosis and a cultural affirmation, and whether that erosion is desirable.

  **8. The 'Empirical Question' Defence**
  Philosophers of science often defer to empirical research when ontological disputes arise. However, your position suggests that the very object of that research is unstable. If you dismiss a challenge by saying 'that is an empirical question', are you not presupposing a stable object of study that your own theory denies exists? How can we measure a moving target without first philosophically settling how it moves?

  *   **Follow-up:** If she insists on interdisciplinary collaboration, press her on whether the philosophy is doing any work other than describing the methodology of the science. Is there a *philosophical* claim here that isn't just a sociological observation?

  **9. Suffering and Reality**
  Returning to the sufferer: if a person is in distress, does it matter to them whether their disorder is a 'natural kind' or a 'looping kind'? If your view implies their suffering is partly constituted by the label itself, does this risk invalidating their experience as 'less real' than a purely biological ailment? How do you safeguard the reality of the pain against the contingency of the category?

  *   **Follow-up:** If she argues that looping kinds are still 'real', ask her to define 'real' in a way that satisfies a sceptic who believes only non-interactive kinds (like quarks) possess true reality.

  **10. The Ontological Conclusion**
  Finally, if the two-way loop is inevitable and accelerating, should we abandon the search for natural kinds in psychiatry entirely? Is your position ultimately a form of anti-realism, or are you proposing a new kind of realism—one based on processes rather than entities? If the latter, does 'process realism' offer enough stability to justify the coercive powers often attached to psychiatric diagnosis?

  *   **Follow-up:** If she proposes 'process realism', ask whether a process that can be manipulated by online trends is robust enough to justify involuntary treatment or insurance denial.
