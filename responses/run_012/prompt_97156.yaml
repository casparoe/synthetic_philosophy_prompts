prompt: |-
  Last night a friend and I spent the better part of an evening arguing about whether psychiatric diagnoses name real disorders or merely label clusters of behaviour that the labelling itself helps to produce, and I came away unsure how the dispute could ever be settled. I am recording an episode of a small philosophy-of-psychiatry podcast, and my guest defends a position she calls two-way looping: not only does a classification change the people who fall under it, but those changes then feed back and alter the content of the diagnostic criteria themselves, so that a category is never stable enough to be straightforwardly vindicated or falsified. She has also lately been arguing that online self-diagnosis makes the loop run faster than the clinical revision cycle, so that the criteria are rewritten only after the population has already shifted.

  Draft me eight to ten interview questions that press on the substance of that position rather than inviting her to restate it. I want at least one question on how two-way looping differs from an ordinary self-fulfilling prophecy, at least one on whether her account leaves any room for a diagnostic category simply being mistaken, at least one on whether the looping is supposed to be distinctive of psychiatric categories or of human kinds generally, and at least one on what she would accept as evidence against her view. For each question, add a follow-up keyed to the answer she is most likely to give, and order the sequence so that it becomes progressively harder for her to deflect with "that is an empirical question" or "that is a research programme." Please write in British English.
reasoning: |-
