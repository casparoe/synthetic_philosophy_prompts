      *Final Polish:* Ensure the tone is respectful but rigorous (podcast style).

      *(Self-Correction during drafting)*: Make sure Q1 clearly distinguishes the *two-way* nature. A self-fulfilling prophecy is usually A->B. Looping is A->B->A'.
