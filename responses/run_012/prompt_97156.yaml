  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Psychiatry, specifically "Two-Way Looping" (classification changes people -> people changes change criteria -> criteria changes change people...).
      *   **Guest's Position:** Classifications aren't stable; online self-diagnosis accelerates the loop beyond clinical revision cycles.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Press on substance, don't invite restatement.
          *   Specific required topics:
              *   Difference from self-fulfilling prophecy.
              *   Room for a category being "mistaken."
              *   Distinctiveness to psychiatry vs. human kinds generally.
              *   Evidence against the view (falsifiability).
          *   Include follow-ups for each question (keyed to likely answers).
          *   Order: Progressively harder to deflect with "empirical question" or "research programme."
          *   Language: British English.

  2.  **Deconstruct the Guest's Position ("Two-Way Looping"):**
      *   *Core claim:* Diagnostic categories interact dynamically with the classified.
      *   *Nuance:* It's not just top-down (label affects person); it's bottom-up too (person changes affect the label's definition).
      *   *New twist:* Internet/self-diagnosis speeds up the bottom-up feedback, outpacing official manuals (DSM/ICD).
      *   *Implication:* Categories are never stable enough for simple realism or anti-realism.

  3.  **Drafting Strategy - Sequencing:**
      *   *Early Questions:* Clarify conceptual distinctions (Self-fulfilling prophecy, Human Kinds). These are philosophical but allow some theoretical wiggle room.
      *   *Middle Questions:* Explore implications (Mistaken categories, Normativity). Harder to dodge.
      *   *Late Questions:* Falsifiability, Normative consequences, The "So What?" factor. These force a stance on truth and utility, making "it's empirical" a weak defence.

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Self-Fulfilling Prophecy):* Need to distinguish looping from Merton's concept.
          *   *Draft:* How is this different from a self-fulfilling prophecy?
          *   *Refinement:* Make it sharper. A prophecy is usually one-off. Looping implies structural change to the *kind*.
          *   *Follow-up:* If she says "degree not kind," press on the ontological implication.

      *   *Q2 (Human Kinds):* Hacking's original context. Is psychiatry special?
