answer: |-
  Your sourdough starter is a perfect instance of the *Ship of Theseus* problem, which is the diachronic cousin of the Special Composition Question (SCQ). The SCQ asks synchronically: *Under what conditions do some things compose a further thing?* Your friend is right to warn you against "intuition pumps" (single cases). Metaphysics requires a system that holds across the board.

  Below is the specification you requested. I have sorted your demands, added necessary missing constraints, distinguished hard constraints from theoretical preferences, and identified the fatal tensions.

  ### I. The Desiderata Specification

  | Requirement | Motivation / Case | Status | Tension / Conflict |
  | :--- | :--- | :--- | :--- |
  | **1. Non-Vagueness of Existence** | If parthood is precise, existence cannot be vague. There must be a fact of the matter whether a composite exists. | **Constraint** (Logical) | Conflicts with *Common Sense* (borderline cases like clouds/heaps). |
  | **2. Principled Restriction** | Composition cannot be brute or arbitrary. There must be a non-circular condition (e.g., "contact," "life") that triggers it. | **Constraint** (Theoretical) | Conflicts with *Common Sense* (hard to find a principle that yields *just* chairs and trees). |
  | **3. Common Sense Ontology** | Ordinary objects (chairs, jars, starters) exist. Our ordinary counting ("one jar," not "trillions of particles") must be largely correct. | **Prejudice** (Folk Intuition) | Conflicts with *Parsimony* and *Physics* (Nihilism/Universalism deny this). |
  | **4. Causal Non-Idleness** | Composites must do something. If the physical parts do all the work, the composite is an epiphenomenal ghost. | **Constraint** (Scientific) | Conflicts with *Causal Closure of Physics* (Overdetermination worry). |
  | **5. Intrinsic Supervenience** | Whether parts compose a whole should depend on the parts and their relations, not on external observers or minds. | **Prejudice** (Realist) | Conflicts with *Conventionalism* (which makes composition mind-dependent). |
  | **6. Naturalistic Continuity** | Metaphysics should not contradict physics/biology. Life is not physically magical; organisms are material systems. | **Constraint** (Scientific) | Conflicts with *Organicism* (which often treats "life" as a metaphysical brute fact). |
  | **7. Diachronic Coherence** | The theory must account for persistence over time (your starter). If composition holds now, does the object survive part replacement? | **Constraint** (Logical) | Conflicts with *Strict Identity* (if matter changes, is it the same thing?). |
  | **8. Normative Potential** | To have "interests," an entity must be a unified locus of welfare or goal-directedness. | **Constraint** (For your goal) | Conflicts with *Universalism* (everything has interests?) and *Nihilism* (nothing does). |

  **Notes on Status:**
  *   **Constraint:** Violating these renders the theory logically incoherent or scientifically obsolete.
  *   **Prejudice:** These are philosophical commitments. A theory can violate them and remain coherent, but it will be costly (e.g., telling you jars don't exist).

  **Missing Desiderata Added:**
  *   **Diachronic Coherence:** You mentioned the starter's history. An SCQ answer often implies a theory of persistence. If composition is strict, your starter dies every time you feed it.
  *   **Normative Potential:** Since your goal is to identify entities with *interests*, the metaphysics must support agency or teleology. A mere "sum of parts" rarely has interests; a "system" might.

  ---

  ### II. The Inconsistencies (The Trilemmas)

  You suspected the list might be inconsistent. You are correct. There are two major fault lines where no theory satisfies all constraints simultaneously.

  **1. The Van Inwagen Gap (The "Restriction" Trilemma)**
  You cannot jointly satisfy:
  *   (A) **Common Sense Ontology** (Chairs exist, random scattered particles do not).
  *   (B) **Non-Vagueness** (There is a sharp cutoff for existence).
  *   (C) **Principled Restriction** (There is a non-arbitrary rule for that cutoff).

  *Why:* Any principle precise enough to avoid vagueness (e.g., "bonding energy > X") will either be too broad (rocks count) or too narrow (some chairs fail), violating Common Sense. Any principle that matches Common Sense (e.g., "fastened together") is vague.
  *   *Casualty:* Usually **Common Sense** (Nihilism/Universalism) or **Non-Vagueness** (Degree theories).

  **2. The Causal Exclusion Problem**
  You cannot jointly satisfy:
  *   (A) **Causal Non-Idleness** (The jar causes the water to stay inside).
  *   (B) **Naturalistic Continuity** (Physics is causally complete; particles do all the pushing).
  *   (C) **Distinctness** (The jar is something over and above the particles).

  *Why:* If the particles do all the work, the jar does nothing (idleness). If the jar does something, it interferes with physics (violating completeness) unless it is identical to the particles (violating Distinctness).
  *   *Casualty:* Usually **Distinctness** (Identity theories) or **Non-Idleness** (Eliminativism).

  ---

  ### III. The Most Exclusionary Requirement

  The single requirement that does the most work in excluding candidates is **Non-Vagueness of Existence** combined with **Principled Restriction**.

  *   **Why:** This combination kills almost all "moderate" views. It forces you to the extremes. If existence cannot be vague, there must be a sharp line where particles stop being a heap and start being a thing. Finding a physical or metaphysical property that changes sharply at that exact moment is nearly impossible without appealing to magic or minds.
  *   **Result:** This demand forces most serious metaphysicians into **Nihilism** (nothing composes), **Universalism** (everything composes), or **Organicism** (only life composes—the only "sharp" transition we know).

  ---

  ### IV. Scorecard of Main Families

  Here is how the major theories score against your desiderata.
  *   ✅ = Satisfies
  *   ⚠️ = Strains / Requires Revision
  *   ❌ = Violates

  | Desideratum | **Nihilism** (No composites) | **Universalism** (Any parts compose) | **Organicism** (Only living things) | **Conventionalism** (Depends on us) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Non-Vagueness** | ✅ | ✅ | ✅ | ⚠️ (Vague conventions) |
  | **Principled** | ✅ (Never) | ✅ (Always) | ✅ (Life) | ❌ (Arbitrary) |
  | **Common Sense** | ❌ (No jars) | ❌ (Too many objects) | ⚠️ (No chairs/jars) | ✅ (Matches usage) |
  | **Causal Work** | ❌ (Only simples act) | ⚠️ (Overdetermination) | ✅ (Organisms act) | ⚠️ (Projected agency) |
  | **Naturalism** | ✅ | ✅ | ⚠️ (Life as special?) | ✅ |
  | **Normative Potential**| ❌ (No subjects) | ⚠️ (Trivialized) | ✅ (High) | ⚠️ (Subjective) |
  | **Diachronic Stability**| ❌ (No persistence) | ✅ (Always same sum) | ✅ (Life persists) | ⚠️ (Convention shifts) |

  ---

  ### V. Verdict on "Interests"

  You asked specifically: *Is there a fact of the matter about which entities could have interests?*

  Based on the scorecard and the tensions identified:

  1.  **If you prioritize Naturalism and Non-Vagueness:** You are pushed toward **Organicism**. Only organisms have the unified, goal-directed structure required for "interests" without violating physics.
      *   *Result:* Your sourdough starter (a colony of yeast/bacteria) **has interests**. The jar **does not**. The forest **does not** (unless viewed as a super-organism, which biology debates).
  2.  **If you prioritize Common Sense and Normative Potential:** You might lean toward **Conventionalism**. We *assign* interests to rivers or corporations for legal/moral reasons.
      *   *Result:* There is **no fact of the matter** independent of us. The river has interests only because we legislate them.
  3.  **If you prioritize Causal Non-Idleness and Distinctness:** You need a robust realist view. **Universalism** fails here because a "random scatter" has no interests. **Nihilism** fails because there are no entities to hold them.

  **The Hard Truth:**
  To maintain that there is a **mind-independent fact of the matter** about interests (your goal), you must accept **Organicism** (or a close functionalist equivalent). This requires accepting that "Life" is a metaphysically privileged category, despite biology's reluctance to treat it as physically magical.

  If you cannot accept that privilege, you must concede that "interests" are not discovered features of the universe (like mass), but projected features (like "pest" or "pet"). Your starter has interests only if you treat the colony as a single agent rather than a bucket of bugs. The metaphysics does not decide this for you; it only tells you the cost of the choice.

  **Recommendation:** For your purpose, adopt a **Functional Organicism**. Ignore the strict "life" label and ask: *Does this system maintain homeostasis and act to preserve its structure?* If yes (Starter: Yes. Jar: No. Forest: Maybe), it is a candidate for interests. This bypasses the SCQ's vagueness problem by focusing on the *capacity for interests* rather than the *fact of composition*.
