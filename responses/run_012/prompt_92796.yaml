answer: |-
  Thank you. It is an honor to stand here. I need to confess something: I spent this spring teaching a seminar on the ethics of belief. Basically, I graded papers on whether you are morally permitted to hope. So, if I seem a little tired, it's because I have been arguing with dead philosophers about whether optimism is a sin.

  You have heard a lot of advice this week. Last year, the speaker told you to "leap and the net will appear." I sat where you are sitting and fumed. That is a blank check. You are being asked to choose cities, jobs, and partners on evidence you do not have yet. If you demand proof for everything, you will never move. If you demand nothing, you might crash.

  So, here is the tool I want to give you. It comes from wrestling with two thinkers: W.K. Clifford, who said you never have a right to believe without evidence, and William James, who said sometimes you have to leap.

  I call this the distinction between load-bearing beliefs and weather beliefs.

  A load-bearing belief is one other people are standing on. If you believe your bridge will hold, your medicine is safe, or your promise is kept, you owe that belief evidence. Because if you are wrong, someone else falls. This is what your education here was for. To check the load-bearing walls of society. The trustees love this part.

  A weather belief is one that changes how you carry your own life, but where the cost of being wrong falls mostly on you. Will this city suit me? Can I learn this skill? Is there room for kindness here? You cannot prove these things in advance. They are internal weather. For these, you are permitted to let your hopes make the call. Refusing to decide is itself a decision to stay paralyzed.

  To the parents: I know you paid for certainty. I'm giving them a framework for uncertainty.

  The paralysis you feel right now comes from treating every choice like it's load-bearing. You are treating choosing an apartment like engineering a nuclear plant. You don't have the data. You never will.

  So, here is your instruction. When you leave here, audit your beliefs. Ask: "If I am wrong about this, who gets hurt?" If the answer is "everyone," gather your evidence. Be a Cliffordian. Be rigorous. Be safe. But if the answer is "mostly me," be a Jamesian. Let your need for meaning tip the scale. Choose the city that calls you. Take the job that scares you. Trust that you can fix it if it breaks.

  Do not treat your own life as a structure that must never sway. Structures that never sway break in the wind.

  You have been trained to check the load. Now learn to read the weather. Build what must hold, and let the rest be wind.
