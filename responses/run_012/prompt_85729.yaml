answer: |-
  Here is a decision tree designed to map the conceptual space of your reading group's arguments. It begins from your shared premise (traits spread via differential reproduction) and branches on the metaphysical and methodological commitments that actually divide you.

  There are **6 Nodes** (questions) and **13 Leaves** (positions).
  *   **Bold text** indicates the path taken.
  *   *[Italics]* indicate concrete cases used to frame the question.
  *   ⚠️ flags a "Same Position/Different Clothes" equivalence.
  *   ❌ flags an incoherent or unexplored combination.

  ***

  ### Node 1: The Metaphysics of Selection
  **Question:** When we say "selection caused this trait to spread," are we describing a **physical force** acting on organisms during their lives, or merely a **statistical summary** of the difference in offspring counts at the end?
  *   *Case:* If we swap two individuals' environments but they leave the same number of offspring, has the "selection pressure" changed?

  *   **A. It is a physical force (Causalism).** → Go to Node 2.
  *   **B. It is a statistical summary (Statisticalism).** → **Leaf 1**.

  > **Leaf 1: The Statisticalist / Drift-Only View**
  > *   **Position:** Selection is not a distinct process from drift; it is just the deterministic limit of sampling error.
  > *   **Awkward Commitment:** You cannot explain *why* a trait spread in a specific case, only that it *did*; "adaptation" is a post-hoc label, not a causal history.

  ***

  ### Node 2: The Medium of Heredity
  **Question:** For a trait to evolve, must the thing being copied be **DNA**, or can any mechanism of **information transmission** count?
  *   *Case:* A behaviour passed on by imitation rather than by genes (e.g., tool use in chimps or humans).

  *   **A. Only DNA counts (Geneticism).** → Go to Node 3.
  *   **B. Any copying counts (Universal Darwinism).** → **Leaf 2**.

  > **Leaf 2: Cultural Evolution / Memetics**
  > *   **Position:** Evolutionary logic applies to any replicator, including ideas, behaviours, or technologies.
  > *   **Awkward Commitment:** You must accept that "genes" have no privileged ontological status; a catchy tune and a metabolic pathway are evolutionarily identical in structure.

  ***

  ### Node 3: The Replicator vs. The Interactor
  **Question:** Is the "unit of selection" the thing that gets **copied** (the replicator) or the thing whose **survival we measure** (the interactor/vehicle)?
  *   *Case:* A gene for helping behaviour spreads, but the *organism* paying the cost is the one dying. Which one is being "selected"?

  *   **A. The thing copied (The Gene).** → **Leaf 3**.
  *   **B. The thing tested (The Organism/Group).** → Go to Node 4.

  > **Leaf 3: The Gene's-Eye View (Dawkins)**
  > *   **Position:** Organisms are temporary vehicles; genes are the only true replicators and thus the only true units of selection.
  > *   **Awkward Commitment:** You must speak metaphorically about genes "wanting" or "strategizing," despite them having no cognition, to make the explanatory language work.
  > *   ⚠️ **Flag:** This is often functionally identical to Leaf 5 (Inclusive Fitness) but uses different accounting language.

  ***

  ### Node 4: Aggregation of Fitness
  **Question:** Can we **sum or average** the reproductive success of individuals to define the fitness of a **patch or group**, or is fitness strictly a property of the reproducing individual?
  *   *Case:* A trait that only pays off if everyone in the patch has it (threshold public good).

  *   **A. Fitness is strictly individual.** → **Leaf 4**.
  *   **B. Fitness can be aggregated.** → Go to Node 5.

  > **Leaf 4: Organismal Orthodoxy (Standard Neo-Darwinism)**
  > *   **Position:** Selection acts on individuals; group effects are just environmental parameters affecting individual fitness.
  > *   **Awkward Commitment:** You must explain altruism solely through individual benefit (e.g., reciprocity or hidden selfishness), denying that group structure *itself* is a selective agent.

  > **Leaf 5: Inclusive Fitness Theory (Hamilton)**
  > *   **Position:** We count individual fitness but weight it by the relatedness of neighbors; the "group" effect is partitioned into individual gene success.
  > *   **Awkward Commitment:** You must calculate counterfactuals (what would have happened if the actor hadn't acted) which can be mathematically ambiguous in non-additive cases.
  > *   ⚠️ **Flag:** Mathematically equivalent to Leaf 6 (Weak Group Selection). The disagreement is often just bookkeeping preference.

  ***

  ### Node 5: The Ontology of the Group (MLS1 vs. MLS2)
  **Question:** For a group to be a unit of selection, must it merely **differ in composition** from other groups, or must it **reproduce as a whole** (split/bud)?
  *   *Case:* A merger in which two lineages now reproduce as one vs. a patch where individuals just survive better together.

  *   **A. Groups just differ in composition (MLS1).** → **Leaf 6**.
  *   **B. Groups must reproduce as entities (MLS2).** → Go to Node 6.
  *   **C. Groups need not exist; it's all variance partitioning.** → **Leaf 7**.

  > **Leaf 6: Weak Group Selection (MLS1)**
  > *   **Position:** Groups are collections of individuals; selection happens because individuals in some groups leave more offspring than individuals in others.
  > *   **Awkward Commitment:** The "group" disappears if you change the mathematical model; it has no persistent identity over time.
  > *   ⚠️ **Flag:** See Leaf 5. If you accept the Price Equation, Leaf 5 and Leaf 6 are the same position wearing different clothes.

  > **Leaf 7: The Price Equation Instrumentalist**
  > *   **Position:** "Levels" are just terms in a covariance equation; we can partition variance however is useful, implying no ontological reality to the levels.
  > *   **Awkward Commitment:** You cannot say one explanation is "true" and the other "false," only "useful," which frustrates causal realists.

  > **Leaf 8: Strong Group Selection (MLS2 / Group as Individual)**
  > *   **Position:** The group itself is an individual with a birth, death, and reproduction rate; internal variation is noise.
  > *   **Awkward Commitment:** You must identify clear mechanisms for group heredity (how the group copies its structure), which are rare outside of eusocial insects or human institutions.
  > *   ❌ **Incoherent Path:** If you answered "Fitness is strictly individual" at Node 4 but land here, you are contradicting yourself. MLS2 requires group-level fitness.

  ***

  ### Node 6: Higher Levels and Species
  **Question:** Can a **species** possess traits (like geographic range size) that track **speciation rates** independently of the fitness of the organisms within it?
  *   *Case:* A species-level trait like geographic range size that tracks speciation rate.

  *   **A. No, species are just collections of organisms.** → **Leaf 9**.
  *   **B. Yes, species are individuals.** → **Leaf 10**.
  *   **C. Only if species reproduce (clade selection).** → **Leaf 11**.

  > **Leaf 9: Reductionist Hierarchy**
  > *   **Position:** Species selection is just organismal selection scaled up; macroevolution is microevolution over long time.
  > *   **Awkward Commitment:** You must explain mass extinctions or broad trends solely by summing individual deaths, ignoring emergent species properties.

  > **Leaf 10: Species Selection (Stanley/Vrba)**
  > *   **Position:** Species are born, live, and die; traits affecting speciation/extinction rates are selected at the species level.
  > *   **Awkward Commitment:** You must accept that a trait can spread even if it is harmful to every individual bearing it, provided it helps the species persist.

  > **Leaf 11: Clade Selection / Macro-Evolutionary Individuality**
  > *   **Position:** Only lineages that "bud" (speciate) count as replicators; species are merely vehicles for clades.
  > *   **Awkward Commitment:** This makes "selection" an incredibly rare event, occurring only at major branching points in the tree of life.

  ***

  ### Summary of "Same Clothes" and "Empty Seats"

  **The "Same Position/Different Clothes" Flag:**
  *   **Leaf 5 (Inclusive Fitness)** and **Leaf 6 (Weak Group Selection/MLS1)** are mathematically equivalent under the Price Equation. If your group members argue fiercely between these two, they are likely arguing about *accounting conventions* (how to partition the covariance) rather than biological reality. The tree places them adjacent to highlight this.
  *   **Leaf 3 (Gene's-Eye)** and **Leaf 5 (Inclusive Fitness)** are often treated as rivals, but Inclusive Fitness is essentially the calculation method for the Gene's-Eye view in social contexts. If someone holds both, they are consistent. If they hold one and reject the other, they are confused about the replicator/vehicle distinction.

  **The "Incoherent/Unexplored" Flag:**
  *   **MLS2 without Group Fitness:** It is incoherent to claim groups are "super-organisms" (Leaf 8) but deny that fitness can be aggregated to the group level (Node 4A). This combination is marked ❌ at Leaf 8.
  *   **Statisticalism with Species Individuals:** There is a tension between Leaf 1 (Selection is just a census tally) and Leaf 10 (Species are individuals). If selection isn't a cause, it's hard to argue species are "individuals" in a causal sense. This path is unexplored/fragile.
  *   **Cultural MLS2:** There is a large empty space for "Strong Group Selection on Cultural Traits" (e.g., religions as reproducing entities). This is theoretically possible (Node 2B + Node 5B) but rarely defended rigorously compared to genetic MLS2.

  **How to use this in the room:**
  When the argument starts, ask the group to answer Node 1. If you split, stop arguing about groups and resolve the metaphysics of causation first. If you agree on Node 1 but split on Node 5, check the ⚠️ flag: you might be doing the same math with different words.
