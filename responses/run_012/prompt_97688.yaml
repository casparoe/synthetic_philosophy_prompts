  # The Epistemic Decision Tree: Lottery and Preface Paradoxes

  **Starting Commitment:** *In a fair lottery with a very large number of tickets, an agent who knows the setup is within her epistemic rights in believing, of each individual ticket, that it will not win.*

  ### The Branching Questions

  **Q1. Nature of Attitude:** Do rational doxastic attitudes come in continuous degrees (credences) or are they fundamentally all-or-nothing states (binary belief)?
  *   **Degrees:** Go to **Leaf 1**.
  *   **All-or-nothing:** Go to **Q2**.

  **Q2. Knowledge Norm:** Does believing a proposition require having warrant sufficient to *know* it (i.e., is belief normatively tied to knowledge)?
  *   **Yes:** Go to **Leaf 2**.
  *   **No:** Go to **Q3**.

  **Q3. Closure:** Must a rational agent's beliefs be mutually consistent and closed under conjunction (if you believe *P* and believe *Q*, you must believe *P & Q*)?
  *   **Yes:** Go to **Q3.5**.
  *   **No:** Go to **Q4**.

  **Q3.5. Commitment Retention:** If you answer "Yes" to Closure, do you maintain the Starting Commitment (that the agent believes each ticket loses)?
  *   **No (Reject Start):** Go to **Leaf 3**.
  *   **Yes (Keep Start):** Go to **Leaf 4**.

  **Q4. Threshold Stability:** Is the threshold of probability required for binary belief fixed across contexts or does it shift with stakes and salience?
  *   **Shifts:** Go to **Leaf 5**.
  *   **Fixed:** Go to **Q5**.

  **Q5. Attitude Type:** Is the attitude involved in the Starting Commitment genuine *belief* or a voluntary policy of *acceptance*?
  *   **Acceptance:** Go to **Leaf 6**.
  *   **Belief:** Go to **Q6**.

  **Q6. Justification Aggregation:** Does the justification for believing each conjunct automatically aggregate to justify believing their conjunction?
  *   **Yes:** Go to **Leaf 7**.
  *   **No:** Go to **Leaf 8**.

  ***

  ### The Leaves: Positions and Diagnostics

  **Leaf 1: Bayesian Orthodoxy**
  *   **Sequential Lottery:** The agent maintains high credence in each ticket losing throughout the draw; credence in "my ticket loses" never reaches 1 but remains sufficiently high to guide action until the last ticket remains. **Sequential Preface:** The author holds high credence in each claim and high credence that at least one is false; no contradiction arises in probability space. **Self-Undermining Preface:** Consistent; the final sentence simply raises the credence in the book's fallibility.
  *   **Awkward Commitment:** It denies that we ever have binary beliefs, contradicting the phenomenology of deliberation and the structure of ordinary language.

  **Leaf 2: The Knowledge Norm (Williamson)**
  *   **Sequential Lottery:** The agent *never* rationally believes a ticket will lose (even the first one) because she does not *know* it; the Starting Commitment is false. **Sequential Preface:** The author cannot believe her individual claims unless she knows them; if she knows the preface assertion, she cannot know the claims. **Self-Undermining Preface:** Incoherent; one cannot know the body and know the preface assertion simultaneously.
  *   **Awkward Commitment:** It forces the counterintuitive verdict that we lack beliefs in ordinary high-probability cases (e.g., that our car is still parked outside).

  **Leaf 3: Lottery Skepticism (Closure + Rejection)**
  *   **Sequential Lottery:** The agent must suspend belief on every ticket immediately to avoid contradiction; the Starting Commitment is false. **Sequential Preface:** The author must withhold belief from her individual claims to remain consistent with the preface. **Self-Undermining Preface:** Resolved by withholding belief from the body of the book.
  *   **Awkward Commitment:** It induces widespread epistemic paralysis, denying belief in almost any empirical generalization.

  **Leaf 4: Incoherent Dogmatism (Closure + Retention)**
  *   **Status:** **UNOCCUPIED (Incoherent).**
  *   **Diagnosis:** This view is logically empty; maintaining the Starting Commitment while enforcing Closure entails believing a explicit contradiction (All tickets lose & One ticket wins).
  *   **Awkward Commitment:** It requires rational agents to embrace explicit logical contradictions.

  **Leaf 5: Epistemic Contextualism (Hawthorne/Stanley)**
  *   **Sequential Lottery:** Belief is rational early in the draw but vanishes as the number of unexamined tickets falls and stakes rise; belief in "my ticket loses" is lost near the end. **Sequential Preface:** The author believes claims individually during writing but loses that belief when reflecting on the preface (high stakes context). **Self-Undermining Preface:** Consistent across contexts, but the agent cannot simultaneously believe the body and the preface in the same context.
  *   **Awkward Commitment:** It implies that whether an agent *believes* a proposition changes without any change in evidence, merely due to conversational context.
  *   **Convergence Note:** On the sequential lottery, this converges with Leaf 7 (Lockean) if the "threshold" is viewed as effectively shifting due to the changing probability of the remaining set.

  **Leaf 6: The Acceptance View (Cohen)**
  *   **Sequential Lottery:** The agent *accepts* each ticket loses for practical purposes but does not *believe* it; this policy holds until the last ticket, where acceptance is revoked. **Sequential Preface:** The author accepts the claims for the sake of argument but believes the preface assertion. **Self-Undermining Preface:** Consistent; one can accept the body while believing the preface assertion.
  *   **Awkward Commitment:** It creates a dual-system psychology where our theoretical reasoning (belief) is disconnected from our practical reasoning (acceptance).

  **Leaf 7: Standard Lockean Threshold (Kyburg)**
  *   **Sequential Lottery:** The agent believes each ticket loses as long as probability exceeds the fixed threshold; belief persists until the mathematical probability dips below the threshold (near the end). **Sequential Preface:** The author believes each claim and believes the preface, violating Closure but maintaining rationality. **Self-Undermining Preface:** Contradictory beliefs are held (Body & Preface), but rationality is preserved by denying Closure.
  *   **Awkward Commitment:** It sanctions believing known contradictions (the conjunction of all beliefs) by denying that rationality requires logical closure.

  **Leaf 8: Justification Non-Aggregation (Kroedel)**
  *   **Sequential Lottery:** The agent is justified in believing each ticket loses, but this justification does not sum; belief in "my ticket loses" is stable until the end. **Sequential Preface:** The author is justified in believing each claim, but not justified in believing the conjunction, so the preface belief does not conflict with individual claim beliefs. **Self-Undermining Preface:** Consistent; the justification for the body does not aggregate to conflict with the preface.
  *   **Awkward Commitment:** It implies that justification is not a stable property of propositions but depends on how many other propositions are being considered simultaneously.

  ***

  ### Structural Notes for the Seminar

  **On Empty Space:**
  **Leaf 4** is the only truly empty region of the logical space. It is not merely unexplored; it is incoherent. Any position occupying this leaf accepts the Starting Commitment (Belief in $L_i$) and Closure (Belief in $\bigwedge L_i$), which entails believing a falsehood known to be false ($\neg \diamond \bigwedge L_i$). No serious epistemologist occupies this leaf; it serves as the *reductio* that forces movement to Leaves 2, 3, 5, 6, 7, or 8.

  **On Convergence:**
  **Leaf 5 (Contextualism)** and **Leaf 7 (Lockean)** may converge on the **Sequential Lottery** outcome. If the Lockean threshold is fixed at 0.99, and the probability of "Ticket $n$ loses" drops below 0.99 when only a few tickets remain, the Lockean agent stops believing. The Contextualist also stops believing because stakes rise. To separate them, one must press the *reason* for the loss of belief: Is it the raw probability (Lockean) or the salience of error possibilities (Contextualist)?

  **On the Self-Undermining Preface:**
  This variant specifically targets **Leaf 7 (Lockean)**. In a standard preface, the author believes $C_1...C_n$ and believes $\neg(C_1 \& ... \& C_n)$. In the self-undermining variant, the last claim *is* $\neg(C_1 \& ... \& C_n)$. Leaf 7 must assert that the agent believes $C_1...C_{n-1}$ and believes $C_n$ (the error claim), thereby believing a contradiction ($C_1 \& ... \& C_n$ vs $C_n$). Leaf 7 handles this by denying that believing the parts commits one to believing the whole, but the contradiction is now *within* the set of believed propositions, making the "awkward commitment" of Leaf 7 particularly acute here.
