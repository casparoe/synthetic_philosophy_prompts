answer: |-
  It is completely understandable that you feel the pop-economic version of the no-trade theorem is doing too much heavy lifting with too much sleight of hand. The slogan version, the one your friend calls the Groucho Marx principle, is a useful heuristic for cocktail parties, but it glosses over the specific epistemic machinery that makes the theorem tick. When you strip away the humor, the core argument is actually a profound statement about information and inference rather than a simple claim about greed or market efficiency. To understand why the theorem holds, and why it fails in the real world, you have to look closely at what happens when two rational agents confront each other with a potential trade. The mechanism relies on the idea that in a purely speculative market, where the only reason to trade is a difference of opinion about an asset's future value, the act of offering a trade is itself a signal. If I offer to sell you a stock, I am implicitly telling you that I believe the stock is overvalued at the current price. If you are rational, you do not ignore this signal. You update your own belief about the stock's value based on the fact that I am willing to sell. If we share the same prior beliefs about how the world works, and we both know that the other is rational, your updated belief should move toward mine. In fact, under the strict assumptions of the theorem, your belief should move enough that there is no price left where we both think we are winning. If I think it is worth less than the price, and you realize I think that, you should also think it is worth less, or at least not enough more to justify buying it from me. The profit opportunity evaporates because the information contained in the offer itself corrects the disagreement that motivated the offer.

  The assumption that carries the most weight here is undoubtedly the common prior assumption. This is the linchpin. A common prior means that before either of us received our private information or signals, we would have assigned the exact same probabilities to every possible state of the world. We agree on the structure of the universe, even if we have seen different parts of it. If you and I have different priors, the theorem collapses immediately. If I start out believing that tech stocks are fundamentally prone to bubbles and you start out believing they are fundamentally driven by innovation, we can look at the exact same earnings report and come away with different valuations. I see confirmation of a peak, you see confirmation of growth. Because we disagree on the underlying model of reality, my willingness to sell does not necessarily signal to you that I have seen bad news; it might just signal that I am operating under a different model. In that case, you can happily buy from me because you think my model is wrong and yours is right. The no-trade theorem essentially says that if we agree on the model, we cannot agree to disagree about the implications of the data once we know each other's positions. So when you ask if this is an impossibility result about markets or beliefs, the honest answer is that it is primarily an impossibility result about beliefs, which then imposes a constraint on markets. It tells us that genuine speculative trade cannot exist between rational agents who share a common understanding of probability unless they have different information, and even then, once they know each other's trading intentions, the information asymmetry should theoretically resolve itself.

  You also asked what the common knowledge of rationality adds on top of everybody just being rational. This is where the infinite regress comes in, and it is subtle. It is not enough that I am rational and you are rational. It must be that I know you are rational, and you know I am rational, and I know that you know that I am rational, and so on forever. If this chain breaks at any point, trade becomes possible again. Suppose I am rational, and you are rational, but I suspect that you might be irrational or prone to panic. If I think there is a chance you are selling simply because you are scared rather than because you have bad information, I might be willing to buy from you. I would be betting that your signal is noise rather than information. The common knowledge assumption closes this loophole by ensuring that we both know that neither of us is making a mistake. We both know that any offer made is strictly the result of a calculated optimization based on private information. This mutual certainty forces the inference chain to complete fully. Without common knowledge, I can always harbor a doubt that you are a noise trader, and that doubt is enough to justify taking the other side of the bet.

  This leads directly to the escape hatches you are looking for, because in the real world, almost every one of these assumptions is violated. The most obvious violation is the presence of noise traders or liquidity traders. These are agents who trade for reasons unrelated to information or speculative profit. They might need cash for a house down payment, they might be rebalancing a pension fund, or they might just be behaving irrationally. Their presence is actually essential for real-world markets to function. If everyone were a rational informed trader, the no-trade theorem suggests the market would freeze. But because there are noise traders, informed traders can hide their information. If I know something bad about a stock, I can sell it, and you might buy it not because you think I am wrong, but because you think I might just be a liquidity trader needing cash. The noise provides cover that prevents the price from instantly revealing all private information. This is why you see so much volume in markets; much of it is not a duel of wits between two informed speculators, but rather informed traders picking off noise traders, or noise traders trading with each other.

  Another major escape hatch is the distinction between speculative trade and non-speculative trade. The no-trade theorem specifically targets speculative trade, which is trading based purely on differences in information about an asset's value. It does not apply to trade driven by differences in risk tolerance, endowments, or consumption needs. If I own a house and you own cash, we might trade even if we agree perfectly on the future price of the house. I might want to diversify my risk, or you might need a place to live. This is gains from trade based on comparative advantage or insurance, not based on me thinking the house is worth more than you do. Similarly, if I am more risk-averse than you, I might sell you a risky asset even if we agree on its expected return, simply because I want safety and you want exposure. The theorem is often waved around by skeptics to say markets are irrational, but defenders use it to say that most volume must be liquidity or hedging driven. Both are partially right. The theorem proves that pure speculation based on information asymmetry is unstable among rational agents with common priors, so any persistent speculative volume implies either different priors, bounded rationality, or the presence of non-speculative motives.

  Regarding your question about the relationship between the no-trade theorem and the idea that rational people cannot agree to disagree, they are indeed tightly tied, essentially sharing the same engine. The result you are referring to is Aumann's Agreeing to Disagree theorem. It is the epistemic ancestor of the no-trade theorem. Aumann showed that if two people have common priors and their posterior beliefs are common knowledge, then their posterior beliefs must be identical. They cannot know that they disagree. The no-trade theorem, developed later by economists like Milgrom and Stokey, applies this logic to actions. If our beliefs must be the same once we share information, then there is no basis for a bet. A bet requires me to think the probability of an event is higher than you do. If Aumann's theorem holds, we cannot sustain that difference in probability once we know each other's positions. So you are correct to suspect that the epistemology is the interesting part and the trading is almost a sideshow. The no-trade theorem is essentially Aumann's result dressed up in economic clothing with utility functions and prices. It translates the impossibility of divergent beliefs into the impossibility of mutually beneficial speculative bets.

  So when you write your piece, the fair reading is that the theorem is a benchmark, a null hypothesis, rather than a description of reality. It tells us what would happen in a world of perfect epistemic alignment. The fact that trade does happen tells us something about where the real world deviates from that ideal. It suggests that either people do not share common priors, which is a claim about psychology or culture, or that people are not fully rational, which is a claim about cognitive limits, or that there are significant non-speculative motives for trading, which is a claim about market structure. The most honest escape hatch is probably the common prior assumption. It is extremely demanding. It requires that everyone in the market interprets the structure of uncertainty in the exact same way before they get their private news. In finance, this is rarely true. Trainers have different models, different experiences, and different heuristics. If you drop the common prior assumption, the theorem falls apart, and disagreement becomes possible again. You can have two rational people looking at the same data and disagreeing because they started with different fundamental beliefs about how the data generates outcomes.

  Ultimately, the theorem is not proof that markets are impossible or that disagreement is illusory. It is a proof that disagreement is expensive. If you want to trade against someone who you know is rational and well-informed, you have to ask yourself why they are taking the other side of the bet. If you cannot find a reason like liquidity needs or hedging, you have to assume they know something you do not. The value of the theorem for your readers is that it forces a discipline of thought. It asks us to distinguish between trading because we have different information, trading because we have different models, and trading because we have different needs. The pop version says never trade with someone who wants to trade with you. The real version says you can only trade with someone who wants to trade with you if you can explain why their willingness to trade does not imply they know something that should change your mind. That explanation usually lies in the escape hatches: they need liquidity, they are hedging, or they simply see the world differently than you do. The theorem survives not as a description of how markets work, but as a rigorous definition of the conditions under which they would stop working, and that distinction is where the real story lies.
