prompt: |-
  I'm a software engineer and for the last several months I've been on a mech interp team, mostly training sparse autoencoders on a mid-size transformer's residual stream, labeling the features that fall out, then testing them by steering and ablating. Our internal rubric is roughly: a feature counts as "load-bearing" if ablating it drops benchmark accuracy by more than a couple percent and steering it in the labeled direction moves the output the way the label says; if it just lights up on some inputs but nothing happens when we poke it, we call it "decorative," write it in the appendix, and move on. My roommate did a philosophy minor and keeps needling me about what we think we're actually doing — are these features things the network has, or just things we made up and then found again? — and I've been brushing it off, but I'd like to actually give him an answer.

  So: what view of representation does this whole pipeline presuppose? It seems like we're committed to features being real internal states of the model that we discover rather than impose, but I can't tell if that's something the practice actually requires or just a habit of speech. Which rival pictures does it quietly rule out — that the features are just useful fictions, that representation talk is a category error and we should only talk about input-output behavior, that a "feature" is nothing over and above whatever a linear probe can decode? And here's the part that bugs me: our rubric makes causal efficacy (steering, ablation) the test of whether a feature is real, but half the features in our appendix are purely correlational and we still call them features, and meanwhile the same team will tell you with a straight face that the model doesn't really have beliefs or goals. Is that consistent, or are we running two incompatible theories at once? A colleague also keeps saying that any invertible change of basis on the residual stream gives you an equally good SAE with different features, so asking which features are real is like asking which basis of a vector space is the real basis — I don't know if that's a genuine objection or a trick. Reconstruct the implicit theory of representation our practice presupposes, separate what it strictly needs from what it just fits nicely with, say where it's underdetermined (i.e. where several theories would license the same practice), and tell me what would have to change in how we do the work if we swapped it for the deflationary view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Software engineer on a mechanistic interpretability (mech interp) team.
      *   **Task:** Training Sparse Autoencoders (SAEs) on a transformer's residual stream, labeling features, testing via steering/ablation.
      *   **Rubric:** "Load-bearing" = causal impact (ablation drops accuracy, steering changes output per label). "Decorative" = correlates but no causal impact.
      *   **Conflict:** Roommate (philosophy minor) asks: Are features *real* (discovered) or *constructed* (imposed)?
      *   **Specific Questions:**
          1.  What view of representation does this pipeline presuppose?
          2.  Is the commitment to "real internal states" required by practice or just habit?
          3.  Which rival pictures does it rule out (instrumentalism, behaviorism, probe-based reductionism)?
          4.  Is the causal rubric consistent with keeping "decorative" features and denying model beliefs/goals?
          5.  How to respond to the "change of basis" objection (are features basis-dependent)?
          6.  Reconstruct the implicit theory: separate necessary commitments from nice-to-haves.
          7.  Identify underdetermination (where multiple theories fit the practice).
          8.  What would change if we adopted a deflationary view?

  2.  **Initial Analysis & Philosophical Mapping:**

      *   **The Practice:** SAEs find a sparse basis. Steering/ablation tests causality.
      *   **The Implicit Ontology:** Realism about features (at least the load-bearing ones). They exist independently of the observer to some degree.
      *   **The Roommate's Challenge:** Anti-realism/Constructivism. Features are just projections we find useful.
      *   **The Colleague's Challenge:** Basis invariance. If $V \cong \mathbb{R}^n$, any basis works. Why is the SAE basis *special*?
      *   **The Tension:** Causal efficacy vs. Correlational existence vs. Denial of high-level mental states (beliefs).

  3.  **Drafting the Core Argument (The "Implicit Theory"):**

      *   *Name:* Let's call it **Causal Structural Realism** (with a dash of Functionalism).
      *   *Core Claim:* Features are real insofar as they participate in the causal mechanism of the model's computation.
      *   *SAE Role:* The SAE isn't just a compressor; it's a *hypothesis generator* about the native basis of computation.
      *   *Sparsity:* The assumption is that the model *uses* a sparse overcomplete basis, not just any basis. This answers the "change of basis" objection. The model's hardware (weights) breaks the symmetry of the vector space.

  4.  **Addressing Specific Tensions:**

      *   *Causal vs. Decorative:* Why keep decorative ones? Because they might be real *representations* (side effects, epiphenomena, or inputs to other circuits not tested yet) even if not *load-bearing* for the specific benchmark. Realism $\neq$ Functional Necessity.
      *   *Features vs. Beliefs:* Consistent. Features are low-level mechanistic primitives (like transistors or logic gates). Beliefs are high-level folk-psychological constructs. You can believe in transistors without believing the calculator "wants" to add.
      *   *Change of Basis:* The "Basis Objection" fails if the model's computation is *non-linear* and *sparse*. Linear transformations preserve information but not *computational structure*. If the model computes $ReLU(Wx)$, the basis matters. SAEs try to align with the directions the non-linearities actually gate.

  5.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the roommate's skepticism but side with the engineering practice (mostly).
      *   **Section 1: The Implicit Ontology (Causal Structural Realism).** Define what "real" means in this context. It's not Platonic; it's mechanistic.
      *   **Section 2: The Basis Objection.** Address the colleague's linear algebra argument. Explain why sparsity + non-linearity breaks basis invariance.
      *   **Section 3: The Tension (Causal vs. Decorative vs. Beliefs).** Resolve the inconsistency charge. Distinguish *mechanistic reality* from *functional necessity* and *folk psychology*.
      *   **Section 4: Underdetermination.** Where could other theories fit? (Instrumentalism, Predictive Processing).
      *   **Section 5: The Deflationary Swap.** What if the roommate is right? How does the work change? (Focus on compression, drop "discovery" language, focus on probes).
      *   **Conclusion:** Summary advice for the roommate conversation.

  6.  **Refining the Philosophical Nuance (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say features are *definitely* real. The prompt asks what the *practice presupposes*.
      *   *Nuance:* The "decorative" features are tricky. If they have no causal power, in what sense are they real? Answer: They might be *byproducts* of the real basis (like heat from a CPU) or *redundant* encodings. Or, the ablation test was too blunt.
      *   *Nuance:* The "Beliefs" denial. This is a level-of-abstraction issue. Features are sub-symbolic. Beliefs are symbolic/semantic. Denying the latter doesn't deny the former.
      *   *Key Insight:* The SAE assumes the **Polysemanticity Problem** is solved by **Superposition**. The "real" features are the ones the model *actually uses in superposition*.

  7.  **Final Polish:**

      *   Ensure the tone is respectful to both the engineer and the philosopher.
      *   Use terminology familiar to mech interp (superposition, polysemanticity, residual stream).
      *   Make sure the "What would change" section is concrete (metrics, papers, goals).

  8.  *(Self-Correction on the "Basis Objection"):* I need to emphasize that the residual stream is a vector space, *but* the attention heads and MLPs act on it. The weights define a preferred geometry. The SAE tries to recover that geometry. If the model uses sparse coding, the $L_1$ penalty finds the "natural" basis, not just *a* basis.

  9.  *(Final check on the "Deflationary View"):* If features are fictions, SAEs are just lossy compressors. Steering becomes "adversarial perturbation" rather than "semantic manipulation."

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts.)
answer: |-
  This is a sharp set of questions. You are effectively asking for the metaphysics of your own engineering pipeline. The short answer is: your practice presupposes a view I would call **Causal Structural Realism**, but you are getting away with it by smuggling in a lot of instrumentalist assumptions when it suits you. Your roommate is right to be suspicious, but your colleague's linear algebra objection is technically wrong in the context of non-linear computation.

  Here is the reconstruction of the implicit theory your team is operating under, where it holds, where it wobbles, and what would break if you took the deflationary view seriously.

  ### 1. The Implicit Ontology: Causal Structural Realism

  Your pipeline presupposes that the model's internal state space is not a homogeneous soup of information, but has a **preferred geometry** determined by the model's weights and activation functions.

  *   **The Claim:** "Features" are not just projections you find convenient; they are the *native variables* of the model's computation. When you train an SAE with an $L_1$ penalty, you are not just compressing data; you are hypothesizing that the model itself uses a sparse, overcomplete basis to compute (the theory of **superposition**).
  *   **The Reality Condition:** A feature is "real" if it corresponds to a direction in activation space that the downstream mechanisms (MLPs, attention heads) actually read from and write to.
  *   **Why Causality?** You use ablation and steering as the truth test because, in this view, representation is inherently tied to **functional role**. A direction that correlates with "dog" but doesn't cause "dog-like" behavior when manipulated is, mechanistically speaking, epiphenomenal. It's a shadow, not a gear.

  **What this rules out:**
  1.  **Radical Behaviorism:** The view that only input-output pairs matter. Your work assumes the black box has internal structure that explains the behavior.
  2.  **Probe-Reductionism:** The view that "a feature is whatever a linear probe can decode." Probes can decode information that is present but *unused* (incidental). Your ablation rubric explicitly rejects this; you care about *use*, not just *presence*.
  3.  **Basis Relativism:** The view that any rotation of the residual stream is equally valid. (More on this below).

  ### 2. Addressing the Colleague's "Change of Basis" Objection

  Your colleague argues that because the residual stream is a vector space, any invertible linear transformation gives an equally valid basis, so asking for the "real" one is a category error.

  **This objection fails because the model is non-linear.**

  If the transformer were a purely linear network, your colleague would be right. A rotation of the input would just result in a rotated output, with no change in function. But the transformer has non-linearities (ReLU, GELU, Softmax, LayerNorm). These non-linearities break the rotational symmetry of the vector space.
  *   **The Constraint:** An MLP applies a non-linearity to a projection of the residual stream. It cares about the *axis-aligned* values in its specific weight basis.
  *   **The SAE Bet:** By training an SAE with sparsity constraints, you are betting that the model's weights have aligned themselves during SGD to a basis where semantic concepts are locally linear and sparse.
  *   **The Verdict:** The "real" basis is the one that aligns with the axes of the model's non-linearities. If you rotate the residual stream arbitrarily, you destroy the sparsity and the interpretability of the MLP layers. Therefore, the basis is not arbitrary; it is fixed by the computational graph.

  ### 3. Resolving the Tensions (Decorative Features & Denied Beliefs)

  You identified a seeming inconsistency: You demand causal efficacy for "load-bearing" features, yet you keep "decorative" (correlational) features in the appendix, while simultaneously denying the model has "beliefs."

  **This is actually consistent under a Mechanistic Realist view, provided you distinguish levels of abstraction.**

  *   **Decorative Features:** Why keep them? Because "causal efficacy" is context-dependent. A feature might be decorative for *benchmark accuracy* but load-bearing for *loss landscape stability* or *training dynamics*. Alternatively, it might be a "read-only" feature—a state that is computed for one circuit but happens to correlate with a concept you care about. Calling it a "feature" acknowledges it is a distinct direction in the space, even if it's not a bottleneck for the specific task you tested. It is ontologically real (a distinct vector) but functionally redundant for your specific test.
  *   **Denial of Beliefs:** This is not inconsistent. You are realists about **sub-symbolic primitives** (features), not **folk-psychological states** (beliefs/goals).
      *   *Analogy:* You can believe a transistor is a real physical object that causally affects voltage without believing the CPU "wants" to calculate the sum.
      *   *The Theory:* "Belief" implies a coherent, global state of the agent. "Feature" implies a local, sparse activation. Your practice assumes the model is a bag of heuristics (features) rather than a unified agent. Denying the latter is compatible with affirming the former.

  ### 4. Where the Theory is Underdetermined

  There are places where your practice works, but the "Realist" story isn't strictly required. This is where your roommate has leverage.

  *   **The "Useful Fiction" View (Instrumentalism):** You could argue that SAE features are just a *human-comprehensible interface* we impose on the model. The model doesn't "have" a "dog feature"; it has a complex high-dimensional manifold. The SAE just finds a coordinate system that *humans* can understand.
      *   *Why practice doesn't rule this out:* If steering works, it works. Whether the feature was "there" waiting for you or you "carved" it out of the continuum doesn't change the engineering outcome. The success of steering is compatible with both Realism (we found the gear) and Instrumentalism (we found a lever that happens to move the gear).
  *   **The "Cluster" View:** Perhaps features aren't single directions (lines) but clusters of activations. The SAE forces them into lines for mathematical convenience. Your practice assumes the "direction" hypothesis, but the data might support a "region" hypothesis equally well.

  ### 5. What Changes if You Swap to the Deflationary View?

  If you adopted your roommate's skepticism (that features are useful fictions/projections rather than discovered entities), your engineering practice would shift in specific, tangible ways:

  1.  **Language Shift:** You would stop saying "we discovered a feature" and start saying "we constructed a projection." You would stop talking about "monosemanticity" as a property of the model and treat it as a property of the *SAE-model pair*.
  2.  **Metric Change:** You would care less about **Auto-interpretability** (can a human label this?) and more about **Task Performance** (does this compression preserve loss?). The "appendix" of decorative features would be deleted, not archived, because if they don't causally impact the output, they are noise in a deflationary view.
  3.  **Steering vs. Perturbation:** "Steering" implies guiding an existing semantic variable. In a deflationary view, you are performing **adversarial perturbation**. You wouldn't expect the effect to be as clean or composable. You would be more surprised when steering *does* work, rather than expecting it to work.
  4.  **Basis Agnosticism:** You would be more open to non-sparse bases (e.g., PCA, random projections) if they compress well, rather than fixating on sparsity as "truth." Sparsity would be a regularization tool for human comprehension, not a hypothesis about the model's native code.
  5.  **No "Circuit" Talk:** You would hesitate to link features into "circuits." If features are projections, chaining them together is like chaining together shadows. You would focus more on end-to-end gradient-based explanations rather than feature-graph explanations.

  ### Summary for Your Roommate

  You can tell him this:

  > "We are operating under **Causal Structural Realism**. We believe the model's non-linearities break the symmetry of the vector space, creating a 'preferred basis' that SGD finds. We treat features as real if they are causally efficacious in that basis.
  >
  > You are right that we can't prove they aren't just useful fictions (Instrumentalism). But if they were *just* fictions, steering wouldn't compose, and ablation wouldn't have such specific effects. The fact that we can surgically remove 'dog-ness' without breaking 'grammar-ness' suggests the structure is there in the weights, not just in our labels.
  >
  > We deny 'beliefs' because that's a high-level agent claim. We affirm 'features' because that's a low-level mechanistic claim. That's not a contradiction; it's just distinguishing the transistor from the user."

  **The Verdict:** Your practice is philosophically robust *provided* you accept that sparsity + non-linearity creates objective structure in the vector space. If you drop that, you're just doing fancy PCA with extra steps. The fact that steering works suggests you haven't dropped it.
