answer: |-
  It is completely understandable why this feels contradictory to you. On the surface, saying 'I am powerless' and 'I am in charge' looks like a logical error. However, in the world of addiction treatment, this isn't a mistake; it is a deliberate paradox. Both halves can be true at once, but they apply to different things.

  To give you an honest answer for when your brother asks you, you need to understand the distinction the programme is trying to make. Here is how those two opposing ideas fit together, and which one is doing the heavy lifting.

  ### 1. Powerlessness over the *substance*, not the *self*
  When your brother stood up in that first month and admitted he was powerless, he wasn't admitting he was a helpless human being. He was admitting he was powerless over the *alcohol*.

  For many people with severe addiction, the brain's reward system gets hijacked. The 'wiring' the staff mentioned refers to this. Once the drink is introduced to the system, the compulsion takes over. Willpower often stops working at that point. Admitting powerlessness is about stopping the fight against reality. It breaks the cycle of 'I'll just have one' or 'I can control it this time'. That is why he found it freeing: it stopped him from trying to win a game that was rigged against him.

  ### 2. Responsibility for the *response*, not the *urge*
  The second half of the programme, where he must own his choices, is about what happens *between* the urge and the action. He is not responsible for the craving turning up (the wiring), but he is responsible for what he does when it does (the next move).

  If he views himself as entirely powerless, he becomes a victim of his biology, which leads to hopelessness. If he views himself as entirely in charge, he relies on willpower, which often fails against addiction. The middle ground is: 'I cannot control the storm, but I can steer the ship.'

  ### So, which half is doing the work?
  Both are essential, but they do different jobs at different times.

  *   **The 'Powerlessness' part does the work of acceptance.** It removes the shame of the past. It allows him to stop beating himself up for why he couldn't stop years ago. It acknowledges the severity of the illness.
  *   **The 'Responsibility' part does the work of recovery.** It builds the future. It prevents him from using his addiction as an excuse for bad behaviour moving forward. It gives him agency.

  If you had to pick one that keeps him sober *today*, it is the responsibility part. But he likely couldn't have got to the responsibility part without the surrender of the first part.

  ### How to answer his question honestly
  You mentioned you want to give him an honest answer, not just a comforting one, when he asks: 'Do you believe I could have stopped?'

  This is the tricky bit. If you say 'Yes', you imply he chose to suffer, which induces shame. If you say 'No', you might undermine his current sense of agency.

  The honest truth, based on the model he is learning, lies in the timing.
  *   **Then:** At the height of his addiction, with his brain 'wired' as it was, the ability to choose was effectively removed. The disease had compromised his freedom. So, in a practical sense, no, he likely couldn't have stopped *on his own* at that time.
  *   **Now:** In recovery, with new tools and awareness, he has regained the power to choose.

  A British way of putting this to him, which is honest but supportive, might be:

  > 'I don't think you could have stopped *then*, not once the addiction had taken hold like that. It wasn't a fair fight. But I do believe you can stay stopped *now*, because you're doing the work to handle the next move.'

  ### A word on his annoyance
  It is worth noting that his annoyance with you is common. He has found a framework that is finally making sense of the chaos in his head. When you point out the contradiction, even logically, it can feel like you are pulling at a loose thread in a jumper that's keeping him warm. He is clinging to the 'next move' phrase because it gives him control.

  You are right that it isn't just a word game; language shapes how we view responsibility. But in this specific context, the contradiction is the point. It is meant to hold two truths in tension: 'I have a severe problem I didn't choose' and 'I have a solution I must choose.'

  If you can validate that both are true, you won't be splitting hairs; you'll be backing up the very lesson his rehab is trying to teach him.
