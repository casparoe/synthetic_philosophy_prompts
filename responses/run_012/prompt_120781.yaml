  *(Self-Correction during drafting)*: I need to be careful not to endorse the rehab's specific policy on "kicking out" if he slips, as that can be controversial, but I must address the *philosophy* behind it as described by the user. Focus on the conceptual framework rather than the punitive aspect.

  *(Refining the "Could I have stopped" answer)*: This is the crux. If I say "No", it validates the disease model. If I say "Yes", it induces shame. The nuanced answer is: "At that time, with that illness, effectively no. But now, yes."

