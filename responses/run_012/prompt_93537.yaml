answer: |-
  Friends, family, colleagues, and trustees who are wondering if the open bar counts as a taxable benefit: welcome.

  We are here to honor a colleague who has spent a lifetime studying how four great democracies pay for their prayers. That sounds dry. But what [Colleague's Name] actually studied was where the state hides its hands when it thinks no one is looking.

  Tonight, I cannot thank [Name] for advancing secularism. I cannot praise them for defending religious freedom. Not because those things are unimportant, but because [Name]'s work shows us that those words are often the curtain, not the stage. Their thesis—the one that kept them awake at night and now keeps us honest—is simpler and darker: there is no such thing as the absence of an establishment. There is only the relocation of it into the fiscal and administrative machinery of the state.

  Consider the four jurisdictions [Name] mapped for us.

  In England, the establishment is obvious. There is a state church. But look closer. The pews are empty. The compulsory taxes were abolished centuries ago. It is funded now by historic endowments and voluntary plates. The state prefers a church, but the people have quietly stopped paying the bill.

  In Germany, there is no state church. Yet, open your tax return. There is a line item where you declare your faith. The state collects the church tax as a surcharge on your income. If you wish to leave the church, you do not write a letter to a bishop; you make a declaration to a civil authority. In Germany, the state administers apostasy.

  In France, the state and church separated in 1905. Or so the constitution says. But drive east to Alsace-Moselle. There, the Concordat of 1801 survives. The state pays the salaries of the clergy. Religious instruction is taught in state schools. The border moves, and the establishment returns.

  Then, there is the United States. The country that shouts the loudest about separation. It establishes nothing. It exempts churches from tax. But follow the money. To grant that exemption, the Revenue Service must decide what counts as a church. They must decide what counts as religion. A bureaucrat in Washington must distinguish a sermon from a speech.

  Do you see the inversion? [Name] taught us that the state's doctrinal judgments are largest exactly where the country's self-description is most separationist. In England, the church defines itself. In America, the IRS defines the church.

  So, how do we thank [Name]? We do not thank them for making the world more secular. We thank them for making the world more visible.

  When the rest of us were reading constitutions, [Name] was reading ledgers. When we were listening to rhetoric about freedom, [Name] was listening for the click of the tax assessor's stamp. They showed us that the state never truly lets go of the divine; it just changes the method of collection. They did not fight for the separation of church and state; they showed us that the two are married in the basement of the treasury.

  For the family here: [Name] loved this work not because it was complicated, but because it was true. They cared less about what governments say they do, and more about what they actually do. That is a rare integrity.

  So, raise your glasses. To [Name]. May your retirement be free of audits, free of establishment, and funded entirely by voluntary endowment. Cheers.

