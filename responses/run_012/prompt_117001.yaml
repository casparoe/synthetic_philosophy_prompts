  The Work at Sight

  The cotton lies within the iron pot.
  The flame rises up to a boiling hot.
  The fiber takes the whole of the lot.
  God does the work at touch's mere sight.

  The coal rests near the dry winter reed.
  The ember glows with a hungry feed.
  Black stains mark the completed seed.
  God does the work at touch's mere sight.

  The man stands firm in the heated place.
  The fire climbs up around his face.
  The skin stays whole without a trace.
  God does the work at touch's mere sight.

  The oil rises up the woven wick.
  The flame moves forward with a sudden lick.
  The light goes out at a final prick.
  God does the work at touch's mere sight.

  The hand rests on the iron grain.
  The blister forms from the hidden pain.
  The red mark stays; a drop of rain.
  God does the work at touch's mere sight.

  The sun beats down with a heavy glow.
  The grass turns brown; the heat sits low.
  The earth turns dry; the waters go.
  God does the work at touch's mere sight.

  Note on the form

  This poem enacts al-Ghazālī's occasionalism through strict formal constraints. The six quatrains represent discrete events; no image or subject carries from one stanza to the next, ensuring that no causal narrative develops across the poem. Each quatrain employs a unique rhyme sound for its first three lines, isolated from all other stanzas, mirroring the philosophical claim that conjunctions are not necessary connections. Every line is end-stopped to prevent syntactic flow, forcing a pause that resets the relation between images.

  The fourth line is an invariant refrain: "God does the work at touch's mere sight." It names the Agent without specifying means, asserting divine volition as the sole constant. There are no connectives—causal or adversative—anywhere in the text. Events are juxtaposed purely; the reader infers recurrence without logical glue.

  The third stanza depicts the exception: the body unburned in fire. It bears no formal distinction from the stanzas describing burning. The rhyme, rhythm, and refrain remain identical. This structural uniformity reflects the doctrine that the exception is not a violation of nature but a different volition of the same Agent. The fire does nothing in either case; God acts in both. The form denies the fire agency by denying the poem causal syntax.
