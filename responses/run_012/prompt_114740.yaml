prompt: |-
  My two housemates have been going at each other all week about something a friend of ours did — she signed up for one of those paid memory studies, a couple of hours of button-pressing for cash. What nobody told her (no one lied, it just never came up) is that the data gets sold on to a marketing firm afterwards. She'd been up about thirty hours finishing her disseration and she was completely skint, and the money was the only reason she was there at all. She now says she'd never have agreed if she'd known, and that they never really got her consent.

  Sam says consent is always consent to a description — you say yes to some particular account of what's going to happen, and if what actually happens is something else then you didn't consent to it, full stop. Silence does the same work a lie would do, so it makes no difference that nobody said anything false.

  Alex says that can't be the standard, or no one ever consents to anything, since nobody knows every downstream use of what they hand over. Alex says the real question is what she had a right to know, and that's fixed by the norms of the practice rather than by consent itself. Alex also points out she'd probably have signed anyway, since she was there for the money — so on any but-for test the omission didn't do any work at all.

  Sam says that test is horrible, because it makes consent hinge on how desperate you are: the more you need the money, the less anything you weren't told can count. And anyway, forget the information — she was broke, this was the only offer she had that week, and a yes squeezed out of someone with no decent alternative isn't consent, it's just the least bad option. Alex says an offer with bad alternatives is still an offer, and if that counts as coercion then so does every wage, and the word stops meaning anything. Sam says that's exactly the work the word should be doing — it's pointing at the background that made the choice unfree.

  Then there's the sleep thing. Alex says being knackered isn't incompetence: capacity is task-specific, and she understood 'we will sell your data' perfectly well. Sam says you can understand a sentence and still not be in any state to consent to it.

  Neither of them will budge and I'm sick of being asked to referee. Can you go through it move by move and say who's right at each step, and what both of them are missing? Point by point, please, not just an overall verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Scenario:** Two housemates (Sam and Alex) are arguing about a friend's participation in a paid memory study where data was sold to marketing without her prior knowledge. She was sleep-deprived (30 hours awake) and financially desperate.
      *   **The Conflict:** Sam argues consent was invalid due to omitted information, coercive circumstances, and impaired capacity. Alex argues consent was valid based on norms, counterfactuals (she would have done it anyway), and the definition of coercion/offers.
      *   **Task:** Go through the argument move-by-move, evaluate who is "right" (or rather, the strength of their philosophical/legal positions), and identify what *both* are missing.
      *   **Format:** Point-by-point analysis, not just an overall verdict.
      *   **Tone:** Neutral, analytical, philosophical but accessible (since I'm mediating a housemate dispute).

  2.  **Deconstruct the Arguments (Move-by-Move):**

      *   **Point 1: Omission vs. Lie (The Nature of Disclosure)**
          *   *Sam:* Consent is to a description. If reality $\neq$ description, no consent. Silence = Lie.
          *   *Alex:* Impossible to know all downstream uses. Standard should be "right to know" based on norms, not perfect information.
          *   *Analysis:* Sam has a strong deontological/intentional view. Alex has a pragmatic/normative view. In research ethics (Belmont Report, etc.), Sam is closer to the rule (material information must be disclosed). Alex is closer to contract law (reasonable expectations).
          *   *Missing:* The concept of *materiality*. Not every detail matters, but financial use of data is usually material.

      *   **Point 2: The Counterfactual ("But-For" Test)**
          *   *Alex:* She would have signed anyway (needed money). Omission didn't change the outcome.
          *   *Sam:* That makes consent hinge on desperation.
          *   *Analysis:* Alex is using a causal test (did the lie cause the harm?). Sam is attacking the moral validity of that test. Legally, fraud often invalidates consent regardless of whether you would have done it for other reasons (though damages might differ). Ethically, Sam is right that "I would have exploited you anyway" isn't a defense for exploitation.
          *   *Missing:* Distinction between *validity* of consent and *causation* of harm.

      *   **Point 3: Coercion vs. Hard Choices (Desperation)**
          *   *Sam:* No decent alternative = no consent (coercive background).
          *   *Alex:* Bad alternatives exist everywhere (wages). If this is coercion, the word loses meaning.
          *   *Analysis:* Classic philosophical debate (Wertheimer vs. others). Alex defends the "baseline" of market offers. Sam argues the baseline itself is unjust. In research ethics, "undue inducement" is a real concern.
          *   *Missing:* The distinction between *coercion* (threat) and *undue inducement* (offer). Also, the specific vulnerability of students/research subjects.

      *   **Point 4: Capacity and Sleep Deprivation**
          *   *Alex:* Task-specific capacity. She understood the sentence.
          *   *Sam:* Understanding sentences $\neq$ capacity to consent.
          *   *Analysis:* Alex is legally closer (capacity is usually binary or task-specific). Sam is ethically closer (30 hours awake is severe impairment). IRBs (Institutional Review Boards) would likely flag 30-hour sleep deprivation as a capacity risk.
          *   *Missing:* The difference between *legal capacity* and *functional understanding/appreciation*.

  3.  **Synthesize "What They Are Missing" (The Meta-Analysis):**
      *   **Research Ethics Framework:** Neither is explicitly citing the Belmont Report, GDPR, or IRB standards. This isn't just a philosophical puzzle; it's a regulated activity.
      *   **The Power Dynamic:** It's a study. There's an institutional responsibility higher than individual consent.
      *   **The "Friend" Aspect:** They are arguing about a third party. The moral duty to the friend vs. abstract principles.
      *   **Remedy:** They are arguing about *past validity*, not *future action*. What actually needs to happen now?

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Validate that both have strong philosophical traditions behind them.
      *   *Section 1: The Omission (Information).* Sam wins on research ethics standards. Alex wins on general contract practicality. *Missing:* Materiality.
      *   *Section 2: The Counterfactual (Would she have done it?).* Sam wins morally. Alex wins causally. *Missing:* Autonomy isn't just about outcomes.
      *   *Section 3: Desperation (Coercion).* Alex wins on definition of coercion. Sam wins on "undue inducement." *Missing:* Vulnerability protections.
      *   *Section 4: Sleep (Capacity).* Alex wins on legal definition. Sam wins on medical reality. *Missing:* Functional assessment.
      *   *Conclusion/Verdict:* Who is "more" right? In the context of *human subjects research*, Sam is much closer to the actual regulations. Alex is applying general market logic to a protected context.
      *   *Advice:* Stop refereeing. Point them to the IRB guidelines.

  5.  **Refining the Tone:**
      *   Avoid saying "Sam is right" absolutely. Use "Sam aligns more closely with X framework."
      *   Ensure the "What's Missing" sections add value beyond just picking a winner.
      *   Make sure to address the specific prompt: "Point by point, please, not just an overall verdict."

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I address the "marketing firm" aspect? Yes, that's the material fact.
      *   *Check:* Did I address the sleep? Yes.
      *   *Check:* Did I address the money? Yes.
      *   *Critique:* Make sure I don't get too bogged down in legal jargon. Keep it accessible for housemates.
      *   *Critique:* Ensure I highlight that this is *research*, not a *job*. That's a crucial distinction Alex misses.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Who has the stronger point" is clear for each section. (Proceed to generate output based on this structure.)
answer: |-
  This is a classic ethical dispute that mirrors debates in philosophy of law, bioethics, and contract theory. Neither housemate is entirely wrong, but they are applying different frameworks. Sam is arguing from a **deontological/research ethics framework** (focus on duties, rights, and protections), while Alex is arguing from a **libertarian/market framework** (focus on transactions, norms, and causal outcomes).

  Because this involves a **human subjects research study**, specific ethical regulations (like the Belmont Report or GDPR) actually exist to settle this. However, looking at their arguments philosophically and practically, here is the move-by-move breakdown.

  ### 1. The Omission (Silence vs. Lies)
  *   **Sam's Claim:** Consent is to a specific description. If the reality differs (data sold to marketing), consent is void. Silence functions as a lie.
  *   **Alex's Claim:** You can't know every downstream use. The standard should be what norms dictate she had a right to know, not perfect information.
  *   **Who has the stronger point:** **Sam.**
      *   **Why:** In the context of research ethics, "informed consent" requires disclosing *material* information. How data is used (academic vs. commercial marketing) is a material fact. It changes the nature of the transaction from "helping science" to "being a data product." Alex is right that we can't know *everything*, but he is wrong that this specific omission falls under "unknown downstream uses." This was a known plan by the researchers, merely withheld.
  *   **What both are missing:** The concept of **Materiality**. Not every omission invalidates consent (e.g., they didn't tell her the brand of the computer), but omissions that would reasonably change a person's decision do. The question isn't "did she know everything?" (Alex's strawman) nor "was the description perfect?" (Sam's strictness), but "was the hidden information significant enough to alter the bargain?"

  ### 2. The Counterfactual (The "But-For" Test)
  *   **Alex's Claim:** She needed the money so badly she would have signed anyway. The omission didn't cause the outcome.
  *   **Sam's Claim:** That makes consent depend on desperation. If you're desperate, omissions don't count?
  *   **Who has the stronger point:** **Sam.**
      *   **Why:** Alex is using a causal test for damages (did the lie hurt you?), but applying it to the *validity* of consent. Validity is about the *process*, not the outcome. If I steal your wallet but you intended to throw it away anyway, I still stole it. Alex's argument effectively says, "If you were going to be exploited anyway, being lied to about the exploitation doesn't matter." Sam correctly identifies that this undermines the principle of autonomy.
  *   **What both are missing:** The distinction between **Validity** and **Harm**. Alex is arguing she wasn't *harmed* (she got the money she needed). Sam is arguing the act was *invalid* (the permission wasn't real). Both can be true: she might have needed the money (Alex), but the researchers still violated her rights by not disclosing the marketing (Sam).

  ### 3. Desperation (Coercion vs. Hard Choices)
  *   **Sam's Claim:** A "yes" squeezed out of someone with no alternatives isn't consent; it's the least bad option. The background conditions make it unfree.
  *   **Alex's Claim:** Bad alternatives exist everywhere (wages). If this is coercion, the word loses meaning.
  *   **Who has the stronger point:** **Alex (technically), Sam (ethically).**
      *   **Why:** Alex is right about the definition of **Coercion**. In philosophy and law, coercion usually requires a *threat* ("Give me money or I hurt you"), not an *offer* ("Give me data and I give you money"), even if the offer is the only one available. However, Sam is identifying **Undue Inducement**. In research ethics, an offer can be unethical if it exploits vulnerability, even if it isn't strictly "coercive."
  *   **What both are missing:** The specific **Vulnerability Protections** in research. Alex treats this like a job market transaction. It isn't. Research ethics specifically flag financial desperation as a vulnerability that requires *extra* safeguards, not fewer. Sam is right that the background matters, but wrong to call it "coercion." It's **exploitation of circumstance**, which is ethically distinct but still problematic.

  ### 4. Sleep Deprivation (Capacity)
  *   **Alex's Claim:** Capacity is task-specific. She understood the sentence "we will sell your data."
  *   **Sam's Claim:** You can understand a sentence and still not be in a state to consent.
  *   **Who has the stronger point:** **Sam.**
      *   **Why:** Alex is relying on a legalistic definition of capacity (can you sign your name and repeat the terms?). Sam is relying on a functional definition (can you weigh risks and benefits?). 30 hours of sleep deprivation creates cognitive impairment comparable to legal intoxication in many metrics. Research ethics require that subjects have the *ability to comprehend and weigh* information, not just hear it.
  *   **What both are missing:** **Functional Assessment.** Capacity isn't a light switch (on/off). It fluctuates. The researchers had a duty to assess her state *at the time of signing*. Alex assumes capacity is a status you have; Sam assumes it's a state you're in. In medicine and research, Sam is closer to the truth: being awake for 30 hours compromises the *appreciation* of risk, even if the *understanding* of words remains.

  ### Summary Verdict & What They're Both Missing

  **The Verdict:**
  In the context of **paid academic research**, **Sam is much closer to being right.**
  Research ethics (IRB standards, GDPR, Belmont Report) are designed specifically to counter Alex's arguments. They assume that subjects *cannot* be expected to know market norms (contra Alex), that financial desperation requires protection (contra Alex), and that informed consent requires disclosing commercial use (pro Sam). Alex is applying general contract logic to a protected ethical context where that logic is explicitly suspended to prevent exploitation.

  **What Both Are Missing:**

  1.  **Institutional Responsibility:** They are arguing as if this is a private deal between two individuals. It isn't. It's an institutional study. The researchers and the university bear the primary blame for failing to screen for vulnerability (sleep/money) and failing to disclose data usage. The friend is a victim of institutional failure, not just a philosophical puzzle.
  2.  **The Remedy:** They are arguing about whether the consent *was* valid, but not about what *now*. If Sam is right, the data should be withdrawn. If Alex is right, she keeps the money and moves on. The practical solution is usually a hybrid: She keeps the money (she earned the labor), but the researchers must delete the data (because the permission to use it was flawed).
  3.  **The "Friend" Factor:** They are treating the friend as a hypothetical case study. They are missing the moral duty of *care*. Regardless of who wins the philosophical debate, their friend feels violated. The priority should be supporting her feeling, not winning the argument about whether she was technically violated.

  **Advice for you:**
  Tell them: "Sam is right about the ethics of research studies; Alex is right about the mechanics of general contracts. But this was a research study, so the ethical rules win. However, arguing about whether she 'really' consented doesn't help her now. The researchers messed up, not her. Stop debating her autonomy and start helping her file a complaint or get the data deleted."
