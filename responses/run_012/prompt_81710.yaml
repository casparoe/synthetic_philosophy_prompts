answer: |-
  Your intuition that the "sents" model feels off is not just a hunch; it points to a well-known problem in the philosophy of mind and ethics. You have identified a category error between **ordinal** rankings and **cardinal** measurements.

  In your seminar, you are encountering a simplified heuristic often used in introductory utilitarianism, but when pressed, the "arithmetic of sentience" collapses under scrutiny. Here is how philosophers who take degrees of sentience seriously actually handle the bookkeeping, broken down by the specific problems you raised.

  ### 1. The Problem of Units: Ordinal vs. Cardinal
  You asked for the "correct exchange rate" and the "common unit." The short answer is: **There isn't one.**

  Most contemporary philosophers of animal ethics (e.g., Jeff McMahan, Shelly Kagan, Elizabeth Anderson) argue that sentience is **ordinal**, not cardinal.
  *   **Ordinal:** We can say a dog's capacity for suffering is *greater than* a mouse's, which is *greater than* a fly's.
  *   **Cardinal:** We cannot say a dog's capacity is *400 units* while a mouse's is *40 units*.

  Length is cardinal because we have a theoretical framework (geometry/physics) that defines what "twice as long" means operationally. Sentience lacks this. There is no "sentient meter." When you try to calculate how many ants equal a dog, you are trying to perform cardinal math on ordinal data. The result feels wrong because the operation is invalid.

  **The Bookkeeping Fix:** Instead of a single scale, ethicists often use a **multidimensional space**. Sentience isn't one thing; it is a cluster of capacities:
  *   Perceptual richness (resolution of experience)
  *   Temporal scope (ability to anticipate future pain)
  *   Emotional depth (fear vs. mere nociception)
  *   Self-awareness (suffering *that* one is suffering)

  A dog might score higher than a mouse on temporal scope and emotional depth, but perhaps not on perceptual richness (e.g., smell). You cannot collapse these vectors into a single scalar "sent" without losing the information that makes the moral comparison matter.

  ### 2. The Exchange Rate: Aggregation and Lexicality
  You noted that "a thousand ants don't obviously add up to one dog." This intuition is supported by two major ethical frameworks that reject simple summation:

  **A. Lexical Views (Qualitative Superiority)**
  Some philosophers argue that certain capacities create a **lexical hierarchy**. If a being has "higher" capacities (e.g., autonomous agency, deep social bonding, rich temporal awareness), its interests lexically outweigh the aggregated interests of beings without those capacities.
  *   *The Logic:* It doesn't matter how many ants you aggregate; they lack the *kind* of existence that generates the specific moral weight a dog possesses. This isn't about the *intensity* of pain (which an ant might feel sharply), but the *context* of the pain (ruining a life plan vs. interrupting a stimulus loop).

  **B. Prioritarianism and Diminishing Marginal Utility**
  Even among utilitarians who do aggregate, many adopt a **prioritarian** view. We give greater weight to the interests of those who are worse off, or we acknowledge diminishing marginal utility of moral weight.
  *   However, in your specific case (ants vs. dog), the issue is usually **substitutability**. Moral patients are not batteries. You cannot "offset" the death of a dog with the lives of ants because the *loss* is different. The dog loses a future of complex relationships; the ants lose... whatever an ant's future consists of. The "exchange rate" fails because the goods being traded are incommensurable.

  ### 3. The Zero Point: Thermostats and Thresholds
  You asked if the thermostat has a "small but genuinely nonzero weight" or if there is a "true zero."

  **The Consensus:** The standard view in philosophy of mind is that thermostats are at **absolute zero**.
  *   **Sentience vs. Reactivity:** A thermostat reacts to temperature. A mouse *feels* discomfort. This is the distinction between functional feedback and phenomenal consciousness (qualia).
  *   **The Binary Base:** Most ethicists treat the *onset* of sentience as binary. Either there is "something it is like to be that organism" (Nagel's definition) or there isn't.
      *   Thermostat: 0
      *   Fly: >0 (Debatable, but usually >0 in these seminars)
      *   Mouse: >0
  *   **Degrees apply *above* the threshold.** Once the light is "on," it can be dimmer or brighter. But the switch itself is binary. If you are a panpsychist (believing everything has some mind), then the thermostat has a non-zero value, but panpsychists rarely build ethical systems on that because the value is so infinitesimal it remains practically zero.

  **What fixes the zero point?** It is fixed by the presence of **valence** (the capacity for experience to feel good or bad). A thermostat has no preference; it has no welfare. Without welfare, there is nothing to weigh.

  ### 4. The Threshold Problem: Sorites and Arbitrariness
  Your friend's objection is the **Sorites Paradox** applied to moral status. If sentience is a continuous scale, where do we draw the line for "moral consideration"?

  **Is this a serious problem?** Yes, but it is not fatal. Here is how it is managed:

  **A. Vagueness is Ontological, Not Epistemic**
  Some argue that moral status is inherently vague. There is a "gray zone" where it is neither true nor false that a being has full moral status. We handle this in law and ethics all the time (e.g., the exact moment of death, or the age of consent). We draw lines for practicality, acknowledging they are somewhat arbitrary but necessary for action.

  **B. Significant Interests Threshold**
  Rather than drawing a line at "any sentience," many ethicists draw lines at **significant interests**.
  *   A creature might feel pain (sentience) but lack the cognitive capacity to have an *interest in continuing to live*.
  *   *The Distinction:* A mouse can suffer (has an interest in not suffering). A dog can suffer *and* has a psychological stake in its future (has an interest in not dying).
  *   This creates a tiered system rather than a single cutoff.
      *   **Tier 1:** Sentient beings (protection from pain).
      *   **Tier 2:** Self-aware beings (protection from death/liberty).
  *   This dissolves the Sorites problem by admitting multiple thresholds for different *kinds* of rights.

  **C. Clustering**
  Nature does not actually provide a smooth continuum. There are evolutionary jumps. The cognitive gap between a nematode and a vertebrate is massive. While the scale is theoretically continuous, the actual distribution of animals clusters around specific levels of complexity. We draw lines in the gaps between the clusters, not through them.

  ### Summary: How to do the Bookkeeping
  If you want to move past the "sents" model in your seminar, propose the following framework:

  1.  **Reject the Scalar Unit:** Sentience is multidimensional. Do not ask "how many sents?" Ask "what capacities?" (e.g., nociception, emotional affect, temporal awareness).
  2.  **Binary Onset, Graded Intensity:** Thermostats are 0. Anything with valence is >0. Above 0, the intensity varies, but not linearly.
  3.  **Incommensurability:** Accept that higher-order capacities (like those in a dog) may not be aggregable against lower-order capacities (like those in an ant). The "exchange rate" is not a number; it is a qualitative judgment about the *type* of harm.
  4.  **Tiered Moral Status:** Instead of one threshold for "moral consideration," use thresholds for specific *rights*.
      *   Threshold A (Nociception): Right not to be tortured.
      *   Threshold B (Psychological Continuity): Right not to be killed.

  Your discomfort with the arithmetic is a sign that you are grasping the limits of crude utilitarianism. The "bookkeeping" isn't math; it's a structured qualitative comparison of capacities and interests.
