prompt: |-
  Last night I had a long argument with a friend about lab animal rules and I'm still not sure I won it. Where I used to work there was this whole oversight apparatus for mice, rats and octopuses, but crickets, fruit flies, crabs — nothing, do basically whatever you want. My friend says that's just administrative convenience dressed up as ethics. His point was that everyone agrees sentience comes in degrees (worm, dog, us), so a rule that puts an octopus inside the system and a crab outside is a line somebody drew for paperwork reasons, and once you admit it's a gradient you can't stop at crabs — why not a thermostat, why not a plant. I said fine, but you still have to draw lines somewhere, and then I couldn't say what the line is supposed to be tracking. Can you untangle what that kind of practice actually presupposes about moral status? Does it need sentience to be a switch rather than a dial, or can a graded view license the very same rules? Which parts of the practice are strictly presupposed and which are just things it happens to fit with — and is it underdetermined, so that a threshold view and a graded-utilitarian view both come out looking identical on the ground? And if we really took the degrees seriously, what would have to change — the categories themselves, the way harms get counted, where the money goes? Dosen't have to be a whole essay, I just want to know where the real commitments are hiding.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user had an argument with a friend about lab animal regulations (IACUC/ethical oversight).
      *   **The Observation:** Certain animals (mice, rats, octopuses) are regulated; others (crickets, fruit flies, crabs) are not.
      *   **The Friend's Critique:** This distinction is administrative convenience disguised as ethics. If sentience is a gradient (worm < dog < human), drawing a hard line (octopus = yes, crab = no) is arbitrary. If it's a gradient, why stop at crabs? Why not plants/thermostats?
      *   **The User's Defense (and Doubt):** You have to draw lines somewhere, but couldn't articulate *what* the line tracks.
      *   **The Core Questions:**
          1.  What does current practice presuppose about moral status (switch vs. dial)?
          2.  Can a graded view license the same rules as a threshold view?
          3.  What is strictly presupposed vs. what just fits contingently?
          4.  Is the practice underdetermined (do threshold and graded-utilitarian views look identical on the ground)?
          5.  If we took degrees seriously, what would actually change (categories, harm counting, funding)?
      *   **Constraint:** "Doesn't have to be a whole essay, I just want to know where the real commitments are hiding." (Needs to be concise, punchy, and analytical).

  2.  **Analyze the Ethical/Regulatory Landscape:**

      *   *Current System:* It's largely legalistic and taxonomic. In the US, the Animal Welfare Act (AWA) excludes rats, mice, and birds bred for research (though PHS Policy covers them). Octopuses are often covered under specific guidelines (like in the EU or specific institutional policies) due to high cognitive capacity. Invertebrates like insects/crustaceans are generally excluded.
      *   *The "Line":* It's usually drawn at Vertebrates + Cephalopods.
      *   *The Philosophical Tension:* Threshold (Deontological-ish) vs. Gradualist (Utilitarian).
      *   *The Friend's "Slippery Slope":* If it's a gradient, why not plants? *Counter:* Sentience (capacity to suffer) is the relevant gradient, not intelligence or life. Plants/thermostats lack nociception/conscious experience. So the slope stops at the nervous system threshold.

  3.  **Address the Specific Questions:**

      *   **Switch vs. Dial:** The *regulations* act like a switch (regulated vs. unregulated). The *justification* often implies a dial (pain perception capacity).
      *   **Can a graded view license the same rules?** Yes, via "administrative triage." If the moral weight is below a certain threshold, the cost of regulation outweighs the moral benefit. This is a "pragmatic cutoff" on a graded scale, not a "metaphysical cutoff" in moral status.
      *   **Presuppositions:** The system presupposes *capacity for suffering* is the trigger. It doesn't necessarily presuppose a metaphysical switch, but it *operates* as if there is one.
      *   **Underdetermination:** Yes, largely. A threshold view says "No moral status below line." A graded view says "Negligible moral status below line." The outcome is the same.
      *   **If we took degrees seriously:** We would see proportional oversight. More pain = higher burden of justification. We might see "harm weighting" in grant applications (1 mouse pain ≠ 1 fly pain).

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Analytical, philosophical but grounded, direct.
      *   *Structure:*
          1.  Validate the user's intuition (the friend is half-right, but missing the pragmatic layer).
          2.  Address the Switch vs. Dial question.
          3.  Explain the "Administrative Triage" justification.
          4.  Identify the hidden commitments (Sentience vs. Taxonomy).
          5.  Describe what a "True Graded" system would look like.

      *   *Refining the "Friend's Argument":* The friend argues that if it's a gradient, you can't draw a line. This is false. You *can* draw a line on a gradient for practical reasons (e.g., income tax brackets). The friend's second point (why not plants) is weak if the gradient is *sentience*, not *life*.
      *   *Refining the "User's Defense":* The user struggled to say what the line tracks. It tracks *enforceable evidence of nociception/consciousness*.
      *   *The "Underdetermination" point:* This is crucial. A rule saying "Protect X" is compatible with "X has rights" AND "Protecting X is useful for human morality."
      *   *What would change?* Weighted harm calculations.

  5.  **Final Polish (checking against constraints):**

      *   Keep it tight. Avoid jargon where possible, or explain it.
      *   Make sure to answer the "where are the commitments hiding" prompt.
      *   Ensure the distinction between *ontological status* (what the animal is) and *regulatory status* (what the law says) is clear.

  6.  **Final Output Generation:** (This matches the provided good response.)
      *   *Headline:* The system is pragmatic, not metaphysical.
      *   *Switch vs. Dial:* Regulations need switches; ethics can be dials.
      *   *The "Line":* It's an evidentiary threshold, not a moral cliff.
      *   *Underdetermination:* Yes, threshold and negligible-weight views look the same.
      *   *Real Change:* Weighted harm, not just binary categories.

      *(Self-Correction during drafting)*: I should make sure to mention that the friend's "thermostat" argument is a category error. The gradient is sentience, not complexity. A thermostat has zero sentience. A crab has *some*. A mouse has *more*. The line is drawn where evidence becomes robust enough to warrant the cost of oversight.

      *(Refining the "Octopus vs. Crab" point)*: Octopuses have complex nervous systems and show pain avoidance learning. Crabs do too, but historically the evidence was weaker or the taxonomic bias (invertebrate vs vertebrate) was stronger. The EU actually does protect decapod crustaceans now. This shows the line *moves* as evidence changes, supporting the graded view.

      *(Final Plan)*:
