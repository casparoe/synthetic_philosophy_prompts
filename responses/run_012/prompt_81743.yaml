answer: |-
  You and your friend are both half-right, but you're talking past each other because you're conflating **moral ontology** (what an animal *is*) with **regulatory pragmatics** (what a bureaucracy can *do*).

  Here is where the real commitments are hiding, untangled.

  ### 1. Switch vs. Dial: The Bureaucratic Necessity
  Your friend is right that sentience is likely a dial (a gradient). You are right that rules must be switches (binary).
  A regulatory system cannot operate on a continuous variable. Inspectors need checklists: *Is this species covered? Yes/No.*
  **The Commitment:** The practice does **not** presuppose that moral status is metaphysically binary. It presupposes that **enforcement requires binary categories.** You can have a graded ethical view that licenses binary rules for the sake of feasibility. This is "administrative triage," not ethical denial.

  ### 2. The "Thermostat" Slippery Slope
  Your friend's argument ("if it's a gradient, why not plants?") fails if the gradient is defined correctly. The gradient isn't "complexity" or "life"; it's **capacity for valenced experience (suffering).**
  *   **Thermostat/Plant:** 0 capacity.
  *   **Fly/Cricket:** Low capacity (debated, but likely minimal nociception without central processing).
  *   **Crab/Octopus:** Higher capacity (complex nervous systems, avoidance learning).
  *   **Mouse/Human:** High capacity.
  **The Commitment:** The line isn't drawn at "zero vs. some." It is drawn at **"negligible vs. significant."** The system presupposes that below a certain threshold of probable suffering, the moral cost of regulation (money, time, stalled research) outweighs the moral benefit of protection.

  ### 3. Underdetermination: Threshold vs. Graded-Utilitarian
  You asked if a threshold view (rights begin at X) and a graded-utilitarian view (suffering counts, but tiny amounts don't justify costly oversight) look identical on the ground.
  **Yes, they are underdetermined.**
  *   **Threshold View:** "Crabs have no moral status, so no rules."
  *   **Graded View:** "Crabs have tiny moral status, but regulating them costs millions. The net utility of regulating crabs is negative."
  Both result in: *No rules for crabs.*
  **The Commitment:** The practice is compatible with either, but it **secretly relies on the Graded-Utilitarian view.** We know this because the lines move. When evidence of octopus sentience became robust, they got added. If moral status were a fixed metaphysical switch, the list of animals wouldn't change as science improves. The fact that the list *does* change proves the system is tracking **evidence of capacity**, not inherent rights.

  ### 4. What Would Change If We Took Degrees Seriously?
  If we stopped pretending the switch is real and embraced the dial, three things would change:
  1.  **Weighted Harm Calculations:** Currently, protocols ask "How many animals?" A graded system would ask "How much total suffering?" 100 mice might equal 1 dog. 10,000 flies might equal 1 mouse. You would trade off numbers against intensity of protection.
  2.  **Proportional Oversight:** Instead of "Regulated vs. Unregulated," you'd have tiers. Flies get a light checklist; octopuses get a full ethics board review. (Some institutions already do this informally).
  3.  **Funding Allocation:** Money for "Refinement" (reducing pain) would be distributed based on the capacity to suffer, not just taxonomic class.

  ### The Verdict
  Your friend wins on the **ethics** (it is a gradient), but you win on the **policy** (you must draw a line).
  The hidden commitment of the current system is **Epistemic Humility.** It says: *"We don't know exactly where sentience starts, so we will draw the line where the evidence is overwhelming (vertebrates/cephalopods), and accept that we might be under-protecting the gray zone (crabs/flies) because over-regulating everything would stop science entirely."*

  It's not that crabs have *no* status; it's that their status is currently priced lower than the cost of the paperwork. That's cynical, but it's not logically incoherent.
