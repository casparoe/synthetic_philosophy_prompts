prompt: |-
  I teach a seminar on crime and punishment — Halden vs. the American carceral state, retribution vs. rehabilitation vs. deterrence — and half the room are CS students who keep trying to formalize it. Help me out. Take the main justifications in that debate and restate each one in the vocabulary of reinforcement learning: agent, environment, states, actions, reward function, discount factor, policy, the transition dynamics. I know RL decently for a philosopher — MDPs, reward shaping, discounting, that sort of thing — so don't water it down. For each justification (retribution, deterrence, incapacitation, rehabilitation, and restorative justice if it'll go in), tell me what maps cleanly onto the formalism, what I have to distort to make it fit, and what simply won't go into an MDP at all. My hunch is that the whole retributive strand is the residue — RL is constitutively forward-looking, so "desert" has no place to sit — and that deterrence is just a negative reward term while incapacitation is really editing the state space. Tell me if that hunch is right, and whether the leftover bit means the retributivists are saying something my formalism can't hear or that they're not saying anything.
