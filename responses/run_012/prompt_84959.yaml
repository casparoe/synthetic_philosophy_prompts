answer: |-
  This is a classic debate, and honestly, your skepticism is healthy. "Information is physical" is one of those phrases that gets thrown around like a magic spell. Sometimes it's deep physics, sometimes it's just a bumper sticker for "Landauer's Principle."

  Your mate is broadly right on the standard resolution (the Bennett-Landauer erasure argument), but you are right to press him on *why* that slogan does the work. The slogan itself doesn't kill the demon; the **thermodynamic cost of logical irreversibility** does.

  Here is the menu of claims hidden inside that phrase, rated for truth and demon-slaying capability. You can take this list straight back to him.

  ### The Menu: What "Information is Physical" Could Mean

  #### 1. The Substrate Claim
  *   **Claim:** Information cannot exist in the abstract; it must always be instantiated in a physical state (spin, charge, ink on paper).
  *   **Verdict:** **True.**
  *   **Does it kill the Demon?** **No.**
  *   **Why:** This is trivial. Everyone agrees a bit needs a physical carrier. But just knowing a bit is physical doesn't tell you *how much energy* it costs to flip or erase it. You could imagine a physical substrate that switches states with zero energy cost. This claim alone doesn't save the Second Law.

  #### 2. The Measurement Cost Claim (Szilard's Original View)
  *   **Claim:** The act of *acquiring* information (measuring the molecule's speed) necessarily dissipates at least $kT \ln 2$ of heat per bit.
  *   **Verdict:** **False / Outdated.**
  *   **Does it kill the Demon?** **No (because it's false).**
  *   **Why:** You were right to notice your mate waved this off. In 1982, Charles Bennett showed that measurement can be done reversibly (like a quantum CNOT gate). You can copy the state of the molecule onto the demon's memory without generating heat. Your mate was correct to dismiss this, even if he didn't explain why.

  #### 3. Landauer's Principle (The Erasure Claim)
  *   **Claim:** Logically irreversible operations (specifically **erasing** a bit, mapping two states to one) *must* dissipate at least $kT \ln 2$ of heat into the environment.
  *   **Verdict:** **True** (Standard statistical mechanics & experimental verification).
  *   **Does it kill the Demon?** **Yes, but only for a cyclic engine.**
  *   **Why:** This is the heavy lifter. If the demon wants to operate continuously (as an engine), it must reset its memory to a "blank" state to measure the next molecule. That reset is logically irreversible (you lose the info about the previous molecule). That loss forces heat out. The entropy decrease in the gas is exactly paid for by the entropy increase during erasure.

  #### 4. Entropy is Missing Information (The Gibbs/Shannon Claim)
  *   **Claim:** Thermodynamic entropy is literally the same quantity as Shannon information entropy. A decrease in thermodynamic entropy is an increase in the observer's information about the microstate.
  *   **Verdict:** **True (with caveats).**
  *   **Does it kill the Demon?** **No, not on its own.**
  *   **Why:** This identifies the *currency*, but not the *tax*. It explains that the demon reduces the gas entropy by gaining information. But it doesn't explain why the demon can't just keep that information forever. It requires Claim #3 to close the loop.

  #### 5. The "It From Bit" Claim (Radical Ontology)
  *   **Claim:** Physics is fundamentally about information processing; matter/energy are secondary to bits.
  *   **Verdict:** **Speculative / Philosophical.**
  *   **Does it kill the Demon?** **No.**
  *   **Why:** This is Wheeler's "It from Bit." It's a cool metaphysical stance, but it doesn't help you calculate heat dissipation in a train car. Ignore this for the purpose of the bet.

  ---

  ### The "Infinite Memory" Objection (Your Best Point)

  You asked: *"Why can't the demon just have a massive memory and never erase anything? The entropy ends up in its notebook... so who cares."*

  This is the strongest part of your argument, and it reveals where your mate's "mic drop" was sloppy.

  **The Verdict:** You are both partially right, but you are talking about different systems.

  1.  **If the demon never erases:** You are correct. The Second Law is **not violated** for the combined system (Gas + Demon). The entropy of the gas goes down, but the entropy of the demon's memory goes up (it goes from a "blank/ordered" state to a "filled/random" state). The total entropy of the box stays the same or increases.
      *   **The Catch:** The demon is not an *engine* here; it is a **fuel consumer**. The "fuel" is the low-entropy blank memory tape. Once the tape is full, the demon stops working. It has converted the order of the blank tape into the order of the separated gas. This is allowed by thermodynamics.

  2.  **If the demon must cycle (The Engine):** Your mate is correct. To make Maxwell's Demon a *perpetual motion machine of the second kind*, it must return to its initial state after every cycle. It must wipe the tape.
      *   **The Catch:** To wipe the tape (Claim #3 above), it must dump heat. That heat cost exactly cancels out the work gained from sorting the gas.

  **So, who wins?**
  *   If the claim is "The Demon can never sort molecules without increasing entropy somewhere," **you win** (the entropy goes into the notebook).
  *   If the claim is "The Demon cannot be a perpetual engine that extracts work indefinitely," **your mate wins** (because eventually, he has to erase the notebook).

  Your mate's "cheating" comment was imprecise. It's not cheating to store entropy in the notebook; it's just **consuming a resource**. The "Information is Physical" slogan is meant to remind you that the blank notebook is a low-entropy physical resource, just like a tank of fuel.

  ### Summary for your Mate

  Tell him this:

  1.  **"Information is Physical" is a bumper sticker.** The actual argument is **Landauer's Principle** (Claim #3).
  2.  **Measurement doesn't cost energy** (you were right to question Szilard, he was right to dismiss it).
  3.  **Erasure costs energy.** This is the only thing that saves the Second Law for a *cyclic* engine.
  4.  **My "Infinite Memory" objection stands:** If the demon doesn't erase, it's not a violation of the 2nd Law, it's just a battery running down. The entropy *does* go into the notebook. The 2nd Law is saved because the "blank notebook" has low entropy.
  5.  **The Slogan's Job:** The phrase "Information is Physical" is only useful if it means **"Logical states are coupled to Thermodynamic states."** Without that coupling, erasure wouldn't generate heat.

  **Final Score:** He knows the standard resolution (Landauer/Bennett), but he used a slogan to skip the nuance about *cyclic vs. non-cyclic* processes. You caught the nuance he glossed over. Take the W on the nuance, let him have the W on the textbook resolution.
