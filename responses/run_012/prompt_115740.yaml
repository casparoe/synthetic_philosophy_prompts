      *   **Task:** Run the analysis in *both* directions.
          1.  *Theory illuminates case:* What conception of meaning does the Committee use? How does Schlick challenge it? Is the Committee conceptually confused? What would Schlick suggest they do?
          2.  *Case tests theory:* Does the case confirm or limit Schlick? Does his focus on play make him silent on tragic choices? Can criteria be reinterpreted Schlickianly? Is there a tension regarding comparing lives/resource allocation?
