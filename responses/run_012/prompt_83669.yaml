answer: |-
  Good morning. Thank you for being here. I know some of you would rather be elsewhere. I know one of you has already said that choosing a budget committee by lot is like choosing surgeons by lot. It is a sharp objection. It deserves an answer, not just a welcome.

  We are here to decide how this city spends its flood-defence levy. That is technical, yes. But it is not surgery. Surgery is about skill we cannot judge without training. Politics is about trade-offs we all live with every day. Where the money goes is a question of values. Who gets protected first? What risk is acceptable? Who pays? Those are not questions for experts alone. They are questions for the people who live with the water.

  For two years, I argued for this room. I argued for sixty people drawn by lot from the electoral roll. When people asked me why, I used to give the standard answer. I said that this group is a mirror. I said that because you were chosen by chance, you look like the city. You have the same spread of ages, jobs, postcodes, and opinions as the population outside. I said your claim to decide rests on being a miniature of us all.

  I am standing here today to tell you that I was wrong. That metaphor is shaky, and it is dangerous. If I tell you that you are here because you represent the city, I am asking you to do a job you cannot do. You cannot carry the views of your neighbours in your head. You cannot canvass your street and bring a mandate to this table. If you try, you will turn this room into a chamber of delegates, shouting competing instructions rather than weighing evidence.

  So I am putting a different image in your head. Do not think of yourselves as a mirror. Think of yourselves as a firewall.

  The virtue of the lot is not that it copies us. It is that it is the only route onto a decision-making body that nobody can work on. Every other route is a channel. You can campaign down it. You can donate down it. You can organise down it. You can inherit down it. You can get famous down it. Anything that carries influence gets farmed. That is why every other kind of body ends up populated by people who are unusually good at being selected, rather than unusually good at deciding. They are good at winning the channel. You are here because the channel is closed.

  This is a colder thing to say than calling you a miniature of the city. It means I am not asking you to represent anybody. It means your chief qualification is that nobody could capture you. I would rather have you uncapturable than representative. This leans on a contested reading of the idea: it prioritises the independence of the sample over its descriptive accuracy. It costs us the comfort of feeling represented, but it buys us a decision that hasn't been pre-negotiated by lobbyists.

  What it buys us is a table nobody could buy, inherit, or campaign their way to. It is occupied by people who had to spend four weekends reading evidence instead of raising money. That is your task. You are not here to speak for your postcode. You are here to speak for what you understand after you have seen the maps, the costings, and the engineering reports. You are here to be unreachable.

  This brings me to the most important question. On the last day, you will produce a recommendation. What happens to it? Does the council take it, amend it, rewrite it, or file it? I need to settle this now, because you will know on day four if I am hedging.

  Your recommendation will be binding. It will go to a ratification vote, up or down, with no amendments.

  I know this makes some people in this room nervous. I know it makes some people behind me very nervous. But if the council can amend your work, the firewall is broken. If they can change the lines, the lobbyists will not target you; they will target the councilors who change your work. They will wait you out. To keep the channel closed, the decision must be clean. If you say yes, it is yes. If you say no, it is no. This is not advisory. This is not a suggestion box. This is a transfer of authority for this specific question.

  Why commit to this? Because if you spend four weekends digging into the details of flood levies, only to have the result polished away by a committee that didn't hear the witnesses, then the lot was a trick. It was a way to outsource the hard work without outsourcing the power. I did not fight for a trick. I fought for a mechanism that forces the city to accept the verdict of people who had nothing to gain by being here.

  There are experts in the front row who study this kind of assembly. They will be listening to see if I understand what we are doing. There are councillors behind me who voted for this, some of whom would not be sorry to see it embarrass itself. There is a press table that will quote exactly one sentence from this speech. They will likely quote the part about the surgeons, or the part about the binding vote.

  Let them quote the binding vote. Let them know that this city is trying something structural. We are trying to build a room where the only influence is the evidence on the table.

  So, here is what I ask of you. Do not worry about whether you are the right person. You are the right person because you are here. Do not worry about representing your neighbours. Represent the evidence. Do not worry about being polite to power. You are the power for these four weekends.

  You have a small budget for witnesses. Use it. Ask the hard questions. If the engineering doesn't add up, say so. If the cost is too high, say so. If the plan leaves a vulnerable estate dry while protecting a wealthy hill, say so. You are insulated from the consequences of campaigning. You do not need to win re-election. You do not need to please a donor. You only need to reach a conclusion you can live with.

  We have six hours today. We have three more weekends after this. We have a city that is waiting to see if sixty people can do what the professionals could not: decide without looking over their shoulders.

  The mirror is broken. The firewall is up. The channel is closed. Let's get to work.
