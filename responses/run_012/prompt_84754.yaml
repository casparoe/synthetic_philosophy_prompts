  **Orientation**

  This instrument maps moral intuitions regarding farmed aquatic animals without requiring philosophical terminology. It proceeds from concrete biological realities to ethical conclusions. Answer each question based on your immediate judgment of the cases presented, not on what you think a consistent theory should demand. There are no correct answers, only coherent paths. Your terminal position describes the logical consequence of your commitments, not a label you must adopt. Use this to locate your own view and understand where colleagues diverge.

  **The Diagnostic Questions**

  1.  **Unit of Concern:** When oxygen crashes occur in intensive ponds, is the primary moral loss the death of individual fish, the instability of the stock, or merely the economic loss to the farmer?
      *   *Separates those who prioritize ecosystems, human interests, or individuals.*
  2.  **Source of Duty:** Does confining a shrimp in a hatchery create a special duty of care toward it, or would the same duties apply if it were wild?
      *   *Separates those who ground obligations in human relations versus intrinsic capacity.*
  3.  **Sentience and Uncertainty:** Given the debate over crustacean nervous systems, should we ban live-asphyxiation only if suffering is proven, or whenever it is plausible?
      *   *Separates those who require evidence from those who act on precaution.*
  4.  **Scope of Harm:** Is eyestalk ablation or stressful live transport wrong because it causes pain, or because it frustrates biological function even if painless?
      *   *Separates those who count only suffering from those who count death and behavioral frustration.*
  5.  **Permissibility of Use:** If a fish is killed via ice-slurry or electrical stunning instantly without pain, is the killing itself a moral harm?
      *   *Separates those who accept humane killing from those who view life as inviolable.*
  6.  **Moral Weight:** Does the moral weight of a larval shrimp count the same as an adult fish, or does cognitive complexity and number alter the sum?
      *   *Separates those who scale moral status from those who treat individuals equally.*

  **The Tree**

  *   **1. Unit of Concern**
      *   Stock/Ecosystem Stability → **Ecological Holist**
      *   Human Interest Only → **Sceptic**
      *   Individual Animal → *Go to 2*
  *   **2. Source of Duty**
      *   Relation (Domestication) → **Relational/Care**
      *   Intrinsic Capacity → *Go to 3*
  *   **3. Sentience and Uncertainty**
      *   Act on Plausibility (Unproven) → **Precautionary**
      *   Act on Proof (Accepted) → *Go to 4*
  *   **4. Scope of Harm**
      *   Pain Only → **Suffering-only Welfarist**
      *   Pain + Function/Death → *Go to 5*
  *   **5. Permissibility of Use**
      *   Killing Inherently Wrong → **Rights-based Abolitionist**
      *   Killing Permissible → *Go to 6*
  *   **6. Moral Weight**
      *   Scaled (Cognition/Numbers) → **Gradualist**
      *   Equal Per Individual → **Welfarist + Death/Behavior**

  **The Positions**

  1.  **Ecological Holist:** Prioritizes population stability over individual welfare. *Awkward commitment:* Must accept high individual mortality if stock health requires it.
  2.  **Sceptic:** Denies intrinsic welfare, reasoning from human and ecological interests only. *Awkward commitment:* Cannot condemn cruelty unless it impacts human character or markets.
  3.  **Relational/Care:** Grounds duties in the act of domestication and confinement. *Awkward commitment:* Owes less to wild-caught bycatch than to farmed stock.
  4.  **Precautionary:** Extends moral caution to animals whose sentience is unproven. *Awkward commitment:* Must regulate industries based on suspicion rather than evidence.
  5.  **Suffering-only Welfarist:** Counts felt suffering as the only intrinsically welfare-relevant bad. *Awkward commitment:* Cannot object to painless killing or biological frustration.
  6.  **Rights-based Abolitionist:** Views life as inviolable regardless of welfare conditions. *Awkward commitment:* Must oppose all aquaculture and fishing, regardless of humane methods.
  7.  **Gradualist:** Scales moral weight to cognitive capacity or numbers. *Awkward commitment:* Must value a mammal's life over a shrimp's, or sum larvae equivalently.
  8.  **Welfarist + Death/Behavior:** Counts suffering, premature death, and thwarted behavior as harms. *Awkward commitment:* Must weigh complex welfare trade-offs without a simple pain metric.

  **Unoccupied Combinations**

  Several logical combinations remain empty in serious discourse. A "Relational Abolitionist" is rare because grounding duty in domestication usually implies stewardship rather than release; if the relation creates the duty, ending the relation dissolves the duty, making the view unstable. An "Individual Sceptic" who cares for individuals but denies welfare is incoherent; caring for an individual just is acknowledging welfare. A "Holistic Welfarist" who prioritizes ecosystems but demands individual pain mitigation is practically unworkable when stock health requires culling. Finally, a "Precautionary Abolitionist" is largely unexplored; usually, uncertainty leads to regulation, not total bans, because the cost of error is asymmetrical. These gaps exist not because they are logically impossible, but because they demand contradictory motivations or unsustainable practical commitments that collapse under real-world pressure.

  **Pairs This Tree Cannot Separate**

  The Precautionary view and the Welfarist + Death/Behavior position may converge once sentience is accepted; the tree separates them on evidence, not outcome. Similarly, the Gradualist and the Welfarist may answer identically if they agree cognitive differences are negligible in this context. The Relational view and the Welfarist may also overlap if the duties generated by relations mirror intrinsic duties. This instrument distinguishes foundational justifications, not necessarily policy outcomes; two colleagues may reach the same recommendation for eyestalk ablation via different branches.
