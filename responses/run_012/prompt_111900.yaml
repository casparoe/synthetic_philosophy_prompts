prompt: |-
  I'm a second-year HPS student and I've been stuck on the same thing in Lakatos for about a month now. The way I read him, the progressive/degenerating distinction is supposed to be a real appraisal of a research programme — the kind of thing you could use to decide whether to keep working in a programme or jump ship — but on his own account you can't really tell a degenerating programme from a progressive one until it's run its course and you can see whether the problem-shifts were producing novel, corroborated content or just keeping the hard core on life support. My officemate (early modernist, thinks the whole methodology is retrospective rationalisation dressed up as methodology) says the distinction is only ever a historians tool with no bite in real time. I think thats too quick, since Lakatos clearly does want to say a research community is sometimes being irrational for sticking with a programme, and that seems to presuppose you can know before the fact. The hard case I keep chewing on: a programme whose core predictions keep failing, where each failure gets patched by a fresh auxiliary, but the auxiliaries are all independently testable and a couple of them have scored genuinely novel hits — progressive or degenerating, and could you have said which at the time?

  What I want from you is your credence, as an actual number, that there is a fact of the matter at time t about whether a programme is progressive or degenerating — i.e. that "programme P is degenerating right now" can be true or false independently of how P eventually turns out — and then the decomposition behind that number, with a rough probability for each term and one line of justification each. The terms I'd want you to price out, though add or split them if you think my list is wrong: (a) whether "excess empirical content" is well-defined and comparable between rival programmes at a time rather than only in retrospect; (b) whether "novel fact" can be assessed without hindsight, i.e. whether temporal novelty and heuristic novelty come apart in a way that matters; (c) whether the core/belt division is fixed by the programme itself or is up for grabs by the appraiser (the worry that you can always gerrymander a core to save the appraisal); (d) whether the methodology is meant descriptively or normatively, and whether your answer changes if it's only the latter; (e) whether Lakatos's own statements are even consistent enough for the question to have a determinate answer, or whether he equivocates between the retrospective and prospective readings and the proposition is just ill-formed. Then tell me how you combine them (multiplicative, or does one term swamp the rest), which single term your number is most sensitive to, and what argument or piece of evidence — historical or conceptual, no citations needed — would move you most in either direction. If you think the question needs to be sharpened before it can get a number at all, say how you'd sharpen it and then answer the sharpened version.
