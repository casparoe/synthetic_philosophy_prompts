      *   **Implication of View:** If micro-experiences don't genuinely combine, then macro-subjects (like "us," "family," "Rosa") might be fictions. "There's no one home to do the feeling."
      *   **Constraint 1 (Academic Integrity):** Colleagues will be present. Cannot fudge her view. Cannot claim she believed in a persistent soul or a cosmic self (not cosmopsychism). Cannot claim a solution to the combination problem exists.
      *   **Constraint 2 (Family Comfort):** Cousins/neighbors need comfort. Standard tropes ("she's watching over us," "she's part of something bigger") are desired but potentially philosophically problematic given her views.
      *   **Goal:** Comfort both groups without lying about the philosophy or being bleak. Acknowledge reality of experience without presupposing a persistent self.
      *   **Format:** First, brainstorm acceptable claims vs. off-limits claims. Second, write the eulogy (4-5 minutes spoken).

  2.  **Brainstorming & Philosophical Navigation:**
      *   *What is off-limits?*
