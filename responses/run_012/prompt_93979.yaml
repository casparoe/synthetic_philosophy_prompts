      *   Skeptic's point: Genome + Environment seems to determine everything we care about (personality, appearance, history). Origin seems disconnected from these. If Ana is genetically B and socially B, calling her A seems arbitrary.
      *   Essentialist counter: Identity isn't about properties (qualitative similarity); it's about *thisness* (haecceity). The material cause is fundamental. The genome swap doesn't change the fact that *this* particular organism began as *that* particular zygote. The "work" origin does is grounding the very existence of the subject, not determining their qualities.
      *   Analogy/Principle: You can't make *me* by building a molecule-by-molecule duplicate elsewhere. Similarly, you can't make the B-child using the A-zygote's biological continuity.
      *   Response strategy: Acknowledge the intuitive pull of the genetic view (concede minor point), but insist that genetic makeup is a property *of* the organism, not the organism itself. The swap creates a hybrid scenario, but the historical trajectory of the cell lineage is the anchor. If we say Ana is the B-child, we imply the B-child could have started as A, which violates the necessity of origin. The "work" origin does is preventing the collapse of identity into a bundle of properties.

