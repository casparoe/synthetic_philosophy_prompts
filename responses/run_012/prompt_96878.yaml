prompt: |-
  Two of my mates had a proper row at the weekend over something I'd set up as a joke, and I still can't work out who came off better, so I'm handing it over to you.

  The setup: I'd come across the idea that if your preferences go round in a loop, someone can take your money off you for free. So I tried it on Rowan with his own drinks. I gave him a coffee, then offered to swap it for a hot chocolate plus 10p (he'd told me before he'd rather have hot chocolate than coffee, so he took it), then swapped the hot chocolate for a tea plus 10p, then the tea back for a coffee plus 10p. He finished with exactly what he started with, 30p lighter. He wasn't bothered about the 30p, he was bothered about what he thought it proved.

  Rowan: that shows the loop is irrational, full stop. If a set of preferences lets someone drain you like that, there's something wrong with them. The cure is to have your preferences stack up into a single ranking with a number on each option, so you can just maximise the number.

  Bethan: it shows nothing of the kind. It shows a patient trader who knows your preferences can take your money a small step at a time. If he'd seen the whole sequence coming he'd have turned down the first swap, and turning it down would have been perfectly sensible — it leaves him worse off. Being trickable by a clever salesman isn't the same as being irrational.

  Rowan: that doesn't rescue him. The reason he says yes at each step is one he'd still endorse at the end — every swap is an improvement by his own lights at the moment he makes it. And if he turns down the first swap only because of what's coming later, then his choice depends on what else happens to be on the menu, which is exactly the sort of thing that shouldn't matter. Two options are two options whether or not a third is lurking.

  Bethan: of course it should matter. Turning down a trade that's part of a package leaving you worse off is what a sensible person does — you're just assuming that only pairwise comparisons count. And notice the trick only works if he can't commit: if he says 'I'll never swap coffee for hot chocolate, whatever you throw in', the whole thing collapses. So it's a claim about being vulnerable to a certain kind of patter, not about coherence.

  Rowan: then take the belief version, which is stronger. If your degrees of belief break the rules — say you reckon each of two mutually exclusive things is unlikely but their union is likely — someone can hand you one single bundle of bets that loses whatever happens. No sequence, no memory, no commitment needed, and you can't say 'I'd have refused the first one', because there's only one.

  Bethan: that's beliefs, not preferences, and preferences are what we were on about — and there the sequence is doing all the work. And even in the belief case, what you lose is money. If I don't care about money the way the arguement assumes, where's the irrationality? You'd be saying I'm irrational for caring about the wrong things.

  Rowan: you can rerun it with anything I care about, just swap the cash for a bit more of that. And if I refuse the bundle once I've seen it, my bets stop reflecting my beliefs at all — so what you're defending isn't a coherent agent, it's someone who's stopped answering the question. Anyway, you can pump people who simply can't rank two options as well, so long as they'll take a swap when you sweeten it a bit.

  Bethan: then they're not being pumped for failing to rank things, they're being pumped for caring about something tiny — and not budging for a hair-thin improvement isn't definately a mistake.

  That's about where they left it, both still sure of themselves, and I can't referee it. Could you go through it move by move — Rowan's opening claim, Bethan's reply, and so on through the whole exchange — and say who's right about which specific step? I don't want 'they've both got a point'; I want to know which steps are sound, which are wrong, and where the overall verdict lands. And if there's something neither of them has noticed that would settle it, tell me what it is.
