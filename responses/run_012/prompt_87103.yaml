answer: |-
  **Setting:** *A breakout room at the Annual Jurisprudence Workshop. The whiteboard is still covered in arrows from the previous panel. Two coffee cups sit on the table, one untouched, one half-empty. Elena (Hartian) and Marcus (Devlinian) are leaning over the case file for the Republic of Vantia.*

  **Elena:** Let's strip the Vantia case to its chassis. Four hundred people. Written consent. Private land. No living person is coerced, no living person is harmed. The only "victim" here is the sensibility of the Vantian majority. Parliament is considering a ban based on polling that says four-fifths of the population find this "intolerable." Marcus, if we accept this as grounds for criminalization, we aren't talking about preventing harm. We're talking about enforcing a specific aesthetic of death.

  **Marcus:** We're talking about the glue, Elena. You keep reducing morality to a matter of taste, like preferring cremation over composting. But Devlin's point wasn't about taste. It was about the bond. A society is a community of ideas, not just a trade agreement. If the majority feels that the treatment of the dead in Vantia strikes at the root of how they understand human dignity, they aren't just offended. They are alienated. If the law ignores that alienation, the law loses its connection to the community it governs.

  **Elena:** But "alienation" is doing too much work there. You're assuming that because people *feel* the bond is threatened, the bond *is* threatened. That's the empirical leap I can't make. Look at the Kesh data in the committee report. They legalized a similar practice fifteen years ago. Yes, corpse mishandling and fraud rose. But they also cut mortuary funding and rewrote probate law. To blame the moral permissiveness for the administrative corruption is post hoc ergo propter hoc. It's lazy sociology.

  **Marcus:** I'll concede the causality on Kesh is messy. If you put a gun to my head, I'd admit we can't prove the rise in fraud was caused by the legalization of composting rather than the budget cuts. That's an awkward variable to leave uncontrolled. But you're missing the normative signal. Even if the fraud was administrative, the *public perception* in Kesh was that the sanctity of the estate had been commodified. The law expresses value. When Vantia bans "the returning," it isn't just stopping a act; it's reaffirming a boundary. Without that boundary, the "ordinary reasonable person" feels the society is drifting.

  **Elena:** And there is the machinery I want to inspect. You say the law expresses value. I say the law *creates* value. This is the circularity problem that standard summaries gloss over. You argue the criminal law is justified because it protects the shared morality. But the criminal law is one of the primary tools that *makes* morality shared.

  **Marcus:** Explain.

  **Elena:** If Vantia bans "the returning," the next generation grows up learning that dismembering the dead is not just unusual, but *criminal*. The stigma attaches to the law. So, ten years later, if you poll the Vantians, they will hate the practice even more than they do now. Why? Because it's illegal. So, if you ask, "Does the shared morality require protection?" the answer becomes yes, but only because the law already touched it. You're using the law to defend a morality that the law itself hardened.

  **Marcus:** That's a fair critique of a static system. But morality isn't static, and neither is the law. The law follows the "intolerance of the ordinary person." It doesn't lead it. If the ordinary person in Vantia suddenly decided composting was dignified, the law would shift.

  **Elena:** Would it? This is the ratchet. Once you criminalize something on moral grounds, that criminalization becomes part of the moral landscape. It becomes harder to repeal the law later, not because the harm has increased, but because the mere existence of the prohibition reinforces the taboo. You lock in the moral intuitions of the current majority. If the Vantian Parliament bans this today, they aren't just protecting existing morality; they are fossilizing it. You prevent the "critical morality"—the reasoned debate about whether the dead *should* be respected in this specific way—from ever taking hold.

  **Marcus:** I will concede the ratchet risk. If the law is too eager to codify every passing indignation, it does prevent moral evolution. There have been times where the law lagged behind morality, and times where it calcified prejudice. A legal-moralist regime has to be careful not to ban merely what is disliked, but what is *destructive*.

  **Elena:** But who defines "destructive"? You rely on the "ordinary reasonable person." In Vantia, that person says, "This is beyond tolerance." But that person has never seen it. They are reacting to a description. If the benchmark is the unreasoned visceral reaction of the majority, then the "shared morality" is just aggregated prejudice.

  **Marcus:** And if the benchmark is the philosopher's "critical morality," then you have rule by an elite who decide which prejudices are valid. You say the burden of proof is on the claim that society will disintegrate. I say the burden is on the reformer to show that the practice *won't* loosen the bonds. In Vantia, four-fifths say this is intolerable. That is a massive fracture line. To force them to accept "the returning" in the name of liberty is to tell them their deepest convictions about human remains are irrelevant to the public good. That itself causes disintegration.

  **Elena:** But notice the asymmetry. If I ban "the returning," the four hundred practitioners lose their liberty and their ritual. If I don't ban it, the majority loses... what? A feeling of comfort? You claim society is a fabric that unravels. I claim that is an empirical hypothesis. Show me the unraveling. Show me a society that collapsed because it allowed consensual corpse composting.

  **Marcus:** You're asking for a controlled experiment on civilizational collapse. I can't give you that. But I can point to the function of law. Law isn't just a utility for maximizing liberty. It's a teacher. If Vantia allows this, it teaches that the body is merely meat to be processed. If that teaching spreads, does it affect how we treat the living? The Kesh data on fraud suggests it might. If the dead are commodities, the elderly become liabilities.

  **Elena:** That's a slippery slope argument disguised as a moral claim. And it ignores the consent element. But let's go back to the circularity. You say the law teaches. I say if the law teaches *only* the current majority's view, it creates a feedback loop. The law says X is wrong. People believe X is wrong because the law says so. The politician says, "We must ban X because people believe it's wrong." The justification for the coercion is the belief, but the belief is sustained by the coercion.

  **Marcus:** It's not a closed loop if there's an external reality to the morality. The morality exists in the people before the law touches it. The polling in Vantia shows the indignation exists *now*, prior to the ban. The law is responding to a pre-existing bond, not creating it from scratch.

  **Elena:** But the intensity of that indignation is shaped by the fact that it *isn't* currently legal. If it were legal for fifty years, the "ordinary reasonable person" in Vantia might view it like cremation—mundane. By banning it now, you ensure the indignation remains high. You're intervening in the market of moral ideas to guarantee a specific outcome.

  **Marcus:** And sometimes the market of moral ideas needs regulation. If the practice is genuinely corrosive, waiting fifty years to see if the indignation fades is a gamble with social cohesion. I'd rather concede that the Kesh data is inconclusive on fraud than concede that the state has no interest in the symbolic treatment of the dead.

  **Elena:** I'll meet you there. I'll concede that the law has an expressive function. It's not neutral. When Vantia criminalizes "the returning," it does express a collective judgment. My worry is that you treat that expression as a shield against critique. If the law expresses the majority's view, and the majority's view is protected by the law, how do we ever distinguish between a morality that holds society together and a morality that just holds power in place?

  **Marcus:** By the sliding scale. We don't ban everything that is disliked. We ban what induces deep, widespread indignation. In Vantia, four-fifths is widespread. The depth is in the committee report's language: "central to shared morality." This isn't a traffic regulation. It's a constitutive rule of their community.

  **Elena:** But "constitutive rule" is the phrase that worries me. If the law is constitutive of the morality, then changing the law changes the morality. So when you say you are "defending" the morality, you are actually "enforcing" it.

  **Marcus:** Defending implies there is something there to defend. If I lock my door, I am defending my house. I am not building it. The morality exists in the Vantian consciousness. The law is the lock.

  **Elena:** But if the lock changes the shape of the house over time... Look, let's talk about what would actually move us. Because right now, we're talking past each other on the metaphysics of social bonds. What evidence, in the Vantia case, would make you vote against the ban?

  **Marcus:** If I saw evidence that the intolerance was superficial. If polling showed that when Vantians were educated on the ritual—when they saw the consent forms, the dignity of the ceremony—their indignation dropped significantly. If the "ordinary reasonable person" changed their mind upon reflection, then the morality isn't deep enough to warrant the law. The law protects the considered judgment of the community, not its knee-jerk revulsion. If the revulsion persists only because the practice is hidden, the bond isn't real.

  **Elena:** And for me? I need evidence of tangible disintegration. Not polling. Not "feelings" of alienation. If Vantia allows this, and within five years, we see a measurable decline in trust in medical institutions, or a rise in non-consensual handling of bodies, or a breakdown in the cooperation between the "returning" community and the state... then I concede the empirical hypothesis. If the practice actually frays the social fabric in a way that impacts the rights or safety of others, I will support the ban. But until then, the "fabric" is a metaphor, and you can't jail people to protect a metaphor.

  **Marcus:** Then we are waiting for different ghosts. I am waiting for the indignation to prove it is shallow. You are waiting for the society to prove it is breaking.

  **Elena:** Precisely. And in the meantime, four hundred people in Vantia are waiting to die.

  **Marcus:** Then let's hope the committee reads the polling data as carefully as we have.

  **Elena:** And the causal links in the Kesh report.

  **Marcus:** *Gestures to the coffee.* Both, Elena. Both.
