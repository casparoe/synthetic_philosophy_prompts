          *   *Philosopher B (Devlinian):* Society has standing to defend its moral code (like political institutions), benchmark is the "ordinary reasonable person," interference based on sliding scale of tolerance/indignation, not just harm.
      *   **Setting:** Small workshop, arguing over a case study.
      *   **Case Study:** Republic of Vantia. Community of 400 practices "the returning" (consensual dismemberment/composting of dead bodies). Private, no coercion. Public revulsion is high (4/5ths find it intolerable). Neighboring Kesh legalized similar practice; saw rise in corpse mishandling/fraud, but also changed probate law/cut funding (confounding variables).
      *   **Requirements:**
