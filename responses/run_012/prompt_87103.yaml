          *   **Crucial Depth:** Go beyond standard summaries. Address: Is criminal law *constitutive* of shared morality (circularity problem)? Is legal moralism a *ratchet* (laws become morality)?
          *   **Ending:** Each states what evidence would move them.
          *   **Format:** Dialogue. No citations/reading lists.

  2.  **Deconstruct the Arguments & Case:**
      *   *Hartian Angle:* Consent is key. No harm to others (mostly). Public revulsion isn't harm. The Kesh data is correlational, not causal (confounding variables). The "fabric of society" argument is empirical, not logical.
      *   *Devlinian Angle:* Morality binds society. If the bond is broken, society collapses. The "ordinary person" feels this is a violation of the sacred. The Kesh data suggests a slippery slope or normative erosion, even if causal links are messy. Law expresses value.
      *   *The "Crux" (Circularity/Ratchet):*
          *   *Circularity:* Devlin says law protects shared morality. Hart says law *shapes* shared morality. If law bans X, people think X is wrong. If people think X is wrong, Devlin says law must ban X.
          *   *Ratchet:* Once a law is passed based on current morality, it cements that morality, making future repeal harder because the morality has now shifted to include the law.

  3.  **Drafting - Section by Section:**

