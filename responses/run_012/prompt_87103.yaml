      *   **Deep Dive 2: The Ratchet Effect:**
          *   Marcus argues stability is good.
          *   Elena argues it prevents moral progress. If law codifies current disgust, you can't evolve.
          *   *Concession:* Elena admits society needs some stability. Marcus admits the ratchet can lock in error.
      *   **The "Ordinary Reasonable Person":**
          *   Debate the benchmark. Is the Vantian majority "reasonable" or just "prejudiced"?
          *   Marcus: It's not about truth, it's about cohesion.
          *   Elena: Cohesion based on error is fragile.
      *   **Conclusion:** What evidence would move them?
          *   Elena: Empirical proof of tangible harm or proof that Vantia *won't* disintegrate without the ban.
