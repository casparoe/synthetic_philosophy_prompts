      Let's look at (1) vs (4). (1) says "single probability function." (4) says "credence over first-order probability." If you integrate that out, you get a single marginal probability function. So (1) and (4) are consistent *provided* you reduce the higher-order uncertainty. This reinforces the conflict with (2).

