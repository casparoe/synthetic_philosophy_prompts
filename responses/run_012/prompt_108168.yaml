      *   (1) vs. (2): (1) implies MEU with a single probability function. Ellsberg preferences cannot be represented by a single probability function (they require imprecise probabilities or non-additive measures).
      *   (1) vs. (4): These seem compatible. (4) explains how to handle "unknown probabilities" within (1).
      *   (4) vs. (2): If (4) is true (ambiguity is just higher-order uncertainty), then a Bayesian agent with a prior over the urn composition should *not* exhibit Ellsberg preferences (they should reduce to risk). So (4) undermines the rationale for (2).
      *   (5) vs. (1)/(3): CDT usually relies on a causal graph but maintains probabilistic credences. It generally respects STP *within* the causal framework, but Newcomb problems challenge the link between evidence and causation.
