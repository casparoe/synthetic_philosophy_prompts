      *   *To save (4):* Must drop (2).
      *   *To save (6):* Compatible with most, but undermines the "pragmatic" defense of (1).

  7.  **Refining the "Obvious" vs. "Real" Problem:**
      *   The user suspects the (2) vs (3) conflict isn't the *real* problem. Why? Because many people live with that tension (e.g., "STP is normative, but I have this intuition").
      *   The *deeper* problem is likely (4). (4) is the attempt to reconcile (1) and (2) that fails. It claims to explain ambiguity within Bayesianism, but doing so eliminates the rationality of ambiguity aversion.
