      *   (3) **Sure-Thing Principle (STP):** A genuine requirement of rationality. (Savage's P2).
      *   (4) **Reductionism about Ambiguity:** No separate ambiguity attitude. Unknown probability = higher-order uncertainty (credence over credences). Merges into standard Bayesianism.
      *   (5) **Causal Decision Theory (CDT):** Newcomb problems show Evidential Decision Theory (EDT) is *mistaken*.
