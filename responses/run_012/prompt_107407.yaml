  Search not for bits of atoms in the dust.
  For smallest bits are not the base of things.
  The Whole is prior to the many parts.
  The shard exists, it cuts, it has its place,
  But borrows being from the greater mass.
  No time elapsed between the one and all,
  No cause to strike the universe awake.
  The Whole is prior to the many parts.
  It is not size that makes the fundament,
  But where the chain of asking comes to rest.
  Not in the speck, but in the vast expanse.
  The part is real, dependent on the One.
  A ripple on the sea's own heavy weight.
  The Whole is prior to the many parts.
  So here we stand upon the final floor,
  The World stands now complete, with naught outside.
  If every fragment finds its virtue here,
  In virtue of the total being's sum,
  Then what supports the total sum itself?
