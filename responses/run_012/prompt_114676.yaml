answer: |-
  Hey there. First off, take a breath. You haven't just had a roommate fight; you've stumbled into the central tension of contemporary epistemology of speech. Your roommate is arguing for a *hearer-protective* norm (roughly, "Don't make me rely on you unless you're solid"), and you were arguing for a *speaker-protective* norm (roughly, "If I'm right and I mean it, leave me alone"). That's not dumb; that's the field.

  Since you're TAing this, let's treat this like a workshop. You asked for the logical space first, so let's map the terrain before we build the quiz.

  ### The Logical Space of Assertion

  When we ask "What governs assertion?", we aren't just asking one question. We're asking a cluster of questions that usually get lumped together. To get the weird offshoots you want, we need to disentangle them:

  1.  **The Constitutive Question:** What makes an act an *assertion* rather than a guess or a joke? (Is it aiming at truth? Aiming at knowledge?)
  2.  **The Evaluative Question:** When is an assertion *correct*? (Is it correct if it's true? Or only if it's known?)
  3.  **The Deontic Question:** When is a speaker *permitted* to assert? (This is where blame and excuses come in.)
  4.  **The Hearer Question:** What is the audience entitled to do? (Accept? Rely? Challenge?)
  5.  **The Context Question:** Do the rules change based on stakes, audience, or medium?

  Most intro classes teach you four boxes: **Truth Norm** (Just say what's true), **Belief Norm** (Say what you believe), **Justification Norm** (Say what you have evidence for), and **Knowledge Norm** (Say only what you know).

  But the interesting stuff happens in the cracks. For example:
  *   **Objective vs. Subjective:** Is the norm based on the facts (Truth/Knowledge) or the speaker's head (Belief/Justification)?
  *   **Primary vs. Secondary:** Is there a rule for "winning" (Truth) and a separate rule for "playing properly" (Knowledge)?
  *   **Speaker vs. Hearer:** Can a speaker violate a norm while the hearer is still rational to rely on them?

  Okay, let's build the instrument. Here is the "Norms of Assertion Diagnostic."

  ***

  ### The Diagnostic Quiz

  **Instructions:** For each scenario, pick the option that best matches your intuitive reaction. Don't overthink it; go with your gut judgment on what is *wrong*, *okay*, or *appropriate*.

  **1. The Lottery Ticket**
  You hold a lottery ticket. The odds are one in ten million. You haven't heard the results yet, but statistically, you have lost. You turn to a friend and say, "My ticket lost."
  *   A) This is fine. The probability is high enough to treat it as fact.
  *   B) This is improper. You don't *know* it yet, even if it's true.
  *   C) This is fine only if you hedge ("It probably lost").

  **2. The Skeptical Teacher**
  A high school biology teacher is teaching evolution. She personally finds the evidence unconvincing and leans toward creationism, but she knows the curriculum requires her to teach evolution as fact. She stands up and asserts, "Humans evolved from primates."
  *   A) She is lying/acting improperly. You shouldn't assert what you don't believe.
  *   B) She is doing her job. The truth of the matter matters more than her personal belief.
  *   C) She should disclose her doubt first.

  **3. The Hurtful Secret**
  You know for a fact that your friend's partner is cheating. You have proof. You also know that telling your friend will devastate them and fix nothing. You assert to your friend, "Your partner is cheating."
  *   A) Epistemically, the assertion is perfect. The morality is separate.
  *   B) The assertion is improper because you shouldn't say it, regardless of truth.
  *   C) The assertion is improper because you don't know how your friend will take it (pragmatic encroachment).

  **4. The Lucky Guru**
  A speaker asserts a complex scientific claim. She has no evidence and doesn't actually know it (she guessed), but it turns out to be true. You, the hearer, have no way to check.
  *   A) She was wrong to say it, and you are wrong to believe her.
  *   B) She was wrong to say it, but you are rational to believe her (she seems confident).
  *   C) If it's true and she seems confident, both of you are fine.

  **5. The Hedge**
  You aren't sure if the meeting is at 2 PM or 3 PM. You say to a colleague, "I think the meeting is at 2 PM." It turns out you were wrong.
  *   A) You broke no rules. Hedging lowers the bar.
  *   B) You still shouldn't have spoken unless you knew. Hedging doesn't excuse ignorance.
  *   C) You should have stayed silent.

  **6. The Private Diary**
  You write in a locked diary: "The butler did it." You have no proof, just a hunch. No one will ever read this.
  *   A) This isn't an assertion, so norms don't apply.
  *   B) It is an assertion, and it's improper because you don't know it.
  *   C) It is an assertion, and it's fine because there's no risk of misleading others.

  **7. The Committee Report**
  A corporate committee issues a report stating, "Our software is secure." No single member knows this is true; Member A checked the code, Member B checked the servers, Member C checked the logs. Together they know; individually they don't.
  *   A) The assertion is improper. A group can't know what no member knows.
  *   B) The assertion is proper. Distributed knowledge counts for group assertion.
  *   C) The assertion is proper only if they cite their sources.

  **8. The Misleading Evidence (Excuse vs. Permission)**
  You look at a clock that says 2:00 PM. It is 2:00 PM. You assert, "It's 2:00 PM." Unbeknownst to you, the clock stopped exactly 24 hours ago. You have excellent evidence, but you don't *know* (it's a Gettier case).
  *   A) You did nothing wrong. You were justified.
  *   B) You did something wrong, but you are excused because it wasn't your fault.
  *   C) You did something wrong and are blameworthy for not checking better.

  **9. The Stakes Shift**
  *Case A:* You tell a friend the last bus leaves at 9 PM. If they miss it, they walk 20 mins.
  *Case B:* You tell a friend the last bus leaves at 9 PM. If they miss it, they are stranded in a dangerous area overnight.
  *Your evidence is the same in both (you read the sign once).*
  *   A) You can assert in Case A, but not Case B. Stakes change the rules.
  *   B) The rules are the same. If you can't assert in B, you shouldn't in A either.
  *   C) The rules are the same. If it's okay in A, it's okay in B (they should just verify).

  ***

  ### Scoring Key & Position Mapping

  Tally your answers. There is no perfect score, but patterns reveal your philosophical commitments.

  **The "Knowledge First" Cluster (Mostly B's)**
  *   **Position:** **The Knowledge Norm.**
  *   **View:** Assertion is governed by knowledge. If you don't know, don't say it. Truth isn't enough; belief isn't enough.
  *   **Hearer Implication:** Hearers are entitled to assume the speaker knows. If the speaker doesn't know, the hearer is entitled to feel misled, even if the claim was true.
  *   **Note:** This is your roommate's position. It prioritizes the safety of the information exchange.

  **The "Truth/Reliability" Cluster (Mostly A's on 1, 2, 4, 6)**
  *   **Position:** **The Truth Norm (or Reliability Norm).**
  *   **View:** The primary goal is getting true information out there. If the claim is true and well-supported (even statistically), the assertion is successful.
  *   **Hearer Implication:** Hearers should track reliability, not necessarily the speaker's internal state.
  *   **Note:** This was your defensive position ("It was true!"). It prioritizes the flow of information over the speaker's epistemic status.

  **The "Sincerity" Cluster (Mostly A on 2, B on 1)**
  *   **Position:** **The Belief Norm.**
  *   **View:** Assertion is an expression of belief. If you believe it, you can say it. Truth is a goal, but sincerity is the rule.
  *   **Note:** Rarely held as a sole norm in epistemology, common in psychology of communication.

  **The "Contextualist" Cluster (A on 1 & 9, B on 3)**
  *   **Position:** **Epistemic Contextualism / Pragmatic Encroachment.**
  *   **View:** The standards for assertion shift based on practical stakes and conversational context.
  *   **Note:** This explains why you felt okay telling your roommate about the bus (low stakes) but might hesitate on medical advice.

  **The "Dual-Norm" Cluster (A on 8, B on 1)**
  *   **Position:** **The Objective/Subjective Split.**
  *   **View:** There is a difference between *correctness* (did you get it right?) and *assertability* (were you allowed to say it?).
  *   **Note:** This addresses your specific hunch. See below.

  **The "Hearer-Relative" Cluster (B on 4, A on 8)**
  *   **Position:** **Assurance View / Interpersonal Norm.**
  *   **View:** The norm isn't about the speaker's mind, but about the relationship. Did the speaker give the hearer a right to rely?
  *   **Note:** This bridges the gap between you and your roommate.

  ***

  ### Analysis: Your Hunch and the Empty Space

  You mentioned a hunch: *"Truth is what makes the act okay and Knowledge is what makes the speaker blameless."*

  Is this a real position? **Yes.** In the literature, this is often discussed as the distinction between **Primary Norms** (constitutive rules) and **Secondary Norms** (criticism/blame).
  *   If you hold this, you likely scored **A on Question 8** (Excuse) but **B on Question 1** (Lottery).
  *   **Label:** **The Knowledge Norm with Excuses** (or sometimes **The Truth Norm with Knowledge as Ideal**).
  *   **Coherence:** It is coherent. It suggests that the "rule of the game" is Knowledge, but if you violate it through no fault of your own (misleading evidence), you are *excused* even if the act was technically *improper*.
  *   **Why it matters for your fight:** You were arguing about *correctness* (The statement was true, so the act was good). Your roommate was arguing about *warrant* (You didn't have the license to guarantee it). This position says: You violated the warrant (no knowledge), but since it was true, the outcome wasn't a disaster. You were both half-right.

  #### Where the Quiz Collapses (Indistinguishable Positions)

  1.  **Knowledge vs. Justification (in non-Gettier cases):** In 95% of real-life cases, if you have Justification, you have Knowledge. The quiz only separates these in Question 8 (the stopped clock). If your group doesn't feel the pull of Gettier cases, the Knowledge Norm and Justification Norm will look identical.
  2.  **Truth vs. Knowledge (in non-lottery cases):** If you believe p, and p is true, and you have evidence, you usually know p. The Lottery Question (1) is the only clean wedge. If everyone agrees you can't assert lottery losses, Truth Norms are dead. If everyone agrees you *can*, Knowledge Norms are in trouble.

  #### The Empty Space (Unoccupied/Unattractive Positions)

  1.  **The "Falsehood is Fine" Norm:** A position where a speaker is permitted to assert *false* things provided they believe them.
      *   *Status:* **Incoherent/Unattractive.** Almost no one defends this. Assertion has a "direction of fit" toward the world. If you don't care about truth, you aren't asserting; you're opining or storytelling.
  2.  **The "Private Knowledge" Norm:** A position where Knowledge is required for public assertion, but *no norm* applies to private diary entries (Question 6).
      *   *Status:* **Unexplored but plausible.** Many philosophers treat assertion as essentially interpersonal. If there's no hearer to mislead, is there a norm? This is a live debate. If you scored C on Q6, you're in a growing minority.
  3.  **The "Hearer-Irrelevant" Norm:** A position where the speaker's permission is totally independent of the hearer's entitlement (Question 4).
      *   *Status:* **Unattractive.** If a speaker is "allowed" to speak but the hearer is "wrong" to listen, the speech act fails its function. Most theories try to align speaker permission with hearer entitlement.

  ### Final Advice for the Reading Group

  When you run this, watch out for **Question 2 (The Teacher)**. It's the trapdoor.
  *   If they say the teacher is **wrong**, they are committed to a **Belief Norm** (Sincerity trumps Truth).
  *   If they say the teacher is **right**, they are committed to a **Truth/Knowledge Norm** (Fact trumps Sincerity).
  *   *But*, if they say the teacher is right *only because* she is teaching science, they are smuggling in **Institutional Norms** (roles change the rules).

  Your fight with your roommate wasn't about epistemology; it was about **trust**. She treats assertion as a *promise* ("I guarantee this"). You treated it as a *report* ("This is how things are"). The quiz should help your group see that both are viable frameworks, just prioritizing different parts of the communication loop.

  Good luck with the section. And maybe check the bus schedule online before you mention it again. Just to be safe.
