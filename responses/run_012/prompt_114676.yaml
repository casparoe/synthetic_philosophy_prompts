prompt: |-
  I'm a first-year MA student and I got into a genuinely dumb fight with my roommate last week that I can't stop chewing on. I told her the last bus downtown leaves at 9 (I was sure, and it's true, I've lived here two years) and she asked how I knew, and it turned out I'd only ever read the sign at the stop and never actually checked a schedule. She said I had no business saying it like that, since I didn't *know* it. I said it was true and I believed it, what else do you want. She said that's the whole point of asserting something — you're handing someone a license to rely on you. I didn't have a comeback, mostly because I realized I don't actually know what the menu of positions is here, or which one I'm on.

  Now I'm also TAing an intro epistemology section and the prof is doing norms of assertion next month, so this has gone from annoying to professionally relevant. Act as a philosopher who works on speech acts and the epistemology of testimony, someone who has really thought through the knowledge/truth/belief/justification debates and their weird offshoots. Think carefully before you write. Actually, start by brainstorming the logical space of possible positions rather than listing famous names — I care more about the space than the roster.

  What I want: a "which norm of assertion do you actually hold?" quiz for me and my reading group. Nine questions, each one a concrete case with two or three answer options, plus a scoring key that maps answer patterns onto positions. No question may just ask "do you think assertion requires knowledge?" — people will answer by picking the label they like. They have to answer the case and find out where it lands them.

  Here's the thing: don't just give me the standard four (knowledge, truth, belief, justification). I want the quiz to be able to land people on the weirder options, so build cases that pull these apart: a true assertion resting on pure statistics (I'm sure my lottery ticket lost); someone asserting something they don't believe but think is true and good for the audience to hear (a biology teacher who isn't convinced herself); someone who knows but really shouldn't have said it out loud; someone who doesn't know but whose audience has excellent reason to trust her anyway; hedged assertions ("I think p"); assertion with no audience at all — a private diary, or talking to yourself; a corporation or committee asserting something no single member knows; a case where the speaker's evidence is fine but a hearer's evidence is better and contradicts her; a case where the speaker is clearly excused but still did something wrong; and the same evidence in low-stakes versus high-stakes settings. Also keep the speaker-side question (what makes the act okay) separate from the hearer-side one (what a hearer is entitled to do — accept it, rely on it, resent it), because that's exactly where my roommate and I were talking past each other.

  Then the key. For each pattern, name the position if it has one, and use "unnamed" if nobody defends it. Please don't give me citations or a reading list — I can't check them and a wrong attribution is worse than none, so descriptive labels are fine. I have a half-baked hunch that there's a division of labor, where truth is what makes the act okay and knowledge is what makes the speaker blameless — put that on the map and tell me if it's a real position or just me being confused.

  Finally: say which of the positions your quiz can't actually separate, and why they collapse (do they agree on every case, or does the quiz just fail to reach the disagreement?). And flag any combination in the space that nobody seems to occupy, with your best guess as to whether it's incoherent, unattractive, or just unexplored.

  Casual tone is fine, and please write it in American English.
