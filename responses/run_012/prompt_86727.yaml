      *   **Physicist's Claim:** "Time's arrow is just the arrow of entropy," and the rest of the debate is a "verbal dispute."
      *   **Task:** Provide a "menu" of precise theses that this one-liner could be asserting.
      *   **Ordering:** From platitudinous to radical.
      *   **Required Analysis for Each Thesis:**
