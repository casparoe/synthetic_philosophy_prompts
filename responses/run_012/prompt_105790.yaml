  # JOINT STATEMENT ON NOMIC AND SELF-AMENDMENT
  **Prepared by the Grounding and Reflexivity Camps**
  **Philosophy Club Year-End Project**

  ### 1. Agreed Claims
  We, the undersigned members of the Philosophy Club, having engaged in adversarial collaboration regarding the game of Nomic and the nature of self-amending rule systems, affirm the following claims as common ground:

  1.  **Hierarchy and Foundation:** All rule-based systems operate via a hierarchy where lower rules derive validity from higher rules. We agree that this hierarchy cannot regress infinitely and must terminate in a foundational rule (a "basic norm" or "rule of recognition") whose authority rests on social fact (acceptance by the players) rather than a higher rule.
  2.  **Definition of Paradox:** We agree that a logical paradox exists only if the system generates a contradiction that halts operation or makes judgment impossible. Mere counter-intuitive results or shifts in social fact do not constitute a paradox.
  3.  **Puzzle (i) Verdict (Single Rule):** Regarding the rule *"This rule may be repealed by a simple majority"*: We agree that if a majority votes to repeal, the rule ceases to exist within the game. We agree that the game either ends or continues under a new implicit agreement. We disagree on whether to label the repeal "valid" (Grounding) or "an extra-legal reset" (Reflexivity), but agree on the physical outcome.
  4.  **Puzzle (ii) Verdict (Conflicting Rules):** Regarding Rules (A) *"Any rule may be amended by 2/3 majority"* and (B) *"Rule A may not be amended"*: We agree that the system contains a logical inconsistency regardless of the vote. We agree that a 2/3 vote to amend B resolves the *practical* conflict but does not resolve the *logical* contradiction inherent in the initial set.
  5.  **Scope of Nomic:** We agree that Nomic demonstrates that legal continuity is fragile and depends on player cooperation. We disagree on whether this fragility proves a logical flaw in self-amendment (Reflexivity) or merely describes the sociological limits of any legal system (Grounding).

  ### 2. Precise Remaining Disagreements
  While we agree on the mechanics described above, we maintain the following distinct characterizations of the foundational transition:

  *   **The Grounding Camp maintains:** When a foundational rule is amended according to its own procedures, the legal order remains continuous. The new rule is "valid" because the old rule successfully authorized the transition, and the social fact of acceptance confirms it. There is no break in legality.
  *   **The Reflexivity Camp maintains:** When a foundational rule is amended, the legal order undergoes a rupture. The new rule cannot be "valid" under the old rule (since the old rule is gone) nor under itself (since it did not exist yet). The transition relies on an extra-legal act of force or acceptance that the legal form merely masks.

  ### 3. The Cruxes
  We identify the following sub-question as the primary driver of our disagreement:

  *   **The Validity Crux:** Does the term "validity" refer to (a) logical derivation from a prior existing norm, or (b) the successful establishment of a norm that is effectively accepted by the community?

  ### 4. Tests and Predictions
  To address the Validity Crux, we agree that the following thought experiment bears directly on our disagreement:

  *   **The Case of the Perfect Coup:** A group follows every procedural requirement of the old foundational rule to adopt a new foundational rule. The vote is unanimous. However, immediately after the vote, every player privately decides to ignore the new rule and reverts to the old one, though they pretend to follow the new one publicly to avoid conflict.
  *   **Grounding Camp Prediction:** The new rule was never valid. Because validity requires social fact (actual acceptance), the lack of genuine acceptance means the transition failed. The old rule remains the foundational fact.
  *   **Reflexivity Camp Prediction:** The new rule was legally "valid" but practically void. The procedure was followed, so the legal form was satisfied, but the extra-legal force required to sustain it was absent. This proves that legal validity is distinct from effective power.

  ### 5. Verdict on Verbal Dispute
  We explicitly agree that a significant portion of our dispute is verbal. We acknowledge that the Grounding Camp uses the word "validity" to mean "systemic continuity confirmed by social fact," while the Reflexivity Camp uses "validity" to mean "logical derivation from a prior norm."

  If we adopt a unified terminology where "legal validity" denotes systemic continuity and "logical validity" denotes derivation, our substantive disagreement collapses. We agree that the *mechanics* of the transition are identical in both views (procedure + acceptance); we differ only on whether the label "valid law" applies to the moment where procedure meets acceptance. We conclude that the Grounding Camp's terminology is more useful for describing functioning legal systems, while the Reflexivity Camp's terminology is more useful for describing revolutionary breaks.

  Verdict: The disagreement turns on whether the term 'validity' refers to logical derivation from a prior norm or to the successful establishment of a new social fact.
