      *   *Scenario:* Imagine a world with fewer wars (fewer acts) but each war uses nukes (more individuals affected).
          *   Act count: Decline.
          *   Victim count: Increase (or stable high risk).
          *   *Conclusion:* Yes, the choice changes the answer.

  5.  **Tackle the Philosophical/Methodological Question (Fact vs. Normative):**
      *   *Positivist View:* There is an objective reality. Violence is physical harm. The "best" measure is the one that most accurately captures physical harm. (Likely individual suffering).
      *   *Constructivist/Normative View:* "Violence" is a category we impose. What matters depends on *why* we are measuring.
          *   Policy/Security focus? Maybe count acts (instability).
          *   Humanitarian focus? Count individuals (suffering).
          *   Legal focus? Count crimes (acts).
      *   *Irreducibly Normative:* There is no "view from nowhere." Choosing a unit prioritizes certain values (frequency of conflict vs. magnitude of suffering). Therefore, it is normative.

  6.  **Drafting the Structure:**
