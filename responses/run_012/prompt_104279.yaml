answer: |-
  To measure long-run trends in violence, researchers must first solve the metaphysical and methodological problem of **individuation**: what constitutes a single unit of violence? The two primary competing units are **discrete violent acts** (event-based) and **affected individuals** (victim-based).

  This choice is not merely technical; it fundamentally alters the statistical trajectory of violence when combined with absolute or per capita scaling. Consequently, the question of whether the world is becoming less violent often depends less on empirical reality and more on the normative priorities embedded in the chosen metric.

  ### 1. Defining the Units of Analysis

  **Discrete Violent Acts (Event-Based)**
  This approach counts instances of conflict or aggression as singular units. In international relations, this might mean counting the onset of a war, a battle, or a terrorist incident. In criminology, it means counting reported assaults or homicides as distinct cases.
  *   **Focus:** Frequency, incidence, and the breakdown of order.
  *   **Implicit Value:** Stability and the rule of law. A world with fewer wars is "less violent," regardless of the casualty count per war.

  **Affected Individuals (Victim-Based)**
  This approach counts the human beings harmed, typically operationalized as violent deaths or injuries.
  *   **Focus:** Magnitude, suffering, and human welfare.
  *   **Implicit Value:** The sanctity of life. A war killing 100,000 people is 100,000 times more "violent" than a skirmish killing one person, even if both count as "one war."

  ### 2. Interaction with Absolute and Per Capita Measures

  The choice of unit interacts dynamically with how the data is aggregated (absolute totals vs. rates relative to population).

  | | **Absolute Measures** (Total Count) | **Per Capita Measures** (Rate) |
  | :--- | :--- | :--- |
  | **Discrete Acts** | **Total Conflicts/Crimes.**<br>Trend: May rise as detection/reporting improves or as political fragmentation increases.<br>*Risk:* Ignores population growth. More people usually means more potential friction points. | **Conflicts per Million People.**<br>Trend: Rarely used. Conceptually awkward (why divide wars by population?).<br>*Risk:* Obscures the scale of destruction. A civil war in a small nation counts the same as one in a giant nation. |
  | **Affected Individuals** | **Total Deaths.**<br>Trend: Likely to rise simply due to population growth, even if safety improves.<br>*Risk:* Can suggest violence is increasing when the *risk* to an individual is actually falling. | **Deaths per 100,000 People.**<br>Trend: The gold standard for risk assessment (e.g., Pinker's thesis).<br>*Risk:* Can minimize absolute suffering. A drop from 0.01% to 0.005% death rate is a "decline," even if absolute deaths rise due to population boom. |

  **The Interaction Effect:**
  The most significant divergence occurs when combining **Affected Individuals** with **Per Capita** measures (the standard for the "Long Peace" thesis) versus **Discrete Acts** with **Absolute** measures.
  *   If population triples, but the *rate* of victimization halves, the **Per Capita Victim** measure shows a decline (world is safer), while the **Absolute Victim** measure shows an increase (more total suffering).
  *   If wars become less frequent but more lethal (due to technology), the **Act** count declines, but the **Victim** count may spike.

  ### 3. Can the Choice Change the Answer?

  Yes. The choice of individuation can reverse the conclusion regarding whether the world is becoming less violent. This is best illustrated by the debate surrounding Steven Pinker's *The Better Angels of Our Nature*.

  **Scenario A: The "Long Peace" (Victim/Per Capita Focus)**
  Pinker primarily uses violent death rates (individuals per capita). By this metric, the post-WWII era looks exceptionally peaceful. Great Power wars have vanished, and homicide rates have dropped globally. The *probability* of an individual dying violently is at a historical low.
  *   *Conclusion:* The world is less violent.

  **Scenario B: The "Tail Risk" (Act/Victim Absolute Focus)**
  Critics (such as Nassim Taleb or Pasquale Cirillo) argue that violence follows a **power law distribution**. Most events are small, but a few are catastrophic (World Wars, nuclear exchange).
  *   **Individuation Issue:** If you count *acts* (wars started), the trend is downward. However, if you count *individuals* with an eye toward **absolute maximum capacity for harm**, the trend is ambiguous. Modern technology allows a single "act" (e.g., a nuclear launch or a bioterror event) to affect orders of magnitude more individuals than a 19th-century battle.
  *   **The Reversal:** If we individuate violence by "potential affected individuals" rather than "historical deaths," the risk profile may be increasing. A world with fewer wars (fewer acts) but nuclear weapons (higher potential victims per act) is "less violent" by frequency but "more violent" by catastrophic risk.

  Furthermore, if we prioritize **Absolute Individuals** over Per Capita rates, the 20th century looks like the most violent in history simply because there were more people to kill. If the moral imperative is to reduce total suffering, the per capita decline matters less than the absolute toll. Thus, a utilitarian focusing on total pain might conclude violence has increased, while a liberal focusing on individual risk concludes it has decreased.

  ### 4. Fact of the Matter or Irreducibly Normative?

  Is there an objective fact about which unit is correct? **No.** The choice is irreducibly normative.

  **The Argument for a "Fact of the Matter" (Positivist)**
  A positivist might argue that violence is physically objective: it is the infliction of physical harm. Therefore, the unit that most accurately captures physical harm is the "true" measure. Since harm is experienced by conscious beings, **Affected Individuals** is the only ontologically valid unit. Counting "acts" is an abstraction; a bomb is not violence until it hits a person. From this view, per capita victim rates are the closest approximation to the truth.

  **The Argument for Normativity (Pragmatist/Ethical)**
  However, "violence" is not merely a physical category; it is a moral and political one. The choice of unit reflects what we value:
  1.  **Social Order vs. Human Welfare:** If we value geopolitical stability, we count **Acts** (wars, insurgencies). A world with many small skirmishes is unstable, even if few die. If we value human welfare, we count **Individuals**.
  2.  **Risk vs. Reality:** Per capita measures prioritize *ex-ante risk* (probability of harm). Absolute measures prioritize *ex-post suffering* (total harm incurred). A policy maker preventing a genocide cares about absolute numbers; an insurance actuary cares about rates.
  3.  **The Problem of Aggregation:** Counting individuals assumes all deaths are equal units of violence. But is the death of a combatant equivalent to the death of a child? Is a torture victim who survives "less violent" than one who dies? The "Individual" unit often flattens these moral distinctions just as much as the "Act" unit does.

  **Conclusion: The Metric Determines the Trend**
  There is no "view from nowhere" to measure violence. The question "Is the world becoming less violent?" is grammatically a factual question but philosophically a normative one. It implicitly asks, "Is the world becoming less violent *in the ways that we care about*?"

  *   If we care about the **likelihood of personal harm**, the **Per Capita Victim** rate is the correct unit, and the world is likely less violent.
  *   If we care about **total global suffering**, the **Absolute Victim** count is the correct unit, and the answer is ambiguous.
  *   If we care about **systemic instability**, the **Discrete Act** count is the correct unit, and the answer depends on whether we fear frequent small conflicts or rare large ones.

  Therefore, the choice between individuating by acts or individuals is not a methodological detail to be solved by better data, but a value judgment to be argued through ethics. To claim one metric proves the world is "less violent" without acknowledging this normative baggage is to mistake a moral preference for a statistical fact.
