  3.  **Analyze the Interaction with Aggregation (Absolute vs. Per Capita):**
      *   *Absolute Measures:* Total count.
          *   Acts: Total number of wars/assaults.
          *   Individuals: Total number of deaths/victims.
      *   *Per Capita Measures:* Rate relative to population.
          *   Acts: Wars per million people? (Less common, but possible).
          *   Individuals: Deaths per 100,000 people. (Standard in criminology/demography).
      *   *Interaction:*
          *   If population grows, absolute victim counts might rise even if the *rate* of violence falls.
          *   If wars become less frequent but more deadly (rare but catastrophic), act counts go down, victim counts might go up (or stay volatile).

  4.  **Address the "Is the World Becoming Less Violent?" Question (The Pinker Thesis):**
      *   *Steven Pinker's Argument:* Uses *rates* of violent death (individuals per capita). Argues violence is declining.
      *   *Critiques (e.g., Satterthwaite, Clauset, Cirillo & Taleb):*
          *   *Tail Risk:* Rare, high-magnitude events (World Wars, nuclear risk) skew the data.
