prompt: |-
  Compare two ways of individuating violence—what counts as a single violent event—when measuring long-run trends: counting discrete violent acts and counting affected individuals. How do these two units interact with per capita and absolute measures, and can the choice between them change the answer to whether the world is becoming less violent? Address whether there is a fact of the matter about the correct unit of analysis, or whether the question is irreducibly normative.
reasoning: |-
