          *   *Verdict:* This is the swamp.

      *   **Severity 2 (High): Multiple Realizability (2) vs. Dispositional Essentialism (5).**
          *   If Fragility is MR, its connection to its manifestation is not necessary in the same way fundamental powers are.
          *   If DE applies to *all* dispositions, MR is hard to square with necessary laws for macro properties.
          *   If DE applies only to fundamentals, Claim 2's insistence on Fragility being "real/irreducible" needs careful handling to avoid it becoming a "cambridge property" or merely functional.

      *   **Severity 3 (Low/Medium): Pure Powers (5) vs. Grounding (4).**
