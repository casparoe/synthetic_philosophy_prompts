answer: |-
  **TO:** Clinical Ethics Committee, Academic Fertility Centre
  **FROM:** Philosophy Practicum Student
  **SUBJECT:** Draft Decision Procedure for Polygenic Risk Score (PRS) Counselling
  **DATE:** October 26, 2023

  ### Preamble: Scope and Ethical Foundation

  This procedure operationalizes the **Principle of Procreative Beneficence (PPB)** within a **Liberal Eugenics** framework. It assumes prospective parents have a moral reason to select the embryo expected to have the best life, based on available genetic information, provided this does not violate significant parental values or rights.

  **Note to Consultant:** This tool is designed to structure the conversation, not to replace clinical judgment. Where a step is marked **[VALUE JUDGMENT]**, the procedure cannot eliminate ethical discretion; it only structures it. Where marked **[FACT]**, the answer relies on medical consensus or laboratory data.

  ---

  ### The Decision Procedure (The "PRS Selection Protocol")

  **Step 1: Validity and Actionability Check [FACT]**
  *   **Question:** Is the polygenic score for the trait in question clinically validated for this specific population, and does the laboratory certify it as actionable for selection?
  *   **Sufficient Answer:** Yes = Proceed to Step 2. No = Stop. Inform parents the score is not medically robust enough to guide selection.
  *   **Rationale:** Prevents selection based on noise or pseudoscience.

  **Step 2: The Welfare Impact Threshold [VALUE JUDGMENT]**
  *   **Question:** Does the trait significantly correlate with expected well-being, defined as the capacity for health, agency, and participation in standard social opportunities?
  *   **Sufficient Answer:**
      *   *High Impact* (e.g., severe disease, major disability): Proceed to Step 3.
      *   *Low/Neutral Impact* (e.g., minor cosmetic traits, negligible risk shifts): Stop. Inform parents selection is ethically neutral; choice returns to parental preference.
      *   *Contested Impact* (e.g., neurodivergence, deafness): Proceed to Step 3, but flag for Step 5 review.
  *   **Rationale:** Addresses the **Harm/Non-Identity** problem. We are not preventing harm to an existing patient but comparing the expected welfare of possible persons.

  **Step 3: The Comparison Class Definition [FACT]**
  *   **Question:** What is the set of *available* embryos for this cycle?
  *   **Sufficient Answer:** The specific cohort of viable embryos currently biopsied and scored.
  *   **Constraint:** Do not compare against hypothetical future embryos, adopted children, or childlessness.
  *   **Rationale:** Limits the **Comparison Class** to the actual choice architecture. PPB applies only to possible children *you could have now*.

  **Step 4: Aggregation and Trade-Off Resolution [VALUE JUDGMENT]**
  *   **Question:** If Embryo A scores higher on Trait X and Embryo B scores higher on Trait Y, which trait weighs more heavily on expected well-being?
  *   **Sufficient Answer:** Apply the **Medical Severity Weighting**:
      1.  Life-limiting conditions > Life-quality conditions.
      2.  Early-onset conditions > Late-onset conditions.
      3.  Health traits > Enhancement traits (e.g., height, education).
  *   **Verdict:** Select the embryo with the higher weighted sum.
  *   **Rationale:** Solves the **Aggregation Problem** by prioritizing objective health metrics over subjective preferences.

  **Step 5: The Parental Override Check [VALUE JUDGMENT]**
  *   **Question:** Do the prospective parents have a reasoned preference that contradicts the Step 4 verdict (e.g., valuing a specific cultural identity associated with a disability)?
  *   **Sufficient Answer:**
      *   If *Yes*: Does this preference impose a significant burden of suffering on the future child (e.g., chronic pain, early death)?
      *   If *No Burden*: Parental preference overrides Step 4. Selection is **Permitted**.
      *   If *Significant Burden*: Parental preference is overruled. Selection is **Discouraged/Forbidden**.
  *   **Rationale:** Balances **Liberal Eugenics** (parental autonomy) with **PPB** (obligation to welfare).

  **Step 6: Therapy vs. Enhancement Classification [FACT/VALUE HYBRID]**
  *   **Question:** Is the selection aimed at avoiding a disease or increasing a trait above the norm?
  *   **Sufficient Answer:** The procedure treats both identically *if* they meet the Welfare Impact Threshold (Step 2).
  *   **Rationale:** Collapses the **Therapy/Enhancement** distinction. Under PPB, increasing well-being is the goal, regardless of whether it restores "normal" function.

  **Final Output:** The consultant issues one of three verdicts:
  1.  **Obligatory:** Only one embryo meets the minimum welfare threshold; others are significantly compromised.
  2.  **Permitted:** Multiple embryos meet the threshold; parents may choose based on preference or minor score differences.
  3.  **Discouraged:** The preferred embryo carries a significant, unmitigated burden of suffering compared to alternatives.

  ---

  ### Analysis of the Five Ethical Challenges

  1.  **Harm and Non-Identity:**
      *   *Procedure Handling:* Step 2 replaces "harm" with "Welfare Impact Threshold."
      *   *Judgment Status:* **Irreducible Value Judgment.** Deciding what counts as "significant correlation with well-being" is not a medical fact. It assumes a specific theory of the good life (e.g., that hearing is better than deafness). The procedure masks this by labeling it "Welfare."

  2.  **Comparison Class:**
      *   *Procedure Handling:* Step 3 restricts comparison to the current cohort.
      *   *Judgment Status:* **Procedural Fact.** This is a hard constraint. It prevents the "paralysis by analysis" of comparing against infinite possible children, but it arbitrarily limits the moral scope to the current IVF cycle.

  3.  **Aggregation Problem:**
      *   *Procedure Handling:* Step 4 uses "Medical Severity Weighting."
      *   *Judgment Status:* **Substantive Moral Commitment.** Prioritizing health over education, or early-onset over late-onset, is a value hierarchy. A parent might value intelligence over a 10% risk of late-onset diabetes. The procedure overrides this.

  4.  **Parental Override:**
      *   *Procedure Handling:* Step 5 allows override unless "Significant Burden" exists.
      *   *Judgment Status:* **Irreducible Value Judgment.** Defining "Significant Burden" is the crux of the ethics. The procedure draws the line at "suffering," but one person's suffering is another's identity.

  5.  **Therapy vs. Enhancement:**
      *   *Procedure Handling:* Step 6 collapses the distinction.
      *   *Judgment Status:* **Procedural Method.** The procedure treats them the same *if* they impact welfare. However, regulatory bodies may not. The procedure assumes the ethical collapse, even if the law does not.

  ---

  ### Application to Cases

  **Case (a): The Cultural Variant**
  *   **Scenario:** Two embryos. Embryo 1 carries a variant for congenital deafness. Embryo 2 is hearing. The parents are Deaf, view Deafness as a cultural identity, not a disability, and prefer Embryo 1.
  *   **Procedure Run:**
      *   Step 1: Valid score? Yes.
      *   Step 2: Welfare Impact? *Contested.* Medical consensus classifies deafness as a functional impairment affecting standard opportunities. Flag for Step 5.
      *   Step 4: Weighting. Hearing > Deafness (based on standard opportunity metrics).
      *   Step 5: Override? Parents prefer Deafness. Is it a "Significant Burden"?
      *   **Verdict:** **Discouraged.** The procedure classifies deafness as a reduction in expected well-being (Step 2) and a functional impairment (Step 4). Unless the parents can prove it imposes "suffering" equivalent to a disease (which they deny), the Medical Severity Weighting defaults to the clinical definition of impairment. The consultant must advise selecting Embryo 2.
  *   **Committee Discomfort:** This verdict validates the claim that the parents' way of life is objectively "worse" than the hearing norm. It instrumentalizes the child as a vessel for optimal functioning rather than a member of a specific community.

  **Case (b): The Trade-Off**
  *   **Scenario:** Embryo A: High PRS for Educational Attainment, High PRS for Coronary Artery Disease (CAD). Embryo B: Average PRS for Education, Low PRS for CAD. Parents value academic success highly.
  *   **Procedure Run:**
      *   Step 1: Valid? Yes.
      *   Step 2: Welfare? Both impact welfare (Health vs. Opportunity).
      *   Step 4: Aggregation. Apply Medical Severity Weighting. Life-limiting/Health (CAD) > Enhancement/Opportunity (Education).
      *   Step 5: Override? Parents prefer Education. Is CAD a "Significant Burden"? Yes, serious late-onset disease.
      *   **Verdict:** **Discouraged** (to select Embryo A). The procedure prioritizes health security over enhancement potential.
  *   **Committee Comfort:** This aligns with standard medical ethics (do no harm), but it explicitly demotes the parents' valuation of education to a secondary status.

  **Case (c): The Single Embryo**
  *   **Scenario:** One prospective parent, one viable embryo. PRS scores are average across the board (no high risks, no high enhancements). Parent asks: "Am I *morally required* to implant this embryo?"
  *   **Procedure Run:**
      *   Step 3: Comparison Class. Only one embryo available.
      *   Step 4: Aggregation. N/A.
      *   Step 6: Therapy/Enhancement. N/A.
      *   **Verdict:** **Permitted, Not Obligatory.** PPB governs *selection between* possible children. Where there is no choice (N=1), the principle of beneficence cannot generate a comparative obligation to *this* embryo over *no* embryo, unless the embryo falls below a minimum welfare threshold (which it does not).
  *   **Committee Comfort:** This reveals the limit of PPB. It cannot generate a duty to procreate, only a duty to select well *if* procreating.

  ---

  ### Critical Reflection: Smuggled Commitments and Limits

  **1. Substantive Moral Commitments Smuggled as Method**
  You asked where I am smuggling philosophy into clinical method. It is primarily in **Step 2 (Welfare Impact)** and **Step 4 (Weighting)**.
  *   **The Definition of Well-Being:** By using "standard social opportunities" and "health" as proxies for well-being, I am committing to a **Perfectionist Liberal** view of the good life. I am assuming that a life with more health and more standard opportunity is *necessarily* better than a life with less, regardless of the subject's own adaptation or community support. This is not a fact; it is a contested philosophical claim.
  *   **The Objectivity of Risk:** The procedure treats polygenic scores as actionable facts (Step 1). However, PRS are probabilistic and population-specific. Treating them as decisive weights in Step 4 smuggles in a commitment to **Genetic Determinism**, albeit a soft one. It assumes the genome is the primary locus of moral intervention, rather than the social environment.
  *   **The Collapse of Therapy/Enhancement:** In Step 6, I treat avoiding diabetes and increasing height as morally analogous if they impact welfare. This smuggles in the **PPB specific claim** that the moral line is well-being, not "normal species functioning." A traditional medical ethicist would reject this.

  **2. What the Procedure Cannot Do**
  *   **It cannot resolve the Non-Identity Problem:** The procedure bypasses the problem by comparing expected welfare, but it cannot explain *why* we owe duty to a non-existent entity. It simply asserts the duty.
  *   **It cannot account for Social Context:** If society discriminates against short people, the procedure might advise selecting for height. This looks like beneficence, but it actually capitulates to injustice. The procedure treats social prejudice as a fixed environmental constraint rather than a mutable moral wrong.
  *   **It cannot handle Uncertainty:** PRS are probabilities. The procedure forces a binary decision (Select/Don't Select) on probabilistic data. It will inevitably lead to "wrong" decisions where the lower-score embryo turns out healthier.

  **3. Does Operationalized PPB Still Say What Its Defenders Claim?**
  *   **The Loss of Nuance:** Savulescu and Kahane present PPB as a *moral reason*, not necessarily a strict *rule*. By turning it into a clinical checklist (Step 4 Weighting, Step 5 Burden), I have hardened a *prima facie* duty into a **protocol**.
  *   **The Coercion Risk:** Defenders argue PPB is compatible with liberal eugenics because it leaves the final choice to parents. However, in a clinical setting, a "Discouraged" verdict from an ethics consultant carries immense weight. It functions as a soft veto. The operationalization risks turning a *reason to choose* into a *pressure to comply*, which undermines the "Liberal" part of Liberal Eugenics.
  *   **Conclusion:** The procedure makes PPB usable, but at the cost of making it more rigid and more medically paternalistic than its philosophical proponents might intend. It solves the problem of *how* to decide, but it obscures the problem of *whether* we should be deciding this way at all.

  **Recommendation to Committee:**
  Adopt the procedure only with a mandatory disclaimer attached to Step 2 and Step 4, explicitly stating that "Welfare Impact" and "Severity Weighting" reflect current medical consensus and ethical framework assumptions, not objective biological facts. This preserves the honesty required when dealing with irreversible decisions about persons who cannot consent.
