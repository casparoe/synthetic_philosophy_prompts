      3.  **Severity 3 (The LLM Hunch):** Gregorian without Popperian. This challenges the *purpose* of the Gregorian rung. If tools don't require a user with a model, the ladder's teleology is broken.
      4.  **Severity 4 (Minor):** Cumulative vs. Distinct Mechanisms. Resolvable by distinguishing functional capacity from architectural implementation.

