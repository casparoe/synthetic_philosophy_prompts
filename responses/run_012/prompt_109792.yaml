      *Re-evaluating Commitment 4:* "Natural selection is itself a Popperian process." Dennett actually *agrees* with this broadly (universal Darwinism), but he distinguishes the *creature types* by where the selection happens. The user's commitment says "Darwinian creatures are already Popperian." This is the slip. A Darwinian creature *undergoes* Popperian selection (at the lineage level), but is not *a* Popperian creature (which selects at the individual level). I need to highlight this category error.

