      *   *Correction on Name:* The user thinks it's named after a psychologist, not a pope. It's named after Karl Popper (philosopher of science). I need to correct this gently but firmly as part of the "hard audience" persona. (Wait, prompt says "I keep meaning to check." I should definitely check this. Yes, Karl Popper. Daniel Dennett coined the terms in *Darwin's Dangerous Idea* and *Kinds of Minds*. The user's uncertainty is a weak point I can exploit to establish authority).

      *   *Refining the "Representationalist" Tension:* This is the big one. Dennett is often interpreted as an instrumentalist about representation (Intentional Stance). The user claims to be a "representationalist" (Commitment 5). If they mean *realist* representationalist, they clash with Dennett's likely view of Skinnerian creatures. But the internal clash is between 3 and 5.
