  3.  **Audit for Tensions (The "Hard Audience" Phase):**

      *   *Tension A: Commitment 4 vs. Dennett's Definitions.* Dennett defines Darwinian creatures as those whose *lineage* learns. Popperian creatures are those whose *individual* hypotheses die in their stead. Commitment 4 says "Darwinian creatures are already Popperian." This collapses the distinction Dennett built the ladder to create. If Darwinian = Popperian (at lineage level), the ladder loses a rung or becomes recursive in a way that muddies the individual/lineage distinction.
