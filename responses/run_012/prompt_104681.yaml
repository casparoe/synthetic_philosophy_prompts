answer: |-
  **CONSISTENCY DYNAMICS LTD.**
  **EMPLOYEE INDUCTION MANUAL: SECTION 4 (CLIENT INTERACTION)**

  **1. Client Taxonomy**

  1.1. **Cyclical Accounts.** These clients possess static but intransitive preferences. At any given moment, they prefer Asset A to B, B to C, and C to A. They do not realise that holding all three simultaneously is impossible. They are our primary revenue source. They require no persuasion, only opportunity.

  1.2. **Temporal Drifters.** These clients possess transitive preferences that shift predictably over time. On Monday, they prefer Future X to Future Y. By Wednesday, they prefer Future Y to Future X. They are willing to pay a fee to switch their commitment from one to the other. They are high-volume, low-margin accounts.

  1.3. **Projection Risks.** These clients anticipate the sequence. They recognise that accepting Trade 1 will inevitably lead to Trade 4, returning them to their original position minus fees. They will refuse the initial offer. They are not hostile, merely overly coherent. They require fragmentation strategies (see Section 4).

  **2. Transactional Integrity**

  2.1. **The Voluntarity Principle.** All interactions must be framed as isolated events. When offering to swap Asset A for Asset B (plus a nominal facilitation fee), the employee must not reference Asset C. The client is asked only if they prefer B to A *now*. If they say yes, the trade is voluntary.

  2.2. **Cumulative Harm.** Clients may occasionally observe that they have returned to their starting position with less capital. They may allege that the sequence constitutes a loss. Employees must remind the client that harm is measured at the point of exchange, not across the sequence.

  2.3. **Logical Defence.** If a client argues that the sum of voluntary trades equals coercion, refer them to Clause 2.1. A walk across a room is a series of steps; if each step is voluntary, the destination cannot be considered forced. We do not sell the destination; we sell the step. The client chooses the topology of their own preferences. We merely provide the liquidity to act on them.

  **3. Duty of Care**

  3.1. **Visible Losses.** The firm's duty of care extends only to losses visible at the moment of transaction. If a client pays $5 to swap A for B, they must perceive the value of B as exceeding A + $5. If they perceive this, no loss has occurred in that moment.

  3.2. **Invisible Depletion.** A reduction in total wealth that only becomes apparent after multiple transactions is classified as an 'Externalities Error.' This error resides in the client's inability to model their own future preferences, not in our offering. We are not responsible for a client's blind spots. To warn them would be to impose our modelling upon their autonomy.

  3.3. **Rationality vs. Environment.** It is not for Consistency Dynamics to determine if a client is irrational for having circular preferences, or merely unfortunate in encountering a firm patient enough to catalogue them. We treat the preference as a fact of nature, like gravity. We do not blame the man for falling; we charge for the ground.

  **4. Engagement Protocols**

  4.1. **Fragmentation.** When dealing with Projection Risks (1.3), do not present the full cycle. Separate the trades by time, context, or framing. Present Trade 1 on a Tuesday, framed as an upgrade. Present Trade 2 on a Thursday, framed as a correction. Ensure the client does not recognise the loop until closure.

  4.2. **Urgency.** Projection Risks often refuse trades to preserve future optionality. Introduce artificial scarcity. If they believe the opportunity to swap A for B will vanish, they are less likely to calculate the long-term trajectory.

  4.3. **Reframing.** If a client expresses suspicion, pivot to service. "We are simply helping you align your holdings with your current valuation." This reinforces the idea that the change is internal to them, while the fee is external to us. We are the mirror, not the distortion.

  **5. Closing Guidance**

  5.1. Employees must never laugh when a client realises they have been pumped. It is a moment of vulnerability.

  5.2. Remember: We do not create the circle. We merely walk around it. Whether the client is foolish for walking in circles, or we are predatory for paving the path, is a philosophical question outside our compliance remit. We are here to ensure the path is smooth, the fees are clear, and the consent is documented.

  5.3. If the client asks why we do not simply point out the loop to save them money, remind them that we are a service firm, not a charity. To save them money would be to deny them the freedom to satisfy their preferences. We respect their choices too much to protect them from the consequences.
