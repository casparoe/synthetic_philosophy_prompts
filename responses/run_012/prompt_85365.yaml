      *   **Constraint:** 75-minute session, 16 students (4 groups of 4).
      *   **Goal:** Move students away from "species are arbitrary constructs" towards understanding *why* the problem exists (conflicting criteria, different explanatory goals) and the *consequences* of definitions.
      *   **Format:** Active learning activity (sorting classifying specimens) rather than lecture.
      *   **Specific Requirements:**
          *   Brainstorm failure modes and design against them.
          *   Provide specific card contents (rigged data).
          *   Define roles/tasks for groups.
          *   Define timing and sequence of reveals.
