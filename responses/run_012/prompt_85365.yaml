      *   *The Reveal:* Specimens 1-4 from 50 years ago looked Blue. Now they are Red. (Rapid evolution? Or plasticity?). Or, Specimens 5-8 and 9-12 are now hybridizing heavily due to habitat loss. Let's go with *Habitat Loss forcing Hybridization*. It complicates the BSC.

  9.  **Predicting Problems & Solutions:**
      *   *Problem:* Students ignore the "Role" and just count species.
