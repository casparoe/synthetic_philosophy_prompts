      *   *Problem:* "Let's call it 3 species and be done."
      *   *Fix:* The Lawyer group holds the veto. If they say "2 species," and Ecologists say "4," who wins? The money depends on it.

  10. **Refining the Debrief:**
      *   Need to map the friction to specific philosophers/concepts without lecturing.
