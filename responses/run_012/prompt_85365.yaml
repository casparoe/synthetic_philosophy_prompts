          4.  **Asexual Lineage:** No breeding data possible. (BSC fails, PSC/Morphology needed).
          5.  **Hybrid Zone:** Distinct groups meeting and mixing. (Are they one or two?).
          6.  **Temporal Shift:** Specimens from 50 years later show divergence or convergence.
      *   *Constraint:* 20 cards total. Let's make them Populations (A, B, C, D, E) rather than individuals to save space and make it about grouping. Actually, individual cards are more tactile. Let's do 20 individual specimen cards that belong to 5 Populations (4 specimens each).
      *   *Wait, 20 cards for 4 groups?* If every group gets the same 20 cards, that's fine.
      *   *Data points per card:* ID, Location, Morphology (Color/Size), Genetics (COI %), Breeding Compatibility (Yes/No/Unknown), Diet, Date.

  5.  **Designing the Group Roles (The "Stakes"):**
      *   Group 1: **Field Ecologists.** Care about interaction/niche. (Ecological Species Concept).
      *   Group 2: **Phylogeneticists.** Care about lineage/history. (Phylogenetic Species Concept).
      *   Group 3: **Museum Curators.** Care about distinct labels/storage. (Morphological/Practical).
      *   Group 4: **Conservation Lawyers.** Care about legal protection thresholds. (Policy/ESU).
      *   *Crucial Twist:* All groups get the *same* data, but different *instructions* on what matters most. This highlights that the "species" count depends on the *goal*.

