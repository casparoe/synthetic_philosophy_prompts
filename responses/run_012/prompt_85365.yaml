      *   *Failure 3: One dominant student.*
          *   *Mitigation:* Assign specific roles *within* the group (Recorder, Skeptic, Spokesperson, Timekeeper). Give the "Skeptic" a specific card that contradicts the majority view.
      *   *Failure 4: Relying on just one metric (e.g., Genetics).*
          *   *Mitigation:* Rig the genetics to conflict with reproduction and morphology.
      *   *Failure 5: Running out of time for debrief.*
