  # The Sunk Cost Decision Tree

  **Instructions:** Start at **Node 1**. Answer the question based on your intuitive verdict in the specific case provided. Follow the branch that matches your judgment until you reach a **Leaf**. Each Leaf corresponds to a named theoretical position. If you land on a **Diagnostic Leaf**, read the diagnosis regarding the coherence of that position.

  ---

  ### Node 1: The Normative Threshold
  **Case:** *The Bad Meal.* You paid $50 for a dinner. The food is terrible. Eating more makes you physically uncomfortable. Leaving is free.
  **Question:** If you finish the meal *solely* because you paid the $50, have you violated a norm of rationality?
  *   **Yes, it is a mistake (Forbidden):** Go to **Node 2**.
  *   **No, it is acceptable (Permitted or Required):** Go to **Node 4**.

  ---

  ### Node 2: The Scope of the Mistake
  **Case:** *The Doomed Product.* A firm keeps funding a project with no market future because they've already spent millions.
  **Question:** Is this error the **same** for a CEO as it is for the diner at the bad meal, or do **institutions play by different rules**?
  *   **Different Rules (Institutions have duties individuals don't):** ➤ **Leaf 1: Institutional Distinctness View.**
      *   *Position:* Sunk costs are fallacious for individuals but can be rational for firms due to fiduciary duties, signaling to investors, or organizational inertia that serves stability.
  *   **Same Rules (Universal Rationality):** Go to **Node 3**.

  ---

  ### Node 3: The Nature of the Error
  **Case:** *The Research Program.* You quit a 3-year project. You feel guilty.
  **Question:** Is that guilt a **distortion** to be eliminated by better reasoning, or a **fixed constraint** we must design around?
  *   **Distortion (Ideal agents wouldn't feel it):** ➤ **Leaf 2: Strict Marginalist.**
      *   *Position:* Sunk costs are never reasons. Rationality is purely forward-looking. Any sensitivity to past costs is a cognitive bug.
  *   **Fixed Constraint (Agents are built this way):** ➤ **Leaf 3: Behavioral/Descriptive (Excused).**
      *   *Position:* Honoring sunk costs is technically irrational (suboptimal), but it is a predictable output of human psychology. It is excused, perhaps even expected, but not *rational*.

  ---

  ### Node 4: The Source of Value
  **Case:** *The Research Program.* (Variation) You know for a fact that quitting *now* will not damage your future reputation or motivation. No instrumental penalty.
  **Question:** Does the 3 years already spent count as a reason to stay **in itself**, or only because honoring it **helps you achieve other goals**?
  *   **Helps Achieve Goals (Instrumental):** Go to **Node 5**.
  *   **In Itself (Non-Instrumental):** Go to **Node 7**.
  *   **Neither (No Reason):** Go to **Node 6**.

  ---

  ### Node 5: The Unit of Instrumentality
  **Case:** *The War.* Exiting is costly now. Staying is costlier long-term, but retreating invites future aggression.
  **Question:** Do you stay because **this specific act** signals resolve to enemies, or because you **bind yourself** to a policy of not retreating?
  *   **This Specific Act (Signaling):** ➤ **Leaf 4: Sophisticated Commitment / Evidential.**
      *   *Position:* Sensitivity to sunk costs is rational only insofar as the *act* of honoring them provides evidence of your type to others (or your future self), altering their/your behavior.
  *   **Bind to Policy (Diachronic Control):** Go to **Node 5b**.

  #### Node 5b: The Beneficiary of the Policy
  **Question:** Is the policy binding because it maximizes **your welfare over time**, or because **everyone following it** maximizes social welfare?
  *   **Your Welfare:** ➤ **Leaf 5: Resolute Choice.**
      *   *Position:* Rationality attaches to the temporally extended self. You stick to the plan not because of external signals, but because breaking the plan violates diachronic rationality constraints.
  *   **Everyone's Welfare:** ➤ **Leaf 6: Rule-Consequentialist.**
      *   *Position:* You follow the rule "honor sunk costs" because if everyone in your position did so, overall outcomes would be better, even if this specific instance is costly.

  ---

  ### Node 6: The Empty Combination
  **Case:** *The Concert Ticket.* You can't resell it. Going is miserable.
  **Question:** You claim honoring the cost is **Required** (Node 1: No), but that past costs are **No Reason** (Node 4: Neither) and offer **No Future Benefit** (Node 4: Neither).
  *   **This Path:** ➤ **Leaf 7: The Incoherent View (Unoccupied).**
      *   *Diagnosis:* **Incoherent.** You cannot claim an action is *rationally required* while simultaneously claiming there is *no reason* (instrumental or intrinsic) to perform it. This space is theoretically empty unless you posit an external authority (e.g., divine command) unrelated to rationality.

  ---

  ### Node 7: The Nature of Intrinsic Value
  **Case:** *The Bad Relationship.* You stay because of the time invested.
  **Question:** Do you stay to express **who you are** (Character), or to honor **what you made** (History)?
  *   **Who You Are (Character):** ➤ **Leaf 8: Virtue-Theoretic.**
      *   *Position:* Sensitivity to sunk costs is an expression of loyalty, perseverance, or gratitude. It is rational because it constitutes a virtuous character, regardless of outcomes.
  *   **What You Made (History):** ➤ **Leaf 9: Narrative Identity.**
      *   *Position:* The past investment is constitutive of your identity. To quit is to render your past self's actions meaningless. Rationality requires maintaining the coherence of your life's narrative.

  ---

  ### Node 8: The Indistinguishability Check
  *(Note: This is not a decision node, but a diagnostic filter for Leaves 5 & 6)*
  **Case:** *The Firm's Rule.* A manager follows a "never retreat" policy.
  **Question:** Can you empirically distinguish **Resolute Choice** from **Rule-Consequentialism** here?
  *   **Diagnosis:** **Flagged Pair.** In practice, these two leaves often prescribe the exact same action (follow the policy). They differ only in *justification* (self-interest vs. general welfare). In a seminar discussion, force proponents to specify *whose* welfare justifies the rule to separate them.

  ---

  ### Note on Artificialities
  **For the Instructor:**
  1.  **Binary Constraints:** The tree forces binary choices (e.g., Instrumental vs. Intrinsic) where some hybrid views exist (e.g., "Past costs are intrinsically valuable *because* they instrumentally secure identity"). Participants may need to split their vote or choose the "dominant" motive.
  2.  **The "Required" Branch:** Node 6 isolates the "Required but No Reason" view to diagnose it as empty. In reality, most people who say "Required" will backtrack to "Instrumental" or "Intrinsic" when pressed. This node is designed to expose that backtrack.
  3.  **Institutional vs. Individual:** Node 2 assumes a clean split between individual and institutional rationality. Behavioral economists may argue institutions are just collections of individuals subject to the same biases. Philosophers may argue roles create new normative facts. This node is intended to spark that specific debate.
