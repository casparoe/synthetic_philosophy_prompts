  I'm a PhD student in philosophy, mostly working on decision theory and some econ-adjacent stuff, and I'm putting together a handout for a grad seminar that's half philosophers and half behavioral economists. The topic is the sunk cost thing — whether it's always irrational to let past costs influence a current choice, or whether there are defensible ways of honoring them. The usual debate gets flattened into fallacy vs. not-a-fallacy, and I want to force people apart on the actual joints. Could you build me a decision tree or flowchart that takes someone from a few starting commitments to a named position on whether sunk costs can be rationally action-guiding? Each internal node should be a question a smart non-specialist could answer without already knowing which camp it leads to: whether past costs can count as reasons in themselves or only via their effects on future incentives and commitments; whether rationality attaches to individual acts, policies, or character; whether the relevant agent is a single time-slice, a temporally extended self, or a collective; whether irrational is a descriptive prediction about what people do or a normative verdict; and whether honoring a sunk cost is allowed, required, or merely excused. I want the leaves to include at least the strict marginalist or evidential view, the sophisticated commitment-device view, a resolute-choice-style view, a rule-consequentialist or public-rule view, a virtue-theoretic or character-based view, a narrative-identity view, and a view that treats groups and institutions differently from individuals. If some combination is empty — like past costs are no reasons at all, but honoring them is nonetheless required for the individual — say so and diagnose whether it's incoherent, unattractive, or just unoccupied. Also flag any two leaves the tree can't really seperate with your questions.

  I was arguing with my roommate, who does behavioral econ, and we kept talking past each other because he thought I was just redescribing the fallacy and I thought he was ignoring the difference between a one-off choice and a policy you have to live with. So alot of the value here is in the diagnostic cases, not in the labels. Please make the questions concrete enough that someone answers by saying what they'd do or advise in a case — the concert ticket you can't resell, the failing research program you've sunk three years into, the bad relationship you stay in because of the time already invested, a war that's costly to exit, a firm that keeps funding a doomed product, a person who finishes a meal they hate — rather than by announcing which -ism they like. Build it from the logical space first: questions, then the combinations of answers they allow, then the actual positions located in that space, with unoccupied combinations noted. Aim for something like eight to ten leaves, and no need to cite any literature or give me a reading list; I just want the instrument itself, plus a short note on any place where the tree is doing something artificial.
