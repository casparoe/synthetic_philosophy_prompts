      *   **Address the Security Firm:** It's theft because it lacks *sovereign legitimacy*. It's trying to sell a public good as a private commodity using coercion.
      *   **Address the "Give One Up":** The **HOA** verdict is the weak link. If it's democratically voted, it should align with the City. If it's theft, then the City *could* be theft if legitimacy is broken.
