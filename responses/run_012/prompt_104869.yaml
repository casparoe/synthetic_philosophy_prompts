answer: |-
  This is a sophisticated set of intuitions. You have effectively rediscovered a core debate in political philosophy regarding the distinction between **political obligation** and **private contract**. Your friend's legalist definition fails because it confuses *law* with *legitimacy* (a law can be unjust, and a mugger is wrong even if legal).

  There is a principle that fits almost all your verdicts. It is the **Principle of Sovereign Authority vs. Restricted Consent.**

  ### The Principle
  **Taking is not theft when it is levied by a legitimate sovereign authority over its members for general public purposes, regardless of individual consent to specific expenditures. Taking is theft when it is levied by a private actor without contract, or when a specific restricted agreement is violated.**

  Here is how this principle maps to your cases:

  1.  **Mugger:** Private actor, no authority, no consent. **Theft.**
  2.  **Fundraiser:** Private/Institutional actor, specific restricted consent (for the trip) violated. **Theft.**
  3.  **Income Tax:** Sovereign authority, general revenue (not restricted to specific uses you approve of). **Not Theft.**
  4.  **Charity:** Private/Institutional actor, specific restricted consent (for the cause) violated. **Theft.**
  5.  **Gov War:** Sovereign authority, general revenue. Even if you object to the use, the authority has the right to allocate general funds. **Not Theft.** (This resolves your tension with the Charity case: one is a restricted contract, the other is a general obligation).
  6.  **City Water/Reservoir:** Sovereign authority managing public infrastructure. You pay for the *system*, not the specific project. **Not Theft.**
  7.  **Private Security Firm:** Private actor attempting to act like a sovereign (coercive billing without contract). **Theft (or Extortion).**
  8.  **City Security:** Sovereign authority providing public order. **Not Theft.**

  ### The Outlier: Which Verdict to Give Up?
  The case that does not fit cleanly is the **Neighborhood Association (HOA) Fence**.

  You called it "basically theft," yet you also said you "voted against" it. This is the weak link in your intuition.
  *   **If the HOA is a contract:** When you bought the house, you signed a deed restriction agreeing to be bound by majority vote. If so, it is *not* theft; it is a binding contract you entered voluntarily.
  *   **If the HOA is a mini-government:** If it functions democratically to provide shared goods, it should align with your verdict on the City Reservoir.

  **To make your theory consistent, you should give up the verdict that the HOA fence is theft.**
  If you accept that democratic decision-making within a binding community (whether a City or an HOA) legitimizes the taking of dues for shared infrastructure, the HOA case aligns with the City Reservoir case. Your hesitation likely stems from the fact that HOAs feel more voluntary than citizenship, but philosophically, if you accept the "Social Contract" for the City, you must accept the "Deed Contract" for the HOA.

  ### Applying the Principle to Your Final Questions

  **1. The Private Security Firm**
  Under this principle, the private security firm is committing **theft (or extortion)**.
  Why? Because they lack **sovereign legitimacy**. A government can tax you for police protection because it holds a monopoly on legitimate force and is (theoretically) accountable to the public good. A private firm is a market actor. By patrolling without asking and billing coercively ("pay or we can't guarantee coverage"), they are creating the threat they claim to solve. This is the definition of a protection racket. They are trying to exercise sovereign power without sovereign accountability.

  **2. A Government That Protects Only People Who Pay**
  This scenario breaks your principle, and it forces a hard conclusion: **If a government protects only those who pay, it ceases to be a legitimate sovereign and becomes a private security firm.**

  The distinction between "Taxation" and "Theft" in your framework relies on the government providing **public goods** (order, defense, infrastructure) to the **polity as a whole**, funded by **general obligations**.
  *   If the government says, "We will only protect the taxpayers," protection is no longer a public good; it is a private commodity.
  *   At that moment, the government loses its claim to sovereign authority over the non-payers.
  *   Consequently, taking money from the non-payers (to force them to pay for protection they won't receive) becomes **theft**, because the *quid pro quo* of the social contract (dues for universal order) has been broken.

  ### Summary
  Your gut is tracking the difference between **Membership** (Citizenship/Taxation) and **Transaction** (Donations/Market Services).
  *   **Membership:** You pay dues. You don't get to vote on every expense. (Gov Tax, War, Water).
  *   **Transaction:** You pay for X. If you get Y, it's fraud/theft. (Charity, Fundraiser, Private Firm).

  The HOA is the only case where you are unsure because it blurs the line between a voluntary club and a local government. If you treat it as a binding contract of membership, it isn't theft. If you treat the Government as a service provider that only protects payers, *it* becomes theft. The legitimacy of taxation rests entirely on the universality of the protection and the authority of the state.
