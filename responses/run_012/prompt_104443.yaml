          *   If the claim relies on belief to be true, it's pragmatic, not descriptive.
      *   *Section 6: Predictions.*
          *   What does HoH predict that Uniform/Cyclical doesn't?
          *   HoH predicts a specific *type* of risk (existential, global) that is unique in kind, not degree.
      *   *Conclusion:* Summarise the strongest defeaters.

  6.  **Refining the Argument (Self-Correction during drafting):**
