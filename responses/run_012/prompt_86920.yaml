answer: |-
  ### JOINT STATEMENT ON COMMISSUROTOMY AND CONSCIOUSNESS
  **Prepared for Adversarial Collaboration**

  #### I. Consensus Claims
  *The following six claims are endorsed by both the Single-Subject and Two-Streams camps. Each claim excludes a popular simplification; signing requires abandoning a comforting certainty.*

  1.  **Dissociation is Task-Specific, Not Global.**
      Both camps agree that the "split" is not a constant state of civil war. In naturalistic settings, commissurotomy patients exhibit coherent, goal-directed behavior indistinguishable from controls. Dissociation (e.g., the left hand buttoning while the right unbuttons) is rare and typically elicited only by experimental conditions that force lateralized input and competing motor outputs simultaneously.
      *Cost:* Two-Streams abandons the "two people fighting" cartoon; Single-Subject abandons the idea that behavioral coherence proves phenomenal unity.

  2.  **Cross-Cueing is Inferential, Not Telepathic.**
      Both camps agree that when one hemisphere appears to "know" what the other is seeing, it is usually via *cross-cueing*: observing the overt or covert muscular movements of the other side (e.g., the left hand beginning to reach, or subvocalization detected by the right hemisphere). There is no evidence of direct qualia transfer across the severed commissure.
      *Cost:* Two-Streams cannot claim the hemispheres are hermetically sealed; Single-Subject cannot claim that apparent knowledge transfer proves a unified field.

  3.  **Speech is Not the Sole Arbiter of Experience.**
      Both camps agree that the speaking (usually left) hemisphere's report ("I saw nothing") is not definitive proof of total absence of experience. The non-speaking (right) hemisphere demonstrates comprehension, emotional reaction, and problem-solving via non-verbal means (pointing, drawing, facial expression) that contradict the speaking hemisphere's verbal report.
      *Cost:* Single-Subject must admit the speaking "I" is sometimes wrong about the organism's total state; Two-Streams must admit the non-speaking side is a cognitive agent, not a reflex machine.

  4.  **Subcortical Integration Persists.**
      Both camps agree that commissurotomy severs cortical commissures but leaves subcortical structures (brainstem, thalamus, limbic system) largely intact. Consequently, arousal, startle responses, and broad affective states (mood, fear) remain unified across the organism, even when specific perceptual contents are lateralized.
      *Cost:* Two-Streams cannot claim a total duplication of the *person* (since affect is shared); Single-Subject cannot claim that cortical disconnection is irrelevant to the structure of consciousness.

  5.  **Unity Decomposes into Distinct Variables.**
      Both camps agree that "Unity of Consciousness" is not a binary switch. It must be distinguished into *Phenomenal Unity* (whether experiences feel like they belong together), *Access Unity* (whether information is available for report and rational control), and *Self-Attribution* (whether experiences are claimed by a single "I"). These come apart in split-brain cases.
      *Cost:* Both sides must abandon the notion that "consciousness" is a simple monolith that is either present or absent.

  6.  **The Data Underdetermines the Metaphysics.**
      Both camps agree that no behavioral or neural test can conclusively settle whether there is "one subject with fragmented access" or "two subjects with limited coordination." The empirical data is compatible with both metaphysical interpretations; the choice rests on prior philosophical commitments regarding the individuation of subjects.
      *Cost:* Both sides must admit they cannot prove their case empirically; the dispute is partly philosophical.

  ***

  #### II. Table of Residual Disagreements
  *Where the consensus ends, the following table maps the divergence. Wording is chosen to be acceptable to the respective signatories.*

  | Issue | Single-Subject Camp Wording | Two-Streams Camp Wording | The Crux |
  | :--- | :--- | :--- | :--- |
  | **Individuation** | The subject of experience is individuated by the **biological organism**. As long as there is one living human body, there is one person, regardless of internal information barriers. | The subject of experience is individuated by **functional integration**. Where neural integration falls below the threshold required for a unified phenomenal field, distinct subjects emerge. | **Ontological Boundary:** Is "personhood" a biological fact or a psychological/functional status? |
  | **Testimony** | The speaking hemisphere's report is the **privileged testimony** of the person. If the patient says "I am one person," we should accept this unless there is overwhelming evidence of deception or confusion. | The speaking hemisphere's report is **local testimony**. It is the only *verbal* testimony, but it has no privilege over the non-verbal behavior of the other hemisphere, which may indicate a distinct perspective. | **Epistemic Authority:** Does speech grant authority on the nature of the self, or is it merely one output channel among many? |
  | **First-Person Authority** | A subject cannot be fundamentally mistaken about **whether they are a single subject**. If the patient feels unified, they are unified (even if access is limited). | A subject can be mistaken about **the scope of their unity**. The speaking hemisphere may feel unified simply because it is unaware of the concurrent, inaccessible stream of the other hemisphere. | **Introspective Transparency:** Is the unity of the self something experienced, or something inferred (and potentially misinferred)? |

  ***

  #### III. The Continuum Test Case
  *Scenario: A continuum of patients. (A) Complete commissurotomy (0 bits/sec). (B) Artificial bridge (low bandwidth, e.g., 5 bits/sec). (C) Intact commissure (high bandwidth).*

  **Crux 1: Ontological Boundary (Organism vs. Integration)**

  *   **The Case:** Does the number of subjects change as bandwidth increases from A to C?
  *   **Single-Subject Prediction:** The number of subjects is **one** throughout the continuum (A, B, and C).
      *   *Reasoning:* Subjecthood is tied to the organism. Increasing bandwidth increases the *capacity* for information sharing and behavioral coordination, but it does not merge two entities into one; it merely enhances the functioning of the single entity.
      *   *Threshold:* There is no threshold for subject count.
  *   **Two-Streams Prediction:** The number of subjects changes from **two to one** somewhere between A and C.
      *   *Reasoning:* Subjecthood requires a minimum level of information integration to sustain a single phenomenal field. At (A), integration is too low; there are two streams. At (C), integration is high; there is one stream.
      *   *Threshold:* The threshold falls where information transfer becomes sufficient to support a "global workspace" or unified narrative.
  *   **The "Vagueness" Defense:**
      *   *Single-Subject:* May admit the *degree* of unity is vague, but denies the *number* of subjects is vague.
      *   *Two-Streams:* May admit there is no sharp line (a "sorites" problem), arguing that "number of subjects" is indeterminate in the middle range (B), but definite at the extremes (A=2, C=1).

  **Crux 2: Epistemic Authority (Speech vs. Behavior)**

  *   **The Case:** In scenario (B) (low bandwidth), the speaking hemisphere reports, "I feel like one person." The non-speaking hand acts independently in conflict with the verbal report.
  *   **Single-Subject Prediction:** The verbal report is **true**.
      *   *Reasoning:* The patient *is* one person. The independent hand action is a motor dissociation, not evidence of a second person. The feeling of unity is accurate.
  *   **Two-Streams Prediction:** The verbal report is **incomplete/misleading**.
      *   *Reasoning:* The speaking hemisphere feels like one person because it cannot access the other stream. It is like a dictator claiming to rule a country while a province is in rebellion. The feeling of unity is an artifact of isolation, not evidence of fact.

  **Crux 3: Introspective Transparency (Experience vs. Inference)**

  *   **The Case:** In scenario (A) (complete split), is the patient *experiencing* disunity, or merely suffering from ignorance of the other side?
  *   **Single-Subject Prediction:** The patient experiences **fragmentation within a single field**.
      *   *Reasoning:* It is one mind that has lost the ability to compare notes. The "gap" is experienced as a lack of access, not as the presence of another mind.
  *   **Two-Streams Prediction:** The patient experiences **two separate fields**, neither of which experiences the other.
      *   *Reasoning:* There is no "single field" that is fragmented. There are simply two fields that do not touch. Neither side experiences the "split" because neither side experiences the other side's absence.

  ***

  #### IV. Analysis of Verbal vs. Substantive Dispute

  **Is this merely verbal?**
  Partially. A significant portion of the disagreement rests on the definition of the word **"subject"** (or "person").
  *   If "subject" is defined biologically (one human = one subject), the Single-Subject view is tautologically true.
  *   If "subject" is defined phenomenologically (one unified field of experience = one subject), the Two-Streams view gains traction.

  **What remains after verbal fixes?**
  If we stipulate a definition (e.g., "Let us define 'subject' as a center of narrative gravity"), a substantive disagreement remains regarding the **structure of the phenomenal field itself**.

  1.  **The Structural Question:** Even if we agree on words, we disagree on the *architecture of experience*.
      *   *Single-Subject Claim:* The architecture is a **single room with a wall down the middle**. The light is on in both halves, but the occupant cannot walk from one to the other.
      *   *Two-Streams Claim:* The architecture is **two separate rooms**. The fact that the building (organism) is one does not make the rooms one.

  2.  **The Ethical/Practical Remainder:**
      *   If the Two-Streams view is correct, harming the non-speaking hemisphere (e.g., via painful stimulation unknown to the speaking side) is harming a distinct subject that cannot protest.
      *   If the Single-Subject view is correct, it is harming the one subject in a way they cannot verbally process.
      *   *Substantive Core:* The disagreement is about **moral patienthood**. Does the non-speaking hemisphere have interests that are distinct from, and potentially in conflict with, the interests of the speaking hemisphere?
      *   *Consensus on Remainder:* Both camps agree that the non-speaking hemisphere has *interests* (avoid pain, solve puzzles). They disagree on whether those interests belong to the *same* owner as the speaking hemisphere's interests.

  **Final Note for the Novelist:**
  The "cartoon" version assumes the two sides are constantly aware of each other and fighting. The **substantive reality** is more tragic and subtle: It is likely a state of mutual ignorance. The left hand does not know the right hand is confused; the right hand does not know the left hand is speaking. The conflict arises not from rivalry, but from the organism attempting to execute a single plan with two uncoordinated captains who believe they are the only captain.
