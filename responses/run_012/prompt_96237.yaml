prompt: |-
  For the last several months I have been convening a small reading group on explanation in biology and cognitive science, and two of its regulars have settled into positions that strike me as genuinely opposed yet almost impossible for either of them to state in terms the other will accept. The first, a philosopher of mind, holds what I have come to call the crane-only view: every instance of apparent design, order, or novelty in the living world — minds and languages included — is in principle the product of cumulative selection acting on small, selectable variations, so any explanation that bottoms out in "and then the right kind of organization arose" is a skyhook in disguise, and the recurring pull toward such explanations is precisely the vice we ought to name as the mirror image of greedy reductionism. The second, a graduate student in evolutionary developmental biology, holds the structuralist view: some properties belong to the arrangement rather than to the parts, higher-level regularities can be explanatorily autonomous and can even constrain the behaviour of the components, and the crane/skyhook vocabulary is rigged, because a crane is simply whatever turns out to decompose into selectable steps and a skyhook whatever does not, so the distinction can never be falsified by any case and merely redescribes each outcome after the fact. When they argue, each accuses the other of begging the question, and each ends up paraphrasing the other's position in a way the other rejects outright.

  I would like you to draft the joint statement they could both sign if they committed to a genuine adversarial collaboration. Give me, first, a numbered list of claims both can affirm — about what selection may and may not be assumed to accomplish, about what it would take to have "reduced" some phenomenon, and about the status of higher-level regularities — each phrased so that neither party concedes anything merely by signing it. Then state the residual disagreements precisely, with each side's formulation written in wording that side would accept for itself, and set them out in a table. Identify the cruxes, meaning the sub-questions such that settling one would move at least one of them; I expect these to include whether any criterion for crane versus skyhook is available independently of whether a reduction has actually been carried out; whether the bare possibility of a crane for some phenomenon is itself any reason to think a crane exists for it; whether appeals to organization or to downward constraint do explanatory work or merely restate the phenomenon to be explained; whether "greedy reductionism" picks out a determinate error or collapses into a label for whatever reduction one happens not to like; and whether self-organization, evolvability, or the origin of life constitute in-principle limits on selectionist explanation or merely gaps that further cranes will eventually fill.

  For each crux, give the case, experiment, or argument that both parties would agree bears on it, and record in advance what each side predicts that case or argument shows — phrased, again, so that each side can accept its own prediction as a fair statement of its view. Where you judge that part of their dispute is really verbal, say which part and why; and where one side's position turns out to be unfalsifiable as stated, say what minimal revision would make it testable.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A reading group on explanation in biology and cognitive science.
      *   **Participants:**
          *   Person A: Philosopher of Mind ("Crane-Only View"). Believes cumulative selection explains *everything* (minds, language, order). "Skyhooks" (miraculous/unexplained organization) are bad. Accuses the other of anti-reductionism/mysticism.
          *   Person B: Evo-Devo Grad Student ("Structuralist View"). Believes higher-level regularities/organization are autonomous/constraining. The Crane/Skyhook distinction is rigged/post-hoc. Accuses the other of "greedy reductionism."
      *   **Conflict:** They talk past each other, accuse each other of begging the question, and reject each other's paraphrases.
      *   **Task:** Draft a *Joint Statement for Adversarial Collaboration*.
      *   **Components:**
          1.  Numbered list of shared claims (neutral phrasing, no concessions).
          2.  Table of residual disagreements (each side's own wording).
          3.  Identification of Cruxes (sub-questions that move the needle).
          4.  For each Crux: Agreed-upon case/experiment/argument + Each side's prediction (in their own words).
          5.  Analysis of verbal disputes vs. unfalsifiable claims (with minimal revisions).

  2.  **Deconstruct the Positions:**
      *   **Crane-Only (Philosopher):** Methodological Adaptationism. Everything *must* be traceable to selection history. If you stop at "structure," you haven't explained *why* that structure exists. "Skyhook" = explanation stopper.
      *   **Structuralist (Evo-Devo):** Methodological Structuralism. Physical/developmental constraints channel variation. Selection filters, but doesn't create the space of possibilities. "Crane/Skyhook" is a Just-So story label. Downward causation/constraint is real explanatory work.

  3.  **Drafting Section 1: Shared Claims (The Overlap):**
      *   *Goal:* Find common ground without forcing surrender.
      *   *Selection:* Both agree selection happens. Both agree it's powerful. Both agree we need evidence.
      *   *Reduction:* Both agree "reduction" isn't just naming parts.
      *   *Higher-Level:* Both agree patterns exist; disagreement is on *explanatory status*.
      *   *Drafting ideas:*
          *   Selection is necessary but maybe not sufficient.
          *   Explanations need empirical backing, not just logic.
          *   "Organization" is a real phenomenon, even if its origin is debated.
          *   Neither wants magic (supernatural), just naturalistic mechanisms.

  4.  **Drafting Section 2: Residual Disagreements (The Table):**
      *   *Goal:* Let them speak in their own idioms without the other rejecting the phrasing.
      *   *Philosopher:* Focus on "historical continuity," "selectionist genealogy," "explanatory debt."
          *   *Phrasing:* "Any stable biological order implies a history of differential retention."
      *   *Student:* Focus on "generative constraints," "morphospace," "autonomy of levels."
          *   *Phrasing:* "Physical and developmental laws restrict the variation selection can act upon, making structure prior to function in explanation."
      *   *Key conflict:* Is structure a *product* of selection (Phil) or a *precondition/constraint* on selection (Student)?

  5.  **Drafting Section 3: Cruxes & Predictions:**
      *   *Crux 1: Criterion Independence.* Can we define a Skyhook *before* we fail to find a Crane?
          *   *Case:* Origin of Life / Self-Replication.
          *   *Phil Prediction:* It's a gap, not a limit. Chemistry will show a gradient.
          *   *Student Prediction:* It's a phase transition. Thermodynamics/Chemistry dictates the form, selection kicks in later.
      *   *Crux 2: Possibility vs. Actuality.* Does "could have evolved" count as explanation?
          *   *Case:* Convergent Evolution (e.g., Camera Eyes).
          *   *Phil Prediction:* Convergence proves the adaptive peak is discoverable by selection.
          *   *Student Prediction:* Convergence proves developmental channels are limited; selection just picks the only viable option.
      *   *Crux 3: Downward Constraint.* Does "constraint" explain or describe?
          *   *Case:* Protein Folding / Morphogenesis.
          *   *Phil Prediction:* Folding rules are selected for stability.
          *   *Student Prediction:* Folding rules are physico-chemical necessities; selection merely culls the failures.
      *   *Crux 4: Greedy Reductionism.* Is it a real error?
          *   *Case:* Cognitive Science (Connectionism vs. Symbolic).
          *   *Phil Prediction:* Ignoring neural implementation is okay if functional explanation holds (wait, Phil is reductionist... actually Phil thinks *selection* is the reducer). Let's refine: Phil thinks ignoring selection history is the error. Student thinks ignoring structural constraints is the error.
          *   *Refinement:* Let's stick to the prompt's specific cruxes.
          *   *Crux:* "Greedy Reductionism" definition.
          *   *Case:* Explaining language.
          *   *Phil:* Ignoring selection history is the error.
          *   *Student:* Ignoring structural/physical constraints is the error.

  6.  **Drafting Section 4: Verbal vs. Substantive & Falsifiability:**
      *   *Verbal:* "Skyhook." Phil uses it as "unexplained origin." Student uses it as "non-selectionist origin."
      *   *Unfalsifiable:* Phil's "In Principle" claim. If we can't find the steps, Phil says "keep looking." Student says "maybe there aren't steps."
      *   *Revision:* Phil needs to commit to a timeline or specific mechanism type. Student needs to commit to a specific non-selectionist mechanism (e.g., thermodynamic self-organization).

  7.  **Review and Refine:**
      *   *Tone:* Academic, precise, neutral, respectful.
      *   *Check against Prompt:* Did I cover all specific cruxes mentioned? (Criterion independence, possibility vs existence, organization explanatory work, greedy reductionism definition, self-organization/origins).
      *   *Check Constraints:* Numbered list first, then table, then cruxes with predictions.
      *   *Self-Correction on "Crane-Only":* The prompt says the Philosopher believes *everything* is cumulative selection. This is strong Adaptationism. The Student says higher-level regularities are *autonomous*.
      *   *Refining the "Shared Claims":* Make sure the Philosopher doesn't have to admit structuralism is true, and the Student doesn't have to admit selectionism is sufficient. They can agree on *methodology* even if they disagree on *ontology*.
      *   *Refining the "Cruxes":* Ensure the predictions are distinct. If both predict the same outcome, it's not a crux.
      *   *Specific Prompt Requirement:* "Where one side's position turns out to be unfalsifiable as stated, say what minimal revision would make it testable." I need to explicitly identify this. The Philosopher's "in principle" claim is the likely candidate for unfalsifiability.

  8.  **Final Polish:** Check the voice. It should sound like a document drafted by a neutral third party (the convener) for the two parties to sign.

  *(Self-Correction during drafting)*: I need to be careful with the "Greedy Reductionism" crux. The prompt asks whether it picks out a determinate error. I should frame the crux around *identifying* the error.
  Also, ensure the "Table" format is clear.
  Ensure the "Predictions" are in wording each side accepts.

  Let's assemble the document.

  *   *Shared Claims:* Focus on naturalism, the reality of the phenomena, the need for evidence.
  *   *Disagreements:* Use their specific vocab (Genealogy vs. Morphospace).
  *   *Cruxes:*
      1.  Criterion Independence (The Definition Problem).
      2.  Possibility vs. Actuality (The "In Principle" Problem).
      3.  Explanatory Work of Constraints (The "Just-So" Problem).
      4.  Greedy Reductionism (The Label Problem).
      5.  Limits of Selection (The Origin of Life/Self-Organization Problem).
  *   *Verbal/Falsifiability:* Address the "In Principle" shield of the Philosopher.

  Okay, ready to write.
answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Explanatory Scope of Selectionism vs. Structuralism in Biology and Cognitive Science
  **Parties:** The Adaptationist (Philosopher of Mind) and The Structuralist (Evo-Devo Researcher)
  **Convened By:** [Your Name/Role]
  **Date:** October 26, 2023

  ## I. SHARED COMMITMENTS
  *The following claims are affirmed by both parties. Signing this list constitutes an agreement to frame the dispute within these boundaries, without conceding the core ontological disagreement.*

  1.  **Naturalism:** Both parties agree that biological and cognitive phenomena are natural events requiring naturalistic explanation. Neither party appeals to supernatural agency, vitalism, or extra-physical forces.
  2.  **The Reality of Selection:** Both parties agree that natural selection is a real, potent causal process that has shaped the living world. The disagreement concerns the *exhaustiveness* of selection as an explanation, not its existence.
  3.  **The Reality of Structure:** Both parties agree that higher-level regularities (e.g., morphological baupläne, syntactic universals, protein folding constraints) are real empirical phenomena. The disagreement concerns whether these regularities are *products* of selection or *preconditions* for it.
  4.  **Standards of Reduction:** Both parties agree that a successful "reduction" of a higher-level phenomenon to lower-level mechanisms requires more than verbal mapping; it requires the demonstration of a causal mechanism that generates the higher-level regularity without presupposing it.
  5.  **Empirical Accountability:** Both parties agree that explanatory claims must be tethered to empirical evidence. Appeals to "in principle" possibility must eventually cash out in "in practice" mechanistic models to count as settled science.
  6.  **Rejection of Magic:** Both parties agree that positing a "Skyhook" (in the Adaptationist's sense) or an "Autonomous Law" (in the Structuralist's sense) that halts inquiry is methodologically undesirable. The dispute is over where the halt is justified, not whether inquiry should cease.

  ## II. RESIDUAL DISAGREEMENTS
  *The following table outlines the core divergence. Each formulation is phrased in terminology the respective party accepts as accurate to their view.*

  | Domain | The Adaptationist Formulation | The Structuralist Formulation |
  | :--- | :--- | :--- |
  | **Primary Driver** | Biological order is primarily the result of **cumulative historical retention**. If a trait persists, it is because it was selected for (or hitchhiked on something that was). | Biological order is primarily the result of **generative constraints**. The space of possible forms is restricted by physics and development; selection merely culls the non-viable. |
  | **Explanatory Direction** | Explanation flows **upward from history**. To explain a mind or a limb, one must reconstruct the selective gradient that made it adaptive. | Explanation flows **downward from organization**. To explain a mind or a limb, one must identify the structural laws that make its formation probable. |
  | **The "Skyhook" Charge** | Any explanation that stops at "self-organization" or "constraint" without detailing the **selectionist genealogy** is a Skyhook: it assumes the very order that needs explaining. | Any explanation that assumes **infinite variability** awaiting selection is a fiction: it ignores that variation is biased, making the selectionist story incomplete or misleading. |
  | **Status of Regularities** | Higher-level regularities are **contingent equilibria**. They exist because selection found them; they could have been otherwise if history differed. | Higher-level regularities are **necessary attractors**. They exist because physical/developmental laws dictate them; history could not easily have been otherwise. |

  ## III. CRUXES AND PREDICTIONS
  *The following sub-questions constitute the "cruxes" of the dispute. Settling these would move at least one party toward the other's position. For each crux, we identify the evidence type and record the distinct predictions.*

  ### Crux 1: Criterion Independence
  **Question:** Is there a criterion for distinguishing a "Crane" (selectionist mechanism) from a "Skyhook" (unexplained order) that is available *independently* of whether a reduction has actually been carried out?
  **Bearing Evidence:** **The Origin of Life (Abiogenesis) Models.** Specifically, models of pre-biotic chemical self-organization that generate replication without prior selection history.
  *   **Adaptationist Prediction:** "Any chemical system exhibiting replication without a history of differential retention is merely a **proto-Crane**. It counts as a biological explanation only when we show how that chemistry was stabilized by early selection pressures. Without that history, it is just chemistry, not biology."
  *   **Structuralist Prediction:** "If a chemical system spontaneously generates replicating order due to thermodynamic gradients alone, that is a **Structural Law**. It demonstrates that order can precede selection. Selection acts on the result, but did not create the possibility of the result."

  ### Crux 2: Possibility vs. Actuality
  **Question:** Does the bare *possibility* of a Crane for some phenomenon constitute a reason to think a Crane *exists* for it, or must the specific pathway be demonstrated?
  **Bearing Evidence:** **Convergent Evolution in Cognitive Architecture.** (e.g., Independent evolution of similar neural circuitry in distantly related species solving similar problems).
  *   **Adaptationist Prediction:** "Convergence demonstrates that the **adaptive landscape is robust**. The fact that selection found the same solution twice proves that a Crane exists and is discoverable, even if we lack the fossil record of the specific steps in every lineage."
  *   **Structuralist Prediction:** "Convergence demonstrates that the **morphospace is narrow**. The fact that evolution found the same solution twice proves that there were very few viable options available to selection. The constraint explains the convergence, not the selective pressure."

  ### Crux 3: Explanatory Work of Constraints
  **Question:** Do appeals to organization or downward constraint do independent explanatory work, or do they merely restate the phenomenon to be explained?
  **Bearing Evidence:** **Protein Folding and Neutral Networks.** (Analysis of sequence space vs. functional structure).
  *   **Adaptationist Prediction:** "Mapping the neutral network shows that functional proteins are **rare islands**. Their existence requires a specific selective history to locate them. Citing 'folding rules' only describes the island; it does not explain how the population arrived there."
  *   **Structuralist Prediction:** "Mapping the neutral network shows that functional proteins are **connected continents**. 'Folding rules' explain why the population arrives there inevitably, regardless of specific selection. The constraint does the work; selection is just the background noise."

  ### Crux 4: "Greedy Reductionism"
  **Question:** Does "greedy reductionism" pick out a determinate error (ignoring relevant levels of organization), or does it collapse into a label for whatever reduction one happens not to like?
  **Bearing Evidence:** **Cognitive Science Modeling.** (Comparing connectionist models trained by selection-like algorithms vs. symbolic models with innate structural rules).
  *   **Adaptationist Prediction:** "Greedy reductionism is the error of **ignoring the learning history**. A model that posits innate structure without showing how selection could build it is guilty. If the structure can be trained, the innate positing was greedy."
  *   **Structuralist Prediction:** "Greedy reductionism is the error of **ignoring the architectural limits**. A model that assumes any function can be trained given enough steps is guilty. If the architecture makes learning impossible without prior bias, the selectionist story was greedy."

  ### Crux 5: Limits of Selection
  **Question:** Do self-organization, evolvability, or the origin of life constitute in-principle limits on selectionist explanation, or merely gaps that further Cranes will eventually fill?
  **Bearing Evidence:** **Artificial Life (ALife) Simulations.** (Systems where "evolvability" itself evolves vs. systems where physics dictates form).
  *   **Adaptationist Prediction:** "Evolvability is itself an **adaptation**. ALife will show that systems capable of evolving are selected over systems that are not. There is no limit, only deeper layers of selection."
  *   **Structuralist Prediction:** "Evolvability is a **physical property**. ALife will show that only systems with specific thermodynamic properties can evolve at all. Selection cannot create evolvability where the physics does not permit it."

  ## IV. ANALYSIS OF VERBAL DISPUTES AND FALSIFIABILITY

  ### 1. Verbal Dispute: The Definition of "Skyhook"
  **Diagnosis:** A significant portion of the conflict is verbal. The Adaptationist defines "Skyhook" as *any explanation that lacks a selectionist genealogy*. The Structuralist defines "Skyhook" as *an appeal to supernatural or magical causation*.
  **Resolution:** When the Structuralist says "This is not a Skyhook, it's a law of form," the Adaptationist hears "I refuse to give a selectionist history." When the Adaptationist says "This is a Skyhook," the Structuralist hears "You are accusing me of magic."
  **Agreement:** Both parties agree to retire the term "Skyhook" for the duration of this collaboration. It will be replaced by **"Selection-Independent Order" (SIO)**. The Adaptationist claims SIO does not exist (or is negligible). The Structuralist claims SIO is ubiquitous.

  ### 2. Unfalsifiability Check: The "In Principle" Claim
  **Diagnosis:** The Adaptationist's position contains a potential unfalsifiability. The claim that "every instance... is *in principle* the product of cumulative selection" is shielded from refutation by the argument that "we simply haven't found the steps yet." This renders the view immune to empirical failure.
  **Minimal Revision for Testability:** The Adaptationist must commit to a **falsification condition**.
  *   *Revised Claim:* "If a biological regularity is demonstrated to arise in a system with **zero heritable variation** and **zero differential retention**, solely due to physical law, the selectionist explanation for *that specific regularity* is falsified."
  *   *Rationale:* This forces the Adaptationist to identify whether they believe *all* order is selected, or only *biological* order (where replication exists). If they concede physical law can create order before selection, the "Crane-Only" view is nuanced. If they insist selection created the physical laws, the view becomes metaphysical and exits the collaboration.

  ### 3. Unfalsifiability Check: The "Autonomy" Claim
  **Diagnosis:** The Structuralist's claim that higher-level regularities are "explanatorily autonomous" risks unfalsifiability if "autonomy" simply means "hard to reduce."
  **Minimal Revision for Testability:** The Structuralist must commit to a **predictive condition**.
  *   *Revised Claim:* "If a higher-level structural model predicts a biological form that **contradicts** the optimal form predicted by selectionist modeling, and the biological form matches the structural prediction, then structural explanation is privileged."
  *   *Rationale:* This moves Structuralism from a critique ("your story is incomplete") to a positive theory ("my story predicts X, yours predicts Y").

  ***

  **Signatures:**

  _________________________ (The Adaptationist)

  _________________________ (The Structuralist)

  _________________________ (Convener)
