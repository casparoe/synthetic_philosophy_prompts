  **Does the new pair separate them?**
  Yes and no. The new pair cleanly separates **Consistent Expected Utility** from the other two. If Priya chooses the 50% £400 option in Part B, she is behaving consistently with standard economic theory. If she chooses the 40% £1,000 option, she has violated the Independence Axiom.

