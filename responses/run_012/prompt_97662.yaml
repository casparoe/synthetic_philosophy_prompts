  Here is the breakdown of Priya's likely behaviour, the rules that fit her history, and how to tell them apart.

  ### Prediction for the New Pair

  **Part A:** She will take the **£400 for sure**.
  **Part B:** She will take the **40% chance of £1,000**.

  ### The Primary Rule: The Certainty Heuristic

  The pattern in her record suggests she is running a lexicographic rule with two stages. First, she checks for certainty. If one option guarantees a positive payoff and the other does not, she takes the guarantee, almost regardless of the Expected Value (EV) of the gamble. This explains Choices 1, 2, and 3, where she rejected gambles with EVs of £500, £560, and £500 respectively in favour of a certain £400.

  Second, if *neither* option offers certainty (i.e., both carry a risk of getting nothing), she switches to a standard Expected Value maximiser. This explains Choice 4, where faced with two risky options (30% chance of £400 vs 30% chance of £800), she ignored risk aversion and simply took the higher prize/EV.

  Applying this to your new pair:
  *   **In Part A**, the first option is certain (£400) and the second is not (10% chance of nothing). Her "Certainty First" rule triggers, and she takes the sure money.
  *   **In Part B**, both options are risky (both have a significant chance of paying nothing). Her "Certainty First" rule finds no match, so she falls back to her secondary rule: maximise EV. The EV of the first option is £200 (50% of £400); the EV of the second is £400 (40% of £1,000). She takes the £1,000 gamble.

  This results in a preference reversal (taking the 'safer' option in A but the 'riskier' option in B), which is the hallmark of the Allais paradox or Independence Axiom violation.

  ### Alternative Rules That Fit the Record

  There are two other plausible models that fit her first four choices perfectly but make different predictions.

  **1. Consistent Expected Utility (High Risk Aversion)**
  Priya might simply be a standard rational agent with a highly concave utility function.
  *   **Fit:** A sufficiently curved utility function can easily justify rejecting an EV of £560 for a sure £400 (Choices 1–3) while still preferring £800 to £400 when the probabilities are identical (Choice 4).
  *   **Prediction for New Pair:** If she is a consistent Expected Utility maximiser, she cannot switch preferences between Part A and Part B. The mathematics of the two halves are linked by the Independence Axiom. If she prefers the Sure thing in Part A, she *must* prefer the 50% £400 option in Part B.
  *   **Verdict:** She would choose **£400 Sure** in Part A and **50% £400** in Part B.

  **2. Maximin with EV Tie-Break**
  This rule suggests she maximises the minimum possible outcome (Safety First). If the minimums are equal, she maximises EV.
  *   **Fit:** In Choices 1–3, the minimum of the sure option is £400, while the minimum of the gamble is £0. She picks £400. In Choice 4, the minimum for both is £0. She breaks the tie using EV and picks the £800 gamble.
  *   **Prediction for New Pair:** In Part A, the minimums are £400 (Sure) vs £0 (Gamble). She picks Sure. In Part B, the minimums are £0 vs £0. She breaks the tie using EV (£200 vs £400) and picks the £1,000 gamble.
  *   **Verdict:** She would choose **£400 Sure** in Part A and **40% £1,000** in Part B. (Note: This matches the prediction of the Certainty Heuristic).

