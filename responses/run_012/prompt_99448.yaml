          *   *Decree-Grounded Actualism (DGA):* No true CCFs prior to the decree. What a creature *would* do is grounded in the creative act itself. God knows CCFs as the "reverse side" of the decision to create this specific world/creatures.
      *   **Axes of Comparison:**
          1.  Order of explanation (Natural, Middle, Free Knowledge) & distinctness of the "middle" moment.
          2.  Grounding of CCFs & the "Grounding Objection."
