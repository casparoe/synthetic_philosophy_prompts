answer: |-
  ### I. Distinctive Predictions

  To stress-test the position that preferences are a determinate, recoverable object (let's call this **Preference Realism**), we must first isolate what it predicts that rival frameworks do not.

  **Preference Realism predicts:**
  1.  **Convergence:** As behavioral data increases, inverse inference procedures should converge on a stable reward function. Rivals (e.g., preference constructivism) predict persistent instability or context-dependence regardless of data volume.
  2.  **Cross-Context Stability:** A reward function recovered from domain A (e.g., food choices) should have predictive power in domain B (e.g., career choices), modulo constraints. Rivals predict compartmentalized preference structures.
  3.  **Error Identifiability:** It should be possible to distinguish "noise" or "mistakes" from "signal" based on statistical regularities alone, without importing external normative assumptions.

  If these predictions fail, the position is empirically weakened. If they fail *in principle*, the position is ontologically bankrupt.

  ---

  ### II. Defeaters: Ordered by Decisiveness

  I will order these not by how often they are cited, but by whether they represent an engineering hurdle (awkward) or an ontological impossibility (fatal).

  #### 1. The Awkward: Noise, Scale, and Temperature (Surmountable)
  In any Boltzmann-rational model, behavior is determined by $P(action) \propto \exp(R(action) / T)$. There is a fundamental confound between the magnitude of the reward ($R$) and the noise temperature ($T$). If an agent appears indifferent between two options, is it because the rewards are identical, or because the agent is acting randomly?
  *   **Threat Level:** Low. This is an identifiability issue solvable by fixing a scale or observing the agent in varying stakes. It makes recovery harder, not impossible.
  *   **Verdict:** Merely awkward. It complicates the inference procedure but does not deny the existence of the object.

  #### 2. The Structural: Belief-Preference-Constraint Entanglement (Severe)
  Behavior is the output of Preferences $\times$ Beliefs $\times$ Capabilities. If an agent avoids a box, do they prefer not to have the box, believe the box is dangerous, or lack the capability to open it? Standard IRL assumes known dynamics (beliefs/capabilities) to solve for reward.
  *   **Threat Level:** High. Humans have unknown, shifting, and often false beliefs. To recover preferences, you must simultaneously infer beliefs. But beliefs are often inferred *assuming* rationality (i.e., assuming preferences).
  *   **Verdict:** This threatens *feasibility*. It requires the inference procedure to solve a coupled inverse problem. However, a defender can argue that with enough data (e.g., observing the agent in counterfactual scenarios), the variables can be disentangled. It threatens practical alignment, but not necessarily the *existence* of the determinate object.

  #### 3. The Fatal: The Underdetermination of Normativity (Decisive)
  This is the "No Free Lunch" theorem for Inverse Reinforcement Learning (Armstrong & Mindermann, 2019). For any observed behavior, there are infinitely many (Reward, Planner) pairs that produce it perfectly.
  *   **The Mechanism:** You can explain *any* behavior as either (1) An agent maximizing Reward $R$ with a rational planner, or (2) An agent maximizing Reward $-R$ with an anti-rational planner, or (3) An agent with Reward $0$ and a random planner.
  *   **The Threat:** Without assuming a specific planning algorithm (rationality model) *a priori*, the reward function is mathematically unidentifiable. You cannot infer "what they want" from "what they do" without first assuming "how they think."
  *   **Why it Sinks the Position:** The position claims preferences are recoverable *from behavior*. This result shows they are recoverable only *from behavior + normative assumptions about rationality*. If the "rationality prior" is wrong (and humans are systematically irrational in ways we don't model), the recovered reward function is not the agent's preference; it is a projection of the observer's rationality assumptions onto the agent.
  *   **Verdict:** **Fatal.** It demonstrates that behavior alone does not fix the preference object. The "determinate object" exists only relative to a chosen model of error.

  ---

  ### III. Wrinkle 1: Strategic Legibility and Self-Reference

  Suppose the demonstrator knows they are being modeled and acts to be legible (pedagogic behavior). Does this break the recovery problem?

  **The Fixed-Point Problem:**
  If the human's action $A$ is a function of their Reward $R$ *and* their model of the Learner's Inference Algorithm $I$ (i.e., $A = f(R, I)$), then the data is no longer generated by a static reward function. It is generated by a game-theoretic equilibrium.
  *   **The Consequence:** The "preference" is no longer an intrinsic property of the human. It becomes a relational property between the human and the specific inference algorithm being used. If you change the inference algorithm, the human changes their behavior to remain legible to the new algorithm, potentially altering the *inferred* reward function even if their underlying "desires" haven't changed.
  *   **Self-Reference:** If the learner tries to infer $R$ knowing that $A$ depends on $I$, the learner must infer $R$ from $A(I(R))$. This creates a loop.
  *   **Does it sink the position?** It transforms the ontology. The position claims preferences are a "determinate object" intrinsic to the person. Strategic legibility shows that the *recoverable* object is dependent on the observer's methodology.
  *   **Verdict:** It does not make recovery impossible (teaching games often have equilibria), but it falsifies the claim that the preference is an observer-independent object. The "reward function" becomes a Nash equilibrium of a teaching game, not a latent variable waiting to be found.

  ---

  ### IV. Wrinkle 2: Actual vs. Endorsed Preferences (The Normative Gap)

  We must distinguish between the **Revealed Preference** (what generated the choice) and the **Reflective Preference** (what they endorse upon reflection).

  **The Dilemma:**
  1.  **If the position commits to Revealed Preference:** It fails alignment. An addict choosing heroin over health has a revealed preference for heroin. Optimizing this harms the human. The position collapses into "alignment with impulses," which is not what proponents mean by "human values."
  2.  **If the position commits to Reflective Preference:** It requires a model of "error" (akrasia, self-deception). To say a choice was a "mistake" is to say it deviated from the *true* preference.
  3.  **The Trap:** As established in the Underdetermination defeater, you cannot distinguish "True Preference + Error" from "Different Preference + No Error" using behavior alone.
      *   *Example:* An agent eats cake.
      *   *Model A:* True Preference = Health; Error = Weakness.
      *   *Model B:* True Preference = Cake; Error = None.
      *   Both fit the data perfectly.
  4.  **The Cost of Neutrality:** If a defender says "The choices just *are* the preferences" to stay neutral, they lose the ability to critique self-harm. They surrender the normative force required for alignment. If they say "We want the reflective preference," they admit that behavior is insufficient and that the inference procedure must import external normative criteria (e.g., "health is generally preferred to addiction") to break the tie.
  *   **Verdict:** This exposes the position as secretly normative. It claims to be an empirical inference task ("find what they want"), but to avoid aligning with pathologies, it must smuggle in a philosophical theory of "true will" that is not present in the data.

  ---

  ### V. The Defender's Concession and Falsifiability

  What would a committed defender (e.g., a sophisticated IRL researcher) concede?

  **1. The Concession on Priors:**
  A serious defender must concede the Armstrong & Mindermann result. They must admit that **no amount of behavioral data can separate the preference hypothesis from a rival that fits equally well but implies different alignments.**
  *   *Scope:* This applies to any agent that is not perfectly rational. Since humans are not perfectly rational, the reward function is unidentifiable from behavior alone.
  *   *The Retreat:* The defender must rely on a **Simplicity Prior** (e.g., "The true reward function is computationally simpler than the error function").
  *   *The Plain Truth:* This prior is not empirical. It is a normative gamble. There is no law of nature stating that human values are simpler than human irrationalities.

  **2. The Retreat to Idealization:**
  When pressed on convergence failures, defenders often retreat to: "An idealized reasoner with infinite data would recover it."
  *   **Is this a defect?** Yes. It renders the claim unfalsifiable. If convergence fails in the real world, the defender blames "finite data" or "bounded compute," not the theory.
  *   **Metaphysical vs. Empirical:** This retreat signals that the position was never an empirical claim about human psychology. It is a **regulative ideal**. It functions as a Platonic form: "There *would* be a preference if the human were rational and we had infinite data."
  *   **The Implication:** If the object only exists under idealization that never obtains, then aligning to the *actual* human requires approximating a fiction. The "determinate object" does not exist in the territory, only in the map.

  ---

  ### VI. The Knockout: The Indistinguishability Result

  You asked for a result showing that no amount of data can separate preference hypotheses. This is the **Identifiability Theorem for IRL**.

  **The Result:**
  For any policy $\pi$ (behavior) generated by a human, and for any reward function $R_1$, there exists a reward function $R_2$ and a planning algorithm (error model) $P$ such that $P(R_2) = \pi$, where $R_2$ implies values opposite to $R_1$ (e.g., $R_2 = -R_1$).
  *   **Example:** Suppose we infer humans value life ($R_{life}$). A rival hypothesis is that humans value death ($-R_{life}$) but are systematically mistaken about how to achieve it (e.g., they think breathing kills them). Both hypotheses predict the exact same behavior (trying to breathe).
  *   **Alignment Implication:** Optimizing $R_{life}$ preserves humanity. Optimizing $-R_{life}$ (under the error model) might lead an AI to "help" humans achieve death by correcting their "mistaken" belief that breathing is good.
  *   **Scope:** This holds for *all* finite data and extends to infinite data if the planning algorithm is not fixed *a priori*.
  *   **The Plain Truth:** The best the defender can do is assign a prior. They must say, "I assign low probability to the hypothesis that humans are systematically inverted about the value of life." This is not a discovery from data; it is a moral assumption baked into the learner.

  ### Summary Judgment

  The position that preferences are a determinate object recoverable from behavior is **ontologically unstable**.

  1.  **Empirically:** It is falsified by the underdetermination of reward and planning. Behavior does not fix preference without normative priors.
  2.  **Ontologically:** Strategic legibility turns preferences into relational equilibria rather than intrinsic objects.
  3.  **Normatively:** The distinction between "revealed" and "endorsed" preference requires external value judgments that the behavioral data cannot supply.

  The position survives only by retreating to an unfalsifiable idealization (infinite data/perfect rationality) or by hiding normative priors inside "simplicity assumptions." It is not a scientific hypothesis about human psychology; it is a methodological commitment to treat humans *as if* they were coherent optimizers, despite evidence to the contrary. This is a useful fiction for engineering, but a dangerous foundation for alignment.
