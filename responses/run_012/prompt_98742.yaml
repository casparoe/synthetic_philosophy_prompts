  You are observing that conditioning on new evidence expands your interval of admissible probabilities for a hypothesis, even when that evidence is probabilistically independent of the hypothesis within every individual model you consider. This structural effect converts a previously robust decision into a fragile one solely by acquiring information that, within any single model, should theoretically be irrelevant.

  (2) Nearest established concepts
  **Ambiguity Aversion** describes a preference ordering where agents favor known risks over unknown uncertainties (e.g., the Ellsberg paradox). It captures the discomfort you feel regarding the widening range but fails to describe the mechanical update rule causing the range to widen; it is an attitude toward uncertainty, not a property of the uncertainty itself.

  **Second-Order Probability** assigns a probability distribution over your first-order probabilities. While this handles uncertainty about parameters, standard Bayesian updating on a second-order distribution typically narrows the variance (reducing uncertainty) as data arrives. It does not account for the structural widening of bounds you are seeing, as it collapses the set of models into a single higher-order distribution.

  **Standard Bayesian Conditioning** operates on a single precise probability model. In this framework, conditioning on independent evidence leaves the hypothesis probability unchanged, and conditioning on dependent evidence typically narrows uncertainty. It cannot explain an increase in imprecision, as it lacks the set-based structure required for bounds to diverge from point estimates.

  (3) Verdict on the name
  The established term for this phenomenon is **Dilation** (specifically within the theory of Imprecise Probabilities). Dilation occurs when the conditional lower probability of an event is lower than its unconditional lower probability, and the conditional upper probability is higher than its unconditional upper probability, given some evidence. It differs from the nearest concepts because it is a structural property of sets of probabilities rather than a psychological attitude or a single distribution. The paradox you noted—independence within models versus widening across the set—is the defining feature of dilation: while evidence is irrelevant to the hypothesis *within* each model, it is informative about *which* model applies, thereby exposing greater variation across the set of admissible models.

  (4) Boundary cases and a diagnostic test
  A case that looks similar but is not dilation is learning about a common cause: if rainfall causally affects erosion, learning rainfall patterns changes the erosion probability directly. This is standard dependence, not dilation, because the independence assumption within models is violated. To diagnose dilation, apply the partition test: check if the uncertainty interval widens regardless of *which* outcome of the evidence you observe (e.g., whether the survey says "high rain" or "low rain"). If the interval widens for every possible outcome of the evidence variable, you are experiencing dilation; if it narrows for some and widens for others, you are observing standard asymmetric updating.
