  ok so in my world history class the whole course gets cut in half around 1500 — everything before is "traditional" or "medieval," everything after is "modern" — and the reason we get is basically that Europeans started sailing across the oceans and then the modern world spread out from there. but we also spent weeks on the Silk Road and Indian Ocean trade and the Mongols, which were already linking up huge parts of the world way before that, and the teacher keeps saying history is global and no one region is the center of it. what is the 1500 cut actualy assuming? does it assume big changes start in one place and spread, or that everyones on one timeline and some people are just ahead or behind, or that "modern" picks out one specific thing (industry, states, science) that happened to start in Europe? and whats the difference between what the split really needs to assume and what it just happens to fit nicely with? if you dropped the assumption, could the course still have periods at all or would it turn into one undifferentiated blob — what would a version that isn't the same story with new labels actually look like? also tell me how confident you are in what you're saying and which part you're least sure about.
