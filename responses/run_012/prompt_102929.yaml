          *   *Twist 1 (Sign):* The Lock-in mechanism is opaque. It could be good or bad.
          *   *Twist 2 (Selection):* The "Hinge" status is not known to them.
          *   *Wait, I need them to feel the naive pull first.* So initially, don't mention the sign risk. Just mention the leverage. Let them bet. Then introduce the sign risk before finalizing. Then introduce the selection probability.
          *   *Actually, the prompt says "before anyone says the word hinge."* So the mechanics must embody it without the label.
