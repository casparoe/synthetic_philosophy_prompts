      *   *Refining the "Selection" mechanic:* If I tell them afterwards "Only one table mattered," they might feel cheated. Better to tell them *during* the game that "History suggests only one century per millennium is a true hinge." Then ask them to estimate the probability *they* are in it. Then reveal the mechanic that simulates this.
      *   *Actually, let's keep it simple.* The game should simulate the *decision under uncertainty*.
      *   *Okay, final plan for the game:*
