answer: |-
  Hey, this is a great challenge and I think you are right to be worried about the standard pitch sliding off. If they have already absorbed the longtermist framing, telling them again that the future is big will just trigger their cached thoughts. You need them to make a decision under uncertainty that feels like the hinge argument, realize they made it confidently, and then have the rules of the game change underneath them to reveal why that confidence was fragile. I have designed a game called The Trajectory Wager that should do exactly this. It runs for two hours including a break, requires only paper, envelopes, and some poker chips or tokens, and it forces the sign-blindness and selection problems to emerge from the incentives rather than a lecture.

  You will need to set up three tables of four people each. Give each table a stack of twenty chips representing their civilization's resources, a sealed envelope labeled Policy Mechanism, and a score sheet. Tell them they are governing a society through a critical period and their goal is to maximize the final score, which represents the value of the future. In the first phase, give them the naive argument without calling it that. Tell them historical analysis suggests this specific period has unusually high trajectory sensitivity, meaning resources invested now in long-term structures will have a multiplier effect compared to resources spent on immediate welfare. Offer them a choice: they can cash in chips one-for-one for immediate points, or they can invest chips into the Long-Term Fund. Tell them the estimated multiplier for the Fund is 10x. Do not mention any risk yet. Just present the expected value. They will almost certainly dump almost all their chips into the Fund because the EV is overwhelmingly positive. Let them write down their decision and seal it in an envelope. This captures the naive pull you want them to feel, that obvious urgency to pour everything into the far future because the leverage is so high.

  Take a fifteen-minute break here. While they are out of the room, prepare the twist. You need three new envelopes for each table. Inside each, put a card that says either Positive Lock-In or Negative Lock-In. For two of the tables, put Negative. For one table, put Positive. Do not tell them this yet. When they return, start the second phase by handing them the Policy Mechanism envelope they ignored earlier. Ask them to open it. Inside is a rule stating that the Long-Term Fund multiplier is sign-blind. It amplifies impact, but the direction depends on the moral quality of the intervention, which is unknown to them. Reveal that for this game, the direction is determined by a hidden card. If they drew Positive, their investment is multiplied by 10. If they drew Negative, their investment is multiplied by negative 10, meaning it subtracts from their score. This is where the floor should move. They committed based on magnitude, but now they realize magnitude amplifies error equally. Ask them if they want to change their decision. They cannot change the chips they already committed, but they can discuss how they feel about the risk. This lands the point about leverage not being goodness. If they are not confident about the sign of their influence, the hinge makes boldness scarier.

  Now for the third phase, which hits the selection problem. Tell them that while the sign-blindness applies to everyone, the multiplier itself is rare. Hand out a new sheet that says only one century in a millennium is a true hinge period. The other centuries have a multiplier of 1x regardless of investment. Reveal that you, the facilitator, have randomly designated only one of the three tables as the actual Hinge Generation before the game started. The other two tables are noise. Their investments will not be multiplied at all, win or lose. Do not tell them which table is the hinge yet. Ask them to calculate their expected value again given this new probability. They should realize that merely being alive and feeling like this moment is special provides no evidence that they are actually the hinge table. They are likely just a control group. Finally, reveal which table was the hinge and flip the sign card for that table to determine the final scores. The other tables get their base score only. This usually creates a palpable tension because the tables that invested heavily realize they might have wasted everything on a non-hinge era, or worse, locked in a negative trajectory for no reason.

  For the debrief, you need to walk them through what happened without letting them dismiss it as just a game. Start by asking the table that invested the most how they felt in phase one versus phase three. Map their phase one confidence to the standard longtermist pitch where the future is big so we must act. Map the phase two reveal to the sign-blindness problem. Emphasize that a hinge is a point of sensitivity, not a point of guaranteed improvement. If you push hard on a lever without knowing which way the machine moves, you break it faster. Then map the phase three reveal to the selection problem. Ask them what evidence they had during phase one that they were the hinge table. They had none, just the facilitator telling them so. Connect this to the real world claim that every generation feels pivotal. The only way to justify the hinge hypothesis is to have independent evidence that this stretch is unusual, not just the fact that we are here thinking about it. You should also point out where the analogy breaks down. In the real world, we are not randomly assigned to be the hinge or not in a sealed envelope. We have to gather evidence to update that probability. The game assumes a prior probability of being at a hinge, but in reality, that prior is the contested claim. Also, the game treats the sign of influence as a coin flip, whereas in reality, we might be able to research the sign before acting. The game compresses time to force the decision, but real hinge decisions often allow for more investigation.

  There are three things that will predictably go sideways the first time you run this and you need to be ready to bail out. First, the group might get cynical during the sign-blindness reveal and decide the game is rigged so why bother. If they check out, remind them that the point of the game is to simulate the uncertainty we face in reality, not to win points. Ask them to play out the counterfactual where they had known the sign would that have changed their epistemology or just their strategy. Second, the selection reveal might make the non-hinge tables feel their time was wasted. To bail out, emphasize that their experience of uncertainty was the valuable data point, not their score. Their feeling of wasting resources is exactly the feeling of the selection problem manifesting. Third, you might run out of time during the debrief because the philosophical implications are dense. If you are ten minutes from the end and still on the sign-blindness point, cut the selection discussion short and assign it as a takeaway question. It is better they leave thinking about the selection problem than rushing through the sign problem which is the more immediate danger to bold action.

  One last thing to be straight about is what the game cannot reproduce. It cannot capture the moral weight of the real decision. Losing chips in a game is annoying; locking in a bad trajectory for humanity is catastrophic. You will have to carry that emotional weight yourself in the debrief by connecting their mild anxiety to the actual stakes. It also cannot reproduce the ability to gather more information. In the game, they had to bet now or never. In reality, a key response to hinge uncertainty is to slow down and learn more rather than bet big or small. You need to make sure they leave knowing that recognizing the hinge hypothesis uncertainty doesn't imply paralysis, but rather a shift toward robustness and information gathering. If you can land that nuance, this should shake the floor enough to make the next hour of discussion genuinely different from what they usually do. Good luck with the session.
