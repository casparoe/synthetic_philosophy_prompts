prompt: |-
  Longtime LW reader here, been lurking since the old days, and I have a question I can't seem to get a straight answer on from the Sequences or from anyone in the comments.

  I keep going back to Dennett's Quining Qualia paper and I genuinely can't tell whether I understand the argument or whether I've just absorbed the vibe of it. The vibe is "qualia are an incoherent posit, stop talking about them." But every time I try to reconstruct the actual argument I end up either (a) agreeing with something trivial, or (b) agreeing with something that seems to just deny that experience exists, which can't be what he means.

  So please walk me through the real structure of it, not the summary. The part I most want is the four-features thing. As I remember, the four are: ineffable, intrinsic, private, and directly/immediately apprehensible (sometimes glossed as incorrigible). Each one, taken alone, sounds like it's just a plain description of what it's like to taste coffee. So where's the alleged conflict? Is it that intrinsic and private can't both be established by introspection? Is it that direct apprehension makes ineffability redundant? Or that if something is directly apprehensible then it can't be private in the relevant sense? Lay out which pairs actually clash, which of the four are load-bearing for the pro-qualia side, and which ones you could drop without losing the core intuition that there's something it's like.

  Then the Chase and Sanborn coffee case, which I think is the actual heart of the paper. My memory: two longtime coffee drinkers, one says the taste is the same as always but he's lost his taste for it, the other says the taste itself changed and now it's bitter to him. Dennett's move is supposed to be that there's no fact of the matter about whose qualia changed. But I've never understood why that's an argument against qualia rather than an argument that we can't tell from the outside. Help me see the actual move. Is he claiming the question is indeterminate? That it's meaningless? That the reports are theory-laden and there's nothing underneath to be right or wrong about? Those are seperate claims and I think I've been conflating them, which is probably why I keep going in circles.

  Here's the thing I actually want to get at, and I haven't seen anyone spell it out. The incoherence charge seems to treat qualia like a theoretical posit — the way phlogiston or caloric was a posit, where the entity has a job description and the job description turns out to be self-contradictory, so we should stop positing it. But most people who believe in qualia aren't positing them to explain anything. They're pointing at the most obvious thing in the world and saying "this." So does the incoherence argument even land on that target? And if the answer is "the concept is incoherent but the phenomenon is real, we just need a better concept," then what is the better concept supposed to look like, and how is that different from just being a functionalist who admits he has experiences? That last question is definately the one that bugs me most, because every time I try to answer it I end up saying something that sounds like I've given up and become a zombie.

  Also, where does the argument actually stand now? I know there's an illusionist crew that picked up the ball and ran with it, and I know there are people who say Dennett basically begs the question by building incorrigibility and privacy into the definition and then showing those are hard to square with the rest. Which of those criticisms has teeth and which are just refusing to engage? And is there a version of the argument that survives even if you stipulate that there's something it's like, or does the whole thing only work if you're already a functionalist?

  Please don't just summarize the paper. I want the joints of the argument, where the load-bearing steps are, and where a sympathetic but unconvinced reader should push back.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Longtime LessWrong (LW) reader, familiar with the Sequences, lurking since the "old days." This implies a high level of philosophical sophistication, familiarity with rationalist jargon (qualia, functionalism, zombies, etc.), and a desire for rigor over hand-waving. They are not a novice.
      *   **Core Question:** They want to understand Daniel Dennett's "Quining Qualia" argument *structurally*, not just a summary. They are stuck on the "vibe" vs. the "logic."
      *   **Specific Pain Points:**
          *   The "Four Properties" (ineffable, intrinsic, private, directly apprehensible): Why do they clash? Which pairs conflict? Which are load-bearing?
          *   The Chase and Sanborn (C&S) Coffee Case: Is it about indeterminacy, meaninglessness, or theory-laden reports? Why does this attack qualia rather than just epistemic access?
          *   The "Target" Problem: Qualia aren't a theoretical posit like phlogiston; they're "pointing at the obvious." Does the incoherence argument land? If the concept is incoherent but the phenomenon real, what's the better concept? How is that different from functionalism/zombiehood?
          *   Current Status: Illusionism vs. Question-Begging. Does the argument survive if you stipulate "there is something it's like"?
      *   **Constraint:** "Please don't just summarize the paper. I want the joints of the argument, where the load-bearing steps are, and where a sympathetic but unconvinced reader should push back."

  2.  **Deconstruct Dennett's Argument (Mental Sandbox):**
      *   *Goal:* Dennett wants to show that the standard philosophical definition of qualia is incoherent, not that experience doesn't exist.
      *   *The Four Properties:* Dennett claims qualia are supposed to have all four. His attack is that they can't coexist.
          *   *Ineffable:* Can't be fully communicated.
          *   *Intrinsic:* Non-relational, atomic.
          *   *Private:* Interpersonal comparisons impossible.
          *   *Directly Apprehensible (Incorrigible):* You can't be wrong about them.
      *   *The Clash:* The main tension is usually between *Intrinsic/Ineffable* and *Directly Apprehensible/Functional Role*. If it's intrinsic and private, how do we talk about it? If we talk about it, is it really ineffable? If it's directly apprehensible, does that mean it's immune to functional analysis? Dennett argues that once you subject them to heterophenomenology (treating reports as texts), the "incorrigibility" vanishes, and if incorrigibility vanishes, the "qualia" label loses its distinctive work.
      *   *Chase & Sanborn:* This is the *reductio*.
          *   Mr. Chase: Taste buds changed (qualia same, preference different).
          *   Mr. Sanborn: Qualia changed (taste different, preference same).
          *   Dennett's Point: There is no "qualia meter" to check. Their *judgments* differ. If qualia are supposed to be the *ground* of the judgment, but the judgment is all we have access to, and the judgment is unstable/theory-laden, then positing a "real qualia state" underneath is doing no work. It's like asking if the "real center of gravity" shifted or just the calculation.
      *   *The "Pointing" Objection:* User says people aren't positing qualia to explain things, just pointing. Dennett's counter: You *are* positing properties when you characterize that pointing. If the properties are incoherent, the pointing is pointing at a confusion.
      *   *Illusionism vs. Functionalism:* If you drop the four properties, you're left with "judgments about states." That *is* functionalism/representationalism. The "zombie" fear is that this removes the "feeling." Dennett says the "feeling" was the confusion.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's LW background. Validate that the confusion is common because Dennett is often read as "denying experience" rather than "denying a specific philosophical construction of experience."
      *   **Part 1: The Four Properties (The Joints):**
          *   Need to explain *why* they clash. It's not just a list; it's a "job description."
          *   *The Conflict:* The tension is between **Incorrigibility** (I am the ultimate authority) and **Ineffability/Intrinsicness** (It is isolated from functional context).
          *   *Dennett's Move:* If it's directly apprehensible, I should be able to report on it. If I report on it, it enters the public sphere (violating Privacy/Ineffability). If I can't report on it accurately (because memory fades, attention shifts), then it's not Incorrigible.
          *   *Load-bearing:* **Incorrigibility** is the main target. If you drop it, you can keep the rest as "functional states." If you keep Incorrigibility, you isolate the state from physical/functional analysis, making it a "ghost."
      *   **Part 2: Chase & Sanborn (The Engine):**
          *   Clarify the distinction: Epistemic (we can't know) vs. Ontological (there is no fact). Dennett argues for the latter *regarding qualia specifically*.
          *   The "Qualia Realist" wants qualia to be the *basis* of the judgment.
          *   Dennett shows the judgment is theory-laden (involving memory, preference, attention).
          *   If the judgment is theory-laden, it can be wrong. If it can be wrong, qualia aren't Incorrigible.
          *   If qualia aren't Incorrigible, what distinguishes them from ordinary functional states? Nothing. So "qualia" is an empty label.
      *   **Part 3: The "Pointing" Objection (Phlogiston vs. Pain):**
          *   Address the "I'm just pointing" claim.
          *   Analogy: Pointing at "sunrise." You are pointing, but the *concept* "sun rises" implies geocentrism. You can keep pointing at the phenomenon (light in sky) but must drop the concept (sun moving).
          *   Similarly: Point at the experience, but drop the "Intrinsic/Incorrigible" baggage.
          *   *The Better Concept:* Heterophenomenology. Treat experience as a "user illusion" generated by the brain. It's real as an *event*, not as a *non-physical property*.
          *   *Zombie Fear:* Address the "nothing it's like" worry. Dennett says "something it's like" is a metaphor for information access. If you have information access, you have "something it's like."
      *   **Part 4: Current Status & Criticisms:**
          *   *Question-Begging:* Critics (Block, Chalmers) say Dennett defines qualia out of existence by demanding they be functional.
          *   *Illusionism:* Frankish, etc. This is the modern successor.
          *   *Does it survive stipulation?* If you stipulate "there is something it's like" *without* the four properties, Dennett says "Great, we agree, that's just consciousness." The fight is only about the *properties*.
      *   **Conclusion:** Summarize the pushback points. Where should a skeptic attack? (Usually the definition of Incorrigibility or the leap from "judgment is fallible" to "qualia don't exist").

  4.  **Refining the Tone:**
      *   Must be LW-aligned. Use terms like "map/territory," "confusion," "bucket errors," "functionalism."
      *   Avoid condescension. The user is smart.
      *   Be precise about the "Four Properties." Many summaries get this wrong. It's not just that they clash, it's that *qualia realists commit to all four*, and Dennett shows they can't hold all four simultaneously under scrutiny.
      *   *Self-Correction on C&S:* Make sure to emphasize that Dennett isn't saying "we can't know who is right." He's saying "the distinction they are drawing (qualia change vs. preference change) has no referent." It's a category error.

  5.  **Final Polish:** Check against the specific questions in the prompt.
      *   *Four features clash?* Yes, detail the Incorrigibility vs. Intrinsic tension.
      *   *Load-bearing?* Incorrigibility.
      *   *C&S move?* Ontological indeterminacy, not epistemic.
      *   *Pointing/Phlogiston?* Yes, concept vs. phenomenon.
      *   *Better concept?* Heterophenomenology/Functionalism.
      *   *Current status?* Illusionism vs. Hard Problem defenders.

  6.  (Self-Correction during drafting): I need to be careful not to sound like I'm *advocating* for Dennett, but explaining the *structure* of the argument as requested. The user wants to know where the joints are so they can push back. I need to highlight the vulnerability points.

      *   *Vulnerability 1:* Dennett assumes that if a property plays no causal/explanatory role, it doesn't exist. (Eliminativist move).
      *   *Vulnerability 2:* The definition of "Incorrigible." Maybe it's not about memory, but about the present moment.
      *   *Vulnerability 3:* The C&S case relies on the idea that *all* access to qualia is via judgment. What if there's non-judgmental awareness?

      Okay, ready to write.
answer: |-
  This is a classic LessWrong-style bottleneck: you have absorbed the *conclusion* of a dense philosophical argument without successfully compiling the *source code*. This is common with Dennett because his rhetorical style often obscures the formal structure of his claims. He writes like a lawyer cross-examining a witness, not like a logician laying out premises.

  You are correct that the confusion usually stems from conflating "experience exists" with "qualia (as philosophically defined) exist." Dennett is an eliminativist about the latter, not the former.

  Here is the structural breakdown of *Quining Qualia*, focusing on the load-bearing joints, the specific clashes in the four properties, the ontological vs. epistemic move in Chase & Sanborn, and where the argument currently stands.

  ---

  ### 1. The Four Properties: Where the Clash Actually Is

  You asked which pairs clash. The standard reading is that they form a "job description" that no entity can fulfill. But the specific tension is not between all four equally. It is a tension between **Incorrigibility** (Direct Apprehension) and the combination of **Intrinsicness/Privacy/Ineffability**.

  Here is the load-bearing structure:

  1.  **Ineffable:** Cannot be fully communicated/translated.
  2.  **Intrinsic:** Non-relational, atomic, doesn't depend on context.
  3.  **Private:** Interpersonal comparison is impossible (in principle).
  4.  **Directly Apprehensible (Incorrigible):** The subject cannot be wrong about their own qualia.

  **The Conflict:**
  The clash arises when you subject **Incorrigibility** to temporal scrutiny.
  If qualia are *Intrinsic* and *Private*, they must be isolated from functional context (memory, attention, linguistic categorization). But if they are *Directly Apprehensible*, I must be able to form a judgment about them that is immune to error.

  Dennett's move is to show that **Incorrigibility requires functional access, but functional access destroys Incorrigibility.**

  *   **The Attack Vector:** To claim I am *incorrigible* about my qualia, I must be able to compare my current state to a past state (e.g., "This wine tastes the same as yesterday").
  *   **The Problem:** Memory is fallible. Attention fluctuates. Linguistic categorization shifts.
  *   **The Dilemma:**
      *   If you say "My judgment about the qualia might be wrong because my memory faded," you have surrendered **Incorrigibility**.
      *   If you say "My judgment is incorrigible, therefore the qualia *must* have been exactly that," you are treating the *judgment* as constitutive of the *qualia*. But if the judgment is constitutive, then the qualia are not **Intrinsic** (they depend on the cognitive act of judging).
      *   If you try to hold that the qualia are Intrinsic *and* Incorrigible, you have to posit a "mental eye" that perceives qualia without memory or processing delay. Dennett argues this is a homunculus fallacy.

  **Load-Bearing Property:** **Incorrigibility.**
  If you drop Incorrigibility, you can keep the other three as "rough approximations" of functional states. You can say experience is "mostly private" or "hard to describe." But the *philosophical* concept of qualia requires Incorrigibility to do its work (i.e., to serve as the foundation of knowledge that cannot be doubted).
  If you drop **Intrinsicness**, you become a Representationalist or Functionalist (qualia are just relations/representations).
  If you drop **Privacy**, you open the door to physical measurement.

  **Dennett's Conclusion on the Four:** He argues that qualia realists *need* all four to distinguish qualia from ordinary functional states. But since they cannot coexist under scrutiny, the label "qualia" refers to nothing. It is a "phantom limb" of philosophy.

  ---

  ### 2. Chase and Sanborn: The Ontological Move

  This is the crux of your confusion. You asked: *Is he claiming the question is indeterminate? Meaningless? Or that reports are theory-laden?*

  **The Answer:** He is claiming the distinction is **ontologically empty** because the only access we have to the "fact of the matter" is the theory-laden report itself.

  **The Setup:**
  *   **Chase:** "The coffee tastes the same (qualia unchanged), but I don't enjoy it anymore (preference changed)."
  *   **Sanborn:** "The coffee tastes different now (qualia changed), specifically more bitter."

  **The Qualia Realist Intuition:** There is a fact of the matter about the *sensory state* independent of the *hedonic judgment*. One of them is describing the territory correctly; the other is confused.

  **Dennett's Move:**
  1.  **No Qualia Meter:** There is no instrument to measure "bitterness-qualia" independent of the subject's report.
  2.  **Reports are Theory-Laden:** To say "It tastes bitter" is not a raw datum. It is a judgment that involves memory comparison, attention focusing, and linguistic categorization.
  3.  **The Indeterminacy:** If Chase and Sanborn have different *dispositions to judge*, and there is no third-party access to the "raw feel" underneath the judgment, then **there is no fact of the matter** about whose qualia changed.

  **Why this isn't just Epistemic:**
  If it were merely epistemic ("We can't know who is right, but God knows"), Dennett would be conceding that qualia exist as hidden variables.
  Dennett's claim is stronger: **The "raw feel" is not a hidden variable underneath the judgment; the "raw feel" is constituted by the disposition to judge.**
  If the disposition to judge is ambiguous (which it is, as shown by the two men diverging), then the "qualia state" is ambiguous. If the state is ambiguous, it cannot be *Intrinsic* or *Incorrigible*.

  **The Argument Structure:**
  1.  Qualia are supposed to be the *basis* of our reports.
  2.  Our reports diverge in cases like C&S without any physical difference in the tongue or brain state that maps to "qualia change" vs "preference change."
  3.  Therefore, the distinction between "qualia change" and "preference change" has no referent in the physical/functional architecture.
  4.  Therefore, positing a "qualia fact" underneath is like positing a "phlogiston fact" underneath combustion. It adds no explanatory power and creates contradictions.

  **Where to Push Back:**
  The sympathetic skeptic pushes back at Premise 3. You can argue: "Just because we lack a meter doesn't mean the state isn't real. The state is the *first-person access* itself." Dennett counters that "first-person access" is just a process, not a property.

  ---

  ### 3. The "Pointing" Objection: Phlogiston vs. Pain

  This is your most important question. *Qualia aren't a theoretical posit; they're the most obvious thing in the world.*

  **Dennett's Counter-Argument (The Sunrise Analogy):**
  When you point at the sunrise and say "The sun is moving," you are pointing at a real phenomenon (light patterns, relative motion). However, the *concept* you are using to describe it ("sun moves around earth") is false.
  *   **Phenomenon:** Real (visual experience of sunrise).
  *   **Concept:** Incoherent (geocentrism).

  Dennett argues "Qualia" is the *concept*, not the *phenomenon*.
  When you say "I have a qualia of red," you are pointing at a real neural event. But you are characterizing it as *Intrinsic, Ineffable, Private, Incorrigible*. Dennett says *that characterization* is the incoherent posit.

  **Does the Incoherence Argument Land?**
  Yes, if you accept that our *intuition* about experience is theory-laden. We intuitively feel our experience is "atomic" and "direct." Dennett argues this intuition is a user-illusion generated by the brain. The brain hides its own processing from itself to save bandwidth. We *feel* like we have direct access (Incorrigibility), but we don't.

  **The "Better Concept": Heterophenomenology**
  If you drop the four properties, what are you left with?
  *   **Functionalism/Representationalism:** Experience is a state of information access.
  *   **Heterophenomenology:** We treat the subject's reports as texts. We don't assume the reports are infallible descriptions of inner objects. We assume they are fallible descriptions of brain states.
  *   **The "What it's like":** Dennett accepts "there is something it's like" *if* you mean "the organism is in a state of informationally rich awareness." He rejects it if you mean "there is a non-functional, intrinsic movie screen in the head."

  **The Zombie Fear:**
  You asked: *How is that different from just being a functionalist who admits he has experiences?*
  **Answer:** It *is* exactly that. Dennett is a functionalist.
  The fear is: "If I say experience is just functional states, haven't I explained away the *feeling*?"
  Dennett's reply: "The 'feeling' you are trying to save is the feeling of *Incorrigibility*. Once you realize that feeling is an illusion, you realize nothing was lost. You still have the pain, the red, the coffee. You just stop thinking they have magical properties."

  **Where the Zombie Intuition Bites:**
  The intuition pump is: "A zombie could have the functional state without the feeling."
  Dennett's counter: "No, it couldn't. If it has the functional state (reporting pain, avoiding damage, attending to red), it has the 'feeling.' The idea that you can strip the feeling off the function is the confusion."

  ---

  ### 4. Current Status: Illusionism and Criticisms

  **Where does the argument stand?**
  *   **The Illusionist Camp:** Keith Frankish, Daniel Dennett, and recently some neuroscientists have doubled down. They argue that phenomenal consciousness (the "hard problem" stuff) is a user-illusion. The "Quining" argument is the foundation of modern Illusionism.
  *   **The Criticisms:**
      1.  **Question-Begging:** Critics (Ned Block, David Chalmers) argue Dennett defines qualia out of existence by insisting they must be functional. He assumes physicalism is true, then shows non-physical qualia don't fit.
          *   *Does this have teeth?* Yes. If you are not already a physicalist, Dennett's argument looks like a category error. He is arguing against a straw man of dualism.
      2.  **The "Hard Problem" Remains:** Even if you accept Dennett's functionalism, the question "Why does information processing feel like anything?" is not answered, it is dissolved. For many, dissolution is not an answer.
      3.  **Phenomenal Concepts:** Some argue we have a specific *concept* for experience that is distinct from functional concepts. Dennett denies this, but the debate is live.

  **Does it survive if you stipulate "There is something it's like"?**
  *   **If you stipulate:** "There is something it's like, but it has no magical properties (not incorrigible, not intrinsic)."
      *   **Dennett:** "Then we agree. That's just consciousness. Stop calling it qualia."
  *   **If you stipulate:** "There is something it's like, and it *is* intrinsic/incorrigible."
      *   **Dennett:** "Then you are positing a magic property that contradicts known physics and cognitive science. I reject it."

  **The Surviving Version:**
  The argument survives as a **reductio ad absurdum of Cartesian Materialism**. It successfully shows that you cannot hold *both* a scientific view of the brain *and* the traditional philosophical definition of qualia. You must drop one.
  *   Drop Science? (Dualism)
  *   Drop Qualia Properties? (Functionalism/Illusionism)

  Most LW readers find the "Drop Qualia Properties" option more parsimonious.

  ---

  ### Summary of Joints for Pushback

  If you want to argue against Dennett, do not argue that "experience exists." He agrees. Attack these joints:

  1.  **The Definition of Incorrigibility:** Dennett assumes incorrigibility requires memory comparison. Can you defend a version of incorrigibility that is strictly present-moment and non-conceptual? (Buddhist mindfulness traditions often try this).
  2.  **The Leap from Epistemic to Ontological:** In Chase & Sanborn, does the lack of a third-person meter *really* imply no fact of the matter? Or does it imply the fact is first-person only? Dennett assumes third-person access is the only real access. That is a physicalist axiom, not a proven fact.
  3.  **The User Illusion:** If the "feeling" is an illusion, *what is having the illusion?* An illusion is a experience of something that isn't there. If you have an experience of qualia, don't you still have the experience? Dennett says "Yes, but it's not *of* qualia, it's *of* brain states mischaracterized." The pushback is: "The mischaracterization *is* the qualia."

  **Final Verdict:**
  Dennett's argument is valid *if* you accept his functionalist premises. It is not a proof against dualism; it is a demonstration that dualism is incompatible with cognitive science. The "vibe" you absorbed is correct: he wants you to stop reifying the *properties* of experience. The "structure" is a proof that those properties form an inconsistent set.

  If you can let go of **Incorrigibility** and **Intrinsicness**, you keep the coffee taste without the philosophical headache. That is the "Quining."
