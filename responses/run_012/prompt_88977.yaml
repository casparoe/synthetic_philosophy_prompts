answer: |-
  ### Diagnosis of Your Current Draft

  Your intuition is correct: your current three questions are conflating **mathematical formalism** with **ontological commitment**, and they lack a termination condition for "verbal" disputes.

  *   **Question 1 (Inventory):** Necessary but not sufficient. A theory can *use* points as mathematical tools without believing they *exist*. You need to separate "What math is used?" from "What is claimed to be real?"
  *   **Question 2 (Shifts/Spins):** This is the gold standard (The Leibniz Shift). Keep this, but make it the decisive test.
  *   **Question 3 (Laws without Geometry):** This is the weak link. General Relativity has laws that *are* geometry, yet the status of that geometry is the debate. This question will misclassify dynamical geometry theories.

  Below is a revised decision procedure designed for grading consistency. It separates formalism from interpretation and builds in an "escape hatch" for verbal/anti-realist claims.

  ---

  ### The S/R Classification Protocol (v1.0)

  **Time limit:** 10 minutes per essay.
  **Goal:** Assign one verdict: **Substantivalist**, **Relationist**, **Anti-Realist/Verbal**, or **Indeterminate**.

  #### Step 1: The Formal Inventory (The Math)
  *Look at the mathematical apparatus the student describes.*
  *   **Q:** Does the formalism include a manifold, container, or metric field that exists mathematically even where there is no matter?
  *   **If No:** (e.g., only particle coordinates and distances). → **Tentative Verdict: Relationist.** (Proceed to Step 4 to confirm).
  *   **If Yes:** (e.g., Newton's absolute space, Minkowski manifold, GR metric). → **Do not decide yet.** This is just the *apparatus*. Proceed to Step 2.

  #### Step 2: The Ontological Commitment (The Text)
  *Look for explicit claims about what the math represents.*
  *   **Q:** Does the student/theorist claim the container/field is a physical *substance* (exists in its own right), or merely a *bookkeeping device* (a useful fiction for tracking relations)?
  *   **If Bookkeeping:** → **Tentative Verdict: Relationist.** (Proceed to Step 3 to confirm).
  *   **If Substance:** → **Tentative Verdict: Substantivalist.** (Proceed to Step 3 to confirm).
  *   **If Unclear/Silent:** → **Flag:** "Ontology Underspecified." Proceed to Step 3. If Step 3 fails, verdict is **Indeterminate**.
  *   **If "Meaningless":** (e.g., "Asking if space exists is nonsense"). → **Verdict: Anti-Realist/Verbal.** (Skip to Step 4).

  #### Step 3: The Leibniz Shift Test (The Decider)
  *This is the necessary and sufficient condition for the S/R distinction in this course.*
  *   **Q:** Imagine a universe with the exact same material bodies and internal relations, but shifted 5 feet to the left (or boosted/spun) relative to the background structure.
      *   **Option A:** Is this a **distinct physical possibility**? (God could have created *this* one instead).
      *   **Option B:** Is this the **same physical situation** described differently? (Indiscernible = Identical).
  *   **If Option A:** → **Verdict: Substantivalist.** (Points have independent identity).
  *   **If Option B:** → **Verdict: Relationist.** (Only relations matter).
  *   **If "Unaskable/Unobservable":** → **Verdict: Anti-Realist/Verbal.**

  #### Step 4: The Empirical Consequence Check (The Appeal-Proofing)
  *Use this to validate the "Verbal" claim or catch errors.*
  *   **Q:** Does the distinction between Option A and Option B in Step 3 yield different empirical predictions?
  *   **If Yes:** (Rare, but possible in some modern contexts). → The dispute is **Physical**. Trust Step 3.
  *   **If No:** (Standard classical case). → The dispute is **Metaphysical**.
      *   If the student argues "Therefore the dispute is verbal," mark **Anti-Realist/Verbal**.
      *   If the student argues "Therefore we must choose based on parsimony," mark **Relationist** (usually) or **Substantivalist** (if they argue for explanatory power).
      *   *Grading Note:* If a student says "It's verbal" but the theory explicitly commits to Absolute Space (like Newton), they are critiquing the theory, not classifying it. Mark **Substantivalist** (per the theory's own claims) and note the critique in comments.

  ---

  ### Running the Procedure: Three Test Cases

  Here is how you apply this to the specific essays you mentioned, showing your work for the convener/students.

  #### Case 1: Newton (Principia + Scholium)
  *   **Step 1 (Formalism):** Uses Absolute Space and Time as a container. **Yes.**
  *   **Step 2 (Commitment):** Newton explicitly argues space is an "affection of every kind of being" and sensorium of God. It is real. **Substance.**
  *   **Step 3 (Shift Test):** Newton argues a shifted universe is distinct. God perceives the difference even if we don't. The Bucket Argument proves absolute *motion*, which requires absolute *space* to be defined against. **Distinct Possibility.**
  *   **Step 4 (Empirical):** No empirical difference for uniform shift, but Newton insists on the metaphysical reality.
  *   **Verdict:** **Substantivalist.**
  *   **Grading the Students:**
      *   *Student A (Inventory):* Correct verdict, weak reasoning (math ≠ ontology), but passes Step 1 & 2. **Full Marks.**
      *   *Student B (Bucket):* Correct verdict, strong reasoning (Bucket → Absolute Motion → Absolute Space). Passes Step 3. **Full Marks.**
      *   *Why you were stuck:* You were looking for *one* reason. The procedure shows multiple paths lead to the same verdict. As long as they pass Step 3, the reasoning path matters less.

  #### Case 2: Leibniz (Correspondence)
  *   **Step 1 (Formalism):** Rejects container. Uses only monads/bodies and relations. **No.**
  *   **Step 2 (Commitment):** Space is an "order of coexistences." It is ideal, not real. **Bookkeeping.**
  *   **Step 3 (Shift Test):** A shifted universe is indiscernible. By Principle of Sufficient Reason, God would not choose one over the other. Therefore, they are the same. **Same Situation.**
  *   **Verdict:** **Relationist.**
  *   **Grading Note:** If a student says "Leibniz is relationist because he hates Newton," that's weak. If they say "because of the Shift Argument/PSR," that hits Step 3.

  #### Case 3: General Relativity (The "Bite" Case)
  *This is where your old heuristic ("Fixed Geometry = Substantivalist") fails, because GR geometry is dynamical.*
  *   **Step 1 (Formalism):** Uses a Manifold + Metric Field. **Yes.**
  *   **Step 2 (Commitment):** *Here is the fork.*
      *   *Interpretation X:* The metric field is a physical object (like the EM field). **Substance.**
      *   *Interpretation Y:* The manifold points are just labels; only coincidences of matter/fields are real. **Bookkeeping.**
  *   **Step 3 (Shift Test):** (The Hole Argument).
      *   If you drag the metric field over the manifold points (active diffeomorphism), is it a new world?
      *   *If Yes:* **Substantivalist** (leads to indeterminism).
      *   *If No:* **Relationist** (or "Sophisticated Substantivalist").
  *   **Step 4 (Empirical):** No empirical difference between diffeomorphic models.
  *   **Verdict:** **Indeterminate / Judgment Call.**
  *   **Grading Instruction:**
      *   If a student writes "Substantivalist because the metric is real energy-carrying field," **Accept.** (They chose Interpretation X).
      *   If a student writes "Relationist because of Leibniz Equivalence/diffeomorphism invariance," **Accept.** (They chose Interpretation Y).
      *   *Crucial:* You cannot mark one wrong unless they contradict themselves. Your old heuristic would have marked the Relationist GR student wrong. This procedure flags it as an interpretive choice.
      *   *What to tell the convener:* "GR is the boundary case. The procedure correctly identifies that the classification depends on how one resolves the Hole Argument, not just the presence of geometry."

  ---

  ### Handling the "Verbal Dispute" Claim
  You asked if the student who called the dispute "verbal" was cop-out or correct.
  *   **Run Step 4:** If the student argues that because the Shift Test yields no empirical difference, the question of "real existence" is linguistic convention, the procedure assigns **Anti-Realist/Verbal**.
  *   **Is this a valid grade?** Yes. Positivism and Conventionalism are valid philosophical positions in this course.
  *   **When is it a cop-out?** If the theory *itself* (e.g., Newton) claims the distinction is real, and the student ignores the theory's claim to impose their own positivism without argument, mark down for "Misclassification of Theory." They are classifying *their philosophy*, not *Newton's theory*. The procedure catches this in Step 2 (Ontological Commitment of the *Theory*, not the student).

  ---

  ### Limitations: What This Procedure Cannot Do

  Be transparent with the convener that this tool has boundaries.

  1.  **It Cannot Resolve the Hole Argument:** As seen in Case 3, the procedure identifies *where* the ambiguity lies (Step 3), but it does not solve it. It classifies the *student's interpretation*, not the One True Truth of GR.
  2.  **It Assumes Classical Metaphysics:** The S/R distinction relies on "objects," "locations," and "identity." In Quantum Gravity (e.g., Loop Quantum Gravity, String Theory), spacetime may be emergent. The procedure will return **Indeterminate** or **Anti-Realist**. This is correct, but you should warn students not to apply it to theories where "spacetime" dissolves entirely.
  3.  **"Substantivalism" is a Family Resemblance:** The procedure treats Substantivalism as a binary switch. In reality, there are "Manifold Substantivalists," "Metric Substantivalists," and "Spacetime State Realists." The procedure groups these all under "Substantivalist." This is acceptable for a 2nd-year course, but acknowledge that you are grading on *broad strokes*, not nuance.
  4.  **It Relies on Student Clarity:** If a student writes poorly, Step 2 (Commitment) becomes impossible. The verdict becomes **Indeterminate**. Do not guess. Mark "Insufficient Evidence" rather than penalizing for a philosophical classification they didn't articulate.

  ### Summary for the Rubric
  Add this box to your grading sheet:
  *   **[ ] Shift Test Passed?** (Does the student identify whether shifted worlds are distinct?)
  *   **[ ] Ontology vs. Math Distinguished?** (Did they separate the equations from the claim about reality?)
  *   **[ ] Verdict Consistent?** (Does the final label match their answer to the Shift Test?)

  If all three are checked, the essay is sound, regardless of whether you personally agree with their metaphysical preference.
