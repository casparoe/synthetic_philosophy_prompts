      *   *Focus:* The prompt asks about the theory *running on* in people's heads, not necessarily the academic truth.
      *   *Key Insight:* The warning ("don't watch during a breakup") proves people believe the sadness is *contagious* or *additive*. The recommendation ("you must watch") proves they believe it's *transformative*.
      *   *Refining the "Real vs Fake" section:* If it were fake, the warning disappears. If it were purely costly, the recommendation disappears. The fact that both exist implies a "Cost/Benefit" calculation where the Benefit usually outweighs the Cost, unless you're already bankrupt (breakup).

  8.  **Final Polish:** Check tone. Keep it thoughtful, analytical, but accessible. Ensure all parts of the prompt are answered. (The "Undecided" section needs to be sharp—showing that mechanism doesn't matter, only outcome).

