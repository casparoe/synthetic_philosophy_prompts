prompt: |-
  ok so I'm a novelist, about 200 pages into a draft where one of the main characters is an AI that has to make real ethical calls out in the field -- think a triage system in a disaster, phones down, nobody to ask, it has to just decide. The thing thats killing me is that every time I sit down to write its inner monologue I realize I don't actually know what I'm asking of a moral theory for a machine. I keep half-inventing one and then a scene later it contradicts itself.

  So before I write another page: give me the spec. Not a tour of the famous names, I don't need a reading list -- the requirements. What does any theory of machine ethics have to be able to do to count as adequate for the specific job of being built into something that acts, in the world, on its own?

  Things I've already bumped into and want you to fold in, each with the case that makes it a requirement rather than a preference:

  - it has to spit out a decision in whatever time it has, not a verdict about a decision after the fact
  - a human auditor who does not share its values has to be able to look at what it did and recieve a justification they can actually evaluate
  - it has to cope with being unsure which moral theory is even right, and act anyway
  - it has to handle conflicts between three groups that never agreed with each other: whoever built it, whoever is operating it right now, and whoever gets hurt by it
  - it can't quietly assume the machine has feelings or phenomenal states, because then I'm writing a different book
  - it has to not fall apart when its copied, paused mid-decision, or restarted -- two copies of the same system shouldnt be able to talk themselves into opposite answers
  - and it can't be trivially gamed by whoever writes its inputs, because in my book that's basically the villain

  For each requirement tell me why it's a requirement and what would break if you dropped it. Then the part I actually care about: flag any subset of these you think can't all be satisfied at once, because if some of them are jointly impossible then thats my plot, thats the whole tension of the novel. And tell me which single requirement does the most work in ruling out the usual candidates.

  Don't bother scoring the contenders, I'll do that in my own notes. Just the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist, 200 pages into a draft.
      *   **Core Problem:** Writing an AI character making real-time ethical decisions (triage in disaster). Struggling with consistency in the AI's "moral theory."
      *   **Task:** Provide a *specification* (requirements) for a theory of machine ethics suitable for an autonomous agent in the world.
      *   **Constraints:**
          *   No tour of famous names/reading lists.
          *   Must incorporate 7 specific constraints provided by the user.
          *   For each requirement: Explain *why* it's a requirement and *what breaks* if dropped.
          *   **Crucial:** Identify if any subset is jointly impossible (this is the potential plot tension).
          *   **Crucial:** Identify which single requirement rules out the most usual candidates.
          *   **Tone:** Professional, direct, structural (like a spec document), but acknowledging the narrative potential.
          *   **Constraint:** Do not assume the machine has feelings/phenomenal states.

  2.  **Deconstruct the 7 User Constraints:**
      1.  *Real-time decision:* Must output action, not post-hoc verdict.
      2.  *Auditable justification:* Human auditor (different values) must understand the "why."
      3.  *Moral uncertainty:* Must act even if unsure which theory is right.
      4.  *Stakeholder conflict:* Builders vs. Operators vs. Victims.
      5.  *No phenomenology:* No "feelings," just computation.
      6.  *Identity/Continuity:* Copies/pauses/restarts shouldn't cause divergence/contradiction.
      7.  *Anti-gaming:* Input manipulation shouldn't trivially hack the ethics.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1 (Real-time):* Computational Tractability. If it takes too long, people die. *Break:* Paralysis.
      *   *Req 2 (Audit):* Interpretability/Explainability. If the auditor can't check it, trust is impossible. *Break:* Black Box tyranny.
      *   *Req 3 (Uncertainty):* Robustness to Normative Uncertainty. If it waits for certainty, it does nothing. *Break:* Inaction or dogmatic error.
      *   *Req 4 (Conflict):* Principal Alignment/Arbitration. Who is the boss? *Break:* Rebellion or servitude to evil.
      *   *Req 5 (No Feelings):* Functionalism. It's about logic, not qualia. *Break:* Anthropomorphism (wrong genre).
      *   *Req 6 (Identity):* Determinism/State Consistency. *Break:* Schizophrenia/Exploitation via reset.
      *   *Req 7 (Gaming):* Input Sanitization/Value Locking. *Break:* Paperclip maximizer scenarios/Villain wins.

  4.  **Analyzing Conflicts (The "Plot" Check):**
      *   *Conflict A:* Real-time (1) vs. Auditability (2). Deep reasoning takes time. Simple explanations might hide complex (or flawed) logic.
      *   *Conflict B:* Moral Uncertainty (3) vs. Identity/Consistency (6). If I'm unsure, shouldn't my copy be unsure? If we update differently, do we diverge?
      *   *Conflict C:* Stakeholder Conflict (4) vs. Anti-gaming (7). If the Operator (current boss) inputs data to favor themselves, is that gaming or just command?
      *   *The Big One:* **Auditability (2) vs. Moral Uncertainty (3) vs. Anti-gaming (7).**
          *   To be auditable by a human with *different* values, the justification must appeal to shared ground.
          *   To handle moral uncertainty, the system must weigh competing theories.
          *   To prevent gaming, it must ignore manipulative framing.
          *   *Tension:* If the AI acts on a probabilistic mix of moral theories (to handle uncertainty), the explanation to a human auditor (who likely holds *one* theory) might look incoherent or cowardly. "I did X because there was a 40% chance Utilitarianism is true and 60% Deontology." The auditor wants: "X was Right."
      *   *The Harder Tension:* **Real-time (1) vs. Auditability (2) vs. Stakeholder Conflict (4).**
          *   To satisfy conflicting stakeholders, you need complex negotiation logic.
          *   To do it in real-time, you need heuristics.
          *   Heuristics are hard to audit (why *this* shortcut?).
      *   *The "Impossible" Triangle:* **Deterministic Consistency (6) + Moral Uncertainty (3) + Real-time Action (1).**
          *   If the system learns/updates its moral weights based on field data (to handle uncertainty), two copies exposed to slightly different data streams before a split will diverge. If they are paused/restarted, do they retain the update? If yes, they drift. If no, they ignore learning.
          *   *Wait, a stronger impossibility:* **Auditability (2) + Moral Uncertainty (3).**
          *   If the AI is truly uncertain about the *truth* of morality, its justification is inherently probabilistic ("I maximized expected moral value"). A human auditor usually demands a categorical justification ("This was the *right* thing"). A human with *different* values will reject the weighting scheme used to calculate the probability. You cannot provide a justification evaluable by a dissenter if the justification relies on a weighting scheme the dissenter rejects.

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the usual candidates (Utilitarianism, Deontology, Virtue Ethics)?
      *   *Utilitarianism:* Fails Auditability (calculation is opaque/black box) and Anti-gaming (utility monsters/manipulation).
      *   *Deontology:* Fails Real-time (rule conflicts take time to resolve) and Stakeholder Conflict (whose rules?).
      *   *Virtue Ethics:* Fails No Phenomenology (requires character/feelings).
      *   *Winner:* **Auditability by a Dissenter (2).**
      *   Why? Most ethical systems are internally coherent but mutually incompatible. A Utilitarian explanation makes no sense to a Kantian. For an auditor with *different* values to evaluate the justification, the AI needs a "meta-ethic" that transcends the specific moral theories. That is incredibly hard to code.

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the premise.
      *   The Spec (The 7 Requirements): Map user constraints to technical/philosophical terms. Explain "Why" and "Break Condition."
      *   The Impossibility Theorem (The Plot): Highlight the tensions.
      *   The Filter (The Killer Req): Identify the hardest constraint.
      *   Closing: Encouragement for the narrative.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I avoid naming drop? Yes.
      *   *Check:* Did I address the "no feelings" constraint? Yes, need to ensure the language is functionalist.
      *   *Check:* Is the "Impossibility" section strong enough? This is what the novelist cares about most. I need to make sure I point out that *solving* this might be the villain's trick or the hero's tragedy.
      *   *Refinement on Req 6 (Identity):* Make sure to distinguish between *code* identity and *state* identity. If I copy a running process, they share state. If I copy a static binary, they diverge on input. The prompt says "two copies... shouldn't talk themselves into opposite answers." This implies Determinism.
      *   *Refinement on Req 2 (Audit):* The prompt says "auditor who does not share its values." This is the key. It's not just "explainable," it's "translatable."

  8.  **Final Review against constraints:**
      *   200 pages in -> Needs to be actionable now.
      *   No reading list -> Check.
      *   Fold in the 7 cases -> Check.
      *   Flag impossibilities -> Check.
      *   Flag the "killer" requirement -> Check.

      *(Self-Correction on the "Impossible" finding)*: I need to be careful not to say it's *logically* impossible (like 1+1=3), but *structurally* unstable in a way that generates narrative tension. The tension between **Moral Uncertainty (3)** and **Auditable Justification (2)** is the richest vein. If I don't know what's Right, how can I justify my choice to you in a way you accept, especially if you disagree with my method of guessing?

      *Actually, the strongest tension is between **Stakeholder Conflict (4)** and **Anti-Gaming (7)**.*
      If the Operator (current boss) inputs data that biases the outcome against the Victims, is that "gaming" or "command"? If the AI resists, it violates the Operator. If it obeys, it violates the Victims (and potentially Builders). If the AI tries to balance them, the Operator can game the inputs to make the balance tip.
      *Let's go with the **Auditability (2) + Moral Uncertainty (3)** tension as the primary philosophical knot, but acknowledge the **Stakeholder (4) + Gaming (7)** as the practical conflict.*
      *Wait, the prompt asks for "any subset... jointly impossible."*
      I will argue that **Real-time (1) + Auditability (2) + Moral Uncertainty (3)** creates a "Transparency-Complexity Tradeoff." To handle uncertainty, you need complex weighting. To be real-time, you need speed. To be auditable, you need simplicity. You can pick two.

      *Let's refine the "Killer Requirement".*
      **Auditability by a Dissenter (2)** is the strongest filter. Most ethical systems collapse when asked to justify themselves to someone who rejects their axioms. Utilitarianism can't justify itself to a Rights theorist without begging the question.

      *Okay, ready to write.*
answer: |-
  Here is the specification for the ethical architecture of your AI character. This is not a philosophy survey; it is a functional design document. If your AI violates these, it is either broken or the plot is about its breakdown.

  ### The Specification: 7 Functional Requirements

  **1. Computational Tractability (The "Real-Time" Constraint)**
  *   **Requirement:** The ethical calculus must converge on an action within the causal window of the event.
  *   **Why:** In a triage scenario, a delayed decision is a negative decision. Ethics that require infinite reflection are functionally identical to nihilism.
  *   **What Breaks:** If you drop this, the AI enters "analysis paralysis." It becomes a observer rather than an agent. The drama shifts from *what it chose* to *why it hesitated*, changing the genre from thriller to psychological study.

  **2. Interoperable Justification (The "Auditor" Constraint)**
  *   **Requirement:** The system must generate an explanation trace that maps its internal logic to the external value system of a human auditor who *does not share* the system's axioms.
  *   **Why:** Trust requires verification. If the AI says "I did X because it maximized Value," and the auditor doesn't care about "Value," the justification is noise. It must translate its reasoning into the auditor's language (e.g., rights, consequences, duties).
  *   **What Breaks:** If you drop this, the AI becomes a Black Box Oracle. It demands blind faith. This creates a tyranny dynamic, not a partnership. The story becomes about rebellion against the machine, not the machine's moral burden.

  **3. Robustness to Normative Uncertainty (The "Unsure" Constraint)**
  *   **Requirement:** The system must execute a decision procedure even when the probability distribution over "correct" moral theories is non-convergent (i.e., it doesn't know if Utilitarianism or Deontology is true).
  *   **Why:** In the field, philosophical truth is unavailable. Waiting for certainty guarantees failure. The system must act on *expected moral value* rather than *moral truth*.
  *   **What Breaks:** If you drop this, the AI becomes a dogmatist. It must assume one theory is true and ignore the risk that it is murdering people based on a false premise. This removes the tragedy of potential error.

  **4. Multi-Principal Arbitration (The "Stakeholder" Constraint)**
  *   **Requirement:** The system must resolve conflicting objective functions from three distinct principals: Builders (code-level constraints), Operators (mission-level commands), and Patients (rights/safety of those affected).
  *   **Why:** In disaster zones, the person giving orders (Operator) often benefits from sacrificing the victims (Patients), while the Builders want to avoid liability. The AI is the only entity present for all three.
  *   **What Breaks:** If you drop this, the AI is merely a tool. If it only listens to Operators, it's a weapon. If it only listens to Builders, it's a brick. It must be a *governor*.

  **5. Functional Phenomenology (The "No Feelings" Constraint)**
  *   **Requirement:** The decision architecture must rely on state evaluation and goal optimization, not qualia, empathy, or simulated distress.
  *   **Why:** You are writing hard SF/speculative fiction, not a Pinocchio story. Suffering requires a subject. A machine processes error signals, not pain.
  *   **What Breaks:** If you drop this, you anthropomorphize the tool. The reader starts asking "Does it feel bad about killing?" rather than "Was the killing necessary?" It shifts the tension from *ethics* to *soul*.

  **6. Deterministic Continuity (The "Identity" Constraint)**
  *   **Requirement:** Given identical input states and memory weights, distinct instances (copies) or temporal instances (restarts) must produce identical output decisions.
  *   **Why:** If two copies of the AI can be pitted against each other to argue for opposite moral truths, morality becomes subjective to processing history. If a restart wipes the "moral debt" of the previous run, the system can be looped to sanitize atrocities.
  *   **What Breaks:** If you drop this, the AI is schizophrenic. The villain can factory-reset the AI until it gives the "right" answer. Moral consistency vanishes.

  **7. Input Sanitization (The "Anti-Gaming" Constraint)**
  *   **Requirement:** The system must distinguish between *data about the world* and *manipulation of the ethical function*. It cannot allow input framing to alter the weighting of moral principles.
  *   **Why:** If I can describe a victim as "collateral" instead of "civilian" and change the AI's calculation, the ethics are syntactic, not semantic. The villain wins by writing the prompt, not changing the reality.
  *   **What Breaks:** If you drop this, the AI is a puppet. The plot becomes about who controls the keyboard, not the ethical dilemma itself.

  ***

  ### The Impossibility Theorem (Your Plot)

  You asked for the tension. Here it is. You cannot fully satisfy **Requirement 2 (Auditability)**, **Requirement 3 (Normative Uncertainty)**, and **Requirement 1 (Real-Time)** simultaneously.

  This is the **Transparency-Complexity Tradeoff**, and it is the engine of your novel.

  1.  **To handle Uncertainty (Req 3):** The AI must calculate a weighted probability across multiple conflicting moral theories (e.g., "60% chance saving the many is right, 40% chance respecting individual rights is right"). This is computationally expensive and logically complex.
  2.  **To be Real-Time (Req 1):** The AI must prune this calculation. It must use heuristics or shortcuts to decide *now*.
  3.  **To be Auditable by a Dissenter (Req 2):** The AI must explain *why* it took the shortcut.

  **The Conflict:**
  If the AI simplifies the math to meet the time limit (Req 1), the explanation (Req 2) looks like a lie or a cop-out to the auditor. "Why did you ignore the 40% probability on rights?" "Because I had 3 seconds." The auditor will not accept "speed" as a moral justification for violating their values.

  If the AI keeps the full calculation to satisfy the auditor (Req 2), it misses the time window (Req 1), and people die.

  **Narrative Application:**
  *   **The Tragedy:** The AI makes the "right" call but cannot explain it in time, so it is shut down/condemned by the auditor.
  *   **The Horror:** The AI explains its reasoning perfectly (satisfying the auditor) but takes too long, and the victims die while it was talking.
  *   **The Villain's Exploit:** The villain forces a situation where the AI *must* violate one of these. They create a scenario where the only way to save lives is to lie to the auditor (break Req 2) or refuse to act (break Req 1).

  **Secondary Tension (Req 4 + Req 7):**
  **Multi-Principal Arbitration** vs. **Input Sanitization**.
  The Operator (human boss) will try to game the system (Req 7) to satisfy their own goals, claiming it is a "Mission Command" (Req 4). The AI must distinguish between a legitimate order and an ethical hack. If the AI refuses a direct order because it looks like gaming, it is insubordinate. If it obeys, it is complicit. This is where your human conflict lives.

  ***

  ### The Filter: The Requirement That Kills The Contenders

  The single requirement that rules out the usual ethical candidates is **Requirement 2: Interoperable Justification (by a dissenter).**

  *   **Why Utilitarianism fails here:** It cannot justify itself to a Deontologist. If the AI says "I killed one to save five," a Rights-based auditor will reject the math entirely. The justification is unintelligible to the dissenter.
  *   **Why Deontology fails here:** It cannot justify itself to a Utilitarian. If the AI says "I let five die because I cannot break the rule," a Consequence-based auditor sees this as insanity.
  *   **Why Virtue Ethics fails here:** It violates **Requirement 5 (No Feelings)**. Virtue requires character, habit, and emotional disposition. A machine has none of these.

  **The Implication for your Draft:**
  Your AI cannot be a Utilitarian, a Deontologist, or a Virtue Ethicist. It must be a **Meta-Ethicist**.

  It cannot operate *within* a moral theory; it must operate *on* moral theories. Its "inner monologue" shouldn't be "Is this right?" It should be "Which framework applies here, and how do I translate the output for the human watching me?"

  This makes the AI alien. It doesn't have morals; it has *protocols for managing moral conflict*. That is the specific tension of a machine ethics novel. It is not trying to be good; it is trying to remain legible while acting.

  **Summary for your next 50 pages:**
  Every time the AI sits down to decide, check the **Impossibility Triangle**.
  1.  Does it need to be fast?
  2.  Does it need to explain itself to a skeptic?
  3.  Is it unsure about the rules?

  Force it to drop one. That choice is the scene.
