answer: |-
  Thomas Hobbes is showing a skeptical Oxford don around his study. He picks up an apple from the desk.

  "In natural philosophy," Hobbes says, "I am blind. God made this apple. I only bump into the effects. I can never truly know the cause."

  He puts the apple down and picks up a compass.

  "But in geometry," Hobbes continues, "I am God. I define the point. I generate the line. I know the truth because I manufactured it. We demonstrate only because we make."

  The don clears his throat. "Even, sir, with the circle you squared? John Wallis says the math simply doesn't hold."

  Hobbes stiffens. "Wallis *looks* at circles. He measures effects. I *construct* them. If my construction says it is square, then in the only science that matters, it is square. I know the cause because I held the pen."

  "And *Leviathan*?" the don presses. "You claim to construct a Commonwealth the same way. Define the subjects, draw the Sovereign, deduce the peace."

  "Precisely," says Hobbes. "I have drawn the perfect state. The lines are straight. The angles are sound."

  "Then why is England bleeding?"

  Hobbes dips his quill, visibly annoyed. "Because the subjects are refusing to stay inside the ink. They keep acting like they have causes of their own. I keep telling them: if you would just admit you're geometric figures, the war would end. But no—they insist on being *physical things*."

  He goes back to his drawing board.

  "Now, if you'll excuse me, I need to fix this arc. It looks too round."
