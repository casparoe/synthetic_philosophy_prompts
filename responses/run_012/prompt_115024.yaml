answer: |-
  Your friend's retreat to the spreadsheet is a classic technocratic defense mechanism: if you treat the contradiction as a philosophical problem, you can't solve it with a regression analysis. But you are right to press the point. The policy bundle you describe is not philosophically neutral. It is a specific, somewhat fragile, moral architecture disguised as fiscal management.

  Here is the reconstruction of the implicit theory of value, the coherence of the bundle, and what happens if you pull the philosophical threads.

  ### 1. The Core Theory: National Perpetuation, Not Universal Welfare

  The bundle does not presuppose that "people are good" in a universal utilitarian sense. If it did, immigration restrictions and emissions caps (which limit the carrying capacity for people) would be immoral. Nor does it presuppose that "fewer people are better" in an antinatalist sense, or the pronatalist subsidies wouldn't exist.

  The implicit theory is **National Continuity**.

  Under this view, the *specific* population of *this* polity is a value-bearing entity that must persist through time.
  *   **Pronatalism** is not about maximizing global happiness; it is about ensuring the *survival of the specific cultural/fiscal project* of the nation.
  *   **Immigration Restriction** signals that the *identity* of the contributors matters as much as their tax contributions. A foreign worker might solve the pension arithmetic, but they do not solve the "national continuity" equation.
  *   **Emissions Targets** act as a boundary condition. They signal that the nation must persist *within* a specific ecological niche without collapsing the system that sustains it.

  **Is population growth intrinsic or instrumental?**
  It is both, but hierarchically.
  1.  **Instrumentally:** People are tax bases required to fund the legacy costs (pensions) of the existing members.
  2.  **Intrinsically:** The nation itself is viewed as an intergenerational community. Its extinction (via demographic collapse) is treated as a harm *to the nation*, even if no specific living person experiences the death of the nation.

  This explains the coherence. The state is not trying to maximize *People*; it is trying to maximize *This People* within *These Ecological Limits*. The contradiction dissolves if you view the nation as a club that wants to stay open indefinitely (requiring new members) but doesn't want to overcrowd the clubhouse (emissions) or let in non-members (immigration).

  ### 2. The Pension Arithmetic: Smuggled Values

  You asked if the pension design presupposes that each generation will outnumber the last.

  **Strictly Arithmetic:** No. A Pay-As-You-Go (PAYG) system requires that `(Workers × Productivity × Tax Rate) ≥ (Pensioners × Benefit Level)`. You can maintain this with a shrinking population *if* productivity grows faster than the dependency ratio rises, or if benefits are cut.

  **Politically/Philosophically:** Yes. The system was built on the **Implicit Contract of Growth**. When these systems were designed (mid-20th century), demographic expansion was treated as a law of nature, like gravity. By locking in benefit formulas based on that assumption, the state effectively smuggled a **demographic value judgment** into law: *Future generations will be larger and richer, and they will accept this burden.*

  Defending the system now without admitting the error requires a moral claim: **Intergenerational Reciprocity.** The state argues that children are not just taxpayers but debtors to the system that raised them. This is a strong communitarian claim. It rules out the rival view that each generation starts with a blank slate and owes nothing to the previous one.

  ### 3. The Asymmetry: Born vs. Never Was

  You noted that the state subsidizes the child who might be born but never mourns the child who never was. This is a direct application of the **Non-Identity Problem** (famously articulated by Derek Parfit).

  *   **The Logic:** If you subsidize a birth, you create a specific person who now exists and can be happy. If you *don't* subsidize, that specific person never exists. You cannot say the non-existent person is "worse off" because there is no "them" to be worse off.
  *   **The Policy Implication:** The state operates on a **Threshold Theory of Moral Status**. You have claims on the ministry only once you are a potential member (conceived/national). The "never was" has no identity, therefore no claim.
  *   **Why the Subsidy?** The subsidy isn't for the *child's* sake (strictly speaking); it's for the *parents'* sake (lowering the cost of their choice) and the *state's* sake (securing the future tax base). The state treats the birth as a **positive externality** for the fiscal system, not necessarily a benefit to the soul of the universe.

  ### 4. The Seminar Puzzle: The Repugnant Conclusion

  The puzzle your seminar mate mentioned is Parfit's **Repugnant Conclusion**.

  *   **The Setup:** Imagine World A has 1 billion people with extremely high quality of life. World Z has 100 billion people with lives that are *barely* worth living (just above the threshold of suffering).
  *   **Total Utilitarianism:** If value is the *sum total* of happiness, World Z is better than World A (because 100 billion × tiny positive number > 1 billion × huge positive number).
  *   **The Intuition:** Most people find this repugnant. We don't want a world of crowded misery just because the "total happiness units" are higher.

  **Relevance to your Bundle:**
  If your government were a pure Total Utilitarian, it would remove emissions caps and immigration bans to maximize the number of taxpayers/people, even if living standards dropped.
  The fact that they keep emissions caps and brag about "quality of life" metrics suggests they are **Average Utilitarians** (maximize welfare *per capita*) regarding the environment, but **Total Utilitarians** (maximize raw numbers) regarding national survival.

  **The Drift:** The danger your friend hinted at is that the fiscal pressure (need more taxpayers) pushes toward the Repugnant Conclusion (more people, lower resources per person), while the environmental pressure pushes the other way. The bundle stays coherent only if they believe in **Technological Decoupling**: the faith that we can have more people *and* higher per-capita welfare without exceeding emissions caps. If that faith is wrong, the bundle collapses.

  ### 5. Underdetermination: Where Practice Rules Out Rivals

  You asked where the practice is underdetermined (could fit multiple theories) and where it rules views out.

  **Underdetermined (The "Spreadsheet" Zone):**
  *   **Daycare Subsidies:** These could be justified by feminism (women's labor participation), utilitarianism (happy kids), or nationalism (more babies). The check looks the same either way.
  *   **Emissions Targets:** These could be global altruism or local self-preservation (avoiding climate migration floods).

  **Ruled Out (The "Philosophical" Zone):**
  *   **Cosmopolitanism:** The bundle explicitly rejects the idea that a baby born abroad is as valuable as a baby born domestically. If the goal were just "solvencies the pension," open borders would be the most efficient policy. Restricting immigration while subsidizing births proves the value is **National Identity**, not just Fiscal Solvency.
  *   **Person-Affecting Utilitarianism:** (See below).
  *   **Antinatalism:** The state clearly views non-existence as a fiscal loss, ruling out the view that coming into existence is a harm.

  ### 6. The Person-Affecting Swap

  Finally, let's swap the presupposed view for a strict **Person-Affecting View**.
  *   **Definition:** An outcome can be better or worse only if there is *someone* for whom it is better or worse. "You cannot harm someone by bringing them into existence (unless their life is miserable), because the alternative for them is non-existence."

  **What changes in the policy bundle?**

  1.  **Pronatalism Collapses:** You can no longer justify birth grants by saying "it creates a happy person." (Because that person wouldn't exist to complain if they weren't created). You could only justify it if it makes *existing* people (the parents) happier. The "national survival" argument vanishes, because "the nation" is not a person.
  2.  **Prenatal Screening:** This becomes ethically fraught. If you screen out a fetus with a disability, a strict person-affecting view asks: "Did you harm the fetus?" If the alternative was non-existence, and the life with disability is still worth living, the answer is "No." But the policy assumes it *is* better to not be born with certain conditions. This implies a **Non-Identity** acceptance (we are making choices about *who* will exist, not just welfare for existing people).
  3.  **The Pension System:** This is the big one. **The PAYG pension would not survive the swap.**
      *   *Why?* A PAYG system is a claim on *future* people. Under a person-affecting view, future people do not exist yet. You cannot have a contract with non-entities.
      *   Furthermore, if you cannot argue that bringing future taxpayers into existence is a "good" that benefits the system (only that it benefits current parents), the moral obligation for the next generation to pay for the current one weakens.
      *   *The Fix:* The system would have to move to **Full Funding** (individual savings accounts). You save for your own old age; you don't claim a right to the labor of children who don't exist yet.

  ### Summary for your Friend

  Tell her the spreadsheet assumes a **Perpetual National Enterprise** model.
  *   **Value:** The continuity of the specific polity is an intrinsic good.
  *   **People:** Are instrumental assets (taxpayers) required to maintain that continuity, but only if they are the "right" people (nationals).
  *   **Contradiction:** Resolved by faith in decoupling (tech solves emissions) and identity (immigrants don't count as continuity).
  *   **Vulnerability:** If productivity stagnates *and* identity politics block immigration, the arithmetic breaks.
  *   **Philosophical Cost:** It relies on the **Non-Identity Problem** to justify creating new debtors (children) to pay old creditors (pensioners), while refusing to acknowledge that the "never-born" are the only ones who could theoretically object to the debt.

  Her ministry presupposes that the Nation is a person that can be harmed by death, even though the Nation is not a person that can feel pain. That is the theology hidden in the actuarial tables.
