      If Info is asymmetric, Buyer fears Card Value < Price.
      Okay, the logic holds.

      *Wait, one nuance:* To make the "No Trade Theorem" hit hard, there needs to be a *potential* gain from trade initially (e.g., Buyer values asset at 1.2x Seller). Otherwise, why trade at all?
      *Adjustment:* Let's add a "Synergy" rule.
