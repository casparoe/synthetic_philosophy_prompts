      *   *Unraveling:* Buyer offers $5. Sellers with 1-5 sell (Value to seller 1-5, Value to buyer 3-7).
      *   Average card sold = 3. Buyer pays 5, gets value 5 (3+2). Break even.
      *   Actually, let's keep it even simpler for HS. Just "Card Value" is the payout.
