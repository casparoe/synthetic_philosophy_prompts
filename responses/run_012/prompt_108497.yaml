answer: |-
  **Research Proposal: The Norm of Acquaintance and the Asymmetry of Aesthetic Testimony**

  **Project Title:** Verdicts vs. Guidance: Locating the Constraint on Aesthetic Assertion

  **Research Question**
  Does the asymmetry between testimonial verdicts (e.g., "This film is a masterpiece") and testimonial guidance (e.g., "Attend to the lighting in this scene") demonstrate that the prohibition on aesthetic testimony is a pragmatic norm of assertion requiring acquaintance, rather than an epistemic constraint on knowledge transmission?

  **Background and Motivation**
  Current debates regarding aesthetic testimony are structured around a binary: either testimony can transmit aesthetic knowledge (optimism) or it cannot (pessimism). Both sides operate under the assumption that the primary barrier to asserting an aesthetic judgment on the basis of testimony is the possession of justification or knowledge. Consequently, the literature focuses on whether the psychological state required for aesthetic knowledge can be caused by another speaker.

  This framing leaves a crucial phenomenon unexplained: the intuition of "hollowness" persists even in cases where a subject seems to have reliable information about a work. My preliminary analysis suggests that standard positions leave the question open because they conflate the conditions for *knowing* with the conditions for *judging*. If the problem were purely epistemic, successful transmission of justification should license assertion. However, if the problem is pragmatic—specifically, that aesthetic judgments function as avowals presupposing first-hand acquaintance—then one might possess justification via testimony yet still lack the license to assert a verdict. The proposed project tests this by isolating the variable of acquaintance through the distinction between verdicts and guidance.

  **Methodology and Work Plan**
  The project will proceed over one semester (15 weeks) in four phases, aiming to produce a single journal-article-length chapter (approx. 8,000 words).

  *   **Weeks 1–4: Conceptual Mapping.** I will rigorously define the distinction between *verdicts* (evaluative summaries) and *guidance* (directives for perception). I will construct a set of paired case studies (film, music, literature) where a subject receives only verdicts versus only guidance via testimony. The goal is to isolate the specific intuition of hollowness to the verdict category.
  *   **Weeks 5–8: Epistemic Testing.** I will analyze whether testimonial guidance successfully transmits epistemic justification. If a subject follows guidance and perceives the feature, do they know the work is good? If guidance allows the subject to form a justified belief based on their own perception (facilitated by testimony), this suggests testimony *can* support knowledge, undermining the strict epistemic pessimist view.
  *   **Weeks 9–12: Pragmatic Analysis.** I will develop the "Norm of Acquaintance." Using the avowal analogy, I will argue that aesthetic verdicts carry a conversational presupposition that the speaker has experienced the object. Violating this norm renders the speech act infelicitous (hollow) regardless of the truth or justification of the belief. I will contrast this with standard knowledge norms of assertion.
  *   **Weeks 13–15: Synthesis and Drafting.** I will integrate the findings to answer the research question. The draft will argue that the pessimist's intuition is correct about assertion but incorrect about knowledge. The conclusion will redefine the scope of the testimony debate, shifting focus from epistemology to the norms of aesthetic practice.

  **Success and Failure Conditions**
  *   **Success:** The project succeeds if I can demonstrate a stable asymmetry: subjects accept guidance-based testimony as leading to understanding/knowledge but reject verdict-based testimony as licensing assertion. Furthermore, I must show that the "avowal" model explains this asymmetry better than the "epistemic deficit" model.
  *   **Failure:** The project fails if (a) the asymmetry cannot be sustained (i.e., guidance feels equally hollow), or (b) the asymmetry exists but is better explained by a hidden epistemic deficit in guidance cases (e.g., guidance doesn't actually transmit justification either), or (c) the "avowal" model proves too restrictive, ruling out legitimate forms of aesthetic discourse (e.g., teaching, criticism) that rely on verdicts without immediate acquaintance.

  **Timeline Feasibility**
  This scope is appropriate for a one-semester chapter. It avoids the trap of attempting to solve the entire testimony debate, focusing instead on a specific diagnostic test (the asymmetry). The risk lies in Weeks 5–8; proving that guidance transmits justification requires careful handling to avoid conceding that the subject is really just forming their own judgment (which would weaken the testimony angle). I will mitigate this by focusing on the *dependency* of the subject on the testifier for the perceptual route. If the timeline slips, I will restrict the case studies to film and music to ensure depth over breadth.

  ***

  **Personal Note**

  To you:

  I am roughly 75% confident in the substantive claim that the "hollowness" intuition is pragmatic rather than epistemic. The avowal analogy feels robust; it captures the social friction of repeating a critic's verdict in a way that mere lack of knowledge does not. It explains why we feel someone is "out of line" rather than simply "mistaken."

  The single point I am least sure of is the status of *guidance*. In the proposal, I treat guidance as a form of testimony that transmits justification. However, there is a risk that guidance isn't testimony at all, but rather a tool that enables *your own* perception. If guidance merely helps you see what is there, then the knowledge you gain is perceptual, not testimonial. If that's true, the asymmetry doesn't prove that testimony is pragmatically restricted; it just proves that verdicts require perception while guidance enables perception. I need to be careful not to conflate "testimony that enables perception" with "testimony that justifies belief." If I can't show that guidance carries testimonial weight itself, the epistemic leg of the argument wobbles. I think there's a way to argue that the *selection* of features is testimonial, but that needs tighter work than I have given it so far.
