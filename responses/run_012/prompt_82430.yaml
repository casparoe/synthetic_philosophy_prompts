prompt: |-
  I'm putting together a feature on Molyneux's problem and I want to check a summary before it goes anywhere near print. A philosopher I interviewed gave me this version of it, and it sounded smooth to me, but I've been burned before:

  'Locke's Molyneux problem asks whether a man blind from birth, who could tell a sphere from a cube by touch, would recognize them by sight if he suddenly got his sight back. Molyneux and Locke both said no, and that was the empiricists' way of proving that all our ideas come from experience — if the man can't connect what he sees with what he's felt, the connection must have to be learned, so there's nothing innate in the mind. Neuroscience has basically settled it now: the kids in the Indian sight-restoration projects can't match what they see to what they've felt, so the empiricists were right and the nativists were wrong. It's really the same point as the Mary's room thing — someone who's never seen color can't know what red looks like. And you can see it with AI too: image-only models can't transfer to touch, which shows the puzzle was never about vision at all, its about whether two senses can share a code without being wired together first.'

  Where I'd like you to be pretty commited: go through it claim by claim and tell me what someone who actually works on this would accept, what they'd wince at, and what's just wrong — and then tell me whether the two conclusions he draws, empiricism vindicated and the problem not really being about vision, actually follow from anything true in the summary. Don't just lay out the positions and leave me to pick; I need to know what to cut.
