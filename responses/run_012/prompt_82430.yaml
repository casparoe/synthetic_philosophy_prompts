      *   *Claim 4:* "Neuroscience has basically settled it now: the kids in the Indian sight-restoration projects can't match what they see to what they've felt..."
          *   *Assessment:* Refers to Project Prakash (Held et al., 2011). The results *did* show an initial inability to match. However, "settled it now" is too strong. It's one data point, and the interpretation is debated (e.g., is it visual acuity, attention, or conceptual mapping?). But generally, the empirical data supports the "No" answer initially.
      *   *Claim 5:* "...so the empiricists were right and the nativists were wrong."
