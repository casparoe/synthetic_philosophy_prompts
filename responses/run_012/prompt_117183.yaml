  **Speech**

  Good morning. For those who don't know me, I'm a friend of Dara's. Usually, when someone asks you to speak at their citizenship ceremony, they want you to talk about journeys. They want you to talk about dreams, about flags, about the warm feeling of belonging.

  But Dara is a political philosopher. And if there is one thing Dara has taught me over ten years of friendship, it is that warm feelings are often where critical thinking goes to die. She has spent a decade arguing that patriotism is morally suspicious. She is standing here today not because she suddenly loves this country, but because she wants the legal standing to complain about it effectively. So, if I stand here and tell you that you should feel a special love for this land just because you drew a lucky visa lottery, Dara will roll her eyes, and honestly, she'd be right to.

  The luck is real. Where we are born is an accident. Why should an accident demand our loyalty? And if we give that loyalty, does it mean we care less about the suffering of people outside these borders? That isn't virtue; that's tribalism with a nice name.

  But I've been thinking about what Dara is actually doing today. It isn't falling in love. It's signing a lease.

  There is a difference between loving a house and being responsible for its maintenance. You don't have to love the plumbing to admit that when it leaks, it's your job to fix it. Citizenship, I think, is less about warmth and more about answerability. It is the willingness to stand up and say, "This project is now mine. The failures here are my failures to address. The successes are my responsibilities to protect."

  That doesn't erase the arbitrariness. You still got here by luck. But luck hands you tools, and this paperwork hands you leverage. You are not on the hook for the sins of the past. You didn't build the house before you arrived. But you are on the hook for what happens to it next. You don't inherit the guilt of history, but you do inherit the duty of repair. That is not a vice. That is the only way anything ever gets fixed.

  And that brings me to something else. I know many of you left families behind. Dara's mother is here today. Thirty years ago, she left her own home. She still tears up when she hears her native anthem. For a long time, I wondered if that tears divided her loyalty. If you love there, can you be responsible here?

  I think the answer is yes. Because this isn't a marriage. It's not exclusive. You can hold a promise to more than one place. Your heart is not a pie that runs out when you slice it. Your mother's tears for the country she left do not subtract from the work she did in the country she joined. They are proof that she knows what it costs to build a life.

  So, to Dara, and to all of you: Welcome. Not to the fan club. But to the maintenance crew. You have the right to complain, the duty to argue, and the power to vote. Use them. Don't do it because you love the flag. Do it because you are now accountable for what happens beneath it.

  Enjoy the cake in the lobby. It's sweet. But the work starts Monday. Thank you.

  ***

  **Note on Claims**

  By framing patriotism as answerability rather than affection, you are committing to the claim that political membership is a voluntary assumption of responsibility for collective outcomes rather than an inherent identity. You are also asserting that this responsibility is strictly forward-looking (focused on repair and maintenance) rather than backward-looking (culpability for historical wrongs), and that partiality toward compatriots is justified only by proximity and leverage, not by intrinsic moral superiority.
