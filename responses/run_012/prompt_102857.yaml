  Here are three angles I brainstormed based on your constraints, thinking through the game-theoretic machinery:

  1.  **The Explicit Contract:** Someone tries to make the unwritten rule written by sending an email chain. The joke is that once you make it explicit, it's no longer a Lewisian convention (which relies on tacit mutual expectations) but a social contract, and the department rebels because the "arbitrariness" feels lost when codified.
  2.  **The Light Switch Regress:** At the end of the night, two people leave together. Both want the other to be "last" so they can kill the light. They end up locking the door with the lights on, violating the regularity because the preference structure shifted from coordination to deference.
  3.  **The Simultaneous Arrival (The Courtesy Trap):** Two people arrive at the door at the exact same time. The convention says "first person in opens blinds." But if both are too courteous to claim "first," the ordering condition fails. The convention collapses because the common knowledge of who acts first cannot be established, turning a solved coordination problem back into an unsolved one.

  Angle #3 is the strongest because it directly targets the "equilibrium-selecting" requirement and the infinite regress of expectations. Here is the joke, polished for the reading group:

  ***

  You know the unwritten rule in our department: first person in opens the blinds, last person out kills the light. It's a classic Lewisian convention—arbitrary, stable, sustained by mutual expectations.

  Yesterday, though, I arrived at the seminar room at the exact same time as a colleague. The blinds were closed. I gestured for him to enter first. He gestured for me to enter first.

  We stood there for five minutes.

  Someone eventually asked what we were doing. I said, "We're stuck in a polite shuffle."

  He corrected me: "No, we're not in a shuffle. We're in a preference mismatch. The convention only holds because we prefer to conform *conditional* on the other conforming. But today, we both preferred the *other* to act *unconditionally*.

  "We didn't just fail to open the blinds. We proved that a norm that isn't equilibrium-selecting never stabilizes. The common knowledge couldn't do the load-bearing work once we stopped trying to coordinate and started trying to be nice. We weren't being polite; we were dismantling the Nash equilibrium of the blinds."

  So the seminar started in the dark. Next week, we're drawing straws. It's the only way to restore the arbitrariness.
