answer: |-
  Here is a paraphrase of the passage to ground us, followed by the unpacking you're asking for. I'll skip the textbook gloss and go straight to the friction points you've identified, because you're right: this is where Aquinas is doing his heaviest lifting, and it's easy to miss the gear-shift between the two parts.

  ### Paraphrase of the Text
  Aquinas divides trading into two perspectives. **First**, looking at trade *in itself*: it's meant for mutual benefit. Justice requires equality. Money measures the value of things based on their human utility. If price and value aren't equal, justice is broken. So, selling above intrinsic worth is inherently unjust. **Second**, looking at trade *accidentally* (due to specific circumstances): one party might need the thing badly, while the seller loses something by parting with it. Here, the just price isn't just the thing's value; it includes compensation for the seller's loss. You can charge more than the thing's intrinsic worth to cover your loss, but you can't charge more than the thing is worth *to you* (the owner). Crucially, you cannot raise the price just because the *buyer* gains a huge advantage; you can only charge for your own loss.

  ***

  ### Unpacking the Distinction

  You've spotted the exact hinge where most students get stuck. Aquinas is trying to balance an objective theory of value with the reality of subjective need without collapsing into "whatever the market bears." Here is how the machinery works.

  **(a) What is "worth" in the first part?**
  In the first section ("considered in themselves"), "worth" (*valor*) is **not** an intrinsic metaphysical property like weight or color. When Aquinas says the quality is "measured by the price given for it," he is pointing toward what later scholastics called the *communis aestimatio* (common estimation). It is the objective utility of the object *as recognized by the community*.
  *   **Why this matters:** It prevents the seller from saying, "This bread is worth $100 to *me* because I like it." In the first framework, worth is social and stable. If the market generally agrees a loaf is worth $1, selling it for $5 violates the "equality of thing and thing." This is the baseline: trade is a cooperative exchange of equivalents, not a contest of wits.

  **(b) "Loss" vs. "Advantage" in the second part**
  This is the critical pivot. You asked why the second case allows selling above worth when it looks like the prime spot for exploitation.
  *   **The Seller's Loss (*damnum emergens*):** Aquinas is distinguishing between the *object's value* and the *owner's deprivation*. If I sell you my only coat in winter, I lose the use of the coat. That loss has a price. Aquinas permits the seller to recoup that loss. The price can exceed the coat's "intrinsic" market value because it now includes the cost of the seller's sacrifice.
  *   **The Buyer's Advantage (*utilitas*):** Conversely, if you are freezing and *need* the coat, that advantage belongs to *you*, not me. Aquinas explicitly blocks monetizing the buyer's desperation ("the advantage accruing to the buyer, is not due to the seller").
  *   **The Difference:** You are permitted to charge for what you *lose* (your deprivation), but not for what the other person *gains* (their relief). This is why the text feels slippery: it allows price to float above "market value" but anchors it to "seller's loss" rather than "buyer's need."

  **(c) The clause: "though the price paid be not more than it is worth to the owner"**
  This is the cap that prevents the "loss" argument from becoming a loophole.
  *   **The Work It Does:** It sets a ceiling. Even if I suffer a loss by selling, I cannot charge you more than the total value the item held *for me*.
  *   **Example:** If a painting is worth $100 on the market, but worth $500 to me sentimentally, and selling it causes me $500 of "loss" (deprivation), I can charge up to $500. I cannot charge $600. This clause ensures the transaction remains a compensation for loss, not a profit opportunity disguised as loss. It keeps the focus on *restitution* for the seller, not *extraction* from the buyer.

  ***

  ### Application: The Hurricane Water Case

  Does this framework give a determinate answer on the $20 bottle of water? **Yes, mostly, but it depends on the shopkeeper's inventory situation.**

  1.  **The Baseline:** Under Part 1, if water is normally $1, charging $20 violates the "equality of thing and thing." The intrinsic worth (common estimation) hasn't changed; the water is the same.
  2.  **The "Loss" Exception (Part 2):** Can the shopkeeper claim a "loss"?
      *   **No Loss:** If the shopkeeper has a full warehouse and selling a bottle doesn't deprive him of future use or safety, he suffers no *damnum*. He is merely capitalizing on the buyer's "great advantage" (thirst). Aquinas explicitly forbids this: "the latter ought not to raise the price, because the advantage accruing to the buyer, is not due to the seller." **Verdict: Unjust.**
      *   **Real Loss:** If the shopkeeper is selling from his own emergency储备 (reserves), or if bringing the water to the store involved extraordinary risk/cost (e.g., driving through a storm), that risk/cost counts as "loss." He can charge enough to cover that risk. **Verdict: Potentially Just, but capped.**
  3.  **The Cap:** Even with risk, he cannot charge more than the water is "worth to the owner." If the water is just stock, its worth to him is its replacement cost. $20 likely exceeds this unless the replacement cost has genuinely skyrocketed due to supply chain breakage (which would change the *communis aestimatio* in Part 1 anyway).

  **Conclusion:** Aquinas generally condemns price gouging in this scenario unless the seller can prove a specific, personal deprivation or risk that justifies the markup. Exploiting the buyer's need is strictly prohibited.

  ***

  ### Where the Argument Equivocates

  You sensed slipperiness, and you were right. Here is where the text wobbles:

  1.  **"Worth" (*Valor*):** In Part 1, worth is objective/common. In Part 2, worth becomes subjective ("worth to the owner"). Aquinas doesn't fully explain how to adjudicate when these conflict. If "worth to the owner" is too subjective, the prohibition on gouging collapses (every seller can claim high subjective worth).
  2.  **"Loss" (*Damnum*):** Does "loss" include *opportunity cost*? If I sell this bottle, I can't sell it tomorrow at a higher price. Is that a "loss"? Aquinas implies "loss" is deprivation of use, but later commentators expanded this to include lost profit, which arguably undermines his ban on charging for the buyer's advantage.
  3.  **"Advantage" (*Utilitas*):** In Part 1, advantage is mutual. In Part 2, it's asymmetric. The text assumes we can neatly separate "buyer's gain" from "seller's loss," but in a crisis, the seller's "loss of security" and the buyer's "gain of survival" are often two sides of the same coin. Aquinas insists they are morally distinct, but economically they are entangled.

  **Summary for your seminar:** Aquinas isn't giving you a formula for calculating price; he's giving you a moral topology. He draws a bright line between **compensation for sacrifice** (permissible) and **profit from necessity** (impermissible). The $20 water fails unless it represents a genuine sacrifice, not just a market opportunity.
