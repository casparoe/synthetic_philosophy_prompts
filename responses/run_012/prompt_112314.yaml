answer: |-
  # Facilitator's Plan: The Integrity Market

  **Class:** Graduate Seminar in Moral/Political Philosophy
  **Time:** 90 Minutes
  **Students:** 14
  **Goal:** Simulate the tension between "gains from moral trade" and "constitutive commitments" without using philosophical terminology until the debrief.

  ## I. Setting and Materials

  **Room Setup:**
  *   One large table or clustered desks.
  *   Whiteboard divided into five columns labeled **Proposal A, B, C, D, E**.
  *   Proposals should be abstract but distinct (e.g., *A: Security Expansion, B: Privacy Protection, C: Wealth Redistribution, D: Cultural Preservation, E: Innovation Deregulation*).

  **Materials (Prepared in 14 Envelopes):**
  1.  **Identity Card:** States a "Core Commitment" (e.g., "I am a Privacy Absolutist") and a "Secondary Interest" (e.g., "I want Innovation").
  2.  **Vote Tokens:** 3 wooden chips per student.
  3.  **Scorecard:** A simple grid to track "Points."
  4.  **Trading Log:** A slip of paper to record agreements.

  **The Hidden Mechanic:**
  *   Each Proposal is "Locked" to a specific Core Commitment.
  *   *Rule:* You only earn points for a Proposal if it passes **AND** your vote on that Proposal did not contradict your Core Commitment.
  *   *Crucial:* Students do **not** know this rule in Round 1.

  ## II. The Sequence of Rounds

  ### Round 1: The Naive Market (20 Minutes)
  **Objective:** Establish the intuition of Pareto improvement (gains from trade).

  1.  **Distribution:** Hand out Envelopes. Tell students: "You are Delegates. Your goal is to maximize your Score. Your Score is 1 point for every Proposal that passes which matches your 'Secondary Interest.' You have 3 Vote Tokens. Each Proposal requires 8 Tokens to pass."
  2.  **Instruction:** "Trade your tokens. If you don't care about Proposal A, sell your vote on A to someone who does, in exchange for votes on B. You may make binding agreements."
  3.  **Action:** Students mill about, trading tokens. (e.g., A Privacy person sells their Security vote to a Security person in exchange for a Privacy vote).
  4.  **Tally:** Count tokens on the board. Declare which Proposals passed. Students calculate scores.
  5.  **Expected Outcome:** Most students secure their Secondary Interest through trade. The room feels cooperative and efficient. Ask: "Did anyone end up with fewer points than if you had kept your tokens?" (Likely no).

  ### Round 2: The Constitutive Audit (20 Minutes)
  **Objective:** Reveal the modularity problem (the "dissolving ground").

  1.  **Rule Change:** "We have discovered an error in the scoring system. Your 'Secondary Interest' is only valuable if it rests on your 'Core Commitment.' Look at your Identity Card."
  2.  **The Constraint:** "If you voted *in favor* of a Proposal that contradicts your Core Commitment (even to get something else), your Score for *all* passed Proposals is reduced to zero. You have compromised the ground of your valuing."
      *   *Example:* If your Core is "Privacy Absolutist," and you sold a vote to pass "Security Expansion," your Privacy win is now worthless to you.
  3.  **Action:** Students review their Round 1 Trading Logs against their Identity Cards.
  4.  **Tally:** Recalculate scores.
  5.  **Expected Outcome:** Many scores plummet to zero. The "gains" from Round 1 are revealed to be illusory for those who traded inconsistently. The room should feel frustrated or confused.
  6.  **Prompt:** "You have the goods you wanted, but you no longer qualify to value them. Discuss in pairs: Was the trade a mistake?"

  ### Round 3: Adaptive Preferences (20 Minutes)
  **Objective:** Demonstrate the incentive to inflate/radicalize positions (strategic misrepresentation/endogeneity).

  1.  **Rule Change:** "You may now rewrite your Identity Card. You can change your Core Commitment to match the votes you actually cast. However, there is a cost: For every word you change, you lose 0.5 points from your final score (The 'Integrity Tax')."
  2.  **Incentive:** Students realize they can recover their Round 1 points by simply declaring that they *always* valued what they voted for.
  3.  **Action:** Students rewrite cards. Some will radicalize ("I am not a Privacy Absolutist, I am a Security Maximalist") to justify their trades. Some will inflate ("I value Compromise above all") to make everything compatible.
  4.  **Tally:** Final Scores calculated (Points - Integrity Tax).
  5.  **Expected Outcome:** Scores recover, but the "Identities" in the room are now unrecognizable compared to the start. Students who refused to change cards have low scores; students who changed everything have high scores but feel "hollow."
  6.  **Closing Question:** "Look at your neighbor's new Identity Card. Did they gain value, or did they just change the subject?"

  ## III. Troubleshooting: Predictable Failures

  1.  **The Free-Rider:** Some students will refuse to trade, hoarding tokens.
      *   *Fix:* In Round 1, announce a "Participation Bonus": If fewer than 10 tokens are traded total, *no* proposals pass. This forces engagement.
  2.  **The Coalition:** Three students might collude to ignore the rest.
      *   *Fix:* Cap the number of tokens one Proposal can receive from a single group of three to 50% of the requirement. Force broad consensus.
  3.  **The Arithmetic Dispute:** Students will argue about the scoring rules in Round 2.
      *   *Fix:* Keep the math binary (All or Nothing). Do not use partial points. If the rule is violated, the score is zero. Ambiguity here is useful, but calculation errors are distracting.
  4.  **The Principled Refusal:** One student may refuse to rewrite their card in Round 3 on moral grounds.
      *   *Facilitator Move:* Do not pressure them. Highlight them in the debrief. "This student paid the highest price. Was it a cost or a preservation?"

  ## IV. The Debrief Script (25 Minutes)

  *Do not write terms on the board yet. Draw them out.*

  **Phase 1: The Gains (Mapping Round 1)**
  *   **Ask:** "In Round 1, almost everyone improved their score. How did that happen?"
  *   **Student Answer:** "We traded things we didn't care about for things we did."
  *   **Facilitator:** "Exactly. This is the **Gains-from-Trade** argument. In economics and contractarianism, we assume values are like goods: separable, exchangeable, and stable. If we trade, we both win."
  *   **Write on Board:** *Modularity, Stability, Pareto Improvement.*

  **Phase 2: The Dissolution (Mapping Round 2)**
  *   **Ask:** "Why did those gains vanish in Round 2? What was wrong with the assumption that you could just 'sell' a vote?"
  *   **Student Answer:** "Because voting against my core made the rest meaningless." / "You can't separate the vote from the person."
  *   **Facilitator:** "This is the **Constitutive Commitment** objection. Some values aren't items in a basket; they are the basket. If you trade the ground, the figure disappears."
  *   **Write on Board:** *Integrity, Incommensurability, Constitutive Values.*
  *   **Question:** "Does this mean moral disagreement is always zero-sum?"

  **Phase 3: The Inflation (Mapping Round 3)**
  *   **Ask:** "In Round 3, those who changed their Identity Cards recovered their points. What incentive does this system create?"
  *   **Student Answer:** "It rewards liars." / "It rewards people who make their values vague." / "It rewards radicalization so you have more to trade."
  *   **Facilitator:** "This is **Preference Endogeneity** and **Strategic Misrepresentation**. If the system rewards you for adapting your values to the market, the market doesn't satisfy values—it manufactures them."
  *   **Write on Board:** *Endogeneity, Adaptive Preferences, Strategic Inflation.*

  **Phase 4: The Verdict**
  *   **Ask:** "Look at your final Scorecard. Are you better off than when you walked in? Or are you just a different person?"
  *   **Discussion:** Let them sit with the ambiguity.
  *   **Closing:** "Your friend argues trade creates value. You argue trade consumes the valuer. Today, you found that both are mechanically possible, but they cannot coexist in the same scoring system."

  ## V. Limitations: What the Activity Cannot Do

  Be frank with the class about the simulation's blind spots.

  1.  **The Phenomenology of Betrayal:** The game uses "zero points" to simulate the loss of integrity. It cannot simulate the *first-person texture* of shame, alienation, or the feeling of "selling out." That is a qualitative experience, not a quantitative loss.
  2.  **True Incommensurability:** The game ultimately reduces everything to points (even the Integrity Tax). It cannot stage a situation where two values literally *cannot* be compared, only one where the rules forbid comparison.
  3.  **The "Lights" Problem:** The prompt notes that trade "changes the lights." The game simulates this by letting them rewrite cards, but it cannot make them *feel* the shift in perception, only the shift in rules.

  \answer{The phenomenological cost of self-betrayal}
