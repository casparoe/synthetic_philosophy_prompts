answer: |-
  The argument you are describing is well-known in the philosophy of physics and metaphysics. It has a specific name, and your objection to it occupies a recognized, albeit nuanced, position in the literature.

  ### 1. The Argument: The Rietdijk–Putnam Argument

  The pattern of reasoning you outlined is standardly referred to as the **Rietdijk–Putnam Argument** (named after C.W. Rietdijk, 1966, and Hilary Putnam, 1967). A popularized version involving the Andromeda Galaxy is often called the **Andromeda Paradox** (associated with Roger Penrose).

  *   **The Premise:** Special Relativity entails the relativity of simultaneity (different inertial frames slice spacetime differently).
  *   **The Assumption:** There is no privileged frame of reference (the Principle of Relativity).
  *   **The Inference:** If what is "real" is determined by what is simultaneous with "me now," and simultaneity is frame-dependent, then what is "real" must include all events that are simultaneous in *any* valid frame.
  *   **The Conclusion:** **Eternalism** (or the Block Universe). All past, present, and future events are equally real.

  ### 2. The Reply: The Invariance Objection (or Stein's Critique)

  Your reply does not have a single catchy proper name like "The Kantian Shift," but it is best identified as the **Invariance Objection** to the Rietdijk–Putnam argument. It is most rigorously associated with the philosopher of physics **Howard Stein** (specifically his 1968 paper "On Einstein-Minkowski Space-Time" and his 1991 follow-up).

  Your intuition that "now" is being asked to do two jobs is precisely the core of this critique. In philosophical terms, you are identifying an **equivocation on the relation of co-existence**.

  *   **Job 1 (Geometric/Coordinate):** "Now" defines a hypersurface of simultaneity relative to a frame.
  *   **Job 2 (Ontological):** "Now" defines the locus of existence (what is "real").

  The Rietdijk–Putnam argument works by sliding from Job 1 to Job 2. It assumes that because the geometric relation (simultaneity) is well-defined, the ontological status (reality) must follow it. Your objection is that ontology should be **frame-invariant**. If "what exists" depends on which arbitrary coordinate grid you lay over the world, then "what exists" is not a fact about the world, but a fact about your grid.

  Stein formalized this by arguing that for a relation to define "reality" or "determinateness," it must be definable purely in terms of the geometric structure of spacetime without reference to arbitrary frames. He demonstrated that the transitivity required to chain observers (if $A$ is real for $B$, and $B$ is real for $C$, then $A$ is real for $C$) fails in Minkowski space if one respects the causal structure.

  ### 3. Distinguishing Your Reply from Neighbors

  You asked specifically how to distinguish your position from nearby arguments. Here is the logical mapping:

  **A. Distinct from "Simultaneity is Relative"**
  *   **That Claim:** This is a physical premise of Special Relativity.
  *   **Your Claim:** You accept the physics. Your objection is metaphysical/logical. You are arguing that *even if* simultaneity is relative, it does not follow that *existence* is relative or that the union of all simultaneous slices constitutes reality.

  **B. Distinct from "Conventionality of Simultaneity" (Reichenbach/Grünbaum)**
  *   **That Claim:** This argues that even *within* a single frame, defining simultaneity at a distance involves a conventional choice (the $\epsilon$ parameter).
  *   **Your Claim:** Your objection is stronger. You are arguing that even if we fix the convention and fix the frame, the move from "simultaneous in this frame" to "ontologically real" is illegitimate. You are attacking the bridge between coordination and ontology, not the coordination itself.

  **C. Distinct from "No Privileged Present" (The Anti-Presentist Argument)**
  *   **That Claim:** Usually, this is used *to support* Eternalism. (i.e., "Since there is no privileged present, Presentism is false, therefore Eternalism is true.")
  *   **Your Claim:** You are using the lack of privilege to block the inference to Eternalism. Your argument is: "If no frame is privileged, then no frame's 'now' can determine ontology. Therefore, ontology cannot be determined by 'now' slices at all." You are not defending a privileged present (Lorentzian Presentism); you are denying that 'presentness' is the criterion for reality.

  **D. Distinct from "Proves Too Much" (Reductio)**
  *   **That Claim:** A general logical charge that an argument yields absurd consequences.
  *   **Your Claim:** This is close, but yours is more specific. You are charging a **Category Mistake**. You are arguing that the argument treats a **gauge-dependent quantity** (the slicing of spacetime) as if it were a **gauge-invariant quantity** (existence). In physics, if a quantity changes when you change coordinates, it is not a physical observable. You are arguing that "reality" must be an observable, so it cannot depend on the slicing.

  **E. Distinct from "Relativized Existence" (Simon Saunders)**
  *   **That Claim:** Some philosophers (like Simon Saunders) accept the Rietdijk–Putnam logic but bite the bullet: they argue existence *is* frame-relative. (i.e., "X exists for observer A but not for observer B.")
  *   **Your Claim:** You seem to reject this. You suggest the conclusion is "carried by the manner of assignment rather than by anything discovered." You are insisting on a **monistic ontology** (what exists, exists simpliciter) and arguing that the Rietdijk–Putnam argument fails to establish one because it relies on arbitrary assignments.

  ### 4. Location and Edges

  **Where your reply sits:**
  Your position is a form of **Metaphysical Deflationism** regarding spacetime slices. It asserts that the foliation of spacetime into "past, present, and future" is a useful coordinate tool for observers but carries no ontological weight.

  **The Edge Cases:**
  *   **Falls under your reply:** Any argument that infers the reality of unobserved events solely from their inclusion in a simultaneity slice of *some* inertial frame.
  *   **Does not fall under your reply:** Arguments for Eternalism based on **truthmakers** for future-tensed statements (logical arguments), or arguments based on the **geometry of the manifold** itself (where the whole 4D object is the fundamental entity, not the sum of slices). Your objection targets the *chaining of observers*, not necessarily the 4D manifold view itself, though it undermines the primary motivation for it.

  **Summary of Names:**
  *   **The Argument:** The Rietdijk–Putnam Argument.
  *   **The Conclusion:** Eternalism / The Block Universe.
  *   **Your Objection:** The Invariance Objection (or Stein's Critique).
  *   **The Logical Fault:** Equivocation between Simultaneity (coordinate) and Co-existence (ontological); treating a gauge-dependent feature as ontologically fundamental.

  You are correct that the argument relies on blurring the distinction between the *slice* (epistemic/coordinate) and the *substance* (ontological). Your reply is the standard, rigorous philosophical counter-move: demanding that ontology be invariant under the transformations that leave the physics unchanged.
