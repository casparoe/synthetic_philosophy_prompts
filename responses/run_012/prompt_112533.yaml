      *   *Idea:* They pass a "Token."
      *   *Better:* Let's stick to the Prompt's requirement: "from the outside the two teams are indistinguishable."
      *   If Team FF is just 8 independents, they look like 8 people. Team REC looks like 1 group.
      *   *Fix:* Team FF passes cards silently. Team REC passes cards silently but in a mesh.
      *   *Actually, the most faithful simulation of $\Phi=0$:*
      *   Team FF: Each student determines their output *solely* from an Input Card they hold personally. No talking.
      *   Team REC: Each student determines their output based on a *shared* Input Card in the middle + neighbors' states.
