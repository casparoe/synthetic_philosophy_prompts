      *   How to make them look "clever" first?
      *   *Idea:* Both teams solve a maze or puzzle.
      *   Team FF: Assembly line. Student 1 solves part A, passes to 2...
      *   Team REC: Huddle. Everyone solves together.
      *   *Cut:* Screen between 4 and 5.
      *   Team FF: If the task is strictly sequential, they fail.
      *   *Okay, I must adhere to the prompt's specific constraint:* "one of them has a cut that changes nothing about what the system does."
      *   This implies the Feedforward team must be able to function *as a system* even when cut.
      *   This is only possible if the "System" is defined loosely (aggregate) or the task is parallel.
      *   *Decision:* I will design the task such that the Feedforward team's "Output" is the *collection* of individual outputs, while the Recurrent team's "Output" is a *single collective decision*.
      *   *Round 1:* Both produce a complex pattern. FF does it by 8 people each doing 1/8th. REC does it by 8 people agreeing on the whole. To an observer, the pattern looks the same.
      *   *Round 2 (Cut):* Screen goes up.
      *   FF: Left side does their 4/8ths. Right side does their 4/8ths. The Pattern is completed. (Because they never needed to talk).
      *   REC: Left side doesn't know what Right side is doing. Pattern fails.
      *   *Conclusion:* FF was just 8 little systems. REC was 1 big system.

  5.  **Addressing Phase 2 (Exclusion):**
      *   Need to make the "Nested Systems" tangible.
      *   Within Team REC, designate "Cliques" (Pairs who whisper).
      *   Ask: "Where does the consciousness reside?"
      *   If the Pair has high integration (dense talk) but the Whole has higher (global consensus), the Whole wins.
      *   If the Instructor joins the circle, does $\Phi$ go up? (Probably not, bottleneck).
      *   The "Grain" issue: Are the nodes people or neurons? (In this sim, people are nodes). If we treat Pairs as nodes, does $\Phi$ change?

