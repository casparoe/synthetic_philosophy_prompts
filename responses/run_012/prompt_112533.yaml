      *   *Risk:* Students think FF team is "dumb." *Mitigation:* Emphasize they produced the *same output* in Round 1.
      *   *Risk:* Cut test is messy. *Mitigation:* Strict silence rules.
      *   *Risk:* Exclusion feels abstract. *Mitigation:* Use physical grouping (tape on floor).
      *   *Limitations:* Real IIT is about time steps and repertoires. This is spatial and static. Must acknowledge this in debrief.

  7.  **Finalizing the Plan:**
      *   **Title:** "The Black Box Cut."
      *   **Setup:** Two zones. Team Alpha (FF), Team Omega (REC).
      *   **Task:** "The 8-Bit Register."
      *   **Round 1:** Generate a specific 8-bit string (e.g., 10110010).
      *   **Round 2:** The Cut.
      *   **Phase 2:** The Exclusion Game.
      *   **Debrief:** Connect to Tononi.

