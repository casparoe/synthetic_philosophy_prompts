prompt: |-
  I run a ninety-minute session in an upper-level philosophy of mind seminar: sixteen students, all of whom have had one course on the mind–body problem and none of whom has read anything in consciousness science. I want the session built around an activity rather than a lecture, and I want the students to have run into the theory's central difficulty with their own hands before they hear any of its vocabulary.

  The theory is Giulio Tononi's integrated information theory. Three of its commitments need to be felt rather than explained. First: consciousness, on this view, is a matter of a system's causal structure being irreducible to the causal structure of its parts. The measure Φ is defined as the difference between the cause–effect repertoire of the whole system and the repertoire of the least damaging way of cutting that system in two, its minimum information partition; a cut that loses nothing yields Φ = 0, however intricate the system looks from outside. Second: this makes a purely feedforward arrangement come out at zero. Signals run one way, no unit takes and makes a difference to the past of another, some cut between the layers costs nothing, and so on the theory's own terms there is nothing it is like to be that system — even when it produces exactly the same output as a recurrent system of the same size doing the same job. Third: the exclusion postulate allows at most one subject per piece of matter. Of all the nested and overlapping candidate systems you can carve out of a substrate, only the one with the greatest Φ is conscious; a smaller loop inside a larger one is a perfectly real mechanism and not a subject at all.

  Please design the activity, with:

  - Rules, roles, materials, and a per-round protocol, all buildable from index cards, tape, a whiteboard, and a cardboard screen. No computers, and no one calculates Φ or does arithmetic beyond counting.
  - A first phase in which two teams are wired differently — one feedforward, one recurrent — and asked to perform an identical input–output task, so that from the outside the two teams are indistinguishable and neither looks cleverer or more coordinated than the other. Then a cut test: I screen off one part of a team from another and re-run the task. The teams should discover for themselves that one of them has a cut that changes nothing about what the system does, and that this is fatal in a way they did not expect.
  - A second phase that makes the exclusion problem concrete: with the recurrent team as the substrate, the students must decide which of the nested candidate systems is the subject — the whole team, the two-person sub-loops inside it, the team plus me standing at the board — and should find that the theory returns a definite verdict and that no one's introspection has anything to say about it. Include the grain question: whether the units are counted as people or as pairs changes which candidate wins.
  - A debrief that maps what happened onto integration, information, the minimum information partition, the feedforward consequence, and exclusion, and that supplies the name of the theory and its terms only at that point.
  - An honest account of what will predictably go wrong the first time I run this and how to handle it, and a frank note on which features of the theory the activity cannot reproduce and that I will have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute upper-level philosophy of mind seminar.
      *   **Students:** 16 students, background in mind-body problem, *no* background in consciousness science.
      *   **Goal:** Activity-based (not lecture), students must *feel* the theory's difficulties before learning vocabulary.
      *   **Theory:** Integrated Information Theory (IIT) by Giulio Tononi.
      *   **Key Commitments to Demonstrate:**
          1.  *Integration:* Consciousness = irreducible causal structure (Whole > Sum of Parts). $\Phi$ = difference between whole and minimum information partition (MIP).
          2.  *Feedforward Zero:* Purely feedforward systems have $\Phi = 0$ (cut costs nothing), even if functionally equivalent to recurrent systems.
          3.  *Exclusion:* Only one subject per matter (the one with max $\Phi$). Nested systems don't count if overshadowed.
      *   **Constraints:** Index cards, tape, whiteboard, cardboard screen. No computers. No arithmetic beyond counting.
      *   **Structure:**
          *   Phase 1: Feedforward vs. Recurrent teams doing identical I/O task. Cut test reveals one is "dead" (zero integration).
          *   Phase 2: Exclusion problem. Nested candidates within the recurrent team. Grain question (people vs. pairs).
          *   Debrief: Map activity to IIT concepts (Integration, Information, MIP, Feedforward, Exclusion). Reveal theory name last.
          *   Troubleshooting: What goes wrong & limitations.

  2.  **Deconstruct the Activity Mechanics:**

      *   *Phase 1 (Integration & Feedforward):*
          *   Need 2 teams of 8 students each (16 total).
          *   Task: Needs to be simple enough to do without computers but complex enough to show dependency. A pattern matching or logic gate simulation works best. Let's use a "Pattern Replication" or "State Update" task.
          *   *Feedforward Team:* Layered. Input -> Layer 1 -> Layer 2 -> Output. No back-connections.
          *   *Recurrent Team:* Interconnected. Everyone talks to everyone (or specific loops).
          *   *The Cut:* Physically separate parts of the team (cardboard screen).
          *   *The Reveal:* The feedforward team can still function (or function *identically*) when cut between layers because information only flows one way. The recurrent team fails or changes behavior because they need feedback to maintain state.
          *   *Refinement:* To make the "cut costs nothing" point clear, the feedforward team needs to be able to pass the test *even if* they can't communicate across the cut. But wait, if they can't communicate across the cut, how does the signal get through?
          *   *Correction:* In IIT, a cut severs causal influence. In a feedforward network, if you cut between Layer 1 and Layer 2, Layer 2 cannot receive input from Layer 1. So the system *fails* to produce output.
          *   *IIT Logic:* The MIP is the cut that *minimizes* the loss of information. In a feedforward system, there exists a cut (between layers) where the *cause-effect repertoire* doesn't change in a way that implies integration. Actually, the standard IIT argument is that a feedforward system can be partitioned such that the *past* state of one part doesn't constrain the *future* state of the other *beyond what is already determined*.
          *   *Simplification for Class:* Let's focus on the *state dependency*.
          *   *Task:* "State Maintenance." The system must hold a binary state (0 or 1) over time steps.
          *   *Feedforward:* Input comes in, passes through, output goes out. No memory of previous step unless encoded in the signal.
          *   *Recurrent:* The current state depends on the previous state of the *whole* group.
          *   *Better Idea:* Use a "Majority Rule" or "Parity" task that requires communication.
          *   *Let's try this:* The system receives an input (a number/card). It must produce an output based on a rule.
          *   *Feedforward:* Student 1 gets input, tells Student 2, Student 2 tells Student 3... Student 8 gives output.
          *   *Recurrent:* Students stand in a circle. They all see the input. They discuss/coordinate to give output.
          *   *The Cut:* Put a screen between Student 4 and 5.
          *   *Feedforward:* If the screen goes up, Student 5 never gets the message. Output fails.
          *   *Wait, this doesn't show $\Phi=0$.* $\Phi=0$ means the system is *not* more than the sum of its parts.
          *   *Re-evaluating the "Cut" metaphor for IIT:* In IIT, a "cut" means we assume the parts are independent. If the system's behavior is exactly the same under the assumption of independence as it is with connection, $\Phi=0$.
          *   *Classroom Translation:* If I separate the team into two groups and they can *still* perform the task perfectly without talking to each other (because the task doesn't require integration), then $\Phi=0$.
          *   *Task Design:* The task must be decomposable for the Feedforward team but not for the Recurrent team.
          *   *Feedforward Task:* "Sort these cards." Half the class sorts red, half sorts blue. They don't need to talk.
          *   *Recurrent Task:* "Agree on a single color." They must talk.
          *   *Problem:* The prompt asks for *identical input-output tasks* so they look indistinguishable from the outside.
          *   *Solution:* The task is "Compute Function F(Input)."
          *   *Feedforward Architecture:* Hard-wired logic. Student A passes to B, B to C.
          *   *Recurrent Architecture:* Mesh. Everyone compares notes.
          *   *The Cut Test:* We sever communication links.
          *   *Feedforward:* If we cut between layers, the signal stops. This implies high integration? No.
          *   *IIT nuance:* A feedforward system has $\Phi=0$ because you can partition it into input and output parts where the cause-effect structure is preserved *in principle* because there is no feedback loop making the whole irreducible.
          *   *Practical Classroom Hack:* We need to simulate the *dependency*.
          *   *Revised Plan:*
              *   **Team A (Feedforward):** 8 students in a line. Student 1 receives Input Card. Writes on Card. Passes to 2. 2 writes. Passes to 3... Student 8 announces Output.
              *   **Team B (Recurrent):** 8 students in a circle. Input Card placed in center. All look. They whisper to neighbors. Student 8 announces Output.
              *   **Task:** "Is the number on the input card Odd or Even?" (Too simple). "Is the sum of digits prime?" (Too hard).
              *   **Task:** "Parity Check." Input is a string of 4 bits (cards). Output is 1 if odd number of 1s, 0 if even.
              *   **Team A (Feedforward):** Student 1-4 hold bits. Student 5-8 compute. Student 5 takes 1&2, Student 6 takes 3&4. Student 7 takes 5&6. Student 8 outputs.
              *   **Team B (Recurrent):** All 8 hold a bit (some are 0/dummy). They must reach consensus.
              *   **The Cut:** Place screen between Student 4 and 5 (Team A) and between two random students (Team B).
              *   **Team A:** If the architecture is strictly feedforward, cutting between processing layers stops the flow. *Wait, this makes Feedforward look fragile.*
              *   *IIT Claim:* Feedforward has $\Phi=0$. Why? Because the state of the system at time $t$ does not constrain the state at $t+1$ in an irreducible way.
              *   *Classroom Analogy:* We need to show that Team A is just a collection of independent agents doing a relay, whereas Team B is a "gestalt."
              *   *Let's flip the Cut Test:* The Cut Test in IIT is conceptual. "If we pretend these two parts don't talk, does the system behavior change?"
              *   *Activity:* "The Black Box Test."
              *   Round 1: Both teams produce Output X for Input Y. (Indistinguishable).
              *   Round 2 (The Cut): I physically separate the teams into two halves (Screen). I tell them: "You are now two independent systems. You cannot communicate across the screen."
              *   Team A (Feedforward): Can still produce the output? How? Only if the task is parallelizable. If the task is "Compute Parity of 8 bits," and I cut them in half, neither half knows the global parity.
              *   *Crucial IIT Insight:* Feedforward networks have $\Phi=0$ because the *cause-effect repertoire* of the whole is the product of the parts.
              *   *Simplification:* Let's focus on the *Memory/State* aspect. Recurrent systems have memory (feedback). Feedforward do not.
              *   *Task:* "Repeat the previous input."
              *   Team A (Feedforward): Cannot do this without a delay line (which is a form of recurrence).
              *   *Okay, let's stick to the prompt's specific requirement:* "one of them has a cut that changes nothing about what the system does."
              *   This is the hardest part to simulate physically. If I cut a feedforward network, signal stops.
              *   *Interpretation:* The prompt implies the *MIP* cut. In a feedforward system, the MIP cuts the flow, but the *information loss* is zero because the parts were never integrated to begin with.
              *   *Better approach for Class:* Use the "Independent Sub-routines" model.
              *   Team A (Feedforward): 4 pairs. Each pair solves a mini-problem. The "Output" is just the collection of their answers.
              *   Team B (Recurrent): 8 people. They must solve one problem together.
              *   *Input:* 8 distinct numbers.
              *   *Task:* "Output the numbers."
              *   Team A: Each student holds a number. They say it in order.
              *   Team B: They mix the numbers, then must reconstruct the order through discussion.
              *   *Cut:* Screen between 4 and 5.
              *   Team A: Students 1-4 say their numbers. Students 5-8 say theirs. The "System Output" is the concatenation. It works perfectly. The cut changed nothing about the *capability* of the parts to produce their share. The "Whole" was just an aggregate.
              *   Team B: They can't reconstruct the order. The "Whole" failed.
              *   *This captures Integration.* Team A = $\Phi=0$ (Sum of parts). Team B = $\Phi>0$ (Whole > Parts).

      *   *Phase 2 (Exclusion):*
          *   Focus on Team B (Recurrent).
          *   They are the "Conscious" system.
          *   Problem: Inside Team B, there are pairs (Student 1 & 2) who talk closely. Are *they* conscious?
          *   Problem: Team B + Instructor. Is *that* the conscious system?
          *   Activity: Have them vote on "Who is the Subject?"
          *   Grain: Count individuals vs. pairs.
          *   Verdict: IIT says only the Max $\Phi$ counts.
          *   Experience: Students will feel that *they* are conscious, not the "team," but the theory says the Team is the subject (if $\Phi$ is max there). Or, if the pairs have higher density, the pairs are the subjects and the individuals aren't. This creates the "Exclusion" tension.

  3.  **Drafting the Protocol:**

      *   **Materials:** Index cards (for inputs/states), Tape (to mark zones), Whiteboard (scorekeeping), Cardboard Screen (the "Cut").
      *   **Roles:** 16 Students (2 Teams of 8). Instructor (Facilitator/Cutter).
      *   **Phase 1:**
          *   Task: "Global Parity." Input: 8 cards (0 or 1). Output: Single card (0 or 1).
          *   Team FF (Feedforward): Arranged in a binary tree. 4 pairs compute local parity, pass to 2, pass to 1.
          *   Team REC (Recurrent): Arranged in a circle. All see all cards. Must agree.
          *   *Wait, the prompt says:* "one of them has a cut that changes nothing about what the system does."
          *   If I cut the FF tree, the root doesn't get the leaves' data. Output fails.
          *   *Correction:* The IIT claim is that for a feedforward system, there exists a partition where the *cause-effect structure* is unchanged.
          *   *Classroom translation:* We need a task where the FF team's output is *defined* as the aggregate of independent actions, whereas the REC team's output is defined as a consensus.
          *   *Revised Task:* "State Reporting."
          *   Input: None (Internal State).
          *   Output: Each student announces a bit.
          *   Team FF: Each student's bit is determined solely by their own internal card (no talking).
          *   Team REC: Each student's bit is determined by the majority of the group (talking required).
          *   *Cut:* Screen them in half.
          *   Team FF: Still announce their bits. System Output (the vector of 8 bits) is unchanged. $\Phi=0$.
          *   Team REC: Can't know the majority of the whole group. Output changes/errors. $\Phi>0$.
          *   *This works.* It shows FF is reducible (just 8 independent units) and REC is irreducible (needs the whole).

      *   **Phase 2:**
          *   Focus on Team REC.
          *   Identify sub-loops (Pairs).
          *   Ask: "Is the Pair conscious or the Whole?"
          *   Ask: "Is the Whole + Instructor conscious?"
          *   Show that picking one excludes the others.

      *   **Debrief:**
          *   Map FF to Feedforward Networks (Zero $\Phi$).
          *   Map REC to Integrated Systems.
          *   Map Cut to MIP.
          *   Map Phase 2 to Exclusion Postulate.
          *   Reveal IIT.

  4.  **Refining the "Cut" Logic (Self-Correction):**
      *   In IIT, a feedforward system *can* do complex things. But its $\Phi$ is zero because you can cut it without losing *information about its own causal powers*.
