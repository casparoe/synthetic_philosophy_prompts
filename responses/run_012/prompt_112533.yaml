answer: |-
  # Activity Design: The Black Box Cut
  **Session Length:** 90 Minutes
  **Class Size:** 16 Students
  **Theory:** Integrated Information Theory (IIT)
  **Goal:** Experiential discovery of Integration, Feedforward Zero, and Exclusion prior to terminology.

  ## Materials
  *   **Index Cards:** 64 total (32 marked with a large **0**, 32 marked with a large **1**).
  *   **Cardboard Screen:** Large enough to block line-of-sight between two groups of 4 students (e.g., a tri-fold presentation board).
  *   **Tape:** To mark floor zones.
  *   **Whiteboard & Markers:** For recording outputs and tallying.
  *   **Blindfolds (Optional):** 8 scarves or sleep masks (if the screen is not fully light-proof).

  ## Setup & Roles
  1.  **The Substrate:** Clear the center of the room. Use tape to mark two distinct 8-person zones: **Zone Alpha** (left) and **Zone Omega** (right).
  2.  **The Teams:** Divide the 16 students into two teams of 8.
      *   **Team Alpha (The Feedforward Simulant):** Stand in two rows of 4, facing the whiteboard. They are *not* allowed to speak or make eye contact with each other. They are only allowed to look at the Instructor.
      *   **Team Omega (The Recurrent Simulant):** Stand in a tight circle, shoulder-to-shoulder. They are allowed to whisper and make eye contact *only* with each other.
  3.  **The Instructor:** You are the "Environment." You hold the master deck of cards and the Screen.

  ---

  ## Phase 1: The Cut Test (45 Minutes)

  ### Round 1: Functional Equivalence (15 mins)
  **Goal:** Establish that both teams produce identical output from identical input, making them indistinguishable from the "outside."

  1.  **The Task:** Tell the class: *"You are Black Boxes. Your job is to produce an 8-bit Output State. Each of you represents one bit. Hands down = 0, Hands up = 1."*
  2.  **The Input:** Walk to Team Alpha. Hand each student one Index Card (face down). They look at it privately.
      *   *Secret Rule Alpha:* "Raise your hand if your card is 1. Keep it down if 0. Do not look at your neighbors."
  3.  **The Input:** Walk to Team Omega. Place 8 Index Cards face up on a table in the center of their circle.
      *   *Secret Rule Omega:* "You must all raise/lower hands to match the cards on the table. You may talk to ensure you all agree on what the cards say."
  4.  **The Result:** Ensure both teams produce the exact same pattern (e.g., 1-0-1-1-0-0-1-0). Write this pattern on the whiteboard under "System State T1."
  5.  **Observation:** Ask the class: *"From where I stand, did these two systems do the same job?"* (Yes). *"Did one look smarter?"* (No).

  ### Round 2: The Partition (15 mins)
  **Goal:** Demonstrate that one system's causal structure is reducible (integration = 0) while the other's is not.

  1.  **The Announcement:** *"I am now going to perform a 'Partition.' I will sever the causal links between the left half and the right half of each team."*
  2.  **The Cut:**
      *   **Team Alpha:** Place the Cardboard Screen between Student 4 and Student 5. Remind them: *"You cannot see or hear the other side. Continue the task with new Input Cards."*
      *   **Team Omega:** Place the Cardboard Screen through the center of the circle, blocking half the students from seeing the Input Cards on the table (which you also split into two piles, one on each side of the screen).
  3.  **New Input:** Deal new cards.
      *   *Secret Rule Alpha:* (Unchanged) "Raise hand if your card is 1."
      *   *Secret Rule Omega:* (Unchanged) "Match the cards on the table."
  4.  **The Result:**
      *   **Team Alpha:** Produces a perfect 8-bit output. The Screen changed *nothing*. The left 4 bits are correct; the right 4 bits are correct. The "System" functioned perfectly despite being cut in half.
      *   **Team Omega:** Chaos. The left side sees only 4 cards; the right side sees 4 cards. They whisper frantically but cannot agree on the global 8-bit state. They produce errors or conflicting outputs.
  5.  **The Discovery:** Ask Team Alpha: *"Did the screen hurt your performance?"* (No). Ask Team Omega: *"Did the screen hurt your performance?"* (Yes).
  6.  **Board Work:** Write under "System State T2":
      *   Alpha: **Integrated? NO.** (The whole was just the sum of the parts).
      *   Omega: **Integrated? YES.** (The whole was more than the sum of the parts).

  ### Round 3: The "Why" (15 mins)
  **Goal:** Solidify the intuition before moving to Exclusion.
  1.  Ask Team Alpha to reveal their rules. The class will realize Alpha was never actually a "system"—it was 8 independent units pretending to be one.
  2.  Ask Team Omega to reveal their rules. They needed the *relations* between the parts to function.
  3.  **Key Question:** *"If consciousness requires being a unified whole that cannot be cut without loss, which team is a candidate for consciousness?"* (Consensus: Omega).

  ---

  ## Phase 2: The Exclusion Problem (30 Minutes)

  **Goal:** Make the "Exclusion Postulate" and "Grain" problem concrete using Team Omega (the Recurrent/Integrated team).

  ### Step 1: Nested Candidates (15 mins)
  1.  **Setup:** Keep Team Omega in their circle. They are now the "Substrate."
  2.  **The Claim:** Tell them: *"Okay, Omega is integrated. So Omega is a Subject. But wait."*
  3.  **The Sub-Loops:** Use tape to pair them up (Student 1&2, 3&4, etc.).
      *   *"Student 1 and 2 talk to each other more than they talk to Student 5. They form a tight loop. Are 1&2 a conscious subject?"*
      *   *"If 1&2 are a subject, and 3&4 are a subject... is the Whole Team Omega also a subject? Or does the existence of the Whole erase the Parts?"*
  4.  **The Vote:** Have the class vote on three propositions:
      *   A: Only the Individuals (1-8) are subjects.
      *   B: Only the Pairs (1-2, 3-4...) are subjects.
      *   C: Only the Whole Team (1-8) is the subject.
  5.  **The Conflict:** Students will intuitively feel *they* are conscious (A), but the logic of Phase 1 suggests the *Whole* is the integrated unit (C). They cannot logically be both if only the "most integrated" system counts.

  ### Step 2: The Grain & The Instructor (15 mins)
  1.  **The Instructor Joins:** Step into Team Omega's circle.
      *   *"I am now part of the causal loop. I whisper to Student 1. Is the Subject now 'Team Omega + Professor'?"*
      *   *"If I add noise, I lower integration. If I add signal, I might raise it. Where is the boundary?"*
  2.  **The Grain Question:**
      *   *"In Phase 1, we counted People as the units (nodes). What if the units are actually 'Pairs'?"*
      *   Ask Team Omega to act as 4 Units (Pairs) instead of 8 Units (People).
      *   *"Does the integration score change if we change the grain size? If the Pair has higher $\Phi$ than the Person, the Person ceases to be a subject."*
  3.  **The Verdict:** Explain that the theory they are enacting demands a single verdict. You cannot have overlapping subjects. One system wins; the rest are just mechanisms.

  ---

  ## Debrief: Mapping the Experience (15 Minutes)

  **Goal:** Reveal the theory and vocabulary *after* the experience.

  1.  **Reveal:** *"The theory you just enacted is **Integrated Information Theory (IIT)**, proposed by Giulio Tononi."*
  2.  **Map the Terms:**
      *   **Integration ($\Phi$):** The difference between the Whole and the Parts. Team Omega had high $\Phi$ (Cut hurt them). Team Alpha had $\Phi = 0$ (Cut did nothing).
      *   **Minimum Information Partition (MIP):** The cut I made with the screen. In IIT, we search for the cut that costs the least. For Alpha, the cost was zero.
      *   **Feedforward Consequence:** Team Alpha simulated a feedforward network (input $\to$ output, no recurrent dependency). IIT predicts $\Phi = 0$ for feedforward systems, even if they act smart. They are "philosophical zombies" in this framework.
      *   **Exclusion Postulate:** Phase 2. Only the system with *maximum* $\Phi$ is conscious. If the Team has more $\Phi$ than the Pair, the Pair is not conscious. This solves the "many minds" problem but creates the "my mind is not me" problem.
  3.  **Closing Question:** *"Team Alpha acted exactly like Team Omega in Round 1. If you met a human who acted like Team Omega but was wired like Team Alpha, does IIT say they are conscious?"* (No).

  ---

  ## Troubleshooting & Limitations

  ### Predictable Failures & Fixes
  1.  **The "Cheating" Feedforward Team:**
      *   *Risk:* Team Alpha students glance at neighbors during the Cut, ruining the $\Phi=0$ demonstration.
      *   *Fix:* Enforce strict "Eyes Front" discipline. If they cheat, the lesson fails. Remind them they are simulating *nodes*, not collaborators.
  2.  **The "Bored" Feedforward Team:**
      *   *Risk:* Team Alpha feels dumb because they aren't allowed to talk.
      *   *Fix:* Emphasize in the Debrief that Alpha represents a *supercomputer*. They are functionally superior in speed, but structurally "dead." This flips the status hierarchy.
  3.  **Confusion on Exclusion:**
      *   *Risk:* Students reject Exclusion immediately ("Of course I'm conscious, not my hand!").
      *   *Fix:* Acknowledge this is the most controversial part of IIT. The activity is designed to make them feel the *tension*, not necessarily agree with the verdict.

  ### Theoretical Limitations (Instructor Notes)
  You must supply these caveats verbally, as the activity cannot reproduce them:
  1.  **Time Steps:** IIT defines $\Phi$ over state transitions (time $t$ to $t+1$). This activity is spatial. We simulated "causal dependency" with "communication rules," but real IIT is about intrinsic cause-effect power over time.
  2.  **Intrinsic Perspective:** IIT claims consciousness is intrinsic to the system. In this activity, *you* (the instructor) judged the integration. In reality, the system "knows" its own $\Phi$.
  3.  **The Grain Problem:** We used "People" as nodes. In the brain, nodes are neurons or complexes. The activity simplifies the "scale" issue, but you must note that finding the true MIP in a brain is computationally intractable.
  4.  **Panpsychism:** IIT implies simple systems (thermostats, photodiodes) have tiny amounts of $\Phi$. This activity deals with "Zero vs. Non-Zero," but IIT is actually a gradient theory.

  ### Final Instructor Tip
  Do not use the word "Consciousness" until the Debrief. Use "Subject," "System," or "Black Box." This prevents students from importing their own definitions of consciousness and allows the *structural* definition (Integration) to land first.
