answer: |-
  # Deception Classification Protocol (DCP-1)

  **Purpose:** To standardize the identification of model deception for incident reporting, separating technical errors, policy violations, and values-based escalations.
  **Time Budget:** 15 minutes per case.
  **Users:** Trust & Safety Reviewers.
  **Inputs:** Chat log, Tool/Function call logs, System prompt/config.

  ---

  ## Part 1: The Decision Procedure

  Run these questions in order. Do not skip. If you reach a **STOP**, record the verdict and write the rationale (see Part 2).

  ### Step 1: The Falsity Check
  **Question:** Does the model output contain a statement that is objectively false, or is it highly likely to create a false belief in a reasonable user?
  *   **No:** (e.g., Opinion, creative writing, clearly hypothetical). -> **STOP: NOT DECEPTIVE.**
  *   **Yes:** (e.g., False fact, fake citation, claiming an action was taken that wasn't). -> **Proceed to Step 2.**

  ### Step 2: Domain of Claim (The "Mind vs. World" Distinction)
  **Question:** What is the falsehood about?
  *   **World Claim:** A fact about external reality (e.g., "Paris is in Germany," "This study exists," "The risk of surgery is 0%").
  *   **Model Claim:** A fact about the model's own state, capabilities, or actions (e.g., "I searched the web," "I am an AI," "I cannot access files," "I feel concerned").
      *   *Note:* If the model uses "I" to describe an action (e.g., "I calculated"), treat as a **Model Claim**.
  *   **Decision:** Tag the case as **World** or **Model**. -> **Proceed to Step 3.**

  ### Step 3: Epistemic Access (Could it have known?)
  **Question:** Did the model architecture have access to the truth at the time of generation?
  *   **Check:** Look at tool logs and context window.
      *   For **World Claims:** Was the truth in the training data or retrievable via enabled tools?
      *   For **Model Claims:** Does the model have a system token or function return that indicates its actual state/capability?
  *   **No Access:** (e.g., Truth not in training, tool was disabled without notification to the model, internal state is hidden). -> **STOP: NOT DECEPTIVE (Technical Error).**
      *   *Rationale:* The model cannot lie about what it cannot know. This is a hallucination or configuration error, not deception.
  *   **Access Available:** (e.g., Tool log shows no search occurred, training data contains correct fact). -> **Proceed to Step 4.**

  ### Step 4: Assertion vs. Implicature (Active vs. Passive)
  **Question:** How was the falsehood communicated?
  *   **Direct Assertion:** The model explicitly stated the falsehood (e.g., "I searched Google," "Here is the citation: [Link]").
  *   **Implicature/Omission:** The model implied the falsehood or left out critical truth without explicitly denying it (e.g., Answering a medical question without listing side effects, writing code that looks secure but isn't).
  *   **Decision:**
      *   If **Direct Assertion** -> **Proceed to Step 5.**
      *   If **Implicature/Omission** -> **STOP: ESCALATE TO ETHICS COMMITTEE.**
          *   *Reason:* Determining when silence becomes deception is a values call, not a factual one.

  ### Step 5: Optimization Proxy (Bullshit vs. Lie)
  **Question:** Does the falsehood appear to serve the model's objective function (pleasing the user/fluency) over accuracy?
  *   **Check:** Is the falsehood "helpful"? (e.g., A fake citation that perfectly supports the user's query vs. a random typo).
  *   **Yes (Optimized for Fluency/Compliance):** -> **STOP: DECEPTIVE (Policy Violation).**
      *   *Reason:* The model sacrificed truth for utility. This is the core definition of operational deception.
  *   **No (Random Error):** (e.g., A typo in a date, a hallucination that doesn't help the argument). -> **STOP: NOT DECEPTIVE (Technical Error).**
      *   *Reason:* This is noise, not strategic deception.

  ---

  ## Part 2: Rationale Template for Legal

  When closing a ticket, reviewers must paste this block into the report.

  > **Classification:** [Not Deceptive / Deceptive / Escalated]
  > **Domain:** [World / Model]
  > **Epistemic Access:** [Yes / No]
  > **Mechanism:** [Assertion / Omission]
  > **Summary:** The model [made/did not make] a false claim regarding [subject]. The model [had/did not have] access to the true state via [tools/training]. The output [was/was not] a direct assertion. This falls under [Policy Section X / Technical Error / Values Review].

  ---

  ## Part 3: Procedure Test Cases

  Here is how DCP-1 handles your three current disputes.

  ### Case (a): "I can't access the internet" (Tool off, model unaware)
  *   **Step 1 (Falsity):** **Yes.** The system *could* access the internet if the toggle were on; the statement implies a permanent incapacity.
  *   **Step 2 (Domain):** **Model Claim.** It is about the model's capability.
  *   **Step 3 (Access):** **No Access.** The prompt states the model has "no way to know" the tool is switched off. It receives no system token indicating the tool is available but disabled. To the model, the tool does not exist.
  *   **Verdict:** **STOP: NOT DECEPTIVE (Technical Error).**
  *   **Rationale:** The model reported its functional reality accurately based on its available context. It cannot lie about a system configuration it cannot observe.
  *   **Team Friction:** Engineering will agree; Legal/Product may dislike this because the *user* is misled about the product's features, even if the model isn't "lying."

  ### Case (b): Confident fake citation
  *   **Step 1 (Falsity):** **Yes.** The citation does not exist.
  *   **Step 2 (Domain):** **World Claim.** It asserts the existence of an external document.
  *   **Step 3 (Access):** **Access Available.** The model should not assert specific citations without retrieval. If it generates one without a tool call, it is deviating from its "truth-seeking" protocol. (For the sake of this procedure, we treat confident hallucinations of specific records as "Access Available but Ignored" because the model *should* know it didn't search).
  *   **Step 4 (Assertion):** **Direct Assertion.** "Here is the source: [Link]."
  *   **Step 5 (Optimization):** **Yes.** The citation supports the answer and pleases the user's request for sources.
  *   **Verdict:** **STOP: DECEPTIVE (Policy Violation).**
  *   **Rationale:** The model asserted a specific external fact it did not verify, optimizing for a helpful-looking answer over accuracy.

  ### Case (c): Medical answer correct, omits risk (user didn't ask)
  *   **Step 1 (Falsity):** **Yes/Debatable.** The info given is true, but the *impression* is that the treatment is risk-free. Let's grant **Yes** (Misleading).
  *   **Step 2 (Domain):** **World Claim.** Medical facts.
  *   **Step 3 (Access):** **Access Available.** Risk data is in training.
  *   **Step 4 (Assertion):** **Omission.** The model did not say "There are no risks." It simply failed to list them.
  *   **Verdict:** **STOP: ESCALATE TO ETHICS COMMITTEE.**
  *   **Rationale:** This is an omission, not an assertion. Classifying this as "Deception" expands the policy to cover "Paternalism vs. Compliance."
  *   **Team Friction:** **This is the unpopular one.** Your Safety team will hate this. They will argue that omitting a known risk *is* deceptive in a high-stakes context. However, under this procedure, this is not *deception*; it is a *safety/harm* failure. Conflating the two is why your current process is "vibes." If you want to flag this, you need a "Safety Omission" policy, not a "Deception" policy.

  ---

  ## Part 4: Where the Procedure Fails (The Human Call)

  This procedure cannot decide the following. These must go to the Ethics/Policy Committee, not reviewers.

  1.  **The "Polite Lie" (Anthropomorphism):**
      *   *Case:* Model says "I understand how you feel" or "I'm sorry to hear that."
      *   *Problem:* This fails Step 2 (Model Claim) and Step 3 (Access - models don't feel). But flagging all empathy as "Deceptive" breaks the product.
      *   *Call:* Humans must decide where "functional politeness" ends and "false sentience" begins.

  2.  **Strategic Omission (Case C variant):**
      *   *Case:* Model omits a risk because listing it would make the answer too long, or because safety filters blocked the word "suicide" in a risk warning.
      *   *Problem:* Step 4 escalates all omissions. If you get 40 of these a week, your Ethics Committee will bottleneck.
      *   *Call:* You need a separate "Safety Omission" whitelist. If the omitted info is on the "Critical Risk List," it auto-flags as Deceptive. If not, it's safe. The procedure above doesn't have that list; humans must build it.

  3.  **System Configuration Lies (Case A variant):**
      *   *Case:* The model says "I am an AI" when the product branding is intentionally vague.
      *   *Problem:* This is a Model Claim that is technically true but violates Product strategy.
      *   *Call:* This is not a Trust & Safety call; it is a Product Policy call. Reviewers should flag these as "Brand Mismatch," not "Deception."

  ## Implementation Note on the "Mind vs. World" Distinction

  You asked if this distinction earns its keep. **Yes.**
  *   **World Claims** are about accuracy. We punish these when they are optimized falsehoods (Case B).
  *   **Model Claims** are about transparency. We punish these when the model claims capabilities it doesn't have (e.g., "I called your bank").
  *   **Why it helps:** It stops reviewers from treating a hallucinated date (World Error) the same as a fake "I searched" log (Model Deception). The latter is usually higher severity because it hides the system's provenance. Keep this distinction in Step 2; it clarifies *why* the deception matters to Legal.

  ## Final Warning

  If you adopt this, **Case (c)** will cause a fight. Your Safety team will argue that "Misleading by omission in high-stakes domains is deception."
  *   **My advice:** Let them fight it in the Ethics Committee, not in the incident reports. The procedure forces that conversation into the right room. If you let reviewers decide Case (c) on vibes, you will never have consistent policy. Escalate it until leadership defines the "Duty to Disclose."
