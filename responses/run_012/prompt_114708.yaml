  ### The example

  A regulator must approve a drug affecting two groups. Group Alpha (10,000 individuals) endures 5 hedons of pain each but receives 6 hedons of pleasure each. Group Beta (1 individual) endures 105 hedons of pain but receives 1,000,000 hedons of pleasure. The lexical threshold is set at 100 hedons of suffering. Below 100, pain and pleasure trade at a fixed rate (e.g., 1:1). This specific numerical setup ensures the sub-threshold calculus yields a clear positive utility sum. Above 100, pain vetoes pleasure. LTNU mandates accepting Alpha's trade (net positive sub-threshold) but rejecting Beta's trade (lexical veto). Justifying Alpha's trade requires asserting pain and pleasure are commensurable units. Rejecting Beta's trade requires asserting they are incommensurable once the intensity crosses 100. The scenario forces the theorist to switch metric systems at the exact boundary of 100 hedons, utilizing a common currency to validate the first group's sacrifice while denying that currency exists for the second.

  ### The conceptual issue it isolates

  The scenario isolates the "Metric Switch" problem. For Group Alpha, the view functions as classic hedonic utilitarianism: it assumes pain and pleasure are quantifiable on a single scale where subtraction is meaningful. To claim 6 pleasure outweighs 5 pain, one must accept a common unit of measurement. However, for Group Beta, the view asserts lexical priority: no amount of pleasure cancels the specific quality of suffering above 100 hedons. This implies pain and pleasure are fundamentally different kinds of value that cannot be compared. The tension arises because the view relies on a single continuous scale to identify the threshold—how else do we know it is 100?—yet denies the continuity of that scale's function at the threshold. It demands commensurability to calculate the sub-threshold aggregate, but incommensurability to enforce the lexical veto. This creates a discontinuity in value theory: are pain and pleasure comparable or not? The view answers "yes" until the moment it must answer "no," without explaining how the same units suddenly lose their comparative power precisely at the integer boundary. Consequently, the threshold acts as an arbitrary switch between two incompatible metaphysical claims about value structure. This inconsistency undermines the theoretical unity of the position.

  ### Why it is not merely a puzzle about arithmetic

  This is not simply a Sorites paradox or a problem of large numbers. Here, the issue is fundamentally ontological. If pain and pleasure are truly measurable on a common scale below the threshold, there must be a fact of the matter about their ratio above it. Denying the trade-off above the threshold isn't saying the ratio is 1:infinity; it is saying the ratio is strictly undefined. But if the units are identical below the line, they cannot become undefined above it without changing the nature of the units themselves. The problem isn't that 1,000,000 pleasure doesn't look like enough to offset 105 pain; it is that the view claims the operation of offsetting is valid in one case and invalid in the other, despite using the same hedonic units to define the cases. It merely challenges the internal coherence of the underlying value metric, not just the arithmetic summation rules.

  ### What a defender of the view must concede

  Consequently, a defender must concede that "hedons" are not uniform units of value. They must argue that intensity radically alters suffering, creating a new kind of disvalue above the threshold lacking a pleasure-equivalent. They must accept a pluralistic value theory where sub-threshold suffering is strictly tradeable and super-threshold suffering is absolutely lexical. This concedes the "threshold" is not merely a quantitative line on a single scale, but a qualitative boundary between distinct axiological categories, ontologically complicating the claim of a unified coherent utilitarian framework. The view fundamentally becomes a hybrid theory rather than a standard pure hedonic final calculus, entirely.
