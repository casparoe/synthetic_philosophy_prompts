      *   **Topic:** Lexical Threshold Negative Utilitarianism (LTNU).
      *   **Definition:** A view where suffering above a certain threshold cannot be compensated by any amount of pleasure (lexical priority), but below that threshold, pleasure and pain are tradeable (aggregative/consequentialist).
      *   **Goal:** Provide a single worked example for a seminar handout.
      *   **Specific Conceptual Issue:** The tension between presupposing a common measure for sub-threshold trade-offs while denying a common measure above the threshold (the "incommensurability vs. commensurability" problem).
      *   **Requirements:**
          *   Stipulate quantities (individuals, intensities, durations).
          *   Make the two halves of the view pull in opposite directions.
          *   Structure: Four named sections (The example, The conceptual issue it isolates, Why it is not merely a puzzle about arithmetic, What a defender of the view must concede).
          *   Word counts: Approx. 150, 200, 150, 100 words respectively.

  2.  **Drafting - Section 1: The Example**
      *   *Goal:* Create a scenario where sub-threshold trade-offs suggest one action, but the lexical threshold suggests another, highlighting the measurement tension.
      *   *Scenario:* Need a choice between Option A (many small pains vs. many small pleasures) and Option B (avoiding one severe pain vs. providing massive pleasure). Actually, to highlight the *measurement* tension, I need a case where we are comparing sub-threshold units to establish the scale, but then hit the wall.
      *   *Better approach:* A "Sorites-like" scenario or a "Boundary Case" scenario. Let's try a boundary case where we are just below vs. just above the threshold.
      *   *Refined Scenario:* A policy choice affecting a population.
      *   *Option 1:* Inflict sub-threshold pain on many to provide sub-threshold pleasure to many. (Requires common measure).
      *   *Option 2:* Inflict super-threshold pain on one to provide massive sub-threshold pleasure to many. (Lexical veto).
      *   *The Twist:* The issue is about the *measure* itself. If I can trade 1 unit of pain for 2 units of pleasure below the threshold, I have a exchange rate. If I hit the threshold, the exchange rate becomes infinite.
      *   *Drafting the numbers:* Threshold = 100 hedons of suffering.
      *   *Case:* Policy X causes 99 units of suffering to 1,000 people but gives 100 units of pleasure to 1,000,000 people. Policy Y causes 101 units of suffering to 1 person but gives 100 units of pleasure to 1,000,000 people.
