  3.  **Drafting - Section 2: The Conceptual Issue it Isolates**
      *   *Goal:* Explain the tension between commensurability (below) and incommensurability (above).
      *   *Key point:* To say 5 pain < 6 pleasure, you need a common currency. To say 105 pain > 1,000,000 pleasure, you say no common currency exists.
      *   *Draft:* The scenario isolates the "Metric Switch" problem. For Group Alpha, the view functions as classic hedonic utilitarianism: it assumes pain and pleasure are quantifiable on a single scale where subtraction is meaningful. To claim 6 pleasure outweighs 5 pain, one must accept a common unit of measurement. However, for Group Beta, the view asserts lexical priority: no amount of pleasure cancels the specific quality of suffering above 100 hedons. This implies pain and pleasure are fundamentally different kinds of value that cannot be compared. The conceptual tension arises because the view relies on a single continuous scale to identify the threshold (how else do we know it is 100?), yet denies the continuity of that scale's function at the threshold. It demands commensurability to calculate the sub-threshold aggregate, but incommensurability to enforce the lexical veto. This creates a discontinuity in value theory: are pain and pleasure comparable or not? The view answers "yes" until the moment it must answer "no," without explaining how the same units suddenly lose their comparative power.

  4.  **Drafting - Section 3: Why it is not merely a puzzle about arithmetic**
