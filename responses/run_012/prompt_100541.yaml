answer: |-
  Good morning.

  Look at the river. It is the only thing here that saw what happened in 1874. It saw the eleven men arrive. It saw the mob gather. It saw the violence. And it has seen the silence that followed. For a hundred and fifty years, Harlow Falls has treated that silence like a foundation stone. We built our shops, our homes, and this commission on top of it.

  Today we put a name on the stone. That changes the geometry of the town. It makes the silence visible.

  I am speaking for the Historical Commission. But when I say "we," I need you to hear exactly who is standing in that word. Because there are different kinds of debt, and we confuse them at our peril.

  There is the debt of the law. There is the debt of the citizen. There is the debt of the conscience. And there is the debt of the survivor.

  I need to be precise about the first one. I am not standing here to confess to a crime I did not commit. None of us on this stage swung a club that night. None of us in this room pulled a trigger. To pretend that I share the criminal guilt of the mob would be a lie. It would be theater. And it would insult the dead, because it suggests their murder can be absolved by the performative sorrow of people who weren't there. I refuse that absolution. I refuse to claim a guilt that isn't mine to carry.

  But there is a second debt. Political debt. This is the debt of belonging. I live in Harlow Falls. I vote here. I walk on streets that were cleared by the labor those eleven men were brought here to do. I benefit from the economy that stabilized after they were removed. Whether I liked the mob or not, whether my family participated or not, I am a beneficiary of the town that remained.

  The town attorney has advised me that I cannot speak to legal liability regarding the land under this landing. I will not. But I can speak to political responsibility. A polity survives its own crimes only by acknowledging that it inherited them. I am a citizen of the entity that allowed this to happen. I inherit the town's assets, and I inherit the town's history. You cannot take the deed without the ghost.

  Then, there is the third debt. Moral guilt. This is where I stand alone. My great-great-grandfather was on the boat that night. I do not know if he held a weapon. I do not know if he looked away. I only know he went home to sleep, and the eleven men did not. That bloodline is mine. When I look at the names on this plaque, I am not looking at strangers. I am looking at the men my ancestor failed to protect, or perhaps failed to respect. That is a private ledger. I cannot ask you to balance it. I can only carry it.

  And finally, there is the fourth debt. Metaphysical. I am alive. They are dead. I am comfortable. They were broken. There is a solidarity among human beings that is violated when one group survives by extinguishing another. As long as I breathe air in this valley that they were denied, I owe a debt to the fact of their absence.

  So, when I say "we" today, I am not saying we are all murderers. I am saying we are all heirs.

  The descendants of the eleven men are here. You have told us clearly: you do not want an apology. An apology is a period at the end of a sentence. It suggests that once the words are spoken, the account is settled. You have told us you want this book kept open. You want the question to remain sharp.

  The descendants of the town are here, too. Some of you are neighbors. You are worried that this memorial makes you guilty by association. It does not. But it does ask you to stop pretending the ground is solid.

  So, what do we do with these debts? We cannot pay them in sorrow. Sorrow evaporates. We cannot pay them in legal findings. The courts of 1874 are closed, and the courts of today have different jurisdiction.

  We can only pay in obligation.

  The Commission is establishing a permanent endowment. The interest will fund a scholarship for students of labor history, administered outside this county. It will also fund the maintenance of this memorial in perpetuity. Not for five years. Not for ten. In perpetuity. If the stone cracks, we fix it. If the letters fade, we recut them.

  Some will call this a transaction. They will say we are writing a check to clear our conscience. They will say this is how a town buys its way out of the past.

  They might be right.

  Money is easy. Memory is hard. A scholarship is a convenient way to feel virtuous without changing how we live tomorrow. It is possible that this endowment is just a way for us to sleep better at night, knowing we have allocated a budget line item to our guilt.

  I cannot resolve that tension for you. I cannot promise that this money makes us good. It does not. It only makes us bound.

  This commitment is not a solution. It is a structure. It ensures that the cost of this history remains on the town's ledger, year after year. It ensures that the next generation cannot claim they didn't know, because they will have been paid to remember.

  The river keeps flowing. It doesn't care about our guilt. It doesn't care about our scholarship. It only cares about gravity. But we are not the river. We are the people who build on the bank. We have to decide what weight the ground can hold.

  We are not closing this file. We are not healing this wound. We are simply acknowledging that it is still bleeding, and we are the ones who have to hold the cloth.

  The memorial is dedicated. The debt remains.

  Thank you.
