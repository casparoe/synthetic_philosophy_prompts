      *   *Self-Replication:* Certain strands + enzymes produce copies of themselves.
      *   *Isomorphism:* The string manipulation can be mapped to arithmetic (TNT - Typographical Number Theory). A string can represent a statement about numbers, which can represent a statement about strings. Thus, a string can say "I am not provable" or "I am copying myself."
      *   *The Satirical Angle:* Bureaucracy meets undecidability. If a strand says "I am unsafe" or "I am not a product," is it true? If it copies itself, is it manufacturing (regulated) or reproduction (biological/undefined)?

