answer: |-
  **Loss & Damage Frequently Asked Questions**

  1. **What property is covered under my policy?**
  Policies distinguish strictly between the Art Object and the Material Constituent. Although these entities share the same spatial location during transit and storage, they are separate insurable items. Coverage applies only to the specific entity listed on your schedule. Insuring the Art Object does not automatically cover the Material Constituent, and vice versa.

  2. **Are the Art Object and Material Constituent the same item?**
  No. The Art Object depends on form for its identity; the Material Constituent depends on mass. Because one can cease to exist while the other persists, they are numerically distinct. A policy treating them as identical would fail to account for scenarios where matter survives the destruction of art.

  3. **How is damage assessed during a claim?**
  Adjusters evaluate form and mass separately. If the form is compromised (e.g., a dent) but the mass remains intact, the Art Object is damaged. The Material Constituent is considered undamaged. Claims apply only to the Art Object in this instance. No payout is issued for the Constituent.

  4. **What constitutes a total loss?**
  If the form is destroyed, such as by melting or crushing, the Art Object is a total loss. The Material Constituent survives as unshaped matter. You are owed the declared value of the Art Object. The Material Constituent remains your property, unchanged in mass, and is not subject to loss compensation.

  5. **Is insuring both entities considered double insurance?**
  No. Insuring both covers two distinct risks. Insuring only the Art Object leaves the Material Constituent unprotected against material degradation unrelated to form, such as chemical decay. Insuring only the Constituent leaves the artistic value exposed. Premiums are calculated per distinct entity, not per crate.

  6. **How are missing parts handled?**
  The Art Object cannot lose parts without becoming a different Art Object. The Material Constituent loses mass. Both sustain damage, but distinct claims must be filed. A missing chip is a loss of form for the Object and a loss of mass for the Constituent. Deductibles apply to both claims separately.

  7. **How many objects are in a crate?**
  Counting depends on boundaries. A crate with one sculpture contains one Art Object and one Material Constituent. However, loose fragments constitute additional Material Constituents. If a fleck detaches, it becomes a new Material Constituent. The crate then contains one Art Object (damaged) and multiple Material Constituents.

  8. **Can I recast a lost statue using the original matter?**
  Recasting creates a new Art Object. The original Art Object remains lost. The Material Constituent may be reused, but the policy covers the original distinct entity. You cannot claim the new Art Object under the old policy number, as it is a numerically different thing with a different creation date.

  9. **Do storage fees differ based on object count?**
  Fees are based on spatial volume, not object count. Since both objects occupy the same space simultaneously, you are not charged twice for storage volume. However, inventory logs must list both entities to ensure accurate tracking of distinct identities within the shared coordinate space.

  10. **What proof is required for a claim?**
  Claimants must demonstrate the cessation of the Art Object while noting the continuity of the Material Constituent. Photos must show intact matter where form once existed. Statements asserting the matter is "just the statue" will be rejected as metaphysically inaccurate and insufficient for processing.

  **Appendix: Insurable Object Count**

  | Item Description | Art Objects | Material Constituents | Total Insurable Entities |
  | :--- | :---: | :---: | :---: |
  | Cast Sculpture | 1 | 1 | 2 |
  | Bag of Clay | 0 | 1 | 1 |
  | Loose Fragments (per fleck) | 0 | 1 | 1 |
  | **Total (Standard Crate)** | **1** | **2+** | **3+** |

  **Q: Are they really just one thing?**
  A: No. If they were one thing, they would share all properties. They do not. One survives crushing; the other does not. Policy reflects this distinction.
