answer: |-
  Here is a precise theoretical framework designed to sort your cases, followed by the mapping, the bullet-biting, and the prediction.

  ### The Principle: The Test of Ownable Concessions

  A compromise is legitimate if and only if it satisfies three clauses and one exception.

  **Clause 1: Standing (The Ownership Test)**
  Parties must possess the moral or legal authority to concede the points in question. You cannot trade rights, truths, or resources that belong to a third party who is not represented, unless you are acting as a certified fiduciary (e.g., a parent for a child, a doctor for a patient) bound by their best interests.

  **Clause 2: Reason-Giving (The Merit Test)**
  The outcome must be defensible by reasons independent of the negotiation itself. The justification cannot be merely "we met in the middle." The compromise must produce an outcome that is *intrinsically* reasonable, not just *procedurally* agreed upon. This distinguishes a **trade** (optimizing values) from an **average** (splitting the difference on a axis where the middle may be wrong).

  **Clause 3: Non-Exploitation (The Power Test)**
  The agreement must not rely on asymmetric leverage unrelated to the merits of the claim. If one side wins because they can endure pain longer (litigation funds, strike funds) rather than because their claim is stronger, the compromise is coerced, not consensual.

  **The Exception: The Catastrophe Override**
  Clause 1 (Standing) may be overridden *only* when the alternative is imminent, catastrophic harm to the very third parties whose rights are being traded, and no other option exists. This is the "Trolley Problem" clause.

  ---

  ### Case Mapping

  Here is how the principle sorts your pile.

  **The "Fine" Pile (Legitimate)**
  *   **Roommates / Neighbors / Parents:** Pass all three. They own the rights (their home, their time, their kids' upbringing). The outcomes are reasonable (stability). No coercion.
  *   **Union Contract:** Passes Standing (union reps own the mandate) and Non-Exploitation (assumed good-faith bargaining). Passes Reason-Giving (security vs. cash is a standard value trade).
  *   **Hospital Ethics:** Passes Standing (doctors are fiduciaries for the patient's *medical* interest, family for their *emotional* interest). Passes Reason-Giving (a time-limited trial is medically defensible, not just a split difference).

  **The "Bothersome" Pile (Illegitimate)**
  *   **Wetland Development:** **Fails Clause 2 (Merit).** Splitting the acres 50/50 is an arithmetic average, not a reason-based solution. If the science says 100% preservation is needed, 50% is wrong. If the economics say 100% development is viable, 50% is inefficient. The middle is defensible only by the fact of the deal, which violates the Merit Test.
  *   **Legislator (Surveillance):** **Fails Clause 1 (Standing).** A legislator is a fiduciary for the public's rights. Civil liberties are not their property to barter for healthcare funding. This is alienation of duty, not compromise.
  *   **Inheritance (80/20):** **Fails Clause 3 (Non-Exploitation).** The split reflects litigation leverage, not entitlement.
      *   *Your Veil of Ignorance intuition:* You noted this becomes "fine" if they'd agree behind a veil of ignorance. That is correct. The Veil neutralizes Clause 3. If the deal holds without the leverage, it passes.

  **The "Ambiguous" Pile (Contextual)**
  *   **Friends (Politics Truce):** **Not a Compromise.** This fails the definition of compromise because nothing is resolved; it is avoidance. It passes legitimacy (they own their conversation), but it doesn't solve the underlying conflict. It's a *modus vivendi*, not a settlement.
  *   **Peace Deal (Amnesty):** **Passes via Catastrophe Override.** It fails Clause 1 (victims' justice is traded without their consent). However, if the alternative is continued war (catastrophic harm to victims), the Override activates. It is a *tragic* legitimacy, not a clean one.
  *   **Scientist (Softening Conclusions):** **Fails Clause 1 & 2.** (See Bullet-Biting below).

  ---

  ### Where The Principle Bites The Bullet

  You asked where the theory must overrule your intuition. There are two places.

  **1. The Scientist (Overruling the "Tradecraft" Intuition)**
  *   **Your Intuition:** Some days this feels like ordinary tradecraft.
  *   **The Principle's Verdict:** **Always Illegitimate.**
  *   **Why:** Truth is not a negotiable interest; it is an external constraint. A scientist is a fiduciary for the data, not the policy outcome. Softening a conclusion to secure a recommendation is a violation of Clause 1 (Standing). You do not own the truth; you witness it. If the evidence supports a strong conclusion, trading it for a policy win is corruption, not compromise. The principle forces you to categorize this as a moral failure, even if "everyone benefits."

  **2. The Amnesty Deal (Overruling the "Moral Failure" Intuition)**
  *   **Your Intuition:** You struggle to distinguish this from the Legislator case, as both trade third-party rights.
  *   **The Principle's Verdict:** **Potentially Legitimate (unlike the Legislator).**
  *   **Why:** The distinction is the **Catastrophe Override**. The Legislator trades rights for *goods* (healthcare expansion). The Peace Deal trades rights for *survival* (ending war).
      *   If the war ends: Legitimate (tragic, but necessary).
      *   If the war continues anyway: Illegitimate (rights sacrificed for nothing).
      *   The principle demands you verify the *necessity*. If there was a way to end the war *without* amnesty, the amnesty deal becomes illegitimate. The Legislator case is almost always illegitimate because rights violations are rarely the *only* path to healthcare.

  ---

  ### The Prediction: A New Case

  You asked for a case where the **Trade Reading** and the **Averaging Reading** come apart, to test the Merit Test (Clause 2).

  **The Case: The School Curriculum**
  A school board is deciding on a biology curriculum.
  *   **Group A:** Demands 100% Evolutionary Biology.
  *   **Group B:** Demands 50% Evolutionary Biology, 50% "Intelligent Design."

  **Option 1 (The Average):** The board agrees to teach 75% Evolution, 25% Intelligent Design.
  *   *Negotiation View:* A successful compromise. Both sides moved.
  *   *Principle View:* **Illegitimate.** Fails Clause 2 (Merit). Scientific truth is not a spectrum where the middle is reasonable. 25% falsehood is still falsehood. The "average" is intellectually indefensible regardless of the agreement.

  **Option 2 (The Trade):** The board agrees to teach 100% Evolutionary Biology in science class, but creates a new elective "History of Scientific Ideas" where Intelligent Design is discussed as a cultural/sociological phenomenon, not science.
  *   *Negotiation View:* A complex trade. Group A gets science integrity; Group B gets their worldview acknowledged.
  *   *Principle View:* **Legitimate.** This passes Clause 2. The outcome is defensible on reasons external to the deal (Science class teaches science; History class teaches ideas). It respects the boundary of truth while accommodating social friction.

  **Why this matters for your piece:**
  This predicts that **legitimate compromise expands the pie; illegitimate compromise splits the difference.**
  *   In the Wetland case (your "Average"), they split the acres. (Illegitimate).
  *   In the Hospital case (your "Fine"), they created a *new option* (Time-Limited Trial) that didn't exist before. (Legitimate).

  Your piece's thesis could be: **Legitimacy isn't found in the midpoint; it's found in the invention of a third option that respects the constraints of truth and authority.**
