  It turns upon itself and finds it spread,
  The web is woven tight by every thread.

  III.

  Seek a reason for the thing you know
  Know that every reason breeds another
  Another step extends the path ahead
  Ahead lies no completion, only more
  More reasons waiting to be called upon
  Upon this track there is no final stone
  Stone walls are built by those who fear the distance
  Distance is not error, it is life
  Life of the mind is motion without rest
  Rest is an illusion we invent
  Invent new links to stretch the chain again
  Again the question rises from the pen
  Pen in hand we write the next demand
  Demand for reasons never fully
