answer: |-
  # JOINT STATEMENT ON NARRATIVE AND EXPLANATION IN HISTORICAL INQUIRY

  **Signed:** The Working Group on Historical Explanation (Narrative & Quantitative Camps)
  **Date:** October 2023
  **Subject:** Adversarial Collaboration Protocol and Statement of Dispute

  ### I. AGREED CLAIMS

  We, the undersigned, acknowledge that while our methodologies diverge, we share a common epistemic landscape. The following claims are accepted by both camps as the baseline for this collaboration.

  1.  **The Incompleteness of the Archive:** Both sides accept that the historical record is constitutively incomplete. No archive captures the total state of the world at any prior moment. Consequently, every historical account involves selection. The disagreement lies not in *whether* selection occurs, but in the criteria by which selections are justified (coherence vs. statistical representativeness).
  2.  **The Necessity of Selection:** Because the archive is incomplete, no account can include all data. "Bias" in the sense of "non-random selection" is unavoidable. The goal of inquiry is not to eliminate selection but to manage the distortion it introduces.
  3.  **The Meaning of Inevitability:** When historians claim an outcome was "inevitable," neither side interprets this as physical or logical necessity (i.e., that the outcome *could not* have been otherwise in a deterministic sense). Both sides agree that historical "inevitability" is a claim about high conditional probability given a specific configuration of constraints and agents.
  4.  **The Reality of Hindsight Bias:** Both sides accept the standing laboratory results regarding hindsight bias: when subjects are told an outcome has occurred, they systematically rate that outcome as having been more probable *ex ante* than subjects who are not told the outcome. We agree to call the contamination of a reader's sense of prior likelihood by knowledge of how things turned out **outcome leakage**.
  5.  **Shared Vocabulary:** To prevent equivocation, we adopt the following definitions for the duration of this inquiry:
      *   **Outcome Leakage:** The inflation of perceived prior probability due to knowledge of the actual outcome.
      *   **Arc Pressure:** The demand that an account have a shape, such that episodes fitting the arc get credited with more causal weight than the record supports, while episodes that do not are quietly dropped.
      *   **Ex Ante Grip:** The degree to which an account, presented with its ending removed, would have constrained a competent contemporary's expectations.
      *   **Retrodictive Fit:** The degree to which an account makes the known outcome look necessary after the fact.

  ### II. STATEMENT OF DISAGREEMENTS

  | Issue | The Narrative Camp (Historians/Philosophers) | The Quantitative Camp (Social Scientists/Psychologists) |
  | :--- | :--- | :--- |
  | **1. The Ontology of Explanation** | Historical explanation is *constitutively* narrative. To explain why something happened just *is* to tell a story about agents, intentions, and consequences. Narrative form is not a decorative wrapper; it is the mechanism of understanding. | Narrative is a *bias engine*. The features that make an account readable (beginning/end, turning points, intentional cast) manufacture the impression that the outcome was bound to happen. Explanation should prefer accounts that survive having their plots stripped away. |
  | **2. The Status of Hindsight** | The feeling of inevitability in a successful historical account is often a sign of understanding, not error. It reflects the reconstruction of the actors' own logic, which often narrowed the possibility space significantly. | The feeling of inevitability is primarily a cognitive error. It conflates *retrodictive fit* with *ex ante grip*. Rational inquiry must discount the subjective sense of "it had to be this way" as a product of **outcome leakage**. |
  | **3. Causal Weighting** | **Arc pressure** is a necessary heuristic. Human affairs are driven by meaning-making agents; therefore, events that resonate with the agents' own narrative understanding of their situation carry more causal weight than structural drift. | **Arc pressure** is a distortion. It privileges dramatic moments over structural variables. Causal weight should be assigned based on counterfactual robustness, not on how well an event serves a plot's turning point. |

  ### III. THE CRUXES

  We identify two specific sub-questions where settlement would move at least one side. For each, we specify the agreed-upon test case and the divergent predictions.

  **Crux 1: The Nature of Hindsight**
  *Sub-question:* Is hindsight bias a distortion of rational judgment, or merely what rational conditionalizing on evidence looks like from the far side of the event?

  *   **Agreed Test Case:** The Cuban Missile Crisis (1962). Both sides agree the documentation is sufficient to reconstruct the *ex ante* information available to ExComm.
  *   **Method:** Two versions of a briefing document will be prepared. Version A presents the evidence as a plotted narrative (focusing on Kennedy/Khrushchev intentions, the "thirteen days" arc). Version B presents the evidence as a bare sequence with causal weights marked (focusing on missile ranges, probability estimates, structural constraints), with the ending removed.
  *   **Narrative Camp Prediction:** Version A will demonstrate higher **ex ante grip**. Competent contemporaries would have relied on the narrative logic of the actors (honor, deterrence, domestic politics) to constrain expectations. If Version B yields lower perceived probability, it is because it strips out the actual drivers of the event (agency). **Outcome leakage** is present in both, but Version A's **retrodictive fit** is earned through accurate modeling of agent logic, not just bias.
  *   **Quantitative Camp Prediction:** Version A will show significantly higher **outcome leakage** than Version B. Readers of Version A will rate the resolution as more probable than the actual *ex ante* probabilities warrant. Version B will yield a probability distribution closer to the actual uncertainty felt at the time. The "logic of the actors" is often a post-hoc rationalization; **arc pressure** in Version A will inflate the causal weight of dramatic communications while ignoring structural luck.

  **Crux 2: The Demand for Plot**
  *Sub-question:* Is the demand for a plot a defect peculiar to narrative, or a feature of any explanation that has to be about something in particular?

  *   **Agreed Test Case:** The 2008 Financial Crisis. Both sides agree this episode is well-documented and genuinely contestable regarding the weight of individual agency vs. systemic drift.
  *   **Method:** Subjects will be asked to identify the primary cause of the crisis after reviewing materials. Group 1 receives a "Story" treatment (focusing on specific CEOs, the Lehman weekend, the "villains"). Group 2 receives a "System" treatment (focusing on interest rate curves, regulatory frameworks, housing starts), explicitly lacking a climax or resolution.
  *   **Narrative Camp Prediction:** Group 1 will produce explanations with higher **ex ante grip**. Because the crisis was mediated through human decisions (Lehman brothers, Treasury Secretary), an account without a plot cannot capture the causal mechanism. **Arc pressure** is not a bug; it is the only way to weight the specific decisions that tipped the system. A plotless account will fail to explain *why* the crash happened *then*.
  *   **Quantitative Camp Prediction:** Group 2 will produce explanations with greater counterfactual robustness. Group 1 will succumb to **arc pressure**, crediting the Lehman weekend with more causal weight than the record supports because it fits the "climax" role. If the System treatment fails to constrain expectations, it is because structural explanations are inherently probabilistic, not because they lack a plot. The demand for a climax is a defect of the "Story" treatment that manufactures false **retrodictive fit**.

  **Contingency:**
  If, in Crux 1, both versions yield identical probability ratings, the Quantitative Camp concedes that **outcome leakage** is not uniquely driven by narrative form. If, in Crux 2, the "System" treatment is rated as unintelligible by competent contemporaries, the Narrative Camp concedes that explanation requires intelligibility, which may require plot, but the Quantitative Camp reserves the right to argue that intelligibility is not truth.

  ### IV. NOTE ON VERBAL DISPUTES

  We acknowledge that a portion of this quarrel is verbal. The word "narrative" is performing at least three distinct jobs in this dispute:

  1.  **Genre:** A style of prose with a plot, characters, and a climax.
  2.  **Structure:** The minimal temporal-causal ordering (A happened, then B) required for any explanation whatsoever.
  3.  **Ontology:** A substantive claim that human affairs are driven primarily by agency and intention rather than structural forces.

  **Dissolvable Disputes:**
  Much of the friction arises because the Quantitative Camp attacks "narrative" in the *Genre* sense (Job 1) to protect against errors in reasoning, while the Narrative Camp defends "narrative" in the *Structure* sense (Job 2) to claim that history is intelligible. If the Quantitative Camp acknowledges that all explanation requires temporal-causal structure (Job 2), and the Narrative Camp acknowledges that literary plotting (Job 1) introduces specific risks of **arc pressure**, this terminological layer of the fight dissolves.

  **Genuine Disputes:**
  The conflict remains substantive regarding *Ontology* (Job 3). The Narrative Camp holds that agency is the dominant causal force in history, making the "story of agents" the most truthful representation. The Quantitative Camp holds that structural forces often dominate agency, making the "story of agents" a systematic distortion.

  **Implication:**
  The fight has lasted this long because both sides are correct about different jobs of the word. The Quantitative Camp is right that *Genre* creates **outcome leakage**. The Narrative Camp is right that *Structure* is necessary for *ex ante grip*. However, until they settle whether human affairs are primarily driven by Agents (supporting Narrative Ontology) or Systems (supporting Quantitative Ontology), they will continue to talk past each other. The Cuban and 2008 tests are designed to force this ontological question into the open, moving the debate from "Is story bad?" to "What drives the world?"
