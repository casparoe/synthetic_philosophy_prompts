          *   Avoid the "novelist's error" (don't claim to know feelings).
      *   *Key argument:* The archive doesn't reveal the subject; it reveals the power structure acting upon the subject. Microhistory works best when it admits deviation, not when it claims typicality. History from below is a political commitment that requires methodological humility.

  4.  **Drafting the Marking Scheme:**
