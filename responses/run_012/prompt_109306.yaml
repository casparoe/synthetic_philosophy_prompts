      *   *Drafting:* "Consider a hypothetical archive containing only four documents regarding an illiterate peasant woman..."
      *   *Refining:* Make it about the *tension* between the disciplines. Ask them to evaluate the epistemological cost of the reconstruction.
      *   *Final Polish:* Ensure all three required constraints (source asymmetry, microhistorical weight, definition of history from below) are embedded in the prompt's instructions.

  3.  **Drafting the Model Answer:**
      *   *Length:* ~600 words.
      *   *Tone:* Academic, precise, critical.
      *   *Content:*
