      *   **Goal:** A final exam essay question (2-hour, closed-book) that makes this slide visible.
      *   **Requirements for the Question:**
          1.  Address source asymmetry (institutions interrogating/punishing/taxing the poor).
          2.  Address microhistorical weight (typical vs. documented vs. deviant).
          3.  Address the nature of "history from below" (method vs. subject vs. politics).
          4.  Cannot be answered by slogans or summarizing famous case studies (e.g., Ginzburg, Davis).
      *   **Deliverables:**
          1.  One Essay Question.
          2.  Model Answer (~600 words).
          3.  Marking Scheme (distinguishing A from B based on specific moves, not just names; must penalize the "novelist's error" of treating vivid reconstruction as inference).

  2.  **Drafting the Essay Question:**
