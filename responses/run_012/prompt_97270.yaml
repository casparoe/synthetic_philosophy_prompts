  - make him pin down what he means by legitamacy, because I swear he slides between "people think it's legit" and "it really is legit" and those are completely different, and only the second one is even a moral claim. If he goes with the first, give me a follow-up showing that's not enough for what he's trying to argue.
  - how do you actually measure "performance," and who picks the scoreboard? If he says GDP growth or low crime, push on which years he's allowed to pick and whether growth from a really low starting point counts the same as growth from a high one.
  - the counterfactual: would a democracy have done worse? He always just asserts democracy would've been chaos, but South Korea and Taiwan got rich and then democratized, so I want to press that.
