  Ok so for our school current affairs magazine I somehow got picked to interview this visiting fellow at a think tank, and his whole thing is that authoritarian governments can be legitimate as long as they deliver prosperity and order -- he always points at China and Singapore. I want the interview to actually push him instead of letting him say "look at the skyline" for the tenth time. Can you write me like nine or ten questions?

