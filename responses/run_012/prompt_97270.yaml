  The tone is sharp but polite—sounding like a student who's done the reading, not a professor giving a lecture. Each follow-up is designed to catch him if he tries to dodge.

  ### 1. The Definition of Legitimacy
  **Question:** I want to start on the word "legitimacy," because I think you slide between two meanings. Do you mean that people *believe* the government is legitimate, or that it *is* legitimate regardless of what they think? Those seem like completely different claims.

  **Follow-up:** If you're saying it's just about what people believe, isn't that a low bar? If a regime manipulates information so people *think* they're fine, does that make it legitimate in your book, or do you need something more moral than just acceptance?

  ### 2. Measuring Performance & Sustainability
  **Question:** You hinge a lot on "performance"—usually GDP or crime rates. But who picks the scoreboard? Does growth count the same when a country is starting from zero versus when it's already rich, and are you allowed to cherry-pick which years count?

  **Follow-up:** And if the deal is "prosperity for obedience," what happens when the prosperity stops? If the economy slows or an aging crisis hits, does the legitimacy just evaporate? Is this basically a fair-weather theory?

  ### 3. The Democratic Counterfactual
  **Question:** You often assert that democracy would've brought chaos to places like China, but look at South Korea and Taiwan. They got rich and then democratized without collapsing. Why assume authoritarianism was necessary for their growth rather than just coincidental?

  **Follow-up:** Plus, there's this concept called "preference falsification." How do you actually know people agree with the regime, versus just not daring to say otherwise because dissent is punished? Can you trust surveys in that environment?

  ### 4. Distribution & Scale
  **Question:** Even if the average person is better off, averages can hide a lot. Who pays for this prosperity? Are we ignoring migrant workers, minorities, or people who got locked up who don't benefit from the skyline?

  **Follow-up:** And on Singapore—it comes up a lot, but it's basically a city-state. Can you really hold it up as a model for huge, messy countries without just falling back on "context matters"? If context matters that much, can you generalize the lesson at all?

  ### 5. The Consistency Check
  **Question:** Last thing: Can you name a case where a regime delivered great growth and order but you'd still call it illegitimate? I want to see if performance is really doing all the work in your argument.

  **Follow-up:** If you can't name one, does that mean performance is the *only* thing that matters to you, even over rights? Or are you sneaking in some other moral standard you haven't told us about?
