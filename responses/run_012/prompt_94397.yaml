answer: |-
  1. When applying the isolation test to an unperceived beautiful object, does a negative verdict reveal something about beauty or merely that the test tracks something narrower than intrinsic value? If you claim it reports considered judgments, what prevents it from simply reporting prejudices about what is natural?

  2. If the value of aesthetic enjoyment is conditional on the object's beauty, does this not falsify Moore's claim that the greatest goods are states of consciousness? If you argue the whole is just a complex state of consciousness, what does the conditionality add that a bare appeal to organic unity would not already supply?

  3. Does affection value the friend for their own sake or the relation itself? If you say the relation is the bearer of value, what does the isolation test deliver for a world containing a single person who loves another who does not exist?

  4. If the value of a whole is not the sum of its parts, what constrains which wholes count as genuine unities? Specifically, what would show that a proposed organic unity is spurious rather than allowing any whole to be assigned any value by positing one?

  5. Since Moore treats goodness as simple and indefinable, how do you address an interlocutor whose isolation intuitions suggest a world of unperceived beauty is no worse than one of appreciated beauty? Can your view call that interlocutor mistaken rather than merely differently constituted, and if so, where exactly does the mistake lie?
