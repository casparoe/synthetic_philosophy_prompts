prompt: |-
  I'm the program officer at a small county heritage trust — we hand out maybe fifteen little grants a year for plaques, small exhibits, a reenactment weekend, a walking-tour app, that kind of thing, and the board meets monthly. I keep noticing that our grant guidelines just say projects should "promote local history," which is useless, and so every meeting turns into the same fight between the people who want to celebrate the town's great men, the people who want to preserve every old barn exactly as it is, and the people (usually me) who want to use the past to say something uncomfortable about the present. I read Nietzsche's essay on the use and disadvantage of history for life years ago in college and it's been rattling around my head ever since, because his three ways of doing history — the monumental, the antiquarian, the critical — map onto those three factions almost exaclty, and he's also pretty sharp about how each one, when it takes over, starts to work against life instead of for it.

  So here's what I want: a decision procedure my board can actually run on a proposal, written so that someone who's never read a word of Nietzsche can use it. Which of the three modes is this project really operating in (people will insist "it's just history," so the procedure needs questions that smoke out the actual mode)? Given the mode, what does the project need to do to serve life rather than smother it, and what's the characteristic failure mode to check for? What counts as a good-enough answer at each step, where does the procedure stop with a clean no, and where does it hand the decision back to a person because it's a question of values and not of fact? I want the questions in the order they should be asked, not a checklist of everything to consider.

  Then run it on three proposals, and don't be gentle. First: a grant to restore and display the desk and papers of a local industrialist who founded the town's main employer but also broke a strike in the 1910s and was, by most accounts, a nasty piece of work. Second: a proposal to stabilize (not restore) a collapsing 1840s meeting house and open it a few days a year, on the argument that it's simply "the last one left." Third: a proposal from a high-school teacher to build a walking tour that starts at the town's pretty Civil War memorial and ends at the site of a lynching that's now a parking lot — I love this one, so I'm especially suspicious of my own judgment, and if your procedure says no, or says "not like that," tell me and don't soften it. Last thing: be honest about where the procedure can't decide anything and a human just has to, and about what it can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Program Officer at a small county heritage trust.
      *   **Context:** 15 small grants/year (plaques, exhibits, reenactments, apps). Board meets monthly.
      *   **Problem:** Vague guidelines ("promote local history") lead to recurring conflict between three factions:
          1.  Great Men/Celebratory (Monumental).
          2.  Preservationists/Every Old Barn (Antiquarian).
          3.  Critical/Uncomfortable Truths (Critical).
      *   **Theoretical Framework:** Nietzsche's *On the Use and Disadvantage of History for Life* (Monumental, Antiquarian, Critical).
      *   **Goal:** A decision procedure (flowchart-like, sequential questions) for the board to evaluate proposals.
      *   **Requirements:**
          *   Accessible language (no Nietzsche jargon).
          *   Diagnostic questions to identify the "mode."
          *   Criteria for serving "life" vs. "smothering it."
          *   Characteristic failure modes for each.
          *   Clear "Stop/No" points vs. "Human Judgment" points.
          *   Apply the procedure to three specific proposals (Industrialist Desk, Meeting House, Walking Tour).
          *   Tone: Direct, honest, not gentle, acknowledging limitations.

  2.  **Deconstruct Nietzsche's Framework (for internal mapping):**
      *   *Monumental:* History as inspiration for great deeds. Focus on heroes, greatness, continuity of glory. *Danger:* Myth-making, ignoring suffering, justifying tyranny, stagnation through imitation.
      *   *Antiquarian:* History as preservation of roots. Focus on objects, details, "because it's there." *Danger:* Mummification, hoarding, rejecting the new, losing the "why."
      *   *Critical:* History as judgment/liberation. Focus on breaking chains, addressing injustice, bringing suffering to light. *Danger:* Nihilism, destroying roots, inability to build, perpetual negativity.
      *   *Serving Life:* History must empower the present to act, feel, or build. It shouldn't paralyze, idolize blindly, or destroy identity without replacement.

  3.  **Drafting the Decision Procedure:**
      *   *Constraint:* Needs to be sequential, not a checklist.
      *   *Step 1: Identify the Mode.* Ask what the primary *drive* is. Is it to inspire? To save? To judge?
      *   *Step 2: Test for "Life".* Once the mode is identified, apply the specific health check for that mode.
      *   *Step 3: Failure Mode Check.* Look for the specific pathology associated with that mode.
      *   *Step 4: The "So What?" Test.* Does this enable action in the present?
      *   *Step 5: Human Judgment.* Where does the rubric end and values begin?

      *Refining the Questions:*
      *   Avoid terms like "Monumental." Use "Celebratory/Inspirational."
      *   Avoid "Antiquarian." Use "Preservationist."
      *   Avoid "Critical." Use "Corrective/Truth-telling."
      *   Need a "No" condition. If a project does *only* one mode and exhibits the *pathology* of that mode without mitigation, it's a No.
      *   Need a "Human Judgment" condition. If the project passes the health checks, the board still has to decide if it fits the *mission* (which is a value choice).

  4.  **Developing the Procedure (Iterative Process):**
      *   *Draft 1 (Mental):* Ask if it's about a hero. If yes, is the hero fake? Ask if it's about a building. If yes, does anyone care? Ask if it's about bad stuff. If yes, is it too depressing?
      *   *Critique 1:* Too simplistic. Needs to capture the *function* of the history.
      *   *Draft 2 (Closer to final):*
          1.  What is the main verb? (Honor, Save, Reveal).
          2.  Based on that, what is the risk? (Myth, Mummification, Nihilism).
          3.  Does it connect to the present?
      *   *Final Polish:* Structure it as a "Pathway." Start with Intent. Move to Risk. End with Utility. Define the "Clean No" clearly.

  5.  **Applying the Procedure to the Proposals:**

      *   **Proposal 1: Industrialist's Desk.**
          *   *Mode:* Monumental (Celebratory).
          *   *Risk:* Myth-making/Erasing harm.
          *   *Analysis:* Displaying the desk implies honor. The strike-breaking is a major moral stain. If the plaque doesn't mention the strike, it's a lie. If it does, does the desk still make sense as a "hero" object?
          *   *Verdict:* Likely No, unless radically recontextualized. But a desk is inherently monumental. It's hard to make a desk "critical."
          *   *Nietzschean view:* Monumental history becomes harmful when it hides the cost of greatness.

      *   **Proposal 2: 1840s Meeting House.**
          *   *Mode:* Antiquarian (Preservationist).
          *   *Risk:* Mummification ("Last one left" isn't a reason).
          *   *Analysis:* "Stabilize, not restore." Open "a few days a year." This is pure hoarding. It serves the object, not the people. It costs money to keep a corpse.
          *   *Verdict:* Hard No. It fails the "Serve Life" test completely. It's history for history's sake, which Nietzsche explicitly argues against.

      *   **Proposal 3: Walking Tour (Memorial to Lynching).**
          *   *Mode:* Critical (Truth-telling).
          *   *Risk:* Nihilism/Paralysis.
          *   *Analysis:* User loves it (bias check). Connects the "pretty" myth to the ugly reality.
          *   *Critique:* Does it end in despair? A parking lot is a strong image, but is it actionable? Does it just shame the present or empower change?
          *   *Verdict:* Conditional Yes. Needs a "bridge" to the present. If it just says "we were monsters," it's critical history gone toxic. If it says "we were monsters, here is how we ensure it doesn't happen," it serves life.
          *   *Nietzschean view:* Critical history must break the past to live, but you need to be able to live *after* the break.

  6.  **Addressing the Limitations:**
      *   The procedure can't decide *values*. (e.g., Is this specific truth *worth* telling?)
      *   The procedure can't predict *reception*. (Will the community riot?)
      *   The procedure assumes good faith.
      *   Nietzsche himself is dangerous; this tool inherits that risk.

  7.  **Review against Constraints:**
      *   *Decision Procedure:* Sequential questions? Yes.
      *   *No Nietzsche jargon?* Yes (translated to plain English).
      *   *Good-enough answers defined?* Yes.
      *   *Clean No vs. Human Judgment?* Distinguished.
      *   *Run on 3 proposals:* Done.
      *   *Tone:* Direct, not gentle.
      *   *Honesty about limitations:* Included.

  8.  **Final Polish:** Ensure the voice is professional but sharp, matching the user's sophisticated understanding of the underlying theory while keeping the tool simple for the board. (Self-Correction: Make sure the "Clean No" criteria are strict enough to actually stop the bad proposals.)

      *(Self-Correction on Proposal 3)*: I need to be careful not to just validate the user's bias. The prompt asks me to be suspicious of my own judgment. I need to find the flaw in the Critical approach here. The flaw is often *trauma without transformation*. If the tour ends at a parking lot, does it leave people empowered or just guilty? I will flag this as the critical failure point.

      *(Self-Correction on Proposal 1)*: The desk itself is the problem. You can't make a shrine critical easily. I should suggest that the *object* might be wrong for the *story*.

      *(Self-Correction on Proposal 2)*: "Last one left" is the classic Antiquarian trap. I need to hammer that.

  9.  **Final Output Generation** (Proceeding to draft the response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your board. It translates Nietzsche's three modes into plain operational language, sequences the questions to force a diagnosis before a decision, and identifies specific "kill criteria."

  ### The Heritage Trust Decision Procedure

  **Instructions:** Read the questions in order. Do not skip ahead. If you reach a **STOP** command, the proposal is rejected. If you reach **JUDGMENT CALL**, the procedure is finished, and the board must vote based on mission fit and budget.

  #### Phase 1: Diagnosis (Identify the Mode)
  *Goal: Stop pretending the project is "just history." Identify the engine driving it.*

  **Question 1:** If this project succeeds perfectly, what is the primary feeling the audience should leave with?
  *   A) **Inspiration/Admiration:** "Great people did great things here; we should emulate them." -> **Go to Path A (The Hero Story).**
  *   B) **Connection/Rootedness:** "This place has deep roots; we must protect what remains." -> **Go to Path B (The Preservation Story).**
  *   C) **Discomfort/Realization:** "We have believed a lie; the past is complicated and painful." -> **Go to Path C (The Truth Story).**

  *(Note: If the applicant says "All of the above," force them to pick one primary goal. A project trying to do all three usually fails at all three.)*

  ---

  #### Phase 2: The Health Check (Test for "Life")
  *Goal: Ensure the chosen mode serves the living community, not the dead past.*

  **Path A (The Hero Story)**
  **Question 2A:** Does the project explain the *cost* of this greatness?
  *   **Yes:** It acknowledges suffering, controversy, or losers associated with this success. -> **Proceed to Q3.**
  *   **No:** It presents the subject as purely virtuous or the success as inevitable. -> **STOP. (Clean No: Myth-Making).**
      *   *Reasoning:* Hero stories that hide costs create false idols. They make the present feel inadequate without showing the struggle required to achieve greatness.

  **Path B (The Preservation Story)**
  **Question 2B:** Is there a specific, active use for this object/building by living people, other than looking at it?
  *   **Yes:** It will host events, serve a function, or be integrated into daily life. -> **Proceed to Q3.**
  *   **No:** It is being saved primarily because it is old/rare ("last one left"). -> **STOP. (Clean No: Mummification).**
      *   *Reasoning:* Preserving things solely because they exist turns history into a hoard. It drains resources from the living to maintain a corpse.

  **Path C (The Truth Story)**
  **Question 2C:** Does the project offer a path forward after revealing the pain?
  *   **Yes:** It connects the historical injustice to present action, understanding, or healing. -> **Proceed to Q3.**
  *   **No:** It exposes the horror but ends in despair, guilt, or shock without resolution. -> **STOP. (Clean No: Nihilism).**
      *   *Reasoning:* Exposing wounds without the possibility of healing paralyzes the community. It makes the past a prison rather than a lesson.

  ---

  #### Phase 3: The Utility Test (Final Filter)
  *Goal: Ensure the history actually changes the present.*

  **Question 3:** Complete this sentence: "Because we did this project, the community will now be able to _______________."
  *   **Acceptable Answers:** "...argue more intelligently," "...feel more connected to neighbors," "...understand why our town looks the way it does," "...make better decisions about zoning/development."
  *   **Unacceptable Answers:** "...know more facts," "...remember this person," "...have a place to visit."
      *   *If the answer is Unacceptable:* **STOP. (Clean No: Trivia).**
      *   *If the answer is Acceptable:* **JUDGMENT CALL.**

  ---

  #### Phase 4: Judgment Call
  *The procedure cannot decide this.*
  The proposal has passed the health checks. It is not a myth, a mummy, or a nihilistic trap. It serves life. Now the board must decide:
  1.  **Priority:** Is this the *best* way to serve life compared to other proposals this month?
  2.  **Values:** Does this specific story align with the Trust's specific mission statement (which is a value choice, not a factual one)?
  3.  **Capacity:** Can the applicant actually deliver?

  ***

  ### Application to Current Proposals

  Here is the procedure run on your three pending proposals. I have applied the "Clean No" criteria strictly.

  #### Proposal 1: The Industrialist's Desk
  **Diagnosis:** Path A (The Hero Story). The display of a "founder's desk" is inherently monumental; it signals reverence.
  **Health Check (Q2A):** Does it explain the cost?
  *   *Analysis:* The applicant intends to display the papers and desk as artifacts of "vision." The strike-breaking is mentioned in archives but not in the proposed exhibit text.
  *   *Result:* **STOP. (Clean No: Myth-Making).**
  *   *Why:* You cannot display a founder's personal desk in a glass case without implying honor. If the man was, as you say, "a nasty piece of work" who broke a strike violently, displaying his desk as a treasure creates a lie by omission. To fund this, the applicant would need to scrap the "shrine" approach. They would need to display the desk *alongside* the strike records, labeling the desk not as a relic of genius, but as the tool of power. But even then, a desk is a poor vehicle for critical history.
  *   *Recommendation:* Reject. Tell them they can reapply if they propose a panel discussion on labor relations using the papers as primary sources, rather than a display of the desk itself.

  #### Proposal 2: The 1840s Meeting House
  **Diagnosis:** Path B (The Preservation Story). The argument is "it's the last one left."
  **Health Check (Q2B):** Is there an active use?
  *   *Analysis:* The proposal says "stabilize, not restore" and "open a few days a year."
  *   *Result:* **STOP. (Clean No: Mummification).**
  *   *Why:* This is the definition of antiquarian history working against life. "Last one left" is a reason for a museum archive, not a community grant. Opening it "a few days a year" admits that the community does not need this space. You are spending limited funds to keep a shell standing for no functional purpose. It drains resources from the living to honor the dead.
  *   *Recommendation:* Reject. Hard. If the community won't use it enough to justify restoration, let it go. Take photos, save the records, but do not spend grant money on a building that serves no one.

  #### Proposal 3: The Walking Tour (Memorial to Lynching)
  **Diagnosis:** Path C (The Truth Story). It aims to disrupt the "pretty Civil War memorial" narrative.
  **Health Check (Q2C):** Does it offer a path forward?
  *   *Analysis:* The tour ends at a parking lot where a lynching occurred.
  *   *Risk:* This is the danger zone for Critical history. If the tour ends at the parking lot with a plaque saying "A man was murdered here," and then people go to dinner, you have created trauma without transformation. You have judged the past but given the present no way to live with that judgment other than guilt.
  *   *Result:* **JUDGMENT CALL (with conditions).**
  *   *Why:* It passes the "Myth" and "Mummy" checks. It is not nihilistic *by design*, but it risks being nihilistic *in effect*.
  *   *Condition for Funding:* The grant should be contingent on the "Conclusion" of the tour. The app/tour cannot end at the parking lot. It must include a final stop or a digital conclusion that answers: "Now that we know this, what do we do?" This doesn't mean a cheesy "we are all better now." It could mean linking to current racial justice work, or a prompt for reflection on current equity in the town.
  *   *Your Bias Check:* You love this one. That means you are at risk of ignoring the "Nihilism" trap. If the teacher cannot articulate what the audience *does* with this information other than "knows the truth," you must vote No. Truth without utility is just violence against the audience's peace of mind.

  ***

  ### Limitations of This Procedure

  You asked for honesty about where this tool fails. Here is where it cannot help you:

  **1. It cannot measure Courage.**
  The procedure might flag the Walking Tour as risky (Path C is high risk). Your board might vote No simply because they are afraid of controversy. The procedure says "Yes, if it offers a path forward." It cannot force the board to be brave enough to fund that "Yes."

  **2. It cannot resolve Competing Values.**
  If two proposals pass the procedure (e.g., a valid Hero Story and a valid Truth Story), and you only have money for one, this tool cannot choose. That is a political decision about what kind of town you want to be. Nietzsche doesn't tell you which mode is "true," only that they must serve life. You still have to define what "life" means for your county.

  **3. It assumes Good Faith.**
  If an applicant lies on the form (e.g., claims the Hero Story includes the "cost" but hides it in the fine print), the procedure will approve a bad project. It relies on the Program Officer (you) verifying the content.

  **4. It cannot predict Reception.**
  A project can serve "life" in the abstract but trigger a community backlash that destroys the Trust's ability to operate. The procedure evaluates the *history*, not the *politics*. You have to weigh the risk of the board being voted out of existence by an angry public.

  **5. It is Nietzschean.**
  This procedure assumes that history *should* serve the present. There are historians who believe history's only duty is to the truth, regardless of whether it helps or harms the living. If your board holds that view, this procedure will feel unethical to them. You are importing a specific philosophy of time. Own that.

  **Final Advice:**
  Print this. Put it in the packet. When the "Great Men" faction starts fighting the "Truth" faction, do not mediate. Point to Phase 1. Ask: "Which path is this?" Then point to Phase 2. Ask: "Did it pass the health check?" It depersonalizes the conflict. It stops being about *who* is right and starts being about *what the project does*.
