answer: |-
  Your suspicion is well-founded. Your friend's account contains a classic "slipped joint": he conflates the *mathematical equivalence of formal systems* with the *philosophical identification of those systems with reality*. This allows him to make two mutually exclusive claims: that the Thesis is a proved theorem (which cannot be overturned) and that it is an empirical hypothesis (which quantum computing could overturn).

  A specialist in computability theory would find roughly half of that paragraph standard, and the other half a mixture of category errors and common misconceptions. Here is an audit of the passage, claim by claim.

  ### Claim 1
  > *"The Church–Turing thesis is the claim that anything computable by any means whatsoever — by a person following a rule, by a machine, by any physical process you care to name — can be computed by a Turing machine."*

  *   **Verdict:** **Acceptable, but imprecise.**
  *   **The Nuance:** This is the standard informal statement, but experts distinguish between two versions.
      1.  **The Mathematical Thesis:** Concerns "effective calculability" (what a human can do with paper and pencil following a strict rule). This is the original Church-Turing claim.
      2.  **The Physical Thesis:** Concerns what is computable by any physical system in the universe.
  *   **The Wince:** By saying "any physical process you care to name," your friend merges these. The Mathematical Thesis is about *logic*; the Physical Thesis is about *physics*. Most theorists accept the Mathematical Thesis as near-definitive, but the Physical Thesis is contingent on the laws of physics. Your friend treats them as identical, which sets up his later confusion about quantum computing.

  ### Claim 2
  > *"Turing and Church proved it by showing that all the rival attempts to formalise computability — λ-definability, general recursiveness, Turing machines — pick out exactly the same class of functions;"*

  *   **Verdict:** **True, but irrelevant to the conclusion.**
  *   **The Nuance:** It is a mathematical fact that Turing machines, $\lambda$-calculus, and general recursive functions define the exact same class of functions. Turing and Church (and Kleene) did prove this equivalence.
  *   **The Wince:** Your friend implies this equivalence *is* the proof of the Thesis. It is not. It is merely evidence *for* the Thesis. It shows that the formal concept is robust (it doesn't depend on which formalism you pick), but it does not prove that this formal concept captures *all* possible computation in the real world.

  ### Claim 3
  > *"...and since that identification has been proved, the thesis is a mathematical theorem and no future discovery can overturn it."*

  *   **Verdict:** **Simply False.**
  *   **The Nuance:** This is the slipped joint. You cannot prove a bridge between a formal definition (Turing Machines) and an informal intuition ("computable by any means whatsoever") because the informal side is not mathematically defined.
  *   **The Expert View:** The Church-Turing Thesis (CTT) is **not a theorem**. It is a hypothesis. It defines the boundary of the formal system, it is not a result *within* the system. To say it is a theorem is a category error. If it were a theorem, it would be true by definition, and empirical evidence would be irrelevant.

  ### Claim 4
  > *"Its empirical support is that nobody in the decades since has found a counterexample, and that every computer ever built has borne it out."*

  *   **Verdict:** **Acceptable.**
  *   **The Nuance:** Since the Thesis is not a theorem, its support is indeed inductive and empirical. We believe it because every attempt to design a computing model that exceeds Turing machines has either failed or turned out to be Turing-equivalent.
  *   **The Tension:** Notice that accepting this claim requires rejecting Claim 3. If it relies on empirical support, it is not a proved theorem. Your friend is trying to have the security of a theorem with the flexibility of an empirical hypothesis.

  ### Claim 5
  > *"The one thing that could still break it is quantum computing: because a quantum machine explores many computations in superposition at once, it may well compute things that no Turing machine can, and that would be the first genuine counterexample."*

  *   **Verdict:** **Simply False.**
  *   **The Nuance:** This is a very common misconception, even among software professionals. Quantum computers (in the standard model) do **not** violate the Church-Turing Thesis. They violate the *Extended* Church-Turing Thesis (which is about efficiency), but not the original Thesis (which is about possibility).
  *   **The Explanation:** A Turing machine can simulate a quantum computer. It might take an exponential amount of time (making the quantum computer vastly *faster*), but the Turing machine can still compute the same result. Nothing a standard quantum computer can compute is "uncomputable" for a Turing machine.
  *   **What would actually break it:** To break CTT, you would need "hypercomputation"—a physical process that can solve the Halting Problem or compute a non-recursive function. Speculative physics (like certain solutions involving closed timelike curves or infinite precision in continuous variables) might allow this, but standard quantum mechanics does not.

  ---

  ### The Contradiction
  You asked specifically whether the two halves of his conclusion can sit together. **They cannot.**

  1.  **Half A:** "The thesis is a mathematical theorem and no future discovery can overturn it."
  2.  **Half B:** "Quantum computing... may well compute things that no Turing machine can, and that would be the first genuine counterexample."

  If Half A is true, Half B is impossible (a theorem cannot have a counterexample). If Half B is possible, Half A is false (it is not a theorem). Your friend wants the authority of mathematics (it's proved!) to shut down the argument, but reserves the right to empirical science (quantum might break it!) to keep his model up to date. In computability theory, you must choose one: either CTT is a definition (and thus unfalsifiable) or it is a physical claim (and thus falsifiable, but not proved).

  ### The Weight on the Argument (Human vs. Machine)
  Finally, how much weight can this thesis bear in your original argument: *"Could a machine in principle do everything that a human mathematician does?"*

  Your friend used the Church-Turing Thesis to suggest the answer is "Yes." **This is an overreach.**

  1.  **Algorithms vs. Insight:** CTT applies to *effective procedures* (algorithms). It states that if a human is following a strict, rule-based method, a machine can do it. It does **not** state that human mathematical *insight* is rule-based.
  2.  **The Lucas-Penrose Argument:** There is a longstanding philosophical argument (based on Gödel's incompleteness theorems) that human mathematicians can see the truth of statements that no formal system (and thus no Turing machine) can prove. Whether this argument holds is debated, but CTT does not settle it. CTT only says: "If your brain is a computer, it's a Turing computer." It does not prove your brain *is* a computer.
  3.  **The Honest Appeal:** The honest version of your friend's appeal would be:
      > "We have no evidence that human mathematics relies on any process that exceeds Turing-computability. All formalized mathematics we produce is Turing-computable. Therefore, it is a reasonable working hypothesis that a machine could do everything a human mathematician does, *provided* that human mathematics is ultimately formalizable. However, CTT does not prove that human intuition itself is algorithmic."

  ### Summary for Your Next Conversation
  Your friend is right that CTT is the central concept here, but his technical understanding of it is a "standard professional misconception." He treats it as a theorem when it is a definition/hypothesis, and he confuses *computational complexity* (speed) with *computability* (capability) regarding quantum computing.

  You can push back on this specific point: **"If CTT is a proved theorem, quantum computing can't refute it. If quantum computing could refute it, it isn't a theorem. Which is it? And even if it is true, it only applies to rule-following, not to mathematical insight."**

  That targets the slipped joint directly.
