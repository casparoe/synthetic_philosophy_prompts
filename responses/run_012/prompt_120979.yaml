answer: |-
  **What I'd stake my name on**
  Scholars agree Pascal distinguishes three "orders"—body, mind, charity—and that he transforms Montaigne's skepticism through Jansenist theology. There is consensus that he views human justice without God as fundamentally unstable and that the "justice and force" fragment is central. Where they diverge is on whether his political fragments endorse established power as a necessary remedy for sin or merely expose its emptiness. Most read the text as a diagnosis of the Fall, not a theory of law. Your guest's claim that Pascal anticipates legal positivism is a novel, contested intervention, not settled doctrine. Use this distinction to frame your probing.

  **The questions**

  1. Your book argues we've misread Pascal's politics as cynicism. If it's not cynicism, what is the primary purpose of his political fragments?
     *Follow-up:* So is he describing a tragedy or prescribing a remedy?
  2. Let's start with the famous Pyrenees remark: "Truth on this side of the Pyrenees, error on the other." You say this isn't just skepticism about geography.
     *Follow-up:* Is he mocking us for caring about borders, or instructing us to obey them?
  3. You claim custom rather than content is what does the justifying for Pascal. Does that mean law is just simply because it is old?
     *Follow-up:* Does that make might right, or just might unavoidable?
  4. You place the justice-and-force pairing in the "order of the body." Traditionally, justice seems linked to mind or reason. Why put it in the body?
     *Follow-up:* If justice is bodily, where does human reason fit in?
  5. If justice belongs to the body, does the "order of charity" have any political relevance, or is it purely private?
     *Follow-up:* Can the orders ever touch, or are they sealed off?
  6. Pascal insists we're obliged to obey even unjust force. On your reading, is that obligation based on prudence or something theological?
     *Follow-up:* Is that fear of chaos, or fear of God?
  7. If it's theological, is obeying an unjust law a form of penance for the fallen will?
     *Follow-up:* So injustice is something we endure to be saved?
  8. Montaigne already argued custom rules the world. What is Pascal doing that Montaigne hadn't done before the Jansenists got hold of him?
     *Follow-up:* Is grace the only difference, or is the politics different too?
  9. You suggest Pascal is a forerunner of legal positivism. Isn't that anachronistic for a seventeenth-century theologian?
     *Follow-up:* Are you finding positivism in him, or putting it there?
  10. For a listener reading the *Pensées* for the first time, what's the one thing they should notice about power next time they read it?
      *Follow-up:* Should they obey, or should they question?

  **If she stonewalls**
  If she retreats into jargon, gently interrupt: "For our listeners, could you put that in plain English?" If she quotes French, ask for the translation immediately; don't let language bar access. If she says "it's complex," ask for one concrete example from the text. Your job is to bridge her expertise to your audience, not to pass her exam. Remember, you've read the text twice; trust your reading if hers seems to vanish into abstraction.
