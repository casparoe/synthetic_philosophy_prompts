answer: |-
  Your hypothesis is correct: the impasse is primarily driven by question (3), the definitional criterion for 'nation', which dictates the answers to the empirical questions (1) and (2). The dispute is not about the historical facts—which both sides largely agree upon—but about which facts suffice to instantiate the concept.

  **Proportions of Work**
  Question (3) (Definition) does approximately 70% of the work. It functions as the gatekeeper: if 'nation' requires industrial mass mobilization (Gellner), premodern cases are excluded by fiat; if 'nation' requires only myth-symbol continuity (Smith), they are included. Question (5) (Normative Purpose) accounts for roughly 20%. Modernists often define nations narrowly to debunk nationalist claims of antiquity (Hobsbawm's "invented traditions"), while Ethnosymbolists define them broadly to explain nationalism's emotional potency (Smith's "ethnic cores"). Question (4) (Standards of Evidence) constitutes the remaining 10%, determining whether vernacular scripture (Hastings) counts as mass communication equivalent to print capitalism (Anderson). Questions (1) and (2) are not independent drivers but dependent variables; the dating changes only because the definition changes.

  **Residual Empirical Dispute**
  Once definitions are fixed, the theoretical dispute dissolves. If we stipulate "nation = sovereign political community," Modernists win; if "nation = cultural community with ancestry myths," Ethnosymbolists win. A small empirical residue remains regarding the *extent* of premodern literacy or identity (e.g., how many medieval Englishmen actually identified with the realm?), but this becomes a minor historical detail rather than a theoretical clash. The impasse is not hidden-empirical; it is conceptual.

  **Case Studies**
  The medieval university 'nations' and church council voting blocks bite hardest on definition. Modernists dismiss them as corporate legal fictions lacking political sovereignty or mass identity. Ethnosymbolists cite them as evidence of the conceptual availability of 'natio'. These are not empirical counterexamples but definitional boundary cases. Hastings's medieval England is similar: the dispute is not whether vernacular scripture existed (empirical), but whether it constitutes the "full sense" of a nation (definitional). For Gellner, it fails the functional test of industrial homogeneity; for Hastings, it passes the cultural test of shared identity.

  **Defect or Division of Labour?**
  This is a legitimate division of labour obscured by shared terminology. Modernists study the *political form* (the state-nationalism nexus), while Ethnosymbolists study the *cultural substrate* (the ethnie-identity nexus). They are answering different questions under one heading. The defect lies not in the debate itself, but in the failure to distinguish the phenomena explicitly, leading to talking past one another.

  **Progress**
  Progress requires disentangling the questions. A stipulated definition distinguishing the political institution from the cultural community would allow both sides to retain their empirical findings without contradiction. We do not need new data, but a clearer taxonomy.

  \answer{verbal/definitional + two-questions-in-one-name; Stipulate definitions separating political sovereignty from cultural community.}
