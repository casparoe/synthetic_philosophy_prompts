prompt: |-
  I'm a novelist, roughly two-thirds through a book set in a company town where the whole local economy is one supplier bidding against three others, and I'm stuck on the big set-piece: the towns ex-planner (she used to do industrial policy) has to stand up at a public meeting and actually make her case, not just gesture at the vibe of a race to the bottom.

  So what I need from you is the argument itself, argued straight, in her voice, about 800 words.

  The thesis I want her to land: multipolar traps — the kind where every player prefers mutual restraint to mutual defection, and yet every player defects anyway — all quietly assume the players still agree on what counts as losing. Her claim is that the genuinely frightening races to the bottom are a different animal. What gets competed away is the shared yardstick itself, the very thing that would let anyone notice or measure the loss. Which means the standard exits — an outside referee, repeated play, reputation, a regulator, a consumer boycott — are all dead on arrival, since every one of them needs a common measure of value that the race has already eaten. I want her to actually defend that: why it isn't just a multipolar trap with scarier paint, why the usual fixes can't get any traction, and what's left standing once she concedes all that. Be honest with me here — I'd rather she lose the room than win it with hand-waving.

  Ground it in one worked example, some concrete industry or practice, real or plausible, and run it all the way down.

  Skip the sources, quotes and reading list. She's at a podium, not writing a lit review.
