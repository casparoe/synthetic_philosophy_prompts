      *(Refining the "No Single Principal" point)*: This is the "Cycling Preferences" problem. In mechanism design, if preferences cycle, there is no stable social welfare function to maximize. Purposivism assumes one exists. Textualism ignores it and looks at the only observable signal (the text).

      *(Refining the "Verdict")*: The disagreement doesn't dissolve. It transforms. It becomes a debate about *who bears the cost of incompleteness*. Textualism puts it on the Legislature (draft better). Purposivism puts it on the Court (fix it). But the deeper issue is the *Constitutional* allocation of power, which economics struggles to price.

  6.  **Final Polish:** Check against constraints. Did I say where mapping is crude? Yes. Did I address the specific suspicions? Yes. Did I give a verdict? Yes.

      *Key Insight to highlight:* The "Contract" model assumes the parties *want* the contract enforced. In law, the "parties" (legislators) are often strategic and may *want* ambiguity to pass the buck. This is "strategic incompleteness," not just "costly contracting."

