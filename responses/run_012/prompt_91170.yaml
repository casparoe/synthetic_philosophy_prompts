      *   *Does it dissolve the disagreement?* Partially. It reframes it as *Ex Ante* Certainty (Textualism) vs. *Ex Post* Efficiency (Purposivism).
      *   *What survives?* The question of *Authority*. Who has the right to fill the gap? The economic model treats the court as a neutral gap-filler. The legal debate treats the court as a potential usurper.
      *   *Missing Dimension:* It's not just ambiguity; it's about *Political Legitimacy*. The "Contract" model misses the *Constitutional* constraint. The Court isn't just a hired agent; it's a co-equal branch with limited mandate.
      *   *Conclusion:* The heat is not misplaced. It's about the allocation of power, not just efficiency.

