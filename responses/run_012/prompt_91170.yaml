answer: |-
  Here is the translation, the residue report, and the verdict, structured for an audience fluent in mechanism design and contract theory.

  ### I. The Translation Exercise

  Here is the mapping of the legal debate into your toolkit of incomplete contracts and principal–agent problems.

  **1. The Statute as an Incomplete Contract**
  *   **Legal Concept:** The Statute.
  *   **Economic Translation:** A formal contract between the Legislature (Principal) and the Court/Agency (Agent), with the Public as the affected third party. The contract is incomplete due to the high transaction costs of foreseeing all future states of the world (drafting costs) and the inability to write contingent clauses for every scenario.
  *   **Fidelity Check:** **High.** This is the standard law-and-economics baseline.

  **2. Textualism as Strict Enforcement of Written Terms**
  *   **Legal Concept:** Textualism (focus on plain meaning, refusal to consult history).
  *   **Economic Translation:** A commitment to enforce only the *verifiable* terms of the contract. The Principal (Legislature) knows the Agent (Court) has a bias or informational disadvantage regarding the "spirit" of the deal. To prevent agency slack or judicial activism (shirking/empire-building), the Principal restricts the Agent's authority to the observable, written signal.
  *   **Incentive Effect:** Forces the Principal to internalize the cost of ambiguity. If the Court cannot fix drafting errors, the Legislature invests more in *ex ante* precision.
  *   **Fidelity Check:** **High.** This maps cleanly to a "penalty default" rule designed to induce specific investment by the drafter.

  **3. Purposivism as Gap-Filling via Hypothetical Bargain**
  *   **Legal Concept:** Purposivism (interpreting text to achieve the statute's goal).
  *   **Economic Translation:** *Ex post* adaptation to maximize the joint surplus of the contracting parties. When a contingency arises that the contract did not specify (a gap), the Agent fills the gap based on the "majoritarian default" or the outcome the parties *would have agreed to* had they bargained over it costlessly.
  *   **Fidelity Check:** **Medium.** Assumes a well-defined joint surplus function exists for the Legislature.

  **4. Legislative History as Pre-Contractual Negotiation**
  *   **Legal Concept:** Committee reports, floor speeches.
  *   **Economic Translation:** Cheap talk vs. costly signaling from the negotiation phase. Purposivists treat this as evidence of the true state space and preferences (resolving informational asymmetry). Textualists treat this as non-verifiable "cheap talk" that cannot be contracted upon and is subject to manipulation by strategic agents (legislators inserting remarks for constituents without changing the law).
  *   **Fidelity Check:** **High.** Textualists view history as noisy data prone to moral hazard; purposivists view it as informative priors.

  **5. Canons of Construction as Default Rules**
  *   **Legal Concept:** *Expressio unius*, rule of lenity, etc.
  *   **Economic Translation:** A menu of default rules (majoritarian or penalty defaults) that apply when the contract is silent. For example, the "rule of lenity" is a penalty default against the Principal (State) to induce clearer drafting when liberty is at stake.
  *   **Fidelity Check:** **High.**

  **6. The Absurdity Doctrine as Business Efficacy / Good Faith**
  *   **Legal Concept:** Ignoring text if it leads to an absurd result.
  *   **Economic Translation:** A "good faith" or "business efficacy" implied term. It posits that no rational Principal would have intended a payoff structure that destroys the value of the contract itself. It overrides the written term to prevent a Pareto-inferior outcome that violates the *ex ante* participation constraint.
  *   **Fidelity Check:** **Medium.** "Absurdity" is often normative, not just efficiency-based.

  **7. Deference to Agencies as Delegation to Informed Agents**
  *   **Legal Concept:** *Chevron* deference.
  *   **Economic Translation:** The Principal (Legislature) delegates residual control rights to a specialized Agent (Agency) who has superior information about the state of the world (technical complexity). The Court acts as a monitor but defers to the Agent's interpretation unless it is irrational (outside the contract set).
  *   **Fidelity Check:** **High.** Classic delegation under asymmetric information.

  **8. Stare Decisis as a Stable Focal Point**
  *   **Legal Concept:** Adherence to precedent.
  *   **Economic Translation:** Maintaining a Schelling point to reduce coordination costs and uncertainty for private actors. It builds reputational capital for the Court, signaling that it is a repeat player who will not deviate opportunistically *ex post*.
  *   **Fidelity Check:** **High.**

  ***

  ### II. The Residue Report

  You asked where the mapping distorts or fails. Your suspicions are well-founded, but there is more residue than you anticipated.

  **1. The "Single Principal" Problem (Your Suspicion: Confirmed)**
  *   **The Issue:** You noted that a legislature is a collection of agents with cycling preferences.
  *   **The Residue:** In contract theory, we assume the Principal has a coherent utility function. In legislation, "intent" is often a fiction created by Arrow's Impossibility Theorem. There is no "hypothetical bargain" the coalition *would* have struck because the coalition did not agree on the outcome, only on the text as a compromise to secure votes.
  *   **Distortion:** Purposivism assumes a recoverable social welfare function for the enacting coalition. Textualism implicitly accepts that no such function exists, treating the text as the *only* equilibrium outcome that cleared the bicameralism and presentment hurdles.
  *   **Verdict:** This is not an evidentiary difficulty; it is a category error. Economics struggles to model "collective intent" without assuming a unitary actor, which falsifies the political reality.

  **2. The Third-Party Binding Problem (Your Suspicion: Confirmed)**
  *   **The Issue:** Contracts bind signatories; statutes bind strangers.
  *   **The Residue:** In a contract, gap-filling benefits the parties who can (theoretically) renegotiate. In law, the "gap" is filled for citizens who were never at the table and cannot renegotiate.
  *   **Distortion:** The "efficiency" of *ex post* adaptation relies on the parties being able to capture the surplus. When the Court fills a gap in a criminal statute, it imposes costs on a defendant who had no voice. The "efficiency" calculation must include political legitimacy costs, which are external to the contract model.
  *   **Verdict:** The contract model ignores the *public good* nature of legal rules.

  **3. The Irreversibility of Legislation (Your Suspicion: Confirmed)**
  *   **The Issue:** The enacting coalition cannot renegotiate with the present.
  *   **The Residue:** In incomplete contracts, incompleteness is tolerable because parties can renegotiate efficiently *ex post* (Coasean bargaining). In legislation, transaction costs are prohibitive (bicameralism, filibusters, elections). The "enacting coalition" is dead.
  *   **Distortion:** If the Court fills a gap "efficiently," it effectively amends the contract. But unlike a contract amendment, this cannot be easily undone by the Principal. This gives the Agent (Court) effective veto or amendment power, altering the separation of powers.
  *   **Verdict:** This breaks the standard efficiency story. *Ex post* adaptation by the Court is not "filling a gap"; it is "rewriting the deal" without the Principal's consent.

  **4. Strategic Incompleteness (Unanticipated Residue)**
  *   **The Issue:** Legislators often *want* ambiguity.
  *   **The Residue:** In contract theory, incompleteness is usually due to *cost* or *unforeseeability*. In legislation, incompleteness is often *strategic*. Legislators vote for ambiguous text to claim credit for a solution while passing the blame for painful trade-offs to the Court or Agency.
  *   **Distortion:** Textualism refuses to bail out strategic ambiguity (forcing the Principal to bear the cost). Purposivism inadvertently subsidizes it (allowing the Court to clean up the mess).
  *   **Verdict:** The contract model assumes incompleteness is a friction; here, it is sometimes a feature.

  **5. Authority and Legitimacy (Unanticipated Residue)**
  *   **The Issue:** Who has the right to decide?
  *   **The Residue:** Economics asks "What is the efficient outcome?" Law asks "Who has the authority to choose?" A Court might know the "efficient" reading of a statute but lack the constitutional authority to adopt it.
  *   **Distortion:** The contract model treats the Court as a neutral arbiter maximizing joint surplus. The legal debate treats the Court as a political actor whose power must be constrained to maintain democratic accountability.
  *   **Verdict:** This is a dimension your framework lacks. Efficiency is not the only objective function; *legitimacy* is a constraint that can override efficiency.

  ***

  ### III. The Verdict

  **Does the translation dissolve the disagreement?**
  **No.** It clarifies the trade-off, but it does not dissolve the conflict.

  If the debate were merely about **Commitment (Textualism) vs. Flexibility (Purposivism)**, it would be a standard cost-benefit analysis: *How high are the drafting costs vs. how high are the error costs of judicial gap-filling?* If this were the whole story, you could solve for the optimal degree of textualism.

  **What survives the translation?**
  Two things survive that cannot be restated as a trade-off:

  1.  **The Constitutional Constraint (Authority):**
      Textualism is not just a preference for certainty; it is a claim about *who* holds the residual control rights. In your framework, the Principal can always delegate residual rights to the Agent if it is efficient. In Constitutional law, the Principal (Legislature) is *forbidden* from delegating certain powers to the Agent (Court).
      *   *Translation Failure:* Your model allows optimal delegation. The legal system imposes a *hard constraint* on delegation regardless of efficiency. Textualists argue that allowing Courts to fix "mistakes" violates the Vesting Clause of the Constitution, regardless of whether the Court would do it more efficiently.

  2.  **The Time-Inconsistency of the Principal:**
      The "Legislature" today is not the "Legislature" tomorrow. Textualism protects the *current* Legislature from the *future* Court, but also protects the *past* Legislature from the *current* Court.
      *   *Translation Failure:* In contract theory, the Principal is usually persistent. Here, the Principal is a revolving door of coalitions. Textualism locks in the preferences of a dead coalition against the preferences of the living one. Purposivism allows the living Court to update the dead Legislature's preferences. This is not just a flexibility trade-off; it is a debate about **intertemporal democracy**.

  **Conclusion: Defect of Framework or Lawyerly Ambiguity?**
  It is a **defect of your framework**, but not because economics is "wrong." It is because your toolkit is designed for *private ordering* (consensual, bilateral, efficiency-maximizing), whereas statutory interpretation is *public ordering* (coercive, multilateral, legitimacy-constrained).

  *   **The Lawyers' Heat:** The heat is not misplaced. It is not merely vagueness. It is a genuine conflict over the allocation of power in a separation-of-powers system.
  *   **The Missing Dimension:** You are missing **Legitimacy**. In economics, a rule is "good" if it maximizes surplus. In law, a rule is "good" if it is perceived as authorized by the correct institution. A Court can issue an "efficient" ruling that is "illegal" (ultra vires). Your model has no variable for *ultra vires*.

  **Final Recommendation:**
  Treat the Textualist/Purposivist debate as a debate over **Residual Control Rights** in a setting where **Renegotiation is Impossible** and the **Principal is a Fiction**.
  *   **Textualism** assigns residual rights to the status quo (the text), accepting inefficiency to preserve the incentive compatibility of the legislative process and the legitimacy of the judiciary.
  *   **Purposivism** assigns residual rights to the Court, accepting the risk of agency slack to avoid the deadweight loss of legislative gridlock or drafting error.

  The disagreement persists because there is no common metric to weigh "Democratic Legitimacy" against "Allocative Efficiency." Your vocabulary can describe the *mechanics* of the dispute, but it cannot price the *normative* stakes. That is not a failure of your training; it is the boundary of the economic approach to law.
