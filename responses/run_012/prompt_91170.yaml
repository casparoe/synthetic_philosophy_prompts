          3.  **Verdict:** Does the translation dissolve the disagreement? Is it just commitment vs. flexibility? If not, what survives? Is it a missing dimension (authority/legitimacy) or lawyerly ambiguity?

  2.  **Deconstruct the Translation Exercise (Task 1):**
      *   *Statute as Incomplete Contract:* This is the core analogy. Legislature (Principal) $\to$ Court/Agency (Agent).
      *   *Textualism:* Focus on the written terms. Strict enforcement of the explicit contract language. High weight on *ex ante* clarity.
      *   *Purposivism:* Focus on the goal/outcome. Gap-filling based on the "deal" the parties *would* have made.
      *   *Legislative History:* Pre-contractual negotiation/drafting correspondence. Used to infer intent.
      *   *Canons of Construction:* Default rules (majoritarian defaults vs. penalty defaults).
      *   *Absurdity Doctrine:* Business efficacy / Good faith limitation (preventing outcomes that defeat the contract's purpose).
      *   *Deference (Chevron/etc.):* Delegation to a better-informed agent (Agency has informational advantage).
      *   *Stare Decisis:* Stable focal point / Reputation mechanism for the Court.

      *Critique of Mapping:* Need to flag where this breaks. A contract is usually bilateral/multilateral with consent. A statute is unilateral imposition on third parties.

  3.  **Develop the Residue Report (Task 2):**
      *   *User Suspicions:*
          1.  *No Single Principal:* Legislature is a "they," not an "it." Arrow's Impossibility/Cycling preferences. "Intent" is a fiction. *Verdict:* Valid. Economic models often assume a unitary actor for simplicity, but here it's a fatal flaw for purposivism.
          2.  *Third-Party Binding:* Contracts bind signatories. Statutes bind the public (non-signatories). *Verdict:* Valid. This changes the welfare analysis.
          3.  *No Renegotiation:* Contracts can be amended. Statutes are hard to change (high transaction costs). *Verdict:* Valid. This makes *ex post* adaptation by courts much more dangerous (hold-up by the judiciary).
      *   *Other Residues:*
          *   *Legitimacy/Authority:* Courts claim to apply law, not make it. Economic efficiency doesn't capture the *normative* claim of authority.
          *   *Distribution vs. Efficiency:* Contracts are often Pareto-improving for parties. Statutes are redistributive.
          *   *Time Inconsistency:* The "enacting coalition" is dead. The current court is a different agent.

