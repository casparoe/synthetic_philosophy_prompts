prompt: |-
  I'm a journalist who covers science and ideas, and I have been drafted, reluctantly, into the role of unofficial adviser to a friend — which has left me wishing I had paid closer attention in the one ethics course I took as an undergraduate. My friend, whom I will call Priya, was raised by her grandmother in a large, sagging house that has been in the family for four generations. When Priya was nineteen and her grandmother was dying, the grandmother asked her, in front of the assembled family, to promise two things: that she would look after her younger cousin as though he were her brother, and that the house would never be sold out of the family. Priya promised. Twenty years on, the cousin is thriving and wants nothing from her, and the house has become a genuine burden — a leaking roof, taxes she can barely cover, and a location three hours from anywhere she can earn a living. The family now agrees, with one exception, that selling is the sensible course; the only buyer in prospect is Priya's own brother, which means the letter of the promise could be kept while its evident point was abandoned. Priya has also since come across a letter suggesting that her grandmother, in the 1970s, sold off a parcel of family land in breach of a promise of exactly the same shape.

  Her brother's position is that a promise made to a dying woman is a promise made to nobody, and that since the grandmother can be neither helped nor betrayed, Priya is free. Her aunt's position is that breaking it would be a sacrilege, and that the family's sense of itself is bound up in the promise being kept, quite apart from any harm to any person. Priya's own position — this is the part I cannot answer — is that the promise still has a hold on her, and that she cannot tell whether what she feels is a reason or merely an aversion she was trained into as a child; she adds, half joking, that if it turns out to be the latter, she is not sure what to make of any of the promises she has made to people who are still alive to be disappointed. What I want from you is not a general essay on keeping one's word, and not a verdict on whether she should sell the house, but an account of what, if anything, binds her, and what kind of thing that binding is and where it is supposed to reside — given that the person promised is gone, that the reason for the promise has evaporated, that no one now alive has the standing to release her, and that the promisee herself may never have honoured promises of this kind. If she is bound, I want to know what she is bound to do once the promise's literal content and its purpose come apart, and how much weight the family's expectations — expectations that grew up around the promise and would be disappointed by its breach — should carry in that determination. And if she is not bound, I want to know why the same reasoning does not quietly dissolve every other promise she has made.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science and ideas, reluctantly acting as an ethics adviser to a friend (Priya).
      *   **Situation:** Priya promised her dying grandmother (20 years ago) to keep the family house and care for a cousin.
      *   **Current State:** Cousin is fine. House is a financial/emotional burden. Family mostly wants to sell (except one aunt). Brother wants to buy it (keeping it "in the family" technically, but violating the spirit of *keeping* the house).
      *   **Complication:** Grandmother previously broke a similar promise (sold land in the 70s).
      *   **Priya's Dilemma:** She feels bound but doesn't know if it's moral reason or childhood conditioning. She worries that if this promise dissolves, *all* promises might dissolve.
      *   **Constraints:** No general essay on promise-keeping. No verdict on whether to sell.
      *   **Core Task:** Explain *what* binds her (if anything), *what kind* of thing that binding is, *where* it resides (ontologically/normatively), what she is bound *to do* when letter and spirit diverge, and the weight of *family expectations*. Also, address the "slippery slope" concern (why doesn't this dissolve all promises?).

  2.  **Deconstruct the Ethical Landscape:**
      *   **The Promisee:** Deceased. Cannot release Priya. Cannot be harmed directly.
      *   **The Purpose:** Care for cousin (moot), keep house in family (threatened by sale, even to brother?).
      *   **The Context:** Dying wish, public declaration, multi-generational home.
      *   **The Precedent:** Grandmother broke a similar promise.
      *   **The Stakeholders:** Priya (burdened), Brother (buyer, pragmatic), Aunt (traditionalist/sacralizer), Cousin (indifferent), Family collective (mostly pragmatic).
      *   **The Philosophical Problem:** The ontology of obligations to the dead. The nature of "spirit vs. letter." The source of normative force (internal vs. external).

  3.  **Brainstorming Philosophical Angles:**
      *   *Contractualism/Scanlon:* What principles could no one reasonably reject?
      *   *Virtue Ethics:* What does keeping this say about Priya's character?
      *   *Existentialism:* She creates the meaning.
      *   *Narrative Ethics:* The story of the family.
      *   *The "Dead Hand" Problem:* Do the dead rule the living?
      *   *Promise Theory (Rawls, Scanlon, Shiffrin):* What creates the obligation? Reliance? Expectation? The act of willing an obligation?

  4.  **Developing the Core Argument (The "Binding"):**
      *   *Where does it reside?* It's not in the grandmother (she's gone). It's not purely in the family (they are divided). It resides in *Priya's agency* and her relationship to her own past self and her community's narrative.
      *   *What kind of thing is it?* It's a "normative residue." It's not a legal contract. It's a constitutive commitment.
      *   *The Grandmother's Hypocrisy:* Does it invalidate the promise? Not necessarily. It contextualizes it. It shows the promise was about *aspiration*, not historical fact.
      *   *Letter vs. Spirit:* The spirit was "stability and care." The letter is "no sale." If the letter causes instability (financial ruin), it violates the spirit. Selling to the brother might actually *preserve* the spirit (family ownership) better than keeping the house and going bankrupt.
      *   *The "Slippery Slope" (Living Promises):* Why doesn't this dissolve promises to the living? Because promises to the living involve *reliance* and *harm*. Promises to the dead involve *integrity* and *memory*. The stakes are different.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate the journalist's reluctance. Set the tone (analytical, not prescriptive).
      *   **The Ontology of the Bond (Where does it live?):** It's not a chain from the grave. It's a bridge Priya built. It resides in her *identity* as a promise-keeper. The "Dead Hand" vs. "Living Voice."
      *   **The Nature of the Obligation (What kind of thing?):** Distinguish between *harm-based* obligations (living) and *integrity-based* obligations (dead). The grandmother can't be hurt, but Priya can be diminished (or liberated).
      *   **Letter vs. Spirit (The Divergence):** The purpose was security/continuity. The house is now insecurity. Selling to the brother might actually fulfill the *purpose* (family heritage) even if it breaks the *letter* (no sale). This is "fidelity to the aim," not just the words.
      *   **The Grandmother's Precedent:** Use this. It humanizes the grandmother. It suggests the promise was a hope, not a law. It relieves the "sacrilege" charge.
      *   **The Weight of Family Expectations:** The Aunt sees the house as a totem. The Brother sees it as an asset. Priya is the curator. Their expectations matter, but they don't own her conscience.
      *   **The Slippery Slope (Living Promises):** Address Priya's fear. Promises to the living have a "victim" if broken. Promises to the dead have a "witness" (the self). Breaking a promise to the dead is a tragedy; breaking one to the living is a wrong.
      *   **Conclusion:** Summarize the binding force. It's about who she chooses to be, not what she owes a ghost.

  6.  **Refining the Tone:**
      *   Needs to be intellectual but accessible (for a journalist).
      *   Avoid moralizing.
      *   Use precise philosophical concepts without jargon overload.
      *   Focus on the *structure* of the obligation.

  7.  **Self-Correction/Critique during drafting:**
      *   *Initial thought:* Maybe bring in Kant? *Correction:* Too rigid. Kant would say keep the promise. That doesn't help the nuance.
      *   *Initial thought:* Focus on the financial burden. *Correction:* No, the prompt asks about the *binding*, not the practical decision.
      *   *Check:* Did I answer the "where it resides" question? Yes, in the agent's integrity and the shared narrative.
