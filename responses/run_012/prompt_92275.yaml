answer: |-
  This is a classic rabbit hole, and you have correctly identified that the "inefficacy objection" (my act doesn't change the outcome) is the gravity well that sucks most people in. The literature is vast, but much of it is indeed people polishing the same three intuitions with different terminology.

  Given your constraints (3 years, small group, blog, no academic training), you need an agenda that avoids metaphysical swamps (like the precise definition of a "heap") and focuses on normative frameworks you can actually apply to your life and writing.

  Here is a defended agenda of four open questions, ordered by logical dependency and tractability.

  ### Preliminary Assessment: Your Friends' Framings

  Before the agenda, we need to sort your tools.

  **Friend 1 (The Three Differences): Keep this as your map.**
  They are describing the three major branches of ethical theory without using the jargon.
  1.  *Changing the outcome* = Consequentialism.
  2.  *Changing what the group does* = Collective Agency/Contractualism.
  3.  *Changing what you participate in* = Virtue Ethics/Integrity.
  **Verdict:** This is not a solution, but it is the correct *taxonomy*. Use this to categorize every argument you encounter. If someone argues "but your flight emits CO2," they are in bucket 1. If they argue "but you legitimized the fossil fuel industry," they are in bucket 2. If they argue "but you compromised your integrity," they are in bucket 3. This prevents your group from talking past each other.

  **Friend 2 (The Heap/Threshold): Deprioritize this.**
  This is the "Sorites Paradox" applied to ethics. It asks: *At what exact gram does carbon become harmful?*
  **Verdict:** This is a dead end for your specific goals. It assumes that *causation* is the only thing that matters (Bucket 1 above). If you solve the "heap" problem but remain a strict consequentialist, you still might conclude your individual act is negligible. Furthermore, modern climate science suggests harms are often linear (every ton matters) rather than threshold-based, which makes the metaphysical puzzle less relevant than the ethical one. Park this. It consumes infinite time for little ethical payoff.

  ---

  ### The Agenda

  #### Question 1: Is "Difference-Making" the only valid metric for ethical obligation?
  **Priority:** 1 (Upstream of everything)
  **Reasoning:** Your entire struggle rests on the premise: "If I don't change the outcome, I have no reason to change." This is a strict Consequentialist claim. You cannot resolve the inefficacy thought until you determine if that premise is true. If ethical obligation can exist *without* causal impact, the inefficacy objection collapses immediately.
  **Tractability for Amateurs:** High. You don't need math; you need thought experiments.
  *   *Test Case:* If you join a mob that is beating someone, but you arrive late and don't actually strike anyone, are you innocent? Most people say no. Why? Because you participated, not because you changed the outcome.
  *   *Work:* Spend 6 months gathering cases where we intuitively blame people who made no difference (voting in a landslide, joining a boycott that fails, etc.).
  **Downstream Impact:**
  *   *If Yes:* You must accept the inefficacy objection. You then have to move to Question 3 (Signaling) to find a way to make a difference.
  *   *If No:* You unlock Question 2 (Complicity). You can argue that flying is wrong *even if* it doesn't change the climate, simply because it implicates you in a harmful system.
  **Re-evaluation Criteria:** Move this down if your group reaches a consensus that "Complicity" is just consequentialism in disguise (some philosophers argue this). Move it up if you find your discussions keep stalling on "but it didn't change anything!"

  #### Question 2: What is the normative force of "Complicity" without Causation?
  **Priority:** 2 (Dependent on Q1)
  **Reasoning:** If you answer Q1 with "No, difference-making isn't everything," you immediately need a new framework. "Complicity" is the leading candidate. This asks: *Does contributing to a wrongful project make you blameworthy, even if your contribution was unnecessary?*
  **Tractability for Amateurs:** Medium. This requires reading non-consequentialist ethics (Kantianism, Virtue Ethics), but you can approach it via intuition pumps.
  *   *Test Case:* Is it wrong to buy a stolen watch if the theft already happened and your purchase doesn't incentivize future theft?
  *   *Work:* Analyze the "Clean Hands" intuition. Is the goal of ethics to keep the world good, or to keep yourself clean?
  **Downstream Impact:**
  *   *If Complicity matters:* You have a robust defense for not flying, even if the flight is inefficient. The argument becomes about *integrity*, not *impact*.
  *   *If Complicity doesn't matter:* You are forced back into a purely consequentialist view, making your position much harder to defend.
  **Re-evaluation Criteria:** Move this down if you find the concept of "complicity" is too vague to apply consistently (e.g., does buying gas make you complicit in war?). Move it up if Q1 is resolved quickly.

  #### Question 3: Do individual acts function as signals that alter collective thresholds?
  **Priority:** 3 (The Bridge)
  **Reasoning:** This is the most "scientific" of the questions. It bridges the gap between the individual and the collective. Even if your flight doesn't change the climate *physically*, does it change the social *norms* that allow the climate to be damaged? This addresses Friend 1's "Changing what the group ends up doing."
  **Tractability for Amateurs:** High. This is social science, not metaphysics. You can look at data on social norms, voting behavior, and market signaling.
  *   *Test Case:* Does seeing someone fly to a climate march make others more likely to fly, or more likely to march?
  *   *Work:* Look for literature on "conditional cooperation" and "norm cascades." This is empirically testable.
  **Downstream Impact:**
  *   *If Yes:* Your flight might be instrumentally bad because it signals that "flying is okay for activists," weakening the movement's cohesion.
  *   *If No:* The act is socially inert. This weakens the pragmatic argument for restraint.
  **Re-evaluation Criteria:** Move this up if Q1 and Q2 result in a stalemate. This is often the most practical "way out" for people who can't accept non-consequentialist ethics. Move it down if you find the data on social signaling is too noisy to rely on.

  #### Question 4: Is the goal moral purity or systemic engagement?
  **Priority:** 4 (Downstream/Application)
  **Reasoning:** This is the synthesis question. It addresses the "Flight to the March" scenario directly. If you stay home to keep your hands clean (Q2), you aren't at the march. If you fly to the march to change the system (Q3), you dirty your hands. This is the "Dirty Hands" problem.
  **Tractability for Amateurs:** High. This is purely strategic and existential.
  *   *Test Case:* Is it better to be a pure hermit or an effective politician in a corrupt system?
  *   *Work:* Define what "success" looks like for your group. Is it personal virtue? Or systemic change?
  **Downstream Impact:**
  *   *If Purity:* You should minimize your footprint regardless of impact.
  *   *If Engagement:* You should optimize for influence, even if it requires hypocrisy (flying to the march).
  **Re-evaluation Criteria:** This should be the final year's focus. Move it up if your group becomes too theoretical and loses touch with the original motivation (the fight with your brother).

  ---

  ### Why This Order?

  1.  **Logical Dependency:** You cannot answer Q2 (Complicity) if you haven't settled Q1 (Is impact required?). You cannot answer Q4 (Strategy) without knowing what values you are optimizing for (Q1 & Q2).
  2.  **Tractability:** Q1 is intuitive. Q4 is personal. Q2 and Q3 are the "meat" that requires research. Sandwiching the hard research between the intuitive and the personal keeps morale high.
  3.  **Avoiding the Trap:** This order deliberately sidesteps Friend 2's "Heap" problem. We aren't asking "Does this gram of carbon hurt?" We are asking "Does participating in the carbon system hurt *me* (my integrity) or *us* (our norms)?"

  ### What Would Change the Plan?

  *   **The "Linear Harm" Discovery:** If you find conclusive evidence that individual acts *do* have expected causal value (e.g., probabilistic harm models where 1 burger = 0.000001 chickens killed, which is morally significant), Q1 becomes easy, and you skip to Q3.
  *   **The "Futility" Wall:** If your group concludes that *no* individual action matters (neither causal nor symbolic), you must pivot from "Individual Ethics" to "Political Obligation." The question changes from "What should I do?" to "What system should we build?" This would scrap the agenda for a political theory focus.
  *   **Burnout:** If Q2 (Complicity) becomes too depressing (everything is complicity), pivot to Q3 (Signaling). It is more hopeful and actionable.

  ### Summary for your Blog/Group

  *   **Year 1:** Attack Q1. Read intuition pumps. Debate the "Mob" and "Voting" cases. Establish if "Impact" is King.
  *   **Year 2:** Attack Q2 & Q3. If Impact isn't King, what is? (Complicity). If Impact is King, how do we actually have it? (Signaling).
  *   **Year 3:** Attack Q4. Synthesize. Write your "Manifesto on the Flight to the March."

  This agenda respects the literature without getting bogged down in it. It treats the philosophy as a tool to resolve a life conflict, which is exactly where it belongs.
