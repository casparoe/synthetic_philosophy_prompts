answer: |-
  Here is the spec sheet for a coherent theory of population ethics. This is not a menu of options; these are the functional constraints any model must process to avoid collapsing into absurdity.

  ### The Spec Sheet: Core Requirements

  **1. The Mere Addition Condition**
  *   **The Case:** If you add a person whose life is worth living, and their existence does not negatively affect anyone else, the world should not be considered *worse*.
  *   **The Constraint:** A theory cannot declare that adding a happy, self-sufficient person is a net negative. This blocks the "Anti-Natalist" extreme where existence itself is treated as a harm.

  **2. The Non-Repugnance Condition**
  *   **The Case:** A world with ten billion people whose lives are barely worth living (drab, no pain, no joy) should not rank higher than a world with ten million people living ecstatic, flourishing lives.
  *   **The Constraint:** A theory cannot allow sheer quantity of welfare to indefinitely trump the quality of welfare. This blocks the "Total Utilitarian" extreme where you just keep adding bodies until the sum is bigger, regardless of how miserable the average life is.

  **3. The Asymmetry Constraint**
  *   **The Case:** We generally agree there is a moral duty *not* to create a child who will suffer terribly. We generally agree there is *no* moral duty to create a child who will be happy (you aren't immoral for remaining childless).
  *   **The Constraint:** A theory must treat the creation of negative welfare (misery) and positive welfare (happiness) differently. It cannot treat them as symmetrical pluses and minuses on a ledger.

  **4. The Non-Identity Constraint**
  *   **The Case:** Policy changes (like climate action or fertility incentives) change *who* gets born, not just how many. A child born in 2050 under a high-emission regime is a different specific person than a child born under a low-emission regime.
  *   **The Constraint:** A theory cannot rely on comparing specific individuals across worlds ("Person A is worse off in World 1"). It must compare states of affairs where the populations are entirely non-overlapping.

  **5. The Extinction Constraint**
  *   **The Case:** If humanity goes extinct peacefully (no suffering, just the end), most people intuit this is a tragedy, even though there is no one left to feel deprived.
  *   **The Constraint:** A theory must be able to declare a state of "no people" as worse than a state of "some people," without relying on the interests of existing people to make that judgment.

  **6. The Interdependence Clause**
  *   **The Case:** Wellbeing is not a fixed value per person. Adding people changes the value of existing lives (crowding, resource dilution, status competition, climate impact).
  *   **The Constraint:** A theory cannot treat utility as additive (1 + 1 = 2). It must account for the marginal decrease in welfare for existing people as population density rises.

  ***

  ### Non-Negotiables vs. Camp Preferences

  **Non-Negotiable (Logical Hygiene):**
  *   **Transitivity:** If World A is better than B, and B is better than C, A must be better than C. If your theory violates this, it is broken, not just controversial.
  *   **The Non-Identity Constraint:** You cannot ignore this. It is a biological fact that different choices yield different gametes and different people. Any theory that assumes a fixed population identity is descriptively false.
  *   **The Interdependence Clause:** Ignoring externalities renders the theory useless for real-world policy (like Musk's Mars colony or climate targets).

  **Camp Preferences (Moral Intuitions):**
  *   **The Asymmetry:** This is the biggest divider. "Impersonal" theories (Utilitarianism) reject this; they say creating a happy person *is* a moral good, you just aren't obligated to maximize it. "Person-Affecting" theories accept this. You can build a coherent theory either way, but it dictates your entire framework.
  *   **The Extinction Constraint:** Some theories (Person-Affecting) say extinction isn't bad if no one is harmed. Others say it is. This is a value judgment, not a logical requirement.
  *   **The Non-Repugnance Condition:** While widely shared, a hardline Total Utilitarian will bite the bullet and say the world of billions with barely-livable lives *is* better. It's counter-intuitive, but logically consistent within their system.

  ***

  ### The Incompatibilities (The "Gotchas")

  You cannot satisfy all the Non-Negotiables and Camp Preferences simultaneously. This is not a bug; it is a proven feature of the landscape (often referred to in academia as Impossibility Theorems).

  **The Fatal Triangle:**
  You cannot satisfy these three conditions at once:
  1.  **Mere Addition** (Adding a happy person doesn't make things worse).
  2.  **Non-Repugnance** (Quality matters more than infinite quantity).
  3.  **Transitivity** (Logical consistency).

  If you accept Mere Addition and Transitivity, you are mathematically forced into the Repugnant Conclusion (Total Utilitarianism). If you block the Repugnant Conclusion and keep Transitivity, you must violate Mere Addition (meaning adding a happy person can make the world *worse*, which sounds absurd).

  **The Asymmetry vs. Completeness:**
  If you enforce the **Asymmetry Constraint** (creating happy people is neutral, creating miserable people is bad), you break **Transitivity**. You end up with situations where World A is not better than B, B is not better than A, but they are not equal. The math stops working.

  **The Non-Identity vs. Harm:**
  If you enforce the **Non-Identity Constraint**, you break the standard definition of **Harm**. You cannot say a policy "harms" future generations if that policy is the only reason those specific generations exist. This knocks out most legal and rights-based frameworks for long-term planning.

  ***

  ### The Knockout Blow

  You asked which single requirement knocks out the most popular answers (Total, Average, and Critical Level Utilitarianism).

  **The Winner: The Asymmetry Constraint.**

  Here is why it destroys the standard models:

  1.  **Total Utilitarianism:** Assumes symmetry. A happy life is +100, a miserable life is -100. It implies you have a pro-tanto reason to create happy people. The Asymmetry says you don't. **Failed.**
  2.  **Average Utilitarianism:** Assumes symmetry. It implies that adding a happy person (who is below the current average) makes the world worse. This violates the intuition that adding a happy person is at least *neutral*, if not good. The Asymmetry demands neutrality for happy additions, not negativity. **Failed.**
  3.  **Critical Level Utilitarianism:** This tries to fix the above by saying a life only adds value if it is *above* a certain threshold of excellence. However, to satisfy the Asymmetry, the critical level for "good" must be higher than the critical level for "bad." This creates a "gap" where lives are worth living but adding them is neutral. While this model *tries* to accommodate the Asymmetry, it fails the **Non-Arbitrariness** requirement (a sub-clause of logical hygiene). There is no non-arbitrary way to set the "Critical Level." Why is the threshold 50/100 and not 51/100? **Failed.**

  **The Bottom Line for Your Piece:**
  The pronatalist argument (Total Utilitarianism) fails because it ignores the **Repugnant Conclusion**. The anti-natalist argument (Negative Utilitarianism) fails because it ignores the **Extinction Constraint**. The moderate argument (Critical Level) fails because it relies on an **Arbitrary Threshold**.

  But the deepest issue is the **Asymmetry**. All the "math" models of population (Total, Average, Critical) assume that existence is a value to be aggregated. The Asymmetry asserts that existence is not a value in the same way for the happy as it is for the suffering. Until a theory resolves why we have a duty to avoid creating sufferers but no duty to create saviors, the "spec sheet" remains incomplete. Any interviewee claiming to have the answer is selling you a model that has silently deleted one of these requirements to make the math work.
