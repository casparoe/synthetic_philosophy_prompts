  **JOINT STATEMENT ON THE CONDORCET JURY THEOREM**

  **I. Agreed Claims**
  We, the undersigned members of the reading group, affirm the following regarding the Condorcet Jury Theorem (CJT):

  1.  **Scope of Application:** We agree that CJT addresses *truth-tracking* on binary questions (e.g., "Is the defendant guilty?"), not the aggregation of *preferences* (e.g., "Which tax rate is best?"). Conflating these is a verbal dispute that has fueled unnecessary conflict; CJT belongs to epistemic democracy, not social choice theory.
  2.  **Mathematical Core:** We accept the mathematical validity: if voters are independent and individually competent (probability of correctness $p > 0.5$), majority reliability approaches 1 as group size increases. Conversely, if $p < 0.5$, reliability approaches 0.
  3.  **Status of the Theorem:** Camp One views CJT primarily as a **normative benchmark**: it defines the conditions under which democracy *should* be organized to track truth. Camp Two views it as a **descriptive model**: it claims to explain actual democratic performance. We agree it cannot serve both roles simultaneously without qualification.
  4.  **The Danger of Incompetence:** We agree that the theorem implies a severe risk: if the average voter is systematically biased ($p < 0.5$), expanding the electorate guarantees error. This is not a bug but a feature of the logic.
  5.  **Assumptions are Idealizations:** We agree that real voters are neither perfectly independent nor identically competent. The dispute is whether these deviations invalidate the model's insight or merely require complex adjustments.

  **II. Remaining Disagreements**

  | Issue | Neutral Statement of Dispute | Camp One (Optimists) | Camp Two (Skeptics) |
  | :--- | :--- | :--- | :--- |
  | **Independence** | Whether voter errors are sufficiently uncorrelated in mass elections to sustain convergence. | Correlations exist but dilute sufficiently in large numbers; the signal survives the noise. | Common information sources create high correlation; the "effective" group size is too small for convergence. |
  | **Competence** | Whether a meaningful $p > 0.5$ can be defined for complex policy issues lacking objective truth. | Competence is defined relative to expert consensus or long-term outcomes; $p > 0.5$ is plausible. | Without objective truth conditions, $p$ is undefined; applying CJT to policy is category error. |
  | **Model Value** | Whether CJT remains useful given assumption failures. | It provides a target for institutional design (e.g., protecting voter independence). | It is a misleading toy that distracts from power dynamics and structural inequality. |

  **III. Cruxes and Empirical Tests**
  To move forward, we identify four sub-questions where evidence could shift our positions. For each, we specify a test, our competing predictions, and what would constitute a refutation.

  **1. The Independence Definition**
  *   **Issue:** Does "independence" require statistical independence unconditional on the truth, or only conditional independence (errors uncorrelated given the state of the world)?
  *   **Test:** Analyze voting patterns in jurisdictions with identical economic shocks but different information ecosystems.
  *   **Predictions:** Camp One predicts errors will remain conditionally independent across information bubbles. Camp Two predicts common shocks induce unconditional correlation that overwhelms conditional independence.
  *   **Refutation:** Camp One concedes if correlation coefficients exceed 0.1 across large populations. Camp Two concedes if conditional independence holds even when unconditional correlation is high.

  **2. Competence in Policy**
  *   **Issue:** Can we assign a stable competence parameter $p$ to policy choices where "truth" is only verifiable retrospectively?
  *   **Test:** Compare majority votes on past economic policies against subsequent expert consensus on their efficacy.
  *   **Predictions:** Camp One predicts majority votes will align with expert consensus more than 50% of the time. Camp Two predicts alignment will be indistinguishable from chance or systematically worse.
  *   **Refutation:** Camp One concedes if alignment is consistently $< 50\%$. Camp Two concedes if alignment is consistently $> 60\%$.

  **3. Heterogeneous Competence**
  *   **Issue:** Does the convergence result survive when competence varies widely across voters (e.g., a mix of experts and ignoramuses)?
  *   **Test:** Simulation of weighted vs. unweighted majorities using empirically derived competence distributions.
  *   **Predictions:** Camp One predicts the mean competence drives the result; distribution shape matters little. Camp Two predicts the variance matters; a heavy tail of low-competence voters drags the majority below 0.5.
  *   **Refutation:** Camp One concedes if weighting voters by knowledge significantly outperforms simple majority. Camp Two concedes if simple majority outperforms weighted expert panels.

  **4. The Deliberation Trade-off**
  *   **Issue:** Deliberation aims to raise competence ($p$) but inevitably increases error correlation (reducing independence). This tension threatens both camps: Camp One relies on independence for convergence; Camp Two argues deliberation is necessary for any competence above chance.
  *   **Test:** Experimental groups solving binary problems with varying levels of enforced discussion vs. isolated voting.
  *   **Predictions:** Camp One predicts isolated voting yields higher aggregate accuracy due to preserved independence. Camp Two predicts deliberated groups yield higher accuracy because the gain in $p$ outweighs the loss in independence.
  *   **Refutation:** Camp One concedes if deliberated groups consistently outperform isolated aggregates. Camp Two concedes if deliberation leads to cascade effects where early speakers dictate the outcome regardless of truth.

  **IV. Conclusion on the Deliberation Tension**
  We acknowledge this tension is genuine, not a red herring. For Camp One, this implies that institutional design must prioritize secret ballots and diverse information sources over consensus-building to preserve the mathematical engine of CJT. For Camp Two, this implies that without deliberation, $p$ likely remains below 0.5, making independence irrelevant. We agree that resolving whether the gain in $p$ offsets the loss in independence is the single most important empirical question for the viability of epistemic democracy.
