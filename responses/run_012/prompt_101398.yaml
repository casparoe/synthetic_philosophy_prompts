amed but cannot say what; and a person who sincerely reports a dream that is inconsistent with the sleep-lab record. At least one branch must turn on the distinction between a dream as an occurrent state and a dream as a narrative object, and at least one on whether first-person authority over dream reports is epistemic or expressive. Flag any pair of leaves your tree cannot separate, and say whether the failure is due to the cases or to the positions themselves. Do not include citations, reading lists, or references to specific texts; the instrument must stand on its own. Your entire response must be no more than 850 words.
