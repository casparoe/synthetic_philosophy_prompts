answer: |-
  **Dream Experience Diagnostic Tree**

  **Q1:** Consider a child who says she dreamed but cannot say what, or a person who sincerely reports a dream inconsistent with the sleep-lab record. Does the report describe a past event independent of the telling, or does the telling itself create the dream?
  *   **Describes Past Event:** Go to Q2.
  *   **Creates Dream:** Go to Q3.

  **Q2:** Consider a lucid dreamer who claims to have decided to raise her hand within the dream, or a sleeper whose vocalizations and movements during sleep match the actions in her subsequent report. Is the dream essentially a story (narrative object) or a raw feeling (occurrent state)?
  *   **Story:** Go to Q4.
  *   **Raw Feeling:** **Leaf 5 (Minimal Phenomenality).** *Awkward Commitment:* Phenomenal consciousness can exist without any representational content or structure.

  **Q4:** Consider a sleeper woken from REM who gives a long, coherent report. Is this report a transparent transcript of the experience or a retrospective reconstruction?
  *   **Transparent Transcript:** **Leaf 1 (Classic Realism).** *Awkward Commitment:* Memory processes during sleep function identically to waking memory despite physiological differences.
  *   **Retrospective Reconstruction:** **Leaf 2 (Reconstructive Realism).** *Awkward Commitment:* We genuinely experience dreams but cannot access them without immediate fictionalization.

  **Q3:** Consider a person who reports a dream only after being asked whether she dreamed. Is the report a false memory, an expressive avowal, or a label for sleep mentation?
  *   **False Memory:** **Leaf 4 (Eliminativism).** *Awkward Commitment:* The report is the primary datum, implying all specific dream content is scientifically false.
  *   **Expressive Avowal:** **Leaf 3 (Expressivism).** *Awkward Commitment:* Dream reports are not descriptions of past events but expressions of current dispositions to tell stories.
  *   **Label for Sleep Mentation:** **Leaf 6 (Revisionism).** *Awkward Commitment:* There is no such thing as dreaming, only sleep mentation that we retrospectively label as dreams.

  ***

  **Unseparable Leaves**

  **Leaf 3 (Expressivism) and Leaf 6 (Revisionism):** The tree cannot empirically separate these via reports alone. Both deny experiences during sleep. The distinction rests on whether the report is an expression of disposition or a conceptual labeling of mentation. This failure is due to the positions themselves overlapping in practical application.

  **Leaf 2 (Reconstructive Realism) and Leaf 5 (Minimal Phenomenality):** Both agree the report adds narrative structure missing from the raw data. Leaf 2 claims the experience had structure lost/changed; Leaf 5 claims it lacked structure entirely. Since we only have the report, we cannot verify the pre-report state. This failure is due to the cases lacking access to the occurrent state.
