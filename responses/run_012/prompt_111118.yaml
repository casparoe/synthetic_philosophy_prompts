  ### The Case: The Three-Stop Delivery

  **Scenario:**
  You are a courier with one perishable package. You must deliver it at exactly one of three stops along a cul-de-sac to collect a tip.
  *   **Stop 1 & 2:** Identical apartment buildings with unlabelled buzzer panels. You cannot tell them apart once you are standing at the door.
  *   **Stop 3:** A standalone house with a visible number "103" on the door. You recognize this immediately if you reach it.
  *   **Action:** At each stop, you choose **Deliver** (exit the game) or **Proceed** (continue to the next stop).
  *   **Constraint:** You can only deliver once. If you deliver at Stop 1 or 2, the game ends. If you reach Stop 3 without delivering, you *must* deliver there (game ends). If you proceed past Stop 3, the package spoils (Value 0).
  *   **Payoffs (Tips):**
      *   Deliver at Stop 1: Recipient is stingy. Value = **10**.
      *   Deliver at Stop 2: Recipient is generous. Value = **100**.
      *   Deliver at Stop 3: Recipient is angry (late). Value = **0**.
  *   **Indistinguishability:** At Stops 1 and 2, you face the same information set. You must adopt the same strategy $p$ (probability of Delivering) at both.
  *   **Lucidity:** You are sober and attentive. You simply cannot distinguish the buildings from the doorstep.

  ### Working the Case

  **1. Ex Ante Optimal Strategy**
  Let $p$ be the probability you Deliver at Stops 1 and 2.
  *   Probability of Delivering at 1: $p$. Payoff: 10.
  *   Probability of Reaching 2: $(1-p)$. Probability of Delivering at 2: $(1-p)p$. Payoff: 100.
  *   Probability of Reaching 3: $(1-p)^2$. Payoff: 0.

  The Ex Ante Value function $V(p)$ is:
  $$V(p) = p(10) + (1-p)p(100) + (1-p)^2(0)$$
  $$V(p) = 10p + 100p - 100p^2 = 110p - 100p^2$$

  To maximize, take the derivative and set to zero:
  $$V'(p) = 110 - 200p = 0 \implies p = \frac{110}{200} = 0.55$$

  **Ex Ante Optimal Value:**
  $$V(0.55) = 110(0.55) - 100(0.55)^2 = 60.5 - 30.25 = 30.25$$

  **2. Endogenous Probabilities (Condition iv)**
  When you stand at an indistinguishable door (Stop 1 or 2), what is the probability $\alpha$ that you are at Stop 1?
  This is fixed by your strategy $p$. You reach Stop 1 with probability 1. You reach Stop 2 with probability $(1-p)$.
  $$\alpha = \frac{\text{Prob(Reach 1)}}{\text{Prob(Reach 1)} + \text{Prob(Reach 2)}} = \frac{1}{1 + (1-p)}$$
  At the optimal $p = 0.55$:
  $$\alpha = \frac{1}{1 + 0.45} = \frac{1}{1.45} \approx 0.69$$
  You believe there is a 69% chance you are at Stop 1 and a 31% chance you are at Stop 2.

  **3. Local Dominance (Condition ii)**
  Given the plan $p=0.55$, compare the expected utility of **Deliver** vs. **Proceed** at the indistinguishable node.
  *   **EU(Deliver):** If at 1, get 10. If at 2, get 100.
      $$EU(D) = 0.69(10) + 0.31(100) = 6.9 + 31 = 37.9$$
  *   **EU(Proceed):** If at 1, you go to 2. At 2, your plan says Deliver w.p. 0.55 (Value 100) or Proceed w.p. 0.45 (Value 0). Expected Value at 2 = 55.
      If at 2, you go to 3 (Value 0).
      $$EU(P) = 0.69(55) + 0.31(0) = 37.95$$

  **Result:** $37.95 > 37.9$. **Proceed** is strictly better than **Deliver** at the node.
  However, the Ex Ante optimal plan requires you to **Deliver** with probability 0.55. Thus, the plan prescribes an action (Deliver) that is locally dominated.

  **4. Node-by-Node Chooser (Condition iii)**
  A chooser who reasons node-by-node and refuses to take a locally dominated action will choose **Proceed** (since $37.95 > 37.9$).
  If she chooses Proceed at the indistinguishable nodes ($p=0$):
  *   She Proceeds at 1.
  *   She Proceeds at 2.
  *   She Reaches 3 and Delivers (Value 0).
  *   **Node-by-Node Value = 0.**
  *(Note: If she anticipates this instability and settles on the pure "Exit" equilibrium to guarantee a positive payoff, the value is 10. Even then, $30.25 > 10$.)*

  **5. Three Responses**
  *   **Ex Ante Planner:** Commits to $p=0.55$ (e.g., using a randomizing app) before leaving the depot. Achieves value 30.25.
  *   **Node-by-Node Chooser:** Arrives at the door, calculates local EU, sees Proceed is better, sets $p=0$. Achieves value 0 (or 10 if she fearfully Exits).
  *   **Resolute Chooser:** Adopts the plan $p=0.55$ and ignores the local temptation to Proceed. Achieves value 30.25.

  **6. The Feature Doing the Work**
  The tension is generated by **endogenous belief updating**. Your strategy $p$ determines the likelihood that you are at Stop 1 vs. Stop 2. The Ex Ante optimum balances the chance of capturing the Stop 1 prize against the chance of surviving to Stop 2. However, at the node, the belief $\alpha$ makes Stop 1 seem likely (because if you were at Stop 2, you likely would have Delivered already *if* $p$ were high, but here the logic is circular). Specifically, the "belief effect" means increasing $p$ makes you more likely to be at Stop 1 conditional on arrival, which lowers the value of Proceeding. The Ex Ante planner internalizes this; the node-by-node chooser takes the belief as fixed and thus misaligns with the ex ante optimum.

  **7. Removing the Cue**
  If Stop 3 also lacked a number (all three indistinguishable), this becomes a standard 3-node Absent-Minded Driver problem. The puzzle persists, but the belief calculation $\alpha$ changes (now 3 nodes in the info set). The distinguishable cue at Stop 3 is not the source of the paradox; it merely anchors the end of the game.

  **8. Buying Back Recall**
  Suppose you can buy a device (e.g., a GPS tracker) that tells you which stop you are at for a price $c$.
  *   **With Perfect Recall:**
      *   At Stop 1: You know it's Stop 1. Proceed (Value at 2 is 100 > 10).
      *   At Stop 2: You know it's Stop 2. Deliver (Value 100 > 0 at 3).
      *   **Value = 100.**
  *   **Maximum Worthwhile Price:**
      *   Gain from Recall = Value(Recall) - Value(Optimal Imperfect) = $100 - 30.25 = 69.75$.
      *   Any price $c < 69.75$ is worth paying.
  *   **Artefact Claim:** The availability of this option does not show the puzzle is an artefact. It shows that imperfect recall is a *constraint* with an instrumental cost. The decision-theoretic puzzle concerns how to act rationally *given* the constraint, not whether the constraint is desirable. Rational agents should buy recall if cheap, but must still solve the dynamic choice problem if they cannot.

  **9. Probabilities in Node Reasoning**
  Does the node-by-node chooser need a probability over where she is? **Yes.** To calculate $EU(Deliver) = \alpha(10) + (1-\alpha)(100)$, she requires $\alpha$. Without a belief about her location, she cannot compare the actions. However, because her action affects $\alpha$ (via the strategy), her reasoning is unstable unless she accounts for the equilibrium relationship between $p$ and $\alpha$.

  Verdict: p = 0.55, ex ante value = 30.25, node-by-node value = 0, gap = 30.25, maximum worthwhile price of recall = 69.75.
