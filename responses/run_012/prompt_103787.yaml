answer: |-
  # Activity Design: "The Protective Belt"

  ## 1. Setting and Materials
  **Setting:** The year is 2150. Three research labs (the teams) are analyzing a repeating signal from a distant pulsar. The goal is to secure the next century of funding by demonstrating the best "Research Programme."

  **Materials:**
  *   **One Envelope:** Sealed, marked "The Law of Nature." Contains the hidden number sequence.
  *   **Three "Hard Core" Cards:** One for each team, defining their immutable assumption.
  *   **Whiteboard/Flipchart:** To track the "Public Data" (the signal numbers) and Team Scores.
  *   **Index Cards:** For teams to submit Patches and Predictions secretly (prevents cross-talk).
  *   **Tokens/Chips:** To represent "Funding Points."
  *   **Timer:** Visible to all.

  **Participants:** 12–16 people.
  **Groups:** 3 Teams (Alpha, Beta, Gamma) of 4–5 people.
  **Facilitator:** You (acting as "Nature" and the "Funding Agency").

  ## 2. Roles and Setup
  **The Teams:** Assign each team a **Hard Core**. This is the one rule they *cannot* change, no matter what data appears. If they change it, they are disqualified (they have abandoned the programme).
  *   **Team Alpha (Linear):** "The signal increases by a constant amount each round."
  *   **Team Beta (Geometric):** "The signal multiplies by a constant factor each round."
  *   **Team Gamma (Cyclic):** "The signal oscillates between high and low values."

  **The Funding Agency (You):** You control the data and the scoring. You do not sit with a team. You stand at the whiteboard.

  **The Hidden Rule:** Inside the envelope is the sequence: **3, 6, 12, 24**. (The rule is $x_{n+1} = x_n \times 2$).
  *   *Why this sequence?* It perfectly fits Team Beta. It forces Teams Alpha and Gamma to create increasingly complex "patches" to explain why the data doesn't fit their core.

  ## 3. The Payoff Scheme
  Write this on the board before starting.

  1.  **Accommodate (Patch):** Explain the *previous* round's data using your Core + a new Auxiliary Hypothesis.
      *   **Cost:** 0 Points.
      *   **Reward:** +10 Points (Banked Immediately).
      *   **Constraint:** You cannot change your Hard Core. You must add a new rule (e.g., "Sensor error," "Interference," "Decay rate").
  2.  **Predict:** State the *next* round's number before it is revealed.
      *   **Cost:** 5 Points (Deducted Immediately).
      *   **Reward:** +25 Points (Awarded only at the End Reveal).
      *   **Risk:** If wrong, you lose the 5 points with no reward.
  3.  **Abandon:** Declare your programme degenerating and switch to another team's Core.
      *   **Reward:** +15 Points (One-time lump sum).
      *   **Penalty:** You cannot score points in subsequent rounds.

  **The Strategic Trap:** Patching yields safe, immediate points (10, 20, 30...). Predicting is costly and risky (-5, -10...). By the end of the game, the team that patched every round will have more *visible* points than the team that predicted correctly, unless the predictors got lucky multiple times. This mirrors how degenerating programmes often hold onto funding longer than progressive ones in the short term.

  ## 4. Round-by-Round Timeline (90 Minutes)

  **00:00 – 00:15: Setup & Rules (15 mins)**
  *   Read the Hard Core cards to the teams.
  *   Explain the Payoff Scheme.
  *   **Crucial Instruction:** "You may not touch your Hard Core. If the data contradicts your Core, you must invent a reason why the *data* is special, not why the *Core* is wrong. This is your Protective Belt."
  *   Open the Envelope. Write the first number (**3**) on the board.

  **00:15 – 00:25: Round 1 (10 mins)**
  *   Teams discuss.
  *   **Action:** All teams must **Accommodate**. (It's the first number; no prediction possible yet).
  *   **Reveal:** Write the second number (**6**) on the board.
  *   **Scoring:** Award +10 to all teams for a plausible explanation (e.g., Alpha: "Start value 3, slope 3"; Beta: "Start 3, factor 2"; Gamma: "Low point of cycle").

  **00:25 – 00:35: Round 2 (10 mins)**
  *   **Action:** Teams choose **Accommodate** OR **Predict** Round 3.
  *   *Note:* Most will Accommodate to build a buffer.
  *   **Reveal:** Write the third number (**12**) on the board.
  *   **Scoring:** Bank Accommodation points (+10). Deduct Prediction costs (-5). Do *not* award Prediction rewards yet.
  *   *Status Check:* Alpha (Linear) expects 9. Got 12. They must Patch (e.g., "Acceleration detected"). Beta expects 12. No patch needed. Gamma expects <3. Must Patch heavily (e.g., "Cycle period shifted").

  **00:35 – 00:45: Round 3 — The "Gaming" Round (10 mins)**
  *   **Special Rule:** For this round only, a Prediction is valid if it is *logically consistent* with your Core, even if it is vague.
  *   **Action:** Teams choose Accommodate OR Predict.
  *   *The Trap:* A team can predict "The number will be greater than 6" (True for 12 and 24). This is novel (not yet observed) but empty.
  *   **Reveal:** Write the fourth number (**24**) on the board.
  *   **Scoring:** Bank Accommodation points. Deduct Prediction costs.
  *   *Facilitator Note:* If a team makes the "Empty Prediction" (e.g., ">6"), award them the *potential* points. Do not call it out yet. Let them feel clever.

  **00:45 – 00:55: Round 4 (10 mins)**
  *   **Action:** Teams choose Accommodate OR Predict Round 5.
  *   **Crucial:** No Reveal for Round 5. This is the "Future."
  *   **Scoring:** Bank Accommodation points. Deduct Prediction costs.
  *   *State of Play:* Team Beta (Geometric) likely predicted 24 correctly in Round 3 and is predicting 48 for Round 5. Team Alpha (Linear) has patched twice ("Acceleration," "Drift") and likely Accommodated again for safe points.

  **00:55 – 01:15: The Tally & The Reveal (20 mins)**
  *   **01:10:** Count the **Banked Points** (Accommodations + Prediction Costs). Display publicly.
      *   *Likely Outcome:* Team Alpha (Patching) has the highest visible score. Team Beta (Predicting) has a lower visible score due to costs.
  *   **01:15 (THE REVEAL):** Open the Envelope. Read the Law: "Double the previous number."
  *   **Award Prediction Rewards:** Give +25 to any team that correctly predicted Round 3 (24) and Round 5 (48).
  *   **Final Score:** Announce the winner based on total points.
      *   *Note:* Even if Beta wins on points, Alpha will have *more Banked Points*. Highlight this. Alpha played "safe science." Beta played "risky science."

  **01:15 – 01:30: Debrief (15 mins)**
  *   Map the game to Lakatos (see Section 6).

  ## 5. The Rules (Read Aloud Script)
  "Welcome to the Pulsar Project. You are Lead Architects of three competing Research Programmes.

  **Rule 1: The Hard Core.** Look at your card. This assumption is sacred. You cannot change it. If the data contradicts it, the data is complicated, not your Core. You protect the Core by adding ideas to your 'Protective Belt'—auxiliary hypotheses about sensors, interference, or conditions.

  **Rule 2: Actions.** Each round, you may **Accommodate** or **Predict**.
  *   **Accommodate:** Explain the number I just wrote. If I accept your explanation as consistent with your Core, you get 10 points immediately.
  *   **Predict:** Write down the *next* number. It costs 5 points to submit. If you are right at the end of the game, you get 25 points. If wrong, you lose the 5.

  **Rule 3: Progress.** Your goal is to maximize funding (points). But remember: a programme that only explains the past is safe. A programme that predicts the future is risky.

  **Rule 4: Round 3 Special.** In Round 3 only, predictions may be qualitative (e.g., 'Higher than last time') provided they follow from your Core.

  Begin Round 1. The first signal is... **3**."

  ## 6. Debrief Guide: Mapping Play to Lakatos
  Do not lecture. Ask these questions to draw the connections out of them.

  1.  **The Hard Core:** "Team Alpha, when the number 12 appeared, your Core said it should be 9. Did anyone suggest changing the Core to 'Multiplication'?" (No, because rules forbade it).
      *   *Lakatos Concept:* **Negative Heuristic.** We direct attacks away from the core.
  2.  **The Protective Belt:** "Team Alpha, how many extra rules did you add? ('Sensor drift', 'Acceleration', etc.)?"
      *   *Lakatos Concept:* **Protective Belt.** The belt absorbs the anomalies to save the core.
  3.  **Degenerating vs. Progressive:** "Team Alpha had more *banked* points. They explained every anomaly. Team Beta took risks. Who was doing 'better' science?"
      *   *Lakatos Concept:* **Degenerating Programme.** Alpha was catching up with anomalies (patching). Beta was anticipating them (predicting).
      *   *Key Insight:* "In real time (Minute 60), Alpha looked more successful (more points). Only in hindsight (The Reveal) did we see Beta was progressive. There was no procedure *during* the game to prove Beta was right before Round 5."
  4.  **The Gaming Round:** "Team [Name], you predicted 'Greater than 6.' You got points. Was that scientific progress?"
      *   *Lakatos Concept:* **Excess Empirical Content.** A prediction must be precise. Vague predictions that are guaranteed to succeed are theoretically empty, even if they score points. This shows how criteria can be gamed.

  ## 7. Predictable Failure Modes & Fixes

  1.  **Failure:** Teams argue with you (Nature) about whether a Patch is acceptable.
      *   **Fix:** You are the Funding Agency, not Truth. Say: "Your patch is internally consistent. I accept it. +10 Points." Do not debate truth, only consistency with the Core.
  2.  **Failure:** Team Alpha (Linear) abandons in Round 2 because the math is too hard.
      *   **Fix:** Encourage "Qualitative Patches." They don't need to calculate the exact drift, just posit that it exists. "Sensor Calibration Error" is enough.
  3.  **Failure:** The "Gaming" prediction is too obvious, and everyone does it.
      *   **Fix:** If everyone does it, it doesn't matter. The debrief point remains: "You all scored points for saying nothing. That is degeneration."
  4.  **Failure:** The Session runs over time.
      *   **Fix:** Cut Round 4. End after Round 3 Reveal. The lesson holds with 3 data points (3, 6, 12). The "Future Prediction" (Round 4) can be verbal only, no scoring.

  ## 8. Limitations: What This Activity Cannot Reproduce
  *You must state this verbally in the last 5 minutes.*

  "This game simplifies Lakatos in one major way: **Judgment.** In this room, I am the judge of what counts as a valid patch. In real science, there is no Facilitator. The 'judgment' of whether a programme is degenerating or progressive is a social process that happens over decades among peers. Lakatos argues that there is no *instant* logical proof that a programme is dead; it is a historical verdict. Today, you felt the tension of that verdict in 90 minutes, but in reality, the 'Round 5' that confirms the progressive theory might not arrive for a generation. The discomfort you felt not knowing if Team Beta was right until the very end? That is the permanent state of scientific research."
