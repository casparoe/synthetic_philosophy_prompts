  | "The food is objectively bad." | The Bluebird Diner serves low-quality food. | Feeling | Yes, it is framed as a subjective assessment disguised as objectivity, which is socially acceptable. |
  | "Nobody gets fined." | There are no formal penalties for skipping trip traditions. | Rule | Yes, this is factually verifiable within the group's dynamic. |
  | "A convention is just a regularity we all follow because we all expect everyone else to follow it." | Conventions rely on mutual expectation rather than enforcement. | Convention | Yes, this accurately reflects the philosophical concept referenced without making a factual claim about the world. |
  | "It wasn't sacred." | The trip held no religious or inviolable status. | Feeling | Yes, this negates a potential assumption rather than making a risky positive claim. |
  | "The minute that stops, it's not that someone broke a rule. It's just that the thing isn't there anymore." | When a convention ends, no moral failure has occurred. | Convention | Only because of the hedge in the line, it describes the nature of conventions generally rather than promising future behavior. |
