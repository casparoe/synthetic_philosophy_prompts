answer: |-
  Thanks. Raise a glass, everyone. I promise I'll keep this short before the logs collapse.

  Twenty-one years. That's a long time to do anything, especially drive four guys to the same lake in Vermont. But we all know this is the last one. Dev's moving to Melbourne in the fall, and while we'd love to say we'll all just hop a plane next August, we're not going to lie to you. This is the end of this specific run.

  For those of you who haven't done the drive—Sarah, Jess, Mike—you've probably noticed we do things a certain way. We stop at the Bluebird Diner outside Rutland. The food is objectively bad. There is no rule that says we have to stop there. Nobody gets fined. But the one time Ryan skipped it for a work call, the whole trip felt like it had started in the wrong place. We put the tarp up in the same order. We sing the same three songs, badly, in the same order. When Dev brought Sarah the first time, we added the overlook stop. Nobody voted on it. It just happened, and now it's fixed.

  I read somewhere once—some philosopher named Lewis, maybe in the sixties—that there's a difference between a rule and a convention. A rule holds even if nobody expects it. A convention is just a regularity we all follow because we all expect everyone else to follow it. It could have been anything. Any diner would've done. Any song. It stays alive only as long as we keep expecting it. The minute that stops, it's not that someone broke a rule. It's just that the thing isn't there anymore.

  I think that's what this trip has been. It wasn't sacred. We don't owe it to each other to keep it going forever. It was just a thing we kept expecting each other to show up for. And knowing that it ends because the expectation changes—not because we fought, not because we failed—makes it easier to let go.

  So, to the Bluebird, and the bad coffee, and the convention itself. Thank you for existing while we expected you to.

