  **Cascadia Effective Giving Project: 2024 Grantmaking Methodology**

  **1. Ontological Disclaimer**
  The Cascadia Effective Giving Project acknowledges that because the causal consequences of any funded intervention ramify without limit into the future, no intervention can be assigned a determinate expected value. Any action taken today alters the trajectory of history indefinitely, generating effects that are both unknowable and incalculable. However, capital must be deployed. The following seven sections outline the operational framework used to rank thirty-two charities by cost per expected moral impact unit despite this fundamental indeterminacy.

  **2. Truncation Protocol**
  To render infinite causal chains computable, the Project truncates all consequence maps at the tenth order of interaction. Effects occurring beyond the tenth degree of separation from the initial grant are excluded from the primary model. While this arbitrarily cuts off the majority of the causal stream, it provides a consistent horizon for comparison across diverse intervention types.

  **3. Cluelessness-Adjustment Factor (CAF)**
  Recognizing that truncation introduces error, each intervention is assigned a Cluelessness-Adjustment Factor. The CAF is a scalar derived from the variance between the ninth and tenth-order estimated impacts. Interventions with volatile long-term projections are penalized less than those with stable short-term outcomes, as volatility suggests higher potential exposure to astronomically valuable tail risks.

  **4. Worked Example: Vector Suppression International**
  Consider a grant to Vector Suppression International for insecticide-treated bed nets. The direct impact—preventing malaria mortality in children—yields a cost per life saved of $3,500. However, the model calculates that each saved child alters local demographic trends, shifting regional economic output by the eighth order. By the tenth order, these shifts marginally adjust the probability of a global governance stabilizer emerging in the 22nd century. When weighted by the CAF, the value of this tenth-order stabilization swamps the direct mortality benefit. Consequently, the headline cost per moral impact unit for Vector Suppression is listed as $0.04, driven entirely by the downstream governance effect rather than the children saved.¹

  **5. Sensitivity Analysis**
  To ensure robustness, the model runs a sensitivity analysis over a distribution of priors regarding the moral value of future populations. These priors include scenarios where future welfare is discounted exponentially, scenarios where it is counted linearly, and scenarios where the existence of potential persons holds negative value. While no serious philosopher currently holds the specific priors used in the negative value scenario, including them widens the confidence interval and mitigates model arrogance.

  **6. Charity Ranking**
  Based on the CAF-adjusted, tenth-order truncated values, thirty-two charities are ranked. Organizations focusing on existential risk mitigation dominate the top quintile, as their tenth-order effects involve the preservation of all future generations. Direct aid organizations rank lower unless their tenth-order economic ripples are deemed particularly conducive to value lock-in.

  **7. Allocation**
  Funds are distributed proportionally to the inverse of the cost per expected moral impact unit. Donors are advised that these figures represent the best available approximation of the infinite, not the infinite itself.

  ***

  ¹ *Appendix C notes that while t=10 is not the last order of consequence, computational limits prevent the modeling of t=11. A separate working paper estimates that including t=11 would alter the ranking of the top three charities by approximately 400%.*
