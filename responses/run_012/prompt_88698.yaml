answer: |-
  # Seminar Session: The Bargainer's Dilemma (Nash vs. Kalai–Smorodinsky)

  **Session Goal:** Students will experience the axiomatic conflict between **Independence of Irrelevant Alternatives (IIA)** and **Individual Monotonicity** (responsiveness to the "Utopia" point) by negotiating two sequential bargaining games. They will commit to a division rule in a symmetric case, then face an asymmetric case where adhering to that rule violates a competing intuition about fairness.

  **Class Size:** 18 Students.
  **Time:** 90 Minutes.
  **Room:** Movable tables.
  **Materials:**
  1.  **Worksheet A (The Negotiator's Log):** One per pair. Contains grids for Game 1 and Game 2, space to record the "Rule," and the final agreement.
  2.  **Worksheet B (The Arbiter's Brief):** One per quartet. Contains the paired results from Round 1 and 2 and discussion prompts.
  3.  **Tokens (Optional):** 200 colored chips per pair (to represent points), or simply have them write numbers.
  4.  **Projector/Board:** For the final debrief diagrams.

  ---

  ## 1. Payoff Scheme & Game Structure

  **Utility:** Points on the worksheet represent *utility*, not money. $d = (0,0)$ in all cases (no deal means zero points).
  **Feasible Sets:** Defined by linear constraints on the worksheet grids.

  *   **Game 1 (The Baseline):**
      *   **Constraint:** $x + y \le 100$.
      *   **Max Potential (Utopia):** Player A = 100, Player B = 100.
      *   **Disagreement:** $(0,0)$.
      *   **Expected Focal Point:** $(50, 50)$.

  *   **Game 2 (The Cap):**
      *   **Constraint:** $x + y \le 100$ **AND** $x \le 60$.
      *   **Max Potential (Utopia):** Player A = 60, Player B = 100.
      *   **Disagreement:** $(0,0)$.
      *   **The Conflict:** The outcome $(50,50)$ is *still feasible*.
      *   **Nash Prediction:** $(50, 50)$ (Because it was chosen in Game 1 and is available here).
      *   **K-S Prediction:** $(37.5, 62.5)$ (Intersection of Pareto frontier $x+y=100$ and line from origin to Utopia $(60,100)$).

  ---

  ## 2. Timeline (90 Minutes)

  ### **Phase 1: Setup & Pairing (0:00 – 0:10)**
  *   **0:00–0:05:** **Instructions.** Divide class into 9 pairs. Assign roles: Player A and Player B. Hand out **Worksheet A**.
  *   **0:05–0:10:** **The Contract.** Explain the rules:
      *   You must agree on a split of points $(x, y)$.
      *   If you fail to agree within the time limit, both get 0.
      *   **Crucial:** Before negotiating the numbers, write down the **PRINCIPLE** you will use (e.g., "Equal Split," "Equal % of Max," "Maximize Product"). You must stick to this principle in both rounds.

  ### **Phase 2: Round 1 – The Symmetric Baseline (0:10 – 0:25)**
  *   **Task:** Negotiate Game 1 ($x+y \le 100$).
  *   **Action:** Pairs agree on a split. Most will choose $(50, 50)$.
  *   **Commitment:** They must write down the *Rule* that justifies this.
      *   *Trap:* If they write "50-50 split," they haven't defined a rule. Push them to generalize: "Equal Division of Surplus" or "Equal Proportion of Maximum."
  *   **Instructor Role:** Circulate. If a pair says "We just split it," ask: "If the total pie was 200, what would you do? If Player A could only take 60, what then?" Force them to articulate a generalizable algorithm.

  ### **Phase 3: Round 2 – The Asymmetric Cap (0:25 – 0:45)**
  *   **Task:** Negotiate Game 2 ($x+y \le 100, x \le 60$).
  *   **Constraint:** You must apply the **SAME PRINCIPLE** from Round 1.
  *   **The Tension:**
      *   Pairs who chose "Equal Absolute Split" (Nash-like/IIA) will propose $(50, 50)$. Player A gets 50/60 (83% of max); Player B gets 50/100 (50% of max).
      *   Pairs who chose "Equal Proportion of Max" (K-S-like) will calculate ratios. $100:60 \to 5:3$. Split the 100 total accordingly. $(62.5, 37.5)$? Wait, KSS is line from $d$ to $u$. $y = (100/60)x$. $x + 1.67x = 100 \to x=37.5, y=62.5$.
      *   *Correction for Classroom Simplicity:* Don't ask them to calculate the KSS intersection perfectly. Ask them: "If you believe in Equal % of Max, what happens?"
      *   If Equal %: Both get $k\%$ of their Max. $k(60) + k(100) = 100 \to 160k = 100 \to k = 5/8 = 62.5\%$.
      *   Result: A gets $37.5$, B gets $62.5$.
  *   **Conflict:** Player A (in the "Equal %" group) sees their payoff drop from 50 to 37.5, even though the option $(50,50)$ is still on the table. Player B (in the "Equal Split" group) is asked to accept less relative satisfaction than A.
  *   **Instructor Role:** Stop the room at 0:40. Ask pairs who changed their mind to raise hands. Ask pairs who stuck to the rule but feel uneasy to raise hands.

  ### **Phase 4: Quartet Deliberation (0:45 – 1:05)**
  *   **Regroup:** Combine 2 pairs into quartets (4 groups of 4, 1 group of 2—merge the last pair into a group to make a sextet or have them roam).
  *   **Task:** Hand out **Worksheet B**.
  *   **Prompt:**
      1.  Compare your Round 1 Rule and Round 2 Outcome with the other pair.
      2.  **The Dilemma:** In Game 2, the option $(50,50)$ exists.
          *   Group 1 Argument: "It was fair yesterday, it's available today, why change it?" (IIA).
          *   Group 2 Argument: "Player A's potential shrank. It's unfair for A to keep 83% of their max while B only gets 50%." (Monotonicity/Proportionality).
      3.  **Vote:** Which principle must be sacrificed? Consistency of the Deal (IIA) or Consistency of Satisfaction (Monotonicity)?
  *   **Output:** Each quartet must prepare a 1-minute defense of which axiom they dropped and why.

  ### **Phase 5: Debrief & Theory Mapping (1:05 – 1:30)**
  *   **Board Work:** Draw the two feasible sets.
  *   **Mapping:**
      *   **Pareto Efficiency:** Everyone stayed on the line $x+y=100$.
      *   **Symmetry:** Game 1 forced symmetry.
      *   **Scale Invariance:** Briefly mention that points are utility, not dollars (though this activity assumes comparability, see Limitations).
      *   **The Clash:**
          *   **Nash Solution:** Picks $(50,50)$ in Game 2. **Satisfies IIA** (ignores the removed $x>60$ options). **Violates Monotonicity** (A's payoff didn't drop despite A's Utopia shrinking).
          *   **Kalai-Smorodinsky:** Picks $(37.5, 62.5)$ in Game 2. **Satisfies Monotonicity** (A's payoff drops as A's Utopia drops). **Violates IIA** (Rejects $(50,50)$ even though it was available in both sets).
  *   **Visual:** Draw the Utopia line from $(0,0)$ to $(60,100)$. Show how KSS slides down this line, while Nash stays at the old anchor.

  ---

  ## 3. Materials Detail

  **Worksheet A (The Negotiator's Log)**
  *   **Round 1 Grid:** Triangle $(0,0)-(100,0)-(0,100)$.
  *   **Round 2 Grid:** Same triangle, but shaded out where $x > 60$.
  *   **Fields:**
      *   "Our Rule/Principle": ________________
      *   "Round 1 Split": (___, ___)
      *   "Round 2 Split": (___, ___)
      *   "Did anyone feel this result was unfair? Why?": ________________

  **Worksheet B (The Arbiter's Brief)**
  *   **Scenario:** "You are the Supreme Court of Bargaining."
  *   **Case Facts:** In Case 2, the outcome $(50,50)$ was legally possible.
  *   **Question 1:** If you uphold $(50,50)$, what right does Player B have to complain?
  *   **Question 2:** If you uphold $(37.5, 62.5)$, what right does Player A have to complain? (They lost points despite the 'pie' being the same size).
  *   **Verdict:** Which Axiom is more important for a stable society? IIA or Monotonicity?

  ---

  ## 4. What Will Predictably Go Wrong (and How to Handle It)

  **1. The Reflexive 50-50 Split in Round 2**
  *   **Problem:** Students will ignore the $x \le 60$ cap's implication on *proportion* and just split the 100 evenly because "it's still 100."
  *   **Fix:** During Round 2 circulation, ask Player B: "Player A can never get more than 60. You can get 100. If you settle for 50, you are getting half your potential. They are getting 5/6 of theirs. Is that the rule you wrote down?" Force them to confront the *percentage*, not the absolute number.

  **2. Money Illusion / Risk Aversion**
  *   **Problem:** Students treat points as money. "Why would I accept 37.5 when I can demand 50?"
  *   **Fix:** Reiterate in the intro: "These are utility points. 50 points means different things to different people if their maximums differ. Pretend you are agents maximizing your client's satisfaction relative to their best possible day."

  **3. The "Fairness" Black Box**
  *   **Problem:** In the quartet debate, they argue "It's just fair" without referencing the rule.
  *   **Fix:** Worksheet B requires them to identify *which axiom* they are violating. Write the terms **IIA** and **MONOTONICITY** on the board before Phase 4. Tell them they must use these words in their verdict.

  **4. Running Long**
  *   **Problem:** Negotiations drag.
  *   **Fix:** Hard stop timers. Use a visible countdown. If Round 2 isn't finished by 0:40, freeze them at their current proposal and move to debrief. The *conflict* matters more than the *agreement*.

  **5. The Leftover Students (18 doesn't divide by 4)**
  *   **Problem:** 9 pairs $\to$ 4 quartets leaves 2 students.
  *   **Fix:** Make one group of 6 for the debate phase. Larger groups generate more noise, which is fine for the "chaos of disagreement" feel. Or, assign the extra pair as "Roving Auditors" who must visit two quartets and report which group had the strongest argument.

  ---

  ## 5. What This Activity Cannot Reproduce (Limitations)

  **1. Scale Invariance (Affine Transformation)**
  *   **Gap:** The activity assumes points are comparable across players. Formal Nash theory requires invariance if we change Player A's scale (e.g., multiply A's utility by 2).
  *   **Reality:** Students treat 1 point for A as equal to 1 point for B.
  *   **Instructor Close:** In the last 5 minutes, explicitly state: "Today you assumed utility was comparable (1 point for you = 1 point for me). Nash Bargaining actually works even if we can't compare utility, provided we know the *shape* of the preferences. Kalai-Smorodinsky *requires* comparable utility to draw that line to the Utopia point. You just did KSS thinking, which presupposes more information than Nash."

  **2. Uniqueness Proofs**
  *   **Gap:** They won't see *why* these are the *only* two solutions satisfying the respective axiom sets.
  *   **Instructor Close:** "We found two consistent rules. The math proves there are no others that satisfy these specific combinations of axioms. You discovered the only two viable candidates."

  **3. The "Why" of IIA**
  *   **Gap:** IIA feels unnatural in this game (why ignore the cap?). In formal theory, IIA is about strategic consistency, not just fairness.
  *   **Instructor Close:** Explain that IIA prevents manipulation. "If I could change the solution by adding options I never intend to choose, I could game the system. Nash prevents that gaming. KSS allows it to preserve proportionality."

  **4. Convexity**
  *   **Gap:** We used linear frontiers. Nash and KSS diverge more dramatically on curved frontiers.
  *   **Instructor Close:** "We used straight lines for simplicity. On curved frontiers, the gap between 'Maximizing the Product' (Nash) and 'Equalizing Relative Gains' (KSS) becomes even wider."

  ---

  ## 6. Instructor Script for the "Aha" Moment (Debrief)

  *   **Step 1:** Draw Game 2 on the board. Mark $(50,50)$. Mark $(37.5, 62.5)$.
  *   **Step 2:** "Who chose $(50,50)$? You prioritized **Independence of Irrelevant Alternatives**. You said: 'If the deal was good enough when A could get 100, it's good enough when A can only get 60.' You value the stability of the agreement over the change in potential."
  *   **Step 3:** "Who chose $(37.5, 62.5)$? You prioritized **Individual Monotonicity** (or Proportional Concession). You said: 'If A's best-case scenario shrinks, A's claim on the surplus should shrink relative to B.' You value relative satisfaction over the stability of the specific number."
  *   **Step 4:** "Nash buys Consistency (IIA) by paying with Monotonicity. Kalai-Smorodinsky buys Monotonicity by paying with Consistency (IIA). There is no free lunch. You just felt the price."
