prompt: |-
  You are designing a single session for an upper-level undergraduate seminar in rational choice and social choice theory: roughly eighteen students, ninety minutes, in a room with movable tables so they can work in pairs and then combine into quartets. Most have seen Nash equilibrium and the notion of a utility function; none has studied bargaining theory formally; none will have internet access during the session. I want them to feel, in their own bargaining, the tension that makes the Kalai–Smorodinsky solution a genuine rival to Nash's rather than a curiosity. Specifically, I want them to discover for themselves that a division rule which is symmetric, scale-invariant, and Pareto-efficient cannot simultaneously ignore irrelevant alternatives and respond monotonically when one party's best available outcome improves — and to see the disagreement point and the utopia point doing real work before I ever name either solution.

  Design the activity so the conflict arises from the rules, the payoffs, and the roles, not from anything I announce. The participants should commit to something — a division rule, a split, a principle — and then be led, by the structure of later rounds, into a case where holding to it forces them to abandon an intuition they endorsed a few minutes earlier. I want the room to disagree about which intuition to give up, because that disagreement is the whole point. Please give me: the materials (assume I can prepare tokens or point sheets and a one-page worksheet); a payoff scheme in points with no real money, including the disagreement payoff and how the outside/utopia options are generated; a round-by-round timeline that fits ninety minutes; the roles or pairing structure; and a debrief that maps specific moments in the session onto Pareto efficiency, symmetry, scale invariance, independence of irrelevant alternatives, and individual monotonicity, then shows how Nash's solution and the Kalai–Smorodinsky solution each buy consistency by paying for it with one of those principles — the product-maximizing point versus the intersection of the Pareto frontier with the line from the disagreement point to the utopia point. Make the debrief show, at the level of what they just did, why the two solutions diverge in the asymmetric case.

  Also tell me what will predictably go wrong the first time I run this and how to handle it — I expect reflexive fifty-fifty splits, at least one pair treating the points as money, the asymmetric round turning into a fairness argument rather than a test of their own rule, and some risk of running long. And be honest about what the activity cannot reproduce: I assume it cannot convey the characterization proof or the uniqueness of either solution, cannot make the case for scale invariance feel compelling rather than stipulated, and quietly presupposes that the parties' utilities are comparable in a way the formal setup does not license — tell me what else it flattens, and which of these gaps I have to close myself in the last ten minutes.
