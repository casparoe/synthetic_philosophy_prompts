  "I told a date, 'I'm not looking for anything serious.' He heard, 'I'm not interested in you.' I meant, 'I'm terrified.' He started to leave. I said, 'Wait, I don't mean 'not interested'.' He said, 'Too late. I already recognized you intended me to hear it.' I said, 'I intended you to recognize that I wanted to protect myself.' He said, 'So you meant 'serious'?' I said, 'I meant I intended you to recognize my fear.' He said, 'So are we serious?' I said, 'I'm not looking for anything serious. But I'm not implying 'no' anymore.' He said, 'It's too late. I heard the 'no'.' I said, 'Good. Because I meant you to.'"

  ***

  The joke flouts the Maxim of Quantity by providing less information than required ("not serious" instead of "terrified"), generating the unavoidable implicature that the speaker is uninterested. The cancellation lands on the line "I don't mean 'not interested'," attempting to withdraw the inference without contradicting the literal statement. The reflexive condition does its work in the final punchline: the speaker admits she intended the hearer to recognize her intention to imply rejection, thereby satisfying the Gricean definition of *meaning* (intending the hearer to produce a response by recognizing that intention) even while denying commitment to the truth of the implicature itself. The hearer is left holding the inference ("she's not interested") that the speaker never actually believed, but successfully meant.
