  **The Joke**

  A philosopher promises his wife he will stop gambling. She goes abroad for a month. He gambles immediately, wins big, and she returns none the wiser. She suffers no financial loss; in fact, the household is richer.

  He asks his reading group: "Did I do wrong, and if so, to whom?"

  The Reliance Theorist says, "No wrong. She didn't rely on your restraint, and she suffered no loss. You increased utility."

  The Assurance Theorist says, "You wronged *her*. You invited her to hold a claim against you, then violated it. The harm is irrelevant."

  The Conventionalist says, "You wronged *us*. You undermined the institution of promising. The promisee is incidental."

  So the philosopher tries to make restitution. He offers the winnings to the Conventionalist to repair the institution. He offers a receipt to the Assurance Theorist to satisfy the wife's claim. He offers nothing to the Reliance Theorist.

  The Conventionalist refuses the money: "Bribery undermines the practice further."
  The Assurance Theorist refuses the receipt: "She didn't authorize me to accept on her behalf."
  The Reliance Theorist pockets the winnings and says, "See? I told you nothing was bound."

  ***

  **A Note on the Theories**

  This joke exploits the "harmless breach" edge case, specifically where the promisee remains ignorant of the violation. It takes liberties with all three positions for the sake of the punchline. The Reliance view is caricatured as purely consequentialist; sophisticated reliance theorists (like those in the legal tradition) often argue that the *risk* imposed on the promisee is the harm, even if it doesn't materialize. The Assurance view (associated with T.M. Scanlon) is presented as creating a claim that exists independently of the promisee's knowledge of the breach; while Scanlon argues the wrong lies in violating the principle of Fidelity (which concerns the expectations one *invites*), some critics argue that if the promisee never knows, the interpersonal relationship is untouched. The Conventionalist view (Rawlsian) is treated as requiring restitution to the "practice" itself, whereas most practice theorists view the obligation as a duty to *follow* the rules, not to compensate the institution.

  The genuine seam here is the **location of the wrong**. It is settled among competent theorists that these three accounts locate the normative force differently (social institution vs. interpersonal claim vs. detrimental reliance). However, it is genuinely contested whether a "secret breach" constitutes a wrong under the Assurance and Practice views. Practice theorists disagree on whether an undetected breach damages the institution's stability. Assurance theorists disagree on whether a claim can be violated if the claimant is unaware of the violation. The joke treats these contested edge cases as settled contradictions to force the laugh.
