  0.04

  **Reasoning**

  The strategy-stealing argument (SSA) relies on two structural pillars: the ability to appropriate the opponent's strategy without penalty, and the monotonicity of advantage (a move never hurts). In combinatorial games like Hex, a move occupies space; it restricts the opponent but never restricts the mover's future options in a way that negates the value of the move itself. In argumentation, a move is a commitment. To assert a proposition is to accept the burden of defending it, to expose it to refutation, and to constrain future consistency. This creates "argumentative zugzwang": situations where silence is strategically superior to speech because speech creates attack surfaces.

  Furthermore, the SSA requires a binary win condition. In chess, you win or lose. In appellate argument or negotiation, "victory" is often a gradient of persuasion, settlement value, or judicial discretion, which breaks the "guaranteed win" definition. Even in formal debate, judging is subjective, introducing noise that a deterministic strategy cannot overcome. Finally, the diagnostic clause ("wherever an opener appears disadvantaged... attributable to asymmetry") assumes that if the premises held, the first player would *never* be disadvantaged. However, in complex games with unbounded trees and bounded rationality, the first player may lose simply because the winning strategy is computationally inaccessible, not because it doesn't exist. The claim conflates theoretical existence with practical realizability.

  **Decomposition**

  1.  **0.40** — Probability that a real-world adversarial format is symmetric in rules and payoffs, given that most assign distinct burdens of proof (e.g., Plaintiff/Defendant, Affirmative/Negative).
  2.  **0.20** — Probability that additional assertion is costless in such a format, given that commitments create consistency constraints and exposure to refutation (argumentative zugzwang).
  3.  **0.90** — Probability that the conclusion follows from the premises, assuming the SSA logic holds for the abstract structure of turn-taking and strategy appropriation.
  4.  **0.60** — Probability that observed first-mover disadvantage is due to rule asymmetry rather than computational complexity or bounded rationality hiding the winning strategy.
  5.  **0.90** — Probability that the format defines victory objectively (binary win/loss), filtering out formats where outcomes are subjective or gradient.

  **Combination**

  $$0.40 \times 0.20 \times 0.90 \times 0.60 \times 0.90 = 0.03888 \approx 0.04$$

  I model the credence as the joint probability of all necessary conditions holding simultaneously; if any premise fails (particularly the cost of assertion), the diagnostic claim collapses.

  **Sensitivity**

  The final number is most sensitive to the **Probability that additional assertion is costless (0.20)**. If argumentative moves were truly costless (no estoppel, no credibility risk, no consistency burden), the credence would rise to approximately 0.20, as the SSA would become directly applicable.

