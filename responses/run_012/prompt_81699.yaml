answer: |-
  ### Session Plan: The Social Construction of Kinds (90 Minutes)

  #### I. Sequence and Dependencies
  You must teach the three dimensions of construction in a specific linear order. Reversing this order guarantees the misconceptions you aim to cure.

  1.  **Causal Construction (Minutes 0–25):** Establish that social forces *cause* the kind to exist.
      *   *Dependency:* This must come first because it secures **Reality**. It answers the question, "Did this happen by nature or by history?"
      *   *Why Reverse Fails:* If you start with Constitutive Construction (rules/definitions), students hear "defined by us" and immediately infer "therefore optional/unreal." You must anchor the kind in historical causality first to prove it has weight.
  2.  **Constitutive Construction (Minutes 25–50):** Establish that the kind's *identity* depends on collective acceptance or rules.
      *   *Dependency:* This requires Causal Construction to be secure. Students must accept that the kind has a history before they accept that its *essence* is rule-bound.
      *   *Why Reverse Fails:* If you start here, the Law students will dominate with technicalities, and Public Health students will dismiss the kind as "bureaucratic" rather than ontological.
  3.  **Interactive/Looping Construction (Minutes 50–75):** Establish that classifying the kind changes the individuals within it.
      *   *Dependency:* This requires Constitutive Construction. You cannot explain how a classification *reshapes* a target unless the students first understand what constitutes the classification.
      *   *Why Reverse Fails:* If you start with Looping, students view construction as merely "psychological reaction." They miss the structural rigidity of the kind itself.

  #### II. The Single Example: "The Refugee"
  Do not use Money, Race, or Gender as your primary teaching vehicle. Use **The Refugee**.

  **Defense of "The Refugee":**
  *   **Against Money:** Money is the canonical example in philosophy (Searle), but it is dangerous here. It is too easy for students to concede money is "just trust" and therefore "not physically real." This reinforces the binary you are trying to break. "The Refugee" involves biological stakes (starvation, disease, trauma) that Public Health students cannot dismiss as "just ideas," while retaining the legal status that Law students respect. It forces the intersection of biology and bureaucracy.
  *   **Against Race and Gender:** These are the *applications*, not the *illustration*. Your students arrive with entrenched defensive positions on these categories (either "biologically fixed" or "purely performative"). Using them first triggers ontological warfare rather than conceptual learning. You need a neutral ground to build the machinery of argument before applying it to high-stakes identity categories.
  *   **Why "The Refugee" Works:**
      1.  **Real/Potent:** No one denies refugees suffer real consequences (detention, aid, health outcomes).
      2.  **Social Cause:** The category exists due to specific treaties (1951 Convention) and geopolitical history.
      3.  **Constitutive:** One is not a refugee by biology, but by state/UN recognition (papers, status determination).
      4.  **Feedback Loop:** The status reshapes the individual (camp life, trauma of waiting, identity as "victim" or "survivor").

  **Integration of Race and Gender:**
  Bring Race and Gender in during the final 15 minutes (Module IV) as **Application Cases**. Ask: "Now that we have the machinery from the Refugee case, how does it apply to Race?" This allows them to use the tool rather than fight the tool.

  #### III. Mapping Misconceptions
  You must intercept misconceptions at specific points. If you address them too early, they are abstract; too late, they are calcified.

  1.  **"Constructed means Fictional/Unreal"**
      *   *Intercept Point:* End of Module I (Causal).
      *   *Strategy:* Show that social causes (war, policy) produce physical effects (malnutrition, PTSD).
      *   *Timing:* If you wait until Module III, the "unreal" reflex will have prevented them from engaging with the mechanics of constitution. You must secure "Real" before explaining "How."
  2.  **"Constructed means Arbitrary/Easily Changed"**
      *   *Intercept Point:* End of Module II (Constitutive).
      *   *Strategy:* Show the rigidity of the rules. A person cannot become a refugee simply by wishing it; the institutional barriers are high.
      *   *Timing:* If you do this in Module I, they haven't yet seen the rules. If you wait until Module III, they will assume the "Looping" means the category is fluid. You must show the *walls* before you show the *movement*.
  3.  **"Individual Opt-Out" (If it's constructed, I can leave it)**
      *   *Intercept Point:* Module III (Interactive).
      *   *Strategy:* Demonstrate that the classification acts *upon* the individual regardless of their consent (e.g., detention based on status).
      *   *Timing:* This is the most dangerous error. It must be handled exactly when you introduce the feedback loop. If handled earlier, it's hypothetical. If handled later, the session ends on a note of individual agency rather than structural constraint.

  #### IV. The Three Meanings and Distinctions
  You must explicitly separate these three claims. Do not let them blur.

  1.  **Social Causes (Etiology):** *Why the kind exists.* (Enters Module I).
      *   *Work done:* Public Health. This explains health disparities and determinants.
  2.  **Constitutive Practice (Ontology):** *What makes the kind what it is.* (Enters Module II).
      *   *Work done:* Law. This explains rights, status, and eligibility.
  3.  **Feedback Loop (Dynamics):** *How the kind changes the members.* (Enters Module III).
      *   *Work done:* Anthropology. This explains lived experience and identity formation.

  **Individual vs. Kind Construction:**
  You must make this distinction in Module II.
  *   *The Claim:* The *Kind* ("Refugee") is constructed. The *Individual* (the human being) is not "constructed" in the sense of being fake, but their *social reality* is constituted by the kind.
  *   *Why:* This prevents the "Opt-Out" misconception. The human is real; the box they are put in is constructed, but the box has steel walls.

  **The Normative Slide ("Ought to be Abolished"):**
  *   *Location:* The very last 5 minutes of content (Module IV).
  *   *Reasoning:* Only after establishing that a kind is Real, Constituted, and Looping can you ask if it *should* exist. If you introduce this earlier, students will conflate "is constructed" with "is unjust." You must separate the *Is* (ontology) from the *Ought* (ethics).

  #### V. Check for Understanding
  Do not ask for definitions. Do not ask "Is race real?"
  **The Task:** Present a specific policy proposal.
  *   *Prompt:* "A legislator proposes abolishing the legal category of 'Felon' because it is 'socially constructed and therefore discriminatory.' Based on today's session, identify which sense of 'constructed' the legislator is relying on, and predict one specific unintended consequence of this abolition using the 'Feedback Loop' concept."
  *   *Success Indicator:* The student identifies the legislator is conflating **Constitutive** (it's a legal rule) with **Arbitrary** (it's easy to change). They predict that without the classification, specific rehabilitative or restrictive mechanisms (the loop) might vanish or shift, affecting recidivism or safety.
  *   *Failure Indicator:* The student says "The legislator is right because felons aren't real" or "The legislator is wrong because crime is biological."

  #### VI. Exclusions (What to Refuse)
  To stay within 90 minutes and maintain conceptual clarity, explicitly refuse to cover:
  1.  **The History of the Phrase:** Do not lecture on Foucault vs. Searle vs. Hacking. Use their ideas, but do not teach the genealogy of the theory.
  2.  **Biological Essentialism Debates:** Do not allow the session to devolve into "Is there a gene for X?" Acknowledge biology exists, but bracket it to focus on the *Kind*.
  3.  **Specific Normative Solutions:** Do not solve the problems of Race or Gender. Your job is to give them the ontology to analyze the problems, not to solve the politics.

  ### Summary of Flow
  *   **0-5:** Intro & The "Refugee" Case Setup.
  *   **5-25:** Module I: Causal (History causes the kind). *Kill "Fictional".*
  *   **25-50:** Module II: Constitutive (Rules define the kind). *Kill "Arbitrary". Distinguish Kind vs. Individual.*
  *   **50-75:** Module III: Interactive (Kind shapes the person). *Kill "Opt-Out".*
  *   **75-85:** Module IV: Application (Race/Gender) & Normativity (Abolition).
  *   **85-90:** Check for Understanding & Close.
