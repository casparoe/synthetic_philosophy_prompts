  ### The Distinguishing Situation
  To tell these rules apart for sure, you would need to put her in a **financial scenario where "holding" is framed as future gain, but "quitting" is framed as loss avoidance.**

  **The Test:**
  Imagine she buys a non-refundable ticket to a destination wedding for $1,000. The day before, the couple breaks up and cancels the wedding. They offer a 50% refund ($500) if she cancels now, or she can keep the full $1,000 credit for a future event with them (who knows when).
