answer: |-
  You are not missing a step, and your intuition that the word is doing "three different jobs" is correct. You have stumbled onto the single biggest fracture in American philosophy.

  Here is the breakdown without the jargon, translated into terms that should make sense to a backend engineer.

  ### 1. The James Trap: "True = What Works for Me"
  Your worry about William James is valid. If you take his most popular soundbites literally, yes, it sounds like: *"If believing the moon is made of cheese makes you happy and helps you sleep, then it's true for you."*

  But that is not actually what he meant by "works."

  For James, "working" doesn't mean "feeling good." It means **"successfully navigating reality."**
  *   **Engineering Analogy:** Think of a belief as a function. James is saying a function is "true" if it returns the expected output without throwing an exception when run against the production environment.
  *   If you believe "this bridge is safe," and you drive across it and don't die, the belief "worked." It had cash value.
  *   If you believe "this bridge is safe," and you drive across it and fall, the belief was false because it didn't work.

  **However,** James *did* argue that for things you cannot test (like religious faith or moral choices), you are permitted to adopt the belief that yields the better life outcome, *provided* the evidence is inconclusive. This is the "Will to Believe." This is where the ML researcher at the party got annoyed, because it sounds like you're optimizing for happiness rather than accuracy.

  **Verdict on James:** He is not saying truth is arbitrary. He is saying truth is a **property of ideas that prove reliable in experience.** But he is more willing than Peirce to let "reliability" include psychological comfort in non-scientific domains.

  ### 2. The Peirce Correction: "True = What We All Agree On Eventually"
  Charles Sanders Peirce was the founder of pragmatism, and he hated James's interpretation. He thought James made pragmatism too subjective.

  Peirce's view is closer to the Literature grad's description, but with a crucial engineering constraint.
  *   **The Claim:** Truth is the opinion that all investigators are *fated* to agree upon if they investigate long enough.
  *   **The Constraint:** It's not a vote. It's not "consensus" in the sense of a committee agreeing to disagree. It is consensus **forced by external reality.**
  *   **Engineering Analogy:** Think of a distributed system. Peirce's truth is **eventual consistency**. No matter which node you start at (which investigator), if you run the query long enough and handle all the edge cases, you will converge on the same state. If you don't converge, someone's code is buggy (wrong).

  Peirce was a scientist (chemists/astronomy). He believed reality is a "hard constraint" that pushes back. You can believe the stove isn't hot, but if you touch it, reality forces you to update your belief. Eventually, everyone who touches the stove agrees it's hot. That agreement *is* the truth.

  **Why he renamed it:** Peirce was so annoyed by James (and another philosopher named Schiller) turning his rigorous method into a "believe whatever makes you happy" self-help scheme that he renamed his own philosophy **"Pragmaticism."** He famously wrote that the name was "ugly enough to be safe from kidnappers."

  ### 3. Was the Literature Grad Right?
  She was mostly right about Peirce, but she missed the nuance about *why* they converge.
  *   **Her claim:** Truth is what the community converges on.
  *   **The nuance:** They converge because **reality forces them to.** It is not a social construct; it is a discovery process.
  *   **Is it a "Consensus Theory"?** Technically, yes, but not a democratic one. It's a "forced convergence" theory. If she implied that truth is just whatever scientists vote on today, she's wrong. If she meant "the limit of infinite scientific inquiry," she's right.

  ### 4. So, Which One is the "Real" Pragmatism?
  There is no "real" one, just as there is no "real" version of Linux (RedHat vs. Debian). They are different distributions of the same kernel.

  *   **Peirce** is the **Infra/Backend** pragmatist. He cares about the system, the long-term stability, the objective constraints, and the method of inquiry. He is the one the ML researcher *should* have been listening to, because Peirce respects the hardness of reality.
  *   **James** is the **Product/User** pragmatist. He cares about the human experience, the immediate utility, and the psychological impact of the belief.

  In serious academic metaphysics, **Peirce is usually the one taken seriously regarding truth.** James is taken seriously regarding psychology, religion, and ethics. When people attack pragmatism as "truth is just whatever is useful," they are usually attacking a caricature of James, ignoring Peirce entirely.

  ### 5. Direct Answers to Your Questions

  **Q: Isn't truth just whatever I decide to believe?**
  **A:** No. Even for James, a belief must "cash out" in actual experience. You can't just decide gravity doesn't apply to you. If you jump, you fall. The belief failed to work. You are not the arbiter of truth; your interaction with the environment is.

  **Q: Am I missing a step?**
  **A:** You aren't missing a step; you are spotting a bug in the popular explanation. The "missing step" is that "utility" implies **friction with the real world.** A map is useful only if it matches the territory. If the map is pretty but leads you off a cliff, it isn't pragmatic.

  **Q: Which one counts as the real pragmatist theory of truth?**
  **A:** If you want a theory of truth that fits science and engineering, it's **Peirce**. If you want a theory of how humans actually live and make decisions under uncertainty, it's **James**. Peirce is the "strict mode" compiler; James is the "runtime environment."

  **Q: Was she right to call Peirce's version a consensus theory?**
  **A:** It is acceptable shorthand, provided you understand that the consensus is **inevitable due to external constraints**, not negotiated. It's not that we agree the earth is round because we voted; it's that we agree because the evidence forces any rational investigator to that conclusion.

  ### Summary for the Party Argument
  If you ever get dragged into that again, here is the patch note:
  1.  **The ML guy** is attacking a strawman of James. Pragmatism doesn't say "truth is useful." It says "the *mark* of truth is that it proves useful in prediction and action."
  2.  **The Lit girl** is right about Peirce, but needs to emphasize that reality forces the consensus, not social pressure.
  3.  **You** can point out that Peirce himself hated James's version so much he changed the name of his philosophy to stop people from confusing them.

  Pragmatism isn't "truth is whatever works." It's "truth is what survives the test of experience." James focuses on the individual's test; Peirce focuses on the community's long-term test. Both require the code to run without crashing.
