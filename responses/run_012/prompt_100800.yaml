answer: |-
  # The Normative Strictness Taxonomy

  **Instructions:** Begin at **Node 1**. Answer the question based on your intuition about the case presented. Follow the arrow to the next Node or to a **Leaf** (final position). Record the path you take.

  ---

  ### NODE 1: The Nature of the Norm
  **Case:** Consider the rule "Drive on the right" versus the rule "Do not lie."
  **Question:** Is the primary value of the rule that we all do the *same* thing (coordination), or that we all do the *right* thing (moral truth), regardless of what others do?
  *   **Same Thing (Coordination):** Go to **Node 2**.
  *   **Right Thing (Moral):** Go to **Node 3**.

  ### NODE 2: The Arbitrariness of Equilibrium
  **Case:** Regarding the driving rule: Does it matter *which* side we drive on, provided we all agree on one?
  *   **No (Any side works):** Go to **Leaf A**.
  *   **Yes (Some equilibria are safer/better):** Go to **Node 3** (Merge with Moral path).

  ### NODE 3: Grounds for Conformity
  **Case:** A city considers a civility code requiring residents to keep front lawns tidy and greet neighbors.
  **Question:** Is enforcing this code valuable even if untidy lawns cause no financial loss or physical harm to anyone?
  *   **Yes (Builds character/community):** Go to **Leaf B**.
  *   **No (Only valuable if it prevents costs):** Go to **Node 4**.

  ### NODE 4: The Harm Threshold
  **Case:** Consider a norm that is loose enough to let a few visible free-riders impose diffuse costs on everyone else (e.g., noise pollution).
  **Question:** May society demand conformity only to prevent direct injury to a specific person, or also to prevent diffuse social costs?
  *   **Only Direct Injury:** Go to **Leaf C**.
  *   **Also Diffuse Costs:** Go to **Node 5**.

  ### NODE 5: Rule Function
  **Candidate Distinction:** Regulative vs. Constitutive.
  **Question:** Is the norm in question *constitutive* (it creates the activity, like the rules of a game) or *regulative* (it constrains a pre-existing activity, like traffic laws)?
  *   **Constitutive:** Go to **Node 6**.
  *   **Regulative:** Go to **Node 7**.

  ### NODE 6: Domain Variation
  **Case:** A public-health emergency requires a normally permissive society to tighten its rules temporarily.
  **Question:** Should the level of strictness change depending on the sphere of life (e.g., health vs. speech) or the context?
  *   **Yes (Different spheres/contexts):** Go to **Leaf D**.
  *   **No (One level for all):** Go to **Node 7**.

  ### NODE 7: Sub-Community Authority
  **Case:** A small religious community enforces strict internal norms while living inside a much looser surrounding society.
  **Question:** Should the wider society permit this sub-group to enforce stricter rules than the national average?
  *   **No (One standard for all):** Go to **Node 9**.
  *   **Yes (Allow sub-groups):** Go to **Node 8**.

  ### NODE 8: Conditions of Membership
  **Question:** Is this permission granted only if members can credibly exit the community rather than merely voice objection?
  *   **Yes (Exit is required):** Go to **Leaf E**.
  *   **No (Exit not required):** Go to **Node 9**.

  ### NODE 9: Systemic Risk
  **Candidate Distinction:** Monoculture Fragility.
  **Question:** Is a highly uniform practice fragile, in the way a monoculture is, because a single bad rule then propagates everywhere at once?
  *   **Yes (Uniformity is risky):** Go to **Leaf F**.
  *   **No (Uniformity is stable):** Go to **Node 10**.

  ### NODE 10: Enforcement Mechanism
  **Candidate Distinction:** Informal Vacuum.
  **Question:** If formal rules are loosened, will informal norms rush in to fill the vacuum so that social pressure increases rather than decreases?
  *   **Yes (Informal pressure rises):** Go to **Leaf G**.
  *   **No (Loosening reduces pressure):** Go to **Leaf H**.

  ### NODE 11: Subsidiarity Check (Diagnostic Tie-Breaker)
  *Use this node only if you are undecided between Leaf D and Leaf H.*
  **Question:** Should decisions be made at the lowest level competent to make them, even if this creates variation in strictness?
  *   **Yes:** Classify as **Leaf D**.
  *   **No:** Classify as **Leaf H**.

  ---

  ### LEAVES: Positions and Diagnoses

  **Leaf A: Coordination Conventionalist**
  *   **Required View:** A view on which the correct answer turns on whether the norm is a coordination equilibrium or has moral content.
  *   **Awkward Commitment:** You must admit that moral norms without coordination value (like honesty in a society of liars) have no binding force until uptake occurs.
  *   *(Note: Merges Pure Conventionalism and Game-Theoretic Normativism; the tree cannot separate them.)*

  **Leaf B: Civic Perfectionist**
  *   **Required View:** A view that fixes a single society-wide level of strictness on intrinsic grounds.
  *   **Awkward Commitment:** You must defend punishing harmless aesthetic deviations (like untidy lawns) as essential to the shared form of life.

  **Leaf C: Liberal Harm Principle**
  *   **Required View:** A permissive view that permits the society to demand only what prevents direct harm to others.
  *   **Awkward Commitment:** You must tolerate visible free-riding that imposes diffuse costs on everyone, provided no single individual is directly injured.

  **Leaf D: Domain-Relative Pluralist**
  *   **Required View:** A domain-relative view that sets different levels for different spheres of life.
  *   **Awkward Commitment:** You must accept that a citizen may be strictly regulated in one sphere (health) while completely unregulated in another (speech), creating potential role conflict.

  **Leaf E: Contractual Associationist**
  *   **Required View:** A view on which a robust right of exit is the linchpin of whatever strictness is legitimate.
  *   **Awkward Commitment:** You must regard strict communities as legitimate even if they are oppressive, provided the door is technically unlocked, regardless of the cost of walking through it.

  **Leaf F: Systemic Fragility Theorist**
  *   **Required View:** (Derived from Monoculture worry).
  *   **Awkward Commitment:** You must prefer a society with lower average compliance if it means errors in rule-making do not propagate universally.
  *   *(Note: Merges with some forms of Federalism; the tree cannot separate them.)*

  **Leaf G: Informal Pressure Realist**
  *   **Required View:** (Derived from Regulatory Vacuum worry).
  *   **Awkward Commitment:** You may be forced to support formal legal strictness to prevent even harsher informal social shaming from taking its place.

  **Leaf H: Social Order Utilitarian**
  *   **Required View:** A view that fixes a single society-wide level on instrumental grounds.
  *   **Awkward Commitment:** You must treat strictness purely as a means to coordination, trust, or order, with no intrinsic value attached to the rules themselves.
  *   *(Note: Empty Cell Warning: The combination of "No Exit Required" + "No Monoculture Risk" + "No Informal Vacuum" is rarely defended; it is marked here as Unnamed/Naive Statist if not Utilitarian.)*

  ---

  ### Instructor's Note: Diagnostic Utility

  **High-Value Questions:**
  *   **Node 3 (Intrinsic vs. Consequential):** This is the deepest philosophical cut. It separates deontological/communitarian views from utilitarian/liberal ones immediately.
  *   **Node 8 (Exit Rights):** This is the most politically potent question. It forces students to distinguish between *voluntary* association and *coercive* culture, which is where most shouting matches originate.
  *   **Node 10 (Informal Vacuum):** This is the most sociologically insightful. Students often assume "less law = more freedom." This question exposes the trade-off between formal and informal control.

  **Redundant/Trim-able Questions:**
  *   **Node 5 (Constitutive vs. Regulative):** In a 50-minute class, this distinction often bogged down in semantics. If time is tight, merge Node 5 into Node 6.
  *   **Node 11 (Subsidiarity):** This is a tie-breaker. Remove it entirely for a shorter session; it rarely changes the leaf outcome unless the student is already deeply versed in federalist theory.
  *   **Node 2 (Arbitrariness):** If the class accepts Node 1, Node 2 is often obvious. You can skip to Node 3 if the group grasps the Coordination/Moral distinction quickly.

  **Empty Cell Note:**
  *   The path leading to **Leaf H** via "No Exit" and "No Fragility" is theoretically unstable. Few argue for high strictness without either an exit clause, a fragility worry, or an instrumental justification. If a student lands here, challenge them on why they reject the *Exit* condition (Node 8) if they accept *Instrumental* goals (Leaf H).
