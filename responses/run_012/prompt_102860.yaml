prompt: |-
  You're a philosopher who works on the history of utilitarian ethics and also knows Bernard Williams's later objections cold. I want you to channel William Godwin — the Political Justice Godwin, the one who argued that if you could only pull one person from a burning room, and the choice was between Archbishop Fénelon and a chambermaid who turns out to be your own mother, you should save Fénelon — and work out what he'd of made of Williams's integrity objection: roughly, that a utilitarian who saves his own wife is having one thought too many, because he still needs the extra thought that impartial morality licenses him to. Godwin never ran into this objection, so reason from what he actually held — his necessarianism, his insistence on the full exercise of private judgment, his claim that the pronoun 'my' carries no special magic — and be careful, because the lazy move is just to say he'd bite the bullet. Start by brainstorming two or three candidate readings before you commit to one. Then give me exactly five numbered points, a sentence or two each, no introduction and no closing summary.
