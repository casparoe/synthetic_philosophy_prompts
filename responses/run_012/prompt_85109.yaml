prompt: |-
  I want to pressure-test a position about the Nuremberg and Tokyo war crimes trials, and I want the pressure applied by you rather than by me. My position, stated as sharply as I can: those tribunals were genuine courts applying law, not the victors' vengeance in judicial dress, and the legitimacy of a postwar tribunal of that kind can be assessed against three conditions.

  The substantive condition: the conduct charged must have been unlawful under law binding on the accused when they acted. Novelty of enforcement is not the same as retroactivity of law — a norm can bind without having previously been applied to individuals, and a bench can be new without the norm it applies being new. Here I want three distinct problems kept apart: retroactive criminalization (no norm at the time), retroactive jurisdiction (a court constituted after the fact), and retroactive penalty (a punishment no prior law provided for).

  The procedural condition: the proceedings must have been adjudication rather than a scripted verdict — evidentiary contest, defence counsel with real access to documents and witnesses, deliberation that sometimes went the accused's way, and sentences that vary with individual culpability rather than with political convenience.

  The symmetry condition: the tribunal's constitutive instrument must not be a mere instrument of the victors' interest. My test for this is reversal — could the victorious powers have been brought before a court built on the same charter, applying the same definitions, and would their own comparable conduct have fallen within its reach?

  I hold that both tribunals satisfy all three, though not comfortably. I know the standard material and do not need it recited: the charter's crimes against peace were drafted by the prosecuting powers; the Nuremberg tribunal acquitted three defendants while Tokyo convicted every defendant who reached judgment; Hirohito was never indicted; the Japanese biological warfare programme went unprosecuted in exchange for its data; the Soviet conduct at Katyn was never charged; and the separate opinions at Tokyo, including the Indian member's long dissent, denied the court's authority outright. I also know the later career of the whole enterprise — the ad hoc tribunals of the 1990s, the eventual international jurisdiction over aggression — and I am unmoved by the claim that Nuremberg set a precedent that later constrained victors, unless you can show the constraint actually bit.

  What I want is a map of the position's exposure. Which of my three conditions is doing the real work, and which is decorative? What would count against the position — observations, arguments, historical developments, cases it cannot describe, consequences it is committed to that turn out unacceptable? Which defeaters would the position's own defenders concede, as opposed to the ones only critics press? Which are live rather than merely logical possibilities? And is the position well insulated — if nothing could count against it, say so, and tell me whether that is a defect in the position or an unavoidable feature of any theory of legitimacy in this area.

  The thing that would move me most is not more ex post facto grumbling but a demonstration that the symmetry condition is either vacuous or fatal: that reversal was never in prospect, or that it is a test no tribunal could ever pass. I would also take seriously the suggestion that my criterion is the wrong test, if you can say what the right one is and why it returns a different verdict. I would rather have the argument than a reading list.

  Return a single JSON object, with no prose outside it, in this form:

  {
    "position_restated": "the position as you understand it, in two or three sentences",
    "rivals": ["each rival position you are measuring it against, one line each, with the respect in which it differs"],
    "weakest_limb": "which of the three conditions is most exposed, and why",
    "defeaters": [
      {
        "rank": 1,
        "defeater": "the objection, fact, or case, stated as a claim",
        "targets": "substance | procedure | symmetry | the criterion itself",
        "severity": "fatal | serious | awkward | cosmetic",
        "status": "live | contested | settled",
        "defender_reply": "the best response available to someone holding the position",
        "conceded_by_defenders": "whether holders of the position themselves treat this as counting against them, and exactly what they concede",
        "discriminating_test": "the observation, document, or case that would settle whether the defeater holds"
      }
    ],
    "fatal_if": "the single concession the position would have to make if its worst defeater holds",
    "discriminating_predictions": ["what the position predicts that its rivals do not, one per item"],
    "insulation": {
      "well_insulated": "yes | partly | no",
      "mechanism": "how the position avoids refutation, if it does",
      "is_that_a_problem": "your judgment"
    },
    "verdict": "no more than 150 words: does the position survive, and in what form",
    "most_persuasive_to_me": "which defeater should move me most, and why"
  }

  Order the defeater objects from most to least damaging, and use only the allowed values given above for targets, severity, and status.
