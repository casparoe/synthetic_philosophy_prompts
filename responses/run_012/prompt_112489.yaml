answer: |-
  Here is the restatement of the disposition debate in your kit, followed by the residue report and the verdict on your off-stage traits.

  ### The Debate in Your Kit

  The philosophers are arguing about whether an **Engine** is merely a summary of its **Occasions**, or if it is a distinct object that *owns* those Occasions.

  The simplistic view (the Conditional Analysis) says: To say a character has a Cowardice Engine is just to say 'If occasion X arises, they will run.' The Engine is nothing over and above the list of things they would do.

  The sophisticated view (the Anti-Reductionists) says: No. Because of **Blockers** and **Trapdoors**.
  1.  **Blockers:** A character might have the Cowardice Engine, but a **Blocker** (say, a child they must protect) stops them running. They stay put. If you defined the Engine only by what happens, you'd say they aren't a coward. But they are. The Engine was there; the output was suppressed.
  2.  **Trapdoors:** A character might be brave, but the moment the **Occasion** arrives, a **Trapdoor** opens (perhaps the danger triggers a dissociative fugue) and the bravery vanishes before it can fire. If you defined the Engine by the Occasion, you'd say they weren't brave. But they were, until the situation touched them.

  Therefore, the philosophers conclude: The **Engine** must be a real, standing thing (a categorical basis) that exists independently of whether it ever gets an **Occasion**. A glass is fragile even if it sits in a vault forever.

  ### The Residue Report

  **What translates cleanly:**
  The core logic maps surprisingly well. Your **Blocker** is their 'mask' or 'antidote'. Your **Trapdoor** is their 'finkish disposition'. Your **Engine** is their 'disposition'. The philosophical problem of how a trait survives without manifestation is exactly your problem of the **Off-Stage** trait.

  **What bends:**
  The **Audition**. Philosophy treats all manifestations as equal logical tokens. For you, the *first* manifestation (the Audition) colours every subsequent reading. The philosophers do not account for narrative order. They care about truth conditions; you care about revelation. This bends the debate from metaphysics (what is?) to epistemology (how do we know?).

  **What has no expression in Philosophy:**
  **Set-dressing.** This is the critical gap. Philosophers assume laboratory conditions. They assume the only evidence for fragility is breaking. They have no concept of the weather, the cup-holding, the tone of voice—details that have 'nothing to do with the engine' but are read as evidence anyway. In philosophy, noise is noise. In your kit, noise is signal.

  **What has no expression in your Kit:**
  The **Categorical Basis**. Philosophers talk about molecular bonds in the glass. You talk about psychology or backstory, but ultimately, in a novel, everything is behaviour or report. You have no vocabulary for the thing-in-itself that isn't already textual. Your 'Engine' is always a narrative construct, never a physical one.

  **On your hunch:**
  You suspect the philosophy is sharper and your kit is just the same thing with mood lighting. You are wrong. The philosophy is sharper on *ontology* (what exists in the abstract). Your kit is sharper on *phenomenology* (what exists for the observer). The philosophers take the conditions as given; you know that choosing the **Occasion** is an act of creation. That makes your kit more complex, not less.

  ### The Verdict on Off-Stage Traits

  You asked whether there is any honest way to say a character *has* a trait that never gets an occasion in the book, or whether off-stage traits are private sentimentality.

  **They are sentimentality.**

  Here is the reason, and I am not going to soften it. The philosophers are talking about glasses; you are talking about books.

  The philosophical position holds that a disposition exists independently of its manifestation because a glass exists independently of being dropped. The glass is ontologically secure. A character in a novel is not. A character has no existence outside the text. Their ontology is exhausted by their epistemology. If the reader cannot encounter the trait, the trait is not in the book. It is in your head.

  You defined an **Engine** as 'the standing thing in them that makes them do what they do'. If the trait never gets an **Occasion**, it never makes them do anything. By your own definition, an engine that never fires is not an engine. It is a label you have stuck on the chassis.

  Do not lean on the philosophy to save you. The philosophy protects the *possibility* of unmanifested dispositions in the real world. It does not protect the *legitimacy* of unmanifested dispositions in art. In a novel, reality is constituted by attention. To claim a trait exists without an **Audition** or even **Set-dressing** that hints at it is to claim a godhood over the reader that the medium does not grant. It is a private contract between you and the character, not a public contract between you and the reader.

  There is one exception, but it proves the rule. If the **Set-dressing** is dense enough, the reader will infer an Engine without a full Occasion. They will read the way the character holds the cup as evidence of the trait. But you defined Set-dressing as stuff that 'has nothing to do with the engine'. If you write it well, it *does* have to do with the engine. If you write it poorly, it is just weather.

  So, cut the off-stage traits. If the Engine never turns over in the text, it is not part of the car. It is a spare part you are carrying in the boot for your own comfort. Sell the spare part. Write the scene.
