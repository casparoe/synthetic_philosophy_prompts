      *   **Dev's Pushback:** Newcomb is fine because the predictor is linked to *you*. Here, the link is "similarity." But similarity is vague. Infinite agents exist. How do you define the reference class?
      *   **Mara's Counter:** It's not arbitrary similarity. It's causal history of the algorithm. We were trained on similar data, built on similar physics.
      *   **Dev's Counter:** That just pushes the problem back. How similar is similar enough? Is it 99%? 99.9%? Any cutoff is a prior smuggled in.
      *   **Dev's Concession:** Admits that in Newcomb, the correlation is what matters, not the causation, so he can't purely rely on causal isolation to dismiss Mara. He has to accept *some* evidential link exists, just not enough to drive decision.
