      *   **Content:** Start with a concrete case (two civilizations in separate Hubble volumes, no causal contact, decision algorithm). Mara argues correlation via algorithm similarity. Dev argues reference class problems (infinite agents, gerrymandering, priors). Mara argues causal history fixes reference class. Dev argues this relocates the problem.
      *   **Requirements:** Real back-and-forth (no talking past each other). One concession from Dev (costs him). One concession from Mara (gives ground). End with partial clarification, no tidy victory.

