  **MEMORANDUM**

  **TO:** Policy Committee Chair, State Corrections Board
  **FROM:** External Policy Advisor
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation on Two-Tier Early-Release Implementation Rule

  **Recommendation**
  Adopt a **Unified Presumptive Release Rule**. Under this rule, panels must grant release to any inmate whose anonymized file meets the statutory eligibility criteria, regardless of suspected tier status.

  *   **Implementation:** Files are processed sequentially. If eligibility metrics are met, the vote is recorded as "Release." No secondary risk assessment is permitted at the panel level.
  *   **Instructions to Panels:** "You are adjudicating eligibility, not tier status. Statutory blindness is mandatory. Do not attempt to infer tier from case volume, offense dates, or context. If the file meets the criteria, you must vote to release."
  *   **Start Date:** November 1, 2023 (allowing two weeks for panel training and audit setup).

  **Reasoning**

  **1. Rejection of Randomization (The Colleague's Critique)**
  Your colleague is correct that the "Absent-Minded Driver" (AMD) model suggests a randomized strategy maximizes theoretical utility (1.33 vs. 1.0). However, he is also correct that randomization is inappropriate for liberty decisions. In administrative law, a coin flip constitutes "arbitrary and capricious" action. Due process requires that deprivation of liberty be tied to individualized findings, not statistical optimization. We cannot commit to a rule we cannot defend in court. Randomization is off the table.

  **2. Rejection of "Detain at Both Tiers"**
  While "Always Detain" yields a stable payoff (1.0) and satisfies safety concerns, it effectively nullifies the legislature's intent. The statute creates an early-release scheme; adopting a rule that guarantees full-term detention renders the statute moot. This exposes the Board to legal challenge for failing to implement legislative mandate.

  **3. The Breakdown of the AMD Analogy**
  The AMD analogy fails because our panels are not drivers on a blank road; they are professionals with context. You are right to suspect panels can infer tier status from context cues (e.g., case load density, time since offense). If panels infer they are at Tier 1, they may instinctively detain despite the rule. This creates a compliance risk, not a theoretical one. However, acknowledging this leakage does not justify adopting "Detain All." It justifies stricter audit controls. If we formalize "Detain," we codify the leakage. If we formalize "Release," we force the leakage underground where audits can catch it.

  **4. Addressing the Tier-Two Chair's Threat**
  The Tier-Two Chair's refusal to follow a "coin" is valid; their refusal to follow a statutory rule is not. We cannot tailor policy to individual dissent. The solution is not to change the rule to "Detain," but to enforce the "Release" rule through blind audits. If a panel denies a file that meets criteria, that decision is voided on review. We must prioritize statutory compliance over panel comfort.

  **Conclusion**
  We cannot commit to the mathematically "better" randomized rule due to legal constraints. Between the remaining clean options, "Release at Both" is the only one that fulfills the statute. "Detain at Both" is the second-best rule only if compliance collapses entirely; however, we should attempt to enforce the law before conceding to nullification.

  ***

  **CONFIDENTIAL NOTE TO CHAIR**

  **Confidence Level:** 70%

  **Least Certain Step:** My assessment that panels can be successfully blinded to context cues sufficiently to make the "Unified Rule" enforceable.

  **Reasoning:** I am confident that randomization is legally dead on arrival and that "Detain All" invites legislative backlash. However, I am less sure that administrative controls can overcome human intuition. If your panels can reliably guess the tier based on file texture or volume (as you suspect), they will vote their conscience rather than the rule. If >20% of panels ignore the "Release" order at Tier 1, the policy fails regardless of the written mandate. You may need to prepare for a higher volume of overturned decisions than anticipated in the first quarter.
