answer: |-
  This is the correct place to start. Most debates about computationalism in cognitive science stall because the participants are using different, unstated theories of implementation. You are asking for the **Implementation Spec**.

  Here are the desiderata any adequate theory of physical implementation must satisfy, followed by an analysis of the tensions you suspect.

  ### The Desiderata: A Spec for Implementation

  **1. Extensional Adequacy (The "Laptop vs. Rock" Constraint)**
  *   **Requirement:** The theory must classify paradigmatic computers (laptops, abacuses) as implementing computations and paradigmatic non-computers (rocks, buckets of water) as not implementing *non-trivial* computations.
  *   **Motivation:** If a theory counts a rock as running WordStar (Putnam's result), the term "computation" loses its explanatory power. If it fails to count a laptop as computing, it is definitionally broken. The brain must land on one side or the other based on its physical properties, not our hopes.

  **2. Counterfactual Sensitivity (The "Broken Machine" Constraint)**
  *   **Requirement:** Implementation cannot depend solely on the actual sequence of physical states the system passes through. It must depend on how the system *would* behave under different inputs or conditions.
  *   **Motivation:** A laptop running a program and a laptop with a broken keyboard that happens to output the same sequence of states by accident are not doing the same thing. The laptop supports counterfactual transitions (if I press 'A', it prints 'a'); the broken one does not. A theory that looks only at actual state trajectories (simple mapping) fails to distinguish a computer from a tape recorder playing back a recording of a computer.

  **3. Non-Arbitrary State Individuation (The "Carving" Constraint)**
  *   **Requirement:** The mapping from physical states to computational states cannot rely on gerrymandered, disjunctive, or temporally scattered groupings of physical properties unless those groupings are justified by physical similarity or causal structure.
  *   **Motivation:** In physics, you can define a "state" however you like (e.g., "all states where the temperature is 20°C OR the moon is full"). If implementation allows arbitrary disjunctions of physical microstates to count as a single logical state, you can map any physical system to any logical automaton. To avoid triviality, the physical states grouped together as "Logical 0" must share some objective physical or causal naturalness.

  **4. Computational Specificity (The "Right Program" Constraint)**
  *   **Requirement:** A system should not implement *every* finite-state automaton simultaneously. It must implement specific computations to the exclusion of others.
  *   **Motivation:** If a brain implements every possible computation at once (because it is a rich physical system), saying "the brain computes" explains nothing about why it produces *specific* behaviors. We need to know why it implements *vision* algorithms rather than *weather simulation* algorithms. The physical structure must constrain the abstract structure.

  **5. Naturalization (The "No Designer" Constraint)**
  *   **Requirement:** The theory must account for systems that were not engineered by an agent with intentions (i.e., brains, biological networks). It cannot rely essentially on "user interpretation" or "designer intent" to fix the mapping.
  *   **Motivation:** Laptops come with a manual and a designer who stipulates that voltage < 2V = '0'. Brains do not. If implementation requires a designer to stipulate the interpretation function, then brains are not literally computers (they are at best *metaphorically* computable). If computationalism is true, the implementation relation must be discoverable in the physics/biology alone.

  **6. Robustness to Noise and Grain (The "Analog/Digital" Constraint)**
  *   **Requirement:** The theory must explain how systems with noisy, continuous, analog physical dynamics (neurons) can implement discrete, noise-tolerant logical operations, without requiring perfect engineering.
  *   **Motivation:** Digital computers are engineered to have high energy barriers between states (hysteresis) to ensure discreteness. Neurons are leaky, analog, and stochastic. A theory that requires perfect discreteness excludes the brain. A theory that allows total continuity risks collapsing back into triviality (since continuous systems have infinite states).

  ---

  ### The Tension: Where the Requirements Fight

  You are right. The central conflict is between **Requirement 3 (Non-Arbitrary Carving)** and **Requirement 5 (Naturalization/Objectivity)**, mediated by **Requirement 1 (Extensional Adequacy)**.

  Here is the dilemma:

  1.  **To avoid Pancomputationalism (Req 1 & 4):** You must constrain how physical states are mapped to logical states. You cannot allow arbitrary disjunctions (e.g., grouping "voltage low" and "voltage high" together just because it helps the math work). You need a principle of **State Individuation** that says only *causally similar* or *physically natural* physical states can count as the same computational state.
  2.  **To maintain Objectivity (Req 5):** This principle of State Individuation must be mind-independent. It cannot depend on what *we* find useful or what a designer *intended*. It must be a fact of physics.
  3.  **The Conflict:** Physics (fundamentally) does not care about computational states. Physical phase space is continuous and rich. As Putnam and Searle argued, if you look at the causal structure of *any* open physical system (like a rock), it is rich enough to support isomorphic mappings to *any* finite state automaton, provided you are allowed to carve the physical states finely enough and map them disjunctively.
  4.  **The Forced Choice:**
      *   **Option A (Save Objectivity, Lose Non-Triviality):** You insist implementation is purely a matter of physical isomorphism. Result: Pancomputationalism. The rock computes everything. The brain computes, but so does the bucket. "Computation" is a trivial property of matter.
      *   **Option B (Save Non-Triviality, Lose Objectivity):** You tighten the Carving Constraint (Req 3). You say physical states only count as computational states if they play a specific *functional role* or serve a *purpose*. Result: You introduce Teleology or Perspective. Implementation becomes relative to an observer (Dennett) or dependent on biological function/evolutionary history (Millikan). This threatens Req 5 (Naturalization) because it makes computation dependent on *history* or *interpretation*, not just current physical structure.

  **The "No Arbitrary Carving" requirement is indeed the weapon.** It is the only thing that stops the rock from computing. But to enforce it without being arbitrary, you usually have to appeal to something *outside* the immediate physical snapshot (like evolutionary history or observer interest). If you stick strictly to the immediate physical facts, the carving *looks* arbitrary to the physics, and the rock wins.

  **Is there a clean way out?**
  There is no consensus "clean" way out. The dominant moves are:
  1.  **Causal Structure Realism (Chalmers):** Argue that causal structure is objective and restrictive enough to block trivial mappings without needing teleology. (Critics say this still fails against sufficiently complex mappings).
  2.  **Teleosemantics:** Argue that brains compute because they have *functions* selected by evolution. Rocks don't. This saves Non-Triviality but makes computation dependent on history, not just physics.
  3.  **Perspectivalism:** Admit that "computation" is not a mind-independent natural kind. It is a descriptive lens we apply. Brains are computers *relative to our explanatory interests*. This saves the utility of the metaphor but denies the "literal" ontological claim.

  ---

  ### The Hardest Working Requirement

  You guessed **Non-Triviality**. You are close, but the specific requirement doing the heavy lifting is **Requirement 3: Non-Arbitrary State Individuation**.

  **Why?**
  *   **Non-Triviality** is the *outcome* we want.
  *   **State Individuation** is the *mechanism* that achieves it.

  This requirement knocks out the most candidate theories because it is the bottleneck.
  *   It kills **Simple Mapping Accounts** (like early Putnam interpretations) immediately, because they allow arbitrary grouping of physical states.
  *   It kills **Purely Syntactic Accounts** that don't ground syntax in physics, because they can't explain which physical properties constitute the syntax.
  *   It puts immense pressure on **Causal Accounts** (like Chalmers). Chalmers tries to solve this by requiring the physical system to support the *counterfactuals* of the automaton (Req 2). He argues that a rock doesn't have the right causal connectivity to support the state transitions of a complex mind.
      *   *Scorecard:* Chalmers fares better than Simple Mapping because he enforces Counterfactual Sensitivity (Req 2). However, critics argue that even Chalmers' account succumbs to triviality if the physical states are individuated too finely (e.g., every micro-state is unique). To stop this, Chalmers must implicitly invoke a **Carving Constraint** (Req 3) that says "group microstates into macrostates only if they are causally equivalent." But "causally equivalent" is hard to define without circularity or appealing to the very computation you are trying to define.

  **Conclusion:**
  The **State Individuation Constraint** is the hardest worker. It is the gatekeeper. If you relax it, you get pancomputationalism (rocks compute). If you tighten it too much (requiring engineered discreteness), you get biological exclusion (brains don't compute).

  **Verdict on your suspicion:**
  You are correct. The demand that implementation be an **objective, mind-independent fact** is in direct tension with the demand that **not everything computes**. The friction point is exactly how we are allowed to **carve physical states into logical states**.

  If you want the brain to be *literally* a computer in the same sense a laptop is, you need an objective carving principle that applies to both. No such principle has been universally accepted. If you accept that the carving principle relies on *function* or *interpretation*, you save the brain's status as a computer but concede that "computation" is not a fundamental physical property like mass or charge—it is a functional or perspectival property.

  That is the bill. You can have literal computation, but it costs you objectivity. Or you can have objectivity, but it costs you specificity (everything computes). You cannot have both without a theory of State Individuation that has not yet been successfully formalized.
