prompt: |-
  Ok so I'm trying to figure out whether the brain is *literally* a computer or whether "the brain computes" is just a useful metaphor, and I've realized the whole thing turns on something more basic that nobody ever states clearly: what it even takes for a physical system to implement a computation in the first place. Before I read another paper on this I want the spec first. So write me the desiderata -- what any adequate theory of implementation (the relation between an abstract computation and the physical system that's supposed to run it) has to deliver. I mean the real requirements, each one with the case or consideration that motivates it:

  - the cases it has to get right (a laptop running a program, a rock, a bucket of water, an abacus, a brain, a big pile of neurons, whatever)
  - the distinctions it can't collapse (implementing a computation vs. merely being *describable* by one; implementing *a* computation vs. implementing the *right* one; computation as a fact about the world vs. computation as something we ascribe to a system; a designed artifact with a stipulated interpretation vs. a brain that didn't come with a user manual)
  - the constraints it has to stay consistent with (brains are noisy, analog, massively recurrent, no clock; digital computers are engineered things whose "states" are defined by us; and the Putnam-style triviality worry, that on a loose enough notion of implementation every ordinary open physical system implements every finite-state automaton, so the rock ends up computing everything)

  Then flag the part I care about most: which of these requirements can't be satisfied at the same time. I have a suspiscion that the demand that implementation be a real, objective, mind-independent fact and the demand that we not slide into pancomputationalism (where rocks and buckets compute every program) are in tension, and maybe the no-arbitrary-carving requirement -- that it can't matter how we happen to chop the system into states or time-slices or state-space dimensions -- is exactly what makes them fight. Tell me if I'm right and what the cleanest way out is, or whether the tension is real and someone just has to give.

  Also tell me which single requirement does the most work, i.e. knocks out the most candidate theories. My guess is the non-triviality one but dont just agree with me.

  Keep the weight on the criteria and on why each is a genuine requirement rather than a prejudice of one camp. You can briefly say how a Putnam-style simple-mapping account and Chalmers's combinatorial-state-automaton fix fare against the list, but the list is what I want. No bibliographies obviously, I dont need citations, I need the argument.
