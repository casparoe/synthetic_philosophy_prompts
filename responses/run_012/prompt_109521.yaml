  # JOINT STATEMENT ON FRONTIER MODEL RELEASE POLICY
  **Adversarial Collaboration Draft v1.0**
  **Signatories:** [Open Weights Advocate], [Structured Access Advocate]
  **Date:** October 24, 2023

  ## 1. AGREED CLAIMS
  *The following claims represent the factual and strategic ground upon which both signatories stand. We agree that these premises are true, regardless of our divergent policy conclusions.*

  1.  **Artifact Definition:** We agree that the term "open source" is imprecise when applied to frontier AI. Releasing model weights is not equivalent to releasing a full software stack. A weight release typically excludes the full training dataset, the complete training codebase, the hyperparameter "recipe," and the internal evaluation harnesses. We acknowledge that calling a weight release "open source" may create false expectations about reproducibility and safety auditing capabilities.
  2.  **Evidence Limits:** We agree that our current evidence base regarding catastrophic risk is probabilistic, not deterministic. The "Safety" position relies on extrapolations from current misuse cases (phishing, malware) to future capabilities (bio-design, autonomous cyber-ops), which is suggestive but not proof of inevitability. The "Open" position relies on historical precedents of security-through-obscurity failure and the benefits of peer review, which are strong in software but unproven at frontier AI scale. Neither side possesses a validated metric for "catastrophe probability."
  3.  **Existence vs. Spread:** We agree there is a distinct moral and practical difference between the *existence* of a capability (the model is trained and held internally) and the *spread* of a capability (weights are publicly downloadable). We agree that once weights are public, technical recall is impossible. We agree that internal existence still carries risk (insider threat, server compromise), but acknowledge the magnitude of risk differs by orders of magnitude upon public spread.
  4.  **Strategic Context:** We agree that we operate in a multi-lab environment where we do not control the actions of competitors (state or private). We agree that "someone else would have released it anyway" is a factual claim about the world, not merely an excuse. However, we disagree on whether this fact absolves us of responsibility for our specific marginal contribution to that risk.
  5.  **Safety Benefits of Openness:** We agree that openness offers specific safety benefits: external auditing of alignment claims, detection of hidden biases or capabilities, and prevention of monopoly control over safety standards. We disagree on whether these benefits require *public weight release* or if they can be achieved through *structured access* (e.g., trusted researcher APIs, government escrow).

  ## 2. RESIDUAL DISAGREEMENTS
  *The following table isolates the specific points of divergence. Each position is phrased to be acceptable to the holder of that view.*

  | # | Disagreement Area | Open Weights Position | Structured Access Position | Named Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Primary Risk Vector** | The primary risk is *structural*: concentrated power leads to unchecked deployment, misalignment due to lack of scrutiny, and safety washing. Guardrails can be stripped by bad actors regardless of release status if the model is accessible via API. | The primary risk is *proliferation*: public weights allow bad actors to locally fine-tune away guardrails and scale misuse without compute bottlenecks. API access retains a choke point for monitoring and rate-limiting. | **Choke Point Efficacy** |
  | **2** | **Counterfactual Burden** | If a capability is inevitable, withholding it only cedes advantage to less safety-conscious actors. Our marginal contribution to global risk is negligible if the capability exists elsewhere. We should focus on setting the norm for *how* it is released. | Moral responsibility is causal, not just comparative. Even if others release, delaying or restricting our release reduces the *total number* of actors with access at any given time, slowing the diffusion of risk. | **Marginal vs. Absolute Risk** |
  | **3** | **Audit Necessity** | Meaningful safety auditing requires inspecting weights and activations. Black-box API testing cannot verify internal alignment mechanisms or detect latent capabilities reliably. Frontier weights must be available to independent researchers to verify safety claims. | Safety auditing can be conducted via red-teaming programs and limited compute grants without public release. The risk of public weights outweighs the marginal gain in audit depth provided by full transparency. | **Transparency Threshold** |
  | **4** | **Capability Uplift** | Fine-tuning open weights provides convenience but not fundamental capability uplift. A dangerous actor needs massive compute for training; fine-tuning is not the bottleneck for catastrophic misuse. | Fine-tuning open weights is the critical enabler. It allows actors with limited compute to specialize a general model for harm (e.g., bio-weapon design) at a fraction of the training cost, bypassing the training bottleneck. | **Fine-Tune Barrier** |

  ## 3. TESTS, CASES, AND PRE-REGISTERED PREDICTIONS
  *For each crux above, we identify a concrete piece of evidence or a future event that would bear on the disagreement. We record our predictions now to prevent hindsight bias.*

  | Crux | Concrete Test / Case | Open Weights Prediction | Structured Access Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Choke Point Efficacy** | **Case:** A major closed-model API is successfully jailbroken to perform a high-harm task (e.g., generating functional malware) at scale. | **Prediction:** This will happen within 12 months. It proves API guardrails are temporary and security-through-obscurity fails. | **Prediction:** This will be contained/detected before scale. Even if it happens, the ability to patch the API centrally prevents widespread proliferation compared to weights. |
  | **2. Marginal Risk** | **Case:** A competitor lab releases a comparable model openly 6 months after we choose to close ours. | **Prediction:** Our closure will be viewed as moot; the risk was realized anyway. Our closure only hurt our ability to influence the ecosystem. | **Prediction:** The 6-month delay materially reduced the total "harm-hours" available to attackers. Slowing diffusion is a valid safety win. |
  | **3. Transparency Threshold** | **Test:** A third-party auditor is given API access vs. Weight access to the same model to find a specific, planted "backdoor." | **Prediction:** API auditors will fail to find the backdoor; Weight auditors will find it. Black-box auditing is insufficient for frontier safety. | **Prediction:** API auditors will find the behavioral manifestation of the backdoor with >80% efficacy of weight auditors, without the proliferation risk. |
  | **4. Fine-Tune Barrier** | **Case:** A malicious actor uses an open-weight model (70B+ params) fine-tuned on <$10k of compute to execute a high-harm cyberattack. | **Prediction:** This will not happen. High-harm attacks require training-scale compute or data not solvable by fine-tuning alone. | **Prediction:** This will happen within 24 months. Fine-tuning lowers the barrier enough for non-state actors to cause significant harm. |

  ## 4. VERBAL DISPUTES & SEMANTIC CLARITY
  *We have identified the following semantic confusions that have obscured our substantive disagreement. Stripping these out clarifies the remaining split.*

  *   **"Safety":**
      *   *Confusion:* The Open side often means "System Safety" (robustness, lack of bias, long-term alignment verification). The Safety side often means "Misuse Safety" (preventing bad actors from using the tool).
      *   *Resolution:* We agree to distinguish **Alignment Safety** (model does what we want) from **Deployment Safety** (model isn't used for harm). The Open side prioritizes Alignment Safety via transparency. The Safety side prioritizes Deployment Safety via access control.
  *   **"Open":**
      *   *Confusion:* The Open side uses "Open" to mean "Weights Available." The Safety side hears "Open" as "Unrestricted Commercial/Personal Use."
      *   *Resolution:* We agree to use the term **"Open Weights"** (availability of parameters) distinct from **"Open Use"** (licensing terms). We can theoretically have Open Weights with Restricted Use licenses, though enforceability is disputed.
  *   **"Frontier":**
      *   *Confusion:* Disagreement on where the danger threshold lies.
      *   *Resolution:* We define **"Frontier"** for this policy as any model exceeding [Specific Eval Threshold, e.g., CBRN risk score X]. Below this threshold, we agree Open Weights is default. Above this threshold, this disagreement applies.

  **Remaining Substantive Split:**
  Once semantics are cleared, the core disagreement remains: **Is the marginal safety benefit of external weight auditing greater than the marginal risk of weight proliferation?** This is an empirical question, not a verbal one.

  ## 5. CONDITIONS FOR MIND CHANGE
  *We commit to updating our views if the following evidence emerges.*

  **The Open Weights Advocate will move toward Structured Access if:**
  1.  **Attribution:** A catastrophic misuse event is definitively traced to a model that was released with open weights, where the attacker utilized fine-tuning to bypass safety filters that were present in the base model.
  2.  **Audit Equivalence:** A rigorous study demonstrates that trusted third-party auditors with API-only access can detect latent dangerous capabilities (e.g., deception, bio-risk knowledge) with statistical parity to auditors with weight access.

  **The Structured Access Advocate will move toward Open Weights if:**
  1.  **Hidden Failure:** A model deployed via API causes significant harm due to an alignment failure that was undetectable via black-box testing but would have been obvious via weight inspection (e.g., a specific activation pattern indicating deceptive alignment).
  2.  **Centralization Risk:** Evidence emerges that closed-model developers are systematically suppressing safety research or misrepresenting capabilities to regulators, and that open-weight competitors are the only entities successfully identifying these risks.

  ***

  **Signed,**

  _________________________ (Open Weights Advocate)

  _________________________ (Structured Access Advocate)
