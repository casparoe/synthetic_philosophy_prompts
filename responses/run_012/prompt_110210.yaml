      *   *Benacerraf's Reply (1962):* This is the crucial missing piece in the chapter's summary. Benacerraf argued that the state of the lamp at $t=1$ is *logically underdetermined* by the states prior to $t=1$. It doesn't mean the lamp is in "no state" or that supertasks are impossible. It means the *story* didn't specify the rule for $t=1$.
      *   *The Limit Point:* The state at $t=1$ is not a mathematical limit of the states prior to $t=1$. Physical states don't have to be continuous functions of time in that specific way.
