answer: |-
  ### Stage 1: Brainstorming and Feature Table

  To find the principle underlying your verdicts, we must first strip the cases down to their structural components. We are looking for the variables that correlate with the label "pseudoscience" versus "science" (or "error").

  | Case | Claimant | Training/Status | Claim Type | Falsifiability (Theoretical) | Response to Contradiction | Method Transparency | Community Structure | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Rebuilt Chronology** | Mathematician | Expert (wrong field) | Empirical/Historical | Yes (tested & failed) | Ignores failure; insists on math | Data unclear | Hostile/Rejected | **Pseudo** |
  | **2. Phantom Centuries** | Unknown | Unclear | Empirical/Historical | Yes (tested & failed) | Conspiracy (fabricators) | Selective | Fringe | **Pseudo** |
  | **3. Rearranged Planets** | Writer | Amateur | Empirical/Physical | No (mechanics impossible) | Testimony > Calculation | Opaque | Cult-like | **Pseudo** |
  | **4. Ancient Astronauts** | Proponents | Mixed | Empirical/History | No (redescription) | Redescription of evidence | Opaque | Pop-culture | **Pseudo** |
  | **5. The Machine** | Hobbyist | None | Empirical/History | No (declines falsifier) | High (code posted) | Naive/Flawed | Blog/Online | **Pseudo** |
  | **6. Untestable Physics** | Physicists | Experts | Theoretical/Physical | Yes (future/principle) | Concedes limits; defines falsifiers | High (rigorous) | Academic/Mainstream | **Science** |
  | **7. Contamination Loop** | Group | Mixed (Fieldwork) | Empirical/Archaeology | Yes (in theory) | Ad hoc rescue (contamination) | High (within group) | Closed/Insulated | **Pseudo** |
  | **8. Honest Maverick** | Linguist | Expert | Empirical/History | Yes (explicit) | Corrects errors; revises | High (code/public) | Academic (rejected) | **Science** |
  | **9. Vindicated Outsider** | Minority | Mixed | Empirical | Yes (eventually) | Absorbed by mainstream | Varies | Eventually Mainstream | **Science** |
  | **10. Two Vehicles** | Math vs. Hist | Expert vs. Expert | Empirical/History (Same) | Yes | Math: Ignores / Hist: Engages | Math: Opaque / Hist: Standard | Math: Fringe / Hist: Peer Review | **Split** |
  | **11. Disclaiming Hobbyist**| Hobbyist | None | "Imaginative" (ostensibly) | N/A (not empirical) | Silence on audience error | Opaque | Audience misled | **Borderline** |

  ### Stage 2: Pattern Recognition and Testing Your Principle

  Your tentative principle is: *A claim is pseudoscientific when it is presented as empirical knowledge about the world while the community maintaining it operates a repair mechanism that guarantees no observation could count against it, and the repair mechanism is not itself offered as a testable hypothesis.*

  This is a strong Lakatosian intuition. It focuses on the **immunizing strategies** of a research community rather than the static truth of a proposition. Let's test it against the friction points.

  **Where it works well:**
  *   **Cases 1, 2, 3, 4, 7:** All feature a "core" claim protected by a "belt" of ad hoc hypotheses (conspiracy, re-interpretation, contamination rules) that cannot be tested independently of the core. In Case 7, the contamination rule is the perfect example of a repair mechanism that guarantees no observation counts against the core.
  *   **Case 8:** The Maverick explicitly *rejects* the repair mechanism. When evidence contradicts (coding error), she alters the core, not the evidence.
  *   **Case 9:** The Outsiders were willing to let observation count against them; they were just ahead of the available observations.

  **Where it strains:**
  *   **Case 6 (Untestable Physics):** This is the greatest tension. Your principle says "guarantees no observation could count against it." Case 6 proponents say "no observation *currently*, but here is the path." If we interpret your principle strictly, Case 6 might look like pseudoscience (e.g., String Theory critiques often allege this). However, your verdict is "Science." To save this, we must distinguish between **principled immunity** (pseudoscience) and **practical latency** (frontier science). The physicists concede the risk; the pseudoscientists deny it.
  *   **Case 10 (Two Vehicles):** Your principle focuses on "the community maintaining it." This saves the verdict. The mathematician maintains the claim via a community/practice that ignores historical constraints (pseudo). The historian maintains the claim via a community/practice that engages with philological constraints (science/error). This implies pseudoscience is not a property of the *claim*, but of the *practice*.
  *   **Case 11 (Disclaiming Hobbyist):** Your principle requires the claim be "presented as empirical knowledge." Case 11 explicitly disclaims this. Yet, you note the *effect* is the same as Case 7. If we stick to your principle strictly, Case 11 is **not pseudoscience** because the condition "presented as empirical knowledge" is not met. If we call it pseudoscience anyway, we are modifying the principle to include "social effect" rather than "explicit presentation."

  ### Stage 3: The Proposed Principle

  Based on the table and the testing above, I propose we refine your principle into what I will call the **Principle of Asymmetric Risk**.

  **The Principle:**
  > A practice is pseudoscientific if it solicits the epistemic authority of science (the right to be believed about the world) while structurally insulating its core commitments from refutation. This insulation occurs when contradictory evidence is systematically explained away by ad hoc hypotheses that are not independently testable, or when the practitioners refuse to specify conditions under which they would abandon the core commitment.
  >
  > Crucially, **science accepts the risk of loss** as the price of knowledge. **Pseudoscience seeks the reward of knowledge** (authority, certainty) **without the risk of loss** (refutation, revision).

  **How this applies to your cases:**
  *   **Cases 1–5 & 7:** These practices seek authority (telling us what *really* happened) but remove the risk. When data contradicts, they adjust the data's meaning (conspiracy, contamination) rather than the theory. The risk is asymmetric: they win if data fits, and they win if data doesn't fit (because the data is "explained").
  *   **Case 6:** They accept the risk. They admit they currently have no contact with experiment, but they define what *would* kill the theory. They are willing to lose. Therefore, Science.
  *   **Case 8:** She is willing to lose. She corrected the code. Therefore, Science.
  *   **Case 10:** This is the critical test. The *claim* is identical. But the *practice* differs. The Mathematician (Case 1) uses a method that insulates him from historical counter-evidence (statistics on texts ignores material culture). The Historian (Case 10) uses a method that exposes them to counter-evidence (philology, footnotes). The Historian can be proven wrong by a new manuscript; the Mathematician just recalculates. The Principle classifies the *activity*, not the *proposition*.
  *   **Case 11:** Here is where I must ask for a sacrifice.

  ### Stage 4: Mismatches and Sacrifices

  I cannot accommodate your ambivalence on **Case 11 (The Disclaiming Hobbyist)** without weakening the principle to the point of uselessness.

  **The Conflict:**
  Your principle (and mine) requires the agent to solicit "epistemic authority" or present the claim as "empirical knowledge." In Case 11, the hobbyist explicitly disclaims this. He calls it "imaginative reconstruction."
  If we label this pseudoscience, we are labeling *fiction* as pseudoscience because the audience is gullible. But demarcation is about the producer's method, not the consumer's error. If I write a novel about Atlantis and do not claim it is history, I am not a pseudoscientist, even if readers believe me.

  **The Sacrifice:**
  I argue you must classify Case 11 as **Not Pseudoscience**.
  It is **Epistemically Irresponsible Fiction**, or **Misinformation**, but it lacks the *scientistic claim* required for pseudoscience. Pseudoscience is a mimicry of science. If the actor removes the mask and says "I am not a scientist," they have stepped outside the demarcation line entirely. They are not playing the game of science, so they cannot be cheating at it.
  *Why this matters:* If you label Case 11 pseudoscience, you conflate *lying* with *bad science*. The harm in Case 11 is ethical (deception by silence), whereas the harm in Case 1 is epistemic (corruption of knowledge-seeking practices). To keep the concept of pseudoscience sharp, it must require the *claim to knowledge*.

  **Regarding Case 6 (Untestable Physics):**
  I must also warn you that your verdict here is contingent. If the physics community *never* produces testable predictions and continues to demand resources solely on mathematical elegance, my principle dictates they will eventually cross into pseudoscience. The "Risk" must be real, not just theoretical. If "eventually" means "never," the immunity becomes structural. I advise you to hold the verdict "Science" only so long as the community maintains the *intent* and *pathway* to empirical contact.

  ### Stage 5: Diagnostic Invented Cases

  To test the **Principle of Asymmetric Risk**, consider these two new cases.

  **Case A: The Adaptive Algorithm (Predicted: Pseudoscience)**
  A financial group claims to have an algorithm that predicts market crashes. When it predicts a crash and none occurs, they announce that "external political interference" distorted the market signals, invalidating the test. When it predicts no crash and one occurs, they claim the algorithm successfully "mitigated" the crash through subtle signaling. They publish their code, but the training data is proprietary. They claim the authority of mathematics.
  *   *Analysis:* They claim empirical authority (predicting crashes). They have a repair mechanism for every failure (interference/mitigation) that is not independently testable (you can't measure "subtle signaling"). They accept no risk of loss.
  *   *Verdict:* **Pseudoscience.** (Even though it uses math and code, like Case 5).

  **Case B: The Silent Archive (Predicted: Science/Error)**
  A historian argues that a specific treaty was signed in 1600, based on a single diary entry. A rival finds a state ledger from 1600 that omits the treaty. The first historian publishes a retraction, stating, "The ledger outweighs the diary; I was wrong." Ten years later, she finds a copy of the treaty in a private collection and revives the claim with the new evidence.
  *   *Analysis:* She claimed empirical knowledge. When contradicted, she absorbed the loss (retraction). She did not use an ad hoc repair (e.g., "the ledger was forged"). She revived the claim only with new, independent evidence.
  *   *Verdict:* **Science (specifically, corrected error).** (Even though she was wrong for a long time, like Case 9).

  ### Stage 6: The Conceptual Question

  You asked: *Is pseudoscience a property of claims, of practices, or of people, and is it a matter of degree or all-or-nothing?*

  Based on the work required to make your verdicts consistent (especially Case 10), the answer must be:

  **Pseudoscience is a property of Practices (and the Communities that sustain them).**

  It is not a property of **Claims**, because Case 10 shows the same claim can be arrived at scientifically (historian) or pseudoscientifically (mathematician). If it were the claim, both would share the label.
  It is not primarily a property of **People**, because Case 9 shows a "maverick" can be scientific while the "establishment" is wrong, and Case 5 shows a "naive" hobbyist isn't necessarily a fraud, yet the practice is still pseudo.

  **Is it a matter of degree?**
  Yes. The **Principle of Asymmetric Risk** implies a spectrum.
  *   **High Science:** High risk, high transparency, rapid correction (Case 8).
  *   **Frontier Science:** High risk, low current testability, high transparency (Case 6).
  *   **Degenerating Programme:** Lower risk, increasing ad hoc repairs, insulation growing (Case 7).
  *   **Pseudoscience:** Near-zero risk, total insulation, ad hoc repairs are the primary method (Cases 1, 2, 4).

  **The Consequence for Your Verdicts:**
  This forces us to accept that **Case 1 and Case 10 cannot both be judged on the content of the thesis.** You were right to distinguish them, but the reason is not that the historian is "right" and the mathematician is "wrong." It is that the historian is *playing the game where losing is possible*, and the mathematician is *playing a game where he cannot lose*.

  If you accept this, you must also accept that a "Scientific" claim can be false (Case 8, Case 9), and a "Pseudoscientific" claim can be accidentally true (imagine if the Mathematician in Case 1 was actually right, but arrived there by ignoring all contrary evidence and refusing to test his method). The truth of the outcome does not retroactively make the practice scientific.

  **Summary of the Repair:**
  1.  **Adopt the Principle of Asymmetric Risk:** Focus on whether the practice allows for the possibility of refutation.
  2.  **Sacrifice Case 11:** Classify it as Irresponsible Fiction, not Pseudoscience, because it lacks the claim to empirical knowledge. This preserves the definition's integrity.
  3.  **Locate Pseudoscience in Practices:** Accept that demarcation judges the *method of inquiry*, not the *proposition asserted*.
  4.  **Accept Degeneracy:** Acknowledge that Case 6 is science only so long as it remains progressive and open to future risk; if it becomes permanently insulated, it degenerates.

  This approach respects your intuition on the hard cases (1, 7, 10) while cleaning up the boundary conditions (6, 11) to prevent the concept from becoming too broad to use.
