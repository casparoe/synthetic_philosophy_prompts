  8.  **Final Polish:** Ensure the "Residue Report" is the highlight, as requested. Make sure the distinction between "unauthorized access" (security) and "counterfeit personhood" (philosophy) is sharp.

  *(Self-Correction on Dennett's specific view)*: Dennett's recent op-eds (e.g., in Project Syndicate or similar venues around 2023-2024) specifically use the "counterfeit money" analogy. He argues that just as we don't ask merchants to test every bill, we shouldn't ask users to test every interlocutor. He focuses on the *legal/moral* prohibition of passing as human. My translation must capture the *prohibitive* nature, not just the *detective* nature.

  *(Final Plan)*:
  1.  Brainstorm/Pre-computation.
  2.  Faithful Translation using user's lexicon.
  3.  Residue Report (The Gaps).
  4.  Verdict on the "Marginal Social Cost" formulation.
