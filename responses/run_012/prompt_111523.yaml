  Rejecting (3) commits me to distinguishing between reasons that explain psychological movement and reasons that validate normative status. I must accept that I can act for a reason (love) without that reason serving as a licence that could have been withheld. This preserves (1) and (7): integrity remains possible because projects can move us directly, without requiring us to act without reasons. It allows for "internal reasons" that are constitutive of the agent's identity rather than external validations. I am committed to the view that some reasons are expressions of character rather than assessments of permissibility.

