answer: |-
  In a present-day suburb, Alice, a homeowner, sells a surplus stock of firewood from her property to her neighbor Bob, who requires it to maintain a customary level of household warmth during a mild winter. Bob values the wood above the agreed price, and Alice values the cash above the labor and stock, leaving both subjectively better off with no coercion, deception, or unequal bargaining power, as Bob has viable alternative suppliers at similar rates. Alice's motive is innocent financial prudence; she does not need the money for any specific household good but accumulates it solely to increase her liquid net worth beyond any foreseeable requirement, treating the money as an end in itself rather than a means to further goods, while Bob participates purely to satisfy his household need.

  **Verdict of the Mutual-Advantage Account:** The exchange is just. Justice in exchange is satisfied by voluntary consent and mutual benefit (Pareto improvement). Since both parties prefer the transaction to their status quo, bargaining power was equal, and no third parties were harmed, the price reflects a fair convergence of preferences regardless of the seller's ultimate use of the proceeds.

  **Verdict of Aristotle's Account:** The exchange is unjust. Justice in exchange requires restoring a proportion grounded in *need*, measured by money as a convention representing that need. By treating money as an end (*chrematistike*) rather than a measure of need (*oikonomia*), Alice severs the link between the currency and the reality it is meant to measure; the price thus ceases to reflect a proportion of needs and instead reflects an unlimited desire for accumulation. Because acquisition bounded by household need is natural while acquisition for money itself is not, the transaction violates the natural limit of exchange, rendering the proportionality required for justice impossible to establish.

  **Just Terms and Determinacy:** On Aristotle's standard, the just terms would be a price equivalent to the value of goods Alice actually *needs* to restore her household equilibrium (e.g., the cost of replenishing the wood or equivalent subsistence goods), not a profit for accumulation. This standard does not determine a precise numerical price, as "household need" is qualitative and variable; however, this indeterminacy is a feature of the account, not an artifact of the case, reflecting Aristotle's reliance on equity (*epieikeia*) to adjust universal principles to particular circumstances where exact mathematical proportionality is impossible.

  **Single Feature and Counterfactual:** The feature doing the work is the *telos* of the seller's acquisition (money as end vs. money as means to need). If this feature is removed—such that Alice sells the wood solely to purchase food or tools her household requires—Aristotle's verdict flips to just (as the exchange now serves natural *oikonomia*), while the mutual-advantage verdict remains just, causing the verdicts to converge.

  **Strand of Objection:** The case needs the strand that this kind of acquisition is *unbounded*, not merely that it deforms the agent. The injustice lies in the transaction's violation of the natural limit of need which grounds proportionality, not simply in the internal vice of the agent; it is not a stipulation because the limit is derived from the objective function of the household within the polis, whereas deformation is the ethical consequence of violating that limit.

  **Attacks and Counter-Attacks:** A defender of the mutual-advantage account would attack the case by arguing that "need" is subjective and revealed by willingness to pay, so Alice's desire for liquidity *is* a need, making the accumulation natural. A defender of Aristotle would say this is rigged because it conflates preference with human flourishing, ignoring that money depends on need for its validity; by treating money as an end, the mutual-advantage account destroys the very metric it uses to validate the exchange.
