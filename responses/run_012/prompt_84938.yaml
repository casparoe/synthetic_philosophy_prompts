  1. A defender would accept this as a fair shorthand for active inference, though they might wince at conflating the general FEP with the specific predictive processing mechanism. It is largely correct but imprecise regarding the variational bound.
  2. While defenders endorse 'controlled hallucination', they would reject the suggestion that sensory input only corrects predictions when errors occur, as minimisation is continuous. This exaggeration undermines the claim that we never perceive the world, which relies on a dubious indirect realism.
  3. A defender would wince sharply here, as variational free energy is an information-theoretic bound, not thermodynamic free energy. Thus, claiming the theory amounts to the second law is wrong, though FEP does presuppose non-equilibrium steady states consistent with thermodynamics.
  4. Defenders accept this is the 'dark room problem' but argue it fails because active inference minimises expected free energy, which values information gain over mere sensory quiescence. Therefore, the claim that the theory is refuted by this consequence is wrong, as the premise ignores instrumental and epistemic value.
  5. As the preceding claims regarding thermodynamics and the dark room problem are contested, this disjunctive verdict does not follow. Defenders argue the principle is falsifiable via specific process models, though critics maintain the core principle remains tautological.

  My audit is most likely to fail on the thermodynamic distinction, as Friston does argue for a deep link between variational and thermodynamic free energy in non-equilibrium systems. I would change my mind if presented with a rigorous derivation showing variational minimisation necessarily entails thermodynamic work without additional biological assumptions.
