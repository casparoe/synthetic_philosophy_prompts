              *   "Promises make it commensurable": This is interesting. Deontological constraints (promises) often act as trump cards or weights. Saying it puts them "back on the same scale" is a bit simplistic but defensible. It suggests the promise adds a specific weight that might tip the scale, making one option definitively better.
              *   "Regret would only make sense if she'd done something worse": This is controversial. Agent-regret exists even when no mistake is made (Williams). But for a layperson context, it's a coherent internal logic.
              *   *Major Flaw:* The conclusion that there is "nothing to reason about" is the most philosophically contentious part. Most ethicists argue that even in hard choices, practical reasoning is required (e.g., figuring out who you want to be).

