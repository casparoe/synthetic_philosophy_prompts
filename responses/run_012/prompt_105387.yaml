prompt: |-
  I run a small reading group for people who did maybe one philosphy module at uni, and next month it's my turn. The topic I've landed on is whether "better than" is transitive -- you know, the thing where every step in a chain looks obviously fine, the far ends look monstrous next to each other, and everyone in the room nods at each adjacent pair and then wants to bail at the last one. I dont want you to explain the argument to me; I want a plan for how I explain it to them in about forty-five minutes.

  So: what has to be in place before the puzzle even bites? I assume the difference between transitivity as a property of a relation and "sounds insane if you chain it" has to come early, but tell me what else and in what order, and which bit depends on which.

  Then the carrying example. I'd rather not use the one everyone's already half-remembered, and I'm tempted by something where the steps trade one kind of good off against a different kind, so they can't just tell themselves it's one number getting smaller. Give me the example, and say what it has to have (adjacent steps close enough to be undeniable, the ends far enough apart to be repugnant) and what it mustn't have (any step that's already a leap, any place where they can say "well there the comparison just stops making sense").

  Then the misconceptions, in the order they'll actually show up, and where in my sequence I head each one off. I'm expecting at least: "this is just the sorites/vagueness thing", "so one premise is false and obviously it's the transitivity one", "it's really about how you measure goodness", and "if there's no fact about the middle comparisons then the whole thing is a trick". Plus whatever else you think they'll form that I haven't listed.

  And one question to put to them at the end that tells me whether they've got the structure of the problem rather than just been startled by it. Also tell me what I should openly refuse to settle -- I don't want to pretend we've resolved it in an hour. No readings, they won't do them anyway.
