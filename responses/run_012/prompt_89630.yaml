answer: |-
  Good evening, everyone. For those who don't know me, I'm Sarah, Nell's sister.

  Looking around this room, I realize we have a unique challenge tonight. On one side, I see my family: people who measure a good evening by the quality of the food and the volume of the laughter. On the other, I see Nell's colleagues: people who might accidentally analyze the syntax of my toast instead of listening to it.

  So, I'm going to try to walk a line. I'm going to talk about value. About what makes a life good.

  Nell has spent a long time thinking about this. She knows that when you strip away the noise, the things that are good in themselves—the things worth having just for the sake of having them—are rare. Mostly, they come down to two: the appreciation of beauty, and the love of particular people.

  I see the first one in you both all the time. It's in the way you stop walking to point out a specific shade of light on a building, or how you'll stand together in a gallery, not speaking, just looking at the same painting until it feels like you're seeing it with one set of eyes. There is a specific kind of magic in that. A shared consciousness. It's the feeling that the world is brighter because there are two of you witnessing it together.

  And I see the second one, too. The love of particular people. Not loving humanity in the abstract, and not loving someone because they check boxes on a list of excellent qualities. But loving *this* person. Nell and Tomas, you love each other not for what you provide, or how useful you are, but simply because you are who you are.

  If you added up all those moments—the sunsets, the laughter, the shared glances—you would have a very beautiful sum. But there is a philosophical idea that says the value of a whole isn't just the sum of its parts. A marriage isn't a ledger of nice moments. It's an organic unity. It becomes a thing entirely its own.

  But this is where I want to pause. Because if we only count the moments we notice—the beautiful things, the conscious acts of love—we miss most of the marriage.

  Eleven years is roughly ninety-six thousand hours. I would guess that only a tiny fraction of those hours were spent looking at sunsets or holding hands. Most of those hours were unfelt.

  There are thousands of hours where Nell is asleep and Tomas is awake. Hours where Tomas is in traffic and Nell is reading a book. Hours where one of you is standing in a kitchen, tired, hating your job, worrying about money, and the other person is in the other room, and nobody is appreciating anybody. In those moments, there is no audience. There is no shared consciousness of beauty. There is just life, happening separately.

  Some thinkers might call those hours filler. Time that doesn't count toward the value of the relationship until you come back together and notice each other again.

  I think that's backwards.

  I think those unfelt hours are load-bearing.

  Because it is easy to love someone when you are looking at them. It is easy to value a relationship when you are feeling its warmth. But the trust that holds a marriage together is built in the unwitnessed time. It's the knowledge that while you are asleep, or stressed, or ordinary, the other person is still there. The value isn't in the appreciation; it's in the continuity.

  The beauty you share is the roof of this house. It's what keeps the weather out. But the unfelt hours? The quiet, unobserved, mundane trust? That is the foundation. Without those hours, without the time spent apart or side-by-side in silence, the beautiful moments would have nowhere to land.

  Nell and Tomas, you have built something that works in the light, but also in the dark. You have built a whole that is greater than the sum of your best days. You have built a life that holds value even when no one is watching.

  So, if everyone could please raise a glass.

  To the shared sunsets, yes. But mostly, to the unwitnessed hours. To the trust that holds when you aren't looking. To the foundation.

  To Nell and Tomas.
