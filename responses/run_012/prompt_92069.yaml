answer: |-
  1. The play makes its strongest case that consent is voided by structural coercion when Angelo conditions Claudio's life on Isabella's sexual compliance. This demonstrates that pressure rendering refusal impossible negates agreement regardless of verbal acquiescence.

  2. This principle is sharply compromised when the Duke validates the bed trick, suggesting that deception regarding identity is morally permissible if it serves restorative justice rather than protecting the autonomy of the deceived party.

  3. By allowing Mariana to satisfy Angelo's demand in Isabella's place, the text dramatizes the legalistic assumption that consent is a transferable obligation. It leaves unresolved whether this exposes the violence of such logic or merely relies upon it to secure a comic resolution.

  4. Isabella's silent response to the Duke's final proposal commits the play to the unsettling view that under absolute sovereignty, consent is irrelevant because refusal is impossible, rendering the marriage a command rather than a contract.

  5. The play contributes what abstract theory lacks by staging the phenomenology of the deceived aggressor. It forces us to confront whether a rapist's mistaken belief can ever constitute a valid claim to consent even when the act itself is physically consensual.
