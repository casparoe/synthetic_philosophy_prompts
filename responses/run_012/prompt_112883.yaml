answer: |-
  Subject: Prep for the seminar

  Here is how I am thinking about the room for next month. The two political scientists working with dyadic datasets are going to be your biggest problem, not because they will disagree with your conclusion but because they will attack your premise on technical grounds that could make the rest of your talk look sloppy. They will argue that power-transition theory and the Thucydides Trap as operationalized in the literature are falsifiable, pointing to specific variables like nuclear overhang or economic interdependence that should mitigate the risk, and if war does not occur under those conditions, the model is stressed. You should concede up front that the academic models attempt falsification but hold that the policy usage of the analogy does not, because in the seminar room and the Situation Room, the absence of war is always attributed to successful deterrence or statecraft rather than a failed prediction. Your reply is that you are critiquing the rhetorical lifecycle of the analogy once it leaves the dataset and enters the briefing book, where it becomes a self-sealing prophecy. The soft spot here is that if they pull up a specific paper showing a clear null result that damaged the theory's credibility in the field, you look like you are ignoring actual political science to fight a straw man of policy speak, so keep your focus tightly on the usage rather than the model.

  The diplomatic historians will come next, and while they are friendlier to your vibe, they pose a different risk by trying to trivialize your contribution. They will argue that no serious historian ever claimed analogies were laws and that you are spending an hour proving that context matters, which they view as their entire profession. You should concede that historians know analogies are imperfect but hold that policymakers treat them as predictive algorithms rather than heuristic mirrors, and that the harm comes from the hardening of the metaphor into a mandate. Your reply is that the historians have failed to stop the analogy from doing damage because they fight on accuracy rather than structure, correcting the facts of Munich while leaving the logic of the lesson intact. The soft spot is that they might quietly agree with you and then ask why you are telling them this, so you need to frame your talk as an intervention into policy practice rather than historiography to keep them engaged.

  The retired foreign service officer will be the most sympathetic but will raise the practical objection that analogies are necessary cognitive shortcuts under uncertainty and that demanding falsifiability in a crisis is a luxury we do not have. You should concede that decision-makers need heuristics to act but hold that the blind-spot test is not a demand for certainty but a demand for humility, forcing the room to articulate what would change their mind before they commit. Your reply is that we can afford shortcuts but we cannot afford shortcuts that claim to be laws, and that the blind-spot test is the tool that distinguishes a useful hunch from a dangerous dogma. The soft spot here is that you do not have a ready-made alternative decision matrix, so if they press you on what specifically replaces the analogy in the hour before a strike, you might look like you are offering critique without utility.

  On the specific case of Munich and Vietnam, someone will likely note that Vietnam was used as an analogy against intervention in Iraq, suggesting it is not a one-sided conditional. You should concede that the analogy was invoked against action but hold that the failure to act in Iraq cannot be booked as a success of the Vietnam lesson in the same way a war is booked as a success of the Munich lesson, because peace is multicausal and hard to attribute. Your reply is that the Munich analogy creates a imperative to act that is immediately verifiable by conflict, whereas the Vietnam analogy creates an imperative to wait that is only verifiable by a counterfactual that never arrives, leaving the restraint unvalidated. The soft spot is that this relies on a specific theory of political credit-claiming that might not hold if a peaceful outcome is publicly attributed to restraint, so be careful not to overstate the asymmetry.

  Finally, the one question I am quietly hoping nobody asks is whether your blind-spot test is itself unfalsifiable, since you are proposing a diagnostic for bad analogies that relies on a normative claim about what counts as evidence, and if you cannot state what would count against the blind-spot test, you have simply replaced one unfalsifiable framework with another. If this comes up, you will need to pivot quickly to the pragmatic utility of the test rather than its epistemic status, but it cuts at the core of your thesis that unfalsifiability is the sin, so keep that grenade pinned until you have to use it.
