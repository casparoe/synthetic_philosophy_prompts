answer: |-
  **MEMORANDUM**

  **TO:** Members of the State Sentencing Commission
  **FROM:** Chair, Policy Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Amendment 9 (Culpability and Desert)

  **Recommendation**

  I recommend that the Commission **reject Amendment 9 as written**. While the concerns regarding the metaphysical basis of desert are substantial, abolishing the Culpability Score creates a sentencing regime based solely on risk prediction, which conflicts with our statutory mandate and fundamental notions of justice. However, I recommend we refer the Preamble language to a subcommittee to clarify that our conception of responsibility does not rely on "ultimate self-authorship," but rather on the capacity for reasons-responsiveness. This preserves the grid's structure while insulating it from the philosophical objection raised.

  **Analysis of the Basic Argument**

  The memorandum supporting Amendment 9 relies on a four-step argument attributing to Galen Strawson that no one can be ultimately responsible for their actions because no one chooses their own character. To evaluate this, we must distinguish three questions the argument runs together.

  First, is step (i)—that a person acts because of the "way she is"—a causal claim about physics or a claim about agency? If it is merely causal, it applies to all events, rendering responsibility impossible everywhere. If it is about agency, it allows that the "way she is" includes the capacity to reason, which supports responsibility. Second, does the desert invoked in our Preamble require the "ultimate self-authorship" the argument demands? The argument assumes that to deserve punishment, an offender must have created their own nature *ex nihilo*. Our guidelines, however, require only that the offender possessed the capacity to understand and act on legal reasons at the time of the offense. Third, does the argument refute only libertarian free will or also compatibilist desert? The argument is strongest if read as a refutation of libertarianism (the ability to do otherwise given identical past conditions). It is weakest if read as a refutation of compatibilism (the ability to act according to one's own reasons even if determined). The Commission has historically relied on the compatibilist view. Adopting Amendment 9 based on the Strawson argument requires accepting the strongest, most sweeping reading of that argument—that compatibilist desert is also incoherent. This is not established.

  **The "Proves Too Much" Objection**

  We must also consider the practical consequences if the argument succeeds. If no one deserves blame for wrongdoing, no one deserves praise for improvement. This undermines the logic of our earned-release and good-time programming, which rests on the idea that an offender has *earned* earlier release through effort. It invalidates the accountability language parole officers use to encourage compliance. Furthermore, it extends beyond the criminal justice system to ordinary moral criticism; we could not legitimately praise a teacher for dedication or blame a parent for neglect.

  Is this a cost we should accept? Proponents argue we should bite the bullet: if the metaphysics are false, our practices are unjustified regardless of the cost. However, when a philosophical argument invalidates the basic structure of social life—praise, blame, earning, and accountability—it suggests the argument may be targeting a specific, inflated definition of desert that we do not actually use. The Commission should be wary of dismantling the grid based on a conclusion that renders ordinary moral discourse unintelligible.

  **Institutional Role and Public Justification**

  This raises an institutional question: May a public body retain desert language for its expressive function while privately doubting its metaphysical basis? Some might call this a "noble lie." It is not, provided we do not assert the disputed metaphysics as fact. We may permissibly use desert language if it serves as a shorthand for a shared practice of holding agents accountable, distinct from a claim about cosmic origination.

  However, if we cannot resolve the underlying question, we should not pretend it is settled. The Commission should not assert that offenders "deserve" punishment in a basic, metaphysical sense if we doubt that sense exists. Instead, we should ground the Culpability Score in the *practice* of accountability necessary for a functioning legal order. We punish because the offender violated a norm they were capable of respecting, not because they are the ultimate authors of their soul. Retaining the Culpability Score without the "basic desert" Preamble language avoids the lie while maintaining the grid.

  **Consideration of the Opposing View**

  Members supporting Amendment 9 argue that the current grid inflicts moral harm on defendants like the one we heard last spring. That defendant, convicted of serious assault, suffered severe deprivation from infancy. Under the current guidelines, her Culpability Score placed her near the top of the grid, prescribing a lengthy term. Proponents argue that because she did not choose her childhood, her temperament, or the circumstances that shaped her, holding her fully culpable is cruel. They contend that even if compatibilism is coherent, it is unjust to impose severe burdens on agents whose capacity for reasons-responsiveness was systematically degraded by forces beyond their control. For these members, the metaphysical uncertainty is secondary to the moral urgency of stopping a system that punishes people for bad luck. They view the Risk Score as a more honest metric: it acknowledges we must manage danger, but admits we lack the standing to inflict retributive suffering.

  **Condition for Reconsideration**

  My recommendation rests on the viability of compatibilist responsibility within a legal framework. The single piece of evidence or argument that would most reasonably change my recommendation is a demonstration that the Culpability Score, as currently constructed, fails to distinguish between offenders who are reasons-responsive and those who are not. If it were shown that our grid treats the severely deprived defendant identically to a privileged defendant with the same conduct, despite a meaningful difference in their capacity to respond to legal norms, I would reconsider the utility of the Culpability Score. Absent that, we should retain the score but clarify its justification.

  **Action Required**

  Please review this analysis prior to next week's vote. I will move to reject Amendment 9 and refer the Preamble language to the Drafting Subcommittee for revision consistent with the reasoning above.
