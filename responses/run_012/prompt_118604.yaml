      *   *Camp B (The Pragmatic Administrators):* Influenced by diplomatics, administrative history, positivist empiricism. Believe archives reflect functional necessity. A poor fund ledger *shouldn't* have everyone, only recipients. Absence isn't always oppression; sometimes it's just scope.

