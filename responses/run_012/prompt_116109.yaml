          4.  The Price (Explanatory burden, not logical refutation).
          5.  Dan's Bias (It targets inertness, not dualism).

      *Refining the "Price":* The epiphenomenalist has to explain the correlation. If Brain State $B$ causes Pain $P$ and Utterance $U$, why does $U$ refer to $P$? If $P$ is invisible to the physical system, the physical system is just shouting into the void. The *reference* is the problem, not just the truth. But strictly, (5) says "can't be knowledge." The barometer shows it *can* be knowledge. So (5) is definitely the break point.
      *   *The "Bill":* The bill is the "Inverted Spectrum" or "Absent Qualia" worry. If the physical causes both, why couldn't the physical cause the utterance "I see red" while the quale is green? The correlation is brute. That's the cost.
      *   *Dan's Survival:* Dan's argument transforms from a *reductio ad absurdum* (logical death) to an *inference to the best explanation* (epistemic cost). It's not a kill, it's a wound.

  7.  **Checking Constraints:**
