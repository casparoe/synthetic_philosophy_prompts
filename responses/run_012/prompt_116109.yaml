      *   **Cost to Epiphenomenalist:** They must accept a "pre-established harmony" style explanation. The physical brain state must reliably produce *both* the specific quale and the specific report. This requires a very robust psychophysical law. It's not "dead," but it's expensive. It makes the alignment mysterious (why *this* quale for *this* brain state?).
      *   **Does Dan's Worry Survive?** Yes, in a weaker form. It's not a *logical* contradiction (self-refutation), but an *explanatory* burden. The epiphenomenalist owes an account of the reliability of the tracking.
      *   **Dan's Bias:** The argument doesn't kill property dualism any more than epiphenomenalism, unless the property dualist claims qualia *do* cause things. If Dan is a property dualist who believes qualia have causal power, this argument helps him. If he's an epiphenomenalist property dualist, it hurts him too. The argument specifically targets the *causal inertness* of the phenomenal, not the *duality*. So it doesn't let "nearby views" stroll away untouched if those views also deny causal efficacy. However, interactionist dualism survives.

  6.  **Drafting the Response (incorporating British English & Constraints):**
