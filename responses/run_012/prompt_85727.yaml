answer: |-
  Alright, let's sit with this. You're stuck in the classic pincer movement: Semantic Realism (1) vs. Naturalized Epistemology (6-7). Your friend is pushing a Quinean/Field-style line that says if you want to be a naturalist about knowledge, you can't be a realist about truth for abstracta. He's betting you'll blink on (1). You're betting you can blink on (6) or (7).

  Here is the brainstorm on the exit routes, the costs, and then my commitment.

  ### The Three Exit Routes

  **Route 1: Kill (1). (The Friend's Choice)**
  *   **The Move:** Truth isn't correspondence. It's assertibility, coherence, or internal consistency within a linguistic framework. '7 is prime' is true because it follows from the rules of arithmetic, not because it matches a "number object."
  *   **The Cost:** You lose the explanation of *application*. If arithmetic is just a game we play, why does it map so perfectly onto physical reality? Why does engineering work? You have to treat the success of science as a miracle or a massive coincidence. Plus, as you said, it feels like you're changing the subject. If truth isn't answerable to how things are, it's hard to see why we care about it.
  *   **Verdict:** You've already ruled this out, and rightly so. It solves the epistemic problem by dissolving the ontology, but it creates a massive explanatory debt regarding the utility of math.

  **Route 2: Kill (5). (The Nominalist Choice)**
  *   **The Move:** Deny that '7' stands for a non-spatiotemporal object. Maybe '7' stands for a property of concrete collections, or it's a meaningless mark, or it's a mental construct.
  *   **The Cost:** With your math background, this should hurt. Benacerraf's *identification problem* kills this for most people. If 7 is a set, which set? Von Neumann or Zermelo? Both work structurally, but they aren't identical. If numbers are structural roles, you're back to abstract structures. If they are physical marks, you can't explain the infinitude of primes. You end up distorting the mathematics to fit the metaphysics.
  *   **Verdict:** Too high a cost for a mathematician-philosopher. It makes arithmetic false or incomplete.

  **Route 3: Kill (6) or (7). (The Epistemic Revision Choice)**
  *   **The Move:** Deny that knowledge/reference requires causal contact. We can have epistemic access to things that don't bump into us.
  *   **The Cost:** You need an alternative epistemology. If not causation, then what? Rational intuition? Structural mapping? Indispensability? If you say "rational intuition," you risk sounding mystical (Gödel's Platonism). If you say "indispensability," you tie math knowledge to empirical science (Quine-Putnam), which makes pure math contingent. You have to explain how a finite, spatiotemporal brain latches onto a non-spatiotemporal reality without a causal bridge.
  *   **Verdict:** This is the only route that preserves both (1) and (10).

  ### The Electron Sleight of Hand

  Now, let's look at your friend's move with the electron. He claims the access problem generalizes: we don't "touch" electrons either, so if (6)-(7) kill numbers, they kill physics.

  This is a **sleight of hand**, but a subtle one.

  The parallel fails on step (7).
  *   **Electrons:** Even if I haven't "seen" an electron, the standard scientific realist story is that electrons *causally interact* with cloud chambers, which causally interact with photons, which causally interact with my retina. There is a causal chain, however attenuated. The electron is a posit in a theory designed to explain causal regularities.
  *   **Numbers:** The number 7 does not cause the chalk mark on the board. It does not cause my neural state when I think "7 + 5 = 12".

  Your friend is conflating *observational directness* with *causal relevance*. We can grant naturalism (no spooky causation) without granting that *only* causal objects are knowable. The electron passes the causal test (indirectly); the number fails it.

  If your friend insists electrons *also* fail (7), he is arguing for Instrumentalism about physics (we don't *know* electrons exist, we just use the theory). If he's willing to be an instrumentalist about physics, he has no right to claim (10) is secure while (1) is not. But if he wants to save physics, he must admit that (7) is too strong for electrons too, or that electrons satisfy a weakened version of (7) that numbers don't.

  Either way, the electron analogy doesn't force you to drop (1). It forces you to clarify (6) and (7).

  ### The Commitment

  Here is the step I reject: **Step (6).**

  > *(6) You can only know what a term stands for if you have some contact with the thing it stands for — some connection that makes your use of the term answerable to that thing rather than to your own projections.*

  Specifically, I reject the implication that "contact" must be **causal**.

  **Why this step?**
  Step (1) is a definition of truth (semantics). Step (10) is a Moorean fact (epistemology). Step (6) is a theoretical constraint on how semantics and epistemology link up. Theoretical constraints are the cheapest things to discard. You don't throw away the definition of truth or the fact of knowledge because a specific theory of reference (Causal Theory of Reference) says they can't meet. You throw away the theory of reference.

  **What does this cost you?**
  It costs you the comfort of Naturalism, or at least, it forces you to expand it. You can no longer say "knowledge is a causal relation between knower and known." You have to say something like: "Knowledge is a reliable structural mapping between the knower's cognitive states and the target domain."

  For concrete objects, causal interaction *ensures* that mapping. For abstract objects, something else must ensure it.
  *   **Option A (Rationalism):** Our cognitive faculties are tuned to grasp structural truths directly. (Cost: Sounds spooky, needs cognitive science backup).
  *   **Option B (Structuralism/Mapping):** We don't refer to "7" as an object; we refer to a position in a structure. We know the structure because we built it (or our minds are built to process it). The "contact" is the isomorphism between our logical operations and the abstract structure.

  **The Straight Talk:**
  Your friend thinks (6) is a precondition for realism. It isn't. It's a precondition for *causal* realism. By rejecting (6), you are admitting that reference is not always a physical hook-up. Sometimes it's a conceptual lock-in.

  If you keep (1), you are saying truth is about how things are.
  If you keep (10), you are saying we grasp how things are.
  Therefore, we must be able to grasp how things are without causal contact.

  **The Price:** You have to do the hard work of explaining *how* that grasping happens without magic. You can't just say "we intuit it." You have to argue that mathematical knowledge is knowledge of *possibilities* or *structures*, and our access to those is grounded in our capacity to manipulate symbols and reason, which *is* spatiotemporal, even if the object of the reasoning is not.

  **Final Call:**
  Cut (6). The requirement for causal contact is a category error when applied to abstracta. It treats numbers like hidden pebbles. They aren't hidden pebbles; they are conditions of possibility for counting pebbles. We know them because we are the things doing the counting, not because they hit us. Keep (1), keep (10), and tell your friend his electron analogy conflates causal explanation with structural description.
