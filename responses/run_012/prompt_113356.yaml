answer: |-
  She will classify the sentence as counterfactual.

  Two primary rules survive her existing record: a **morphological rule** keyed to grammatical mood (indicative verb forms yield "indicative"; subjunctive forms and "would" yield "counterfactual") and a **falsity rule** keyed to the presupposed truth value of the antecedent (open possibilities yield "indicative"; presupposed falsehoods yield "counterfactual"). Both rules account for the first three sentences (indicative forms, open antecedents) and the last three (subjunctive/perfect forms, antecedents known or implied to be false). The fourth sentence ("If John were at home") is compatible with both, assuming the use of "were" triggers a presupposition of falsity in her context.

  For the new sentence, "If it were to rain tomorrow, the picnic would be off," the predictions diverge. The morphological rule predicts **counterfactual** because the antecedent uses the subjunctive "were" and the consequent uses "would." The falsity rule predicts **indicative** (or remains undefined) because a future weather event cannot be known or presupposed to be false at the time of utterance. I would bet on the morphological prediction because semanticists typically categorize conditionals based on their logical form (indicative vs. subjunctive) rather than transient epistemic states, and the "were to" construction is the standard grammatical marker for the subjunctive class, which her record consistently bins as "counterfactual" regardless of temporal reference.

  To separate these remaining contenders, the best test sentence is: "If Oswald did not kill Kennedy, someone else did." The morphological rule predicts **indicative** (due to the past indicative "did"), whereas the falsity rule predicts **counterfactual** (since the antecedent is generally known to be false).
