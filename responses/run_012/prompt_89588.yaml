  2.  **Deconstruct the World Happiness Report (WHR) Methodology:**
      *   **Dependent Variable:** Cantril Ladder (Life Evaluation). "Imagine a ladder... 0 worst... 10 best... where do you stand?"
      *   **Independent Variables (The Six):** GDP per capita, Social Support, Healthy Life Expectancy, Freedom, Generosity, Corruption.
      *   **Relationship:** The six factors *explain* the variance in the ladder score across countries. They are predictors/causes, not components of the score itself.
