      *   **Commitment 1: Evaluative vs. Experiential.** The Cantril Ladder measures *life evaluation* (cognitive judgment), not *emotional state* (moment-to-moment affect). Governing for this requires believing a cognitive judgment is the right target.
      *   **Commitment 2: Commensurability.** It presupposes cross-cultural comparability. That a "7" in Finland means roughly the same as a "7" in Costa Rica (despite linguistic/cultural differences in scale use).
      *   **Commitment 3: Causes vs. Components.** The practice treats the six factors as *causes* (or correlates) of the ladder score, not components. If they were components, the score would be a weighted average of them. It's not. It's a regression model. However, the Minister's instruction ("move all six levers") treats them as instrumental causes.
      *   **Commitment 4: The Number vs. The Thing.** This is the crux. Goodhart's Law. If the target is the rank, you can game the survey (sampling, framing) without changing wellbeing. The practice *needs* to believe the number tracks the thing to be legitimate, but operationally, it only *needs* to move the number to succeed politically.

