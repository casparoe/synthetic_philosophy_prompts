          Third, and most critically, there is the tension between the number and the reality. The practice *officially* commits to making people happier, but operationally, it only requires making the number go up. This is Goodhart's Law in action. A statistician could shift the ranking by altering survey sampling, translation phrasing, or timing, without improving a single life. The practice doesn't *need* to believe the number tracks reality to function politically, but it *needs* that belief to be ethically defensible.

