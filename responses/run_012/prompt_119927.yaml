  Distinguished guests, His Excellency, colleagues, and sisters of St. Jerome's.

  We gather to mark one hundred and fifty years of this institution. Founded within the quiet discipline of a religious order, yet standing today as a secular hall of learning, St. Jerome's embodies a transition that many find contradictory. Yet, in the light of Sor Juana Inés de la Cruz, this history appears not as a rupture, but as an unfolding fidelity. We are often told that Sor Juana fought for the right of women to think. This is a modern simplification. She did not argue from the standpoint of personal entitlement. She argued from the standpoint of theological necessity.

  Sor Juana posited that the intellect is not a possession to be enjoyed, but a capacity entrusted to the soul. To receive such a gift and leave it dormant is not innocence; it is a form of culpable negligence. She maintained that God bestows reason so that it might be employed in the service of truth. To refuse this labour is to insult the Giver. Therefore, the study of theology and philosophy is not a leisure activity for women, but a strict obligation. Ignorance, in her view, is not a safe harbour for piety; it is a failure of stewardship.

  However, there is a further implication in her thought, one we must articulate today. If the intellect is a trust given by God for the defence and elucidation of the faith, then to systematically exclude women from formal theological education is not merely a restriction upon women. It is an act of theft from the Church.

  This is the pivot upon which our understanding must turn. When an institution prevents half of its members from exercising their intellectual capacity, it impoverishes itself. It deprives the community of the very resources needed to answer its critics, to deepen its understanding, and to navigate the complexities of the world. To silence the female intellect is to fight with one hand bound behind the back. It leaves the faith vulnerable, poorly defended, and intellectually malnourished.

  Your Excellency, I speak to you directly on this point. You bear the responsibility for the integrity of the Church. You require every available mind to safeguard the deposit of faith. If you constrain the intellectual labour of women, you are not protecting the Church; you are stripping it of its armour. The defence of truth requires the full mobilisation of capacity. To deny women the training to articulate theology is to withhold necessary provisions from the army you command. It is a prudential error that weakens the very institution you seek to preserve. The Church cannot afford to lose half its voice when the world is shouting.

  And to the secular feminists here present, I also speak directly. You have long argued that women must claim space in the academy. This is just. But if we frame this solely as a matter of autonomy or self-actualisation, we diminish the weight of the endeavour. Sor Juana offers a more demanding vision. The goal is not merely to study for the sake of personal liberation. The goal is to study because the truth requires it. Your intellect is not a tool for self-expression alone; it is an instrument for the preservation of meaning. To seek education is to accept a burden. It is to acknowledge a debt to the truth that demands repayment through rigorous work. You do not seek access merely to take; you seek access to give what only you can offer.

  This brings us to the third vocabulary we must share. It is neither the language of rights, which can isolate the self, nor the language of submission, which can erase it. It is the language of stewardship and integrity.

  St. Jerome's began as a convent and became a college. This was not an abandonment of its founding spirit, but a recognition that the stewardship of the intellect extends beyond the cloister. The duty owed to God and the duty owed to the world are not separate debts. When a woman cultivates her mind, she honours the trust placed in her humanity. She ensures that the community—whether religious or secular—remains whole.

  If we view education as a trust, then exclusion is a breach of faith. If we view intellect as a capacity for service, then silence is a loss for all. We must not ask whether women are permitted to study. We must ask whether the Church and the world can survive if they do not.

  Sor Juana taught us that the mind is a lamp. To hide it is not humility; it is waste. To light it is not rebellion; it is fidelity. Let us leave this anniversary committed to the integrity of the whole. Let us ensure that no talent is buried, no voice is stifled, and no resource is stolen from the common good. Let us honour the trust placed in us, not by claiming what is ours, but by giving what is required.

  Thank you.
