answer: |-
  Here is a complete lesson plan designed for your co-instructor. It includes the materials, the run-of-show, the debrief script, and a "Theory Notes" section that distinguishes settled results from open debates.

  # Lesson Plan: The Liability Committee
  **Course:** Social Epistemology (300-level)
  **Time:** 75 Minutes
  **Students:** 18
  **Goal:** Experience the Discursive Dilemma (Doctrinal Paradox) before defining it.

  ---

  ## Part 1: Instructor Prep & Materials

  ### 1. The "Rig" (Crucial)
  To guarantee the paradox, you cannot let students interpret the evidence entirely freely. You will distribute the **Case Packet** (same for everyone) along with a **Confidential Perspective Slip** (3 types, 6 students each).
  *   **Type A (6 students):** "Focus heavily on the Medical Report." (Leads to $P=Yes, Q=No, R=Yes$)
  *   **Type B (6 students):** "Focus heavily on the Driver's Conduct." (Leads to $P=Yes, Q=Yes, R=No$)
  *   **Type C (6 students):** "Focus heavily on the Pre-existing Conditions." (Leads to $P=No, Q=No, R=No$)

  *Instruction to Co-Instructor:* Hand these slips face down with the packet. Tell students: "This slip assigns your specific analytical focus for this committee. Do not show it to others."

  ### 2. The Case Packet (Handout)
  **Case:** *Miller v. Barkley* (Civil Liability Committee)
  **Issue:** Is the defendant (Barkley) liable for injuries to the plaintiff (Miller, a delivery driver)?

  **The Rule:** The defendant is **Liable (R)** if and only if:
  1.  The dog's bite **Caused the Injury (P)**; AND
  2.  The driver did **NOT** have a Valid Excuse **(not Q)**.
  *(Note: A Valid Excuse (Q) exists if the driver provoked the dog or assumed the risk.)*

  **Evidence:**
  *   **Witness 1 (Driver):** "I was standing still. The dog jumped the fence. I felt immediate sharp pain in my calf."
  *   **Witness 2 (Owner):** "The driver was waving a clipboard aggressively. The dog has never bitten anyone before. Also, the driver has a history of knee issues."
  *   **Medical Report:** "Acute laceration consistent with dog bite. However, patient has degenerative tissue in the same area. Causation is medically probable but not certain."
  *   **Security Footage:** "Grainy. Shows driver moving arm, but angle obscures whether it was a threat or a defensive posture."

  **Your Task:** Vote **Yes** or **No** on the following three propositions. You must be logically consistent.
  1.  **P:** The bite caused the injury.
  2.  **Q:** The driver provoked the dog/assumed risk (Valid Excuse).
  3.  **R:** The defendant is Liable.

  ### 3. Ballots
  Simple slips with checkboxes for P, Q, R.

  ---

  ## Part 2: Run of Show (75 Minutes)

  ### 0:00 – 0:10 | Introduction & Packet
  *   **Instructor:** "You are the Liability Committee. You have a case, a rule, and evidence. You must reach a collective decision. Read the packet and your confidential slip. Do not discuss yet."
  *   **Action:** Distribute Packets + Perspective Slips.
  *   **Note:** The slip text should be subtle. E.g., Type C slip says: *"Committee Role: Medical Consistency Auditor. Prioritize the ambiguity in the Medical Report regarding pre-existing conditions."*

  ### 0:10 – 0:20 | Individual Voting
  *   **Instructor:** "Fill out your ballot. Ensure your three answers are logically consistent with the Rule provided. If you say P is Yes and Q is No, R *must* be Yes."
  *   **Action:** Collect ballots.
  *   **Instructor:** (While tallying quickly on the board) "I'm calculating the Majority View for each proposition."

  ### 0:20 – 0:30 | The Reveal (The Paradox)
  *   **Instructor:** Writes the Majority Results on the board:
      *   **Majority on P (Causation):** YES (12-6)
      *   **Majority on Q (Excuse):** NO (12-6) *(Meaning Majority says No Excuse)*
      *   **Majority on R (Liability):** NO (12-6)
  *   **Instructor:** "Look at the rule. Liability requires Causation (Yes) and No Excuse (Yes). The majority agreed on both premises. But the majority voted 'Not Liable' on the verdict."
  *   **Prompt:** "Did anyone make a mistake? Check your own ballot. Was your logic wrong?" (Students will see they were individually consistent).
  *   **Prompt:** "Did I tally wrong?" (Verify the numbers publicly).
  *   **Key Question:** "How can a group be rational when every member is rational?"

  ### 0:30 – 0:45 | The Split (Procedure Comparison)
  *   **Instructor:** "We need a final verdict. We are going to split the room to test two different decision procedures."
  *   **Action:** Count students off 1 and 2.
      *   **Group 1 (Left Side): Conclusion-Based.** "You vote *only* on R (Liability). Ignore P and Q. Just give me the verdict."
      *   **Group 2 (Right Side): Premise-Based.** "You vote *only* on P and Q. I will calculate R for you based on the rule. You are not allowed to vote on R directly."
  *   **Action:** Run the votes. Tally immediately.
  *   **Expected Result:**
      *   Group 1 (Conclusion) will vote **Not Liable** (reflecting the original R majority).
      *   Group 2 (Premise) will derive **Liable** (because Maj P=Yes, Maj Q=No).
  *   **Instructor:** "Same people. Same evidence. Two standard democratic procedures. Opposite verdicts."

  ### 0:45 – 0:50 | Transition to Debrief
  *   **Instructor:** "Keep your seats. We are going to unpack exactly what happened. Do not pack up."

  ### 0:50 – 1:15 | Debrief & Theory Mapping
  *(See detailed script below)*

  ---

  ## Part 3: The Debrief Script

  **Beat 1: The Consistency Assumption (5 mins)**
  *   **Ask:** "When you filled out your ballot, what did you assume about the relationship between your vote and the group's vote?"
  *   **Point:** Most assume that if everyone is consistent, the group will be. This activity shows **individual consistency does not aggregate to collective consistency.**
  *   **Term Reveal:** "This is the **Discursive Dilemma** (or Doctrinal Paradox)."

  **Beat 2: Distinguishing from Condorcet (5 mins)**
  *   **Ask:** "Some of you might be thinking of voting cycles (A beats B, B beats C, C beats A). Is this that?"
  *   **Correction:** "No. Condorcet problems arise from *preferences* (I like X more than Y). This arises from *judgments on truth* (Is P true? Is Q true?). Even if we all want the 'truth,' the math breaks. This is an epistemic problem, not just a preference problem."

  **Beat 3: The "True Values" Fix (5 mins)**
  *   **Ask:** "Could we fix this if I told you: 'Don't strategize, just vote your honest belief on the evidence'?"
  *   **Discussion:** Let them argue.
  *   **Truth:** "It wouldn't help. You *did* vote your honest beliefs (guided by your slips). The paradox persists even with perfect honesty. The problem is the **aggregation rule** (majority vote) meeting a **connected agenda** (P & Q → R)."

  **Beat 4: Agenda Design & Escaping the Trap (5 mins)**
  *   **Ask:** "Can we design the agenda to avoid this? What if we just voted on P and Q, and ignored R?"
  *   **Discussion:**
      *   *Settled:* If you drop R from the vote, the paradox disappears (Premise-based procedure).
      *   *Settled:* If you drop P and Q and vote only on R, the paradox disappears (Conclusion-based procedure).
      *   *Settled:* You cannot have *both* a vote on all three *and* guarantee majority consistency. This is the **List-Pettit Impossibility Theorem**.
      *   *Correction on User Impression:* You asked if some agendas escape it. If the agenda contains logically connected propositions (like $P, Q, P \land Q \to R$), simple majority voting *cannot* escape it. You must change the voting rule (e.g., require a supermajority) or restrict the agenda.

  **Beat 5: Normative Contestation (5 mins)**
  *   **Ask:** "Which group had the right verdict? The Premise group (Reasons-first) or the Conclusion group (Outcome-first)?"
  *   **Contested Theory:**
      *   *Epistemologists* often prefer **Premise-Based**: It forces the group to agree on reasons, promoting truth-tracking.
      *   *Legal/Political Theorists* often prefer **Conclusion-Based**: It respects the finality of the verdict and allows members to disagree on reasons but agree on outcomes (compromise).
      *   *Takeaway:* There is no consensus on the "right" fix. It depends on whether you value **Collective Rationality** (Premise) or **Democratic Responsiveness** (Conclusion).

  ---

  ## Part 4: Theory Notes for the Co-Instructor
  *(Hand this page to your co-instructor so they know what is fact vs. debate)*

  ### 1. What is Settled (The Math)
  *   **The Paradox is Real:** It is mathematically proven that if a group votes by simple majority on a set of propositions that are logically connected (e.g., $P, Q, R$ where $R \iff P \land Q$), the collective judgments can be inconsistent even if every individual is consistent.
  *   **Not Condorcet:** This is distinct from Arrow's Theorem or Condorcet Cycles. Those deal with *orderings/preferences*. This deals with *binary judgments/truth*.
  *   **Impossibility:** You cannot "tweak" the questions to make simple majority work on a connected agenda. List & Pettit (2002) proved that no aggregation function can satisfy Universal Domain, Anonymity, Systematicity, and Consistency simultaneously on connected agendas.

  ### 2. What is Contested (The Norms)
  *   **Premise vs. Conclusion:** There is no agreement on which procedure is "better."
      *   *Premise-Based:* Better for truth/knowledge? Yes. But it can be tyrannical (forces minority to accept a verdict they voted against based on reasons they reject).
      *   *Conclusion-Based:* Better for legitimacy/compromise? Yes. But it allows "incoherent" groups (a group that says Yes to premises but No to conclusion).
  *   **Democracy:** Does this prove democracy is impossible? No. It proves that *unconstrained majority rule on complex logical agendas* is unstable. Democracies survive by using representatives, parties, or constitutions that restrict the agenda.

  ### 3. Predictable Failure Modes & Fixes
  *   **Failure 1: "The Case Was Ambiguous."**
      *   *Student Objection:* "If the evidence was clearer, we would have agreed."
      *   *Your Response:* "Social epistemology assumes disagreement is permanent. We need rules for when evidence *isn't* clear. If everyone agreed, we wouldn't need to vote."
  *   **Failure 2: "Majority Rule is Broken."**
      *   *Student Objection:* "This just shows we shouldn't use majority vote."
      *   *Your Response:* "True for *connected* propositions. But we use majority vote for unconnected issues (e.g., 'Should we fund the park?' vs 'Should we fix the road?') without trouble. The problem is the *logical connection*, not the voting itself."
  *   **Failure 3: Strategic Voting.**
      *   *Risk:* If a student realizes the rig, they might vote strategically to force a result.
      *   *Fix:* Emphasize in instructions: "This is an epistemic exercise. Vote your genuine judgment on the evidence provided."

  ### 4. What the Game Can't Reproduce
  *   **Deliberation:** In real courts/committees, people talk. Deliberation *can* resolve the paradox by shifting people's views to align (e.g., convincing Group 3 that P is true).
  *   **The Limit:** However, deliberation doesn't always work. If values or interpretations are deeply divided, the structural paradox remains even after talking. You must state this: "In the real world, talk helps, but it doesn't solve the math problem if disagreement persists."

