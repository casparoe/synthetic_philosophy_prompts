answer: |-
  # Joint Statement of Adversarial Collaboration: Persistence and Identity

  ### I. Agreed Claims

  1.  **The Core Question:** We agree the dispute concerns the relationship between an entity existing at time *t1* and that same entity existing at time *t2*. Specifically, we are debating whether the entity at *t1* is numerically identical to the entity at *t2*, or whether they are distinct entities unified into a larger structure.
  2.  **Theoretical Obligations:** Any viable theory must provide truth-conditions for ordinary claims about change (e.g., "The mug was whole, now it is chipped"), account for the persistence of objects through qualitative alteration, and explain de re modal properties (what the object could have been) without contradiction.
  3.  **Temporary Intrinsics:** We agree that the problem of temporary intrinsics (how an object can be bent at *t1* and straight at *t2*) is not decisive on its own. Both views offer relativization strategies: one indexes properties to times (endurance), the other indexes properties to temporal segments (perdurance). Neither solution is logically privileged without further premises.
  4.  **Leibniz's Law:** We agree that change requires qualification. Neither side claims an object is *F* and *not-F* simpliciter. The disagreement is whether the qualification applies to the object relative to a time or to a segment of the object relative to the whole.
  5.  **Vagueness and Composition:** We agree that the argument from vagueness (that vague boundaries entail unrestricted composition) supports the view that persistence involves multiple temporal extensions, but it does not strictly rule out the view that a single entity can have vague boundaries. The link between semantic vagueness and ontological precision remains contested.
  6.  **Relativity of Simultaneity:** We agree that Special Relativity rules out a privileged global present. However, we agree this does not refute the view that an entity can be fully present at a time, provided "at a time" is understood relative to a frame of reference. The physics constrains the metaphysics but does not settle the ontology.
  7.  **Stage Theory:** We agree that standard stage theory (where ordinary names refer to momentary stages) is ontologically equivalent to the view that entities have temporal extensions, differing primarily in semantic reference. We treat "Stage Theory" as a variant of the temporal extension view for the purposes of this collaboration, not a genuine third ontological category.

  ### II. Cruxes of Disagreement

  | Crux | Sub-question stated neutrally | Endurantist's statement of the disagreement, in wording they'd accept | Perdurantist's statement, in wording they'd accept | Shared case or argument bearing on it | Endurantist's prediction | Perdurantist's prediction | What would move each side | Genuine or verbal |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of Numerical Identity** | Is the entity located at *t1* numerically identical to the entity located at *t2*? | Yes. The very same thing exists at both times. To deny this is to deny that the object survives change. | No. The entity at *t1* and the entity at *t2* are distinct time-indexed entities unified by causal relations into a larger aggregate. | **The Department Mug (Instant Swap):** If every atom in the mug is replaced instantly at *t2* with identical atoms, is the post-swap entity numerically identical to the pre-swap entity? | The mug is the same object because causal continuity preserves identity despite qualitative replacement. | The mug is a distinct temporal segment causally connected to the prior segment; "same mug" is loose speech for "same aggregate." | **E:** If it is demonstrated that "numerical identity" logically requires qualitative overlap.<br>**P:** If it is demonstrated that ordinary reference cannot pick out aggregates, only continuants. | Genuine |
  | **2. Vagueness and Existence** | Does indeterminacy in spatial or temporal boundaries entail indeterminacy in existence conditions? | No. Vagueness is a feature of language or epistemology. The object's existence conditions are precise even if our concepts are not. | Yes. If there is no fact of the matter about where the object ends, there is no fact of the matter about whether the object exists. | **The Amoeba (Split/Fuse):** At the exact instant of fission, before separation is complete, does one entity exist or two? | One entity exists until a precise (perhaps unknowable) instant of division occurs. | There is no fact of the matter; reality does not dictate a precise count at the moment of fission. | **E:** If ontic vagueness is proven logically incoherent (Lewis-style argument holds).<br>**P:** If semantic precision is shown to require arbitrary, magical cutoffs in reality. | Genuine |
  | **3. Continuity of Existence** | Must existence be continuous across intermediate instants to count as one entity? | No. An entity can cease to exist at *t1* and resume at *t3* provided the right causal or historical connections hold. | Yes. An entity existing at *t1* and *t3* but not *t2* constitutes two distinct entities, not one resuming existence. | **Discontinuous Existence (t1, t3, not t2):** A thing exists at 1pm, ceases entirely at 2pm, and comes back at 3pm indistinguishable from before. | This is one object that underwent intermittent existence. | These are two distinct objects that happen to be qualitatively identical. | **E:** If causal connection is shown to be insufficient for identity without spatiotemporal continuity.<br>**P:** If intuition confirms that "resurrection" scenarios preserve the original subject. | Genuine |

  ### III. Residue: The Purely Verbal Dispute

  There remains a suspicion that a portion of this disagreement is verbal, specifically regarding the definition of "object." If the Endurantist defines "object" as *that which persists by being numerically identical over time*, and the Perdurantist defines "object" as *the sum of all time-indexed entities causally connected*, they are not disagreeing about the world, but about the label applied to the ontology.

  This verbal residue is most visible in the "Stage Theory" agreement (Claim 7). If the Perdurantist admits that ordinary language refers to continuants while ontology describes aggregates, and the Endurantist admits that ontology might describe aggregates while ordinary language refers to continuants, the disagreement shrinks to whether ontology should mirror ordinary language or correct it. We agree to treat this as a substantive methodological disagreement rather than a purely verbal one, as it dictates which logic (classical identity vs. counterpart theory) applies to metaphysical reasoning.

  ### IV. Judgement Calls and Areas for Pushback

  In drafting this, I have made the following interpretative choices that either side may wish to contest:

  1.  **Perdurantist View on Relativity:** I have assumed the Perdurantist accepts that Special Relativity does not refute their view (Claim 6). Some Perdurantists argue SR *requires* perdurance. If the Perdurantist holds the stronger view, Claim 6 needs revision.
  2.  **Endurantist View on Vagueness:** I have characterized the Endurantist as an epistemicist or semanticist regarding vagueness (Crux 2). If the Endurantist accepts ontic vagueness, the "What would move each side" condition for the Endurantist in Crux 2 becomes irrelevant.
  3.  **Perdurantist View on Reference:** In Crux 1, I have attributed the view that "same mug" is loose speech to the Perdurantist. Some Perdurantists (referentialists) argue ordinary names *do* refer to the aggregate. If the Perdurantist holds this, the "What would move each side" condition regarding ordinary reference needs adjustment.
  4.  **Discontinuous Existence:** I have assumed the Discontinuous case is relevant to Crux 3. The Perdurantist might argue this case is irrelevant because nothing actually persists discontinuously in the physical world. If they dismiss the case as physically impossible, the crux loses its empirical bearing.
