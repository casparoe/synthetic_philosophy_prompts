  Here is a principle that fits your data, forces a resolution to the dominance violation you suspect, and generates concrete predictions for your new cases.

  ### The Principle: Structural Convergence with Probability Truncation

  **Statement:**
  I value a lottery by its Expected Value if and only if the sequence of expected contributions per outcome is **geometrically decreasing** (convergent structure). If the sequence of expected contributions is **constant or increasing** (divergent structure), I value the lottery by the Expected Value of the outcomes within my **Probability Horizon**, defined as the set of outcomes with individual probability $p \ge \epsilon$, where $\epsilon \approx 1/64$. External caps on payout or toss count are ignored unless they bind *within* the Probability Horizon.

  **Mechanism:**
  This is not standard risk aversion (utility curvature) nor standard probability weighting. It is a **cognitive filter on tail relevance**.
  1.  **Convergence Check:** I look at the term $p_n \times \text{payout}_n$. If this term shrinks as $n$ grows (e.g., by a factor of 0.8 each step), I trust the sum. If the term stays constant (factor of 1.0) or grows, I treat the sum as unreliable ("effectively infinite").
  2.  **Truncation:** For "effectively infinite" games, I sum only the terms where the probability of that specific outcome is at least $\approx 1.5\%$ ($1/64$). This corresponds to the first 6 tosses of a fair coin.
  3.  **Salience of Constraints:** A hard cap (wealth or rule-based) only alters my valuation if it cuts off outcomes *inside* my Probability Horizon. If the cap applies to outcomes I was already ignoring ($n > 6$), it does not change my price.

  ---

  ### Application to Your Six Cases

  1.  **Standard St. Petersburg:**
      *   *Structure:* $p_n = 2^{-n}$, Payout $= 2^n$. Term $= 1$. (Constant/Divergent).
      *   *Calculation:* Truncate at $n=6$ (where $2^{-6} \approx 1/64$). Sum of first 6 terms $= 1 \times 6 = \$6$.
      *   *Verdict:* **\$6.** (Matches your figure).

  2.  **Counterparty Wealth Cap (\$1M):**
      *   *Structure:* Payout capped at $n \approx 20$. Term $= 1$ for $n \le 20$. (Constant/Divergent).
      *   *Constraint:* Cap binds at $n=20$. My Horizon ends at $n=6$. The cap is outside my Horizon.
      *   *Calculation:* Ignore cap. Truncate at $n=6$. Sum $= \$6$.
      *   *Verdict:* **\$6.** (Forces you to abandon your \$20 figure).

  3.  **Rule Cap (25 Tosses):**
      *   *Structure:* Payout capped at $n=25$. Term $= 1$ for $n \le 25$. (Constant/Divergent).
      *   *Constraint:* Cap binds at $n=25$. Outside Horizon ($n=6$).
      *   *Calculation:* Ignore cap. Truncate at $n=6$. Sum $= \$6$.
      *   *Verdict:* **\$6.** (Forces you to abandon your \$25 figure).

  4.  **Super Variant ($2^{2^n}$):**
      *   *Structure:* Payout grows faster. Term $= 2^{-n} \times 2^{2^n}$. (Increasing/Divergent).
      *   *Calculation:* Truncate at $n=6$. For $n \le 6$, payouts match Standard Game ($2^1$ to $2^6$). Sum $= \$6$.
      *   *Verdict:* **\$6.** (Matches your figure).

  5.  **Biased Coin ($p=0.6$):**
      *   *Structure:* $p_n = 0.6(0.4)^{n-1}$, Payout $= 2^n$. Term $\propto (0.8)^n$. (Decreasing/Convergent).
      *   *Calculation:* Structure is convergent. Use Full Expected Value. $EV = \$6$.
      *   *Verdict:* **\$6.** (Matches your figure).

  6.  **Losing Mirror (Uncapped):**
      *   *Structure:* Loss grows exponentially. Divergent structure.
      *   *Mechanism:* **Ruin Aversion.** In the loss domain, a divergent structure implies unbounded liability. I do not truncate losses; I reject them.
      *   *Verdict:* **Refuse.** (Matches your figure).

  ---

  ### Which Verdicts You Must Abandon

  To maintain this principle, you must abandon your willingness to pay **\$20 for Case 2** and **\$25 for Case 3**.

  You suspected these were indefensible because they violate dominance (paying more for a strictly worse game than Case 1). This principle confirms your suspicion: because the caps in Cases 2 and 3 lie outside your cognitive probability horizon ($n > 6$), they are invisible to your valuation heuristic. You should value them identically to the Standard Game. This restores consistency: Case 1, 2, 3, and 4 are all priced at \$6, eliminating the dominance violation.

  ---

  ### Predictions for New Cases

  **1. The Standard Game Played 1,000 Times in Succession**
  *   **Analysis:** When a divergent game is aggregated, the Law of Large Numbers applies to the *truncated* distribution. The variance of the average payoff decreases. The "tail risk" that motivated the truncation in the single-play case is diversified away. You no longer face a single binary event with a hidden tail; you face a sum of 1,000 independent variables, each with a truncated mean of \$6.
  *   **Prediction:** You will treat this as a convergent aggregate. You will be willing to pay the sum of the truncated expectations.
  *   **Price:** **\$6,000.** (You will not discount for risk as you did in the single case, because the aggregation makes the return predictable).

  **2. The Losing Game with Liability Capped at \$1,000**
  *   **Analysis:** The liability is now finite. The maximum loss occurs at $n=10$ ($2^{10} = 1024 > 1000$).
  *   **Constraint Check:** The cap binds at $n=10$. Your Probability Horizon ends at $n=6$. The cap is *outside* your Horizon.
  *   **Mechanism:** Consistent with Cases 2 and 3, you ignore caps outside the Horizon. You treat this as the uncapped Losing Mirror (Case 6) because the "danger zone" ($n > 6$) is where you truncate, but in the loss domain, you do not truncate—you reject. However, since the cap makes the loss *mathematically* finite, does it trigger the "Convergent" rule?
  *   **Refinement:** The *structure* is still exponential ($2^n$). The cap is not salient (outside horizon). Therefore, you treat it as structurally divergent. In the loss domain, structural divergence triggers Ruin Aversion.
  *   **Prediction:** You will **Refuse to Play** (or pay \$0 to avoid, maintaining your stance from Case 6).
  *   **Alternative (if you accept finite losses):** If you decide the hard cap overrides the structural heuristic, you would value it at the Expected Loss within your Horizon ($n=1$ to $6$). Expected Loss $= \sum_{1}^{6} 2^{-n} 2^n = \$6$. You would pay **\$6** to avoid it.
  *   **My Stronger Prediction:** Given your refusal in Case 6 ("decline even cheap insurance"), the **Ruin Aversion** is dominant for exponential losses. The cap at \$1,000 is too distant to feel "safe." You will **Refuse**.

  ### Summary for the Seminar
  This principle allows you to tell your students: "I do not solve the St. Petersburg paradox by fixing the utility function or the probability measure. I solve it by admitting I have a **horizon of credibility**. I treat exponential payout structures as untrustworthy beyond the first 6 standard deviations, regardless of mathematical caps, unless the probability mass shifts to the head (Biased Coin). This costs me the ability to distinguish between uncapped and distantly-capped games, but it saves me from paying for tails I do not believe exist."
