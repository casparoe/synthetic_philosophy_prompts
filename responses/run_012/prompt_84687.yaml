      *   *Context:* Moore has spent the first 5 chapters establishing Meta-ethics (Good is simple, non-natural, indefinable) and Normative Ethics (critique of Hedonism and Naturalism). Now he must say what *is* good.
      *   *The Method:* Since 'good' is indefinable, we can't prove what is good by definition. We must use intuition (direct apprehension). We look for things that are good *in themselves* (intrinsic value), not just as means.
      *   *The Candidates:* Moore isolates "states of consciousness."
      *   *The Top Goods:*
          1.  The pleasures of human intercourse (personal affection/friendship/love).
          2.  The enjoyment of beautiful objects (aesthetic appreciation).
      *   *The Ranking:* Personal affection is generally the greatest good.
      *   *The "Organic Whole" Principle:* The value of a whole $\neq$ sum of values of parts. A whole can have greater value than the sum.
      *   *Application to Affection:* Loving someone involves (a) consciousness of the person, (b) emotion towards them, (c) often appreciation of their beauty/virtue. The *whole* state (love) is more valuable than just the beauty appreciation alone.
      *   *Application to Beauty:* A beautiful object *in itself* (unperceived) has little to no value. The *consciousness of* the beautiful object is where the value lies.

  3.  **Address the Specific Questions (Drafting the Content):**

