  I am preparing a short research proposal (about 1,500 words) for a two-year postdoctoral project on the lottery and preface paradoxes. My half-formed idea: rather than asking whether rational belief is consistent and closed under conjunction, treat acceptance as a policy that accumulates epistemic risk, so that both paradoxes fall out of a single budget-like constraint instead of two unrelated repairs. Turn this into a proposal. State the question so that it has a determinate answer; explain what the standard responses leave unsettled rather than merely disagreeing about; and specify what the budget is a function of, arguing for each element — the number of propositions accepted, their individual probabilities, whether they are evidentially independent, whether the belief concerns the agent's own reliability, and the practical stakes of being wrong. Say what would actually be done: which cases the constraint is tested against, and how it is meant to explain why the preface turns on a belief about one's own fallibility while the lottery turns on parallel low-probability propositions. Then say what decisive success would look like, and what would count as failure — including the possibility that the budget is a redescription of the two paradoxes in new vocabulary, or that it collapses into ordinary pragmatic encroachment about knowledge. Keep the plan realistic for two years. No citations or literature review: refer to positions by description and I will supply the references.
