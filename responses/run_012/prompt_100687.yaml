answer: |-
  You have reconstructed a classic position in the philosophy of mind: **Teleosemantics** (specifically the etiological account championed by Ruth Millikan and David Papineau). You've done a solid job capturing the core intuitions.

  Here is the stress test you asked for. I'm going to clear one of your worries immediately, rank the remaining two by severity, and then offer the fixes.

  ### The Non-Issue: Worry C (Rules 2 & 4)
  **Verdict:** Your friend is mistaken about the internal logic. Rules 2 and 4 are not fighting; they are twins.

  Both rules rely on the exact same principle: **Meaning requires History.**
  *   **Rule 2 (The Frog):** The frog's neuron means BUG because it has a *history* of being selected for bugs. The leaf is a misfire precisely because the history doesn't support "leaf."
  *   **Rule 4 (Swampman):** The duplicate has no meaning because it lacks that *history*.

  Your friend likely finds Rule 4 counter-intuitive (most people feel Swampman *does* have thoughts), but that is an objection to the theory's conclusion, not its consistency. As long as you commit to **Externalism** (meaning is outside the head, in the history), 2 and 4 stand or fall together. You don't need to fix this; you just need to own the bullet. It is the price of admission for this package.

  ---

  ### The Real Problems (Ranked by Severity)

  #### 1. The Disjunction Problem (Worry B)
  **Severity:** Fatal.
  **The Issue:** You worry that selection history might not pin down *exactly* what was selected. Was the warbler alarm selected for *Hawks*, *Aerial Predators*, *Dark Shapes*, or *Things That Cause Panic*? If the evolutionary story is compatible with all of these, then Rule 3 (Definite Meaning) collapses. If history underdetermines content, your theory fails to explain what thoughts are *about*.

  **The Cheapest Fix:** Invoke **"Normal Conditions."**
  Refine Rule 1. A signal means X if it was selected to correlate with X *under the normal conditions in which the selection occurred*.
  *   *How it works:* You look at the specific causal chain that led to reproduction. If the birds only survived because they fled *hawks* specifically (not just any dark shape, because they ignore dark clouds), then the "Normal Condition" filters out the disjunctions.
  *   *What you give up:* **Epistemic Access.** You maintain that there *is* a definite answer (Rule 3 holds), but you admit that we (and the bird) might never be able to figure it out. It makes content a "hidden variable" that is factually real but potentially unknowable.

  #### 2. The Extinction/Shift Problem (Worry A / Rule 5)
  **Severity:** High.
  **The Issue:** Rule 5 says meaning is locked forever. If the hawk goes extinct, the alarm call technically means nothing (or means a ghost), even if it saves lives against cats. This makes your theory unable to account for how organisms adapt meaningfully to new environments without waiting for new species to evolve. It renders the bird's successful survival behavior "accidental" relative to the signal's meaning.

  **The Cheapest Fix:** Distinguish **Phylogenetic** vs. **Ontogenetic** Selection.
  Keep Rule 5 for innate, hard-wired reflexes (phylogeny), but allow **Learning** to function as a selection process for neural pathways (ontogeny).
  *   *How it works:* If the warbler learns to associate the call with the cat, that specific neural connection undergoes a "selection" process via reinforcement (dopamine/survival). The *pathway* now has a new history.
  *   *What you give up:* **Simplicity.** You now have two kinds of meaning: "Hardwired Meaning" (fixed by evolution) and "Learned Meaning" (fixed by experience). You also blur the line between evolution and learning, which some purists dislike.

  ---

  ### The Single Change to Clean Up the Most

  If you want to maximize the stability of your package with one adjustment, modify **Rule 1**.

  **Current Rule 1:** A thought means whatever evolution built it to keep track of.
  **Proposed Rule 1:** A thought means whatever feature it was selected to correlate with, **where "selection" includes both species evolution and individual learning.**

  **Why this clears the board:**
  1.  **Solves the Warbler (Rule 5):** If the hawk is gone and the bird learns the cat triggers the alarm, the *learning process* establishes a new selected function. The alarm can now mean CAT without violating the "history" requirement. You don't have to claim the signal is broken; you just acknowledge its history has been updated by experience.
  2.  **Helps the Disjunction (Rule 3):** Evolutionary history is ancient and fuzzy (Hawk vs. Predator). Individual learning history is recent and specific (That specific shape killed my neighbor). By allowing learning to fix content, you make determinate meaning much easier to establish.
  3.  **Preserves Swampman (Rule 4):** Swampman still has *no* history—neither evolutionary nor learning-based. He pops into existence fully formed. So he still lacks content. Your core externalist intuition remains intact.
  4.  **Preserves the Frog (Rule 2):** The frog's detector is innate. It hasn't "learned" to snap at leaves. So its history remains strictly evolutionary, and the leaf remains a misfire.

  **The Cost:**
  You lose the purity of "Evolutionary Only" semantics. You have to treat the brain as a place where micro-evolutionary selection pressures (learning) happen constantly. This requires you to be precise about what counts as a "selection process" in the brain to avoid making meaning too easy to get (which would threaten Rule 4 again). But compared to the alternative—your theory declaring that a bird saving its flock from a cat is acting on a meaningless signal—this is a bargain.
