answer: |-
  **Exam Question**

  Consider two cases: (a) A lab team splices a novel gene into a bacterium conferring antibiotic resistance. This lineage has no evolutionary history with the drug or the gene. (b) A whale's vestigial hip bone. It was historically selected for supporting hind limbs, but now supports nothing and contributes nothing to fitness.

  Apply both the selected-effects (etiological) and causal-role (systemic) accounts of function to *both* cases. Explicitly state whether each account attributes a function in each scenario. You will find the accounts diverge. Explain precisely how they diverge across these two cases. Finally, take a stand: Are these accounts competing theories about the same thing, or are they answering different explanatory questions? Defend your position. Do not simply summarize the views; you must resolve the tension.

  ***

  **Model Answer**

  In case (a), the causal-role account clearly attributes a function. The spliced gene currently contributes to the bacterium's capacity to survive antibiotic exposure. Within the current system, the gene plays a specific causal role that maintains the organism's viability. History is irrelevant to this assessment; only current contribution matters. The selected-effects account denies function here. Because the gene was not shaped by past selection pressures in this lineage, it lacks an etiological history. It is a novelty. Without a history of selection for antibiotic resistance, the selected-effects view cannot classify this trait as functional, regardless of its current utility. It is merely a useful accident.

  In case (b), the positions invert completely. The selected-effects account attributes function to the vestigial hip bone. The bone exists because ancestors were selected for having hind limbs; its history secures its functional status even if it is now vestigial. The trait was maintained by natural selection for a specific contribution, and that history defines its function. The causal-role account, however, denies function. The bone currently makes no causal contribution to the whale's survival or reproduction. It is biologically inert in the current system. Since it does not contribute to the containing system's current capacity, it lacks function on this view. It is junk.

  This creates a perfect cross-over. Selected-effects says yes to history (whale) but no to novelty (gene). Causal-role says yes to current utility (gene) but no to vestiges (whale). They do not merely disagree on edge cases; they swap verdicts entirely based on whether the analysis looks backward to origins or forward to current capacity. This inversion proves the definitions are not capturing the same phenomenon.

  Are these accounts competing theories about the same concept? No. They are answering different explanatory questions. The selected-effects account answers "Why is this trait here?" It explains presence via history. The causal-role account answers "What does this trait do now?" It explains current capacity via contribution. When a journalist writes "the function of X is Y," they must decide if they are explaining the trait's origin or its current utility. In case (a), a journalist explaining the bacterium's current survival needs the causal-role view. In case (b), a journalist explaining why the bone hasn't disappeared needs the selected-effects view. Treating them as competing definitions of a single concept creates unnecessary conflict. They are distinct tools for distinct explanatory jobs. The conflict arises only when we demand one word, "function," do both jobs simultaneously. Science journalists must therefore specify whether they refer to current utility or evolutionary history to avoid misleading neutrality. If a writer claims "the function of the hip bone is locomotion" without qualification, they are false on the causal-role view and misleading on the selected-effects view. The "neutral statement" is impossible because the word "function" smuggles in a theoretical commitment. By recognizing these accounts answer different questions, writers can stop pretending neutrality exists. They should write "the current role is..." or "the evolutionary function was..." This precision prevents the error of treating novel traits as adaptations or vestiges as useless junk without justification. The divergence isn't a problem to solve, but a distinction to maintain. This directly addresses the seminar's core goal: stopping the use of "function" as a neutral descriptor.

  ***

  **Marking Scheme**

  **Top Marks (A-range):**
  1.  **Correct Inversion:** Explicitly states Selected-Effects (SE) denies function in (a) but affirms in (b), while Causal-Role (CR) affirms in (a) but denies in (b).
  2.  **Specific Application:** Links SE to history/selection and CR to current contribution/system capacity within the specific cases.
  3.  **Defended Stand:** Takes a clear position on whether views compete or differ (e.g., "different questions") and justifies it using the case analysis.
  4.  **No Shrugging:** Avoids concluding that "both have merits" without resolving the conceptual tension.

  **Costly Mistakes:**
  1.  **View Swapping:** Attributing historical reliance to CR or current utility to SE.
  2.  **The Whale Error:** Claiming SE denies function in the whale bone (it preserves history).
  3.  **The Gene Error:** Claiming CR denies function in the novel gene (it assesses current capacity).
  4.  **The Shrug:** Concluding the views are "both right" without explaining *why* they diverge (e.g., failing to identify they answer different questions).
  5.  **Irrelevant History:** Discussing specific philosophers or readings instead of the logic of the cases.
