answer: |-
  1. **The Deductive Limit Reading**
     *Thesis:* The observation that evidence has not been found does not logically entail that the claim is false.
     *Verdict:* Platitude.
     *Support:* This is a truth of formal logic: from $\neg \text{Observed}(X)$, one cannot validly deduce $\neg \exists X$ without auxiliary premises about the completeness of the observation. If "evidence" is equated with "deductive proof," the slogan is trivially true, but it sets a bar for knowledge that is impossibly high for empirical inquiry, where we deal in probabilities rather than certainties.

  2. **The Statistical Power Reading**
     *Thesis:* A failure to reject the null hypothesis does not justify accepting the null hypothesis as true.
     *Verdict:* Substantive and Defensible.
     *Support:* In frequentist statistics, a non-significant result ($p > \alpha$) indicates only that the data are not sufficiently improbable under the null; it does not confirm the null. This holds strictly when the statistical power of the test is low or unspecified. If the sample size is too small to detect the effect size of interest, the absence of a signal is genuinely uninformative regarding the presence of the effect.

  3. **The Likelihood Equality Reading**
     *Thesis:* Absence of evidence is only non-evidence if the probability of finding nothing is equal whether the hypothesis is true or false.
     *Verdict:* Substantive and Defensible.
     *Support:* On a Bayesian account, evidence is defined by a likelihood ratio. If $P(\text{No Evidence} | H) = P(\text{No Evidence} | \neg H)$, then the posterior probability equals the prior, and the absence updates nothing. This reading saves the slogan from falsity by restricting its scope to cases where the search method is equally likely to come up empty regardless of the state of the world.

  4. **The Dialectical Shield Reading**
     *Thesis:* The burden of proof rests entirely on the claimant, and the skeptic is under no obligation to produce counter-evidence to dismiss a claim.
     *Verdict:* Substantive but False.
     *Support:* While the burden of proof generally lies with the affirmative claimant, this reading falsely assumes the burden never shifts. In mature inquiries where a claim predicts observable phenomena, a sustained, high-power failure to observe those phenomena *does* shift the dialectical burden back to the claimant to explain the discrepancy. Treating the slogan as a permanent shield ignores the epistemic weight of repeated null results.

  5. **The Immunizing Strategy Reading**
     *Thesis:* The absence of evidence is itself predicted by the hypothesis (e.g., via suppression or rarity), thereby confirming the hypothesis rather than disconfirming it.
     *Verdict:* Self-Sealing.
     *Support:* This reading turns the slogan into a mechanism for unfalsifiability. If a hypothesis predicts that evidence will be hidden, destroyed, or inherently undetectable, then the absence of evidence is recycled as positive support. While sometimes legitimate (e.g., searching for a needle in a haystack vs. a needle in a vacuum), in conspiracy contexts this move often insulates the claim from any possible empirical refutation, rendering the hypothesis epistemically degenerate.

  ***

  ### Closing Analysis: The Argumentative Work in Your Thread

  To address your specific questions regarding the meaning of evidence, the conditions for absence, the burden of proof, and the specific move in your thread:

  **1. The Meaning of Evidence**
  For the slogan to be true, "evidence" must mean *conclusive proof* (Reading 1). For it to be false, "evidence" must mean *probabilistic confirmation* (Readings 3 and 4). In your thread, the term is being smuggled between these definitions. The speaker demands "proof of a negative" (a deductive standard) to defend against a request for "evidence" (a probabilistic standard). If we define evidence as a likelihood ratio greater than 1, the slogan is generally false: absence of evidence *is* evidence of absence, provided the search was sensitive enough to have found the evidence if it existed.

  **2. Absence as Evidence and Search Power**
  Absence becomes evidence of absence only when the search has **diagnostic power**. This requires specifying the space of alternatives. If the hypothesis $H$ predicts evidence $E$ with high probability ($P(E|H) \approx 1$), then $\neg E$ strongly disconfirms $H$. However, if the space of alternatives is left unspecified or the "catch-all" hypothesis is stretched (e.g., "the evidence exists but is in a dimension we can't see" or "was destroyed by a perfect cover-up"), the likelihood ratio collapses. In your thread, the claim likely relied on an unspecified catch-all that allowed the absence to remain neutral. When a hypothesis predicts scarcity or suppression, missing evidence can be recycled as positive evidence (Reading 5), but only if the claim of suppression is independently testable. If the suppression is posited *solely* to explain the missing evidence, the reasoning is circular and self-sealing.

  **3. The Burden of Proof and Closing Discussion**
  Invoking the slogan often attempts to freeze the burden of proof permanently on the skeptic. This is a conversational foul. In a healthy epistemic exchange, the burden shifts as the search space is constrained. If an institution is accused of a cover-up, and exhaustive, high-power audits find nothing, the absence of records becomes evidence against the cover-up. To declare the question "closed" on the grounds that a negative cannot be proven is to misunderstand the cumulative weight of null findings. It licenses the claimant to retreat into a position where no amount of investigation could ever count against them.

  **4. Diagnosis of the Thread Move**
  The person in your thread was most likely relying on a conflation of **Reading 1 (Deductive Limit)** and **Reading 5 (Immunizing Strategy)**. They used the trivial truth that "you can't logically prove a non-existence" to justify the radical move that "therefore, my claim requires no defense against missing records." This is a reading the saying cannot support without equivocation. The slogan, properly understood (Reading 3), admits that absence *is* evidence if the search was powerful. By treating the search as inherently incapable of finding the truth (due to suppression or complexity), they smuggled in the Immunizing Strategy. They did not argue that the search lacked power; they argued that the *nature of the claim* placed it beyond the reach of the search. This is not a defense of the slogan; it is a misuse of the slogan to protect a hypothesis from the very Bayesian updating that absence of evidence should trigger.
