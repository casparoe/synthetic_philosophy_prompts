answer: |-
  ### Final Examination: Philosophy 605 — Later Wittgenstein & Epistemology

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. No secondary sources or citations are required; I am interested in your reasoning, not your bibliography. Quote or paraphrase Wittgenstein only where it does direct argumentative work.

  **The Prompt:**

  Consider a structural biologist who treats the output of a specific class of instruments as beyond question. She does not doubt the readings, seeks no independent confirmation, and regards a colleague demanding justification as misunderstanding research practice. This attitude is not naïve; it was formed over years of reliable performance and training in calibration. Pressed, she could reconstruct an inductive argument for her confidence. Thus, the proposition *"This class of instruments is reliable"* appears justifiable, yet in her practice, it functions as Wittgenstein says a hinge functions: she does not believe it on the strength of evidence, but thinks and works *from* it.

  This case creates tension with *On Certainty* §204: *"Giving grounds, however - justifying the evidence - comes to an end. But the end is not certain propositions' striking us immediately as true, i.e. it is not a kind of seeing on our part; it is our acting which lies at the bottom of the language-game."* A hinge acquired through evidence and reasoning—a **scaffolded hinge**—appears to sit awkwardly with the claim that the end of justification is *acting* rather than *seeing* (or evidential assessment).

  **In a coherent essay, address the following:**

  1.  **Distinction:** State as sharply as possible what distinguishes a hinge proposition from an ordinary empirical hypothesis, using the biologist case to test the distinction. Identify exactly where the analogy between her instrument-trust and a standard hinge strains.
  2.  **Assessment:** Decide whether the existence of scaffolded hinges refutes the claim that hinges are exempt from rational assessment, or whether the hinge epistemologist can absorb them. Defend your verdict against the strongest objection you can construct.
  3.  **Normativity:** Address the normative consequence. If some hinges are more defensible than others, say what within a broadly Wittgensteinian picture could underwrite that ranking without collapsing hinges back into hypotheses. If nothing can, say what that costs the view.

  ***

  ### Model Answer

  The distinction between a hinge and an empirical hypothesis is functional, not phenomenological. An empirical hypothesis is a move within a language-game; it is subject to verification or falsification based on rules already in place. A hinge is the rule itself, or rather, the scaffolding that allows the game to be played. In the biologist's case, *"This class of instruments is reliable"* functions as a hinge because it is the condition under which data becomes data. To doubt it during an experiment is not to be skeptical; it is to cease doing structural biology.

  However, the analogy strains because standard hinges (e.g., *"The earth has existed for many years"*) are typically viewed as pre-rational or animal certainties. The biologist's hinge is *post-rational*; it is the sediment of prior inquiry. The strain lies in the genealogy: a standard hinge looks like a starting point, whereas the instrument hinge looks like a stopping point. If the distinction relies on the *origin* of the certainty, the biologist's trust is merely a highly confirmed hypothesis. If the distinction relies on the *current logical role*, it remains a hinge. We must choose the latter. The status of a proposition is determined by how it is used now, not how it was acquired.

  This leads to the question of rational assessment. Do scaffolded hinges refute the exemption of hinges from justification? No, provided we interpret OC 204 correctly. Wittgenstein claims justification ends in *acting*, not that the acting is uncaused or ahistorical. The biologist's "acting" is her continued use of the instrument without hesitation. That this acting was caused by prior evidence is irrelevant to its current grammatical status. Once the proposition becomes a hinge, it is removed from the flux of testing. To treat it as a hypothesis again would require a new language-game (e.g., metrology rather than biology).

  The strongest objection here is the "Sleeping Dog" argument: if a hinge was formed by evidence, it remains vulnerable to new evidence. If the instrument suddenly fails, the biologist *will* reassess. Therefore, it was never a true hinge, only a provisional assumption. The hinge epistemologist must reply that the "riverbed" of thoughts shifts (OC 96-99). A proposition can move from the bed to the stream and back. Its status as a hinge is temporary but absolute while it holds. The exemption from assessment applies to the proposition *while it functions as a hinge*. To say it is "vulnerable" is to describe the moment it ceases to be a hinge. Thus, scaffolded hinges are absorbed by recognizing the fluidity of the system.

  Finally, the normative consequence. If hinges can be scaffolded, can we rank them? A crude empiricist ranking (more evidence = better hinge) collapses the distinction, turning hinges into super-hypotheses. A Wittgensteinian ranking must be pragmatic and systemic. We rank hinges by the stability and fruitfulness of the language-game they support. The biologist's hinge is "better" than a superstition not because it is more likely true in a correspondence sense, but because it sustains a practice that yields predictive power and coherence with other accepted systems (e.g., physics).

  This underwrites ranking without collapsing the distinction: we evaluate the *system* of hinges, not the individual propositions in isolation. The cost of this view is that we lose a transcendent notion of rationality. We cannot say the biologist is rational because she tracks truth; we say she is rational because her hinges hold her world-picture together effectively. If we cannot accept this pragmatic normativity, the view costs us the ability to criticize entrenched dogmas that function smoothly within their own isolated games. We are left with coherence but no leverage against a self-consistent madness. However, Wittgenstein suggests this is not a cost but a clarification: justification is internal to the form of life.

  ***

  ### Marking Scheme (20 Points Total)

  **Part 1: Distinction & The Biologist Case (6 Points)**
  *   **First-Class (5-6 pts):** Clearly articulates the functional/logical distinction (rule vs. move) rather than psychological certainty. Identifies the specific strain: the *genealogy* of the biologist's hinge (evidence-based) vs. the typical *ahistorical* presentation of hinges.
      *   *Characteristic Error:* Treating the hinge as simply a "very confident belief" or focusing on the biologist's feelings rather than the grammatical role of the proposition.
  *   **Competent (3-4 pts):** Identifies the difference between testing and assuming but fails to pinpoint where the case strains the standard exegesis (the historical/origin problem).
  *   **Weak (0-2 pts):** Recites standard hinge definitions without applying them to the specific details of the instrument case.

  **Part 2: Rational Assessment & Absorption (8 Points)**
  *   **First-Class (7-8 pts):** Correctly diagnoses that OC 204 refers to current *use*, not historical *origin*. Defends the absorption of scaffolded hinges by invoking the fluidity of the riverbed (OC 96-99). Constructs a genuine objection (e.g., "it's just a provisional assumption") and defeats it by distinguishing temporary status from permanent vulnerability.
      *   *Characteristic Error:* Claiming Wittgenstein forbids hinges from *ever* having had evidence, or conceding that scaffolded hinges refute the theory.
  *   **Competent (4-6 pts):** Argues that hinges are exempt from assessment but offers a circular defense ("because they are hinges"). Acknowledges the objection but resolves it by appealing to authority rather than argument.
  *   **Weak (0-3 pts):** Ignores the tension in OC 204 or argues that the biologist is simply irrational.

  **Part 3: Normativity & Cost (6 Points)**
  *   **First-Class (5-6 pts):** Proposes a pragmatic/systemic criterion for ranking (stability, fruitfulness, coherence of the system) that avoids turning hinges into hypotheses. Clearly articulates the cost (loss of transcendent rationality/leverage against isolated dogmas) if this fails.
      *   *Characteristic Error:* Collapsing into standard foundationalism (ranking by "truth likelihood") or radical relativism (no ranking possible at all).
  *   **Competent (3-4 pts):** Suggests we can rank hinges but relies on vague appeals to "success" without explaining how this differs from empirical confirmation.
  *   **Weak (0-2 pts):** Fails to address the normative question or claims there are no consequences for the view.

  **Total: 20 Points**
