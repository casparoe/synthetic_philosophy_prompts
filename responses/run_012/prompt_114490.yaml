          *   *Resolution:* It's not a fatal contradiction, but it needs clarification. The author needs to distinguish between *decision-guiding credences* (which we use) and *ontological frequencies* (which don't exist in the categorical case). The current phrasing suggests the number is useless, but the argument implies it should be discounted, not ignored.

      *   **3. Assumptions (Hidden Work):**
          *   *Assumption 1:* Sentience is a threshold property (binary). Biology is often continuous. If sentience is a spectrum, the categorical/distributional line blurs.
          *   *Assumption 2:* Moral value scales linearly with numbers (Total Utilitarianism). If one holds a critical-band view or prioritarianism, the scale argument fails regardless of uncertainty type.
          *   *Assumption 3:* "Credences in theories... are themselves incommensurable." This is a heavy epistemological claim. Why are they incommensurable? This needs qualification.
          *   *Assumption 4:* The "Restoration Reply" assumes risk neutrality. The author's resistance might actually be about risk aversion regarding moral error, not the probability itself.

      *   **4. Conclusion (Defense & Objection):**
