          *   *Categorical:* Sentience is a species-level trait (threshold property). Uncertainty is about the theory, not the individual.
      *   **Rebuttal to "Restoration Reply":** The reply says $0.3 \times \text{Population}$ works either way. The author says no, because credence in a theory isn't a frequency/fact probability; it's "bookkeeping convenience" and "incommensurable considerations."
