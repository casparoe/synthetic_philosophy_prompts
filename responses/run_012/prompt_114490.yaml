          *   *Refinement:* The strongest objection is likely that decision theory *requires* us to treat epistemic uncertainty *as if* it were distributional to avoid paralysis. If you reject the math in the categorical case, you lose the ability to act on *any* uncertain moral theory.

      *   **5. Concrete Suggestions:**
