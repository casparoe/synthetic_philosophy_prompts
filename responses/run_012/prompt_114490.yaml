      *   *Constraint Check:* Did I cite any papers? No. Did I follow the order? Yes.
      *   *Deep Dive on the Rebuttal:* I need to be careful here. The author's point seems to be that $P(\text{Theory}) \neq P(\text{Fact})$. In Bayesian terms, they are treated similarly for updating, but the author suggests they have different *moral* weight. Why? Perhaps because a theory being wrong means *zero* insects suffer, whereas distributional uncertainty means *some* definitely suffer. This is about variance/risk, not just expectation. I should point this out. The essay hints at this ("artifact of a probability") but doesn't explicitly name risk aversion or variance.

  5.  **Final Polish:** Organize into the requested sections. Ensure clear headings. Check word count and flow. (The resulting output will follow this structure.)

