answer: |-
  **Scenario**

  Consider Mary, a prolific writer who publishes literary fiction under her legal name "Mary" but writes popular thrillers under the pseudonym "Marian." She knows perfectly well that she is both Mary and Marian; there is no ignorance of identity. However, the literary guild has a rule: authors published under a specific name for more than five years are ineligible for the "Newcomer Award" *under that name*. Mary has published as "Marian" for six years, but only started publishing as "Mary" last year. When reviewing the rules, she sincerely assents to the sentence "Mary is eligible for the Newcomer Award" but sincerely dissents from "Marian is eligible for the Newcomer Award." She does not believe she is two different people, nor is she confused about the identity; she recognizes that the *eligibility conditions* attach to the public name-history, not merely the biological person.

  **The Check**

  **The Fregean** argues that this case validates the distinction between *sense* (Sinn) and *reference* (Bedeutung). While "Mary" and "Marian" share the same reference (the same woman), they possess different senses or modes of presentation. "Mary" presents the person as the private individual/new literary voice, while "Marian" presents the person as the established thriller brand. Because the senses differ, the propositions expressed by the two sentences differ. Therefore, assenting to one and dissenting from the other is rationally permissible; she is not believing a contradiction (P & ~P), but rather two distinct propositions with different truth values based on the name-relative rules.

  **The Millian (Direct-Reference Theorist)** must argue that since the names co-refer and the person knows the identity, the semantic content of both sentences is identical. Consequently, the person is technically believing a contradiction if she takes one to be true and the other false. To save her rationality, the Millian typically claims the dissent is pragmatic, not semantic. They would argue the predicate "is eligible" is context-sensitive or elliptical. "Marian is eligible" really means "Marian is eligible *under the name Marian*." The difference lies in the unspoken conversational context or the hidden indexical in the predicate, not in the names themselves. The names merely tag the object; the "work" is done by the implicit qualifications in the award rules.

  **The Description Theorist** would say that "Mary" and "Marian" are not genuine names but disguised descriptions. "Mary" means "the person born [X]" while "Marian" means "the author of the Thriller Series." Since the descriptions differ, the meanings differ, and the puzzle dissolves into a trivial case of non-identity between descriptions.

  **Feature Doing the Work**
  The crucial feature is the **normative history attached to the name**. The award rules treat the *name* as the bearer of the eligibility status, not just the human being. If you strip this feature out—for example, if the award rule was simply "Any human being who has not won before is eligible"—her dissent would vanish. She would assent to both, because the biological person hasn't won. The persistence of the dissent relies on the social/institutional practice of treating names as distinct agents for specific purposes.

  **Millian Attack**
  A sophisticated Millian would attack this by arguing that the scenario proves nothing about *semantic* content. They would claim the case shows that *belief states* are finer-grained than *propositions*. She stands in different cognitive relations to the same proposition because of the different causal chains associated with the names. They would insist that strictly speaking, the proposition <Mary, Eligibility> is identical to <Marian, Eligibility>, and her dissent is a failure to fully integrate the identity into her practical reasoning about the rules, or else the predicate "eligible" contains a hidden variable for "name-under-which-published."

  **Weakest Point & Self-Critique**

  My reasoning is weakest on the boundary between **semantics and pragmatics**. The Millian's move to treat "eligible" as implicitly containing "under name X" is powerful. If the award rules explicitly state "Eligibility is determined by the publishing name," then the difference in truth value is explained by the predicate's context-sensitivity, not the name's sense. In that case, the Fregean hasn't proven that the *names* contribute different content, only that the *context* does.

  The consideration that would make me change my verdict is if the dissent persisted even when the context explicitly ruled out name-relative conditions. For example, if the rule was "Any person who has not won," and she still dissented from "Marian has not won" while assenting to "Mary has not won." That would be pure irrationality or a psychological dissociation, not a semantic puzzle.

  A tweak that would flip the scenario to favor the Millian would be if the institution itself recognized the identity. If the Guild says, "We know Mary is Marian; you are ineligible period," and she still dissents, she is simply wrong about the facts. The case only works for the Fregean because the *institution* itself treats the names as distinct tracks. This suggests the "puzzle" might be externalist (about social records) rather than internalist (about cognitive sense), which weakens the claim that this is purely a problem about linguistic meaning rather than social ontology.
