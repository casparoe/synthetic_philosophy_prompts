  *Formulation:* It is wrong to voluntarily enter a financial transaction that sustains an industry predicated on harm (killing animals, carbon emissions), irrespective of whether that specific transaction causally influences the immediate level of harm.
  *Explains:*
  *   **V1 (Supermarket Beef):** She rejects the causal impotence defense ("order placed days ago"). The wrong is the participation in the market exchange itself.
  *   **V4 (Humane Beef):** Even if welfare is improved, the industry is still predicated on killing; market participation remains wrong.
  *   **V7 (Flying):** Explains why frequent flying is indefensible (sustains the industry).
  *   *Strains:*
  *   **V7 (One Flight):** Requires an exception for "fair share" or "necessity" to explain why one flight is permissible.
  *   **V6 (Voting):** Voting is not a market transaction, so this principle is silent, requiring a separate rule for civic duties.

  **Principle 2: The Sunk-Cost and Social Exception**
  *Formulation:* It is permissible to consume harm-linked goods if the harm is already incurred (sunk cost) *and* refusing to consume would result in waste or social friction without reducing future harm.
  *Explains:*
  *   **V2 (Binned Burger):** The housemate bought it; the cost is sunk. Refusal creates waste.
  *   **V5 (Dinner Guest):** The host bought it; the cost is sunk. Refusal creates social friction.
  *   **V1 (Supermarket Beef):** *Strains here.* The beef is also "sunk" (order placed, cow dead), yet she says it is wrong. This principle alone cannot explain V1 unless we add a "Market vs. Private" distinction.
  *   **V6 (Voting):** Fits loosely (not voting doesn't cause harm), but doesn't capture her reasoning about probability.

  **Principle 3: The Causal Probability Threshold**
  *Formulation:* An agent is responsible for a harm only if their action has a non-negligible probability of making a difference to the outcome.
  *Explains:*
  *   **V6 (Voting):** She explicitly cites the low probability of deciding the seat.
  *   **V5 (Dinner Guest):** She cites the host's independent decision ("host would have bought the same").
  *   **V7 (Flying):** One flight's climate impact is negligible; frequent flying crosses a threshold of noticeable impact.
  *   *Strains:*
  *   **V1 (Supermarket Beef):** This is the critical failure. She admits the causal impact is negligible (order placed, burger will be bought by another), yet she maintains the act is *wrong*. This principle predicts she should be indifferent, but she is not.

  ### (b) Predictions for the Fish Case

  **The Case:** Buying frozen fish from a capped fishery. Market transaction = Yes. Causal impact on deaths = Zero (cap is binding). Harm is sunk (fish already dead).

  *   **Prediction via Principle 1 (Market Complicity):** **Wrong.**
      *   *Reasoning:* You are entering a financial transaction with an industry predicated on killing. The fact that the catch is capped does not change the nature of the exchange: money for dead animal. This aligns with V1 (Supermarket Beef) and V4 (Humane Beef). The "cap" is a regulatory detail; the "purchase" is the moral act.
  *   **Prediction via Principle 2 (Sunk-Cost):** **Permissible.**
      *   *Reasoning:* The fish are already dead and frozen. Your purchase does not cause a death (cap is binding). Refusing might lead to waste (fish unsold). This aligns with V2 (Binned Burger).
  *   **Prediction via Principle 3 (Causal Threshold):** **Permissible.**
      *   *Reasoning:* The probability that your purchase causes a death is zero. This aligns with V5 (Guest) and V6 (Voting).

  *Where they come apart:* Principle 1 focuses on the **nature of the exchange** (Market + Harmful Industry). Principles 2 and 3 focus on the **consequences of the exchange** (Deaths/Waste). Since the fish case isolates these variables (Market Yes, Causal Impact No), the verdict depends entirely on whether she prioritizes Complicity or Consequences in market contexts.

  ### (c) Best Guess and Confidence

  **Verdict:** She will say buying the fish is **wrong** (or at least "not permissible," perhaps "less bad than beef but still to be avoided").

  **Principle at Work:** **The Market Complicity Constraint (Principle 1).**

  **Confidence:** **High (85%).**

  **Reasoning:**
  The strongest signal in her record is **V1 (Supermarket Beef)**. In that case, she is presented with the exact same causal structure as the Fish case: the harm is done (cow killed), the supply is fixed (order placed), and her specific purchase will not change the immediate death count (burger sold to another or trashed). She explicitly rejects the causal defense ("unmoved by the fact").

  If she were a Causal Threshold thinker (Principle 3), V1 would be permissible. It is not.
  If she were a Sunk-Cost thinker (Principle 2), V1 would be permissible (the cow is dead). It is not.

  The distinction between V1 (Wrong) and V2/V5 (Permissible) is not *causal*; it is **relational**. In V2/V5, the transaction is private/social (housemate, friend). In V1 (and the Fish case), the transaction is commercial (supermarket, fishery). She appears to hold that commercial participation in a killing industry is intrinsically compromising, regardless of marginal impact. The "cap" on the fishery is analogous to the "weekly order" on the beef: a constraint on supply that renders the individual purchase causally impotent regarding deaths. Since she condemns the beef purchase despite the supply constraint, she should condemn the fish purchase despite the cap.

  The only variable that might shift her is V7 (Flying). She allows one flight. Is fish "necessary" like seeing family? Unlikely. Is it a "fair share"? Possibly, but V1 suggests a hard line on beef. Given V3 (Chicken is worse), she tracks deaths-per-calorie, but V4 (Humane Beef is still wrong) suggests the *killing* is the barrier, not just the efficiency. Fish involves killing. Market involves complicity. The prediction stands.

  ### (d) Discriminating Question

  To decisively test whether Principle 1 (Market Complicity) or Principle 2 (Sunk-Cost/Consequences) is doing the work, I would ask the following:

  **The Question:**
  *"Suppose the supermarket marks down a package of beef burgers to clear them before they expire tomorrow. They will be thrown out if not sold. The cows are already dead, and the store's next order depends on total sales volume, not this specific clearance item. Would you buy and eat that burger?"*

  **What the Answers Show:**
  *   **If she says "No" (Wrong):** This confirms **Principle 1 (Market Complicity)**. Even when the harm is 100% sunk and waste is guaranteed, she refuses to financially support the industry. This aligns with her V1 verdict and predicts she will reject the Fish.
  *   **If she says "Yes" (Permissible):** This confirms **Principle 2 (Sunk-Cost/Consequences)**. It shows she *does* care about causal impact and waste, but draws a line at "normal" market signaling (V1). If this is her view, my prediction on the Fish is wrong; she might accept the Fish because the cap makes it functionally identical to the "clearance" case (no new deaths).

  ### (e) Inconsistency in the Record

  There is a significant tension between **V1 (Supermarket Beef)** and **V6 (Voting)**.

  *   **In V1**, she rejects the "causal impotence" defense. She admits her purchase won't change the order/deaths, yet calls it wrong. She adopts a **non-consequentialist** stance (Complicity).
  *   **In V6**, she accepts the "causal impotence" defense. She admits her vote won't change the election, and calls abstaining permissible. She adopts a **consequentialist** stance (Expected Utility).

  **Analysis:**
  She treats **Consumer Ethics** as deontological (do not dirty your hands with the market) but **Civic Ethics** as consequentialist (do not bother if you can't change the outcome).

  **Resolution:**
  She is not necessarily irrational, but she is **sphere-inconsistent**. She likely views the market as a sphere of *agency* where one is responsible for what one *supports*, and the voting booth as a sphere of *efficacy* where one is responsible for what one *achieves*.

  **If forced to drop a verdict:**
  I would drop **V6 (Voting)**.
  *Why?* Her reasoning in V1, V4, and V7 forms a coherent web regarding *harm*. She consistently argues that we have duties to avoid participating in harmful systems (animal killing, climate change) even when our individual causal footprint is small (V1, V7). V6 is the outlier where she abandons this "participation" logic for "impact" logic. If she applied her V1 logic to voting ("By not voting, I participate in the erosion of democracy, regardless of the margin"), she would have voted. The V1 reasoning is more robust across her consumer verdicts; V6 looks like a rationalization for convenience.
