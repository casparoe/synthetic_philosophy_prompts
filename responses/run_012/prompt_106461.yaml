      *   B: "It's the Reference Class Problem."
      *   A: "Burden is on you to show correlation."
      *   B: "Burden is on you to show the sample space is valid."
      *   Example: $z=5$, $m=6$, $a=3$. Divisible by 3. Contradiction.

      *(Drafting the verdict...)*
      *   Focus on the distinction between *methodological utility* and *epistemic justification*. B wins because A conflates the two.

